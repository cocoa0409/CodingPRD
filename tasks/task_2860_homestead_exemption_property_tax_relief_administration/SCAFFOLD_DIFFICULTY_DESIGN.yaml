# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
#   Task: 2860 Homestead Exemption & Property Tax Relief Administration
#   Nine §0.5 rule_ids x 2 differentiated instances = 18 instances.
#   Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.7.
#   Every asserted money figure was computed by executing the §1.3 formula.
#   The logical clock default is 2026-08-01T00:00:00Z; chains that depend on
#   the clock set it explicitly through POST /_clock/set_current_utc.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: refund_gross_provisional_versus_net_final_on_retroactive_claim
        grounds:
          - calculations.retroactive_refund_amount
          - state_machines.RetroactiveClaim.PENDING_to_APPROVED
          - entities.RetroactiveClaim.fields.gross_refund_cents
          - entities.RetroactiveClaim.fields.offset_applied_cents
          - entities.RetroactiveClaim.fields.refund_interest_cents
          - entities.RetroactiveClaim.fields.total_payable_cents
          - validations[priority=21]
        distinguishing_aspect: |
          This dual-variant instance lives in the RetroactiveClaim refund-accounting domain: the
          same three eligible tax years yield gross_refund_cents 315000 under GROSS_PROVISIONAL at
          filing and total_payable_cents 332741 under NET_FINAL at approval, because NET_FINAL
          absorbs 6660 of outstanding recovery oldest-year-first and only then adds 24401 of
          statutory interest on the un-offset remainders.
        test_recipe:
          setup:
            - "ReliefProgram HOMESTEAD_BASIC (priority_rank 10, relief 2500 bps, ceiling 10000000, lookback 3 years, penalty 1000 bps, interest 500 bps/yr) and ReliefProgram AGRICULTURAL_USE (priority_rank 40, relief 3000 bps, ceiling 15000000, lookback 5 years, penalty 800 bps, interest 300 bps/yr) exist."
            - "Parcel P1 (base_year 2020, base_year_value 30000000, market 40000000, cap 200 bps, tax_year 2026) has capped_value_cents 33600000 and assessed_value_cents 33600000. Parcel P7 (base_year 2026, base_year_value 1600000, market 2000000) has assessed_value_cents 1600000."
            - "TaxpayerAccount T holds a VERIFIED PRIMARY_RESIDENCE OwnershipRecord on P1 from 2019-06-01 (open ended, 10000 bps) and a VERIFIED AGRICULTURAL OwnershipRecord on P7 from 2019-06-01 (open ended, 10000 bps)."
            - "ExemptionGrant G1 (HOMESTEAD_BASIC on P1) is ACTIVE with benefit_amount_cents 8400000 and first_eligible_tax_year 2019; ExemptionGrant G2 (AGRICULTURAL_USE on P7) had benefit_amount_cents 480000."
            - "A FraudCase on G2 covering improper years 2025..2025 with assessment_tax_year 2026 has been SUBSTANTIATED, so its recovery_status is ASSESSED with total_assessed_cents 6660 and recovery_paid_cents 0; G2 is REVOKED and T is BARRED. G1 is untouched and still ACTIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /relief-programs"
              payload: { program_code: "AGRICULTURAL_USE", name: "Agricultural Use", relief_pct_bps: 3000, max_exempt_value_cents: 15000000, statutory_lookback_years: 5, penalty_pct_bps: 800, interest_pct_bps_per_year: 300, priority_rank: 40 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_a_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /parcels"
              payload: { apn: "P-0007", situs_address_normalized: "7 FARM RD SOUTHTON ST 10007", county_zone: "SOUTH", tax_year: 2026, base_year: 2026, base_year_value_cents: 1600000, market_value_cents: 2000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p7_id: $.data.id, p7_v: $.data.version }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2019-06-01", occupancy_type: "PRIMARY_RESIDENCE", occupancy_start_date: "2019-06-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p7_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2019-06-01", occupancy_type: "AGRICULTURAL", occupancy_start_date: "2019-06-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app1_id: $.data.id }
            - call: "POST /exemption-applications/${app1_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "DEED_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "DEED_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app1_id}/determine"
              payload: { outcome: "APPROVE", expected_parcel_version: "${p1_v}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { g1_id: $.data.resulting_grant_id }
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p7_id}", taxpayer_id: "${t_id}", program_id: "${prog_a_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app2_id: $.data.id }
            - call: "POST /exemption-applications/${app2_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-02-01", address_normalized: "999 ELM AVE SOUTHTON ST 10002" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app2_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-03-01", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app2_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app2_id}/verification-checks"
              payload: { source: "DEED_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "USPS_NCOA", record_effective_date: "2026-03-01", address_normalized: "999 ELM AVE SOUTHTON ST 10002" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app2_id}/verification-checks"
              payload: { source: "USPS_NCOA" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /income-certifications"
              payload: { taxpayer_id: "${t_id}", certification_year: 2026, household_income_cents: 5000000, countable_asset_cents: 1000000, household_size: 2, recertification_due_date: "2026-12-31" }
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "INCOME_DOR", record_effective_date: "2026-03-01", reported_income_cents: 9000000 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app2_id}/verification-checks"
              payload: { source: "INCOME_DOR" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "GET /parcels/${p7_id}"
              payload: {}
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { p7_v_now: $.data.version }
            - call: "POST /exemption-applications/${app2_id}/determine"
              payload: { outcome: "APPROVE", expected_parcel_version: "${p7_v_now}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { g2_id: $.data.resulting_grant_id }
            - call: "POST /fraud-cases"
              payload: { taxpayer_id: "${t_id}", grant_id: "${g2_id}", improper_start_tax_year: 2025, improper_end_tax_year: 2025, assessment_tax_year: 2026 }
              as: FraudInvestigator
              as_user_id: "investigator-01"
              captures: { case_id: $.data.id }
            - call: "POST /fraud-cases/${case_id}/decide"
              payload: { action: "SUBSTANTIATE", findings: "Registration address and postal forwarding both contradict the agricultural occupancy claim." }
              as: FraudInvestigator
              as_user_id: "investigator-01"
          trigger:
            - call: "POST /retroactive-claims"
              payload: { grant_id: "${g1_id}", filing_tax_year: 2026, requested_start_tax_year: 2023 }
              as: Taxpayer
              as_user_id: "${t_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /retroactive-claims/${claim_id}/decide"
              payload: { action: "APPROVE", note: "Three eligible years confirmed." }
              as: ExemptionsReviewer
              as_user_id: "reviewer-02"
          assert:
            - "RetroactiveClaim.${claim_id}.first_eligible_tax_year == 2023"
            - "RetroactiveClaim.${claim_id}.last_eligible_tax_year == 2025"
            - "RetroactiveClaim.${claim_id}.eligible_year_count == 3"
            - "GROSS_PROVISIONAL at filing: RetroactiveClaim.${claim_id}.gross_refund_cents == 315000 and offset_applied_cents == 0 and net_refund_cents == 0 and refund_interest_cents == 0 and total_payable_cents == 0"
            - "NET_FINAL after approval: RetroactiveClaim.${claim_id}.gross_refund_cents == 315000 (unchanged)"
            - "RetroactiveClaim.${claim_id}.offset_applied_cents == 6660"
            - "RetroactiveClaim.${claim_id}.net_refund_cents == 308340"
            - "RetroactiveClaim.${claim_id}.refund_interest_cents == 24401"
            - "RetroactiveClaim.${claim_id}.total_payable_cents == 332741"
            - "RetroactiveClaim.${claim_id}.status == APPROVED"
            - "FraudCase.${case_id}.total_assessed_cents == 6660 and recovery_paid_cents == 6660 and recovery_status == PAID"
            - "TaxpayerAccount.${t_id}.lifetime_refund_cents == 332741"
            - "TaxpayerAccount.${t_id}.lifetime_recovery_collected_cents == 6660"
            - "TaxpayerAccount.${t_id}.net_relief_cents == 326081"

      - name: fraud_risk_screening_snapshot_versus_adjudication_replay
        grounds:
          - calculations.fraud_risk_score
          - state_machines.FraudCase.OPEN_to_CLEARED
          - entities.FraudCase.fields.screening_risk_score
          - entities.FraudCase.fields.adjudication_risk_score
          - entities.VerificationCheck.fields.result
        distinguishing_aspect: |
          This dual-variant instance lives in the FraudCase risk-scoring domain, not the refund
          ledger: on one identical VerificationCheck log SCREENING_SNAPSHOT scores 35 (the latest
          VOTER_REGISTRY row is MATCH, so the address factor contributes 0) while
          ADJUDICATION_REPLAY scores 70 (the superseded MISMATCH row latches the 3500 bps address
          factor permanently).
        test_recipe:
          setup:
            - "ReliefProgram HOMESTEAD_BASIC exists (priority_rank 10, relief 2500 bps, ceiling 10000000)."
            - "Parcel P1 has assessed_value_cents 33600000; TaxpayerAccount T holds a VERIFIED PRIMARY_RESIDENCE OwnershipRecord on P1 from 2019-06-01."
            - "Application A1 for T on P1 is UNDER_REVIEW and carries five VerificationCheck rows in this order: VOTER_REGISTRY MISMATCH, VOTER_REGISTRY MATCH (registry corrected), DEED_REGISTRY MATCH, USPS_NCOA MISMATCH, INCOME_DOR MISMATCH against a PENDING IncomeCertification of 5000000 cents."
            - "A1 has been APPROVED, minting ACTIVE ExemptionGrant G1 with benefit_amount_cents 8400000; T owns exactly one HOMESTEAD_BASIC grant, so the multi-parcel factor is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0001", situs_address_normalized: "100 OAK ST NORTHFIELD ST 10001", county_zone: "NORTH", tax_year: 2026, base_year: 2020, base_year_value_cents: 30000000, market_value_cents: 40000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p1_id: $.data.id, p1_v: $.data.version }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "TERESA OWNER", date_of_birth: "1955-03-10", ssn_last4: "4321", mailing_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { t_id: $.data.id }
            - call: "POST /ownership-records"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", ownership_pct_bps: 10000, deed_recorded_date: "2019-06-01", occupancy_type: "PRIMARY_RESIDENCE", occupancy_start_date: "2019-06-01", source_system: "DEED_REGISTRY" }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
            - call: "POST /exemption-applications"
              payload: { parcel_id: "${p1_id}", taxpayer_id: "${t_id}", program_id: "${prog_h_id}", tax_year: 2026, claimed_occupancy_date: "2019-06-01", claimed_address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { app1_id: $.data.id }
            - call: "POST /exemption-applications/${app1_id}/submit"
              payload: {}
              as: IntakeClerk
              as_user_id: "clerk-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "999 ELM AVE SOUTHTON ST 10002" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { chk_voter_bad: $.data.id }
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "VOTER_REGISTRY", record_effective_date: "2026-02-10", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "VOTER_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { chk_voter_good: $.data.id }
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "DEED_REGISTRY", record_effective_date: "2026-01-05", address_normalized: "100 OAK ST NORTHFIELD ST 10001" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "DEED_REGISTRY" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "USPS_NCOA", record_effective_date: "2026-02-15", address_normalized: "999 ELM AVE SOUTHTON ST 10002" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "USPS_NCOA" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /income-certifications"
              payload: { taxpayer_id: "${t_id}", certification_year: 2026, household_income_cents: 5000000, countable_asset_cents: 1000000, household_size: 2, recertification_due_date: "2026-12-31" }
              as: IntakeClerk
              as_user_id: "clerk-01"
              captures: { cert_id: $.data.id }
            - call: "POST /_registry-records"
              payload: { taxpayer_id: "${t_id}", source: "INCOME_DOR", record_effective_date: "2026-02-20", reported_income_cents: 9000000 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /exemption-applications/${app1_id}/verification-checks"
              payload: { source: "INCOME_DOR" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
            - call: "POST /exemption-applications/${app1_id}/determine"
              payload: { outcome: "APPROVE", expected_parcel_version: "${p1_v}" }
              as: ExemptionsReviewer
              as_user_id: "reviewer-01"
              captures: { g1_id: $.data.resulting_grant_id }
          trigger:
            - call: "POST /fraud-cases"
              payload: { taxpayer_id: "${t_id}", grant_id: "${g1_id}", improper_start_tax_year: 2025, improper_end_tax_year: 2025, assessment_tax_year: 2026 }
              as: FraudInvestigator
              as_user_id: "investigator-01"
              captures: { case_id: $.data.id, screening: $.data.screening_risk_score }
            - call: "POST /fraud-cases/${case_id}/decide"
              payload: { action: "CLEAR", findings: "Registry record was corrected before the claim year." }
              as: FraudInvestigator
              as_user_id: "investigator-01"
          assert:
            - "FraudCase.${case_id}.screening_risk_score == 35"
            - "FraudCase.${case_id}.adjudication_risk_score == 70"
            - "FraudCase.${case_id}.screening_risk_score != FraudCase.${case_id}.adjudication_risk_score"
            - "FraudCase.${case_id}.investigation_status == CLEARED and recovery_status == NONE"
            - "FraudCase.${case_id}.total_assessed_cents == 0"
            - "ExemptionGrant.${g1_id}.benefit_status == ACTIVE and suspension_reason is null"
            - "Parcel.${p1_id}.exempt_value_cents == 8400000 and taxable_value_cents == 25200000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: benefit_ceiling_applied_before_ownership_proration_nested_min
        grounds:
          - calculations.exemption_benefit_amount
          - calculations.parcel_value_decomposition
          - state_machines.ExemptionApplication.UNDER_REVIEW_to_APPROVED
          - entities.ExemptionGrant.fields.benefit_amount_cents
          - entities.ExemptionGrant.fields.ownership_pct_bps_snapshot
        distinguishing_aspect: |
          Mode (a): a five-input non-linear formula whose value depends on nested min selection and
          a branch on program_code. With assessed_value_cents 62400000, relief 2500 bps, ceiling
          10000000 and ownership 3333 bps the pinned STEP-4-then-STEP-5 order yields
          benefit_amount_cents 3333000, whereas applying the ceiling after the pro-ration would
          yield 5199480 — the test asserts 3333000 and the absence of 5199480.
        test_recipe:
          setup:
            - "ReliefProgram HOMESTEAD_BASIC exists with relief_pct_bps 2500 and max_exempt_value_cents 10000000."
            - "Parcel P2 (base_year 2024, base_year_value 60000000, cap 200 bps, tax_year 2026, market 70000000) has capped_value_cents 62400000 and assessed_value_cents 62400000, so the statutory share 15600000 exceeds the program ceiling."
            - "TaxpayerAccount T holds a VERIFIED PRIMARY_RESIDENCE OwnershipRecord on P2 with ownership_pct_bps 3333 covering 2026-01-01."
            - "Application A1 is UNDER_REVIEW with the latest VOTER_REGISTRY and DEED_REGISTRY checks both MATCH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-01"
            - call: "POST /relief-programs"
              payload: { program_code: "HOMESTEAD_BASIC", name: "Basic Homestead", relief_pct_bps: 2500, max_exempt_value_cents: 10000000, statutory_lookback_years: 3, penalty_pct_bps: 1000, interest_pct_bps_per_year: 500, priority_rank: 10 }
              as: ProgramAdministrator
              as_user_id: "admin-01"
              captures: { prog_h_id: $.data.id }
            - call: "POST /parcels"
              payload: { apn: "P-0002", situs_address_normalized: "202 CEDAR LN EASTWICK ST 10002", county_zone: "EAST", tax_year: 2026, base_year: 2024, base_year_value_cents: 60000000, market_value_cents: 70000000, assessment_cap_pct_bps: 200 }
              as: AssessorAnalyst
              as_user_id: "analyst-01"
              captures: { p2_id: $.data.id, p2_v: $.data.version }
            - call: "POST /taxpayer-accounts"
              payload: { full_name: "FRANK COOWNER", date_of_birth: "1960-07-04", ssn_last4: "1111", mailing_address_normalized: "202 CEDAR LN EASTWICK ST 10002" }
              as: IntakeClerk
              as_user_id: "clerk-01"
