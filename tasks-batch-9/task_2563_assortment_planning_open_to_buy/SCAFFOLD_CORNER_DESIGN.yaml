            - "after post 2: plan_to_date 15,000,000, actuals 14,500,000, ${v2} == -333 and ${s2} == ON_PLAN - the verdict is allowed to improve as the base grows"
            - "after post 3: plan_to_date 22,500,000, actuals 21,700,000, ${v3} == -356 and ${s3} == ON_PLAN"
            - "after post 4 (a different month's first week): plan_to_date == round_half_up(30,000,000 * 3 / 4) + round_half_up(36,000,000 * 1 / 4) == 22,500,000 + 9,000,000 == 31,500,000, actuals 29,600,000, ${v4} == -603 and ${s4} == WATCH"
