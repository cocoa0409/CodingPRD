  - name: every_write_to_a_household_increments_its_version
    claim_type: optimistic_concurrency
    grounds: entities.Client.version; state_machines.Client PROSPECT -> ONBOARDED; endpoints.POST /clients/{id}/ledger-adjustments
      side_effects (increments Client.version)
    distinguishing_aspect: Four writes of three different kinds land on one household - creation, signature,
      countersignature and a ledger movement - and the version has to be 4 at the end, so a version that
      only tracks state transitions is detectably wrong.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      trigger:
      - call: POST /clients/${client_id}/ledger-adjustments
        as: BillingAdministrator
        payload:
          entry_type: MANUAL_ADJUSTMENT
          signed_amount_cents: 250000
          memo: Goodwill credit agreed with the household.
      asserts:
      - GET /clients/${client_id} as AgencyPrincipal read version == 3 after the countersignature in setup
      - the trigger returns 201 with balance_after_cents == 250000
      - GET /clients/${client_id} as BillingAdministrator now reads version == 4 with outstanding_balance_cents
        == 250000
      - status == ONBOARDED and confidentiality_agreement_status == COUNTERSIGNED are unchanged by the
        ledger write
