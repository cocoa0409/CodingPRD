        actor: system
        preconditions: []
        side_effects: []
      - from: REVISED
        to: EXPIRED
        trigger: "system (season settle sweep)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: EXPIRED
