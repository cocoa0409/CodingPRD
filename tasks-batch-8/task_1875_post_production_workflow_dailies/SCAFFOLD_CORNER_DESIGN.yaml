          rationale: "Already exercised by transitive_cascade instance."

      - name: pagination_with_filtering_interaction
        claim_type: pagination_with_filtering
        grounds: [response_envelope, endpoints]
        distinguishing_aspect: "GET /projects?status=SETUP&limit=2&offset=1 returns items 2-3 of the filtered set; has_more reflects remaining filtered items, not total table size."
