  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: messaging_allowance_nested_min_tier_floor
        grounds:
          - calculations.messaging_allowance
          - errors.ERR_MESSAGE_LIMIT_REACHED
          - validations[priority=10]
        distinguishing_aspect: "Mode (a): effective_cap = min(university.employer_daily_message_cap, floor(BASE_DAILY_CAP * TIER_MULTIPLIER_PERCENT[trust_tier] / 100)) combines 4 inputs (base cap, tier multiplier, university cap, sent_today) with a nested min and a tiered branch — ELEVATED employer (score 51) against university cap 10 yields floor(5*40/100)=2, so min(10,2)=2."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE (message cap 10). Student Sam ENROLLED, PUBLIC_TO_APPROVED_EMPLOYERS. Employer Globex: auto score 50 (STANDARD), analyst +1 -> 51 (ELEVATED), APPROVED, and EmployerApproval APPROVED at the university."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - &d_stu
              call: "POST /students"
              payload: { university_id: "${uni_id}", email: "sam@stateu.edu", full_name: "Sam Lee", major: "CS", graduation_year: 2027, work_authorization: "US_CITIZEN", profile_visibility: "PUBLIC_TO_APPROVED_EMPLOYERS" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
              captures: { stu_id: $.data.id }
            - &d_emp2
              call: "POST /employers"
              payload: { company_name: "Globex", website_domain: "globex.com", contact_email: "jobs@gmail.com" }
              as: Anonymous
              captures: { emp2_id: $.data.id, emp2_tok: $.data.domain_verification_token }
            - &d_emp2_verify
              call: "POST /employers/${emp2_id}/verify-domain"
              payload: { verification_token: "${emp2_tok}" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
            - &d_emp2_screen
              call: "POST /employers/${emp2_id}/screen"
              payload: { decision: "CLEAR", analyst_signal_adjustment: 1 }
              as: PlatformAdmin
              captures: { emp2_v: $.data.version }
            - &d_appr2
              call: "POST /employer-approvals"
              payload: { employer_id: "${emp2_id}", university_id: "${uni_id}" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
              captures: { appr2_id: $.data.id }
            - &d_appr2_ok
              call: "POST /employer-approvals/${appr2_id}/decide"
              payload: { decision: "APPROVE", expected_employer_version: "${emp2_v}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
          trigger:
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp2_id}", student_id: "${stu_id}", body: "Opportunity 1" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp2_id}", student_id: "${stu_id}", body: "Opportunity 2" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
            - call: "POST /outreach-messages"
              payload: { employer_id: "${emp2_id}", student_id: "${stu_id}", body: "Opportunity 3" }
              as: EmployerRecruiter
              as_user_id: "${emp2_id}"
              captures: { msg3_err: $.data.error_id }
          assert:
            - "messages 1 and 2 return 201 (sent_today 0 < 2 and 1 < 2)"
            - "message 3 returns 429 with msg3_err == ERR_MESSAGE_LIMIT_REACHED (sent_today 2 >= effective_cap 2)"
            - "effective_cap == min(10, floor(5*40/100)) == min(10, 2) == 2 — the tier branch, the floor, and the min all bind"
            - "GET /outreach-messages?employer_id=${emp2_id} returns exactly 2 rows"

      - name: outcome_report_per_major_rounding_order
        grounds:
          - calculations.outcome_report_rates
          - endpoints.GET_/universities/{id}/outcome-report
        distinguishing_aspect: "Mode (b): nested rounding order is pinned — per-major rates are rounded half-up to 4 dp FIRST (CS 1/3 -> 0.3333, BIO 5/6 -> 0.8333), then weighted-averaged by respondents and rounded again: 0.6666. The rejected alternative order (raw totals then one rounding) yields 0.6667. A different mode from messaging_allowance_nested_min_tier_floor."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE with the same 11-alumni CS/BIO fixture as outcome_rates_respondent_vs_cohort_denominators."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_cs1
            - *d_cs1_grad
            - *d_cs1_out
            - *d_cs2
            - *d_cs2_grad
            - *d_cs2_out
            - *d_cs3
            - *d_cs3_grad
            - *d_cs3_out
            - *d_cs4
            - *d_cs4_grad
            - *d_bio1
            - *d_bio1_grad
            - *d_bio1_out
            - *d_bio2
            - *d_bio2_grad
            - *d_bio2_out
            - *d_bio3
            - *d_bio3_grad
            - *d_bio3_out
            - *d_bio4
            - *d_bio4_grad
            - *d_bio4_out
            - *d_bio5
            - *d_bio5_grad
            - *d_bio5_out
            - *d_bio6
            - *d_bio6_grad
            - *d_bio6_out
            - *d_bio7
            - *d_bio7_grad
          trigger:
            - call: "GET /universities/${uni_id}/outcome-report"
              payload: {}
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
          assert:
            - "per_major is sorted major ASC: [0].major == BIO with rounded_rate == 0.8333; [1].major == CS with rounded_rate == 0.3333"
            - "placement_rate_respondent == 0.6666, i.e. round_half_up((0.3333*3 + 0.8333*6)/9, 4) == round_half_up(5.9997/9, 4)"
            - "placement_rate_respondent != 0.6667 (the raw-totals-then-round alternative ordering is wrong)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: employer_approved_under_review_cycle
        grounds:
          - state_machines.Employer.APPROVED_to_UNDER_REVIEW
          - state_machines.Employer.UNDER_REVIEW_to_APPROVED
          - calculations.fraud_risk_score
        distinguishing_aspect: "Employer.status cycles APPROVED -> UNDER_REVIEW -> APPROVED (not a linear pipeline): FLAG re-opens review on an approved employer and CLEAR closes it, recomputing fraud_risk_score each hop (25 -> 35 via FLAG_PENALTY, then 35 held)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Employer Acme APPROVED with fraud_risk_score 25, version 3."
          setup_api_calls:
            - *d_clock
            - *d_emp
            - *d_emp_verify
            - &d_emp_screen
              call: "POST /employers/${emp_id}/screen"
              payload: { decision: "CLEAR", analyst_signal_adjustment: 0 }
              as: PlatformAdmin
              captures: { emp_v: $.data.version }
          trigger:
            - call: "POST /employers/${emp_id}/screen"
              payload: { decision: "FLAG" }
              as: PlatformAdmin
              captures: { emp_v_flagged: $.data.version }
            - call: "POST /employers/${emp_id}/screen"
              payload: { decision: "CLEAR", analyst_signal_adjustment: 0 }
              as: PlatformAdmin
          assert:
            - "after FLAG: Employer.${emp_id}.status == UNDER_REVIEW and fraud_risk_score == 35 (25 + FLAG_PENALTY 10) and trust_tier == STANDARD"
            - "after CLEAR: Employer.${emp_id}.status == APPROVED again — the cycle closed — and fraud_risk_score == 35 (no second FLAG_PENALTY on CLEAR)"
            - "versions advance ${emp_v} -> ${emp_v_flagged} -> ${emp_v_flagged}+1 and screen_count == 3"

      - name: job_posting_published_paused_cycle
        grounds:
          - state_machines.JobPosting.PUBLISHED_to_PAUSED
          - state_machines.JobPosting.PAUSED_to_PUBLISHED
          - errors.ERR_POSTING_NOT_PUBLISHED
        distinguishing_aspect: "JobPosting.status cycles PUBLISHED -> PAUSED -> PUBLISHED on a different entity than the Employer cycle: while PAUSED an otherwise-perfect application is rejected with ERR_POSTING_NOT_PUBLISHED, and after resume the identical request succeeds — the gate follows the cycle position, not a one-way flag."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. University ACTIVE; student Sam (CS, 2027, US_CITIZEN, PUBLIC) ENROLLED; employer Acme APPROVED with APPROVED EmployerApproval; posting PUBLISHED (deadline 2026-12-01, requires RESUME)."
          setup_api_calls:
            - *d_clock
            - *d_uni
            - *d_uni_active
            - *d_stu
            - *d_emp
            - *d_emp_verify
            - *d_emp_screen
            - &d_appr
              call: "POST /employer-approvals"
              payload: { employer_id: "${emp_id}", university_id: "${uni_id}" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { appr_id: $.data.id }
            - &d_appr_ok
              call: "POST /employer-approvals/${appr_id}/decide"
              payload: { decision: "APPROVE", expected_employer_version: "${emp_v}" }
              as: CareerCenterAdmin
              as_user_id: "${uni_id}"
            - &d_post
              call: "POST /job-postings"
              payload: { employer_id: "${emp_id}", title: "SWE Intern", position_type: "INTERNSHIP", required_majors: ["CS"], min_graduation_year: 2026, max_graduation_year: 2028, accepted_work_authorizations: ["US_CITIZEN", "PERMANENT_RESIDENT"], required_documents: ["RESUME"], application_deadline: "2026-12-01T00:00:00Z" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
              captures: { post_id: $.data.id }
            - &d_post_submit
              call: "POST /job-postings/${post_id}/transition"
              payload: { to: "SUBMITTED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
            - &d_post_publish
              call: "POST /job-postings/${post_id}/transition"
              payload: { to: "PUBLISHED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "PAUSED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
            - call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sam-resume.pdf" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { paused_apply_err: $.data.error_id }
            - call: "POST /job-postings/${post_id}/transition"
              payload: { to: "PUBLISHED" }
              as: EmployerRecruiter
              as_user_id: "${emp_id}"
            - call: "POST /applications"
              payload: { student_id: "${stu_id}", job_posting_id: "${post_id}", submitted_documents: [{ doc_type: "RESUME", file_uri: "s3://docs/sam-resume.pdf" }] }
              as: Student
              as_user_id: "${stu_id}"
              captures: { app_id: $.data.id }
          assert:
            - "while PAUSED: apply returns 409 with paused_apply_err == ERR_POSTING_NOT_PUBLISHED"
            - "after the PAUSED -> PUBLISHED half-cycle: the identical apply returns 201 and Application.${app_id}.status == SUBMITTED"
            - "JobPosting.${post_id}.version == 5 (create 1, submit 2, publish 3, pause 4, resume 5)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and >= 2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: block_approval_cascades_postings_applications_interviews
        grounds:
