            - "Tutor ${tutor_id}.verification_status == VERIFIED (reinstated; still holds a VERIFIED credential)"

      - name: session_dispute_keeps_settlement_open
        claim_type: Valid Transition
        grounds: [state_machines.Session.REPORTED_to_DISPUTED, entities.Session.fields.settlement_status]
        distinguishing_aspect: "Disputing a REPORTED session moves delivery_status to DISPUTED and leaves settlement_status DELIVERED (does not auto-settle); no Settlement is created."
        test_recipe:
          setup: ["A delivered trial Session in delivery_status REPORTED, settlement_status DELIVERED."]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /commission-policies"
              payload: { name: "P1", tier_breakpoints_cents: [0, 100000, 1000000], tier_rates_bps: [2500, 1500, 800], trial_commission_bps: 5000, trial_max_billed_minutes: 30, refund_window_hours: 168 }
              as: PlatformAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /commission-policies/${policy_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /subjects"
              payload: { code: "MATH_ALG2", display_name: "Algebra 2", category: "STEM", requires_credential: false }
              as: PlatformAdmin
              captures: { subj_id: $.data.id }
            - call: "POST /tutors"
              payload: { email: "t1@x.com", full_name: "T One", base_hourly_rate_cents: 6000 }
              as: PlatformAdmin
              captures: { tutor_id: $.data.id }
            - call: "POST /credentials"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}", kind: "DEGREE", document_ref: "doc1" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { cred_id: $.data.id }
            - call: "POST /credentials/${cred_id}/start-review"
              payload: {}
              as: TrustOfficer
            - call: "POST /credentials/${cred_id}/verify"
              payload: {}
              as: TrustOfficer
            - call: "POST /subject-tags"
              payload: { tutor_id: "${tutor_id}", subject_id: "${subj_id}" }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { tag_id: $.data.id }
            - call: "POST /subject-tags/${tag_id}/approve"
              payload: {}
              as: TrustOfficer
            - call: "POST /parent-accounts"
              payload: { email: "p1@x.com", full_name: "P One" }
              as: ParentGuardian
              captures: { parent_id: $.data.id }
            - call: "POST /parent-accounts/${parent_id}/deposit"
              payload: { amount_cents: 100000 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
            - call: "POST /parent-accounts/${parent_id}/students"
              payload: { display_name: "Kid", grade_level: 9 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { student_id: $.data.id }
            - call: "POST /bookings"
              payload: { parent_account_id: "${parent_id}", student_id: "${student_id}", tutor_id: "${tutor_id}", subject_id: "${subj_id}", scheduled_start: "2026-06-02T10:00:00Z", planned_minutes: 30 }
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { booking_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookings/${booking_id}/deliver"
              payload: { actual_minutes: 30 }
              as: Tutor
              as_user_id: "${tutor_id}"
              captures: { session_id: $.data.id }
          trigger:
            - call: "POST /sessions/${session_id}/dispute"
              payload: {}
              as: ParentGuardian
              as_user_id: "${parent_id}"
              captures: { ds: $.data.delivery_status, ss: $.data.settlement_status }
          assert:
            - "Session ${session_id}.delivery_status == DISPUTED and settlement_status == DELIVERED"
            - "no Settlement exists for ${session_id}; Tutor ${tutor_id}.payout_balance_cents == 0"
