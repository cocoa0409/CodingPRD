              payload: { author_user_id: "intake-1" }
              as: IntakeNurse
              as_user_id: "intake-1"
              captures: { s_id: $.data.id, score: $.data.contraindication_score, outcome: $.data.outcome }
          assert:
            - "IntakeScreening.${s_id}.contraindication_score == 0"
            - "IntakeScreening.${s_id}.outcome == CLEARED"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_charge_visible_in_schedule_response
        claim_type: immediate
        grounds:
          - calculations.visit_charge_waterfall
          - entities.Appointment.fields.amount_charged_cents
        distinguishing_aspect: "amount_charged_cents is computed and visible in the same POST /appointments/{id}/schedule response (immediate consistency), equal to 17500 for a full-price cash MYERS lounge visit."
        test_recipe:
          setup: ["Clock 2026-06-22; MYERS LOUNGE; cash visit CLEARED+consented; supply present."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-22T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /menu-items"
              payload: { name: "Myers", tier: "MYERS", base_price_cents: 17500, requires_standing_order: false }
              as: ClinicAdmin
              captures: { myers_id: $.data.id }
            - call: "POST /lounges"
              payload: { name: "L1", bay_count: 2 }
              as: ClinicAdmin
              captures: { lounge_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_kind: "DRIP_BASE", tier_or_code: "MYERS", lot_number: "MY-1", units_total: 5, expires_at: "2026-12-31T00:00:00Z" }
              as: ClinicAdmin
            - call: "POST /patients"
              payload: { full_name: "Pat", date_of_birth: "1990-01-01T00:00:00Z" }
              as: ClinicAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pat_id}", menu_item_id: "${myers_id}", location_type: "LOUNGE", lounge_id: "${lounge_id}", start_at: "2026-06-23T09:00:00Z" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/intake"
              payload: { author_user_id: "intake-1" }
              as: IntakeNurse
              as_user_id: "intake-1"
            - call: "POST /consents"
              payload: { appointment_id: "${ap_id}", signed_by_patient: true, witness_user_id: "wit-1" }
              as: ClinicAdmin
            - call: "GET /appointments/${ap_id}"
              payload: {}
              as: ClinicAdmin
              captures: { ap_v: $.data.version }
          trigger:
            - call: "POST /appointments/${ap_id}/schedule"
              payload: { expected_appointment_version: "${ap_v}" }
              as: ClinicAdmin
              captures: { charge: $.data.amount_charged_cents }
          assert:
            - "Appointment.${ap_id}.amount_charged_cents == 17500"
