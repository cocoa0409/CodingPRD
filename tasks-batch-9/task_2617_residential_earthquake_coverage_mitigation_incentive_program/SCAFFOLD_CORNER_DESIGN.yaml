          assert:
            - "${admin_err} == \"ERR_UNAUTHORIZED\" with HTTP 403 - bind is ParticipatingInsurer-exclusive, so even the program administrator cannot issue coverage on an insurer's behalf"
            - "${insurer_err} == \"ERR_UNAUTHORIZED\", ${ph_err} == \"ERR_UNAUTHORIZED\", ${reviewer_err} == \"ERR_UNAUTHORIZED\", ${inspector_err} == \"ERR_UNAUTHORIZED\", ${adjuster_err} == \"ERR_UNAUTHORIZED\" and ${contractor_err} == \"ERR_UNAUTHORIZED\", each with HTTP 403"
            - "no probe returns any ERR_*_NOT_FOUND even though every path id is unallocated - priority 2 outranks priority 4"
            - "${admin_msg} is a non-empty human-readable string, so the envelope is still well formed on the 403 path"

      - name: missing_x_role_and_missing_x_user_id_headers_are_rejected
