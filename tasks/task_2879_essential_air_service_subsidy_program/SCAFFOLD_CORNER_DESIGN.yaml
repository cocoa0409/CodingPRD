            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
          trigger:
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1200000.06, term_months: 12, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eas/proposals/${p1_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
