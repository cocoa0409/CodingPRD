          assert:
            - "RepresentationAssignment.${asg2} created (adjacent half-open windows do not overlap)"
            - "err == ERR_WINDOW_OVERLAP (interior overlap rejected)"
      - name: remediation_period_regression
        grounds:
          - validations[priority=18]
          - entities.Office.fields.last_close_period
          - errors[ERR_CLOSE_PERIOD_REGRESSION]
        distinguishing_aspect: |
          Interval semantics: calendar-period monotonicity on the Office resource —
          closing YYYY-MM period P requires P strictly greater than the last closed
          period; equal or earlier periods are rejected, and there is no touching-
          endpoint acceptance (unlike the half-open assignment windows).
        test_recipe:
          setup:
            - "Office O1 with no prior closes"
          setup_api_calls:
            - call: "POST /tax/offices"
              payload: { name: "Office One", region_code: "CA" }
              as: ProgramAdmin
              captures: { off1: $.data.id }
