          setup:
            - "Two fair editions over the same dates, one ATTENDANCE_WEIGHTED and one REVENUE_WEIGHTED, each with its own stage."
            - "One artist per edition, both with base_draw_score 62.50, both booked VERSUS at guarantee 12500000 / split 0.85 / breakeven 6000000 on 2026-08-22."
            - "Each show carries one RESERVED scale (face 6295, facility 400, allotment 2000, unbundled) and sells exactly 1800 units ONLINE."
            - "Each advance is pushed into review by one zero-cost LIGHTING line and completed with that line and the seed STAGING line APPROVED, so approved_rider_cost_cents stays 0."
            - "Each settlement is FINAL with merch_gross_cents 900000 sold by the ARTIST, submitted by buyer-01 and approved by controller-01."
            - "Both settlements therefore hold net_pool_cents 7741968, giving sell_through_ratio 0.9000 and net_pool_per_seat_cents 3871."
