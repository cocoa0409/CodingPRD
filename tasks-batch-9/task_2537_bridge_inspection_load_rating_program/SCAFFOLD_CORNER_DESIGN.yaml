          assert:
            - "LoadRating.${lr_a_id}.rating_status == APPROVED with rating_factor_operating == 0.618, rating_factor_inventory == 0.477, operating_rating_tons == 22.2, inventory_rating_tons == 17.2, posting_required == true, posted_limit_tons == 17.0"
            - "LoadRating.${lr_b_id} is numerically better - rating_factor_operating == 1.000, operating_rating_tons == 36.0, posting_required == false - yet it is only DRAFT then SEALED"
            - "Bridge.${br_id}.governing_load_rating_id is still ${lr_a_id}; DRAFT and SEALED rows are excluded from the candidate set"
            - "Bridge.${br_id}.posting_required == true, posted_limit_tons == 17.0, operating_rating_tons == 22.2 - copied from ${lr_a_id}, not from the sealed row"
            - "Bridge.${br_id}.service_posture == POSTED"
            - "GET /load-ratings?bridge_id=${br_id}&rating_status=APPROVED returns exactly 1 row, id ${lr_a_id}, with total_count == 1"

      - name: inspection_compliance_pct_uses_strict_overdue_test_and_threshold_constant
        claim_type: constants_applied
        grounds:
          - calculations.inspection_compliance_pct
          - entities.FederalSubmission.fields.inspection_compliance_pct
          - state_machines.FederalSubmission.SUBMITTED_to_REJECTED
        distinguishing_aspect: "Three bridges with one past its due date give 100*2/3 = 66.67, and the overdue test is STRICT less-than: on the due date itself the bridge is still compliant. The 90.00 acceptance constant then drives rejection_reason_code COMPLIANCE_BELOW_THRESHOLD rather than DATA_GAPS."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z at creation. Bridge A (year_built 1972, adt 12000) takes the 24-month interval and is due 2028-09-01; bridges B and C (year_built 1995, adt 4000, default 7/7/7 seeds) take 48 months and are due 2030-09-01."
            - "One cycle, locked, with a BUILDING NBI_ANNUAL submission. Submitter admin-user-1; reviewer fhwa-user-1. No bridge is ever inspected, so no cascade perturbs the due dates."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
              captures: { br_a_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000002", name: "Willow Slough Bridge", owner_agency: "STATE_DOT", structure_type: "CONCRETE_BOX", deck_area_sqm: 600, year_built: 1995, adt: 4000, detour_length_km: 2.0 }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
              captures: { br_b_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000003", name: "Granite Ridge Overpass", owner_agency: "STATE_DOT", structure_type: "PRESTRESSED_GIRDER", deck_area_sqm: 800, year_built: 1995, adt: 4000, detour_length_km: 5.0 }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
              captures: { br_c_id: $.data.id }
            - call: "POST /program-cycles"
              payload: { fiscal_year: 2029, authorized_budget_cents: 10000000000, ranking_policy: "CONDITION_BASED" }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
              captures: { pc_id: $.data.id }
            - call: "POST /program-cycles/${pc_id}/federal-submissions"
              payload: { submission_type: "NBI_ANNUAL" }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
              captures: { fs_id: $.data.id }
            - call: "POST /program-cycles/${pc_id}/lock"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-user-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
            - call: "GET /bridges/${br_a_id}/compliance-summary"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-user-1"
              captures: { overdue_on_due_date: $.data.routine_overdue }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-09-02T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "admin-user-1"
          trigger:
            - call: "POST /federal-submissions/${fs_id}/submit"
              payload: {}
              as: ProgramAdmin
              as_user_id: "admin-user-1"
              captures: { pct: $.data.inspection_compliance_pct }
            - call: "POST /federal-submissions/${fs_id}/review"
              payload: { decision: "REJECT" }
              as: FhwaReviewer
              as_user_id: "fhwa-user-1"
              captures: { reason: $.data.rejection_reason_code }
          assert:
            - "The compliance-summary read taken at 2028-09-01T00:00:00Z reported routine_overdue == false for bridge A - the due date itself is compliant under the strict < test"
            - "The submit returns HTTP 200 with FederalSubmission.${fs_id}.total_bridge_count == 3 and overdue_inspection_count == 1 (only bridge A, now one day past due)"
            - "FederalSubmission.${fs_id}.inspection_compliance_pct == 66.67 (100*2/3 = 66.6666... round_half_up to 2dp)"
            - "FederalSubmission.${fs_id}.poa_noncompliant_count == 0, open_immediate_finding_count == 0, error_count == 0 - error_count is the sum of those two counters only and ignores the overdue bridge"
            - "The review returns HTTP 200 with status REJECTED and rejection_reason_code == COMPLIANCE_BELOW_THRESHOLD, because 66.67 is below the ACCEPTANCE_COMPLIANCE_THRESHOLD_PCT constant of 90.00"
            - "ProgramCycle.${pc_id}.status == LOCKED again with submitted_at cleared to null, so a corrected submission can be resent"

      - name: element_health_index_half_up_at_the_third_decimal
        claim_type: precision
        grounds:
          - calculations.element_health_index
          - entities.ElementCondition.fields.element_health_index
        distinguishing_aspect: "Two element rows pin the rounding rule exactly: 100*5/7 = 71.4285714 rounds to 71.43 (not truncated to 71.42) and 1300/32 = 40.625 rounds half-UP to 40.63 (banker's rounding would give 40.62)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; Ivy Inspector leads a DRAFT ROUTINE inspection of Cedar Creek Bridge. The indices are computed at element-write time, so no submit is needed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /personnel"
              payload: { full_name: "Ivy Inspector", agency: "STATE_DOT", nbis_refresher_expiry_date: "2027-06-30", team_leader_certified: true }
              as: ProgramAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              captures: { br_id: $.data.id }
            - call: "POST /bridges/${br_id}/inspections"
              payload: { inspection_type: "ROUTINE", team_leader_id: "${insp_id}", field_window_start: "2026-09-02T08:00:00Z", field_window_end: "2026-09-02T16:00:00Z" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ins_id: $.data.id }
          trigger:
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "DECK", element_group: "DECK_GROUP", unit: "SQM", total_quantity: 7, cs1_qty: 3, cs2_qty: 2, cs3_qty: 1, cs4_qty: 1, photo_count: 2, defect_notes: "Two deck panels with through-cracking" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_deck_id: $.data.id }
            - call: "POST /inspections/${ins_id}/element-conditions"
              payload: { element_key: "GIRDER", element_group: "SUPERSTRUCTURE", unit: "M", total_quantity: 32, cs1_qty: 7, cs2_qty: 5, cs3_qty: 5, cs4_qty: 15, photo_count: 9, defect_notes: "Widespread section loss along the fascia girder" }
              as: BridgeInspector
              as_user_id: "${insp_id}"
              captures: { ec_girder_id: $.data.id }
          assert:
            - "ElementCondition.${ec_deck_id}.element_health_index == 71.43 - raw 100*(3 + 1.6 + 0.4 + 0)/7 = 71.428571..., rounded up at the third decimal"
            - "ElementCondition.${ec_girder_id}.element_health_index == 40.63 - raw 100*(7 + 4 + 2 + 0)/32 = 40.625 exactly, and round_half_up carries the tie upward"
            - "Both rows report balanced == true with reported_sum 7 and 32 respectively"
            - "ElementCondition.${ec_deck_id}.deficient_quantity == 2 and ElementCondition.${ec_girder_id}.deficient_quantity == 20"
            - "Inspection.${ins_id}.element_count == 2, reported_quantity_total == 39, deficient_quantity_total == 22, photo_count_total == 11"

