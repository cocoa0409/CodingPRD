      - name: referential_beats_temporal_on_consult_booking
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_PROVIDER_NOT_ELIGIBLE]
          - errors[ERR_CONSULT_SLOT_CONFLICT]
        distinguishing_aspect: |
          Category pair business_referential versus business_temporal: a CA patient books the same
          window already held by an NY-only clinician, violating both the priority-10 licensure
          rule and the priority-11 buffer-overlap rule, and the response must be
          ERR_PROVIDER_NOT_ELIGIBLE with HTTP 422, never ERR_CONSULT_SLOT_CONFLICT with 409.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z."
            - "Clinician Dr Ray is licensed only in NY."
            - "NY patient Pia already holds a SCHEDULED consult with Dr Ray from 2026-06-03T15:00:00Z to 15:30:00Z."
