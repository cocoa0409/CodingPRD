      - name: odor_recovery_on_quiet_period_only
        claim_type: decay_function
        grounds: [calculations.odor_score_update, endpoints]
        distinguishing_aspect: "Recovery applies only when the closing period had zero confirmed odor events: period 1 with one LOW confirm yields no recovery (score stays 950); quiet period 2 recovers +50, capped at 1000."
        test_recipe:
          setup: ["plant; one LOW odor event confirmed in period 1 (score 950); period-1 settlement CLOSED"]
          setup_api_calls:
            - { call: "POST /rendering/plants", payload: { plant_name: "Plant A", location: "Dallas TX", cooker_capacity: 2, standard_cost_cents_per_lb: 38 }, as: PlantManager, captures: { plant_id: $.data.id } }
            - { call: "POST /rendering/odor-events", payload: { plant_id: "${plant_id}", reported_at: "2026-08-05T09:00:00Z", location_description: "Gate", severity: "LOW" }, as: ComplianceOfficer, as_user_id: "co-1", captures: { ev_id: $.data.id } }
            - { call: "POST /rendering/odor-events/${ev_id}/confirm", payload: {}, as: ComplianceOfficer, as_user_id: "co-2" }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=1", as: Any, captures: { st1: "$.data[0].id" } }
            - { call: "POST /rendering/period-settlements/${st1}/close", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
          trigger:
            - { call: "POST /rendering/plants/${plant_id}/advance-period", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "GET /rendering/plants/${plant_id}", as: Any }
            - { call: "GET /rendering/period-settlements?plant_id=${plant_id}&period_index=2", as: Any, captures: { st2: "$.data[0].id" } }
            - { call: "POST /rendering/period-settlements/${st2}/close", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "POST /rendering/plants/${plant_id}/advance-period", payload: {}, as: FinanceAnalyst, as_user_id: "fa-1" }
            - { call: "GET /rendering/plants/${plant_id}", as: Any }
          assert:
            - "After advance 1: current_period_index == 2, odor_score == 950 (period 1 had 1 confirmed event, no recovery), posture == OPERATING"
            - "Period-2 settlement exists, OPEN, confirmed_odor_events == 0"
            - "After advance 2: current_period_index == 3, odor_score == 1000 (min(1000, 950+50), cap applied)"

