  - section: errors
    instances:
      - name: error_catalog_covered_by_other_sections
        claim_type: violation_to_error
        grounds:
          - "errors"
        distinguishing_aspect: "Every error id in section 1.6 is triggered by at least one difficulty or corner instance in these two files (auth, not-found, state, safety, temporal, constraint, fiscal, OCC)."
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / fulfill_temporal_vs_fiscal
          rationale: "Error triggerability is distributed across the named difficulty instances and the validations section above; no standalone error-only recipe adds coverage."

