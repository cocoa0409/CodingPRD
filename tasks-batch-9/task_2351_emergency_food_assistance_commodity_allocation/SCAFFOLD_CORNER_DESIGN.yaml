  # ===========================================================================
  # Section 7 — RBAC (§1.7). Four roles, two of them entity-backed, plus the
  # segregation-of-duties pair that the recall and order machines enforce.
  # ===========================================================================
  - section: rbac
    instances:

      - name: missing_headers_are_unauthenticated_and_the_wrong_role_is_unauthorized
        claim_type: per-role access
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHORIZED
          - validations.priority_1
          - validations.priority_2
        distinguishing_aspect: "Authentication precedes authorisation and both precede existence: a header-less write is 401 even when the body is valid, a syntactically fine write by a role absent from the endpoint's list is 403 even when that role could read the same row, an unknown role string is also 403, and the single auth-exempt endpoint GET /efap/_clock/current still answers 200 with no headers at all."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; one ELIGIBLE agency so a valid AgencyCoordinator identity exists."
          setup_api_calls:
            - call: "POST /efap/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: StateAdmin
            - call: "POST /efap/service-areas"
              payload: { name: "Area North", county_code: "C001", poverty_population: 40000, urban_rural: "URBAN" }
              as: StateAdmin
              captures: { sa: $.data.id }
            - call: "POST /efap/agencies"
              payload: { name: "Agency Alpha", service_area_id: "${sa}", cold_storage_pallet_capacity: 10, prior_period_pounds_distributed: 120000, prior_period_allocated_cases: 400 }
              as: StateAdmin
              captures: { ag: $.data.id }
          trigger:
            - call: "POST /efap/commodities"
              payload: { code: "NOHDR", name: "No Header Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: StateAdmin
              captures: { e1: "$.data.error_id" }
            - call: "POST /efap/commodities"
              payload: { code: "WRONGROLE", name: "Wrong Role Rice", storage_class: "DRY", net_weight_lbs_per_case: 20.0, cases_per_pallet: 50, entitlement_value_cents_per_case: 1200, shelf_life_days: 900, excess_case_ceiling: 500 }
              as: AgencyCoordinator
              as_user_id: "${ag}"
              captures: { e2: "$.data.error_id" }
            - call: "POST /efap/agencies/${ag}/civil-rights-trainings"
              payload: { completed_at: "2026-07-01T00:00:00Z", attendee_count: 4 }
              as: StateWarehouseOperator
              as_user_id: "wh-unknown"
              captures: { e3: "$.data.error_id" }
            - call: "GET /efap/service-areas/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: AgencyCoordinator
              as_user_id: "${ag}"
              captures: { e4: "$.data.error_id" }
            - call: "GET /efap/_clock/current"
              payload: {}
              as: StateAdmin
          assert:
            - "first call sent with neither X-User-ID nor X-User-Role: HTTP 401 ERR_UNAUTHENTICATED and no Commodity with code NOHDR exists"
            - "second call (X-User-Role AgencyCoordinator, an unlisted role for POST /efap/commodities): HTTP 403 ERR_UNAUTHORIZED and no Commodity with code WRONGROLE exists"
            - "third call (X-User-Role StateWarehouseOperator on a ComplianceReviewer-only endpoint): HTTP 403 ERR_UNAUTHORIZED and Agency.${ag}.training_status == REQUIRED"
            - "a fourth variant of the third call carrying X-User-Role: Auditor (not one of the four declared roles): HTTP 403 ERR_UNAUTHORIZED"
            - "fourth call: HTTP 404 ERR_SERVICE_AREA_NOT_FOUND — an authorised reader gets existence, not authorisation, errors"
            - "fifth call sent with no headers at all: HTTP 200 with data.current_utc == 2026-08-01T00:00:00Z (the only auth-exempt endpoint)"

      - name: a_coordinator_cannot_touch_another_agencys_rows_and_an_operator_cannot_confirm_another_warehouse
        claim_type: entity-backed identity
        grounds:
          - errors.ERR_NOT_RESOURCE_OWNER
          - validations.priority_2
          - roles.AgencyCoordinator.identity
          - roles.StateWarehouseOperator.identity
        distinguishing_aspect: "Both entity-backed roles are scoped by X-User-ID rather than by role alone: coordinator Beta holds the right role for POST /efap/commodity-orders and for the distribution endpoint yet is refused with ERR_NOT_RESOURCE_OWNER on Alpha's allocation and on a body naming agency_id Alpha, and operator WH South is refused on an appointment belonging to WH North — while the legitimate owners succeed on the very same rows."
