            - "One DRAFT product and one DRAFT claim on that ingredient, with one DRAFT dossier holding a single peer-reviewed human RCT so the dossier readiness check at priority 33 is satisfied."
          setup_api_calls:
            - call: "POST /supplement-compliance/ingredients"
