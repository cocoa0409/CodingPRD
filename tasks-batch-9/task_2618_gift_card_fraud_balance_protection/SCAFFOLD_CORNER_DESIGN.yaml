            - "DrainingAlert.${alert_id}.triaged_by_user_id == analyst-49 — the triage record survives the round trip"
            - "GiftCard.${card_id}.risk_posture == CLEAR — DISMISS never froze the card, so reopening has nothing to undo"
            - "GiftCard.${card_id}.current_balance_cents == 9000"

      - name: denied_claim_is_terminal_and_rejects_further_decisions
        claim_type: terminal_state_lockdown
