  - rule_id: non_linear_state_machine
    instances:
      - name: challenge_rebuttal_round_cycle_exhaustion
        grounds:
          - state_machines.Challenge
          - entities.Challenge.fields.rebuttal_round
          - entities.Challenge.fields.rebuttal_deadline
          - validations.ERR_REBUTTAL_ROUND_EXHAUSTED
          - validations.ERR_REBUTTAL_DEADLINE_NOT_REACHED
        distinguishing_aspect: |
          Challenge is cyclic: REBUTTAL_OPEN -> UNDER_REVIEW -> REBUTTAL_OPEN can be walked more
          than once, each loop re-stamping rebuttal_deadline to clock.now + 30 days, and the loop
          terminates on a counter rather than on a state, so the third request-additional-evidence
          is refused with ERR_REBUTTAL_ROUND_EXHAUSTED while the challenge is still in the same
          UNDER_REVIEW state that accepted the previous two.
        test_recipe:
          setup:
            - "Program in CHALLENGE_OPEN with location L1 mapped SERVED (200/25 Mbps, 30 ms, FIBER)."
            - "COMMUNITY challenge on L1 with two accepted evidence items summing to 45.00, clearing the 40.00 community threshold and the 2-distinct-type rule."
          setup_api_calls:
            - call: "POST /broadband/programs"
              payload: { name: "BEAD Round 1", fiscal_year: 2026, total_appropriation_cents: 100000000, challenge_window_start: "2026-08-05T00:00:00Z", challenge_window_end: "2026-09-05T00:00:00Z", application_window_start: "2026-08-05T00:00:00Z", application_window_end: "2026-09-05T00:00:00Z", min_match_pct: 25.0, holdback_pct: 10.0, ehcl_threshold_cents: 2500000, ehcl_waiver_enabled: true }
