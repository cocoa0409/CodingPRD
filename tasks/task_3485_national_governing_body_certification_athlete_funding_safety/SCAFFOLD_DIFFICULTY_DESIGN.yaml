            - "P.tier == TIER_A and P.monthly_stipend_cents == 300000"
            - "Q.trailing_points == 128.25 (both variants are stored on every agreement)"
            - "Q.season_points == 60.0 (only the 2027-02-01 result falls in calendar year 2027)"
            - "Q.tier == TIER_B and Q.monthly_stipend_cents == 200000"
            - "identical result sets, divergent operative outputs: ${p_stip} != ${q_stip}"
  - rule_id: combinatorial_formula
    instances:
      - name: commercial_split_rounding_order
        grounds:
          - calculations.revenue_split
          - entities.CommercialDeal.fields.athlete_share_cents
          - concurrency_rules[deal-transition-stale-deal]
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned order rounds committee and NGB shares
          first and gives the athlete the remainder. On gross 999999 (NET_BASIS:
          fee 100000, base 899999) this yields athlete_share_cents == 269999, while
          the unpinned "round every share" order would yield 270000 — one cent apart.
        test_recipe:
          setup:
            - "CERTIFIED GoverningBody; ELIGIBLE athlete; PROPOSED NET_BASIS deal of gross_value_cents 999999 consented by the athlete"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
              payload: { name: "US Gymnastics", sport_code: "GYMN", funding_budget_cents: 5000000, sport_science_pool_hours: 100 }
              as: CommitteeAdmin
              captures: { gb_id: $.data.id }
            - call: "POST /api/governing-bodies/${gb_id}/certification-cycles"
              payload: { window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-01T00:00:00Z" }
              as: CommitteeAdmin
              captures: { cyc_id: $.data.id }
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "OPEN" }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "FINDINGS_ISSUED", governance_score: 90, athlete_rep_score: 88, financial_score: 92 }
              as: CertificationAuditor
              as_user_id: "aud-1"
            - call: "POST /api/certification-cycles/${cyc_id}/transitions"
              payload: { to_state: "CLOSED_PASSED" }
              as: CertificationAuditor
              as_user_id: "aud-2"
            - call: "POST /api/athletes"
              payload: { governing_body_id: "${gb_id}", full_name: "Dana Volt", date_of_birth: "2000-02-02", team_sport: false }
              as: CommitteeAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "SCREENING_CLEARED" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "TRAINING_CURRENT" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "ELIGIBLE" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/commercial-deals"
              payload: { sponsor_name: "Acme Watches", gross_value_cents: 999999, basis: "NET_BASIS", exclusivity_start: "2027-01-01T00:00:00Z", exclusivity_end: "2027-06-30T00:00:00Z" }
              as: CommitteeAdmin
              captures: { deal_id: $.data.id, deal_v: $.data.version }
            - call: "POST /api/commercial-deals/${deal_id}/transitions"
              payload: { to_state: "CONSENT_GRANTED", expected_deal_version: "${deal_v}" }
              as: Athlete
              as_user_id: "${a_id}"
              captures: { deal_v2: $.data.version }
          trigger:
            - call: "POST /api/commercial-deals/${deal_id}/transitions"
              payload: { to_state: "ACTIVE", expected_deal_version: "${deal_v2}" }
              as: CommitteeAdmin
              captures: { com: $.data.committee_share_cents, ngb: $.data.ngb_share_cents, ath: $.data.athlete_share_cents }
          assert:
            - "committee_share_cents == 270000 (round_half_up(899999 * 0.30) = round_half_up(269999.7))"
            - "ngb_share_cents == 360000 (round_half_up(899999 * 0.40) = round_half_up(359999.6))"
            - "athlete_share_cents == 269999 (remainder 899999 - 270000 - 360000; NOT round_half_up(899999*0.30) = 270000)"
            - "committee + ngb + athlete shares sum to exactly 899999 (no cent created or destroyed)"

      - name: quota_bonus_evaluation_order
        grounds:
          - calculations.quota_bonus
          - calculations.roster_composite_ranking
          - state_machines.Roster.DRAFT_to_NOMINATED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the bonus
          slot depends on entrants' season points, which are computed as of the trials
          year BEFORE the ranking runs; quota_slots 2 becomes quota_effective 3, so
          the 3rd-ranked athlete (A3) lands a PRIMARY slot that would not exist if the
          bonus were evaluated after ranking or skipped.
        test_recipe:
          setup:
            - "CERTIFIED body; four ELIGIBLE athletes with 2026-season VERIFIED results: A1=100 (1st/A + 1st/C), A2=80 (1st/A + 4th/C), A3=74 (2nd/A + 3rd/C), A4=36 (4th/C + 5th/C); top-3 sum 254 >= QUOTA_BONUS_THRESHOLD 250"
            - "procedure LOCKED, trials RESULTS_FINALIZED with scores A1=95, A2=90, A3=85, A4=80 against qualifying_score 80 (A4 qualifies at the boundary), quota_slots 2"
            - "empty DRAFT roster; logical clock 2026-12-20T00:00:00Z (trials_end 2026-12-17, season year 2026)"
          setup_api_calls:
            - call: "POST /api/governing-bodies"
