      - name: the_voluntary_exit_is_conditional_on_the_claim_inventory
        claim_type: conditional_action
        grounds:
          - endpoints[POST /plan/policies/{id}/voluntary-exit]
          - errors[ERR_OPEN_CLAIM_BLOCKS_EXIT]
          - errors[ERR_CLEAN_YEARS_INSUFFICIENT]
        excluded_because:
          difficulty_instance: voluntary_market_exit_depends_on_the_policys_live_claim_inventory
          rationale: "That instance runs the same exit request against the same policy three times - blocked by an OPEN claim, blocked by insufficient clean years, then allowed once both conditions hold - which is exactly the conditional-action claim for this endpoint, including the credit it posts."
  - section: errors
    instances:
      - name: the_fourth_non_renewal_of_a_period_is_refused_and_the_cap_resets_at_closure
        claim_type: error_triggerable
        grounds:
          - errors[ERR_NON_RENEWAL_QUOTA_EXCEEDED]
          - validations[priority=11][error_id=ERR_NON_RENEWAL_QUOTA_EXCEEDED]
          - entities.Carrier.fields.non_renewal_count_current_period
          - state_machines.PlanPeriod.transitions[OPEN->RECONCILING].side_effects
        distinguishing_aspect: |
          This is the only catalogue error whose sole trigger needs a carrier with four live policies,
          so it is easy to leave untriggered. The cap is per carrier per period and it is a running
          count, not a property of the policy being non-renewed: the fourth notice is refused while the
          first three stand, and the period closure that zeroes non_renewal_count_current_period makes
          the very same request succeed.
        test_recipe:
          setup:
            - "Clock at 2026-09-15. Atlas Mutual (9000 bps) and Beacon Casualty (1000 bps) are both licensed in T02."
            - "Four T02 PLEASURE ADULT applications were certified in intake order and all four were placed with Atlas: with total_assignable_units 4 the largest-remainder targets are Atlas 4 (exact 3.6, floor 3, plus the single leftover unit on the larger remainder 0.6) and Beacon 0, so Atlas is never overallocated and keeps posture OPEN through all four placements."
            - "All four policies AR-100014..AR-100017 are IN_FORCE for 2026-09-15..2027-09-15 with no complaints."
            - "Atlas has already served non-renewal notices on the first three, so non_renewal_count_current_period is 3 and three policies read NON_RENEWAL_PENDING."
