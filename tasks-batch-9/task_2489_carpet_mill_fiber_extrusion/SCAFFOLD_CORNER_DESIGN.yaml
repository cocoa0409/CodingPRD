      - name: runout_style_auto_discontinues_when_its_last_order_closes
        claim_type: bubble_up
        grounds:
          - state_machines.CarpetStyle.RUNOUT_to_DISCONTINUED
          - state_machines.CarpetStyle.ACTIVE_to_RUNOUT
          - state_machines.CutOrder.SUBMITTED_to_CANCELLED
        distinguishing_aspect: |
          discontinue only parks the style in RUNOUT while one RUNNING_LINE order is still open; the
          terminal DISCONTINUED is reached by the child's closure, evaluated on the cancel call
          itself — and the freed reservation drops the account's credit_used_cents back to 0.
        test_recipe:
          setup:
            - "ACTIVE style ST-SD-01 at 4275 cents/yard, Account AC-01 with a 100000000-cent limit, RUNNING_LINE CutOrder CO-01 for 100.0 yards in SUBMITTED."
          setup_api_calls:
            - call: "POST /mill/styles"
              payload: { style_code: "ST-SD-01", line_type: "RUNNING_LINE", gauge_code: "G_1_10", pile_construction: "CUT", pile_height_mm: 8.0, pattern_repeat_mm: 300.0, plies: 3, target_face_weight_oz: 32.00, dye_method: "SOLUTION_DYED", solution_color_code: "SC-BEIGE-01", list_price_cents_per_yard: 4275 }
              as: MillPlanner
              captures: { st: $.data.id }
            - call: "POST /mill/styles/${st}/activate"
              payload: {}
              as: MillPlanner
            - call: "POST /mill/accounts"
