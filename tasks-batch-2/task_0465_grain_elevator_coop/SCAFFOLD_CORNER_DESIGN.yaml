              payload: { member_id: "${mid}", commodity_id: "${cid}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { con: $.data.id }
            - call: "POST /commodities/contracts/${con}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${con}", storage_position_id: "${pos}", priced_bushels: 400, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { st1: $.data.id }
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${con}", storage_position_id: "${pos}", priced_bushels: 300, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { st2: $.data.id }
            - call: "GET /commodities/storage-positions/${pos}"
              payload: {}
              as: SettlementOfficer
              captures: { pv0: $.data.version }
            - call: "POST /commodities/settlements/${st1}/post"
              payload: { expected_storage_position_version: "${pv0}" }
              as: SettlementOfficer
          trigger:
            - call: "POST /commodities/settlements/${st2}/post"
              payload: { expected_storage_position_version: "${pv0}" }
              as: SettlementOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412 and data.error_id == ERR_STALE_VERSION"
            - "Settlement.${st2}.status == DRAFT (unchanged); StoragePosition.${pos}.bushels_available == 600.0000 (only the first post applied)"

      - name: meet_call_stale_hedge_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[meet-call-stale-hedge]", "errors[ERR_STALE_VERSION]", "endpoints.POST_/commodities/hedge-positions/{id}/meet-call"]
        distinguishing_aspect: "OCC on HedgePosition: a second mark advances the hedge version after the call figure was observed; a meet-call still carrying the pre-mark version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["A SHORT 3-contract hedge marked to 4.80 into MARGIN_CALL; version observed; then a benign-but-still-in-call second mark to 4.90 advances the version."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/hedge-positions"
              payload: { commodity_id: "${cid}", side: "SHORT", contracts: 3, entry_futures_price: 4.50 }
              as: RiskManager
              captures: { hp: $.data.id }
            - call: "POST /commodities/hedge-positions/${hp}/mark"
              payload: { mark_futures_price: 4.80 }
              as: RiskManager
            - call: "GET /commodities/hedge-positions/${hp}"
              payload: {}
              as: RiskManager
              captures: { hv_pre: $.data.version }
            - call: "POST /commodities/hedge-positions/${hp}/mark"
              payload: { mark_futures_price: 4.90 }
              as: RiskManager
          trigger:
            - call: "POST /commodities/hedge-positions/${hp}/meet-call"
              payload: { deposit_dollars: 9000, expected_hedge_position_version: "${hv_pre}" }
              as: RiskManager
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 412 and data.error_id == ERR_STALE_VERSION (mark advanced the version past hv_pre)"
            - "HedgePosition.${hp}.status == MARGIN_CALL (unchanged by the rejected meet-call)"

      - name: version_increments_on_grade_mutation
        claim_type: optimistic_concurrency
        grounds: [entities.ScaleTicket.fields.version, state_machines.ScaleTicket.WEIGHED_to_GRADED]
        distinguishing_aspect: "Every mutation bumps version by 1: a freshly created ScaleTicket has version 1; after grade it is version 2."
        test_recipe:
          setup: ["CORN commodity, member, one WEIGHED ticket (version 1)."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/members"
              payload: { name: "QQ Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk: $.data.id, v1: $.data.version }
          trigger:
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
              captures: { v2: $.data.version }
          assert:
            - "ScaleTicket.${tk}.version == 1 at create and == 2 after grade"

      - name: rate_threshold_margin_boundary_already_covered
        claim_type: rate_threshold_triggers
        grounds: [calculations.margin_mark_to_market]
        excluded_because:
          difficulty_instance: boundary_precision_check / margin_call_strict_less_than_maintenance_boundary
          rationale: "The strict-< maintenance threshold boundary (equity == maintenance does not trigger) is the named §1.8 boundary-precision instance."

      - name: cascade_depth3_settlement_already_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.Settlement.DRAFT_to_SETTLED, state_machines.StoragePosition.STORED_to_DEPLETED, state_machines.WarehouseReceipt.ISSUED_to_CANCELLED]
        excluded_because:
          difficulty_instance: transitive_cascade / settlement_post_depletes_position_cancels_receipt_depth3
          rationale: "The depth-3 settlement->position->receipt cascade is the named §1.8 transitive-cascade instance."

      - name: dual_variant_storage_charge_already_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.storage_charge.variants.estimate_forward_looking, calculations.storage_charge.variants.actual_chronological]
        excluded_because:
          difficulty_instance: dual_variant_calc / storage_charge_estimate_vs_actual_diverge_on_frozen_position
          rationale: "ESTIMATE vs ACTUAL storage-charge divergence is the named §1.8 dual-variant instance."

  # ===========================================================================
  # Section 9 — Consistency Model
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_settlement_post_reflects_all_cascades_in_response
        claim_type: immediate
        grounds: [state_machines.Settlement.DRAFT_to_SETTLED, entities.Member.fields.cash_paid_dollars, entities.StoragePosition.fields.bushels_available]
        distinguishing_aspect: "Immediate consistency: a single settlement post returns the SETTLED settlement, and an immediate re-read shows the position drawn down and the member ledger credited in the same request cycle (no lag)."
        test_recipe:
          setup: ["A 1000-bushel DELAYED_PRICE position; a PRICED 1000-bushel contract net 4.70; a DRAFT 1000-bushel ACTUAL settlement at clock 2026-02-15 (15 chargeable days, charge 7.50)."]
          setup_api_calls:
            - call: "POST /commodities"
              payload: { symbol: "CORN", test_weight_lbs_per_bushel: 56, base_moisture_pct: 15.0, shrink_pct_per_point: 1.4, drying_cents_per_point_per_bushel: 4 }
              as: Merchandiser
              captures: { cid: $.data.id }
            - call: "POST /commodities/price-boards"
              payload: { commodity_id: "${cid}", futures_price: 4.80, cash_basis: -0.10 }
              as: Merchandiser
            - call: "POST /commodities/members"
              payload: { name: "RR Farm" }
              as: Merchandiser
              captures: { mid: $.data.id }
            - call: "POST /commodities/scale-tickets"
              payload: { member_id: "${mid}", commodity_id: "${cid}", gross_weight_lbs: 72000, tare_weight_lbs: 16000, moisture_pct: 15.0, deposit_account_type: "DELAYED_PRICE", dockage_pct: 0 }
              as: GradeClerk
              captures: { tk: $.data.id }
            - call: "POST /commodities/scale-tickets/${tk}/grade"
              payload: {}
              as: GradeClerk
              captures: { pos: $.data.storage_position_id }
            - call: "POST /commodities/contracts"
              payload: { member_id: "${mid}", commodity_id: "${cid}", contract_type: "CASH", contracted_bushels: 1000 }
              as: Merchandiser
              captures: { con: $.data.id }
            - call: "POST /commodities/contracts/${con}/fix-price"
              payload: {}
              as: Merchandiser
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: Merchandiser
            - call: "POST /commodities/settlements"
              payload: { contract_id: "${con}", storage_position_id: "${pos}", priced_bushels: 1000, storage_basis: "ACTUAL" }
              as: SettlementOfficer
              captures: { st: $.data.id }
            - call: "GET /commodities/storage-positions/${pos}"
              payload: {}
              as: SettlementOfficer
              captures: { pv: $.data.version }
            - call: "POST /commodities/settlements/${st}/post"
              payload: { expected_storage_position_version: "${pv}" }
              as: SettlementOfficer
          trigger:
            - call: "GET /commodities/members/${mid}"
              payload: {}
              as: SettlementOfficer
          assert:
            - "Settlement.${st}.net_proceeds_dollars == 4692.50 (gross 4700.00 minus storage 7.50)"
            - "Member.${mid}.cash_paid_dollars == 4692.50 and net_priced_bushels == 1000 (visible immediately after post)"
            - "StoragePosition.${pos}.bushels_available == 0 and status == DEPLETED"
