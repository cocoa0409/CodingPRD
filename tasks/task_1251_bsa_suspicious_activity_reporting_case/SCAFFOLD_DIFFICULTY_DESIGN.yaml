  - rule_id: priority_pair_validation_conflict
    instances:
      - name: file_sar_state_beats_temporal
        grounds: ["validations[priority=6]", "validations[priority=17]", state_machines.SARReport.APPROVED_to_FILED, "errors[ERR_INVALID_STATE]", "errors[ERR_FILING_DEADLINE_PASSED]"]
        distinguishing_aspect: "Category pair {state, business_temporal}: filing a SAR that is still in DRAFT (state failure) at a clock time past its deadline (temporal failure) MUST return ERR_INVALID_STATE, because state (priority 6) outranks business_temporal (priority 17) — an implementation checking the deadline first returns the wrong error_id."
        test_recipe:
          setup:
            - "Case in SAR_IN_PROGRESS; SAR draft exists (never submitted to QA, so status == DRAFT) with deadline_at == 2026-05-31T00:00:00Z (detection 2026-05-01)"
            - "Logical clock advanced to 2026-06-05T00:00:00Z — past the deadline"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_v: $.data.version } }
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Unexplained structuring pattern", expected_case_version: "${c1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/sar-reports", payload: { activity_start_date: "2026-03-10", activity_end_date: "2026-04-10" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-05T00:00:00Z" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /sar-reports/${sar1}/file", as: BSAManager, as_user_id: "${mg1}", captures: { err: $.data.error_id } }
          assert:
            - "Response is 409 with error_id == ERR_INVALID_STATE — NOT 422 ERR_FILING_DEADLINE_PASSED, although the deadline has also passed"
            - "SARReport.${sar1}.status remains DRAFT; filed_at remains null; no ContinuingReview is created (GET /sar-reports/${sar1}/continuing-reviews returns empty)"

      - name: send_314b_safety_beats_temporal
        grounds: ["validations[priority=8]", "validations[priority=18]", state_machines.InfoShareRequest.DRAFT_to_SENT, "errors[ERR_LE_INQUIRY_OPEN]", "errors[ERR_CERTIFICATION_EXPIRED]"]
        distinguishing_aspect: "A DIFFERENT category pair {business_safety, business_temporal} than the state/temporal instance: sending a 314(b) share whose linked case has an OPEN law-enforcement inquiry (safety failure) while its certification is also expired (temporal failure) MUST return ERR_LE_INQUIRY_OPEN — safety (priority 8) outranks temporal (priority 18)."
        test_recipe:
          setup:
            - "Customer cu1 with case c1 (OPEN); LE inquiry for cu1 linked to c1, status UNDER_REVIEW (open)"
            - "InfoShareRequest isr1 (OUTBOUND to INST-9 about cu1, linked to c1) created at default clock 2026-05-01 with certified_at 2026-01-01T00:00:00Z -> certification_expires_at == 2027-01-01T00:00:00Z"
            - "Logical clock advanced to 2027-01-02T00:00:00Z — certification expired while the inquiry is still open"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /law-enforcement-inquiries", payload: { agency_name: "FBI", inquiry_reference: "LE-9001", subject_customer_id: "${cu1}" }, as: ComplianceAdmin, captures: { le1: $.data.id } }
            - { call: "POST /law-enforcement-inquiries/${le1}/link-case", payload: { case_id: "${c1}" }, as: ComplianceAdmin }
            - { call: "POST /info-share-requests", payload: { direction: "OUTBOUND", counterparty_institution_id: "INST-9", subject_customer_id: "${cu1}", case_id: "${c1}", certified_at: "2026-01-01T00:00:00Z", purpose_note: "Coordinate on suspected structuring" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { isr1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T00:00:00Z" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /info-share-requests/${isr1}/send", as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
          assert:
            - "Response is 409 with error_id == ERR_LE_INQUIRY_OPEN — NOT 422 ERR_CERTIFICATION_EXPIRED, although the certification has also expired"
            - "InfoShareRequest.${isr1}.status remains DRAFT and sent_at remains null"

  - rule_id: boundary_precision_check
    instances:
      - name: evaluate_threshold_amount_exact_boundary
        grounds: [calculations.scenario_trigger_evaluation, "endpoints.POST /monitoring-scenarios/{id}/evaluate"]
        distinguishing_aspect: "Amount metric boundary (>= inclusive) on the evaluate endpoint: aggregate exactly 1000000 cents with count 3 fires, 999999 cents does not; and 1100000 cents with count 2 does not fire (count >= 3 is a second inclusive boundary on the same trigger) — two exact-boundary probes on one metric family plus one on the count metric."
        test_recipe:
          setup:
            - "Scenario ACTIVE with ACTIVE threshold (amount 1000000, lookback 7, min_count 3); clock 2026-05-10T00:00:00Z; window (2026-05-03, 2026-05-10]"
            - "Account A1: 400000+400000+200000 = 1000000 exactly, 3 txns; Account A2: 400000+400000+199999 = 999999, 3 txns; Account A3: 600000+500000 = 1100000 but only 2 txns"
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-6101" }, as: ComplianceAdmin, captures: { acA1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-6102" }, as: ComplianceAdmin, captures: { acA2: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-6103" }, as: ComplianceAdmin, captures: { acA3: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-10T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-04T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-05T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA1}/transactions", payload: { amount_cents: 200000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-06T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA2}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-04T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA2}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-05T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA2}/transactions", payload: { amount_cents: 199999, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-06T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA3}/transactions", payload: { amount_cents: 600000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-04T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${acA3}/transactions", payload: { amount_cents: 500000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-05-05T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
          trigger:
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${acA1}" }, as: ComplianceAdmin, captures: { r1_created: $.data.alert_created, r1_agg: $.data.aggregate_amount_cents, r1_cnt: $.data.txn_count } }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${acA2}" }, as: ComplianceAdmin, captures: { r2_created: $.data.alert_created, r2_agg: $.data.aggregate_amount_cents } }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${acA3}" }, as: ComplianceAdmin, captures: { r3_created: $.data.alert_created, r3_agg: $.data.aggregate_amount_cents, r3_cnt: $.data.txn_count } }
          assert:
            - "A1 (aggregate == threshold exactly): alert_created == true, aggregate_amount_cents == 1000000, txn_count == 3 — the >= boundary fires"
            - "A2 (aggregate == threshold - 1 cent): alert_created == false, aggregate_amount_cents == 999999 — one cent below the inclusive boundary stays silent"
            - "A3 (aggregate 1100000 >= threshold but txn_count 2 < 3): alert_created == false — the count boundary is independently inclusive"

      - name: file_sar_deadline_instant_boundary
        grounds: [calculations.sar_filing_deadline, "validations[priority=17]", "endpoints.POST /sar-reports/{id}/file"]
        distinguishing_aspect: "Timestamp metric boundary on a DIFFERENT endpoint than the amount probe: filing at exactly the deadline instant (now == deadline_at, inclusive <=) succeeds, and one second later (now == deadline_at + 1s) fails with ERR_FILING_DEADLINE_PASSED."
