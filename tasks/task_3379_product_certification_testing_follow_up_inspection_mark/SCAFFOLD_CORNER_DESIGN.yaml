              as: CertificationBodyAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "response_type == 'error'"
            - "data.error_id == ERR_INVALID_REQUEST and data.message is a non-empty string"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: error_label_quota_exceeded_triggerable
        claim_type: violation_to_error
        grounds:
