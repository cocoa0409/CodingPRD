    side_effects: []

  - method: GET
    path: "/api/loaner-checkouts/{checkoutId}"
    description: "Flat alias for GET .../loaner-checkouts/{checkoutId}"
    roles: [DistrictAdmin, SiteTechnician, Family]
    code: 200
    input: []
    output: LoanerCheckout
    side_effects: []

  - method: GET
    path: "/api/insurance-policies/{policyId}"
    description: "Flat alias for GET .../insurance-policies/{policyId}"
    roles: [DistrictAdmin, Registrar, Family]
    code: 200
    input: []
    output: InsurancePolicy
    side_effects: []

  - method: GET
    path: "/api/family-agreements/{agreementId}"
    description: "Flat alias for GET .../family-agreement (1:1 by student)"
    roles: [DistrictAdmin, Registrar, Family]
    code: 200
    input: []
    output: FamilyAgreement
    side_effects: []

  - method: GET
    path: "/api/lifecycle-events/{eventId}"
    description: "Flat alias for a single AssetLifecycleEvent read"
    roles: [DistrictAdmin, SiteTechnician, Registrar]
    code: 200
    input: []
    output: AssetLifecycleEvent
    side_effects: []

  - method: GET
    path: "/api/audit-sweeps/{sweepId}"
    description: "Flat alias for GET .../audit-sweeps/{sweepId}"
    roles: [DistrictAdmin, SiteTechnician]
    code: 200
    input: []
    output: AuditSweep
    side_effects: []

  # FK reverse-reachability GETs (each FK needs either sub-resource or filtered list).
  # Sub-resources already present:
  #   GET /api/programs/{progId}/students                  (StudentAccount.program_id)
  #   GET /api/programs/{progId}/fleets                    (AssetFleet.program_id)
  #   GET /api/programs/{progId}/fleets/{fleetId}/asset-units (AssetUnit.fleet_id)
  #   GET /api/programs/{progId}/students/{studentId}/family-agreement (FamilyAgreement.student_account_id) — but output is single, change to list
  #   GET /api/programs/{progId}/students/{studentId}/insurance-policies (InsurancePolicy.student_account_id)
  #   GET /api/programs/{progId}/students/{studentId}/assignments (Assignment.student_account_id)
  #   GET /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports (DamageReport.assignment_id)
  #   GET /api/programs/{progId}/students/{studentId}/fees (FeeAssessment.student_account_id)
  #   GET /api/programs/{progId}/students/{studentId}/loaner-checkouts (LoanerCheckout.student_account_id)
  #   GET /api/programs/{progId}/asset-units/{assetId}/lifecycle-events (AssetLifecycleEvent.asset_unit_id)
  #   GET /api/programs/{progId}/audit-sweeps (AuditSweep.program_id)
  # Additional sub-resources / filtered lists for the remaining FKs:

  - method: GET
    path: "/api/programs/{progId}/students/{studentId}/asset-units"
    description: "Sub-resource: list AssetUnits currently assigned to a student (covers AssetUnit.assigned_to_student_id FK)"
    roles: [DistrictAdmin, Registrar, SiteTechnician, Family]
    code: 200
    input: []
    output: "AssetUnit[]"
    side_effects: []

  - method: GET
    path: "/api/programs/{progId}/asset-units/{assetId}/assignments"
    description: "Sub-resource: list Assignments referencing an AssetUnit (covers Assignment.asset_unit_id FK)"
    roles: [DistrictAdmin, Registrar, SiteTechnician]
    code: 200
    input: []
    output: "Assignment[]"
    side_effects: []

  - method: GET
    path: "/api/programs/{progId}/asset-units/{assetId}/loaner-checkouts"
    description: "Sub-resource: list LoanerCheckouts referencing an AssetUnit (covers LoanerCheckout.loaner_asset_unit_id FK)"
    roles: [DistrictAdmin, SiteTechnician]
    code: 200
    input: []
    output: "LoanerCheckout[]"
    side_effects: []

  # --- Test-driving endpoints (last-resort rung 3) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the server's logical clock. Server boots with current_utc := 2026-05-01T00:00:00Z; this endpoint is the only way to move it. Deterministic; never reads wall-clock."
    roles: [DistrictAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Server logical clock updated"
      - "Nightly-scan-style transitions fire if their preconditions now hold (Assignment → OVERDUE, LoanerCheckout → OVERDUE)"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-Role or X-User-ID header missing/invalid" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role is not permitted to invoke this endpoint" }

  # --- not found ---
  - { id: ERR_PROGRAM_NOT_FOUND, http: 404, condition: "progId does not resolve" }
  - { id: ERR_FLEET_NOT_FOUND, http: 404, condition: "fleetId does not resolve" }
  - { id: ERR_ASSET_NOT_FOUND, http: 404, condition: "assetId does not resolve" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "studentId does not resolve" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId does not resolve" }
  - { id: ERR_DAMAGE_REPORT_NOT_FOUND, http: 404, condition: "reportId does not resolve" }
  - { id: ERR_FEE_NOT_FOUND, http: 404, condition: "feeId does not resolve" }
  - { id: ERR_LOANER_CHECKOUT_NOT_FOUND, http: 404, condition: "checkoutId does not resolve" }
  - { id: ERR_POLICY_NOT_FOUND, http: 404, condition: "policyId does not resolve" }
  - { id: ERR_SWEEP_NOT_FOUND, http: 404, condition: "sweepId does not resolve" }

  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing / wrong type / enum value out of set" }
  - { id: ERR_REPAIR_COST_REQUIRED, http: 400, condition: "complete-repair requires repair_cost_cents" }
  - { id: ERR_IMAGE_VERSION_REQUIRED, http: 400, condition: "complete-reimage on a DEVICE requires image_version" }

  # --- concurrency ---
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match parent entity's current version" }

  # --- state ---
  - { id: ERR_PROGRAM_STATE_FORBIDS, http: 409, condition: "DistrictProgram.status does not permit the operation" }
  - { id: ERR_PROGRAM_HAS_NO_FLEET, http: 409, condition: "Cannot activate a program with zero AssetFleets" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state precondition failure (use specific error where available)" }
  - { id: ERR_STUDENT_NOT_ENROLLED, http: 409, condition: "Operation requires StudentAccount.status == ENROLLED" }
  - { id: ERR_STUDENT_SUSPENDED, http: 409, condition: "StudentAccount.financial_posture == SUSPENDED blocks new obligations" }
  - { id: ERR_AGREEMENT_NOT_SIGNED, http: 409, condition: "FamilyAgreement.signature_state != SIGNED" }
  - { id: ERR_OPEN_ASSIGNMENTS, http: 409, condition: "Student still has ACTIVE or OVERDUE Assignment rows" }
  - { id: ERR_FEES_OUTSTANDING, http: 409, condition: "StudentAccount.financial_posture != CLEAR blocks withdraw/graduate" }
  - { id: ERR_ASSET_NOT_READY, http: 409, condition: "AssetUnit.lifecycle_status != READY for checkout; or condition_grade == F" }
  - { id: ERR_LOANER_CONDITION_TOO_LOW, http: 409, condition: "designate-loaner requires condition_grade IN {A, B, C}" }
  - { id: ERR_LOANER_STILL_OUT, http: 409, condition: "return-loaner-to-pool while an OPEN LoanerCheckout references the unit" }
  - { id: ERR_LOANER_POOL_EXHAUSTED, http: 409, condition: "loaner_pool_allocation selector found zero eligible units" }
  - { id: ERR_LOANER_FLOOR_BREACH, http: 409, condition: "Allocation would drop pool below program-configured floor" }
  - { id: ERR_ACTIVE_POLICY_EXISTS, http: 409, condition: "Student already has an ACTIVE InsurancePolicy" }
  - { id: ERR_PENDING_APPEAL_BLOCKS_CANCEL, http: 409, condition: "Insurance cannot be cancelled while an appeal is pending on a tied report" }
  - { id: ERR_STILL_ASSIGNED, http: 409, condition: "dispose/donate requires AssetUnit.assigned_to_student_id IS NULL" }
  - { id: ERR_NOT_UNACCOUNTED, http: 409, condition: "write-off requires AssetUnit flagged UNACCOUNTED in a CLOSED AuditSweep" }
  - { id: ERR_EOL_CRITERIA_NOT_MET, http: 409, condition: "months_in_service < useful_life_months AND grade != F with two failed repairs" }
  - { id: ERR_REIMAGE_TEXTBOOK_NOT_ALLOWED, http: 409, condition: "begin-reimage on a TEXTBOOK fleet unit" }
  - { id: ERR_OVERDUE_UNRESOLVED, http: 409, condition: "begin-summer-collection requires no Assignment OVERDUE > 30d without NON_RETURN fee" }
  - { id: ERR_UNPROCESSED_SUMMER_INTAKE, http: 409, condition: "program close requires zero units in SUMMER_INTAKE or RE_IMAGING" }
  - { id: ERR_OPEN_AUDIT_SWEEP, http: 409, condition: "program close requires all AuditSweeps CLOSED" }
  - { id: ERR_SWEEP_IN_PROGRESS, http: 409, condition: "Another AuditSweep for this program is IN_PROGRESS or RECONCILING" }
  - { id: ERR_UNSCANNED_ASSETS_REMAIN, http: 409, condition: "finish-scan called while unscanned AssetUnits remain" }
  - { id: ERR_UNRESOLVED_UNACCOUNTED, http: 409, condition: "close called while UNACCOUNTED units remain unresolved" }

  # --- temporal ---
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "FeeAssessment older than 30 days cannot be appealed" }
  - { id: ERR_NOT_OVERDUE_LONG_ENOUGH, http: 409, condition: "declare-lost requires >=30d OVERDUE; escalate requires >=7d past loaner cap" }
  - { id: ERR_WRITE_OFF_TOO_EARLY, http: 409, condition: "Fee write-off requires >=180 days in ASSESSED status" }
  - { id: ERR_POLICY_YEAR_MISMATCH, http: 409, condition: "InsurancePolicy.academic_year must equal DistrictProgram.school_year" }

  # --- fiscal ---
  - { id: ERR_UNDERPAID, http: 422, condition: "settle requires paid_cents + waived_cents >= amount_cents" }
  - { id: ERR_WAIVER_NOT_ELIGIBLE, http: 422, condition: "waive requires StudentAccount.free_lunch_eligible == true" }
  - { id: ERR_WAIVER_FORBIDDEN_FOR_FEE_TYPE, http: 422, condition: "NON_RETURN fees cannot be waived" }

  # --- batch ---
  - { id: ERR_BATCH_REJECTED, http: 409, condition: "Atomic batch failed validation; nothing created" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictAdmin
    description: "District IT administrator — superset of all roles; owns program lifecycle, EOL/disposal, fee adjudication, audit sweep"
    identity: opaque
    exclusive_operations:
      - "POST /program"
      - "POST /api/programs/{progId}/activate"
      - "POST /api/programs/{progId}/begin-summer-collection"
      - "POST /api/programs/{progId}/close"
      - "POST /api/programs/{progId}/fleets"
      - "POST /api/programs/{progId}/expire-insurance-policies"
      - "POST /api/programs/{progId}/asset-units/{assetId}/retire"
      - "POST /api/programs/{progId}/asset-units/{assetId}/dispose"
      - "POST /api/programs/{progId}/asset-units/{assetId}/donate"
      - "POST /api/programs/{progId}/asset-units/{assetId}/write-off"
      - "POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/appeal-grant"
      - "POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/appeal-deny"
      - "POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/waive"
      - "POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/settle"
      - "POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/write-off"
      - "POST /api/programs/{progId}/students/{studentId}/loaner-checkouts/{checkoutId}/escalate"
      - "POST /api/programs/{progId}/audit-sweeps (and lifecycle: begin/finish-scan/close)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: Registrar
    description: "School registrar — enrolls students, manages assignments, declares loss"
    identity: opaque
    exclusive_operations:
      - "POST /api/programs/{progId}/students"
      - "POST /api/programs/{progId}/students/{studentId}/withdraw"
      - "POST /api/programs/{progId}/students/{studentId}/graduate"
      - "POST /api/programs/{progId}/students/{studentId}/assignments"
      - "POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/declare-lost"
    shared_operations:
      - "All GET endpoints"

  - name: SiteTechnician
    description: "Site-level technician — handles repair, re-image, loaner pool, return scanning, damage confirmation"
    identity: opaque
    exclusive_operations:
      - "POST /api/programs/{progId}/fleets/{fleetId}/asset-units (intake)"
      - "POST /api/programs/{progId}/asset-units/{assetId}/designate-loaner"
      - "POST /api/programs/{progId}/asset-units/{assetId}/return-loaner-to-pool"
      - "POST /api/programs/{progId}/asset-units/{assetId}/complete-repair"
      - "POST /api/programs/{progId}/asset-units/{assetId}/begin-reimage"
      - "POST /api/programs/{progId}/asset-units/{assetId}/complete-reimage"
      - "POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/return"
      - "POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports/{reportId}/confirm"
      - "POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports/{reportId}/dismiss"
      - "POST /api/programs/{progId}/students/{studentId}/loaner-checkouts"
      - "POST /api/programs/{progId}/students/{studentId}/loaner-checkouts/{checkoutId}/return"
    shared_operations:
      - "All GET endpoints"
      - "POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports (file as technician)"

  - name: Family
    description: "Student's guardian — signs agreement, enrolls insurance, files damage reports, appeals fees"
    identity: entity_backed:StudentAccount
    exclusive_operations:
      - "POST /api/programs/{progId}/students/{studentId}/family-agreement/sign"
      - "POST /api/programs/{progId}/students/{studentId}/family-agreement/decline"
      - "POST /api/programs/{progId}/students/{studentId}/insurance-policies (create/activate/cancel)"
      - "POST /api/programs/{progId}/students/{studentId}/fees/{feeId}/appeal"
    shared_operations:
      - "GET endpoints scoped to own student (X-User-ID must equal studentId in path)"
      - "POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports (file as family)"
      - "POST /api/programs/{progId}/students/{studentId}/assignments/{assignmentId}/damage-reports/{reportId}/submit"
