            - "AddressPoint.${base_id}.version == 2"
            - "AddressPoint.${u1_id}.status == \"RETIRED\" and AddressPoint.${u1_id}.retire_reason == \"PARENT_RETIRED\""
            - "AddressPoint.${u2_id}.status == \"RETIRED\" and AddressPoint.${u2_id}.retire_reason == \"PARENT_RETIRED\""
            - "AddressPoint.${u1_id}.version == 2 and AddressPoint.${u2_id}.version == 2"
