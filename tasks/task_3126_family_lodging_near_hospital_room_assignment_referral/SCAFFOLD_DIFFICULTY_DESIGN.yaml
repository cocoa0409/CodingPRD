              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_SCREENING_NOT_CLEARED  (state beats business_safety at priorities 4 < 5)"
            - "GET /api/stays/${stay_id}/guests returns an empty array (no side effects fired)"

      - name: care_space_booking_referential_error_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_BOOKING_REFERRAL_MISMATCH
          - errors.ERR_INVALID_DATE_RANGE
        distinguishing_aspect: |
          Category pair business_referential vs business_temporal (different
          pair from state-vs-safety): a booking whose family lacks a VERIFIED
          referral at the care space's hospital AND whose end_at precedes
          start_at violates both priority 7 and 8; priority 7 wins, returning
          ERR_BOOKING_REFERRAL_MISMATCH (422), not ERR_INVALID_DATE_RANGE.
        test_recipe:
          setup:
            - "Hospitals H1 and H2. Care space CS inside H1. Family F holds a VERIFIED referral at H2 only — no referral at H1."
          setup_api_calls:
            - call: "POST /api/hospitals"
