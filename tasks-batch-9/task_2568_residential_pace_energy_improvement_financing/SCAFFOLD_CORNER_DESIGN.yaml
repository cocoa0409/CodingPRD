            - "403 err_owner_cert == 'ERR_UNAUTHORIZED' even though the caller owns the parcel: certificate filing is Contractor-exclusive"
            - "403 err_county_submit == 'ERR_UNAUTHORIZED': submit is PropertyOwner-exclusive and CountyOfficer has no override (the role model is peer/segregated, not hierarchical)"
