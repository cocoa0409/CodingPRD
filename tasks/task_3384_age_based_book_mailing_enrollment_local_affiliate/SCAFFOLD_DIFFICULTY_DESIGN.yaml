        grounds:
          - state_machines.AgeBandSelection.PROPOSED_to_APPROVED
          - state_machines.AgeBandSelection.APPROVED_to_PROPOSED
        distinguishing_aspect: |
          AgeBandSelection machine is a rework cycle on a different entity:
          PROPOSED -> APPROVED -> PROPOSED (reopen clears approved_by) ->
          APPROVED again with a different approver recorded.
        test_recipe:
          setup:
            - "Clock 2026-09-01. TODDLER title exists. Selection for 2026-12/TODDLER proposed by acm-ada."
          setup_api_calls:
            - *c_sep
            - *t_tod
