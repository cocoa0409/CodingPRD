# =============================================================================
# Task 2131 — Orchestra & Symphony Subscription Season (seed tables v1)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!!2131. Orchestra & Symphony Subscription Season (regional symphony orchestra): season programming & guest artist contracting, subscription package construction & seat renewal priority, single ticket on-sale & dynamic pricing, musician contract (services/overscale) & rehearsal scheduling, union rules (breaks/doubling/overtime) compliance, donor/patron seating benefits, program book & advertising sales, concert cancellation & substitution

domain_name: orchestra-symphony-season
api_prefix: /orchestra

complexity_profile:
  difficulty_level: expert
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint

  entity_topology: graph
  # Peer entities linked by explicit foreign keys with no nesting in the read
  # paths; MusicianEngagement is a many-to-many junction between
  # RehearsalService and Musician, and SubscriptionPackage carries a
  # self-referential FK (prior_package_id) forming renewal chains.

  state_machine_shape: parallel
  # Concert carries three INDEPENDENT state dimensions (programming_status ×
  # sale_status × performance_status); GuestArtistContract is cyclic
  # (OFFERED -> COUNTERED -> OFFERED); Season/RehearsalService/
  # SubscriptionPackage/TicketOrder/MusicianEngagement/AdBooking add linear and
  # compound machines around them.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Season
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Display name of the artistic season" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year the season belongs to" }
      - { name: renewal_deadline_utc, type: datetime, source: input, description: "Instant after which subscription renewals are no longer accepted for this season" }
      - { name: base_ticket_price_cents, type: integer, source: input, description: "Season-wide base single-ticket price in cents, before section multiplier and demand multiplier", constraints: ">= 1" }
      - { name: loyalty_discount_bp, type: integer, source: input, default: 500, description: "Base loyalty discount in basis points applied to RENEWAL subscription packages", constraints: "0..2000" }
      - { name: status, type: enum, source: system, default: PLANNING, description: "PLANNING | RENEWAL_WINDOW | SINGLE_ON_SALE | IN_PROGRESS | CLOSED" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Housekeeping epoch counter, incremented by run-ops" }
      - { name: concerts_programmed_count, type: integer, source: computed, default: 0, description: "Count of this season's concerts whose programming_status is PROGRAMMED or LOCKED" }
      - { name: concerts_cancelled_count, type: integer, source: computed, default: 0, description: "Count of this season's concerts whose performance_status is CANCELLED" }
      - { name: program_book_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of invoice_total_cents over this season's AdBookings whose status is APPROVED" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hall name" }
      - { name: changeover_buffer_minutes, type: integer, source: input, default: 60, description: "Minutes of stage changeover that must separate two PUBLISHED services in this hall", constraints: ">= 0" }
      - { name: total_capacity, type: integer, source: computed, default: 0, description: "Sum of capacity over this venue's SeatSections" }

  - name: SeatSection
    parent: Venue
    common_fields: true
    fields:
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: name, type: string, source: input, description: "Section label, e.g. ORCHESTRA / MEZZANINE / BALCONY" }
      - { name: capacity, type: integer, source: input, description: "Physical seat count of this section", constraints: ">= 1" }
      - { name: price_multiplier_bp, type: integer, source: input, description: "Section price multiplier in basis points (10000 = 1.00x)", constraints: ">= 1" }
      - { name: donor_priority_rank, type: integer, source: input, description: "1 = most desirable. Sections with donor_priority_rank <= 2 are donor-benefit sections for NEW subscription packages", constraints: "1..5" }
      - { name: min_renewal_priority_score, type: integer, source: input, default: 0, description: "Minimum Patron.renewal_priority_score required to renew a package seated in this section", constraints: ">= 0" }

  - name: Concert
    parent: Season
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: title, type: string, source: input, description: "Concert title" }
      - { name: performance_start_utc, type: datetime, source: input, description: "Scheduled downbeat" }
      - { name: performance_end_utc, type: datetime, source: input, description: "Scheduled end of the performance" }
      - { name: program_minutes, type: integer, source: input, description: "Total printed program duration in minutes", constraints: ">= 1" }
      - { name: programming_status, type: enum, source: system, default: DRAFT, description: "Dimension 1 of 3 — DRAFT | PROGRAMMED | LOCKED" }
      - { name: sale_status, type: enum, source: system, default: UNANNOUNCED, description: "Dimension 2 of 3 — UNANNOUNCED | RENEWAL_ONLY | PUBLIC_ONSALE | SALES_CLOSED" }
      - { name: performance_status, type: enum, source: system, default: SCHEDULED, description: "Dimension 3 of 3 — SCHEDULED | PERFORMED | CANCELLED" }
      - { name: readiness_posture, type: enum, source: computed, default: READY, description: "READY | AT_RISK | BLOCKED, derived from this concert's contracts and PUBLISHED services (see calculations.concert_readiness_posture)" }
      - { name: section_inventory, type: array, source: system, description: "One element per SeatSection of the concert's venue, snapshotted at concert creation: { seat_section_id, capacity, held_count, sold_count, available_count, fill_bp, demand_band }" }
      - { name: seats_held_count, type: integer, source: computed, default: 0, description: "Sum of held_count over section_inventory" }
      - { name: seats_sold_count, type: integer, source: computed, default: 0, description: "Sum of sold_count over section_inventory" }
      - { name: substitution_count, type: integer, source: system, default: 0, description: "Number of guest-artist substitutions performed on this concert" }
      - { name: gross_ticket_revenue_cents, type: integer, source: computed, default: 0, description: "Sum of amount_paid_cents over this concert's TicketOrders whose status is PAID; refreshed when the concert is settled" }

  - name: GuestArtistContract
    parent: Concert
    common_fields: true
    fields:
      - { name: concert_id, type: string, source: input, description: "FK -> Concert.id" }
      - { name: artist_name, type: string, source: input, description: "Guest artist or conductor name" }
      - { name: role_type, type: enum, source: input, description: "SOLOIST | CONDUCTOR" }
      - { name: offered_fee_cents, type: integer, source: system, description: "Fee currently offered by the orchestra, in cents", constraints: ">= 0" }
      - { name: countered_fee_cents, type: integer, source: system, default: null, description: "Fee most recently demanded by the artist, in cents; null until the artist counters" }
      - { name: agreed_fee_cents, type: integer, source: system, default: null, description: "Fee locked at signature; null until SIGNED" }
      - { name: negotiation_round, type: integer, source: system, default: 1, description: "Number of orchestra offers made so far; incremented by revise-offer" }
      - { name: status, type: enum, source: system, default: OFFERED, description: "OFFERED | COUNTERED | SIGNED | WITHDRAWN" }

  - name: Musician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Musician name" }
      - { name: instrument, type: enum, source: input, description: "VIOLIN | VIOLA | CELLO | BASS | FLUTE | OBOE | CLARINET | BASSOON | HORN | TRUMPET | TROMBONE | PERCUSSION | HARP" }
      - { name: is_principal, type: boolean, source: input, default: false, description: "Principal chair, paid a principal premium over scale" }
      - { name: overscale_bp, type: integer, source: input, default: 0, description: "Individually negotiated overscale premium in basis points above union scale", constraints: "0..10000" }
      - { name: services_charged_ytd, type: integer, source: system, default: 0, description: "Conserved counter — number of engagements this musician currently holds against PUBLISHED or COMPLETED services (see calculations.musician_service_credit_invariant)" }
      - { name: ytd_earnings_cents, type: integer, source: computed, default: 0, description: "Sum of provisional_pay_cents for CONFIRMED engagements plus final_pay_cents for SETTLED engagements held by this musician" }

  - name: UnionAgreement
    parent: Season
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id; at most one agreement per season" }
      - { name: scale_service_fee_cents, type: integer, source: input, description: "Base pay per service at union scale, in cents", constraints: ">= 1" }
      - { name: max_service_minutes, type: integer, source: input, default: 150, description: "Worked minutes included in scale; strictly more than this is overtime", constraints: ">= 1" }
      - { name: overtime_rate_cents_per_minute, type: integer, source: input, default: 400, description: "Flat overtime rate per minute, not scaled by any premium", constraints: ">= 0" }
      - { name: min_rest_minutes_between_services, type: integer, source: input, default: 90, description: "Minimum rest a musician must have between two of their services", constraints: ">= 0" }
      - { name: max_services_per_day, type: integer, source: input, default: 2, description: "Maximum CONFIRMED engagements a musician may hold on one UTC calendar date", constraints: ">= 1" }
      - { name: doubling_premium_bp, type: integer, source: input, default: 1250, description: "Premium in basis points per doubled instrument on a service", constraints: ">= 0" }
      - { name: mandatory_break_minutes, type: integer, source: input, default: 20, description: "Break a service longer than 90 scheduled minutes must schedule", constraints: ">= 0" }
      - { name: principal_premium_bp, type: integer, source: input, default: 2000, description: "Premium in basis points for principal chairs", constraints: ">= 0" }

  - name: RehearsalService
    parent: Concert
    common_fields: true
    fields:
      - { name: concert_id, type: string, source: input, description: "FK -> Concert.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: service_type, type: enum, source: input, description: "REHEARSAL | DRESS_REHEARSAL | PERFORMANCE" }
      - { name: scheduled_start_utc, type: datetime, source: input, description: "Scheduled call time" }
      - { name: scheduled_end_utc, type: datetime, source: input, description: "Scheduled release time; must be strictly after scheduled_start_utc" }
      - { name: break_minutes, type: integer, source: input, default: 0, description: "Scheduled break inside the service, deducted from worked minutes", constraints: ">= 0" }
      - { name: minimum_complement, type: integer, source: input, description: "Minimum CONFIRMED engagements required before the service may be published", constraints: ">= 0" }
      - { name: actual_start_utc, type: datetime, source: system, default: null, description: "Clocked start, set by the clock endpoint" }
      - { name: actual_end_utc, type: datetime, source: system, default: null, description: "Clocked end, set by the clock endpoint" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | PUBLISHED | COMPLETED | CANCELLED" }
      - { name: confirmed_engagement_count, type: integer, source: computed, default: 0, description: "Count of this service's MusicianEngagements whose status is CONFIRMED" }
      - { name: compliance_status, type: enum, source: computed, default: COMPLIANT, description: "COMPLIANT | UNDERSTAFFED — UNDERSTAFFED once confirmed_engagement_count < minimum_complement after publication" }
      - { name: provisional_service_cost_cents, type: integer, source: computed, default: 0, description: "Sum of provisional_pay_cents over this service's CONFIRMED engagements, set at publication" }
      - { name: final_service_cost_cents, type: integer, source: computed, default: null, description: "Sum of final_pay_cents over this service's SETTLED engagements, set at clock-out" }

  - name: MusicianEngagement
    parent: RehearsalService
    common_fields: true
    fields:
      - { name: service_id, type: string, source: input, description: "FK -> RehearsalService.id" }
      - { name: musician_id, type: string, source: input, description: "FK -> Musician.id" }
      - { name: doubling_count, type: integer, source: input, default: 0, description: "Number of additional instruments doubled on this service; the union cap itself is enforced by validations[priority=13], not by the field constraint", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: CONFIRMED, description: "CONFIRMED | DECLINED | SETTLED | VOIDED" }
      - { name: provisional_pay_cents, type: integer, source: computed, default: null, description: "Scale plus premiums, excluding overtime; set when the parent service is published" }
      - { name: final_pay_cents, type: integer, source: computed, default: null, description: "Provisional base pay plus clocked overtime; set when the parent service is clocked out" }
      - { name: overtime_minutes, type: integer, source: computed, default: 0, description: "Clocked worked minutes above UnionAgreement.max_service_minutes" }

  - name: Patron
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Patron name" }
      - { name: email, type: string, source: input, description: "Contact email, unique across patrons" }
      - { name: subscriber_since_year, type: integer, source: input, default: null, description: "First year this patron subscribed; null means no seniority" }
      - { name: lifetime_donation_cents, type: integer, source: system, default: 0, description: "Cumulative philanthropic giving in cents; never includes ticket or subscription payments" }
      - { name: donor_level, type: enum, source: computed, default: NONE, description: "NONE | FRIEND | SUSTAINER | BENEFACTOR | LAUREATE, derived from lifetime_donation_cents" }
      - { name: consecutive_renewal_years, type: integer, source: system, default: 0, description: "Set to 1 when a NEW package is paid, incremented by 1 when a RENEWAL package is paid" }
      - { name: renewal_priority_score, type: integer, source: computed, default: 0, description: "Renewal seat-priority score (see calculations.patron_renewal_priority_score)" }
      - { name: credit_balance_cents, type: integer, source: system, default: 0, description: "House credit in cents, created by cancellation refunds and spendable on ticket orders" }
      - { name: lifetime_cash_in_cents, type: integer, source: system, default: 0, description: "Conserved quantity — cumulative cash (never credit) this patron has paid for tickets and subscription packages" }

  - name: SubscriptionPackage
    parent: Season
    common_fields: true
    fields:
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id" }
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: seat_section_id, type: string, source: input, description: "FK -> SeatSection.id" }
      - { name: prior_package_id, type: string, source: system, default: null, description: "FK -> SubscriptionPackage.id; the package this one renews, null for NEW packages" }
      - { name: seat_count, type: integer, source: input, description: "Seats held per concert in the package", constraints: ">= 1" }
      - { name: concert_ids, type: array, source: input, description: "Ordered list of Concert ids included in the package; every id must belong to season_id" }
      - { name: package_type, type: enum, source: system, description: "NEW | RENEWAL" }
      - { name: status, type: enum, source: system, default: PENDING_PAYMENT, description: "PENDING_PAYMENT | ACTIVE | LAPSED | EXPIRED" }
      - { name: locked_unit_price_cents, type: integer, source: computed, description: "Per-seat per-concert line price locked at package creation; a RENEWAL reuses its prior package's locked_unit_price_cents" }
      - { name: price_cents, type: integer, source: computed, description: "Package price after per-line rounding, package discount and (RENEWAL only) loyalty discount" }
      - { name: fulfilled_concert_count, type: integer, source: computed, default: 0, description: "Count of concert_ids whose Concert.performance_status is not CANCELLED" }

  - name: TicketOrder
    parent: Concert
    common_fields: true
    fields:
      - { name: concert_id, type: string, source: input, description: "FK -> Concert.id" }
      - { name: patron_id, type: string, source: input, description: "FK -> Patron.id" }
      - { name: seat_section_id, type: string, source: input, description: "FK -> SeatSection.id" }
      - { name: seat_count, type: integer, source: input, description: "Seats requested", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: HELD, description: "HELD | PAID | EXPIRED | REFUNDED" }
      - { name: quoted_unit_price_cents, type: integer, source: computed, description: "Dynamic unit price locked at hold time" }
      - { name: amount_due_cents, type: integer, source: computed, description: "quoted_unit_price_cents * seat_count" }
      - { name: amount_paid_cents, type: integer, source: system, default: 0, description: "Total settled at payment, credit plus cash" }
      - { name: credit_applied_cents, type: integer, source: system, default: 0, description: "Portion of amount_paid_cents taken from Patron.credit_balance_cents" }
      - { name: demand_band_at_hold, type: enum, source: system, description: "LOW | MODERATE | HIGH | PEAK band that produced quoted_unit_price_cents" }
      - { name: hold_expires_at_ops_run, type: integer, source: system, description: "Season.ops_run_index at which an unpaid hold expires" }

  - name: AdBooking
    parent: Season
    common_fields: true
    fields:
      - { name: season_id, type: string, source: input, description: "FK -> Season.id" }
      - { name: advertiser_name, type: string, source: input, description: "Advertiser display name" }
      - { name: ad_size, type: enum, source: input, description: "FULL_PAGE | HALF_PAGE | QUARTER_PAGE" }
      - { name: placement, type: enum, source: input, description: "BACK_COVER | INSIDE_FRONT_COVER | RUN_OF_BOOK" }
      - { name: insertion_count, type: integer, source: input, description: "Number of program books the ad runs in", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | APPROVED | REJECTED" }
      - { name: ad_subtotal_cents, type: integer, source: computed, default: null, description: "Undiscounted size rate times insertion_count, set at approval" }
      - { name: volume_discount_bp, type: integer, source: computed, default: null, description: "Volume discount tier in basis points, keyed on ad_subtotal_cents" }
      - { name: placement_fee_cents, type: integer, source: computed, default: null, description: "Placement surcharge computed from the DISCOUNTED subtotal" }
      - { name: invoice_total_cents, type: integer, source: computed, default: null, description: "Discounted subtotal plus placement fee" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Season
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: RENEWAL_WINDOW
        trigger: "POST /orchestra/seasons/{season_id}/advance with target_status=RENEWAL_WINDOW"
        actor: ArtisticAdmin
        preconditions:
          - "season.status == PLANNING"
          - "exactly one UnionAgreement exists whose season_id == season.id, else ERR_UNION_AGREEMENT_MISSING"
          - "season.concerts_programmed_count >= 1, else ERR_NO_PROGRAMMED_CONCERTS"
        side_effects:
          - "Every Concert with concert.season_id == season.id AND programming_status IN {PROGRAMMED, LOCKED} AND sale_status == UNANNOUNCED moves sale_status to RENEWAL_ONLY (processed in Concert.performance_start_utc ASC, tie-break created_at ASC)"
          - "increments Season.version by 1"

      - from: RENEWAL_WINDOW
        to: SINGLE_ON_SALE
        trigger: "POST /orchestra/seasons/{season_id}/advance with target_status=SINGLE_ON_SALE"
        actor: ArtisticAdmin
        preconditions:
          - "season.status == RENEWAL_WINDOW"
          - "logical clock >= season.renewal_deadline_utc, else ERR_INVALID_SEASON_TRANSITION"
        side_effects:
          - "Hop 1: every Concert with season_id == season.id AND sale_status == RENEWAL_ONLY moves sale_status to PUBLIC_ONSALE"
          - "Hop 1 (parallel): every SubscriptionPackage with season_id == season.id AND status == PENDING_PAYMENT moves to LAPSED (processed created_at ASC)"
          - "Hop 2, caused by hop 1: each package entering LAPSED releases its seats — for every concert_id in that package and its seat_section_id, section_inventory.held_count -= package.seat_count"
          - "Hop 3, caused by hop 2: each touched Concert recomputes available_count, fill_bp and demand_band on that section_inventory element and refreshes seats_held_count"
          - "every Concert of this season recomputes readiness_posture (a concert still carrying an OFFERED or COUNTERED contract becomes BLOCKED now that the season is on sale)"
          - "increments Season.version by 1"

      - from: SINGLE_ON_SALE
        to: IN_PROGRESS
        trigger: "POST /orchestra/seasons/{season_id}/advance with target_status=IN_PROGRESS"
        actor: ArtisticAdmin
        preconditions: ["season.status == SINGLE_ON_SALE"]
        side_effects: ["increments Season.version by 1"]

      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /orchestra/seasons/{season_id}/advance with target_status=CLOSED"
        actor: ArtisticAdmin
        preconditions:
          - "season.status == IN_PROGRESS"
          - "every Concert with season_id == season.id has performance_status IN {PERFORMED, CANCELLED}, else ERR_INVALID_SEASON_TRANSITION"
        side_effects:
          - "every Concert of the season moves sale_status to SALES_CLOSED"
          - "every SubscriptionPackage of the season with status == ACTIVE moves to EXPIRED"
          - "increments Season.version by 1"

      - from: any
        to: same
        trigger: "POST /orchestra/seasons/{season_id}/run-ops (ops-run checkpoint, does not change season.status)"
        actor: BoxOfficeAgent
        preconditions: ["season.status != CLOSED, else ERR_INVALID_SEASON_TRANSITION"]
        side_effects:
          - "Season.ops_run_index += 1"
          - "Hop 1: every TicketOrder for a concert of this season with status == HELD AND hold_expires_at_ops_run <= new ops_run_index moves to EXPIRED (processed created_at ASC)"
          - "Hop 2, caused by hop 1: each expiring order releases seats — section_inventory.held_count -= order.seat_count on its concert and section"
          - "Hop 3, caused by hop 2: that concert recomputes available_count, fill_bp, demand_band and seats_held_count"
          - "every SubscriptionPackage of this season with status == PENDING_PAYMENT AND logical clock > season.renewal_deadline_utc moves to LAPSED, releasing its held seats the same way"
          - "renewal_priority_score is recomputed and persisted for every Patron holding a package in this season"
          - "increments Season.version by 1"
        note: "The epoch counter is the only expiry clock for holds; no wall-clock timers exist."

  - entity: Concert
    initial_state: "DRAFT | UNANNOUNCED | SCHEDULED (three independent dimensions)"
    terminal_states: [PERFORMED, CANCELLED, SALES_CLOSED]
    transitions:
      # ---- dimension 1: programming_status ----
      - from: DRAFT
        to: PROGRAMMED
        trigger: "POST /orchestra/concerts/{concert_id}/program"
        actor: ArtisticAdmin
        preconditions:
          - "concert.programming_status == DRAFT, else ERR_CONCERT_NOT_DRAFT"
          - "the concert's Season.status == PLANNING, else ERR_INVALID_SEASON_TRANSITION"
        side_effects:
          - "Season.concerts_programmed_count += 1"
          - "readiness_posture recomputed"

      - from: PROGRAMMED
        to: LOCKED
        trigger: "system — evaluated at the end of POST /orchestra/guest-contracts/{contract_id}/sign and POST /orchestra/rehearsals/{service_id}/publish"
        actor: system
        preconditions:
          - "concert.programming_status == PROGRAMMED"
          - "at least one GuestArtistContract exists for the concert and every one of them has status IN {SIGNED, WITHDRAWN} with at least one SIGNED"
          - "at least one RehearsalService of the concert has status == PUBLISHED"
        side_effects: ["readiness_posture recomputed"]

      - from: LOCKED
        to: PROGRAMMED
        trigger: "system — cascade hop when a PUBLISHED service of this concert becomes UNDERSTAFFED, or when POST /orchestra/concerts/{concert_id}/substitute withdraws a SIGNED contract"
        actor: system
        preconditions: ["concert.programming_status == LOCKED"]
        side_effects: ["readiness_posture recomputed"]
        note: "Programming unlock is a revert edge; it never touches sale_status or performance_status."

      # ---- dimension 2: sale_status ----
      - from: UNANNOUNCED
        to: RENEWAL_ONLY
        trigger: "system — cascade of Season PLANNING -> RENEWAL_WINDOW"
        actor: system
        preconditions: ["concert.programming_status IN {PROGRAMMED, LOCKED}"]
        side_effects: ["subscription packages may now hold seats on this concert"]

      - from: RENEWAL_ONLY
        to: PUBLIC_ONSALE
        trigger: "system — cascade of Season RENEWAL_WINDOW -> SINGLE_ON_SALE"
        actor: system
        preconditions: ["concert.sale_status == RENEWAL_ONLY"]
        side_effects: ["single ticket orders become creatable on this concert"]

      - from: PUBLIC_ONSALE
        to: SALES_CLOSED
        trigger: "system — cascade of POST /orchestra/concerts/{concert_id}/cancel, POST /orchestra/concerts/{concert_id}/settle, or Season IN_PROGRESS -> CLOSED"
        actor: system
        preconditions: []
        side_effects: ["no further TicketOrder may be created for this concert"]

      # ---- dimension 3: performance_status ----
      - from: SCHEDULED
        to: PERFORMED
        trigger: "POST /orchestra/concerts/{concert_id}/settle"
        actor: ArtisticAdmin
        preconditions:
          - "concert.performance_status == SCHEDULED, else ERR_CONCERT_NOT_SETTLEABLE"
          - "the concert's Season.status == IN_PROGRESS, else ERR_CONCERT_NOT_SETTLEABLE"
          - "every RehearsalService of the concert with status == PUBLISHED has been clocked out (status == COMPLETED), else ERR_CONCERT_NOT_SETTLEABLE"
        side_effects:
          - "sale_status -> SALES_CLOSED"
          - "gross_ticket_revenue_cents = sum of amount_paid_cents over this concert's TicketOrders whose status == PAID"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /orchestra/concerts/{concert_id}/cancel"
        actor: ArtisticAdmin
        preconditions:
          - "concert.performance_status == SCHEDULED, else ERR_CONCERT_ALREADY_CANCELLED"
          - "the concert's Season.status != CLOSED, else ERR_INVALID_SEASON_TRANSITION"
        side_effects:
          - "sale_status -> SALES_CLOSED; Season.concerts_cancelled_count += 1"
          - "CASCADE A hop 1: every RehearsalService of this concert with status IN {DRAFT, PUBLISHED} moves to CANCELLED (processed scheduled_start_utc ASC, tie-break created_at ASC)"
          - "CASCADE A hop 2, caused by hop 1: every MusicianEngagement of each service that just became CANCELLED and whose status == CONFIRMED moves to VOIDED"
          - "CASCADE A hop 3, caused by hop 2: each engagement entering VOIDED whose provisional_pay_cents is not null decrements Musician.services_charged_ytd by 1 and subtracts provisional_pay_cents from Musician.ytd_earnings_cents"
          - "CASCADE B hop 1: every TicketOrder of this concert with status == HELD moves to EXPIRED and every TicketOrder with status == PAID moves to REFUNDED"
          - "CASCADE B hop 2, caused by hop 1: each order entering REFUNDED credits Patron.credit_balance_cents += order.amount_paid_cents; each order entering EXPIRED or REFUNDED releases its seats on section_inventory"
          - "CASCADE B hop 3, caused by hop 2: the concert recomputes available_count, fill_bp, demand_band, seats_held_count and seats_sold_count"
          - "every GuestArtistContract of this concert with status IN {OFFERED, COUNTERED} moves to WITHDRAWN"
          - "every SubscriptionPackage whose concert_ids contains this concert recomputes fulfilled_concert_count"
          - "programming_status and readiness_posture are NOT changed by cancellation"

  - entity: GuestArtistContract
    initial_state: OFFERED
    terminal_states: [SIGNED, WITHDRAWN]
    transitions:
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /orchestra/guest-contracts/{contract_id}/counter"
        actor: GuestArtist
        preconditions:
          - "contract.status == OFFERED, else ERR_CONTRACT_NOT_NEGOTIABLE"
          - "X-User-ID == contract.id, else ERR_NOT_RESOURCE_OWNER"
        side_effects: ["countered_fee_cents = request countered_fee_cents", "readiness_posture of the parent concert recomputed"]

      - from: COUNTERED
        to: OFFERED
        trigger: "POST /orchestra/guest-contracts/{contract_id}/revise-offer"
        actor: ArtisticAdmin
        preconditions:
          - "contract.status == COUNTERED, else ERR_CONTRACT_NOT_NEGOTIABLE"
          - "contract.negotiation_round < 3, else ERR_NEGOTIATION_ROUND_LIMIT"
        side_effects: ["offered_fee_cents = request offered_fee_cents", "negotiation_round += 1"]
        note: "This edge closes the OFFERED -> COUNTERED -> OFFERED negotiation cycle."

      - from: OFFERED
        to: SIGNED
        trigger: "POST /orchestra/guest-contracts/{contract_id}/sign"
        actor: GuestArtist
        preconditions:
          - "contract.status == OFFERED, else ERR_CONTRACT_NOT_NEGOTIABLE"
          - "X-User-ID == contract.id, else ERR_NOT_RESOURCE_OWNER"
          - "the parent Concert.programming_status IN {PROGRAMMED, LOCKED}, else ERR_CONCERT_NOT_PROGRAMMED"
        side_effects:
          - "agreed_fee_cents = offered_fee_cents (artist accepts the orchestra's standing offer)"
          - "re-evaluate the parent concert's PROGRAMMED -> LOCKED condition"
          - "readiness_posture of the parent concert recomputed"

      - from: COUNTERED
        to: SIGNED
        trigger: "POST /orchestra/guest-contracts/{contract_id}/sign"
        actor: ArtisticAdmin
        preconditions:
          - "contract.status == COUNTERED, else ERR_CONTRACT_NOT_NEGOTIABLE"
          - "the parent Concert.programming_status IN {PROGRAMMED, LOCKED}, else ERR_CONCERT_NOT_PROGRAMMED"
        side_effects:
          - "agreed_fee_cents = countered_fee_cents (orchestra accepts the artist's counter — the divergent branch)"
          - "re-evaluate the parent concert's PROGRAMMED -> LOCKED condition"
          - "readiness_posture of the parent concert recomputed"

      - from: OFFERED
        to: WITHDRAWN
        trigger: "system — cascade of POST /orchestra/concerts/{concert_id}/cancel"
        actor: system
        preconditions: ["contract.status IN {OFFERED, COUNTERED}"]
        side_effects: []

      - from: SIGNED
        to: WITHDRAWN
        trigger: "POST /orchestra/concerts/{concert_id}/substitute (the replaced contract)"
        actor: ArtisticAdmin
        preconditions: ["contract.status IN {OFFERED, COUNTERED, SIGNED}, else ERR_CONTRACT_NOT_NEGOTIABLE"]
        side_effects:
          - "a replacement GuestArtistContract is created in OFFERED with negotiation_round = 1"
          - "Concert.substitution_count += 1"
          - "if the concert was LOCKED it reverts to PROGRAMMED because a contract is no longer signed"
          - "readiness_posture of the parent concert recomputed"

  - entity: RehearsalService
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /orchestra/rehearsals/{service_id}/publish"
        actor: OrchestraManager
        preconditions:
          - "service.status == DRAFT, else ERR_SERVICE_NOT_DRAFT"
          - "if (scheduled_end_utc - scheduled_start_utc) in minutes > 90 then break_minutes >= UnionAgreement.mandatory_break_minutes, else ERR_UNION_BREAK_VIOLATION"
          - "no other RehearsalService with the same venue_id and status == PUBLISHED overlaps under the changeover rule, else ERR_VENUE_CHANGEOVER_CONFLICT"
          - "confirmed_engagement_count >= minimum_complement, else ERR_INSUFFICIENT_COMPLEMENT"
        side_effects:
          - "provisional_pay_cents computed for every CONFIRMED engagement of this service (calculations.musician_service_settlement, PROVISIONAL variant)"
          - "provisional_service_cost_cents = sum of those provisional_pay_cents"
          - "for each such engagement: Musician.services_charged_ytd += 1 and Musician.ytd_earnings_cents += provisional_pay_cents"
          - "compliance_status = COMPLIANT"
          - "re-evaluate the parent concert's PROGRAMMED -> LOCKED condition; readiness_posture recomputed"

      - from: PUBLISHED
        to: COMPLETED
        trigger: "POST /orchestra/rehearsals/{service_id}/clock"
        actor: OrchestraManager
        preconditions:
          - "service.status == PUBLISHED, else ERR_SERVICE_NOT_PUBLISHED"
          - "actual_end_utc strictly after actual_start_utc, else ERR_INVALID_REQUEST"
        side_effects:
          - "actual_start_utc / actual_end_utc stored"
          - "for every CONFIRMED engagement: overtime_minutes and final_pay_cents computed (calculations.musician_service_settlement, FINAL variant) and status moves to SETTLED"
          - "for each such engagement: Musician.ytd_earnings_cents += (final_pay_cents - provisional_pay_cents)"
          - "final_service_cost_cents = sum of final_pay_cents over the SETTLED engagements"

      - from: DRAFT
        to: CANCELLED
        trigger: "system — CASCADE A hop 1 of POST /orchestra/concerts/{concert_id}/cancel"
        actor: system
        preconditions: []
        side_effects: ["every CONFIRMED engagement of this service moves to VOIDED"]

      - from: PUBLISHED
        to: CANCELLED
        trigger: "system — CASCADE A hop 1 of POST /orchestra/concerts/{concert_id}/cancel"
        actor: system
        preconditions: []
        side_effects: ["every CONFIRMED engagement of this service moves to VOIDED"]

  - entity: MusicianEngagement
    initial_state: CONFIRMED
    terminal_states: [DECLINED, SETTLED, VOIDED]
    transitions:
      - from: CONFIRMED
        to: DECLINED
        trigger: "POST /orchestra/engagements/{engagement_id}/decline"
        actor: Musician
        preconditions:
          - "engagement.status == CONFIRMED, else ERR_ENGAGEMENT_NOT_CONFIRMED"
          - "X-User-ID == engagement.musician_id, else ERR_NOT_RESOURCE_OWNER"
          - "the parent RehearsalService.status IN {DRAFT, PUBLISHED}, else ERR_SERVICE_NOT_PUBLISHED"
        side_effects:
          - "if provisional_pay_cents is not null: Musician.services_charged_ytd -= 1 and Musician.ytd_earnings_cents -= provisional_pay_cents"
          - "CASCADE C hop 1: parent RehearsalService.confirmed_engagement_count -= 1"
          - "CASCADE C hop 2, caused by hop 1: if the service is PUBLISHED and confirmed_engagement_count < minimum_complement, service.compliance_status -> UNDERSTAFFED and provisional_service_cost_cents is recomputed"
          - "CASCADE C hop 3, caused by hop 2: the parent Concert.readiness_posture -> AT_RISK"
          - "CASCADE C hop 4, caused by hop 3: if that concert's programming_status == LOCKED it reverts to PROGRAMMED"

      - from: CONFIRMED
        to: SETTLED
        trigger: "system — POST /orchestra/rehearsals/{service_id}/clock"
        actor: system
        preconditions: ["engagement.status == CONFIRMED"]
        side_effects: ["final_pay_cents and overtime_minutes set"]

      - from: CONFIRMED
        to: VOIDED
        trigger: "system — CASCADE A hop 2 of POST /orchestra/concerts/{concert_id}/cancel"
        actor: system
        preconditions: []
        side_effects: ["if provisional_pay_cents is not null: Musician.services_charged_ytd -= 1 and Musician.ytd_earnings_cents -= provisional_pay_cents"]

  - entity: SubscriptionPackage
    initial_state: PENDING_PAYMENT
    terminal_states: [LAPSED, EXPIRED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /orchestra/subscriptions/{subscription_id}/pay"
        actor: BoxOfficeAgent
        preconditions: ["package.status == PENDING_PAYMENT, else ERR_SUBSCRIPTION_NOT_PENDING"]
        side_effects:
          - "for every concert_id in the package: section_inventory.held_count -= seat_count and sold_count += seat_count on the package's seat_section_id"
          - "Patron.lifetime_cash_in_cents += package.price_cents"
          - "if package_type == NEW: Patron.consecutive_renewal_years = 1; if package_type == RENEWAL: Patron.consecutive_renewal_years += 1"
          - "Patron.renewal_priority_score recomputed and persisted"

      - from: PENDING_PAYMENT
        to: LAPSED
        trigger: "system — cascade of Season RENEWAL_WINDOW -> SINGLE_ON_SALE, or POST /orchestra/seasons/{season_id}/run-ops past the renewal deadline"
        actor: system
        preconditions: []
        side_effects: ["releases held seats on every concert in concert_ids"]

      - from: ACTIVE
        to: EXPIRED
        trigger: "system — cascade of Season IN_PROGRESS -> CLOSED"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TicketOrder
    initial_state: HELD
    terminal_states: [PAID, EXPIRED, REFUNDED]
    transitions:
      - from: HELD
        to: PAID
        trigger: "POST /orchestra/ticket-orders/{order_id}/pay"
        actor: BoxOfficeAgent
        preconditions:
          - "order.status == HELD, else ERR_TICKET_ORDER_NOT_HELD"
          - "the concert's performance_status == SCHEDULED, else ERR_CONCERT_ALREADY_CANCELLED"
        side_effects:
          - "credit_applied_cents = min(Patron.credit_balance_cents, amount_due_cents) when use_credit is true, else 0"
          - "Patron.credit_balance_cents -= credit_applied_cents"
          - "amount_paid_cents = amount_due_cents; Patron.lifetime_cash_in_cents += (amount_due_cents - credit_applied_cents)"
          - "section_inventory.held_count -= seat_count and sold_count += seat_count; fill_bp / demand_band / seats_held_count / seats_sold_count recomputed"

      - from: HELD
        to: EXPIRED
        trigger: "system — POST /orchestra/seasons/{season_id}/run-ops when hold_expires_at_ops_run <= ops_run_index, or CASCADE B of concert cancellation"
        actor: system
        preconditions: []
        side_effects: ["releases seat_count seats back to section_inventory.available_count"]

      - from: PAID
        to: REFUNDED
        trigger: "system — CASCADE B hop 1 of POST /orchestra/concerts/{concert_id}/cancel"
        actor: system
        preconditions: []
        side_effects:
          - "Patron.credit_balance_cents += amount_paid_cents (amount_paid_cents itself is left untouched)"
          - "sold_count -= seat_count on section_inventory"

  - entity: AdBooking
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /orchestra/ad-bookings/{booking_id}/decide with decision=APPROVE"
        actor: AdvertisingSales
        preconditions:
          - "booking.status == SUBMITTED, else ERR_AD_BOOKING_NOT_SUBMITTED"
          - "the booking's Season.status != CLOSED, else ERR_INVALID_SEASON_TRANSITION"
        side_effects:
          - "ad_subtotal_cents, volume_discount_bp, placement_fee_cents and invoice_total_cents computed (calculations.ad_invoice_total)"
          - "Season.program_book_revenue_cents += invoice_total_cents"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /orchestra/ad-bookings/{booking_id}/decide with decision=REJECT"
        actor: AdvertisingSales
        preconditions: ["booking.status == SUBMITTED, else ERR_AD_BOOKING_NOT_SUBMITTED"]
        side_effects: ["no invoice fields are computed; they stay null"]

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: ticket-order-create-stale-concert
    parent_entity: Concert
    write_endpoint: "POST /orchestra/ticket-orders"
    occ_field: "expected_concert_version"
    description: |
      Creating a single-ticket hold against a Concert whose version has advanced
      since the client last read it is rejected. A hold prices itself from the
      concert's current fill_bp and demand_band, so a client working from a
      stale read would lock a price computed against inventory that no longer
      exists. Because a second hold on the same concert is a legitimate product
      operation, the stale read cannot be caught by any state precondition; the
      version check is what rejects it.
    error_id: ERR_STALE_CONCERT_VERSION
    http_status: 412

  - rule_id: subscription-renew-stale-package
    parent_entity: SubscriptionPackage
    write_endpoint: "POST /orchestra/subscriptions/{subscription_id}/renew"
    occ_field: "expected_package_version"
    description: |
      Renewing a SubscriptionPackage whose version has advanced since the client
      last read it is rejected. Renewal legitimately supersedes the prior
      package's seat claim into the next season and leaves the prior package
      ACTIVE, so a second renewal of the same prior package would otherwise
      succeed and mint a duplicate seat claim; the version check is the only
      thing that rejects the stale one.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: single_ticket_dynamic_price
    trigger: "GET /orchestra/concerts/{concert_id}/price-quote, and POST /orchestra/ticket-orders which locks the result into TicketOrder.quoted_unit_price_cents / amount_due_cents / demand_band_at_hold"
    algorithm: tiered_pricing
    formula: |
      # inputs: Season.base_ticket_price_cents, SeatSection.price_multiplier_bp,
      #         the concert's section_inventory element for that section,
      #         Patron.donor_level (absent patron_id => donor_discount_bp = 0)
      taken   = inventory.held_count + inventory.sold_count          # of that concert+section only
      fill_bp = floor(taken * 10000 / section.capacity)              # integer basis points, 0 when taken == 0
      demand_band = PEAK     if fill_bp >= 8000
                    HIGH     elif fill_bp >= 5000
                    MODERATE elif fill_bp >= 2000
                    LOW      otherwise
      demand_multiplier_bp = DEMAND_MULTIPLIER_BP[demand_band]
      raw_unit   = round_half_up(season.base_ticket_price_cents * section.price_multiplier_bp / 10000)
      priced     = round_half_up(raw_unit * demand_multiplier_bp / 10000)
      discounted = round_half_up(priced * (10000 - DONOR_DISCOUNT_BP[patron.donor_level]) / 10000)
      floor_unit   = round_half_up(raw_unit * PRICE_FLOOR_BP / 10000)
      ceiling_unit = round_half_up(raw_unit * PRICE_CEILING_BP / 10000)
      unit_price_cents = min(ceiling_unit, max(floor_unit, discounted))
      amount_due_cents = unit_price_cents * seat_count
      # Evaluation order is pinned: section multiplier is rounded FIRST (raw_unit),
      # the demand multiplier is applied to that rounded value, the donor discount
      # to that result, and the floor/ceiling clamp LAST.
    input_set: "Exactly one section_inventory element — the one whose seat_section_id equals the requested seat_section_id on the requested concert. Subscription seats already counted in held_count/sold_count participate; nothing else does."
    constants:
      DEMAND_MULTIPLIER_BP: { LOW: 9000, MODERATE: 10000, HIGH: 11500, PEAK: 13000 }
      DONOR_DISCOUNT_BP: { NONE: 0, FRIEND: 250, SUSTAINER: 500, BENEFACTOR: 1000, LAUREATE: 1500 }
      PRICE_FLOOR_BP: 8500
      PRICE_CEILING_BP: 12000
    precision: "integer cents, round_half_up at every marked step"
    variants:
      - name: quote
        when: "GET /orchestra/concerts/{concert_id}/price-quote"
        difference: "Read-only. Does not consult availability and never mutates inventory, so quoting 999 seats on a 100-seat section still returns a price."
      - name: locked
        when: "POST /orchestra/ticket-orders"
        difference: "The same arithmetic runs on the inventory as it stands BEFORE this order's seats are held, and the result is frozen on the order; later demand movement never re-prices an existing hold."

  - name: subscription_package_price
    trigger: "POST /orchestra/subscriptions (NEW variant) and POST /orchestra/subscriptions/{subscription_id}/renew (RENEWAL variant); both write SubscriptionPackage.locked_unit_price_cents and SubscriptionPackage.price_cents"
    algorithm: aggregation
    formula: |
      # STEP 1 — per-line unit price (this is the pinned rounding order)
      NEW:      locked_unit_price_cents = round_half_up(season.base_ticket_price_cents * section.price_multiplier_bp / 10000)
      RENEWAL:  locked_unit_price_cents = prior_package.locked_unit_price_cents      # price lock, prior season's rate
      # STEP 2 — sum the ALREADY-ROUNDED lines. Rounding is per concert line, NOT
      # once over the raw sum: for each concert_id in concert_ids (ordered by the
      # concert's performance_start_utc ASC, tie-break Concert.created_at ASC)
      #     line_total = locked_unit_price_cents * seat_count
      #     subtotal  += line_total
      # STEP 3 — package discount tier, keyed on len(concert_ids)
      package_discount_bp = 1500 if n >= 8 else 1000 if n >= 5 else 500 if n >= 3 else 0
      after_package = round_half_up(subtotal * (10000 - package_discount_bp) / 10000)
      # STEP 4 — loyalty, RENEWAL only
      NEW:      price_cents = after_package
      RENEWAL:  loyalty_bp  = min(LOYALTY_CAP_BP, season.loyalty_discount_bp + 100 * patron.consecutive_renewal_years)
                price_cents = round_half_up(after_package * (10000 - loyalty_bp) / 10000)
    input_set: "All concert ids listed in concert_ids; every one must have season_id == the package's season_id and programming_status IN {PROGRAMMED, LOCKED}. Cancelled concerts are NOT removed from an existing package's price."
    constants:
      LOYALTY_CAP_BP: 2000
      PACKAGE_DISCOUNT_TIERS_BP: { "3_to_4": 500, "5_to_7": 1000, "8_plus": 1500 }
    precision: "integer cents, round_half_up; round each concert line first, then sum, then discount"
    variants:
      - name: NEW
        when: "POST /orchestra/subscriptions"
        difference: "Prices every line at the CURRENT season's base_ticket_price_cents and grants no loyalty discount."
      - name: RENEWAL
        when: "POST /orchestra/subscriptions/{subscription_id}/renew"
        difference: "Prices every line at the PRIOR package's locked_unit_price_cents and then applies the loyalty discount, so an identical concert set / section / seat_count is cheaper than the NEW price whenever the base price moved between seasons."

  - name: musician_service_settlement
    trigger: "POST /orchestra/rehearsals/{service_id}/publish writes MusicianEngagement.provisional_pay_cents; POST /orchestra/rehearsals/{service_id}/clock writes MusicianEngagement.overtime_minutes and final_pay_cents"
    algorithm: weighted_scoring
    formula: |
      premium_bp = (musician.is_principal ? union.principal_premium_bp : 0)
                 + musician.overscale_bp
                 + engagement.doubling_count * union.doubling_premium_bp     # ADDITIVE, never compounded
      base_pay_cents = round_half_up(union.scale_service_fee_cents * (10000 + premium_bp) / 10000)
      PROVISIONAL:
          provisional_pay_cents = base_pay_cents          # scheduled minutes are IGNORED; no overtime is anticipated
      FINAL:
          worked_minutes  = minutes(actual_end_utc - actual_start_utc) - service.break_minutes
          overtime_minutes = max(0, worked_minutes - union.max_service_minutes)      # strict: worked == max => 0
          final_pay_cents  = base_pay_cents + overtime_minutes * union.overtime_rate_cents_per_minute
      # Overtime is a FLAT per-minute rate: it is never multiplied by premium_bp.
    input_set: "Only engagements whose status == CONFIRMED at the moment the service is published (provisional) or clocked out (final). DECLINED and VOIDED engagements are excluded from both sums."
    constants: {}
    precision: "integer cents, round_half_up on base_pay_cents only; overtime is exact integer arithmetic"
    variants:
      - name: PROVISIONAL
        when: "service publication"
        difference: "Uses scale plus premiums only. Identical inputs to FINAL yield a strictly smaller number whenever the clocked worked_minutes exceed union.max_service_minutes."
      - name: FINAL
        when: "service clock-out"
        difference: "Adds clocked overtime measured from actual_start_utc/actual_end_utc minus break_minutes; the delta (final - provisional) is what is posted to Musician.ytd_earnings_cents."

  - name: ad_invoice_total
    trigger: "POST /orchestra/ad-bookings/{booking_id}/decide with decision=APPROVE, writing AdBooking.ad_subtotal_cents, volume_discount_bp, placement_fee_cents and invoice_total_cents"
    algorithm: waterfall_allocation
    formula: |
      # The dependency LOOKS circular — invoice_total = discounted_subtotal + placement_fee,
      # while placement_fee is a percentage of a discounted figure that itself depends on a
      # tier. The evaluation order below is PINNED and makes the value well-defined.
      # 1.
      ad_subtotal_cents = AD_SIZE_RATE_CENTS[ad_size] * insertion_count
      # 2. the volume tier is keyed on the UNDISCOUNTED ad_subtotal_cents, never on the total
      volume_discount_bp = 1200 if ad_subtotal_cents >= 500000
                      else  800 if ad_subtotal_cents >= 250000
                      else  400 if ad_subtotal_cents >= 100000
                      else    0
      # 3.
      discounted_subtotal = round_half_up(ad_subtotal_cents * (10000 - volume_discount_bp) / 10000)
      # 4. the placement fee is a percentage of the DISCOUNTED subtotal, not of ad_subtotal_cents
      placement_fee_cents = round_half_up(discounted_subtotal * PLACEMENT_FEE_BP[placement] / 10000)
      # 5.
      invoice_total_cents = discounted_subtotal + placement_fee_cents
    input_set: "A single AdBooking row; no other bookings of the season participate (there is no cross-booking volume aggregation)."
    constants:
      AD_SIZE_RATE_CENTS: { FULL_PAGE: 120000, HALF_PAGE: 70000, QUARTER_PAGE: 40000 }
      PLACEMENT_FEE_BP: { BACK_COVER: 2500, INSIDE_FRONT_COVER: 1500, RUN_OF_BOOK: 0 }
    precision: "integer cents, round_half_up at steps 3 and 4"

  - name: patron_renewal_priority_score
    trigger: "Recomputed and persisted on POST /orchestra/patrons/{patron_id}/donations, on POST /orchestra/subscriptions/{subscription_id}/pay, on POST /orchestra/seasons/{season_id}/run-ops, and freshly evaluated inside POST /orchestra/subscriptions/{subscription_id}/renew before the priority gate is applied"
    algorithm: weighted_scoring
    formula: |
      seniority_years = 0 if patron.subscriber_since_year is null
                        else max(0, year_of(logical_clock_utc) - patron.subscriber_since_year)
      renewal_priority_score = patron.consecutive_renewal_years * 100
                             + DONOR_POINTS[patron.donor_level]
                             + seniority_years * 10
    input_set: "One Patron row plus the logical clock's UTC year. No season fields participate."
    constants:
      DONOR_POINTS: { NONE: 0, FRIEND: 50, SUSTAINER: 150, BENEFACTOR: 400, LAUREATE: 900 }
    precision: "integer points, no rounding"

  - name: donor_level_derivation
    trigger: "POST /orchestra/patrons/{patron_id}/donations, writing Patron.donor_level"
    algorithm: threshold
    formula: |
      lifetime_donation_cents += amount_cents
      donor_level = LAUREATE   if lifetime_donation_cents >= 5000000
               else BENEFACTOR if lifetime_donation_cents >= 2500000
               else SUSTAINER  if lifetime_donation_cents >= 1000000
               else FRIEND     if lifetime_donation_cents >= 250000
               else NONE
      # Thresholds are inclusive (>=): exactly 250000 cents is FRIEND, 249999 is NONE.
    input_set: "One Patron row. Ticket and subscription payments never contribute to lifetime_donation_cents."
    constants:
      DONOR_THRESHOLDS_CENTS: { FRIEND: 250000, SUSTAINER: 1000000, BENEFACTOR: 2500000, LAUREATE: 5000000 }
    precision: "integer cents"

  - name: concert_readiness_posture
    trigger: "Recomputed at the end of every transition whose side_effects say 'readiness_posture recomputed' — concert programming, contract counter/sign, substitution, service publication, engagement decline, concert cancellation, and the Season RENEWAL_WINDOW -> SINGLE_ON_SALE advance"
    algorithm: constraint_propagation
    formula: |
      # Evaluated top-down; the FIRST matching clause wins.
      BLOCKED  if any GuestArtistContract with concert_id == concert.id has status IN {OFFERED, COUNTERED}
                  AND the concert's Season.status IN {SINGLE_ON_SALE, IN_PROGRESS}
      AT_RISK  elif any RehearsalService with concert_id == concert.id has status == PUBLISHED
                  AND compliance_status == UNDERSTAFFED
      READY    otherwise
    input_set: "GuestArtistContracts of this concert in any status, and RehearsalServices of this concert whose status == PUBLISHED. CANCELLED and DRAFT services are ignored."
    constants: {}
    precision: "enum, no rounding"

  - name: seat_inventory_conservation
    trigger: "Invariant re-established after every mutation of a section_inventory element (subscription create/pay/lapse, ticket hold/pay/expire/refund, concert cancellation)"
    algorithm: aggregation
    formula: |
      # For every Concert C and every element E of C.section_inventory:
      E.held_count = sum(TicketOrder.seat_count where concert_id == C.id
                                                  and seat_section_id == E.seat_section_id
                                                  and status == HELD)
                   + sum(SubscriptionPackage.seat_count where status == PENDING_PAYMENT
                                                  and seat_section_id == E.seat_section_id
                                                  and C.id in concert_ids)
      E.sold_count = sum(TicketOrder.seat_count where concert_id == C.id
                                                  and seat_section_id == E.seat_section_id
                                                  and status == PAID)
                   + sum(SubscriptionPackage.seat_count where status IN {ACTIVE, EXPIRED}
                                                  and seat_section_id == E.seat_section_id
                                                  and C.id in concert_ids)
      E.available_count = E.capacity - E.held_count - E.sold_count
      # CONSERVED QUANTITY: E.capacity == E.available_count + E.held_count + E.sold_count
      # must hold before and after every forward action AND after its compensating
      # action (hold -> expiry, pay -> refund, package create -> lapse).
    input_set: "TicketOrders in {HELD, PAID} and SubscriptionPackages in {PENDING_PAYMENT, ACTIVE, EXPIRED}. EXPIRED / REFUNDED orders and LAPSED packages contribute nothing."
    constants: {}
    precision: "integer seats"

  - name: patron_cash_conservation
    trigger: "Invariant re-established after every Patron money movement (ticket payment, subscription payment, cancellation refund)"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY, for every Patron P:
      P.lifetime_cash_in_cents == P.credit_balance_cents
                                + sum(TicketOrder.amount_paid_cents where patron_id == P.id and status == PAID)
                                + sum(SubscriptionPackage.price_cents where patron_id == P.id and status IN {ACTIVE, EXPIRED})
      # A refund moves an order out of PAID and adds exactly amount_paid_cents to
      # credit_balance_cents, so the identity is preserved with zero drift; spending
      # credit on a later order moves the same cents back the other way.
      # Donations never touch any term of this identity.
    input_set: "TicketOrders with status == PAID and SubscriptionPackages with status IN {ACTIVE, EXPIRED} for that patron."
    constants: {}
    precision: "integer cents"

  - name: musician_service_credit_invariant
    trigger: "Invariant re-established after service publication, engagement decline, engagement void and service clock-out"
    algorithm: aggregation
    formula: |
      # CONSERVED QUANTITY, for every Musician M:
      M.services_charged_ytd == count(MusicianEngagement where musician_id == M.id
                                        and status IN {CONFIRMED, SETTLED}
                                        and provisional_pay_cents is not null)
      # Publishing a service is the forward action (+1 per engagement); declining or
      # voiding an engagement is the compensating action (-1). An engagement that
      # never reached a published service was never charged and is never refunded.
    input_set: "MusicianEngagements of that musician in status CONFIRMED or SETTLED whose provisional_pay_cents has been set."
    constants: {}
    precision: "integer count"

# =============================================================================
# Table 4: Validation Rules Table (evaluated strictly in priority order)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every resource named in the path exists, validated left to right"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_SECTION_NOT_FOUND | ERR_CONCERT_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_MUSICIAN_NOT_FOUND | ERR_SERVICE_NOT_FOUND | ERR_ENGAGEMENT_NOT_FOUND | ERR_PATRON_NOT_FOUND | ERR_SUBSCRIPTION_NOT_FOUND | ERR_TICKET_ORDER_NOT_FOUND | ERR_AD_BOOKING_NOT_FOUND"
    http_status: 404
    applies_to: "all path-parameterised endpoints"

  - priority: 4
    category: business_referential
    check: "Every foreign key supplied in the request body resolves to an existing row (season_id, venue_id, concert_id, seat_section_id, patron_id, musician_id, contract_id, and every element of concert_ids)"
    error_id: "ERR_SEASON_NOT_FOUND | ERR_VENUE_NOT_FOUND | ERR_CONCERT_NOT_FOUND | ERR_SECTION_NOT_FOUND | ERR_PATRON_NOT_FOUND | ERR_MUSICIAN_NOT_FOUND | ERR_CONTRACT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying foreign keys in the body"

  - priority: 5
    category: auth
    check: "For entity_backed roles, X-User-ID equals the id of the entity the request acts for: Patron == patron_id of the target resource, Musician == engagement.musician_id, GuestArtist == contract.id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /orchestra/subscriptions, POST /orchestra/subscriptions/{subscription_id}/pay, POST /orchestra/subscriptions/{subscription_id}/renew, POST /orchestra/ticket-orders, POST /orchestra/ticket-orders/{order_id}/pay, POST /orchestra/engagements/{engagement_id}/decline, POST /orchestra/guest-contracts/{contract_id}/counter, POST /orchestra/guest-contracts/{contract_id}/sign"

  - priority: 6
    category: business_constraint
    check: "Request shape: required fields present, enums within their declared value set, integers within their declared constraints, scheduled_end_utc strictly after scheduled_start_utc, actual_end_utc strictly after actual_start_utc, email unique across patrons"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 7
    category: state
    check: "The target resource itself is in a state that permits the operation (concert DRAFT to program, contract OFFERED/COUNTERED to negotiate, service DRAFT to publish or add engagements, service PUBLISHED to clock, engagement CONFIRMED to decline, order HELD to pay, package PENDING_PAYMENT to pay, package ACTIVE to renew, booking SUBMITTED to decide, concert SCHEDULED to cancel or settle, concert sale_status PUBLIC_ONSALE to create a ticket order)"
    error_id: "ERR_CONCERT_NOT_DRAFT | ERR_CONCERT_NOT_ON_SALE | ERR_CONCERT_ALREADY_CANCELLED | ERR_CONCERT_NOT_SETTLEABLE | ERR_CONTRACT_NOT_NEGOTIABLE | ERR_SERVICE_NOT_DRAFT | ERR_SERVICE_NOT_PUBLISHED | ERR_ENGAGEMENT_NOT_CONFIRMED | ERR_TICKET_ORDER_NOT_HELD | ERR_SUBSCRIPTION_NOT_PENDING | ERR_SUBSCRIPTION_NOT_ACTIVE | ERR_AD_BOOKING_NOT_SUBMITTED"
    http_status: 409
    applies_to: "all state-changing endpoints"

  - priority: 8
    category: state
    check: "Cross-entity state gates: signing a contract requires the parent Concert.programming_status IN {PROGRAMMED, LOCKED}; creating a service requires the same; programming a concert requires Season.status == PLANNING; season advance requires the declared from-state plus its own preconditions; renewing requires the TARGET Season.status == RENEWAL_WINDOW; creating a subscription requires the Season.status IN {RENEWAL_WINDOW, SINGLE_ON_SALE}"
    error_id: "ERR_CONCERT_NOT_PROGRAMMED | ERR_INVALID_SEASON_TRANSITION | ERR_UNION_AGREEMENT_MISSING | ERR_NO_PROGRAMMED_CONCERTS | ERR_RENEWAL_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /orchestra/guest-contracts/{contract_id}/sign, POST /orchestra/rehearsals, POST /orchestra/concerts/{concert_id}/program, POST /orchestra/seasons/{season_id}/advance, POST /orchestra/subscriptions, POST /orchestra/subscriptions/{subscription_id}/renew"

  - priority: 9
    category: state
    check: "Optimistic concurrency: expected_concert_version equals Concert.version, expected_package_version equals SubscriptionPackage.version"
    error_id: "ERR_STALE_CONCERT_VERSION | ERR_STALE_PACKAGE_VERSION"
    http_status: 412
    applies_to: "POST /orchestra/ticket-orders, POST /orchestra/subscriptions/{subscription_id}/renew"

  - priority: 10
    category: business_safety
    check: "Union break rule — a service whose scheduled duration exceeds 90 minutes must schedule at least UnionAgreement.mandatory_break_minutes of break"
    error_id: ERR_UNION_BREAK_VIOLATION
    http_status: 422
    applies_to: "POST /orchestra/rehearsals/{service_id}/publish"

  - priority: 11
    category: business_safety
    check: "Union rest rule — for the musician, the gap between the end of any other CONFIRMED engagement's service and the start of this one (in either direction) must be at least UnionAgreement.min_rest_minutes_between_services; a gap exactly equal to the minimum passes"
    error_id: ERR_UNION_REST_VIOLATION
    http_status: 422
    applies_to: "POST /orchestra/rehearsals/{service_id}/engagements"

  - priority: 12
    category: business_safety
    check: "Union daily-service cap — the musician may not hold more than UnionAgreement.max_services_per_day CONFIRMED engagements whose service scheduled_start_utc falls on the same UTC calendar date, regardless of whether the services overlap in time"
    error_id: ERR_UNION_DAILY_SERVICE_CAP
    http_status: 409
    applies_to: "POST /orchestra/rehearsals/{service_id}/engagements"

  - priority: 13
    category: business_safety
    check: "Doubling limit — doubling_count must not exceed 2"
    error_id: ERR_DOUBLING_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /orchestra/rehearsals/{service_id}/engagements"

  - priority: 14
    category: business_temporal
    check: "Venue changeover rule — a service may not be published when another PUBLISHED service in the same venue satisfies new.scheduled_start_utc < other.scheduled_end_utc + buffer AND other.scheduled_start_utc < new.scheduled_end_utc + buffer, where buffer = Venue.changeover_buffer_minutes; intervals are half-open so a start exactly at other.end + buffer is allowed"
    error_id: ERR_VENUE_CHANGEOVER_CONFLICT
    http_status: 409
    applies_to: "POST /orchestra/rehearsals/{service_id}/publish"

  - priority: 15
    category: business_constraint
    check: "Minimum complement — confirmed_engagement_count >= minimum_complement at publication time"
    error_id: ERR_INSUFFICIENT_COMPLEMENT
    http_status: 409
    applies_to: "POST /orchestra/rehearsals/{service_id}/publish"

  - priority: 16
    category: business_constraint
    check: "Negotiation round cap — an orchestra offer may not be revised once negotiation_round has reached 3"
    error_id: ERR_NEGOTIATION_ROUND_LIMIT
    http_status: 422
    applies_to: "POST /orchestra/guest-contracts/{contract_id}/revise-offer"

  - priority: 17
    category: business_constraint
    check: "Donor seating benefit — a NEW subscription package seated in a SeatSection whose donor_priority_rank <= 2 requires Patron.donor_level IN {BENEFACTOR, LAUREATE}. RENEWAL packages inherit their prior package's section and skip this check."
    error_id: ERR_DONOR_BENEFIT_REQUIRED
    http_status: 422
    applies_to: "POST /orchestra/subscriptions"

  - priority: 18
    category: business_constraint
    check: "Renewal priority — the freshly recomputed Patron.renewal_priority_score must be >= the prior package's SeatSection.min_renewal_priority_score; a score exactly equal to the threshold passes"
    error_id: ERR_RENEWAL_PRIORITY_INSUFFICIENT
    http_status: 422
    applies_to: "POST /orchestra/subscriptions/{subscription_id}/renew"

  - priority: 19
    category: business_constraint
    check: "Package membership — concert_ids must be non-empty, contain no duplicates, and every element must have season_id equal to the package's season_id and programming_status IN {PROGRAMMED, LOCKED}"
    error_id: ERR_PACKAGE_CONCERT_MISMATCH
    http_status: 422
    applies_to: "POST /orchestra/subscriptions, POST /orchestra/subscriptions/{subscription_id}/renew"

  - priority: 20
    category: business_constraint
    check: "Section-venue match — the requested seat_section_id must belong to the venue of the concert (ticket orders) or of every concert in concert_ids (packages)"
    error_id: ERR_SEAT_SECTION_VENUE_MISMATCH
    http_status: 422
    applies_to: "POST /orchestra/ticket-orders, POST /orchestra/subscriptions"

  - priority: 21
    category: business_temporal
    check: "Renewal deadline — the logical clock must be at or before the TARGET Season.renewal_deadline_utc"
    error_id: ERR_RENEWAL_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /orchestra/subscriptions/{subscription_id}/renew"

  - priority: 22
    category: business_fiscal
    check: "Seat availability — for every concert affected, section_inventory.available_count >= the seats being claimed (seat_count for a ticket order, seat_count on every concert of a package)"
    error_id: ERR_INSUFFICIENT_SEATS
    http_status: 409
    applies_to: "POST /orchestra/ticket-orders, POST /orchestra/subscriptions, POST /orchestra/subscriptions/{subscription_id}/renew"

# =============================================================================
# Table 5: API Endpoint Table   (all business paths sit under /orchestra)
# =============================================================================
endpoints:
  # ---------------- Season ----------------
  - method: POST
    path: "/orchestra/seasons"
    description: "Create an artistic season"
    roles: [ArtisticAdmin]
    code: 201
    input: [name, fiscal_year, renewal_deadline_utc, base_ticket_price_cents, "loyalty_discount_bp?"]
    output: Season
    side_effects: ["status=PLANNING, ops_run_index=0, all counters=0"]

  - method: GET
    path: "/orchestra/seasons/{season_id}"
    description: "Read one season"
    roles: [ArtisticAdmin, OrchestraManager, BoxOfficeAgent, AdvertisingSales]
    code: 200
    input: []
    output: Season
    side_effects: []

  - method: POST
    path: "/orchestra/seasons/{season_id}/advance"
    description: "Advance the season to the next lifecycle state"
    roles: [ArtisticAdmin]
    code: 200
    input: [target_status]
    output: Season
    side_effects:
      - "runs the Season transition matching target_status, with all of its declared cascades"
      - "increments Season.version by 1"

  - method: POST
    path: "/orchestra/seasons/{season_id}/run-ops"
    description: "Ops-run checkpoint: advance the housekeeping epoch, expire stale ticket holds and unpaid packages, refresh patron priority scores"
    roles: [ArtisticAdmin, BoxOfficeAgent]
    code: 200
    input: []
    output: Season
    side_effects:
      - "ops_run_index += 1"
      - "HELD ticket orders whose hold_expires_at_ops_run <= ops_run_index become EXPIRED and release their seats"
      - "PENDING_PAYMENT packages past the renewal deadline become LAPSED and release their seats"
      - "renewal_priority_score recomputed for patrons holding packages in this season"
      - "increments Season.version by 1"

  # ---------------- Venue / SeatSection ----------------
  - method: POST
    path: "/orchestra/venues"
    description: "Create a hall"
    roles: [ArtisticAdmin]
    code: 201
    input: [name, "changeover_buffer_minutes?"]
    output: Venue
    side_effects: ["total_capacity=0"]

  - method: GET
    path: "/orchestra/venues/{venue_id}"
    description: "Read one venue"
    roles: [ArtisticAdmin, OrchestraManager, BoxOfficeAgent]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: POST
    path: "/orchestra/sections"
    description: "Create a seating section inside a hall"
    roles: [ArtisticAdmin]
    code: 201
    input: [venue_id, name, capacity, price_multiplier_bp, donor_priority_rank, "min_renewal_priority_score?"]
    output: SeatSection
    side_effects: ["Venue.total_capacity += capacity", "does NOT retro-fit section_inventory onto concerts created earlier"]

  - method: GET
    path: "/orchestra/sections/{section_id}"
    description: "Read one seating section"
    roles: [ArtisticAdmin, OrchestraManager, BoxOfficeAgent, Patron]
    code: 200
    input: []
    output: SeatSection
    side_effects: []

  - method: GET
    path: "/orchestra/sections"
    description: "List seating sections, optionally filtered by hall"
    roles: [ArtisticAdmin, OrchestraManager, BoxOfficeAgent, Patron]
    code: 200
    input: ["venue_id?", "limit?", "offset?"]
    output: SeatSection[]
    side_effects: []

  # ---------------- UnionAgreement ----------------
  - method: POST
    path: "/orchestra/union-agreements"
    description: "Register the collective bargaining terms that govern one season"
    roles: [OrchestraManager]
    code: 201
    input: [season_id, scale_service_fee_cents, "max_service_minutes?", "overtime_rate_cents_per_minute?", "min_rest_minutes_between_services?", "max_services_per_day?", "doubling_premium_bp?", "mandatory_break_minutes?", "principal_premium_bp?"]
    output: UnionAgreement
    side_effects: ["at most one agreement per season, else ERR_UNION_AGREEMENT_DUPLICATE"]

  - method: GET
    path: "/orchestra/union-agreements/{agreement_id}"
    description: "Read one union agreement"
    roles: [ArtisticAdmin, OrchestraManager]
    code: 200
    input: []
    output: UnionAgreement
    side_effects: []

  - method: GET
    path: "/orchestra/union-agreements"
    description: "List union agreements, optionally filtered by season"
    roles: [ArtisticAdmin, OrchestraManager]
    code: 200
    input: ["season_id?", "limit?", "offset?"]
    output: UnionAgreement[]
    side_effects: []

  # ---------------- Concert ----------------
  - method: POST
    path: "/orchestra/concerts"
    description: "Add a concert to a season"
    roles: [ArtisticAdmin]
    code: 201
    input: [season_id, venue_id, title, performance_start_utc, performance_end_utc, program_minutes]
    output: Concert
    side_effects:
      - "programming_status=DRAFT, sale_status=UNANNOUNCED, performance_status=SCHEDULED, readiness_posture=READY"
      - "section_inventory snapshotted from the venue's SeatSections as they exist right now: capacity=section.capacity, held_count=0, sold_count=0, available_count=capacity, fill_bp=0, demand_band=LOW"

  - method: GET
    path: "/orchestra/concerts/{concert_id}"
    description: "Read one concert including its three status dimensions and section_inventory"
    roles: [ArtisticAdmin, OrchestraManager, BoxOfficeAgent, Patron]
    code: 200
    input: []
    output: Concert
    side_effects: []

  - method: GET
    path: "/orchestra/concerts"
    description: "List concerts, optionally filtered by season, venue or sale status"
    roles: [ArtisticAdmin, OrchestraManager, BoxOfficeAgent, Patron]
    code: 200
    input: ["season_id?", "venue_id?", "sale_status?", "limit?", "offset?"]
    output: Concert[]
    side_effects: []

  - method: POST
    path: "/orchestra/concerts/{concert_id}/program"
    description: "Finalise programming for a concert (DRAFT -> PROGRAMMED)"
    roles: [ArtisticAdmin]
    code: 200
    input: []
    output: Concert
    side_effects: ["Season.concerts_programmed_count += 1", "readiness_posture recomputed"]

  - method: POST
    path: "/orchestra/concerts/{concert_id}/cancel"
    description: "Cancel a concert, running CASCADE A (services -> engagements -> musician ledgers) and CASCADE B (ticket orders -> patron credit -> inventory)"
    roles: [ArtisticAdmin]
    code: 200
    input: [reason]
    output: Concert
    side_effects:
      - "performance_status=CANCELLED, sale_status=SALES_CLOSED, Season.concerts_cancelled_count += 1"
      - "CASCADE A and CASCADE B exactly as declared on the Concert SCHEDULED -> CANCELLED transition"
      - "open guest contracts become WITHDRAWN; affected packages recompute fulfilled_concert_count"

  - method: POST
    path: "/orchestra/concerts/{concert_id}/substitute"
    description: "Replace a guest artist: withdraw the named contract and open a fresh offer to a substitute"
    roles: [ArtisticAdmin]
    code: 201
    input: [contract_id, replacement_artist_name, replacement_fee_cents]
    output: GuestArtistContract
    side_effects:
      - "the named contract becomes WITHDRAWN; a replacement contract is created in OFFERED with negotiation_round=1 and the same role_type"
      - "Concert.substitution_count += 1; a LOCKED concert reverts to PROGRAMMED; readiness_posture recomputed"

  - method: POST
    path: "/orchestra/concerts/{concert_id}/settle"
    description: "Mark a concert performed and freeze its box-office revenue"
    roles: [ArtisticAdmin]
    code: 200
    input: []
    output: Concert
    side_effects: ["performance_status=PERFORMED, sale_status=SALES_CLOSED", "gross_ticket_revenue_cents computed from PAID ticket orders"]

  - method: GET
    path: "/orchestra/concerts/{concert_id}/price-quote"
    description: "Computed read: dynamic single-ticket price for one section, optionally personalised to a patron's donor level"
    roles: [BoxOfficeAgent, Patron]
    code: 200
    input: [seat_section_id, "patron_id?", "seat_count?"]
    output: { unit_price_cents: integer, demand_band: string, fill_bp: integer, donor_discount_bp: integer, seat_count: integer, amount_due_cents: integer }
    side_effects: ["none — the quote never checks or reserves availability"]

  # ---------------- GuestArtistContract ----------------
  - method: POST
    path: "/orchestra/guest-contracts"
    description: "Open a guest artist or conductor offer on a concert"
    roles: [ArtisticAdmin]
    code: 201
    input: [concert_id, artist_name, role_type, offered_fee_cents]
    output: GuestArtistContract
    side_effects: ["status=OFFERED, negotiation_round=1"]

  - method: GET
    path: "/orchestra/guest-contracts/{contract_id}"
    description: "Read one guest artist contract"
    roles: [ArtisticAdmin, GuestArtist]
    code: 200
    input: []
    output: GuestArtistContract
    side_effects: []

  - method: GET
    path: "/orchestra/guest-contracts"
    description: "List guest artist contracts, optionally filtered by concert or status"
    roles: [ArtisticAdmin, GuestArtist]
    code: 200
    input: ["concert_id?", "status?", "limit?", "offset?"]
    output: GuestArtistContract[]
    side_effects: []

  - method: POST
    path: "/orchestra/guest-contracts/{contract_id}/counter"
    description: "Artist counters the standing offer (OFFERED -> COUNTERED)"
    roles: [GuestArtist]
    code: 200
    input: [countered_fee_cents]
    output: GuestArtistContract
    side_effects: ["countered_fee_cents stored", "readiness_posture recomputed"]

  - method: POST
    path: "/orchestra/guest-contracts/{contract_id}/revise-offer"
    description: "Orchestra answers a counter with a new offer (COUNTERED -> OFFERED), closing the negotiation cycle"
    roles: [ArtisticAdmin]
    code: 200
    input: [offered_fee_cents]
    output: GuestArtistContract
    side_effects: ["offered_fee_cents replaced, negotiation_round += 1"]

  - method: POST
    path: "/orchestra/guest-contracts/{contract_id}/sign"
    description: "Sign the contract. From OFFERED the artist signs and agreed_fee_cents = offered_fee_cents; from COUNTERED the orchestra signs and agreed_fee_cents = countered_fee_cents"
    roles: [ArtisticAdmin, GuestArtist]
    code: 200
    input: []
    output: GuestArtistContract
    side_effects: ["agreed_fee_cents set per branch", "may drive the parent concert PROGRAMMED -> LOCKED", "readiness_posture recomputed"]

  # ---------------- Musician ----------------
  - method: POST
    path: "/orchestra/musicians"
    description: "Add a musician to the roster"
    roles: [OrchestraManager]
    code: 201
    input: [full_name, instrument, "is_principal?", "overscale_bp?"]
    output: Musician
    side_effects: ["services_charged_ytd=0, ytd_earnings_cents=0"]

  - method: GET
    path: "/orchestra/musicians/{musician_id}"
    description: "Read one musician including the conserved services_charged_ytd counter"
    roles: [ArtisticAdmin, OrchestraManager, Musician]
    code: 200
    input: []
    output: Musician
    side_effects: []

  # ---------------- RehearsalService ----------------
  - method: POST
    path: "/orchestra/rehearsals"
    description: "Schedule a service (rehearsal, dress rehearsal or performance call) for a programmed concert"
    roles: [OrchestraManager]
    code: 201
    input: [concert_id, venue_id, service_type, scheduled_start_utc, scheduled_end_utc, minimum_complement, "break_minutes?"]
    output: RehearsalService
    side_effects: ["status=DRAFT, compliance_status=COMPLIANT, confirmed_engagement_count=0", "venue and union checks are deferred to publication"]

  - method: GET
    path: "/orchestra/rehearsals/{service_id}"
    description: "Read one service"
    roles: [ArtisticAdmin, OrchestraManager, Musician]
    code: 200
    input: []
    output: RehearsalService
    side_effects: []

  - method: GET
    path: "/orchestra/rehearsals"
    description: "List services, optionally filtered by concert, venue or status"
    roles: [ArtisticAdmin, OrchestraManager, Musician]
    code: 200
    input: ["concert_id?", "venue_id?", "status?", "limit?", "offset?"]
    output: RehearsalService[]
    side_effects: []

  - method: POST
    path: "/orchestra/rehearsals/{service_id}/publish"
    description: "Publish the service: enforce the union break rule, the venue changeover rule and the minimum complement, then post provisional pay"
    roles: [OrchestraManager]
    code: 200
    input: []
    output: RehearsalService
    side_effects:
      - "provisional_pay_cents written on every CONFIRMED engagement; provisional_service_cost_cents summed"
      - "Musician.services_charged_ytd += 1 and Musician.ytd_earnings_cents += provisional_pay_cents per engagement"
      - "may drive the parent concert PROGRAMMED -> LOCKED; readiness_posture recomputed"

  - method: POST
    path: "/orchestra/rehearsals/{service_id}/clock"
    description: "Clock the service out and settle it (PUBLISHED -> COMPLETED)"
    roles: [OrchestraManager]
    code: 200
    input: [actual_start_utc, actual_end_utc]
    output: RehearsalService
    side_effects:
      - "overtime_minutes and final_pay_cents written on every CONFIRMED engagement, which then becomes SETTLED"
      - "Musician.ytd_earnings_cents += (final_pay_cents - provisional_pay_cents)"
      - "final_service_cost_cents summed"

  - method: POST
    path: "/orchestra/rehearsals/{service_id}/engagements"
    description: "Book a musician onto a DRAFT service, enforcing the union rest gap, the daily service cap and the doubling limit"
    roles: [OrchestraManager]
    code: 201
    input: [musician_id, "doubling_count?"]
    output: MusicianEngagement
    side_effects: ["status=CONFIRMED", "RehearsalService.confirmed_engagement_count += 1"]

  - method: GET
    path: "/orchestra/engagements/{engagement_id}"
    description: "Read one engagement including provisional and final pay"
    roles: [ArtisticAdmin, OrchestraManager, Musician]
    code: 200
    input: []
    output: MusicianEngagement
    side_effects: []

  - method: GET
    path: "/orchestra/engagements"
    description: "List engagements, optionally filtered by service, musician or status"
    roles: [ArtisticAdmin, OrchestraManager, Musician]
    code: 200
    input: ["service_id?", "musician_id?", "status?", "limit?", "offset?"]
    output: MusicianEngagement[]
    side_effects: []

  - method: POST
    path: "/orchestra/engagements/{engagement_id}/decline"
    description: "Musician declines a booking, running CASCADE C (service complement -> compliance -> concert readiness -> programming unlock)"
    roles: [Musician]
    code: 200
    input: []
    output: MusicianEngagement
    side_effects: ["status=DECLINED", "CASCADE C exactly as declared on the MusicianEngagement CONFIRMED -> DECLINED transition"]

  # ---------------- Patron ----------------
  - method: POST
    path: "/orchestra/patrons"
    description: "Register a patron"
    roles: [BoxOfficeAgent]
    code: 201
    input: [full_name, email, "subscriber_since_year?"]
    output: Patron
    side_effects: ["donor_level=NONE, all ledgers zero, renewal_priority_score computed from seniority alone"]

  - method: GET
    path: "/orchestra/patrons/{patron_id}"
    description: "Read one patron including credit, cash-in and priority score"
    roles: [ArtisticAdmin, BoxOfficeAgent, Patron]
    code: 200
    input: []
    output: Patron
    side_effects: []

  - method: POST
    path: "/orchestra/patrons/{patron_id}/donations"
    description: "Record a philanthropic gift and re-derive the donor level"
    roles: [BoxOfficeAgent]
    code: 200
    input: [amount_cents]
    output: Patron
    side_effects: ["lifetime_donation_cents += amount_cents", "donor_level re-derived", "renewal_priority_score recomputed", "lifetime_cash_in_cents is NOT touched"]

  # ---------------- SubscriptionPackage ----------------
  - method: POST
    path: "/orchestra/subscriptions"
    description: "Build a NEW subscription package and hold its seats on every concert in it"
    roles: [BoxOfficeAgent, Patron]
    code: 201
    input: [patron_id, season_id, seat_section_id, seat_count, concert_ids]
    output: SubscriptionPackage
    side_effects:
      - "package_type=NEW, status=PENDING_PAYMENT"
      - "locked_unit_price_cents and price_cents computed (calculations.subscription_package_price, NEW variant)"
      - "section_inventory.held_count += seat_count on every concert in concert_ids"

  - method: GET
    path: "/orchestra/subscriptions/{subscription_id}"
    description: "Read one subscription package"
    roles: [ArtisticAdmin, BoxOfficeAgent, Patron]
    code: 200
    input: []
    output: SubscriptionPackage
    side_effects: []

  - method: GET
    path: "/orchestra/subscriptions"
    description: "List subscription packages, optionally filtered by patron, season, section, prior package or status"
    roles: [ArtisticAdmin, BoxOfficeAgent, Patron]
    code: 200
    input: ["patron_id?", "season_id?", "seat_section_id?", "prior_package_id?", "status?", "limit?", "offset?"]
    output: SubscriptionPackage[]
    side_effects: []

  - method: POST
    path: "/orchestra/subscriptions/{subscription_id}/pay"
    description: "Pay a pending package, converting held seats to sold seats"
    roles: [BoxOfficeAgent, Patron]
    code: 200
    input: []
    output: SubscriptionPackage
    side_effects:
      - "status=ACTIVE; held seats become sold on every concert of the package"
      - "Patron.lifetime_cash_in_cents += price_cents; consecutive_renewal_years set to 1 (NEW) or incremented (RENEWAL); renewal_priority_score recomputed"

  - method: POST
    path: "/orchestra/subscriptions/{subscription_id}/renew"
    description: "Renew an ACTIVE package into the next season at the locked seat price, guarded by the renewal priority gate and by optimistic concurrency on the prior package"
    roles: [BoxOfficeAgent, Patron]
    code: 201
    input: [season_id, concert_ids, expected_package_version, "seat_count?"]
    output: SubscriptionPackage
    side_effects:
      - "creates a package with package_type=RENEWAL, prior_package_id set, seat_section_id inherited from the prior package, status=PENDING_PAYMENT"
      - "price_cents computed (calculations.subscription_package_price, RENEWAL variant)"
      - "section_inventory.held_count += seat_count on every concert in the new concert_ids"
      - "increments SubscriptionPackage.version by 1 on the PRIOR package"

  # ---------------- TicketOrder ----------------
  - method: POST
    path: "/orchestra/ticket-orders"
    description: "Hold single tickets at the current dynamic price, guarded by optimistic concurrency on the concert"
    roles: [BoxOfficeAgent, Patron]
    code: 201
    input: [concert_id, patron_id, seat_section_id, seat_count, expected_concert_version]
    output: TicketOrder
    side_effects:
      - "status=HELD; quoted_unit_price_cents, amount_due_cents and demand_band_at_hold locked from calculations.single_ticket_dynamic_price"
      - "section_inventory.held_count += seat_count; fill_bp and demand_band recomputed"
      - "hold_expires_at_ops_run = Season.ops_run_index + 2"
      - "increments Concert.version by 1"

  - method: GET
    path: "/orchestra/ticket-orders/{order_id}"
    description: "Read one ticket order"
    roles: [ArtisticAdmin, BoxOfficeAgent, Patron]
    code: 200
    input: []
    output: TicketOrder
    side_effects: []

  - method: GET
    path: "/orchestra/ticket-orders"
    description: "List ticket orders, optionally filtered by concert, patron, section or status"
    roles: [ArtisticAdmin, BoxOfficeAgent, Patron]
    code: 200
    input: ["concert_id?", "patron_id?", "seat_section_id?", "status?", "limit?", "offset?"]
    output: TicketOrder[]
    side_effects: []

  - method: POST
    path: "/orchestra/ticket-orders/{order_id}/pay"
    description: "Settle a held order, optionally spending house credit first"
    roles: [BoxOfficeAgent, Patron]
    code: 200
    input: ["use_credit?"]
    output: TicketOrder
    side_effects:
      - "status=PAID; credit_applied_cents and amount_paid_cents written"
      - "Patron.credit_balance_cents -= credit_applied_cents; Patron.lifetime_cash_in_cents += cash portion"
      - "held seats become sold on the concert's section_inventory"

  # ---------------- AdBooking ----------------
  - method: POST
    path: "/orchestra/ad-bookings"
    description: "Submit a program book advertisement booking"
    roles: [AdvertisingSales]
    code: 201
    input: [season_id, advertiser_name, ad_size, placement, insertion_count]
    output: AdBooking
    side_effects: ["status=SUBMITTED; all invoice fields null"]

  - method: GET
    path: "/orchestra/ad-bookings/{booking_id}"
    description: "Read one ad booking including its invoice breakdown"
    roles: [ArtisticAdmin, AdvertisingSales]
    code: 200
    input: []
    output: AdBooking
    side_effects: []

  - method: GET
    path: "/orchestra/ad-bookings"
    description: "List ad bookings, optionally filtered by season or status"
    roles: [ArtisticAdmin, AdvertisingSales]
    code: 200
    input: ["season_id?", "status?", "limit?", "offset?"]
    output: AdBooking[]
    side_effects: []

  - method: POST
    path: "/orchestra/ad-bookings/{booking_id}/decide"
    description: "Approve or reject a submitted ad booking; approval computes the invoice"
    roles: [AdvertisingSales]
    code: 200
    input: [decision]
    output: AdBooking
    side_effects:
      - "APPROVE: ad_subtotal_cents, volume_discount_bp, placement_fee_cents, invoice_total_cents computed and Season.program_book_revenue_cents increased"
      - "REJECT: status=REJECTED, invoice fields stay null"

  # ---------------- test-driving endpoint ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [ArtisticAdmin, OrchestraManager, BoxOfficeAgent, AdvertisingSales]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["every deadline, calendar-date and seniority rule reads this clock"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- auth / shape ---
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, or the role is not one of the seven declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not listed on the endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "An entity_backed role acts on a resource whose owning id differs from X-User-ID" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing required field, unknown enum value, out-of-range integer, non-increasing time pair, or duplicate patron email" }
  # --- existence ---
  - { id: ERR_SEASON_NOT_FOUND, http: 404, condition: "season_id in path or body does not resolve" }
  - { id: ERR_VENUE_NOT_FOUND, http: 404, condition: "venue_id in path or body does not resolve" }
  - { id: ERR_SECTION_NOT_FOUND, http: 404, condition: "section_id or seat_section_id does not resolve" }
  - { id: ERR_CONCERT_NOT_FOUND, http: 404, condition: "concert_id in path, body or concert_ids does not resolve" }
  - { id: ERR_CONTRACT_NOT_FOUND, http: 404, condition: "contract_id in path or body does not resolve" }
  - { id: ERR_MUSICIAN_NOT_FOUND, http: 404, condition: "musician_id in path or body does not resolve" }
  - { id: ERR_SERVICE_NOT_FOUND, http: 404, condition: "service_id in path does not resolve" }
  - { id: ERR_ENGAGEMENT_NOT_FOUND, http: 404, condition: "engagement_id in path does not resolve" }
  - { id: ERR_PATRON_NOT_FOUND, http: 404, condition: "patron_id in path or body does not resolve" }
  - { id: ERR_SUBSCRIPTION_NOT_FOUND, http: 404, condition: "subscription_id in path does not resolve" }
  - { id: ERR_TICKET_ORDER_NOT_FOUND, http: 404, condition: "order_id in path does not resolve" }
  - { id: ERR_AD_BOOKING_NOT_FOUND, http: 404, condition: "booking_id in path does not resolve" }
  # --- season / concert state ---
  - { id: ERR_INVALID_SEASON_TRANSITION, http: 409, condition: "target_status is not the successor of the season's current status, the renewal deadline has not been reached for SINGLE_ON_SALE, a concert is still SCHEDULED when closing, run-ops is called on a CLOSED season, or an ad booking is decided on a CLOSED season" }
  - { id: ERR_UNION_AGREEMENT_MISSING, http: 409, condition: "Advancing to RENEWAL_WINDOW, publishing a service or booking an engagement while the season has no UnionAgreement" }
  - { id: ERR_UNION_AGREEMENT_DUPLICATE, http: 409, condition: "A second UnionAgreement is registered for a season that already has one" }
  - { id: ERR_NO_PROGRAMMED_CONCERTS, http: 409, condition: "Advancing to RENEWAL_WINDOW while concerts_programmed_count == 0" }
  - { id: ERR_CONCERT_NOT_DRAFT, http: 409, condition: "Programming a concert whose programming_status is not DRAFT" }
  - { id: ERR_CONCERT_NOT_PROGRAMMED, http: 409, condition: "Signing a contract or scheduling a service while the concert's programming_status is DRAFT" }
  - { id: ERR_CONCERT_NOT_ON_SALE, http: 409, condition: "Creating a ticket order while the concert's sale_status is not PUBLIC_ONSALE" }
  - { id: ERR_CONCERT_ALREADY_CANCELLED, http: 409, condition: "Cancelling a concert that is not SCHEDULED, or paying a ticket order for a concert that is no longer SCHEDULED" }
  - { id: ERR_CONCERT_NOT_SETTLEABLE, http: 409, condition: "Settling a concert that is not SCHEDULED, whose season is not IN_PROGRESS, or that still has a PUBLISHED service which has not been clocked out" }
  # --- contract / service / engagement state ---
  - { id: ERR_CONTRACT_NOT_NEGOTIABLE, http: 409, condition: "Counter, revise-offer, sign or substitute applied to a contract whose status does not permit it" }
  - { id: ERR_SERVICE_NOT_DRAFT, http: 409, condition: "Publishing or adding an engagement to a service whose status is not DRAFT" }
  - { id: ERR_SERVICE_NOT_PUBLISHED, http: 409, condition: "Clocking a service that is not PUBLISHED, or declining an engagement whose service is CANCELLED or COMPLETED" }
  - { id: ERR_ENGAGEMENT_NOT_CONFIRMED, http: 409, condition: "Declining an engagement that is not CONFIRMED" }
  # --- subscription / ticket / ad state ---
  - { id: ERR_SUBSCRIPTION_NOT_PENDING, http: 409, condition: "Paying a package whose status is not PENDING_PAYMENT" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Renewing a package whose status is not ACTIVE" }
  - { id: ERR_TICKET_ORDER_NOT_HELD, http: 409, condition: "Paying a ticket order whose status is not HELD" }
  - { id: ERR_AD_BOOKING_NOT_SUBMITTED, http: 409, condition: "Deciding an ad booking whose status is not SUBMITTED" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 409, condition: "Renewing into a season whose status is not RENEWAL_WINDOW" }
  - { id: ERR_RENEWAL_DEADLINE_PASSED, http: 409, condition: "Renewing after the logical clock has passed the target season's renewal_deadline_utc" }
  # --- optimistic concurrency ---
  - { id: ERR_STALE_CONCERT_VERSION, http: 412, condition: "expected_concert_version does not equal the concert's current version" }
  - { id: ERR_STALE_PACKAGE_VERSION, http: 412, condition: "expected_package_version does not equal the prior package's current version" }
  # --- union safety ---
  - { id: ERR_UNION_BREAK_VIOLATION, http: 422, condition: "Publishing a service longer than 90 scheduled minutes with break_minutes below mandatory_break_minutes" }
  - { id: ERR_UNION_REST_VIOLATION, http: 422, condition: "Booking a musician whose rest gap to another CONFIRMED engagement is shorter than min_rest_minutes_between_services" }
  - { id: ERR_UNION_DAILY_SERVICE_CAP, http: 409, condition: "Booking a musician who already holds max_services_per_day CONFIRMED engagements on that UTC calendar date" }
  - { id: ERR_DOUBLING_LIMIT_EXCEEDED, http: 422, condition: "doubling_count greater than 2" }
  # --- temporal / capacity / benefit ---
  - { id: ERR_VENUE_CHANGEOVER_CONFLICT, http: 409, condition: "Publishing a service that collides with another PUBLISHED service in the same hall once the changeover buffer is added to both ends" }
  - { id: ERR_INSUFFICIENT_COMPLEMENT, http: 409, condition: "Publishing a service whose confirmed_engagement_count is below minimum_complement" }
  - { id: ERR_NEGOTIATION_ROUND_LIMIT, http: 422, condition: "Revising an offer when negotiation_round has already reached 3" }
  - { id: ERR_DONOR_BENEFIT_REQUIRED, http: 422, condition: "A NEW package seated in a section with donor_priority_rank <= 2 for a patron below BENEFACTOR" }
  - { id: ERR_RENEWAL_PRIORITY_INSUFFICIENT, http: 422, condition: "renewal_priority_score below the seat section's min_renewal_priority_score at renewal time" }
  - { id: ERR_PACKAGE_CONCERT_MISMATCH, http: 422, condition: "concert_ids empty, containing duplicates, referencing another season, or referencing a concert still in DRAFT programming" }
  - { id: ERR_SEAT_SECTION_VENUE_MISMATCH, http: 422, condition: "The requested seat section does not belong to the venue of the concert being ticketed or packaged" }
  - { id: ERR_INSUFFICIENT_SEATS, http: 409, condition: "available_count on the affected section_inventory element is smaller than the seats being claimed" }

# =============================================================================
# Table 7: RBAC Matrix (peer roles — each role owns a different resource family)
# =============================================================================
roles:
  - name: ArtisticAdmin
    description: "Artistic administration — owns seasons, concerts, programming, guest artist offers, cancellation and substitution"
    identity: "opaque"
    exclusive_operations:
      - "POST /orchestra/seasons"
      - "POST /orchestra/seasons/{season_id}/advance"
      - "POST /orchestra/venues"
      - "POST /orchestra/sections"
      - "POST /orchestra/concerts"
      - "POST /orchestra/concerts/{concert_id}/program"
      - "POST /orchestra/concerts/{concert_id}/cancel"
      - "POST /orchestra/concerts/{concert_id}/substitute"
      - "POST /orchestra/concerts/{concert_id}/settle"
      - "POST /orchestra/guest-contracts"
      - "POST /orchestra/guest-contracts/{contract_id}/revise-offer"
    shared_operations:
      - "POST /orchestra/seasons/{season_id}/run-ops (with BoxOfficeAgent)"
      - "POST /orchestra/guest-contracts/{contract_id}/sign (with GuestArtist)"
      - "all GET endpoints except price-quote"

  - name: OrchestraManager
    description: "Orchestra personnel manager — owns the roster, the union agreement, services and engagements"
    identity: "opaque"
    exclusive_operations:
      - "POST /orchestra/union-agreements"
      - "POST /orchestra/musicians"
      - "POST /orchestra/rehearsals"
      - "POST /orchestra/rehearsals/{service_id}/publish"
      - "POST /orchestra/rehearsals/{service_id}/clock"
      - "POST /orchestra/rehearsals/{service_id}/engagements"
    shared_operations:
      - "GET on seasons, venues, sections, concerts, union agreements, musicians, services and engagements"
      - "POST /_clock/set_current_utc"

  - name: BoxOfficeAgent
    description: "Box office operator — registers patrons, records gifts, builds and settles packages and single-ticket orders on a patron's behalf"
    identity: "opaque"
    exclusive_operations:
      - "POST /orchestra/patrons"
      - "POST /orchestra/patrons/{patron_id}/donations"
    shared_operations:
      - "POST /orchestra/subscriptions, /pay, /renew (with Patron)"
      - "POST /orchestra/ticket-orders and /pay (with Patron)"
      - "GET /orchestra/concerts/{concert_id}/price-quote (with Patron)"
      - "POST /orchestra/seasons/{season_id}/run-ops (with ArtisticAdmin)"

  - name: Patron
    description: "A subscriber or single-ticket buyer acting for themself"
    identity: "entity_backed:Patron"
    exclusive_operations: []
    shared_operations:
      - "POST /orchestra/subscriptions, /pay, /renew — only when X-User-ID equals the package's patron_id"
      - "POST /orchestra/ticket-orders and /pay — only when X-User-ID equals the order's patron_id"
      - "GET on their own patron record, packages, orders, plus concerts, sections and price quotes"

  - name: Musician
    description: "A roster musician acting for themself"
    identity: "entity_backed:Musician"
    exclusive_operations:
      - "POST /orchestra/engagements/{engagement_id}/decline — only when X-User-ID equals the engagement's musician_id"
    shared_operations:
      - "GET on their own musician record, services and engagements"

  - name: GuestArtist
    description: "A guest soloist or conductor negotiating one contract; the contract row IS the identity"
    identity: "entity_backed:GuestArtistContract"
    exclusive_operations:
      - "POST /orchestra/guest-contracts/{contract_id}/counter — only when X-User-ID equals the contract's id"
    shared_operations:
      - "POST /orchestra/guest-contracts/{contract_id}/sign (with ArtisticAdmin; the artist may only sign from OFFERED and only their own contract)"
      - "GET on guest contracts"

  - name: AdvertisingSales
    description: "Program book advertising sales — owns ad bookings and their approval"
    identity: "opaque"
    exclusive_operations:
      - "POST /orchestra/ad-bookings"
      - "POST /orchestra/ad-bookings/{booking_id}/decide"
    shared_operations:
      - "GET on seasons and ad bookings"
      - "POST /_clock/set_current_utc"
