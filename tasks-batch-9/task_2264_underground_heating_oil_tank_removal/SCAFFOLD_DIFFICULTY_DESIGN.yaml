              payload: { event: "MOBILIZE" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "START" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "COMPLETE", actual_excavated_cubic_yards: 9.5, hauled_tons: 12.4 }
              as: FieldTechnician
            - call: "POST /laboratories"
              payload: { lab_name: "Tannery Lane Labs", accredited: true, committed_turnaround_hours: 72, holding_time_hours: 336, max_concurrent_analyses: 2 }
              as: ComplianceOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /soil-samples"
              payload: { tank_project_id: "${proj_id}", work_order_id: "${wo_id}", laboratory_id: "${lab_id}", sample_point: "TANK_BOTTOM", depth_inches: 96 }
