scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: event_charge_provisional_vs_final_diverge
        grounds:
          - calculations.event_charge
          - entities.Event.fields.provisional_grand_total_cents
          - entities.Event.fields.final_grand_total_cents
          - entities.Event.fields.deposit_due_cents
        distinguishing_aspect: "On the Event cost domain, PROVISIONAL (overage_hours=0) and FINAL (actual billable_hours) diverge for the same 5h event: provisional_grand_total_cents=277440 but final_grand_total_cents=311440."
        test_recipe:
          setup:
            - "One CLASSIC package (base 150000, included 50 guests / 4 hours, per_guest 1800, per_hour 25000)."
            - "One event, 80 guests, 18:00-23:00 (5h => billable 5, one overage hour)."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Host", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic Cocktail", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
          assert:
            - "Event.${event_id}.provisional_grand_total_cents == 277440"
            - "Event.${event_id}.final_grand_total_cents == 311440"
            - "Event.${event_id}.deposit_due_cents == 138720"
            - "Event.${event_id}.provisional_grand_total_cents != Event.${event_id}.final_grand_total_cents"

      - name: bartender_reliability_strict_vs_lenient_diverge
        grounds:
          - calculations.bartender_reliability_score
          - entities.Bartender.fields.reliability_score_strict
          - entities.Bartender.fields.reliability_score_lenient
          - state_machines.Assignment.CONFIRMED_to_NO_SHOW
        distinguishing_aspect: "On the Bartender risk domain (not cost), STRICT and LENIENT diverge for a history of 1 no-show + 1 bartender-cancel: reliability_score_strict=0 while reliability_score_lenient=17."
        test_recipe:
          setup:
            - "A cleared event so assignments can be confirmed; one bartender with two non-overlapping shifts."
            - "One assignment confirmed then no-showed; a second assignment cancelled by the bartender."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada Host", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /bartenders"
              payload: { full_name: "Ben Bar", email: "ben@x.com", certification_expiry: "2027-01-01T00:00:00Z", hourly_rate_cents: 4000, home_state_code: "CA" }
              as: PlatformAdmin
              captures: { bartender_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/compliance-review"
              payload: { abc_model: "HOST_NO_SALE", liquor_liability_insurance_verified: true, host_alcohol_ownership_attested: true, server_certification_verified: true }
              as: Coordinator
              captures: { review_id: $.data.id }
            - call: "POST /compliance-reviews/${review_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /compliance-reviews/${review_id}/clear"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /events/${event_id}"
              payload: {}
              as: Coordinator
              captures: { ev_v1: $.data.version }
            - call: "POST /events/${event_id}/assignments"
              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-01T17:00:00Z", shift_end: "2026-06-01T19:00:00Z", role_on_event: "BACK", expected_event_version: "${ev_v1}" }
              as: Coordinator
              captures: { asg1_id: $.data.id }
            - call: "POST /assignments/${asg1_id}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /assignments/${asg1_id}/no-show"
              payload: {}
              as: Coordinator
            - call: "GET /events/${event_id}"
              payload: {}
              as: Coordinator
              captures: { ev_v2: $.data.version }
            - call: "POST /events/${event_id}/assignments"
              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-01T21:00:00Z", shift_end: "2026-06-01T23:00:00Z", role_on_event: "BACK", expected_event_version: "${ev_v2}" }
              as: Coordinator
              captures: { asg2_id: $.data.id }
          trigger:
            - call: "POST /assignments/${asg2_id}/cancel"
              payload: {}
              as: Bartender
              as_user_id: "${bartender_id}"
          assert:
            - "Bartender.${bartender_id}.reliability_score_strict == 0"
            - "Bartender.${bartender_id}.reliability_score_lenient == 17"
            - "Bartender.${bartender_id}.reliability_score_strict != Bartender.${bartender_id}.reliability_score_lenient"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: event_charge_tiered_service_fee_mode_a
        grounds:
          - calculations.event_charge
          - entities.Event.fields.service_fee_cents
          - entities.Event.fields.subtotal_cents
        distinguishing_aspect: "Mode (a): >=3 inputs with non-linear interaction — guest-count-tiered pct selection nested inside min(max(round(subtotal*pct), 25000), 200000); an 80-guest event yields service_fee_cents=41220 at the 0.18 tier."
        test_recipe:
          setup:
            - "CLASSIC package; one 80-guest, 5h event so subtotal=229000 and guest tier is 0.18."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
          assert:
            - "Event.${event_id}.subtotal_cents == 229000"
            - "Event.${event_id}.service_fee_cents == 41220"
            - "Event.${event_id}.gratuity_cents == 41220"

      - name: inventory_rounding_order_mode_b
        grounds:
          - calculations.inventory_requirement
          - entities.InventoryPlan.fields.total_servings
          - entities.InventoryPlan.fields.spirit_bottles
        distinguishing_aspect: "Mode (b): pinned rounding order — ceil the total (500) FIRST, split by ratio with the remainder assigned to spirits (200/150/150 servings), THEN ceil each to purchase units (beer 200, wine 30, spirits 10); a per-guest-then-sum order would differ."
        test_recipe:
          setup:
            - "CLASSIC package (drinks_per_guest_per_hour 1.25); one 80-guest, 5h event => 500 total servings."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/inventory-plan"
              payload: {}
              as: Coordinator
              captures: { plan_id: $.data.id }
          assert:
            - "InventoryPlan.${plan_id}.total_servings == 500"
            - "InventoryPlan.${plan_id}.beer_units == 200"
            - "InventoryPlan.${plan_id}.wine_bottles == 30"
            - "InventoryPlan.${plan_id}.spirit_bottles == 10"
            - "InventoryPlan.${plan_id}.ice_lbs == 120"
            - "InventoryPlan.${plan_id}.glassware_needed == 200"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: event_parallel_booking_and_payment_dimensions
        grounds:
          - state_machines.Event.DRAFT_to_CONFIRMED
          - entities.Event.fields.booking_status
          - entities.Event.fields.payment_status
        distinguishing_aspect: "On Event, booking_status and payment_status are parallel independent dimensions: paying the deposit advances payment_status to DEPOSIT_PAID while booking_status remains DRAFT (unchanged) until a separate confirm."
        test_recipe:
          setup:
            - "One event with a paid deposit but not yet confirmed."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /events/${event_id}/payments"
              payload: { payment_type: "DEPOSIT", amount_cents: 138720, method: "CARD" }
              as: Client
              as_user_id: "${client_id}"
          assert:
            - "Event.${event_id}.payment_status == DEPOSIT_PAID"
            - "Event.${event_id}.booking_status == DRAFT"
            - "Event.${event_id}.amount_paid_cents == 138720"

      - name: compliance_review_resubmit_cycle
        grounds:
          - state_machines.ComplianceReview.SUBMITTED_to_CHANGES_REQUESTED
          - state_machines.ComplianceReview.CHANGES_REQUESTED_to_SUBMITTED
          - entities.ComplianceReview.fields.revision_round
        distinguishing_aspect: "On ComplianceReview (a different entity), the machine is cyclic: SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED -> CLEARED, and revision_round increments to 1 after the resubmit loop."
        test_recipe:
          setup:
            - "A review submitted, sent back for changes, resubmitted, then cleared."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/compliance-review"
              payload: { abc_model: "HOST_NO_SALE", liquor_liability_insurance_verified: false, host_alcohol_ownership_attested: true, server_certification_verified: true }
              as: Coordinator
              captures: { review_id: $.data.id }
            - call: "POST /compliance-reviews/${review_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /compliance-reviews/${review_id}/request-changes"
              payload: { reviewer_notes: "insurance cert missing" }
              as: ComplianceOfficer
            - call: "POST /compliance-reviews/${review_id}/submit"
              payload: { liquor_liability_insurance_verified: true }
              as: Coordinator
          trigger:
            - call: "POST /compliance-reviews/${review_id}/clear"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "ComplianceReview.${review_id}.status == CLEARED"
            - "ComplianceReview.${review_id}.revision_round == 1"
            - "Event.${event_id}.compliance_posture == CLEARED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: compliance_reject_blocks_event_reverts_assignment_depth3
        grounds:
          - state_machines.ComplianceReview.CLEARED_to_CHANGES_REQUESTED
          - state_machines.Assignment.CONFIRMED_to_CONFIRMED
          - entities.Event.fields.compliance_posture
          - entities.Assignment.fields.status
        distinguishing_aspect: "Depth-3 chain from request-changes: ComplianceReview->CHANGES_REQUESTED causes Event.compliance_posture=BLOCKED, which causes the CONFIRMED Assignment to revert to PROPOSED, which causes that Bartender's reliability recompute — each hop caused by the prior."
        test_recipe:
          setup:
            - "A cleared event with one CONFIRMED assignment; then compliance is re-opened."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /bartenders"
              payload: { full_name: "Ben", email: "ben@x.com", certification_expiry: "2027-01-01T00:00:00Z", hourly_rate_cents: 4000, home_state_code: "CA" }
              as: PlatformAdmin
              captures: { bartender_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/compliance-review"
              payload: { abc_model: "HOST_NO_SALE", liquor_liability_insurance_verified: true, host_alcohol_ownership_attested: true, server_certification_verified: true }
              as: Coordinator
              captures: { review_id: $.data.id }
            - call: "POST /compliance-reviews/${review_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /compliance-reviews/${review_id}/clear"
              payload: {}
              as: ComplianceOfficer
            - call: "GET /events/${event_id}"
              payload: {}
              as: Coordinator
              captures: { ev_v1: $.data.version }
            - call: "POST /events/${event_id}/assignments"
              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-01T17:00:00Z", shift_end: "2026-06-01T23:30:00Z", role_on_event: "LEAD", expected_event_version: "${ev_v1}" }
              as: Coordinator
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/confirm"
              payload: {}
              as: Coordinator
          trigger:
            - call: "POST /compliance-reviews/${review_id}/request-changes"
              payload: { reviewer_notes: "re-inspection: insurance lapsed" }
              as: ComplianceOfficer
          assert:
            - "ComplianceReview.${review_id}.status == CHANGES_REQUESTED"
            - "Event.${event_id}.compliance_posture == BLOCKED"
            - "Assignment.${asg_id}.status == PROPOSED"

      - name: breakage_settle_charges_event_depth2
        grounds:
          - state_machines.BreakageReport.DRAFT_to_SETTLED
          - entities.Payment.fields.payment_type
          - entities.Event.fields.balance_due_cents
        distinguishing_aspect: "Depth-2 chain from settle (a different trigger): BreakageReport->SETTLED creates a BREAKAGE_CHARGE Payment (3000), which causes Event.balance_due_cents / payment_status to be recomputed."
        test_recipe:
          setup:
            - "An in-progress event whose kit was deployed (200 glasses) and returned; a DRAFT breakage report with 10 broken / 190 returned."
          setup_api_calls:
            - call: "POST /clients"
              payload: { full_name: "Ada", email: "ada@x.com", phone: "555-1", home_state_code: "CA" }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /packages"
              payload: { tier: "CLASSIC", name: "Classic", base_price_cents: 150000, included_guest_count: 50, per_guest_overage_cents: 1800, included_hours: 4, min_hours: 3, per_hour_overage_cents: 25000, drinks_per_guest_per_hour: 1.25, guests_per_bartender: 50 }
              as: PlatformAdmin
              captures: { package_id: $.data.id }
            - call: "POST /bartenders"
              payload: { full_name: "Ben", email: "ben@x.com", certification_expiry: "2027-01-01T00:00:00Z", hourly_rate_cents: 4000, home_state_code: "CA" }
              as: PlatformAdmin
              captures: { bartender_id: $.data.id }
            - call: "POST /bar-kits"
              payload: { kit_name: "Full Bar A", station_type: "FULL_BAR", glassware_count: 200 }
              as: PlatformAdmin
              captures: { kit_id: $.data.id }
            - call: "POST /events"
              payload: { client_id: "${client_id}", package_id: "${package_id}", title: "Gala", venue_state_code: "CA", venue_type: "INDOOR", event_start: "2026-06-01T18:00:00Z", event_end: "2026-06-01T23:00:00Z", guest_count: 80 }
              as: Client
              as_user_id: "${client_id}"
              captures: { event_id: $.data.id }
            - call: "POST /events/${event_id}/compliance-review"
              payload: { abc_model: "HOST_NO_SALE", liquor_liability_insurance_verified: true, host_alcohol_ownership_attested: true, server_certification_verified: true }
              as: Coordinator
              captures: { review_id: $.data.id }
            - call: "POST /compliance-reviews/${review_id}/submit"
              payload: {}
              as: Coordinator
            - call: "POST /compliance-reviews/${review_id}/clear"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /events/${event_id}/payments"
              payload: { payment_type: "DEPOSIT", amount_cents: 138720, method: "CARD" }
              as: Client
              as_user_id: "${client_id}"
            - call: "POST /events/${event_id}/confirm"
              payload: {}
              as: Client
              as_user_id: "${client_id}"
            - call: "GET /events/${event_id}"
              payload: {}
              as: Coordinator
              captures: { ev_v1: $.data.version }
            - call: "POST /events/${event_id}/assignments"
              payload: { bartender_id: "${bartender_id}", shift_start: "2026-06-01T17:00:00Z", shift_end: "2026-06-01T23:30:00Z", role_on_event: "LEAD", expected_event_version: "${ev_v1}" }
              as: Coordinator
              captures: { asg_id: $.data.id }
            - call: "POST /assignments/${asg_id}/confirm"
              payload: {}
              as: Coordinator
            - call: "POST /assignments/${asg_id}/check-in"
              payload: {}
              as: Bartender
              as_user_id: "${bartender_id}"
            - call: "POST /events/${event_id}/start"
              payload: {}
              as: Coordinator
            - call: "POST /events/${event_id}/kit-reservations"
              payload: { kit_id: "${kit_id}", reserve_start: "2026-06-01T16:00:00Z", reserve_end: "2026-06-02T00:00:00Z" }
              as: Coordinator
              captures: { resv_id: $.data.id }
            - call: "POST /kit-reservations/${resv_id}/deploy"
              payload: {}
              as: Coordinator
            - call: "POST /kit-reservations/${resv_id}/return"
              payload: {}
              as: Coordinator
            - call: "POST /events/${event_id}/breakage-reports"
              payload: { kit_id: "${kit_id}", items_broken: 10, items_returned: 190 }
              as: Coordinator
              captures: { report_id: $.data.id }
          trigger:
            - call: "POST /breakage-reports/${report_id}/settle"
              payload: {}
              as: Coordinator
          assert:
            - "BreakageReport.${report_id}.status == SETTLED"
            - "BreakageReport.${report_id}.breakage_fee_cents == 3000"
            - "Event.${event_id}.balance_due_cents == 175720"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: confirm_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - state_machines.Event.DRAFT_to_CONFIRMED
        distinguishing_aspect: "state (priority 6, ERR_INVALID_STATE) vs business_fiscal (priority 10, ERR_DEPOSIT_NOT_PAID): confirming an already-CANCELLED event with no deposit returns ERR_INVALID_STATE, not ERR_DEPOSIT_NOT_PAID."
        test_recipe:
          setup:
            - "A DRAFT event cancelled with no deposit paid; then a confirm is attempted."
          setup_api_calls:
            - call: "POST /clients"
