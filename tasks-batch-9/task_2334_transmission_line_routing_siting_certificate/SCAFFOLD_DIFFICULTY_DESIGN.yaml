# =============================================================================
# Task 2334 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids / 23 instances. Every numeric assert below was computed with a
# Decimal script against the §1.3 formulas and their constants.
# YAML anchors (&k01 …) let later instances replay the canonical chain without
# re-transcribing it; every alias is the identical call object.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: route_score_variants_diverge_on_desktop_segments
        grounds:
          - calculations.route_constraint_score
          - entities.Route.fields.constraint_score_preliminary
          - entities.Route.fields.constraint_score_certified
          - entities.RouteSegment.fields.survey_status
          - state_machines.Route.DRAFT_to_CONSTRAINT_MAPPED
        distinguishing_aspect: |
          Dual-variant logic on the Route domain: identical segment data yields
          constraint_score_preliminary == 67.28 and constraint_score_certified == 82.23 because the
          CERTIFIED variant substitutes worst-case environmental and cultural ratings of 5 on the two
          DESKTOP segments while the PRELIMINARY variant uses the stored ratings.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default"
            - "A KV_345 project whose planning study is CERTIFIED_SUFFICIENT so routes may be created"
            - "A PROPOSED route with three segments: 10.0mi DESKTOP (3/4/2/3), 6.0mi FIELD_VERIFIED (2/2/1/4), 4.0mi DESKTOP (4/5/3/2)"
          setup_api_calls:
            - &k01
              call: "POST /siting/projects"
              payload: { name: "Harlan-Boone 345kV Rebuild", voltage_class: "KV_345", jurisdiction_state: "KY", target_energization_at: "2028-04-01T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { proj: "$.data.id" }
            - &k02
              call: "POST /siting/planning-studies"
              payload: { project_id: "${proj}", horizon_year: 2032, reliability_deficit_mw: 400, transmission_capex_cents: 80000000000, benefit_pv_cents: 80000000000 }
              as: Developer
              as_user_id: "dev-nora"
              captures: { study: "$.data.id" }
            - &k03
              call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "TRANSMISSION", description: "New 345kV single-circuit line", capex_cents: 80000000000, deliverable_mw: 400 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt1: "$.data.id" }
            - &k04
              call: "POST /siting/alternatives"
              payload: { study_id: "${study}", kind: "NON_TRANSMISSION", description: "Battery storage plus demand response portfolio", capex_cents: 46000000000, deliverable_mw: 200 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt2: "$.data.id" }
            - &k05
              call: "POST /siting/alternatives/${alt1}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Meets deficit in full" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - &k06
              call: "POST /siting/alternatives/${alt2}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Credible non-wires portfolio" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - &k07
              call: "POST /siting/planning-studies/${study}/sufficiency-certification"
              payload: { attestation_note: "Need case reviewed by independent engineer" }
              as: Developer
              as_user_id: "dev-milo"
            - &k08
              call: "POST /siting/routes"
              payload: { project_id: "${proj}", label: "Route A - river crossing", kind: "PROPOSED" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { routeA: "$.data.id" }
            - &d09
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 1, miles: 10.0, land_use_rating: 3, environmental_rating: 4, cultural_rating: 2, engineering_rating: 3, county: "Harlan", crew_capacity: 12, survey_status: "DESKTOP", habitat_blackout: true, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { seg1: "$.data.id" }
            - &k10
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 2, miles: 6.0, land_use_rating: 2, environmental_rating: 2, cultural_rating: 1, engineering_rating: 4, county: "Boone", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: false, federal_crossing_kind: "NAVIGABLE_WATERWAY" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { seg2: "$.data.id" }
            - &k11
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 3, miles: 4.0, land_use_rating: 4, environmental_rating: 5, cultural_rating: 3, engineering_rating: 2, county: "Clay", crew_capacity: 12, survey_status: "DESKTOP", habitat_blackout: false, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { seg3: "$.data.id" }
          trigger:
            - &k12
              call: "POST /siting/routes/${routeA}/constraint-mapping"
              payload: { mapping_note: "Desk study plus one field-verified segment" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
          assert:
            - "Route.${routeA}.constraint_score_preliminary == 67.28"
            - "Route.${routeA}.constraint_score_certified == 82.23"
            - "Route.${routeA}.total_miles == 20.0"
            - "Route.${routeA}.constraint_density_certified == 4.11"
            - "Route.${routeA}.unsurveyed_segment_count == 2"
            - "Route.${routeA}.status == CONSTRAINT_MAPPED"

      - name: easement_value_variants_diverge_offer_vs_award
        grounds:
          - calculations.easement_compensation
          - entities.EasementTract.fields.offered_compensation_cents
          - entities.EasementTract.fields.award_cents
          - state_machines.EasementTract.CONDEMNATION_FILED_to_AWARDED
        distinguishing_aspect: |
          Dual-variant logic on the EasementTract domain (a different entity from the Route scoring
          instance): the same tract row yields offered_compensation_cents == 4163406 from the
          NEGOTIATED_OFFER variant and award_cents == 8200000 from the CONDEMNATION_AWARD variant,
          because the award ignores acres/per-acre/easement-factor entirely and values whole-property
          diminution plus severance plus deposit interest.
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with eminent_domain_authorized true on the certified Route A"
            - "One tract on segment 1 (12.35 acres, 487500 cents/acre, factor 0.65, 250000 structure damages, before 90000000, after 82500000, severance 400000)"
            - "Two offers already made and rejected, so a condemnation may be filed and awarded"
          setup_api_calls:
            - *k01
            - *k02
            - *k03
            - *k04
            - *k05
            - *k06
            - *k07
            - *k08
            - &k09
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeA}", sequence_index: 1, miles: 10.0, land_use_rating: 3, environmental_rating: 4, cultural_rating: 2, engineering_rating: 3, county: "Harlan", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: true, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { seg1: "$.data.id" }
            - *k10
            - *k11
            - *k12
            - &k13
              call: "POST /siting/routes"
              payload: { project_id: "${proj}", label: "Route B - ridge line", kind: "ALTERNATE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { routeB: "$.data.id" }
            - &k14
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeB}", sequence_index: 1, miles: 8.0, land_use_rating: 2, environmental_rating: 1, cultural_rating: 1, engineering_rating: 2, county: "Boone", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: false, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { segB1: "$.data.id" }
            - &k15
              call: "POST /siting/route-segments"
              payload: { route_id: "${routeB}", sequence_index: 2, miles: 4.0, land_use_rating: 1, environmental_rating: 1, cultural_rating: 1, engineering_rating: 1, county: "Clay", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: false, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { segB2: "$.data.id" }
            - &k16
              call: "POST /siting/routes/${routeB}/constraint-mapping"
              payload: { mapping_note: "Alternate fully field verified" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - &k17
              call: "POST /siting/routes/${routeB}/nomination"
              payload: { nomination_note: "Alternate route for the filing" }
              as: Developer
              as_user_id: "dev-nora"
            - &k18
              call: "POST /siting/routes/${routeA}/publication"
              payload: { comment_window_days: 30 }
              as: Developer
              as_user_id: "dev-nora"
            - &k19
              call: "POST /siting/routes/${routeA}/open-houses"
              payload: { county: "Harlan", attendee_count: 40 }
              as: Developer
              as_user_id: "dev-nora"
            - &k20
              call: "POST /siting/routes/${routeA}/open-houses"
              payload: { county: "Boone", attendee_count: 25 }
              as: Developer
              as_user_id: "dev-nora"
            - &k21
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
            - &k22
              call: "POST /siting/routes/${routeA}/nomination"
              payload: { nomination_note: "Comment window closed with no open material comments" }
              as: Developer
              as_user_id: "dev-nora"
            - &k23
              call: "POST /siting/applications"
              payload: { project_id: "${proj}", study_id: "${study}", proposed_route_id: "${routeA}", docket_number: "EL-2026-0334", filing_fee_cents: 2500000 }
              as: Developer
              as_user_id: "dev-fila"
              captures: { app: "$.data.id" }
            - &k24
              call: "POST /siting/applications/${app}/sufficiency-review"
              payload: { outcome: "ACCEPT" }
              as: CommissionStaff
              as_user_id: "staff-lin"
            - &k25
              call: "POST /siting/hearing-sessions"
              payload: { application_id: "${app}", kind: "EVIDENTIARY", window_start_at: "2026-10-05T09:00:00Z", window_end_at: "2026-10-05T12:00:00Z" }
              as: HearingExaminer
              as_user_id: "examiner-quinn"
              captures: { sess1: "$.data.id" }
            - &k26
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T09:00:00Z" }
              as: HearingExaminer
              as_user_id: "examiner-quinn"
            - &k27
              call: "POST /siting/hearing-sessions/${sess1}/holding"
              payload: { exhibits_admitted_count: 12 }
              as: HearingExaminer
              as_user_id: "examiner-quinn"
            - &k28
              call: "POST /siting/applications/${app}/record-closure"
              payload: { closure_note: "Evidence closed" }
              as: HearingExaminer
              as_user_id: "examiner-quinn"
            - &k29
              call: "POST /siting/applications/${app}/decision"
              payload:
                outcome: "GRANT"
                certified_route_id: "${routeA}"
                eminent_domain_authorized: true
                mitigation_base_cents: 480000000
                conditions:
                  - { code: "ENV-BLACKOUT-1", category: "ENVIRONMENTAL", constraint_kind: "SEASONAL_BLACKOUT", severity_weight: 4, blackout_start_mmdd: "04-01", blackout_end_mmdd: "07-15" }
                  - { code: "CUL-MON-1", category: "CULTURAL", constraint_kind: "MONITORING", severity_weight: 2 }
                  - { code: "ENG-CREW-1", category: "ENGINEERING", constraint_kind: "CREW_LIMIT", severity_weight: 4, crew_limit: 9 }
              as: CommissionStaff
              as_user_id: "staff-lin"
            - &k30
              call: "GET /siting/certificates"
              payload: { application_id: "${app}" }
              as: CommissionStaff
              as_user_id: "staff-lin"
              captures: { cert: "$.data[0].id" }
            - &k31
              call: "GET /siting/certificates/${cert}/conditions"
              payload: {}
              as: CommissionStaff
              as_user_id: "staff-lin"
              captures: { cond1: "$.data[0].id", cond2: "$.data[1].id", cond3: "$.data[2].id" }
            - &e01
              call: "POST /siting/landowners"
              payload: { name: "Ada Wren", email: "ada@example.com", mailing_address: "18 Ridge Rd, Harlan KY" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { lo1: "$.data.id" }
            - &e02
              call: "POST /siting/easement-tracts"
              payload: { project_id: "${proj}", segment_id: "${seg1}", landowner_id: "${lo1}", parcel_number: "H-104-22", acres: 12.35, per_acre_value_cents: 487500, easement_factor: 0.65, structure_damages_cents: 250000, before_value_cents: 90000000, after_value_cents: 82500000, severance_damages_cents: 400000 }
              as: Developer
              as_user_id: "dev-nora"
              captures: { tract1: "$.data.id", tract1_v: "$.data.version" }
            - &e03
              call: "POST /siting/easement-tracts/${tract1}/offers"
              payload: { expected_tract_version: "${tract1_v}", offer_note: "Initial appraisal-based offer" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { tract1_v2: "$.data.version" }
            - call: "POST /siting/easement-tracts/${tract1}/offer-response"
              payload: { response: "REJECT", response_note: "Below market" }
              as: Landowner
              as_user_id: "${lo1}"
            - call: "POST /siting/easement-tracts/${tract1}/offers"
              payload: { expected_tract_version: "${tract1_v2}", offer_note: "Sweetened second offer" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { tract1_v3: "$.data.version" }
            - call: "POST /siting/easement-tracts/${tract1}/offer-response"
              payload: { response: "REJECT", response_note: "Still below market" }
              as: Landowner
              as_user_id: "${lo1}"
            - call: "POST /siting/easement-tracts/${tract1}/condemnation"
              payload: { court_docket_number: "CC-2027-77", deposit_cents: 5000000 }
              as: Developer
              as_user_id: "dev-nora"
          trigger:
            - call: "POST /siting/easement-tracts/${tract1}/award"
              payload: { award_note: "Commissioners' award entered" }
              as: CommissionStaff
              as_user_id: "staff-lin"
          assert:
            - "EasementTract.${tract1}.offered_compensation_cents == 4371576"
            - "EasementTract.${tract1}.award_cents == 8200000"
            - "EasementTract.${tract1}.committed_cents == 8200000"
            - "EasementTract.${tract1}.acquisition_status == AWARDED"
            - "EasementTract.${tract1}.payment_status == UNPAID"
            - "Project.${proj}.easement_committed_cents == 8200000"

      - name: compliance_index_variants_diverge_after_correction
        grounds:
          - calculations.certificate_compliance_index
          - entities.Certificate.fields.compliance_index_rolling
          - entities.Certificate.fields.compliance_index_cumulative
          - state_machines.Nonconformance.OPEN_to_CORRECTED
        distinguishing_aspect: |
          Dual-variant logic on the Certificate domain (a third distinct entity): after one SEVERE
          finding on a weight-4 condition is corrected, compliance_index_rolling == 76.00 while
          compliance_index_cumulative stays 52.00, because only the ROLLING variant halves a
          CORRECTED finding's 48.00 deduction.
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE with conditions ENV-BLACKOUT-1 (weight 4), CUL-MON-1 (weight 2), ENG-CREW-1 (weight 4)"
            - "One SEVERE nonconformance filed against ENV-BLACKOUT-1, deduction_points 48.00, certificate posture STOP_WORK"
          setup_api_calls:
            - *k01
            - *k02
            - *k03
            - *k04
            - *k05
            - *k06
            - *k07
            - *k08
            - *k09
            - *k10
            - *k11
            - *k12
            - *k13
            - *k14
            - *k15
            - *k16
            - *k17
            - *k18
            - *k19
            - *k20
            - *k21
            - *k22
            - *k23
            - *k24
            - *k25
            - *k26
            - *k27
            - *k28
            - *k29
            - *k30
            - *k31
            - &n_severe
              call: "POST /siting/nonconformances"
              payload: { certificate_id: "${cert}", condition_id: "${cond1}", severity: "SEVERE", observation: "Clearing inside the seasonal habitat blackout" }
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
              captures: { ncr_sev: "$.data.id" }
          trigger:
            - call: "POST /siting/nonconformances/${ncr_sev}/correction"
              payload: { corrective_action: "Habitat restoration completed and monitor sign-off obtained" }
              as: ComplianceMonitor
              as_user_id: "monitor-abe"
          assert:
            - "Nonconformance.${ncr_sev}.deduction_points == 48.00"
            - "Nonconformance.${ncr_sev}.status == CORRECTED"
            - "Certificate.${cert}.compliance_index_rolling == 76.00"
            - "Certificate.${cert}.compliance_index_cumulative == 52.00"
            - "Certificate.${cert}.posture == ACTIVE"
            - "CertificateCondition.${cond1}.status == ACTIVE"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: route_score_cap_and_voltage_multiplier_nonlinear_mode_a
        grounds:
          - calculations.route_constraint_score
          - entities.Project.fields.voltage_class
          - entities.RouteSegment.fields.land_use_rating
          - state_machines.Route.DRAFT_to_CONSTRAINT_MAPPED
        distinguishing_aspect: |
          Mode (a) non-linear interaction: the per-segment score nests a min() cap over a four-input
          weighted sum, a conditional branch on survey_status and a voltage-class multiplier, so a
          5.0-mile all-5 segment on a KV_500 project scores 29.25 (cap 4.50 applied BEFORE miles and
          multiplier) instead of the uncapped 32.50.
        test_recipe:
          setup:
            - "A KV_500 project with a CERTIFIED_SUFFICIENT study"
            - "A PROPOSED route with a 5.0mi FIELD_VERIFIED segment rated 5/5/5/5 and a 2.0mi FIELD_VERIFIED segment rated 0/0/0/0"
          setup_api_calls:
            - &m01
              call: "POST /siting/projects"
              payload: { name: "Clay Gap 500kV Tie", voltage_class: "KV_500", jurisdiction_state: "KY", target_energization_at: "2029-04-01T00:00:00Z" }
              as: Developer
              as_user_id: "dev-nora"
              captures: { proj2: "$.data.id" }
            - &m02
              call: "POST /siting/planning-studies"
              payload: { project_id: "${proj2}", horizon_year: 2033, reliability_deficit_mw: 400, transmission_capex_cents: 80000000000, benefit_pv_cents: 80000000000 }
              as: Developer
              as_user_id: "dev-nora"
              captures: { study2: "$.data.id" }
            - &m03
              call: "POST /siting/alternatives"
              payload: { study_id: "${study2}", kind: "TRANSMISSION", description: "New 500kV tie", capex_cents: 80000000000, deliverable_mw: 400 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt3: "$.data.id" }
            - &m04
              call: "POST /siting/alternatives"
              payload: { study_id: "${study2}", kind: "NON_TRANSMISSION", description: "Storage portfolio", capex_cents: 46000000000, deliverable_mw: 200 }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { alt4: "$.data.id" }
            - &m05
              call: "POST /siting/alternatives/${alt3}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Meets deficit" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - &m06
              call: "POST /siting/alternatives/${alt4}/screening"
              payload: { decision: "SCREEN_IN", screen_reason: "Credible non-wires portfolio" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
            - &m07
              call: "POST /siting/planning-studies/${study2}/sufficiency-certification"
              payload: { attestation_note: "Independent review complete" }
              as: Developer
              as_user_id: "dev-milo"
            - &m08
              call: "POST /siting/routes"
              payload: { project_id: "${proj2}", label: "Route C - worst case corridor", kind: "PROPOSED" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { routeC: "$.data.id" }
            - call: "POST /siting/route-segments"
              payload: { route_id: "${routeC}", sequence_index: 1, miles: 5.0, land_use_rating: 5, environmental_rating: 5, cultural_rating: 5, engineering_rating: 5, county: "Clay", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: false, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { segC1: "$.data.id" }
            - call: "POST /siting/route-segments"
              payload: { route_id: "${routeC}", sequence_index: 2, miles: 2.0, land_use_rating: 0, environmental_rating: 0, cultural_rating: 0, engineering_rating: 0, county: "Boone", crew_capacity: 12, survey_status: "FIELD_VERIFIED", habitat_blackout: false, federal_crossing_kind: "NONE" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
              captures: { segC2: "$.data.id" }
          trigger:
            - call: "POST /siting/routes/${routeC}/constraint-mapping"
              payload: { mapping_note: "Worst-case corridor mapped" }
              as: RouteAnalyst
              as_user_id: "analyst-ray"
          assert:
            - "Route.${routeC}.constraint_score_certified == 29.25"
            - "Route.${routeC}.constraint_score_preliminary == 29.25"
            - "Route.${routeC}.constraint_score_certified != 32.50"
            - "Route.${routeC}.total_miles == 7.0"
            - "Route.${routeC}.constraint_density_certified == 4.18"

      - name: easement_offer_rounding_order_pinned_mode_b
        grounds:
          - calculations.easement_compensation
          - entities.EasementTract.fields.offered_compensation_cents
          - entities.EasementTract.fields.offer_round
          - state_machines.EasementTract.REJECTED_to_OFFERED
        distinguishing_aspect: |
          Mode (b) nested-rounding order: rounding land_value to whole cents BEFORE adding structure
          damages and BEFORE applying the round-2 escalation gives 4371576, whereas collapsing both
          roundings into one final rounding gives 4371577 — a different cent on the same tract.
        test_recipe:
          setup:
            - "Certificate ISSUED/ACTIVE on Route A with one tract on segment 1 (12.35 acres, 487500 cents/acre, factor 0.65, 250000 structure damages)"
            - "First offer of 4163406 cents already made and rejected by the landowner, tract in acquisition_status REJECTED"
          setup_api_calls:
            - *k01
            - *k02
            - *k03
            - *k04
            - *k05
            - *k06
            - *k07
            - *k08
            - *k09
            - *k10
            - *k11
            - *k12
            - *k13
            - *k14
            - *k15
            - *k16
            - *k17
            - *k18
            - *k19
            - *k20
            - *k21
            - *k22
            - *k23
            - *k24
            - *k25
            - *k26
            - *k27
            - *k28
            - *k29
            - *k30
            - *k31
            - *e01
            - *e02
