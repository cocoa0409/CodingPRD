  # =========================================================================
  # 9. compensating_invariant — two instances pinning DIFFERENT conserved
  #    quantities as explicit formulas: the allocation capital identity and the
  #    asset trade-in claim / authoritative-variant ledger.
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fund_then_withdraw_funding_conserves_allocation_capital
        grounds:
          - state_machines.ReplacementRequest.APPROVED_to_FUNDED
          - state_machines.ReplacementRequest.FUNDED_to_APPROVED
          - calculations.facility_allocation_waterfall
          - entities.FacilityAllocation.fields.available_cents
          - entities.CapitalCycle.fields.exhausted_allocation_count
        distinguishing_aspect: >-
          Conserved quantity = the allocation capital identity
          allocated_cents + released_contingency_cents == committed_cents + available_cents,
          pinned before, between and after a fund / withdraw-funding pair: it must read
          100000000 + 0 == 100000000 + 0 at the funded point and 100000000 + 0 == 0 + 100000000 after
          the compensation, with posture and exhausted_allocation_count both rewound and the
          already-COMMITTED cycle deliberately NOT rewound.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; facility NRH, department DEPT-A1, asset A7 (install 2020-08-02, life 8, OEM support 2029-06-01 -> adjusted RULS 25.00, IN_SERVICE)."
