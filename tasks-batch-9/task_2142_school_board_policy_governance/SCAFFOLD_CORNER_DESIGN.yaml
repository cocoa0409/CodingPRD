            - "PolicyVersion.${pv1}.status == DRAFT and PolicyVersion.${pv2}.status == DRAFT"
            - "Policy.${pol}.version_count == 2"

  # =======================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_policy_version_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[policy-version-create-stale-policy]
          - errors[ERR_STALE_VERSION]
          - entities.PolicyVersion.fields.policy_version_after
        distinguishing_aspect: "Two strictly sequential drafting requests: the first advances Policy.version from 1 to 2, so the second still carrying expected_policy_version 1 is rejected with ERR_STALE_VERSION at HTTP 412 and no second version row is created."
        test_recipe:
          setup:
            - "One policy BP-6155 at version 1; the client has read that version number."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-6155", title: "Homework and Grading", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "6000.55" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
          trigger:
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "First draft.", summary_of_change: "First", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { pv1: $.data.id, pol_v2: $.data.policy_version_after }
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "Second draft from a stale view.", summary_of_change: "Second", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "first trigger call HTTP status == 201 and PolicyVersion.${pv1}.policy_version_after == 2"
            - "second trigger call HTTP status == 412 and data.error_id == ERR_STALE_VERSION"
            - "Policy.${pol}.version == 2"
            - "Policy.${pol}.version_count == 1"
            - "GET /governance/policy-versions?policy_id=${pol} returns total_count == 1"

      - name: stale_expected_meeting_version_returns_precondition_failed
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[agenda-item-create-stale-meeting]
          - errors[ERR_STALE_VERSION]
          - entities.AgendaItem.fields.meeting_version_after
        distinguishing_aspect: "The same OCC mechanism on a different parent: adding the first agenda item advances Meeting.version from 1 to 2, so a second add still carrying expected_meeting_version 1 is rejected with ERR_STALE_VERSION at HTTP 412 and the agenda keeps exactly one item."
        test_recipe:
          setup:
            - "Meeting M (REGULAR, 2026-09-10T18:00:00Z) is DRAFT at version 1; the client has read that version number."
          setup_api_calls:
            - call: "POST /governance/meetings"
              payload: { title: "September Regular Meeting", scope: "FULL_BOARD", meeting_type: "REGULAR", scheduled_start_utc: "2026-09-10T18:00:00Z" }
              as: BoardClerk
              captures: { m: $.data.id, m_v: $.data.version }
          trigger:
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${m}", item_type: "CONSENT", title: "Approve warrants", expected_meeting_version: "${m_v}" }
              as: BoardClerk
              captures: { ai1: $.data.id, m_v2: $.data.meeting_version_after }
            - call: "POST /governance/agenda-items"
              payload: { meeting_id: "${m}", item_type: "CONSENT", title: "Approve field trips", expected_meeting_version: "${m_v}" }
              as: BoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "first trigger call HTTP status == 201 and AgendaItem.${ai1}.meeting_version_after == 2"
            - "second trigger call HTTP status == 412 and data.error_id == ERR_STALE_VERSION"
            - "Meeting.${m}.version == 2"
            - "GET /governance/agenda-items?meeting_id=${m} returns total_count == 1"
            - "AgendaItem.${ai1}.sequence_no == 1"

      - name: parent_version_increments_on_every_mutation_including_cascades
        claim_type: optimistic_concurrency
        grounds:
          - entities.Policy.fields.code
          - endpoints[POST /governance/policies/{id}/versions]
          - endpoints[POST /governance/policy-versions/{id}/withdraw]
        distinguishing_aspect: "Policy.version starts at 1 and advances by exactly one per mutation, cascaded ones included: creating a draft takes it to 2 and withdrawing that draft takes it to 3, which is why an OCC input must always come from a fresh server response."
        test_recipe:
          setup: ["One policy BP-6155 at version 1."]
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-6155", title: "Homework and Grading", category: "INSTRUCTION", legal_requirement_level: "RECOMMENDED", manual_section: "6000.55" }
              as: PolicyAnalyst
              captures: { pol: $.data.id, pol_v: $.data.version }
          trigger:
            - call: "POST /governance/policies/${pol}/versions"
              payload: { body_text: "First draft.", summary_of_change: "First", expected_policy_version: "${pol_v}" }
              as: PolicyAnalyst
              captures: { pv1: $.data.id, after_create: $.data.policy_version_after }
            - call: "POST /governance/policy-versions/${pv1}/withdraw"
              payload: { withdrawn_reason: "Replaced by counsel language." }
              as: PolicyAnalyst
            - call: "GET /governance/policies/${pol}"
              payload: {}
              as: PolicyAnalyst
              captures: { after_withdraw: $.data.version }
          assert:
            - "captured pol_v == 1"
            - "captured after_create == 2"
            - "captured after_withdraw == 3"
            - "PolicyVersion.${pv1}.status == WITHDRAWN"
            - "PolicyVersion.${pv1}.withdrawn_reason == Replaced by counsel language."
            - "Policy.${pol}.version_count == 1"

      - name: repeating_the_sweep_at_the_same_clock_position_reports_no_new_transitions
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints[POST /governance/compliance-sweeps]
          - state_machines.LegalMandate.OPEN_to_OVERDUE
          - calculations.policy_compliance_state
        distinguishing_aspect: "The sweep counters report transitions performed, not standing totals: the first sweep past the deadline reports mandates_marked_overdue 1, and an immediate second sweep at the same clock position reports 0 while the mandate stays OVERDUE and days_past_deadline stays 1."
        test_recipe:
          setup:
            - "Policy BP-9010 (LOCAL_DISCRETION) carries one OPEN mandate with a 2026-08-10T00:00:00Z deadline."
            - "The clock has been moved to 2026-08-11T00:00:00Z."
          setup_api_calls:
            - call: "POST /governance/policies"
              payload: { code: "BP-9010", title: "Board Retreat Guidelines", category: "GOVERNANCE", legal_requirement_level: "LOCAL_DISCRETION", manual_section: "9000.10" }
              as: PolicyAnalyst
              captures: { pol: $.data.id }
            - call: "POST /governance/legal-mandates"
              payload: { notice_code: "LUS-2026-030", policy_id: "${pol}", citation: "GC 54954", issued_on: "2026-08-01T00:00:00Z", compliance_deadline: "2026-08-10T00:00:00Z", required_action: "ADOPT_NEW" }
              as: LegalUpdateService
              captures: { man: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: BoardClerk
          trigger:
            - call: "POST /governance/compliance-sweeps"
              payload: {}
              as: BoardClerk
              captures: { first_overdue: $.data.mandates_marked_overdue }
            - call: "POST /governance/compliance-sweeps"
              payload: {}
              as: BoardClerk
              captures: { second_overdue: $.data.mandates_marked_overdue, second_recomputed: $.data.policies_recomputed }
          assert:
            - "captured first_overdue == 1"
            - "captured second_overdue == 0"
            - "captured second_recomputed == 1"
            - "LegalMandate.${man}.status == OVERDUE"
            - "LegalMandate.${man}.days_past_deadline == 1"
            - "Policy.${pol}.overdue_mandate_count == 1"
            - "Policy.${pol}.compliance_state == NON_COMPLIANT"

      - name: adoption_cascade_spans_five_entities
        claim_type: cascading_side_effects
        grounds:
          - state_machines.PolicyVersion.FIRST_READING_PASSED_to_ADOPTED
        excluded_because:
          difficulty_instance: transitive_cascade / second_reading_adoption_five_hop_recertification_cascade
          rationale: "That instance already walks the full five-hop chain end to end."

      - name: public_comment_dual_variant_produces_different_allotments
        claim_type: dual_variant_calculation
        grounds:
          - calculations.public_comment_minute_allocation
        excluded_because:
          difficulty_instance: dual_variant_calc / public_comment_allocation_two_variants_same_speaker_cards
          rationale: "That instance already pins 1/1 against 3/2 on identical speaker cards."

  # =======================================================================
  - section: consistency_model
    instances:

      - name: emergency_adoption_cascade_is_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - state_machines.PolicyVersion.DRAFT_to_ADOPTED
          - calculations.policy_compliance_state
          - entities.Policy.fields.adopted_version_no
        distinguishing_aspect: "The consistency model is immediate: the record-vote response already carries the ACTED item, and an immediately following read of the policy shows status ADOPTED, adopted_version_no 1, last_review_date stamped and compliance_state COMPLIANT, with no second call or delay required."
