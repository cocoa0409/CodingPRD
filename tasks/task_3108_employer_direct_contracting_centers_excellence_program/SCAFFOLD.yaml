# =============================================================================
# SCAFFOLD — task_3108_employer_direct_contracting_centers_excellence_program
# Employer Direct Contracting / Centers of Excellence bundled episode platform
# =============================================================================

scenario: |
  Employer Direct Contracting Centers of Excellence Program (Cleveland Clinic):
  bundled case rate negotiation with self-funded employers covering surgery,
  related care and a warranty period, patient eligibility screening and
  second-opinion review that may conclude surgery is unnecessary, travel and
  lodging benefits for the patient and a companion administered under the
  bundle, care coordination with local providers before and after the episode,
  outcome and readmission accountability within the warranty window with cost
  absorption, employer reporting on avoided procedures and outcomes, claim
  submission mechanics for a bundle across multiple provider entities, program
  capacity limits and scheduling priority

domain_name: coe-bundles
api_prefix: /coe

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
    - pagination_with_filtering
  entity_topology: flat
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate
  difficulty: beyond_expert
  entity_count: 13
  state_machine_count: 11
  calculation_count: 9
  endpoint_count: 46
  error_code_count: 31
  role_count: 6

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Self-funded employer legal name" }
      - { name: ein, type: string, source: input, description: "Employer identification number; unique across employers" }
      - { name: baseline_rate_book, type: string, source: input, description: "FK -> RateBook.id; employer-specific baseline rates used by avoided-cost computation and employer-scoped claim estimate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | TERMINATED", constraints: "initial ACTIVE" }

  - name: BundleTemplate
    parent: null
    common_fields: true
    fields:
      - { name: procedure_family, type: enum, source: input, description: "CARDIAC | ORTHO_JOINT | BARIATRIC | SPINE" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'Primary Total Knee (OP)'" }
      - { name: warranty_days, type: integer, source: input, description: "Length of the related-care warranty window in days; window is half-open [discharge, discharge + warranty_days)", constraints: "warranty_days >= 1" }
      - { name: implant_component_cap_cents, type: integer, source: input, description: "Ceiling on implant carve-out component inside the bundle price", constraints: ">= 0" }
      - { name: readmit_policy, type: enum, source: input, description: "RELATED_ONLY | ALL_CAUSE — scope of readmissions covered under warranty" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", constraints: "initial ACTIVE; RETIRED templates cannot seed new contracts" }

  - name: RateBook
    parent: null
    common_fields: true
    fields:
      - { name: book_code, type: string, source: input, description: "Unique code, e.g. 'MSDRG-2026'" }
      - { name: rates, type: object, source: input, description: "Map procedure_family -> baseline rate in cents for the underlying procedure" }

  - name: Contract
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: template_id, type: string, source: input, description: "FK -> BundleTemplate.id" }
      - { name: template_version, type: integer, source: system, description: "Template version captured at contract creation (version pinning)" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage window end (exclusive)", constraints: "effective_to > effective_from" }
      - { name: bundle_price_cents, type: integer, source: input, description: "Total negotiated case rate for the episode", constraints: "> 0" }
      - { name: rate_components, type: object, source: input, description: "Facility / professional / implant / anesthesia component map (cents); component values must sum to bundle_price_cents" }
      - { name: outlier_threshold_cents, type: integer, source: input, description: "Provider-billed level at which outlier review triggers", constraints: "> 0" }
      - { name: outlier_share_pct, type: integer, source: input, description: "Employer share of excess beyond outlier threshold, percent 0..100" }
      - { name: episode_cap_per_month, type: integer, source: input, description: "Maximum episodes that may OPEN per calendar month on this contract", constraints: ">= 0" }
      - { name: concurrent_capacity, type: integer, source: input, description: "Maximum episodes on this contract in an active lifecycle state at once", constraints: ">= 0" }
      - { name: travel_benefit_cents, type: integer, source: input, description: "Travel allowance pool per episode", constraints: ">= 0" }
      - { name: lodging_benefit_cents, type: integer, source: input, description: "Lodging allowance pool per episode", constraints: ">= 0" }
      - { name: companion_allowed, type: boolean, source: input, description: "Whether one companion's travel/lodging is covered under the bundle" }
      - { name: change_history, type: array, source: system, description: "Append-only list of reprice amendments {new_bundle_price_cents, new_rate_components, effective_from_seq, amended_at}" }
      - { name: reprice_count, type: integer, source: system, description: "Number of accepted reprice amendments; gates the 30-day prior-notice rule" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | TERMINATED", constraints: "initial DRAFT" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id" }
      - { name: full_name, type: string, source: input, description: "Patient legal name" }
      - { name: dob, type: string, source: input, description: "Date of birth, YYYY-MM-DD" }
      - { name: member_id, type: string, source: input, description: "Employer health plan member id; unique per employer" }

  - name: Episode
    parent: null
    common_fields: true
    fields:
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id" }
      - { name: family, type: enum, source: system, description: "Procedure family copied from the contract's template at intake (CARDIAC | ORTHO_JOINT | BARIATRIC | SPINE)" }
      - { name: intake_request_id, type: string, source: input, description: "Idempotency key; unique per employer. Duplicate intake with the same key replays the original response; same key with a different payload is a conflict" }
      - { name: status, type: enum, source: system, description: "INTAKE_PENDING | SCREENING | SOR_PENDING | SOR_REVIEW | APPROVED | SCHEDULING | PRE_OP | SURGERY_DONE | POST_OP_TRACKING | CLOSED | AVOIDED | CANCELLED", constraints: "initial INTAKE_PENDING" }
      - { name: screen_seq, type: integer, source: system, description: "Monotonic per-episode sequence stamped on every screening/review/summary; used to order rate application and the 30-day reprice notice" }
      - { name: scheduled_start_seq, type: integer, source: system, description: "screen_seq at which the current pending scheduled day was registered; 0 when nothing is scheduled" }
      - { name: warranty_end_seq, type: integer, source: system, description: "screen_seq of the first day after the warranty window (window is half-open [discharge_seq, warranty_end_seq)); 0 until surgery done" }
      - { name: warranty_close_seq, type: integer, source: system, description: "screen_seq at which the episode auto-closes after a quiet warranty tail; 0 until surgery done" }
      - { name: surgery_done_seq, type: integer, source: system, description: "screen_seq when surgery completed; 0 until SURGERY_DONE" }
      - { name: discharge_seq, type: integer, source: system, description: "screen_seq of discharge (warranty window opens); 0 until POST_OP_TRACKING" }
      - { name: price_rule, type: enum, source: system, description: "LOCKED | REPRICED — price basis actually applied to this episode's claims" }
      - { name: applied_bundle_price_cents, type: integer, source: system, description: "Cents price basis locked on approval; equals contract.bundle_price_cents when price_rule is LOCKED, or the latest amendment price when REPRICED" }
      - { name: applied_rate_components, type: object, source: system, description: "Component map snapshot captured at the same moment as applied_bundle_price_cents" }
      - { name: expected_system_version, type: integer, source: input, description: "OCC token required on every episode mutation; must equal the episode's current version" }
      - { name: estimated_total_billed_cents, type: integer, source: computed, description: "Forward-looking estimate: applied price basis plus outlier projection (only when an outlier review flag is set) minus unreleased travel/lodging accrual; computed on read" }
      - { name: closed_outcome, type: enum, source: system, description: "CLEAN | READMITTED — outcome classification recorded when the episode CLOSED; null while open" }
      - { name: triage_rank, type: integer, source: input, description: "Scheduling urgency; 0 = elective (default), 1 = urgent" }

  - name: Screening
    parent: null
    common_fields: false
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id" }
      - { name: doc_type, type: enum, source: input, description: "IMAGING | LAB | NOTE | CONSENT" }
      - { name: result, type: enum, source: input, description: "CANDIDATE | NOT_A_CANDIDATE" }
      - { name: screen_seq, type: integer, source: system, description: "Per-episode monotonic sequence stamped at submission" }

  - name: SecondOpinionReview
    parent: null
    common_fields: false
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id" }
      - { name: reviewer_id, type: string, source: system, description: "PhysicianReviewer user id (X-User-ID) captured at submission" }
      - { name: conclusion, type: enum, source: input, description: "SURGERY_INDICATED | SURGERY_UNNECESSARY | MORE_INFO_NEEDED" }
      - { name: screen_seq, type: integer, source: system, description: "Per-episode monotonic sequence stamped at submission" }
      - { name: prev_status, type: enum, source: system, description: "Episode status snapshot before this review was recorded (SOR_PENDING or SOR_REVIEW); drives the MORE_INFO_NEEDED branch" }

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id" }
      - { name: claim_type, type: enum, source: input, description: "BUNDLE_CASE | RELATED_CARE | TRAVEL | LODGING | READMISSION" }
      - { name: submitting_entity, type: enum, source: input, description: "HOSPITAL | SURGERY_CENTER | ANESTHESIA_GROUP | TRAVEL_VENDOR — provider entity submitting the claim" }
      - { name: service_date_seq, type: integer, source: input, description: "Episode-relative day of service for anti-fraud windowing; compared against surgery_done_seq / warranty window" }
      - { name: billed_cents, type: integer, source: input, description: "Amount billed by the provider entity", constraints: ">= 0" }
      - { name: expected_episode_version, type: integer, source: input, description: "OCC token for the episode aggregate; claim submission bumps Episode.version" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | DENIED | PAID | ABSORBED", constraints: "initial PENDING" }
      - { name: adjudicated_payable_cents, type: integer, source: system, description: "Server-computed payable at adjudication; null until adjudicated" }
      - { name: adjudication_reason, type: string, source: system, description: "Machine-readable reason code recorded at adjudication" }
      - { name: is_readmit_related, type: boolean, source: input, description: "For READMISSION claims: whether the readmission is clinically related to the index procedure" }

  - name: Readmission
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id" }
      - { name: related, type: boolean, source: input, description: "Whether clinically related to the index procedure" }
      - { name: provider_billed_cents, type: integer, source: input, description: "Provider-billed cost of the readmission", constraints: ">= 0" }
      - { name: recorded_seq, type: integer, source: system, description: "Episode screen_seq at which the readmission was recorded; drives in/out-of-window determination" }
      - { name: out_of_window, type: boolean, source: system, description: "True when recorded_seq >= warranty_end_seq" }
      - { name: absorbed_cents, type: integer, source: system, description: "Cents absorbed by the provider under warranty; computed at recording" }

  - name: TravelBenefit
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id" }
      - { name: kind, type: enum, source: input, description: "TRAVEL | LODGING" }
      - { name: traveler, type: enum, source: input, description: "PATIENT | COMPANION" }
      - { name: amount_cents, type: integer, source: input, description: "Benefit amount to administer", constraints: "> 0" }
      - { name: expected_episode_version, type: integer, source: input, description: "OCC token for the episode aggregate; benefit administration bumps Episode.version" }
      - { name: status, type: enum, source: system, description: "ADMINISTERED | RELEASED", constraints: "initial ADMINISTERED" }

  - name: CarePlanItem
    parent: null
    common_fields: true
    fields:
      - { name: episode_id, type: string, source: input, description: "FK -> Episode.id" }
      - { name: phase, type: enum, source: input, description: "PRE_OP | POST_OP" }
      - { name: local_provider_name, type: string, source: input, description: "Local provider the coordination item is handed to" }
      - { name: required, type: boolean, source: input, description: "Required items gate surgery completion (PRE_OP) and episode closure (POST_OP)" }
      - { name: status, type: enum, source: system, description: "OPEN | DONE | WAIVED", constraints: "initial OPEN" }

  - name: EmployerReport
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: system, description: "FK -> Employer.id" }
      - { name: period_month, type: string, source: input, description: "Month key YYYY-MM" }
      - { name: status, type: enum, source: system, description: "GENERATED", constraints: "fixed" }
      - { name: computed_seq, type: integer, source: system, description: "Global screen sequence (max over episodes) at which the snapshot was computed; used by tests to reason about snapshot staleness" }
      - { name: avoided_procedures_count, type: integer, source: computed, description: "Episodes of this employer that reached AVOIDED with terminal_seq inside the month" }
      - { name: avoided_cost_estimate_cents, type: integer, source: computed, description: "Sum over avoided episodes of the employer baseline rate for the episode's procedure family" }
      - { name: readmission_rate_pct, type: number, source: computed, description: "In-scope readmissions / closed episodes with surgery, * 100, 2dp round_half_up; 0.00 when denominator is 0" }
      - { name: warranty_absorbed_total_cents, type: integer, source: computed, description: "Sum of Readmission.absorbed_cents for in-scope episodes closed in the month" }
      - { name: avg_days_to_schedule, type: number, source: computed, description: "Mean of (scheduled_start_seq - approve_seq) over episodes scheduled in the month; 0.00 when denominator is 0" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Contract
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /coe/contracts/{id}/activate"
        actor: ProgramAdmin
        preconditions:
          - "Employer.status == ACTIVE"
          - "No other Contract with status == ACTIVE exists for the same (employer_id, template procedure_family) whose [effective_from, effective_to) overlaps this contract's window (adjacent windows sharing only an endpoint do not overlap)"
        side_effects:
          - "None"
      - from: [DRAFT, ACTIVE]
        to: TERMINATED
        trigger: "POST /coe/contracts/{id}/terminate"
        actor: ProgramAdmin
        preconditions: []
        side_effects:
          - "Every Episode on this contract whose status is in {INTAKE_PENDING, SCREENING, SOR_PENDING, SOR_REVIEW} transitions to CANCELLED"
          - "Every OPEN CarePlanItem on each cancelled episode is set to WAIVED"
          - "Each cancellation increments that episode's screen_seq and version"
          - "ADMINISTERED TravelBenefits on episodes that remain open are unaffected; episodes later closing by any path release them per the Episode CLOSED transition"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /coe/contracts/{id}/reprice (amendment; self-transition keeping status ACTIVE)"
        actor: ProgramAdmin
        preconditions:
          - "Contract.status == ACTIVE"
          - "new_bundle_price_cents > 0"
          - "new_rate_components values sum exactly to new_bundle_price_cents"
          - "Implant component of new_rate_components does not exceed the template's implant_component_cap_cents"
        side_effects:
          - "Appends {new_bundle_price_cents, new_rate_components, effective_from_seq} to change_history"
          - "Increments reprice_count by 1"
          - "Updates bundle_price_cents and rate_components to the new values"

  - entity: Episode
    field: status
    initial_state: INTAKE_PENDING
    terminal_states: [CLOSED, AVOIDED, CANCELLED]
    transitions:
      - from: INTAKE_PENDING
        to: SCREENING
        trigger: "first POST /coe/episodes/{id}/screenings"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == INTAKE_PENDING"
        side_effects:
          - "Episode.screen_seq increments by 1 and stamps the Screening"
      - from: SCREENING
        to: SCREENING
        trigger: "subsequent POST /coe/episodes/{id}/screenings"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == SCREENING"
        side_effects:
          - "Episode.screen_seq increments by 1"
      - from: SCREENING
        to: SOR_PENDING
        trigger: "system (auto-transition immediately after a Screening with result == CANDIDATE is recorded)"
        actor: system
        preconditions:
          - "The just-recorded Screening has result == CANDIDATE"
        side_effects:
          - "Episode.screen_seq increments by 1 (the auto-transition itself consumes a sequence step)"
      - from: SCREENING
        to: CANCELLED
        trigger: "system (auto-transition immediately after a Screening with result == NOT_A_CANDIDATE is recorded)"
        actor: system
        preconditions:
          - "The just-recorded Screening has result == NOT_A_CANDIDATE"
        side_effects:
          - "Episode.screen_seq increments by 1"
      - from: SOR_PENDING
        to: SOR_REVIEW
        trigger: "POST /coe/episodes/{id}/reviews with conclusion == MORE_INFO_NEEDED"
        actor: PhysicianReviewer
        preconditions:
          - "Episode.status == SOR_PENDING"
        side_effects:
          - "Episode.screen_seq increments by 1 and stamps the review"
      - from: SOR_PENDING
        to: APPROVED
        trigger: "POST /coe/episodes/{id}/reviews with conclusion == SURGERY_INDICATED"
        actor: PhysicianReviewer
        preconditions:
          - "Episode.status == SOR_PENDING"
          - "Contract.status == ACTIVE"
          - "Contract is inside its coverage window at approval: effective_from <= current clock date < effective_to"
          - "Episodes already approved this calendar month on this contract (status in {APPROVED, SCHEDULING, PRE_OP, SURGERY_DONE, POST_OP_TRACKING, CLOSED} with approve_seq inside the current month) < contract.episode_cap_per_month"
          - "Active concurrent episodes on this contract (status in {APPROVED, SCHEDULING, PRE_OP, SURGERY_DONE, POST_OP_TRACKING}) < contract.concurrent_capacity"
        side_effects:
          - "Episode.price_rule and applied price basis set per calculations.price_basis_determination (LOCKED vs REPRICED, with the 30-day prior-notice comparison against screen_seq at approval)"
          - "Episode.approve_seq := screen_seq (after this transition's increment)"
          - "Episode.screen_seq increments by 1"
      - from: SOR_PENDING
        to: AVOIDED
        trigger: "POST /coe/episodes/{id}/reviews with conclusion == SURGERY_UNNECESSARY"
        actor: PhysicianReviewer
        preconditions:
          - "Episode.status == SOR_PENDING"
        side_effects:
          - "Every ADMINISTERED TravelBenefit on the episode transitions to RELEASED"
          - "All OPEN CarePlanItems on the episode transition to WAIVED"
          - "Episode.screen_seq increments by 1; episode terminal_seq := screen_seq (drives monthly avoided counting)"
      - from: SOR_REVIEW
        to: SOR_REVIEW
        trigger: "POST /coe/episodes/{id}/reviews with conclusion == MORE_INFO_NEEDED"
        actor: PhysicianReviewer
        preconditions:
          - "Episode.status == SOR_REVIEW"
        side_effects:
          - "Episode.screen_seq increments by 1"
      - from: SOR_REVIEW
        to: APPROVED
        trigger: "POST /coe/episodes/{id}/reviews with conclusion == SURGERY_INDICATED"
        actor: PhysicianReviewer
        preconditions:
          - "Episode.status == SOR_REVIEW"
          - "Same contract-active / coverage-window / monthly-cap / concurrent-capacity preconditions as SOR_PENDING -> APPROVED"
        side_effects:
          - "Same as SOR_PENDING -> APPROVED (price basis determination, approve_seq stamp, screen_seq increment)"
      - from: SOR_REVIEW
        to: AVOIDED
        trigger: "POST /coe/episodes/{id}/reviews with conclusion == SURGERY_UNNECESSARY"
        actor: PhysicianReviewer
        preconditions:
          - "Episode.status == SOR_REVIEW"
        side_effects:
          - "Same as SOR_PENDING -> AVOIDED (benefits released, care items waived, terminal_seq stamped)"
      - from: APPROVED
        to: SCHEDULING
        trigger: "POST /coe/episodes/{id}/schedule"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == APPROVED"
          - "requested_day_seq > screen_seq at the time of the call (scheduling strictly in the future)"
          - "Scheduling-priority gate passes: there is no other episode E2 on the same contract, same family, in status APPROVED with E2.triage_rank == 1 and E2.approve_seq < this episode's approve_seq, while this episode has triage_rank == 0"
        side_effects:
          - "Episode.scheduled_start_seq := requested_day_seq; Episode.status := SCHEDULING"
          - "Episode.screen_seq increments by 1"
      - from: SCHEDULING
        to: SCHEDULING
        trigger: "POST /coe/episodes/{id}/schedule (reschedule to a different requested_day_seq)"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == SCHEDULING"
          - "requested_day_seq > screen_seq at the time of the call"
          - "Same scheduling-priority gate as APPROVED -> SCHEDULING, evaluated against other APPROVED urgent episodes with earlier approve_seq"
        side_effects:
          - "Episode.scheduled_start_seq := new requested_day_seq"
          - "Episode.screen_seq increments by 1"
      - from: SCHEDULING
        to: PRE_OP
        trigger: "POST /coe/episodes/{id}/care-items"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == SCHEDULING"
          - "phase == PRE_OP"
        side_effects:
          - "CarePlanItem created in OPEN"
          - "Episode.status := PRE_OP (first PRE_OP care item moves the episode into pre-op coordination)"
      - from: PRE_OP
        to: PRE_OP
        trigger: "POST /coe/episodes/{id}/care-items (additional items, either phase)"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == PRE_OP"
        side_effects:
          - "CarePlanItem created in OPEN"
      - from: PRE_OP
        to: SURGERY_DONE
        trigger: "POST /coe/episodes/{id}/surgery-complete"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == PRE_OP"
          - "No PRE_OP CarePlanItem with required == true is in status OPEN"
          - "Current screen_seq >= scheduled_start_seq (surgery cannot complete before its scheduled day)"
        side_effects:
          - "Episode.surgery_done_seq := screen_seq (after increment)"
          - "Episode.screen_seq increments by 1"
      - from: SURGERY_DONE
        to: POST_OP_TRACKING
        trigger: "POST /coe/episodes/{id}/discharge"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == SURGERY_DONE"
        side_effects:
          - "Episode.discharge_seq := screen_seq (after increment)"
          - "Episode.warranty_end_seq := discharge_seq + template.warranty_days"
          - "Episode.warranty_close_seq := warranty_end_seq + 7 (quiet-tail closure horizon)"
          - "Episode.screen_seq increments by 1"
      - from: POST_OP_TRACKING
        to: CLOSED
        trigger: "POST /coe/episodes/{id}/advance-day, when the day counter reaches warranty_close_seq"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == POST_OP_TRACKING"
          - "screen_seq >= warranty_close_seq after the advance"
          - "No POST_OP CarePlanItem with required == true is in status OPEN"
          - "No Claim on this episode is in status PENDING"
        side_effects:
          - "Episode.closed_outcome := READMITTED if any Readmission on this episode has out_of_window == false, else CLEAN"
          - "Every ADMINISTERED TravelBenefit on the episode transitions to RELEASED"
          - "Episode status := CLOSED"
      - from: POST_OP_TRACKING
        to: CLOSED
        trigger: "POST /coe/episodes/{id}/advance-day, when the day counter has ALREADY reached warranty_close_seq before the advance and closure preconditions held but the episode is still POST_OP_TRACKING (e.g. a PENDING claim was resolved after the horizon passed)"
        actor: CareCoordinator
        preconditions:
          - "Episode.status == POST_OP_TRACKING"
          - "screen_seq already >= warranty_close_seq before this advance"
          - "No POST_OP CarePlanItem with required == true is in status OPEN"
          - "No Claim on this episode is in status PENDING"
        side_effects:
          - "Same closure side effects as the horizon-crossing closure (closed_outcome set, benefits RELEASED, unpaid APPROVED claims ABSORBED)"
      - from: POST_OP_TRACKING
        to: POST_OP_TRACKING
        trigger: "POST /coe/episodes/{id}/readmissions and POST /coe/episodes/{id}/claims (readmission / claim activity does not change status)"
        actor: "CareCoordinator (readmissions), ClaimsAdmin (claims)"
        preconditions:
          - "Episode.status == POST_OP_TRACKING"
        side_effects:
          - "Readmission recorded (absorption computed per calculations.readmission_absorption) or Claim created in PENDING"
          - "POST_OP_TRACKING is re-asserted after any side-effect evaluation — episode status never regresses to an earlier state"
      - from: [INTAKE_PENDING, SCREENING, SOR_PENDING, SOR_REVIEW]
        to: CANCELLED
        trigger: "system (cascade from Contract termination)"
        actor: system
        preconditions:
          - "Parent Contract transitions to TERMINATED"
        side_effects:
          - "OPEN CarePlanItems on the episode transition to WAIVED"
          - "Episode.screen_seq increments by 1"

  - entity: Claim
    field: status
    initial_state: PENDING
    terminal_states: [PAID, DENIED, ABSORBED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /coe/claims/{id}/adjudicate"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == PENDING"
          - "Claim is adjudicable per calculations.claim_adjudication (in-window, anti-fraud ordering, benefit-pool checks all pass)"
        side_effects:
          - "adjudicated_payable_cents set per claim type (case-rate waterfall, benefit pool draw, or readmission split)"
          - "adjudication_reason := APPROVED"
      - from: PENDING
        to: DENIED
        trigger: "POST /coe/claims/{id}/adjudicate"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == PENDING"
          - "Any adjudication rule fails (wrong window, anti-fraud ordering violation, insufficient benefit pool, duplicate BUNDLE_CASE, etc.)"
        side_effects:
          - "adjudicated_payable_cents := 0"
          - "adjudication_reason set to the specific failure reason code"
      - from: APPROVED
        to: PAID
        trigger: "POST /coe/claims/{id}/pay"
        actor: ClaimsAdmin
        preconditions:
          - "Claim.status == APPROVED"
        side_effects: []
      - from: APPROVED
        to: ABSORBED
        trigger: "system (episode closes while an APPROVED claim is unpaid)"
        actor: system
        preconditions:
          - "Parent Episode transitions to CLOSED"
        side_effects:
          - "Claim.status := ABSORBED; the approved amount is never remitted"

  - entity: TravelBenefit
    field: status
    initial_state: ADMINISTERED
    terminal_states: [RELEASED]
    transitions:
      - from: ADMINISTERED
        to: RELEASED
        trigger: "system (episode closes via CLOSED, or episode terminates via AVOIDED / CANCELLED)"
        actor: system
        preconditions:
          - "Parent Episode reaches CLOSED, AVOIDED, or CANCELLED"
        side_effects:
          - "Status := RELEASED"

  - entity: CarePlanItem
    field: status
    initial_state: OPEN
    terminal_states: [DONE, WAIVED]
    transitions:
      - from: OPEN
        to: DONE
        trigger: "POST /coe/care-items/{id}/complete"
        actor: CareCoordinator
        preconditions:
          - "Item.status == OPEN"
        side_effects: []
      - from: OPEN
        to: WAIVED
        trigger: "POST /coe/care-items/{id}/waive, or system cascade (episode AVOIDED / CANCELLED)"
        actor: "CareCoordinator or system"
        preconditions:
          - "Item.status == OPEN"
        side_effects: []

  - entity: Employer
    field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /coe/employers/{id}/terminate"
        actor: ProgramAdmin
        preconditions:
          - "Employer.status == ACTIVE"
        side_effects:
          - "All of the employer's Contracts in DRAFT or ACTIVE transition to TERMINATED (their own cascade to episodes and care items then fires)"

  - entity: BundleTemplate
    field: status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /coe/bundle-templates/{id}/retire"
        actor: ProgramAdmin
        preconditions:
          - "Template.status == ACTIVE"
        side_effects: []

  - entity: Screening
    field: "(append-only; no status field)"
    initial_state: "(immutable record)"
    terminal_states: []
    transitions: []
    note: "Append-only log entry. Immutable once created; no update endpoint exists."

  - entity: SecondOpinionReview
    field: "(append-only; no status field)"
    initial_state: "(immutable record)"
    terminal_states: []
    transitions: []
    note: "Append-only log entry. Immutable once created; no update endpoint exists."

  - entity: Readmission
    field: "(append-only record; computed fields fixed at creation)"
    initial_state: "(immutable record)"
    terminal_states: []
    transitions: []
    note: "Append-only. absorbed_cents and out_of_window are computed once at recording and never change."

  - entity: EmployerReport
    field: status
    initial_state: GENERATED
    terminal_states: [GENERATED]
    transitions: []
    note: "Snapshot entity; regeneration of the same (employer_id, period_month) updates computed fields in place (upsert)."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: episode-mutation-stale-version
    parent_entity: Episode
    write_endpoint: "POST /coe/episodes/{id}/schedule"
    occ_field: expected_episode_version
    description: |
      Any episode mutation (schedule, reschedule, surgery-complete, discharge,
      claim submission, benefit administration, review recording) carries
      expected_episode_version; the day counter advance-day and readmission
      recording do not (they are coordinator-internal steps). When the episode's version has advanced since
      the client last observed it — for example a screening auto-transition
      bumped the version between the client's read and this write — the write
      is rejected as stale rather than applied against an out-of-date episode.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: contract-reprice-stale-version
    parent_entity: Contract
    write_endpoint: "POST /coe/contracts/{id}/reprice"
    occ_field: expected_contract_version
    description: |
      A reprice amendment carries expected_contract_version. When the contract's
      version has advanced since the client last observed it (for example a
      prior accepted amendment changed bundle_price_cents), the amendment is
      rejected as stale so a client cannot reprice against a superseded price
      schedule.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: claim_adjudication
    trigger: "POST /coe/claims/{id}/adjudicate"
    algorithm: waterfall_allocation
    formula: |
      Evaluate in order; the first failing rule yields DENIED with that reason.

      BUNDLE_CASE:
        1. Episode.price_rule resolved (always true post-approval).
        2. Anti-fraud: service_date_seq >= episode.surgery_done_seq, else
           DENIED (reason SERVICE_BEFORE_SURGERY). Note: another episode's
           surgery_done_seq is never consulted — scoping to the wrong episode
           is caught by the FK, not by this check.
        3. No other claim on this episode with claim_type == BUNDLE_CASE and
           status in {APPROVED, PAID, ABSORBED}; else DENIED (reason
           DUPLICATE_BUNDLE_CASE).
        4. Payable decomposition (evaluation order pinned):
           a. excess = max(0, billed_cents - contract.outlier_threshold_cents)
           b. outlier_payable = (excess * contract.outlier_share_pct) / 100,
              integer division truncated to cents
           c. payable = episode.applied_bundle_price_cents + outlier_payable
           The price basis (LOCKED original vs REPRICED latest amendment) comes
           from price_basis_determination; changing the applied basis changes
           this payable for the same billed_cents.
        5. APPROVED with adjudicated_payable_cents := payable.
      RELATED_CARE:
        1. Episode in POST_OP_TRACKING or CLOSED (surgery has occurred).
        2. service_date_seq in the half-open warranty window
           [discharge_seq, warranty_end_seq); else DENIED (reason
           OUTSIDE_WARRANTY_WINDOW).
        3. payable = min(billed_cents, max(0, applied_bundle_price_cents -
           allocated_cents)) where allocated_cents is the sum of
           adjudicated_payable_cents over this episode's claims in
           {APPROVED, PAID} of type BUNDLE_CASE or RELATED_CARE.
        4. APPROVED (payable may be 0 when the bundle is exhausted).
      TRAVEL / LODGING:
        1. Episode reached APPROVED at some point (benefits exist only under
           a live bundle).
        2. payable = min(billed_cents, remaining pool) where remaining pool =
           contract.travel_benefit_cents (or lodging_benefit_cents) minus the
           sum of ADMINISTERED TravelBenefit.amount_cents of that kind on the
           episode, minus adjudicated_payable_cents of this episode's
           {APPROVED, PAID} claims of the same claim_type.
        3. If remaining pool == 0: DENIED (reason BENEFIT_POOL_EXHAUSTED).
           Else APPROVED with the payable above (a partial draw is allowed).
      READMISSION:
        1. A Readmission record exists on this episode whose recorded_seq is
           in [discharge_seq, warranty_end_seq); else DENIED (reason
           READMISSION_OUT_OF_WINDOW).
        2. Template scope check: if the template's readmit_policy is
           RELATED_ONLY and claim.is_readmit_related is false, DENIED (reason
           UNRELATED_READMISSION). ALL_CAUSE templates ignore
           is_readmit_related.
        3. payable = max(0, billed_cents - readmission.absorbed_cents) for the
           matching in-window readmission.
        4. APPROVED with that payable (may be 0 when fully absorbed).
    input_set: "Claim + parent Episode + Episode's Contract (+ template pinned at contract creation) + episode's claims and travel benefits"
    constants:
      QUIET_TAIL_DAYS: 7
    precision: "integer cents; outlier division truncates (no rounding)"
    variants:
      - name: locked_basis
        when: "Episode.price_rule == LOCKED"
        difference: "BUNDLE_CASE payable uses the contract's original bundle_price_cents / component snapshot captured at approval"
      - name: repriced_basis
        when: "Episode.price_rule == REPRICED"
        difference: "BUNDLE_CASE payable uses the latest reprice amendment price and components"

  - name: readmission_absorption
    trigger: "POST /coe/episodes/{id}/readmissions"
    algorithm: threshold
    formula: |
      if recorded_seq >= episode.warranty_end_seq:
        out_of_window = true
        absorbed_cents = 0                       # employer bears the cost
      else:
        out_of_window = false
        if template.readmit_policy == ALL_CAUSE:
          absorbed_cents = provider_billed_cents  # full absorption
        else:  # RELATED_ONLY
          absorbed_cents = provider_billed_cents if related == true else 0
    input_set: "Episode (warranty_end_seq, discharge_seq), contract's pinned template readmit_policy, the readmission input"
    precision: "integer cents"

  - name: employer_monthly_outcomes
    trigger: "POST /coe/employers/{id}/reports/generate"
    algorithm: aggregation
    formula: |
      Scope: episodes of this employer whose terminal/closed seq falls inside
      the calendar month [first day of period_month, first day of next month)
      measured on the global logical clock at their terminal event. An episode
      qualifies as 'in-month' when its terminal screen_seq was stamped by an
      advance whose clock date is in the month (tests pin this via
      _clock/set_current_utc before advancing).

      avoided_procedures_count =
        count(episodes with status == AVOIDED in-month)
      avoided_cost_estimate_cents =
        sum over those episodes of employer.baseline_rate_book.rates[episode.family]
      closed_with_surgery =
        episodes with status == CLOSED and surgery_done_seq > 0 in-month
      readmission_rate_pct =
        if closed_with_surgery == 0: 0.00
        else round_half_up(100 * count(closed_with_surgery having >= 1 in-window
             Readmission) / closed_with_surgery, 2)
      warranty_absorbed_total_cents =
        sum(Readmission.absorbed_cents) over Readmissions of in-month closed episodes
      avg_days_to_schedule =
        if no episode of this employer was first scheduled in-month: 0.00
        else round_half_up(mean(scheduled_start_seq - approve_seq) over those
             episodes, 2)
    input_set: "Episodes of the employer with terminal/closed/scheduled events in period_month; Readmissions; employer baseline RateBook"
    precision: "integer cents; pct and day averages at 2 decimal places, round_half_up"

  - name: estimated_total_billed
    trigger: "read of GET /coe/episodes/{id}"
    algorithm: forward_looking
    formula: |
      Variant employed (employer_baseline):
        estimate = employer.baseline_rate_book.rates[episode.family]
                   + unreleased travel/lodging accrual
      Variant clinic (provider_cost):
        estimate = episode.applied_bundle_price_cents
                   + (outlier projection if an outlier review flag is set:
                      (max(0, expected_billed_cents - outlier_threshold_cents)
                       * outlier_share_pct) / 100 truncated)
                   - unreleased travel/lodging accrual
      where unreleased accrual = sum of ADMINISTERED TravelBenefit.amount_cents
      on the episode (RELEASED benefits no longer count).
      The variant used is pinned by the view= query parameter
      (view=employer | view=clinic; default employer). Both variants are
      computed from the same episode state and differ in result.
    input_set: "Episode, Contract, Employer baseline RateBook, episode TravelBenefits"
    precision: "integer cents"
    variants:
      - name: employer_baseline
        when: "view=employer (default)"
        difference: "Anchored on the employer baseline rate for the procedure family plus remaining benefit accrual"
      - name: provider_cost
        when: "view=clinic"
        difference: "Anchored on the applied bundle price plus outlier projection minus remaining benefit accrual"

  - name: price_basis_determination
    trigger: "Episode approval transition (SOR_* -> APPROVED)"
    algorithm: threshold
    formula: |
      Let A be the latest amendment in contract.change_history (if any).
      if contract.reprice_count == 0:
        price_rule = LOCKED
        applied basis = contract.bundle_price_cents / rate_components as created
      else:
        if (screen_seq at approval - A.effective_from_seq) >= 30:
          price_rule = REPRICED
          applied basis = A.new_bundle_price_cents / new_rate_components
        else:
          price_rule = LOCKED
          applied basis = the price schedule in force before A (i.e. the
          contract's original price when reprice_count == 1, otherwise the
          previous amendment's price)
      Note the boundary: gap exactly 30 qualifies as REPRICED (>= 30).
      LOCKED with reprice_count > 0 resolves to the pre-latest-amendment
      schedule; LOCKED with reprice_count == 0 resolves to the created price —
      the two LOCKED resolutions are deliberately different lookups.
    input_set: "Contract.change_history, contract.reprice_count, episode screen_seq at approval"
    constants:
      REPRICE_NOTICE_DAYS: 30
    precision: "integer cents"

  - name: monthly_episode_cap
    trigger: "Episode approval transition"
    algorithm: threshold
    formula: |
      approved_this_month = count of episodes on this contract with status in
      {APPROVED, SCHEDULING, PRE_OP, SURGERY_DONE, POST_OP_TRACKING, CLOSED}
      whose approve_seq's clock date falls in the current calendar month.
      Approval is allowed iff approved_this_month < contract.episode_cap_per_month.
      Boundary: when approved_this_month == episode_cap_per_month the approval
      is rejected (ERR_CAPACITY_EXCEEDED); cap-1 approvals succeed.
      A cap of 0 forbids all approvals on the contract.
    input_set: "Episodes on the contract, contract.episode_cap_per_month"
    precision: "integer count"

  - name: concurrent_capacity_gate
    trigger: "Episode approval transition"
    algorithm: threshold
    formula: |
      active_now = count of episodes on this contract with status in
      {APPROVED, SCHEDULING, PRE_OP, SURGERY_DONE, POST_OP_TRACKING}.
      Approval is allowed iff active_now < contract.concurrent_capacity.
      Distinct from monthly_episode_cap: the concurrent gate releases capacity
      when episodes close, the monthly gate does not reset until the calendar
      month rolls over. A contract can pass the monthly gate and fail the
      concurrent gate, or vice versa.
    input_set: "Episodes on the contract, contract.concurrent_capacity"
    precision: "integer count"

  - name: scheduling_priority_gate
    trigger: "POST /coe/episodes/{id}/schedule"
    algorithm: weighted_scoring
    formula: |
      For a requesting episode E with triage_rank 0 (elective):
        blocked iff exists E2 on the same contract, same family, status ==
        APPROVED, E2.triage_rank == 1, E2.approve_seq < E.approve_seq.
      Urgent episodes (triage_rank == 1) are never blocked by this gate.
      Tie-break between urgent episodes is earliest approve_seq, then earliest
      created_at — never id.
      When the gate blocks: ERR_PRIORITY_BLOCKED.
    input_set: "Episodes on the contract with status APPROVED, triage_rank, approve_seq"
    precision: "integer seq comparison"

  - name: benefit_pool_remaining
    trigger: "TravelBenefit creation and TRAVEL/LODGING claim adjudication"
    algorithm: waterfall_allocation
    formula: |
      pool(kind) = contract.<kind>_benefit_cents
      used(kind) = sum(ADMINISTERED TravelBenefit.amount_cents of kind on the
                   episode) + sum(adjudicated_payable_cents of {APPROVED, PAID}
                   claims of the matching claim_type on the episode)
      remaining(kind) = pool(kind) - used(kind)
      TravelBenefit creation requires amount_cents <= remaining(kind)
      (boundary: amount exactly equal to remaining succeeds; one cent over
      fails with ERR_BENEFIT_POOL_EXCEEDED).
      Claim adjudication draws min(billed_cents, remaining) and denies only
      when remaining == 0 — the draw-side and reserve-side share one ledger.
    input_set: "Contract benefit caps, episode TravelBenefits (ADMINISTERED only), episode claims"
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted to invoke this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Scope: EmployerRep X-User-ID must equal the employer_id of the employer that owns the target resource chain; ClaimsAdmin / CareCoordinator / PhysicianReviewer are clinic-side and not employer-scoped; ProgramAdmin is global"
    error_id: ERR_FORBIDDEN_SCOPE
    http_status: 403
    applies_to: "employer-scoped reads and report generation"
  - priority: 4
    category: existence
    check: "Path identifiers exist, resolved left-to-right; non-existent UUID yields not-found"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: existence
    check: "Request body well-formed: required fields present, enums valid, types correct"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all mutating endpoints"
  - priority: 6
    category: state
    check: "Target resource's current state permits the transition or action (episode status, contract status, claim status, item status)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "state-transition endpoints"
  - priority: 7
    category: state
    check: "OCC: expected_*_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "episode mutations and contract reprice"
  - priority: 8
    category: business_temporal
    check: "Contract coverage window contains the action date (approval inside [effective_from, effective_to)); scheduling requested_day_seq strictly greater than current screen_seq"
    error_id: ERR_OUTSIDE_COVERAGE_WINDOW
    http_status: 422
    applies_to: "approval, scheduling"
  - priority: 9
    category: business_constraint
    check: "Structural/aggregate rules: activating contract's window must not overlap another ACTIVE contract of same employer+family; component sum equals bundle price; implant component within template cap; scheduling-priority gate; duplicate BUNDLE_CASE on an episode; unique intake_request_id per employer (replay vs conflict); one active episode per patient per procedure family"
    error_id: "ERR_CONTRACT_WINDOW_OVERLAP | ERR_COMPONENT_SUM_MISMATCH | ERR_IMPLANT_CAP_EXCEEDED | ERR_PRIORITY_BLOCKED | ERR_DUPLICATE_CASE_CLAIM | ERR_DUPLICATE_INTAKE_REQUEST | ERR_ACTIVE_EPISODE_EXISTS"
    http_status: 409
    applies_to: "contract activation, contract creation/reprice, scheduling, claim submission, episode intake"
  - priority: 10
    category: business_fiscal
    check: "Money/capacity rules: monthly episode cap, concurrent capacity, benefit pool remaining, outlier decomposition validity"
    error_id: "ERR_CAPACITY_EXCEEDED | ERR_BENEFIT_POOL_EXCEEDED"
    http_status: 422
    applies_to: "approval, benefit administration"
  - priority: 11
    category: business_safety
    check: "Clinical safety/quality gates: required PRE_OP care items complete before surgery completion; required POST_OP items resolved before closure; no PENDING claims at closure"
    error_id: "ERR_REQUIRED_CARE_INCOMPLETE | ERR_PENDING_CLAIMS"
    http_status: 422
    applies_to: "surgery-complete, advance-day closure"
  - priority: 12
    category: business_referential
    check: "FK targets exist and are usable: patient belongs to the employer on the contract; template not RETIRED at contract creation; employer ACTIVE at contract activation"
    error_id: "ERR_PATIENT_EMPLOYER_MISMATCH | ERR_TEMPLATE_RETIRED | ERR_EMPLOYER_TERMINATED"
    http_status: 422
    applies_to: "episode intake, contract creation/activation"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Employers ---
  - method: POST
    path: "/coe/employers"
    description: "Register a self-funded employer"
    roles: [ProgramAdmin]
    code: 201
    input: [legal_name, ein, baseline_rate_book]
    output: Employer
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/coe/employers/{id}"
    description: "Get employer"
    roles: [ProgramAdmin, EmployerRep, ClaimsAdmin, CareCoordinator]
    code: 200
    input: []
    output: Employer
    side_effects: []
  - method: GET
    path: "/coe/employers"
    description: "List employers (paginated)"
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "baseline_rate_book?", "limit?", "offset?"]
    output: "Employer[]"
    side_effects: []
  - method: POST
    path: "/coe/employers/{id}/terminate"
    description: "Terminate an employer; cascades to contracts and their episodes"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Employer
    side_effects: ["Employer.status -> TERMINATED", "contracts cascade to TERMINATED", "pre-approval episodes cascade to CANCELLED", "open care items WAIVED"]
  - method: GET
    path: "/coe/employers/{id}/contracts"
    description: "List contracts of an employer"
    roles: [ProgramAdmin, EmployerRep]
    code: 200
    input: []
    output: "Contract[]"
    side_effects: []
  - method: GET
    path: "/coe/contracts"
    description: "List contracts (filterable)"
    roles: [ProgramAdmin]
    code: 200
    input: ["employer_id?", "template_id?", "status?", "limit?", "offset?"]
    output: "Contract[]"
    side_effects: []
  - method: GET
    path: "/coe/employers/{id}/patients"
    description: "List patients of an employer"
    roles: [ProgramAdmin, EmployerRep, CareCoordinator]
    code: 200
    input: []
    output: "Patient[]"
    side_effects: []
  - method: GET
    path: "/coe/patients"
    description: "List patients (filterable)"
    roles: [ProgramAdmin, CareCoordinator]
    code: 200
    input: ["employer_id?", "limit?", "offset?"]
    output: "Patient[]"
    side_effects: []
  - method: GET
    path: "/coe/employers/{id}/reports"
    description: "List generated employer reports"
    roles: [ProgramAdmin, EmployerRep]
    code: 200
    input: []
    output: "EmployerReport[]"
    side_effects: []

  # --- Bundle templates / rate books ---
  - method: POST
    path: "/coe/bundle-templates"
    description: "Create a bundle template"
    roles: [ProgramAdmin]
    code: 201
    input: [procedure_family, label, warranty_days, implant_component_cap_cents, readmit_policy]
    output: BundleTemplate
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/coe/bundle-templates/{id}"
    description: "Get bundle template"
    roles: [ProgramAdmin, EmployerRep, ClaimsAdmin, CareCoordinator, PhysicianReviewer]
    code: 200
    input: []
    output: BundleTemplate
    side_effects: []
  - method: POST
    path: "/coe/bundle-templates/{id}/retire"
    description: "Retire a template (blocks new contracts; existing contracts unaffected)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: BundleTemplate
    side_effects: ["status -> RETIRED"]
  - method: POST
    path: "/coe/rate-books"
    description: "Create a baseline rate book"
    roles: [ProgramAdmin]
    code: 201
    input: [book_code, rates]
    output: RateBook
    side_effects: []
  - method: GET
    path: "/coe/rate-books/{id}"
    description: "Get a rate book"
    roles: [ProgramAdmin, EmployerRep]
    code: 200
    input: []
    output: RateBook
    side_effects: []

  # --- Contracts ---
  - method: POST
    path: "/coe/contracts"
    description: "Create a bundled case-rate contract (starts DRAFT; pins template version)"
    roles: [ProgramAdmin]
    code: 201
    input: [employer_id, template_id, effective_from, effective_to, bundle_price_cents, rate_components, outlier_threshold_cents, outlier_share_pct, episode_cap_per_month, concurrent_capacity, travel_benefit_cents, lodging_benefit_cents, companion_allowed]
    output: Contract
    side_effects: ["status=DRAFT", "template_version pinned from template", "reprice_count=0", "change_history=[]"]
  - method: GET
    path: "/coe/contracts/{id}"
    description: "Get contract"
    roles: [ProgramAdmin, EmployerRep, ClaimsAdmin, CareCoordinator]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: POST
    path: "/coe/contracts/{id}/activate"
    description: "Activate a DRAFT contract (overlap gate applies)"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/coe/contracts/{id}/reprice"
    description: "Amend bundle price/components (OCC on contract version; appends change_history)"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_contract_version, new_bundle_price_cents, new_rate_components]
    output: Contract
    side_effects: ["appends change_history entry with effective_from_seq", "reprice_count += 1", "increments Contract.version by 1", "bundle_price_cents / rate_components updated"]
  - method: POST
    path: "/coe/contracts/{id}/terminate"
    description: "Terminate a contract; cascades to pre-approval episodes"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> TERMINATED", "pre-approval episodes -> CANCELLED", "their OPEN care items -> WAIVED"]

  # --- Patients ---
  - method: POST
    path: "/coe/patients"
    description: "Register a patient under an employer"
    roles: [CareCoordinator, ProgramAdmin]
    code: 201
    input: [employer_id, full_name, dob, member_id]
    output: Patient
    side_effects: []
  - method: GET
    path: "/coe/patients/{id}"
    description: "Get patient"
    roles: [ProgramAdmin, EmployerRep, CareCoordinator, PhysicianReviewer, ClaimsAdmin]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # --- Episodes ---
  - method: POST
    path: "/coe/episodes"
    description: "Open an episode (intake). Idempotent per (employer, intake_request_id)."
    roles: [CareCoordinator]
    code: 201
    input: [patient_id, contract_id, intake_request_id, "triage_rank?"]
    output: Episode
    side_effects: ["status=INTAKE_PENDING", "screen_seq=0", "family copied from contract template", "duplicate key with identical payload replays the original 201; same key with different payload -> ERR_DUPLICATE_INTAKE_REQUEST"]
  - method: GET
    path: "/coe/episodes/{id}"
    description: "Get episode; computes estimated_total_billed_cents per view=employer|clinic (default employer)"
    roles: [ProgramAdmin, EmployerRep, CareCoordinator, PhysicianReviewer, ClaimsAdmin]
    code: 200
    input: ["view?"]
    output: Episode
    side_effects: []
  - method: GET
    path: "/coe/episodes"
    description: "List episodes (filterable)"
    roles: [ProgramAdmin, EmployerRep, CareCoordinator, ClaimsAdmin]
    code: 200
    input: ["contract_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: "Episode[]"
    side_effects: []
  - method: POST
    path: "/coe/episodes/{id}/screenings"
    description: "Submit an eligibility screening document (drives auto-transitions)"
    roles: [CareCoordinator]
    code: 201
    input: [doc_type, result]
    output: Screening
    side_effects: ["episode status INTAKE_PENDING->SCREENING on first doc", "CANDIDATE result auto-transitions episode to SOR_PENDING", "NOT_A_CANDIDATE auto-transitions to CANCELLED", "episode screen_seq increments"]
  - method: GET
    path: "/coe/episodes/{id}/screenings"
    description: "List screening documents of an episode"
    roles: [ProgramAdmin, CareCoordinator, PhysicianReviewer]
    code: 200
    input: []
    output: "Screening[]"
    side_effects: []
  - method: GET
    path: "/coe/screenings/{id}"
    description: "Get a screening document"
    roles: [ProgramAdmin, CareCoordinator, PhysicianReviewer]
    code: 200
    input: []
    output: Screening
    side_effects: []
  - method: POST
    path: "/coe/episodes/{id}/reviews"
    description: "Record a second-opinion review conclusion"
    roles: [PhysicianReviewer]
    code: 201
    input: [conclusion, expected_episode_version]
    output: SecondOpinionReview
    side_effects: ["episode status transitions per conclusion (SOR_REVIEW / APPROVED / AVOIDED)", "on APPROVED: price basis determination + capacity gates", "on AVOIDED: benefits released, care items waived", "increments Episode.version by 1", "episode screen_seq increments"]
  - method: GET
    path: "/coe/episodes/{id}/reviews"
    description: "List second-opinion reviews of an episode"
    roles: [ProgramAdmin, CareCoordinator, PhysicianReviewer]
    code: 200
    input: []
    output: "SecondOpinionReview[]"
    side_effects: []
  - method: GET
    path: "/coe/reviews/{id}"
    description: "Get a second-opinion review"
    roles: [ProgramAdmin, CareCoordinator, PhysicianReviewer]
    code: 200
    input: []
    output: SecondOpinionReview
    side_effects: []
  - method: POST
    path: "/coe/episodes/{id}/schedule"
    description: "Schedule (or reschedule) the surgery day; scheduling-priority gate applies"
    roles: [CareCoordinator]
    code: 200
    input: [requested_day_seq, expected_episode_version]
    output: Episode
    side_effects: ["status APPROVED->SCHEDULING (or stays SCHEDULING on reschedule)", "scheduled_start_seq set", "increments Episode.version by 1", "episode screen_seq increments"]
  - method: POST
    path: "/coe/episodes/{id}/care-items"
    description: "Add a pre/post-op care coordination item with a local provider"
    roles: [CareCoordinator]
    code: 201
    input: [phase, local_provider_name, required]
    output: CarePlanItem
    side_effects: ["item created OPEN", "first PRE_OP item moves episode SCHEDULING->PRE_OP"]
  - method: POST
    path: "/coe/episodes/{id}/surgery-complete"
    description: "Mark the surgery performed"
    roles: [CareCoordinator]
    code: 200
    input: [expected_episode_version]
    output: Episode
    side_effects: ["status PRE_OP->SURGERY_DONE", "surgery_done_seq stamped", "increments Episode.version by 1", "episode screen_seq increments"]
  - method: POST
    path: "/coe/episodes/{id}/discharge"
    description: "Discharge the patient; opens the warranty window"
    roles: [CareCoordinator]
    code: 200
    input: [expected_episode_version]
    output: Episode
    side_effects: ["status SURGERY_DONE->POST_OP_TRACKING", "discharge_seq / warranty_end_seq / warranty_close_seq stamped", "increments Episode.version by 1", "episode screen_seq increments"]
  - method: POST
    path: "/coe/episodes/{id}/advance-day"
    description: "Advance the episode day counter by one; auto-closes the episode at warranty_close_seq when closure preconditions hold"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: Episode
    side_effects: ["episode screen_seq increments", "at warranty_close_seq with no OPEN required POST_OP items and no PENDING claims: status -> CLOSED, closed_outcome set, ADMINISTERED benefits -> RELEASED, unpaid APPROVED claims -> ABSORBED", "increments Episode.version by 1"]
  - method: POST
    path: "/coe/episodes/{id}/readmissions"
    description: "Record a readmission inside or outside the warranty window"
    roles: [CareCoordinator]
    code: 201
    input: [related, provider_billed_cents]
    output: Readmission
    side_effects: ["recorded_seq stamped from episode screen_seq", "out_of_window and absorbed_cents computed per readmission_absorption", "episode screen_seq increments", "episode status re-asserted POST_OP_TRACKING (never regresses)"]
  - method: GET
    path: "/coe/episodes/{id}/readmissions"
    description: "List readmissions of an episode"
    roles: [ProgramAdmin, CareCoordinator, ClaimsAdmin, EmployerRep]
    code: 200
    input: []
    output: "Readmission[]"
    side_effects: []
  - method: GET
    path: "/coe/readmissions/{id}"
    description: "Get a readmission record"
    roles: [ProgramAdmin, CareCoordinator, ClaimsAdmin, EmployerRep]
    code: 200
    input: []
    output: Readmission
    side_effects: []
  - method: POST
    path: "/coe/episodes/{id}/claims"
    description: "Submit a claim line for the bundle across provider entities"
    roles: [ClaimsAdmin]
    code: 201
    input: [claim_type, submitting_entity, service_date_seq, billed_cents, expected_episode_version, "is_readmit_related?"]
    output: Claim
    side_effects: ["claim created PENDING", "increments Episode.version by 1"]
  - method: GET
    path: "/coe/episodes/{id}/claims"
    description: "List claims of an episode"
    roles: [ProgramAdmin, ClaimsAdmin, EmployerRep]
    code: 200
    input: []
    output: "Claim[]"
    side_effects: []
  - method: POST
    path: "/coe/episodes/{id}/benefits"
    description: "Administer a travel or lodging benefit for patient or companion under the bundle"
    roles: [CareCoordinator]
    code: 201
    input: [kind, traveler, amount_cents, expected_episode_version]
    output: TravelBenefit
    side_effects: ["benefit created ADMINISTERED", "benefit pool debited per benefit_pool_remaining", "increments Episode.version by 1"]

  # --- Claims ---
  - method: GET
    path: "/coe/claims/{id}"
    description: "Get claim"
    roles: [ProgramAdmin, ClaimsAdmin, EmployerRep]
    code: 200
    input: []
    output: Claim
    side_effects: []
  - method: POST
    path: "/coe/claims/{id}/adjudicate"
    description: "Adjudicate a PENDING claim per claim_adjudication"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["status PENDING->APPROVED or DENIED", "adjudicated_payable_cents and adjudication_reason set"]
  - method: POST
    path: "/coe/claims/{id}/pay"
    description: "Pay an APPROVED claim"
    roles: [ClaimsAdmin]
    code: 200
    input: []
    output: Claim
    side_effects: ["status APPROVED->PAID"]

  # --- Care items ---
  - method: GET
    path: "/coe/care-items/{id}"
    description: "Get care plan item"
    roles: [ProgramAdmin, CareCoordinator]
    code: 200
    input: []
    output: CarePlanItem
    side_effects: []
  - method: GET
    path: "/coe/episodes/{id}/care-items"
    description: "List care plan items of an episode"
    roles: [ProgramAdmin, CareCoordinator, PhysicianReviewer]
    code: 200
    input: []
    output: "CarePlanItem[]"
    side_effects: []
  - method: POST
    path: "/coe/care-items/{id}/complete"
    description: "Mark a care item done"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: CarePlanItem
    side_effects: ["status OPEN->DONE"]
  - method: POST
    path: "/coe/care-items/{id}/waive"
    description: "Waive a care item"
    roles: [CareCoordinator]
    code: 200
    input: []
    output: CarePlanItem
    side_effects: ["status OPEN->WAIVED"]

  # --- Benefits / reports ---
  - method: GET
    path: "/coe/benefits/{id}"
    description: "Get travel/lodging benefit"
    roles: [ProgramAdmin, CareCoordinator, EmployerRep]
    code: 200
    input: []
    output: TravelBenefit
    side_effects: []
  - method: GET
    path: "/coe/episodes/{id}/benefits"
    description: "List benefits of an episode"
    roles: [ProgramAdmin, CareCoordinator, EmployerRep]
    code: 200
    input: []
    output: "TravelBenefit[]"
    side_effects: []
  - method: POST
    path: "/coe/employers/{id}/reports/generate"
    description: "Generate (or regenerate) the employer's monthly outcomes report snapshot"
    roles: [ProgramAdmin, EmployerRep]
    code: 201
    input: [period_month]
    output: EmployerReport
    side_effects: ["upserts EmployerReport for (employer_id, period_month)", "computed fields refreshed per employer_monthly_outcomes", "computed_seq stamped"]
  - method: GET
    path: "/coe/reports/{id}"
    description: "Get an employer report"
    roles: [ProgramAdmin, EmployerRep]
    code: 200
    input: []
    output: EmployerReport
    side_effects: []

  # --- Test-driving (logical clock) ---
  - method: POST
    path: "/coe/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-09-01T00:00:00Z; the logical clock never falls back to wall-clock time. Drives coverage-window checks, monthly bucketing, and the 30-day reprice notice when combined with advance-day."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock updated"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role / X-User-ID headers missing or role not declared" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role may not invoke this endpoint" }
  - { id: ERR_FORBIDDEN_SCOPE, http: 403, condition: "EmployerRep acting on a resource chain owned by a different employer" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path identifier does not resolve to an existing resource" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum value, or malformed body" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current resource state forbids the requested transition or action (e.g., screening on an APPROVED episode, review on a SCREENING episode, adjudicate a PAID claim)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent's current version (OCC)" }
  - { id: ERR_OUTSIDE_COVERAGE_WINDOW, http: 422, condition: "Approval attempted outside the contract's [effective_from, effective_to) window, or scheduling requested_day_seq not strictly in the future" }
  - { id: ERR_CONTRACT_WINDOW_OVERLAP, http: 409, condition: "Activating contract's window overlaps another ACTIVE contract for the same employer and procedure family" }
  - { id: ERR_COMPONENT_SUM_MISMATCH, http: 409, condition: "rate_components values do not sum exactly to bundle_price_cents (creation or reprice)" }
  - { id: ERR_IMPLANT_CAP_EXCEEDED, http: 409, condition: "Implant component exceeds the template's implant_component_cap_cents" }
  - { id: ERR_PRIORITY_BLOCKED, http: 409, condition: "Elective episode scheduling blocked by an earlier-approved urgent episode on the same contract and family" }
  - { id: ERR_DUPLICATE_CASE_CLAIM, http: 409, condition: "Episode already has a BUNDLE_CASE claim in APPROVED/PAID/ABSORBED" }
  - { id: ERR_DUPLICATE_INTAKE_REQUEST, http: 409, condition: "intake_request_id already used by this employer with a different payload" }
  - { id: ERR_ACTIVE_EPISODE_EXISTS, http: 409, condition: "Patient already has a non-terminal episode in this procedure family" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Monthly episode cap reached or concurrent capacity reached on the contract" }
  - { id: ERR_BENEFIT_POOL_EXCEEDED, http: 422, condition: "Travel/lodging benefit or claim exceeds the remaining per-episode pool" }
  - { id: ERR_REQUIRED_CARE_INCOMPLETE, http: 422, condition: "A required PRE_OP (or POST_OP at closure) care item is still OPEN" }
  - { id: ERR_PENDING_CLAIMS, http: 422, condition: "Episode closure attempted while a claim is PENDING" }
  - { id: ERR_PATIENT_EMPLOYER_MISMATCH, http: 422, condition: "Patient does not belong to the employer that owns the contract" }
  - { id: ERR_TEMPLATE_RETIRED, http: 422, condition: "Bundle template is RETIRED; new contracts cannot reference it" }
  - { id: ERR_EMPLOYER_TERMINATED, http: 422, condition: "Employer is TERMINATED; contract activation and new intakes blocked" }
  - { id: ERR_CLAIM_OUTSIDE_WARRANTY, http: 422, condition: "RELATED_CARE service_date_seq outside [discharge_seq, warranty_end_seq) or READMISSION without an in-window readmission (adjudication reason OUTSIDE_WARRANTY_WINDOW / READMISSION_OUT_OF_WINDOW)" }
  - { id: ERR_READMISSION_POLICY_SCOPE, http: 422, condition: "RELATED_ONLY template: READMISSION claim with is_readmit_related=false (adjudication reason UNRELATED_READMISSION)" }
  - { id: ERR_CLAIM_BEFORE_SURGERY, http: 422, condition: "Claim service_date_seq precedes the episode's surgery_done_seq (anti-fraud ordering; adjudication reason SERVICE_BEFORE_SURGERY)" }
  - { id: ERR_BENEFIT_KIND_MISMATCH, http: 422, condition: "COMPANION traveler benefit on a contract with companion_allowed=false" }
  - { id: ERR_MONTH_FORMAT_INVALID, http: 400, condition: "period_month not in YYYY-MM form" }
  - { id: ERR_EPISODE_NOT_APPROVED, http: 422, condition: "TRAVEL/LODGING claim on an episode that never reached APPROVED" }
  - { id: ERR_NO_IN_WINDOW_READMISSION, http: 422, condition: "READMISSION claim without a matching in-window Readmission record" }
  - { id: ERR_VIEW_UNKNOWN, http: 400, condition: "view query parameter not employer|clinic" }
  - { id: ERR_RATE_FAMILY_MISSING, http: 422, condition: "Employer baseline rate book has no rate for the episode's procedure family (report/estimate cannot be computed)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "COE program operator; owns program configuration, contracts, templates, rate books, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /coe/employers, POST /coe/employers/{id}/terminate"
      - "POST /coe/bundle-templates, POST /coe/bundle-templates/{id}/retire"
      - "POST /coe/rate-books"
      - "POST /coe/contracts and contract activate/reprice/terminate"
      - "POST /coe/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
      - "POST /coe/employers/{id}/reports/generate"
      - "POST /coe/patients"
  - name: EmployerRep
    description: "Employer-side benefits administrator; reads program data for their own employer and generates reports"
    identity: "entity_backed:Employer"
    exclusive_operations: []
    shared_operations:
      - "GET endpoints for employers, contracts, episodes, claims, benefits, reports (scope-checked to own employer)"
      - "POST /coe/employers/{id}/reports/generate (own employer only)"
  - name: CareCoordinator
    description: "Clinic care coordinator; drives intake, screening, scheduling, care items, surgery, discharge, day advance, readmissions, benefits"
    identity: opaque
    exclusive_operations:
      - "POST /coe/episodes (intake)"
      - "POST /coe/episodes/{id}/screenings"
      - "POST /coe/episodes/{id}/schedule"
      - "POST /coe/episodes/{id}/care-items"
      - "POST /coe/episodes/{id}/surgery-complete, /discharge, /advance-day"
      - "POST /coe/episodes/{id}/readmissions"
      - "POST /coe/episodes/{id}/benefits"
      - "POST /coe/care-items/{id}/complete, /waive"
    shared_operations:
      - "GET endpoints for episodes, patients, contracts, templates, care items, benefits, readmissions"
      - "POST /coe/patients"
  - name: PhysicianReviewer
    description: "Second-opinion physician; records review conclusions"
    identity: opaque
    exclusive_operations:
      - "POST /coe/episodes/{id}/reviews"
    shared_operations:
      - "GET endpoints for episodes, screenings, reviews, care items, templates, patients"
  - name: ClaimsAdmin
    description: "Clinic claims administrator; submits bundle claim lines across provider entities and adjudicates/pays them"
    identity: opaque
    exclusive_operations:
      - "POST /coe/episodes/{id}/claims"
      - "POST /coe/claims/{id}/adjudicate"
      - "POST /coe/claims/{id}/pay"
    shared_operations:
      - "GET endpoints for claims, episodes, employers, templates, patients, readmissions"
