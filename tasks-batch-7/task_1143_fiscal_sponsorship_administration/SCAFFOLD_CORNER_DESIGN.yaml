            - { call: "POST /fsa/exit-plans/${ep}/execute", payload: {}, as: SponsorAdmin, as_user_id: user_sa_1, captures: { fee: $.data.exit_fee_cents, tr: $.data.transfer_cents, res: $.data.reserve_cents, pay: $.data.committed_payout_cents } }
          assert:
            - "reserve_cents == 0 and committed_payout_cents == 0 (no findings, no commitments)"
            - "exit_fee_cents == 99360 (round_half_up(0.02 x 4,968,000); percent branch exceeds the 50,000 min)"
            - "transfer_cents == 4868640; bucket sum 0 + 0 + 99360 + 4868640 == 4968000 == G"

      - name: c_exit_waterfall_min_branch
        claim_type: correct_result
        grounds: [calculations.exit_settlement_waterfall]
        excluded_because:
          difficulty_instance: combinatorial_formula / exit_waterfall_evaluation_order_pinned
          rationale: "The min-fee branch (6000 < 50000 -> 50000) with buckets 200040/500000/50000/250000 is asserted in the named difficulty instance."

      - name: c_mission_score_rounding_order
        claim_type: precision
        grounds: [calculations.mission_alignment_score]
        excluded_because:
          difficulty_instance: combinatorial_formula / mission_score_rounding_order_pinned
          rationale: "Per-component-vs-sum-first divergence (60.39 vs 60.37) is asserted in the named difficulty instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: v_missing_required_field_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Missing required field mission_statement on application create -> ERR_VALIDATION (400) before any auth or business check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /fsa/applications", payload: { project_name: "NoMission", budget_estimate_cents: 1000, contact_email: "nm@x.org" }, as: Applicant, as_user_id: user_c_v1, captures: { e: $.data.error_id } }
          assert:
            - "error_id == ERR_VALIDATION (HTTP 400)"

      - name: v_invalid_enum_returns_400
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "action MAYBE is not a declared member of the mission-score action enum -> ERR_INVALID_ENUM (400)."
        test_recipe:
          setup: ["application SUBMITTED"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "IE", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "ie@x.org" }, as: Applicant, as_user_id: user_c_v2, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_v2 }
          trigger:
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "MAYBE" }, as: ProgramOfficer, as_user_id: user_po_1, captures: { e: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_ENUM (HTTP 400); status remains SUBMITTED"

      - name: v_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role / X-User-ID headers -> ERR_UNAUTHENTICATED (401) even for a read endpoint."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /fsa/projects", payload: {}, as: Anonymous, captures: { e: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (HTTP 401)"

      - name: v_ownership_submit_by_other_applicant_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_NOT_RESOURCE_OWNER]"]
        distinguishing_aspect: "The Applicant role is necessary but not sufficient: X-User-ID must equal applicant_user_id; a different applicant gets ERR_NOT_RESOURCE_OWNER (403)."
        test_recipe:
          setup: ["application in DRAFT owned by user_c_v3"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "OW", mission_statement: "m", budget_estimate_cents: 1000, contact_email: "ow@x.org" }, as: Applicant, as_user_id: user_c_v3, captures: { app: $.data.id } }
          trigger:
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_other, captures: { e: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_RESOURCE_OWNER (HTTP 403); status remains DRAFT"

      - name: v_priority_state_vs_fiscal
        claim_type: priority_conflict
        grounds: ["validations[priority=7]", "validations[priority=25]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_state_error_beats_insufficient_funds
          rationale: "Dual-failure ordering (state beats fiscal) is asserted in the named difficulty instance."

      - name: v_priority_safety_vs_constraint
        claim_type: priority_conflict
        grounds: ["validations[priority=8]", "validations[priority=14]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / employment_safety_error_beats_duplicate_constraint
          rationale: "Dual-failure ordering (safety beats constraint) is asserted in the named difficulty instance."

      - name: v_refund_exceeds_remaining
        claim_type: violation_to_error
        grounds: ["validations[priority=27]", "errors[ERR_REFUND_EXCEEDS_REMAINING]"]
        distinguishing_aspect: "Requesting 100,001 back on a 100,000 RECEIVED donation -> ERR_REFUND_EXCEEDS_REMAINING (422); exactly 100,000 would pass the gate."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; donation 100,000 RECEIVED"]
          setup_api_calls:
            - { call: "POST /fsa/applications", payload: { project_name: "RX", mission_statement: "m", requested_model: "COMPREHENSIVE", budget_estimate_cents: 1000, contact_email: "rx@x.org" }, as: Applicant, as_user_id: user_c_v4, captures: { app: $.data.id } }
            - { call: "POST /fsa/applications/${app}/submit", payload: {}, as: Applicant, as_user_id: user_c_v4 }
            - { call: "POST /fsa/applications/${app}/mission-score", payload: { purpose_pts: 50, benefit_pts: 50, capacity_pts: 100, risk_pts: 0, action: "ADVANCE" }, as: ProgramOfficer, as_user_id: user_po_1 }
            - { call: "POST /fsa/applications/${app}/compliance-decision", payload: { decision: "APPROVE", sponsorship_model: "COMPREHENSIVE" }, as: ComplianceOfficer, as_user_id: user_co_1, captures: { p: $.data.project_id, ag: $.data.agreement_id } }
            - { call: "POST /fsa/agreements/${ag}/countersign", payload: {}, as: Applicant, as_user_id: user_c_v4 }
