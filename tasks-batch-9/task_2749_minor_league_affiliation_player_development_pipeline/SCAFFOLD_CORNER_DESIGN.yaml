# ============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Corner / Breadth Design
# Task 2749 — Minor League Affiliation & Player Development Pipeline
#
# Sections and claim_type values are taken from
# references/claim-extraction-guide.md; no categories are invented.
# Corners already asserted by §1.8 are emitted as `excluded_because:` stubs
# citing the covering instance by name.
# ============================================================================

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: create_affiliate_returns_all_declared_fields_with_computed_defaults
        claim_type: creation
        grounds:
          - entities.Affiliate
          - "endpoints[POST /affiliates]"
        distinguishing_aspect: "A single POST /affiliates with every optional field supplied returns 201 and echoes all 15 declared fields plus id/created_at/updated_at/version, with the five computed counters initialised to their declared defaults."
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
          trigger:
            - call: "POST /affiliates"
              payload: { name: "Tulsa Drillers", level: "DOUBLE_A", market_city: "Tulsa", meal_stipend_cents_per_day: 3200, roster_limit: 26, reserve_slots: 30, housing_beds: 45, travel_standard_tier: "BUS_SLEEPER" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
          assert:
            - "HTTP status is 201 and the envelope is { ok: true, data: {...}, error_id: null }"
            - "Affiliate.${c1_id}.name == 'Tulsa Drillers', level == DOUBLE_A, market_city == 'Tulsa', meal_stipend_cents_per_day == 3200"
            - "Affiliate.${c1_id}.roster_limit == 26, reserve_slots == 30, housing_beds == 45, travel_standard_tier == BUS_SLEEPER"
            - "Affiliate.${c1_id}.active_roster_count == 0, rehab_assignment_count == 0, reserve_list_count == 0, open_major_deficiency_count == 0"
            - "Affiliate.${c1_id}.facility_score == 100.00 and facility_status == COMPLIANT"
            - "Affiliate.${c1_id}.version == 1 and id, created_at, updated_at are all non-null"

      - name: get_affiliate_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - "endpoints[GET /affiliates/{id}]"
          - entities.Affiliate
        distinguishing_aspect: "GET /affiliates/{id} returns byte-identical field values to the creation response, including the derived counters, and does not bump version."
        test_recipe:
          setup:
            - "One affiliate created with defaults for the four optional fields."
          setup_api_calls:
            - call: "POST /affiliates"
              payload: { name: "Rome Emperors", level: "HIGH_A", market_city: "Rome", meal_stipend_cents_per_day: 2800 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { c2_id: $.data.id, c2_v: $.data.version }
          trigger:
            - call: "GET /affiliates/${c2_id}"
              payload: {}
              as: MedicalDirector
              as_user_id: "u-med-1"
              captures: { c2_v2: $.data.version, c2_name: $.data.name }
          assert:
            - "HTTP status is 200 and Affiliate.${c2_id}.name == 'Rome Emperors' with level == HIGH_A"
            - "Affiliate.${c2_id}.version is unchanged by the read (c2_v == c2_v2 == 1)"
            - "Affiliate.${c2_id}.facility_score == 100.00 and facility_status == COMPLIANT on the read path too"

      - name: list_affiliates_honours_limit_offset_total_count_and_has_more
        claim_type: listing
        grounds:
          - "endpoints[GET /affiliates]"
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With exactly three affiliates stored, limit 2 offset 0 returns 2 rows with total_count 3 and has_more true, and limit 2 offset 2 returns 1 row with has_more false."
        test_recipe:
          setup:
            - "Exactly three affiliates exist, created in a fixed order."
          setup_api_calls:
            - call: "POST /affiliates"
              payload: { name: "Alpha Club", level: "SINGLE_A", market_city: "Asheville", meal_stipend_cents_per_day: 2600 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { l1: $.data.id }
            - call: "POST /affiliates"
              payload: { name: "Bravo Club", level: "HIGH_A", market_city: "Bowling Green", meal_stipend_cents_per_day: 2700 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { l2: $.data.id }
            - call: "POST /affiliates"
              payload: { name: "Charlie Club", level: "DOUBLE_A", market_city: "Chattanooga", meal_stipend_cents_per_day: 2900 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { l3: $.data.id }
          trigger:
            - call: "GET /affiliates"
              payload: { limit: 2, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { p1_first: "$.data[0].id" }
            - call: "GET /affiliates"
              payload: { limit: 2, offset: 2 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { p2_first: "$.data[0].id" }
            - call: "GET /affiliates"
              payload: { level: "HIGH_A" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { f1_first: "$.data[0].id" }
          assert:
            - "First page: data has length 2, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: data has length 1, total_count == 3, limit == 2, offset == 2, has_more == false"
            - "The two pages are disjoint and together cover all three ids ${l1}, ${l2}, ${l3}"
            - "Filtered read: GET /affiliates with level HIGH_A returns total_count == 1 and data[0].id == ${l2}"
            - "An unfiltered GET /affiliates with no pagination params applies the defaults limit == 10 and offset == 0"

      - name: get_affiliate_unknown_id_returns_affiliate_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=10]"
          - errors[ERR_AFFILIATE_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unstored UUID in the path yields 404 ERR_AFFILIATE_NOT_FOUND with data == null, not an empty 200 body."
        test_recipe:
          setup:
            - "Empty database; no affiliate has ever been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          trigger:
            - call: "GET /affiliates/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { nf_err: $.data.error_id }
          assert:
            - "HTTP status is 404 with error_id == ERR_AFFILIATE_NOT_FOUND"
            - "The envelope is { ok: false, data: null, error_id: 'ERR_AFFILIATE_NOT_FOUND', message: <non-empty> }"

      - name: create_affiliate_missing_required_level_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "validations[priority=20]"
          - errors[ERR_INVALID_REQUEST]
          - entities.Affiliate.fields.level
        distinguishing_aspect: "Omitting the required, default-less input field level yields 400 ERR_INVALID_REQUEST and stores nothing, distinct from supplying an out-of-enum value."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
          trigger:
            - call: "POST /affiliates"
              payload: { name: "No Level Club", market_city: "Nowhere", meal_stipend_cents_per_day: 2600 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { rf_err: $.data.error_id }
            - call: "GET /affiliates"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
          assert:
            - "HTTP status is 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /affiliates returns total_count == 0, so the rejected create persisted nothing"

      - name: omitting_roster_limit_applies_the_level_keyed_default
        claim_type: defaults
        grounds:
          - entities.Affiliate.fields.roster_limit
          - entities.Affiliate.fields.reserve_slots
          - entities.Affiliate.fields.travel_standard_tier
          - "endpoints[POST /affiliates]"
        distinguishing_aspect: "Two affiliates created without roster_limit receive 35 (COMPLEX) and 28 (TRIPLE_A) from LEVEL_ROSTER_LIMIT, proving the default is level-keyed rather than a single constant, while reserve_slots and travel_standard_tier take their flat defaults."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
          trigger:
            - call: "POST /affiliates"
              payload: { name: "Complex Site", level: "COMPLEX", market_city: "Port Charlotte", meal_stipend_cents_per_day: 2500 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { d1: $.data.id, d1_rl: $.data.roster_limit }
            - call: "POST /affiliates"
              payload: { name: "Top Club", level: "TRIPLE_A", market_city: "Reno", meal_stipend_cents_per_day: 3300 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { d2: $.data.id, d2_rl: $.data.roster_limit }
          assert:
            - "Affiliate.${d1}.roster_limit == 35 (LEVEL_ROSTER_LIMIT[COMPLEX])"
            - "Affiliate.${d2}.roster_limit == 28 (LEVEL_ROSTER_LIMIT[TRIPLE_A])"
            - "Both affiliates get reserve_slots == 35, housing_beds == 40 and travel_standard_tier == BUS_STANDARD"

      - name: create_player_generates_system_fields_and_initial_projections
        claim_type: system_fields
        grounds:
          - entities.Player
          - "endpoints[POST /players]"
        distinguishing_aspect: "POST /players mints id/created_at/updated_at/version 1 and initialises every source: system and source: computed field (roster_status RESERVE_LIST, medical_status PENDING_CLEARANCE, option_years_used 0, remaining 3, workload_index 0.00, promotion_readiness 0.0000) with no client involvement."
        test_recipe:
          setup:
            - "Empty database; only the two optional player inputs are exercised."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
          trigger:
            - call: "POST /players"
              payload: { full_name: "Systemic Fields", origin: "DOMESTIC_DRAFT", signed_date: "2025-06-10" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { sf_id: $.data.id, sf_v: $.data.version }
          assert:
            - "Player.${sf_id}.version == 1 and id, created_at, updated_at are non-null server values"
            - "Player.${sf_id}.roster_status == RESERVE_LIST and medical_status == PENDING_CLEARANCE"
            - "Player.${sf_id}.option_years_used == 0 and option_years_remaining == 3"
            - "Player.${sf_id}.workload_index == 0.00, workload_index_projected == 0.00 and promotion_readiness == 0.0000"
            - "Player.${sf_id}.current_affiliate_id == null and service_days_accrued == 0 (the omitted optional input)"

      - name: create_affiliate_out_of_enum_level_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "validations[priority=20]"
          - entities.Affiliate.fields.level
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A present-but-undeclared enum member (ROOKIE_LEAGUE) is rejected with 400 ERR_INVALID_REQUEST, and a numeric field below its declared range is rejected by the same rule, distinguishing type violation from omission."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
          trigger:
            - call: "POST /affiliates"
              payload: { name: "Bad Enum Club", level: "ROOKIE_LEAGUE", market_city: "Elsewhere", meal_stipend_cents_per_day: 2600 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { te_err: $.data.error_id }
            - call: "POST /affiliates"
              payload: { name: "Bad Range Club", level: "SINGLE_A", market_city: "Elsewhere", meal_stipend_cents_per_day: 2600, roster_limit: 0 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { te_err2: $.data.error_id }
            - call: "GET /affiliates"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
          assert:
            - "The out-of-enum level returns 400 with error_id == ERR_INVALID_REQUEST"
            - "roster_limit 0, below the declared range 1..40, also returns 400 with error_id == ERR_INVALID_REQUEST"
            - "GET /affiliates returns total_count == 0 after both rejections"

      - name: create_agreement_under_unknown_affiliate_returns_affiliate_not_found
        claim_type: parent_relationships
        grounds:
          - "validations[priority=10]"
          - entities.AffiliationAgreement.fields.affiliate_id
          - errors[ERR_AFFILIATE_NOT_FOUND]
        distinguishing_aspect: "The child create resolves its path parent before any body validation: an unstored affiliate id in the path returns 404 ERR_AFFILIATE_NOT_FOUND even though the body is fully valid, and ComplianceOfficer is used so the AffiliateOperator scope rule at priority 4 cannot mask it."
        test_recipe:
          setup:
            - "Empty database; no affiliate exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /affiliates/00000000-0000-4000-8000-000000000000/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_1", club_reimbursement_cap_cents: 900000 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { pr_err: $.data.error_id }
          assert:
            - "HTTP status is 404 with error_id == ERR_AFFILIATE_NOT_FOUND"
            - "The response is the ok == false envelope with data == null"

      - name: workload_log_is_an_immutable_event_with_no_version_or_mutator
        claim_type: immutability
        grounds:
          - entities.WorkloadLog
          - "endpoints[POST /assignments/{id}/workload-logs]"
          - "endpoints[GET /assignments/{id}/workload-logs]"
        distinguishing_aspect: "WorkloadLog declares common_fields: false and kind: event, so its create response carries no version field and §1.5 exposes no PUT, PATCH or DELETE for it — only append and list."
        test_recipe:
          setup:
            - "A SINGLE_A affiliate with an ACTIVE agreement (minimum_active_players 0), a cleared player and an ACTIVE LEVEL assignment."
          setup_api_calls:
            - call: "POST /affiliates"
              payload: { name: "Immutable Club", level: "SINGLE_A", market_city: "Lynchburg", meal_stipend_cents_per_day: 2600 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { im_aff: $.data.id }
            - call: "POST /affiliates/${im_aff}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { im_agr: $.data.id }
            - call: "POST /agreements/${im_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${im_aff}"
            - call: "POST /agreements/${im_agr}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /players"
              payload: { full_name: "Log Owner", origin: "DOMESTIC_DRAFT", signed_date: "2025-06-10" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { im_p: $.data.id }
            - call: "POST /players/${im_p}/medical-clearances"
              payload: { clearance_type: "LEVEL_ASSIGNMENT" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { im_c: $.data.id }
            - call: "POST /medical-clearances/${im_c}/disposition"
              payload: { action: "ISSUE", cleared_workload_ceiling_index: 25.00, expires_on: "2026-12-31" }
              as: MedicalDirector
              as_user_id: "u-med-1"
            - call: "GET /players/${im_p}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { im_pv: $.data.version }
            - call: "POST /assignments"
              payload: { player_id: "${im_p}", affiliate_id: "${im_aff}", assignment_type: "LEVEL", movement_reason: "INITIAL", effective_date: "2026-07-25", end_date: "2026-09-30", expected_player_version: "${im_pv}" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { im_asg: $.data.id }
            - call: "POST /assignments/${im_asg}/disposition"
              payload: { action: "ACTIVATE" }
              as: FarmDirector
              as_user_id: "u-farm-1"
          trigger:
            - call: "POST /assignments/${im_asg}/workload-logs"
              payload: { log_date: "2026-07-30", pitches_thrown: 20, innings_pitched: 1.0, high_intensity_minutes: 5 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { im_log: $.data.id }
            - call: "GET /assignments/${im_asg}/workload-logs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { im_first: "$.data[0].id" }
          assert:
            - "The create returns 201 and the WorkloadLog body carries id, assignment_id, log_date and the four measure fields but NO version field"
            - "GET /assignments/${im_asg}/workload-logs returns total_count == 1 and data[0].id == ${im_log}"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint for any /workload-logs path — append and list are the only operations"
            - "Omitted measures default to pitches_thrown 0, innings_pitched 0.0, high_intensity_minutes 0 and is_rehab_outing false"

      - name: workload_index_recomputed_when_the_clock_slides_the_rolling_window
        claim_type: computed_fields
        grounds:
          - calculations.player_workload_index
          - entities.Player.fields.workload_index
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: "A single log inside the 14-day window yields workload_index 0.55, and advancing the clock 19 days without any further write drops it to 0.00 — the field is derived from the window, never stored at write time."
        test_recipe:
          setup:
            - "The logical clock is at 2026-04-01T00:00:00Z."
            - "A SINGLE_A affiliate (LEVEL_WORKLOAD_MULTIPLIER 1.00) with an ACTIVE agreement, a cleared player and an ACTIVE LEVEL assignment 2026-04-01..2026-06-30."
            - "One non-rehab outing dated 2026-04-01 with 100 pitches, 0.0 innings and 0 high-intensity minutes: raw == 0.55 * (100/100) == 0.55."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /affiliates"
              payload: { name: "Window Club", level: "SINGLE_A", market_city: "Kannapolis", meal_stipend_cents_per_day: 2600 }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_aff: $.data.id }
            - call: "POST /affiliates/${wc_aff}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { wc_agr: $.data.id }
            - call: "POST /agreements/${wc_agr}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${wc_aff}"
            - call: "POST /agreements/${wc_agr}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /players"
              payload: { full_name: "Window Watcher", origin: "DOMESTIC_DRAFT", signed_date: "2025-06-10" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_p: $.data.id }
            - call: "POST /players/${wc_p}/medical-clearances"
              payload: { clearance_type: "LEVEL_ASSIGNMENT" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_c: $.data.id }
            - call: "POST /medical-clearances/${wc_c}/disposition"
              payload: { action: "ISSUE", cleared_workload_ceiling_index: 25.00, expires_on: "2026-12-31" }
              as: MedicalDirector
              as_user_id: "u-med-1"
            - call: "GET /players/${wc_p}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_pv: $.data.version }
            - call: "POST /assignments"
              payload: { player_id: "${wc_p}", affiliate_id: "${wc_aff}", assignment_type: "LEVEL", movement_reason: "INITIAL", effective_date: "2026-04-01", end_date: "2026-06-30", expected_player_version: "${wc_pv}" }
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wc_asg: $.data.id }
            - call: "POST /assignments/${wc_asg}/disposition"
              payload: { action: "ACTIVATE" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "POST /assignments/${wc_asg}/workload-logs"
              payload: { log_date: "2026-04-01", pitches_thrown: 100, innings_pitched: 0.0, high_intensity_minutes: 0 }
              as: FarmDirector
              as_user_id: "u-farm-1"
          trigger:
            - call: "GET /players/${wc_p}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wi_in: $.data.workload_index }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-20T00:00:00Z" }
              as: FarmDirector
              as_user_id: "u-farm-1"
            - call: "GET /players/${wc_p}"
              payload: {}
              as: FarmDirector
              as_user_id: "u-farm-1"
              captures: { wi_out: $.data.workload_index }
          assert:
            - "At clock 2026-04-01 the window is [2026-03-19, 2026-04-01] and Player.${wc_p}.workload_index == 0.55"
            - "At clock 2026-04-20 the window is [2026-04-06, 2026-04-20], the 2026-04-01 outing has aged out, and Player.${wc_p}.workload_index == 0.00"
            - "GET /assignments/${wc_asg}/workload-logs still returns total_count == 1: the log row is retained, only the derived field changed"
