  # =========================================================================
  # 8. From Cross-Cutting Complexity Layers
  #    Declared layers: dual_variant_calculation, cascading_side_effects,
  #    optimistic_concurrency, rate_threshold_triggers.
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: a_re_allocation_needs_the_current_cycle_version_and_supersedes_rather_than_edits
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[allocate-supersede-stale-cycle]
          - endpoints[POST /capital/cycles/{id}/allocate]
        distinguishing_aspect: >-
          The OCC field is the CYCLE version, and the first allocation run bumps it — so replaying the
          very same expected_cycle_version that just succeeded is a 412, and the rejected call must not
          bump the version or leave a fourth allocation row behind. The accepted re-run then SUPERSEDES
          the earlier row instead of editing it, so the allocation history grows while allocation_count
          stays 1.
        test_recipe:
          setup:
            - "Fixture F0 driven to a SCORED request RC with the cycle in SCORING; the version returned by score is captured before any allocation runs."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: CapitalPlanner
              as_user_id: "planner-setup"
            - call: "POST /capital/facilities"
              payload: { name: "North Regional Hospital", code: "NRH", region: "NORTH", max_concurrent_construction: 1 }
              as: CapitalPlanner
              as_user_id: "planner-setup"
              captures: { fac_a_id: $.data.id }
