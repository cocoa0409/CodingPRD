  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: imei_unique_across_noncancelled_enrollments
        grounds:
          - validations[priority=8]
          - entities.Enrollment.fields.imei
        distinguishing_aspect: |
          Occupation-interval semantics A: an IMEI occupies a coverage slot for the entire lifetime of a
          non-CANCELLED enrollment (open-ended interval). A second enrollment on the same IMEI while the
          first is non-CANCELLED is rejected ERR_DUPLICATE_IMEI; after the first is CANCELLED the slot frees.
        test_recipe:
          setup:
            - "Clock 2026-06-01. One ACTIVE enrollment holding IMEI_A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-15" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { e1: $.data.id }
            - call: "POST /enrollments/${e1}/activate"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneDup", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the second enrollment POST returns error_id == ERR_DUPLICATE_IMEI"

      - name: premium_invoice_cycle_uniqueness_per_enrollment
        grounds:
          - entities.PremiumInvoice.fields.cycle_index
          - validations[priority=5]
        distinguishing_aspect: |
          Occupation-interval semantics B (discrete index slot, distinct from IMEI's open-ended lifetime
          interval): each (enrollment_id, cycle_index) names one billing slot; issuing a second invoice
          for an already-issued cycle on the same enrollment collides on the discrete cycle slot and is
          rejected ERR_INVALID_STATE. Different resource entity (PremiumInvoice) and arithmetic (integer
          index equality) than the IMEI lifetime overlap.
        test_recipe:
          setup:
            - "Clock 2026-06-01. ACTIVE enrollment with cycle-0 invoice already ISSUED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-16" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /premium-invoices"
              payload: { enrollment_id: "${enr}", cycle_index: 0 }
              as: PlatformAdmin
              captures: { inv0: $.data.id }
          trigger:
            - call: "POST /premium-invoices"
              payload: { enrollment_id: "${enr}", cycle_index: 0 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "the second cycle-0 invoice POST returns error_id == ERR_INVALID_STATE"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: exchange_cancel_restores_stock_invariant
        grounds:
          - state_machines.Claim.APPROVED_to_ROUTED_REPLACE
          - state_machines.AdvancedExchange.RESERVED_to_CANCELLED
          - entities.ReplacementSku.fields.stock_on_hand
        distinguishing_aspect: |
          Conserved quantity = total ReplacementSku.stock_on_hand. REPLACE routing decrements stock by 1
          (RESERVED); cancelling the RESERVED exchange increments it by 1. Invariant: stock_on_hand
          returns to its pre-route value (5) after route+cancel — no drift.
        test_recipe:
          setup:
            - "Clock 2026-06-01. A LOST claim routed REPLACE against SKU (stock 5 -> 4); exchange RESERVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-17" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /claims"
              payload: { enrollment_id: "${enr}", peril: "LOST", incident_at: "2026-05-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { cl: $.data.id }
            - call: "POST /claims/${cl}/screen"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /enrollments/${enr}"
              payload: {}
              as: PlatformAdmin
              captures: { enr_v: $.data.version }
            - call: "POST /claims/${cl}/approve"
              payload: { expected_enrollment_version: "${enr_v}" }
              as: ClaimsAdjuster
            - call: "POST /claims/${cl}/route"
              payload: {}
              as: ClaimsAdjuster
            - call: "GET /advanced-exchanges?claim_id=${cl}"
              payload: {}
              as: ClaimsAdjuster
              captures: { ax: $.data.0.id }
          trigger:
            - call: "POST /advanced-exchanges/${ax}/cancel"
              payload: {}
              as: LogisticsAgent
              captures: { ax_status: $.data.status }
          assert:
            - "ReplacementSku.${sku}.stock_on_hand == 4 after route, before cancel"
            - "AdvancedExchange.${ax}.status == CANCELLED after the trigger"
            - "ReplacementSku.${sku}.stock_on_hand == 5 after cancel (invariant restored, no drift)"

      - name: cancel_enrollment_voids_premium_invoice_invariant
        grounds:
          - state_machines.Enrollment.ACTIVE_to_CANCELLED
          - entities.PremiumInvoice.fields.status
        distinguishing_aspect: |
          Conserved quantity = outstanding-billable balance (sum of amount_cents over ISSUED invoices).
          Different conserved type from stock units: cancelling an enrollment VOIDs its ISSUED invoices,
          driving the outstanding-billable sum to 0 — the forward action (issue) plus compensation (void
          on cancel) leaves no dangling billable balance.
        test_recipe:
          setup:
            - "Clock 2026-06-01. ACTIVE enrollment with one ISSUED cycle-0 invoice (amount 2000), no open claim."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { full_name: "C", carrier_account_number: "CA-DV-18" }
              as: PlatformAdmin
              captures: { cust: $.data.id }
            - call: "POST /plans"
              payload: { code: "PLAN_STD", monthly_premium_cents: 2000, base_deductible_cents: 10000, loss_deductible_multiplier_bps: 15000, annual_claim_limit: 2, replacement_value_cap_cents: 80000 }
              as: PlatformAdmin
              captures: { plan: $.data.id }
            - call: "POST /replacement-skus"
              payload: { model_name: "BOOK", msrp_cents: 90000, depreciation_rate_bps_per_month: 200, stock_on_hand: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /enrollments"
              payload: { customer_id: "${cust}", plan_id: "${plan}", imei: "356758901234560", device_model: "PhoneA", device_purchase_date: "2025-12-01T00:00:00Z", replacement_sku_id: "${sku}" }
              as: PlatformAdmin
              captures: { enr: $.data.id }
            - call: "POST /enrollments/${enr}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /premium-invoices"
              payload: { enrollment_id: "${enr}", cycle_index: 0 }
              as: PlatformAdmin
              captures: { inv0: $.data.id }
          trigger:
            - call: "POST /enrollments/${enr}/cancel"
              payload: {}
              as: PlatformAdmin
              captures: { enr_status: $.data.status }
          assert:
            - "PremiumInvoice.${inv0}.status == ISSUED before the trigger"
            - "Enrollment.${enr}.status == CANCELLED after the trigger"
            - "PremiumInvoice.${inv0}.status == VOID after the trigger (outstanding-billable sum == 0)"
