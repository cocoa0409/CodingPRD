  # ===========================================================================
  # Rule 4 — transitive_cascade: cascades where each link is CAUSED by the
  # previous link, from DIFFERENT triggering transitions.
  # Instance 1 (depth 4): ops run marks Invoice OVERDUE -> operator ->
  # DELINQUENT -> its vessels -> SUSPENDED -> their open deployments ->
  # CANCELLED with day release. Instance 2 (depth 3): EM enrollment
  # APPROVED->ACTIVE -> vessel.monitoring_mode flips -> open notices VOIDED ->
  # their pre-boarding deployments CANCELLED with day release.
  # Instance 3 (depth 2, harassment substantiation): report SUBSTANTIATED ->
  # at-sea deployment EARLY_TERMINATED -> notice day reconciliation.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: overdue_invoice_delinquency_cascade_depth4
        grounds:
          - state_machines.Invoice.ISSUED_to_OVERDUE
          - state_machines.VesselOperator.GOOD_to_DELINQUENT
          - state_machines.Vessel.ACTIVE_to_SUSPENDED
          - state_machines.Deployment.SCHEDULED_to_CANCELLED
          - entities.SelectionNotice.fields.remaining_sea_days
        distinguishing_aspect: |
          Depth-4 transitive chain from the ops-run invoice sweep: Invoice
          ISSUED->OVERDUE (hop 1) causes VesselOperator GOOD->DELINQUENT (hop 2),
          which itself causes every ACTIVE Vessel of the operator -> SUSPENDED
          (hop 3), which itself causes each of those vessels' Deployments in
          SCHEDULED|SAFETY_HOLD|READY_TO_DEPLOY -> CANCELLED with notice day
          release (hop 4). Each hop is triggered by the previous hop's mutation,
          not by the original ops run.
        test_recipe:
          setup:
            - "Fishery F, operator OP, vessel V ACTIVE, observer OBS LEAD, debriefer DEB"
            - "Plan P published; notice for V accepted; deployment D1 completed to CLOSED (10 days, 2026-09-10..2026-09-19)"
            - "Second deployment D2 for V scheduled 2026-10-01..2026-10-10 (SCHEDULED) against the same notice (reserved 10, remaining 10 after D1 consumed 10)"
            - "Invoice I generated for V's CLOSED D1 (STANDARD 10 days -> due 413763), issued at clock 2026-09-25 (due_date = 2026-10-25)"
            - "Clock advanced to 2026-10-26 (past due_date); ops run executes"
