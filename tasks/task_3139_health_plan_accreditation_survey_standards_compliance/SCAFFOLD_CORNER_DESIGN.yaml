# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3139_health_plan_accreditation_survey_standards_compliance
# Breadth probe over §1.1–§1.7 claims not exercised by SCAFFOLD_DIFFICULTY_DESIGN.
# Re-declares the base anchors locally (YAML anchors are file-scoped).
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: health_plan_create_returns_system_fields_and_active_status
        claim_type: Creation
        grounds:
          - entities.HealthPlan
          - endpoints.POST_/accreditation/health-plans
        distinguishing_aspect: "Creating a plan with only name and plan_code returns 201 with status ACTIVE, version 1, and server-minted id/created_at/updated_at; status is never client-supplied."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &k_clock
              call: "POST /accreditation/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &k_plan
              call: "POST /accreditation/health-plans"
              payload: { name: "Meridian Health Alliance", plan_code: "MHA-01" }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
          assert:
            - "response status == 201 and response_type == object"
            - "HealthPlan.${plan_id}.status == ACTIVE and version == 1"
            - "id, created_at, updated_at are non-null; created_at == 2026-09-01T00:00:00.000Z (logical clock)"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: health_plan_duplicate_plan_code_rejected
        claim_type: Type Constraints
        grounds:
          - entities.HealthPlan.fields.plan_code
          - errors.ERR_PLAN_CODE_DUPLICATE
        distinguishing_aspect: "plan_code uniqueness is global; the second create with the same code is a 409, not a 400."
        test_recipe:
          setup: ["One plan with plan_code MHA-01 exists."]
          setup_api_calls:
            - *k_clock
            - *k_plan
          trigger:
            - call: "POST /accreditation/health-plans"
              payload: { name: "Copycat Health", plan_code: "MHA-01" }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "status 409, error_id == ERR_PLAN_CODE_DUPLICATE"

      - name: health_plan_get_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/accreditation/health-plans/{planId}
          - errors.ERR_HEALTH_PLAN_NOT_FOUND
        distinguishing_aspect: "A well-formed but unknown UUID on the plan GET returns the entity-specific 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /accreditation/health-plans/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "status 404, error_id == ERR_HEALTH_PLAN_NOT_FOUND"
            - "response_type == error and data carries error_id and message"

      - name: health_plan_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/accreditation/health-plans
          - response_envelope
        distinguishing_aspect: "The list endpoint honors limit/offset and reports total_count and has_more per the fixed envelope defaults."
        test_recipe:
          setup: ["Three plans exist."]
          setup_api_calls:
            - *k_clock
            - *k_plan
            - call: "POST /accreditation/health-plans"
              payload: { name: "Cascade Peak Health", plan_code: "CPH-02" }
              as: PlatformAdmin
            - call: "POST /accreditation/health-plans"
              payload: { name: "Rio Verde Plan", plan_code: "RVP-03" }
              as: PlatformAdmin
          trigger:
            - call: "GET /accreditation/health-plans"
              payload: {}
              as: PublicViewer
          assert:
            - "response_type == array and data length == 3"
            - "total_count == 3, limit == 10 (default), offset == 0, has_more == false"

      - name: standards_edition_get_round_trips_configuration
        claim_type: Retrieval
        grounds:
          - entities.StandardsEdition
          - endpoints.GET_/accreditation/standards-editions/{editionId}
        distinguishing_aspect: "Every configuration field of the edition (including the 0.90 threshold and min sample size) round-trips through GET exactly as posted, with status DRAFT."
        test_recipe:
          setup: ["One edition created."]
          setup_api_calls:
            - *k_clock
            - &k_edition
              call: "POST /accreditation/standards-editions"
              payload: { edition_year: 2026, effective_from: "2026-01-01T00:00:00Z", effective_until: "2027-12-31T23:59:59Z", min_file_sample_per_category: 5, timeliness_threshold: 0.90 }
              as: PlatformAdmin
              captures: { edition_id: $.data.id }
          trigger:
            - call: "GET /accreditation/standards-editions/${edition_id}"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "edition_year == 2026, min_file_sample_per_category == 5, timeliness_threshold == 0.9"
            - "status == DRAFT, version == 1"

      - name: standard_element_create_missing_required_field
        claim_type: Required Fields
        grounds:
          - entities.StandardElement.fields.element_code
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting the required element_code is a 400 ERR_INVALID_REQUEST, not a 409."
        test_recipe:
          setup: ["One DRAFT edition exists."]
          setup_api_calls:
            - *k_clock
            - *k_edition
          trigger:
            - call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { category: "UM", max_points: 4, is_must_pass: true, evidence_required_count: 2 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "status 400, error_id == ERR_INVALID_REQUEST"

      - name: standard_element_invalid_category_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.StandardElement.fields.category
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "category is a closed enum {UM, CR, MRR, QI}; the value 'DENTAL' is rejected as a 400 before any existence or state check."
        test_recipe:
          setup: ["One DRAFT edition exists."]
          setup_api_calls:
            - *k_clock
            - *k_edition
          trigger:
            - call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { element_code: "X-1", category: "DENTAL", max_points: 4, is_must_pass: false, evidence_required_count: 0 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "status 400, error_id == ERR_INVALID_REQUEST"

      - name: product_line_scope_duplicate_product_line_rejected
        claim_type: Parent Relationships
        grounds:
          - entities.ProductLineScope
          - errors.ERR_PRODUCT_LINE_DUPLICATE
        distinguishing_aspect: "(health_plan_id, product_line) is unique; a second COMMERCIAL scope on the same plan is 409, while the same product_line on a DIFFERENT plan succeeds."
        test_recipe:
          setup: ["Plan A with a COMMERCIAL scope; plan B exists."]
          setup_api_calls:
            - *k_clock
            - *k_plan
            - &k_scope_a
              call: "POST /accreditation/health-plans/${plan_id}/product-line-scopes"
              payload: { product_line: "COMMERCIAL", state_codes: ["OR"], member_count: 50000 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
            - call: "POST /accreditation/health-plans"
              payload: { name: "Rio Verde Plan", plan_code: "RVP-03" }
              as: PlatformAdmin
              captures: { plan_b: $.data.id }
          trigger:
            - call: "POST /accreditation/health-plans/${plan_id}/product-line-scopes"
              payload: { product_line: "COMMERCIAL", state_codes: ["WA"], member_count: 1000 }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /accreditation/health-plans/${plan_b}/product-line-scopes"
              payload: { product_line: "COMMERCIAL", state_codes: ["TX"], member_count: 2000 }
              as: PlanCoordinator
              as_user_id: "${plan_b}"
          assert:
            - "first trigger: status 409, error_id == ERR_PRODUCT_LINE_DUPLICATE"
            - "second trigger (different plan): status 201"

      - name: application_create_scope_plan_mismatch
        claim_type: Parent Relationships
        grounds:
          - entities.AccreditationApplication.fields.product_line_scope_id
          - errors.ERR_SCOPE_PLAN_MISMATCH
        distinguishing_aspect: "An application created under plan A referencing plan B's scope is a 422 ERR_SCOPE_PLAN_MISMATCH (business_referential), not a 404."
        test_recipe:
          setup: ["Plan A with scope S; plan B exists; edition published."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - &k_el_um1
              call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { element_code: "UM-1", category: "UM", max_points: 4, is_must_pass: true, evidence_required_count: 2 }
              as: PlatformAdmin
              captures: { el_um1: $.data.id }
            - &k_publish
              call: "POST /accreditation/standards-editions/${edition_id}/publish"
              payload: {}
              as: PlatformAdmin
            - *k_plan
            - *k_scope_a
            - call: "POST /accreditation/health-plans"
              payload: { name: "Rio Verde Plan", plan_code: "RVP-03" }
              as: PlatformAdmin
              captures: { plan_b: $.data.id }
          trigger:
            - call: "POST /accreditation/health-plans/${plan_b}/applications"
              payload: { product_line_scope_id: "${scope_id}", standards_edition_id: "${edition_id}", review_period_start: "2025-01-01T00:00:00Z", review_period_end: "2025-12-31T23:59:59Z" }
              as: PlanCoordinator
              as_user_id: "${plan_b}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 422, error_id == ERR_SCOPE_PLAN_MISMATCH"

      - name: application_create_invalid_review_period
        claim_type: Type Constraints
        grounds:
          - entities.AccreditationApplication.fields.review_period_end
          - errors.ERR_REVIEW_PERIOD_INVALID
        distinguishing_aspect: "review_period_end equal to review_period_start is invalid (strictly greater required) — 422 ERR_REVIEW_PERIOD_INVALID."
        test_recipe:
          setup: ["Plan, scope, published edition."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - *k_publish
            - *k_plan
            - *k_scope_a
          trigger:
            - call: "POST /accreditation/health-plans/${plan_id}/applications"
              payload: { product_line_scope_id: "${scope_id}", standards_edition_id: "${edition_id}", review_period_start: "2025-06-01T00:00:00Z", review_period_end: "2025-06-01T00:00:00Z" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "status 422, error_id == ERR_REVIEW_PERIOD_INVALID"

      - name: file_review_sample_derives_category_from_type
        claim_type: Computed Fields
        grounds:
          - entities.FileReviewSample.fields.category
        distinguishing_aspect: "category is computed, never accepted as input: DENIAL -> UM, APPEAL -> UM, CREDENTIALING -> CR."
        test_recipe:
          setup: ["Application in EVIDENCE_REVIEW."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - *k_publish
            - *k_plan
            - *k_scope_a
            - &k_app
              call: "POST /accreditation/health-plans/${plan_id}/applications"
              payload: { product_line_scope_id: "${scope_id}", standards_edition_id: "${edition_id}", review_period_start: "2025-01-01T00:00:00Z", review_period_end: "2025-12-31T23:59:59Z" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - &k_submit
              call: "POST /accreditation/applications/${app_id}/submit"
              payload: { expected_application_version: "${app_v}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { app_vs: $.data.version }
            - &k_begin
              call: "POST /accreditation/applications/${app_id}/begin-evidence-review"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/applications/${app_id}/file-review-samples"
              payload: { sample_type: "CREDENTIALING", required_size: 5, timeliness_basis: "DECISION_DATE" }
              as: AccreditationOfficer
              captures: { sample_c: $.data.id }
          assert:
            - "FileReviewSample.${sample_c}.category == CR (computed from CREDENTIALING)"
            - "status == OPEN, timeliness_rate == null, timely_case_count == 0, must_pass_threshold_breached == false"

      - name: annual_report_due_date_computed_at_creation
        claim_type: Computed Fields
        grounds:
          - entities.AnnualReport.fields.due_date
          - calculations.annual_report_due_date
        distinguishing_aspect: "due_date is computed as (reporting_year + 1)-03-31T23:59:59Z; a 2027 report is due 2028-03-31T23:59:59Z regardless of when it is created."
        test_recipe:
          setup: ["Fully decided application with ACCREDITED outcome (closed)."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - &k_el_cr1
              call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { element_code: "CR-1", category: "CR", max_points: 4, is_must_pass: true, evidence_required_count: 1 }
              as: PlatformAdmin
              captures: { el_cr1: $.data.id }
            - *k_publish
            - *k_plan
            - *k_scope_a
            - *k_app
            - *k_submit
            - *k_begin
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "UM policy", expected_application_version: "${app_vs}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev1: $.data.id }
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v2: $.data.version }
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "UM procedure", expected_application_version: "${app_v2}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev2: $.data.id }
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v3: $.data.version }
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_cr1}", title: "CR minutes", expected_application_version: "${app_v3}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev3: $.data.id }
            - call: "POST /accreditation/evidence-items/${ev1}/accept"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/evidence-items/${ev2}/accept"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/evidence-items/${ev3}/accept"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/applications/${app_id}/advance-to-survey-scheduling"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v5: $.data.version }
            - &k_survey
              call: "POST /accreditation/applications/${app_id}/surveys"
              payload: { survey_type: "FULL", mode: "VIRTUAL", start_date: "2026-10-05", end_date: "2026-10-09", budgeted_surveyor_hours: 4, expected_application_version: "${app_v5}" }
              as: AccreditationOfficer
              captures: { survey_id: $.data.id }
            - &k_surveyor
              call: "POST /accreditation/surveyors"
              payload: { name: "Dana Lead", credential_level: "LEAD" }
              as: PlatformAdmin
              captures: { surveyor_id: $.data.id }
            - &k_session
              call: "POST /accreditation/surveys/${survey_id}/sessions"
              payload: { surveyor_id: "${surveyor_id}", session_date: "2026-10-05", start_minute: 540, end_minute: 660, is_onsite: false }
              as: AccreditationOfficer
              captures: { session_id: $.data.id }
            - call: "POST /accreditation/surveys/${survey_id}/confirm"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/survey-sessions/${session_id}/complete"
              payload: {}
              as: Surveyor
              as_user_id: "${surveyor_id}"
            - call: "POST /accreditation/surveys/${survey_id}/complete"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_um1}" }
              as: AccreditationOfficer
              captures: { sc1: $.data.id }
            - call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_cr1}" }
              as: AccreditationOfficer
              captures: { sc2: $.data.id }
            - call: "POST /accreditation/element-scores/${sc1}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/element-scores/${sc2}/finalize"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/applications/${app_id}/outcome"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "POST /accreditation/applications/${app_id}/annual-reports"
              payload: { reporting_year: 2027, attestation: "We attest the data submitted is complete and accurate." }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { report_id: $.data.id }
          assert:
            - "AnnualReport.${report_id}.due_date == 2028-03-31T23:59:59Z (computed)"
            - "status == DRAFT and is_late == false"

      - name: survey_frozen_cap_closure_rate_defaults_null_for_full
        claim_type: Defaults
        grounds:
          - entities.Survey.fields.frozen_cap_closure_rate
        distinguishing_aspect: "frozen_cap_closure_rate defaults to null on creation and remains null for FULL surveys even after confirm — it is only populated for RESURVEY."
        test_recipe:
          setup: ["Application in SURVEY_SCHEDULING; FULL survey confirmed."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - *k_publish
            - *k_plan
            - *k_scope_a
            - *k_app
            - *k_submit
            - *k_begin
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "UM policy", expected_application_version: "${app_vs}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev1: $.data.id }
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v2b: $.data.version }
            - call: "POST /accreditation/applications/${app_id}/evidence-items"
              payload: { standard_element_id: "${el_um1}", title: "UM procedure", expected_application_version: "${app_v2b}" }
              as: PlanCoordinator
              as_user_id: "${plan_id}"
              captures: { ev2: $.data.id }
            - call: "POST /accreditation/evidence-items/${ev1}/accept"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/evidence-items/${ev2}/accept"
              payload: {}
              as: AccreditationOfficer
            - call: "POST /accreditation/applications/${app_id}/advance-to-survey-scheduling"
              payload: {}
              as: AccreditationOfficer
            - call: "GET /accreditation/applications/${app_id}"
              payload: {}
              as: AccreditationOfficer
              captures: { app_v5b: $.data.version }
            - *k_survey
            - *k_surveyor
            - *k_session
            - call: "POST /accreditation/surveys/${survey_id}/confirm"
              payload: {}
              as: AccreditationOfficer
          trigger:
            - call: "GET /accreditation/surveys/${survey_id}"
              payload: {}
              as: AccreditationOfficer
          assert:
            - "Survey.${survey_id}.frozen_cap_closure_rate == null (FULL survey)"
            - "Survey.${survey_id}.status == CONFIRMED"

      - name: surveyor_active_field_is_system_default_true
        claim_type: System Fields
        grounds:
          - entities.Surveyor.fields.active
        distinguishing_aspect: "Surveyor.active is system-managed and always true on creation; client input for it is ignored."
        test_recipe:
          setup: ["Clock set."]
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /accreditation/surveyors"
              payload: { name: "Pat Staff", credential_level: "STAFF" }
              as: PlatformAdmin
              captures: { surveyor_s: $.data.id }
          assert:
            - "Surveyor.${surveyor_s}.active == true and version == 1"

      - name: element_score_computed_fields_ignore_client_values
        claim_type: Computed Fields
        grounds:
          - entities.ElementScore.fields.awarded_points
          - entities.ElementScore.fields.scoring_basis
        distinguishing_aspect: "ElementScore create takes ONLY standard_element_id; awarded_points, forfeited_points, scoring_basis, and all *_used fields are computed — a request cannot inject them (extra keys are a 400 ERR_INVALID_REQUEST)."
        test_recipe:
          setup: ["Application in EVIDENCE_REVIEW."]
          setup_api_calls:
            - *k_clock
            - *k_edition
            - *k_el_um1
            - *k_publish
            - *k_plan
            - *k_scope_a
            - *k_app
            - *k_submit
            - *k_begin
          trigger:
            - call: "POST /accreditation/applications/${app_id}/element-scores"
              payload: { standard_element_id: "${el_um1}" }
              as: AccreditationOfficer
              captures: { score_new: $.data.id }
          assert:
            - "ElementScore.${score_new}.status == PROVISIONAL and scoring_basis == FILE_REVIEW"
            - "ElementScore.${score_new}.awarded_points == 2.40 (no SCORED UM sample -> file round(4*0.6,2)=2.40; evidence 0/2 -> round(4*0.4*0,2)=0.00; min(4, 2.40))"
            - "ElementScore.${score_new}.forfeited_points == 1.60 (4 - 2.40)"
            - "sample_rate_used == null and evidence_count_used == 0 and gap_count_used == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: edition_starts_in_draft_and_publish_requires_element
        claim_type: Initial State
        grounds:
          - state_machines.StandardsEdition
          - errors.ERR_EDITION_HAS_NO_ELEMENTS
        distinguishing_aspect: "A new edition is DRAFT; publishing an edition with zero elements fails 409 ERR_EDITION_HAS_NO_ELEMENTS, and publish succeeds once one element exists."
        test_recipe:
          setup: ["One DRAFT edition with no elements."]
          setup_api_calls:
            - *k_clock
            - *k_edition
          trigger:
            - call: "POST /accreditation/standards-editions/${edition_id}/publish"
              payload: {}
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
            - call: "POST /accreditation/standards-editions/${edition_id}/standard-elements"
              payload: { element_code: "UM-1", category: "UM", max_points: 4, is_must_pass: true, evidence_required_count: 2 }
              as: PlatformAdmin
            - call: "POST /accreditation/standards-editions/${edition_id}/publish"
              payload: {}
              as: PlatformAdmin
          assert:
            - "first publish: 409 ERR_EDITION_HAS_NO_ELEMENTS"
            - "second publish: 200 and status == PUBLISHED"

      - name: application_submit_from_submitted_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AccreditationApplication
          - errors.ERR_APPLICATION_INVALID_STATE
        distinguishing_aspect: "SUBMITTED is not a valid from-state for submit; the second submit is 409 ERR_APPLICATION_INVALID_STATE (idempotency is NOT provided for action endpoints)."
        test_recipe:
          setup: ["Application SUBMITTED."]
