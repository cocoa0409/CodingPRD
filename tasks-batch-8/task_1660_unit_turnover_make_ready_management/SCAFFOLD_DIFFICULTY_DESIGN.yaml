# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — §1.8 Test Targeting Index
# 2 instances per Difficulty Rule (18 total). Every chain starts from empty-DB.
# Logical clock default is 2026-08-01T00:00:00Z unless a call sets it.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: turn_cost_operating_vs_all_in_views
        grounds:
          - calculations.turn_actual_cost_views
          - calculations.booked_cost_overhead
          - entities.Turn.fields.expense_actual_cents
          - entities.Turn.fields.capital_actual_cents
          - entities.Turn.fields.total_actual_cents
        distinguishing_aspect: |
          Same completed scope items yield two different turn-cost numbers on the
          Turn entity domain: operating view (expense_actual_cents == 1010,
          booked_expense_cents == 1035) excludes the CAPITAL appliance while the
          all-in view (total_actual_cents == 61010) includes it.
        test_recipe:
          setup:
            - "Property (PERCENT_OF_REPLACE policy, capital threshold 50000), Unit, Turn"
            - "REPAIR item (estimate 2000) completed at actual 1010 — EXPENSE"
            - "APPLIANCE item decided REPLACE at 60000 (>= 50000 → CAPITAL), completed at actual 60000"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "drywall patch", estimated_cost_cents: 2000 }
              as: TurnCoordinator
              captures: { it_r: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "APPLIANCE", description: "stove replacement", estimated_cost_cents: 55000 }
              as: TurnCoordinator
              captures: { it_a: $.data.id }
            - call: "POST /make-ready/turns/${t}/replacement-decisions"
              payload: { scope_item_id: "${it_a}", repair_estimate_cents: 58000, replace_estimate_cents: 60000, repair_life_years: 2, remaining_life_years: 8, decision: "REPLACE" }
              as: TurnCoordinator
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v_r: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it_r}", vendor_id: "${v_r}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg_r: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg_r}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_r}"
            - call: "POST /make-ready/vendor-assignments/${asg_r}/complete"
              payload: { actual_cost_cents: 1010 }
              as: Vendor
              as_user_id: "${v_r}"
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it_a}", vendor_id: "${v_r}", start_date: "2026-08-03", end_date: "2026-08-05" }
              as: TurnCoordinator
              captures: { asg_a: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg_a}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_r}"
            - call: "POST /make-ready/vendor-assignments/${asg_a}/complete"
              payload: { actual_cost_cents: 60000 }
              as: Vendor
              as_user_id: "${v_r}"
          trigger:
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: PropertyManager
          assert:
            - "Turn.${t}.expense_actual_cents == 1010"
            - "Turn.${t}.capital_actual_cents == 60000"
            - "Turn.${t}.total_actual_cents == 61010  (== expense + capital, partition invariant)"
            - "Turn.${t}.booked_expense_cents == 1035  (1010 + round_half_up(1010*0.025)=25; operating booked view excludes CAPITAL)"
            - "ScopeItem.${it_a}.classification == CAPITAL and ScopeItem.${it_r}.classification == EXPENSE"

      - name: replacement_policy_percent_vs_cost_per_year
        grounds:
          - calculations.replacement_policy_verdict
          - entities.Property.fields.replacement_policy
          - entities.ReplacementDecision.fields.policy_applied
        distinguishing_aspect: |
          Different entity domain than turn_cost_operating_vs_all_in_views
          (ReplacementDecision economics, not Turn cost accounting): identical
          estimates (repair 49000, replace 100000, lives 3/10) are REPAIR-allowed
          under PERCENT_OF_REPLACE (49000 < 50000) but REPAIR-denied under
          COST_PER_YEAR (49000*10=490000 >= 100000*3=300000).
        test_recipe:
          setup:
            - "Property P1 with replacement_policy PERCENT_OF_REPLACE; property P2 with COST_PER_YEAR"
            - "Each property has a unit, an OPEN turn, and an APPLIANCE scope item (estimate 55000)"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Percent Place", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p1: $.data.id }
            - call: "POST /make-ready/properties"
              payload: { name: "Annuity Acres", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "COST_PER_YEAR" }
              as: RegionalManager
              captures: { p2: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p1}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p2}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u2: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u1}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t1: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u2}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t2: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t1}", category: "APPLIANCE", description: "dishwasher", estimated_cost_cents: 55000 }
              as: TurnCoordinator
              captures: { it1: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t2}", category: "APPLIANCE", description: "dishwasher", estimated_cost_cents: 55000 }
              as: TurnCoordinator
              captures: { it2: $.data.id }
          trigger:
            - call: "POST /make-ready/turns/${t1}/replacement-decisions"
              payload: { scope_item_id: "${it1}", repair_estimate_cents: 49000, replace_estimate_cents: 100000, repair_life_years: 3, remaining_life_years: 10, decision: "REPAIR" }
              as: TurnCoordinator
              captures: { dec1: $.data.id }
            - call: "POST /make-ready/turns/${t2}/replacement-decisions"
              payload: { scope_item_id: "${it2}", repair_estimate_cents: 49000, replace_estimate_cents: 100000, repair_life_years: 3, remaining_life_years: 10, decision: "REPAIR" }
              as: TurnCoordinator
              captures: { err2: $.data.error_id }
          assert:
            - "decision ${dec1} created: policy_applied == PERCENT_OF_REPLACE, resulting_classification == EXPENSE"
            - "ScopeItem.${it1}.estimated_cost_cents == 49000 (chosen path estimate applied)"
            - "second trigger fails: error_id == ERR_UNECONOMICAL_REPAIR (http 422)"
            - "ScopeItem.${it2}.estimated_cost_cents unchanged == 55000 (no decision recorded)"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: projected_ready_date_multi_input_with_cure_buffer
        grounds:
          - calculations.projected_ready_date
          - entities.Turn.fields.projected_ready_date
        distinguishing_aspect: |
          Mode (a) — >=3 inputs with non-linear interaction: max(current clock
          2026-08-01, scheduled paint end 2026-08-07) as anchor, then sequential
          per-category STANDARD_DAYS accumulation over PLANNED items in
          sequence_rank order, plus a conditional CURE_BUFFER_DAYS branch because
          the turn's PAINT item is not yet complete → 2026-08-10.
        test_recipe:
          setup:
            - "Turn SCOPED with PAINT item (estimate 100000) scheduled [2026-08-05, 2026-08-07) via a SCHEDULED assignment"
            - "CARPET item (4000) and CLEAN item (3000) added post-finalize, auto-PLANNED (variance 400bp then 700bp <= 1000bp pm threshold)"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 7, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "PAINT", description: "full repaint", estimated_cost_cents: 100000 }
              as: TurnCoordinator
              captures: { it_p: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "PaintPros", trade: "PAINT" }
              as: PropertyManager
              captures: { v_p: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it_p}", vendor_id: "${v_p}", start_date: "2026-08-05", end_date: "2026-08-07" }
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "CARPET", description: "bedroom carpet", estimated_cost_cents: 4000 }
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "CLEAN", description: "final clean", estimated_cost_cents: 3000 }
              as: TurnCoordinator
          trigger:
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: TurnCoordinator
          assert:
            - "Turn.${t}.projected_ready_date == 2026-08-10  (anchor max(08-01, 08-07)=08-07; CARPET: +1 cure (PAINT SCHEDULED, not complete) +1 day → 08-09; CLEAN: +1 → 08-10)"
            - "Turn.${t}.target_ready_date == 2026-08-08  (started 08-01 + days_to_ready_target 7)"

      - name: booked_cost_per_item_rounding_order
        grounds:
          - calculations.booked_cost_overhead
          - entities.Turn.fields.booked_expense_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order: two EXPENSE items at 1010 cents each
          give per-item overhead round_half_up(25.25)=25 twice → booked 2070,
          whereas the forbidden sum-then-round order gives
          round_half_up(50.50)=51 → 2071; the scaffold pins per-item-first.
        test_recipe:
          setup:
            - "Turn SCOPED with REPAIR item and CLEAN item (estimates 1000 each, approved budget 2000)"
            - "Both completed at actual_cost_cents 1010 each (repair [08-01,08-03), clean [08-03,08-04))"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "drywall", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { it_r: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "CLEAN", description: "clean", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { it_c: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v_r: $.data.id }
            - call: "POST /make-ready/vendors"
              payload: { name: "CleanCo", trade: "CLEAN" }
              as: PropertyManager
              captures: { v_c: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it_r}", vendor_id: "${v_r}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg_r: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg_r}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_r}"
            - call: "POST /make-ready/vendor-assignments/${asg_r}/complete"
              payload: { actual_cost_cents: 1010 }
              as: Vendor
              as_user_id: "${v_r}"
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it_c}", vendor_id: "${v_c}", start_date: "2026-08-03", end_date: "2026-08-04" }
              as: TurnCoordinator
              captures: { asg_c: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg_c}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_c}"
            - call: "POST /make-ready/vendor-assignments/${asg_c}/complete"
              payload: { actual_cost_cents: 1010 }
              as: Vendor
              as_user_id: "${v_c}"
          trigger:
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: PropertyManager
          assert:
            - "Turn.${t}.expense_actual_cents == 2020"
            - "Turn.${t}.booked_expense_cents == 2070  (per-item overhead 25 + 25)"
            - "Turn.${t}.booked_expense_cents != 2071  (sum-then-round would produce 51 overhead)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: turn_rework_loop_inprogress_to_ready_cycle
        grounds:
          - state_machines.Turn.IN_PROGRESS_to_REWORK
          - state_machines.Turn.REWORK_to_IN_PROGRESS
          - state_machines.Turn.IN_PROGRESS_to_READY
        distinguishing_aspect: |
          Turn machine is cyclic (not a linear pipeline): IN_PROGRESS → REWORK →
          IN_PROGRESS → READY via a failed-then-passed inspection loop.
        test_recipe:
          setup:
            - "Turn SCOPED with one PAINT item (estimate 8000); assignment [2026-08-01, 2026-08-03) accepted → IN_PROGRESS, completed at actual 5000"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "PAINT", description: "repaint", estimated_cost_cents: 8000 }
              as: TurnCoordinator
              captures: { it: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "PaintPros", trade: "PAINT" }
              as: PropertyManager
              captures: { v_p: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it}", vendor_id: "${v_p}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_p}"
            - call: "POST /make-ready/vendor-assignments/${asg}/complete"
              payload: { actual_cost_cents: 5000 }
              as: Vendor
              as_user_id: "${v_p}"
            - call: "POST /make-ready/turns/${t}/inspections"
              payload: { result: "FAIL", failed_scope_item_ids: ["${it}"], notes: "streaks on wall" }
              as: Inspector
            - call: "GET /make-ready/scope-items?rework_of_item_id=${it}"
              payload: {}
              as: TurnCoordinator
              captures: { rw: "$.data[0].id" }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${rw}", vendor_id: "${v_p}", start_date: "2026-08-03", end_date: "2026-08-05" }
              as: TurnCoordinator
              captures: { asg2: $.data.id }
          trigger:
            - call: "POST /make-ready/vendor-assignments/${asg2}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_p}"
            - call: "POST /make-ready/vendor-assignments/${asg2}/complete"
              payload: { actual_cost_cents: 4500 }
              as: Vendor
              as_user_id: "${v_p}"
            - call: "POST /make-ready/turns/${t}/inspections"
              payload: { result: "PASS", notes: "ok now" }
              as: Inspector
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: TurnCoordinator
          assert:
            - "rework item ${rw}.rework_of_item_id == ${it} and category == PAINT and estimated_cost_cents == 5000"
            - "accepting the rework assignment moved Turn.${t} REWORK → IN_PROGRESS (cycle traversed)"
            - "final Turn.${t}.status == READY and actual_ready_date == 2026-08-01 (logical clock never advanced)"
            - "Unit.${u}.status == READY"

      - name: lease_commitment_active_at_risk_cycle
        grounds:
          - state_machines.LeaseCommitment.ACTIVE_to_AT_RISK
          - state_machines.LeaseCommitment.AT_RISK_to_ACTIVE
        distinguishing_aspect: |
          Different entity than the Turn loop: the LeaseCommitment machine cycles
          ACTIVE → AT_RISK → ACTIVE purely from projected_ready_date recomputes
          caused by adding then voiding discretionary scope items.
        test_recipe:
          setup:
            - "Turn IN_PROGRESS: REPAIR item (estimate 100000, approved budget 100000) with assignment [2026-08-01, 2026-08-03) accepted"
            - "LeaseCommitment committed_delivery_date 2026-08-10 (projected 2026-08-03 at creation) → ACTIVE"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base repair", estimated_cost_cents: 100000 }
              as: TurnCoordinator
              captures: { it_r: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v_r: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it_r}", vendor_id: "${v_r}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_r}"
            - call: "POST /make-ready/lease-commitments"
              payload: { unit_id: "${u}", applicant_name: "A Lee", committed_delivery_date: "2026-08-10" }
              as: TurnCoordinator
              captures: { lc: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "extra repair", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { x1: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "APPLIANCE", description: "fridge", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { x2: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "FIXTURE", description: "vanity", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { x3: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "PAINT", description: "touch-up", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { x4: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "CARPET", description: "recarpet", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { x5: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "OTHER", description: "misc", estimated_cost_cents: 1000 }
              as: TurnCoordinator
              captures: { x6: $.data.id }
          trigger:
            - call: "GET /make-ready/units/${u}/lease-commitments"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items/${x1}/void"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items/${x2}/void"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items/${x3}/void"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items/${x4}/void"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items/${x5}/void"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items/${x6}/void"
              payload: {}
              as: TurnCoordinator
            - call: "GET /make-ready/units/${u}/lease-commitments"
              payload: {}
              as: TurnCoordinator
          assert:
            - "after the six adds: LeaseCommitment.${lc}.status == AT_RISK (projected 2026-08-12: anchor 08-03 → REPAIR+2 → APPLIANCE+1 → FIXTURE+1 → PAINT+2 → CARPET +1 cure +1 → 08-11 → OTHER+1 → 08-12 > committed 08-10)"
            - "after the six voids: LeaseCommitment.${lc}.status == ACTIVE again (projected falls back to 2026-08-03 <= 08-10)"
            - "all six added items are VOIDED and Turn.${t}.estimated_cost_cents == 100000"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: inspection_fail_rework_commitment_cascade
        grounds:
          - state_machines.Turn.IN_PROGRESS_to_REWORK
          - state_machines.ScopeItem.COMPLETED_to_FAILED
          - state_machines.LeaseCommitment.ACTIVE_to_AT_RISK
          - calculations.turn_estimated_cost
          - calculations.projected_ready_date
        distinguishing_aspect: |
          Depth-4 cascade from the inspection-FAIL trigger: FAIL → original item
          COMPLETED→FAILED (hop 1) → FAILED item spawns a PLANNED rework item
          (hop 2) → rework creation forces turn.estimated_cost_cents and
          projected_ready_date recompute (hop 3) → the slipped projection flips
          the unit's LeaseCommitment ACTIVE→AT_RISK (hop 4); each hop is caused
          by the previous hop's mutation, not by the original request.
        test_recipe:
          setup:
            - "Turn IN_PROGRESS: PAINT item (estimate 8000, approved 8000) completed at actual 5000"
            - "LeaseCommitment committed_delivery_date 2026-08-02 (projected was 2026-08-01 at creation) → ACTIVE"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "PAINT", description: "repaint", estimated_cost_cents: 8000 }
              as: TurnCoordinator
              captures: { it: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "PaintPros", trade: "PAINT" }
              as: PropertyManager
              captures: { v_p: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it}", vendor_id: "${v_p}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_p}"
            - call: "POST /make-ready/vendor-assignments/${asg}/complete"
              payload: { actual_cost_cents: 5000 }
              as: Vendor
              as_user_id: "${v_p}"
            - call: "POST /make-ready/lease-commitments"
              payload: { unit_id: "${u}", applicant_name: "A Lee", committed_delivery_date: "2026-08-02" }
              as: TurnCoordinator
              captures: { lc: $.data.id }
          trigger:
            - call: "POST /make-ready/turns/${t}/inspections"
              payload: { result: "FAIL", failed_scope_item_ids: ["${it}"], notes: "paint peeling" }
              as: Inspector
            - call: "GET /make-ready/scope-items?rework_of_item_id=${it}"
              payload: {}
              as: TurnCoordinator
              captures: { rw: "$.data[0].id" }
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: TurnCoordinator
            - call: "GET /make-ready/units/${u}/lease-commitments"
              payload: {}
              as: TurnCoordinator
          assert:
            - "ScopeItem.${it}.status == FAILED (hop 1)"
            - "exactly one rework item ${rw}: status PLANNED, category PAINT, estimated_cost_cents == 5000 (copied from failed item's actual), rework_of_item_id == ${it} (hop 2)"
            - "Turn.${t}.status == REWORK and estimated_cost_cents == 13000 (8000 FAILED + 5000 rework PLANNED) (hop 3)"
            - "Turn.${t}.projected_ready_date == 2026-08-03 (anchor 08-01 + PAINT 2 days)"
            - "LeaseCommitment.${lc}.status == AT_RISK (projected 08-03 > committed 08-02) (hop 4)"

      - name: assignment_complete_item_turn_rollup_cascade
        grounds:
          - state_machines.VendorAssignment.ACCEPTED_to_COMPLETED
          - state_machines.ScopeItem.SCHEDULED_to_COMPLETED
          - calculations.turn_actual_cost_views
          - calculations.booked_cost_overhead
        distinguishing_aspect: |
          Depth-2 cascade from a different trigger (assignment completion, not
          inspection): vendor complete → ScopeItem SCHEDULED→COMPLETED with
          actual_cost_cents (hop 1) → that completion recomputes the turn's
          expense/total/booked rollups (hop 2).
        test_recipe:
          setup:
            - "Turn IN_PROGRESS: REPAIR item (estimate 5000) with assignment [2026-08-01, 2026-08-03) accepted"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "plumbing fix", estimated_cost_cents: 5000 }
              as: TurnCoordinator
              captures: { it: $.data.id }
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "FixCo", trade: "REPAIR" }
              as: PropertyManager
              captures: { v_r: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it}", vendor_id: "${v_r}", start_date: "2026-08-01", end_date: "2026-08-03" }
              as: TurnCoordinator
              captures: { asg: $.data.id }
            - call: "POST /make-ready/vendor-assignments/${asg}/accept"
              payload: {}
              as: Vendor
              as_user_id: "${v_r}"
          trigger:
            - call: "POST /make-ready/vendor-assignments/${asg}/complete"
              payload: { actual_cost_cents: 4500 }
              as: Vendor
              as_user_id: "${v_r}"
            - call: "GET /make-ready/scope-items/${it}"
              payload: {}
              as: TurnCoordinator
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: TurnCoordinator
          assert:
            - "VendorAssignment.${asg}.status == COMPLETED"
            - "ScopeItem.${it}.status == COMPLETED and actual_cost_cents == 4500 (hop 1)"
            - "Turn.${t}.expense_actual_cents == 4500 and total_actual_cents == 4500 (hop 2)"
            - "Turn.${t}.booked_expense_cents == 4613 (4500 + round_half_up(112.50)=113 overhead)"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_rejected_item_approval
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_APPROVAL_AUTHORITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (state × business_fiscal): the item is REJECTED
          (state violation) AND its tier is RM while the caller is a
          PropertyManager (fiscal authority violation); the higher-priority
          state check wins → ERR_INVALID_STATE, not ERR_APPROVAL_AUTHORITY_EXCEEDED.
        test_recipe:
          setup:
            - "Turn SCOPED, approved_budget 100000; post-finalize OTHER item estimate 40000 → variance 4000bp > rm 3000bp → PENDING_APPROVAL tier RM; RegionalManager rejects it → REJECTED"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "REPAIR", description: "base", estimated_cost_cents: 100000 }
              as: TurnCoordinator
            - call: "POST /make-ready/turns/${t}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t}", category: "OTHER", description: "deck rebuild", estimated_cost_cents: 40000 }
              as: TurnCoordinator
              captures: { big: $.data.id }
            - call: "POST /make-ready/scope-items/${big}/reject"
              payload: {}
              as: RegionalManager
            - call: "GET /make-ready/turns/${t}"
              payload: {}
              as: PropertyManager
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /make-ready/scope-items/${big}/approve"
              payload: { expected_turn_version: "${tv}" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with error_id == ERR_INVALID_STATE (http 409) — state priority 6 beats business_fiscal priority 10"
            - "ScopeItem.${big}.status remains REJECTED; Turn.${t}.approved_budget_cents unchanged == 100000"

      - name: temporal_beats_sequence_on_assignment_create
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_VENDOR_OVERLAP]
          - errors[ERR_SEQUENCE_VIOLATION]
        distinguishing_aspect: |
          Different error-category pair than state_beats_fiscal: the request
          violates BOTH business_temporal (vendor calendar overlap with
          [2026-08-05, 2026-08-08)) AND business_constraint (a lower-rank REPAIR
          item is still PLANNED); temporal priority 8 beats constraint priority 9
          → ERR_VENDOR_OVERLAP, not ERR_SEQUENCE_VIOLATION.
        test_recipe:
          setup:
            - "Turn T1 SCOPED with PAINT item; vendor V (PAINT trade) has SCHEDULED assignment [2026-08-05, 2026-08-08) on T1"
            - "Turn T2 SCOPED (different unit) with REPAIR item PLANNED (incomplete) and PAINT item PLANNED"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 7, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
              captures: { p: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "101", square_feet: 800 }
              as: PropertyManager
              captures: { u1: $.data.id }
            - call: "POST /make-ready/units"
              payload: { property_id: "${p}", unit_number: "102", square_feet: 800 }
              as: PropertyManager
              captures: { u2: $.data.id }
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u1}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t1: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t1}", category: "PAINT", description: "repaint 101", estimated_cost_cents: 10000 }
              as: TurnCoordinator
              captures: { it1: $.data.id }
            - call: "POST /make-ready/turns/${t1}/finalize-scope"
              payload: {}
              as: TurnCoordinator
            - call: "POST /make-ready/vendors"
              payload: { name: "PaintPros", trade: "PAINT" }
              as: PropertyManager
              captures: { v_p: $.data.id }
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it1}", vendor_id: "${v_p}", start_date: "2026-08-05", end_date: "2026-08-08" }
              as: TurnCoordinator
            - call: "POST /make-ready/turns"
              payload: { unit_id: "${u2}", notice_date: "2026-07-28", move_out_date: "2026-07-31" }
              as: TurnCoordinator
              captures: { t2: $.data.id }
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t2}", category: "REPAIR", description: "repair 102", estimated_cost_cents: 1000 }
              as: TurnCoordinator
            - call: "POST /make-ready/scope-items"
              payload: { turn_id: "${t2}", category: "PAINT", description: "paint 102", estimated_cost_cents: 2000 }
              as: TurnCoordinator
              captures: { it2: $.data.id }
            - call: "POST /make-ready/turns/${t2}/finalize-scope"
              payload: {}
              as: TurnCoordinator
          trigger:
            - call: "POST /make-ready/vendor-assignments"
              payload: { scope_item_id: "${it2}", vendor_id: "${v_p}", start_date: "2026-08-06", end_date: "2026-08-09" }
              as: TurnCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger fails with error_id == ERR_VENDOR_OVERLAP (http 422) — temporal priority 8 beats constraint priority 9"
            - "ScopeItem.${it2}.status remains PLANNED (no assignment persisted)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: scope_creep_variance_exact_threshold_boundary
        grounds:
          - calculations.scope_creep_tier
          - entities.ScopeItem.fields.approval_tier
        distinguishing_aspect: |
          Percentage metric on POST /make-ready/scope-items: at approved budget
          100000 and pm_threshold 1000bp, an estimate of exactly 10000 yields
          variance == 1000bp → <= → auto PLANNED (tier NONE), while 10010 yields
          1001bp → PENDING_APPROVAL tier PM.
        test_recipe:
          setup:
            - "Two turns TA and TB on different units of the same property, each SCOPED with approved_budget 100000"
          setup_api_calls:
            - call: "POST /make-ready/properties"
              payload: { name: "Sunset Arms", days_to_ready_target: 5, pm_threshold_bp: 1000, rm_threshold_bp: 3000, capital_threshold_cents: 50000, replacement_policy: "PERCENT_OF_REPLACE" }
              as: RegionalManager
