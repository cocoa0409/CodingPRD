scaffold_corner_design:

  # ---------------------------------------------------------------
  - section: entities
    instances:
      - name: unit_creation_initializes_lawful_rent
        claim_type: Creation
        grounds: [entities.Unit.fields.current_lawful_rent_cents, entities.Unit.fields.base_rent_cents]
        distinguishing_aspect: "POST /rent-board/units returns 201 with current_lawful_rent_cents == base_rent_cents, stabilization_status STABILIZED, banked_pct 0."
        test_recipe:
          setup: ["A landlord exists."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Init Co", email: "init@x.com", business_license_no: "BL-2000" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "1 Init St #1", bedrooms: 2, base_rent_cents: 285000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
          assert:
            - "Unit.${u_id}.current_lawful_rent_cents == 285000"
            - "Unit.${u_id}.stabilization_status == STABILIZED"
            - "Unit.${u_id}.banked_pct == 0.0"

      - name: unit_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_UNIT_NOT_FOUND]"]
        distinguishing_aspect: "GET /rent-board/units/{bad-uuid} returns 404 ERR_UNIT_NOT_FOUND."
        test_recipe:
          setup: ["No unit with the queried id exists."]
          setup_api_calls: []
          trigger:
            - call: "GET /rent-board/units/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: RentBoardClerk
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNIT_NOT_FOUND"

      - name: unit_create_missing_base_rent_returns_validation
        claim_type: Required Fields
        grounds: [entities.Unit.fields.base_rent_cents, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /rent-board/units omitting base_rent_cents returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["A landlord exists."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Miss Co", email: "miss@x.com", business_license_no: "BL-2100" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "2 Miss St", bedrooms: 1 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: units_list_by_landlord_paginated
        claim_type: Listing
        grounds: [endpoints, entities.Unit.fields.landlord_id]
        distinguishing_aspect: "GET /rent-board/units?landlord_id filters to the landlord's units and returns pagination fields total_count and has_more."
        test_recipe:
          setup: ["A landlord with two units exists."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "List Co", email: "list@x.com", business_license_no: "BL-2200" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "3 List St #1", bedrooms: 1, base_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "3 List St #2", bedrooms: 2, base_rent_cents: 250000 }
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "GET /rent-board/units?landlord_id=${l_id}"
              payload: {}
              as: RentBoardClerk
          assert:
            - "response data is an array of 2 units; meta/response contains total_count == 2 and has_more == false"

  # ---------------------------------------------------------------
  - section: state_machines
    instances:
      - name: petition_submit_from_submitted_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.Petition.DRAFT_to_SUBMITTED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED petition returns ERR_INVALID_STATE; revision_count unchanged."
        test_recipe:
          setup: ["A CAPITAL petition has been submitted (status SUBMITTED)."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "SM Co", email: "sm@x.com", business_license_no: "BL-2300" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "4 SM St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 600000, amortization_months: 60 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
          trigger:
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: exemption_deny_keeps_unit_stabilized
        claim_type: Valid Transition
        grounds: [state_machines.Exemption.REQUESTED_to_DENIED, entities.Unit.fields.stabilization_status]
        distinguishing_aspect: "Denying an exemption sets status DENIED and leaves Unit.stabilization_status == STABILIZED."
        test_recipe:
          setup: ["A REQUESTED SUBSTANTIAL_REHAB exemption exists on a STABILIZED unit."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Deny Co", email: "deny@x.com", business_license_no: "BL-2400" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "5 Deny St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/exemptions"
              payload: { unit_id: "${u_id}", exemption_type: "SUBSTANTIAL_REHAB" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ex_id: $.data.id }
          trigger:
            - call: "POST /rent-board/exemptions/${ex_id}/decide"
              payload: { decision: "DENY" }
              as: ComplianceOfficer
              as_user_id: "co-deny"
          assert:
            - "Exemption.${ex_id}.status == DENIED"
            - "Unit.${u_id}.stabilization_status == STABILIZED"

      - name: penalty_confirm_from_confirmed_invalid_state
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Penalty.ASSESSED_to_CONFIRMED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Confirming an already-CONFIRMED penalty (terminal) returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["An OVERCHARGE penalty is CONFIRMED by a second officer (four-eyes satisfied)."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Term Co", email: "term@x.com", business_license_no: "BL-2500" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "6 Term St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/penalties"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", penalty_type: "LATE_REGISTRATION" }
              as: ComplianceOfficer
              as_user_id: "co-a"
              captures: { pen_id: $.data.id }
            - call: "POST /rent-board/penalties/${pen_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-b"
          trigger:
            - call: "POST /rent-board/penalties/${pen_id}/confirm"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-c"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

  # ---------------------------------------------------------------
  - section: calculations
    instances:
      - name: hardship_passthrough_capped
        claim_type: Correct Result
        grounds: [calculations.petition_passthrough, entities.Petition.fields.requested_pct]
        distinguishing_aspect: "HARDSHIP: min(round(300000×0.20)=60000, round(300000×0.08)=24000)=24000; unit lawful 300000 -> 324000 on GRANT."
        test_recipe:
          setup: ["A HARDSHIP petition (requested_pct 0.20) on a unit with lawful 300000 is UNDER_REVIEW with a scheduled hearing."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Hard Co", email: "hard@x.com", business_license_no: "BL-2600" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Poe", email: "poe@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "7 Hard St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "HARDSHIP", requested_pct: 0.20 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/petitions/${pet_id}/review"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
            - call: "POST /rent-board/petitions/${pet_id}/hearings"
              payload: { officer_id: "${o_id}", scheduled_start: "2026-06-12T09:00:00Z", scheduled_end: "2026-06-12T10:00:00Z" }
              as: RentBoardClerk
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /rent-board/hearings/${h_id}/decide"
              payload: { decision: "GRANT" }
              as: HearingOfficer
              as_user_id: "${o_id}"
          assert:
            - "Petition.${pet_id}.granted_amount_cents == 24000"
            - "Unit.${u_id}.current_lawful_rent_cents == 324000"

      - name: partial_decision_applies_supplied_amount
        claim_type: Variant Selection
        grounds: [state_machines.Petition.HEARING_SCHEDULED_to_PARTIAL, entities.Petition.fields.granted_amount_cents]
        distinguishing_aspect: "PARTIAL with granted_amount_cents 10000 (< full 18000) sets Petition PARTIAL and raises unit lawful 300000 -> 310000."
        test_recipe:
          setup: ["A CAPITAL petition (cost 4,800,000/120mo, full passthrough 18000) is scheduled for hearing."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Part Co", email: "part@x.com", business_license_no: "BL-2700" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Roe", email: "roe@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "8 Part St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 4800000, amortization_months: 120 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/petitions/${pet_id}/review"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
            - call: "POST /rent-board/petitions/${pet_id}/hearings"
              payload: { officer_id: "${o_id}", scheduled_start: "2026-06-13T09:00:00Z", scheduled_end: "2026-06-13T10:00:00Z" }
              as: RentBoardClerk
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /rent-board/hearings/${h_id}/decide"
              payload: { decision: "PARTIAL", granted_amount_cents: 10000 }
              as: HearingOfficer
              as_user_id: "${o_id}"
          assert:
            - "Petition.${pet_id}.status == PARTIAL"
            - "Petition.${pet_id}.granted_amount_cents == 10000"
            - "Unit.${u_id}.current_lawful_rent_cents == 310000"

      - name: partial_decision_amount_at_or_above_full_rejected
        claim_type: Correct Result
        grounds: ["validations[priority=21]", "errors[ERR_INVALID_GRANT_AMOUNT]"]
        distinguishing_aspect: "PARTIAL with granted_amount_cents 18000 (== full passthrough) returns ERR_INVALID_GRANT_AMOUNT (must be strictly less)."
        test_recipe:
          setup: ["A CAPITAL petition (full passthrough 18000) is scheduled for hearing."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Bad Co", email: "bad@x.com", business_license_no: "BL-2750" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/hearing-officers"
              payload: { name: "Officer Yoo", email: "yoo@board.gov" }
              as: RentBoardClerk
              captures: { o_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "9 Bad St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/petitions"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", petition_type: "CAPITAL_IMPROVEMENT", requested_cost_cents: 4800000, amortization_months: 120 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /rent-board/petitions/${pet_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/petitions/${pet_id}/review"
              payload: {}
              as: HearingOfficer
              as_user_id: "${o_id}"
            - call: "POST /rent-board/petitions/${pet_id}/hearings"
              payload: { officer_id: "${o_id}", scheduled_start: "2026-06-14T09:00:00Z", scheduled_end: "2026-06-14T10:00:00Z" }
              as: RentBoardClerk
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /rent-board/hearings/${h_id}/decide"
              payload: { decision: "PARTIAL", granted_amount_cents: 18000 }
              as: HearingOfficer
              as_user_id: "${o_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_GRANT_AMOUNT"

      - name: late_registration_flat_penalty
        claim_type: Constants Applied
        grounds: [calculations.overcharge_penalty, entities.Penalty.fields.penalty_type]
        distinguishing_aspect: "LATE_REGISTRATION penalty assesses the flat LATE_REG_PENALTY_CENTS == 50000 regardless of overcharge inputs."
        test_recipe:
          setup: ["A landlord and unit exist."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Late Co", email: "late@x.com", business_license_no: "BL-2800" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "10 Late St", bedrooms: 1, base_rent_cents: 200000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /rent-board/penalties"
              payload: { unit_id: "${u_id}", landlord_id: "${l_id}", penalty_type: "LATE_REGISTRATION" }
              as: ComplianceOfficer
              as_user_id: "co-late"
              captures: { pen_id: $.data.id }
          assert:
            - "Penalty.${pen_id}.assessed_amount_cents == 50000"

      - name: rent_adjustment_no_aga_for_year
        claim_type: Correct Result
        grounds: [calculations.allowable_increase, "errors[ERR_NO_AGA_DETERMINATION]"]
        distinguishing_aspect: "A rent-adjustment whose effective_date year has no AGADetermination returns ERR_NO_AGA_DETERMINATION."
        test_recipe:
          setup: ["A STABILIZED unit exists; no AGADetermination for year 2030."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "NoAga Co", email: "noaga@x.com", business_license_no: "BL-2900" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "11 NoAga St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id, u_v1: $.data.version }
          trigger:
            - call: "POST /rent-board/units/${u_id}/rent-adjustments"
              payload: { effective_date: "2030-06-01", proposed_new_rent_cents: 309000, apply_banked: false, expected_unit_version: "${u_v1}" }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_AGA_DETERMINATION"

  # ---------------------------------------------------------------
  - section: validations
    instances:
      - name: vacancy_decontrol_threshold_exact_boundary
        claim_type: Satisfaction → Pass
        grounds: ["validations[priority=18]", calculations.policy_thresholds, state_machines.Unit.STABILIZED_to_DECONTROLLED]
        distinguishing_aspect: "Vacant unit with vacancy_rent_cents == 500000 (== DECONTROL_RENT_THRESHOLD_CENTS) is approved and Unit -> DECONTROLLED (>= boundary)."
        test_recipe:
          setup: ["A vacant STABILIZED unit with a REQUESTED VACANCY_DECONTROL exemption (vacancy_rent 500000)."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Dec Co", email: "dec@x.com", business_license_no: "BL-3000" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "12 Dec St", bedrooms: 3, base_rent_cents: 480000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/exemptions"
              payload: { unit_id: "${u_id}", exemption_type: "VACANCY_DECONTROL", vacancy_rent_cents: 500000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ex_id: $.data.id }
          trigger:
            - call: "POST /rent-board/exemptions/${ex_id}/decide"
              payload: { decision: "APPROVE", effective_date: "2026-06-01" }
              as: ComplianceOfficer
              as_user_id: "co-dec"
          assert:
            - "Exemption.${ex_id}.status == APPROVED"
            - "Unit.${u_id}.stabilization_status == DECONTROLLED"

      - name: vacancy_decontrol_below_threshold_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=18]", "errors[ERR_DECONTROL_THRESHOLD_NOT_MET]"]
        distinguishing_aspect: "Vacant unit with vacancy_rent_cents 499999 (< 500000) is rejected with ERR_DECONTROL_THRESHOLD_NOT_MET."
        test_recipe:
          setup: ["A vacant STABILIZED unit with a REQUESTED VACANCY_DECONTROL exemption (vacancy_rent 499999)."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Dec2 Co", email: "dec2@x.com", business_license_no: "BL-3100" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "13 Dec St", bedrooms: 3, base_rent_cents: 480000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/exemptions"
              payload: { unit_id: "${u_id}", exemption_type: "VACANCY_DECONTROL", vacancy_rent_cents: 499999 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ex_id: $.data.id }
          trigger:
            - call: "POST /rent-board/exemptions/${ex_id}/decide"
              payload: { decision: "APPROVE", effective_date: "2026-06-01" }
              as: ComplianceOfficer
              as_user_id: "co-dec2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DECONTROL_THRESHOLD_NOT_MET"

      - name: vacancy_decontrol_occupied_unit_rejected
        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", "errors[ERR_UNIT_NOT_VACANT]"]
        distinguishing_aspect: "VACANCY_DECONTROL approval on a unit with an ACTIVE tenancy returns ERR_UNIT_NOT_VACANT (state pri 9 before fiscal threshold pri 18)."
        test_recipe:
          setup: ["A unit with an ACTIVE tenancy has a REQUESTED VACANCY_DECONTROL exemption (vacancy_rent 600000)."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Occ Co", email: "occ@x.com", business_license_no: "BL-3200" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Kai Fox", email: "kai@x.com", phone: "555-1200" }
              as: RentBoardClerk
              captures: { t_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "14 Occ St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
            - call: "POST /rent-board/tenancies"
              payload: { unit_id: "${u_id}", tenant_id: "${t_id}", start_date: "2026-04-01" }
              as: Landlord
              as_user_id: "${l_id}"
            - call: "POST /rent-board/exemptions"
              payload: { unit_id: "${u_id}", exemption_type: "VACANCY_DECONTROL", vacancy_rent_cents: 600000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { ex_id: $.data.id }
          trigger:
            - call: "POST /rent-board/exemptions/${ex_id}/decide"
              payload: { decision: "APPROVE", effective_date: "2026-06-01" }
              as: ComplianceOfficer
              as_user_id: "co-occ"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNIT_NOT_VACANT"

      - name: service_claim_tenant_not_linked
        claim_type: Cross-entity validation
        grounds: ["validations[priority=14]", "errors[ERR_TENANT_NOT_LINKED]"]
        distinguishing_aspect: "A service claim filed by a tenant who is not the unit's ACTIVE tenant returns ERR_TENANT_NOT_LINKED."
        test_recipe:
          setup: ["A unit with no tenancy for tenant t2 exists; t2 files a service claim."]
          setup_api_calls:
            - call: "POST /rent-board/landlords"
              payload: { name: "Link Co", email: "link@x.com", business_license_no: "BL-3300" }
              as: RentBoardClerk
              captures: { l_id: $.data.id }
            - call: "POST /rent-board/tenants"
              payload: { name: "Nia Bell", email: "nia@x.com", phone: "555-1300" }
              as: RentBoardClerk
              captures: { t2_id: $.data.id }
            - call: "POST /rent-board/units"
              payload: { landlord_id: "${l_id}", address: "15 Link St", bedrooms: 2, base_rent_cents: 300000 }
              as: Landlord
              as_user_id: "${l_id}"
              captures: { u_id: $.data.id }
          trigger:
            - call: "POST /rent-board/service-claims"
              payload: { unit_id: "${u_id}", tenant_id: "${t2_id}", claim_type: "PEST", severity: "MINOR" }
