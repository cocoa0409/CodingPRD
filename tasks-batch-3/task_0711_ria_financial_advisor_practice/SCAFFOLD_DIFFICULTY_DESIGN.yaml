  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: account_freeze_rejects_rebalance_then_clears_flag_depth3
        grounds:
          - state_machines.Account.ACTIVE_to_FROZEN
          - state_machines.RebalanceOrder.PROPOSED_to_REJECTED
          - entities.RebalanceOrder.fields.status
          - entities.Account.fields.rebalance_flagged
          - calculations.householding_breakpoint_tier
        distinguishing_aspect: |
          Depth-3 chain from one trigger: POST /accounts/{id}/state action=FREEZE (link1: Account ACTIVE->FROZEN)
          CAUSES the account's PROPOSED RebalanceOrder to flip PROPOSED->REJECTED (link2, caused by link1),
          and the FREEZE also recomputes Household.aggregated_aum_cents which re-derives breakpoint_tier_index
          (link3, caused by the same FROZEN state-driven recompute). Each link is caused by the prior one,
          not directly by the operator. Origin trigger = Account FREEZE.
        test_recipe:
          setup:
            - "An ACTIVE billable account (value 200,000,000c) whose client has an APPROVED IPS targeting a published portfolio, with one PROPOSED rebalance order on it; household tier index initially 1."
          setup_api_calls:
            - call: "POST /portfolios"
              payload: { name: "Bal", model_equity_pct: 60, target_weights: [ {sleeve: "EQ", target_pct: 60}, {sleeve: "FI", target_pct: 40} ] }
              as: Advisor
              captures: { pf_id: $.data.id }
            - call: "POST /portfolios/${pf_id}/publish"
              payload: {}
              as: Advisor
            - call: "POST /fee-schedules"
              payload: { name: "Std", tiers: [ {upper_bound_cents: 100000000, annual_rate_bps: 100}, {upper_bound_cents: null, annual_rate_bps: 75} ], minimum_annual_fee_cents: 0 }
              as: BillingAdmin
              captures: { sched_id: $.data.id }
            - call: "POST /households"
              payload: { name: "HH", lead_advisor_id: "adv-1", fee_schedule_id: "${sched_id}" }
              as: Advisor
              captures: { hh_id: $.data.id }
            - call: "POST /clients"
              payload: { household_id: "${hh_id}", full_name: "C", date_of_birth: "1980-01-01", risk_capacity_score: 60, risk_tolerance_score: 60 }
              as: Advisor
              captures: { c_id: $.data.id }
            - call: "POST /clients/${c_id}/state"
              payload: { action: "VERIFY_KYC" }
              as: Advisor
            - call: "POST /investment-policy-statements"
