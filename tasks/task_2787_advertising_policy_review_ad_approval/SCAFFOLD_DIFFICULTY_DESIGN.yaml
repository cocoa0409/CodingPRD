              as_user_id: "${adv_id}"
              captures: { cr2_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr2_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${alc_id}", confidence: 0.80, matched_snippet: "take home a bottle" }], expected_ad_creative_version: "${cr2_v}" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${cr3_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr3_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr3_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${alc_id}", confidence: 0.80, matched_snippet: "two reserve bottles" }], expected_ad_creative_version: "${cr3_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr3_id}" }
              as: PolicyAdmin
              captures: { task3_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task3_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr1_id}" }
              as: PolicyAdmin
              captures: { task1_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task1_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "POST /ad-policy/review-tasks/${task1_id}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["MANUAL_REVIEW", "DESTINATION_MISMATCH"], note: "Landing host does not match the display URL." }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${cr2_id}" }
              as: PolicyAdmin
              captures: { task2_id: "$.data[0].id" }
            - call: "POST /ad-policy/review-tasks/${task2_id}/claim"
              payload: {}
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/review-tasks/${task2_id}/decision"
              payload: { resolution: "DISAPPROVE", reason_codes: ["MANUAL_REVIEW"], note: "Repeat violation on the same account." }
              as: PolicyReviewer
              as_user_id: "${rev_id}"
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/enforcement-actions"
              payload: { advertiser_id: "${adv_id}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/ad-creatives/${cr3_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/review-tasks/${task3_id}"
