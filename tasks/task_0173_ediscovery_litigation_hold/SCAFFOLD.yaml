scenario: |
  eDiscovery & Litigation Hold: matter/custodian, legal-hold notice/acknowledgement,
  collection scope, processing/dedup, review batch/privilege tagging, Bates production
  set, clawback, retention release on close

domain_name: ediscovery-litigation-hold
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - optimistic_concurrency

  entity_topology: flat
  # Flat with FK references: Matter is the organizing aggregate but children are
  # peer resources linked by matter_id / scope_id / batch_id / set_id FKs, not
  # nested in URL paths. Discovery of children is via filtered-list GETs.

  state_machine_shape: parallel
  # Matter carries two independent state axes (lifecycle_status × hold_status);
  # ReviewBatch is cyclic (QC bounce-back); ProductionSet is branching (validate
  # fork: BLOCKED vs STAGED). Mixed non-linear shapes across entities.

  relationship_patterns:
    - one_to_many        # Matter -> Custodian/LegalHold/CollectionScope/ReviewBatch/ProductionSet
    - many_to_many       # ReviewBatch <-> Document via DocumentReview; ProductionSet <-> Document via ProductionItem
    - cross_aggregate    # ProductionSet references ReviewBatch; CollectionScope references Custodian

  role_model: segregation_of_duties
  # A reviewer who privilege-tags a document may not be the producer who releases
  # the Bates set containing it; legal-ops issues holds; custodians only acknowledge.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Matter
    parent: null
    common_fields: true
    fields:
      - name: caption
        type: string
        source: input
        description: "Case caption / matter name"
        constraints: "non-empty, length 1..200"
      - name: bates_prefix
        type: string
        source: input
        description: "Bates number prefix used for all production sets on this matter (e.g. ABC)"
        constraints: "uppercase letters only, length 1..8, immutable after create"
      - name: lifecycle_status
        type: enum
        source: system
        description: "Matter lifecycle axis"
        default: OPEN
        constraints: "OPEN | IN_DISCOVERY | CLOSING | CLOSED"
      - name: hold_status
        type: enum
        source: system
        description: "Litigation-hold axis, independent of lifecycle_status"
        default: NO_HOLD
        constraints: "NO_HOLD | HOLD_ACTIVE | HOLD_RELEASED"
      - name: custodian_count
        type: integer
        source: computed
        description: "Count of Custodian rows with matter_id == this.id"
        default: 0
      - name: acknowledged_count
        type: integer
        source: computed
        description: "Count of Custodians whose ack_state == ACKNOWLEDGED for this matter's active LegalHold"
        default: 0
      - name: ack_rate
        type: number
        source: computed
        description: "acknowledged_count / custodian_count, 2dp round_half_up; 0.00 when custodian_count==0"
        default: 0
      - name: responsive_doc_count
        type: integer
        source: computed
        description: "Count of unique (post-dedup) Documents on this matter tagged RESPONSIVE in a COMPLETED ReviewBatch"
        default: 0
      - name: next_bates_seq
        type: integer
        source: computed
        description: "Running Bates allocation counter; next production set starts here"
        default: 1
      - name: produced_document_count
        type: integer
        source: computed
        description: "Count of ProductionItems across this matter's PRODUCED sets that are not CLAWED_BACK"
        default: 0
      - name: clawed_back_document_count
        type: integer
        source: computed
        description: "Count of ProductionItems across this matter's sets that are CLAWED_BACK"
        default: 0
      - name: spoliation_risk_score
        type: integer
        source: computed
        description: "Final-variant spoliation risk for this matter (see calc spoliation_risk_score)"
        default: 0

  - name: Custodian
    parent: null
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: full_name
        type: string
        source: input
        description: "Custodian display name"
        constraints: "non-empty"
      - name: email
        type: string
        source: input
        description: "Custodian email; unique per matter (case-insensitive)"
        constraints: "unique within matter_id"
      - name: ack_state
        type: enum
        source: system
        description: "Current acknowledgement state of this custodian against the matter's active hold"
        default: NONE
        constraints: "NONE | PENDING | ACKNOWLEDGED"
      - name: retention_released
        type: boolean
        source: system
        description: "True once the matter's hold is released and this custodian's data may be purged"
        default: false

  - name: LegalHold
    parent: null
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: title
        type: string
        source: input
        description: "Hold notice title"
        constraints: "non-empty"
      - name: instructions
        type: string
        source: input
        description: "Preservation instructions text"
      - name: status
        type: enum
        source: system
        description: "Hold lifecycle"
        default: DRAFT
        constraints: "DRAFT | ISSUED | ACKNOWLEDGED | RELEASED"
      - name: issued_at
        type: datetime
        source: system
        description: "ISO8601 UTC timestamp when hold transitioned DRAFT->ISSUED; null while DRAFT"
        default: null
      - name: ack_deadline
        type: datetime
        source: input
        description: "ISO8601 UTC deadline by which custodians must acknowledge"
      - name: pending_ack_count
        type: integer
        source: computed
        description: "Count of HoldAcknowledgements on this hold with status PENDING"
        default: 0

  - name: HoldAcknowledgement
    parent: null
    common_fields: true
    fields:
      - name: hold_id
        type: string
        source: input
        description: "FK -> LegalHold.id"
      - name: custodian_id
        type: string
        source: input
        description: "FK -> Custodian.id"
      - name: status
        type: enum
        source: system
        description: "Acknowledgement record state"
        default: PENDING
        constraints: "PENDING | ACKNOWLEDGED"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "ISO8601 UTC timestamp the custodian acknowledged; null while PENDING"
        default: null
      - name: on_time
        type: boolean
        source: computed
        description: "True iff acknowledged_at <= LegalHold.ack_deadline (inclusive boundary)"
        default: false

  - name: CollectionScope
    parent: null
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: custodian_id
        type: string
        source: input
        description: "FK -> Custodian.id; the custodian whose data this scope collects"
      - name: source_label
        type: string
        source: input
        description: "Data source description (e.g. Exchange Mailbox)"
        constraints: "non-empty"
      - name: range_start
        type: datetime
        source: input
        description: "ISO8601 UTC inclusive start of collection date range"
      - name: range_end
        type: datetime
        source: input
        description: "ISO8601 UTC exclusive end of collection date range (half-open [start,end))"
      - name: expected_doc_count
        type: integer
        source: input
        description: "Custodian-projected document volume for forward-looking estimate"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Scope lifecycle"
        default: DEFINED
        constraints: "DEFINED | COLLECTING | COLLECTED | PROCESSED | RELEASED"
      - name: collected_actual_count
        type: integer
        source: computed
        description: "Count of Documents under this scope with status COLLECTED or later"
        default: 0

  - name: Document
    parent: null
    common_fields: true
    fields:
      - name: scope_id
        type: string
        source: input
        description: "FK -> CollectionScope.id"
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id; denormalized from scope for matter-level rollups"
      - name: content_hash
        type: string
        source: input
        description: "Content hash used for exact-duplicate detection within a matter"
        constraints: "non-empty hex string"
      - name: page_count
        type: integer
        source: input
        description: "Number of pages in this document"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Document lifecycle"
        default: COLLECTED
        constraints: "COLLECTED | DUPLICATE | UNIQUE | PURGEABLE"
      - name: privilege_tag
        type: enum
        source: system
        description: "Privilege determination set during review"
        default: UNREVIEWED
        constraints: "UNREVIEWED | NOT_PRIVILEGED | PRIVILEGED | REDACTED"
      - name: responsiveness_tag
        type: enum
        source: system
        description: "Responsiveness determination set during review"
        default: UNREVIEWED
        constraints: "UNREVIEWED | RESPONSIVE | NON_RESPONSIVE"
      - name: duplicate_of_id
        type: string
        source: system
        description: "FK -> Document.id; the first-seen UNIQUE doc this row duplicates (null unless status==DUPLICATE)"
        default: null

  - name: ProcessingJob
    parent: null
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: scope_id
        type: string
        source: input
        description: "FK -> CollectionScope.id; the scope whose COLLECTED documents this job processes"
      - name: status
        type: enum
        source: system
        description: "Job lifecycle"
        default: QUEUED
        constraints: "QUEUED | RUNNING | COMPLETED | FAILED"
      - name: total_input_count
        type: integer
        source: computed
        description: "Count of Documents under scope_id with status COLLECTED at run time"
        default: 0
      - name: unique_count
        type: integer
        source: computed
        description: "Documents promoted to UNIQUE by this job (dedup output)"
        default: 0
      - name: duplicate_count
        type: integer
        source: computed
        description: "Documents marked DUPLICATE by this job"
        default: 0

  - name: ReviewBatch
    parent: null
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: name
        type: string
        source: input
        description: "Review batch label"
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: "Batch review lifecycle (cyclic via QC bounce-back)"
        default: DRAFT
        constraints: "DRAFT | IN_REVIEW | QC_REVIEW | COMPLETED"
      - name: document_count
        type: integer
        source: computed
        description: "Count of DocumentReview rows on this batch"
        default: 0
      - name: reviewed_count
        type: integer
        source: computed
        description: "Count of DocumentReview rows on this batch with decision != UNDECIDED"
        default: 0

  - name: DocumentReview
    parent: null
    common_fields: true
    fields:
      - name: batch_id
        type: string
        source: input
        description: "FK -> ReviewBatch.id"
      - name: document_id
        type: string
        source: input
        description: "FK -> Document.id; must be a UNIQUE document"
      - name: reviewer_user_id
        type: string
        source: system
        description: "X-User-ID of the Reviewer who last set the decision (opaque operator id)"
        default: null
      - name: decision
        type: enum
        source: system
        description: "Reviewer determination for this document in this batch"
        default: UNDECIDED
        constraints: "UNDECIDED | RESPONSIVE_NOT_PRIV | RESPONSIVE_PRIV | RESPONSIVE_REDACTED | NON_RESPONSIVE"

  - name: ProductionSet
    parent: null
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: source_batch_id
        type: string
        source: input
        description: "FK -> ReviewBatch.id; the COMPLETED batch the production draws from"
      - name: status
        type: enum
        source: system
        description: "Production lifecycle (branching: VALIDATING forks to BLOCKED or STAGED)"
        default: DRAFT
        constraints: "DRAFT | VALIDATING | BLOCKED | STAGED | PRODUCED"
      - name: bates_start
        type: integer
        source: computed
        description: "First Bates sequence number allocated to this set; null until STAGED"
        default: null
      - name: bates_end
        type: integer
        source: computed
        description: "Last Bates sequence number allocated to this set; null until STAGED"
        default: null
      - name: item_count
        type: integer
        source: computed
        description: "Count of ProductionItem rows on this set"
        default: 0
      - name: produced_page_count
        type: integer
        source: computed
        description: "Per-document-rounded production cost in cents (see calc production_cost_cents); null until STAGED"
        default: null

  - name: ProductionItem
    parent: null
    common_fields: false
    fields:
      - name: set_id
        type: string
        source: input
        description: "FK -> ProductionSet.id"
      - name: document_id
        type: string
        source: input
        description: "FK -> Document.id"
      - name: bates_number
        type: string
        source: computed
        description: "Assigned Bates label (prefix + zero-padded seq), e.g. ABC000001; null until set STAGED"
        default: null
      - name: status
        type: enum
        source: system
        description: "Production item state"
        default: STAGED
        constraints: "STAGED | PRODUCED | CLAWED_BACK"

  - name: Clawback
    parent: null
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id"
      - name: production_item_id
        type: string
        source: input
        description: "FK -> ProductionItem.id; the produced item being clawed back"
      - name: reason
        type: string
        source: input
        description: "Clawback assertion reason"
        constraints: "non-empty"
      - name: status
        type: enum
        source: system
        description: "Clawback lifecycle"
        default: REQUESTED
        constraints: "REQUESTED | SEQUESTERED | DISPUTED"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Matter
    initial_state: "lifecycle_status=OPEN, hold_status=NO_HOLD"
    terminal_states: [CLOSED]
    note: "Parallel dimensions: lifecycle_status and hold_status evolve on independent triggers."
    transitions:
      # ---- lifecycle axis ----
      - from: OPEN
        to: IN_DISCOVERY
        trigger: "system: first ProcessingJob on this matter reaches COMPLETED"
        actor: system
        preconditions: ["matter.lifecycle_status == OPEN"]
        side_effects: ["set lifecycle_status=IN_DISCOVERY"]
      - from: IN_DISCOVERY
        to: CLOSING
        trigger: "POST /matters/{id}/begin-close"
        actor: LegalOps
        preconditions:
          - "matter.lifecycle_status == IN_DISCOVERY"
          - "no ProductionSet on this matter is in DRAFT or VALIDATING"
        side_effects: ["set lifecycle_status=CLOSING"]
      - from: CLOSING
        to: CLOSED
        trigger: "POST /matters/{id}/close"
        actor: LegalOps
        preconditions:
          - "matter.lifecycle_status == CLOSING"
          - "matter.hold_status == HOLD_RELEASED"
        side_effects:
          - "set lifecycle_status=CLOSED"
          - "increments Matter.version by 1"
      # ---- hold axis ----
      - from: NO_HOLD
        to: HOLD_ACTIVE
        trigger: "system: LegalHold on this matter transitions DRAFT->ISSUED"
        actor: system
        preconditions: ["matter.hold_status == NO_HOLD"]
        side_effects: ["set hold_status=HOLD_ACTIVE"]
      - from: HOLD_ACTIVE
        to: HOLD_RELEASED
        trigger: "POST /matters/{id}/release-hold"
        actor: LegalOps
        preconditions:
          - "matter.hold_status == HOLD_ACTIVE"
          - "matter.lifecycle_status == CLOSING"
        side_effects:
          - "set hold_status=HOLD_RELEASED"
          - "CASCADE: matter's active LegalHold ACKNOWLEDGED/ISSUED -> RELEASED (hop 1)"
          - "increments Matter.version by 1"

  - entity: LegalHold
    initial_state: DRAFT
    terminal_states: [RELEASED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /legal-holds/{id}/issue"
        actor: LegalOps
        preconditions:
          - "hold.status == DRAFT"
          - "Matter.custodian_count >= 1"
        side_effects:
          - "set issued_at = now"
          - "for each Custodian on matter: create HoldAcknowledgement(status=PENDING); set Custodian.ack_state=PENDING"
          - "BUBBLE: Matter.hold_status NO_HOLD -> HOLD_ACTIVE"
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "system: pending_ack_count drops to 0 (all custodians acknowledged)"
        actor: system
        preconditions: ["hold.status == ISSUED", "hold.pending_ack_count == 0"]
        side_effects: ["set status=ACKNOWLEDGED"]
      - from: ISSUED
        to: RELEASED
        trigger: "CASCADE from Matter release-hold (hop 1)"
        actor: system
        preconditions: ["matter.hold_status transitioning to HOLD_RELEASED"]
        side_effects:
          - "set status=RELEASED"
          - "CASCADE: every CollectionScope on matter in {COLLECTED,PROCESSED} -> RELEASED (hop 2)"
      - from: ACKNOWLEDGED
        to: RELEASED
        trigger: "CASCADE from Matter release-hold (hop 1)"
        actor: system
        preconditions: ["matter.hold_status transitioning to HOLD_RELEASED"]
        side_effects:
          - "set status=RELEASED"
          - "CASCADE: every CollectionScope on matter in {COLLECTED,PROCESSED} -> RELEASED (hop 2)"

  - entity: HoldAcknowledgement
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: "POST /hold-acknowledgements/{id}/acknowledge"
        actor: Custodian
        preconditions:
          - "ack.status == PENDING"
          - "parent LegalHold.status == ISSUED"
        side_effects:
          - "set acknowledged_at = now"
          - "set on_time = (acknowledged_at <= LegalHold.ack_deadline)  (inclusive)"
          - "set Custodian.ack_state = ACKNOWLEDGED; recompute Matter.acknowledged_count, Matter.ack_rate"
          - "decrement LegalHold.pending_ack_count; if it reaches 0, auto-transition LegalHold ISSUED->ACKNOWLEDGED"

  - entity: CollectionScope
    initial_state: DEFINED
    terminal_states: [RELEASED]
    transitions:
      - from: DEFINED
        to: COLLECTING
        trigger: "POST /collection-scopes/{id}/start"
        actor: LegalOps
        preconditions:
          - "scope.status == DEFINED"
          - "matter.hold_status == HOLD_ACTIVE"
          - "the scope's Custodian.ack_state == ACKNOWLEDGED"
        side_effects: ["set status=COLLECTING"]
      - from: COLLECTING
        to: COLLECTED
        trigger: "POST /collection-scopes/{id}/finish"
        actor: LegalOps
        preconditions: ["scope.status == COLLECTING"]
        side_effects: ["set status=COLLECTED"]
      - from: COLLECTED
        to: PROCESSED
        trigger: "system: ProcessingJob on this scope reaches COMPLETED"
        actor: system
        preconditions: ["scope.status == COLLECTED"]
        side_effects: ["set status=PROCESSED"]
      - from: COLLECTED
        to: RELEASED
        trigger: "CASCADE from LegalHold release (hop 2)"
        actor: system
        preconditions: ["matter hold releasing"]
        side_effects:
          - "set status=RELEASED"
          - "CASCADE: every Document under this scope not already PURGEABLE -> PURGEABLE; set Custodian.retention_released=true (hop 3)"
      - from: PROCESSED
        to: RELEASED
        trigger: "CASCADE from LegalHold release (hop 2)"
        actor: system
        preconditions: ["matter hold releasing"]
        side_effects:
          - "set status=RELEASED"
          - "CASCADE: every Document under this scope not already PURGEABLE -> PURGEABLE; set Custodian.retention_released=true (hop 3)"

  - entity: ProcessingJob
    initial_state: QUEUED
    terminal_states: [COMPLETED, FAILED]
    transitions:
      - from: QUEUED
        to: RUNNING
        trigger: "POST /processing-jobs/{id}/run"
        actor: LegalOps
        preconditions:
          - "job.status == QUEUED"
          - "referenced CollectionScope.status == COLLECTED"
        side_effects: ["set status=RUNNING", "snapshot total_input_count = count of COLLECTED Documents under scope"]
      - from: RUNNING
        to: COMPLETED
        trigger: "POST /processing-jobs/{id}/complete"
        actor: LegalOps
        preconditions: ["job.status == RUNNING"]
        side_effects:
          - "run dedup (calc dedup_partition): first-seen-by created_at content_hash -> UNIQUE, later -> DUPLICATE(duplicate_of_id)"
          - "set unique_count, duplicate_count"
          - "BUBBLE: CollectionScope COLLECTED->PROCESSED"
          - "BUBBLE: if this is first COMPLETED job on matter, Matter lifecycle OPEN->IN_DISCOVERY"
      - from: RUNNING
        to: FAILED
        trigger: "POST /processing-jobs/{id}/fail"
        actor: LegalOps
        preconditions: ["job.status == RUNNING"]
        side_effects: ["set status=FAILED"]

  - entity: ReviewBatch
    initial_state: DRAFT
    terminal_states: [COMPLETED]
    note: "Cyclic: QC_REVIEW can bounce back to IN_REVIEW (revision loop)."
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /review-batches/{id}/open-review"
        actor: ReviewLead
        preconditions: ["batch.status == DRAFT", "batch.document_count >= 1"]
        side_effects: ["set status=IN_REVIEW"]
      - from: IN_REVIEW
        to: QC_REVIEW
        trigger: "POST /review-batches/{id}/submit-qc"
        actor: ReviewLead
        preconditions:
          - "batch.status == IN_REVIEW"
          - "batch.reviewed_count == batch.document_count"
        side_effects: ["set status=QC_REVIEW"]
      - from: QC_REVIEW
        to: IN_REVIEW
        trigger: "POST /review-batches/{id}/reopen"
        actor: ReviewLead
        preconditions: ["batch.status == QC_REVIEW"]
        side_effects: ["set status=IN_REVIEW", "note: revision loop; reviewers may change decisions"]
      - from: QC_REVIEW
        to: COMPLETED
        trigger: "POST /review-batches/{id}/complete"
        actor: ReviewLead
        preconditions: ["batch.status == QC_REVIEW"]
        side_effects:
          - "freeze each Document's tags from its DocumentReview.decision per the mapping: RESPONSIVE_NOT_PRIV -> (responsiveness_tag=RESPONSIVE, privilege_tag=NOT_PRIVILEGED); RESPONSIVE_PRIV -> (RESPONSIVE, PRIVILEGED); RESPONSIVE_REDACTED -> (RESPONSIVE, REDACTED); NON_RESPONSIVE -> (NON_RESPONSIVE, NOT_PRIVILEGED)"
          - "recompute Matter.responsive_doc_count = count of this matter's UNIQUE Documents whose responsiveness_tag==RESPONSIVE across COMPLETED batches"

  - entity: ProductionSet
    initial_state: DRAFT
    terminal_states: [PRODUCED]
    note: "Branching: VALIDATING forks to BLOCKED (privileged doc present) or STAGED (clean)."
    transitions:
      - from: DRAFT
        to: VALIDATING
        trigger: "POST /production-sets/{id}/validate"
        actor: Producer
        preconditions:
          - "set.status == DRAFT"
          - "set.item_count >= 1"
          - "source ReviewBatch.status == COMPLETED"
        side_effects: ["set status=VALIDATING"]
      - from: VALIDATING
        to: BLOCKED
        trigger: "system: validation finds >=1 item whose Document.privilege_tag == PRIVILEGED"
        actor: system
        preconditions: ["set.status == VALIDATING", "exists ProductionItem whose Document.privilege_tag == PRIVILEGED"]
        side_effects: ["set status=BLOCKED"]
      - from: VALIDATING
        to: STAGED
        trigger: "system: validation finds no PRIVILEGED item"
        actor: system
        preconditions: ["set.status == VALIDATING", "no ProductionItem whose Document.privilege_tag == PRIVILEGED"]
        side_effects:
          - "allocate Bates: bates_start = Matter.next_bates_seq; assign sequential bates_number to each item ordered by Document.created_at ASC; bates_end = start + item_count - 1"
          - "advance Matter.next_bates_seq = bates_end + 1"
          - "compute produced_page_count via calc production_cost_cents"
      - from: BLOCKED
        to: DRAFT
        trigger: "POST /production-sets/{id}/revise"
        actor: Producer
        preconditions: ["set.status == BLOCKED"]
        side_effects: ["set status=DRAFT", "note: producer removes/redacts privileged items then re-validates"]
      - from: STAGED
        to: PRODUCED
        trigger: "POST /production-sets/{id}/produce"
        actor: Producer
        preconditions:
          - "set.status == STAGED"
          - "matter.lifecycle_status in {IN_DISCOVERY, CLOSING}"
        side_effects:
          - "set status=PRODUCED; set each ProductionItem.status STAGED->PRODUCED"
          - "recompute Matter.produced_document_count"
          - "increments ProductionSet.version by 1"

  - entity: Clawback
    initial_state: REQUESTED
    terminal_states: [SEQUESTERED, DISPUTED]
    transitions:
      - from: REQUESTED
        to: SEQUESTERED
        trigger: "POST /clawbacks/{id}/sequester"
        actor: Producer
        preconditions:
          - "clawback.status == REQUESTED"
          - "referenced ProductionItem.status == PRODUCED"
        side_effects:
          - "set ProductionItem.status PRODUCED->CLAWED_BACK"
          - "set the item's Document.privilege_tag=PRIVILEGED"
          - "recompute Matter.produced_document_count and Matter.clawed_back_document_count"
      - from: REQUESTED
        to: DISPUTED
        trigger: "POST /clawbacks/{id}/dispute"
        actor: LegalOps
        preconditions: ["clawback.status == REQUESTED"]
        side_effects: ["set status=DISPUTED; ProductionItem stays PRODUCED"]

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: clawback-create-stale-item
    parent_entity: ProductionSet
    write_endpoint: "POST /clawbacks"
    occ_field: "expected_production_set_version"
    description: |
      Filing a Clawback against a ProductionItem whose parent ProductionSet has
      advanced its version since the client last observed it is rejected. The
      produce transition and any later clawback both bump the set's version; a
      client that read the set before another clawback already retired the same
      item carries a stale view and is rejected on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: dedup_partition
    trigger: "ProcessingJob RUNNING->COMPLETED"
    algorithm: chronological
    formula: |
      # Operate over Documents under job.scope_id with status==COLLECTED.
      # Process in created_at ASC order (tie-break: created_at then NOT id).
      seen = {}                      # content_hash -> first-seen Document.id
      unique = 0; duplicate = 0
      for d in docs_sorted_by_created_at_asc:
          if d.content_hash in seen:
              d.status = DUPLICATE
              d.duplicate_of_id = seen[d.content_hash]
              duplicate += 1
          else:
              d.status = UNIQUE
              seen[d.content_hash] = d.id
              unique += 1
      job.unique_count = unique
      job.duplicate_count = duplicate
    input_set: "Documents with scope_id==job.scope_id AND status==COLLECTED"
    constants: {}
    precision: "integer counts"
    variants:
      - name: matter_wide_dedup
        when: "content_hash already first-seen by an earlier scope's COMPLETED job on the same matter"
        difference: "dedup key is matter-wide: a hash first seen in a prior scope makes the new doc DUPLICATE across scopes"

  - name: collection_volume
    trigger: "GET /matters/{id}/collection-summary (read); recomputed on scope finish"
    algorithm: forward_looking
    formula: |
      estimate_total = sum(scope.expected_doc_count for scope in matter.scopes
                           where scope.status in {DEFINED, COLLECTING})   # projection of not-yet-collected
      actual_total   = sum(scope.collected_actual_count for scope in matter.scopes
                           where scope.status in {COLLECTED, PROCESSED, RELEASED})  # chronological realized
    input_set: "CollectionScopes on the matter, partitioned by status"
    constants: {}
    precision: "integer counts"
    variants:
      - name: estimate
        when: "before collection completes"
        difference: "forward-looking: uses custodian-projected expected_doc_count over DEFINED/COLLECTING scopes"
      - name: actual
        when: "after collection completes"
        difference: "chronological realized: counts Documents actually collected under COLLECTED+ scopes"

  - name: spoliation_risk_score
    trigger: "GET /matters/{id}/risk; recomputed on hold issue and on each acknowledge"
    algorithm: weighted_scoring
    formula: |
      # base over 3 inputs with non-linear cap then tiered multiplier on responsive volume
      base = (U * 15) + (min(D, 30) * 2)
      #   U = unacknowledged custodian count (variant-dependent)
      #   D = days since LegalHold.issued_at (0 if no hold issued)
      if    R < 100:   mult = 1.0
      elif  R < 1000:  mult = 1.2
      else:            mult = 1.5     # R = Matter.responsive_doc_count
      score = min(100, round_half_up(base * mult))
    input_set: "Matter custodians/holds/responsive docs"
    constants:
      PER_UNACK_WEIGHT: 15
      PER_DAY_WEIGHT: 2
      DAYS_CAP: 30
      TIER_LOW: 100
      TIER_HIGH: 1000
      SCORE_CEILING: 100
    precision: "integer, round_half_up before ceiling"
    variants:
      - name: provisional
        when: "displayed live during the acknowledgement window"
        difference: "U counts every Custodian whose ack_state != ACKNOWLEDGED (PENDING custodians count as risk)"
      - name: final
        when: "Matter.spoliation_risk_score persisted value"
        difference: "U counts only Custodians with NO HoldAcknowledgement record at all (PENDING records are excused)"

  - name: production_cost_cents
    trigger: "ProductionSet VALIDATING->STAGED"
    algorithm: aggregation
    formula: |
      # PINNED ORDER: round per document, THEN sum. (NOT sum-then-round.)
      per_doc_cost(d) = round_half_up(d.page_count * PER_PAGE_RATE_CENTS)
      produced_page_count = sum(per_doc_cost(d) for each ProductionItem's Document d in this set)
    input_set: "Documents referenced by this set's ProductionItems"
    constants:
      PER_PAGE_RATE_CENTS: 7.3
    precision: "integer cents; round_half_up PER DOCUMENT before summing"
    variants:
      - name: per_document_then_sum
        when: "the pinned, authoritative order"
        difference: "rounds each document's page*rate to whole cents, then sums the rounded values"
      - name: sum_then_round
        when: "a tempting but WRONG alternative that diverges by rounding drift"
        difference: "sums raw page*rate then rounds once; produces a different total — MUST NOT be used"

  - name: bates_allocation
    trigger: "ProductionSet VALIDATING->STAGED"
    algorithm: waterfall_allocation
    formula: |
      start = Matter.next_bates_seq
      items = production items ordered by Document.created_at ASC (tie-break created_at, NOT id)
      seq = start
      for item in items:
          item.bates_number = Matter.bates_prefix + zero_pad(seq, 6)
          seq += 1
      set.bates_start = start
      set.bates_end   = seq - 1
      Matter.next_bates_seq = seq        # waterfall: next set continues where this ended
    input_set: "ProductionItems of the set being staged"
    constants:
      BATES_PAD_WIDTH: 6
    precision: "integer sequence; zero-padded to 6 digits in label"
    variants:
      - name: contiguous_per_matter
        when: "always"
        difference: "Bates sequence is matter-global and contiguous across sets; no gaps, no reuse"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to invoke this endpoint per §1.7"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Segregation of duties: the Producer staging/producing a set must not be the reviewer_user_id who last decided any of its documents"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /production-sets/{id}/produce"

  - priority: 4
    category: existence
    check: "All path and FK-referenced resources exist (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "ProductionSet's source ReviewBatch is COMPLETED before validate"
    error_id: ERR_BATCH_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /production-sets/{id}/validate"

  - priority: 7
    category: business_safety
    check: "Collection cannot start unless the scope's Custodian has ACKNOWLEDGED the hold"
    error_id: ERR_CUSTODIAN_NOT_ACKNOWLEDGED
    http_status: 409
    applies_to: "POST /collection-scopes/{id}/start"

  - priority: 8
    category: business_safety
    check: "A document tagged PRIVILEGED may not be added as a ProductionItem"
    error_id: ERR_PRIVILEGED_DOCUMENT
    http_status: 422
    applies_to: "POST /production-sets/{id}/items"

  - priority: 9
    category: business_constraint
    check: "DocumentReview document must be a UNIQUE (post-dedup) document of the same matter as the batch"
    error_id: ERR_DOCUMENT_NOT_UNIQUE
    http_status: 422
    applies_to: "POST /review-batches/{id}/reviews"

  - priority: 10
    category: business_temporal
    check: "Two CollectionScopes for the same custodian on the same matter may not have overlapping half-open [range_start, range_end) date ranges"
    error_id: ERR_SCOPE_DATE_OVERLAP
    http_status: 409
    applies_to: "POST /collection-scopes"

  - priority: 11
    category: business_constraint
    check: "Custodian email must be unique (case-insensitive) within its matter"
    error_id: ERR_DUPLICATE_CUSTODIAN_EMAIL
    http_status: 409
    applies_to: "POST /custodians"

  - priority: 12
    category: business_constraint
    check: "bates_prefix must be uppercase letters only, length 1..8"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /matters"

  - priority: 13
    category: business_temporal
    check: "CollectionScope range_start must be strictly before range_end (half-open non-empty interval)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /collection-scopes"

  - priority: 14
    category: business_constraint
    check: "Required request fields present with correct types/enums; numeric fields within declared bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints"

  - priority: 15
    category: state
    check: "OCC: expected_production_set_version matches current ProductionSet.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clawbacks"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Matter ----
  - method: POST
    path: "/matters"
    description: "Create a matter"
    roles: [LegalOps]
    code: 201
    input: [caption, bates_prefix]
    output: Matter
    side_effects: ["lifecycle_status=OPEN, hold_status=NO_HOLD, next_bates_seq=1"]
  - method: GET
    path: "/matters/{id}"
    description: "Fetch a matter"
    roles: [LegalOps, ReviewLead, Reviewer, Producer]
    code: 200
    input: []
    output: Matter
    side_effects: []
  - method: GET
    path: "/matters"
    description: "List matters"
    roles: [LegalOps, ReviewLead, Reviewer, Producer]
    code: 200
    input: ["limit?", "offset?"]
    output: Matter[]
    side_effects: []
  - method: GET
    path: "/matters/{id}/risk"
    description: "Computed read: provisional + final spoliation risk"
    roles: [LegalOps]
    code: 200
    input: []
    output: "{ provisional_risk: integer, final_risk: integer }"
    side_effects: []
  - method: GET
    path: "/matters/{id}/collection-summary"
    description: "Computed read: estimate vs actual collection volume"
    roles: [LegalOps]
    code: 200
    input: []
    output: "{ estimate_total: integer, actual_total: integer }"
    side_effects: []
  - method: POST
    path: "/matters/{id}/begin-close"
    description: "Advance matter lifecycle IN_DISCOVERY->CLOSING"
    roles: [LegalOps]
    code: 200
    input: []
    output: Matter
    side_effects: ["lifecycle_status=CLOSING"]
  - method: POST
    path: "/matters/{id}/release-hold"
    description: "Release litigation hold; cascades retention release"
    roles: [LegalOps]
    code: 200
    input: []
    output: Matter
    side_effects: ["hold_status=HOLD_RELEASED; cascade LegalHold->RELEASED->scopes->documents PURGEABLE; increments Matter.version"]
  - method: POST
    path: "/matters/{id}/close"
    description: "Advance matter lifecycle CLOSING->CLOSED"
    roles: [LegalOps]
    code: 200
    input: []
    output: Matter
    side_effects: ["lifecycle_status=CLOSED; increments Matter.version"]

  # ---- Custodian ----
  - method: POST
    path: "/custodians"
    description: "Register a custodian on a matter"
    roles: [LegalOps]
    code: 201
    input: [matter_id, full_name, email]
    output: Custodian
    side_effects: ["recompute Matter.custodian_count"]
  - method: GET
    path: "/custodians/{id}"
    description: "Fetch a custodian"
    roles: [LegalOps, ReviewLead, Producer]
    code: 200
    input: []
    output: Custodian
    side_effects: []
  - method: GET
    path: "/custodians"
    description: "List/filter custodians by matter"
    roles: [LegalOps, ReviewLead, Producer]
    code: 200
    input: ["matter_id?", "limit?", "offset?"]
    output: Custodian[]
    side_effects: []

  # ---- LegalHold ----
  - method: POST
    path: "/legal-holds"
    description: "Draft a legal-hold notice for a matter"
    roles: [LegalOps]
    code: 201
    input: [matter_id, title, instructions, ack_deadline]
    output: LegalHold
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/legal-holds/{id}"
    description: "Fetch a legal hold"
    roles: [LegalOps, ReviewLead]
    code: 200
    input: []
    output: LegalHold
    side_effects: []
  - method: GET
    path: "/legal-holds"
    description: "List/filter legal holds by matter"
    roles: [LegalOps, ReviewLead]
    code: 200
    input: ["matter_id?", "limit?", "offset?"]
    output: LegalHold[]
    side_effects: []
  - method: POST
    path: "/legal-holds/{id}/issue"
    description: "Issue the hold; fan out PENDING acknowledgements"
    roles: [LegalOps]
    code: 200
    input: []
    output: LegalHold
    side_effects: ["status=ISSUED; create HoldAcknowledgement per custodian; Matter hold_status->HOLD_ACTIVE"]

  # ---- HoldAcknowledgement ----
  - method: GET
    path: "/hold-acknowledgements/{id}"
    description: "Fetch an acknowledgement"
    roles: [LegalOps, Custodian]
    code: 200
    input: []
    output: HoldAcknowledgement
    side_effects: []
  - method: GET
    path: "/hold-acknowledgements"
    description: "List/filter acknowledgements by hold or custodian"
    roles: [LegalOps, Custodian]
    code: 200
    input: ["hold_id?", "custodian_id?", "limit?", "offset?"]
    output: HoldAcknowledgement[]
    side_effects: []
  - method: POST
    path: "/hold-acknowledgements/{id}/acknowledge"
    description: "Custodian acknowledges the hold notice"
    roles: [Custodian]
    code: 200
    input: []
    output: HoldAcknowledgement
    side_effects: ["status=ACKNOWLEDGED; on_time computed; Custodian.ack_state=ACKNOWLEDGED; maybe LegalHold->ACKNOWLEDGED; recompute Matter.ack_rate"]

  # ---- CollectionScope ----
  - method: POST
    path: "/collection-scopes"
    description: "Define a collection scope for a custodian"
    roles: [LegalOps]
    code: 201
    input: [matter_id, custodian_id, source_label, range_start, range_end, expected_doc_count]
    output: CollectionScope
    side_effects: ["status=DEFINED"]
  - method: GET
    path: "/collection-scopes/{id}"
    description: "Fetch a collection scope"
    roles: [LegalOps, Producer]
    code: 200
    input: []
    output: CollectionScope
    side_effects: []
  - method: GET
    path: "/collection-scopes"
    description: "List/filter collection scopes by matter or custodian"
    roles: [LegalOps, Producer]
    code: 200
    input: ["matter_id?", "custodian_id?", "limit?", "offset?"]
    output: CollectionScope[]
    side_effects: []
  - method: POST
    path: "/collection-scopes/{id}/start"
    description: "Begin collection (requires acknowledged custodian + active hold)"
    roles: [LegalOps]
    code: 200
    input: []
    output: CollectionScope
    side_effects: ["status=COLLECTING"]
  - method: POST
    path: "/collection-scopes/{id}/finish"
    description: "Finish collection"
    roles: [LegalOps]
    code: 200
    input: []
    output: CollectionScope
    side_effects: ["status=COLLECTED"]

  # ---- Document ----
  - method: POST
    path: "/documents"
    description: "Ingest a collected document into a COLLECTING scope"
    roles: [LegalOps]
    code: 201
    input: [scope_id, content_hash, page_count]
    output: Document
    side_effects: ["status=COLLECTED; matter_id denormalized from scope; recompute scope.collected_actual_count"]
  - method: GET
    path: "/documents/{id}"
    description: "Fetch a document"
    roles: [LegalOps, ReviewLead, Reviewer, Producer]
    code: 200
    input: []
    output: Document
    side_effects: []
  - method: GET
    path: "/documents"
    description: "List/filter documents by scope, matter, status, or original (duplicate_of_id)"
    roles: [LegalOps, ReviewLead, Reviewer, Producer]
    code: 200
    input: ["scope_id?", "matter_id?", "status?", "duplicate_of_id?", "limit?", "offset?"]
    output: Document[]
    side_effects: []

  # ---- ProcessingJob ----
  - method: POST
    path: "/processing-jobs"
    description: "Queue a processing/dedup job for a COLLECTED scope"
    roles: [LegalOps]
    code: 201
    input: [matter_id, scope_id]
    output: ProcessingJob
    side_effects: ["status=QUEUED"]
  - method: GET
    path: "/processing-jobs/{id}"
    description: "Fetch a processing job"
    roles: [LegalOps]
    code: 200
    input: []
    output: ProcessingJob
    side_effects: []
  - method: GET
    path: "/processing-jobs"
    description: "List/filter processing jobs by matter or scope"
    roles: [LegalOps]
    code: 200
    input: ["matter_id?", "scope_id?", "limit?", "offset?"]
    output: ProcessingJob[]
    side_effects: []
  - method: POST
    path: "/processing-jobs/{id}/run"
    description: "Start the job (snapshots input set)"
    roles: [LegalOps]
    code: 200
    input: []
    output: ProcessingJob
    side_effects: ["status=RUNNING"]
  - method: POST
    path: "/processing-jobs/{id}/complete"
    description: "Complete dedup; promotes UNIQUE/DUPLICATE; bubbles scope->PROCESSED and matter lifecycle"
    roles: [LegalOps]
    code: 200
    input: []
    output: ProcessingJob
    side_effects: ["dedup_partition; scope->PROCESSED; first job bubbles Matter OPEN->IN_DISCOVERY"]
  - method: POST
    path: "/processing-jobs/{id}/fail"
    description: "Mark the job FAILED"
    roles: [LegalOps]
    code: 200
    input: []
    output: ProcessingJob
    side_effects: ["status=FAILED"]

  # ---- ReviewBatch ----
  - method: POST
    path: "/review-batches"
    description: "Create a review batch"
    roles: [ReviewLead]
    code: 201
    input: [matter_id, name]
    output: ReviewBatch
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/review-batches/{id}"
    description: "Fetch a review batch"
    roles: [ReviewLead, Reviewer, Producer]
    code: 200
    input: []
    output: ReviewBatch
    side_effects: []
  - method: GET
    path: "/review-batches"
    description: "List/filter review batches by matter"
    roles: [ReviewLead, Reviewer, Producer]
    code: 200
    input: ["matter_id?", "limit?", "offset?"]
    output: ReviewBatch[]
    side_effects: []
  - method: POST
    path: "/review-batches/{id}/reviews"
    description: "Add a UNIQUE document to the batch for review"
    roles: [ReviewLead]
    code: 201
    input: [document_id]
    output: DocumentReview
    side_effects: ["recompute batch.document_count"]
  - method: GET
    path: "/review-batches/{id}/reviews"
    description: "List DocumentReview rows on the batch"
    roles: [ReviewLead, Reviewer, Producer]
    code: 200
    input: ["limit?", "offset?"]
    output: DocumentReview[]
    side_effects: []
  - method: POST
    path: "/review-batches/{id}/open-review"
    description: "DRAFT->IN_REVIEW"
    roles: [ReviewLead]
    code: 200
    input: []
    output: ReviewBatch
    side_effects: ["status=IN_REVIEW"]
  - method: POST
    path: "/review-batches/{id}/submit-qc"
    description: "IN_REVIEW->QC_REVIEW (all docs decided)"
    roles: [ReviewLead]
    code: 200
    input: []
    output: ReviewBatch
    side_effects: ["status=QC_REVIEW"]
  - method: POST
    path: "/review-batches/{id}/reopen"
    description: "QC_REVIEW->IN_REVIEW (revision loop)"
    roles: [ReviewLead]
    code: 200
    input: []
    output: ReviewBatch
    side_effects: ["status=IN_REVIEW"]
  - method: POST
    path: "/review-batches/{id}/complete"
    description: "QC_REVIEW->COMPLETED; freezes tags; recomputes responsive_doc_count"
    roles: [ReviewLead]
    code: 200
    input: []
    output: ReviewBatch
    side_effects: ["status=COMPLETED; freeze Document tags; recompute Matter.responsive_doc_count"]

  # ---- DocumentReview ----
  - method: GET
    path: "/document-reviews/{id}"
    description: "Fetch a document review"
    roles: [ReviewLead, Reviewer, Producer]
    code: 200
    input: []
    output: DocumentReview
    side_effects: []
  - method: GET
    path: "/document-reviews"
    description: "List/filter document reviews by batch or document"
    roles: [ReviewLead, Reviewer, Producer]
    code: 200
    input: ["batch_id?", "document_id?", "limit?", "offset?"]
    output: DocumentReview[]
    side_effects: []
  - method: POST
    path: "/document-reviews/{id}/decide"
    description: "Reviewer records a privilege/responsiveness decision"
    roles: [Reviewer]
    code: 200
    input: [decision]
    output: DocumentReview
    side_effects: ["set decision; set reviewer_user_id=X-User-ID; recompute batch.reviewed_count"]

  # ---- ProductionSet ----
  - method: POST
    path: "/production-sets"
    description: "Create a Bates production set from a COMPLETED batch"
    roles: [Producer]
    code: 201
    input: [matter_id, source_batch_id]
    output: ProductionSet
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/production-sets/{id}"
    description: "Fetch a production set"
    roles: [Producer, LegalOps]
    code: 200
    input: []
    output: ProductionSet
    side_effects: []
  - method: GET
    path: "/production-sets"
    description: "List/filter production sets by matter or source batch"
    roles: [Producer, LegalOps]
    code: 200
    input: ["matter_id?", "source_batch_id?", "limit?", "offset?"]
    output: ProductionSet[]
    side_effects: []
  - method: POST
    path: "/production-sets/{id}/items"
    description: "Add a (non-privileged) document to the production set"
    roles: [Producer]
    code: 201
    input: [document_id]
    output: ProductionItem
    side_effects: ["recompute set.item_count"]
  - method: GET
    path: "/production-sets/{id}/items"
    description: "List ProductionItems on the set"
    roles: [Producer, LegalOps]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductionItem[]
    side_effects: []
  - method: POST
    path: "/production-sets/{id}/validate"
    description: "DRAFT->VALIDATING; system forks to BLOCKED or STAGED + Bates allocation"
    roles: [Producer]
    code: 200
    input: []
    output: ProductionSet
    side_effects: ["VALIDATING then BLOCKED|STAGED; on STAGED allocate Bates + produced_page_count"]
  - method: POST
    path: "/production-sets/{id}/revise"
    description: "BLOCKED->DRAFT for rework"
    roles: [Producer]
    code: 200
    input: []
    output: ProductionSet
    side_effects: ["status=DRAFT"]
  - method: POST
    path: "/production-sets/{id}/produce"
    description: "STAGED->PRODUCED (segregation-of-duties enforced)"
    roles: [Producer]
    code: 200
    input: []
    output: ProductionSet
    side_effects: ["status=PRODUCED; items->PRODUCED; recompute Matter.produced_document_count; increments ProductionSet.version"]

  # ---- ProductionItem (reverse reach for FKs) ----
  - method: GET
    path: "/production-items/{id}"
    description: "Fetch a production item"
    roles: [Producer, LegalOps]
    code: 200
    input: []
    output: ProductionItem
    side_effects: []
  - method: GET
    path: "/production-items"
    description: "List/filter production items by set or document"
    roles: [Producer, LegalOps]
    code: 200
    input: ["set_id?", "document_id?", "limit?", "offset?"]
    output: ProductionItem[]
    side_effects: []

  # ---- Clawback ----
  - method: POST
    path: "/clawbacks"
    description: "File a clawback against a PRODUCED item (OCC on ProductionSet.version)"
    roles: [Producer]
    code: 201
    input: [matter_id, production_item_id, reason, expected_production_set_version]
    output: Clawback
    side_effects: ["status=REQUESTED", "increments ProductionSet.version by 1 (the parent set of the targeted item)"]
  - method: GET
    path: "/clawbacks/{id}"
    description: "Fetch a clawback"
    roles: [Producer, LegalOps]
    code: 200
    input: []
    output: Clawback
    side_effects: []
  - method: GET
    path: "/clawbacks"
    description: "List/filter clawbacks by matter or production item"
    roles: [Producer, LegalOps]
    code: 200
    input: ["matter_id?", "production_item_id?", "limit?", "offset?"]
    output: Clawback[]
    side_effects: []
  - method: POST
    path: "/clawbacks/{id}/sequester"
    description: "REQUESTED->SEQUESTERED; retires the item; conserves produced+clawed total"
    roles: [Producer]
    code: 200
    input: []
    output: Clawback
    side_effects: ["item->CLAWED_BACK; doc->PRIVILEGED; recompute Matter produced/clawed counts"]
  - method: POST
    path: "/clawbacks/{id}/dispute"
    description: "REQUESTED->DISPUTED; item stays PRODUCED"
    roles: [LegalOps]
    code: 200
    input: []
    output: Clawback
    side_effects: ["status=DISPUTED"]

  # ---- Test-driving endpoint ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving: pin the server's notion of current UTC time"
    roles: [LegalOps]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["server clock set to to_iso8601 for subsequent now-stamping"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role not permitted for this endpoint"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Producer producing a set is the reviewer_user_id who decided one of its documents"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or FK-referenced resource does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_BATCH_NOT_COMPLETED
    http: 409
    condition: "ProductionSet validate attempted while source ReviewBatch not COMPLETED"
  - id: ERR_CUSTODIAN_NOT_ACKNOWLEDGED
    http: 409
    condition: "Collection start while scope's custodian has not ACKNOWLEDGED the hold"
  - id: ERR_PRIVILEGED_DOCUMENT
    http: 422
    condition: "Attempt to add a PRIVILEGED document as a ProductionItem"
  - id: ERR_DOCUMENT_NOT_UNIQUE
    http: 422
    condition: "DocumentReview target is not a UNIQUE (post-dedup) document of the batch's matter"
  - id: ERR_SCOPE_DATE_OVERLAP
    http: 409
    condition: "New CollectionScope date range overlaps an existing scope for the same custodian+matter"
  - id: ERR_DUPLICATE_CUSTODIAN_EMAIL
    http: 409
    condition: "Custodian email already used within the matter (case-insensitive)"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "CollectionScope range_start not strictly before range_end"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing/invalid required field, bad enum, out-of-range numeric, or malformed bates_prefix"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_production_set_version does not match current ProductionSet.version"
  - id: ERR_HOLD_HAS_NO_CUSTODIANS
    http: 409
    condition: "Issuing a hold on a matter with zero custodians"
  - id: ERR_VALIDATION_OUT_OF_RANGE
    http: 422
    condition: "Pagination limit/offset outside [min,max] bounds"
  - id: ERR_BATCH_NOT_FULLY_REVIEWED
    http: 409
    condition: "submit-qc while reviewed_count < document_count"
  - id: ERR_EMPTY_BATCH
    http: 409
    condition: "open-review on a batch with zero documents"
  - id: ERR_EMPTY_PRODUCTION_SET
    http: 409
    condition: "validate a production set with zero items"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LegalOps
    description: "Legal operations: creates matters/custodians, issues holds, drives collection/processing, manages lifecycle and hold release"
    identity: opaque
    exclusive_operations:
      - "POST /matters"
      - "POST /custodians"
      - "POST /legal-holds (+issue)"
      - "POST /collection-scopes (+start/+finish)"
      - "POST /documents"
      - "POST /processing-jobs (+run/+complete/+fail)"
      - "POST /matters/{id}/begin-close"
      - "POST /matters/{id}/release-hold"
      - "POST /matters/{id}/close"
      - "POST /clawbacks/{id}/dispute"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across matters/custodians/holds/scopes/documents/jobs/batches/production/clawbacks"

  - name: ReviewLead
    description: "Owns review batches: creates them, adds documents, drives the review/QC cycle"
    identity: opaque
    exclusive_operations:
      - "POST /review-batches (+reviews/open-review/submit-qc/reopen/complete)"
    shared_operations:
      - "GET reads on matters/custodians/holds/documents/batches/reviews"

  - name: Reviewer
    description: "Makes per-document privilege/responsiveness decisions"
    identity: opaque
    exclusive_operations:
      - "POST /document-reviews/{id}/decide"
    shared_operations:
      - "GET reads on matters/documents/batches/reviews"

  - name: Producer
    description: "Builds Bates production sets, produces them, and files clawbacks; separated from reviewers by SoD"
    identity: opaque
    exclusive_operations:
      - "POST /production-sets (+items/validate/revise/produce)"
      - "POST /clawbacks (+sequester)"
    shared_operations:
      - "GET reads on matters/documents/batches/production/clawbacks"

  - name: Custodian
    description: "A person under hold who may only acknowledge their own hold notice"
    identity: "entity_backed:Custodian"
    exclusive_operations:
      - "POST /hold-acknowledgements/{id}/acknowledge"
    shared_operations:
      - "GET own hold-acknowledgements"
