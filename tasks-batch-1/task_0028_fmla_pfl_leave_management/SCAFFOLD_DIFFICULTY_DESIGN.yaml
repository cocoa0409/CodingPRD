            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/cases"
              payload: { employee_id: "${workerOL2_id}", qualifying_reason: "OWN_SERIOUS_HEALTH_CONDITION", leave_type: "INTERMITTENT", requested_start_at: "2026-06-01T00:00:00.000Z", requested_end_at: "2026-12-01T00:00:00.000Z" }
              as: HRAdmin
              captures: { caseOL2_id: $.data.id }
            - call: "POST /leave/cases/${caseOL2_id}/evaluate-eligibility"
              payload: {}
              as: HRAdmin
              captures: { caseOL2_v_post_elig: $.data.version }
            - call: "POST /leave/certifications"
              payload: { leave_case_id: "${caseOL2_id}", provider_id: "${provOL2_id}", expected_duration_weeks: 26, intermittent_frequency_per_month: 2, intermittent_hours_per_episode: 8, provider_attestation_signed_at: "2026-05-15T00:00:00.000Z" }
              as: HealthcareProvider
              captures: { certOL2_id: $.data.id }
            - call: "POST /leave/certifications/${certOL2_id}/receive"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/certifications/${certOL2_id}/mark-complete"
              payload: {}
              as: HRAdmin
            - call: "POST /leave/cases/${caseOL2_id}/approve"
              payload: { expected_leave_case_version: "${caseOL2_v_post_elig}" }
              as: HRAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseOL2_id}", start_datetime: "2026-06-02T00:00:00.000Z", end_datetime: "2026-06-02T08:00:00.000Z", hours_taken: 8 }
              as: HRAdmin
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseOL2_id}", start_datetime: "2026-06-16T00:00:00.000Z", end_datetime: "2026-06-16T08:00:00.000Z", hours_taken: 8 }
              as: HRAdmin
          trigger:
            - call: "POST /leave/intervals"
              payload: { leave_case_id: "${caseOL2_id}", start_datetime: "2026-06-25T00:00:00.000Z", end_datetime: "2026-06-25T08:00:00.000Z", hours_taken: 8 }
              as: HRAdmin
              captures: { ol2_err: $.data.error_id }
          assert:
            - "ol2_err == ERR_INTERMITTENT_FREQUENCY_EXCEEDED (the third interval in 2026-06 exceeds intermittent_frequency_per_month=2)."
            - "The rejected interval does NOT overlap any other interval — it sits 9 days after the second one — yet is still rejected: aggregate-count semantics, distinct from pairwise overlap."

  # ---------------------------------------------------------------------------
  # Rule 9: compensating_invariant — different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: interval_reverse_restores_fmla_pool
        grounds:
          - state_machines.LeaveInterval.RECORDED_to_REVERSED
          - calculations.fmla_pfl_pool_charge
          - entities.LeaveCase.fields.fmla_hours_charged
        distinguishing_aspect: |
          Conserved quantity: LeaveCase.fmla_hours_charged ==
          sum(LeaveInterval.fmla_hours_charged WHERE
              leave_case_id == LeaveCase.id AND status == RECORDED).
          Forward action: POST /leave/intervals (charges +H). Compensating
          action: POST /leave/intervals/{id}/reverse (charges -H). After the
          pair, the named invariant holds with zero drift; further, if the
          forward action had flipped job_restoration_protected to false, the
          reverse restores it to true.
        test_recipe:
          setup:
            - "Case ACTIVE. 479 hours seeded; clock at requested_start_at."
            - "A new interval of 1 hour is recorded (cumulative 480 → job_restoration_protected flips to false)."
            - "Then the same interval is reversed."
