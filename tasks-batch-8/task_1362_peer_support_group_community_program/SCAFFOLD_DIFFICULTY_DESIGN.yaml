              as: ProgramAdmin
              captures: { pb: $.data.id }
            - call: "POST /participants/${pa}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pb}/agreements"
              payload: { signed_at: "2026-07-25T00:00:00Z", expires_at: "2027-07-25T00:00:00Z", agreement_version: 1 }
              as: ProgramAdmin
            - call: "POST /participants/${pa}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /participants/${pb}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pa}" }
              as: ProgramAdmin
              captures: { ea: $.data.id }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments"
              payload: { participant_id: "${pb}" }
              as: ProgramAdmin
              captures: { eb: $.data.id, eb_seat: $.data.seat_status, eb_agr: $.data.agreement_status }
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv_pre: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${ea}/confirm"
              payload: { expected_group_version: "${gv_pre}" }
              as: ProgramAdmin
          trigger:
            - call: "GET /programs/${pid}/groups/${gid}"
              payload: {}
              as: ProgramAdmin
              captures: { gv_now: $.data.version }
            - call: "POST /programs/${pid}/groups/${gid}/enrollments/${eb}/confirm"
              payload: { expected_group_version: "${gv_now}" }
              as: ProgramAdmin
          assert:
            - "B's enrollment seat_status was initially RESERVED (created first-come)"
            - "After A confirms, active_enrollment_count == 1 == base_capacity"
            - "B's confirm attempt: system transitions B RESERVED→WAITLISTED"
            - "Enrollment.${eb}.seat_status == WAITLISTED"
            - "Enrollment.${eb}.agreement_status == PENDING (unchanged — parallel dimension)"
            - "seat_status and agreement_status evolve independently"

