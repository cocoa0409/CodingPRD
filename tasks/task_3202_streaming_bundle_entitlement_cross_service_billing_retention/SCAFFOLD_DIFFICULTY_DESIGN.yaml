        distinguishing_aspect: |
          Cycle on Entitlement (ACTIVE -> SUSPENDED -> ACTIVE) driven through
          a DIFFERENT entity's machine (SubscriberAccount suspend/reactivate),
          proving the entitlement machine's loop is externally driven and
