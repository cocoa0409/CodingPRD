            - "HOP 3 — ConsensusAdjustment.${adj_id}.status == \"VOIDED\" and DemandForecast.${fc_nov_id}.endorsed_adjustment_count == 0"
            - "HOP 4 — SupplyPlan.${plan_id}.status == \"STALE\", requires_replan == true, every Allocation of the plan has allocation_status \"VOIDED\" with allocated_units == 0, and PlanningCycle.${cycle_id}.plan_value_cents == 0, constrained_plan_count == 0, residual_gap_cents == 0, posture == \"GREEN\""

      - name: inventory_policy_change_cascades_to_allocations_and_cycle_gap
        grounds:
          - calculations.calc_inventory_policy
          - state_machines.SupplyPlan.RATIONED_to_STALE
          - calculations.calc_cycle_financials
          - calculations.calc_cycle_posture
          - entities.Allocation.fields.allocation_status
        distinguishing_aspect: |
          Trigger: POST /sop/items/{item_id}/inventory-policy — a master-data write, not a state
          transition, and a different trigger than the runout instance. Depth 3: (1) the Item's
          safety_stock_units and reorder_point_units are re-derived from the new z tier;
          (2) the item's non-STALE SupplyPlan becomes STALE and every Allocation under it is
          VOIDED to allocated_units 0; (3) the owning PlanningCycle's plan_value_cents,
          gross_gap_cents, residual_gap_cents, constrained_plan_count and posture are re-derived.
          The chain crosses Item -> SupplyPlan/Allocation -> PlanningCycle, a different entity
          triple than the runout cascade's Item -> DemandForecast/Promotion/ConsensusAdjustment.
        test_recipe:
          setup:
