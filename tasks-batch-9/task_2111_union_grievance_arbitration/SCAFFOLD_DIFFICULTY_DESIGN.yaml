  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: cost_void_restores_case_cost_identity
        grounds:
          - state_machines.CostEntry.POSTED_to_VOIDED
          - calculations.case_cost_allocation
          - entities.Grievance.fields.total_cost_cents
          - entities.Grievance.fields.cost_posture
        distinguishing_aspect: |
          The conserved quantity is money on the case ledger: posting a 400000 SPLIT entry and
          then voiding it must return Grievance.total_cost_cents to exactly 972000, restore
          cost_posture to COST_OK, and keep the identity
          total_cost_cents == union_cost_share_cents + employer_cost_share_cents true at every
          step even though the void also re-selects the cost-sharing tier.
        test_recipe:
          setup:
            - "Local 2100 fixture, clause ART-12, supervisor SUP-1, grievant EMP-1, steward STW-1."
            - "One grievance in FILED carrying a single manual COUNSEL cost of 900000 cents borne by the employer."
          setup_api_calls:
            - call: "POST /labor-relations/bargaining-units"
              payload: { name: "Municipal Services Local 2100", local_number: "L2100", contract_effective_date: "2025-01-01T00:00:00Z", contract_expiry_date: "2027-12-31T00:00:00Z" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { bu_id: $.data.id }
            - call: "POST /labor-relations/bargaining-units/${bu_id}/contract-clauses"
              payload: { clause_number: "ART-12", title: "Just Cause Discipline", category: "DISCIPLINE" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { cl_id: $.data.id }
            - call: "POST /labor-relations/employees"
              payload: { bargaining_unit_id: "${bu_id}", full_name: "Dana Fields", employee_number: "SUP-1", hire_date: "2015-03-01T00:00:00Z", seniority_date: "2015-03-01T00:00:00Z", hourly_rate_cents: 4200, classification: "SUPERVISOR" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { sup_id: $.data.id }
            - call: "POST /labor-relations/employees"
              payload: { bargaining_unit_id: "${bu_id}", full_name: "Ray Ortiz", employee_number: "EMP-1", hire_date: "2018-01-08T00:00:00Z", seniority_date: "2018-01-08T00:00:00Z", hourly_rate_cents: 3500, classification: "PRODUCTION", supervisor_id: "${sup_id}" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { emp1_id: $.data.id }
            - call: "POST /labor-relations/employees"
              payload: { bargaining_unit_id: "${bu_id}", full_name: "Ivan Cruz", employee_number: "STW-1", hire_date: "2016-02-01T00:00:00Z", seniority_date: "2016-02-01T00:00:00Z", hourly_rate_cents: 3200, classification: "CLERICAL", supervisor_id: "${sup_id}" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { stw_id: $.data.id }
            - call: "POST /labor-relations/grievances"
              payload: { bargaining_unit_id: "${bu_id}", grievant_id: "${emp1_id}", respondent_supervisor_id: "${sup_id}", clause_id: "${cl_id}", statement: "Discipline grievance with counsel involvement", incident_date: "2026-07-10T00:00:00Z", discovery_date: "2026-07-12T00:00:00Z" }
              as: UnionSteward
              as_user_id: "${stw_id}"
              captures: { g_id: $.data.id }
            - call: "POST /labor-relations/grievances/${g_id}/cost-entries"
              payload: { category: "COUNSEL", amount_cents: 900000, bearing_party: "EMPLOYER" }
              as: LaborRelationsAnalyst
              as_user_id: "lr-analyst-01"
              captures: { ce1_id: $.data.id }
            - call: "GET /labor-relations/grievances/${g_id}"
              payload: {}
              as: LaborRelationsAnalyst
              as_user_id: "lr-analyst-01"
              captures: { total_before: $.data.total_cost_cents, union_before: $.data.union_cost_share_cents, employer_before: $.data.employer_cost_share_cents, posture_before: $.data.cost_posture }
          trigger:
            - call: "POST /labor-relations/grievances/${g_id}/cost-entries"
              payload: { category: "TRANSCRIPT", amount_cents: 400000, bearing_party: "SPLIT" }
              as: LaborRelationsAnalyst
              as_user_id: "lr-analyst-01"
              captures: { ce2_id: $.data.id }
            - call: "GET /labor-relations/grievances/${g_id}"
              payload: {}
              as: LaborRelationsAnalyst
              as_user_id: "lr-analyst-01"
              captures: { total_mid: $.data.total_cost_cents, posture_mid: $.data.cost_posture }
            - call: "POST /labor-relations/cost-entries/${ce2_id}/void"
              payload: { void_reason: "Transcript ordered in error" }
              as: LaborRelationsDirector
              as_user_id: "lr-dir-01"
              captures: { ce2_status: $.data.status }
            - call: "GET /labor-relations/grievances/${g_id}"
              payload: {}
              as: LaborRelationsAnalyst
              as_user_id: "lr-analyst-01"
              captures: { total_after: $.data.total_cost_cents, union_after: $.data.union_cost_share_cents, employer_after: $.data.employer_cost_share_cents, posture_after: $.data.cost_posture }
          assert:
            - "Before the forward action: total_cost_cents == 972000, union_cost_share_cents == 0, employer_cost_share_cents == 972000, cost_posture == COST_OK"
            - "After the forward action: total_cost_cents == 1384800, union_cost_share_cents == 240000, employer_cost_share_cents == 1144800, cost_posture == COST_WATCH"
            - "After the compensating void: CostEntry.${ce2_id}.status == VOIDED with voided_by_user_id == lr-dir-01"
            - "After the compensating void: total_cost_cents == 972000, union_cost_share_cents == 0, employer_cost_share_cents == 972000, cost_posture == COST_OK - exactly the pre-action values"
            - "total_cost_cents == union_cost_share_cents + employer_cost_share_cents holds at all three observation points"
            - "GET /labor-relations/grievances/${g_id}/cost-entries returns total_count == 2, so the void preserved the audit row rather than deleting it"

