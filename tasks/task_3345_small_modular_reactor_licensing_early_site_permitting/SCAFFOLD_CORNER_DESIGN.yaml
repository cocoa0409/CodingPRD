        grounds:
          - 'endpoints."POST /licensing/_clock/set_current_utc'
        distinguishing_aspect: "Before any set call, logical clock defaults to 2026-09-01T00:00:00Z — a hearing scheduled 2026-08-01 (past relative to default) is rejected without any clock-set."
        test_recipe:
          setup: ["ESP in HEARINGS; no clock set"]
