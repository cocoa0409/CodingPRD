  - method: GET
    path: "/fulfillment-network/packaging-supplies"
    description: "List packaging rows, filterable by node (FK reverse-reachability for PackagingSupply.store_id)."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: ["store_id?", "package_type?", "reorder_flag?", "limit?", "offset?"]
    output: PackagingSupply[]
    side_effects: []

  - method: GET
    path: "/fulfillment-network/packaging-supplies/{supply_id}"
    description: "Read one packaging row."
    roles: [NetworkPlanner, StoreAssociate, CarrierCoordinator, CustomerCare]
    code: 200
    input: []
    output: PackagingSupply
    side_effects: []

  - method: POST
    path: "/fulfillment-network/packaging-supplies/{supply_id}/restock"
