            - "ServicePeriodReport.${rep5}.billable_service_hours == 1.60"
            - "ServicePeriodReport.${rep5}.gross_amount_cents == 14400"
            - "ServicePeriodReport.${rep5}.sla_penalty_cents == 1440"
            - "ServicePeriodReport.${rep5}.net_amount_cents == 12960"

      - name: empty_period_on_time_pct_is_one_hundred
        grounds:
          - calculations.period_sla_penalty
          - calculations.period_gross_amount
          - calculations.period_net_settlement
          - entities.ServicePeriodReport.fields.countable_trip_count
          - endpoints[POST /service-period-reports/{id}/submit]
        distinguishing_aspect: |
          A different metric and a different endpoint: an empty collection rather than a
          numeric threshold. With zero trips in the period the denominator is 0, so
          on_time_pct is pinned to 100.00 instead of a division error or 0.00, and every
          money field is exactly 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T06:00:00Z."
            - "One ACTIVE ServiceContract with no routes, no trips and no credit memos."
            - "One DRAFT ServicePeriodReport covering 2026-09-01..2026-09-30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
