# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_1721_septic_system_design_installation
# Sections follow references/claim-extraction-guide.md. Instances already
# exercised by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_installer_company_returns_201_with_all_fields
        claim_type: creation
        grounds: [entities.InstallerCompany, "endpoints[POST /septic-ops/installer-companies]"]
        distinguishing_aspect: "POST with all required fields returns 201 and the response carries the input fields plus system-minted id/created_at/version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH", "BG"] }
              as: PlatformAdmin
              captures: { cid: $.data.id, v: $.data.version, c_at: $.data.created_at }
          assert:
            - "response is 201; data.legal_name == 'Clearwater Onsite LLC'; data.license_number == 'CW-100'; data.county_codes == ['WH','BG']"
            - "data.id is a bare UUID (no type prefix); data.version == 1; data.created_at is ISO-8601 UTC with three fractional digits"

      - name: create_site_applies_system_defaults
        claim_type: defaults
        grounds: [entities.Site.fields.current_period_index, entities.Site.fields.seasonal_freeze_until, entities.Site.fields.status]
        distinguishing_aspect: "A newly created site starts with current_period_index 0, seasonal_freeze_until -1, status OPEN — system defaults the client must not have to pass."
        test_recipe:
          setup: ["Company and customer exist"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
          trigger:
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { s: $.data.id, per: $.data.current_period_index, frz: $.data.seasonal_freeze_until, st: $.data.status }
          assert:
            - "Site.${s}.current_period_index == 0"
            - "Site.${s}.seasonal_freeze_until == -1"
            - "Site.${s}.status == OPEN"

      - name: get_site_with_unknown_id_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET on a well-formed but non-existent site UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Company and customer exist"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
          trigger:
            - call: "GET /septic-ops/installer-companies/${cid}/customers/${cu}/sites/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and error_id == ERR_NOT_FOUND"

      - name: create_customer_missing_email_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Customer.fields.email, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting the required email field on customer creation returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Company exists"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 and error_id == ERR_INVALID_REQUEST"

      - name: design_computed_fields_ignore_client_input_and_match_formula
        claim_type: computed_fields
        grounds: [entities.SystemDesign.fields.design_daily_flow_gpd, calculations.design_daily_flow_gpd, calculations.reserve_area_sqft]
        distinguishing_aspect: "The server computes the four sizing fields; a 6-bedroom CLAY design at 48in limiting layer yields flow 900, area 3000, tank 2000, reserve 3000 — and any client-supplied sizing values (if smuggled in) are ignored."
        test_recipe:
          setup: ["Company, designer D1, scientist SS1, manager M1, customer, site S; science E1 (CLAY, 48in) and PT1 recorded"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/system-designers"
              payload: { full_name: "Dana Designer", license_number: "DSGN-1" }
              as: PlatformAdmin
              captures: { d1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/soil-scientists"
              payload: { full_name: "Sam Scientist", license_number: "SS-1" }
              as: PlatformAdmin
              captures: { ss1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { s: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/soil-evaluations"
              payload: { evaluator_id: "${ss1}", soil_class: "CLAY", limiting_layer_inches: 48 }
              as: SoilScientist
              as_user_id: "${ss1}"
              captures: { e1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/percolation-tests"
              payload: { evaluator_id: "${ss1}", minutes_per_inch: 60.0, test_pit_count: 6 }
              as: SoilScientist
              as_user_id: "${ss1}"
              captures: { pt1: $.data.id }
          trigger:
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs"
              payload: { designer_id: "${d1}", soil_evaluation_id: "${e1}", percolation_test_id: "${pt1}", bedroom_count: 6, system_type: "GRAVITY" }
              as: SystemDesigner
              as_user_id: "${d1}"
              captures: { d: $.data.id, flow: $.data.design_daily_flow_gpd, area: $.data.required_absorption_area_sqft, tank: $.data.tank_capacity_gal, res: $.data.reserve_area_sqft }
          assert:
            - "Design.${d}.design_daily_flow_gpd == 900 (6 * 150, no surcharge)"
            - "Design.${d}.required_absorption_area_sqft == 3000 (900 / 0.30, exact)"
            - "Design.${d}.tank_capacity_gal == 2000 (raw 1800 steps up to catalog 2000)"
            - "Design.${d}.reserve_area_sqft == 3000 (post-ceil area * 1.0)"

      - name: list_endpoints_paginate_with_envelope_fields
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /septic-ops/installer-companies/{cid}/customers/{cuid}/sites]"]
        distinguishing_aspect: "List endpoints return the envelope's pagination fields and honor limit/offset; creating 3 sites and listing with limit=2 yields total_count 3, has_more true, and the second page holds the remaining 1."
        test_recipe:
          setup: ["Company, manager, customer; three sites created"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-2", address_line: "2 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-3", address_line: "3 Meadow Ln", county_code: "WH", high_water_table: true }
              as: ProjectManager
              as_user_id: "${m1}"
          trigger:
            - call: "GET /septic-ops/installer-companies/${cid}/customers/${cu}/sites?limit=2&offset=0"
              payload: {}
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { page1: $.data }
            - call: "GET /septic-ops/installer-companies/${cid}/customers/${cu}/sites?limit=2&offset=2"
              payload: {}
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { page2: $.data }
          assert:
            - "Page 1: len(data) == 2, meta/envelope carries total_count == 3 and has_more == true"
            - "Page 2: len(data) == 1 and has_more == false"
            - "The two pages are disjoint and together enumerate all 3 sites"

      - name: duplicate_parcel_id_within_company_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=19]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Uniqueness: a second site with the same parcel_id under the same installer company is rejected 400 ERR_INVALID_REQUEST (the same parcel id under a DIFFERENT company is legal — uniqueness is tenant-scoped)."
        test_recipe:
          setup: ["Two companies C1/C2; managers in C1; customer in each; site with parcel P-1 already in C1"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Bedrock Septic Inc", license_number: "BS-200", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /septic-ops/installer-companies/${c1}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${c2}/project-managers"
              payload: { full_name: "Morgan Manager", employee_number: "PM-9" }
              as: PlatformAdmin
              captures: { m2: $.data.id }
            - call: "POST /septic-ops/installer-companies/${c1}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${c2}/customers"
              payload: { full_name: "Oscar Owner", email: "oscar@example.com", phone: "555-0200" }
              as: ProjectManager
              as_user_id: "${m2}"
              captures: { cu2: $.data.id }
            - call: "POST /septic-ops/installer-companies/${c1}/customers/${cu1}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
          trigger:
            - call: "POST /septic-ops/installer-companies/${c1}/customers/${cu1}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln DUPLICATE", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
            - call: "POST /septic-ops/installer-companies/${c2}/customers/${cu2}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m2}"
              captures: { s2: $.data.id }
          assert:
            - "Duplicate parcel_id in company ${c1}: HTTP 400 ERR_INVALID_REQUEST"
            - "Same parcel_id in company ${c2}: 201 created (uniqueness is scoped to the installer company)"

      - name: bedroom_count_out_of_range_rejected
        claim_type: type_constraints
        grounds: [entities.SystemDesign.fields.bedroom_count, "validations[priority=19]"]
        distinguishing_aspect: "bedroom_count 0 (below the 1..12 range) is rejected; 13 likewise. Enum/range constraint on a numeric input field."
        test_recipe:
          setup: ["Company, designer D1, scientist SS1, manager M1, customer, site S, science E1/PT1"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/system-designers"
              payload: { full_name: "Dana Designer", license_number: "DSGN-1" }
              as: PlatformAdmin
              captures: { d1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/soil-scientists"
              payload: { full_name: "Sam Scientist", license_number: "SS-1" }
              as: PlatformAdmin
              captures: { ss1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { s: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/soil-evaluations"
              payload: { evaluator_id: "${ss1}", soil_class: "LOAM", limiting_layer_inches: 36 }
              as: SoilScientist
              as_user_id: "${ss1}"
              captures: { e1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/percolation-tests"
              payload: { evaluator_id: "${ss1}", minutes_per_inch: 12.0, test_pit_count: 4 }
              as: SoilScientist
              as_user_id: "${ss1}"
              captures: { pt1: $.data.id }
          trigger:
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs"
              payload: { designer_id: "${d1}", soil_evaluation_id: "${e1}", percolation_test_id: "${pt1}", bedroom_count: 0, system_type: "GRAVITY" }
              as: SystemDesigner
              as_user_id: "${d1}"
              captures: { err0: $.data.error_id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites/${s}/designs"
              payload: { designer_id: "${d1}", soil_evaluation_id: "${e1}", percolation_test_id: "${pt1}", bedroom_count: 13, system_type: "GRAVITY" }
              as: SystemDesigner
              as_user_id: "${d1}"
              captures: { err13: $.data.error_id }
          assert:
            - "bedroom_count 0: ERR_INVALID_REQUEST"
            - "bedroom_count 13: ERR_INVALID_REQUEST"

      - name: system_fields_on_create_ignore_client_supplied_id_and_version
        claim_type: system_fields
        grounds: [entities.Site, response_envelope]
        distinguishing_aspect: "Client-supplied id/version/created_at keys in a create payload are ignored (or rejected as unknown); the server mints id and stamps created_at/version=1 itself."
        test_recipe:
          setup: ["Company, manager, customer"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
          trigger:
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-9", address_line: "9 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { s: $.data.id, v: $.data.version }
          assert:
            - "Response id is server-minted (a fresh UUID), version == 1, and the created site is retrievable at GET .../sites/${s}"

      - name: child_creation_under_wrong_parent_returns_404
        claim_type: parent_relationships
        grounds: ["validations[priority=3]", entities.Site.parent]
        distinguishing_aspect: "Creating a site under customer CU1 but with company id of a DIFFERENT company (parent-chain mismatch) returns 404 ERR_NOT_FOUND, not a cross-tenant leak."
        test_recipe:
          setup: ["Two companies C1, C2; manager M1 in C1; customer CU1 in C1"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { c1: $.data.id }
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Bedrock Septic Inc", license_number: "BS-200", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { c2: $.data.id }
            - call: "POST /septic-ops/installer-companies/${c1}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${c1}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu1: $.data.id }
          trigger:
            - call: "POST /septic-ops/installer-companies/${c2}/customers/${cu1}/sites"
              payload: { parcel_id: "P-X", address_line: "X", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 ERR_NOT_FOUND (customer ${cu1} does not exist under company ${c2} — the parent chain resolves left-to-right)"

  # ===========================================================================
  # Section 2 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: design_withdraw_from_submitted_rejected
        claim_type: invalid_transition
        grounds: [state_machines.SystemDesign.DRAFT_to_WITHDRAWN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Withdraw is only declared from DRAFT; calling it on a SUBMITTED design is an invalid-from rejection with ERR_INVALID_STATE and no side effects."
        test_recipe:
          setup: ["Company/staff/customer/site; science E1/PT1; design D submitted (status SUBMITTED)"]
          setup_api_calls:
            - call: "POST /septic-ops/installer-companies"
              payload: { legal_name: "Clearwater Onsite LLC", license_number: "CW-100", county_codes: ["WH"] }
              as: PlatformAdmin
              captures: { cid: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/system-designers"
              payload: { full_name: "Dana Designer", license_number: "DSGN-1" }
              as: PlatformAdmin
              captures: { d1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/project-managers"
              payload: { full_name: "Pat Manager", employee_number: "PM-1" }
              as: PlatformAdmin
              captures: { m1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/soil-scientists"
              payload: { full_name: "Sam Scientist", license_number: "SS-1" }
              as: PlatformAdmin
              captures: { ss1: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers"
              payload: { full_name: "Olive Owner", email: "olive@example.com", phone: "555-0100" }
              as: ProjectManager
              as_user_id: "${m1}"
              captures: { cu: $.data.id }
            - call: "POST /septic-ops/installer-companies/${cid}/customers/${cu}/sites"
              payload: { parcel_id: "P-1", address_line: "1 Meadow Ln", county_code: "WH", high_water_table: false }
              as: ProjectManager
              as_user_id: "${m1}"
