  - rule_id: transitive_cascade
    instances:
      - name: distribution_run_cascades_through_claim_into_vendor_engagement_and_ledger
        grounds:
          - state_machines.CoveredClaim.APPROVED_to_PAID
          - state_machines.VendorAssignment.ASSIGNED_to_CLOSED
          - calculations.distribution_waterfall
          - calculations.insolvency_ledger_recompute
          - entities.Insolvency.fields.reserved_claim_cents
        distinguishing_aspect: |
          One distribution call walks four levels: Insolvency pays class 1 then class 2, the CoveredClaim
          moves APPROVED to PAID, that in turn closes the still-ASSIGNED VendorAssignment, and the
          insolvency ledger is recomputed so reserved_claim_cents falls from 3000000 to 0 while
          administrative_paid_cents rises to 180000 and estate_undistributed_cents lands on 20000.
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile (per_claim_cap_cents 3000000, per_policy_aggregate_cap_cents 5000000, statutory_deductible_cents 10000)."
            - "TransferredPolicy PA-1001 in CANCELLED_BY_ORDER with no unearned premium refund filed."
            - "CoveredClaim C-1 in APPROVED with net_payable_cents 3000000 and no other insurance, so reserved_claim_cents is 3000000."
            - "One ASSIGNED ADJUSTER VendorAssignment at 18000 cents per hour with 10 invoiced hours, so fees_accrued_cents and administrative_expense_cents are 180000."
            - "estate_remitted_cents 3200000 and estate_undistributed_cents 3200000; distribution_sequence 0."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2, statutory_deductible_cents: 10000 }
              as: AssociationAdmin
