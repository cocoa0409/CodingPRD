            - { call: "POST /v1/mechanics", payload: { name: "Mo", ebike_certified: false, home_zone_id: "${zone_id}" }, as: PlatformAdmin, captures: { mech_id: $.data.id } }
            - { call: "POST /v1/vans", payload: { plate: "VAN-1", zone_id: "${zone_id}", mechanic_id: "${mech_id}", max_stops_per_day: 8 }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /v1/route-days", payload: { van_id: "${van_id}", date: "2026-05-02" }, as: Dispatcher, captures: { rd_id: $.data.id } }
            - { call: "POST /v1/route-days/${rd_id}/stops", payload: { service_request_id: "${req_id}", planned_start: "2026-05-02T10:00:00Z", planned_end: "2026-05-02T11:00:00Z" }, as: Dispatcher, captures: { stop_id: $.data.id } }
            - { call: "POST /v1/route-stops/${stop_id}/events", payload: { event_type: "ARRIVE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "START_SERVICE" }, as: Mechanic, as_user_id: "${mech_id}" }
            - { call: "POST /v1/service-requests/${req_id}/events", payload: { event_type: "COMPLETE", labor_minutes: 40 }, as: Mechanic, as_user_id: "${mech_id}" }
