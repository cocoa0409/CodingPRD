          assert:
            - "trigger[0]: HTTP 409 with data.error_id == ERR_CASE_OUTSIDE_BLOCK_WINDOW; the case stays DRAFT with block_id == null and the block's committed_minutes stays 0"
            - "trigger[1]: HTTP 200 with scheduling_status == BLOCK_HELD - planned_end exactly equal to block_end is inside the window"
            - "after both triggers: BlockTime.${blk_id}.committed_minutes == 60 and version was incremented exactly once"

      - name: released_minutes_make_a_fitting_case_exceed_block_capacity
