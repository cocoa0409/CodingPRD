          rationale: "The same §1.8 instance asserts that the event's deployment_settled_cost roll-up takes the FINAL_SETTLED value 8559.50 after the variant switch, not the provisional figure."

      - name: corner_calc_deployment_surge_tier_selected_from_subtotal_variant_context
        claim_type: variant_selection
        grounds:
          - calculations.deployment_cost
          - entities.Deployment.fields.surge_premium_tier
        excluded_because:
          difficulty_instance: deployment_surge_premium_tier_keyed_on_subtotal_not_total_mode_c
          rationale: "That §1.8 instance pins the tier to subtotal_pre_premium in the variant's single evaluation pass rather than to the post-premium total."

      - name: corner_calc_event_loss_estimate_two_methods_diverge
        claim_type: variant_divergence
        grounds:
          - calculations.event_loss_estimate
          - entities.LossEstimateSnapshot.fields.method
        excluded_because:
          difficulty_instance: event_loss_estimate_exposure_based_vs_incurred_development_divergence
          rationale: "That §1.8 instance asserts EXPOSURE_BASED 14000000.00 against INCURRED_DEVELOPMENT 913500.00 for identical stored inputs."

      - name: corner_calc_advance_cap_line_level_rounding_order
        claim_type: precision
        grounds:
          - calculations.advance_payment_amount
          - entities.Claim.fields.advance_cap
        excluded_because:
          difficulty_instance: advance_cap_round_each_coverage_line_then_sum_mode_b
          rationale: "That §1.8 instance already asserts the pinned round-each-line-then-sum order against the sum-then-round alternative in cents."

      - name: corner_calc_inspection_mode_desk_loss_ceiling_boundary
        claim_type: constants_applied
        grounds:
          - calculations.inspection_mode_resolution
          - entities.Claim.fields.inspection_mode
        excluded_because:
          difficulty_instance: desk_loss_ceiling_inclusive_at_10000_00_flips_at_10000_01
          rationale: "That §1.8 instance already pins DESK_LOSS_CEILING inclusivity at 10000.00 and the flip to FIELD at 10000.01."

      - name: corner_calc_reserve_conservation_incurred_total_across_issue_and_void
        claim_type: correct_result
        grounds:
          - calculations.reserve_conservation_invariant
          - entities.CatastropheEvent.fields.incurred_total
        excluded_because:
          difficulty_instance: incurred_dollars_conserved_across_advance_issue_then_void
          rationale: "That §1.8 instance asserts incurred_total, Claim.case_reserve and Claim.paid_amount return to their exact pre-issuance values."

      - name: corner_calc_housing_room_conservation_across_confirm_and_cancel
        claim_type: correct_result
        grounds:
          - calculations.housing_room_conservation_invariant
          - entities.HousingBlock.fields.rooms_available
        excluded_because:
          difficulty_instance: physical_rooms_conserved_across_confirm_then_cancel
          rationale: "That §1.8 instance asserts rooms_available and HousingBlock.status return to their exact pre-confirm values."

  - section: validations
    instances:
      - name: corner_val_role_not_permitted_precedes_body_schema_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - validations[priority=15]
          - errors[ERR_VALIDATION]
          - endpoints[POST /catastrophe-events]
        distinguishing_aspect: "A DeploymentCoordinator posting a body that also breaks the input schema (expected_severity_index 5.0, outside 0.0..1.0) receives 403 ERR_ROLE_NOT_PERMITTED, because priority 3 is evaluated before priority 15."
        test_recipe:
          setup:
            - "Empty database; only the logical clock is pinned to its startup default so the request is evaluated at a known instant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "cm_1"
          trigger:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-220", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-08-01T00:00:00.000Z", exposure_count: 900, avg_insured_value: 220000, expected_severity_index: 5.0 }
              as: DeploymentCoordinator
              as_user_id: "dc_1"
          assert:
            - "HTTP 403"
            - "error.code == ERR_ROLE_NOT_PERMITTED"
            - "error.code != ERR_VALIDATION"
            - "GET /catastrophe-events returns meta.total == 0 (no row was created)"

      - name: corner_val_unknown_role_precedes_event_existence_lookup
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - errors[ERR_UNKNOWN_ROLE]
          - validations[priority=4]
          - errors[ERR_EVENT_NOT_FOUND]
          - endpoints[GET /catastrophe-events/{eventId}]
        distinguishing_aspect: "A request bearing X-User-Role 'SurgeIntern' against a non-existent eventId returns 401 ERR_UNKNOWN_ROLE, not 404 ERR_EVENT_NOT_FOUND, because priority 2 outranks priority 4."
        test_recipe:
          setup:
            - "Empty database; the clock is pinned to its startup default and no CatastropheEvent row exists, so the path id cannot resolve."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: CatastropheManager
              as_user_id: "cm_1"
          trigger:
            - call: "GET /catastrophe-events/evt-does-not-exist-0001"
              payload: {}
              as: "SurgeIntern (a role string outside the six declared in §1.7, sent verbatim in X-User-Role)"
              as_user_id: "intern_1"
          assert:
            - "HTTP 401"
            - "error.code == ERR_UNKNOWN_ROLE"
            - "error.code != ERR_EVENT_NOT_FOUND"

      - name: corner_val_claim_existence_precedes_occ_version_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=5]
          - errors[ERR_CLAIM_NOT_FOUND]
          - validations[priority=18]
          - errors[ERR_STALE_CLAIM_VERSION]
          - endpoints[POST /claims/{claimId}/reserve-entries]
        distinguishing_aspect: "Posting a reserve entry to a non-existent claimId while carrying an expected_claim_version copied from a different real claim returns 404 ERR_CLAIM_NOT_FOUND, because priority 5 is evaluated before the priority 18 OCC comparison."
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00.000Z startup default."
            - "One CatastropheEvent 'CAT-2026-221' (HURRICANE, FL) in DECLARED and one Claim on it in INTAKE, whose version is read so a plausible-looking version value is available to the trigger."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-221", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-08-01T00:00:00.000Z", exposure_count: 900, avg_insured_value: 220000, expected_severity_index: 0.0400 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-221", loss_state: "FL", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 120000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 5000, estimated_damage_amount: 150000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "GET /claims/${cl}"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl_v1: $.data.version }
          trigger:
            - call: "POST /claims/clm-does-not-exist-0001/reserve-entries"
              payload: { expected_claim_version: "${cl_v1}", entry_type: "REVISION", delta_case_reserve: 500.00, delta_paid: 0.00, memo: "entry against a missing claim" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "HTTP 404"
            - "error.code == ERR_CLAIM_NOT_FOUND"
            - "error.code != ERR_STALE_CLAIM_VERSION"
            - "GET /reserve-entries?claim_id=${cl} returns meta.total == 0"

      - name: corner_val_stale_claim_version_precedes_negative_reserve_check
        claim_type: priority_ordering
        grounds:
          - validations[priority=18]
          - errors[ERR_STALE_CLAIM_VERSION]
          - validations[priority=41]
          - errors[ERR_RESERVE_WOULD_GO_NEGATIVE]
          - endpoints[POST /claims/{claimId}/reserve-entries]
        distinguishing_aspect: "A reserve entry carrying both a pre-triage expected_claim_version and a delta_case_reserve of -999999.00 returns 412 ERR_STALE_CLAIM_VERSION, because priority 18 is evaluated before the priority 41 fiscal floor."
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00.000Z startup default."
            - "One CatastropheEvent 'CAT-2026-222' (HURRICANE, FL) in DECLARED."
            - "One Claim TRIAGED at tier STANDARD with case_reserve 65250.00, whose version was captured BEFORE the triage call and is therefore stale by one increment."
          setup_api_calls:
            - call: "POST /catastrophe-events"
              payload: { cat_code: "CAT-2026-222", peril_type: "HURRICANE", jurisdiction_state: "FL", event_start_utc: "2026-08-01T00:00:00.000Z", exposure_count: 900, avg_insured_value: 220000, expected_severity_index: 0.0400 }
              as: CatastropheManager
              as_user_id: "cm_1"
              captures: { ev: $.data.id }
            - call: "POST /catastrophe-events/${ev}/declare"
              payload: {}
              as: CatastropheManager
              as_user_id: "cm_1"
            - call: "POST /claims"
              payload: { policy_number: "POL-222", loss_state: "FL", loss_date_utc: "2026-07-30T00:00:00.000Z", reported_loss_amount: 120000, coverage_lines: [{ coverage_code: "DWELLING", limit_amount: 400000, deductible_amount: 5000, estimated_damage_amount: 150000 }], event_id: "${ev}", access_status: "ACCESSIBLE" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl: $.data.id }
            - call: "GET /claims/${cl}"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
              captures: { cl_v1: $.data.version }
            - call: "POST /claims/${cl}/triage"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ce_1"
          trigger:
            - call: "POST /claims/${cl}/reserve-entries"
              payload: { expected_claim_version: "${cl_v1}", entry_type: "REVISION", delta_case_reserve: -999999.00, delta_paid: 0.00, memo: "stale version and impossible negative delta" }
              as: ClaimsExaminer
              as_user_id: "ce_1"
          assert:
            - "HTTP 412"
            - "error.code == ERR_STALE_CLAIM_VERSION"
            - "error.code != ERR_RESERVE_WOULD_GO_NEGATIVE"
            - "Claim.${cl}.case_reserve == 65250.00"
            - "GET /reserve-entries?claim_id=${cl} returns meta.total == 1 (only the INITIAL_CASE entry)"

      - name: corner_val_assignment_exact_adjacency_accepted_zero_buffer
