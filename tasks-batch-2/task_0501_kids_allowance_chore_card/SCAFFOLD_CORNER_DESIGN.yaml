              as: Parent
              as_user_id: "p-v11"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"
            - "HTTP status == 422"

      - name: insufficient_funding_on_chore_approve
        claim_type: Aggregate validation
        grounds:
          - validations[priority=22]
          - errors[ERR_INSUFFICIENT_FUNDING]
        distinguishing_aspect: "Approving a 1500 reward when funding is only 1000 → ERR_INSUFFICIENT_FUNDING (409); completion stays PENDING_REVIEW."
        test_recipe:
          setup:
            - "Family funded only 1000; child has a PENDING_REVIEW completion worth 1500."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "V12" }
              as: Parent
              as_user_id: "p-v12"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 1000 }
              as: Parent
              as_user_id: "p-v12"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Vi", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-v12"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Fold", reward_cents: 1500 }
              as: Parent
              as_user_id: "p-v12"
              captures: { chore_id: $.data.id }
            - call: "POST /chores/${chore_id}/submit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /chore-completions/${comp_id}/approve"
              payload: {}
              as: Parent
              as_user_id: "p-v12"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_FUNDING"
            - "ChoreCompletion.${comp_id}.status == PENDING_REVIEW"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: insufficient_card_funds_excluded
        claim_type: Conditional action
        grounds:
          - validations[priority=23]
          - errors[ERR_INSUFFICIENT_CARD_FUNDS]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / card_locked_beats_insufficient_funds
          rationale: "ERR_INSUFFICIENT_CARD_FUNDS is the lower-priority arm of the lock-vs-funds priority pair; the standalone insufficient-funds path on an UNLOCKED card is the same business check exercised there."

  # ===========================================================================
  - section: rbac
    instances:
      - name: child_cannot_approve_completion
        claim_type: peer_roles
        grounds:
          - roles.Child
          - roles.Parent
          - validations[priority=2]
        distinguishing_aspect: "Approve is a Parent exclusive_operation; a Child calling POST /chore-completions/{id}/approve → ERR_FORBIDDEN_ROLE (403); completion stays PENDING_REVIEW."
        test_recipe:
          setup:
            - "Family funded 10000; child has a PENDING_REVIEW completion worth 500."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "R1" }
              as: Parent
              as_user_id: "p-r1"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "p-r1"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Wa", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-r1"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/chores"
              payload: { title: "Pets", reward_cents: 500 }
              as: Parent
              as_user_id: "p-r1"
              captures: { chore_id: $.data.id }
            - call: "POST /chores/${chore_id}/submit"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { comp_id: $.data.id }
          trigger:
            - call: "POST /chore-completions/${comp_id}/approve"
              payload: {}
              as: Child
              as_user_id: "${child_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"
            - "ChoreCompletion.${comp_id}.status == PENDING_REVIEW"

      - name: child_cannot_unlock_card
        claim_type: peer_roles
        grounds:
          - roles.Child
          - roles.Parent
          - validations[priority=2]
        distinguishing_aspect: "lock is shared (Parent+Child) but unlock is Parent-exclusive; a Child calling POST /debit-cards/{id}/unlock → ERR_FORBIDDEN_ROLE (403); card stays LOCKED."
        test_recipe:
          setup:
            - "Child card is LOCKED."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "R2" }
              as: Parent
              as_user_id: "p-r2"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Xa", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-r2"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "p-r2"
              captures: { card_id: "$.data[0].id", card_v0: "$.data[0].version" }
            - call: "POST /debit-cards/${card_id}/lock"
              payload: { expected_debit_card_version: "${card_v0}" }
              as: Child
              as_user_id: "${child_id}"
              captures: { card_v1: $.data.version }
          trigger:
            - call: "POST /debit-cards/${card_id}/unlock"
              payload: { expected_debit_card_version: "${card_v1}" }
              as: Child
              as_user_id: "${child_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_ROLE"
            - "DebitCard.${card_id}.lock_state == LOCKED"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request with no recognized X-User-Role/X-User-ID on a protected read → ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "A family exists; the read is attempted without auth headers."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "R3" }
              as: Parent
              as_user_id: "p-r3"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "GET /families/${fam_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_lock_correct_version_succeeds_and_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lock-stale-card-version]
          - entities.DebitCard.fields.version
        distinguishing_aspect: "Lock with the current expected_debit_card_version succeeds, sets lock_state=LOCKED, and increments DebitCard.version by exactly 1."
        test_recipe:
          setup:
            - "A fresh UNLOCKED card at version V0."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "L1" }
              as: Parent
              as_user_id: "p-l1"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Ya", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-l1"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "p-l1"
              captures: { card_id: "$.data[0].id", card_v0: "$.data[0].version" }
          trigger:
            - call: "POST /debit-cards/${card_id}/lock"
              payload: { expected_debit_card_version: "${card_v0}" }
              as: Parent
              as_user_id: "p-l1"
              captures: { card_v1: $.data.version }
          assert:
            - "DebitCard.${card_id}.lock_state == LOCKED"
            - "DebitCard.${card_id}.version == ${card_v0} + 1"

      - name: occ_lock_stale_version_after_authorization_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[lock-stale-card-version]
          - state_machines.Transaction.none_to_PENDING
          - errors[ERR_STALE_CARD_VERSION]
        distinguishing_aspect: |
          After the client reads card version V0, an authorization advances the card's version; a lock still
          carrying expected_debit_card_version=${card_v0} (stale) is rejected ERR_STALE_CARD_VERSION (412) and
          the card stays UNLOCKED.
        test_recipe:
          setup:
            - "Card UNLOCKED at version V0; SPEND jar funded; one authorization placed which advanced the card version."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "L2" }
              as: Parent
              as_user_id: "p-l2"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 20000 }
              as: Parent
              as_user_id: "p-l2"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Za", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-l2"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "p-l2"
              captures: { card_id: "$.data[0].id", card_v0: "$.data[0].version" }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 5000 }
              as: Parent
              as_user_id: "p-l2"
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "M3", category: "FOOD", amount_cents: 1000 }
              as: Child
              as_user_id: "${child_id}"
          trigger:
            - call: "POST /debit-cards/${card_id}/lock"
              payload: { expected_debit_card_version: "${card_v0}" }
              as: Parent
              as_user_id: "p-l2"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_CARD_VERSION"
            - "HTTP status == 412"
            - "DebitCard.${card_id}.lock_state == UNLOCKED"

      - name: occ_control_create_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[control-create-stale-card-version]
          - errors[ERR_STALE_CARD_VERSION]
        distinguishing_aspect: |
          Creating a CardControl with a stale expected_debit_card_version (the value read before an
          authorization advanced the card) is rejected ERR_STALE_CARD_VERSION (412); no control is created.
        test_recipe:
          setup:
            - "Card UNLOCKED at version V0; SPEND jar funded; one authorization placed advancing the version."
          setup_api_calls:
            - call: "POST /families"
              payload: { family_name: "L3" }
              as: Parent
              as_user_id: "p-l3"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 20000 }
              as: Parent
              as_user_id: "p-l3"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Ab", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-l3"
              captures: { child_id: $.data.id }
            - call: "GET /child-accounts/${child_id}/debit-cards"
              payload: {}
              as: Parent
              as_user_id: "p-l3"
              captures: { card_id: "$.data[0].id", card_v0: "$.data[0].version" }
            - call: "POST /child-accounts/${child_id}/fund-jar"
              payload: { jar_type: "SPEND", amount_cents: 5000 }
              as: Parent
              as_user_id: "p-l3"
            - call: "POST /debit-cards/${card_id}/authorizations"
              payload: { merchant_id: "M4", category: "FOOD", amount_cents: 1000 }
              as: Child
              as_user_id: "${child_id}"
          trigger:
            - call: "POST /debit-cards/${card_id}/controls"
              payload: { control_kind: "CATEGORY", match_value: "GAMING", rule: "BLOCK", expected_debit_card_version: "${card_v0}" }
              as: Parent
              as_user_id: "p-l3"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_CARD_VERSION"
            - "HTTP status == 412"
            - "GET /debit-cards/${card_id}/controls returns 0 rows"

      - name: scheduled_allowance_not_due_yet_skipped
        claim_type: scheduled_actions
        grounds:
          - state_machines.AllowanceSchedule.ACTIVE_to_ACTIVE
          - entities.AllowanceSchedule.fields.next_run_at
        distinguishing_aspect: |
          A schedule whose next_run_at (2026-04-01) is after clock_now (2026-03-15) is not due: the sweep
          creates no AllowanceRun and funding is unchanged.
        test_recipe:
          setup:
            - "Family funded 10000; child schedule next_run_at 2026-04-01; clock at 2026-03-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /families"
              payload: { family_name: "L4" }
              as: Parent
              as_user_id: "p-l4"
              captures: { fam_id: $.data.id }
            - call: "POST /families/${fam_id}/deposit"
              payload: { amount_cents: 10000 }
              as: Parent
              as_user_id: "p-l4"
            - call: "POST /families/${fam_id}/child-accounts"
              payload: { display_name: "Bc", birthdate: "2015-01-01" }
              as: Parent
              as_user_id: "p-l4"
              captures: { child_id: $.data.id }
            - call: "POST /child-accounts/${child_id}/allowance-schedules"
              payload: { amount_cents: 2500, payout_jar_type: "SPEND", cadence_days: 30, next_run_at: "2026-04-01T00:00:00Z" }
              as: Parent
              as_user_id: "p-l4"
              captures: { sched_id: $.data.id }
          trigger:
            - call: "POST /_scheduler/run-due-allowances"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Family.${fam_id}.funding_balance_cents == 10000"
            - "GET /allowance-schedules/${sched_id}/runs returns 0 rows"

      - name: chore_approve_cascade_excluded
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ChoreCompletion.PENDING_REVIEW_to_PAID
        excluded_because:
          difficulty_instance: transitive_cascade / chore_approve_cascade_funding_jar_card_depth3
          rationale: "The end-to-end funding->jar->card cascade is the named depth-3 §1.8 transitive_cascade instance."
