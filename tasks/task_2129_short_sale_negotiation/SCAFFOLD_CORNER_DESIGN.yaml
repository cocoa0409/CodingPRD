# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2129_short_sale_negotiation
#
# Breadth probe over every testable claim §1.1-§1.7 declares that §1.8 does
# not already cover. Sections and claim_type values come from
# references/claim-extraction-guide.md. Corners already exercised by a §1.8
# instance are emitted as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:
- section: entities
  instances:
  - name: create_case_returns_declared_defaults_and_version_one
    claim_type: creation
    grounds:
    - entities.ShortSaleCase
    - endpoints[POST /short-sale/cases]
    distinguishing_aspect: A case created with the four input fields comes back 201 with negotiation_status INTAKE, documentation_status DOC_PENDING, version 1, every derived counter at its declared default, and
      both null-valued value fields null.
    test_recipe:
      setup:
      - Empty database; logical clock at its 2026-08-01T00:00:00Z startup default.
      setup_api_calls: []
      trigger:
      - call: POST /short-sale/cases
        payload:
          property_address: 1 Aspen Row, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      assert:
      - HTTP status == 201
      - ShortSaleCase.${case_id}.negotiation_status == INTAKE
      - ShortSaleCase.${case_id}.documentation_status == DOC_PENDING
      - ShortSaleCase.${case_id}.version == 1
      - ShortSaleCase.${case_id}.junior_contribution_total_cents == 0
      - ShortSaleCase.${case_id}.junior_lien_count == 0
      - ShortSaleCase.${case_id}.failed_offer_count == 0
      - ShortSaleCase.${case_id}.price_reduction_required == false
      - ShortSaleCase.${case_id}.deficiency_waiver_permitted == true
      - ShortSaleCase.${case_id}.final_value_cents == null
      - ShortSaleCase.${case_id}.minimum_acceptable_net_cents == null
      - ShortSaleCase.${case_id}.assigned_negotiator_user_id == neg-001
      - data.id is a bare UUID with no type prefix
  - name: create_case_missing_required_field_returns_invalid_request
    claim_type: required_fields
    grounds:
    - validations[priority=34]
    - errors[ERR_INVALID_REQUEST]
    distinguishing_aspect: servicer_name has source input and no default, so omitting it is refused with ERR_INVALID_REQUEST (400) and no ShortSaleCase row is created.
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /short-sale/cases
        payload:
          property_address: 2 Birch Way, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
        as: Negotiator
        as_user_id: neg-001
        captures:
          err: $.data.error_id
      assert:
      - HTTP status == 400
      - response data.error_id == ERR_INVALID_REQUEST
      - GET /short-sale/cases returns total_count == 0
  - name: create_case_invalid_enum_rejected
    claim_type: type_constraints
    grounds:
    - entities.ShortSaleCase.fields.investor_type
    - validations[priority=34]
    distinguishing_aspect: investor_type accepts only GSE, PORTFOLIO or FHA; the value PRIVATE is refused with ERR_INVALID_REQUEST (400).
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /short-sale/cases
        payload:
          property_address: 3 Cedar Ct, Reno NV
          investor_type: PRIVATE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          err: $.data.error_id
      assert:
      - HTTP status == 400
      - response data.error_id == ERR_INVALID_REQUEST
      - GET /short-sale/cases returns total_count == 0
  - name: create_case_system_field_input_ignored
    claim_type: system_fields
    grounds:
    - entities.ShortSaleCase.fields.negotiation_status
    - entities.ShortSaleCase.fields.version
    distinguishing_aspect: 'negotiation_status and version have source system, so client-supplied values are ignored: the created case is still INTAKE at version 1 rather than CLOSED at version 9.'
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /short-sale/cases
        payload:
          property_address: 4 Dogwood Dr, Reno NV
          investor_type: FHA
          unpaid_principal_balance_cents: 19900000
          servicer_name: Cascade Servicing
          negotiation_status: CLOSED
          version: 9
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      assert:
      - HTTP status == 201
      - ShortSaleCase.${case_id}.negotiation_status == INTAKE
      - ShortSaleCase.${case_id}.version == 1
      - ShortSaleCase.${case_id}.deficiency_waiver_permitted == true
  - name: get_case_by_id_returns_stored_entity
    claim_type: retrieval
    grounds:
    - endpoints[GET /short-sale/cases/{id}]
    distinguishing_aspect: GET /short-sale/cases/{id} returns exactly the row written by the create call, with response_type object and the meta envelope present.
    test_recipe:
      setup:
      - One GSE ShortSaleCase created at unpaid_principal_balance_cents 26800000.
      setup_api_calls:
      - call: POST /short-sale/cases
        payload:
          property_address: 5 Elder Ln, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      trigger:
      - call: GET /short-sale/cases/${case_id}
        payload: {}
        as: Negotiator
        as_user_id: neg-001
        captures:
          read_upb: $.data.unpaid_principal_balance_cents
      assert:
      - HTTP status == 200
      - response_type == object
      - meta.api_request_id and meta.api_request_timestamp are present
      - ShortSaleCase.${case_id}.unpaid_principal_balance_cents == 26800000
      - ShortSaleCase.${case_id}.servicer_name == Cascade Servicing
  - name: list_cases_pagination_envelope_and_filter
    claim_type: listing
    grounds:
    - endpoints[GET /short-sale/cases]
    - response_envelope.pagination_fields
    distinguishing_aspect: GET /short-sale/cases with limit 2 and offset 0 over three cases returns exactly 2 rows, total_count 3 and has_more true; filtering on negotiation_status INTAKE keeps all three.
    test_recipe:
      setup:
      - Three ShortSaleCases, all in negotiation_status INTAKE.
      setup_api_calls:
      - call: POST /short-sale/cases
        payload:
          property_address: 6 Fir Pl, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      - call: POST /short-sale/cases
        payload:
          property_address: 7 Gum St, Reno NV
          investor_type: PORTFOLIO
          unpaid_principal_balance_cents: 31000000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_b: $.data.id
      - call: POST /short-sale/cases
        payload:
          property_address: 8 Hazel Ave, Reno NV
          investor_type: FHA
          unpaid_principal_balance_cents: 19900000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_c: $.data.id
      trigger:
      - call: GET /short-sale/cases
        payload:
          limit: 2
          offset: 0
        as: Negotiator
        as_user_id: neg-001
        captures:
          first_id: $.data[0].id
      assert:
      - HTTP status == 200
      - response_type == array
      - exactly 2 elements returned
      - total_count == 3
      - has_more == true
      - limit == 2 and offset == 0 echoed
      - GET /short-sale/cases with negotiation_status=INTAKE returns total_count == 3
  - name: bpo_vendor_is_immutable_configuration_row
    claim_type: immutability
    grounds:
    - entities.BpoVendor
    - endpoints[POST /short-sale/bpo-vendors]
    distinguishing_aspect: 'BpoVendor is declared common_fields: false, so the created row carries id and created_at but no updated_at or version, and §1.5 declares no update or delete endpoint for it.'
    test_recipe:
      setup:
      - Empty database.
      setup_api_calls: []
      trigger:
      - call: POST /short-sale/bpo-vendors
        payload:
          vendor_name: Sierra Valuation Partners
          license_state: NV
          daily_inspection_capacity: 2
        as: PlatformAdmin
        as_user_id: adm-900
        captures:
          vendor_id: $.data.id
      assert:
      - HTTP status == 201
      - BpoVendor.${vendor_id}.vendor_name == Sierra Valuation Partners
      - BpoVendor.${vendor_id}.daily_inspection_capacity == 2
      - the response carries id and created_at
      - the response carries neither updated_at nor version
  - name: computed_deficiency_waiver_permitted_false_for_portfolio
    claim_type: computed_fields
    grounds:
    - entities.ShortSaleCase.fields.deficiency_waiver_permitted
    distinguishing_aspect: deficiency_waiver_permitted is computed as investor_type IN {GSE, FHA}, so a PORTFOLIO case reads false while a GSE case reads true, and a client-supplied value is ignored.
    test_recipe:
      setup:
      - 'Two ShortSaleCases: one PORTFOLIO and one GSE.'
      setup_api_calls:
      - call: POST /short-sale/cases
        payload:
          property_address: 9 Ironwood Rd, Reno NV
          investor_type: PORTFOLIO
          unpaid_principal_balance_cents: 42000000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      trigger:
      - call: POST /short-sale/cases
        payload:
          property_address: 10 Juniper Way, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_gse: $.data.id
      assert:
      - ShortSaleCase.${case_id}.deficiency_waiver_permitted == false
      - ShortSaleCase.${case_gse}.deficiency_waiver_permitted == true
  - name: offer_default_round_index_is_one
    claim_type: defaults
    grounds:
    - entities.Offer.fields.round_index
    - entities.Offer.fields.status
    distinguishing_aspect: A newly created Offer defaults to round_index 1, status DRAFT, servicer_counter_price_cents null and submitted_at null.
    test_recipe:
      setup:
      - One GSE ShortSaleCase with a Listing.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T00:00:00Z'
        as: PlatformAdmin
        as_user_id: adm-900
      - call: POST /short-sale/cases
        payload:
          property_address: 11 Larch Ct, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      - call: POST /short-sale/cases/${case_id}/listings
        payload:
          list_price_cents: 25900000
          commission_pct: 0.06
          listed_at: '2026-08-05T00:00:00Z'
        as: ListingAgent
        as_user_id: la-200
        captures:
          listing_id: $.data.id
      trigger:
      - call: POST /short-sale/cases/${case_id}/offers
        payload:
          buyer_name: R. Alvarez
          buyer_financing: CASH
          offer_price_cents: 24500041
          earnest_money_cents: 500000
          requested_closing_days: 45
        as: ListingAgent
        as_user_id: la-200
        captures:
          offer_id: $.data.id
      assert:
      - HTTP status == 201
      - Offer.${offer_id}.round_index == 1
      - Offer.${offer_id}.status == DRAFT
      - Offer.${offer_id}.servicer_counter_price_cents == null
      - Offer.${offer_id}.submitted_at == null
  - name: hardship_package_document_counters_are_computed
    claim_type: computed_fields
    grounds:
    - entities.HardshipPackage.fields.verified_document_count
    excluded_because:
      difficulty_instance: compensating_invariant / package_document_counter_partition_restored_by_revoke
      rationale: The four package counters are asserted directly, before and after a VERIFY/REVOKE pair, by the named §1.8 instance.
- section: state_machines
  instances:
  - name: submit_offer_twice_second_returns_offer_not_actionable
    claim_type: invalid_transition
    grounds:
    - state_machines.Offer.DRAFT_to_SUBMITTED
    - errors[ERR_OFFER_NOT_ACTIONABLE]
    - validations[priority=40]
    distinguishing_aspect: SUBMITTED is not a declared `from:` state for the submit trigger, so a second submit is refused with ERR_OFFER_NOT_ACTIONABLE (409), leaves round_index at 1 and does not restamp submitted_at.
    test_recipe:
      setup:
      - One GSE case with an ACCEPTED package, a Listing since 2026-08-05, and one Offer already in SUBMITTED at clock 2026-08-24.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-05T00:00:00Z'
        as: PlatformAdmin
        as_user_id: adm-900
      - call: POST /short-sale/cases
        payload:
          property_address: 12 Maple Bnd, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      - call: POST /short-sale/cases/${case_id}/hardship-packages
        payload:
          hardship_reason: JOB_LOSS
          monthly_income_cents: 380000
          monthly_expenses_cents: 512000
          liquid_assets_cents: 640000
        as: Negotiator
        as_user_id: neg-001
        captures:
          pkg_id: $.data.id
      - call: POST /short-sale/hardship-packages/${pkg_id}/documents
        payload:
          doc_type: HARDSHIP_LETTER
          issued_on: '2026-07-20T00:00:00Z'
          reference_label: HL-1
        as: Negotiator
        as_user_id: neg-001
        captures:
          doc_hl: $.data.id
      - call: POST /short-sale/hardship-packages/${pkg_id}/documents
        payload:
          doc_type: FINANCIAL_WORKSHEET
          issued_on: '2026-07-20T00:00:00Z'
          reference_label: FW-1
        as: Negotiator
        as_user_id: neg-001
        captures:
          doc_fw: $.data.id
      - call: POST /short-sale/hardship-packages/${pkg_id}/documents
        payload:
          doc_type: BANK_STATEMENT
          issued_on: '2026-07-20T00:00:00Z'
          reference_label: BS-1
        as: Negotiator
        as_user_id: neg-001
        captures:
          doc_bs: $.data.id
      - call: POST /short-sale/hardship-packages/${pkg_id}/documents
        payload:
          doc_type: AUTHORIZATION_FORM
          issued_on: '2026-07-20T00:00:00Z'
          reference_label: AF-1
        as: Negotiator
        as_user_id: neg-001
        captures:
          doc_af: $.data.id
      - call: POST /short-sale/documents/${doc_hl}/review
        payload:
          outcome: VERIFY
        as: ServicerAnalyst
        as_user_id: sa-100
      - call: POST /short-sale/documents/${doc_fw}/review
        payload:
          outcome: VERIFY
        as: ServicerAnalyst
        as_user_id: sa-100
      - call: POST /short-sale/documents/${doc_bs}/review
        payload:
          outcome: VERIFY
        as: ServicerAnalyst
        as_user_id: sa-100
      - call: POST /short-sale/documents/${doc_af}/review
        payload:
          outcome: VERIFY
        as: ServicerAnalyst
        as_user_id: sa-100
      - call: POST /short-sale/hardship-packages/${pkg_id}/submit
        payload: {}
        as: Negotiator
        as_user_id: neg-001
      - call: POST /short-sale/hardship-packages/${pkg_id}/decision
        payload:
          outcome: ACCEPT
        as: ServicerAnalyst
        as_user_id: sa-100
      - call: POST /short-sale/cases/${case_id}/listings
        payload:
          list_price_cents: 25900000
          commission_pct: 0.06
          listed_at: '2026-08-05T00:00:00Z'
        as: ListingAgent
        as_user_id: la-200
        captures:
          listing_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-24T00:00:00Z'
        as: PlatformAdmin
        as_user_id: adm-900
      - call: POST /short-sale/cases/${case_id}/offers
        payload:
          buyer_name: R. Alvarez
          buyer_financing: CASH
          offer_price_cents: 24500041
          earnest_money_cents: 500000
          requested_closing_days: 45
        as: ListingAgent
        as_user_id: la-200
        captures:
          offer_id: $.data.id
      - call: POST /short-sale/offers/${offer_id}/submit
        payload: {}
        as: Negotiator
        as_user_id: neg-001
      trigger:
      - call: POST /short-sale/offers/${offer_id}/submit
        payload: {}
        as: Negotiator
        as_user_id: neg-001
        captures:
          err: $.data.error_id
      assert:
      - HTTP status == 409
      - response data.error_id == ERR_OFFER_NOT_ACTIONABLE
      - Offer.${offer_id}.status == SUBMITTED
      - Offer.${offer_id}.round_index == 1
      - Offer.${offer_id}.submitted_at == 2026-08-24T00:00:00.000Z
  - name: adjudicate_dispute_twice_second_returns_dispute_not_open
    claim_type: idempotency
    grounds:
    - state_machines.ValuationDispute.OPEN_to_PARTIAL
    - errors[ERR_DISPUTE_NOT_OPEN]
    distinguishing_aspect: 'ValuationDispute terminal states accept no further adjudication: a second adjudicate on a PARTIAL dispute is refused with ERR_DISPUTE_NOT_OPEN (409) and does not move the valuation''s
      value a second time.'
    test_recipe:
      setup:
      - One GSE case with a RECEIVED Valuation at 25200000 ordered by sa-100 and one dispute already adjudicated PARTIAL by sa-101.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-06T00:00:00Z'
        as: PlatformAdmin
        as_user_id: adm-900
      - call: POST /short-sale/bpo-vendors
        payload:
          vendor_name: Sierra Valuation Partners
          license_state: NV
          daily_inspection_capacity: 2
        as: PlatformAdmin
        as_user_id: adm-900
        captures:
          vendor_id: $.data.id
      - call: POST /short-sale/cases
        payload:
          property_address: 13 Nutmeg Ln, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      - call: POST /short-sale/cases/${case_id}/valuations
        payload:
          vendor_id: ${vendor_id}
          valuation_type: BPO_EXTERIOR
          effective_date: '2026-08-06T00:00:00Z'
          inspection_start: '2026-08-06T09:00:00Z'
          inspection_end: '2026-08-06T10:00:00Z'
        as: ServicerAnalyst
        as_user_id: sa-100
        captures:
          val_id: $.data.id
      - call: POST /short-sale/valuations/${val_id}/record-value
        payload:
          value_cents: 25200000
        as: BpoVendor
        as_user_id: ${vendor_id}
      - call: POST /short-sale/valuations/${val_id}/disputes
        payload:
          claimed_value_cents: 27000000
          comparable_count: 4
          rationale: Closed comps above the BPO
        as: ServicerAnalyst
        as_user_id: sa-101
        captures:
          dispute_id: $.data.id
      - call: POST /short-sale/disputes/${dispute_id}/adjudicate
        payload:
          resolution: PARTIAL
        as: ServicerAnalyst
        as_user_id: sa-101
      trigger:
      - call: POST /short-sale/disputes/${dispute_id}/adjudicate
        payload:
          resolution: SUSTAINED
        as: ServicerAnalyst
        as_user_id: sa-101
        captures:
          err: $.data.error_id
      assert:
      - HTTP status == 409
      - response data.error_id == ERR_DISPUTE_NOT_OPEN
      - ValuationDispute.${dispute_id}.status == PARTIAL
      - ValuationDispute.${dispute_id}.resolved_value_cents == 26100000
      - Valuation.${val_id}.value_cents == 26100000
  - name: record_value_twice_second_returns_valuation_not_actionable
    claim_type: invalid_transition
    grounds:
    - state_machines.Valuation.ORDERED_to_RECEIVED
    - errors[ERR_VALUATION_NOT_ACTIONABLE]
    distinguishing_aspect: record-value is declared only from ORDERED, so a second recording against a RECEIVED valuation is refused with ERR_VALUATION_NOT_ACTIONABLE (409) and value_cents stays 25200000.
    test_recipe:
      setup:
      - One GSE case with one Valuation already RECEIVED at 25200000.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-06T00:00:00Z'
        as: PlatformAdmin
        as_user_id: adm-900
      - call: POST /short-sale/bpo-vendors
        payload:
          vendor_name: Sierra Valuation Partners
          license_state: NV
          daily_inspection_capacity: 2
        as: PlatformAdmin
        as_user_id: adm-900
        captures:
          vendor_id: $.data.id
      - call: POST /short-sale/cases
        payload:
          property_address: 14 Olive Ct, Reno NV
          investor_type: GSE
          unpaid_principal_balance_cents: 26800000
          servicer_name: Cascade Servicing
        as: Negotiator
        as_user_id: neg-001
        captures:
          case_id: $.data.id
      - call: POST /short-sale/cases/${case_id}/valuations
        payload:
          vendor_id: ${vendor_id}
          valuation_type: BPO_EXTERIOR
          effective_date: '2026-08-06T00:00:00Z'
          inspection_start: '2026-08-06T09:00:00Z'
          inspection_end: '2026-08-06T10:00:00Z'
        as: ServicerAnalyst
        as_user_id: sa-100
        captures:
          val_id: $.data.id
      - call: POST /short-sale/valuations/${val_id}/record-value
        payload:
          value_cents: 25200000
        as: BpoVendor
        as_user_id: ${vendor_id}
      trigger:
      - call: POST /short-sale/valuations/${val_id}/record-value
        payload:
          value_cents: 23000000
        as: BpoVendor
        as_user_id: ${vendor_id}
        captures:
          err: $.data.error_id
      assert:
      - HTTP status == 409
      - response data.error_id == ERR_VALUATION_NOT_ACTIONABLE
      - Valuation.${val_id}.value_cents == 25200000
      - Valuation.${val_id}.status == RECEIVED
      - ShortSaleCase.${case_id}.final_value_cents == 25200000
  - name: denied_dispute_locks_valuation_against_a_new_dispute
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Valuation.DISPUTED_to_FINAL
    - errors[ERR_VALUATION_NOT_ACTIONABLE]
    distinguishing_aspect: FINAL is the Valuation machine's only terminal state and no dispute transition is declared from it, so a fresh dispute against a DENIED-locked valuation is refused with ERR_VALUATION_NOT_ACTIONABLE
      (409).
    test_recipe:
      setup:
      - One GSE case with a Valuation driven to FINAL by a DENIED dispute.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-06T00:00:00Z'
        as: PlatformAdmin
        as_user_id: adm-900
      - call: POST /short-sale/bpo-vendors
        payload:
          vendor_name: Sierra Valuation Partners
          license_state: NV
          daily_inspection_capacity: 2
        as: PlatformAdmin
        as_user_id: adm-900
        captures:
          vendor_id: $.data.id
      - call: POST /short-sale/cases
