# =============================================================================
# §1.6 — Error Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS,               http: 403, condition: "Role not in endpoint's roles: list" }
  - { id: ERR_FORBIDDEN,                              http: 403, condition: "Ownership check failed (acting user != resource's owner)" }
  - { id: ERR_NOT_FOUND,                              http: 404, condition: "Path or body FK id does not resolve" }
  - { id: ERR_INVALID_STATE,                          http: 409, condition: "Resource not in a valid from-state for the requested transition" }
  - { id: ERR_CAMPAIGN_NOT_READY,                     http: 409, condition: "Campaign posture does not permit this action" }
  - { id: ERR_CAMPAIGN_ALREADY_CLOSED,                http: 409, condition: "closes_at already passed at launch" }
  - { id: ERR_CAMPAIGN_NOT_CLOSED,                    http: 409, condition: "Action requires CLOSED_SUCCESS but campaign is earlier" }
  - { id: ERR_STALE_CAMPAIGN_VERSION,                 http: 412, condition: "expected_campaign_version does not match current campaign.version" }
  - { id: ERR_LEVEL_CAPACITY_EXCEEDED,                http: 409, condition: "Charging would exceed level's quantity_cap (>= boundary)" }
  - { id: ERR_NO_PLEDGE_LEVEL,                        http: 409, condition: "Launch requires at least one OPEN pledge level" }
  - { id: ERR_CHARGED_PLEDGES_EXIST,                  http: 409, condition: "Unlaunch requires zero CHARGED pledges" }
  - { id: ERR_ADDRESS_LOCKED,                         http: 409, condition: "Address is LOCKED on at least one assigned wave" }
  - { id: ERR_ALREADY_SHIPPED,                        http: 409, condition: "Refund rejected — pledge already SHIPPED or DELIVERED" }
  - { id: ERR_NO_FINAL_QUOTE,                         http: 409, condition: "start-production requires at least one FINAL quote" }
  - { id: ERR_NO_LOCKED_RUN,                          http: 409, condition: "start-production requires at least one LOCKED run" }
  - { id: ERR_QUOTE_ALREADY_FINAL,                    http: 409, condition: "Another quote on this campaign is already FINAL" }
  - { id: ERR_QUOTE_NOT_FINAL,                        http: 409, condition: "Run lock requires the referenced quote to be FINAL" }
  - { id: ERR_MOQ_NOT_MET,                            http: 422, condition: "Units below tier_breaks[0].min_units (MOQ)" }
  - { id: ERR_FREIGHT_WINDOW_OVERLAP,                 http: 409, condition: "Freight window overlaps another active shipment on the same run (half-open)" }
  - { id: ERR_FREIGHT_NOT_IN_WINDOW,                  http: 409, condition: "Logical clock outside the shipment window for depart/arrive" }
  - { id: ERR_FREIGHT_NOT_CLEARED,                    http: 409, condition: "Wave open / pledge ship requires all regional shipments on this campaign to be CLEARED or DELIVERED" }
  - { id: ERR_WAVE_CAPACITY_FULL,                     http: 409, condition: "wave.capacity_used >= wave.capacity at assignment (>= boundary)" }
  - { id: ERR_WAVE_OUT_OF_SEQUENCE,                   http: 409, condition: "Another wave with lower sequence_index is not yet DISPATCHED/CANCELLED" }
  - { id: ERR_WAVE_NOT_EMPTY,                         http: 409, condition: "Rebalance or cancel requires capacity_used == 0" }
  - { id: ERR_PLEDGE_NOT_DELIVERED,                   http: 409, condition: "ReplacementRequest requires pledge.fulfillment_status == DELIVERED" }
  - { id: ERR_INSUFFICIENT_SPARES,                    http: 422, condition: "Available spares in region < request.quantity" }
  - { id: ERR_ALLOCATION_EXCEEDS_POOL,                http: 422, condition: "units_reserved exceeds allocatable_pool (or pool is zero)" }
  - { id: ERR_RETAIL_RELEASE_TOO_EARLY,               http: 409, condition: "Cannot ship distributor allocation before campaign.retail_release_at" }
  - { id: ERR_PRINT_WINDOW_OVERLAP,                   http: 409, condition: "Localization print window overlaps an active freight sailing window (half-open)" }
  - { id: ERR_PRINT_WINDOW_NOT_OPEN,                  http: 409, condition: "mark-printed outside [print_window_start, print_window_end)" }
  - { id: ERR_INVENTORY_RISK_TOO_HIGH,                http: 422, condition: "inventory_risk_score >= 70 at approve" }
  - { id: ERR_INVALID_REQUEST,                        http: 400, condition: "Required field missing or malformed" }
  - { id: ERR_INVALID_ENUM,                           http: 400, condition: "Enum value outside declared set" }
  - { id: ERR_UNKNOWN_ACTION,                         http: 400, condition: "transition action not in the endpoint's allowed set" }

# =============================================================================
# §1.7 — RBAC
# =============================================================================
roles:
  - name: CampaignOwner
    description: "Owns the campaign; manages embedded levels/goals/add-ons via campaign update, charges, refunds, production start, replacement approvals, reprints"
    identity: opaque
    exclusive_operations:
      - "POST /campaigns/{id}/transition"
      - "POST /pledges/{id}/transition (actions charge, charge-retry, refund)"
      - "POST /replacement-requests/{id}/transition (actions approve, reopen, reject)"
      - "POST /reprint-decisions (and its transition actions approve, reject)"
    shared_operations:
      - "POST /campaigns (with owner_user_id == X-User-ID)"
      - "GET on all resources"

  - name: Backer
    description: "Pledger; manages own pledge address and files replacement requests"
    identity: opaque
    exclusive_operations:
      - "POST /pledges/{id}/transition (actions confirm-address, change-address — ownership: X-User-ID == pledge.backer_user_id)"
      - "POST /replacement-requests (ownership: X-User-ID == pledge.backer_user_id)"
    shared_operations:
      - "POST /pledges (X-User-ID == backer_user_id in body)"
      - "GET on all resources"

  - name: FactoryCoordinator
    description: "Interfaces with manufacturers; owns quotes, production runs, reprint locks"
    identity: opaque
    exclusive_operations:
      - "POST /manufacturing-quotes and /manufacturing-quotes/{id}/transition"
      - "POST /production-runs and /production-runs/{id}/transition"
      - "POST /reprint-decisions/{id}/transition action=lock"
    shared_operations:
      - "GET on all resources"

  - name: FreightBroker
    description: "Books and manages ocean freight"
    identity: opaque
    exclusive_operations:
      - "POST /freight-shipments"
      - "POST /freight-shipments/{id}/transition (actions depart, arrive, rebook)"
    shared_operations:
      - "GET on all resources"

  - name: CustomsAgent
    description: "Assesses and pays customs duties"
    identity: opaque
    exclusive_operations:
      - "POST /freight-shipments/{id}/transition (actions assess-duty, pay-duty)"
    shared_operations:
      - "GET on all resources"

  - name: FulfillmentOperator
    description: "Runs regional warehouses; manages waves, assignments, picks/ships/delivers, distributor ship, replacement ship, freight warehouse delivery"
    identity: opaque
    exclusive_operations:
      - "POST /waves and /waves/{id}/transition (all actions)"
      - "POST /freight-shipments/{id}/transition action=deliver-to-warehouse"
      - "POST /distributor-allocations/{id}/transition action=ship"
      - "POST /replacement-requests/{id}/transition action=ship"
    shared_operations:
      - "GET on all resources"

  - name: Distributor
    description: "Retail channel partner; confirms and releases allocations"
    identity: opaque
    exclusive_operations:
      - "POST /distributor-allocations/{id}/transition (actions confirm, release — ownership: X-User-ID == allocation.distributor_user_id)"
    shared_operations:
      - "GET on all resources"

  - name: LocalizationPartner
    description: "Translated-edition partner"
    identity: opaque
    exclusive_operations:
      - "POST /localization-agreements/{id}/transition"
    shared_operations:
      - "POST /localization-agreements"
      - "GET on all resources"

  - name: PlatformAdmin
    description: "System operator; drives the logical clock, allocates to distributors, admin overrides"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /distributor-allocations"
    shared_operations:
      - "POST /campaigns"
      - "POST /pledges (admin override)"
      - "POST /pledges/{id}/transition (admin override for charge, charge-retry, refund)"
      - "POST /localization-agreements"
      - "GET on all resources"
