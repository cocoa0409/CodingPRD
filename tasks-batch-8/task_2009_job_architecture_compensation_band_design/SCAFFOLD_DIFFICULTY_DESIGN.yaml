  - rule_id: resource_temporal_overlap
    instances:
      - name: refresh_window_half_open_adjacency
        grounds:
          - validations[priority=11]
          - errors[ERR_REFRESH_WINDOW_CONFLICT]
          - entities.RefreshCycle.fields.planned_window_start
        distinguishing_aspect: |
          Half-open interval semantics on RefreshCycle: a cycle starting
          exactly at the existing cycle's window end is ADJACENT and legal
          ([start,end) touch), while a start one day earlier overlaps and is
          rejected — geometric adjacency treatment, distinct from the
          aggregate-capacity semantics of the exception rolling cap.
        test_recipe:
          setup: ["ENG P1 band PUBLISHED; program PUBLISHED (no in-flight mappings); no refresh cycles yet"]
          setup_api_calls:
            - { call: "POST /comp/job-families", payload: { code: "ENG", name: "Engineering" }, as: CompAdmin, captures: { fam: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P1", title: "Engineer I", rank_order: 1 }, as: CompAdmin, captures: { lv1: $.data.id } }
            - { call: "POST /comp/job-levels", payload: { level_code: "P2", title: "Engineer II", rank_order: 2 }, as: CompAdmin }
            - { call: "POST /comp/geo-zones", payload: { zone_code: "US-NAT", name: "US National", differential_ratio: 1.000000 }, as: CompAdmin, captures: { nat: $.data.id } }
            - { call: "POST /comp/job-profiles", payload: { job_family_id: "${fam}", job_level_id: "${lv1}", title: "SWE I", summary: "s", salary_basis_weekly_cents: 200000, duties_test_passed: true }, as: CompAnalyst, captures: { prof1: $.data.id } }
