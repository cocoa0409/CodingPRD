            - { call: "POST /v1/shipment-orders/${ord_id}/allocate", payload: { expected_shipment_order_version: "${ord_v}" }, as: WarehouseLead, captures: { o_pre: $.data.status, alloc_pre: $.data.allocated_units } }
          trigger:
