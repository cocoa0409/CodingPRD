        test_recipe:
          setup:
            - "Garage G; TRANSIENT zone Z, RatePlan RP (hourly 500, daily_cap 4000, grace 15)."
            - "A TRANSIENT session enters 2026-06-01T10:00Z and exits 20:00Z (600 min)."
          setup_api_calls:
            - call: "POST /parking/garages"
              payload: { name: "G" }
              as: FacilityAdmin
              captures: { g_id: $.data.id }
            - call: "POST /parking/rate-plans"
              payload: { name: "RP", hourly_cents: 500, daily_cap_cents: 4000, monthly_permit_cents: 9000, grace_minutes: 15 }
              as: FacilityAdmin
              captures: { rp_id: $.data.id }
            - call: "POST /parking/zones"
              payload: { garage_id: "${g_id}", code: "Z", zone_type: "TRANSIENT", permit_capacity: 0, rate_plan_id: "${rp_id}" }
              as: FacilityAdmin
              captures: { z_id: $.data.id }
            - call: "POST /parking/spaces"
              payload: { zone_id: "${z_id}", label: "S1" }
              as: FacilityAdmin
              captures: { s1_id: $.data.id }
            - call: "POST /parking/_clock/set_current_utc"
