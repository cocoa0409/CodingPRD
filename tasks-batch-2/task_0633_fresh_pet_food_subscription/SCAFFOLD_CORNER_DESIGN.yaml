# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Fresh Pet-Food Subscription — breadth probe over §1.1-§1.7.
# Same seven-point per-instance contract + §1.5 reachability gates as §1.8.
# excluded_because stubs cite §1.8 instances by name.
# Reused fixtures: MAIN pet DOG 20kg -> dct 794; recipe P80 kcal2 price80 regions[US].
# Default clock 2026-01-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_pet_all_required_fields_returns_201_and_computed
        claim_type: Creation
        grounds:
          - entities.Pet.fields.daily_calorie_target
          - entities.Pet.fields.status
        distinguishing_aspect: "POST /api/pets with all required fields -> 201, status ACTIVE, daily_calorie_target computed, id/created_at minted."
        test_recipe:
          setup: ["A registered account"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "ent-1@x.com", full_name: "E1", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0, activity_level: "MODERATE", neutered: true, body_condition_goal: "MAINTAIN" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
          assert:
            - "response status == 201"
            - "Pet.${pet}.status == ACTIVE"
            - "Pet.${pet}.daily_calorie_target == 794"

      - name: get_pet_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_PET_NOT_FOUND]
        distinguishing_aspect: "GET /api/pets/{id} with a non-existent UUID -> ERR_PET_NOT_FOUND 404."
        test_recipe:
          setup: ["empty DB except one account"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "ent-2@x.com", full_name: "E2", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
          trigger:
            - call: "GET /api/pets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404 and error_id == ERR_PET_NOT_FOUND"

      - name: create_pet_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - entities.Pet.fields.species
        distinguishing_aspect: "POST /api/pets omitting required species -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A registered account"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "ent-3@x.com", full_name: "E3", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: pet_defaults_applied_when_omitted
        claim_type: Defaults
        grounds:
          - entities.Pet.fields.activity_level
          - entities.Pet.fields.neutered
          - entities.Pet.fields.body_condition_goal
        distinguishing_aspect: "Omitting activity_level/neutered/body_condition_goal applies defaults MODERATE/true/MAINTAIN; dct computed accordingly."
        test_recipe:
          setup: ["A registered account"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "ent-4@x.com", full_name: "E4", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
          assert:
            - "Pet.${pet}.activity_level == MODERATE and neutered == true and body_condition_goal == MAINTAIN"
            - "Pet.${pet}.daily_calorie_target == 794"

      - name: system_fields_minted_input_ignored_on_pet_create
        claim_type: System Fields
        grounds:
          - entities.Pet.fields.status
          - entities.Pet.fields.current_weight_kg
        distinguishing_aspect: "id/created_at/status/current_weight_kg are server-minted; status forced ACTIVE and current_weight_kg seeded from initial_weight_kg regardless of any client attempt."
        test_recipe:
          setup: ["A registered account"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "ent-5@x.com", full_name: "E5", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
          trigger:
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 18.0, ideal_weight_kg: 18.0 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
          assert:
            - "Pet.${pet}.current_weight_kg == 18.0 and status == ACTIVE"
            - "Pet.${pet}.id is a server-minted UUID and created_at is ISO-8601"

      - name: list_recipes_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints
        distinguishing_aspect: "GET /api/recipes returns response_type array with pagination fields total_count and has_more."
        test_recipe:
          setup: ["Two PUBLISHED recipes exist"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/recipes"
              payload: { name: "R1", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"] }
              as: NutritionVet
              captures: { r1: $.data.id }
            - call: "POST /api/recipes/${r1}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/recipes"
              payload: { name: "R2", species: "CAT", kcal_per_gram: 1.5, price_per_100g_cents: 90, availability_regions: ["US"] }
              as: NutritionVet
              captures: { r2: $.data.id }
            - call: "POST /api/recipes/${r2}/publish"
              payload: {}
              as: NutritionVet
          trigger:
            - call: "GET /api/recipes"
              payload: { limit: 1, offset: 0 }
              as: NutritionVet
          assert:
            - "response_type == array; meta.total_count >= 2; has_more == true when limit 1 and total 2"

      - name: recipe_immutable_weightlog_has_no_version_field
        claim_type: Immutability
        grounds:
          - entities.WeightLog
        distinguishing_aspect: "WeightLog has common_fields false: it carries only id + created_at, no version; there is no update endpoint for a weight log."
        test_recipe:
          setup: ["A pet with one weight log"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "ent-7@x.com", full_name: "E7", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
          trigger:
            - call: "POST /api/weight-logs"
              payload: { pet_id: "${pet}", weight_kg: 21.0, effective_date: "2026-01-05T00:00:00Z" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { wl: $.data.id }
          assert:
            - "WeightLog.${wl} response includes id and created_at but no version field"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: activate_already_active_subscription_returns_not_draft
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Subscription.DRAFT_to_ACTIVE
          - errors[ERR_SUBSCRIPTION_NOT_DRAFT]
        distinguishing_aspect: "Activating a subscription already ACTIVE -> ERR_SUBSCRIPTION_NOT_DRAFT 409; no side effects."
        test_recipe:
          setup: ["An ACTIVE subscription (MAIN pet, recipe P80)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "sm-1@x.com", full_name: "SM1", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"] }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
          trigger:
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_SUBSCRIPTION_NOT_DRAFT"

      - name: resume_active_subscription_returns_not_paused
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Subscription.PAUSED_to_ACTIVE
          - errors[ERR_SUBSCRIPTION_NOT_PAUSED]
        distinguishing_aspect: "Resuming an ACTIVE (not PAUSED) subscription -> ERR_SUBSCRIPTION_NOT_PAUSED 409."
        test_recipe:
          setup: ["An ACTIVE subscription"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "sm-2@x.com", full_name: "SM2", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"] }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
          trigger:
            - call: "POST /api/subscriptions/${sub}/resume"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_SUBSCRIPTION_NOT_PAUSED"

      - name: cancel_terminal_subscription_returns_already_cancelled
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Subscription.terminal_states
          - errors[ERR_SUBSCRIPTION_ALREADY_CANCELLED]
        distinguishing_aspect: "Cancelling a CANCELLED subscription -> ERR_SUBSCRIPTION_ALREADY_CANCELLED 409; terminal state rejects all transitions."
        test_recipe:
          setup: ["A CANCELLED subscription (DRAFT created then cancelled is not allowed from DRAFT; use ACTIVE then cancel)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "sm-3@x.com", full_name: "SM3", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"] }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
            - call: "POST /api/subscriptions/${sub}/cancel"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
          trigger:
            - call: "POST /api/subscriptions/${sub}/cancel"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_SUBSCRIPTION_ALREADY_CANCELLED"

      - name: dispatch_unpaid_order_shipment_blocked
        claim_type: guarded transitions
        grounds:
          - state_machines.Shipment.PENDING_to_DISPATCHED
          - errors[ERR_SHIPMENT_NOT_PENDING]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / shipment_dispatch_requires_order_paid
          rationale: "The Shipment->Order PAID guard is exercised by the named §1.8 cross-entity instance."

      - name: subscription_cancel_cascades_scheduled_orders_to_skipped
        claim_type: Cascade down
        grounds:
          - state_machines.Subscription.transitions
          - state_machines.Order.SCHEDULED_to_SKIPPED
        distinguishing_aspect: "Cancelling an ACTIVE subscription with a SCHEDULED order cascades that order to SKIPPED (only non-terminal SCHEDULED affected)."
        test_recipe:
          setup: ["ACTIVE subscription with one SCHEDULED order #1"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "sm-5@x.com", full_name: "SM5", country_code: "US" }
              as: Anonymous
              captures: { acc: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${acc}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0 }
              as: PetParent
              as_user_id: "${acc}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"] }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${acc}", pet_id: "${pet}", recipe_id: "${rec}" }
              as: PetParent
              as_user_id: "${acc}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
              captures: { v0: $.data.version }
            - call: "POST /api/subscriptions/${sub}/orders"
              payload: { expected_subscription_version: "${v0}" }
              as: BillingAdmin
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /api/subscriptions/${sub}/cancel"
              payload: {}
              as: PetParent
              as_user_id: "${acc}"
          assert:
            - "Subscription.${sub}.status == CANCELLED"
            - "Order.${o1}.status == SKIPPED"

      - name: cancel_before_first_paid_order_revokes_pending_signup_credits
        claim_type: Conditional cascade
        grounds:
          - state_machines.Subscription.transitions
          - entities.ReferralCredit.fields.status
          - entities.ReferralCredit.fields.reason
        distinguishing_aspect: "Cancelling the referred account's only subscription before any PAID order REVOKES its PENDING SIGNUP ReferralCredit rows (referred and referrer rows for that pair) -> status REVOKED."
        test_recipe:
          setup: ["Referrer R, referred F (with R's code -> 2 PENDING SIGNUP credits), F has an ACTIVE subscription with no PAID order"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/accounts/register"
              payload: { email: "rev-r@x.com", full_name: "R", country_code: "US" }
              as: Anonymous
              captures: { accR: $.data.id, codeR: $.data.referral_code }
            - call: "POST /api/accounts/register"
              payload: { email: "rev-f@x.com", full_name: "F", country_code: "US", referral_code: "${codeR}" }
              as: Anonymous
              captures: { accF: $.data.id }
            - call: "POST /api/pets"
              payload: { account_id: "${accF}", name: "Bo", species: "DOG", sex: "MALE", birth_date: "2022-01-01", initial_weight_kg: 20.0, ideal_weight_kg: 20.0 }
              as: PetParent
              as_user_id: "${accF}"
              captures: { pet: $.data.id }
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"] }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
            - call: "POST /api/subscriptions"
              payload: { account_id: "${accF}", pet_id: "${pet}", recipe_id: "${rec}" }
              as: PetParent
              as_user_id: "${accF}"
              captures: { sub: $.data.id }
            - call: "POST /api/subscriptions/${sub}/activate"
              payload: {}
              as: PetParent
              as_user_id: "${accF}"
          trigger:
            - call: "POST /api/subscriptions/${sub}/cancel"
              payload: {}
              as: PetParent
              as_user_id: "${accF}"
            - call: "GET /api/referral-credits"
              payload: { referred_account_id: "${accF}" }
              as: BillingAdmin
          assert:
            - "Subscription.${sub}.status == CANCELLED"
            - "both SIGNUP ReferralCredit rows for this pair have status == REVOKED"
            - "Account.${accR}.wallet_credit_cents == 0 and Account.${accF}.wallet_credit_cents == 0"

      - name: publish_already_published_recipe_returns_not_draft
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Recipe.DRAFT_to_PUBLISHED
          - errors[ERR_RECIPE_NOT_DRAFT]
        distinguishing_aspect: "Publishing a recipe already PUBLISHED -> ERR_RECIPE_NOT_DRAFT 409; only DRAFT recipes can be published."
        test_recipe:
          setup: ["A PUBLISHED recipe"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/recipes"
              payload: { name: "Turkey", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"] }
              as: NutritionVet
              captures: { rec: $.data.id }
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
          trigger:
            - call: "POST /api/recipes/${rec}/publish"
              payload: {}
              as: NutritionVet
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_RECIPE_NOT_DRAFT"

      - name: retire_draft_recipe_returns_not_published
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Recipe.PUBLISHED_to_RETIRED
          - errors[ERR_RECIPE_NOT_PUBLISHED]
        distinguishing_aspect: "Retiring a recipe still in DRAFT -> ERR_RECIPE_NOT_PUBLISHED 409; only PUBLISHED recipes can be retired."
        test_recipe:
          setup: ["A DRAFT recipe (never published)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /api/recipes"
              payload: { name: "Draft", species: "DOG", kcal_per_gram: 2.0, price_per_100g_cents: 80, availability_regions: ["US"] }
              as: NutritionVet
              captures: { rec: $.data.id }
          trigger:
            - call: "POST /api/recipes/${rec}/retire"
              payload: {}
              as: NutritionVet
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409 and error_id == ERR_RECIPE_NOT_PUBLISHED"

      - name: shipment_deliver_within_window_marks_delivered
        claim_type: Valid Transition
        grounds:
          - state_machines.Shipment.DISPATCHED_to_DELIVERED
        distinguishing_aspect: "Deliver within transit window (elapsed 1 day <= transit_days 2) -> DELIVERED, no make-good credit."
        test_recipe:
          setup: ["Order PAID, Shipment DISPATCHED at 2026-01-01 transit_days 2; clock at 2026-01-02"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
