      - name: fleet_credit_conserved_on_schedule_cancel
        grounds:
          - state_machines.WorkOrder.SCHEDULED_to_CANCELLED
          - entities.FleetAccount.fields.held_credit_cents
        distinguishing_aspect: >
          Conserved quantity = FleetAccount.held_credit_cents (currency cents). schedule holds
          total_due 54000; cancel releases exactly 54000, returning held_credit to its pre-schedule
          value 0. Different conserved quantity (cents) than bay minutes.
        test_recipe:
          setup:
            - "A fleet account at held_credit 0; a fleet PPF quote (total_due 54000) ACCEPTED."
          setup_api_calls:
            - call: "POST /state-tint-regulations"
              payload: { state_code: "NC", front_side_min_vlt_pct: 35, windshield_strip_max_inches: 5, medical_exemption_allowed: false }
