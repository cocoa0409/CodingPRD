        claim_type: Violation → Error
        grounds:
          - validations[priority=70]
          - errors[ERR_DUPLICATE_CODE]
        distinguishing_aspect: "A second DRAFT model reusing a live model_code returns ERR_DUPLICATE_CODE (409); uniqueness is scoped to statuses DRAFT, IN_REVIEW and RELEASED."
        test_recipe:
          setup:
            - "One DRAFT model with model_code BV-300-DUP."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-DUP", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-DUP", valve_type: "GATE", pressure_class: 150, body_material_grade: "WCB", bore_size_mm: 80, seat_type: "SOFT", base_break_torque_nm: 200.0 }
              as: ProductEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DUPLICATE_CODE"
            - "HTTP status == 409"
            - "ValveModel.${m1_id}.valve_type == BALL"

      - name: corner_model_code_reusable_after_withdrawal
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=70]
          - state_machines.ValveModel.RELEASED_to_WITHDRAWN
        distinguishing_aspect: "Once the incumbent model is WITHDRAWN it leaves the uniqueness scope, so the same model_code is accepted again with 201 and its own spec_revision 1."
        test_recipe:
          setup:
            - "One model with model_code BV-300-REUSE taken through SUBMIT_REVIEW, RELEASE and WITHDRAW."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-REUSE", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m1_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m1_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m1_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/valve-models/${m1_id}/actions"
              payload: { action: "WITHDRAW" }
              as: QualityManager
          trigger:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-REUSE", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 440.0 }
              as: ProductEngineer
              captures: { m2_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ValveModel.${m2_id}.status == DRAFT"
            - "ValveModel.${m2_id}.base_break_torque_nm == 440.0"
            - "ValveModel.${m1_id}.status == WITHDRAWN"

      - name: corner_lot_verify_blocked_by_out_of_spec_chemistry
        claim_type: Conditional validation
        grounds:
          - validations[priority=54]
          - errors[ERR_MTR_CHEMISTRY_OUT_OF_SPEC]
        distinguishing_aspect: "The chemistry limits are keyed on material_grade: CF8M caps carbon equivalent at 0.40, so a lot declared at 0.44 fails VERIFY with ERR_MTR_CHEMISTRY_OUT_OF_SPEC (422) and stays RECEIVED."
        test_recipe:
          setup:
            - "One foundry and one RECEIVED CF8M lot declaring carbon_equivalent_pct 0.44 and impact_energy_j 40."
          setup_api_calls:
            - call: "POST /valve-mfg/foundries"
              payload: { foundry_code: "FDY-C11", name: "Corner Chem Castings", country_code: "IN" }
              as: ProcurementSpecialist
              captures: { f_id: $.data.id }
            - call: "POST /valve-mfg/heat-lots"
              payload: { foundry_id: "${f_id}", heat_number: "H-C1101", material_grade: "CF8M", process: "CASTING", qty_received_kg: 500.000, mtr_document_ref: "MTR-C1101", carbon_equivalent_pct: 0.44, impact_energy_j: 40 }
              as: ProcurementSpecialist
              captures: { l_id: $.data.id }
          trigger:
            - call: "POST /valve-mfg/heat-lots/${l_id}/dispositions"
              payload: { action: "VERIFY" }
              as: QualityManager
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_MTR_CHEMISTRY_OUT_OF_SPEC"
            - "HTTP status == 422"
            - "HeatLot.${l_id}.status == RECEIVED"
            - "HeatLot.${l_id}.verified_by_user_id == null"
            - "Foundry.${f_id}.rejected_lot_count == 0"

      - name: corner_order_release_blocked_when_gross_exceeds_credit_limit
        claim_type: Aggregate validation
        grounds:
          - validations[priority=82]
          - calculations.eto_order_price_cents
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: "Each unit price is modest but the aggregate is not: 4 x 1,500,000 discounted 6% gives gross 5,640,000 cents against a 5,000,000 cent limit, so RELEASE_TO_PRODUCTION returns ERR_CREDIT_LIMIT_EXCEEDED (402)."
        test_recipe:
          setup:
            - "A RELEASED BALL model at class 300."
            - "An APPROVED order for 4 units at 1,500,000 cents each, no expedite, with a 5,000,000 cent credit limit."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-CRED", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/valve-models/${m_id}/actions"
              payload: { action: "RELEASE" }
              as: QualityManager
            - call: "POST /valve-mfg/engineered-orders"
              payload: { order_code: "ETO-CRED", model_id: "${m_id}", ordered_qty: 4, unit_price_cents: 1500000, customer_credit_limit_cents: 5000000, datasheet_break_torque_nm: 420.0, datasheet_torque_source: "VENDOR_MEASURED" }
              as: ProductEngineer
              captures: { o_id: $.data.id }
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "SUBMIT_REVIEW" }
              as: ProductEngineer
            - call: "POST /valve-mfg/engineered-orders/${o_id}/review-actions"
              payload: { action: "APPROVE" }
              as: QualityManager
          trigger:
            - call: "POST /valve-mfg/engineered-orders/${o_id}/lifecycle-actions"
              payload: { action: "RELEASE_TO_PRODUCTION" }
              as: ProductEngineer
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CREDIT_LIMIT_EXCEEDED"
            - "HTTP status == 402"
            - "EngineeredOrder.${o_id}.gross_quoted_cents == 5640000"
            - "EngineeredOrder.${o_id}.status == APPROVED"

      - name: corner_list_with_limit_above_hundred_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=11]
          - errors[ERR_INVALID_PAGINATION]
        distinguishing_aspect: "limit 500 is outside [1,100], so GET /valve-mfg/valve-models returns ERR_INVALID_PAGINATION (400) rather than clamping silently."
        test_recipe:
          setup:
            - "One DRAFT model stored, so the list would otherwise be non-empty."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-PAGE", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
          trigger:
            - call: "GET /valve-mfg/valve-models"
              payload: { limit: 500, offset: 0 }
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_PAGINATION"
            - "HTTP status == 400"

      - name: corner_priority_conflict_between_two_violated_rules
        claim_type: Priority conflict
        grounds:
          - validations[priority=32]
          - validations[priority=52]
        excluded_because:
          difficulty_instance: certify_state_error_outranks_duty_conflict
          rationale: "The named §1.8 instance violates both rules in one call and asserts the lower-priority code is the response."

      - name: corner_cross_entity_validation_on_certification
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=44]
        excluded_because:
          difficulty_instance: unit_certification_blocked_by_frozen_license_posture
          rationale: "The named §1.8 instance tests the valid and invalid license posture for the same unit."

      - name: corner_temporal_validation_on_bench_bookings
        claim_type: Temporal validation
        grounds:
          - validations[priority=60]
        excluded_because:
          difficulty_instance: test_bench_half_open_intervals_permit_touching_endpoints
          rationale: "The named §1.8 instance covers accepted touching and refused straddling bench intervals."

  - section: endpoints
    instances:
      - name: corner_clock_endpoint_moves_the_logical_now
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /valve-mfg/_clock/set_current_utc]
        distinguishing_aspect: "The logical clock starts at 2026-08-01T00:00:00Z and only moves when the clock endpoint is called; the call echoes the new current_utc and rewrites no stored row."
        test_recipe:
          setup:
            - "One DRAFT model created while the clock still reads 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /valve-mfg/valve-models"
              payload: { model_code: "BV-300-CLK", valve_type: "BALL", pressure_class: 300, body_material_grade: "CF8M", bore_size_mm: 100, seat_type: "METAL", base_break_torque_nm: 420.0 }
              as: ProductEngineer
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /valve-mfg/_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: Any
              captures: { now: $.data.current_utc }
          assert:
            - "${now} == 2027-03-01T00:00:00Z"
            - "HTTP status == 200"
            - "ValveModel.${m_id}.status == DRAFT"
            - "ValveModel.${m_id}.spec_revision == 1"

