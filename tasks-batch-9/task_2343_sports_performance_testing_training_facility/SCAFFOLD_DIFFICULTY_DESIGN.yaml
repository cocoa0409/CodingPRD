      - name: third_no_show_strike_cascades_suspension_refund_and_waitlist_promotion
        grounds:
          - calculations.no_show_fee
          - calculations.waitlist_promotion
          - calculations.session_charge_allocation
          - state_machines.Athlete.membership_status.ACTIVE_to_SUSPENDED
          - state_machines.Enrollment.status.WAITLISTED_to_RESERVED
          - state_machines.MembershipPackage.status.DEPLETED_to_ACTIVE
          - entities.Athlete.fields.no_show_strikes
        distinguishing_aspect: |
          Depth-5 cascade from a different trigger — POST /enrollments/{id}/no-show:
          the third strike causes Athlete.membership_status ACTIVE -> SUSPENDED, which causes
          the athlete's future RESERVED enrollment to be CANCELED, which causes its
          MembershipPackage credit to be refunded (DEPLETED -> ACTIVE), which frees a roster
