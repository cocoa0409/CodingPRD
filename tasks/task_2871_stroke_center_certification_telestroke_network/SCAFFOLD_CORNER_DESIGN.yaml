          gt_ems: $.data.ems_routing_posture
      trigger:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:40:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/transfer-decisions/${gt_t}/accept
        payload: {}
        as: TransferCoordinator
        as_user_id: tc_erin
        captures:
          gt_id: $.data.error_id
          gt_msg: $.data.message
      - call: GET /stroke-network/transfer-decisions/${gt_t}
        payload: {}
        as: TransferCoordinator
        as_user_id: tc_erin
        captures:
          gt_status: $.data.status
          gt_acc: $.data.accepted_at
          gt_snap2: $.data.destination_posture_at_proposal
      - call: GET /stroke-network/stroke-centers/${tcc_id}
        as: ProgramCoordinator
        captures:
          gt_open: $.data.open_case_count
      - call: GET /stroke-network/code-strokes/${gt_id}
        as: EdPhysician
        captures:
          gt_c_status: $.data.status
      assert:
      - ${gt_snap} == ROUTINE was frozen on the row at proposal time
      - after both FAIL attestations ${gt_eq} == OFFLINE and ${gt_ems} == BYPASS
      - the acceptance returns HTTP 409 with ${gt_id} == ERR_DESTINATION_BYPASS
      - ${gt_status} is still PROPOSED and ${gt_acc} == null
      - ${gt_snap2} == ROUTINE — the snapshot is NEVER refreshed, which is exactly why the guard must read the centre
      - ${gt_open} == 0 (no increment from a refused acceptance) and ${gt_c_status} is still TRANSFER_INITIATED
  - name: deviation_review_loops_between_under_review_and_returned_for_info
    claim_type: cyclic_loop
    grounds:
    - state_machines.ProtocolDeviation UNDER_REVIEW -> RETURNED_FOR_INFO -> UNDER_REVIEW
    - endpoints.POST /stroke-network/deviations/{id}/resubmit side effect review_round += 1
    distinguishing_aspect: 'The loop is COUNTED, not free: start-review pins review_round to 1 and only resubmit increments it, so two full laps must read 1 -> 1 -> 2 -> 2 -> 3. return-for-info must not increment, which is the off-by-one a naive implementation introduces.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; one SPOKE centre and one ACTIVATED case on it.
      - One MANUAL MAJOR deviation on that case in status OPEN with review_round 0.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          cy_ctr: $.data.id
      - call: POST /stroke-network/code-strokes
        payload:
          center_id: ${cy_ctr}
          patient_ref: P-CY-001
          door_at: '2026-09-01T08:00:00Z'
          lkw_precision: EXACT
          arrival_mode: EMS
          last_known_well_at: '2026-09-01T07:40:00Z'
        as: EdPhysician
        as_user_id: ed_ann
        captures:
          cy_case: $.data.id
      - call: POST /stroke-network/deviations
        payload:
          case_id: ${cy_case}
          deviation_type: DTN_EXCEEDED
          severity: MAJOR
          narrative: needle time missed while awaiting pharmacy
        as: QualityAbstractor
        as_user_id: qa_bob
        captures:
          cy_dev: $.data.id
      trigger:
      - call: POST /stroke-network/deviations/${cy_dev}/start-review
        payload: {}
        as: CertificationReviewer
        as_user_id: cr_dana
        captures:
          cy_s1: $.data.status
          cy_r1: $.data.review_round
          cy_who: $.data.reviewed_by_user_id
      - call: POST /stroke-network/deviations/${cy_dev}/return-for-info
        payload:
          info_request: attach the pharmacy dispense timestamp
        as: CertificationReviewer
        as_user_id: cr_dana
        captures:
          cy_s2: $.data.status
          cy_r2: $.data.review_round
          cy_req: $.data.info_request
      - call: POST /stroke-network/deviations/${cy_dev}/resubmit
        payload:
          additional_info: pharmacy dispensed at 08:36 per the eMAR
        as: QualityAbstractor
        as_user_id: qa_bob
        captures:
          cy_s3: $.data.status
          cy_r3: $.data.review_round
          cy_info: $.data.additional_info
      - call: POST /stroke-network/deviations/${cy_dev}/return-for-info
        payload:
          info_request: also attach the bedside nursing note
        as: CertificationReviewer
        as_user_id: cr_dana
        captures:
          cy_s4: $.data.status
          cy_r4: $.data.review_round
      - call: POST /stroke-network/deviations/${cy_dev}/resubmit
        payload:
          additional_info: nursing note attached, arrival to bolus documented
        as: QualityAbstractor
        as_user_id: qa_bob
        captures:
          cy_s5: $.data.status
          cy_r5: $.data.review_round
          cy_v5: $.data.version
      assert:
      - ${cy_s1} == UNDER_REVIEW with ${cy_r1} == 1 and ${cy_who} == cr_dana
      - ${cy_s2} == RETURNED_FOR_INFO but ${cy_r2} == 1 — return-for-info does NOT increment the counter
      - ${cy_s3} == UNDER_REVIEW with ${cy_r3} == 2, and ${cy_info} echoes the resubmission
      - ${cy_s4} == RETURNED_FOR_INFO with ${cy_r4} == 2, then ${cy_s5} == UNDER_REVIEW with ${cy_r5} == 3
      - ${cy_v5} == 6 — five successful writes on top of the created row, so no lap was silently skipped
      - 'the loop terminates: the review_round == 3 ceiling is enforced by validations priority 76'
- section: calculations
  instances:
  - name: clock_interval_metrics_floors_minutes_but_keeps_latency_in_seconds
    claim_type: correct_result
    grounds:
    - calculations.clock_interval_metrics
    - entities.CodeStrokeCase.door_to_imaging_minutes / door_to_needle_minutes / lkw_to_needle_minutes
    - entities.TelestrokeConsult.response_latency_seconds
    distinguishing_aspect: 'The rule mixes two resolutions in one formula block: the three case intervals are FLOORED to whole minutes while response_latency_seconds stays a raw second count. A needle at 08:58:45 gives door_to_needle 58 (3525 s floored, not 59) and lkw_to_needle 78 (4725 s floored, not 79), while a 140 second acceptance stays 140 and is never turned into 2.'
    test_recipe:
      setup:
      - Clock walked from 2026-09-01T08:00:00Z; hub, spoke, ACTIVE agreement, one board-certified ON_CALL Neurologist.
      - One CodeStrokeCase, door_at 08:00:00Z, last_known_well_at 07:40:00Z, lkw_precision EXACT.
      - Imaging at 08:22:00Z; consult requested at 08:25:00Z and accepted at 08:27:20Z; one 185 s HD session; consult completed at 08:31:00Z; four inclusion items and an ELIGIBLE determination.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
