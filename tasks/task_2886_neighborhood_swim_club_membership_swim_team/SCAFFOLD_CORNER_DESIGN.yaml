          - entities.PartyReservation.fields.subtotal_cents
          - entities.PartyReservation.fields.member_discount_cents
          - endpoints[POST /swim-club/party-reservations]
        distinguishing_aspect: |
          Step 8 keys the discount off the step-7 subtotal with an INCLUSIVE lower bound, and the
          fixtures land one reservation exactly ON DISCOUNT_TIER_1_CENTS (subtotal 25000) and its
          twin just below it (20600). A strict `>` comparison gives the first party no discount at
          all, a difference of 2500 cents on a single hour of duration. The two reservations differ
          only in end_iso, so the boundary cannot be confused with a zone or guest-count effect.
          Separate households are used because DELINQUENCY_TOLERANCE_CENTS is 0.
        test_recipe:
          setup:
            - "One COUPLE category with bond 0, so priority 81 is satisfied without a bond payment, and party_privileges true."
            - "One OPEN 2027 season with bather_load_capacity 120, far above the load of 26 either party carries."
            - "Two households A and B, each with an invoiced ACTIVE membership and nothing owed."
            - "The clock sits at 2027-07-01T09:00Z, before both party windows."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-01T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/membership-categories"
              payload: { code: "COUPLE", label: "Couple", bond_cents: 0, initiation_fee_cents: 0, seasonal_dues_cents: 30000, guest_pass_allotment: 2, max_household_size: 4, volunteer_credits_required: 2, waitlist_required: false, proration_allowed: true, party_privileges: true }
              as: MembershipChair
              captures: { cat_id: $.data.id }
            - call: "POST /swim-club/seasons"
              payload: { year: 2027, open_date: "2027-05-22", close_date: "2027-09-06", dues_due_date: "2027-04-15", baseline_bather_load: 0, bather_load_capacity: 120 }
              as: BoardPresident
              captures: { s27_id: $.data.id }
            - call: "POST /swim-club/seasons/${s27_id}/open"
              payload: {}
              as: PoolManager
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Four Hour Party Household", address_line: "151 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Three Hour Party Household", address_line: "152 Cedar Court", residency: "IN_DISTRICT", member_count: 2, prior_member: false }
              as: MembershipChair
              captures: { h_b_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_a_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_a_id: $.data.id }
            - call: "POST /swim-club/memberships"
              payload: { household_id: "${h_b_id}", membership_category_id: "${cat_id}", season_id: "${s27_id}", join_date: "2027-07-01", bond_payment_plan: "FULL" }
              as: MembershipChair
              captures: { m_b_id: $.data.id }
            - call: "POST /swim-club/memberships/${m_a_id}/invoice"
              payload: {}
              as: Treasurer
            - call: "POST /swim-club/memberships/${m_b_id}/invoice"
              payload: {}
              as: Treasurer
          trigger:
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_a_id}", zone: "PAVILION", start_iso: "2027-07-15T14:00:00Z", end_iso: "2027-07-15T18:00:00Z", guest_count: 12, host_party_size: 14 }
              as: PoolManager
              captures: { p_a_id: $.data.id, p_a_load: $.data.projected_bather_load, p_a_hours: $.data.duration_hours_ceil, p_a_guards: $.data.required_guard_count, p_a_base: $.data.base_facility_fee_cents, p_a_over: $.data.guest_overage_fee_cents, p_a_surch: $.data.lifeguard_surcharge_cents, p_a_sub: $.data.subtotal_cents, p_a_disc: $.data.member_discount_cents, p_a_total: $.data.total_charge_cents }
            - call: "POST /swim-club/party-reservations"
              payload: { membership_id: "${m_b_id}", zone: "PAVILION", start_iso: "2027-07-16T14:00:00Z", end_iso: "2027-07-16T17:00:00Z", guest_count: 12, host_party_size: 14 }
              as: PoolManager
              captures: { p_b_id: $.data.id, p_b_hours: $.data.duration_hours_ceil, p_b_guards: $.data.required_guard_count, p_b_surch: $.data.lifeguard_surcharge_cents, p_b_sub: $.data.subtotal_cents, p_b_disc: $.data.member_discount_cents, p_b_total: $.data.total_charge_cents }
            - call: "GET /swim-club/households/${h_a_id}"
              payload: {}
              as: Treasurer
              captures: { h_a_owed: $.data.party_charges_owed_cents }
            - call: "GET /swim-club/households/${h_b_id}"
              payload: {}
              as: Treasurer
              captures: { h_b_owed: $.data.party_charges_owed_cents }
          assert:
            - "party A: ${p_a_load} == 26, ${p_a_guards} == 2 == max(1, ceil(26 / 25)) with no WHOLE_FACILITY bump, ${p_a_hours} == 4"
            - "party A: ${p_a_base} == 6000 (PAVILION), ${p_a_over} == 1400 == max(0, 12 - 10) * 700, ${p_a_surch} == 17600 == 2 * 4 * 2200"
            - "party A: ${p_a_sub} == 25000 == 6000 + 1400 + 17600, landing EXACTLY on DISCOUNT_TIER_1_CENTS"
            - "party A: ${p_a_disc} == 2500 == round_half_up(25000 * 0.10) and ${p_a_total} == 22500; a strict `>` boundary would give 0 and 25000"
            - "party B: ${p_b_hours} == 3, ${p_b_guards} == 2 and ${p_b_surch} == 13200 == 2 * 3 * 2200, so ${p_b_sub} == 20600"
            - "party B: ${p_b_disc} == 0 and ${p_b_total} == 20600, because 20600 < 25000"
            - "the two reservations differ only in end_iso, so 2500 cents of discount hang on one hour of duration"
            - "neither subtotal reaches DISCOUNT_TIER_2_CENTS (45000), so the 0.15 arm is not involved"
            - "${h_a_owed} == 22500 and ${h_b_owed} == 20600: each household is charged the post-discount total, not the subtotal"

      - name: constants_applied_standing_takes_the_more_severe_of_sanction_and_points
        claim_type: constants_applied
        grounds:
          - calculations.conduct_point_accrual
          - calculations.conduct_sanction_standing_map
          - entities.ConductCase.fields.points_assessed
          - endpoints[POST /swim-club/conduct-cases/{id}/transitions]
        distinguishing_aspect: |
          The map has two independent inputs and the fixtures make them DISAGREE in both directions.
          Household A takes a SEVERE case with the mildest possible sanction, WARNING: by_sanction is
          GOOD_STANDING but CONDUCT_POINTS[SEVERE] is 8, which clears CONDUCT_SUSPENSION_THRESHOLD 6
          and not CONDUCT_EXPULSION_THRESHOLD 10, so the household is SUSPENDED anyway. Household B
          takes a MINOR case with a PROBATION sanction: 2 points is below the threshold, so this time
          the sanction is the stronger input. An implementation that reads only sanction_type gets A
          wrong; one that reads only points gets B wrong.
        test_recipe:
          setup:
            - "Two households in GOOD_STANDING with conduct_points 0 and no memberships, so nothing cascades and the standing is read cleanly."
            - "Both cases are reported by pm-001 and decided by bp-001, satisfying the two-person control at priority 5."
          setup_api_calls:
            - call: "POST /swim-club/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-20T09:00:00Z" }
              as: SystemOperator
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Severe Warning Household", address_line: "161 Cedar Court", residency: "IN_DISTRICT", member_count: 3, prior_member: false }
              as: MembershipChair
              captures: { h_a_id: $.data.id, h_a_standing_0: $.data.standing, h_a_points_0: $.data.conduct_points }
            - call: "POST /swim-club/households"
              payload: { primary_contact_name: "Minor Probation Household", address_line: "162 Cedar Court", residency: "IN_DISTRICT", member_count: 3, prior_member: false }
              as: MembershipChair
              captures: { h_b_id: $.data.id, h_b_standing_0: $.data.standing }
            - call: "POST /swim-club/conduct-cases"
              payload: { household_id: "${h_a_id}", subject_name: "Adult guest of the household", severity: "SEVERE", narrative: "Dove into the shallow end after three explicit warnings and shoved a guard." }
              as: PoolManager
              as_user_id: pm-001
              captures: { c_a_id: $.data.id, c_a_status_0: $.data.status, c_a_points_0: $.data.points_assessed }
            - call: "POST /swim-club/conduct-cases"
              payload: { household_id: "${h_b_id}", subject_name: "Teenage member of the household", severity: "MINOR", narrative: "Repeated running on the deck." }
              as: PoolManager
              as_user_id: pm-001
              captures: { c_b_id: $.data.id }
            - call: "POST /swim-club/conduct-cases/${c_a_id}/transitions"
              payload: { to_status: "UNDER_REVIEW" }
              as: BoardPresident
              as_user_id: bp-001
            - call: "POST /swim-club/conduct-cases/${c_b_id}/transitions"
              payload: { to_status: "UNDER_REVIEW" }
              as: BoardPresident
              as_user_id: bp-001
          trigger:
            - call: "POST /swim-club/conduct-cases/${c_a_id}/transitions"
              payload: { to_status: "SANCTIONED", sanction_type: "WARNING" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { c_a_status_1: $.data.status, c_a_points_1: $.data.points_assessed, c_a_sanction: $.data.sanction_type, c_a_at: $.data.sanctioned_at }
            - call: "GET /swim-club/households/${h_a_id}"
              payload: {}
              as: BoardPresident
              captures: { h_a_standing_1: $.data.standing, h_a_points_1: $.data.conduct_points }
            - call: "POST /swim-club/conduct-cases/${c_b_id}/transitions"
              payload: { to_status: "SANCTIONED", sanction_type: "PROBATION" }
              as: BoardPresident
              as_user_id: bp-001
              captures: { c_b_status_1: $.data.status, c_b_points_1: $.data.points_assessed }
            - call: "GET /swim-club/households/${h_b_id}"
              payload: {}
              as: BoardPresident
              captures: { h_b_standing_1: $.data.standing, h_b_points_1: $.data.conduct_points }
          assert:
            - "${h_a_standing_0} == GOOD_STANDING, ${h_b_standing_0} == GOOD_STANDING and ${h_a_points_0} == 0"
            - "${c_a_status_0} == REPORTED with ${c_a_points_0} == 0: points are not assessed until the case is sanctioned"
            - "${c_a_status_1} == SANCTIONED, ${c_a_sanction} == WARNING, ${c_a_points_1} == 8 == CONDUCT_POINTS[SEVERE] and ${c_a_at} == 2027-06-20T09:00:00Z"
            - "${h_a_points_1} == 8, inside the 730-day lookback window"
            - "${h_a_standing_1} == SUSPENDED: by_sanction was GOOD_STANDING (rank 0) but by_points was SUSPENDED (rank 2), and the map takes the maximum"
            - "${c_b_points_1} == 2 == CONDUCT_POINTS[MINOR] and ${h_b_points_1} == 2, which is below CONDUCT_SUSPENSION_THRESHOLD 6"
            - "${h_b_standing_1} == PROBATION and ${c_b_status_1} == SANCTIONED: here by_sanction (rank 1) beats by_points (rank 0), the opposite direction of household A"
            - "neither household reaches EXPELLED, because 8 < CONDUCT_EXPULSION_THRESHOLD 10"

