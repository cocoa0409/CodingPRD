      - name: vessel_accumulation_blocks_a_second_voyage_until_delivery_releases_the_ledger
        claim_type: violation_to_error
        grounds:
          - validations.priority_22
          - errors.ERR_VESSEL_ACCUMULATION_EXCEEDED
          - endpoints.POST /certificates/{id}/confirm-delivery
          - state_machines.AccumulationEntry.status.ACTIVE_to_RELEASED
        distinguishing_aspect: |
          The single-vessel bucket spans ALL voyages and reads only ACTIVE ledger
          rows, so the same 1600000.00 line is refused and then accepted with no
          change to the request: while voyage 1 is in transit the vessel holds
          1600000.00 of a 3000000.00 limit and the second line's 3200000.00 total
          is refused, but once the assured confirms delivery the entries move to
          RELEASED/DELIVERY_CONFIRMED, the vessel ledger drops to 0.00 and the
          identical issue succeeds. An implementation that counts RELEASED rows,
          or that scopes accumulation to one sailing date, fails one half.
