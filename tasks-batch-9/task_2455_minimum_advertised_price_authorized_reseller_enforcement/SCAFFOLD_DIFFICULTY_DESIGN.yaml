              as_user_id: "analyst-1"
              captures: { obs2_id: $.data.id }
            - call: "POST /price-observations/${obs2_id}/evaluate"
              payload: {}
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { v2_id: $.data.violation_id }
            - call: "POST /enforcement-notices"
              payload: { reseller_id: "${rs_id}", violation_id: "${v2_id}", delivery_channel: "CERTIFIED_MAIL", suspension_starts_at: "2026-08-15T00:00:00Z", suspension_ends_at: "2026-08-25T00:00:00Z", expected_reseller_version: "${rs_v2}" }
              as: BrandChannelManager
              as_user_id: "channel-mgr-1"
              captures: { n2_id: $.data.id, n2_rung: $.data.rung, n2_points: $.data.assessed_points, n2_cum: $.data.cumulative_points_at_issue }
            - call: "GET /resellers/${rs_id}/compliance-summary"
              payload: {}
              as: BrandChannelManager
              captures: { sum_before: $.data.summed_assessed_points, count_before: $.data.contributing_violation_count, rung_before: $.data.highest_issued_rung }
          trigger:
            - call: "POST /enforcement-notices/${n2_id}/rescind"
              payload: { rescinded_reason: "Assessment withdrawn: second listing was a cached page, evidence insufficient." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { n2_final: $.data.status, n2_closed: $.data.closed_reason }
            - call: "GET /resellers/${rs_id}/compliance-summary"
              payload: {}
              as: BrandChannelManager
              captures: { total_after: $.data.violation_points_total, sum_after: $.data.summed_assessed_points, count_after: $.data.contributing_violation_count, rung_after: $.data.highest_issued_rung, next_after: $.data.next_rung, to_susp: $.data.points_to_suspension, to_term: $.data.points_to_termination }
          assert:
            - "${n1_points} == 6 and ${pts_before_suspension} == 6 (the pre-suspension ledger value the compensation must restore)"
            - "${n2_points} == 8, ${n2_cum} == 14, ${n2_rung} == SUSPENSION, ${sum_before} == 14, ${count_before} == 2 and ${rung_before} == WARNING"
            - "${n2_final} == RESCINDED and ${n2_closed} == 'Assessment withdrawn: second listing was a cached page, evidence insufficient.'"
            - "Violation.${v2_id}.assessed_points == null, assessed_floor_cents == null and cure_deadline_at == null"
            - "Violation.${v2_id}.status == VOIDED (adjudicated per §1.5 rescind side_effects and §1.3 reseller_points_ledger, which pins VOIDED to assessed_points == null)"
            - "INVARIANT — Reseller.${rs_id}.violation_points_total == ${pts_before_suspension} == 6 exactly, not 14 and not 0"
            - "INVARIANT — ${total_after} == ${sum_after} == 6 and ${count_after} == 1: the running field re-equals the recomputed sum over LEDGER_STATUSES violations with non-null assessed_points (only violation 1 remains)"
            - "Violation.${v1_id}.status == NOTICED and Violation.${v1_id}.assessed_points == 6 (the standing WARNING is untouched by the partial reversal)"
            - "${rung_after} == WARNING and ${next_after} == SUSPENSION (the RESCINDED notice drops out of the highest-issued scan; notice 1 still counts)"
            - "${to_susp} == 0 and ${to_term} == 6"
            - "Reseller.${rs_id}.authorization_status == AUTHORIZED, supply_status == OPEN, hold_reason == NONE, suspension_ends_at == null and last_suspension_ended_at == 2026-08-10T00:00:00Z (the rescission stamps the clock at rescission time)"
            - "EnforcementNotice.${n1_id}.status == ISSUED and EnforcementNotice.${n1_id}.rung == WARNING"

      - name: chargeback_reversal_restores_money_and_score_ledgers_uphold_does_not
        grounds:
          - calculations.distributor_chargeback_ledger
          - calculations.chargeback_assessment
          - state_machines.DistributorChargeback.DISPUTED_to_UPHELD
          - state_machines.DistributorChargeback.DISPUTED_to_REVERSED
          - entities.Distributor.fields.chargeback_balance_cents
          - entities.Distributor.fields.diversion_score
          - entities.Distributor.fields.standing
        distinguishing_aspect: |
          Conserved quantities 2 and 3 — the distributor's money ledger
          (chargeback_balance_cents) and risk ledger (diversion_score), reconciled
          together after a partial failure: UPHOLD leaves both untouched at 18000 / 15.0,
          then REVERSING only the first chargeback restores both to the surviving row's
          contribution alone (8000 / 5.0) and re-derives standing PROBATION -> GOOD,
          while the survivor keeps the 4000 tier that the now-reversed score justified.
        test_recipe:
          setup:
            - "PricingPolicy MAP-2026-R published; Product SKU-SER-6 serialization_enabled true; Distributor East Distribution with annual_chargeback_cap_cents 5000000, standing GOOD, diversion_score 0.0, chargeback_balance_cents 0. No resellers source from it."
            - "SerialUnits SN-60 and SN-61 (lot LOT-G) shipped to that distributor; clock at 2026-08-10T00:00:00Z; two unmatched observations, each with a CONFIRMED_UNAUTHORIZED test purchase tracing one of those serials."
            - "Chargeback 1: 4 diverted units at the score_pre 0.0 tier 2500 -> amount 10000, score_delta 10.0 (score 10.0, standing PROBATION)."
            - "Chargeback 2: 2 diverted units at the score_pre 10.0 tier 4000 -> amount 8000, score_delta 5.0 (score 15.0, balance 18000)."
            - "The distributor disputes chargeback 2, counsel UPHOLDS it, then the distributor disputes chargeback 1 (status DISPUTED, still inside the ledger)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pricing-policies"
              payload: { policy_code: "MAP-2026-R" }
              as: BrandChannelManager
              captures: { pol_id: $.data.id }
            - call: "POST /pricing-policies/${pol_id}/submit-review"
              payload: {}
              as: BrandChannelManager
            - call: "POST /pricing-policies/${pol_id}/review-decision"
              payload: { decision: "APPROVE", legal_review_notes: "Cleared." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /pricing-policies/${pol_id}/publish"
              payload: { effective_from: "2026-08-01T00:00:00Z" }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /products"
              payload: { sku: "SKU-SER-6", name: "Aurora Receiver", msrp_cents: 36000, standard_map_floor_cents: 26000, governing_policy_id: "${pol_id}", serialization_enabled: true }
              as: BrandChannelManager
              captures: { prod_id: $.data.id }
            - call: "POST /distributors"
              payload: { legal_name: "East Distribution", annual_chargeback_cap_cents: 5000000 }
              as: BrandChannelManager
              captures: { d_id: $.data.id }
            - call: "POST /serial-units"
              payload: { serial_number: "SN-60", product_id: "${prod_id}", lot_code: "LOT-G", shipped_distributor_id: "${d_id}" }
              as: BrandChannelManager
            - call: "POST /serial-units"
              payload: { serial_number: "SN-61", product_id: "${prod_id}", lot_code: "LOT-G", shipped_distributor_id: "${d_id}" }
              as: BrandChannelManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "MARKETPLACE", marketplace_name: "BigMarket", seller_display_name: "GreyDeals", listing_url: "https://bigmarket.example/greydeals/receiver-1", listed_price_cents: 21000, observed_at: "2026-08-05T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs1_id: $.data.id }
            - call: "POST /test-purchases"
              payload: { observation_id: "${obs1_id}", ordered_at: "2026-08-08T00:00:00Z", purchase_price_cents: 21000 }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { tp1_id: $.data.id }
            - call: "POST /test-purchases/${tp1_id}/serial-capture"
              payload: { serial_number: "SN-60" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
            - call: "POST /test-purchases/${tp1_id}/confirm-outcome"
              payload: { outcome: "CONFIRM", outcome_reason: "Unauthorized storefront confirmed." }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
            - call: "POST /price-observations"
              payload: { product_id: "${prod_id}", channel: "MARKETPLACE", marketplace_name: "BigMarket", seller_display_name: "GreyDeals2", listing_url: "https://bigmarket.example/greydeals2/receiver-1", listed_price_cents: 20500, observed_at: "2026-08-06T00:00:00Z", evidence_hash: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { obs2_id: $.data.id }
            - call: "POST /test-purchases"
              payload: { observation_id: "${obs2_id}", ordered_at: "2026-08-09T00:00:00Z", purchase_price_cents: 20500 }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
              captures: { tp2_id: $.data.id }
            - call: "POST /test-purchases/${tp2_id}/serial-capture"
              payload: { serial_number: "SN-61" }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
            - call: "POST /test-purchases/${tp2_id}/confirm-outcome"
              payload: { outcome: "CONFIRM", outcome_reason: "Second unauthorized storefront confirmed." }
              as: MonitoringAnalyst
              as_user_id: "analyst-1"
            - call: "GET /distributors/${d_id}"
              payload: {}
              as: BrandChannelManager
              captures: { d_v1: $.data.version }
            - call: "POST /distributor-chargebacks"
              payload: { distributor_id: "${d_id}", test_purchase_id: "${tp1_id}", diverted_units: 4, expected_distributor_version: "${d_v1}" }
              as: BrandChannelManager
              captures: { cb1_id: $.data.id, cb1_tier: $.data.tier_rate_cents_per_unit, cb1_amount: $.data.amount_cents, cb1_delta: $.data.score_delta_applied }
            - call: "GET /distributors/${d_id}"
              payload: {}
              as: BrandChannelManager
              captures: { d_v2: $.data.version, standing_mid: $.data.standing }
            - call: "POST /distributor-chargebacks"
              payload: { distributor_id: "${d_id}", test_purchase_id: "${tp2_id}", diverted_units: 2, expected_distributor_version: "${d_v2}" }
              as: BrandChannelManager
              captures: { cb2_id: $.data.id, cb2_tier: $.data.tier_rate_cents_per_unit, cb2_amount: $.data.amount_cents, cb2_delta: $.data.score_delta_applied }
            - call: "POST /distributor-chargebacks/${cb2_id}/dispute"
              payload: { dispute_reason: "Units were sold to an authorized account that later resold them." }
              as: Distributor
              as_user_id: "${d_id}"
            - call: "POST /distributor-chargebacks/${cb2_id}/dispute-decision"
              payload: { decision: "UPHOLD", decision_reason: "Downstream resale does not discharge the diversion obligation." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { cb2_status: $.data.status }
            - call: "GET /distributors/${d_id}"
              payload: {}
              as: BrandChannelManager
              captures: { bal_after_uphold: $.data.chargeback_balance_cents, score_after_uphold: $.data.diversion_score }
            - call: "POST /distributor-chargebacks/${cb1_id}/dispute"
              payload: { dispute_reason: "Lot LOT-G units SN-60 were stolen in transit; carrier claim attached." }
              as: Distributor
              as_user_id: "${d_id}"
              captures: { cb1_disputed: $.data.status }
            - call: "GET /distributors/${d_id}"
              payload: {}
              as: BrandChannelManager
              captures: { bal_after_dispute: $.data.chargeback_balance_cents, score_after_dispute: $.data.diversion_score }
          trigger:
            - call: "POST /distributor-chargebacks/${cb1_id}/dispute-decision"
              payload: { decision: "REVERSE", decision_reason: "Carrier theft claim accepted; units never entered the distributor's control." }
              as: BrandLegalCounsel
              as_user_id: "counsel-1"
              captures: { cb1_status: $.data.status }
            - call: "GET /distributors/${d_id}"
              payload: {}
              as: BrandChannelManager
              captures: { bal_final: $.data.chargeback_balance_cents, score_final: $.data.diversion_score, standing_final: $.data.standing }
          assert:
            - "${cb1_tier} == 2500, ${cb1_amount} == 10000, ${cb1_delta} == 10.0, ${standing_mid} == PROBATION"
            - "${cb2_tier} == 4000, ${cb2_amount} == 8000, ${cb2_delta} == 5.0"
            - "${cb2_status} == UPHELD and ${bal_after_uphold} == 18000 and ${score_after_uphold} == 15.0 (UPHELD stays in LEDGER_STATUSES, so upholding moves neither ledger)"
            - "${cb1_disputed} == DISPUTED and ${bal_after_dispute} == 18000 and ${score_after_dispute} == 15.0 (DISPUTED also stays in LEDGER_STATUSES)"
            - "${cb1_status} == REVERSED and DistributorChargeback.${cb1_id}.status == REVERSED"
            - "INVARIANT — ${bal_final} == 8000 == sum(amount_cents over ASSESSED/DISPUTED/UPHELD rows) == chargeback 2 alone"
            - "INVARIANT — ${score_final} == 5.0 == sum(score_delta_applied over the same rows); the 10.0 delta leaves with its row and no rounding residue is left behind"
            - "${standing_final} == GOOD (5.0 < the 10.0 break, so standing is re-derived, not latched)"
            - "DistributorChargeback.${cb1_id}.amount_cents == 10000 and score_delta_applied == 10.0 are retained on the reversed row for audit while contributing 0 to both ledgers"
            - "DistributorChargeback.${cb2_id}.tier_rate_cents_per_unit == 4000 unchanged — the surviving row keeps the tier snapshot taken from the score that has since been reversed; tiers are never re-priced retroactively"
            - "Distributor.${d_id}.shipped_units_total == 2 and both SerialUnits remain TRACED_UNAUTHORIZED"
