# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_3219
# Local Newspaper Consolidation, Print Site Closure & Delivery Outsourcing
#
# Every instance grounds in an element already declared in SCAFFOLD.yaml
# §1.1–§1.6. Setup chains are empty-DB reachable through §1.5 endpoints only.
# All numeric assertions are literal values computed from the §1.3 formulas.
#
# Reference pin used by several instances:
#   hub total_newsroom_headcount 30, transfer_cost_ceiling_cents 20000
#   site KOT: 2 presses * 2 shifts * 8h * 25000 cph = 800000 capacity
#   market Riverton: deadline 05:30, margin 30, per_copy_revenue 45,
#                    weighted_demand_units 7000, floor 8000
#   route KOT->Riverton: transit 120, cutoff 01:00, buffer 45
#     distance_miles = round(120/60*55,2) = 110.00
#     marginal_mileage_cost = 50*0.90 + 60*0.75 + 0*0.60 = 90.00
#     route_transport_cost (5 stops) = 90.00 + 6.25 = 96.25
#     route_transport_cost (3 stops) = 90.00 + 3.75 = 93.75
#     marginal_cost_per_copy_cents (28000 copies, cost 113.75) = 0.0041
#   site CED: 1 press * 2 shifts * 8h * 25000 cph = 400000 capacity
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: site_savings_forward_vs_chronological
        grounds:
          - calculations.print_site_close_savings
          - entities.PrintSite.fields.annualized_savings_cents
          - entities.PrintSite.fields.realized_savings_cents
          - entities.PrintSite.fields.savings_divergence_cents
          - endpoints.POST_/regional-news-ops/_print-volume/records
        distinguishing_aspect: "The dual variant is computed on the PrintSite cost-avoidance domain: the forward variant annualizes the observed per-run mean across all 30 window days (480000.0) while the chronological variant adds only elapsed days' own charges (330000.0), so savings_divergence_cents is exactly 150000.00 for one and the same site."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT and site CED created; 15 contract-days of 10000-cent press-volume charge recorded for KOT inside the 30-day window, and 13 recorded zero-cent days, so no other day carries a charge."
          setup_api_calls:
            - &t_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-30T00:00:00Z" }
              as: PlatformAdmin
            - &t_hub
              call: "POST /regional-news-ops/region-hubs"
              payload: { name: "North Ridge Media Group", total_newsroom_headcount: 30, max_print_tonnage_budget_cents: 5000000, transfer_cost_ceiling_cents: 20000 }
              as: PlatformAdmin
              captures: { hub_id: $.data.id }
            - &t_site_kot
              call: "POST /regional-news-ops/region-hubs/${hub_id}/print-sites"
              payload: { code: "KOT", press_units: 2, shifts_per_night: 2, copies_per_hour_per_press: 25000, max_concurrent_departures: 2, allocation_method: "PRIORITY", distinct_shifts_per_night: 4, loading_slot_minutes: 30 }
              as: PrintOperationsDirector
              captures: { site_kot_id: $.data.id }
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-01", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-02", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-03", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-04", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-05", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-06", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-07", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-08", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-09", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-10", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-11", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-12", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-13", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-14", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-15", charge_cents: 10000 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-16", charge_cents: 0 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-17", charge_cents: 0 }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/_print-volume/records"
              payload: { print_site_id: "${site_kot_id}", day: "2026-09-18", charge_cents: 0 }
              as: PrintOperationsDirector
          trigger:
            - call: "GET /regional-news-ops/region-hubs/${hub_id}/print-sites"
              payload: {}
              as: PrintOperationsDirector
              captures: { site_kot_savings: "$.data[0].annualized_savings_cents", site_kot_realized: "$.data[0].realized_savings_cents", site_kot_divergence: "$.data[0].savings_divergence_cents" }
          assert:
            - "PrintSite KOT annualized_savings_cents == 480000.00"
            - "PrintSite KOT realized_savings_cents == 330000.00"
            - "PrintSite KOT savings_divergence_cents == 150000.00"
            - "PrintSite KOT annualized_savings_cents != PrintSite KOT realized_savings_cents"

      - name: single_copy_newsstand_vs_carrier_rule
        grounds:
          - calculations.single_copy_distribution_decision
          - entities.PrintMarket.fields.newsstand_contribution_cents
          - entities.PrintMarket.fields.carrier_contribution_cents
          - entities.PrintMarket.fields.single_copy_market_rule
          - entities.PrintMarket.fields.keeps_print_single_copy
        distinguishing_aspect: "The dual variant is computed on the PrintMarket single-copy assortment domain: for a 40000-copy run the newsstand rule yields 1,169,903.75 cents while the carrier rule yields 1,799,904.00 cents, and the record actually kept is the one named by single_copy_market_rule, not the larger of the two."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT, region North, market Riverton (single_copy_market_rule carrier, floor 8000) created; route KOT->Riverton created; 5 stops on a delivery route in Riverton; edition of 40000 12-page copies requested. Route transport cost with 5 stops is 96.25."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - &t_region_n
              call: "POST /regional-news-ops/region-hubs/${hub_id}/regions"
              payload: { name: "North", daily_headcount_floor: 4, daily_headcount_cap: 10, allocation_priority: 1 }
              as: PrintOperationsDirector
              captures: { reg_n_id: $.data.id }
            - &t_mkt_riv
              call: "POST /regional-news-ops/regions/${reg_n_id}/print-markets"
              payload: { name: "Riverton", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 7000, print_edition_per_week: 7, publication_deadline_utc: "05:30", on_time_margin_minutes: 30, guaranteed_floor_copies: 8000, single_copy_market_rule: "carrier" }
              as: PrintOperationsDirector
              captures: { mkt_riv_id: $.data.id }
            - &t_route_kot
              call: "POST /regional-news-ops/print-sites/${site_kot_id}/routes"
              payload: { destination_market_id: "${mkt_riv_id}", transit_minutes: 120, dispatch_cutoff_utc: "01:00", is_direct_hop: true, buffer_minutes: 45 }
              as: PrintOperationsDirector
              captures: { route_kot_id: $.data.id }
            - &t_contractor_cedar
              call: "POST /regional-news-ops/region-hubs/${hub_id}/delivery-contractors"
              payload: { name: "Cedar Hill Carriers", pay_basis: "PER_STOP", per_copy_rate_cents: 45, min_stop_guarantee: 3, net_60_available: true, cost_per_copy_ceiling_cents: 600, last_load_claim_weight_lbs: 0, sanction_reason_code: "NONE" }
              as: DeliveryNetworkManager
              captures: { con_cedar_id: $.data.id }
            - &t_droute_riv
              call: "POST /regional-news-ops/delivery-contractors/${con_cedar_id}/routes"
              payload: { print_market_id: "${mkt_riv_id}", route_code: "R1", stop_capacity: 6, per_stop_fee_cents: 1150, dist_per_stop_miles: 3.0, cost_per_copy_ceiling_cents: 600, printed_copies_surcharge_cents: 0, cost_run_date: "2026-09-10" }
              as: DeliveryNetworkManager
              captures: { droute_riv_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S1", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S2", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S3", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S4", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S5", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
            - call: "GET /regional-news-ops/region-hubs/${hub_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { hub_v1: $.data.version }
            - &t_plan_riv
              call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/plan-transfer"
              payload: { receiving_print_site_id: "${site_kot_id}", expected_hub_version: "${hub_v1}" }
              as: PrintOperationsDirector
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/editions"
              payload: { assigned_print_site_id: "${site_kot_id}", slug: "2026-09-21", page_count: 12, requested_print_run_copies: 40000, late_sports_engineering_flag: false, legal_notice_count: 0 }
              as: PrintOperationsDirector
              captures: { ed_riv_id: $.data.id }
          trigger:
            - call: "GET /regional-news-ops/print-markets/${mkt_riv_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { riv_newsstand: $.data.newsstand_contribution_cents, riv_carrier: $.data.carrier_contribution_cents, riv_keeps: $.data.keeps_print_single_copy, riv_rule: $.data.single_copy_market_rule }
          assert:
            - "PrintMarket Riverton newsstand_contribution_cents == 1169903.75"
            - "PrintMarket Riverton carrier_contribution_cents == 1799904.00"
            - "PrintMarket Riverton single_copy_market_rule == \"carrier\""
            - "PrintMarket Riverton keeps_print_single_copy == true"
            - "PrintMarket Riverton newsstand_contribution_cents != carrier_contribution_cents"

      - name: subscriber_credit_retained_margin_vs_refund_responsibility
        grounds:
          - calculations.subscriber_digital_migration_credit
          - entities.SubscriberContract.fields.migration_credit_cents
          - entities.SubscriberContract.fields.churn_retention_credit_cents
          - constants.ACTIVE_CONTRACT_CAP_CENTS
          - endpoints.POST_/regional-news-ops/subscribers/{id}/migrate-digital
        distinguishing_aspect: "The dual variant is computed on the SubscriberContract economics domain: migration_credit_cents counts what the publisher avoids spending (1440 cents for 18 remaining issues) while churn_retention_credit_cents counts what the subscriber is owed (5000 cents after the cap), and the two figures move in opposite directions as remaining_issues grows."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT, region North, market Riverton, route, contractor, one delivery route and one stop created; two subscriber contracts on that stop, one with 18 remaining issues and one with 50, both paid through 2027-01-01."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - *t_region_n
            - *t_mkt_riv
            - *t_route_kot
            - *t_contractor_cedar
            - *t_droute_riv
            - &t_stop_riv
              call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S1", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
              captures: { stop_riv_id: $.data.id }
            - &t_sub_short
              call: "POST /regional-news-ops/delivery-stops/${stop_riv_id}/subscribers"
              payload: { subscriber_ref: "SUB-SHORT", remaining_print_issues: 18, paid_through_utc: "2027-01-01T00:00:00Z", print_issue_value_cents: 1200 }
              as: CustomerService
              captures: { sub_short_id: $.data.id }
            - call: "POST /regional-news-ops/delivery-stops/${stop_riv_id}/subscribers"
              payload: { subscriber_ref: "SUB-LONG", remaining_print_issues: 50, paid_through_utc: "2027-01-01T00:00:00Z", print_issue_value_cents: 1200 }
              as: CustomerService
              captures: { sub_long_id: $.data.id }
          trigger:
            - call: "POST /regional-news-ops/subscribers/${sub_short_id}/migrate-digital"
              payload: {}
              as: CustomerService
              captures: { short_migration: $.data.migration_credit_cents }
            - call: "POST /regional-news-ops/subscribers/${sub_long_id}/refund"
              payload: {}
              as: CustomerService
              captures: { long_churn: $.data.churn_retention_credit_cents }
          assert:
            - "SubscriberContract SUB-SHORT migration_credit_cents == 1440"
            - "SubscriberContract SUB-LONG churn_retention_credit_cents == 5000"
            - "SubscriberContract SUB-LONG churn_retention_credit_cents is capped at the constant 5000 and is NOT 54000"
            - "SubscriberContract SUB-SHORT migration_credit_cents != SubscriberContract SUB-SHORT churn_retention_credit_cents"

      - name: press_allocation_priority_vs_proportional
        grounds:
          - calculations.allocated_print_run_copies
          - entities.PrintSite.fields.allocation_method
          - entities.LatestEdition.fields.allocated_print_run_copies
          - validations[priority=24]
        distinguishing_aspect: "The dual variant is computed on the PrintSite press-capacity allocation domain: on two sites with identical remaining capacity the PRIORITY site lets the requesting market take its whole request (40000 copies) while the PROPORTIONAL site scales it by the shared ratio (22222 copies), so the same request lands on two different allocated runs."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub with two regions and two print sites — KOT (allocation_method PRIORITY, capacity 800000) and CED (allocation_method PROPORTIONAL, capacity 400000) — plus markets Riverton and Fallow, each guaranteed_floor_copies 8000. CED already carries a 140000-copy edition for Fallow, so its remaining capacity is 260000."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - &t_site_ced
              call: "POST /regional-news-ops/region-hubs/${hub_id}/print-sites"
              payload: { code: "CED", press_units: 1, shifts_per_night: 2, copies_per_hour_per_press: 25000, max_concurrent_departures: 2, allocation_method: "PROPORTIONAL", distinct_shifts_per_night: 2, loading_slot_minutes: 30 }
              as: PrintOperationsDirector
              captures: { site_ced_id: $.data.id }
            - *t_region_n
            - &t_region_s
              call: "POST /regional-news-ops/region-hubs/${hub_id}/regions"
              payload: { name: "South", daily_headcount_floor: 3, daily_headcount_cap: 8, allocation_priority: 2 }
              as: PrintOperationsDirector
              captures: { reg_s_id: $.data.id }
            - *t_mkt_riv
            - &t_mkt_fal
              call: "POST /regional-news-ops/regions/${reg_s_id}/print-markets"
              payload: { name: "Fallow", per_copy_revenue_cents: 45, daily_route_cost_ceiling_cents: 9000, weighted_demand_units: 12000, print_edition_per_week: 7, publication_deadline_utc: "05:30", on_time_margin_minutes: 30, guaranteed_floor_copies: 8000, single_copy_market_rule: "carrier" }
              as: PrintOperationsDirector
              captures: { mkt_fal_id: $.data.id }
            - call: "POST /regional-news-ops/print-markets/${mkt_fal_id}/editions"
              payload: { assigned_print_site_id: "${site_ced_id}", slug: "2026-09-21", page_count: 12, requested_print_run_copies: 140000, late_sports_engineering_flag: false, legal_notice_count: 0 }
              as: PrintOperationsDirector
          trigger:
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/editions"
              payload: { assigned_print_site_id: "${site_kot_id}", slug: "2026-09-21", page_count: 12, requested_print_run_copies: 40000, late_sports_engineering_flag: false, legal_notice_count: 0 }
              as: PrintOperationsDirector
              captures: { riv_alloc: $.data.allocated_print_run_copies }
            - call: "POST /regional-news-ops/print-markets/${mkt_fal_id}/editions"
              payload: { assigned_print_site_id: "${site_ced_id}", slug: "2026-09-22", page_count: 12, requested_print_run_copies: 40000, late_sports_engineering_flag: false, legal_notice_count: 0 }
              as: PrintOperationsDirector
              captures: { fal_alloc: $.data.allocated_print_run_copies }
          assert:
            - "LatestEdition Riverton 2026-09-21 allocated_print_run_copies == 40000"
            - "LatestEdition Fallow 2026-09-22 allocated_print_run_copies == 22222"
            - "LatestEdition Fallow 2026-09-22 allocated_print_run_copies != 40000 and != 26666"
            - "PrintSite CED allocation_method == \"PROPORTIONAL\" and PrintSite KOT allocation_method == \"PRIORITY\""

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: press_run_hours_nested_rounding_order_pinned
        grounds:
          - calculations.press_run_hours
          - entities.LatestEdition.fields.press_run_hours
          - entities.LatestEdition.fields.latest_edition_ready_utc
          - constants.QUARTER_HOUR_MINUTES
        distinguishing_aspect: "This instance exercises combinatorial mode (b): the division chain collapses to one raw duration that is rounded up to the next quarter hour exactly once, and rounding the per-press throughput to an integer first yields 2.00 hours instead of the pinned 2.25 hours for one and the same 180000-copy 12-page run."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT (2 presses, 2 shifts, 25000 cph), region North, market Riverton (deadline 05:30, margin 30), route KOT->Riverton (transit 120, cutoff 01:00, buffer 45) created and selected."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - *t_region_n
            - *t_mkt_riv
            - *t_route_kot
            - call: "GET /regional-news-ops/region-hubs/${hub_id}"
              payload: {}
              as: PrintOperationsDirector
              captures: { hub_v1: $.data.version }
            - *t_plan_riv
          trigger:
            - call: "POST /regional-news-ops/print-markets/${mkt_riv_id}/editions"
              payload: { assigned_print_site_id: "${site_kot_id}", slug: "2026-09-21", page_count: 12, requested_print_run_copies: 180000, late_sports_engineering_flag: false, legal_notice_count: 0 }
              as: PrintOperationsDirector
              captures: { ed_hours: $.data.press_run_hours, ed_ready: $.data.latest_edition_ready_utc }
          assert:
            - "LatestEdition 2026-09-21 press_run_hours == 2.25"
            - "LatestEdition 2026-09-21 press_run_hours != 2.00"
            - "LatestEdition 2026-09-21 latest_edition_ready_utc == 2026-09-21T07:00:00Z, computed as cutoff 01:00 + 60 minutes of make-ready + 2.25 hours of press run + 120 minutes of transit + 45 minutes of buffer"
            - "LatestEdition 2026-09-21 minutes_late == 90"

      - name: delivery_night_cost_tier_then_surcharge_order
        grounds:
          - calculations.delivery_route_night_cost
          - entities.DeliveryRoute.fields.base_cost_cents
          - entities.DeliveryRoute.fields.copy_volume_tier_pct
          - entities.DeliveryRoute.fields.contractor_status_factor
          - entities.DeliveryRoute.fields.route_night_cost
          - constants.TIER_3_MAX_COPIES
        distinguishing_aspect: "This instance exercises combinatorial mode (a): a >=3-input non-linear formula in which the copy-volume tier is selected from the pre-discount copy count, then multiplied by the contractor sanction factor, then floored base + surcharge are combined — a 28000-copy run on a TERMINATED contractor yields 5376.25 cents, not the 6325.00 cents the same route costs while active."
        test_recipe:
          setup:
            - "Logical clock 2026-09-30T00:00:00Z; hub, site KOT, region North, market Riverton, route, contractor Cedar Hill (PER_STOP, min_stop_guarantee 3, per_copy_rate 45) and delivery route R1 (per_stop_fee 1150, surcharge 0) created; 5 stops; a 28000-copy r12 edition delivered in Riverton and costed on 2026-09-20."
          setup_api_calls:
            - *t_clock
            - *t_hub
            - *t_site_kot
            - *t_region_n
            - *t_mkt_riv
            - *t_route_kot
            - *t_contractor_cedar
            - *t_droute_riv
            - call: "POST /regional-news-ops/delivery-routes/${droute_riv_id}/stops"
              payload: { print_market_id: "${mkt_riv_id}", stop_code: "S1", contracted_daily_copies: 500, contracted_daily_fee_cents: 1200, pause_start_date: "2026-10-05", pause_end_date: "2026-10-09" }
              as: DeliveryNetworkManager
