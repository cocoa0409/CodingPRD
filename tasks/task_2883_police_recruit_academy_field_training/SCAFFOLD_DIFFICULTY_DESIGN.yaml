            - "One CertificationStandard whose only topic_requirements key is PATROL (exam_required true); FIREARMS is not a key of it."
            - "Recruit A has one ORDERED BACKGROUND screening, so pipeline_stage is SCREENING, clearance_status PENDING and academy_status NOT_STARTED."
            - "Recruit B is cleared through all four screenings and advanced to ACADEMY, so academy_status is IN_PROGRESS."
