          difficulty_instance: "transitive_cascade / content_edit_apply_four_hop_staleness_cascade"
          rationale: |
            That instance walks the same four-hop chain the layer describes and asserts every hop's
            field, so a second §1.9 instance would only re-run it with different literals.

      - name: dual_variant_calculation_layer_covered_by_difficulty_design
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        distinguishing_aspect: |
          Both declared dual-variant calculations - coverage and order total value - are already
          exercised in both variants with an asserted delta.
        excluded_because:
          difficulty_instance: "dual_variant_calc / order_quoted_vs_contracted_total_value"
          rationale: |
            The quoted/contracted variant pair and the self-reported/verified coverage pair are both
            covered by the dual_variant_calc rule instances, which assert each variant's value and
            the delta between them on identical inputs.

  - section: consistency_model
    instances:
      - name: filing_response_already_carries_every_derived_field
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /submissions/{id}/file]
        distinguishing_aspect: |
          The file response body itself already contains pinned_content_revision 1,
          self_reported_coverage_pct 100.00, verified_coverage_pct 0.00 and compliance_score 100 - a
          follow-up GET returns byte-identical values, so nothing about the filing is deferred.
        test_recipe:
          setup:
            - "State TX is OPEN_TERRITORY with min_verified_coverage_pct 50.00 and exactly one grade-4 MATH standard TX.M.4.1 at weight 4"
            - "The DRAFT submission carries one MASTERY correlation against that standard and no committee verdicts"
            - "The clock sits at 2026-09-15 with the cycle OPEN"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "TX", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, min_verified_coverage_pct: 50.00 }
              as: PlatformAdmin
              captures: { st_tx_id: $.data.id }
            - call: "POST /state-profiles/${st_tx_id}/standards"
              payload: { subject: "MATH", standard_code: "TX.M.4.1", grade_low: 4, grade_high: 4, weight: 4 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tx_id}"
            - call: "POST /adoption-cycles"
              payload: { state_id: "${st_tx_id}", subject: "MATH", cycle_year: 2027, submission_open_at: "2026-09-01T00:00:00Z", submission_deadline_at: "2026-10-01T00:00:00Z", committee_review_at: "2026-10-15T00:00:00Z", public_comment_start_at: "2026-11-01T00:00:00Z", public_comment_end_at: "2026-11-15T00:00:00Z", adoption_decision_at: "2026-12-01T00:00:00Z", contract_term_years: 6 }
              as: StateAdoptionOfficer
              as_user_id: "${st_tx_id}"
              captures: { cyc_id: $.data.id }
            - call: "POST /titles"
              payload: { isbn_base: "9780000014801", subject: "MATH", grade_low: 4, grade_high: 4, copyright_year: 2026, content_tags: ["FRACTION_MODELS"], page_count: 290, signature_page_capacity: 384, list_price_cents: 8800 }
              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /titles/${ttl_id}/release"
              payload: {}
              as: PublisherEditor
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
            - call: "POST /submissions/${sub_id}/correlations"
              payload: { standard_code: "TX.M.4.1", depth_level: "MASTERY", page_reference: "pp. 18-70", evidence_citation: "Unit 1 develops and assesses the standard to mastery." }
              as: PublisherEditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /adoption-cycles/${cyc_id}/phase-advance"
              payload: {}
              as: StateAdoptionOfficer
              as_user_id: "${st_tx_id}"
          trigger:
            - call: "POST /submissions/${sub_id}/file"
              payload: {}
              as: PublisherEditor
              captures: { r_status: $.data.review_status, r_pin: $.data.pinned_content_revision, r_self: $.data.self_reported_coverage_pct, r_verified: $.data.verified_coverage_pct, r_score: $.data.compliance_score, r_blocked: $.data.adoption_blocked, r_filed_at: $.data.filed_at }
            - call: "GET /submissions/${sub_id}"
              as: PublisherEditor
              captures: { g_status: $.data.review_status, g_pin: $.data.pinned_content_revision, g_self: $.data.self_reported_coverage_pct, g_verified: $.data.verified_coverage_pct, g_score: $.data.compliance_score, g_blocked: $.data.adoption_blocked, g_filed_at: $.data.filed_at }
          assert:
            - "r_status == FILED and r_pin == 1 and r_self == 100.00 and r_verified == 0.00 and r_score == 100 and r_blocked == false"
            - "r_filed_at == 2026-09-15T00:00:00Z"
            - "g_status == r_status and g_pin == r_pin and g_self == r_self and g_verified == r_verified and g_score == r_score and g_blocked == r_blocked and g_filed_at == r_filed_at"
            - "AdoptionCycle.${cyc_id}.submission_count == 1"
