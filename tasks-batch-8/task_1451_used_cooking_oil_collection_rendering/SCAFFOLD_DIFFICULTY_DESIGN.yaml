          Entity pair PickupVisit x Container: the EN_ROUTE -> COMPLETED transition is guarded by the
          linked container's state; once the container flips to LOCKED (via theft confirm) the visit can
          no longer complete even though every visit-local precondition passes.
        test_recipe:
          setup:
            - "Customer ACTIVE with contract; container (cap 300, est 100) ACTIVE; manifest 2026-08-05 dispatched; visit EN_ROUTE at clock 2026-08-05"
