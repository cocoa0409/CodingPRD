              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /dog-park/members"
              payload: { full_name: "M Two", email: "m2@x.com" }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /dog-park/members/${m2_id}/dogs"
              payload: { name: "Gus", size_class: "SMALL", license_number: "LIC-B", vaccination_expires_on: "2027-06-01" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { dg2_id: $.data.id }
            - call: "POST /dog-park/dogs/${dg2_id}/verify"
              payload: { decision: "VERIFIED" }
              as: ParkAdmin
            - call: "POST /dog-park/members/${m2_id}/memberships"
              payload: {}
              as: Member
              as_user_id: "${m2_id}"
          trigger:
            - call: "GET /dog-park/areas/${a_id}"
              payload: {}
              as: ParkAdmin
              captures: { o0: $.data.current_occupancy }
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${dg1_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { v1_id: $.data.id }
            - call: "POST /dog-park/visits/check-in"
              payload: { area_id: "${a_id}", dog_id: "${dg2_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { v2_id: $.data.id }
            - call: "GET /dog-park/areas/${a_id}"
              payload: {}
              as: ParkAdmin
              captures: { o2: $.data.current_occupancy }
            - call: "POST /dog-park/visits/${v1_id}/check-out"
              payload: {}
              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /dog-park/visits/${v2_id}/check-out"
