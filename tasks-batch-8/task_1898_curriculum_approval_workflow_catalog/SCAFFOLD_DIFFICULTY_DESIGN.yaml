  - rule_id: cross_entity_state_dependency
    instances:
      - name: proposal_submit_gated_by_term_state
        grounds:
          - state_machines.Proposal.DRAFT_to_DEPT_REVIEW
          - validations[priority=10]
          - entities.Term.fields.status
        distinguishing_aspect: |
          Entity pair Proposal -> Term: the DRAFT -> DEPT_REVIEW transition exists only
          while the requested Term is in OPEN_FOR_PROPOSALS; the identical submit against
          the same proposal shape fails with ERR_PROPOSAL_WINDOW_CLOSED once the term is
          PROPOSAL_FROZEN, and succeeds unchanged against a still-OPEN sibling term.
        test_recipe:
          setup:
            - "Department CS; T1 (2026FA seq 1) PROPOSAL_FROZEN via clock advance; T2 (2027SP seq 2) still OPEN_FOR_PROPOSALS"
            - "Proposal PA requests T1 (created while T1 was OPEN, left in DRAFT); proposal PB requests T2"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2027SP", academic_year: "2026-2027", sequence_index: 2, classes_start_date: "2027-01-16", classes_end_date: "2027-05-10", proposal_freeze_at: "2027-02-01T00:00:00Z", catalog_freeze_at: "2027-05-20T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t2: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "460", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { pa: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t2}", proposed_subject_code: "CS", proposed_course_number: "461", proposed_title: "B", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["b"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { pb: $.data.id } }
            - { call: "POST /curriculum/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "POST /curriculum/terms/${t1}/freeze-proposals", payload: {}, as: Registrar, as_user_id: "reg-1" }
          trigger:
            - { call: "POST /curriculum/proposals/${pa}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { pa_err: $.data.error_id } }
            - { call: "POST /curriculum/proposals/${pb}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { pb_status: $.data.status } }
          assert:
            - "captured pa_err == ERR_PROPOSAL_WINDOW_CLOSED (requested term PROPOSAL_FROZEN)"
            - "captured pb_status == DEPT_REVIEW (identical payload succeeds against the OPEN term)"
            - "Proposal.${pa}.status remains DRAFT"
      - name: course_retirement_gated_by_teach_out
        grounds:
          - state_machines.Course.DEACTIVATING_to_INACTIVE
          - state_machines.TeachOutPlan.IN_PROGRESS_to_COMPLETE
          - state_machines.TeachOutPlan.COMMITTED_to_IN_PROGRESS
        distinguishing_aspect: |
          Entity pair Course -> TeachOutPlan (different pair than Proposal -> Term): the
          course's DEACTIVATING -> INACTIVE transition has no direct endpoint and fires only
          as a cascade of the linked plan reaching COMPLETE; completing the plan is itself
          impossible before the proposal's activation flips the plan COMMITTED -> IN_PROGRESS.
        test_recipe:
          setup:
            - "Department CS; terms T1 (seq 1) and T2 (seq 2); ACTIVE course C (CS 301)"
            - "DEACTIVATION proposal on C (declared_remaining_cohorts 1, requested T2) with COMMITTED plan; proposal fully approved with effective term T1; T1 PROPOSAL_FROZEN; accreditor notification sent (FINAL score 50)"
          setup_api_calls:
