            - "RoyaltyStatement.${rs2}.status == RECEIVED   # period_index == 2 is adjacent-above and allowed"
            - "${st2} == RECEIVED"

  # ===========================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: earnout_unchanged_by_identical_receipts_resolve
        grounds:
          - calculations.advance_earnout
          - entities.Deal.fields.advance_earned_out_cents
        distinguishing_aspect: |
          Conserved quantity A — the monetary accumulator
          Deal.advance_earned_out_cents: forward action (reconcile, +965600)
          paired with its compensating action (open-audit then resolve-audit
          re-submitting IDENTICAL receipts, delta 0) must leave the field
          exactly unchanged; the invariant is
