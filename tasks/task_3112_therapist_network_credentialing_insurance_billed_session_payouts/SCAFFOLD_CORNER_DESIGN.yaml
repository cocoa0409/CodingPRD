            - call: "POST /network/sessions/${session_id}/notes"
              payload: { diagnosis_code: "F41.1", duration_minutes: 60, cpt_code: "90837", narrative: "Note for the resubmission-cap corner.", expected_session_version: "${session_v1}" }
              as: Clinician
              as_user_id: "${clinician_id}"
              captures: { note_id: $.data.id }
            - call: "POST /network/sessions/${session_id}/notes/${note_id}/sign"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/_clock/set_current_utc"
              payload: { current_utc: "2026-06-03T18:00:00Z" }
              as: OpsAdmin
            - call: "POST /network/sessions/${session_id}/complete"
              payload: {}
              as: Clinician
              as_user_id: "${clinician_id}"
            - call: "POST /network/claims"
              payload: { session_id: "${session_id}" }
              as: OpsAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /network/claims/${claim_id}/adjudicate"
              payload: { outcome: "DENIED", denial_code: "MISSING_DOCUMENTATION" }
              as: OpsAdmin
            - call: "POST /network/claims/${claim_id}/resubmit"
              payload: {}
              as: OpsAdmin
            - call: "POST /network/claims/${claim_id}/decide-reprocessing"
              payload: { outcome: "ACCEPTED" }
              as: OpsAdmin
            - call: "POST /network/claims/${claim_id}/adjudicate"
              payload: { outcome: "DENIED", denial_code: "MISSING_DOCUMENTATION" }
              as: OpsAdmin
            - call: "POST /network/claims/${claim_id}/resubmit"
              payload: {}
              as: OpsAdmin
            - call: "POST /network/claims/${claim_id}/decide-reprocessing"
              payload: { outcome: "REJECTED" }
              as: OpsAdmin
          trigger:
            - call: "POST /network/claims/${claim_id}/resubmit"
              payload: {}
              as: OpsAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "after the two completed cycles Claim.${claim_id}.resubmission_count == 2"
            - "the third resubmit returns status 422 and error_id == ERR_RESUBMISSION_LIMIT_REACHED"
            - "error_id != ERR_TIMELY_FILING_EXPIRED, because the 2026-06-03 clock is far inside the 90-day window"
            - "the second cycle's rejection recorded denial_code DUPLICATE, which the third attempt does not overwrite"
            - "GET /network/claims/${claim_id} still reports resubmission_count == 2 after the rejection"

      - name: completing_a_session_with_a_mismatched_note_duration_returns_duration_mismatch
        claim_type: Violation -> Error
        grounds:
          - errors.ERR_DURATION_MISMATCH
          - state_machines.Session.transitions.SCHEDULED_to_COMPLETED
          - endpoints.POST_/network/sessions/{id}/complete
        distinguishing_aspect: "The duration gate compares the documented length against the scheduled length rather than against a fixed range, so a 50-minute note on a 60-minute session is refused with 422 ERR_DURATION_MISMATCH even though 50 minutes is itself inside the allowed 45-to-120 signing range."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z, then 2026-06-03T18:00:00Z; a scheduled 60-minute session with a signed 50-minute note."
          setup_api_calls:
            - *c_clock
