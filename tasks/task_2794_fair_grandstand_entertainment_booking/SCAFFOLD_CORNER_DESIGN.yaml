      - name: offer_occ_token_refuses_a_revise_written_against_a_pre_counter_view
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.offer_revise_stale_offer
          - errors.ERR_STALE_OFFER_VERSION
          - validations.priority_24
          - state_machines.Offer.COUNTERED_to_SENT
        distinguishing_aspect: |
          The offer token catches the exact case the state machine cannot: the buyer read
          the offer while it was still DRAFT, the agent has since countered, and the
          status precondition for revise (COUNTERED) is now satisfied -- so only the
          version comparison stands between a stale revision and the ledger. The refusal
          is 412 ERR_STALE_OFFER_VERSION and, crucially, it does not consume a negotiation
          round.
        test_recipe:
          setup:
            - "Canonical edition, Grandstand stage, agent agent-hollis, artist Dust Road Revival."
            - "The offer is created and its version is captured IMMEDIATELY, before send, so the captured token is two writes behind by the time the revise is attempted."
            - "send stamps OfferRound 1 and the agent's counter stamps OfferRound 2, so round_count is 2 and the round cap of 3 cannot be the reason for any refusal below."
