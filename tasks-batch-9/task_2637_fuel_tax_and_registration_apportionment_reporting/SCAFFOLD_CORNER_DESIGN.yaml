        claim_type: peer_role_isolation
        grounds:
          - roles.CarrierAdmin.identity
          - validations[15].ERR_CARRIER_SCOPE_VIOLATION
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / credential_distribution_blocked_when_driver_deactivated_by_revocation
          rationale: "The CarrierAdmin scope boundary is exercised there through its own carrier's revoked drivers, and the §1.9 validations section already pins the ERR_CARRIER_SCOPE_VIOLATION body-versus-identity case on trip creation."

