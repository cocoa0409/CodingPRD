# =============================================================================
# Task 1423 — Drywall & Interior-Finish Supply with Stocking Service
# Seed tables (§1.0–§1.7). Difficulty and corner designs live in sibling files.
# =============================================================================

scenario: |
  Drywall & Interior-Finish Supply with Stocking Service (L&W Supply): board
  type/size takeoff & load build, boom-truck stocking by floor & room, jobsite
  scheduling around framing progress, contractor account & progress billing,
  breakage/waste allowance, special order (fire/moisture rated) lead time,
  return of partial bundles, freight surcharge on distance

domain_name: drywall-stocking
api_prefix: /supply

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ContractorAccount
    parent: null
    common_fields: true
    fields:
      - { name: company_name, type: string, source: input, description: "Legal name of the contractor company" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding AR the supply house extends to this account; integer cents, must be >= 0" }
      - { name: default_waste_pct_bp, type: integer, source: input, description: "Default breakage/waste allowance for takeoffs on this account, expressed in basis points (10000 = 100%); range 0–2000" }
      - { name: ar_outstanding_cents, type: integer, source: computed, description: "Sum of DrawRequest.requested_cents for draws in status ISSUED minus sum of Payment.amount_cents applied against those draws" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CLOSED — SUSPENDED blocks new takeoff submission and new draw issuance" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer SKU code; unique across all Products" }
      - { name: board_kind, type: enum, source: input, description: "REGULAR | FIRE_RATED | MOISTURE_RATED — special-order kinds are FIRE_RATED and MOISTURE_RATED" }
      - { name: length_ft, type: integer, source: input, description: "Board length in feet; one of 8, 10, 12, 14, 16" }
      - { name: width_ft, type: integer, source: input, description: "Board width in feet; always 4" }
      - { name: thickness_in, type: enum, source: input, description: "1/2 | 5/8 | 3/4" }
      - { name: sheets_per_bundle, type: integer, source: input, description: "Sheets per factory bundle; > 0" }
      - { name: unit_price_cents_per_sheet, type: integer, source: input, description: "Base price per sheet, integer cents; > 0" }
      - { name: lead_time_days, type: integer, source: input, description: "Days from special-order placement to warehouse receipt; 0 for REGULAR, >= 1 for rated kinds" }
      - { name: active, type: boolean, source: system, description: "Deactivated products may not appear on new takeoff lines" }

  - name: Project
    parent: ContractorAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> ContractorAccount.id; owning contractor" }
      - { name: jobsite_name, type: string, source: input, description: "Human-readable jobsite name" }
      - { name: distance_miles, type: integer, source: input, description: "One-way driving distance from warehouse to jobsite in whole miles; > 0" }
      - { name: framing_pct_complete, type: integer, source: input, description: "Foreman-reported framing progress, integer 0..100; gates stocking-window opening" }
      - { name: status, type: enum, source: system, description: "PLANNING → STOCKING_OPEN → STOCKING_CLOSED | CANCELLED" }

  - name: Takeoff
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: waste_pct_bp_override, type: integer, source: input, description: "Optional per-takeoff waste allowance override in basis points; when null the account default applies", constraints: "0..2000 or null" }
      - { name: base_sheet_count, type: integer, source: computed, description: "Sum of sheet_count across TakeoffLine rows in status ACTIVE" }
      - { name: billable_sheet_count, type: integer, source: computed, description: "base_sheet_count rounded up to whole sheets after applying waste_pct" }
      - { name: quoted_subtotal_cents, type: integer, source: computed, description: "Sum of per-line quoted_line_cents (provisional variant, computed on submit)" }
      - { name: final_subtotal_cents, type: integer, source: computed, description: "Sum of per-line final_line_cents (final variant, computed on lock)" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → LOCKED | CANCELLED" }

  - name: TakeoffLine
    parent: Takeoff
    common_fields: true
    fields:
      - { name: takeoff_id, type: string, source: system, description: "FK -> Takeoff.id" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: sheet_count, type: integer, source: input, description: "Net sheets required (before waste allowance); > 0" }
      - { name: waste_sheets, type: integer, source: computed, description: "ceil(sheet_count * effective_waste_pct_bp / 10000); recomputed at submit and at lock" }
      - { name: bundle_count, type: integer, source: computed, description: "ceil((sheet_count + waste_sheets) / sheets_per_bundle)" }
      - { name: quoted_line_cents, type: integer, source: computed, description: "bundle_count * sheets_per_bundle * unit_price_cents_per_sheet, with prices snapped at submit" }
      - { name: final_line_cents, type: integer, source: computed, description: "Re-priced at lock with current Product.unit_price_cents_per_sheet and current waste; only populated after LOCKED" }
      - { name: line_status, type: enum, source: system, description: "ACTIVE | CANCELLED — cancelled lines excluded from aggregates" }

  - name: StockingOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: takeoff_id, type: string, source: input, description: "FK -> Takeoff.id; the locked takeoff this order is built from" }
      - { name: scheduled_date, type: string, source: input, description: "ISO 8601 calendar date (YYYY-MM-DD) the boom truck is scheduled" }
      - { name: shift_window, type: enum, source: input, description: "AM | PM — the half-day window the truck is reserved" }
      - { name: boom_truck_id, type: string, source: input, description: "FK -> BoomTruck.id the order is reserved against" }
      - { name: freight_charge_cents, type: integer, source: computed, description: "Tiered distance surcharge on the project; computed at order creation and re-validated at dispatch" }
      - { name: status, type: enum, source: system, description: "DRAFT → SCHEDULED → DISPATCHED → STOCKED | CANCELLED" }

  - name: StockingDrop
    parent: StockingOrder
    common_fields: true
    fields:
      - { name: stocking_order_id, type: string, source: system, description: "FK -> StockingOrder.id" }
      - { name: floor_label, type: string, source: input, description: "Floor identifier, e.g. 'L1', 'P2'" }
      - { name: room_label, type: string, source: input, description: "Room identifier within the floor" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id for the boards dropped in this room" }
      - { name: bundle_count, type: integer, source: input, description: "Whole bundles placed in this room; > 0" }
      - { name: sheet_weight_lbs, type: integer, source: computed, description: "bundle_count * sheets_per_bundle * per-sheet weight lookup — used for boom capacity check" }

  - name: BoomTruck
    parent: null
    common_fields: true
    fields:
      - { name: truck_code, type: string, source: input, description: "Unique human-readable truck identifier" }
      - { name: max_bundle_capacity, type: integer, source: input, description: "Maximum whole bundles the boom can carry on one trip; > 0" }
      - { name: max_weight_lbs, type: integer, source: input, description: "Maximum payload weight in lbs; > 0" }
      - { name: active, type: boolean, source: system, description: "Inactive trucks cannot be reserved for new orders" }

  - name: DrawRequest
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id" }
      - { name: stocking_order_id, type: string, source: input, description: "FK -> StockingOrder.id the draw bills against" }
      - { name: requested_cents, type: integer, source: computed, description: "Amount to bill = locked_takeoff_share_of_order + freight_charge_cents; computed at issuance" }
      - { name: status, type: enum, source: system, description: "ISSUED | PARTIALLY_PAID | PAID | VOIDED" }
      - { name: paid_cents, type: integer, source: computed, description: "Sum of Payment.amount_cents applied to this draw" }

  - name: Payment
    parent: DrawRequest
    common_fields: false
    fields:
      - { name: draw_request_id, type: string, source: system, description: "FK -> DrawRequest.id the payment applies to" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents; > 0; overpayment beyond (requested_cents - paid_cents) is rejected" }
      - { name: method, type: enum, source: input, description: "ACH | CHECK | CARD" }
      - { name: received_at, type: datetime, source: input, description: "ISO 8601 timestamp of receipt; used to order payment application" }

  - name: BundleReturn
    parent: StockingOrder
    common_fields: true
    fields:
      - { name: stocking_order_id, type: string, source: system, description: "FK -> StockingOrder.id the return is filed against" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id of the returned boards" }
      - { name: bundles_returned, type: integer, source: input, description: "Whole bundles returned; >= 0" }
      - { name: loose_sheets_returned, type: integer, source: input, description: "Loose sheets returned from a partially-opened bundle; >= 0 and < sheets_per_bundle for the product" }
      - { name: restock_fee_cents, type: integer, source: computed, description: "Per-line restocking fee; computed by restock_fee rule" }
      - { name: credit_cents, type: integer, source: computed, description: "Credit granted to account = refunded material value minus restock_fee_cents" }
      - { name: status, type: enum, source: system, description: "PENDING_INSPECTION → ACCEPTED | REJECTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ContractorAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: POST /supply/contractor-accounts/{id}/suspend
        actor: CreditManager
        preconditions:
          - "Account must be ACTIVE (ERR_ACCOUNT_NOT_ACTIVE)"
        side_effects:
          - "All DRAFT takeoffs on projects of this account → CANCELLED (releases no stock)"
          - "New takeoff submission on any of the account's projects → ERR_ACCOUNT_SUSPENDED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: POST /supply/contractor-accounts/{id}/reinstate
        actor: CreditManager
        preconditions:
          - "Account must be SUSPENDED"
          - "ar_outstanding_cents <= credit_limit_cents"
        side_effects:
          - "Takeoff submission unblocked for the account's projects"

      - from: ACTIVE
        to: CLOSED
        trigger: POST /supply/contractor-accounts/{id}/close
        actor: CreditManager
        preconditions:
          - "Account must be ACTIVE or SUSPENDED"
          - "ar_outstanding_cents == 0 (ERR_ACCOUNT_BALANCE_OPEN)"
        side_effects:
          - "All non-terminal projects on the account → CANCELLED"
          - "All non-terminal StockingOrders on those projects → CANCELLED (cascade)"

  - entity: Project
    initial_state: PLANNING
    terminal_states: [STOCKING_CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: STOCKING_OPEN
        trigger: POST /supply/projects/{id}/open-stocking
        actor: Foreman
        preconditions:
          - "framing_pct_complete >= 50 (ERR_FRAMING_NOT_READY)"
          - "Account is ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "Project has at least one LOCKED Takeoff (ERR_NO_LOCKED_TAKEOFF)"
        side_effects:
          - "StockingOrder creation unblocked for this project"

      - from: STOCKING_OPEN
        to: STOCKING_CLOSED
        trigger: POST /supply/projects/{id}/close-stocking
        actor: Foreman
        preconditions:
          - "No StockingOrder for this project in SCHEDULED or DISPATCHED (ERR_ORDERS_IN_FLIGHT)"
        side_effects:
          - "New StockingOrder creation blocked for this project"
          - "DRAFT StockingOrders for this project → CANCELLED"

      - from: PLANNING
        to: CANCELLED
        trigger: POST /supply/projects/{id}/cancel
        actor: ContractorAdmin
        preconditions: []
        side_effects:
          - "All non-terminal Takeoffs on the project → CANCELLED"

      - from: STOCKING_OPEN
        to: CANCELLED
        trigger: POST /supply/projects/{id}/cancel
        actor: ContractorAdmin
        preconditions:
          - "No StockingOrder in DISPATCHED (ERR_ORDERS_IN_FLIGHT)"
        side_effects:
          - "DRAFT and SCHEDULED StockingOrders → CANCELLED (frees boom-truck reservations)"
          - "All non-terminal Takeoffs on the project → CANCELLED"

  - entity: Takeoff
    initial_state: DRAFT
    terminal_states: [LOCKED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /supply/takeoffs/{id}/submit
        actor: EstimatorUser
        preconditions:
          - "Account of the parent project is ACTIVE (ERR_ACCOUNT_SUSPENDED)"
          - "Takeoff has at least one TakeoffLine with line_status == ACTIVE (ERR_EMPTY_TAKEOFF)"
        side_effects:
          - "Compute base_sheet_count, billable_sheet_count, quoted_subtotal_cents using provisional pricing (current Product.unit_price_cents_per_sheet)"
          - "For every ACTIVE line: compute waste_sheets, bundle_count, quoted_line_cents"
          - "Every FIRE_RATED or MOISTURE_RATED line triggers a special-order lead-time check: project.framing_pct_complete must be >= 30 OR a regular substitute must exist (ERR_SPECIAL_ORDER_LEAD_TIME)"

      - from: SUBMITTED
        to: LOCKED
        trigger: POST /supply/takeoffs/{id}/lock
        actor: EstimatorUser
        preconditions:
          - "Takeoff must be SUBMITTED (ERR_TAKEOFF_NOT_SUBMITTED)"
          - "expected_takeoff_version == Takeoff.version (OCC)"
        side_effects:
          - "Recompute every ACTIVE line's final_line_cents using CURRENT Product.unit_price_cents_per_sheet and current effective waste"
          - "Recompute final_subtotal_cents; quoted_subtotal_cents is preserved for variance reporting"
          - "Increments Takeoff.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: POST /supply/takeoffs/{id}/cancel
        actor: EstimatorUser
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /supply/takeoffs/{id}/cancel
        actor: EstimatorUser
        preconditions:
          - "No StockingOrder references this takeoff with status SCHEDULED or DISPATCHED (ERR_TAKEOFF_IN_USE)"
        side_effects: []

  - entity: StockingOrder
    initial_state: DRAFT
    terminal_states: [STOCKED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: POST /supply/stocking-orders/{id}/schedule
        actor: DispatcherUser
        preconditions:
          - "Project.status == STOCKING_OPEN (ERR_PROJECT_NOT_STOCKING_OPEN)"
          - "Takeoff referenced by takeoff_id is LOCKED (ERR_TAKEOFF_NOT_LOCKED)"
          - "BoomTruck.active == true (ERR_TRUCK_INACTIVE)"
          - "Order has at least one StockingDrop (ERR_EMPTY_ORDER)"
          - "Sum of StockingDrop.bundle_count <= BoomTruck.max_bundle_capacity (ERR_CAPACITY_EXCEEDED)"
          - "Sum of StockingDrop.sheet_weight_lbs <= BoomTruck.max_weight_lbs (ERR_WEIGHT_EXCEEDED)"
          - "No other StockingOrder in SCHEDULED or DISPATCHED for same (boom_truck_id, scheduled_date, shift_window) — half-open interval [shift_start, shift_end) (ERR_SHIFT_DOUBLE_BOOKED)"
          - "scheduled_date >= today + max(lead_time_days) across drops' products that are FIRE_RATED or MOISTURE_RATED; regular products require scheduled_date >= today (ERR_LEAD_TIME_VIOLATION)"
        side_effects:
          - "Compute freight_charge_cents from Project.distance_miles using freight_tier rule"
          - "Reserve (boom_truck_id, scheduled_date, shift_window) — blocks other orders"

      - from: SCHEDULED
        to: DISPATCHED
        trigger: POST /supply/stocking-orders/{id}/dispatch
        actor: DispatcherUser
        preconditions:
          - "Order must be SCHEDULED"
          - "scheduled_date == today (ERR_NOT_DISPATCH_DAY)"
          - "Project.status == STOCKING_OPEN"
        side_effects:
          - "Recompute freight_charge_cents (final variant uses dispatch-day tier table)"
          - "Account.ar_outstanding_cents unchanged here (only draws move AR)"

      - from: DISPATCHED
        to: STOCKED
        trigger: POST /supply/stocking-orders/{id}/mark-stocked
        actor: Foreman
        preconditions:
          - "Order must be DISPATCHED"
        side_effects:
          - "Auto-issue a DrawRequest for this order: requested_cents computed per draw_amount rule"
          - "DrawRequest.status = ISSUED; Account.ar_outstanding_cents += requested_cents"
          - "If ar_outstanding_cents > credit_limit_cents after the increment, the Account transitions to SUSPENDED (cascading posture)"

      - from: DRAFT
        to: CANCELLED
        trigger: POST /supply/stocking-orders/{id}/cancel
        actor: DispatcherUser
        preconditions: []
        side_effects:
          - "Release boom-truck reservation (no-op since not yet reserved)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /supply/stocking-orders/{id}/cancel
        actor: DispatcherUser
        preconditions: []
        side_effects:
          - "Release (boom_truck_id, scheduled_date, shift_window) reservation"

  - entity: DrawRequest
    initial_state: ISSUED
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: ISSUED
        to: PARTIALLY_PAID
        trigger: POST /supply/draw-requests/{id}/payments (first payment with amount < remaining balance)
        actor: AccountsReceivableUser
        preconditions:
          - "Draw must be ISSUED or PARTIALLY_PAID"
          - "payment.amount_cents <= (requested_cents - paid_cents) (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_cents += amount_cents"
          - "Account.ar_outstanding_cents -= amount_cents"

      - from: ISSUED
        to: PAID
        trigger: POST /supply/draw-requests/{id}/payments (payment amount exactly equal to remaining balance)
        actor: AccountsReceivableUser
        preconditions:
          - "Draw must be ISSUED or PARTIALLY_PAID"
          - "payment.amount_cents == (requested_cents - paid_cents)"
        side_effects:
          - "paid_cents = requested_cents"
          - "Account.ar_outstanding_cents -= amount_cents"

      - from: PARTIALLY_PAID
        to: PAID
        trigger: POST /supply/draw-requests/{id}/payments (payment amount exactly equal to remaining balance)
        actor: AccountsReceivableUser
        preconditions: []
        side_effects:
          - "paid_cents = requested_cents"
          - "Account.ar_outstanding_cents -= amount_cents"

      - from: ISSUED
        to: VOIDED
        trigger: POST /supply/draw-requests/{id}/void
        actor: CreditManager
        preconditions:
          - "paid_cents == 0 (ERR_DRAW_HAS_PAYMENTS)"
        side_effects:
          - "Account.ar_outstanding_cents -= requested_cents"

  - entity: BundleReturn
    initial_state: PENDING_INSPECTION
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING_INSPECTION
        to: ACCEPTED
        trigger: POST /supply/bundle-returns/{id}/accept
        actor: WarehouseManager
        preconditions:
          - "Source StockingOrder must be STOCKED (ERR_ORDER_NOT_STOCKED)"
          - "Returned bundles + loose sheets for the product across all ACCEPTED returns on this order + this request <= bundles+loose delivered on the order (ERR_OVER_RETURN)"
          - "For REGULAR products only: returns of partial bundles allowed; FIRE_RATED/MOISTURE_RATED products are non-returnable (ERR_RATED_NON_RETURNABLE)"
        side_effects:
          - "Compute restock_fee_cents and credit_cents per restock_fee rule"
          - "Account.ar_outstanding_cents -= credit_cents (floor at 0)"

      - from: PENDING_INSPECTION
        to: REJECTED
        trigger: POST /supply/bundle-returns/{id}/reject
        actor: WarehouseManager
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: takeoff-lock-stale-version
    parent_entity: Takeoff
    write_endpoint: "POST /supply/takeoffs/{id}/lock"
    occ_field: "expected_takeoff_version"
    description: |
      Locking a Takeoff whose version has advanced since the client last observed
      it is rejected. This captures the case where another estimator has just
      edited or locked the takeoff (which legitimately supersedes the prior
      pricing snapshot under the lock rule) and the current writer's view of the
      takeoff is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: effective_waste_pct_bp
    trigger: "Takeoff line waste_sheets computation (submit and lock)"
    algorithm: forward_looking
    formula: |
      effective_waste_pct_bp = (takeoff.waste_pct_bp_override != null)
        ? takeoff.waste_pct_bp_override
        : account.default_waste_pct_bp
      waste_sheets = ceil(sheet_count * effective_waste_pct_bp / 10000)
      billable_sheet_count (takeoff) = sum over ACTIVE lines of (sheet_count + waste_sheets)
    input_set: "TakeoffLine rows of the takeoff with line_status == ACTIVE"
    precision: "waste_sheets is an integer; ceiling rounding"
    constants:
      BP_DENOMINATOR: 10000

  - name: line_bundle_count
    trigger: "Takeoff line submission / lock"
    algorithm: aggregation
    formula: |
      bundle_count = ceil((sheet_count + waste_sheets) / product.sheets_per_bundle)
      quoted_line_cents = bundle_count * product.sheets_per_bundle * product.unit_price_cents_per_sheet
    input_set: "ACTIVE TakeoffLine rows"
    precision: "integer cents"
    variants:
      - name: provisional
        when: "Computed at Takeoff SUBMITTED transition; prices snapped from current Product.unit_price_cents_per_sheet"
        difference: "Writes to quoted_line_cents / quoted_subtotal_cents only"
      - name: final
        when: "Computed at Takeoff LOCKED transition; prices re-read from CURRENT Product state (may have moved since submit)"
        difference: "Writes to final_line_cents / final_subtotal_cents; quoted_subtotal_cents is preserved"

  - name: freight_tier_cents
    trigger: "StockingOrder schedule (provisional) and dispatch (final)"
    algorithm: tiered_pricing
    formula: |
      d = project.distance_miles
      if d <= TIER1_MAX_MILES:               freight = TIER1_FLAT_CENTS
      elif d <= TIER2_MAX_MILES:             freight = TIER2_FLAT_CENTS + (d - TIER1_MAX_MILES) * TIER2_PER_MILE_CENTS
      else:                                  freight = TIER2_FLAT_CENTS + (TIER2_MAX_MILES - TIER1_MAX_MILES) * TIER2_PER_MILE_CENTS
                                                + (d - TIER2_MAX_MILES) * TIER3_PER_MILE_CENTS
      if order is dispatch-day re-quote (final variant):
        fuel_adj_bp = FUEL_SURCHARGE_BP
        freight = round_half_up(freight * (10000 + fuel_adj_bp) / 10000)
    input_set: "Project referenced by StockingOrder.project_id"
    constants:
      TIER1_MAX_MILES: 25
      TIER1_FLAT_CENTS: 9500
      TIER2_MAX_MILES: 75
      TIER2_FLAT_CENTS: 19500
      TIER2_PER_MILE_CENTS: 320
      TIER3_PER_MILE_CENTS: 480
      FUEL_SURCHARGE_BP: 750
    precision: "integer cents; final variant rounds half-up after applying fuel surcharge"
    variants:
      - name: provisional
        when: "At StockingOrder SCHEDULED transition; no fuel surcharge applied"
        difference: "No fuel multiplier"
      - name: final
        when: "At StockingOrder DISPATCHED transition; fuel surcharge applied on top of tiered freight"
        difference: "Multiplies by (1 + FUEL_SURCHARGE_BP/10000), then round_half_up to cents"

  - name: draw_amount
    trigger: "StockingOrder STOCKED transition (auto-issue DrawRequest)"
    algorithm: aggregation
    formula: |
      Let T = StockingOrder.takeoff_id, P = StockingOrder.project_id.
      Let all_lines   = TakeoffLine rows where takeoff_id == T AND line_status == ACTIVE
      Let order_skus  = distinct product_id across StockingDrop rows where stocking_order_id == this.id
      Let billed_lines = all_lines filtered to rows whose product_id ∈ order_skus
      material_cents  = sum over billed_lines of final_line_cents
      requested_cents = material_cents + StockingOrder.freight_charge_cents
    input_set: "ACTIVE TakeoffLine rows on the locked takeoff, filtered by SKUs actually stocked in this order's drops"
    precision: "integer cents"

  - name: restock_fee
    trigger: "BundleReturn ACCEPTED transition"
    algorithm: threshold
    formula: |
      Let P = Product referenced by product_id.
      Let delivered_bundles_on_order = sum of StockingDrop.bundle_count where stocking_order_id == order AND product_id == P
      Let days_since_stocked = floor((today - StockingOrder.stocked_at) in days)
      material_value_cents = (bundles_returned * P.sheets_per_bundle + loose_sheets_returned) * P.unit_price_cents_per_sheet
      restock_rate_bp =
        if days_since_stocked <= RESTOCK_FREE_DAYS: 0
        elif loose_sheets_returned == 0:           RESTOCK_FULL_BUNDLE_BP
        else:                                      RESTOCK_PARTIAL_BUNDLE_BP
      restock_fee_cents = round_half_up(material_value_cents * restock_rate_bp / 10000)
      credit_cents = material_value_cents - restock_fee_cents
    input_set: "BundleReturn being accepted; its StockingOrder; the referenced Product"
    constants:
      RESTOCK_FREE_DAYS: 7
      RESTOCK_FULL_BUNDLE_BP: 1500
      RESTOCK_PARTIAL_BUNDLE_BP: 2500
    precision: "integer cents; restock fee rounds half-up"

  - name: special_order_lead_time
    trigger: "Takeoff submit validation"
    algorithm: threshold
    formula: |
      Let rated_lines = ACTIVE TakeoffLine rows where Product.board_kind ∈ {FIRE_RATED, MOISTURE_RATED}
      If rated_lines is empty: pass.
      Else if project.framing_pct_complete < MIN_FRAMING_PCT_FOR_RATED: ERR_SPECIAL_ORDER_LEAD_TIME
    input_set: "ACTIVE TakeoffLine rows on the takeoff being submitted"
    constants:
      MIN_FRAMING_PCT_FOR_RATED: 30

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header must be present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role must be permitted to call this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path parameters must resolve (account, project, takeoff, line, order, drop, draw, payment, return, truck, product)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: state
    check: "Referenced Account must be ACTIVE for project/takeoff/stocking-order creation"
    error_id: ERR_ACCOUNT_SUSPENDED
    http_status: 409
    applies_to: "POST /supply/projects, POST /supply/takeoffs/{id}/submit, POST /supply/stocking-orders, POST /supply/draw-requests"

  - priority: 5
    category: state
    check: "Target entity must be in the correct state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_referential
    check: "Takeoff referenced by StockingOrder.takeoff_id must be LOCKED and belong to the same project"
    error_id: ERR_TAKEOFF_NOT_LOCKED
    http_status: 409
    applies_to: "POST /supply/stocking-orders/{id}/schedule"

  - priority: 7
    category: business_temporal
    check: "scheduled_date >= today + max(lead_time_days) across rated drops; >= today otherwise"
    error_id: ERR_LEAD_TIME_VIOLATION
    http_status: 422
    applies_to: "POST /supply/stocking-orders/{id}/schedule"

  - priority: 8
    category: business_temporal
    check: "Truck half-day slot must be free — half-open interval [shift_start, shift_end) on (boom_truck_id, scheduled_date, shift_window)"
    error_id: ERR_SHIFT_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /supply/stocking-orders/{id}/schedule"

  - priority: 9
    category: business_constraint
    check: "Total bundle_count of drops <= BoomTruck.max_bundle_capacity"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /supply/stocking-orders/{id}/schedule"

  - priority: 10
    category: business_constraint
    check: "Total sheet_weight_lbs of drops <= BoomTruck.max_weight_lbs"
    error_id: ERR_WEIGHT_EXCEEDED
    http_status: 422
    applies_to: "POST /supply/stocking-orders/{id}/schedule"

  - priority: 11
    category: business_safety
    check: "Rated board lines require project.framing_pct_complete >= 30 at takeoff submit"
    error_id: ERR_SPECIAL_ORDER_LEAD_TIME
    http_status: 422
    applies_to: "POST /supply/takeoffs/{id}/submit"

  - priority: 12
    category: business_fiscal
    check: "Payment amount must not exceed draw remaining balance"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /supply/draw-requests/{id}/payments"

  - priority: 13
    category: business_fiscal
    check: "Account close requires zero AR"
    error_id: ERR_ACCOUNT_BALANCE_OPEN
    http_status: 409
    applies_to: "POST /supply/contractor-accounts/{id}/close"

  - priority: 14
    category: business_referential
    check: "BundleReturn only valid on REGULAR products; FIRE_RATED / MOISTURE_RATED are non-returnable"
    error_id: ERR_RATED_NON_RETURNABLE
    http_status: 422
    applies_to: "POST /supply/bundle-returns, POST /supply/bundle-returns/{id}/accept"

  - priority: 15
    category: business_referential
    check: "Cumulative returned quantity for a product on an order must not exceed cumulative delivered quantity on that order"
    error_id: ERR_OVER_RETURN
    http_status: 422
    applies_to: "POST /supply/bundle-returns, POST /supply/bundle-returns/{id}/accept"

  - priority: 16
    category: business_temporal
    check: "Dispatch only allowed on the scheduled_date"
    error_id: ERR_NOT_DISPATCH_DAY
    http_status: 409
    applies_to: "POST /supply/stocking-orders/{id}/dispatch"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_takeoff_version must equal current Takeoff.version on lock"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /supply/takeoffs/{id}/lock"

  - priority: 18
    category: business_constraint
    check: "Takeoff must contain at least one ACTIVE line on submit"
    error_id: ERR_EMPTY_TAKEOFF
    http_status: 422
    applies_to: "POST /supply/takeoffs/{id}/submit"

  - priority: 19
    category: business_constraint
    check: "StockingOrder must contain at least one StockingDrop on schedule"
    error_id: ERR_EMPTY_ORDER
    http_status: 422
    applies_to: "POST /supply/stocking-orders/{id}/schedule"

  - priority: 20
    category: business_referential
    check: "BoomTruck must exist and be active"
    error_id: ERR_TRUCK_INACTIVE
    http_status: 422
    applies_to: "POST /supply/stocking-orders/{id}/schedule"

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

