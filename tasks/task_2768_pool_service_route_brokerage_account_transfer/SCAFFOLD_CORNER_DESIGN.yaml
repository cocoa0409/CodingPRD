              payload: {"decision": "APPROVE", "decided_on": "2026-08-05"}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: {"current_utc": "2026-08-12T00:00:00Z"}
              as: PlatformAdmin
            - call: "POST /license-transfers/${lt_lic}/apply"
              payload: {"applied_on": "2026-08-12"}
              as: Buyer
              as_user_id: "${buyer_id}"
            - call: "POST /license-transfers/${lt_lic}/decide"
              payload: {"decision": "APPROVE", "decided_on": "2026-08-12"}
              as: PlatformAdmin
            - call: "POST /license-transfers/${lt_lic}/apply"
              payload: {"applied_on": "2026-08-20"}
              as: Buyer
              as_user_id: "${buyer_id}"
          assert:
            - "first apply: HTTP 200, data.status == \"APPLIED\", data.applied_on == \"2026-08-01\", data.processing_window_end == \"2026-08-11\" (applied_on + the NV profile's 10 processing days) and data.attempt_count == 1."
            - "second apply from APPLIED: HTTP 409, data.error_id == \"ERR_LICENSE_TRANSFER_NOT_PENDING\"."
            - "waive from APPLIED: HTTP 409, data.error_id == \"ERR_LICENSE_TRANSFER_NOT_PENDING\" -- the reciprocity facts are all satisfiable (AZ buyer, LICENSED, AZ in the NV profile reciprocity_states), so only the status gate can be firing."
            - "decide DENY: HTTP 200, data.status == \"DENIED\", data.decided_on == \"2026-08-05\" and data.denial_reason_code is non-null."
            - "decide again from DENIED: HTTP 409, data.error_id == \"ERR_LICENSE_TRANSFER_NOT_PENDING\"."
            - "re-apply on 2026-08-12: HTTP 200, data.status == \"APPLIED\", data.attempt_count == 2, data.applied_on == \"2026-08-12\", data.processing_window_end == \"2026-08-22\" and data.denial_reason_code is null again."
            - "decide APPROVE: HTTP 200, data.status == \"APPROVED\" and data.decided_on == \"2026-08-12\"."
            - "apply from the terminal APPROVED: HTTP 409, data.error_id == \"ERR_LICENSE_TRANSFER_NOT_PENDING\"."

