# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1154: Rollover & Plan-to-Plan Transfer Processing
# 9 rules, 23 instances. All amounts in cents. Canonical fixture account A1:
#   PRE_TAX 8,000,000/0/100; EMPLOYER_PRETAX 2,000,000/0/60;
#   ROTH 1,000,000/800,000/100; AFTER_TAX 600,000/500,000/100
#   vested = 10,800,000; total = 11,600,000; basis = 1,300,000
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: tax_form_1099r_provisional_vs_corrected_after_shortfall
        grounds:
          - calculations.tax_form_amounts
          - state_machines.RolloverCase.AWAITING_REDEPOSIT_to_INCOMPLETE
        distinguishing_aspect: |
          Same indirect-rollover event data yields two different 1099-R taxable amounts
          depending on variant: the provisional variant drafted at issuance reports
          taxable_amount_cents == 9,500,000 (assumes nothing redeposited), while the
          corrected variant after the INCOMPLETE sweep reports 600,000
          (= 9,500,000 - min(8,900,000 credited, 9,500,000)). Entity domain: TaxForm.
        test_recipe:
          setup:
            - "Plan A (401K, default flags) and an IRA plan both exist"
            - "P1 dob 1960-06-15, SEPARATED 2026-04-15, SINGLE; account A1 with the canonical four money sources; empty IRA account A2"
            - "INDIRECT_ROLLOVER_OUT case on A1 (full vested election, withholding acknowledged), docs accepted, APPROVE by proc-1"
            - "Disbursement assembled by proc-2 and issued at clock 2026-06-01; deadline 2026-07-31; DRAFT 1099-R provisional taxable 9,500,000"
            - "Net-only redeposit 8,900,000 received 2026-07-01 CREDITED into A2"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /v1/plans", payload: { plan_name: "IRA Plan", plan_type: "IRA" }, as: PlanSponsorAdmin, captures: { plan_ira: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 }, { source_type: "EMPLOYER_PRETAX", balance_cents: 2000000, basis_cents: 0, vested_pct: 60 }, { source_type: "ROTH", balance_cents: 1000000, basis_cents: 800000, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_ira}" }, as: PlanSponsorAdmin, captures: { a2: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { d0: "$.data[0].id", d1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/issue-disbursement", payload: { method: "CHECK" }, as: RolloverProcessor, as_user_id: "proc-2", captures: { disb: "$.data.id" } }
            - { call: "POST /v1/disbursements/${disb}/issue", payload: {}, as: RolloverProcessor, as_user_id: "proc-2" }
            - { call: "GET /v1/tax-forms?rollover_case_id=${c1}&form_type=FORM_1099_R", as: TaxReportingOfficer, captures: { form1: "$.data[0].id", prov_taxable: "$.data[0].taxable_amount_cents", prov_code: "$.data[0].distribution_code" } }
            - { call: "POST /v1/redeposits", payload: { rollover_case_id: "${c1}", receiving_account_id: "${a2}", amount_cents: 8900000, received_date: "2026-07-01" }, as: RolloverProcessor, captures: { rd1: "$.data.id" } }
            - { call: "POST /v1/redeposits/${rd1}/credit", payload: {}, as: RolloverProcessor, as_user_id: "proc-2" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OperationsAgent }
          trigger:
            - { call: "POST /v1/sweeps/daily", payload: {}, as: OperationsAgent, captures: { sweep_incomplete: "$.data.cases_marked_incomplete" } }
            - { call: "GET /v1/tax-forms/${form1}", as: TaxReportingOfficer, captures: { corr_taxable: "$.data.taxable_amount_cents" } }
            - { call: "GET /v1/rollover-cases/${c1}", as: RolloverProcessor, captures: { case_status: "$.data.status" } }
          assert:
            - "provisional variant observed at issuance: ${prov_taxable} == 9500000 and ${prov_code} == CODE_7 (age_months 792 >= 714)"
            - "sweep result cases_marked_incomplete == 1 (${sweep_incomplete})"
            - "corrected variant after INCOMPLETE: TaxForm.${form1}.taxable_amount_cents == 600000 (${corr_taxable})"
            - "RolloverCase.${c1}.status == INCOMPLETE (${case_status})"
            - "TaxForm.${form1}.gross_distribution_cents == 10800000 and federal_withholding_cents == 1900000 (unchanged by correction)"

      - name: loan_offset_qualified_vs_standard_window
        grounds:
          - calculations.loan_offset_window
          - entities.Loan.fields.offset_rollover_deadline
        distinguishing_aspect: |
          Two loans with identical outstanding_balance_cents 250,000 offset on the same
          date 2026-06-01 produce different offset_rollover_deadline values purely from
          the variant: standard offset -> 2026-07-31 (60-day window), qualified plan loan
          offset (participant SEPARATED) -> 2027-10-15 (filing deadline incl. extensions).
          Entity domain: Loan — distinct from the TaxForm domain of the sibling instance.
        test_recipe:
          setup:
            - "Plan A exists; clock 2026-06-01"
            - "P_std ACTIVE dob 1970-01-01 SINGLE with account S holding PRE_TAX 1,000,000; loan LS outstanding 250,000"
            - "P_qual SEPARATED dob 1960-06-15 SINGLE with account Q holding PRE_TAX 1,000,000; loan LQ outstanding 250,000"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Stan Dard", date_of_birth: "1970-01-01", employment_status: "ACTIVE", marital_status: "SINGLE" }, as: PlanSponsorAdmin, captures: { ps: "$.data.id" } }
            - { call: "POST /v1/participants", payload: { full_name: "Que Alified", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { pq: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${ps}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 1000000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { acct_s: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${pq}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 1000000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { acct_q: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct_s}/loans", payload: { outstanding_balance_cents: 250000, interest_rate_bp: 500, term_months: 60 }, as: PlanSponsorAdmin, captures: { ls: "$.data.id" } }
            - { call: "POST /v1/accounts/${acct_q}/loans", payload: { outstanding_balance_cents: 250000, interest_rate_bp: 500, term_months: 60 }, as: PlanSponsorAdmin, captures: { lq: "$.data.id" } }
          trigger:
            - { call: "POST /v1/loans/${ls}/offset", payload: {}, as: RolloverProcessor, as_user_id: "proc-1", captures: { ls_qual: "$.data.offset_qualified", ls_deadline: "$.data.offset_rollover_deadline" } }
            - { call: "POST /v1/loans/${lq}/offset", payload: {}, as: RolloverProcessor, as_user_id: "proc-1", captures: { lq_qual: "$.data.offset_qualified", lq_deadline: "$.data.offset_rollover_deadline" } }
            - { call: "GET /v1/tax-forms?loan_id=${ls}", as: TaxReportingOfficer, captures: { ls_code: "$.data[0].distribution_code", ls_taxable: "$.data[0].taxable_amount_cents" } }
            - { call: "GET /v1/tax-forms?loan_id=${lq}", as: TaxReportingOfficer, captures: { lq_code: "$.data[0].distribution_code" } }
          assert:
            - "Loan.${ls}: offset_qualified == false (${ls_qual}) and offset_rollover_deadline == 2026-07-31 (${ls_deadline})"
            - "Loan.${lq}: offset_qualified == true (${lq_qual}) and offset_rollover_deadline == 2027-10-15 (${lq_deadline})"
            - "identical inputs (250000 outstanding, same offset date 2026-06-01) -> different deadlines per variant"
            - "1099-R for standard offset: taxable_amount_cents == 250000 (${ls_taxable}), distribution_code == CODE_1 (${ls_code}, age_months 677 < 714)"
            - "1099-R for qualified offset: distribution_code == CODE_7 (${lq_code}, age_months 792 >= 714)"

  - rule_id: combinatorial_formula
    instances:
      - name: partial_distribution_largest_remainder_rounding
        grounds:
          - calculations.source_allocation
        distinguishing_aspect: |
          Mode (b) nested rounding: the pinned floor-then-largest-remainder allocation of a
          1,000,000-cent partial distribution yields PRE_TAX 740,741 / EMPLOYER_PRETAX 111,111 /
          ROTH 92,593 / AFTER_TAX 55,555 (sum exactly 1,000,000); the alternative
          round-half-up-per-source order would sum to 1,000,001 — one cent of divergence the
          scaffold explicitly forbids.
        test_recipe:
          setup:
            - "Plan A, clock 2026-05-01; P1 SEPARATED SINGLE with canonical account A1"
            - "INDIRECT_ROLLOVER_OUT case, requested_amount_cents 1,000,000, acknowledged; docs accepted; approved by proc-1"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 }, { source_type: "EMPLOYER_PRETAX", balance_cents: 2000000, basis_cents: 0, vested_pct: 60 }, { source_type: "ROTH", balance_cents: 1000000, basis_cents: 800000, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", requested_amount_cents: 1000000, withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { d0: "$.data[0].id", d1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
          trigger:
            - { call: "POST /v1/rollover-cases/${c1}/issue-disbursement", payload: { method: "ACH" }, as: RolloverProcessor, as_user_id: "proc-2", captures: { gross: "$.data.gross_cents", wh: "$.data.withholding_cents", net: "$.data.net_cents", disb: "$.data.id" } }
            - { call: "GET /v1/rollover-cases/${c1}", as: RolloverProcessor, captures: { c_basis: "$.data.basis_portion_cents", c_taxable: "$.data.taxable_cents" } }
            - { call: "GET /v1/accounts/${a1}/source-balances", as: RolloverProcessor }
          assert:
            - "Disbursement gross_cents == 1000000 (${gross}), withholding_cents == 175926 (${wh}), net_cents == 824074 (${net})"
            - "RolloverCase.${c1}: basis_portion_cents == 120370 (${c_basis}) and taxable_cents == 879630 (${c_taxable})"
            - "per-source debits: PRE_TAX 740741 (balance now 7259259), EMPLOYER_PRETAX 111111 (now 1888889), ROTH 92593 (now 907407, basis now 725926), AFTER_TAX 55555 (now 544445, basis now 453704)"
            - "debit sum == 1000000 exactly; the forbidden round-half-up-per-source order would have produced 1000001"

      - name: eligibility_multi_input_branch
        grounds:
          - calculations.eligibility_determination
        distinguishing_aspect: |
          Mode (a) >=3-input conditional branching: three cases identical except one input
          each resolve to different qualifying_event branches — PLAN_TERMINATION (plan
          status), SEPARATION (employment status), AGE_59_HALF (age_months exactly 714) —
          and the pinned top-down branch order makes TERMINATION override employment.
        test_recipe:
          setup:
            - "Clock 2026-05-01; Plan T (will be terminated) and Plan A"
            - "P_term: ACTIVE, dob 1990-01-01, SINGLE, account in Plan T -> branch 1"
            - "P_sep: SEPARATED 2026-04-15, dob 1990-01-01, SINGLE, account in Plan A -> branch 2"
            - "P_age: ACTIVE, dob 1966-11-01, SINGLE, account in Plan A -> branch 4 (age_months == 714 exactly)"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan T", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_t: "$.data.id" } }
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Tee Rminated", date_of_birth: "1990-01-01", employment_status: "ACTIVE", marital_status: "SINGLE" }, as: PlanSponsorAdmin, captures: { p_term: "$.data.id" } }
            - { call: "POST /v1/participants", payload: { full_name: "Sep Arated", date_of_birth: "1990-01-01", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p_sep: "$.data.id" } }
            - { call: "POST /v1/participants", payload: { full_name: "Age Boundary", date_of_birth: "1966-11-01", employment_status: "ACTIVE", marital_status: "SINGLE" }, as: PlanSponsorAdmin, captures: { p_age: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p_term}", plan_id: "${plan_t}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a_term: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p_sep}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a_sep: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p_age}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 500000, basis_cents: 0, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a_age: "$.data.id" } }
            - { call: "POST /v1/plans/${plan_t}/terminate", payload: {}, as: PlanSponsorAdmin }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a_term}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p_term}", captures: { c_term: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a_sep}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p_sep}", captures: { c_sep: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a_age}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p_age}", captures: { c_age: "$.data.id" } }
          trigger:
            - { call: "POST /v1/rollover-cases/${c_term}/submit", payload: {}, as: Participant, as_user_id: "${p_term}", captures: { qe_term: "$.data.qualifying_event" } }
            - { call: "POST /v1/rollover-cases/${c_sep}/submit", payload: {}, as: Participant, as_user_id: "${p_sep}", captures: { qe_sep: "$.data.qualifying_event" } }
            - { call: "POST /v1/rollover-cases/${c_age}/submit", payload: {}, as: Participant, as_user_id: "${p_age}", captures: { qe_age: "$.data.qualifying_event" } }
          assert:
            - "RolloverCase.${c_term}.qualifying_event == PLAN_TERMINATION (${qe_term}) — plan-status branch overrides ACTIVE employment"
            - "RolloverCase.${c_sep}.qualifying_event == SEPARATION (${qe_sep})"
            - "RolloverCase.${c_age}.qualifying_event == AGE_59_HALF (${qe_age}) — age_months == 714 meets the >= 714 threshold exactly"
            - "all three cases reach DOCS_PENDING (none rejected with ERR_NOT_ELIGIBLE)"

      - name: gross_up_evaluation_order
        grounds:
          - calculations.indirect_withholding
        distinguishing_aspect: |
          Mode (c) pinned evaluation order for the circular-looking chain
          net = gross - withholding, withholding = 20% x taxable, taxable = gross - basis_share,
          basis_share = f(allocation of gross): executing (1) gross (2) basis (3) taxable
          (4) withholding (5) net on a full 10,800,000 indirect distribution yields
          taxable 9,500,000 / withholding 1,900,000 / net 8,900,000; net never re-enters taxable.
        test_recipe:
          setup:
            - "Plan A, clock 2026-06-01; P1 SEPARATED SINGLE with canonical account A1"
            - "Full-vested INDIRECT_ROLLOVER_OUT case approved by proc-1"
          setup_api_calls:
            - { call: "POST /v1/plans", payload: { plan_name: "Plan A", plan_type: "PLAN_401K" }, as: PlanSponsorAdmin, captures: { plan_a: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: OperationsAgent }
            - { call: "POST /v1/participants", payload: { full_name: "Pat One", date_of_birth: "1960-06-15", employment_status: "SEPARATED", marital_status: "SINGLE", separation_date: "2026-04-15" }, as: PlanSponsorAdmin, captures: { p1: "$.data.id" } }
            - { call: "POST /v1/accounts", payload: { participant_id: "${p1}", plan_id: "${plan_a}", initial_balances: [ { source_type: "PRE_TAX", balance_cents: 8000000, basis_cents: 0, vested_pct: 100 }, { source_type: "EMPLOYER_PRETAX", balance_cents: 2000000, basis_cents: 0, vested_pct: 60 }, { source_type: "ROTH", balance_cents: 1000000, basis_cents: 800000, vested_pct: 100 }, { source_type: "AFTER_TAX", balance_cents: 600000, basis_cents: 500000, vested_pct: 100 } ] }, as: PlanSponsorAdmin, captures: { a1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases", payload: { case_type: "INDIRECT_ROLLOVER_OUT", source_account_id: "${a1}", receiving_institution_name: "External IRA Trust", withholding_acknowledged: true }, as: Participant, as_user_id: "${p1}", captures: { c1: "$.data.id" } }
            - { call: "POST /v1/rollover-cases/${c1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "GET /v1/rollover-cases/${c1}/documents", as: RolloverProcessor, captures: { d0: "$.data[0].id", d1: "$.data[1].id" } }
            - { call: "POST /v1/documents/${d0}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d1}/submit", payload: {}, as: Participant, as_user_id: "${p1}" }
            - { call: "POST /v1/documents/${d0}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/documents/${d1}/review", payload: { decision: "ACCEPTED" }, as: RolloverProcessor, as_user_id: "proc-1" }
            - { call: "POST /v1/rollover-cases/${c1}/decide-eligibility", payload: { decision: "APPROVE" }, as: RolloverProcessor, as_user_id: "proc-1" }
          trigger:
            - { call: "POST /v1/rollover-cases/${c1}/issue-disbursement", payload: { method: "WIRE" }, as: RolloverProcessor, as_user_id: "proc-2", captures: { d_gross: "$.data.gross_cents", d_wh: "$.data.withholding_cents", d_net: "$.data.net_cents" } }
            - { call: "GET /v1/rollover-cases/${c1}", as: RolloverProcessor, captures: { k_gross: "$.data.gross_cents", k_basis: "$.data.basis_portion_cents", k_taxable: "$.data.taxable_cents", k_wh: "$.data.withholding_cents", k_net: "$.data.net_cents", k_forfeit: "$.data.forfeiture_cents" } }
          assert:
            - "gross_cents == 10800000 (${k_gross}); basis_portion_cents == 1300000 (${k_basis})"
