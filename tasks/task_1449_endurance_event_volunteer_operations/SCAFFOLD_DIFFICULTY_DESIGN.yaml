  - rule_id: non_linear_state_machine
    instances:
      - name: signup_branching_waitlist_fork_join
        grounds:
          - state_machines.Signup.REQUESTED_to_APPROVED
          - state_machines.Signup.WAITLISTED_to_APPROVED
          - calculations.waitlist_promotion_rank
        distinguishing_aspect: |
          Branching fork-join on Signup (a different entity than TrainingRecord/Shift
          below): creation forks REQUESTED vs WAITLISTED on capacity with divergent
          side-effect sets (WAITLISTED consumes no seat and has no confirm_by_at);
          a cancel on the approved branch joins the branches when the waitlisted
          signup is promoted with origin WAITLIST_PROMOTION.
        test_recipe:
          setup:
            - "Shift 07:00-11:00 headcount 1; V1 direct signup APPROVED then CONFIRMED (shift FULL); V2 signup created while FULL -> WAITLISTED"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "2000-01-02", is_returning: true }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v2}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id, sg1_status: $.data.status } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups/${sg1}/confirm", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v2}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id, sg2_status: $.data.status } }
            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { cnt_mid: $.data.confirmed_count } }
          trigger:
            - { call: "POST /volunteer-ops/signups/${sg1}/cancel", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "GET /volunteer-ops/signups/${sg2}", as: VolunteerCoordinator, captures: { sg2_status2: $.data.status, sg2_origin: $.data.origin } }
            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { cnt_end: $.data.confirmed_count, sh_status: $.data.status } }
          assert:
            - "fork: Signup.${sg1} created REQUESTED (${sg1_status} == REQUESTED) while Signup.${sg2} created WAITLISTED (${sg2_status} == WAITLISTED) on identical payloads"
            - "divergent side effects: waitlisted creation left Shift.confirmed_count == 1 (${cnt_mid} == 1); WAITLISTED occupies no seat"
            - "join: after cancel, Signup.${sg2}.status == APPROVED and origin == WAITLIST_PROMOTION"
            - "Shift.${sh}.confirmed_count == 1 and status == FULL after promotion (seat handed off, not lost)"

      - name: training_record_retry_expiry_cycle
        grounds:
          - state_machines.TrainingRecord.FAILED_to_ENROLLED
          - state_machines.TrainingRecord.PASSED_to_EXPIRED
          - state_machines.TrainingRecord.EXPIRED_to_ENROLLED
        distinguishing_aspect: |
          Cyclic machine on TrainingRecord (different entity than Signup/Shift):
          ENROLLED -> FAILED -> ENROLLED -> PASSED -> EXPIRED -> ENROLLED traverses
          BOTH loops (retry loop and expiry-renewal loop) on one record, with
          attempt_count 1 -> 2 -> 3 as the loop counter.
        test_recipe:
          setup:
            - "Volunteer V1 enrolled in SAFETY_BRIEFING (30-day validity); clock driven past valid_until"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/training-records", payload: { event_id: "${ev}", volunteer_id: "${v1}", module_code: SAFETY_BRIEFING }, as: VolunteerCoordinator, captures: { tr: $.data.id } }
            - { call: "POST /volunteer-ops/training-records/${tr}/fail", payload: {}, as: VolunteerCoordinator, captures: { st_fail: $.data.status } }
            - { call: "POST /volunteer-ops/training-records/${tr}/re-enroll", payload: {}, as: VolunteerCoordinator, captures: { att2: $.data.attempt_count } }
            - { call: "POST /volunteer-ops/training-records/${tr}/pass", payload: {}, as: VolunteerCoordinator, captures: { vu: $.data.valid_until } }
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-09-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events/${ev}/run-epoch-sweep", payload: {}, as: EventDirector }
            - { call: "GET /volunteer-ops/training-records/${tr}", as: VolunteerCoordinator, captures: { st_exp: $.data.status } }
          trigger:
            - { call: "POST /volunteer-ops/training-records/${tr}/re-enroll", payload: {}, as: VolunteerCoordinator, captures: { st_re: $.data.status, att3: $.data.attempt_count, pa: $.data.passed_at } }
          assert:
            - "first loop: FAILED -> ENROLLED succeeded with attempt_count == 2 (${att2} == 2)"
            - "PASSED set valid_until == 2026-09-19T00:00:00Z (30-day SAFETY_BRIEFING validity from 2026-08-20)"
            - "epoch sweep at 2026-09-20 moved the record PASSED -> EXPIRED (${st_exp} == EXPIRED)"
            - "second loop: EXPIRED -> ENROLLED with attempt_count == 3, passed_at null, valid_until null"
            - "${st_fail} == FAILED and ${st_re} == ENROLLED"

      - name: shift_compound_open_full_cycle
        grounds:
          - state_machines.Shift.OPEN_to_FULL
          - state_machines.Shift.FULL_to_OPEN
          - calculations.shift_fill_posture
        distinguishing_aspect: |
          Compound-cyclic machine on Shift (different entity than Signup/TrainingRecord):
          Shift.status is derived from the AGGREGATE of child Signup states and cycles
          OPEN -> FULL -> OPEN -> FULL as children are approved then cancelled then a
          new child is approved; no direct API writes the FULL/OPEN flip.
        test_recipe:
          setup:
            - "Shift headcount 1; V1 approved (FULL), cancelled (OPEN), V2 approved (FULL)"
          setup_api_calls:
            - { call: "POST /volunteer-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T00:00:00Z" }, as: EventDirector }
            - { call: "POST /volunteer-ops/events", payload: { name: "City Marathon", event_start_at: "2026-10-04T06:00:00Z", event_end_at: "2026-10-04T22:00:00Z", early_access_opens_at: "2026-08-10T00:00:00Z", signup_opens_at: "2026-08-17T00:00:00Z", signup_closes_at: "2026-09-27T00:00:00Z" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /volunteer-ops/course-segments", payload: { event_id: "${ev}", segment_code: "SEG-A", mile_start: 5, mile_end: 10, terrain_type: ROAD }, as: VolunteerCoordinator, captures: { seg: $.data.id } }
            - { call: "POST /volunteer-ops/role-catalog-entries", payload: { event_id: "${ev}", role_code: "MARSHAL", title: "Course Marshal", min_age_years: 16 }, as: VolunteerCoordinator, captures: { role: $.data.id } }
            - { call: "POST /volunteer-ops/shifts", payload: { event_id: "${ev}", role_entry_id: "${role}", segment_id: "${seg}", start_at: "2026-10-04T07:00:00Z", end_at: "2026-10-04T11:00:00Z", required_headcount: 1 }, as: VolunteerCoordinator, captures: { sh: $.data.id } }
            - { call: "POST /volunteer-ops/events/${ev}/publish", payload: {}, as: EventDirector }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V One", date_of_birth: "2000-01-01" }, as: Anonymous, captures: { v1: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers", payload: { event_id: "${ev}", full_name: "V Two", date_of_birth: "2000-01-02" }, as: Anonymous, captures: { v2: $.data.id } }
            - { call: "POST /volunteer-ops/volunteers/${v1}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/volunteers/${v2}/screen", payload: {}, as: VolunteerCoordinator }
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v1}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg1: $.data.id } }
            - { call: "POST /volunteer-ops/signups/${sg1}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { st1: $.data.status, c1: $.data.confirmed_count } }
            - { call: "POST /volunteer-ops/signups/${sg1}/cancel", payload: {}, as: Volunteer, as_user_id: "${v1}" }
            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { st2: $.data.status, c2: $.data.confirmed_count } }
          trigger:
            - { call: "POST /volunteer-ops/signups", payload: { volunteer_id: "${v2}", shift_id: "${sh}" }, as: VolunteerCoordinator, captures: { sg2: $.data.id, sg2_status: $.data.status } }
            - { call: "POST /volunteer-ops/signups/${sg2}/approve", payload: {}, as: VolunteerCoordinator }
            - { call: "GET /volunteer-ops/shifts/${sh}", as: VolunteerCoordinator, captures: { st3: $.data.status, c3: $.data.confirmed_count } }
          assert:
            - "after approve: Shift.status == FULL and confirmed_count == 1 (${st1}/${c1}) — child aggregate drove OPEN -> FULL"
            - "after cancel: Shift.status == OPEN and confirmed_count == 0 (${st2}/${c2}) — FULL -> OPEN cycle leg"
            - "V2's signup created REQUESTED (not WAITLISTED) because the seat was free (${sg2_status} == REQUESTED)"
            - "after V2 approve: Shift.status == FULL and confirmed_count == 1 (${st3}/${c3}) — second cycle leg completes OPEN -> FULL again"

  - rule_id: transitive_cascade
    instances:
      - name: no_show_strike_suspension_backfill_cascade
        grounds:
          - state_machines.Signup.CONFIRMED_to_NO_SHOW
          - state_machines.Volunteer.ELIGIBLE_to_SUSPENDED
          - calculations.no_show_strike_threshold
          - calculations.float_pool_backfill_selection
        distinguishing_aspect: |
          Depth-6 cascade from mark-no-show: Signup -> NO_SHOW (1) causes
          Volunteer.no_show_strikes 1 -> 2 (2) which causes Volunteer ELIGIBLE ->
          SUSPENDED (3) which causes the volunteer's OTHER CONFIRMED signup ->
          CANCELLED (4) which causes that Shift's confirmed_count drop (5) which
          causes float-pool backfill creating a replacement CONFIRMED Signup (6).
          Each link is caused by the previous link, not by the original call.
        test_recipe:
          setup:
            - "V1 CONFIRMED on S0 06:00-07:00 (segA), S1 08:00-10:00 (segA), S2 11:00-13:00 (segB); all headcount 1"
            - "V2 float_opt_in=true, ELIGIBLE, no signups; event RACE_DAY"
