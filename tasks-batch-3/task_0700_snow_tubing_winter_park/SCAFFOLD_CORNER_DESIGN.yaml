              as_user_id: "${pa_id}"
            - call: "POST /waivers"
              payload: { patron_id: "${pb_id}", park_id: "${park_id}", signed_at: "2026-04-07T09:00:00Z" }
              as: GuestPatron
              as_user_id: "${pb_id}"
