            - "Second response: ${loan_v1} == ${loan_v0} + 1, data.risk_posture == \"WATCH\" and data.servicing_status == \"PENDING_FIRST_DRAW\""
            - "Third response: HTTP 201 with data.status == \"PROPOSED\", data.option == \"PAYMENT_DEFERRAL\", data.mission_impact_score == 72.00 and data.denominational_points == 0"
            - "GET /loans/${loan} after the third response: version == ${loan_v1} and deferred_payments_count == 0 — a proposal moves no ledger field"

      - name: pledge_create_against_a_stale_campaign_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pledge-create-stale-campaign]
          - validations[priority=17]
          - errors[ERR_STALE_CAMPAIGN_VERSION]
          - endpoints[POST /pledges]
          - calculations.pledge_campaign_projected_value
        distinguishing_aspect: "The first pledge bumps the campaign's version, so a second pledge replaying the version read at campaign creation is 412 ERR_STALE_CAMPAIGN_VERSION; re-reading the campaign and resubmitting the identical body is 201 and lands the expected per-tier discount (13900000 conservative against 13500000 sponsor-optimistic)."
        test_recipe:
          setup:
            - "One institution with an OPEN 200000000 capital campaign at a 9000 bps sponsor collection rate, carrying one LEAD pledge of 10000000."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { institution_id: "${inst}", campaign_name: "Sanctuary 2026", goal_cents: 200000000, pledge_period_months: 36, sponsor_collection_rate_bps: 9000 }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { camp: $.data.id, camp_v0: $.data.version }
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "LEAD", pledged_amount_cents: 10000000, installment_count: 12, expected_pledge_campaign_version: "${camp_v0}" }
              as: CreditAnalyst
              captures: { pl1: $.data.id }
          trigger:
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "MAJOR", pledged_amount_cents: 5000000, installment_count: 12, expected_pledge_campaign_version: "${camp_v0}" }
              as: CreditAnalyst
              captures: { e_stale: $.data.error_id }
            - call: "GET /pledge-campaigns/${camp}"
              payload: {}
              as: CreditAnalyst
              captures: { camp_v1: $.data.version }
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "MAJOR", pledged_amount_cents: 5000000, installment_count: 12, expected_pledge_campaign_version: "${camp_v1}" }
              as: CreditAnalyst
              captures: { pl2: $.data.id }
          assert:
            - "First response: HTTP 412 with ${e_stale} == \"ERR_STALE_CAMPAIGN_VERSION\" and GET /pledges?pledge_campaign_id=${camp} reporting total_count == 1"
            - "Second response: ${camp_v1} == ${camp_v0} + 1, data.total_pledged_cents == 10000000, data.attrition_adjusted_value_cents == 9500000 and data.sponsor_projected_value_cents == 9000000"
            - "Third response: HTTP 201 with data.status == \"ACTIVE\", data.effective_attrition_pct == 0.1200, data.collected_cents == 0 and data.missed_payments_count == 0"
            - "GET /pledge-campaigns/${camp} after the third response: version == ${camp_v1} + 1, status \"OPEN\", total_pledged_cents == 15000000, active_pledged_cents == 15000000, lapsed_pledged_cents == 0, fulfilled_pledged_cents == 0, collected_to_date_cents == 0"
            - "GET /pledge-campaigns/${camp} after the third response: attrition_adjusted_value_cents == 13900000 (floor(10000000 * 0.95) + floor(5000000 * 0.88)) and sponsor_projected_value_cents == 13500000 (floor(15000000 * 0.9))"
            - "The campaign stays \"OPEN\": total_pledged_cents 15000000 is below floor(200000000 * 0.90) == 180000000, so the maturity gate on the UNDERPERFORMING transition never opens"

      - name: pledge_auto_lapses_at_exactly_the_third_missed_installment
        claim_type: rate_threshold_triggers
        grounds:
          - state_machines.Pledge.transitions.ACTIVE_to_LAPSED
          - calculations.pledge_campaign_projected_value
          - validations[priority=23]
          - errors[ERR_PLEDGE_INVALID_STATE]
          - entities.Pledge.fields.effective_attrition_pct
        distinguishing_aspect: "The cumulative miss counter trips at exactly AUTO_LAPSE_MISSED_COUNT == 3: after one miss the GENERAL rate is still 0.2200, after two it is 0.3700 (base 0.22 plus the 0.15 penalty) with the pledge still ACTIVE, and only the third miss flips it to LAPSED and empties the campaign's active bucket."
        test_recipe:
          setup:
            - "One institution with an OPEN 200000000 campaign carrying a single GENERAL pledge of 10000000 over 12 installments."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /pledge-campaigns"
              payload: { institution_id: "${inst}", campaign_name: "Sanctuary 2026", goal_cents: 200000000, pledge_period_months: 36, sponsor_collection_rate_bps: 9000 }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { camp: $.data.id, camp_v0: $.data.version }
            - call: "POST /pledges"
              payload: { pledge_campaign_id: "${camp}", donor_tier: "GENERAL", pledged_amount_cents: 10000000, installment_count: 12, expected_pledge_campaign_version: "${camp_v0}" }
              as: CreditAnalyst
              captures: { pl: $.data.id }
          trigger:
            - call: "POST /pledges/${pl}/payments"
              payload: { installment_month: 1, outcome: "MISSED", amount_cents: 0 }
              as: LoanServicer
            - call: "POST /pledges/${pl}/payments"
              payload: { installment_month: 2, outcome: "MISSED", amount_cents: 0 }
              as: LoanServicer
            - call: "POST /pledges/${pl}/payments"
              payload: { installment_month: 3, outcome: "MISSED", amount_cents: 0 }
              as: LoanServicer
            - call: "POST /pledges/${pl}/payments"
              payload: { installment_month: 4, outcome: "MISSED", amount_cents: 0 }
              as: LoanServicer
              captures: { e_state: $.data.error_id }
          assert:
            - "First response: HTTP 200 with data.status == \"ACTIVE\", data.missed_payments_count == 1 and data.effective_attrition_pct == 0.2200 — one miss draws no penalty"
            - "After the first response GET /pledge-campaigns/${camp} reports attrition_adjusted_value_cents == 7800000 (floor(10000000 * 0.78))"
            - "Second response: HTTP 200 with data.status == \"ACTIVE\", data.missed_payments_count == 2 and data.effective_attrition_pct == 0.3700 (0.22 + 0.15, below the 0.60 ceiling)"
            - "After the second response GET /pledge-campaigns/${camp} reports attrition_adjusted_value_cents == 6300000 (floor(10000000 * 0.63)) and active_pledged_cents == 10000000"
            - "Third response: HTTP 200 with data.status == \"LAPSED\", data.missed_payments_count == 3, data.lapse_reason == \"AUTO_THREE_MISSED_INSTALLMENTS\", data.collected_cents == 0 and data.payments_made_count == 0"
            - "After the third response GET /pledge-campaigns/${camp}: active_pledged_cents == 0, lapsed_pledged_cents == 10000000, total_pledged_cents == 10000000, attrition_adjusted_value_cents == 0 and sponsor_projected_value_cents == 0"
            - "Fourth response: HTTP 409 with ${e_state} == \"ERR_PLEDGE_INVALID_STATE\" — a lapsed pledge accepts no further installment"

      - name: covenant_breach_cascade_across_three_entities
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Covenant
          - state_machines.DrawRequest
          - calculations.loan_risk_posture
        excluded_because:
          difficulty_instance: covenant_second_breach_cascade_suspends_approved_draws_and_releases_reserved
          rationale: "The difficulty instance walks the full three-level chain end-to-end (covenant test -> loan posture -> APPROVED draws suspended with reserved commitment released) and then the reinstatement that unwinds it, which is the whole cascading_side_effects layer for this scaffold."

      - name: dual_variant_giving_base_and_campaign_valuation
        claim_type: dual_variant_calculation
        grounds:
          - calculations.institution_unrestricted_giving_base
          - calculations.pledge_campaign_projected_value
        excluded_because:
          difficulty_instance: giving_base_audited_only_vs_blended_diverge
          rationale: "The difficulty instance drives both variants over the same four periods and asserts the exact delta, and its sibling instance does the same for the campaign's conservative-versus-optimistic valuation; a further corner would only restate them."

  # ==========================================================================
  # Table 9 — consistency model (declared: immediate)
  # ==========================================================================
  - section: consistency_model
    instances:
      - name: disbursement_waterfall_and_loan_ledger_settle_inside_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.draw_net_disbursement
          - endpoints[POST /draw-requests/{draw_request_id}/disburse]
          - state_machines.Loan.servicing_status.PENDING_FIRST_DRAW_to_CONSTRUCTION_DRAW
        distinguishing_aspect: "The disburse response itself already carries every computed waterfall field and the loan's ledger is already moved when the very next read lands — no second call, no re-read, no settling window. An eventually-consistent implementation that returned the draw with null waterfall fields and filled them in later would fail on the first response alone."
        test_recipe:
          setup:
            - "The reference 225000000 sanctuary loan at PENDING_FIRST_DRAW with a 1500000 interest-reserve shortfall, carrying one APPROVED 50000000 foundation draw."
          setup_api_calls:
            - call: "POST /institutions"
              payload: { legal_name: "Grace Covenant Church", institution_type: "CONGREGATION", denomination_code: "PCA", requires_denominational_approval: false, bylaws_borrowing_cap_cents: 500000000, bylaws_quorum_pct: 0.6667, community_program_count: 3 }
              as: PlatformAdmin
              captures: { inst: $.data.id }
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q1", period_start: "2025-01-01T00:00:00Z", period_end: "2025-03-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 39999950, member_household_count: 500 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q2", period_start: "2025-04-01T00:00:00Z", period_end: "2025-06-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 62000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 510 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q3", period_start: "2025-07-01T00:00:00Z", period_end: "2025-09-30T00:00:00Z", source: "AUDITED", total_contributions_cents: 60000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 40999950, member_household_count: 515 }
              as: CreditAnalyst
            - call: "POST /giving-periods"
              payload: { institution_id: "${inst}", period_label: "2025Q4", period_start: "2025-10-01T00:00:00Z", period_end: "2025-12-31T00:00:00Z", source: "AUDITED", total_contributions_cents: 65000000, restricted_contributions_cents: 8000000, donor_restricted_endowment_draw_cents: 2000000, operating_expense_cents: 41800200, member_household_count: 520 }
              as: CreditAnalyst
            - call: "POST /governance-authorizations"
              payload: { institution_id: "${inst}", resolution_date: "2026-06-15T00:00:00Z", bylaws_citation: "Article VII Section 3", board_votes_for: 8, board_votes_total: 12, authorized_amount_cents: 400000000, expires_on: "2027-06-30T00:00:00Z" }
              as: InstitutionRepresentative
              as_user_id: "${inst}"
              captures: { gov: $.data.id }
            - call: "POST /governance-authorizations/${gov}/submit"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
            - call: "POST /governance-authorizations/${gov}/board-verification"
              payload: { minutes_reference: "MIN-2026-06-15" }
              as: GovernanceOfficer
            - call: "POST /collateral-assets"
              payload: { institution_id: "${inst}", asset_type: "SANCTUARY", description_label: "Main sanctuary building", appraised_value_cents: 500000000, appraisal_date: "2025-06-01T00:00:00Z", alternative_use_score: 2 }
              as: CreditAnalyst
              captures: { asset: $.data.id }
            - call: "POST /loan-applications"
              payload: { institution_id: "${inst}", governance_authorization_id: "${gov}", purpose: "SANCTUARY_CONSTRUCTION", requested_amount_cents: 225000000, term_months: 240, interest_rate_bps: 625 }
              as: CreditAnalyst
              captures: { app: $.data.id }
            - call: "POST /loan-applications/${app}/submit-underwriting"
              payload: { analyst_note: "Sanctuary construction facility" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /collateral-assets/${asset}/assignments"
              payload: { loan_application_id: "${app}", lien_position: 1, lien_effective_from: "2026-08-01T00:00:00Z", lien_effective_to: "2031-08-01T00:00:00Z" }
              as: CreditAnalyst
            - call: "POST /loan-applications/${app}/committee-referral"
              payload: { referral_note: "First lien fully covers the request" }
              as: CreditAnalyst
              as_user_id: "analyst-1"
            - call: "POST /loan-applications/${app}/committee-decision"
              payload: { decision: "APPROVE" }
              as: CreditCommitteeMember
              as_user_id: "committee-1"
            - call: "POST /loans"
              payload: { loan_application_id: "${app}", annual_debt_service_cents: 36000000, interest_reserve_shortfall_cents: 1500000 }
              as: LoanServicer
              captures: { loan: $.data.id, loan_v0: $.data.version }
            - call: "POST /draw-requests"
              payload: { loan_id: "${loan}", project_phase: "FOUNDATION", requested_amount_cents: 50000000, percent_complete: 0.2222 }
              as: LoanServicer
              captures: { draw: $.data.id }
            - call: "POST /draw-requests/${draw}/approve"
              payload: { approved_amount_cents: 50000000, inspector_note: "Foundation poured and inspected" }
              as: LoanServicer
          trigger:
            - call: "POST /draw-requests/${draw}/disburse"
              payload: { disbursement_date: "2026-08-01T00:00:00Z" }
              as: LoanServicer
            - call: "GET /draw-requests/${draw}"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
            - call: "GET /loans/${loan}"
              payload: {}
              as: InstitutionRepresentative
              as_user_id: "${inst}"
          assert:
            - "First response: HTTP 200 already carrying status == \"DISBURSED\", completion_pct_at_disbursement == 0.2222 (floor(50000000 * 10000 / 225000000) / 10000), retainage_cents == 5000000 (tier 1 at 0.10 because 0.2222 < 0.5000), interest_reserve_applied_cents == 1500000, inspection_fee_cents == 45000 and net_disbursed_cents == 43455000"
            - "First response: the five waterfall fields are non-null in the disburse response itself — none of them may be null-then-backfilled"
            - "Second response: identical on all six fields (status, completion_pct_at_disbursement 0.2222, retainage_cents 5000000, interest_reserve_applied_cents 1500000, inspection_fee_cents 45000, net_disbursed_cents 43455000), and it is read by a different role in the very next request"
            - "Third response: disbursed_principal_cents == 50000000, outstanding_principal_cents == 50000000, undrawn_commitment_cents == 175000000, reserved_draw_cents == 0, retainage_held_cents == 5000000, interest_reserve_shortfall_cents == 0"
            - "Third response: servicing_status == \"CONSTRUCTION_DRAW\", risk_posture == \"OPEN\" and version == ${loan_v0} + 2 (one bump at approval, one at disbursement)"
            - "Third response conservation: disbursed_principal_cents + undrawn_commitment_cents + cancelled_commitment_cents == 225000000 holds on the first read after the disbursement, with no intervening call"

      - name: covenant_test_and_derived_loan_posture_are_visible_in_one_request
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.dscr_covenant_ratio
