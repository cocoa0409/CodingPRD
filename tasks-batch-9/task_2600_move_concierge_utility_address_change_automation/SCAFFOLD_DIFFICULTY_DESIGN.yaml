            - "before the trigger: AddressChangeFiling.${f1_id}.status == CONFIRMED with forward_end_date == 2027-08-19 and mail_forwarding_confirmed_at == 2026-08-01T00:00:00Z"
            - "trigger call 1 returns HTTP 409 with error_id == ERR_FORWARDING_PERIOD_CONFLICT (priority 35 wins over the also-violated priority 42)"
            - "after trigger call 1: AddressChangeFiling.${f2_id}.resubmit_count == 2 (unchanged) and status == REJECTED"
            - "before the trigger: MoveRecord.${mv_m1_id}.readiness_score == 60 (identity 100, utility 0, filing 100, consent 50)"
            - "trigger call 2 returns HTTP 200, AddressChangeFiling.${f1_id}.status == CANCELLED, mail_forwarding_confirmed_at == null, and MoveRecord.${mv_m1_id}.readiness_score == 40"
            - "trigger call 3 returns HTTP 409 with error_id == ERR_RESUBMIT_LIMIT_REACHED (the forwarding slot is free, so only priority 42 remains violated)"
            - "after trigger call 3: AddressChangeFiling.${f2_id}.status == REJECTED and resubmit_count == 2"

  - rule_id: boundary_precision_check
    instances:
      - name: credit_score_640_clear_vs_639_deposit_due
        grounds:
          - calculations.credit_deposit_amount_cents
          - "endpoints[POST /credit-check-handoffs/{id}/bureau-response]"
          - state_machines.UtilityOrder.PENDING_CHECK_to_CLEARED
          - state_machines.UtilityOrder.PENDING_CHECK_to_DEPOSIT_DUE
        distinguishing_aspect: |
          Metric: the integer bureau score against CREDIT_CLEAR_THRESHOLD (640) on POST
          /credit-check-handoffs/{id}/bureau-response. Two orders of one move with the identical frozen
          readiness_snapshot of 40 receive scores 640 and 639; the 640 row must land CLEARED with
          deposit_amount_cents 0 and the 639 row DEPOSIT_DUE with exactly 18000, so an implementation
          using > instead of >= (or a 0.5-cent rounding slip) is caught by one cent-exact pair.
        test_recipe:
          setup:
            - "Clock pinned to 2026-08-01T00:00:00Z."
            - "Two CREDIT_SCORE_BASED providers covering 30302: one ELECTRIC, one GAS, both credit_check_required."
            - "Move for 2026-08-20, verified, UTILITY_SETUP consent GRANTED, mapped to both utility types (mapped_order_count 2, nothing scheduled)."
            - "readiness_score at that point is 40 (identity 100, utility 0 of 2, filing 0, consent 50), so both credit-check calls freeze readiness_snapshot 40."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /feed-sources"
              payload: { name: "Metro PM Feed", source_type: "PROPERTY_MANAGER", referral_revenue_share_pct: 0.1750, dedupe_window_days: 30, trust_tier: "TIER_B" }
              as: PlatformAdmin
              captures: { fs_id: $.data.id }
            - call: "POST /residents"
              payload: { full_name: "Dana Ruiz", email: "dana.ruiz@example.com", phone_last4: "4417", date_of_birth: "1988-04-12", ssn_last4: "6621" }
              as: PlatformAdmin
              captures: { res_id: $.data.id, res_v1: $.data.version }
            - call: "POST /service-addresses"
              payload: { line1: "18 Maple Ct", city: "Atlanta", state_code: "GA", postal_code: "30301" }
              as: PlatformAdmin
              captures: { orig_id: $.data.id }
            - call: "POST /service-addresses"
              payload: { line1: "402 Peachtree Way", unit: "7B", city: "Atlanta", state_code: "GA", postal_code: "30302" }
              as: PlatformAdmin
              captures: { dest_id: $.data.id }
            - call: "POST /utility-providers"
              payload: { name: "Georgia Metro Electric", utility_type: "ELECTRIC", required_account_fields: ["account_holder_name", "service_start_date"], deposit_policy: "CREDIT_SCORE_BASED", credit_check_required: true, scheduling_lead_days: 3 }
              as: PlatformAdmin
              captures: { prov_e_id: $.data.id }
            - call: "POST /provider-service-territories"
              payload: { provider_id: "${prov_e_id}", postal_code: "30302", state_code: "GA", effective_from: "2026-01-01", priority_rank: 1, is_default_carrier: true }
              as: PlatformAdmin
              captures: { terr_e_id: $.data.id }
            - call: "POST /utility-providers"
              payload: { name: "Peachtree Gas Co", utility_type: "GAS", required_account_fields: ["account_holder_name"], deposit_policy: "CREDIT_SCORE_BASED", credit_check_required: true, scheduling_lead_days: 3 }
              as: PlatformAdmin
              captures: { prov_g_id: $.data.id }
            - call: "POST /provider-service-territories"
              payload: { provider_id: "${prov_g_id}", postal_code: "30302", state_code: "GA", effective_from: "2026-01-01", priority_rank: 1, is_default_carrier: true }
              as: PlatformAdmin
