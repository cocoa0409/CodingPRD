              captures: { pl2_id: $.data.id }
            - call: "POST /body-art/procedure-logs"
              payload: { establishment_id: "${est_id}", artist_id: "${a1_id}", client_age: 41, procedure_type: "TATTOO", started_at: "2026-05-01T10:30:00Z", ended_at: "2026-05-01T11:30:00Z", aftercare_provided: true }
              as: Artist
