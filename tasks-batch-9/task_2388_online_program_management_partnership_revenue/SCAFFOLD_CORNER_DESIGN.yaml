        test_recipe:
          setup:
            - "LAUNCHED Program with one APPROVED course (design_cost_cents 1500000) and one ACTIVE Enrollment of 9 credits with credits_completed 3."
            - "Partnership.holdback_balance_cents is 0 because no statement has been remitted."
            - "The provost moves the Program to TEACH_OUT and drafts a plan with student_notification_date 2026-09-05 and teach_out_end_date 2027-01-15."
