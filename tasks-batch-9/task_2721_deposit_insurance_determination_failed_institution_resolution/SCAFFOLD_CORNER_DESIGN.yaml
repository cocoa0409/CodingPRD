              as: ClosingManager
              captures: { fa_sub_id: $.data.id }
            - call: "POST /readiness-submissions/${fa_sub_id}/standardize"
              as: ClosingManager
            - call: "POST /institutions/${fa_inst_id}/close"
              as: ClosingManager
            - call: "GET /depositor-records/${fa_dep1_id}"
