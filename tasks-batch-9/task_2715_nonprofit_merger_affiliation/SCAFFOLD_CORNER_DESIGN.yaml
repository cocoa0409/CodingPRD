          rationale: "The §1.8 instance shows the selector at work on two funds with identical money: the consent branch pins DONOR_CONSENT and releases 62000000 while the judicial branch pins JUDICIAL_MODIFICATION and releases 20150000, a 41850000 gap chosen purely by which branch of the fork the fund travelled."

  - section: validations
