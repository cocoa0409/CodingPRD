# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3027_flash_sale_event_merchandising_drop_ship_order
#
# Breadth probe. Every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners already
# covered by a §1.8 instance appear as `excluded_because:` stubs with no
# test_recipe. Section and claim_type values come from
# references/claim-extraction-guide.md; no new categories are invented.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: vendor_create_returns_every_declared_field_and_starts_excellent
        claim_type: Creation
        grounds:
          - entities.Vendor
          - entities.Vendor.fields.standing
          - entities.Vendor.fields.fill_rate_floor_pct
          - endpoints.POST_/vendors
        distinguishing_aspect: "A vendor created with only legal_name comes back 201 with vendor_tier defaulting to STANDARD, standing EXCELLENT, fill_rate_floor_pct 0.9000, both rolling counters at 0 and a null standing_evaluated_at — none of those four derived fields is client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
          trigger:
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Vendor.${vendor_id}.legal_name == \"Northwind Outfitters\" and vendor_tier == STANDARD"
            - "Vendor.${vendor_id}.standing == EXCELLENT and fill_rate_floor_pct == 0.9000"
            - "Vendor.${vendor_id}.rolling_fill_rate_units_shipped == 0 and rolling_fill_rate_units_ordered == 0"
            - "Vendor.${vendor_id}.standing_evaluated_at is null because no checkpoint has run"
            - "Vendor.${vendor_id}.version == 1 and the response data carries non-null id, created_at and updated_at"
            - "meta.api_request_id and meta.api_request_timestamp are both present on the response"

      - name: listing_get_returns_the_stored_slot_unchanged
        claim_type: Retrieval
        grounds:
          - entities.Listing
          - endpoints.GET_/listings/{id}
        distinguishing_aspect: "Every Listing merchandising field round-trips through GET exactly as posted, including the reveal_at instant and the vendor_unit_cost_cents figure that is never surfaced to a customer."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor, one shop and one DRAFT event on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "PREMIER" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fall Outerwear Daily", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-RT-1", unit_price_cents: 1250, vendor_unit_cost_cents: 700, allocation_units: 8, reveal_at: "2026-09-01T06:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
          trigger:
            - call: "GET /listings/${listing_id}"
              payload: {}
              as: Any
          assert:
            - "the response status is 200"
            - "Listing.${listing_id}.vendor_sku == \"NW-RT-1\" and unit_price_cents == 1250 and vendor_unit_cost_cents == 700"
            - "Listing.${listing_id}.allocation_units == 8 and units_ordered == 0 and oversell_units == 0"
            - "Listing.${listing_id}.reveal_at == 2026-09-01T06:00:00Z and listing_status == DRAFT"
            - "the same GET repeated returns byte-identical field values and an unchanged version"

      - name: listings_list_paginates_and_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/listings
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three listings on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true while offset=2 returns the remaining row with has_more false — total_count counts the whole filtered set rather than the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor, one shop, one DRAFT event, three listings on that event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fall Outerwear Daily", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-PG-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-PG-2", unit_price_cents: 200, vendor_unit_cost_cents: 120, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-PG-3", unit_price_cents: 300, vendor_unit_cost_cents: 180, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_3_id: $.data.id }
          trigger:
            - call: "GET /listings"
              payload: { event_id: "${event_id}", limit: 2, offset: 0 }
              as: Any
          assert:
            - "the first page returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /listings?event_id=${event_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /listings?event_id=${event_id} returns 3 rows with limit defaulting to 10 and offset to 0"
            - "GET /listings?listing_status=DRAFT returns 3 rows and GET /listings?listing_status=ACTIVE returns 0 rows"
            - "GET /listings?event_id=${event_id}&limit=1000 is clamped to the declared maximum of 100 rather than rejected"

      - name: event_get_with_an_unknown_id_returns_event_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/events/{id}
          - errors.ERR_EVENT_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id on the events path produces the entity-specific 404 ERR_EVENT_NOT_FOUND rather than a generic ERR_NOT_FOUND or a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No event has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
          trigger:
            - call: "GET /events/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Any
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_EVENT_NOT_FOUND"
            - "error_id != ERR_NOT_FOUND and error_id != ERR_INVALID_REQUEST"
            - "response_type is error and data carries both error_id and message"

      - name: listing_create_missing_allocation_units_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Listing.fields.allocation_units
          - validations[priority=12]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "allocation_units is a required input with no declared default, so omitting it entirely is a 400 ERR_INVALID_REQUEST from the request-shape check rather than the 409 ERR_ALLOCATION_EXCEEDED that a present-but-zero-then-raised value would later produce."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor, one shop and one DRAFT event."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fall Outerwear Daily", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
          trigger:
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-REQ-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "error_id != ERR_ALLOCATION_EXCEEDED"
            - "GET /listings?event_id=${event_id} returns 0 rows"

      - name: event_create_omitting_ship_time_quote_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Event.fields.ship_time_quote_days
          - validations[priority=12]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "ship_time_quote_days is the disclosed-extension figure and has no default, so omitting it is a 400 ERR_INVALID_REQUEST from the request-shape check — the system never quietly assumes a ship-time promise on the customer's behalf."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor and one shop."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "No Quote Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z" }
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /events?shop_id=${shop_id} returns 0 rows so no event was persisted with an implied quote"
            - "GET /shops/${shop_id} still reports shop_status DRAFT"

      - name: event_create_with_an_out_of_enum_ship_time_quote_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Event.fields.ship_time_quote_days
          - state_machines.Event.DRAFT_to_SCHEDULED
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "ship_time_quote_days is restricted to the four disclosed buckets {10, 14, 21, 30}, so 7 is refused at the request-shape check with 400 ERR_INVALID_REQUEST rather than being accepted and silently producing an undisclosed promise."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor and one shop."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
          trigger:
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Bad Quote Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 7 }
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "the accepted set is exactly {10, 14, 21, 30}: a second attempt with ship_time_quote_days 30 succeeds with 201"
            - "GET /events?shop_id=${shop_id} returns exactly 1 row after the second attempt, and that row's ship_time_quote_days is 30"

      - name: order_create_extra_field_order_total_cents_is_ignored_input
        claim_type: Computed Fields
        grounds:
          - entities.CustomerOrder.fields.order_total_cents
          - endpoints.POST_/orders
        distinguishing_aspect: "order_total_cents is source: computed and is not a declared input of POST /orders, so a client sending it is ignored and the stored value is the computed 0 from an empty order rather than the supplied 99999."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { customer_id: "${customer_id}", order_total_cents: 99999, order_status: "SHIPPED" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { order_id: $.data.id }
          assert:
            - "the response status is 201"
            - "CustomerOrder.${order_id}.order_total_cents == 0, not the supplied 99999"
            - "CustomerOrder.${order_id}.order_status == AGGREGATING, not the supplied SHIPPED"
            - "CustomerOrder.${order_id}.payment_status == AUTHORIZED and refund_due_cents == 0"
            - "CustomerOrder.${order_id}.cancellation_window_ends_at is null because no line has been confirmed_at"

      - name: credit_ledger_entry_is_append_only_with_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.CreditLedger
          - errors.ERR_LEDGER_IMMUTABLE
          - validations[priority=9]
        distinguishing_aspect: "CreditLedger is declared with common_fields: false, so the entity carries only id and created_at and exposes no version field and no update endpoint — an attempt to change a row's amount is rejected as ERR_LEDGER_IMMUTABLE rather than performing a partial update."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer with a manual goodwill credit already issued."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /customers"
              payload: { email: "c1@example.com", full_name: "Casey One" }
              as: Any
              captures: { customer_id: $.data.id }
            - call: "POST /customers/${customer_id}/credits"
              payload: { amount_cents: 1500, idempotency_key: "imm-1", reason_code: "GOODWILL" }
              as: CustomerService
              captures: { ledger_id: $.data.id }
          trigger:
            - call: "GET /customers/${customer_id}/credit-ledger"
              payload: {}
              as: CustomerService
          assert:
            - "the response returns exactly 1 row with amount_cents == 1500 and entry_status == ISSUED"
            - "CreditLedger.${ledger_id} carries only id and created_at — there is no updated_at and no version field on the row"
            - "no endpoint in §1.5 accepts a write that targets an existing CreditLedger id, so the row cannot be edited or deleted"
            - "the compensating write is a NEW row: after POST /customers/${customer_id}/payouts with amount_cents 1500 the ledger has 2 rows and the original row's amount_cents is still 1500"
            - "GET /customers/${customer_id} reports store_credit_balance_cents 0 and refund_balance_cents 0 after the payout"

      - name: event_create_with_an_unknown_shop_id_returns_shop_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Event.fields.shop_id
          - entities.Shop
          - errors.ERR_SHOP_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "Shop is a body foreign key rather than a path segment, so an unknown shop_id still resolves to the specific 404 ERR_SHOP_NOT_FOUND and never to the path-level ERR_EVENT_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
          trigger:
            - call: "POST /events"
              payload: { shop_id: "00000000-0000-4000-8000-000000000009", event_title: "Orphan Event", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_SHOP_NOT_FOUND"
            - "error_id != ERR_EVENT_NOT_FOUND and error_id != ERR_INVALID_REQUEST"
            - "GET /events returns 0 rows"
            - "the resolution order does not leak a generic code: the path carries no id at all, so the only candidate for this request is the shop foreign key"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: event_launch_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Event.DRAFT_to_SCHEDULED
          - state_machines.Event.SCHEDULED_to_LIVE
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "There is no DRAFT-to-LIVE transition on Event, so launching a DRAFT event is refused with 409 ERR_INVALID_STATE even though the logical clock is well past its starts_at."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor, one shop and one DRAFT event with one listing, whose starts_at the clock has already reached."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fall Outerwear Daily", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-ST-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
          trigger:
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Event.${event_id}.event_status is still DRAFT and open_event_for_shop is false"
            - "Shop.${shop_id}.shop_status is still DRAFT"
            - "the listing is still DRAFT, so the launch's listing-reveal side effect did not fire"

      - name: event_cancel_from_draft_is_terminal_and_blocks_scheduling
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Event.terminal_states
          - state_machines.Event.DRAFT_to_CANCELLED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "CANCELLED is a terminal state on Event, so after cancelling a DRAFT event every subsequent lifecycle action is refused with 409 ERR_INVALID_STATE and its listings are already WITHDRAWN."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor, one shop and one DRAFT event with one listing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fall Outerwear Daily", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-TM-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/cancel"
              payload: { reason_code: "MERCHANDISING_PULLED" }
              as: Merchandiser
          trigger:
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Event.${event_id}.event_status is still CANCELLED and its checkpoint_index is still 0"
            - "Listing.${listing_id}.listing_status == WITHDRAWN from the cancel's side effect"
            - "POST /events/${event_id}/close is likewise refused with 409 ERR_INVALID_STATE, so both forward paths out of CANCELLED are sealed"
            - "Event.${event_id}.units_ordered_total == 0 and oversell_units_total == 0"

      - name: event_event_schedule_twice_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Event.DRAFT_to_SCHEDULED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Scheduling an already SCHEDULED event is refused with 409 ERR_INVALID_STATE rather than being a silent no-op, and no side effect from the second call is applied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor, one shop and one event with one listing on file."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fall Outerwear Daily", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id, event_v0: $.data.version }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-ID-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
              captures: { event_v_scheduled: $.data.version }
          trigger:
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "Event.${event_id}.event_status is still SCHEDULED and version is still ${event_v_scheduled}, so the refused call bumped nothing"
            - "Event.${event_id}.version is strictly greater than the creation version ${event_v0}, so the first schedule did apply"
            - "Shop.${shop_id}.shop_status is still SCHEDULED and was not re-derived by the refusal"
            - "GET /events/${event_id}/listings still returns exactly 1 row"

      - name: shop_closes_with_its_last_event_and_stays_closed
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Shop.OPEN_to_CLOSED
          - state_machines.Shop.terminal_states
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Shop closes by bubbling up from its last event's close rather than by any direct call, and once CLOSED it exposes no transition at all so a further event cannot be launched under it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One vendor, one shop and one event with one listing, scheduled and launched so the shop is OPEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Fall Outerwear Daily", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-09-02T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-SH-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 4, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
          trigger:
            - call: "POST /events/${event_id}/close"
              payload: { cancel_pending_aggregations: true }
              as: Merchandiser
          assert:
            - "Shop.${shop_id}.shop_status == OPEN before the close and Event.${event_id}.event_status == LIVE"
            - "after the close Shop.${shop_id}.shop_status == CLOSED, bubbled up because the shop has no other SCHEDULED or LIVE event"
            - "Shop.${shop_id}.curated_sku_count == 0 from the close's side effect"
            - "Event.${event_id}.event_status == CLOSED and open_event_for_shop is false"
            - "the shop exposes no transition out of CLOSED, so creating a second event under it and launching that event is refused with 409 ERR_SHOP_SUSPENDED"

  # ===========================================================================
  - section: calculations
    instances:

      - name: vendor_rolling_fill_rate_window_boundary_excludes_the_closure_instant
        claim_type: Constants Applied
        grounds:
          - calculations.vendor_rolling_fill_rate
          - calculations.vendor_rolling_fill_rate.constants[WINDOW_DAYS]
          - endpoints.GET_/vendors/{id}/fill-rate-report
        distinguishing_aspect: "The 90-day window is applied with a strict > on closed_at, so a buy closed at exactly current_utc minus 90 days is excluded from the whole-unit denominator and a buy closed one second later is included."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Vendor V1 STANDARD/EXCELLENT. A probe buy closed short at 2026-06-03T00:00:00Z, exactly 90 days before the read instant."
            - "A second buy for the same vendor is issued and closed short at 2026-06-04T00:00:00Z, one day inside the window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: Merchandiser
            - call: "POST /vendors"
              payload: { legal_name: "Northwind Outfitters", vendor_tier: "STANDARD" }
              as: Merchandiser
              captures: { vendor_id: $.data.id, vendor_v0: $.data.version }
            - call: "POST /shops"
              payload: { vendor_id: "${vendor_id}", shop_name: "Northwind Brand Shop" }
              as: Merchandiser
              captures: { shop_id: $.data.id }
            - call: "POST /events"
              payload: { shop_id: "${shop_id}", event_title: "Window Event", starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-09-20T00:00:00Z", ship_time_quote_days: 14 }
              as: Merchandiser
              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-WIN-1", unit_price_cents: 100, vendor_unit_cost_cents: 60, allocation_units: 40, reveal_at: "2026-06-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
              as: Merchandiser
            - call: "POST /events/${event_id}/launch"
              payload: {}
              as: Merchandiser
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_out_id: $.data.id }
            - call: "POST /purchase-orders/${po_out_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 10 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_out_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_out_id}/close-short"
              payload: { force_close: true }
              as: InventoryPlanner
            - call: "POST /purchase-orders"
              payload: { vendor_id: "${vendor_id}", event_id: "${event_id}", expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
              captures: { po_in_id: $.data.id }
            - call: "POST /purchase-orders/${po_in_id}/add-line"
              payload: { listing_id: "${listing_id}", quantity_ordered: 20 }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_in_id}/issue"
              payload: { expected_vendor_version: "${vendor_v0}" }
              as: InventoryPlanner
            - call: "POST /purchase-orders/${po_in_id}/close-short"
              payload: { force_close: true }
              as: InventoryPlanner
          trigger:
            - call: "GET /vendors/${vendor_id}/fill-rate-report"
              payload: { basis: "UNIT_WEIGHTED", window_days: 90 }
              as: Any
          assert:
            - "the report's window length is exactly the declared 90 days and BOTH buy closings are genuine CLOSED_SHORT rows on this vendor"
            - "units_ordered == 20: the 10-unit buy closed at 2026-06-03T00:00:00Z sits exactly on the window edge and is EXCLUDED by the strict > on closed_at"
            - "units_shipped == 0, so unit_weighted_fill_rate == 0.0000 and not 0.0000-with-a-30-unit-denominator"
            - "po_count_fill_rate == 0.0000 as well, because the count basis applies the identical window filter"
            - "Vendor.${vendor_id}.rolling_fill_rate_units_ordered is the stored, unit-weighted counter, not the report's po_count denominator — the two figures are reported side by side rather than conflated"
            - "widening window_days to 91 lowers unit_weighted_fill_rate to 0.0000 while raising units_ordered to 30, proving both closings exist and only the window differs"

      - name: event_net_contribution_variant_switch_on_closure
        claim_type: Variant Selection
        grounds:
          - calculations.event_net_contribution
          - calculations.event_net_contribution.variants[projected_while_live]
