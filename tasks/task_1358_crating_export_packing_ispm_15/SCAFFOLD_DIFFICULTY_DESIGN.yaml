  - rule_id: transitive_cascade
    instances:
      - name: job_cancel_wood_release_cascade
        grounds:
          - state_machines.PackingJob.QUOTED_to_CANCELLED
          - state_machines.CrateDesign.APPROVED_to_SUPERSEDED
          - state_machines.WoodBatch.DEPLETED_to_ACTIVE
        distinguishing_aspect: |
          Depth-3 chain from POST cancel: job CANCELLED -> design APPROVED ->
          SUPERSEDED releases its reservation -> WoodBatch.reserved_board_feet -= 27
          -> because available rises from 0, batch auto-flips DEPLETED -> ACTIVE.
          Each link is caused by the previous one, not by the cancel directly.
        test_recipe:
          setup:
            - "Customer, QUOTED job, one item 50x50x50 / 50 kg (design requires exactly 27 bf); batch HT-2026-0030 received 27 bf — approving the design drives available to 0 and the batch auto-DEPLETED"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Cascade Co", site_code: "CSC-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Pump", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 30000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0030", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 27, stamps_acquired: 0 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "GET /crating/wood-batches/${batch_id}", payload: {}, as: ComplianceOfficer, captures: { batch_state_mid: $.data.status, avail_mid: $.data.available_board_feet } }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/cancel", payload: {}, as: SalesRep, captures: { job_state: $.data.status } }
            - { call: "GET /crating/designs/${design_id}", payload: {}, as: CratingDesigner, captures: { design_state: $.data.status } }
            - { call: "GET /crating/wood-batches/${batch_id}", payload: {}, as: ComplianceOfficer, captures: { batch_state_end: $.data.status, avail_end: $.data.available_board_feet, reserved_end: $.data.reserved_board_feet } }
          assert:
            - "mid-chain: batch status == DEPLETED and available_board_feet == 0 (approve exhausted the 27 bf)"
            - "cancel: PackingJob.status == CANCELLED"
            - "cascade link 1: CrateDesign.${design_id}.status == SUPERSEDED"
            - "cascade links 2-3: WoodBatch reserved_board_feet == 0, available_board_feet == 27, status == ACTIVE (auto-flipped from DEPLETED)"
      - name: batch_suspend_compliance_hold_cascade
        grounds:
          - state_machines.WoodBatch.ACTIVE_to_SUSPENDED
          - entities.Crate.fields.compliance_hold
          - entities.PackingJob.fields.readiness_posture
        distinguishing_aspect: |
          Depth-2 chain from POST suspend with a DIFFERENT trigger than cancel:
          batch SUSPENDED -> SEALED crate carrying that batch gets
          compliance_hold=true -> the crate's hold flips the job's derived
          readiness_posture READY -> BLOCKED.
        test_recipe:
          setup:
            - "Job driven to READY_TO_LOAD: item 50x50x50 / 50 kg STANDARD, design approved on batch HT-2026-0031 (500 bf, 2 stamps), quote accepted, packing started, crate built/packed/sealed (posture READY)"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Hold Co", site_code: "HLD-01", credit_limit_cents: 100000000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Compressor", length_cm: 50, width_cm: 50, height_cm: 50, weight_kg: 50, fragile_class: STANDARD, declared_value_cents: 90000 }, as: SalesRep, captures: { item_id: $.data.id, item_v: $.data.version } }
            - { call: "POST /crating/wood-batches", payload: { ht_certificate_no: "HT-2026-0031", treatment_type: HT, expires_at: "2027-12-31T00:00:00Z", received_board_feet: 500, stamps_acquired: 2 }, as: ComplianceOfficer, captures: { batch_id: $.data.id } }
            - { call: "POST /crating/items/${item_id}/designs", payload: { expected_item_version: "${item_v}" }, as: CratingDesigner, captures: { design_id: $.data.id } }
            - { call: "POST /crating/designs/${design_id}/submit", payload: {}, as: CratingDesigner }
            - { call: "POST /crating/designs/${design_id}/approve", payload: { wood_batch_id: "${batch_id}" }, as: ComplianceOfficer }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /crating/packing-jobs/${job_id}/start-packing", payload: {}, as: ShopForeman }
            - { call: "POST /crating/items/${item_id}/crates", payload: { design_id: "${design_id}" }, as: ShopForeman, captures: { crate_id: $.data.id } }
            - { call: "POST /crating/crates/${crate_id}/build", payload: {}, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/pack", payload: { indicator_g: 75, moisture_barrier: NONE }, as: ShopForeman }
            - { call: "POST /crating/crates/${crate_id}/seal", payload: {}, as: ComplianceOfficer }
            - { call: "GET /crating/packing-jobs/${job_id}", payload: {}, as: ShopForeman, captures: { posture_mid: $.data.readiness_posture, job_state_mid: $.data.status } }
          trigger:
            - { call: "POST /crating/wood-batches/${batch_id}/suspend", payload: {}, as: ComplianceOfficer }
            - { call: "GET /crating/crates/${crate_id}", payload: {}, as: ComplianceOfficer, captures: { crate_hold: $.data.compliance_hold } }
            - { call: "GET /crating/packing-jobs/${job_id}", payload: {}, as: ComplianceOfficer, captures: { posture_end: $.data.readiness_posture } }
          assert:
            - "pre-suspend: job status == READY_TO_LOAD and readiness_posture == READY"
            - "cascade link 1: Crate.${crate_id}.compliance_hold == true (SEALED crate on suspended batch)"
            - "cascade link 2: PackingJob.readiness_posture == BLOCKED (derived from the crate's hold, not set by the suspend call directly)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_quote_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=31]
        distinguishing_aspect: |
          Category pair (state vs business_fiscal): the second accept-quote
          violates BOTH the state guard (job already DESIGN) and the credit check
          (limit lowered to 1000 < exposure 34139); state priority 6 beats fiscal
          priority 31 -> ERR_JOB_INVALID_STATE, not ERR_CREDIT_LIMIT_EXCEEDED.
        test_recipe:
          setup:
            - "Customer credit_limit 40000; job with one item (quote 34139) accepted once (exposure now 34139); credit limit then lowered to 1000 via PATCH"
          setup_api_calls:
            - { call: "POST /crating/customers", payload: { name: "Prio Co", site_code: "PRI-01", credit_limit_cents: 40000 }, as: SalesRep, captures: { cust_id: $.data.id } }
            - { call: "POST /crating/packing-jobs", payload: { customer_id: "${cust_id}", mode: SHOP, incoterm: FOB }, as: SalesRep, captures: { job_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/items", payload: { description: "Pump assembly", length_cm: 100, width_cm: 80, height_cm: 60, weight_kg: 40, fragile_class: STANDARD, declared_value_cents: 500000 }, as: SalesRep, captures: { item_id: $.data.id } }
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "PATCH /crating/customers/${cust_id}", payload: { credit_limit_cents: 1000 }, as: SalesRep }
          trigger:
            - { call: "POST /crating/packing-jobs/${job_id}/accept-quote", payload: {}, as: Customer, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_JOB_INVALID_STATE (state priority 6) — NOT ERR_CREDIT_LIMIT_EXCEEDED (fiscal priority 31), though both conditions hold"
            - "PackingJob.${job_id}.status remains DESIGN"
      - name: seal_safety_beats_fiscal_stamps
