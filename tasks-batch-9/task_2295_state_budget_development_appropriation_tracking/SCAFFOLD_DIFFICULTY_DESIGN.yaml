        distinguishing_aspect: |
          The gating entity is the owning Appropriation and the gating attribute is its cash
          dimension: prepare on a DRAFT Allotment returns ERR_CASH_FROZEN while
          Appropriation.cash_status == FROZEN and succeeds unchanged once the controller
          unfreezes, with no change to the Allotment itself in between.
