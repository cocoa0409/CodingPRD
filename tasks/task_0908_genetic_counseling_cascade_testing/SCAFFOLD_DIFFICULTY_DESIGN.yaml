            - "CascadeInvitation.${inv_id}.status == DRAFT"
            - "Family.${fid}.outreach_reserved_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: counselor_double_booking_buffered_adjacency
        grounds:
          - validations[priority=10]
          - entities.CounselingSession.fields.scheduled_start
          - entities.CounselingSession.fields.scheduled_end
        distinguishing_aspect: "Counselor resource, buffered-adjacency semantics: a second session starting 10 minutes after the first ends is rejected because the 15-minute buffer is violated (gap < BUFFER_MINUTES), even though the raw intervals do not overlap."
        test_recipe:
          setup:
            - "Counselor with an existing SCHEDULED session 10:00-11:00 on 2026-06-01"
          setup_api_calls:
            - { call: "POST /families", payload: { family_name: "Fam15", outreach_budget_cents: 10000 }, as: ProgramAdmin, captures: { fid: $.data.id } }
            - { call: "POST /counselors", payload: { full_name: "GC N", npi: "1000000014" }, as: ProgramAdmin, captures: { cid: $.data.id } }
            - { call: "POST /counseling-cases", payload: { family_id: "${fid}", assigned_counselor_id: "${cid}", patient_name: "Prob N", patient_dob: "1980-03-30", sex: "FEMALE", ancestry: "EUROPEAN", referral_reason: "FHx", covered_sessions: 5 }, as: GeneticCounselor, as_user_id: "${cid}", captures: { case_id: $.data.id } }
            - { call: "POST /counseling-sessions", payload: { counseling_case_id: "${case_id}", counselor_id: "${cid}", session_type: "PRE_TEST", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T11:00:00Z" }, as: GeneticCounselor, as_user_id: "${cid}" }
          trigger:
