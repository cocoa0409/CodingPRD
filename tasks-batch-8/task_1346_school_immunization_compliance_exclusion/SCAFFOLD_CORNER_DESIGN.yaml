scaffold_corner_design:
  # =====================================================================
  # From Table 1 (Entities)
  # =====================================================================
  - section: entities
    instances:
      - name: student_creation_applies_defaults
        claim_type: creation_defaults
        grounds:
          - entities.Student.fields.status
          - entities.Student.fields.provisional_deadline
          - calculations.timing_rules
        distinguishing_aspect: "POST /api/students returns 201 with system/computed fields populated in the creation response itself: status ENROLLED_PROVISIONAL, provisional_deadline == enrollment_date + 30 days, version == 1, deficiency_vaccine_codes computed against applicable requirements."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027; clock at default 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
          trigger:
            - call: "POST /api/students"
              payload: { legal_name: "Lee Default", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-D1", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_status: $.data.status, stu_deadline: $.data.provisional_deadline, stu_v: $.data.version, stu_def: $.data.deficiency_vaccine_codes }
          assert:
            - "response envelope: meta.api_request_id present, response_type == object"
            - "status == ENROLLED_PROVISIONAL"
            - "provisional_deadline == 2026-08-31T00:00:00Z (2026-08-01 + 30 days)"
            - "version == 1"
            - "deficiency_vaccine_codes == [\"MMR\"]"

      - name: student_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_STUDENT_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but unknown student UUID returns 404 ERR_STUDENT_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/students/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 404 with error_id == ERR_STUDENT_NOT_FOUND"

      - name: student_missing_required_grade_returns_400
        claim_type: required_fields
        grounds:
          - entities.Student.fields.grade
          - validations[priority=10]
        distinguishing_aspect: "Omitting the required input field grade returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { legal_name: "No Grade", date_of_birth: "2020-06-15T00:00:00Z", school_code: "SCH-D1", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 400 with error_id == ERR_VALIDATION"

      - name: student_invalid_grade_enum_returns_400
        claim_type: type_constraints
        grounds:
          - entities.Student.fields.grade
          - validations[priority=10]
        distinguishing_aspect: "A grade value outside the declared enum (G13) returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/students"
              payload: { legal_name: "Bad Grade", date_of_birth: "2020-06-15T00:00:00Z", grade: "G13", school_code: "SCH-D1", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 400 with error_id == ERR_VALIDATION"

      - name: students_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "GET /api/students honors limit/offset and reports total_count and has_more correctly across pages."
        test_recipe:
          setup: ["three students registered at school SCH-P"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "P One", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-P", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
            - call: "POST /api/students"
              payload: { legal_name: "P Two", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-P", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
            - call: "POST /api/students"
              payload: { legal_name: "P Three", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-P", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
          trigger:
            - call: "GET /api/students?school_code=SCH-P&limit=2&offset=0"
              as: SchoolNurse
            - call: "GET /api/students?school_code=SCH-P&limit=2&offset=2"
              as: SchoolNurse
          assert:
            - "page 1: 2 items, total_count == 3, has_more == true"
            - "page 2: 1 item, total_count == 3, has_more == false"

  # =====================================================================
  # From Table 2 (State Machines)
  # =====================================================================
  - section: state_machines
    instances:
      - name: approve_exemption_from_submitted_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ExemptionRequest
          - errors[ERR_EXEMPTION_NOT_REVIEWABLE]
        distinguishing_aspect: "approve from SUBMITTED (skipping start-review) is rejected with ERR_EXEMPTION_NOT_REVIEWABLE; the request stays SUBMITTED."
        test_recipe:
          setup: ["student with a SUBMITTED MMR exemption request"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Skip Step", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-SM", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/students/${stu_id}/exemption-requests"
              payload: { vaccine_code: "MMR", exemption_type: "MEDICAL", document_ref: "doc://sm-1" }
              as: SchoolNurse
              as_user_id: "nurse-1"
              captures: { exm_id: $.data.id }
          trigger:
            - call: "POST /api/exemption-requests/${exm_id}/approve"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_EXEMPTION_NOT_REVIEWABLE"
            - "ExemptionRequest.${exm_id} remains SUBMITTED"

      - name: resubmit_from_approved_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ExemptionRequest.DENIED_to_SUBMITTED
          - errors[ERR_EXEMPTION_NOT_RESUBMITTABLE]
        distinguishing_aspect: "resubmit is only legal from DENIED; from APPROVED it is rejected with ERR_EXEMPTION_NOT_RESUBMITTABLE."
        test_recipe:
          setup: ["student with an APPROVED MMR exemption request"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Re Sub", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-SM", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/students/${stu_id}/exemption-requests"
              payload: { vaccine_code: "MMR", exemption_type: "RELIGIOUS", document_ref: "doc://sm-2" }
              as: SchoolNurse
              as_user_id: "nurse-1"
              captures: { exm_id: $.data.id }
            - call: "POST /api/exemption-requests/${exm_id}/start-review"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "POST /api/exemption-requests/${exm_id}/approve"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /api/exemption-requests/${exm_id}/resubmit"
              payload: { document_ref: "doc://sm-2b" }
              as: SchoolNurse
              as_user_id: "nurse-1"
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_EXEMPTION_NOT_RESUBMITTABLE"
            - "ExemptionRequest.${exm_id} remains APPROVED"

      - name: withdraw_twice_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Student
          - errors[ERR_STUDENT_NOT_ACTIVE]
        distinguishing_aspect: "WITHDRAWN is terminal: a second withdraw returns ERR_STUDENT_NOT_ACTIVE."
        test_recipe:
          setup: ["one registered student"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Will Draw", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-SM", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/students/${stu_id}/withdraw"
              payload: {}
              as: HealthClerk
          trigger:
            - call: "POST /api/students/${stu_id}/withdraw"
              payload: {}
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_STUDENT_NOT_ACTIVE"

      - name: rescind_terminal_notice_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.ComplianceNotice
          - errors[ERR_NOTICE_NOT_OPEN]
        distinguishing_aspect: "A RESCINDED notice is terminal: a second rescind returns ERR_NOTICE_NOT_OPEN."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-N, no doses; clock 2026-09-01; sweep has issued an INITIAL_NONCOMPLIANCE notice (ISSUED)"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "No Tice", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-N", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: DistrictHealthOfficer
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
            - call: "GET /api/students/${stu_id}/compliance-notices"
              as: DistrictHealthOfficer
              captures: { notice_id: "$.data[0].id" }
          trigger:
            - call: "POST /api/compliance-notices/${notice_id}/rescind"
              payload: { reason: "clerical error" }
              as: DistrictHealthOfficer
            - call: "POST /api/compliance-notices/${notice_id}/rescind"
              payload: { reason: "second attempt" }
              as: DistrictHealthOfficer
              captures: { err: $.data.error_id }
          assert:
            - "first rescind: 200, status RESCINDED, resolved_at == 2026-09-01T00:00:00Z"
            - "second rescind: 409 with error_id == ERR_NOTICE_NOT_OPEN"

      - name: complete_appointment_creates_verified_dose
        claim_type: side_effect_execution
        grounds:
          - state_machines.ClinicAppointment.BOOKED_to_COMPLETED
          - entities.ImmunizationRecord.fields.source
        distinguishing_aspect: "Completing an appointment creates a VERIFIED ImmunizationRecord with source == CLINIC and clinic_appointment_id set, re-evaluates the student to ENROLLED_COMPLIANT, and decrements booked_count."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Session school SCH-C6 on 2026-08-10T09:00:00Z, 120 min, capacity 5, OPEN; student booked 09:30-10:00"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Com Plete", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C6", session_date: "2026-08-10T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { sess_v: $.data.version }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-08-10T09:30:00Z", end_time: "2026-08-10T10:00:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /api/clinic-appointments/${appt_id}/complete"
              payload: {}
              as: SchoolNurse
            - call: "GET /api/clinic-appointments/${appt_id}/immunization-records"
              as: SchoolNurse
              captures: { rec_source: "$.data[0].source", rec_status: "$.data[0].status" }
            - call: "GET /api/students/${stu_id}"
              as: SchoolNurse
              captures: { stu_status: $.data.status }
            - call: "GET /api/clinic-sessions/${sess_id}"
              as: SchoolNurse
              captures: { booked: $.data.booked_count }
          assert:
            - "created record: source == CLINIC, status == VERIFIED, dose_number == 1, administered_date == 2026-08-10T09:30:00Z"
            - "Student.${stu_id}.status == ENROLLED_COMPLIANT"
            - "ClinicSession.booked_count == 0"

      - name: cancel_session_cascades_to_appointments
        claim_type: cascade_down
        grounds:
          - state_machines.ClinicSession.OPEN_to_CANCELLED
        distinguishing_aspect: "Cancelling an OPEN session cancels its BOOKED appointments and zeroes booked_count."
        test_recipe:
          setup:
            - "Session school SCH-C7 on 2026-08-10T09:00:00Z, 120 min, capacity 5, OPEN, with one BOOKED appointment"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Cas Cade", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C7", session_date: "2026-08-10T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { sess_v: $.data.version }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-08-10T09:30:00Z", end_time: "2026-08-10T10:00:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /api/clinic-sessions/${sess_id}/cancel"
              payload: {}
              as: SchoolNurse
            - call: "GET /api/clinic-appointments/${appt_id}"
              as: SchoolNurse
              captures: { appt_status: $.data.status }
            - call: "GET /api/clinic-sessions/${sess_id}"
              as: SchoolNurse
              captures: { sess_status: $.data.status, booked: $.data.booked_count }
          assert:
            - "ClinicSession.status == CANCELLED and booked_count == 0"
            - "ClinicAppointment.${appt_id}.status == CANCELLED"

      - name: outbreak_lift_reinstates_and_readmits
        claim_type: side_effect_execution
        grounds:
          - state_machines.OutbreakEvent.ACTIVE_to_LIFTED
          - state_machines.ExemptionRequest.SUSPENDED_OUTBREAK_to_APPROVED
        distinguishing_aspect: "Lifting the outbreak reverses the declaration cascade: exemption returns to APPROVED, the student returns to ENROLLED_COMPLIANT, and the OUTBREAK_EXCLUSION notice is CURED."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-XL with APPROVED MMR exemption (ENROLLED_COMPLIANT); outbreak (SCH-XL, MMR) declared so student is EXCLUDED"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Li Ft", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-XL", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/students/${stu_id}/exemption-requests"
              payload: { vaccine_code: "MMR", exemption_type: "MEDICAL", document_ref: "doc://xl-1" }
              as: SchoolNurse
              as_user_id: "nurse-1"
              captures: { exm_id: $.data.id }
            - call: "POST /api/exemption-requests/${exm_id}/start-review"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "POST /api/exemption-requests/${exm_id}/approve"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
            - call: "POST /api/outbreak-events"
              payload: { school_code: "SCH-XL", vaccine_code: "MMR" }
              as: DistrictHealthOfficer
              captures: { ob_id: $.data.id }
          trigger:
            - call: "POST /api/outbreak-events/${ob_id}/lift"
              payload: {}
              as: DistrictHealthOfficer
            - call: "GET /api/students/${stu_id}/exemption-requests"
              as: DistrictHealthOfficer
              captures: { exm_status: "$.data[0].status" }
            - call: "GET /api/students/${stu_id}"
              as: DistrictHealthOfficer
              captures: { stu_status: $.data.status }
            - call: "GET /api/students/${stu_id}/compliance-notices"
              as: DistrictHealthOfficer
              captures: { notice_status: "$.data[0].status" }
          assert:
            - "ExemptionRequest.${exm_id}.status == APPROVED"
            - "Student.${stu_id}.status == ENROLLED_COMPLIANT"
            - "the OUTBREAK_EXCLUSION notice status == CURED with resolved_at set"

      - name: finalize_snapshot_twice_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.ComplianceSnapshot
          - errors[ERR_SNAPSHOT_FINALIZED]
        distinguishing_aspect: "FINALIZED is terminal: a second finalize returns ERR_SNAPSHOT_FINALIZED."
        test_recipe:
          setup: ["one DRAFT snapshot for (2026-2027, SCH-F, K, CENSUS_DATE)"]
          setup_api_calls:
            - call: "POST /api/compliance-snapshots/generate"
              payload: { school_year: "2026-2027", school_code: "SCH-F", grade: "K", census_date: "2026-10-01T00:00:00Z", rate_variant: "CENSUS_DATE" }
              as: RegistryCoordinator
              captures: { snap_id: $.data.id }
          trigger:
            - call: "POST /api/compliance-snapshots/${snap_id}/finalize"
              payload: {}
              as: DistrictHealthOfficer
            - call: "POST /api/compliance-snapshots/${snap_id}/finalize"
              payload: {}
              as: DistrictHealthOfficer
              captures: { err: $.data.error_id }
          assert:
            - "first finalize: 200, status FINALIZED"
            - "second finalize: 409 with error_id == ERR_SNAPSHOT_FINALIZED"

      - name: sweep_marks_overdue_appointment_no_show
        claim_type: valid_transition
        grounds:
          - state_machines.ClinicAppointment.BOOKED_to_NO_SHOW
        distinguishing_aspect: "The sweep auto-transitions BOOKED appointments whose end_time is in the past to NO_SHOW and frees the session seat."
        test_recipe:
          setup:
            - "Session school SCH-C9 on 2026-08-02T09:00:00Z, 60 min, capacity 5, OPEN, with one BOOKED appointment 09:00-09:30"
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "No Show", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C9", session_date: "2026-08-02T09:00:00Z", duration_minutes: 60, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { sess_v: $.data.version }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-08-02T09:00:00Z", end_time: "2026-08-02T09:30:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
              captures: { appt_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: DistrictHealthOfficer
          trigger:
            - call: "POST /api/ops/compliance-sweep"
              payload: {}
              as: DistrictHealthOfficer
              captures: { noshow_count: $.data.appointments_no_show_count }
            - call: "GET /api/clinic-appointments/${appt_id}"
              as: SchoolNurse
              captures: { appt_status: $.data.status }
            - call: "GET /api/clinic-sessions/${sess_id}"
              as: SchoolNurse
              captures: { booked: $.data.booked_count }
          assert:
            - "sweep response appointments_no_show_count == 1"
            - "ClinicAppointment.${appt_id}.status == NO_SHOW"
            - "ClinicSession.booked_count == 0"

      - name: lift_twice_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.OutbreakEvent
          - errors[ERR_OUTBREAK_ALREADY_LIFTED]
        distinguishing_aspect: "LIFTED is terminal: lifting an already-lifted outbreak returns ERR_OUTBREAK_ALREADY_LIFTED."
        test_recipe:
          setup: ["one outbreak for (SCH-L2, MMR), declared then lifted"]
          setup_api_calls:
            - call: "POST /api/outbreak-events"
              payload: { school_code: "SCH-L2", vaccine_code: "MMR" }
              as: DistrictHealthOfficer
              captures: { ob_id: $.data.id }
            - call: "POST /api/outbreak-events/${ob_id}/lift"
              payload: {}
              as: DistrictHealthOfficer
          trigger:
            - call: "POST /api/outbreak-events/${ob_id}/lift"
              payload: {}
              as: DistrictHealthOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_OUTBREAK_ALREADY_LIFTED"

      - name: open_twice_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ClinicSession.SCHEDULED_to_OPEN
          - errors[ERR_SESSION_NOT_OPENABLE]
        distinguishing_aspect: "open is only legal from SCHEDULED: opening an already-OPEN session returns ERR_SESSION_NOT_OPENABLE."
        test_recipe:
          setup: ["one OPEN session at SCH-C11"]
          setup_api_calls:
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C11", session_date: "2026-09-01T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
          trigger:
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_SESSION_NOT_OPENABLE"

      - name: close_from_scheduled_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.ClinicSession.OPEN_to_CLOSED
          - errors[ERR_SESSION_NOT_CLOSABLE]
        distinguishing_aspect: "close is only legal from OPEN: closing a SCHEDULED session returns ERR_SESSION_NOT_CLOSABLE."
        test_recipe:
          setup: ["one SCHEDULED session at SCH-C12"]
          setup_api_calls:
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C12", session_date: "2026-09-01T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /api/clinic-sessions/${sess_id}/close"
              payload: {}
              as: SchoolNurse
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_SESSION_NOT_CLOSABLE"

      - name: cancel_closed_session_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.ClinicSession
          - errors[ERR_SESSION_NOT_CANCELLABLE]
        distinguishing_aspect: "CLOSED is terminal for cancellation: cancelling a CLOSED session returns ERR_SESSION_NOT_CANCELLABLE."
        test_recipe:
          setup: ["one session at SCH-C13 driven SCHEDULED -> OPEN -> CLOSED"]
          setup_api_calls:
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C13", session_date: "2026-09-01T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
            - call: "POST /api/clinic-sessions/${sess_id}/close"
              payload: {}
              as: SchoolNurse
          trigger:
            - call: "POST /api/clinic-sessions/${sess_id}/cancel"
              payload: {}
              as: SchoolNurse
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_SESSION_NOT_CANCELLABLE"

      - name: cancel_twice_appointment_rejected
        claim_type: terminal_lockdown
        grounds:
          - state_machines.ClinicAppointment.BOOKED_to_CANCELLED
          - errors[ERR_APPOINTMENT_NOT_BOOKED]
        distinguishing_aspect: "CANCELLED is terminal: cancelling the same appointment twice returns ERR_APPOINTMENT_NOT_BOOKED on the second attempt."
        test_recipe:
          setup: ["OPEN session at SCH-C14 with one appointment, already cancelled once"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Cancel Twice", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C14", session_date: "2026-09-01T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { sess_v: $.data.version }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T10:30:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
              captures: { appt_id: $.data.id }
            - call: "POST /api/clinic-appointments/${appt_id}/cancel"
              payload: {}
              as: HealthClerk
          trigger:
            - call: "POST /api/clinic-appointments/${appt_id}/cancel"
              payload: {}
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_APPOINTMENT_NOT_BOOKED"

  # =====================================================================
  # From Table 3 (Calculations)
  # =====================================================================
  - section: calculations
    instances:
      - name: min_age_violation_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=6]
          - errors[ERR_MIN_AGE_VIOLATION]
        distinguishing_aspect: "A dose administered before date_of_birth + min_age_months (2025-08-01 + 12 months = 2026-08-01; dose on 2026-07-15) is rejected with ERR_MIN_AGE_VIOLATION."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 1, min_interval_days 0, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-Z1, DOB 2025-08-01"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Too Young", date_of_birth: "2025-08-01T00:00:00Z", grade: "K", school_code: "SCH-Z1", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_v: $.data.version }
          trigger:
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-07-15T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 422 with error_id == ERR_MIN_AGE_VIOLATION"

      - name: duplicate_dose_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_DOSE]
        distinguishing_aspect: "A second non-VOIDED record with the same (student, vaccine_code, dose_number) — but a date that satisfies the minimum interval — is rejected with ERR_DUPLICATE_DOSE, isolating the constraint check from the safety check."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 2, min_interval_days 28, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-Z2, DOB 2020-06-15, with MMR dose_number 1 administered 2026-08-05 (PENDING_VERIFICATION is enough — non-VOIDED)"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 2, min_interval_days: 28, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Dupe Dose", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Z2", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_v: $.data.version }
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
            - call: "GET /api/students/${stu_id}"
              as: HealthClerk
              captures: { stu_v2: $.data.version }
          trigger:
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-09-10T00:00:00Z", expected_student_version: "${stu_v2}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_DUPLICATE_DOSE (interval rule passes: 2026-09-10 is 36 days after 2026-08-05 >= 28)"

      - name: snapshot_zero_enrollment_rate_null
        claim_type: correct_result
        grounds:
          - calculations.annual_compliance_rate
          - entities.ComplianceSnapshot.fields.compliance_rate
        distinguishing_aspect: "Zero-denominator boundary: a (school, grade) cell with no member students yields enrolled_count == 0 and compliance_rate == null, not a division error or 0.0."
        test_recipe:
          setup: ["no students at school SCH-EMPTY"]
          setup_api_calls: []
          trigger:
            - call: "POST /api/compliance-snapshots/generate"
              payload: { school_year: "2026-2027", school_code: "SCH-EMPTY", grade: "K", census_date: "2026-10-01T00:00:00Z", rate_variant: "CENSUS_DATE" }
              as: RegistryCoordinator
              captures: { enrolled: $.data.enrolled_count, rate: $.data.compliance_rate }
          assert:
            - "enrolled_count == 0 and compliance_rate == null"

      - name: requirement_grade_filtering
        claim_type: input_set_filtering
        grounds:
          - calculations.requirement_evaluation
          - entities.VaccineRequirement.fields.applies_to_grades
        distinguishing_aspect: "Input-set filtering by grade: a requirement whose applies_to_grades is [PK] is not evaluated against a grade-K student — the compliance view shows zero requirement rows and an empty deficiency list."
        test_recipe:
          setup:
            - "Requirement MMR applies_to_grades [PK] only, doses_required 1, school_year 2026-2027"
            - "Student grade K school SCH-G1"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["PK"], doses_required: 1, min_interval_days: 0, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Grade Filter", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-G1", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_def: $.data.deficiency_vaccine_codes }
          trigger:
            - call: "GET /api/students/${stu_id}/compliance"
              as: SchoolNurse
              captures: { stu_status: $.data.student_status }
          assert:
            - "GET compliance requirements array is empty (no PK requirement applies to grade K)"
            - "Student.deficiency_vaccine_codes == []"

      - name: snapshot_uses_reconciled_variant
        claim_type: variant_selection
        grounds:
          - calculations.annual_compliance_rate
          - calculations.requirement_evaluation
        distinguishing_aspect: "Variant selection: the snapshot's compliant_count uses the REGISTRY_RECONCILED variant, so a student short one LOCAL dose but made whole by a REGISTRY_IMPORT dose counts as compliant in the snapshot while their official Student.status (LOCAL basis) remains non-compliant."
        test_recipe:
          setup:
            - "Requirement MMR grade K doses_required 2, min_interval_days 28, min_age_months 12, school_year 2026-2027"
            - "Student grade K school SCH-REG with one VERIFIED MANUAL dose (2026-08-05) and one registry-seeded dose imported by a sync run"
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 2, min_interval_days: 28, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
            - call: "POST /api/students"
              payload: { legal_name: "Reg Recon", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-REG", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id, stu_v: $.data.version }
            - call: "POST /api/students/${stu_id}/immunization-records"
              payload: { vaccine_code: "MMR", dose_number: 1, administered_date: "2026-08-05T00:00:00Z", expected_student_version: "${stu_v}" }
              as: HealthClerk
              captures: { rec1: $.data.id }
            - call: "POST /api/immunization-records/${rec1}/verify"
              payload: {}
              as: SchoolNurse
            - call: "POST /_registry/seed-doses"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", dose_number: 2, administered_date: "2026-09-05T00:00:00Z" }
              as: RegistryCoordinator
            - call: "POST /api/registry-sync-runs"
              payload: { school_code: "SCH-REG" }
              as: RegistryCoordinator
          trigger:
            - call: "POST /api/compliance-snapshots/generate"
              payload: { school_year: "2026-2027", school_code: "SCH-REG", grade: "K", census_date: "2026-10-01T00:00:00Z", rate_variant: "CENSUS_DATE" }
              as: RegistryCoordinator
              captures: { snap_compliant: $.data.compliant_count, snap_rate: $.data.compliance_rate }
            - call: "GET /api/students/${stu_id}"
              as: DistrictHealthOfficer
              captures: { stu_status: $.data.status }
          assert:
            - "snapshot: enrolled_count == 1, compliant_count == 1, compliance_rate == 100.0 (reconciled variant counts the imported dose)"
            - "Student.${stu_id}.status == ENROLLED_PROVISIONAL (LOCAL_RECORDS basis: only 1 of 2 doses)"

  # =====================================================================
  # From Table 4 (Validations)
  # =====================================================================
  - section: validations
    instances:
      - name: segregation_of_duties_on_approve
        claim_type: conditional_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles[DistrictHealthOfficer]
        distinguishing_aspect: "Segregation of duties: a DistrictHealthOfficer who personally submitted an exemption request cannot start-review or approve it (ERR_SEGREGATION_OF_DUTIES); a different officer can."
        test_recipe:
          setup: ["student at SCH-SOD; exemption submitted by officer-1 (DistrictHealthOfficer may submit, shared operation)"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Seg Duty", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-SOD", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/students/${stu_id}/exemption-requests"
              payload: { vaccine_code: "MMR", exemption_type: "MEDICAL", document_ref: "doc://sod-1" }
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
              captures: { exm_id: $.data.id }
          trigger:
            - call: "POST /api/exemption-requests/${exm_id}/start-review"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
            - call: "POST /api/exemption-requests/${exm_id}/start-review"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-2"
            - call: "POST /api/exemption-requests/${exm_id}/approve"
              payload: {}
              as: DistrictHealthOfficer
              as_user_id: "officer-2"
          assert:
            - "officer-1 start-review: 409 with error_id == ERR_SEGREGATION_OF_DUTIES"
            - "officer-2 start-review and approve: 200; ExemptionRequest.${exm_id}.status == APPROVED"

      - name: duplicate_requirement_config_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_DUPLICATE_REQUIREMENT]
        distinguishing_aspect: "A second VaccineRequirement for the same (vaccine_code, school_year) is rejected with ERR_DUPLICATE_REQUIREMENT."
        test_recipe:
          setup: ["one existing MMR 2026-2027 requirement"]
          setup_api_calls:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["K"], doses_required: 2, min_interval_days: 28, min_age_months: 12, school_year: "2026-2027" }
              as: DistrictHealthOfficer
          trigger:
            - call: "POST /api/vaccine-requirements"
              payload: { vaccine_code: "MMR", applies_to_grades: ["G1"], doses_required: 1, min_interval_days: 0, min_age_months: 0, school_year: "2026-2027" }
              as: DistrictHealthOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_DUPLICATE_REQUIREMENT"

      - name: appointment_outside_session_window_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors[ERR_APPOINTMENT_OUTSIDE_SESSION]
        distinguishing_aspect: "An appointment whose [start_time, end_time) lies outside the session window [session_date, session_date + duration_minutes) is rejected with ERR_APPOINTMENT_OUTSIDE_SESSION before any overlap check."
        test_recipe:
          setup: ["Session school SCH-C8 on 2026-09-01T09:00:00Z, 60 min (window 09:00-10:00), capacity 5, OPEN; student A"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Out Side", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C8", session_date: "2026-09-01T09:00:00Z", duration_minutes: 60, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { sess_v: $.data.version }
          trigger:
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:30:00Z", end_time: "2026-09-01T11:00:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 422 with error_id == ERR_APPOINTMENT_OUTSIDE_SESSION"

      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without the X-User-Role header is rejected with 401 ERR_UNAUTHENTICATED before any other check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/students"
          assert:
            - "response 401 with error_id == ERR_UNAUTHENTICATED"

      - name: duplicate_active_outbreak_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors[ERR_OUTBREAK_ALREADY_ACTIVE]
        distinguishing_aspect: "Declaring a second ACTIVE outbreak for the same (school_code, vaccine_code) is rejected with ERR_OUTBREAK_ALREADY_ACTIVE (idempotency of outbreak declaration)."
        test_recipe:
          setup: ["ACTIVE outbreak for (SCH-DUP, MMR) already declared"]
          setup_api_calls:
            - call: "POST /api/outbreak-events"
              payload: { school_code: "SCH-DUP", vaccine_code: "MMR" }
              as: DistrictHealthOfficer
          trigger:
            - call: "POST /api/outbreak-events"
              payload: { school_code: "SCH-DUP", vaccine_code: "MMR" }
              as: DistrictHealthOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response 409 with error_id == ERR_OUTBREAK_ALREADY_ACTIVE"

      - name: manual_notice_requires_non_compliant
        claim_type: conditional_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_NOTICE_NOT_ALLOWED]
        distinguishing_aspect: "Manually issuing an INITIAL_NONCOMPLIANCE notice for a student still inside the provisional window (status ENROLLED_PROVISIONAL) is rejected with ERR_NOTICE_NOT_ALLOWED."
        test_recipe:
          setup: ["student grade K school SCH-MN, no doses, status ENROLLED_PROVISIONAL (clock at default 2026-08-01)"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Notice Early", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-MN", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
          trigger:
            - call: "POST /api/students/${stu_id}/compliance-notices"
              payload: { notice_type: "INITIAL_NONCOMPLIANCE" }
              as: DistrictHealthOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response 422 with error_id == ERR_NOTICE_NOT_ALLOWED"

  # =====================================================================
  # From Table 5 (Endpoints)
  # =====================================================================
  - section: endpoints
    instances:
      - name: student_appointments_reverse_listing
        claim_type: fk_reverse_reachability
        grounds:
          - entities.ClinicAppointment.fields.student_id
        distinguishing_aspect: "FK reverse-reachability: GET /api/students/{id}/clinic-appointments returns exactly the appointments booked for that student."
        test_recipe:
          setup: ["student A with one BOOKED appointment in an OPEN session at SCH-C10"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Rev Fk", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-Y", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/clinic-sessions"
              payload: { school_code: "SCH-C10", session_date: "2026-09-01T09:00:00Z", duration_minutes: 120, capacity: 5 }
              as: SchoolNurse
              captures: { sess_id: $.data.id }
            - call: "POST /api/clinic-sessions/${sess_id}/open"
              payload: {}
              as: SchoolNurse
              captures: { sess_v: $.data.version }
            - call: "POST /api/clinic-sessions/${sess_id}/appointments"
              payload: { student_id: "${stu_id}", vaccine_code: "MMR", start_time: "2026-09-01T10:00:00Z", end_time: "2026-09-01T10:30:00Z", expected_clinic_session_version: "${sess_v}" }
              as: HealthClerk
          trigger:
            - call: "GET /api/students/${stu_id}/clinic-appointments"
              as: SchoolNurse
          assert:
            - "response 200 with response_type == array, total_count == 1, and the single item's clinic_session_id == ${sess_id}"

      - name: compliance_read_dual_variant_shape
        claim_type: computed_read
        grounds:
          - endpoints[GET /api/students/{id}/compliance]
        excluded_because:
          difficulty_instance: local_vs_reconciled_requirement_evaluation
          rationale: "The dual-variant compliance read (both local_status and reconciled_status per requirement row) is asserted as the core observation of the named §1.8 instance."

      - name: session_full_error_trigger
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SESSION_FULL]
        excluded_because:
          difficulty_instance: session_capacity_exact_boundary
          rationale: "ERR_SESSION_FULL is triggered and asserted as the failure path of the named §1.8 boundary instance."

  # =====================================================================
