        claim_type: role_exclusive_denial
        grounds: ["roles.ToolingEngineer", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Tool creation is exclusive to ToolingEngineer; MaterialsPlanner is denied with ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /tools", payload: { tool_code: "T-R1", part_number: "P-R1", tool_type: FORM_MOLD, min_gauge_mm: 1.000, max_gauge_mm: 3.000, cleanliness_grade: INDUSTRIAL, prototype_cost: 1000.00 }, as: MaterialsPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE with HTTP 403 (captured ${err})"
      - name: packaging_engineer_cannot_decide_spec
        claim_type: role_exclusive_denial
        grounds: ["roles.PlantManager", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Approval-chain enforcement: the PackagingEngineer who drafts a CUSTOM spec cannot decide it — decide is exclusive to PlantManager (403 before any state check)."
        test_recipe:
          setup: ["CUSTOM spec PENDING_APPROVAL created by PackagingEngineer"]
          setup_api_calls:
            - { call: "POST /packaging-specs", payload: { spec_code: "S-R2", spec_type: CUSTOM, cleanliness_grade: FOOD, per_pack_cost: 0.90 }, as: PackagingEngineer, captures: { spec_id: $.data.id, st: $.data.status } }
          trigger:
            - { call: "POST /packaging-specs/${spec_id}/decide", payload: { decision: APPROVED }, as: PackagingEngineer, captures: { err: $.data.error_id } }
          assert:
            - "Spec entered PENDING_APPROVAL at creation (captured ${st})"
            - "error_id == ERR_FORBIDDEN_ROLE (captured ${err})"
      - name: scheduler_cannot_record_inspection
        claim_type: role_exclusive_denial
        grounds: ["roles.QualityInspector", "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "Inspection recording is exclusive to QualityInspector; ProductionScheduler is denied with ERR_FORBIDDEN_ROLE at priority 2, before existence checks on the (deliberately unknown) order id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /quality-inspections", payload: { production_order_id: "00000000-0000-4000-8000-0000000000aa", booth_id: "00000000-0000-4000-8000-0000000000bb", inspection_type: FINAL, scheduled_start: "2026-05-02T12:00:00Z", scheduled_end: "2026-05-02T12:30:00Z", wall_measurements_mm: [1.240] }, as: ProductionScheduler, captures: { err: $.data.error_id } }
