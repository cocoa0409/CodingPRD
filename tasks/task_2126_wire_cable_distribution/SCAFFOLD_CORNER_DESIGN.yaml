        distinguishing_aspect: "conductor_metal ALUMINUM short-circuits the pass-through: copper_adder_cents_per_ft is 0.0000 and metal_cents is 0 no matter what the published index says, so a 1000 ft line at 100 c/ft prices to exactly 100000 cents."
        test_recipe:
          setup:
            - "One branch, one customer, product P3 (aluminium, 100 c/ft base, no cut charge), index CI1 at 450 c/lb."
