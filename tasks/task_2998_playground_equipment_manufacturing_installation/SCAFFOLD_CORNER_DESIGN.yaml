          setup:
            - "Clock 2026-08-01T09:00:00Z. Standard ACTIVE, one certified PRESCHOOL_2_5 POST model at 10750 cents, project (accessible_route_required false, budget 500000, fundraising_deadline 2026-12-31) in RENDERED with one area at depth 30 and one VALIDATED placement of quantity 3. One ISSUED FIRM quote fixes the bucket targets: subtotal 32250, freight 51750, total 84000. Two pledges exist in PLEDGED: 60000 and 30000 cents."
