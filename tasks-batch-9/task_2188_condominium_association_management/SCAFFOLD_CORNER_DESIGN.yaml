# §1.9 Scaffold Corner Design — breadth probe for task_2188 condominium-association-management.
# Taxonomy: references/claim-extraction-guide.md (nine sections = `section:` values,
# per-section rows = `claim_type:` values). Every grounds reference resolves into
# SCAFFOLD.yaml §1.1–§1.7. Logical clock starts at 2026-08-01T00:00:00Z per
# endpoints[POST /_clock/set_current_utc].
scaffold_corner_design:
  - section: entities
    instances:
      - name: association_create_applies_every_declared_bylaw_default
        claim_type: defaults
        grounds:
          - endpoints[POST /associations]
          - entities.Association.fields.fiscal_year_start_month.default
          - entities.Association.fields.master_policy_deductible_cents.default
          - entities.Association.fields.association_deductible_cap_cents.default
          - entities.Association.fields.late_fee_grace_days.default
          - entities.Association.fields.lien_threshold_cents.default
          - entities.Association.fields.budget_veto_bp.default
          - entities.Association.fields.special_assessment_approval_bp.default
          - entities.Association.fields.board_quorum_seats.default
          - entities.Association.fields.hearing_docket_capacity.default
          - entities.Association.fields.reserve_adequacy_threshold_bp.default
          - entities.Association.fields.resale_cert_fee_cents.default
        distinguishing_aspect: "A registration body carrying ONLY legal_name must materialise all 24 by-law tunables at their declared defaults, plus the three system money fields at 0 and total_interest_bp at 0 — a scaffold that leaves any tunable null would make every downstream threshold rule unevaluable."
        test_recipe:
          setup:
            - "Empty database; the logical clock is pinned to 2026-08-01T00:00:00Z so created_at is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              as: CommunityManager
              payload: { current_utc: "2026-08-01T00:00:00Z" }
          trigger:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
          assert:
            - "HTTP 201"
            - "response_type == \"object\" and meta.api_request_id is present"
            - "data.legal_name == \"Harbor Point Condominium Association\""
            - "data.fiscal_year_start_month == 1"
            - "data.master_policy_deductible_cents == 2500000"
            - "data.association_deductible_cap_cents == 1000000"
            - "data.late_fee_grace_days == 10"
            - "data.late_fee_percent_bp == 1000"
            - "data.late_fee_min_cents == 2500"
            - "data.late_fee_cap_cents == 10000"
            - "data.lien_threshold_cents == 180000"
            - "data.budget_veto_bp == 5000"
            - "data.special_assessment_approval_bp == 6667"
            - "data.board_quorum_seats == 3"
            - "data.hearing_docket_capacity == 6"
            - "data.element_window_buffer_hours == 24"
            - "data.reserve_adequacy_threshold_bp == 7000"
            - "data.reserve_contribution_min_bp == 1000"
            - "data.fine_tier_1_cents == 5000"
            - "data.fine_tier_2_cents == 10000"
            - "data.fine_tier_3_daily_cents == 25000"
            - "data.fine_cap_cents == 250000"
            - "data.repeat_lookback_days == 365"
            - "data.cure_period_days == 14"
            - "data.appeal_window_days == 30"
            - "data.budget_notice_days == 30"
            - "data.certificate_validity_days == 30"
            - "data.resale_cert_fee_cents == 35000"
            - "data.total_interest_bp == 0"
            - "data.operating_cash_cents == 0"
            - "data.reserve_balance_cents == 0"
            - "data.reserve_designated_cents == 0"
            - "data.restricted_sa_cash_cents == 0"
            - "data.version == 1"

      - name: unit_create_computed_ledger_posture_input_ignored
        claim_type: computed_fields
        grounds:
          - endpoints[POST /associations/{association_id}/units]
          - entities.Unit.fields.balance_due_cents.source
          - entities.Unit.fields.delinquency_stage.source
          - entities.Unit.fields.voting_eligible.source
          - entities.Unit.fields.transfer_blocked.source
          - entities.Unit.fields.monthly_assessment_cents.source
        distinguishing_aspect: "Client-supplied values for the five computed posture fields are discarded, and transfer_blocked is born TRUE (default true) while voting_eligible is born TRUE — the two booleans start with opposite polarity, so an implementation that initialises them from one shared 'is-clean' flag fails."
        test_recipe:
          setup:
            - "An association exists with one owner of record; no ledger rows exist."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association", board_quorum_seats: 1 }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
          trigger:
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload:
                current_owner_id: "${owner1}"
                unit_label: "101"
                interest_bp: 5000
                heated_sqft: 1200
                balance_due_cents: 999999
                delinquency_stage: "LIEN_FILED"
                voting_eligible: false
                transfer_blocked: false
                monthly_assessment_cents: 777
              captures: { unit1: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.balance_due_cents == 0"
            - "data.credit_balance_cents == 0"
            - "data.oldest_unpaid_age_days == 0"
            - "data.delinquency_stage == \"CURRENT\""
            - "data.voting_eligible == true"
            - "data.transfer_blocked == true"
            - "data.monthly_assessment_cents == 0"
            - "data.lien_recorded_at == null"
            - "data.interest_bp == 5000 and data.heated_sqft == 1200"
            - "data.version == 1"

      - name: owner_create_defaults_board_role_none_and_unseated
        claim_type: defaults
        grounds:
          - endpoints[POST /associations/{association_id}/owners]
          - entities.UnitOwner.fields.board_role.default
          - entities.UnitOwner.fields.is_seated.default
          - entities.UnitOwner.fields.owned_unit_count.default
        distinguishing_aspect: "An owner created without board fields is NONE/false, which is exactly the state validations[priority 3] rejects for BoardDirector actors — the default must not be silently promoted to DIRECTOR by the presence of a seat count elsewhere."
        test_recipe:
          setup:
            - "An association exists."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
          trigger:
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.board_role == \"NONE\""
            - "data.is_seated == false"
            - "data.owned_unit_count == 0"
            - "data.association_id == the association id captured as ${assoc}"
            - "data.version == 1"

      - name: unit_creation_recomputes_association_total_interest_and_owned_count
        claim_type: computed_fields
        grounds:
          - endpoints[POST /associations/{association_id}/units].side_effects
          - entities.Association.fields.total_interest_bp
          - entities.UnitOwner.fields.owned_unit_count
        distinguishing_aspect: "Each unit insert must roll BOTH aggregates forward (Association.total_interest_bp and UnitOwner.owned_unit_count) and bump Association.version once per insert — so after two 2500 bp units the association reads 5000 bp at version 3, not 10000 bp or version 2."
        test_recipe:
          setup:
            - "An association at version 1 with one owner of record and no units."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 2500, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
          trigger:
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "102", interest_bp: 2500, heated_sqft: 1000 }
              captures: { unit2: "$.data.id" }
          assert:
            - "HTTP 201"
            - "GET /associations/${assoc} as CommunityManager returns data.total_interest_bp == 5000"
            - "GET /associations/${assoc} as CommunityManager returns data.version == 3"
            - "GET /owners with association_id=${assoc} returns the owner row with owned_unit_count == 2"
            - "GET /units with association_id=${assoc} returns total_count == 2"

      - name: unit_label_uniqueness_is_scoped_per_association
        claim_type: type_constraints
        grounds:
          - entities.Unit.fields.unit_label.constraints
          - validations[priority 36]
          - errors[ERR_UNIT_LABEL_DUPLICATE]
        distinguishing_aspect: "unit_label \"101\" is reusable in a SECOND association (201) while a repeat inside the same association is ERR_UNIT_LABEL_DUPLICATE — the uniqueness key is (association_id, unit_label), not unit_label alone."
        test_recipe:
          setup:
            - "Association A owns unit \"101\"; association B exists with its own owner of record and no units."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc_a: "$.data.id" }
            - call: "POST /associations/${assoc_a}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner_a: "$.data.id" }
            - call: "POST /associations/${assoc_a}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner_a}", unit_label: "101", interest_bp: 10000, heated_sqft: 1000 }
              captures: { unit_a: "$.data.id" }
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Bayview Terrace Condominium Association" }
              captures: { assoc_b: "$.data.id" }
            - call: "POST /associations/${assoc_b}/owners"
              as: CommunityManager
              payload: { full_name: "Beth Nolan", email: "beth@example.com" }
              captures: { owner_b: "$.data.id" }
          trigger:
            - call: "POST /associations/${assoc_b}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner_b}", unit_label: "101", interest_bp: 10000, heated_sqft: 900 }
              captures: { unit_b: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.unit_label == \"101\" and data.association_id == the id captured as ${assoc_b}"
            - "a repeat POST /associations/${assoc_a}/units with unit_label \"101\" returns HTTP 409 with data.error_id == \"ERR_UNIT_LABEL_DUPLICATE\""
            - "GET /units with association_id=${assoc_a} returns total_count == 1"

      - name: unit_create_interest_bp_over_ceiling_returns_err_validation
        claim_type: type_constraints
        grounds:
          - entities.Unit.fields.interest_bp.constraints
          - validations[priority 6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "interest_bp == 10001 is one basis point past the declared 1..10000 ceiling and is a 422 ERR_VALIDATION, not an ERR_INTEREST_SUM_INVALID — the per-field range check fires before any association-level sum check."
        test_recipe:
          setup:
            - "An association with one owner of record and no units."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
          trigger:
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 10001, heated_sqft: 1000 }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "response_type == \"error\" and data.error_id == \"ERR_VALIDATION\""
            - "GET /associations/${assoc} as CommunityManager returns data.total_interest_bp == 0"
            - "GET /units with association_id=${assoc} returns total_count == 0"

      - name: unit_create_omitting_interest_bp_returns_err_validation
        claim_type: required_fields
        grounds:
          - endpoints[POST /associations/{association_id}/units].input
          - validations[priority 6]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "interest_bp has source: input with no declared default, so omission is a 422 ERR_VALIDATION rather than an implicit 0 — an implicit 0 would silently satisfy nothing and later break the exactly-10000 invariant."
        test_recipe:
          setup:
            - "An association with one owner of record and no units."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
          trigger:
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", heated_sqft: 1000 }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 422"
            - "data.error_id == \"ERR_VALIDATION\""
            - "GET /units with association_id=${assoc} returns total_count == 0"

      - name: get_unit_with_unknown_id_returns_unit_not_found
        claim_type: not_found
        grounds:
          - endpoints[GET /units/{unit_id}]
          - validations[priority 4]
          - errors[ERR_UNIT_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unallocated UUID on the unit read path yields 404 ERR_UNIT_NOT_FOUND with the error envelope shape, not 200 with a null data payload."
        test_recipe:
          setup:
            - "An association exists so the database is non-empty, but no Unit row carries the probed id."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
          trigger:
            - call: "GET /units/11111111-1111-4111-8111-111111111111"
              as: CommunityManager
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "response_type == \"error\""
            - "data.error_id == \"ERR_UNIT_NOT_FOUND\""
            - "meta.api_request_id is present on the error envelope"

      - name: unit_create_under_unknown_association_returns_association_not_found
        claim_type: parent_relationships
        grounds:
          - entities.Unit.parent
          - validations[priority 4]
          - errors[ERR_ASSOCIATION_NOT_FOUND]
        distinguishing_aspect: "The parent path segment is resolved left-to-right BEFORE the body FK, so an unknown association_id with a valid-looking body yields ERR_ASSOCIATION_NOT_FOUND, never ERR_REFERENCED_ENTITY_NOT_FOUND for current_owner_id."
        test_recipe:
          setup:
            - "Association A exists with owner_a; the probed association id belongs to no row."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc_a: "$.data.id" }
            - call: "POST /associations/${assoc_a}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner_a: "$.data.id" }
          trigger:
            - call: "POST /associations/22222222-2222-4222-8222-222222222222/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner_a}", unit_label: "101", interest_bp: 5000, heated_sqft: 1000 }
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404"
            - "data.error_id == \"ERR_ASSOCIATION_NOT_FOUND\""
            - "GET /associations/${assoc_a} as CommunityManager returns data.total_interest_bp == 0 and data.version == 1"

      - name: units_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /units].input
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With four units and limit=2 offset=2 the window is the LAST page: total_count stays 4 (unwindowed) and has_more is false, while limit=2 offset=0 reports has_more true — an implementation that computes has_more from the returned row count alone reports the same value for both."
        test_recipe:
          setup:
            - "One association with four units of 2500 bp each, all owned by owner1."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association" }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 2500, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "102", interest_bp: 2500, heated_sqft: 1000 }
              captures: { unit2: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "103", interest_bp: 2500, heated_sqft: 1000 }
              captures: { unit3: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "104", interest_bp: 2500, heated_sqft: 1000 }
              captures: { unit4: "$.data.id" }
          trigger:
            - call: "GET /units"
              as: CommunityManager
              payload: { association_id: "${assoc}", limit: 2, offset: 2 }
          assert:
            - "HTTP 200"
            - "response_type == \"array\""
            - "total_count == 4"
            - "has_more == false"
            - "the data array holds exactly 2 rows"
            - "the same GET with limit=2 offset=0 returns total_count == 4 and has_more == true"
            - "the same GET with limit=101 returns HTTP 422 with data.error_id == \"ERR_VALIDATION\""

      - name: ledger_entry_is_immutable_and_reversal_creates_a_paired_row
        claim_type: immutability
        grounds:
          - entities.LedgerEntry.common_fields
          - endpoints[POST /ledger-entries/{ledger_entry_id}/reverse].side_effects
          - calculations.unit_ledger_conservation_invariant
        distinguishing_aspect: "LedgerEntry declares common_fields: false — §1.5 exposes no update endpoint for it, so the ONLY mutation is the server flipping status POSTED->REVERSED; amount_cents, entry_type and due_on of the original row are byte-identical after the reversal and the compensating row is a NEW id."
        test_recipe:
          setup:
            - "One association, owner1 owning unit 101, a seated TREASURER owner, and one POSTED COLLECTION_COST charge of 450000 cents on that unit."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association", board_quorum_seats: 1 }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Tina Cole", email: "tina@example.com", board_role: "TREASURER", is_seated: true }
              captures: { treas: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 10000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "POST /units/${unit1}/charges"
              as: CommunityManager
              payload: { entry_type: "COLLECTION_COST", amount_cents: 450000, due_on: "2026-08-10T00:00:00Z", effective_period: "2026-08", memo: "lien search fee" }
              captures: { entry1: "$.data.id" }
          trigger:
            - call: "POST /ledger-entries/${entry1}/reverse"
              as: BoardTreasurer
              as_user_id: "${treas}"
              payload: { memo: "billed in error" }
              captures: { rev1: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.entry_type == \"REVERSAL\" and data.amount_cents == -450000"
            - "data.reverses_entry_id == the id captured as ${entry1}"
            - "data.status == \"POSTED\" and data.id != the id captured as ${entry1}"
            - "GET /ledger-entries with unit_id=${unit1} returns total_count == 2"
            - "in that listing the original row still reads entry_type == \"COLLECTION_COST\", amount_cents == 450000, due_on == \"2026-08-10T00:00:00Z\" and now status == \"REVERSED\""
            - "GET /units/${unit1} returns data.balance_due_cents == 0 and data.delinquency_stage == \"CURRENT\""

      - name: vote_polymorphic_subject_and_derived_voter_kind_per_shape
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.Vote.fields.subject_id
          - entities.Vote.fields.voter_kind
          - entities.Vote.fields.weight_bp
          - endpoints[POST /votes].side_effects
        distinguishing_aspect: "One Vote table serves two shapes: an owner ballot (unit_id set) derives voter_kind UNIT_OWNER with weight_bp == Unit.interest_bp, while a board vote (meeting_id set) derives BOARD_DIRECTOR with weight_bp 0 — the polymorphic subject_id resolves against a Budget row for subject_type BUDGET without any FK column change."
        test_recipe:
          setup:
            - "An association with quorum 1, a seated director, owner1 owning unit 101 at 10000 bp, a DRAFT budget for fiscal 2026, and a scheduled board meeting."
          setup_api_calls:
            - call: "POST /associations"
              as: CommunityManager
              payload: { legal_name: "Harbor Point Condominium Association", board_quorum_seats: 1 }
              captures: { assoc: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Owen Pratt", email: "owen@example.com" }
              captures: { owner1: "$.data.id" }
            - call: "POST /associations/${assoc}/owners"
              as: CommunityManager
              payload: { full_name: "Dana Reed", email: "dana@example.com", board_role: "DIRECTOR", is_seated: true }
              captures: { dir1: "$.data.id" }
            - call: "POST /associations/${assoc}/units"
              as: CommunityManager
              payload: { current_owner_id: "${owner1}", unit_label: "101", interest_bp: 10000, heated_sqft: 1000 }
              captures: { unit1: "$.data.id" }
            - call: "POST /associations/${assoc}/board-meetings"
              as: CommunityManager
              payload: { scheduled_start: "2026-09-15T10:00:00Z", scheduled_end: "2026-09-15T12:00:00Z", agenda_kinds: ["BUDGET_RATIFICATION"] }
              captures: { meeting1: "$.data.id" }
            - call: "GET /associations/${assoc}"
              as: CommunityManager
              captures: { assoc_v: "$.data.version" }
            - call: "POST /associations/${assoc}/budgets"
              as: CommunityManager
              payload: { fiscal_year: 2026, operating_total_cents: 12000000, reserve_contribution_cents: 1200000, ratification_meeting_id: "${meeting1}", expected_association_version: "${assoc_v}" }
              captures: { budget1: "$.data.id" }
          trigger:
            - call: "POST /votes"
              as: UnitOwner
              as_user_id: "${owner1}"
              payload: { association_id: "${assoc}", subject_type: "BUDGET", subject_id: "${budget1}", choice: "NO", voter_owner_id: "${owner1}", unit_id: "${unit1}" }
              captures: { ballot1: "$.data.id" }
          assert:
            - "HTTP 201"
            - "data.voter_kind == \"UNIT_OWNER\""
            - "data.weight_bp == 10000"
