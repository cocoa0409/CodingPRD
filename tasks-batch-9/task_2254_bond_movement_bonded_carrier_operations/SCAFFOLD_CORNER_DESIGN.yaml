        claim_type: valid_transition
        grounds:
          - state_machines.InBondMovement.transit_status.FILED_to_IN_TRANSIT
          - entities.SealEvent.fields.event_type
        distinguishing_aspect: "Departure must move transit_status FILED -> IN_TRANSIT, set seal_number / seal_intact true, append an APPLIED SealEvent stamped with the ORIGIN port code 4601, and bump InBondMovement.version to 2 — custody stays BONDED and no ledger entry is written."
        test_recipe:
          setup:
            - "Ports 4601 (NE) / 3901 (MW); carrier ACTIVE; CONTINUOUS bond 50000.00; M1 FILED with obligation 41.75."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
