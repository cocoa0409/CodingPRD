          A syntactically well-formed code that is simply absent from CATEGORY_CODE_REGISTRY yields
          ERR_UNKNOWN_CATEGORY_CODE (422) — not the shape-level ERR_INVALID_REQUEST — and nothing is
          persisted: the facility's listing counters stay at zero.
        test_recipe:
          setup:
            - "one REGISTERED facility and one ResponsiblePerson"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Aster Labs Newark", owner_operator_name: "Aster Holdings LLC", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "NJ" }
              as: FacilityRegistrant
