    roles: [PlatformAdmin]
    code: 201
    input:
      - region_code
      - sd_floor_severity
      - sd_floor_enabled?
      - rollup_window_days?
      - rollup_threshold?
      - cluster_watchlist_threshold?
      - cluster_purge_threshold?
      - escalation_enabled?
      - expedite_appeal_baseline_count?
      - expedite_review_days?
      - standard_review_days?
      - appeal_window_days?
      - rescreen_refresh_days?
      - continuous_monitor_ack_deadline_days?
      - review_generation_index?
      - knob_generation_index?
    output: PlatformPolicy
    side_effects: ["defaults applied for every omitted threshold", "every existing Account in the region receives policy_generation_index from the new record"]

  - method: GET
    path: "/safety/platform-policies/{policyId}"
    description: "Get one regional policy record"
    roles: [PlatformAdmin, SafetyInvestigator, SafetyOperationsLead, SafetyAppealReviewer, RegulatorLiaison, BackgroundReviewer]
    code: 200
    input: []
    output: PlatformPolicy
    side_effects: []

  - method: GET
    path: "/safety/platform-policies"
    description: "List regional policy records, filtered by region_code"
    roles: [PlatformAdmin, SafetyInvestigator, SafetyOperationsLead, SafetyAppealReviewer, RegulatorLiaison, BackgroundReviewer]
    code: 200
    input:
      - region_code?
      - limit?
      - offset?
    output: PlatformPolicy[]
    side_effects: []

  - method: PATCH
    path: "/safety/platform-policies/{policyId}"
    description: "Revise regional policy values. Rejects a stale expected_policy_version, bumps PlatformPolicy.version by 1 on success, and advances the region's policy generations."
    roles: [PlatformAdmin]
    code: 200
    input:
      - expected_policy_version
      - sd_floor_severity?
      - sd_floor_enabled?
      - rollup_window_days?
      - rollup_threshold?
      - cluster_watchlist_threshold?
      - cluster_purge_threshold?
      - escalation_enabled?
      - expedite_appeal_baseline_count?
      - expedite_review_days?
      - standard_review_days?
      - appeal_window_days?
      - rescreen_refresh_days?
      - continuous_monitor_ack_deadline_days?
    output: PlatformPolicy
    side_effects: ["review_generation_index increments when any periodicity knob is patched", "knob_generation_index increments when sd_floor_enabled or escalation_enabled is patched", "every member Account's policy_generation_index is re-stamped", "every member BackgroundCheck is re-anchored against the new rescreen_refresh_days", "increments PlatformPolicy.version by 1"]

  - method: POST
    path: "/safety/config/advance"
    description: "Advance the region's policy generations by one step and re-anchor member accounts and background checks, keeping each account's initial continuous-monitor record in step"
    roles: [PlatformAdmin]
    code: 200
    input: [region_code, advance_counter]
    output: PlatformPolicy
    side_effects: ["the named counter (review_generation_index or knob_generation_index) increments by one", "every member Account's policy_generation_index is re-stamped", "every member BackgroundCheck is re-anchored against the new rescreen_refresh_days", "the account's open CONTINUOUS_MONITOR record has its monitor_generation bumped", "every DeviceCluster in the region has aggregate_cluster_risk recomputed and cluster_risk_generation_index stamped"]

# =============================================================================
# Table 6: Error Code Catalog (§1.6)
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header absent on any request"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the calling role is not permitted for the operation, including unknown role strings"
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "an account, incident, enforcement action, background check or policy referenced by a path segment does not exist"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "the incident referenced by POST /incidents/{incidentId}/hold, /hold/release, /withdraw, /evidence/accept, /decision, /appeals or /appeals/outcome does not exist"
  - id: ERR_TRIP_NOT_FOUND
    http: 404
    condition: "the trip referenced by POST /trips/{tripId}/complete-start, /complete or /cancel does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target entity is not in a state from which the requested transition is declared; suppresses every lower-priority check in the same request"
  - id: ERR_APPEAL_ALREADY_FILED
    http: 409
    condition: "a second appeal is filed while the incident sits at APPEAL_PENDING or already carries a committed appeal outcome"
  - id: ERR_HOLD_BLOCKED_BY_APPEAL
    http: 409
    condition: "an interim hold is attempted against an account that is currently APPEAL_PENDING"
  - id: ERR_SEVERITY_BELOW_HOLD_FLOOR
    http: 422
    condition: "an interim hold is attempted on an incident whose severity is S1 or S2"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 422
    condition: "the appeal arrival instant is at or after the enforcement action's appeal_deadline_at"
  - id: ERR_APPEAL_NOT_ELIGIBLE
    http: 422
    condition: "an appeal outcome is committed before the review deadline for the incident's appeal track and commit_early is false"
  - id: ERR_THROWN_ON_APPEAL
    http: 422
    condition: "the appeal reviewer X-User-ID equals the incident's decision_maker_user_id while the region's segregation-of-duties floor is armed at or below the incident severity"
  - id: ERR_REGULATOR_REPORT_BLOCKED
    http: 409
    condition: "the linked RegulatorReport still sits at BLOCKED inside an active regulator window block"
  - id: ERR_IN_FLIGHT_APPEAL
    http: 409
    condition: "a deactivation is attempted while the account carries an enforcement action in status ACTIVE, MANDATORY_REPORTED or APPEAL_PENDING"
  - id: ERR_CLUSTER_BANNED
    http: 422
    condition: "a new account-device link targets a DeviceCluster whose status is BANNED"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "the expected_*_version supplied for the write endpoint's parent entity does not match that entity's current version"
  - id: ERR_TRIP_ACCOUNT_MISMATCH
    http: 422
    condition: "evidence is attached from a trip that does not involve both the incident's subject account and the reported counterparty account"
  - id: ERR_CROSS_REGION_REFERENCE
    http: 422
    condition: "an incident, cluster or link references a prior incident or device cluster from a different operating region"
  - id: ERR_REPORTER_ACCOUNT_MISMATCH
    http: 422
    condition: "a THIRD_PARTY report carries reporter_account_id, or a RIDER or DRIVER report omits it"
  - id: ERR_ADVERSE_REASON_REQUIRED
    http: 422
    condition: "a background-check adjudication of ADVERSE arrives with no adverse_reason_code"
  - id: ERR_MONTHLY_REPORT_CAP_REACHED
    http: 422
    condition: "the region's monthly consumer safety-report appearance cap is already consumed by accounts whose deactivation_count is at or above 2"

