            - "Case.${c_id}.status == WITHDRAWN"
            - "Candidate.${cand}.status == NOT_SELECTED"

      - name: refund_deposit_before_case_closed_returns_invalid_state
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Deposit.PAID_to_REFUNDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          POST /deposits/{id}/refund while Case.status != CLOSED violates the refund precondition
          and returns 409 ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "A FILED case with a party pA and a PAID deposit (case never CLOSED)."
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_type: "ARBITRATION", title: "RefEarly", claim_amount_cents: 500000, panel_size: 1 }
              as: CaseAdministrator
              captures: { c_id: $.data.id }
