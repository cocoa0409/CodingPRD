  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: assessment_supersede_cascades_encounter_claim_report
        grounds:
          - state_machines.HouseholdAssessment.CURRENT_to_SUPERSEDED
          - state_machines.Encounter.transitions
          - calculations.claim_billed_amount
          - entities.GrantReport.fields.low_income_encounter_count
        distinguishing_aspect: |
          Depth-4 chain: new HouseholdAssessment (link 1) re-prices CLAIMED/UNBILLED
          encounters (link 2); the encounter's charge change recomputes the open
          Claim's billed_cents (link 3); the re-priced encounter refreshes the DRAFT
          GrantReport's low_income_encounter_count (link 4) — each link caused by the
          previous one, triggered by POST household-assessments.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01 -> 2026-09-10T10:00:00Z. Affiliate TX (quota 50), tiers A-D, catalog CONTRACEPTIVE_COUNSELING fee 20000, licensed provider."
            - "Adult insured patient P, DOCUMENTED household-4 income 1500000 (fpl 48, tier A, charge 500)."
            - "Encounter completed 2026-09-10; claim created and submitted with billed_cents 19500; encounter billing CLAIMED."
            - "DRAFT grant report over [2026-09-01, 2026-10-01) with encounter_count 1 and low_income_encounter_count 1."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - *cat_counsel
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "TC1", date_of_birth: "1990-01-01", insurance_policy_id: "POL-TC" }
              as: FrontDeskStaff
              captures: { tc1_id: $.data.id, tc1_v: $.data.version }
            - call: "POST /family-planning/patients/${tc1_id}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 1500000, income_basis: "DOCUMENTED", expected_patient_version: "${tc1_v}" }
              as: FrontDeskStaff
              captures: { asm_old: $.data.id }
            - call: "POST /family-planning/patients/${tc1_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { enct_id: $.data.id }
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/encounters/${enct_id}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${enct_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${enct_id}/claims"
              payload: {}
              as: BillingSpecialist
              captures: { claimt_id: $.data.id }
            - call: "POST /family-planning/claims/${claimt_id}/submit"
              payload: {}
              as: BillingSpecialist
            - call: "POST /family-planning/affiliates/${aff_id}/grant-reports"
              payload: { period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", valuation_variant: "FIFO", expected_affiliate_version: "${aff_v}" }
              as: GrantAdministrator
              captures: { rept_id: $.data.id }
            - call: "GET /family-planning/patients/${tc1_id}"
              payload: {}
              as: FrontDeskStaff
              captures: { tc1_v2: $.data.version }
          trigger:
            - call: "POST /family-planning/patients/${tc1_id}/household-assessments"
              payload: { household_size: 4, annual_income_cents: 4800000, income_basis: "DOCUMENTED", expected_patient_version: "${tc1_v2}" }
              as: FrontDeskStaff
              captures: { asm_new: $.data.id }
          assert:
            - "HouseholdAssessment.${asm_old}.status == SUPERSEDED and HouseholdAssessment.${asm_new}.status == CURRENT"
            - "HouseholdAssessment.${asm_new}.fpl_pct == 153 and assigned_tier_code == \"C\""
            - "Encounter.${enct_id}.assessment_id == ${asm_new} and patient_charge_cents == 10000 (link 2)"
            - "Claim.${claimt_id}.billed_cents == 10000 (link 3; was 19500)"
            - "GrantReport.${rept_id}.low_income_encounter_count == 0 (link 4; was 1) and encounter_count == 1 (unchanged)"

      - name: encounter_cancel_releases_reservation_into_lot
        grounds:
          - state_machines.Encounter.transitions
          - state_machines.DeviceReservation.RESERVED_to_RELEASED
          - entities.ContraceptiveStockLot.fields.reserved_out
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: POST encounter cancel (link 1)
          transitions the DeviceReservation RESERVED -> RELEASED (link 2), and the
          reservation's own transition — not the cancel directly — decrements
          ContraceptiveStockLot.reserved_out (link 3 hop expressed as the
          reservation transition's side effect).
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate TX, tiers A-D, catalog LARC_INSERTION fee 50000, licensed provider."
            - "Adult patient tier D; lot L (IUD_COPPER, cost 15000, on_hand 2, expires 2027-01-01)."
            - "Encounter scheduled 2026-09-15; one device reservation against L (reserved_out 1)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - call: "POST /family-planning/affiliates/${aff_id}/service-catalog"
              payload: { service_code: "LARC_INSERTION", in_scope: true, telehealth_eligible: false, full_fee_cents: 50000 }
              as: GrantAdministrator
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "TC2", date_of_birth: "1993-01-01" }
              as: FrontDeskStaff
              captures: { tc2_id: $.data.id, tc2_v: $.data.version }
            - call: "POST /family-planning/patients/${tc2_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${tc2_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${tc2_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-15T10:00:00Z", scheduled_end: "2026-09-15T10:30:00Z" }
              as: FrontDeskStaff
              captures: { encc_id: $.data.id }
            - call: "POST /family-planning/affiliates/${aff_id}/stock-lots"
              payload: { device_code: "IUD_COPPER", lot_number: "LOT-C1", unit_cost_cents: 15000, on_hand: 2, expires_on: "2027-01-01" }
              as: SupplyCoordinator
              captures: { lotc_id: $.data.id }
            - call: "POST /family-planning/encounters/${encc_id}/device-reservations"
              payload: { lot_id: "${lotc_id}" }
              as: SupplyCoordinator
              captures: { resc_id: $.data.id }
          trigger:
            - call: "POST /family-planning/encounters/${encc_id}/cancel"
              payload: {}
              as: FrontDeskStaff
          assert:
            - "Encounter.${encc_id}.clinical_status == CANCELLED (link 1)"
            - "DeviceReservation.${resc_id}.status == RELEASED (link 2, caused by the cancel cascade)"
            - "ContraceptiveStockLot.${lotc_id}.reserved_out == 0 and on_hand == 2 (link 3, caused by the RELEASED transition)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: privacy_hold_blocks_access_beats_state_error
        grounds:
          - validations[priority=4.5]
          - validations[priority=5]
          - errors.ERR_PRIVACY_HOLD_BLOCKS_ACCESS
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Error-category pair business_safety (priority 6) vs state (priority 5):
          cancel on an already-COMPLETED encounter of a patient under an ACTIVE
          ALL-scope hold must return ERR_PRIVACY_HOLD_BLOCKS_ACCESS (403), NOT
          ERR_INVALID_STATE (409) — the safety gate outranks the state gate so the
          held record leaks nothing.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01 -> 2026-09-10T10:00:00Z. Affiliate TX, tiers A-D, catalog CONTRACEPTIVE_COUNSELING, licensed provider."
            - "Adult patient tier D; encounter completed 2026-09-10 (clinical COMPLETED)."
            - "ACTIVE PrivacyHold on the patient scope ALL [2026-09-01, 2026-12-01), authorized_staff_ids [\"staff-allowed\"]."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - *cat_counsel
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "PC1", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { pc1_id: $.data.id, pc1_v: $.data.version }
            - call: "POST /family-planning/patients/${pc1_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${pc1_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${pc1_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { encpc_id: $.data.id }
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/encounters/${encpc_id}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${encpc_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/patients/${pc1_id}/privacy-holds"
              payload: { hold_start: "2026-09-01T00:00:00Z", hold_end: "2026-12-01T00:00:00Z", scope: "ALL", authorized_staff_ids: ["staff-allowed"] }
              as: PrivacyOfficer
          trigger:
            - call: "POST /family-planning/encounters/${encpc_id}/cancel"
              payload: {}
              as: FrontDeskStaff
              as_user_id: "staff-blocked"
              captures: { err_id: $.data.error_id }
          assert:
            - "status 403 and error_id == ERR_PRIVACY_HOLD_BLOCKS_ACCESS"
            - "error_id != ERR_INVALID_STATE — the priority-6 safety gate wins over the priority-5 state gate"
            - "Encounter.${encpc_id}.clinical_status still == COMPLETED (no side effects fired)"

      - name: out_of_scope_service_beats_telehealth_license_gap
        grounds:
          - validations[priority=7]
          - validations[priority=8]
          - errors.ERR_SERVICE_OUT_OF_SCOPE
          - errors.ERR_TELEHEALTH_LICENSE_GAP
        distinguishing_aspect: |
          Error-category pair business_referential (priority 8) vs business_safety
          (priority 9): a TELEHEALTH encounter whose service is out-of-scope AND
          whose provider lacks a license for the patient's state must return
          ERR_SERVICE_OUT_OF_SCOPE — referential integrity is checked before the
          licensure safety gate.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate TX, tiers A-D, catalog entry SURGICAL_REFERRAL in_scope false telehealth_eligible false fee 100000, provider licensed ONLY in TX."
            - "Adult patient tier D with a CURRENT assessment; patient physically in NM."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - call: "POST /family-planning/affiliates/${aff_id}/service-catalog"
              payload: { service_code: "SURGICAL_REFERRAL", in_scope: false, telehealth_eligible: false, full_fee_cents: 100000 }
              as: GrantAdministrator
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "PC2", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { pc2_id: $.data.id, pc2_v: $.data.version }
            - call: "POST /family-planning/patients/${pc2_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${pc2_v}" }
              as: FrontDeskStaff
          trigger:
            - call: "POST /family-planning/patients/${pc2_id}/encounters"
              payload: { service_code: "SURGICAL_REFERRAL", provider_id: "${prov_id}", channel: "TELEHEALTH", patient_location_state: "NM", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { err_id: $.data.error_id }
          assert:
            - "status 422 and error_id == ERR_SERVICE_OUT_OF_SCOPE"
            - "error_id != ERR_TELEHEALTH_LICENSE_GAP — priority 8 fires before priority 9"
            - "GET /family-planning/patients/${pc2_id}/encounters returns 0 rows"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: fpl_exactly_100_excluded_from_lowest_band
        grounds:
          - calculations.fpl_percentage
          - entities.FeeScheduleTier.fields.fpl_pct_max_exclusive
          - entities.HouseholdAssessment.fields.assigned_tier_code
        distinguishing_aspect: |
          Metric 1 (FPL percentage): income exactly equal to the household-1 FPL
          base yields fpl_pct == 100 (not 99), and because tier A's band is
          half-open [0, 100), 100 falls OUT of tier A into tier B — one cent less
          (fpl 99) lands in tier A. Endpoint: POST household-assessments.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate TX with tiers A-D."
            - "Two adult patients: PB at income 1506000 (exactly the size-1 FPL base); PA at income 1505999 (one cent below)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "PB", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { pb_id: $.data.id, pb_v: $.data.version }
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "PA", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { pa_id: $.data.id, pa_v: $.data.version }
          trigger:
            - call: "POST /family-planning/patients/${pb_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 1506000, income_basis: "DOCUMENTED", expected_patient_version: "${pb_v}" }
              as: FrontDeskStaff
              captures: { asm_b: $.data.id }
            - call: "POST /family-planning/patients/${pa_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 1505999, income_basis: "DOCUMENTED", expected_patient_version: "${pa_v}" }
              as: FrontDeskStaff
              captures: { asm_a: $.data.id }
          assert:
            - "HouseholdAssessment.${asm_b}.fpl_pct == 100 and assigned_tier_code == \"B\" (100 is NOT < 100 — half-open band)"
            - "HouseholdAssessment.${asm_a}.fpl_pct == 99 and assigned_tier_code == \"A\""
            - "a one-cent income difference flips the assigned tier"

      - name: stock_zero_available_boundary
        grounds:
          - validations[priority=11]
          - entities.ContraceptiveStockLot.fields.on_hand
          - entities.ContraceptiveStockLot.fields.reserved_out
          - errors.ERR_STOCK_UNAVAILABLE
        distinguishing_aspect: |
          Metric 2 (zero-count edge on a different endpoint): a lot with on_hand 1
          accepts exactly one reservation (available 1 >= 1) and rejects the second
          (available 0 < 1) — the boundary is at zero available units, exercised via
          POST device-reservations, not via the FPL formula.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate TX, tiers A-D, catalog LARC_INSERTION fee 50000, licensed provider."
            - "Two adult tier-D patients each with a SCHEDULED LARC_INSERTION encounter 2026-09-15."
            - "Lot Z: IUD_COPPER, on_hand 1, expires 2027-01-01."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - call: "POST /family-planning/affiliates/${aff_id}/service-catalog"
              payload: { service_code: "LARC_INSERTION", in_scope: true, telehealth_eligible: false, full_fee_cents: 50000 }
              as: GrantAdministrator
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "Z1", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { z1_id: $.data.id, z1_v: $.data.version }
            - call: "POST /family-planning/patients/${z1_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${z1_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${z1_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-15T10:00:00Z", scheduled_end: "2026-09-15T10:30:00Z" }
              as: FrontDeskStaff
              captures: { encz1_id: $.data.id }
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "Z2", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { z2_id: $.data.id, z2_v: $.data.version }
            - call: "POST /family-planning/patients/${z2_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${z2_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${z2_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-15T11:00:00Z", scheduled_end: "2026-09-15T11:30:00Z" }
              as: FrontDeskStaff
              captures: { encz2_id: $.data.id }
            - call: "POST /family-planning/affiliates/${aff_id}/stock-lots"
              payload: { device_code: "IUD_COPPER", lot_number: "LOT-Z", unit_cost_cents: 15000, on_hand: 1, expires_on: "2027-01-01" }
              as: SupplyCoordinator
              captures: { lotz_id: $.data.id }
          trigger:
            - call: "POST /family-planning/encounters/${encz1_id}/device-reservations"
              payload: { lot_id: "${lotz_id}" }
              as: SupplyCoordinator
              captures: { resz1_id: $.data.id }
            - call: "POST /family-planning/encounters/${encz2_id}/device-reservations"
              payload: { lot_id: "${lotz_id}" }
              as: SupplyCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "first reservation succeeds: DeviceReservation.${resz1_id}.status == RESERVED"
            - "ContraceptiveStockLot.${lotz_id}.on_hand == 1 and reserved_out == 1 (available == 0)"
            - "second reservation: status 422 and error_id == ERR_STOCK_UNAVAILABLE (0 < 1 boundary)"
            - "ContraceptiveStockLot.${lotz_id}.reserved_out still == 1 after the rejection"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: telehealth_encounter_gated_by_license_derived_state
        grounds:
          - calculations.telehealth_licensure_window
          - validations[priority=8]
          - entities.ProviderLicense.fields.status
          - errors.ERR_TELEHEALTH_LICENSE_GAP
        distinguishing_aspect: |
          Entity pair Encounter -> ProviderLicense: the encounter's creatability
          depends on the license's DERIVED state (ACTIVE vs EXPIRED via logical
          clock). A license whose valid_until passed is EXPIRED at encounter-creation
          time even though it was ACTIVE when written.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01 at setup; license valid [2026-01-01, 2026-06-01)."
            - "Affiliate TX, tiers A-D, catalog CONTRACEPTIVE_COUNSELING telehealth_eligible, provider with the expiring TX license."
            - "Adult tier-D patient with CURRENT assessment; clock advanced to 2026-09-10 (license now EXPIRED)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - *cat_counsel
            - call: "POST /family-planning/affiliates/${aff_id}/providers"
              payload: { display_name: "Dr. Expiring", provider_type: "NP" }
              as: GrantAdministrator
              captures: { provx_id: $.data.id }
            - call: "POST /family-planning/providers/${provx_id}/licenses"
              payload: { state_code: "TX", valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-06-01T00:00:00Z" }
              as: GrantAdministrator
              captures: { licx_id: $.data.id }
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
