          - state_machines.PerfusionDevice.NEEDS_SERVICE_to_AVAILABLE
          - entities.PerfusionDevice.fields.open_reservation_count
          - endpoints[POST /perfusion-devices/{id}/service-completions]
        distinguishing_aspect: |
          The NEEDS_SERVICE -> AVAILABLE transition carries a two-part precondition and each part is
          violated separately here: first on a device that is merely RESERVED (wrong status), then on
          a device that really is NEEDS_SERVICE but is still held as the backup of an ON_BYPASS case
          (open_reservation_count == 1). The second half is only reachable because the critical-alarm
          cascade's link 2b deliberately leaves an ON_BYPASS case's backup pointer alone, so the
