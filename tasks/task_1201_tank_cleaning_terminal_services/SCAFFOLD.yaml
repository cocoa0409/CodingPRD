    input: [terminal_id, job_id, volume_liters]
    output: WastewaterBatch
    side_effects: ["status=COLLECTED"]
  - method: GET
    path: "/ops/wastewater-batches/{batchId}"
    description: "Get a wastewater batch"
    roles: *all_roles
    code: 200
    input: []
    output: WastewaterBatch
    side_effects: []
  - method: GET
    path: "/ops/wastewater-batches"
    description: "List wastewater batches, filterable (paginated)"
    roles: *all_roles
    code: 200
    input: ["terminal_id?", "job_id?", "status?", "discharge_day?", "limit?", "offset?"]
    output: WastewaterBatch[]
    side_effects: []
  - method: POST
    path: "/ops/wastewater-batches/{batchId}/submit-lab"
    description: "Submit lab results (pH, TPH)"
    roles: [LabTechnician]
    code: 200
    input: [ph, tph_mg_l]
    output: WastewaterBatch
    side_effects: ["status COLLECTED -> LAB_TESTED; lab_user_id recorded"]
  - method: POST
    path: "/ops/wastewater-batches/{batchId}/authorize"
    description: "Authorize discharge (limits, daily capacity, SoD vs lab tech)"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: WastewaterBatch
    side_effects: ["status LAB_TESTED -> AUTHORIZED; discharge_day = current UTC date; consumes daily capacity"]
  - method: POST
    path: "/ops/wastewater-batches/{batchId}/discharge"
    description: "Discharge an authorized batch"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: WastewaterBatch
    side_effects: ["status AUTHORIZED -> DISCHARGED"]
  - method: POST
    path: "/ops/wastewater-batches/{batchId}/reject"
    description: "Reject a lab-tested batch"
    roles: [EHSOfficer]
    code: 200
    input: []
    output: WastewaterBatch
    side_effects: ["status LAB_TESTED -> REJECTED"]
  - method: POST
    path: "/ops/wastewater-batches/{batchId}/void-authorization"
    description: "Void an authorization (releases daily allocation; compensating action)"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: WastewaterBatch
    side_effects: ["status AUTHORIZED -> COLLECTED; discharge_day cleared"]
  - method: POST
    path: "/ops/wastewater-batches/{batchId}/return-to-storage"
    description: "Return a rejected batch to storage"
    roles: [TerminalOperator]
    code: 200
    input: []
    output: WastewaterBatch
    side_effects: ["status REJECTED -> COLLECTED"]

  # --- Test-driving clock ---
  - method: POST
    path: "/ops/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is exactly 2026-05-01T00:00:00Z before any call; advancing the clock sweeps cert expiry and window OVERRUN transitions."
    roles: [TerminalAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["cert expiry sweep", "window OVERRUN sweep"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for endpoint, or entity-backed role does not own the resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/invalid required field, bad enum value, start >= end, negative quantity, terminal/tank mismatch" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_GAS_FREE_LIMITS_EXCEEDED, http: 422, condition: "LEL/O2/H2S/benzene reading outside its limit at certificate issuance" }
  - { id: ERR_NO_VALID_GAS_FREE_CERT, http: 409, condition: "No VALID certificate anchors the operation (none exists, or referenced cert not VALID)" }
  - { id: ERR_CERT_EXPIRED, http: 409, condition: "Referenced cert is VALID but clock.now >= expires_at at point of use" }
  - { id: ERR_CERT_ALREADY_REVALIDATED, http: 409, condition: "Second revalidation attempt on the same certificate" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Same X-User-ID on both sides of a segregated step (permit issue vs cert issue; inspection accept vs report; repair verify vs complete; discharge authorize vs lab)" }
  - { id: ERR_CONTRACTOR_NOT_QUALIFIED, http: 409, condition: "Contractor not QUALIFIED or safety_score below the terminal threshold" }
  - { id: ERR_INCOMPATIBLE_CHANGEOVER, http: 422, condition: "Product changeover class is FORBIDDEN" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New service window intersects an existing PLANNED/ACTIVE window on the tank" }
  - { id: ERR_WINDOW_BUFFER_VIOLATION, http: 409, condition: "New window violates the 24h buffer around an existing window (including touching adjacency)" }
  - { id: ERR_WINDOW_NOT_ACTIVE, http: 409, condition: "Window activation attempted outside [planned_start, planned_end)" }
  - { id: ERR_WINDOW_UNAVAILABLE, http: 409, condition: "Window not PLANNED, wrong tank, or already linked to another job" }
  - { id: ERR_WINDOW_LINKED, http: 409, condition: "Window cancel blocked because a non-cancelled job is linked" }
  - { id: ERR_TANK_NOT_IN_SERVICE, http: 409, condition: "Tank not IN_SERVICE for job creation or take-out-of-service" }
  - { id: ERR_WASTE_PROFILE_NOT_APPROVED, http: 409, condition: "No APPROVED waste profile for the job" }
  - { id: ERR_PROFILE_ALREADY_APPROVED, http: 409, condition: "Another profile for the same job is already APPROVED" }
  - { id: ERR_SHIPMENT_PROFILE_MISMATCH, http: 409, condition: "Shipment's profile belongs to a different job" }
  - { id: ERR_NO_DELIVERED_SHIPMENT, http: 409, condition: "No DELIVERED/RECONCILED shipment exists when sludge removal is recorded" }
  - { id: ERR_NO_VALID_ENTRY_PERMIT, http: 409, condition: "No ACTIVE permit with CLEAR atmosphere for begin-entry/resume" }
  - { id: ERR_ATMOSPHERE_NOT_CLEAR, http: 409, condition: "Permit atmosphere dimension not CLEAR at activate/resume" }
  - { id: ERR_PERMITS_NOT_CLOSED, http: 409, condition: "complete-entry with permits still in {REQUESTED, ISSUED, ACTIVE, SUSPENDED}" }
  - { id: ERR_JOB_HAS_ACTIVE_PERMIT, http: 409, condition: "Job cancel blocked by an ACTIVE permit" }
  - { id: ERR_INSPECTOR_UNAVAILABLE, http: 409, condition: "Inspection interval intersects an existing SCHEDULED/IN_PROGRESS inspection on the inspector" }
  - { id: ERR_CRITICAL_FINDINGS_OPEN, http: 409, condition: "OPEN CRITICAL finding blocks inspection accept, begin-flush, or return-to-service" }
  - { id: ERR_FINDING_NOT_RISK_ACCEPTABLE, http: 409, condition: "accept-risk attempted on a CRITICAL finding" }
  - { id: ERR_NO_REWORKABLE_FINDINGS, http: 409, condition: "order-rework without any OPEN/REPAIR_ORDERED finding on the accepted inspection" }
  - { id: ERR_FLUSH_VOLUME_INSUFFICIENT, http: 409, condition: "actual_flush_liters below computed flush_volume_liters" }
  - { id: ERR_MASS_BALANCE_OUT_OF_TOLERANCE, http: 409, condition: "|shipped+residual - expected| exceeds the terminal tolerance" }
  - { id: ERR_DISCHARGE_LIMITS_EXCEEDED, http: 422, condition: "Batch pH outside [6.0, 9.0] or TPH > 15.0 at authorize" }
  - { id: ERR_DISCHARGE_CAPACITY_EXCEEDED, http: 409, condition: "Authorize would push the UTC day's allocated liters over terminal capacity" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TerminalAdmin
    description: "Terminal platform administrator; owns configuration and contractor governance"
    identity: opaque
    exclusive_operations:
      - "POST /ops/terminals"
      - "POST /ops/products"
      - "POST /ops/tanks"
      - "POST /ops/contractors and contractor lifecycle (qualify, suspend, reinstate, bar)"
      - "POST /ops/inspectors"
      - "POST /ops/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: TerminalOperator
    description: "Terminal operations staff; drives scheduling, inspection acceptance, RTS, discharge authorization"
    identity: opaque
    exclusive_operations:
      - "POST /ops/cleaning-jobs and job operator actions (schedule, take-out-of-service, order-rework, request-rts, return-to-service, resume, cancel, PATCH)"
      - "POST /ops/service-windows and window lifecycle (activate, complete, cancel)"
      - "POST /ops/inspections (booking), accept, reject, cancel"
      - "POST /ops/repair-orders"
      - "POST /ops/inspection-findings/{id}/accept-risk"
      - "POST /ops/waste-shipments/{id}/void"
      - "POST /ops/wastewater-batches/{id}/authorize, /discharge, /void-authorization, /return-to-storage"
    shared_operations:
      - "POST /ops/wastewater-batches (shared with ContractorSupervisor)"
      - "All GET endpoints"
  - name: ContractorSupervisor
    description: "Cleaning contractor supervisor; X-User-ID equals the Contractor id (entity-backed)"
    identity: "entity_backed:Contractor"
    exclusive_operations:
      - "Job execution actions (record-heel-removal, record-sludge-removal, request-gas-free, begin-entry, complete-entry, begin-flush)"
      - "POST /ops/waste-profiles and /submit"
      - "POST /ops/waste-shipments, /dispatch, /deliver"
      - "POST /ops/entry-permits, /activate, /close"
      - "POST /ops/repair-orders/{id}/start, /complete"
    shared_operations:
      - "POST /ops/entry-permits/{id}/raise-alarm (shared with EHSOfficer)"
      - "POST /ops/wastewater-batches (shared with TerminalOperator)"
      - "All GET endpoints"
  - name: MarineChemist
    description: "Certified marine chemist; issues and manages gas-free certificates"
    identity: opaque
    exclusive_operations:
      - "POST /ops/gas-free-certificates"
      - "POST /ops/gas-free-certificates/{id}/revalidate"
      - "POST /ops/gas-free-certificates/{id}/revoke"
    shared_operations:
      - "All GET endpoints"
  - name: EHSOfficer
    description: "Environmental, health & safety officer; approves waste profiles, issues entry permits, verifies flushes and shipments"
    identity: opaque
    exclusive_operations:
      - "POST /ops/safety-events"
      - "POST /ops/waste-profiles/{id}/approve, /reject, /reclassify"
      - "POST /ops/entry-permits/{id}/issue, /suspend, /resume, /void, /resolve-alarm, /clear-atmosphere"
      - "POST /ops/cleaning-jobs/{id}/verify-flush"
      - "POST /ops/waste-shipments/{id}/reconcile"
      - "POST /ops/wastewater-batches/{id}/reject"
    shared_operations:
      - "POST /ops/entry-permits/{id}/raise-alarm (shared with ContractorSupervisor)"
      - "All GET endpoints"
  - name: API653Inspector
    description: "Certified API 653 inspector; X-User-ID equals the Inspector id (entity-backed)"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /ops/inspections/{id}/start, /report, /amend"
      - "POST /ops/inspection-findings"
      - "POST /ops/repair-orders/{id}/verify, /reject"
    shared_operations:
      - "All GET endpoints"
  - name: LabTechnician
    description: "Laboratory technician; enters wastewater lab results"
    identity: opaque
    exclusive_operations:
      - "POST /ops/wastewater-batches/{id}/submit-lab"
    shared_operations:
      - "All GET endpoints"
