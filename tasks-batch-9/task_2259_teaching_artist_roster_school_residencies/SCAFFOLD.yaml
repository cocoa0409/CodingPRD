    input: [substitute_artist_id, expected_session_version]
    output: Session
    side_effects: ["assigned_artist_id := substitute_artist_id, is_substitute := true, status → CONFIRMED", "encumbrance re-computed at SUBSTITUTE_RATE_PCT", "Residency.vacated_session_count / staffing_status and SchoolPartner.partnership_health recomputed", "increments Session.version by 1 and Residency.version by 1"]

  - method: POST
