              payload: { unit_id: "${unit_id}", agreement_code: "AGR-0120", product_type: "CONCRETE_POZZOLAN", offtaker_name: "Piedmont Ready-Mix", committed_tons: 30000, commitment_start_on: "2026-01-01", commitment_end_on: "2026-12-31", loi_percent: 6.00, retained_325_percent: 20.00, oxide_sum_percent: 82.00, market_price_usd_cents_per_ton: 3200, haul_distance_miles: 60 }
              as: UtilityAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /ccr/reuse-agreements/${agr_id}/qualify"
              payload: { qualified_on: "2026-08-01" }
              as: ProfessionalEngineer
              as_user_id: "${pe_civil_id}"
            - call: "POST /ccr/reuse-agreements/${agr_id}/activate"
              payload: { activated_on: "2026-08-01" }
              as: UtilityAdmin
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v1: $.data.version }
          trigger:
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SHP-0120-A", tons: 20000, shipped_on: "2026-07-01", expected_unit_version: "${unit_v1}" }
              as: UtilityAdmin
              captures: { ship_a_id: $.data.id }
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v2: $.data.version }
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SHP-0120-B", tons: 10000, shipped_on: "2026-07-02", expected_unit_version: "${unit_v2}" }
              as: UtilityAdmin
              captures: { ship_b_id: $.data.id }
            - call: "GET /ccr/units/${unit_id}"
              as: UtilityAdmin
              captures: { unit_v3: $.data.version }
            - call: "POST /ccr/reuse-shipments"
              payload: { agreement_id: "${agr_id}", shipment_code: "SHP-0120-C", tons: 1, shipped_on: "2026-07-03", expected_unit_version: "${unit_v3}" }
              as: UtilityAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "after trigger call 1 BeneficialReuseAgreement.${agr_id}.status == ACTIVE and shipped_tons_total == 20000"
            - "after trigger call 1 DisposalUnit.${unit_id}.ash_in_place_tons == 460000"
            - "trigger call 3 returns HTTP 201 and BeneficialReuseAgreement.${agr_id}.status == COMPLETED with shipped_tons_total == 30000"
            - "after trigger call 3 DisposalUnit.${unit_id}.ash_in_place_tons == 450000 and ash_mass_balance_ok == true"
            - "trigger call 5 returns HTTP 409 with error_id ERR_INVALID_AGREEMENT_STATE (a COMPLETED agreement cannot ship)"
            - "ReuseShipment.${ship_a_id}.status == SHIPPED and ReuseShipment.${ship_b_id}.status == SHIPPED"

      - name: program_phase_cycle_back_to_detection
        claim_type: cyclic
        grounds:
          - state_machines.MonitoringProgram.ASSESSMENT_to_DETECTION
        excluded_because:
          difficulty_instance: program_phase_cycles_detection_assessment_detection
          rationale: "The named §1.8 instance drives DETECTION -> ASSESSMENT -> DETECTION and asserts the second entry differs from the first, which is exactly the cyclic-shape claim."

      - name: ssi_cascade_reaches_the_reuse_agreement
        claim_type: cascade_down
        grounds:
          - state_machines.BeneficialReuseAgreement.ACTIVE_to_SUSPENDED
        excluded_because:
          difficulty_instance: ssi_cascade_depth_four_suspends_active_reuse_agreement
          rationale: "The named §1.8 instance verifies the four-hop cascade end-to-end, including the conditional hop that only touches ACTIVE agreements."

      - name: cap_deficiency_adjusts_the_unit_and_the_program
        claim_type: cross_entity
        grounds:
          - state_machines.DisposalUnit.ADEQUATE_to_DEFICIENT
        excluded_because:
          difficulty_instance: cap_deficiency_cascade_extends_care_and_escalates_sampling
          rationale: "The named §1.8 instance asserts the inspection's effect on the unit's care end date and on the program's sampling frequency."

      - name: shipment_return_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.ReuseShipment.SHIPPED_to_RETURNED
        excluded_because:
          difficulty_instance: shipment_return_restores_the_ash_inventory_and_the_agreement_ledger_exactly
          rationale: "The named §1.8 instance asserts both ledgers return to their exact pre-shipment values with no drift."

      - name: repeating_a_terminal_trigger_is_refused
        claim_type: idempotency
        grounds:
          - validations.priority_25_ERR_INVALID_EXTENSION_STATE
        excluded_because:
          difficulty_instance: extension_rescission_restores_the_closure_deadline_from_cessation_date_not_by_subtraction
          rationale: "Its fifth trigger call repeats the rescission and asserts 409 ERR_INVALID_EXTENSION_STATE with no further change to the deadline."

  - section: calculations
    instances:
      - name: location_restriction_chain_stops_at_the_first_matching_clause
        claim_type: correct_result
        grounds:
          - calculations.location_restriction_verdict
          - entities.DisposalUnit.fields.location_restriction_verdict
          - entities.DisposalUnit.fields.demonstration_required
          - calculations.compliance_posture
        distinguishing_aspect: |
          The verdict is an ordered first-match chain, so a unit that violates the unstable-area clause AND
          the fault setback AND the aquifer separation AND the wetland setback must report DISQUALIFIED
          with demonstration_required false — an implementation that evaluates the clauses in a different
          order, or that ORs them into a single "restricted" answer, reports
          RESTRICTED_DEMONSTRATION_REQUIRED instead. Two of the five clauses are conjunctive, so the
          fourth unit (seismic PGA above the maximum but COMPOSITE_LINED) must come back UNRESTRICTED.
        test_recipe:
          setup:
            - "Empty database; the logical clock is at its default 2026-08-01"
          setup_api_calls: []
          trigger:
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0121", unit_name: "Ash Pond 121", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 2000.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { clean_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0122", unit_name: "Ash Pond 122", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "UNLINED", hazard_potential_class: "HIGH", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 2.00, wetland_distance_ft: 100.00, seismic_pga_g: 0.200, fault_distance_ft: 100.00, unstable_area_flag: true }
              as: UtilityAdmin
              captures: { all_bad_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0123", unit_name: "Ash Pond 123", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 12.50, wetland_distance_ft: 400.00, seismic_pga_g: 0.050, fault_distance_ft: 1200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { wetland_id: $.data.id }
            - call: "POST /ccr/units"
              payload: { unit_code: "IMP-0124", unit_name: "Ash Pond 124", unit_type: "SURFACE_IMPOUNDMENT", plant_code: "PLNT01", liner_class: "COMPOSITE_LINED", hazard_potential_class: "SIGNIFICANT", original_ash_in_place_tons: 480000, cessation_date: "2026-03-31", uppermost_aquifer_separation_ft: 5.00, wetland_distance_ft: 500.00, seismic_pga_g: 0.150, fault_distance_ft: 200.00, unstable_area_flag: false }
              as: UtilityAdmin
              captures: { seismic_lined_id: $.data.id }
          assert:
            - "DisposalUnit.${clean_id}.location_restriction_verdict == UNRESTRICTED and demonstration_required == false and compliance_posture == COMPLIANT"
            - "DisposalUnit.${all_bad_id}.location_restriction_verdict == DISQUALIFIED (the unstable-area clause wins the chain)"
            - "DisposalUnit.${all_bad_id}.demonstration_required == false because DISQUALIFIED is not the RESTRICTED verdict"
            - "DisposalUnit.${all_bad_id}.compliance_posture == RESTRICTED (a DISQUALIFIED verdict restricts the unit)"
            - "DisposalUnit.${wetland_id}.location_restriction_verdict == RESTRICTED_DEMONSTRATION_REQUIRED with demonstration_required == true and compliance_posture == WATCH"
            - "DisposalUnit.${seismic_lined_id}.location_restriction_verdict == UNRESTRICTED: the seismic clause also requires liner_class == UNLINED, and the three boundary values 5.00 ft, 500.00 ft and 200.00 ft all sit exactly on their strict comparisons"
