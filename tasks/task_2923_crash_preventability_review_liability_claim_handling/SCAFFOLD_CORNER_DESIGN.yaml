              captures: { subro_page: $.data }
          assert:
            - "The crash is created with HTTP 201 and ${occ} == 2026-08-01T00:00:00Z — priority 43 refuses occurred_at STRICTLY after current_utc, so an occurred_at exactly equal to the clock is legal; ${pv} == REPORTED"
            - "The ReviewCase is created with HTTP 201, ${rc_status} == DRAFT and ${waiver} is echoed back — priority 51 is satisfied by the waiver even though GET /crashes/${c_id}/driver-statements returns 0 rows"
            - "${pct_lo} == 1 and ${pct_hi} == 100 with ${sd_lo_status} == DRAFT — both ends of the 1-100 range are accepted, while 0 and 101 would be ERR_INVALID_REQUEST"
            - "${page_all} has 1 row and meta.pagination == {limit: 100, offset: 0, total_count: 1, has_more: false} — limit at its maximum and offset at its minimum are both legal"
            - "${page_one} has 1 row with meta.pagination.limit == 1, the minimum legal limit"
            - "${subro_page} has exactly 2 rows with meta.pagination.total_count == 2 and has_more false"

      - name: error_ladder_reports_the_lowest_priority_rule_that_is_violated
