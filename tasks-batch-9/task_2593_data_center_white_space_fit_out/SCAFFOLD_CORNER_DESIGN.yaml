        distinguishing_aspect: "PATCH /racks/{rack_id} is the as-built tagging surface and works at any rack status: it overwrites asset_tag on a PLANNED rack, bumps version, and the value is visible on the following GET while status and chargeable_kw are untouched."
        test_recipe:
          setup:
            - "Hall CX61 is in PLANNING with containment zone CA-1 and rack R-1-1 (design_kw 12.00) created with asset_tag AT-OLD."
          setup_api_calls:
            - call: "POST /halls"
              payload: { name: "Corner Hall 61", code: "CX61", tenant_mode: "SINGLE_TENANT", design_kw_capacity: 400.00, gross_area_sqm: 600.0, cooling_redundancy: "N", planned_rack_count: 8 }
              as: FacilityPlanner
              captures: { hall_id: $.data.id }
            - call: "POST /containment-zones"
              payload: { hall_id: "${hall_id}", label: "CA-1", zone_type: "COLD_AISLE", containment_kind: "RIGID_ROOF", target_leakage_pct: 5.00, design_static_pressure_pa: 20.0 }
              as: MechanicalContractor
              captures: { zone1_id: $.data.id }
            - call: "POST /racks"
              payload: { hall_id: "${hall_id}", containment_zone_id: "${zone1_id}", grid_row: "1", grid_col: 1, design_kw: 12.00, u_height: 45, required_feed_count: 2, asset_tag: "AT-OLD" }
              as: FacilityPlanner
              captures: { rack1_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "PATCH /racks/${rack1_id}"
              payload: { asset_tag: "AT-NEW-61" }
              as: FacilityPlanner
              captures: { tag: $.data.asset_tag, v1: $.data.version }
            - call: "GET /racks/${rack1_id}"
              payload: {}
              as: FacilityPlanner
              captures: { tag_read: $.data.asset_tag, status_read: $.data.status }
          assert:
            - "PATCH returns 200 with ${tag} == AT-NEW-61 and ${v1} == ${v0} + 1"
            - "${tag_read} == AT-NEW-61 and ${status_read} == PLANNED"
            - "Rack.${rack1_id}.chargeable_kw == 12.54 (round(12.00 * 1.045, 2)) and Hall.${hall_id}.chargeable_kw == 0.00"

