      - name: second_decision_on_a_decided_appeal_returns_409
        claim_type: violation_to_error
        grounds:
          - errors[ERR_APPEAL_INVALID_STATE]
          - validations.priority_21
        distinguishing_aspect: "An appeal decision is one-shot: once the appeal is UPHELD a second decide — even one that would overturn it — is refused 409, so the rep cannot be reinstated through a re-decision."
        test_recipe:
          setup:
            - "Vendor APSV's rep Ann was revoked by ComplianceAdmin user_compliance_1 at the default clock and appealed."
            - "CredentialingOfficer user_credentialing_1 (not the revoking officer, satisfying segregation of duties) already UPHELD the appeal."
          setup_api_calls:
            - call: "POST /vendor-access/vendors"
              payload: { legal_name: "Appeal State Devices", vendor_code: "APSV" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { v_apsv_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps"
              payload: { vendor_id: "${v_apsv_id}", full_name: "Ann Appeal", email: "ann@apsv.example" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { rep_ann_id: $.data.id }
            - call: "POST /vendor-access/vendor-reps/${rep_ann_id}/revoke-access"
              payload: { reason: "Unapproved product opened on the sterile field" }
              as: ComplianceAdmin
              as_user_id: "user_compliance_1"
            - call: "POST /vendor-access/access-appeals"
              payload: { vendor_rep_id: "${rep_ann_id}", grounds: "The product had been approved at a sister facility" }
              as: VendorAdmin
              as_user_id: "${v_apsv_id}"
