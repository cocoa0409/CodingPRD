    description: "fetch one court report by id (flat)"
    roles: [Officer, SupervisingJudge, CompactAdministrator]
    code: 200
    input: []
    output: CourtReport
    side_effects: []
  - method: GET
    path: "/court-reports"
    description: "filtered list of court reports (reverse-reachability for CourtReport.supervisee_id)"
    roles: [Officer, SupervisingJudge, CompactAdministrator]
    code: 200
    input: ["supervisee_id?", "report_type?", "status?", "limit?", "offset?"]
    output: CourtReport[]
    side_effects: []
  - method: GET
    path: "/transfers/{id}"
    description: "fetch one transfer by id (flat)"
    roles: [Officer, SupervisingJudge, CompactAdministrator]
    code: 200
    input: []
    output: InterstateTransfer
    side_effects: []
  - method: GET
    path: "/transfers"
    description: "filtered list of transfers (reverse-reachability for InterstateTransfer.supervisee_id)"
    roles: [Officer, SupervisingJudge, CompactAdministrator]
    code: 200
    input: ["supervisee_id?", "status?", "limit?", "offset?"]
    output: InterstateTransfer[]
    side_effects: []
  - method: GET
    path: "/early-terminations/{id}"
    description: "fetch one early-termination petition by id (flat)"
    roles: [Officer, SupervisingJudge, CompactAdministrator]
    code: 200
    input: []
    output: EarlyTermination
    side_effects: []
  - method: GET
    path: "/early-terminations"
    description: "filtered list of petitions (reverse-reachability for EarlyTermination.supervisee_id)"
    roles: [Officer, SupervisingJudge, CompactAdministrator]
    code: 200
    input: ["supervisee_id?", "status?", "limit?", "offset?"]
    output: EarlyTermination[]
    side_effects: []

  # ---- Test-driving clock endpoint --------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving: set the server's current UTC clock (for window/accrual/term math)"
    roles: [Officer, SupervisingJudge, CompactAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["advances the server clock used by mark-missed window checks, fee accrual, and months-served math"]

# ===========================================================================
# §1.6 ERROR CODE CATALOG
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or empty X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted for this operation per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "a resource id in the path does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "a body FK (assigned_officer_id, supervisee_id, parent_obligation_id, source_drug_test_id, violation_id, check_in_id) references a non-existent resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing/ill-typed required field, invalid enum member, or below-minimum numeric"
  - id: ERR_INCOMPLETE_LSIR_DOMAINS
    http: 422
    condition: "domain_scores does not contain exactly the ten LSI_R_DOMAINS keys, or a value is negative"
  - id: ERR_INVALID_OVERRIDE
    http: 422
    condition: "override_level is below derived_level (override may only raise), or override_reason missing when override supplied"
  - id: ERR_OFFICER_ROLE_MISMATCH
    http: 422
    condition: "assigned_officer_id's role_type != supervision_type, or that officer is not active"
  - id: ERR_DUPLICATE_KEY
    http: 409
    condition: "docket_number or badge_number already exists"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which this transition is defined"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the sustaining actor equals the violation's filed_by_officer_id"
  - id: ERR_LEVEL_TOO_LOW_FOR_CONDITION
    http: 409
    condition: "condition activation attempted while Supervisee.supervision_level < minimum_level_required"
  - id: ERR_WINDOW_NOT_CLOSED
    http: 409
    condition: "mark-missed attempted before scheduled_for + window_minutes has elapsed"
  - id: ERR_CHECKIN_WINDOW_OVERLAP
    http: 409
    condition: "new check-in window overlaps an existing check-in window for the same supervisee (half-open; adjacency allowed)"
  - id: ERR_TRANSFER_ALREADY_OPEN
    http: 409
    condition: "a REQUESTED or ACCEPTED transfer already exists for this supervisee"
  - id: ERR_SUPERVISEE_CLOSED
    http: 409
    condition: "operation attempted on a supervisee in a terminal status {REVOKED, TERMINATED_EARLY, COMPLETED, TRANSFERRED_OUT}"
  - id: ERR_NOT_ELIGIBLE_FOR_TERMINATION
    http: 409
    condition: "early-termination grant attempted while eligibility.eligible == false"
  - id: ERR_PAYMENT_EXCEEDS_BALANCE
    http: 422
    condition: "payment amount_cents exceeds the supervisee's total currently-outstanding balance"
  - id: ERR_OUTSTANDING_BALANCE
    http: 409
    condition: "complete attempted with non-zero restitution_balance_cents or fee_balance_cents"
  - id: ERR_TRANSFER_BLOCKED_HIGH_RISK
    http: 409
    condition: "transfer acceptance attempted with cumulative_violation_points >= 12"
  - id: ERR_STALE_SUPERVISEE_VERSION
    http: 412
    condition: "expected_supervisee_version != current Supervisee.version on transfer create"
  - id: ERR_VALIDATION
    http: 422
    condition: "generic semantic validation failure not covered by a more specific code (e.g., receiving_state_code equals sentence_state_code, or substances non-empty when result != POSITIVE)"

# ===========================================================================
# §1.7 RBAC MATRIX
# ===========================================================================
roles:
  - name: Officer
    description: "probation/parole officer; manages cases, conditions, check-ins, files violations, records payments, requests transfers and early-termination petitions"
    identity: "entity_backed:Officer"
    exclusive_operations:
      - "POST /supervisees (open case)"
      - "POST /supervisees/{id}/activate, /abscond, /return-to-supervision, /refer-revocation"
      - "POST /supervisees/{sid}/risk-assessments and /adopt"
      - "POST /supervisees/{sid}/conditions and /activate, /satisfy"
      - "POST /supervisees/{sid}/check-ins and /attend, /mark-missed, /excuse"
      - "POST /supervisees/{sid}/check-ins/{cid}/drug-tests"
      - "POST /supervisees/{sid}/violations (file) and /appeal"
      - "POST /supervisees/{sid}/payments"
      - "POST /supervisees/{sid}/transfers (request) and /withdraw"
      - "POST /supervisees/{sid}/early-terminations (petition)"
    shared_operations:
      - "POST /supervisees/{sid}/obligations (with SupervisingJudge)"
      - "POST /supervisees/{sid}/court-reports and /file"
      - "all GET reads"

  - name: SupervisingJudge
    description: "judicial officer; sustains/dismisses violations, rules on revocation, early termination, condition waivers, obligation discharge"
    identity: "opaque"
    exclusive_operations:
      - "POST /supervisees/{id}/revoke, /reinstate, /complete"
      - "POST /supervisees/{sid}/violations/{id}/sustain and /dismiss"
      - "POST /supervisees/{sid}/conditions/{id}/waive"
      - "POST /supervisees/{sid}/obligations/{id}/discharge"
      - "POST /supervisees/{sid}/early-terminations/{id}/grant and /deny"
    shared_operations:
      - "POST /supervisees/{sid}/obligations (with Officer)"
      - "POST /supervisees/{sid}/court-reports/{id}/file (with Officer)"
      - "all GET reads"

  - name: CompactAdministrator
    description: "interstate-compact administrator; registers officers and accepts/rejects interstate transfers"
    identity: "opaque"
    exclusive_operations:
      - "POST /officers"
      - "POST /supervisees/{sid}/transfers/{id}/accept and /reject"
    shared_operations:
      - "all GET reads"
