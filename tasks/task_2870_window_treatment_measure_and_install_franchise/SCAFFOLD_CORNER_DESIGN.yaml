        distinguishing_aspect: "LedgerEntry is the scaffold's only common_fields: false entity: no POST, no PATCH, no version field. It appears only as a cascade side effect and is readable only through the territory sub-collection, so the sole assertion surface is that list."
        test_recipe:
          setup:
