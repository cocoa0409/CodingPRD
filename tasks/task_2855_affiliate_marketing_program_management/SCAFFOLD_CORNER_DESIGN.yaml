              as: ComplianceAnalyst
              as_user_id: "cmp-001"
              captures: { case_id: "$.data.id" }
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "REQUEST_REMEDIATION", note: "remove the auto-triggered iframe" }
              as: ComplianceAnalyst
              as_user_id: "cmp-001"
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "SUBMIT_REMEDIATION", note: "iframe removed", remediation_evidence_ref: "EV-FIX-1" }
              as: AffiliatePartner
              as_user_id: "${aff_id}"
          trigger:
            - call: "POST /policy-violation-cases/${case_id}/transition"
              payload: { action: "VERIFY", note: "fix confirmed", verify_outcome: "CLEARED" }
