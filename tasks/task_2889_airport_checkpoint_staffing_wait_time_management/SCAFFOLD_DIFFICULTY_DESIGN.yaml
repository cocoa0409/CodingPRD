# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task 2889 — Airport Checkpoint Staffing & Wait Time Management
#
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only. Every numeric assert
# below was computed by executing the relevant §1.3 formula with its declared
# constants; no assert is an unevaluated expression.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: forecast_variant_divergence_schedule_only_vs_curve_blended
        grounds:
          - calculations.time_band_pax_forecast
          - entities.TimeBand.fields.forecast_variant
          - entities.TimeBand.fields.forecast_pax_count
          - entities.Checkpoint.fields.connecting_pax_discount_pct
          - entities.ShowUpCurve.fields.buckets
        distinguishing_aspect: |
          This instance's dual variant lives in the DEMAND domain (TimeBand passenger
          forecasting off FlightScheduleEntry and ShowUpCurve): SCHEDULE_ONLY spreads a
          flight uniformly over the whole show-up window and ignores both the connecting
          discount and the seasonal multiplier, while CURVE_BLENDED weights the curve's
          individual buckets and then applies both factors — 100 vs 80 passengers for
          byte-identical inputs.
        test_recipe:
          setup:
            - "logical clock at 2026-09-09T00:00:00Z"
            - "one checkpoint with connecting_pax_discount_pct = 20 and no lanes at all"
            - "one two-bucket show-up curve spanning 120..60 minutes before departure (40% in 120..90, 60% in 90..60)"
            - "one SCHEDULED flight departing 2026-09-10T12:00:00Z with 200 seats sold at 100% load factor"
            - "one 30-minute band 2026-09-10T10:00:00Z..10:30:00Z with expedited_share_pct 20 and seasonal_multiplier 1.25"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-09T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /checkpoints"
              payload: { name: "T2 West", terminal_code: "T2", total_lane_positions: 6, wait_threshold_minutes_standard: 15, wait_threshold_minutes_expedited: 8, connecting_pax_discount_pct: 20, secondary_slot_capacity: 2, plan_cost_cap_cents: 10000000 }
              as: PlatformAdmin
              captures: { cp_fc_id: $.data.id }
            - call: "POST /show-up-curves"
              payload:
                name: "Domestic Peak 120-60"
                carrier_type: "DOMESTIC"
                season_code: "PEAK"
                window_start_minutes_before: 120
                window_end_minutes_before: 60
                buckets:
                  - { minutes_before_start: 120, minutes_before_end: 90, share_pct: 40 }
                  - { minutes_before_start: 90, minutes_before_end: 60, share_pct: 60 }
              as: PlatformAdmin
              captures: { curve_fc_id: $.data.id }
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_fc_id}", show_up_curve_id: "${curve_fc_id}", flight_number: "UA700", scheduled_departure_utc: "2026-09-10T12:00:00Z", seats_sold: 200, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
              captures: { fse_fc_id: $.data.id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_fc_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 20, seasonal_multiplier: 1.25 }
              as: StaffingPlanner
              captures: { band_fc_id: $.data.id }
          trigger:
            - call: "POST /time-bands/${band_fc_id}/forecast"
              payload: { variant: "SCHEDULE_ONLY" }
              as: StaffingPlanner
              captures: { so_pax: $.data.forecast_pax_count }
            - call: "POST /time-bands/${band_fc_id}/forecast"
              payload: { variant: "CURVE_BLENDED" }
              as: StaffingPlanner
              captures: { cb_pax: $.data.forecast_pax_count }
          assert:
            - "FlightScheduleEntry.${fse_fc_id}.projected_pax_count == 200"
            - "after the first trigger call ${so_pax} == 100 and TimeBand.${band_fc_id}.forecast_variant == SCHEDULE_ONLY"
            - "after the second trigger call ${cb_pax} == 80 and TimeBand.${band_fc_id}.forecast_variant == CURVE_BLENDED"
            - "${so_pax} != ${cb_pax}: 200 * 30/60 == 100 for SCHEDULE_ONLY versus 200 * 0.40 * (30/30) * (1 - 20/100) * 1.25 == 80 for CURVE_BLENDED"
            - "TimeBand.${band_fc_id}.required_expedited_lanes == 0 and unmet_expedited_demand == 16 (expedited_demand = ceil(80 * 20 / 100) = 16 with zero EXPEDITED candidate lanes)"
            - "TimeBand.${band_fc_id}.required_standard_lanes == 0 and unmet_standard_demand == 64 (standard_demand = 80 - 16 = 64 with zero candidate lanes, so the MIN_OPEN_LANES floor of 1 is clamped down to the 0 lanes that exist)"
            - "TimeBand.${band_fc_id}.forecast_computed_at_utc == 2026-09-09T00:00:00Z"

      - name: officer_duty_ledger_planned_vs_chronological_actual_divergence
        grounds:
          - calculations.officer_duty_ledger
          - entities.LaneAssignment.fields.planned_minutes
          - entities.LaneAssignment.fields.break_minutes_taken
          - entities.Officer.fields.weekly_regular_minutes_cap
          - state_machines.LaneAssignment.DUE_to_ON_BREAK
        distinguishing_aspect: |
          This instance's dual variant lives in the LABOUR domain (Officer minute ledger
          off LaneAssignment rows), a different entity domain from the demand-forecast
          instance: FORWARD_LOOKING_PLANNED counts the still-SCHEDULED band and uses band
          length without deducting breaks (60 worked / 15 overtime) while
          CHRONOLOGICAL_ACTUAL ignores SCHEDULED rows and measures wall-clock minutes
          minus break_minutes_taken (75 worked / 30 overtime).
        test_recipe:
          setup:
            - "an ACTIVATED plan on an OPEN standard lane at 2026-09-10, prepared by planner-1 and approved by duty-1"
            - "officer Ada with weekly_regular_minutes_cap 45 and weekly_overtime_minutes_cap 600 assigned to bands 10:00-10:30 and 12:00-12:30"
            - "assignment 1 is checked in at 10:00, takes a 15-minute break 11:05-11:20 and is released at 11:30; assignment 2 is left SCHEDULED"
          setup_api_calls:
            - &k_clock_0910_0800
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T08:00:00Z" }
              as: PlatformAdmin
            - &k_cp_base
              call: "POST /checkpoints"
              payload: { name: "T1 Main", terminal_code: "T1", total_lane_positions: 6, wait_threshold_minutes_standard: 15, wait_threshold_minutes_expedited: 8, connecting_pax_discount_pct: 0, secondary_slot_capacity: 2, plan_cost_cap_cents: 10000000 }
              as: PlatformAdmin
              captures: { cp_id: $.data.id }
            - &k_curve_30
              call: "POST /show-up-curves"
              payload:
                name: "Late Domestic 30-0"
                carrier_type: "DOMESTIC"
                season_code: "PEAK"
                window_start_minutes_before: 30
                window_end_minutes_before: 0
                buckets:
                  - { minutes_before_start: 30, minutes_before_end: 0, share_pct: 100 }
              as: PlatformAdmin
              captures: { curve_id: $.data.id }
            - &k_lane_l1
              call: "POST /lanes"
              payload: { checkpoint_id: "${cp_id}", lane_type: "STANDARD", position_index: 1, required_officer_count: 1, max_concurrent_officers: 2, secondary_positions: 1 }
              as: CheckpointManager
              captures: { lane_id: $.data.id }
            - &k_eq_wtmd
              call: "POST /equipment-units"
              payload: { lane_id: "${lane_id}", equipment_type: "WTMD", serial_number: "WT-1", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
              captures: { eq_wtmd_id: $.data.id }
            - &k_eq_xray
              call: "POST /equipment-units"
              payload: { lane_id: "${lane_id}", equipment_type: "AT_XRAY", serial_number: "XR-1", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
              captures: { eq_xray_id: $.data.id }
            - &k_eq_ai
              call: "POST /equipment-units"
              payload: { lane_id: "${lane_id}", equipment_type: "ADVANCED_IMAGING", serial_number: "AI-1", calibration_due_utc: "2027-01-01T00:00:00Z" }
              as: CheckpointManager
              captures: { eq_ai_id: $.data.id }
            - &k_open_l1
              call: "POST /lanes/${lane_id}/open"
              payload: {}
              as: CheckpointManager
            - &k_officer_ada
              call: "POST /officers"
              payload: { badge_number: "B-1001", full_name: "Ada Lane", certifications: ["STANDARD_LANE", "ADVANCED_IMAGING"], base_rate_cents_per_minute: 100, weekly_regular_minutes_cap: 45, weekly_overtime_minutes_cap: 600 }
              as: PlatformAdmin
              captures: { off_id: $.data.id }
            - &k_band_1000
              call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { band1_id: $.data.id }
            - &k_band_1200
              call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T12:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { band2_id: $.data.id }
            - &k_flight_1030
              call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "${curve_id}", flight_number: "AA100", scheduled_departure_utc: "2026-09-10T10:30:00Z", seats_sold: 10, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
              captures: { fse1_id: $.data.id }
            - &k_flight_1230
              call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "${curve_id}", flight_number: "AA200", scheduled_departure_utc: "2026-09-10T12:30:00Z", seats_sold: 10, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
              captures: { fse2_id: $.data.id }
            - &k_forecast_band1
              call: "POST /time-bands/${band1_id}/forecast"
              payload: { variant: "CURVE_BLENDED" }
              as: StaffingPlanner
            - &k_forecast_band2
              call: "POST /time-bands/${band2_id}/forecast"
              payload: { variant: "CURVE_BLENDED" }
              as: StaffingPlanner
            - &k_read_cp_version
              call: "GET /checkpoints/${cp_id}"
              payload: {}
              as: StaffingPlanner
              captures: { cp_v1: $.data.version }
            - &k_plan_create
              call: "POST /staffing-plans"
              payload: { checkpoint_id: "${cp_id}", operational_date: "2026-09-10", expected_checkpoint_version: "${cp_v1}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { plan_id: $.data.id }
            - &k_asg_band1
              call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "${band1_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { asg1_id: $.data.id }
            - &k_asg_band2
              call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_id}", time_band_id: "${band2_id}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { asg2_id: $.data.id }
            - &k_plan_submit
              call: "POST /staffing-plans/${plan_id}/submit"
              payload: {}
              as: StaffingPlanner
              as_user_id: "planner-1"
            - &k_plan_approve
              call: "POST /staffing-plans/${plan_id}/decision"
              payload: { decision: "APPROVE" }
              as: DutyManager
              as_user_id: "duty-1"
            - &k_plan_activate
              call: "POST /staffing-plans/${plan_id}/lifecycle"
              payload: { action: "ACTIVATE" }
              as: CheckpointManager
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "CHECK_IN" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T11:05:00Z" }
              as: PlatformAdmin
            - call: "POST /lane-assignments/${asg1_id}/break"
              payload: { action: "START" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T11:20:00Z" }
              as: PlatformAdmin
            - call: "POST /lane-assignments/${asg1_id}/break"
              payload: { action: "END" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T11:30:00Z" }
              as: PlatformAdmin
            - call: "POST /lane-assignments/${asg1_id}/duty"
              payload: { action: "RELEASE" }
              as: ScreeningOfficer
              as_user_id: "${off_id}"
            - call: "GET /officers/${off_id}/duty-ledger"
              payload: { variant: "FORWARD_LOOKING_PLANNED" }
              as: StaffingPlanner
              captures: { planned_worked: $.data.worked_minutes, planned_ot: $.data.overtime_minutes }
            - call: "GET /officers/${off_id}/duty-ledger"
              payload: { variant: "CHRONOLOGICAL_ACTUAL" }
              as: StaffingPlanner
              captures: { actual_worked: $.data.worked_minutes, actual_ot: $.data.overtime_minutes }
          assert:
            - "LaneAssignment.${asg1_id}.break_minutes_taken == 15 and break_state == COMPLETED while assignment_state == RELEASED"
            - "LaneAssignment.${asg1_id}.actual_minutes == 75 and planned_minutes == 30"
            - "LaneAssignment.${asg2_id}.assignment_state == SCHEDULED"
            - "the FORWARD_LOOKING_PLANNED read returns worked_minutes == 60, approved_detail_minutes == 0, total_minutes == 60, regular_minutes == 45, overtime_minutes == 15, cap_headroom_minutes == 585"
            - "the CHRONOLOGICAL_ACTUAL read returns worked_minutes == 75, approved_detail_minutes == 0, total_minutes == 75, regular_minutes == 45, overtime_minutes == 30, cap_headroom_minutes == 570"
            - "${planned_worked} == 60 and ${actual_worked} == 75 and ${planned_ot} == 15 and ${actual_ot} == 30 — the same officer, the same two rows, two different ledgers"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: forecast_rounding_order_round_per_flight_then_sum
        mode: b
        grounds:
          - calculations.time_band_pax_forecast
          - calculations.time_band_pax_forecast.precision
          - entities.TimeBand.fields.seasonal_multiplier
        distinguishing_aspect: |
          Mode (b) — rounding order. Three flights each contribute exactly 10.5 passengers to
          the band. Rounding each (flight, band) contribution with round_half_up FIRST and
          then summing gives 33; summing the exact contributions (31.5) and rounding once at
          the end gives 32. The two orders are separated by exactly one passenger, so an
          implementation that rounds at the wrong point cannot pass.
        test_recipe:
          setup:
            - "one checkpoint with connecting_pax_discount_pct = 0"
            - "one single-bucket show-up curve 30..0 minutes before departure carrying 100% of the load"
            - "three SCHEDULED flights AA100 / AA101 / AA102 all departing 2026-09-10T10:30:00Z with 10 seats sold at 100% load factor"
            - "one band 2026-09-10T10:00:00Z..10:30:00Z with seasonal_multiplier 1.05"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_curve_30
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "${curve_id}", flight_number: "AA100", scheduled_departure_utc: "2026-09-10T10:30:00Z", seats_sold: 10, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "${curve_id}", flight_number: "AA101", scheduled_departure_utc: "2026-09-10T10:30:00Z", seats_sold: 10, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
            - call: "POST /flight-schedule-entries"
              payload: { checkpoint_id: "${cp_id}", show_up_curve_id: "${curve_id}", flight_number: "AA102", scheduled_departure_utc: "2026-09-10T10:30:00Z", seats_sold: 10, load_factor_pct: 100, carrier_type: "DOMESTIC" }
              as: StaffingPlanner
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.05 }
              as: StaffingPlanner
              captures: { band_r_id: $.data.id }
          trigger:
            - call: "POST /time-bands/${band_r_id}/forecast"
              payload: { variant: "CURVE_BLENDED" }
              as: StaffingPlanner
              captures: { rounded_total: $.data.forecast_pax_count }
          assert:
            - "${rounded_total} == 33 — each flight contributes 10 * 1.00 * (30/30) * 1.00 * 1.05 == 10.5, round_half_up(10.5) == 11, and 11 + 11 + 11 == 33"
            - "${rounded_total} != 32 — 32 is the sum-then-round answer (10.5 + 10.5 + 10.5 == 31.5, round_half_up(31.5) == 32) and is wrong"
            - "TimeBand.${band_r_id}.forecast_variant == CURVE_BLENDED and forecast_computed_at_utc == 2026-09-10T08:00:00Z"
            - "TimeBand.${band_r_id}.required_expedited_lanes == 0 and unmet_expedited_demand == 0 (expedited_share_pct is 0, so expedited_demand == 0)"

      - name: plan_cost_admin_fee_tier_keyed_on_subtotal_not_total
        mode: c
        grounds:
          - calculations.staffing_plan_cost
          - entities.StaffingPlan.fields.subtotal_cents
          - entities.StaffingPlan.fields.admin_fee_rate
          - entities.StaffingPlan.fields.total_cost_cents
          - endpoints.GET_staffing-plans_cost-summary
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency. admin_fee_cents depends on subtotal_cents
          and total_cost_cents depends on admin_fee_cents, which makes the tier lookup look
          as though it should read the total. The scaffold breaks the loop by pinning the tier
          to subtotal_cents ONLY. This fixture lands the subtotal at 19200 — inside tier 2 —
          while the resulting total 20064 sits inside tier 3, so reading the tier off the
          total yields 19776 instead of 20064.
        test_recipe:
          setup:
            - "one checkpoint and one standard lane"
            - "officer B-2001 at 160 cents/minute with weekly_regular_minutes_cap 120 and weekly_overtime_minutes_cap 600"
            - "four non-adjacent 30-minute bands at 10:00, 11:00, 12:00 and 13:00 on 2026-09-10 (30-minute gaps clear the 15-minute rest buffer)"
            - "a DRAFT plan staffing the officer on all four bands, 120 planned minutes total, all regular"
          setup_api_calls:
            - *k_clock_0910_0800
            - *k_cp_base
            - *k_lane_l1
            - call: "POST /officers"
              payload: { badge_number: "B-2001", full_name: "Ben Tier", certifications: ["STANDARD_LANE"], base_rate_cents_per_minute: 160, weekly_regular_minutes_cap: 120, weekly_overtime_minutes_cap: 600 }
              as: PlatformAdmin
              captures: { off_t_id: $.data.id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T10:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { tb1: $.data.id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T11:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { tb2: $.data.id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T12:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { tb3: $.data.id }
            - call: "POST /time-bands"
              payload: { checkpoint_id: "${cp_id}", band_start_utc: "2026-09-10T13:00:00Z", expedited_share_pct: 0, seasonal_multiplier: 1.0 }
              as: StaffingPlanner
              captures: { tb4: $.data.id }
            - *k_read_cp_version
            - *k_plan_create
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_t_id}", time_band_id: "${tb1}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_t_id}", time_band_id: "${tb2}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_t_id}", time_band_id: "${tb3}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
          trigger:
            - call: "POST /lane-assignments"
              payload: { staffing_plan_id: "${plan_id}", lane_id: "${lane_id}", officer_id: "${off_t_id}", time_band_id: "${tb4}" }
              as: StaffingPlanner
              as_user_id: "planner-1"
              captures: { asg_t4_id: $.data.id }
            - call: "GET /staffing-plans/${plan_id}/cost-summary"
              payload: {}
              as: StaffingPlanner
              captures: { sub: $.data.subtotal_cents, rate: $.data.admin_fee_rate, fee: $.data.admin_fee_cents, total: $.data.total_cost_cents }
          assert:
            - "LaneAssignment.${asg_t4_id}.planned_minutes == 30"
            - "the cost-summary read returns planned_regular_minutes == 120 and planned_overtime_minutes == 0"
            - "the cost-summary read returns base_cost_cents == 19200 (round_half_up(120 * 160)) and overtime_cost_cents == 0 and detail_cost_cents == 0"
            - "${sub} == 19200 and ${rate} == \"0.045\" — 19200 falls in the 5000..19999 tier"
            - "${fee} == 864 (round_half_up(19200 * 0.045)) and ${total} == 20064"
            - "${total} != 19776 — 19776 is what selecting the tier from total_cost_cents (20064 >= 20000 -> 0.030 -> fee 576) would produce and is wrong"
            - "StaffingPlan.${plan_id}.state == DRAFT and admin_fee_rate == \"0.045\" — the cost fields track assignment writes without waiting for submit"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: lane_assignment_break_cycle_runs_parallel_to_duty_axis
        shape: parallel
        grounds:
          - state_machines.LaneAssignment
          - state_machines.LaneAssignment.NOT_DUE_to_DUE
          - state_machines.LaneAssignment.DUE_to_ON_BREAK
          - state_machines.LaneAssignment.ON_BREAK_to_COMPLETED
          - state_machines.LaneAssignment.COMPLETED_to_DUE
          - entities.LaneAssignment.fields.break_baseline_utc
        distinguishing_aspect: |
          Non-linearity on the LaneAssignment entity, of the PARALLEL kind: the row carries two
          independent state dimensions and a full break cycle DUE -> ON_BREAK -> COMPLETED ->
          DUE runs on the break axis while assignment_state never leaves CHECKED_IN. It also
          closes a genuine loop: break_baseline_utc is reset on break END so COMPLETED can
          return to DUE on the same row, which a forward-only machine cannot express.
        test_recipe:
          setup:
            - "an ACTIVATED plan on an OPEN standard lane at 2026-09-10 with officer Ada assigned to bands 10:00 and 12:00"
