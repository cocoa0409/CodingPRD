          rationale: "The §1.8 priority_pair_validation_conflict instance already pins the ERR_APPLICATION_NOT_UNDER_REVIEW versus ERR_INCOME_LIMIT_EXCEEDED ordering on an INFO_REQUESTED application with an over-limit certification, including the negative control where only the income violation remains."

      - name: cross_entity_grant_state_check_covered_by_the_difficulty_design
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=11]
          - entities.ExemptionGrant.fields.benefit_status
        excluded_because:
          difficulty_instance: claim_approval_requires_non_terminal_grant_state_on_another_entity
          rationale: "The §1.8 cross_entity_state_dependency instance already validates a retroactive-claim decision against the benefit_status of the referenced ExemptionGrant, which is exactly the cross-entity validation pattern for this domain."

      - name: docket_capacity_aggregate_check_covered_by_the_difficulty_design
        claim_type: aggregate_validation
        grounds:
          - validations[priority=27]
          - entities.HearingDocket.fields.scheduled_appeal_count
        excluded_because:
          difficulty_instance: docket_aggregate_capacity_blocks_a_slot_no_other_hearing_touches
          rationale: "The §1.8 resource_temporal_overlap instance already asserts the aggregate capacity gate over scheduled_appeal_count together with its interaction with per-slot interval checks, so a separate aggregate-validation corner case would duplicate it."

