      - call: POST /accelerators/partners/${pa_id}/validations
        payload:
          validation_minutes: 240
          test_count: 6
          blueprint_id: ${bp_id}
        as: PartnerProgramManager
      - call: POST /accelerators/partners/${pa_id}/qualify
        payload: {}
        as: PartnerProgramManager
      - call: POST /accelerators/allocations
        payload:
          sku_code: AC-100-PCIE
          product_family: DATACENTER
          form_factor: PCLE
          hbm_capacity_gb: 80
          tdp_watts: 1350
          supply_ceiling_units: 10000
          long_term_availability_through: '2029-01-01T00:00:00Z'
        as: PlatformAdmin
        captures:
          sku_id: $.data.id
      - call: POST /accelerators/supply-contracts
        payload:
          product_sku_id: ${sku_id}
          start_month: 2026-01
          end_month: 2026-03
          contracted_units: 500
        as: LifecycleProgramManager
        as_user_id: ${pa_id}
        captures:
          sc_first: $.data.id
      trigger:
      - call: POST /accelerators/supply-contracts
        payload:
          product_sku_id: ${sku_id}
