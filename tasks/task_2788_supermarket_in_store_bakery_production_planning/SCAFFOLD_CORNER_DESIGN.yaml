      - name: a_third_revision_request_on_the_same_cake_order_is_rejected
        claim_type: cyclic
        grounds:
          - state_machines.CustomCakeOrder.IN_DECORATION_to_CONFIRMED
          - validations.priority_39
          - errors.ERR_REVISION_LIMIT_REACHED
          - entities.CustomCakeOrder.fields.revision_count
        distinguishing_aspect: "The IN_DECORATION -> CONFIRMED loop is bounded, not infinite: two traversals are accepted and leave revision_count at 2, and the third request is refused with ERR_REVISION_LIMIT_REACHED (422) while the order stays IN_DECORATION."
        test_recipe:
          setup:
            - "DRAFT BakeDay on 2026-08-12 with an OPEN 14:00-16:00Z slot (capacity 30) and one STANDARD 2-tier cake order already through two revisions and back IN_DECORATION."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
