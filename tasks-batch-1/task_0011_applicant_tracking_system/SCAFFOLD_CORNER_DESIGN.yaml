scaffold_corner_design:

  # ===================================================================
  # entities — creation, retrieval, listing, required fields, defaults,
  # computed fields, immutability, FK NOT_FOUND
  # ===================================================================
  - section: entities
    instances:
      - name: department_create_minimal_returns_201_with_zero_committed
        claim_type: Creation
        grounds:
          - entities.Department
          - endpoints[POST /ats/departments]
        distinguishing_aspect: |
          Creating a Department with the three required input fields returns 201 and the
          response body has committed_offer_cents == 0 (computed default before any offer).
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /ats/departments"
              payload: { name: "Sales", cost_center_code: "SLS-001", hiring_budget_cents: 50000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id, dept_committed: $.data.committed_offer_cents, dept_v: $.data.version }
          assert:
            - "Response status == 201"
            - "Department.committed_offer_cents == 0"
            - "Department.version == 1"

      - name: candidate_create_with_defaults_eeo_declined
        claim_type: Defaults
        grounds:
          - entities.Candidate.fields.eeo_ethnicity
          - entities.Candidate.fields.eeo_gender
          - entities.Candidate.fields.eeo_veteran
          - entities.Candidate.fields.eeo_disability
          - endpoints[POST /ats/candidates]
        distinguishing_aspect: |
          Omitting voluntary EEO fields on POST /ats/candidates applies the declared defaults:
          eeo_ethnicity=DECLINED, eeo_gender=DECLINED, eeo_veteran=false, eeo_disability=false.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /ats/candidates"
              payload: { full_name: "Default Cand", email: "def@example.com", source_channel: "DIRECT" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id, eth: $.data.eeo_ethnicity, gen: $.data.eeo_gender, vet: $.data.eeo_veteran, dis: $.data.eeo_disability }
          assert:
            - "Candidate.eeo_ethnicity == 'DECLINED'"
            - "Candidate.eeo_gender == 'DECLINED'"
            - "Candidate.eeo_veteran == false"
            - "Candidate.eeo_disability == false"

      - name: requisition_get_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints[GET /ats/requisitions/{id}]
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: |
          GET /ats/requisitions/{id} with a syntactically-valid UUID that names no row returns
          404 with error_id=ERR_NOT_FOUND (priority 3 existence check).
        test_recipe:
          setup:
            - "Empty database (no requisitions)"
          setup_api_calls: []
          trigger:
            - call: "GET /ats/requisitions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == 'ERR_NOT_FOUND'"

      - name: application_create_with_unknown_candidate_returns_fk_not_found
        claim_type: Required Fields
        grounds:
          - endpoints[POST /ats/applications]
          - errors[ERR_FK_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: |
          POST /ats/applications with candidate_id that does not exist returns 404 with
          error_id=ERR_FK_NOT_FOUND (priority 4 body-FK existence check).
        test_recipe:
          setup:
            - "Department + Requisition APPROVED exist; candidate_id refers to a non-existent UUID"
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "FkDept", cost_center_code: "FK-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "FkRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
          trigger:
            - call: "POST /ats/applications"
              payload: { candidate_id: "00000000-0000-0000-0000-000000000000", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404"
            - "error_id == 'ERR_FK_NOT_FOUND'"

      - name: department_committed_offer_cents_recomputes_on_offer_create
        claim_type: Computed Fields
        grounds:
          - entities.Department.fields.committed_offer_cents
          - calculations.department_committed_offer
          - endpoints[POST /ats/offers]
        distinguishing_aspect: |
          Department.committed_offer_cents is computed (sum over offers in active statuses).
          Creating a single Offer increases committed_offer_cents by that offer's
          base_salary_cents; reading the department reflects the new sum.
        test_recipe:
          setup:
            - "Department D; Requisition APPROVED; Application SCREENING; about to create Offer with base_salary_cents=11_000_000"
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "CmpDept", cost_center_code: "CMP-001", hiring_budget_cents: 200000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "CmpRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Cmp Cand", email: "cmpc@example.com", source_channel: "DIRECT" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
          trigger:
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 11000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id }
            - call: "GET /ats/departments/${dept_id}"
              payload: {}
              as: PlatformAdmin
              captures: { committed_after: $.data.committed_offer_cents }
          assert:
            - "Department.committed_offer_cents == 11000000 (single offer in active set)"

      - name: interview_feedback_is_immutable_log_no_version_field
        claim_type: Immutability
        grounds:
          - entities.InterviewFeedback
        distinguishing_aspect: |
          InterviewFeedback has common_fields: false → no version field, no updated_at. Only id
          and created_at per §1.1. No update endpoint exists in §1.5; it is an append-only log.
        test_recipe:
          setup:
            - "Interview scheduled with panelist emp_panel_imm in panel"
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "ImmDept", cost_center_code: "IMM-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "ImmRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Imm Cand", email: "immc@example.com", source_channel: "DIRECT" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/interviews"
              payload: { application_id: "${app_id}", round_number: 1, scheduled_at: "2027-02-01T10:00:00Z", duration_minutes: 60, panel_user_ids: ["emp_panel_imm"] }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { intv_id: $.data.id }
          trigger:
            - call: "POST /ats/interview-feedback"
              payload: { interview_id: "${intv_id}", panelist_user_id: "emp_panel_imm", score: 4, comments: "fine" }
              as: HiringManager
              as_user_id: "hm_bob"
              captures: { fb_id: $.data.id, fb_created: $.data.created_at }
          assert:
            - "InterviewFeedback row exists with id and created_at; no version/updated_at fields are required by the entity (common_fields=false)"

  # ===================================================================
  # state_machines — invalid transitions, terminal lockdown, idempotency,
  # cascades and side effects
  # ===================================================================
  - section: state_machines
    instances:
      - name: requisition_approve_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.JobRequisition.DRAFT_to_PENDING_APPROVAL
          - state_machines.JobRequisition.PENDING_APPROVAL_to_APPROVED
          - errors[ERR_INVALID_STATE]
          - validations[priority=5]
        distinguishing_aspect: |
          From DRAFT, only DRAFT→PENDING_APPROVAL (submit) is declared. Attempting
          POST /ats/requisitions/{id}/approve from DRAFT must fail with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Requisition R freshly created in DRAFT, never submitted"
          setup_api_calls:
            - call: "POST /ats/departments"
              payload: { name: "InvStDept", cost_center_code: "IVS-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "IvsRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
          trigger:
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == 'ERR_INVALID_STATE'"
            - "JobRequisition.status remains DRAFT"

      - name: application_withdraw_from_hired_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Application.OFFER_EXTENDED_to_HIRED
          - state_machines.Application.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          HIRED is a terminal state for Application; POST /ats/applications/{id}/withdraw on a
          HIRED application must fail with ERR_INVALID_STATE (no transition declared from
          HIRED).
        test_recipe:
          setup:
            - "Application A driven through full chain to HIRED via offer accept"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "TermDept", cost_center_code: "TRM-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "TrmRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Trm Cand", email: "trmc@example.com", source_channel: "DIRECT" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
          trigger:
            - call: "POST /ats/applications/${app_id}/withdraw"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409"
            - "error_id == 'ERR_INVALID_STATE'"
            - "Application.status remains HIRED"

      - name: interview_cascade_first_interview_application_to_interviewing
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Application.SCREENING_to_INTERVIEWING
          - state_machines.Interview.transitions
          - endpoints[POST /ats/interviews]
        distinguishing_aspect: |
          Creating the FIRST Interview on an Application in SCREENING bubbles
          Application SCREENING→INTERVIEWING automatically (auto-transition cascade
          declared on Interview create's side_effects).
        test_recipe:
          setup:
            - "Application A in SCREENING, no Interview yet"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "CscDept", cost_center_code: "CSC-101", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "CscRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Csc Cand", email: "cscc@example.com", source_channel: "DIRECT" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
          trigger:
            - call: "POST /ats/interviews"
              payload: { application_id: "${app_id}", round_number: 1, scheduled_at: "2027-04-02T10:00:00Z", duration_minutes: 60, panel_user_ids: ["emp_csc_p1"] }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { intv_id: $.data.id }
            - call: "GET /ats/applications/${app_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_status: $.data.status }
          assert:
            - "Interview row created with status SCHEDULED"
            - "Application.status == INTERVIEWING (auto-transitioned by Interview creation cascade)"

      - name: cascade_other_application_rejected_when_candidate_hired_elsewhere
        claim_type: Cascade down
        grounds:
          - state_machines.Offer.EXTENDED_to_ACCEPTED
          - state_machines.Application.OFFER_EXTENDED_to_HIRED
          - state_machines.Application.APPLIED_to_REJECTED
        distinguishing_aspect: |
          When Offer ACCEPTED bubbles Application→HIRED, the OTHER non-terminal Applications of
          the same candidate cascade to REJECTED (declared on the OFFER_EXTENDED→HIRED side
          effects).
        test_recipe:
          setup:
            - "Single Candidate with two Applications on two different APPROVED requisitions; one application driven to OFFER_EXTENDED+ACCEPT, other still APPLIED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "MultiDept", cost_center_code: "MUL-001", hiring_budget_cents: 200000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "Role1", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req1_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "Role2", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req2_id: $.data.id }
            - call: "POST /ats/requisitions/${req1_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req2_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req1_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/requisitions/${req2_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Multi Cand", email: "mul@example.com", source_channel: "DIRECT" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req1_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app1_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req2_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app2_id: $.data.id }
            - call: "POST /ats/applications/${app1_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app1_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
          trigger:
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
            - call: "GET /ats/applications/${app1_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app1_after: $.data.status }
            - call: "GET /ats/applications/${app2_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app2_after: $.data.status }
          assert:
            - "Application(${app1_id}).status == HIRED"
            - "Application(${app2_id}).status == REJECTED (other-app cascade fired)"

  # ===================================================================
  # calculations — input filtering, precision, threshold boundaries
  # ===================================================================
  - section: calculations
    instances:
      - name: interview_recommendation_rounding_to_2dp_half_up
        claim_type: Precision
        grounds:
          - calculations.interview_recommendation_rule
          - entities.Interview.fields.aggregate_score
          - state_machines.Interview.SCHEDULED_to_COMPLETED
        distinguishing_aspect: |
          aggregate_score is rounded to 2dp half-up before being compared to the recommendation
          thresholds. Three feedback scores [4, 5, 4] → mean = 4.333… → rounded HALF_UP → 4.33,
          which lands in [3.50, 4.50) → HIRE (not STRONG_HIRE).
        test_recipe:
          setup:
            - "Interview scheduled with 3 panelists (panelist_p1, panelist_p2, panelist_p3); all three submit feedback (4, 5, 4)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
