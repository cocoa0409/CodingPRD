              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /stores/boat-deals/${d_id}/contract"
              payload: { expected_deal_version: "${d_v}" }
              as: DealDeskClerk
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /stores/boat-deals/${d_id}/funding"
              payload: { amount_cents: 12102192, expected_deal_version: "${d_v2}" }
              as: FinanceAdmin
              captures: { err: $.data.error_id }
            - call: "GET /stores/boat-deals/${d_id}"
              as: FinanceAdmin
              captures: { d_v3: $.data.version }
            - call: "POST /stores/boat-deals/${d_id}/funding"
              payload: { amount_cents: 12102193, expected_deal_version: "${d_v3}" }
              as: FinanceAdmin
              captures: { d_v4: $.data.version }
            - call: "GET /stores/boat-deals/${d_id}"
              as: FinanceAdmin
          assert:
            - "the one-cent-short funding is rejected with data.error_id == ERR_FUNDING_SHORTFALL and http 422"
            - "BoatDeal.${d_id}.balance_due_cents == 12102193 and funding_status == UNFUNDED after the rejection"
            - "the exact-balance funding succeeds: BoatDeal.${d_id}.funding_status == FUNDED and funded_amount_cents == 12102193"
            - "BoatDeal.${d_id}.balance_due_cents == 0 after the success, so the boundary is inclusive downward"

      - name: segregation_of_duties_on_remit_seal_and_credit_decision
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - validations[priority=19]
          - state_machines.ClubCardApplication.transitions.UNDERWRITING_to_APPROVED
        distinguishing_aspect: "The same error id guards two different four-eyes rules on two different workflows, one by opaque user id and one by field inequality."
        test_recipe:
          setup: ["a store, one member, one permit sale and one underwritten club card application"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
