              as_user_id: "${r_id}"
              captures: { rf_id: $.data.id }
            - call: "POST /referrals/${rf_id}/redeem"
              payload: { referred_account_id: "${b_id}" }
              as: Investor
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /referrals/${rf_id}/qualify"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "POST /referrals/${rf_id}/qualify returns 409 ERR_INVALID_STATE (referred Account.${b_id}.lifetime_invested_cents == 0 < 500)"
            - "Referral.${rf_id}.status remains REDEEMED; neither account credited"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: found_money_offer_half_open_window_overlap_same_brand
        grounds:
          - validations[priority=24]
          - entities.FoundMoneyOffer.fields.active_from
          - entities.FoundMoneyOffer.fields.active_until
          - errors[ERR_OFFER_WINDOW_OVERLAP]
        distinguishing_aspect: >
          Half-open interval semantics on FoundMoneyOffer: a second ACTIVE offer for the SAME brand with
          window [2026-06-01, 2026-08-01) overlapping an existing [2026-05-01, 2026-07-01) is rejected, but a
          touching window starting exactly at the existing one's active_until (2026-07-01) is ALLOWED — boundary
          touch is non-overlap under [from, until).
        test_recipe:
          setup:
            - "One ACTIVE offer for brand ACME with window [2026-05-01, 2026-07-01)."
          setup_api_calls:
            - call: "POST /found-money-offers"
              payload: { brand_name: "ACME", rebate_mode: "FLAT", rebate_flat_cents: 100, max_rebate_cents: 100, min_spend_cents: 0, hold_days: 0, active_from: "2026-05-01T00:00:00Z", active_until: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer1_id: $.data.id }
          trigger:
            - call: "POST /found-money-offers"
              payload: { brand_name: "ACME", rebate_mode: "FLAT", rebate_flat_cents: 100, max_rebate_cents: 100, min_spend_cents: 0, hold_days: 0, active_from: "2026-06-01T00:00:00Z", active_until: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Overlapping ACME offer [2026-06-01,2026-08-01) returns 409 ERR_OFFER_WINDOW_OVERLAP"
            - "A touching ACME offer [2026-07-01,2026-09-01) is accepted (201) — half-open boundary touch is not overlap"

      - name: recurring_contribution_buffered_day_collision
        grounds:
          - validations[priority=25]
          - entities.RecurringContribution.fields.run_day_index
          - errors[ERR_CONTRIBUTION_DAY_COLLISION]
        distinguishing_aspect: >
          Closed buffered-interval semantics on RecurringContribution: a new ACTIVE contribution at
          run_day_index 11 collides with an existing one at run_day_index 10 because the +/-1 inclusive
          buffer [9,11] of the existing contribution contains 11 — adjacency within 1 day IS a collision
          (opposite of the offer's boundary-touch-allowed semantics), on a different resource (the Account's schedule).
        test_recipe:
          setup:
            - "Verified account with one ACTIVE RecurringContribution at run_day_index 10."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "rc@x.com", full_name: "Re Curr", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /recurring-contributions"
              payload: { account_id: "${acc_id}", amount_cents: 1000, cadence: "MONTHLY", run_day_index: 10 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { rc1_id: $.data.id }
          trigger:
            - call: "POST /recurring-contributions"
              payload: { account_id: "${acc_id}", amount_cents: 2000, cadence: "MONTHLY", run_day_index: 11 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "New contribution at run_day_index 11 returns 409 ERR_CONTRIBUTION_DAY_COLLISION (within +/-1 buffer of day 10)"
            - "A contribution at run_day_index 12 is accepted (201) — outside the [9,11] buffer"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: found_money_confirm_conserves_cash_equals_transaction
        grounds:
          - state_machines.FoundMoneyReward.PENDING_to_CONFIRMED
          - entities.Account.fields.cash_balance_cents
          - entities.CashTransaction.fields.amount_cents
          - calculations.found_money_rebate
        distinguishing_aspect: >
          Conserved quantity = cash: confirming a found-money reward of rebate_amount_cents R increases
          Account.cash_balance_cents by exactly R AND records a CashTransaction(FOUND_MONEY) with amount == +R,
          so (cash delta) == (sum of FOUND_MONEY CashTransaction amounts) == R with zero drift. Quantity type: account cash.
        test_recipe:
          setup:
            - "Verified account, cash 0; PERCENT offer 500bps cap 1000; PENDING reward earned on spend 10000 => rebate 500, hold_days 0 (eligible immediately)."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /found-money-offers"
              payload: { brand_name: "PctBrand", rebate_mode: "PERCENT", rebate_percent_bps: 500, max_rebate_cents: 1000, min_spend_cents: 0, hold_days: 0, active_from: "2026-01-01T00:00:00Z", active_until: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "fm@x.com", full_name: "Fo M", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { acc_id: $.data.id }
            - call: "POST /accounts/${acc_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /found-money-rewards"
              payload: { account_id: "${acc_id}", offer_id: "${offer_id}", qualifying_spend_cents: 10000 }
              as: Investor
              as_user_id: "${acc_id}"
              captures: { rew_id: $.data.id, rebate: $.data.rebate_amount_cents }
          trigger:
            - call: "POST /found-money-rewards/${rew_id}/confirm"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "FoundMoneyReward.${rew_id}.rebate_amount_cents == 500 (floor(10000*500/10000)=500, <= cap 1000)"
            - "After confirm: Account.${acc_id}.cash_balance_cents == 500"
            - "Exactly one CashTransaction with tx_type == FOUND_MONEY and amount_cents == +500 exists; cash delta equals that amount (no drift)"

      - name: referral_qualify_conserves_referral_credits_both_sides
        grounds:
          - state_machines.Referral.REDEEMED_to_QUALIFIED
          - entities.Account.fields.referral_credits_cents
          - entities.Account.fields.cash_balance_cents
          - entities.CashTransaction.fields.amount_cents
        distinguishing_aspect: >
          Conserved quantity = referral credits (a different conserved quantity from account cash above):
          qualifying a referral of bonus_cents B increments BOTH referrer and referred Account.referral_credits_cents
          by exactly B and credits each side's cash by B with two CashTransaction(REFERRAL_BONUS, +B); the named
          invariant referral_credits_cents == sum of REFERRAL_BONUS credits granted to that account holds with no drift.
        test_recipe:
          setup:
            - "Referrer R, referred B (verified); B has invested >= 500 (one settled INVEST of 600); referral REDEEMED by B."
          setup_api_calls:
            - call: "POST /subscription-plans"
              payload: { tier: "PERSONAL", monthly_fee_cents: 600, allows_custodial: true, allows_ira: true, management_fee_bps: 0 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /model-portfolios"
              payload: { risk_tier: 3, name: "Moderate", target_allocation: { EQUITY: 60, BOND: 40 }, drift_band_bps: 500 }
              as: PlatformAdmin
              captures: { mp_id: $.data.id }
            - call: "POST /found-money-offers"
              payload: { brand_name: "RefSeed", rebate_mode: "FLAT", rebate_flat_cents: 1000, max_rebate_cents: 1000, min_spend_cents: 0, hold_days: 0, active_from: "2026-01-01T00:00:00Z", active_until: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { offer_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "qr@x.com", full_name: "Q R", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}" }
              as: Anonymous
              captures: { r_id: $.data.id }
            - call: "POST /accounts/register"
              payload: { email: "qb@x.com", full_name: "Q B", plan_id: "${plan_id}", model_portfolio_id: "${mp_id}", sweep_threshold_cents: 100000 }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /accounts/${b_id}/verify-kyc"
              payload: {}
              as: PlatformAdmin
            - call: "POST /found-money-rewards"
              payload: { account_id: "${b_id}", offer_id: "${offer_id}", qualifying_spend_cents: 5000 }
              as: Investor
              as_user_id: "${b_id}"
              captures: { rew_id: $.data.id }
            - call: "POST /found-money-rewards/${rew_id}/confirm"
              payload: {}
              as: PlatformAdmin
            - call: "POST /buckets"
              payload: { account_id: "${b_id}", bucket_type: "TAXABLE" }
              as: Investor
              as_user_id: "${b_id}"
              captures: { bkt_id: $.data.id }
            - call: "POST /orders"
              payload: { account_id: "${b_id}", bucket_id: "${bkt_id}", order_kind: "INVEST", source: "MANUAL", requested_amount_cents: 600 }
              as: Investor
              as_user_id: "${b_id}"
              captures: { o_id: $.data.id }
            - call: "GET /buckets/${bkt_id}"
              payload: {}
              as: Investor
              as_user_id: "${b_id}"
              captures: { bkt_v: $.data.version }
            - call: "POST /orders/${o_id}/submit"
              payload: { expected_bucket_version: "${bkt_v}" }
              as: Investor
              as_user_id: "${b_id}"
            - call: "POST /orders/${o_id}/settle"
              payload: {}
              as: PlatformAdmin
            - call: "POST /referrals"
              payload: { referrer_account_id: "${r_id}", code: "QUALPAY", bonus_cents: 1000 }
              as: Investor
              as_user_id: "${r_id}"
              captures: { rf_id: $.data.id }
            - call: "POST /referrals/${rf_id}/redeem"
              payload: { referred_account_id: "${b_id}" }
              as: Investor
              as_user_id: "${b_id}"
          trigger:
            - call: "POST /referrals/${rf_id}/qualify"
              payload: {}
              as: PlatformAdmin
              captures: { st: $.data.status }
          assert:
            - "Referral.${rf_id}.status == QUALIFIED"
            - "Account.${r_id}.referral_credits_cents == 1000 and Account.${r_id}.cash_balance_cents == 1000"
            - "Account.${b_id}.referral_credits_cents == 1000 (B's cash increases by 1000 from the bonus, on top of its prior balance)"
            - "Two CashTransaction(REFERRAL_BONUS, amount +1000) exist (one per side); each account's referral_credits_cents equals the bonus it received (no drift)"
