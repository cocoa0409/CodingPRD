            - call: "POST /properties"
              payload: { name: "Consume Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "108", full_name: "R Eight", email: "r8@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "A-1", name: "Part A", unit_cost_cents: 100, reorder_level: 2, initial_stock: 6 }
              as: PropertyManager
              captures: { part_a: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "B-1", name: "Part B", unit_cost_cents: 50, reorder_level: 0, initial_stock: 4 }
              as: PropertyManager
              captures: { part_b: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Fix with parts" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { part_id: "${part_a}", quantity: 3 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wop_a: $.data.id }
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { part_id: "${part_b}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wop_b: $.data.id }
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/p1.jpg"], damage_reported: false }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wo_done: $.data.status, wo_parts_total: $.data.parts_total_cents }
            - call: "GET /parts/${part_a}"
              payload: {}
              as: PropertyManager
              captures: { pa_onhand: $.data.quantity_on_hand, pa_resv: $.data.reserved_quantity }
          assert:
            - "WorkOrder.${wo_id}: status == COMPLETED (link 0)"
            - "WorkOrderPart.${wop_a}.status == CONSUMED and WorkOrderPart.${wop_b}.status == CONSUMED (link 1)"
            - "Part.${part_a}: quantity_on_hand == 3 (debited at reserve, unchanged at consume) and reserved_quantity == 0 (link 2)"
            - "WorkOrder.${wo_id}.parts_total_cents == 350 (3*100 + 1*50 over CONSUMED lines) (link 3)"

  # ---------------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_chargeback_bill
        grounds:
          - validations[priority=6]
          - validations[priority=20]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CHARGEBACK_LINES_REQUIRED]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): a BILL attempted on a DISPUTED
          chargeback violates both the state precondition (priority 6) and the
          missing-line_items fiscal rule (priority 20); ERR_INVALID_STATE wins.
        test_recipe:
          setup:
            - "Chargeback in DISPUTED status (billed for 10000, then disputed by the resident)"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Prio Property" }
