          All three constants must be read from the rule and applied in the pinned
          order. ISSUANCE_ALLOWANCE_RATE 0.02 is charged on provisional par
          196,000,000 (not on the final par), giving 3,920,000 and an unrounded
          199,920,000; DENOMINATION_CENTS 500,000 then rounds UP to exactly
