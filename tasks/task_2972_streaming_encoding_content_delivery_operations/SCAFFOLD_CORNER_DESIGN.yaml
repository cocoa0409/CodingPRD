              as: ContentOps
              captures: { a_id: $.data.id }
            - call: "POST /mezzanine-assets/${a_id}/qc-runs"
              payload: {}
              as: QcAnalyst
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver1: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1200 }, { label: "720p", height_px: 720, bitrate_kbps: 2500 }], expected_title_version: "${t_ver1}" }
              as: EncodingEngineer
              captures: { l_one: $.data.id }
            - call: "POST /encoding-ladders/${l_one}/validate"
              payload: {}
              as: EncodingEngineer
            - call: "POST /encoding-ladders/${l_one}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "POST /drm-packages"
              payload: { title_id: "${t_id}", ladder_id: "${l_one}", drm_systems: ["WIDEVINE"], license_server_url: "https://lic.novapic.example/wv" }
              as: DrmOperator
              captures: { pk_id: $.data.id }
            - call: "POST /drm-packages/${pk_id}/package"
              payload: {}
              as: DrmOperator
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
              captures: { t_ver2: $.data.version }
            - call: "POST /encoding-ladders"
              payload: { title_id: "${t_id}", codec_family: "H264", rungs: [{ label: "480p", height_px: 480, bitrate_kbps: 1500 }, { label: "720p", height_px: 720, bitrate_kbps: 3000 }], expected_title_version: "${t_ver2}" }
              as: EncodingEngineer
              captures: { l_two: $.data.id }
            - call: "POST /encoding-ladders/${l_two}/validate"
              payload: {}
              as: EncodingEngineer
          trigger:
            - call: "POST /encoding-ladders/${l_two}/lock"
              payload: {}
              as: EncodingEngineer
            - call: "GET /encoding-ladders/${l_one}"
              payload: {}
              as: EncodingEngineer
            - call: "GET /drm-packages/${pk_id}"
              payload: {}
              as: DrmOperator
            - call: "GET /titles/${t_id}"
              payload: {}
              as: ContentOps
          assert:
            - "lock response body: state == LOCKED and id == ${l_two}"
            - "first read after the lock: EncodingLadder.${l_one}.state == SUPERSEDED and superseded_by_ladder_id == ${l_two}"
            - "second read after the lock: DrmPackage.${pk_id}.state == STALE and stale_reason == LADDER_SUPERSEDED"
            - "third read after the lock: Title.${t_id}.packaging_state == STALE and locked_ladder_count == 2"
            - "no availability-sweep and no other write occurred between the lock and the three reads"

      - name: metric_ingest_returns_its_derived_fields_in_the_same_response
        claim_type: immediate
        grounds:
          - consistency_model
          - endpoints.POST_/playback-metrics
          - calculations.playback_quality_index
          - calculations.vendor_health_score
        distinguishing_aspect: "The 201 body of a metric ingest already carries rebuffer_ratio 0.0500, error_rate 0.0100, quality_index 68.50 and breach_flag true, and the vendor read immediately after shows both health variants at 68.50 with breach_window_count 1 — no lag, no recompute call."
        test_recipe:
          setup:
            - "One Title, one ACTIVE MOBILE_HIGH profile at quality_normalization_factor 1.00, and one US-serving vendor at its 100.00 health default."
          setup_api_calls:
            - call: "POST /titles"
              payload: { external_ref: "TTL-METRIC-NOW", title_name: "Metric Now Cut", content_type: "MOVIE", studio_code: "NOVAPIC" }
              as: ContentOps
              captures: { t_id: $.data.id }
            - call: "POST /device-profiles"
              payload: { device_class: "MOBILE_HIGH", max_height_px: 1080, supported_codecs: ["H264"], min_bitrate_kbps: 500, max_bitrate_kbps: 8000, hdcp_required: false, required_drm_system: "NONE", market_share_pct: 40.00, quality_normalization_factor: 1.00 }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /cdn-vendors"
              payload: { vendor_code: "NOWCDN", regions: ["US"], committed_gbps: 60.00, cost_per_gb_usd: 0.0200 }
              as: PlatformAdmin
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /playback-metrics"
              payload: { title_id: "${t_id}", device_profile_id: "${d_id}", vendor_id: "${v_id}", region_code: "US", window_start_at: "2026-07-01T00:00:00Z", window_end_at: "2026-07-01T01:00:00Z", play_attempts: 200, rebuffer_events: 10, startup_ms_p95: 3000, error_count: 2 }
              as: DeliveryEngineer
              captures: { m_id: $.data.id }
            - call: "GET /cdn-vendors/${v_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /playback-metrics/${m_id}"
              payload: {}
              as: DeliveryEngineer
          assert:
            - "ingest response: HTTP status == 201 and rebuffer_ratio == 0.0500 and error_rate == 0.0100"
            - "ingest response: quality_index == 68.50 and breach_flag == true"
            - "vendor read: health_score_rolling == 68.50 and health_score_contract == 68.50"
            - "vendor read: breach_window_count == 1 and state == ACTIVE (68.50 is above the 50.00 degrade threshold)"
            - "metric re-read: quality_index == 68.50 and breach_flag == true (the stored row equals the response body)"
