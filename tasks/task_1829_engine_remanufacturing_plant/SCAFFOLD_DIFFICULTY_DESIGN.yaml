              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/components"
              payload: { part_type: "CRANKSHAFT", interchange_group: "GRP-UNKNOWN" }
              as: ShopTechnician
              captures: { cmp: $.data.id }
            - call: "POST /components/${cmp}/inspect"
              payload: { reuse_grade: "REUSE_OK", quarantine: true }
              as: QualityInspector
              captures: { cmp_status: $.data.status }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-CRANK-7", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
          trigger:
            - call: "POST /work-orders/${w1}/consume"
              payload: { component_id: "${cmp}" }
              as: ShopTechnician
              captures: { err: $.data.error_id }
            - call: "GET /components/${cmp}"
              as: PlantAdmin
              captures: { cmp_after: $.data.status }
          assert:
            - "captured cmp_status == QUARANTINED (setup)"
            - "captured err == ERR_COMPONENT_QUARANTINED (safety priority 11 beats referential priority 23)"
            - "captured err != ERR_INTERCHANGE_INCOMPATIBLE"
            - "captured cmp_after == QUARANTINED (rejection is side-effect free)"

  # =================================================================
  # Rule 6 — boundary_precision_check
  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: deposit_refund_day30_vs_day31_boundary
        grounds:
          - calculations.deposit_refund_calculation
          - validations[priority=16]
        distinguishing_aspect: |
          Metric: whole days outstanding on a CoreDeposit, reached via the grade
          endpoint. The bracket boundary is INCLUSIVE: exactly 30 days refunds
          100% (200000), while 31 days drops to 80% (160000) on an identical
          deposit — a one-day step changes the refund by 40000.
        test_recipe:
          setup:
            - "Distributor D-X bought engines E1 and E2 at 2026-08-01T00:00:00Z; deposits DEP1 and DEP2 (200000 each) HELD"
            - "Linked core returns R1 (against DEP1) and R2 (against DEP2) received"
            - "Logical clock advanced to 2026-08-31 for R1's grading (exactly 30 days) and 2026-09-01 for R2's (31 days)"
