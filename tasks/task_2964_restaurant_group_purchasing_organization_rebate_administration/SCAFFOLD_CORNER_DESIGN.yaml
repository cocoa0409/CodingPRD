              as: DistributorFeed
              as_user_id: "${dist_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /purchase-lines"
              payload: { purchase_batch_id: "${b1_id}", member_id: "${m1_id}", distributor_sku: "MF-55300", vendor_item_description: "Shoestring fries 6ct", normalized_item_key_reported: "POTATO-FRY-CS6", cases_shipped: 20, invoice_unit_cost_cents: 8300, distributor_base_cost_cents: 8000, invoice_date: "2026-06-08" }
              as: DistributorFeed
