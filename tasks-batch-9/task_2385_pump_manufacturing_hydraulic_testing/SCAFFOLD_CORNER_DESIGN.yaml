scaffold_corner_design:

  # =====================================================================
  # entities
  # =====================================================================
  - section: entities
    instances:
      - name: create_foundry_returns_all_declared_fields
        claim_type: creation
        grounds:
          - entities.Foundry
          - endpoints["POST /foundries"]
          - response_envelope
        distinguishing_aspect: |
          The only creation claim on an entity whose whole field set is input-or-defaulted: every one of
          Foundry's six declared fields plus the four common fields must appear in the 201 envelope, with
          status defaulted to ACTIVE and suspension_reason to null, so no field is silently dropped.
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at its startup default."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "response_type == object and meta.api_request_id and meta.api_request_timestamp are both present"
            - "Foundry.${f1_id}.foundry_code == FDY-NORTH and Foundry.${f1_id}.name == North Iron Works"
            - "Foundry.${f1_id}.approved_alloys == [CI_GG25, DUPLEX_S31803]"
            - "Foundry.${f1_id}.concurrent_pour_capacity == 2"
            - "Foundry.${f1_id}.status == ACTIVE and Foundry.${f1_id}.suspension_reason == null"
            - "Foundry.${f1_id}.version == 1 and id, created_at and updated_at are all non-null"
      - name: get_pump_model_returns_stored_hydraulic_definition
        claim_type: retrieval
        grounds:
          - entities.PumpModel
          - endpoints["GET /pump-models/{id}"]
        distinguishing_aspect: |
          Read-back of the fourteen input hydraulic parameters of PumpModel HSC-14 must be byte-identical
          to the create payload, and the four computed warranty counters must read 0 with status
          ORDERABLE.
        test_recipe:
          setup:
            - "PumpModel HSC-14 created and never mutated."
          setup_api_calls:
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
          trigger:
            - call: "GET /pump-models/${m1_id}"
              payload: {}
              as: TestEngineer
          assert:
            - "HTTP status is 200"
            - "PumpModel.${m1_id}.model_code == HSC-14 and generation == 2 and interchange_group == IG-HSC-14"
            - "PumpModel.${m1_id}.shutoff_head_m == 92.0 and bep_flow_m3h == 300.0 and bep_head_m == 72.0"
            - "PumpModel.${m1_id}.bep_efficiency_pct == 82.0 and npshr_at_bep_m == 4.20 and rated_speed_rpm == 2950"
            - "PumpModel.${m1_id}.rotor_mass_kg == 68.0 and balance_grade == G6_3 and max_flow_m3h == 380.0"
            - "PumpModel.${m1_id}.status == ORDERABLE and superseded_by_model_id == null"
            - "PumpModel.${m1_id}.warranty_defect_count == 0 and application_error_count == 0 and no_defect_count == 0"
      - name: list_foundries_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints["GET /foundries"]
          - response_envelope
        distinguishing_aspect: |
          Three Foundry rows with limit 2 must expose total_count 3 and has_more true on the first page
          and has_more false on the second, proving total_count counts the whole filtered set and not the
          page.
        test_recipe:
          setup:
            - "Three Foundry rows exist: FDY-NORTH, FDY-SOUTH and FDY-EAST, all ACTIVE."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-SOUTH", name: "Southern Castings", approved_alloys: ["CI_GG25"], concurrent_pour_capacity: 1 }
              as: PlatformAdmin
              captures: { f2_id: $.data.id }
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-EAST", name: "Eastern Foundry", approved_alloys: ["CN7M"], concurrent_pour_capacity: 3 }
              as: PlatformAdmin
          trigger:
            - call: "GET /foundries"
              payload: { limit: 2, offset: 0 }
              as: ProductionPlanner
            - call: "GET /foundries"
              payload: { limit: 2, offset: 2 }
              as: ProductionPlanner
            - call: "GET /foundries"
              payload: { status: "SUSPENDED" }
              as: ProductionPlanner
          assert:
            - "the first call returns response_type == array with exactly 2 elements, total_count == 3, has_more == true, limit == 2 and offset == 0"
            - "the second call returns exactly 1 element, total_count == 3, has_more == false, limit == 2 and offset == 2"
            - "the third call returns 0 elements with total_count == 0 and has_more == false"
      - name: get_selection_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_NOT_FOUND]
          - response_envelope
        distinguishing_aspect: |
          A syntactically valid UUID that addresses no Selection row must return exactly 404 ERR_NOT_FOUND
          in the error envelope, not 400 and not an empty 200 body.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock; no Selection row exists."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /selections/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "response_type == error and ${err_id} == ERR_NOT_FOUND"
            - "data.message is a non-empty string and meta.api_request_id is present"
      - name: create_pump_model_missing_required_bep_flow_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.PumpModel.fields.bep_flow_m3h
        distinguishing_aspect: |
          bep_flow_m3h has source input and no default, so omitting it must yield 400 ERR_INVALID_REQUEST
          and create no PumpModel row at all.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
          assert:
            - "HTTP status is 400 with error_id ERR_INVALID_REQUEST"
            - "GET /pump-models returns total_count == 0"
      - name: create_pattern_asset_defaults_counters_and_status_to_qualified
        claim_type: defaults
        grounds:
          - entities.PatternAsset.fields.status
          - entities.PatternAsset.fields.wear_index
          - entities.PatternAsset.fields.refurb_cycles
          - state_machines.PatternAsset
        distinguishing_aspect: |
          PatternAsset declares four computed counters and a status with declared defaults; a create that
          supplies only the four input fields must land on wear_index 0, pours_since_refurb 0,
          defect_pours_since_refurb 0, refurb_cycles 0 and the QUALIFIED initial state.
        test_recipe:
          setup:
            - "Foundry FDY-NORTH ACTIVE and PumpModel HSC-14 ORDERABLE exist; no CastingLot has ever been poured."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "PatternAsset.${p1_id}.status == QUALIFIED"
            - "PatternAsset.${p1_id}.pours_since_refurb == 0 and defect_pours_since_refurb == 0 and wear_index == 0"
            - "PatternAsset.${p1_id}.refurb_cycles == 0 and version == 1"
            - "PatternAsset.${p1_id}.wear_threshold == 20"
      - name: build_order_allowable_unbalance_computed_at_assembly_from_model_grade
        claim_type: computed_fields
        grounds:
          - calculations.balance_allowance
          - entities.BuildOrder.fields.allowable_unbalance_g_mm
          - endpoints["POST /build-orders/{id}/assembly"]
        distinguishing_aspect: |
          allowable_unbalance_g_mm is null on a PLANNED BuildOrder and is derived only at assembly from
          BALANCE_GRADE_G[G6_3] 6.3, ISO1940_COEFF 9549, rotor_mass_kg 68.0 and rated_speed_rpm 2950,
          giving exactly 1386.71 g mm - it is never taken from the request body.
        test_recipe:
          setup:
            - "APPROVED Selection on APP-1001 against PumpModel HSC-14 (G6_3, 68.0 kg, 2950 rpm)."
            - "CastingLot H-9001 ACCEPTED with 4 pieces; BuildOrder SN-0001 PLANNED with allowable_unbalance_g_mm null."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-CI-P11", casing_material: "CI_GG25", impeller_material: "CI_GG25", seal_type: "SINGLE_CARTRIDGE", flush_plan: "API_PLAN_11", service_class: "CLEAN", max_solids_pct: 0.0, max_viscosity_cst: 50.0, max_chloride_ppm: 200.0, max_temp_c: 120.0, min_running_clearance_mm: 0.30 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /duty-applications"
              payload: { application_code: "APP-1001", customer_name: "Delta Refining", duty_flow_m3h: 265.0, duty_head_m: 74.0, npsha_available_m: 5.00, specific_gravity: 1.00, viscosity_cst: 1.2, solids_pct: 0.0, chloride_ppm: 150.0, process_temp_c: 60.0, min_efficiency_pct: 74.0, test_grade: "GRADE_1B", witness_required: true, service_class_required: "CLEAN" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
            - call: "POST /selections"
              payload: { duty_application_id: "${d1_id}", pump_model_id: "${m1_id}", material_seal_config_id: "${c1_id}", expected_duty_application_version: "${d1_ver}" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { s1_id: $.data.id }
            - call: "POST /selections/${s1_id}/propose"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-101"
            - call: "POST /selections/${s1_id}/approve"
              payload: {}
              as: HydraulicApprover
              as_user_id: "appr-201"
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/inspect"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-lots/${l1_id}/accept"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /build-orders"
              payload: { selection_id: "${s1_id}", casting_lot_id: "${l1_id}", serial_number: "SN-0001" }
              as: ProductionPlanner
              captures: { b1_id: $.data.id }
          trigger:
            - call: "POST /build-orders/${b1_id}/assembly"
              payload: { running_clearance_mm: 0.35, residual_unbalance_g_mm: 900.00, seal_flush_plan_installed: "API_PLAN_11" }
              as: ProductionPlanner
          assert:
            - "HTTP status is 200"
            - "BuildOrder.${b1_id}.allowable_unbalance_g_mm == 1386.71"
            - "BuildOrder.${b1_id}.status == ASSEMBLED and rework_cycles == 0"
            - "BuildOrder.${b1_id}.running_clearance_mm == 0.35 and residual_unbalance_g_mm == 900.00"
            - "BuildOrder.${b1_id}.seal_flush_plan_installed == API_PLAN_11"
      - name: duty_application_create_with_client_supplied_id_extra_field_rejected
        claim_type: system_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - entities.DutyApplication.fields.status
        distinguishing_aspect: |
          id, created_at, updated_at and version are system-sourced and absent from the endpoint input
          list, so a body that carries id must be refused with 400 ERR_INVALID_REQUEST rather than
          honoured or ignored.
        test_recipe:
          setup:
            - "Empty database apart from the pinned clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /duty-applications"
              payload: { id: "11111111-1111-1111-1111-111111111111", application_code: "APP-1001", customer_name: "Delta Refining", duty_flow_m3h: 265.0, duty_head_m: 74.0, npsha_available_m: 5.00, specific_gravity: 1.00, viscosity_cst: 1.2, solids_pct: 0.0, chloride_ppm: 150.0, process_temp_c: 60.0, min_efficiency_pct: 74.0, test_grade: "GRADE_1B", witness_required: true, service_class_required: "CLEAN" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
          assert:
            - "HTTP status is 400 with error_id ERR_INVALID_REQUEST"
            - "GET /duty-applications returns total_count == 0"
      - name: create_material_seal_config_invalid_enum_flush_plan_rejected
        claim_type: type_constraints
        grounds:
          - entities.MaterialSealConfig.fields.flush_plan
          - validations[priority=3]
        distinguishing_aspect: |
          flush_plan is constrained to the five API 682 members; API_PLAN_99 is outside that set and must
          produce 400 ERR_INVALID_REQUEST, while the identical body with API_PLAN_11 is accepted.
        test_recipe:
          setup:
            - "PumpModel HSC-14 exists; no MaterialSealConfig row exists yet."
          setup_api_calls:
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
          trigger:
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-BAD", casing_material: "CI_GG25", impeller_material: "CI_GG25", seal_type: "SINGLE_CARTRIDGE", flush_plan: "API_PLAN_99", service_class: "CLEAN", max_solids_pct: 0.0, max_viscosity_cst: 50.0, max_chloride_ppm: 200.0, max_temp_c: 120.0, min_running_clearance_mm: 0.30 }
              as: PlatformAdmin
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-CI-P11", casing_material: "CI_GG25", impeller_material: "CI_GG25", seal_type: "SINGLE_CARTRIDGE", flush_plan: "API_PLAN_11", service_class: "CLEAN", max_solids_pct: 0.0, max_viscosity_cst: 50.0, max_chloride_ppm: 200.0, max_temp_c: 120.0, min_running_clearance_mm: 0.30 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
          assert:
            - "the first call returns 400 with error_id ERR_INVALID_REQUEST"
            - "the second call returns 201 and MaterialSealConfig.${c1_id}.flush_plan == API_PLAN_11"
            - "GET /material-seal-configs returns total_count == 1"
      - name: test_point_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.TestPoint
          - endpoints["GET /test-points/{id}"]
          - endpoints["GET /test-points"]
        distinguishing_aspect: |
          TestPoint is the only entity declared with common_fields false: its read must expose id and
          created_at but no version and no updated_at, and §1.5 declares no PUT, PATCH or DELETE for it,
          so a recorded measurement can never be edited.
        test_recipe:
          setup:
            - "A TestRun is OPEN on an ASSEMBLED BuildOrder and carries exactly one recorded TestPoint."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
              as: PlatformAdmin
              captures: { f1_id: $.data.id }
            - call: "POST /pump-models"
              payload: { model_code: "HSC-14", generation: 2, interchange_group: "IG-HSC-14", max_impeller_diameter_mm: 355.0, min_impeller_diameter_mm: 300.0, shutoff_head_m: 92.0, bep_flow_m3h: 300.0, bep_head_m: 72.0, bep_efficiency_pct: 82.0, npshr_at_bep_m: 4.20, rated_speed_rpm: 2950, max_flow_m3h: 380.0, rotor_mass_kg: 68.0, balance_grade: "G6_3" }
              as: PlatformAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /pattern-assets"
              payload: { pump_model_id: "${m1_id}", foundry_id: "${f1_id}", pattern_code: "PAT-HSC14-A", wear_threshold: 20 }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /material-seal-configs"
              payload: { pump_model_id: "${m1_id}", config_code: "MSC-CI-P11", casing_material: "CI_GG25", impeller_material: "CI_GG25", seal_type: "SINGLE_CARTRIDGE", flush_plan: "API_PLAN_11", service_class: "CLEAN", max_solids_pct: 0.0, max_viscosity_cst: 50.0, max_chloride_ppm: 200.0, max_temp_c: 120.0, min_running_clearance_mm: 0.30 }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /duty-applications"
              payload: { application_code: "APP-1001", customer_name: "Delta Refining", duty_flow_m3h: 265.0, duty_head_m: 74.0, npsha_available_m: 5.00, specific_gravity: 1.00, viscosity_cst: 1.2, solids_pct: 0.0, chloride_ppm: 150.0, process_temp_c: 60.0, min_efficiency_pct: 74.0, test_grade: "GRADE_1B", witness_required: true, service_class_required: "CLEAN" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { d1_id: $.data.id, d1_ver: $.data.version }
            - call: "POST /selections"
              payload: { duty_application_id: "${d1_id}", pump_model_id: "${m1_id}", material_seal_config_id: "${c1_id}", expected_duty_application_version: "${d1_ver}" }
              as: ApplicationEngineer
              as_user_id: "eng-101"
              captures: { s1_id: $.data.id }
            - call: "POST /selections/${s1_id}/propose"
              payload: {}
              as: ApplicationEngineer
              as_user_id: "eng-101"
            - call: "POST /selections/${s1_id}/approve"
              payload: {}
              as: HydraulicApprover
              as_user_id: "appr-201"
            - call: "POST /casting-lots"
              payload: { pattern_asset_id: "${p1_id}", foundry_id: "${f1_id}", heat_number: "H-9001", alloy_code: "CI_GG25", qty_poured: 4, pour_window_start: "2026-08-05T00:00:00Z", pour_window_end: "2026-08-10T00:00:00Z" }
              as: FoundryPartner
              as_user_id: "${f1_id}"
              captures: { l1_id: $.data.id }
            - call: "POST /casting-lots/${l1_id}/inspect"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /casting-lots/${l1_id}/accept"
              payload: {}
              as: QualityInspector
              as_user_id: "qi-301"
            - call: "POST /build-orders"
              payload: { selection_id: "${s1_id}", casting_lot_id: "${l1_id}", serial_number: "SN-0001" }
              as: ProductionPlanner
              captures: { b1_id: $.data.id }
            - call: "POST /build-orders/${b1_id}/assembly"
              payload: { running_clearance_mm: 0.35, residual_unbalance_g_mm: 900.00, seal_flush_plan_installed: "API_PLAN_11" }
              as: ProductionPlanner
            - call: "POST /test-runs"
              payload: { build_order_id: "${b1_id}", test_speed_rpm: 2950, correction_basis: "RATED_SPEED_CORRECTED", test_grade: "GRADE_1B", witness_required: true }
