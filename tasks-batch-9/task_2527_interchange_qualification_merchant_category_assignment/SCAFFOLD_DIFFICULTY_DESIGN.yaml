  - rule_id: transitive_cascade
    instances:
      - name: cascade_audit_sustain_to_merchant_to_enrollment_to_capacity_to_waitlist_promotion
        grounds:
          - state_machines.MerchantCategoryAudit.FIELDWORK_to_FINDINGS_SUSTAINED
          - state_machines.Merchant.UNDER_REVIEW_to_MISREPRESENTED
          - state_machines.IncentiveEnrollment.ENROLLED_to_TERMINATED_INELIGIBLE
          - state_machines.IncentiveProgram.CLOSED_FULL_to_OPEN
          - state_machines.IncentiveEnrollment.WAITLISTED_to_ENROLLED
          - calculations.incentive_capacity_ledger_invariant
          - calculations.misrepresentation_penalty
        distinguishing_aspect: |
          Depth-4 chain fired by a single POST /merchant-category-audits/{id}/sustain-findings:
          hop 1 rewrites Merchant.assigned_mcc to 7995 and moves it to MISREPRESENTED, hop 2
          terminates merchant A's enrollment as TERMINATED_INELIGIBLE, hop 3 credits 96000000 cents
          back to the program pool and flips CLOSED_FULL -> OPEN, hop 4 promotes the head-of-line
          WAITLISTED enrollment of merchant B to ENROLLED and re-debits 20000000. Its trigger and
          its terminal entity are both different from the finalize-driven cascade instance.
        test_recipe:
          setup:
            - "Clock at 2026-09-03T00:00:00Z; one platform, one US/USD acquirer."
            - "MCC 5411 (no documentation) and MCC 7995 (high risk) defined."
            - "Incentive program with total_capacity_cents 100000000, min_commitment_cents 5000000, reopen_threshold_cents 5000000 and eligible_mcc_codes [\"5411\"]."
            - "Merchant A ENROLLED for 96000000, leaving uncommitted_capacity_cents 4000000 and the program CLOSED_FULL."
            - "Merchant B WAITLISTED for 20000000 with no capacity debit."
            - "A MerchantCategoryAudit on merchant A in status FIELDWORK, auditor CA-1; merchant A has no finalized transaction volume, so lifetime_net_assessed_cents is 0."
          setup_api_calls:
