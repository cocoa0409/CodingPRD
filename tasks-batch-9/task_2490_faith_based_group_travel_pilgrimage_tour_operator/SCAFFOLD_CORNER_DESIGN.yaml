              captures: { dep_id: $.data.id, dep_v_old: $.data.version }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
          trigger:
            - call: "POST /group-leader-agreements"
              payload: { departure_id: "${dep_id}", leader_name: "Fr. Alonso Reyes", leader_user_id: "u-leader-alonso", free_travel_threshold: 6, commission_mode: "CASH_COMMISSION", commission_rate_cents_per_pax: 6000, accrual_basis: "RECRUITED", expected_departure_version: "${dep_v_old}" }
              as: ProgramManager
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_DEPARTURE_VERSION"
            - "Departure.${dep_id}.status == OPEN_FOR_SALE"

      - name: one_past_due_installment_stays_below_the_default_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - endpoints."POST /departures/{departureId}/payment-sweep"
          - calculations.payment_plan_schedule.constants.PLAN_DEFAULT_PAST_DUE_COUNT
        distinguishing_aspect: "At past_due_count 1 the sweep marks the installment but stops there: the plan is still ACTIVE, the traveler is not IN_DEFAULT and stays CONFIRMED, while sweep_run_count records that the sweep did run."
        test_recipe:
          setup:
            - "Holy Land departure OPEN_FOR_SALE with one CONFIRMED traveler, invoice 577168, 50000 paid."
            - "A MONTHLY_3 plan whose first installment falls due 2026-08-15."
            - "Clock advanced to 2026-08-16, so exactly one installment is overdue."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler A", date_of_birth: "1975-01-10", room_type_requested: "DOUBLE" }
              as: ProgramManager
              captures: { pil_id: $.data.id }
            - call: "POST /pilgrims/${pil_id}/payments"
              payload: { amount_cents: 50000, method: "PARISH_TRANSFER" }
              as: FinanceController
            - call: "POST /pilgrims/${pil_id}/confirm"
              payload: {}
              as: ProgramManager
            - call: "GET /pilgrims/${pil_id}"
              payload: {}
              as: FinanceController
              captures: { pil_v: $.data.version }
            - call: "POST /pilgrims/${pil_id}/payment-plans"
              payload: { plan_type: "MONTHLY_3", first_due_date: "2026-08-15", expected_pilgrim_version: "${pil_v}" }
              as: FinanceController
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-16T00:00:00Z" }
              as: FinanceController
          trigger:
            - call: "POST /departures/${dep_id}/payment-sweep"
              payload: {}
              as: FinanceController
          assert:
            - "response.status == 200"
            - "PaymentPlan.${plan_id}.past_due_count == 1"
            - "PaymentPlan.${plan_id}.status == ACTIVE"
            - "PaymentPlan.${plan_id}.installments[0].status == PAST_DUE"
            - "PaymentPlan.${plan_id}.installments[1].status == SCHEDULED"
            - "Pilgrim.${pil_id}.booking_status == CONFIRMED"
            - "Departure.${dep_id}.sweep_run_count == 1"
            - "Departure.${dep_id}.last_sweep_at == 2026-08-16T00:00:00Z"

      - name: advisory_posture_change_propagates_down_four_levels
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / advisory_publish_four_hop_cascade
          rationale: "The end-to-end four-hop chain from advisory to travelers, services, land lines and agreements is asserted by the named §1.8 instance."

      - name: sweep_cascade_is_order_sensitive
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / payment_sweep_default_three_hop_cascade
          rationale: "The plan-then-payment_status-then-booking_status ordering and the tier re-quote it forces are asserted by the named §1.8 instance."

      - name: both_tier_variants_produce_their_own_result
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / departure_tier_provisional_vs_final_divergence
          rationale: "Both variants over one roster and the reconciliation delta at the switch are asserted by the named §1.8 instance."

  - section: consistency_model
    instances:
      - name: confirm_response_already_carries_the_repriced_invoice
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints."POST /pilgrims/{pilgrimId}/confirm"
        distinguishing_aspect: "No second read is needed: the confirm response itself already shows price_locked_cents 587000 and invoice_total_cents 577168, and the departure read taken in the same test shows the roster count that the confirm produced."
        test_recipe:
          setup:
            - "Holy Land departure OPEN_FOR_SALE with one DEPOSITED traveler who has paid the 50000 deposit."
          setup_api_calls:
            - call: "POST /programs"
              payload:
                name: "Holy Land Pilgrimage"
                destination_country: "IL"
                faith_tradition: "CATHOLIC"
                duration_days: 10
                price_tiers:
                  - { tier_code: "T1", min_pax: 1, max_pax: 9, per_pax_price_cents: 587000, single_supplement_cents: 98000, deposit_cents: 50000 }
                cancellation_grid:
                  - { min_days_before: 60, penalty_bp: 3500 }
                  - { min_days_before: 0, penalty_bp: 10000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
            - call: "POST /departures"
              payload: { program_id: "${prog_id}", departure_date: "2026-11-01", return_date: "2026-11-11", min_pax: 1, max_pax: 40, deposit_due_date: "2026-08-15", final_payment_due_date: "2026-10-15", mobility_accessible_coach: true }
              as: ProgramManager
              captures: { dep_id: $.data.id }
            - call: "POST /departures/${dep_id}/open-sales"
              payload: {}
              as: ProgramManager
            - call: "POST /pilgrims"
              payload: { departure_id: "${dep_id}", full_name: "Traveler A", date_of_birth: "1975-01-10", room_type_requested: "DOUBLE" }
              as: ProgramManager
              captures: { pil_id: $.data.id }
            - call: "POST /pilgrims/${pil_id}/payments"
              payload: { amount_cents: 50000, method: "PARISH_TRANSFER" }
              as: FinanceController
          trigger:
            - call: "POST /pilgrims/${pil_id}/confirm"
              payload: {}
              as: ProgramManager
          assert:
            - "response.status == 200"
            - "response.data.booking_status == CONFIRMED"
            - "response.data.price_locked_cents == 587000"
            - "response.data.invoice_total_cents == 577168"
            - "response.data.cash_applied_cents == 50000"
            - "Departure.${dep_id}.paying_pax_count == 1"
            - "Departure.${dep_id}.provisional_tier_code == T1"
