            - "captured o_credit == 100000 and captured o_grand == 572000 (net 600000 + fee 72000 - credit 100000; fee band 12% because total_list 1000000 < 5000000)"
            - "captured bal_1 == 700000"
            - "captured o_fee_cancel == 0 (cancel from SUBMITTED carries no restocking fee)"
            - "captured bal_2 == 800000 == bal_0 (apply + cancel conserves credit cents exactly)"

      - name: staging_reserve_receive_release_roundtrip
        grounds:
          - calculations.staging_capacity_utilization
          - state_machines.StagingReservation
          - state_machines.OrderLine.ACKNOWLEDGED_to_RECEIVED
        distinguishing_aspect: |
          Conserved quantity: staging units (physical capacity). reserve(5) then
          receive(5) leaves the occupancy sum unchanged (RESERVED and OCCUPIED both
          count), and release returns it to zero — proven by a probe reservation of
          the full capacity succeeding afterwards. A different conserved quantity
          than credit money.
        test_recipe:
          setup:
            - "Dealership capacity 10; order acknowledged, line qty 10"
          setup_api_calls:
            - call: "POST /api/dealerships"
              payload: { name: "DLR", staging_capacity_units: 10, standard_labor_rate_cents_per_hour: 10000 }
              as: DealerAdmin
              captures: { d_id: $.data.id }
            - call: "POST /api/customers"
              payload: { dealership_id: "${d_id}", name: "Acme Corp", external_ref: "ACME-1" }
              as: AccountExecutive
              captures: { c_id: $.data.id }
            - call: "POST /api/pricing-contracts"
              payload: { customer_id: "${c_id}", contract_type: "STATE", pricing_tiers: [ { category: "SEATING", min_qty: 1, discount_pct: 40 } ], default_discount_pct: 30, effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: AccountExecutive
              as_user_id: "ae-1"
              captures: { k_id: $.data.id }
            - call: "POST /api/pricing-contracts/${k_id}/activate"
              payload: {}
              as: ContractsOfficer
              as_user_id: "co-1"
            - call: "POST /api/space-plans"
              payload: { customer_id: "${c_id}", name: "HQ Floor 3" }
              as: Designer
              captures: { p_id: $.data.id }
            - call: "POST /api/typicals"
              payload: { space_plan_id: "${p_id}", code: "WS-A", quantity: 10, target_budget_cents_per_instance: 500000 }
              as: Designer
            - call: "POST /api/space-plans/${p_id}/submit"
              payload: {}
              as: Designer
            - call: "POST /api/space-plans/${p_id}/approve"
              payload: {}
              as: ClientApprover
            - call: "POST /api/product-series"
              payload: { dealership_id: "${d_id}", manufacturer: "STEELCASE", category: "SEATING", series_code: "SC-ANS", base_list_price_cents: 100000, base_lead_time_days: 30, option_catalog: [] }
              as: DealerAdmin
              captures: { s_id: $.data.id }
            - call: "POST /api/project-orders"
              payload: { customer_id: "${c_id}", contract_id: "${k_id}", space_plan_id: "${p_id}" }
              as: AccountExecutive
              captures: { o_id: $.data.id }
            - call: "POST /api/order-lines"
              payload: { order_id: "${o_id}", series_id: "${s_id}", quantity: 10, selected_options: [] }
              as: AccountExecutive
              captures: { l_id: $.data.id }
            - call: "POST /api/project-orders/${o_id}/submit"
              payload: {}
              as: AccountExecutive
            - call: "POST /api/project-orders/${o_id}/acknowledge"
              payload: {}
              as: ManufacturerRep
          trigger:
            - call: "POST /api/staging-reservations"
              payload: { order_line_id: "${l_id}", units: 5, start_date: "2026-08-10", end_date: "2026-08-12" }
              as: ProjectManager
              captures: { r1_id: $.data.id }
            - call: "POST /api/staging-reservations/${r1_id}/receive"
              payload: { received_units: 5, condition: "GOOD" }
              as: WarehouseLead
              captures: { r1_status: $.data.status }
            - call: "GET /api/order-lines/${l_id}"
              payload: {}
              as: WarehouseLead
              captures: { l_received: $.data.received_units }
            - call: "POST /api/staging-reservations/${r1_id}/release"
              payload: {}
              as: WarehouseLead
              captures: { r1_released: $.data.status }
            - call: "POST /api/staging-reservations"
              payload: { order_line_id: "${l_id}", units: 10, start_date: "2026-08-11", end_date: "2026-08-11" }
              as: ProjectManager
              captures: { probe_id: $.data.id }
          assert:
            - "captured r1_status == 'OCCUPIED' and captured l_received == 5 (receive moves units RESERVED -> OCCUPIED without changing the occupancy sum)"
            - "captured r1_released == 'RELEASED'"
            - "captured probe_id non-null (10 == capacity fits on 2026-08-11: reserve+receive+release conserved the pool; occupancy returned to 0)"
