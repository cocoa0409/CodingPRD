  # Table 7 (RBAC). role_model is segregation_of_duties, so the claim types drawn from the guide
  # are the two per-role bullets (exclusive operations are denied to every other role; shared
  # operations work for all) plus the segregation-of-duties row - "same user cannot do step A and
  # step B (if X-User-ID tracked)". This API tracks X-User-ID three ways: opaque RPM ids whose
  # history is compared across steps (validations 16 and 17), and two entity-backed roles whose
  # id must equal the resource they act for (validation 6).
  - section: rbac
    instances:
      - name: corner_facilitator_cannot_lodge_a_decree_returns_4XX
        claim_type: exclusive_operations_denied_to_other_roles
        grounds:
          - roles.AllocationFacilitator
          - roles.SettlementCounsel
          - roles.PRPRepresentative
          - roles.Contractor
          - roles.CommunityMember
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Five exclusive operations are attempted by the wrong role on one prepared site, and each returns ERR_UNAUTHORIZED at priority 2 - ahead of the state and referential rules that would also have refused them - while the same actors' shared reads still succeed."
        test_recipe:
          setup:
            - "Site LISTED with two PARTICIPATING parties and one NEGOTIATING RD_RA_CONSENT_DECREE. No allocation round exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites"
              payload: { name: "Pellham Junction Wood Treating", epa_region: 4, hrs_score: 49.30 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/list-on-npl"
              payload: { listing_reference: "FR-2027-PJW-0201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Pellham Junction Wood Treating Co", party_type: "OWNER_OPERATOR", viability_score: 76 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_a: $.data.id }
            - call: "POST /sites/${site_id}/prps"
              payload: { legal_name: "Junction Tie & Timber", party_type: "GENERATOR", viability_score: 52 }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
              captures: { prp_b: $.data.id }
            - call: "POST /prps/${prp_a}/notice"
              payload: { notice_reference: "GNL-2027-8201" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp_b}/notice"
              payload: { notice_reference: "GNL-2027-8202" }
              as: RemedialProjectManager
              as_user_id: "rpm-001"
            - call: "POST /prps/${prp_a}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp_a}"
            - call: "POST /prps/${prp_b}/response"
              payload: { election: "PARTICIPATE" }
              as: PRPRepresentative
              as_user_id: "${prp_b}"
            - call: "POST /sites/${site_id}/consent-decrees"
              payload: { scope_type: "RD_RA_CONSENT_DECREE", scope_summary: "RD/RA for the former treating yard", party_prp_ids: ["${prp_a}", "${prp_b}"], oversight_cost_cap_cents: 100000000, stipulated_penalty_per_day_cents: 150000, performance_deadline: "2029-06-30" }
              as: SettlementCounsel
              as_user_id: "sc-001"
              captures: { decree_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { site_v: $.data.version }
          trigger:
            - call: "POST /consent-decrees/${decree_id}/lodging"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
              captures: { err_1: $.data.error_id }
            - call: "POST /sites/${site_id}/allocation-rounds"
              payload: { weight_volume_bp: 5000, weight_toxicity_bp: 3000, weight_ownership_bp: 2000, expected_site_version: "${site_v}" }
              as: SettlementCounsel
              as_user_id: "sc-001"
              captures: { err_2: $.data.error_id }
            - call: "POST /sites"
              payload: { name: "Community Nominated Site", epa_region: 4, hrs_score: 41.00 }
              as: CommunityMember
              as_user_id: "cm-001"
              captures: { err_3: $.data.error_id }
            - call: "POST /prps/${prp_b}/notice"
              payload: { notice_reference: "GNL-2027-8299" }
              as: PRPRepresentative
              as_user_id: "${prp_b}"
              captures: { err_4: $.data.error_id }
            - call: "POST /sites/${site_id}/waste-in-records"
              payload: { prp_id: "${prp_a}", volume_tons: 100, toxicity_class: "III", evidence_grade: "C", disposal_year: 1979 }
              as: Contractor
              as_user_id: "no-such-contract"
              captures: { err_5: $.data.error_id }
            - call: "GET /consent-decrees/${decree_id}"
              payload: {}
              as: AllocationFacilitator
              as_user_id: "af-001"
          assert:
            - "the facilitator's lodging returns HTTP 403 with $.data.error_id == ERR_UNAUTHORIZED - not ERR_NO_ADOPTED_ALLOCATION (priority 14), which would also have refused it"
            - "the counsel's allocation-round create returns HTTP 403 with ERR_UNAUTHORIZED even though expected_site_version is current"
            - "the community member's site create returns HTTP 403 with ERR_UNAUTHORIZED"
            - "the party representative's notice returns HTTP 403 with ERR_UNAUTHORIZED - not ERR_INVALID_STATE_TRANSITION (priority 10) for the already-noticed party"
            - "the contractor's waste-in create returns HTTP 403 with ERR_UNAUTHORIZED - decided at priority 2, before the identity binding at priority 6 could complain about the unknown contract id"
            - "the facilitator's GET /consent-decrees/${decree_id} returns HTTP 200: every role keeps its shared read access, so the denials above are operation-scoped and not actor-scoped"
            - "no state moved: ConsentDecree.${decree_id}.legal_status == NEGOTIATING with lodged_at == null; PotentiallyResponsibleParty.${prp_b}.status == PARTICIPATING; GET /sites/${site_id}/allocation-rounds reports total_count 0 and GET /sites/${site_id}/waste-in-records reports total_count 0"

      - name: corner_party_representative_cannot_ballot_for_another_party_returns_4XX
        claim_type: segregation_of_duties
        grounds:
          - roles.PRPRepresentative
          - validations[priority=6]
          - errors[ERR_ACTOR_IDENTITY_MISMATCH]
          - endpoints[POST /prps/{id}/response]
          - endpoints[POST /allocation-rounds/{id}/ballots]
        distinguishing_aspect: "The entity-backed identity is checked two different ways on the same role: on /prps/{id}/response X-User-ID must equal the party in the path, and on /allocation-rounds/{id}/ballots it must equal a party holding a share in that round - so a party from a different site is refused at priority 6, before the participation rule at priority 23."
        test_recipe:
          setup:
            - "Site 1 LISTED with two noticed parties; a second site carries an unrelated party used as the impostor identity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
