  - { method: GET, path: "/identity-protection/filter-model-configs/{id}", description: "Read one model config", roles: [SystemAdmin, FraudAnalyst], code: 200, input: [], output: FilterModelConfig, side_effects: [] }
  - { method: POST, path: "/identity-protection/filter-model-configs/{id}/activate", description: "Activate a DRAFT config; retires the previously ACTIVE config", roles: [SystemAdmin], code: 200, input: [], output: FilterModelConfig, side_effects: ["prior ACTIVE config -> RETIRED"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving endpoint, outside api_prefix). Startup default is exactly 2026-09-01T00:00:00Z and never falls back to wall-clock time. Advancing the clock sweeps: dependent conflicts past evidence_window_ends_at auto-resolve (winner by evidence rule) and appointments past end_at complete. Verification cases are NOT swept — they expire only via a third failed attempt, keeping the document-deadline validation reachable.", roles: [SystemAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["conflict auto-resolution sweep", "appointment completion sweep"] }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Taxpayer
    description: "Individual filer; acts only on own resources"
    identity: "entity_backed:Taxpayer"
    exclusive_operations: ["ip-pin-opt-in", "ip-pin-opt-out (self)", "submit evidence for own conflict side", "submit verification documents (self)", "reopen own theft report"]
    shared_operations: ["file own return", "read own taxpayer/return/case/pins/reports/disbursements/holds/claims/appointments", "update own profile (OCC)"]
  - name: TaxPreparer
    description: "Registered return preparer; files on behalf of taxpayers"
    identity: "entity_backed:Preparer"
    exclusive_operations: ["file returns carrying own preparer_id"]
    shared_operations: ["read own preparer record", "read own alerts", "read own filed returns"]
  - name: VerificationAgent
    description: "Identity-proofing operator across online, phone and in-person channels"
    identity: "opaque"
    exclusive_operations: ["request-documents", "verify case", "fail case", "book appointments", "open verification cases"]
    shared_operations: ["read taxpayers/returns/cases/documents/appointments/offices"]
  - name: FraudAnalyst
    description: "Fraud filter reviewer and scheme investigator"
    identity: "opaque"
    exclusive_operations: ["confirm/reject theft reports", "release-refund", "confirm-fraud", "mark-false-positive", "confirm/clear scheme alerts", "resolve dependent conflicts", "submit evidence on behalf of a filer"]
    shared_operations: ["read taxpayers/returns/holds/cases/conflicts/alerts/preparers/advocate-cases/configs"]
  - name: TaxpayerAdvocate
    description: "Taxpayer Advocate Service handler for hardship cases"
    identity: "opaque"
    exclusive_operations: ["open/expedite/resolve advocate cases", "manual pin reissue", "reopen theft reports"]
    shared_operations: ["read taxpayers/returns/holds/cases/conflicts/reports/pins/disbursements"]
  - name: SystemAdmin
