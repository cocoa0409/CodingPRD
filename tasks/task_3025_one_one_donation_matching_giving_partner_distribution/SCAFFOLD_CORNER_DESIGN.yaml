  # ===========================================================================
  - section: rbac
    instances:

      - name: a_non_auditor_cannot_create_an_impact_season
        claim_type: violation_to_error
        grounds:
          - roles.ImpactAuditor.exclusive_operations
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Season creation is exclusive to the auditor, so the identical body posted by any other declared role is refused with 403 and the season is never created."
        test_recipe:
          setup:
            - "Logical clock at the default; empty database."
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "POST /impact-program/impact-seasons"
              payload: { season_code: "2026-Q4", starts_at: "2026-12-01T00:00:00Z", ends_at: "2027-03-31T00:00:00Z", freezes_at: "2027-02-15T00:00:00Z" }
              as: AllocationPlanner
              captures: { err_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_ROLE"
            - "GET /impact-program/impact-seasons returns 0 rows"
            - "the identical body posted as ImpactAuditor returns 201"

