            - call: "POST /evidence-items/${ev_touch}/preserve"
              payload: { preserved_copy_uri: "s3://evidence/2923por/ecm-4101-a.json", evidence_hash: "8d8d9e9e0f0f1a1a2b2b3c3c4d4d5e5e" }
              as: Dispatcher
