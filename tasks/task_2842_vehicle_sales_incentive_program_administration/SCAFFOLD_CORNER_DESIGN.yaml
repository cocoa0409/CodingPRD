          - validations[priority=9]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: "Two repricings authored from the SAME read: the first succeeds and the second is refused, which protects previous_per_unit_amount_cents from recording a baseline that no longer exists. The retry then records the FIRST event's new rate as its baseline, so the two events chain 20000 -> 24000 -> 26000 with no gap."
        test_recipe:
