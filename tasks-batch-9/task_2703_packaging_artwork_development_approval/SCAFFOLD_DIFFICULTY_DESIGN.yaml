                language_codes: ["en"]
                required_element_codes: ["NET_CONTENTS", "INGREDIENT_STATEMENT", "ALLERGEN_STATEMENT", "DATE_CODE_ZONE", "BARCODE", "RECYCLING_MARK", "ADDRESS_BLOCK"]
                structural_spec: { component_type: "CARTON", dimensions_mm: { l: 120, w: 60, h: 200 }, substrate_class: "COATED_PAPER", print_process: "OFFSET_LITHO" }
                net_contents_declaration: { metric_value: 340, metric_uom: "g", us_value: 12, us_uom: "oz" }
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { brief_id: "$.data.id" }
            - call: "POST /artwork-assets"
              payload:
                brief_id: "${brief_id}"
