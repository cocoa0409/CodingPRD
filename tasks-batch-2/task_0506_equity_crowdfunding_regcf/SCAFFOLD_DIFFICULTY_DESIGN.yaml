          - entities.Offering.fields.live_at
        distinguishing_aspect: |
          CLOSED-INTERVAL overlap on the Offering resource: an issuer's offering A is LIVE with window
          [2026-02-01, 2026-04-01]; taking offering B live at 2026-03-01 with deadline 2026-05-01 overlaps
          (strict-< on both endpoints) and is rejected with ERR_CAMPAIGN_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Verified issuer; offering A LIVE with live_at 2026-02-01 deadline 2026-04-01."
            - "Offering B QUALIFIED, deadline 2026-05-01; clock advanced to 2026-03-01 before B's go-live."
