              captures: { err: $.data.error_id }
          assert:
            - "both failures hold: ticket QUARANTINED (safety) AND partner pool empty (constraint)"
            - "response is 409 with error_id ERR_TICKET_QUARANTINED (${id}) — priority-7 safety beats priority-9 constraint"
            - "no RoutingAssignment is created for the ticket"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics and
  # DIFFERENT endpoints (fill_pct float threshold vs route-day integer-weight
  # aggregate).
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: dropbox_fill_threshold_85_inclusive
        grounds:
          - calculations.dropbox_fill_posture
          - state_machines.DropBox.FILLING_to_FULL_PENDING_COLLECTION
        distinguishing_aspect: |
          Metric fill_pct on POST /dropboxes/{id}/fill-readings: the FULL
          threshold is an inclusive >= — 84.99 leaves the box FILLING while
          exactly 85.0 flips it to FULL_PENDING_COLLECTION.
        test_recipe:
          setup:
            - "Zone Z; drop box D installed (fill_pct 0, posture OK)"
          setup_api_calls:
            - call: "POST /service-zones"
              payload: { name: "Zone BP1" }
              as: ZoneOperator
              captures: { z_id: $.data.id }
            - call: "POST /dropboxes"
              payload: { zone_id: "${id}", label: "Box-17", location: "Maple St" }
              as: ZoneOperator
              captures: { d_id: $.data.id, d_posture0: $.data.posture }
          trigger:
            - call: "POST /dropboxes/${id}/fill-readings"
              payload: { fill_pct: 84.99, recorded_at: "2026-05-02T00:00:00Z" }
              as: SensorGateway
            - call: "GET /dropboxes/${id}"
              as: ZoneOperator
              captures: { d_posture1: $.data.posture, d_fill1: $.data.fill_pct }
            - call: "POST /dropboxes/${id}/fill-readings"
              payload: { fill_pct: 85.0, recorded_at: "2026-05-02T01:00:00Z" }
              as: SensorGateway
            - call: "GET /dropboxes/${id}"
              as: ZoneOperator
              captures: { d_posture2: $.data.posture, d_fill2: $.data.fill_pct }
          assert:
            - "at install: ${id} == OK"
            - "84.99 -> posture stays FILLING (${id}), fill_pct == 84.99"
            - "exactly 85.0 -> posture FULL_PENDING_COLLECTION (${id}), fill_pct == 85.0 — inclusive boundary"

      - name: route_day_capacity_exact_800_admitted
        grounds:
          - state_machines.PickupRequest.SCHEDULED_to_ROUTED
          - calculations.estimated_pickup_weight
          - errors[ERR_ROUTE_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric est_weight_kg sum on POST /pickup-requests/{id}/route
          (different metric and endpoint from instance 1): aggregate exactly
          800.0 kg is admitted (rule rejects only >), one more 4 kg bag (804.0)
          is rejected.
        test_recipe:
          setup:
            - "Zone Z; resident R (ACTIVE); three pickups PA(120 bags, 480 kg), PB(80 bags, 320 kg), PC(1 bag, 4 kg), non-overlapping windows on 2026-05-10"
          setup_api_calls:
