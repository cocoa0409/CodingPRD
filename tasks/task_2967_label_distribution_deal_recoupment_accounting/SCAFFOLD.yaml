# =============================================================================
# PRD Benchmark Seed Tables — §1.0 through §1.7
# Task 2967 — Label Distribution Deal & Recoupment Accounting
# =============================================================================
scenario: |
  2967. Label Distribution Deal & Recoupment Accounting (independent record label):
  distribution agreement structure across distribution fee, profit share and full
  label services with term and territory, advance payment with recoupment from net
  receipts and cross-collateralization across releases, artist agreements with
  royalty rates, advance recoupment and cost deductions for recording and marketing,
  marketing spend approval and its recoupability status by category, digital service
  provider revenue reporting with per-stream rates by territory and tier, physical
  distribution with manufacturing costs, returns reserves and inventory obligations,
  statement preparation to artists with audit rights and objection periods, catalog
  reversion, termination rights and post-term collection

domain_name: label-distribution-recoupment
api_prefix: "/"          # flat topology: every collection is a root-level peer path

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - optimistic_concurrency
    - rate_threshold_triggers

  entity_topology: flat
  # Eleven peer entities linked by explicit foreign keys; no entity is nested
  # inside another's URL path. DspRevenueLine and the deal/release/agreement
  # chain are reached by FK filters, not by path nesting.

  state_machine_shape: cyclic
  # ArtistStatement runs ISSUED -> OBJECTED -> REVISED -> PREPARED -> ISSUED,
  # ArtistAgreement runs ACTIVE -> AMENDMENT_PENDING -> ACTIVE, DspRevenueReport
  # runs ACCEPTED -> DISPUTED -> SUBMITTED -> ACCEPTED. DistributionDeal adds a
  # branching diamond EXECUTED -> {TERMINATION_NOTICE, EXPIRED} ->
  # POST_TERM_COLLECTION -> CLOSED, and PhysicalRun / ArtistStatement each carry
  # two independent state dimensions.

  relationship_patterns:
    - one_to_many          # DistributionDeal -> Release -> DspRevenueLine / PhysicalRun
    - self_referential     # ArtistAgreement.supersedes_agreement_id -> ArtistAgreement.id
    - cross_aggregate      # ArtistStatement reads DspRevenueLine + PhysicalRun + MarketingSpend

  role_model: segregation_of_duties
  # The opaque operator who prepares a statement may not issue it; the opaque
  # operator who submits a marketing spend may not decide it. Both checks compare
  # X-User-ID against a stored actor id, so one human holding two roles is caught.

  consistency_model: immediate

  difficulty_level: expert_plus
  # Deliberately above the §0.4 Expert band on surface count (11 entities /
  # 59 endpoints / 45 errors / 7 calculations / 32 ordered validations / 9
  # state-machine dimensions across 7 entities) because the scenario spans five
  # coupled sub-ledgers (label advance,
  # artist advance, recording costs, recoupable marketing, returns reserve) that
  # must reconcile against one another. Difficulty is carried by the coupling —
  # every calculation reads at least three entities and every terminal transition
  # cascades three hops or more.

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:
  - name: Distributor
    parent: null
    common_fields: true
    description: "Distribution counterparty (configuration + identity anchor for the DistributionPartner role)."
    fields:
      - name: name
        type: string
        source: input
        description: "Trading name of the distribution company."
        constraints: "1..120 chars, non-blank"
      - name: legal_entity
        type: string
        source: input
        description: "Registered legal entity name used on the agreement."
        constraints: "1..160 chars, non-blank"
      - name: default_returns_reserve_pct
        type: number
        source: input
        description: "Baseline physical returns reserve percentage inherited by PhysicalRun when the run does not override it."
        default: 0.2000
        constraints: "0.0000 <= v <= 0.5000, exactly 4 decimal places"
      - name: active_deal_count
        type: integer
        source: computed
        description: "Count of DistributionDeal rows with distributor_id == this.id and status IN {EXECUTED, TERMINATION_NOTICE, POST_TERM_COLLECTION}."
        default: 0

  - name: Artist
    parent: null
    common_fields: true
    description: "Recording artist; identity anchor for the Artist role."
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Artist legal name as it appears on artist agreements."
        constraints: "1..120 chars, non-blank"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across all Artist rows (case-insensitive)."
        constraints: "RFC-5322 shape, unique case-insensitive"
      - name: lifetime_paid_cents
        type: integer
        source: computed
        description: "Sum of ArtistStatement.net_payable_cents over statements whose artist_agreement_id belongs to this artist AND status == FINALIZED. Cross-entity computed field."
        default: 0
      - name: unrecouped_advance_total_cents
        type: integer
        source: computed
        description: "Sum of ArtistAgreement.unrecouped_artist_advance_cents over this artist's agreements with status IN {ACTIVE, AMENDMENT_PENDING, POST_TERM}."
        default: 0

  - name: DistributionDeal
    parent: null
    common_fields: true
    description: "The distribution agreement: structure, term, territory, advance and the label-side recoupment ledger."
    fields:
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the counterparty on this agreement."
      - name: deal_type
        type: enum
        source: input
        description: "Agreement structure that selects the distributor-share branch of calculations.deal_net_receipts."
        constraints: "one of {DISTRIBUTION_FEE, PROFIT_SHARE, LABEL_SERVICES}"
      - name: distribution_fee_pct
        type: number
        source: input
        description: "Distributor fee as a fraction of gross receipts. Required when deal_type == DISTRIBUTION_FEE, must be null otherwise."
        default: null
        constraints: "0.0100 <= v <= 0.3000, exactly 4 decimal places"
      - name: profit_share_label_pct
        type: number
        source: input
        description: "Label's share of the profit base. Required when deal_type == PROFIT_SHARE, must be null otherwise."
        default: null
        constraints: "0.3000 <= v <= 0.9000, exactly 4 decimal places"
      - name: services_fee_pct
        type: number
        source: input
        description: "Percentage component of the full-label-services fee. Required when deal_type == LABEL_SERVICES, must be null otherwise."
        default: null
        constraints: "0.0100 <= v <= 0.2500, exactly 4 decimal places"
      - name: services_monthly_fee_cents
        type: integer
        source: input
        description: "Fixed monthly component of the full-label-services fee. Required when deal_type == LABEL_SERVICES, must be null otherwise."
        default: null
        constraints: "v >= 0"
      - name: term_start_date
        type: string
        source: input
        description: "First day of the agreement term (ISO 8601 calendar date, UTC)."
        constraints: "YYYY-MM-DD"
      - name: term_end_date
        type: string
        source: input
        description: "Last day of the agreement term, inclusive (ISO 8601 calendar date, UTC)."
        constraints: "YYYY-MM-DD, strictly after term_start_date"
      - name: territory_codes
        type: array
        source: input
        description: "Licensed territories; a DspRevenueLine whose territory_code is absent from this list is rejected."
        constraints: "non-empty array of distinct ISO 3166-1 alpha-2 codes"
      - name: cross_collateralized
        type: boolean
        source: input
        description: "When true the advance recoups against one deal-level pool spanning every Release; when false each Release recoups only against its own advance_share_cents."
      - name: advance_amount_cents
        type: integer
        source: input
        description: "Advance paid by the distributor to the label on execution; recoupable from net receipts."
        constraints: "v >= 0"
      - name: marketing_budget_cents
        type: integer
        source: input
        description: "Ceiling on the sum of approved-or-settled MarketingSpend across the deal's releases."
        constraints: "v >= 0"
      - name: objection_window_days
        type: integer
        source: input
        description: "Days after ArtistStatement.issued_at during which the artist may file an objection."
        default: 30
        constraints: "1 <= v <= 180"
      - name: post_term_collection_days
        type: integer
        source: input
        description: "Days after term end (or termination effective date) during which revenue may still be collected before catalog reversion."
        default: 180
        constraints: "0 <= v <= 1095"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 DistributionDeal."
        default: DRAFT
        constraints: "one of {DRAFT, EXECUTED, TERMINATION_NOTICE, EXPIRED, POST_TERM_COLLECTION, CLOSED}"
      - name: advance_payment_reference
        type: string
        source: system
        description: "Wire reference captured on execute; null while DRAFT."
        default: null
      - name: executed_at
        type: datetime
        source: system
        description: "Logical-clock instant at which the deal moved DRAFT -> EXECUTED (ISO 8601 UTC, three fractional digits)."
        default: null
      - name: termination_effective_date
        type: string
        source: system
        description: "Calendar date on which termination took effect; set only on the TERMINATION_NOTICE branch, null on the EXPIRED branch."
        default: null
      - name: post_term_collection_end_date
        type: string
        source: computed
        description: "TERMINATION_NOTICE branch: termination_effective_date + post_term_collection_days. EXPIRED branch: term_end_date + post_term_collection_days. Null before either branch is taken."
        default: null
      - name: advance_recouped_cents
        type: integer
        source: computed
        description: "Cumulative advance recouped by calculations.advance_recoupment_waterfall across accepted DspRevenueReport rows; decremented when an accepted report is disputed."
        default: 0
      - name: unrecouped_advance_cents
        type: integer
        source: computed
        description: "advance_amount_cents - advance_recouped_cents. Conserved-quantity partner of advance_recouped_cents."
        default: 0
      - name: net_receipts_to_date_cents
        type: integer
        source: computed
        description: "Cumulative sum of DspRevenueReport.net_receipts_cents over reports with status == ACCEPTED plus PhysicalRun.physical_net_receipts_cents over runs with status IN {SHIPPED, RECONCILED} on this deal's releases."
        default: 0
      - name: post_recoupment_net_receipts_cents
        type: integer
        source: computed
        description: "Portion of net_receipts_to_date_cents that arrived after unrecouped_advance_cents reached 0."
        default: 0
      - name: recoupment_status
        type: enum
        source: computed
        description: "RECOUPED when unrecouped_advance_cents == 0, otherwise UNRECOUPED. Gates ArtistAgreement.active_royalty_rate_pct."
        default: UNRECOUPED
        constraints: "one of {UNRECOUPED, RECOUPED}"
      - name: marketing_committed_cents
        type: integer
        source: computed
        description: "Sum over MarketingSpend rows on this deal's releases of settled_amount_cents when status == SETTLED else amount_cents when status == APPROVED; rows in {DRAFT, SUBMITTED, REJECTED, REVISION_REQUESTED, VOIDED} are excluded."
        default: 0

  - name: Release
    parent: null
    common_fields: true
    description: "A record release delivered under a DistributionDeal; the unit of cross-collateralization and catalog reversion."
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> DistributionDeal.id; the agreement this release is delivered under."
      - name: primary_artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the featured artist whose agreement governs royalties."
      - name: upc
        type: string
        source: input
        description: "Universal Product Code; unique across all Release rows."
        constraints: "exactly 12..14 ASCII digits, unique"
      - name: title
        type: string
        source: input
        description: "Release title."
        constraints: "1..200 chars, non-blank"
      - name: planned_release_date
        type: string
        source: input
        description: "Scheduled street date (ISO 8601 calendar date, UTC)."
        constraints: "YYYY-MM-DD, within [deal.term_start_date, deal.term_end_date]"
      - name: actual_release_date
        type: string
        source: system
        description: "Street date recorded on the PLANNED -> RELEASED transition; null while PLANNED."
        default: null
      - name: formats
        type: array
        source: input
        description: "Delivery formats; a PhysicalRun may only be created when this list contains at least one of {VINYL, CD, CASSETTE}."
        constraints: "non-empty array of distinct values from {DIGITAL, VINYL, CD, CASSETTE}"
      - name: advance_share_cents
        type: integer
        source: input
        description: "This release's slice of the deal advance. Governs recoupment directly when deal.cross_collateralized == false and drives the SILOED what-if projection when it is true."
        default: 0
        constraints: "v >= 0; sum over the deal's releases with status != REVERTED must be <= deal.advance_amount_cents"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 Release."
        default: PLANNED
        constraints: "one of {PLANNED, RELEASED, REVERSION_PENDING, REVERTED}"
      - name: reversion_eligible_date
        type: string
        source: computed
        description: "Copied from deal.post_term_collection_end_date when the release enters REVERSION_PENDING; null otherwise."
        default: null
      - name: net_receipts_to_date_cents
        type: integer
        source: computed
        description: "Sum of DspRevenueLine.net_receipts_cents for this release over reports with status == ACCEPTED, plus PhysicalRun.physical_net_receipts_cents for this release over runs with status IN {SHIPPED, RECONCILED}."
        default: 0
      - name: release_advance_recouped_cents
        type: integer
        source: computed
        description: "Advance attributed to this release by calculations.advance_recoupment_waterfall."
        default: 0
      - name: unrecouped_advance_share_cents
        type: integer
        source: computed
        description: "max(0, advance_share_cents - release_advance_recouped_cents)."
        default: 0
      - name: recoupable_marketing_applied_cents
        type: integer
        source: computed
        description: "Cumulative marketing recoupment charged to the artist by FINALIZED statements on this release; restored when an objection is upheld."
        default: 0

  - name: ArtistAgreement
    parent: null
    common_fields: true
    description: "Royalty agreement between the label and one artist for one release; carries the artist-side recoupment ledger."
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the contracting artist."
      - name: release_id
        type: string
        source: input
        description: "FK -> Release.id; the release this agreement governs."
      - name: royalty_rate_pct
        type: number
        source: input
        description: "Base artist royalty rate applied while the release's deal has recoupment_status == UNRECOUPED."
        constraints: "0.0100 <= v <= 0.5000, exactly 4 decimal places"
      - name: escalated_royalty_rate_pct
        type: number
        source: input
        description: "Royalty rate applied once the release's deal reaches recoupment_status == RECOUPED."
        constraints: "royalty_rate_pct <= v <= 0.5000, exactly 4 decimal places"
      - name: advance_amount_cents
        type: integer
        source: input
        description: "Artist advance, recouped first in the statement deduction waterfall."
        constraints: "v >= 0"
      - name: recording_costs_cents
        type: integer
        source: input
        description: "Total recording costs booked against this release."
        constraints: "v >= 0"
      - name: recording_recoupable_pct
        type: number
        source: input
        description: "Fraction of recording_costs_cents that is recoupable from artist royalties."
        constraints: "0.0000 <= v <= 1.0000, exactly 4 decimal places"
      - name: marketing_recoup_share_pct
        type: number
        source: input
        description: "Artist's share of the recoupable marketing pool computed by calculations.recoupable_marketing_cap."
        constraints: "0.0000 <= v <= 1.0000, exactly 4 decimal places"
      - name: supersedes_agreement_id
        type: string
        source: input
        description: "FK -> ArtistAgreement.id; the agreement this one replaces on activation. Null for an original agreement."
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 ArtistAgreement."
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, AMENDMENT_PENDING, SUPERSEDED, POST_TERM, TERMINATED}"
      - name: active_royalty_rate_pct
        type: number
        source: computed
        description: "escalated_royalty_rate_pct when the release's deal has recoupment_status == RECOUPED, else royalty_rate_pct. Recomputed by the accept/dispute cascade."
        default: null
      - name: proposed_royalty_rate_pct
        type: number
        source: system
        description: "Pending amendment rate while status == AMENDMENT_PENDING; cleared on resolution."
        default: null
      - name: proposed_advance_amount_cents
        type: integer
        source: system
        description: "Pending amendment advance while status == AMENDMENT_PENDING; cleared on resolution."
        default: null
      - name: unrecouped_artist_advance_cents
        type: integer
        source: computed
        description: "Initialised to advance_amount_cents on creation; debited by ArtistStatement.advance_applied_cents when a statement is FINALIZED and restored when an objection is upheld."
        default: 0
      - name: unrecouped_recording_cents
        type: integer
        source: computed
        description: "Initialised to round_half_up(recording_costs_cents * recording_recoupable_pct) on creation; debited by ArtistStatement.recording_applied_cents on finalization."
        default: 0
      - name: post_term_collection_end_date
        type: string
        source: system
        description: "Copied from the release's deal when the agreement cascades ACTIVE -> POST_TERM; after this date no statement may be prepared."
        default: null

  - name: MarketingSpend
    parent: null
    common_fields: true
    description: "A marketing commitment on one release; its recoupability by category decides how much of it the artist absorbs."
    fields:
      - name: release_id
        type: string
        source: input
        description: "FK -> Release.id; the release being promoted."
      - name: category
        type: enum
        source: input
        description: "Spend category; drives the default recoupability."
        constraints: "one of {DIGITAL_ADS, RADIO_PROMO, VIDEO_PRODUCTION, TOUR_SUPPORT, PUBLICITY}"
      - name: amount_cents
        type: integer
        source: input
        description: "Requested (and, once approved, approved) spend amount."
        constraints: "v > 0"
      - name: vendor
        type: string
        source: input
        description: "Vendor or agency the spend is committed to."
        constraints: "1..120 chars, non-blank"
      - name: recoupability
        type: enum
        source: computed
        description: "Derived from category at creation — DIGITAL_ADS and RADIO_PROMO => FULLY_RECOUPABLE, VIDEO_PRODUCTION and TOUR_SUPPORT => HALF_RECOUPABLE, PUBLICITY => NON_RECOUPABLE — and replaced by recoupability_override when the decide call supplies one."
        constraints: "one of {FULLY_RECOUPABLE, HALF_RECOUPABLE, NON_RECOUPABLE}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 MarketingSpend."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, APPROVED, REJECTED, REVISION_REQUESTED, SETTLED, VOIDED}"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the LabelAdmin operator who submitted the spend; compared against the decider for segregation of duties."
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BusinessAffairs operator who decided the spend."
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: "Logical-clock instant of the SUBMITTED -> APPROVED transition (ISO 8601 UTC, three fractional digits); decides which accounting period the spend falls into."
        default: null
      - name: settled_amount_cents
        type: integer
        source: system
        description: "Invoiced actual recorded on APPROVED -> SETTLED; the FINAL statement basis reads this field, the PROVISIONAL basis reads amount_cents."
        default: null
      - name: revision_note
        type: string
        source: system
        description: "Reviewer note recorded on SUBMITTED -> REVISION_REQUESTED."
        default: null

  - name: StreamRateCard
    parent: null
    common_fields: false
    description: "Immutable per-stream rate for one (dsp_code, territory_code, tier) triple over a half-open effective window."
    fields:
      - name: dsp_code
        type: string
        source: input
        description: "Digital service provider code, e.g. SPOTLIGHT."
        constraints: "2..24 chars, uppercase A-Z and underscore only"
      - name: territory_code
        type: string
        source: input
        description: "Territory this rate applies to."
        constraints: "ISO 3166-1 alpha-2"
      - name: tier
        type: enum
        source: input
        description: "Subscription tier the rate applies to."
        constraints: "one of {PREMIUM, AD_SUPPORTED, FREE_TRIAL}"
      - name: rate_micros_per_stream
        type: integer
        source: input
        description: "Rate in micros per stream; 10000 micros == 1 cent."
        constraints: "v > 0"
      - name: effective_from
        type: string
        source: input
        description: "Inclusive first day of the effective window (ISO 8601 calendar date, UTC)."
        constraints: "YYYY-MM-DD"
      - name: effective_to
        type: string
        source: input
        description: "Exclusive last day of the effective window; null means open-ended."
        default: null
        constraints: "YYYY-MM-DD strictly after effective_from, or null"

  - name: DspRevenueReport
    parent: null
    common_fields: true
    description: "One DSP revenue statement for one deal and one accounting period, submitted by the distribution partner."
    fields:
      - name: deal_id
        type: string
        source: input
        description: "FK -> DistributionDeal.id; the agreement the receipts are collected under."
      - name: dsp_code
        type: string
        source: input
        description: "Reporting digital service provider; must match StreamRateCard.dsp_code for rate resolution."
        constraints: "2..24 chars, uppercase A-Z and underscore only"
      - name: period_start
        type: string
        source: input
        description: "Inclusive first day of the reported period (ISO 8601 calendar date, UTC)."
        constraints: "YYYY-MM-DD"
      - name: period_end
        type: string
        source: input
        description: "Inclusive last day of the reported period; rate resolution is evaluated at this date."
        constraints: "YYYY-MM-DD, >= period_start"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state; see §1.2 DspRevenueReport."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, ACCEPTED, DISPUTED}"
      - name: submitted_by_user_id
        type: string
        source: system
        description: "X-User-ID of the DistributionPartner who submitted; equals the deal's distributor_id."
        default: null
      - name: gross_receipts_cents
        type: integer
        source: computed
        description: "Sum of DspRevenueLine.resolved_revenue_cents over this report's lines, each line already rounded to whole cents."
        default: 0
      - name: distributor_share_cents
        type: integer
        source: computed
        description: "Distributor's cut for this report per calculations.deal_net_receipts."
        default: 0
      - name: net_receipts_cents
        type: integer
        source: computed
        description: "gross_receipts_cents - distributor_share_cents."
        default: 0
      - name: advance_applied_cents
        type: integer
        source: computed
        description: "Amount of net_receipts_cents this report applied against the deal advance on acceptance; reversed on dispute."
        default: 0
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant of SUBMITTED -> ACCEPTED (ISO 8601 UTC, three fractional digits)."
        default: null
      - name: dispute_reason
        type: string
        source: system
        description: "Reason recorded on the transition into DISPUTED."
        default: null

  - name: DspRevenueLine
    parent: null
    common_fields: false
    description: "One (release, territory, tier) stream-count row inside a DspRevenueReport; immutable once created."
    fields:
      - name: report_id
        type: string
        source: input
        description: "FK -> DspRevenueReport.id; the report this line belongs to."
      - name: release_id
        type: string
        source: input
        description: "FK -> Release.id; the release the streams were attributed to."
      - name: territory_code
        type: string
        source: input
        description: "Territory of consumption; must be present in the deal's territory_codes."
        constraints: "ISO 3166-1 alpha-2"
      - name: tier
        type: enum
        source: input
        description: "Subscription tier of consumption."
        constraints: "one of {PREMIUM, AD_SUPPORTED, FREE_TRIAL}"
      - name: stream_count
        type: integer
        source: input
        description: "Number of streams reported for this triple."
        constraints: "v >= 0"
      - name: applied_rate_micros_per_stream
        type: integer
        source: computed
        description: "Rate resolved by calculations.dsp_line_revenue at report submit time; null while the report is DRAFT."
        default: null
      - name: resolved_revenue_cents
        type: integer
        source: computed
        description: "round_half_up(stream_count * applied_rate_micros_per_stream / 10000) for this line alone."
        default: null
      - name: net_receipts_cents
        type: integer
        source: computed
        description: "This line's share of net receipts after the distributor share is allocated across lines by largest-remainder; null until the report is ACCEPTED."
        default: null

  - name: PhysicalRun
    parent: null
    common_fields: true
    description: "A manufacturing and shipping run of physical product with its returns reserve; carries two independent state dimensions."
    fields:
      - name: release_id
        type: string
        source: input
        description: "FK -> Release.id; the release being manufactured."
      - name: distributor_id
        type: string
        source: input
        description: "FK -> Distributor.id; the partner shipping the run and reporting returns."
      - name: units_planned
        type: integer
        source: input
        description: "Planned manufacturing quantity."
        constraints: "v > 0"
      - name: unit_manufacturing_cost_cents
        type: integer
        source: input
        description: "Planned per-unit manufacturing cost."
        constraints: "v > 0"
      - name: window_start
        type: string
        source: input
        description: "Inclusive first day of the manufacturing window (ISO 8601 calendar date, UTC)."
        constraints: "YYYY-MM-DD"
      - name: window_end
        type: string
        source: input
        description: "Inclusive last day of the manufacturing window."
        constraints: "YYYY-MM-DD, >= window_start"
      - name: returns_reserve_pct
        type: number
        source: input
        description: "Baseline reserve percentage for this run; when omitted it is copied from the distributor's default_returns_reserve_pct."
        default: null
        constraints: "0.0000 <= v <= 0.5000, exactly 4 decimal places"
      - name: status
        type: enum
        source: system
        description: "Fulfilment dimension; see §1.2 PhysicalRun (status)."
        default: PLANNED
        constraints: "one of {PLANNED, MANUFACTURED, SHIPPED, RECONCILED}"
      - name: reserve_status
        type: enum
        source: system
        description: "Reserve dimension, independent of status; see §1.2 PhysicalRun (reserve_status)."
        default: HELD
        constraints: "one of {HELD, PARTIALLY_LIQUIDATED, LIQUIDATED}"
      - name: units_manufactured
        type: integer
        source: system
        description: "Actual units produced, recorded on PLANNED -> MANUFACTURED."
        default: 0
      - name: units_shipped
        type: integer
        source: system
        description: "Units shipped to retail, recorded on MANUFACTURED -> SHIPPED."
        default: 0
      - name: units_returned
        type: integer
        source: system
        description: "Cumulative units returned, recorded while status == SHIPPED."
        default: 0
      - name: wholesale_unit_price_cents
        type: integer
        source: system
        description: "Wholesale price per unit recorded on MANUFACTURED -> SHIPPED."
        default: null
      - name: returns_rate
        type: number
        source: computed
        description: "round_half_up(units_returned / units_shipped, 4 decimal places); 0.0000 while units_shipped == 0."
        default: 0.0000
      - name: effective_reserve_pct
        type: number
        source: computed
        description: "Reserve percentage after the returns-rate escalation tiers of calculations.returns_reserve_obligation."
        default: null
      - name: reserve_initial_cents
        type: integer
        source: computed
        description: "round_half_up(units_shipped * wholesale_unit_price_cents * effective_reserve_pct) as of the latest returns recording; conserved total of reserve_held_cents + reserve_liquidated_cents."
        default: 0
      - name: reserve_held_cents
        type: integer
        source: computed
        description: "Portion of reserve_initial_cents still withheld from artist statements."
        default: 0
      - name: reserve_liquidated_cents
        type: integer
        source: computed
        description: "Portion of reserve_initial_cents released for payment; restored to reserve_held_cents by void-liquidation."
        default: 0
      - name: manufacturing_cost_cents
        type: integer
        source: computed
        description: "units_manufactured * unit_manufacturing_cost_cents recorded at manufacture time."
        default: 0
      - name: physical_net_receipts_cents
        type: integer
        source: computed
        description: "max(0, (units_shipped - units_returned) * wholesale_unit_price_cents - manufacturing_cost_cents)."
        default: 0

  - name: ArtistStatement
    parent: null
    common_fields: true
    description: "A royalty statement to one artist for one period under one agreement; carries an accounting dimension and an audit dimension."
    fields:
      - name: artist_agreement_id
        type: string
        source: input
        description: "FK -> ArtistAgreement.id; the agreement being accounted."
      - name: period_start
        type: string
        source: input
        description: "Inclusive first day of the statement period (ISO 8601 calendar date, UTC)."
        constraints: "YYYY-MM-DD"
      - name: period_end
        type: string
        source: input
        description: "Inclusive last day of the statement period."
        constraints: "YYYY-MM-DD, >= period_start"
      - name: basis_variant
        type: enum
        source: input
        description: "Selects the variant of calculations.artist_statement_net_payable: PROVISIONAL uses approved marketing and the full reserve, FINAL uses settled marketing and the unliquidated reserve only."
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: status
        type: enum
        source: system
        description: "Accounting dimension; see §1.2 ArtistStatement (status)."
        default: DRAFT
        constraints: "one of {DRAFT, PREPARED, ISSUED, OBJECTED, REVISED, FINALIZED, VOIDED}"
      - name: audit_status
        type: enum
        source: system
        description: "Audit dimension, independent of status; see §1.2 ArtistStatement (audit_status)."
        default: NONE
        constraints: "one of {NONE, AUDIT_REQUESTED, AUDIT_COMPLETED, AUDIT_DENIED}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RoyaltyAnalyst who ran the latest prepare; compared against the issuer for segregation of duties."
        default: null
      - name: issued_by_user_id
        type: string
        source: system
        description: "X-User-ID of the BusinessAffairs operator who issued the statement."
        default: null
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock instant of PREPARED -> ISSUED (ISO 8601 UTC, three fractional digits)."
        default: null
      - name: objection_deadline
        type: datetime
        source: computed
        description: "issued_at + deal.objection_window_days, to the millisecond; an objection filed at exactly this instant is accepted."
        default: null
      - name: finalized_at
        type: datetime
        source: system
        description: "Logical-clock instant of the transition into FINALIZED; starts the audit-rights window."
        default: null
      - name: applied_royalty_rate_pct
        type: number
        source: computed
        description: "ArtistAgreement.active_royalty_rate_pct frozen at the moment of the latest prepare."
        default: null
      - name: digital_royalty_base_cents
        type: integer
        source: computed
        description: "Sum of DspRevenueLine.net_receipts_cents for the agreement's release over ACCEPTED reports whose [period_start, period_end] is fully contained in this statement's period."
        default: 0
      - name: physical_royalty_base_cents
        type: integer
        source: computed
        description: "Sum of PhysicalRun.physical_net_receipts_cents for the agreement's release over runs with status IN {SHIPPED, RECONCILED} whose window_end falls inside this statement's period."
        default: 0
      - name: gross_royalty_cents
        type: integer
        source: computed
        description: "round_half_up((digital_royalty_base_cents + physical_royalty_base_cents) * applied_royalty_rate_pct)."
        default: 0
      - name: advance_applied_cents
        type: integer
        source: computed
        description: "First bucket of the deduction waterfall: artist advance recouped by this statement."
        default: 0
      - name: recording_applied_cents
        type: integer
        source: computed
        description: "Second bucket of the deduction waterfall: recoupable recording costs recouped by this statement."
        default: 0
      - name: marketing_applied_cents
        type: integer
        source: computed
        description: "Third bucket of the deduction waterfall: artist's share of the recoupable marketing pool, capped per calculations.recoupable_marketing_cap."
        default: 0
      - name: reserve_withheld_cents
        type: integer
        source: computed
        description: "Artist's share of the returns reserve withheld from this statement; basis depends on basis_variant."
        default: 0
      - name: net_payable_cents
        type: integer
        source: computed
        description: "max(0, gross_royalty_cents - advance_applied_cents - recording_applied_cents - marketing_applied_cents - reserve_withheld_cents)."
        default: 0
      - name: objection_reason_code
        type: enum
        source: system
        description: "Reason supplied when the artist objects; null until an objection is filed."
        default: null
        constraints: "one of {RATE_DISPUTE, MISSING_REVENUE, COST_DISPUTE, RESERVE_DISPUTE}"
      - name: objection_disputed_amount_cents
        type: integer
        source: system
        description: "Amount the artist disputes; must not exceed net_payable_cents + marketing_applied_cents + reserve_withheld_cents."
        default: null
      - name: objection_narrative
        type: string
        source: system
        description: "Free-text objection detail supplied by the artist."
        default: null
      - name: objection_filed_at
        type: datetime
        source: system
        description: "Logical-clock instant the objection was filed (ISO 8601 UTC, three fractional digits)."
        default: null
      - name: objection_resolution
        type: enum
        source: system
        description: "Outcome recorded by BusinessAffairs; null while the objection is open."
        default: null
        constraints: "one of {UPHELD, DENIED}"
      - name: objection_adjustment_cents
        type: integer
        source: system
        description: "Adjustment granted when an objection is upheld; added back to net_payable_cents on the next prepare."
        default: null
      - name: audit_scope_period_start
        type: string
        source: system
        description: "Inclusive first day of the audit scope requested by the artist."
        default: null
      - name: audit_scope_period_end
        type: string
        source: system
        description: "Inclusive last day of the audit scope requested by the artist."
        default: null
      - name: auditor_name
        type: string
        source: system
        description: "Independent auditor nominated by the artist."
        default: null
      - name: audit_findings_adjustment_cents
        type: integer
        source: system
        description: "Signed adjustment produced by the concluded audit; may be negative."
        default: null
      - name: audit_cost_bearer
        type: enum
        source: computed
        description: "LABEL when abs(audit_findings_adjustment_cents) >= round_half_up(net_payable_cents * 0.05), otherwise ARTIST; null until the audit is concluded."
        default: null
        constraints: "one of {LABEL, ARTIST}"
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times this statement has re-entered PREPARED from REVISED."
        default: 0

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:
  - entity: DistributionDeal
    dimension: status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    shape: "branching diamond — EXECUTED forks to TERMINATION_NOTICE or EXPIRED with divergent side-effect sets, both joining at POST_TERM_COLLECTION"
    transitions:
      - from: DRAFT
        to: EXECUTED
        trigger: "POST /distribution-deals/{id}/execute"
        actor: LabelAdmin
        preconditions:
          - "deal.status == DRAFT"
          - "the deal has at least one Release with status IN {PLANNED, RELEASED}"
        side_effects:
          - "sets advance_payment_reference and executed_at from the logical clock"
          - "sets advance_recouped_cents = 0 and unrecouped_advance_cents = advance_amount_cents"
          - "sets recoupment_status = RECOUPED when advance_amount_cents == 0, else UNRECOUPED"
          - "recomputes Distributor.active_deal_count for the deal's distributor"
          - "increments DistributionDeal.version by 1"
      - from: EXECUTED
        to: TERMINATION_NOTICE
        trigger: "POST /distribution-deals/{id}/terminate"
        actor: LabelAdmin
        preconditions:
          - "deal.status == EXECUTED"
        side_effects:
          - "sets termination_effective_date = the logical clock's calendar date and post_term_collection_end_date = termination_effective_date + post_term_collection_days"
          - "CASCADE HOP 1: every Release on this deal with status == RELEASED moves to REVERSION_PENDING and receives reversion_eligible_date = deal.post_term_collection_end_date; every Release with status == PLANNED moves straight to REVERTED (branch-specific: the EXPIRED branch does neither)"
          - "CASCADE HOP 2: caused by hop 1 — every ArtistAgreement whose release_id is one of the releases moved in hop 1 and whose status IN {ACTIVE, AMENDMENT_PENDING} moves to POST_TERM and receives post_term_collection_end_date = deal.post_term_collection_end_date"
          - "CASCADE HOP 3: caused by hop 2 — every ArtistStatement whose artist_agreement_id is one of the agreements moved in hop 2 and whose status IN {DRAFT, PREPARED} moves to VOIDED"
          - "recomputes Distributor.active_deal_count"
          - "increments DistributionDeal.version by 1"
        note: "The FOR-CAUSE branch. Releases stop accruing new marketing immediately."
      - from: EXECUTED
        to: EXPIRED
        trigger: "POST /distribution-deals/{id}/expire"
        actor: LabelAdmin
        preconditions:
          - "deal.status == EXECUTED"
          - "the logical clock's calendar date is strictly after term_end_date, else ERR_TERM_NOT_ENDED"
        side_effects:
          - "sets post_term_collection_end_date = term_end_date + post_term_collection_days; leaves termination_effective_date null"
          - "sets reversion_eligible_date = post_term_collection_end_date on every Release with status IN {PLANNED, RELEASED} but leaves those releases' status untouched (branch-specific: no release moves state on this branch)"
          - "recomputes Distributor.active_deal_count"
          - "increments DistributionDeal.version by 1"
        note: "The NATURAL-EXPIRY branch. Divergent from TERMINATION_NOTICE: no release or agreement changes state here, so statements in flight survive."
      - from: TERMINATION_NOTICE
        to: POST_TERM_COLLECTION
        trigger: "POST /distribution-deals/{id}/enter-post-term-collection"
        actor: LabelAdmin
        preconditions:
          - "deal.status IN {TERMINATION_NOTICE, EXPIRED}"
        side_effects:
          - "freezes the marketing surface: every MarketingSpend on this deal's releases with status IN {DRAFT, SUBMITTED, REVISION_REQUESTED} moves to VOIDED"
          - "increments DistributionDeal.version by 1"
        note: "Join point of the diamond; reachable from either fork."
      - from: EXPIRED
        to: POST_TERM_COLLECTION
        trigger: "POST /distribution-deals/{id}/enter-post-term-collection"
        actor: LabelAdmin
        preconditions:
          - "deal.status IN {TERMINATION_NOTICE, EXPIRED}"
        side_effects:
          - "freezes the marketing surface: every MarketingSpend on this deal's releases with status IN {DRAFT, SUBMITTED, REVISION_REQUESTED} moves to VOIDED"
          - "increments DistributionDeal.version by 1"
      - from: POST_TERM_COLLECTION
        to: CLOSED
        trigger: "POST /distribution-deals/{id}/close"
        actor: LabelAdmin
        preconditions:
          - "deal.status == POST_TERM_COLLECTION"
          - "the logical clock's calendar date is strictly after post_term_collection_end_date, else ERR_POST_TERM_COLLECTION_ACTIVE"
          - "no ArtistStatement on this deal's agreements has status == OBJECTED with objection_resolution == null, else ERR_OPEN_OBJECTIONS_BLOCK_CLOSE"
        side_effects:
          - "CASCADE HOP 1: every Release on this deal with status IN {PLANNED, RELEASED, REVERSION_PENDING} moves to REVERTED — catalog rights revert to the artist"
          - "CASCADE HOP 2: caused by hop 1 — every ArtistAgreement whose release_id is one of the releases moved in hop 1 and whose status IN {ACTIVE, AMENDMENT_PENDING, POST_TERM} moves to TERMINATED"
          - "CASCADE HOP 3: caused by hop 2 — every MarketingSpend on those releases with status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED} moves to VOIDED"
          - "recomputes Distributor.active_deal_count"
          - "increments DistributionDeal.version by 1"

  - entity: Release
    dimension: status
    initial_state: PLANNED
    terminal_states: [REVERTED]
    transitions:
      - from: PLANNED
        to: RELEASED
        trigger: "POST /releases/{id}/release"
        actor: LabelAdmin
        preconditions:
          - "release.status == PLANNED"
          - "the release's deal has status == EXECUTED, else ERR_INVALID_DEAL_STATE"
          - "actual_release_date is within [deal.term_start_date, deal.term_end_date], else ERR_PERIOD_OUTSIDE_TERM"
        side_effects:
          - "sets actual_release_date"
          - "increments Release.version by 1"
      - from: RELEASED
        to: REVERSION_PENDING
        trigger: "system cascade hop 1 of POST /distribution-deals/{id}/terminate"
        actor: system
        preconditions:
          - "the release's deal moved EXECUTED -> TERMINATION_NOTICE in this request"
        side_effects:
          - "sets reversion_eligible_date = deal.post_term_collection_end_date"
          - "triggers cascade hop 2 on this release's ACTIVE / AMENDMENT_PENDING ArtistAgreement rows"
          - "increments Release.version by 1"
      - from: PLANNED
        to: REVERTED
        trigger: "system cascade hop 1 of POST /distribution-deals/{id}/terminate"
        actor: system
        preconditions:
          - "the release's deal moved EXECUTED -> TERMINATION_NOTICE in this request"
          - "release.status == PLANNED (never went to market)"
        side_effects:
          - "triggers cascade hop 2 on this release's ArtistAgreement rows"
          - "increments Release.version by 1"
      - from: REVERSION_PENDING
        to: REVERTED
        trigger: "system cascade hop 1 of POST /distribution-deals/{id}/close"
        actor: system
        preconditions:
          - "the release's deal moved POST_TERM_COLLECTION -> CLOSED in this request"
        side_effects:
          - "triggers cascade hop 2 (agreement TERMINATED) which triggers cascade hop 3 (marketing VOIDED)"
          - "increments Release.version by 1"
      - from: RELEASED
        to: REVERTED
        trigger: "system cascade hop 1 of POST /distribution-deals/{id}/close"
        actor: system
        preconditions:
          - "the release's deal moved POST_TERM_COLLECTION -> CLOSED in this request"
        side_effects:
          - "triggers cascade hop 2 (agreement TERMINATED) which triggers cascade hop 3 (marketing VOIDED)"
          - "increments Release.version by 1"
        note: "Path taken on the EXPIRED fork, where the release never passed through REVERSION_PENDING."

  - entity: ArtistAgreement
    dimension: status
    initial_state: DRAFT
    terminal_states: [SUPERSEDED, TERMINATED]
    shape: "cyclic — ACTIVE -> AMENDMENT_PENDING -> ACTIVE can repeat without bound"
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /artist-agreements/{id}/activate"
        actor: LabelAdmin
        preconditions:
          - "agreement.status == DRAFT"
          - "the agreement's release has status IN {PLANNED, RELEASED}, else ERR_INVALID_RELEASE_STATE"
          - "when supersedes_agreement_id is not null, that agreement has status == ACTIVE and the same release_id, else ERR_INVALID_AGREEMENT_STATE"
        side_effects:
          - "sets unrecouped_artist_advance_cents = advance_amount_cents and unrecouped_recording_cents = round_half_up(recording_costs_cents * recording_recoupable_pct)"
          - "sets active_royalty_rate_pct per calculations.artist_royalty_rate_selection"
          - "when supersedes_agreement_id is not null, moves that agreement ACTIVE -> SUPERSEDED and carries its unrecouped_artist_advance_cents and unrecouped_recording_cents forward onto this agreement (balances are not reset by supersession)"
          - "recomputes Artist.unrecouped_advance_total_cents"
          - "increments ArtistAgreement.version by 1"
      - from: ACTIVE
        to: AMENDMENT_PENDING
        trigger: "POST /artist-agreements/{id}/propose-amendment"
        actor: LabelAdmin
        preconditions:
          - "agreement.status == ACTIVE"
          - "the agreement's release's deal has status IN {EXECUTED, TERMINATION_NOTICE}, else ERR_INVALID_DEAL_STATE"
        side_effects:
          - "stores proposed_royalty_rate_pct and proposed_advance_amount_cents"
          - "increments ArtistAgreement.version by 1"
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /artist-agreements/{id}/resolve-amendment with decision == ACCEPT"
        actor: BusinessAffairs
        preconditions:
          - "agreement.status == AMENDMENT_PENDING"
        side_effects:
          - "copies proposed_royalty_rate_pct into royalty_rate_pct and proposed_advance_amount_cents into advance_amount_cents"
          - "increases unrecouped_artist_advance_cents by (new advance_amount_cents - old advance_amount_cents) floored at 0"
          - "recomputes active_royalty_rate_pct per calculations.artist_royalty_rate_selection"
          - "clears proposed_royalty_rate_pct and proposed_advance_amount_cents to null"
          - "recomputes Artist.unrecouped_advance_total_cents"
          - "increments ArtistAgreement.version by 1"
        note: "Closes the cycle; the agreement may be amended again immediately."
      - from: AMENDMENT_PENDING
        to: ACTIVE
        trigger: "POST /artist-agreements/{id}/resolve-amendment with decision == REJECT"
        actor: BusinessAffairs
        preconditions:
          - "agreement.status == AMENDMENT_PENDING"
        side_effects:
          - "leaves royalty_rate_pct, advance_amount_cents and every ledger balance unchanged"
          - "clears proposed_royalty_rate_pct and proposed_advance_amount_cents to null"
          - "increments ArtistAgreement.version by 1"
        note: "Same target state as ACCEPT with a disjoint side-effect set — the divergence is observable on royalty_rate_pct."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system side effect of POST /artist-agreements/{id}/activate on a successor agreement"
        actor: system
        preconditions:
          - "a successor agreement with supersedes_agreement_id == this.id moved DRAFT -> ACTIVE in this request"
        side_effects:
          - "zeroes unrecouped_artist_advance_cents and unrecouped_recording_cents after carrying them onto the successor"
          - "increments ArtistAgreement.version by 1"
      - from: ACTIVE
        to: POST_TERM
        trigger: "system cascade hop 2 of POST /distribution-deals/{id}/terminate"
        actor: system
        preconditions:
          - "this agreement's release moved to REVERSION_PENDING or REVERTED in cascade hop 1 of the same request"
        side_effects:
          - "sets post_term_collection_end_date = deal.post_term_collection_end_date"
          - "triggers cascade hop 3 on this agreement's DRAFT / PREPARED ArtistStatement rows"
          - "increments ArtistAgreement.version by 1"
      - from: AMENDMENT_PENDING
        to: POST_TERM
        trigger: "system cascade hop 2 of POST /distribution-deals/{id}/terminate"
        actor: system
        preconditions:
          - "this agreement's release moved to REVERSION_PENDING or REVERTED in cascade hop 1 of the same request"
        side_effects:
          - "clears proposed_royalty_rate_pct and proposed_advance_amount_cents to null"
          - "sets post_term_collection_end_date = deal.post_term_collection_end_date"
          - "triggers cascade hop 3 on this agreement's DRAFT / PREPARED ArtistStatement rows"
          - "increments ArtistAgreement.version by 1"
      - from: POST_TERM
        to: TERMINATED
        trigger: "system cascade hop 2 of POST /distribution-deals/{id}/close"
        actor: system
        preconditions:
          - "this agreement's release moved to REVERTED in cascade hop 1 of the same request"
        side_effects:
          - "triggers cascade hop 3 (MarketingSpend VOIDED) on the release"
          - "increments ArtistAgreement.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system cascade hop 2 of POST /distribution-deals/{id}/close"
        actor: system
        preconditions:
          - "this agreement's release moved to REVERTED in cascade hop 1 of the same request"
        side_effects:
          - "triggers cascade hop 3 (MarketingSpend VOIDED) on the release"
          - "increments ArtistAgreement.version by 1"
        note: "Path taken on the EXPIRED fork, where the agreement never passed through POST_TERM."

  - entity: MarketingSpend
    dimension: status
    initial_state: DRAFT
    terminal_states: [REJECTED, SETTLED, VOIDED]
    shape: "branching with a revision cycle — SUBMITTED forks to APPROVED / REJECTED / REVISION_REQUESTED, and REVISION_REQUESTED returns to SUBMITTED"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /marketing-spends/{id}/submit"
        actor: LabelAdmin
        preconditions:
          - "spend.status IN {DRAFT, REVISION_REQUESTED}"
          - "the spend's release has status IN {PLANNED, RELEASED}, else ERR_RELEASE_NOT_PROMOTABLE"
        side_effects:
          - "sets requested_by_user_id = X-User-ID of this request"
          - "applies amount_cents and category overrides when supplied and recomputes recoupability from the resulting category"
          - "increments MarketingSpend.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /marketing-spends/{id}/submit"
        actor: LabelAdmin
        preconditions:
          - "spend.status IN {DRAFT, REVISION_REQUESTED}"
          - "the spend's release has status IN {PLANNED, RELEASED}, else ERR_RELEASE_NOT_PROMOTABLE"
        side_effects:
          - "sets requested_by_user_id = X-User-ID of this request"
          - "applies amount_cents and category overrides when supplied and recomputes recoupability from the resulting category"
          - "clears revision_note to null"
          - "increments MarketingSpend.version by 1"
        note: "Closes the revision cycle; a spend may bounce between SUBMITTED and REVISION_REQUESTED without bound."
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /marketing-spends/{id}/decide with decision == APPROVE"
        actor: BusinessAffairs
        preconditions:
          - "spend.status == SUBMITTED"
          - "X-User-ID != spend.requested_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "the spend's release's deal has status == EXECUTED, else ERR_INVALID_DEAL_STATE"
          - "the spend's release has status IN {PLANNED, RELEASED}, else ERR_RELEASE_NOT_PROMOTABLE"
          - "deal.marketing_committed_cents + amount_cents <= deal.marketing_budget_cents, else ERR_MARKETING_BUDGET_EXCEEDED"
        side_effects:
          - "sets decided_by_user_id and approved_at from the logical clock"
          - "replaces recoupability with recoupability_override when supplied"
          - "recomputes DistributionDeal.marketing_committed_cents"
          - "increments MarketingSpend.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /marketing-spends/{id}/decide with decision == REJECT"
        actor: BusinessAffairs
        preconditions:
          - "spend.status == SUBMITTED"
          - "X-User-ID != spend.requested_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "sets decided_by_user_id"
          - "increments MarketingSpend.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /marketing-spends/{id}/decide with decision == REQUEST_REVISION"
        actor: BusinessAffairs
        preconditions:
          - "spend.status == SUBMITTED"
          - "X-User-ID != spend.requested_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "revision_note is supplied and non-blank"
        side_effects:
          - "sets decided_by_user_id and revision_note"
          - "increments MarketingSpend.version by 1"
      - from: APPROVED
        to: SETTLED
        trigger: "POST /marketing-spends/{id}/settle"
        actor: LabelAdmin
        preconditions:
          - "spend.status == APPROVED"
          - "settled_amount_cents <= amount_cents, else ERR_INVALID_REQUEST"
          - "deal.marketing_committed_cents - amount_cents + settled_amount_cents <= deal.marketing_budget_cents"
        side_effects:
          - "stores settled_amount_cents"
          - "recomputes DistributionDeal.marketing_committed_cents on the settled basis"
          - "increments MarketingSpend.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "system cascade hop 3 of POST /distribution-deals/{id}/close"
        actor: system
        preconditions:
          - "this spend's release moved to REVERTED and its agreement moved to TERMINATED earlier in the same request"
        side_effects:
          - "recomputes DistributionDeal.marketing_committed_cents"
          - "increments MarketingSpend.version by 1"
      - from: SUBMITTED
        to: VOIDED
        trigger: "system side effect of POST /distribution-deals/{id}/enter-post-term-collection or cascade hop 3 of POST /distribution-deals/{id}/close"
        actor: system
        preconditions:
          - "the spend's release's deal entered POST_TERM_COLLECTION or CLOSED in this request"
        side_effects:
          - "increments MarketingSpend.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "system side effect of POST /distribution-deals/{id}/enter-post-term-collection or cascade hop 3 of POST /distribution-deals/{id}/close"
        actor: system
        preconditions:
          - "the spend's release's deal entered POST_TERM_COLLECTION or CLOSED in this request"
        side_effects:
          - "increments MarketingSpend.version by 1"
      - from: REVISION_REQUESTED
        to: VOIDED
        trigger: "system side effect of POST /distribution-deals/{id}/enter-post-term-collection or cascade hop 3 of POST /distribution-deals/{id}/close"
        actor: system
        preconditions:
          - "the spend's release's deal entered POST_TERM_COLLECTION or CLOSED in this request"
        side_effects:
          - "increments MarketingSpend.version by 1"

  - entity: DspRevenueReport
    dimension: status
    initial_state: DRAFT
    terminal_states: []
    shape: "cyclic — ACCEPTED -> DISPUTED -> SUBMITTED -> ACCEPTED can repeat without bound"
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /dsp-revenue-reports/{id}/submit"
        actor: DistributionPartner
        preconditions:
          - "report.status IN {DRAFT, DISPUTED}"
          - "X-User-ID == the report's deal.distributor_id, else ERR_NOT_RESOURCE_OWNER"
          - "the report has at least one DspRevenueLine, else ERR_INVALID_REPORT_STATE"
          - "every line resolves a StreamRateCard per calculations.dsp_line_revenue, else ERR_RATE_CARD_NOT_FOUND"
        side_effects:
          - "runs calculations.dsp_line_revenue: writes applied_rate_micros_per_stream and resolved_revenue_cents on every line, then sets gross_receipts_cents = sum of the per-line rounded values"
          - "runs calculations.deal_net_receipts: writes distributor_share_cents and net_receipts_cents"
          - "sets submitted_by_user_id = X-User-ID"
          - "increments DspRevenueReport.version by 1"
      - from: DISPUTED
        to: SUBMITTED
        trigger: "POST /dsp-revenue-reports/{id}/submit"
        actor: DistributionPartner
        preconditions:
          - "report.status IN {DRAFT, DISPUTED}"
          - "X-User-ID == the report's deal.distributor_id, else ERR_NOT_RESOURCE_OWNER"
          - "the report has at least one DspRevenueLine, else ERR_INVALID_REPORT_STATE"
        side_effects:
          - "re-runs calculations.dsp_line_revenue and calculations.deal_net_receipts against the current lines and rate cards"
          - "clears dispute_reason to null"
          - "increments DspRevenueReport.version by 1"
        note: "Closes the report cycle."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /dsp-revenue-reports/{id}/accept"
        actor: RoyaltyAnalyst
        preconditions:
          - "report.status == SUBMITTED"
          - "expected_deal_version == deal.version, else ERR_STALE_DEAL_VERSION"
          - "the report's deal has status IN {EXECUTED, TERMINATION_NOTICE, POST_TERM_COLLECTION}, else ERR_DEAL_NOT_COLLECTING"
          - "[period_start, period_end] lies inside [deal.term_start_date, deal.post_term_collection_end_date or term_end_date], else ERR_PERIOD_OUTSIDE_TERM"
        side_effects:
          - "sets accepted_at from the logical clock"
          - "CASCADE HOP 1: allocates distributor_share_cents across the report's lines by largest-remainder and writes DspRevenueLine.net_receipts_cents on each"
          - "CASCADE HOP 2: caused by hop 1 — each Release referenced by those lines has net_receipts_to_date_cents increased by the sum of its own lines' net_receipts_cents, and DistributionDeal.net_receipts_to_date_cents increased by report.net_receipts_cents"
          - "CASCADE HOP 3: caused by hop 2 — calculations.advance_recoupment_waterfall consumes the new net receipts and writes report.advance_applied_cents, deal.advance_recouped_cents, deal.unrecouped_advance_cents, deal.post_recoupment_net_receipts_cents and each Release.release_advance_recouped_cents / unrecouped_advance_share_cents"
          - "CASCADE HOP 4: caused by hop 3 — when deal.unrecouped_advance_cents reaches 0 the deal's recoupment_status flips UNRECOUPED -> RECOUPED"
          - "CASCADE HOP 5: caused by hop 4 — every ArtistAgreement with status IN {ACTIVE, AMENDMENT_PENDING, POST_TERM} on any Release of this deal has active_royalty_rate_pct recomputed to escalated_royalty_rate_pct"
          - "increments DspRevenueReport.version by 1 and DistributionDeal.version by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /dsp-revenue-reports/{id}/dispute"
        actor: RoyaltyAnalyst
        preconditions:
          - "report.status IN {SUBMITTED, ACCEPTED}"
          - "expected_deal_version == deal.version, else ERR_STALE_DEAL_VERSION"
          - "dispute_reason is supplied and non-blank"
        side_effects:
          - "stores dispute_reason"
          - "increments DspRevenueReport.version by 1 and DistributionDeal.version by 1"
      - from: ACCEPTED
        to: DISPUTED
        trigger: "POST /dsp-revenue-reports/{id}/dispute"
        actor: RoyaltyAnalyst
        preconditions:
          - "report.status IN {SUBMITTED, ACCEPTED}"
          - "expected_deal_version == deal.version, else ERR_STALE_DEAL_VERSION"
          - "no ArtistStatement with status == FINALIZED reads any line of this report, else ERR_INVALID_STATEMENT_STATE"
        side_effects:
          - "COMPENSATION HOP 1: clears DspRevenueLine.net_receipts_cents back to null on every line of this report"
          - "COMPENSATION HOP 2: caused by hop 1 — subtracts each release's share back out of Release.net_receipts_to_date_cents and subtracts report.net_receipts_cents from DistributionDeal.net_receipts_to_date_cents"
          - "COMPENSATION HOP 3: caused by hop 2 — subtracts report.advance_applied_cents from deal.advance_recouped_cents and from each Release.release_advance_recouped_cents pro rata, restoring deal.unrecouped_advance_cents and deal.post_recoupment_net_receipts_cents to their pre-acceptance values, then zeroes report.advance_applied_cents"
          - "COMPENSATION HOP 4: caused by hop 3 — when deal.unrecouped_advance_cents becomes positive again the deal's recoupment_status flips RECOUPED -> UNRECOUPED and every affected ArtistAgreement.active_royalty_rate_pct reverts to royalty_rate_pct"
          - "stores dispute_reason"
          - "increments DspRevenueReport.version by 1 and DistributionDeal.version by 1"
        note: "Compensating action for the accept cascade; leaves advance_amount_cents == advance_recouped_cents + unrecouped_advance_cents with zero drift."

  - entity: PhysicalRun
    dimension: status
    initial_state: PLANNED
    terminal_states: [RECONCILED]
    shape: "linear fulfilment axis, evolving independently of the reserve_status axis on the same row"
    transitions:
      - from: PLANNED
        to: MANUFACTURED
        trigger: "POST /physical-runs/{id}/manufacture"
        actor: LabelAdmin
        preconditions:
          - "run.status == PLANNED"
          - "the run's release has status IN {PLANNED, RELEASED}, else ERR_INVALID_RELEASE_STATE"
          - "units_manufactured > 0"
        side_effects:
          - "stores units_manufactured and sets manufacturing_cost_cents = units_manufactured * unit_manufacturing_cost_cents"
          - "increments PhysicalRun.version by 1"
      - from: MANUFACTURED
        to: SHIPPED
        trigger: "POST /physical-runs/{id}/ship"
        actor: DistributionPartner
        preconditions:
          - "run.status == MANUFACTURED"
          - "X-User-ID == run.distributor_id, else ERR_NOT_RESOURCE_OWNER"
          - "units_shipped <= units_manufactured, else ERR_INVALID_REQUEST"
          - "units_manufactured - units_shipped >= ceil(units_shipped * 0.05), else ERR_INVENTORY_OBLIGATION_BREACH"
        side_effects:
          - "stores units_shipped and wholesale_unit_price_cents"
          - "runs calculations.returns_reserve_obligation with units_returned == 0: writes returns_rate, effective_reserve_pct, reserve_initial_cents and reserve_held_cents (reserve_liquidated_cents stays 0)"
          - "sets physical_net_receipts_cents = max(0, units_shipped * wholesale_unit_price_cents - manufacturing_cost_cents)"
          - "increases Release.net_receipts_to_date_cents and DistributionDeal.net_receipts_to_date_cents by physical_net_receipts_cents"
          - "increments PhysicalRun.version by 1"
      - from: SHIPPED
        to: SHIPPED
        trigger: "POST /physical-runs/{id}/record-returns"
        actor: DistributionPartner
        preconditions:
          - "run.status == SHIPPED"
          - "X-User-ID == run.distributor_id, else ERR_NOT_RESOURCE_OWNER"
          - "units_returned (cumulative) <= units_shipped, else ERR_RETURNS_EXCEED_SHIPPED"
          - "run.reserve_status == HELD, else ERR_INVALID_RUN_STATE"
        side_effects:
          - "adds the reported units to units_returned"
          - "re-runs calculations.returns_reserve_obligation: rewrites returns_rate, effective_reserve_pct, reserve_initial_cents and reserve_held_cents"
          - "recomputes physical_net_receipts_cents and adjusts Release.net_receipts_to_date_cents and DistributionDeal.net_receipts_to_date_cents by the delta"
          - "increments PhysicalRun.version by 1"
        note: "Self-loop on the fulfilment axis; the reserve axis is untouched by this call."
      - from: SHIPPED
        to: RECONCILED
        trigger: "system side effect of POST /physical-runs/{id}/liquidate-reserve when the reserve axis reaches LIQUIDATED"
        actor: system
        preconditions:
          - "run.status == SHIPPED"
          - "run.reserve_status became LIQUIDATED in this request"
        side_effects:
          - "increments PhysicalRun.version by 1"
        note: "The only coupling between the two axes: full liquidation closes the fulfilment axis."

  - entity: PhysicalRun
    dimension: reserve_status
    initial_state: HELD
    terminal_states: []
    shape: "independent second dimension on the same row, with a compensating edge back to HELD"
    transitions:
      - from: HELD
        to: PARTIALLY_LIQUIDATED
        trigger: "POST /physical-runs/{id}/liquidate-reserve with liquidation_pct < 1.0000"
        actor: RoyaltyAnalyst
        preconditions:
          - "run.status IN {SHIPPED, RECONCILED}"
          - "expected_run_version == run.version, else ERR_STALE_RUN_VERSION"
          - "round_half_up(reserve_initial_cents * liquidation_pct) <= reserve_held_cents, else ERR_LIQUIDATION_EXCEEDS_RESERVE"
        side_effects:
          - "moves round_half_up(reserve_initial_cents * liquidation_pct) cents from reserve_held_cents into reserve_liquidated_cents, preserving reserve_initial_cents == reserve_held_cents + reserve_liquidated_cents"
          - "increments PhysicalRun.version by 1"
      - from: PARTIALLY_LIQUIDATED
        to: LIQUIDATED
        trigger: "POST /physical-runs/{id}/liquidate-reserve when the cumulative liquidation reaches reserve_initial_cents"
        actor: RoyaltyAnalyst
        preconditions:
          - "run.status IN {SHIPPED, RECONCILED}"
          - "expected_run_version == run.version, else ERR_STALE_RUN_VERSION"
          - "round_half_up(reserve_initial_cents * liquidation_pct) <= reserve_held_cents, else ERR_LIQUIDATION_EXCEEDS_RESERVE"
        side_effects:
          - "sets reserve_held_cents = 0 and reserve_liquidated_cents = reserve_initial_cents"
          - "moves the fulfilment axis SHIPPED -> RECONCILED"
          - "increments PhysicalRun.version by 1"
      - from: HELD
        to: LIQUIDATED
        trigger: "POST /physical-runs/{id}/liquidate-reserve with liquidation_pct == 1.0000"
        actor: RoyaltyAnalyst
        preconditions:
          - "run.status IN {SHIPPED, RECONCILED}"
          - "expected_run_version == run.version, else ERR_STALE_RUN_VERSION"
        side_effects:
          - "sets reserve_held_cents = 0 and reserve_liquidated_cents = reserve_initial_cents"
          - "moves the fulfilment axis SHIPPED -> RECONCILED"
          - "increments PhysicalRun.version by 1"
      - from: PARTIALLY_LIQUIDATED
        to: HELD
        trigger: "POST /physical-runs/{id}/void-liquidation"
        actor: RoyaltyAnalyst
        preconditions:
          - "run.reserve_status IN {PARTIALLY_LIQUIDATED, LIQUIDATED}"
          - "expected_run_version == run.version, else ERR_STALE_RUN_VERSION"
          - "no ArtistStatement with status == FINALIZED read this run's reserve_held_cents, else ERR_INVALID_STATEMENT_STATE"
        side_effects:
          - "moves reserve_liquidated_cents back into reserve_held_cents and sets reserve_liquidated_cents = 0, preserving reserve_initial_cents"
          - "increments PhysicalRun.version by 1"
        note: "Compensating action for liquidation; the conserved quantity reserve_initial_cents is unchanged."
      - from: LIQUIDATED
        to: HELD
        trigger: "POST /physical-runs/{id}/void-liquidation"
        actor: RoyaltyAnalyst
        preconditions:
          - "run.reserve_status IN {PARTIALLY_LIQUIDATED, LIQUIDATED}"
          - "expected_run_version == run.version, else ERR_STALE_RUN_VERSION"
          - "no ArtistStatement with status == FINALIZED read this run's reserve_held_cents, else ERR_INVALID_STATEMENT_STATE"
        side_effects:
          - "moves reserve_liquidated_cents back into reserve_held_cents and sets reserve_liquidated_cents = 0"
          - "moves the fulfilment axis RECONCILED -> SHIPPED"
          - "increments PhysicalRun.version by 1"

  - entity: ArtistStatement
    dimension: status
    initial_state: DRAFT
    terminal_states: []
    shape: "cyclic — ISSUED -> OBJECTED -> REVISED -> PREPARED -> ISSUED repeats; FINALIZED can also be reopened to REVISED by an audit finding"
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /artist-statements/{id}/prepare"
        actor: RoyaltyAnalyst
        preconditions:
          - "statement.status IN {DRAFT, REVISED}"
          - "the statement's ArtistAgreement has status IN {ACTIVE, AMENDMENT_PENDING, POST_TERM}, else ERR_AGREEMENT_NOT_STATEMENTABLE"
          - "[period_start, period_end] lies inside [deal.term_start_date, deal.post_term_collection_end_date or term_end_date], else ERR_PERIOD_OUTSIDE_TERM"
          - "for basis_variant == FINAL only, the period must not overlap another non-VOIDED FINAL statement on the same agreement (ERR_STATEMENT_PERIOD_OVERLAP) and must start the day after the latest such period ends (ERR_STATEMENT_PERIOD_NOT_CONTIGUOUS)"
        side_effects:
          - "runs calculations.artist_royalty_rate_selection and stores applied_royalty_rate_pct"
          - "runs calculations.recoupable_marketing_cap to size the artist-absorbed marketing pool for this period"
          - "runs calculations.artist_statement_net_payable under the statement's basis_variant and writes digital_royalty_base_cents, physical_royalty_base_cents, gross_royalty_cents, advance_applied_cents, recording_applied_cents, marketing_applied_cents, reserve_withheld_cents and net_payable_cents"
          - "sets prepared_by_user_id = X-User-ID"
          - "increments ArtistStatement.version by 1"
        note: "No agreement balance is debited here; PREPARED figures are advisory until FINALIZE."
      - from: REVISED
        to: PREPARED
        trigger: "POST /artist-statements/{id}/prepare"
        actor: RoyaltyAnalyst
        preconditions:
          - "statement.status IN {DRAFT, REVISED}"
          - "the statement's ArtistAgreement has status IN {ACTIVE, AMENDMENT_PENDING, POST_TERM}, else ERR_AGREEMENT_NOT_STATEMENTABLE"
        side_effects:
          - "recomputes every figure against current data, overwriting the previous run, and adds objection_adjustment_cents (0 when null) back into net_payable_cents"
          - "sets prepared_by_user_id = X-User-ID"
          - "increments revision_count by 1"
          - "increments ArtistStatement.version by 1"
        note: "Closes the statement cycle; recomputation may change net_payable_cents relative to the superseded issue."
      - from: PREPARED
        to: ISSUED
        trigger: "POST /artist-statements/{id}/issue"
        actor: BusinessAffairs
        preconditions:
          - "statement.status IN {PREPARED, OBJECTED}"
          - "X-User-ID != statement.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "statement.basis_variant == FINAL, else ERR_PROVISIONAL_NOT_ISSUABLE"
        side_effects:
          - "sets issued_at from the logical clock and issued_by_user_id = X-User-ID"
          - "sets objection_deadline = issued_at + deal.objection_window_days days, to the millisecond"
          - "increments ArtistStatement.version by 1"
      - from: ISSUED
        to: OBJECTED
        trigger: "POST /artist-statements/{id}/object"
        actor: Artist
        preconditions:
          - "statement.status == ISSUED"
          - "X-User-ID == the statement's agreement.artist_id, else ERR_NOT_RESOURCE_OWNER"
          - "current clock <= objection_deadline, else ERR_OBJECTION_WINDOW_CLOSED"
          - "objection_disputed_amount_cents <= net_payable_cents + marketing_applied_cents + reserve_withheld_cents, else ERR_DISPUTED_AMOUNT_EXCEEDS_NET"
        side_effects:
          - "stores objection_reason_code, objection_disputed_amount_cents, objection_narrative and objection_filed_at"
          - "increments ArtistStatement.version by 1"
      - from: OBJECTED
        to: ISSUED
        trigger: "POST /artist-statements/{id}/resolve-objection with resolution == DENIED"
        actor: BusinessAffairs
        preconditions:
          - "statement.status == OBJECTED"
          - "X-User-ID != statement.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "stores objection_resolution = DENIED and leaves objection_adjustment_cents null"
          - "leaves objection_deadline unchanged, so the window does not reopen"
          - "increments ArtistStatement.version by 1"
      - from: OBJECTED
        to: REVISED
        trigger: "POST /artist-statements/{id}/resolve-objection with resolution == UPHELD"
        actor: BusinessAffairs
        preconditions:
          - "statement.status == OBJECTED"
          - "X-User-ID != statement.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "stores objection_resolution = UPHELD and objection_adjustment_cents"
          - "clears issued_at, issued_by_user_id and objection_deadline back to null"
          - "increments ArtistStatement.version by 1"
      - from: PREPARED
        to: FINALIZED
        trigger: "POST /artist-statements/{id}/finalize"
        actor: BusinessAffairs
        preconditions:
          - "statement.status == PREPARED, basis_variant == FINAL and the agreement has status == POST_TERM — the PREPARED path is only reachable for post-term collection statements"
          - "X-User-ID != statement.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "objection_deadline is null on this path, so no objection window applies"
        side_effects:
          - "debits the ledgers: ArtistAgreement.unrecouped_artist_advance_cents -= advance_applied_cents, ArtistAgreement.unrecouped_recording_cents -= recording_applied_cents, Release.recoupable_marketing_applied_cents += marketing_applied_cents"
          - "recomputes Artist.lifetime_paid_cents and Artist.unrecouped_advance_total_cents"
          - "sets finalized_at from the logical clock"
          - "increments ArtistStatement.version by 1 and ArtistAgreement.version by 1"
      - from: ISSUED
        to: FINALIZED
        trigger: "POST /artist-statements/{id}/finalize"
        actor: BusinessAffairs
        preconditions:
          - "statement.status == ISSUED and objection_resolution IN {null, DENIED}"
          - "X-User-ID != statement.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
          - "current clock > objection_deadline, else ERR_OBJECTION_WINDOW_OPEN"
          - "statement.audit_status != AUDIT_REQUESTED, else ERR_INVALID_STATEMENT_STATE"
        side_effects:
          - "debits the ledgers: ArtistAgreement.unrecouped_artist_advance_cents -= advance_applied_cents, ArtistAgreement.unrecouped_recording_cents -= recording_applied_cents, Release.recoupable_marketing_applied_cents += marketing_applied_cents"
          - "recomputes Artist.lifetime_paid_cents and Artist.unrecouped_advance_total_cents"
          - "sets finalized_at from the logical clock"
          - "increments ArtistStatement.version by 1 and ArtistAgreement.version by 1"
      - from: FINALIZED
        to: REVISED
        trigger: "POST /artist-statements/{id}/conclude-audit with findings_adjustment_cents whose absolute value is >= round_half_up(net_payable_cents * 0.05)"
        actor: BusinessAffairs
        preconditions:
          - "statement.status == FINALIZED"
          - "statement.audit_status == AUDIT_REQUESTED"
          - "audit_scope_period_start >= statement.period_start AND audit_scope_period_end <= statement.period_end — an out-of-scope audit takes the AUDIT_DENIED edge instead and never reopens the statement"
          - "X-User-ID != statement.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "credits the ledgers back exactly: ArtistAgreement.unrecouped_artist_advance_cents += advance_applied_cents, ArtistAgreement.unrecouped_recording_cents += recording_applied_cents, Release.recoupable_marketing_applied_cents -= marketing_applied_cents"
          - "clears issued_at, objection_deadline and finalized_at to null"
          - "stores audit_findings_adjustment_cents and sets audit_cost_bearer = LABEL"
          - "moves audit_status AUDIT_REQUESTED -> AUDIT_COMPLETED"
          - "increments ArtistStatement.version by 1 and ArtistAgreement.version by 1"
        note: "Reopening edge: a material audit finding pulls a finalized statement back into the cycle."
      - from: DRAFT
        to: VOIDED
        trigger: "system side effect of POST /distribution-deals/{id}/terminate (cascade hop 3) or POST /artist-agreements/{id}/activate on a superseding agreement"
        actor: system
        preconditions:
          - "statement.status IN {DRAFT, PREPARED}"
        side_effects:
          - "increments ArtistStatement.version by 1"
      - from: PREPARED
        to: VOIDED
        trigger: "system side effect of POST /distribution-deals/{id}/terminate (cascade hop 3) or POST /artist-agreements/{id}/activate on a superseding agreement"
        actor: system
        preconditions:
          - "statement.status IN {DRAFT, PREPARED}"
        side_effects:
          - "increments ArtistStatement.version by 1"
        note: "ISSUED, OBJECTED, REVISED and FINALIZED statements are never voided by cascade; only unissued work is discarded."

  - entity: ArtistStatement
    dimension: audit_status
    initial_state: NONE
    terminal_states: [AUDIT_DENIED]
    shape: "second independent dimension gating the finalize edge on the status axis"
    transitions:
      - from: NONE
        to: AUDIT_REQUESTED
        trigger: "POST /artist-statements/{id}/request-audit"
        actor: Artist
        preconditions:
          - "statement.status == FINALIZED"
          - "X-User-ID == the statement's agreement.artist_id, else ERR_NOT_RESOURCE_OWNER"
          - "current clock <= finalized_at + AUDIT_RIGHTS_WINDOW_DAYS (365) days, else ERR_AUDIT_WINDOW_EXPIRED"
          - "statement.audit_status == NONE, else ERR_INVALID_STATEMENT_STATE"
        side_effects:
          - "stores audit_scope_period_start, audit_scope_period_end and auditor_name"
          - "increments ArtistStatement.version by 1"
      - from: AUDIT_REQUESTED
        to: AUDIT_COMPLETED
        trigger: "POST /artist-statements/{id}/conclude-audit"
        actor: BusinessAffairs
        preconditions:
          - "statement.audit_status == AUDIT_REQUESTED"
          - "audit_scope_period_start >= statement.period_start AND audit_scope_period_end <= statement.period_end — the stored scope lies inside the statement's own accounting period, so this statement can answer it"
          - "X-User-ID != statement.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "stores audit_findings_adjustment_cents and sets audit_cost_bearer = LABEL when abs(audit_findings_adjustment_cents) >= round_half_up(net_payable_cents * 0.05), else ARTIST"
          - "when the adjustment is material the status axis moves FINALIZED -> REVISED; when it is immaterial the status axis is unchanged"
          - "increments ArtistStatement.version by 1"
      - from: AUDIT_REQUESTED
        to: AUDIT_DENIED
        trigger: "POST /artist-statements/{id}/conclude-audit on a statement whose stored audit scope reaches outside its own accounting period"
        actor: BusinessAffairs
        preconditions:
          - "statement.audit_status == AUDIT_REQUESTED"
          - "audit_scope_period_start < statement.period_start OR audit_scope_period_end > statement.period_end — the requested scope reaches beyond the figures this statement accounts for, so it cannot be answered here"
          - "X-User-ID != statement.prepared_by_user_id, else ERR_SEGREGATION_OF_DUTIES"
        side_effects:
          - "leaves audit_findings_adjustment_cents null and sets audit_cost_bearer = ARTIST"
          - "leaves the status axis unchanged at FINALIZED — an out-of-scope audit never reopens the statement"
          - "increments ArtistStatement.version by 1"
        note: "Disjoint guard against the AUDIT_COMPLETED edge above: the two edges share the trigger and are separated purely by whether the stored scope is contained in [period_start, period_end]."

concurrency_rules:
  - rule_id: report-accept-stale-deal
    parent_entity: DistributionDeal
    write_endpoint: "POST /dsp-revenue-reports/{id}/accept"
    occ_field: expected_deal_version
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412
    description: >-
      Accepting a revenue report reads DistributionDeal.net_receipts_to_date_cents,
      advance_recouped_cents and unrecouped_advance_cents and writes all three back. Two
      different reports on the same deal are each independently acceptable, so a client that
      read the deal, then had another accept (or a dispute, or a marketing settlement) land on
      that same deal, would compute its waterfall from a stale advance balance. The caller must
      echo the deal version it read via GET /distribution-deals/{id}; a second strictly
      sequential accept that re-reads the deal first succeeds, which is what makes this a real
      lost-update hazard rather than a state-machine violation.
    serial_observability: >-
      Re-reading the deal and retrying with the fresh version succeeds, so the only thing the
      rule rejects is a write computed from a superseded read.
  - rule_id: reserve-liquidation-stale-run
    parent_entity: PhysicalRun
    write_endpoint: "POST /physical-runs/{id}/liquidate-reserve"
    occ_field: expected_run_version
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412
    description: >-
      Liquidating part of a returns reserve is a read-modify-write on
      PhysicalRun.reserve_held_cents / reserve_liquidated_cents, and partial liquidations are
      repeatable, so two successive partial liquidations are both legitimate. A liquidation
      computed against a reserve_held_cents that a concurrent record-returns call or an earlier
      partial liquidation already moved would over-release the reserve while still passing the
      ERR_LIQUIDATION_EXCEEDS_RESERVE check as the caller understood it. The caller echoes
      PhysicalRun.version; retrying after a fresh GET /physical-runs/{id} succeeds.
    serial_observability: >-
      A strictly sequential second liquidation that re-reads the run is accepted whenever
      reserve_held_cents still covers it, so the OCC check only rejects stale-read writes.
  - rule_id: report-dispute-stale-deal
    parent_entity: DistributionDeal
    write_endpoint: "POST /dsp-revenue-reports/{id}/dispute"
    occ_field: expected_deal_version
    error_id: ERR_STALE_DEAL_VERSION
    http_status: 412
    description: >-
      Disputing a report reverses that report's contribution to the deal's advance ledger, so it
      is a read-modify-write on the same three DistributionDeal fields the accept path writes.
      Disputing report A is legitimate whether or not report B has since been accepted, so the
      call cannot be rejected on state grounds; it must instead echo the deal version the caller
      observed. Retrying after GET /distribution-deals/{id} succeeds.
    serial_observability: >-
      A strictly sequential dispute of a different report on the same deal is accepted once the
      caller refreshes the deal version, so only stale-read reversals are rejected.
  - rule_id: reserve-void-stale-run
    parent_entity: PhysicalRun
    write_endpoint: "POST /physical-runs/{id}/void-liquidation"
    occ_field: expected_run_version
    error_id: ERR_STALE_RUN_VERSION
    http_status: 412
    description: >-
      Voiding a liquidation moves reserve_liquidated_cents back into reserve_held_cents, so a
      void computed against a reserve snapshot that a later partial liquidation or returns
      recording has already superseded would restore the wrong amount. Voiding is itself a
      legitimate repeatable operation on a run whose reserve_status is PARTIALLY_LIQUIDATED or
      LIQUIDATED, so the guard is a version echo rather than a state precondition.
    serial_observability: >-
      Re-reading the run and retrying the void with the fresh version succeeds, so the check
      only rejects a reversal derived from a superseded read.

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:
  - name: dsp_line_revenue
    trigger: "POST /dsp-revenue-reports/{id}/submit (both the DRAFT -> SUBMITTED and the DISPUTED -> SUBMITTED transition)"
    algorithm: tiered_pricing
    combinatorial_mode: "(b) nested rounding where the order matters — the scaffold pins round-per-line-then-sum"
    formula: |
      # STEP 1 — per-line rate resolution (selector is fully pinned)
      for each line L of the report, iterated in DspRevenueLine.created_at ASC order:
          candidates = StreamRateCard rows where
                dsp_code       == report.dsp_code
            AND territory_code == L.territory_code
            AND tier           == L.tier
            AND effective_from <= report.period_end                       # inclusive lower edge
            AND (effective_to IS NULL OR effective_to > report.period_end) # exclusive upper edge
          rank candidates by effective_from DESC, tie-break created_at ASC, take the first row
          if candidates is empty:
              reject the whole submit with ERR_RATE_CARD_NOT_FOUND (422)
          L.applied_rate_micros_per_stream = chosen.rate_micros_per_stream

      # STEP 2 — per-line rounding to whole cents (PINNED ORDER: round each line first)
          L.resolved_revenue_cents = round_half_up(L.stream_count * L.applied_rate_micros_per_stream / MICROS_PER_CENT)

      # STEP 3 — summation of already-rounded line values
      report.gross_receipts_cents = sum over the report's lines of L.resolved_revenue_cents
    input_set: >-
      Every DspRevenueLine with report_id == this report, regardless of order of creation. Rate
      candidates are drawn from all StreamRateCard rows (the entity is immutable, so no status
      filter applies); the effective window is half-open [effective_from, effective_to) evaluated
      at report.period_end.
    constants:
      MICROS_PER_CENT: 10000
    precision: >-
      Whole integer cents, round_half_up, applied ONCE PER LINE and never to the sum. Pinned
      counter-example: lines of 1000001 streams @ 4000 micros (raw 400000.4), 2500003 @ 1200
      (raw 300000.36) and 333338 @ 3000 (raw 100001.4) give 400000 + 300000 + 100001 = 800001
      under the pinned per-line order, but round_half_up(800001.56) = 800002 if the raw values
      were summed first. 800001 is the correct answer.
    order_sensitivity: >-
      The result is order-independent given the pinned per-line rounding, but the selector's
      created_at ASC tie-break is what makes two rate cards sharing an effective_from resolve
      deterministically.

  - name: deal_net_receipts
    trigger: "POST /dsp-revenue-reports/{id}/submit (immediately after dsp_line_revenue), and the per-line allocation step runs on POST /dsp-revenue-reports/{id}/accept"
    algorithm: aggregation
    combinatorial_mode: "(a) >= 3 inputs with non-linear interaction — three deal_type branches, nested min/max, and a month-count term"
    formula: |
      gross = report.gross_receipts_cents

      # STEP 1 — branch on deal.deal_type
      if deal.deal_type == DISTRIBUTION_FEE:
          raw_share = round_half_up(gross * deal.distribution_fee_pct)

      elif deal.deal_type == PROFIT_SHARE:
          recoverable_costs_cents =
                sum(MarketingSpend.settled_amount_cents
                    over spends whose release_id is a Release of this deal
                    with status == SETTLED and approved_at < report.period_start T00:00:00.000Z)
              + sum(PhysicalRun.manufacturing_cost_cents
                    over runs whose release_id is a Release of this deal
                    with status IN {SHIPPED, RECONCILED} and window_end <= report.period_end)
          profit_base_cents = max(0, gross - recoverable_costs_cents)
          label_share = round_half_up(profit_base_cents * deal.profit_share_label_pct)
          raw_share = gross - label_share

      else:  # LABEL_SERVICES
          months_in_period = (year(period_end) - year(period_start)) * 12
                           + (month(period_end) - month(period_start)) + 1
          raw_share = round_half_up(gross * deal.services_fee_pct)
                    + deal.services_monthly_fee_cents * months_in_period

      # STEP 2 — clamp and settle the report-level figures
      report.distributor_share_cents = min(gross, max(0, raw_share))
      report.net_receipts_cents      = gross - report.distributor_share_cents

      # STEP 3 — per-line allocation, run on ACCEPT only (largest-remainder, fully pinned)
      weights = [L.resolved_revenue_cents for L in the report's lines, created_at ASC]
      if sum(weights) == 0:
          every L.net_receipts_cents = 0
      else:
          exact_i  = report.distributor_share_cents * weights_i / sum(weights)
          floor_i  = floor(exact_i)
          leftover = report.distributor_share_cents - sum(floor_i)
          rank the lines by (exact_i - floor_i) DESC, tie-break DspRevenueLine.created_at ASC,
              and give +1 cent to the first `leftover` lines
          L.net_receipts_cents = L.resolved_revenue_cents - allocated_share_i
    input_set: >-
      Exactly one DspRevenueReport and its own DspRevenueLine rows. The PROFIT_SHARE branch also
      reads MarketingSpend rows with status == SETTLED whose approved_at precedes the reported
      period (spend from the period being reported is deliberately excluded — see
      recoupable_marketing_cap for why) and PhysicalRun rows with status IN {SHIPPED, RECONCILED}.
    constants:
      DEAL_TYPES: "{DISTRIBUTION_FEE, PROFIT_SHARE, LABEL_SERVICES}"
    precision: >-
      Whole integer cents, round_half_up on each percentage product; the monthly services fee is
      already integral. Pinned: gross 800001 at distribution_fee_pct 0.1500 gives
      distributor_share_cents 120000 and net_receipts_cents 680001; the largest-remainder
      allocation of 120000 over line weights [400000, 300000, 100001] gives [60000, 45000, 15000]
      (exact parts 59999.925 / 44999.944 / 15000.131, so the two leftover cents go to the second
      then the first line), leaving line net receipts [340000, 255000, 85001].
    order_sensitivity: >-
      The leftover-cent assignment is order-sensitive and is pinned to (fractional part DESC,
      created_at ASC). No random identifier participates.

  - name: advance_recoupment_waterfall
    trigger: "cascade hop 3 of POST /dsp-revenue-reports/{id}/accept; reversed by COMPENSATION HOP 3 of POST /dsp-revenue-reports/{id}/dispute; evaluated read-only by GET /distribution-deals/{id}/recoupment-summary"
    algorithm: waterfall_allocation
    formula: |
      pool_cents      = report.net_receipts_cents
      release_pool[r] = sum of L.net_receipts_cents over this report's lines with release_id == r
                        (releases iterated in Release.created_at ASC order)

      # --- variant CROSS_COLLATERALIZED (deal.cross_collateralized == true)
      applied_total = min(pool_cents, deal.unrecouped_advance_cents)
      applied[r]    = largest-remainder split of applied_total over the releases,
                      weighted by release_pool[r], leftover cents by fractional part DESC then
                      Release.created_at ASC

      # --- variant SILOED (deal.cross_collateralized == false)
      for each release r in Release.created_at ASC order:
          release_unrecouped = max(0, r.advance_share_cents - r.release_advance_recouped_cents)
          applied[r]         = min(release_pool[r], release_unrecouped)
      applied_total = sum(applied[r])

      # --- common settlement (identical for both variants)
      report.advance_applied_cents            = applied_total
      deal.advance_recouped_cents            += applied_total
      deal.unrecouped_advance_cents           = deal.advance_amount_cents - deal.advance_recouped_cents
      deal.post_recoupment_net_receipts_cents += pool_cents - applied_total
      for each release r:
          r.release_advance_recouped_cents    += applied[r]
          r.unrecouped_advance_share_cents     = max(0, r.advance_share_cents - r.release_advance_recouped_cents)
      deal.recoupment_status = RECOUPED if deal.unrecouped_advance_cents == 0 else UNRECOUPED
    input_set: >-
      The accepting report's own lines, plus every Release of the deal with status IN
      {PLANNED, RELEASED, REVERSION_PENDING} (REVERTED releases keep their recorded balances but
      receive no further attribution). Reports with status IN {DRAFT, SUBMITTED, DISPUTED}
      contribute nothing.
    constants: {}
    precision: "Whole integer cents; no percentage is applied, so the only rounding is the largest-remainder split."
    variants:
      - name: CROSS_COLLATERALIZED
        when: "deal.cross_collateralized == true; also the CROSS arm of GET /distribution-deals/{id}/recoupment-summary?variant=CROSS_COLLATERALIZED"
        difference: >-
          One deal-level pool: strong releases pay down the weak releases' advance, so the whole
          net receipts of the period are available to the single unrecouped_advance_cents bucket.
      - name: SILOED
        when: "deal.cross_collateralized == false; also the SILOED arm of GET /distribution-deals/{id}/recoupment-summary?variant=SILOED"
        difference: >-
          Per-release buckets capped at Release.advance_share_cents: a release whose pool exceeds
          its own share stops recouping and the surplus becomes post-recoupment excess even while
          the deal as a whole is still unrecouped.
    divergence_proof: >-
      Pinned fixture: advance_amount_cents 650000, release advance shares R1 600000 and R2 50000,
      period pool 680001 split R1 595000 / R2 85001. CROSS applies min(680001, 650000) = 650000,
      leaving unrecouped_advance_cents 0, post_recoupment_net_receipts_cents 30001 and
      recoupment_status RECOUPED. SILOED applies min(595000, 600000) + min(85001, 50000) = 645000,
      leaving unrecouped_advance_cents 5000, post_recoupment_net_receipts_cents 35001 and
      recoupment_status UNRECOUPED. The 5000-cent divergence flips every governed
      ArtistAgreement.active_royalty_rate_pct between royalty_rate_pct and
      escalated_royalty_rate_pct.

  - name: artist_royalty_rate_selection
    trigger: "POST /artist-agreements/{id}/activate, POST /artist-agreements/{id}/resolve-amendment, cascade hop 5 of POST /dsp-revenue-reports/{id}/accept, COMPENSATION HOP 4 of POST /dsp-revenue-reports/{id}/dispute, and the prepare step of every ArtistStatement"
    algorithm: threshold
    formula: |
      if release.deal.recoupment_status == RECOUPED:
          agreement.active_royalty_rate_pct = agreement.escalated_royalty_rate_pct
      else:
          agreement.active_royalty_rate_pct = agreement.royalty_rate_pct
      # frozen onto the statement at prepare time:
      statement.applied_royalty_rate_pct = agreement.active_royalty_rate_pct
    input_set: "Agreements with status IN {ACTIVE, AMENDMENT_PENDING, POST_TERM}; SUPERSEDED and TERMINATED agreements are never re-rated."
    constants: {}
    precision: "4-decimal fraction, copied verbatim — no arithmetic, therefore no rounding."

  - name: returns_reserve_obligation
    trigger: "POST /physical-runs/{id}/ship (with units_returned == 0) and every POST /physical-runs/{id}/record-returns"
    algorithm: threshold
    formula: |
      base_pct = run.returns_reserve_pct if run.returns_reserve_pct IS NOT NULL
                 else distributor.default_returns_reserve_pct

      returns_rate = 0.0000 if run.units_shipped == 0
                     else round_half_up(run.units_returned / run.units_shipped, 4 decimal places)

      if   returns_rate >= RETURNS_TIER_2_RATE: effective = min(base_pct + TIER_2_UPLIFT, RESERVE_PCT_MAX)
      elif returns_rate >= RETURNS_TIER_1_RATE: effective = min(base_pct + TIER_1_UPLIFT, RESERVE_PCT_MAX)
      else:                                     effective = base_pct
      run.effective_reserve_pct = effective

      gross_shipped_value_cents = run.units_shipped * run.wholesale_unit_price_cents
      run.reserve_initial_cents = round_half_up(gross_shipped_value_cents * run.effective_reserve_pct)
      delta                     = run.reserve_initial_cents
                                - (run.reserve_held_cents + run.reserve_liquidated_cents)
      run.reserve_held_cents    = max(0, run.reserve_held_cents + delta)   # liquidated cents are never clawed back here

      run.physical_net_receipts_cents = max(0,
            (run.units_shipped - run.units_returned) * run.wholesale_unit_price_cents
          - run.manufacturing_cost_cents)

      # inventory obligation, checked on the ship transition only
      min_inventory_units = ceil(run.units_shipped * INVENTORY_OBLIGATION_PCT)
      if run.units_manufactured - run.units_shipped < min_inventory_units:
          reject with ERR_INVENTORY_OBLIGATION_BREACH (422)
    input_set: >-
      One PhysicalRun with status IN {MANUFACTURED, SHIPPED} plus its Distributor for the
      fallback percentage. Runs with status == PLANNED have no shipped units and are excluded.
    constants:
      RETURNS_TIER_1_RATE: 0.1000
      TIER_1_UPLIFT: 0.0500
      RETURNS_TIER_2_RATE: 0.2500
      TIER_2_UPLIFT: 0.1500
      RESERVE_PCT_MAX: 0.5000
      INVENTORY_OBLIGATION_PCT: 0.0500
    precision: >-
      returns_rate is a 4-decimal fraction, round_half_up; reserve amounts are whole cents,
      round_half_up. Pinned: base 0.1000, units_shipped 1000, wholesale_unit_price_cents 900,
      units_returned 100 gives returns_rate exactly 0.1000 -> tier 1 -> effective 0.1500 ->
      reserve_initial_cents 135000, and with units_manufactured 1200 @ 250 cents
      (manufacturing_cost_cents 300000) physical_net_receipts_cents = 900*900 - 300000 = 510000.
      Boundary pair at base 0.2000: units_returned 250 of 1000 gives returns_rate exactly 0.2500
      -> tier 2 -> effective 0.3500 -> reserve 315000, while 249 of 1000 gives 0.2490 -> tier 1
      -> effective 0.2500 -> reserve 225000. The tier tests are >= , not >.

  - name: recoupable_marketing_cap
    trigger: "the prepare step of POST /artist-statements/{id}/prepare, immediately before the marketing bucket of artist_statement_net_payable"
    algorithm: constraint_propagation
    combinatorial_mode: "(c) circular-looking dependency with a pinned evaluation order"
    formula: |
      # The cycle: the artist's recoupable marketing is capped at a percentage of the period's NET
      # receipts; net receipts are gross minus the distributor share; and on a PROFIT_SHARE deal the
      # distributor share is itself computed from a profit base that deducts settled marketing.
      # Marketing -> distributor share -> net receipts -> marketing cap -> marketing charged.
      # The order below is PINNED and breaks the cycle; no fixed-point iteration is performed.
      #
      # STEP 1  The distributor share was already fixed at report-submit time by deal_net_receipts,
      #         and its PROFIT_SHARE branch may only deduct MarketingSpend rows with status ==
      #         SETTLED whose approved_at precedes report.period_start. Marketing approved inside
      #         the period being accounted therefore NEVER feeds the distributor share for that
      #         same period. This is the cut that makes the chain acyclic.
      period_net_receipts_cents = statement.digital_royalty_base_cents
                                + statement.physical_royalty_base_cents
      # STEP 2  cap is a percentage of the already-net figure from STEP 1
      marketing_cap_cents = round_half_up(period_net_receipts_cents * MARKETING_CAP_PCT)
      # STEP 3  raw pool, weighted by recoupability, over the basis set chosen by basis_variant
      raw_marketing_cents = sum over the release's MarketingSpend rows in the basis set of
            round_half_up(basis_amount * RECOUPABILITY_FACTOR[spend.recoupability])
      # STEP 4  apply the cap, then the artist's contractual share, then the cumulative offset
      recoupable_marketing_cents      = min(raw_marketing_cents, marketing_cap_cents)
      artist_marketing_share_cents    = max(0,
            round_half_up(recoupable_marketing_cents * agreement.marketing_recoup_share_pct)
          - release.recoupable_marketing_applied_cents)
    input_set: >-
      MarketingSpend rows whose release_id == agreement.release_id. Basis set by variant:
      PROVISIONAL takes status IN {APPROVED, SETTLED} valued at amount_cents; FINAL takes status
      == SETTLED only, valued at settled_amount_cents. Rows with status IN {DRAFT, SUBMITTED,
      REJECTED, REVISION_REQUESTED, VOIDED} never enter either basis set.
    constants:
      MARKETING_CAP_PCT: 0.3000
      RECOUPABILITY_FACTOR: { FULLY_RECOUPABLE: 1.0000, HALF_RECOUPABLE: 0.5000, NON_RECOUPABLE: 0.0000 }
    precision: >-
      Whole integer cents, round_half_up per spend row and again on the share. Pinned: period net
      receipts 1105000 gives marketing_cap_cents 331500; a PROVISIONAL basis of 60000
      FULLY_RECOUPABLE + 40000 HALF_RECOUPABLE gives raw 80000, uncapped, and an artist share of
      40000 at marketing_recoup_share_pct 0.5000; the FINAL basis of a single settled 45000
      FULLY_RECOUPABLE row gives raw 45000 and an artist share of 22500.

  - name: artist_statement_net_payable
    trigger: "POST /artist-statements/{id}/prepare (both the DRAFT -> PREPARED and the REVISED -> PREPARED transition)"
    algorithm: waterfall_allocation
    formula: |
      statement.applied_royalty_rate_pct = agreement.active_royalty_rate_pct   # frozen here

      statement.digital_royalty_base_cents =
          sum of DspRevenueLine.net_receipts_cents over lines whose release_id ==
          agreement.release_id, restricted to reports with status == ACCEPTED whose
          [period_start, period_end] is fully contained in the statement's period
      statement.physical_royalty_base_cents =
          sum of PhysicalRun.physical_net_receipts_cents over runs whose release_id ==
          agreement.release_id with status IN {SHIPPED, RECONCILED} and window_end inside the
          statement's [period_start, period_end]

      base      = digital_royalty_base_cents + physical_royalty_base_cents
      statement.gross_royalty_cents = round_half_up(base * statement.applied_royalty_rate_pct)

      # deduction waterfall — buckets are filled strictly in this order
      remaining                          = statement.gross_royalty_cents
      statement.advance_applied_cents    = min(remaining, agreement.unrecouped_artist_advance_cents)
      remaining                         -= statement.advance_applied_cents
      statement.recording_applied_cents  = min(remaining, agreement.unrecouped_recording_cents)
      remaining                         -= statement.recording_applied_cents
      statement.marketing_applied_cents  = min(remaining, artist_marketing_share_cents)   # recoupable_marketing_cap
      remaining                         -= statement.marketing_applied_cents

      statement.reserve_withheld_cents   = round_half_up(reserve_basis_cents
                                                         * statement.applied_royalty_rate_pct)
      statement.net_payable_cents        = max(0, remaining - statement.reserve_withheld_cents)
      # on the REVISED -> PREPARED edge only, objection_adjustment_cents (0 when null) is added to
      # net_payable_cents after the floor above
    input_set: >-
      One ArtistAgreement with status IN {ACTIVE, AMENDMENT_PENDING, POST_TERM}; ACCEPTED reports
      only; PhysicalRun rows with status IN {SHIPPED, RECONCILED} only; MarketingSpend rows per
      recoupable_marketing_cap's basis set. Statements with status == VOIDED are never recomputed.
    constants: {}
    precision: "Whole integer cents, round_half_up on the royalty product and on the reserve product."
    variants:
      - name: PROVISIONAL
        when: "statement.basis_variant == PROVISIONAL — an interim, non-issuable statement"
        difference: >-
          Marketing basis is status IN {APPROVED, SETTLED} valued at amount_cents (the commitment,
          not the invoice), and reserve_basis_cents is the FULL reserve, i.e. the sum of
          PhysicalRun.reserve_initial_cents over the release's runs with status IN {SHIPPED,
          RECONCILED}. The statement can never be issued (ERR_PROVISIONAL_NOT_ISSUABLE).
      - name: FINAL
        when: "statement.basis_variant == FINAL — the issuable, auditable statement"
        difference: >-
          Marketing basis is status == SETTLED only, valued at settled_amount_cents, and
          reserve_basis_cents counts only unliquidated reserve, i.e. the sum of
          PhysicalRun.reserve_held_cents. Liquidating a reserve therefore raises the FINAL net
          payable without touching the PROVISIONAL figure.
    divergence_proof: >-
      Pinned fixture on identical database state: applied_royalty_rate_pct 0.1800,
      digital_royalty_base_cents 595000, physical_royalty_base_cents 510000, base 1105000,
      gross_royalty_cents 198900, advance_applied_cents 50000, recording_applied_cents 50000
      (leaving 98900). PROVISIONAL: marketing_applied_cents 40000, reserve basis 135000 ->
      reserve_withheld_cents 24300 -> net_payable_cents 34600. FINAL after a 40% liquidation
      (reserve_liquidated_cents 54000, reserve_held_cents 81000): marketing_applied_cents 22500,
      reserve_withheld_cents 14580 -> net_payable_cents 61820. Divergence 27220 cents on the same
      period and the same underlying rows.

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST violated rule decides the response and no later rule is evaluated)
# -----------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-blank (a header consisting only of whitespace counts as absent)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the X-User-Role value is one of the five §1.7 roles AND that role appears in the called endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "every id in the request path resolves, validated left to right; the deal segment resolves before any nested segment"
    error_id: "ERR_DEAL_NOT_FOUND | ERR_RELEASE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND | ERR_MARKETING_SPEND_NOT_FOUND | ERR_REVENUE_REPORT_NOT_FOUND | ERR_PHYSICAL_RUN_NOT_FOUND | ERR_STATEMENT_NOT_FOUND | ERR_ARTIST_NOT_FOUND | ERR_DISTRIBUTOR_NOT_FOUND"
    http_status: 404
    applies_to: "every endpoint with a templated path segment"

  - priority: 4
    category: auth
    check: >-
      for entity_backed roles, X-User-ID equals the resource's owning foreign key:
      DistributionPartner acting on a DspRevenueReport must equal report.deal.distributor_id and on
      a PhysicalRun must equal run.distributor_id; Artist acting on an ArtistStatement must equal
      statement.artist_agreement.artist_id
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /dsp-revenue-reports/{id}/lines, POST /dsp-revenue-reports/{id}/submit, POST /physical-runs/{id}/ship, POST /physical-runs/{id}/record-returns, POST /artist-statements/{id}/object, POST /artist-statements/{id}/request-audit, GET /artist-statements/{id}"

  - priority: 5
    category: business_constraint
    check: >-
      request body schema: required fields present, types correct, enum members recognised,
      percentages carry exactly four decimals and sit inside their declared range, money fields are
      integers >= 0, dates are YYYY-MM-DD with period_end >= period_start and term_end_date strictly
      after term_start_date, upc is 12..14 ASCII digits, territory_codes is a non-empty array of
      distinct ISO 3166-1 alpha-2 codes, and the deal_type conditional fields obey their
      required/must-be-null pairing
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 6
    category: existence
    check: "every foreign key supplied in the request BODY resolves to an existing row (distributor_id, artist_id, deal_id, primary_artist_id, release_id, artist_agreement_id, supersedes_agreement_id)"
    error_id: "ERR_DISTRIBUTOR_NOT_FOUND | ERR_ARTIST_NOT_FOUND | ERR_DEAL_NOT_FOUND | ERR_RELEASE_NOT_FOUND | ERR_AGREEMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /distribution-deals, POST /releases, POST /artist-agreements, POST /marketing-spends, POST /dsp-revenue-reports, POST /dsp-revenue-reports/{id}/lines, POST /physical-runs, POST /artist-statements"

  - priority: 7
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version field (§1.2.1 OCC)"
    error_id: "ERR_STALE_DEAL_VERSION | ERR_STALE_RUN_VERSION"
    http_status: 412
    applies_to: "POST /dsp-revenue-reports/{id}/accept, POST /dsp-revenue-reports/{id}/dispute, POST /physical-runs/{id}/liquidate-reserve, POST /physical-runs/{id}/void-liquidation"

  - priority: 8
    category: state
    check: "the target resource's own status (and, for PhysicalRun and ArtistStatement, the relevant one of its two dimensions) is a declared `from:` state of the requested transition"
    error_id: "ERR_INVALID_DEAL_STATE | ERR_INVALID_RELEASE_STATE | ERR_INVALID_AGREEMENT_STATE | ERR_INVALID_SPEND_STATE | ERR_INVALID_REPORT_STATE | ERR_INVALID_RUN_STATE | ERR_INVALID_STATEMENT_STATE"
    http_status: 409
    applies_to: "every action endpoint (any POST whose path ends in a verb segment)"

  - priority: 8
    category: state
    check: "the accepting deal is still collecting: deal.status IN {EXECUTED, TERMINATION_NOTICE, POST_TERM_COLLECTION}; a DRAFT, EXPIRED or CLOSED deal cannot absorb receipts"
    error_id: ERR_DEAL_NOT_COLLECTING
    http_status: 409
    applies_to: "POST /dsp-revenue-reports/{id}/accept"

  - priority: 8
    category: state
    check: "the statement's ArtistAgreement has status IN {ACTIVE, AMENDMENT_PENDING, POST_TERM}; SUPERSEDED and TERMINATED agreements can no longer be accounted"
    error_id: ERR_AGREEMENT_NOT_STATEMENTABLE
    http_status: 409
    applies_to: "POST /artist-statements, POST /artist-statements/{id}/prepare"

  - priority: 8
    category: state
    check: "the spend's Release has status IN {PLANNED, RELEASED}; a REVERSION_PENDING or REVERTED release may not accrue or approve marketing"
    error_id: ERR_RELEASE_NOT_PROMOTABLE
    http_status: 409
    applies_to: "POST /marketing-spends, POST /marketing-spends/{id}/submit, POST /marketing-spends/{id}/decide"

  - priority: 8
    category: state
    check: "the run's Release is physically distributable — Release.formats contains at least one of {VINYL, CD, CASSETTE} — and Release.status IN {PLANNED, RELEASED}; a digital-only release, or one already reverting, cannot carry a manufacturing run"
    error_id: ERR_INVALID_RELEASE_STATE
    http_status: 409
    applies_to: "POST /physical-runs"

  - priority: 9
    category: business_safety
    check: >-
      segregation of duties: the acting X-User-ID differs from the stored counterpart actor —
      MarketingSpend.requested_by_user_id may not decide its own spend, and
      ArtistStatement.prepared_by_user_id may not issue, resolve an objection on, finalize or
      conclude the audit of the statement it prepared
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /marketing-spends/{id}/decide, POST /artist-statements/{id}/issue, POST /artist-statements/{id}/resolve-objection, POST /artist-statements/{id}/finalize, POST /artist-statements/{id}/conclude-audit"

  - priority: 10
    category: business_temporal
    check: "an objection is filed at or before ArtistStatement.objection_deadline (an objection filed at exactly the deadline instant is accepted)"
    error_id: ERR_OBJECTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /artist-statements/{id}/object"

  - priority: 10
    category: business_temporal
    check: "a statement is finalized only strictly after objection_deadline has passed, whenever objection_deadline is set"
    error_id: ERR_OBJECTION_WINDOW_OPEN
    http_status: 422
    applies_to: "POST /artist-statements/{id}/finalize"

  - priority: 10
    category: business_temporal
    check: "an audit is requested at or before finalized_at + AUDIT_RIGHTS_WINDOW_DAYS (365) days"
    error_id: ERR_AUDIT_WINDOW_EXPIRED
    http_status: 422
    applies_to: "POST /artist-statements/{id}/request-audit"

  - priority: 10
    category: business_temporal
    check: "a deal may be expired only when the logical clock's calendar date is strictly after term_end_date"
    error_id: ERR_TERM_NOT_ENDED
    http_status: 422
    applies_to: "POST /distribution-deals/{id}/expire"

  - priority: 10
    category: business_temporal
    check: "a deal may be closed only when the logical clock's calendar date is strictly after post_term_collection_end_date"
    error_id: ERR_POST_TERM_COLLECTION_ACTIVE
    http_status: 422
    applies_to: "POST /distribution-deals/{id}/close"

  - priority: 10
    category: business_temporal
    check: "the reported or accounted period lies inside [deal.term_start_date, coalesce(deal.post_term_collection_end_date, deal.term_end_date)]; on POST /releases/{id}/release the single actual_release_date lies inside [deal.term_start_date, deal.term_end_date]"
    error_id: ERR_PERIOD_OUTSIDE_TERM
    http_status: 422
    applies_to: "POST /dsp-revenue-reports/{id}/accept, POST /artist-statements/{id}/prepare, POST /releases/{id}/release"

  - priority: 11
    category: business_referential
    check: "no other StreamRateCard shares (dsp_code, territory_code, tier) with an intersecting half-open [effective_from, effective_to) window; a card starting exactly on another's effective_to is adjacent, not overlapping, and is accepted"
    error_id: ERR_RATE_CARD_OVERLAP
    http_status: 409
    applies_to: "POST /stream-rate-cards"

  - priority: 11
    category: business_referential
    check: "for basis_variant == FINAL, the statement's closed period [period_start, period_end] does not intersect any other non-VOIDED FINAL statement on the same agreement; adjacency is NOT allowed to overlap by a single day, so a period starting on another's period_end is rejected"
    error_id: ERR_STATEMENT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /artist-statements/{id}/prepare"

  - priority: 11
    category: business_referential
    check: "for basis_variant == FINAL, when a prior non-VOIDED FINAL statement exists on the agreement the new period_start is exactly the day after the latest such period_end — no gaps"
    error_id: ERR_STATEMENT_PERIOD_NOT_CONTIGUOUS
    http_status: 422
    applies_to: "POST /artist-statements/{id}/prepare"

  - priority: 11
    category: business_referential
    check: "Release.upc is unique across all Release rows"
    error_id: ERR_DUPLICATE_UPC
    http_status: 409
    applies_to: "POST /releases"

  - priority: 11
    category: business_referential
    check: "no ArtistStatement on any of the deal's agreements has status == OBJECTED with objection_resolution == null"
    error_id: ERR_OPEN_OBJECTIONS_BLOCK_CLOSE
    http_status: 409
    applies_to: "POST /distribution-deals/{id}/close"

  - priority: 11
    category: business_referential
    check: "every DspRevenueLine of the report resolves exactly one StreamRateCard per calculations.dsp_line_revenue"
    error_id: ERR_RATE_CARD_NOT_FOUND
    http_status: 422
    applies_to: "POST /dsp-revenue-reports/{id}/submit"

  - priority: 11
    category: business_constraint
    check: "only a statement with basis_variant == FINAL may be issued; PROVISIONAL statements are interim working papers"
    error_id: ERR_PROVISIONAL_NOT_ISSUABLE
    http_status: 422
    applies_to: "POST /artist-statements/{id}/issue"

  - priority: 12
    category: business_fiscal
    check: "deal.marketing_committed_cents + amount_cents <= deal.marketing_budget_cents on approval, and the settled-basis recomputation stays inside the budget on settlement"
    error_id: ERR_MARKETING_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /marketing-spends/{id}/decide, POST /marketing-spends/{id}/settle"

  - priority: 12
    category: business_fiscal
    check: "the sum of advance_share_cents over the deal's releases with status != REVERTED does not exceed deal.advance_amount_cents"
    error_id: ERR_ADVANCE_ALLOCATION_EXCEEDED
    http_status: 422
    applies_to: "POST /releases"

  - priority: 12
    category: business_fiscal
    check: "units_manufactured - units_shipped >= ceil(units_shipped * INVENTORY_OBLIGATION_PCT): the distributor must retain the contractual back-catalogue inventory"
    error_id: ERR_INVENTORY_OBLIGATION_BREACH
    http_status: 422
    applies_to: "POST /physical-runs/{id}/ship"

  - priority: 12
    category: business_fiscal
    check: "units_returned + returned_units <= units_shipped"
    error_id: ERR_RETURNS_EXCEED_SHIPPED
    http_status: 422
    applies_to: "POST /physical-runs/{id}/record-returns"

  - priority: 12
    category: business_fiscal
    check: "objection_disputed_amount_cents <= net_payable_cents + marketing_applied_cents + reserve_withheld_cents"
    error_id: ERR_DISPUTED_AMOUNT_EXCEEDS_NET
    http_status: 422
    applies_to: "POST /artist-statements/{id}/object"

  - priority: 12
    category: business_fiscal
    check: "round_half_up(reserve_initial_cents * liquidation_pct) <= reserve_held_cents"
    error_id: ERR_LIQUIDATION_EXCEEDS_RESERVE
    http_status: 422
    applies_to: "POST /physical-runs/{id}/liquidate-reserve"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table — flat topology, every collection at the root
# -----------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: >-
      Test-driving endpoint: sets the server's logical clock to an arbitrary UTC instant. Every
      deadline, window and period boundary in this API reads this clock and never the host wall
      clock. Before the first call the logical clock reads exactly 2026-08-01T00:00:00Z — that
      fixed startup default, not real time, is what an unset clock returns.
    roles: [LabelAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["repositions the logical clock read by every subsequent request"]

  - method: POST
    path: "/distributors"
    description: "Registers a distribution counterparty; its id is the X-User-ID a DistributionPartner acts as."
    roles: [LabelAdmin]
    code: 201
    input: [name, legal_entity, "default_returns_reserve_pct?"]
    output: Distributor
    side_effects: ["sets active_deal_count = 0"]

  - method: GET
    path: "/distributors/{id}"
    description: "Reads one distributor including its recomputed active_deal_count."
    roles: [LabelAdmin, DistributionPartner]
    code: 200
    input: []
    output: Distributor
    side_effects: []

  - method: POST
    path: "/artists"
    description: "Registers a recording artist; its id is the X-User-ID an Artist acts as."
    roles: [LabelAdmin]
    code: 201
    input: [legal_name, email]
    output: Artist
    side_effects: ["sets lifetime_paid_cents = 0 and unrecouped_advance_total_cents = 0"]

  - method: GET
    path: "/artists/{id}"
    description: "Reads one artist including the two cross-entity computed totals."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, Artist]
    code: 200
    input: []
    output: Artist
    side_effects: []

  - method: POST
    path: "/distribution-deals"
    description: "Creates a DRAFT distribution agreement. The deal_type decides which fee fields are required and which must be null."
    roles: [LabelAdmin]
    code: 201
    input: [distributor_id, deal_type, "distribution_fee_pct?", "profit_share_label_pct?", "services_fee_pct?", "services_monthly_fee_cents?", term_start_date, term_end_date, territory_codes, cross_collateralized, advance_amount_cents, marketing_budget_cents, "objection_window_days?", "post_term_collection_days?"]
    output: DistributionDeal
    side_effects: ["sets status = DRAFT and zeroes the four ledger counters"]

  - method: GET
    path: "/distribution-deals/{id}"
    description: "Reads one deal with its live advance ledger; the source of the version value echoed into expected_deal_version."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner]
    code: 200
    input: []
    output: DistributionDeal
    side_effects: []

  - method: GET
    path: "/distribution-deals"
    description: "Lists deals; the reverse-reachability channel for DistributionDeal.distributor_id."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner]
    code: 200
    input: ["distributor_id?", "status?", "limit?", "offset?"]
    output: DistributionDeal[]
    side_effects: []

  - method: POST
    path: "/distribution-deals/{id}/execute"
    description: "DRAFT -> EXECUTED: books the advance and opens the term."
    roles: [LabelAdmin]
    code: 200
    input: [advance_payment_reference]
    output: DistributionDeal
    side_effects:
      - "sets executed_at, advance_recouped_cents = 0, unrecouped_advance_cents = advance_amount_cents"
      - "sets recoupment_status per §1.2"
      - "recomputes Distributor.active_deal_count"
      - "increments DistributionDeal.version by 1"

  - method: POST
    path: "/distribution-deals/{id}/terminate"
    description: "EXECUTED -> TERMINATION_NOTICE: the for-cause fork; runs the three-hop release/agreement/statement cascade."
    roles: [LabelAdmin]
    code: 200
    input: []
    output: DistributionDeal
    side_effects:
      - "sets termination_effective_date and post_term_collection_end_date"
      - "CASCADE HOP 1 releases -> REVERSION_PENDING or REVERTED; HOP 2 agreements -> POST_TERM; HOP 3 unissued statements -> VOIDED"
      - "recomputes Distributor.active_deal_count"
      - "increments DistributionDeal.version by 1"

  - method: POST
    path: "/distribution-deals/{id}/expire"
    description: "EXECUTED -> EXPIRED: the natural-expiry fork; deliberately moves no release or agreement state."
    roles: [LabelAdmin]
    code: 200
    input: []
    output: DistributionDeal
    side_effects:
      - "sets post_term_collection_end_date from term_end_date and leaves termination_effective_date null"
      - "stamps reversion_eligible_date on the deal's releases without changing their status"
      - "recomputes Distributor.active_deal_count"
      - "increments DistributionDeal.version by 1"

  - method: POST
    path: "/distribution-deals/{id}/enter-post-term-collection"
    description: "Join point of the diamond: {TERMINATION_NOTICE, EXPIRED} -> POST_TERM_COLLECTION, freezing the marketing surface."
    roles: [LabelAdmin]
    code: 200
    input: []
    output: DistributionDeal
    side_effects:
      - "voids every MarketingSpend on the deal's releases with status IN {DRAFT, SUBMITTED, REVISION_REQUESTED}"
      - "increments DistributionDeal.version by 1"

  - method: POST
    path: "/distribution-deals/{id}/close"
    description: "POST_TERM_COLLECTION -> CLOSED: reverts the catalog and terminates every agreement."
    roles: [LabelAdmin]
    code: 200
    input: []
    output: DistributionDeal
    side_effects:
      - "CASCADE HOP 1 releases -> REVERTED; HOP 2 agreements -> TERMINATED; HOP 3 marketing -> VOIDED"
      - "recomputes Distributor.active_deal_count"
      - "increments DistributionDeal.version by 1"

  - method: GET
    path: "/distribution-deals/{id}/recoupment-summary"
    description: >-
      Computed read: evaluates calculations.advance_recoupment_waterfall against the deal's
      current accepted receipts under the requested variant WITHOUT persisting anything. Omitting
      variant evaluates the deal's own cross_collateralized setting; supplying
      CROSS_COLLATERALIZED or SILOED forces that arm, so the two variants can be compared on
      identical database state. The projection is always recomputed from a ZERO baseline: pool_cents
      is the sum of net_receipts_cents over every report of this deal with status == ACCEPTED, every
      release bucket starts at zero, and the persisted advance_recouped_cents /
      release_advance_recouped_cents balances are never read. Without that pinned baseline the SILOED
      arm would be contaminated by the balances the CROSS arm already wrote.
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs]
    code: 200
    input: ["variant?"]
    output: "{ variant: string, pool_net_receipts_cents: integer, advance_amount_cents: integer, advance_applied_cents: integer, unrecouped_advance_cents: integer, post_recoupment_net_receipts_cents: integer, recoupment_status: string, release_breakdown: object[] }"
    side_effects: []

  - method: POST
    path: "/releases"
    description: "Registers a release under a deal; advance_share_cents is its slice of the deal advance."
    roles: [LabelAdmin]
    code: 201
    input: [deal_id, primary_artist_id, upc, title, planned_release_date, formats, "advance_share_cents?"]
    output: Release
    side_effects: ["sets status = PLANNED and zeroes the four release ledger counters"]

  - method: GET
    path: "/releases/{id}"
    description: "Reads one release with its net-receipt and advance-attribution ledger."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner, Artist]
    code: 200
    input: []
    output: Release
    side_effects: []

  - method: GET
    path: "/releases"
    description: "Lists releases; the reverse-reachability channel for Release.deal_id and Release.primary_artist_id."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner, Artist]
    code: 200
    input: ["deal_id?", "primary_artist_id?", "status?", "limit?", "offset?"]
    output: Release[]
    side_effects: []

  - method: POST
    path: "/releases/{id}/release"
    description: "PLANNED -> RELEASED: records the street date; only valid while the deal is EXECUTED."
    roles: [LabelAdmin]
    code: 200
    input: [actual_release_date]
    output: Release
    side_effects: ["sets actual_release_date", "increments Release.version by 1"]

  - method: GET
    path: "/releases/{id}/dsp-revenue-lines"
    description: "Sub-resource listing: every DspRevenueLine attributed to this release across all reports. The only discovery channel for lines by release, since lines are created inside a report."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner]
    code: 200
    input: ["limit?", "offset?"]
    output: DspRevenueLine[]
    side_effects: []

  - method: POST
    path: "/artist-agreements"
    description: "Creates a DRAFT artist agreement; supersedes_agreement_id chains it to the agreement it will replace."
    roles: [LabelAdmin]
    code: 201
    input: [artist_id, release_id, royalty_rate_pct, escalated_royalty_rate_pct, advance_amount_cents, recording_costs_cents, recording_recoupable_pct, marketing_recoup_share_pct, "supersedes_agreement_id?"]
    output: ArtistAgreement
    side_effects: ["sets status = DRAFT; the recoupment balances stay 0 until activation"]

  - method: GET
    path: "/artist-agreements/{id}"
    description: "Reads one agreement including active_royalty_rate_pct and both unrecouped balances."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, Artist]
    code: 200
    input: []
    output: ArtistAgreement
    side_effects: []

  - method: GET
    path: "/artist-agreements"
    description: "Lists agreements; the reverse-reachability channel for artist_id, release_id and the self-referential supersedes_agreement_id."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, Artist]
    code: 200
    input: ["artist_id?", "release_id?", "status?", "supersedes_agreement_id?", "limit?", "offset?"]
    output: ArtistAgreement[]
    side_effects: []

  - method: POST
    path: "/artist-agreements/{id}/activate"
    description: "DRAFT -> ACTIVE: seeds the artist recoupment balances, selects the royalty rate and supersedes the predecessor if any."
    roles: [LabelAdmin]
    code: 200
    input: []
    output: ArtistAgreement
    side_effects:
      - "sets unrecouped_artist_advance_cents and unrecouped_recording_cents"
      - "sets active_royalty_rate_pct per calculations.artist_royalty_rate_selection"
      - "moves the superseded agreement to SUPERSEDED and carries its balances forward"
      - "voids the predecessor's DRAFT / PREPARED statements"
      - "recomputes Artist.unrecouped_advance_total_cents"
      - "increments ArtistAgreement.version by 1"

  - method: POST
    path: "/artist-agreements/{id}/propose-amendment"
    description: "ACTIVE -> AMENDMENT_PENDING: parks a proposed rate and advance without touching the live terms."
    roles: [LabelAdmin]
    code: 200
    input: [proposed_royalty_rate_pct, proposed_advance_amount_cents]
    output: ArtistAgreement
    side_effects: ["stores the two proposed values", "increments ArtistAgreement.version by 1"]

  - method: POST
    path: "/artist-agreements/{id}/resolve-amendment"
    description: "AMENDMENT_PENDING -> ACTIVE under either decision; ACCEPT commits the proposed terms, REJECT discards them, closing the cycle either way."
    roles: [BusinessAffairs]
    code: 200
    input: [decision]
    output: ArtistAgreement
    side_effects:
      - "ACCEPT: copies the proposed values into royalty_rate_pct / advance_amount_cents, raises unrecouped_artist_advance_cents by the positive delta and re-selects active_royalty_rate_pct"
      - "REJECT: leaves every term and balance unchanged"
      - "clears both proposed_* fields"
      - "increments ArtistAgreement.version by 1"

  - method: POST
    path: "/marketing-spends"
    description: "Creates a DRAFT marketing commitment; recoupability is derived from category at creation."
    roles: [LabelAdmin]
    code: 201
    input: [release_id, category, amount_cents, vendor]
    output: MarketingSpend
    side_effects: ["derives recoupability from category per §1.1"]

  - method: GET
    path: "/marketing-spends/{id}"
    description: "Reads one spend including its recoupability and settled amount."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs]
    code: 200
    input: []
    output: MarketingSpend
    side_effects: []

  - method: GET
    path: "/marketing-spends"
    description: "Lists spends; the reverse-reachability channel for MarketingSpend.release_id."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs]
    code: 200
    input: ["release_id?", "status?", "category?", "limit?", "offset?"]
    output: MarketingSpend[]
    side_effects: []

  - method: POST
    path: "/marketing-spends/{id}/submit"
    description: "{DRAFT, REVISION_REQUESTED} -> SUBMITTED. Optional amount_cents / category let the requester answer a revision request in the same call that resubmits."
    roles: [LabelAdmin]
    code: 200
    input: ["amount_cents?", "category?"]
    output: MarketingSpend
    side_effects:
      - "sets requested_by_user_id from X-User-ID"
      - "applies the optional overrides and re-derives recoupability"
      - "clears revision_note"
      - "increments MarketingSpend.version by 1"

  - method: POST
    path: "/marketing-spends/{id}/decide"
    description: "SUBMITTED -> APPROVED / REJECTED / REVISION_REQUESTED. Segregation of duties forbids the requester from deciding."
    roles: [BusinessAffairs]
    code: 200
    input: [decision, "recoupability_override?", "revision_note?"]
    output: MarketingSpend
    side_effects:
      - "sets decided_by_user_id; on APPROVE also approved_at and the optional recoupability_override"
      - "recomputes DistributionDeal.marketing_committed_cents on APPROVE"
      - "increments MarketingSpend.version by 1"

  - method: POST
    path: "/marketing-spends/{id}/settle"
    description: "APPROVED -> SETTLED: records the invoiced actual that the FINAL statement basis reads."
    roles: [LabelAdmin]
    code: 200
    input: [settled_amount_cents]
    output: MarketingSpend
    side_effects:
      - "stores settled_amount_cents"
      - "recomputes DistributionDeal.marketing_committed_cents on the settled basis"
      - "increments MarketingSpend.version by 1"

  - method: POST
    path: "/stream-rate-cards"
    description: "Publishes an immutable per-stream rate for one (dsp_code, territory_code, tier) triple over a half-open window."
    roles: [LabelAdmin]
    code: 201
    input: [dsp_code, territory_code, tier, rate_micros_per_stream, effective_from, "effective_to?"]
    output: StreamRateCard
    side_effects: ["rejects an intersecting window on the same triple with ERR_RATE_CARD_OVERLAP; an adjacent window starting on another's effective_to is accepted"]

  - method: GET
    path: "/stream-rate-cards"
    description: "Lists rate cards, optionally narrowed to one triple."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner]
    code: 200
    input: ["dsp_code?", "territory_code?", "tier?", "limit?", "offset?"]
    output: StreamRateCard[]
    side_effects: []

  - method: POST
    path: "/dsp-revenue-reports"
    description: "Opens a DRAFT revenue report for one deal and one accounting period."
    roles: [DistributionPartner]
    code: 201
    input: [deal_id, dsp_code, period_start, period_end]
    output: DspRevenueReport
    side_effects: ["sets status = DRAFT and zeroes the four money fields"]

  - method: GET
    path: "/dsp-revenue-reports/{id}"
    description: "Reads one report with its gross, distributor share, net and applied-advance figures."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner]
    code: 200
    input: []
    output: DspRevenueReport
    side_effects: []

  - method: GET
    path: "/dsp-revenue-reports"
    description: "Lists reports; the reverse-reachability channel for DspRevenueReport.deal_id."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner]
    code: 200
    input: ["deal_id?", "dsp_code?", "status?", "limit?", "offset?"]
    output: DspRevenueReport[]
    side_effects: []

  - method: POST
    path: "/dsp-revenue-reports/{id}/lines"
    description: "Appends one (release, territory, tier) stream-count line to a DRAFT or DISPUTED report."
    roles: [DistributionPartner]
    code: 201
    input: [release_id, territory_code, tier, stream_count]
    output: DspRevenueLine
    side_effects: ["rejects a territory_code absent from the deal's territory_codes with ERR_INVALID_REQUEST"]

  - method: GET
    path: "/dsp-revenue-reports/{id}/lines"
    description: "Sub-resource listing of the report's lines with their resolved rate and per-line revenue; the reverse-reachability channel for DspRevenueLine.report_id."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner]
    code: 200
    input: ["limit?", "offset?"]
    output: DspRevenueLine[]
    side_effects: []

  - method: POST
    path: "/dsp-revenue-reports/{id}/submit"
    description: "{DRAFT, DISPUTED} -> SUBMITTED: resolves every line's rate card and prices the report."
    roles: [DistributionPartner]
    code: 200
    input: []
    output: DspRevenueReport
    side_effects:
      - "runs calculations.dsp_line_revenue then calculations.deal_net_receipts"
      - "sets submitted_by_user_id and clears dispute_reason"
      - "increments DspRevenueReport.version by 1"

  - method: POST
    path: "/dsp-revenue-reports/{id}/accept"
    description: "SUBMITTED -> ACCEPTED: allocates net receipts to lines and releases and drives the five-hop advance cascade. OCC-guarded on the deal (§1.2.1 report-accept-stale-deal)."
    roles: [RoyaltyAnalyst]
    code: 200
    input: [expected_deal_version]
    output: DspRevenueReport
    side_effects:
      - "writes DspRevenueLine.net_receipts_cents, then Release / DistributionDeal net receipts, then the advance waterfall, then recoupment_status, then every governed ArtistAgreement.active_royalty_rate_pct"
      - "sets accepted_at"
      - "increments DspRevenueReport.version by 1 and DistributionDeal.version by 1"

  - method: POST
    path: "/dsp-revenue-reports/{id}/dispute"
    description: "{SUBMITTED, ACCEPTED} -> DISPUTED: from ACCEPTED it runs the four-hop compensation that restores the advance ledger exactly. OCC-guarded on the deal (§1.2.1 report-dispute-stale-deal)."
    roles: [RoyaltyAnalyst]
    code: 200
    input: [expected_deal_version, dispute_reason]
    output: DspRevenueReport
    side_effects:
      - "clears the lines' net_receipts_cents, reverses the release and deal net receipts, reverses the applied advance and re-selects every governed royalty rate"
      - "stores dispute_reason"
      - "increments DspRevenueReport.version by 1 and DistributionDeal.version by 1"

  - method: POST
    path: "/physical-runs"
    description: "Plans a manufacturing run for a release whose formats contain at least one of {VINYL, CD, CASSETTE} (else ERR_INVALID_RELEASE_STATE 409); returns_reserve_pct defaults to the distributor's default_returns_reserve_pct when omitted."
    roles: [LabelAdmin]
    code: 201
    input: [release_id, distributor_id, units_planned, unit_manufacturing_cost_cents, window_start, window_end, "returns_reserve_pct?"]
    output: PhysicalRun
    side_effects: ["sets status = PLANNED and reserve_status = HELD"]

  - method: GET
    path: "/physical-runs/{id}"
    description: "Reads one run on both dimensions; the source of the version value echoed into expected_run_version."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner]
    code: 200
    input: []
    output: PhysicalRun
    side_effects: []

  - method: GET
    path: "/physical-runs"
    description: "Lists runs; the reverse-reachability channel for PhysicalRun.release_id and PhysicalRun.distributor_id."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, DistributionPartner]
    code: 200
    input: ["release_id?", "distributor_id?", "status?", "reserve_status?", "limit?", "offset?"]
    output: PhysicalRun[]
    side_effects: []

  - method: POST
    path: "/physical-runs/{id}/manufacture"
    description: "PLANNED -> MANUFACTURED: books the actual production quantity and cost."
    roles: [LabelAdmin]
    code: 200
    input: [units_manufactured]
    output: PhysicalRun
    side_effects: ["sets manufacturing_cost_cents", "increments PhysicalRun.version by 1"]

  - method: POST
    path: "/physical-runs/{id}/ship"
    description: "MANUFACTURED -> SHIPPED: prices the shipment, sizes the returns reserve and enforces the inventory obligation."
    roles: [DistributionPartner]
    code: 200
    input: [units_shipped, wholesale_unit_price_cents]
    output: PhysicalRun
    side_effects:
      - "runs calculations.returns_reserve_obligation with units_returned == 0"
      - "raises Release.net_receipts_to_date_cents and DistributionDeal.net_receipts_to_date_cents by physical_net_receipts_cents"
      - "increments PhysicalRun.version by 1"

  - method: POST
    path: "/physical-runs/{id}/record-returns"
    description: "Self-loop on SHIPPED: adds returned units, re-tiers the reserve and re-derives physical net receipts."
    roles: [DistributionPartner]
    code: 200
    input: [returned_units]
    output: PhysicalRun
    side_effects:
      - "adds returned_units to units_returned and re-runs calculations.returns_reserve_obligation"
      - "adjusts Release and DistributionDeal net receipts by the delta"
      - "increments PhysicalRun.version by 1"

  - method: POST
    path: "/physical-runs/{id}/liquidate-reserve"
    description: "Releases part or all of the returns reserve; full liquidation also closes the fulfilment dimension. OCC-guarded on the run (§1.2.1 reserve-liquidation-stale-run)."
    roles: [RoyaltyAnalyst]
    code: 200
    input: [expected_run_version, liquidation_pct]
    output: PhysicalRun
    side_effects:
      - "moves round_half_up(reserve_initial_cents * liquidation_pct) from reserve_held_cents to reserve_liquidated_cents"
      - "moves reserve_status HELD -> PARTIALLY_LIQUIDATED -> LIQUIDATED and, on full liquidation, status SHIPPED -> RECONCILED"
      - "increments PhysicalRun.version by 1"

  - method: POST
    path: "/physical-runs/{id}/void-liquidation"
    description: "Compensating action: pulls every liquidated cent back into reserve_held_cents, preserving reserve_initial_cents. OCC-guarded on the run (§1.2.1 reserve-void-stale-run)."
    roles: [RoyaltyAnalyst]
    code: 200
    input: [expected_run_version]
    output: PhysicalRun
    side_effects:
      - "sets reserve_liquidated_cents = 0 and restores reserve_held_cents = reserve_initial_cents"
      - "moves reserve_status back to HELD and, if it was LIQUIDATED, status RECONCILED -> SHIPPED"
      - "increments PhysicalRun.version by 1"

  - method: POST
    path: "/artist-statements"
    description: "Opens a DRAFT statement for one agreement, one period and one basis variant."
    roles: [RoyaltyAnalyst]
    code: 201
    input: [artist_agreement_id, period_start, period_end, basis_variant]
    output: ArtistStatement
    side_effects: ["sets status = DRAFT, audit_status = NONE and zeroes every money field"]

  - method: GET
    path: "/artist-statements/{id}"
    description: "Reads one statement on both dimensions with the full deduction waterfall; the reverse-reachability channel's single-resource anchor."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, Artist]
    code: 200
    input: []
    output: ArtistStatement
    side_effects: []

  - method: GET
    path: "/artist-statements"
    description: "Lists statements; the reverse-reachability channel for ArtistStatement.artist_agreement_id."
    roles: [LabelAdmin, RoyaltyAnalyst, BusinessAffairs, Artist]
    code: 200
    input: ["artist_agreement_id?", "status?", "basis_variant?", "limit?", "offset?"]
    output: ArtistStatement[]
    side_effects: []

  - method: POST
    path: "/artist-statements/{id}/prepare"
    description: "{DRAFT, REVISED} -> PREPARED: runs the rate selection, the marketing cap and the full net-payable waterfall under the statement's basis_variant."
    roles: [RoyaltyAnalyst]
    code: 200
    input: []
    output: ArtistStatement
    side_effects:
      - "writes applied_royalty_rate_pct, both royalty bases, gross_royalty_cents, the three applied buckets, reserve_withheld_cents and net_payable_cents"
      - "sets prepared_by_user_id; on the REVISED edge also increments revision_count"
      - "increments ArtistStatement.version by 1"

  - method: POST
    path: "/artist-statements/{id}/issue"
    description: "{PREPARED, OBJECTED} -> ISSUED: publishes a FINAL statement to the artist and opens the objection window. Segregation of duties forbids the preparer from issuing."
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: ArtistStatement
    side_effects:
      - "sets issued_at, issued_by_user_id and objection_deadline"
      - "increments ArtistStatement.version by 1"

  - method: POST
    path: "/artist-statements/{id}/object"
    description: "ISSUED -> OBJECTED: the artist files an objection inside the window."
    roles: [Artist]
    code: 200
    input: [objection_reason_code, objection_disputed_amount_cents, objection_narrative]
    output: ArtistStatement
    side_effects:
      - "stores the four objection fields including objection_filed_at"
      - "increments ArtistStatement.version by 1"

  - method: POST
    path: "/artist-statements/{id}/resolve-objection"
    description: "OBJECTED -> ISSUED on DENIED, OBJECTED -> REVISED on UPHELD; the UPHELD arm reopens the statement cycle."
    roles: [BusinessAffairs]
    code: 200
    input: [resolution, "objection_adjustment_cents?"]
    output: ArtistStatement
    side_effects:
      - "stores objection_resolution and, on UPHELD, objection_adjustment_cents"
      - "on UPHELD clears issued_at, issued_by_user_id and objection_deadline"
      - "increments ArtistStatement.version by 1"

  - method: POST
    path: "/artist-statements/{id}/finalize"
    description: "{ISSUED, PREPARED} -> FINALIZED: the only transition that debits the artist recoupment ledgers."
    roles: [BusinessAffairs]
    code: 200
    input: []
    output: ArtistStatement
    side_effects:
      - "debits ArtistAgreement.unrecouped_artist_advance_cents and unrecouped_recording_cents, raises Release.recoupable_marketing_applied_cents"
      - "sets finalized_at and recomputes Artist.lifetime_paid_cents and Artist.unrecouped_advance_total_cents"
      - "increments ArtistStatement.version by 1 and ArtistAgreement.version by 1"

  - method: POST
    path: "/artist-statements/{id}/request-audit"
    description: "audit dimension NONE -> AUDIT_REQUESTED: the artist exercises audit rights within 365 days of finalization."
    roles: [Artist]
    code: 200
    input: [audit_scope_period_start, audit_scope_period_end, auditor_name]
    output: ArtistStatement
    side_effects:
      - "stores the audit scope and the auditor"
      - "increments ArtistStatement.version by 1"

  - method: POST
    path: "/artist-statements/{id}/conclude-audit"
    description: "audit dimension AUDIT_REQUESTED -> AUDIT_COMPLETED / AUDIT_DENIED; a material finding also pulls the accounting dimension FINALIZED -> REVISED and credits the ledgers back."
    roles: [BusinessAffairs]
    code: 200
    input: [findings_adjustment_cents]
    output: ArtistStatement
    side_effects:
      - "stores audit_findings_adjustment_cents and audit_cost_bearer"
      - "on a material in-scope finding reverses the finalize debit exactly, clears issued_at / objection_deadline / finalized_at and moves status to REVISED"
      - "when the stored audit scope reaches outside [period_start, period_end] the audit dimension goes to AUDIT_DENIED, audit_findings_adjustment_cents stays null and the status axis does not move"
      - "increments ArtistStatement.version by 1"

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, empty, or whitespace-only"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed role acts on a resource whose owning foreign key is a different id"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals MarketingSpend.requested_by_user_id on decide, or ArtistStatement.prepared_by_user_id on issue / resolve-objection / finalize / conclude-audit"

  - id: ERR_DISTRIBUTOR_NOT_FOUND
    http: 404
    condition: "no Distributor with the given id (path or body)"
  - id: ERR_ARTIST_NOT_FOUND
    http: 404
    condition: "no Artist with the given id (path or body)"
  - id: ERR_DEAL_NOT_FOUND
    http: 404
    condition: "no DistributionDeal with the given id (path or body)"
  - id: ERR_RELEASE_NOT_FOUND
    http: 404
    condition: "no Release with the given id (path or body)"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "no ArtistAgreement with the given id (path, artist_agreement_id, or supersedes_agreement_id)"
  - id: ERR_MARKETING_SPEND_NOT_FOUND
    http: 404
    condition: "no MarketingSpend with the given id"
  - id: ERR_REVENUE_REPORT_NOT_FOUND
    http: 404
    condition: "no DspRevenueReport with the given id"
  - id: ERR_PHYSICAL_RUN_NOT_FOUND
    http: 404
    condition: "no PhysicalRun with the given id"
  - id: ERR_STATEMENT_NOT_FOUND
    http: 404
    condition: "no ArtistStatement with the given id"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "schema violation: missing required field, wrong type, unknown enum member, percentage outside range or not exactly four decimals, negative money, malformed or mis-ordered dates, upc outside 12..14 digits, empty or duplicated territory_codes, deal_type conditional field present when it must be null or absent when required, DspRevenueLine.territory_code absent from the deal's territory_codes, units_shipped greater than units_manufactured, settled_amount_cents greater than amount_cents, liquidation_pct outside (0.0000, 1.0000]"

  - id: ERR_STALE_DEAL_VERSION
    http: 412
    condition: "expected_deal_version does not equal DistributionDeal.version on accept or dispute"
  - id: ERR_STALE_RUN_VERSION
    http: 412
    condition: "expected_run_version does not equal PhysicalRun.version on liquidate-reserve or void-liquidation"

  - id: ERR_INVALID_DEAL_STATE
    http: 409
    condition: "the deal's status is not a declared from-state of the requested transition, or a dependent operation requires a deal state the deal is not in"
  - id: ERR_INVALID_RELEASE_STATE
    http: 409
    condition: "the release's status is not a declared from-state of the requested transition, or an agreement / run operation requires a release state the release is not in, or POST /physical-runs targets a release whose formats contain no physical format"
  - id: ERR_INVALID_AGREEMENT_STATE
    http: 409
    condition: "the agreement's status is not a declared from-state of the requested transition, or supersedes_agreement_id points at an agreement that is not ACTIVE on the same release"
  - id: ERR_INVALID_SPEND_STATE
    http: 409
    condition: "the spend's status is not a declared from-state of submit / decide / settle"
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "the report's status is not a declared from-state of lines / submit / accept / dispute, or a submit is attempted on a report with zero lines"
  - id: ERR_INVALID_RUN_STATE
    http: 409
    condition: "the run's status or reserve_status is not a declared from-state of the requested transition"
  - id: ERR_INVALID_STATEMENT_STATE
    http: 409
    condition: "the statement's status or audit_status is not a declared from-state of the requested transition, a finalize is attempted while audit_status == AUDIT_REQUESTED, or a dispute / void-liquidation would disturb figures a FINALIZED statement already read"

  - id: ERR_DEAL_NOT_COLLECTING
    http: 409
    condition: "accept is attempted while the deal's status is outside {EXECUTED, TERMINATION_NOTICE, POST_TERM_COLLECTION}"
  - id: ERR_AGREEMENT_NOT_STATEMENTABLE
    http: 409
    condition: "a statement is opened or prepared against an agreement whose status is SUPERSEDED or TERMINATED"
  - id: ERR_RELEASE_NOT_PROMOTABLE
    http: 409
    condition: "a marketing spend is created, submitted or approved against a release whose status is REVERSION_PENDING or REVERTED"

  - id: ERR_RATE_CARD_OVERLAP
    http: 409
    condition: "a new StreamRateCard's half-open window intersects an existing card on the same (dsp_code, territory_code, tier) triple"
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 409
    condition: "a FINAL statement's closed period intersects another non-VOIDED FINAL statement on the same agreement, including a single-day touch"
  - id: ERR_DUPLICATE_UPC
    http: 409
    condition: "another Release already carries the supplied upc"
  - id: ERR_OPEN_OBJECTIONS_BLOCK_CLOSE
    http: 409
    condition: "close is attempted while a statement on the deal is OBJECTED with objection_resolution == null"

  - id: ERR_STATEMENT_PERIOD_NOT_CONTIGUOUS
    http: 422
    condition: "a FINAL statement's period_start is not the day after the latest non-VOIDED FINAL period_end on the same agreement"
  - id: ERR_RATE_CARD_NOT_FOUND
    http: 422
    condition: "a line's (dsp_code, territory_code, tier) triple resolves no StreamRateCard whose half-open window covers report.period_end"
  - id: ERR_PERIOD_OUTSIDE_TERM
    http: 422
    condition: "the reported or accounted period falls outside [term_start_date, coalesce(post_term_collection_end_date, term_end_date)]; on POST /releases/{id}/release the single actual_release_date falls outside [term_start_date, term_end_date]"
  - id: ERR_TERM_NOT_ENDED
    http: 422
    condition: "expire is attempted on or before term_end_date"
  - id: ERR_POST_TERM_COLLECTION_ACTIVE
    http: 422
    condition: "close is attempted on or before post_term_collection_end_date"
  - id: ERR_OBJECTION_WINDOW_CLOSED
    http: 422
    condition: "an objection is filed strictly after objection_deadline"
  - id: ERR_OBJECTION_WINDOW_OPEN
    http: 422
    condition: "finalize is attempted at or before objection_deadline while that deadline is set"
  - id: ERR_AUDIT_WINDOW_EXPIRED
    http: 422
    condition: "request-audit is attempted more than AUDIT_RIGHTS_WINDOW_DAYS (365) days after finalized_at"
  - id: ERR_PROVISIONAL_NOT_ISSUABLE
    http: 422
    condition: "issue is attempted on a statement whose basis_variant is PROVISIONAL"
  - id: ERR_DISPUTED_AMOUNT_EXCEEDS_NET
    http: 422
    condition: "objection_disputed_amount_cents exceeds net_payable_cents + marketing_applied_cents + reserve_withheld_cents"
  - id: ERR_MARKETING_BUDGET_EXCEEDED
    http: 422
    condition: "approving or settling the spend would push DistributionDeal.marketing_committed_cents above marketing_budget_cents"
  - id: ERR_ADVANCE_ALLOCATION_EXCEEDED
    http: 422
    condition: "the sum of advance_share_cents over the deal's non-REVERTED releases would exceed deal.advance_amount_cents"
  - id: ERR_INVENTORY_OBLIGATION_BREACH
    http: 422
    condition: "units_manufactured - units_shipped is below ceil(units_shipped * INVENTORY_OBLIGATION_PCT)"
  - id: ERR_RETURNS_EXCEED_SHIPPED
    http: 422
    condition: "cumulative units_returned would exceed units_shipped"
  - id: ERR_LIQUIDATION_EXCEEDS_RESERVE
    http: 422
    condition: "round_half_up(reserve_initial_cents * liquidation_pct) exceeds reserve_held_cents"

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:
  - name: LabelAdmin
    description: "Label operations: sets up distributors, artists, deals, releases, agreements, marketing requests, rate cards and manufacturing runs, and drives the deal lifecycle."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /distributors"
      - "POST /artists"
      - "POST /distribution-deals and every /distribution-deals/{id}/<lifecycle> action"
      - "POST /releases, POST /releases/{id}/release"
      - "POST /artist-agreements, POST /artist-agreements/{id}/activate, POST /artist-agreements/{id}/propose-amendment"
      - "POST /marketing-spends, POST /marketing-spends/{id}/submit, POST /marketing-spends/{id}/settle"
      - "POST /stream-rate-cards"
      - "POST /physical-runs, POST /physical-runs/{id}/manufacture"
    shared_operations:
      - "every GET on distributors, artists, deals, releases, agreements, spends, rate cards, reports, report lines, runs and statements"

  - name: DistributionPartner
    description: "The distribution counterparty: reports DSP revenue and ships physical product. Acts only on rows whose owning foreign key is its own Distributor id."
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /dsp-revenue-reports"
      - "POST /dsp-revenue-reports/{id}/lines"
      - "POST /dsp-revenue-reports/{id}/submit"
      - "POST /physical-runs/{id}/ship"
      - "POST /physical-runs/{id}/record-returns"
    shared_operations:
      - "GET /distributors/{id}, GET /distribution-deals, GET /distribution-deals/{id}, GET /releases, GET /releases/{id}, GET /releases/{id}/dsp-revenue-lines, GET /stream-rate-cards, GET /dsp-revenue-reports, GET /dsp-revenue-reports/{id}, GET /dsp-revenue-reports/{id}/lines, GET /physical-runs, GET /physical-runs/{id}"

  - name: RoyaltyAnalyst
    description: "Prepares the books: accepts or disputes revenue reports, liquidates returns reserves and prepares artist statements. Never issues or finalizes what it prepared."
    identity: opaque
    exclusive_operations:
      - "POST /dsp-revenue-reports/{id}/accept"
      - "POST /dsp-revenue-reports/{id}/dispute"
      - "POST /physical-runs/{id}/liquidate-reserve"
      - "POST /physical-runs/{id}/void-liquidation"
      - "POST /artist-statements"
      - "POST /artist-statements/{id}/prepare"
    shared_operations:
      - "every GET except GET /distributors/{id}"

  - name: BusinessAffairs
    description: "Approves and publishes: decides marketing spends, resolves agreement amendments, issues and finalizes statements, resolves objections and concludes audits."
    identity: opaque
    exclusive_operations:
      - "POST /marketing-spends/{id}/decide"
      - "POST /artist-agreements/{id}/resolve-amendment"
      - "POST /artist-statements/{id}/issue"
      - "POST /artist-statements/{id}/resolve-objection"
      - "POST /artist-statements/{id}/finalize"
      - "POST /artist-statements/{id}/conclude-audit"
    shared_operations:
      - "every GET except GET /distributors/{id}"

  - name: Artist
    description: "The recording artist: reads own statements, files objections and exercises audit rights. Acts only on statements whose agreement's artist_id is its own Artist id."
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /artist-statements/{id}/object"
      - "POST /artist-statements/{id}/request-audit"
    shared_operations:
      - "GET /artists/{id}, GET /releases, GET /releases/{id}, GET /artist-agreements, GET /artist-agreements/{id}, GET /artist-statements, GET /artist-statements/{id}"
