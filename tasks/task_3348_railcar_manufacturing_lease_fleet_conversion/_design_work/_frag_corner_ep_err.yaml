          - concurrency_rules[amendment-redraft-stale-contract]
          - "POST /api/v1/lease-contracts/{id}/amendments"
        distinguishing_aspect: "Drafting an amendment with expected_lease_version one below the contract's current version is rejected 412 ERR_STALE_VERSION with the contract left ACTIVE and unversioned, while the identical call carrying the current version succeeds and moves it to AMENDMENT_DRAFTED."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-09-01T00:00:00Z."
            - "Lessee \"Stale Amendment Rail Co\" holds contract LC-K, activated so it stands ACTIVE at version 2 (create 1 -> activate 2)."
            - "The amendment body is identical in both attempts — per_diem_rate_cents 1500 and liability_bearer LESSEE — so only the expected_lease_version differs."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/lessees"
              payload: { legal_name: "Stale Amendment Rail Co", credit_tier: "B", utilization_threshold_pct: 0, credit_ceiling_cents: 1000000 }
              as: LeaseAdministrator
              captures: { lessee_id: $.data.id }
            - call: "POST /api/v1/lease-contracts"
              payload: { lessee_id: "${lessee_id}", lease_type: "FULL_SERVICE", per_diem_rate_cents: 1000, liability_bearer: "LESSOR", term_start_date: "2026-09-01", term_end_date: "2027-09-01", fleet_car_cap: 5 }
              as: LeaseAdministrator
              captures: { lc_id: $.data.id }
            - call: "POST /api/v1/lease-contracts/${lc_id}/activate"
              payload: {}
              as: LeaseAdministrator
              captures: { lc_status: $.data.status, lc_v: $.data.version }
          trigger:
            - call: "POST /api/v1/lease-contracts/${lc_id}/amendments"
              payload: { per_diem_rate_cents: 1500, liability_bearer: "LESSEE", expected_lease_version: "${lc_v} - 1" }
              as: LeaseAdministrator
              captures: { err_stale: $.data.error_id }
            - call: "GET /api/v1/lease-contracts/${lc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { lc_after_reject: $.data.status, lc_v_after_reject: $.data.version }
            - call: "POST /api/v1/lease-contracts/${lc_id}/amendments"
              payload: { per_diem_rate_cents: 1500, liability_bearer: "LESSEE", expected_lease_version: "${lc_v}" }
              as: LeaseAdministrator
              captures: { lc_drafted: $.data.status, lc_v_drafted: $.data.version }
          assert:
            - "The contract stood ACTIVE at version ${lc_v} == 2 after activation"
            - "The stale draft returns HTTP 412 with data.error_id == ${err_stale} == \"ERR_STALE_VERSION\", the priority-7 OCC rule named by concurrency_rules[amendment-redraft-stale-contract]"
            - "The rejection is atomic: GET /lease-contracts/${lc_id} still reports status == ${lc_after_reject} == \"ACTIVE\" at version == ${lc_v_after_reject} == ${lc_v}"
            - "The stale version was the only difference — ${lc_v} - 1 versus ${lc_v} — so the 412 is caused by the version mismatch rather than by the rate or bearer in the body"
            - "The same call carrying the observed version succeeds: HTTP 200 with data.status == ${lc_drafted} == \"AMENDMENT_DRAFTED\" and data.version == ${lc_v_drafted} == 3"
            - "The write bumps the parent version exactly once, so a second draft built on the stale ${lc_v} would now also be rejected"

