              captures: { cycle_id: "$.data.id" }
            - call: "POST /detention-facilities"
              payload: { name: "El Paso Service Processing Center", jurisdiction_code: "TX-ELP", visit_lead_time_hours: 48, max_daily_visit_slots: 1, expedited_filing_days: 30, access_credential_required: false }
              as: ProgramDirector
              captures: { f1_id: "$.data.id" }
            - call: "POST /detention-facilities"
              payload: { name: "Eloy Detention Annex", jurisdiction_code: "AZ-ELO", visit_lead_time_hours: 24, max_daily_visit_slots: 0, expedited_filing_days: 30, access_credential_required: false }
              as: ProgramDirector
              captures: { f0_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Nadia Okonjo", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 25, max_supervisees: 6, weekly_capacity_hours: 40, bar_number: "TX-980001" }
              as: ProgramDirector
              captures: { screener_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Dov Halberstam", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 10, max_supervisees: 5, weekly_capacity_hours: 40, bar_number: "TX-980002" }
              as: ProgramDirector
              captures: { atty_a_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Vera Ilyich", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 10, max_supervisees: 3, weekly_capacity_hours: 40, bar_number: "TX-980003" }
              as: ProgramDirector
              captures: { rep_v1_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Wole Adeyemi", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 10, max_supervisees: 3, weekly_capacity_hours: 40, bar_number: "TX-980004" }
              as: ProgramDirector
              captures: { rep_v2_id: "$.data.id" }
            - call: "POST /representatives"
              payload: { full_name: "Sanne de Vries", rep_type: "STAFF_ATTORNEY", languages: ["en"], max_case_load: 10, max_supervisees: 3, weekly_capacity_hours: 40, bar_number: "TX-980005" }
              as: ProgramDirector
              captures: { rep_v3_id: "$.data.id" }
            - call: "POST /clients"
              payload: { full_name: "Amara Nwosu", preferred_language_code: "en", country_of_birth_code: "NG", date_of_birth: "1990-07-07", household_size: 1, annual_household_income_cents: 2000000, confidentiality_consent_scope: "PROGRAM_ONLY", interpreter_required: false }
              as: ProgramDirector
              captures: { c1_id: "$.data.id" }
            - call: "PATCH /clients/${c1_id}"
              payload: { status: "ACTIVE" }
              as: ProgramDirector
