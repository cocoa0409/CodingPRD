            - call: "POST /governance/board-members"
              payload: { full_name: "Ada Reyes", seat_number: 1, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Reyes Dental", office: "PRESIDENT" }
              as: BoardClerk
              captures: { bm1: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Ben Cole", seat_number: 2, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Cole Freight" }
              as: BoardClerk
              captures: { bm2: $.data.id }
            - call: "POST /governance/board-members"
              payload: { full_name: "Cara Lin", seat_number: 3, term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2030-12-31T00:00:00Z", employer_name: "Lin Architects" }
