# =============================================================================
# §1.9 Scaffold Corner Design — sterile-fill-finish-cmo
#
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walked row-by-row against
# references/claim-extraction-guide.md. §1.8 (SCAFFOLD_DIFFICULTY_DESIGN.yaml)
# is the depth probe; every corner it already asserts appears here as an
# `excluded_because:` stub citing that instance by name.
#
# Conventions shared with §1.8:
#   * the logical clock is pinned with POST /_clock/set_current_utc as the first
#     call of every chain (startup default is 2026-08-01T00:00:00Z);
#   * every ${var} is bound by a `captures:` block earlier in the same instance;
#   * every numeric assert is a literal computed against the §1.3 formulas;
#   * negative instances name the header/role/payload they deliberately violate
#     in `setup:`, because the structured `as:` key can only carry a role name.
# =============================================================================

scaffold_corner_design:

  - section: entities
    instances:

      - name: client_project_creation_stamps_system_defaults_and_zero_ledgers
        claim_type: creation
        grounds:
          - entities.ClientProject
          - endpoints[POST /client-projects]
          - response_envelope
        distinguishing_aspect: "POST /client-projects with the seven required input fields returns 201 and stamps tech_transfer_stage NOT_STARTED, analytical_method_transfer_status NOT_STARTED, status INTAKE, committed_demand_units 0, open_deviation_risk_total 0, last_client_audit_finding_count 0 and version 1 — none of which the caller may supply."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "One FillingSuite FS-1 exists so primary_suite_id resolves."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
          trigger:
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ClientProject.${proj_id}.status == INTAKE"
            - "ClientProject.${proj_id}.tech_transfer_stage == NOT_STARTED"
            - "ClientProject.${proj_id}.analytical_method_transfer_status == NOT_STARTED"
            - "ClientProject.${proj_id}.committed_demand_units == 0"
            - "ClientProject.${proj_id}.open_deviation_risk_total == 0"
            - "ClientProject.${proj_id}.last_client_audit_finding_count == 0"
            - "ClientProject.${proj_id}.version == 1"
            - "ClientProject.${proj_id}.target_fill_weight_mg == 1000 and reserved_unit_budget == 30000"

      - name: client_project_get_returns_success_envelope_with_meta_and_object_data
        claim_type: retrieval
        grounds:
          - response_envelope
          - endpoints[GET /client-projects/{id}]
        distinguishing_aspect: "GET /client-projects/{id} wraps the row in the declared success envelope: meta.api_request_id and meta.api_request_timestamp are present, response_type == 'object', and data carries the stored field values — no bare entity body."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ClientProject 'Sponsor A' exists in INTAKE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /client-projects/${proj_id}"
              as: QaReviewer
          assert:
            - "HTTP status == 200"
            - "response.meta.api_request_id is a non-empty string and response.meta.api_request_timestamp is an ISO8601 string"
            - "response.response_type == 'object'"
            - "response.data.id == ${proj_id} and response.data.client_name == 'Sponsor A' and response.data.molecule_name == 'MOL-A'"

      - name: component_lot_creation_defaults_to_quarantine_with_zero_available
        claim_type: defaults
        grounds:
          - entities.ComponentLot.fields.status
          - entities.ComponentLot.fields.quantity_available
          - entities.ComponentLot.fields.sterilization_validation_status
          - state_machines.ComponentLot.status.QUARANTINE_to_RELEASED
        distinguishing_aspect: "A newly created ComponentLot defaults to status QUARANTINE, sterilization_validation_status PENDING and quantity_available 0 even though quantity_received is 30000 — the received units only become available when POST /component-lots/{id}/sterilization-validation releases the lot, which sets quantity_available := quantity_received."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ClientProject 'Sponsor A' exists (status INTAKE is sufficient — lot registration is not gated on project status)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "VIAL", lot_code: "VL-1", quantity_received: 30000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              captures: { lot_id: $.data.id }
            - call: "POST /component-lots/${lot_id}/sterilization-validation"
              payload: { outcome: "RELEASED", f0_minutes: 15 }
              as: MicrobiologyAnalyst
          assert:
            - "after trigger call 1: ComponentLot.${lot_id}.status == QUARANTINE, sterilization_validation_status == PENDING, quantity_available == 0, quantity_received == 30000, version == 1"
            - "after trigger call 2: ComponentLot.${lot_id}.status == RELEASED, sterilization_validation_status == RELEASED, quantity_available == 30000, version == 2"

      - name: batch_order_missing_required_target_fill_units_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=32]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /batch-orders]
        distinguishing_aspect: "POST /batch-orders with target_fill_units omitted returns ERR_INVALID_REQUEST (400) and creates no row — the required-field check at priority 32 fires before any state, temporal or fiscal rule, so no ERR_SUITE_CHANGEOVER_CONFLICT or budget error can mask it."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "FS-1 QUALIFIED, OP-A QUALIFIED, ClientProject 'Sponsor A' ACTIVE with reserved_unit_budget 50000 — every other precondition of POST /batch-orders is satisfied."
            - "The trigger payload deliberately omits the required target_fill_units field."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { mf1_id: $.data.id }
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 6000, participating_operator_names: ["OP-A"] }
              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 0 }
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_a_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 50000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "GAP_ASSESSMENT", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "ENGINEERING_RUN", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "COMPLETE", analytical_method_transfer_status: "VALIDATED" }
              as: ProgramManager
            - call: "GET /filling-suites/${suite_id}"
              as: ProgramManager
              captures: { suite_v1: $.data.version }
          trigger:
            - call: "POST /batch-orders"
              payload: { client_project_id: "${proj_id}", suite_id: "${suite_id}", lead_operator_qualification_id: "${pq_a_id}", batch_number: "B-001", planned_start: "2026-09-10T08:00:00Z", planned_end: "2026-09-10T16:00:00Z", expected_suite_version: "${suite_v1}" }
              as: ProgramManager
          assert:
            - "HTTP status == 400"
            - "error.id == 'ERR_INVALID_REQUEST'"
            - "GET /batch-orders?client_project_id=${proj_id} returns 0 rows"
            - "FillingSuite.${suite_id}.committed_minutes == 0 and ClientProject.${proj_id}.committed_demand_units == 0"

      - name: component_lot_invalid_component_type_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=34]
          - errors[ERR_INVALID_ENUM_VALUE]
          - entities.ComponentLot.fields.component_type
        distinguishing_aspect: "component_type 'AMPOULE' is outside the declared set {VIAL, STOPPER, SYRINGE, PLUNGER} and must return ERR_INVALID_ENUM_VALUE (422) — a 400 ERR_INVALID_REQUEST is wrong, because the field is present and of the declared JSON type."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ClientProject 'Sponsor A' exists."
            - "The trigger sends component_type 'AMPOULE', which is not a declared enum member."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "AMPOULE", lot_code: "AM-1", quantity_received: 1000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
          assert:
            - "HTTP status == 422"
            - "error.id == 'ERR_INVALID_ENUM_VALUE'"
            - "GET /component-lots?client_project_id=${proj_id} returns 0 rows"

      - name: em_sample_grade_c_computed_limits_and_alert_classification_stamped
        claim_type: computed_fields
        grounds:
          - calculations.em_sample_limits
          - calculations.em_sample_classification
          - calculations.em_excursion_risk_index
          - entities.EmSample.fields.alert_limit
          - entities.EmSample.fields.action_limit
          - entities.EmSample.fields.investigation_status
        distinguishing_aspect: "A grade-C VIABLE_AIR sample at cfu 60 has its limits stamped from EM_LIMITS at creation (alert 50, action 100), classifies ALERT because 60 >= 50 but 60 < 100, and receives risk_index round_half_up(60/100 * 20 * 1.0) = 12 with investigation_status OPEN — the caller supplies only suite_id, sample_type and cfu_count."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "FillingSuite FS-C of grade C exists; no media fill and no qualifications, so its posture is RESTRICTED for reasons unrelated to this sample."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-C", grade: "C", changeover_minutes_same_product: 30, changeover_minutes_product_change: 120, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_c_id: $.data.id }
          trigger:
            - call: "POST /em-samples"
              payload: { suite_id: "${suite_c_id}", sample_type: "VIABLE_AIR", cfu_count: 60 }
              as: MicrobiologyAnalyst
              captures: { em_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "EmSample.${em_id}.alert_limit == 50 and EmSample.${em_id}.action_limit == 100"
            - "EmSample.${em_id}.classification == ALERT"
            - "EmSample.${em_id}.risk_index == 12"
            - "EmSample.${em_id}.investigation_status == OPEN"
            - "EmSample.${em_id}.root_cause is null"
            - "FillingSuite.${suite_c_id}.open_action_excursion_count == 0"

      - name: batch_order_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=30]
          - errors[ERR_BATCH_ORDER_NOT_FOUND]
          - endpoints[GET /batch-orders/{id}]
        distinguishing_aspect: "GET /batch-orders/00000000-0000-0000-0000-000000000000 returns ERR_BATCH_ORDER_NOT_FOUND (404) even on an otherwise empty database — the path-id check at priority 30 runs after authentication but before any business rule."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No BatchOrder rows exist."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "GET /batch-orders/00000000-0000-0000-0000-000000000000"
              as: ProgramManager
          assert:
            - "HTTP status == 404"
            - "error.id == 'ERR_BATCH_ORDER_NOT_FOUND'"
            - "response.response_type == 'error'"

      - name: component_lot_list_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints[GET /component-lots]
        distinguishing_aspect: "With three lots registered, GET /component-lots?client_project_id=X&limit=2&offset=0 returns 2 rows with total_count 3 and has_more true, and offset=2 returns the remaining 1 row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ClientProject 'Sponsor A' with exactly three ComponentLot rows: VL-1 (VIAL), ST-1 (STOPPER) and VL-2 (VIAL)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "VIAL", lot_code: "VL-1", quantity_received: 30000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "STOPPER", lot_code: "ST-1", quantity_received: 30000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "VIAL", lot_code: "VL-2", quantity_received: 15000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "GET /component-lots?client_project_id=${proj_id}&limit=2&offset=0"
              as: ProgramManager
            - call: "GET /component-lots?client_project_id=${proj_id}&limit=2&offset=2"
              as: ProgramManager
            - call: "GET /component-lots?client_project_id=${proj_id}&component_type=VIAL"
              as: ProgramManager
          assert:
            - "trigger call 1: response_type == 'array', 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "trigger call 2: 1 row returned, total_count == 3, has_more == false, offset == 2"
            - "trigger call 3: 2 rows returned (VL-1 and VL-2), total_count == 2, has_more == false, limit == 10 by default"

      - name: component_lot_list_rejects_out_of_range_limit
        claim_type: listing
        grounds:
          - validations[priority=36]
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit=0 and limit=101 both fall outside the declared 1..100 window and must return ERR_INVALID_PAGINATION (400); offset=-1 is rejected by the same rule, while limit=100 is accepted at the inclusive maximum."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One ComponentLot exists so a successful page is non-empty."
            - "The triggers deliberately send out-of-range pagination parameters."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /component-lots"
              payload: { client_project_id: "${proj_id}", component_type: "VIAL", lot_code: "VL-1", quantity_received: 30000, sterilization_expiry: "2027-01-01T00:00:00Z" }
              as: ProgramManager
          trigger:
            - call: "GET /component-lots?limit=0"
              as: ProgramManager
            - call: "GET /component-lots?limit=101"
              as: ProgramManager
            - call: "GET /component-lots?offset=-1"
              as: ProgramManager
            - call: "GET /component-lots?limit=100"
              as: ProgramManager
          assert:
            - "trigger calls 1, 2 and 3 each return HTTP 400 with error.id == 'ERR_INVALID_PAGINATION'"
            - "trigger call 4 returns HTTP 200 with 1 row, total_count == 1, limit == 100, has_more == false"

      - name: qp_release_decision_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.QpReleaseDecision
          - endpoints[GET /batch-orders/{id}/qp-release-decisions]
          - state_machines.BatchOrder.quality_status.QP_REVIEW_to_QUARANTINED
        distinguishing_aspect: "QpReleaseDecision is declared common_fields: false, so the row appended by a QUARANTINE decision exposes no version and no updated_at field, §1.5 declares no update or delete endpoint for it, and a second qp-release cannot rewrite it — the append-only decision log is the audit record."
        test_recipe:
          setup:
            - "The full B-001 chain through BatchRecordReview closure, so quality_status is QP_REVIEW and final_releasable_units is 8274."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramManager
            - call: "POST /filling-suites"
              payload: { suite_code: "FS-1", grade: "B", changeover_minutes_same_product: 60, changeover_minutes_product_change: 240, max_committed_minutes: 20000 }
              as: ProgramManager
              captures: { suite_id: $.data.id }
            - call: "POST /media-fills"
              payload: { suite_id: "${suite_id}", scheduled_run_date: "2026-09-02T08:00:00Z" }
              as: MicrobiologyAnalyst
              captures: { mf1_id: $.data.id }
            - call: "POST /media-fills/${mf1_id}/execute"
              payload: { units_filled: 6000, participating_operator_names: ["OP-A", "OP-B"] }
              as: MicrobiologyAnalyst
            - call: "POST /media-fills/${mf1_id}/read"
              payload: { contaminated_units: 0 }
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-A", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_a_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_a_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /personnel-qualifications"
              payload: { operator_name: "OP-B", suite_id: "${suite_id}", qualification_type: "ASEPTIC_INTERVENTION", expires_on: "2027-06-01T00:00:00Z", media_fill_id: "${mf1_id}" }
              as: MicrobiologyAnalyst
              captures: { pq_b_id: $.data.id }
            - call: "POST /personnel-qualifications/${pq_b_id}/qualify"
              as: MicrobiologyAnalyst
            - call: "POST /filling-suites/${suite_id}/cleaning-validation"
              payload: { molecule_name: "MOL-A", residue_ug_per_swab: 12 }
              as: MicrobiologyAnalyst
            - call: "POST /client-projects"
              payload: { client_name: "Sponsor A", molecule_name: "MOL-A", dosage_form: "VIAL", primary_suite_id: "${suite_id}", target_fill_weight_mg: 1000, historical_reject_rate_ppm: 2500, reserved_unit_budget: 30000 }
              as: ProgramManager
              captures: { proj_id: $.data.id }
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
              payload: { to_stage: "GAP_ASSESSMENT", analytical_method_transfer_status: "IN_TRANSFER" }
              as: ProgramManager
            - call: "POST /client-projects/${proj_id}/advance-tech-transfer"
