        claim_type: Cascade down
        excluded_because:
          difficulty_instance: hospitalization_incident_cascades_four_hops_to_nurse_minutes
          rationale: >-
            All four declared hops of the incident cascade (Patient, Case, Shift plus assignment,
            recomputed ledgers) are asserted there with pre-computed minute figures; this section
            keeps only the manual-hold variant, which has a different trigger and no Patient hop.
        grounds:
          - state_machines[IncidentReport] creation side effects
          - complexity_profile.complexity_layers

