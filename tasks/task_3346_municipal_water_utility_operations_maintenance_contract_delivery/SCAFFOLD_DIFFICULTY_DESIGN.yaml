  - rule_id: compensating_invariant
    instances:
      - name: void_and_reallocate_conserve_total_operator_penalty
        grounds:
          - state_machines.PenaltyAllocation.CONTESTED_to_VOIDED
          - state_machines.PenaltyAllocation.CONTESTED_to_ADJUSTED
          - calculations.penalty_allocation
          - entities.Municipality.fields.total_operator_penalty_cents
        distinguishing_aspect: |
          The conserved quantity is money: total_operator_penalty_cents summed across the municipality's allocations must return to its
          original value when an allocator is voided and an equivalent allocator is created, pinned as the invariant
          Contract.total_operator_penalty_cents == sum(PenaltyAllocation.operator_share_cents for rows with status != VOIDED).
        test_recipe:
          setup:
            - "one ACTIVE permit on an OPERATING contract with no BREACHED standard, and one ALLOCATED penalty of 2000000 cents"
          setup_api_calls:
