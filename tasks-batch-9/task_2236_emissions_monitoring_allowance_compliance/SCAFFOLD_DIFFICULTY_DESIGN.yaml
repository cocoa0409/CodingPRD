              as: QAAnalyst
            - call: "POST /emissions/units/${unit_id}/fuel-samples"
              payload: { sample_utc: "2026-04-01T06:00:00Z", fuel_type: "COAL", lot_identifier: "LOT-B" }
              as: FacilityOperator
              as_user_id: "op_alpha"
              captures: { fs_b: $.data.id }
            - call: "POST /emissions/units/${unit_id}/quarterly-reports"
