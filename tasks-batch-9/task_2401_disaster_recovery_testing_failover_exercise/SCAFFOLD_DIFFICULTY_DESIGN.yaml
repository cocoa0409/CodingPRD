              as_user_id: "${op1_id}"
            - &b31
              call: "POST /runbook-steps/${s2_id}/validations"
              payload: {}
              as: ITOperator
              as_user_id: "${op1_id}"
            - &b32
              call: "POST /runbook-steps/${s3_id}/validations"
              payload: {}
              as: ITOperator
              as_user_id: "${op1_id}"
            - &b33
              call: "POST /runbooks/${rb1_id}/transitions"
              payload: { action: "VALIDATE" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - &c40
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
            - &obs1
              call: "POST /assets/${d1_id}/replication-observations"
              payload: { observed_at: "2026-09-09T23:55:00Z", replication_lag_seconds: 240, unreplicated_txn_count: 900 }
              as: ITOperator
              as_user_id: "${op1_id}"
            - call: "POST /exercises"
              payload: { name: "DB tier component failover", exercise_type: "COMPONENT_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-09-10T02:00:00Z", planned_end_at: "2026-09-10T08:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exA_id: $.data.id, exA_v: $.data.version }
            - call: "POST /exercises/${exA_id}/scope-items"
              payload: { recovery_group_id: "${g1_id}", expected_exercise_version: "${exA_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exA_id}/impact-submissions"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exA_id}/impact-decisions"
              payload: { action: "APPROVE", decision_note: "Component window accepted" }
              as: RiskApprover
              as_user_id: "${ra3_id}"
            - call: "POST /exercises/${exA_id}/schedule"
              payload: {}
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T02:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exercises/${exA_id}/execution-transitions"
              payload: { action: "START" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exA_id}/step-executions"
              payload: { runbook_step_id: "${s1_id}", outcome: "PASSED", elapsed_seconds: 750 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exA_id}/step-executions"
              payload: { runbook_step_id: "${s2_id}", outcome: "PASSED_WITH_ISSUE", elapsed_seconds: 1230, notes: "Manual mount required" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exA_id}/step-executions"
              payload: { runbook_step_id: "${s3_id}", outcome: "SKIPPED", elapsed_seconds: 600 }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T03:20:00Z" }
              as: PlatformAdmin
            - call: "POST /exercises/${exA_id}/execution-transitions"
              payload: { action: "COMPLETE_FAILOVER" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises"
              payload: { name: "Whole site failover rehearsal", exercise_type: "FULL_SITE_FAILOVER", recovery_site_id: "${sr_id}", coordinator_id: "${c1_id}", planned_start_at: "2026-09-11T00:00:00Z", planned_end_at: "2026-09-11T06:00:00Z" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
              captures: { exB_id: $.data.id, exB_v: $.data.version }
            - call: "POST /exercises/${exB_id}/scope-items"
              payload: { recovery_group_id: "${g1_id}", expected_exercise_version: "${exB_v}" }
              as: ResilienceCoordinator
              as_user_id: "${c1_id}"
            - call: "POST /exercises/${exB_id}/impact-submissions"
              payload: {}
