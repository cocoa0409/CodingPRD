              as_user_id: "user_pm_1"
              captures: { n_served: "$.data.status", prior: "$.data.prior_lease_status" }
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { s_noticed: "$.data.status" }
          trigger:
            - call: "POST /non-renewal-notices/${notice}/rescind"
              payload: {}
              as: PropertyManager
              captures: { n_status: "$.data.status" }
            - call: "GET /leases/${lease}"
              as: PropertyManager
              captures: { s_end: "$.data.status", rent_end: "$.data.monthly_rent_cents" }
          assert:
            - "s_mtm == MTM and rent_mtm == 242650 before the notice"
            - "n_served == SERVED with prior == MTM; s_noticed == NON_RENEWAL_NOTICED"
            - "n_status == RESCINDED (rescinded at 2027-06-01, within cure deadline 2027-06-11)"
            - "status conserved verbatim: s_end == MTM (not ACTIVE); rent_end == 242650 (premium rent conserved)"
