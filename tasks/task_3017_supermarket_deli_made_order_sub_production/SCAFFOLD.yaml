      - "every non-terminal SubTicket in the store -> ABANDONED (cascade level 2)"
      - "each ABANDONED ticket releases its reserved BreadSupplyOrder units (cascade level 3)"
      - "each affected Promotion -> DEGRADED when its units_short reaches 0 (cascade level 4)"

