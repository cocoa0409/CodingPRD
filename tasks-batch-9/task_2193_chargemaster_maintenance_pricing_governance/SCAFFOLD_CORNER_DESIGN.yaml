            - "the CC-200 change request by mgr_cath returns 403 with error_id ERR_DEPARTMENT_SCOPE_VIOLATION"
            - "the CC-200 batch create by mgr_cath returns 403 with error_id ERR_DEPARTMENT_SCOPE_VIOLATION"
            - "mgr_rad appending a line to mgr_cath's batch returns 403 with error_id ERR_DEPARTMENT_SCOPE_VIOLATION"
            - "mgr_rad withdrawing ${cr_ok} returns 403 with error_id ERR_DEPARTMENT_SCOPE_VIOLATION"
            - "the DepartmentManager call with no X-User-ID returns 401 with error_id ERR_UNAUTHENTICATED (not ERR_DEPARTMENT_SCOPE_VIOLATION)"
            - "the reprice with no identity headers at all returns 401 with error_id ERR_UNAUTHENTICATED (authentication is checked before role)"
