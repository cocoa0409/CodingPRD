      - name: hld_shelf_life_uses_the_one_hundred_sixty_eight_hour_constant
        claim_type: constants_applied
        grounds:
          - calculations.scope_reprocessing_due.constants.HLD_SHELF_LIFE_HOURS
          - errors.ERR_HLD_EXPIRED
        excluded_because:
          difficulty_instance: boundary_precision_check / hld_shelf_life_boundary_exclusive_at_booking_start
          rationale: "The named §1.8 instance starts bookings one minute before, exactly at, and one minute after last_reprocessed_at + 168 hours, which is where that constant is observable."

      - name: candidacy_variant_is_chosen_by_the_prior_auth_flag
        claim_type: variant_selection
        grounds:
          - calculations.sinuplasty_candidacy_evaluation.variants
          - entities.SinuplastyCase.fields.evaluation_variant
        excluded_because:
          difficulty_instance: dual_variant_calc / candidacy_variant_divergence_on_sinuplasty_case
          rationale: "The named §1.8 instance documents identical therapy courses under a requires_prior_auth true plan and a requires_prior_auth false plan and asserts both the variant label and the diverging candidacy_status."

  # ===========================================================================
  # SECTION 4 — VALIDATIONS
  # ===========================================================================
  - section: validations
    instances:

      - name: unauthenticated_request_is_rejected_before_role_and_shape
        claim_type: priority_ordering
        grounds:
          - validations[priority 1]
          - validations[priority 2]
          - validations[priority 3]
          - errors.ERR_UNAUTHENTICATED
          - errors.ERR_ROLE_NOT_PERMITTED
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Four shapes of the same POST /patients call separate the first three priorities: an empty X-User-ID is 401, a whitespace-only X-User-ID is also 401, a well-formed body sent as AllergyNurse is 403, and only an authenticated PracticeAdmin with a bad body reaches the 400 — a call that is both unauthenticated and malformed still returns 401."
        test_recipe:
          setup:
            - "One PayerPolicy so that payer_policy_id resolves and no 404 can mask the header rules."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Header Health", plan_code: "VALA-2999" }
              as: PracticeAdmin
              as_user_id: "u_admin_1"
              captures: { pol_id: $.data.id }
          trigger:
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10221", full_name: "Empty Header", date_of_birth: "1970-01-01" }
              as: PracticeAdmin
              as_user_id: ""
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10221", full_name: "Blank Header", date_of_birth: "1970-01-01" }
              as: PracticeAdmin
              as_user_id: "   "
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10221", full_name: "Wrong Role", date_of_birth: "1970-01-01" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "not-an-mrn", full_name: "Bad Shape", date_of_birth: "1970-01-01" }
              as: PracticeAdmin
              as_user_id: "u_admin_1"
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "not-an-mrn", full_name: "Both Wrong", date_of_birth: "1970-01-01" }
              as: PracticeAdmin
              as_user_id: ""
          assert:
            - "Call 1 (X-User-ID sent as the empty string) returns HTTP 401 with error.id == \"ERR_UNAUTHENTICATED\""
            - "Call 2 (X-User-ID sent as three spaces) also returns HTTP 401 with error.id == \"ERR_UNAUTHENTICATED\" — whitespace-only counts as absent"
            - "Call 3 (valid headers, AllergyNurse, which is not in the endpoint's roles) returns HTTP 403 with error.id == \"ERR_ROLE_NOT_PERMITTED\""
            - "Call 4 (valid PracticeAdmin headers, mrn violating ^MRN-[0-9]{5}$) returns HTTP 400 with error.id == \"ERR_INVALID_REQUEST\""
            - "Call 5 violates priority 1 and priority 3 at once and returns HTTP 401 with error.id == \"ERR_UNAUTHENTICATED\", not the 400"
            - "No Patient row was created by any of the five calls: GET /patients?payer_policy_id=${pol_id} returns total_count 0"

      - name: body_foreign_keys_validated_in_declared_input_order
        claim_type: priority_ordering
        grounds:
          - validations[priority 5]
          - errors.ERR_DIAGNOSTIC_STUDY_NOT_FOUND
          - errors.ERR_SUPPLY_LOT_NOT_FOUND
          - endpoints[POST /device-dispenses]
        distinguishing_aspect: "POST /device-dispenses declares diagnostic_study_id before supply_lot_id, so a body with both foreign keys unresolvable returns ERR_DIAGNOSTIC_STUDY_NOT_FOUND; fixing only the study then surfaces ERR_SUPPLY_LOT_NOT_FOUND, proving left-to-right evaluation in the declared input order rather than an arbitrary one."
        test_recipe:
          setup:
            - "One PayerPolicy and one adult Patient."
            - "One AUDIOMETRY study with pta_db_hl 55.0 performed by u_aud_1 and interpreted by u_aud_2, so it is INTERPRETED with recommendation HEARING_AID; its version is captured for the expected_study_version field."
            - "One HEARING_AID supply lot LOT-1016 so the happy-path reference exists."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Order Health", plan_code: "VALB-2999" }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10222", full_name: "Jo Lindqvist", date_of_birth: "1962-02-02", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /diagnostic-studies"
              payload: { patient_id: "${pat_id}", study_type: "AUDIOMETRY" }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { study_id: $.data.id }
            - call: "POST /diagnostic-studies/${study_id}/results"
              payload: { pta_db_hl: 55.0, word_recognition_pct: 66.0 }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /diagnostic-studies/${study_id}/interpretation"
              payload: {}
              as: Audiologist
              as_user_id: "u_aud_2"
              captures: { study_v: $.data.version }
            - call: "POST /supply-lots"
              payload: { item_type: "HEARING_AID", lot_number: "LOT-1016", quantity_received: 4, expires_at: "2028-01-01T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "study_missing_2999", supply_lot_id: "lot_missing_2999", device_type: "HEARING_AID", device_serial: "HA400002", ear: "RIGHT", price_cents: 180000, expected_study_version: "${study_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "lot_missing_2999", device_type: "HEARING_AID", device_serial: "HA400002", ear: "RIGHT", price_cents: 180000, expected_study_version: "${study_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
            - call: "POST /device-dispenses"
              payload: { diagnostic_study_id: "${study_id}", supply_lot_id: "${lot_id}", device_type: "HEARING_AID", device_serial: "HA400002", ear: "RIGHT", price_cents: 180000, expected_study_version: "${study_v}" }
              as: Audiologist
              as_user_id: "u_aud_1"
              captures: { disp_id: $.data.id }
          assert:
            - "Call 1 returns HTTP 404 with error.id == \"ERR_DIAGNOSTIC_STUDY_NOT_FOUND\" — the first declared foreign key wins even though the lot is also unresolvable"
            - "Call 2 returns HTTP 404 with error.id == \"ERR_SUPPLY_LOT_NOT_FOUND\""
            - "Call 3 returns HTTP 201 with DeviceDispense.${disp_id}.fit_status == \"FITTED\" and billing_status == \"INVOICED\""
            - "DeviceDispense.${disp_id}.device_serial == \"HA400002\" and price_cents == 180000 — the two rejected calls created nothing, so the serial was still free"
            - "SupplyLot.${lot_id}.quantity_received == 4 and quantity_wasted == 0 after all three calls"

      - name: policy_version_drift_blocks_booking_start
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 13]
          - errors.ERR_POLICY_VERSION_DRIFT
          - entities.SinuplastyCase.fields.pinned_policy_version
          - endpoints[PATCH /payer-policies/{policyId}]
          - endpoints[POST /procedure-bookings/{bookingId}/start]
        distinguishing_aspect: "Two authorized balloon bookings differ only in when they start: the one started while PayerPolicy.version still equals the case's pinned_policy_version 1 succeeds, and the one started after a PATCH bumps the policy to version 2 returns ERR_POLICY_VERSION_DRIFT — the booking's own row never changed."
        test_recipe:
          setup:
            - "PayerPolicy with requires_prior_auth true, min_documented_criteria 3, min_medical_management_days 28, max_balloon_devices 2."
            - "One adult Patient; two LEFT / MAXILLARY cases, each documented with a single 28-day INCS course and three admissible criteria so both are ELIGIBLE, submitted by u_liaison_1 and approved by u_liaison_2 — both pin policy version 1 and are authorized for 1 device."
            - "One BALLOON_DEVICE lot LOT-1015 with 5 units; two BALLOON_SINUPLASTY bookings on 2026-08-05, 09:00..10:00 and 11:00..12:00, each reserving 1 device."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Drift Health", plan_code: "VALC-2999", requires_prior_auth: true, min_documented_criteria: 3, min_medical_management_days: 28, max_balloon_devices: 2 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10223", full_name: "Kai Sørensen", date_of_birth: "1971-11-11", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /supply-lots"
              payload: { item_type: "BALLOON_DEVICE", lot_number: "LOT-1015", quantity_received: 5, expires_at: "2027-12-31T00:00:00Z" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_id}", laterality: "LEFT", sinuses: ["MAXILLARY"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { case_1: $.data.id }
            - call: "POST /sinuplasty-cases/${case_1}/documentation"
              payload: { ct_study_date: "2026-05-15", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-28" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_INCS", "SNOT22_GE_20"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /sinuplasty-cases/${case_1}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
            - call: "POST /sinuplasty-cases/${case_1}/payer-decisions"
              payload: { decision: "APPROVED", payer_reference: "PA-77101" }
              as: PayerLiaison
              as_user_id: "u_liaison_2"
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_id}", laterality: "LEFT", sinuses: ["MAXILLARY"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { case_2: $.data.id }
            - call: "POST /sinuplasty-cases/${case_2}/documentation"
              payload: { ct_study_date: "2026-05-15", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-28" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_INCS", "SNOT22_GE_20"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /sinuplasty-cases/${case_2}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
            - call: "POST /sinuplasty-cases/${case_2}/payer-decisions"
              payload: { decision: "APPROVED", payer_reference: "PA-77102" }
              as: PayerLiaison
              as_user_id: "u_liaison_2"
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "BALLOON_SINUPLASTY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z", physician_user_id: "u_ent_1", sinuplasty_case_id: "${case_1}", supply_lot_id: "${lot_id}", planned_device_count: 1 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { book_1: $.data.id }
            - call: "POST /procedure-bookings"
              payload: { patient_id: "${pat_id}", procedure_type: "BALLOON_SINUPLASTY", venue: "IN_OFFICE_SUITE", start_at: "2026-08-05T11:00:00Z", end_at: "2026-08-05T12:00:00Z", physician_user_id: "u_ent_1", sinuplasty_case_id: "${case_2}", supply_lot_id: "${lot_id}", planned_device_count: 1 }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { book_2: $.data.id }
          trigger:
            - call: "POST /procedure-bookings/${book_1}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "PATCH /payer-policies/${pol_id}"
              payload: { covered_pct_bps: 7000 }
              as: PracticeAdmin
              captures: { pol_v2: $.data.version }
            - call: "POST /procedure-bookings/${book_2}/start"
              payload: {}
              as: Otolaryngologist
              as_user_id: "u_ent_1"
          assert:
            - "Both cases report pinned_policy_version == 1, candidacy_status == \"ELIGIBLE\" and authorized_device_count == 1"
            - "The first start returns HTTP 200 with ProcedureBooking.${book_1}.status == \"IN_PROGRESS\" — pinned_policy_version 1 still matches PayerPolicy.version 1"
            - "${pol_v2} == 2 and PayerPolicy.${pol_id}.covered_pct_bps == 7000"
            - "The second start returns HTTP 409 with error.id == \"ERR_POLICY_VERSION_DRIFT\""
            - "ProcedureBooking.${book_2}.status is still \"SCHEDULED\" and SinuplastyCase.${case_2}.pinned_policy_version is still 1 — the drift is not repaired by the failed attempt"
            - "SupplyLot.${lot_id}.quantity_reserved == 2 throughout, since both bookings are still non-terminal"

      - name: serum_conversion_requires_plan_coverage
        claim_type: conditional_validation
        grounds:
          - validations[priority 13]
          - errors.ERR_SERUM_NOT_COVERED
          - entities.PayerPolicy.fields.allergy_serum_covered
          - state_machines.AllergyTestOrder.ORDERED_to_SERUM_PENDING
        distinguishing_aspect: "The identical convert-to-serum call on two MOLD_12 orders diverges only on the patient's plan: allergy_serum_covered false gives ERR_SERUM_NOT_COVERED and leaves the order ORDERED with method SKIN_PRICK, while allergy_serum_covered true gives SERUM_PENDING with billed_units ceil(12/4) == 3 and observation_required_minutes 0."
        test_recipe:
          setup:
            - "PayerPolicy VALD-2999 with allergy_serum_covered false and PayerPolicy VALE-2999 with allergy_serum_covered true."
            - "One adult Patient under each plan; one MOLD_12 SKIN_PRICK order per patient, both left in ORDERED."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "No Serum Health", plan_code: "VALD-2999", allergy_serum_covered: false }
              as: PracticeAdmin
              captures: { pol_no: $.data.id }
            - call: "POST /payer-policies"
              payload: { payer_name: "Serum Yes Health", plan_code: "VALE-2999", allergy_serum_covered: true }
              as: PracticeAdmin
              captures: { pol_yes: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_no}", mrn: "MRN-10224", full_name: "Lena Duarte", date_of_birth: "1987-08-08", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_no: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_yes}", mrn: "MRN-10225", full_name: "Milo Duarte", date_of_birth: "1989-09-09", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_yes: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_no}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { ord_no: $.data.id }
            - call: "POST /allergy-test-orders"
              payload: { patient_id: "${pat_yes}", panel_code: "MOLD_12", method: "SKIN_PRICK" }
              as: AllergyNurse
              as_user_id: "u_nurse_1"
              captures: { ord_yes: $.data.id }
          trigger:
            - call: "POST /allergy-test-orders/${ord_no}/convert-to-serum"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
            - call: "POST /allergy-test-orders/${ord_yes}/convert-to-serum"
              payload: {}
              as: AllergyNurse
              as_user_id: "u_nurse_1"
          assert:
            - "The first call returns HTTP 409 with error.id == \"ERR_SERUM_NOT_COVERED\""
            - "AllergyTestOrder.${ord_no}.status == \"ORDERED\", method == \"SKIN_PRICK\", billed_units == 0, observation_required_minutes == 0"
            - "The second call returns HTTP 200 with AllergyTestOrder.${ord_yes}.status == \"SERUM_PENDING\" and method == \"SERUM_IGE\""
            - "AllergyTestOrder.${ord_yes}.billed_units == 3 and observation_required_minutes == 0"
            - "Neither patient's risk_score changed: both remain 5 with sensitized_antigen_count 0"

      - name: draft_case_submission_then_ineligible_candidacy
        claim_type: cascading_validation
        grounds:
          - validations[priority 7]
          - validations[priority 13]
          - errors.ERR_CASE_STATE_INVALID
          - errors.ERR_CANDIDACY_NOT_ELIGIBLE
          - endpoints[POST /sinuplasty-cases/{caseId}/authorization-submissions]
        distinguishing_aspect: "The candidacy check can only run once the state check has passed: a DRAFT case whose candidacy is UNDETERMINED returns ERR_CASE_STATE_INVALID (priority 7) rather than ERR_CANDIDACY_NOT_ELIGIBLE, and only after documentation moves it to DOCUMENTED does the same call reach the priority-13 candidacy verdict."
        test_recipe:
          setup:
            - "PayerPolicy with requires_prior_auth true (POLICY_STRICT), min_documented_criteria 3, min_medical_management_days 28."
            - "One adult Patient and one LEFT / MAXILLARY case still in DRAFT with candidacy_status UNDETERMINED."
            - "The documentation supplied later carries a single 14-day INCS course, so contiguous_management_days is 14 and the case is INELIGIBLE despite having three admissible criteria."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Cascade Health", plan_code: "VALF-2999", requires_prior_auth: true, min_documented_criteria: 3, min_medical_management_days: 28 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10226", full_name: "Nadia Roche", date_of_birth: "1966-05-05", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_id}", laterality: "LEFT", sinuses: ["MAXILLARY"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { case_id: $.data.id }
          trigger:
            - call: "POST /sinuplasty-cases/${case_id}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
            - call: "POST /sinuplasty-cases/${case_id}/documentation"
              payload: { ct_study_date: "2026-05-20", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-14" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_INCS", "ENDOSCOPY_FINDING"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
            - call: "POST /sinuplasty-cases/${case_id}/authorization-submissions"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
            - call: "POST /sinuplasty-cases/${case_id}/documentation"
              payload: { ct_study_date: "2026-05-20", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-28" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_INCS", "ENDOSCOPY_FINDING"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
          assert:
            - "Call 1 returns HTTP 409 with error.id == \"ERR_CASE_STATE_INVALID\" — DRAFT is not one of {DOCUMENTED, INFO_REQUESTED, AUTH_EXPIRED}, so the candidacy rule never runs"
            - "SinuplastyCase.${case_id}.candidacy_status is still \"UNDETERMINED\" and submitted_by_user_id is still null after call 1"
            - "Call 2 returns HTTP 200 with status == \"DOCUMENTED\", criteria_met_count == 3, cumulative_management_days == 14, contiguous_management_days == 14, candidacy_status == \"INELIGIBLE\""
            - "Call 3 now returns HTTP 409 with error.id == \"ERR_CANDIDACY_NOT_ELIGIBLE\" — the state check passed, so the priority-13 rule is the one that fires"
            - "Call 4 returns HTTP 409 with error.id == \"ERR_CASE_STATE_INVALID\" — documentation requires DRAFT, so an INELIGIBLE DOCUMENTED case cannot be re-documented into eligibility"
            - "SinuplastyCase.${case_id}.status == \"DOCUMENTED\", revision_round == 0 and contiguous_management_days is still 14"

      - name: case_state_outranks_supply_exhaustion_on_booking_create
        claim_type: priority_conflict
        grounds:
          - validations[priority 7]
          - validations[priority 14]
          - errors.ERR_CASE_STATE_INVALID
          - errors.ERR_SUPPLY_EXHAUSTED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / case_state_beats_supply_exhausted_on_booking_create
          rationale: "The named §1.8 instance violates both rules with one create and asserts the priority-7 error wins, then fixes each violation in turn to show the other rule still fires."

      - name: safety_gate_outranks_the_temporal_washout_gate
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority 10]
          - validations[priority 11]
          - errors.ERR_EPINEPHRINE_NOT_ON_FILE
          - errors.ERR_WASHOUT_NOT_COMPLETE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / epinephrine_safety_beats_washout_temporal_on_administer
          rationale: "The named §1.8 instance ends with both gates satisfied and the same administer call succeeding, which is the satisfaction-to-pass half of that pair."

      - name: scope_interval_and_turnaround_are_separate_temporal_rules
        claim_type: temporal_validation
        grounds:
          - validations[priority 11]
          - errors.ERR_SCOPE_INTERVAL_CONFLICT
          - errors.ERR_REPROCESSING_BUFFER_VIOLATION
        excluded_because:
          difficulty_instance: resource_temporal_overlap / endoscope_closed_interval_and_turnaround_buffer
          rationale: "The named §1.8 instance separates overlap from buffer with six candidate intervals in both directions, including the exactly-45-minute inclusive boundary."

      - name: block_concurrency_is_an_aggregate_ceiling
        claim_type: aggregate_validation
        grounds:
          - validations[priority 14]
          - errors.ERR_BLOCK_CAPACITY_EXCEEDED
          - entities.SurgeryCenterBlock.fields.max_concurrent_cases
        excluded_because:
          difficulty_instance: resource_temporal_overlap / surgery_block_half_open_window_and_aggregate_concurrency
          rationale: "The named §1.8 instance admits two individually valid bookings and rejects the third only because the instantaneous concurrency would reach 3, with booked_minutes still under capacity."

  # ===========================================================================
  # SECTION 5 — ENDPOINTS
  # (No bulk endpoint is declared in §1.5, so the guide's bulk_action row has
  #  nothing to bind to and is deliberately absent.)
  # ===========================================================================
  - section: endpoints
    instances:

      - name: payer_policy_patch_updates_and_bumps_version
        claim_type: standard_crud
        grounds:
          - endpoints[POST /payer-policies]
          - endpoints[GET /payer-policies/{policyId}]
          - endpoints[PATCH /payer-policies/{policyId}]
          - response_envelope.response_type
        distinguishing_aspect: "PayerPolicy is the one entity with create, read and update endpoints and no delete: a PATCH of two fields leaves the other eleven at their creation values, bumps version 1 -> 2, and a second PATCH resending the same two values still bumps to 3 because every write increments the version."
        test_recipe:
          setup:
            - "One PayerPolicy created with defaults for everything except covered_pct_bps 9000."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "CRUD Health", plan_code: "ENDA-2999", covered_pct_bps: 9000 }
              as: PracticeAdmin
              as_user_id: "u_admin_1"
              captures: { pol_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "PATCH /payer-policies/${pol_id}"
              payload: { min_documented_criteria: 5, appliance_covered: false }
              as: PracticeAdmin
              as_user_id: "u_admin_1"
              captures: { v2: $.data.version }
            - call: "GET /payer-policies/${pol_id}"
              payload: {}
              as: PracticeAdmin
              as_user_id: "u_admin_2"
            - call: "PATCH /payer-policies/${pol_id}"
              payload: { min_documented_criteria: 5, appliance_covered: false }
              as: PracticeAdmin
              as_user_id: "u_admin_1"
              captures: { v3: $.data.version }
          assert:
            - "${v1} == 1 and PayerPolicy.${pol_id}.covered_pct_bps == 9000 at creation"
            - "${v2} == 2, min_documented_criteria == 5 and appliance_covered == false in the PATCH response"
            - "The GET echoes the patched values and leaves the untouched fields at their creation values: covered_pct_bps 9000, requires_prior_auth true, min_medical_management_days 28, requires_ct_within_months 12, max_balloon_devices 2, allergy_serum_covered true, observation_floor_minutes 20, device_trial_days 30, restock_fee_bps 1500, restock_fee_floor_cents 12500, auth_validity_days 90"
            - "The GET reports version 2 — a read never bumps the version"
            - "${v3} == 3 even though the second PATCH resent identical values"
            - "PayerPolicy.${pol_id}.created_at is unchanged across both PATCHes while updated_at moved"

      - name: candidacy_evaluation_read_matches_stored_metrics
        claim_type: computed_read
        grounds:
          - endpoints[GET /sinuplasty-cases/{caseId}/candidacy-evaluation]
          - calculations.sinuplasty_candidacy_evaluation
          - entities.SinuplastyCase.fields.criteria_met_count
          - entities.SinuplastyCase.fields.candidacy_status
        distinguishing_aspect: "The derived read returns all nine declared fields and they reconcile with the stored case row: two disjoint courses give cumulative_management_days 21 and contiguous_management_days 11, and because the plan is CLINICAL_BROAD the metric is 21 (ELIGIBLE) while a duplicate criterion code is deduplicated to criteria_met_count 2 and an eight-year-old CT is still admissible."
        test_recipe:
          setup:
            - "PayerPolicy with requires_prior_auth false (CLINICAL_BROAD), min_documented_criteria 2, min_medical_management_days 20, requires_ct_within_months 6."
            - "One adult Patient; one RIGHT / SPHENOID case documented with INCS 2026-06-01..06-10 (10 days) and SALINE 2026-06-20..06-30 (11 days), a six-figure-old ct_study_date of 2024-01-01, and criteria [CT_OPACIFICATION, FAILED_ABX, FAILED_ABX]."
            - "Under CLINICAL_BROAD there is no therapy cross-check and no CT recency test, so FAILED_ABX counts even though no ABX course is documented."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Broad Read Health", plan_code: "ENDB-2999", requires_prior_auth: false, min_documented_criteria: 2, min_medical_management_days: 20, requires_ct_within_months: 6 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
              payload: { payer_policy_id: "${pol_id}", mrn: "MRN-10231", full_name: "Otto Ferrand", date_of_birth: "1964-03-03", epinephrine_on_file: true }
              as: PracticeAdmin
              captures: { pat_id: $.data.id }
            - call: "POST /sinuplasty-cases"
              payload: { patient_id: "${pat_id}", laterality: "RIGHT", sinuses: ["SPHENOID"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
              captures: { case_id: $.data.id }
            - call: "POST /sinuplasty-cases/${case_id}/documentation"
              payload: { ct_study_date: "2024-01-01", documented_therapies: [{ therapy_code: "INCS", start_date: "2026-06-01", end_date: "2026-06-10" }, { therapy_code: "SALINE", start_date: "2026-06-20", end_date: "2026-06-30" }], documented_criteria_codes: ["CT_OPACIFICATION", "FAILED_ABX", "FAILED_ABX"] }
              as: Otolaryngologist
              as_user_id: "u_ent_1"
          trigger:
            - call: "GET /sinuplasty-cases/${case_id}/candidacy-evaluation"
              payload: {}
              as: PayerLiaison
              as_user_id: "u_liaison_1"
          assert:
            - "HTTP 200 with all nine declared fields present"
            - "evaluation_variant == \"CLINICAL_BROAD\", min_documented_criteria_required == 2, min_medical_management_days_required == 20"
            - "cumulative_management_days == 21 (10 + 11) and contiguous_management_days == 11 — the two courses are 9 days apart so nothing merges"
            - "management_days_metric == 21 — CLINICAL_BROAD reads the cumulative figure, so the same data that would be INELIGIBLE under POLICY_STRICT is ELIGIBLE here"
            - "criteria_met_count == 2 and admissible_criteria_codes == [\"CT_OPACIFICATION\", \"FAILED_ABX\"] — the duplicate is deduplicated and the 2024 CT is admissible because CLINICAL_BROAD applies no recency test"
            - "candidacy_status == \"ELIGIBLE\""
            - "The stored row agrees with the read: SinuplastyCase.${case_id}.criteria_met_count == 2, cumulative_management_days == 21, contiguous_management_days == 11, candidacy_status == \"ELIGIBLE\", status == \"DOCUMENTED\", planned_device_count == 1"

      - name: finalize_before_trial_end_is_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /device-dispenses/{dispenseId}/finalize]
          - errors.ERR_TRIAL_NOT_COMPLETE
          - errors.ERR_DISPENSE_STATE_INVALID
          - state_machines.DeviceDispense.FITTED_to_FINALIZED
          - entities.DeviceDispense.fields.trial_end_at
        distinguishing_aspect: "The same finalize call is refused at clock 2026-08-15 with ERR_TRIAL_NOT_COMPLETE, accepted at exactly trial_end_at 2026-08-31T00:00:00Z (the boundary is inclusive because the rule fires only strictly before it), and refused a third time with ERR_DISPENSE_STATE_INVALID once fit_status is FINALIZED."
        test_recipe:
          setup:
            - "PayerPolicy with device_trial_days 30, so a dispense at the default clock has trial_end_at 2026-08-31T00:00:00Z."
            - "One adult Patient; one AUDIOMETRY study with pta_db_hl 60.0 performed by u_aud_1 and interpreted by u_aud_2, so recommendation is HEARING_AID."
            - "One HEARING_AID lot LOT-1017 and one dispense of HA400003 at price_cents 250000, dispensed at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /payer-policies"
              payload: { payer_name: "Trial Health", plan_code: "ENDC-2999", device_trial_days: 30 }
              as: PracticeAdmin
              captures: { pol_id: $.data.id }
            - call: "POST /patients"
