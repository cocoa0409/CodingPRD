  - name: claim_denial_takes_the_other_branch_of_the_same_endpoint
    claim_type: conditional_action
    grounds:
    - endpoints[POST /donor-cost-claims/{id}/adjudication]
    - state_machines.DonorCostClaim.SUBMITTED_to_DENIED
    - calculations.donor_fund_ledger
    distinguishing_aspect: 'The decision field selects between two disjoint outcomes on ONE endpoint:
      DENY records a reason code and moves no money, so the fund ledger is byte-identical to its pre-call
      state.'
    test_recipe:
      setup:
      - D-001 is DONATED in program NLT-01 (pool 5000000, committed 0).
      - A TRAVEL / NLDAC_GRANT claim for 500000 was filed, so estimated_reimbursement_cents is min(500000,
        TRAVEL_CAP_CENTS 350000) = 350000.
