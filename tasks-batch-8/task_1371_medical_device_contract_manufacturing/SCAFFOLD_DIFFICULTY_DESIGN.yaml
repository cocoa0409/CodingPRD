            - { call: "POST /api/validation-protocols/${proto_id}/execute-phase", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
            - { call: "POST /api/validation-protocols/${proto_id}/submit-phase-review", payload: {}, as: QualityEngineer, as_user_id: "qe-alice" }
            - { call: "POST /api/validation-protocols/${proto_id}/approve-phase", payload: {}, as: QualityManager, as_user_id: "qm-bob" }
