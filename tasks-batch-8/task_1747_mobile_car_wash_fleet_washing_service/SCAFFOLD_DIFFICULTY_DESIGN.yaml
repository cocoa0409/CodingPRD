            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "T02", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v2: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "T03", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v3: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "T04", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v4: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "T05", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v5: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "T06", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v6: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "T07", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v7: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "T08", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v8: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "T09", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v9: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "T10", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { v10: $.data.id } }
          trigger:
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}", "${v10}"], scheduled_window_start: "2026-08-06T13:00:00Z", scheduled_window_end: "2026-08-06T15:00:00Z" }, as: PlatformAdmin, captures: { q10: $.data.quote_cents } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${v1}", "${v2}", "${v3}", "${v4}", "${v5}", "${v6}", "${v7}", "${v8}", "${v9}"], scheduled_window_start: "2026-08-07T13:00:00Z", scheduled_window_end: "2026-08-07T15:00:00Z" }, as: PlatformAdmin, captures: { q9: $.data.quote_cents } }
          assert:
            - "q10 == 31500 (10% tier applies at exactly 10: 35000 - 3500)"
