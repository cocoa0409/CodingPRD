          assert:
            - "HTTP status is 404 and ${err_parent} == \"ERR_TOWER_NOT_FOUND\""
            - "No BackhaulCircuit row exists: a later create of circuit_ref \"PF-CIR-8801\" against a real Tower returns 201 rather than ERR_DUPLICATE_CIRCUIT_REF"

      - name: usage_record_is_immutable_re_posting_the_same_day_is_rejected
