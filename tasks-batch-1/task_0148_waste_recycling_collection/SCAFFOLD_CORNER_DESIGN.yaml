        grounds:
          - roles
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "A Driver calling POST /accounts/{id}/invoices (Billing-exclusive) is rejected ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup: ["One account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "128 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id, acct_v: $.data.version }
          trigger:
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v}" }
              as: Driver
              as_user_id: "drv-99"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"
      - name: resident_cannot_dispute_other_accounts_invoice_not_owner
        claim_type: ownership_denial
        grounds:
          - roles
          - validations[priority=3]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: "A ResidentAccount whose X-User-ID is account B disputes account A's invoice: ERR_NOT_RESOURCE_OWNER (403); entity_backed ownership compares X-User-ID to the invoice's account_id."
        test_recipe:
          setup: ["Account A has an ISSUED invoice; account B exists separately."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "129 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_a: $.data.id }
            - call: "POST /accounts"
              payload: { service_address: "130 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_b: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_a}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { account_id: "${acct_a}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 1000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_a}/activate"
              payload: {}
              as: Dispatcher
              captures: { acct_a_v: $.data.version }
            - call: "POST /accounts/${acct_a}/invoices"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_account_version: "${acct_a_v}" }
              as: Billing
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/issue"
              payload: {}
              as: Billing
          trigger:
            - call: "POST /invoices/${inv_id}/dispute"
              payload: {}
              as: ResidentAccount
              as_user_id: "${acct_b}"
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_NOT_RESOURCE_OWNER"
      - name: missing_auth_headers_unauthenticated
        claim_type: missing_auth
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request to a protected endpoint with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["One account exists."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "131 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Anonymous
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"

  # =========================================================================
  # From Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: invoice_issue_stale_account_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[invoice-issue-stale-account]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC: creating a second invoice carrying the account version observed BEFORE the first invoice-create bumped it (expected_account_version = ${acct_v0}, now stale) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["ACTIVE account; client read version v0; one invoice already created against it (which bumped account.version)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "132 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /service-plans"
              payload: { account_id: "${acct_id}", stream: "TRASH", frequency: "WEEKLY", base_monthly_fee_cents: 1000 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /service-plans/${plan_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { acct_v0: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { period_start: "2026-05-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", expected_account_version: "${acct_v0}" }
              as: Billing
              captures: { inv1_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { period_start: "2026-06-01T00:00:00Z", period_end: "2026-07-01T00:00:00Z", expected_account_version: "${acct_v0}" }
              as: Billing
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_VERSION"
      - name: pickup_complete_correct_cart_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pickup-complete-stale-cart]
          - entities.Cart.fields.version
        distinguishing_aspect: "OCC happy path: completing a pickup with the current cart version succeeds and bumps Cart.version by 1 (a subsequent stale completion would then fail)."
        test_recipe:
          setup: ["A route IN_PROGRESS with a SCHEDULED pickup on an ACTIVE cart at version v (read just before)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "133 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-06-07T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-31" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /pickups/${pk_id}/complete"
              payload: { expected_cart_version: "${cart_v}" }
              as: Driver
            - call: "GET /carts/${cart_id}"
              payload: {}
              as: Driver
              captures: { cart_v_after: $.data.version }
          assert:
            - "Pickup.${pk_id}.outcome == COMPLETED"
            - "Cart.${cart_id}.version == ${cart_v} + 1"
      - name: pickup_complete_stale_cart_version_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pickup-complete-stale-cart]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "OCC stale path on Cart: completing a pickup with expected_cart_version = ${cart_v} - 1 (one behind the cart's current version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A route IN_PROGRESS with a SCHEDULED pickup on an ACTIVE cart at version v (>1, after activate)."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "134 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
              captures: { cart_v: $.data.version }
            - call: "POST /routes"
              payload: { service_date: "2026-06-08T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-32" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
          trigger:
            - call: "POST /pickups/${pk_id}/complete"
              payload: { expected_cart_version: "${cart_v} - 1" }
              as: Driver
              captures: { eid: $.data.error_id }
          assert:
            - "response status == 412"
            - "data.error_id == ERR_STALE_VERSION"
            - "Pickup.${pk_id}.outcome == SCHEDULED"
      - name: account_close_cascade_ordering_verified
        claim_type: cascading_side_effects
        grounds:
          - state_machines.ServiceAccount.ACTIVE_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / account_close_cascades_carts_and_plans_depth3
          rationale: "The full account-close cascade (carts -> RETIRED, plans -> TERMINATED) is verified end-to-end by the named §1.8 transitive_cascade instance."
      - name: payt_threshold_at_tier_boundary_exact
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.pay_as_you_throw_weight_charge
        excluded_because:
          difficulty_instance: combinatorial_formula / payt_marginal_tier_three_inputs_mode_a
          rationale: "Tier-boundary straddling (200/500-lb breakpoints) is exercised by the 600-lb COMMERCIAL_SMALL case in the named §1.8 instance."
      - name: account_balance_recompute_after_credit_void
        claim_type: derived_field_reconciliation
        grounds:
          - entities.ServiceAccount.fields.account_balance_cents
          - state_machines.MissedPickupCredit.PENDING_to_VOID
        distinguishing_aspect: "Derived-field reconciliation: voiding a PENDING credit leaves account_balance_cents unchanged at 0 (PENDING credits are not in the APPLIED set that the balance sums), and the voided credit no longer appears as PENDING."
        test_recipe:
          setup: ["ACTIVE account with one PENDING MissedPickupCredit (1500, from a carrier-fault miss); no issued invoices; balance 0."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { service_address: "135 Main St", rate_class: "RESIDENTIAL" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /carts"
              payload: { account_id: "${acct_id}", stream: "TRASH", size_gallons: 65 }
              as: Dispatcher
              captures: { cart_id: $.data.id }
            - call: "POST /carts/${cart_id}/activate"
              payload: {}
              as: Dispatcher
            - call: "POST /routes"
              payload: { service_date: "2026-06-09T00:00:00Z", stream: "TRASH", assigned_driver_id: "drv-33" }
              as: Dispatcher
              captures: { route_id: $.data.id }
            - call: "POST /routes/${route_id}/stops"
              payload: { account_id: "${acct_id}", sequence: 1 }
              as: Dispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /stops/${stop_id}/pickups"
              payload: { cart_id: "${cart_id}" }
              as: Dispatcher
              captures: { pk_id: $.data.id }
            - call: "POST /routes/${route_id}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${route_id}/start"
              payload: {}
              as: Driver
            - call: "POST /pickups/${pk_id}/miss"
              payload: { miss_reason: "MISSED_BY_CREW" }
              as: Driver
            - call: "GET /missed-pickup-credits"
              payload: { account_id: "${acct_id}", status: "PENDING" }
              as: Billing
              captures: { credit_id: $.data.0.id }
          trigger:
            - call: "POST /missed-pickup-credits/${credit_id}/void"
              payload: {}
              as: Billing
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Billing
              captures: { bal: $.data.account_balance_cents }
          assert:
            - "MissedPickupCredit.${credit_id}.status == VOID"
            - "ServiceAccount.${acct_id}.account_balance_cents == 0"

