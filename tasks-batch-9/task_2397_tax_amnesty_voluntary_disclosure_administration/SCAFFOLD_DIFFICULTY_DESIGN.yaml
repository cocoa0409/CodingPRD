              as: ProgramAdministrator
              captures: { term_early_id: $.data.id }
          trigger:
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2023-01-01", eligible_period_end: "2026-07-01", min_liability_cents: 50000, penalty_waiver_pct: 0.80, interest_waiver_pct: 0.40 }
              as: ProgramAdministrator
              captures: { term_late_id: $.data.id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "SALES_USE", eligible_period_start: "2022-06-01", eligible_period_end: "2024-01-01", min_liability_cents: 50000 }
              as: ProgramAdministrator
              captures: { err_overlap: $.data.error_id }
            - call: "POST /amnesty/programs/${prog_id}/tax-type-terms"
              payload: { tax_type: "CORPORATE_INCOME", eligible_period_start: "2022-06-01", eligible_period_end: "2024-01-01", min_liability_cents: 100000, requires_prior_nonfiler: true }
              as: ProgramAdministrator
              captures: { term_ci_id: $.data.id }
          assert:
            - "the first trigger returns status 201"
            - "ProgramTaxTypeTerm.${term_late_id}.eligible_period_start == \"2023-01-01\""
            - "ProgramTaxTypeTerm.${term_late_id}.penalty_waiver_pct == 0.80"
            - "the second trigger returns status 409 with error_id ERR_TAX_TYPE_TERM_WINDOW_OVERLAP"
            - "the third trigger returns status 201"
            - "ProgramTaxTypeTerm.${term_ci_id}.tax_type == \"CORPORATE_INCOME\""
            - "ProgramTaxTypeTerm.${term_ci_id}.requires_prior_nonfiler == true"
            - "ProgramTaxTypeTerm.${term_early_id}.eligible_period_end == \"2023-01-01\""
            - "GET /amnesty/programs/${prog_id}/tax-type-terms returns total_count == 3"
            - "GET /amnesty/programs/${prog_id}/tax-type-terms?tax_type=SALES_USE returns total_count == 2"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: breach_rescission_restores_the_waiver_ledger_exactly
        grounds:
          - state_machines.VoluntaryDisclosureAgreement.BREACHED_to_EXECUTED
          - calculations.agreement_waiver_rollup
          - state_machines.PaymentPlan.DEFAULTED_to_ACTIVE
          - state_machines.EnforcementAction.ISSUED_to_ABATED
        distinguishing_aspect: |
          Rescission must undo all five breach hops with zero drift: the waiver ledger identity
          SUM(gross_penalty + gross_interest) == waived_amount_cents + SUM(payable) holds again at
          350000 == 300000 + 50000, installment 3 keeps its 28182 already-paid cents while
          returning to SCHEDULED, and the cascade's own EnforcementAction is ABATED with
          abatement_reason BREACH_RESCINDED rather than deleted.
        test_recipe:
          setup:
            - "Clock at 2026-09-15T00:00:00Z; OPEN program with installment_max_count 12 and one SALES_USE term"
            - "Taxpayer Cinder Row holds an EXECUTED agreement with one FILED return (waived 300000, total_due 1050000)"
            - "A 105000-cent down payment and an approved 11-installment plan exist; a further 200000-cent payment filled installments 1 and 2 and left 28182 on installment 3"
            - "The agreement was then declared breached, so reinstated_amount_cents is 300000, the plan is DEFAULTED with BREACH_CASCADE, installments 3..11 are VOIDED, a BREACH_CASCADE EnforcementAction is ISSUED and the score is 92"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /amnesty/programs"
              payload: { name: "FY27 Amnesty", window_open_at: "2026-09-01T00:00:00Z", window_close_at: "2026-12-01T00:00:00Z", lookback_months: 36, base_penalty_waiver_pct: 1.00, base_interest_waiver_pct: 0.50, post_program_penalty_multiplier: 2.00, revenue_forecast_cents: 100000000, installment_max_count: 12 }
              as: ProgramAdministrator
              captures: { prog_id: $.data.id }
