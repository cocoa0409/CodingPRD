          product_name: CY1
          category: FRUIT
          procurement_grade: SURPLUS
          unit_weight_grams: 200
          quantity_available: 200
          unit_cost_cents: 100
          harvest_date: '2026-09-01T00:00:00Z'
          expiry_date: '2026-09-20T00:00:00Z'
          ready_date: '2026-09-05T00:00:00Z'
        as: PlatformAdmin
        captures:
          ccy_lot: $.data.id
          c1v_cy: $.data.version
      - call: POST /produce/sourcing-bids
        payload:
          supply_lot_id: ${ccy_lot}
          supplier_id: ${ccy_s}
          bid_unit_cost_cents: 100
          quantity_offered: 200
        as: Supplier
        as_user_id: ${ccy_s}
      - call: POST /produce/supply-lots/${ccy_lot}/award
        payload:
          bidder_quota: 1
          expected_supply_lot_version: ${c1v_cy}
        as: PlatformAdmin
        captures:
          c2v_cy: $.data.version
      - call: POST /produce/supply-lots/${ccy_lot}/make-ready
        payload:
          quality_outcome: PASS
          expected_supply_lot_version: ${c2v_cy}
        as: PlatformAdmin
      - call: POST /produce/customers/register
        payload:
          email: cy@example.com
          full_name: Cy Cole
          service_region: NE
        as: Anonymous
        captures:
          ccy_cu: $.data.id
      - call: POST /produce/subscriptions
        payload:
          customer_id: ${ccy_cu}
          cadence: WEEKLY
        as: PlatformAdmin
        captures:
          ccy_sub: $.data.id
      - call: POST /produce/box-orders
        payload:
          customer_id: ${ccy_cu}
          subscription_id: ${ccy_sub}
          serving_cycle_index: 1
          cuisine_preference: STANDARD
        as: PlatformAdmin
        captures:
          ccy_ord: $.data.id
          ccy_ord_v: $.data.version
      - call: POST /produce/box-orders/${ccy_ord}/finalize
        payload:
          expected_box_order_version: ${ccy_ord_v}
        as: PlatformAdmin
        captures:
          ccy_ord_v2: $.data.version
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-04T12:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /produce/box-orders/${ccy_ord}/reroute-back
        payload:
          expected_box_order_version: ${ccy_ord_v2}
        as: PlatformAdmin
      assert:
      - BoxOrder.${ccy_ord}.status == DRAFT (the REROUTED to DRAFT edge of the cycle)
      - GET /produce/box-orders/${ccy_ord}/items?status=INCLUDED returns exactly 0 rows
      - GET /produce/box-orders/${ccy_ord}/cold-chain-packs returns exactly 0 rows
      - BoxOrder.${ccy_ord}.cold_chain_selected == false
      - BoxOrder.${ccy_ord}.build_blocked == false
