              as: Customer
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_FOUND"

      - name: reservation_not_found
        claim_type: Violation to Error
        grounds: ["errors[ERR_RESERVATION_NOT_FOUND]"]
        distinguishing_aspect: "GET /reservations with a non-existent id returns ERR_RESERVATION_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
