            - "pct_b == 0.5000 with axis_b == \"OUT_OF_ADHERENCE\""
            - "agent_pct_two == 0.6875 ((21600 + 8100) / (27000 + 16200)), NOT the 0.6500 mean of 0.8000 and 0.5000"
            - "flags_two == 2 and coach_two == \"COACHING_ACTIVE\""

      - name: generate_fills_cheapest_partner_first_and_skips_unaffordable_floor
        claim_type: waterfall_allocation
        grounds:
          - calculations.partner_allocation_waterfall
          - endpoints.POST_partner-allocations_generate
        distinguishing_aspect: |
          The waterfall sorts by rate ascending and fills each partner to its cap before moving on:
          against 82 allocatable, the 9000-millicent partner takes its full 50, the
          10000-millicent partner is SKIPPED because the 32 that remain fall below its
          commitment_floor_volume of 40, and the 12500-millicent partner takes the trailing 32. The
          result is exactly two PROPOSED rows in that order, and because PROPOSED moves no ledger
          the interval still reports partner_committed_volume 0 and unserved_volume 82.
        test_recipe:
          setup:
            - "One OPEN cycle with FG-P; interval 0 has volume 82 and allocatable_volume 82 (no published agents)."
            - "Three ACTIVE CHAT_EN partners: P-CHEAP rate 9000 / interval_max 50 / floor 10; P-MID rate 10000 / interval_max 60 / floor 40; P-DEAR rate 12500 / interval_max 50 / floor 10."
          setup_api_calls:
