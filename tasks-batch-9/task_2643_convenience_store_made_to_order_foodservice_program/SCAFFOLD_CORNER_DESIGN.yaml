            - "${all_first_seq} == 1"
            - "${all_last_seq} == 2"
            - "the unfiltered read is ordered by sequence_position then created_at, so both sequence_position 1 tickets precede both sequence_position 2 tickets"
            - "GET /stores/${store_id}/kitchen-queue?station=HOT_FOOD -> total_count == 0"

      - name: release_before_the_pickup_window_opens_is_rejected
        claim_type: conditional_action
        grounds:
          - endpoints[POST /orders/{id}/release]
          - validations[priority=37]
          - state_machines.Order.ASSEMBLED_to_READY
          - errors[ERR_PICKUP_WINDOW_NOT_OPEN]
        distinguishing_aspect: |
          A MOBILE_PREORDER order does NOT auto-advance to READY when its last ticket finishes - only a
          TOUCHSCREEN order does - so it sits at ASSEMBLED. Releasing it at 11:05:00Z, before its 13:00
          window opens, must return ERR_PICKUP_WINDOW_NOT_OPEN (409) and leave ready_at null; the identical
          call at exactly 13:00:00Z succeeds and stamps ready_at 13:00:00Z.
        test_recipe:
          setup:
            - "logical clock 2026-08-01T11:00:00Z; store in LUNCH with a PUBLISHED LUNCH plan and pickup_slot_capacity 2"
            - "one anonymous MOBILE_PREORDER order for the window 13:00:00Z to 13:30:00Z with a single coffee line"
            - "the order is placed and authorized, and its only ticket is started and completed, so it reads ASSEMBLED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
