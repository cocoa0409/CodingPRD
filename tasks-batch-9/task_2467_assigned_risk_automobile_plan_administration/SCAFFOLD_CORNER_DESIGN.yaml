  - section: consistency_model
    instances:
      - name: the_issuance_response_already_carries_every_derived_number
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /plan/policies].side_effects
          - calculations.annual_premium
          - calculations.plan_expense_charge
          - calculations.exposure_car_years
          - entities.Carrier.fields.assigned_risk_count
          - entities.Policy.fields.premium_credited_cents
        distinguishing_aspect: |
          The model is immediate, so a single POST must return the fully derived row - rating, expense
          tier, ledger sweep and exposure - and every counter it touched on other entities must already
          be correct on the very next read, with no reconciliation pass in between. Nothing here is
          allowed to lag: the assignment, the application, the carrier headcount and the applicant's
          deposit balance all move inside the issuance call.
        test_recipe:
          setup:
            - "Clock at 2026-09-15. Application 1 (T02, PLEASURE, ADULT, no violations) is certified with a 38939-cent deposit paid, and Assignment 1 is ACCEPTED with Atlas Mutual."
            - "Atlas holds quota_target_units 1 and assigned_risk_count 1 (incremented at selection, not at issuance); Period 2026-P3 runs 2026-09-01..2026-11-30 and is OPEN."
          setup_api_calls:
            - call: "POST /plan/_clock/set_current_utc"
