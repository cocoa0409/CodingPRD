          assert:
            - "${err_stale1} == \"ERR_STALE_VERSION\""
            - "Reservation.${res_cw2_id}.status == CONFIRMED"

      - name: occ_stale_incident_version_on_party_split
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[incident-split-stale-incident]
          - errors[ERR_STALE_VERSION]
          - endpoints.POST /car-share/incidents/{id}/party-split
        distinguishing_aspect: "After a successful party split bumps Incident.version, replaying the split with the earlier version is rejected with ERR_STALE_VERSION, while the split against the refreshed version proceeds."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership, one CONFIRMED reservation and one OPEN DAMAGE incident with repair_cost_cents 12000"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Split Stale", email: "split.stale@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_sps_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 3 }
              as: Member
              as_user_id: "${m_sps_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "GET /car-share/members/{m_sps_id}/memberships"
              as: PodOperator
              captures: { ms_sps_id: "$.data[0].id" }
            - call: "POST /car-share/pods"
              payload: { name: "Split Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_spl_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_spl_id}", vin: "VIN3160X1", model: "Amaze", capacity_seats: 5, next_service_miles: 52000 }
              as: FleetAdmin
              captures: { veh_cx1_id: $.data.id, veh_cx1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_sps_id}", pod_id: "${pod_spl_id}", vehicle_id: "${veh_cx1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cx1_ver}" }
              as: Member
              as_user_id: "${m_sps_id}"
              captures: { res_cx1_id: $.data.id }
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_cx1_id}", vehicle_id: "${veh_cx1_id}", member_id: "${m_sps_id}", incident_type: "DAMAGE", repair_cost_cents: 12000 }
              as: PodOperator
              captures: { inc_cx1_id: $.data.id, inc_cx1_ver: $.data.version }
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_cx1_ver}" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_cx1_ver}" }
              as: PodOperator
              captures: { err_stale2: $.data.error_id }
          assert:
            - "${err_stale2} == \"ERR_STALE_VERSION\""
            - "Incident.${inc_cx1_id}.status == FEE_CHARGED"
            - "Membership.${ms_sps_id}.status == FROZEN"

      - name: occupant_release_credits_wallet_once_on_thaw
        claim_type: scheduled_actions
        grounds:
          - calculations.membership_thaw_and_residual_release
          - state_machines.Membership.FROZEN_to_ACTIVE
          - entities.Membership.fields.residual_released_cents
        distinguishing_aspect: "Closing a frozen membership releases exactly floor(8550 * 80 / 100) == 6840 once, and a second close is refused with ERR_ALREADY_RELEASED so the wallet does not double-credit."
        test_recipe:
          setup: ["One approved member with an ACTIVE primary membership billed 8550, driven into FROZEN by a party split, and then CLOSED"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Residual Member", email: "residual.member@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_res_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 3 }
              as: Member
              as_user_id: "${m_res_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "GET /car-share/members/{m_res_id}/memberships"
              as: PodOperator
              captures: { ms_res_id: "$.data[0].id" }
            - call: "POST /car-share/pods"
              payload: { name: "Residual Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_res_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_res_id}", vin: "VIN3160Y1", model: "Glanza", capacity_seats: 5, next_service_miles: 53000 }
              as: FleetAdmin
              captures: { veh_cy1_id: $.data.id, veh_cy1_ver: $.data.version }
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_res_id}", pod_id: "${pod_res_id}", vehicle_id: "${veh_cy1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cy1_ver}" }
              as: Member
              as_user_id: "${m_res_id}"
              captures: { res_cy1_id: $.data.id }
            - call: "POST /car-share/incidents"
              payload: { reservation_id: "${res_cy1_id}", vehicle_id: "${veh_cy1_id}", member_id: "${m_res_id}", incident_type: "DAMAGE", repair_cost_cents: 12000 }
              as: PodOperator
              captures: { inc_cy1_id: $.data.id, inc_cy1_ver: $.data.version }
            - call: "POST /car-share/incidents/{id}/party-split"
              payload: { expected_incident_version: "${inc_cy1_ver}" }
              as: PodOperator
          trigger:
            - call: "POST /car-share/memberships/{id}/close"
              payload: {}
              as: UniversityAccountAdmin
              captures: { ms_res_released: $.data.residual_released_cents }
            - call: "POST /car-share/memberships/{id}/close"
              payload: {}
              as: UniversityAccountAdmin
              captures: { err_rel1: $.data.error_id }
          assert:
            - "${ms_res_released} == 6840"
            - "${err_rel1} == \"ERR_ALREADY_RELEASED\""
            - "Membership.${ms_res_id}.status == FROZEN"
            - "Member.${m_res_id}.wallet_credit_cents == 6840"

  # ===========================================================================
  # section: consistency_model  (immediate)
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_visibility_of_derived_fields_in_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Pod.fields.available_bays
          - state_machines.Vehicle.AVAILABLE_to_RESERVED
        distinguishing_aspect: "Every derived field written by a cascade is visible in the response of the request that caused it: the confirmation call returns a pod whose available_bays and utilization_score already reflect the new occupancy."
        test_recipe:
          setup: ["One approved member with an ACTIVE membership and one AVAILABLE campus-pod vehicle in a capacity-3 pod"]
          setup_api_calls:
            - call: "POST /car-share/member-registrations"
              payload: { full_name: "Immediate Member", email: "immediate.member@x.com", kind: "INDIVIDUAL" }
              as: Anonymous
              captures: { m_imm_id: $.data.id }
            - call: "POST /car-share/members/{id}/driving-record-reports"
              payload: { license_state: "CA", license_years_held: 5 }
              as: Member
              as_user_id: "${m_imm_id}"
            - call: "POST /car-share/driving-record-reports/{id}/decision"
              payload: { report_decision: "CLEAR" }
              as: PodOperator
            - call: "POST /car-share/members/{id}/application-decision"
              payload: { decision: "APPROVE" }
              as: PodOperator
            - call: "POST /car-share/pods"
              payload: { name: "Immediate Lot", site_type: "CAMPUS", capacity: 3, fuel_floor_pct: 20 }
              as: FleetAdmin
              captures: { pod_imm_id: $.data.id }
            - call: "POST /car-share/vehicles"
              payload: { pod_id: "${pod_imm_id}", vin: "VIN3160Z1", model: "i10", capacity_seats: 5, next_service_miles: 54000 }
              as: FleetAdmin
              captures: { veh_cz1_id: $.data.id, veh_cz1_ver: $.data.version }
          trigger:
            - call: "POST /car-share/reservations"
              payload: { member_id: "${m_imm_id}", pod_id: "${pod_imm_id}", vehicle_id: "${veh_cz1_id}", start_at: "2026-09-05T09:00:00Z", end_at: "2026-09-05T13:00:00Z", reserved_hours: 4, expected_vehicle_version: "${veh_cz1_ver}" }
              as: Member
              as_user_id: "${m_imm_id}"
              captures: { res_cz1_id: $.data.id }
          assert:
            - "Reservation.${res_cz1_id}.status == CONFIRMED"
            - "GET /car-share/pods/${pod_imm_id} immediately returns available_bays 2"
            - "GET /car-share/vehicles/${veh_cz1_id} immediately returns use_status RESERVED"