        grounds:
          - roles[CustomerService].exclusive_operations
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The Customer role is not listed on the submit endpoint, so a Customer calling it is refused with ERR_UNAUTHORIZED and status 403 while the CustomerService call on the same request succeeds."
        test_recipe:
          setup: ["One FAMILY account and one ACTIVE PREPAID line with a drafted port request"]
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1313", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
