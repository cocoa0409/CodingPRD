          - entities.Merchant.fields.lifetime_net_assessed_cents
        distinguishing_aspect: "With a lifetime ledger of only 80 cents the 2500 bps component is 20 cents, so MIN_PENALTY_CENTS 5000 governs; an implementation that omits the floor would assess 20."
