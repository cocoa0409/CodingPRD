# §1.9 Scaffold Corner Design — Coverage Index (single top-level key)
scaffold_corner_design:
- section: entities
  instances:
  - name: project_creation_applies_declared_defaults
    claim_type: defaults
    grounds:
    - entities.Project.fields.bid_status
    - entities.Project.fields.project_status
    - entities.Project.fields.retention_rate_pct
    - entities.Project.fields.total_bid_cents
    distinguishing_aspect: 'A create carrying only the four required scalars still comes back with contract_type

      UNIT_PRICE, retention_rate_pct 5.0, advertised_dbe_goal_pct 0.0, bid_status DRAFT and

      project_status PRE_BID — every default the §1.1 table declares.

      '
    test_recipe:
      setup:
      - empty database, logical clock at its 2026-09-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5701
          owner_agency_name: Caltrans District 4
          bid_deadline_at: '2026-12-01T00:00:00Z'
        as: Estimator
        captures:
          p_def: $.data.id
      assert:
      - Project.${p_def}.contract_type == UNIT_PRICE
      - Project.${p_def}.retention_rate_pct == 5.0
      - Project.${p_def}.advertised_dbe_goal_pct == 0.0
      - Project.${p_def}.bid_status == DRAFT
      - Project.${p_def}.project_status == PRE_BID
      - Project.${p_def}.total_bid_cents == 0
      - Project.${p_def}.version == 1
  - name: project_missing_required_field_returns_invalid_request
    claim_type: required_fields
    grounds:
    - entities.Project.fields.owner_agency_name
    - errors[ERR_INVALID_REQUEST]
    - validations[priority=3]
    distinguishing_aspect: 'Omitting owner_agency_name while supplying the other three required fields is rejected

      with ERR_INVALID_REQUEST and HTTP 400 before any existence or business rule is consulted.

      '
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5702
          bid_deadline_at: '2026-12-01T00:00:00Z'
        as: Estimator
        captures:
          req_err: $.data.error_id
      assert:
      - error response error_id == ERR_INVALID_REQUEST
      - error response http_status == 400
  - name: bid_item_invalid_unit_of_measure_returns_invalid_request
    claim_type: type_constraints
    grounds:
    - entities.BidItem.fields.unit_of_measure
    - errors[ERR_INVALID_REQUEST]
    - validations[priority=3]
    distinguishing_aspect: 'unit_of_measure is a closed enum of LF, CY, TON, EA and SY; the value GALLON is outside

      it and is rejected with ERR_INVALID_REQUEST rather than being coerced or stored.

      '
    test_recipe:
      setup:
      - one project exists in DRAFT
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5703
          owner_agency_name: Caltrans District 4
          bid_deadline_at: '2026-12-01T00:00:00Z'
        as: Estimator
        captures:
          p_enum: $.data.id
      trigger:
      - call: POST /construction/projects/${p_enum}/bid-items
        payload:
          item_code: 2025-390201
          item_description: Tack coat
          unit_of_measure: GALLON
          estimated_quantity: 500
        as: Estimator
        captures:
          enum_err: $.data.error_id
      assert:
      - error response error_id == ERR_INVALID_REQUEST
      - error response http_status == 400
  - name: project_get_unknown_id_returns_project_not_found
    claim_type: not_found
    grounds:
    - errors[ERR_PROJECT_NOT_FOUND]
    - validations[priority=4]
    distinguishing_aspect: 'A structurally valid but unallocated project id on the single-resource read returns

      ERR_PROJECT_NOT_FOUND with HTTP 404 and never leaks an empty object.

      '
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: GET /construction/projects/00000000-0000-4000-8000-0000000000ff
        payload: {}
        as: Estimator
        captures:
          nf_err: $.data.error_id
      assert:
      - error response error_id == ERR_PROJECT_NOT_FOUND
      - error response http_status == 404
  - name: bid_item_create_under_unknown_project_returns_project_not_found
    claim_type: parent_relationships
    grounds:
    - entities.BidItem.fields.project_id
    - validations[priority=4]
    distinguishing_aspect: 'The nested creation validates the path parent before the body, so an unknown project id

      raises ERR_PROJECT_NOT_FOUND even though the item payload itself is complete and legal.

      '
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /construction/projects/00000000-0000-4000-8000-0000000000fe/bid-items
        payload:
          item_code: 2025-390202
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
        as: Estimator
        captures:
          par_err: $.data.error_id
      assert:
      - error response error_id == ERR_PROJECT_NOT_FOUND
      - error response http_status == 404
  - name: bid_item_creation_initialises_computed_fields_to_zero
    claim_type: computed_fields
    grounds:
    - entities.BidItem.fields.measured_quantity
    - entities.BidItem.fields.variance_pct
    - entities.BidItem.fields.renegotiation_required
    - entities.BidItem.fields.balanced_unit_price_cents
    distinguishing_aspect: 'A freshly created pay item reports measured_quantity 0, variance_pct 0.0,

      renegotiation_required false and balanced_unit_price_cents 0 even though the request

      never mentions those fields.

      '
    test_recipe:
      setup:
      - one project exists in DRAFT
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5704
          owner_agency_name: Caltrans District 4
          bid_deadline_at: '2026-12-01T00:00:00Z'
        as: Estimator
        captures:
          p_comp: $.data.id
      trigger:
      - call: POST /construction/projects/${p_comp}/bid-items
        payload:
          item_code: 2025-390203
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
        as: Estimator
        captures:
          bi_comp: $.data.id
      assert:
      - BidItem.${bi_comp}.measured_quantity == 0
      - BidItem.${bi_comp}.variance_pct == 0.0
      - BidItem.${bi_comp}.renegotiation_required == false
      - BidItem.${bi_comp}.balanced_unit_price_cents == 0
      - BidItem.${bi_comp}.item_status == DRAFT
  - name: surety_creation_initialises_capacity_split
    claim_type: computed_fields
    grounds:
    - entities.Surety.fields.capacity_consumed_cents
    - entities.Surety.fields.available_capacity_cents
    - calculations.surety_exposure_capacity
    distinguishing_aspect: 'A newly registered surety with 250000000 cents of aggregate capacity reports zero

      consumed and the full 250000000 available, so the capacity split is derived at creation

      rather than left null.

      '
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /construction/sureties
        payload:
          surety_name: Cascade Indemnity
          aggregate_capacity_cents: 250000000
          single_job_limit_cents: 200000000
        as: PlatformAdmin
        captures:
          s_cap: $.data.id
      assert:
      - Surety.${s_cap}.capacity_consumed_cents == 0
      - Surety.${s_cap}.available_capacity_cents == 250000000
      - Surety.${s_cap}.surety_status == ACTIVE
- section: state_machines
  instances:
  - name: project_starts_in_draft_bid_status
    claim_type: initial_state
    grounds:
    - state_machines.Project.initial_state
    - entities.Project.fields.bid_status
    distinguishing_aspect: 'The declared initial state of the bid dimension is DRAFT and it is the value every

      freshly created project carries, not PRE_BID and not SEALED.

      '
    test_recipe:
      setup:
      - empty database
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5705
          owner_agency_name: Caltrans District 4
          bid_deadline_at: '2026-12-01T00:00:00Z'
        as: Estimator
        captures:
          p_init: $.data.id
      assert:
      - Project.${p_init}.bid_status == DRAFT
  - name: sealing_a_sealed_project_returns_invalid_state
    claim_type: idempotency
    grounds:
    - state_machines.Project.DRAFT_to_SEALED
    - errors[ERR_INVALID_STATE]
    - validations[priority=16]
    distinguishing_aspect: 'Replaying the seal action against a project already in SEALED fails with

      ERR_INVALID_STATE and leaves total_bid_cents untouched — the second attempt is not a

      no-op success.

      '
    test_recipe:
      setup:
      - one project with a SUBMITTED pay item already sealed
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5706
          owner_agency_name: Caltrans District 4
          bid_deadline_at: '2026-12-01T00:00:00Z'
        as: Estimator
        captures:
          p_replay: $.data.id
      - call: POST /construction/projects/${p_replay}/bid-items
        payload:
          item_code: 2025-390204
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
        as: Estimator
        captures:
          bi_replay: $.data.id
      - call: POST /construction/projects/${p_replay}/bid-items/${bi_replay}/price
        payload:
          bid_unit_price_cents: 3000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_replay}/bid-items/${bi_replay}/submit
        payload: {}
        as: Estimator
      - call: POST /construction/projects/${p_replay}/seal-bid
        payload: {}
        as: Estimator
      trigger:
      - call: POST /construction/projects/${p_replay}/seal-bid
        payload: {}
        as: Estimator
        captures:
          replay_err: $.data.error_id
      assert:
      - error response error_id == ERR_INVALID_STATE
      - error response http_status == 409
      - Project.${p_replay}.bid_status == SEALED
      - Project.${p_replay}.total_bid_cents == 3000000
  - name: approving_an_already_payable_measurement_returns_invalid_state
    claim_type: invalid_transition
    grounds:
    - state_machines.ProgressMeasurement.APPROVED_to_PAYABLE
    - errors[ERR_INVALID_STATE]
    - validations[priority=16]
    distinguishing_aspect: 'From PAYABLE there is no transition back to APPROVED, so a repeated approve is rejected

      with ERR_INVALID_STATE while the measurement keeps its payable amount.

      '
    test_recipe:
      setup:
      - one ACTIVE project whose measurement is already PAYABLE
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/sureties
        payload:
          surety_name: Pacific Surety Co
          aggregate_capacity_cents: 200000000
          single_job_limit_cents: 150000000
        as: PlatformAdmin
        captures:
          s_inv: $.data.id
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5707
          owner_agency_name: Caltrans District 4
          bid_deadline_at: '2026-12-01T00:00:00Z'
          retention_rate_pct: 5.0
          advertised_dbe_goal_pct: 0.0
        as: Estimator
        captures:
          p_inv: $.data.id
      - call: POST /construction/projects/${p_inv}/bid-items
        payload:
          item_code: 2025-390205
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
        as: Estimator
        captures:
          bi_inv: $.data.id
      - call: POST /construction/projects/${p_inv}/bid-items/${bi_inv}/price
        payload:
          bid_unit_price_cents: 2000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_inv}/bid-items/${bi_inv}/submit
        payload: {}
        as: Estimator
      - call: POST /construction/surety-commitments
        payload:
          surety_id: ${s_inv}
          project_id: ${p_inv}
          committed_amount_cents: 12000000
        as: ContractingOfficer
      - call: POST /construction/bonds
        payload:
          project_id: ${p_inv}
          surety_id: ${s_inv}
          bond_type: PERFORMANCE
          bond_amount_cents: 12000000
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          maintain_bond_horizon_days: 30
        as: Estimator
        captures:
          b_inv: $.data.id
      - call: POST /construction/projects/${p_inv}/seal-bid
        payload: {}
        as: Estimator
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-12-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects/${p_inv}/open-bid
        payload: {}
        as: ContractingOfficer
      - call: POST /construction/bonds/${b_inv}/issue
        payload: {}
        as: Surety
        as_user_id: ${s_inv}
      - call: POST /construction/projects/${p_inv}/start-work
        payload: {}
        as: ProjectManager
      - call: POST /construction/projects/${p_inv}/reconciliations
        payload: {}
        as: ContractingOfficer
      - call: GET /construction/bid-items/${bi_inv}
        payload: {}
        as: Estimator
        captures:
          biv_inv: $.data.version
      - call: POST /construction/bid-items/${bi_inv}/measurements
        payload:
          measured_quantity: 400
          measured_at: '2026-12-02T00:00:00Z'
          expected_bid_item_version: ${biv_inv}
        as: ProjectManager
        captures:
          m_inv: $.data.id
      - call: POST /construction/measurements/${m_inv}/approve
        payload: {}
        as: ProjectManager
      - call: POST /construction/measurements/${m_inv}/pay
        payload: {}
        as: ProjectManager
      trigger:
      - call: POST /construction/measurements/${m_inv}/approve
        payload: {}
        as: ProjectManager
        captures:
          inv_err: $.data.error_id
      assert:
      - error response error_id == ERR_INVALID_STATE
      - error response http_status == 409
      - ProgressMeasurement.${m_inv}.measurement_status == PAYABLE
      - ProgressMeasurement.${m_inv}.payable_amount_cents == 80000
  - name: releasing_an_already_released_bond_returns_invalid_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Bond.terminal_states
    - state_machines.Bond.ISSUED_to_RELEASED
    - errors[ERR_INVALID_STATE]
    - validations[priority=16]
    distinguishing_aspect: 'RELEASED is a terminal state for a bond, so a second release-bond call is rejected with

      ERR_INVALID_STATE instead of silently succeeding; the surety''s capacity does not move.

      '
    test_recipe:
      setup:
      - one PENDING bond already released against a surety with full capacity
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/sureties
        payload:
          surety_name: Pacific Surety Co
          aggregate_capacity_cents: 200000000
          single_job_limit_cents: 150000000
        as: PlatformAdmin
        captures:
          s_term: $.data.id
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5708
          owner_agency_name: Caltrans District 4
          bid_deadline_at: '2026-12-01T00:00:00Z'
        as: Estimator
        captures:
          p_term: $.data.id
      - call: POST /construction/bonds
        payload:
          project_id: ${p_term}
          surety_id: ${s_term}
          bond_type: BID
          bond_amount_cents: 300000
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2026-12-01T00:00:00Z'
          maintain_bond_horizon_days: 30
        as: Estimator
        captures:
          b_term: $.data.id
      - call: POST /construction/bonds/${b_term}/release-bond
        payload: {}
        as: ContractingOfficer
      trigger:
      - call: POST /construction/bonds/${b_term}/release-bond
        payload: {}
        as: ContractingOfficer
        captures:
          term_err: $.data.error_id
      assert:
      - error response error_id == ERR_INVALID_STATE
      - error response http_status == 409
      - Bond.${b_term}.bond_status == RELEASED
      - Bond.${b_term}.capacity_consumed_cents == 0
  - name: denying_a_determined_condition_returns_invalid_state
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.DifferingSiteCondition.terminal_states
    - state_machines.DifferingSiteCondition.UNDER_REVIEW_to_DETERMINED
    - errors[ERR_INVALID_STATE]
    - validations[priority=16]
    distinguishing_aspect: 'DENIED is only reachable from REPORTED, DOCUMENTED or UNDER_REVIEW; once the engineer has

      determined the claim, the deny action fails with ERR_INVALID_STATE.

      '
    test_recipe:
      setup:
      - one ACTIVE project carrying a determination-issued differing site condition
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/sureties
        payload:
          surety_name: Pacific Surety Co
          aggregate_capacity_cents: 200000000
          single_job_limit_cents: 150000000
        as: PlatformAdmin
        captures:
          s_dsc: $.data.id
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5709
          owner_agency_name: Caltrans District 4
          bid_deadline_at: '2026-12-01T00:00:00Z'
          retention_rate_pct: 5.0
          advertised_dbe_goal_pct: 0.0
        as: Estimator
        captures:
          p_dsc: $.data.id
      - call: POST /construction/projects/${p_dsc}/bid-items
        payload:
          item_code: 2025-390206
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
        as: Estimator
        captures:
          bi_dsc: $.data.id
      - call: POST /construction/projects/${p_dsc}/bid-items/${bi_dsc}/price
        payload:
          bid_unit_price_cents: 2000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
          daily_productivity_units: 1000
        as: Estimator
      - call: POST /construction/projects/${p_dsc}/bid-items/${bi_dsc}/submit
        payload: {}
        as: Estimator
      - call: POST /construction/bonds
        payload:
          project_id: ${p_dsc}
          surety_id: ${s_dsc}
          bond_type: PERFORMANCE
          bond_amount_cents: 12000000
          effective_from: '2026-09-01T00:00:00Z'
          effective_to: '2027-09-01T00:00:00Z'
          maintain_bond_horizon_days: 30
        as: Estimator
        captures:
          b_dsc: $.data.id
      - call: POST /construction/projects/${p_dsc}/seal-bid
        payload: {}
        as: Estimator
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-12-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects/${p_dsc}/open-bid
        payload: {}
        as: ContractingOfficer
      - call: POST /construction/bonds/${b_dsc}/issue
        payload: {}
        as: Surety
        as_user_id: ${s_dsc}
      - call: POST /construction/projects/${p_dsc}/start-work
        payload: {}
        as: ProjectManager
      - call: POST /construction/differing-site-conditions
        payload:
          project_id: ${p_dsc}
          reported_at: '2026-12-03T00:00:00Z'
          claimed_amount_cents: 3000000
        as: ProjectManager
        captures:
          dsc_term: $.data.id
      - call: POST /construction/differing-site-conditions/${dsc_term}/document
        payload:
          documentation_package_urls:
          - https://docs.granite.example/dsc/002.pdf
        as: ProjectManager
      - call: POST /construction/differing-site-conditions/${dsc_term}/submit-claim
        payload: {}
        as: ProjectManager
      - call: POST /construction/differing-site-conditions/${dsc_term}/engineer-determination
        payload:
          determination_type: TIME_EXTENSION
          days_granted: 14
        as: Engineer
        captures:
          det_term: $.data.id
      trigger:
      - call: POST /construction/differing-site-conditions/${dsc_term}/deny
        payload: {}
        as: Engineer
        captures:
          deny_err: $.data.error_id
      assert:
      - error response error_id == ERR_INVALID_STATE
      - error response http_status == 409
      - DifferingSiteCondition.${dsc_term}.condition_status == DETERMINED
      - EngineerDetermination.${det_term}.determination_status == ISSUED
- section: calculations
  instances:
  - name: bid_extension_excludes_draft_items
    claim_type: input_set_filtering
    grounds:
    - calculations.project_bid_extension
    - entities.BidItem.fields.item_status
    distinguishing_aspect: 'A pay item left in DRAFT is outside the SUM_EXCLUDED_STATUSES population, so the project''s

      total_bid_cents reflects only the SUBMITTED item even though the draft item carries a

      non-zero unit price.

      '
    test_recipe:
      setup:
      - one project holding one SUBMITTED item of 1000 TON at 2000 cents and one DRAFT item of 500 TON at 9000 cents
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5710
          owner_agency_name: Caltrans District 4
          bid_deadline_at: '2026-12-01T00:00:00Z'
        as: Estimator
        captures:
          p_filt: $.data.id
      - call: POST /construction/projects/${p_filt}/bid-items
        payload:
          item_code: 2025-390207
          item_description: Class 2 aggregate base
          unit_of_measure: TON
          estimated_quantity: 1000
        as: Estimator
        captures:
          bi_filt: $.data.id
      - call: POST /construction/projects/${p_filt}/bid-items/${bi_filt}/price
        payload:
          bid_unit_price_cents: 2000
          crew_day_labor_cents: 1200000
          crew_day_equipment_cents: 800000
