            - { call: "POST /api/dossier-items", payload: { case_id: "${case_s}", category: "TEACHING", title: "T2", page_count: 10, expected_case_version: "${case_s_v} + 1" }, as: Candidate, as_user_id: "${cand_s}", captures: { s_t2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_s}", category: "TEACHING", title: "T3", page_count: 8, expected_case_version: "${case_s_v} + 2" }, as: Candidate, as_user_id: "${cand_s}", captures: { s_t3: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_s}", category: "RESEARCH", title: "R1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_s_v} + 3" }, as: Candidate, as_user_id: "${cand_s}", captures: { s_r1: $.data.id } }
