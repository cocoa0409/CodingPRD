              as: ToxicologyReviewer
              as_user_id: "tox_1"
            - call: "GET /products/${prod_1}"
              payload: {}
              as: RegistryAdmin
            - call: "POST /products/${prod_1}/transitions"
              payload: { action: "MARKET" }
              as: RegistryAdmin
          assert:
            - "first trigger call (assessment only PEER_REVIEWED, so the chemical has no FINAL assessment): HTTP 409 with error_id ERR_PRODUCT_ON_ENFORCEMENT_HOLD and Product.${prod_1}.compliance_posture == EXPOSURE_UNKNOWN"
            - "after FINALIZE: ExposureAssessment.${asmt_1}.daily_exposure_ug == 0.250, margin_ratio == 0.5000, result == BELOW_SAFE_HARBOR, contribution_count == 1"
            - "GET /products/${prod_1}: compliance_posture == CLEAR (ladder clauses 1-4 all fail) and lifecycle_state == DEVELOPMENT"
            - "fourth trigger call: HTTP 200 and Product.${prod_1}.lifecycle_state == MARKETED with compliance_posture still CLEAR"

      - name: sm_revise_safe_harbor_cascade_down_to_placements
        claim_type: side_effect_execution
        grounds:
          - state_machines.ListedChemical.LISTED_to_LISTED
          - state_machines.ExposureAssessment.FINAL_to_SUPERSEDED
        distinguishing_aspect: |
          one LISTED -> LISTED self-transition must propagate down to assessments, the determination and its placements rather than only bumping revision_count.
        excluded_because:
          difficulty_instance: transitive_cascade / revise_safe_harbor_cascades_four_levels
          rationale: "Every side effect of REVISE_SAFE_HARBOR, down to placement NON_COMPLIANT flagging and posture recompute, is asserted level by level in that 1.8 instance."

      - name: sm_reformulation_submit_verification_cross_entity_side_effects
        claim_type: side_effect_execution
        grounds:
          - state_machines.ReformulationProject.IN_PROGRESS_to_VERIFICATION
          - state_machines.MaterialChemical.VERIFIED_to_DECLARED
        distinguishing_aspect: |
          SUBMIT_VERIFICATION writes to a different entity than the one being transitioned, so its side effects must be observed on the MaterialChemical, the assessments and the product.
        excluded_because:
          difficulty_instance: transitive_cascade / reformulation_verification_cascades_three_levels
          rationale: "The concentration rewrite, the assessment supersede and the determination REVOKE are all asserted there."

      - name: sm_notice_cure_fork_and_join
        claim_type: valid_transition
        grounds:
          - state_machines.NoticeOfViolation.CURE_ELECTED_to_CURE_FAILED
          - state_machines.NoticeOfViolation.CURE_FAILED_to_SETTLEMENT_NEGOTIATION
        distinguishing_aspect: |
          the cure branch is a fork that rejoins the settlement track, and the rejoin must preserve the durable cure_attempted marker.
        excluded_because:
          difficulty_instance: non_linear_state_machine / notice_cure_fork_and_join_rejoins_settlement
          rationale: "The fork, the failed-cure rejoin and the durable cure_attempted marker are the subject of that 1.8 instance."

      - name: sm_settlement_void_compensates_execute
        claim_type: side_effect_execution
        grounds:
          - state_machines.Settlement.EXECUTED_to_VOID
          - state_machines.NoticeOfViolation.SETTLED_to_SETTLEMENT_NEGOTIATION
        distinguishing_aspect: |
          VOID is a compensating transition: every counter ACCEPT_EXECUTE moved must be moved back by exactly the same amount.
        excluded_because:
          difficulty_instance: compensating_invariant / settlement_void_restores_accrued_penalty_and_open_notice_count
          rationale: "The compensation pattern (every ACCEPT_EXECUTE side effect reversed with no drift) is asserted there."

      - name: sm_assessment_reject_reopen_cycle
        claim_type: valid_transition
        grounds:
          - state_machines.ExposureAssessment.REJECTED_to_DRAFT
          - entities.ExposureAssessment.fields.rejection_count
        distinguishing_aspect: |
          REJECT/REOPEN forms a genuine cycle whose rejection_count accumulates instead of resetting each time the assessment returns to DRAFT.
        excluded_because:
          difficulty_instance: non_linear_state_machine / assessment_reject_reopen_cycle_hits_rejection_ceiling
          rationale: "The cyclic reject/reopen path and its ceiling are asserted there."

  # ===========================================================================
  # SECTION 3 - calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: calc_effective_concentration_rolls_up_nested_material_tree
        claim_type: topological
        grounds:
          - calculations.effective_concentration_ppm
          - calculations.daily_exposure_ug
          - entities.Material.fields.parent_mass_fraction
        distinguishing_aspect: |
          The roll-up is post-order over parent_material_id and rounds to 4 decimals at each level,
          so a grandchild's contribution is scaled twice: eff(G) = 8.0000, eff(C) = 12.5 + 0.5 x
          8.0000 = 16.5000, eff(P) = 10.0 + 0.3 x 16.5000 = 14.9500. A flat implementation that
          ignored the grandchild would yield 13.7500 and one that multiplied the fractions together
          (0.3 x 0.5 x 8.0) without first adding C's own 12.5 would yield 11.2000.
          effective_concentration_ppm is never surfaced on its own, so each level is pinned through
          an observable field: a one-component probe product per material makes
          total_listed_chemical_load_ug == eff x 0.25 for that level.
        test_recipe:
          setup:
            - "Bisphenol A is LISTED with MADL 0.5 ug/day and is the only LISTED chemical, so total_listed_chemical_load_ug has exactly one term per ACTIVE component."
            - "Three materials form a chain: RM-PARENT (own 10.0 ppm), RM-CHILD (own 12.5 ppm, parent RM-PARENT at mass fraction 0.3), RM-GRAND (own 8.0 ppm, parent RM-CHILD at mass fraction 0.5). All three have VERIFIED disclosure so no MODELED_DEFAULT_PPM substitution occurs."
            - "Product SKU-TREE has one ACTIVE component of RM-PARENT at 0.25 g/unit, contact_factor 0.5; probe products SKU-TREE-C and SKU-TREE-G each hold one ACTIVE component of RM-CHILD and RM-GRAND respectively at the same 0.25 g/unit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /listed-chemicals"
              payload: { chemical_name: "Bisphenol A", cas_number: "80-05-7", endpoint_type: "REPRODUCTIVE_FEMALE", safe_harbor_basis: "MADL", safe_harbor_level_ug_per_day: 0.5 }
              as: RegistryAdmin
              captures: { chem_bpa: $.data.id }
            - call: "POST /listed-chemicals/${chem_bpa}/transitions"
              payload: { action: "LIST", listing_effective_date: "2026-01-01T00:00:00Z" }
              as: RegistryAdmin
            - call: "POST /suppliers"
              payload: { legal_name: "Northgate Polymers", contact_email: "qa@northgate.example" }
              as: ComplianceAnalyst
              captures: { sup_1: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-PARENT", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}" }
              as: ComplianceAnalyst
              captures: { mat_p: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-CHILD", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}", parent_material_id: "${mat_p}", parent_mass_fraction: 0.3 }
              as: ComplianceAnalyst
              captures: { mat_c: $.data.id }
            - call: "POST /materials"
              payload: { material_code: "RM-GRAND", material_class: "RAW_MATERIAL", supplier_id: "${sup_1}", parent_material_id: "${mat_c}", parent_mass_fraction: 0.5 }
              as: ComplianceAnalyst
              captures: { mat_g: $.data.id }
            - call: "POST /materials/${mat_p}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 10.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_c}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 12.5 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_g}/chemicals"
              payload: { chemical_id: "${chem_bpa}", declared_concentration_ppm: 8.0 }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_p}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_p}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_p}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_c}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_c}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_c}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_g}/disclosure"
              payload: { action: "REQUEST" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_g}/disclosure"
              payload: { action: "RECORD_RESPONSE", response_completeness: "COMPLETE" }
              as: ComplianceAnalyst
            - call: "POST /materials/${mat_g}/disclosure"
              payload: { action: "VERIFY" }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-TREE", product_name: "Nested Tree Widget", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_1: $.data.id }
            - call: "POST /products/${prod_1}/components"
              payload: { material_id: "${mat_p}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products/${prod_1}/exposure-assessments"
              payload: { chemical_id: "${chem_bpa}", method: "MODELED", route: "DERMAL", uses_per_day: 1.0 }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
              captures: { asmt_1: $.data.id }
            - call: "POST /products"
              payload: { sku: "SKU-TREE-C", product_name: "Child Probe", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_c: $.data.id }
            - call: "POST /products/${prod_c}/components"
              payload: { material_id: "${mat_c}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
            - call: "POST /products"
              payload: { sku: "SKU-TREE-G", product_name: "Grandchild Probe", product_category: "CONSUMER_GOOD", distribution_channels: ["RETAIL"], label_area_sq_in: 10.0, annual_units: 1000 }
              as: RegistryAdmin
              captures: { prod_g: $.data.id }
            - call: "POST /products/${prod_g}/components"
              payload: { material_id: "${mat_g}", quantity_grams_per_unit: 0.25, contact_factor: 0.5 }
              as: ComplianceAnalyst
          trigger:
            - call: "POST /exposure-assessments/${asmt_1}/transitions"
              payload: { action: "SUBMIT" }
              as: ComplianceAnalyst
              as_user_id: "ca_1"
            - call: "GET /exposure-assessments/${asmt_1}"
              payload: {}
              as: ComplianceAnalyst
            - call: "GET /materials/${mat_g}"
              payload: {}
              as: ComplianceAnalyst
            - call: "GET /products/${prod_g}"
              payload: {}
              as: ComplianceAnalyst
            - call: "GET /products/${prod_c}"
              payload: {}
              as: ComplianceAnalyst
            - call: "GET /products/${prod_1}"
              payload: {}
              as: ComplianceAnalyst
          assert:
            - "Product.${prod_g}.total_listed_chemical_load_ug == 2.000, pinning eff(RM-GRAND) == 8.0000 (leaf: own declared value only)"
            - "Product.${prod_c}.total_listed_chemical_load_ug == 4.125, pinning eff(RM-CHILD) == 16.5000 (12.5 + 0.5 x 8.0000)"
            - "Product.${prod_1}.total_listed_chemical_load_ug == 3.738, pinning eff(RM-PARENT) == 14.9500 (10.0 + 0.3 x 16.5000 = 14.9500; 14.9500 x 0.25 = 3.7375 -> 3.738). A flat roll-up (13.7500) would give 3.438 and a multiplied-fraction roll-up (11.2000) would give 2.800"
            - "Material.${mat_p}.bom_depth == 0, Material.${mat_c}.bom_depth == 1, Material.${mat_g}.bom_depth == 2"
            - "ExposureAssessment.${asmt_1}.daily_exposure_ug == 0.187 (14.9500 x 0.25 x 0.5 x 0.10 x 1.0 = 0.186875, round_half_up 3dp)"
            - "ExposureAssessment.${asmt_1}.margin_ratio == 0.3740 and result == BELOW_SAFE_HARBOR"
            - "ExposureAssessment.${asmt_1}.contribution_count == 1 (one ACTIVE component contributes, not three materials)"

      - name: calc_warning_text_long_form_names_one_chemical_per_harm_class
        claim_type: correct_result
        grounds:
          - calculations.warning_content_selection
          - entities.WarningDetermination.fields.warning_text
          - entities.WarningDetermination.fields.named_chemicals
          - entities.WarningDetermination.fields.required_channels
        distinguishing_aspect: |
          With three qualifying assessments spanning two harm classes the label must name exactly
          two chemicals - one per class, CANCER first - and inside the CANCER group the
          NO_SAFE_HARBOR row (Cadmium, margin_ratio null) outranks the finite-margin row (Benzene,
          margin_ratio 1.5625) even though Benzene has a computable margin. The assembled long-form
          string is byte-exact, including the plural verb "are" and the trailing period after the
          website URL.
        test_recipe:
          setup:
            - "Three chemicals are LISTED: Cadmium (CANCER, safe_harbor_basis NONE, level null), Benzene (CANCER, NSRL 6.4), Bisphenol A (REPRODUCTIVE_FEMALE, MADL 0.5)."
            - "Material RM-100 (VERIFIED disclosure) declares Cadmium 100.0 ppm, Benzene 800.0 ppm and Bisphenol A 60.0 ppm."
            - "Product SKU-LBL is a CONSUMER_GOOD with occupancy_type NONE, label_area_sq_in 10.0 (>= SHORT_FORM_MAX_AREA_SQ_IN 5.0) and distribution_channels [RETAIL, CATALOG]; one ACTIVE component of RM-100 at 0.25 g/unit, contact_factor 0.5."
