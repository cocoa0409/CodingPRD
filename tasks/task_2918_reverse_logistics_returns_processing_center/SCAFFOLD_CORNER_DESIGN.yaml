  # =================================================================== #
  # SECTION 2 — state_machines                                          #
  # =================================================================== #
  - section: state_machines
    instances:
      - name: corner_rma_initial_state_is_draft_with_zero_totals
        claim_type: Initial State
        grounds:
          - state_machines.ReturnAuthorization.initial_state
          - endpoints[POST /return-authorizations]
        distinguishing_aspect: "A freshly created ReturnAuthorization starts in DRAFT with authorized_unit_total 0 and received_unit_total 0, and no receipt may be scanned against it yet."
        test_recipe:
          setup:
            - "Client SM1 and the logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM One", client_code: "SM1", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-SM1", customer_reference: "CUST-SM1", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "HTTP 201 with status == DRAFT, version == 1"
            - "authorized_unit_total == 0 and received_unit_total == 0"
            - "supersedes_rma_id is null and issued_at is null"
            - "Client.open_rma_count == 0 — a DRAFT authorization is not yet open"

      - name: corner_rma_issue_draft_to_issued_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.ReturnAuthorization.transitions[DRAFT -> ISSUED]
          - endpoints[POST /return-authorizations/{rma_id}/issue]
        distinguishing_aspect: "POST /return-authorizations/{rma_id}/issue on a DRAFT authorization with at least one line moves it to ISSUED, stamps issued_at from the logical clock, bumps version and increments Client.open_rma_count."
        test_recipe:
          setup:
            - "Client SM2 with one 2-unit authorized line."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM Two", client_code: "SM2", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-SM2", customer_reference: "CUST-SM2", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 2, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          assert:
            - "HTTP 200 with status == ISSUED and issued_at == 2026-08-01T00:00:00Z"
            - "authorized_unit_total == 2 and received_unit_total == 0"
            - "version == 2 — the issue write bumped it from 1"
            - "GET /clients/${c_id} shows open_rma_count == 1"

      - name: corner_rma_issue_twice_second_attempt_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.ReturnAuthorization.transitions[DRAFT -> ISSUED]
          - errors.ERR_RMA_INVALID_STATE
        distinguishing_aspect: "Issuing the same authorization twice is not idempotent: the second call finds status ISSUED, which has no issue transition, and returns 409 ERR_RMA_INVALID_STATE without bumping version again."
        test_recipe:
          setup:
            - "Client SM3 with a one-line RMA already issued once."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM Three", client_code: "SM3", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-SM3", customer_reference: "CUST-SM3", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_RMA_INVALID_STATE"
            - "GET /return-authorizations/${rma_id} still shows status == ISSUED with version == 2 — the rejected call wrote nothing"
            - "Client.open_rma_count == 1, not 2"

      - name: corner_rma_void_from_terminal_void_state_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.ReturnAuthorization.terminal_states
          - endpoints[POST /return-authorizations/{rma_id}/void]
          - errors.ERR_RMA_INVALID_STATE
        distinguishing_aspect: "VOID is a declared terminal state, so a second void on an already-voided authorization returns ERR_RMA_INVALID_STATE and appends no second RECEIPT_VARIANCE row."
        test_recipe:
          setup:
            - "Client SM4 with an ISSUED one-unit RMA that has already been voided once, appending exactly one -20000 RECEIPT_VARIANCE row."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM Four", client_code: "SM4", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-SM4", customer_reference: "CUST-SM4", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /return-authorizations/${rma_id}/void"
              payload: { void_reason: "First void" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /return-authorizations/${rma_id}/void"
              payload: { void_reason: "Second void" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_RMA_INVALID_STATE"
            - "GET /shrink-ledger-entries?client_id=${c_id} returns total_count == 1 with amount_cents == -20000 — no second write-off"
            - "Client.shrink_ledger_cents == -20000 and settlement_balance_cents == -20000"

      - name: corner_rma_issue_with_zero_lines_precondition_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ReturnAuthorization.transitions[DRAFT -> ISSUED].preconditions
          - validations[priority 40 ERR_RMA_NO_LINES]
          - errors.ERR_RMA_NO_LINES
        distinguishing_aspect: "The DRAFT -> ISSUED transition requires at least one declared line, so issuing an authorization with zero lines returns ERR_RMA_NO_LINES and leaves it in DRAFT."
        test_recipe:
          setup:
            - "Client SM5 with a DRAFT RMA and no lines at all."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM Five", client_code: "SM5", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-SM5", customer_reference: "CUST-SM5", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
          trigger:
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_RMA_NO_LINES"
            - "GET /return-authorizations/${rma_id} still shows status == DRAFT with version == 1 and issued_at null"
            - "Client.open_rma_count == 0"

      - name: corner_rma_reissue_from_draft_is_not_a_declared_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ReturnAuthorization.transitions[ISSUED -> SUPERSEDED]
          - endpoints[POST /return-authorizations/{rma_id}/reissue]
          - errors.ERR_RMA_INVALID_STATE
        distinguishing_aspect: "reissue is declared only from ISSUED, so a DRAFT authorization rejects it with ERR_RMA_INVALID_STATE (priority 20) even though the supplied expected_rma_version is perfectly current — the state check runs before the OCC check at priority 28."
        test_recipe:
          setup:
            - "Client SM6 with a DRAFT RMA carrying one line; its current version is captured so the OCC field is correct."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM Six", client_code: "SM6", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-SM6", customer_reference: "CUST-SM6", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id, rma_ver: $.data.version }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
          trigger:
            - call: "POST /return-authorizations/${rma_id}/reissue"
              payload: { expected_rma_version: "${rma_ver}", expires_at: "2026-10-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_RMA_INVALID_STATE — not 412 ERR_STALE_RMA_VERSION, because the version matched"
            - "GET /return-authorizations?supersedes_rma_id=${rma_id} returns total_count == 0 — no replacement authorization was minted"
            - "GET /return-authorizations/${rma_id} still shows status == DRAFT"

      - name: corner_grade_side_effects_stamp_disposition_recovery_refund_and_fraud_rows
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ReturnLine.transitions[RECEIVED_UNGRADED -> DISPOSITION_ASSIGNED]
          - calculations.disposition_decision
          - calculations.refund_amounts
          - calculations.return_line_fraud_score
        distinguishing_aspect: "A single grade call fires every declared side effect at once: condition_grade C is stored, disposition_decision resolves to LIQUIDATE via D6, provisional recovery 7200 is stamped, a RefundRelease of gross 20000 / fee 2000 / net 18000 is created, graded_by_user_id records u_grader, and the line now carries four FraudCheck rows."
        test_recipe:
          setup:
            - "Client SM7 on all defaults (restock_grade_floor B, liquidation_floor_pct 0.30, fraud_tolerance_cents 5000, SL_STANDARD), CatalogItem WIDGET-1 declared_value_cents 20000, non-serialized, refurb_eligible false, hazard NONE; one issued 1-unit DEFECTIVE line received at exactly the expected 1400 grams."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "SM Seven", client_code: "SM7", service_level: "SL_STANDARD", inventory_ownership: "CLIENT_OWNED" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { c_id: $.data.id }
            - call: "POST /catalog-items"
              payload: { client_id: "${c_id}", sku: "WIDGET-1", description: "Standard widget", declared_value_cents: 20000, unit_weight_grams: 1200, serialized: false, refurb_eligible: false, secondary_market_floor_cents: 1000 }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { item_id: $.data.id }
            - call: "POST /return-authorizations"
              payload: { client_id: "${c_id}", order_reference: "ORD-SM7", customer_reference: "CUST-SM7", order_placed_at: "2026-07-25T00:00:00Z", expires_at: "2026-09-01T00:00:00Z" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/lines"
              payload: { catalog_item_id: "${item_id}", authorized_quantity: 1, reason_code: "DEFECTIVE" }
              as: CenterAdmin
              as_user_id: "u_admin"
              captures: { rma_line_id: $.data.id }
            - call: "POST /return-authorizations/${rma_id}/issue"
              payload: {}
              as: CenterAdmin
              as_user_id: "u_admin"
            - call: "POST /receipts"
              payload: { rma_id: "${rma_id}", tracking_reference: "TRK-SM7", gross_weight_grams: 1400 }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rcpt_id: $.data.id }
            - call: "POST /receipts/${rcpt_id}/lines"
              payload: { rma_line_id: "${rma_line_id}", quantity: 1, reason_code: "DEFECTIVE" }
              as: ReceivingClerk
              as_user_id: "u_clerk"
              captures: { rl_id: $.data.id }
          trigger:
            - call: "POST /return-lines/${rl_id}/grade"
              payload: { condition_grade: "C" }
              as: GradingInspector
              as_user_id: "u_grader"
          assert:
            - "HTTP 200 with condition_grade == C, disposition_state == DISPOSITION_ASSIGNED and graded_by_user_id == u_grader"
            - "disposition == LIQUIDATE — D4 fails because GRADE_RANK[C] 3 is not <= GRADE_RANK[B] 2, D5 fails because refurb_eligible is false, and D6 holds because 7200 * 100 == 720000 >= 20000 * 1 * 30 == 600000"
            - "recovery_value_cents == 7200 == round_half_up(20000 * 0.40 * (1 - 0.10)) * 1"
            - "GET /refund-releases?return_line_id=${rl_id} returns total_count == 1 with gross_refund_cents == 20000, restocking_fee_pct == 0.10 (0.00 DEFECTIVE + 0.00 SL_STANDARD + 0.10 grade C + 0.00 late), restocking_fee_cents == 2000 and net_refund_cents == 18000"
            - "financial_state == HOLD_PENDING_DISPOSITION and fraud_score_release == 20 — only VALUE_ANOMALY failed (20000 - 7200 == 12800 > 5000) and 20 is below FRAUD_HOLD_THRESHOLD 50"
            - "GET /return-lines/${rl_id}/fraud-checks returns total_count == 4: EMPTY_BOX and SERIAL_MISMATCH at RECEIPT stage (both PASS), VALUE_ANOMALY FAIL and REPEAT_RETURNER PASS at GRADING stage"
            - "fraud_score_receipt is still 0 — the receipt-time variant never sees the GRADING-stage rows"

      - name: corner_grade_twice_second_call_rejected_invalid_disposition_state
        claim_type: Idempotency
