      - name: delivery_window_permits_overlapping_etas_until_aggregate_capacity
        grounds:
          - validations[priority=111]
          - calculations.delivery_window_committed_tons
          - errors[ERR_WINDOW_CAPACITY_EXCEEDED]
          - entities.WineryDeliveryWindow.fields.window_posture
          - concurrency_rules[harvest-load-create-stale-window]
        distinguishing_aspect: |
          The winery window is a pure aggregate resource, not an exclusive one: two loads sharing
          the identical delivery_eta 2026-09-15T09:00:00Z are both accepted, and only the tonnage
          sum matters — 8.00 + 8.00 against capacity 18.00 leaves remaining_tons 2.00 with
          window_posture NEARLY_FULL, a 4.00-ton load is refused, and a 2.00-ton load lands exactly
          at capacity with window_posture FULL. This is the opposite geometry from the crew's
          mutual-exclusion buffer.
