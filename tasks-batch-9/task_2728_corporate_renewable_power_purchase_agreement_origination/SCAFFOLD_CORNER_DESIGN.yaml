        grounds:
          - errors[ERR_PRICE_ADJUSTMENT_INVALID]
          - validations.priority_28_ERR_PRICE_ADJUSTMENT_INVALID
          - endpoints.POST_/ppa/risk-events/{id}/review
          - entities.RiskEvent.fields.price_adjustment_usd_per_mwh
        distinguishing_aspect: |
          price_adjustment_usd_per_mwh is an OPTIONAL input, so omitting it on a
          CHANGE_IN_LAW acceptance is not a schema error at priority 3 - it is a
          business refusal at priority 28, and the same omission on a CURTAILMENT
          acceptance would be perfectly legal. The second limb is a sign boundary rather
          than a range check: the deal is priced at 8.75 so that a -8.75 adjustment lands
          exactly on 0.00 and is refused, while -8.74 lands on 0.01 and is accepted -
          both well inside the field's own -10.00 to 10.00 range, so neither can be
