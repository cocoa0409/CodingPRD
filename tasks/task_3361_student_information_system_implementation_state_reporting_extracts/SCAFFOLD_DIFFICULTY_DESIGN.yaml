            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-08T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-09T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en1}/attendance-events"
              payload: { attendance_date: "2026-09-10T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en2}/attendance-events"
              payload: { attendance_date: "2026-09-01T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en2}/attendance-events"
              payload: { attendance_date: "2026-09-02T00:00:00Z", raw_code: "U" }
              as: Registrar
            - call: "POST /sis/enrollments/${en2}/attendance-events"
              payload: { attendance_date: "2026-09-03T00:00:00Z", raw_code: "U" }
              as: Registrar
