  # =============================================================================
  # RULE 6 - boundary_precision_check
  # =============================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: tolerance_breach_at_exact_error_rate_equality
        grounds:
          - calculations.error_rate_and_tolerance
          - entities.ExamScopeArea.fields.error_tolerance_pct
          - entities.ExamScopeArea.fields.tolerance_breached
        distinguishing_aspect: |
          The inclusive >= comparison is pinned at a hundredth of a percentage point: two areas of one
          examination produce the identical error_rate_pct 30.00 but carry tolerances 30.00 and 30.01,
          so equality must breach while 30.00 < 30.01 must not. This is the comparison-operator boundary
          (>= vs >), distinct from the completeness instance which pins a computed value's boundary.
        test_recipe:
          setup:
            - "AURORA carrier; ON_SITE examination 2026-09-01 .. 2026-11-30, scope locked."
            - "CLAIMS area: population 4000, sample 10, error_tolerance_pct explicitly 30.00."
