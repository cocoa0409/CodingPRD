      - name: privilege_evidence_pool_with_only_future_dated_rows_falls_back_to_declared_state
        claim_type: input_set_filtering
        grounds:
          - calculations.multistate_privilege_determination.formula
          - entities.Nurse.fields.residency_evidence
          - endpoints.POST /licenses/{id}/privilege-determination
        distinguishing_aspect: "The RESIDENCY_EVIDENCED variant filters on effective_date <= the logical clock. With a single DRIVER_LICENSE entry for MI effective 2030-01-01, the candidate pool is empty at the 2026-08-01 clock, so the empty-pool fallback uses declared_primary_state OH and the privilege stays MULTISTATE — an implementation that ignored the date filter would have picked MI and downgraded to SINGLE_STATE."
        test_recipe:
          setup:
            - "Compact board OH holds an ACTIVE RN license for a nurse who declares OH but carries one future-dated Michigan driver-licence residency entry."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH", residency_evidence: [{ evidence_type: "DRIVER_LICENSE", state_code: "MI", effective_date: "2030-01-01T00:00:00Z" }] }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id, issued_priv: $.data.multistate_privilege_status }
          trigger:
            - call: "POST /licenses/${lic_id}/privilege-determination"
              payload: { variant: "RESIDENCY_EVIDENCED" }
              as: LicensureAnalyst
              captures: { priv: $.data.multistate_privilege_status, basis: $.data.privilege_basis_state, variant: $.data.privilege_variant }
          assert:
            - "${issued_priv} == MULTISTATE with privilege_variant RESIDENCY_DECLARED"
            - "${priv} == MULTISTATE and ${basis} == OH — the empty pool fell back to declared_primary_state"
            - "${variant} == RESIDENCY_EVIDENCED — the variant actually used is recorded even though it fell back"
            - "Nurse.${nurse_id}.residency_evidence is unchanged and still holds the single MI entry"
            - "GET /licenses/${lic_id}/privilege-summary reports evidenced_primary_state OH, declared_primary_state OH, board_state_code OH and board_compact_member true"

      - name: ce_variant_divergence_stub
        claim_type: variant_divergence
        grounds:
          - calculations.ce_hour_credit_total.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / ce_provisional_and_audited_variants_diverge_by_eighteen_hours
          rationale: "The delta between provisional_self_reported and audited_verified on identical CeRecord data, and the CE_DEFICIENT outcome that the lower audited figure produces, are the whole subject of that difficulty instance."

      - name: privilege_variant_selection_stub
        claim_type: variant_selection
        grounds:
          - calculations.multistate_privilege_determination.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / privilege_variant_flips_multistate_to_single_state
          rationale: "Choosing RESIDENCY_DECLARED at issuance versus RESIDENCY_EVIDENCED on demand, and the MULTISTATE -> SINGLE_STATE flip that the switch causes, are asserted end to end by that difficulty instance."

      - name: ce_rounding_order_boundary_stub
        claim_type: correct_result
        grounds:
          - calculations.ce_hour_credit_total.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / ce_quarter_hour_rounding_order_decides_thirty_hour_boundary
          rationale: "The interaction of per-record quantisation, the per-category caps and the carry-over cap at the exact 30-hour requirement is the combinatorial corner that difficulty instance is built around; this section only needs the isolated per-record precision claim, which the quarter-hour instance above covers."

      - name: panel_tally_ladder_walk_stub
        claim_type: correct_result
        grounds:
          - calculations.panel_vote_tally.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / panel_tally_walks_tier_ladder_from_revocation_downward
          rationale: "The full top-down ladder walk with cumulative escalating support, the 6667 bp revocation threshold versus the 5001 bp majority threshold, and last-vote-per-member replacement are all exercised there; the NONE-tally corner in the state_machines section covers only the no-tier-clears branch."

      - name: audit_sampling_empty_pool_stub
        claim_type: input_set_filtering
        grounds:
          - calculations.audit_sample_selection.formula
        excluded_because:
          difficulty_instance: boundary_precision_check / audit_sampling_empty_eligible_pool_yields_zero_quota_not_error
          rationale: "The zero-eligible boundary and its HTTP 200 success envelope are asserted by that difficulty instance; the quota-ceiling corner above deliberately uses a non-empty pool of exactly one row instead."

      - name: encumbrance_reconciliation_stub
        claim_type: reconciliation
        grounds:
          - calculations.license_encumbrance_reconciliation
        excluded_because:
          difficulty_instance: compensating_invariant / complaint_dismissals_restore_open_encumbrance_count_to_zero
          rationale: "Full recomputation of open_encumbrance_count across two overlapping complaints, and the return to CLEAR only once the count reaches zero, is precisely the reconciliation loop that instance drives."

      - name: fee_ledger_reconciliation_stub
        claim_type: reconciliation
        grounds:
          - calculations.renewal_fee_assessment.formula
        excluded_because:
          difficulty_instance: compensating_invariant / renewal_denial_moves_fee_to_credit_conserving_the_ledger
          rationale: "The conserved fee identity across a denial-driven compensation is asserted there; the tier-ladder corner above only pins the constants and never disturbs the ledger."

  # ===========================================================================
  - section: validations
    instances:

      - name: reusing_a_state_code_returns_state_code_exists
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_STATE_CODE_EXISTS
          - entities.StateBoardConfig.fields.state_code
        distinguishing_aspect: "state_code is globally unique, so the second board for OH is a 409 even though its board_name differs, and the uniqueness check sits at priority 8 ahead of every state or business rule."
        test_recipe:
          setup:
            - "A board for state_code OH already exists."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          trigger:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing (Duplicate)", compact_member: false }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_STATE_CODE_EXISTS"
            - "GET /state-board-configs/${board_id} still reports board_name Ohio Board of Nursing and compact_member true"

      - name: reusing_a_program_code_under_the_same_board_returns_program_code_exists
        claim_type: violation_to_error
        grounds:
          - validations[priority=8]
          - errors.ERR_PROGRAM_CODE_EXISTS
          - entities.EducationProgram.fields.program_code
        distinguishing_aspect: "program_code is unique per board, not globally: the duplicate under board OH is refused while the identical code under board MI is accepted, which distinguishes a scoped index from a global one."
        test_recipe:
          setup:
            - "Boards OH and MI both exist, and board OH already has program OH-BSN-01."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_oh: $.data.id }
            - call: "POST /state-board-configs"
              payload: { state_code: "MI", board_name: "Michigan Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_mi: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_oh}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_oh}", program_code: "OH-BSN-01", program_name: "Buckeye BSN Evening", degree_level: "BSN", nclex_first_time_pass_rate_bp: 9100, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err} == ERR_PROGRAM_CODE_EXISTS"
            - "the same POST against board ${board_mi} succeeds with HTTP 201 — the code is board-scoped"
            - "GET /state-board-configs/${board_oh}/education-programs returns total_count == 1 containing ${prog_id}"

      - name: negative_limit_on_the_license_list_returns_invalid_pagination
        claim_type: violation_to_error
        grounds:
          - validations[priority=7]
          - errors.ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Pagination bounds are validated as a distinct 400 code at priority 7: limit below the minimum of 1, limit above the maximum of 100 and a negative offset are all ERR_INVALID_PAGINATION rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Board OH exists; no license rows are required because pagination is checked before any query runs."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          trigger:
            - call: "GET /licenses"
              payload: { limit: -5, offset: 0 }
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err} == ERR_INVALID_PAGINATION"
            - "GET /licenses with limit 101 also returns 400 ERR_INVALID_PAGINATION"
            - "GET /licenses with offset -1 also returns 400 ERR_INVALID_PAGINATION"
            - "GET /licenses with no pagination parameters succeeds with limit 10 and offset 0 applied"

      - name: applicant_reading_another_nurses_license_returns_not_resource_owner
        claim_type: violation_to_error
        grounds:
          - validations[priority=5]
          - errors.ERR_NOT_RESOURCE_OWNER
          - roles.Applicant
        distinguishing_aspect: "The Applicant role passes the role gate at priority 2 and the row exists, so the refusal must be the ownership check at priority 5 — not ERR_FORBIDDEN_ROLE and not a 404 that would leak existence."
        test_recipe:
          setup:
            - "Two nurses exist under board OH; nurse A holds an issued RN license and nurse B holds nothing."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_a: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Kai Moreno", birth_year: 1990, ssn_last4: "7712", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_b: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_a}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_a: $.data.id }
            - call: "POST /license-applications/${app_a}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_a}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_a}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_a}" }
              as: LicensureAnalyst
              captures: { lic_a: $.data.id }
          trigger:
            - call: "GET /licenses/${lic_a}"
              payload: {}
              as: Applicant
              as_user_id: "${nurse_b}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 403 and ${err} == ERR_NOT_RESOURCE_OWNER"
            - "${err} != ERR_FORBIDDEN_ROLE and ${err} != ERR_LICENSE_NOT_FOUND"
            - "the same GET as Applicant with X-User-ID ${nurse_a} succeeds with HTTP 200 and data.id == ${lic_a}"

      - name: examination_verification_with_a_failed_nclex_returns_nclex_not_passed
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - errors.ERR_NCLEX_NOT_PASSED
          - state_machines.LicenseApplication.transitions.SUBMITTED_to_QUALIFICATION_VERIFIED
        distinguishing_aspect: "The examination branch checks programme standing and examination result together; with an APPROVED, unexpired programme the only failing conjunct is nclex_result FAIL, so the answer is ERR_NCLEX_NOT_PASSED at priority 22 rather than ERR_PROGRAM_NOT_APPROVED at 21."
        test_recipe:
          setup:
            - "Board OH has an APPROVED BSN programme expiring 2032-01-01, and a SUBMITTED EXAMINATION RN application records nclex_result FAIL."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "FAIL" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
              captures: { submitted_status: $.data.status }
          trigger:
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "${submitted_status} == SUBMITTED — a failed examination does not block submission"
            - "HTTP status is 422 and ${err} == ERR_NCLEX_NOT_PASSED"
            - "${err} != ERR_PROGRAM_NOT_APPROVED"
            - "GET /license-applications/${app_id} still reports status SUBMITTED and screening_status NOT_ORDERED"

      - name: endorsement_verification_without_prior_license_proof_returns_prior_license_unverified
        claim_type: violation_to_error
        grounds:
          - validations[priority=23]
          - errors.ERR_PRIOR_LICENSE_UNVERIFIED
          - entities.LicenseApplication.fields.prior_license_verified
        distinguishing_aspect: "On the ENDORSEMENT pathway no education programme is required at all, so the gate is the prior-licence attestation: with prior_license_verified still at its false default the verification is refused, and supplying prior_license_verified true on the retry passes it."
        test_recipe:
          setup:
            - "Board OH exists and a SUBMITTED ENDORSEMENT RN application names prior_license_state MI without any education_program_id."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
