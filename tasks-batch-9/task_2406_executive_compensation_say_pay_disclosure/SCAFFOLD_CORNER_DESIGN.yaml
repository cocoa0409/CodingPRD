      - name: rounding_the_revenue_ratio_decides_band_membership
        claim_type: precision
        grounds:
          - calculations.peer_size_band_fit
          - entities.PeerGroupMember.fields.revenue_ratio
        excluded_because:
          difficulty_instance: boundary_precision_check / revenue_ratio_rounds_to_band_edge_accepted_then_next_tick_rejected
          rationale: "That instance pins a peer whose ratio rounds to exactly the band edge at 4dp against one a single tick outside it."

      - name: the_two_benchmark_variants_diverge_on_one_peer_set
        claim_type: variant_divergence
        grounds:
          - calculations.benchmark_target_tdc.variants
          - entities.PeerGroup.fields.benchmark_basis
        excluded_because:
          difficulty_instance: dual_variant_calc / raw_median_vs_size_adjusted_benchmark_diverge_on_one_peer_set
          rationale: "That instance screens the same member list under both bases and asserts the full raw/adjusted delta plus which leg benchmark_target_tdc_usd selects."

      - name: the_valuation_variant_follows_the_award_lifecycle_stage
        claim_type: variant_selection
        grounds:
          - calculations.realized_and_realizable_pay.variants
          - entities.PayoutAward.fields.realizable_value_usd
        excluded_because:
          difficulty_instance: dual_variant_calc / realized_versus_realizable_pay_diverge_on_identical_awards
          rationale: "That instance asserts REALIZED counts only settled value while REALIZABLE marks outstanding grants, and that the two legs converge once the award leaves GRANTED."

      - name: adjacent_lookback_windows_are_still_a_collision
        claim_type: interval_merge
        grounds:
          - calculations.restatement_lookback_conflict
          - errors[ERR_LOOKBACK_PERIOD_COLLISION]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / restatement_lookback_windows_reject_adjacency_because_of_the_one_day_buffer
          rationale: "That instance contrasts a gap-of-zero lookback window (rejected by the buffer) against one placed just beyond it (accepted)."

      - name: a_mix_change_propagates_through_every_dependent_field
        claim_type: constraint_propagation
        grounds:
          - calculations.pay_mix_reallocation
          - calculations.target_total_direct_comp
        excluded_because:
          difficulty_instance: compensating_invariant / mix_reallocation_round_trip_conserves_hundred_points_and_restores_every_derived_field
          rationale: "That instance moves points out and back again and asserts the mix total and every derived target figure return to their exact starting values."
  # =========================================================================
  - section: validations
    instances:

      - name: screening_a_group_whose_only_member_was_excluded_returns_peer_group_empty
        claim_type: violation_to_error
        grounds:
          - validations.priority_43_ERR_PEER_GROUP_EMPTY
          - errors[ERR_PEER_GROUP_EMPTY]
          - entities.PeerGroup.fields.accepted_member_count
        distinguishing_aspect: |
          The emptiness test counts ACCEPTED members, not rows: a brand-new group with zero members and a group
          whose single member has been EXCLUDED both fail screening with ERR_PEER_GROUP_EMPTY (422), and in the second
          case the membership row still exists so a row-count check would have let it through.
        test_recipe:
          setup:
            - "ACME issuer and BRVO peer registered."
            - "A DRAFT RAW_MEDIAN peer group with no members yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
