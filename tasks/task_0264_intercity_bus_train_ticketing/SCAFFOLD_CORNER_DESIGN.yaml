# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Intercity Bus & Train Ticketing — Expert
# Breadth probe: every testable claim of §1.1-§1.7 not already covered by §1.8.
# Canonical clock for time-dependent setups: 2026-06-01T00:00:00Z unless noted.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: create_operator_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Operator.fields.default_connection_buffer_min, entities.Operator.fields.exchange_fee_cents]
        distinguishing_aspect: "POST /v1/operators with only name+mode -> 201; default_connection_buffer_min defaults to 30, exchange_fee_cents to 1000, version to 1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "RAIL" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
          assert:
            - "response code 201; Operator.${op_id}.default_connection_buffer_min == 30; exchange_fee_cents == 1000; version == 1"

      - name: create_operator_missing_mode_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Operator.fields.mode, "validations[priority=5]"]
        distinguishing_aspect: "POST /v1/operators without required enum field mode -> ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /v1/operators"
              payload: { name: "NoMode" }
              as: ScheduleManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST; http status == 422"

      - name: get_operator_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Operator, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /v1/operators/{id} with a non-existent UUID -> ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /v1/operators/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ScheduleManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND; http status == 404"

      - name: passenger_duplicate_email_rejected
        claim_type: Type Constraints
        grounds: [entities.Passenger.fields.email, "errors[ERR_DUPLICATE_EMAIL]"]
        distinguishing_aspect: "Registering a second passenger with an email already in use -> ERR_DUPLICATE_EMAIL (409)."
        test_recipe:
          setup: ["One passenger registered with email dup@x.com."]
          setup_api_calls:
            - call: "POST /v1/passengers"
              payload: { full_name: "First", email: "dup@x.com" }
              as: Passenger
          trigger:
            - call: "POST /v1/passengers"
              payload: { full_name: "Second", email: "dup@x.com" }
              as: Passenger
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_EMAIL; http status == 409"

      - name: service_date_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.ServiceDate.fields.seats_held, entities.ServiceDate.fields.seats_available, entities.ServiceDate.fields.lifecycle]
        distinguishing_aspect: "On schedule, computed/system fields are server-set: seats_held=0, seats_sold=0, seats_available=seats_total, lifecycle=SCHEDULED, sales=OPEN, version=1 regardless of any client-supplied values."
        test_recipe:
          setup: ["Operator + PUBLISHED route."]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
          trigger:
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 40, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
          assert:
            - "ServiceDate.${sd_id}.seats_held == 0; seats_sold == 0; seats_available == 40; lifecycle == SCHEDULED; sales == OPEN; version == 1"

      - name: refund_credit_note_is_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.RefundCreditNote]
        distinguishing_aspect: "RefundCreditNote has common_fields:false — it carries only id + created_at, no version field and no mutation endpoint; it is only discoverable via the settlement-notes GETs."
        test_recipe:
          setup: ["A PAID booking cancelled for CASH, producing one settlement note (reuse the §1.8 cash-refund flow)."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN", refundable: true }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/bookings/${b_id}/pay"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
            - call: "POST /v1/bookings/${b_id}/cancel"
              payload: { refund_destination: "CASH" }
              as: Passenger
              as_user_id: "${p_id}"
          trigger:
            - call: "GET /v1/settlement-notes?booking_id=${b_id}"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
              captures: { note_id: "$.data[0].id" }
          assert:
            - "exactly one RefundCreditNote exists for the booking; it exposes id, created_at, settlement_kind, gross_cents, penalty_cents, net_cents and NO version field"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: confirm_already_confirmed_booking_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Booking.booking_status.HELD_to_CONFIRMED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_confirm
          rationale: "Re-confirming a CONFIRMED booking -> ERR_INVALID_STATE is asserted there as the higher-priority winner."

      - name: scan_already_scanned_ticket_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Ticket.state.ISSUED_to_SCANNED]
        distinguishing_aspect: "Scanning a Ticket already in SCANNED -> ERR_INVALID_STATE (409); no second transition."
        test_recipe:
          setup: ["A PAID booking with an ISSUED ticket that has been scanned once."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
            - call: "GET /v1/tickets?booking_id=${b_id}"
              payload: {}
              as: GateAgent
              captures: { tk_id: "$.data[0].id" }
            - call: "POST /v1/tickets/${tk_id}/scan"
              payload: {}
              as: GateAgent
          trigger:
            - call: "POST /v1/tickets/${tk_id}/scan"
              payload: {}
              as: GateAgent
              captures: { err: $.data.error_id }
          assert:
            - "second scan returns error_id == ERR_INVALID_STATE; http 409; Ticket.${tk_id}.state remains SCANNED"

      - name: depart_then_cancel_rejected_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ServiceDate.lifecycle.SCHEDULED_to_DEPARTED]
        distinguishing_aspect: "DEPARTED is terminal; POST /service-dates/{id}/cancel on a DEPARTED service date -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Operator + PUBLISHED route + one ServiceDate marked DEPARTED."]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "RAIL" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/service-dates/${sd_id}/depart"
              payload: {}
              as: ScheduleManager
          trigger:
            - call: "POST /v1/service-dates/${sd_id}/cancel"
              payload: {}
              as: ScheduleManager
              captures: { err: $.data.error_id }
          assert:
            - "cancel returns error_id == ERR_INVALID_STATE; http 409; ServiceDate.${sd_id}.lifecycle remains DEPARTED"

      - name: restore_non_delayed_service_date_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.ServiceDate.lifecycle.DELAYED_to_SCHEDULED]
        distinguishing_aspect: "POST /service-dates/{id}/restore on a SCHEDULED (not DELAYED) service date -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Operator + PUBLISHED route + one SCHEDULED ServiceDate."]
          setup_api_calls:
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "RAIL" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
          trigger:
            - call: "POST /v1/service-dates/${sd_id}/restore"
              payload: {}
              as: ScheduleManager
              captures: { err: $.data.error_id }
          assert:
            - "restore returns error_id == ERR_INVALID_STATE; http 409; lifecycle remains SCHEDULED"

      - name: pay_pass_funded_booking_rejected
        claim_type: Invalid Transitions
        grounds: [state_machines.Booking.payment_status.UNPAID_to_PAID, entities.Booking.fields.funding_kind]
        distinguishing_aspect: "POST /bookings/{id}/pay on a PASS-funded booking -> ERR_INVALID_STATE (409); pay is only valid for CASH bookings."
        test_recipe:
          setup: ["Operator + PUBLISHED route + ServiceDate; passenger with a confirmed PASS-funded booking."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/passes"
              payload: { passenger_id: "${p_id}", operator_id: "${op_id}", rides_total: 10, expires_on: "2026-12-31" }
              as: SupportAgent
              captures: { pass_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "PASS", pass_id: "${pass_id}", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/bookings/${b_id}/pay"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "pay returns error_id == ERR_INVALID_STATE; http 409; Booking.${b_id}.payment_status remains UNPAID"

      - name: pass_exhausts_then_restores_revert
        claim_type: cyclic
        grounds: [state_machines.TravelPass.status.ACTIVE_to_EXHAUSTED, state_machines.TravelPass.status.EXHAUSTED_to_ACTIVE]
        distinguishing_aspect: "A rides_total=1 pass goes ACTIVE->EXHAUSTED on confirm (rides_remaining 0), then EXHAUSTED->ACTIVE when that booking is cancelled (rides restored)."
        test_recipe:
          setup: ["Operator + PUBLISHED route + ServiceDate; passenger with a rides_total=1 pass; one confirmed PASS booking that exhausted the pass."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/passes"
              payload: { passenger_id: "${p_id}", operator_id: "${op_id}", rides_total: 1, expires_on: "2026-12-31" }
              as: SupportAgent
              captures: { pass_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "PASS", pass_id: "${pass_id}", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/bookings/${b_id}/cancel"
              payload: {}
              as: Passenger
              as_user_id: "${p_id}"
          assert:
            - "before cancel TravelPass.${pass_id}.status == EXHAUSTED (rides_remaining 0)"
            - "after cancel TravelPass.${pass_id}.status == ACTIVE and rides_remaining == 1 (revert)"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: advance_window_boundary_at_14_days
        claim_type: Constants Applied
        grounds: [calculations.leg_fare_cents]
        distinguishing_aspect: "Advance-window boundary on a DIFFERENT axis from the load-factor boundary in §1.8: departure exactly 14 days out selects advance_factor 0.90 -> fare 3600 (lf 0), vs 13 days out selecting 1.00 -> fare 4000."
        test_recipe:
          setup: ["Clock 2026-06-01; Operator + PUBLISHED route + ServiceDate seats_total=10 base 4000 departure 2026-06-15 (14 days out); ECONOMY OPEN class; passenger with a HELD booking."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
              payload: { operator_id: "${op_id}", origin_code: "NYP", destination_code: "BOS", depart_minute_of_day: 540, arrive_minute_of_day: 780 }
              as: ScheduleManager
              captures: { rt_id: $.data.id }
            - call: "POST /v1/routes/${rt_id}/publish"
              payload: {}
              as: ScheduleManager
            - call: "POST /v1/service-dates"
              payload: { route_id: "${rt_id}", departure_date: "2026-06-15", seats_total: 10, base_fare_cents: 4000 }
              as: ScheduleManager
              captures: { sd_id: $.data.id }
            - call: "POST /v1/passengers"
              payload: { full_name: "Pat", email: "pat@x.com" }
              as: Passenger
              captures: { p_id: $.data.id }
            - call: "POST /v1/bookings"
              payload: { passenger_id: "${p_id}", funding_kind: "CASH", legs: [ { service_date_id: "${sd_id}", fare_class_id: "${fc_id}", leg_order: 1 } ] }
              as: Passenger
              as_user_id: "${p_id}"
              captures: { b_id: $.data.id }
            - call: "GET /v1/service-dates/${sd_id}"
              payload: {}
              as: Passenger
              captures: { sd_v: $.data.version }
          trigger:
            - call: "POST /v1/bookings/${b_id}/confirm"
              payload: { expected_service_date_version: "${sd_v}" }
              as: Passenger
              as_user_id: "${p_id}"
          assert:
            - "the booking's BookingLeg.fare_cents == 3600 (4000 * 1.00 demand * 0.90 advance at exactly 14 days)"

      - name: high_demand_business_surcharge_stacking
        claim_type: Correct Result
        grounds: [calculations.leg_fare_cents, entities.FareClass.fields.surcharge_cents]
        distinguishing_aspect: "BUSINESS surcharge stacks AFTER multipliers: lf 0.8 (1.60) at 14 days (0.90) base 6000 -> round(8640)=8640, plus 1500 surcharge = 10140 fare_cents."
        test_recipe:
          setup: ["Clock 2026-06-01; ServiceDate seats_total=5 base 6000 departure 2026-06-15; BUSINESS RESERVED class surcharge 1500; 4 seats pre-confirmed -> load_factor 0.8."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "RAIL" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "BUSINESS", seating_mode: "RESERVED", surcharge_cents: 1500 }
              as: FareAnalyst
              captures: { fc_id: $.data.id }
            - call: "POST /v1/routes"
