            - "ReturnLabel.${lbl3}.tracking_number == \"UPSGM-00000003\" (global counter, carrier-specific prefix)"
            - "ReturnLabel.${lbl1}.valid_from == \"2026-08-01T00:00:00Z\" and ReturnLabel.${lbl1}.valid_until == \"2026-09-15T00:00:00Z\""
            - "ReturnLabel.${lbl2}.valid_from == \"2026-08-01T00:00:00Z\" and ReturnLabel.${lbl2}.valid_until == \"2026-09-15T00:00:00Z\""
            - "ReturnLabel.${lbl3}.valid_from == \"2026-08-01T00:00:00Z\" and ReturnLabel.${lbl3}.valid_until == \"2026-09-15T00:00:00Z\""
            - "ReturnLabel.${lbl1}.status == \"PRINTED\", ReturnLabel.${lbl2}.status == \"PRINTED\", ReturnLabel.${lbl3}.status == \"PRINTED\" (identical windows on DIFFERENT kits are not a conflict)"
            - "Kit.${kit1}.status == \"SEALED\", Kit.${kit2}.status == \"SEALED\" and Kit.${kit3}.status == \"SEALED\" (no supersede-void fired)"
            - "Kit.${kit2}.supersedes_kit_id == null and Kit.${kit3}.supersedes_kit_id == null"
            - "Enrollment.${enr}.kits_issued == 3 and Enrollment.${enr}.version == ${enr_v3} + 1"
            - "SponsorshipProgram.${prog}.reserved_cents == 4395 and kits_issued_count == 3"
            - "GET /sharps/return-labels?kit_id=${kit1} returns total_count == 1"

      # ---- corners the §1.8 difficulty design already owns -----------------
      - name: container_size_threshold_at_exact_capacity
        claim_type: threshold
        grounds:
          - calculations.container_size_selection
          - calculations.container_size_selection.constants.SIZE_CATALOG
        distinguishing_aspect: "required_units landing exactly on a catalog capacity keeps the smaller container because the capacity filter is inclusive, and the single trailing ceil() must not inflate the demand by one unit."
        excluded_because:
          difficulty_instance: container_sizing_at_exact_capacity_boundary_with_single_ceiling
          rationale: "That §1.8 boundary-precision instance probes capacity - 1 / capacity / capacity + 1 and pins the forbidden two-step rounding order."

      - name: provisional_and_final_variants_diverge_for_the_same_kit
        claim_type: variant_divergence
        grounds:
          - calculations.kit_cost_provisional
          - calculations.kit_cost_final_settlement
        distinguishing_aspect: "The same kit yields two different cent amounts because the provisional variant weighs capacity while the final variant weighs the measured parcel and adds destruction and remediation components."
        excluded_because:
          difficulty_instance: kit_cost_provisional_vs_final_divergence_on_manufacturer_program
          rationale: "The §1.8 dual-variant instance asserts both amounts and the exact reconciling delta on the ledger."

      - name: rebate_tier_selected_on_the_pre_rebate_cumulative_basis
        claim_type: tiered_pricing
        grounds:
          - calculations.kit_cost_final_settlement.constants.REBATE_TIERS
          - entities.DestructionCertificate.fields.rebate_pct_applied
        distinguishing_aspect: "At a tier boundary the tier chosen from the pre-rebate cumulative basis differs from the tier a post-rebate basis would select, and only the pre-rebate keying is correct."
        excluded_because:
          difficulty_instance: rebate_tier_keyed_on_pre_rebate_cumulative_total
          rationale: "The §1.8 combinatorial-formula instance drives two certificates so the second lands exactly on a tier edge and asserts the tier that the pre-rebate basis selects."

      - name: risk_score_rounds_once_over_the_summed_decayed_terms
        claim_type: precision
        grounds:
          - calculations.patient_risk_score
          - calculations.patient_risk_score.precision
        distinguishing_aspect: "Two half-decayed odd weights differ by a full point between round-each-term and round-the-sum, and only the single trailing round_half_up is correct."
        excluded_because:
          difficulty_instance: risk_score_sum_then_single_round_not_per_term_round
          rationale: "That §1.8 combinatorial-formula instance is built precisely on the two-events-at-0.5 case that separates the two rounding orders."

      - name: risk_threshold_boundary_at_exactly_sixty
        claim_type: threshold
        grounds:
          - calculations.patient_risk_score.constants.RISK_SUSPEND_THRESHOLD
          - state_machines.Patient.ENROLLED_to_SUSPENDED
        distinguishing_aspect: "A score of exactly 60 suspends (the comparison is >=), while 59 leaves the patient ENROLLED."
        excluded_because:
          difficulty_instance: risk_score_exactly_at_suspend_threshold_suspends_patient
          rationale: "The §1.8 boundary-precision instance walks 59 / 60 and asserts the cascade fires only on the second."

      - name: facility_intake_capacity_aggregates_over_the_same_intake_date
        claim_type: aggregation
        grounds:
          - calculations.facility_intake_occupancy
          - entities.TreatmentFacility.fields.daily_intake_capacity_units
        distinguishing_aspect: "Individually admissible parcels breach the daily cap only in aggregate, and only parcels sharing the exact scheduled_intake_date are summed."
        excluded_because:
          difficulty_instance: facility_daily_intake_capacity_exceeded_by_aggregate_units_on_same_intake_date
          rationale: "The §1.8 resource-temporal-overlap instance asserts the exact-capacity acceptance and the one-unit-over rejection on the same date, plus the neighbouring date going through."

      - name: label_window_adjacency_counts_as_a_conflict
        claim_type: interval_merge
        grounds:
          - calculations.label_validity_window
          - errors[ERR_LABEL_WINDOW_CONFLICT]
        distinguishing_aspect: "A new window whose valid_from equals a live label's valid_until conflicts, and a voided label keeps blocking for its quarantine hours."
        excluded_because:
          difficulty_instance: second_return_label_rejected_when_window_touches_live_label_and_during_void_quarantine
          rationale: "The §1.8 resource-temporal-overlap instance covers both the touching-window rejection and the quarantine boundary in one chain."

      - name: screening_and_audit_variants_are_selected_by_context
        claim_type: variant_selection
        grounds:
          - calculations.patient_risk_score.variants
          - endpoints.POST /sharps/shipments/{id}/conformance-screening
          - endpoints.POST /sharps/auto-ship-runs
        distinguishing_aspect: "A screening writes only the decayed SCREENING score and may suspend; an auto-ship run writes both scores and may never suspend."
        excluded_because:
          difficulty_instance: patient_risk_screening_variant_vs_audit_variant_divergence
          rationale: "The §1.8 dual-variant instance asserts the two stored integers diverge for one event set and that only AUDIT carries the late-kit penalty."

  # ===========================================================================
  # §1.4 VALIDATIONS
  # ===========================================================================
  - section: validations
    instances:
      - name: manifest_and_absorbent_gates_fire_only_for_the_rule_and_spec_that_demand_them
        claim_type: conditional_validation
        grounds:
          - validations[priority 20].business_constraint
          - validations[priority 21].business_constraint
          - errors[ERR_ABSORBENT_MATERIAL_REQUIRED]
          - errors[ERR_STATE_MANIFEST_REQUIRED]
          - entities.StateSharpsRule.fields.requires_state_manifest
          - entities.PackagingSpec.fields.requires_absorbent
        distinguishing_aspect: "Both gates are config-conditional: the WA patient on an absorbent-requiring spec is rejected first for the absorbent (priority 20 beats 21) and then for the manifest, while the CA patient on a plain spec activates successfully with BOTH optional fields omitted — the same payload shape passes or fails purely on the rule/spec flags."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. WA rule with requires_state_manifest true; CA rule leaving it at the false default. Both permit mail-back."
            - "Spec MB-ABS with requires_absorbent true and spec MB-PLAIN leaving it false; both UN3291_SHARPS_ONLY, max 8000 g, allowing ONE_QUART."
            - "Facility \"CA-TF-0001\" (capacity 200) accepts UN3291_SHARPS_ONLY."
            - "MANUFACTURER sponsor, program 500000 / 5000. Wanda is on the WA rule and Cora on the CA rule, both INSULIN_PEN_NEEDLES 20/week, both ENROLLED with ACTIVE enrollments (cadence 30, 2 kits)."
            - "Each has a kit issued, acknowledged, sealed at 60 units / 1200 g; Wanda's kit carries a PRINTED label on MB-ABS and Cora's a PRINTED label on MB-PLAIN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "WA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3, requires_state_manifest: true }
              as: ProgramAdmin
              captures: { sr_wa: $.data.id }
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/packaging-specs"
              payload: { spec_code: "MB-ABS", un_specification_code: "UN 4G/X7.5/S/26", postal_service: "USPS_PARCEL_SELECT_MAILBACK", hazard_class: "UN3291_SHARPS_ONLY", max_gross_weight_grams: 8000, allowed_container_sizes: [ONE_QUART, TWO_GALLON], requires_absorbent: true }
              as: ProgramAdmin
              captures: { spec_abs: $.data.id }
            - call: "POST /sharps/packaging-specs"
              payload: { spec_code: "MB-PLAIN", un_specification_code: "UN 4G/X7.5/S/26", postal_service: "USPS_PARCEL_SELECT_MAILBACK", hazard_class: "UN3291_SHARPS_ONLY", max_gross_weight_grams: 8000, allowed_container_sizes: [ONE_QUART, TWO_GALLON] }
              as: ProgramAdmin
              captures: { spec_plain: $.data.id }
            - call: "POST /sharps/treatment-facilities"
              payload: { name: "Bay Area Sharps Treatment", state_rule_id: "${sr_ca}", permit_number: "CA-TF-0001", accepted_hazard_classes: [UN3291_SHARPS_ONLY], daily_intake_capacity_units: 200 }
              as: ProgramAdmin
              captures: { fac: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Wanda Lee", state_rule_id: "${sr_wa}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "wanda@example.com" }
              as: ProgramAdmin
              captures: { pat_w: $.data.id }
            - call: "POST /sharps/patients/${pat_w}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
