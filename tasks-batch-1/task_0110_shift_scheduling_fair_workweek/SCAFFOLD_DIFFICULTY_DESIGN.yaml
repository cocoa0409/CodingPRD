  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: shift_cancel_cascade_depth3_predictability
        grounds:
          - state_machines.Shift.OPEN_to_CANCELLED
          - state_machines.Assignment.SCHEDULED_to_CANCELLED
          - entities.PredictabilityLedgerEntry.fields.amount_cents
          - entities.PayPeriod.fields.projected_labor_cost_cents
          - calculations.predictability_short_notice_pay
        distinguishing_aspect: |
          Depth-3 chain from the Shift OPEN->CANCELLED trigger: (1) shift cancel
          cancels the Assignment; (2) the Assignment cancellation, being inside the
          advance-notice window, appends a SHORT_NOTICE_CANCEL PredictabilityLedgerEntry;
          (3) that ledger append reconciles PayPeriod.projected_labor_cost_cents.
          Each hop is caused strictly by the prior hop.
        test_recipe:
          setup:
            - "Location L predictability ON, advance_notice 14 days, base 2000"
            - "Worker W; PayPeriod 2026-06-01..2026-06-08"
            - "6h shift S on 2026-06-05 posted and assigned to W; clock advanced to 2026-06-04 (1 day before start, inside 14-day window)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Manager
              as_user_id: "mgr-1"
