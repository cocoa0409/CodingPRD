# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Specialty Glass Co-Development & Capacity Commitment
# Negative triggers consistently capture `err: $.data.error_id`.
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: create_device_maker_with_defaults
        claim_type: defaults
        grounds: ["entities.DeviceMaker"]
        distinguishing_aspect: "Omitting standing_tier applies STANDARD; system enums and common fields are initialized by the server."
        test_recipe:
          setup: ["empty system"]
          setup_api_calls: []
          trigger:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id, m_tier: $.data.standing_tier, m_ip: $.data.ip_review_status, m_v: $.data.version } }
          assert:
            - "http 201; response data contains server-minted id (UUID), created_at, updated_at, version == 1"
            - "standing_tier == STANDARD (default), ip_review_status == CLEAR (system default)"

      - name: create_composition_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Composition", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "composition_code is a required input; omitting it fails request-shape validation at priority 3 before any business rule."
        test_recipe:
          setup: ["program past NDA"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
          trigger:
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400; no Composition is created"

      - name: get_unknown_program_returns_not_found
        claim_type: not_found
        grounds: ["entities.Program", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a well-formed but non-existent program id yields 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty system"]
          setup_api_calls: []
          trigger:
            - { call: "GET /glass/programs/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND with http 404"

      - name: list_device_makers_pagination_envelope
        claim_type: listing
        grounds: ["entities.DeviceMaker", "response_envelope"]
        distinguishing_aspect: "List endpoint returns the fixed pagination envelope with defaults (limit 10) and correct total_count / has_more."
        test_recipe:
          setup: ["three device makers exist"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "M1", region: "US" }, as: PlatformAdmin }
            - { call: "POST /glass/device-makers", payload: { name: "M2", region: "EU" }, as: PlatformAdmin }
            - { call: "POST /glass/device-makers", payload: { name: "M3", region: "APAC" }, as: PlatformAdmin }
          trigger:
            - { call: "GET /glass/device-makers", as: ProgramManager }
          assert:
            - "response_type == array; data has 3 items; total_count == 3; has_more == false; limit defaulted to 10; offset defaulted to 0"

      - name: composition_multiplier_out_of_range_returns_invalid_request
        claim_type: type_constraints
        grounds: ["entities.Composition.fields.complexity_multiplier", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "complexity_multiplier is bounded to [1.0, 2.5]; 2.6 is rejected."
        test_recipe:
          setup: ["program past NDA"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
          trigger:
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 2.6 }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_REQUEST with http 400"

      - name: commitment_copies_device_maker_from_program
        claim_type: computed_fields
        grounds: ["entities.Commitment.fields.device_maker_id"]
        distinguishing_aspect: "device_maker_id is system-copied from the program, not accepted from the request body."
        test_recipe:
          setup: ["program NDA_EXECUTED for maker m"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
          trigger:
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id, c_m: $.data.device_maker_id, c_rem: $.data.prepayment_remaining_cents } }
          assert:
            - "Commitment.${c_id}.device_maker_id == ${m_id} (copied from program)"
            - "status == PROPOSED; prepayment_remaining_cents == 2500000; prepayment_applied_cents == 0; prepayment_refunded_cents == 0"

  - section: state_machines
    instances:
      - name: program_starts_in_draft
        claim_type: initial_state
        grounds: ["state_machines.Program"]
        distinguishing_aspect: "A newly created program starts in DRAFT with null nda_reference and null design_freeze_date."
        test_recipe:
          setup: ["one device maker"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
          trigger:
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id, p_status: $.data.status } }
          assert:
            - "Program.status == DRAFT; nda_reference is null; design_freeze_date is null; version == 1"

      - name: execute_nda_twice_returns_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.Program.DRAFT_to_NDA_EXECUTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "execute-nda is defined only from DRAFT; the second call from NDA_EXECUTED is rejected and idempotent re-fire is impossible."
        test_recipe:
          setup: ["program created"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
          trigger:
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; nda_reference remains NDA-001"

      - name: terminated_program_rejects_lifecycle_actions
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Program"]
        distinguishing_aspect: "TERMINATED is terminal; freeze-design (and any other transition) is rejected afterwards."
        test_recipe:
          setup: ["program in QUALIFICATION (NDA executed, composition exists, qualification begun)"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/begin-qualification", payload: { design_freeze_date: "2027-03-01T00:00:00Z" }, as: ProgramManager }
            - { call: "POST /glass/programs/${p_id}/terminate", payload: { reason: "customer cancelled" }, as: ProgramManager }
          trigger:
            - { call: "POST /glass/programs/${p_id}/freeze-design", as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; program remains TERMINATED"

      - name: locked_composition_cannot_be_retired
        claim_type: invalid_transition
        grounds: ["state_machines.Composition", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "LOCKED is excluded from the retire transition's from-set; retiring a locked composition fails."
        test_recipe:
          setup: ["composition QUALIFIED then LOCKED"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/compositions/${cx_id}/lock", as: ProgramManager }
          trigger:
            - { call: "POST /glass/compositions/${cx_id}/retire", as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409; composition remains LOCKED"

      - name: qual_cycle_third_resubmit_returns_max_attempts
        claim_type: precondition_enforcement
        grounds: ["state_machines.QualCycle.FAILED_to_SUBMITTED", "errors[ERR_MAX_QUAL_ATTEMPTS]"]
        distinguishing_aspect: "Resubmit is allowed only while attempt_number < CONST.MAX_QUAL_ATTEMPTS (3); after the third failure the loop closes."
        test_recipe:
          setup: ["qualification cycle with three recorded failures"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "FAILED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/resubmit", as: ProgramManager }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "FAILED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/resubmit", as: ProgramManager }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "FAILED" }, as: DeviceMaker, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /glass/qual-cycles/${q_id}/resubmit", as: ProgramManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MAX_QUAL_ATTEMPTS with http 422; attempt_number stays 3; status stays FAILED"

      - name: campaign_complete_before_end_returns_campaign_not_ended
        claim_type: precondition_enforcement
        grounds: ["state_machines.Campaign.RUNNING_to_COMPLETED", "errors[ERR_CAMPAIGN_NOT_ENDED]"]
        distinguishing_aspect: "complete requires the logical clock at or past end_date; firing mid-window is rejected."
        test_recipe:
          setup: ["RUNNING campaign over [2028-03-01, 2029-03-01); clock at 2028-06-01"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01" }
            - { call: "POST /glass/tanks", payload: { commitment_id: "${c_id}", capacity_units_per_day: 1000 }, as: CapacityPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-02-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/tanks/${t_id}/commission", as: CapacityPlanner }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 10000 }, as: CapacityPlanner, captures: { camp_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/campaigns/${camp_id}/start", as: CapacityPlanner }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-06-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /glass/campaigns/${camp_id}/complete", as: CapacityPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CAMPAIGN_NOT_ENDED with http 422; campaign remains RUNNING"

      - name: license_expires_at_checkpoint
        claim_type: valid_transition
        grounds: ["state_machines.License.ACTIVE_to_EXPIRED", "endpoints: POST /glass/ops/checkpoint"]
        distinguishing_aspect: "A license whose expiry_date has passed flips to EXPIRED only at the ops checkpoint, not lazily on read."
        test_recipe:
          setup: ["license ACTIVE over [2027-01-01, 2028-12-31]; clock advanced to 2029-01-01"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Beta Devices", region: "EU" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Falcon", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-002" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-200", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-2" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/programs/${p_id}/begin-qualification", payload: { design_freeze_date: "2027-03-01T00:00:00Z" }, as: ProgramManager }
            - { call: "POST /glass/programs/${p_id}/freeze-design", as: ProgramManager }
            - { call: "POST /glass/licenses", payload: { device_maker_id: "${m_id}", program_id: "${p_id}", market: "CONSUMER_ELECTRONICS", effective_date: "2027-01-01T00:00:00Z", expiry_date: "2028-12-31T00:00:00Z" }, as: LegalCounsel, captures: { lic_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/licenses/${lic_id}/activate", as: LegalCounsel }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2029-01-01T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /glass/ops/checkpoint", as: PlatformAdmin, captures: { n_exp: $.data.licenses_expired } }
            - { call: "GET /glass/licenses/${lic_id}", as: LegalCounsel, captures: { lic_status: $.data.license_status } }
          assert:
            - "checkpoint reports licenses_expired == 1"
            - "License.${lic_id}.license_status == EXPIRED"

      - name: commitment_exhausted_at_checkpoint
        claim_type: valid_transition
        grounds: ["state_machines.Commitment.EXHAUSTED", "endpoints: POST /glass/ops/checkpoint"]
        distinguishing_aspect: "A SECURED commitment whose fulfilled_units reaches committed_units flips to EXHAUSTED at the checkpoint."
        test_recipe:
          setup: ["SECURED commitment committed 1000; RUNNING campaign; allocation of 1000 fulfilled"]
          setup_api_calls:
            - { call: "POST /glass/device-makers", payload: { name: "Acme Devices", region: "US" }, as: PlatformAdmin, captures: { m_id: $.data.id } }
            - { call: "POST /glass/programs", payload: { device_maker_id: "${m_id}", name: "Eagle", primary_market: "CONSUMER_ELECTRONICS" }, as: ProgramManager, captures: { p_id: $.data.id } }
            - { call: "POST /glass/programs/${p_id}/execute-nda", payload: { nda_reference: "NDA-001" }, as: ProgramManager }
            - { call: "POST /glass/compositions", payload: { program_id: "${p_id}", composition_code: "GX-100", complexity_multiplier: 1.0 }, as: ProgramManager, captures: { cx_id: $.data.id } }
            - { call: "POST /glass/qual-cycles", payload: { composition_id: "${cx_id}", test_plan_ref: "TP-1" }, as: ProgramManager, captures: { q_id: $.data.id } }
            - { call: "POST /glass/qual-cycles/${q_id}/begin-testing", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 1000, required_units: 1000, prepayment_cents: 1000000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01", captures: { c_v: $.data.version } }
            - { call: "POST /glass/tanks", payload: { commitment_id: "${c_id}", capacity_units_per_day: 1000 }, as: CapacityPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-02-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/tanks/${t_id}/commission", as: CapacityPlanner }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 10000 }, as: CapacityPlanner, captures: { camp_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-03-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/campaigns/${camp_id}/start", as: CapacityPlanner }
            - { call: "POST /glass/allocations", payload: { commitment_id: "${c_id}", campaign_id: "${camp_id}", units: 1000, expected_commitment_version: "${c_v}" }, as: CapacityPlanner, captures: { a_id: $.data.id } }
            - { call: "POST /glass/allocations/${a_id}/fulfill", as: CapacityPlanner }
          trigger:
