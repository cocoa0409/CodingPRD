  - section: calculations
    instances:

      - name: duration_omits_jumpoff_for_non_jumper_division
        claim_type: correct_result
        grounds:
          - calculations.class_duration_estimate
          - entities.CompetitionDivision.fields.jumpoff_enabled
        distinguishing_aspect: |
          The jump-off term is gated on the DIVISION flag, not on the class or the
          discipline name. With the same four entered horses and the same 120 cm
          height, the jumper class (jumpoff_enabled true) estimates 29 minutes —
          ride 9 + course walk 10 + jump-off 2 + buffer 10 — while the hunter class
          (flag omitted, so false) estimates 27: ride 7 + walk 10 + buffer 10 and no
          jump-off. An implementation that always adds the jump-off term returns 30
          for the hunter class; one that never adds it returns 27 for the jumper.
        test_recipe:
          setup:
            - "APPROVED show, Ring A (turnover_buffer_minutes 10)."
            - "JUMPER division (share 3333, band 100-130, jumpoff_enabled true) with class 101 at 120 cm; HUNTER division (share 3000, band 80-130, jumpoff_enabled omitted) with class 201 at 120 cm. Both OPEN."
            - "One rider with four horses -> four Entries, each entered in BOTH classes, so entry_count == 4 on each class and confirmed_entry_count == 0."
