              as: ProgramAdmin
          trigger:
            - call: "POST /sharps/auto-ship-runs"
              payload: { as_of_date: "2026-11-01" }
              as: ProgramAdmin
              captures: { run1: $.data.id }
          assert:
            - "Patient.${pat_d}.screening_risk_score == 13"
            - "Patient.${pat_d}.audit_risk_score == 35"
            - "Patient.${pat_d}.audit_risk_score - Patient.${pat_d}.screening_risk_score == 22"
            - "Patient.${pat_d}.status == ENROLLED"
            - "Kit.${kit2}.seal_deadline_date == \"2026-09-28\""
            - "AutoShipRun.${run1}.kits_created == 0"
            - "AutoShipRun.${run1}.kits_skipped_unfilled == 1"
            - "AutoShipRun.${run1}.kits_skipped_risk == 0"

  - rule_id: combinatorial_formula
    instances:

      - name: risk_score_sum_then_single_round_not_per_term_round
        grounds:
          - calculations.patient_risk_score
          - entities.Patient.fields.screening_risk_score
          - entities.NonConformanceEvent.fields.reason_code
          - entities.AutoShipRun.fields.enrollments_evaluated
        distinguishing_aspect: |
          The combinatorial trap here is ROUNDING ORDER inside one decayed weighted sum: two odd
          weights (45 and 25) each multiplied by the 0.5 decay factor sum to exactly 35.0, so
          sum-then-round-once yields 35 while round-each-term-then-sum yields 23 + 13 = 36.
          Mode (a) sum-then-round-once = 35 (pinned); mode (b) round-each-term-then-sum = 36;
          mode (c) truncate-the-total = 35 but would diverge on other inputs. Only the total is rounded.
        test_recipe:
          setup:
            - "Baseline CA state rule, PS-A packaging spec, CA-TF-0001 facility (1000-unit daily capacity), NovaPen MANUFACTURER program (500000 ceiling, 6000 allowance), Dana Reyes ENROLLED with a 30-day / 5-kit ACTIVE enrollment."
            - "Clock at 2026-08-01T00:00:00Z: kit 1 sealed at 69 units / 1400 g, shipped, DELIVERED, screened NON_CONFORMING with reason LOOSE_SHARPS_IN_BOX (weight 45). screening_risk_score becomes 45, below the 60 threshold, patient stays ENROLLED."
            - "Clock at 2026-08-02T00:00:00Z: kit 2 sealed at 69 units / 1400 g, shipped, DELIVERED, screened NON_CONFORMING with reason OVERFILLED_CONTAINER (weight 25). Undecayed total 70 crosses the threshold, so the patient is SUSPENDED and the enrollment PAUSED."
            - "Clock at 2026-11-01T00:00:00Z: event 1 is 92 days old and event 2 is 91 days old, so both sit in the 91-180 day half-decay band."
