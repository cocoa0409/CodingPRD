            - "HedgePosition.${hedge_id}.base_margin_usd == 49900.00"
            - "HedgePosition.${hedge_id}.volatility_tier == T1"
            - "HedgePosition.${hedge_id}.volatility_adder_usd == 499.00"
            - "HedgePosition.${hedge_id}.total_margin_usd == 50399.00"
            - "HedgePosition.${hedge_id}.total_margin_usd != 51147.50"
