              captures: { gv2: $.data.version }
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p1}", tag_type: "PASS", clock_ms: 130000, confidence: 0.9, biometric_payload_present: false, expected_game_version: "${gv2}" }
              as: Statistician
              as_user_id: "stat-01"
              captures: { t2: $.data.id }
            - call: "POST /event-tags/${t1}/correction-requests"
              payload: { reason_code: "WRONG_CLOCK", proposed_clock_ms: 121000 }
              as: Statistician
              as_user_id: "stat-01"
              captures: { corr: $.data.id }
            - call: "GET /games/${g_id}"
              as: QualityReviewer
              as_user_id: "qa-01"
              captures: { mid_total: $.data.total_tag_count, mid_uc: $.data.under_correction_tag_count, mid_acc: $.data.accepted_tag_count, mid_draft: $.data.draft_tag_count }
          trigger:
            - call: "POST /correction-requests/${corr}/reject"
              as: QualityReviewer
              as_user_id: "qa-01"
            - call: "GET /games/${g_id}"
              as: Statistician
              as_user_id: "stat-01"
              captures: { gv3: $.data.version }
            - call: "POST /event-tags"
              payload: { game_id: "${g_id}", player_id: "${p1}", tag_type: "SHOT", clock_ms: 120000, confidence: 0.9, biometric_payload_present: false, expected_game_version: "${gv3}" }
              as: Statistician
              as_user_id: "stat-01"
              captures: { t3: $.data.id }
          assert:
            - "${mid_total} == 2 and ${mid_uc} == 1 and ${mid_acc} == 0 and ${mid_draft} == 1 (1 + 0 + 0 + 1 + 0 == 2 while the correction is open)"
            - "after the rejection EventTag.${t1}.review_status == ACCEPTED and EventTag.${t1}.correction_count == 0 and EventTag.${t1}.corrected_clock_ms == null"
            - "after the rejection Game.${g_id}.rejected_correction_count == 1 and Game.${g_id}.under_correction_tag_count == 0 and Game.${g_id}.accepted_tag_count == 1"
            - "after the rejection Game.${g_id}.quality_index == 0.7250"
            - "after T3 is created EventTag.${t1}.review_status == SUPERSEDED and EventTag.${t1}.superseded_by_tag_id == ${t3}"
            - "Game.${g_id}.total_tag_count == 3"
            - "Game.${g_id}.draft_tag_count == 2 and Game.${g_id}.submitted_tag_count == 0 and Game.${g_id}.accepted_tag_count == 0 and Game.${g_id}.under_correction_tag_count == 0 and Game.${g_id}.superseded_tag_count == 1"
            - "2 + 0 + 0 + 0 + 1 == 3 == Game.${g_id}.total_tag_count (census conserved)"
            - "Game.${g_id}.quality_index == 0.0000 (no ACCEPTED or UNDER_CORRECTION tags remain to score)"
            - "EventTag.${t3}.game_version_at_tag == Game.${g_id}.version"
