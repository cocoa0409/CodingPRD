        distinguishing_aspect: "The weighted sum is clamped: a MEMBER_FIRM with 20 breaches would score 60 but is reported as exactly 50, while a MEMBER_FIRM with 16 breaches scores an unclamped 48."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. One client with two multinational engagements, one MEMBER_FIRM affiliate, and two ATTESTED attestations carrying breach_count 19 and 15."
