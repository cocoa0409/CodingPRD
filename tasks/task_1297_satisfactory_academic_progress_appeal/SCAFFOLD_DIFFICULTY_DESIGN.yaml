  - rule_id: boundary_precision_check
    instances:
      - name: pace_exactly_67_passes_vs_66_fails
        grounds:
          - calculations.pace_calculation
          - endpoints["POST /sap/terms/{id}/evaluate"]
        distinguishing_aspect: |
          Numeric-threshold boundary on the pace metric via the evaluate endpoint:
          exactly 67.00 passes (>= is inclusive) while 66.00 fails; 67/100 engineered to
          land exactly on the threshold after round_half_up(2dp). Sibling boundary is a
          timestamp deadline on a different endpoint.
        test_recipe:
          setup:
            - "Program required_credits=120 (min_pace_pct default 67.0); T1, T2; Students A and B"
            - "T1: A and B both attempted 50 earned 40 QP 150.0 gh 50 -> GOOD (pace 80.00)"
            - "T2: A attempted 50 earned 27 (QP 81.0 gh 50); B attempted 50 earned 26 (QP 78.0 gh 50); grading closed"
