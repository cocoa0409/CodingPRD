  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: different interval semantics.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: settlement_batches_for_same_supplier_must_not_overlap
        grounds:
          - calculations.settlement_selection
          - entities.SettlementBatch.fields.period_start_date
          - entities.SettlementBatch.fields.period_end_date
        distinguishing_aspect: |
          Half-open interval semantics on the supplier's settlement calendar:
          [period_start, period_end) batches for the same supplier must not
          intersect; touching endpoints (one batch's end == another's start) are
          legal because the interval is exclusive on the right.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Supplier S exists."
            - "An existing DRAFT batch covers [2026-10-01, 2026-11-01)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/settlement-batches"
              payload: { supplier_id: "${sup_id}", period_start_date: "2026-10-01T00:00:00Z", period_end_date: "2026-11-01T00:00:00Z" }
              as: FinanceOps
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /opaque/settlement-batches"
              payload: { supplier_id: "${sup_id}", period_start_date: "2026-11-01T00:00:00Z", period_end_date: "2026-12-01T00:00:00Z" }
              as: FinanceOps
              captures: { b2: $.data.id }
            - call: "POST /opaque/settlement-batches"
              payload: { supplier_id: "${sup_id}", period_start_date: "2026-10-15T00:00:00Z", period_end_date: "2026-11-15T00:00:00Z" }
              as: FinanceOps
              captures: { err: $.data.error_id }
          assert:
            - "the adjacent batch [2026-11-01, 2026-12-01) succeeds (201) — touching at the exclusive end is legal"
            - "the straddling batch [2026-10-15, 2026-11-15) fails with 409 ERR_INVALID_STATE (overlaps both existing batches)"

      - name: bid_window_containment_vs_date_overlap_semantics
        grounds:
          - calculations.opaque_fill_selector
          - entities.RateWindow.fields.check_in_date
          - entities.RateWindow.fields.check_out_date
        distinguishing_aspect: |
          Containment semantics on RateWindow eligibility — the window must FULLY
          contain [check_in, check_out) (w.check_in <= bid.check_in AND
          w.check_out >= bid.check_out), a different geometric relation than the
          settlement batches' intersection test: a window that merely overlaps the
          stay (starts mid-stay) does NOT qualify.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; NB13 base with supplier/property."
            - "Window W_partial covers 2026-10-03..2026-10-06 (starts mid-stay), rate 15000, rooms 5."
            - "Customer C bids for 2026-10-02..2026-10-04."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB13", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB13", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-03T00:00:00Z", check_out_date: "2026-10-06T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 5 }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c14@x.com", full_name: "Cust Fourteen" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cv: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB13", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
          trigger:
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cv}" }
              as: PlatformAdmin
          assert:
            - "OpaqueBid.${bid_id}.status == REJECTED (overlap without full containment does not qualify)"

  # ===========================================================================
  # Rule 9 — compensating_invariant: different conserved quantities.
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: window_rooms_conserved_across_fill_and_service_failure_refund
        grounds:
          - state_machines.OpaqueBid.PENDING_to_ACCEPTED
          - state_machines.Booking.transitions
          - entities.RateWindow.fields.rooms_sold
        distinguishing_aspect: |
          Conserved quantity: rooms_sold on the RateWindow. The forward action
          (accept) increments rooms_sold by 1; the compensating action
          (mark-service-failure full refund) decrements it by exactly 1, so
          rooms_sold after the pair equals rooms_sold before — no drift.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; NB14 base, window W rooms_allocated 2 rooms_sold 0; customer C with accepted FIXED bid then complaint resolved FULL_REFUND with category SERVICE_FAILURE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/suppliers"
              payload: { legal_name: "Acme", opaque_commission_pct: 0.15, concealment_discount_min_pct: 0.10 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /opaque/disclosure-zones"
              payload: { neighborhood_code: "NB14", min_star_rating: 3, revealed_amenity_codes: ["POOL"] }
              as: PlatformAdmin
            - call: "POST /opaque/properties"
              payload: { supplier_id: "${sup_id}", brand_name: "P", star_rating: 4, neighborhood_code: "NB14", amenity_codes: ["POOL"], published_rate_cents: 20000 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /opaque/rate-windows"
              payload: { property_id: "${prop_id}", check_in_date: "2026-10-01T00:00:00Z", check_out_date: "2026-10-05T00:00:00Z", opaque_rate_cents: 15000, rooms_allocated: 2 }
              as: PlatformAdmin
              captures: { win_id: $.data.id }
            - call: "POST /opaque/customers"
              payload: { email: "c15@x.com", full_name: "Cust Fifteen" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id, cv: $.data.version }
            - call: "POST /opaque/opaque-bids"
              payload: { customer_id: "${cust_id}", neighborhood_code: "NB14", min_star_rating: 4, check_in_date: "2026-10-02T00:00:00Z", check_out_date: "2026-10-04T00:00:00Z", offer_mode: "FIXED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { bid_id: $.data.id }
            - call: "POST /opaque/opaque-bids/${bid_id}/evaluate"
              payload: { expected_customer_version: "${cv}" }
              as: PlatformAdmin
            - call: "GET /opaque/bookings"
              payload: { customer_id: "${cust_id}" }
              as: PlatformAdmin
              captures: { booking_id: "$.data[0].id" }
            - call: "POST /opaque/complaint-cases"
              payload: { booking_id: "${booking_id}", category: "SERVICE_FAILURE", description: "hotel closed" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { case_id: $.data.id }
            - call: "POST /opaque/complaint-cases/${case_id}/start-review"
              payload: {}
              as: CustomerService
            - call: "POST /opaque/complaint-cases/${case_id}/resolve"
              payload: { resolution: "FULL_REFUND" }
              as: CustomerService
          trigger:
            - call: "POST /opaque/bookings/${booking_id}/mark-service-failure"
              payload: {}
              as: CustomerService
          assert:
            - "RateWindow.${win_id}.rooms_sold == 0 after the compensate (was 1 after accept, 0 before accept)"
            - "Booking.${booking_id}.supplier_remittance_cents == 0 and platform_commission_cents == 0"

      - name: fraud_score_conserved_across_flag_uphold_and_dismiss
        grounds:
          - calculations.fraud_score_recompute
          - state_machines.FraudFlag.OPEN_to_UPHELD
          - state_machines.FraudFlag.OPEN_to_DISMISSED
        distinguishing_aspect: |
          Conserved quantity: Customer.fraud_score over a manual-flag cycle.
          Upholding flag A applies +30; creating manual flag B (unapplied) and
          dismissing it while still OPEN applies 0 and reverses 0 — the score
          after the create-then-dismiss pair equals the score before it exactly.
          A different conserved quantity (risk score) than rooms_sold (inventory
          count).
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Customer C, fraud_score 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /opaque/customers"
              payload: { email: "c16@x.com", full_name: "Cust Sixteen" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /opaque/fraud-flags"
              payload: { customer_id: "${cust_id}", reason_code: "MANUAL_REVIEW", score_delta: 30 }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /opaque/fraud-flags/${fa}/uphold"
              payload: {}
              as: PlatformAdmin
            - call: "POST /opaque/fraud-flags"
              payload: { customer_id: "${cust_id}", reason_code: "ARBITRAGE_PATTERN", score_delta: 30 }
              as: PlatformAdmin
              captures: { fb: $.data.id }
          trigger:
            - call: "POST /opaque/fraud-flags/${fb}/dismiss"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Customer.${cust_id}.fraud_score == 30 (uphold +30 stands; flag B was never applied so its dismissal subtracts 0)"
            - "Customer.${cust_id}.fraud_status == WATCH"
            - "a second dismiss of ${fb} returns 409 ERR_INVALID_STATE (DISMISSED is terminal — no double-reversal possible)"
