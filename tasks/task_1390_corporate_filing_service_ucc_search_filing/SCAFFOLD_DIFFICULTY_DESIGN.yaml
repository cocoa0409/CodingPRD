            - { call: "POST /client-accounts/${cid}/perfection-reports", payload: { mode: "FORWARD_PROJECTION", horizon_days: 90 }, as: ClientManager, as_user_id: "${cid}", captures: { rep_fwd: $.data.id } }
          assert:
            - "PerfectionReport.${rep_now}.active_count == 2"
            - "PerfectionReport.${rep_now}.perfected_count == 1"
