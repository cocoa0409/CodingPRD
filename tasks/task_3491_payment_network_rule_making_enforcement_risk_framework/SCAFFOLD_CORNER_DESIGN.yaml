          assert:
            - "AccountValidation.${av}.validated_until == 2027-09-01 (creation date + 365 days) and status == VALID"
            - "the WEB entry is created 201 with status ORIGINATED — validation plus matching authorization_type satisfies both gates"

      - name: web_entry_with_expired_validation_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - entities.AccountValidation.fields.status
        distinguishing_aspect: "The validation lapses with the clock: recorded 2026-09-01 (validated_until 2027-09-01), it reads EXPIRED on 2027-09-02 and a WEB debit to that account is rejected ERR_ACCOUNT_VALIDATION_REQUIRED despite the record existing."
        test_recipe:
          setup: ["P1 ACTIVE; O1 APPROVED; WEB code; W1; validation for acct-web-9 created 2026-09-01; clock advanced to 2027-09-02."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/participants"
              payload: { legal_name: "Bank One", participant_type: "ODFI", routing_number: "111000025" }
              as: PlatformAdmin
              captures: { p1: $.data.id }
            - call: "POST /network/participants/${p1}/transition"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /network/transaction-codes"
              payload: { code: "WEB", entry_class: "DEBIT", authorization_requirement: "ORAL_RECORDED", return_timeframe_banking_days: 30, account_validation_required: true, warranty_obligations: "ODFI warrants WEB account validation" }
              as: PlatformAdmin
              captures: { tc_web: $.data.id }
            - call: "POST /network/settlement-windows"
              payload: { window_code: "W1", cutoff_time_utc: "17:00", per_entry_limit_cents: 100000000, odfi_window_cap_cents: 2500000000 }
              as: PlatformAdmin
              captures: { w1: $.data.id }
            - call: "POST /network/originators"
              payload: { legal_name: "Alpha Payroll Corp", risk_tier: "STANDARD", exposure_limit_cents: 1000000000 }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { o1: $.data.id }
            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/account-validations"
              payload: { originator_id: "${o1}", account_number_hash: "acct-web-9", method: "PRENOTE" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { av: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T09:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /network/account-validations/${av}"
              payload: {}
              as: PlatformAdmin
              captures: { av_status: $.data.status }
