  - rule_id: compensating_invariant
    instances:
      - name: deposit_conserved_across_finalize_then_void
        grounds:
          - state_machines.Invoice.OPEN_to_FINALIZED
          - state_machines.Invoice.FINALIZED_to_VOID
          - entities.Owner.fields.deposit_held_cents
          - calculations.invoice_total
        distinguishing_aspect: |
          Conserved quantity = Owner.deposit_held_cents. Finalize debits 20000 deposit; voiding the
          FINALIZED invoice restores it, so deposit_held_cents returns to its pre-finalize value
          (20000) with zero drift.
        test_recipe:
          setup:
