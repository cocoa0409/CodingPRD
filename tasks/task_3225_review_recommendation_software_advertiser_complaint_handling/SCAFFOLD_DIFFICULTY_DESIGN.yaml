  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: complaint_resolve_depends_on_review_state
        grounds:
          - state_machines.Complaint.UNDER_REVIEW_to_RESOLVED_UPHELD
          - validations[priority=22]
        distinguishing_aspect: |
          Complaint -> Review pair: UPHOLD_FILTER on a FILTERED_DISPUTE requires
          the review to STILL be FILTERED at resolve time; a re-evaluation that
          flips the review to DISPLAYED between filing and resolving makes the
          resolve fail with ERR_REVIEW_STATE_CHANGED.
        test_recipe:
          setup:
            - "Clock 2026-09-01; author UA trust 50 -> his review R1 on P1 is FILTERED (500)"
            - "Owner UO claims P1 and files FILTERED_DISPUTE complaint CM1 on R1; CM1 UNDER_REVIEW"
            - "UA's trust raised to 100 (score would become 700); R1 re-evaluated -> DISPLAYED"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "xa@x.com", display_name: "X Author", home_region: "US-CA" }
              as: PlatformOps
              captures: { xa_id: $.data.id }
            - call: "POST /platform/users"
              payload: { email: "xo@x.com", display_name: "X Owner", home_region: "US-CA" }
              as: PlatformOps
              captures: { xo_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Cross Cafe", address_line: "70 Depends Ave", city: "Springfield", category: "cafe", website: "https://cross.example" }
              as: PlatformOps
              captures: { px_id: $.data.id, px_v: $.data.version }
            - call: "POST /platform/business-pages/${px_id}/claims"
              payload: { kind: "CLAIM", evidence_text: "Cafe ownership docs for cross test." }
              as: BusinessOwner
              as_user_id: "${xo_id}"
              captures: { clx_id: $.data.id, clx_code: $.data.verification_code }
            - call: "POST /platform/page-claims/${clx_id}/verify"
              payload: { verification_code: "${clx_code}" }
              as: BusinessOwner
              as_user_id: "${xo_id}"
            - call: "POST /platform/page-claims/${clx_id}/approve"
              payload: { expected_page_version: "${px_v}" }
              as: SupportAdmin
            - call: "POST /platform/business-pages/${px_id}/reviews"
              payload: { rating: 3, text: "Average flat white, nothing special to report." }
              as: Reviewer
              as_user_id: "${xa_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /platform/business-pages/${px_id}/complaints"
              payload: { review_id: "${rx_id}", kind: "FILTERED_DISPUTE", body: "Why was my customer's review filtered?" }
              as: BusinessOwner
              as_user_id: "${xo_id}"
              captures: { cx_id: $.data.id }
            - call: "POST /platform/complaints/${cx_id}/start-review"
              payload: {}
              as: ContentModerator
            - call: "POST /platform/users/${xa_id}/trust-adjustments"
              payload: { trust_score: 100 }
              as: PlatformOps
            - call: "POST /platform/reviews/${rx_id}/evaluate"
              payload: {}
              as: PlatformOps
          trigger:
            - call: "POST /platform/complaints/${cx_id}/resolve"
              payload: { action: "UPHOLD_FILTER" }
              as: ContentModerator
              captures: { cx_err: $.data.error_id }
          assert:
            - "Review.${rx_id}.recommendation_state == DISPLAYED after re-evaluation"
            - "Resolve UPHOLD_FILTER rejected with ERR_REVIEW_STATE_CHANGED (409)"
            - "Complaint.${cx_id}.status remains UNDER_REVIEW"

      - name: alert_lift_depends_on_case_state
        grounds:
          - state_machines.ConsumerAlert.ACTIVE_to_LIFTED
          - validations[priority=26]
        distinguishing_aspect: |
          ConsumerAlert -> SolicitationCase pair (different entities than
          Complaint -> Review): lifting a case-linked alert while the case is
          still CONFIRMED fails with ERR_ALERT_CASE_ACTIVE; only after the case
          is DISMISSED... the case cannot move CONFIRMED -> DISMISSED, so the
          lift is permanently blocked for case-linked alerts whose case was
          confirmed — verified against a manually placed alert whose linked case
          is CONFIRMED.
        test_recipe:
          setup:
            - "Clock 2026-09-01; page P1 ACTIVE; author UA review R1 FILTERED; reporter UR case SC1 CONFIRMED against R1"
            - "SupportAdmin attempts to place a second SOLICITATION_EVIDENCE alert fails (auto one exists); instead a SUSPICIOUS_ACTIVITY alert AL1 placed manually with case_id=SC1"
          setup_api_calls:
            - call: "POST /platform/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /platform/users"
              payload: { email: "la@x.com", display_name: "Lift Author", home_region: "US-CA" }
              as: PlatformOps
              captures: { la_id: $.data.id }
            - call: "POST /platform/users"
              payload: { email: "lr@x.com", display_name: "Lift Reporter", home_region: "US-CA" }
              as: PlatformOps
              captures: { lr_id: $.data.id }
            - call: "POST /platform/business-pages"
              payload: { name: "Lift Lounge", address_line: "80 Lift St", city: "Springfield", category: "bar", website: "https://lift.example" }
              as: PlatformOps
              captures: { pl_id: $.data.id }
            - call: "POST /platform/business-pages/${pl_id}/reviews"
              payload: { rating: 2, text: "Watered-down drinks and sticky tables everywhere." }
              as: Reviewer
              as_user_id: "${la_id}"
              captures: { rl_id: $.data.id }
            - call: "POST /platform/business-pages/${pl_id}/solicitation-cases"
              payload: { target_review_ids: ["${rl_id}"], evidence_text: "Bartender offered free drinks for five stars." }
              as: Reporter
              as_user_id: "${lr_id}"
              captures: { scl_id: $.data.id }
            - call: "POST /platform/solicitation-cases/${scl_id}/investigate"
              payload: {}
              as: TrustInvestigator
            - call: "POST /platform/solicitation-cases/${scl_id}/confirm"
              payload: {}
              as: TrustInvestigator
            - call: "POST /platform/business-pages/${pl_id}/consumer-alerts"
              payload: { kind: "SUSPICIOUS_ACTIVITY", evidence_text: "Unusual five-star spike this week.", case_id: "${scl_id}" }
              as: SupportAdmin
              captures: { al1_id: $.data.id }
          trigger:
            - call: "POST /platform/consumer-alerts/${al1_id}/lift"
              payload: {}
              as: SupportAdmin
              captures: { lift_err: $.data.error_id }
          assert:
            - "ConsumerAlert.${al1_id} lift rejected with ERR_ALERT_CASE_ACTIVE (409) because SolicitationCase.${scl_id}.status == CONFIRMED (not DISMISSED)"
            - "ConsumerAlert.${al1_id}.status remains ACTIVE"

