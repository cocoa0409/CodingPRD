              payload: { response_type: "DISPUTED", response_note: "Statement was posted" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "RESCIND_PENALTY", action_note: "Rescinding a penalty that was never assessed" }
              as: StateRegulator
              as_user_id: "${juris}"
              captures: { err_rescind_early: $.data.error_id }
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "CLOSE_COMPLIANT", action_note: "Closing on a disputed response" }
              as: StateRegulator
              as_user_id: "${juris}"
              captures: { err_close_disputed: $.data.error_id }
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "REQUEST_INFO", action_note: "Send the board photograph" }
              as: StateRegulator
              as_user_id: "${juris}"
            - call: "POST /enforcement-actions/${action}/responses"
              payload: { response_type: "DISPUTED", response_note: "Photograph unavailable" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "ESCALATE", action_note: "Escalating after one information round" }
              as: StateRegulator
              as_user_id: "${juris}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "ASSESS_PENALTY", penalty_basis: "PER_ESTABLISHMENT", action_note: "Single-unit assessment" }
              as: StateRegulator
              as_user_id: "${juris}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "ASSESS_PENALTY", penalty_basis: "PER_ESTABLISHMENT", action_note: "Second assessment attempt" }
              as: StateRegulator
              as_user_id: "${juris}"
              captures: { err_assess_twice: $.data.error_id }
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "CLOSE_PENALTY", action_note: "Closing with the penalty on the books" }
              as: StateRegulator
              as_user_id: "${juris}"
            - call: "POST /enforcement-actions/${action}/regulator-actions"
              payload: { action_type: "RESCIND_PENALTY", action_note: "Rescinding after closure" }
              as: StateRegulator
              as_user_id: "${juris}"
              captures: { err_terminal: $.data.error_id }
          assert:
            - "trigger[0] response HTTP status == 409 and data.error_id == ERR_ACTION_STATE_INVALID"
            - "trigger[2] response HTTP status == 409 and data.error_id == ERR_ACTION_STATE_INVALID - RESCIND_PENALTY is defined only from PENALTY_ASSESSED"
            - "trigger[3] response HTTP status == 409 and data.error_id == ERR_ACTION_STATE_INVALID - CLOSE_COMPLIANT additionally requires last_response_type IN {REPRINT_COMPLETED, VARIANCE_CITED}"
            - "trigger[7] response HTTP status == 200 with data.status == PENALTY_ASSESSED, data.violation_unit_count == 1, data.base_penalty_cents == 50000, data.admin_fee_cents == 2500 and data.penalty_total_cents == 52500"
            - "Establishment.${est}.outstanding_penalty_cents == 52500 and Jurisdiction.${juris}.assessed_penalty_cents_total == 52500 after trigger[7]"
            - "trigger[8] response HTTP status == 409 and data.error_id == ERR_ACTION_STATE_INVALID, and EnforcementAction.${action}.penalty_total_cents is still 52500 - no double charge"
            - "trigger[9] response data.status == CLOSED_PENALTY with data.closed_at == 2026-08-01T00:00:00Z"
            - "trigger[10] response HTTP status == 409 and data.error_id == ERR_ALREADY_TERMINAL - the terminal check at priority 10 outranks the state check at 15"
            - "Establishment.${est}.outstanding_penalty_cents == 52500 after trigger[10] - closure leaves the ledger intact"


      - name: reprint_is_refused_when_nothing_on_the_board_is_stale
        claim_type: violation_to_error
        grounds:
          - validations[priority=40]
          - errors[ERR_NO_STALE_LISTINGS]
          - entities.MenuBoard.stale_listing_count
        distinguishing_aspect: "The reprint guard counts stale lines rather than lines: a board that carries a LISTED listing of a fully declared item, and a board that carries no listings at all, both refuse POST /menu-boards/{id}/reprint with ERR_NO_STALE_LISTINGS so reprint_count can never be inflated."
        test_recipe:
          setup:
            - "COVERED brand with one certified STANDARD item."
            - "Two DRAFT boards of one unit: one with a single LISTED listing, one empty."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
