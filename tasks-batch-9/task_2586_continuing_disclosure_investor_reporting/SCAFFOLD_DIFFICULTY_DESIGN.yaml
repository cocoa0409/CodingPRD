            - "${missed3} == 3"
            - "${score3} == 66.00 — base 60 escalated by TIER_MULTIPLIER[TIER_1] == 1.10"
            - "${score3} != 75.00 — that is what reading the freshly derived TIER_2 would give"
            - "${score3} != 60.00 — that is what one combined sweep would give"
            - "${tier3} == TIER_2 and ${posture3} == IMPAIRED"
            - "MaterialEventNotice.${n1_id}.status == MISSED, .${n2_id}.status == MISSED, .${n3_id}.status == MISSED"
            - "BondIssue.${issue_id}.open_material_event_count == 0 and Undertaking.${und_id}.open_obligation_count == 0"

  - rule_id: non_linear_state_machine
    instances:

      - name: rejection_resubmit_loop_converts_a_timely_filing_into_a_late_one
        grounds:
          - state_machines.Filing.DRAFT_to_SUBMITTED
          - state_machines.Filing.SUBMITTED_to_REJECTED
          - state_machines.Filing.REJECTED_to_SUBMITTED
          - state_machines.AnnualReportCycle.FILING_IN_PROGRESS_to_READY_TO_FILE
          - calculations.cycle_timeliness_assessment
          - entities.Filing.fields.submission_attempt_count
        distinguishing_aspect: |
          The DRAFT -> SUBMITTED -> REJECTED -> SUBMITTED -> CONFIRMED loop revisits SUBMITTED,
          and because submitted_at is OVERWRITTEN by the resubmit, the first — timely —
          submission instant is destroyed. The same filing that would have been FILED_TIMELY
          had it never been rejected ends FILED_LATE with days_late 2 and a FailureToFileEvent,
          while the intermediate rejection itself mints nothing.
        test_recipe:
          setup:
            - "One BondIssue with one Undertaking on SUBMISSION_BASIS, one 10000-bp ContentRequirement and one ACTIVE DisseminationEngagement."
            - "One AnnualReportCycle FY2026 for [2025-07-01, 2026-06-30) whose due_date is 2027-01-26, prepared, attested by off-prep, assembled by off-asm."
            - "One ANNUAL_REPORT Filing submitted on 2027-01-26 — exactly on the due date, i.e. timely on the inclusive boundary."
            - "The repository rejects it on 2027-01-27, sending the cycle back to READY_TO_FILE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "SCHOOLDIST", series_designation: "2026A", security_type: "GENERAL_OBLIGATION", dated_date: "2026-04-01", final_maturity_date: "2046-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_v: "$.data.version" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Keystone Filing Agents", effective_date: "2026-07-01", expiration_date: "2027-12-31", retainer_cents: 250000, last_calendar_ack_date: "2026-08-01", expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_id: "$.data.id" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id", due_date: "$.data.due_date" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/annual-report-cycles/${cycle_id}/assemble"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-asm"
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { issue_v: "$.data.version" }
            - call: "POST /disclosure/filings"
              payload: { issue_id: "${issue_id}", filing_type: "ANNUAL_REPORT", cycle_id: "${cycle_id}", expected_issue_version: "${issue_v}" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { filing_id: "$.data.id", attempts_initial: "$.data.submission_attempt_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-26T10:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/filings/${filing_id}/submit"
              payload: {}
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { attempts_1: "$.data.submission_attempt_count", submitted_1: "$.data.submitted_at" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-27T11:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/filings/${filing_id}/reject"
              payload: { rejection_reason: "Operating data table missing the required five-year history." }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { status_rejected: "$.data.status" }
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_after_reject: "$.data.status" }
            - call: "GET /disclosure/failure-to-file-events?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { fte_count_after_reject: "$.total_count" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-28T09:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
          trigger:
            - call: "POST /disclosure/filings/${filing_id}/resubmit"
              payload: { correction_reason: "Five-year operating data history appended per repository comment." }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
              captures: { attempts_2: "$.data.submission_attempt_count", submitted_2: "$.data.submitted_at", status_resubmitted: "$.data.status" }
            - call: "POST /disclosure/filings/${filing_id}/confirm"
              payload: { repository_receipt_id: "EMMA-SD-2027-0001" }
              as: DisseminationAgent
              as_user_id: "${eng_id}"
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_final: "$.data.status", cycle_days_late: "$.data.days_late", cycle_filed_at: "$.data.filed_at" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { late_count: "$.data.late_filing_count", risk: "$.data.disclosure_risk_score", posture: "$.data.compliance_posture" }
          assert:
            - "${due_date} == \"2027-01-26\""
            - "${attempts_initial} == 0, ${attempts_1} == 1, ${attempts_2} == 2 (still under MAX_SUBMISSION_ATTEMPTS 3)"
            - "${submitted_1} == \"2027-01-26T10:00:00Z\" — timely on the inclusive boundary at that moment"
            - "${status_rejected} == REJECTED and ${cycle_after_reject} == READY_TO_FILE"
            - "${fte_count_after_reject} == 0 — a repository rejection mints no failure event"
            - "${status_resubmitted} == SUBMITTED and ${submitted_2} == \"2027-01-28T09:00:00Z\" — the earlier timely instant was overwritten"
            - "Filing.${filing_id}.rejection_reason == null after the resubmit"
            - "${cycle_final} == FILED_LATE"
            - "${cycle_days_late} == 2"
            - "${cycle_filed_at} == \"2027-01-28T09:00:00Z\""
            - "GET /disclosure/failure-to-file-events?cycle_id=${cycle_id} now returns 1 row with kind ANNUAL_REPORT_LATE, occurred_at \"2027-01-26\", days_late 2, severity MINOR"
            - "${late_count} == 1, ${risk} == 12.00, ${posture} == COMPLIANT"
            - "DisseminationEngagement.${eng_id}.billable_filing_count == 1 — only the confirmation billed, not the rejected attempt"

      - name: determination_fork_gives_the_two_branches_disjoint_side_effects
        grounds:
          - state_machines.MaterialEventNotice.DETERMINATION_PENDING_to_MATERIAL
          - state_machines.MaterialEventNotice.DETERMINATION_PENDING_to_NOT_MATERIAL
          - state_machines.MaterialEventNotice.MATERIAL_to_MISSED
          - calculations.undertaking_open_obligation_count
          - calculations.derived_flag_bookkeeping
          - entities.BondIssue.fields.open_material_event_count
        distinguishing_aspect: |
          A branching fork out of one state on ONE trigger, where the branch decides whether the
          ten-business-day window is armed at all. Two notices identical in every respect except
          their determination diverge permanently: the MATERIAL one is swept to MISSED and mints
          a MAJOR failure event, the NOT_MATERIAL one is terminal, invisible to the sweep, and
          releases its obligation slot immediately. NOT_MATERIAL is also proven to be a real
          terminal state by a second determine attempt returning ERR_INVALID_STATE_TRANSITION.
        test_recipe:
          setup:
            - "One BondIssue with one Undertaking and no cycles, so open_obligation_count counts notices only."
            - "Two non-per-se MaterialEventNotices on that issue: notice A (UNSCHEDULED_DRAW_ON_RESERVE, occurrence 2026-07-20, deadline 2026-08-03) and notice B (TRUSTEE_SUBSTITUTION, occurrence 2026-07-22, deadline 2026-08-05)."
            - "Both are created while the clock stands at 2026-07-25 and both begin in DETERMINATION_PENDING, so open_material_event_count is 2 before any determination."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-07-25T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "TRANSITAUTH", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-03-15", final_maturity_date: "2056-03-15", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "12-31", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "UNSCHEDULED_DRAW_ON_RESERVE", occurrence_date: "2026-07-20" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { na_id: "$.data.id", na_deadline: "$.data.filing_deadline_date", na_status: "$.data.status" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "TRUSTEE_SUBSTITUTION", occurrence_date: "2026-07-22" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { nb_id: "$.data.id", nb_deadline: "$.data.filing_deadline_date" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { open_before: "$.data.open_material_event_count" }
          trigger:
            - call: "POST /disclosure/material-event-notices/${na_id}/determine"
              payload: { determination: "MATERIAL", determination_note: "Reserve draw is material to holders." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { na_after: "$.data.status", na_det_by: "$.data.determined_by_user_id", na_det_at: "$.data.determined_at" }
            - call: "POST /disclosure/material-event-notices/${nb_id}/determine"
              payload: { determination: "NOT_MATERIAL", determination_note: "Successor trustee has identical powers; not material." }
              as: ComplianceReviewer
              as_user_id: "rev-2"
              captures: { nb_after: "$.data.status", nb_det_by: "$.data.determined_by_user_id" }
            - call: "GET /disclosure/bond-issues/${issue_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { open_after: "$.data.open_material_event_count" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { oblig_after: "$.data.open_obligation_count" }
            - call: "POST /disclosure/material-event-notices/${nb_id}/determine"
              payload: { determination: "MATERIAL", determination_note: "Second thoughts." }
              as: ComplianceReviewer
              as_user_id: "rev-1"
              captures: { reopen_error: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/calendar-sweeps"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { sweep_missed: "$.data.missed_event_count", sweep_failures: "$.data.failure_event_created_count" }
          assert:
            - "${na_deadline} == \"2026-08-03\" and ${nb_deadline} == \"2026-08-05\""
            - "${na_status} == DETERMINATION_PENDING at creation and ${open_before} == 2"
            - "${na_after} == MATERIAL, ${na_det_by} == \"rev-1\", ${na_det_at} == \"2026-07-25T00:00:00Z\""
            - "${nb_after} == NOT_MATERIAL and ${nb_det_by} == \"rev-2\""
            - "${open_after} == 1 — only the MATERIAL notice is still open"
            - "${oblig_after} == 1"
            - "${reopen_error} == ERR_INVALID_STATE_TRANSITION with HTTP 409 — NOT_MATERIAL is terminal"
            - "${sweep_missed} == 1 and ${sweep_failures} == 1 — the sweep at 2026-08-06 saw both deadlines pass but only one sweepable notice"
            - "MaterialEventNotice.${na_id}.status == MISSED with days_late 3 (2026-08-03 -> 2026-08-06)"
            - "MaterialEventNotice.${nb_id}.status == NOT_MATERIAL, days_late 0, filed_filing_id null"
            - "GET /disclosure/failure-to-file-events?material_event_id=${na_id} returns 1 row, kind MATERIAL_EVENT_MISSED, occurred_at \"2026-08-03\", severity MAJOR"
            - "GET /disclosure/failure-to-file-events?material_event_id=${nb_id} returns 0 rows"
            - "Undertaking.${und_id}.missed_event_count == 1, disclosure_risk_score == 20.00, remediation_tier == TIER_0, compliance_posture == COMPLIANT"
            - "BondIssue.${issue_id}.open_material_event_count == 0 after the sweep"

  - rule_id: transitive_cascade
    instances:

      - name: defeasance_cascades_four_hops_to_items_and_engagement
        grounds:
          - state_machines.BondIssue.OUTSTANDING_to_DEFEASED
          - state_machines.Undertaking.ACTIVE_to_TERMINATED
          - state_machines.AnnualReportCycle.DRAFTING_to_CLOSED_NOT_REQUIRED
          - state_machines.CycleContentItem.DRAFT_to_VOID
          - state_machines.DisseminationEngagement.ACTIVE_to_TERMINATED
          - state_machines.MaterialEventNotice.DETERMINATION_PENDING_to_VOID
          - calculations.content_preparation_completeness_score
          - endpoints.POST_/disclosure/bond-issues/{id}/defease
        distinguishing_aspect: |
          A single FinanceDirector call fans out across FIVE entity types in one request
          (BondIssue -> Undertaking -> AnnualReportCycle -> CycleContentItem, plus the sibling
          hops to DisseminationEngagement and MaterialEventNotice) AND contains an ordering
          trap: the void pass over existing notices must run BEFORE the new DEFEASANCE notice is
          minted, otherwise the defeasance would void its own disclosure obligation.
        test_recipe:
          setup:
            - "One BondIssue with outstanding_par_amount_cents 100000000 and a far-future final_maturity_date, so nothing else can terminate it."
            - "One ACTIVE Undertaking, one 10000-bp ContentRequirement, one ACTIVE DisseminationEngagement with retainer_cents 250000."
            - "One AnnualReportCycle FY2026 in DRAFTING whose single CycleContentItem has been PATCHed to DRAFT, so completeness_score_pct is 50.00 before the defeasance."
            - "One pre-existing MaterialEventNotice in DETERMINATION_PENDING (UNSCHEDULED_DRAW_ON_RESERVE, occurrence 2026-07-20)."
            - "The logical clock stands at 2026-08-01T00:00:00Z; the defeasance occurrence_date is 2026-08-01 (a Saturday), whose ten-business-day deadline is 2026-08-14."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "AIRPORTREV", series_designation: "2016A", security_type: "REVENUE", dated_date: "2016-05-01", final_maturity_date: "2046-05-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id", par_before: "$.data.outstanding_par_amount_cents" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_v: "$.data.version" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Beacon Dissemination Co", effective_date: "2026-07-20", expiration_date: "2027-12-31", retainer_cents: 250000, last_calendar_ack_date: "2026-08-01", expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_id: "$.data.id", eng_status_before: "$.data.status", invoice_before: "$.data.invoice_total_cents" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id", due_date: "$.data.due_date" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2026-06-30", source_document_ref: "OPDATA-FY2026.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "UNSCHEDULED_DRAW_ON_RESERVE", occurrence_date: "2026-07-20" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { old_notice_id: "$.data.id" }
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { score_before: "$.data.completeness_score_pct" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { oblig_before: "$.data.open_obligation_count" }
          trigger:
            - call: "POST /disclosure/bond-issues/${issue_id}/defease"
              payload: { defeasance_type: "LEGAL", escrow_deposit_cents: 100000000, occurrence_date: "2026-08-01" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_status: "$.data.status", par_after: "$.data.outstanding_par_amount_cents", def_type: "$.data.defeasance_type", escrow: "$.data.escrow_deposit_cents", defeased_at: "$.data.defeased_at", open_events_after: "$.data.open_material_event_count" }
            - call: "GET /disclosure/material-event-notices?issue_id=${issue_id}&event_type=DEFEASANCE"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { new_notice_id: "$.data[0].id", new_notice_status: "$.data[0].status", new_notice_deadline: "$.data[0].filing_deadline_date", new_notice_perse: "$.data[0].per_se_material" }
            - call: "GET /disclosure/undertakings/${und_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_status: "$.data.status", term_cause: "$.data.termination_cause", oblig_after: "$.data.open_obligation_count" }
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { cycle_status: "$.data.status", score_after: "$.data.completeness_score_pct" }
            - call: "GET /disclosure/cycle-content-items/${item_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { item_status: "$.data.status", item_factor: "$.data.readiness_factor" }
            - call: "GET /disclosure/dissemination-engagements/${eng_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_status: "$.data.status", eng_reason: "$.data.termination_reason" }
            - call: "GET /disclosure/material-event-notices/${old_notice_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { old_notice_status: "$.data.status" }
          assert:
            - "${par_before} == 100000000, ${score_before} == 50.00, ${oblig_before} == 2 (one DRAFTING cycle + one pending notice), ${eng_status_before} == ACTIVE, ${invoice_before} == 300000"
            - "${issue_status} == DEFEASED, ${par_after} == 0, ${def_type} == LEGAL, ${escrow} == 100000000, ${defeased_at} == \"2026-08-01T00:00:00Z\""
            - "hop 1: ${und_status} == TERMINATED and ${term_cause} == DEFEASANCE"
            - "hop 2: ${cycle_status} == CLOSED_NOT_REQUIRED"
            - "hop 2b: ${eng_status} == TERMINATED and ${eng_reason} == UNDERTAKING_TERMINATED"
            - "hop 3: ${item_status} == VOID and ${item_factor} == 0.0"
            - "${score_after} == 0.00 — the only item left the score input set entirely"
            - "${old_notice_status} == VOID — the pre-existing pending notice is voided"
            - "${new_notice_status} == DETERMINATION_PENDING — the DEFEASANCE notice minted AFTER the void pass survives it"
            - "${new_notice_perse} == true and ${new_notice_deadline} == \"2026-08-14\" (ten business days after Saturday 2026-08-01)"
            - "${open_events_after} == 1 and ${oblig_after} == 1 — exactly the new DEFEASANCE notice"
            - "DisseminationEngagement.${eng_id}.invoice_total_cents == 300000 — frozen at termination, never recomputed again"
            - "POST /disclosure/material-event-notices with issue_id ${issue_id} now returns ERR_ISSUE_NOT_OUTSTANDING (409) — the issue is terminal"

      - name: late_confirmation_cascades_five_hops_into_official_statement_adequacy
        grounds:
          - endpoints.POST_/disclosure/filings/{id}/confirm
          - state_machines.AnnualReportCycle.FILING_IN_PROGRESS_to_FILED_LATE
          - calculations.undertaking_delinquency_counters
          - calculations.undertaking_disclosure_risk_score
          - calculations.dissemination_agent_invoice
          - calculations.official_statement_disclosure_lookback
          - entities.OfficialStatement.fields.disclosure_adequacy
        distinguishing_aspect: |
          A different cascade topology than the defeasance instance: one confirm call walks a
          LINEAR five-hop chain (Filing -> AnnualReportCycle -> FailureToFileEvent ->
          Undertaking counters/score -> DisseminationEngagement invoice) and then jumps a
          cross-aggregate boundary to a DIFFERENT BondIssue's OfficialStatement, flipping an
          already-ADEQUATE compliance review to INCOMPLETE. The invoice hop also exercises the
          MIN_ANNUAL_FEE_CENTS floor, so an implementation that skips the floor is caught here.
        test_recipe:
          setup:
            - "Credit program HARBORDIST holds a seasoned issue (series 2018A) with one Undertaking on SUBMISSION_BASIS, one 10000-bp ContentRequirement, and one ACTIVE DisseminationEngagement with retainer_cents 250000."
            - "Its AnnualReportCycle FY2025 for [2024-07-01, 2025-06-30) has due_date 2026-01-26, is fully prepared and assembled, and carries an ANNUAL_REPORT Filing already SUBMITTED at clock 2026-08-01 — long past the due date."
            - "A SECOND issue in the same program (series 2026N) carries an OfficialStatement dated 2026-09-01 that has already been compliance-reviewed with disclosed_event_ids empty and came back ADEQUATE, because at review time the program had no failure events at all."
            - "Nothing has been swept, so the cycle is still FILING_IN_PROGRESS rather than DELINQUENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FinanceDirector
              as_user_id: "fd-1"
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "HARBORDIST", series_designation: "2018A", security_type: "REVENUE", dated_date: "2018-07-01", final_maturity_date: "2048-07-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue1_id: "$.data.id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "HARBORDIST", series_designation: "2026N", security_type: "REVENUE", dated_date: "2026-09-01", final_maturity_date: "2056-09-01", original_par_amount_cents: 40000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue2_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue1_id}", fiscal_year_end_month_day: "06-30", filing_window_days: 210, timeliness_basis: "SUBMISSION_BASIS" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id", und_v: "$.data.version" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "OPERATING_DATA_TABLE", label: "Operating Data Tables", weight_bp: 10000, waivable: false }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/dissemination-engagements"
