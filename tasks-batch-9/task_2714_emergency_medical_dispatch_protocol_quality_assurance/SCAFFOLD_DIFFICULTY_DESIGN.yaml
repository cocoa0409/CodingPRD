            - "GET /coaching-plans?dispatcher_id=${db_id} returns exactly 1 element with origin AUTO, severity ADVISORY, severity_rank 1, focus_area PRE_ARRIVAL_INSTRUCTIONS (the lowest section percentage, 88.00), required_hours 2.0"
            - "Dispatcher.${da_id}.remediation_hours_owed == 0.00 and Dispatcher.${db_id}.remediation_hours_owed == 2.00; both keep dispatch_privilege FULL"

