# =============================================================================
# PRD Benchmark Scaffold — task_2517_commercial_mortgage_special_servicing
# Difficulty target: BEYOND EXPERT (13 entities / 53 endpoints / 45 error codes /
#                    13 calculations, 3 of them dual-variant / 13 state machines /
#                    33 ordered validation rules / 7 roles)
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2517. Commercial Mortgage Special Servicing (commercial mortgage-backed securities special
  servicer): transfer of a loan to special servicing on defined servicing transfer events,
  borrower request intake for modifications, assumptions and lease approvals with servicing
  standard analysis, appraisal ordering, appraisal reduction amount calculation and advance
  obligations, workout alternatives with net present value testing across modification, deed in
  lieu, note sale and foreclosure, controlling class representative consultation and consent
  rights, real-estate-owned management, disposition and asset business plans, fee structure
  including workout and liquidation fees, reporting to trustees, rating agencies and certificate
  holders

domain_name: cmbs-special-servicing
api_prefix: /special-servicing

complexity_profile:
  difficulty_level: "beyond_expert"
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  entity_topology_note: |
    Every entity is a top-level collection under /special-servicing. Ownership is expressed
    only through foreign-key fields in request bodies (trust_id, loan_id, workout_plan_id,
    appraisal_id, source_workout_plan_id, borrower_request_id, supersedes_alternative_id),
    never through nested URL paths. Children created by cascade (AppraisalReduction, the
    auto-recorded ServicingTransferEvent, waterfall-generated FeeAccrual) are discoverable
    ONLY through the filtered-list GETs declared in §1.5.

  state_machine_shape: cyclic
  state_machine_shape_note: |
    Four of the thirteen machines are non-linear in different ways: Loan carries two
    independent status dimensions (servicing_status x payment_status) on one row;
    BorrowerRequest loops UNDER_ANALYSIS -> INFO_REQUESTED -> UNDER_ANALYSIS (capped at 2);
    WorkoutPlan loops CONSULTATION -> OBJECTED -> DRAFT (capped at 3 revision rounds);
    Trust.control_status oscillates CONTROLLING <-> CONSULTING_ONLY as appraisal reductions
    become effective and are later reversed.

  relationship_patterns:
    - one_to_many
    - self_referential          # WorkoutAlternative.supersedes_alternative_id -> WorkoutAlternative.id
    - polymorphic               # ConsultationRequest.subject_type selects which of two nullable FKs is populated
    - cross_aggregate           # AppraisalReduction (Loan aggregate) drives Trust.control_status (Trust aggregate)

  role_model: segregation_of_duties
  role_model_note: |
    Authoring and blessing are split across roles AND across user ids: the asset manager who
    ordered an appraisal may not accept it, the manager who prepared a workout plan may not
    approve it, and the manager who accrued a fee may not waive it. Two roles are
    entity_backed (Borrower -> Loan, ControllingClassRepresentative -> Trust), so ownership is
    a header-vs-field comparison rather than a guess.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Trust
    parent: null
    common_fields: true
    fields:
      - { name: deal_name, type: string, source: input, description: "Securitization deal name, e.g. 'CMBS 2024-C1'" }
      - { name: closing_date, type: datetime, source: input, description: "Securitization closing date (ISO 8601 UTC)" }
      - { name: original_controlling_class_balance_usd, type: number, source: input, description: "Certificate balance of the controlling class at securitization; the denominator of the 25% control test", constraints: "> 0" }
      - { name: total_ara_usd, type: number, source: computed, default: 0, description: "Sum of AppraisalReduction.ara_amount_usd over every AppraisalReduction whose loan_id belongs to a Loan with trust_id == this Trust.id AND whose status == EFFECTIVE; recomputed in full on every ARA status change" }
      - { name: realized_loss_usd, type: number, source: computed, default: 0, description: "Cumulative realized loss; increased only by the liquidation waterfall (calculations.liquidation_proceeds_waterfall step 6) and never decreased" }
      - { name: controlling_class_notional_usd, type: number, source: computed, description: "= max(0, round(original_controlling_class_balance_usd - total_ara_usd - realized_loss_usd, 2))" }
      - { name: control_status, type: enum, source: computed, default: CONTROLLING, description: "CONTROLLING | CONSULTING_ONLY — output of calculations.controlling_class_control_test", constraints: "CONTROLLING | CONSULTING_ONLY" }
      - { name: total_advances_outstanding_usd, type: number, source: computed, default: 0, description: "Sum of (Advance.amount_usd - Advance.reimbursed_principal_usd) over every Advance whose loan_id belongs to a Loan with trust_id == this Trust.id AND whose status IN {OUTSTANDING, PARTIALLY_REIMBURSED}" }
      - { name: excess_liquidation_proceeds_usd, type: number, source: computed, default: 0, description: "Cumulative step-7 residue of calculations.liquidation_proceeds_waterfall (proceeds left after principal is fully repaid)" }
      - { name: loans_in_special_servicing_count, type: integer, source: computed, default: 0, description: "Count of Loans with trust_id == this Trust.id AND servicing_status IN {SPECIAL_SERVICING, IN_WORKOUT, REO}" }
      - { name: special_servicing_fee_annual_pct, type: number, source: input, default: 0.25, description: "Annual special servicing fee rate in percent, divided by 12 for monthly accrual" }
      - { name: workout_fee_rate_pct, type: number, source: input, default: 1.0, description: "Workout fee rate in percent, applied to collections on a corrected loan" }
      - { name: liquidation_fee_rate_pct, type: number, source: input, default: 1.0, description: "Liquidation fee rate in percent, applied to GROSS liquidation proceeds" }
      - { name: advance_interest_rate_pct, type: number, source: input, default: 5.0, description: "Annual rate at which outstanding advances accrue interest on a 30/360 basis" }
      - { name: fee_basis_convention, type: enum, source: input, default: STATED_PRINCIPAL, description: "STATED_PRINCIPAL | ARA_ADJUSTED — selects the variant of calculations.special_servicing_fee_accrual", constraints: "STATED_PRINCIPAL | ARA_ADJUSTED" }
      - { name: consultation_response_business_days, type: integer, source: input, default: 10, description: "Business days the controlling class representative has to respond before deemed consent" }

  - name: Loan
    parent: Trust
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> Trust.id; the securitization trust that holds this mortgage loan" }
      - { name: loan_number, type: string, source: input, description: "Servicer loan number", constraints: "unique within trust_id" }
      - { name: original_balance_usd, type: number, source: input, description: "Original principal balance at origination", constraints: "> 0" }
      - { name: current_principal_balance_usd, type: number, source: input, description: "Stated principal balance; supplied at creation, thereafter server-maintained (reduced only by calculations.liquidation_proceeds_waterfall step 5)", constraints: ">= 0" }
      - { name: accrued_unpaid_interest_usd, type: number, source: input, default: 0, description: "Accrued but unpaid note interest; supplied at creation, thereafter server-maintained (reduced only by waterfall step 4)", constraints: ">= 0" }
      - { name: note_rate_pct, type: number, source: input, description: "Contract interest rate in percent" }
      - { name: monthly_debt_service_usd, type: number, source: input, description: "Scheduled monthly principal-and-interest payment; the unreduced P&I advance obligation" }
      - { name: maturity_date, type: datetime, source: input, description: "Stated maturity date (ISO 8601 UTC)" }
      - { name: securitization_value_usd, type: number, source: input, description: "Appraised value at securitization, retained for reporting" }
      - { name: servicing_status, type: enum, source: system, default: MASTER_SERVICING, description: "Servicing dimension; evolves independently of payment_status", constraints: "MASTER_SERVICING | SPECIAL_SERVICING | IN_WORKOUT | CORRECTED | REO | LIQUIDATED | WRITTEN_OFF" }
      - { name: payment_status, type: enum, source: system, default: CURRENT, description: "Payment dimension; evolves independently of servicing_status", constraints: "CURRENT | DELINQUENT_30 | DELINQUENT_60 | DELINQUENT_90_PLUS | MATURED_UNPAID | PAID_OFF" }
      - { name: consecutive_timely_payments, type: integer, source: computed, default: 0, description: "Incremented by one on each POST /loans/{id}/payment-status with to_status == CURRENT and timely_payment_recorded == true; reset to 0 on any transition to a DELINQUENT_* or MATURED_UNPAID state" }
      - { name: transferred_to_special_on, type: datetime, source: computed, description: "Logical-clock instant at which servicing_status became SPECIAL_SERVICING (most recent transfer); null before the first transfer" }
      - { name: transfer_event_code, type: enum, source: computed, description: "event_code of the ServicingTransferEvent consumed by the most recent transfer; null before the first transfer", constraints: "MONETARY_DEFAULT_60D | IMMINENT_DEFAULT | MATURITY_DEFAULT | BANKRUPTCY | RECEIVERSHIP | OTHER_MATERIAL_DEFAULT" }
      - { name: asset_business_plan_due_date, type: datetime, source: computed, description: "= transferred_to_special_on + 60 calendar days; the PSA deadline for the asset business plan" }
      - { name: last_appraised_value_usd, type: number, source: computed, description: "value_usd of the single Appraisal with loan_id == this Loan.id AND status == ACCEPTED; null when none" }
      - { name: ara_amount_usd, type: number, source: computed, default: 0, description: "ara_amount_usd of the single AppraisalReduction with loan_id == this Loan.id AND status == EFFECTIVE; 0.00 when none" }
      - { name: required_monthly_pi_advance_usd, type: number, source: computed, description: "Output of calculations.ara_adjusted_advance_obligation; equals monthly_debt_service_usd while ara_amount_usd == 0" }
      - { name: advances_outstanding_usd, type: number, source: computed, default: 0, description: "Sum of (Advance.amount_usd - Advance.reimbursed_principal_usd) for Advances with loan_id == this Loan.id AND status IN {OUTSTANDING, PARTIALLY_REIMBURSED}" }
      - { name: fees_payable_usd, type: number, source: computed, default: 0, description: "Sum of FeeAccrual.amount_usd for FeeAccruals with loan_id == this Loan.id AND status == ACCRUED" }
      - { name: realized_loss_usd, type: number, source: computed, default: 0, description: "Loan-level realized loss written by waterfall step 6; contributes to Trust.realized_loss_usd" }
      - { name: active_workout_plan_id, type: string, source: computed, description: "FK -> WorkoutPlan.id; the single WorkoutPlan on this loan whose status is NOT IN {EXECUTED, ABANDONED, SUPERSEDED}; null when none" }
      - { name: correction_source_plan_id, type: string, source: computed, description: "FK -> WorkoutPlan.id; the EXECUTED MODIFICATION plan that corrected this loan; null until servicing_status becomes CORRECTED" }
      - { name: appraisal_required, type: boolean, source: computed, default: false, description: "Set true when payment_status becomes DELINQUENT_90_PLUS; cleared when an Appraisal on this loan reaches ACCEPTED" }
      - { name: is_modified, type: boolean, source: computed, default: false, description: "Set true when a MODIFICATION workout plan is EXECUTED against this loan" }

  - name: ServicingTransferEvent
    parent: Loan
    common_fields: false
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan the transfer event was recorded against" }
      - { name: event_code, type: enum, source: input, description: "Defined servicing transfer event", constraints: "MONETARY_DEFAULT_60D | IMMINENT_DEFAULT | MATURITY_DEFAULT | BANKRUPTCY | RECEIVERSHIP | OTHER_MATERIAL_DEFAULT" }
      - { name: occurred_on, type: datetime, source: input, description: "Date the event occurred (ISO 8601 UTC)" }
      - { name: evidence_note, type: string, source: input, description: "Free-text evidence retained for the servicing file" }
      - { name: days_delinquent_at_event, type: integer, source: input, default: 0, description: "Days of monetary delinquency as of occurred_on; only consulted for event_code == MONETARY_DEFAULT_60D", constraints: ">= 0" }
      - { name: imminent_default_certified, type: boolean, source: input, default: false, description: "Master servicer certification that default is imminent; only consulted for event_code == IMMINENT_DEFAULT" }
      - { name: triggers_transfer, type: boolean, source: computed, description: "Output of calculations.transfer_event_qualification; true when this event alone compels transfer to special servicing" }
      - { name: consumed_by_transfer, type: boolean, source: computed, default: false, description: "Set true when POST /loans/{id}/servicing-status with to_status == SPECIAL_SERVICING consumes this event; a consumed event can never justify a second transfer" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the operator that recorded the event" }

  - name: BorrowerRequest
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan the borrower is asking relief on. Must equal X-User-ID when the caller's role is Borrower" }
      - { name: request_type, type: enum, source: input, description: "Kind of borrower consent being sought", constraints: "MODIFICATION | ASSUMPTION | LEASE_APPROVAL" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "Intake workflow state", constraints: "SUBMITTED | UNDER_ANALYSIS | INFO_REQUESTED | RECOMMENDED | CONSULTATION_PENDING | APPROVED | DENIED | WITHDRAWN" }
      - { name: processing_fee_deposit_usd, type: number, source: input, description: "Non-refundable processing deposit wired with the request; floor depends on request_type per calculations.request_deposit_floor", constraints: ">= 0" }
      - { name: requested_terms_note, type: string, source: input, description: "Borrower's narrative description of the relief requested" }
      - { name: proposed_rate_pct, type: number, source: input, description: "Requested note rate for request_type == MODIFICATION; null otherwise" }
      - { name: proposed_maturity_date, type: datetime, source: input, description: "Requested extended maturity for request_type == MODIFICATION; null otherwise" }
      - { name: assumption_buyer_name, type: string, source: input, description: "Proposed transferee for request_type == ASSUMPTION; null otherwise" }
      - { name: suite_code, type: string, source: input, description: "Rentable suite identifier for request_type == LEASE_APPROVAL; the (loan_id, suite_code) pair is the occupancy resource guarded by validations[priority=17]; null otherwise" }
      - { name: lease_commencement_date, type: datetime, source: input, description: "First day of the proposed lease term (inclusive); null unless request_type == LEASE_APPROVAL" }
      - { name: lease_expiration_date, type: datetime, source: input, description: "Last day of the proposed lease term (INCLUSIVE — the term is a closed interval); null unless request_type == LEASE_APPROVAL" }
      - { name: lease_base_rent_annual_usd, type: number, source: input, description: "Annual base rent of the proposed lease; null unless request_type == LEASE_APPROVAL" }
      - { name: info_request_count, type: integer, source: computed, default: 0, description: "Number of completed UNDER_ANALYSIS -> INFO_REQUESTED loops; capped at 2 by validations[priority=21]" }
      - { name: npv_recovery_with_request_usd, type: number, source: input, description: "Net present value of trust recovery ASSUMING the request is granted; written by POST /borrower-requests/{id}/analysis" }
      - { name: npv_recovery_without_request_usd, type: number, source: input, description: "Net present value of trust recovery assuming the request is refused; written by the same analysis call" }
      - { name: analysis_discount_rate_pct, type: number, source: input, description: "Discount rate the analyst used; retained for the servicing file" }
      - { name: servicing_standard_margin_usd, type: number, source: computed, description: "= round(npv_recovery_with_request_usd - npv_recovery_without_request_usd, 2); null before the analysis call" }
      - { name: servicing_standard_conclusion, type: enum, source: computed, description: "Output of calculations.servicing_standard_analysis; null before the analysis call", constraints: "SERVICING_STANDARD_MET | SERVICING_STANDARD_NOT_MET" }
      - { name: decided_on, type: datetime, source: computed, description: "Logical-clock instant at which status became APPROVED or DENIED" }
      - { name: decided_by_user_id, type: string, source: computed, description: "X-User-ID of the committee officer that decided the request" }

  - name: Appraisal
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan whose collateral is being valued" }
      - { name: appraisal_type, type: enum, source: input, description: "FULL_NARRATIVE selects the NET_LIQUIDATION_BASIS variant of the ARA calculation; UPDATE and INTERNAL_VALUATION select GROSS_APPRAISED_BASIS", constraints: "FULL_NARRATIVE | UPDATE | INTERNAL_VALUATION" }
      - { name: ordered_on, type: datetime, source: input, description: "Date the engagement letter was issued" }
      - { name: appraiser_firm, type: string, source: input, description: "Name of the appraisal firm engaged" }
      - { name: valuation_valid_months, type: integer, source: input, default: 12, description: "Length of the coverage window in whole months; drives coverage_end_date", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "Appraisal lifecycle", constraints: "ORDERED | RECEIVED | ACCEPTED | REJECTED | SUPERSEDED | CANCELLED" }
      - { name: value_usd, type: number, source: input, description: "As-is value reported by the appraiser; supplied on the transition to RECEIVED", constraints: ">= 0" }
      - { name: as_of_date, type: datetime, source: input, description: "Valuation date; supplied on the transition to RECEIVED and equal to coverage_start_date" }
      - { name: estimated_liquidation_expenses_usd, type: number, source: input, description: "Appraiser's estimate of costs to liquidate; REQUIRED on the transition to RECEIVED when appraisal_type == FULL_NARRATIVE, forbidden otherwise", constraints: ">= 0" }
      - { name: coverage_start_date, type: datetime, source: computed, description: "= as_of_date; INCLUSIVE lower bound of the valuation coverage window" }
      - { name: coverage_end_date, type: datetime, source: computed, description: "= as_of_date + valuation_valid_months calendar months; EXCLUSIVE upper bound (the window is half-open [coverage_start_date, coverage_end_date))" }
      - { name: due_date, type: datetime, source: computed, description: "= ordered_on + 60 calendar days; the PSA turnaround deadline" }
      - { name: received_on, type: datetime, source: computed, description: "Logical-clock instant at which status became RECEIVED" }
      - { name: ordered_by_user_id, type: string, source: system, description: "X-User-ID that ordered the appraisal; barred from accepting it by validations[priority=10]" }
      - { name: accepted_by_user_id, type: string, source: computed, description: "X-User-ID that accepted the appraisal; null until ACCEPTED" }
      - { name: rejection_reason, type: string, source: input, description: "Narrative reason supplied on the transition to REJECTED" }

  - name: AppraisalReduction
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan the appraisal reduction is computed against" }
      - { name: appraisal_id, type: string, source: input, description: "FK -> Appraisal.id; the ACCEPTED appraisal whose value_usd drives the reduction" }
      - { name: calculation_basis, type: enum, source: computed, description: "Which variant of calculations.appraisal_reduction_amount produced ara_amount_usd", constraints: "GROSS_APPRAISED_BASIS | NET_LIQUIDATION_BASIS" }
      - { name: deficiency_base_usd, type: number, source: computed, description: "= round(loan.current_principal_balance_usd + outstanding advance principal + outstanding advance accrued interest + loan.accrued_unpaid_interest_usd, 2), frozen at calculated_on" }
      - { name: appraisal_credit_usd, type: number, source: computed, description: "The 90% appraisal credit; basis differs per calculation_basis" }
      - { name: ara_amount_usd, type: number, source: computed, description: "= max(0, round(deficiency_base_usd - appraisal_credit_usd, 2))" }
      - { name: ara_percentage, type: number, source: computed, description: "= round(ara_amount_usd / loan.current_principal_balance_usd * 100, 4)" }
      - { name: calculated_on, type: datetime, source: computed, description: "Logical-clock instant at which the reduction was computed (the appraisal ACCEPTED transition)" }
      - { name: status, type: enum, source: system, default: PROVISIONAL, description: "PROVISIONAL until the committee makes it effective; RECALCULATED when a newer reduction on the same loan becomes EFFECTIVE; REVERSED on committee reversal or on correction/liquidation of the loan", constraints: "PROVISIONAL | EFFECTIVE | RECALCULATED | REVERSED" }
      - { name: effective_on, type: datetime, source: computed, description: "Logical-clock instant at which status became EFFECTIVE" }
      - { name: made_effective_by_user_id, type: string, source: computed, description: "X-User-ID of the committee officer that made the reduction effective" }
      - { name: reversal_reason, type: string, source: input, description: "Narrative reason supplied on the transition to REVERSED" }
      - { name: advance_reduction_applies, type: boolean, source: computed, default: false, description: "true exactly while status == EFFECTIVE; while true the master servicer's P&I advance obligation is the ARA-adjusted figure in Loan.required_monthly_pi_advance_usd" }

  - name: Advance
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan the advance was made against" }
      - { name: advance_type, type: enum, source: input, description: "Kind of advance", constraints: "PI_ADVANCE | TAX_INSURANCE_ADVANCE | PROPERTY_PROTECTION_ADVANCE" }
      - { name: amount_usd, type: number, source: input, description: "Principal amount advanced from the servicer's own funds", constraints: "> 0" }
      - { name: advanced_on, type: datetime, source: input, description: "Date funds left the servicer; the start date of 30/360 interest accrual and the primary waterfall reimbursement sort key" }
      - { name: status, type: enum, source: system, default: OUTSTANDING, description: "Advance lifecycle", constraints: "OUTSTANDING | PARTIALLY_REIMBURSED | REIMBURSED | DEEMED_NONRECOVERABLE | REVERSED" }
      - { name: reimbursed_principal_usd, type: number, source: computed, default: 0, description: "Principal repaid out of liquidation proceeds by waterfall step 3" }
      - { name: reimbursed_interest_usd, type: number, source: computed, default: 0, description: "Advance interest repaid out of liquidation proceeds by waterfall step 3" }
      - { name: accrued_interest_usd, type: number, source: computed, default: 0, description: "Output of calculations.advance_interest_accrual measured from advanced_on to interest_accrued_through" }
      - { name: interest_accrued_through, type: datetime, source: computed, description: "Logical-clock instant the accrual was last measured to; refreshed on every read of the advance and on every ARA computation that includes it" }
      - { name: nonrecoverable_determined_on, type: datetime, source: computed, description: "Logical-clock instant at which the committee deemed the advance non-recoverable" }
      - { name: reversal_reason, type: string, source: input, description: "Narrative reason supplied on the transition to REVERSED or DEEMED_NONRECOVERABLE" }

  - name: WorkoutPlan
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan the workout is designed for" }
      - { name: discount_rate_pct, type: number, source: input, description: "Annual discount rate used by calculations.workout_alternative_npv", constraints: "> 0" }
      - { name: npv_basis, type: enum, source: input, default: CONTRACTUAL, description: "Selects the variant of calculations.workout_alternative_npv", constraints: "CONTRACTUAL | DELAY_STRESSED" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Workout workflow state; loops CONSULTATION -> OBJECTED -> DRAFT", constraints: "DRAFT | SCORED | RECOMMENDED | CONSULTATION | CONSENT_SATISFIED | OBJECTED | APPROVED | EXECUTED | ABANDONED | SUPERSEDED" }
      - { name: revision_round, type: integer, source: computed, default: 0, description: "Number of completed OBJECTED -> DRAFT loops; capped at 3 by validations[priority=22]" }
      - { name: recommended_alternative_id, type: string, source: computed, description: "FK -> WorkoutAlternative.id; the rank-1 alternative chosen by calculations.workout_alternative_ranking; null before scoring" }
      - { name: selected_alternative_id, type: string, source: computed, description: "FK -> WorkoutAlternative.id; the alternative the asset manager actually put forward on the RECOMMENDED transition; must equal recommended_alternative_id" }
      - { name: scored_on, type: datetime, source: computed, description: "Logical-clock instant of the most recent DRAFT -> SCORED transition" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the asset manager that created the plan; barred from approving it by validations[priority=10]" }
      - { name: approved_by_user_id, type: string, source: computed, description: "X-User-ID of the committee officer that approved the plan" }
      - { name: executed_on, type: datetime, source: computed, description: "Logical-clock instant at which status became EXECUTED" }
      - { name: consent_requirement, type: enum, source: computed, description: "Snapshot of the controlling class's rights taken when the consultation was issued; downgraded to CONSULTATION_ONLY if control terminates mid-consultation", constraints: "CONSENT_RIGHT | CONSULTATION_ONLY" }

  - name: WorkoutAlternative
    parent: WorkoutPlan
    common_fields: true
    fields:
      - { name: workout_plan_id, type: string, source: input, description: "FK -> WorkoutPlan.id; the plan this alternative belongs to" }
      - { name: supersedes_alternative_id, type: string, source: input, description: "FK -> WorkoutAlternative.id; a sibling alternative in the SAME plan that this one replaces; null when the alternative is original" }
      - { name: alternative_type, type: enum, source: input, description: "Workout strategy; also the rank tie-break ordinal (MODIFICATION=1, DEED_IN_LIEU=2, NOTE_SALE=3, FORECLOSURE=4)", constraints: "MODIFICATION | DEED_IN_LIEU | NOTE_SALE | FORECLOSURE" }
      - { name: projected_cash_flows, type: array, source: input, description: "Array of { period_index: integer >= 1, amount_usd: number >= 0 }; annual periods, at most one entry per period_index", constraints: "non-empty" }
      - { name: upfront_cost_usd, type: number, source: input, description: "Undiscounted period-zero cost of pursuing this alternative", constraints: ">= 0" }
      - { name: discounted_pv_usd, type: number, source: computed, description: "Sum of the per-period rounded discounted cash flows; null before scoring" }
      - { name: npv_usd, type: number, source: computed, description: "= round(discounted_pv_usd - upfront_cost_usd, 2); null before scoring" }
      - { name: rank, type: integer, source: computed, description: "1-based rank produced by calculations.workout_alternative_ranking; null before scoring and for superseded alternatives" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "Alternative lifecycle", constraints: "PROPOSED | SCORED | SUPERSEDED | SELECTED | DISCARDED" }

  - name: ConsultationRequest
    parent: Trust
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> Trust.id; the trust whose controlling class is being consulted. Must equal X-User-ID when the caller's role is ControllingClassRepresentative" }
      - { name: subject_type, type: enum, source: input, description: "Which nullable subject FK is populated: WORKOUT_PLAN requires workout_plan_id and forbids borrower_request_id; BORROWER_REQUEST requires borrower_request_id and forbids workout_plan_id", constraints: "WORKOUT_PLAN | BORROWER_REQUEST" }
      - { name: workout_plan_id, type: string, source: input, description: "FK -> WorkoutPlan.id; populated only when subject_type == WORKOUT_PLAN" }
      - { name: borrower_request_id, type: string, source: input, description: "FK -> BorrowerRequest.id; populated only when subject_type == BORROWER_REQUEST" }
      - { name: rights_type, type: enum, source: computed, description: "CONSENT_RIGHT when trust.control_status == CONTROLLING at issue; CONSULTATION_ONLY when CONSULTING_ONLY. Downgraded in place (never upgraded) when control terminates while status == PENDING", constraints: "CONSENT_RIGHT | CONSULTATION_ONLY" }
      - { name: issued_at, type: datetime, source: computed, description: "Logical-clock instant the consultation was issued" }
      - { name: deadline_at, type: datetime, source: computed, description: "Output of calculations.consultation_response_deadline; the last instant a response is accepted" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Consultation outcome", constraints: "PENDING | CONSENTED | OBJECTED | DEEMED_CONSENTED | WAIVED" }
      - { name: responded_at, type: datetime, source: computed, description: "Logical-clock instant the representative responded; null unless status IN {CONSENTED, OBJECTED}" }
      - { name: response_note, type: string, source: input, description: "Representative's narrative response" }
      - { name: responded_by_user_id, type: string, source: computed, description: "X-User-ID of the responding representative" }

  - name: REOAsset
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan whose collateral was taken into the trust's ownership" }
      - { name: source_workout_plan_id, type: string, source: input, description: "FK -> WorkoutPlan.id; the EXECUTED plan whose selected alternative_type is FORECLOSURE or DEED_IN_LIEU" }
      - { name: acquisition_type, type: enum, source: input, description: "How title was taken; must agree with the source plan's selected alternative_type", constraints: "FORECLOSURE | DEED_IN_LIEU" }
      - { name: acquired_on, type: datetime, source: input, description: "Date title vested in the trust" }
      - { name: remic_disposition_deadline, type: datetime, source: computed, description: "= acquired_on + 3 calendar years; a SOLD closing_date strictly after this instant is barred by validations[priority=15]" }
      - { name: status, type: enum, source: system, default: ACQUIRED, description: "REO lifecycle; UNDER_CONTRACT can fall back to MARKETED when a contract falls through", constraints: "ACQUIRED | STABILIZING | MARKETED | UNDER_CONTRACT | SOLD | WRITTEN_OFF" }
      - { name: initial_noi_annual_usd, type: number, source: input, description: "Annualized net operating income at acquisition, retained for the disposition plan" }
      - { name: list_price_usd, type: number, source: input, description: "Asking price; REQUIRED on the transition to MARKETED" }
      - { name: gross_sale_proceeds_usd, type: number, source: computed, description: "Gross proceeds recorded on the transition to SOLD; the base of the liquidation fee" }
      - { name: liquidation_expenses_usd, type: number, source: computed, description: "Closing costs recorded on the transition to SOLD" }
      - { name: closing_date, type: datetime, source: computed, description: "Sale closing date recorded on the transition to SOLD" }
      - { name: contract_fallthrough_count, type: integer, source: computed, default: 0, description: "Number of completed UNDER_CONTRACT -> MARKETED loops" }

  - name: FeeAccrual
    parent: Loan
    common_fields: true
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan the fee is charged against" }
      - { name: fee_type, type: enum, source: input, description: "Fee being accrued", constraints: "SPECIAL_SERVICING_FEE | WORKOUT_FEE | LIQUIDATION_FEE" }
      - { name: period_start, type: datetime, source: input, description: "INCLUSIVE first day of the accrual period; REQUIRED for fee_type == SPECIAL_SERVICING_FEE, forbidden otherwise" }
      - { name: period_end, type: datetime, source: input, description: "INCLUSIVE last day of the accrual period (the period is a CLOSED interval); REQUIRED for fee_type == SPECIAL_SERVICING_FEE, forbidden otherwise" }
      - { name: collection_amount_usd, type: number, source: input, description: "Collection the percentage fee is applied to; REQUIRED for fee_type == WORKOUT_FEE, forbidden otherwise (LIQUIDATION_FEE accruals are created only by the waterfall)", constraints: ">= 0" }
      - { name: basis_amount_usd, type: number, source: computed, description: "The amount the rate was applied to; see calculations.special_servicing_fee_accrual / workout_fee_accrual / liquidation_proceeds_waterfall step 1" }
      - { name: rate_pct, type: number, source: computed, description: "The trust-level rate snapshot actually used (annual/12 for SPECIAL_SERVICING_FEE)" }
      - { name: amount_usd, type: number, source: computed, description: "The accrued fee in dollars" }
      - { name: status, type: enum, source: system, default: ACCRUED, description: "Fee lifecycle", constraints: "ACCRUED | COLLECTED | WAIVED" }
      - { name: accrued_by_user_id, type: string, source: system, description: "X-User-ID that created the accrual; barred from waiving it by validations[priority=10]. 'system' for waterfall-created LIQUIDATION_FEE accruals" }
      - { name: collected_on, type: datetime, source: computed, description: "Logical-clock instant at which status became COLLECTED" }
      - { name: waived_reason, type: string, source: input, description: "Narrative reason supplied on the transition to WAIVED" }

  - name: DistributionReport
    parent: Trust
    common_fields: true
    fields:
      - { name: trust_id, type: string, source: input, description: "FK -> Trust.id; the trust being reported on" }
      - { name: report_type, type: enum, source: input, description: "CREFC-style report being produced", constraints: "DELINQUENT_LOAN_STATUS | REO_STATUS | FINAL_ASSET_DISPOSITION" }
      - { name: period_end, type: datetime, source: input, description: "Last day of the reporting period" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Report lifecycle", constraints: "DRAFT | CERTIFIED | DISTRIBUTED | VOID" }
      - { name: loans_in_special_count, type: integer, source: computed, description: "Snapshot of trust.loans_in_special_servicing_count taken at creation" }
      - { name: total_ara_snapshot_usd, type: number, source: computed, description: "Snapshot of trust.total_ara_usd taken at creation" }
      - { name: total_advances_outstanding_snapshot_usd, type: number, source: computed, description: "Snapshot of trust.total_advances_outstanding_usd taken at creation" }
      - { name: realized_loss_snapshot_usd, type: number, source: computed, description: "Snapshot of trust.realized_loss_usd taken at creation" }
      - { name: control_status_snapshot, type: enum, source: computed, description: "Snapshot of trust.control_status taken at creation", constraints: "CONTROLLING | CONSULTING_ONLY" }
      - { name: recipients, type: array, source: input, description: "Distribution list supplied on the transition to DISTRIBUTED; non-empty subset of [TRUSTEE, RATING_AGENCIES, CERTIFICATE_HOLDERS, CONTROLLING_CLASS_REPRESENTATIVE]" }
      - { name: certified_by_user_id, type: string, source: computed, description: "X-User-ID of the trustee that certified the report" }
      - { name: distributed_at, type: datetime, source: computed, description: "Logical-clock instant at which status became DISTRIBUTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ---------------------------------------------------------------------------
  # Loan carries TWO independent status dimensions on one row. Neither dimension
  # gates the other's transitions except where a precondition says so explicitly.
  # ---------------------------------------------------------------------------
  - entity: Loan
    dimension: servicing_status
    initial_state: MASTER_SERVICING
    terminal_states: [LIQUIDATED, WRITTEN_OFF]
    transitions:
      - from: MASTER_SERVICING
        to: SPECIAL_SERVICING
        trigger: "POST /special-servicing/loans/{id}/servicing-status with to_status = SPECIAL_SERVICING"
        actor: MasterServicer
        preconditions:
          - "loan.servicing_status == MASTER_SERVICING"
          - "at least one ServicingTransferEvent exists with loan_id == loan.id AND triggers_transfer == true AND consumed_by_transfer == false (else ERR_NO_QUALIFYING_TRANSFER_EVENT)"
          - "caller role is MasterServicer (any other role in the endpoint's role list gets ERR_ROLE_NOT_PERMITTED_FOR_STATUS)"
        side_effects:
          - "the qualifying ServicingTransferEvent with the earliest (occurred_on ASC, created_at ASC) among those with triggers_transfer == true AND consumed_by_transfer == false is marked consumed_by_transfer = true"
          - "loan.transfer_event_code := that event's event_code"
          - "loan.transferred_to_special_on := current logical clock"
          - "loan.asset_business_plan_due_date := transferred_to_special_on + 60 calendar days"
          - "trust.loans_in_special_servicing_count recomputed"
          - "increments Loan.version by 1 and Trust.version by 1"
        note: "Re-entrant: a corrected loan that returns to MASTER_SERVICING may be transferred again on a NEW unconsumed qualifying event."
      - from: SPECIAL_SERVICING
        to: IN_WORKOUT
        trigger: "POST /special-servicing/workout-plans (system-driven side effect of plan creation)"
        actor: system
        preconditions:
          - "loan.servicing_status == SPECIAL_SERVICING"
        side_effects:
          - "loan.active_workout_plan_id := the new WorkoutPlan.id"
          - "any pre-existing WorkoutPlan on this loan whose status IN {DRAFT, SCORED} transitions to SUPERSEDED"
          - "increments Loan.version by 1"
        note: "IN_WORKOUT is a system-only target; a direct POST .../servicing-status with to_status = IN_WORKOUT is rejected with ERR_ROLE_NOT_PERMITTED_FOR_STATUS for every role."
      - from: IN_WORKOUT
        to: CORRECTED
        trigger: "POST /special-servicing/loans/{id}/servicing-status with to_status = CORRECTED"
        actor: SpecialServicingCommitteeOfficer
        preconditions:
          - "loan.servicing_status == IN_WORKOUT"
          - "loan.active_workout_plan_id is not null AND that plan's status == EXECUTED AND the plan's selected alternative_type == MODIFICATION (else ERR_ALTERNATIVE_TYPE_MISMATCH)"
          - "loan.payment_status == CURRENT (cross-dimension guard; else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "loan.correction_source_plan_id := loan.active_workout_plan_id"
          - "loan.active_workout_plan_id := null"
          - "CASCADE link 1: the AppraisalReduction on this loan with status == EFFECTIVE (if any) transitions to REVERSED with reversal_reason = 'loan corrected'"
          - "CASCADE link 2: caused by link 1 — trust.total_ara_usd is recomputed and calculations.controlling_class_control_test re-runs, which may flip trust.control_status back to CONTROLLING"
          - "trust.loans_in_special_servicing_count recomputed"
          - "increments Loan.version by 1 and Trust.version by 1"
      - from: CORRECTED
        to: MASTER_SERVICING
        trigger: "POST /special-servicing/loans/{id}/servicing-status with to_status = MASTER_SERVICING"
        actor: SpecialServicerAssetManager
        preconditions:
          - "loan.servicing_status == CORRECTED"
          - "loan.consecutive_timely_payments >= 3 (else ERR_INSUFFICIENT_TIMELY_PAYMENTS)"
        side_effects:
          - "loan becomes eligible for WORKOUT_FEE accruals (validations[priority=29] requires servicing_status == MASTER_SERVICING AND correction_source_plan_id is not null)"
          - "trust.loans_in_special_servicing_count recomputed"
          - "increments Loan.version by 1 and Trust.version by 1"
        note: "Closes the cycle MASTER_SERVICING -> SPECIAL_SERVICING -> IN_WORKOUT -> CORRECTED -> MASTER_SERVICING."
      - from: IN_WORKOUT
        to: REO
        trigger: "POST /special-servicing/reo-assets (system-driven side effect of REO acquisition)"
        actor: system
        preconditions:
          - "loan.servicing_status == IN_WORKOUT"
          - "the referenced source_workout_plan_id has status == EXECUTED AND its selected alternative_type IN {FORECLOSURE, DEED_IN_LIEU} that equals the request's acquisition_type (else ERR_ALTERNATIVE_TYPE_MISMATCH)"
        side_effects:
          - "loan.active_workout_plan_id := null"
          - "increments Loan.version by 1"
      - from: IN_WORKOUT
        to: LIQUIDATED
        trigger: "POST /special-servicing/loans/{id}/servicing-status with to_status = LIQUIDATED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "loan.servicing_status == IN_WORKOUT"
          - "loan.active_workout_plan_id is not null AND that plan's status == EXECUTED AND the plan's selected alternative_type == NOTE_SALE (else ERR_ALTERNATIVE_TYPE_MISMATCH)"
          - "gross_proceeds_usd, liquidation_expenses_usd and closing_date are all present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "calculations.liquidation_proceeds_waterfall runs on (gross_proceeds_usd, liquidation_expenses_usd); see the REOAsset UNDER_CONTRACT -> SOLD transition for the full seven-step cascade, which is identical"
          - "increments Loan.version by 1 and Trust.version by 1"
      - from: REO
        to: LIQUIDATED
        trigger: "POST /special-servicing/reo-assets/{id}/status with to_status = SOLD (system-driven side effect)"
        actor: system
        preconditions:
          - "loan.servicing_status == REO"
        side_effects:
          - "see the REOAsset UNDER_CONTRACT -> SOLD transition"
      - from: REO
        to: WRITTEN_OFF
        trigger: "POST /special-servicing/reo-assets/{id}/status with to_status = WRITTEN_OFF (system-driven side effect)"
        actor: system
        preconditions:
          - "loan.servicing_status == REO"
        side_effects:
          - "loan.realized_loss_usd := round(loan.current_principal_balance_usd + loan.advances_outstanding_usd, 2); loan.current_principal_balance_usd := 0"
          - "trust.realized_loss_usd recomputed; control test re-runs"
          - "every Advance on the loan with status IN {OUTSTANDING, PARTIALLY_REIMBURSED} transitions to DEEMED_NONRECOVERABLE"
          - "increments Loan.version by 1 and Trust.version by 1"

  - entity: Loan
    dimension: payment_status
    initial_state: CURRENT
    terminal_states: [PAID_OFF]
    transitions:
      - from: CURRENT
        to: DELINQUENT_30
        trigger: "POST /special-servicing/loans/{id}/payment-status with to_status = DELINQUENT_30"
        actor: MasterServicer
        preconditions: ["loan.payment_status == CURRENT"]
        side_effects: ["loan.consecutive_timely_payments := 0", "increments Loan.version by 1"]
      - from: DELINQUENT_30
        to: DELINQUENT_60
        trigger: "POST /special-servicing/loans/{id}/payment-status with to_status = DELINQUENT_60"
        actor: MasterServicer
        preconditions: ["loan.payment_status == DELINQUENT_30"]
        side_effects:
          - "loan.consecutive_timely_payments := 0"
          - "CASCADE link 1: a ServicingTransferEvent is auto-recorded with event_code = MONETARY_DEFAULT_60D, occurred_on = the request's as_of_date, days_delinquent_at_event = 60, evidence_note = 'auto-recorded on 60-day monetary delinquency', recorded_by_user_id = X-User-ID"
          - "CASCADE link 2: caused by link 1 — calculations.transfer_event_qualification sets that event's triggers_transfer = true, which makes the loan eligible for MASTER_SERVICING -> SPECIAL_SERVICING"
          - "increments Loan.version by 1"
      - from: DELINQUENT_60
        to: DELINQUENT_90_PLUS
        trigger: "POST /special-servicing/loans/{id}/payment-status with to_status = DELINQUENT_90_PLUS"
        actor: MasterServicer
        preconditions: ["loan.payment_status == DELINQUENT_60"]
        side_effects:
          - "loan.consecutive_timely_payments := 0"
          - "loan.appraisal_required := true"
          - "increments Loan.version by 1"
      - from: DELINQUENT_30
        to: CURRENT
        trigger: "POST /special-servicing/loans/{id}/payment-status with to_status = CURRENT"
        actor: MasterServicer
        preconditions: ["loan.payment_status IN {DELINQUENT_30, DELINQUENT_60, DELINQUENT_90_PLUS, MATURED_UNPAID}"]
        side_effects:
          - "loan.consecutive_timely_payments := consecutive_timely_payments + 1 when timely_payment_recorded == true, else 0"
          - "increments Loan.version by 1"
        note: "The cure edge is defined once and is legal from every DELINQUENT_* state and from MATURED_UNPAID — the payment dimension is cyclic."
      - from: CURRENT
        to: CURRENT
        trigger: "POST /special-servicing/loans/{id}/payment-status with to_status = CURRENT and timely_payment_recorded = true"
        actor: MasterServicer
        preconditions: ["loan.payment_status == CURRENT"]
        side_effects:
          - "loan.consecutive_timely_payments := consecutive_timely_payments + 1"
          - "increments Loan.version by 1"
        note: "Self-loop used to accumulate the three timely payments the CORRECTED -> MASTER_SERVICING transition requires."
      - from: CURRENT
        to: MATURED_UNPAID
        trigger: "POST /special-servicing/loans/{id}/payment-status with to_status = MATURED_UNPAID"
        actor: MasterServicer
        preconditions:
          - "loan.payment_status IN {CURRENT, DELINQUENT_30, DELINQUENT_60, DELINQUENT_90_PLUS}"
          - "the request's as_of_date >= loan.maturity_date"
          - "loan.current_principal_balance_usd > 0"
        side_effects:
          - "loan.consecutive_timely_payments := 0"
          - "CASCADE link 1: a ServicingTransferEvent is auto-recorded with event_code = MATURITY_DEFAULT, occurred_on = as_of_date, evidence_note = 'auto-recorded on maturity default'"
          - "CASCADE link 2: caused by link 1 — triggers_transfer = true, making the loan eligible for transfer"
          - "increments Loan.version by 1"
      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /special-servicing/loans/{id}/payment-status with to_status = PAID_OFF"
        actor: MasterServicer
        preconditions:
          - "loan.payment_status != PAID_OFF"
          - "loan.current_principal_balance_usd == 0 AND loan.accrued_unpaid_interest_usd == 0"
        side_effects: ["increments Loan.version by 1"]

  - entity: Trust
    dimension: control_status
    initial_state: CONTROLLING
    terminal_states: []
    transitions:
      - from: CONTROLLING
        to: CONSULTING_ONLY
        trigger: "system re-run of calculations.controlling_class_control_test after any change to trust.total_ara_usd or trust.realized_loss_usd"
        actor: system
        preconditions:
          - "controlling_class_notional_usd < round(0.25 * original_controlling_class_balance_usd, 2) (STRICT less-than)"
        side_effects:
          - "CASCADE: every ConsultationRequest with trust_id == trust.id AND status == PENDING AND rights_type == CONSENT_RIGHT has rights_type := CONSULTATION_ONLY and status := WAIVED, processed in (deadline_at ASC, created_at ASC) order"
          - "CASCADE (caused by the previous link): for each such consultation whose subject_type == WORKOUT_PLAN, the subject WorkoutPlan in status CONSULTATION transitions to CONSENT_SATISFIED with consent_requirement := CONSULTATION_ONLY"
          - "CASCADE (caused by the previous link): for each such consultation whose subject_type == BORROWER_REQUEST, the subject BorrowerRequest in status CONSULTATION_PENDING stays CONSULTATION_PENDING but becomes decidable (validations[priority=13] is satisfied by status == WAIVED)"
          - "increments Trust.version by 1"
      - from: CONSULTING_ONLY
        to: CONTROLLING
        trigger: "system re-run of calculations.controlling_class_control_test after an EFFECTIVE AppraisalReduction is REVERSED or RECALCULATED downward"
        actor: system
        preconditions:
          - "controlling_class_notional_usd >= round(0.25 * original_controlling_class_balance_usd, 2)"
        side_effects:
          - "future ConsultationRequests are issued with rights_type = CONSENT_RIGHT"
          - "already-WAIVED consultations are NOT restored to PENDING and already-downgraded rights_type values are NOT upgraded"
          - "increments Trust.version by 1"
        note: "Trust.control_status is cyclic: control terminates on valuation deterioration and is restored on reversal, but the consultation-level downgrade is one-way."

  - entity: BorrowerRequest
    dimension: status
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_ANALYSIS
        trigger: "POST /special-servicing/borrower-requests/{id}/status with to_status = UNDER_ANALYSIS"
        actor: SpecialServicerAssetManager
        preconditions: ["borrower_request.status IN {SUBMITTED, INFO_REQUESTED}"]
        side_effects: ["increments BorrowerRequest.version by 1"]
      - from: UNDER_ANALYSIS
        to: INFO_REQUESTED
        trigger: "POST /special-servicing/borrower-requests/{id}/status with to_status = INFO_REQUESTED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "borrower_request.status == UNDER_ANALYSIS"
          - "borrower_request.info_request_count < 2 (else ERR_INFO_REQUEST_LIMIT_EXCEEDED)"
        side_effects:
          - "borrower_request.info_request_count := info_request_count + 1"
          - "borrower_request.servicing_standard_margin_usd := null and servicing_standard_conclusion := null (any prior analysis is invalidated)"
          - "increments BorrowerRequest.version by 1"
        note: "INFO_REQUESTED -> UNDER_ANALYSIS closes the cycle; the third attempt at INFO_REQUESTED is rejected because info_request_count has reached 2."
      - from: UNDER_ANALYSIS
        to: RECOMMENDED
        trigger: "POST /special-servicing/borrower-requests/{id}/status with to_status = RECOMMENDED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "borrower_request.status == UNDER_ANALYSIS"
          - "borrower_request.servicing_standard_conclusion == SERVICING_STANDARD_MET (else ERR_SERVICING_STANDARD_VIOLATION)"
          - "an Appraisal exists with loan_id == borrower_request.loan_id AND status == ACCEPTED AND coverage_start_date <= now < coverage_end_date (else ERR_STALE_APPRAISAL)"
        side_effects: ["increments BorrowerRequest.version by 1"]
      - from: RECOMMENDED
        to: CONSULTATION_PENDING
        trigger: "POST /special-servicing/consultations with subject_type = BORROWER_REQUEST (system-driven side effect of consultation issue)"
        actor: system
        preconditions: ["borrower_request.status == RECOMMENDED"]
        side_effects: ["increments BorrowerRequest.version by 1"]
      - from: CONSULTATION_PENDING
        to: APPROVED
        trigger: "POST /special-servicing/borrower-requests/{id}/status with to_status = APPROVED"
        actor: SpecialServicingCommitteeOfficer
        preconditions:
          - "borrower_request.status == CONSULTATION_PENDING"
          - "the ConsultationRequest whose borrower_request_id == this request has status IN {CONSENTED, DEEMED_CONSENTED, WAIVED} when its rights_type == CONSENT_RIGHT, or any non-PENDING status when rights_type == CONSULTATION_ONLY (else ERR_CONSULTATION_NOT_SATISFIED)"
          - "for request_type == LEASE_APPROVAL, no other APPROVED BorrowerRequest on the same (loan_id, suite_code) has an overlapping closed lease term (else ERR_LEASE_TERM_OVERLAP)"
        side_effects:
          - "borrower_request.decided_on := current logical clock; decided_by_user_id := X-User-ID"
          - "for request_type == MODIFICATION, loan.is_modified := true"
          - "increments BorrowerRequest.version by 1"
      - from: CONSULTATION_PENDING
        to: DENIED
        trigger: "POST /special-servicing/borrower-requests/{id}/status with to_status = DENIED"
        actor: SpecialServicingCommitteeOfficer
        preconditions:
          - "borrower_request.status IN {UNDER_ANALYSIS, RECOMMENDED, CONSULTATION_PENDING}"
        side_effects:
          - "borrower_request.decided_on := current logical clock; decided_by_user_id := X-User-ID"
          - "increments BorrowerRequest.version by 1"
        note: "Denial short-circuits the ladder and is legal from any of the three live analysis states."
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /special-servicing/borrower-requests/{id}/status with to_status = WITHDRAWN"
        actor: Borrower
        preconditions:
          - "borrower_request.status IN {SUBMITTED, UNDER_ANALYSIS, INFO_REQUESTED}"
          - "X-User-ID == borrower_request.loan_id (else ERR_NOT_RESOURCE_OWNER)"
        side_effects:
          - "the processing deposit is NOT refunded (processing_fee_deposit_usd is untouched)"
          - "increments BorrowerRequest.version by 1"

  - entity: Appraisal
    dimension: status
    initial_state: ORDERED
    terminal_states: [REJECTED, SUPERSEDED, CANCELLED]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /special-servicing/appraisals/{id}/status with to_status = RECEIVED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "appraisal.status == ORDERED"
          - "value_usd and as_of_date are present in the request body (else ERR_INVALID_REQUEST)"
          - "estimated_liquidation_expenses_usd is present when appraisal_type == FULL_NARRATIVE and absent otherwise (else ERR_INVALID_REQUEST)"
          - "as_of_date >= appraisal.ordered_on (else ERR_INVALID_REQUEST)"
          - "no OTHER Appraisal on the same loan_id with status IN {RECEIVED, ACCEPTED} has a coverage window that overlaps the half-open window [as_of_date, as_of_date + valuation_valid_months) (else ERR_APPRAISAL_WINDOW_OVERLAP)"
        side_effects:
          - "appraisal.value_usd, as_of_date and (when applicable) estimated_liquidation_expenses_usd are stored"
          - "appraisal.coverage_start_date := as_of_date; coverage_end_date := as_of_date + valuation_valid_months calendar months"
          - "appraisal.received_on := current logical clock"
          - "increments Appraisal.version by 1"
      - from: RECEIVED
        to: ACCEPTED
        trigger: "POST /special-servicing/appraisals/{id}/status with to_status = ACCEPTED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "appraisal.status == RECEIVED"
          - "X-User-ID != appraisal.ordered_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "appraisal.accepted_by_user_id := X-User-ID"
          - "CASCADE link 1: any OTHER Appraisal on the same loan_id with status == ACCEPTED transitions to SUPERSEDED"
          - "CASCADE link 2: caused by link 1 — the AppraisalReduction pointing at the superseded appraisal, if status == EFFECTIVE, transitions to RECALCULATED"
          - "CASCADE link 3: a NEW AppraisalReduction is auto-created in status PROVISIONAL with loan_id = appraisal.loan_id, appraisal_id = appraisal.id, and every computed field filled by calculations.appraisal_reduction_amount (the calculation_basis is chosen from appraisal_type)"
          - "loan.last_appraised_value_usd := appraisal.value_usd; loan.appraisal_required := false"
          - "increments Appraisal.version by 1 and Loan.version by 1"
        note: "The new reduction is PROVISIONAL, so trust.total_ara_usd is NOT yet affected — that happens on PROVISIONAL -> EFFECTIVE."
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /special-servicing/appraisals/{id}/status with to_status = REJECTED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "appraisal.status == RECEIVED"
          - "rejection_reason is present in the request body (else ERR_INVALID_REQUEST)"
          - "X-User-ID != appraisal.ordered_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "the coverage window is released: a later appraisal may occupy the same window without ERR_APPRAISAL_WINDOW_OVERLAP"
          - "no AppraisalReduction is created; loan.appraisal_required is NOT cleared"
          - "increments Appraisal.version by 1"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /special-servicing/appraisals/{id}/status with to_status = CANCELLED"
        actor: SpecialServicerAssetManager
        preconditions: ["appraisal.status == ORDERED"]
        side_effects: ["increments Appraisal.version by 1"]

  - entity: AppraisalReduction
    dimension: status
    initial_state: PROVISIONAL
    terminal_states: [RECALCULATED, REVERSED]
    transitions:
      - from: PROVISIONAL
        to: EFFECTIVE
        trigger: "POST /special-servicing/appraisal-reductions/{id}/status with to_status = EFFECTIVE"
        actor: SpecialServicingCommitteeOfficer
        preconditions:
          - "appraisal_reduction.status == PROVISIONAL"
          - "the referenced Appraisal still has status == ACCEPTED (else ERR_INVALID_STATE_TRANSITION)"
          - "no OTHER AppraisalReduction on the same loan_id has status == EFFECTIVE (else ERR_INVALID_STATE_TRANSITION)"
        side_effects:
          - "appraisal_reduction.effective_on := current logical clock; made_effective_by_user_id := X-User-ID; advance_reduction_applies := true"
          - "CASCADE link 1: loan.ara_amount_usd := appraisal_reduction.ara_amount_usd, and loan.required_monthly_pi_advance_usd is recomputed by calculations.ara_adjusted_advance_obligation"
          - "CASCADE link 2: caused by link 1 — trust.total_ara_usd is recomputed, which recomputes trust.controlling_class_notional_usd"
          - "CASCADE link 3: caused by link 2 — calculations.controlling_class_control_test re-runs and may set trust.control_status := CONSULTING_ONLY"
          - "CASCADE link 4: caused by link 3 — every PENDING CONSENT_RIGHT ConsultationRequest on the trust is downgraded to CONSULTATION_ONLY / WAIVED, and each WORKOUT_PLAN subject in status CONSULTATION advances to CONSENT_SATISFIED"
          - "increments AppraisalReduction.version by 1, Loan.version by 1 and Trust.version by 1"
      - from: EFFECTIVE
        to: RECALCULATED
        trigger: "a newer Appraisal on the same loan reaches ACCEPTED (system-driven)"
        actor: system
        preconditions: ["appraisal_reduction.status == EFFECTIVE"]
        side_effects:
          - "appraisal_reduction.advance_reduction_applies := false"
          - "trust.total_ara_usd is recomputed; the control test re-runs"
          - "increments AppraisalReduction.version by 1 and Trust.version by 1"
      - from: EFFECTIVE
        to: REVERSED
        trigger: "POST /special-servicing/appraisal-reductions/{id}/status with to_status = REVERSED"
        actor: SpecialServicingCommitteeOfficer
        preconditions:
          - "appraisal_reduction.status IN {PROVISIONAL, EFFECTIVE}"
          - "reversal_reason is present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "COMPENSATION: appraisal_reduction.advance_reduction_applies := false; loan.ara_amount_usd := 0 (or the ara_amount_usd of another EFFECTIVE reduction if one exists, which cannot happen); loan.required_monthly_pi_advance_usd is restored to monthly_debt_service_usd"
          - "COMPENSATION: trust.total_ara_usd returns to exactly the value it held before this reduction became effective; controlling_class_notional_usd and control_status are recomputed from that restored total, so CONSULTING_ONLY may return to CONTROLLING"
          - "already-WAIVED ConsultationRequests are NOT restored to PENDING (the downgrade is deliberately not compensated)"
          - "increments AppraisalReduction.version by 1, Loan.version by 1 and Trust.version by 1"

  - entity: Advance
    dimension: status
    initial_state: OUTSTANDING
    terminal_states: [REIMBURSED, DEEMED_NONRECOVERABLE, REVERSED]
    transitions:
      - from: OUTSTANDING
        to: PARTIALLY_REIMBURSED
        trigger: "calculations.liquidation_proceeds_waterfall step 3 leaves available proceeds short of interest + full principal (system-driven)"
        actor: system
        preconditions: ["advance.status IN {OUTSTANDING, PARTIALLY_REIMBURSED}", "the proceeds allocated to this advance are > 0 but < accrued_interest_usd + (amount_usd - reimbursed_principal_usd)"]
        side_effects:
          - "advance.reimbursed_interest_usd and reimbursed_principal_usd are increased by the allocated amounts (interest is paid before principal)"
          - "loan.advances_outstanding_usd and trust.total_advances_outstanding_usd are recomputed"
          - "increments Advance.version by 1, Loan.version by 1 and Trust.version by 1"
      - from: OUTSTANDING
        to: REIMBURSED
        trigger: "calculations.liquidation_proceeds_waterfall step 3 fully covers interest + remaining principal (system-driven)"
        actor: system
        preconditions: ["advance.status IN {OUTSTANDING, PARTIALLY_REIMBURSED}"]
        side_effects:
          - "advance.reimbursed_principal_usd := amount_usd; reimbursed_interest_usd := accrued_interest_usd"
          - "loan.advances_outstanding_usd and trust.total_advances_outstanding_usd drop by the remaining principal"
          - "increments Advance.version by 1, Loan.version by 1 and Trust.version by 1"
      - from: OUTSTANDING
        to: DEEMED_NONRECOVERABLE
        trigger: "POST /special-servicing/advances/{id}/status with to_status = DEEMED_NONRECOVERABLE"
        actor: SpecialServicingCommitteeOfficer
        preconditions:
          - "advance.status IN {OUTSTANDING, PARTIALLY_REIMBURSED}"
          - "reversal_reason is present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "advance.nonrecoverable_determined_on := current logical clock"
          - "the unreimbursed principal leaves loan.advances_outstanding_usd and trust.total_advances_outstanding_usd but is NOT returned to the borrower's obligation"
          - "no further advance of any type may be created on this loan (validations[priority=28] blocks it with ERR_NONRECOVERABLE_ADVANCE_OUTSTANDING)"
          - "increments Advance.version by 1, Loan.version by 1 and Trust.version by 1"
      - from: OUTSTANDING
        to: REVERSED
        trigger: "POST /special-servicing/advances/{id}/status with to_status = REVERSED"
        actor: MasterServicer
        preconditions:
          - "advance.status == OUTSTANDING"
          - "advance.reimbursed_principal_usd == 0 AND reimbursed_interest_usd == 0 (else ERR_INVALID_STATE_TRANSITION)"
          - "reversal_reason is present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "COMPENSATION: advance.accrued_interest_usd := 0 — a reversed advance is treated as never having been funded"
          - "COMPENSATION: loan.advances_outstanding_usd and trust.total_advances_outstanding_usd return to exactly their pre-advance values"
          - "increments Advance.version by 1, Loan.version by 1 and Trust.version by 1"

  - entity: WorkoutPlan
    dimension: status
    initial_state: DRAFT
    terminal_states: [EXECUTED, ABANDONED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SCORED
        trigger: "POST /special-servicing/workout-plans/{id}/status with to_status = SCORED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "workout_plan.status == DRAFT"
          - "at least one WorkoutAlternative exists with workout_plan_id == plan.id AND status == PROPOSED (else ERR_NO_ALTERNATIVES)"
        side_effects:
          - "calculations.workout_alternative_npv runs for every PROPOSED alternative in the plan, writing discounted_pv_usd and npv_usd and moving each to status SCORED"
          - "calculations.workout_alternative_ranking then writes rank on every SCORED alternative and sets plan.recommended_alternative_id to the rank-1 alternative"
          - "workout_plan.scored_on := current logical clock"
          - "alternatives named by another alternative's supersedes_alternative_id are moved to SUPERSEDED with rank := null and are excluded from the ranking pool"
          - "increments WorkoutPlan.version by 1 and each WorkoutAlternative.version by 1"
        note: "Re-scoring is possible after an OBJECTED -> DRAFT loop; the second run recomputes npv_usd from scratch and may recommend a different alternative."
      - from: SCORED
        to: RECOMMENDED
        trigger: "POST /special-servicing/workout-plans/{id}/status with to_status = RECOMMENDED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "workout_plan.status == SCORED"
          - "selected_alternative_id is present in the request body (else ERR_INVALID_REQUEST) and names an existing WorkoutAlternative (else ERR_WORKOUT_ALTERNATIVE_NOT_FOUND)"
          - "that alternative's workout_plan_id == plan.id (else ERR_SUBJECT_REFERENCE_MISMATCH)"
          - "selected_alternative_id == plan.recommended_alternative_id (else ERR_SERVICING_STANDARD_VIOLATION — putting forward anything other than the highest-NPV alternative breaches the servicing standard)"
        side_effects:
          - "workout_plan.selected_alternative_id := the body value; that alternative's status := SELECTED and every other SCORED sibling := DISCARDED"
          - "increments WorkoutPlan.version by 1"
      - from: RECOMMENDED
        to: CONSULTATION
        trigger: "POST /special-servicing/consultations with subject_type = WORKOUT_PLAN (system-driven side effect of consultation issue)"
        actor: system
        preconditions: ["workout_plan.status == RECOMMENDED"]
        side_effects:
          - "workout_plan.consent_requirement := the new consultation's rights_type"
          - "increments WorkoutPlan.version by 1"
      - from: CONSULTATION
        to: CONSENT_SATISFIED
        trigger: "POST /special-servicing/consultations/{id}/response with response = CONSENTED, or POST /special-servicing/consultations/sweep deeming consent, or the control-termination cascade waiving the consultation (system-driven)"
        actor: system
        preconditions: ["workout_plan.status == CONSULTATION", "the subject consultation reaches status IN {CONSENTED, DEEMED_CONSENTED, WAIVED}"]
        side_effects:
          - "workout_plan.consent_requirement := the consultation's final rights_type"
          - "increments WorkoutPlan.version by 1"
      - from: CONSULTATION
        to: OBJECTED
        trigger: "POST /special-servicing/consultations/{id}/response with response = OBJECTED (system-driven)"
        actor: system
        preconditions: ["workout_plan.status == CONSULTATION", "the subject consultation's rights_type == CONSENT_RIGHT"]
        side_effects: ["increments WorkoutPlan.version by 1"]
        note: "An objection from a CONSULTATION_ONLY representative is recorded on the consultation but does NOT move the plan — it goes to CONSENT_SATISFIED instead."
      - from: OBJECTED
        to: DRAFT
        trigger: "POST /special-servicing/workout-plans/{id}/status with to_status = DRAFT"
        actor: SpecialServicerAssetManager
        preconditions:
          - "workout_plan.status == OBJECTED"
          - "workout_plan.revision_round < 3 (else ERR_REVISION_LIMIT_EXCEEDED)"
        side_effects:
          - "workout_plan.revision_round := revision_round + 1"
          - "workout_plan.recommended_alternative_id := null; selected_alternative_id := null; scored_on := null"
          - "every alternative in the plan with status IN {SCORED, SELECTED, DISCARDED} returns to PROPOSED with rank := null, npv_usd := null and discounted_pv_usd := null"
          - "increments WorkoutPlan.version by 1 and each WorkoutAlternative.version by 1"
        note: "Closes the cycle DRAFT -> SCORED -> RECOMMENDED -> CONSULTATION -> OBJECTED -> DRAFT; the fourth revision is refused."
      - from: CONSENT_SATISFIED
        to: APPROVED
        trigger: "POST /special-servicing/workout-plans/{id}/status with to_status = APPROVED"
        actor: SpecialServicingCommitteeOfficer
        preconditions:
          - "workout_plan.status == CONSENT_SATISFIED (else ERR_CONSULTATION_NOT_SATISFIED)"
          - "X-User-ID != workout_plan.prepared_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "workout_plan.approved_by_user_id := X-User-ID"
          - "increments WorkoutPlan.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /special-servicing/workout-plans/{id}/status with to_status = EXECUTED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "workout_plan.status == APPROVED"
          - "an Appraisal exists on plan.loan_id with status == ACCEPTED AND coverage_start_date <= now < coverage_end_date (else ERR_STALE_APPRAISAL)"
        side_effects:
          - "workout_plan.executed_on := current logical clock"
          - "for a MODIFICATION selected alternative, loan.is_modified := true and the loan becomes eligible for IN_WORKOUT -> CORRECTED"
          - "for FORECLOSURE / DEED_IN_LIEU the loan becomes eligible for REO acquisition; for NOTE_SALE it becomes eligible for IN_WORKOUT -> LIQUIDATED"
          - "increments WorkoutPlan.version by 1 and Loan.version by 1"
      - from: DRAFT
        to: ABANDONED
        trigger: "POST /special-servicing/workout-plans/{id}/status with to_status = ABANDONED"
        actor: SpecialServicerAssetManager
        preconditions: ["workout_plan.status IN {DRAFT, SCORED, RECOMMENDED, CONSULTATION, OBJECTED, CONSENT_SATISFIED, APPROVED}"]
        side_effects:
          - "loan.active_workout_plan_id := null; the loan stays in servicing_status IN_WORKOUT"
          - "every PENDING ConsultationRequest whose workout_plan_id == plan.id transitions to WAIVED"
          - "increments WorkoutPlan.version by 1 and Loan.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /special-servicing/workout-plans creating a newer plan on the same loan (system-driven)"
        actor: system
        preconditions: ["workout_plan.status IN {DRAFT, SCORED}"]
        side_effects: ["increments WorkoutPlan.version by 1"]

  - entity: WorkoutAlternative
    dimension: status
    initial_state: PROPOSED
    terminal_states: [SUPERSEDED, DISCARDED]
    transitions:
      - from: PROPOSED
        to: SCORED
        trigger: "the parent plan's DRAFT -> SCORED transition (system-driven)"
        actor: system
        preconditions: ["alternative.status == PROPOSED", "no sibling alternative names this one in supersedes_alternative_id"]
        side_effects: ["discounted_pv_usd, npv_usd and rank are written", "increments WorkoutAlternative.version by 1"]
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "POST /special-servicing/workout-alternatives with supersedes_alternative_id naming this alternative"
        actor: SpecialServicerAssetManager
        preconditions:
          - "alternative.status IN {PROPOSED, SCORED}"
          - "the superseding alternative belongs to the same workout_plan_id (else ERR_SUBJECT_REFERENCE_MISMATCH)"
        side_effects:
          - "alternative.rank := null; it is permanently excluded from the ranking pool"
          - "increments WorkoutAlternative.version by 1"
      - from: SCORED
        to: SELECTED
        trigger: "the parent plan's SCORED -> RECOMMENDED transition naming this alternative (system-driven)"
        actor: system
        preconditions: ["alternative.status == SCORED", "alternative.id == plan.recommended_alternative_id"]
        side_effects: ["increments WorkoutAlternative.version by 1"]
      - from: SCORED
        to: DISCARDED
        trigger: "the parent plan's SCORED -> RECOMMENDED transition naming a different alternative (system-driven)"
        actor: system
        preconditions: ["alternative.status == SCORED"]
        side_effects: ["alternative.rank is retained for the servicing file", "increments WorkoutAlternative.version by 1"]
      - from: SCORED
        to: PROPOSED
        trigger: "the parent plan's OBJECTED -> DRAFT revision loop (system-driven)"
        actor: system
        preconditions: ["alternative.status IN {SCORED, SELECTED, DISCARDED}"]
        side_effects: ["discounted_pv_usd, npv_usd and rank are cleared to null", "increments WorkoutAlternative.version by 1"]

  - entity: ConsultationRequest
    dimension: status
    initial_state: PENDING
    terminal_states: [CONSENTED, OBJECTED, DEEMED_CONSENTED, WAIVED]
    transitions:
      - from: PENDING
        to: CONSENTED
        trigger: "POST /special-servicing/consultations/{id}/response with response = CONSENTED"
        actor: ControllingClassRepresentative
        preconditions:
          - "consultation.status == PENDING"
          - "X-User-ID == consultation.trust_id (else ERR_NOT_RESOURCE_OWNER)"
          - "now <= consultation.deadline_at (else ERR_CONSULTATION_WINDOW_CLOSED)"
        side_effects:
          - "consultation.responded_at := current logical clock; responded_by_user_id := X-User-ID"
          - "CASCADE: a WORKOUT_PLAN subject in status CONSULTATION advances to CONSENT_SATISFIED"
          - "increments ConsultationRequest.version by 1"
      - from: PENDING
        to: OBJECTED
        trigger: "POST /special-servicing/consultations/{id}/response with response = OBJECTED"
        actor: ControllingClassRepresentative
        preconditions:
          - "consultation.status == PENDING"
          - "X-User-ID == consultation.trust_id (else ERR_NOT_RESOURCE_OWNER)"
          - "now <= consultation.deadline_at (else ERR_CONSULTATION_WINDOW_CLOSED)"
        side_effects:
          - "consultation.responded_at := current logical clock; responded_by_user_id := X-User-ID"
          - "CASCADE when rights_type == CONSENT_RIGHT: a WORKOUT_PLAN subject in status CONSULTATION moves to OBJECTED"
          - "CASCADE when rights_type == CONSULTATION_ONLY: the objection is advisory only and a WORKOUT_PLAN subject moves to CONSENT_SATISFIED instead"
          - "increments ConsultationRequest.version by 1"
      - from: PENDING
        to: DEEMED_CONSENTED
        trigger: "POST /special-servicing/consultations/sweep"
        actor: PlatformAdmin
        preconditions:
          - "consultation.status == PENDING"
          - "current logical clock > consultation.deadline_at (STRICTLY after; a clock exactly equal to deadline_at leaves the consultation PENDING)"
        side_effects:
          - "CASCADE: a WORKOUT_PLAN subject in status CONSULTATION advances to CONSENT_SATISFIED"
          - "the sweep processes matching consultations in (deadline_at ASC, created_at ASC) order and returns swept_count plus deemed_consented_ids"
          - "increments ConsultationRequest.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "the control-termination cascade (trust CONTROLLING -> CONSULTING_ONLY) or the parent plan's transition to ABANDONED (system-driven)"
        actor: system
        preconditions: ["consultation.status == PENDING"]
        side_effects:
          - "consultation.rights_type := CONSULTATION_ONLY when the trigger is control termination"
          - "CASCADE: a WORKOUT_PLAN subject in status CONSULTATION advances to CONSENT_SATISFIED"
          - "increments ConsultationRequest.version by 1"

  - entity: REOAsset
    dimension: status
    initial_state: ACQUIRED
    terminal_states: [SOLD, WRITTEN_OFF]
    transitions:
      - from: ACQUIRED
        to: STABILIZING
        trigger: "POST /special-servicing/reo-assets/{id}/status with to_status = STABILIZING"
        actor: SpecialServicerAssetManager
        preconditions: ["reo_asset.status == ACQUIRED"]
        side_effects: ["increments REOAsset.version by 1"]
      - from: STABILIZING
        to: MARKETED
        trigger: "POST /special-servicing/reo-assets/{id}/status with to_status = MARKETED"
        actor: SpecialServicerAssetManager
        preconditions:
          - "reo_asset.status IN {ACQUIRED, STABILIZING, UNDER_CONTRACT}"
          - "list_price_usd is present in the request body (else ERR_INVALID_REQUEST)"
        side_effects:
          - "reo_asset.list_price_usd := the body value"
          - "when the previous status was UNDER_CONTRACT, contract_fallthrough_count := contract_fallthrough_count + 1"
          - "increments REOAsset.version by 1"
      - from: MARKETED
        to: UNDER_CONTRACT
        trigger: "POST /special-servicing/reo-assets/{id}/status with to_status = UNDER_CONTRACT"
        actor: SpecialServicerAssetManager
        preconditions: ["reo_asset.status == MARKETED"]
        side_effects: ["increments REOAsset.version by 1"]
        note: "UNDER_CONTRACT -> MARKETED -> UNDER_CONTRACT is the fall-through cycle, counted in contract_fallthrough_count without limit."
      - from: UNDER_CONTRACT
        to: SOLD
        trigger: "POST /special-servicing/reo-assets/{id}/status with to_status = SOLD"
        actor: SpecialServicingCommitteeOfficer
        preconditions:
          - "reo_asset.status == UNDER_CONTRACT"
          - "gross_proceeds_usd, liquidation_expenses_usd and closing_date are all present in the request body (else ERR_INVALID_REQUEST)"
          - "liquidation_expenses_usd > 0 (else ERR_LIQUIDATION_EXPENSE_REQUIRED)"
          - "closing_date <= reo_asset.remic_disposition_deadline (else ERR_REMIC_DEADLINE_EXCEEDED)"
        side_effects:
          - "reo_asset.gross_sale_proceeds_usd, liquidation_expenses_usd and closing_date are stored"
          - "CASCADE link 1: calculations.liquidation_proceeds_waterfall runs. Step 1 creates a LIQUIDATION_FEE FeeAccrual (status ACCRUED, accrued_by_user_id 'system') on the loan"
          - "CASCADE link 2: caused by link 1 — steps 3 and 4 reimburse each Advance in (advanced_on ASC, created_at ASC) order, moving each to REIMBURSED or PARTIALLY_REIMBURSED and recomputing loan.advances_outstanding_usd and trust.total_advances_outstanding_usd"
          - "CASCADE link 3: caused by link 2 — steps 5-7 reduce loan.accrued_unpaid_interest_usd and loan.current_principal_balance_usd, write loan.realized_loss_usd and trust.realized_loss_usd, and add any residue to trust.excess_liquidation_proceeds_usd; every Advance still OUTSTANDING or PARTIALLY_REIMBURSED after the waterfall becomes DEEMED_NONRECOVERABLE"
          - "CASCADE link 4: caused by link 3 — loan.servicing_status := LIQUIDATED, any EFFECTIVE AppraisalReduction on the loan transitions to REVERSED, trust.total_ara_usd and loans_in_special_servicing_count are recomputed, and calculations.controlling_class_control_test re-runs against the new realized loss (which can restore CONTROLLING or confirm CONSULTING_ONLY)"
          - "increments REOAsset.version by 1, Loan.version by 1 and Trust.version by 1"
      - from: MARKETED
        to: WRITTEN_OFF
        trigger: "POST /special-servicing/reo-assets/{id}/status with to_status = WRITTEN_OFF"
        actor: SpecialServicingCommitteeOfficer
        preconditions: ["reo_asset.status IN {ACQUIRED, STABILIZING, MARKETED}"]
        side_effects:
          - "loan.servicing_status := WRITTEN_OFF and the full principal plus outstanding advance principal becomes realized loss"
          - "increments REOAsset.version by 1, Loan.version by 1 and Trust.version by 1"

  - entity: FeeAccrual
    dimension: status
    initial_state: ACCRUED
    terminal_states: [COLLECTED, WAIVED]
    transitions:
      - from: ACCRUED
        to: COLLECTED
        trigger: "POST /special-servicing/fee-accruals/{id}/status with to_status = COLLECTED"
        actor: MasterServicer
        preconditions: ["fee_accrual.status == ACCRUED"]
        side_effects:
          - "fee_accrual.collected_on := current logical clock"
          - "loan.fees_payable_usd is recomputed (the fee leaves the payable pool)"
          - "increments FeeAccrual.version by 1 and Loan.version by 1"
      - from: ACCRUED
        to: WAIVED
        trigger: "POST /special-servicing/fee-accruals/{id}/status with to_status = WAIVED"
        actor: SpecialServicingCommitteeOfficer
        preconditions:
          - "fee_accrual.status == ACCRUED"
          - "waived_reason is present in the request body (else ERR_INVALID_REQUEST)"
          - "X-User-ID != fee_accrual.accrued_by_user_id (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "COMPENSATION: loan.fees_payable_usd returns to exactly its pre-accrual value"
          - "the (loan_id, fee_type, period_start, period_end) slot is released, so the same period may be accrued again without ERR_FEE_PERIOD_OVERLAP"
          - "increments FeeAccrual.version by 1 and Loan.version by 1"

  - entity: DistributionReport
    dimension: status
    initial_state: DRAFT
    terminal_states: [DISTRIBUTED, VOID]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /special-servicing/distribution-reports/{id}/status with to_status = CERTIFIED"
        actor: Trustee
        preconditions:
          - "distribution_report.status == DRAFT"
          - "X-User-ID != 'system' and the caller's role is Trustee (else ERR_ROLE_NOT_PERMITTED_FOR_STATUS)"
        side_effects:
          - "distribution_report.certified_by_user_id := X-User-ID"
          - "the snapshot fields are frozen; later trust mutations do not change them"
          - "increments DistributionReport.version by 1"
      - from: CERTIFIED
        to: DISTRIBUTED
        trigger: "POST /special-servicing/distribution-reports/{id}/status with to_status = DISTRIBUTED"
        actor: Trustee
        preconditions:
          - "distribution_report.status == CERTIFIED"
          - "recipients is present in the request body, is non-empty, and every element is one of TRUSTEE, RATING_AGENCIES, CERTIFICATE_HOLDERS, CONTROLLING_CLASS_REPRESENTATIVE (else ERR_INVALID_REQUEST)"
        side_effects:
          - "distribution_report.recipients := the body value; distributed_at := current logical clock"
          - "increments DistributionReport.version by 1"
      - from: DRAFT
        to: VOID
        trigger: "POST /special-servicing/distribution-reports/{id}/status with to_status = VOID"
        actor: Trustee
        preconditions: ["distribution_report.status IN {DRAFT, CERTIFIED}"]
        side_effects: ["increments DistributionReport.version by 1"]

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - name: workout-plan-create-stale-loan
    parent_entity: Loan
    child_entity: WorkoutPlan
    write_endpoint: "POST /special-servicing/workout-plans"
    occ_field: expected_loan_version
    error_id: ERR_STALE_LOAN_VERSION
    http_status: 412
    guarantee: |
      Creating a WorkoutPlan supersedes any DRAFT or SCORED plan already on the loan and rewrites
      loan.active_workout_plan_id, so the caller must prove it read the loan's current state. The
      request body carries expected_loan_version; the server compares it to the Loan row's version
      and rejects a mismatch with ERR_STALE_LOAN_VERSION (412) before any other business check at
      priority 9. A caller that re-reads GET /special-servicing/loans/{id} and resubmits with the
      new version succeeds.
    version_semantics: |
      Loan.version increments by exactly 1 on every write that touches the Loan row, including
      writes driven by cascades from other aggregates (an EFFECTIVE AppraisalReduction, an Advance
      reversal, a fee collection). Any such cascade invalidates a previously read expected_loan_version.

  - name: distribution-report-create-stale-trust
    parent_entity: Trust
    child_entity: DistributionReport
    write_endpoint: "POST /special-servicing/distribution-reports"
    occ_field: expected_trust_version
    error_id: ERR_STALE_TRUST_VERSION
    http_status: 412
    guarantee: |
      A DistributionReport freezes five snapshot fields off the Trust row, so a report built from a
      stale read would misstate the trust to the trustee, the rating agencies and the certificate
      holders. The body carries expected_trust_version; a mismatch is rejected with
      ERR_STALE_TRUST_VERSION (412) at priority 9 and no report row is created.
    version_semantics: |
      Trust.version increments by exactly 1 on every write that touches the Trust row, which
      includes every recomputation of total_ara_usd, total_advances_outstanding_usd,
      realized_loss_usd, control_status and loans_in_special_servicing_count.

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: transfer_event_qualification
    description: "Decides whether a recorded ServicingTransferEvent, standing alone, compels transfer of the loan to special servicing."
    trigger: "On POST /special-servicing/transfer-events, and on every auto-recorded event created by the Loan payment_status cascade."
    inputs: [event_code, days_delinquent_at_event, imminent_default_certified, "loan.maturity_date", occurred_on]
    algorithm: threshold
    formula: |
      switch (event_code):
        MONETARY_DEFAULT_60D    -> triggers_transfer = (days_delinquent_at_event >= 60)
        IMMINENT_DEFAULT        -> triggers_transfer = (imminent_default_certified == true)
        MATURITY_DEFAULT        -> triggers_transfer = (occurred_on >= loan.maturity_date)
        BANKRUPTCY              -> triggers_transfer = true
        RECEIVERSHIP            -> triggers_transfer = true
        OTHER_MATERIAL_DEFAULT  -> triggers_transfer = false
      consumed_by_transfer = false
    constants:
      MONETARY_DELINQUENCY_DAYS_THRESHOLD: 60
    precision: "boolean output; days_delinquent_at_event is an integer count"
    note: |
      The 60-day threshold is inclusive: 59 days does NOT qualify, 60 days does. OTHER_MATERIAL_DEFAULT
      is recordable for the servicing file but never sufficient on its own, so a loan whose only event is
      OTHER_MATERIAL_DEFAULT is refused transfer with ERR_NO_QUALIFYING_TRANSFER_EVENT.

  - name: appraisal_reduction_amount
    description: "Computes the appraisal reduction amount (ARA) from an ACCEPTED appraisal, giving the trust a 90% credit for collateral value and charging the deficiency against the controlling class."
    trigger: "Automatically on the Appraisal RECEIVED -> ACCEPTED transition, which creates a PROVISIONAL AppraisalReduction."
    inputs: ["loan.current_principal_balance_usd", "loan.accrued_unpaid_interest_usd", "outstanding Advance principal", "outstanding Advance accrued_interest_usd", "appraisal.value_usd", "appraisal.estimated_liquidation_expenses_usd", "appraisal.appraisal_type"]
    algorithm: threshold
    formula: |
      # Step 1 — deficiency base (identical in both variants)
      advance_principal = sum over Advance where loan_id == loan.id
                          and status in {OUTSTANDING, PARTIALLY_REIMBURSED}
                          of (amount_usd - reimbursed_principal_usd)
      advance_interest  = sum over the SAME advances of accrued_interest_usd
                          (each refreshed by calculations.advance_interest_accrual to the current clock)
      deficiency_base_usd = round(loan.current_principal_balance_usd
                                  + loan.accrued_unpaid_interest_usd
                                  + advance_principal
                                  + advance_interest, 2)

      # Step 2 — appraisal credit (VARIANT-DEPENDENT)
      if appraisal.appraisal_type == FULL_NARRATIVE:
          calculation_basis   = NET_LIQUIDATION_BASIS
          appraisal_credit_usd = round(APPRAISAL_CREDIT_PCT
                                       * (appraisal.value_usd
                                          - appraisal.estimated_liquidation_expenses_usd), 2)
      else:   # UPDATE or INTERNAL_VALUATION
          calculation_basis   = GROSS_APPRAISED_BASIS
          appraisal_credit_usd = round(APPRAISAL_CREDIT_PCT * appraisal.value_usd, 2)

      # Step 3 — reduction, floored at zero
      ara_amount_usd = max(0, round(deficiency_base_usd - appraisal_credit_usd, 2))
      ara_percentage = round(ara_amount_usd / loan.current_principal_balance_usd * 100, 4)
    constants:
      APPRAISAL_CREDIT_PCT: 0.90
    precision: "ara_amount_usd, deficiency_base_usd, appraisal_credit_usd: 2 decimals round_half_up. ara_percentage: 4 decimals round_half_up."
    variants:
      - name: GROSS_APPRAISED_BASIS
        when: "appraisal.appraisal_type IN {UPDATE, INTERNAL_VALUATION} — estimated_liquidation_expenses_usd is forbidden on such an appraisal"
        difference: "The 90% credit is taken against the raw appraised value, producing the SMALLER reduction."
      - name: NET_LIQUIDATION_BASIS
        when: "appraisal.appraisal_type == FULL_NARRATIVE — estimated_liquidation_expenses_usd is required"
        difference: "Liquidation expenses are deducted from value BEFORE the 90% credit, so the credit shrinks by round(0.90 * expenses, 2) and the reduction grows by the same amount."
    worked_example: |
      Loan: current_principal_balance_usd = 19500000, accrued_unpaid_interest_usd = 0, no advances
      -> deficiency_base_usd = 19500000.00
      UPDATE appraisal, value_usd = 15000000
        credit = round(0.90 * 15000000, 2) = 13500000.00
        ara_amount_usd = 6000000.00, ara_percentage = 30.7692
      FULL_NARRATIVE appraisal, value_usd = 15000000, estimated_liquidation_expenses_usd = 900000
        credit = round(0.90 * 14100000, 2) = 12690000.00
        ara_amount_usd = 6810000.00, ara_percentage = 34.9231
      Divergence on identical value_usd: 810000.00 = round(0.90 * 900000, 2)

  - name: ara_adjusted_advance_obligation
    description: "Reduces the master servicer's monthly principal-and-interest advance obligation in proportion to the effective appraisal reduction."
    trigger: "Recomputed whenever loan.ara_amount_usd changes: an AppraisalReduction reaching EFFECTIVE, RECALCULATED or REVERSED. Enforced on POST /special-servicing/advances for advance_type == PI_ADVANCE."
    inputs: ["loan.monthly_debt_service_usd", "loan.current_principal_balance_usd", "loan.ara_amount_usd"]
    algorithm: threshold
    formula: |
      if loan.ara_amount_usd == 0:
          required_monthly_pi_advance_usd = loan.monthly_debt_service_usd
      else:
          required_monthly_pi_advance_usd = round(loan.monthly_debt_service_usd
              * (loan.current_principal_balance_usd - loan.ara_amount_usd)
              / loan.current_principal_balance_usd, 2)
      # A PI_ADVANCE whose amount_usd exceeds this figure is refused with
      # ERR_ADVANCE_EXCEEDS_ARA_ADJUSTED_OBLIGATION (validations priority 27).
      # The comparison is inclusive: amount_usd == required_monthly_pi_advance_usd is allowed.
    constants: {}
    precision: "2 decimals, round_half_up"
    worked_example: |
      monthly_debt_service_usd = 118000, current_principal_balance_usd = 19500000
        ara_amount_usd = 0.00       -> 118000.00
        ara_amount_usd = 6000000.00 -> round(118000 * 13500000 / 19500000, 2) = 81692.31
        ara_amount_usd = 6000000.90 -> round(118000 * 13499999.10 / 19500000, 2) = 81692.30
      A PI_ADVANCE of 81692.30 succeeds at the second figure; 81692.31 is refused.

  - name: advance_interest_accrual
    description: "Accrues interest on outstanding servicer advances on a 30/360 day-count basis at the trust's advance interest rate."
    trigger: "Refreshed on every read of an Advance, on every ARA computation that includes the advance in its deficiency base, and immediately before the liquidation waterfall reimburses it."
    inputs: ["advance.amount_usd", "advance.reimbursed_principal_usd", "advance.advanced_on", "current logical clock", "trust.advance_interest_rate_pct"]
    algorithm: chronological
    formula: |
      # 30/360 US day count with end-of-month clamping
      y1,m1,d1 = date parts of advance.advanced_on
      y2,m2,d2 = date parts of the current logical clock (date portion only)
      D1 = min(d1, 30)
      D2 = min(d2, 30)
      day_count = (y2 - y1) * 360 + (m2 - m1) * 30 + (D2 - D1)
      if day_count <= 0: accrued_interest_usd = 0.00
      else:
          unreimbursed = advance.amount_usd - advance.reimbursed_principal_usd
          accrued_interest_usd = round(unreimbursed
              * (trust.advance_interest_rate_pct / 100)
              * day_count / DAY_COUNT_BASIS, 2)
      interest_accrued_through = current logical clock
    constants:
      DAY_COUNT_BASIS: 360
    precision: "2 decimals, round_half_up; day_count is an integer"
    worked_example: |
      trust.advance_interest_rate_pct = 5.0
      200000 advanced 2026-02-01, clock 2026-10-01 -> day_count 240 -> 6666.67
      150000 advanced 2026-04-01, clock 2026-10-01 -> day_count 180 -> 3750.00
      200000 advanced 2026-02-01, clock 2026-06-01 -> day_count 120 -> 3333.33
      150000 advanced 2026-04-01, clock 2026-06-01 -> day_count  60 -> 1250.00
      200000 advanced 2026-02-15, clock 2026-08-31 -> day_count 195 (D2 clamped from 31 to 30) -> 5416.67
    note: "The clamping of both day-of-month values to 30 is what makes 2026-08-31 accrue the same as 2026-08-30."

  - name: servicing_standard_analysis
    description: "Applies the servicing standard to a borrower request: relief may be recommended only when granting it improves the trust's net present value recovery by a material margin."
    trigger: "POST /special-servicing/borrower-requests/{id}/analysis"
    inputs: [npv_recovery_with_request_usd, npv_recovery_without_request_usd, "loan.current_principal_balance_usd"]
    algorithm: threshold
    formula: |
      servicing_standard_margin_usd = round(npv_recovery_with_request_usd
                                            - npv_recovery_without_request_usd, 2)
      required_margin_usd = max(ABSOLUTE_MARGIN_FLOOR_USD,
                                round(RELATIVE_MARGIN_PCT * loan.current_principal_balance_usd, 2))
      if servicing_standard_margin_usd >= required_margin_usd:
          servicing_standard_conclusion = SERVICING_STANDARD_MET
      else:
          servicing_standard_conclusion = SERVICING_STANDARD_NOT_MET
    constants:
      ABSOLUTE_MARGIN_FLOOR_USD: 50000
      RELATIVE_MARGIN_PCT: 0.005
    precision: "2 decimals, round_half_up. The comparison is inclusive at the boundary."
    worked_example: |
      current_principal_balance_usd = 19500000 -> required_margin_usd = max(50000, 97500.00) = 97500.00
        with = 21597500, without = 21500000 -> margin 97500.00 -> SERVICING_STANDARD_MET (exact boundary)
        with = 21597499.99, without = 21500000 -> margin 97499.99 -> SERVICING_STANDARD_NOT_MET
      current_principal_balance_usd = 1000000 -> required_margin_usd = max(50000, 5000.00) = 50000.00
        the absolute floor dominates on small loans, the relative test on large ones
    note: |
      Only SERVICING_STANDARD_MET permits UNDER_ANALYSIS -> RECOMMENDED; a NOT_MET conclusion is
      recorded and the request can only be DENIED (ERR_SERVICING_STANDARD_VIOLATION otherwise).

  - name: request_deposit_floor
    description: "Minimum non-refundable processing deposit a borrower must wire with a request, by request type."
    trigger: "POST /special-servicing/borrower-requests, evaluated at validation priority 26."
    inputs: [request_type, processing_fee_deposit_usd]
    algorithm: threshold
    formula: |
      floor = DEPOSIT_FLOOR_USD[request_type]
      if processing_fee_deposit_usd < floor:  reject with ERR_DEPOSIT_BELOW_MINIMUM (402)
      # inclusive: processing_fee_deposit_usd == floor is accepted
    constants:
      DEPOSIT_FLOOR_MODIFICATION_USD: 25000
      DEPOSIT_FLOOR_ASSUMPTION_USD: 15000
      DEPOSIT_FLOOR_LEASE_APPROVAL_USD: 5000
    precision: "2 decimals, round_half_up"
    note: "The deposit is never refunded, not even on WITHDRAWN or DENIED, so it is stored verbatim and never recomputed."

  - name: consultation_response_deadline
    description: "Computes the last instant at which the controlling class representative's response is accepted, counting business days from issuance."
    trigger: "POST /special-servicing/consultations (writes deadline_at at issue)."
    inputs: [issued_at, "trust.consultation_response_business_days"]
    algorithm: chronological
    formula: |
      # Count forward, skipping Saturdays, Sundays and the pinned holiday list.
      # The issue date itself is never counted, whether or not it is a business day.
      d = date(issued_at)
      counted = 0
      while counted < trust.consultation_response_business_days:
          d = d + 1 calendar day
          if weekday(d) not in {SATURDAY, SUNDAY} and d not in HOLIDAYS:
              counted = counted + 1
      deadline_at = d at 23:59:59.999Z
      # A response is accepted while now <= deadline_at; the sweep deems consent only when
      # now > deadline_at (STRICTLY after).
    constants:
      HOLIDAYS: ["2026-09-07", "2026-11-26", "2026-12-25"]
      DEFAULT_BUSINESS_DAYS: 10
    precision: "millisecond-resolution instant; the date is computed in UTC"
    worked_example: |
      issued_at = 2026-09-01T00:00:00Z (a Tuesday), business days = 10.
      Counted days: Sep 2, 3, 4, 8, 9, 10, 11, 14, 15, 16
        (Sep 5-6 and 12-13 are weekends; Sep 7 is a pinned holiday)
      -> deadline_at = 2026-09-16T23:59:59.999Z
      Clock exactly 2026-09-16T23:59:59.999Z: the sweep leaves the consultation PENDING and a
      response is still accepted. Clock 2026-09-17T00:00:00Z: the sweep sets DEEMED_CONSENTED and
      a response is refused with ERR_CONSULTATION_WINDOW_CLOSED.

  - name: workout_alternative_npv
    description: "Discounts each workout alternative's projected cash flows to present value and nets the upfront cost, so modification, deed in lieu, note sale and foreclosure can be compared on one axis."
    trigger: "The WorkoutPlan DRAFT -> SCORED transition, for every alternative in the plan with status == PROPOSED."
    inputs: ["alternative.projected_cash_flows", "alternative.upfront_cost_usd", "plan.discount_rate_pct", "plan.npv_basis"]
    algorithm: forward_looking
    formula: |
      rate = plan.discount_rate_pct / 100
      shift = 0 if plan.npv_basis == CONTRACTUAL else 1     # VARIANT-DEPENDENT
      discounted_pv_usd = 0
      for each entry in alternative.projected_cash_flows, iterated in period_index ASC order:
          # ROUNDING ORDER IS PINNED: round EACH period to 2 decimals, THEN accumulate.
          # Discounting the whole stream and rounding once at the end is WRONG and can differ
          # by a cent, which is enough to change the ranking.
          discounted_pv_usd += round(entry.amount_usd
                                     / (1 + rate) ** (entry.period_index + shift), 2)
      npv_usd = round(discounted_pv_usd - alternative.upfront_cost_usd, 2)
    constants: {}
    precision: "2 decimals, round_half_up, applied per period before accumulation; the exponent is an integer"
    variants:
      - name: CONTRACTUAL
        when: "plan.npv_basis == CONTRACTUAL — the workout is expected to close on the contractual timetable"
        difference: "Period n is discounted by (1 + rate)^n."
      - name: DELAY_STRESSED
        when: "plan.npv_basis == DELAY_STRESSED — every recovery is assumed to slip one full annual period"
        difference: "Period n is discounted by (1 + rate)^(n + 1), i.e. every cash flow is pushed one period further out. Back-loaded alternatives lose more value than front-loaded ones, which can reverse the ranking."
    worked_example: |
      discount_rate_pct = 9.5
      MODIFICATION  cash flows [(1,900000),(2,950000),(3,1000000),(4,8576200)], upfront 120000
      NOTE_SALE     cash flows [(1,9100000)],                                   upfront  90000
      FORECLOSURE   cash flows [(1,0),(2,9800000)],                             upfront 650000

      CONTRACTUAL:
        MODIFICATION per-period 821917.81 + 792310.42 + 761653.85 + 5965384.26
                     -> discounted_pv_usd 8341266.34, npv_usd 8221266.34
                     (rounding the whole stream once would give 8221266.33 — a one-cent error)
        NOTE_SALE    8310502.28 -> npv_usd 8220502.28
        FORECLOSURE  0.00 + 8173307.48 -> npv_usd 7523307.48
        ranking: MODIFICATION (1), NOTE_SALE (2), FORECLOSURE (3)

      DELAY_STRESSED, same data:
        MODIFICATION 750609.87 + 723571.16 + 695574.29 + 5447839.50 -> npv_usd 7497594.82
        NOTE_SALE    7589499.80 -> npv_usd 7499499.80
        FORECLOSURE  0.00 + 7464207.74 -> npv_usd 6814207.74
        ranking: NOTE_SALE (1), MODIFICATION (2), FORECLOSURE (3)  <-- rank 1 flips

  - name: workout_alternative_ranking
    description: "Ranks the scored alternatives and names the one the servicing standard obliges the special servicer to put forward."
    trigger: "Immediately after calculations.workout_alternative_npv on the DRAFT -> SCORED transition."
    inputs: ["every WorkoutAlternative with workout_plan_id == plan.id"]
    algorithm: aggregation
    formula: |
      pool = alternatives where workout_plan_id == plan.id
                           and status == SCORED
                           and no sibling alternative names it in supersedes_alternative_id
      if pool is empty: reject the transition with ERR_NO_ALTERNATIVES (422)
      sort pool by:
          1. npv_usd DESC
          2. ALTERNATIVE_TYPE_ORDINAL[alternative_type] ASC   (deterministic tie-break)
          3. created_at ASC                                   (final fallback; id is NEVER used)
      assign rank = 1..n in that order
      plan.recommended_alternative_id = the rank-1 alternative's id
      superseded alternatives get rank = null
    constants:
      ALTERNATIVE_TYPE_ORDINAL_MODIFICATION: 1
      ALTERNATIVE_TYPE_ORDINAL_DEED_IN_LIEU: 2
      ALTERNATIVE_TYPE_ORDINAL_NOTE_SALE: 3
      ALTERNATIVE_TYPE_ORDINAL_FORECLOSURE: 4
    precision: "rank is a 1-based integer; comparison of npv_usd is exact at 2 decimals"
    note: |
      The ordinal tie-break encodes the PSA's preference for keeping the loan alive: on an exact NPV
      tie a MODIFICATION outranks a DEED_IN_LIEU, which outranks a NOTE_SALE, which outranks a
      FORECLOSURE. Only when type AND npv are equal does created_at ASC decide.

  - name: controlling_class_control_test
    description: "Determines whether the controlling class still holds consent rights or has been cut down to consultation rights only."
    trigger: "Re-runs on every write that changes trust.total_ara_usd or trust.realized_loss_usd: an AppraisalReduction reaching EFFECTIVE / RECALCULATED / REVERSED, and the liquidation waterfall writing realized loss."
    inputs: ["trust.original_controlling_class_balance_usd", "trust.total_ara_usd", "trust.realized_loss_usd"]
    algorithm: threshold
    formula: |
      controlling_class_notional_usd = max(0, round(trust.original_controlling_class_balance_usd
                                                    - trust.total_ara_usd
                                                    - trust.realized_loss_usd, 2))
      control_threshold_usd = round(CONTROL_TERMINATION_PCT
                                    * trust.original_controlling_class_balance_usd, 2)
      if controlling_class_notional_usd >= control_threshold_usd:
          control_status = CONTROLLING          # inclusive at the boundary
      else:
          control_status = CONSULTING_ONLY
    constants:
      CONTROL_TERMINATION_PCT: 0.25
    precision: "2 decimals, round_half_up; the threshold comparison is inclusive (>=)"
    worked_example: |
      original_controlling_class_balance_usd = 8000000 -> control_threshold_usd = 2000000.00
        total_ara_usd 6000000.00, realized_loss 0 -> notional 2000000.00 -> CONTROLLING (exact boundary)
        total_ara_usd 6000000.90, realized_loss 0 -> notional 1999999.10 -> CONSULTING_ONLY
        total_ara_usd 12810000.00 (two loans) -> raw -4810000.00, clamped to 0.00 -> CONSULTING_ONLY
        total_ara_usd 0, realized_loss 4100416.67 -> notional 3899583.33 -> CONTROLLING
    note: |
      A one-cent-larger appraisal reduction is enough to terminate control, which is why the ARA
      calculation's rounding and the >= boundary must both be exact.

  - name: special_servicing_fee_accrual
    description: "Accrues the monthly special servicing fee on a loan in special servicing, subject to a monthly dollar floor."
    trigger: "POST /special-servicing/fee-accruals with fee_type == SPECIAL_SERVICING_FEE."
    inputs: ["loan.current_principal_balance_usd", "loan.ara_amount_usd", "trust.special_servicing_fee_annual_pct", "trust.fee_basis_convention"]
    algorithm: threshold
    formula: |
      monthly_rate = trust.special_servicing_fee_annual_pct / 100 / MONTHS_PER_YEAR
      if trust.fee_basis_convention == STATED_PRINCIPAL:          # VARIANT-DEPENDENT
          basis_amount_usd = loan.current_principal_balance_usd
      else:                                                       # ARA_ADJUSTED
          basis_amount_usd = round(loan.current_principal_balance_usd - loan.ara_amount_usd, 2)
      raw = round(basis_amount_usd * monthly_rate, 2)
      amount_usd = max(MONTHLY_FEE_FLOOR_USD, raw)
      rate_pct   = round(monthly_rate * 100, 6)
    constants:
      MONTHS_PER_YEAR: 12
      MONTHLY_FEE_FLOOR_USD: 500.00
    precision: "2 decimals, round_half_up on basis_amount_usd and amount_usd; rate_pct to 6 decimals"
    variants:
      - name: STATED_PRINCIPAL
        when: "trust.fee_basis_convention == STATED_PRINCIPAL"
        difference: "The fee is charged on the full stated principal balance and is unaffected by any appraisal reduction, so the servicer keeps earning on the written-down portion."
      - name: ARA_ADJUSTED
        when: "trust.fee_basis_convention == ARA_ADJUSTED"
        difference: "The effective appraisal reduction is subtracted from the fee basis first, so the fee shrinks as the collateral value falls."
    worked_example: |
      special_servicing_fee_annual_pct = 0.25, current_principal_balance_usd = 19500000
        STATED_PRINCIPAL, ara 6000000.90 -> basis 19500000.00    -> 4062.50
        ARA_ADJUSTED,     ara 6000000.90 -> basis 13499999.10    -> 2812.50
        divergence on identical loan data: 1250.00
      current_principal_balance_usd = 1000000, ara 0
        raw = 208.33 -> floored to 500.00 under BOTH conventions

  - name: workout_fee_accrual
    description: "Accrues the workout fee on collections received on a corrected loan, subject to a per-accrual dollar cap and mutually exclusive with the liquidation fee."
    trigger: "POST /special-servicing/fee-accruals with fee_type == WORKOUT_FEE."
    inputs: [collection_amount_usd, "trust.workout_fee_rate_pct", "loan.servicing_status", "loan.correction_source_plan_id"]
    algorithm: aggregation
    formula: |
      # Eligibility (validation priority 29):
      #   loan.servicing_status == MASTER_SERVICING and loan.correction_source_plan_id is not null,
      #   else ERR_WORKOUT_FEE_NOT_ELIGIBLE (409)
      # Mutual exclusivity (validation priority 25):
      #   if any FeeAccrual on this loan has fee_type == LIQUIDATION_FEE and status != WAIVED
      #      -> ERR_FEE_TYPE_CONFLICT (409)
      basis_amount_usd = collection_amount_usd
      rate_pct         = trust.workout_fee_rate_pct
      amount_usd       = min(FEE_CAP_USD, round(collection_amount_usd * rate_pct / 100, 2))
    constants:
      FEE_CAP_USD: 1000000.00
    precision: "2 decimals, round_half_up"
    worked_example: |
      workout_fee_rate_pct = 1.0, collection_amount_usd = 450000 -> amount_usd 4500.00
      collection_amount_usd = 150000000 -> raw 1500000.00 -> capped to 1000000.00
    note: |
      A loan can earn a workout fee OR a liquidation fee, never both: the workout fee rewards
      returning the loan to the master servicer, the liquidation fee rewards disposing of it.

  - name: liquidation_proceeds_waterfall
    description: "Allocates gross liquidation proceeds through a fixed seven-step waterfall, producing the liquidation fee, advance reimbursements, principal recovery, realized loss and any excess proceeds."
    trigger: "The REOAsset UNDER_CONTRACT -> SOLD transition, and the Loan IN_WORKOUT -> LIQUIDATED transition on a NOTE_SALE plan."
    inputs: [gross_proceeds_usd, liquidation_expenses_usd, "trust.liquidation_fee_rate_pct", "every Advance on the loan with status IN {OUTSTANDING, PARTIALLY_REIMBURSED}", "loan.accrued_unpaid_interest_usd", "loan.current_principal_balance_usd"]
    algorithm: waterfall_allocation
    formula: |
      # STEP 1 — liquidation fee, computed on GROSS proceeds (NOT on net proceeds; taking the fee
      # on the post-fee figure would be circular, so the base is pinned to gross).
      fee_amount_usd = min(FEE_CAP_USD,
                           round(gross_proceeds_usd * trust.liquidation_fee_rate_pct / 100, 2))
      a LIQUIDATION_FEE FeeAccrual is created in status ACCRUED with basis_amount_usd = gross_proceeds_usd

      # STEP 2 — available proceeds
      available = round(gross_proceeds_usd - liquidation_expenses_usd - fee_amount_usd, 2)
      # available may be 0 but never negative: liquidation_expenses_usd + fee_amount_usd
      # > gross_proceeds_usd is rejected with ERR_LIQUIDATION_EXPENSE_REQUIRED (validation
      # priority 32) before the waterfall runs.

      # STEP 3 — advance reimbursement, oldest advance first
      for each advance in (advanced_on ASC, created_at ASC) order:
          refresh advance.accrued_interest_usd via calculations.advance_interest_accrual
          interest_due  = advance.accrued_interest_usd - advance.reimbursed_interest_usd
          principal_due = advance.amount_usd - advance.reimbursed_principal_usd
          # interest is ALWAYS paid before principal, within each advance
          pay_i = min(available, interest_due);  available -= pay_i
          pay_p = min(available, principal_due); available -= pay_p
          advance.reimbursed_interest_usd  += pay_i
          advance.reimbursed_principal_usd += pay_p
          advance.status = REIMBURSED           if pay_i == interest_due and pay_p == principal_due
                           PARTIALLY_REIMBURSED if pay_i + pay_p > 0
                           unchanged            otherwise

      # STEP 4 — accrued unpaid note interest
      pay_aui = min(available, loan.accrued_unpaid_interest_usd); available -= pay_aui
      loan.accrued_unpaid_interest_usd -= pay_aui

      # STEP 5 — principal
      pay_principal = min(available, loan.current_principal_balance_usd); available -= pay_principal
      loan.current_principal_balance_usd -= pay_principal

      # STEP 6 — realized loss
      unreimbursed_advance_principal = sum over the advances still short after step 3 of
                                       (amount_usd - reimbursed_principal_usd)
      loan.realized_loss_usd = round(loan.current_principal_balance_usd
                                     + unreimbursed_advance_principal, 2)
      trust.realized_loss_usd += loan.realized_loss_usd
      every advance still OUTSTANDING or PARTIALLY_REIMBURSED becomes DEEMED_NONRECOVERABLE

      # STEP 7 — excess proceeds
      trust.excess_liquidation_proceeds_usd += available     # the residue, 0.00 in the normal case
    constants:
      FEE_CAP_USD: 1000000.00
    precision: "2 decimals, round_half_up at every step; each step's remainder feeds the next exactly"
    worked_example: |
      trust.liquidation_fee_rate_pct = 1.0, advance_interest_rate_pct = 5.0, clock 2026-10-01
      Loan: current_principal_balance_usd 10000000, accrued_unpaid_interest_usd 250000
      Advance A: 200000 advanced 2026-02-01 -> accrued interest 6666.67
      Advance B: 150000 advanced 2026-04-01 -> accrued interest 3750.00

      Case LARGE — gross 7000000, expenses 420000
        step 1 fee 70000.00; step 2 available 6510000.00
        step 3 A: interest 6666.67 + principal 200000.00 -> REIMBURSED, available 6303333.33
               B: interest 3750.00 + principal 150000.00 -> REIMBURSED, available 6149583.33
        step 4 pays 250000.00 of accrued interest, available 5899583.33
        step 5 pays 5899583.33 of principal, principal left 4100416.67, available 0.00
        step 6 realized_loss_usd 4100416.67 (no unreimbursed advance principal)
        step 7 excess 0.00
        control test after: notional 8000000 - 0 - 4100416.67 = 3899583.33 -> CONTROLLING

      Case SMALL — gross 400000, expenses 350000
        step 1 fee 4000.00; step 2 available 46000.00
        step 3 A: interest 6666.67 then principal 39333.33 -> PARTIALLY_REIMBURSED, available 0.00
               B: receives nothing -> stays OUTSTANDING, later DEEMED_NONRECOVERABLE
        steps 4-5 pay nothing; principal left 10000000.00
        step 6 unreimbursed advance principal 160666.67 + 150000.00 = 310666.67
               realized_loss_usd 10310666.67
        step 7 excess 0.00
      The oldest-first ordering is observable: reversing it would fully reimburse B and leave A short.

# =============================================================================
# §1.4 Validation Rules Table (evaluated in strict priority order, 1 first;
#      the FIRST rule that fails determines the response and no later rule runs)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "Both X-User-ID and X-User-Role request headers are present and non-empty, and X-User-Role is one of the seven roles in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
    description: "Runs before every other check on every endpoint including GETs. A missing header on a request that ALSO names a non-existent resource still returns 401, never 404."

  - priority: 2
    category: auth
    check: "X-User-Role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all
    description: "Coarse endpoint-level authorisation. Evaluated before path existence, so a role that may not touch an endpoint gets 403 even for a non-existent id."

  - priority: 3
    category: existence
    check: "Every {id} path segment resolves to a stored row"
    error_id: "ERR_TRUST_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_TRANSFER_EVENT_NOT_FOUND | ERR_BORROWER_REQUEST_NOT_FOUND | ERR_APPRAISAL_NOT_FOUND | ERR_APPRAISAL_REDUCTION_NOT_FOUND | ERR_ADVANCE_NOT_FOUND | ERR_WORKOUT_PLAN_NOT_FOUND | ERR_WORKOUT_ALTERNATIVE_NOT_FOUND | ERR_CONSULTATION_NOT_FOUND | ERR_REO_ASSET_NOT_FOUND | ERR_FEE_ACCRUAL_NOT_FOUND | ERR_DISTRIBUTION_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "The error_id names the entity of the SEGMENT that failed, so GET /special-servicing/loans/{missing} returns ERR_LOAN_NOT_FOUND."

  - priority: 4
    category: auth
    check: "For an entity_backed role, X-User-ID equals the owning key: Borrower -> the target row's loan_id (or the path loan id); ControllingClassRepresentative -> the target row's trust_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /borrower-requests, POST /borrower-requests/{id}/status, POST /consultations/{id}/response, GET endpoints reached by an entity_backed role"
    description: "Ownership is a header-vs-field comparison, not a guess. Evaluated AFTER existence so the caller is told 404 for a row that does not exist and 403 only for a row that exists but is not theirs."

  - priority: 5
    category: validation
    check: "The request body parses, every required field is present, every field has the declared type, every enum value is a member of its declared set, every numeric field satisfies its declared constraint, and conditionally-forbidden fields are absent"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
    description: "Covers estimated_liquidation_expenses_usd present on a non-FULL_NARRATIVE appraisal, period_start/period_end present on a non-SPECIAL_SERVICING_FEE accrual, collection_amount_usd present on a non-WORKOUT_FEE accrual, an empty recipients array, a projected_cash_flows entry with period_index < 1 or duplicate period_index, and an unknown extra field (which is ignored, not rejected)."

  - priority: 6
    category: existence
    check: "Every foreign key in the request body resolves to a stored row"
    error_id: "ERR_TRUST_NOT_FOUND | ERR_LOAN_NOT_FOUND | ERR_APPRAISAL_NOT_FOUND | ERR_WORKOUT_PLAN_NOT_FOUND | ERR_WORKOUT_ALTERNATIVE_NOT_FOUND | ERR_BORROWER_REQUEST_NOT_FOUND"
    http_status: 404
    applies_to: "POST /loans, POST /transfer-events, POST /borrower-requests, POST /appraisals, POST /advances, POST /workout-plans, POST /workout-alternatives, POST /consultations, POST /reo-assets, POST /fee-accruals, POST /distribution-reports, POST /workout-plans/{id}/status"
    description: "Body FKs are checked after the schema is known to be well formed, so a body with a malformed type AND a dangling FK returns 400."

  - priority: 7
    category: business_referential
    check: "Cross-references agree: a ConsultationRequest's subject FK belongs to the named trust (workout_plan.loan.trust_id == trust_id, or borrower_request.loan.trust_id == trust_id); a WorkoutAlternative's supersedes_alternative_id belongs to the same workout_plan_id; a selected_alternative_id belongs to the plan being recommended; an AppraisalReduction's appraisal_id has the same loan_id; an REOAsset's source_workout_plan_id has the same loan_id"
    error_id: ERR_SUBJECT_REFERENCE_MISMATCH
    http_status: 422
    applies_to: "POST /consultations, POST /workout-alternatives, POST /workout-plans/{id}/status, POST /reo-assets"
    description: "Both rows exist, so this is not a 404; they simply do not belong together."

  - priority: 8
    category: state
    check: "The requested transition (from the row's current status to to_status) appears in the entity's §1.2 transition list"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every POST /<collection>/{id}/status, /response, /analysis and /servicing-status, /payment-status endpoint"
    description: "Also fires on a second identical trigger (idempotency is NOT granted), on any transition out of a terminal state, and on making a second AppraisalReduction EFFECTIVE while one is already EFFECTIVE on the same loan."

  - priority: 9
    category: concurrency
    check: "The body's expected_<parent>_version equals the parent row's current version"
    error_id: "ERR_STALE_LOAN_VERSION | ERR_STALE_TRUST_VERSION"
    http_status: 412
    applies_to: "POST /workout-plans, POST /distribution-reports"
    description: "See §1.2.1. Evaluated after state legality so a caller with a stale version on an illegal transition is told about the transition first."

  - priority: 10
    category: auth
    check: "X-User-ID differs from the row's authoring user id: Appraisal.ordered_by_user_id on ACCEPTED/REJECTED, WorkoutPlan.prepared_by_user_id on APPROVED, FeeAccrual.accrued_by_user_id on WAIVED"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /appraisals/{id}/status, POST /workout-plans/{id}/status, POST /fee-accruals/{id}/status"
    description: "The same human may not author and bless the same artefact even when their role permits both operations."

  - priority: 11
    category: auth
    check: "The caller's role is permitted to request THIS particular to_status, not merely to call the endpoint"
    error_id: ERR_ROLE_NOT_PERMITTED_FOR_STATUS
    http_status: 403
    applies_to: "POST /loans/{id}/servicing-status, POST /workout-plans/{id}/status, POST /appraisal-reductions/{id}/status, POST /reo-assets/{id}/status, POST /fee-accruals/{id}/status, POST /distribution-reports/{id}/status, POST /borrower-requests/{id}/status"
    description: "The endpoint's roles list is the union over all its target statuses; this rule narrows it per status. Also refuses every role for system-only targets (Loan IN_WORKOUT and REO, WorkoutPlan CONSULTATION / CONSENT_SATISFIED / SUPERSEDED, AppraisalReduction RECALCULATED)."

  - priority: 12
    category: state
    check: "The loan named by a borrower request is in servicing_status SPECIAL_SERVICING or IN_WORKOUT"
    error_id: ERR_LOAN_NOT_IN_SPECIAL_SERVICING
    http_status: 409
    applies_to: "POST /borrower-requests"
    description: "A master-serviced loan's requests are handled by the master servicer, not the special servicer, so intake is refused before any fiscal check on the deposit."

  - priority: 13
    category: business_safety
    check: "The controlling class's rights on the subject have been satisfied: for rights_type == CONSENT_RIGHT the consultation status IN {CONSENTED, DEEMED_CONSENTED, WAIVED}; for rights_type == CONSULTATION_ONLY any status other than PENDING"
    error_id: ERR_CONSULTATION_NOT_SATISFIED
    http_status: 409
    applies_to: "POST /borrower-requests/{id}/status (to_status APPROVED), POST /workout-plans/{id}/status (to_status APPROVED)"
    description: "Approving over a live consent right is the single most serious breach in the domain, so it outranks every fiscal and temporal rule below."

  - priority: 14
    category: business_safety
    check: "The servicing standard is satisfied: a BorrowerRequest may reach RECOMMENDED only with servicing_standard_conclusion == SERVICING_STANDARD_MET, and a WorkoutPlan may be recommended only with selected_alternative_id == recommended_alternative_id"
    error_id: ERR_SERVICING_STANDARD_VIOLATION
    http_status: 422
    applies_to: "POST /borrower-requests/{id}/status (to_status RECOMMENDED), POST /workout-plans/{id}/status (to_status RECOMMENDED)"
    description: "Ranks BELOW the referential check at priority 7, so naming an alternative that belongs to a different plan reports the mismatch rather than the standard breach."

  - priority: 15
    category: business_temporal
    check: "closing_date <= reo_asset.remic_disposition_deadline (= acquired_on + 3 calendar years)"
    error_id: ERR_REMIC_DEADLINE_EXCEEDED
    http_status: 422
    applies_to: "POST /reo-assets/{id}/status (to_status SOLD)"
    description: "Inclusive at the boundary: a closing exactly on the third anniversary is permitted, one day later is not."

  - priority: 16
    category: business_temporal
    check: "An Appraisal exists on the loan with status == ACCEPTED and coverage_start_date <= now < coverage_end_date"
    error_id: ERR_STALE_APPRAISAL
    http_status: 422
    applies_to: "POST /borrower-requests/{id}/status (to_status RECOMMENDED), POST /workout-plans/{id}/status (to_status EXECUTED)"
    description: "Cross-entity: the BorrowerRequest or WorkoutPlan is impeccable, but the Appraisal it relies on has expired or was never accepted. The window is half-open, so now == coverage_end_date is already stale."

  - priority: 17
    category: business_temporal
    check: "For request_type == LEASE_APPROVAL, no other BorrowerRequest with the same (loan_id, suite_code) and status == APPROVED has a lease term that overlaps [lease_commencement_date, lease_expiration_date] treated as a CLOSED interval"
    error_id: ERR_LEASE_TERM_OVERLAP
    http_status: 409
    applies_to: "POST /borrower-requests/{id}/status (to_status APPROVED)"
    description: "Closed-interval semantics: a new term starting on the day the existing term expires DOES overlap and is refused; starting the following day is accepted. Contrast priority 18, which is half-open."

  - priority: 18
    category: business_temporal
    check: "No other Appraisal on the same loan_id with status IN {RECEIVED, ACCEPTED} has a coverage window overlapping [as_of_date, as_of_date + valuation_valid_months) treated as a HALF-OPEN interval"
    error_id: ERR_APPRAISAL_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /appraisals/{id}/status (to_status RECEIVED)"
    description: "Half-open semantics: a new window starting exactly on an existing window's coverage_end_date is ADJACENT, not overlapping, and is accepted; one day earlier is refused. REJECTED, SUPERSEDED and CANCELLED appraisals release their windows."

  - priority: 19
    category: business_temporal
    check: "No other FeeAccrual on the same (loan_id, fee_type) with status != WAIVED has an accrual period overlapping [period_start, period_end] treated as a CLOSED interval"
    error_id: ERR_FEE_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /fee-accruals (fee_type SPECIAL_SERVICING_FEE)"
    description: "Prevents double-charging the same month. A WAIVED accrual releases its period."

  - priority: 20
    category: business_temporal
    check: "The current logical clock is <= consultation.deadline_at"
    error_id: ERR_CONSULTATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /consultations/{id}/response"
    description: "Inclusive at the boundary. Ranks below the ownership check at priority 4, so a representative of the wrong trust responding after the deadline is told ERR_NOT_RESOURCE_OWNER."

  - priority: 21
    category: business_capacity
    check: "borrower_request.info_request_count < 2"
    error_id: ERR_INFO_REQUEST_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /borrower-requests/{id}/status (to_status INFO_REQUESTED)"
    description: "Caps the UNDER_ANALYSIS -> INFO_REQUESTED cycle at two round trips; the third attempt is refused even though the transition itself is legal."

  - priority: 22
    category: business_capacity
    check: "workout_plan.revision_round < 3"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /workout-plans/{id}/status (to_status DRAFT)"
    description: "Caps the OBJECTED -> DRAFT revision cycle at three rounds; the fourth objection leaves ABANDONED as the only exit."

  - priority: 23
    category: business_safety
    check: "At least one WorkoutAlternative on the plan has status == PROPOSED and is not named by any sibling's supersedes_alternative_id"
    error_id: ERR_NO_ALTERNATIVES
    http_status: 422
    applies_to: "POST /workout-plans/{id}/status (to_status SCORED)"
    description: "A plan whose only alternative has been superseded scores an empty pool; the ranking has no rank-1 to name, so the transition is refused rather than producing a null recommendation."

  - priority: 24
    category: business_safety
    check: "At least one ServicingTransferEvent on the loan has triggers_transfer == true and consumed_by_transfer == false"
    error_id: ERR_NO_QUALIFYING_TRANSFER_EVENT
    http_status: 422
    applies_to: "POST /loans/{id}/servicing-status (to_status SPECIAL_SERVICING)"
    description: "A loan with only an OTHER_MATERIAL_DEFAULT event, or whose sole qualifying event was already consumed by an earlier transfer, cannot be transferred again."

  - priority: 25
    category: business_fiscal
    check: "The loan has no FeeAccrual of the conflicting type with status != WAIVED: a WORKOUT_FEE conflicts with an existing LIQUIDATION_FEE and vice versa"
    error_id: ERR_FEE_TYPE_CONFLICT
    http_status: 409
    applies_to: "POST /fee-accruals"
    description: "Workout fee and liquidation fee are mutually exclusive on a single loan. Waiving the earlier accrual clears the conflict."

  - priority: 26
    category: business_fiscal
    check: "processing_fee_deposit_usd >= the request_type's floor per calculations.request_deposit_floor"
    error_id: ERR_DEPOSIT_BELOW_MINIMUM
    http_status: 402
    applies_to: "POST /borrower-requests"
    description: "Inclusive at the boundary. Ranks BELOW the state check at priority 12, so a request against a master-serviced loan with a sub-floor deposit reports ERR_LOAN_NOT_IN_SPECIAL_SERVICING."

  - priority: 27
    category: business_fiscal
    check: "For advance_type == PI_ADVANCE, amount_usd <= loan.required_monthly_pi_advance_usd"
    error_id: ERR_ADVANCE_EXCEEDS_ARA_ADJUSTED_OBLIGATION
    http_status: 422
    applies_to: "POST /advances"
    description: "Once an appraisal reduction is EFFECTIVE the master servicer's obligation shrinks, and advancing more than the reduced figure would move recoverable risk onto the trust. Inclusive at the boundary."

  - priority: 28
    category: business_safety
    check: "No Advance on the loan has status == DEEMED_NONRECOVERABLE"
    error_id: ERR_NONRECOVERABLE_ADVANCE_OUTSTANDING
    http_status: 409
    applies_to: "POST /advances"
    description: "Once any advance on the loan has been deemed non-recoverable the servicer stops funding that asset entirely, regardless of advance type or amount."

  - priority: 29
    category: business_fiscal
    check: "For fee_type == WORKOUT_FEE, loan.servicing_status == MASTER_SERVICING and loan.correction_source_plan_id is not null"
    error_id: ERR_WORKOUT_FEE_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /fee-accruals"
    description: "The workout fee is earned only on a loan that actually completed the correction cycle and was handed back to the master servicer."

  - priority: 30
    category: business_referential
    check: "The selected alternative's alternative_type agrees with the operation: CORRECTED requires MODIFICATION, LIQUIDATED requires NOTE_SALE, an REOAsset's acquisition_type must equal the source plan's selected alternative_type"
    error_id: ERR_ALTERNATIVE_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /loans/{id}/servicing-status (to_status CORRECTED or LIQUIDATED), POST /reo-assets"
    description: "The executed workout dictates the disposal route; a foreclosure plan cannot be used to correct a loan."

  - priority: 31
    category: business_capacity
    check: "loan.consecutive_timely_payments >= 3"
    error_id: ERR_INSUFFICIENT_TIMELY_PAYMENTS
    http_status: 422
    applies_to: "POST /loans/{id}/servicing-status (to_status MASTER_SERVICING)"
    description: "A corrected loan returns to the master servicer only after three consecutive timely payments under the modified terms. Inclusive at the boundary: exactly 3 succeeds, 2 does not."

  - priority: 32
    category: business_fiscal
    check: "liquidation_expenses_usd > 0 and liquidation_expenses_usd + the computed liquidation fee <= gross_proceeds_usd"
    error_id: ERR_LIQUIDATION_EXPENSE_REQUIRED
    http_status: 422
    applies_to: "POST /reo-assets/{id}/status (to_status SOLD), POST /loans/{id}/servicing-status (to_status LIQUIDATED)"
    description: "A disposition with no closing costs is not credible, and expenses plus fee exceeding gross proceeds would drive the waterfall negative."

  - priority: 33
    category: business_safety
    check: "loan_number is unique within trust_id"
    error_id: ERR_DUPLICATE_LOAN_NUMBER
    http_status: 409
    applies_to: "POST /loans"
    description: "Two loans in the same trust may not share a servicer loan number; the same number in a different trust is permitted."

# =============================================================================
# §1.5 API Endpoint Table
#   Reads: 26 (13 single-resource GETs, 12 filtered list GETs, 1 computed read)
#   Writes: 26
#   Every FK in §1.1 is reverse-reachable: 11 children through their filtered
#   list GET, ServicingTransferEvent through the loans sub-resource GET.
# =============================================================================
endpoints:
  # --------------------------- reads: Trust ---------------------------------
  - method: GET
    path: /special-servicing/trusts/{id}
    description: "Read one securitization trust, including the live control test outputs (controlling_class_notional_usd, control_status) and the ledger roll-ups. Returns the trust's current version, which is the value a caller must pass as expected_trust_version."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, ControllingClassRepresentative, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Trust
    side_effects: []

  - method: GET
    path: /special-servicing/trusts
    description: "List trusts, newest first by created_at DESC, with standard pagination."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: Trust[]
    side_effects: []

  # --------------------------- reads: Loan ----------------------------------
  - method: GET
    path: /special-servicing/loans/{id}
    description: "Read one mortgage loan with both status dimensions, the effective appraisal reduction, the ARA-adjusted advance obligation and the advance/fee roll-ups. Returns the loan's current version, which is the value a caller must pass as expected_loan_version. Reading a loan refreshes the accrued interest on its advances to the current logical clock."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Borrower, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Loan
    side_effects: ["calculations.advance_interest_accrual is refreshed for every OUTSTANDING / PARTIALLY_REIMBURSED Advance on the loan"]

  - method: GET
    path: /special-servicing/loans
    description: "List loans filtered by trust, by either status dimension, or by the workout plan that is currently active on them / that corrected them. Reverse-reachability GET for Loan.trust_id, Loan.active_workout_plan_id and Loan.correction_source_plan_id."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: ["trust_id?", "servicing_status?", "payment_status?", "active_workout_plan_id?", "correction_source_plan_id?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: GET
    path: /special-servicing/loans/{id}/transfer-events
    description: "List the append-only servicing transfer event log for one loan, oldest first by (occurred_on ASC, created_at ASC). Reverse-reachability GET for ServicingTransferEvent.loan_id, and the ONLY way to observe an event auto-recorded by the payment_status cascade."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: ["event_code?", "limit?", "offset?"]
    output: ServicingTransferEvent[]
    side_effects: []

  - method: GET
    path: /special-servicing/transfer-events/{id}
    description: "Read one servicing transfer event by its own id. The log is append-only, so this is a pure read: there is no status endpoint and no version on the row."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: ServicingTransferEvent
    side_effects: []

  - method: GET
    path: /special-servicing/loans/{id}/asset-business-plan
    description: "Computed read: the asset business plan status for a loan in special servicing, derived from the loan, its active workout plan and the current logical clock. days_until_due is the whole-day difference between the current logical clock date and asset_business_plan_due_date (negative once overdue); is_overdue is true when the clock is strictly past the due date. Every field is null when the loan has never been transferred to special servicing."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: "{ loan_id: string, transferred_to_special_on: datetime, asset_business_plan_due_date: datetime, days_until_due: integer, is_overdue: boolean, active_workout_plan_id: string, recommended_alternative_type: string, ara_amount_usd: number, required_monthly_pi_advance_usd: number }"
    side_effects: []

  # --------------------------- reads: BorrowerRequest -----------------------
  - method: GET
    path: /special-servicing/borrower-requests/{id}
    description: "Read one borrower request with its servicing standard analysis outputs."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Borrower, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: BorrowerRequest
    side_effects: []

  - method: GET
    path: /special-servicing/borrower-requests
    description: "List borrower requests filtered by loan, type or status. Reverse-reachability GET for BorrowerRequest.loan_id."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Borrower, Trustee, PlatformAdmin]
    code: 200
    input: ["loan_id?", "request_type?", "status?", "suite_code?", "limit?", "offset?"]
    output: BorrowerRequest[]
    side_effects: []

  # --------------------------- reads: Appraisal -----------------------------
  - method: GET
    path: /special-servicing/appraisals/{id}
    description: "Read one appraisal, including its half-open coverage window and the segregation-of-duties user ids."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Appraisal
    side_effects: []

  - method: GET
    path: /special-servicing/appraisals
    description: "List appraisals filtered by loan, type or status, oldest first by created_at ASC. Reverse-reachability GET for Appraisal.loan_id."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: ["loan_id?", "appraisal_type?", "status?", "limit?", "offset?"]
    output: Appraisal[]
    side_effects: []

  # --------------------------- reads: AppraisalReduction --------------------
  - method: GET
    path: /special-servicing/appraisal-reductions/{id}
    description: "Read one appraisal reduction with its frozen deficiency base, the variant that produced it and its effective-date audit fields."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: AppraisalReduction
    side_effects: []

  - method: GET
    path: /special-servicing/appraisal-reductions
    description: "List appraisal reductions filtered by loan, by the appraisal that drove them, or by status. Reverse-reachability GET for AppraisalReduction.loan_id and AppraisalReduction.appraisal_id, and the ONLY way to discover the PROVISIONAL reduction cascade-created by accepting an appraisal."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: ["loan_id?", "appraisal_id?", "status?", "limit?", "offset?"]
    output: AppraisalReduction[]
    side_effects: []

  # --------------------------- reads: Advance -------------------------------
  - method: GET
    path: /special-servicing/advances/{id}
    description: "Read one servicer advance. The read refreshes accrued_interest_usd to the current logical clock via calculations.advance_interest_accrual and stamps interest_accrued_through."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: Advance
    side_effects: ["calculations.advance_interest_accrual refreshes accrued_interest_usd and interest_accrued_through"]

  - method: GET
    path: /special-servicing/advances
    description: "List advances filtered by loan, type or status, oldest first by (advanced_on ASC, created_at ASC) — the same order the liquidation waterfall reimburses them in. Reverse-reachability GET for Advance.loan_id."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: ["loan_id?", "advance_type?", "status?", "limit?", "offset?"]
    output: Advance[]
    side_effects: ["calculations.advance_interest_accrual refreshes each returned advance"]

  # --------------------------- reads: WorkoutPlan ---------------------------
  - method: GET
    path: /special-servicing/workout-plans/{id}
    description: "Read one workout plan with its recommendation, selection, revision count and consent requirement."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, ControllingClassRepresentative, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: WorkoutPlan
    side_effects: []

  - method: GET
    path: /special-servicing/workout-plans
    description: "List workout plans filtered by loan, status, or by the alternative they recommended / selected. Reverse-reachability GET for WorkoutPlan.loan_id, WorkoutPlan.recommended_alternative_id and WorkoutPlan.selected_alternative_id."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, ControllingClassRepresentative, Trustee, PlatformAdmin]
    code: 200
    input: ["loan_id?", "status?", "recommended_alternative_id?", "selected_alternative_id?", "npv_basis?", "limit?", "offset?"]
    output: WorkoutPlan[]
    side_effects: []

  # --------------------------- reads: WorkoutAlternative --------------------
  - method: GET
    path: /special-servicing/workout-alternatives/{id}
    description: "Read one workout alternative with its discounted present value, net present value and rank."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, ControllingClassRepresentative, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: WorkoutAlternative
    side_effects: []

  - method: GET
    path: /special-servicing/workout-alternatives
    description: "List workout alternatives filtered by plan, by the alternative they supersede, by type or by status, ordered by (rank ASC NULLS LAST, created_at ASC). Reverse-reachability GET for WorkoutAlternative.workout_plan_id and the self-FK WorkoutAlternative.supersedes_alternative_id."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, ControllingClassRepresentative, Trustee, PlatformAdmin]
    code: 200
    input: ["workout_plan_id?", "supersedes_alternative_id?", "alternative_type?", "status?", "limit?", "offset?"]
    output: WorkoutAlternative[]
    side_effects: []

  # --------------------------- reads: ConsultationRequest -------------------
  - method: GET
    path: /special-servicing/consultations/{id}
    description: "Read one controlling class consultation, including rights_type, deadline_at and the response audit fields."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, ControllingClassRepresentative, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: ConsultationRequest
    side_effects: []

  - method: GET
    path: /special-servicing/consultations
    description: "List consultations filtered by trust, by either polymorphic subject FK, by rights type or by status, ordered by (deadline_at ASC, created_at ASC) — the same order the sweep processes them in. Reverse-reachability GET for ConsultationRequest.trust_id, ConsultationRequest.workout_plan_id and ConsultationRequest.borrower_request_id."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, ControllingClassRepresentative, Trustee, PlatformAdmin]
    code: 200
    input: ["trust_id?", "workout_plan_id?", "borrower_request_id?", "subject_type?", "rights_type?", "status?", "limit?", "offset?"]
    output: ConsultationRequest[]
    side_effects: []

  # --------------------------- reads: REOAsset ------------------------------
  - method: GET
    path: /special-servicing/reo-assets/{id}
    description: "Read one real-estate-owned asset with its REMIC disposition deadline and sale figures."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: REOAsset
    side_effects: []

  - method: GET
    path: /special-servicing/reo-assets
    description: "List REO assets filtered by loan, by the workout plan that produced them, by acquisition type or by status. Reverse-reachability GET for REOAsset.loan_id and REOAsset.source_workout_plan_id."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: ["loan_id?", "source_workout_plan_id?", "acquisition_type?", "status?", "limit?", "offset?"]
    output: REOAsset[]
    side_effects: []

  # --------------------------- reads: FeeAccrual ----------------------------
  - method: GET
    path: /special-servicing/fee-accruals/{id}
    description: "Read one fee accrual with the basis, rate and amount actually applied."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: FeeAccrual
    side_effects: []

  - method: GET
    path: /special-servicing/fee-accruals
    description: "List fee accruals filtered by loan, fee type or status, oldest first by created_at ASC. Reverse-reachability GET for FeeAccrual.loan_id, and the ONLY way to discover the LIQUIDATION_FEE accrual created by the waterfall."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, Trustee, PlatformAdmin]
    code: 200
    input: ["loan_id?", "fee_type?", "status?", "limit?", "offset?"]
    output: FeeAccrual[]
    side_effects: []

  # --------------------------- reads: DistributionReport --------------------
  - method: GET
    path: /special-servicing/distribution-reports/{id}
    description: "Read one distribution report with its frozen trust snapshot and recipient list."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, ControllingClassRepresentative, Trustee, PlatformAdmin]
    code: 200
    input: []
    output: DistributionReport
    side_effects: []

  - method: GET
    path: /special-servicing/distribution-reports
    description: "List distribution reports filtered by trust, report type or status. Reverse-reachability GET for DistributionReport.trust_id."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer, ControllingClassRepresentative, Trustee, PlatformAdmin]
    code: 200
    input: ["trust_id?", "report_type?", "status?", "limit?", "offset?"]
    output: DistributionReport[]
    side_effects: []

  # --------------------------- writes ---------------------------------------
  - method: POST
    path: /special-servicing/trusts
    description: "Create a securitization trust. control_status starts CONTROLLING and controlling_class_notional_usd starts equal to original_controlling_class_balance_usd; every rate field has a default so a minimal body is legal."
    roles: [PlatformAdmin]
    code: 201
    input: ["deal_name", "closing_date", "original_controlling_class_balance_usd", "special_servicing_fee_annual_pct?", "workout_fee_rate_pct?", "liquidation_fee_rate_pct?", "advance_interest_rate_pct?", "fee_basis_convention?", "consultation_response_business_days?"]
    output: Trust
    side_effects: ["calculations.controlling_class_control_test runs once, yielding CONTROLLING"]

  - method: POST
    path: /special-servicing/loans
    description: "Create a mortgage loan in the trust. servicing_status starts MASTER_SERVICING and payment_status starts CURRENT; required_monthly_pi_advance_usd starts equal to monthly_debt_service_usd."
    roles: [MasterServicer, PlatformAdmin]
    code: 201
    input: ["trust_id", "loan_number", "original_balance_usd", "current_principal_balance_usd", "note_rate_pct", "monthly_debt_service_usd", "maturity_date", "securitization_value_usd", "accrued_unpaid_interest_usd?"]
    output: Loan
    side_effects: ["calculations.ara_adjusted_advance_obligation initialises required_monthly_pi_advance_usd", "trust.loans_in_special_servicing_count is unchanged (a new loan is master-serviced)"]

  - method: POST
    path: /special-servicing/transfer-events
    description: "Record a servicing transfer event against a loan. The event log is append-only and immutable: ServicingTransferEvent has no version and no update endpoint."
    roles: [MasterServicer, SpecialServicerAssetManager]
    code: 201
    input: ["loan_id", "event_code", "occurred_on", "evidence_note", "days_delinquent_at_event?", "imminent_default_certified?"]
    output: ServicingTransferEvent
    side_effects: ["calculations.transfer_event_qualification writes triggers_transfer", "recorded_by_user_id := X-User-ID; consumed_by_transfer := false"]

  - method: POST
    path: /special-servicing/loans/{id}/servicing-status
    description: "Drive the loan's servicing dimension. to_status accepts SPECIAL_SERVICING (MasterServicer), CORRECTED (SpecialServicingCommitteeOfficer), MASTER_SERVICING and LIQUIDATED (SpecialServicerAssetManager); IN_WORKOUT, REO and WRITTEN_OFF are system-only targets and are refused for every role. gross_proceeds_usd, liquidation_expenses_usd and closing_date are required only for to_status = LIQUIDATED."
    roles: [MasterServicer, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer]
    code: 200
    input: ["to_status", "note?", "gross_proceeds_usd?", "liquidation_expenses_usd?", "closing_date?"]
    output: Loan
    side_effects: ["consumes the oldest qualifying ServicingTransferEvent and stamps transferred_to_special_on / asset_business_plan_due_date on SPECIAL_SERVICING", "reverses the EFFECTIVE AppraisalReduction and re-runs the control test on CORRECTED", "runs calculations.liquidation_proceeds_waterfall on LIQUIDATED", "recomputes trust.loans_in_special_servicing_count"]

  - method: POST
    path: /special-servicing/loans/{id}/payment-status
    description: "Drive the loan's payment dimension, independently of the servicing dimension. timely_payment_recorded is consulted only for to_status = CURRENT and increments consecutive_timely_payments."
    roles: [MasterServicer]
    code: 200
    input: ["to_status", "as_of_date", "timely_payment_recorded?"]
    output: Loan
    side_effects: ["auto-records a MONETARY_DEFAULT_60D ServicingTransferEvent on DELINQUENT_60 and a MATURITY_DEFAULT event on MATURED_UNPAID, each qualified by calculations.transfer_event_qualification", "sets appraisal_required on DELINQUENT_90_PLUS", "maintains consecutive_timely_payments"]

  - method: POST
    path: /special-servicing/borrower-requests
    description: "Intake a borrower request for a modification, assumption or lease approval. Only a loan already in SPECIAL_SERVICING or IN_WORKOUT may receive one. A Borrower caller must present X-User-ID equal to loan_id."
    roles: [Borrower, SpecialServicerAssetManager]
    code: 201
    input: ["loan_id", "request_type", "processing_fee_deposit_usd", "requested_terms_note", "proposed_rate_pct?", "proposed_maturity_date?", "assumption_buyer_name?", "suite_code?", "lease_commencement_date?", "lease_expiration_date?", "lease_base_rent_annual_usd?"]
    output: BorrowerRequest
    side_effects: ["calculations.request_deposit_floor enforces the type-specific deposit floor at validation priority 26", "status starts SUBMITTED and info_request_count starts 0"]

  - method: POST
    path: /special-servicing/borrower-requests/{id}/analysis
    description: "Record the servicing standard analysis for a request under analysis. Writes the two net present value figures and derives servicing_standard_margin_usd and servicing_standard_conclusion. Callable repeatedly while the request is UNDER_ANALYSIS; each call overwrites the previous conclusion."
    roles: [SpecialServicerAssetManager]
    code: 200
    input: [npv_recovery_with_request_usd, npv_recovery_without_request_usd, analysis_discount_rate_pct]
    output: BorrowerRequest
    side_effects: ["calculations.servicing_standard_analysis writes servicing_standard_margin_usd and servicing_standard_conclusion"]

  - method: POST
    path: /special-servicing/borrower-requests/{id}/status
    description: "Drive the borrower request intake workflow. to_status accepts UNDER_ANALYSIS / INFO_REQUESTED / RECOMMENDED (SpecialServicerAssetManager), APPROVED / DENIED (SpecialServicingCommitteeOfficer) and WITHDRAWN (Borrower, who must own the loan). CONSULTATION_PENDING is a system-only target."
    roles: [Borrower, SpecialServicerAssetManager, SpecialServicingCommitteeOfficer]
    code: 200
    input: ["to_status", "note?"]
    output: BorrowerRequest
    side_effects: ["increments info_request_count and clears the analysis on INFO_REQUESTED", "checks the controlling class consultation on APPROVED", "checks the closed-interval lease overlap on APPROVED of a LEASE_APPROVAL", "stamps decided_on / decided_by_user_id on APPROVED and DENIED", "sets loan.is_modified on APPROVED of a MODIFICATION"]

  - method: POST
    path: /special-servicing/appraisals
    description: "Order an appraisal on a loan's collateral. status starts ORDERED, due_date is stamped at ordered_on + 60 days, and ordered_by_user_id records the orderer, who is then barred from accepting or rejecting the result."
    roles: [SpecialServicerAssetManager]
    code: 201
    input: ["loan_id", "appraisal_type", "ordered_on", "appraiser_firm", "valuation_valid_months?"]
    output: Appraisal
    side_effects: ["due_date := ordered_on + 60 calendar days", "ordered_by_user_id := X-User-ID"]

  - method: POST
    path: /special-servicing/appraisals/{id}/status
    description: "Drive the appraisal lifecycle. to_status = RECEIVED carries value_usd, as_of_date and (only for FULL_NARRATIVE) estimated_liquidation_expenses_usd, and claims the half-open coverage window. to_status = ACCEPTED cascade-creates the PROVISIONAL appraisal reduction. SUPERSEDED is a system-only target."
    roles: [SpecialServicerAssetManager]
    code: 200
    input: ["to_status", "value_usd?", "as_of_date?", "estimated_liquidation_expenses_usd?", "rejection_reason?"]
    output: Appraisal
    side_effects: ["stamps coverage_start_date / coverage_end_date / received_on on RECEIVED after the half-open overlap check", "on ACCEPTED: supersedes the prior ACCEPTED appraisal, moves its EFFECTIVE reduction to RECALCULATED, runs calculations.appraisal_reduction_amount to create a PROVISIONAL AppraisalReduction, sets loan.last_appraised_value_usd and clears loan.appraisal_required"]

  - method: POST
    path: /special-servicing/appraisal-reductions/{id}/status
    description: "Make a provisional appraisal reduction effective, or reverse one. This is the entry point of the deepest cascade in the domain: EFFECTIVE rewrites the loan's advance obligation, the trust's total appraisal reduction, the controlling class notional, the control status and every pending consultation. RECALCULATED is a system-only target."
    roles: [SpecialServicingCommitteeOfficer]
    code: 200
    input: ["to_status", "reversal_reason?"]
    output: AppraisalReduction
    side_effects: ["on EFFECTIVE: loan.ara_amount_usd, calculations.ara_adjusted_advance_obligation, trust.total_ara_usd, calculations.controlling_class_control_test, and the consultation downgrade / plan CONSENT_SATISFIED cascade", "on REVERSED: every one of those effects is compensated back to its pre-effective value except the consultation downgrade, which is permanent"]

  - method: POST
    path: /special-servicing/advances
    description: "Record a servicer advance out of the servicer's own funds. A PI_ADVANCE may not exceed loan.required_monthly_pi_advance_usd, and no advance of any type is permitted once any advance on the loan has been deemed non-recoverable."
    roles: [MasterServicer]
    code: 201
    input: [loan_id, advance_type, amount_usd, advanced_on]
    output: Advance
    side_effects: ["validation priority 27 compares amount_usd against the ARA-adjusted obligation", "validation priority 28 blocks the loan entirely once an advance is DEEMED_NONRECOVERABLE", "recomputes loan.advances_outstanding_usd and trust.total_advances_outstanding_usd"]

  - method: POST
    path: /special-servicing/advances/{id}/status
    description: "Deem an advance non-recoverable (SpecialServicingCommitteeOfficer) or reverse an unreimbursed advance (MasterServicer). REIMBURSED and PARTIALLY_REIMBURSED are system-only targets reachable solely through the liquidation waterfall."
    roles: [MasterServicer, SpecialServicingCommitteeOfficer]
    code: 200
    input: [to_status, reversal_reason]
    output: Advance
    side_effects: ["on REVERSED: accrued_interest_usd is zeroed and both the loan and trust advance roll-ups return to their exact pre-advance values", "on DEEMED_NONRECOVERABLE: the unreimbursed principal leaves both roll-ups and the loan stops accepting new advances"]

  - method: POST
    path: /special-servicing/workout-plans
    description: "Create a workout plan on a loan in special servicing. Because the plan supersedes any live DRAFT or SCORED plan and rewrites loan.active_workout_plan_id, the body must carry expected_loan_version matching the loan's current version."
    roles: [SpecialServicerAssetManager]
    code: 201
    input: ["loan_id", "discount_rate_pct", "npv_basis?", "expected_loan_version"]
    output: WorkoutPlan
    side_effects: ["OCC check at validation priority 9 against Loan.version", "loan.servicing_status SPECIAL_SERVICING -> IN_WORKOUT and loan.active_workout_plan_id := the new plan", "any prior DRAFT or SCORED plan on the loan -> SUPERSEDED", "prepared_by_user_id := X-User-ID"]

  - method: POST
    path: /special-servicing/workout-alternatives
    description: "Add a workout alternative to a DRAFT plan, optionally superseding a sibling alternative in the same plan. projected_cash_flows is an array of { period_index, amount_usd } with at most one entry per period_index."
    roles: [SpecialServicerAssetManager]
    code: 201
    input: ["workout_plan_id", "alternative_type", "projected_cash_flows", "upfront_cost_usd", "supersedes_alternative_id?"]
    output: WorkoutAlternative
    side_effects: ["the superseded sibling moves to SUPERSEDED, loses its rank and is permanently excluded from the ranking pool", "status starts PROPOSED with npv_usd, discounted_pv_usd and rank all null"]

  - method: POST
    path: /special-servicing/workout-plans/{id}/status
    description: "Drive the workout plan workflow. to_status accepts SCORED / RECOMMENDED / DRAFT (revision) / EXECUTED / ABANDONED (SpecialServicerAssetManager) and APPROVED (SpecialServicingCommitteeOfficer). CONSULTATION, CONSENT_SATISFIED, OBJECTED and SUPERSEDED are system-only targets. selected_alternative_id is required only for to_status = RECOMMENDED."
    roles: [SpecialServicerAssetManager, SpecialServicingCommitteeOfficer]
    code: 200
    input: ["to_status", "selected_alternative_id?", "note?"]
    output: WorkoutPlan
    side_effects: ["on SCORED: calculations.workout_alternative_npv then calculations.workout_alternative_ranking, refused with ERR_NO_ALTERNATIVES on an empty pool", "on RECOMMENDED: the selection must equal the rank-1 recommendation; siblings become DISCARDED", "on DRAFT: increments revision_round, clears the scores and returns every alternative to PROPOSED", "on APPROVED: segregation of duties against prepared_by_user_id", "on EXECUTED: appraisal freshness check, executed_on stamp, loan.is_modified for a MODIFICATION"]

  - method: POST
    path: /special-servicing/consultations
    description: "Issue a controlling class consultation on a RECOMMENDED workout plan or a RECOMMENDED borrower request. rights_type snapshots the trust's control status at issue and deadline_at is computed by the business-day rule. Exactly one of workout_plan_id / borrower_request_id must be present, selected by subject_type."
    roles: [SpecialServicerAssetManager]
    code: 201
    input: ["trust_id", "subject_type", "workout_plan_id?", "borrower_request_id?"]
    output: ConsultationRequest
    side_effects: ["rights_type := CONSENT_RIGHT when trust.control_status == CONTROLLING, else CONSULTATION_ONLY", "calculations.consultation_response_deadline writes deadline_at", "the subject advances RECOMMENDED -> CONSULTATION (plan) or RECOMMENDED -> CONSULTATION_PENDING (request)"]

  - method: POST
    path: /special-servicing/consultations/{id}/response
    description: "Record the controlling class representative's response. The caller must present X-User-ID equal to the consultation's trust_id and must respond no later than deadline_at. An objection from a CONSULTATION_ONLY representative is advisory and does not block the subject."
    roles: [ControllingClassRepresentative]
    code: 200
    input: ["response", "response_note?"]
    output: ConsultationRequest
    side_effects: ["stamps responded_at / responded_by_user_id", "cascades the subject workout plan to CONSENT_SATISFIED on consent, or to OBJECTED only when rights_type == CONSENT_RIGHT"]

  - method: POST
    path: /special-servicing/consultations/sweep
    description: "Sweep every PENDING consultation whose deadline has passed and deem it consented. A consultation whose deadline_at is exactly equal to the current logical clock is NOT swept — the comparison is strictly greater-than. Matching consultations are processed in (deadline_at ASC, created_at ASC) order."
    roles: [PlatformAdmin]
    code: 200
    input: ["trust_id?"]
    output: "{ swept_count: integer, deemed_consented_ids: string[] }"
    side_effects: ["each swept consultation -> DEEMED_CONSENTED", "each WORKOUT_PLAN subject in status CONSULTATION -> CONSENT_SATISFIED"]

  - method: POST
    path: /special-servicing/reo-assets
    description: "Take collateral into the trust's ownership under an EXECUTED foreclosure or deed-in-lieu plan. acquisition_type must equal the source plan's selected alternative type, and remic_disposition_deadline is stamped at acquired_on + 3 calendar years."
    roles: [SpecialServicerAssetManager]
    code: 201
    input: [loan_id, source_workout_plan_id, acquisition_type, acquired_on, initial_noi_annual_usd]
    output: REOAsset
    side_effects: ["loan.servicing_status IN_WORKOUT -> REO and loan.active_workout_plan_id := null", "remic_disposition_deadline := acquired_on + 3 calendar years"]

  - method: POST
    path: /special-servicing/reo-assets/{id}/status
    description: "Drive the REO disposition lifecycle. to_status = MARKETED requires list_price_usd and, when coming back from UNDER_CONTRACT, counts a contract fall-through. to_status = SOLD carries gross_proceeds_usd, liquidation_expenses_usd and closing_date and fires the seven-step liquidation waterfall."
    roles: [SpecialServicerAssetManager, SpecialServicingCommitteeOfficer]
    code: 200
    input: ["to_status", "list_price_usd?", "gross_proceeds_usd?", "liquidation_expenses_usd?", "closing_date?"]
    output: REOAsset
    side_effects: ["on SOLD: the REMIC deadline check, then calculations.liquidation_proceeds_waterfall — LIQUIDATION_FEE accrual, advance reimbursement oldest-first, accrued interest, principal, realized loss, excess proceeds — then loan -> LIQUIDATED, the EFFECTIVE reduction -> REVERSED and a re-run of calculations.controlling_class_control_test", "on WRITTEN_OFF: full principal plus outstanding advance principal becomes realized loss and loan -> WRITTEN_OFF"]

  - method: POST
    path: /special-servicing/fee-accruals
    description: "Accrue a special servicing fee for a closed month or a workout fee on a collection. LIQUIDATION_FEE accruals are never created here — only the waterfall creates them. Workout fee and liquidation fee are mutually exclusive on one loan."
    roles: [MasterServicer, SpecialServicerAssetManager]
    code: 201
    input: ["loan_id", "fee_type", "period_start?", "period_end?", "collection_amount_usd?"]
    output: FeeAccrual
    side_effects: ["calculations.special_servicing_fee_accrual (dual-variant, monthly floor) or calculations.workout_fee_accrual (rate, cap, eligibility)", "closed-interval period overlap check at validation priority 19", "accrued_by_user_id := X-User-ID; recomputes loan.fees_payable_usd"]

  - method: POST
    path: /special-servicing/fee-accruals/{id}/status
    description: "Collect an accrued fee (MasterServicer) or waive it (SpecialServicingCommitteeOfficer, who must not be the accruing user). Waiving releases the accrual period so the same month can be accrued again."
    roles: [MasterServicer, SpecialServicingCommitteeOfficer]
    code: 200
    input: ["to_status", "waived_reason?"]
    output: FeeAccrual
    side_effects: ["on COLLECTED: stamps collected_on and removes the fee from loan.fees_payable_usd", "on WAIVED: segregation of duties against accrued_by_user_id, compensates loan.fees_payable_usd exactly, releases the (loan_id, fee_type, period) slot"]

  - method: POST
    path: /special-servicing/distribution-reports
    description: "Open a CREFC-style distribution report on a trust, freezing five snapshot fields off the trust row. Because a report built from a stale read would misstate the trust to the trustee, the rating agencies and the certificate holders, the body must carry expected_trust_version matching the trust's current version."
    roles: [SpecialServicerAssetManager, Trustee]
    code: 201
    input: [trust_id, report_type, period_end, expected_trust_version]
    output: DistributionReport
    side_effects: ["OCC check at validation priority 9 against Trust.version", "snapshots loans_in_special_count, total_ara_snapshot_usd, total_advances_outstanding_snapshot_usd, realized_loss_snapshot_usd and control_status_snapshot"]

  - method: POST
    path: /special-servicing/distribution-reports/{id}/status
    description: "Certify, distribute or void a report. Only the Trustee may drive this workflow. to_status = DISTRIBUTED requires a non-empty recipients array drawn from TRUSTEE, RATING_AGENCIES, CERTIFICATE_HOLDERS and CONTROLLING_CLASS_REPRESENTATIVE."
    roles: [Trustee]
    code: 200
    input: ["to_status", "recipients?"]
    output: DistributionReport
    side_effects: ["on CERTIFIED: stamps certified_by_user_id and freezes the snapshot permanently", "on DISTRIBUTED: stores recipients and stamps distributed_at"]

  - method: POST
    path: /special-servicing/_clock/set_current_utc
    description: "Test-driving endpoint: set the server's logical clock to any instant. Every deadline, coverage window, day count and accrual in this domain is measured against this clock, never against wall-clock time. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z, which is the mandatory server startup default and sits at or before every fixture date used in §1.8 and §1.9."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["all subsequent business-day, coverage-window, 30/360 accrual and deadline evaluations use the new instant", "no stored row is mutated by the call itself"]

# =============================================================================
# §1.6 Error Code Catalog (45 codes; every code is triggerable — see §1.9)
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http_status: 401, condition: "X-User-ID or X-User-Role header missing, empty, or X-User-Role not one of the seven §1.7 roles", applies_to: [all] }
  - { id: ERR_ROLE_NOT_PERMITTED, http_status: 403, condition: "X-User-Role is a valid role but is not in the target endpoint's roles list", applies_to: [all] }
  - { id: ERR_NOT_RESOURCE_OWNER, http_status: 403, condition: "An entity_backed caller's X-User-ID does not equal the owning key: Borrower vs loan_id, ControllingClassRepresentative vs trust_id", applies_to: ["POST /special-servicing/borrower-requests", "POST /special-servicing/borrower-requests/{id}/status", "POST /special-servicing/consultations/{id}/response", "GET /special-servicing/loans/{id}", "GET /special-servicing/borrower-requests/{id}"] }
  - { id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, condition: "X-User-ID equals the row's authoring user id on a blessing operation (accept/reject an appraisal, approve a workout plan, waive a fee accrual)", applies_to: ["POST /special-servicing/appraisals/{id}/status", "POST /special-servicing/workout-plans/{id}/status", "POST /special-servicing/fee-accruals/{id}/status"] }
  - { id: ERR_ROLE_NOT_PERMITTED_FOR_STATUS, http_status: 403, condition: "The caller's role may call the endpoint but may not request this particular to_status, or the to_status is a system-only target (Loan IN_WORKOUT / REO, WorkoutPlan CONSULTATION / CONSENT_SATISFIED / OBJECTED / SUPERSEDED, AppraisalReduction RECALCULATED, Advance REIMBURSED / PARTIALLY_REIMBURSED, Appraisal SUPERSEDED)", applies_to: ["POST /special-servicing/loans/{id}/servicing-status", "POST /special-servicing/borrower-requests/{id}/status", "POST /special-servicing/appraisals/{id}/status", "POST /special-servicing/appraisal-reductions/{id}/status", "POST /special-servicing/advances/{id}/status", "POST /special-servicing/workout-plans/{id}/status", "POST /special-servicing/reo-assets/{id}/status", "POST /special-servicing/fee-accruals/{id}/status", "POST /special-servicing/distribution-reports/{id}/status"] }
  - { id: ERR_INVALID_REQUEST, http_status: 400, condition: "Malformed body, missing required field, wrong type, enum value outside its declared set, numeric constraint violated, conditionally-forbidden field present, empty recipients array, or a projected_cash_flows entry with period_index < 1 or a duplicate period_index", applies_to: ["all POST endpoints"] }
  - { id: ERR_TRUST_NOT_FOUND, http_status: 404, condition: "No Trust row for the path id or the body trust_id", applies_to: ["GET /special-servicing/trusts/{id}", "POST /special-servicing/loans", "POST /special-servicing/consultations", "POST /special-servicing/distribution-reports"] }
  - { id: ERR_LOAN_NOT_FOUND, http_status: 404, condition: "No Loan row for the path id or the body loan_id", applies_to: ["GET /special-servicing/loans/{id}", "GET /special-servicing/loans/{id}/transfer-events", "GET /special-servicing/loans/{id}/asset-business-plan", "POST /special-servicing/loans/{id}/servicing-status", "POST /special-servicing/loans/{id}/payment-status", "POST /special-servicing/transfer-events", "POST /special-servicing/borrower-requests", "POST /special-servicing/appraisals", "POST /special-servicing/advances", "POST /special-servicing/workout-plans", "POST /special-servicing/reo-assets", "POST /special-servicing/fee-accruals"] }
  - { id: ERR_TRANSFER_EVENT_NOT_FOUND, http_status: 404, condition: "No ServicingTransferEvent row for the path id", applies_to: ["GET /special-servicing/transfer-events/{id}"] }
  - { id: ERR_BORROWER_REQUEST_NOT_FOUND, http_status: 404, condition: "No BorrowerRequest row for the path id or the body borrower_request_id", applies_to: ["GET /special-servicing/borrower-requests/{id}", "POST /special-servicing/borrower-requests/{id}/status", "POST /special-servicing/borrower-requests/{id}/analysis", "POST /special-servicing/consultations"] }
  - { id: ERR_APPRAISAL_NOT_FOUND, http_status: 404, condition: "No Appraisal row for the path id or the body appraisal_id", applies_to: ["GET /special-servicing/appraisals/{id}", "POST /special-servicing/appraisals/{id}/status"] }
  - { id: ERR_APPRAISAL_REDUCTION_NOT_FOUND, http_status: 404, condition: "No AppraisalReduction row for the path id", applies_to: ["GET /special-servicing/appraisal-reductions/{id}", "POST /special-servicing/appraisal-reductions/{id}/status"] }
  - { id: ERR_ADVANCE_NOT_FOUND, http_status: 404, condition: "No Advance row for the path id", applies_to: ["GET /special-servicing/advances/{id}", "POST /special-servicing/advances/{id}/status"] }
  - { id: ERR_WORKOUT_PLAN_NOT_FOUND, http_status: 404, condition: "No WorkoutPlan row for the path id or the body workout_plan_id / source_workout_plan_id", applies_to: ["GET /special-servicing/workout-plans/{id}", "POST /special-servicing/workout-plans/{id}/status", "POST /special-servicing/workout-alternatives", "POST /special-servicing/consultations", "POST /special-servicing/reo-assets"] }
  - { id: ERR_WORKOUT_ALTERNATIVE_NOT_FOUND, http_status: 404, condition: "No WorkoutAlternative row for the path id or the body supersedes_alternative_id / selected_alternative_id", applies_to: ["GET /special-servicing/workout-alternatives/{id}", "POST /special-servicing/workout-alternatives", "POST /special-servicing/workout-plans/{id}/status"] }
  - { id: ERR_CONSULTATION_NOT_FOUND, http_status: 404, condition: "No ConsultationRequest row for the path id", applies_to: ["GET /special-servicing/consultations/{id}", "POST /special-servicing/consultations/{id}/response"] }
  - { id: ERR_REO_ASSET_NOT_FOUND, http_status: 404, condition: "No REOAsset row for the path id", applies_to: ["GET /special-servicing/reo-assets/{id}", "POST /special-servicing/reo-assets/{id}/status"] }
  - { id: ERR_FEE_ACCRUAL_NOT_FOUND, http_status: 404, condition: "No FeeAccrual row for the path id", applies_to: ["GET /special-servicing/fee-accruals/{id}", "POST /special-servicing/fee-accruals/{id}/status"] }
  - { id: ERR_DISTRIBUTION_REPORT_NOT_FOUND, http_status: 404, condition: "No DistributionReport row for the path id", applies_to: ["GET /special-servicing/distribution-reports/{id}", "POST /special-servicing/distribution-reports/{id}/status"] }
  - { id: ERR_SUBJECT_REFERENCE_MISMATCH, http_status: 422, condition: "Two existing rows do not belong together: a consultation subject outside the named trust, a superseded alternative in a different plan, a selected alternative in a different plan, an REO source plan on a different loan", applies_to: ["POST /special-servicing/consultations", "POST /special-servicing/workout-alternatives", "POST /special-servicing/workout-plans/{id}/status", "POST /special-servicing/reo-assets"] }
  - { id: ERR_INVALID_STATE_TRANSITION, http_status: 409, condition: "The requested (from, to) pair is not declared in §1.2, including a repeated identical trigger, any transition out of a terminal state, reversing an already-reimbursed advance, or making a second AppraisalReduction EFFECTIVE on one loan", applies_to: ["every status-driving POST endpoint"] }
  - { id: ERR_STALE_LOAN_VERSION, http_status: 412, condition: "expected_loan_version does not equal the Loan row's current version", applies_to: ["POST /special-servicing/workout-plans"] }
  - { id: ERR_STALE_TRUST_VERSION, http_status: 412, condition: "expected_trust_version does not equal the Trust row's current version", applies_to: ["POST /special-servicing/distribution-reports"] }
  - { id: ERR_LOAN_NOT_IN_SPECIAL_SERVICING, http_status: 409, condition: "A borrower request is submitted against a loan whose servicing_status is not SPECIAL_SERVICING or IN_WORKOUT", applies_to: ["POST /special-servicing/borrower-requests"] }
  - { id: ERR_CONSULTATION_NOT_SATISFIED, http_status: 409, condition: "An approval is attempted while the controlling class's consent right on the subject is still live (consultation PENDING with rights_type CONSENT_RIGHT), or the plan is not in CONSENT_SATISFIED", applies_to: ["POST /special-servicing/borrower-requests/{id}/status", "POST /special-servicing/workout-plans/{id}/status"] }
  - { id: ERR_SERVICING_STANDARD_VIOLATION, http_status: 422, condition: "A request is recommended with servicing_standard_conclusion != SERVICING_STANDARD_MET, or a plan is recommended with selected_alternative_id != recommended_alternative_id", applies_to: ["POST /special-servicing/borrower-requests/{id}/status", "POST /special-servicing/workout-plans/{id}/status"] }
  - { id: ERR_REMIC_DEADLINE_EXCEEDED, http_status: 422, condition: "An REO sale closing_date is strictly after remic_disposition_deadline (acquired_on + 3 calendar years)", applies_to: ["POST /special-servicing/reo-assets/{id}/status"] }
  - { id: ERR_STALE_APPRAISAL, http_status: 422, condition: "No ACCEPTED Appraisal on the loan covers the current logical clock in its half-open window [coverage_start_date, coverage_end_date)", applies_to: ["POST /special-servicing/borrower-requests/{id}/status", "POST /special-servicing/workout-plans/{id}/status"] }
  - { id: ERR_LEASE_TERM_OVERLAP, http_status: 409, condition: "Approving a LEASE_APPROVAL whose closed lease term overlaps an already-APPROVED term on the same (loan_id, suite_code)", applies_to: ["POST /special-servicing/borrower-requests/{id}/status"] }
  - { id: ERR_APPRAISAL_WINDOW_OVERLAP, http_status: 409, condition: "Receiving an appraisal whose half-open coverage window overlaps that of another RECEIVED or ACCEPTED appraisal on the same loan", applies_to: ["POST /special-servicing/appraisals/{id}/status"] }
  - { id: ERR_FEE_PERIOD_OVERLAP, http_status: 409, condition: "Accruing a SPECIAL_SERVICING_FEE whose closed period overlaps a non-WAIVED accrual of the same fee_type on the same loan", applies_to: ["POST /special-servicing/fee-accruals"] }
  - { id: ERR_CONSULTATION_WINDOW_CLOSED, http_status: 409, condition: "A consultation response arrives when the current logical clock is strictly after deadline_at", applies_to: ["POST /special-servicing/consultations/{id}/response"] }
  - { id: ERR_INFO_REQUEST_LIMIT_EXCEEDED, http_status: 422, condition: "A third UNDER_ANALYSIS -> INFO_REQUESTED loop is attempted (info_request_count already 2)", applies_to: ["POST /special-servicing/borrower-requests/{id}/status"] }
  - { id: ERR_REVISION_LIMIT_EXCEEDED, http_status: 422, condition: "A fourth OBJECTED -> DRAFT revision is attempted (revision_round already 3)", applies_to: ["POST /special-servicing/workout-plans/{id}/status"] }
  - { id: ERR_NO_ALTERNATIVES, http_status: 422, condition: "Scoring a plan whose eligible alternative pool is empty — no PROPOSED alternative, or every one of them superseded", applies_to: ["POST /special-servicing/workout-plans/{id}/status"] }
  - { id: ERR_NO_QUALIFYING_TRANSFER_EVENT, http_status: 422, condition: "Transferring a loan with no ServicingTransferEvent that has triggers_transfer == true and consumed_by_transfer == false", applies_to: ["POST /special-servicing/loans/{id}/servicing-status"] }
  - { id: ERR_FEE_TYPE_CONFLICT, http_status: 409, condition: "Accruing a WORKOUT_FEE on a loan that already carries a non-WAIVED LIQUIDATION_FEE, or the reverse", applies_to: ["POST /special-servicing/fee-accruals"] }
  - { id: ERR_DEPOSIT_BELOW_MINIMUM, http_status: 402, condition: "processing_fee_deposit_usd is strictly below the request_type's floor (MODIFICATION 25000, ASSUMPTION 15000, LEASE_APPROVAL 5000)", applies_to: ["POST /special-servicing/borrower-requests"] }
  - { id: ERR_ADVANCE_EXCEEDS_ARA_ADJUSTED_OBLIGATION, http_status: 422, condition: "A PI_ADVANCE amount_usd exceeds loan.required_monthly_pi_advance_usd", applies_to: ["POST /special-servicing/advances"] }
  - { id: ERR_NONRECOVERABLE_ADVANCE_OUTSTANDING, http_status: 409, condition: "Any Advance on the loan has status DEEMED_NONRECOVERABLE", applies_to: ["POST /special-servicing/advances"] }
  - { id: ERR_WORKOUT_FEE_NOT_ELIGIBLE, http_status: 409, condition: "A WORKOUT_FEE is accrued on a loan that is not MASTER_SERVICING with a non-null correction_source_plan_id", applies_to: ["POST /special-servicing/fee-accruals"] }
  - { id: ERR_ALTERNATIVE_TYPE_MISMATCH, http_status: 422, condition: "The executed plan's selected alternative_type does not match the operation: CORRECTED needs MODIFICATION, LIQUIDATED needs NOTE_SALE, an REO acquisition_type must equal FORECLOSURE or DEED_IN_LIEU as selected", applies_to: ["POST /special-servicing/loans/{id}/servicing-status", "POST /special-servicing/reo-assets"] }
  - { id: ERR_INSUFFICIENT_TIMELY_PAYMENTS, http_status: 422, condition: "Returning a CORRECTED loan to MASTER_SERVICING with consecutive_timely_payments < 3", applies_to: ["POST /special-servicing/loans/{id}/servicing-status"] }
  - { id: ERR_LIQUIDATION_EXPENSE_REQUIRED, http_status: 422, condition: "liquidation_expenses_usd is zero or negative, or expenses plus the computed liquidation fee exceed gross_proceeds_usd", applies_to: ["POST /special-servicing/reo-assets/{id}/status", "POST /special-servicing/loans/{id}/servicing-status"] }
  - { id: ERR_DUPLICATE_LOAN_NUMBER, http_status: 409, condition: "loan_number already exists within the same trust_id", applies_to: ["POST /special-servicing/loans"] }

# =============================================================================
# §1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: MasterServicer
    description: "The primary servicer. Boards loans, records servicing transfer events and delinquency, funds advances, hands assets to the special servicer, and collects fees. Pinned test user id: ms-001."
    identity: opaque
    exclusive_operations:
      - "POST /special-servicing/loans/{id}/payment-status (all delinquency and cure transitions)"
      - "POST /special-servicing/loans/{id}/servicing-status with to_status = SPECIAL_SERVICING"
      - "POST /special-servicing/advances"
      - "POST /special-servicing/advances/{id}/status with to_status = REVERSED"
      - "POST /special-servicing/fee-accruals/{id}/status with to_status = COLLECTED"
    shared_operations:
      - "POST /special-servicing/loans (with PlatformAdmin)"
      - "POST /special-servicing/transfer-events (with SpecialServicerAssetManager)"
      - "POST /special-servicing/fee-accruals (with SpecialServicerAssetManager)"
      - "every GET endpoint except the consultation and workout-plan reads reserved to the controlling class"

  - name: SpecialServicerAssetManager
    description: "The special servicer's asset manager. Owns the workout: intake, analysis, appraisal ordering, plan authoring and scoring, consultation issuance, REO marketing. Authoring role in every segregation-of-duties pair. Pinned test user ids: amgr-001 and amgr-002."
    identity: opaque
    exclusive_operations:
      - "POST /special-servicing/borrower-requests/{id}/analysis"
      - "POST /special-servicing/appraisals"
      - "POST /special-servicing/appraisals/{id}/status (RECEIVED, ACCEPTED, REJECTED, CANCELLED)"
      - "POST /special-servicing/workout-plans"
      - "POST /special-servicing/workout-alternatives"
      - "POST /special-servicing/workout-plans/{id}/status with to_status IN {SCORED, RECOMMENDED, DRAFT, EXECUTED, ABANDONED}"
      - "POST /special-servicing/consultations"
      - "POST /special-servicing/reo-assets"
      - "POST /special-servicing/loans/{id}/servicing-status with to_status IN {MASTER_SERVICING, LIQUIDATED}"
    shared_operations:
      - "POST /special-servicing/borrower-requests (with Borrower)"
      - "POST /special-servicing/borrower-requests/{id}/status with to_status IN {UNDER_ANALYSIS, INFO_REQUESTED, RECOMMENDED}"
      - "POST /special-servicing/transfer-events (with MasterServicer)"
      - "POST /special-servicing/reo-assets/{id}/status with to_status IN {STABILIZING, MARKETED, UNDER_CONTRACT} (with SpecialServicingCommitteeOfficer)"
      - "POST /special-servicing/fee-accruals (with MasterServicer)"
      - "POST /special-servicing/distribution-reports (with Trustee)"
      - "every GET endpoint"

  - name: SpecialServicingCommitteeOfficer
    description: "The special servicer's credit committee. Blesses what the asset manager authored and can never be the same human: makes appraisal reductions effective, approves workout plans, decides borrower requests, deems advances non-recoverable, closes REO sales, waives fees. Pinned test user id: cmte-001."
    identity: opaque
    exclusive_operations:
      - "POST /special-servicing/appraisal-reductions/{id}/status (EFFECTIVE, REVERSED)"
      - "POST /special-servicing/workout-plans/{id}/status with to_status = APPROVED"
      - "POST /special-servicing/borrower-requests/{id}/status with to_status IN {APPROVED, DENIED}"
      - "POST /special-servicing/advances/{id}/status with to_status = DEEMED_NONRECOVERABLE"
      - "POST /special-servicing/loans/{id}/servicing-status with to_status = CORRECTED"
      - "POST /special-servicing/reo-assets/{id}/status with to_status IN {SOLD, WRITTEN_OFF}"
      - "POST /special-servicing/fee-accruals/{id}/status with to_status = WAIVED"
    shared_operations:
      - "POST /special-servicing/reo-assets/{id}/status with to_status IN {STABILIZING, MARKETED, UNDER_CONTRACT} (with SpecialServicerAssetManager)"
      - "every GET endpoint"

  - name: ControllingClassRepresentative
    description: "The representative of the controlling class of certificates. Holds consent rights while the class retains at least 25% of its original notional and consultation rights only thereafter. Identified by the trust it represents: X-User-ID must equal the ConsultationRequest's trust_id."
    identity: "entity_backed:Trust"
    exclusive_operations:
      - "POST /special-servicing/consultations/{id}/response (CONSENTED, OBJECTED)"
    shared_operations:
      - "GET /special-servicing/trusts/{id}, GET /special-servicing/consultations, GET /special-servicing/consultations/{id}, GET /special-servicing/workout-plans, GET /special-servicing/workout-plans/{id}, GET /special-servicing/workout-alternatives, GET /special-servicing/workout-alternatives/{id}, GET /special-servicing/distribution-reports, GET /special-servicing/distribution-reports/{id}"

  - name: Borrower
    description: "The mortgage borrower. May submit and withdraw its own requests and read its own loan. Identified by the loan it owes: X-User-ID must equal loan_id."
    identity: "entity_backed:Loan"
    exclusive_operations:
      - "POST /special-servicing/borrower-requests/{id}/status with to_status = WITHDRAWN"
    shared_operations:
      - "POST /special-servicing/borrower-requests (with SpecialServicerAssetManager)"
      - "GET /special-servicing/loans/{id}, GET /special-servicing/borrower-requests, GET /special-servicing/borrower-requests/{id}"

  - name: Trustee
    description: "The trustee of the securitization. Certifies, distributes and voids the reports delivered to itself, the rating agencies, the certificate holders and the controlling class. Pinned test user id: trustee-001."
    identity: opaque
    exclusive_operations:
      - "POST /special-servicing/distribution-reports/{id}/status (CERTIFIED, DISTRIBUTED, VOID)"
    shared_operations:
      - "POST /special-servicing/distribution-reports (with SpecialServicerAssetManager)"
      - "every GET endpoint"

  - name: PlatformAdmin
    description: "Servicing-platform operator. Boards trusts, runs the deemed-consent sweep and drives the logical clock. Holds no business judgement whatsoever: cannot analyse, recommend, approve or dispose. Pinned test user id: admin-001."
    identity: opaque
    exclusive_operations:
      - "POST /special-servicing/trusts"
      - "POST /special-servicing/consultations/sweep"
      - "POST /special-servicing/_clock/set_current_utc"
    shared_operations:
      - "POST /special-servicing/loans (with MasterServicer)"
      - "every GET endpoint except the consultation and workout reads reserved to the controlling class"
