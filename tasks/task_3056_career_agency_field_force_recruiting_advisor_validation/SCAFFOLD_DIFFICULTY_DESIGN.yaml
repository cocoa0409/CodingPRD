      - name: contract_validation_cascade_of_depth_four
        grounds:
          - state_machines.EmploymentContract.VALIDATING_to_VALIDATED
          - state_machines.Advisor.ACTIVE_TRAINING_to_VALIDATING
          - calculations.override_allocation
          - calculations.validation_production_attainment
          - entities.Advisor.fields.team_production_cents
