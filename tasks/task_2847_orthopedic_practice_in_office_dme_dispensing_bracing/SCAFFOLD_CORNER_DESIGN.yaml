          assert:
            - "${par_available} == 1"
            - "${err_stock} == ERR_INSUFFICIENT_PAR_STOCK with HTTP 422 (available_qty 1 < quantity 2)"
            - "${err_reserve_category} == ERR_PRODUCT_CATEGORY_MISMATCH with HTTP 422, not ERR_INSUFFICIENT_PAR_STOCK and not ERR_PAR_LEVEL_NOT_FOUND: the category rule at priority 59 decides before any stock arithmetic is attempted for a product that never belongs on a shelf"
            - "${err_fab_capability} == ERR_CUSTOM_FAB_NOT_SUPPORTED with HTTP 422"
            - "${par_reserved_after} == 0 and ${par_v_after} == ${par_v}"
            - "both encounters are still clinical_status DOCUMENTED"

      - name: corner_self_referral_and_delivery_documentation_gates_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=32]
          - validations[priority=34]
          - validations[priority=39]
          - errors[ERR_IOAS_SUPERVISION_MISSING]
          - errors[ERR_STARK_DISCLOSURE_MISSING]
          - errors[ERR_DELIVERY_SIGNATURE_MISSING]
          - endpoints[POST /dme/encounters/{id}/dispense]
          - endpoints[POST /dme/encounters/{id}/ioas-attestation]
        distinguishing_aspect: |
          Three physician-self-referral and delivery-documentation gates, each
          shown to be a distinct rule. The Stark gate (priority 34) fires at
          note time on an encounter ordered by a group physician with no
