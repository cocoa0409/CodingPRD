# =============================================================================
# task_2919 — Robocall Mitigation & Call Authentication (voice service provider
# compliance). Seed tables §1.0–§1.7.
# §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml, §1.9 in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Robocall Mitigation & Call Authentication (voice service provider compliance):
  call authentication implementation with attestation level assignment based on
  customer verification and number ownership, certificate acquisition, management
  and renewal from the policy administrator, robocall mitigation plan filing with
  the regulator describing prevention practices, customer know-your-customer
  procedures before granting origination capability with traffic monitoring,
  traceback request response within required timeframes with call detail
  production, downstream provider blocking obligations when notified of illegal
  traffic, blocking analytics with erroneous blocking dispute resolution for
  legitimate callers, enforcement exposure with penalties and mandatory reporting
  of mitigation effectiveness.

domain_name: robocall-mitigation-call-auth
api_prefix: /rmd

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: flat
  # Thirteen peer entities linked by explicit foreign keys in request bodies.
  # No entity is nested in a URL path: every collection is addressed directly
  # (/rmd/customers, /rmd/number-assignments, ...) and parentage is carried by
  # `*_id` FK fields, so cross-aggregate references (BlockingDispute ->
  # BlockingEvent -> Customer -> Provider) are first-class rather than implied
  # by nesting.

  state_machine_shape: parallel
  # Customer carries two independent dimensions (kyc_state x origination_state).
  # MitigationPlan is cyclic (SUBMITTED -> DEFICIENT -> SUBMITTED).
  # EnforcementAction is branching fork-join (PROPOSED -> {PAID | CONTESTED} ->
  # {SUSTAINED -> PAID | DISMISSED}). Certificate is linear-with-supersede.

  relationship_patterns:
    - one_to_many        # Provider -> Certificate / Customer / TracebackRequest / ...
    - self_referential   # Certificate.predecessor_certificate_id -> Certificate.id
    - cross_aggregate    # BlockingDispute -> BlockingEvent, TracebackRequest -> CallAttestation
    - polymorphic        # Customer.suspension_source_id points at either an
                         # IllegalTrafficNotice, a BlockingEvent, or a
                         # TrafficObservation, discriminated by suspension_cause

  role_model: segregation_of_duties
  # Two same-role SoD gates: the KycAnalyst who submits a customer for review
  # cannot decide it, and the FraudAnalyst who created a BlockingEvent cannot
  # resolve the dispute against it. A third cross-artifact gate: the
  # ComplianceOfficer who filed the operative MitigationPlan cannot sign off the
  # EffectivenessReport that reports on it.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Provider
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the voice service provider" }
      - { name: provider_type, type: enum, source: input, description: "Regulatory classification of the provider", constraints: "FACILITIES_BASED | NON_FACILITIES_RESELLER | GATEWAY" }
      - { name: rmd_filing_status, type: enum, source: computed, default: UNFILED, description: "Robocall Mitigation Database filing completeness, recomputed by calculations.provider_posture_recompute", constraints: "UNFILED | PARTIAL | COMPLETE" }
      - { name: auth_posture, type: enum, source: computed, default: SIGNING_SUSPENDED, description: "Derived gate over every call-signing operation, recomputed by calculations.provider_posture_recompute", constraints: "FULL_ATTESTATION | GATEWAY_LIMITED | SIGNING_SUSPENDED" }
      - { name: active_certificate_id, type: string, source: computed, default: null, description: "Certificate.id of this provider's certificate whose status == ACTIVE; null when none. Computed pointer, not a client-supplied FK" }
      - { name: penalty_points, type: integer, source: computed, default: 0, description: "Compliance deficiency points, = 2*sum(MitigationPlan.deficiency_count) + 3*count(TracebackRequest in {OVERDUE, RESPONDED_LATE}) + 5*count(IllegalTrafficNotice in {EXPIRED_UNMITIGATED})" }
      - { name: overdue_traceback_count, type: integer, source: computed, default: 0, description: "count(TracebackRequest where provider_id == this.id AND state == OVERDUE)" }
      - { name: open_notice_count, type: integer, source: computed, default: 0, description: "count(IllegalTrafficNotice where provider_id == this.id AND state IN {NOTIFIED, UNDER_INVESTIGATION})" }
      - { name: active_assigned_number_count, type: integer, source: computed, default: 0, description: "count(NumberAssignment where provider_id == this.id AND status == ACTIVE) — the conserved number-inventory quantity" }
      - { name: outstanding_forfeiture_cents, type: integer, source: computed, default: 0, description: "sum(EnforcementAction.total_forfeiture_cents where provider_id == this.id AND status IN {PROPOSED, CONTESTED, SUSTAINED}) — the conserved monetary quantity" }
      - { name: blocking_false_positive_rate, type: number, source: computed, default: 0.0, description: "round_half_up(count(BlockingEvent status == REVERSED) / count(BlockingEvent), 4) over this provider; 0.0 when the provider has no BlockingEvent" }
      - { name: sweep_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by POST /rmd/compliance-sweeps for this provider" }

  - name: Certificate
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the provider this SHAKEN certificate authenticates" }
      - { name: spc_token, type: string, source: input, description: "Service Provider Code token supplied by the Policy Administrator" }
      - { name: public_key_fingerprint, type: string, source: input, description: "Fingerprint of the signing key bound to this certificate" }
      - { name: not_before, type: datetime, source: input, description: "ISO 8601 UTC start of the certificate validity interval (inclusive)" }
      - { name: not_after, type: datetime, source: input, description: "ISO 8601 UTC end of the certificate validity interval (inclusive)" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Certificate lifecycle state", constraints: "REQUESTED | ISSUED | ACTIVE | SUPERSEDED | REVOKED | EXPIRED" }
      - { name: issued_at, type: datetime, source: system, default: null, description: "Logical-clock instant the Policy Administrator issued the certificate" }
      - { name: activated_at, type: datetime, source: system, default: null, description: "Logical-clock instant the provider activated the certificate for signing" }
      - { name: revoked_at, type: datetime, source: system, default: null, description: "Logical-clock instant of revocation" }
      - { name: revocation_reason, type: enum, source: input, default: null, description: "Reason supplied on revoke", constraints: "KEY_COMPROMISE | SPC_WITHDRAWN | REGULATOR_ORDER" }
      - { name: predecessor_certificate_id, type: string, source: system, default: null, description: "FK -> Certificate.id; the certificate this one replaced through renewal; null for the first certificate of a chain" }
      - { name: renewal_generation, type: integer, source: computed, default: 1, description: "1 for a certificate with predecessor_certificate_id == null, else predecessor.renewal_generation + 1" }

  - name: MitigationPlan
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the filer" }
      - { name: prevention_practices, type: array, source: input, description: "Practices described in the filing; each element one of KYC_ONBOARDING | TRAFFIC_PATTERN_MONITORING | CONTRACT_TERMS_PROHIBITION | CALL_BLOCKING_ANALYTICS | TRACEBACK_COOPERATION", constraints: "length >= 3 AND must contain both KYC_ONBOARDING and TRACEBACK_COOPERATION" }
      - { name: filing_state, type: enum, source: system, default: DRAFT, description: "Filing lifecycle state", constraints: "DRAFT | SUBMITTED | ACCEPTED | DEFICIENT | WITHDRAWN | SUPERSEDED" }
      - { name: filed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer who most recently submitted this plan; input to the EffectivenessReport segregation-of-duties gate" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent submission" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent regulator decision" }
      - { name: deficiency_reasons, type: array, source: system, default: [], description: "Reason strings recorded by the most recent DEFICIENT decision; emptied when the plan is re-submitted" }
      - { name: deficiency_count, type: integer, source: computed, default: 0, description: "Number of DEFICIENT decisions this plan has received; feeds Provider.penalty_points" }
      - { name: revision_count, type: integer, source: computed, default: 0, description: "Number of re-submissions made from filing_state == DEFICIENT" }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the originating provider serving this customer" }
      - { name: legal_name, type: string, source: input, description: "Customer legal name collected during know-your-customer intake" }
      - { name: contact_email, type: string, source: input, description: "Customer contact address" }
      - { name: kyc_evidence_level, type: enum, source: input, description: "Strength of the identity evidence on file; may be replaced by a kyc-decision", constraints: "BUSINESS_REGISTRY_VERIFIED | CONTRACT_ONLY | SELF_ATTESTED" }
      - { name: kyc_state, type: enum, source: system, default: PENDING, description: "Know-your-customer dimension; evolves independently of origination_state", constraints: "PENDING | UNDER_REVIEW | VERIFIED | REJECTED" }
      - { name: origination_state, type: enum, source: system, default: DISABLED, description: "Origination-capability dimension; evolves independently of kyc_state", constraints: "DISABLED | ENABLED | SUSPENDED | TERMINATED" }
      - { name: kyc_submitted_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the KycAnalyst who submitted this customer for review" }
      - { name: kyc_decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the KycAnalyst who decided the review; must differ from kyc_submitted_by_user_id" }
      - { name: kyc_decided_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the kyc decision" }
      - { name: traffic_risk_index, type: number, source: computed, default: 0.0, description: "Recency-weighted robocall risk index in [0.0000, 1.0000], recomputed by calculations.customer_traffic_risk_index on every TrafficObservation insert" }
      - { name: risk_tier, type: enum, source: computed, default: LOW, description: "HIGH when traffic_risk_index >= 0.7500, ELEVATED when >= 0.4000, else LOW", constraints: "LOW | ELEVATED | HIGH" }
      - { name: observation_count, type: integer, source: computed, default: 0, description: "count(TrafficObservation where customer_id == this.id)" }
      - { name: false_positive_count, type: integer, source: computed, default: 0, description: "count(BlockingEvent where customer_id == this.id AND status == REVERSED)" }
      - { name: suspension_cause, type: enum, source: system, default: null, description: "Why origination_state == SUSPENDED; null in every other origination_state", constraints: "NOTICE_EXPIRY | BLOCKING_ANALYTICS | TRAFFIC_RISK_THRESHOLD | REGULATOR_ORDER | PROVIDER_REQUEST" }
      - { name: suspension_source_id, type: string, source: system, default: null, description: "Id of the artifact that caused the suspension — an IllegalTrafficNotice.id when suspension_cause == NOTICE_EXPIRY, a BlockingEvent.id when BLOCKING_ANALYTICS, a TrafficObservation.id when TRAFFIC_RISK_THRESHOLD, an IllegalTrafficNotice.id when PROVIDER_REQUEST arose from a notice mitigated with TRAFFIC_BLOCKED, null when the suspension was ordered directly by an operator and in every non-SUSPENDED origination_state" }

  - name: NumberAssignment
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; provider holding the number" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer the number is assigned to" }
      - { name: telephone_number, type: string, source: input, description: "E.164 North American number; the resource whose occupation interval is guarded", constraints: "matches ^\\+1[2-9][0-9]{2}[2-9][0-9]{6}$" }
      - { name: ownership_evidence, type: enum, source: input, description: "Basis on which the provider claims the number for this customer; only DIRECT_ALLOCATION and PORTED_IN count as verified ownership for attestation", constraints: "DIRECT_ALLOCATION | PORTED_IN | LEASED_FROM_CARRIER | UNVERIFIED" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the assignment interval (half-open [effective_from, effective_to))" }
      - { name: effective_to, type: datetime, source: input, default: null, description: "Exclusive end of the assignment interval; null means unbounded (+infinity)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Assignment state; SUSPENDED_BY_CUSTOMER is set by cascade when the owning customer's origination is suspended", constraints: "ACTIVE | SUSPENDED_BY_CUSTOMER | REVOKED" }
      - { name: revoked_at, type: datetime, source: system, default: null, description: "Logical-clock instant of revocation" }

  - name: CallAttestation
    parent: null
    common_fields: false
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the signing provider" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the originating customer" }
      - { name: certificate_id, type: string, source: system, description: "FK -> Certificate.id; the provider's ACTIVE certificate at signing time, resolved server-side from Provider.active_certificate_id" }
      - { name: calling_number, type: string, source: input, description: "E.164 calling party number presented on the call", constraints: "matches ^\\+1[2-9][0-9]{2}[2-9][0-9]{6}$" }
      - { name: called_number, type: string, source: input, description: "E.164 called party number", constraints: "matches ^\\+1[2-9][0-9]{2}[2-9][0-9]{6}$" }
      - { name: origination_time, type: datetime, source: input, description: "ISO 8601 UTC instant the call was originated; the instant at which number ownership is evaluated" }
      - { name: attestation_level, type: enum, source: computed, description: "SHAKEN attestation assigned by calculations.attestation_level_assignment", constraints: "A | B | C" }
      - { name: attestation_reason_code, type: enum, source: computed, description: "Why this level was assigned", constraints: "FULL_KYC_AND_OWNERSHIP | OWNERSHIP_WITH_PARTIAL_KYC | KYC_ONLY_NO_OWNERSHIP | RISK_DOWNGRADE | POSTURE_DOWNGRADE | GATEWAY_PASSTHROUGH | NO_VERIFIED_BASIS" }
      - { name: ownership_verified, type: boolean, source: computed, description: "True when a NumberAssignment with verified ownership covers calling_number for customer_id at origination_time" }
      - { name: risk_tier_at_signing, type: enum, source: computed, description: "Snapshot of Customer.risk_tier at signing", constraints: "LOW | ELEVATED | HIGH" }
      - { name: passport_identity_token, type: string, source: computed, description: "Deterministic identity header material: spc_token + \"|\" + attestation_level + \"|\" + calling_number + \"|\" + origination_time" }

  - name: TrafficObservation
    parent: null
    common_fields: false
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; provider that monitored the traffic" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; monitored customer — the resource whose monitoring timeline is guarded" }
      - { name: window_start, type: datetime, source: input, description: "Inclusive start of the closed monitoring window [window_start, window_end]" }
      - { name: window_end, type: datetime, source: input, description: "Inclusive end of the closed monitoring window; touching a neighbouring window's endpoint is an overlap" }
      - { name: total_call_count, type: integer, source: input, description: "Calls originated by the customer inside the window", constraints: ">= 0" }
      - { name: short_duration_call_count, type: integer, source: input, description: "Calls under 6 seconds inside the window", constraints: ">= 0 AND <= total_call_count" }
      - { name: unanswered_call_count, type: integer, source: input, description: "Calls never answered inside the window", constraints: ">= 0 AND <= total_call_count" }
      - { name: complaint_count, type: integer, source: input, description: "Subscriber complaints attributed to the window", constraints: ">= 0" }
      - { name: window_subscore, type: number, source: computed, description: "Per-window robocall signature score rounded to 2 decimals BEFORE recency weighting (see calculations.customer_traffic_risk_index)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the FraudAnalyst who recorded the observation" }
      - { name: resulting_risk_index, type: number, source: computed, description: "Snapshot of Customer.traffic_risk_index immediately after this observation was folded in" }
      - { name: triggered_suspension, type: boolean, source: computed, description: "True when this observation pushed resulting_risk_index >= 0.9000 and therefore suspended the customer's origination" }

  - name: TracebackRequest
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; provider obliged to respond" }
      - { name: calling_number, type: string, source: input, description: "Calling party number under traceback" }
      - { name: called_number, type: string, source: input, description: "Called party number under traceback" }
      - { name: origination_time, type: datetime, source: input, description: "ISO 8601 UTC instant of the traced call" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock instant the request was served on the provider" }
      - { name: response_deadline_at, type: datetime, source: computed, description: "= received_at + 24 hours; a response landing exactly on this instant is on time" }
      - { name: hard_cutoff_at, type: datetime, source: computed, description: "= received_at + 72 hours; a response landing after this instant is refused outright" }
      - { name: state, type: enum, source: system, default: RECEIVED, description: "Traceback lifecycle state", constraints: "RECEIVED | RESPONDED | RESPONDED_LATE | OVERDUE" }
      - { name: responded_at, type: datetime, source: system, default: null, description: "Logical-clock instant the provider produced call detail" }
      - { name: identified_customer_id, type: string, source: input, default: null, description: "FK -> Customer.id; originating customer named in the call-detail production; null until responded" }
      - { name: produced_attestation_id, type: string, source: input, default: null, description: "FK -> CallAttestation.id; the signed-call record produced as call detail; null until responded" }
      - { name: upstream_provider_note, type: string, source: input, default: null, description: "Free-text upstream attribution supplied with the response" }
      - { name: lateness_seconds, type: integer, source: computed, default: 0, description: "0 when the response is on time, else ceil((responded_at - response_deadline_at) in seconds)" }
      - { name: call_detail_complete, type: boolean, source: computed, default: false, description: "True when identified_customer_id and produced_attestation_id are both present and the attestation matches the traced call" }

  - name: IllegalTrafficNotice
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; provider notified of illegal traffic it is carrying" }
      - { name: calling_number, type: string, source: input, description: "Calling party number the regulator identified as illegal traffic" }
      - { name: description, type: string, source: input, description: "Regulator's description of the illegal traffic pattern" }
      - { name: notified_at, type: datetime, source: system, description: "Logical-clock instant the notice was served" }
      - { name: mitigation_deadline_at, type: datetime, source: computed, description: "= notified_at + 48 hours; mitigation landing exactly on this instant is timely" }
      - { name: state, type: enum, source: system, default: NOTIFIED, description: "Notice lifecycle state", constraints: "NOTIFIED | UNDER_INVESTIGATION | MITIGATED | ALL_TRAFFIC_BLOCKED | EXPIRED_UNMITIGATED" }
      - { name: customer_id, type: string, source: input, default: null, description: "FK -> Customer.id; customer the provider attributed the traffic to during investigation; null until investigated" }
      - { name: mitigation_action, type: enum, source: input, default: null, description: "Action the provider took to stop the traffic", constraints: "CUSTOMER_TERMINATED | NUMBERS_REVOKED | TRAFFIC_BLOCKED" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock instant the notice reached a terminal state" }
      - { name: penalty_points_assessed, type: integer, source: computed, default: 0, description: "5 when state == EXPIRED_UNMITIGATED, else 0; summed into Provider.penalty_points" }

  - name: BlockingEvent
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; provider whose analytics blocked the call" }
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; customer the blocked calling number is assigned to" }
      - { name: calling_number, type: string, source: input, description: "Blocked calling party number" }
      - { name: analytics_score, type: number, source: input, description: "Blocking-analytics score in [0.0000, 1.0000] with 4 decimals" }
      - { name: reason, type: enum, source: input, description: "Why the call was blocked", constraints: "ANALYTICS_SCORE | NOTICE_MANDATE | UNSIGNED_TRAFFIC" }
      - { name: status, type: enum, source: system, default: BLOCKED, description: "Blocking record state", constraints: "BLOCKED | UPHELD | REVERSED" }
      - { name: blocked_at, type: datetime, source: system, description: "Logical-clock instant the block was applied" }
      - { name: blocked_by_user_id, type: string, source: system, description: "X-User-ID of the FraudAnalyst who applied the block; the segregation-of-duties counterparty for dispute resolution" }
      - { name: reversed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the block was reversed by a sustained dispute" }
      - { name: triggered_suspension, type: boolean, source: computed, description: "True when this event suspended the customer's origination (reason == ANALYTICS_SCORE AND analytics_score >= 0.9500)" }

  - name: BlockingDispute
    parent: null
    common_fields: true
    fields:
      - { name: blocking_event_id, type: string, source: input, description: "FK -> BlockingEvent.id; the block the caller claims is erroneous" }
      - { name: customer_id, type: string, source: system, description: "FK -> Customer.id; the disputing legitimate caller, taken from the Caller's X-User-ID" }
      - { name: claim_note, type: string, source: input, description: "Caller's statement of legitimacy" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant the dispute was filed" }
      - { name: resolution_deadline_at, type: datetime, source: computed, description: "= filed_at + 24 hours; resolution landing exactly on this instant is timely" }
      - { name: state, type: enum, source: system, default: FILED, description: "Dispute lifecycle state", constraints: "FILED | UNDER_REVIEW | UPHELD | REVERSED | WITHDRAWN" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Adjudicating analyst's rationale, supplied on resolve" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock instant of resolution" }
      - { name: resolved_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the FraudAnalyst who resolved the dispute; must differ from BlockingEvent.blocked_by_user_id" }
      - { name: resolved_late, type: boolean, source: computed, default: false, description: "True when resolved_at > resolution_deadline_at" }

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the respondent provider" }
      - { name: basis, type: enum, source: input, description: "Statutory basis of the assessment", constraints: "LATE_TRACEBACK | UNMITIGATED_NOTICE | FALSE_ATTESTATION | UNFILED_PLAN" }
      - { name: violation_count, type: integer, source: input, description: "Discrete violations charged", constraints: ">= 1" }
      - { name: violation_days, type: integer, source: input, description: "Days the violation continued", constraints: ">= 1" }
      - { name: assessment_basis, type: enum, source: input, description: "Which assessment variant the regulator elected", constraints: "PER_VIOLATION | CONTINUING_DAILY" }
      - { name: base_assessment_cents, type: integer, source: computed, description: "Pre-cap assessment from the elected variant" }
      - { name: base_capped_cents, type: integer, source: computed, description: "= min(base_assessment_cents, STATUTORY_CAP_CENTS); the tier is keyed on THIS value" }
      - { name: assessment_tier, type: enum, source: computed, description: "Tier of base_capped_cents (never of the post-credit total)", constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: score_band, type: enum, source: computed, description: "Band of the provider's most recent signed-off EffectivenessReport score", constraints: "HIGH | MID | LOW | NONE" }
      - { name: mitigation_credit_cents, type: integer, source: computed, description: "Good-faith credit = round_half_up(base_capped_cents * credit_pct(assessment_tier, score_band))" }
      - { name: total_forfeiture_cents, type: integer, source: computed, description: "= base_capped_cents - mitigation_credit_cents" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "Enforcement lifecycle state", constraints: "PROPOSED | CONTESTED | SUSTAINED | DISMISSED | PAID" }
      - { name: contested_at, type: datetime, source: system, default: null, description: "Logical-clock instant the provider contested" }
      - { name: adjudicated_at, type: datetime, source: system, default: null, description: "Logical-clock instant the regulator adjudicated the contest" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical-clock instant of payment" }
      - { name: paid_amount_cents, type: integer, source: system, default: null, description: "Amount tendered; must equal total_forfeiture_cents" }

  - name: EffectivenessReport
    parent: null
    common_fields: true
    fields:
      - { name: provider_id, type: string, source: input, description: "FK -> Provider.id; the reporting provider" }
      - { name: period_start, type: datetime, source: input, description: "Inclusive start of the reporting period (half-open [period_start, period_end))" }
      - { name: period_end, type: datetime, source: input, description: "Exclusive end of the reporting period; must not exceed the current logical clock" }
      - { name: variant, type: enum, source: input, description: "Which effectiveness algorithm to apply", constraints: "PROVISIONAL | CERTIFIED" }
      - { name: signed_call_count, type: integer, source: computed, description: "count(CallAttestation where provider_id == this.provider_id AND period_start <= origination_time < period_end)" }
      - { name: attestation_a_count, type: integer, source: computed, description: "Same window, restricted to attestation_level == A" }
      - { name: traceback_total_count, type: integer, source: computed, description: "count(TracebackRequest where provider_id matches AND period_start <= received_at < period_end)" }
      - { name: traceback_on_time_count, type: integer, source: computed, description: "Same window, restricted to state == RESPONDED" }
      - { name: traceback_pending_count, type: integer, source: computed, description: "Same window, restricted to state == RECEIVED AND response_deadline_at >= current logical clock" }
      - { name: notice_total_count, type: integer, source: computed, description: "count(IllegalTrafficNotice where provider_id matches AND period_start <= notified_at < period_end)" }
      - { name: notice_mitigated_count, type: integer, source: computed, description: "Same window, restricted to state IN {MITIGATED, ALL_TRAFFIC_BLOCKED}" }
      - { name: notice_open_count, type: integer, source: computed, description: "Same window, restricted to state IN {NOTIFIED, UNDER_INVESTIGATION} AND mitigation_deadline_at >= current logical clock" }
      - { name: attestation_component, type: number, source: computed, description: "4-decimal component score for signing quality" }
      - { name: traceback_component, type: number, source: computed, description: "4-decimal component score for traceback cooperation" }
      - { name: notice_component, type: number, source: computed, description: "4-decimal component score for notice mitigation" }
      - { name: effectiveness_score, type: number, source: computed, description: "Weighted 4-decimal mitigation effectiveness score in [0.0000, 1.0000]" }
      - { name: score_band, type: enum, source: computed, description: "Band of effectiveness_score consumed by calculations.forfeiture_assessment: HIGH when >= 0.8000, MID when >= 0.6000, else LOW", constraints: "HIGH | MID | LOW" }
      - { name: data_sufficiency, type: enum, source: computed, description: "INSUFFICIENT when signed_call_count == 0, else SUFFICIENT", constraints: "SUFFICIENT | INSUFFICIENT" }
      - { name: state, type: enum, source: system, default: GENERATED, description: "Report lifecycle state", constraints: "GENERATED | SIGNED_OFF | FILED | SUPERSEDED" }
      - { name: signed_off_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ComplianceOfficer who signed off; must differ from the operative MitigationPlan.filed_by_user_id" }
      - { name: signed_off_at, type: datetime, source: system, default: null, description: "Logical-clock instant of sign-off" }
      - { name: filed_at, type: datetime, source: system, default: null, description: "Logical-clock instant the signed-off report was filed with the regulator" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Certificate
    initial_state: REQUESTED
    terminal_states: [SUPERSEDED, REVOKED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: ISSUED
        trigger: "POST /rmd/certificates/{certificateId}/issue"
        actor: PolicyAdministrator
        preconditions: ["status == REQUESTED", "not_after > current logical clock"]
        side_effects: ["issued_at = current logical clock", "increments Certificate.version by 1"]
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /rmd/certificates/{certificateId}/activate"
        actor: ProviderAdmin
        preconditions:
          - "status == ISSUED"
          - "not_before <= current logical clock <= not_after"
          - "the provider has no other Certificate with status == ACTIVE (else the provider must renew instead)"
        side_effects:
          - "activated_at = current logical clock"
          - "Provider.active_certificate_id = this Certificate.id"
          - "recompute Provider.rmd_filing_status and Provider.auth_posture per calculations.provider_posture_recompute"
          - "increments Certificate.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /rmd/certificates/{certificateId}/renew"
        actor: PolicyAdministrator
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "creates a successor Certificate with status == ISSUED, predecessor_certificate_id = this Certificate.id, renewal_generation = this.renewal_generation + 1, issued_at = current logical clock, and the same provider_id"
          - "Provider.active_certificate_id = null (the successor must be activated before signing resumes)"
          - "recompute Provider.auth_posture per calculations.provider_posture_recompute; because active_certificate_id is null the posture becomes SIGNING_SUSPENDED while rmd_filing_status keeps whatever the operative plan dictates"
          - "increments Certificate.version by 1 on this (predecessor) certificate"
        note: "Renewal is CREATE-with-supersede: the successor legitimately replaces the predecessor, which is why the write is guarded by nothing stronger than its own ACTIVE precondition."
      - from: REQUESTED
        to: REVOKED
        trigger: "POST /rmd/certificates/{certificateId}/revoke"
        actor: PolicyAdministrator
        preconditions: ["status IN {REQUESTED, ISSUED, ACTIVE}", "revocation_reason supplied"]
        side_effects: ["revoked_at = current logical clock", "increments Certificate.version by 1"]
      - from: ISSUED
        to: REVOKED
        trigger: "POST /rmd/certificates/{certificateId}/revoke"
        actor: PolicyAdministrator
        preconditions: ["status IN {REQUESTED, ISSUED, ACTIVE}", "revocation_reason supplied"]
        side_effects: ["revoked_at = current logical clock", "increments Certificate.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /rmd/certificates/{certificateId}/revoke"
        actor: PolicyAdministrator
        preconditions: ["status == ACTIVE", "revocation_reason supplied"]
        side_effects:
          - "revoked_at = current logical clock"
          - "Provider.active_certificate_id = null"
          - "recompute Provider.auth_posture per calculations.provider_posture_recompute; because active_certificate_id is now null the ladder stops at step 1 with SIGNING_SUSPENDED, while rmd_filing_status keeps whatever the operative plan dictates"
          - "increments Certificate.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system event: POST /rmd/compliance-sweeps observes current logical clock > not_after"
        actor: system
        preconditions: ["status IN {ISSUED, ACTIVE}", "current logical clock > not_after"]
        side_effects:
          - "Provider.active_certificate_id = null when it pointed at this certificate"
          - "recompute Provider.rmd_filing_status and Provider.auth_posture"
          - "increments Certificate.version by 1"
      - from: ISSUED
        to: EXPIRED
        trigger: "system event: POST /rmd/compliance-sweeps observes current logical clock > not_after"
        actor: system
        preconditions: ["status == ISSUED", "current logical clock > not_after"]
        side_effects: ["increments Certificate.version by 1"]

  - entity: MitigationPlan
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /rmd/mitigation-plans/{planId}/submit"
        actor: ComplianceOfficer
        preconditions: ["filing_state IN {DRAFT, DEFICIENT}", "prevention_practices satisfies validations[priority=22]"]
        side_effects: ["submitted_at = current logical clock", "filed_by_user_id = X-User-ID of the submitting ComplianceOfficer", "increments MitigationPlan.version by 1"]
      - from: DEFICIENT
        to: SUBMITTED
        trigger: "POST /rmd/mitigation-plans/{planId}/submit"
        actor: ComplianceOfficer
        preconditions: ["filing_state == DEFICIENT"]
        side_effects:
          - "revision_count += 1"
          - "deficiency_reasons = []"
          - "submitted_at = current logical clock"
          - "filed_by_user_id = X-User-ID of the submitting ComplianceOfficer"
          - "increments MitigationPlan.version by 1"
        note: "The revision cycle SUBMITTED -> DEFICIENT -> SUBMITTED may repeat without bound; deficiency_count keeps accruing while revision_count tracks the loop count."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /rmd/mitigation-plans/{planId}/decision with decision == ACCEPT"
        actor: Regulator
        preconditions: ["filing_state == SUBMITTED"]
        side_effects:
          - "decided_at = current logical clock"
          - "recompute Provider.rmd_filing_status (UNFILED -> COMPLETE when an ACTIVE certificate exists, else PARTIAL) and Provider.auth_posture"
          - "increments MitigationPlan.version by 1"
      - from: SUBMITTED
        to: DEFICIENT
        trigger: "POST /rmd/mitigation-plans/{planId}/decision with decision == DEFICIENT"
        actor: Regulator
        preconditions: ["filing_state == SUBMITTED", "deficiency_reasons supplied with at least one element"]
        side_effects:
          - "decided_at = current logical clock"
          - "deficiency_count += 1"
          - "recompute Provider.penalty_points (+2 per deficiency) which in turn recomputes Provider.rmd_filing_status (-> UNFILED, since no plan is ACCEPTED) and Provider.auth_posture"
          - "increments MitigationPlan.version by 1"
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /rmd/mitigation-plans/{planId}/withdraw"
        actor: ComplianceOfficer
        preconditions: ["filing_state IN {DRAFT, SUBMITTED, DEFICIENT, ACCEPTED}"]
        side_effects:
          - "recompute Provider.rmd_filing_status -> UNFILED and Provider.auth_posture -> SIGNING_SUSPENDED"
          - "increments MitigationPlan.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /rmd/mitigation-plans/{planId}/withdraw"
        actor: ComplianceOfficer
        preconditions: ["filing_state IN {DRAFT, SUBMITTED, DEFICIENT, ACCEPTED}"]
        side_effects: ["recompute Provider.rmd_filing_status and Provider.auth_posture", "increments MitigationPlan.version by 1"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system event: POST /rmd/mitigation-plans creates a newer plan for the same provider_id"
        actor: system
        preconditions: ["filing_state IN {DRAFT, SUBMITTED, ACCEPTED, DEFICIENT}"]
        side_effects:
          - "recompute Provider.rmd_filing_status and Provider.auth_posture from the new operative plan"
          - "increments MitigationPlan.version by 1"
        note: "At most one plan per provider is ever outside {WITHDRAWN, SUPERSEDED}; the newest filing always supersedes the prior one, which is the CREATE-with-supersede race guarded by concurrency_rules[plan-file-stale-provider]."
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system event: POST /rmd/mitigation-plans creates a newer plan for the same provider_id"
        actor: system
        preconditions: ["filing_state IN {DRAFT, SUBMITTED, ACCEPTED, DEFICIENT}"]
        side_effects:
          - "recompute Provider.rmd_filing_status (COMPLETE -> UNFILED until the new plan is accepted) and Provider.auth_posture (-> SIGNING_SUSPENDED)"
          - "increments MitigationPlan.version by 1"

  - entity: Customer
    dimension: kyc_state
    initial_state: PENDING
    terminal_states: []
    note: "Dimension 1 of 2 on Customer. kyc_state and origination_state advance on independent triggers; neither transition writes the other field. A REJECTED customer may still hold origination_state == ENABLED (and is then refused at signing by validations[priority=24]), and a VERIFIED customer may still be DISABLED."
    transitions:
      - from: PENDING
        to: UNDER_REVIEW
        trigger: "POST /rmd/customers/{customerId}/kyc-submit"
        actor: KycAnalyst
        preconditions: ["kyc_state IN {PENDING, REJECTED, VERIFIED}"]
        side_effects: ["kyc_submitted_by_user_id = X-User-ID of the submitting KycAnalyst", "kyc_decided_by_user_id = null", "increments Customer.version by 1"]
      - from: UNDER_REVIEW
        to: VERIFIED
        trigger: "POST /rmd/customers/{customerId}/kyc-decision with decision == VERIFY"
        actor: KycAnalyst
        preconditions: ["kyc_state == UNDER_REVIEW", "X-User-ID != kyc_submitted_by_user_id"]
        side_effects:
          - "kyc_decided_by_user_id = X-User-ID, kyc_decided_at = current logical clock"
          - "kyc_evidence_level = the decision's kyc_evidence_level when supplied, else unchanged"
          - "increments Customer.version by 1"
        note: "origination_state is untouched — granting origination capability is a separate operator action."
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /rmd/customers/{customerId}/kyc-decision with decision == REJECT"
        actor: KycAnalyst
        preconditions: ["kyc_state == UNDER_REVIEW", "X-User-ID != kyc_submitted_by_user_id"]
        side_effects: ["kyc_decided_by_user_id = X-User-ID, kyc_decided_at = current logical clock", "increments Customer.version by 1"]
      - from: REJECTED
        to: UNDER_REVIEW
        trigger: "POST /rmd/customers/{customerId}/kyc-submit"
        actor: KycAnalyst
        preconditions: ["kyc_state IN {PENDING, REJECTED, VERIFIED}"]
        side_effects: ["kyc_submitted_by_user_id = X-User-ID", "kyc_decided_by_user_id = null", "increments Customer.version by 1"]
      - from: VERIFIED
        to: UNDER_REVIEW
        trigger: "POST /rmd/customers/{customerId}/kyc-submit (periodic re-verification)"
        actor: KycAnalyst
        preconditions: ["kyc_state IN {PENDING, REJECTED, VERIFIED}"]
        side_effects: ["kyc_submitted_by_user_id = X-User-ID", "kyc_decided_by_user_id = null", "increments Customer.version by 1"]
        note: "Re-verification is the cycle VERIFIED -> UNDER_REVIEW -> VERIFIED; while UNDER_REVIEW the customer fails validations[priority=24] and cannot have calls signed even though origination_state is still ENABLED."

  - entity: Customer
    dimension: origination_state
    initial_state: DISABLED
    terminal_states: [TERMINATED]
    note: "Dimension 2 of 2 on Customer."
    transitions:
      - from: DISABLED
        to: ENABLED
        trigger: "POST /rmd/customers/{customerId}/origination-actions with action == ENABLE"
        actor: ProviderAdmin
        preconditions: ["origination_state == DISABLED", "kyc_state == VERIFIED"]
        side_effects: ["suspension_cause = null, suspension_source_id = null", "increments Customer.version by 1"]
      - from: ENABLED
        to: SUSPENDED
        trigger: "POST /rmd/customers/{customerId}/origination-actions with action == SUSPEND"
        actor: ProviderAdmin | Regulator
        preconditions: ["origination_state == ENABLED", "cause supplied and equals PROVIDER_REQUEST when the actor is ProviderAdmin, or REGULATOR_ORDER when the actor is Regulator"]
        side_effects:
          - "suspension_cause = cause, suspension_source_id = null"
          - "every NumberAssignment of this customer with status == ACTIVE -> SUSPENDED_BY_CUSTOMER"
          - "because those assignments left ACTIVE, recompute Provider.active_assigned_number_count"
          - "increments Customer.version by 1"
      - from: ENABLED
        to: SUSPENDED
        trigger: "system event: IllegalTrafficNotice reaches EXPIRED_UNMITIGATED, or a TrafficObservation drives traffic_risk_index >= 0.9000, or a BlockingEvent with reason == ANALYTICS_SCORE and analytics_score >= 0.9500 is recorded"
        actor: system
        preconditions: ["origination_state == ENABLED"]
        side_effects:
          - "suspension_cause = NOTICE_EXPIRY | TRAFFIC_RISK_THRESHOLD | BLOCKING_ANALYTICS per the triggering artifact; suspension_source_id = that artifact's id"
          - "every NumberAssignment of this customer with status == ACTIVE -> SUSPENDED_BY_CUSTOMER"
          - "because those assignments left ACTIVE, recompute Provider.active_assigned_number_count"
          - "increments Customer.version by 1"
      - from: SUSPENDED
        to: ENABLED
        trigger: "POST /rmd/customers/{customerId}/origination-actions with action == RESTORE"
        actor: ProviderAdmin | Regulator
        preconditions:
          - "origination_state == SUSPENDED"
          - "kyc_state == VERIFIED"
          - "when the actor is ProviderAdmin: suspension_cause == PROVIDER_REQUEST (else validations[priority=26] refuses); a Regulator may restore any suspension_cause"
        side_effects:
          - "suspension_cause = null, suspension_source_id = null"
          - "every NumberAssignment of this customer with status == SUSPENDED_BY_CUSTOMER -> ACTIVE"
          - "because those assignments re-entered ACTIVE, recompute Provider.active_assigned_number_count"
          - "increments Customer.version by 1"
      - from: SUSPENDED
        to: ENABLED
        trigger: "system event: the BlockingEvent named by suspension_source_id is reversed by POST /rmd/blocking-disputes/{disputeId}/resolve with outcome == REVERSE"
        actor: system
        preconditions: ["origination_state == SUSPENDED", "suspension_cause == BLOCKING_ANALYTICS", "suspension_source_id == the reversed BlockingEvent.id"]
        side_effects:
          - "suspension_cause = null, suspension_source_id = null"
          - "recompute false_positive_count"
          - "every NumberAssignment of this customer with status == SUSPENDED_BY_CUSTOMER -> ACTIVE"
          - "because those assignments re-entered ACTIVE, recompute Provider.active_assigned_number_count and Provider.blocking_false_positive_rate"
          - "increments Customer.version by 1"
      - from: ENABLED
        to: TERMINATED
        trigger: "POST /rmd/customers/{customerId}/origination-actions with action == TERMINATE, or system event: IllegalTrafficNotice mitigated with mitigation_action == CUSTOMER_TERMINATED"
        actor: ProviderAdmin | Regulator | system
        preconditions: ["origination_state IN {DISABLED, ENABLED, SUSPENDED}"]
        side_effects:
          - "suspension_cause = null, suspension_source_id = null"
          - "every NumberAssignment of this customer with status IN {ACTIVE, SUSPENDED_BY_CUSTOMER} -> REVOKED with revoked_at = current logical clock"
          - "because those assignments left ACTIVE, recompute Provider.active_assigned_number_count"
          - "increments Customer.version by 1"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /rmd/customers/{customerId}/origination-actions with action == TERMINATE, or system event: IllegalTrafficNotice mitigated with mitigation_action == CUSTOMER_TERMINATED"
        actor: ProviderAdmin | Regulator | system
        preconditions: ["origination_state IN {DISABLED, ENABLED, SUSPENDED}"]
        side_effects:
          - "every NumberAssignment of this customer with status IN {ACTIVE, SUSPENDED_BY_CUSTOMER} -> REVOKED"
          - "recompute Provider.active_assigned_number_count"
          - "increments Customer.version by 1"

  - entity: NumberAssignment
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED_BY_CUSTOMER
        trigger: "system event: the owning Customer's origination_state ENABLED -> SUSPENDED"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects: ["recompute Provider.active_assigned_number_count", "increments NumberAssignment.version by 1"]
      - from: SUSPENDED_BY_CUSTOMER
        to: ACTIVE
        trigger: "system event: the owning Customer's origination_state SUSPENDED -> ENABLED"
        actor: system
        preconditions: ["status == SUSPENDED_BY_CUSTOMER"]
        side_effects: ["recompute Provider.active_assigned_number_count", "increments NumberAssignment.version by 1"]
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /rmd/number-assignments/{assignmentId}/revoke, or system event: Customer -> TERMINATED, or system event: IllegalTrafficNotice mitigated with mitigation_action == NUMBERS_REVOKED"
        actor: ProviderAdmin | system
        preconditions: ["status IN {ACTIVE, SUSPENDED_BY_CUSTOMER}"]
        side_effects:
          - "revoked_at = current logical clock"
          - "recompute Provider.active_assigned_number_count (the compensating half of the number-inventory invariant)"
          - "increments NumberAssignment.version by 1"
      - from: SUSPENDED_BY_CUSTOMER
        to: REVOKED
        trigger: "POST /rmd/number-assignments/{assignmentId}/revoke, or system event: Customer -> TERMINATED"
        actor: ProviderAdmin | system
        preconditions: ["status IN {ACTIVE, SUSPENDED_BY_CUSTOMER}"]
        side_effects: ["revoked_at = current logical clock", "recompute Provider.active_assigned_number_count", "increments NumberAssignment.version by 1"]

  - entity: TracebackRequest
    initial_state: RECEIVED
    terminal_states: [RESPONDED, RESPONDED_LATE]
    transitions:
      - from: RECEIVED
        to: RESPONDED
        trigger: "POST /rmd/traceback-requests/{tracebackId}/respond with current logical clock <= response_deadline_at"
        actor: ComplianceOfficer
        preconditions:
          - "state IN {RECEIVED, OVERDUE}"
          - "current logical clock <= hard_cutoff_at"
          - "identified_customer_id and produced_attestation_id both supplied and mutually consistent with the traced call (validations[priority=35], validations[priority=36])"
        side_effects: ["responded_at = current logical clock", "lateness_seconds = 0", "call_detail_complete = true", "increments TracebackRequest.version by 1"]
      - from: RECEIVED
        to: RESPONDED_LATE
        trigger: "POST /rmd/traceback-requests/{tracebackId}/respond with response_deadline_at < current logical clock <= hard_cutoff_at"
        actor: ComplianceOfficer
        preconditions: ["state IN {RECEIVED, OVERDUE}", "current logical clock <= hard_cutoff_at"]
        side_effects:
          - "responded_at = current logical clock, lateness_seconds = ceil(responded_at - response_deadline_at in seconds)"
          - "because the response is late, recompute Provider.penalty_points (+3 for this traceback)"
          - "because penalty_points moved, recompute Provider.auth_posture per calculations.provider_posture_recompute"
          - "increments TracebackRequest.version by 1"
      - from: RECEIVED
        to: OVERDUE
        trigger: "system event: POST /rmd/compliance-sweeps observes current logical clock > response_deadline_at"
        actor: system
        preconditions: ["state == RECEIVED", "current logical clock > response_deadline_at"]
        side_effects:
          - "recompute Provider.overdue_traceback_count (+1) and Provider.penalty_points (+3)"
          - "because overdue_traceback_count and penalty_points moved, recompute Provider.auth_posture (FULL_ATTESTATION -> GATEWAY_LIMITED at the first overdue traceback, SIGNING_SUSPENDED once penalty_points >= 10)"
          - "increments TracebackRequest.version by 1"
      - from: OVERDUE
        to: RESPONDED_LATE
        trigger: "POST /rmd/traceback-requests/{tracebackId}/respond with current logical clock <= hard_cutoff_at"
        actor: ComplianceOfficer
        preconditions: ["state == OVERDUE", "current logical clock <= hard_cutoff_at"]
        side_effects:
          - "responded_at = current logical clock, lateness_seconds = ceil(responded_at - response_deadline_at in seconds), call_detail_complete = true"
          - "recompute Provider.overdue_traceback_count (-1); Provider.penalty_points is unchanged because the formula counts {OVERDUE, RESPONDED_LATE} alike"
          - "because overdue_traceback_count moved, recompute Provider.auth_posture (GATEWAY_LIMITED -> FULL_ATTESTATION when no other overdue traceback remains and penalty_points < 10)"
          - "increments TracebackRequest.version by 1"

  - entity: IllegalTrafficNotice
    initial_state: NOTIFIED
    terminal_states: [MITIGATED, ALL_TRAFFIC_BLOCKED, EXPIRED_UNMITIGATED]
    transitions:
      - from: NOTIFIED
        to: UNDER_INVESTIGATION
        trigger: "POST /rmd/illegal-traffic-notices/{noticeId}/investigate"
        actor: ComplianceOfficer
        preconditions: ["state == NOTIFIED", "the supplied customer_id belongs to this notice's provider_id (validations[priority=34])"]
        side_effects: ["customer_id = supplied attribution", "increments IllegalTrafficNotice.version by 1"]
      - from: UNDER_INVESTIGATION
        to: MITIGATED
        trigger: "POST /rmd/illegal-traffic-notices/{noticeId}/mitigate with mitigation_action IN {CUSTOMER_TERMINATED, NUMBERS_REVOKED}"
        actor: ComplianceOfficer
        preconditions: ["state == UNDER_INVESTIGATION", "customer_id is not null"]
        side_effects:
          - "resolved_at = current logical clock"
          - "when mitigation_action == CUSTOMER_TERMINATED: the attributed Customer's origination_state -> TERMINATED, which revokes every NumberAssignment of that customer, which recomputes Provider.active_assigned_number_count"
          - "when mitigation_action == NUMBERS_REVOKED: every NumberAssignment of the attributed customer whose telephone_number == this notice's calling_number and whose status IN {ACTIVE, SUSPENDED_BY_CUSTOMER} -> REVOKED, which recomputes Provider.active_assigned_number_count"
          - "recompute Provider.open_notice_count (-1)"
          - "increments IllegalTrafficNotice.version by 1"
      - from: UNDER_INVESTIGATION
        to: ALL_TRAFFIC_BLOCKED
        trigger: "POST /rmd/illegal-traffic-notices/{noticeId}/mitigate with mitigation_action == TRAFFIC_BLOCKED"
        actor: ComplianceOfficer
        preconditions: ["state == UNDER_INVESTIGATION", "customer_id is not null"]
        side_effects:
          - "resolved_at = current logical clock"
          - "the attributed Customer's origination_state ENABLED -> SUSPENDED with suspension_cause = PROVIDER_REQUEST and suspension_source_id = this notice's id"
          - "because the customer was suspended, its ACTIVE NumberAssignments -> SUSPENDED_BY_CUSTOMER, which recomputes Provider.active_assigned_number_count"
          - "recompute Provider.open_notice_count (-1)"
          - "increments IllegalTrafficNotice.version by 1"
      - from: NOTIFIED
        to: EXPIRED_UNMITIGATED
        trigger: "system event: POST /rmd/compliance-sweeps observes current logical clock > mitigation_deadline_at"
        actor: system
        preconditions: ["state IN {NOTIFIED, UNDER_INVESTIGATION}", "current logical clock > mitigation_deadline_at"]
        side_effects:
          - "penalty_points_assessed = 5; recompute Provider.penalty_points and Provider.open_notice_count"
          - "because penalty_points moved, recompute Provider.auth_posture"
          - "increments IllegalTrafficNotice.version by 1"
      - from: UNDER_INVESTIGATION
        to: EXPIRED_UNMITIGATED
        trigger: "system event: POST /rmd/compliance-sweeps observes current logical clock > mitigation_deadline_at"
        actor: system
        preconditions: ["state IN {NOTIFIED, UNDER_INVESTIGATION}", "current logical clock > mitigation_deadline_at"]
        side_effects:
          - "penalty_points_assessed = 5; recompute Provider.penalty_points (+5) and Provider.open_notice_count (-1)"
          - "when customer_id is not null and that Customer's origination_state == ENABLED: origination_state -> SUSPENDED with suspension_cause = NOTICE_EXPIRY and suspension_source_id = this notice's id"
          - "because that Customer was suspended, every NumberAssignment of the customer with status == ACTIVE -> SUSPENDED_BY_CUSTOMER"
          - "because those assignments left ACTIVE, recompute Provider.active_assigned_number_count, and recompute Provider.auth_posture from the new penalty_points"
          - "increments IllegalTrafficNotice.version by 1"
        note: "This is the depth-4 downstream-blocking cascade: notice expiry -> customer suspension -> assignment suspension -> provider counters/posture. Each hop is caused by the previous hop, not by the sweep call."

  - entity: BlockingEvent
    initial_state: BLOCKED
    terminal_states: [UPHELD, REVERSED]
    transitions:
      - from: BLOCKED
        to: UPHELD
        trigger: "system event: POST /rmd/blocking-disputes/{disputeId}/resolve with outcome == UPHOLD"
        actor: system
        preconditions: ["status == BLOCKED"]
        side_effects: ["recompute Provider.blocking_false_positive_rate (denominator unchanged, numerator unchanged)", "increments BlockingEvent.version by 1"]
      - from: BLOCKED
        to: REVERSED
        trigger: "system event: POST /rmd/blocking-disputes/{disputeId}/resolve with outcome == REVERSE"
        actor: system
        preconditions: ["status == BLOCKED"]
        side_effects:
          - "reversed_at = current logical clock"
          - "because the block was reversed, recompute Customer.false_positive_count (+1) and, when the customer's suspension_cause == BLOCKING_ANALYTICS and suspension_source_id == this event's id, origination_state SUSPENDED -> ENABLED"
          - "because the customer was re-enabled, its SUSPENDED_BY_CUSTOMER NumberAssignments -> ACTIVE"
          - "because those assignments re-entered ACTIVE, recompute Provider.active_assigned_number_count and Provider.blocking_false_positive_rate"
          - "increments BlockingEvent.version by 1"

  - entity: BlockingDispute
    initial_state: FILED
    terminal_states: [UPHELD, REVERSED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /rmd/blocking-disputes/{disputeId}/review"
        actor: FraudAnalyst
        preconditions: ["state == FILED"]
        side_effects: ["increments BlockingDispute.version by 1"]
      - from: UNDER_REVIEW
        to: UPHELD
        trigger: "POST /rmd/blocking-disputes/{disputeId}/resolve with outcome == UPHOLD"
        actor: FraudAnalyst
        preconditions: ["state == UNDER_REVIEW", "X-User-ID != the disputed BlockingEvent.blocked_by_user_id (validations[priority=9])"]
        side_effects:
          - "resolved_at = current logical clock, resolved_by_user_id = X-User-ID, resolved_late = (resolved_at > resolution_deadline_at)"
          - "the disputed BlockingEvent status BLOCKED -> UPHELD"
          - "increments BlockingDispute.version by 1"
      - from: UNDER_REVIEW
        to: REVERSED
        trigger: "POST /rmd/blocking-disputes/{disputeId}/resolve with outcome == REVERSE"
        actor: FraudAnalyst
        preconditions: ["state == UNDER_REVIEW", "X-User-ID != the disputed BlockingEvent.blocked_by_user_id (validations[priority=9])"]
        side_effects:
          - "resolved_at = current logical clock, resolved_by_user_id = X-User-ID, resolved_late = (resolved_at > resolution_deadline_at)"
          - "the disputed BlockingEvent status BLOCKED -> REVERSED, which starts the erroneous-blocking restoration cascade documented on state_machines.BlockingEvent.BLOCKED_to_REVERSED"
          - "increments BlockingDispute.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /rmd/blocking-disputes/{disputeId}/withdraw"
        actor: Caller
        preconditions: ["state == FILED", "X-User-ID == this dispute's customer_id"]
        side_effects: ["resolved_at = current logical clock", "the disputed BlockingEvent stays BLOCKED", "increments BlockingDispute.version by 1"]

  - entity: EnforcementAction
    initial_state: PROPOSED
    terminal_states: [PAID, DISMISSED]
    transitions:
      - from: PROPOSED
        to: CONTESTED
        trigger: "POST /rmd/enforcement-actions/{actionId}/contest"
        actor: ComplianceOfficer
        preconditions: ["status == PROPOSED"]
        side_effects: ["contested_at = current logical clock", "Provider.outstanding_forfeiture_cents is unchanged (CONTESTED remains in the outstanding set)", "increments EnforcementAction.version by 1"]
      - from: CONTESTED
        to: SUSTAINED
        trigger: "POST /rmd/enforcement-actions/{actionId}/adjudicate with outcome == SUSTAIN"
        actor: Regulator
        preconditions: ["status == CONTESTED"]
        side_effects: ["adjudicated_at = current logical clock", "Provider.outstanding_forfeiture_cents is unchanged (SUSTAINED remains in the outstanding set)", "increments EnforcementAction.version by 1"]
      - from: CONTESTED
        to: DISMISSED
        trigger: "POST /rmd/enforcement-actions/{actionId}/adjudicate with outcome == DISMISS"
        actor: Regulator
        preconditions: ["status == CONTESTED"]
        side_effects:
          - "adjudicated_at = current logical clock"
          - "recompute Provider.outstanding_forfeiture_cents (this action leaves the outstanding set, restoring the pre-assessment total — the compensating half of the monetary invariant)"
          - "increments EnforcementAction.version by 1"
      - from: PROPOSED
        to: PAID
        trigger: "POST /rmd/enforcement-actions/{actionId}/pay"
        actor: ProviderAdmin
        preconditions: ["status IN {PROPOSED, SUSTAINED}", "amount_cents == total_forfeiture_cents (validations[priority=37])"]
        side_effects: ["paid_at = current logical clock, paid_amount_cents = amount_cents", "recompute Provider.outstanding_forfeiture_cents", "increments EnforcementAction.version by 1"]
      - from: SUSTAINED
        to: PAID
        trigger: "POST /rmd/enforcement-actions/{actionId}/pay"
        actor: ProviderAdmin
        preconditions: ["status IN {PROPOSED, SUSTAINED}", "amount_cents == total_forfeiture_cents"]
        side_effects: ["paid_at = current logical clock, paid_amount_cents = amount_cents", "recompute Provider.outstanding_forfeiture_cents", "increments EnforcementAction.version by 1"]

  - entity: EffectivenessReport
    initial_state: GENERATED
    terminal_states: [FILED, SUPERSEDED]
    transitions:
      - from: GENERATED
        to: SIGNED_OFF
        trigger: "POST /rmd/effectiveness-reports/{reportId}/certify"
        actor: ComplianceOfficer
        preconditions:
          - "state == GENERATED"
          - "the provider's operative MitigationPlan (filing_state NOT IN {WITHDRAWN, SUPERSEDED}) is ACCEPTED"
          - "X-User-ID != that plan's filed_by_user_id (validations[priority=9])"
        side_effects: ["signed_off_by_user_id = X-User-ID, signed_off_at = current logical clock", "this report becomes the score source for calculations.forfeiture_assessment", "increments EffectivenessReport.version by 1"]
      - from: SIGNED_OFF
        to: FILED
        trigger: "POST /rmd/effectiveness-reports/{reportId}/file"
        actor: ComplianceOfficer
        preconditions: ["state == SIGNED_OFF"]
        side_effects: ["filed_at = current logical clock", "increments EffectivenessReport.version by 1"]
      - from: GENERATED
        to: SUPERSEDED
        trigger: "system event: POST /rmd/effectiveness-reports creates a newer report whose [period_start, period_end) overlaps this report's period for the same provider_id"
        actor: system
        preconditions: ["state IN {GENERATED, SIGNED_OFF}"]
        side_effects: ["increments EffectivenessReport.version by 1"]
      - from: SIGNED_OFF
        to: SUPERSEDED
        trigger: "system event: POST /rmd/effectiveness-reports creates a newer report whose [period_start, period_end) overlaps this report's period for the same provider_id"
        actor: system
        preconditions: ["state IN {GENERATED, SIGNED_OFF}"]
        side_effects:
          - "this report stops being the score source for calculations.forfeiture_assessment (score_band falls back to the next most recent signed-off/filed report, or NONE)"
          - "increments EffectivenessReport.version by 1"
        note: "Regeneration is CREATE-with-supersede: a fresh report legitimately replaces the prior one for an overlapping period, which is the race guarded by concurrency_rules[report-generate-stale-provider]."

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# =============================================================================
concurrency_rules:
  - rule_id: plan-file-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /rmd/mitigation-plans"
    occ_field: "expected_provider_version"
    description: |
      Filing a MitigationPlan against a Provider whose version has advanced
      since the client last observed it is rejected with 412. This captures the
      case where a plan has already been filed for that provider and
      legitimately superseded the prior filing (state_machines.MitigationPlan
      SUBMITTED_to_SUPERSEDED), so the current filer's view of the provider —
      its rmd_filing_status, auth_posture and operative plan — is stale. A
      second filing carrying a fresh version is accepted and supersedes again,
      which is why this cannot be reduced to a state precondition.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412

  - rule_id: report-generate-stale-provider
    parent_entity: Provider
    write_endpoint: "POST /rmd/effectiveness-reports"
    occ_field: "expected_provider_version"
    description: |
      Generating an EffectivenessReport against a Provider whose version has
      advanced since the client last observed it is rejected with 412. Report
      metrics are computed from provider-scoped counters, and a newer report
      legitimately supersedes any overlapping-period report
      (state_machines.EffectivenessReport GENERATED_to_SUPERSEDED), so a
      generation request built on a stale provider view would publish
      effectiveness numbers that no longer describe the provider.
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules
# =============================================================================
calculations:
  - name: attestation_level_assignment
    trigger: "POST /rmd/call-attestations, before the CallAttestation row is persisted"
    algorithm: constraint_propagation
    formula: |
      Inputs: P = the signing Provider, C = the identified Customer, N = the
      NumberAssignment matching (C.id, calling_number) with status == ACTIVE and
      effective_from <= origination_time < effective_to (effective_to null means
      open-ended), A = P.auth_posture, R = C.risk_tier.

      ownership_verified = (N exists AND N.ownership_evidence IN {DIRECT_ALLOCATION, PORTED_IN})

      Evaluate the ladder in this exact order and stop at the first match:
        step 1. A == GATEWAY_LIMITED
                  -> level C, reason GATEWAY_PASSTHROUGH        (posture beats everything)
        step 2. R == HIGH
                  -> level C, reason RISK_DOWNGRADE             (risk beats KYC strength)
        step 3. C.kyc_evidence_level == BUSINESS_REGISTRY_VERIFIED AND ownership_verified
                  -> level A, reason FULL_KYC_AND_OWNERSHIP
        step 4. C.kyc_evidence_level == BUSINESS_REGISTRY_VERIFIED AND NOT ownership_verified
                  -> level B, reason KYC_ONLY_NO_OWNERSHIP
        step 5. C.kyc_evidence_level == CONTRACT_ONLY AND ownership_verified
                  -> level B, reason OWNERSHIP_WITH_PARTIAL_KYC
        step 6. C.kyc_evidence_level == CONTRACT_ONLY AND NOT ownership_verified
                  -> level C, reason NO_VERIFIED_BASIS
        step 7. otherwise (kyc_evidence_level == SELF_ATTESTED)
                  -> level C, reason NO_VERIFIED_BASIS

      risk_tier_at_signing = R (snapshot, never recomputed afterwards)
      certificate_id = P.active_certificate_id
      passport_identity_token = "shaken;" + certificate_id + ";" + attestation_level
    input_set: "The signing Provider's auth_posture at signing time, the Customer's kyc_evidence_level and risk_tier at signing time, and only NumberAssignments in status ACTIVE whose half-open [effective_from, effective_to) interval contains origination_time"
    constants:
      POSTURE_OVERRIDE_ORDER: "auth_posture is evaluated before risk_tier, and risk_tier before KYC evidence"
      HIGH_RISK_MAX_LEVEL: C
      GATEWAY_LEVEL: C
    precision: "Not numeric; enum result. Reason code is part of the observable result and is asserted alongside the level."
    note: |
      Ladder order is the load-bearing part: a Customer with BUSINESS_REGISTRY_VERIFIED kyc and verified
      ownership under a GATEWAY_LIMITED provider is C (not A), and the same customer
      at risk_tier HIGH under a FULL_ATTESTATION provider is also C but with reason
      RISK_DOWNGRADE — the reason code is what distinguishes the two collapsed paths.

  - name: customer_traffic_risk_index
    trigger: "POST /rmd/traffic-observations (recompute for the observation's Customer), and again whenever an older observation for the same customer is added out of order"
    algorithm: weighted_scoring
    formula: |
      Per-window subscore, computed once when the TrafficObservation is created and
      stored on TrafficObservation.window_subscore:
        if total_call_count == 0: raw = 0
        else:
          short_ratio      = short_duration_call_count / total_call_count
          unanswered_ratio = unanswered_call_count     / total_call_count
          complaint_ratio  = complaint_count           / total_call_count
          raw = 0.45 * short_ratio
              + 0.35 * unanswered_ratio
              + 0.20 * min(1, complaint_ratio * COMPLAINT_AMPLIFIER)
        window_subscore = round_half_up(raw, 2)      # 2 decimals, stored

      Customer index, recomputed from stored subscores (never from raw):
        take the RECENCY_DEPTH observations of this customer with the greatest
        window_end, ordered window_end descending; break ties on created_at
        ascending (never on id)
        assign weights [0.50, 0.30, 0.20] positionally to that ordered list
        if fewer than RECENCY_DEPTH observations exist, use only the leading
        weights and renormalize by their sum
        traffic_risk_index = round_half_up(sum(weight_i * window_subscore_i) / sum(weights_used), 4)

      risk_tier = HIGH     when traffic_risk_index >= HIGH_TIER_THRESHOLD
                = ELEVATED when traffic_risk_index >= ELEVATED_TIER_THRESHOLD
                = LOW      otherwise
      TrafficObservation.resulting_risk_index = the index value after this observation
      TrafficObservation.triggered_suspension = true when this observation drove the
      index to >= AUTO_SUSPEND_THRESHOLD while origination_state was ENABLED
    input_set: "Every TrafficObservation of the customer, ranked by window_end descending; only the RECENCY_DEPTH most recent windows contribute. Observations are immutable, so the index changes only when a new observation is recorded."
    constants:
      COMPLAINT_AMPLIFIER: 50
      RECENCY_DEPTH: 3
      RECENCY_WEIGHTS: [0.50, 0.30, 0.20]
      HIGH_TIER_THRESHOLD: 0.7500
      ELEVATED_TIER_THRESHOLD: 0.4000
      AUTO_SUSPEND_THRESHOLD: 0.9000
    precision: "window_subscore: 2 decimals, round_half_up, persisted and reused. traffic_risk_index: 4 decimals, round_half_up, computed from the 2-decimal subscores — NOT from unrounded raw values."
    note: |
      Rounding stage is observable. Windows (1000,800,600,5) -> 0.62,
      (3,1,2,0) -> 0.38 (raw 0.3833...), (7,7,7,1) -> 1.00 give
      traffic_risk_index 0.7380 under the mandated per-window rounding, but
      0.7390 if raw values are carried to the end — a 0.0010 divergence that
      also sits on the wrong side of no threshold, so it must be asserted directly.

  - name: mitigation_effectiveness_score
    trigger: "POST /rmd/effectiveness-reports (with the client-selected variant) and POST /rmd/effectiveness-reports/{reportId}/certify (recomputes the same period under variant CERTIFIED)"
    algorithm: weighted_scoring
    formula: |
      Period is half-open [period_start, period_end). All three components are
      computed over the reporting Provider's own rows only.

      attestation_component:
        signed_total = count of CallAttestation with origination_time in period
        level_a      = those with attestation_level == 'A'
        if signed_total == 0: attestation_component = 0.0000, data_sufficiency = INSUFFICIENT
        else: attestation_component = round_half_up(level_a / signed_total, 4),
              data_sufficiency = SUFFICIENT

      traceback_component:
        tb_total   = count of TracebackRequest with received_at in period
        tb_ontime  = those in state RESPONDED
        tb_pending = those in state RECEIVED whose response_deadline_at >= the
                     current logical clock (still answerable, not yet overdue)
        numerator  = tb_ontime + (tb_pending if variant == PROVISIONAL else 0)
        traceback_component = 1.0000 when tb_total == 0
                            else round_half_up(numerator / tb_total, 4)

      notice_component:
        n_total = count of IllegalTrafficNotice with notified_at in period
        n_done  = those in state MITIGATED or ALL_TRAFFIC_BLOCKED
        n_open  = those in state NOTIFIED or UNDER_INVESTIGATION whose
                  mitigation_deadline_at >= the current logical clock
        numerator = n_done + (n_open if variant == PROVISIONAL else 0)
        notice_component = 1.0000 when n_total == 0
                         else round_half_up(numerator / n_total, 4)

      effectiveness_score = round_half_up(
          0.40 * attestation_component
        + 0.35 * traceback_component
        + 0.25 * notice_component, 4)

      score_band (consumed by forfeiture_assessment):
        HIGH when effectiveness_score >= 0.8000
        MID  when effectiveness_score >= 0.6000
        LOW  otherwise
    input_set: "CallAttestations by origination_time, TracebackRequests by received_at, IllegalTrafficNotices by notified_at — all for this provider_id, all inside the half-open reporting period. State filtering differs per variant."
    constants:
      ATTESTATION_WEIGHT: 0.40
      TRACEBACK_WEIGHT: 0.35
      NOTICE_WEIGHT: 0.25
      EMPTY_TRACEBACK_COMPONENT: 1.0000
      EMPTY_NOTICE_COMPONENT: 1.0000
      EMPTY_ATTESTATION_COMPONENT: 0.0000
      HIGH_BAND_THRESHOLD: 0.8000
      MID_BAND_THRESHOLD: 0.6000
    precision: "Each component 4 decimals round_half_up; the weighted sum is rounded to 4 decimals from the already-rounded components."
    variants:
      - name: PROVISIONAL
        when: "Selected by the `variant` field on POST /rmd/effectiveness-reports. Work still in flight is presumed to land compliant."
        difference: "Tracebacks still answerable (state RECEIVED, deadline not passed) count toward the compliant numerator, and notices still inside their mitigation deadline count as handled."
      - name: CERTIFIED
        when: "Selected by the `variant` field on POST /rmd/effectiveness-reports, and forced on POST /rmd/effectiveness-reports/{reportId}/certify, which overwrites variant = CERTIFIED and recomputes every component in place. Only finished work counts."
        difference: "Pending tracebacks and open notices are excluded from the numerator but remain in the denominator, so the score can only fall or stay equal — a PROVISIONAL report that is certified loses exactly those numerators."
    note: |
      Divergence on identical data: 2 signed attestations of which 1 is level A,
      2 tracebacks (1 RESPONDED, 1 RECEIVED), 2 notices (1 MITIGATED, 1 NOTIFIED)
      gives PROVISIONAL (0.5000, 1.0000, 1.0000) -> 0.8000 / band HIGH but
      CERTIFIED (0.5000, 0.5000, 0.5000) -> 0.5000 / band LOW. That single
      certify call moves the forfeiture credit from 25% to 5%.

  - name: forfeiture_assessment
    trigger: "POST /rmd/enforcement-actions"
    algorithm: tiered_pricing
    formula: |
      base_assessment_cents =
        violation_count * PER_VIOLATION_CENTS      when assessment_basis == PER_VIOLATION
        violation_days  * CONTINUING_DAILY_CENTS   when assessment_basis == CONTINUING_DAILY

      base_capped_cents = min(base_assessment_cents, STATUTORY_CAP_CENTS)

      assessment_tier is keyed on base_capped_cents, i.e. AFTER the cap and
      BEFORE any mitigation credit:
        TIER_1 when base_capped_cents <= TIER_1_CEILING_CENTS
        TIER_2 when base_capped_cents <= TIER_2_CEILING_CENTS
        TIER_3 otherwise

      score_band = the score_band of this Provider's most recent EffectivenessReport
      in state SIGNED_OFF or FILED, ranked by period_end descending then created_at
      ascending; NONE when the provider has no such report.

      mitigation_credit_cents = round_half_up(base_capped_cents * CREDIT_TABLE[assessment_tier][score_band], 0)
      total_forfeiture_cents  = base_capped_cents - mitigation_credit_cents
    input_set: "The violation counters supplied on the request plus exactly one EffectivenessReport — the provider's most recent SIGNED_OFF or FILED report. GENERATED and SUPERSEDED reports are ignored, which is why an uncertified report yields band NONE and zero credit."
    constants:
      PER_VIOLATION_CENTS: 1000000
      CONTINUING_DAILY_CENTS: 250000
      STATUTORY_CAP_CENTS: 100000000
      TIER_1_CEILING_CENTS: 2000000
      TIER_2_CEILING_CENTS: 20000000
      CREDIT_TABLE:
        TIER_1: { HIGH: 0.30, MID: 0.15, LOW: 0.05, NONE: 0.00 }
        TIER_2: { HIGH: 0.25, MID: 0.10, LOW: 0.05, NONE: 0.00 }
        TIER_3: { HIGH: 0.15, MID: 0.05, LOW: 0.00, NONE: 0.00 }
    precision: "Integer cents throughout; the credit is the only rounding step (round_half_up to whole cents). Never round the base or the total separately."
    variants:
      - name: PER_VIOLATION
        when: "assessment_basis == PER_VIOLATION — a countable set of illegal calls"
        difference: "Charges violation_count * 1,000,000 cents and ignores violation_days entirely."
      - name: CONTINUING_DAILY
        when: "assessment_basis == CONTINUING_DAILY — an ongoing failure to mitigate"
        difference: "Charges violation_days * 250,000 cents and ignores violation_count entirely; the same request body therefore lands in a different tier and a different credit percentage."
    note: |
      Same body (violation_count 3, violation_days 10, band HIGH):
      PER_VIOLATION  -> base 3,000,000, TIER_2, credit 25% = 750,000, total 2,250,000
      CONTINUING_DAILY -> base 2,500,000, TIER_2, credit 25% = 625,000, total 1,875,000
      Tier is computed pre-credit: (8 violations, band HIGH) -> base 8,000,000 is
      TIER_2 with credit 2,000,000 and total 6,000,000, whereas
      (violation_days 8, CONTINUING_DAILY, band HIGH) -> base 2,000,000 is exactly
      TIER_1_CEILING_CENTS, so TIER_1 with credit 30% = 600,000 and total 1,400,000.
      Cap first: 150 violations -> base 150,000,000 capped to 100,000,000, TIER_3,
      credit 15% = 15,000,000, total 85,000,000.

  - name: provider_posture_recompute
    trigger: "Any change to Provider.penalty_points, Provider.rmd_filing_status, or Provider.overdue_traceback_count — i.e. after plan decisions, traceback overdue/late events, notice expiry, and certificate revocation"
    algorithm: constraint_propagation
    formula: |
      Evaluate in order, stop at the first match:
        1. rmd_filing_status == UNFILED
             OR penalty_points >= SUSPENSION_POINT_THRESHOLD
             OR Provider.active_certificate_id is null
           -> auth_posture = SIGNING_SUSPENDED
        2. rmd_filing_status == PARTIAL
             OR overdue_traceback_count >= 1
           -> auth_posture = GATEWAY_LIMITED
        3. otherwise -> auth_posture = FULL_ATTESTATION

      rmd_filing_status is itself derived from the provider's operative
      MitigationPlan (the plan whose filing_state is not WITHDRAWN and not
      SUPERSEDED):
        no such plan, or filing_state == DRAFT              -> UNFILED
        filing_state IN {SUBMITTED, DEFICIENT}              -> PARTIAL
        filing_state == ACCEPTED                            -> COMPLETE
    input_set: "Only the provider's own counters and its single operative MitigationPlan. Withdrawn and superseded plans never contribute."
    constants:
      SUSPENSION_POINT_THRESHOLD: 10
      OVERDUE_TRACEBACK_GATEWAY_THRESHOLD: 1
      LATE_TRACEBACK_POINTS: 3
      EXPIRED_NOTICE_POINTS: 5
    precision: "Integer point arithmetic; no rounding."
    note: |
      The ladder is why posture is not a simple flag: a provider with an ACCEPTED
      plan and 9 penalty_points but one overdue traceback is GATEWAY_LIMITED, and
      one more expired notice (+5 -> 14) makes it SIGNING_SUSPENDED. Responding to
      the overdue traceback clears overdue_traceback_count but not penalty_points,
      so the posture only recovers to FULL_ATTESTATION while points stay below 10.

  - name: traceback_response_timeliness
    trigger: "POST /rmd/traceback-requests (sets the deadlines) and POST /rmd/traceback-requests/{tracebackId}/respond (evaluates them)"
    algorithm: threshold
    formula: |
      At creation:
        response_deadline_at = received_at + RESPONSE_WINDOW_HOURS hours
        hard_cutoff_at       = received_at + HARD_CUTOFF_HOURS hours

      At respond time, with now = current logical clock:
        now >  hard_cutoff_at        -> reject with ERR_RESPONSE_WINDOW_CLOSED (409)
        now <= response_deadline_at  -> state RESPONDED,      lateness_seconds = 0
        otherwise                     -> state RESPONDED_LATE, lateness_seconds =
                                         ceil((now - response_deadline_at) in seconds)

      Both boundaries are inclusive of the deadline instant: responding at exactly
      response_deadline_at is on time, and responding at exactly hard_cutoff_at is
      accepted but late.
    input_set: "The single TracebackRequest plus the logical clock. No other entity participates."
    constants:
      RESPONSE_WINDOW_HOURS: 24
      HARD_CUTOFF_HOURS: 72
      LATE_TRACEBACK_POINTS: 3
    precision: "lateness_seconds is a whole number of seconds, rounded up (ceil), so any positive fraction of a second is already late by 1."
    note: |
      With received_at 2026-08-05T00:00:00Z the deadline is 2026-08-06T00:00:00Z
      (on time, lateness 0), 2026-08-06T00:00:01Z is RESPONDED_LATE with
      lateness_seconds 1, the hard cutoff 2026-08-08T00:00:00Z is still accepted
      with lateness_seconds 172800, and 2026-08-08T00:00:01Z is refused.

  - name: provider_outstanding_forfeiture
    trigger: "EnforcementAction creation and every EnforcementAction status change (contest, adjudicate, pay)"
    algorithm: aggregation
    formula: |
      Provider.outstanding_forfeiture_cents =
        sum(total_forfeiture_cents) over this provider's EnforcementActions
        whose status IN {PROPOSED, CONTESTED, SUSTAINED}

      Actions in status PAID or DISMISSED leave the set. The value is a full
      recompute over the set, never an incremental delta, so a DISMISSED action
      restores the exact pre-assessment total.
    input_set: "EnforcementActions of this provider in status PROPOSED, CONTESTED or SUSTAINED. Contesting does not remove an action from the set; only DISMISSED and PAID do."
    constants:
      OUTSTANDING_STATUSES: [PROPOSED, CONTESTED, SUSTAINED]
    precision: "Integer cents; exact, no rounding."

  - name: provider_assignment_and_blocking_metrics
    trigger: "Any NumberAssignment status change, any BlockingEvent status change, and any BlockingDispute resolution"
    algorithm: aggregation
    formula: |
      Provider.active_assigned_number_count =
        count of this provider's NumberAssignments with status == ACTIVE
        (SUSPENDED_BY_CUSTOMER and REVOKED assignments are excluded, so a
        customer suspension lowers the count and a dispute reversal raises it
        back to the identical value)

      Provider.blocking_false_positive_rate =
        total    = count of this provider's BlockingEvents in any status
        reversed = count of those with status == REVERSED
        0.0000 when total == 0, else round_half_up(reversed / total, 4)

      Provider.open_notice_count =
        count of this provider's IllegalTrafficNotices with state IN {NOTIFIED, UNDER_INVESTIGATION}

      Provider.overdue_traceback_count =
        count of this provider's TracebackRequests with state == OVERDUE
        (a late answer leaves this set; it does NOT leave the penalty set below)

      Provider.penalty_points =
        PLAN_DEFICIENCY_POINTS * sum(MitigationPlan.deficiency_count) over this provider's plans
      + LATE_TRACEBACK_POINTS  * (count of TracebackRequests in state OVERDUE or RESPONDED_LATE)
      + sum(penalty_points_assessed) over IllegalTrafficNotices in state EXPIRED_UNMITIGATED
    input_set: "Only rows belonging to the provider. Every BlockingEvent of the provider sits in the false-positive denominator regardless of status, so filing or reviewing a dispute never moves the rate — only a REVERSE resolution does, by raising the numerator."
    constants:
      PLAN_DEFICIENCY_POINTS: 2
      LATE_TRACEBACK_POINTS: 3
      EXPIRED_NOTICE_POINTS: 5
    precision: "Counts are integers; blocking_false_positive_rate is 4 decimals round_half_up."
    note: |
      penalty_points counts OVERDUE and RESPONDED_LATE alike, which is what makes
      the late response recover posture (overdue_traceback_count falls) without
      recovering points — the two counters move independently over the same rows.

# =============================================================================
# §1.4 Validation Rules (ordered by priority — the first violated rule wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "The role in X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Body is valid JSON, every required input field is present and of the declared type, every enum value is a declared member, integers are non-negative where the field is a count, numbers with 4-decimal semantics are within [0.0000, 1.0000], and pagination limit/offset are within bounds"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 4
    category: business_constraint
    check: "Every telephone_number, calling_number and called_number matches E.164 with a leading '+' and 11 to 15 digits"
    error_id: ERR_INVALID_NUMBER_FORMAT
    http_status: 422
    applies_to: "POST /rmd/number-assignments, POST /rmd/call-attestations, POST /rmd/traceback-requests, POST /rmd/illegal-traffic-notices, POST /rmd/blocking-events"

  - priority: 5
    category: business_temporal
    check: "Every supplied interval is well-ordered: not_before < not_after, window_start < window_end, period_start < period_end, and effective_from < effective_to when effective_to is supplied"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /rmd/certificates, POST /rmd/traffic-observations, POST /rmd/effectiveness-reports, POST /rmd/number-assignments"

  - priority: 6
    category: existence
    check: "Every id embedded in the path exists, validated left to right"
    error_id: "ERR_PROVIDER_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_ASSIGNMENT_NOT_FOUND | ERR_ATTESTATION_NOT_FOUND | ERR_OBSERVATION_NOT_FOUND | ERR_TRACEBACK_NOT_FOUND | ERR_NOTICE_NOT_FOUND | ERR_BLOCKING_EVENT_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_ENFORCEMENT_NOT_FOUND | ERR_REPORT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a path id"

  - priority: 7
    category: existence
    check: "Every FK supplied in the body exists, validated in body-field declaration order (provider_id, then customer_id, then blocking_event_id / certificate_id / identified_customer_id / produced_attestation_id)"
    error_id: "ERR_PROVIDER_NOT_FOUND | ERR_CUSTOMER_NOT_FOUND | ERR_CERTIFICATE_NOT_FOUND | ERR_BLOCKING_EVENT_NOT_FOUND | ERR_ATTESTATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints carrying a body FK"

  - priority: 8
    category: auth
    check: "For entity_backed roles, the acting identity owns the target: a ProviderAdmin's X-User-ID equals the target row's provider_id, and a Caller's X-User-ID equals the target row's customer_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all endpoints whose roles include ProviderAdmin or Caller"

  - priority: 9
    category: business_safety
    check: "Segregation of duties: the KycAnalyst deciding a customer is not the one who submitted it (X-User-ID != Customer.kyc_submitted_by_user_id); the FraudAnalyst resolving a dispute is not the one who created the disputed BlockingEvent (X-User-ID != BlockingEvent.blocked_by_user_id); the ComplianceOfficer signing off a report is not the one who filed the operative MitigationPlan (X-User-ID != MitigationPlan.filed_by_user_id)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /rmd/customers/{customerId}/kyc-decision, POST /rmd/blocking-disputes/{disputeId}/resolve, POST /rmd/effectiveness-reports/{reportId}/certify"

  - priority: 10
    category: state
    check: "When expected_provider_version is supplied it equals the Provider's current version (see §1.2.1)"
    error_id: ERR_STALE_PROVIDER_VERSION
    http_status: 412
    applies_to: "POST /rmd/mitigation-plans, POST /rmd/effectiveness-reports"

  - priority: 11
    category: state
    check: "The target Certificate is in a status the requested transition allows (issue requires REQUESTED, activate requires ISSUED, renew requires ACTIVE, revoke requires REQUESTED/ISSUED/ACTIVE)"
    error_id: ERR_CERTIFICATE_STATE_INVALID
    http_status: 409
    applies_to: "POST /rmd/certificates/{certificateId}/issue, /activate, /renew, /revoke"

  - priority: 12
    category: state
    check: "The signing Provider has a non-null active_certificate_id, i.e. one Certificate in status ACTIVE"
    error_id: ERR_NO_ACTIVE_CERTIFICATE
    http_status: 409
    applies_to: "POST /rmd/call-attestations"

  - priority: 13
    category: state
    check: "The target MitigationPlan is in a status the requested transition allows (submit requires DRAFT or DEFICIENT, decision requires SUBMITTED, withdraw requires DRAFT/SUBMITTED/DEFICIENT); and, on report certification, the reporting Provider's operative plan (filing_state NOT IN {WITHDRAWN, SUPERSEDED}) is ACCEPTED"
    error_id: ERR_PLAN_STATE_INVALID
    http_status: 409
    applies_to: "POST /rmd/mitigation-plans/{planId}/submit, /decision, /withdraw, POST /rmd/effectiveness-reports/{reportId}/certify"

  - priority: 14
    category: state
    check: "The target Customer's kyc_state allows the requested transition (kyc-submit requires PENDING or REJECTED, kyc-decision requires UNDER_REVIEW)"
    error_id: ERR_CUSTOMER_KYC_STATE_INVALID
    http_status: 409
    applies_to: "POST /rmd/customers/{customerId}/kyc-submit, POST /rmd/customers/{customerId}/kyc-decision"

  - priority: 15
    category: state
    check: "The target Customer's origination_state allows the requested action (ENABLE requires DISABLED, SUSPEND requires ENABLED, RESTORE requires SUSPENDED, TERMINATE requires any non-TERMINATED state)"
    error_id: ERR_ORIGINATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /rmd/customers/{customerId}/origination-actions"

  - priority: 16
    category: state
    check: "The target NumberAssignment is in status ACTIVE or SUSPENDED_BY_CUSTOMER (a REVOKED assignment cannot be revoked or suspended again)"
    error_id: ERR_ASSIGNMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /rmd/number-assignments/{assignmentId}/revoke"

  - priority: 17
    category: state
    check: "The target TracebackRequest is in state RECEIVED or OVERDUE"
    error_id: ERR_TRACEBACK_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /rmd/traceback-requests/{tracebackId}/respond"

  - priority: 18
    category: state
    check: "The target IllegalTrafficNotice is in the state the requested transition needs (investigate requires NOTIFIED, mitigate requires UNDER_INVESTIGATION)"
    error_id: ERR_NOTICE_ALREADY_CLOSED
    http_status: 409
    applies_to: "POST /rmd/illegal-traffic-notices/{noticeId}/investigate, /mitigate"

  - priority: 19
    category: state
    check: "The target BlockingDispute is in the state the requested transition needs (review requires FILED, resolve requires UNDER_REVIEW, withdraw requires FILED)"
    error_id: ERR_DISPUTE_STATE_INVALID
    http_status: 409
    applies_to: "POST /rmd/blocking-disputes/{disputeId}/review, /resolve, /withdraw"

  - priority: 20
    category: state
    check: "The target EnforcementAction is in the status the requested transition needs (contest requires PROPOSED, adjudicate requires CONTESTED, pay requires PROPOSED or SUSTAINED)"
    error_id: ERR_ENFORCEMENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /rmd/enforcement-actions/{actionId}/contest, /adjudicate, /pay"

  - priority: 21
    category: state
    check: "The target EffectivenessReport is in the state the requested transition needs (certify requires GENERATED, file requires SIGNED_OFF)"
    error_id: ERR_REPORT_STATE_INVALID
    http_status: 409
    applies_to: "POST /rmd/effectiveness-reports/{reportId}/certify, /file"

  - priority: 22
    category: business_safety
    check: "A MitigationPlan being submitted describes at least MIN_PRACTICES = 3 prevention_practices and includes both KYC_ONBOARDING and TRACEBACK_COOPERATION"
    error_id: ERR_PRACTICES_INSUFFICIENT
    http_status: 422
    applies_to: "POST /rmd/mitigation-plans/{planId}/submit"

  - priority: 23
    category: state
    check: "The signing Provider's auth_posture is not SIGNING_SUSPENDED"
    error_id: ERR_SIGNING_SUSPENDED
    http_status: 409
    applies_to: "POST /rmd/call-attestations"

  - priority: 24
    category: business_safety
    check: "The identified Customer's kyc_state is VERIFIED"
    error_id: ERR_CUSTOMER_NOT_KYC_VERIFIED
    http_status: 422
    applies_to: "POST /rmd/call-attestations, POST /rmd/customers/{customerId}/origination-actions with action == ENABLE, POST /rmd/number-assignments"

  - priority: 25
    category: business_safety
    check: "The identified Customer's origination_state is ENABLED"
    error_id: ERR_ORIGINATION_NOT_ENABLED
    http_status: 422
    applies_to: "POST /rmd/call-attestations, POST /rmd/number-assignments"

  - priority: 26
    category: business_safety
    check: "A ProviderAdmin restoring origination may only clear a suspension whose suspension_cause == PROVIDER_REQUEST; NOTICE_EXPIRY, BLOCKING_ANALYTICS, TRAFFIC_RISK_THRESHOLD and REGULATOR_ORDER suspensions are clearable only by a Regulator"
    error_id: ERR_SUSPENSION_CAUSE_NOT_SELF_CLEARABLE
    http_status: 403
    applies_to: "POST /rmd/customers/{customerId}/origination-actions with action == RESTORE"

  - priority: 27
    category: business_constraint
    check: "A BlockingEvent with reason == ANALYTICS_SCORE carries analytics_score >= BLOCK_MIN_SCORE = 0.6500"
    error_id: ERR_SCORE_BELOW_BLOCKING_THRESHOLD
    http_status: 422
    applies_to: "POST /rmd/blocking-events"

  - priority: 28
    category: business_temporal
    check: "The current logical clock is at or before the TracebackRequest's hard_cutoff_at"
    error_id: ERR_RESPONSE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /rmd/traceback-requests/{tracebackId}/respond"

  - priority: 29
    category: business_temporal
    check: "A TrafficObservation's window_end is at or before the current logical clock (no observations about the future)"
    error_id: ERR_WINDOW_IN_FUTURE
    http_status: 422
    applies_to: "POST /rmd/traffic-observations"

  - priority: 30
    category: business_temporal
    check: "An EffectivenessReport's period_end is at or before the current logical clock, so the reported period has fully elapsed"
    error_id: ERR_REPORT_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /rmd/effectiveness-reports"

  - priority: 31
    category: business_constraint
    check: "The new NumberAssignment's half-open [effective_from, effective_to) interval does not overlap any non-REVOKED assignment of the same telephone_number under the same provider; effective_to == null means open-ended. Adjacency (previous.effective_to == new.effective_from) is allowed"
    error_id: ERR_NUMBER_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /rmd/number-assignments"

  - priority: 32
    category: business_constraint
    check: "The new TrafficObservation's closed [window_start, window_end] interval does not overlap any existing observation of the same customer; touching endpoints (previous.window_end == new.window_start) DO collide because both bounds are inclusive"
    error_id: ERR_OBSERVATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /rmd/traffic-observations"

  - priority: 33
    category: business_constraint
    check: "The disputed BlockingEvent has no BlockingDispute in state FILED, UNDER_REVIEW, UPHELD or REVERSED (a WITHDRAWN dispute may be refiled)"
    error_id: ERR_DUPLICATE_DISPUTE
    http_status: 409
    applies_to: "POST /rmd/blocking-disputes"

  - priority: 34
    category: business_referential
    check: "The referenced Customer belongs to the referenced Provider: Customer.provider_id equals the provider_id on the request or on the parent artifact"
    error_id: ERR_CUSTOMER_PROVIDER_MISMATCH
    http_status: 422
    applies_to: "POST /rmd/number-assignments, POST /rmd/call-attestations, POST /rmd/traffic-observations, POST /rmd/illegal-traffic-notices/{noticeId}/investigate, POST /rmd/blocking-events"

  - priority: 35
    category: business_referential
    check: "The produced CallAttestation matches the traced call: its provider_id equals the TracebackRequest's provider_id, its customer_id equals identified_customer_id, its calling_number and called_number equal the traceback's, and its origination_time equals the traceback's origination_time"
    error_id: ERR_CALL_DETAIL_MISMATCH
    http_status: 422
    applies_to: "POST /rmd/traceback-requests/{tracebackId}/respond"

  - priority: 36
    category: business_referential
    check: "The response produces complete call detail: both identified_customer_id and produced_attestation_id are supplied and the identified customer has at least one NumberAssignment covering the traced calling_number at origination_time"
    error_id: ERR_CALL_DETAIL_INCOMPLETE
    http_status: 422
    applies_to: "POST /rmd/traceback-requests/{tracebackId}/respond"

  - priority: 37
    category: business_fiscal
    check: "The paid amount_cents equals the EnforcementAction's total_forfeiture_cents exactly — no partial and no overpayment"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /rmd/enforcement-actions/{actionId}/pay"

# =============================================================================
# §1.5 API Endpoints (api_prefix /rmd; the /_clock namespace is test-driving)
# =============================================================================
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z — the fixed startup default — and never falls back to wall-clock time. Every deadline, expiry and window rule in this domain is evaluated against this clock."
    roles: [Regulator, PolicyAdministrator, ComplianceOfficer, KycAnalyst, FraudAnalyst, ProviderAdmin, Caller]
    code: 200
    input: [current_utc]
    output: null
    side_effects: ["No entity is modified; subsequent reads of the logical clock return current_utc"]

  - method: POST
    path: "/rmd/compliance-sweeps"
    description: "Runs the deadline sweep for one provider: expires certificates past not_after, marks unanswered tracebacks OVERDUE, expires unmitigated notices, and applies every downstream cascade those transitions cause"
    roles: [Regulator]
    code: 200
    input: [provider_id]
    output: Provider
    side_effects:
      - "Certificate ACTIVE|ISSUED -> EXPIRED when current logical clock > not_after"
      - "TracebackRequest RECEIVED -> OVERDUE when current logical clock > response_deadline_at"
      - "IllegalTrafficNotice NOTIFIED|UNDER_INVESTIGATION -> EXPIRED_UNMITIGATED when current logical clock > mitigation_deadline_at, with the customer/assignment/provider cascade"
      - "calculations.provider_assignment_and_blocking_metrics then calculations.provider_posture_recompute"
      - "Provider.sweep_index += 1 and Provider.version increments"

  - method: POST
    path: "/rmd/providers"
    description: "Registers a voice service provider"
    roles: [Regulator]
    code: 201
    input: [legal_name, provider_type]
    output: Provider
    side_effects: ["auth_posture starts SIGNING_SUSPENDED because the provider has neither an ACTIVE certificate nor a filed mitigation plan"]

  - method: GET
    path: "/rmd/providers/{providerId}"
    description: "Reads one provider with all derived compliance counters"
    roles: [Regulator, PolicyAdministrator, ComplianceOfficer, KycAnalyst, FraudAnalyst, ProviderAdmin]
    code: 200
    input: []
    output: Provider
    side_effects: []

  - method: GET
    path: "/rmd/providers"
    description: "Lists providers, filterable by classification and authentication posture"
    roles: [Regulator, PolicyAdministrator, ComplianceOfficer, KycAnalyst, FraudAnalyst]
    code: 200
    input: ["provider_type?", "auth_posture?", "rmd_filing_status?", "limit?", "offset?"]
    output: Provider[]
    side_effects: []

  - method: POST
    path: "/rmd/certificates"
    description: "Policy Administrator records a certificate request for a provider"
    roles: [PolicyAdministrator]
    code: 201
    input: [provider_id, spc_token, public_key_fingerprint, not_before, not_after]
    output: Certificate
    side_effects: ["status = REQUESTED; renewal_generation = 1; predecessor_certificate_id = null"]

  - method: POST
    path: "/rmd/certificates/{certificateId}/issue"
    description: "Policy Administrator issues the requested certificate"
    roles: [PolicyAdministrator]
    code: 200
    input: []
    output: Certificate
    side_effects: ["REQUESTED -> ISSUED; issued_at = current logical clock"]

  - method: POST
    path: "/rmd/certificates/{certificateId}/activate"
    description: "Provider activates an issued certificate as its signing credential"
    roles: [ProviderAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects:
      - "ISSUED -> ACTIVE; activated_at = current logical clock"
      - "Provider.active_certificate_id = this certificate's id, then calculations.provider_posture_recompute"

  - method: POST
    path: "/rmd/certificates/{certificateId}/renew"
    description: "Policy Administrator renews an ACTIVE certificate, creating the successor and superseding the predecessor"
    roles: [PolicyAdministrator]
    code: 201
    input: [spc_token, public_key_fingerprint, not_before, not_after]
    output: Certificate
    side_effects:
      - "Creates a successor Certificate in status ISSUED with predecessor_certificate_id = {certificateId}, renewal_generation = predecessor.renewal_generation + 1, issued_at = current logical clock and the same provider_id"
      - "The predecessor moves ACTIVE -> SUPERSEDED"
      - "Provider.active_certificate_id = null until the ProviderAdmin activates the successor; calculations.provider_posture_recompute therefore yields SIGNING_SUSPENDED for the gap"
      - "Returns the successor Certificate; it is also discoverable through GET /rmd/certificates?predecessor_certificate_id="

  - method: POST
    path: "/rmd/certificates/{certificateId}/revoke"
    description: "Policy Administrator revokes a certificate in any pre-terminal status"
    roles: [PolicyAdministrator]
    code: 200
    input: [revocation_reason]
    output: Certificate
    side_effects:
      - "REQUESTED|ISSUED|ACTIVE -> REVOKED; revoked_at = current logical clock"
      - "When the revoked certificate was the ACTIVE one: Provider.active_certificate_id = null, then calculations.provider_posture_recompute drives auth_posture to SIGNING_SUSPENDED"

  - method: GET
    path: "/rmd/certificates/{certificateId}"
    description: "Reads one certificate"
    roles: [Regulator, PolicyAdministrator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: []
    output: Certificate
    side_effects: []

  - method: GET
    path: "/rmd/certificates"
    description: "Lists certificates by provider, by predecessor (renewal chain walk) or by status"
    roles: [Regulator, PolicyAdministrator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: ["provider_id?", "predecessor_certificate_id?", "status?", "limit?", "offset?"]
    output: Certificate[]
    side_effects: []

  - method: POST
    path: "/rmd/mitigation-plans"
    description: "Compliance officer drafts a robocall mitigation plan against a provider whose version the client has just observed"
    roles: [ComplianceOfficer]
    code: 201
    input: [provider_id, prevention_practices, expected_provider_version]
    output: MitigationPlan
    side_effects:
      - "Rejected with ERR_STALE_PROVIDER_VERSION (412) when expected_provider_version != Provider.version (§1.2.1 plan-file-stale-provider)"
      - "filing_state = DRAFT; every other non-WITHDRAWN plan of the provider moves to SUPERSEDED"
      - "calculations.provider_posture_recompute, because rmd_filing_status is derived from the operative plan"

  - method: POST
    path: "/rmd/mitigation-plans/{planId}/submit"
    description: "Files the plan with the regulator"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MitigationPlan
    side_effects:
      - "DRAFT|DEFICIENT -> SUBMITTED; submitted_at = current logical clock; filed_by_user_id = X-User-ID; revision_count += 1"
      - "rmd_filing_status becomes PARTIAL, then calculations.provider_posture_recompute"

  - method: POST
    path: "/rmd/mitigation-plans/{planId}/decision"
    description: "Regulator accepts the filing or returns it as deficient"
    roles: [Regulator]
    code: 200
    input: [decision, "deficiency_reasons?"]
    output: MitigationPlan
    side_effects:
      - "SUBMITTED -> ACCEPTED (rmd_filing_status COMPLETE) or SUBMITTED -> DEFICIENT (deficiency_count += 1, +2 penalty_points)"
      - "calculations.provider_assignment_and_blocking_metrics then calculations.provider_posture_recompute"

  - method: POST
    path: "/rmd/mitigation-plans/{planId}/withdraw"
    description: "Compliance officer withdraws a plan that has not been accepted"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: MitigationPlan
    side_effects: ["DRAFT|SUBMITTED|DEFICIENT -> WITHDRAWN", "rmd_filing_status falls back to UNFILED unless another operative plan exists, then calculations.provider_posture_recompute"]

  - method: GET
    path: "/rmd/mitigation-plans/{planId}"
    description: "Reads one mitigation plan"
    roles: [Regulator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: []
    output: MitigationPlan
    side_effects: []

  - method: GET
    path: "/rmd/mitigation-plans"
    description: "Lists mitigation plans by provider and filing state"
    roles: [Regulator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: ["provider_id?", "filing_state?", "limit?", "offset?"]
    output: MitigationPlan[]
    side_effects: []

  - method: POST
    path: "/rmd/customers"
    description: "Provider onboards an origination customer; KYC starts PENDING and origination starts DISABLED"
    roles: [ProviderAdmin]
    code: 201
    input: [provider_id, legal_name, contact_email, kyc_evidence_level]
    output: Customer
    side_effects: ["kyc_state = PENDING; origination_state = DISABLED; traffic_risk_index = 0.0000; risk_tier = LOW"]

  - method: POST
    path: "/rmd/customers/{customerId}/kyc-submit"
    description: "KYC analyst submits the customer's know-your-customer package for review"
    roles: [KycAnalyst]
    code: 200
    input: ["kyc_evidence_level?"]
    output: Customer
    side_effects: ["PENDING|REJECTED|VERIFIED -> UNDER_REVIEW; kyc_submitted_by_user_id = X-User-ID; kyc_evidence_level overwritten when supplied"]

  - method: POST
    path: "/rmd/customers/{customerId}/kyc-decision"
    description: "A different KYC analyst verifies or rejects the submitted package"
    roles: [KycAnalyst]
    code: 200
    input: [decision]
    output: Customer
    side_effects:
      - "Refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID == kyc_submitted_by_user_id"
      - "UNDER_REVIEW -> VERIFIED or UNDER_REVIEW -> REJECTED; kyc_decided_by_user_id and kyc_decided_at set"
      - "origination_state is never written by this endpoint: the two dimensions are independent, so a REJECTED customer may still read origination_state == ENABLED and is instead refused at signing time by validations[priority=24]"

  - method: POST
    path: "/rmd/customers/{customerId}/origination-actions"
    description: "Single action endpoint over the origination_state dimension: ENABLE, SUSPEND, RESTORE or TERMINATE"
    roles: [ProviderAdmin, Regulator]
    code: 200
    input: [action, "suspension_cause?"]
    output: Customer
    side_effects:
      - "ENABLE requires kyc_state == VERIFIED (ERR_CUSTOMER_NOT_KYC_VERIFIED) and moves DISABLED -> ENABLED"
      - "SUSPEND moves ENABLED -> SUSPENDED with the supplied suspension_cause and suspends the customer's ACTIVE NumberAssignments"
      - "RESTORE moves SUSPENDED -> ENABLED, clears suspension_cause/suspension_source_id and reactivates the SUSPENDED_BY_CUSTOMER assignments; a ProviderAdmin may only clear suspension_cause == PROVIDER_REQUEST"
      - "TERMINATE moves any non-terminal origination_state -> TERMINATED and revokes every non-REVOKED NumberAssignment"
      - "Every branch recomputes Provider.active_assigned_number_count"

  - method: GET
    path: "/rmd/customers/{customerId}"
    description: "Reads one customer with both state dimensions and the traffic risk index"
    roles: [Regulator, ComplianceOfficer, KycAnalyst, FraudAnalyst, ProviderAdmin, Caller]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/rmd/customers"
    description: "Lists customers by provider, KYC state, origination state or risk tier"
    roles: [Regulator, ComplianceOfficer, KycAnalyst, FraudAnalyst, ProviderAdmin]
    code: 200
    input: ["provider_id?", "kyc_state?", "origination_state?", "risk_tier?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/rmd/number-assignments"
    description: "Assigns a telephone number to a KYC-verified, origination-enabled customer for a half-open validity interval"
    roles: [ProviderAdmin]
    code: 201
    input: [provider_id, customer_id, telephone_number, ownership_evidence, effective_from, "effective_to?"]
    output: NumberAssignment
    side_effects:
      - "Rejected with ERR_NUMBER_INTERVAL_OVERLAP when [effective_from, effective_to) overlaps a non-REVOKED assignment of the same number under the same provider; adjacency is allowed"
      - "status = ACTIVE, then Provider.active_assigned_number_count is recomputed"

  - method: POST
    path: "/rmd/number-assignments/{assignmentId}/revoke"
    description: "Revokes a number assignment"
    roles: [ProviderAdmin]
    code: 200
    input: []
    output: NumberAssignment
    side_effects: ["ACTIVE|SUSPENDED_BY_CUSTOMER -> REVOKED; revoked_at set; Provider.active_assigned_number_count recomputed"]

  - method: GET
    path: "/rmd/number-assignments/{assignmentId}"
    description: "Reads one number assignment"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin, Caller]
    code: 200
    input: []
    output: NumberAssignment
    side_effects: []

  - method: GET
    path: "/rmd/number-assignments"
    description: "Lists number assignments by provider, customer, number or status — the only discovery channel for assignments the cascade created or suspended"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin, Caller]
    code: 200
    input: ["provider_id?", "customer_id?", "telephone_number?", "status?", "limit?", "offset?"]
    output: NumberAssignment[]
    side_effects: []

  - method: POST
    path: "/rmd/call-attestations"
    description: "Signs an originating call, assigning the attestation level from posture, risk tier, KYC evidence and number ownership"
    roles: [ProviderAdmin]
    code: 201
    input: [provider_id, customer_id, calling_number, called_number, origination_time]
    output: CallAttestation
    side_effects:
      - "Refused when the provider has no ACTIVE certificate (ERR_NO_ACTIVE_CERTIFICATE), when auth_posture == SIGNING_SUSPENDED (ERR_SIGNING_SUSPENDED), when the customer is not VERIFIED (ERR_CUSTOMER_NOT_KYC_VERIFIED) or not ENABLED (ERR_ORIGINATION_NOT_ENABLED)"
      - "attestation_level, attestation_reason_code, ownership_verified and risk_tier_at_signing are computed by calculations.attestation_level_assignment"
      - "certificate_id = Provider.active_certificate_id; passport_identity_token is derived from it"
      - "Immutable: no version field, no update endpoint"

  - method: GET
    path: "/rmd/call-attestations/{attestationId}"
    description: "Reads one signed-call record"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin]
    code: 200
    input: []
    output: CallAttestation
    side_effects: []

  - method: GET
    path: "/rmd/call-attestations"
    description: "Lists signed-call records by provider, customer, signing certificate or attestation level"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin]
    code: 200
    input: ["provider_id?", "customer_id?", "certificate_id?", "attestation_level?", "limit?", "offset?"]
    output: CallAttestation[]
    side_effects: []

  - method: POST
    path: "/rmd/traffic-observations"
    description: "Records one closed monitoring window for a customer and recomputes the customer's traffic risk index"
    roles: [ProviderAdmin]
    code: 201
    input: [provider_id, customer_id, window_start, window_end, total_call_count, short_duration_call_count, unanswered_call_count, complaint_count]
    output: TrafficObservation
    side_effects:
      - "Rejected with ERR_OBSERVATION_WINDOW_OVERLAP when [window_start, window_end] touches or overlaps an existing window of the same customer"
      - "window_subscore, Customer.traffic_risk_index and Customer.risk_tier are recomputed by calculations.customer_traffic_risk_index"
      - "An index at or above 0.9000 suspends the customer's origination (suspension_cause TRAFFIC_RISK_THRESHOLD) and cascades to its ACTIVE NumberAssignments"
      - "Immutable: no version field, no update endpoint"

  - method: GET
    path: "/rmd/traffic-observations/{observationId}"
    description: "Reads one monitoring window with its stored subscore"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin]
    code: 200
    input: []
    output: TrafficObservation
    side_effects: []

  - method: GET
    path: "/rmd/traffic-observations"
    description: "Lists monitoring windows by provider or customer"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin]
    code: 200
    input: ["provider_id?", "customer_id?", "limit?", "offset?"]
    output: TrafficObservation[]
    side_effects: []

  - method: POST
    path: "/rmd/traceback-requests"
    description: "Regulator sends a traceback request; received_at is the current logical clock and both deadlines are derived from it"
    roles: [Regulator]
    code: 201
    input: [provider_id, calling_number, called_number, origination_time, "upstream_provider_note?"]
    output: TracebackRequest
    side_effects: ["state = RECEIVED; response_deadline_at = received_at + 24h; hard_cutoff_at = received_at + 72h (calculations.traceback_response_timeliness)"]

  - method: POST
    path: "/rmd/traceback-requests/{tracebackId}/respond"
    description: "Provider's compliance officer produces call detail: the originating customer and the signed-call record for the traced call"
    roles: [ComplianceOfficer]
    code: 200
    input: [identified_customer_id, produced_attestation_id, "upstream_provider_note?"]
    output: TracebackRequest
    side_effects:
      - "Refused with ERR_RESPONSE_WINDOW_CLOSED once the current logical clock passes hard_cutoff_at"
      - "RECEIVED|OVERDUE -> RESPONDED when answered at or before response_deadline_at, otherwise RESPONDED_LATE with lateness_seconds and +3 penalty_points"
      - "Answering an OVERDUE request lowers Provider.overdue_traceback_count but leaves penalty_points, then calculations.provider_posture_recompute"

  - method: GET
    path: "/rmd/traceback-requests/{tracebackId}"
    description: "Reads one traceback request with its deadlines and lateness"
    roles: [Regulator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: []
    output: TracebackRequest
    side_effects: []

  - method: GET
    path: "/rmd/traceback-requests"
    description: "Lists traceback requests by provider, by identified customer, by produced attestation or by state"
    roles: [Regulator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: ["provider_id?", "identified_customer_id?", "produced_attestation_id?", "state?", "limit?", "offset?"]
    output: TracebackRequest[]
    side_effects: []

  - method: POST
    path: "/rmd/illegal-traffic-notices"
    description: "Regulator notifies a downstream provider that it is carrying illegal traffic; notified_at is the current logical clock"
    roles: [Regulator]
    code: 201
    input: [provider_id, calling_number, description]
    output: IllegalTrafficNotice
    side_effects: ["state = NOTIFIED; mitigation_deadline_at = notified_at + 48h; Provider.open_notice_count recomputed"]

  - method: POST
    path: "/rmd/illegal-traffic-notices/{noticeId}/investigate"
    description: "Provider attributes the notified traffic to one of its customers"
    roles: [ComplianceOfficer]
    code: 200
    input: [customer_id]
    output: IllegalTrafficNotice
    side_effects: ["NOTIFIED -> UNDER_INVESTIGATION; refused with ERR_CUSTOMER_PROVIDER_MISMATCH when the customer belongs to another provider"]

  - method: POST
    path: "/rmd/illegal-traffic-notices/{noticeId}/mitigate"
    description: "Provider discharges the blocking obligation by terminating the customer, revoking the numbers, or blocking all of its traffic"
    roles: [ComplianceOfficer]
    code: 200
    input: [mitigation_action]
    output: IllegalTrafficNotice
    side_effects:
      - "UNDER_INVESTIGATION -> MITIGATED (CUSTOMER_TERMINATED or NUMBERS_REVOKED) or -> ALL_TRAFFIC_BLOCKED (TRAFFIC_BLOCKED)"
      - "Each action cascades to the attributed customer's NumberAssignments and then to Provider.active_assigned_number_count and Provider.open_notice_count"

  - method: GET
    path: "/rmd/illegal-traffic-notices/{noticeId}"
    description: "Reads one illegal-traffic notice"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin]
    code: 200
    input: []
    output: IllegalTrafficNotice
    side_effects: []

  - method: GET
    path: "/rmd/illegal-traffic-notices"
    description: "Lists illegal-traffic notices by provider, attributed customer or state"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin]
    code: 200
    input: ["provider_id?", "customer_id?", "state?", "limit?", "offset?"]
    output: IllegalTrafficNotice[]
    side_effects: []

  - method: POST
    path: "/rmd/blocking-events"
    description: "Fraud analyst records an analytics-driven block against a customer's calling number"
    roles: [FraudAnalyst]
    code: 201
    input: [provider_id, customer_id, calling_number, analytics_score, reason]
    output: BlockingEvent
    side_effects:
      - "Refused with ERR_SCORE_BELOW_BLOCKING_THRESHOLD when reason == ANALYTICS_SCORE and analytics_score < 0.6500"
      - "status = BLOCKED; blocked_at = current logical clock; blocked_by_user_id = X-User-ID"
      - "An analytics_score at or above 0.9500 suspends the customer's origination (suspension_cause BLOCKING_ANALYTICS, suspension_source_id = this event) and cascades to its ACTIVE NumberAssignments"
      - "Provider.blocking_false_positive_rate is recomputed (the denominator grows)"

  - method: GET
    path: "/rmd/blocking-events/{eventId}"
    description: "Reads one blocking event"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin, Caller]
    code: 200
    input: []
    output: BlockingEvent
    side_effects: []

  - method: GET
    path: "/rmd/blocking-events"
    description: "Lists blocking events by provider, customer or status"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin, Caller]
    code: 200
    input: ["provider_id?", "customer_id?", "status?", "limit?", "offset?"]
    output: BlockingEvent[]
    side_effects: []

  - method: POST
    path: "/rmd/blocking-disputes"
    description: "A legitimate caller disputes a block as erroneous; customer_id is taken from the Caller's X-User-ID"
    roles: [Caller]
    code: 201
    input: [blocking_event_id, claim_note]
    output: BlockingDispute
    side_effects:
      - "Refused with ERR_DUPLICATE_DISPUTE when the event already carries a dispute that is not WITHDRAWN"
      - "state = FILED; filed_at = current logical clock; resolution_deadline_at = filed_at + 24h"

  - method: POST
    path: "/rmd/blocking-disputes/{disputeId}/review"
    description: "Fraud analyst takes the dispute under review"
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: BlockingDispute
    side_effects: ["FILED -> UNDER_REVIEW"]

  - method: POST
    path: "/rmd/blocking-disputes/{disputeId}/resolve"
    description: "A fraud analyst other than the blocker upholds or reverses the block"
    roles: [FraudAnalyst]
    code: 200
    input: [outcome, resolution_note]
    output: BlockingDispute
    side_effects:
      - "Refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID == BlockingEvent.blocked_by_user_id"
      - "UNDER_REVIEW -> UPHELD leaves the block standing; UNDER_REVIEW -> REVERSED moves the BlockingEvent to REVERSED"
      - "A REVERSED outcome restores the customer's origination when it was suspended by this very event, reactivates its SUSPENDED_BY_CUSTOMER assignments, and recomputes Provider.active_assigned_number_count and Provider.blocking_false_positive_rate"
      - "resolved_late = (resolved_at > resolution_deadline_at)"

  - method: POST
    path: "/rmd/blocking-disputes/{disputeId}/withdraw"
    description: "The disputing caller withdraws its own dispute, freeing the event for a later dispute"
    roles: [Caller]
    code: 200
    input: []
    output: BlockingDispute
    side_effects: ["FILED -> WITHDRAWN; the BlockingEvent stays BLOCKED"]

  - method: GET
    path: "/rmd/blocking-disputes/{disputeId}"
    description: "Reads one blocking dispute"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin, Caller]
    code: 200
    input: []
    output: BlockingDispute
    side_effects: []

  - method: GET
    path: "/rmd/blocking-disputes"
    description: "Lists blocking disputes by disputed event, by disputing customer or by state"
    roles: [Regulator, ComplianceOfficer, FraudAnalyst, ProviderAdmin, Caller]
    code: 200
    input: ["blocking_event_id?", "customer_id?", "state?", "limit?", "offset?"]
    output: BlockingDispute[]
    side_effects: []

  - method: POST
    path: "/rmd/enforcement-actions"
    description: "Regulator assesses a forfeiture; the basis chosen decides which counter is charged, and the provider's certified effectiveness score decides the mitigation credit"
    roles: [Regulator]
    code: 201
    input: [provider_id, basis, violation_count, violation_days, assessment_basis]
    output: EnforcementAction
    side_effects:
      - "base_assessment_cents, base_capped_cents, assessment_tier, score_band, mitigation_credit_cents and total_forfeiture_cents are computed by calculations.forfeiture_assessment"
      - "status = PROPOSED; Provider.outstanding_forfeiture_cents recomputed"

  - method: POST
    path: "/rmd/enforcement-actions/{actionId}/contest"
    description: "Provider's compliance officer contests a proposed forfeiture"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["PROPOSED -> CONTESTED; contested_at set; Provider.outstanding_forfeiture_cents unchanged because CONTESTED stays in the outstanding set"]

  - method: POST
    path: "/rmd/enforcement-actions/{actionId}/adjudicate"
    description: "Regulator sustains or dismisses a contested forfeiture"
    roles: [Regulator]
    code: 200
    input: [outcome]
    output: EnforcementAction
    side_effects: ["CONTESTED -> SUSTAINED leaves the amount outstanding; CONTESTED -> DISMISSED removes it, restoring Provider.outstanding_forfeiture_cents to its pre-assessment value"]

  - method: POST
    path: "/rmd/enforcement-actions/{actionId}/pay"
    description: "Provider pays a proposed or sustained forfeiture in full"
    roles: [ProviderAdmin]
    code: 200
    input: [amount_cents]
    output: EnforcementAction
    side_effects: ["Refused with ERR_PAYMENT_AMOUNT_MISMATCH unless amount_cents == total_forfeiture_cents", "PROPOSED|SUSTAINED -> PAID; paid_at and paid_amount_cents set; Provider.outstanding_forfeiture_cents recomputed"]

  - method: GET
    path: "/rmd/enforcement-actions/{actionId}"
    description: "Reads one enforcement action with its full assessment breakdown"
    roles: [Regulator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []

  - method: GET
    path: "/rmd/enforcement-actions"
    description: "Lists enforcement actions by provider or status"
    roles: [Regulator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: ["provider_id?", "status?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []

  - method: POST
    path: "/rmd/effectiveness-reports"
    description: "Generates a mandatory mitigation-effectiveness report for an elapsed period under the chosen variant, against a provider version the client has just observed"
    roles: [ComplianceOfficer]
    code: 201
    input: [provider_id, period_start, period_end, variant, expected_provider_version]
    output: EffectivenessReport
    side_effects:
      - "Rejected with ERR_STALE_PROVIDER_VERSION (412) when expected_provider_version != Provider.version (§1.2.1 report-generate-stale-provider)"
      - "Rejected with ERR_REPORT_PERIOD_NOT_ELAPSED when period_end is after the current logical clock"
      - "All counts, the three components, effectiveness_score and data_sufficiency are computed by calculations.mitigation_effectiveness_score"
      - "state = GENERATED; any GENERATED or SIGNED_OFF report of the same provider whose period overlaps moves to SUPERSEDED"

  - method: POST
    path: "/rmd/effectiveness-reports/{reportId}/certify"
    description: "A compliance officer other than the plan filer signs off the report, forcing the CERTIFIED variant"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EffectivenessReport
    side_effects:
      - "Refused with ERR_SEGREGATION_OF_DUTIES when X-User-ID == the operative MitigationPlan's filed_by_user_id"
      - "GENERATED -> SIGNED_OFF; variant = CERTIFIED and every component and the score are recomputed in place, so pending tracebacks and open notices drop out of the numerators"
      - "This report becomes the score_band source for calculations.forfeiture_assessment"

  - method: POST
    path: "/rmd/effectiveness-reports/{reportId}/file"
    description: "Files the signed-off report with the regulator"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EffectivenessReport
    side_effects: ["SIGNED_OFF -> FILED; filed_at set"]

  - method: GET
    path: "/rmd/effectiveness-reports/{reportId}"
    description: "Reads one effectiveness report with all component scores"
    roles: [Regulator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: []
    output: EffectivenessReport
    side_effects: []

  - method: GET
    path: "/rmd/effectiveness-reports"
    description: "Lists effectiveness reports by provider, state or variant"
    roles: [Regulator, ComplianceOfficer, ProviderAdmin]
    code: 200
    input: ["provider_id?", "state?", "variant?", "limit?", "offset?"]
    output: EffectivenessReport[]
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID missing, empty, or X-User-Role not one of the seven declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "The acting role is not listed on the target endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, wrong type, undeclared enum member, negative count, out-of-range score, or pagination outside limit 1..100 / offset >= 0" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "A ProviderAdmin acts on a row whose provider_id != X-User-ID, or a Caller acts on a row whose customer_id != X-User-ID" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "The acting X-User-ID already performed the paired step: KYC submitter deciding the same customer, blocker resolving the dispute against its own block, or plan filer signing off the effectiveness report" }

  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "providerId in path or provider_id in body matches no Provider" }
  - { id: ERR_CERTIFICATE_NOT_FOUND, http: 404, condition: "certificateId in path or certificate_id filter matches no Certificate" }
  - { id: ERR_PLAN_NOT_FOUND, http: 404, condition: "planId in path matches no MitigationPlan" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "customerId in path or customer_id / identified_customer_id in body matches no Customer" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId in path matches no NumberAssignment" }
  - { id: ERR_ATTESTATION_NOT_FOUND, http: 404, condition: "attestationId in path or produced_attestation_id in body matches no CallAttestation" }
  - { id: ERR_OBSERVATION_NOT_FOUND, http: 404, condition: "observationId in path matches no TrafficObservation" }
  - { id: ERR_TRACEBACK_NOT_FOUND, http: 404, condition: "tracebackId in path matches no TracebackRequest" }
  - { id: ERR_NOTICE_NOT_FOUND, http: 404, condition: "noticeId in path matches no IllegalTrafficNotice" }
  - { id: ERR_BLOCKING_EVENT_NOT_FOUND, http: 404, condition: "eventId in path or blocking_event_id in body matches no BlockingEvent" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "disputeId in path matches no BlockingDispute" }
  - { id: ERR_ENFORCEMENT_NOT_FOUND, http: 404, condition: "actionId in path matches no EnforcementAction" }
  - { id: ERR_REPORT_NOT_FOUND, http: 404, condition: "reportId in path matches no EffectivenessReport" }

  - { id: ERR_INVALID_NUMBER_FORMAT, http: 422, condition: "A telephone number is not E.164: missing leading '+' or not 11 to 15 digits" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "A supplied interval is not well-ordered (not_before >= not_after, window_start >= window_end, period_start >= period_end, effective_from >= effective_to)" }
  - { id: ERR_STALE_PROVIDER_VERSION, http: 412, condition: "expected_provider_version does not equal the Provider's current version on a plan filing or a report generation" }

  - { id: ERR_CERTIFICATE_STATE_INVALID, http: 409, condition: "The certificate is not in a status the requested transition allows (issue/activate/renew/revoke)" }
  - { id: ERR_NO_ACTIVE_CERTIFICATE, http: 409, condition: "Signing was attempted while the provider has no Certificate in status ACTIVE" }
  - { id: ERR_SIGNING_SUSPENDED, http: 409, condition: "Signing was attempted while the provider's auth_posture == SIGNING_SUSPENDED" }
  - { id: ERR_PLAN_STATE_INVALID, http: 409, condition: "The mitigation plan is not in a filing_state the requested transition allows" }
  - { id: ERR_CUSTOMER_KYC_STATE_INVALID, http: 409, condition: "The customer's kyc_state does not allow the requested KYC transition" }
  - { id: ERR_ORIGINATION_STATE_INVALID, http: 409, condition: "The customer's origination_state does not allow the requested origination action" }
  - { id: ERR_ASSIGNMENT_NOT_ACTIVE, http: 409, condition: "The number assignment is already REVOKED" }
  - { id: ERR_TRACEBACK_ALREADY_CLOSED, http: 409, condition: "The traceback request is already RESPONDED or RESPONDED_LATE" }
  - { id: ERR_NOTICE_ALREADY_CLOSED, http: 409, condition: "The illegal-traffic notice is not in the state the requested transition needs (already mitigated, blocked or expired)" }
  - { id: ERR_DISPUTE_STATE_INVALID, http: 409, condition: "The blocking dispute is not in the state the requested transition needs" }
  - { id: ERR_ENFORCEMENT_STATE_INVALID, http: 409, condition: "The enforcement action is not in the status the requested transition needs" }
  - { id: ERR_REPORT_STATE_INVALID, http: 409, condition: "The effectiveness report is not in the state the requested transition needs (certify requires GENERATED, file requires SIGNED_OFF, a SUPERSEDED report accepts neither)" }

  - { id: ERR_PRACTICES_INSUFFICIENT, http: 422, condition: "A submitted mitigation plan describes fewer than three prevention practices or omits KYC_ONBOARDING or TRACEBACK_COOPERATION" }
  - { id: ERR_CUSTOMER_NOT_KYC_VERIFIED, http: 422, condition: "An operation requiring a KYC-verified customer was attempted while kyc_state != VERIFIED" }
  - { id: ERR_ORIGINATION_NOT_ENABLED, http: 422, condition: "An operation requiring origination capability was attempted while origination_state != ENABLED" }
  - { id: ERR_SUSPENSION_CAUSE_NOT_SELF_CLEARABLE, http: 403, condition: "A ProviderAdmin attempted to restore a suspension whose suspension_cause is not PROVIDER_REQUEST" }
  - { id: ERR_SCORE_BELOW_BLOCKING_THRESHOLD, http: 422, condition: "An analytics-driven block carries analytics_score < 0.6500" }
  - { id: ERR_RESPONSE_WINDOW_CLOSED, http: 409, condition: "A traceback response arrived after hard_cutoff_at" }
  - { id: ERR_WINDOW_IN_FUTURE, http: 422, condition: "A traffic observation's window_end is after the current logical clock" }
  - { id: ERR_REPORT_PERIOD_NOT_ELAPSED, http: 422, condition: "An effectiveness report's period_end is after the current logical clock" }
  - { id: ERR_NUMBER_INTERVAL_OVERLAP, http: 409, condition: "A new number assignment's half-open interval overlaps a non-REVOKED assignment of the same telephone_number under the same provider" }
  - { id: ERR_OBSERVATION_WINDOW_OVERLAP, http: 409, condition: "A new traffic observation's closed window overlaps or touches an existing window of the same customer" }
  - { id: ERR_DUPLICATE_DISPUTE, http: 409, condition: "The blocking event already carries a dispute in FILED, UNDER_REVIEW, UPHELD or REVERSED" }
  - { id: ERR_CUSTOMER_PROVIDER_MISMATCH, http: 422, condition: "The referenced customer belongs to a different provider than the request or the parent artifact" }
  - { id: ERR_CALL_DETAIL_MISMATCH, http: 422, condition: "The produced attestation does not describe the traced call (provider, customer, calling_number, called_number or origination_time differ)" }
  - { id: ERR_CALL_DETAIL_INCOMPLETE, http: 422, condition: "A traceback response omits the identified customer or the produced attestation, or the identified customer holds no number assignment covering the traced calling_number at origination_time" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "The paid amount_cents differs from the action's total_forfeiture_cents" }

# =============================================================================
# §1.7 RBAC Matrix (segregation_of_duties)
# =============================================================================
roles:
  - name: Regulator
    description: "The regulator: registers providers, decides mitigation-plan filings, sends traceback requests and illegal-traffic notices, assesses and adjudicates forfeitures, and runs the deadline sweep"
    identity: "opaque"
    exclusive_operations:
      - "POST /rmd/providers"
      - "POST /rmd/mitigation-plans/{planId}/decision"
      - "POST /rmd/traceback-requests"
      - "POST /rmd/illegal-traffic-notices"
      - "POST /rmd/enforcement-actions"
      - "POST /rmd/enforcement-actions/{actionId}/adjudicate"
      - "POST /rmd/compliance-sweeps"
    shared_operations:
      - "POST /rmd/customers/{customerId}/origination-actions (shared with ProviderAdmin; only a Regulator may RESTORE a suspension whose cause is not PROVIDER_REQUEST)"
      - "POST /_clock/set_current_utc"
      - "every GET in §1.5"

  - name: PolicyAdministrator
    description: "The certificate policy administrator: records certificate requests, issues, renews and revokes SHAKEN certificates"
    identity: "opaque"
    exclusive_operations:
      - "POST /rmd/certificates"
      - "POST /rmd/certificates/{certificateId}/issue"
      - "POST /rmd/certificates/{certificateId}/renew"
      - "POST /rmd/certificates/{certificateId}/revoke"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /rmd/providers, GET /rmd/providers/{providerId}, GET /rmd/certificates, GET /rmd/certificates/{certificateId}"

  - name: ComplianceOfficer
    description: "The provider's compliance function: drafts, submits and withdraws mitigation plans, answers tracebacks, investigates and mitigates illegal-traffic notices, contests forfeitures, generates, certifies and files effectiveness reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /rmd/mitigation-plans"
      - "POST /rmd/mitigation-plans/{planId}/submit"
      - "POST /rmd/mitigation-plans/{planId}/withdraw"
      - "POST /rmd/traceback-requests/{tracebackId}/respond"
      - "POST /rmd/illegal-traffic-notices/{noticeId}/investigate"
      - "POST /rmd/illegal-traffic-notices/{noticeId}/mitigate"
      - "POST /rmd/enforcement-actions/{actionId}/contest"
      - "POST /rmd/effectiveness-reports"
      - "POST /rmd/effectiveness-reports/{reportId}/certify"
      - "POST /rmd/effectiveness-reports/{reportId}/file"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "every GET in §1.5 except GET /rmd/traffic-observations filters reserved to fraud review"

  - name: KycAnalyst
    description: "Know-your-customer reviewer: submits customer KYC packages and decides them — never both for the same customer"
    identity: "opaque"
    exclusive_operations:
      - "POST /rmd/customers/{customerId}/kyc-submit"
      - "POST /rmd/customers/{customerId}/kyc-decision"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /rmd/customers, GET /rmd/customers/{customerId}, GET /rmd/providers, GET /rmd/providers/{providerId}"

  - name: FraudAnalyst
    description: "Blocking analytics reviewer: records analytics-driven blocks and reviews and resolves the disputes against them — never resolving a dispute over its own block"
    identity: "opaque"
    exclusive_operations:
      - "POST /rmd/blocking-events"
      - "POST /rmd/blocking-disputes/{disputeId}/review"
      - "POST /rmd/blocking-disputes/{disputeId}/resolve"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /rmd/blocking-events, GET /rmd/blocking-disputes, GET /rmd/customers, GET /rmd/traffic-observations, GET /rmd/number-assignments, GET /rmd/illegal-traffic-notices and their single-resource forms"

  - name: ProviderAdmin
    description: "The provider's operations admin, acting as its own Provider row: activates certificates, onboards customers, drives origination state, assigns numbers, records monitoring windows, signs calls and pays forfeitures"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /rmd/certificates/{certificateId}/activate"
      - "POST /rmd/customers"
      - "POST /rmd/number-assignments"
      - "POST /rmd/number-assignments/{assignmentId}/revoke"
      - "POST /rmd/call-attestations"
      - "POST /rmd/traffic-observations"
      - "POST /rmd/enforcement-actions/{actionId}/pay"
    shared_operations:
      - "POST /rmd/customers/{customerId}/origination-actions (shared with Regulator, limited to PROVIDER_REQUEST restores)"
      - "POST /_clock/set_current_utc"
      - "every GET in §1.5 restricted to rows whose provider_id == X-User-ID"

  - name: Caller
    description: "A legitimate calling customer, acting as its own Customer row: disputes erroneous blocks and withdraws its own disputes"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /rmd/blocking-disputes"
      - "POST /rmd/blocking-disputes/{disputeId}/withdraw"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /rmd/blocking-events, GET /rmd/blocking-disputes, GET /rmd/number-assignments, GET /rmd/customers/{customerId} — all restricted to rows whose customer_id == X-User-ID"
