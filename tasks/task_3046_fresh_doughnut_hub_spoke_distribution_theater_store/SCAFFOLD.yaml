# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed value, or enum out of range" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource state does not permit the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match current parent version (OCC)" }
  - { id: ERR_FRESHNESS_VIOLATION, http: 422, condition: "Stale pull after same-day deadline; hot-light without a fresh batch; fundraiser lead-time/grace breach" }
  - { id: ERR_WINDOW_OVERLAP, http: 422, condition: "Route stop windows for same door overlap; hot-light windows overlap; variety window inverted" }
  - { id: ERR_TERRITORY_VIOLATION, http: 422, condition: "Door territory does not match hub territory for FRANCHISE doors; THEATER door has non-null hub; hot-light on non-THEATER door" }
  - { id: ERR_LICENSE_QUOTA_EXCEEDED, http: 422, condition: "LICENSED varieties exceed 25% of mix plan at publish" }
  - { id: ERR_CAPACITY_EXCEEDED, http: 422, condition: "Hub daily capacity exceeded at commit; vehicle capacity exceeded at dispatch; pool would go negative" }
  - { id: ERR_CROSS_SCOPE_REFERENCE, http: 422, condition: "Referenced entity missing or belongs to a different network/hub scope" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Entity already in a terminal state; no further transitions" }
  - { id: ERR_LINE_BUSY, http: 409, condition: "Another batch is RUNNING on the equipment line" }
  - { id: ERR_PICKUP_CODE_MISMATCH, http: 422, condition: "pickup_code does not match at fulfill" }
  - { id: ERR_ROUTE_NOT_LOCKABLE, http: 422, condition: "Route has no stops or total window span < 30 minutes at lock" }
  - { id: ERR_STOP_WINDOW_PASSED, http: 422, condition: "Arrive attempted after window_end (and not late-arrival-eligible)" }
  - { id: ERR_DEMAND_CAP_EXCEEDED, http: 422, condition: "Requested hot-light extension exceeds demand-response cap for current fresh dozens" }
  - { id: ERR_VARIETY_EXPIRED, http: 422, condition: "MixPlanLine references a variety whose window has expired for the plan's effective_date" }
  - { id: ERR_DUPLICATE_SEQUENCE, http: 422, condition: "RouteStop sequence_no duplicated within a route" }
  - { id: ERR_MIX_PLAN_LOCKED, http: 409, condition: "Line upsert attempted on a LOCKED or SUPERSEDED mix plan" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkAdmin
    description: "Network-level administrator; owns networks, hubs, doors, varieties; resolves disputes; runs ops checkpoints; sets clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /networks"
      - "POST /networks/{id}/ops-runs"
      - "POST /networks/_clock/set_current_utc"
      - "POST /networks/{nid}/hubs"
      - "POST /networks/{nid}/doors"
      - "POST /networks/{nid}/varieties"
      - "door suspend/reinstate/close"
      - "stale-credit resolve"
    shared_operations:
      - "GET on all resources"
  - name: HubManager
    description: "Runs one hub: equipment lines and production batches"
    identity: "opaque"
    exclusive_operations:
      - "equipment line create/degrade/maintenance/decommission"
      - "batch schedule/commit/start/complete/cancel"
    shared_operations:
      - "GET networks/hubs/varieties/shipments"
  - name: RoutePlanner
    description: "Plans and reconciles routes; stages shipments"
    identity: "opaque"
    exclusive_operations:
      - "route create/lock/dispatch/reconcile"
      - "route stop add"
      - "shipment stage"
    shared_operations:
      - "GET routes/stops/shipments/batches/doors"
  - name: RouteDriver
    description: "Executes route stops"
    identity: "opaque"
    exclusive_operations:
      - "stop arrive/deliver/miss"
      - "shipment record-delivery"
    shared_operations:
      - "GET routes/stops/shipments"
  - name: DoorManager
    description: "Runs one door: mix plans, fundraiser orders, stale pulls, hot-light windows"
    identity: "entity_backed:Door"
    exclusive_operations:
      - "mix-plan create/lines/publish/lock"
      - "fundraiser-order lifecycle"
      - "stale-credit create/dispute"
      - "hot-light-window schedule/ignite/extend/cancel"
    shared_operations:
      - "GET own door, varieties, shipments, routes"
