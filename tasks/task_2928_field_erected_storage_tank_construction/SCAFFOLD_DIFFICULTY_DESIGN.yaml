            - call: "GET /tanks/${tank_id}"
              as: ProjectEngineer
              captures: { tank_v: $.data.version }
            - call: "POST /hydrotest-plans"
              payload: { tank_id: "${tank_id}", water_source_id: "${ws_id}", fill_volume_gal: 200000, disposal_method: "DISCHARGE_TO_POTW", hold_hours: 24, expected_tank_version: "${tank_v}" }
              as: ProjectEngineer
              captures: { plan_id: $.data.id }
            - call: "POST /hydrotest-plans/${plan_id}/approval"
              payload: { decision: "APPROVE" }
              as: ProjectEngineer
              as_user_id: "pe-1"
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v1: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T00:00:00Z", window_end_utc: "2026-08-11T06:00:00Z", rate_gpm: 300, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v1}" }
              as: ErectionSuperintendent
              captures: { wd1_id: $.data.id }
            - call: "GET /water-sources/${ws_id}"
              as: ErectionSuperintendent
              captures: { ws_v2: $.data.version }
            - call: "POST /water-withdrawals"
              payload: { hydrotest_plan_id: "${plan_id}", water_source_id: "${ws_id}", window_start_utc: "2026-08-11T06:00:00Z", window_end_utc: "2026-08-11T12:00:00Z", rate_gpm: 300, reserved_volume_gal: 100000, expected_water_source_version: "${ws_v2}" }
              as: ErectionSuperintendent
              captures: { wd2_id: $.data.id }
            - call: "POST /nde-reports"
              payload: { weld_seam_id: "${seam_id}", method: "RT", window_start_utc: "2026-08-13T10:00:00Z", window_end_utc: "2026-08-13T11:00:00Z", coverage_pct: 100, technician_stamp: "RT-3" }
              as: QcInspector
              as_user_id: "qc-1"
              captures: { r2_id: $.data.id }
          trigger:
            - call: "POST /nde-reports/${r2_id}/result"
              payload: { decision: "REJECT", indication_count: 2, film_count: 4, defect_type: "LACK_OF_FUSION" }
              as: QcInspector
              as_user_id: "qc-1"
          assert:
            - "hop 1: NdeReport.${r2_id}.status == REPORTED_REJECT and nonconformance_open == true"
            - "hop 2: WeldSeam.${seam_id}.status == RT_REJECTED and repair_cycle_count == 0"
            - "hop 2b: ShellCourse.${course_id}.status == FITTED"
            - "hop 3: Tank.${tank_id}.open_nonconformance_count == 1 and Tank.${tank_id}.quality_posture == RESTRICTED"
            - "hop 4: HydrotestPlan.${plan_id}.status == SUSPENDED and state_before_suspension == APPROVED and suspension_reason is not null"
            - "hop 4b: HydrotestPlan.${plan_id}.fill_percent_current == 0.0 and hold_started_at_utc == null (preserved, not reset)"
            - "hop 5: WaterWithdrawal.${wd1_id}.status == CANCELLED and cancellation_reason == PLAN_SUSPENDED"
            - "hop 5: WaterWithdrawal.${wd2_id}.status == CANCELLED and cancellation_reason == PLAN_SUSPENDED"
            - "hop 6: WaterSource.${ws_id}.reserved_volume_gal == 0.0, consumed_volume_gal == 0.0, available_volume_gal == 2000000.00"
            - "hop 6b: HydrotestPlan.${plan_id}.water_cost_usd == 0.0, disposal_cost_usd == 0.0, subtotal_usd == 0.0, permit_surcharge_pct == 0.00, total_cost_usd == 0.0"
            - "Tank.${tank_id}.construction_phase == ERECTION_IN_PROGRESS (already reverted when the re-examination was scheduled) and weld_reject_rate == 0.5000 with required_examination_pct == 100.0"

