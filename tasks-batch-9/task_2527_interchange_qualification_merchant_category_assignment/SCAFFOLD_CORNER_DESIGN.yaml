            - call: "POST /merchants/${mer_b}/verify-category"
              payload: { documentation_ref: "DOC-B" }
              as: CategoryAnalyst
            - call: "POST /incentive-programs"
              payload: { program_name: "Grocery Volume 2026", eligible_mcc_codes: ["5411"], total_capacity_cents: 20000000, min_commitment_cents: 6000000, reopen_threshold_cents: 6000000, performance_threshold_pct: 80.00 }
              as: NetworkAdmin
              captures: { ip_id: $.data.id, ip_v0: $.data.version }
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_a}", committed_volume_cents: 6000000, expected_incentive_program_version: "${ip_v0}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { enr_a: $.data.id }
            - call: "GET /incentive-programs/${ip_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ip_v1: $.data.version, mid_uncommitted: $.data.uncommitted_capacity_cents, mid_state: $.data.enrollment_state }
            - call: "POST /incentive-enrollments"
              payload: { incentive_program_id: "${ip_id}", merchant_id: "${mer_b}", committed_volume_cents: 9000000, expected_incentive_program_version: "${ip_v1}" }
              as: AcquirerOps
              as_user_id: "${acq_id}"
              captures: { enr_b: $.data.id }
          trigger:
