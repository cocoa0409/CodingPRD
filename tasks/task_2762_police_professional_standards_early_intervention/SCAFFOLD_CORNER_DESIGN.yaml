      - name: screening_rejection_walks_the_declared_transition_and_starts_the_retention_clock
        claim_type: Valid Transition
        grounds:
          - state_machines.Complaint.transitions.SCREENING_to_REJECTED_INTAKE
          - calculations.retention_expiry_evaluation
          - endpoints["POST /complaints/{id}/classify"]
        distinguishing_aspect: |
          The SCREENING to REJECTED_INTAKE transition is the only path that closes a complaint
          without an investigation ever existing. It must set closed_at from the logical clock
          and derive retention_until from the WITHDRAWN retention row (730 days), not from any
          investigation outcome, and screening_required must remain true because the screen was
          run and answered rather than cancelled.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "One INTERNAL_AFFAIRS unit, one PATROL_DIVISION unit and Commander Reyes exist."
            - "One ANONYMOUS DISCOURTESY complaint is in SCREENING with screening_required true and allegation_count 0."
