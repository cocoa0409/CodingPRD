              captures: { ebv2: $.data.version }
            - call: "POST /enrolled-bills/${eb1_id}/technical-corrections"
              payload: { expected_enrolled_bill_version: "${ebv2}", correction_type: "TYPOGRAPHICAL", description: "Second correction, refiled after re-reading.", is_substantive: false }
              as: Drafter
              as_user_id: "${d1_id}"
              captures: { tc2_id: $.data.id }
            - call: "GET /enrolled-bills/${eb1_id}"
              payload: {}
              as: Drafter
              as_user_id: "${d1_id}"
              captures: { ebv3: $.data.version }
            - call: "POST /technical-corrections/${tc1_id}/apply"
              payload: {}
              as: ReviewCounsel
              as_user_id: "${rc2_id}"
            - call: "POST /enrolled-bills/${eb1_id}/technical-corrections"
              payload: { expected_enrolled_bill_version: "${ebv3}", correction_type: "CITATION_FIX", description: "Third correction, against the pre-apply version.", is_substantive: false }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "GET /enrolled-bills/${eb1_id}"
              payload: {}
              as: Drafter
              as_user_id: "${d1_id}"
              captures: { ebv4: $.data.version }
            - call: "POST /enrolled-bills/${eb1_id}/technical-corrections"
              payload: { expected_enrolled_bill_version: "${ebv4}", correction_type: "CITATION_FIX", description: "Third correction, refiled after the apply.", is_substantive: false }
              as: Drafter
              as_user_id: "${d1_id}"
            - call: "GET /technical-corrections"
              payload: { enrolled_bill_id: "${eb1_id}", limit: 20, offset: 0 }
              as: Clerk
          assert:
            - "First proposal with ${ebv1} -> 201; the replay of ${ebv1} -> 412 ERR_STALE_ENROLLMENT_VERSION"
            - "The stale AND substantive payload -> 412 ERR_STALE_ENROLLMENT_VERSION, not 422 ERR_SUBSTANTIVE_CORRECTION_FORBIDDEN: priority 80 runs before priority 130"
            - "ebv2 == ebv1 + 1 (proposal bumps the enrollment) and the refile with ${ebv2} -> 201"
            - "ebv3 == ebv2 + 1; applying tc1 makes ebv4 == ebv3 + 1, so the pre-apply replay of ${ebv3} -> 412 as well"
            - "The refile with ${ebv4} -> 201 — three corrections exist and every refusal is attributable to the token alone"
            - "EnrolledBill.${eb1_id} ends with corrections_applied_count 1 and open_corrections_count 2, and GET /technical-corrections for the enrollment has total_count 3"

      - name: derived_counters_reconcile_after_create_after_transition_and_after_a_cascading_kill
        claim_type: Cross-Cutting — derived_field_reconciliation
        grounds:
          - entities.Committee.fields.active_referral_count
          - entities.Bill.fields.referral_count
          - entities.Session.fields.bills_introduced_count
          - entities.Session.fields.bills_enrolled_count
          - entities.EnrolledBill.fields.open_corrections_count
          - state_machines.Session.status
        distinguishing_aspect: "Five derived counters on four different entities are read after each of the three events that can move them: a create, a forward transition, and the adjournment fan-out that kills rows the counters were counting. Two of them are deliberately monotone (bills_introduced_count counts any status; bills_enrolled_count survives adjournment) while two are decremented by the same fan-out, so a single blanket recount would get half of them wrong."
        test_recipe:
          setup:
            - "One committee cH with max_concurrent_referrals 2 and two HOUSE bills b1 and b2, both with appropriation_requested_cents 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
