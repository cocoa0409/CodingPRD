              as: QualityManager
              captures: { pt1: $.data.id }
            - call: "POST /lab/proficiency-tests/${pt1}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/proficiency-tests/${pt1}/score"
              payload: { score_pct: 50.00 }
              as: QualityManager
            - call: "POST /lab/proficiency-tests"
              payload: { analyst_id: "${a1}", method_id: "${m1}", test_cycle: "2026-C2", due_utc: "2026-08-16T00:00:00Z" }
              as: QualityManager
              captures: { pt2: $.data.id }
            - call: "POST /lab/proficiency-tests/${pt2}/submit"
              payload: {}
              as: Analyst
              as_user_id: "${a1}"
            - call: "POST /lab/proficiency-tests/${pt2}/score"
              payload: { score_pct: 55.00 }
              as: QualityManager
            - call: "POST /lab/proficiency-tests"
