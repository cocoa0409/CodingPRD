        excluded_because:
          difficulty_instance: dual_variant_calc / seat_accounting_jump_seat_vs_party_guest_seats_on_slot
          rationale: "seats_taken derived-field reconciliation is asserted in the §1.8 seat-accounting dual-variant instance."

