            - "after M1: mandatory_clause_count == 1 and restrictive_clause_ratio_pct == 0.00 (0 of 1 mandatory restrictive)"
            - "after M2: mandatory_clause_count == 2 and restrictive_clause_ratio_pct == 50.00 (1 of 2)"
            - "after M3: clause_count == 5, mandatory_clause_count == 3 and restrictive_clause_ratio_pct == 33.33 (round_half_up of 100 * 1 / 3), NOT 20.00 from a 5-clause denominator"
            - "compliance_score_strict == 0.00 and compliance_score_provisional == 0.00 throughout, since no clause has an entry"

      - name: committed_cents_reverses_on_unit_cancellation
        claim_type: Input Set Filtering
        grounds:
          - calculations.program_committed_cents
          - state_machines.UnitOrder.SPEC_LOCKED_to_CANCELLED
          - entities.ApparatusProgram.fields.committed_cents
        distinguishing_aspect: |
          committed_cents is a live aggregation, not a write-once counter: two awards
          take it to 136552000, cancelling one takes it back to exactly 68276000
          because CANCELLED units leave the input set, and the cancelled unit's own
          price_cents stays 68276000 on the row.
        test_recipe:
          setup:
            - "ApparatusProgram ACTIVE with contract_ceiling_cents 400000000 (soft ceiling 360000000) and one RELEASED specification"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Ledger program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /specifications"
              payload: { program_id: "${prog_id}", title: "Pumper spec rev A" }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { spec_id: $.data.id }
            - call: "POST /specifications/${spec_id}/clauses"
              payload: { clause_code: "C1", category: "PUMP", requirement_text: "1500 gpm single stage pump", mandatory: true, is_restrictive: false }
              as: PurchasingOfficer
              as_user_id: "po-author"
              captures: { c1_id: $.data.id }
            - call: "POST /compliance-entries"
              payload: { specification_id: "${spec_id}", clause_id: "${c1_id}", response: "COMPLY" }
              as: BodyEngineer
              as_user_id: "eng-1"
            - call: "POST /specifications/${spec_id}/submit-review"
              as: PurchasingOfficer
              as_user_id: "po-author"
            - call: "POST /specifications/${spec_id}/release"
              as: PurchasingOfficer
              as_user_id: "po-releaser"
          trigger:
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
              as_user_id: "po-releaser"
              captures: { unit_a_id: $.data.id }
            - call: "POST /unit-orders"
              payload: { program_id: "${prog_id}", specification_id: "${spec_id}", unit_type: "PUMPER", award_year: 2026, gvwr_kg: 17000, front_axle_rating_kg: 6800, rear_axle_rating_kg: 10110, base_curb_front_kg: 5200, base_curb_rear_kg: 7000, crew_seat_count: 4, weight_calc_engineer_user_id: "eng-1" }
              as: PurchasingOfficer
