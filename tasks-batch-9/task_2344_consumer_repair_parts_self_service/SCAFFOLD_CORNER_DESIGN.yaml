              as_user_id: "u_doc_1"
              captures: { e3: $.data.error_id }
            - call: "POST /repair-program/manual-revisions/${rev_id}/publish"
              payload: {}
              as: SafetyReviewer
              as_user_id: "u_rev_1"
              captures: { rev_state_3: $.data.status }
            - call: "POST /repair-program/part-catalog-items/${part_id}/restrict"
              payload: { safety_class: "SAFETY_RESTRICTED_HIGH_VOLTAGE", restriction_reason: "arc flash risk" }
              as: SafetyReviewer
              as_user_id: "u_rev_1"
              captures: { part_state: $.data.status, part_class_after: $.data.safety_class }
          assert:
            - "${rev_state} == IN_REVIEW after the DocumentationEngineer submitted it"
            - "${e1} == ERR_FORBIDDEN_ROLE with HTTP 403 — the admin who created the part cannot restrict it"
            - "${e2} == ERR_FORBIDDEN_ROLE and ${e3} == ERR_FORBIDDEN_ROLE — authoring never confers approval or publication"
            - "${rev_state_2} == APPROVED with ${reviewer} == u_rev_1 and ${rev_state_3} == PUBLISHED"
            - "${part_state} == RESTRICTED and ${part_class_after} == SAFETY_RESTRICTED_HIGH_VOLTAGE once the SafetyReviewer calls it"

      - name: compliance_officer_alone_may_attest_and_the_sweep_and_clock_stay_shared
