  # ===================================================================
  # RULE 7 — cross_entity_state_dependency
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: motion_creation_blocked_until_its_meeting_is_in_session
        grounds:
          - validations[priority=32]
          - errors[ERR_MEETING_NOT_IN_SESSION]
          - state_machines.Meeting.NOTICED_to_IN_SESSION
          - entities.Motion.fields.meeting_id
        distinguishing_aspect: |
          Creating a Motion is legal in itself — every field is valid and the
          clerk holds the right role — but it is refused with
          ERR_MEETING_NOT_IN_SESSION (409) purely because the referenced
          Meeting is NOTICED. The identical request succeeds with 201 after the
          presiding officer convenes, so the gate lives entirely in the other
          entity's status.
        test_recipe:
          setup:
            - "A COUNCIL / REGULAR meeting on 2026-09-15T18:00:00Z whose one-item packet was posted compliantly, leaving it NOTICED at clock 2026-09-15T18:00:00Z."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_main: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_main}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mtg: $.data.id, mtgv: $.data.version }
            - call: "POST /clerk/meetings/${mtg}/agenda-packets"
              payload: { expected_meeting_version: "${mtgv}", late_addendum: false }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { pkt: $.data.id }
            - call: "POST /clerk/agenda-packets/${pkt}/agenda-items"
              payload: { sequence_number: 1, item_type: "REPORT", title: "Procedural matters" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/agenda-packets/${pkt}/post"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T18:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/motions"
              payload: { meeting_id: "${mtg}", motion_type: "PROCEDURAL", majority_rule: "SIMPLE", moved_by_member_id: "cm-01", seconded_by_member_id: "cm-02" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/meetings/${mtg}/convene"
              payload: { present_member_count: 7 }
              as: PresidingOfficer
              as_user_id: "po-01"
            - call: "POST /clerk/motions"
              payload: { meeting_id: "${mtg}", motion_type: "PROCEDURAL", majority_rule: "SIMPLE", moved_by_member_id: "cm-01", seconded_by_member_id: "cm-02" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { mo: $.data.id }
          assert:
            - "the first POST /clerk/motions returns HTTP status 409"
            - "${err} == ERR_MEETING_NOT_IN_SESSION"
            - "GET /clerk/motions?meeting_id=${mtg} returns total_count == 1 after the whole trigger sequence"
            - "the second POST /clerk/motions returns HTTP status 201"
            - "Motion.${mo}.status == SECONDED"
            - "Motion.${mo}.outcome == PENDING"
            - "Motion.${mo}.result_official == false"
            - "Meeting.${mtg}.status == IN_SESSION and Meeting.${mtg}.present_member_count == 7"

      - name: destruction_certification_blocked_by_an_open_records_request_on_the_same_series
        grounds:
          - validations[priority=54]
          - errors[ERR_SERIES_HAS_OPEN_REQUEST]
          - state_machines.DestructionBatch.PROPOSED_to_CERTIFIED
          - state_machines.PublicRecordsRequest.RELEASED_to_CLOSED
          - calculations.record_custody_conservation
        distinguishing_aspect: |
          A fully eligible DestructionBatch (retention elapsed, no legal hold,
          item_count within the active count, certifying officer distinct from
          the proposer) is refused with ERR_SERIES_HAS_OPEN_REQUEST (409) solely
          because a PublicRecordsRequest targeting the same RecordSeries sits
          outside CLOSED/WITHDRAWN. Driving that request through to CLOSED — with
          no change to the batch at all — makes the identical certify succeed.
        test_recipe:
          setup:
            - "RecordSeries CC-01, retention_trigger CREATION, retention_years 5, one accession of 100 items on 2019-06-15 (eligible_through_on 2024-06-15) at clock 2026-08-01."
            - "A public records request in RECEIVED targeting that series."
            - "A DestructionBatch of 40 items proposed by officer ro-01 with cutoff_on 2024-06-15."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/record-series"
              payload: { series_code: "CC-01", name: "Council correspondence", retention_years: 5, retention_trigger: "CREATION", permanent: false, legal_hold_status: "NONE" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { series: $.data.id }
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 100, accessioned_on: "2019-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "Cleo Marsh", requester_email: "cleo@example.org", subject_description: "Correspondence about the depot", target_series_id: "${series}", commercial_purpose: false }
              as: Anonymous
              as_user_id: "public-03"
              captures: { req: $.data.id }
            - call: "POST /clerk/destruction-batches"
              payload: { series_id: "${series}", item_count: 40, cutoff_on: "2024-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { batch: $.data.id }
          trigger:
            - call: "POST /clerk/destruction-batches/${batch}/certify"
              payload: { certified_on: "2026-08-03" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/records-requests/${req}/begin-review"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req}/disposition"
              payload: { disposition: "FULL_RELEASE" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req}/close"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/destruction-batches/${batch}/certify"
              payload: { certified_on: "2026-08-03" }
              as: CityClerk
              as_user_id: "cc-01"
          assert:
            - "the first certify returns HTTP status 409"
            - "${err} == ERR_SERIES_HAS_OPEN_REQUEST"
            - "after the first certify: DestructionBatch.${batch}.status == PROPOSED and RecordSeries.${series}.active_item_count == 100"
            - "PublicRecordsRequest.${req}.fulfillment_status == CLOSED"
            - "PublicRecordsRequest.${req}.closed_on == 2026-08-03"
            - "the second certify returns HTTP status 200"
            - "DestructionBatch.${batch}.status == CERTIFIED"
            - "DestructionBatch.${batch}.proposed_by_officer_id == ro-01"
            - "DestructionBatch.${batch}.certifying_officer_id == cc-01"
            - "DestructionBatch.${batch}.certified_on == 2026-08-03"
            - "RecordSeries.${series}.active_item_count == 60"
            - "RecordSeries.${series}.destroyed_item_count == 40"
            - "RecordSeries.${series}.total_accessioned_count == 100"
            - "RecordSeries.${series}.eligible_through_on == 2024-06-15"

      - name: supplement_cycle_certification_blocked_until_its_held_conflict_is_resolved
        grounds:
          - validations[priority=38]
          - errors[ERR_UNRESOLVED_CONFLICTS]
          - state_machines.SupplementCycle.LOCKED_to_CERTIFIED
          - state_machines.CodificationSubmission.CONFLICT_HELD_to_ACCEPTED
          - calculations.supplement_conflict_precedence
        distinguishing_aspect: |
          A LOCKED SupplementCycle refuses certification with
          ERR_UNRESOLVED_CONFLICTS (409) because two of its child submissions sit
          in CONFLICT_HELD and conflict_count is 1 — the cycle's own fields are
          otherwise ready. Resolving the pair under MANUAL_OVERRIDE (winner
          ACCEPTED, loser REJECTED, conflict_count back to 0) with no further
          change to the cycle makes the identical certify succeed and rewrite the
          parent CodeTitle.
        test_recipe:
          setup:
            - "CodeTitle 12 with an OPEN SupplementCycle 7 for the window 2026-10-01..2026-10-31, clock inside the window at 2026-10-06."
            - "Two CODE_AMENDMENT ordinances both claiming section 12.04.030, each filed as a CLIENT submission, so both sit in CONFLICT_HELD."
            - "The cycle is then LOCKED."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/code-titles"
              payload: { title_number: "12", name: "Streets, Sidewalks and Public Places" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ct: $.data.id }
            - call: "POST /clerk/code-titles/${ct}/supplement-cycles"
              payload: { supplement_number: 7, window_open_on: "2026-10-01", window_close_on: "2026-10-31" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { cyc: $.data.id }
            - call: "POST /clerk/number-series"
              payload: { series_year: 2026, instrument_class: "ORDINANCE", prefix: "ORD", next_sequence: 1 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { ns: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "First rewrite of 12.04.030", full_text_length: 900, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.030" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { i_a: $.data.id }
            - call: "POST /clerk/instruments"
              payload: { instrument_class: "ORDINANCE", ordinance_category: "CODE_AMENDMENT", title: "Second rewrite of 12.04.030", full_text_length: 900, number_series_id: "${ns}", code_title_id: "${ct}", code_section_ref: "12.04.030" }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { i_b: $.data.id }
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-06T09:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "GET /clerk/code-titles/${ct}"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ctv1: $.data.version }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i_a}", code_section_ref: "12.04.030", action: "ADD", expected_code_title_version: "${ctv1}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { sub_a: $.data.id }
            - call: "GET /clerk/code-titles/${ct}"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ctv2: $.data.version }
            - call: "POST /clerk/codification-submissions"
              payload: { cycle_id: "${cyc}", instrument_id: "${i_b}", code_section_ref: "12.04.030", action: "ADD", expected_code_title_version: "${ctv2}" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { sub_b: $.data.id }
            - call: "POST /clerk/supplement-cycles/${cyc}/lock"
              payload: {}
              as: CodificationEditor
              as_user_id: "ce-01"
          trigger:
            - call: "POST /clerk/supplement-cycles/${cyc}/certify"
              payload: { certified_on: "2026-10-31" }
              as: CodificationEditor
              as_user_id: "ce-02"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/codification-submissions/${sub_a}/resolve-conflict"
              payload: { resolution_basis: "MANUAL_OVERRIDE", winning_submission_id: "${sub_a}" }
              as: CodificationEditor
              as_user_id: "ce-01"
            - call: "POST /clerk/supplement-cycles/${cyc}/certify"
              payload: { certified_on: "2026-10-31" }
              as: CodificationEditor
              as_user_id: "ce-02"
          assert:
            - "the first certify returns HTTP status 409"
            - "${err} == ERR_UNRESOLVED_CONFLICTS"
            - "after the first certify: SupplementCycle.${cyc}.status == LOCKED and SupplementCycle.${cyc}.conflict_count == 1"
            - "CodificationSubmission.${sub_a}.status == ACCEPTED"
            - "CodificationSubmission.${sub_b}.status == REJECTED"
            - "CodificationSubmission.${sub_a}.resolution_basis == MANUAL_OVERRIDE and CodificationSubmission.${sub_b}.resolution_basis == MANUAL_OVERRIDE"
            - "CodificationSubmission.${sub_a}.resolved_by_user_id == ce-01 and CodificationSubmission.${sub_b}.resolved_by_user_id == ce-01"
            - "CodificationSubmission.${sub_a}.conflict_with_submission_id == null and CodificationSubmission.${sub_b}.conflict_with_submission_id == null"
            - "SupplementCycle.${cyc}.conflict_count == 0"
            - "the second certify returns HTTP status 200"
            - "SupplementCycle.${cyc}.status == CERTIFIED and SupplementCycle.${cyc}.certified_on == 2026-10-31"
            - "CodeTitle.${ct}.section_refs contains 12.04.030 exactly once"
            - "CodeTitle.${ct}.current_supplement_number == 7"
            - "LegislativeInstrument.${i_a}.status == INTRODUCED (never published, so the PUBLISHED -> EFFECTIVE hop does not apply to it)"

  # ===================================================================
  # RULE 8 — resource_temporal_overlap
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: venue_half_open_window_plus_teardown_buffer_admits_the_meeting_starting_exactly_at_21_30
        grounds:
          - validations[priority=64]
          - errors[ERR_VENUE_WINDOW_CONFLICT]
          - entities.Venue.fields.teardown_buffer_minutes
          - entities.Meeting.fields.scheduled_start
        distinguishing_aspect: |
          Venue occupation is the half-open interval [scheduled_start,
          scheduled_end) extended by teardown_buffer_minutes, so a 18:00-21:00
          meeting on a venue with a 30-minute buffer blocks everything before
          21:30 and nothing at or after it: a meeting starting 21:29:00Z is
          refused with ERR_VENUE_WINDOW_CONFLICT (409) while one starting
          exactly 21:30:00Z is accepted with 201.
        test_recipe:
          setup:
            - "One venue with teardown_buffer_minutes 30 holding a SCHEDULED meeting from 2026-09-15T18:00:00Z to 2026-09-15T21:00:00Z."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/venues"
              payload: { name: "Council Chamber", address: "1 Civic Plaza", capacity: 120, teardown_buffer_minutes: 30 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { venue_main: $.data.id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "COUNCIL", meeting_type: "REGULAR", venue_id: "${venue_main}", scheduled_start: "2026-09-15T18:00:00Z", scheduled_end: "2026-09-15T21:00:00Z", quorum_required: 4 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { m_first: $.data.id }
          trigger:
            - call: "POST /clerk/meetings"
              payload: { body_type: "PLANNING_COMMISSION", meeting_type: "SPECIAL", venue_id: "${venue_main}", scheduled_start: "2026-09-15T21:29:00Z", scheduled_end: "2026-09-15T22:30:00Z", quorum_required: 3 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/meetings"
              payload: { body_type: "PLANNING_COMMISSION", meeting_type: "SPECIAL", venue_id: "${venue_main}", scheduled_start: "2026-09-15T21:30:00Z", scheduled_end: "2026-09-15T22:30:00Z", quorum_required: 3 }
              as: CityClerk
              as_user_id: "cc-01"
              captures: { m_second: $.data.id }
          assert:
            - "the 21:29:00Z creation returns HTTP status 409"
            - "${err} == ERR_VENUE_WINDOW_CONFLICT"
            - "the 21:30:00Z creation returns HTTP status 201"
            - "Meeting.${m_second}.scheduled_start == 2026-09-15T21:30:00Z"
            - "Meeting.${m_second}.status == SCHEDULED"
            - "Meeting.${m_first}.status == SCHEDULED"
            - "GET /clerk/meetings?venue_id=${venue_main} returns total_count == 2"

      - name: supplement_cycle_windows_must_not_abut_so_november_first_is_refused_and_november_second_is_accepted
        grounds:
          - validations[priority=66]
          - errors[ERR_SUPPLEMENT_WINDOW_CONFLICT]
          - entities.SupplementCycle.fields.window_open_on
          - entities.SupplementCycle.fields.window_close_on
        distinguishing_aspect: |
          SupplementCycle windows are CLOSED inclusive intervals and abutment is
          forbidden as well as overlap: against an existing OPEN cycle covering
          2026-10-01..2026-10-31, a new cycle opening 2026-11-01 is refused with
          ERR_SUPPLEMENT_WINDOW_CONFLICT (409) even though the two intervals share
          no day, while opening 2026-11-02 — one clear day of separation — is
          accepted with 201.
        test_recipe:
          setup:
            - "CodeTitle 12 carrying an OPEN SupplementCycle 7 for the window 2026-10-01..2026-10-31."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/code-titles"
              payload: { title_number: "12", name: "Streets, Sidewalks and Public Places" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { ct: $.data.id }
            - call: "POST /clerk/code-titles/${ct}/supplement-cycles"
              payload: { supplement_number: 7, window_open_on: "2026-10-01", window_close_on: "2026-10-31" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { cyc7: $.data.id }
          trigger:
            - call: "POST /clerk/code-titles/${ct}/supplement-cycles"
              payload: { supplement_number: 8, window_open_on: "2026-11-01", window_close_on: "2026-11-30" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { err: $.data.error_id }
            - call: "POST /clerk/code-titles/${ct}/supplement-cycles"
              payload: { supplement_number: 8, window_open_on: "2026-11-02", window_close_on: "2026-11-30" }
              as: CodificationEditor
              as_user_id: "ce-01"
              captures: { cyc8: $.data.id }
          assert:
            - "the 2026-11-01 creation returns HTTP status 409"
            - "${err} == ERR_SUPPLEMENT_WINDOW_CONFLICT"
            - "the 2026-11-02 creation returns HTTP status 201"
            - "SupplementCycle.${cyc8}.window_open_on == 2026-11-02"
            - "SupplementCycle.${cyc8}.window_close_on == 2026-11-30"
            - "SupplementCycle.${cyc8}.status == OPEN and SupplementCycle.${cyc8}.submission_count == 0"
            - "SupplementCycle.${cyc7}.status == OPEN"
            - "GET /clerk/code-titles/${ct}/supplement-cycles returns total_count == 2"

  # ===================================================================
  # RULE 9 — compensating_invariant
  # ===================================================================
  - rule_id: compensating_invariant
    instances:

      - name: withdrawing_a_paid_records_request_waives_and_refunds_to_zero_cash
        grounds:
          - state_machines.PublicRecordsRequest.RECEIVED_to_WITHDRAWN
          - calculations.records_request_fee_ledger
          - entities.PublicRecordsRequest.fields.refunded_cents
          - entities.PublicRecordsRequest.fields.net_cash_cents
          - entities.PublicRecordsRequest.fields.fee_balance_cents
        distinguishing_aspect: |
          Withdrawal is a compensating action, not a deletion: the four stored
          counters end at assessed 1875 / waived 1875 / collected 1000 /
          refunded 1000, and the two derived fields recomputed from them are
          exactly fee_balance_cents 0 and net_cash_cents 0 — the invariant
          records_request_cash_conservation. History is preserved (assessed and
          collected are NOT zeroed) while the city holds no money.
        test_recipe:
          setup:
            - "A public records request with a FLAT_SCHEDULE fee of 1875 cents assessed and a partial payment of 1000 cents received, leaving fee_status DEPOSIT_HELD."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests"
              payload: { requester_name: "Dara Nwosu", requester_email: "dara@example.org", subject_description: "Planning file for 44 Elm Street", commercial_purpose: false }
              as: Anonymous
              as_user_id: "public-04"
              captures: { req: $.data.id }
            - call: "POST /clerk/records-requests/${req}/begin-review"
              payload: {}
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req}/assess-fee"
              payload: { fee_schedule_variant: "FLAT_SCHEDULE", fee_lines: [ { page_count: 60, staff_minutes: 45, delivery_medium: "PAPER" } ] }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/records-requests/${req}/payments"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${req}"
          trigger:
            - call: "POST /clerk/records-requests/${req}/withdraw"
              payload: {}
              as: Requester
              as_user_id: "${req}"
          assert:
            - "before the withdraw: PublicRecordsRequest.${req}.fee_balance_cents == 875 and PublicRecordsRequest.${req}.net_cash_cents == 1000 and fee_status == DEPOSIT_HELD"
            - "PublicRecordsRequest.${req}.total_assessed_cents == 1875"
            - "PublicRecordsRequest.${req}.total_waived_cents == 1875"
            - "PublicRecordsRequest.${req}.total_collected_cents == 1000"
            - "PublicRecordsRequest.${req}.refunded_cents == 1000"
            - "PublicRecordsRequest.${req}.fee_balance_cents == 0"
            - "PublicRecordsRequest.${req}.net_cash_cents == 0"
            - "PublicRecordsRequest.${req}.fee_status == REFUNDED"
            - "PublicRecordsRequest.${req}.fulfillment_status == WITHDRAWN"
            - "PublicRecordsRequest.${req}.closed_on == null"

      - name: rescinding_a_certified_destruction_batch_restores_the_custody_triple_with_zero_drift
        grounds:
          - state_machines.DestructionBatch.CERTIFIED_to_RESCINDED
          - calculations.record_custody_conservation
          - entities.RecordSeries.fields.active_item_count
          - entities.RecordSeries.fields.destroyed_item_count
          - entities.RecordSeries.fields.total_accessioned_count
        distinguishing_aspect: |
          Rescission reverses certification exactly: the custody triple returns
          from (total 150, active 110, destroyed 40) to (total 150, active 150,
          destroyed 0), so total_accessioned_count is untouched by BOTH
          directions and the invariant total == active + destroyed holds at
          every observable moment. The batch itself keeps certifying_officer_id
          and certified_on for audit rather than being erased.
        test_recipe:
          setup:
            - "RecordSeries CC-01, retention_trigger CREATION, retention_years 5, with two accessions: 100 items on 2019-06-15 and 50 items on 2019-07-20 (last_accessioned_on 2019-07-20, eligible_through_on 2024-07-20) at clock 2026-08-03."
            - "A DestructionBatch of 40 items proposed by ro-01 with cutoff_on 2024-07-20 and certified by cc-01."
          setup_api_calls:
            - call: "POST /clerk/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: CityClerk
              as_user_id: "cc-01"
            - call: "POST /clerk/record-series"
              payload: { series_code: "CC-01", name: "Council correspondence", retention_years: 5, retention_trigger: "CREATION", permanent: false, legal_hold_status: "NONE" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { series: $.data.id }
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 100, accessioned_on: "2019-06-15" }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "POST /clerk/record-series/${series}/accessions"
              payload: { item_count: 50, accessioned_on: "2019-07-20" }
              as: RecordsOfficer
              as_user_id: "ro-01"
            - call: "POST /clerk/destruction-batches"
              payload: { series_id: "${series}", item_count: 40, cutoff_on: "2024-07-20" }
              as: RecordsOfficer
              as_user_id: "ro-01"
              captures: { batch: $.data.id }
            - call: "POST /clerk/destruction-batches/${batch}/certify"
              payload: { certified_on: "2026-08-03" }
              as: CityClerk
              as_user_id: "cc-01"
          trigger:
            - call: "POST /clerk/destruction-batches/${batch}/rescind"
              payload: { rescind_reason: "The cutoff date was applied to the wrong accession block." }
              as: RecordsOfficer
              as_user_id: "ro-01"
          assert:
            - "RecordSeries.${series}.eligible_through_on == 2024-07-20"
            - "RecordSeries.${series}.last_accessioned_on == 2019-07-20"
            - "before the rescind: RecordSeries.${series}.active_item_count == 110 and destroyed_item_count == 40 and total_accessioned_count == 150"
            - "DestructionBatch.${batch}.status == RESCINDED"
            - "DestructionBatch.${batch}.rescind_reason == 'The cutoff date was applied to the wrong accession block.'"
            - "DestructionBatch.${batch}.certifying_officer_id == cc-01"
            - "DestructionBatch.${batch}.certified_on == 2026-08-03"
            - "DestructionBatch.${batch}.item_count == 40"
            - "RecordSeries.${series}.active_item_count == 150"
            - "RecordSeries.${series}.destroyed_item_count == 0"
            - "RecordSeries.${series}.total_accessioned_count == 150"
            - "RecordSeries.${series}.total_accessioned_count == RecordSeries.${series}.active_item_count + RecordSeries.${series}.destroyed_item_count"
