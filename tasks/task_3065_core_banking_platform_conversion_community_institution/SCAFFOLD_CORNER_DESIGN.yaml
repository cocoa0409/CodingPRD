      - name: thirty_360_day_count_uses_30_day_months
        claim_type: Correct Result
        grounds:
          - calculations.accrual_interest
          - entities.ProductType.fields.accrual_method
        distinguishing_aspect: "A LOAN product with THIRTY_360 accruing 2026-01-31..2026-03-01 counts 32 days (30*(3-1) + min(1,30) - min(31,30) + 1 = 32), not the 30 calendar days ACT_360 would count — the day-count convention is observable in cutoff_accrued_interest_cents."
        test_recipe:
          setup:
            - "Clock set to 2026-01-01 before project creation; LOAN product THIRTY_360 rate 0.06 ACTIVE; GL; LOAN account principal 36000000 accrual_start 2026-01-31 MAPPED; project MOCK_CONVERSION; clock 2026-03-01; MOCK-1 finalized."
