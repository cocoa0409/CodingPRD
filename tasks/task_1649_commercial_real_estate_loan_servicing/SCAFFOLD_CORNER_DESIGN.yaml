            - { call: "POST /loans/${l_id}/properties", payload: { address: "1 Rein St", property_type: "OFFICE", appraised_value_cents: 1000000000, appraisal_date: "2026-06-01T00:00:00Z" }, as: MasterServicer, captures: { p_id: $.data.id } }
            - { call: "POST /loans/${l_id}/reserve-accounts", payload: { account_type: "TI_LC", target_balance_cents: 0 }, as: MasterServicer, captures: { r_id: $.data.id } }
            - { call: "POST /loans/${l_id}/extension-options", payload: { option_seq: 1, exercise_window_start: "2026-12-01T00:00:00Z", exercise_window_end: "2027-03-01T00:00:00Z", extension_months: 12, fee_pct: 0.0025 }, as: MasterServicer, captures: { e_id: $.data.id } }
            - { call: "POST /inspectors", payload: { full_name: "Rein Spect", license_no: "LIC-REI" }, as: MasterServicer, captures: { i_id: $.data.id } }
            - { call: "POST /properties/${p_id}/inspections", payload: { inspector_id: "${i_id}", scheduled_start: "2026-08-01T09:00:00Z", scheduled_end: "2026-08-01T10:00:00Z" }, as: MasterServicer, captures: { in_id: $.data.id } }
            - { call: "POST /inspections/${in_id}/close", payload: { outcome: "COMPLETED", condition_rating: "POOR" }, as: Inspector, as_user_id: "${i_id}" }
            - { call: "GET /loans/${l_id}/watchlist-entries", as: MasterServicer, captures: { w_id: "$.data[0].id" } }
            - { call: "POST /watchlist-entries/${w_id}/escalate", as: MasterServicer, payload: {} }
          trigger:
