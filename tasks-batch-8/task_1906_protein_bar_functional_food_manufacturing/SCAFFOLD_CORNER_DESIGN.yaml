            - { call: "POST /mfg/ingredients", payload: { name: "WHEY", category: "PROTEIN", allergen_tags: ["MILK"], nominal_protein_pct: 0.8 }, as: PlantAdmin, captures: { whey: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${whey}", supplier_id: "${sup}", lot_code: "WL-1", received_qty_kg: 300, received_at: "2026-08-01T00:00:00Z", coa_protein_pct: 0.8 }, as: PlantAdmin, captures: { wl: "$.data.id" } }
            - { call: "POST /mfg/ingredient-lots/${wl}/release", payload: {}, as: QualityManager }
            - { call: "POST /mfg/customers", payload: { name: "C1", contact_email: "c1@x.com" }, as: PlantAdmin, captures: { cust: "$.data.id" } }
            - { call: "POST /mfg/agreements", payload: { customer_id: "${cust}", pricing_mode: "MARGINAL", moq_cases_per_run: 100, committed_cases_per_quarter: 300, tier_breaks: [{ upto_cases: 999999999, rate_cents_per_case: 500 }], quarter_start: "2026-07-01T00:00:00Z" }, as: PlantAdmin, captures: { ag: "$.data.id" } }
            - { call: "POST /mfg/agreements/${ag}/activate", payload: {}, as: PlantAdmin }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${cust}", name: "F1", bar_weight_g: 60 }, as: FormulationScientist, captures: { f1: "$.data.id" } }
            - { call: "POST /mfg/formulas/${f1}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${whey}", qty_kg_per_batch: 40, is_protein_contributor: true }], batch_size_kg: 100, target_protein_g_per_serving: 15, claim_tags: [] }, as: FormulationScientist, captures: { r1: "$.data.id" } }
            - { call: "POST /mfg/revisions/${r1}/submit", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r1}/verify-nutrition", payload: {}, as: QualityManager }
            - { call: "POST /mfg/revisions/${r1}/send-claim-review", payload: {}, as: FormulationScientist }
            - { call: "POST /mfg/revisions/${r1}/approve", payload: {}, as: QualityManager }
            - { call: "POST /mfg/lines", payload: { name: "L1", capacity_kg_per_hour: 500, slab_weight_kg: 20 }, as: PlantAdmin, captures: { ln1: "$.data.id", ln_v: "$.data.version" } }
            - { call: "POST /mfg/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T06:00:00Z" }, as: PlantAdmin }
            - { call: "GET /mfg/agreements/${ag}", payload: {}, as: ProductionPlanner, captures: { ag_v1: "$.data.version" } }
            - { call: "POST /mfg/production-runs", payload: { revision_id: "${r1}", agreement_id: "${ag}", line_id: "${ln1}", planned_cases: 100, expected_agreement_version: "${ag_v1}" }, as: ProductionPlanner, captures: { run1: "$.data.id" } }
            - { call: "GET /mfg/agreements/${ag}", payload: {}, as: ProductionPlanner, captures: { ag_v2: "$.data.version" } }
            - { call: "POST /mfg/production-runs", payload: { revision_id: "${r1}", agreement_id: "${ag}", line_id: "${ln1}", planned_cases: 100, expected_agreement_version: "${ag_v2}" }, as: ProductionPlanner, captures: { run2: "$.data.id" } }
            - { call: "POST /mfg/production-runs/${run1}/schedule", payload: { start_utc: "2026-08-06T08:00:00Z", end_utc: "2026-08-06T10:00:00Z", expected_line_version: "${ln_v}" }, as: ProductionPlanner }
          trigger:
            - { call: "POST /mfg/production-runs/${run2}/schedule", payload: { start_utc: "2026-08-06T12:00:00Z", end_utc: "2026-08-06T14:00:00Z", expected_line_version: "${ln_v}" }, as: ProductionPlanner, captures: { err: "$.data.error_id" } }
          assert: ["run2 schedule with the stale expected_line_version (captured at line create, before run1's schedule) -> error_id ERR_STALE_VERSION (412); run2 stays PLANNED"]

      - name: c_cascade_layer_stub
        claim_type: cascading_side_effects
        grounds: ["state_machines.IngredientLot.RELEASED_to_REJECTED"]
        excluded_because:
          difficulty_instance: lot_reject_deshedule_chain
          rationale: "Three-level cascade asserted end-to-end in the named §1.8 instance."

      - name: c_dual_variant_layer_stub
        claim_type: dual_variant_calculation
        grounds: [calculations.protein_claim_substantiation]
        excluded_because:
          difficulty_instance: label_vs_composite_protein_substantiation
          rationale: "Both variants and their delta asserted in the named §1.8 instance."

      - name: c_rollup_reconciliation_stub
        claim_type: derived_field_reconciliation
        grounds: [calculations.agreement_quarter_rollup]
        excluded_because:
          difficulty_instance: lot_release_requires_stored_retain_sample
          rationale: "Rollup recompute on decide RELEASED asserted in the named §1.8 instance; window filtering in corner c_quarter_rollup_window_filtering."

  - section: consistency_model
    instances:
      - name: c_immediate_read_after_write
        claim_type: immediate_consistency
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: an ingredient is fully visible via GET in the same state right after POST, including version 1 and server timestamps."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /mfg/ingredients", payload: { name: "PECTIN", category: "BINDER", allergen_tags: [] }, as: PlantAdmin, captures: { ing: "$.data.id" } }
            - { call: "GET /mfg/ingredients/${ing}", payload: {}, as: PlantAdmin, captures: { nm: "$.data.name", v: "$.data.version" } }
          assert: ["GET returns name == PECTIN, category BINDER, version == 1 immediately after creation"]
