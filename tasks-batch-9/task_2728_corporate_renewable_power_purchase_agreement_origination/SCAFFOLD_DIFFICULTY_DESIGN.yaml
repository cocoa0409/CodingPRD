              as: SettlementAnalyst
            - call: "GET /ppa/settlement-periods/${sp_m_id}"
              as: SettlementAnalyst
              captures: { sp_m_v2: $.data.version }
            - call: "POST /ppa/settlement-periods/${sp_m_id}/intervals"
              payload: { hour_start: "2027-07-01T02:00:00Z", metered_mwh: 12.75, node_price_usd_per_mwh: 42.00, hub_price_usd_per_mwh: 44.15, curtailment_flag: "NONE", expected_settlement_period_version: "${sp_m_v2}" }
              as: SettlementAnalyst
            - call: "GET /ppa/settlement-periods/${sp_m_id}"
              as: SettlementAnalyst
              captures: { sp_m_v3: $.data.version }
            - call: "POST /ppa/settlement-periods/${sp_m_id}/intervals"
