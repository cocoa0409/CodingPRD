          - errors[ERR_PERMIT_WINDOW_MISMATCH]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_temporal (different
          from the state-vs-safety pair): scheduling break A's restoration with
          break B's permit whose window also does not cover the schedule violates
          BOTH rules; the referential error ERR_CROSS_REFERENCE_MISMATCH must win
          over ERR_PERMIT_WINDOW_MISMATCH.
        test_recipe:
          setup:
            - "Break A (segment MAIN-8-ELM) fully repaired; its RestorationJob is PENDING"
