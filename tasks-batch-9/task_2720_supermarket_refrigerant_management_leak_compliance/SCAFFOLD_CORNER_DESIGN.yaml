      - name: technician_suspension_blocks_service_writes
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TECHNICIAN_SUSPENDED
          - validations[priority=14]
        excluded_because:
          difficulty_instance: service_record_blocked_by_suspended_technician_state
          rationale: "That §1.8 cross-entity-state instance suspends the technician mid-chain and asserts the 422 ERR_TECHNICIAN_SUSPENDED on the next ServiceRecord, then clears it by reinstatement. The code is already proved reachable there."

      - name: open_leak_event_blocks_retirement
        claim_type: error_triggerable
        grounds:
          - errors.ERR_OPEN_LEAK_EVENT_BLOCKS_RETIREMENT
          - validations[priority=44]
        excluded_because:
          difficulty_instance: system_retirement_blocked_by_non_terminal_leak_event_state
          rationale: "That instance is built around exactly this refusal - a fully recovered (0.0 lb) system with an OPEN event is refused, then permitted once the retirement is executed against an APPROVED RETIRE plan."

      - name: superseded_repair_attempt_cannot_be_verified
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REPAIR_ATTEMPT_NOT_CURRENT
          - validations[priority=25]
        excluded_because:
          difficulty_instance: verification_test_blocked_by_superseded_repair_attempt_state
          rationale: "That instance files a second repair attempt to supersede the first and asserts the 422 on a verification test naming the stale attempt; a corner duplicate would restate the same claim."

      - name: overlapping_technician_labour_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_TECHNICIAN_SCHEDULE_CONFLICT
          - validations[priority=32]
        excluded_because:
          difficulty_instance: technician_labour_intervals_are_half_open_abutting_allowed
          rationale: "That resource-temporal-overlap instance walks abutting (allowed), one-minute-overlapping (rejected) and disjoint intervals on one technician, so the conflict code is triggered there with its boundary semantics pinned."

      - name: overlapping_recovery_machine_occupancy_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EQUIPMENT_DECONTAMINATION_CONFLICT
          - validations[priority=33]
        excluded_because:
          difficulty_instance: recovery_machine_occupancy_is_closed_and_buffered_touching_rejected
          rationale: "That instance proves the 60-minute decontamination buffer and the closed-interval endpoint rule (touching conflicts) on one machine, which is the only way this code fires."

      - name: extension_grant_beyond_the_statutory_cap_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_EXTENSION_DAY_CAP_EXCEEDED
          - validations[priority=37]
        excluded_because:
          difficulty_instance: extension_total_exactly_at_thirty_day_cap_approves_thirty_first_day_rejected
          rationale: "That boundary instance approves a cumulative 30 days and then rejects the 31st with this code, covering both sides of the cap."

      - name: charging_the_wrong_chemistry_into_a_system_is_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REFRIGERANT_TYPE_MISMATCH
          - validations[priority=21]
        excluded_because:
          difficulty_instance: refrigerant_type_mismatch_beats_insufficient_cylinder_contents_referential_over_constraint
          rationale: "That priority-pair instance returns this code as the winner over the cylinder-contents rule, so the mismatch check is already exercised as a returned error rather than a suppressed loser."

  # ===========================================================================
  - section: rbac
    instances:
      - name: roles_cannot_reach_each_others_exclusive_operations
        claim_type: unauthorized_operation
        grounds:
          - roles.PlatformAdmin.exclusive_operations
          - roles.ComplianceManager.exclusive_operations
          - roles.Technician.exclusive_operations
          - roles.Regulator.exclusive_operations
          - errors.ERR_FORBIDDEN_ROLE
          - validations[priority=2]
        distinguishing_aspect: "Five well-formed, fully populated bodies are refused purely on the X-User-Role header, one per role boundary, proving the role gate runs before any body validation: the Regulator's service-record body would otherwise be accepted verbatim, and the ComplianceManager's compliance-run body is empty yet still 403 rather than 400."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, one 100 lb system charged to 80.0, one UNIVERSAL technician, one HIGH-certified machine and one 40.0 lb cylinder - i.e. everything needed for the refused calls to be otherwise valid."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 100.0, initial_charge_lbs: 80.0, installed_on: "2025-01-15T00:00:00Z", leak_rate_method: "ROLLING_AVERAGE" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Marek Olsen", epa_certification_number: "EPA-608-22222", certification_type: "UNIVERSAL", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech2_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech2_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /cylinders"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", cylinder_serial: "CYL-0001", nominal_capacity_lbs: 50.0, initial_contents_lbs: 40.0 }
              as: ComplianceManager
              captures: { cyl1_id: $.data.id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: ComplianceManager
              captures: { sys1_v: $.data.version }
          trigger:
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 80.0, initial_charge_lbs: 0.0, installed_on: "2025-06-01T00:00:00Z" }
              as: Technician
              as_user_id: "${tech2_id}"
              captures: { e_tech_on_systems: $.data.error_id }
            - call: "POST /service-records"
              payload: { system_id: "${sys1_id}", technician_id: "${tech2_id}", recovery_equipment_id: "${eq1_id}", cylinder_id: "${cyl1_id}", service_type: "ADD_REFRIGERANT", refrigerant_added_lbs: 10.0, performed_at: "2026-08-01T00:00:00Z", duration_minutes: 60, expected_system_version: "${sys1_v}" }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { e_reg_on_records: $.data.error_id }
            - call: "POST /inspections"
              payload: { store_id: "${store_id}", inspector_name: "Inspector Vale", citations: [] }
              as: ComplianceManager
              captures: { e_cm_on_inspections: $.data.error_id }
            - call: "POST /technicians/${tech2_id}/status-change"
              payload: { new_status: "SUSPENDED", reason_code: "CERT_UNDER_REVIEW" }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { e_reg_on_status: $.data.error_id }
            - call: "POST /compliance-runs"
              payload: {}
              as: ComplianceManager
              captures: { e_cm_on_runs: $.data.error_id }
          assert:
            - "all five calls return HTTP 403 with error_id ERR_FORBIDDEN_ROLE and success == false"
            - "the Regulator service-record refusal is ERR_FORBIDDEN_ROLE, not ERR_TECHNICIAN_IDENTITY_MISMATCH - the role gate at priority 2 runs before the identity gate at priority 6"
            - "the empty compliance-run body still returns 403 and not ERR_INVALID_REQUEST, so the role gate also precedes shape validation at priority 3"
            - "nothing is written: GET /systems returns total_count 1, GET /service-records total_count 0, GET /inspections total_count 0, and Technician.${tech2_id}.status is still ACTIVE"
            - "RefrigerantSystem.${sys1_id}.version is still ${sys1_v} and current_charge_lbs still 80.0"

      - name: shared_writes_and_reads_are_open_to_every_permitted_role
        claim_type: shared_operations
        grounds:
          - roles.PlatformAdmin.shared_operations
          - roles.ComplianceManager.shared_operations
          - roles.Technician.shared_operations
          - roles.StoreManager.shared_operations
          - roles.Regulator.shared_operations
        distinguishing_aspect: "The positive half of the RBAC contract: the same GET is served identically to all five roles (including a StoreManager reading its own store), POST /leak-events is honoured for both ComplianceManager and Regulator on two different systems, and POST /stores is honoured for both PlatformAdmin and ComplianceManager - so no shared operation has been accidentally narrowed to one role."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store created by PlatformAdmin, one refrigerant type, and two empty 60 lb systems so that two independent leak events can be declared without tripping the one-open-event-per-system rule."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: PlatformAdmin
              captures: { storeA_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Southgate Market", store_code: "SG-002", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { storeB_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: PlatformAdmin
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${storeA_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sysA_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${storeA_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sysB_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Marek Olsen", epa_certification_number: "EPA-608-22222", certification_type: "UNIVERSAL", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech2_id: $.data.id }
          trigger:
            - call: "GET /systems/${sysA_id}"
              payload: {}
              as: PlatformAdmin
              captures: { read_admin: $.data.id }
            - call: "GET /systems/${sysA_id}"
              payload: {}
              as: ComplianceManager
              captures: { read_cm: $.data.id }
            - call: "GET /systems/${sysA_id}"
              payload: {}
              as: Technician
              as_user_id: "${tech2_id}"
              captures: { read_tech: $.data.id }
            - call: "GET /systems/${sysA_id}"
              payload: {}
              as: StoreManager
              as_user_id: "${storeA_id}"
              captures: { read_sm: $.data.id }
            - call: "GET /systems/${sysA_id}"
              payload: {}
              as: Regulator
              as_user_id: "regulator-1"
              captures: { read_reg: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${sysA_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "AUTOMATED_MONITORING" }
              as: ComplianceManager
              captures: { eventA_id: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${sysB_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { eventB_id: $.data.id }
          assert:
            - "all five GETs return HTTP 200 with the identical payload for ${sysA_id}; no role receives a redacted or narrowed body"
            - "both POST /stores calls returned 201, one under PlatformAdmin and one under ComplianceManager"
            - "both POST /leak-events calls return 201 with status OPEN, repair_deadline 2026-08-31T00:00:00Z and detection_method preserved as supplied"
            - "GET /leak-events returns total_count 2 and Store.${storeA_id}.open_leak_event_count == 2 with compliance_status AT_RISK"
            - "the StoreManager read succeeds only because X-User-ID == ${storeA_id}; the same read of a ${storeB_id} resource is refused by priority 7"

      - name: request_with_missing_or_undeclared_role_header_is_rejected
        claim_type: unauthorized_operation
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: "Authentication is a distinct, earlier failure from authorisation: a request with no X-User-Role, a request naming a role that does not exist in §1.7, and a request with a valid role but no X-User-ID all return 401 ERR_UNAUTHENTICATED - never 403 ERR_FORBIDDEN_ROLE and never a 404 for the resource, even though the addressed system does exist."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store and one 60 lb system that genuinely exists, so a 404 cannot be confused with the 401."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
          trigger:
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: "<X-User-Role header omitted entirely>"
              captures: { e_no_role: $.data.error_id }
            - call: "GET /systems/${sys1_id}"
              payload: {}
              as: "Auditor"
              as_user_id: "auditor-1"
              captures: { e_bad_role: $.data.error_id }
            - call: "POST /stores"
              payload: { name: "Eastgate Market", store_code: "EG-003", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              as_user_id: "<X-User-ID header omitted entirely>"
              captures: { e_no_user: $.data.error_id }
          assert:
            - "all three calls return HTTP 401 with error_id ERR_UNAUTHENTICATED and success == false"
            - "the undeclared role Auditor yields 401 (the role is not one of the five) rather than 403"
            - "none of the three returns 404 even though the first two address a real system id"
            - "GET /stores as ComplianceManager still returns total_count 1 - the unauthenticated create was not applied"

      - name: technician_cannot_verify_the_repair_they_performed
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES_VERIFICATION
          - validations[priority=19]
          - state_machines.LeakEvent.VERIFICATION_PENDING_to_VERIFIED_CLOSED
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation of duties is enforced on the entity-backed technician identity, not on the role: Dana is a fully certified Technician calling a Technician-only endpoint under her own X-User-ID, and the sole defect is that she is also the author of the RepairAttempt under test. The identical body from Marek closes the event, proving nothing else was wrong."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z advanced to 2026-08-10T00:00:00Z. One empty 60 lb high-pressure system, a manual leak event detected 2026-08-01, two certified technicians, one HIGH-certified machine, and a repair attempt completed 2026-08-05 by Dana (event now VERIFICATION_PENDING with verification_deadline 2026-08-15)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /refrigerant-types"
              payload: { name: "R-404A", gwp: 3922, pressure_class: "HIGH", ods_class: "HFC", phasedown_status: "RESTRICTED_NEW_EQUIPMENT" }
              as: ComplianceManager
              captures: { rt404_id: $.data.id }
            - call: "POST /systems"
              payload: { store_id: "${store_id}", refrigerant_type_id: "${rt404_id}", system_category: "COMMERCIAL_REFRIGERATION", full_charge_lbs: 60.0, initial_charge_lbs: 0.0, installed_on: "2025-01-15T00:00:00Z" }
              as: ComplianceManager
              captures: { sys1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Dana Ruiz", epa_certification_number: "EPA-608-11111", certification_type: "TYPE_II", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech1_id: $.data.id }
            - call: "POST /technicians"
              payload: { full_name: "Marek Olsen", epa_certification_number: "EPA-608-22222", certification_type: "UNIVERSAL", certification_expires_on: "2027-12-31T00:00:00Z" }
              as: ComplianceManager
              captures: { tech2_id: $.data.id }
            - call: "POST /recovery-equipment"
              payload: { store_id: "${store_id}", assigned_technician_id: "${tech1_id}", equipment_serial: "RM-9001", certified_to_standard: "AHRI_740_2016", certified_for_pressure_class: "HIGH", last_verification_on: "2026-06-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eq1_id: $.data.id }
            - call: "POST /leak-events"
              payload: { system_id: "${sys1_id}", detected_at: "2026-08-01T00:00:00Z", detection_method: "MANUAL_INSPECTION" }
              as: ComplianceManager
              captures: { event_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /repair-attempts"
              payload: { leak_event_id: "${event_id}", system_id: "${sys1_id}", technician_id: "${tech1_id}", recovery_equipment_id: "${eq1_id}", repair_method_code: "BRAZE_JOINT", repair_completed_at: "2026-08-05T00:00:00Z" }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { ra1_id: $.data.id }
          trigger:
            - call: "POST /verification-tests"
              payload: { leak_event_id: "${event_id}", repair_attempt_id: "${ra1_id}", technician_id: "${tech1_id}", test_method_code: "PRESSURE_DECAY", performed_at: "2026-08-08T00:00:00Z", result: "PASS", measured_leak_rate_pct: 0.0 }
              as: Technician
              as_user_id: "${tech1_id}"
              captures: { e_sod: $.data.error_id }
            - call: "POST /verification-tests"
              payload: { leak_event_id: "${event_id}", repair_attempt_id: "${ra1_id}", technician_id: "${tech2_id}", test_method_code: "PRESSURE_DECAY", performed_at: "2026-08-08T00:00:00Z", result: "PASS", measured_leak_rate_pct: 0.0 }
              as: Technician
              as_user_id: "${tech2_id}"
              captures: { vt_id: $.data.id }
          assert:
            - "before the triggers LeakEvent.${event_id}.status == VERIFICATION_PENDING with verification_deadline 2026-08-15T00:00:00Z and repair_attempt_count 1"
            - "first trigger: HTTP 422 with error_id ERR_SEGREGATION_OF_DUTIES_VERIFICATION, and it is NOT ERR_FORBIDDEN_ROLE or ERR_TECHNICIAN_IDENTITY_MISMATCH"
            - "after the refusal the event is still VERIFICATION_PENDING and RepairAttempt.${ra1_id}.outcome is still AWAITING_VERIFICATION"
            - "second trigger: HTTP 201, RepairAttempt.${ra1_id}.outcome == VERIFIED and LeakEvent.${event_id}.status == VERIFIED_CLOSED with closed_at 2026-08-10T00:00:00Z"
            - "RefrigerantSystem.${sys1_id}.compliance_state returns to COMPLIANT and Store.${store_id}.open_leak_event_count == 0"

      - name: regulator_cannot_close_the_inspection_they_opened
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES_INSPECTION
          - validations[priority=20]
          - state_machines.Inspection.RESPONDED_to_CLOSED
          - roles.Regulator.exclusive_operations
        distinguishing_aspect: "The second segregation axis is keyed on X-User-ID within a single role: closure is a Regulator-exclusive operation, so the refusal cannot be a role error - regulator-1 is barred only because Inspection.opened_by_user_id records them as the opener, while regulator-2 with the identical body closes the matter."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, one store, one inspection with a single MINOR 1-day citation opened by regulator-1 and responded to by the store manager (so status is RESPONDED and the transition is otherwise available)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { store_id: $.data.id }
            - call: "POST /inspections"
              payload: { store_id: "${store_id}", inspector_name: "Inspector Vale", citations: [ { citation_code: "608-LEAK-REC", severity: "MINOR", violation_days: 1 } ] }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { insp_id: $.data.id, opened_by: $.data.opened_by_user_id }
            - call: "POST /inspections/${insp_id}/response"
              payload: { response_summary: "Leak records reconciled and refiled.", corrective_action_code: "RECORDS_CORRECTED" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { insp_status_mid: $.data.status }
          trigger:
            - call: "POST /inspections/${insp_id}/closure"
              payload: { closure_note: "Closing my own inspection." }
              as: Regulator
              as_user_id: "regulator-1"
              captures: { e_sod: $.data.error_id }
            - call: "POST /inspections/${insp_id}/closure"
              payload: { closure_note: "Corrective action accepted by a second inspector." }
              as: Regulator
              as_user_id: "regulator-2"
              captures: { insp_status_final: $.data.status, closed_by: $.data.closed_by_user_id }
          assert:
            - "Inspection.${insp_id}.opened_by_user_id == regulator-1 and status == RESPONDED before the triggers"
            - "first trigger: HTTP 422 with error_id ERR_SEGREGATION_OF_DUTIES_INSPECTION; it is NOT ERR_FORBIDDEN_ROLE and NOT ERR_INVALID_STATE_TRANSITION"
            - "after the refusal the inspection is still RESPONDED with closed_at null and Store.${store_id}.penalty_exposure_total_usd == 275.55"
            - "second trigger: HTTP 200 with status CLOSED, closed_by_user_id == regulator-2, closed_at == 2026-08-01T00:00:00Z"
            - "after closure Store.${store_id}.penalty_exposure_total_usd == 0.00 while Inspection.${insp_id}.penalty_exposure_usd stays 275.55"

      - name: store_manager_cannot_reach_another_stores_resources
        claim_type: unauthorized_operation
        grounds:
          - errors.ERR_STORE_SCOPE_VIOLATION
          - validations[priority=7]
          - roles.StoreManager.identity
        distinguishing_aspect: "The StoreManager identity is entity-backed by Store, so scope is enforced per resource rather than per endpoint: the same three calls that succeed for the manager's own store are refused for the neighbouring store - including a GET that is otherwise open to all five roles - and the refusal is ERR_STORE_SCOPE_VIOLATION rather than a 404 that would leak nothing but also hide the rule."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, two stores, one 60 lb system in store B, and one inspection on store B opened by regulator-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Northgate Market", store_code: "NG-001", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { storeA_id: $.data.id }
            - call: "POST /stores"
              payload: { name: "Southgate Market", store_code: "SG-002", state_code: "CA", region: "WEST" }
              as: ComplianceManager
              captures: { storeB_id: $.data.id }
            - call: "POST /refrigerant-types"
