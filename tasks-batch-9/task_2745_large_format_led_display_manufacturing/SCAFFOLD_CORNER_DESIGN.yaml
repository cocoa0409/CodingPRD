            - "Module.${m2}.slot_index == 2 and module_state == INSTALLED"

      - name: contracted_spare_cannot_be_installed_into_production
        claim_type: violation_to_error
        grounds:
          - validations[priority=45]
          - errors.ERR_MODULE_RESERVED_AS_SPARE
          - entities.Module.fields.reserved_service_contract_id
        distinguishing_aspect: |
          A reserved spare is still CALIBRATED, so the module-state gate at
          priority 19 passes and only the dedicated reservation check at 45 can
          stop the install. This is the rule that keeps the promised spare pool
          honest: without it the plant can quietly consume the very module the
          response-time commitment depends on, and spare_reserved_count would keep
          counting a module that is bolted into a wall.
