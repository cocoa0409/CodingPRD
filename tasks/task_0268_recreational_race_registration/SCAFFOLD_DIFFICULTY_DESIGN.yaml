# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Recreational Race Registration — Expert. Grounds resolve into SCAFFOLD.yaml.
# Canonical timeline used across recipes:
#   registration_opens_utc = 2026-01-01T00:00:00Z
#   PricingTiers (per distance): EARLY_BIRD@2026-01-01 base 4000,
#                                REGULAR@2026-05-01 base 5500,
#                                LATE@2026-06-15 base 7000
#   registration_closes_utc = 2026-07-01T00:00:00Z
#   race_date_utc           = 2026-07-05T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: amount_due_provisional_vs_final_diverges_on_tier_flip
        grounds:
          - calculations.registration_amount_due
          - entities.Registration.fields.amount_due_cents
          - entities.Registration.fields.amount_paid_cents
          - state_machines.Registration.PENDING_PAYMENT_to_CONFIRMED
        distinguishing_aspect: |
          Same Registration: provisional amount_due_cents (priced at REGULAR tier 5500 at
          creation clock) differs from final amount_paid_cents (priced at LATE tier 7000 at
          confirm clock) because the active tier flipped between creation and confirmation.
        test_recipe:
          setup:
            - "Event OPEN, one MARATHON distance capacity 50, three pricing tiers."
            - "Clock at creation 2026-06-09 -> REGULAR tier (5500) writes amount_due_cents."
            - "Clock advanced to 2026-06-16 -> LATE tier (7000) before confirm."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "rnr1@x.com", full_name: "Runner One", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "City Marathon", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "MARATHON", distance_km: 42.195, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "EARLY_BIRD", effective_from_utc: "2026-01-01T00:00:00Z", base_price_cents: 4000 }
              as: RaceDirector
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "LATE", effective_from_utc: "2026-06-15T00:00:00Z", base_price_cents: 7000 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: RaceDirector
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv: $.data.version }
          trigger:
            - call: "POST /registrations/${reg}/confirm-payment"
              payload: { expected_distance_version: "${dv}" }
              as: Participant
              as_user_id: "${p1}"
          assert:
            - "Registration.${reg}.amount_due_cents == 5660"
            - "Registration.${reg}.amount_paid_cents == 7203"
            - "Registration.${reg}.amount_paid_cents != Registration.${reg}.amount_due_cents"

      - name: fundraising_provisional_vs_final_diverge_on_pledge_status
        grounds:
          - calculations.fundraising_progress
          - entities.FundraisingPledge.fields.status
          - state_machines.FundraisingPledge.PLEDGED_to_SETTLED
          - validations[priority=11]
        distinguishing_aspect: |
          On the FundraisingPledge domain (different entity than registration pricing): provisional
          progress sums PLEDGED+SETTLED (30000) while the final variant counts SETTLED only (12000);
          the assign-bib gate uses the final variant and rejects when settled < minimum 25000.
        test_recipe:
          setup:
            - "Event OPEN, FIVE_K distance capacity 50, charity_capacity 10, charity_fundraising_minimum_cents 25000."
            - "Confirmed CHARITY registration with pledges A=10000 PLEDGED, B=8000 PLEDGED, C=12000 SETTLED."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "ch1@x.com", full_name: "Charity One", birthdate: "1992-02-02", gender: "F" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "Charity 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 50, charity_capacity: 10, charity_fundraising_minimum_cents: 25000 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}", entry_type: "CHARITY" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv: $.data.version }
            - call: "POST /registrations/${reg}/confirm-payment"
              payload: { expected_distance_version: "${dv}" }
              as: Participant
              as_user_id: "${p1}"
            - call: "POST /pledges"
              payload: { registration_id: "${reg}", donor_name: "A", amount_cents: 10000 }
              as: Participant
              as_user_id: "${p1}"
              captures: { plA: $.data.id }
            - call: "POST /pledges"
              payload: { registration_id: "${reg}", donor_name: "B", amount_cents: 8000 }
              as: Participant
              as_user_id: "${p1}"
              captures: { plB: $.data.id }
            - call: "POST /pledges"
              payload: { registration_id: "${reg}", donor_name: "C", amount_cents: 12000 }
              as: Participant
              as_user_id: "${p1}"
              captures: { plC: $.data.id }
            - call: "POST /pledges/${plC}/settle"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
          trigger:
            - call: "POST /registrations/${reg}/assign-bib"
              payload: {}
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_FUNDRAISING_MINIMUM_NOT_MET"
            - "Registration.${reg}.status == CONFIRMED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: amount_due_nested_min_group_and_promo_discount_cap
        grounds:
          - calculations.registration_amount_due
          - entities.Registration.fields.party_size
          - entities.Registration.fields.promo_code
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base tier, party_size-driven group discount, promo discount) with
          a non-linear nested min cap (group 0.10 + promo 0.15 caps at MAX_DISCOUNT_PCT 0.20) before
          the processing fee on the discounted base.
        test_recipe:
          setup:
            - "Event OPEN, MARATHON distance, REGULAR tier 5500 active at clock 2026-06-09."
            - "Registration party_size 2 + promo SPRING10 (group 0.05 + promo 0.10 = 0.15, no cap hit)."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "combo@x.com", full_name: "Combo Runner", birthdate: "1988-03-03", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "Combo Marathon", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "MARATHON", distance_km: 42.195, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
          trigger:
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}", party_size: 2, promo_code: "SPRING10" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
          assert:
            - "Registration.${reg}.amount_due_cents == 4811"
            - "Registration.${reg}.processing_fee_cents == 136"

      - name: refund_pinned_rounding_order_fee_component_first
        grounds:
          - calculations.registration_refund
          - entities.Registration.fields.refund_cents
          - state_machines.Registration.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Mode (b): rounding ORDER is pinned — the 15% cancellation fee is computed on net
          (paid 4811 minus non-refundable processing fee 136 = 4675), rounded INDEPENDENTLY
          (round_half_up(4675*0.15)=701), then subtracted -> refund 3974, distinct from
          rounding the whole refund after a fractional fee.
        test_recipe:
          setup:
            - "CONFIRMED registration with amount_paid_cents 4811, processing_fee_cents 136 (party2 + SPRING10 at REGULAR)."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "ref@x.com", full_name: "Refund Runner", birthdate: "1991-04-04", gender: "F" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "Refund Marathon", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "MARATHON", distance_km: 42.195, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}", party_size: 2, promo_code: "SPRING10" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv: $.data.version }
            - call: "POST /registrations/${reg}/confirm-payment"
              payload: { expected_distance_version: "${dv}" }
              as: Participant
              as_user_id: "${p1}"
          trigger:
            - call: "POST /registrations/${reg}/cancel"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
          assert:
            - "Registration.${reg}.refund_cents == 3974"
            - "Registration.${reg}.status == CANCELLED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: registration_deferral_self_referential_cycle
        grounds:
          - state_machines.Registration.CONFIRMED_to_DEFERRED
          - entities.Registration.fields.deferred_to_registration_id
          - calculations.registration_deferral_credit
        distinguishing_aspect: |
          Registration is non-linear via a self-referential deferral cycle: a CONFIRMED registration
          spawns a NEW PENDING_PAYMENT registration on a different event and links to it through
          deferred_to_registration_id (a Registration->Registration self-reference), not a forward pipeline.
        test_recipe:
          setup:
            - "Source event OPEN with CONFIRMED MARATHON registration (paid 5660, fee 160)."
            - "Target DRAFT event with a matching MARATHON distance."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "def@x.com", full_name: "Defer Runner", birthdate: "1985-05-05", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /events"
              payload: { name: "Source Marathon", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "MARATHON", distance_km: 42.195, capacity_total: 50 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /events"
              payload: { name: "Next Year Marathon", race_date_utc: "2027-07-05T00:00:00Z", registration_opens_utc: "2027-01-01T00:00:00Z", registration_closes_utc: "2027-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev2: $.data.id }
            - call: "POST /events/${ev2}/distances"
              payload: { label: "MARATHON", distance_km: 42.195, capacity_total: 50 }
              as: RaceDirector
              captures: { dist2: $.data.id }
            - call: "POST /distances/${dist2}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
            - call: "POST /distances/${dist2}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2027-05-01T00:00:00Z", base_price_cents: 6000 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv: $.data.version }
            - call: "POST /registrations/${reg}/confirm-payment"
              payload: { expected_distance_version: "${dv}" }
              as: Participant
              as_user_id: "${p1}"
          trigger:
            - call: "POST /registrations/${reg}/defer"
              payload: { target_event_id: "${ev2}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { newreg: $.data.deferred_to_registration_id }
          assert:
            - "Registration.${reg}.status == DEFERRED"
            - "Registration.${reg}.deferral_credit_cents == 4000"
            - "Registration.${reg}.deferred_to_registration_id is non-null"
            - "Registration referenced by deferred_to_registration_id has status PENDING_PAYMENT"

      - name: waitlist_offer_branches_to_three_terminals
        grounds:
          - state_machines.WaitlistEntry.OFFERED_to_CLAIMED
          - state_machines.WaitlistEntry.OFFERED_to_EXPIRED
          - state_machines.WaitlistEntry.OFFERED_to_DECLINED
        distinguishing_aspect: |
          On a different entity (WaitlistEntry): a single OFFERED state branches to three distinct
          terminals {CLAIMED, EXPIRED, DECLINED} with divergent side-effects (claim confirms reg;
          decline cancels reg and promotes next; expire promotes next) — a fork, not a linear chain.
          This instance exercises the DECLINE branch.
        test_recipe:
          setup:
            - "Distance capacity 1, already CONFIRMED by P1; P2 then confirms -> WAITLISTED (QUEUED)."
            - "P1 cancels -> P2's entry promoted to OFFERED."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "wl1@x.com", full_name: "WL One", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /participants"
              payload: { email: "wl2@x.com", full_name: "WL Two", birthdate: "1990-01-02", gender: "F" }
              as: RaceDirector
              captures: { p2: $.data.id }
            - call: "POST /events"
              payload: { name: "Tiny 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 1 }
              as: RaceDirector
              captures: { dist: $.data.id }
            - call: "POST /distances/${dist}/waves"
              payload: { name: "Wave 1", start_offset_seconds: 0, wave_capacity: 50, corral_capacity: 10 }
              as: RaceDirector
              captures: { wv: $.data.id }
            - call: "POST /distances/${dist}/pricing-tiers"
              payload: { tier_name: "REGULAR", effective_from_utc: "2026-05-01T00:00:00Z", base_price_cents: 5500 }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-09T00:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev}/open"
              payload: {}
              as: RaceDirector
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p1}" }
              as: Participant
              as_user_id: "${p1}"
              captures: { reg1: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
              captures: { dv1: $.data.version }
            - call: "POST /registrations/${reg1}/confirm-payment"
              payload: { expected_distance_version: "${dv1}" }
              as: Participant
              as_user_id: "${p1}"
            - call: "POST /registrations"
              payload: { event_id: "${ev}", distance_id: "${dist}", wave_id: "${wv}", participant_id: "${p2}" }
              as: Participant
              as_user_id: "${p2}"
              captures: { reg2: $.data.id }
            - call: "GET /distances/${dist}"
              payload: {}
              as: Participant
              as_user_id: "${p2}"
              captures: { dv2: $.data.version }
            - call: "POST /registrations/${reg2}/confirm-payment"
              payload: { expected_distance_version: "${dv2}" }
              as: Participant
              as_user_id: "${p2}"
            - call: "GET /distances/${dist}/waitlist-entries"
              payload: { status: "QUEUED" }
              as: Participant
              as_user_id: "${p2}"
              captures: { wl2: "$.data[0].id" }
            - call: "POST /registrations/${reg1}/cancel"
              payload: {}
              as: Participant
              as_user_id: "${p1}"
          trigger:
            - call: "POST /waitlist-entries/${wl2}/decline"
              payload: {}
              as: Participant
              as_user_id: "${p2}"
          assert:
            - "WaitlistEntry.${wl2}.status == DECLINED"
            - "Registration.${reg2}.status == CANCELLED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_cascades_to_registration_then_distance_then_waitlist
        grounds:
          - state_machines.Event.OPEN_to_CANCELLED
          - state_machines.Registration.CONFIRMED_to_CANCELLED
          - state_machines.WaitlistEntry.QUEUED_to_OFFERED
          - entities.Distance.fields.confirmed_count
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger: cancel Event -> (1) each CONFIRMED Registration
          transitions to CANCELLED -> (2) that cancellation decrements Distance.confirmed_count ->
          (3) the freed slot would normally promote a QUEUED WaitlistEntry; here event-cancel instead
          WITHDRAWS the queued entry. Each hop is caused by the previous hop, not by the event-cancel directly.
        test_recipe:
          setup:
            - "Distance capacity 1, P1 CONFIRMED, P2 WAITLISTED (QUEUED)."
          setup_api_calls:
            - call: "POST /participants"
              payload: { email: "ec1@x.com", full_name: "EC One", birthdate: "1990-01-01", gender: "M" }
              as: RaceDirector
              captures: { p1: $.data.id }
            - call: "POST /participants"
              payload: { email: "ec2@x.com", full_name: "EC Two", birthdate: "1990-01-02", gender: "F" }
              as: RaceDirector
              captures: { p2: $.data.id }
            - call: "POST /events"
              payload: { name: "Cancel 5K", race_date_utc: "2026-07-05T00:00:00Z", registration_opens_utc: "2026-01-01T00:00:00Z", registration_closes_utc: "2026-07-01T00:00:00Z" }
              as: RaceDirector
              captures: { ev: $.data.id }
            - call: "POST /events/${ev}/distances"
              payload: { label: "FIVE_K", distance_km: 5.0, capacity_total: 1 }
              as: RaceDirector
