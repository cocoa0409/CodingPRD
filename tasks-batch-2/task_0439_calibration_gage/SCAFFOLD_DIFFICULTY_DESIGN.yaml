              captures: { err: $.data.error_id }
          assert:
            - "disposition response status code == 409"
            - "disposition response data.error_id == ERR_INVALID_STATE"

      - name: instrument_active_before_traceable_on_start
        grounds:
          - validations[priority=10]
          - validations[priority=12]
        distinguishing_aspect: |
          Error-category pair state (priority 10, ERR_INSTRUMENT_NOT_ACTIVE) vs
          business_safety (priority 12, ERR_STANDARD_NOT_TRACEABLE): starting an
          event on a QUARANTINED instrument whose standard is ALSO non-traceable
          returns ERR_INSTRUMENT_NOT_ACTIVE because the active-state check has the
          lower priority number.
        test_recipe:
          setup:
            - "Instrument QUARANTINED via a prior FAILED event; a second DRAFT event references a standard whose certification has lapsed (not traceable)."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-Good", nist_test_number: "NIST-8", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_good: $.data.id }
            - call: "POST /calibration-standards"
              payload: { name: "GB-Expired", nist_test_number: "NIST-9", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 1 }
              as: Metrologist
              captures: { std_exp: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-PP2", description: "PP2 gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MAJOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_good}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev_bad: $.data.id }
            - call: "POST /calibration-events/${ev_bad}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
            - call: "POST /calibration-events/${ev_bad}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev_bad}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { inst_v2: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_exp}", scheduled_epoch: 6, expected_instrument_version: "${inst_v2}" }
              as: Technician
              captures: { ev2: $.data.id }
            - call: "POST /calibration-events/${ev2}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
          trigger:
            - call: "POST /calibration-events/${ev2}/start"
              payload: {}
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "start response status code == 409"
            - "start response data.error_id == ERR_INSTRUMENT_NOT_ACTIVE"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: point_pass_closed_upper_boundary
        grounds:
          - calculations.cal_result
          - entities.MeasurementPoint.fields.as_found_pass
          - endpoints["POST /calibration-events/{id}/measurement-points"]
        distinguishing_aspect: |
          Numeric threshold boundary on MeasurementPoint pass test: as_found_value
          exactly at nominal + tol_plus (25.05 with nominal 25.0, tol_plus 0.05)
          PASSES because the interval is closed (<=), whereas 25.06 fails — tested
          via the measurement-points endpoint.
        test_recipe:
          setup:
            - "A DRAFT event on an ACTIVE instrument (nominal 25.0, tol ±0.05)."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-B1", nist_test_number: "NIST-10", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /instruments"
              payload: { asset_tag: "INST-B1", description: "Boundary gauge", nominal_value: 25.0, tolerance_plus: 0.05, tolerance_minus: 0.05, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MINOR" }
              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev: $.data.id }
          trigger:
            - call: "POST /calibration-events/${ev}/measurement-points"
              payload: { point_label: "PB", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.05 }
              as: Technician
              captures: { afp: $.data.as_found_pass }
          assert:
            - "MeasurementPoint.as_found_pass == true (value 25.05 at the closed upper boundary)"

      - name: trial_matrix_empty_cell_count_boundary
        grounds:
          - validations[priority=16]
          - state_machines.GageRRStudy.COLLECTING_to_ANALYZED
          - endpoints["POST /gage-rr-studies/{id}/analyze"]
        distinguishing_aspect: |
          Cardinality/empty-set boundary on a different metric and endpoint: a
          study expecting 8 cells (2×2×2) with only 7 populated (one cell missing)
          fails analyze with ERR_INCOMPLETE_TRIAL_MATRIX — count edge, not numeric.
        test_recipe:
          setup:
            - "ACTIVE instrument; study 2×2×2; exactly 7 of 8 trial cells populated."
          setup_api_calls:
            - call: "POST /instruments"
              payload: { asset_tag: "INST-B2", description: "Matrix gauge", nominal_value: 5.0, tolerance_plus: 1.0, tolerance_minus: 1.0, measurement_unit: "mm", calibration_interval_epochs: 100, criticality: "MINOR" }
              as: QualityEngineer
