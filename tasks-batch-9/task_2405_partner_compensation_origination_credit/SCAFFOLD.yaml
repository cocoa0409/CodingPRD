scenario: "2405. Partner Compensation & Origination Credit (law firm compensation committee): compensation system design across lockstep, formula-based and discretionary models, origination credit rules for new clients, expanded matters and cross-selling with sharing conventions, working attorney, billing attorney and responsible attorney credit allocation, hours, realization, collection and client profitability inputs into the evaluation, non-billable contribution weighting for firm management, recruiting and pro bono, self-assessment submission, peer review and committee deliberation with confidentiality, draw schedule, year-end true-up and capital contribution requirements, credit dispute resolution and transition of credits on partner departure"
domain_name: "partner-compensation-origination-credit"
api_prefix: "/comp"

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: graph
  # CreditAllocation is a Partner x Matter junction carrying a role dimension and a
  # half-open validity interval; CreditTransition is a Partner -> Partner edge over a
  # Matter; CreditClaim links Partner (claimant), Partner (disputer), Partner (resolved
  # prior originator) and Matter. No single ownership tree exists — every read path is a
  # traversal over foreign keys, not a nesting of URL segments.

  state_machine_shape: cyclic
  # CreditClaim: DISPUTED --REMAND--> DRAFT (bounded negotiation rounds).
  # SelfAssessment: SUBMITTED --RETURN--> DRAFT (revision loop).
  # CompensationCycle: AWARDS_PUBLISHED --reopen--> DELIBERATION (reconsideration loop).
  # CompensationAward carries two independent dimensions (award_state x payment_state).

  relationship_patterns:
    - one_to_many          # CompensationCycle -> CreditClaim / SelfAssessment / CommitteeBallot / CompensationAward
    - many_to_many         # Partner <-> Matter through CreditAllocation (role-qualified)
    - self_referential     # Partner -> Partner through CreditTransition and CommitteeBallot
    - polymorphic          # ContributionRecord.kind BILLABLE (matter_id required) vs NON_BILLABLE (matter_id null)
    - cross_aggregate      # CompensationAward derives from Matter-side CreditAllocation ledgers

  role_model: segregation_of_duties
  # A partner may not peer-review their own self-assessment, may not cast their own
  # ballot, and a credit arbiter may not adjudicate a claim in which they are claimant,
  # disputer, billing attorney or responsible attorney.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 12 entities / 50 endpoints / 59 error codes / 10 calculation rules (4 carrying
  # variants) / 11 state machines of which 5 are cyclic or parallel-dimensioned.

# Governance thresholds referenced by §1.2 preconditions and §1.4 validations that do
# not belong to any single calculation rule. Every one of them is a pinned literal.
governance_constants:
  MAX_REMANDS: 2                  # CreditClaim DISPUTED --REMAND--> DRAFT loop bound
  MIN_SCORED_PEER_REVIEWS: 2      # scored PeerReview rows required per SelfAssessment
  QUORUM_MIN_CAST_BALLOTS: 2      # CAST ballots required per subject to leave DELIBERATION
  POINTS_CAP_PER_BALLOT: 1000.00  # ceiling on CommitteeBallot.points_proposed
  SERVICE_PERIOD_BUFFER_DAYS: 1   # gap required between NON_BILLABLE service windows
  MAX_REOPENS: 1                  # CompensationCycle AWARDS_PUBLISHED --reopen--> DELIBERATION loop bound

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================

entities:

  - name: CompensationCycle
    parent: null
    common_fields: true
    fields:
      - name: fiscal_year
        type: integer
        source: input
        description: "Fiscal year the cycle compensates; unique across all cycles."
        constraints: "2000..2100; unique -> ERR_DUPLICATE_CYCLE"
      - name: state
        type: enum
        source: system
        description: "Cycle stage gating every child operation."
        default: OPEN_INTAKE
        constraints: "OPEN_INTAKE | SELF_ASSESSMENT | PEER_REVIEW | DELIBERATION | AWARDS_PUBLISHED | TRUE_UP_OPEN | CLOSED"
      - name: distributable_pool_cents
        type: integer
        source: input
        description: "Total cash the firm will distribute for this fiscal year."
        constraints: ">= 0"
      - name: lockstep_unit_cents
        type: integer
        source: input
        description: "Cash value of one lockstep step for this fiscal year."
        constraints: ">= 0"
      - name: discretionary_pool_pct
        type: number
        source: input
        description: "Fraction of distributable_pool_cents reserved for the discretionary pool."
        default: 0.20
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: draw_pct
        type: number
        source: input
        description: "Fraction of target_award_cents paid out as monthly draws before true-up."
        default: 0.80
        constraints: "0.0000..1.0000, 4 decimal places"
      - name: claim_deadline_on
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD, inclusive) on which a CreditClaim may be submitted."
      - name: assessment_deadline_on
        type: string
        source: input
        description: "Last calendar date (YYYY-MM-DD, inclusive) on which a SelfAssessment may be submitted."
      - name: lockstep_reserved_cents
        type: integer
        source: computed
        description: "Waterfall step 1 output: cash reserved for LOCKSTEP partners after any haircut. See calculations.cycle_pool_waterfall."
        default: 0
      - name: discretionary_pool_cents
        type: integer
        source: computed
        description: "Waterfall step 2 output: cash reserved for DISCRETIONARY partners after any haircut."
        default: 0
      - name: formula_pool_cents
        type: integer
        source: computed
        description: "Waterfall step 3 output: residual cash distributed to FORMULA partners."
        default: 0
      - name: haircut_applied_pct
        type: number
        source: computed
        description: "Fraction by which lockstep_reserved_cents was cut to close a waterfall deficit; 0.0000 when no deficit."
        default: 0.0
        constraints: "0.0000..0.3000, 4 decimal places"
      - name: total_formula_score
        type: number
        source: computed
        description: "Sum of formula_score_provisional over FORMULA partners in scope; recomputed on every input change. See calculations.partner_formula_score."
        default: 0.0
      - name: total_committee_points
        type: number
        source: computed
        description: "Sum of committee_points over DISCRETIONARY subject partners in scope. See calculations.committee_points_trimmed_mean."
        default: 0.0
      - name: undistributed_cash_cents
        type: integer
        source: computed
        description: "distributable_pool_cents minus the signed sum of every DrawPayment.amount_cents belonging to awards of this cycle. Conserved quantity for the draw/reopen invariant."
        default: 0
      - name: unsettled_award_count
        type: integer
        source: computed
        description: "Count of CompensationAward rows of this cycle whose payment_state != SETTLED."
        default: 0
      - name: reopen_count
        type: integer
        source: system
        description: "Number of AWARDS_PUBLISHED -> DELIBERATION reopens performed on this cycle."
        default: 0
      - name: confidentiality_locked
        type: boolean
        source: computed
        description: "True once state == CLOSED; ballots become readable to CycleAdmin only."
        default: false

  - name: Partner
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Partner display name."
        constraints: "1..120 chars"
      - name: practice_group
        type: enum
        source: input
        description: "Practice group the partner belongs to."
        constraints: "LITIGATION | CORPORATE | TAX | IP | REGULATORY"
      - name: compensation_model
        type: enum
        source: input
        description: "Which of the three compensation systems governs this partner's award."
        constraints: "LOCKSTEP | FORMULA | DISCRETIONARY"
      - name: lockstep_step
        type: integer
        source: input
        description: "Lockstep rung; multiplies CompensationCycle.lockstep_unit_cents."
        default: 0
        constraints: "0..12; MUST be >= 1 when compensation_model == LOCKSTEP and MUST be 0 otherwise -> ERR_INVALID_REQUEST"
      - name: admission_year
        type: integer
        source: input
        description: "Year the partner was admitted to the partnership."
        constraints: "1950..2100"
      - name: is_committee_member
        type: boolean
        source: input
        description: "True when the partner sits on the compensation committee (may cast ballots, may decide self-assessments)."
        default: false
      - name: is_credit_arbiter
        type: boolean
        source: input
        description: "True when the partner may adjudicate origination credit claims."
        default: false
      - name: evaluation_required
        type: boolean
        source: input
        description: "True when the partner is inside this cycle's evaluation population (self-assessment, peer review, award). Committee-only senior partners are created with false."
        default: true
      - name: status
        type: enum
        source: system
        description: "Partnership status."
        default: ACTIVE
        constraints: "ACTIVE | NOTICE_GIVEN | DEPARTED"
      - name: departure_effective_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) the partner's departure takes effect; null until notice-of-departure."
      - name: opening_capital_cents
        type: integer
        source: input
        description: "Capital account balance carried into the cycle."
        default: 0
        constraints: ">= 0"
      - name: target_capital_cents
        type: integer
        source: input
        description: "Required capital account balance; true-up withholds against any shortfall."
        default: 0
        constraints: ">= 0"
      - name: capital_account_balance_cents
        type: integer
        source: computed
        description: "opening_capital_cents + sum of voluntary contributions + sum of DrawPayment.amount_cents where kind == CAPITAL_WITHHOLDING."
        default: 0
      - name: ytd_draw_paid_cents
        type: integer
        source: computed
        description: "Signed sum of DrawPayment.amount_cents where kind IN {SCHEDULED_DRAW, DRAW_REVERSAL} across this partner's awards in the anchor cycle."
        default: 0
      - name: verified_billable_hours
        type: number
        source: computed
        description: "Sum of ContributionRecord.hours where kind == BILLABLE AND verified == true AND cycle_id == anchor cycle. 2 decimal places."
        default: 0.0
      - name: non_billable_points
        type: number
        source: computed
        description: "Weighted non-billable contribution points. See calculations.non_billable_weighted_points."
        default: 0.0
      - name: credited_collection_provisional_cents
        type: integer
        source: computed
        description: "Sum of CreditAllocation.credited_collection_provisional_cents over this partner's ACTIVE allocations (ACCRUAL basis)."
        default: 0
      - name: credited_collection_final_cents
        type: integer
        source: computed
        description: "Sum of CreditAllocation.credited_collection_final_cents over this partner's ACTIVE allocations (COLLECTED basis)."
        default: 0
      - name: normalized_credit_index_provisional
        type: number
        source: computed
        description: "Firm-normalized credit index on the ACCRUAL basis. See calculations.partner_formula_score step 5."
        default: 0.0
      - name: normalized_credit_index_final
        type: number
        source: computed
        description: "Firm-normalized credit index on the COLLECTED basis."
        default: 0.0
      - name: blended_realization_pct
        type: number
        source: computed
        description: "Credited-collection-weighted mean of Matter.realization_pct over the partner's in-scope ACTIVE allocations. See calculations.partner_formula_score step 6. 4 decimal places, 0.0000 when the partner's credited collections are 0."
        default: 0.0
      - name: weighted_profitability_points
        type: number
        source: computed
        description: "Credited-collection-weighted mean of Matter.profitability_index_fully_loaded over the partner's in-scope ACTIVE allocations. See calculations.partner_formula_score step 8. 4 decimal places, 0.0000 when the partner's credited collections are 0."
        default: 0.0
      - name: formula_score_provisional
        type: number
        source: computed
        description: "Formula-model score on the ACCRUAL basis. See calculations.partner_formula_score variant PROVISIONAL_ACCRUAL."
        default: 0.0
      - name: formula_score_final
        type: number
        source: computed
        description: "Formula-model score on the COLLECTED basis. See calculations.partner_formula_score variant FINAL_COLLECTED."
        default: 0.0
      - name: committee_points
        type: number
        source: computed
        description: "Trimmed mean of CAST ballot points_proposed for this partner in the anchor cycle. See calculations.committee_points_trimmed_mean."
        default: 0.0
      - name: responsible_matter_count
        type: integer
        source: computed
        description: "Count of Matter rows whose state == OPEN and responsible_attorney_id == this partner."
        default: 0

  - name: Matter
    parent: null
    common_fields: true
    fields:
      - name: client_key
        type: string
        source: input
        description: "Stable client identifier shared by every matter of the same client; drives new-client determination and sharing conventions."
        constraints: "1..64 chars, case-sensitive"
      - name: client_display_name
        type: string
        source: input
        description: "Human-readable client name."
      - name: matter_type
        type: enum
        source: input
        description: "Origination category of the engagement."
        constraints: "NEW_CLIENT | EXPANDED_MATTER | CROSS_SELL | EXISTING"
      - name: practice_group
        type: enum
        source: input
        description: "Practice group running the matter."
        constraints: "LITIGATION | CORPORATE | TAX | IP | REGULATORY"
      - name: opened_on
        type: string
        source: input
        description: "Calendar date (YYYY-MM-DD) the matter opened; also the default credit_from of its allocations."
      - name: state
        type: enum
        source: system
        description: "Matter lifecycle."
        default: OPEN
        constraints: "OPEN | CLOSED | WRITTEN_OFF"
      - name: billing_attorney_id
        type: string
        source: input
        description: "FK -> Partner.id; the billing attorney, default holder of the BILLING credit role and fallback originator."
      - name: responsible_attorney_id
        type: string
        source: input
        description: "FK -> Partner.id; the responsible attorney, holder of the RESPONSIBLE credit role."
      - name: prior_responsible_attorney_id
        type: string
        source: system
        description: "FK -> Partner.id; snapshot of responsible_attorney_id taken when a CreditTransition is effectuated, so a void can restore it. Null until then."
      - name: billed_cents
        type: integer
        source: computed
        description: "Accumulated sum of billed_delta_cents posted through POST /comp/matters/{id}/financials."
        default: 0
      - name: collected_cents
        type: integer
        source: computed
        description: "Accumulated sum of collected_delta_cents posted through POST /comp/matters/{id}/financials."
        default: 0
      - name: direct_cost_cents
        type: integer
        source: computed
        description: "Accumulated sum of direct_cost_delta_cents posted through POST /comp/matters/{id}/financials."
        default: 0
      - name: realization_pct
        type: number
        source: computed
        description: "collected_cents / billed_cents, 4 decimal places; 0.0000 when billed_cents == 0. See calculations.matter_realization_and_profitability."
        default: 0.0
      - name: profitability_index_contribution
        type: number
        source: computed
        description: "Contribution-margin profitability variant. See calculations.matter_realization_and_profitability variant CONTRIBUTION_MARGIN."
        default: 0.0
      - name: profitability_index_fully_loaded
        type: number
        source: computed
        description: "Fully-loaded profitability variant including overhead on verified billable hours. See variant FULLY_LOADED."
        default: 0.0
      - name: verified_billable_hours
        type: number
        source: computed
        description: "Sum of ContributionRecord.hours where matter_id == this matter AND kind == BILLABLE AND verified == true. 2 decimal places."
        default: 0.0
      - name: origination_pct_assigned
        type: number
        source: computed
        description: "Sum of credit_pct over CreditAllocation rows on this matter with credit_role == ORIGINATING AND state == ACTIVE. Conserved quantity for the transition/void invariant."
        default: 0.0
      - name: is_first_matter_for_client
        type: boolean
        source: computed
        description: "True when no other Matter shares this client_key with an earlier (opened_on ASC, created_at ASC) position. Gate for claim_basis == NEW_CLIENT."
        default: true
      - name: written_off_reason
        type: string
        source: system
        description: "Reason recorded when state moves to WRITTEN_OFF; null otherwise."

  - name: CreditAllocation
    parent: null
    common_fields: true
    fields:
      - name: matter_id
        type: string
        source: system
        description: "FK -> Matter.id; the matter whose collections this allocation shares."
      - name: partner_id
        type: string
        source: system
        description: "FK -> Partner.id; the credited partner."
      - name: credit_role
        type: enum
        source: system
        description: "Which of the four credit roles this row carries."
        constraints: "ORIGINATING | BILLING | RESPONSIBLE | WORKING"
      - name: credit_pct
        type: number
        source: system
        description: "Share of the role pool, in percent, 2 decimal places."
        constraints: "0.01..100.00"
      - name: source
        type: enum
        source: system
        description: "Which rule produced this row."
        constraints: "CLAIM_ALLOCATED | SHARING_CONVENTION | DEFAULT_BILLING | WORKING_DERIVED | TRANSITION"
      - name: credit_from
        type: string
        source: system
        description: "Inclusive start date (YYYY-MM-DD) of the half-open validity interval [credit_from, credit_through)."
      - name: credit_through
        type: string
        source: system
        description: "Exclusive end date (YYYY-MM-DD) of the half-open validity interval; null means open-ended."
      - name: state
        type: enum
        source: system
        description: "Allocation lifecycle."
        default: ACTIVE
        constraints: "ACTIVE | TRANSFERRED | SUPERSEDED"
      - name: credited_collection_provisional_cents
        type: integer
        source: computed
        description: "This row's share of the matter's ACCRUAL-basis role pool. See calculations.credited_collection_split."
        default: 0
      - name: credited_collection_final_cents
        type: integer
        source: computed
        description: "This row's share of the matter's COLLECTED-basis role pool."
        default: 0

  - name: ContributionRecord
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the contributing partner."
      - name: cycle_id
        type: string
        source: input
        description: "FK -> CompensationCycle.id; the cycle the contribution counts toward."
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id; required when kind == BILLABLE, MUST be omitted when kind == NON_BILLABLE."
      - name: kind
        type: enum
        source: input
        description: "Whether the hours are client-billable or a non-billable firm contribution."
        constraints: "BILLABLE | NON_BILLABLE"
      - name: category
        type: enum
        source: input
        description: "Contribution category; CLIENT_WORK if and only if kind == BILLABLE."
        constraints: "CLIENT_WORK | FIRM_MANAGEMENT | RECRUITING | PRO_BONO | TRAINING"
      - name: hours
        type: number
        source: input
        description: "Hours recorded, 2 decimal places."
        constraints: ">= 0.00"
      - name: standard_rate_cents
        type: integer
        source: input
        description: "Standard hourly rate; MUST be > 0 when kind == BILLABLE, MUST be 0 or omitted otherwise."
        default: 0
      - name: service_period_start
        type: string
        source: input
        description: "Inclusive start date (YYYY-MM-DD) of the closed service interval [service_period_start, service_period_end]."
      - name: service_period_end
        type: string
        source: input
        description: "Inclusive end date (YYYY-MM-DD); MUST be >= service_period_start."
      - name: verified
        type: boolean
        source: system
        description: "True once a CycleAdmin has verified the record; unverified records never enter any calculation."
        default: false
      - name: verified_at
        type: datetime
        source: system
        description: "Logical-clock instant of verification; null while unverified."
      - name: standard_value_cents
        type: integer
        source: computed
        description: "round_half_up(hours * standard_rate_cents) for BILLABLE records; 0 for NON_BILLABLE."
        default: 0

  - name: CreditClaim
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> CompensationCycle.id; the cycle the claim is filed in."
      - name: matter_id
        type: string
        source: input
        description: "FK -> Matter.id; the matter whose origination credit is claimed."
      - name: claimant_partner_id
        type: string
        source: system
        description: "FK -> Partner.id; taken from X-User-ID at creation, never from the body."
      - name: disputing_partner_id
        type: string
        source: system
        description: "FK -> Partner.id; the partner who challenged the claim; null until dispute, cleared on REMAND."
      - name: resolved_prior_originator_id
        type: string
        source: system
        description: "FK -> Partner.id; the prior originator selected by the sharing convention at adjudication; null when the convention gave the claimant 100 percent or the fallback applied to the billing attorney."
      - name: claim_basis
        type: enum
        source: input
        description: "Origination basis asserted by the claimant; selects the sharing convention."
        constraints: "NEW_CLIENT | EXPANDED_MATTER | CROSS_SELL"
      - name: requested_pct
        type: number
        source: input
        description: "Origination percentage requested, 2 decimal places."
        constraints: "0.01..100.00"
      - name: contested_pct
        type: number
        source: system
        description: "Percentage the disputer claims for themselves; null until dispute."
      - name: approved_pct
        type: number
        source: system
        description: "Percentage the arbiter approved for the claimant side; null until adjudication."
      - name: counterparty_pct
        type: number
        source: system
        description: "Percentage the arbiter awarded to the disputer on a SPLIT; null otherwise."
      - name: narrative
        type: string
        source: input
        description: "Claimant's written justification."
      - name: dispute_grounds
        type: string
        source: system
        description: "Disputer's written grounds; null until dispute."
      - name: remand_reason
        type: string
        source: system
        description: "Arbiter's reason recorded on a REMAND decision."
      - name: state
        type: enum
        source: system
        description: "Claim lifecycle; DISPUTED --REMAND--> DRAFT is the negotiation loop."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | DISPUTED | ALLOCATED | REJECTED"
      - name: revision_count
        type: integer
        source: system
        description: "Times the claim re-entered DRAFT from SUBMITTED or DISPUTED."
        default: 0
      - name: remand_count
        type: integer
        source: system
        description: "Times the claim was remanded; a claim with remand_count == MAX_REMANDS may not be remanded again."
        default: 0

  - name: SelfAssessment
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: system
        description: "FK -> Partner.id; taken from X-User-ID at creation, never from the body."
      - name: cycle_id
        type: string
        source: input
        description: "FK -> CompensationCycle.id; the cycle being assessed."
      - name: narrative
        type: string
        source: input
        description: "Partner's self-assessment text."
      - name: claimed_origination_pct_total
        type: number
        source: input
        description: "Origination percentage the partner believes they hold across all matters, 2 decimal places."
        constraints: "0.00..10000.00"
      - name: claimed_non_billable_hours
        type: number
        source: input
        description: "Non-billable hours the partner asserts, 2 decimal places."
        constraints: ">= 0.00"
      - name: state
        type: enum
        source: system
        description: "Assessment lifecycle; SUBMITTED --RETURN--> DRAFT is the revision loop."
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | ACCEPTED"
      - name: revision_count
        type: integer
        source: system
        description: "Times the assessment was returned to DRAFT."
        default: 0
      - name: returned_reason
        type: string
        source: system
        description: "Reason recorded on the most recent RETURN decision."
      - name: submitted_at
        type: datetime
        source: system
        description: "Logical-clock instant of the most recent submit; null while never submitted."
      - name: accepted_at
        type: datetime
        source: system
        description: "Logical-clock instant of acceptance; null until ACCEPTED."
      - name: scored_review_count
        type: integer
        source: computed
        description: "Count of PeerReview rows on this assessment whose state == SCORED."
        default: 0
      - name: mean_peer_score
        type: number
        source: computed
        description: "Mean composite_score over SCORED reviews, 4 decimal places; 0.0000 when scored_review_count == 0."
        default: 0.0

  - name: PeerReview
    parent: null
    common_fields: true
    fields:
      - name: self_assessment_id
        type: string
        source: input
        description: "FK -> SelfAssessment.id; the assessment under review."
      - name: reviewer_partner_id
        type: string
        source: input
        description: "FK -> Partner.id; the assigned reviewer."
      - name: state
        type: enum
        source: system
        description: "Review lifecycle."
        default: ASSIGNED
        constraints: "ASSIGNED | SCORED | RECUSED"
      - name: technical_score
        type: integer
        source: system
        description: "Technical quality score; null unless SCORED."
        constraints: "1..5"
      - name: collaboration_score
        type: integer
        source: system
        description: "Collaboration score; null unless SCORED."
        constraints: "1..5"
      - name: client_service_score
        type: integer
        source: system
        description: "Client service score; null unless SCORED."
        constraints: "1..5"
      - name: composite_score
        type: number
        source: computed
        description: "round_half_up((technical_score * 0.50 + collaboration_score * 0.25 + client_service_score * 0.25), 4); null unless SCORED."
      - name: comment
        type: string
        source: system
        description: "Reviewer's confidential comment; null unless SCORED."
      - name: recusal_reason
        type: string
        source: system
        description: "Reason recorded on RECUSED; null otherwise."

  - name: CommitteeBallot
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: system
        description: "FK -> CompensationCycle.id; the cycle whose deliberation this ballot belongs to."
      - name: subject_partner_id
        type: string
        source: system
        description: "FK -> Partner.id; the partner being voted on."
      - name: committee_member_id
        type: string
        source: system
        description: "FK -> Partner.id; the committee member holding the ballot."
      - name: state
        type: enum
        source: system
        description: "Ballot lifecycle; only CAST ballots count toward quorum and points."
        default: PENDING
        constraints: "PENDING | CAST | ABSTAINED | RECUSED"
      - name: points_proposed
        type: number
        source: system
        description: "Discretionary points proposed for the subject, 2 decimal places; null unless CAST."
        constraints: "0.00..100000.00 at the schema layer (priority 40); a value above POINTS_CAP_PER_BALLOT is a business-constraint violation rejected at priority 120 with ERR_POINTS_CAP_EXCEEDED, not a schema error"
      - name: rationale
        type: string
        source: system
        description: "Confidential deliberation rationale; null unless CAST."
      - name: recusal_reason
        type: string
        source: system
        description: "Reason recorded on RECUSED or ABSTAINED; null otherwise."
      - name: decided_at
        type: datetime
        source: system
        description: "Logical-clock instant the ballot left PENDING; null while PENDING."

  - name: CompensationAward
    parent: null
    common_fields: true
    fields:
      - name: partner_id
        type: string
        source: system
        description: "FK -> Partner.id; the awarded partner."
      - name: cycle_id
        type: string
        source: system
        description: "FK -> CompensationCycle.id; the cycle the award belongs to."
      - name: award_state
        type: enum
        source: system
        description: "Determination dimension, independent of payment_state."
        default: PROPOSED
        constraints: "PROPOSED | PUBLISHED | FINALIZED"
      - name: payment_state
        type: enum
        source: system
        description: "Cash dimension, independent of award_state."
        default: PENDING
        constraints: "PENDING | DRAWING | TRUED_UP | SETTLED"
      - name: basis_model
        type: enum
        source: system
        description: "Snapshot of Partner.compensation_model taken when the award was created."
        constraints: "LOCKSTEP | FORMULA | DISCRETIONARY"
      - name: target_award_cents
        type: integer
        source: computed
        description: "Provisional award. See calculations.partner_award_cents variant PROVISIONAL_DELIBERATION."
        default: 0
      - name: final_award_cents
        type: integer
        source: computed
        description: "Final award. See calculations.partner_award_cents variant FINAL_TRUE_UP; null until true-up."
      - name: draw_schedule_monthly_cents
        type: integer
        source: computed
        description: "round_half_up(target_award_cents * CompensationCycle.draw_pct / 12); set when the award is published."
        default: 0
      - name: draw_paid_cents
        type: integer
        source: computed
        description: "Signed sum of DrawPayment.amount_cents on this award where kind IN {SCHEDULED_DRAW, DRAW_REVERSAL}."
        default: 0
      - name: true_up_delta_cents
        type: integer
        source: computed
        description: "final_award_cents - draw_paid_cents; null until true-up. Negative means a clawback."
      - name: capital_call_cents
        type: integer
        source: computed
        description: "max(0, Partner.target_capital_cents - Partner.capital_account_balance_cents) evaluated at true-up; null until then."
      - name: capital_shortfall_cents
        type: integer
        source: computed
        description: "Capital still owed after the true-up withholding; payment_state can only reach SETTLED when this is 0."
        default: 0
      - name: reconsideration_count
        type: integer
        source: system
        description: "Times this award returned from PUBLISHED to PROPOSED through a cycle reopen."
        default: 0

  - name: DrawPayment
    parent: CompensationAward
    common_fields: false
    fields:
      - name: award_id
        type: string
        source: system
        description: "FK -> CompensationAward.id; the award this cash movement belongs to."
      - name: kind
        type: enum
        source: system
        description: "Cash movement type."
        constraints: "SCHEDULED_DRAW | DRAW_REVERSAL | TRUE_UP | CLAWBACK | CAPITAL_WITHHOLDING"
      - name: period_year
        type: integer
        source: system
        description: "Draw period year; 0 for non-period movements."
      - name: period_month
        type: integer
        source: system
        description: "Draw period month; 1..12 for SCHEDULED_DRAW and DRAW_REVERSAL, 0 for all other kinds."
      - name: amount_cents
        type: integer
        source: system
        description: "Signed amount; negative for DRAW_REVERSAL and CLAWBACK."
      - name: reversed
        type: boolean
        source: system
        description: "True once a DRAW_REVERSAL has cancelled this SCHEDULED_DRAW; reversed draws no longer occupy their period bucket."
        default: false
      - name: memo
        type: string
        source: system
        description: "Human-readable explanation of the movement."

  - name: CreditTransition
    parent: null
    common_fields: true
    fields:
      - name: departing_partner_id
        type: string
        source: system
        description: "FK -> Partner.id; the partner whose origination credit is moving."
      - name: successor_partner_id
        type: string
        source: system
        description: "FK -> Partner.id; the receiving partner; null while PROPOSED."
      - name: matter_id
        type: string
        source: system
        description: "FK -> Matter.id; the matter whose ORIGINATING allocation moves."
      - name: transferred_pct
        type: number
        source: system
        description: "Percentage moved, 2 decimal places; equals the departing partner's ORIGINATING credit_pct at notice time."
      - name: prior_credit_pct
        type: number
        source: system
        description: "Snapshot of the departing partner's ORIGINATING credit_pct taken at notice time so a void can restore it exactly."
      - name: state
        type: enum
        source: system
        description: "Transition lifecycle."
        default: PROPOSED
        constraints: "PROPOSED | EFFECTIVE | VOIDED"
      - name: effective_on
        type: string
        source: system
        description: "Calendar date (YYYY-MM-DD) the transfer takes effect; becomes the departing row's credit_through and the successor row's credit_from."
      - name: void_reason
        type: string
        source: system
        description: "Reason recorded on VOIDED; null otherwise."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================

state_machines:

  - entity: CompensationCycle
    initial_state: OPEN_INTAKE
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN_INTAKE
        to: SELF_ASSESSMENT
        trigger: "POST /comp/cycles/{id}/advance with target_state=SELF_ASSESSMENT"
        actor: CycleAdmin
        preconditions:
          - "count of CreditClaim rows with cycle_id == this cycle AND state IN {SUBMITTED, DISPUTED} == 0, else ERR_UNRESOLVED_CLAIMS"
        side_effects:
          - "sets state = SELF_ASSESSMENT; increments version by 1"
        note: "Claims left in DRAFT are allowed to lapse; only in-flight claims block the stage change."
      - from: SELF_ASSESSMENT
        to: PEER_REVIEW
        trigger: "POST /comp/cycles/{id}/advance with target_state=PEER_REVIEW"
        actor: CycleAdmin
        preconditions:
          - "every Partner with evaluation_required == true AND status IN {ACTIVE, NOTICE_GIVEN} has exactly one SelfAssessment for this cycle whose state IN {SUBMITTED, ACCEPTED}, else ERR_ASSESSMENTS_INCOMPLETE"
        side_effects:
          - "sets state = PEER_REVIEW; increments version by 1"
      - from: PEER_REVIEW
        to: DELIBERATION
        trigger: "POST /comp/cycles/{id}/advance with target_state=DELIBERATION"
        actor: CycleAdmin
        preconditions:
          - "every SelfAssessment for this cycle has state IN {SUBMITTED, ACCEPTED}, else ERR_ASSESSMENTS_INCOMPLETE"
          - "every SelfAssessment for this cycle has scored_review_count >= MIN_SCORED_PEER_REVIEWS, else ERR_PEER_REVIEWS_INCOMPLETE"
          - "note: acceptance is NOT gated here. The committee may enter deliberation with an assessment still merely SUBMITTED; what it cannot do is cast points on that partner, which the ballot's own ERR_ASSESSMENT_NOT_ACCEPTED precondition blocks."
        side_effects:
          - "recomputes Matter.realization_pct, profitability_index_contribution and profitability_index_fully_loaded for every Matter (calculations.matter_realization_and_profitability)"
          - "recomputes CreditAllocation.credited_collection_provisional_cents and credited_collection_final_cents for every ACTIVE allocation (calculations.credited_collection_split)"
          - "recomputes Partner.non_billable_points (calculations.non_billable_weighted_points)"
          - "recomputes Partner.formula_score_provisional and formula_score_final and CompensationCycle.total_formula_score (calculations.partner_formula_score)"
          - "creates one CommitteeBallot in PENDING for every pair (subject Partner with compensation_model == DISCRETIONARY AND evaluation_required == true AND status IN {ACTIVE, NOTICE_GIVEN}) x (Partner with is_committee_member == true AND status == ACTIVE), including the pair where both are the same partner"
          - "creates one CompensationAward in award_state PROPOSED / payment_state PENDING with target_award_cents = 0 and basis_model = Partner.compensation_model for every Partner with evaluation_required == true AND status IN {ACTIVE, NOTICE_GIVEN}"
          - "sets state = DELIBERATION; increments version by 1"
      - from: DELIBERATION
        to: AWARDS_PUBLISHED
        trigger: "POST /comp/cycles/{id}/advance with target_state=AWARDS_PUBLISHED"
        actor: CycleAdmin
        preconditions:
          - "for every subject Partner that has ballots in this cycle, count of its CommitteeBallot rows with state == CAST >= QUORUM_MIN_CAST_BALLOTS, else ERR_QUORUM_NOT_MET"
          - "calculations.cycle_pool_waterfall closes without residual deficit, else ERR_POOL_INSUFFICIENT"
        side_effects:
          - "runs calculations.committee_points_trimmed_mean, setting Partner.committee_points and CompensationCycle.total_committee_points"
          - "runs calculations.cycle_pool_waterfall, setting lockstep_reserved_cents, discretionary_pool_cents, formula_pool_cents and haircut_applied_pct"
          - "runs calculations.partner_award_cents variant PROVISIONAL_DELIBERATION, setting CompensationAward.target_award_cents"
          - "sets CompensationAward.draw_schedule_monthly_cents = round_half_up(target_award_cents * draw_pct / 12) for every award of this cycle"
          - "moves every CompensationAward of this cycle from award_state PROPOSED to PUBLISHED"
          - "recomputes undistributed_cash_cents and unsettled_award_count"
          - "sets state = AWARDS_PUBLISHED; increments version by 1"
      - from: AWARDS_PUBLISHED
        to: DELIBERATION
        trigger: "POST /comp/cycles/{id}/advance with target_state=DELIBERATION (reconsideration reopen)"
        actor: CycleAdmin
        preconditions:
          - "reopen_count < MAX_REOPENS, else ERR_CYCLE_NOT_REOPENABLE"
          - "no CompensationAward of this cycle has payment_state IN {TRUED_UP, SETTLED}, else ERR_CYCLE_NOT_REOPENABLE"
        side_effects:
          - "for every CompensationAward of this cycle: appends one DrawPayment with kind = DRAW_REVERSAL, period_year and period_month copied from each un-reversed SCHEDULED_DRAW and amount_cents = -that draw's amount_cents, processed in (period_year ASC, period_month ASC, created_at ASC) order; marks each reversed SCHEDULED_DRAW reversed = true"
          - "that DrawPayment append itself drives award.draw_paid_cents back to 0 and payment_state back to PENDING"
          - "that award change itself drives Partner.ytd_draw_paid_cents back to its pre-draw value and CompensationCycle.undistributed_cash_cents back to distributable_pool_cents"
          - "moves every CompensationAward of this cycle from award_state PUBLISHED to PROPOSED and increments its reconsideration_count by 1"
          - "increments reopen_count by 1; sets state = DELIBERATION; increments version by 1"
        note: "Compensating action for the draw ledger; conserved quantity is CompensationCycle.undistributed_cash_cents."
      - from: AWARDS_PUBLISHED
        to: TRUE_UP_OPEN
        trigger: "POST /comp/cycles/{id}/advance with target_state=TRUE_UP_OPEN"
        actor: CycleAdmin
        preconditions:
          - "every CompensationAward of this cycle has award_state == PUBLISHED, else ERR_INVALID_CYCLE_TRANSITION"
        side_effects:
          - "recomputes Partner.formula_score_final and Partner.credited_collection_final_cents for every Partner in scope"
          - "sets state = TRUE_UP_OPEN; increments version by 1"
      - from: TRUE_UP_OPEN
        to: CLOSED
        trigger: "POST /comp/cycles/{id}/advance with target_state=CLOSED"
        actor: CycleAdmin
        preconditions:
          - "unsettled_award_count == 0, else ERR_AWARDS_NOT_SETTLED"
        side_effects:
          - "moves every CompensationAward of this cycle from award_state PUBLISHED to FINALIZED"
          - "sets confidentiality_locked = true; sets state = CLOSED; increments version by 1"

  - entity: Partner
    initial_state: ACTIVE
    terminal_states: [DEPARTED]
    transitions:
      - from: ACTIVE
        to: NOTICE_GIVEN
        trigger: "POST /comp/partners/{id}/notice-of-departure"
        actor: CycleAdmin
        preconditions:
          - "status == ACTIVE, else ERR_PARTNER_NOT_DEPARTING"
          - "departure_effective_on >= the logical clock's current date, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets status = NOTICE_GIVEN and departure_effective_on"
          - "creates one CreditTransition in PROPOSED for every Matter with state == OPEN on which this partner holds a CreditAllocation with credit_role == ORIGINATING AND state == ACTIVE, with transferred_pct = prior_credit_pct = that allocation's credit_pct, in (Matter.opened_on ASC, Matter.created_at ASC) order"
          - "increments version by 1"
      - from: NOTICE_GIVEN
        to: DEPARTED
        trigger: "system event: every CreditTransition of this partner reaches state IN {EFFECTIVE, VOIDED}"
        actor: system
        preconditions:
          - "count of CreditTransition rows with departing_partner_id == this partner AND state == PROPOSED == 0"
        side_effects:
          - "sets status = DEPARTED; increments version by 1"
          - "removes the partner from CompensationCycle.total_formula_score and from calculations.cycle_pool_waterfall step 1"

  - entity: Matter
    initial_state: OPEN
    terminal_states: [WRITTEN_OFF]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /comp/matters/{id}/status with target_state=CLOSED"
        actor: CycleAdmin
        preconditions:
          - "state == OPEN, else ERR_MATTER_NOT_OPEN"
        side_effects:
          - "recomputes realization_pct, profitability_index_contribution and profitability_index_fully_loaded"
          - "brings the matter into the FINAL_COLLECTED input set, which itself drives recomputation of credited_collection_final_cents on every ACTIVE allocation of this matter"
          - "that allocation recomputation itself drives Partner.credited_collection_final_cents and Partner.formula_score_final for every credited partner"
          - "decrements Partner.responsible_matter_count for responsible_attorney_id; increments version by 1"
      - from: CLOSED
        to: OPEN
        trigger: "POST /comp/matters/{id}/status with target_state=OPEN (reopen)"
        actor: CycleAdmin
        preconditions:
          - "state == CLOSED, else ERR_MATTER_NOT_OPEN"
          - "no CompensationAward in the anchor cycle has payment_state IN {TRUED_UP, SETTLED}, else ERR_AWARD_NOT_DRAWABLE"
        side_effects:
          - "removes the matter from the FINAL_COLLECTED input set and recomputes credited_collection_final_cents on every ACTIVE allocation of this matter"
          - "increments Partner.responsible_matter_count for responsible_attorney_id; increments version by 1"
        note: "Cyclic: OPEN -> CLOSED -> OPEN."
      - from: OPEN
        to: WRITTEN_OFF
        trigger: "POST /comp/matters/{id}/status with target_state=WRITTEN_OFF"
        actor: CycleAdmin
        preconditions:
          - "state == OPEN, else ERR_MATTER_NOT_OPEN"
          - "written_off_reason is present, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets written_off_reason; sets collected_cents unchanged but excludes the matter from both PROVISIONAL_ACCRUAL and FINAL_COLLECTED input sets"
          - "supersedes every CreditAllocation on this matter (state := SUPERSEDED, credit_through := the logical clock's current date)"
          - "that supersession itself drives Partner.credited_collection_provisional_cents / credited_collection_final_cents recomputation for every affected partner"
          - "decrements Partner.responsible_matter_count for responsible_attorney_id, since the field counts only OPEN matters"
          - "increments version by 1"

  - entity: CreditClaim
    initial_state: DRAFT
    terminal_states: [ALLOCATED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /comp/credit-claims/{id}/submit"
        actor: Partner
        preconditions:
          - "state == DRAFT, else ERR_CLAIM_NOT_IN_DRAFT"
          - "the claim's cycle has state == OPEN_INTAKE, else ERR_CLAIM_WINDOW_CLOSED"
          - "the logical clock's current date <= cycle.claim_deadline_on, else ERR_CLAIM_WINDOW_CLOSED"
        side_effects:
          - "sets state = SUBMITTED; increments version by 1"
      - from: SUBMITTED
        to: DISPUTED
        trigger: "POST /comp/credit-claims/{id}/dispute"
        actor: Partner
        preconditions:
          - "state == SUBMITTED, else ERR_CLAIM_NOT_DISPUTABLE"
          - "X-User-ID != claimant_partner_id, else ERR_DISPUTER_IS_CLAIMANT"
          - "the claim's cycle has state == OPEN_INTAKE, else ERR_CLAIM_WINDOW_CLOSED"
        side_effects:
          - "sets disputing_partner_id = X-User-ID, contested_pct, dispute_grounds and state = DISPUTED; increments version by 1"
      - from: SUBMITTED
        to: ALLOCATED
        trigger: "POST /comp/credit-claims/{id}/adjudicate with decision=ALLOCATE"
        actor: CreditArbiter
        preconditions:
          - "state IN {SUBMITTED, DISPUTED}, else ERR_CLAIM_NOT_ADJUDICABLE"
          - "expected_matter_version == Matter.version, else ERR_STALE_VERSION"
          - "the resulting ORIGINATING interval sum on the matter is <= 100.00, else ERR_CREDIT_INTERVAL_OVERSUBSCRIBED"
        side_effects:
          - "sets approved_pct, resolved_prior_originator_id and state = ALLOCATED"
          - "creates the ORIGINATING CreditAllocation rows dictated by calculations.origination_sharing_convention (the BILLING and RESPONSIBLE rows already exist from matter creation and are untouched)"
          - "that allocation change itself drives Matter.origination_pct_assigned recomputation and increments Matter.version by 1"
          - "that Matter recomputation itself drives CreditAllocation.credited_collection_provisional_cents / credited_collection_final_cents and then Partner.credited_collection_provisional_cents / credited_collection_final_cents for every credited partner"
          - "that Partner change itself drives Partner.formula_score_provisional / formula_score_final and CompensationCycle.total_formula_score recomputation, and CompensationAward.target_award_cents recomputation for awards in award_state PROPOSED"
          - "increments version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /comp/credit-claims/{id}/adjudicate with decision=REJECT"
        actor: CreditArbiter
        preconditions:
          - "state IN {SUBMITTED, DISPUTED}, else ERR_CLAIM_NOT_ADJUDICABLE"
          - "expected_matter_version == Matter.version, else ERR_STALE_VERSION"
        side_effects:
          - "sets approved_pct = 0.00 and state = REJECTED; creates no ORIGINATING allocation"
          - "when the matter has no CreditAllocation with credit_role == ORIGINATING AND state == ACTIVE, creates one for billing_attorney_id at credit_pct 100.00 with source = DEFAULT_BILLING"
          - "increments Matter.version by 1 and version by 1"
      - from: DISPUTED
        to: ALLOCATED
        trigger: "POST /comp/credit-claims/{id}/adjudicate with decision=SPLIT"
        actor: CreditArbiter
        preconditions:
          - "state == DISPUTED, else ERR_CLAIM_NOT_ADJUDICABLE"
          - "expected_matter_version == Matter.version, else ERR_STALE_VERSION"
          - "approved_pct + counterparty_pct <= 100.00 and the resulting ORIGINATING interval sum on the matter is <= 100.00, else ERR_CREDIT_INTERVAL_OVERSUBSCRIBED"
        side_effects:
          - "sets approved_pct, counterparty_pct and state = ALLOCATED"
          - "creates one ORIGINATING CreditAllocation for claimant_partner_id at approved_pct (source = CLAIM_ALLOCATED) and one for disputing_partner_id at counterparty_pct (source = SHARING_CONVENTION)"
          - "that allocation change itself drives Matter.origination_pct_assigned recomputation and increments Matter.version by 1"
          - "that Matter recomputation itself drives credited_collection_* on every ACTIVE allocation of the matter and then on both partners"
          - "that Partner change itself drives formula_score_* and CompensationCycle.total_formula_score recomputation"
          - "increments version by 1"
        note: "Divergent side-effect set versus the ALLOCATE branch: SPLIT never consults the sharing convention and never writes resolved_prior_originator_id."
      - from: DISPUTED
        to: DRAFT
        trigger: "POST /comp/credit-claims/{id}/adjudicate with decision=REMAND"
        actor: CreditArbiter
        preconditions:
          - "state == DISPUTED, else ERR_CLAIM_NOT_ADJUDICABLE"
          - "remand_count < MAX_REMANDS, else ERR_CLAIM_NOT_ADJUDICABLE"
          - "expected_matter_version == Matter.version, else ERR_STALE_VERSION"
        side_effects:
          - "clears disputing_partner_id, contested_pct and dispute_grounds; sets remand_reason"
          - "increments revision_count by 1 and remand_count by 1; sets state = DRAFT"
          - "creates no CreditAllocation; increments Matter.version by 1 and version by 1"
        note: "Cyclic edge closing the negotiation loop DRAFT -> SUBMITTED -> DISPUTED -> DRAFT."

  - entity: CreditAllocation
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: TRANSFERRED
        trigger: "system event: POST /comp/credit-transitions/{id}/effectuate on the owning matter"
        actor: system
        preconditions:
          - "credit_role == ORIGINATING and partner_id == the transition's departing_partner_id"
        side_effects:
          - "sets credit_through = the transition's effective_on and state = TRANSFERRED; increments version by 1"
      - from: TRANSFERRED
        to: ACTIVE
        trigger: "system event: POST /comp/credit-transitions/{id}/void on an EFFECTIVE transition"
        actor: system
        preconditions:
          - "the voiding transition's matter_id and departing_partner_id match this row"
        side_effects:
          - "restores credit_pct = the transition's prior_credit_pct, credit_through = null and state = ACTIVE; increments version by 1"
        note: "Cyclic edge; the compensating half of the origination-percentage invariant."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: matter written off, or the successor row is unwound by a void"
        actor: system
        preconditions:
          - "state == ACTIVE"
        side_effects:
          - "sets credit_through = the logical clock's current date and state = SUPERSEDED; increments version by 1"

  - entity: SelfAssessment
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /comp/self-assessments/{id}/submit"
        actor: Partner
        preconditions:
          - "state == DRAFT, else ERR_ASSESSMENT_NOT_MUTABLE"
          - "X-User-ID == partner_id, else ERR_NOT_RESOURCE_OWNER"
          - "the assessment's cycle has state == SELF_ASSESSMENT, else ERR_ASSESSMENT_WINDOW_CLOSED"
          - "the logical clock's current date <= cycle.assessment_deadline_on, else ERR_ASSESSMENT_WINDOW_CLOSED"
        side_effects:
          - "sets submitted_at = the logical clock's current instant and state = SUBMITTED; increments version by 1"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /comp/self-assessments/{id}/review-decision with decision=RETURN"
        actor: CommitteeMember
        preconditions:
          - "state == SUBMITTED, else ERR_ASSESSMENT_NOT_REVIEWABLE"
          - "X-User-ID != partner_id, else ERR_SELF_REVIEW_FORBIDDEN"
          - "the assessment's cycle has state IN {SELF_ASSESSMENT, PEER_REVIEW}, else ERR_REVIEW_WINDOW_CLOSED"
          - "reason is present, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets returned_reason, increments revision_count by 1, sets state = DRAFT"
          - "resets every PeerReview on this assessment whose state == SCORED back to ASSIGNED, clearing technical_score, collaboration_score, client_service_score, composite_score and comment"
          - "that PeerReview reset itself drives scored_review_count and mean_peer_score recomputation on this assessment"
          - "increments version by 1"
        note: "Cyclic revision loop; the peer-review reset is what makes the loop expensive."
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /comp/self-assessments/{id}/review-decision with decision=ACCEPT"
        actor: CommitteeMember
        preconditions:
          - "state == SUBMITTED, else ERR_ASSESSMENT_NOT_REVIEWABLE"
          - "X-User-ID != partner_id, else ERR_SELF_REVIEW_FORBIDDEN"
          - "the assessment's cycle has state IN {SELF_ASSESSMENT, PEER_REVIEW}, else ERR_REVIEW_WINDOW_CLOSED"
          - "scored_review_count >= MIN_SCORED_PEER_REVIEWS, else ERR_PEER_REVIEWS_INCOMPLETE"
        side_effects:
          - "sets accepted_at = the logical clock's current instant and state = ACCEPTED; increments version by 1"
        note: "Divergent side-effect set versus the RETURN branch: ACCEPT preserves peer-review scores, RETURN destroys them."

  - entity: PeerReview
    initial_state: ASSIGNED
    terminal_states: [RECUSED]
    transitions:
      - from: ASSIGNED
        to: SCORED
        trigger: "POST /comp/peer-reviews/{id}/decide with outcome=SCORE"
        actor: Partner
        preconditions:
          - "state == ASSIGNED, else ERR_REVIEW_ALREADY_DECIDED"
          - "X-User-ID == reviewer_partner_id, else ERR_NOT_RESOURCE_OWNER"
          - "reviewer_partner_id != the assessment's partner_id, else ERR_SELF_REVIEW_FORBIDDEN"
          - "the assessment's cycle has state IN {SELF_ASSESSMENT, PEER_REVIEW}, else ERR_REVIEW_WINDOW_CLOSED"
          - "technical_score, collaboration_score and client_service_score are all present and in 1..5, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets the three scores, comment, composite_score and state = SCORED"
          - "that state change itself drives SelfAssessment.scored_review_count and mean_peer_score recomputation"
          - "increments version by 1"
      - from: ASSIGNED
        to: RECUSED
        trigger: "POST /comp/peer-reviews/{id}/decide with outcome=RECUSE"
        actor: Partner
        preconditions:
          - "state == ASSIGNED, else ERR_REVIEW_ALREADY_DECIDED"
          - "X-User-ID == reviewer_partner_id, else ERR_NOT_RESOURCE_OWNER"
          - "recusal_reason is present, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets recusal_reason and state = RECUSED; leaves scored_review_count unchanged; increments version by 1"

  - entity: CommitteeBallot
    initial_state: PENDING
    terminal_states: [CAST, ABSTAINED, RECUSED]
    transitions:
      - from: PENDING
        to: CAST
        trigger: "POST /comp/ballots/{id}/cast with action=CAST"
        actor: CommitteeMember
        preconditions:
          - "state == PENDING, else ERR_BALLOT_ALREADY_DECIDED"
          - "X-User-ID == committee_member_id, else ERR_NOT_RESOURCE_OWNER"
          - "the ballot's cycle has state == DELIBERATION, else ERR_INVALID_CYCLE_TRANSITION"
          - "expected_cycle_version == CompensationCycle.version, else ERR_STALE_VERSION"
          - "committee_member_id != subject_partner_id, else ERR_SELF_VOTE_FORBIDDEN"
          - "the subject partner's SelfAssessment for this cycle has state == ACCEPTED, else ERR_ASSESSMENT_NOT_ACCEPTED"
          - "points_proposed <= POINTS_CAP_PER_BALLOT, else ERR_POINTS_CAP_EXCEEDED"
        side_effects:
          - "sets points_proposed, rationale, decided_at and state = CAST"
          - "that state change itself drives Partner.committee_points recomputation for the subject (calculations.committee_points_trimmed_mean)"
          - "that Partner change itself drives CompensationCycle.total_committee_points recomputation and increments CompensationCycle.version by 1"
          - "increments version by 1"
      - from: PENDING
        to: ABSTAINED
        trigger: "POST /comp/ballots/{id}/cast with action=ABSTAIN"
        actor: CommitteeMember
        preconditions:
          - "state == PENDING, else ERR_BALLOT_ALREADY_DECIDED"
          - "X-User-ID == committee_member_id, else ERR_NOT_RESOURCE_OWNER"
          - "the ballot's cycle has state == DELIBERATION, else ERR_INVALID_CYCLE_TRANSITION"
          - "expected_cycle_version == CompensationCycle.version, else ERR_STALE_VERSION"
        side_effects:
          - "sets recusal_reason, decided_at and state = ABSTAINED; contributes nothing to committee_points or quorum; increments CompensationCycle.version by 1 and version by 1"
      - from: PENDING
        to: RECUSED
        trigger: "POST /comp/ballots/{id}/cast with action=RECUSE"
        actor: CommitteeMember
        preconditions:
          - "state == PENDING, else ERR_BALLOT_ALREADY_DECIDED"
          - "X-User-ID == committee_member_id, else ERR_NOT_RESOURCE_OWNER"
          - "the ballot's cycle has state == DELIBERATION, else ERR_INVALID_CYCLE_TRANSITION"
          - "expected_cycle_version == CompensationCycle.version, else ERR_STALE_VERSION"
          - "recusal_reason is present, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets recusal_reason, decided_at and state = RECUSED; contributes nothing to committee_points or quorum; increments CompensationCycle.version by 1 and version by 1"
        note: "The self-ballot created for a committee member who is also a subject can only leave PENDING through this edge."

  - entity: CompensationAward
    initial_state: PROPOSED
    terminal_states: [FINALIZED]
    transitions:
      - from: PROPOSED
        to: PUBLISHED
        trigger: "system event: CompensationCycle DELIBERATION -> AWARDS_PUBLISHED"
        actor: system
        preconditions:
          - "award_state == PROPOSED"
        side_effects:
          - "sets target_award_cents (calculations.partner_award_cents variant PROVISIONAL_DELIBERATION) and draw_schedule_monthly_cents; increments version by 1"
      - from: PUBLISHED
        to: PROPOSED
        trigger: "system event: CompensationCycle AWARDS_PUBLISHED -> DELIBERATION (reopen)"
        actor: system
        preconditions:
          - "payment_state NOT IN {TRUED_UP, SETTLED}"
        side_effects:
          - "increments reconsideration_count by 1; resets payment_state to PENDING; increments version by 1"
        note: "Cyclic edge on the award_state dimension."
      - from: PUBLISHED
        to: FINALIZED
        trigger: "system event: CompensationCycle TRUE_UP_OPEN -> CLOSED"
        actor: system
        preconditions:
          - "payment_state == SETTLED"
        side_effects:
          - "sets award_state = FINALIZED; increments version by 1"

  - entity: CompensationAward.payment_state
    initial_state: PENDING
    terminal_states: [SETTLED]
    transitions:
      - from: PENDING
        to: DRAWING
        trigger: "POST /comp/awards/{id}/draw-run"
        actor: CycleAdmin
        preconditions:
          - "award_state == PUBLISHED, else ERR_AWARD_NOT_DRAWABLE"
          - "the award's cycle has state IN {AWARDS_PUBLISHED, TRUE_UP_OPEN}, else ERR_AWARD_NOT_DRAWABLE"
          - "no un-reversed DrawPayment with kind == SCHEDULED_DRAW exists on this award for (period_year, period_month), else ERR_DRAW_PERIOD_ALREADY_PAID"
        side_effects:
          - "appends one DrawPayment with kind = SCHEDULED_DRAW, amount_cents = draw_schedule_monthly_cents"
          - "that append itself drives draw_paid_cents recomputation and payment_state := DRAWING"
          - "that award change itself drives Partner.ytd_draw_paid_cents and CompensationCycle.undistributed_cash_cents recomputation"
          - "increments version by 1"
      - from: DRAWING
        to: DRAWING
        trigger: "POST /comp/awards/{id}/draw-run for a further period"
        actor: CycleAdmin
        preconditions:
          - "same preconditions as PENDING -> DRAWING"
        side_effects:
          - "same side effects as PENDING -> DRAWING; payment_state stays DRAWING"
      - from: DRAWING
        to: TRUED_UP
        trigger: "POST /comp/awards/{id}/true-up"
        actor: CycleAdmin
        preconditions:
          - "payment_state == DRAWING, else ERR_AWARD_NOT_TRUE_UP_READY"
          - "the award's cycle has state == TRUE_UP_OPEN, else ERR_AWARD_NOT_TRUE_UP_READY"
        side_effects:
          - "runs calculations.partner_award_cents variant FINAL_TRUE_UP, setting final_award_cents and true_up_delta_cents"
          - "runs calculations.true_up_settlement, appending the CAPITAL_WITHHOLDING, TRUE_UP and CLAWBACK DrawPayment rows in that pinned order and setting capital_call_cents and capital_shortfall_cents"
          - "that DrawPayment append itself drives Partner.capital_account_balance_cents recomputation"
          - "that Partner change itself drives capital_shortfall_cents, which selects payment_state := SETTLED when 0 and TRUED_UP otherwise"
          - "that payment_state change itself drives CompensationCycle.unsettled_award_count and undistributed_cash_cents recomputation"
          - "increments version by 1"
      - from: TRUED_UP
        to: SETTLED
        trigger: "system event: POST /comp/partners/{id}/capital-contribution closes the shortfall"
        actor: system
        preconditions:
          - "capital_shortfall_cents becomes 0 after the contribution"
        side_effects:
          - "sets capital_shortfall_cents = 0 and payment_state = SETTLED"
          - "that change itself drives CompensationCycle.unsettled_award_count recomputation, which is the gate on TRUE_UP_OPEN -> CLOSED"
          - "increments version by 1"
      - from: DRAWING
        to: SETTLED
        trigger: "POST /comp/awards/{id}/true-up when the capital shortfall closes inside the true-up"
        actor: CycleAdmin
        preconditions:
          - "same preconditions as DRAWING -> TRUED_UP; capital_shortfall_cents evaluates to 0"
        side_effects:
          - "same side effects as DRAWING -> TRUED_UP, reaching payment_state = SETTLED directly"
        note: "The two payment dimensions evolve independently: an award can be PUBLISHED/PENDING, PUBLISHED/DRAWING, PROPOSED/PENDING (after reopen) or PUBLISHED/SETTLED."

  - entity: CreditTransition
    initial_state: PROPOSED
    terminal_states: [VOIDED]
    transitions:
      - from: PROPOSED
        to: EFFECTIVE
        trigger: "POST /comp/credit-transitions/{id}/effectuate"
        actor: CycleAdmin
        preconditions:
          - "state == PROPOSED, else ERR_TRANSITION_NOT_PENDING"
          - "the departing partner has status == NOTICE_GIVEN, else ERR_PARTNER_NOT_DEPARTING"
          - "the successor partner has status == ACTIVE AND id != departing_partner_id, else ERR_SUCCESSOR_NOT_ELIGIBLE"
          - "expected_matter_version == Matter.version, else ERR_STALE_VERSION"
          - "effective_on > the departing ORIGINATING allocation's credit_from, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets successor_partner_id, effective_on and state = EFFECTIVE"
          - "moves the departing partner's ORIGINATING CreditAllocation to TRANSFERRED with credit_through = effective_on, and creates a new ORIGINATING CreditAllocation for the successor at credit_pct = transferred_pct with credit_from = effective_on and source = TRANSITION"
          - "that allocation change itself sets Matter.prior_responsible_attorney_id = responsible_attorney_id and, when the departing partner was the responsible attorney, sets Matter.responsible_attorney_id = successor_partner_id, supersedes the departing partner's RESPONSIBLE allocation and opens a RESPONSIBLE allocation for the successor at credit_pct 100.00 with credit_from = effective_on; it then recomputes Matter.origination_pct_assigned and increments Matter.version by 1"
          - "that Matter change itself recomputes credited_collection_provisional_cents / credited_collection_final_cents on every ACTIVE allocation of the matter, then Partner.credited_collection_* and Partner.responsible_matter_count for the departing and successor partners"
          - "that Partner change itself recomputes Partner.formula_score_provisional / formula_score_final, CompensationCycle.total_formula_score and, for awards in award_state PROPOSED, CompensationAward.target_award_cents"
          - "increments version by 1"
      - from: PROPOSED
        to: VOIDED
        trigger: "POST /comp/credit-transitions/{id}/void"
        actor: CycleAdmin
        preconditions:
          - "state IN {PROPOSED, EFFECTIVE}, else ERR_TRANSITION_NOT_VOIDABLE"
          - "expected_matter_version == Matter.version, else ERR_STALE_VERSION"
          - "void_reason is present, else ERR_INVALID_REQUEST"
        side_effects:
          - "sets void_reason and state = VOIDED; touches no allocation because none was moved; increments Matter.version by 1 and version by 1"
      - from: EFFECTIVE
        to: VOIDED
        trigger: "POST /comp/credit-transitions/{id}/void"
        actor: CycleAdmin
        preconditions:
          - "state IN {PROPOSED, EFFECTIVE}, else ERR_TRANSITION_NOT_VOIDABLE"
          - "expected_matter_version == Matter.version, else ERR_STALE_VERSION"
          - "void_reason is present, else ERR_INVALID_REQUEST"
        side_effects:
          - "supersedes the successor's ORIGINATING TRANSITION CreditAllocation and, where one was opened, the successor's RESPONSIBLE allocation (state := SUPERSEDED, credit_through := effective_on), and restores the departing partner's TRANSFERRED ORIGINATING row and superseded RESPONSIBLE row to ACTIVE with credit_pct = prior_credit_pct and credit_through = null"
          - "that allocation change itself restores Matter.responsible_attorney_id = prior_responsible_attorney_id, clears prior_responsible_attorney_id, recomputes Matter.origination_pct_assigned and increments Matter.version by 1"
          - "that Matter change itself recomputes credited_collection_* on every ACTIVE allocation and then on both partners, restoring Matter.origination_pct_assigned to its pre-effectuate value"
          - "that Partner change itself recomputes formula_score_* and CompensationCycle.total_formula_score"
          - "sets void_reason and state = VOIDED; increments version by 1"
        note: "Compensating action for the credit transfer; conserved quantity is Matter.origination_pct_assigned."

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================

concurrency_rules:
  - rule_id: matter-financials-stale-matter
    parent_entity: Matter
    write_endpoint: "POST /comp/matters/{id}/financials"
    occ_field: "expected_matter_version"
    description: |
      Posting billing deltas against a Matter whose version has advanced since the
      client last observed it is rejected. Financial deltas are additive, so a
      repeated post of the same body is legitimate product behaviour on its own
      terms; the stale-version check is what distinguishes an intended second
      posting from a re-send against an out-of-date view of the matter ledger.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-adjudicate-stale-matter
    parent_entity: Matter
    write_endpoint: "POST /comp/credit-claims/{id}/adjudicate"
    occ_field: "expected_matter_version"
    description: |
      Adjudicating an origination credit claim writes ORIGINATING CreditAllocation
      rows against the matter and consumes part of its 100.00 percent capacity.
      An arbiter acting on a matter whose version has advanced since they read it
      is working from a stale picture of the remaining capacity, so the write is
      rejected rather than allowed to oversubscribe the matter.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: ballot-cast-stale-cycle
    parent_entity: CompensationCycle
    write_endpoint: "POST /comp/ballots/{id}/cast"
    occ_field: "expected_cycle_version"
    description: |
      Casting a ballot mutates the cycle's aggregate deliberation state
      (total_committee_points). A committee member whose view of the cycle version
      is out of date is deliberating against a superseded point pool, so the cast
      is rejected; each accepted cast advances CompensationCycle.version so the
      next holder of a stale view fails deterministically.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: capital-contribution-stale-partner
    parent_entity: Partner
    write_endpoint: "POST /comp/partners/{id}/capital-contribution"
    occ_field: "expected_partner_version"
    description: |
      Capital contributions are additive, so a second contribution of the same
      amount legitimately succeeds under the product semantics. The stale-version
      check is therefore the only thing that separates an intended second
      contribution from a re-send against an out-of-date capital account balance.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transition-effectuate-stale-matter
    parent_entity: Matter
    write_endpoint: "POST /comp/credit-transitions/{id}/effectuate"
    occ_field: "expected_matter_version"
    description: |
      Effectuating a credit transition rewrites the matter's ORIGINATING
      allocations and its responsible attorney. Because several transitions can
      legitimately land on the same matter, an administrator acting on a stale
      matter version is rejected rather than allowed to overwrite an allocation
      layout they never observed.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: transition-void-stale-matter
    parent_entity: Matter
    write_endpoint: "POST /comp/credit-transitions/{id}/void"
    occ_field: "expected_matter_version"
    description: |
      Voiding an effective transition restores the departing partner's allocation
      and the matter's prior responsible attorney. Voiding against a stale matter
      version would restore a snapshot that no longer describes the matter, so the
      write is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================

calculations:

  - name: anchor_cycle_selection
    algorithm_type: projection
    description: |
      Every cycle-scoped computed field on Partner (verified_billable_hours,
      non_billable_points, credited_collection_*, normalized_credit_index_*,
      blended_realization_pct, weighted_profitability_points, formula_score_*,
      committee_points) is evaluated against exactly one CompensationCycle, called
      the anchor cycle. The anchor cycle is the CompensationCycle whose state !=
      CLOSED and whose fiscal_year is greatest. fiscal_year is unique across
      cycles, so the comparison never ties; should two rows nevertheless compare
      equal, the earlier created_at ASC wins. When no such cycle exists (no cycle
      created yet, or every cycle CLOSED), every cycle-scoped computed field on
      Partner evaluates to 0, 0.0000 or 0.00 as its declared type requires.
    inputs:
      - "CompensationCycle.state"
      - "CompensationCycle.fiscal_year"
      - "CompensationCycle.created_at"
    input_set_filter: "CompensationCycle rows with state != CLOSED"
    formula: |
      candidates = [c for c in cycles if c.state != "CLOSED"]
      if not candidates:
          anchor = None            # all cycle-scoped Partner computed fields := zero
      else:
          anchor = max(candidates, key=lambda c: (c.fiscal_year, -epoch(c.created_at)))
    output_fields:
      - "(selector consumed by every other cycle-scoped calculation)"
    precision: "n/a"
    edge_cases:
      - "No cycle exists -> anchor is None; Partner.formula_score_provisional stays 0.0000."
      - "Every cycle CLOSED -> anchor is None even though historic data exists."
      - "A newly created cycle for a later fiscal_year immediately becomes the anchor and re-bases every Partner computed field."

  - name: matter_realization_and_profitability
    algorithm_type: aggregation
    description: |
      Per-Matter realization and two profitability indices. Realization is the
      collected fraction of what was billed. Profitability is computed under two
      variants that differ in whether attorney overhead is charged against the
      matter, and both are stored on every matter so downstream scoring can pick
      one without recomputation.
    inputs:
      - "Matter.billed_cents"
      - "Matter.collected_cents"
      - "Matter.direct_cost_cents"
      - "Matter.verified_billable_hours"
    input_set_filter: "all Matter rows regardless of state; the state filter is applied by the consuming calculation, not here"
    constants:
      OVERHEAD_RATE_CENTS_PER_HOUR: 9000
    formula: |
      realization_pct = round_half_up(collected_cents / billed_cents, 4) if billed_cents > 0 else 0.0000
      # variant CONTRIBUTION_MARGIN
      profitability_index_contribution =
          round_half_up((collected_cents - direct_cost_cents) / collected_cents, 4) if collected_cents > 0 else 0.0000
      # variant FULLY_LOADED
      overhead_cents = OVERHEAD_RATE_CENTS_PER_HOUR * verified_billable_hours
      profitability_index_fully_loaded =
          round_half_up((collected_cents - direct_cost_cents - overhead_cents) / collected_cents, 4) if collected_cents > 0 else 0.0000
    variants:
      - variant_id: CONTRIBUTION_MARGIN
        applies_when: "always; stored in Matter.profitability_index_contribution"
        difference: "charges only direct_cost_cents against collections; ignores attorney overhead entirely"
      - variant_id: FULLY_LOADED
        applies_when: "always; stored in Matter.profitability_index_fully_loaded and consumed by partner_formula_score"
        difference: "additionally charges OVERHEAD_RATE_CENTS_PER_HOUR * verified_billable_hours, so a labour-heavy matter can score negative under FULLY_LOADED while scoring positive under CONTRIBUTION_MARGIN"
    output_fields:
      - "Matter.realization_pct"
      - "Matter.profitability_index_contribution"
      - "Matter.profitability_index_fully_loaded"
    precision: "4 decimal places, round_half_up, applied once at the end of each expression"
    edge_cases:
      - "billed_cents == 0 -> realization_pct 0.0000 (never a division error)."
      - "collected_cents == 0 -> both profitability indices 0.0000 even when direct_cost_cents > 0."
      - "Both indices may be negative; they are not floored at zero."
      - "verified_billable_hours == 0 makes the two variants numerically identical."

  - name: credited_collection_split
    algorithm_type: waterfall_allocation
    description: |
      Splits a matter's credited collection basis across the four credit roles and
      then within each role across that role's ACTIVE allocations. Rounding is
      nested: the role pools are rounded first and their residual is assigned, then
      each role pool is split across allocations and that pool's residual is
      assigned. The two rounding layers are deliberately independent, so the sum of
      the per-allocation results equals the basis exactly.
    inputs:
      - "the collection basis C_cents supplied by the consuming variant of partner_formula_score"
      - "CreditAllocation.credit_role"
      - "CreditAllocation.credit_pct"
      - "CreditAllocation.state"
      - "CreditAllocation.created_at"
    input_set_filter: "CreditAllocation rows on the matter with state == ACTIVE; TRANSFERRED and SUPERSEDED rows contribute nothing"
    constants:
      ROLE_WEIGHT_ORIGINATING: 0.40
      ROLE_WEIGHT_BILLING: 0.20
      ROLE_WEIGHT_RESPONSIBLE: 0.15
      ROLE_WEIGHT_WORKING: 0.25
    formula: |
      # layer 1: role pools
      raw = {}
      for role in ["ORIGINATING", "BILLING", "RESPONSIBLE", "WORKING"]:
          raw[role] = round_half_up(C_cents * ROLE_WEIGHT[role])          # integer cents
      # a role with no ACTIVE allocation folds its whole pool into ORIGINATING
      for role in ["BILLING", "RESPONSIBLE", "WORKING"]:
          if not active_allocations_with_role(role):
              raw["ORIGINATING"] += raw[role]
              raw[role] = 0
      # layer-1 residual from rounding goes to ORIGINATING
      raw["ORIGINATING"] += C_cents - sum(raw.values())

      # layer 2: within each role
      for role, pool in raw.items():
          rows = sorted(active_allocations_with_role(role), key=lambda a: epoch(a.created_at))
          if not rows or pool == 0:
              continue
          for a in rows:
              a.credited = round_half_up(pool * a.credit_pct / 100)
          residual = pool - sum(a.credited for a in rows)
          winner = max(rows, key=lambda a: (a.credit_pct, -epoch(a.created_at)))
          winner.credited += residual
    output_fields:
      - "CreditAllocation.credited_collection_provisional_cents"
      - "CreditAllocation.credited_collection_final_cents"
    precision: "integer cents; round_half_up at each of the two layers; no floating-point cents ever persist"
    rounding_note: |
      Rounding is applied per role pool and then per allocation, never once over the
      product of the two percentages. Collapsing the layers (round_half_up(C *
      weight * pct / 100) in a single step) produces a different total whenever both
      layers round in the same direction, and the sum then fails to equal C_cents.
    edge_cases:
      - "No ACTIVE allocation of any role -> the whole basis is unallocated and every credited_collection_* stays 0."
      - "A matter with an ORIGINATING allocation only -> ORIGINATING receives the entire basis through the fold-in rule (0.40 + 0.20 + 0.15 + 0.25)."
      - "Two allocations in the same role with equal credit_pct -> the layer-2 residual goes to the earlier created_at."
      - "credit_pct values inside a role summing to less than 100.00 leave the shortfall in that role's residual, which is then handed to the largest-pct row of the same role."

  - name: origination_sharing_convention
    algorithm_type: threshold
    description: |
      Determines how an approved origination claim is shared between the claimant
      and the partner who already holds origination credit for the client. The
      claimant's share depends on the claim basis: a genuinely new client is not
      shared at all, an expanded matter for an existing client is shared 60/40, and
      a cross-sell into another practice group is shared 50/50. The complement is
      never stored on the claim; it is computed by subtraction and written to the
      resolved prior originator's allocation.
    inputs:
      - "CreditClaim.claim_basis"
      - "CreditClaim.approved_pct"
      - "Matter.client_key"
      - "Matter.opened_on"
      - "CreditAllocation.credit_pct on sibling matters of the same client"
    input_set_filter: "Matter rows with the same client_key and state != WRITTEN_OFF, excluding the claim's own matter"
    constants:
      SHARE_NEW_CLIENT_PCT: 100.00
      SHARE_EXPANDED_MATTER_PCT: 60.00
      SHARE_CROSS_SELL_PCT: 50.00
    formula: |
      share = SHARE[claim.claim_basis]                       # 100.00 / 60.00 / 50.00
      claimant_pct    = round_half_up(claim.approved_pct * share / 100, 2)
      counterparty_pct = round_half_up(claim.approved_pct - claimant_pct, 2)
      # resolved prior originator selection
      siblings = [m for m in matters
                  if m.client_key == matter.client_key
                  and m.id != matter.id
                  and m.state != "WRITTEN_OFF"]
      earliest = min(siblings, key=lambda m: (m.opened_on, epoch(m.created_at))) if siblings else None
      if earliest is None:
          resolved_prior_originator_id = None                # nothing to share with
          claimant_pct, counterparty_pct = claim.approved_pct, 0.00
      else:
          rows = [a for a in allocations_of(earliest)
                  if a.credit_role == "ORIGINATING" and a.state == "ACTIVE"]
          if rows:
              resolved_prior_originator_id = max(
                  rows, key=lambda a: (a.credit_pct, -epoch(a.created_at))).partner_id
          else:
              resolved_prior_originator_id = earliest.billing_attorney_id
    output_fields:
      - "CreditClaim.approved_pct"
      - "CreditClaim.counterparty_pct"
      - "CreditClaim.resolved_prior_originator_id"
      - "CreditAllocation rows created with credit_role == ORIGINATING"
    precision: "2 decimal places, round_half_up; the counterparty share is obtained by subtraction so the two shares always re-sum to approved_pct"
    edge_cases:
      - "claim_basis == NEW_CLIENT with sibling matters present -> ERR_CLIENT_NOT_NEW is raised before this calculation runs."
      - "claim_basis == EXPANDED_MATTER with no sibling matter -> no counterparty exists, claimant takes the full approved_pct and resolved_prior_originator_id is null."
      - "The earliest sibling matter having no ACTIVE ORIGINATING allocation -> its billing_attorney_id becomes the counterparty."
      - "The resolved prior originator being the claimant -> the counterparty allocation is not created and the claimant keeps the full approved_pct."
      - "approved_pct == 51.00 under CROSS_SELL -> claimant 25.50, counterparty 25.50; under EXPANDED_MATTER -> claimant 30.60, counterparty 20.40."

  - name: non_billable_weighted_points
    algorithm_type: threshold
    description: |
      Converts a partner's verified non-billable hours into points that feed the
      formula score. Hours are weighted by category, each category is capped, the
      aggregate above a firm-wide threshold is discounted, a pro bono floor
      shortfall attracts a penalty multiplier, and the partner's compensation model
      applies a final multiplier. All of it collapses into a single rounding at the
      very end.
    inputs:
      - "ContributionRecord.hours"
      - "ContributionRecord.category"
      - "ContributionRecord.verified"
      - "ContributionRecord.kind"
      - "Partner.compensation_model"
    input_set_filter: "ContributionRecord rows with cycle_id == anchor cycle, kind == NON_BILLABLE and verified == true; unverified rows contribute nothing"
    constants:
      CATEGORY_WEIGHT_FIRM_MANAGEMENT: 1.50
      CATEGORY_WEIGHT_RECRUITING: 1.00
      CATEGORY_WEIGHT_PRO_BONO: 1.25
      CATEGORY_WEIGHT_TRAINING: 0.75
      CATEGORY_HOUR_CAP_FIRM_MANAGEMENT: 300
      CATEGORY_HOUR_CAP_RECRUITING: 150
      CATEGORY_HOUR_CAP_PRO_BONO: 200
      CATEGORY_HOUR_CAP_TRAINING: 100
      DIMINISHING_THRESHOLD_HOURS: 400
      DIMINISHING_FACTOR: 0.50
      PRO_BONO_FLOOR_HOURS: 50
      PRO_BONO_SHORTFALL_PENALTY: 0.90
      MODEL_MULTIPLIER_LOCKSTEP: 0.60
      MODEL_MULTIPLIER_FORMULA: 1.00
      MODEL_MULTIPLIER_DISCRETIONARY: 1.20
    formula: |
      # step 1 - per-category capped hours
      capped = {}
      for cat in ["FIRM_MANAGEMENT", "RECRUITING", "PRO_BONO", "TRAINING"]:
          capped[cat] = min(sum_hours(cat), CATEGORY_HOUR_CAP[cat])
      # step 2 - weighted base over capped hours (no rounding yet)
      base = sum(capped[cat] * CATEGORY_WEIGHT[cat] for cat in capped)
      capped_total = sum(capped.values())
      # step 3 - diminishing return on capped hours above the threshold
      if capped_total > DIMINISHING_THRESHOLD_HOURS:
          excess_hours = capped_total - DIMINISHING_THRESHOLD_HOURS
          average_weight = base / capped_total
          base = base - excess_hours * average_weight * (1 - DIMINISHING_FACTOR)
      # step 4 - pro bono floor penalty on the whole base
      if capped["PRO_BONO"] < PRO_BONO_FLOOR_HOURS:
          base = base * PRO_BONO_SHORTFALL_PENALTY
      # step 5 - compensation-model multiplier, then the single rounding
      non_billable_points = round_half_up(base * MODEL_MULTIPLIER[partner.compensation_model], 2)
    output_fields:
      - "Partner.non_billable_points"
    precision: "2 decimal places, round_half_up, applied exactly once after step 5; steps 1-4 carry full precision"
    rounding_note: |
      The average weight in step 3 is deliberately computed from the *capped*
      weighted base, not from the raw hours, so raising an uncapped category changes
      the discount applied to every other category. Rounding after each step instead
      of once at the end drifts by up to 0.04 points on a four-category partner.
    edge_cases:
      - "No verified NON_BILLABLE record -> base 0, pro bono floor is breached, 0.00 * 0.90 * multiplier = 0.00."
      - "capped_total exactly 400 -> no diminishing discount (strict > comparison)."
      - "capped[PRO_BONO] exactly 50 -> no penalty (strict < comparison)."
      - "Raw category hours above the cap are silently discarded, so the threshold at step 3 is evaluated on capped hours and can never be reached by one category alone (300 < 400)."
      - "Unverified records are excluded, so verifying a record changes the discount tier for the whole partner."

  - name: partner_formula_score
    algorithm_type: weighted_scoring
    description: |
      The formula-model score, evaluated in a pinned eight-step order because step
      4's normalization factor depends on a firm-wide total that itself depends on
      every partner's step-3 result. Reordering the steps changes every partner's
      score. Two variants differ in which collection basis is used and which matter
      states are in scope, so a partner has both a provisional and a final score at
      all times.
    inputs:
      - "CreditAllocation.credited_collection_provisional_cents / credited_collection_final_cents"
      - "ContributionRecord.hours where kind == BILLABLE and verified == true"
      - "Partner.non_billable_points"
      - "Matter.realization_pct"
      - "Matter.profitability_index_fully_loaded"
      - "Matter.state"
    input_set_filter: "variant-dependent; see variants below. Partner rows with status IN {ACTIVE, NOTICE_GIVEN} and compensation_model == FORMULA contribute to CompensationCycle.total_formula_score; DEPARTED partners are dropped from the total but keep their own stored score."
    constants:
      W_CREDITED_COLLECTION: 0.45
      W_WORKING_HOURS: 0.20
      W_NON_BILLABLE: 0.15
      W_PROFITABILITY: 0.20
      FIRM_NORMALIZATION_TARGET_CENTS: 1000000000
      HOURS_NORMALIZATION_DIVISOR: 1800
      REALIZATION_TIER_1_MIN: 0.9500
      REALIZATION_TIER_1_MULTIPLIER: 1.10
      REALIZATION_TIER_2_MIN: 0.8500
      REALIZATION_TIER_2_MULTIPLIER: 1.00
      REALIZATION_TIER_3_MIN: 0.7500
      REALIZATION_TIER_3_MULTIPLIER: 0.90
      REALIZATION_TIER_4_MULTIPLIER: 0.75
    formula: |
      # step 1 - per-allocation credited collections (calculations.credited_collection_split
      #          run on every in-scope matter with the variant's basis)
      # step 2 - partner sum
      partner_credited = sum(a.credited for a in active_allocations_of(partner) if a.matter in scope)
      # step 3 - firm total across in-scope partners
      firm_total = sum(partner_credited(p) for p in in_scope_partners)
      # step 4 - normalization factor (six decimal places, computed once per cycle)
      normalization_factor = round_half_up(FIRM_NORMALIZATION_TARGET_CENTS / firm_total, 6) if firm_total > 0 else 1.000000
      # step 5 - normalized credit index
      normalized_credit_index = round_half_up(partner_credited * normalization_factor / FIRM_NORMALIZATION_TARGET_CENTS, 6)
      # step 6 - blended realization, weighted by the partner's credited collections per matter
      blended_realization_pct = round_half_up(
          sum(a.credited * a.matter.realization_pct for a in scope_allocations) / partner_credited, 4
      ) if partner_credited > 0 else 0.0000
      # step 7 - realization tier multiplier
      if   blended_realization_pct >= REALIZATION_TIER_1_MIN: tier_multiplier = REALIZATION_TIER_1_MULTIPLIER
      elif blended_realization_pct >= REALIZATION_TIER_2_MIN: tier_multiplier = REALIZATION_TIER_2_MULTIPLIER
      elif blended_realization_pct >= REALIZATION_TIER_3_MIN: tier_multiplier = REALIZATION_TIER_3_MULTIPLIER
      else:                                                  tier_multiplier = REALIZATION_TIER_4_MULTIPLIER
      # step 8 - weighted sum, tiered, single rounding
      weighted_profitability_points = round_half_up(
          sum(a.credited * a.matter.profitability_index_fully_loaded for a in scope_allocations) / partner_credited, 4
      ) if partner_credited > 0 else 0.0000
      hours_component = verified_billable_hours / HOURS_NORMALIZATION_DIVISOR
      raw = (W_CREDITED_COLLECTION * normalized_credit_index * 100
             + W_WORKING_HOURS * hours_component * 100
             + W_NON_BILLABLE * non_billable_points / 100
             + W_PROFITABILITY * weighted_profitability_points * 100)
      formula_score = round_half_up(raw * tier_multiplier, 4)
    variants:
      - variant_id: PROVISIONAL_ACCRUAL
        applies_when: "stored in Partner.formula_score_provisional and consumed while the cycle state is in {OPEN_INTAKE, SELF_ASSESSMENT, PEER_REVIEW, DELIBERATION, AWARDS_PUBLISHED}"
        difference: "basis per matter is round_half_up(billed_cents * realization_pct) and the matter scope is state IN {OPEN, CLOSED}, so work in progress is accrued at its historic realization rate"
      - variant_id: FINAL_COLLECTED
        applies_when: "stored in Partner.formula_score_final and consumed from cycle state TRUE_UP_OPEN onward"
        difference: "basis per matter is collected_cents and the matter scope is state == CLOSED only, so an open matter contributes nothing however much has been collected on it"
    output_fields:
      - "Partner.normalized_credit_index_provisional"
      - "Partner.normalized_credit_index_final"
      - "Partner.blended_realization_pct"
      - "Partner.weighted_profitability_points"
      - "Partner.formula_score_provisional"
      - "Partner.formula_score_final"
      - "CompensationCycle.total_formula_score"
    precision: "normalization_factor and normalized_credit_index to 6 decimal places; blended_realization_pct and weighted_profitability_points to 4; formula_score to 4, rounded once after the tier multiplier"
    rounding_note: |
      The tier multiplier is applied to the *unrounded* weighted sum and the result
      is rounded once. Rounding the weighted sum first and then multiplying can
      move the fourth decimal place. Note also that step 4 rounds the normalization
      factor to six places before step 5 consumes it, so the factor is a pinned
      constant for the whole firm within one evaluation.
    edge_cases:
      - "firm_total == 0 -> normalization_factor is 1.000000, every normalized_credit_index is 0.000000 and the score reduces to the hours and non-billable components under tier 4 (0.75)."
      - "partner_credited == 0 with hours present -> blended_realization_pct 0.0000 selects tier 4."
      - "blended_realization_pct exactly 0.9500 -> tier 1 (>= comparison)."
      - "blended_realization_pct exactly 0.8500 -> tier 2, not tier 1."
      - "A single matter moving OPEN -> CLOSED changes the FINAL_COLLECTED scope but not the PROVISIONAL_ACCRUAL scope, so the two variants diverge asymmetrically."
      - "A negative profitability_index_fully_loaded pulls the score down and is not floored."

  - name: committee_points_trimmed_mean
    algorithm_type: aggregation
    description: |
      A discretionary partner's committee points are the trimmed mean of the points
      proposed on their CAST ballots. With three or more casts the single highest
      and single lowest proposal are discarded before averaging, which is what stops
      one outlier ballot from carrying a partner. ABSTAINED and RECUSED ballots are
      not counted at all, neither in the mean nor in the quorum test.
    inputs:
      - "CommitteeBallot.points_proposed"
      - "CommitteeBallot.state"
      - "CommitteeBallot.created_at"
    input_set_filter: "CommitteeBallot rows with cycle_id == anchor cycle and subject_partner_id == the partner and state == CAST"
    formula: |
      rows = sorted(cast_ballots, key=lambda b: (b.points_proposed, epoch(b.created_at)))
      if len(rows) == 0:
          committee_points = 0.00
      elif len(rows) >= 3:
          kept = rows[1:-1]
          committee_points = round_half_up(sum(b.points_proposed for b in kept) / len(kept), 2)
      else:
          committee_points = round_half_up(sum(b.points_proposed for b in rows) / len(rows), 2)
      total_committee_points = sum(committee_points(p) for p in discretionary_subjects)
    output_fields:
      - "Partner.committee_points"
      - "CompensationCycle.total_committee_points"
    precision: "2 decimal places, round_half_up"
    edge_cases:
      - "0 CAST ballots -> 0.00, and the partner's discretionary award is 0."
      - "Exactly 2 CAST ballots -> plain mean, no trimming (the trim threshold is 3)."
      - "Exactly 3 CAST ballots -> only the middle value survives."
      - "All CAST ballots proposing the same points -> the trimmed mean equals that value."
      - "Ties at the extremes are broken by created_at ASC in the sort, so which duplicate is discarded is deterministic and the result is unaffected."

  - name: cycle_pool_waterfall
    algorithm_type: waterfall_allocation
    description: |
      Fills the three compensation pools in a fixed order out of the distributable
      cash. Lockstep obligations are computed first because they are contractual,
      the discretionary pool is taken next as a declared fraction of the whole, and
      the formula pool is whatever remains. When the first two exceed the
      distributable cash the lockstep bucket is cut first and the discretionary
      bucket second, each down to a floor, and a deficit that survives both cuts is
      an error rather than a negative pool.
    inputs:
      - "CompensationCycle.distributable_pool_cents"
      - "CompensationCycle.lockstep_unit_cents"
      - "CompensationCycle.discretionary_pool_pct"
      - "Partner.lockstep_step"
      - "Partner.compensation_model"
      - "Partner.status"
    input_set_filter: "Partner rows with status IN {ACTIVE, NOTICE_GIVEN} and evaluation_required == true; DEPARTED partners are excluded from the lockstep obligation"
    constants:
      HAIRCUT_FLOOR_PCT: 0.70
    formula: |
      # step 1 - lockstep obligation
      lockstep_gross = sum(p.lockstep_step * cycle.lockstep_unit_cents
                           for p in lockstep_partners)
      # step 2 - discretionary reservation off the top of the whole pool
      discretionary_gross = round_half_up(cycle.distributable_pool_cents * cycle.discretionary_pool_pct)
      # step 3 - formula residual
      residual = cycle.distributable_pool_cents - lockstep_gross - discretionary_gross
      haircut_applied_pct = 0.0000
      if residual >= 0:
          lockstep_reserved_cents  = lockstep_gross
          discretionary_pool_cents = discretionary_gross
          formula_pool_cents       = residual
      else:
          # cut lockstep first, down to HAIRCUT_FLOOR_PCT of its gross
          deficit = -residual
          max_lockstep_cut = round_half_up(lockstep_gross * (1 - HAIRCUT_FLOOR_PCT))
          lockstep_cut = min(deficit, max_lockstep_cut)
          haircut_applied_pct = round_half_up(lockstep_cut / lockstep_gross, 4) if lockstep_gross > 0 else 0.0000
          lockstep_reserved_cents = lockstep_gross - lockstep_cut
          deficit -= lockstep_cut
          # then cut discretionary, down to the same floor
          max_disc_cut = round_half_up(discretionary_gross * (1 - HAIRCUT_FLOOR_PCT))
          disc_cut = min(deficit, max_disc_cut)
          discretionary_pool_cents = discretionary_gross - disc_cut
          deficit -= disc_cut
          if deficit > 0:
              raise ERR_POOL_INSUFFICIENT
          formula_pool_cents = 0
    output_fields:
      - "CompensationCycle.lockstep_reserved_cents"
      - "CompensationCycle.discretionary_pool_cents"
      - "CompensationCycle.formula_pool_cents"
      - "CompensationCycle.haircut_applied_pct"
    precision: "integer cents; round_half_up on the discretionary reservation and on each haircut ceiling; haircut_applied_pct to 4 decimal places"
    edge_cases:
      - "residual exactly 0 -> formula_pool_cents 0, no haircut, and every FORMULA partner's award is 0."
      - "No LOCKSTEP partner -> lockstep_gross 0, haircut_applied_pct stays 0.0000 even in deficit, and the whole deficit falls on the discretionary bucket."
      - "A deficit exactly equal to max_lockstep_cut -> lockstep absorbs it all, discretionary is untouched and haircut_applied_pct is 0.3000."
      - "A deficit larger than both ceilings combined -> ERR_POOL_INSUFFICIENT and the whole cycle advance is rejected, leaving all four fields at their pre-call values."
      - "discretionary_pool_pct == 0.0000 -> discretionary_gross 0 and the discretionary cut ceiling is 0."

  - name: partner_award_cents
    algorithm_type: tiered_pricing
    description: |
      Turns a partner's pool share into cash. The three compensation models draw on
      three different pools with three different share formulas, and the draw
      schedule is a fraction of the target spread over twelve months. Evaluated
      twice per cycle under two variants, once provisionally at publication and once
      finally at true-up.
    inputs:
      - "Partner.compensation_model"
      - "Partner.lockstep_step"
      - "Partner.formula_score_provisional / formula_score_final"
      - "Partner.committee_points"
      - "CompensationCycle.lockstep_unit_cents"
      - "CompensationCycle.haircut_applied_pct"
      - "CompensationCycle.formula_pool_cents"
      - "CompensationCycle.discretionary_pool_cents"
      - "CompensationCycle.total_formula_score"
      - "CompensationCycle.total_committee_points"
      - "CompensationCycle.draw_pct"
    input_set_filter: "CompensationAward rows of the cycle whose award_state IN {PROPOSED, PUBLISHED}; FINALIZED awards are frozen"
    formula: |
      if basis_model == "LOCKSTEP":
          award = round_half_up(partner.lockstep_step * cycle.lockstep_unit_cents
                                * (1 - cycle.haircut_applied_pct))
      elif basis_model == "FORMULA":
          award = round_half_up(cycle.formula_pool_cents * score / cycle.total_formula_score) \
                  if cycle.total_formula_score > 0 else 0
      else:  # DISCRETIONARY
          award = round_half_up(cycle.discretionary_pool_cents * partner.committee_points
                               / cycle.total_committee_points) \
                  if cycle.total_committee_points > 0 else 0
      draw_schedule_monthly_cents = round_half_up(award * cycle.draw_pct / 12)
    variants:
      - variant_id: PROVISIONAL_DELIBERATION
        applies_when: "CompensationCycle DELIBERATION -> AWARDS_PUBLISHED; writes CompensationAward.target_award_cents"
        difference: "uses Partner.formula_score_provisional and the pre-true-up committee_points; drives draw_schedule_monthly_cents"
      - variant_id: FINAL_TRUE_UP
        applies_when: "POST /comp/awards/{id}/true-up; writes CompensationAward.final_award_cents"
        difference: "uses Partner.formula_score_final (FINAL_COLLECTED basis, CLOSED matters only), so final_award_cents is normally below target_award_cents for a partner whose matters are still open; the delta becomes true_up_delta_cents"
    output_fields:
      - "CompensationAward.target_award_cents"
      - "CompensationAward.final_award_cents"
      - "CompensationAward.draw_schedule_monthly_cents"
    precision: "integer cents, round_half_up; the monthly draw is rounded independently of the award, so twelve monthly draws need not sum to award * draw_pct"
    edge_cases:
      - "total_formula_score == 0 -> every FORMULA award is 0 and formula_pool_cents stays entirely undistributed."
      - "total_committee_points == 0 -> every DISCRETIONARY award is 0."
      - "haircut_applied_pct == 0.3000 -> a LOCKSTEP award is exactly 70 percent of its contractual value."
      - "draw_pct == 0.0000 -> draw_schedule_monthly_cents is 0 and the whole award lands as a true-up."
      - "A partner whose matters are all still OPEN has formula_score_final 0.0000, so final_award_cents is 0 and the entire draw becomes a clawback."

  - name: true_up_settlement
    algorithm_type: chronological
    description: |
      Settles an award at year end. The true-up delta is the final award net of what
      has already been drawn; a positive delta is money owed to the partner and a
      negative delta is money owed back to the firm. Any outstanding capital
      requirement is satisfied out of a positive delta before the partner is paid,
      and the ledger rows are appended in a pinned order so the running capital
      balance seen by each row is well defined.
    inputs:
      - "CompensationAward.final_award_cents"
      - "CompensationAward.draw_paid_cents"
      - "Partner.target_capital_cents"
      - "Partner.capital_account_balance_cents"
    input_set_filter: "the single CompensationAward being trued up"
    formula: |
      true_up_delta_cents = final_award_cents - draw_paid_cents
      capital_call_cents  = max(0, partner.target_capital_cents
                                  - partner.capital_account_balance_cents)
      capital_withheld    = min(capital_call_cents, max(0, true_up_delta_cents))
      # pinned append order
      if capital_withheld > 0:
          append DrawPayment(kind="CAPITAL_WITHHOLDING", amount_cents=capital_withheld)
          partner.capital_account_balance_cents += capital_withheld
      if true_up_delta_cents - capital_withheld > 0:
          append DrawPayment(kind="TRUE_UP",  amount_cents=true_up_delta_cents - capital_withheld)
      elif true_up_delta_cents < 0:
          append DrawPayment(kind="CLAWBACK", amount_cents=true_up_delta_cents)   # negative
      capital_shortfall_cents = max(0, partner.target_capital_cents
                                       - partner.capital_account_balance_cents)
      payment_state = "SETTLED" if capital_shortfall_cents == 0 else "TRUED_UP"
    output_fields:
      - "CompensationAward.true_up_delta_cents"
      - "CompensationAward.capital_call_cents"
      - "CompensationAward.capital_shortfall_cents"
      - "CompensationAward.payment_state"
      - "DrawPayment rows of kind CAPITAL_WITHHOLDING, TRUE_UP and CLAWBACK"
      - "Partner.capital_account_balance_cents"
    precision: "integer cents throughout; no rounding is needed because every input is already integer cents"
    rounding_note: |
      The append order is load-bearing rather than the arithmetic: CAPITAL_WITHHOLDING
      must be appended and applied to the capital balance before capital_shortfall_cents
      is evaluated, otherwise a partner whose delta fully funds their capital call would
      still be left TRUED_UP instead of SETTLED.
    edge_cases:
      - "true_up_delta_cents exactly 0 -> no TRUE_UP and no CLAWBACK row is appended; only a CAPITAL_WITHHOLDING row can appear, and it cannot (withheld = min(call, 0) = 0)."
      - "A negative delta with an outstanding capital call -> capital_withheld is 0, a CLAWBACK row is appended and payment_state is TRUED_UP, leaving the shortfall to a later capital contribution."
      - "capital_call_cents larger than the positive delta -> the whole delta is withheld, no TRUE_UP row is appended and payment_state is TRUED_UP."
      - "target_capital_cents already met -> capital_call_cents 0, capital_shortfall_cents 0 and the award reaches SETTLED inside the true-up."
      - "draw_paid_cents already exceeding final_award_cents -> a negative CLAWBACK row, which is what drives CompensationCycle.undistributed_cash_cents back up."

# =============================================================================
# 1.4 Validation Rules (ordered; lower priority number wins)
# =============================================================================

validations:

  - priority: 10
    category: auth
    rule: "X-User-ID and X-User-Role headers must both be present and non-empty on every endpoint under /comp and on POST /_clock/set_current_utc."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 20
    category: rbac
    rule: "X-User-Role must be one of Partner, CommitteeMember, CreditArbiter, CycleAdmin, AuditObserver and must appear in the endpoint's allowed_roles."
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 30
    category: auth
    rule: "For the entity-backed roles Partner, CommitteeMember and CreditArbiter, X-User-ID must resolve to a Partner row with status != DEPARTED; additionally CommitteeMember requires that row's is_committee_member == true and CreditArbiter requires is_credit_arbiter == true."
    error_id: ERR_ACTOR_NOT_A_PARTNER
    http_status: 403
    applies_to: "all endpoints whose allowed_roles include Partner, CommitteeMember or CreditArbiter"

  - priority: 40
    category: schema
    rule: "Request body must contain every required field with the declared type, enum member and numeric range; unknown fields are ignored; query parameters limit (1..100) and offset (>= 0) must parse as integers."
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all endpoints with a request body or query parameters"

  - priority: 50
    category: existence
    rule: "Path parameters are resolved left to right; the first unresolvable id yields that entity's not-found error."
    error_id: "ERR_CYCLE_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_MATTER_NOT_FOUND | ERR_ALLOCATION_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_RECORD_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_BALLOT_NOT_FOUND | ERR_AWARD_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_TRANSITION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 55
    category: existence
    rule: "Foreign keys supplied in the request body must resolve, checked in the field order declared on the endpoint's input."
    error_id: "ERR_CYCLE_NOT_FOUND | ERR_PARTNER_NOT_FOUND | ERR_MATTER_NOT_FOUND | ERR_ASSESSMENT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /comp/matters, POST /comp/contribution-records, POST /comp/credit-claims, POST /comp/self-assessments, POST /comp/peer-reviews, POST /comp/credit-transitions/{id}/effectuate"

  - priority: 60
    category: ownership
    rule: "A Partner acting on a SelfAssessment, PeerReview, CreditClaim or CommitteeBallot must be that row's owner: X-User-ID == partner_id for SelfAssessment, == reviewer_partner_id for PeerReview, == claimant_partner_id for CreditClaim submit, == committee_member_id for CommitteeBallot cast. Partners creating a ContributionRecord may only create their own."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /comp/self-assessments/{id}/submit, POST /comp/peer-reviews/{id}/decide, POST /comp/credit-claims/{id}/submit, POST /comp/ballots/{id}/cast, POST /comp/contribution-records"

  - priority: 65
    category: business_safety
    rule: "Ballot reads are confidential: a CommitteeMember may read only ballots where committee_member_id == X-User-ID; once the ballot's cycle has confidentiality_locked == true, only CycleAdmin may read any ballot. AuditObserver never reads ballots (enforced at priority 20 by omission from allowed_roles)."
    error_id: ERR_BALLOT_CONFIDENTIAL
    http_status: 403
    applies_to: "GET /comp/ballots/{id}, GET /comp/ballots"

  - priority: 70
    category: state
    rule: "The acted-on row must be in a state from which the requested transition exists. See §1.2 for the per-entity transition tables."
    error_id: "ERR_INVALID_CYCLE_TRANSITION | ERR_CLAIM_NOT_IN_DRAFT | ERR_CLAIM_NOT_DISPUTABLE | ERR_CLAIM_NOT_ADJUDICABLE | ERR_ASSESSMENT_NOT_MUTABLE | ERR_ASSESSMENT_NOT_REVIEWABLE | ERR_REVIEW_ALREADY_DECIDED | ERR_BALLOT_ALREADY_DECIDED | ERR_MATTER_NOT_OPEN | ERR_AWARD_NOT_DRAWABLE | ERR_AWARD_NOT_TRUE_UP_READY | ERR_TRANSITION_NOT_PENDING | ERR_TRANSITION_NOT_VOIDABLE"
    http_status: 409
    applies_to: "every action endpoint"

  - priority: 75
    category: cross_entity_state
    rule: "The acted-on row's related entities must be in a permitting state: casting a ballot requires the subject's SelfAssessment ACCEPTED (ERR_ASSESSMENT_NOT_ACCEPTED); effectuating or voiding a CreditTransition requires the departing Partner status == NOTICE_GIVEN (ERR_PARTNER_NOT_DEPARTING) and the successor Partner status == ACTIVE (ERR_SUCCESSOR_NOT_ELIGIBLE); posting a BILLABLE ContributionRecord requires the referenced Matter state == OPEN (ERR_MATTER_NOT_OPEN); running a draw requires award_state == PUBLISHED (ERR_AWARD_NOT_DRAWABLE)."
    error_id: "ERR_ASSESSMENT_NOT_ACCEPTED | ERR_PARTNER_NOT_DEPARTING | ERR_SUCCESSOR_NOT_ELIGIBLE | ERR_MATTER_NOT_OPEN | ERR_AWARD_NOT_DRAWABLE"
    http_status: 409
    applies_to: "POST /comp/ballots/{id}/cast, POST /comp/credit-transitions/{id}/effectuate, POST /comp/credit-transitions/{id}/void, POST /comp/contribution-records, POST /comp/awards/{id}/draw-run"

  - priority: 80
    category: concurrency
    rule: "When the endpoint declares an expected_<parent>_version field, it must equal the current parent version. See §1.2.1."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /comp/matters/{id}/financials, POST /comp/credit-claims/{id}/adjudicate, POST /comp/ballots/{id}/cast, POST /comp/partners/{id}/capital-contribution, POST /comp/credit-transitions/{id}/effectuate, POST /comp/credit-transitions/{id}/void"

  - priority: 90
    category: business_temporal
    rule: "Deadline and stage windows: claim submit and dispute require cycle state OPEN_INTAKE and current date <= claim_deadline_on (ERR_CLAIM_WINDOW_CLOSED); assessment submit requires cycle state SELF_ASSESSMENT and current date <= assessment_deadline_on (ERR_ASSESSMENT_WINDOW_CLOSED); peer-review scoring and assessment review decisions require cycle state IN {SELF_ASSESSMENT, PEER_REVIEW} (ERR_REVIEW_WINDOW_CLOSED)."
    error_id: "ERR_CLAIM_WINDOW_CLOSED | ERR_ASSESSMENT_WINDOW_CLOSED | ERR_REVIEW_WINDOW_CLOSED"
    http_status: 409
    applies_to: "POST /comp/credit-claims/{id}/submit, POST /comp/credit-claims/{id}/dispute, POST /comp/self-assessments/{id}/submit, POST /comp/self-assessments/{id}/review-decision, POST /comp/peer-reviews/{id}/decide"

  - priority: 100
    category: business_safety
    rule: "Segregation of duties: a committee member may not cast their own ballot (ERR_SELF_VOTE_FORBIDDEN); a partner may not peer-review or accept/return their own self-assessment (ERR_SELF_REVIEW_FORBIDDEN); a credit arbiter may not adjudicate a claim in which they are the claimant, the disputer, or the matter's billing or responsible attorney (ERR_ARBITER_CONFLICT); a partner may not dispute their own claim (ERR_DISPUTER_IS_CLAIMANT)."
    error_id: "ERR_SELF_VOTE_FORBIDDEN | ERR_SELF_REVIEW_FORBIDDEN | ERR_ARBITER_CONFLICT | ERR_DISPUTER_IS_CLAIMANT"
    http_status: 403
    applies_to: "POST /comp/ballots/{id}/cast, POST /comp/peer-reviews, POST /comp/peer-reviews/{id}/decide, POST /comp/self-assessments/{id}/review-decision, POST /comp/credit-claims/{id}/adjudicate, POST /comp/credit-claims/{id}/dispute"

  - priority: 110
    category: business_referential
    rule: "Claim basis must match the client's history: claim_basis == NEW_CLIENT requires that no other Matter with the same client_key and state != WRITTEN_OFF exists (ERR_CLIENT_NOT_NEW); claim_basis IN {EXPANDED_MATTER, CROSS_SELL} requires that at least one such sibling matter does exist (also ERR_CLIENT_NOT_NEW). A CROSS_SELL claim additionally requires the matter's practice_group to differ from the earliest sibling matter's practice_group."
    error_id: ERR_CLIENT_NOT_NEW
    http_status: 409
    applies_to: "POST /comp/credit-claims/{id}/submit"

  - priority: 120
    category: business_constraint
    rule: "Interval, uniqueness and cap constraints: the sum of credit_pct over ORIGINATING CreditAllocation rows whose half-open [credit_from, credit_through) windows overlap must not exceed 100.00 on a Matter (ERR_CREDIT_INTERVAL_OVERSUBSCRIBED); an un-reversed SCHEDULED_DRAW must not already exist for a (period_year, period_month) bucket on a CompensationAward (ERR_DRAW_PERIOD_ALREADY_PAID); NON_BILLABLE ContributionRecord closed [service_period_start, service_period_end] windows for the same (partner_id, category) must be separated by more than SERVICE_PERIOD_BUFFER_DAYS (ERR_SERVICE_PERIOD_BUFFER_VIOLATION); points_proposed must not exceed POINTS_CAP_PER_BALLOT (ERR_POINTS_CAP_EXCEEDED); (fiscal_year) is unique on CompensationCycle (ERR_DUPLICATE_CYCLE); (cycle_id, matter_id, claimant_partner_id) is unique on CreditClaim (ERR_DUPLICATE_CLAIM); (cycle_id, partner_id) is unique on SelfAssessment (ERR_DUPLICATE_ASSESSMENT); (self_assessment_id, reviewer_partner_id) is unique on PeerReview (ERR_DUPLICATE_REVIEW_ASSIGNMENT)."
    error_id: "ERR_CREDIT_INTERVAL_OVERSUBSCRIBED | ERR_DRAW_PERIOD_ALREADY_PAID | ERR_SERVICE_PERIOD_BUFFER_VIOLATION | ERR_POINTS_CAP_EXCEEDED | ERR_DUPLICATE_CYCLE | ERR_DUPLICATE_CLAIM | ERR_DUPLICATE_ASSESSMENT | ERR_DUPLICATE_REVIEW_ASSIGNMENT"
    http_status: 409
    applies_to: "POST /comp/cycles, POST /comp/credit-claims, POST /comp/credit-claims/{id}/adjudicate, POST /comp/self-assessments, POST /comp/peer-reviews, POST /comp/contribution-records, POST /comp/ballots/{id}/cast, POST /comp/awards/{id}/draw-run"

  - priority: 130
    category: business_constraint
    rule: "Aggregate completeness gates on cycle advancement: no CreditClaim of the cycle may remain in SUBMITTED or DISPUTED when leaving OPEN_INTAKE (ERR_UNRESOLVED_CLAIMS); every required SelfAssessment must exist and be SUBMITTED or ACCEPTED when leaving SELF_ASSESSMENT, and every SelfAssessment of the cycle must still be SUBMITTED or ACCEPTED (never DRAFT) when leaving PEER_REVIEW (ERR_ASSESSMENTS_INCOMPLETE); every SelfAssessment must carry at least MIN_SCORED_PEER_REVIEWS scored reviews when leaving PEER_REVIEW (ERR_PEER_REVIEWS_INCOMPLETE); every ballot subject must have at least QUORUM_MIN_CAST_BALLOTS CAST ballots when leaving DELIBERATION (ERR_QUORUM_NOT_MET). Acceptance itself is enforced per subject at ballot-cast time, not here."
    error_id: "ERR_UNRESOLVED_CLAIMS | ERR_ASSESSMENTS_INCOMPLETE | ERR_PEER_REVIEWS_INCOMPLETE | ERR_QUORUM_NOT_MET"
    http_status: 409
    applies_to: "POST /comp/cycles/{id}/advance"

  - priority: 140
    category: business_fiscal
    rule: "Cash and capital closure: the waterfall must close without residual deficit when leaving DELIBERATION (ERR_POOL_INSUFFICIENT); no award may be TRUED_UP or SETTLED when reopening AWARDS_PUBLISHED -> DELIBERATION (ERR_CYCLE_NOT_REOPENABLE); unsettled_award_count must be 0 when leaving TRUE_UP_OPEN (ERR_AWARDS_NOT_SETTLED)."
    error_id: "ERR_POOL_INSUFFICIENT | ERR_CYCLE_NOT_REOPENABLE | ERR_AWARDS_NOT_SETTLED"
    http_status: 409
    applies_to: "POST /comp/cycles/{id}/advance"

validation_priority_conflicts:
  - conflict_id: state-beats-fiscal-on-close
    higher: "priority 70 ERR_INVALID_CYCLE_TRANSITION (state)"
    lower: "priority 140 ERR_AWARDS_NOT_SETTLED (business_fiscal)"
    endpoint: "POST /comp/cycles/{id}/advance"
    scenario: "A cycle still in AWARDS_PUBLISHED with unsettled awards is asked to advance straight to CLOSED. Both the missing transition edge and the unsettled awards are violated; the state error wins."
  - conflict_id: safety-beats-constraint-on-ballot
    higher: "priority 100 ERR_SELF_VOTE_FORBIDDEN (business_safety)"
    lower: "priority 120 ERR_POINTS_CAP_EXCEEDED (business_constraint)"
    endpoint: "POST /comp/ballots/{id}/cast"
    scenario: "A committee member casts their own ballot with points_proposed above POINTS_CAP_PER_BALLOT. Both are violated; the self-vote error wins."
  - conflict_id: temporal-beats-referential-on-claim-submit
    higher: "priority 90 ERR_CLAIM_WINDOW_CLOSED (business_temporal)"
    lower: "priority 110 ERR_CLIENT_NOT_NEW (business_referential)"
    endpoint: "POST /comp/credit-claims/{id}/submit"
    scenario: "A NEW_CLIENT claim on a client that already has a sibling matter is submitted after claim_deadline_on has passed. Both are violated; the window error wins."

# =============================================================================
# 1.5 Endpoint Table
# =============================================================================

endpoints:

  # --- CompensationCycle -----------------------------------------------------
  - method: POST
    path: /comp/cycles
    roles: [CycleAdmin]
    input: ["fiscal_year", "distributable_pool_cents", "lockstep_unit_cents", "discretionary_pool_pct?", "draw_pct?", "claim_deadline_on", "assessment_deadline_on"]
    output: CompensationCycle
    success_status: 201
    description: "Opens a compensation cycle in OPEN_INTAKE. fiscal_year is unique."
    side_effects:
      - "Creates the cycle with every computed pool field at 0 and confidentiality_locked false."
      - "If this cycle's fiscal_year is the greatest among non-CLOSED cycles it becomes the anchor cycle and re-bases every Partner cycle-scoped computed field."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_DUPLICATE_CYCLE]

  - method: GET
    path: /comp/cycles/{id}
    roles: [CycleAdmin, CommitteeMember, CreditArbiter, Partner, AuditObserver]
    input: []
    output: CompensationCycle
    success_status: 200
    description: "Reads one cycle including its pool waterfall outputs and aggregate counters."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_CYCLE_NOT_FOUND]

  - method: GET
    path: /comp/cycles
    roles: [CycleAdmin, CommitteeMember, CreditArbiter, Partner, AuditObserver]
    input: ["state?", "fiscal_year?", "limit?", "offset?"]
    output: CompensationCycle[]
    success_status: 200
    description: "Lists cycles, ordered by fiscal_year DESC then created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST]

  - method: POST
    path: /comp/cycles/{id}/advance
    roles: [CycleAdmin]
    input: [target_state]
    output: CompensationCycle
    success_status: 200
    description: "Drives the cycle stage machine. Each edge carries its own completeness gate and its own cascade; see §1.2."
    side_effects:
      - "OPEN_INTAKE -> SELF_ASSESSMENT: gate on no in-flight CreditClaim."
      - "SELF_ASSESSMENT -> PEER_REVIEW: gate on every required SelfAssessment being SUBMITTED or ACCEPTED."
      - "PEER_REVIEW -> DELIBERATION: gates on no assessment having been returned to DRAFT and on MIN_SCORED_PEER_REVIEWS scored reviews each; recomputes matter realization/profitability, allocation and partner credited collections, non-billable points and formula scores; creates CommitteeBallot rows for every committee-member x discretionary-subject pair including the self pair; creates CompensationAward rows in PROPOSED/PENDING."
      - "DELIBERATION -> AWARDS_PUBLISHED: runs the trimmed-mean point aggregation, the pool waterfall and the provisional award calculation; sets draw schedules; publishes every award."
      - "AWARDS_PUBLISHED -> DELIBERATION: gated on reopen_count < MAX_REOPENS and on no award being TRUED_UP or SETTLED; appends DRAW_REVERSAL rows for every un-reversed scheduled draw, restoring undistributed_cash_cents, and returns every award to PROPOSED/PENDING."
      - "AWARDS_PUBLISHED -> TRUE_UP_OPEN: recomputes the FINAL_COLLECTED variant fields."
      - "TRUE_UP_OPEN -> CLOSED: finalizes every award and sets confidentiality_locked true."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_CYCLE_NOT_FOUND, ERR_INVALID_CYCLE_TRANSITION, ERR_UNRESOLVED_CLAIMS, ERR_ASSESSMENTS_INCOMPLETE, ERR_PEER_REVIEWS_INCOMPLETE, ERR_QUORUM_NOT_MET, ERR_POOL_INSUFFICIENT, ERR_CYCLE_NOT_REOPENABLE, ERR_AWARDS_NOT_SETTLED]

  # --- Partner ---------------------------------------------------------------
  - method: POST
    path: /comp/partners
    roles: [CycleAdmin]
    input: ["full_name", "practice_group", "compensation_model", "lockstep_step?", "admission_year", "is_committee_member?", "is_credit_arbiter?", "evaluation_required?", "opening_capital_cents?", "target_capital_cents?"]
    output: Partner
    success_status: 201
    description: "Admits a partner in status ACTIVE. capital_account_balance_cents is seeded from opening_capital_cents."
    side_effects:
      - "Sets capital_account_balance_cents = opening_capital_cents."
      - "A LOCKSTEP partner with evaluation_required true immediately enters the lockstep obligation in calculations.cycle_pool_waterfall."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

  - method: GET
    path: /comp/partners/{id}
    roles: [CycleAdmin, CommitteeMember, CreditArbiter, Partner, AuditObserver]
    input: []
    output: Partner
    success_status: 200
    description: "Reads one partner including every cycle-scoped computed evaluation input."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_PARTNER_NOT_FOUND]

  - method: GET
    path: /comp/partners
    roles: [CycleAdmin, CommitteeMember, CreditArbiter, AuditObserver]
    input: ["compensation_model?", "status?", "practice_group?", "is_committee_member?", "limit?", "offset?"]
    output: Partner[]
    success_status: 200
    description: "Lists partners, ordered by created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST]

  - method: POST
    path: /comp/partners/{id}/notice-of-departure
    roles: [CycleAdmin]
    input: [departure_effective_on]
    output: Partner
    success_status: 200
    description: "Records a partner's notice, moving ACTIVE -> NOTICE_GIVEN and staging a CreditTransition for every open matter they originate."
    side_effects:
      - "Creates one CreditTransition in PROPOSED per open originated matter, in (opened_on ASC, created_at ASC) order, with transferred_pct = prior_credit_pct = the current ORIGINATING credit_pct."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PARTNER_NOT_FOUND, ERR_PARTNER_NOT_DEPARTING]

  - method: POST
    path: /comp/partners/{id}/capital-contribution
    roles: [CycleAdmin]
    input: [amount_cents, expected_partner_version]
    output: Partner
    success_status: 200
    description: "Credits cash to a partner's capital account. Additive, so guarded by OCC on the partner version."
    side_effects:
      - "Increases capital_account_balance_cents by amount_cents."
      - "That change itself recomputes capital_shortfall_cents on every TRUED_UP CompensationAward of this partner and settles any award whose shortfall reaches 0."
      - "That award change itself recomputes CompensationCycle.unsettled_award_count, which is the gate on TRUE_UP_OPEN -> CLOSED."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PARTNER_NOT_FOUND, ERR_STALE_VERSION]

  - method: GET
    path: /comp/partners/{id}/credit-allocations
    roles: [CycleAdmin, CommitteeMember, CreditArbiter, Partner, AuditObserver]
    input: ["credit_role?", "state?", "limit?", "offset?"]
    output: CreditAllocation[]
    success_status: 200
    description: "Lists every credit allocation held by one partner across all matters, ordered by created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_PARTNER_NOT_FOUND]

  # --- Matter ----------------------------------------------------------------
  - method: POST
    path: /comp/matters
    roles: [CycleAdmin]
    input: [client_key, client_display_name, matter_type, practice_group, opened_on, billing_attorney_id, responsible_attorney_id]
    output: Matter
    success_status: 201
    description: "Opens a matter in state OPEN with no origination allocation yet."
    side_effects:
      - "Sets is_first_matter_for_client by testing whether any other Matter with the same client_key and state != WRITTEN_OFF already exists."
      - "Creates one BILLING CreditAllocation for billing_attorney_id and one RESPONSIBLE CreditAllocation for responsible_attorney_id, both at credit_pct 100.00, source DEFAULT_BILLING, credit_from = opened_on, credit_through null, state ACTIVE. ORIGINATING and WORKING allocations are NOT created here — origination comes from adjudication and WORKING from hour verification."
      - "Increments Partner.responsible_matter_count for responsible_attorney_id."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_PARTNER_NOT_FOUND]

  - method: GET
    path: /comp/matters/{id}
    roles: [CycleAdmin, CommitteeMember, CreditArbiter, Partner, AuditObserver]
    input: []
    output: Matter
    success_status: 200
    description: "Reads one matter including its realization and both profitability indices."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_MATTER_NOT_FOUND]

  - method: GET
    path: /comp/matters
    roles: [CycleAdmin, CommitteeMember, CreditArbiter, Partner, AuditObserver]
    input: ["client_key?", "billing_attorney_id?", "responsible_attorney_id?", "prior_responsible_attorney_id?", "state?", "matter_type?", "limit?", "offset?"]
    output: Matter[]
    success_status: 200
    description: "Lists matters, ordered by opened_on ASC then created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST]

  - method: POST
    path: /comp/matters/{id}/financials
    roles: [CycleAdmin]
    input: [billed_delta_cents, collected_delta_cents, direct_cost_delta_cents, expected_matter_version]
    output: Matter
    success_status: 200
    description: "Applies signed billing, collection and cost deltas to a matter ledger. Additive, so guarded by OCC on the matter version."
    side_effects:
      - "Adds each delta to billed_cents, collected_cents and direct_cost_cents; none may go negative."
      - "Recomputes realization_pct, profitability_index_contribution and profitability_index_fully_loaded."
      - "That recomputation itself drives credited_collection_provisional_cents / credited_collection_final_cents on every ACTIVE allocation of the matter."
      - "That allocation change itself drives Partner.credited_collection_*, normalized_credit_index_*, blended_realization_pct, weighted_profitability_points and formula_score_* for every credited partner, then CompensationCycle.total_formula_score."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_MATTER_NOT_FOUND, ERR_MATTER_NOT_OPEN, ERR_STALE_VERSION]

  - method: POST
    path: /comp/matters/{id}/status
    roles: [CycleAdmin]
    input: ["target_state", "written_off_reason?"]
    output: Matter
    success_status: 200
    description: "Moves a matter through OPEN <-> CLOSED and OPEN -> WRITTEN_OFF, changing which calculation variant may see it."
    side_effects:
      - "CLOSED brings the matter into the FINAL_COLLECTED input set; OPEN removes it again."
      - "WRITTEN_OFF supersedes every CreditAllocation on the matter and drops it from both variants."
      - "Every branch recomputes the credited-collection chain down to CompensationCycle.total_formula_score."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_MATTER_NOT_FOUND, ERR_MATTER_NOT_OPEN, ERR_AWARD_NOT_DRAWABLE]

  - method: GET
    path: /comp/matters/{id}/credit-allocations
    roles: [CycleAdmin, CommitteeMember, CreditArbiter, Partner, AuditObserver]
    input: ["credit_role?", "state?", "limit?", "offset?"]
    output: CreditAllocation[]
    success_status: 200
    description: "Lists every credit allocation on one matter, ordered by created_at ASC. This is the read used to verify the 100.00 percent origination invariant."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_MATTER_NOT_FOUND]

  - method: GET
    path: /comp/credit-allocations/{id}
    roles: [CycleAdmin, CommitteeMember, CreditArbiter, Partner, AuditObserver]
    input: []
    output: CreditAllocation
    success_status: 200
    description: "Reads one credit allocation including its half-open validity window and both credited-collection variants."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_ALLOCATION_NOT_FOUND]

  # --- ContributionRecord ----------------------------------------------------
  - method: POST
    path: /comp/contribution-records
    roles: [CycleAdmin, Partner]
    input: ["partner_id", "cycle_id", "matter_id?", "kind", "category", "hours", "standard_rate_cents?", "service_period_start", "service_period_end"]
    output: ContributionRecord
    success_status: 201
    description: "Records billable or non-billable time. Created unverified; contributes nothing until verified."
    side_effects:
      - "Sets standard_value_cents = hours * standard_rate_cents for BILLABLE rows and 0 for NON_BILLABLE rows."
      - "Enforces the NON_BILLABLE buffer constraint per (partner_id, category) over the closed service period."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_NOT_RESOURCE_OWNER, ERR_PARTNER_NOT_FOUND, ERR_CYCLE_NOT_FOUND, ERR_MATTER_NOT_FOUND, ERR_MATTER_NOT_OPEN, ERR_SERVICE_PERIOD_BUFFER_VIOLATION]

  - method: GET
    path: /comp/contribution-records/{id}
    roles: [CycleAdmin, CommitteeMember, Partner, AuditObserver]
    input: []
    output: ContributionRecord
    success_status: 200
    description: "Reads one contribution record."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_RECORD_NOT_FOUND]

  - method: GET
    path: /comp/contribution-records
    roles: [CycleAdmin, CommitteeMember, Partner, AuditObserver]
    input: ["partner_id?", "cycle_id?", "matter_id?", "kind?", "category?", "verified?", "limit?", "offset?"]
    output: ContributionRecord[]
    success_status: 200
    description: "Lists contribution records, ordered by service_period_start ASC then created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST]

  - method: POST
    path: /comp/contribution-records/{id}/verify
    roles: [CycleAdmin]
    input: []
    output: ContributionRecord
    success_status: 200
    description: "Marks a contribution record verified, admitting it to the scoring input sets."
    side_effects:
      - "Sets verified true and verified_at to the logical clock's current instant."
      - "That change itself drives Partner.verified_billable_hours (BILLABLE) or Partner.non_billable_points (NON_BILLABLE), and Matter.verified_billable_hours for BILLABLE rows."
      - "For a BILLABLE row it also upserts the WORKING CreditAllocation for (matter_id, partner_id) with source WORKING_DERIVED, credit_from = Matter.opened_on, credit_through null, and recomputes credit_pct = round_half_up(100 * that partner's verified BILLABLE hours on the matter / Matter.verified_billable_hours, 2) on every WORKING allocation of that matter."
      - "That Matter change itself drives profitability_index_fully_loaded, which drives Partner.weighted_profitability_points."
      - "That Partner change itself drives Partner.formula_score_provisional / formula_score_final and CompensationCycle.total_formula_score."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_RECORD_NOT_FOUND, ERR_RECORD_ALREADY_VERIFIED]

  # --- CreditClaim -----------------------------------------------------------
  - method: POST
    path: /comp/credit-claims
    roles: [Partner]
    input: [cycle_id, matter_id, claim_basis, requested_pct, narrative]
    output: CreditClaim
    success_status: 201
    description: "Files an origination credit claim in DRAFT. claimant_partner_id is taken from X-User-ID, never from the body."
    side_effects:
      - "Sets claimant_partner_id = X-User-ID, state DRAFT, revision_count 0, remand_count 0."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_CYCLE_NOT_FOUND, ERR_MATTER_NOT_FOUND, ERR_DUPLICATE_CLAIM]

  - method: GET
    path: /comp/credit-claims/{id}
    roles: [CycleAdmin, CreditArbiter, CommitteeMember, Partner, AuditObserver]
    input: []
    output: CreditClaim
    success_status: 200
    description: "Reads one credit claim including the adjudicated split and the resolved prior originator."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_CLAIM_NOT_FOUND]

  - method: GET
    path: /comp/credit-claims
    roles: [CycleAdmin, CreditArbiter, CommitteeMember, Partner, AuditObserver]
    input: ["cycle_id?", "matter_id?", "claimant_partner_id?", "disputing_partner_id?", "resolved_prior_originator_id?", "state?", "limit?", "offset?"]
    output: CreditClaim[]
    success_status: 200
    description: "Lists credit claims, ordered by created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST]

  - method: POST
    path: /comp/credit-claims/{id}/submit
    roles: [Partner]
    input: []
    output: CreditClaim
    success_status: 200
    description: "Submits a DRAFT claim for adjudication. Enforces the claim window before the client-history check."
    side_effects:
      - "Moves the claim DRAFT -> SUBMITTED, which is what blocks OPEN_INTAKE -> SELF_ASSESSMENT until it is adjudicated."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_NOT_RESOURCE_OWNER, ERR_CLAIM_NOT_FOUND, ERR_CLAIM_NOT_IN_DRAFT, ERR_CLAIM_WINDOW_CLOSED, ERR_CLIENT_NOT_NEW]

  - method: POST
    path: /comp/credit-claims/{id}/dispute
    roles: [Partner]
    input: [contested_pct, dispute_grounds]
    output: CreditClaim
    success_status: 200
    description: "Challenges a submitted claim, moving it to DISPUTED and recording the challenger."
    side_effects:
      - "Sets disputing_partner_id = X-User-ID, contested_pct and dispute_grounds."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_CLAIM_NOT_FOUND, ERR_CLAIM_NOT_DISPUTABLE, ERR_CLAIM_WINDOW_CLOSED, ERR_DISPUTER_IS_CLAIMANT]

  - method: POST
    path: /comp/credit-claims/{id}/adjudicate
    roles: [CreditArbiter]
    input: ["decision", "approved_pct?", "counterparty_pct?", "remand_reason?", "expected_matter_version"]
    output: CreditClaim
    success_status: 200
    description: "Decides a claim. decision is one of ALLOCATE, SPLIT, REJECT, REMAND, each with a different side-effect set; see §1.2."
    side_effects:
      - "ALLOCATE applies calculations.origination_sharing_convention and writes both the claimant and the resolved prior originator's ORIGINATING allocations; the BILLING and RESPONSIBLE rows seeded at matter creation are untouched."
      - "SPLIT bypasses the convention entirely and writes the claimant/disputer split verbatim."
      - "REJECT writes no claimant allocation but installs the DEFAULT_BILLING fallback when the matter has none."
      - "REMAND returns the claim to DRAFT, clears the dispute fields and increments both counters, bounded by MAX_REMANDS."
      - "Every branch increments Matter.version and cascades through Matter.origination_pct_assigned, the credited-collection chain, Partner.formula_score_* and CompensationCycle.total_formula_score."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_CLAIM_NOT_FOUND, ERR_CLAIM_NOT_ADJUDICABLE, ERR_STALE_VERSION, ERR_ARBITER_CONFLICT, ERR_CREDIT_INTERVAL_OVERSUBSCRIBED]

  # --- SelfAssessment --------------------------------------------------------
  - method: POST
    path: /comp/self-assessments
    roles: [Partner]
    input: [cycle_id, narrative, claimed_origination_pct_total, claimed_non_billable_hours]
    output: SelfAssessment
    success_status: 201
    description: "Opens a self-assessment in DRAFT. partner_id is taken from X-User-ID, never from the body."
    side_effects:
      - "Sets partner_id = X-User-ID; one assessment per (cycle_id, partner_id)."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_CYCLE_NOT_FOUND, ERR_DUPLICATE_ASSESSMENT]

  - method: GET
    path: /comp/self-assessments/{id}
    roles: [CycleAdmin, CommitteeMember, Partner, AuditObserver]
    input: []
    output: SelfAssessment
    success_status: 200
    description: "Reads one self-assessment including its peer-review roll-up."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_ASSESSMENT_NOT_FOUND]

  - method: GET
    path: /comp/self-assessments
    roles: [CycleAdmin, CommitteeMember, Partner, AuditObserver]
    input: ["cycle_id?", "partner_id?", "state?", "limit?", "offset?"]
    output: SelfAssessment[]
    success_status: 200
    description: "Lists self-assessments, ordered by created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST]

  - method: POST
    path: /comp/self-assessments/{id}/submit
    roles: [Partner]
    input: []
    output: SelfAssessment
    success_status: 200
    description: "Submits the partner's own assessment for peer review and committee acceptance."
    side_effects:
      - "Sets submitted_at and state SUBMITTED, which unblocks SELF_ASSESSMENT -> PEER_REVIEW once every required partner has done so."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_NOT_RESOURCE_OWNER, ERR_ASSESSMENT_NOT_FOUND, ERR_ASSESSMENT_NOT_MUTABLE, ERR_ASSESSMENT_WINDOW_CLOSED]

  - method: POST
    path: /comp/self-assessments/{id}/review-decision
    roles: [CommitteeMember]
    input: ["decision", "reason?"]
    output: SelfAssessment
    success_status: 200
    description: "Accepts or returns a submitted assessment. decision is ACCEPT or RETURN."
    side_effects:
      - "ACCEPT requires MIN_SCORED_PEER_REVIEWS scored reviews and preserves them."
      - "RETURN pushes the assessment back to DRAFT, increments revision_count and resets every SCORED PeerReview on it to ASSIGNED with its scores cleared, which itself zeroes scored_review_count and mean_peer_score."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_ASSESSMENT_NOT_FOUND, ERR_ASSESSMENT_NOT_REVIEWABLE, ERR_REVIEW_WINDOW_CLOSED, ERR_SELF_REVIEW_FORBIDDEN, ERR_PEER_REVIEWS_INCOMPLETE]

  # --- PeerReview ------------------------------------------------------------
  - method: POST
    path: /comp/peer-reviews
    roles: [CycleAdmin]
    input: [self_assessment_id, reviewer_partner_id]
    output: PeerReview
    success_status: 201
    description: "Assigns a reviewer to an assessment. One assignment per (self_assessment_id, reviewer_partner_id)."
    side_effects:
      - "Creates the review in ASSIGNED with every score null."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_ASSESSMENT_NOT_FOUND, ERR_PARTNER_NOT_FOUND, ERR_DUPLICATE_REVIEW_ASSIGNMENT, ERR_SELF_REVIEW_FORBIDDEN]

  - method: GET
    path: /comp/peer-reviews/{id}
    roles: [CycleAdmin, CommitteeMember, Partner, AuditObserver]
    input: []
    output: PeerReview
    success_status: 200
    description: "Reads one peer review including its composite score."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_REVIEW_NOT_FOUND]

  - method: GET
    path: /comp/peer-reviews
    roles: [CycleAdmin, CommitteeMember, Partner, AuditObserver]
    input: ["self_assessment_id?", "reviewer_partner_id?", "state?", "limit?", "offset?"]
    output: PeerReview[]
    success_status: 200
    description: "Lists peer reviews, ordered by created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST]

  - method: POST
    path: /comp/peer-reviews/{id}/decide
    roles: [Partner]
    input: ["outcome", "technical_score?", "collaboration_score?", "client_service_score?", "comment?", "recusal_reason?"]
    output: PeerReview
    success_status: 200
    description: "The assigned reviewer scores or recuses. outcome is SCORE or RECUSE."
    side_effects:
      - "SCORE writes the three sub-scores, computes composite_score and drives SelfAssessment.scored_review_count and mean_peer_score."
      - "RECUSE leaves the roll-up untouched, so a recusal can strand an assessment below MIN_SCORED_PEER_REVIEWS."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_NOT_RESOURCE_OWNER, ERR_REVIEW_NOT_FOUND, ERR_REVIEW_ALREADY_DECIDED, ERR_REVIEW_WINDOW_CLOSED, ERR_SELF_REVIEW_FORBIDDEN]

  # --- CommitteeBallot -------------------------------------------------------
  - method: GET
    path: /comp/ballots/{id}
    roles: [CycleAdmin, CommitteeMember]
    input: []
    output: CommitteeBallot
    success_status: 200
    description: "Reads one ballot. Confidential: a committee member sees only their own ballot, and once the cycle is closed only CycleAdmin sees any."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_BALLOT_CONFIDENTIAL, ERR_BALLOT_NOT_FOUND]

  - method: GET
    path: /comp/ballots
    roles: [CycleAdmin, CommitteeMember]
    input: ["cycle_id?", "subject_partner_id?", "committee_member_id?", "state?", "limit?", "offset?"]
    output: CommitteeBallot[]
    success_status: 200
    description: "Lists ballots, ordered by created_at ASC. A CommitteeMember must scope the list to their own committee_member_id."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_BALLOT_CONFIDENTIAL]

  - method: POST
    path: /comp/ballots/{id}/cast
    roles: [CommitteeMember]
    input: ["action", "points_proposed?", "rationale?", "recusal_reason?", "expected_cycle_version"]
    output: CommitteeBallot
    success_status: 200
    description: "Casts, abstains or recuses on a ballot. action is CAST, ABSTAIN or RECUSE. Guarded by OCC on the cycle version because each cast mutates the cycle-level point total."
    side_effects:
      - "CAST drives Partner.committee_points via the trimmed mean and CompensationCycle.total_committee_points, and counts toward quorum."
      - "ABSTAIN and RECUSE decide the ballot without contributing to either the mean or quorum."
      - "Every branch increments CompensationCycle.version."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_NOT_RESOURCE_OWNER, ERR_BALLOT_NOT_FOUND, ERR_BALLOT_ALREADY_DECIDED, ERR_INVALID_CYCLE_TRANSITION, ERR_ASSESSMENT_NOT_ACCEPTED, ERR_STALE_VERSION, ERR_SELF_VOTE_FORBIDDEN, ERR_POINTS_CAP_EXCEEDED]

  # --- CompensationAward / DrawPayment ---------------------------------------
  - method: GET
    path: /comp/awards/{id}
    roles: [CycleAdmin, CommitteeMember, Partner, AuditObserver]
    input: []
    output: CompensationAward
    success_status: 200
    description: "Reads one award including both state dimensions, the draw schedule and the true-up outcome."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_AWARD_NOT_FOUND]

  - method: GET
    path: /comp/awards
    roles: [CycleAdmin, CommitteeMember, Partner, AuditObserver]
    input: ["cycle_id?", "partner_id?", "award_state?", "payment_state?", "limit?", "offset?"]
    output: CompensationAward[]
    success_status: 200
    description: "Lists awards, ordered by created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST]

  - method: POST
    path: /comp/awards/{id}/draw-run
    roles: [CycleAdmin]
    input: [period_year, period_month]
    output: CompensationAward
    success_status: 200
    description: "Pays one monthly draw. Each (period_year, period_month) bucket may hold at most one un-reversed scheduled draw."
    side_effects:
      - "Appends a SCHEDULED_DRAW DrawPayment of draw_schedule_monthly_cents."
      - "That append itself drives draw_paid_cents and payment_state DRAWING."
      - "That award change itself drives Partner.ytd_draw_paid_cents and CompensationCycle.undistributed_cash_cents."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_AWARD_NOT_FOUND, ERR_AWARD_NOT_DRAWABLE, ERR_DRAW_PERIOD_ALREADY_PAID]

  - method: POST
    path: /comp/awards/{id}/true-up
    roles: [CycleAdmin]
    input: []
    output: CompensationAward
    success_status: 200
    description: "Settles the award at year end, running the FINAL_TRUE_UP variant and the capital withholding waterfall."
    side_effects:
      - "Sets final_award_cents, true_up_delta_cents, capital_call_cents and capital_shortfall_cents."
      - "Appends the CAPITAL_WITHHOLDING, TRUE_UP and CLAWBACK DrawPayment rows in that pinned order."
      - "That append itself drives Partner.capital_account_balance_cents, which selects payment_state SETTLED or TRUED_UP."
      - "That payment_state change itself drives CompensationCycle.unsettled_award_count and undistributed_cash_cents."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_AWARD_NOT_FOUND, ERR_AWARD_NOT_TRUE_UP_READY]

  - method: GET
    path: /comp/awards/{id}/draw-payments
    roles: [CycleAdmin, Partner, AuditObserver]
    input: ["kind?", "reversed?", "limit?", "offset?"]
    output: DrawPayment[]
    success_status: 200
    description: "Lists the immutable cash ledger of one award, ordered by created_at ASC. This is the read used to verify the undistributed-cash invariant."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST, ERR_AWARD_NOT_FOUND]

  - method: GET
    path: /comp/draw-payments/{id}
    roles: [CycleAdmin, Partner, AuditObserver]
    input: []
    output: DrawPayment
    success_status: 200
    description: "Reads one ledger row. DrawPayment is immutable: it has no version field and no write endpoint other than the appends performed by draw-run, true-up and cycle reopen."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_PAYMENT_NOT_FOUND]

  # --- CreditTransition ------------------------------------------------------
  - method: GET
    path: /comp/credit-transitions/{id}
    roles: [CycleAdmin, CreditArbiter, Partner, AuditObserver]
    input: []
    output: CreditTransition
    success_status: 200
    description: "Reads one staged or completed credit transition including the prior credit percentage kept for the void path."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_TRANSITION_NOT_FOUND]

  - method: GET
    path: /comp/credit-transitions
    roles: [CycleAdmin, CreditArbiter, Partner, AuditObserver]
    input: ["departing_partner_id?", "successor_partner_id?", "matter_id?", "state?", "limit?", "offset?"]
    output: CreditTransition[]
    success_status: 200
    description: "Lists credit transitions, ordered by created_at ASC."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_ACTOR_NOT_A_PARTNER, ERR_INVALID_REQUEST]

  - method: POST
    path: /comp/credit-transitions/{id}/effectuate
    roles: [CycleAdmin]
    input: [successor_partner_id, effective_on, expected_matter_version]
    output: CreditTransition
    success_status: 200
    description: "Moves a departing partner's origination credit to a successor as of effective_on. Guarded by OCC on the matter version."
    side_effects:
      - "Closes the departing ORIGINATING allocation at credit_through = effective_on (state TRANSFERRED) and opens a successor allocation from credit_from = effective_on; the RESPONSIBLE allocation follows the responsible-attorney reassignment."
      - "Snapshots and possibly reassigns Matter.responsible_attorney_id, recomputes Matter.origination_pct_assigned and increments Matter.version."
      - "That Matter change itself cascades through the credited-collection chain to Partner.formula_score_* and CompensationCycle.total_formula_score."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_TRANSITION_NOT_FOUND, ERR_PARTNER_NOT_FOUND, ERR_TRANSITION_NOT_PENDING, ERR_PARTNER_NOT_DEPARTING, ERR_SUCCESSOR_NOT_ELIGIBLE, ERR_STALE_VERSION, ERR_CREDIT_INTERVAL_OVERSUBSCRIBED]

  - method: POST
    path: /comp/credit-transitions/{id}/void
    roles: [CycleAdmin]
    input: [void_reason, expected_matter_version]
    output: CreditTransition
    success_status: 200
    description: "Cancels a transition. From PROPOSED it is a no-op on the allocations; from EFFECTIVE it is the compensating action that restores the pre-transfer credit layout exactly."
    side_effects:
      - "Supersedes the successor allocation and restores the departing allocation to ACTIVE at prior_credit_pct with credit_through cleared."
      - "Restores Matter.responsible_attorney_id from prior_responsible_attorney_id and clears the snapshot."
      - "Restores Matter.origination_pct_assigned to its pre-effectuate value and cascades back through the credited-collection chain."
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_TRANSITION_NOT_FOUND, ERR_TRANSITION_NOT_VOIDABLE, ERR_STALE_VERSION]

  # --- Test-only logical clock ----------------------------------------------
  - method: POST
    path: /_clock/set_current_utc
    roles: [CycleAdmin]
    input: [to_iso8601]
    output: { current_utc: datetime }
    success_status: 200
    description: >-
      Test-only logical clock. Every temporal comparison in this service (claim and
      assessment deadlines, credit_from / credit_through windows, service periods,
      departure effective dates, verified_at, submitted_at, accepted_at, decided_at)
      reads this clock rather than the wall clock. On service startup the logical
      clock is 2026-08-01T00:00:00Z, and that default holds for every request until
      this endpoint is called. Setting the clock backwards is permitted and does not
      retroactively alter any stored timestamp.
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST]

# =============================================================================
# 1.6 Error Catalog
# =============================================================================

errors:

  # --- auth / rbac -----------------------------------------------------------
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    trigger: "X-User-ID or X-User-Role header absent or empty."
    message: "Authentication headers are required."
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    trigger: "X-User-Role is unknown or is not in the endpoint's allowed roles."
    message: "Role is not permitted to perform this operation."
  - error_id: ERR_ACTOR_NOT_A_PARTNER
    http_status: 403
    trigger: "An entity-backed role header does not resolve to a Partner row with status != DEPARTED, or the row lacks the flag the role requires (is_committee_member for CommitteeMember, is_credit_arbiter for CreditArbiter)."
    message: "Acting user is not an eligible partner for this role."
  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    trigger: "A partner acts on a self-assessment, peer review, credit claim, ballot or contribution record that belongs to another partner."
    message: "Acting partner does not own this resource."
  - error_id: ERR_BALLOT_CONFIDENTIAL
    http_status: 403
    trigger: "A committee member reads a ballot held by another committee member, or any non-CycleAdmin role reads a ballot after the cycle has confidentiality_locked true."
    message: "Committee deliberation records are confidential."

  # --- schema ----------------------------------------------------------------
  - error_id: ERR_INVALID_REQUEST
    http_status: 422
    trigger: "Missing required field, wrong type, enum value outside the declared set, numeric value outside the declared range, malformed date, limit outside 1..100, negative offset, a branch-required conditional field absent (written_off_reason on WRITTEN_OFF, recusal_reason on RECUSE, reason on RETURN, the three scores on SCORE), matter_id present on a NON_BILLABLE contribution record or absent on a BILLABLE one, service_period_end before service_period_start, a financial delta that would drive a ledger field negative, or departure_effective_on before the logical clock's current date."
    message: "Request payload failed validation."

  # --- not found (404) -------------------------------------------------------
  - error_id: ERR_CYCLE_NOT_FOUND
    http_status: 404
    trigger: "cycle_id in the path or body does not resolve."
    message: "Compensation cycle not found."
  - error_id: ERR_PARTNER_NOT_FOUND
    http_status: 404
    trigger: "A partner id in the path or body does not resolve."
    message: "Partner not found."
  - error_id: ERR_MATTER_NOT_FOUND
    http_status: 404
    trigger: "A matter id in the path or body does not resolve."
    message: "Matter not found."
  - error_id: ERR_ALLOCATION_NOT_FOUND
    http_status: 404
    trigger: "A credit allocation id in the path does not resolve."
    message: "Credit allocation not found."
  - error_id: ERR_RECORD_NOT_FOUND
    http_status: 404
    trigger: "A contribution record id in the path does not resolve."
    message: "Contribution record not found."
  - error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    trigger: "A credit claim id in the path does not resolve."
    message: "Credit claim not found."
  - error_id: ERR_ASSESSMENT_NOT_FOUND
    http_status: 404
    trigger: "A self-assessment id in the path or body does not resolve."
    message: "Self-assessment not found."
  - error_id: ERR_REVIEW_NOT_FOUND
    http_status: 404
    trigger: "A peer review id in the path does not resolve."
    message: "Peer review not found."
  - error_id: ERR_BALLOT_NOT_FOUND
    http_status: 404
    trigger: "A ballot id in the path does not resolve."
    message: "Committee ballot not found."
  - error_id: ERR_AWARD_NOT_FOUND
    http_status: 404
    trigger: "An award id in the path does not resolve."
    message: "Compensation award not found."
  - error_id: ERR_PAYMENT_NOT_FOUND
    http_status: 404
    trigger: "A draw payment id in the path does not resolve."
    message: "Draw payment not found."
  - error_id: ERR_TRANSITION_NOT_FOUND
    http_status: 404
    trigger: "A credit transition id in the path does not resolve."
    message: "Credit transition not found."

  # --- uniqueness (409) ------------------------------------------------------
  - error_id: ERR_DUPLICATE_CYCLE
    http_status: 409
    trigger: "A CompensationCycle already exists for the requested fiscal_year."
    message: "A compensation cycle already exists for that fiscal year."
  - error_id: ERR_DUPLICATE_CLAIM
    http_status: 409
    trigger: "A CreditClaim already exists for (cycle_id, matter_id, claimant_partner_id)."
    message: "This partner has already filed a claim on that matter for this cycle."
  - error_id: ERR_DUPLICATE_ASSESSMENT
    http_status: 409
    trigger: "A SelfAssessment already exists for (cycle_id, partner_id)."
    message: "A self-assessment already exists for this partner and cycle."
  - error_id: ERR_DUPLICATE_REVIEW_ASSIGNMENT
    http_status: 409
    trigger: "A PeerReview already exists for (self_assessment_id, reviewer_partner_id)."
    message: "That reviewer is already assigned to this assessment."

  # --- state preconditions (409) --------------------------------------------
  - error_id: ERR_INVALID_CYCLE_TRANSITION
    http_status: 409
    trigger: "target_state is not reachable from the cycle's current state, or a ballot action is attempted while the cycle is not in DELIBERATION."
    message: "That cycle stage transition is not permitted from the current state."
  - error_id: ERR_CLAIM_NOT_IN_DRAFT
    http_status: 409
    trigger: "Submit is called on a claim whose state is not DRAFT."
    message: "Only a draft claim may be submitted."
  - error_id: ERR_CLAIM_NOT_DISPUTABLE
    http_status: 409
    trigger: "Dispute is called on a claim whose state is not SUBMITTED."
    message: "Only a submitted claim may be disputed."
  - error_id: ERR_CLAIM_NOT_ADJUDICABLE
    http_status: 409
    trigger: "Adjudicate is called on a claim whose state is not SUBMITTED or DISPUTED, a SPLIT or REMAND decision is applied to a claim that is not DISPUTED, or a REMAND is attempted when remand_count has already reached MAX_REMANDS."
    message: "This claim is not adjudicable in its current state."
  - error_id: ERR_ASSESSMENT_NOT_MUTABLE
    http_status: 409
    trigger: "Submit is called on a self-assessment whose state is not DRAFT."
    message: "Only a draft self-assessment may be submitted."
  - error_id: ERR_ASSESSMENT_NOT_REVIEWABLE
    http_status: 409
    trigger: "A review decision is applied to a self-assessment whose state is not SUBMITTED."
    message: "Only a submitted self-assessment may be accepted or returned."
  - error_id: ERR_REVIEW_ALREADY_DECIDED
    http_status: 409
    trigger: "Decide is called on a peer review whose state is not ASSIGNED."
    message: "This peer review has already been decided."
  - error_id: ERR_BALLOT_ALREADY_DECIDED
    http_status: 409
    trigger: "Cast is called on a ballot whose state is not PENDING."
    message: "This ballot has already been decided."
  - error_id: ERR_RECORD_ALREADY_VERIFIED
    http_status: 409
    trigger: "Verify is called on a contribution record whose verified is already true."
    message: "This contribution record has already been verified."
  - error_id: ERR_MATTER_NOT_OPEN
    http_status: 409
    trigger: "A status change or financial posting targets a matter that is not in the required state, or a BILLABLE contribution record references a matter that is not OPEN."
    message: "Matter is not in a state that permits this operation."
  - error_id: ERR_AWARD_NOT_DRAWABLE
    http_status: 409
    trigger: "A draw run targets an award whose award_state is not PUBLISHED or whose cycle is not in AWARDS_PUBLISHED or TRUE_UP_OPEN; or a matter reopen is attempted while an award of the anchor cycle is already TRUED_UP or SETTLED."
    message: "Award is not in a state that permits a draw."
  - error_id: ERR_AWARD_NOT_TRUE_UP_READY
    http_status: 409
    trigger: "A true-up targets an award whose payment_state is not DRAWING or whose cycle is not in TRUE_UP_OPEN."
    message: "Award is not ready for true-up."
  - error_id: ERR_TRANSITION_NOT_PENDING
    http_status: 409
    trigger: "Effectuate is called on a credit transition whose state is not PROPOSED."
    message: "Only a proposed credit transition may be effectuated."
  - error_id: ERR_TRANSITION_NOT_VOIDABLE
    http_status: 409
    trigger: "Void is called on a credit transition already in VOIDED."
    message: "This credit transition cannot be voided."

  # --- cross-entity state (409) ---------------------------------------------
  - error_id: ERR_ASSESSMENT_NOT_ACCEPTED
    http_status: 409
    trigger: "A ballot is cast on a subject partner whose SelfAssessment for the cycle is absent or not ACCEPTED."
    message: "The subject partner's self-assessment has not been accepted."
  - error_id: ERR_PARTNER_NOT_DEPARTING
    http_status: 409
    trigger: "Notice of departure is given for a partner whose status is not ACTIVE, or a credit transition is effectuated for a departing partner whose status is not NOTICE_GIVEN."
    message: "Partner is not in a departure state that permits this operation."
  - error_id: ERR_SUCCESSOR_NOT_ELIGIBLE
    http_status: 409
    trigger: "The successor named on an effectuate is not ACTIVE, or is the departing partner."
    message: "Named successor is not eligible to receive this credit."

  # --- concurrency (412) ----------------------------------------------------
  - error_id: ERR_STALE_VERSION
    http_status: 412
    trigger: "An expected_<parent>_version field does not equal the parent's current version. See §1.2.1."
    message: "The resource has changed since it was read; re-read and retry."

  # --- temporal windows (409) -----------------------------------------------
  - error_id: ERR_CLAIM_WINDOW_CLOSED
    http_status: 409
    trigger: "A claim submit or dispute is attempted when the cycle is not in OPEN_INTAKE, or when the logical clock's current date is after claim_deadline_on."
    message: "The origination claim window for this cycle is closed."
  - error_id: ERR_ASSESSMENT_WINDOW_CLOSED
    http_status: 409
    trigger: "A self-assessment submit is attempted when the cycle is not in SELF_ASSESSMENT, or when the logical clock's current date is after assessment_deadline_on."
    message: "The self-assessment window for this cycle is closed."
  - error_id: ERR_REVIEW_WINDOW_CLOSED
    http_status: 409
    trigger: "A peer-review decision or an assessment review decision is attempted when the cycle is not in SELF_ASSESSMENT or PEER_REVIEW."
    message: "The peer review window for this cycle is closed."
  - error_id: ERR_SERVICE_PERIOD_BUFFER_VIOLATION
    http_status: 409
    trigger: "A NON_BILLABLE contribution record's closed [service_period_start, service_period_end] window overlaps, touches, or falls within SERVICE_PERIOD_BUFFER_DAYS of an existing NON_BILLABLE record for the same (partner_id, category)."
    message: "Non-billable service period conflicts with an existing record for this category."

  # --- segregation of duties (403) ------------------------------------------
  - error_id: ERR_SELF_VOTE_FORBIDDEN
    http_status: 403
    trigger: "A committee member casts points on the ballot whose subject_partner_id equals their own id. Such a ballot may only be recused or abstained."
    message: "A committee member may not vote on their own compensation."
  - error_id: ERR_SELF_REVIEW_FORBIDDEN
    http_status: 403
    trigger: "A partner scores their own self-assessment, is assigned as a reviewer of their own self-assessment, or issues a review decision on their own self-assessment."
    message: "A partner may not review their own self-assessment."
  - error_id: ERR_ARBITER_CONFLICT
    http_status: 403
    trigger: "A credit arbiter adjudicates a claim in which they are the claimant, the disputer, or the matter's billing or responsible attorney."
    message: "Credit arbiter has a conflict of interest in this claim."
  - error_id: ERR_DISPUTER_IS_CLAIMANT
    http_status: 403
    trigger: "A partner disputes their own claim."
    message: "A partner may not dispute their own origination claim."

  # --- referential business rules (409) ------------------------------------
  - error_id: ERR_CLIENT_NOT_NEW
    http_status: 409
    trigger: "A NEW_CLIENT claim is submitted for a client that already has another non-written-off matter, an EXPANDED_MATTER or CROSS_SELL claim is submitted for a client that has no other matter, or a CROSS_SELL claim's matter shares the practice group of the client's earliest matter."
    message: "Claim basis does not match this client's matter history."

  # --- interval / cap constraints (409) ------------------------------------
  - error_id: ERR_CREDIT_INTERVAL_OVERSUBSCRIBED
    http_status: 409
    trigger: "The credit_pct sum of ORIGINATING allocations whose half-open [credit_from, credit_through) windows overlap would exceed 100.00 on a matter. Adjacent windows sharing an endpoint do not overlap."
    message: "Origination credit on this matter would exceed 100 percent."
  - error_id: ERR_DRAW_PERIOD_ALREADY_PAID
    http_status: 409
    trigger: "A scheduled draw is requested for a (period_year, period_month) bucket that already holds an un-reversed SCHEDULED_DRAW on this award."
    message: "A draw has already been paid for that period."
  - error_id: ERR_POINTS_CAP_EXCEEDED
    http_status: 409
    trigger: "points_proposed exceeds POINTS_CAP_PER_BALLOT."
    message: "Proposed points exceed the per-ballot cap."

  # --- aggregate gates (409) -----------------------------------------------
  - error_id: ERR_UNRESOLVED_CLAIMS
    http_status: 409
    trigger: "A cycle is advanced out of OPEN_INTAKE while a CreditClaim of that cycle is still SUBMITTED or DISPUTED."
    message: "Unresolved origination claims remain in this cycle."
  - error_id: ERR_ASSESSMENTS_INCOMPLETE
    http_status: 409
    trigger: "A cycle is advanced out of SELF_ASSESSMENT before every required partner's assessment exists and is SUBMITTED or ACCEPTED, or out of PEER_REVIEW while some assessment of the cycle has been returned to DRAFT."
    message: "Self-assessments are incomplete for this cycle."
  - error_id: ERR_PEER_REVIEWS_INCOMPLETE
    http_status: 409
    trigger: "A cycle is advanced out of PEER_REVIEW, or an assessment is accepted, while scored_review_count is below MIN_SCORED_PEER_REVIEWS."
    message: "Peer reviews are incomplete."
  - error_id: ERR_QUORUM_NOT_MET
    http_status: 409
    trigger: "A cycle is advanced out of DELIBERATION while some ballot subject has fewer than QUORUM_MIN_CAST_BALLOTS ballots in CAST."
    message: "Committee quorum has not been met for every subject."

  # --- fiscal closure (409) ------------------------------------------------
  - error_id: ERR_POOL_INSUFFICIENT
    http_status: 409
    trigger: "The pool waterfall still shows a deficit after cutting both the lockstep and discretionary buckets to HAIRCUT_FLOOR_PCT."
    message: "Distributable pool is insufficient to fund committed compensation."
  - error_id: ERR_CYCLE_NOT_REOPENABLE
    http_status: 409
    trigger: "A reopen from AWARDS_PUBLISHED to DELIBERATION is attempted when reopen_count has already reached MAX_REOPENS, or while some award of the cycle is TRUED_UP or SETTLED."
    message: "This cycle can no longer be reopened for reconsideration."
  - error_id: ERR_AWARDS_NOT_SETTLED
    http_status: 409
    trigger: "A cycle is advanced out of TRUE_UP_OPEN while unsettled_award_count is greater than 0."
    message: "Every award must be settled before the cycle can close."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================

roles:

  - name: CycleAdmin
    identity: opaque
    description: >-
      The compensation function's operations role. Owns cycle staging, partner and
      matter records, financial postings, contribution verification, draw runs,
      true-ups and credit transitions. Never files a claim, never submits a
      self-assessment, never scores a peer review and never casts a ballot — those
      are partner acts. Is the only role that may read ballots once a cycle is
      confidentiality-locked.
    exclusive_operations:
      - "POST /comp/cycles"
      - "POST /comp/cycles/{id}/advance"
      - "POST /comp/partners"
      - "POST /comp/partners/{id}/notice-of-departure"
      - "POST /comp/partners/{id}/capital-contribution"
      - "POST /comp/matters"
      - "POST /comp/matters/{id}/financials"
      - "POST /comp/matters/{id}/status"
      - "POST /comp/contribution-records/{id}/verify"
      - "POST /comp/peer-reviews"
      - "POST /comp/awards/{id}/draw-run"
      - "POST /comp/awards/{id}/true-up"
      - "POST /comp/credit-transitions/{id}/effectuate"
      - "POST /comp/credit-transitions/{id}/void"
      - "POST /_clock/set_current_utc"
      - "reading any ballot after confidentiality_locked becomes true"
    shared_operations:
      - "POST /comp/contribution-records (shared with Partner, who may only create their own)"
      - "every GET under /comp except that ballot reads are additionally filtered by confidentiality"

  - name: Partner
    identity: entity_backed:Partner
    description: >-
      An equity partner. Files and disputes origination claims, records and submits
      their own self-assessment, scores peer reviews assigned to them, and reads the
      firm-wide matter, allocation and award data that feeds their own evaluation.
      Cannot stage a cycle, cannot verify their own hours, cannot adjudicate a claim
      and cannot read any ballot.
    exclusive_operations:
      - "POST /comp/credit-claims"
      - "POST /comp/credit-claims/{id}/submit"
      - "POST /comp/credit-claims/{id}/dispute"
      - "POST /comp/self-assessments"
      - "POST /comp/self-assessments/{id}/submit"
      - "POST /comp/peer-reviews/{id}/decide"
    shared_operations:
      - "POST /comp/contribution-records (own partner_id only)"
      - "GET /comp/cycles, /comp/cycles/{id}, /comp/partners/{id}, /comp/matters, /comp/matters/{id}, /comp/matters/{id}/credit-allocations, /comp/partners/{id}/credit-allocations, /comp/credit-allocations/{id}, /comp/contribution-records, /comp/contribution-records/{id}, /comp/credit-claims, /comp/credit-claims/{id}, /comp/self-assessments, /comp/self-assessments/{id}, /comp/peer-reviews, /comp/peer-reviews/{id}, /comp/awards, /comp/awards/{id}, /comp/awards/{id}/draw-payments, /comp/draw-payments/{id}, /comp/credit-transitions, /comp/credit-transitions/{id}"

  - name: CommitteeMember
    identity: entity_backed:Partner
    description: >-
      A partner serving on the compensation committee, identified by
      is_committee_member == true on their Partner row. Accepts or returns
      self-assessments and casts ballots on discretionary subjects. May read only
      their own ballots, and none at all once the cycle is confidentiality-locked.
      Holding this role does not confer the plain Partner role's claim and
      self-assessment operations — a committee member must act under X-User-Role
      Partner for those, using the same X-User-ID.
    exclusive_operations:
      - "POST /comp/self-assessments/{id}/review-decision"
      - "POST /comp/ballots/{id}/cast"
      - "GET /comp/ballots (own committee_member_id only)"
      - "GET /comp/ballots/{id} (own ballot only)"
    shared_operations:
      - "GET /comp/cycles, /comp/cycles/{id}, /comp/partners, /comp/partners/{id}, /comp/partners/{id}/credit-allocations, /comp/matters, /comp/matters/{id}, /comp/matters/{id}/credit-allocations, /comp/credit-allocations/{id}, /comp/contribution-records, /comp/contribution-records/{id}, /comp/credit-claims, /comp/credit-claims/{id}, /comp/self-assessments, /comp/self-assessments/{id}, /comp/peer-reviews, /comp/peer-reviews/{id}, /comp/awards, /comp/awards/{id}"

  - name: CreditArbiter
    identity: entity_backed:Partner
    description: >-
      A partner designated to resolve origination credit disputes, identified by
      is_credit_arbiter == true. Sole holder of the adjudication power, and barred
      from exercising it on any claim in which they are the claimant, the disputer,
      or the matter's billing or responsible attorney. Never casts a ballot and
      never reviews a self-assessment.
    exclusive_operations:
      - "POST /comp/credit-claims/{id}/adjudicate"
    shared_operations:
      - "GET /comp/cycles, /comp/cycles/{id}, /comp/partners, /comp/partners/{id}, /comp/partners/{id}/credit-allocations, /comp/matters, /comp/matters/{id}, /comp/matters/{id}/credit-allocations, /comp/credit-allocations/{id}, /comp/credit-claims, /comp/credit-claims/{id}, /comp/credit-transitions, /comp/credit-transitions/{id}"

  - name: AuditObserver
    identity: opaque
    description: >-
      A read-only oversight role (firm auditor or outside counsel). Sees the whole
      compensation record except committee ballots, which it may never read under
      any cycle state. Holds no write operation of any kind.
    exclusive_operations: []
    shared_operations:
      - "GET /comp/cycles, /comp/cycles/{id}, /comp/partners, /comp/partners/{id}, /comp/partners/{id}/credit-allocations, /comp/matters, /comp/matters/{id}, /comp/matters/{id}/credit-allocations, /comp/credit-allocations/{id}, /comp/contribution-records, /comp/contribution-records/{id}, /comp/credit-claims, /comp/credit-claims/{id}, /comp/self-assessments, /comp/self-assessments/{id}, /comp/peer-reviews, /comp/peer-reviews/{id}, /comp/awards, /comp/awards/{id}, /comp/awards/{id}/draw-payments, /comp/draw-payments/{id}, /comp/credit-transitions, /comp/credit-transitions/{id}"

rbac_notes:
  - "Roles are not hierarchical. A partner who is both a committee member and a credit arbiter has three distinct role headers available and each request is evaluated under exactly the one supplied."
  - "Segregation of duties is enforced on X-User-ID, not on the role: the same partner id cannot both hold a ballot's subject seat and cast it, cannot review their own assessment, and cannot adjudicate their own claim."
  - "CycleAdmin and AuditObserver are opaque: their X-User-ID need not resolve to a Partner row, and no ownership check applies to them."
