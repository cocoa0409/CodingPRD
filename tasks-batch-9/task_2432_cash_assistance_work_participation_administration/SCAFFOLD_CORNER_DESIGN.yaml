              as_user_id: "wps-1"
          trigger:
            - call: "POST /compliance-episodes/${ep_id}/impose-sanction"
              payload: {}
              as: EligibilitySupervisor
              as_user_id: "sup-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /compliance-episodes/${ep_id}/impose-sanction"
              payload: {}
              as: EligibilitySupervisor
              as_user_id: "sup-1"
          assert:
            - "the first trigger call returns HTTP 422 with data.error_id == ERR_CONCILIATION_NOT_COMPLETE"
            - "ComplianceEpisode.${ep_id}.conciliation_deadline_date == \"2026-08-31\""
            - "ComplianceEpisode.${ep_id}.status == CONCILIATION after the first trigger call"
            - "AssistanceCase.${case_id}.benefit_amount_cents == 41650 after the first trigger call"
            - "the third trigger call returns HTTP 200"
            - "ComplianceEpisode.${ep_id}.status == SANCTION_IMPOSED after the third trigger call"
            - "ComplianceEpisode.${ep_id}.sanction_level == 1"
            - "ComplianceEpisode.${ep_id}.sanction_pct == 0.25"
            - "ComplianceEpisode.${ep_id}.sanction_imposed_month == \"2026-09\""
            - "AssistanceCase.${case_id}.sanction_level == 1 after the third trigger call"
            - "AssistanceCase.${case_id}.benefit_amount_cents == 31237 after the third trigger call"
            - "AssistanceCase.${case_id}.benefit_status == ACTIVE after the third trigger call"

      - name: fully_excluded_resources_satisfy_the_resource_test_and_approve_passes
        claim_type: satisfaction_to_pass
        grounds:
          - calculations.countable_resource_determination
          - validations[priority=60]
          - endpoints[POST /applications/{id}/approve]
        distinguishing_aspect: |
          A 500000 PRIMARY_VEHICLE and a 900000 HOMESTEAD are excluded outright, so
          countable_resources_cents is 0 and approve succeeds even though the gross
          values are far above RESOURCE_LIMIT_CENTS — the limit is applied to the
          countable figure, not the gross one.
        test_recipe:
          setup:
            - "A SINGLE_PARENT household of size 3 has a RECEIVED PROSPECTIVE 2026-08 application with no income."
            - "It reports a PRIMARY_VEHICLE of 500000 and a HOMESTEAD of 900000, both fully excluded."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Excluded Resources Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/resource-items"
              payload: { item_type: "VEHICLE", gross_value_cents: 500000, encumbrance_cents: 0, exclusion_type: "PRIMARY_VEHICLE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { res_vehicle_id: $.data.id }
            - call: "POST /applications/${app_id}/resource-items"
              payload: { item_type: "REAL_PROPERTY", gross_value_cents: 900000, encumbrance_cents: 100000, exclusion_type: "HOMESTEAD" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { res_home_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ResourceItem.${res_vehicle_id}.countable_value_cents == 0"
            - "ResourceItem.${res_home_id}.countable_value_cents == 0"
            - "Application.${app_id}.countable_resources_cents == 0"
            - "Application.${app_id}.status == APPROVED"
            - "AssistanceCase.${case_id}.benefit_status == PENDING_ISSUANCE"
            - "AssistanceCase.${case_id}.benefit_amount_cents == 41650"

      - name: priority_ladder_ordering_covered_by_difficulty_design
        claim_type: priority_ordering
        grounds:
          - validations[priority=30]
          - validations[priority=60]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / time_limit_exhaustion_outranks_resource_limit_on_approve
          rationale: "That instance violates priority 30 and priority 60 on one approve call and asserts the priority-30 error, and three sibling instances cover other category pairs."

  - section: endpoints
    instances:
      - name: case_search_filters_on_benefit_status_and_reports_total_count
        claim_type: standard_crud
        grounds:
          - endpoints[GET /cases]
          - entities.AssistanceCase.benefit_status
        distinguishing_aspect: |
          Two cases exist, one ACTIVE after an issuance and one still
          PENDING_ISSUANCE. benefit_status=ACTIVE returns exactly the issued case
          with total_count 1, and the unfiltered search returns total_count 2, so
          the filter is applied server-side rather than the whole table being
          returned.
        test_recipe:
          setup:
            - "Two separate SINGLE_PARENT households of size 3 with no income each have an approved 2026-08 application."
            - "The first case has 2026-08 issued (ACTIVE); the second has no issuance (PENDING_ISSUANCE)."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Case Search Household A", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_a_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_a_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_a_id: $.data.id }
            - call: "POST /applications/${app_a_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_a_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_a_id: $.data.id }
            - call: "POST /cases/${case_a_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Case Search Household B", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_b_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_b_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_b_id: $.data.id }
            - call: "POST /applications/${app_b_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_b_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-2"
              captures: { case_b_id: $.data.id }
          trigger:
            - call: "GET /cases?benefit_status=ACTIVE"
              payload: {}
              as: StateReportingAnalyst
              as_user_id: "an-1"
              captures: { first_case_id: "$.data[0].id" }
            - call: "GET /cases"
              payload: {}
              as: StateReportingAnalyst
              as_user_id: "an-1"
          assert:
            - "the first trigger call returns HTTP 200 with total_count 1 and has_more false"
            - "${first_case_id} == ${case_a_id}"
            - "AssistanceCase.${case_a_id}.benefit_status == ACTIVE"
            - "AssistanceCase.${case_b_id}.benefit_status == PENDING_ISSUANCE"
            - "the second trigger call returns total_count 2"

      - name: advancing_the_clock_moves_the_current_fiscal_year_for_the_case_rollup
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - calculations.supportive_service_waterfall
          - entities.AssistanceCase.supportive_fy_authorized_cents
        distinguishing_aspect: |
          The authorization's own fiscal_year comes from period_start (2026-10-01
          -> FY 2027) while the case rollup counts only the CURRENT fiscal year
          taken from the logical clock. With the clock at 2026-08-01 (FY 2026) the
          rollup is 0 even though the row is AUTHORIZED for 25000; setting the
          clock to 2026-10-01 makes the same untouched row appear in the rollup.
        test_recipe:
          setup:
            - "The logical clock is 2026-08-01T00:00:00Z."
            - "A SINGLE_PARENT case of household size 3 with no income is ACTIVE with 2026-08 issued and has an ACTIVE COMMUNITY_SERVICE assignment of 20 weekly hours for 2026-08-01..2026-12-01."
            - "A TRANSPORTATION authorization of 25000 for 2026-10-01..2026-10-31 is AUTHORIZED."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Clock Fiscal Year Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /cases/${case_id}/work-assignments"
              payload: { activity_category: "COMMUNITY_SERVICE", scheduled_weekly_hours: 20, start_date: "2026-08-01", end_date: "2026-12-01" }
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
              captures: { wa_id: $.data.id }
            - call: "POST /work-assignments/${wa_id}/activate"
              payload: {}
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
            - call: "GET /cases/${case_id}"
              payload: {}
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
              captures: { case_v1: $.data.version }
            - call: "POST /supportive-service-authorizations"
              payload: { case_id: "${case_id}", work_assignment_id: "${wa_id}", service_type: "TRANSPORTATION", requested_amount_cents: 25000, period_start: "2026-10-01", period_end: "2026-10-31", expected_case_version: "${case_v1}" }
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
              captures: { ssa_id: $.data.id }
            - call: "POST /supportive-service-authorizations/${ssa_id}/authorize"
              payload: {}
              as: WorkProgramSpecialist
              as_user_id: "wps-1"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 200"
            - "data.current_utc == \"2026-10-01T00:00:00Z\""
            - "SupportiveServiceAuthorization.${ssa_id}.fiscal_year == 2027"
            - "SupportiveServiceAuthorization.${ssa_id}.status == AUTHORIZED"
            - "SupportiveServiceAuthorization.${ssa_id}.authorized_amount_cents == 25000"
            - "AssistanceCase.${case_id}.supportive_fy_authorized_cents == 25000 after the trigger call"

      - name: time_limit_ledger_read_exposes_both_clock_flags_per_month
        claim_type: computed_read
        grounds:
          - endpoints[GET /cases/{id}/time-limit-months]
          - entities.TimeLimitMonth.state_clock_countable
          - entities.TimeLimitMonth.federal_clock_countable
        distinguishing_aspect: |
          Each issuance appends exactly one ledger row, and on an ordinary
          SINGLE_PARENT case both clock flags are true with non_countable_reason
          NONE; the benefit_month filter narrows the same collection to one row, so
          the read is a computed projection of the ledger rather than a stored list
          on the case.
        test_recipe:
          setup:
            - "A SINGLE_PARENT case of household size 3 with no income is ACTIVE with 2026-08 and 2026-09 issued."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Ledger Read Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /cases/${case_id}/issuances"
              payload: { benefit_month: "2026-09" }
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "GET /cases/${case_id}/time-limit-months"
              payload: {}
              as: StateReportingAnalyst
              as_user_id: "an-1"
              captures: { first_month: "$.data[0].benefit_month" }
            - call: "GET /cases/${case_id}/time-limit-months?benefit_month=2026-09"
              payload: {}
              as: StateReportingAnalyst
              as_user_id: "an-1"
          assert:
            - "the first trigger call returns HTTP 200 with total_count 2 and has_more false"
            - "${first_month} == \"2026-08\""
            - "every returned row has assistance_issued true"
            - "every returned row has state_clock_countable true"
            - "every returned row has federal_clock_countable true"
            - "every returned row has non_countable_reason NONE"
            - "the second trigger call returns total_count 1"
            - "Household.${hh_id}.state_clock_months_used == 2"
            - "Household.${hh_id}.federal_clock_months_used == 2"

      - name: applicant_withdraws_own_application_and_the_open_offer_is_declined
        claim_type: conditional_action
        grounds:
          - endpoints[POST /applications/{id}/withdraw]
          - state_machines.Application.status
          - state_machines.DiversionGrant.status
        distinguishing_aspect: |
          Withdrawal is allowed from DIVERSION_OFFERED and is performed by the
          Applicant acting as its own household id, and the open OFFERED grant is
          swept to DECLINED as a side effect without creating any ineligibility
          window, so Household.diversion_ineligible_through_month stays null.
        test_recipe:
          setup:
            - "A SINGLE_PARENT household of size 3 with no income has a DETERMINED DIVERSION_CONSIDERED 2026-08 application with determined_benefit_cents 41650."
            - "An OFFERED DiversionGrant exists on that application."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Applicant Withdraw Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "DIVERSION_CONSIDERED", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
            - call: "POST /applications/${app_id}/diversion-grants"
              payload: {}
              as: EligibilitySupervisor
              as_user_id: "sup-1"
              captures: { dg_id: $.data.id }
          trigger:
            - call: "POST /applications/${app_id}/withdraw"
              payload: { withdrawal_reason: "Found employment" }
              as: Applicant
              as_user_id: "${hh_id}"
          assert:
            - "HTTP status == 200"
            - "Application.${app_id}.status == WITHDRAWN"
            - "Application.${app_id}.determined_benefit_cents == 41650"
            - "DiversionGrant.${dg_id}.status == DECLINED"
            - "DiversionGrant.${dg_id}.lump_sum_cents == 124950"
            - "Household.${hh_id}.diversion_ineligible_through_month == null"

  - section: errors
    instances:
      - name: request_missing_auth_headers_is_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors.ERR_UNAUTHENTICATED
          - validations[priority=1]
        distinguishing_aspect: |
          The 401 authentication check runs before role, path-existence and body
          validation, so a POST /households with a well-formed body but no
          X-User-ID / X-User-Role headers is rejected with ERR_UNAUTHENTICATED and
          no household row is created.
        test_recipe:
          setup:
            - "The database is empty."
          setup_api_calls: []
          trigger:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Unauthenticated Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: none
              as_user_id: "none"
          assert:
            - "HTTP status == 401"
            - "data.error_id == ERR_UNAUTHENTICATED"
            - "GET /cases as StateReportingAnalyst an-1 returns total_count 0"

      - name: zero_benefit_denial_error_covered_by_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INELIGIBLE_ZERO_BENEFIT
          - calculations.benefit_amount_calculation
        excluded_because:
          difficulty_instance: boundary_precision_check / minimum_issuance_floor_at_exactly_one_thousand_cents_versus_one_cent_below
          rationale: "That instance triggers ERR_INELIGIBLE_ZERO_BENEFIT on the 47825 side of the minimum-issuance boundary and asserts the 422 body."
      - name: scheduled_hours_capacity_error_covered_by_difficulty_design
        claim_type: error_triggerable
        grounds:
          - errors.ERR_SCHEDULED_HOURS_CAPACITY_EXCEEDED
          - calculations.work_assignment_hour_capacity
        excluded_because:
          difficulty_instance: resource_temporal_overlap / work_assignment_ranges_are_half_open_and_capacity_sums_only_the_overlapping_set
          rationale: "That instance triggers ERR_SCHEDULED_HOURS_CAPACITY_EXCEEDED from the overlapping-set sum and contrasts it with the non-overlapping adjacent range that passes."

  - section: rbac
    instances:
      - name: caseworker_cannot_approve_an_application
        claim_type: role_permissions
        grounds:
          - endpoints[POST /applications/{id}/approve]
          - roles.Caseworker
          - errors.ERR_FORBIDDEN_ROLE
          - validations[priority=2]
        distinguishing_aspect: |
          Approval is reserved to EligibilitySupervisor; the same DETERMINED
          application that a supervisor could approve is refused for a Caseworker
          with 403 ERR_FORBIDDEN_ROLE, the application stays DETERMINED and no
          AssistanceCase row is created.
        test_recipe:
          setup:
            - "A SINGLE_PARENT household of size 3 with no income has a DETERMINED PROSPECTIVE 2026-08 application with determined_benefit_cents 41650."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Role Approve Household", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/determine"
              payload: {}
              as: Caseworker
              as_user_id: "cw-1"
          trigger:
            - call: "POST /applications/${app_id}/approve"
              payload: { certification_start_month: "2026-08" }
              as: Caseworker
              as_user_id: "cw-1"
          assert:
            - "HTTP status == 403"
            - "data.error_id == ERR_FORBIDDEN_ROLE"
            - "Application.${app_id}.status == DETERMINED"
            - "Application.${app_id}.determined_benefit_cents == 41650"
            - "GET /cases?household_id=${hh_id} as StateReportingAnalyst an-1 returns total_count 0"

      - name: applicant_cannot_read_another_households_application
        claim_type: role_permissions
        grounds:
          - endpoints[GET /applications/{id}]
          - roles.Applicant
          - errors.ERR_NOT_HOUSEHOLD_OWNER
          - validations[priority=6]
        distinguishing_aspect: |
          The Applicant role is listed for GET /applications/{id}, so the request
          survives the priority-2 role check and fails at priority 6 with 403
          ERR_NOT_HOUSEHOLD_OWNER because X-User-ID is household B while the
          application belongs to household A; the same call as household A
          succeeds.
        test_recipe:
          setup:
            - "Household A has a RECEIVED PROSPECTIVE 2026-08 application."
            - "Household B is an unrelated household with no application."
          setup_api_calls:
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Owner Household A", county_code: "ADA", household_size: 3, adult_count: 1, youngest_child_age_months: 84, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_a_id: $.data.id }
            - call: "POST /households"
              payload: { head_of_household_name: "Corner Owner Household B", county_code: "ADA", household_size: 2, adult_count: 1, youngest_child_age_months: 40, has_subsidized_child_care: false }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { hh_b_id: $.data.id }
            - call: "POST /applications"
              payload: { household_id: "${hh_a_id}", application_month: "2026-08", requested_program: "ONGOING_ASSISTANCE", budgeting_method: "PROSPECTIVE" }
              as: Caseworker
              as_user_id: "cw-1"
              captures: { app_a_id: $.data.id }
          trigger:
            - call: "GET /applications/${app_a_id}"
              payload: {}
              as: Applicant
              as_user_id: "${hh_b_id}"
            - call: "GET /applications/${app_a_id}"
              payload: {}
              as: Applicant
