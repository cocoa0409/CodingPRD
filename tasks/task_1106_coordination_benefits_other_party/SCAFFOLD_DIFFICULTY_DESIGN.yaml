            - call: "POST /cob/members/${mid}/coverages/${cown}/verify"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/members/${mid}/coverages"
              payload: { payer_id: "G", plan_name: "G", coverage_kind: "GROUP_HEALTH", subscriber_relationship: "SPOUSE", policy_holder_dob: "1978-01-01", policy_holder_gender: "MALE", effective_from: "2025-01-01", verification_source: "DATA_MATCH_CMS" }
              as: COBAnalyst
              captures: { cg: $.data.id }
            - call: "POST /cob/members/${mid}/coverages/${cg}/verify"
              payload: {}
              as: COBAnalyst
            - call: "GET /cob/members/${mid}"
              payload: {}
              as: COBAnalyst
              captures: { mv: $.data.version }
            - call: "POST /cob/members/${mid}/primacy-determinations"
              payload: { as_of_service_date: "2026-02-01", expected_member_version: "${mv}" }
              as: COBAnalyst
              captures: { pdid: $.data.id }
            - call: "POST /cob/members/${mid}/primacy-determinations/${pdid}/finalize"
              payload: {}
              as: COBAnalyst
            - call: "POST /cob/claims"
              payload: { member_id: "${mid}", provider_id: "${pid}", claim_external_id: "CR", service_date: "2026-02-10", received_date: "2026-02-12", total_billed_cents: 50000 }
              as: ClaimsExaminer
              captures: { clid: $.data.id }
            - call: "POST /cob/claims/${clid}/lines"
              payload: { line_number: 1, procedure_code: "X", billed_cents: 50000, allowed_cents: 40000, primary_paid_cents: 0 }
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/pay"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/adjustments"
              payload: { cause: "NEW_COVERAGE_DISCOVERED", triggering_determination_id: "${pdid}" }
              as: ClaimsExaminer
              captures: { aid: $.data.id }
            - call: "POST /cob/claims/${clid}/adjustments/${aid}/apply"
              payload: {}
              as: ClaimsExaminer
              captures: { over_amt: $.data.overpayment_cents }
            - call: "POST /cob/claims/${clid}/reopen"
              payload: {}
              as: RecoverySpecialist
            - call: "POST /cob/claims/${clid}/readjudicate"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/repay"
              payload: {}
              as: ClaimsExaminer
            - call: "POST /cob/claims/${clid}/recovery-requests"
              payload: { provider_id: "${pid}", amount_cents: 10000 }
              as: RecoverySpecialist
              captures: { rid: $.data.id }
            - call: "POST /cob/claims/${clid}/recovery-requests/${rid}/issue"
              payload: {}
              as: RecoverySpecialist
          trigger:
            - call: "POST /cob/claims/${clid}/recovery-requests/${rid}/reimbursements"
              payload: { amount_cents: 3000, method: "PROVIDER_REFUND_CHECK" }
              as: RecoverySpecialist
            - call: "POST /cob/claims/${clid}/recovery-requests/${rid}/reimbursements"
              payload: { amount_cents: 4000, method: "OFFSET_AGAINST_FUTURE_CLAIMS" }
              as: RecoverySpecialist
            - call: "POST /cob/claims/${clid}/recovery-requests/${rid}/reimbursements"
              payload: { amount_cents: 3000, method: "CARRIER_TO_CARRIER_TRANSFER" }
              as: RecoverySpecialist
          assert:
            - "RecoveryRequest.${rid}.amount_recovered_cents == 10000  # sum of 3000+4000+3000"
            - "RecoveryRequest.${rid}.status == FULLY_RECOVERED"
            - "RecoveryRequest.${rid}.amount_recovered_cents == RecoveryRequest.${rid}.amount_cents  # invariant"
