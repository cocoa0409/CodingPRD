# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-identified resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, negative amounts, start >= end, invalid enum value" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Requested transition is not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_OWNER_NOT_ACTIVE, http: 409, condition: "Agreement activation requires Owner.status == ACTIVE" }
  - { id: ERR_AGREEMENT_NOT_ACTIVE, http: 409, condition: "Onboarding activation requires an ACTIVE ManagementAgreement for the property" }
  - { id: ERR_PENDING_OWNER_DECISION, http: 409, condition: "Agreement cannot be suspended while a Budget is SUBMITTED awaiting owner decision" }
  - { id: ERR_NO_RESIDENT_DATA, http: 409, condition: "Resident-data verification requires at least one Resident row for the property" }
  - { id: ERR_VENDOR_CONTRACTS_PENDING, http: 409, condition: "Vendor review cannot complete while any VendorContract for the property is PENDING" }
  - { id: ERR_OPEN_CLAIMS_BLOCK_EXIT, http: 409, condition: "Termination cannot complete while Claims for the property are OPEN or UNDER_REVIEW" }
  - { id: ERR_REFORECAST_REQUIRES_APPROVED_BASE, http: 409, condition: "REFORECAST budget must supersede an APPROVED budget for the same property and fiscal year" }
  - { id: ERR_SOD_VIOLATION, http: 409, condition: "Segregation of duties: budget approver/rejecter must differ from the submitting user" }
  - { id: ERR_PRICING_WINDOW_OVERLAP, http: 409, condition: "A PUBLISHED pricing recommendation already covers an overlapping window for this property+unit" }
  - { id: ERR_OVERRIDE_BAND_EXCEEDED, http: 409, condition: "Owner override rent deviates from the recommendation by more than MAX_OVERRIDE_BAND_PCT (0.10)" }
  - { id: ERR_STATEMENT_PERIOD_OPEN, http: 409, condition: "Statement cannot close before its period month has ended on the logical clock" }
  - { id: ERR_BOOKS_LOCKED, http: 409, condition: "Statement cannot be restated after any report package for the same property+period is DELIVERED" }
  - { id: ERR_DISTRIBUTION_WINDOW_MISSED, http: 409, condition: "Owner report delivered after the contractual distribution day plus 5-day grace" }
  - { id: ERR_LENDER_REPORT_OVERDUE, http: 409, condition: "Lender report for a disposition-listed property was not delivered by month-end (raised at advance_month)" }
  - { id: ERR_INCIDENT_OUTSIDE_TERM, http: 409, condition: "Manager-indemnified claim has incident_date outside [effective_date, term_end_date]" }
  - { id: ERR_RESERVE_OUTSTANDING, http: 409, condition: "OPEN claim cannot be closed directly while reserved_amount_cents > 0" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PortfolioManager
    description: "Manager-side executive: owns agreements, onboarding activation, staffing, clock and epoch control"
    identity: opaque
    exclusive_operations:
      - "POST /mgmt/owners — Create owner"
      - "POST /mgmt/owners/{id}/properties — Create property"
      - "POST /mgmt/owners/{id}/agreements — Create agreement"
      - "POST /mgmt/agreements/{id}/activate — Activate agreement (OCC)"
      - "POST /mgmt/agreements/{id}/suspend — Suspend agreement"
      - "POST /mgmt/agreements/{id}/resume — Resume agreement"
      - "POST /mgmt/agreements/{id}/complete_termination — Complete termination"
      - "POST /mgmt/onboardings/{id}/activate — Activate onboarding"
      - "POST /mgmt/onboardings/{id}/abort — Abort onboarding"
      - "POST /mgmt/properties/{id}/staff — Add staff position"
      - "POST /mgmt/advance_month — Advance epoch"
      - "POST /mgmt/_clock/set_current_utc — Set logical clock"
    shared_operations:
      - "POST /mgmt/properties/{id}/onboardings — Start onboarding (with PropertyAccountant)"
      - "All GET endpoints"
  - name: PropertyAccountant
    description: "Manager-side operator: onboarding data/ledger/vendor steps, budgets, ledger entries, statements, reports"
    identity: opaque
    exclusive_operations:
      - "POST /mgmt/properties/{id}/residents — Create resident"
      - "POST /mgmt/properties/{id}/vendor-contracts — Register vendor contract"
      - "POST /mgmt/vendor-contracts/{id}/resolve — Resolve vendor contract"
      - "POST /mgmt/budgets — Create budget"
      - "POST /mgmt/budgets/{id}/submit — Submit budget"
      - "POST /mgmt/properties/{id}/ledger-entries — Post ledger entry"
      - "POST /mgmt/properties/{id}/statements — Open statement"
      - "POST /mgmt/statements/{id}/close — Close statement"
      - "POST /mgmt/statements/{id}/restate — Restate statement"
      - "POST /mgmt/properties/{id}/reports — Create report package"
      - "POST /mgmt/reports/{id}/generate — Generate report"
      - "POST /mgmt/reports/{id}/deliver — Deliver report"
    shared_operations:
      - "POST /mgmt/properties/{id}/onboardings — Start onboarding (with PortfolioManager)"
      - "All GET endpoints"
  - name: OwnerRep
    description: "Owner-side representative: approves/rejects budgets, overrides pricing, initiates termination, drives disposition"
    identity: entity_backed:Owner
    exclusive_operations:
      - "POST /mgmt/budgets/{id}/approve — Approve budget (SoD)"
      - "POST /mgmt/budgets/{id}/reject — Reject budget (SoD)"
      - "POST /mgmt/pricing/{id}/override — Override published pricing"
      - "POST /mgmt/agreements/{id}/terminate — Initiate termination"
      - "POST /mgmt/properties/{id}/list_for_disposition — List for disposition"
      - "POST /mgmt/properties/{id}/complete_disposition — Complete disposition"
    shared_operations:
      - "All GET endpoints"
  - name: RevenueAnalyst
    description: "Manager-side revenue management: proposes and publishes pricing recommendations"
    identity: opaque
    exclusive_operations:
      - "POST /mgmt/properties/{id}/pricing — Create pricing recommendation"
      - "POST /mgmt/pricing/{id}/publish — Publish recommendation"
      - "POST /mgmt/pricing/{id}/withdraw — Withdraw recommendation"
    shared_operations:
      - "All GET endpoints"
  - name: RiskOfficer
    description: "Manager-side risk: files, reviews, settles, and closes claims within agreement risk allocation"
    identity: opaque
    exclusive_operations:
      - "POST /mgmt/properties/{id}/claims — File claim"
      - "POST /mgmt/claims/{id}/begin_review — Begin review"
      - "POST /mgmt/claims/{id}/settle — Settle claim (OCC)"
      - "POST /mgmt/claims/{id}/close — Close claim"
    shared_operations:
      - "All GET endpoints"

# Owner override band constant referenced by §1.4 priority 8 and PricingRecommendation.override
constants_note: |
  MAX_OVERRIDE_BAND_PCT = 0.10 — owner override rent must be within +/-10% of
  recommended_rent_cents (inclusive at the boundary; a deviation of exactly
  10% is permitted, 10%+1 cent is rejected).
