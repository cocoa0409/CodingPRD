        distinguishing_aspect: "Once last_completed_scan_at is stamped, kind INITIAL is permanently unavailable on that profile and returns ERR_INITIAL_SCAN_ALREADY_DONE even when the 7-day recurring interval has long elapsed."
        test_recipe:
          setup:
            - "FAMILY plan, ACTIVE account, ACTIVE profile with identifier, one completed INITIAL scan at 2026-05-01T00:00:00Z."
            - "Clock moved to 2026-06-01T00:00:00Z, far beyond the 7-day interval."
          setup_api_calls:
            - call: "POST /plans"
              payload: { tier: "FAMILY", name: "Family Shield", monthly_fee_cents: 2200, max_members: 4, profile_quota_per_cycle: 4, scan_quota_per_cycle: 12, removal_quota_per_cycle: 60, per_member_removal_subcap: 25 }
