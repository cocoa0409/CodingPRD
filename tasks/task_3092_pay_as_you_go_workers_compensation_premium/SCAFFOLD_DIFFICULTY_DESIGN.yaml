              as: PayrollProvider
              captures: { dd_adj2_status: $.data.status }
            - call: "POST /wc/payroll-reports"
              payload: { policy_id: "${dd_pol10_id}", period_start: "2026-09-14T23:59:59Z", period_end: "2026-09-22T00:00:00Z", idempotency_key: "adj-run-3", lines: [{state_code: "CA", class_code: "8810", gross_wages_cents: 10000000, ot_premium_cents: 0, severance_cents: 0, executive_wages_cents: 0, headcount: 1}] }
