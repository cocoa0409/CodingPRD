  - method: POST
    path: /branch-office/production-records/{id}/reverse
    description: Reverse a posted production record.
    roles: [HomeOfficeAdmin]
    code: 200
    input: []
    output: ProductionRecord
    side_effects: ["record.status -> REVERSED", "advisor.cumulative_commissions_cents recomputed"]
  - method: GET
    path: /branch-office/production-records
    description: List production records; optional advisor_id filter.
    roles: [HomeOfficeAdmin, Advisor]
    code: 200
    input: ["advisor_id?", "status?"]
    output: ProductionRecord[]
    side_effects: []

  # ---- Financial periods & charges ----
  - method: POST
    path: /branch-office/financial-periods
    description: Open a financial period for a branch.
    roles: [HomeOfficeAdmin]
    code: 201
    input: [branch_id, period_start, period_end]
