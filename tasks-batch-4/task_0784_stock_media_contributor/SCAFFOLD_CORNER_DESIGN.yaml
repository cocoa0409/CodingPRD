        claim_type: Cross-entity validation
        grounds: ["validations[priority=9]", state_machines.Asset.IN_REVIEW_to_ACCEPTED]
        distinguishing_aspect: "Same as above but the release is VERIFIED first: ACCEPT then succeeds and asset -> ACCEPTED."
