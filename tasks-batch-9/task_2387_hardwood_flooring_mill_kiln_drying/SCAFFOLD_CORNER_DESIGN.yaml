      - name: install_date_in_future_and_expired_warranty_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority 36]", "validations[priority 37]", "constants.WARRANTY_MONTHS"]
        distinguishing_aspect: "An installation dated 2026-09-01 against a 2026-08-20 clock is refused, a 2021-03-15 installation is past the 60 month window, and 2021-08-20 - exactly 60 months back - is still inside it."
        test_recipe:
          setup: ["A SOLID RED_OAK line (material 895 c/sf, funded 600000) with no claims. Logical clock 2026-08-20."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-20T00:00:00.000Z" }, as: MillAdmin }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: MillAdmin, captures: { species_id: "$.data.id" } }
            - { call: "POST /mill/product-lines", payload: { line_code: "SOLID-RO-325", species_profile_id: "${species_id}", construction_type: "SOLID", nominal_width_in: 3.250, nominal_thickness_in: 0.750, material_value_cents_per_sf: 895, warranty_funded_total_cents: 600000 }, as: MillAdmin, captures: { line_id: "$.data.id" } }
          trigger:
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 100, installation_date: "2026-09-01", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake" }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 100, installation_date: "2021-03-15", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake" }
            - { call: "POST /mill/warranty-claims", payload: { product_line_id: "${line_id}", claim_type: "CUPPING", affected_square_feet: 100, installation_date: "2021-08-20", subfloor_moisture_pct_at_install: 10.5, ambient_rh_pct_at_install: 62 }, as: WarrantyAdjudicator, as_user_id: "u_intake" }
          assert:
            - "2026-09-01: status 422 with data.error_id == \"ERR_INSTALL_DATE_IN_FUTURE\"."
            - "2021-03-15: status 422 with data.error_id == \"ERR_WARRANTY_PERIOD_EXPIRED\"."
            - "2021-08-20: status 201 with data.service_months == 60 and data.depreciation_pct == 30.0 (60 * 0.5, under the 40 cap)."
            - "GET /mill/warranty-claims?product_line_id={line_id} returns total_count 1 - only the in-window claim was written."

      - name: claim_state_versus_warranty_reserve_priority_order
        claim_type: priority_ordering
        grounds: ["validations[priority 15]", "validations[priority 51]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / claim_state_beats_warranty_reserve_insufficient"
          rationale: "The named §1.8 instance already adjudicates a claim whose liability exceeds the remaining reserve from a non-adjudicable state and asserts the state error wins over ERR_WARRANTY_RESERVE_INSUFFICIENT."

      - name: lot_not_graded_versus_prefinish_window_priority_order
        claim_type: priority_ordering
        grounds: ["validations[priority 24]", "validations[priority 34]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / lot_not_graded_beats_prefinish_window_invalid"
          rationale: "The named §1.8 instance schedules a prefinish run on a MILLED lot with an over-length window and asserts ERR_LOT_NOT_GRADED is returned instead of ERR_PREFINISH_WINDOW_INVALID."

  - section: endpoints
    instances:
      - name: yield_summary_computed_read_matches_both_yield_variants
