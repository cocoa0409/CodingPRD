              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id ERR_INSPECTOR_NOT_CERTIFIED"
            - "no inspection is created for that mine (filtered list is empty)"

      - name: late_fatal_accident_report_auto_issues_citation
        claim_type: Side Effect Execution
        grounds:
          - calculations.late_report_determination
          - state_machines.Accident
        distinguishing_aspect: "A FATAL accident reported 16 minutes after occurrence (limit 15, strict >) flips late_report true and synthesizes a fixed-factor citation whose proposed penalty is exactly 450000 cents (30 points through the pipeline)."
        test_recipe:
          setup:
            - "ACTIVE mine; clock at 2026-03-10T08:16:00Z at report time; accident occurred 2026-03-10T08:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-10T08:16:00Z" }
              as: MSHAAdmin
            - *mk_operator
            - *mk_mine_ug
          trigger:
            - call: "POST /msha/accidents"
              payload: { mine_id: "${m_id}", occurred_at: "2026-03-10T08:00:00Z", severity: "FATAL", description: "powered haulage fatality at the face" }
              as: OperatorRep
              as_user_id: "${op_id}"
              captures: { acc1: $.data.id }
            - call: "GET /msha/citations"
              payload: { mine_id: "${m_id}" }
              as: DistrictManager
          assert:
            - "Accident.${acc1}.late_report == true (960 seconds > 900-second FATAL limit)"
            - "exactly one citation exists at the mine: system_issued == true, inspection_id is null, negligence == MODERATE, standard_code == \"50.10 LATE REPORT\""
            - "the auto-citation's assessment shows points_total == 30 and proposed_penalty_cents == 450000"
            - "Accident.${acc1}.status == REPORTED (no investigation has started)"

      - name: cycle_close_early_requires_met_requirement
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.InspectionCycle.OPEN_to_DELINQUENT
          - errors.ERR_CYCLE_CLOSE_TOO_EARLY
        distinguishing_aspect: "An unmet cycle cannot be closed before its period fully elapses (ERR_CYCLE_CLOSE_TOO_EARLY at period_end or earlier), but once the requirement is met an early close succeeds as COMPLIANT — the statute never forgives, it only closes early when satisfied."
        test_recipe:
          setup:
            - "SURFACE mine activated 2026-01-01 with cycle 1 [2026-01-01, 2026-06-29]; EMERGENCY_RESPONSE plan approved; REGULAR inspection completed 2026-02-20."
