  - section: errors
    instances:
      - name: the_photo_leg_has_its_own_four_refusals
        claim_type: violation_to_error
        grounds:
          - validations[priority=22]
          - endpoints[POST /lending/draw-requests/{id}/photo-verification]
          - endpoints[POST /lending/draw-requests/{id}/inspection-visits]
          - validation_constants.PHOTO_MAX_REQUEST_CENTS
          - validation_constants.PHOTO_MIN_PHOTOS_PER_LINE
          - calculations.draw_release_amount
          - errors[ERR_VERIFICATION_METHOD_MISMATCH]
          - errors[ERR_PHOTO_REQUEST_TOO_LARGE]
          - errors[ERR_INSUFFICIENT_PHOTO_EVIDENCE]
        distinguishing_aspect: "The two verification legs are mutually exclusive in both directions (an INSPECTION draw refuses photo-verification and a PHOTO draw refuses a visit), the 3,000,000 photo ceiling is measured on requested_total_cents at verification time rather than at intake, the photo floor is 3 per allocation so 2 fails and 3 passes on a one-line request, and the accepted photo leg then releases 600,000 where the inspection leg on the same line would have released 675,000."
        test_recipe:
          setup:
            - "loan1 with l1 4,000,000 (c1) / l2 3,500,000 (c1) / l3 2,500,000 (c2); waivers 3,400,000 for c1 and 700,000 for c2"
            - "draw d1 already SUBMITTED with verification_method INSPECTION over all three lines"
            - "PHOTO_MAX_REQUEST_CENTS 3,000,000, PHOTO_MIN_PHOTOS_PER_LINE 3, PHOTO_MAX_PCT 0.50, photo retainage 20%"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
