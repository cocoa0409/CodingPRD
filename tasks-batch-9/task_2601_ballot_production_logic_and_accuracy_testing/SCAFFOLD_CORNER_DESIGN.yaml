              captures: { cust: $.data.custody_status, prog: $.data.program_status, seal: $.data.seal_number }
            - call: "GET /precincts/${pr}"
              payload: {}
              as: WarehouseCustodian
              captures: { pr_status: $.data.deployment_status }
            - call: "GET /elections/${el}/custody-events"
              payload: { subject_id: "${tab}", event_type: "RETURN" }
              as: WarehouseCustodian
          assert:
            - "${el_status} == \"POLLS_CLOSED\"."
            - "${cust} == \"RETURNED\" and ${seal} == \"SEAL-TAB-1\": the seal is retained on recall, so ${seals} == 1 - the same value as before the call."
            - "${prog} == \"LA_PASSED\": the program axis is not touched by a custody-axis cascade."
            - "${pr_status} == \"NOT_READY\" and ${readiness} == \"BLOCKED\", both recomputed as a consequence of the unit leaving DEPLOYED rather than written directly."
            - "Exactly one RETURN custody row exists for ${tab}, with from_state \"DEPLOYED\", to_state \"RETURNED\" and actor_user_id \"system\" (cascade-generated, not attributed to the director)."
            - "BallotLot rows are untouched: lot L-003 is still ISSUED and lots L-001/L-002 are still RETURNED with their counts intact."

      - name: sm_candidate_disqualification_recompacts_order_and_voids_decks
        claim_type: conditional_cascade
        grounds:
          - state_machines.Candidate.CERTIFIED_to_DISQUALIFIED
          - calculations.candidate_ballot_order
          - state_machines.TestDeck.DRAFT_to_VOIDED
        distinguishing_aspect: "Hop 2 and hop 3 run only because the ordering was already frozen (election.status != SETUP): the surviving siblings are recompacted to a gap-free 0-based index and the DRAFT deck built on the covering style is VOIDED, whereas the FILED -> DISQUALIFIED edge in SETUP fires neither hop."
        test_recipe:
          setup:
            - "Election in CONTESTS_CERTIFIED with a certified 1-seat contest holding three CERTIFIED candidates (Alvarez 0, Brooks 1, Chen 2), an APPROVED style S-100 covering D-12, and a DRAFT test deck whose expected_marks reference Brooks."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ben Brooks", ballot_name: "Brooks", filing_received_at: "2026-06-02T09:00:00Z", party_code: "GRN" }
              as: BallotCoordinator
              captures: { c_bro: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Cai Chen", ballot_name: "Chen", filing_received_at: "2026-06-03T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_che: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { pr: $.data.id }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
