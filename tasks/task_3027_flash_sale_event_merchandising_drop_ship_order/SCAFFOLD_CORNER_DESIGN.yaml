              captures: { event_id: $.data.id }
            - call: "POST /listings"
              payload: { event_id: "${event_id}", vendor_sku: "NW-SAGA-1", unit_price_cents: 600, vendor_unit_cost_cents: 300, allocation_units: 5, reveal_at: "2026-09-01T00:00:00Z" }
              as: Merchandiser
              captures: { listing_id: $.data.id }
            - call: "POST /events/${event_id}/schedule"
              payload: {}
