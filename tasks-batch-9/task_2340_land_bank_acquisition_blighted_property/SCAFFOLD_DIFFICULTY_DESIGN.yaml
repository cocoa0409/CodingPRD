              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { pk_id: $.data.id }
            - call: "POST /land-bank/acquisition-packets/${pk_id}/board-approval"
              payload: { resolution_no: "R-2026-191" }
              as: BoardClerk
              as_user_id: "clerk-1"
