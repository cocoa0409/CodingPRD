      - name: prescriber_approval_cascades_four_levels_to_the_cycle
        grounds:
          - endpoints.POST_/pharmacy/refill-authorizations/{id}/respond
          - state_machines.Prescription.PENDING_AUTHORIZATION_to_ACTIVE
          - state_machines.FillCycle.EDITS_PENDING_to_CLEARED
          - entities.CycleLine.fields.line_status
          - entities.FillCycle.fields.total_copay_cents
        distinguishing_aspect: |
          Trigger: the PRESCRIBER's authorization response. Depth 4 along
          RefillAuthorizationRequest -> Prescription -> CycleLine -> FillCycle, with a
          fifth observable consequence (the roll can now be generated). Every hop is a
          FORWARD unblocking: refills are restored, the held line is revived and dispensed,
          the cycle's money is recomputed and its insurance dimension clears.
