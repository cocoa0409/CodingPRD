            - call: "POST /cases/${case_id}/quotes"
              payload: { valid_until: "2026-12-31T00:00:00Z", expected_case_version: "${case_v}" }
              as: ProjectManager
              captures: { quote_id: $.data.id }
          trigger:
            - call: "POST /cases/${case_id}/quotes/${quote_id}/submit"
              payload: {}
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
