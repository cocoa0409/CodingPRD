# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Driver Record Verification & Interstate Data Exchange
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and is replayable from
# empty-DB via its setup_api_calls chain (default logical clock 2026-09-01T00:00:00Z).
# =============================================================================

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: dues_provisional_vs_audited_settlement
        grounds:
          - calculations.annual_dues_assessment
          - calculations.audited_dues_settlement
          - entities.FeeInvoice.fields.provisional_amount_cents
          - entities.FeeInvoice.fields.final_amount_cents
        distinguishing_aspect: |
          FeeInvoice domain: the provisional variant (annual formula on projected_volume with the
          pinned multiplier, single rounding) yields 2600000 cents while the audited variant
          (per-quarter rounding then sum) yields 2625000 cents on the same invoice — two valid
          algorithms, two different settled amounts, delta recorded as adjustment_amount_cents.
        test_recipe:
          setup:
            - "Jurisdiction AA is ACTIVE with exactly one CERTIFIED participation (POINTER_NETWORK), so certified_count_at_issue pins to 1 and the multiplier is 1.00"
            - "An ISSUED FeeInvoice for fiscal_year 2027 with projected_volume 8000 exists and has been SETTLED at its provisional amount"
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/fee-invoices"
              payload: { jurisdiction_id: "${j_a}", fiscal_year: 2027, projected_volume: 8000 }
              as: AssociationAdmin
              captures: { f_id: $.data.id }
            - call: "POST /driver-exchange/fee-invoices/${f_id}/settle"
              payload: { amount_cents: 2600000 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
          trigger:
            - call: "POST /driver-exchange/fee-invoices/${f_id}/finalize-audit"
              payload: { actual_volume_quarters: [1000, 2000, 3000, 4000] }
              as: AuditAuthority
          assert:
            - "FeeInvoice.${f_id}.provisional_amount_cents == 2600000 (2500000 + 12.5*8000*1.00, single rounding)"
            - "FeeInvoice.${f_id}.final_amount_cents == 2625000 (quarter charges 637500 + 650000 + 662500 + 675000)"
            - "FeeInvoice.${f_id}.adjustment_amount_cents == 25000"
            - "FeeInvoice.${f_id}.settled_amount_cents == 2600000"
            - "FeeInvoice.${f_id}.status == AUDITED"

      - name: driver_points_offense_vs_conviction_window
        grounds:
          - calculations.driver_points_total
          - entities.DriverRecord.fields.points_total
          - entities.DriverRecord.fields.abstract_points_total
        distinguishing_aspect: |
          DriverRecord domain: the offense_window variant keys the trailing 1095-day window on
          offense_date while the conviction_window variant keys it on conviction_date; one conviction
          whose offense_date (2023-01-15) lies outside the offense window but whose conviction_date
          (2026-08-25) lies inside the conviction window makes the two variants return 5 vs 11 on
          the identical conviction set — a different entity domain than the dues dual-variant instance.
        test_recipe:
          setup:
            - "Jurisdiction AA is ACTIVE with CERTIFIED POINTER_NETWORK and COMMERCIAL_DRIVER_NETWORK participations"
            - "Driver D exists; AA holds D's ACTIVE DriverRecord (DriverIdentity.version advanced to 2 by the record claim)"
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "COMMERCIAL_DRIVER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a2}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a2}/complete"
              payload: { result: "PASSED", score: 95 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a2}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Driver One", date_of_birth: "1990-01-01", ssn_last4_hash: "h1234", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d_id}", expected_driver_version: "${d_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { r_id: $.data.id }
            - call: "POST /driver-exchange/convictions"
              payload: { record_id: "${r_id}", offense_date: "2023-01-15", conviction_date: "2026-08-25", severity: "NON_CMV", points: 6 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
          trigger:
            - call: "POST /driver-exchange/convictions"
              payload: { record_id: "${r_id}", offense_date: "2026-08-01", conviction_date: "2026-08-20", severity: "NON_CMV", points: 5 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
            - call: "GET /driver-exchange/driver-records/${r_id}"
              payload: {}
              as: AuditAuthority
          assert:
            - "DriverRecord.${r_id}.points_total == 5 (offense window [2023-09-02, 2026-09-01] excludes the 2023-01-15 offense, includes 2026-08-01)"
            - "DriverRecord.${r_id}.abstract_points_total == 11 (conviction window includes both conviction_date 2026-08-25 and 2026-08-20)"
            - "No Disqualification exists for the record: 11 < POINTS_THRESHOLD 12 and no CMV_MAJOR conviction"

  - rule_id: combinatorial_formula
    instances:
      - name: dues_multiplier_tier_cap_interplay
        grounds:
          - calculations.annual_dues_assessment
          - entities.FeeInvoice.fields.certified_count_at_issue
        distinguishing_aspect: |
          Mode (a): three-input non-linear interaction — marginal tier selection on volume 60000
          (125000 + 420000 + 85000 = 630000 cents), a participation-count multiplier
          max(0.85, 1 - 0.05*(2-1)) = 0.95, and the cap min(20000000, ...) combine as
          round(2500000 + 630000*0.95) = 3098500.
        test_recipe:
          setup:
            - "Jurisdiction AA is ACTIVE with TWO CERTIFIED participations (POINTER_NETWORK and TITLE_NETWORK), so certified_count_at_issue pins to 2"
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_2" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "TITLE_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a2}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a2}/complete"
              payload: { result: "PASSED", score: 91 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a2}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
          trigger:
            - call: "POST /driver-exchange/fee-invoices"
              payload: { jurisdiction_id: "${j_a}", fiscal_year: 2027, projected_volume: 60000 }
              as: AssociationAdmin
              captures: { f_id: $.data.id }
          assert:
            - "FeeInvoice.${f_id}.certified_count_at_issue == 2"
            - "FeeInvoice.${f_id}.provisional_amount_cents == 3098500 (2500000 + round(630000 * 0.95))"
            - "FeeInvoice.${f_id}.status == ISSUED"

      - name: audit_quarterly_rounding_order
        grounds:
          - calculations.audited_dues_settlement
          - entities.FeeInvoice.fields.adjustment_amount_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the pinned rule rounds each quarter's
          charge half-up to whole cents THEN sums; quarters [7,7,0,0] each contain the fractional
          625087.5 which rounds to 625088 twice, so the audited total 2500176 exceeds the
          single-annual-rounding result 2500175 (provisional on the same total volume 14) by
          exactly 1 cent.
        test_recipe:
          setup:
            - "Jurisdiction AA is ACTIVE with one CERTIFIED POINTER_NETWORK participation (multiplier 1.00)"
            - "An ISSUED invoice with projected_volume 14 has been SETTLED at 2500175 cents"
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_3" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/fee-invoices"
              payload: { jurisdiction_id: "${j_a}", fiscal_year: 2027, projected_volume: 14 }
              as: AssociationAdmin
              captures: { f_id: $.data.id }
            - call: "POST /driver-exchange/fee-invoices/${f_id}/settle"
              payload: { amount_cents: 2500175 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
          trigger:
            - call: "POST /driver-exchange/fee-invoices/${f_id}/finalize-audit"
              payload: { actual_volume_quarters: [7, 7, 0, 0] }
              as: AuditAuthority
          assert:
            - "FeeInvoice.${f_id}.provisional_amount_cents == 2500175"
            - "FeeInvoice.${f_id}.final_amount_cents == 2500176 (625088 + 625088 + 625000 + 625000)"
            - "FeeInvoice.${f_id}.adjustment_amount_cents == 1"
            - "The 1-cent delta exists ONLY because rounding happens per quarter; annual-then-round on total volume 14 would give 2500175"

      - name: dq_duration_points_prior_multiplier
        grounds:
          - calculations.disqualification_duration
          - calculations.driver_points_total
        distinguishing_aspect: |
          Mode (c): circular-looking dependency with pinned evaluation order — the just-posted
          conviction is included in points_total BEFORE the threshold test, then the prior-count
          multiplier applies: first AUTO_POINTS disqualification runs 90 days (2026-09-01 ->
          2026-11-30); after it completes, a second crossing with prior_count == 1 doubles to
          180 days (2026-12-15 -> 2027-06-13).
        test_recipe:
          setup:
            - "Jurisdiction AA is ACTIVE with CERTIFIED POINTER_NETWORK and COMMERCIAL_DRIVER_NETWORK participations"
            - "Driver D's ACTIVE record is held by AA; one 7-point NON_CMV conviction is already posted (points_total == 7)"
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "COMMERCIAL_DRIVER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a2}", window_start: "2026-08-01T00:00:00Z", window_end: "2027-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a2: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a2}/complete"
              payload: { result: "PASSED", score: 95 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a2}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Driver Three", date_of_birth: "1985-05-05", ssn_last4_hash: "h9999", lawful_status_basis: "US_CITIZEN" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d_id}", expected_driver_version: "${d_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { r_id: $.data.id }
            - call: "POST /driver-exchange/convictions"
              payload: { record_id: "${r_id}", offense_date: "2026-08-10", conviction_date: "2026-08-20", severity: "NON_CMV", points: 7 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
          trigger:
            - call: "POST /driver-exchange/convictions"
              payload: { record_id: "${r_id}", offense_date: "2026-08-12", conviction_date: "2026-08-21", severity: "NON_CMV", points: 5 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
            - call: "POST /driver-exchange/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-15T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/convictions"
              payload: { record_id: "${r_id}", offense_date: "2026-12-01", conviction_date: "2026-12-10", severity: "NON_CMV", points: 1 }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
          assert:
            - "After the 5-point posting the record's points_total == 12 (7+5) and exactly one Disqualification exists with basis == AUTO_POINTS, start_date == 2026-09-01, end_date == 2026-11-30 (90 days, prior_count 0)"
            - "At clock 2026-12-15 the first disqualification's derived status == COMPLETED (2026-12-15 > 2026-11-30)"
            - "The 1-point posting at 2026-12-15 recomputes points_total == 13 (all three convictions inside the 1095-day window) which is >= 12, so a second Disqualification is created"
            - "The second disqualification has basis == AUTO_POINTS, start_date == 2026-12-15, end_date == 2027-06-13 (90 * min(1+1, 3) = 180 days)"
            - "Exactly two Disqualifications exist on the record (no interval merge: the first was already COMPLETED, not ACTIVE)"
  - rule_id: non_linear_state_machine
    instances:
      - name: license_transfer_contest_loop
        grounds:
          - state_machines.LicenseTransfer.SURRENDER_RECORDED_to_CONTESTED
          - state_machines.LicenseTransfer.CONTESTED_to_SURRENDER_RECORDED
          - state_machines.License.ACTIVE_to_SURRENDERED
          - state_machines.License.SURRENDERED_to_ACTIVE
        distinguishing_aspect: |
          LicenseTransfer is cyclic: SURRENDER_RECORDED -> CONTESTED -> SURRENDER_RECORDED loops
          (contest compensation restores the prior license to ACTIVE, re-surrender suspends it
          again) before the loop exits to COMPLETED — not a linear pipeline.
        test_recipe:
          setup:
            - "Jurisdictions AA and BB are both ACTIVE with CERTIFIED POINTER_NETWORK participations"
            - "Driver D's ACTIVE record is held by AA; D holds an ACTIVE STANDARD license issued by AA (both verification dimensions VERIFIED)"
          setup_api_calls:
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "AA", name: "State A", fee_tier: "TIER_1" }
              as: AssociationAdmin
              captures: { j_a: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_a}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { p_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_a}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_a: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_a}/complete"
              payload: { result: "PASSED", score: 97 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_a}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_a}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/jurisdictions"
              payload: { code: "BB", name: "State B", fee_tier: "TIER_2" }
              as: AssociationAdmin
              captures: { j_b: $.data.id }
            - call: "POST /driver-exchange/system-participations"
              payload: { jurisdiction_id: "${j_b}", system: "POINTER_NETWORK" }
              as: JurisdictionRegistrar
              as_user_id: "${j_b}"
              captures: { p_b: $.data.id }
            - call: "POST /driver-exchange/connection-certifications"
              payload: { participation_id: "${p_b}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: CertificationEngineer
              captures: { c_b: $.data.id }
            - call: "POST /driver-exchange/connection-certifications/${c_b}/complete"
              payload: { result: "PASSED", score: 96 }
              as: CertificationEngineer
            - call: "POST /driver-exchange/system-participations/${p_b}/grant-certification"
              payload: {}
              as: AssociationAdmin
            - call: "PATCH /driver-exchange/jurisdictions/${j_b}"
              payload: { status: "ACTIVE" }
              as: AssociationAdmin
            - call: "POST /driver-exchange/drivers"
              payload: { full_name: "Driver Four", date_of_birth: "1988-03-03", ssn_last4_hash: "h4444", lawful_status_basis: "PERMANENT_RESIDENT" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { d_id: $.data.id, d_v: $.data.version }
            - call: "POST /driver-exchange/driver-records"
              payload: { driver_id: "${d_id}", expected_driver_version: "${d_v}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { r_id: $.data.id }
            - call: "POST /driver-exchange/licenses"
              payload: { driver_id: "${d_id}", license_class: "STANDARD" }
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
              captures: { l_id: $.data.id }
            - call: "POST /driver-exchange/licenses/${l_id}/verification-results"
              payload: { check_type: "SSN", result: "VERIFIED" }
              as: FederalVerifier
            - call: "POST /driver-exchange/licenses/${l_id}/verification-results"
              payload: { check_type: "LAWFUL_STATUS", result: "VERIFIED" }
              as: FederalVerifier
            - call: "GET /driver-exchange/drivers/${d_id}"
              payload: {}
              as: AssociationAdmin
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /driver-exchange/license-transfers"
              payload: { driver_id: "${d_id}", prior_license_id: "${l_id}", expected_driver_version: "${d_v2}" }
              as: JurisdictionRegistrar
              as_user_id: "${j_b}"
              captures: { t_id: $.data.id }
            - call: "POST /driver-exchange/license-transfers/${t_id}/record-surrender"
              payload: {}
              as: JurisdictionRegistrar
              as_user_id: "${j_a}"
            - call: "POST /driver-exchange/license-transfers/${t_id}/contest"
              payload: { reason: "DATA_MISMATCH" }
              as: JurisdictionRegistrar
              as_user_id: "${j_b}"
            - call: "GET /driver-exchange/licenses/${l_id}"
              payload: {}
              as: AssociationAdmin
