            - "Second read: total_prize_value_cents == 96000, total_withheld_cents == 8640, disbursed_award_count == 2"

  # ================================================== validations
  - section: validations
    instances:
      - name: missing_headers_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected 401 before any role check; the unit test sends the raw request without auth headers."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: Anonymous, captures: { err: $.data.error_id } }
          assert:
            - "401 ERR_UNAUTHENTICATED (headers absent; recipe's `as` documents intended role absence — the test omits the headers entirely)"

      - name: banned_prop_declaration_returns_422
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_PROP_BANNED]"]
        distinguishing_aspect: "prop_declarations containing LIVE_STEEL are rejected at entry creation regardless of contest window compliance."
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN; category OPEN; contestant exists"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Armor", skill_division: "MASTERS", max_entries: 5, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "Sharp", prop_declarations: ["LIVE_STEEL"] }, as: Contestant, as_user_id: "${c1}", captures: { err: $.data.error_id } }
          assert:
            - "422 ERR_PROP_BANNED; no entry persisted"

      - name: category_full_at_quota_boundary
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_CATEGORY_FULL]", entities.Category.fields.entry_count]
        distinguishing_aspect: "Boundary: entry_count == max_entries rejects the next entry (>= semantics); the first entry at count 0 of max 1 succeeds."
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN; category max_entries 1 with one entry already present; second contestant ready"]
          setup_api_calls:
            - { call: "POST /contest-events", payload: { name: "CosCon", start_at: "2026-08-15T09:00:00Z", end_at: "2026-08-15T22:00:00Z", prize_budget_cents: 50000 }, as: ContestLead, captures: { cont: $.data.id } }
            - { call: "POST /categories", payload: { contest_id: "${cont}", name: "Tiny", skill_division: "NOVICE", max_entries: 1, tabulation_method: "WEIGHTED_MEAN", prize_purse_cents: 30000 }, as: ContestLead, captures: { cat: $.data.id } }
            - { call: "POST /contest-events/${cont}/transition", payload: { to: "REGISTRATION_OPEN" }, as: ContestLead }
            - { call: "POST /contestants", payload: { full_name: "C One", email: "c1@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c1: $.data.id } }
            - { call: "POST /contestants", payload: { full_name: "C Two", email: "c2@x.com", birth_date: "1990-01-01" }, as: Anonymous, captures: { c2: $.data.id } }
            - { call: "POST /entries", payload: { contestant_id: "${c1}", category_id: "${cat}", title: "E1", prop_declarations: [] }, as: Contestant, as_user_id: "${c1}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /entries", payload: { contestant_id: "${c2}", category_id: "${cat}", title: "E2", prop_declarations: [] }, as: Contestant, as_user_id: "${c2}", captures: { err: $.data.error_id } }
          assert:
            - "409 ERR_CATEGORY_FULL (count 1 == max_entries 1 at the boundary)"

      - name: duplicate_entry_same_category_returns_409
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_ENTRY]"]
        distinguishing_aspect: "One non-terminal entry per (contestant, category): the second create for the same pair is rejected even though the category has spare quota."
        test_recipe:
          setup: ["Contest REGISTRATION_OPEN; category max_entries 5; contestant c1 already has a SUBMITTED entry in it"]
