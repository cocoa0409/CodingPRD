scaffold_difficulty_design:

  # ===================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_charge_seasonal_overage_vs_within_allowance
        grounds:
          - calculations.VisitChargeAssessment
          - state_machines.ServiceVisit.ON_SITE_to_COMPLETED
          - entities.ServiceVisit.fields.billable_charge_cents
          - entities.ServicePlan.fields.included_visits_per_year
        distinguishing_aspect: |
          Operates on the ServiceVisit/Membership billing domain: the 3rd SEASONAL
          completion (prior_completed+1 = 3 > included 2) charges extra_visit_fee_cents
          8500 while the 1st/2nd completions charge 0 for identical visit data.
        test_recipe:
          setup:
            - "Clock at 2026-07-01T00:00:00Z; PLUS HVAC plan (included_visits_per_year=2, extra_visit_fee_cents=8500); customer + site (region NORTH); ACTIVE membership; EPA tech in NORTH/HVAC, capacity 5"
            - "Two SEASONAL visits already COMPLETED this term (visits_consumed=2, both billed 0); customer balance is 24000 from the annual fee"
            - "A third SEASONAL visit booked, dispatched, en route, on site, ready to complete"
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Ana Reyes", email: "ana@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "1 Pine St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/technicians"
              payload: { full_name: "Tom HVAC", region_code: "NORTH", trade: "HVAC", epa_certified: true, daily_visit_capacity: 5 }
              as: ContractAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "SEASONAL", requested_at: "2026-07-01T08:00:00Z", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { v1_id: $.data.id }
            - call: "POST /home-services/service-visits/${v1_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /home-services/service-visits/${v1_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v1_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v1_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "SEASONAL", requested_at: "2026-07-03T08:00:00Z", window_start: "2026-07-04T09:00:00Z", window_end: "2026-07-04T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { v2_id: $.data.id }
            - call: "POST /home-services/service-visits/${v2_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /home-services/service-visits/${v2_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v2_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v2_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "SEASONAL", requested_at: "2026-07-05T08:00:00Z", window_start: "2026-07-06T09:00:00Z", window_end: "2026-07-06T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { v3_id: $.data.id }
            - call: "POST /home-services/service-visits/${v3_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /home-services/service-visits/${v3_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v3_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /home-services/service-visits/${v3_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
              captures: { v3_charge: $.data.billable_charge_cents }
          assert:
            - "ServiceVisit.${v3_id}.billable_charge_cents == 8500"
            - "Customer.${cust_id}.billing_balance_cents == 32500"
            - "Membership.${mem_id}.visits_consumed == 3"

      - name: warranty_settlement_partial_vs_full_credit_on_customer_ledger
        grounds:
          - calculations.WarrantyClaimSettlement
          - state_machines.WarrantyClaim.APPROVED_to_SETTLED
          - entities.WarrantyClaim.fields.approved_amount_cents
          - entities.Customer.fields.billing_balance_cents
        distinguishing_aspect: |
          Operates on the WarrantyClaim/Customer ledger domain (a different entity
          domain than VisitChargeAssessment's visit billing): a partial approval of
          30000 against a 50000 claim credits the ledger by exactly 30000, not the
          full claimed amount, yielding balance 24000-30000 = -6000.
        test_recipe:
          setup:
            - "Clock 2026-07-01T00:00:00Z; PLUS HVAC plan; ACTIVE membership; customer balance 24000 from annual fee"
            - "Equipment IN_WARRANTY at the site; a COMPLETED WARRANTY visit surfaced the defect; a WarrantyClaim claimed_amount_cents=50000 is UNDER_REVIEW then APPROVED for 30000"
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Ben Cole", email: "ben@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "2 Oak St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/equipment"
              payload: { site_id: "${site_id}", model: "AC-9", refrigerant_type: "R410A", nameplate_charge_grams: 4000, warranty_expires_at: "2030-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /home-services/technicians"
              payload: { full_name: "Tom HVAC", region_code: "NORTH", trade: "HVAC", epa_certified: true, daily_visit_capacity: 5 }
              as: ContractAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "WARRANTY", requested_at: "2026-07-01T08:00:00Z", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { wv_id: $.data.id }
            - call: "POST /home-services/service-visits/${wv_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /home-services/service-visits/${wv_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${wv_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${wv_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/warranty-claims"
              payload: { equipment_id: "${eq_id}", origin_visit_id: "${wv_id}", claimed_amount_cents: 50000 }
              as: ContractAdmin
              captures: { claim_id: $.data.id }
            - call: "POST /home-services/warranty-claims/${claim_id}/start-review"
              payload: {}
              as: ContractAdmin
            - call: "POST /home-services/warranty-claims/${claim_id}/approve"
              payload: { approved_amount_cents: 30000 }
              as: ContractAdmin
          trigger:
            - call: "POST /home-services/warranty-claims/${claim_id}/settle"
              payload: {}
              as: ContractAdmin
          assert:
            - "WarrantyClaim.${claim_id}.status == SETTLED"
            - "WarrantyClaim.${claim_id}.approved_amount_cents == 30000"
            - "Customer.${cust_id}.billing_balance_cents == -6000"

  # ===================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: part_charge_round_per_line_then_sum_order_pinned
        grounds:
          - calculations.PartChargeRounding
          - state_machines.ServiceVisit.ON_SITE_to_COMPLETED
          - entities.PartUsage.fields.charged_cents
          - entities.Customer.fields.billing_balance_cents
        distinguishing_aspect: |
          Mode (b) nested-rounding-where-order-matters: two part lines (125@10% ->
          112.5 -> 113; 135@10% -> 121.5 -> 122) rounded PER LINE then summed give
          235, whereas sum-then-round (round(112.5+121.5)=234) would give 234. The
          scaffold pins round-then-sum, so the customer balance reflects +235.
        test_recipe:
          setup:
            - "Clock 2026-07-01T00:00:00Z; PLUS HVAC plan parts_discount_pct=0.10; ACTIVE membership; customer balance 24000 from annual fee"
            - "A SEASONAL visit dispatched and ON_SITE with the assigned EPA tech"
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Cleo Park", email: "cleo@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "3 Elm St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/technicians"
              payload: { full_name: "Tom HVAC", region_code: "NORTH", trade: "HVAC", epa_certified: true, daily_visit_capacity: 5 }
              as: ContractAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "SEASONAL", requested_at: "2026-07-01T08:00:00Z", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { v_id: $.data.id }
            - call: "POST /home-services/service-visits/${v_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /home-services/service-visits/${v_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v_id}/part-usages"
              payload: { part_name: "Capacitor", quantity: 1, list_price_cents: 125 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { part1_charge: $.data.charged_cents }
          trigger:
            - call: "POST /home-services/service-visits/${v_id}/part-usages"
              payload: { part_name: "Contactor", quantity: 1, list_price_cents: 135 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { part2_charge: $.data.charged_cents }
          assert:
            - "PartUsage(part1).charged_cents == 113"
            - "PartUsage.${part2_charge} == 122"
            - "Customer.${cust_id}.billing_balance_cents == 24235"

      - name: refrigerant_running_balance_evaluation_order_pinned
        grounds:
          - calculations.RefrigerantMassBalance
          - state_machines.ServiceVisit.ON_SITE_to_COMPLETED
          - entities.Equipment.fields.current_charge_grams
          - validations[priority=10]
        distinguishing_aspect: |
          Mode (c) order-dependent accumulator: current_charge_grams is the running
          fold nameplate + sum(ADD) - sum(RECOVER) processed in created_at ASC order,
          and each posting is validated against the cumulative balance. Posting RECOVER
          600 (4000->3400) then ADD 600 (3400->4000) is well-defined only because the
          evaluation order is pinned; the net is exactly nameplate 4000.
        test_recipe:
          setup:
            - "Clock 2026-07-01T00:00:00Z; equipment nameplate_charge_grams=4000 R410A IN_WARRANTY; ACTIVE membership; SEASONAL visit ON_SITE with assigned EPA tech"
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Dot Lin", email: "dot@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "4 Ash St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/equipment"
              payload: { site_id: "${site_id}", model: "AC-9", refrigerant_type: "R410A", nameplate_charge_grams: 4000, warranty_expires_at: "2030-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /home-services/technicians"
              payload: { full_name: "Tom HVAC", region_code: "NORTH", trade: "HVAC", epa_certified: true, daily_visit_capacity: 5 }
              as: ContractAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/service-visits"
              payload: { membership_id: "${mem_id}", visit_kind: "SEASONAL", requested_at: "2026-07-01T08:00:00Z", window_start: "2026-07-02T09:00:00Z", window_end: "2026-07-02T11:00:00Z", expected_membership_version: "${mem_v1}" }
              as: Dispatcher
              captures: { v_id: $.data.id }
            - call: "POST /home-services/service-visits/${v_id}/dispatch"
              payload: { technician_id: "${tech_id}" }
              as: Dispatcher
            - call: "POST /home-services/service-visits/${v_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /home-services/service-visits/${v_id}/refrigerant-logs"
              payload: { equipment_id: "${eq_id}", action: "RECOVER", grams: 600 }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /home-services/service-visits/${v_id}/refrigerant-logs"
              payload: { equipment_id: "${eq_id}", action: "ADD", grams: 600 }
              as: Technician
              as_user_id: "${tech_id}"
          assert:
            - "Equipment.${eq_id}.current_charge_grams == 4000"

  # ===================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: membership_renewal_cycle_returns_to_active
        grounds:
          - state_machines.Membership.ACTIVE_to_RENEWAL_PENDING
          - state_machines.Membership.RENEWAL_PENDING_to_ACTIVE
          - entities.Membership.fields.term_index
        distinguishing_aspect: |
          Cycle on Membership: ACTIVE -> RENEWAL_PENDING -> ACTIVE. Accepting the
          renewal offer returns the membership to ACTIVE with term_index incremented
          from 1 to 2 and a fresh term window — a true loop, not a linear pipeline.
        test_recipe:
          setup:
            - "Clock 2026-07-01T00:00:00Z; PLUS HVAC plan; ACTIVE membership (term_index 1); a PENDING renewal offer exists (membership now RENEWAL_PENDING)"
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Eve Noor", email: "eve@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "5 Fir St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /home-services/memberships/${mem_id}/activate"
              payload: {}
              as: ContractAdmin
              captures: { mem_v1: $.data.version }
            - call: "POST /home-services/memberships/${mem_id}/renewal-offers"
              payload: { offered_plan_id: "${plan_id}", expires_at: "2027-06-30T00:00:00Z", expected_membership_version: "${mem_v1}" }
              as: ContractAdmin
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /home-services/renewal-offers/${offer_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          assert:
            - "RenewalOffer.${offer_id}.status == ACCEPTED"
            - "Membership.${mem_id}.status == ACTIVE"
            - "Membership.${mem_id}.term_index == 2"

      - name: warranty_claim_fork_join_approve_vs_deny_divergent_effects
        grounds:
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_DENIED
          - entities.Equipment.fields.warranty_status
        distinguishing_aspect: |
          Branching fork on WarrantyClaim (a different entity than Membership):
          UNDER_REVIEW forks to either APPROVED (sets approved_amount_cents, warranty
          untouched) or DENIED (sets approved 0 AND cascades Equipment.warranty_status
          to VOIDED) — divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Clock 2026-07-01T00:00:00Z; equipment IN_WARRANTY; a WARRANTY visit COMPLETED; a WarrantyClaim UNDER_REVIEW (claimed 50000)"
          setup_api_calls:
            - call: "POST /home-services/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /home-services/service-plans"
              payload: { tier: "PLUS", trade: "HVAC", annual_fee_cents: 24000, included_visits_per_year: 2, extra_visit_fee_cents: 8500, sla_response_hours: 4, parts_discount_pct: 0.10 }
              as: ContractAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /home-services/customers"
              payload: { full_name: "Finn Rao", email: "finn@x.com" }
              as: ContractAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /home-services/sites"
              payload: { customer_id: "${cust_id}", address: "6 Gum St", region_code: "NORTH" }
              as: ContractAdmin
              captures: { site_id: $.data.id }
            - call: "POST /home-services/equipment"
              payload: { site_id: "${site_id}", model: "AC-9", refrigerant_type: "R410A", nameplate_charge_grams: 4000, warranty_expires_at: "2030-01-01T00:00:00Z" }
              as: ContractAdmin
              captures: { eq_id: $.data.id }
            - call: "POST /home-services/technicians"
              payload: { full_name: "Tom HVAC", region_code: "NORTH", trade: "HVAC", epa_certified: true, daily_visit_capacity: 5 }
              as: ContractAdmin
              captures: { tech_id: $.data.id }
            - call: "POST /home-services/memberships"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", plan_id: "${plan_id}" }
              as: ContractAdmin
              captures: { mem_id: $.data.id }
