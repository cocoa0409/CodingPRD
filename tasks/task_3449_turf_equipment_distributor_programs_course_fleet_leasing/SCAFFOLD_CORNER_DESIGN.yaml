# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Turf Equipment Distributor Programs & Course Fleet Leasing
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: distributor_create_missing_name_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Distributor.fields.name, "validations[priority=5]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /turf/distributors without the required `name` fails shape validation with ERR_INVALID_REQUEST and creates nothing."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /turf/distributors"
              payload: { territory_codes: ["CA"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 1000000 }
              as: CorporateAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "HTTP status == 400"
      - name: part_create_defaults_support_status_active
        claim_type: defaults
        grounds: [entities.Part.fields.support_status, entities.Part.fields.superseded_by_part_id]
        distinguishing_aspect: "A part created without lifecycle inputs starts ACTIVE with a null superseded_by_part_id; the client cannot set them at create."
        test_recipe:
          setup: ["Model M1 exists"]
          setup_api_calls:
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /turf/parts"
              payload: { sku: "P1-BEDKNIFE", name: "Bedknife 11-blade", primary_model_id: "${m1}", unit_cost_cents: 12000, min_stock_qty: 4 }
              as: CorporateAdmin
              captures: { p1: $.data.id }
          assert:
            - "Part.${p1}.support_status == ACTIVE (system default)"
            - "Part.${p1}.superseded_by_part_id is null"
            - "Part.${p1}.version == 1"
      - name: lease_create_client_computed_fields_input_ignored
        claim_type: computed_fields
        grounds: [entities.FleetLease.fields.status, entities.FleetLease.fields.monthly_rate_cents, "validations[priority=5]"]
        distinguishing_aspect: "Injecting status=ACTIVE and monthly_rate_cents into lease create is ignored: the lease is DRAFT with no computed financials until approve."
        test_recipe:
          setup: ["D1 ACTIVE; C1 assigned to D1; M1 exists"]
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA", "NV"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2027-03-01", lines: [{ model_id: "${m1}", qty: 1 }], status: "ACTIVE", monthly_rate_cents: 1 }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id }
          assert:
            - "FleetLease.${l1}.status == DRAFT (injected ACTIVE ignored)"
            - "FleetLease.${l1}.monthly_rate_cents is null/absent (computed only at approve)"
            - "FleetLease.${l1}.end_date == 2030-03-01 (computed from start_date + 36 months)"
      - name: lease_get_unknown_id_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but unknown lease id yields ERR_NOT_FOUND 404, not a 500 or empty object."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /turf/leases/00000000-0000-4000-8000-000000000000"
              as: CorporateAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"
            - "HTTP status == 404"
      - name: technicians_list_filters_by_distributor_and_paginates
        claim_type: listing
        grounds: [endpoints.GET /turf/technicians, response_envelope.pagination_fields]
        distinguishing_aspect: "The distributor_id filter returns only that distributor's technicians; limit=1 pages the two-row result with has_more=true then false."
        test_recipe:
          setup: ["D1 with technicians A and B; D2 with technician C"]
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/distributors"
              payload: { name: "Sierra Turf Supply", territory_codes: ["AZ"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 13500, annual_claim_cap_cents: 30000000 }
              as: CorporateAdmin
              captures: { d2: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tech A" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "POST /turf/technicians"
              payload: { full_name: "Tech B" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "POST /turf/technicians"
              payload: { full_name: "Tech C" }
              as: DistributorManager
              as_user_id: "${d2}"
          trigger:
            - call: "GET /turf/technicians"
              payload: { distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { total: $.meta }
            - call: "GET /turf/technicians"
              payload: { distributor_id: "${d1}", limit: 1, offset: 0 }
              as: CorporateAdmin
          assert:
            - "Filtered list for ${d1} contains exactly the 2 technicians of ${d1} (total_count == 2)"
            - "limit=1 page returns 1 row with has_more == true and total_count == 2"
      - name: course_create_invalid_turf_profile_returns_invalid_request
        claim_type: type_constraints
        grounds: [entities.GolfCourse.fields.turf_profile, "validations[priority=5]"]
        distinguishing_aspect: "An enum member outside BENTGRASS|BERMUDA|POA_ANNUA|MIXED is rejected at shape validation."
        test_recipe:
          setup: ["D1 exists"]
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /turf/courses"
              payload: { name: "Kikuyu Ridge", turf_profile: "KIKUYU", cut_quality_standard: "CLUB", credit_limit_cents: 1000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

  - section: state_machines
    instances:
      - name: lease_draft_to_active_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.FleetLease.transitions, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "DRAFT -> ACTIVE skips SPEC_REVIEW and APPROVED; the transition set contains no such edge, so ERR_INVALID_STATE with no side effects."
        test_recipe:
          setup: ["D1 ACTIVE; C1; M1; lease L1 in DRAFT"]
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2027-03-01", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id, l_v: $.data.version }
          trigger:
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "ACTIVE", expected_lease_version: "${l_v}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "FleetLease.${l1}.status == DRAFT and version == 1 (no side effects fired)"

      - name: cancelled_lease_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.FleetLease.terminal_states, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CANCELLED is terminal: every further transition, even with the correct post-cancel version, fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["D1 ACTIVE; C1; M1; lease L1 in DRAFT then CANCELLED"]
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2027-03-01", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id, l_v: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "CANCELLED", expected_lease_version: "${l_v}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l_v2: $.data.version }
          trigger:
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "SPEC_REVIEW", expected_lease_version: "${l_v2}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE from the CANCELLED terminal state"
      - name: double_submit_spec_rejected_second_time
        claim_type: idempotency
        grounds: [state_machines.FleetLease.DRAFT_to_SPEC_REVIEW, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "The same SPEC_REVIEW trigger succeeds once; replayed against the resulting SPEC_REVIEW state (fresh version) it fails ERR_INVALID_STATE — no silent no-op."
        test_recipe:
          setup: ["D1 ACTIVE; C1; M1; lease L1 already in SPEC_REVIEW"]
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2027-03-01", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id, l_v: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "SPEC_REVIEW", expected_lease_version: "${l_v}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l_v2: $.data.version }
          trigger:
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "SPEC_REVIEW", expected_lease_version: "${l_v2}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE (SPEC_REVIEW -> SPEC_REVIEW is not a declared edge)"
      - name: lease_created_in_draft_initial_state
        claim_type: initial_state
        grounds: [state_machines.FleetLease.initial_state, entities.FleetLease.fields.end_date]
        distinguishing_aspect: "A freshly created lease is DRAFT at version 1 with end_date derived as start_date + cycle_months."
        test_recipe:
          setup: ["D1 ACTIVE; C1; M1"]
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
          trigger:
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 24, start_date: "2027-01-04", lines: [{ model_id: "${m1}", qty: 2 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id }
          assert:
            - "FleetLease.${l1}.status == DRAFT and version == 1"
            - "FleetLease.${l1}.end_date == 2029-01-04"
            - "Two LeaseUnit rows exist for ${l1} with unit_seq 1 and 2, both ORDERED"

      - name: claim_pay_credits_distributor_service_balance
        claim_type: side_effect_execution
        grounds:
          - state_machines.WarrantyClaim.APPROVED_to_PAID
          - entities.Distributor.fields.service_credit_balance_cents
        distinguishing_aspect: "The PAID transition credits exactly payable_total_cents (62200) to the owning distributor's service_credit_balance_cents."
        test_recipe:
          setup:
            - "D1 ACTIVE (labor 14000, cap 50000000); certified T1; C1; M1; ACTIVE lease; unit IN_SERVICE; claim APPROVED"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
              captures: { d1: $.data.id }
            - call: "POST /turf/technicians"
              payload: { full_name: "Tess Torque" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { t1: $.data.id }
            - call: "POST /turf/technicians/${t1}/certify"
              payload: { level: "MASTER", expires_at: "2028-06-01T00:00:00Z" }
              as: CorporateAdmin
            - call: "POST /turf/distributors/${d1}/compliance_review"
              as: CorporateAdmin
            - call: "POST /turf/courses"
              payload: { name: "Bent Pine CC", turf_profile: "BENTGRASS", cut_quality_standard: "CLUB", credit_limit_cents: 50000000, assigned_distributor_id: "${d1}" }
              as: CorporateAdmin
              captures: { c1: $.data.id }
            - call: "POST /turf/models"
              payload: { model_code: "RM-5010H", category: "MOWER", tier: "TOURNAMENT", list_price_cents: 7500000, eligible_turf_types: ["BENTGRASS"], factory_warranty_months: 24, warranty_labor_hourly_cap_cents: 9500, parts_support_years: 10 }
              as: CorporateAdmin
              captures: { m1: $.data.id }
            - call: "POST /turf/leases"
              payload: { course_id: "${c1}", cycle_months: 36, start_date: "2026-09-01", lines: [{ model_id: "${m1}", qty: 1 }] }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l1: $.data.id, l_v: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "SPEC_REVIEW", expected_lease_version: "${l_v}" }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { l_v2: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "APPROVED", expected_lease_version: "${l_v2}" }
              as: CorporateAdmin
              captures: { l_v3: $.data.version }
            - call: "POST /turf/leases/${l1}/transition"
              payload: { to: "ACTIVE", expected_lease_version: "${l_v3}" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "GET /turf/units"
              payload: { lease_id: "${l1}" }
              as: CorporateAdmin
              captures: { u1: "$.data[0].id" }
            - call: "POST /turf/units/${u1}/transition"
              payload: { to: "DELIVERED", serial_number: "SN-A1" }
              as: DistributorManager
              as_user_id: "${d1}"
            - call: "POST /turf/units/${u1}/transition"
              payload: { to: "IN_SERVICE" }
              as: CourseManager
              as_user_id: "${c1}"
            - call: "POST /turf/warranty-claims"
              payload: { lease_unit_id: "${u1}", technician_id: "${t1}", labor_hours: 4, parts_cost_cents: 22000 }
              as: DistributorManager
              as_user_id: "${d1}"
              captures: { cl1: $.data.id, cl_v: $.data.version }
            - call: "POST /turf/warranty-claims/${cl1}/transition"
              payload: { to: "UNDER_REVIEW", expected_claim_version: "${cl_v}" }
              as: CorporateAdmin
              captures: { cl_v2: $.data.version }
            - call: "POST /turf/warranty-claims/${cl1}/transition"
              payload: { to: "APPROVED", expected_claim_version: "${cl_v2}" }
              as: CorporateAdmin
              captures: { cl_v3: $.data.version }
          trigger:
            - call: "POST /turf/warranty-claims/${cl1}/transition"
              payload: { to: "PAID", expected_claim_version: "${cl_v3}" }
              as: CorporateAdmin
            - call: "GET /turf/distributors/${d1}"
              as: CorporateAdmin
              captures: { bal: $.data.service_credit_balance_cents }
          assert:
            - "WarrantyClaim.${cl1}.status == PAID with paid_at set"
            - "bal == 62200 (payable_total_cents credited to the distributor)"
      - name: order_cancel_voids_discount_and_releases_commitment
        claim_type: compensation
        grounds:
          - state_machines.PartsOrder.SUBMITTED_to_CANCELLED
          - entities.Distributor.fields.committed_parts_cents
        distinguishing_aspect: "Cancelling a SUBMITTED off-season order removes exactly its discounted total (46510) from committed_parts_cents and voids the incentive discount with the order."
        test_recipe:
          setup:
            - "D1 ACTIVE; P3 and P4 at 25005; clock 2027-01-15 (off-season); order O1 SUBMITTED with discount 3500, total 46510"
          setup_api_calls:
            - call: "POST /turf/distributors"
              payload: { name: "GreenFair Distribution", territory_codes: ["CA"], channel: "EQUIPMENT", min_parts_stock_value_cents: 0, labor_rate_cents: 14000, annual_claim_cap_cents: 50000000 }
              as: CorporateAdmin
