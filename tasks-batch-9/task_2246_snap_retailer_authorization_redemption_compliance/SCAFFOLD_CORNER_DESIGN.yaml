          - errors.ERR_REPLY_WINDOW_OPEN
          - errors.ERR_REPLY_WINDOW_CLOSED
          - errors.ERR_ADMIN_REVIEW_WINDOW_CLOSED
          - errors.ERR_ENFORCEMENT_NOT_DUE
        distinguishing_aspect: "Six different clock-driven refusals are provoked from one fixture at one instant, proving the implementation does not collapse them into a single generic timing error: a visit before its window, a period before its end, a determination while the reply window is still open, a reply after it shut, a review request after its deadline and an enforcement before its effective date."
        test_recipe:
          setup:
            - "The authorized store; an August period; a scheduled September visit; a CHARGE_ISSUED case at 2026-08-01 with reply_due 2026-08-11 and, on the second track, a case whose determination and finalization are already behind it."
