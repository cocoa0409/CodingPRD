  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_shape_on_success_and_error
        claim_type: envelope_contract
        grounds: [response_envelope]
        distinguishing_aspect: "Every response carries meta.api_request_id + meta.api_request_timestamp, a response_type discriminator, and data; errors nest error_id and message inside data."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /tax/accounts"
              payload: { email: "ep1@x.com", full_name: "Ep One", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
          assert:
            - "success envelope: meta.api_request_id present, meta.api_request_timestamp present, response_type == 'object', data.id == ${acct_id}"

      - name: list_pagination_defaults_and_fields
        claim_type: pagination_contract
        grounds:
          - "response_envelope"
          - "endpoints[GET /tax/accounts/{accountId}/returns]"
        distinguishing_aspect: "List endpoints honor the envelope pagination fields (limit/offset/total_count/has_more) with defaults limit=10, offset=0."
        test_recipe:
          setup: ["Account A with two returns (2024, 2025)"]
          setup_api_calls:
            - call: "POST /tax/accounts"
              payload: { email: "ep2@x.com", full_name: "Ep Two", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2024 }
              as: Taxpayer
              as_user_id: "${acct_id}"
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /tax/accounts/${acct_id}/returns"
              as: Taxpayer
              as_user_id: "${acct_id}"
          assert:
            - "list envelope: response_type == 'array', meta.total_count == 2, meta.has_more == false, meta.limit == 10, meta.offset == 0"

      - name: select_tier_allows_overincome_filer_to_leave_free
        claim_type: conditional_action
        grounds:
          - "endpoints[POST /tax/returns/{returnId}/select-tier]"
          - "errors[ERR_TIER_BELOW_REQUIRED]"
        distinguishing_aspect: "An over-income filer (AGI 9000000c) blocked at FREE by ERR_FREE_FILE_INELIGIBLE escapes via select-tier to DELUXE: fees become 6999 and submit-review then succeeds; selecting a tier at/below current is rejected."
        test_recipe:
          setup: ["Catalog seeded (incl. DELUXE); account A (AGI 9000000c); return R with ACTIVE F1040, still FREE tier"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_tiers/seed"
              payload: { code: "DELUXE", price_cents: 6999, state_addon_price_cents: 3999, supported_forms: ["SCH_E"], tier_rank: 1 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "ep3@x.com", full_name: "Ep Three", filing_status: "SINGLE", agi_cents: 9000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/select-tier"
              payload: { target_tier: "DELUXE", expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/select-tier"
              payload: { target_tier: "FREE", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
          assert:
            - "TaxReturn.${ret_id}.current_tier == DELUXE"
            - "TaxReturn.${ret_id}.total_fees_due_cents == 6999"
            - "downgrade attempt rejected: ${err1} == ERR_INVALID_REQUEST (target must strictly outrank current)"
            - "TaxReturn.${ret_id}.status == READY_FOR_REVIEW (free-file gate no longer applies at a paid tier)"

      - name: refund_transfer_file_blocked_until_disclosure_accepted
        claim_type: conditional_action
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_REFUND_TRANSFER_NOT_ACTIVE]"
        distinguishing_aspect: "refund_transfer_selected is true only after disclosure acceptance; a PENDING_DISCLOSURE agreement cannot support filing (submit-review succeeds, file fails with ERR_REFUND_TRANSFER_NOT_ACTIVE until accept-disclosure runs)."
        test_recipe:
          setup: ["Catalog seeded; account A (AGI 1000000c); return R with F1040 + W2_WH(9000c refund); agreement created but disclosure NOT yet accepted; forced refund_transfer_selected is impossible — instead verify file requires ACTIVE by attempting with agreement still PENDING after select-tier path... see trigger"]
          setup_api_calls:
            - call: "POST /tax/_tiers/seed"
              payload: { code: "FREE", price_cents: 0, state_addon_price_cents: 0, supported_forms: ["F1040", "W2_WH"], tier_rank: 0 }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "F1040", minimum_tier: "FREE", disqualifies_free_file: false }
              as: PlatformOperator
            - call: "POST /tax/_forms/seed"
              payload: { code: "W2_WH", minimum_tier: "FREE", disqualifies_free_file: false, counts_toward_refund: true }
              as: PlatformOperator
            - call: "POST /tax/accounts"
              payload: { email: "ep4@x.com", full_name: "Ep Four", filing_status: "SINGLE", agi_cents: 1000000, resident_state_code: "CA" }
              as: Taxpayer
              captures: { acct_id: $.data.id }
            - call: "POST /tax/accounts/${acct_id}/returns"
              payload: { tax_year: 2025 }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_id: $.data.id, ret_v: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "F1040", amount_cents: 0, expected_return_version: "${ret_v}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v2: $.data.version }
            - call: "POST /tax/returns/${ret_id}/forms"
              payload: { form_code: "W2_WH", amount_cents: 9000, expected_return_version: "${ret_v2}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v3: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer"
              payload: { bank_partner_code: "BANK_A", expected_return_version: "${ret_v3}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { rta_id: $.data.id, ret_v4: $.data.version }
          trigger:
            - call: "POST /tax/returns/${ret_id}/submit-review"
              payload: { expected_return_version: "${ret_v4}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v5: $.data.version }
            - call: "POST /tax/returns/${ret_id}/refund-transfer/accept-disclosure"
              payload: { expected_return_version: "${ret_v5}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { ret_v6: $.data.version }
            - call: "POST /tax/returns/${ret_id}/file"
              payload: { transmission_payload_hash: "hash-rt", expected_return_version: "${ret_v6}" }
              as: Taxpayer
              as_user_id: "${acct_id}"
              captures: { fa1: $.data.id }
          assert:
            - "RefundTransferAgreement.${rta_id}.status == ACTIVE (disclosure accepted while return sat in READY_FOR_REVIEW — acceptance is legal in DRAFT/AMENDED/READY_FOR_REVIEW)"
            - "TaxReturn.${ret_id}.refund_transfer_selected == true"
            - "TaxReturn.${ret_id}.total_fees_due_cents == 4000 (0 base + 4000 service fee)"
            - "TaxReturn.${ret_id}.federal_refund_cents == 9000 >= 4000"
            - "FilingAttempt.${fa1}.outcome == PENDING (file succeeds once disclosure accepted)"

  # ===========================================================================
  # Section: errors
