              payload: { full_name: "V Boundary20", home_station_id: "${st20}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v20: $.data.id, v20_v: $.data.version }
            - call: "POST /community-care/veterans"
              payload: { full_name: "V Boundary21", home_station_id: "${st21}", priority_group: 5, home_latitude: 40.2609, home_longitude: -75.0 }
              as: EligibilityClerk
              captures: { v21: $.data.id, v21_v: $.data.version }
          trigger:
