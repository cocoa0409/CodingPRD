# =============================================================================
# Task 1815 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Sections per references/claim-extraction-guide.md; excluded_because stubs cite
# §1.8 instances that already cover the corner.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: customer_create_applies_defaults
        claim_type: defaults
        grounds: [entities.CustomerAccount.fields.default_disposition_owner, entities.CustomerAccount.fields.outstanding_billed_cents]
        distinguishing_aspect: "Omitting default_disposition_owner applies the COPACKER default; computed outstanding_billed_cents initializes to 0 and version starts at 1."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Nuevo Brands", contact_email: "hola@nuevo.example", credit_limit_cents: 5000 }, as: OpsAdmin, captures: { cu: "$.data.id"} }
          trigger:
            - { call: "GET /copack/customers/${cu}", payload: {}, as: OpsAdmin }
          assert:
            - "CustomerAccount.${cu}.default_disposition_owner == COPACKER (default applied)"
            - "CustomerAccount.${cu}.outstanding_billed_cents == 0"
            - "CustomerAccount.${cu}.version == 1"

      - name: formula_create_missing_required_sku_code
        claim_type: required_fields
        grounds: [entities.Formula.fields.sku_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /copack/formulas without required sku_code is rejected with ERR_INVALID_REQUEST (400); no formula is persisted."
        test_recipe:
          setup: ["Customer c1 exists"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
          trigger:
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: formula_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Formula.fields.process_category, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "process_category outside {ACIDIFIED, LOW_ACID, ACID} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Customer c1 exists"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
          trigger:
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Mystery Sauce", sku_code: "MS-001", process_category: "SPICY", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status 400"

      - name: component_create_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.PackagingComponent.fields.reserved_units, entities.PackagingComponent.fields.available_units]
        distinguishing_aspect: "Client-supplied reserved_units in the create payload is ignored: the component is created with reserved_units 0 and available_units == initial_on_hand_units."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /copack/packaging-components", payload: { component_name: "12oz woozy bottle", component_type: "BOTTLE", unit_cost_cents: 50, initial_on_hand_units: 100000, reserved_units: 999 }, as: OpsAdmin, captures: { pc: "$.data.id", res: "$.data.reserved_units", avail: "$.data.available_units"} }
          trigger:
            - { call: "GET /copack/packaging-components/${pc}", payload: {}, as: OpsAdmin }
          assert:
            - "PackagingComponent.${pc}.reserved_units == 0 (computed field; client input 999 ignored)"
            - "PackagingComponent.${pc}.available_units == 100000"
            - "PackagingComponent.${pc}.on_hand_units == 100000"

      - name: formula_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_FORMULA_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but non-existent formula id returns 404 ERR_FORMULA_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /copack/formulas/00000000-0000-4000-8000-000000000000", payload: {}, as: OpsAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_FORMULA_NOT_FOUND and http status 404"

      - name: formulas_list_pagination
        claim_type: listing
        grounds: [response_envelope.pagination_fields, response_envelope.pagination_defaults]
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more per the fixed envelope; page 1 of limit 2 over 3 rows has has_more true, page 2 has exactly 1 row and has_more false."
        test_recipe:
          setup: ["Customer c1 with three formulas f1, f2, f3"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Sauce 1", sku_code: "S1", process_category: "ACID", allergen_class: "NONE", min_run_units: 100, unit_rate_cents: 100 }, as: OpsAdmin }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Sauce 2", sku_code: "S2", process_category: "ACID", allergen_class: "NONE", min_run_units: 100, unit_rate_cents: 100 }, as: OpsAdmin }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Sauce 3", sku_code: "S3", process_category: "ACID", allergen_class: "NONE", min_run_units: 100, unit_rate_cents: 100 }, as: OpsAdmin }
          trigger:
            - { call: "GET /copack/formulas", payload: { limit: 2, offset: 0 }, as: OpsAdmin }
            - { call: "GET /copack/formulas", payload: { limit: 2, offset: 2 }, as: OpsAdmin }
          assert:
            - "page 1: data length == 2, total_count == 3, has_more == true"
            - "page 2: data length == 1, total_count == 3, has_more == false"

  - section: state_machines
    instances:
      - name: formula_initial_state
        claim_type: initial_state
        grounds: [state_machines.Formula]
        distinguishing_aspect: "A newly created formula starts in DRAFT with revision 1 and version 1."
        test_recipe:
          setup: ["Customer c1 exists"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
          trigger:
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id", st: "$.data.status", rev: "$.data.revision"} }
          assert:
            - "Formula.${f1}.status == DRAFT"
            - "Formula.${f1}.revision == 1"
            - "Formula.${f1}.version == 1"

      - name: trial_record_results_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.ScaleUpTrial.SCHEDULED_to_PASSED, "errors[ERR_TRIAL_NOT_SCHEDULED]"]
        distinguishing_aspect: "record-results on an already-PASSED trial is rejected with ERR_TRIAL_NOT_SCHEDULED; the passing transition is not idempotent."
        test_recipe:
          setup: ["Customer c1; ACIDIFIED formula f1; pilot cell pc1; trial t1 recorded passed"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: true, yield_units: 480 }, as: OpsAdmin }
          trigger:
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: true, yield_units: 480 }, as: OpsAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_TRIAL_NOT_SCHEDULED and http status 409"
            - "ScaleUpTrial.${t1}.status remains PASSED"

      - name: released_run_cancel_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ProductionRun, "errors[ERR_RUN_NOT_CANCELLABLE]"]
        distinguishing_aspect: "RELEASED is terminal for cancellation: cancel on a RELEASED run returns ERR_RUN_NOT_CANCELLABLE and the run stays RELEASED with billing intact."
        test_recipe:
          setup:
            - "Chain A (approved ACIDIFIED formula f1, label APPROVED); run r1 confirmed, completed clean (ph 4.1, aw 0.88), released"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000, default_disposition_owner: "CUSTOMER" }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "Ghost pepper mash", sourcing_mode: "CUSTOMER_SUPPLIED", quantity_per_unit: 0.5 }, as: OpsAdmin, captures: { s1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "White vinegar", sourcing_mode: "COPACKER_SUPPLIED", quantity_per_unit: 0.8, unit_cost_cents: 300 }, as: OpsAdmin }
            - { call: "POST /copack/ingredient-supplies/${s1}/receive", payload: { quantity: 5000 }, as: OpsAdmin }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: true, yield_units: 480 }, as: OpsAdmin }
            - { call: "POST /copack/process-authority-letters", payload: { formula_id: "${f1}", formula_revision: 1, authority_name: "Dr. Rosa Kim", letter_number: "PAL-1001", max_ph: 4.2, max_water_activity: 0.9 }, as: ProcessAuthority, captures: { l1: "$.data.id"} }
            - { call: "POST /copack/process-authority-letters/${l1}/activate", payload: {}, as: ProcessAuthority }
            - { call: "POST /copack/kettle-lines", payload: { line_name: "Kettle-1", capacity_units: 100000 }, as: OpsAdmin, captures: { k1: "$.data.id"} }
            - { call: "POST /copack/label-approvals", payload: { formula_id: "${f1}", label_version: "v1", brand_display_name: "Acme", net_quantity_statement: "12 fl oz", allergen_declaration: "NONE" }, as: OpsAdmin, captures: { lab1: "$.data.id"} }
            - { call: "POST /copack/label-approvals/${lab1}/submit", payload: {}, as: OpsAdmin }
            - { call: "POST /copack/label-approvals/${lab1}/review", payload: { approved: true }, as: QAReviewer }
            - { call: "POST /copack/production-runs", payload: { formula_id: "${f1}", kettle_line_id: "${k1}", planned_units: 2000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", packaging_requirements: [] }, as: OpsAdmin, captures: { r1: "$.data.id"} }
            - { call: "POST /copack/production-runs/${r1}/confirm", payload: {}, as: OpsAdmin }
            - { call: "POST /copack/production-runs/${r1}/complete", payload: { actual_units_produced: 2000, measured_ph: 4.1, measured_water_activity: 0.88 }, as: OpsAdmin }
            - { call: "POST /copack/production-runs/${r1}/release", payload: {}, as: QAReviewer }
          trigger:
            - { call: "POST /copack/production-runs/${r1}/cancel", payload: {}, as: OpsAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_RUN_NOT_CANCELLABLE and http status 409"
            - "ProductionRun.${r1}.status remains RELEASED"
            - "CustomerAccount.${c1}.outstanding_billed_cents == 735000 (billing intact: final 2000*120 + 15000 + 0.8*2000*300, no packaging)"

      - name: hold_disposition_twice_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.QualityHold.OPEN_to_DISPOSITIONED, "errors[ERR_HOLD_NOT_OPEN]"]
        distinguishing_aspect: "DISPOSITIONED is terminal: a second disposition on the same hold returns ERR_HOLD_NOT_OPEN."
        test_recipe:
          setup:
            - "Chain A (customer disposition CUSTOMER); run r1 confirmed, completed with ph 4.4 -> auto-hold h1 (margin 0.2); h1 dispositioned REWORK by owning customer"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000, default_disposition_owner: "CUSTOMER" }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "Ghost pepper mash", sourcing_mode: "CUSTOMER_SUPPLIED", quantity_per_unit: 0.5 }, as: OpsAdmin, captures: { s1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "White vinegar", sourcing_mode: "COPACKER_SUPPLIED", quantity_per_unit: 0.8, unit_cost_cents: 300 }, as: OpsAdmin }
            - { call: "POST /copack/ingredient-supplies/${s1}/receive", payload: { quantity: 5000 }, as: OpsAdmin }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials/${t1}/record-results", payload: { passed: true, yield_units: 480 }, as: OpsAdmin }
            - { call: "POST /copack/process-authority-letters", payload: { formula_id: "${f1}", formula_revision: 1, authority_name: "Dr. Rosa Kim", letter_number: "PAL-1001", max_ph: 4.2, max_water_activity: 0.9 }, as: ProcessAuthority, captures: { l1: "$.data.id"} }
            - { call: "POST /copack/process-authority-letters/${l1}/activate", payload: {}, as: ProcessAuthority }
            - { call: "POST /copack/kettle-lines", payload: { line_name: "Kettle-1", capacity_units: 100000 }, as: OpsAdmin, captures: { k1: "$.data.id"} }
            - { call: "POST /copack/production-runs", payload: { formula_id: "${f1}", kettle_line_id: "${k1}", planned_units: 2000, scheduled_start: "2026-09-10T08:00:00Z", scheduled_end: "2026-09-10T16:00:00Z", packaging_requirements: [] }, as: OpsAdmin, captures: { r1: "$.data.id"} }
            - { call: "POST /copack/production-runs/${r1}/confirm", payload: {}, as: OpsAdmin }
            - { call: "POST /copack/production-runs/${r1}/complete", payload: { actual_units_produced: 2000, measured_ph: 4.4, measured_water_activity: 0.88 }, as: OpsAdmin }
            - { call: "GET /copack/quality-holds", payload: { production_run_id: "${r1}" }, as: QAReviewer, captures: { h1: "$.data[0].id"} }
            - { call: "POST /copack/quality-holds/${h1}/disposition", payload: { disposition: "REWORK" }, as: Customer, as_user_id: "${c1}" }
          trigger:
            - { call: "POST /copack/quality-holds/${h1}/disposition", payload: { disposition: "RELEASE" }, as: Customer, as_user_id: "${c1}", captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_HOLD_NOT_OPEN and http status 409"
            - "QualityHold.${h1}.status remains DISPOSITIONED with disposition REWORK"
            - "ProductionRun.${r1}.status remains REWORK"

      - name: label_submit_twice_rejected
        claim_type: invalid_transition
        grounds: [state_machines.LabelApproval.DRAFT_to_SUBMITTED, "errors[ERR_LABEL_NOT_DRAFT]"]
        distinguishing_aspect: "Submitting an already-SUBMITTED label returns ERR_LABEL_NOT_DRAFT."
        test_recipe:
          setup: ["Customer c1; ACIDIFIED formula f1 DRAFT; label lab1 created and submitted"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/label-approvals", payload: { formula_id: "${f1}", label_version: "v1", brand_display_name: "Acme", net_quantity_statement: "12 fl oz", allergen_declaration: "NONE" }, as: OpsAdmin, captures: { lab1: "$.data.id"} }
            - { call: "POST /copack/label-approvals/${lab1}/submit", payload: {}, as: OpsAdmin }
          trigger:
            - { call: "POST /copack/label-approvals/${lab1}/submit", payload: {}, as: OpsAdmin, captures: { err: "$.data.error_id"} }
          assert:
            - "error_id == ERR_LABEL_NOT_DRAFT and http status 409"
            - "LabelApproval.${lab1}.status remains SUBMITTED"

      - name: trial_cancel_returns_formula_to_draft
        claim_type: valid_transition
        grounds: [state_machines.ScaleUpTrial.SCHEDULED_to_CANCELLED, state_machines.Formula.IN_TRIAL_to_DRAFT]
        distinguishing_aspect: "Cancelling a SCHEDULED trial moves it to CANCELLED and cascades the formula back from IN_TRIAL to DRAFT."
        test_recipe:
          setup: ["Customer c1; ACIDIFIED formula f1; trial t1 scheduled on pc1"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f1}", pilot_cell_id: "${pc1}", batch_size_units: 500, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T12:00:00Z" }, as: OpsAdmin, captures: { t1: "$.data.id"} }
          trigger:
            - { call: "POST /copack/scale-up-trials/${t1}/cancel", payload: {}, as: OpsAdmin }
          assert:
            - "ScaleUpTrial.${t1}.status == CANCELLED"
            - "Formula.${f1}.status == DRAFT"

      - name: acid_formula_auto_approves_on_trial_pass
        claim_type: side_effect_execution
        grounds: [state_machines.Formula.IN_TRIAL_to_APPROVED]
        distinguishing_aspect: "For process_category ACID (letter-exempt), a passed trial moves the formula IN_TRIAL -> APPROVED automatically with no process authority letter."
        test_recipe:
          setup: ["Customer c1; ACID formula f2; trial t2 scheduled"]
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000 }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Vinegar Hot Sauce", sku_code: "VH-001", process_category: "ACID", allergen_class: "NONE", min_run_units: 100, unit_rate_cents: 100 }, as: OpsAdmin, captures: { f2: "$.data.id"} }
            - { call: "POST /copack/pilot-cells", payload: { cell_name: "Pilot-1", max_batch_units: 5000 }, as: OpsAdmin, captures: { pc1: "$.data.id"} }
            - { call: "POST /copack/scale-up-trials", payload: { formula_id: "${f2}", pilot_cell_id: "${pc1}", batch_size_units: 100, scheduled_start: "2026-09-01T08:00:00Z", scheduled_end: "2026-09-01T10:00:00Z" }, as: OpsAdmin, captures: { t2: "$.data.id"} }
          trigger:
            - { call: "POST /copack/scale-up-trials/${t2}/record-results", payload: { passed: true, yield_units: 95 }, as: OpsAdmin }
          assert:
            - "ScaleUpTrial.${t2}.status == PASSED"
            - "Formula.${f2}.status == APPROVED (no letter required for ACID)"

      - name: hold_create_requires_completed_run
        claim_type: precondition_enforcement
        grounds: [state_machines.ProductionRun.COMPLETED_to_ON_HOLD, "errors[ERR_RUN_NOT_COMPLETED]"]
        distinguishing_aspect: "A manual quality hold on a CONFIRMED (not yet COMPLETED) run is rejected with ERR_RUN_NOT_COMPLETED."
        test_recipe:
          setup:
            - "Chain A approved formula f1; run r1 confirmed (status CONFIRMED)"
          setup_api_calls:
            - { call: "POST /copack/customers", payload: { brand_name: "Acme Foods", contact_email: "ops@acme.example", credit_limit_cents: 100000000, default_disposition_owner: "CUSTOMER" }, as: OpsAdmin, captures: { c1: "$.data.id"} }
            - { call: "POST /copack/formulas", payload: { customer_id: "${c1}", product_name: "Ghost Pepper Sauce", sku_code: "GPS-001", process_category: "ACIDIFIED", allergen_class: "NONE", min_run_units: 1000, unit_rate_cents: 120 }, as: OpsAdmin, captures: { f1: "$.data.id"} }
            - { call: "POST /copack/ingredient-supplies", payload: { formula_id: "${f1}", ingredient_name: "Ghost pepper mash", sourcing_mode: "CUSTOMER_SUPPLIED", quantity_per_unit: 0.5 }, as: OpsAdmin, captures: { s1: "$.data.id"} }
