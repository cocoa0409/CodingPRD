          - state_machines.Installment.DUE_to_DELINQUENT
          - state_machines.PaymentSchedule.ACTIVE_to_DEFAULT_ELIGIBLE
          - state_machines.LiabilityAssessment.NOT_YET_DUE_to_DELINQUENT
          - entities.Employer.fields.credit_watch
          - entities.Employer.fields.delinquency_strikes
