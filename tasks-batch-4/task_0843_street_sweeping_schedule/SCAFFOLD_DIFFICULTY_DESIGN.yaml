scaffold_difficulty_design:
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: citation_fine_provisional_vs_final
        grounds:
          - calculations.citation_fine
          - state_machines.Citation.ISSUED_to_PAID
          - entities.Citation.amount_due_cents
          - entities.Citation.paid_amount_cents
        distinguishing_aspect: |
          Same Citation, two variants on the Citation entity domain: the provisional
          amount_due_cents (days_late=0 -> 6000) diverges from the final paid_amount_cents
          (20 days late -> 9000).
        test_recipe:
          setup:
            - "Route + Block with a VERIFIED, unexpired sign; no active suspension."
            - "Citation issued 2026-03-10T08:30Z for a plate with zero prior upheld citations (provisional 6000)."
            - "Payment made 20 whole days after issuance."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "ABC123", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              captures: { cit_id: $.data.id, provisional: $.data.amount_due_cents }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-30T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations/${cit_id}/pay"
              payload: {}
              as: EnforcementOfficer
              captures: { final: $.data.paid_amount_cents }
          assert:
            - "Citation.${cit_id}.amount_due_cents == 6000"
            - "Citation.${cit_id}.paid_amount_cents == 9000"
            - "Citation.${cit_id}.days_late == 20"
            - "Citation.${cit_id}.status == PAID"

      - name: shift_gross_vs_net_tonnage
        grounds:
          - calculations.shift_tonnage
          - entities.Shift.gross_tonnage
          - entities.Shift.net_tonnage
          - state_machines.SweepEvent.SCHEDULED_to_SWEPT
        distinguishing_aspect: |
          Same set of SWEPT events on one Shift, two variants: gross_tonnage counts a
          re-swept block twice (3200 lbs -> 1.600) while net_tonnage keeps only the
          latest sweep per block (1700 lbs -> 0.850).
        test_recipe:
          setup:
            - "Equipment with 20000-lb hopper; a started shift."
            - "Block A swept twice by that shift (1500 then 900 lbs, later completed_at); Block B swept once (800 lbs)."
          setup_api_calls:
            - call: "POST /api/equipment"
              payload: { unit_number: "SW-1", type: "MECHANICAL", hopper_capacity_lbs: 20000 }
              as: RouteDispatcher
              captures: { eq_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Sam", shift_date: "2026-03-10", start_utc: "2026-03-10T06:00:00Z", end_utc: "2026-03-11T20:00:00Z" }
              as: RouteDispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /api/shifts/${shift_id}/start"
              payload: {}
              as: RouteDispatcher
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_a: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "B", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_b: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_a}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_a1: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_a}", scheduled_date: "2026-03-11", window_start_utc: "2026-03-11T06:00:00Z", window_end_utc: "2026-03-11T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_a2: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_b}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
            - call: "POST /api/sweep-events/${ev_a1}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 1500 }
              as: RouteDispatcher
            - call: "POST /api/sweep-events/${ev_b}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 800 }
              as: RouteDispatcher
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T07:00:00Z" }
              as: RouteDispatcher
            - call: "POST /api/sweep-events/${ev_a2}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 900 }
              as: RouteDispatcher
          trigger:
            - call: "GET /api/shifts/${shift_id}"
              payload: {}
              as: RouteDispatcher
              captures: { gross: $.data.gross_tonnage, net: $.data.net_tonnage }
          assert:
            - "Shift.${shift_id}.total_debris_lbs == 3200"
            - "Shift.${shift_id}.gross_tonnage == 1.600"
            - "Shift.${shift_id}.net_tonnage == 0.850"

  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: citation_fine_nonlinear_repeat_multiplier
        grounds:
          - calculations.citation_fine
          - entities.Citation.prior_upheld_count
          - state_machines.Citation.CONTESTED_to_UPHELD
        distinguishing_aspect: |
          Mode (a): non-linear formula with >=3 inputs (BASE_FINE, late-fee tier of
          days_late, repeat_multiplier tier of prior_upheld_count) plus a min-cap;
          prior_upheld_count=1 with 5 days late -> (6000+1500)*1.5 = 11250.
        test_recipe:
          setup:
            - "Route + Block VERIFIED unexpired sign; no suspension."
            - "One earlier citation for plate REP999 driven to UPHELD (a prior upheld count of 1)."
            - "A second citation for REP999 issued 2026-03-12, then paid 5 days later."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "REP999", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit1: $.data.id }
            - call: "POST /api/citations/${cit1}/contest"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "officer-1"
            - call: "POST /api/citations/${cit1}/adjudicate"
              payload: { decision: "UPHOLD" }
              as: EnforcementOfficer
              as_user_id: "officer-2"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-12T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "REP999", scanned_at_utc: "2026-03-12T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit2: $.data.id, prov2: $.data.amount_due_cents, priors: $.data.prior_upheld_count }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-17T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations/${cit2}/pay"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { final2: $.data.paid_amount_cents }
          assert:
            - "Citation.${cit2}.prior_upheld_count == 1"
            - "Citation.${cit2}.amount_due_cents == 9000"
            - "Citation.${cit2}.paid_amount_cents == 11250"

      - name: shift_tonnage_sum_then_round
        grounds:
          - calculations.shift_tonnage
          - entities.Shift.gross_tonnage
        distinguishing_aspect: |
          Mode (b): rounding order is pinned. Two events at 333 lbs each round differently
          depending on order — sum-first (666/2000 -> 0.333) vs round-per-event-then-sum
          (0.167+0.167 -> 0.334). The scaffold pins sum-first, so gross_tonnage == 0.333.
        test_recipe:
          setup:
            - "Started shift, 20000-lb hopper; two blocks each swept once at 333 lbs."
          setup_api_calls:
            - call: "POST /api/equipment"
              payload: { unit_number: "SW-2", type: "VACUUM", hopper_capacity_lbs: 20000 }
              as: RouteDispatcher
              captures: { eq_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Lee", shift_date: "2026-03-10", start_utc: "2026-03-10T06:00:00Z", end_utc: "2026-03-10T20:00:00Z" }
              as: RouteDispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /api/shifts/${shift_id}/start"
              payload: {}
              as: RouteDispatcher
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_a: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "B", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_b: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_a}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_a: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_b}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
            - call: "POST /api/sweep-events/${ev_a}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 333 }
              as: RouteDispatcher
            - call: "POST /api/sweep-events/${ev_b}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 333 }
              as: RouteDispatcher
          trigger:
            - call: "GET /api/shifts/${shift_id}"
              payload: {}
              as: RouteDispatcher
              captures: { gross: $.data.gross_tonnage }
          assert:
            - "Shift.${shift_id}.total_debris_lbs == 666"
            - "Shift.${shift_id}.gross_tonnage == 0.333"

  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: citation_contest_branch_uphold_dismiss
        grounds:
          - state_machines.Citation.ISSUED_to_CONTESTED
          - state_machines.Citation.CONTESTED_to_UPHELD
          - state_machines.Citation.CONTESTED_to_DISMISSED
        distinguishing_aspect: |
          Citation is a fork-join: CONTESTED branches to UPHELD or DISMISSED with divergent
          side effects (dismiss debits Block.pending_citation_cents by the full amount; this
          instance verifies the DISMISS branch).
        test_recipe:
          setup:
            - "Route + Block VERIFIED sign; one ISSUED citation (6000) for plate CON111."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "CON111", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit_id: $.data.id }
            - call: "POST /api/citations/${cit_id}/contest"
              payload: {}
              as: EnforcementOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /api/citations/${cit_id}/adjudicate"
              payload: { decision: "DISMISS" }
              as: EnforcementOfficer
              as_user_id: "officer-2"
          assert:
            - "Citation.${cit_id}.status == DISMISSED"
            - "Citation.${cit_id}.adjudicator_id == officer-2"
            - "Block.${block_id}.pending_citation_cents == 0"

      - name: complaint_reopen_cycle
        grounds:
          - state_machines.Complaint.OPEN_to_RESOLVED
          - state_machines.Complaint.RESOLVED_to_REOPENED
          - state_machines.Complaint.REOPENED_to_RESOLVED
        distinguishing_aspect: |
          Complaint carries a cycle on a different entity than Citation:
          OPEN -> RESOLVED -> REOPENED -> RESOLVED, returning to RESOLVED after a loop.
        test_recipe:
          setup:
            - "Route + Block; a resident registered on that block; a complaint filed, resolved, reopened."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/residents"
              payload: { email: "r@x.com", full_name: "Rae", home_block_id: "${block_id}" }
              as: RouteDispatcher
              captures: { res_id: $.data.id }
            - call: "POST /api/complaints"
              payload: { resident_id: "${res_id}", block_id: "${block_id}", category: "MISSED_BLOCK" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /api/complaints/${comp_id}/resolve"
              payload: { resolution_note: "swept next day" }
              as: RouteDispatcher
            - call: "POST /api/complaints/${comp_id}/reopen"
              payload: { reason: "still dirty" }
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /api/complaints/${comp_id}/resolve"
              payload: { resolution_note: "re-swept" }
              as: RouteDispatcher
          assert:
            - "Complaint.${comp_id}.status == RESOLVED"
            - "Complaint.${comp_id}.resolution_note == re-swept"

  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: suspension_activate_suspends_event_dismisses_citation
        grounds:
          - state_machines.Suspension.SCHEDULED_to_ACTIVE
          - state_machines.SweepEvent.SCHEDULED_to_SUSPENDED
          - state_machines.Citation.ISSUED_to_DISMISSED
        distinguishing_aspect: |
          Depth-3 chain: activating the Suspension moves the SweepEvent SCHEDULED->SUSPENDED
          (hop 1); that suspension itself dismisses the event's ISSUED Citation (hop 2);
          the dismissal debits Block.pending_citation_cents (hop 3). Each link is caused by
          the previous one, not directly by the activate call.
        test_recipe:
          setup:
            - "Route + Block VERIFIED sign; a SCHEDULED sweep on 2026-03-10; an ISSUED citation tied to that event (6000)."
            - "A ROUTE-scoped suspension covering 2026-03-09..03-11, still SCHEDULED."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T08:00:00Z", window_end_utc: "2026-03-10T10:00:00Z" }
              as: RouteDispatcher
              captures: { ev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "SUS777", scanned_at_utc: "2026-03-10T08:30:00Z", sweep_event_id: "${ev_id}" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { cit_id: $.data.id }
            - call: "POST /api/suspensions"
              payload: { reason: "HOLIDAY", scope: "ROUTE", route_id: "${route_id}", start_date: "2026-03-09", end_date: "2026-03-11" }
              as: PublicWorksAdmin
              captures: { sus_id: $.data.id }
          trigger:
            - call: "POST /api/suspensions/${sus_id}/activate"
              payload: {}
              as: PublicWorksAdmin
              captures: { suspended_count: $.data.suspended_event_count }
          assert:
            - "SweepEvent.${ev_id}.status == SUSPENDED"
            - "Citation.${cit_id}.status == DISMISSED"
            - "Block.${block_id}.pending_citation_cents == 0"
            - "Suspension.${sus_id}.suspended_event_count == 1"

      - name: complete_recomputes_shift_debris
        grounds:
          - state_machines.SweepEvent.SCHEDULED_to_SWEPT
          - entities.Shift.total_debris_lbs
          - calculations.shift_tonnage
        distinguishing_aspect: |
          Depth-2 chain from a different trigger: completing a SweepEvent (hop 1) bubbles up
          to recompute the parent Shift.total_debris_lbs (hop 2). Distinct origin (complete)
          from the suspension cascade.
        test_recipe:
          setup:
            - "Started shift (20000-lb hopper), route + block, one SCHEDULED sweep."
          setup_api_calls:
            - call: "POST /api/equipment"
              payload: { unit_number: "SW-3", type: "REGENERATIVE_AIR", hopper_capacity_lbs: 20000 }
              as: RouteDispatcher
              captures: { eq_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Pat", shift_date: "2026-03-10", start_utc: "2026-03-10T06:00:00Z", end_utc: "2026-03-10T20:00:00Z" }
              as: RouteDispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /api/shifts/${shift_id}/start"
              payload: {}
              as: RouteDispatcher
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
          trigger:
            - call: "POST /api/sweep-events/${ev_id}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 1200 }
              as: RouteDispatcher
          assert:
            - "SweepEvent.${ev_id}.status == SWEPT"
            - "Shift.${shift_id}.total_debris_lbs == 1200"

  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: citation_signage_vs_suspension_referential_wins
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_SIGNAGE_NOT_ENFORCEABLE]
          - errors[ERR_SWEEP_SUSPENDED]
        distinguishing_aspect: |
          Category pair business_referential (priority 8, signage not enforceable) vs
          business_temporal (priority 9, active suspension). Both fail on one issue; the
          lower-priority-number business_referential wins -> ERR_SIGNAGE_NOT_ENFORCEABLE.
        test_recipe:
          setup:
            - "Block with a POSTED but NOT VERIFIED sign (not enforceable)."
            - "An ACTIVE ROUTE suspension covering 2026-03-10."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/suspensions"
              payload: { reason: "HOLIDAY", scope: "ROUTE", route_id: "${route_id}", start_date: "2026-03-09", end_date: "2026-03-11" }
              as: PublicWorksAdmin
              captures: { sus_id: $.data.id }
            - call: "POST /api/suspensions/${sus_id}/activate"
              payload: {}
              as: PublicWorksAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
          trigger:
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "PRI001", scanned_at_utc: "2026-03-10T08:30:00Z" }
              as: EnforcementOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SIGNAGE_NOT_ENFORCEABLE"
            - "HTTP status == 422"

      - name: complete_state_vs_capacity_state_wins
        grounds:
          - validations[priority=6]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SHIFT_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (priority 6, event not SCHEDULED) vs business_fiscal (priority
          12, debris over hopper). Re-completing an already-SWEPT event with over-capacity
          debris fails both; state wins -> ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Started shift with a 5000-lb hopper, already at 4000 lbs from one SWEPT event."
            - "That same event is re-targeted for completion with 2000 more lbs."
          setup_api_calls:
            - call: "POST /api/equipment"
              payload: { unit_number: "SW-4", type: "MECHANICAL", hopper_capacity_lbs: 5000 }
              as: RouteDispatcher
              captures: { eq_id: $.data.id }
            - call: "POST /api/shifts"
              payload: { equipment_id: "${eq_id}", operator_name: "Dee", shift_date: "2026-03-10", start_utc: "2026-03-10T06:00:00Z", end_utc: "2026-03-10T20:00:00Z" }
              as: RouteDispatcher
              captures: { shift_id: $.data.id }
            - call: "POST /api/shifts/${shift_id}/start"
              payload: {}
              as: RouteDispatcher
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "A", side: "BOTH", restriction_start_local: "06:00", restriction_end_local: "12:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id }
            - call: "POST /api/sweep-events"
              payload: { block_id: "${block_id}", scheduled_date: "2026-03-10", window_start_utc: "2026-03-10T06:00:00Z", window_end_utc: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
              captures: { ev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T07:00:00Z" }
              as: RouteDispatcher
            - call: "POST /api/sweep-events/${ev_id}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 4000 }
              as: RouteDispatcher
          trigger:
            - call: "POST /api/sweep-events/${ev_id}/complete"
              payload: { shift_id: "${shift_id}", debris_lbs: 2000 }
              as: RouteDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: citation_window_half_open_end_excluded
        grounds:
          - validations[priority=10]
          - entities.Block.restriction_end_local
          - errors[ERR_OUTSIDE_RESTRICTION_WINDOW]
        distinguishing_aspect: |
          Time-of-day boundary on POST /api/citations: window is half-open [08:00, 10:00);
          a scan at exactly 10:00:00 is OUTSIDE and rejected, whereas 08:00:00 would be inside.
        test_recipe:
          setup:
            - "Block with VERIFIED unexpired sign, window 08:00-10:00; no suspension."
          setup_api_calls:
            - call: "POST /api/routes"
              payload: { name: "R1", zone_code: "Z1", sweep_weekday: "TUE" }
              as: RouteDispatcher
              captures: { route_id: $.data.id }
            - call: "POST /api/blocks"
              payload: { route_id: "${route_id}", block_label: "100-BLK", side: "BOTH", restriction_start_local: "08:00", restriction_end_local: "10:00", linear_feet: 300 }
              as: RouteDispatcher
              captures: { block_id: $.data.id, block_v: $.data.version }
            - call: "POST /api/blocks/${block_id}/post-sign"
              payload: { expected_block_version: "${block_v}", sign_expires_at: "2026-12-31T00:00:00Z" }
              as: SignageInspector
            - call: "POST /api/blocks/${block_id}/verify-sign"
              payload: {}
              as: SignageInspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-10T10:00:00Z" }
              as: EnforcementOfficer
          trigger:
            - call: "POST /api/citations"
              payload: { block_id: "${block_id}", plate: "BND010", scanned_at_utc: "2026-03-10T10:00:00Z" }
