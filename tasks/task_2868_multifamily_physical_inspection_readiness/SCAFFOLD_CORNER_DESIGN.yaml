            - "InspectionStandard.${std_id}.adoption_status == ADOPTED"
            - "InspectionStandard.${std_id}.version == ${std_v_adopted}"

      - name: notice_on_the_last_active_slot_bubbles_the_inspection_to_notified
        claim_type: bubble_up
        grounds:
          - state_machines.Inspection.SAMPLED_to_NOTIFIED
          - state_machines.SampleSelection.NOT_NOTIFIED_to_NOTIFIED
        distinguishing_aspect: |
          The parent transition is driven by the AGGREGATE state of its ACTIVE slots, so the first
          notice must leave the inspection in SAMPLED and only the second - the last outstanding
          slot - may bubble it to NOTIFIED. An implementation that transitions on the first notice
          would let an inspection start against an un-noticed household.
        test_recipe:
          setup:
            - "ADOPTED NSPIRE-2026; Property Maple Court declares total_unit_count 4 and carries units 101 and 102, so the draw clamps sample_size to 2."
            - "Slot 1 (unit 101) is noticed first; the inspection must still be SAMPLED at that point."
          setup_api_calls:
