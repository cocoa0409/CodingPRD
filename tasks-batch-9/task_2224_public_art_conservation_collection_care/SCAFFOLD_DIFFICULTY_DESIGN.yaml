      - name: moral_rights_wait_outranks_missing_disposition_target
        grounds:
          - validations[priority=19]
          - validations[priority=36]
          - errors[ERR_MORAL_RIGHTS_WAIT_ACTIVE]
          - errors[ERR_DISPOSITION_TARGET_REQUIRED]
          - entities.MoralRightsNotice.fields.earliest_action_at
