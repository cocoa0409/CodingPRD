              as_user_id: "${bm1}"
              captures: { variant: $.data.public_comment_allocation_variant }
          assert:
            - "Meeting.${m}.public_comment_allocation_variant == EQUAL_SPLIT"
            - "PublicComment.${c1}.allotted_minutes == 3"
            - "PublicComment.${c2}.allotted_minutes == 3"
            - "PublicComment.${c3}.allotted_minutes == 3"
            - "PublicComment.${c4}.allotted_minutes == 3"
            - "Meeting.${m}.public_comment_minutes_remaining == 18"
            - "Meeting.${m}.public_comment_minutes_budget == 30"

      - name: supermajority_threshold_at_exactly_ceil_two_thirds_of_seated_body
        grounds:
          - calculations.vote_tally_outcome
          - entities.AgendaItem.fields.required_yes_votes
          - state_machines.PolicyVersion.FIRST_READING_PASSED_to_ADOPTED
          - entities.Policy.fields.legal_requirement_level
        distinguishing_aspect: |
          With five seated trustees a REQUIRED_BY_LAW second reading needs ceil(2 * 5 / 3) = 4 yes
          votes, one more than the simple majority of 3 that every other item type would need.
          Exactly 4 yes votes passes; the sibling instance with 3 yes votes fails. The metric is a
          vote count measured against a supermajority ceiling, on the record-vote endpoint.
        test_recipe:
          setup:
            - "Five SEATED trustees; bm1 holds office PRESIDENT."
            - "Policy BP-4119, REQUIRED_BY_LAW, with version pv1 already FIRST_READING_PASSED at meeting M1."
            - "M1 is ADJOURNED with minutes DRAFTED and then APPROVED at meeting M2."
