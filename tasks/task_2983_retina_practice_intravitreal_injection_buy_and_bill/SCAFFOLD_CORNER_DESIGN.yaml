              payload: { attempt_note: "Late unreachable attempt on an acknowledged notification" }
              as: ComplianceOfficer
              as_user_id: "U-CO-1"
              captures: { k_rg_note_terminal: $.data.error_id }
            - call: "POST /lot-recalls/${k_rg_id}/close"
              payload: { closure_note: "Closed by the initiating officer" }
              as: ComplianceOfficer
              as_user_id: "U-CO-1"
              captures: { k_rg_close_self: $.data.error_id }
            - call: "POST /lot-recalls/${k_rg_id}/close"
              payload: { closure_note: "Return credited in full, patient acknowledged, lot destroyed" }
              as: ComplianceOfficer
              as_user_id: "U-CO-2"
              captures: { k_rg_status4: $.data.status, k_rg_closer: $.data.closed_by_user_id }
          assert:
            - "${k_rg_status0} == INITIATED with ${k_rg_required} == 1, ${k_rg_initiator} == \"U-CO-1\", four vials QUARANTINED and one ADMINISTERED"
            - "${k_rg_early_ship} == \"ERR_RECALL_STATE_INVALID\" with HTTP 409 (ship-return requires PATIENTS_NOTIFIED)"
            - "${k_rg_note_status0} == PENDING and ${k_rg_ack_pending} == \"ERR_NOTIFICATION_STATE_INVALID\" — even the rightful owner cannot acknowledge an unsent notice"
            - "${k_rg_status1} == PATIENTS_NOTIFIED and ${k_rg_ack_wrong} == \"ERR_NOT_NOTIFICATION_OWNER\" with HTTP 403 for ${k_pt_other_id} against ${k_rg_note_patient}"
            - "${k_rg_status2} == RETURN_SHIPPED with ${k_rg_returned} == 4 and ${k_rg_expected} == 528000 (4 x 132000)"
            - "${k_rg_credit_over} == \"ERR_CREDIT_EXCEEDS_EXPECTED\" with HTTP 422, and ${k_rg_status3} == CREDIT_RECONCILED with ${k_rg_received} == 528000"
            - "${k_rg_close_incomplete} == \"ERR_PATIENT_NOTIFICATIONS_INCOMPLETE\" with HTTP 409 — reconciled money is not enough"
            - "${k_rg_note_status1} == ACKNOWLEDGED with ${k_rg_note_ack_at} == \"2026-08-01T00:00:00Z\", and ${k_rg_note_terminal} == \"ERR_NOTIFICATION_STATE_INVALID\""
            - "${k_rg_close_self} == \"ERR_RECALL_CLOSER_CONFLICT\" with HTTP 403, and ${k_rg_status4} == CLOSED with ${k_rg_closer} == \"U-CO-2\""

      - name: corner_a_fully_dispensed_lot_recall_cannot_ship_a_return
        claim_type: violation_to_error
        grounds:
          - validations.priority_41
          - errors[ERR_NO_QUARANTINED_VIALS]
          - state_machines.LotRecall.PATIENTS_NOTIFIED_to_RETURN_SHIPPED
        distinguishing_aspect: "When every vial of the recalled lot has already been injected there is nothing to quarantine and nothing to send back, so ship-return is refused with ERR_NO_QUARANTINED_VIALS and the recall is permanently stranded at PATIENTS_NOTIFIED — the recall workflow has no bypass for a zero-inventory return, which is the observable consequence of the declared precondition."
        test_recipe:
          setup:
            - "a single-vial lot RX-9020 of Drug REF, fully administered to P-NP"
            - "a CLASS_I recall opened on that lot"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9020", expiration_date: "2027-03-31T00:00:00Z", received_date: "2026-07-20T00:00:00Z", unit_acquisition_cost_cents: 131000, vials_received: 1 }
              as: PharmacyTech
              captures: { k_lot_solo_id: $.data.id }
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
            - call: "POST /lot-recalls"
              payload: { drug_lot_id: "${k_lot_solo_id}", recall_class: "CLASS_I", reason: "Confirmed sterility failure at the fill site" }
              as: ComplianceOfficer
              as_user_id: "U-CO-3"
              captures: { k_solo_recall_id: $.data.id, k_solo_required: $.data.notifications_required, k_solo_deadline: $.data.notification_deadline_date }
            - call: "POST /lot-recalls/${k_solo_recall_id}/send-notifications"
              as: ComplianceOfficer
              as_user_id: "U-CO-3"
              captures: { k_solo_status1: $.data.status }
          trigger:
            - call: "POST /lot-recalls/${k_solo_recall_id}/ship-return"
              payload: { carrier_reference: "RET-000000" }
              as: PharmacyTech
              captures: { k_solo_ship: $.data.error_id }
            - call: "GET /lot-recalls/${k_solo_recall_id}"
              as: ComplianceOfficer
              as_user_id: "U-CO-3"
              captures: { k_solo_status2: "$.data.status", k_solo_returned: "$.data.vials_returned_count", k_solo_expected: "$.data.credit_expected_cents" }
          assert:
            - "${k_solo_required} == 1 and ${k_solo_deadline} == \"2026-08-04T00:00:00Z\" (CLASS_I is 3 days from the clock)"
            - "${k_solo_status1} == PATIENTS_NOTIFIED"
            - "${k_solo_ship} == \"ERR_NO_QUARANTINED_VIALS\" with HTTP 409"
            - "${k_solo_status2} == PATIENTS_NOTIFIED with ${k_solo_returned} == 0 and ${k_solo_expected} == null — no credit was ever frozen"
            - "DrugLot.${k_lot_solo_id}.status == RECALLED with vials_administered 1, vials_quarantined 0 and the ADMINISTERED vial untouched"

      - name: corner_stale_plan_version_outranks_clinician_eligibility
        claim_type: priority_ordering
        grounds:
          - validations.priority_12
          - validations.priority_14
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / stale_plan_version_outranks_clinician_ineligibility_and_rejects_with_412
          rationale: "The §1.8 priority_pair_validation_conflict instance already violates the optimistic-concurrency check (priority 12) and clinician eligibility (priority 14) in the same request and asserts the 412 ERR_STALE_PLAN_VERSION wins, together with the fact that no vial is reserved and the suspended clinician's ineligibility is never reported. Repeating the pair here would duplicate that instance's assertions verbatim."

      - name: corner_interval_violation_outranks_day_capacity
        claim_type: priority_ordering
        grounds:
          - validations.priority_17
          - validations.priority_18
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / interval_violation_outranks_day_capacity_and_is_rejected
          rationale: "The §1.8 instance already stages a same-day encounter that simultaneously breaks the drug's minimum interval (priority 17) and exceeds the clinician's daily capacity (priority 18) and asserts ERR_INJECTION_INTERVAL_VIOLATION, so both errors' triggerability and their relative order are covered there."

  # ===========================================================================
  # Endpoints — endpoint patterns from Table 5 of the claim-extraction guide
  # ===========================================================================
  - section: endpoints
    instances:

      - name: corner_envelope_is_identical_across_object_array_and_error_responses
        claim_type: standard_crud
        grounds:
          - response_envelope.success
          - response_envelope.error
          - endpoints.POST_/payers
          - endpoints.GET_/payers
        distinguishing_aspect: "Every response — a created object, a list and a rejection — carries the same meta block (api_request_id and api_request_timestamp) and differs only in response_type and the shape of data: \"object\" with the entity, \"array\" with the rows plus the pagination fields, \"error\" with exactly error_id and message."
        test_recipe:
          setup:
            - "an empty system with the logical clock pinned"
          setup_api_calls:
            - *k_clk
          trigger:
            - call: "POST /payers"
              payload: { name: "Envelope Test Payer", payer_type: "COMMERCIAL", coinsurance_rate: 0.2, pa_required: true, biosimilar_preference: "NONE", appeal_window_days: 60 }
              as: PracticeAdmin
              captures: { k_env_id: $.data.id, k_env_created: $.data.created_at }
            - call: "GET /payers"
              payload: { limit: 10, offset: 0 }
              as: BillingSpecialist
              captures: { k_env_list_first: "$.data[0].name" }
            - call: "GET /payers/00000000-0000-4000-8000-0000000000ff"
              as: BillingSpecialist
              captures: { k_env_err: $.data.error_id, k_env_msg: $.data.message }
          assert:
            - "the create response has response_type == \"object\", data.id == ${k_env_id}, data.created_at == ${k_env_created} == \"2026-08-01T00:00:00Z\" and data.version == 1"
            - "the list response has response_type == \"array\" with limit 10, offset 0, total_count 1, has_more false, and ${k_env_list_first} == \"Envelope Test Payer\""
            - "the 404 response has response_type == \"error\" and data holding exactly error_id ${k_env_err} == \"ERR_PAYER_NOT_FOUND\" and a non-empty ${k_env_msg}"
            - "all three responses carry meta.api_request_id and meta.api_request_timestamp, and the timestamp equals the logical clock 2026-08-01T00:00:00Z rather than wall time"

      - name: corner_pagination_bounds_are_enforced_and_an_overshot_offset_returns_an_empty_page
        claim_type: listing
        grounds:
          - response_envelope.pagination_defaults
          - validations.priority_5
          - endpoints.GET_/drug-lots
        distinguishing_aspect: "The pagination contract has hard edges: limit defaults to 10 when omitted, limit 0 and limit 101 are both ERR_INVALID_REQUEST (the range is the closed interval 1..100), a negative offset is rejected, and an offset past the end returns an empty data array with the true total_count and has_more false rather than a 404."
        test_recipe:
          setup:
            - "three AVAILABLE lots of Drug REF"
          setup_api_calls:
            - *k_clk
            - *k_drug_ref
            - *k_lot
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9101", expiration_date: "2027-07-31T00:00:00Z", received_date: "2026-07-02T00:00:00Z", unit_acquisition_cost_cents: 131500, vials_received: 1 }
              as: PharmacyTech
              captures: { k_pg_lot2_id: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9102", expiration_date: "2027-08-31T00:00:00Z", received_date: "2026-07-03T00:00:00Z", unit_acquisition_cost_cents: 131000, vials_received: 1 }
              as: PharmacyTech
              captures: { k_pg_lot3_id: $.data.id }
          trigger:
            - call: "GET /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}" }
              as: PharmacyTech
              captures: { k_pg_default_first: "$.data[0].lot_number" }
            - call: "GET /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", limit: 0 }
              as: PharmacyTech
              captures: { k_pg_limit0: $.data.error_id }
            - call: "GET /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", limit: 101 }
              as: PharmacyTech
              captures: { k_pg_limit101: $.data.error_id }
            - call: "GET /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", limit: 100 }
              as: PharmacyTech
              captures: { k_pg_limit100_first: "$.data[0].lot_number" }
            - call: "GET /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", offset: -1 }
              as: PharmacyTech
              captures: { k_pg_offset_neg: $.data.error_id }
            - call: "GET /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", limit: 2, offset: 50 }
              as: PharmacyTech
              captures: { k_pg_overshoot_err: $.data.error_id }
          assert:
            - "the defaulted page reports limit == 10, offset == 0, total_count == 3, has_more == false and ${k_pg_default_first} == \"RX-9001\""
            - "${k_pg_limit0} == \"ERR_INVALID_REQUEST\" and ${k_pg_limit101} == \"ERR_INVALID_REQUEST\", both HTTP 400"
            - "limit 100 is accepted and returns all 3 rows with ${k_pg_limit100_first} == \"RX-9001\" — 100 is inside the range"
            - "${k_pg_offset_neg} == \"ERR_INVALID_REQUEST\" with HTTP 400"
            - "the overshot page is HTTP 200 with response_type \"array\", zero rows, total_count == 3, has_more == false and ${k_pg_overshoot_err} absent"

      - name: corner_expiration_sweep_is_a_bulk_action_whose_totals_are_order_sensitive_and_idempotent
        claim_type: bulk_action
        grounds:
          - endpoints.POST_/inventory/expiration-sweep
          - state_machines.DrugLot.AVAILABLE_to_EXPIRED
          - calculations.lot_exposure
        distinguishing_aspect: "The sweep is a whole-inventory bulk action: it walks every lot, expires only the lots whose expiration_date is at or before the clock (and only their IN_STOCK vials), refreshes carrying cost afterwards — so the expired lot contributes 0 to carrying_cost_accrued_cents_total, not its own 3397 — and a second identical sweep reports the same totals with zero further expirations."
        test_recipe:
          setup:
            - "lot RX-9001 of Drug REF expiring 2027-06-30 with 5 vials, and lot RX-9200 expiring 2026-07-15 with 2 vials"
            - "the logical clock at 2026-08-01T00:00:00Z, so RX-9200 is already past its date"
          setup_api_calls:
            - *k_clk
            - *k_drug_ref
            - *k_lot
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9200", expiration_date: "2026-07-15T00:00:00Z", received_date: "2026-07-01T00:00:00Z", unit_acquisition_cost_cents: 100000, vials_received: 2 }
              as: PharmacyTech
              captures: { k_sw_lot_id: $.data.id, k_sw_lot_status0: $.data.status }
          trigger:
            - call: "POST /inventory/expiration-sweep"
              as: PharmacyTech
              captures: { k_sw1_swept: $.data.lots_swept, k_sw1_expired: $.data.lots_expired, k_sw1_vials: $.data.vials_expired, k_sw1_carry: $.data.carrying_cost_accrued_cents_total, k_sw1_at: $.data.swept_at }
            - call: "POST /inventory/expiration-sweep"
              as: PharmacyTech
              captures: { k_sw2_swept: $.data.lots_swept, k_sw2_expired: $.data.lots_expired, k_sw2_vials: $.data.vials_expired, k_sw2_carry: $.data.carrying_cost_accrued_cents_total }
            - call: "GET /drug-lots/${k_sw_lot_id}"
              as: PharmacyTech
              captures: { k_sw_lot_status1: "$.data.status", k_sw_lot_swept_at: "$.data.last_swept_at" }
          assert:
            - "${k_sw_lot_status0} == AVAILABLE before the sweep and ${k_sw_lot_status1} == EXPIRED after it, with both its vials EXPIRED"
            - "${k_sw1_swept} == 2, ${k_sw1_expired} == 1, ${k_sw1_vials} == 2 and ${k_sw1_at} == \"2026-08-01T00:00:00Z\""
            - "${k_sw1_carry} == 11211 — only the surviving lot accrues (5 x 132000 x 2000bp / 365 x 31 days); the ordering matters because accruing before expiring would report 14608"
            - "${k_sw2_swept} == 2, ${k_sw2_expired} == 0, ${k_sw2_vials} == 0 and ${k_sw2_carry} == 11211 — the second sweep is idempotent at a fixed clock"
            - "${k_sw_lot_swept_at} == \"2026-08-01T00:00:00Z\" and DrugLot.${k_lot_id}.status is still AVAILABLE with 5 vials IN_STOCK"

      - name: corner_exposure_read_requires_a_basis_is_role_restricted_and_persists_nothing
        claim_type: computed_read
        grounds:
          - endpoints.GET_/drug-lots/{id}/exposure
          - validations.priority_5
          - validations.priority_3
        distinguishing_aspect: "The exposure endpoint is a pure computed read: basis is a required query parameter (omitting it or passing a value outside {CARRYING, EXPIRATION} is a 400), it is scoped to the business roles and refuses the RetinaSpecialist who may not see acquisition economics, and two identical calls return byte-identical numbers while leaving carrying_cost_accrued_cents on the lot untouched — only the sweep persists."
        test_recipe:
          setup:
            - "lot RX-9001 of Drug REF with 5 vials IN_STOCK at the pinned clock"
          setup_api_calls:
            - *k_clk
            - *k_drug_ref
            - *k_lot
            - call: "GET /drug-lots/${k_lot_id}"
              as: PharmacyTech
              captures: { k_ex_accrued_before: "$.data.carrying_cost_accrued_cents" }
          trigger:
            - call: "GET /drug-lots/${k_lot_id}/exposure"
              as: PharmacyTech
              captures: { k_ex_nobasis: $.data.error_id }
            - call: "GET /drug-lots/${k_lot_id}/exposure"
              payload: { basis: "CARYING" }
              as: PharmacyTech
              captures: { k_ex_badbasis: $.data.error_id }
            - call: "GET /drug-lots/${k_lot_id}/exposure"
              payload: { basis: "CARRYING" }
              as: RetinaSpecialist
              captures: { k_ex_role: $.data.error_id }
            - call: "GET /drug-lots/${k_lot_id}/exposure"
              payload: { basis: "CARRYING" }
              as: BillingSpecialist
              captures: { k_ex_first: $.data.exposure_cents, k_ex_days: $.data.days_held, k_ex_unconsumed: $.data.unconsumed_vials, k_ex_value: $.data.unconsumed_value_cents }
            - call: "GET /drug-lots/${k_lot_id}/exposure"
              payload: { basis: "CARRYING" }
              as: PharmacyTech
              captures: { k_ex_second: $.data.exposure_cents }
            - call: "GET /drug-lots/${k_lot_id}"
              as: PharmacyTech
              captures: { k_ex_accrued_after: "$.data.carrying_cost_accrued_cents" }
          assert:
            - "${k_ex_nobasis} == \"ERR_INVALID_REQUEST\" and ${k_ex_badbasis} == \"ERR_INVALID_REQUEST\", both HTTP 400"
            - "${k_ex_role} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403 — priority 3 fires before the computation"
            - "${k_ex_first} == 11211 with ${k_ex_days} == 31, ${k_ex_unconsumed} == 5 and ${k_ex_value} == 660000"
            - "${k_ex_second} == ${k_ex_first} — the read is referentially transparent at a fixed clock"
            - "${k_ex_accrued_after} == ${k_ex_accrued_before} == 0 — the read persisted nothing"

      - name: corner_encounter_create_links_two_parents_and_rejects_a_study_from_another_patient
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/injection-encounters
          - validations.priority_7
          - validations.priority_15
          - errors[ERR_IMAGING_EYE_MISMATCH]
        distinguishing_aspect: "The encounter is a link between a plan and an imaging study and both ends are checked, in declaration order: an unknown treatment_plan_id is ERR_PLAN_NOT_FOUND before the study is even looked at, an unknown imaging_study_id is ERR_IMAGING_STUDY_NOT_FOUND, and a real study belonging to a DIFFERENT patient with the SAME eye is ERR_IMAGING_EYE_MISMATCH — the rule matches on patient and eye together, so an eye-name match is not enough."
        test_recipe:
          setup:
            - "the corner prologue with the activated OD plan of P-NP, plus a second patient P-OTHER holding an ACTIVE OD study"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - call: "POST /patients"
              payload: { mrn: "MRN-2061", full_name: "Priya Raman", payer_id: "${k_pay_np_id}", member_id: "FOO-61", contact_point: "priya.raman@example.test", notification_channel: "EMAIL" }
              as: PracticeAdmin
              captures: { k_pt_link_id: $.data.id }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_link_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 430, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 55 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_img_link_id: $.data.id }
          trigger:
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "00000000-0000-4000-8000-0000000000aa", imaging_study_id: "00000000-0000-4000-8000-0000000000bb", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ln_plan_missing: $.data.error_id }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "00000000-0000-4000-8000-0000000000bb", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ln_study_missing: $.data.error_id }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "${k_img_link_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ln_wrong_patient: $.data.error_id }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "${k_img_np_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_ln_ok_id: $.data.id, k_ln_ok_plan: $.data.treatment_plan_id, k_ln_ok_img: $.data.imaging_study_id }
          assert:
            - "${k_ln_plan_missing} == \"ERR_PLAN_NOT_FOUND\" — both ids are unknown but the plan is declared first"
            - "${k_ln_study_missing} == \"ERR_IMAGING_STUDY_NOT_FOUND\", both HTTP 404"
            - "${k_ln_wrong_patient} == \"ERR_IMAGING_EYE_MISMATCH\" with HTTP 422 even though the eye letters match"
            - "the accepted create links ${k_ln_ok_plan} == ${k_plan_np_id} and ${k_ln_ok_img} == ${k_img_np_id} and is the only request that reserved a vial"

      - name: corner_claim_creation_is_a_conditional_action_gated_on_attestation
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/claims
          - state_machines.InjectionEncounter.ATTESTED_to_BILLED
          - errors[ERR_ENCOUNTER_STATE_INVALID]
        distinguishing_aspect: "Billing is conditional on wastage attestation, not on documentation: a DOCUMENTED encounter is refused with ERR_ENCOUNTER_STATE_INVALID, and the same call succeeds unchanged once a second clinician attests — the gate is the only thing that moved, which proves the condition is the attestation and not the clinical content."
        test_recipe:
          setup:
            - "the corner prologue with ENC-NP DOCUMENTED but not yet attested"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
          trigger:
            - call: "POST /claims"
              payload: { injection_encounter_id: "${k_enc_np_id}" }
              as: BillingSpecialist
              captures: { k_cc_early: $.data.error_id }
            - call: "POST /injection-encounters/${k_enc_np_id}/attest-wastage"
              payload: { attested_wasted_ml: 0.21 }
              as: RetinaSpecialist
              as_user_id: "${k_cl2_id}"
              captures: { k_cc_enc_status: $.data.status }
            - call: "POST /claims"
              payload: { injection_encounter_id: "${k_enc_np_id}" }
              as: BillingSpecialist
              captures: { k_cc_id: $.data.id, k_cc_allowed: $.data.total_allowed_cents, k_cc_drug_status: $.data.drug_line_status }
          assert:
            - "${k_cc_early} == \"ERR_ENCOUNTER_STATE_INVALID\" with HTTP 409 and no Claim row created"
            - "${k_cc_enc_status} == ATTESTED"
            - "${k_cc_id} exists with ${k_cc_allowed} == 38000 and ${k_cc_drug_status} == PENDING"
            - "the encounter moved ATTESTED -> BILLED exactly once, and the vial stayed ADMINISTERED throughout"

      - name: corner_remittance_posts_one_dimension_at_a_time
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/claims/{id}/remittance
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_drug_and_admin_line_dimensions_advance_independently
          rationale: "The §1.8 non_linear_state_machine instance already exercises the remittance endpoint's all-optional payload, posting the drug dimension alone, then the admin dimension, and asserts that realized_margin_cents is written only when both dimensions are terminal and the encounter moves BILLED -> CLOSED. A separate endpoint-level instance would replay the same calls."

  # ===========================================================================
  # Errors — every catalog entry is triggerable, and the catalog's own contract
  # (status mapping, specificity, single-error responses) is asserted here
  # ===========================================================================
  - section: errors
    instances:

      - name: corner_each_error_family_returns_its_declared_http_status_in_one_error_envelope
        claim_type: error_triggerability
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_MISSING_AUTH_HEADERS]
          - errors[ERR_ROLE_NOT_PERMITTED]
          - errors[ERR_LOT_NOT_FOUND]
          - errors[ERR_DUPLICATE_LOT_NUMBER]
          - errors[ERR_STALE_PLAN_VERSION]
          - errors[ERR_DOSE_EXCEEDS_VIAL_FILL]
        distinguishing_aspect: "Seven requests walk the seven status codes the catalog uses — 400, 401, 403, 404, 409, 412 and 422 — and every one of them comes back as a single-error envelope: response_type \"error\", data holding exactly error_id and message, never a list of problems and never a 500."
        test_recipe:
          setup:
            - "the corner prologue with an activated plan, a DRAFT encounter and lot RX-9001"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
          trigger:
            - call: "GET /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", limit: 0 }
              as: PharmacyTech
              captures: { k_st_400: $.data.error_id, k_st_400_msg: $.data.message }
            - call: "GET /drug-lots/${k_lot_id}"
              as: PharmacyTech
              omit_headers: ["X-User-Role"]
              captures: { k_st_401: $.data.error_id }
            - call: "POST /drug-lots/${k_lot_id}/quarantine"
              payload: { quarantine_reason: "Attempted by the wrong role" }
              as: BillingSpecialist
              captures: { k_st_403: $.data.error_id }
            - call: "GET /drug-lots/bbbbbbbb-0000-4000-8000-00000000000f"
              as: PharmacyTech
              captures: { k_st_404: $.data.error_id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9001", expiration_date: "2027-12-31T00:00:00Z", received_date: "2026-07-05T00:00:00Z", unit_acquisition_cost_cents: 130000, vials_received: 1 }
              as: PharmacyTech
              captures: { k_st_409: $.data.error_id }
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "${k_img_np_id}", encounter_datetime: "2026-08-01T10:00:00Z", expected_treatment_plan_version: "${k_plan_np_v1}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_st_412: $.data.error_id }
            - call: "POST /injection-encounters/${k_enc_np_id}/document"
              payload: { administered_dose_ml: 0.9, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 16 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_st_422: $.data.error_id }
          assert:
            - "${k_st_400} == \"ERR_INVALID_REQUEST\" with HTTP 400 and a non-empty ${k_st_400_msg}"
            - "${k_st_401} == \"ERR_MISSING_AUTH_HEADERS\" with HTTP 401 — one absent header is enough"
            - "${k_st_403} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403"
            - "${k_st_404} == \"ERR_LOT_NOT_FOUND\" with HTTP 404"
            - "${k_st_409} == \"ERR_DUPLICATE_LOT_NUMBER\" with HTTP 409"
            - "${k_st_412} == \"ERR_STALE_PLAN_VERSION\" with HTTP 412"
            - "${k_st_422} == \"ERR_DOSE_EXCEEDS_VIAL_FILL\" with HTTP 422"
            - "every one of the seven responses has response_type \"error\" with data containing exactly the keys error_id and message, and the state of the system is unchanged: DrugLot.${k_lot_id} still has 4 IN_STOCK and 1 RESERVED vial and the encounter is still DRAFT"

      - name: corner_request_shape_is_judged_before_the_ids_in_the_path_are_resolved
        claim_type: priority_ordering
        grounds:
          - validations.priority_5
          - validations.priority_6
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_LOT_NOT_FOUND]
        distinguishing_aspect: "Priority 5 outranks priority 6, so a request that is BOTH malformed and addressed at a non-existent row is reported as ERR_INVALID_REQUEST (400) and never as a 404 — the same URL then returns ERR_LOT_NOT_FOUND once the query is well formed, which proves the 400 was not a masked lookup."
        test_recipe:
          setup:
            - "an empty database beyond the clock and one drug"
          setup_api_calls:
            - *k_clk
            - *k_drug_ref
          trigger:
            - call: "GET /drug-lots/cccccccc-0000-4000-8000-000000000001/exposure"
              as: PharmacyTech
              captures: { k_sh_no_basis: $.data.error_id }
            - call: "GET /drug-lots/cccccccc-0000-4000-8000-000000000001/exposure"
              payload: { basis: "NOT_A_BASIS" }
              as: PharmacyTech
              captures: { k_sh_bad_basis: $.data.error_id }
            - call: "GET /drug-lots/cccccccc-0000-4000-8000-000000000001/exposure"
              payload: { basis: "CARRYING" }
              as: PharmacyTech
              captures: { k_sh_not_found: $.data.error_id }
          assert:
            - "${k_sh_no_basis} == \"ERR_INVALID_REQUEST\" with HTTP 400 although the lot id does not exist either"
            - "${k_sh_bad_basis} == \"ERR_INVALID_REQUEST\" with HTTP 400 for the same reason"
            - "${k_sh_not_found} == \"ERR_LOT_NOT_FOUND\" with HTTP 404 once the query parameter is legal"

      - name: corner_the_shared_state_gate_still_names_the_entity_that_refused
        claim_type: error_triggerability
        grounds:
          - validations.priority_13
          - errors[ERR_PLAN_STATE_INVALID]
          - errors[ERR_AUTHORIZATION_STATE_INVALID]
          - errors[ERR_ENCOUNTER_STATE_INVALID]
          - errors[ERR_LOT_STATE_INVALID]
          - errors[ERR_ENROLLMENT_STATE_INVALID]
        distinguishing_aspect: "One validation rule (priority 13) fans out to eleven distinct error ids. Five refusals raised by the SAME rule in the same fixture — resuming a DRAFT plan, deciding a DRAFT authorization, billing a DOCUMENTED encounter, releasing an AVAILABLE lot and approving an ACTIVE enrollment — each name their own entity instead of collapsing into one generic state error."
        test_recipe:
          setup:
            - "the corner prologue with the OD plan activated and ENC-NP DOCUMENTED"
            - "a second DRAFT plan on the fellow eye, a DRAFT authorization, an AVAILABLE lot and an ACTIVE enrollment"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
            - call: "POST /treatment-plans"
              payload: { patient_id: "${k_pt_np_id}", drug_id: "${k_drug_ref_id}", eye: "OS", loading_doses_required: 3 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_sg_plan_os_id: $.data.id, k_sg_plan_os_status: $.data.status }
            - call: "GET /treatment-plans/${k_plan_np_id}"
              as: BillingSpecialist
              captures: { k_sg_plan_v: "$.data.version" }
            - call: "POST /prior-authorizations"
              payload: { treatment_plan_id: "${k_plan_np_id}", expected_treatment_plan_version: "${k_sg_plan_v}" }
              as: BillingSpecialist
              captures: { k_sg_pa_id: $.data.id, k_sg_pa_status: $.data.status }
            - call: "POST /assistance-enrollments"
              payload: { patient_id: "${k_pt_np_id}", program_type: "INDEPENDENT_FOUNDATION", annual_benefit_cents: 800000, per_encounter_cap_cents: 150000, effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-07-31T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_sg_en_id: $.data.id }
            - call: "POST /assistance-enrollments/${k_sg_en_id}/approve"
              as: BillingSpecialist
              captures: { k_sg_en_status: $.data.status }
          trigger:
            - call: "POST /treatment-plans/${k_sg_plan_os_id}/resume"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_sg_plan_err: $.data.error_id }
            - call: "POST /prior-authorizations/${k_sg_pa_id}/decision"
              payload: { decision: "APPROVED", auth_number: "AUTH-9001", approved_injections: 3, effective_date: "2026-08-01T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_sg_pa_err: $.data.error_id }
            - call: "POST /claims"
              payload: { injection_encounter_id: "${k_enc_np_id}" }
              as: BillingSpecialist
              captures: { k_sg_enc_err: $.data.error_id }
            - call: "POST /drug-lots/${k_lot_id}/release"
              as: ComplianceOfficer
              as_user_id: "U-CO-9"
              captures: { k_sg_lot_err: $.data.error_id }
            - call: "POST /assistance-enrollments/${k_sg_en_id}/approve"
              as: BillingSpecialist
              captures: { k_sg_en_err: $.data.error_id }
          assert:
            - "${k_sg_plan_os_status} == DRAFT, ${k_sg_pa_status} == DRAFT and ${k_sg_en_status} == ACTIVE in the fixture"
            - "${k_sg_plan_err} == \"ERR_PLAN_STATE_INVALID\""
            - "${k_sg_pa_err} == \"ERR_AUTHORIZATION_STATE_INVALID\" (submission must precede a decision)"
            - "${k_sg_enc_err} == \"ERR_ENCOUNTER_STATE_INVALID\" (billing requires ATTESTED)"
            - "${k_sg_lot_err} == \"ERR_LOT_STATE_INVALID\" (release requires QUARANTINED)"
            - "${k_sg_en_err} == \"ERR_ENROLLMENT_STATE_INVALID\" (approve requires PENDING)"
            - "all five are HTTP 409 from the same rule, and no row changed state as a result"

  # ===========================================================================
  # RBAC — role matrices plus the segregation_of_duties role model
  # ===========================================================================
  - section: rbac
    instances:

      - name: corner_every_write_family_is_exclusive_to_exactly_one_role
        claim_type: role_matrix
        grounds:
          - roles.PracticeAdmin.exclusive_operations
          - roles.RetinaSpecialist.exclusive_operations
          - roles.PharmacyTech.exclusive_operations
          - roles.BillingSpecialist.exclusive_operations
          - roles.ComplianceOfficer.exclusive_operations
          - validations.priority_3
        distinguishing_aspect: "The six roles partition the write surface with no overlap and no hierarchy: reference data is PracticeAdmin-only, clinical writes are RetinaSpecialist-only, inventory receipt is PharmacyTech-only, money is BillingSpecialist-only and recall initiation is ComplianceOfficer-only. Each probe pairs the refusal with the same call succeeding under the owning role, so the 403 cannot be explained by a bad payload."
        test_recipe:
          setup:
            - "the corner prologue with one drug, one payer, one patient, one clinician and lot RX-9001"
          setup_api_calls:
            - *k_clk
            - *k_pay_np
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_lot
          trigger:
            - call: "POST /payers"
              payload: { name: "Wrong Role Payer", payer_type: "COMMERCIAL", coinsurance_rate: 0.2 }
              as: PharmacyTech
              captures: { k_rb_admin_denied: $.data.error_id }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 400, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 60 }
              as: PracticeAdmin
              captures: { k_rb_clinical_denied: $.data.error_id }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 400, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 60 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_rb_clinical_ok: $.data.id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9301", expiration_date: "2027-10-31T00:00:00Z", received_date: "2026-07-10T00:00:00Z", unit_acquisition_cost_cents: 130500, vials_received: 1 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_rb_inventory_denied: $.data.error_id }
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9301", expiration_date: "2027-10-31T00:00:00Z", received_date: "2026-07-10T00:00:00Z", unit_acquisition_cost_cents: 130500, vials_received: 1 }
              as: PharmacyTech
              captures: { k_rb_inventory_ok: $.data.id }
            - call: "POST /assistance-enrollments"
              payload: { patient_id: "${k_pt_np_id}", program_type: "INDEPENDENT_FOUNDATION", annual_benefit_cents: 800000, per_encounter_cap_cents: 150000, effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-07-31T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "U-CO-7"
              captures: { k_rb_money_denied: $.data.error_id }
            - call: "POST /assistance-enrollments"
              payload: { patient_id: "${k_pt_np_id}", program_type: "INDEPENDENT_FOUNDATION", annual_benefit_cents: 800000, per_encounter_cap_cents: 150000, effective_date: "2026-08-01T00:00:00Z", expiration_date: "2027-07-31T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_rb_money_ok: $.data.id }
            - call: "POST /lot-recalls"
              payload: { drug_lot_id: "${k_lot_id}", recall_class: "CLASS_III", reason: "Attempted by pharmacy" }
              as: PharmacyTech
              captures: { k_rb_recall_denied: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: BillingSpecialist
              captures: { k_rb_clock_denied: $.data.error_id }
          assert:
            - "${k_rb_admin_denied}, ${k_rb_clinical_denied}, ${k_rb_inventory_denied}, ${k_rb_money_denied}, ${k_rb_recall_denied} and ${k_rb_clock_denied} are all \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403"
            - "${k_rb_clinical_ok}, ${k_rb_inventory_ok} and ${k_rb_money_ok} are created ids — the identical payload succeeds under the owning role"
            - "no LotRecall row exists and the logical clock is still 2026-08-01T00:00:00Z after the refusals"
            - "no role inherits another's writes: PracticeAdmin is reference data only and cannot substitute for any operational role"

      - name: corner_read_access_is_shared_by_the_staff_roles_but_not_uniformly
        claim_type: role_matrix
        grounds:
          - roles.PharmacyTech.shared_operations
          - roles.Patient.shared_operations
          - endpoints.GET_/drug-lots/{id}/exposure
          - validations.priority_3
        distinguishing_aspect: "Read access is shared but not global: all five staff roles may read the lot, the Patient role may not read inventory at all, and the exposure read is narrower than its own parent resource — the RetinaSpecialist and the ComplianceOfficer can see the lot but not its acquisition economics, which is the only endpoint where a GET is denied to a staff role."
        test_recipe:
          setup:
            - "lot RX-9001 and patient P-NP on file"
          setup_api_calls:
            - *k_clk
            - *k_pay_np
            - *k_drug_ref
            - *k_pt_np
            - *k_lot
          trigger:
            - call: "GET /drug-lots/${k_lot_id}"
              as: PracticeAdmin
              captures: { k_rr_admin: "$.data.lot_number" }
            - call: "GET /drug-lots/${k_lot_id}"
              as: ComplianceOfficer
              as_user_id: "U-CO-8"
              captures: { k_rr_co: "$.data.lot_number" }
            - call: "GET /drug-lots/${k_lot_id}"
              as: Patient
              as_user_id: "${k_pt_np_id}"
              captures: { k_rr_patient_denied: $.data.error_id }
            - call: "GET /drug-lots/${k_lot_id}/exposure"
              payload: { basis: "CARRYING" }
              as: ComplianceOfficer
              as_user_id: "U-CO-8"
              captures: { k_rr_exposure_denied: $.data.error_id }
            - call: "GET /drug-lots/${k_lot_id}/exposure"
              payload: { basis: "CARRYING" }
              as: PracticeAdmin
              captures: { k_rr_exposure_ok: $.data.exposure_cents }
            - call: "GET /recall-notifications"
              payload: { patient_id: "${k_pt_np_id}" }
              as: Patient
              as_user_id: "${k_pt_np_id}"
              captures: { k_rr_notes_total: "$.data[0].status" }
          assert:
            - "${k_rr_admin} == ${k_rr_co} == \"RX-9001\" — the staff roles share the lot read"
            - "${k_rr_patient_denied} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403 — Patient is not on the inventory read list"
            - "${k_rr_exposure_denied} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403 while ${k_rr_exposure_ok} == 11211 for PracticeAdmin"
            - "the Patient's recall-notification list is HTTP 200 with response_type \"array\", zero rows and total_count 0 at this point (${k_rr_notes_total} absent), proving the endpoint is reachable for the role"

      - name: corner_role_and_identity_are_orthogonal_gates_on_the_same_second_person_rule
        claim_type: segregation_of_duties
        grounds:
          - roles.RetinaSpecialist.notes
          - roles.ComplianceOfficer.notes
          - validations.priority_3
          - validations.priority_9
          - validations.priority_11
        distinguishing_aspect: "Two-person control needs a second person of the SAME role, and the role check runs first: wastage attestation by a BillingSpecialist is ERR_ROLE_NOT_PERMITTED rather than an accepted second signature, and closing a recall as PharmacyTech is likewise a role refusal — only after the role matches does the identity comparison (priority 9 for attestation, priority 11 for closure) decide, and only a different user of that same role satisfies it."
        test_recipe:
          setup:
            - "the corner prologue with ENC-NP DOCUMENTED by clinician CL1, and a recall opened by U-CO-1 that is otherwise ready to close"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
          trigger:
            - call: "POST /injection-encounters/${k_enc_np_id}/attest-wastage"
              payload: { attested_wasted_ml: 0.21 }
              as: BillingSpecialist
              captures: { k_so_role: $.data.error_id }
            - call: "POST /injection-encounters/${k_enc_np_id}/attest-wastage"
              payload: { attested_wasted_ml: 0.21 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_so_same_user: $.data.error_id }
            - call: "POST /injection-encounters/${k_enc_np_id}/attest-wastage"
              payload: { attested_wasted_ml: 0.21 }
              as: RetinaSpecialist
              as_user_id: "${k_cl2_id}"
              captures: { k_so_ok_status: $.data.status, k_so_attester: $.data.attested_by_clinician_id }
            - call: "POST /lot-recalls"
              payload: { drug_lot_id: "${k_lot_id}", recall_class: "CLASS_III", reason: "Label defect on the outer carton" }
              as: ComplianceOfficer
              as_user_id: "U-CO-1"
              captures: { k_so_recall_id: $.data.id }
            - call: "POST /lot-recalls/${k_so_recall_id}/close"
              payload: { closure_note: "Attempted by pharmacy" }
              as: PharmacyTech
              captures: { k_so_close_role: $.data.error_id }
          assert:
            - "${k_so_role} == \"ERR_ROLE_NOT_PERMITTED\" with HTTP 403 — a different role is not a valid second signature"
            - "${k_so_same_user} == \"ERR_SEGREGATION_OF_DUTIES\" with HTTP 403 for the injecting clinician"
            - "${k_so_ok_status} == ATTESTED with ${k_so_attester} == ${k_cl2_id} — a different user of the same role is what the rule wants"
            - "${k_so_close_role} == \"ERR_ROLE_NOT_PERMITTED\" and not ERR_RECALL_CLOSER_CONFLICT: priority 3 runs before priority 11"

      - name: corner_entity_backed_identities_must_resolve_while_opaque_identities_are_free_text
        claim_type: role_matrix
        grounds:
          - roles.RetinaSpecialist.identity
          - roles.Patient.identity
          - roles.PharmacyTech.identity
          - validations.priority_4
        distinguishing_aspect: "Only two roles are entity-backed: a RetinaSpecialist's X-User-ID must resolve to a Clinician and a Patient's must resolve to a Patient, otherwise the request is ERR_ACTING_IDENTITY_NOT_FOUND. The four opaque roles are not looked up at all, so a PharmacyTech acting as the free-text id \"night-shift-terminal-3\" is accepted and the lot is created."
        test_recipe:
          setup:
            - "one drug, one payer, one patient and one clinician on file"
          setup_api_calls:
            - *k_clk
            - *k_pay_np
            - *k_drug_ref
            - *k_pt_np
            - *k_cl1
          trigger:
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9401", expiration_date: "2027-11-30T00:00:00Z", received_date: "2026-07-12T00:00:00Z", unit_acquisition_cost_cents: 129500, vials_received: 2 }
              as: PharmacyTech
              as_user_id: "night-shift-terminal-3"
              captures: { k_id_opaque_id: $.data.id, k_id_opaque_status: $.data.status }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-01T00:00:00Z", central_subfield_thickness_um: 400, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 60 }
              as: RetinaSpecialist
              as_user_id: "${k_pt_np_id}"
              captures: { k_id_clinician_missing: $.data.error_id }
            - call: "GET /recall-notifications"
              payload: { patient_id: "${k_pt_np_id}" }
              as: Patient
              as_user_id: "${k_cl1_id}"
              captures: { k_id_patient_missing: $.data.error_id }
          assert:
            - "${k_id_opaque_status} == AVAILABLE — the opaque identity is never resolved against any table"
            - "${k_id_clinician_missing} == \"ERR_ACTING_IDENTITY_NOT_FOUND\" with HTTP 403: a real Patient id is not a Clinician id"
            - "${k_id_patient_missing} == \"ERR_ACTING_IDENTITY_NOT_FOUND\" with HTTP 403: a real Clinician id is not a Patient id"
            - "both entity-backed failures are 403 and not 401 — the headers were present and the role name was known"

  # ===========================================================================
  # Cross-cutting complexity layers — one walk per declared layer in §1.0
  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: corner_authorization_create_is_the_second_occ_guarded_write_on_the_same_parent
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.pa-create-stale-plan
          - endpoints.POST_/prior-authorizations
          - errors[ERR_STALE_PLAN_VERSION]
        distinguishing_aspect: "The plan carries a single version counter that BOTH OCC-guarded writes share: the version observed when the plan was created is already stale after activation, so a PA create quoting it is 412; quoting the current version succeeds and itself bumps the plan to the next version, which makes the value the client just sent stale for the very next call."
        test_recipe:
          setup:
            - "the corner prologue with the OD plan created (version observed at create) and then activated (version advanced)"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
          trigger:
            - call: "POST /prior-authorizations"
              payload: { treatment_plan_id: "${k_plan_np_id}", expected_treatment_plan_version: "${k_plan_np_v1}" }
              as: BillingSpecialist
              captures: { k_occ_stale: $.data.error_id }
            - call: "POST /prior-authorizations"
              payload: { treatment_plan_id: "${k_plan_np_id}", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: BillingSpecialist
              captures: { k_occ_pa_id: $.data.id, k_occ_pa_status: $.data.status, k_occ_pa_drug: $.data.drug_id, k_occ_pa_payer: $.data.payer_id }
            - call: "POST /prior-authorizations"
              payload: { treatment_plan_id: "${k_plan_np_id}", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: BillingSpecialist
              captures: { k_occ_stale2: $.data.error_id }
            - call: "GET /treatment-plans/${k_plan_np_id}"
              as: BillingSpecialist
              captures: { k_occ_plan_v: "$.data.version" }
          assert:
            - "${k_occ_stale} == \"ERR_STALE_PLAN_VERSION\" with HTTP 412 and no PriorAuthorization row created"
            - "${k_occ_pa_status} == DRAFT with ${k_occ_pa_drug} == ${k_drug_ref_id} and ${k_occ_pa_payer} == ${k_pay_np_id}, copied from the plan and the patient"
            - "${k_occ_stale2} == \"ERR_STALE_PLAN_VERSION\" — the accepted create invalidated the very version it was sent with"
            - "${k_occ_plan_v} == ${k_plan_np_v} + 1 — exactly one increment, from the accepted write only"

      - name: corner_policy_selection_is_keyed_on_the_patients_payer_and_the_effective_drug
        claim_type: selector_policy
        grounds:
          - complexity_profile.complexity_layers
          - calculations.billing_units_split
          - endpoints.POST_/claims
          - entities.PayerDrugPolicy
        distinguishing_aspect: "Pricing selects exactly one PayerDrugPolicy — the row keyed on the patient's own payer and the encounter's effective drug. A far more generous policy for the same drug under a rival payer and a policy for a different drug under the same payer are both present in the database and both ignored: the claim is allowed 38000, not the 215000 the rival policy would have produced."
        test_recipe:
          setup:
            - "the corner prologue plus two decoy policies: PAY-COMM/REF at 20000 per unit with wastage reimbursed, and PAY-NP/DRUG-T at 30000 per unit"
            - "ENC-NP documented at 0.06 ml and attested at 0.21 ml so the split is 2 administered and 8 wasted billing units"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_drug_t
            - *k_pol_np_ref
            - call: "POST /payer-drug-policies"
              payload: { payer_id: "${k_pay_comm_id}", drug_id: "${k_drug_ref_id}", coverage_tier: "PREFERRED", drug_allowed_cents_per_billing_unit: 20000, admin_allowed_cents: 15000, wastage_reimbursed: true, pa_required: false }
              as: PracticeAdmin
              captures: { k_sel_decoy1_id: $.data.id }
            - call: "POST /payer-drug-policies"
              payload: { payer_id: "${k_pay_np_id}", drug_id: "${k_drug_t_id}", coverage_tier: "PREFERRED", drug_allowed_cents_per_billing_unit: 30000, admin_allowed_cents: 12000, wastage_reimbursed: true, pa_required: false }
              as: PracticeAdmin
              captures: { k_sel_decoy2_id: $.data.id }
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
            - *k_enc_np_att
          trigger:
            - call: "POST /claims"
              payload: { injection_encounter_id: "${k_enc_np_id}" }
              as: BillingSpecialist
              captures: { k_sel_claim_id: $.data.id, k_sel_drug_allowed: $.data.drug_allowed_cents, k_sel_waste_allowed: $.data.wastage_allowed_cents, k_sel_admin_allowed: $.data.admin_allowed_cents, k_sel_total: $.data.total_allowed_cents, k_sel_coins: $.data.coinsurance_cents, k_sel_units: $.data.billed_billing_units }
          assert:
            - "${k_sel_units} == 10 with 2 administered and 8 wasted billing units"
            - "${k_sel_drug_allowed} == 28000 (2 x 14000), ${k_sel_waste_allowed} == 0 (the selected policy does not reimburse wastage) and ${k_sel_admin_allowed} == 10000"
            - "${k_sel_total} == 38000 and ${k_sel_coins} == 3800 at the NP payer's 0.10 rate"
            - "the rival PAY-COMM policy ${k_sel_decoy1_id} would have produced 215000 (2 x 20000 + 8 x 20000 + 15000) and the PAY-NP/DRUG-T policy ${k_sel_decoy2_id} would have produced a different admin allowance — neither value appears anywhere on the claim"

      - name: corner_recall_cascade_reaches_vials_encounters_and_notifications
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.DrugLot.AVAILABLE_to_RECALLED
        excluded_because:
          difficulty_instance: transitive_cascade / lot_recall_quarantines_vials_voids_drafts_and_generates_notifications
          rationale: "The §1.8 transitive_cascade instance already walks the full multi-hop chain end to end — lot to vials, vials to the holding DRAFT encounter, encounter to its authorization, and exposed encounters to generated notifications — and asserts the ordering and the per-hop counts. A layer-level replay would repeat it."

      - name: corner_margin_is_reported_twice_from_the_same_claim
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.claim_margin
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_margin_provisional_vs_realized_diverge_on_one_claim
          rationale: "The §1.8 dual_variant_calc instance already prices one claim under both variants, asserts the provisional and realized literals differ, and pins the reconciliation point at the second remittance. The layer claim is exactly that instance."

  # ===========================================================================
  # Consistency model — §1.0 declares immediate
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: corner_every_derived_field_is_already_correct_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/injection-encounters
          - endpoints.POST_/injection-encounters/{id}/document
        distinguishing_aspect: "Nothing in this API settles later: the encounter-create response already names the resolved effective drug, the reserved vial and the selected authorization, the document response already carries the billing units and modifiers, and an immediate read of the parent plan and the lot shows the bumped version, the new last_encounter_id and the moved vial counters — no second call and no delay is needed to observe any of it."
        test_recipe:
          setup:
            - "the corner prologue with the OD plan activated and lot RX-9001 holding 5 vials"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - *k_lot
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
          trigger:
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "${k_img_np_id}", encounter_datetime: "2026-08-01T09:00:00Z", expected_treatment_plan_version: "${k_plan_np_v}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_im_enc_id: $.data.id, k_im_drug: $.data.effective_drug_id, k_im_vial: $.data.vial_id, k_im_clinician: $.data.clinician_id, k_im_status: $.data.status, k_im_prev: $.data.previous_encounter_id }
            - call: "GET /treatment-plans/${k_plan_np_id}"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_im_plan_v: "$.data.version", k_im_plan_last: "$.data.last_encounter_id" }
            - call: "GET /drug-lots/${k_lot_id}"
              as: PharmacyTech
              captures: { k_im_lot_hand: "$.data.vials_on_hand", k_im_lot_res: "$.data.vials_reserved" }
            - call: "POST /injection-encounters/${k_im_enc_id}/document"
              payload: { administered_dose_ml: 0.06, injection_site_prep_confirmed: true, post_injection_iop_mmhg: 16 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_im_units: $.data.total_billed_billing_units, k_im_mods: $.data.modifiers, k_im_waste: $.data.wasted_ml, k_im_doc_status: $.data.status }
            - call: "GET /vials/${k_im_vial}"
              as: PharmacyTech
              captures: { k_im_vial_status: "$.data.status", k_im_vial_admin_at: "$.data.administered_at" }
          assert:
            - "${k_im_status} == DRAFT with ${k_im_drug} == ${k_drug_ref_id}, ${k_im_clinician} == ${k_cl1_id}, a non-null ${k_im_vial} and ${k_im_prev} == null — all four are in the create response itself"
            - "${k_im_plan_v} == ${k_plan_np_v} + 1 and ${k_im_plan_last} == ${k_im_enc_id} on the very next read"
            - "${k_im_lot_hand} == 4 and ${k_im_lot_res} == 1 immediately after the create"
            - "${k_im_doc_status} == DOCUMENTED with ${k_im_units} == 10, ${k_im_waste} == 0.21 and ${k_im_mods} == [\"RT\", \"JW\"] in the document response"
            - "${k_im_vial_status} == ADMINISTERED with ${k_im_vial_admin_at} == \"2026-08-01T09:00:00Z\" — the vial ledger moved in the same request"

      - name: corner_a_rejected_write_leaves_no_partial_state_behind
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - validations.priority_26
          - endpoints.POST_/injection-encounters
        distinguishing_aspect: "A request that passes the early checks and fails a late one applies nothing at all: an encounter create that clears authentication, the plan's state and the optimistic-concurrency check but finds no eligible vial leaves the plan's version, the plan's last_encounter_id and the authorization's injections_used exactly as they were, and creates no encounter row — the version bump is a consequence of success, not of arrival."
        test_recipe:
          setup:
            - "the corner prologue with an activated plan and an APPROVED authorization, but with the only lot's vials all already consumed"
          setup_api_calls:
            - *k_clk
            - *k_pay_comm
            - *k_pay_np
            - *k_pay_mcr
            - *k_drug_ref
            - *k_pol_np_ref
            - *k_pt_np
            - *k_cl1
            - *k_cl2
            - call: "POST /drug-lots"
              payload: { drug_id: "${k_drug_ref_id}", lot_number: "RX-9500", expiration_date: "2027-05-31T00:00:00Z", received_date: "2026-07-08T00:00:00Z", unit_acquisition_cost_cents: 130000, vials_received: 1 }
              as: PharmacyTech
              captures: { k_at_lot_id: $.data.id }
            - *k_img_np
            - *k_plan_np
            - *k_plan_np_act
            - *k_enc_np
            - *k_enc_np_doc
            - call: "GET /treatment-plans/${k_plan_np_id}"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_at_plan_v: "$.data.version", k_at_plan_last: "$.data.last_encounter_id", k_at_plan_due: "$.data.next_due_date" }
            - call: "POST /imaging-studies"
              payload: { patient_id: "${k_pt_np_id}", eye: "OD", study_datetime: "2026-08-29T08:00:00Z", central_subfield_thickness_um: 405, intraretinal_fluid: true, subretinal_fluid: false, new_hemorrhage: false, va_letter_score: 58 }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_at_img_id: $.data.id }
          trigger:
            - call: "POST /injection-encounters"
              payload: { treatment_plan_id: "${k_plan_np_id}", imaging_study_id: "${k_at_img_id}", encounter_datetime: "2026-08-29T09:00:00Z", expected_treatment_plan_version: "${k_at_plan_v}" }
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_at_err: $.data.error_id }
            - call: "GET /treatment-plans/${k_plan_np_id}"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_at_plan_v2: "$.data.version", k_at_plan_last2: "$.data.last_encounter_id", k_at_plan_due2: "$.data.next_due_date" }
            - call: "GET /injection-encounters?treatment_plan_id=${k_plan_np_id}"
              as: RetinaSpecialist
              as_user_id: "${k_cl1_id}"
              captures: { k_at_first_enc: "$.data[0].id" }
          assert:
            - "${k_at_err} == \"ERR_NO_ELIGIBLE_VIAL\" with HTTP 409 — the lot's single vial is already ADMINISTERED"
            - "${k_at_plan_v2} == ${k_at_plan_v}, ${k_at_plan_last2} == ${k_at_plan_last} and ${k_at_plan_due2} == ${k_at_plan_due} — the rejected create bumped nothing"
            - "the encounter list still holds exactly one row and ${k_at_first_enc} == ${k_enc_np_id}"
            - "DrugLot.${k_at_lot_id}.vials_on_hand == 0 with vials_administered == 1 and vials_reserved == 0"
