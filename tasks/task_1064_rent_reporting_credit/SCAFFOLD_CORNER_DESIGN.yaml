  # =========================================================================
  # Cross-Cutting Complexity Layers — optimistic_concurrency
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_lease_version_on_payment_rejected
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[payment-record-stale-lease]', 'errors[ERR_STALE_VERSION]']
        distinguishing_aspect: "A second POST /rent-payments carrying the pre-first-payment lease version (stale) is rejected with ERR_STALE_VERSION (412); the first payment already advanced Lease.version."
        test_recipe:
          setup: ["A VERIFIED lease; one payment already recorded (Lease.version advanced past the client's captured value)."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tenants"
              payload: { full_name: "Occ Tenant", email: "occ@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "60 OCC Rd", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-05", due_date: "2026-05-05T00:00:00Z", paid_date: "2026-05-05T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
          trigger:
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-05T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { err: $.data.error_id }
          assert:
            - "POST /api/rent-payments .data.error_id == ERR_STALE_VERSION"
            - "response http status == 412"

      - name: occ_correct_lease_version_on_payment_succeeds
        claim_type: optimistic_concurrency
        grounds: ['concurrency_rules[payment-record-stale-lease]', entities.RentPayment]
        distinguishing_aspect: "POST /rent-payments with the current Lease.version succeeds (201) and advances Lease.version by 1."
        test_recipe:
          setup: ["A VERIFIED lease at version 2."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tenants"
              payload: { full_name: "Ok Tenant", email: "ok@x.com" }
              as: PlatformAdmin
              captures: { t_id: $.data.id }
            - call: "POST /api/landlords"
              payload: { company_name: "Acme PM", email: "pm@x.com" }
              as: PlatformAdmin
              captures: { ll_id: $.data.id }
            - call: "POST /api/leases"
              payload: { tenant_id: "${t_id}", landlord_id: "${ll_id}", property_address: "61 OK Rd", rent_amount_cents: 120000, monthly_due_day: 5, lease_start: "2026-01-01T00:00:00Z", lease_end: "2027-01-01T00:00:00Z" }
              as: Tenant
              as_user_id: "${t_id}"
              captures: { lease_id: $.data.id }
            - call: "POST /api/leases/${lease_id}/verify"
              payload: { decision: "VERIFIED" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { lease_v2: $.data.version }
          trigger:
            - call: "POST /api/rent-payments"
              payload: { lease_id: "${lease_id}", period_month: "2026-06", due_date: "2026-06-05T00:00:00Z", paid_date: "2026-06-05T00:00:00Z", amount_paid_cents: 120000, expected_lease_version: "${lease_v2}" }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { pay_id: $.data.id }
          assert:
            - "POST /api/rent-payments response http status == 201"
            - "GET /api/leases/${lease_id} .data.version == 3"

