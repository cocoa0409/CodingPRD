      - name: program_director_opaque_identity_can_never_be_a_segregation_of_duties_counterparty
        claim_type: Exclusive operations
        grounds:
          - roles[ProgramDirector].identity
          - roles[ProgramDirector].exclusive_operations
          - endpoints[POST /intake-screenings/{intake_id}/decide]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "ProgramDirector's identity is opaque, so it never resolves to a Representative row and can never collide with screened_by_representative_id, preparer identity or Accreditation.representative_id — meaning the director can perform BOTH halves of a workflow whose halves are segregated for entity-backed roles: it opens an intake and then decides that very intake, which no IntakeScreener could do. It also exercises the director's full exclusive list positively — clock, cycle, facility, recognition, roster, accreditation — the mirror image of program_director_exclusive_operations_are_denied_to_all_five_other_roles."
        test_recipe:
          setup:
            - "Empty database. Every call below is made by the ProgramDirector unless noted, and no X-User-ID is required for it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00.000Z" }
              as: ProgramDirector
