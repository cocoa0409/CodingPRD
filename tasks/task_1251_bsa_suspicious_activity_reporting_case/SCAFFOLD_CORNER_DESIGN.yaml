        claim_type: scheduled_action
        grounds: ["errors[ERR_CERTIFICATION_EXPIRED]", "validations[priority=18]", entities.InfoShareRequest.fields.certification_expires_at]
        distinguishing_aspect: "Certification expiry in isolation (no LE inquiry open): certified 2026-01-01 -> expires 2027-01-01T00:00:00Z; a send at 2027-01-02 is 422 ERR_CERTIFICATION_EXPIRED, while a send at exactly 2027-01-01T00:00:00Z would pass the temporal gate (inclusive)."
        test_recipe:
          setup: ["Customer cu1; InfoShareRequest isr1 DRAFT with certified_at 2026-01-01T00:00:00Z (created at default clock); clock advanced past expiry"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /info-share-requests", payload: { direction: "OUTBOUND", counterparty_institution_id: "INST-9", subject_customer_id: "${cu1}", certified_at: "2026-01-01T00:00:00Z", purpose_note: "Coordinate on suspected structuring" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { isr1: $.data.id, isr1_exp: $.data.certification_expires_at } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-02T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /info-share-requests/${isr1}/send", as: BSAAnalyst, as_user_id: "${an1}", captures: { err: $.data.error_id } }
          assert:
            - "InfoShareRequest.${isr1}.certification_expires_at == 2027-01-01T00:00:00Z (certified_at + 365 days, computed at creation)"
            - "Send at 2027-01-02: 422 ERR_CERTIFICATION_EXPIRED; status remains DRAFT, sent_at null"

      - name: share_expires_after_30_days_sweep
        claim_type: scheduled_action
        grounds: [state_machines.InfoShareRequest.SENT_to_EXPIRED, "endpoints.POST /ops/jobs/daily-compliance-sweep"]
        distinguishing_aspect: "Unanswered OUTBOUND shares expire via the sweep with a strict-greater 30-day rule: at exactly sent_at + 30d the share is still SENT; one second past, it flips to EXPIRED."
        test_recipe:
          setup: ["isr1 SENT at 2026-05-01T00:00:00Z (default clock)"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /info-share-requests", payload: { direction: "OUTBOUND", counterparty_institution_id: "INST-9", subject_customer_id: "${cu1}", certified_at: "2026-01-01T00:00:00Z", purpose_note: "Coordinate on suspected structuring" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { isr1: $.data.id } }
            - { call: "POST /info-share-requests/${isr1}/send", as: BSAAnalyst, as_user_id: "${an1}" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: ComplianceAdmin }
            - { call: "POST /ops/jobs/daily-compliance-sweep", as: ComplianceAdmin, captures: { exp_boundary: $.data.shares_expired } }
            - { call: "GET /info-share-requests/${isr1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { isr1_mid: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:01Z" }, as: ComplianceAdmin }
            - { call: "POST /ops/jobs/daily-compliance-sweep", as: ComplianceAdmin, captures: { exp_after: $.data.shares_expired } }
            - { call: "GET /info-share-requests/${isr1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { isr1_end: $.data.status } }
          assert:
            - "At sent_at + 30d exactly: shares_expired == 0, status still SENT (strict > rule)"
            - "At sent_at + 30d + 1s: shares_expired == 1, status == EXPIRED"

      - name: narrative_length_computed_exactly
        claim_type: derived_field_reconciliation
        grounds: [entities.SARReport.fields.narrative_length, "endpoints.PUT /sar-reports/{id}/narrative"]
        distinguishing_aspect: "narrative_length is server-computed from the stored narrative (exactly 640 for the standard fixture text) and is refreshed on every accepted edit — a client-supplied value would be ignored."
        test_recipe:
          setup: ["SAR1 DRAFT"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { c1: $.data.id } }
            - { call: "POST /cases/${c1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /cases/${c1}/start-investigation", as: BSAAnalyst, as_user_id: "${an1}", captures: { c1_v: $.data.version } }
            - { call: "POST /cases/${c1}/sar-decision", payload: { decision: "SAR_REQUIRED", decision_rationale: "Unexplained structuring pattern", expected_case_version: "${c1_v}" }, as: BSAAnalyst, as_user_id: "${an1}" }
            - { call: "POST /cases/${c1}/sar-reports", payload: { activity_start_date: "2026-03-10", activity_end_date: "2026-04-10" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { sar1: $.data.id, sar1_v: $.data.version } }
          trigger:
            - { call: "PUT /sar-reports/${sar1}/narrative", payload: { narrative: "Narrative: Between 2026-03-10 and 2026-04-10 the subject account received a pattern of cash deposits in amounts between 300000 and 500000 cents, each below the 1000000-cent reporting threshold, aggregating 1300000 cents across three branch and ATM visits within seven days. The customer could not explain the source of funds when contacted, the stated occupation is inconsistent with cash-intensive activity, and the deposits were followed by rapid transfers out of the account. This activity is consistent with structuring designed to evade currency transaction reporting requirements under 31 USC 5324 and is being reported as suspicious.", expected_sar_version: "${sar1_v}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { len1: $.data.narrative_length } }
          assert:
            - "SARReport.${sar1}.narrative_length == 640 after the edit (exact character count of the stored narrative)"

      - name: alert_pins_generating_threshold_version
        claim_type: version_pinning
        grounds: [entities.Alert.fields.scenario_threshold_id, state_machines.ScenarioThreshold.ACTIVE_to_SUPERSEDED]
        distinguishing_aspect: "Version pinning: an alert generated under threshold v1 keeps scenario_threshold_id == v1 even after v2 is activated (v1 SUPERSEDED with effective_to == v2.effective_from == 2026-06-01); the scenario's current_active_threshold_id moves to v2."
        test_recipe:
          setup: ["Scenario ACTIVE with v1 ACTIVE (effective_from 2026-04-01); alert al1 generated; then v2 proposed (effective_from 2026-06-01), approved, activated"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /customers/${cu1}/accounts", payload: { account_number: "ACC-8603" }, as: ComplianceAdmin, captures: { ac1: $.data.id } }
            - { call: "POST /monitoring-scenarios", payload: { scenario_code: "STRUCT-CASH-7D", name: "Structuring cash 7d", applies_to_txn_types: ["CASH_DEPOSIT"], direction_filter: "CREDIT" }, as: ComplianceAdmin, captures: { sc1: $.data.id, sc1_v: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_v}", threshold_amount_cents: 1000000, lookback_days: 7, min_transaction_count: 3, weight_amount: 0.5, weight_velocity: 0.3, weight_geo: 0.2, effective_from: "2026-04-01T00:00:00Z", tuning_rationale: "Initial calibration", backtest_precision: 0.7, backtest_recall: 0.6 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th1: $.data.id } }
            - { call: "POST /threshold-versions/${th1}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /monitoring-scenarios/${sc1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th1}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-28T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-29T10:00:00Z", channel: "BRANCH" }, as: ComplianceAdmin }
            - { call: "POST /accounts/${ac1}/transactions", payload: { amount_cents: 400000, txn_type: "CASH_DEPOSIT", direction: "CREDIT", counterparty_country: "US", posted_at: "2026-04-30T10:00:00Z", channel: "ATM" }, as: ComplianceAdmin }
            - { call: "POST /monitoring-scenarios/${sc1}/evaluate", payload: { account_id: "${ac1}", evaluated_at: "2026-05-01T00:00:00Z" }, as: ComplianceAdmin, captures: { al1: $.data.alert_id } }
          trigger:
            - { call: "GET /monitoring-scenarios/${sc1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { sc1_vnow: $.data.version } }
            - { call: "POST /monitoring-scenarios/${sc1}/threshold-versions", payload: { expected_scenario_version: "${sc1_vnow}", threshold_amount_cents: 900000, lookback_days: 7, min_transaction_count: 2, weight_amount: 0.6, weight_velocity: 0.3, weight_geo: 0.1, effective_from: "2026-06-01T00:00:00Z", tuning_rationale: "Tightened after review", backtest_precision: 0.8, backtest_recall: 0.7 }, as: BSAAnalyst, as_user_id: "${an1}", captures: { th2: $.data.id } }
            - { call: "POST /threshold-versions/${th2}/approve", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "POST /threshold-versions/${th2}/activate", as: BSAManager, as_user_id: "${mg1}" }
            - { call: "GET /alerts/${al1}", as: BSAAnalyst, as_user_id: "${an1}", captures: { al1_th: $.data.scenario_threshold_id } }
            - { call: "GET /monitoring-scenarios/${sc1}/threshold-versions", as: BSAAnalyst, as_user_id: "${an1}", captures: { th1_state: "$.data[0].status", th1_to: "$.data[0].effective_to" } }
          assert:
            - "Alert.${al1}.scenario_threshold_id == ${th1} — pinned at generation, unchanged by the v2 activation"
            - "ScenarioThreshold.${th1}.status == SUPERSEDED with effective_to == 2026-06-01T00:00:00Z (half-open adjacency to v2)"
            - "GET /monitoring-scenarios/${sc1}: current_active_threshold_id == ${th2}"

  - section: consistency_model
    instances:
      - name: immediate_consistency_on_assign
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, "endpoints.POST /cases/{id}/assign", entities.Analyst.fields.assigned_open_cases]
        distinguishing_aspect: "Immediate consistency: the assign response itself shows status ASSIGNED, the assigned analyst id, and the bumped version; a read of the analyst in the same instant already reflects assigned_open_cases == 1."
        test_recipe:
          setup: ["Analyst an1, customer cu1, case k1 OPEN"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
            - { call: "POST /analysts", payload: { full_name: "Meg Manager", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { mg1: $.data.id } }
            - { call: "POST /customers", payload: { full_name: "Carl Customer", country_code: "US", country_risk: "LOW" }, as: ComplianceAdmin, captures: { cu1: $.data.id } }
            - { call: "POST /cases", payload: { customer_id: "${cu1}" }, as: BSAAnalyst, as_user_id: "${an1}", captures: { k1: $.data.id } }
          trigger:
            - { call: "POST /cases/${k1}/assign", payload: { analyst_id: "${an1}" }, as: BSAManager, as_user_id: "${mg1}", captures: { k1_status: $.data.status, k1_v: $.data.version } }
            - { call: "GET /analysts/${an1}", as: BSAManager, as_user_id: "${mg1}", captures: { an1_load: $.data.assigned_open_cases } }
          assert:
            - "Assign response: status == ASSIGNED, assigned_analyst_id == ${an1}, version == 2 (create 1 + assign 1)"
            - "Analyst.${an1}.assigned_open_cases == 1 immediately after the assign response — no lag"

  - section: state_machine_coverage_stubs
    instances:
      - name: case_cycle_covered_by_difficulty
        claim_type: invalid_transition
        grounds: [state_machines.Case.PENDING_QA_to_INVESTIGATING]
        excluded_because:
          difficulty_instance: case_qa_return_cycle
          rationale: "The QA-FAIL revert loop, including second-pass traversal and close, is asserted by the named §1.8 instance."
      - name: sar_cycle_covered_by_difficulty
        claim_type: invalid_transition
        grounds: [state_machines.SARReport.IN_QA_to_DRAFT]
        excluded_because:
          difficulty_instance: sar_qa_fail_rework_cycle
          rationale: "The IN_QA -> DRAFT -> IN_QA rework loop to FILED is asserted by the named §1.8 instance."
      - name: alert_dismiss_reopen_covered_by_difficulty
        claim_type: side_effect_execution
        grounds: [state_machines.Alert.DISMISSED_to_UNDER_TRIAGE]
        excluded_because:
          difficulty_instance: alert_dismiss_reopen_disposition_conservation
          rationale: "Dismiss/reopen bucket conservation and field resets are asserted by the named §1.8 instance."
      - name: cascade_instances_covered_by_difficulty
        claim_type: side_effect_execution
        grounds: [state_machines.AccountDecision.APPROVED_to_EXECUTED, state_machines.SARReport.APPROVED_to_FILED]
        excluded_because:
          difficulty_instance: "exit_decision_three_level_cascade / sar_file_risk_restriction_cascade"
          rationale: "Both cascade chains (depth 3 exit chain, depth 2 risk-restriction chain) are asserted end-to-end by the named §1.8 instances."
