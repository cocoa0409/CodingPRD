              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/record-registration-decision"
              payload: { outcome: "REGISTERED" }
              as: TrustAdmin
            - call: "POST /apprentices/${app_id}/indenture"
              payload: {}
              as: TrustAdmin
            - call: "POST /classes"
              payload: { trust_fund_id: "${fund_id}", course_code: "RTI-144", instructor_user_id: "inst-1", instructor_name: "I. Mason", instructor_rate_cents_per_hour: 6000, facility: "SHOP-A", rti_credit_value: 144, capacity: 10, start_minute: 600, end_minute: 720 }
              as: TrustAdmin
              captures: { cls_id: $.data.id }
            - call: "POST /enrollments"
              payload: { class_id: "${cls_id}", apprentice_id: "${app_id}" }
              as: TrustAdmin
              captures: { enr_id: $.data.id }
            - call: "POST /classes/${cls_id}/complete"
              payload: { attended_enrollment_ids: ["${enr_id}"] }
              as: TrustAdmin
            - call: "POST /contribution-reports"
