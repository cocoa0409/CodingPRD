  # ===========================================================================
  - section: calculations
    instances:
      - name: waterfall_orders_missed_first_then_pending_by_due_date
        claim_type: correct_result
        grounds:
          - calculations.remittance_waterfall_allocation
        distinguishing_aspect: "With loan A (500,000c, created first) and loan B (300,000c, created second) both DELINQUENT on installment 1 (due 2026-06-01), a 111,290c auto-allocated remittance applies in the pinned order — A1 MISSED (42,804c = 2,083c interest + 40,721c principal; due-date tie broken by loan created_at ASC), then B1 MISSED (25,682c), then A2 PENDING due 2026-07-01 (42,804c paid early) — curing both loans and leaving A outstanding 418,389c and B outstanding 275,568c."
        test_recipe:
          setup:
            - "Plan with max_loans_outstanding=2; participant vested 20,000,000c"
            - "Loan A 500,000c / 12mo disbursed first; loan B 300,000c / 12mo disbursed second (both at clock 2026-05-01)"
            - "Clock at 2026-06-02: both loans' installment 1 (due 2026-06-01) MISSED, both DELINQUENT with cure deadline 2026-09-30"
          setup_api_calls:
            - { call: "POST /plans", payload: { name: "Plan WF", max_loans_outstanding: 2 }, as: RecordkeeperAdmin, captures: { pl_wf: "$.data.id" } }
            - { call: "POST /plans/${pl_wf}/participants", payload: { full_name: "Fall Fred", vested_balance_cents: 20000000 }, as: RecordkeeperAdmin, captures: { p_wf: "$.data.id" } }
            - { call: "POST /participants/${p_wf}/loans", payload: { principal_amount_cents: 500000, term_months: 12 }, as: Participant, as_user_id: "${p_wf}", captures: { loan_wa: "$.data.id" } }
            - { call: "GET /loans/${loan_wa}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { wa_t1: "$.data[0].id", wa_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${wa_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${wa_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_wa}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /participants/${p_wf}/loans", payload: { principal_amount_cents: 300000, term_months: 12 }, as: Participant, as_user_id: "${p_wf}", captures: { loan_wb: "$.data.id" } }
            - { call: "GET /loans/${loan_wb}/approval-tasks", payload: {}, as: RecordkeeperAdmin, captures: { wb_t1: "$.data[0].id", wb_t2: "$.data[1].id" } }
            - { call: "POST /approval-tasks/${wb_t1}/decide", payload: { decision: "APPROVE" }, as: PlanSponsor, as_user_id: "sponsor-01" }
            - { call: "POST /approval-tasks/${wb_t2}/decide", payload: { decision: "APPROVE" }, as: RecordkeeperAdmin, as_user_id: "admin-01" }
            - { call: "POST /loans/${loan_wb}/disburse", payload: {}, as: RecordkeeperAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: RecordkeeperAdmin }
          trigger:
            - { call: "POST /participants/${p_wf}/remittances", payload: { amount_cents: 111290, pay_date: "2026-06-02T00:00:00Z" }, as: PayrollProvider, captures: { wf_remit: "$.data.id", wf_applied: "$.data.applied_allocations" } }
            - { call: "GET /loans/${loan_wa}", payload: {}, as: RecordkeeperAdmin, captures: { wa_out: "$.data.outstanding_principal_cents", wa_dq: "$.data.delinquency_status" } }
            - { call: "GET /loans/${loan_wb}", payload: {}, as: RecordkeeperAdmin, captures: { wb_out: "$.data.outstanding_principal_cents", wb_dq: "$.data.delinquency_status" } }
          assert:
            - "captured wf_applied has exactly 3 entries in order: [0] == { loan_id: ${loan_wa}, amount_cents: 42804, to_interest_cents: 2083, to_principal_cents: 40721 }, [1] == { loan_id: ${loan_wb}, amount_cents: 25682 }, [2] == { loan_id: ${loan_wa}, amount_cents: 42804 } (A's second installment, paid before its 2026-07-01 due date)"
            - "captured wa_out == 418389 (500000 - 40721 - 40890) and wa_dq == CURRENT (cured)"
            - "captured wb_out == 275568 (300000 - 24432) and wb_dq == CURRENT (cured)"

      - name: waterfall_excludes_terminal_and_deemed_loans
        claim_type: input_set_filtering
        grounds:
          - calculations.remittance_waterfall_allocation
        distinguishing_aspect: "The waterfall input set filters to DISBURSED non-DEEMED loans: an explicit allocation naming a REPAID loan is rejected ERR_INVALID_STATE, and an auto-allocation never touches the REPAID loan's rows (they are CLOSED/PAID, not candidates)."
