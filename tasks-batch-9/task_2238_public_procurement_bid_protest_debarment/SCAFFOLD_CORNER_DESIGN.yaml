          rationale: "Asserted as the failure path of that §1.8 instance, with continuance_count frozen at 2."

      - name: corner_error_hearing_room_conflict_and_officer_conflict
        claim_type: Triggerability
        grounds:
          - errors[ERR_HEARING_ROOM_CONFLICT]
          - errors[ERR_HEARING_OFFICER_CONFLICT]
        excluded_because:
          difficulty_instance: hearing_officer_conflict_safety_error_precedes_room_conflict_constraint_error
          rationale: "That §1.8 instance triggers ERR_HEARING_OFFICER_CONFLICT on the combined violation and ERR_HEARING_ROOM_CONFLICT on its single-violation control."

      - name: corner_error_officer_docket_capacity_exceeded
        claim_type: Triggerability
        grounds:
          - errors[ERR_OFFICER_DOCKET_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: hearing_officer_docket_accepted_at_exactly_four_hundred_eighty_minutes
          rationale: "That §1.8 boundary instance accepts the booking at exactly 480 minutes and rejects the 481st minute with ERR_OFFICER_DOCKET_CAPACITY_EXCEEDED."

