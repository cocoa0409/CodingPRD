      - name: certified_day_interval_adjacency
        grounds:
          - validations[priority=21]
          - entities.ConcurrentReview.fields.certified_day_start
        distinguishing_aspect: |
          Different interval semantics on a different resource: day-granularity half-open intervals [start, end) on the UtilizationCase certified-day axis — an intersecting start (day 3 into [1,4)) is rejected while exact adjacency (start == 4 == existing end) is allowed with no buffer.
