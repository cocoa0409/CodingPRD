            - call: "POST /water-bodies"
              payload: { name: "Flathead Lake", state_code: "MT", water_body_class: "LAKE", risk_tier: "HIGH" }
              as: ProgramAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Aa Polson Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}" }
              as: ProgramAdmin
              captures: { st_1: $.data.id }
            - call: "POST /inspection-stations"
              payload: { name: "Bb Somers Access", station_type: "WATERBODY_ACCESS", water_body_id: "${wb_id}" }
              as: ProgramAdmin
              captures: { st_2: $.data.id }
            - call: "POST /education-campaigns"
              payload: { name: "Penny Campaign", target_water_body_id: "${wb_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-31T00:00:00Z", budget_cents: 1 }
              as: ProgramAdmin
              captures: { cp_x: $.data.id, cp_x_v: $.data.version }
            - call: "POST /education-campaigns"
              payload: { name: "Two Cent Campaign", target_water_body_id: "${wb_id}", start_at: "2026-08-01T00:00:00Z", end_at: "2026-08-31T00:00:00Z", budget_cents: 2 }
              as: ProgramAdmin
              captures: { cp_y: $.data.id }
          trigger:
            - call: "POST /education-campaigns/${cp_x}/status"
              payload: { target_status: "RUNNING" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "both campaigns were created 201 - a 1-cent budget is under the cap and passes creation"
            - "the trigger returns 422 with error_id ERR_CAMPAIGN_BUDGET_EXCEEDED"
            - "EducationCampaign.${cp_x}.status == PLANNED, station_allocations == [] and version == ${cp_x_v}"
            - "control: launching ${cp_y} returns 200 with station_allocations of exactly 1 cent to ${st_1} and 1 cent to ${st_2}, summing to 2"
            - "control: POST /education-campaigns with budget_cents 5000001 returns 422 ERR_CAMPAIGN_BUDGET_EXCEEDED at creation (CAMPAIGN_BUDGET_CAP_CENTS is 5000000)"

      - name: violation_to_error_evaluation_with_an_empty_denominator_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_36
          - errors.ERR_NO_INSPECTIONS_IN_WINDOW
        distinguishing_aspect: "An empty TARGET-scope denominator is an error, never a zero score: a RUNNING campaign whose window closed with no qualifying inspection is refused 422 ERR_NO_INSPECTIONS_IN_WINDOW and stays RUNNING with both effectiveness scores null."
        test_recipe:
          setup:
            - "One OPEN station guards the target water body and the campaign is launched, so allocations exist."
            - "No inspection record is ever created, and the clock is advanced past end_at."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
