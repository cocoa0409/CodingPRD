            - { call: "POST /api/projects/${pid}/coordination-meetings", payload: { room_id: "RM-1", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-01T01:00:00Z" }, as: BIMCoordinator, captures: { mtg: $.data.id } }
            - { call: "POST /api/coordination-meetings/${mtg}/start", payload: {}, as: BIMCoordinator }
