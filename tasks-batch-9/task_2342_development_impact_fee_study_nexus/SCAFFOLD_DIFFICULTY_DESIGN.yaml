            - "at that point NexusComponent.${comp_parks_id}.allocation_status == VALID and adopted_cost_per_unit_cents == 101667"
            - "after the re-allocate: NexusComponent.${comp_roads_id}.allocation_status == VALID, plan_based_cost_per_unit_cents == 270133, adopted_cost_per_unit_cents == 270133, nexus_ratio == 1.0194"
