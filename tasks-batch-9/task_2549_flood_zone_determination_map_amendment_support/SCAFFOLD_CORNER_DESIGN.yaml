              payload: { community_id: "${c_fl_id}", street_address: "11 Bayfront Rd", city: "Miami", postal_code: "33101", map_panel_number: "12086C0312K", latitude: 25.7617, longitude: -80.1918, geocode_method: "PARCEL_CENTROID", geocode_confidence_score: 0.88 }
              as: ProviderAnalyst
              captures: { pr_a_id: $.data.id }
            - call: "POST /flood-zone/structures"
              payload: { property_id: "${pr_a_id}", structure_label: "Main dwelling", occupancy_type: "SINGLE_FAMILY", foundation_type: "SLAB", replacement_cost_cents: 32000000, sfha_offset_ft: -500.0 }
              as: ProviderAnalyst
              captures: { st_a_id: $.data.id }
            - call: "POST /flood-zone/loan-folios"
              payload: { lender_id: "${lender_id}", property_id: "${pr_a_id}", loan_number: "LN-4401", borrower_user_id: "borrower-a", principal_balance_cents: 28000000, policy_anniversary_date: "2027-03-15T00:00:00Z" }
              as: Lender
              as_user_id: "${lender_id}"
              captures: { f_a_id: $.data.id, f_a_v0: $.data.version }
            - call: "POST /flood-zone/determinations"
              payload: { loan_folio_id: "${f_a_id}", structure_id: "${st_a_id}", determination_type: "ORIGINATION", expected_loan_folio_version: "${f_a_v0}" }
              as: ProviderAnalyst
              as_user_id: "analyst-1"
              captures: { det_1_id: $.data.id }
            - call: "POST /flood-zone/properties/${pr_a_id}/geocode-corrections"
              payload: { latitude: 25.7618, longitude: -80.1919, geocode_method: "ROOFTOP", geocode_confidence_score: 0.98 }
              as: ProviderAnalyst
              captures: { pr_a_corrected: $.data.geocode_corrected_count }
          trigger:
            - call: "POST /flood-zone/monitoring-runs"
              payload: {}
              as: ProviderAnalyst
              captures: { run1_scanned: $.data.determinations_scanned, run1_cleared: $.data.redeterminations_cleared, run1_issued: $.data.redeterminations_issued, run1_at: $.data.run_at }
            - call: "GET /flood-zone/determinations?loan_folio_id=${f_a_id}"
              as: ProviderAnalyst
              captures: { det_list_row0_status: "$.data[0].status" }
            - call: "GET /flood-zone/loan-folios/${f_a_id}"
              as: ProviderAnalyst
              captures: { folio_pending: $.data.pending_redetermination_count, folio_posture: $.data.compliance_posture }
            - call: "POST /flood-zone/monitoring-runs"
              payload: {}
              as: ProviderAnalyst
              captures: { run2_scanned: $.data.determinations_scanned, run2_cleared: $.data.redeterminations_cleared }
          assert:
            - "the first run reports determinations_scanned == 1, redeterminations_cleared == 1, redeterminations_issued == 0 and run_at == 2026-08-01T00:00:00Z (the clock, not wall time)"
            - "the reads taken straight after that response already agree with it: total_count == 1 for the folio's determinations, Determination.${det_1_id}.status == ISSUED with flagged_reason cleared to null"
            - "GET /flood-zone/loan-folios/${f_a_id} shows pending_redetermination_count == 0 and compliance_posture == NOTICE_DUE at the first read (clause 3 no longer matches, required_coverage_cents is 25000000 against reported 0, and no MANDATORY_PURCHASE notice exists yet) - the folio-level recount is part of the same transaction as the determination-level clear"
            - "the immediate second run reports determinations_scanned == 0 and redeterminations_cleared == 0: the first run's effects are already visible to the second, so no row is swept twice"
            - "${pr_a_corrected} == 1 and it is unchanged by either run - the sweep reconciles determinations, it does not re-geocode"
