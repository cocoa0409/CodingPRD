# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3481_disaster_loan_application_damage_verification_servicing
# Breadth probe over SCAFFOLD.yaml §1.1-§1.7. Corners already exercised by
# SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# Money is integer cents. Canonical declaration DR-4821 as in §1.8.
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: declaration_create_computes_deadlines_and_opens
        claim_type: Creation
        grounds:
          - entities.DisasterDeclaration
          - endpoints.POST_/disaster-relief/disaster-declarations
        distinguishing_aspect: "A declaration created with declared_date 2026-10-01T00:00:00Z returns 201 with computed physical_filing_deadline exactly 2026-12-30T00:00:00Z (+90d) and economic_injury_filing_deadline exactly 2027-06-28T00:00:00Z (+270d), status OPEN, version 1."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z (no clock call made); empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }, { county_fips: "06059", eligible_purposes: ["ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id, phys_dl: $.data.physical_filing_deadline, eidl_dl: $.data.economic_injury_filing_deadline }
          assert:
            - "response 201; DisasterDeclaration.${decl_id}.status == OPEN and version == 1"
            - "physical_filing_deadline == 2026-12-30T00:00:00Z and economic_injury_filing_deadline == 2027-06-28T00:00:00Z (computed, not echoed from input)"
            - "response carries system-generated id, created_at, updated_at and meta.api_request_id"

      - name: application_create_draft_defaults_and_caller_identity
        claim_type: Defaults
        grounds:
          - entities.LoanApplication
          - endpoints.POST_/disaster-relief/loan-applications
        distinguishing_aspect: "A new application starts DRAFT with reconsideration_count 0, submitted_at null, loan_id null, and applicant_id forced to the caller's X-User-ID (the body cannot set it — applicant_id is not even an input field)."
        test_recipe:
          setup:
            - "Clock 2026-10-02T00:00:00Z; declaration DR-4821; one homeowner applicant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Draft Dee", email: "dd@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 2500000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
          assert:
            - "response 201; LoanApplication.${app_id}.status == DRAFT, reconsideration_count == 0, submitted_at is null, loan_id is null"
            - "LoanApplication.${app_id}.applicant_id == ${ho_id} (from X-User-ID, not the body)"
            - "version == 1"

      - name: application_get_missing_id_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/disaster-relief/loan-applications/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns 404 with error_id ERR_NOT_FOUND in the standard error envelope."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /disaster-relief/loan-applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: LoanOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response 404, response_type error, data.error_id == ERR_NOT_FOUND"

      - name: credit_review_immutable_record_without_version
        claim_type: Immutability
        grounds:
          - entities.CreditReview
        distinguishing_aspect: "CreditReview is common_fields:false — its response carries id and created_at but no version and no updated_at, and no endpoint can mutate it."
        test_recipe:
          setup:
            - "Clock 2026-10-02; DR-4821; homeowner applicant with a SUBMITTED physical application (requested 2500000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Imm Ut", email: "im@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 2500000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /disaster-relief/loan-applications/${app_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
              as_user_id: "lo-nina"
              captures: { rev_id: $.data.id }
          assert:
            - "response 201 with id and created_at present; the response body has NO version and NO updated_at field"
            - "CreditReview.${rev_id}.reviewer_user_id == \"lo-nina\" (server-stamped from X-User-ID)"
            - "GET /disaster-relief/loan-applications/${app_id}/credit-reviews returns exactly one row, the created review (FK reverse reachability)"

      - name: application_create_invalid_purpose_rejected
        claim_type: Type Constraints
        grounds:
          - entities.LoanApplication.fields.loan_purpose
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "loan_purpose outside {PHYSICAL_DAMAGE, ECONOMIC_INJURY} is rejected 400 ERR_INVALID_REQUEST and no row is created."
        test_recipe:
          setup:
            - "Clock 2026-10-02; DR-4821; one homeowner applicant."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Enum Ed", email: "ee@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { ho_id: $.data.id }
          trigger:
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "EIDL", requested_amount_cents: 2500000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response 400 with error_id ERR_INVALID_REQUEST"
            - "GET /disaster-relief/loan-applications?applicant_id=${ho_id} returns an empty array (nothing persisted)"
  - section: state_machines
    instances:
      - name: resubmit_returns_application_not_draft
        claim_type: invalid_transition
        grounds:
          - state_machines.LoanApplication.DRAFT_to_SUBMITTED
          - errors[ERR_APPLICATION_NOT_DRAFT]
        distinguishing_aspect: "Submitting an already-SUBMITTED application returns 409 ERR_APPLICATION_NOT_DRAFT and changes nothing (idempotency violation is a state error, not a silent re-accept)."
        test_recipe:
          setup:
            - "Clock 2026-10-02; DR-4821; homeowner applicant with one SUBMITTED application."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Re Sub", email: "rs@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 2500000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
          trigger:
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { err: $.data.error_id }
          assert:
            - "second submit returns 409 ERR_APPLICATION_NOT_DRAFT"
            - "application remains SUBMITTED with reconsideration_count == 0"

      - name: declined_lockdown_after_reconsideration_limit
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LoanApplication
        excluded_because:
          difficulty_instance: application_reconsideration_cycle_bounded
          rationale: "The two-loop cycle plus the third ERR_RECONSIDERATION_LIMIT plus the post-limit decision rejection are asserted in the §1.8 instance."

      - name: eidl_application_skips_verification_entirely
        claim_type: valid_transition
        grounds:
          - state_machines.LoanApplication.SUBMITTED_to_DECISION_PENDING
          - errors[ERR_VERIFICATION_NOT_APPLICABLE]
        distinguishing_aspect: "Branching fork by loan_purpose: an ECONOMIC_INJURY application moves SUBMITTED -> DECISION_PENDING directly on credit PASS (no VERIFICATION state), a verification cannot be opened on it (409 ERR_VERIFICATION_NOT_APPLICABLE), and its approval uses the EIDL cap/threshold/rate (0.04, 360 months, no collateral at exactly 5000000)."
        test_recipe:
          setup:
            - "Clock 2026-10-02; DR-4821; BUSINESS applicant (income 6000000, debt 100000) with an ECONOMIC_INJURY application for 5000000 in the EIDL-only county 06059."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }, { county_fips: "06059", eligible_purposes: ["ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Ei Dl", email: "eidl@x.com", applicant_type: "BUSINESS", annual_income_cents: 6000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { biz_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06059", loan_purpose: "ECONOMIC_INJURY", requested_amount_cents: 5000000 }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
          trigger:
            - call: "POST /disaster-relief/loan-applications/${app_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
              captures: { verdict: $.data.verdict, pmt: $.data.proposed_payment_cents }
            - call: "POST /disaster-relief/loan-applications/${app_id}/damage-verifications"
              payload: { method: "INSPECTION", valuation_basis: "REPLACEMENT_COST" }
              as: LossVerifier
              captures: { err_ver: $.data.error_id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/decision"
              payload: { decision: "APPROVED" }
              as: LoanApprover
              captures: { loan_id: $.data.loan_id }
            - call: "GET /disaster-relief/loans/${loan_id}"
              payload: {}
              as: ServicingAgent
              captures: { lrate: $.data.interest_rate, lterm: $.data.term_months, lcol: $.data.collateral_required, lamt: $.data.approved_amount_cents }
          assert:
            - "verdict == PASS with proposed_payment_cents == 23871 (STANDARD on 5000000 at 0.04/360); application went SUBMITTED -> DECISION_PENDING without entering VERIFICATION"
            - "damage-verification create on the EIDL application returns 409 ERR_VERIFICATION_NOT_APPLICABLE"
            - "approval without collateral fields succeeds: approved_amount_cents == 5000000, interest_rate == 0.04, term_months == 360, collateral_required == false (5000000 is not > EIDL threshold 5000000)"
            - "tranche schedule: [2500000, 1250000, 1250000]"

      - name: dispute_recomplete_cycle_recomputes_loss
        claim_type: side_effect_execution
        grounds:
          - state_machines.DamageVerification.COMPLETED_to_DISPUTED
          - state_machines.DamageVerification.DISPUTED_to_COMPLETED
          - entities.DamageVerification.fields.net_verified_loss_cents
        distinguishing_aspect: "The COMPLETED -> DISPUTED -> COMPLETED cycle recomputes the derived loss fields: first completion nets 8000000 (assessed 10000000 - insurance 2000000); after dispute the second completion nets 10000000 (assessed 12000000) while the application stays DECISION_PENDING (no duplicate advance)."
        test_recipe:
          setup:
            - "Clock 2026-10-02; DR-4821; homeowner applicant with a physical application in DECISION_PENDING whose verification V completed on 2026-11-20 (assessed 10000000, insurance 2000000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Dis Pute", email: "dp@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { ho_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 12000000 }
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { app_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
            - call: "POST /disaster-relief/loan-applications/${app_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
            - call: "POST /disaster-relief/loan-applications/${app_id}/damage-verifications"
              payload: { method: "INSPECTION", valuation_basis: "REPLACEMENT_COST" }
              as: LossVerifier
              captures: { ver_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-20T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/damage-verifications/${ver_id}/complete"
              payload: { assessed_loss_cents: 10000000, insurance_proceeds_cents: 2000000 }
              as: LossVerifier
              captures: { net1: $.data.net_verified_loss_cents }
          trigger:
            - call: "POST /disaster-relief/damage-verifications/${ver_id}/dispute"
              payload: {}
              as: Applicant
              as_user_id: "${ho_id}"
              captures: { st_d: $.data.status }
            - call: "POST /disaster-relief/damage-verifications/${ver_id}/complete"
              payload: { assessed_loss_cents: 12000000, insurance_proceeds_cents: 2000000 }
              as: LossVerifier
              captures: { net2: $.data.net_verified_loss_cents, vl2: $.data.verified_loss_cents }
            - call: "GET /disaster-relief/loan-applications/${app_id}"
              payload: {}
              as: LoanOfficer
              captures: { app_st: $.data.status }
          assert:
            - "first completion: net_verified_loss_cents == 8000000 and application advanced to DECISION_PENDING"
            - "dispute within the window: status == DISPUTED"
            - "second completion from DISPUTED: verified_loss_cents == 12000000 and net_verified_loss_cents == 10000000 (recomputed from the new figures)"
            - "application status is still DECISION_PENDING (the re-completion does not re-fire the advance transition)"

      - name: dispute_window_inclusive_boundary
        claim_type: precondition_enforcement
        grounds:
          - validations[priority=12]
          - state_machines.DamageVerification.COMPLETED_to_DISPUTED
        distinguishing_aspect: "The dispute window is inclusive: a dispute at exactly completed_at + 30 days succeeds; one second later fails 422 ERR_DISPUTE_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Two homeowner applications, each with a verification completed at 2026-11-20T00:00:00Z (window closes 2026-12-20T00:00:00Z), both applications in DECISION_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-02T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/disaster-declarations"
              payload: { declaration_number: "DR-4821", disaster_type: "HURRICANE", incident_start_date: "2026-10-01T00:00:00Z", incident_end_date: "2026-10-15T00:00:00Z", declared_date: "2026-10-01T00:00:00Z", counties: [{ county_fips: "06037", eligible_purposes: ["PHYSICAL_DAMAGE", "ECONOMIC_INJURY"] }] }
              as: SystemAdmin
              captures: { decl_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Win One", email: "w1@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { h1_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 2500000 }
              as: Applicant
              as_user_id: "${h1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app1_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${h1_id}"
            - call: "POST /disaster-relief/loan-applications/${app1_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
            - call: "POST /disaster-relief/loan-applications/${app1_id}/damage-verifications"
              payload: { method: "INSPECTION", valuation_basis: "REPLACEMENT_COST" }
              as: LossVerifier
              captures: { v1_id: $.data.id }
            - call: "POST /disaster-relief/applicants"
              payload: { full_name: "Win Two", email: "w2@x.com", applicant_type: "HOMEOWNER", annual_income_cents: 12000000, monthly_debt_cents: 100000 }
              as: Anonymous
              captures: { h2_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications"
              payload: { declaration_id: "${decl_id}", county_fips: "06037", loan_purpose: "PHYSICAL_DAMAGE", requested_amount_cents: 2500000 }
              as: Applicant
              as_user_id: "${h2_id}"
              captures: { app2_id: $.data.id }
            - call: "POST /disaster-relief/loan-applications/${app2_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${h2_id}"
            - call: "POST /disaster-relief/loan-applications/${app2_id}/credit-reviews"
              payload: { credit_score: 700, verified_monthly_debt_cents: 100000 }
              as: LoanOfficer
            - call: "POST /disaster-relief/loan-applications/${app2_id}/damage-verifications"
              payload: { method: "INSPECTION", valuation_basis: "REPLACEMENT_COST" }
              as: LossVerifier
              captures: { v2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-20T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/damage-verifications/${v1_id}/complete"
              payload: { assessed_loss_cents: 2500000, insurance_proceeds_cents: 0 }
              as: LossVerifier
            - call: "POST /disaster-relief/damage-verifications/${v2_id}/complete"
              payload: { assessed_loss_cents: 2500000, insurance_proceeds_cents: 0 }
              as: LossVerifier
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-20T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /disaster-relief/damage-verifications/${v1_id}/dispute"
              payload: {}
              as: Applicant
