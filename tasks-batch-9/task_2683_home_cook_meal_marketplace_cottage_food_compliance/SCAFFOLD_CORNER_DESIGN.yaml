            - "${mi_status} == APPROVED and ${approved_count} == 1: CAP_WARNING is advisory and must not run the CAP_REACHED delisting cascade"
            - "${mi_label} == COMPLIANT (all five TX label_required_fields are present on the item)"
            - "the same cook would still be admitted for a further order of exactly 200 cents (projected == 2000 == cap) - see the difficulty instance for that boundary"

      - name: payout_basis_variants_diverge_on_identical_window_data
        claim_type: variant_divergence
        grounds:
          - calculations.cook_payout_net.variants
          - entities.PayoutStatement.basis
        excluded_because:
          difficulty_instance: "dual_variant_calc / payout_basis_accrual_vs_cash_divergence"
          rationale: >
            Two statements on the same window, one per basis, are created and compared field by field
            there (included_order_count, gross_sales_cents, refund_chargeback_cents, net_payout_cents),
            including the HANDED_OFF-but-never-delivered order and the still-PENDING refund that cause
            the divergence.

      - name: safety_score_variant_is_selected_by_read_surface
        claim_type: variant_selection
        grounds:
          - calculations.cook_safety_score.variants
          - endpoints.GET /cooks/{id}/compliance-summary
        excluded_because:
          difficulty_instance: "dual_variant_calc / safety_score_substantiated_only_vs_intake_inclusive"
          rationale: >
            That instance proves the authoritative variant writes Cook.safety_score and moves standing
            while the advisory variant appears only as provisional_safety_score and never persists,
            which is precisely the variant-selection claim.

      - name: payout_basis_switch_delta_reconciliation
        claim_type: reconciliation
        grounds:
          - calculations.cook_payout_net.variants
          - state_machines.PayoutStatement.DRAFT_to_SUPERSEDED
        excluded_because:
          difficulty_instance: "dual_variant_calc / payout_basis_accrual_vs_cash_divergence"
          rationale: >
            The scaffold never mutates a statement's basis in place; switching bases means creating a
            second statement, which supersedes the DRAFT and re-derives Cook.pending_payout_cents. That
            supersede-and-reconcile path is asserted in the same difficulty instance.

      - name: statement_commission_rounding_order_is_pinned
        claim_type: precision
        grounds:
          - calculations.cook_payout_net.formula
          - calculations.cook_payout_net.precision
        excluded_because:
          difficulty_instance: "combinatorial_formula / commission_rounded_per_order_then_summed"
          rationale: >
            The round-per-order-then-sum versus sum-then-round divergence needs several orders whose
            products each land on a half cent; that arithmetic is constructed and asserted there.

      - name: spoilage_reserve_threshold_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.effective_production_capacity.formula
          - calculations.effective_production_capacity.determinism_note
        excluded_because:
          difficulty_instance: "combinatorial_formula / spoilage_reserve_evaluated_before_admission"
          rationale: >
            Admission at exactly effective_capacity_meals and rejection one meal above it, with the
            reserve read from the pre-admission committed_meals, are both walked there.

      - name: cottage_cap_admission_threshold_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.cottage_cap_projection.determinism_note
        excluded_because:
          difficulty_instance: "boundary_precision_check / cottage_cap_admission_at_exactly_the_cap"
          rationale: >
            The projected == cap admission and the projected == cap + 1 rejection, plus the resulting
            CAP_REACHED classification once the order captures, are the subject of that instance.

      - name: hot_handoff_span_threshold_boundary
        claim_type: threshold_boundary
        grounds:
          - calculations.handoff_routing_decision.precision
        excluded_because:
          difficulty_instance: "boundary_precision_check / hot_handoff_span_120_admits_121_falls_back"
          rationale: >
            A 120-minute handoff staying SAME_DAY_HOT and a 121-minute handoff falling back to
            BATCH_COOK_AND_CHILL are asserted side by side there.

      - name: consolidation_zero_cardinality_input_set
        claim_type: aggregation_boundary
        grounds:
          - endpoints.POST /pickup-hubs/{id}/consolidate
          - errors.ERR_NO_ELIGIBLE_ORDERS
        excluded_because:
          difficulty_instance: "boundary_precision_check / consolidation_empty_input_set_zero_cardinality"
          rationale: >
            The empty-input-set behaviour of consolidation (and the ERR_NO_ELIGIBLE_ORDERS it raises
            rather than returning a zero-count success) is exactly that instance's subject.

      - name: capacity_counter_is_correct_after_reversal
        claim_type: aggregation_boundary
        grounds:
          - calculations.effective_production_capacity.input_set
          - compensating_invariants.capacity_units_conserved
        excluded_because:
          difficulty_instance: "compensating_invariant / capacity_units_conserved_place_then_cancel"
          rationale: >
            The place-then-cancel round trip that must restore committed_meals, spoilage_reserve_meals
            and effective_capacity_meals to their pre-placement values is asserted there against the
            declared invariant.

      - name: cook_window_interval_adjacency_versus_overlap
        claim_type: interval_merge_boundary
        grounds:
          - entities.ProductionWindow.handoff_end_at
          - errors.ERR_WINDOW_OVERLAP
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / cook_window_half_open_adjacency_allowed_overlap_rejected"
          rationale: >
            Gap-zero adjacency being admitted on the half-open cook-level interval, and a one-minute
            overlap being rejected, are both walked there.

      - name: hub_buffered_interval_touching_endpoints_collide
        claim_type: interval_merge_boundary
        grounds:
          - calculations.hub_selector.precision
          - errors.ERR_HUB_SLOT_CONFLICT
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / hub_buffered_closed_interval_conflict_with_no_reselection"
          rationale: >
            The CLOSED buffered hub interval (where touching endpoints DO collide, the opposite of the
            cook-level rule) and the no-reselection consequence are asserted there.

  - section: validations
    instances:
      - name: duplicate_state_policy_cook_email_and_zone_code_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=38].ERR_DUPLICATE_STATE_POLICY
          - validations[priority=40].ERR_DUPLICATE_COOK_EMAIL
          - validations[priority=39].ERR_DUPLICATE_ZONE_CODE
        distinguishing_aspect: >
          Three independent uniqueness scopes, each a 409 on a different endpoint, and the cook-email
          rule is explicitly case-insensitive so a differently-cased duplicate must still be rejected.
        test_recipe:
          setup:
            - "StatePolicy CA exists; clock 2026-08-01T00:00:00Z; Cook Dara exists with email dara@example.com; DeliveryZone SF-01 exists."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id" }
            - call: POST /delivery-zones
              payload: { state_policy_id: "${sp_id}", zone_code: "SF-01", state_code: "CA", service_mode: "DOOR_DELIVERY", postal_codes: ["94110"], max_cold_chain_minutes: 240 }
              as: PlatformAdmin
              captures: { dz_id: "$.data.id" }
          trigger:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 7500000, allowed_kitchen_types: ["HOME_COTTAGE"], tcs_requires_commercial_kitchen: false, max_shelf_life_days_non_refrigerated: 30, label_required_fields: ["cook_name"], cert_validity_max_days: 365 }
              as: PlatformAdmin
              captures: { e_policy: "$.data.error_id" }
            - call: POST /cooks
              payload: { legal_name: "Dara Impostor", email: "DARA@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { e_email: "$.data.error_id" }
            - call: POST /delivery-zones
              payload: { state_policy_id: "${sp_id}", zone_code: "SF-01", state_code: "CA", service_mode: "HUB_PICKUP", postal_codes: ["94114"], max_cold_chain_minutes: 180 }
              as: PlatformAdmin
              captures: { e_zone: "$.data.error_id" }
          assert:
            - "${e_policy} == ERR_DUPLICATE_STATE_POLICY with HTTP 409 and the stored CA policy still has cottage_food_annual_cap_cents 5000000"
            - "${e_email} == ERR_DUPLICATE_COOK_EMAIL with HTTP 409: uniqueness is case-insensitive, so DARA@example.com collides with dara@example.com"
            - "${e_zone} == ERR_DUPLICATE_ZONE_CODE with HTTP 409 and DeliveryZone.${dz_id}.service_mode is still DOOR_DELIVERY"
            - "exactly one StatePolicy, one Cook and one DeliveryZone exist after all three rejections"

      - name: document_conditional_fields_beat_certificate_validity_window_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=31].ERR_DOC_FIELDS_INVALID_FOR_TYPE
          - validations[priority=32].ERR_CERT_VALIDITY_TOO_LONG
          - entities.StatePolicy.cert_validity_max_days
        distinguishing_aspect: >
          A conditional-field rule and a cross-entity date-range rule sit at adjacent priorities on the
          same endpoint, so a payload that violates both must report the lower number: supplying
          kitchen fields on a certificate is ERR_DOC_FIELDS_INVALID_FOR_TYPE (31) even when the
          certificate's own validity span also exceeds cert_validity_max_days (32).
        test_recipe:
          setup:
            - "StatePolicy CA with cert_validity_max_days 1825; clock 2026-08-01T00:00:00Z; Cook Dara in onboarding_status DRAFT with version ${cook_v0}."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
          trigger:
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", kitchen_type_claimed: "HOME_COTTAGE", inspection_date: "2026-06-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_fields: "$.data.error_id" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v0}", certificate_number: "FH-9", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_fields_2: "$.data.error_id" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-1", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2032-01-15", kitchen_type_claimed: "HOME_COTTAGE" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_priority: "$.data.error_id" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-2", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2032-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_validity: "$.data.error_id" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-3", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2025-12-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_backwards: "$.data.error_id" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-4", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { ok_doc: "$.data.id", ok_status: "$.data.review_status" }
          assert:
            - "${e_fields} == ERR_DOC_FIELDS_INVALID_FOR_TYPE with HTTP 422: a FOOD_HANDLER_CERT that supplies kitchen fields and omits the certificate fields is rejected"
            - "${e_fields_2} == ERR_DOC_FIELDS_INVALID_FOR_TYPE with HTTP 422: the mirror case, a KITCHEN_INSPECTION carrying certificate fields"
            - "${e_priority} == ERR_DOC_FIELDS_INVALID_FOR_TYPE, NOT ERR_CERT_VALIDITY_TOO_LONG: priority 31 beats priority 32 even though the 2192-day span also violates cert_validity_max_days"
            - "${e_validity} == ERR_CERT_VALIDITY_TOO_LONG with HTTP 422 once the field-shape rule is satisfied (2032-01-15 minus 2026-01-15 is 2192 days > 1825)"
            - "${e_backwards} == ERR_CERT_VALIDITY_TOO_LONG with HTTP 422: expires_on must be strictly after issued_on, and the same code owns that half of the rule"
            - "${ok_status} == SUBMITTED for ${ok_doc}: a 731-day certificate is accepted, and Cook.${cook_id}.onboarding_status becomes DOCS_SUBMITTED"
            - "none of the five rejected calls created an OnboardingDocument and none incremented Cook.${cook_id}.version, which is still ${cook_v0} when the accepted call is made"

      - name: window_creation_interval_and_capacity_violations_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=33].ERR_CUTOFF_AFTER_HANDOFF
          - validations[priority=36].ERR_WINDOW_CAPACITY_ABOVE_COOK_LIMIT
          - entities.Cook.weekly_capacity_meals
        distinguishing_aspect: >
          The interval rule is a three-way strict ordering (cutoff < start < end), so it must reject
          both a cutoff placed after the handoff starts and an end that precedes its own start. The
          capacity rule owns BOTH of its bounds, so capacity_meals 0 reports
          ERR_WINDOW_CAPACITY_ABOVE_COOK_LIMIT rather than a generic invalid-request, while exactly
          weekly_capacity_meals is admitted.
        test_recipe:
          setup:
            - "Identical to the setup_api_calls of window_and_order_advance_walk_the_happy_path_with_clock_gated_rejections through POST /cooks/{id}/onboarding-decision: cook ${cook_id} is ACTIVE in CA with weekly_capacity_meals at its default 40. Clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: POST /state-policies
              payload: { state_code: "CA", cottage_food_annual_cap_cents: 5000000, allowed_kitchen_types: ["HOME_COTTAGE", "HOME_INSPECTED", "COMMERCIAL_SHARED"], tcs_requires_commercial_kitchen: true, max_shelf_life_days_non_refrigerated: 14, label_required_fields: ["cook_name", "ingredients", "allergens", "net_weight", "cottage_food_disclaimer"], cert_validity_max_days: 1825 }
              as: PlatformAdmin
              captures: { sp_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: POST /cooks
              payload: { legal_name: "Dara Osei", email: "dara@example.com", state_code: "CA", claimed_kitchen_type: "HOME_COTTAGE" }
              as: Anonymous
              captures: { cook_id: "$.data.id", cook_v0: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "FOOD_HANDLER_CERT", expected_cook_version: "${cook_v0}", certificate_number: "FH-0001", issuing_authority: "CA DPH", issued_on: "2026-01-15", expires_on: "2028-01-15" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { cert_id: "$.data.id" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: ComplianceReviewer
              as_user_id: rev-1
              captures: { cook_v1: "$.data.version" }
            - call: POST /onboarding-documents
              payload: { cook_id: "${cook_id}", doc_type: "KITCHEN_INSPECTION", expected_cook_version: "${cook_v1}", kitchen_type_claimed: "HOME_COTTAGE", inspection_date: "2026-06-01" }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { insp_id: "$.data.id" }
            - call: POST /onboarding-documents/${cert_id}/review
              payload: { decision: "VERIFY" }
              as: ComplianceReviewer
              as_user_id: rev-1
            - call: POST /onboarding-documents/${insp_id}/review
              payload: { decision: "PASS" }
              as: ComplianceReviewer
              as_user_id: rev-2
            - call: POST /cooks/${cook_id}/onboarding-decision
              payload: { decision: "ACTIVATE" }
              as: ComplianceReviewer
              as_user_id: rev-1
            - call: GET /cooks/${cook_id}
              payload: {}
              as: Cook
              as_user_id: "${cook_id}"
              captures: { weekly: "$.data.weekly_capacity_meals", onboarding: "$.data.onboarding_status" }
          trigger:
            - call: POST /production-windows
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-09T00:00:00Z", handoff_start_at: "2026-08-08T16:00:00Z", handoff_end_at: "2026-08-08T18:00:00Z", capacity_meals: 20 }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_cutoff: "$.data.error_id" }
            - call: POST /production-windows
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-05T00:00:00Z", handoff_start_at: "2026-08-08T18:00:00Z", handoff_end_at: "2026-08-08T16:00:00Z", capacity_meals: 20 }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_interval: "$.data.error_id" }
            - call: POST /production-windows
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-05T00:00:00Z", handoff_start_at: "2026-08-08T16:00:00Z", handoff_end_at: "2026-08-08T18:00:00Z", capacity_meals: 60 }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_above: "$.data.error_id" }
            - call: POST /production-windows
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-05T00:00:00Z", handoff_start_at: "2026-08-08T16:00:00Z", handoff_end_at: "2026-08-08T18:00:00Z", capacity_meals: 0 }
              as: Cook
              as_user_id: "${cook_id}"
              captures: { e_zero: "$.data.error_id" }
            - call: POST /production-windows
              payload: { cook_id: "${cook_id}", week_start_date: "2026-08-03", order_cutoff_at: "2026-08-05T00:00:00Z", handoff_start_at: "2026-08-08T16:00:00Z", handoff_end_at: "2026-08-08T18:00:00Z", capacity_meals: 40 }
              as: Cook
              as_user_id: "${cook_id}"
