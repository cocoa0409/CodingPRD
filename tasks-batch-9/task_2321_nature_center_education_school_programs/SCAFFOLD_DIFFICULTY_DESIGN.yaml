  - rule_id: combinatorial_formula
    instances:
      - name: fee_per_student_rounding_before_multiplication
        grounds:
          - calculations.booking_fee_assessment
          - entities.ProgramOffering.fields.base_fee_cents_per_student
          - entities.Booking.fields.provisional_gross_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding where the order matters: rounding the discounted per-student
          price first and then multiplying by 30 students yields 33300, while summing first and
          rounding the product yields 33291; the scaffold pins the round-per-student order, so
          the 9-cent difference is the discriminator.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "ProgramOffering PUBLISHED with base_fee_cents_per_student 1233, ONSITE_FIELD_TRIP (no travel fee), ratio 10, max_group_size 60"
            - "SchoolPartner ACTIVE"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-28T07:00:00Z" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/program-offerings"
              payload: { title: "Pond Ecology Field Study", grade_band: "G3_5", delivery_mode: "ONSITE_FIELD_TRIP", duration_minutes: 120, max_group_size: 60, min_chaperone_ratio_students_per_adult: 10, base_fee_cents_per_student: 1233, requires_live_animal: false, requires_trail_segment: false, public_contact_required: false }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { off_id: $.data.id }
            - call: "POST /nature-center/program-offerings/${off_id}/standard-alignments"
              payload: { standard_code: "3-LS4-3", dimension: "DISCIPLINARY_CORE_IDEA" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/standard-alignments"
              payload: { standard_code: "3-LS4-4", dimension: "SCIENCE_PRACTICE" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/materials"
              payload: { phase: "PRE_VISIT", url_slug: "pond-pre" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { pre_mat_id: $.data.id }
            - call: "POST /nature-center/program-offerings/${off_id}/materials"
              payload: { phase: "POST_VISIT", url_slug: "pond-post" }
              as: CurriculumSpecialist
              as_user_id: "cs-01"
              captures: { post_mat_id: $.data.id }
            - call: "POST /nature-center/curriculum-materials/${pre_mat_id}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/curriculum-materials/${post_mat_id}/publish"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/submit-for-review"
              payload: {}
              as: CurriculumSpecialist
              as_user_id: "cs-01"
            - call: "POST /nature-center/program-offerings/${off_id}/review"
              payload: { decision: "PUBLISH" }
              as: EducationDirector
              as_user_id: "ed-01"
            - call: "POST /nature-center/schools"
              payload: { name: "Cedar Grove Elementary", district_code: "LEA-77", title_i_pct: 0.82, distance_miles: 12.5 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { school_id: $.data.id }
          trigger:
            - call: "POST /nature-center/bookings"
              payload: { school_id: "${school_id}", offering_id: "${off_id}", start_utc: "2026-09-29T14:00:00Z", end_utc: "2026-09-29T16:00:00Z", student_count: 30, chaperone_count: 3 }
              as: BookingCoordinator
              as_user_id: "bc-01"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.provisional_gross_fee_cents == 33300"
            - "Booking.${bk_id}.provisional_gross_fee_cents != 33291"
            - "Booking.${bk_id}.required_chaperones == 3"
            - "Booking.${bk_id}.net_due_cents == 33300"

      - name: aid_award_pinned_order_contribution_floor_before_waterfall
        grounds:
          - calculations.aid_award_allocation
          - entities.AidApplication.fields.awarded_scholarship_cents
          - entities.AidApplication.fields.awarded_transport_cents
          - state_machines.AidApplication.SUBMITTED_to_PARTIALLY_APPROVED
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with a pinned evaluation order: the scholarship
          ceiling depends on the gross fee minus a per-student contribution floor, and the
          transport bucket depends on what the scholarship bucket left in the waterfall budget,
          so the scaffold pins floor-before-waterfall and scholarship-before-transport and the
          award resolves to exactly 28800 plus 6500 with 4500 still owed by the school.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-28T07:00:00Z"
            - "ProgramOffering PUBLISHED with base_fee_cents_per_student 1233, ONSITE_FIELD_TRIP"
            - "SchoolPartner with title_i_pct 0.82 (equity_tier TIER_1) and distance_miles 12.5"
            - "ScholarshipFund OPEN with total_cents 5000000 and transport_sublimit_pct 0.25, so available_cents starts at 5000000"
            - "Booking REQUESTED for 30 students with provisional_gross_fee_cents 33300"
            - "AidApplication SUBMITTED requesting 33300 scholarship and 6500 transport"
