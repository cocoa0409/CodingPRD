          trigger:
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5006", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120 }
              as: ProductionScheduler
