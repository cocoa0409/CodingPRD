  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: floorplan_principal_curtailment_conserves_advance
        grounds:
          - state_machines.FloorPlanLoan.CURTAILMENT_DUE_to_OPEN
          - entities.FloorPlanLoan.fields.principal_outstanding_cents
          - entities.FloorPlanLoan.fields.cumulative_curtailment_cents
          - entities.FloorPlanLoan.fields.original_advance_cents
        distinguishing_aspect: |
          Conserved quantity #1 = floor-plan principal: after any POSTED
          curtailment, principal_outstanding_cents + cumulative_curtailment_cents
          == original_advance_cents (1000000) holds exactly. A 100000 SCHEDULED
          curtailment leaves outstanding 900000 + cumulative 100000 == 1000000.
        test_recipe:
          setup:
            - "A floored loan opened 2026-01-01, original advance 1000000, aged to CURTAILMENT_DUE at day 90."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000160", category: "MOTORCYCLE", model_year: 2024, msrp_cents: 1300000, dealer_cost_cents: 1000000, acquisition_kind: "NEW_FLOORED" }
              as: DealerPrincipal
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: DealerPrincipal
            - call: "POST /floor-plan-loans"
              payload: { unit_id: "${unit_id}", opened_on: "2026-01-01T00:00:00.000Z", apr_bps: 900 }
              as: DealerPrincipal
              captures: { loan_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-04-01T00:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /floor-plan-loans/${loan_id}/run-aging"
              payload: {}
              as: DealerPrincipal
              captures: { loan_v: $.data.version }
          trigger:
            - call: "POST /curtailments"
              payload: { floor_plan_loan_id: "${loan_id}", principal_cents: 100000, reason: "SCHEDULED", expected_floor_plan_loan_version: "${loan_v}" }
              as: DealerPrincipal
          assert:
            - "FloorPlanLoan.${loan_id}.principal_outstanding_cents == 900000"
            - "FloorPlanLoan.${loan_id}.cumulative_curtailment_cents == 100000"
            - "FloorPlanLoan.${loan_id}.status == OPEN"
            - "GET /floor-plan-loans/${loan_id} -> data.principal_outstanding_cents + data.cumulative_curtailment_cents == 1000000 (== original_advance_cents)"

      - name: part_inventory_reserve_then_release_conserves_on_hand
        grounds:
          - state_machines.PartLine.RESERVED_to_RELEASED
          - entities.Part.fields.on_hand_qty
          - entities.Part.fields.available_qty
          - entities.Part.fields.reserved_qty
        distinguishing_aspect: |
          Conserved quantity #2 = part inventory units (DIFFERENT conserved type
          from money): reserving N then releasing the PartLine restores
          available_qty and zeroes reserved_qty; the invariant
          on_hand_qty == available_qty + reserved_qty + consumed_qty (10 == 10+0+0)
          holds after the compensating release with no drift.
        test_recipe:
          setup:
            - "A Part with on_hand_qty=10. An open RO. A PartLine reserves quantity=4 (available 6, reserved 4), then the part line is released."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-06-01T08:00:00.000Z" }
              as: DealerPrincipal
            - call: "POST /customers"
              payload: { full_name: "Par Inv", email: "parinv@x.com", phone: "555-0115" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /units"
              payload: { vin: "1HD1KB4197Y000170", category: "UTV", model_year: 2024, msrp_cents: 1500000, dealer_cost_cents: 1100000, acquisition_kind: "CASH_OWNED" }
              as: SalesManager
              captures: { unit_id: $.data.id }
            - call: "POST /units/${unit_id}/receive"
              payload: {}
              as: SalesManager
            - call: "POST /technicians"
              payload: { name: "Tech P", hourly_cost_cents: 4000 }
              as: ServiceAdvisor
              captures: { tech_id: $.data.id }
            - call: "POST /repair-orders"
              payload: { unit_id: "${unit_id}", customer_id: "${cust_id}", technician_id: "${tech_id}", appointment_start: "2026-06-07T09:00:00.000Z", appointment_end: "2026-06-07T11:00:00.000Z", is_warranty: false, authorized_amount_cents: 90000 }
              as: ServiceAdvisor
              captures: { ro_id: $.data.id }
            - call: "POST /parts"
              payload: { sku: "BRK-PAD-01", description: "Brake pad set", unit_price_cents: 4500, on_hand_qty: 10 }
              as: PartsClerk
              captures: { part_id: $.data.id, part_v: $.data.version }
            - call: "POST /part-lines"
              payload: { repair_order_id: "${ro_id}", part_id: "${part_id}", quantity: 4, expected_part_version: "${part_v}" }
              as: PartsClerk
              captures: { pl_id: $.data.id }
          trigger:
            - call: "DELETE /part-lines/${pl_id}"
              payload: {}
              as: PartsClerk
          assert:
            - "Part.${part_id}.available_qty == 10"
            - "Part.${part_id}.reserved_qty == 0"
            - "Part.${part_id}.consumed_qty == 0"
            - "PartLine.${pl_id}.status == RELEASED"
