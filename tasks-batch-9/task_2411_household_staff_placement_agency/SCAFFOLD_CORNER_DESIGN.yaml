      - signed_amount_cents == 250000, related_ref_type == NONE, related_ref_id == null and balance_after_cents
        == 250000
      - 'the response carries no version field, because entities.LedgerEntry declares common_fields: false'
      - GET /clients/${client_id} as BillingAdministrator returns outstanding_balance_cents == 250000
  - name: unknown_region_code_enum_is_rejected
