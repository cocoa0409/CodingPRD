  - name: DistributionManager
    description: "Records production batches and tracking labels, furnishes and recalls certificate accompaniment for shipments, releases and rescinds releases, and issues the formal stop-distribution instruction. Cannot certify and cannot order or report tests."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/certificates/{certificate_id}/furnish"
      - "POST /compliance/certificates/{certificate_id}/recall-accompaniment"
      - "POST /compliance/products/{product_id}/production-batches"
