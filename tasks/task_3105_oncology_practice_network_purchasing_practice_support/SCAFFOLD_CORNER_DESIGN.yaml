      - name: read_only_analyst_cannot_write_any_business_resource
        claim_type: Standard CRUD
        grounds:
          - roles.NetworkAnalyst
          - validations[priority=2]
          - errors.ERR_INSUFFICIENT_PERMISSIONS
        distinguishing_aspect: "NetworkAnalyst holds no exclusive operations at all, so every write endpoint answers 403 ERR_INSUFFICIENT_PERMISSIONS while every read endpoint it shares answers 200 — the read/write split is total rather than partial."
        test_recipe:
          setup:
            - "Network N and practice P; clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_net
          trigger:
            - call: "POST /networks/${n_id}/practices"
              payload: { practice_name: "Analyst Blocked Practice", practice_npi: "6543211003", state_code: "TX", drug_shortage_baseline_units: 100, pathway_steering_target_pct: 0.75, denial_ratio_threshold_pct: 0.20 }
              as: NetworkAnalyst
              captures: { e_create: $.data.error_id }
            - call: "POST /networks/${n_id}/drug-products"
              payload: { ndc: "00000000952", brand_name: "Blockcide", generic_name: "blockcide-xyz", therapeutic_class: "CYTOTOXIC", unit_type: "VIAL", network_base_price_cents: 1000, is_shortage_candidate: false }
              as: NetworkAnalyst
              captures: { e_product: $.data.error_id }
            - call: "GET /networks/drug-products"
              payload: { network_id: "${n_id}" }
              as: NetworkAnalyst
              captures: { first_product: $.data.0.id }
          assert:
            - "the practice create returns 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "the drug product create returns 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "the read returns 200 with response_type array and an empty data array"
            - "no practice and no product were persisted"

