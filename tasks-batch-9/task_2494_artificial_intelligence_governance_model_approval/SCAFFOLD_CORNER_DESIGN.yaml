        claim_type: computed_read
        grounds: ["endpoints[GET /test-evaluations/{id}]", calculations.eval_threshold_profile, entities.TestEvaluation.fields.required_metric_threshold]
        distinguishing_aspect: "A BIAS evaluation planned on a LIMITED-tier use case reads back required_metric_name worst_group_parity_ratio, required_metric_threshold 0.7 and required_sample_size 300 - the LIMITED row of EVAL_THRESHOLDS and MIN_SAMPLE_SIZE, not the HIGH row's 0.8 / 1000."
