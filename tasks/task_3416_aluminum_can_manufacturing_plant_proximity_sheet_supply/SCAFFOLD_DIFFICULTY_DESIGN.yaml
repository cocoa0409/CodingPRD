            - call: "POST /production-runs/${run_id}/start"
              payload: {}
              as: LineScheduler
            - call: "POST /production-runs/${run_id}/complete"
              payload: { produced_qty: 250000, spoiled_qty: 0 }
              as: LineScheduler
            - call: "GET /supply-agreements/${agr_id}"
              payload: {}
              as: PlantManager
              captures: { ytd_before: $.data.ytd_settled_units, rev_before: $.data.delivered_revenue_cents }
          trigger:
            - call: "POST /production-runs/${run_id}/settle"
              payload: {}
              as: PlantManager
            - call: "GET /supply-agreements/${agr_id}"
