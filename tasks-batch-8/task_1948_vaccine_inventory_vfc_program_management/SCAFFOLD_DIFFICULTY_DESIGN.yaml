  # -------------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap — 2 instances with different semantics
  # -------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: single_active_excursion_per_unit
        grounds:
          - entities.StorageUnit.fields.active_excursion_id
          - state_machines.TemperatureExcursion
        distinguishing_aspect: |
          Interval semantics (point-in-time occupation on StorageUnit): at
          most one TemperatureExcursion may be OPEN/UNDER_REVIEW per unit at
          any moment. A second out-of-range reading while one is open does
          NOT create a new excursion — it updates the existing excursion's
          peak. Adjacency: an excursion closes the moment a single in-range
          reading is posted; there is no buffer/grace window.
        test_recipe:
          setup:
            - "Site S; unit U; lot L PRIVATE 5 doses"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-801" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "L1", stock_type: "PRIVATE", quantity_on_hand: 5, expires_on: "2027-06-30" }
              as: VaccineManager
          trigger:
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-01T10:00:00Z", temperature_c: 9.0 }
              as: VaccineManager
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-01T11:00:00Z", temperature_c: 11.0 }
              as: VaccineManager
            - call: "POST /storage-units/${unit_u}/temperature-readings"
              payload: { recorded_at: "2026-08-01T12:00:00Z", temperature_c: 10.0 }
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { open_cnt: $.data.excursion_count_open }
            - call: "GET /storage-units/${unit_u}/excursions"
              payload: {}
              as: VaccineManager
              captures:
                peak: "$.data[0].peak_temperature_c"
          assert:
            - "Only ONE excursion exists despite three out-of-range readings (no overlapping excursions per unit)"
            - "${open_cnt} == 1"
            - "The single excursion's peak accumulated the maximum deviation (11.0)"
            - "${peak} == 11.0"

      - name: expiration_window_and_administration_date_interval_semantics
        grounds:
          - entities.Lot.fields.expires_on
          - validations[priority=8]
        distinguishing_aspect: |
          Different interval semantics than excursion-occupation: lot
          expiration uses a CLOSED interval on administration_date —
          administration allowed while administration_date <= expires_on
          (inclusive on the expiry day itself). This is a point-within-window
          check with an INCLUSIVE upper bound, not an occupancy-overlap
          between two intervals. Different resource (Lot vs StorageUnit) and
          different semantics (closed interval vs single-active occupancy).
        test_recipe:
          setup:
            - "Site S; unit U; product P; lot L PRIVATE 5 doses expires_on=2026-08-15"
            - "Patient pat (COMMERCIAL); two screenings on 2026-08-15 and 2026-08-16"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-802" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "L1", stock_type: "PRIVATE", quantity_on_hand: 5, expires_on: "2026-08-15" }
              as: VaccineManager
              captures: { lot: $.data.id }
            - call: "POST /provider-sites/${site_s}/patients"
              payload: { full_name: "Pat C", date_of_birth: "2020-01-15", insurance_category: "COMMERCIAL" }
              as: VaccineManager
              captures: { pat: $.data.id }
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-15", insurance_category_at_visit: "COMMERCIAL" }
              as: VaccineManager
              captures: { scr_ok: $.data.id }
            - call: "POST /patients/${pat}/eligibility-screenings"
              payload: { screening_date: "2026-08-16", insurance_category_at_visit: "COMMERCIAL" }
              as: VaccineManager
              captures: { scr_late: $.data.id }
          trigger:
            - call: "POST /provider-sites/${site_s}/dose-administrations"
              payload: { patient_id: "${pat}", eligibility_screening_id: "${scr_ok}", lot_id: "${lot}", administration_date: "2026-08-15" }
              as: VaccineManager
              captures: { ok_qty: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites/${site_s}/dose-administrations"
              payload: { patient_id: "${pat}", eligibility_screening_id: "${scr_late}", lot_id: "${lot}", administration_date: "2026-08-16" }
              as: VaccineManager
              captures: { err: $.data.error_id }
          assert:
            - "administration_date == expires_on (2026-08-15): CLOSED interval — ALLOWED, dose created"
            - "${ok_qty} is a non-empty UUID"
            - "After clock advances past expiry, lot transitions to EXPIRED; a second administration on 2026-08-16 fails the state check (ERR_LOT_NOT_AVAILABLE — lot is no longer AVAILABLE)"
            - "${err} == ERR_LOT_NOT_AVAILABLE"

  # -------------------------------------------------------------------------
  # Rule 9: compensating_invariant — 2 instances on different conserved quantities
  # -------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payback_conserves_doses_across_paying_and_lender_lots
        grounds:
          - state_machines.BorrowTicket
          - calculations.payback_quantity_validation
          - entities.BorrowTicket.fields.paid_back_quantity
        distinguishing_aspect: |
          Conserved quantity: total on-hand doses across the paying lot and
          the from_lot (lender) of a BorrowTicket. Each record-payback
          decrements paying_lot.quantity_on_hand by N and increments
          from_lot.quantity_on_hand by the same N — the SUM of the two is
          invariant across the payback action. Across the full borrow+payback
          cycle, the 4 borrowed doses are consumed by a patient at open time
          and restored to the lender at payback time, so the post-cycle sum
          equals the post-borrow sum.
        test_recipe:
          setup:
            - "Site S; unit U; product P; L_pub PUBLIC_VFC 10 doses; L_priv PRIVATE 8 doses"
            - "Pre-borrow sum: 10 + 8 = 18"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S", vfc_pin: "PIN-S-901" }
              as: ComplianceAuditor
              captures: { site_s: $.data.id }
            - call: "POST /provider-sites/${site_s}/storage-units"
              payload: { unit_label: "U", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { unit_u: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders"
              payload: { expected_vfc_doses: 10 }
              as: VaccineManager
              captures: { ord: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/lines"
              payload: { vaccine_product_id: "${prod_p}", requested_doses: 10 }
              as: VaccineManager
              captures: { ord_line: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { site_v: $.data.version }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/approve"
              payload: { approved_vfc_doses: 10, expected_provider_site_version: "${site_v}" }
              as: StateProgramOfficer
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/allocation-receipts"
              payload: { order_line_id: "${ord_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-PUB", expires_on: "2027-06-30", quantity_doses: 10 }
              as: VaccineManager
              captures: { lot_pub: $.data.lot_id }
            - call: "POST /provider-sites/${site_s}/lots"
              payload: { storage_unit_id: "${unit_u}", vaccine_product_id: "${prod_p}", lot_number: "LOT-PRIV", stock_type: "PRIVATE", quantity_on_hand: 8, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { lot_priv: $.data.id }
          trigger:
            - call: "POST /provider-sites/${site_s}/borrow-tickets"
              payload: { from_lot_id: "${lot_priv}", to_lot_id: "${lot_pub}", direction: "PUBLIC_FROM_PRIVATE", borrowed_quantity: 4, reason_code: "STOCK_OUT" }
              as: VaccineManager
              captures: { bt: $.data.id, bt_v: $.data.version }
            - call: "GET /lots/${lot_pub}"
              payload: {}
              as: VaccineManager
              captures: { pub_mid: $.data.quantity_on_hand, pub_mid_borrowed: $.data.quantity_borrowed_in }
            - call: "GET /lots/${lot_priv}"
              payload: {}
              as: VaccineManager
              captures: { priv_mid: $.data.quantity_on_hand }
            - call: "POST /provider-sites/${site_s}/borrow-tickets/${bt}/record-payback"
              payload: { payback_quantity: 4, paying_lot_id: "${lot_pub}", expected_borrow_ticket_version: "${bt_v}" }
              as: VaccineManager
            - call: "GET /lots/${lot_pub}"
              payload: {}
              as: VaccineManager
              captures: { pub_end: $.data.quantity_on_hand, pub_end_borrowed: $.data.quantity_borrowed_in }
            - call: "GET /lots/${lot_priv}"
              payload: {}
              as: VaccineManager
              captures: { priv_end: $.data.quantity_on_hand }
          assert:
            - "After borrow open: L_pub on-hand UNCHANGED (10); L_pub IOU quantity_borrowed_in = 4; L_priv on-hand = 8-4 = 4"
            - "${pub_mid} == 10"
            - "${pub_mid_borrowed} == 4"
            - "${priv_mid} == 4"
            - "Post-borrow sum (10+4) = 14; the 4 borrowed doses are gone from inventory (consumed by a patient)"
            - "${pub_mid} + ${priv_mid} == 14"
            - "After full payback: paying lot L_pub = 10-4 = 6; lender lot L_priv = 4+4 = 8; IOU amortized to 0"
            - "${pub_end} == 6"
            - "${pub_end_borrowed} == 0"
            - "${priv_end} == 8"
            - "Conserved invariant across payback: paying_lot + from_lot = 10+4 = 14 before, 6+8 = 14 after (payback shifts doses, never creates or destroys them)"
            - "${pub_end} + ${priv_end} == 14"

      - name: short_date_transfer_conserves_total_across_sites
        grounds:
          - state_machines.ShortDateTransfer
          - calculations.short_date_transfer_successor_lot_quantity
          - entities.ShortDateTransfer.fields.new_lot_id
        distinguishing_aspect: |
          Different conserved quantity than the borrow pair: total on-hand
          doses for a given (lot_number, stock_type) pair across SITES. Ship
          decrements from_lot at origin; receive increments (or creates) the
          successor lot at destination with the same lot_number and stock_type.
          Sum of quantity_on_hand across both sites for that lot_number is
          invariant across the full ship+receive cycle.
        test_recipe:
          setup:
            - "Sites S1 and S2; units U1 at S1 and U2 at S2; product P"
            - "S1 holds lot L (PRIVATE 8 doses, lot_number=LOT-X)"
            - "Pre-ship total across sites for lot_number=LOT-X: 8"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceAuditor
            - call: "POST /provider-sites"
              payload: { site_name: "Site S1", vfc_pin: "PIN-S-902" }
              as: ComplianceAuditor
              captures: { s1: $.data.id }
            - call: "POST /provider-sites"
              payload: { site_name: "Site S2", vfc_pin: "PIN-S-903" }
              as: ComplianceAuditor
              captures: { s2: $.data.id }
            - call: "POST /provider-sites/${s1}/storage-units"
              payload: { unit_label: "U1", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { u1: $.data.id }
            - call: "POST /provider-sites/${s2}/storage-units"
              payload: { unit_label: "U2", unit_kind: "REFRIGERATOR", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: VaccineManager
              captures: { u2: $.data.id }
            - call: "POST /vaccine-products"
              payload: { ndc_code: "00006-4681-00", display_name: "MMR II", presentation: "SINGLE_DOSE_VIAL", doses_per_container: 1, vfc_program_eligible: true, storage_requirement: "REFRIGERATED_2_8C" }
              as: ComplianceAuditor
              captures: { prod_p: $.data.id }
            - call: "POST /provider-sites/${s1}/lots"
              payload: { storage_unit_id: "${u1}", vaccine_product_id: "${prod_p}", lot_number: "LOT-X", stock_type: "PRIVATE", quantity_on_hand: 8, expires_on: "2027-06-30" }
              as: VaccineManager
              captures: { lot_x: $.data.id }
            - call: "POST /provider-sites/${s1}/short-date-transfers"
              payload: { from_lot_id: "${lot_x}", destination_site_id: "${s2}", destination_storage_unit_id: "${u2}", quantity_doses: 3, reason: "short-dated at S1" }
              as: VaccineManager
              captures: { xfer: $.data.id }
          trigger:
            - call: "POST /provider-sites/${s1}/short-date-transfers/${xfer}/ship"
              payload: {}
              as: VaccineManager
            - call: "GET /lots/${lot_x}"
              payload: {}
              as: VaccineManager
              captures: { l_post_ship: $.data.quantity_on_hand }
            - call: "POST /provider-sites/${s1}/short-date-transfers/${xfer}/receive"
              payload: {}
              as: VaccineManager
              captures: { new_lot: $.data.new_lot_id }
            - call: "GET /lots/${new_lot}"
              payload: {}
              as: VaccineManager
              captures: { new_qty: $.data.quantity_on_hand, new_lotnum: $.data.lot_number, new_site: $.data.provider_site_id }
            - call: "GET /lots/${lot_x}"
              payload: {}
              as: VaccineManager
              captures: { l_final: $.data.quantity_on_hand }
          assert:
            - "After ship: from_lot = 8-3 = 5; total across sites = 5 (3 in transit, not yet on any shelf)"
            - "${l_post_ship} == 5"
            - "After receive: successor lot created at S2 with quantity_on_hand = 3, lot_number = LOT-X, provider_site_id = S2"
            - "${new_qty} == 3"
            - "${new_lotnum} == LOT-X"
            - "${new_site} == ${s2}"
            - "Conserved invariant: from_lot + new_lot = 5 + 3 = 8 (total across sites for LOT-X unchanged)"
            - "${l_final} + ${new_qty} == 8"
