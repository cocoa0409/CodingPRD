scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: claim_routine_vs_medical_diverges_on_encounter_domain
        grounds:
          - calculations.claim_adjudication_cost
          - state_machines.Claim.DRAFT_to_ADJUDICATED
          - entities.Encounter.fields.encounter_type
        distinguishing_aspect: |
          Same exam_fee/refraction_fee inputs produce different patient_responsibility_cents
          on the Claim/Encounter domain: ROUTINE (12000 exam + 3000 refraction, copay 2500)
          yields patient_responsibility 2500, while MEDICAL (same fees) yields 14400 plan_paid
          and a different patient share — a different entity domain than instance 2's LabOrder draw.
        test_recipe:
          setup:
            - "Patient (plan_carrier VSP, medical_insurance_on_file true), Optometrist provider"
            - "One ROUTINE_VISION FINALIZED encounter with exam_fee 12000, refraction 3000, and an in-period VSP Eligibility (exam_copay 2500)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat R", date_of_birth: "1990-01-01", plan_carrier: "VSP", medical_insurance_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /eligibilities"
              payload: { patient_id: "${pat_id}", carrier: "VSP", benefit_period_start: "2026-01-01", exam_copay_cents: 2500, materials_allowance_cents: 40000 }
              as: FrontDesk
              captures: { elig_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", chief_complaint_code: "Z01", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /encounters/${enc_id}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /claims"
              payload: { encounter_id: "${enc_id}", eligibility_id: "${elig_id}" }
              as: Biller
              captures: { claim_id: $.data.id }
          trigger:
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: Biller
              captures: { adj_status: $.data.claim_status }
          assert:
            - "Claim.${claim_id}.billing_route == ROUTINE"
            - "Claim.${claim_id}.billed_amount_cents == 15000"
            - "Claim.${claim_id}.plan_paid_cents == 12500"
            - "Claim.${claim_id}.patient_responsibility_cents == 2500"

      - name: materials_provisional_vs_final_diverges_on_laborder_domain
        grounds:
          - calculations.materials_cost_and_draw
          - state_machines.LabOrder.PLACED_to_IN_LAB
          - state_machines.LabOrder.IN_LAB_to_DISPENSED
          - entities.LabOrder.fields.materials_draw_cents
        distinguishing_aspect: |
          On the LabOrder/BenefitPool domain (different domain from instance 1's Claim), the
          provisional draw at placement (pool_remaining 19000 after a sibling order) differs from
          the final draw recomputed at dispense once the sibling order is cancelled and frees room,
          reconciling patient_materials_cost_cents downward.
        test_recipe:
          setup:
            - "Patient with VSP, MATERIALS allowance 40000; two ACTIVE eyeglass Rx lab orders compete for the pool"
            - "Sibling order A drew 21000 leaving 19000; target order B placed against remaining 19000 (provisional draw capped at 19000); then A cancelled freeing the pool back to 40000 before B dispenses"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Op Tician", role: "OPTICIAN", npi: "2222222222" }
              as: FrontDesk
              captures: { opt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat M", date_of_birth: "1990-01-01", plan_carrier: "VSP" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /eligibilities"
              payload: { patient_id: "${pat_id}", carrier: "VSP", benefit_period_start: "2026-01-01", exam_copay_cents: 2500, materials_allowance_cents: 40000 }
              as: FrontDesk
              captures: { elig_id: $.data.id, elig_v0: $.data.version }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", eligibility_id: "${elig_id}", expected_eligibility_version: "${elig_v0}", frame_charge_cents: 15000, lens_charge_cents: 8000, frame_brand_tier: "STANDARD" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { order_a_id: $.data.id }
            - call: "GET /eligibilities/${elig_id}"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
              captures: { elig_v1: $.data.version }
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", eligibility_id: "${elig_id}", expected_eligibility_version: "${elig_v1}", frame_charge_cents: 15000, lens_charge_cents: 8000, frame_brand_tier: "STANDARD" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { order_b_id: $.data.id, prov_draw_b: $.data.materials_draw_cents, prov_patient_b: $.data.patient_materials_cost_cents }
            - call: "POST /lab-orders/${order_a_id}/cancel"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_b_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
          trigger:
            - call: "POST /lab-orders/${order_b_id}/dispense"
              payload: { dispensing_optician_id: "${opt_id}" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { final_draw_b: $.data.materials_draw_cents, final_patient_b: $.data.patient_materials_cost_cents }
          assert:
            - "LabOrder.${order_b_id} provisional materials_draw_cents at placement == 19000"
            - "LabOrder.${order_b_id} provisional patient_materials_cost_cents at placement == 4000"
            - "LabOrder.${order_b_id}.materials_draw_cents after dispense == 21000"
            - "LabOrder.${order_b_id}.patient_materials_cost_cents after dispense == 2000"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: materials_tiered_min_cap_nonlinear_mode_a
        grounds:
          - calculations.materials_cost_and_draw
          - entities.LabOrder.fields.frame_brand_tier
          - state_machines.LabOrder.PLACED_to_IN_LAB
        distinguishing_aspect: |
          Mode (a): formula with >=3 inputs and nested min/max — frame_cap = min(frame_charge,
          BASE_FRAME_ALLOWANCE*tier_mult) then draw = min(covered_frame+lens, pool_remaining);
          PREMIUM tier (cap 15600) covers the full 15000 frame so patient pays 0, whereas the same
          frame at STANDARD (cap 13000) leaves the patient 2000.
        test_recipe:
          setup:
            - "VSP patient, MATERIALS allowance 40000; one ACTIVE eyeglass Rx; place a PREMIUM-tier lab order (frame 15000, lens 8000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Op Tician", role: "OPTICIAN", npi: "2222222222" }
              as: FrontDesk
              captures: { opt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat P", date_of_birth: "1990-01-01", plan_carrier: "VSP" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /eligibilities"
              payload: { patient_id: "${pat_id}", carrier: "VSP", benefit_period_start: "2026-01-01", exam_copay_cents: 2500, materials_allowance_cents: 40000 }
              as: FrontDesk
              captures: { elig_id: $.data.id, elig_v0: $.data.version }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
          trigger:
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", eligibility_id: "${elig_id}", expected_eligibility_version: "${elig_v0}", frame_charge_cents: 15000, lens_charge_cents: 8000, frame_brand_tier: "PREMIUM" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { order_id: $.data.id }
          assert:
            - "LabOrder.${order_id}.materials_draw_cents == 23000"
            - "LabOrder.${order_id}.patient_materials_cost_cents == 0"

      - name: patient_statement_round_then_sum_mode_b
        grounds:
          - calculations.patient_statement_total
          - state_machines.Claim.DRAFT_to_ADJUDICATED
          - entities.Claim.fields.patient_responsibility_cents
        distinguishing_aspect: |
          Mode (b): per-line rounding order is pinned round-then-sum — two MEDICAL claims each with
          outstanding 2550 round to 2600 (whole dollars) then sum to 5200, NOT sum-then-round
          (5100/100 -> 51 -> 5100). The pinned order produces 5200; the wrong order produces 5100.
        test_recipe:
          setup:
            - "Patient with medical_insurance_on_file true; two FINALIZED MEDICAL_EYE encounters (H40), each exam_fee 12750, refraction 0"
            - "Two MEDICAL claims, both adjudicated, each patient_responsibility 2550, settled 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat S", date_of_birth: "1990-01-01", plan_carrier: "NONE", medical_insurance_on_file: true }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "MEDICAL_EYE", chief_complaint_code: "H40", exam_fee_cents: 12750, refraction_fee_cents: 0 }
              as: FrontDesk
              captures: { enc1_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc1_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /encounters/${enc1_id}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /claims"
              payload: { encounter_id: "${enc1_id}" }
              as: Biller
              captures: { claim1_id: $.data.id }
            - call: "POST /claims/${claim1_id}/adjudicate"
              payload: {}
              as: Biller
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "MEDICAL_EYE", chief_complaint_code: "H40", exam_fee_cents: 12750, refraction_fee_cents: 0 }
              as: FrontDesk
              captures: { enc2_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc2_id}", rx_type: "EYEGLASS", sphere_od: -1.50, sphere_os: -1.25, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /encounters/${enc2_id}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /claims"
              payload: { encounter_id: "${enc2_id}" }
              as: Biller
              captures: { claim2_id: $.data.id }
            - call: "POST /claims/${claim2_id}/adjudicate"
              payload: {}
              as: Biller
          trigger:
            - call: "GET /patients/${pat_id}/statement"
              payload: {}
              as: Biller
              captures: { total: $.data.statement_total_cents }
          assert:
            - "Claim.${claim1_id}.patient_responsibility_cents == 2550"
            - "Claim.${claim2_id}.patient_responsibility_cents == 2550"
            - "statement_total_cents == 5200"
            - "line_count == 2"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: laborder_remake_cycle_dispensed_remake_inlab
        grounds:
          - state_machines.LabOrder.DISPENSED_to_REMAKE_REQUESTED
          - state_machines.LabOrder.REMAKE_REQUESTED_to_IN_LAB
          - state_machines.LabOrder.IN_LAB_to_DISPENSED
        distinguishing_aspect: |
          Cycle on LabOrder: DISPENSED -> REMAKE_REQUESTED -> IN_LAB -> DISPENSED loops back to a
          previously-visited state, advancing remake_count each cycle — a genuine A->B->A loop, not
          a linear pipeline; distinct entity from instance 2's parallel Claim dimensions.
        test_recipe:
          setup:
            - "A self-pay eyeglass LabOrder dispensed at clock 2026-06-01, within the 90-day remake window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Op Tician", role: "OPTICIAN", npi: "2222222222" }
              as: FrontDesk
              captures: { opt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat C", date_of_birth: "1990-01-01", plan_carrier: "NONE" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", frame_charge_cents: 15000, lens_charge_cents: 8000, frame_brand_tier: "STANDARD" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { order_id: $.data.id }
            - call: "POST /lab-orders/${order_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
            - call: "POST /lab-orders/${order_id}/dispense"
              payload: { dispensing_optician_id: "${opt_id}" }
              as: Optician
              as_user_id: "${opt_id}"
          trigger:
            - call: "POST /lab-orders/${order_id}/request-remake"
              payload: { reason: "scratch" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { st_remake: $.data.status }
            - call: "POST /lab-orders/${order_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
              captures: { st_inlab: $.data.status, rc: $.data.remake_count }
          assert:
            - "after request-remake LabOrder.${order_id}.status == REMAKE_REQUESTED"
            - "after send-to-lab LabOrder.${order_id}.status == IN_LAB"
            - "LabOrder.${order_id}.remake_count == 1"

      - name: claim_parallel_financial_and_submission_dimensions
        grounds:
          - state_machines.Claim.DRAFT_to_ADJUDICATED
          - state_machines.Claim.UNSUBMITTED_to_SUBMITTED
          - state_machines.Claim.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Parallel dimensions on the Claim entity: claim_status (DRAFT->ADJUDICATED) and
          submission_status (UNSUBMITTED->SUBMITTED->ACCEPTED) evolve independently on one row —
          submitting and carrier-ack do not change claim_status; distinct entity from instance 1's
          LabOrder cycle.
        test_recipe:
          setup:
            - "A ROUTINE claim adjudicated (claim_status ADJUDICATED) and submitted to carrier"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat D", date_of_birth: "1990-01-01", plan_carrier: "VSP" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /eligibilities"
              payload: { patient_id: "${pat_id}", carrier: "VSP", benefit_period_start: "2026-01-01", exam_copay_cents: 2500, materials_allowance_cents: 40000 }
              as: FrontDesk
              captures: { elig_id: $.data.id }
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /encounters/${enc_id}/finalize"
              payload: {}
              as: Optometrist
              as_user_id: "${od_id}"
            - call: "POST /claims"
              payload: { encounter_id: "${enc_id}", eligibility_id: "${elig_id}" }
              as: Biller
              captures: { claim_id: $.data.id }
            - call: "POST /claims/${claim_id}/adjudicate"
              payload: {}
              as: Biller
            - call: "POST /claims/${claim_id}/submit"
              payload: {}
              as: Biller
          trigger:
            - call: "POST /claims/${claim_id}/carrier-ack"
              payload: { outcome: "ACCEPTED" }
              as: Biller
              captures: { cs: $.data.claim_status, ss: $.data.submission_status }
          assert:
            - "Claim.${claim_id}.submission_status == ACCEPTED"
            - "Claim.${claim_id}.claim_status == ADJUDICATED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: laborder_cancel_cascade_pool_eligibility_reactivate_depth3
        grounds:
          - state_machines.LabOrder.IN_LAB_to_CANCELLED
          - state_machines.Eligibility.EXHAUSTED_to_ACTIVE
          - entities.BenefitPool.fields.consumed_cents
        distinguishing_aspect: |
          Depth-3 cascade from LabOrder cancel: (1) LabOrder -> CANCELLED releases the draw, which
          (2) mutates the MATERIALS BenefitPool consumed_cents downward, which (3) drives the
          Eligibility EXHAUSTED -> ACTIVE bubble-up. Each hop is caused by the prior hop, not the
          original cancel.
        test_recipe:
          setup:
            - "VSP patient, MATERIALS allowance 21000; one IN_LAB order that drew 21000 and exhausted the pool, flipping Eligibility to EXHAUSTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: FrontDesk
            - call: "POST /providers"
              payload: { full_name: "Dr OD", role: "OPTOMETRIST", npi: "1234567890" }
              as: FrontDesk
              captures: { od_id: $.data.id }
            - call: "POST /providers"
              payload: { full_name: "Op Tician", role: "OPTICIAN", npi: "2222222222" }
              as: FrontDesk
              captures: { opt_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pat X", date_of_birth: "1990-01-01", plan_carrier: "VSP" }
              as: FrontDesk
              captures: { pat_id: $.data.id }
            - call: "POST /eligibilities"
              payload: { patient_id: "${pat_id}", carrier: "VSP", benefit_period_start: "2026-01-01", exam_copay_cents: 2500, materials_allowance_cents: 21000 }
              as: FrontDesk
              captures: { elig_id: $.data.id, elig_v0: $.data.version }
            - call: "GET /eligibilities/${elig_id}/benefit-pools"
              payload: {}
              as: FrontDesk
              captures: { pool0_id: "$.data[0].id"}
            - call: "POST /encounters"
              payload: { patient_id: "${pat_id}", provider_id: "${od_id}", encounter_type: "ROUTINE_VISION", exam_fee_cents: 12000, refraction_fee_cents: 3000 }
              as: FrontDesk
              captures: { enc_id: $.data.id }
            - call: "POST /patients/${pat_id}/prescriptions"
              payload: { encounter_id: "${enc_id}", rx_type: "EYEGLASS", sphere_od: -1.25, sphere_os: -1.00, issue_date: "2026-06-01" }
              as: Optometrist
              as_user_id: "${od_id}"
              captures: { rx_id: $.data.id }
            - call: "POST /lab-orders"
              payload: { prescription_id: "${rx_id}", eligibility_id: "${elig_id}", expected_eligibility_version: "${elig_v0}", frame_charge_cents: 15000, lens_charge_cents: 8000, frame_brand_tier: "STANDARD" }
              as: Optician
              as_user_id: "${opt_id}"
              captures: { order_id: $.data.id }
            - call: "POST /lab-orders/${order_id}/send-to-lab"
              payload: {}
              as: Optician
              as_user_id: "${opt_id}"
