              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: FleetPlanner
            - call: "POST /fleet/stores"
              payload: { store_code: "S-4004", region_code: "MIDWEST", dock_count: 2, cases_per_hour_unload_rate: 600, dock_open_minute: 0, dock_close_minute: 1439 }
              as: FleetPlanner
