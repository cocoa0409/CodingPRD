            - { call: "POST /inbox/patients", payload: { full_name: "Pat L", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_l: "$.data.id" } }
            - { call: "POST /inbox/patients", payload: { full_name: "Pat M", plan_type: "COPAY", copay_cents: 2500 }, as: PracticeAdmin, captures: { pat_m: "$.data.id" } }
