  - rule_id: non_linear_state_machine
    instances:
      - name: refund_request_parallel_dimensions_disbursement_cycles_while_approval_frozen
        grounds:
          - state_machines.RefundRequest.BATCHED_to_ISSUED
          - state_machines.RefundRequest.ISSUED_to_REISSUE_PENDING
          - state_machines.RefundRequest.REISSUE_PENDING_to_BATCHED
          - entities.RefundRequest.fields.approval_state
          - entities.RefundRequest.fields.disbursement_state
        distinguishing_aspect: |
          Non-linearity on the RefundRequest entity takes the form of two parallel
          state dimensions plus a cycle in one of them: disbursement_state walks
          NOT_SCHEDULED -> BATCHED -> ISSUED -> REISSUE_PENDING -> BATCHED while
