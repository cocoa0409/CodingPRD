          - roles.TrainingOfficer
          - roles.StateDataSteward
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "The role check sits at validation priority 2, ahead of every body, foreign-key and state check: a wrong-role call is 403 ERR_UNAUTHORIZED even when its body names ids that do not exist, and it is refused in all four directions tested (Inspector -> TrainingOfficer, TrainingOfficer -> Inspector, StateDataSteward -> ProgramAdmin, ProgramAdmin -> Inspector)."
