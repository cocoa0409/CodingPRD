  # ===========================================================================
  - section: validations
    instances:

      - name: an_undeclared_role_header_is_unauthenticated_before_anything_else
        claim_type: violation_to_error
        grounds:
          - validations.priority_10_ERR_UNAUTHENTICATED
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "X-User-Role WaterCommissioner is not one of the six declared roles, so the priority-10 auth rule returns ERR_UNAUTHENTICATED 401 even though the target id does not exist either — 401 wins over the priority-40 existence check."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /lsl/water-systems/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: WaterCommissioner
              as_user_id: "who-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 401"
            - "${err} == ERR_UNAUTHENTICATED and NOT ERR_WATER_SYSTEM_NOT_FOUND"

      - name: out_of_range_pagination_parameters_are_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_36_ERR_INVALID_PAGINATION
          - response_envelope.pagination_defaults
        distinguishing_aspect: "limit 0, limit 101 and offset -1 each return ERR_INVALID_PAGINATION 400 against the declared [1,100] / >= 0 bounds, while limit 100 and offset 0 are accepted."
        test_recipe:
          setup:
            - "One water system so the list endpoint has something to page over."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2103001", system_name: "Paging Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
          trigger:
            - call: "GET /lsl/service-lines"
              payload: { water_system_id: "${ws}", limit: 0 }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { e1: $.data.error_id }
            - call: "GET /lsl/service-lines"
              payload: { water_system_id: "${ws}", limit: 101 }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { e2: $.data.error_id }
            - call: "GET /lsl/service-lines"
              payload: { water_system_id: "${ws}", offset: -1 }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { e3: $.data.error_id }
            - call: "GET /lsl/service-lines"
              payload: { water_system_id: "${ws}", limit: 100, offset: 0 }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
          assert:
            - "The first three calls return HTTP 400 with ${e1} == ERR_INVALID_PAGINATION, ${e2} == ERR_INVALID_PAGINATION and ${e3} == ERR_INVALID_PAGINATION"
            - "The fourth call returns HTTP 200 with total_count == 0 and has_more == false"

      - name: inverted_and_degenerate_interval_inputs_are_rejected
        claim_type: type_constraints
        grounds:
          - validations.priority_34_ERR_INVALID_DATE_RANGE
          - errors.ERR_INVALID_DATE_RANGE
        distinguishing_aspect: "An appointment window whose end EQUALS its start is rejected (the rule demands window_end_utc > window_start_utc, strictly) and an order whose excavation_end_date precedes its start is rejected, both with ERR_INVALID_DATE_RANGE 422 — ahead of the priority-40/42 existence checks and the priority-70 crew rules."
        test_recipe:
          setup:
            - "One water system, one service line and one ACTIVE crew certified for POTHOLE with an 08:00-18:00 shift."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2103002", system_name: "Interval Water", compliance_deadline_date: "2027-10-16" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/verification-crews"
              payload: { water_system_id: "${ws}", crew_name: "Crew A", shift_start_utc_time: "08:00", shift_end_utc_time: "18:00", daily_appointment_capacity: 1, certified_methods: ["VISUAL_INSPECTION", "POTHOLE"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { crew: $.data.id }
          trigger:
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "POTHOLE", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T09:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { e1: $.data.error_id }
