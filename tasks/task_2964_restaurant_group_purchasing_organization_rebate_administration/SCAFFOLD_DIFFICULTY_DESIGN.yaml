            - "June batch holds three lines: 30 and 40 beef cases plus 20 fries cases, so total_cases_ingested is 90 at ingestion with matched 0 and unmatched 90."
            - "normalize then accrue have run: matched_cases 70, unmatched_cases 20, two accruals of gross 4500 and 6000, member counters 7639 / 2546 / 315."
