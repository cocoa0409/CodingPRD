            - "Report.${rep_id}.status remains DRAFTING"

      - name: accept_safety_beats_constraint
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - state_machines.Engagement.PENDING_ACCEPTANCE_to_IN_PROGRESS
        distinguishing_aspect: |
          Category pair = business_safety vs business_constraint (distinct
          from the state-vs-safety pair above). Engagement submitted with
          is_contingent_fee == true (safety) AND requested_turnaround_days 1
          < minimum 15 (constraint) — priority 10 beats 11, so the error is
          ERR_CONTINGENT_FEE_PROHIBITED.
