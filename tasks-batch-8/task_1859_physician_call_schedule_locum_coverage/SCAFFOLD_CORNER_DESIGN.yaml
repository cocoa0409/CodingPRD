            - "2 slots, both status OPEN"
            - "2 CoverageGaps, both reason == GENERATION_SHORTFALL and status == OPEN"

      - name: rolling_window_28day_inclusion_boundary
        claim_type: constants_applied
        grounds:
          - "calculations.moonlight_rolling_hours"
        distinguishing_aspect: "The closed 28-date window [D-27, D]: a SERVED call on 2026-08-22 (D-28) is excluded while one on 2026-08-23 (D-27) is included — proven by one acceptance and one rejection against a cap of 48."
        test_recipe:
          setup:
            - "PUBLISHED program 2026-08-22..2026-09-19, weekend_primary_required 2, weekday_primary_required 1, budget 1000000"
            - "P1 (STAFF, cap 48) assigned to 2026-08-22 and 2026-08-23 weekend slots and to 2026-09-19 position 1 (projected at 09-19 counts only the 08-23 call: 24 + 24 == 48 <= 48, accepted — proving 08-22 is outside the window)"
            - "A1 and A2 marked SERVED (clock advanced to 2026-08-24T08:00:00Z)"
          setup_api_calls:
            - call: "POST /api/call-programs"
              payload: { name: "Cards Rolling", service_line: "CARDIOLOGY", period_start: "2026-08-22", period_end: "2026-09-19", payroll_budget_cents: 1000000, weekday_primary_required: 1, weekend_primary_required: 2, holiday_primary_required: 0, weekday_backup_required: 0, weekend_backup_required: 0, holiday_backup_required: 0 }
              as: SchedulerAdmin
