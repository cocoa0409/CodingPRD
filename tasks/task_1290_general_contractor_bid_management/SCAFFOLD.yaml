# =============================================================================
# SCAFFOLD — General Contractor Bid Management & Prequalification
# =============================================================================

scenario: |
  General Contractor Bid Management & Prequalification (commercial general
  contractor): invitation-to-bid distribution & plan room access,
  subcontractor prequalification (financial/safety/bonding) scoring, bid scope
  leveling sheet & exclusion analysis, addenda distribution & acknowledgment,
  bid day tabulation & last-minute number handling, bid bond & proposal
  submission compliance, award recommendation & post-bid interview,
  unsuccessful-bidder feedback

domain_name: gc-bid-management
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns: [one_to_many, cross_aggregate]
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table (flat topology: all collections top-level,
#     children carry FK fields; reverse reads via filtered lists / sub-resources)
# =============================================================================
entities:
  - name: BidPackage
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Bid package title, e.g. 'Structural Steel — Tower A'" }
      - { name: trade_code, type: string, source: input, description: "CSI-style trade code label" }
      - { name: bid_due_at, type: datetime, source: input, description: "Bid deadline (ISO 8601 UTC); bids and revisions accepted strictly before this instant" }
      - { name: bid_bond_required_pct, type: number, source: input, default: 0.05, description: "Required bid bond fraction of base bid (0 < pct <= 0.20)" }
      - { name: status, type: enum, source: system, description: "DRAFT | PUBLISHED | BIDDING_CLOSED | TABULATED | RECOMMENDATION_PENDING | AWARDED" }
      - { name: issued_addendum_count, type: integer, source: computed, default: 0, description: "Count of Addendum rows for this package" }
      - { name: submitted_bid_count, type: integer, source: computed, default: 0, description: "Count of Bid rows for this package with status SUBMITTED" }
      - { name: compliant_bid_count, type: integer, source: system, description: "Compliant SUBMITTED bids found at last tabulation; null until first tabulation" }
      - { name: apparent_low_bid_id, type: string, source: system, description: "FK -> Bid.id; lowest base_bid_cents among compliant bids at last tabulation; null until tabulated" }
      - { name: leveled_low_bid_id, type: string, source: system, description: "FK -> Bid.id; lowest leveled_amount_cents among compliant bids at last tabulation; null until tabulated" }

  - name: Subcontractor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the subcontracting firm" }
      - { name: contact_email, type: string, source: input, description: "Primary contact email" }
      - { name: license_number, type: string, source: input, description: "Contractor license number; unique across all subcontractors" }
      - { name: current_prequal_status, type: enum, source: computed, default: NONE, description: "APPROVED if a non-expired APPROVED PrequalApplication exists at logical now; else SUBMITTED if one is SUBMITTED; else REJECTED if a REJECTED one exists; else NONE. EXPIRED applications are ignored" }

  - name: PrequalApplication
    parent: Subcontractor
    common_fields: true
    fields:
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id; must equal caller X-User-ID when role is Subcontractor" }
      - { name: declared_annual_revenue_cents, type: integer, source: input, description: "Self-reported average annual revenue, integer cents >= 0" }
      - { name: declared_emr, type: number, source: input, description: "Self-reported experience modification rate, > 0" }
      - { name: declared_bonding_capacity_cents, type: integer, source: input, description: "Self-reported single-project bonding capacity, integer cents >= 0" }
      - { name: self_reported_score, type: number, source: computed, description: "prequal_score (self_reported variant) computed at submission/resubmission, 2dp" }
      - { name: verified_annual_revenue_cents, type: integer, source: input, description: "Reviewer-verified annual revenue; required when decision=APPROVED" }
      - { name: verified_emr, type: number, source: input, description: "Reviewer-verified EMR; required when decision=APPROVED" }
      - { name: verified_bonding_capacity_cents, type: integer, source: input, description: "Reviewer-verified bonding capacity; required when decision=APPROVED" }
      - { name: verified_score, type: number, source: computed, description: "prequal_score (verified variant) computed at decision; null until decided" }
      - { name: review_notes, type: string, source: input, description: "Reviewer free-text notes recorded at decision" }
      - { name: approved_at, type: datetime, source: system, description: "Logical timestamp of APPROVED decision; null otherwise" }
      - { name: expires_at, type: datetime, source: system, description: "approved_at + 365 days; null until approved" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | APPROVED | REJECTED | EXPIRED" }

  - name: Invitation
    parent: BidPackage
    common_fields: true
    fields:
      - { name: bid_package_id, type: string, source: input, description: "FK -> BidPackage.id" }
      - { name: subcontractor_id, type: string, source: input, description: "FK -> Subcontractor.id; unique per (bid_package_id, subcontractor_id)" }
      - { name: status, type: enum, source: system, description: "SENT | BIDDING | DECLINED" }
      - { name: responded_at, type: datetime, source: system, description: "Logical time of latest respond call; null until first response" }
      - { name: first_plan_room_access_at, type: datetime, source: system, description: "Logical time of first plan-room access; null until accessed" }
      - { name: plan_room_access_count, type: integer, source: computed, default: 0, description: "Number of successful plan-room-access calls" }

  - name: Addendum
    parent: BidPackage
    common_fields: true
    fields:
      - { name: bid_package_id, type: string, source: input, description: "FK -> BidPackage.id" }
      - { name: number, type: integer, source: system, description: "Per-package sequential number = (max existing number for package) + 1, starting at 1" }
      - { name: summary, type: string, source: input, description: "Scope-change summary of the addendum" }
      - { name: issued_at, type: datetime, source: system, description: "Logical issuance timestamp (addenda are issued at creation; immutable afterwards)" }

  - name: AddendumAcknowledgment
    parent: null
    common_fields: true
    fields:
      - { name: addendum_id, type: string, source: system, description: "FK -> Addendum.id" }
      - { name: subcontractor_id, type: string, source: system, description: "FK -> Subcontractor.id; the invited bidder who must acknowledge" }
      - { name: status, type: enum, source: system, description: "PENDING | ACKNOWLEDGED | WAIVED" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Logical time of acknowledgment; null until ACKNOWLEDGED" }
      - { name: waived_reason, type: string, source: input, description: "Reason recorded when GC waives the acknowledgment" }

  - name: Bid
    parent: BidPackage
    common_fields: true
    fields:
      - { name: bid_package_id, type: string, source: input, description: "FK -> BidPackage.id" }
      - { name: subcontractor_id, type: string, source: system, description: "FK -> Subcontractor.id; set from caller X-User-ID (role Subcontractor)" }
      - { name: base_bid_cents, type: integer, source: input, description: "Current lump-sum base bid, integer cents > 0; mutated by revisions" }
      - { name: bond_amount_cents, type: integer, source: input, description: "Submitted bid bond amount, integer cents >= 0; fixed at submission" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical submission timestamp" }
      - { name: addendum_ack_complete, type: boolean, source: computed, description: "True iff no PENDING AddendumAcknowledgment exists for (this bid's package, this bid's subcontractor)" }
      - { name: disqualification_reason, type: enum, source: system, description: "MISSING_ADDENDUM_ACK | PREQUAL_LAPSED; set when DISQUALIFIED at tabulation; null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | AWARDED | NOT_AWARDED | DISQUALIFIED | WITHDRAWN" }

  - name: BidRevision
    parent: Bid
    common_fields: false
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> Bid.id" }
      - { name: sequence, type: integer, source: system, description: "Per-bid sequence, 1 for the initial submission, +1 per revision" }
      - { name: amount_cents, type: integer, source: input, description: "New base bid amount carried by this revision (initial row: original base_bid_cents)" }
      - { name: note, type: string, source: input, description: "Optional revision note (last-minute phone-in reference etc.)" }
      - { name: is_last_minute, type: boolean, source: computed, description: "True iff (bid_due_at - revised_at) <= 60 minutes (inclusive)" }
      - { name: revised_at, type: datetime, source: system, description: "Logical time the revision was recorded" }

  - name: LevelingAdjustment
    parent: Bid
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: input, description: "FK -> Bid.id" }
      - { name: description, type: string, source: input, description: "Scope line being leveled, e.g. ' excludes temp bracing'" }
      - { name: treatment, type: enum, source: input, description: "GC_ALLOWANCE | SUB_QUOTE | EXCLUDED_SCOPE" }
      - { name: amount_cents, type: integer, source: input, description: "Absolute adjustment in cents (may be negative); exactly one of amount_cents / pct_of_base required" }
      - { name: pct_of_base, type: number, source: input, description: "Fraction of the bid's base_bid_cents (e.g. 0.025); exactly one of amount_cents / pct_of_base required" }
      - { name: resolved_amount_cents, type: integer, source: computed, description: "amount_cents as given, or round_half_up(base_bid_cents * pct_of_base) to integer cents; 0 contribution when treatment = EXCLUDED_SCOPE" }

  - name: PostBidInterview
    parent: Bid
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: input, description: "FK -> Bid.id" }
      - { name: interview_room, type: string, source: input, description: "Room identifier whose occupancy the interview blocks" }
      - { name: scheduled_start, type: datetime, source: input, description: "Interview start (ISO 8601 UTC); must be < scheduled_end" }
      - { name: scheduled_end, type: datetime, source: input, description: "Interview end (ISO 8601 UTC)" }
      - { name: outcome_notes, type: string, source: input, description: "Notes recorded when the interview is completed" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | HELD" }

  - name: AwardRecommendation
    parent: BidPackage
    common_fields: true
    fields:
      - { name: bid_package_id, type: string, source: input, description: "FK -> BidPackage.id" }
      - { name: recommended_bid_id, type: string, source: input, description: "FK -> Bid.id; must reference a SUBMITTED bid of this package" }
      - { name: rationale, type: string, source: input, description: "Award rationale (scope coverage, leveling outcome, interview result)" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the LeadEstimator who drafted the recommendation" }
      - { name: decision_notes, type: string, source: input, description: "ChiefEstimator notes at decision; required when decision = RETURNED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of the deciding ChiefEstimator; null until decided" }
      - { name: decided_at, type: datetime, source: system, description: "Logical decision timestamp; null until decided" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | RETURNED" }

  - name: BidderFeedback
    parent: Bid
    common_fields: true
    fields:
      - { name: bid_id, type: string, source: system, description: "FK -> Bid.id; the unsuccessful bid this feedback belongs to" }
      - { name: leveled_rank, type: integer, source: system, description: "Rank of the bid by leveled_amount_cents ASC among compliant bids (tie: submitted_at ASC, then created_at ASC), snapshotted at award" }
      - { name: leveled_amount_cents, type: integer, source: system, description: "Leveled amount of the unsuccessful bid, snapshotted at award" }
      - { name: winning_leveled_amount_cents, type: integer, source: system, description: "Leveled amount of the awarded bid, snapshotted at award" }
      - { name: notes, type: string, source: input, description: "Feedback narrative sent to the bidder" }
      - { name: sent_at, type: datetime, source: system, description: "Logical send timestamp; null until SENT" }
      - { name: status, type: enum, source: system, description: "DRAFT | SENT" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: BidPackage
    initial_state: DRAFT
    terminal_states: [AWARDED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: POST /bid-packages/{id}/publish
        actor: LeadEstimator
        preconditions:
          - "At least one Invitation exists for the package (ERR_NO_INVITED_BIDDERS)"
          - "logical now < bid_due_at (ERR_BID_DEADLINE_PASSED)"
        side_effects: []
      - from: PUBLISHED
        to: BIDDING_CLOSED
        trigger: POST /bid-packages/{id}/close-bidding
        actor: LeadEstimator
        preconditions:
          - "logical now >= bid_due_at (ERR_BID_DEADLINE_NOT_REACHED)"
        side_effects: []
      - from: BIDDING_CLOSED
        to: TABULATED
        trigger: POST /bid-packages/{id}/tabulate
        actor: LeadEstimator
        preconditions:
          - "Compliant-bid set non-empty after in-memory eligibility evaluation, else the whole call fails with ERR_NO_COMPLIANT_BIDS and no state changes"
        side_effects:
          - "Each Bid still SUBMITTED: if any PENDING AddendumAcknowledgment exists for (package, bid.subcontractor_id) -> DISQUALIFIED with disqualification_reason MISSING_ADDENDUM_ACK; else if its subcontractor has no PrequalApplication APPROVED with expires_at > now -> DISQUALIFIED with reason PREQUAL_LAPSED; ack check runs first when both apply"
          - "bid_tabulation_ranking runs over remaining SUBMITTED bids: sets apparent_low_bid_id, leveled_low_bid_id, compliant_bid_count"
      - from: TABULATED
        to: TABULATED
        trigger: POST /bid-packages/{id}/tabulate (re-tabulation after leveling edits)
        actor: LeadEstimator
        preconditions:
          - "At least one Bid still SUBMITTED (DISQUALIFIED is terminal; re-tabulation never resurrects)"
        side_effects:
          - "Re-run bid_tabulation_ranking over SUBMITTED bids; apparent_low_bid_id / leveled_low_bid_id / compliant_bid_count refreshed"
      - from: TABULATED
        to: RECOMMENDATION_PENDING
        trigger: system (when an AwardRecommendation for this package transitions DRAFT -> SUBMITTED)
        actor: system
        preconditions: []
        side_effects:
          - "Leveling adjustments on all bids of the package become locked (ERR_LEVELING_LOCKED)"
      - from: RECOMMENDATION_PENDING
        to: TABULATED
        trigger: system (when the active AwardRecommendation transitions SUBMITTED -> RETURNED)
        actor: system
        preconditions: []
        side_effects:
          - "Leveling adjustments unlocked; apparent_low_bid_id / leveled_low_bid_id retained from last tabulation"
      - from: RECOMMENDATION_PENDING
        to: AWARDED
        trigger: system (when the active AwardRecommendation transitions SUBMITTED -> APPROVED)
        actor: system
        preconditions: []
        side_effects:
          - "Recommended Bid -> AWARDED; every other Bid still SUBMITTED -> NOT_AWARDED"
          - "For each Bid that became NOT_AWARDED: create BidderFeedback DRAFT (leveled_rank, leveled_amount_cents, winning_leveled_amount_cents snapshotted)"

  - entity: PrequalApplication
    initial_state: SUBMITTED
    terminal_states: [EXPIRED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /prequal-applications/{id}/decision with decision=APPROVED
        actor: PrequalReviewer
        preconditions:
          - "verified_annual_revenue_cents, verified_emr, verified_bonding_capacity_cents all present (ERR_INVALID_REQUEST)"
          - "verified_score >= 70 (ERR_PREQUAL_SCORE_BELOW_THRESHOLD)"
        side_effects:
          - "verified_score computed (verified variant); approved_at = now; expires_at = now + 365 days"
          - "Subcontractor.current_prequal_status recomputed"
      - from: SUBMITTED
        to: REJECTED
        trigger: POST /prequal-applications/{id}/decision with decision=REJECTED
        actor: PrequalReviewer
        preconditions: []
        side_effects:
          - "verified_score computed if all verified_* inputs present; Subcontractor.current_prequal_status recomputed"
      - from: REJECTED
        to: SUBMITTED
        trigger: POST /prequal-applications/{id}/resubmit
        actor: Subcontractor
        preconditions:
          - "No other application for this subcontractor in SUBMITTED, or APPROVED with expires_at > now (ERR_PREQUAL_WINDOW_OVERLAP)"
        side_effects:
          - "self_reported_score recomputed from the new declared_* inputs; verified_* / verified_score cleared to null"
          - "Subcontractor.current_prequal_status recomputed"
      - from: APPROVED
        to: EXPIRED
        trigger: "system (lazy expiry: applied whenever the application is read or consulted for a prequal check and logical now >= expires_at)"
        actor: system
        preconditions: []
        side_effects:
          - "Subcontractor.current_prequal_status recomputed"

  - entity: Invitation
    initial_state: SENT
    terminal_states: []
    transitions:
      - from: SENT
        to: BIDDING
        trigger: POST /invitations/{id}/respond with intent=BIDDING
        actor: Subcontractor
        preconditions:
          - "invitation.subcontractor_id == caller X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "responded_at = now"
      - from: SENT
        to: DECLINED
        trigger: POST /invitations/{id}/respond with intent=DECLINED
        actor: Subcontractor
        preconditions:
          - "invitation.subcontractor_id == caller X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "responded_at = now"
      - from: BIDDING
        to: DECLINED
        trigger: POST /invitations/{id}/respond with intent=DECLINED
        actor: Subcontractor
        preconditions:
          - "invitation.subcontractor_id == caller X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
        side_effects:
          - "responded_at = now"
          - "Every PENDING AddendumAcknowledgment for (this package's addenda, this subcontractor) -> WAIVED with waived_reason 'bidder declined'"
      - from: DECLINED
        to: BIDDING
        trigger: POST /invitations/{id}/respond with intent=BIDDING (reconsider)
        actor: Subcontractor
        preconditions:
          - "invitation.subcontractor_id == caller X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
          - "Package in PUBLISHED (ERR_PACKAGE_NOT_ACCEPTING_BIDS)"
        side_effects:
          - "responded_at = now"
          - "For each Addendum of the package lacking an AddendumAcknowledgment in {PENDING, ACKNOWLEDGED} for this subcontractor: create a PENDING acknowledgment (earlier WAIVED rows are retained as audit)"

  - entity: AddendumAcknowledgment
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, WAIVED]
    transitions:
      - from: PENDING
        to: ACKNOWLEDGED
        trigger: POST /addendums/{id}/acknowledge
        actor: Subcontractor
        preconditions:
          - "A PENDING acknowledgment exists for (addendum, caller's subcontractor id), else ERR_ACKNOWLEDGMENT_NOT_FOUND"
          - "Package in {PUBLISHED, BIDDING_CLOSED} (ERR_PACKAGE_INVALID_STATE)"
        side_effects:
          - "acknowledged_at = now; addendum_ack_complete recomputed on that subcontractor's SUBMITTED bids of the package"
      - from: PENDING
        to: WAIVED
        trigger: POST /addendums/{id}/waive
        actor: LeadEstimator
        preconditions:
          - "A PENDING acknowledgment exists for (addendum, input subcontractor_id), else ERR_ACKNOWLEDGMENT_NOT_FOUND"
          - "Package in {PUBLISHED, BIDDING_CLOSED} (ERR_PACKAGE_INVALID_STATE)"
        side_effects:
          - "waived_reason recorded; addendum_ack_complete recomputed on that subcontractor's SUBMITTED bids"
      - from: PENDING
        to: WAIVED
        trigger: system (when the subcontractor's Invitation transitions to DECLINED)
        actor: system
        preconditions: []
        side_effects:
          - "waived_reason = 'bidder declined'; addendum_ack_complete recomputed on affected SUBMITTED bids"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [AWARDED, NOT_AWARDED, DISQUALIFIED, WITHDRAWN]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: POST /bids (creation is submission; no draft state)
        actor: Subcontractor
        preconditions:
          - "Package PUBLISHED (ERR_PACKAGE_NOT_ACCEPTING_BIDS)"
          - "Caller's Invitation for the package has status BIDDING (ERR_INVITATION_NOT_BIDDING)"
          - "No other non-terminal Bid (status SUBMITTED) exists for (package, caller) (ERR_DUPLICATE_BID)"
          - "Caller has a PrequalApplication APPROVED with expires_at > now (ERR_PREQUAL_NOT_APPROVED)"
          - "logical now < package.bid_due_at (ERR_BID_DEADLINE_PASSED)"
          - "bond_amount_cents >= required_bid_bond(base_bid_cents, package.bid_bond_required_pct) (ERR_BID_BOND_INSUFFICIENT)"
        side_effects:
          - "submitted_at = now; BidRevision sequence=1 created (is_last_minute computed)"
          - "Package.submitted_bid_count += 1; Bid.version starts at 1"
      - from: SUBMITTED
        to: SUBMITTED
        trigger: POST /bids/{id}/revisions (amount change; status unchanged)
        actor: Subcontractor
        preconditions:
          - "bid.subcontractor_id == caller X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
          - "Package PUBLISHED (ERR_PACKAGE_NOT_ACCEPTING_BIDS)"
          - "logical now < package.bid_due_at (ERR_BID_DEADLINE_PASSED)"
          - "bond_amount_cents >= required_bid_bond(new_base_bid_cents, pct) (ERR_BID_BOND_INSUFFICIENT)"
          - "expected_bid_version == bid.version (ERR_STALE_VERSION)"
        side_effects:
          - "base_bid_cents = new_base_bid_cents; Bid.version += 1"
          - "BidRevision appended (sequence = max+1, is_last_minute = (bid_due_at - now) <= 60 minutes)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /bids/{id}/withdraw
        actor: Subcontractor
        preconditions:
          - "bid.subcontractor_id == caller X-User-ID (ERR_FORBIDDEN_OWNERSHIP)"
          - "Package PUBLISHED (ERR_PACKAGE_NOT_ACCEPTING_BIDS)"
        side_effects:
          - "Package.submitted_bid_count -= 1"
      - from: SUBMITTED
        to: DISQUALIFIED
        trigger: system (tabulation compliance evaluation)
        actor: system
        preconditions: []
        side_effects:
          - "disqualification_reason set (MISSING_ADDENDUM_ACK checked before PREQUAL_LAPSED)"
      - from: SUBMITTED
        to: AWARDED
        trigger: system (award approval; this bid is the recommended bid)
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: NOT_AWARDED
        trigger: system (award approval; this bid is not the recommended bid)
        actor: system
        preconditions: []
        side_effects:
          - "BidderFeedback DRAFT auto-created for this bid"

  - entity: PostBidInterview
    initial_state: SCHEDULED
    terminal_states: [HELD]
    transitions:
      - from: null
        to: SCHEDULED
        trigger: POST /post-bid-interviews
        actor: LeadEstimator
        preconditions:
          - "Package of bid in {TABULATED, RECOMMENDATION_PENDING} (ERR_PACKAGE_INVALID_STATE)"
          - "bid.status == SUBMITTED (ERR_BID_INVALID_STATE)"
          - "scheduled_start < scheduled_end (ERR_INVALID_TIME_RANGE)"
          - "No other SCHEDULED PostBidInterview with same interview_room whose half-open interval [scheduled_start, scheduled_end) overlaps the new one; adjacency (end == start) is allowed (ERR_INTERVIEW_ROOM_OVERLAP)"
        side_effects: []
      - from: SCHEDULED
        to: HELD
        trigger: POST /post-bid-interviews/{id}/complete
        actor: LeadEstimator
        preconditions: []
        side_effects:
          - "outcome_notes recorded; room freed for future overlap checks (HELD no longer blocks)"

  - entity: AwardRecommendation
    initial_state: DRAFT
    terminal_states: [APPROVED, RETURNED]
    transitions:
      - from: null
        to: DRAFT
        trigger: POST /award-recommendations
        actor: LeadEstimator
        preconditions:
          - "Package TABULATED (ERR_PACKAGE_INVALID_STATE)"
          - "recommended_bid_id references a Bid of this package with status SUBMITTED (ERR_RECOMMENDED_BID_INELIGIBLE)"
          - "No other AwardRecommendation for this package in {DRAFT, SUBMITTED} (ERR_ACTIVE_RECOMMENDATION_EXISTS)"
          - "expected_bid_package_version == package.version (ERR_STALE_PACKAGE_VERSION)"
        side_effects:
          - "created_by_user_id = caller X-User-ID; increments BidPackage.version by 1"
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /award-recommendations/{id}/submit
        actor: LeadEstimator
        preconditions: []
        side_effects:
          - "BidPackage TABULATED -> RECOMMENDATION_PENDING (leveling locks)"
      - from: SUBMITTED
        to: APPROVED
        trigger: POST /award-recommendations/{id}/decide with decision=APPROVED
        actor: ChiefEstimator
        preconditions:
          - "caller X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "decided_by_user_id / decided_at set"
          - "BidPackage RECOMMENDATION_PENDING -> AWARDED (bid + feedback cascade per BidPackage machine)"
      - from: SUBMITTED
        to: RETURNED
        trigger: POST /award-recommendations/{id}/decide with decision=RETURNED
        actor: ChiefEstimator
        preconditions:
          - "caller X-User-ID != created_by_user_id (ERR_SOD_VIOLATION)"
          - "decision_notes present (ERR_INVALID_REQUEST)"
        side_effects:
          - "decided_by_user_id / decided_at set"
          - "BidPackage RECOMMENDATION_PENDING -> TABULATED (leveling unlocks; a new DRAFT recommendation may then be created)"

  - entity: BidderFeedback
    initial_state: DRAFT
    terminal_states: [SENT]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: POST /bidder-feedbacks/{id}/send
        actor: LeadEstimator
        preconditions: []
        side_effects:
          - "notes (if supplied) stored; sent_at = now"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: bid-revision-stale-version
    parent_entity: Bid
    write_endpoint: "POST /bids/{id}/revisions"
    occ_field: "expected_bid_version"
    description: |
      A revision posted against a Bid whose version has advanced since the
      caller last read it is rejected. This captures the case where an earlier
      revision has already been recorded (bumping Bid.version) and the current
      writer's view of the bid is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: recommendation-create-stale-package
    parent_entity: BidPackage
    write_endpoint: "POST /award-recommendations"
    occ_field: "expected_bid_package_version"
    description: |
      Creating an AwardRecommendation against a BidPackage whose version has
      advanced since the caller last read it (e.g. a re-tabulation refreshed
      the rankings, or a recommendation draft was just created) is rejected,
      because the recommendation must be based on the latest tabulation state.
    error_id: ERR_STALE_PACKAGE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: prequal_score
    trigger: "self_reported variant at PrequalApplication creation and resubmission; verified variant at decision when all verified_* inputs are present"
    algorithm: weighted_scoring
    formula: |
      component(revenue_cents, ref_cents)  = round2_half_up(min(100, revenue_cents / ref_cents * 100))
      safety_component(emr)                = 100.00                       if emr <= EMR_FLOOR
                                           = 0.00                         if emr >= EMR_CEILING
                                           = round2_half_up(100 - (emr - EMR_FLOOR) * 200)   otherwise
      bonding_component(cap_cents)         = round2_half_up(min(100, cap_cents / BONDING_REFERENCE_CENTS * 100))
      financial_component(rev_cents)       = component(rev_cents, REVENUE_REFERENCE_CENTS)
      score = round2_half_up(W_FINANCIAL * financial + W_SAFETY * safety + W_BONDING * bonding)
      Components are individually rounded to 2 decimal places (half-up) BEFORE
      weighting; the weighted sum is then rounded to 2 decimal places (half-up).
    input_set: "the application's declared_* (self_reported) or verified_* (verified) inputs"
    constants:
      W_FINANCIAL: 0.40
      W_SAFETY: 0.35
      W_BONDING: 0.25
      REVENUE_REFERENCE_CENTS: 5000000000
      BONDING_REFERENCE_CENTS: 2000000000
      EMR_FLOOR: 0.70
      EMR_CEILING: 1.20
      EMR_HARD_FAIL: 1.25
      PREQUAL_PASS_THRESHOLD: 70
    precision: "components 2 decimal places round_half_up, then weighted total 2 decimal places round_half_up"
    variants:
      - name: self_reported
        when: "computed at submission and resubmission from declared_* inputs"
        difference: "uses declared_annual_revenue_cents / declared_emr / declared_bonding_capacity_cents; no hard-fail rule"
      - name: verified
        when: "computed at reviewer decision from verified_* inputs"
        difference: "uses verified_* inputs; additionally if verified_emr >= EMR_HARD_FAIL then verified_score is forced to 0.00 regardless of other components"

  - name: leveled_bid_amount
    trigger: "on leveling-sheet read, and during bid_tabulation_ranking for every compliant bid"
    algorithm: aggregation
    formula: |
      For each LevelingAdjustment of the bid, resolve to integer cents FIRST:
        resolved = adjustment.amount_cents                                  (amount_cents given)
                 = round_half_up_to_integer_cents(bid.base_bid_cents * adjustment.pct_of_base)   (pct_of_base given)
      leveled_amount_cents = bid.base_bid_cents
                           + SUM(resolved for adjustments with treatment in {GC_ALLOWANCE, SUB_QUOTE})
      EXCLUDED_SCOPE adjustments contribute 0 but set has_exclusions = true.
      ROUNDING ORDER IS PINNED: each pct_of_base adjustment is rounded to
      integer cents individually, THEN summed. (Sum-then-round is rejected.)
    input_set: "all LevelingAdjustment rows of the bid (any treatment); base_bid_cents of the bid"
    constants: {}
    precision: "integer cents; per-adjustment round_half_up before summation"

  - name: required_bid_bond
    trigger: "POST /bids and POST /bids/{id}/revisions (bond sufficiency check)"
    algorithm: threshold
    formula: |
      required_bond_cents = round_half_up_to_integer_cents(base_bid_cents * package.bid_bond_required_pct)
      sufficient iff bond_amount_cents >= required_bond_cents
      (equality passes; one cent short fails)
    input_set: "the bid's base (or revised) amount and the package's bid_bond_required_pct"
    constants:
      DEFAULT_BOND_PCT: 0.05
    precision: "integer cents, round_half_up on the product"

  - name: bid_tabulation_ranking
    trigger: "POST /bid-packages/{id}/tabulate (initial and re-tabulation)"
    algorithm: aggregation
    formula: |
      eligible = bids of the package with status SUBMITTED after compliance evaluation
      apparent_low_bid = argmin(base_bid_cents) over eligible
      leveled_low_bid  = argmin(leveled_bid_amount) over eligible
      tie-break (both): earlier submitted_at wins; further tie: earlier created_at wins.
      compliant_bid_count = |eligible|; if |eligible| == 0 the tabulate call
      fails with ERR_NO_COMPLIANT_BIDS and no state changes are applied.
      leveled_rank(bid) = 1-based position of the bid in the leveled ordering
      (same tie-break); snapshotted onto BidderFeedback rows at award.
    input_set: "bids of the package in status SUBMITTED only (WITHDRAWN, DISQUALIFIED, AWARDED, NOT_AWARDED excluded)"
    constants: {}
    precision: "integer cents comparisons"
    variants:
      - name: apparent_low
        when: "ranking key = base_bid_cents (raw bid-day number)"
        difference: "ignores leveling adjustments; the bid-day apparent winner"
      - name: leveled_low
        when: "ranking key = leveled_amount_cents (base + leveling adjustments)"
        difference: "includes leveling; may select a different winner than apparent_low for the identical bid set"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path and body-referenced resource ids exist, validated left-to-right (path first, then body FKs in input order)"
    error_id: "ERR_BID_PACKAGE_NOT_FOUND | ERR_SUBCONTRACTOR_NOT_FOUND | ERR_PREQUAL_APPLICATION_NOT_FOUND | ERR_INVITATION_NOT_FOUND | ERR_ADDENDUM_NOT_FOUND | ERR_BID_NOT_FOUND | ERR_RESOURCE_NOT_FOUND (leveling adjustments, interviews, recommendations, feedbacks, acknowledgments)"
    http_status: 404
    applies_to: "all endpoints with resource ids"
  - priority: 4
    category: auth
    check: "Ownership scope: role Subcontractor may only act on / read rows owned by caller X-User-ID (Invitation.subcontractor_id, Bid.subcontractor_id, acknowledgment via subcontractor_id, feedback via its bid's subcontractor_id, PrequalApplication.subcontractor_id on create/resubmit/read); Subcontractor list endpoints return only own rows; BidderFeedback rows in DRAFT are never visible to Subcontractor"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "Subcontractor-accessible endpoints"
  - priority: 5
    category: state
    check: "Target resource is in a from-state permitted for the trigger (per-machine: ERR_PACKAGE_INVALID_STATE, ERR_INVITATION_INVALID_STATE, ERR_APPLICATION_INVALID_STATE, ERR_BID_INVALID_STATE, ERR_INVALID_RESOURCE_STATE for acknowledgment/interview/recommendation/feedback; ERR_PACKAGE_NOT_ACCEPTING_BIDS when a bid-write or plan-room or reconsider operation requires PUBLISHED; ERR_LEVELING_LOCKED when leveling writes occur outside package states {BIDDING_CLOSED, TABULATED})"
    error_id: "ERR_PACKAGE_INVALID_STATE | ERR_INVITATION_INVALID_STATE | ERR_APPLICATION_INVALID_STATE | ERR_BID_INVALID_STATE | ERR_INVALID_RESOURCE_STATE | ERR_PACKAGE_NOT_ACCEPTING_BIDS | ERR_LEVELING_LOCKED"
    http_status: 409
    applies_to: "state-transition and state-gated write endpoints"
  - priority: 6
    category: business_safety
    check: "Compliance gates: (a) bid creation requires caller's PrequalApplication APPROVED with expires_at > now (lazy expiry applied first); (b) award decision segregation of duties: caller X-User-ID != recommendation.created_by_user_id"
    error_id: "ERR_PREQUAL_NOT_APPROVED | ERR_SOD_VIOLATION"
    http_status: 422
    applies_to: "POST /bids (a); POST /award-recommendations/{id}/decide (b, http 403)"
  - priority: 7
    category: business_constraint
    check: "Uniqueness and eligibility, in per-endpoint order: license_number unique (ERR_DUPLICATE_LICENSE_NUMBER); one Invitation per (package, subcontractor) (ERR_DUPLICATE_INVITATION); publish requires >= 1 invitation (ERR_NO_INVITED_BIDDERS); prequal create/resubmit blocked while another application is SUBMITTED or APPROVED with expires_at > now (ERR_PREQUAL_WINDOW_OVERLAP); one non-terminal bid per (package, subcontractor) (ERR_DUPLICATE_BID); bid creation requires invitation status BIDDING (ERR_INVITATION_NOT_BIDDING); plan-room access requires invitation status in {SENT, BIDDING} (ERR_INVITATION_DECLINED); interview start < end (ERR_INVALID_TIME_RANGE); interview room half-open overlap vs SCHEDULED interviews (ERR_INTERVIEW_ROOM_OVERLAP); recommended bid must be a SUBMITTED bid of the package (ERR_RECOMMENDED_BID_INELIGIBLE); at most one recommendation per package in {DRAFT, SUBMITTED} (ERR_ACTIVE_RECOMMENDATION_EXISTS); tabulate requires a non-empty compliant set (ERR_NO_COMPLIANT_BIDS)"
    error_id: "ERR_DUPLICATE_LICENSE_NUMBER | ERR_DUPLICATE_INVITATION | ERR_NO_INVITED_BIDDERS | ERR_PREQUAL_WINDOW_OVERLAP | ERR_DUPLICATE_BID | ERR_INVITATION_NOT_BIDDING | ERR_INVITATION_DECLINED | ERR_INVALID_TIME_RANGE | ERR_INTERVIEW_ROOM_OVERLAP | ERR_RECOMMENDED_BID_INELIGIBLE | ERR_ACTIVE_RECOMMENDATION_EXISTS | ERR_NO_COMPLIANT_BIDS"
    http_status: 409
    applies_to: "per-check endpoints as listed"
  - priority: 8
    category: business_temporal
    check: "Deadline gates against logical clock: publish requires now < bid_due_at (ERR_BID_DEADLINE_PASSED); bid create / revision require now < bid_due_at, strictly (ERR_BID_DEADLINE_PASSED); close-bidding requires now >= bid_due_at (ERR_BID_DEADLINE_NOT_REACHED)"
    error_id: "ERR_BID_DEADLINE_PASSED | ERR_BID_DEADLINE_NOT_REACHED"
    http_status: 422
    applies_to: "POST /bid-packages/{id}/publish, POST /bids, POST /bids/{id}/revisions, POST /bid-packages/{id}/close-bidding"
  - priority: 9
    category: business_fiscal
    check: "Bid bond sufficiency: bond_amount_cents >= required_bid_bond(amount, package.bid_bond_required_pct)"
    error_id: ERR_BID_BOND_INSUFFICIENT
    http_status: 402
    applies_to: "POST /bids, POST /bids/{id}/revisions"
  - priority: 10
    category: business_constraint
    check: "Payload shape: required fields present, enum values valid, numeric ranges honored (base_bid_cents > 0, bond_amount_cents >= 0, 0 < bid_bond_required_pct <= 0.20, exactly one of amount_cents / pct_of_base on leveling adjustments, decision / intent / treatment enum membership), read-only or computed fields rejected when supplied"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"
    note: "Schema-level rejection; fired last so domain errors win over malformed-but-parseable payloads that also violate business rules. When the payload fails schema parsing outright (missing required field, wrong type), this fires immediately after priority 1-2 checks."

# =============================================================================
# 1.5 API Endpoint Table (flat collections; reverse reads per FK)
# =============================================================================
endpoints:
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock (test-driving). Before any call, the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time.", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["lazy prequal expiry becomes observable on subsequent reads/checks"] }

  - { method: POST, path: "/bid-packages", description: "Create a bid package (DRAFT)", roles: [LeadEstimator], code: 201, input: [name, trade_code, bid_due_at, "bid_bond_required_pct?"], output: BidPackage, side_effects: ["status=DRAFT", "issued_addendum_count=0", "submitted_bid_count=0"] }
  - { method: GET, path: "/bid-packages", description: "List bid packages (paginated, filterable)", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer], code: 200, input: ["status?", "apparent_low_bid_id?", "leveled_low_bid_id?", "limit?", "offset?"], output: "BidPackage[]", side_effects: [] }
  - { method: GET, path: "/bid-packages/{id}", description: "Read a bid package", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer], code: 200, input: [], output: BidPackage, side_effects: [] }
  - { method: POST, path: "/bid-packages/{id}/publish", description: "Publish ITB: DRAFT -> PUBLISHED (invitations become live, plan room opens)", roles: [LeadEstimator], code: 200, input: [], output: BidPackage, side_effects: ["status -> PUBLISHED", "increments BidPackage.version by 1"] }
  - { method: POST, path: "/bid-packages/{id}/close-bidding", description: "Close the bid period: PUBLISHED -> BIDDING_CLOSED (requires now >= bid_due_at)", roles: [LeadEstimator], code: 200, input: [], output: BidPackage, side_effects: ["status -> BIDDING_CLOSED", "increments BidPackage.version by 1"] }
  - { method: POST, path: "/bid-packages/{id}/tabulate", description: "Run bid-day tabulation: compliance sweep + apparent/leveled low ranking; works from BIDDING_CLOSED and re-runs from TABULATED", roles: [LeadEstimator], code: 200, input: [], output: BidPackage, side_effects: ["compliance disqualifications", "apparent_low_bid_id / leveled_low_bid_id / compliant_bid_count set", "status -> TABULATED", "increments BidPackage.version by 1"] }
  - { method: GET, path: "/bid-packages/{id}/award-recommendations", description: "List award recommendations of a package", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer], code: 200, input: ["limit?", "offset?"], output: "AwardRecommendation[]", side_effects: [] }

  - { method: POST, path: "/subcontractors", description: "Self-register a subcontractor firm", roles: [Anonymous], code: 201, input: [legal_name, contact_email, license_number], output: Subcontractor, side_effects: ["current_prequal_status=NONE"] }
  - { method: GET, path: "/subcontractors", description: "List subcontractors (paginated)", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer], code: 200, input: ["limit?", "offset?"], output: "Subcontractor[]", side_effects: [] }
  - { method: GET, path: "/subcontractors/{id}", description: "Read a subcontractor (Subcontractor may read only own row)", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: [], output: Subcontractor, side_effects: [] }
  - { method: GET, path: "/subcontractors/{id}/acknowledgments", description: "List addendum acknowledgments owed by a subcontractor", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: ["status?", "limit?", "offset?"], output: "AddendumAcknowledgment[]", side_effects: [] }

  - { method: POST, path: "/prequal-applications", description: "Submit a prequalification application (self-reported financials/safety/bonding)", roles: [Subcontractor], code: 201, input: [subcontractor_id, declared_annual_revenue_cents, declared_emr, declared_bonding_capacity_cents], output: PrequalApplication, side_effects: ["status=SUBMITTED", "self_reported_score computed (self_reported variant)"] }
  - { method: GET, path: "/prequal-applications", description: "List prequal applications (Subcontractor sees only own)", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: ["subcontractor_id?", "status?", "limit?", "offset?"], output: "PrequalApplication[]", side_effects: ["lazy expiry to EXPIRED applied on read"] }
  - { method: GET, path: "/prequal-applications/{id}", description: "Read a prequal application", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: [], output: PrequalApplication, side_effects: ["lazy expiry to EXPIRED applied on read"] }
  - { method: POST, path: "/prequal-applications/{id}/decision", description: "Reviewer decision: APPROVED (requires verified_* inputs and verified_score >= 70) or REJECTED", roles: [PrequalReviewer], code: 200, input: [decision, "verified_annual_revenue_cents?", "verified_emr?", "verified_bonding_capacity_cents?", "review_notes?"], output: PrequalApplication, side_effects: ["verified_score computed (verified variant) when verified_* present", "APPROVED: approved_at/expires_at set", "Subcontractor.current_prequal_status recomputed"] }
  - { method: POST, path: "/prequal-applications/{id}/resubmit", description: "Resubmit a REJECTED application with updated declared inputs", roles: [Subcontractor], code: 200, input: [declared_annual_revenue_cents, declared_emr, declared_bonding_capacity_cents], output: PrequalApplication, side_effects: ["status -> SUBMITTED", "self_reported_score recomputed", "verified_* cleared"] }

  - { method: POST, path: "/invitations", description: "Invite a subcontractor to a bid package (allowed while package is DRAFT or PUBLISHED)", roles: [LeadEstimator], code: 201, input: [bid_package_id, subcontractor_id], output: Invitation, side_effects: ["status=SENT"] }
  - { method: GET, path: "/invitations", description: "List invitations (Subcontractor sees only own)", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: ["bid_package_id?", "subcontractor_id?", "status?", "limit?", "offset?"], output: "Invitation[]", side_effects: [] }
  - { method: GET, path: "/invitations/{id}", description: "Read an invitation", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: [], output: Invitation, side_effects: [] }
  - { method: POST, path: "/invitations/{id}/respond", description: "Respond to an invitation: intent BIDDING or DECLINED (DECLINED -> BIDDING reconsider allowed while package PUBLISHED)", roles: [Subcontractor], code: 200, input: [intent], output: Invitation, side_effects: ["responded_at set", "BIDDING -> DECLINED: PENDING acknowledgments -> WAIVED", "DECLINED -> BIDDING: missing PENDING acknowledgments re-created"] }
  - { method: POST, path: "/invitations/{id}/plan-room-access", description: "Record a plan-room access by the invited subcontractor (requires package PUBLISHED, invitation not DECLINED)", roles: [Subcontractor], code: 200, input: [], output: Invitation, side_effects: ["first_plan_room_access_at set once", "plan_room_access_count += 1"] }

  - { method: POST, path: "/addendums", description: "Issue an addendum to a PUBLISHED package; cascades PENDING acknowledgments to all non-DECLINED invitees and flags affected SUBMITTED bids", roles: [LeadEstimator], code: 201, input: [bid_package_id, summary], output: Addendum, side_effects: ["number = max existing + 1", "issued_at = now", "AddendumAcknowledgment PENDING created per Invitation in {SENT, BIDDING}", "each affected subcontractor's SUBMITTED bids: addendum_ack_complete recomputed to false", "BidPackage.issued_addendum_count += 1"] }
  - { method: GET, path: "/addendums", description: "List addenda", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: ["bid_package_id?", "limit?", "offset?"], output: "Addendum[]", side_effects: [] }
  - { method: GET, path: "/addendums/{id}", description: "Read an addendum", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: [], output: Addendum, side_effects: [] }
  - { method: GET, path: "/addendums/{id}/acknowledgments", description: "List acknowledgments for an addendum", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: ["status?", "subcontractor_id?", "limit?", "offset?"], output: "AddendumAcknowledgment[]", side_effects: [] }
  - { method: POST, path: "/addendums/{id}/acknowledge", description: "Acknowledge an addendum as the invited subcontractor (resolves the caller's PENDING acknowledgment)", roles: [Subcontractor], code: 200, input: [], output: AddendumAcknowledgment, side_effects: ["PENDING -> ACKNOWLEDGED", "acknowledged_at = now", "addendum_ack_complete recomputed on caller's SUBMITTED bids of the package"] }
  - { method: POST, path: "/addendums/{id}/waive", description: "Waive a subcontractor's PENDING acknowledgment for an addendum", roles: [LeadEstimator], code: 200, input: [subcontractor_id, "reason?"], output: AddendumAcknowledgment, side_effects: ["PENDING -> WAIVED", "addendum_ack_complete recomputed"] }

  - { method: POST, path: "/bids", description: "Submit a bid (creation IS submission; compliance checks run here)", roles: [Subcontractor], code: 201, input: [bid_package_id, base_bid_cents, bond_amount_cents], output: Bid, side_effects: ["status=SUBMITTED", "submitted_at = now", "BidRevision sequence=1 created", "Package.submitted_bid_count += 1"] }
  - { method: GET, path: "/bids", description: "List bids (Subcontractor sees only own)", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: ["bid_package_id?", "subcontractor_id?", "status?", "limit?", "offset?"], output: "Bid[]", side_effects: [] }
  - { method: GET, path: "/bids/{id}", description: "Read a bid", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: [], output: Bid, side_effects: [] }
  - { method: POST, path: "/bids/{id}/revisions", description: "Record a bid-amount revision (last-minute handling: flagged when within 60 minutes of the deadline); OCC via expected_bid_version", roles: [Subcontractor], code: 200, input: [new_base_bid_cents, expected_bid_version, "note?"], output: Bid, side_effects: ["base_bid_cents updated", "increments Bid.version by 1", "BidRevision appended with is_last_minute flag"] }
  - { method: GET, path: "/bids/{id}/revisions", description: "List a bid's revision audit trail in sequence order", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer, Subcontractor], code: 200, input: ["limit?", "offset?"], output: "BidRevision[]", side_effects: [] }
  - { method: POST, path: "/bids/{id}/withdraw", description: "Withdraw a SUBMITTED bid while the package is PUBLISHED", roles: [Subcontractor], code: 200, input: [], output: Bid, side_effects: ["status -> WITHDRAWN", "Package.submitted_bid_count -= 1"] }
  - { method: GET, path: "/bids/{id}/leveling-sheet", description: "Computed leveling sheet: base, adjustments with resolved amounts, leveled total, exclusion flag, compliance summary", roles: [LeadEstimator, ChiefEstimator], code: 200, input: [], output: { bid_id: string, base_bid_cents: integer, adjustments: array, leveled_amount_cents: integer, has_exclusions: boolean, pending_addendum_ack_count: integer, is_compliant: boolean }, side_effects: [] }
  - { method: GET, path: "/bids/{id}/leveling-adjustments", description: "List leveling adjustments of a bid", roles: [LeadEstimator, ChiefEstimator], code: 200, input: ["limit?", "offset?"], output: "LevelingAdjustment[]", side_effects: [] }
  - { method: GET, path: "/bids/{id}/post-bid-interviews", description: "List post-bid interviews for a bid", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer], code: 200, input: ["limit?", "offset?"], output: "PostBidInterview[]", side_effects: [] }
  - { method: GET, path: "/bids/{id}/award-recommendations", description: "List award recommendations referencing a bid", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer], code: 200, input: ["limit?", "offset?"], output: "AwardRecommendation[]", side_effects: [] }
  - { method: GET, path: "/bids/{id}/bidder-feedbacks", description: "List feedback records for a bid (Subcontractor sees only SENT rows of own bids)", roles: [LeadEstimator, ChiefEstimator, Subcontractor], code: 200, input: ["limit?", "offset?"], output: "BidderFeedback[]", side_effects: [] }

  - { method: POST, path: "/leveling-adjustments", description: "Add a leveling adjustment (exclusion or priced clarification) to a SUBMITTED bid while package is BIDDING_CLOSED or TABULATED", roles: [LeadEstimator], code: 201, input: [bid_id, description, treatment, "amount_cents?", "pct_of_base?"], output: LevelingAdjustment, side_effects: ["resolved_amount_cents computed (per-adjustment rounding)"] }
  - { method: PATCH, path: "/leveling-adjustments/{id}", description: "Edit a leveling adjustment while leveling is unlocked", roles: [LeadEstimator], code: 200, input: ["description?", "treatment?", "amount_cents?", "pct_of_base?"], output: LevelingAdjustment, side_effects: ["resolved_amount_cents recomputed"] }
  - { method: DELETE, path: "/leveling-adjustments/{id}", description: "Delete a leveling adjustment while leveling is unlocked", roles: [LeadEstimator], code: 204, input: [], output: null, side_effects: ["bid leveled total restored by removal"] }

  - { method: POST, path: "/post-bid-interviews", description: "Schedule a post-bid interview; same-room half-open overlap with SCHEDULED interviews is rejected", roles: [LeadEstimator], code: 201, input: [bid_id, interview_room, scheduled_start, scheduled_end], output: PostBidInterview, side_effects: ["status=SCHEDULED"] }
  - { method: POST, path: "/post-bid-interviews/{id}/complete", description: "Mark an interview held and record outcome notes", roles: [LeadEstimator], code: 200, input: [outcome_notes], output: PostBidInterview, side_effects: ["status -> HELD"] }

  - { method: POST, path: "/award-recommendations", description: "Draft an award recommendation for a TABULATED package; OCC via expected_bid_package_version", roles: [LeadEstimator], code: 201, input: [bid_package_id, recommended_bid_id, rationale, expected_bid_package_version], output: AwardRecommendation, side_effects: ["status=DRAFT", "created_by_user_id = caller", "increments BidPackage.version by 1"] }
  - { method: GET, path: "/award-recommendations/{id}", description: "Read an award recommendation", roles: [LeadEstimator, ChiefEstimator, PrequalReviewer], code: 200, input: [], output: AwardRecommendation, side_effects: [] }
  - { method: POST, path: "/award-recommendations/{id}/submit", description: "Submit a DRAFT recommendation; package moves to RECOMMENDATION_PENDING and leveling locks", roles: [LeadEstimator], code: 200, input: [], output: AwardRecommendation, side_effects: ["status -> SUBMITTED", "BidPackage -> RECOMMENDATION_PENDING", "increments BidPackage.version by 1"] }
  - { method: POST, path: "/award-recommendations/{id}/decide", description: "ChiefEstimator decision: APPROVED (award cascade) or RETURNED (package back to TABULATED); SoD enforced", roles: [ChiefEstimator], code: 200, input: [decision, "decision_notes?"], output: AwardRecommendation, side_effects: ["APPROVED: package -> AWARDED, recommended bid -> AWARDED, other SUBMITTED bids -> NOT_AWARDED, BidderFeedback DRAFT created per NOT_AWARDED bid", "RETURNED: package -> TABULATED"] }

  - { method: POST, path: "/bidder-feedbacks/{id}/send", description: "Send a DRAFT feedback record to the unsuccessful bidder", roles: [LeadEstimator], code: 200, input: ["notes?"], output: BidderFeedback, side_effects: ["status -> SENT", "sent_at = now"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, invalid enum value, numeric range violated, exactly-one-of rule broken (amount_cents vs pct_of_base), or computed/read-only field supplied" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role not in the endpoint's roles" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Subcontractor acts on a resource owned by a different subcontractor" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Award decision caller equals recommendation.created_by_user_id (segregation of duties)" }
  - { id: ERR_BID_PACKAGE_NOT_FOUND, http: 404, condition: "Referenced bid package id does not exist" }
  - { id: ERR_SUBCONTRACTOR_NOT_FOUND, http: 404, condition: "Referenced subcontractor id does not exist" }
  - { id: ERR_PREQUAL_APPLICATION_NOT_FOUND, http: 404, condition: "Referenced prequal application id does not exist" }
  - { id: ERR_INVITATION_NOT_FOUND, http: 404, condition: "Referenced invitation id does not exist" }
  - { id: ERR_ADDENDUM_NOT_FOUND, http: 404, condition: "Referenced addendum id does not exist" }
  - { id: ERR_BID_NOT_FOUND, http: 404, condition: "Referenced bid id does not exist" }
  - { id: ERR_RESOURCE_NOT_FOUND, http: 404, condition: "Referenced leveling adjustment, interview, recommendation, feedback, or acknowledgment id does not exist" }
  - { id: ERR_PACKAGE_INVALID_STATE, http: 409, condition: "BidPackage not in a from-state permitted for the trigger (incl. addendum issue outside PUBLISHED, tabulate outside {BIDDING_CLOSED, TABULATED}, interview outside {TABULATED, RECOMMENDATION_PENDING}, acknowledge/waive outside {PUBLISHED, BIDDING_CLOSED}, recommendation create/submit outside TABULATED)" }
  - { id: ERR_PACKAGE_NOT_ACCEPTING_BIDS, http: 409, condition: "Bid create/revise/withdraw, plan-room access, or invitation reconsider while package is not PUBLISHED" }
  - { id: ERR_INVITATION_INVALID_STATE, http: 409, condition: "Invitation respond intent does not match a permitted transition from its current status" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Prequal decision on a non-SUBMITTED application, or resubmit of a non-REJECTED application" }
  - { id: ERR_BID_INVALID_STATE, http: 409, condition: "Bid revision/withdraw on a terminal bid, or leveling/interview against a non-SUBMITTED bid" }
  - { id: ERR_INVALID_RESOURCE_STATE, http: 409, condition: "Acknowledgment, interview, recommendation, or feedback not in a from-state permitted for the trigger (e.g. re-send of SENT feedback, complete of HELD interview, submit of non-DRAFT recommendation, decide of non-SUBMITTED recommendation)" }
  - { id: ERR_LEVELING_LOCKED, http: 409, condition: "Leveling adjustment write while the package is in RECOMMENDATION_PENDING or AWARDED (or not yet BIDDING_CLOSED)" }
  - { id: ERR_ACKNOWLEDGMENT_NOT_FOUND, http: 404, condition: "No PENDING acknowledgment exists for (addendum, subcontractor) — never issued, already ACKNOWLEDGED/WAIVED, or wrong subcontractor" }
  - { id: ERR_NO_INVITED_BIDDERS, http: 422, condition: "Publish attempted with zero invitations on the package" }
  - { id: ERR_BID_DEADLINE_PASSED, http: 422, condition: "Publish, bid create, or revision at or after bid_due_at (deadline is strict: now < bid_due_at required)" }
  - { id: ERR_BID_DEADLINE_NOT_REACHED, http: 422, condition: "close-bidding before bid_due_at (now >= bid_due_at required)" }
  - { id: ERR_PREQUAL_NOT_APPROVED, http: 422, condition: "Bid creation without a currently-approved prequalification (APPROVED with expires_at > now)" }
  - { id: ERR_PREQUAL_WINDOW_OVERLAP, http: 409, condition: "Prequal create/resubmit while another application for the subcontractor is SUBMITTED or APPROVED with expires_at > now (validity-window containment)" }
  - { id: ERR_PREQUAL_SCORE_BELOW_THRESHOLD, http: 422, condition: "decision=APPROVED with verified_score < 70 (or forced 0.00 by EMR hard fail)" }
  - { id: ERR_INVITATION_NOT_BIDDING, http: 422, condition: "Bid creation while the caller's invitation is not in BIDDING status" }
  - { id: ERR_INVITATION_DECLINED, http: 409, condition: "Plan-room access on a DECLINED invitation" }
  - { id: ERR_DUPLICATE_BID, http: 409, condition: "A non-terminal (SUBMITTED) bid already exists for (package, subcontractor)" }
  - { id: ERR_DUPLICATE_INVITATION, http: 409, condition: "An invitation already exists for (bid_package_id, subcontractor_id)" }
  - { id: ERR_DUPLICATE_LICENSE_NUMBER, http: 409, condition: "license_number already registered to another subcontractor" }
  - { id: ERR_BID_BOND_INSUFFICIENT, http: 402, condition: "bond_amount_cents < required_bid_bond(amount, required pct)" }
  - { id: ERR_NO_COMPLIANT_BIDS, http: 422, condition: "Tabulation would leave zero compliant SUBMITTED bids" }
  - { id: ERR_RECOMMENDED_BID_INELIGIBLE, http: 422, condition: "recommended_bid_id is not a SUBMITTED bid of the package (or belongs to another package)" }
  - { id: ERR_ACTIVE_RECOMMENDATION_EXISTS, http: 409, condition: "A recommendation in DRAFT or SUBMITTED already exists for the package" }
  - { id: ERR_INTERVIEW_ROOM_OVERLAP, http: 409, condition: "New interview's half-open interval overlaps a SCHEDULED interview in the same room" }
  - { id: ERR_INVALID_TIME_RANGE, http: 422, condition: "scheduled_start >= scheduled_end on interview creation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_bid_version does not match the bid's current version" }
  - { id: ERR_STALE_PACKAGE_VERSION, http: 412, condition: "expected_bid_package_version does not match the package's current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: LeadEstimator
    description: "GC lead estimator: runs the bid event — packages, invitations, addenda, tabulation, leveling, interviews, recommendation drafting, bidder feedback"
    identity: opaque
    exclusive_operations: ["create/publish/close/tabulate bid packages", "create invitations", "issue addenda", "waive acknowledgments", "create/edit/delete leveling adjustments", "schedule/complete post-bid interviews", "create/submit award recommendations", "send bidder feedback"]
    shared_operations: ["read all resources", "set logical clock"]
  - name: ChiefEstimator
    description: "GC chief estimator: award authority; approves or returns award recommendations (must not be the drafter — segregation of duties)"
    identity: opaque
    exclusive_operations: ["decide award recommendations"]
    shared_operations: ["read all resources", "set logical clock"]
  - name: PrequalReviewer
    description: "GC prequalification reviewer: verifies subcontractor financial/safety/bonding data and decides applications"
    identity: opaque
    exclusive_operations: ["decide prequal applications"]
    shared_operations: ["read all resources", "set logical clock"]
  - name: Subcontractor
    description: "Invited bidding firm; acts only on its own invitations, applications, bids, acknowledgments, and feedback"
    identity: "entity_backed:Subcontractor"
    exclusive_operations: ["submit/resubmit prequal applications", "respond to invitations", "plan-room access", "acknowledge addenda", "submit/revise/withdraw own bids"]
    shared_operations: ["read own invitations, addenda of invited packages, own bids/revisions/feedbacks (SENT only), own applications"]
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register a subcontractor firm"
    identity: opaque
    exclusive_operations: ["register subcontractor"]
    shared_operations: []
