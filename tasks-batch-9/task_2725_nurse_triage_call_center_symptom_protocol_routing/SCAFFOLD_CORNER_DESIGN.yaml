            - call: "POST /triage-calls/${call_id}/consent"
              payload: { consent_type: "PATIENT_SELF", consent_given_by: "Dana Reyes" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/assign-nurse"
              payload: { preferred_nurse_id: "${nurse_a_id}" }
              as: IntakeAgent
            - call: "POST /triage-calls/${call_id}/assessments"
              payload: { protocol_id: "${protocol_id}", confirmation_mode: "CONFIRMED", red_flag_count: 0, confirmed_pregnancy_status: "NOT_PREGNANT" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { assessment_id: $.data.id, acuity: $.data.acuity_score }
            - call: "GET /triage-calls/${call_id}"
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { call_version: $.data.version }
          trigger:
            - call: "POST /dispositions"
              payload: { call_id: "${call_id}", assessment_id: "${assessment_id}", final_level: "HOME_CARE", expected_call_version: "${call_version}" }
              as: TriageNurse
              as_user_id: "${nurse_a_id}"
              captures: { disposition_id: $.data.id, recommended: $.data.recommended_level, needs_callback: $.data.requires_callback }
            - call: "GET /callback-tasks?practice_id=${practice_id}&risk_class=NEXT_DAY"
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              captures: { next_day_total: $.total_count, callback_id: "$.data[0].id", risk: "$.data[0].risk_class", due: "$.data[0].due_by_utc", attempts_allowed: "$.data[0].max_attempts" }
          assert:
            - "${after_hours_flag} == true"
            - "${acuity} == 20"
            - "${recommended} == HOME_CARE"
            - "${needs_callback} == true"
            - "${next_day_total} == 1"
            - "${risk} == NEXT_DAY"
            - "${due} == 2026-08-02T13:00:00Z"
            - "${attempts_allowed} == 2"
            - "CallbackTask.${callback_id}.status == PENDING"
            - "CallbackTask.${callback_id}.assigned_nurse_id == ${nurse_a_id}"
            - "CallbackTask.${callback_id}.practice_id == ${practice_id}"
            - "CallbackTask.${callback_id}.attempt_count == 0"
            - "Practice.${practice_id}.open_callback_count == 1"
            - "TriageCall.${call_id}.requires_warm_transfer == false"

