    code: 200
    input: []
    output: EngagementRoleAssignment
    side_effects: []
  - method: POST
    path: "/audit/role-assignments/{id}/end"
    description: "End an assignment and start the rotation clock."
    roles: [EngagementPartner]
    code: 200
    input: []
    output: EngagementRoleAssignment
    side_effects: ["ended_on stamped from the logical clock", "rotation_tenure recomputed; eligible_return_on set from time_off_months_required", "Professional.active_workload_points and Engagement.assigned_workload_points recomputed", "Engagement.lead_partner_id / concurring_partner_id refreshed", "Engagement.version incremented by 1"]
  - method: POST
    path: "/audit/independence-findings"
    description: "Raise an independence finding; OCC-guarded by the engagement version."
    roles: [IndependenceOfficer]
    code: 201
    input: [professional_id, engagement_id, origin, origin_ref_id, finding_type, severity, discovered_on, expected_engagement_version]
    output: IndependenceFinding
    side_effects: ["IndependenceFinding.status defaults to OPEN", "remediation_due_on computed from severity", "Engagement.independence_status recomputed", "Client.open_finding_count recomputed", "Engagement.version incremented by 1"]
  - method: GET
    path: "/audit/independence-findings"
    description: "List findings with filters."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["professional_id?", "engagement_id?", "status?", "severity?", "finding_type?", "origin?", "limit?", "offset?"]
    output: IndependenceFinding[]
    side_effects: []
  - method: GET
    path: "/audit/independence-findings/{id}"
    description: "Read one finding."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: IndependenceFinding
    side_effects: []
  - method: POST
    path: "/audit/independence-findings/{id}/transitions"
    description: "Advance the remediation lifecycle of a finding."
    roles: [IndependenceOfficer]
    code: 200
    input: [action]
    output: IndependenceFinding
    side_effects: ["status advanced per §1.2", "remediation_attempts incremented on FAIL_RETEST", "Engagement.independence_status and Client.open_finding_count recomputed", "Engagement.version incremented by 1"]
  - method: POST
    path: "/audit/independence-threats"
    description: "Declare a personal financial interest or employment relationship."
    roles: [IndependenceOfficer]
    code: 201
    input: [professional_id, client_id, threat_type, "instrument_type?", "relationship_type?", "value_cents?", effective_on]
    output: IndependenceThreat
    side_effects: ["is_material computed via financial_interest_materiality", "cooling_off_end_on computed via cooling_off_window", "status set to IN_COOLING_OFF, CLEARED or MITIGATED per §1.2", "when is_material is true, one CRITICAL IndependenceFinding is created for every engagement of the client whose status is IN {DRAFT, ACCEPTANCE_PENDING, ACTIVE, SUSPENDED}, and Engagement.independence_status is recomputed for each"]
  - method: GET
    path: "/audit/independence-threats"
    description: "List personal independence threats with filters."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["professional_id?", "client_id?", "threat_type?", "status?", "is_material?", "limit?", "offset?"]
    output: IndependenceThreat[]
    side_effects: []
  - method: GET
    path: "/audit/independence-threats/{id}"
    description: "Read one personal independence threat."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: IndependenceThreat
    side_effects: []
  - method: POST
    path: "/audit/independence-threats/{id}/transitions"
    description: "Remediate a personal independence threat."
    roles: [IndependenceOfficer]
    code: 200
    input: [action]
    output: IndependenceThreat
    side_effects: ["status advanced per §1.2", "cleared_on stamped on clearance", "Engagement.independence_status recomputed for every engagement of the client"]
  - method: POST
    path: "/audit/non-audit-services"
    description: "Request a non-audit service engagement."
    roles: [AuditCommitteeLiaison]
    code: 201
    input: [client_id, "engagement_id?", service_category, fee_cents, "committee_resolution_ref?", "approval_expires_on?"]
    output: NonAuditService
    side_effects: ["NonAuditService.status defaults to DRAFT", "is_prohibited_for_pie computed from the category and Client.is_public_interest_entity"]
  - method: GET
    path: "/audit/non-audit-services"
    description: "List non-audit services with filters."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["client_id?", "engagement_id?", "status?", "service_category?", "limit?", "offset?"]
    output: NonAuditService[]
    side_effects: []
  - method: GET
    path: "/audit/non-audit-services/{id}"
    description: "Read one non-audit service."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: NonAuditService
    side_effects: []
  - method: POST
    path: "/audit/non-audit-services/{id}/transitions"
    description: "Advance the pre-approval lifecycle of a non-audit service."
    roles: [AuditCommitteeLiaison, IndependenceOfficer]
    code: 200
    input: [action, "committee_resolution_ref?"]
    output: NonAuditService
    side_effects: ["status advanced per §1.2", "approved_fee_cents and approved_on stamped on APPROVE", "Client.naf_approved_fee_cents recomputed via naf_fee_pool", "Client.aggregate_independence_status and every Engagement.independence_status of the client recomputed", "Client.version incremented by 1"]
  - method: POST
    path: "/audit/affiliate-attestations"
    description: "Open an affiliate independence attestation for an engagement."
    roles: [PlatformAdmin]
    code: 201
    input: [affiliate_id, engagement_id, "breach_count?"]
    output: AffiliateAttestation
    side_effects: ["attestation_status defaults to PENDING"]
  - method: GET
    path: "/audit/affiliate-attestations"
    description: "List affiliate attestations with filters."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["affiliate_id?", "engagement_id?", "attestation_status?", "limit?", "offset?"]
    output: AffiliateAttestation[]
    side_effects: []
  - method: GET
    path: "/audit/affiliate-attestations/{id}"
    description: "Read one affiliate attestation."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: AffiliateAttestation
    side_effects: []
  - method: POST
    path: "/audit/affiliate-attestations/{id}/transitions"
    description: "Advance the attestation lifecycle."
    roles: [IndependenceOfficer]
    code: 200
    input: [action]
    output: AffiliateAttestation
    side_effects: ["status advanced per §1.2", "Affiliate.open_breach_count recomputed", "REPORT_BREACH cascade-creates an IndependenceFinding and recomputes Engagement.independence_status"]
  - method: POST
    path: "/audit/quality-reviews"
    description: "Schedule a quality control review or log a regulatory inspection."
    roles: [QualityReviewer]
    code: 201
    input: [engagement_id, reviewer_id, review_type, "inspection_body?", received_on, due_on, "deficiency_count?", "remediation_plan_ref?"]
    output: QualityReview
    side_effects: ["QualityReview.status defaults to SCHEDULED", "response_due_on computed via inspection_response_due"]
  - method: GET
    path: "/audit/quality-reviews"
    description: "List quality reviews and inspections with filters."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: ["engagement_id?", "reviewer_id?", "status?", "review_type?", "limit?", "offset?"]
    output: QualityReview[]
    side_effects: []
  - method: GET
    path: "/audit/quality-reviews/{id}"
    description: "Read one quality review or inspection."
    roles: [PlatformAdmin, EngagementPartner, ClientAcceptanceCommittee, IndependenceOfficer, AuditCommitteeLiaison, QualityReviewer]
    code: 200
    input: []
    output: QualityReview
    side_effects: []
  - method: POST
    path: "/audit/quality-reviews/{id}/transitions"
    description: "Advance the review or inspection lifecycle."
    roles: [QualityReviewer]
    code: 200
    input: [action]
    output: QualityReview
    side_effects: ["status advanced per §1.2", "Engagement.quality_review_required refreshed on PASS", "Engagement.status set to SUSPENDED when FAIL lands with deficiency_count >= 3"]
  - method: POST
    path: "/audit/_clock/set_current_utc"
    description: "Test-driving logical clock. The server starts at the fixed default 2026-09-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: {current_utc: string}
    side_effects: ["cooling-off windows, decay tiers, rotation clocks and response deadlines are all evaluated against this value"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required field missing, unknown enum member, or numeric range violated (score_impact outside 0..40, negative fee_cents or value_cents)"
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID header absent"
  - id: ERR_UNAUTHORIZED_ROLE
    http: 403
    condition: "X-User-Role is not listed in the endpoint's roles"
  - id: ERR_CLIENT_NOT_FOUND
    http: 404
    condition: "path client id does not exist"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "path engagement id does not exist"
  - id: ERR_ACCEPTANCE_NOT_FOUND
    http: 404
    condition: "path client-acceptance id does not exist"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "path integrity-assessment id does not exist"
  - id: ERR_PROFESSIONAL_NOT_FOUND
    http: 404
    condition: "path professional id does not exist"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "path role-assignment id does not exist"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "path independence-finding id does not exist"
  - id: ERR_THREAT_NOT_FOUND
    http: 404
    condition: "path independence-threat id does not exist"
  - id: ERR_SERVICE_NOT_FOUND
    http: 404
    condition: "path non-audit-service id does not exist"
  - id: ERR_AFFILIATE_NOT_FOUND
    http: 404
    condition: "path affiliate id does not exist"
  - id: ERR_ATTESTATION_NOT_FOUND
    http: 404
    condition: "path affiliate-attestation id does not exist"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "path quality-review id does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign key in the request body does not resolve to an existing row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource's current status has no declared transition for the requested action, or the resource is already terminal"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_engagement_version does not equal Engagement.version at write time"
  - id: ERR_PROHIBITED_SERVICE
    http: 422
    condition: "a non-audit service with is_prohibited_for_pie true is submitted for pre-approval"
  - id: ERR_MATERIAL_INTEREST_CONFLICT
    http: 422
    condition: "the professional holds a material financial interest in the engagement's client"
  - id: ERR_COOLING_OFF_ACTIVE
    http: 422
    condition: "the professional is inside a cooling-off window for the engagement's client"
  - id: ERR_DUPLICATE_ROLE_HOLDER
    http: 409
    condition: "an ACTIVE assignment already exists for the same (engagement_id, role) on a single-holder role"
  - id: ERR_ROLE_ASSIGNMENT_OVERLAP
    http: 409
    condition: "the requested [started_on, scheduled_end_on) interval overlaps an existing assignment on the same (engagement_id, role)"
  - id: ERR_REVIEW_WINDOW_CONFLICT
    http: 409
    condition: "the requested review window is inside the mandatory 5-day buffer after another review of the same reviewer and review_type"
  - id: ERR_ROTATION_LIMIT_REACHED
    http: 422
    condition: "the (professional, client, role) consecutive service run is at or beyond the time-on limit for the client's variant"
  - id: ERR_WORKLOAD_LIMIT_EXCEEDED
    http: 422
    condition: "the resulting active_workload_points would exceed the professional's max_workload_points"
  - id: ERR_REMEDIATION_ATTEMPTS_EXHAUSTED
    http: 422
    condition: "the finding already carries 3 failed re-tests and may not re-enter remediation"
  - id: ERR_ACCEPTANCE_CONDITIONS_UNMET
    http: 422
    condition: "the requested decision is not admissible for the acceptance's combined_risk_score band or unresolved CRITICAL evidence"
  - id: ERR_NAF_CAP_EXCEEDED
    http: 422
    condition: "the whole-dollar-rounded candidate fee would push Client.naf_approved_fee_cents above Client.naf_annual_cap_cents"
  - id: ERR_ASSESSMENT_DATE_IN_FUTURE
    http: 422
    condition: "IntegrityAssessment.assessed_on is later than the logical clock"
  - id: ERR_BACKDATED_ASSIGNMENT
    http: 422
    condition: "EngagementRoleAssignment.started_on is earlier than the logical clock"
  - id: ERR_ENGAGEMENT_FROZEN
    http: 409
    condition: "the engagement's independence_status is FROZEN and the operation would activate, staff or resume it"
  - id: ERR_FINDINGS_OPEN
    http: 409
    condition: "the engagement still has findings in status IN {OPEN, REMEDIATION, RE_TEST, REOPENED}"
  - id: ERR_ATTESTATION_INCOMPLETE
    http: 409
    condition: "a multinational engagement is being activated while an affiliate attestation is still PENDING"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Firm operations administrator; owns reference data (clients, affiliates, professionals) and the logical clock."
    identity: opaque
    exclusive_operations: ["POST /audit/clients", "POST /audit/affiliates", "POST /audit/professionals", "POST /audit/affiliate-attestations", "POST /audit/_clock/set_current_utc"]
    shared_operations: ["GET /audit/clients", "GET /audit/engagements", "GET /audit/professionals", "GET /audit/affiliates", "GET /audit/role-assignments", "GET /audit/independence-findings", "GET /audit/independence-threats", "GET /audit/non-audit-services", "GET /audit/affiliate-attestations", "GET /audit/quality-reviews", "GET /audit/client-acceptances"]
  - name: EngagementPartner
    description: "Signing partner accountable for an engagement; opens engagements, staffs them and closes them."
    identity: entity_backed:Professional
    exclusive_operations: ["POST /audit/engagements", "POST /audit/engagements/{id}/transitions", "POST /audit/role-assignments", "POST /audit/role-assignments/{id}/end"]
    shared_operations: ["GET /audit/engagements", "GET /audit/role-assignments", "GET /audit/professionals"]
  - name: ClientAcceptanceCommittee
    description: "Firm committee that evaluates client acceptance and continuance; segregated from engagement staffing."
    identity: opaque
    exclusive_operations: ["POST /audit/client-acceptances", "POST /audit/client-acceptances/{id}/submit", "POST /audit/client-acceptances/{id}/decision", "POST /audit/client-acceptances/{id}/integrity-assessments"]
    shared_operations: ["GET /audit/client-acceptances", "GET /audit/clients"]
  - name: IndependenceOfficer
    description: "Independence office; raises and remediates findings and threats, and may revoke an approved service."
    identity: opaque
    exclusive_operations: ["POST /audit/independence-findings", "POST /audit/independence-findings/{id}/transitions", "POST /audit/independence-threats", "POST /audit/independence-threats/{id}/transitions", "POST /audit/affiliate-attestations/{id}/transitions"]
    shared_operations: ["POST /audit/non-audit-services/{id}/transitions", "GET /audit/independence-findings", "GET /audit/independence-threats", "GET /audit/affiliate-attestations"]
  - name: AuditCommitteeLiaison
    description: "Liaison to the client audit committee; requests and records pre-approval of non-audit services."
    identity: opaque
    exclusive_operations: ["POST /audit/non-audit-services", "POST /audit/non-audit-services/{id}/transitions"]
    shared_operations: ["GET /audit/non-audit-services", "GET /audit/clients"]
  - name: QualityReviewer
    description: "Engagement quality control reviewer; owns quality reviews and regulatory inspection responses."
    identity: entity_backed:Professional
    exclusive_operations: ["POST /audit/quality-reviews", "POST /audit/quality-reviews/{id}/transitions"]
    shared_operations: ["GET /audit/quality-reviews", "GET /audit/engagements"]

