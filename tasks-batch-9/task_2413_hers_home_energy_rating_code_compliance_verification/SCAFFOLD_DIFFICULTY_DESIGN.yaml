  - rule_id: priority_pair_validation_conflict
    instances:
      - name: void_rating_state_beats_expired_inspector_certification
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_RATING_VOID]
          - errors[ERR_CERTIFICATION_INVALID]
        distinguishing_aspect: |
          Error-category pair `state` (priority 8, ERR_RATING_VOID) versus `business_safety`
          (priority 12, ERR_CERTIFICATION_INVALID): one request violates both and the state error wins.
        test_recipe:
          setup:
            - "A rating with a SCHEDULED FINAL inspection owned by field inspector Ines Pike whose cert_expires_at is 2026-09-01T00:00:00Z"
            - "The rating has been VOIDED by the provider"
            - "The logical clock has been advanced to 2026-09-02T00:00:00Z, so the inspector's effective_certification_status is EXPIRED"
          setup_api_calls:
            - call: "POST /builders"
              payload: { name: "Keystone Homes", builder_type: "PRODUCTION", utility_program_budget_cents: 500000 }
              as: RatingProviderAdmin
              captures: { b10: $.data.id }
            - call: "POST /subdivisions"
              payload: { builder_id: "${b10}", name: "Stonebridge", code_edition: "IECC_2021", climate_zone: "CZ4", sampling_enabled: false, compliance_path_preference: "ERI_PATH" }
              as: RatingProviderAdmin
