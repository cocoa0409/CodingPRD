          authored_by_user_id is frozen at creation from the X-User-ID header, and the segregation check
          compares identities, not roles: user-shared-9 drafted the message wearing the director hat and is
          refused when the same person returns wearing the counsel hat. The refusal sits at priority 4, so a
          caller who is both the author and in the wrong role gets the role error first, and the message must
          stay in PENDING_LEGAL_REVIEW with reviewed_by_user_id still null until a genuinely different user
          acts.
