  - method: GET
    path: "/coop/rental-agreements/{id}"
    description: "Get a rental agreement by id"
    roles: [Member, StoreStaff]
    code: 200
    input: []
    output: RentalAgreement
    side_effects: []

  - method: GET
    path: "/coop/rental-agreements"
    description: "List rental agreements; filter by member_id and/or gear_unit_id (FK reverse-reachability)"
    roles: [Member, StoreStaff]
    code: 200
    input: ["member_id?", "gear_unit_id?", "status?", "limit?", "offset?"]
    output: RentalAgreement[]
    side_effects: []

  - method: POST
    path: "/coop/rental-agreements/{id}/pickup"
    description: "Pick up a reserved rental (counter operation)"
    roles: [StoreStaff]
    code: 200
