  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: duplicate_ship_to_code_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "Second site with the same ship_to_code returns ERR_DUPLICATE (409) — uniqueness holds across all sites regardless of status."
        test_recipe:
          setup: ["Site with ship_to_code DUP-1 exists"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "First", ship_to_code: "DUP-1", credit_limit_cents: 100, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
          trigger:
            - call: "POST /vmi/sites"
              payload: { name: "Second", ship_to_code: "DUP-1", credit_limit_cents: 200, delivery_mode: "LINE_SIDE" }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE (http 409)"

      - name: duplicate_live_agreement_triple_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=6]"
          - "errors[ERR_DUPLICATE]"
        distinguishing_aspect: "A second agreement with the same (site, part, bin_location) while the first is live returns ERR_DUPLICATE; after retiring the first, the same triple is accepted again (uniqueness scoped to non-RETIRED)."
        test_recipe:
          setup: ["Site S, part P, agreement at location DUP-L"]
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "DA-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "DA-P", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { part_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "DUP-L", pricing_mode: "UNIT_PRICE", min_qty: 1, max_qty: 10 }
              as: DistributorAdmin
              captures: { agr_id: $.data.id }
          trigger:
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "DUP-L", pricing_mode: "UNIT_PRICE", min_qty: 2, max_qty: 20 }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
            - call: "POST /vmi/bin-agreements/${agr_id}/retire"
              payload: {}
              as: DistributorAdmin
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${part_id}", bin_location: "DUP-L", pricing_mode: "UNIT_PRICE", min_qty: 2, max_qty: 20 }
              as: DistributorAdmin
              captures: { agr2_id: $.data.id }
          assert:
            - "First duplicate attempt: error_id == ERR_DUPLICATE (http 409)"
            - "After retiring the original, recreation succeeds (201) with min_qty == 2"

      - name: self_referential_cross_reference_rejected
        claim_type: violation_to_error
        grounds:
          - "validations[priority=7]"
          - "errors[ERR_NO_SUBSTITUTE]"
        distinguishing_aspect: "A cross-reference whose to_part_id equals from_part_id returns ERR_NO_SUBSTITUTE (422)."
        test_recipe:
          setup: ["Part PA exists"]
          setup_api_calls:
            - call: "POST /vmi/parts"
              payload: { sku: "SELF-1", description: "p", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { pa_id: $.data.id }
          trigger:
            - call: "POST /vmi/part-cross-references"
              payload: { from_part_id: "${pa_id}", to_part_id: "${pa_id}", priority_rank: 1 }
              as: DistributorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_SUBSTITUTE (http 422)"

      - name: substitution_selector_priority_order
        claim_type: satisfaction_pass
        grounds:
          - "validations[priority=7]"
          - "endpoints[POST /vmi/bin-agreements/{id}/substitute]"
        distinguishing_aspect: "Substitute selection is deterministic: among is_active references from the OBSOLETE part, the lowest priority_rank wins; ties would break by created_at ASC. The agreement's part_id is repointed to the selected substitute."
        test_recipe:
          setup:
            - "Site S; parts PO (to be obsoleted), PS1, PS2 (both ACTIVE); xrefs PO->PS1 rank 2, PO->PS2 rank 1; agreement on PO"
          setup_api_calls:
            - call: "POST /vmi/sites"
              payload: { name: "S", ship_to_code: "SUB-1", credit_limit_cents: 100000, delivery_mode: "DOCK_TO_STOCK" }
              as: DistributorAdmin
              captures: { site_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SUB-O", description: "old", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { po_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SUB-S1", description: "s1", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { ps1_id: $.data.id }
            - call: "POST /vmi/parts"
              payload: { sku: "SUB-S2", description: "s2", is_critical: false, unit_price_cents: 100, total_stock_qty: 100 }
              as: DistributorAdmin
              captures: { ps2_id: $.data.id }
            - call: "POST /vmi/bin-agreements"
              payload: { site_id: "${site_id}", part_id: "${po_id}", bin_location: "SUB-L", pricing_mode: "UNIT_PRICE", min_qty: 1, max_qty: 10 }
