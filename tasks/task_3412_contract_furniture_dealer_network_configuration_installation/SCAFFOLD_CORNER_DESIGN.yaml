      - name: calc_agreement_lazy_expiry_on_read
        claim_type: correct_result
        grounds:
          - "state_machines.VolumeAgreement"
          - "entities.VolumeAgreement.fields.status"
        distinguishing_aspect: "ACTIVE -> EXPIRED is a lazy system transition: after the clock passes effective_end, the next GET reports EXPIRED without any write to the agreement."
        test_recipe:
          setup: ["agreement effective 2026-01-01..2026-10-01, activated at clock 2026-09-01; clock then advanced to 2026-10-02"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ManufacturerAdmin }
            - { call: "POST /end-users", payload: { name: "MegaCorp", industry: "technology" }, as: ManufacturerAdmin, captures: { eu_id: "$.data.id" } }
            - { call: "POST /volume-agreements", payload: { end_user_id: "${eu_id}", effective_start: "2026-01-01", effective_end: "2026-10-01", tier1_discount_pct: 0.10, tier2_discount_pct: 0.15, tier3_discount_pct: 0.20 }, as: ManufacturerAdmin, captures: { agr_id: "$.data.id" } }
