      - name: corner_pasture_and_base_property_reverse_paths_and_filters
        claim_type: cross_reference_link
        grounds:
          - endpoints.GET_/allotments/{allotmentId}/pastures
          - endpoints.GET_/pastures/{pastureId}
          - endpoints.GET_/pastures
          - endpoints.GET_/permittees/{permitteeId}/base-properties
          - endpoints.GET_/base-properties/{basePropertyId}
          - endpoints.GET_/base-properties
          - entities.Pasture.allotment_id
          - entities.BaseProperty.permittee_id
        distinguishing_aspect: "Pasture and BaseProperty are reachable three ways — nested under the parent, by their own id, and from the global collection narrowed by the FK — and all three agree. The nested list is ordered by sequence_order while the global list is not restricted to one parent, the boolean filter rest_required=false is honoured as a filter rather than treated as absent, two filters combine conjunctively, and qualified_aums is the FLOORED product of carrying_capacity_aums and the type factor so a LIVESTOCK property of 100 AUMs reads 75 in every one of the three paths."
        test_recipe:
          setup:
            - "Two allotments: one with two pastures (one of them rest_required) and one with a single pasture; two permittees, the first holding one LAND and one LIVESTOCK base property, the second holding one LAND property"
