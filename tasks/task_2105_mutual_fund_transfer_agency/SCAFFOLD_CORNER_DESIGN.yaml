  # =========================================================================
  - section: validations
    instances:
      - name: unknown_share_class_in_the_body_is_caught_before_the_account_state_check
        claim_type: priority_ordering
        grounds:
          - "validations[priority=50]"
          - "validations[priority=80]"
          - errors[ERR_SHARE_CLASS_NOT_FOUND]
          - errors[ERR_ACCOUNT_NOT_ACTIVE]
        distinguishing_aspect: "Body foreign-key existence sits at priority 50 and the account state check at priority 80, so a capture that names an unknown share class on a CLOSED account returns 404 ERR_SHARE_CLASS_NOT_FOUND, not 409."
        test_recipe:
          setup:
            - "One DIRECT/CA account that was activated and then closed while holding nothing."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FundAccountant
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "393-93-9393", primary_owner_name: "Cleo Closed" }
              as: TransferAgentOperator
              captures: { acc_cl: $.data.id }
            - call: "POST /shareholder-accounts/${acc_cl}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /shareholder-accounts/${acc_cl}/close"
              payload: {}
              as: TransferAgentOperator
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_cl}", share_class_id: "00000000-0000-4000-8000-000000000003", trade_type: "PURCHASE", gross_amount: 1000.00 }
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 404"
            - "error_id == ERR_SHARE_CLASS_NOT_FOUND"
            - "the response does not carry ERR_ACCOUNT_NOT_ACTIVE"

      - name: linking_to_an_already_linked_account_returns_roa_link_invalid
        claim_type: violation_to_error
        grounds:
          - "validations[priority=116]"
          - errors[ERR_ROA_LINK_INVALID]
          - entities.ShareholderAccount.fields.linked_primary_account_id
        distinguishing_aspect: "Rights-of-accumulation linking is single level: an account whose own linked_primary_account_id is set cannot itself be named as another account's primary, so the second-level link is rejected with 422 ERR_ROA_LINK_INVALID."
        test_recipe:
          setup:
            - "Account A is ACTIVE and unlinked; account B is ACTIVE and linked to A."
          setup_api_calls:
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "414-14-1414", primary_owner_name: "Alpha Primary" }
              as: TransferAgentOperator
              captures: { acc_a: $.data.id }
            - call: "POST /shareholder-accounts/${acc_a}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "424-24-2424", primary_owner_name: "Beta Secondary", linked_primary_account_id: "${acc_a}" }
              as: TransferAgentOperator
              captures: { acc_b: $.data.id }
            - call: "POST /shareholder-accounts/${acc_b}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
          trigger:
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "434-34-3434", primary_owner_name: "Gamma Tertiary", linked_primary_account_id: "${acc_b}" }
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 422 with error_id ERR_ROA_LINK_INVALID"
            - "GET /shareholder-accounts with linked_primary_account_id ${acc_b} returns total_count 0"
            - "GET /shareholder-accounts with linked_primary_account_id ${acc_a} returns total_count 1"

      - name: omnibus_account_without_dealer_firm_code_returns_invalid_request
        claim_type: conditional_validation
        grounds:
          - "validations[priority=30]"
          - entities.ShareholderAccount.fields.dealer_firm_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "dealer_firm_code is conditionally required: omitting it is fine for DIRECT but a 422 ERR_INVALID_REQUEST for OMNIBUS, so the same missing field is valid in one configuration and invalid in another."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "CORPORATE", account_channel: "OMNIBUS", state_code: "NY", tax_id: "444-44-4444", primary_owner_name: "No Dealer Code" }
              as: TransferAgentOperator
              captures: { err_id: $.data.error_id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "NY", tax_id: "454-54-5454", primary_owner_name: "Direct Is Fine" }
              as: TransferAgentOperator
              captures: { acc_ok: $.data.id }
          assert:
            - "the omnibus call returns HTTP 422 with error_id ERR_INVALID_REQUEST"
            - "the direct call returns HTTP 201 and ShareholderAccount.${acc_ok}.dealer_firm_code is null"

      - name: redemption_beyond_the_position_balance_returns_insufficient_shares
        claim_type: aggregate_validation
        grounds:
          - "validations[priority=142]"
          - errors[ERR_INSUFFICIENT_SHARES]
          - entities.Position.fields.shares
        distinguishing_aspect: "The capture-time balance check compares shares_requested against the Position's live 2827.500 shares, so a 3000.000 share redemption is refused with 422 ERR_INSUFFICIENT_SHARES and no Trade row is created."
        test_recipe:
          setup:
