      - name: a_coordination_is_reachable_from_both_of_the_sectors_it_joins
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /interference-coordinations]
          - endpoints[GET /sectors/{id}/interference-coordinations]
          - endpoints[GET /interference-coordinations]
        distinguishing_aspect: |
          InterferenceCoordination carries two FKs to the same Sector table, so the sector-scoped list
          must match on EITHER leg: the single row shows up under the requesting sector and under the
          neighbour sector alike. The direction is still recorded, so the flat list filtered by
          requesting_sector_id sees it from only one side - a naive implementation either loses the
          neighbour's view or forgets which side asked.
        test_recipe:
          setup:
            - "Two ACTIVE towers, each with an accepted backhaul circuit and one ACTIVE sector: A on 3555.0/10.0 (occupying 3550.0-3560.0) and B on 3620.0/10.0 (occupying 3615.0-3625.0), both under licence CBRS-PAL-4412 (3550.0-3650.0, max_eirp 47.0)."
