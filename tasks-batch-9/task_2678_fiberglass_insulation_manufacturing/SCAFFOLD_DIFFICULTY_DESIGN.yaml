          - state_machines.ProductionRun.SAMPLED_to_NONCONFORMING
          - state_machines.ProductionRun.NONCONFORMING_to_RETEST_PENDING
          - state_machines.ProductionRun.RETEST_PENDING_to_CONFORMING
          - entities.ProductionRun.fields.run_status
          - entities.ProductionRun.fields.qc_status
        distinguishing_aspect: |
          A different entity from the binder instance and a different non-linearity:
          ProductionRun carries TWO parallel state dimensions on one row, and this
          recipe drives qc_status through UNSAMPLED -> SAMPLED -> NONCONFORMING ->
          RETEST_PENDING -> CONFORMING while run_status sits unchanged at PACKAGED
