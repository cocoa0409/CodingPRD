      - name: an_expenditure_may_not_overdraw_the_reinvestment_account
        claim_type: violation_to_error
        grounds:
          - validations[priority=46]
          - errors[ERR_REINVESTMENT_BALANCE_INSUFFICIENT]
          - endpoints.POST_/reinvestment-accounts/{id}/expenditures
          - entities.ReinvestmentAccount.fields.closing_balance_cents
        distinguishing_aspect: "The rung compares the request against closing_balance_cents rather than the opening balance, and the boundary is inclusive: one cent over is refused, the exact balance is allowed, and a single further cent is then refused because the drawdown moved the balance the rung reads."
        test_recipe:
          setup:
            - "One installation with the declared defaults."
            - "One ReinvestmentAccount for fiscal_year 2026 with opening_balance_cents 300000 and occupancy_basis MONTH_END_SNAPSHOT, so contributions_cents and expenditures_cents are 0 and closing_balance_cents is 300000."
            - "The logical clock stands at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
            - call: "POST /reinvestment-accounts"
              payload: { installation_id: "${inst_id}", fiscal_year: 2026, opening_balance_cents: 300000, occupancy_basis: "MONTH_END_SNAPSHOT" }
              as: PlatformAdmin
              captures: { acct_id: "$.data.id", v12_ver: "$.data.version", v12_close0: "$.data.closing_balance_cents" }
          trigger:
            - call: "POST /reinvestment-accounts/${acct_id}/expenditures"
              payload: { expected_account_version: "${v12_ver}", amount_cents: 300001, purpose: "Playground resurfacing" }
              as: PropertyManager
              captures: { v12_e1: "$.data.error_id" }
            - call: "POST /reinvestment-accounts/${acct_id}/expenditures"
              payload: { expected_account_version: "${v12_ver}", amount_cents: 300000, purpose: "Playground resurfacing" }
              as: PropertyManager
              captures: { v12_exp: "$.data.expenditures_cents", v12_close: "$.data.closing_balance_cents", v12_ver2: "$.data.version" }
            - call: "POST /reinvestment-accounts/${acct_id}/expenditures"
              payload: { expected_account_version: "${v12_ver2}", amount_cents: 1, purpose: "One more sign" }
              as: PropertyManager
              captures: { v12_e2: "$.data.error_id" }
          assert:
            - "${v12_close0} == 300000 at creation"
            - "the first call returns HTTP 422 with ${v12_e1} == ERR_REINVESTMENT_BALANCE_INSUFFICIENT - one cent over the balance"
            - "the second call returns HTTP 200 with ${v12_exp} == 300000 and ${v12_close} == 0 - drawing exactly the balance is allowed"
            - "the third call returns HTTP 422 with ${v12_e2} == ERR_REINVESTMENT_BALANCE_INSUFFICIENT even though it asks for a single cent"

