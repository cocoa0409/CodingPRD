            - "Shipment.${sh}.status remains PENDING"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: backdrop_halfopen_overlap_rejected
        grounds:
          - calculations.capture_slot_overlap
          - validations[priority=8a]
          - entities.CaptureSlot.fields.backdrop_id
        distinguishing_aspect: |
          Resource = Backdrop with HALF-OPEN interval semantics (adjacency allowed). A SCHEDULED slot
          [600,660) on backdrop BD; a new slot [650,720) on the SAME backdrop overlaps (650<660) and is
          rejected ERR_BACKDROP_DOUBLE_BOOKED. An adjacent slot [660,720) on the same backdrop would be
          allowed (gap 0 OK) — the half-open semantics.
        test_recipe:
          setup:
            - "Session DRAFT; backdrop BD and photographer PH1 created; one SCHEDULED slot [600,660) on BD/PH1."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Poplar School", scheduled_date: "2026-05-15T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/backdrops"
              payload: { picture_day_session_id: "${sess}", label: "Blue" }
              as: SchoolCoordinator
              captures: { bd: $.data.id }
            - call: "POST /api/photographers"
              payload: { picture_day_session_id: "${sess}", full_name: "Lee" }
              as: SchoolCoordinator
              captures: { phr: $.data.id }
            - call: "POST /api/photographers"
              payload: { picture_day_session_id: "${sess}", full_name: "Moe" }
              as: SchoolCoordinator
              captures: { phr2: $.data.id }
            - call: "POST /api/capture-slots"
              payload: { picture_day_session_id: "${sess}", backdrop_id: "${bd}", photographer_id: "${phr}", homeroom: "A", start_minute: 600, end_minute: 660 }
              as: SchoolCoordinator
              captures: { slot1: $.data.id }
          trigger:
            - call: "POST /api/capture-slots"
              payload: { picture_day_session_id: "${sess}", backdrop_id: "${bd}", photographer_id: "${phr2}", homeroom: "B", start_minute: 650, end_minute: 720 }
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "creation returns ERR_BACKDROP_DOUBLE_BOOKED (409): [650,720) overlaps SCHEDULED [600,660) on the same backdrop"
            - "A different photographer (phr2) is used so the photographer buffer rule does not fire first"

      - name: photographer_buffer_adjacency_rejected
        grounds:
          - calculations.capture_slot_overlap
          - validations[priority=8b]
          - entities.CaptureSlot.fields.photographer_id
        distinguishing_aspect: |
          Resource = Photographer with BUFFERED interval semantics (adjacency DISALLOWED, 10-min
          buffer) — different interval arithmetic and a different resource entity from Backdrop. A
          SCHEDULED slot [600,660) on photographer PHR; a new ADJACENT slot [660,720) on the SAME
          photographer (but a DIFFERENT backdrop, so backdrop rule passes) is rejected
          ERR_PHOTOGRAPHER_DOUBLE_BOOKED because 660 < 660+10.
        test_recipe:
          setup:
            - "Session DRAFT; two backdrops BD1, BD2; one photographer PHR; SCHEDULED slot [600,660) on BD1/PHR."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Spruce School", scheduled_date: "2026-05-16T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 0 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/backdrops"
              payload: { picture_day_session_id: "${sess}", label: "Red" }
              as: SchoolCoordinator
              captures: { bd1: $.data.id }
            - call: "POST /api/backdrops"
              payload: { picture_day_session_id: "${sess}", label: "Green" }
              as: SchoolCoordinator
              captures: { bd2: $.data.id }
            - call: "POST /api/photographers"
              payload: { picture_day_session_id: "${sess}", full_name: "Ray" }
              as: SchoolCoordinator
              captures: { phr: $.data.id }
            - call: "POST /api/capture-slots"
              payload: { picture_day_session_id: "${sess}", backdrop_id: "${bd1}", photographer_id: "${phr}", homeroom: "A", start_minute: 600, end_minute: 660 }
              as: SchoolCoordinator
              captures: { slot1: $.data.id }
          trigger:
            - call: "POST /api/capture-slots"
              payload: { picture_day_session_id: "${sess}", backdrop_id: "${bd2}", photographer_id: "${phr}", homeroom: "B", start_minute: 660, end_minute: 720 }
              as: SchoolCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "creation returns ERR_PHOTOGRAPHER_DOUBLE_BOOKED (409): adjacent [660,720) violates the 10-min buffer on photographer ${phr}"
            - "A different backdrop (bd2) is used so the backdrop half-open rule passes (adjacency allowed there)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: retouch_credit_conserved_on_approve_then_cancel
        grounds:
          - state_machines.RetouchOrder.REQUESTED_to_APPROVED
          - state_machines.RetouchOrder.REQUESTED_or_APPROVED_to_CANCELLED
          - entities.PictureDaySession.fields.retouch_credit_balance_cents
        distinguishing_aspect: |
          Conserved quantity: session retouch_credit_balance_cents. Forward action (approve reserves
          net 1500) paired with its compensating action (cancel releases 1500) leaves the balance
          exactly equal to the original budget: balance == retouch_budget_cents == 5000 with zero drift.
          Invariant: retouch_credit_balance_cents == retouch_budget_cents - sum(net_cost_cents over {APPROVED,DONE}).
        test_recipe:
          setup:
            - "Session CAPTURE_OPEN, budget 5000; PH MATCHED; RT (RETOUCH adj3, net 3000) REQUESTED."
          setup_api_calls:
            - call: "POST /api/picture-day-sessions"
              payload: { school_name: "Sycamore School", scheduled_date: "2026-05-17T00:00:00Z", gallery_closes_at: "2026-12-31T00:00:00Z", retouch_budget_cents: 5000 }
              as: SchoolCoordinator
              captures: { sess: $.data.id }
            - call: "POST /api/packages"
              payload: { picture_day_session_id: "${sess}", sku: "B", name: "Basic", tier: "BASIC", base_price_cents: 2499 }
              as: SchoolCoordinator
              captures: { pkgB: $.data.id }
            - call: "POST /api/students"
              payload: { picture_day_session_id: "${sess}", full_name: "Kid Z", grade: "4", homeroom: "Q", guardian_user_id: "g1" }
              as: SchoolCoordinator
              captures: { s1: $.data.id }
            - call: "POST /api/picture-day-sessions/${sess}/lock-roster"
              payload: {}
              as: SchoolCoordinator
            - call: "POST /api/picture-day-sessions/${sess}/open-capture"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/photos"
              payload: { picture_day_session_id: "${sess}", candidate_name: "Kid Z", candidate_grade: "4", candidate_homeroom: "Q" }
              as: StudioPhotographer
              captures: { ph: $.data.id }
            - call: "POST /api/photos/${ph}/match"
              payload: {}
              as: StudioPhotographer
            - call: "POST /api/retouch-orders"
              payload: { photo_id: "${ph}", kind: "RETOUCH", adjustment_count: 3 }
              as: StudioPhotographer
              captures: { rt: $.data.id }
            - call: "POST /api/retouch-orders/${rt}/approve"
              payload: {}
              as: StudioPhotographer
          trigger:
            - call: "GET /api/picture-day-sessions/${sess}"
              payload: {}
              as: SchoolCoordinator
              captures: { bal_after_approve: $.data.retouch_credit_balance_cents }
            - call: "POST /api/retouch-orders/${rt}/cancel"
              payload: {}
              as: StudioPhotographer
            - call: "GET /api/picture-day-sessions/${sess}"
              payload: {}
              as: SchoolCoordinator
              captures: { bal_after_cancel: $.data.retouch_credit_balance_cents }
          assert:
            - "retouch_credit_balance_cents == 2000 after approve (5000 - 3000 reserved)"
            - "retouch_credit_balance_cents == 5000 after cancel (3000 released; equals original budget, zero drift)"

      - name: merchandise_gross_conserved_on_settle
        grounds:
          - calculations.provisional_school_commission
          - calculations.final_school_commission
          - entities.PictureDaySession.fields.total_merchandise_cents
          - state_machines.PictureDaySession.ORDERING_CLOSED_to_SETTLED
        distinguishing_aspect: |
          A DIFFERENT conserved quantity (total_merchandise_cents, the commission gross) from the
          retouch-credit invariant. Settle reconciles school_commission_balance_cents but MUST leave
          total_merchandise_cents unchanged: it equals sum(merchandise_cents over {PAID,FULFILLED})
          both before and after settle. Invariant: total_merchandise_cents == 126000 across the settle.
