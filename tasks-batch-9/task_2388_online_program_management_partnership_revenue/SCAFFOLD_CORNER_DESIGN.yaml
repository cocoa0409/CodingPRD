            - "${e16} == ERR_FEE_STRUCTURE_MISMATCH"

      - name: remit_on_a_zero_net_payable_statement_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 48 ERR_NOTHING_TO_REMIT]
          - state_machines.RemittanceStatement.UNIVERSITY_APPROVED_to_REMITTED
        distinguishing_aspect: "An August period precedes every term start, so the statement is legally CALCULATED and APPROVED with net_payable_cents 0 and is only stopped at the REMIT edge — the empty statement is approvable but not payable."
        test_recipe:
          setup:
            - "EXECUTED Partnership with a paid Enrollment whose term starts 2026-09-01; logical clock at 2026-10-01."
            - "An August statement authored by bursar-1 and approved by provost-1, carrying net_payable_cents 0."
          setup_api_calls:
            - *k_clock
            - *k_ps_create
            - *k_ps_submit
            - *k_ps_execute
            - *k_pg_create
            - *k_course_create
            - *k_course_start
            - *k_course_submit
            - *k_course_approve
            - *k_scope_marketing
            - *k_pg_submit
            - *k_pg_approve
            - *k_pg_launch
            - *k_co_create
            - *k_co_plan
            - *k_co_review
            - *k_lead_create
            - *k_lead_contact
            - *k_lead_apply
            - *k_enroll
            - *k_clock_sep5
            - *k_pay_full
            - *k_clock_oct1
            - *k_get_ps_v
            - &k_stmt_aug
              call: "POST /partnerships/${ps_id}/remittance-statements"
              payload: { period_start: "2026-08-01", period_end: "2026-08-31", expected_partnership_version: "${ps_v}" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { st_aug_id: $.data.id }
            - &k_stmt_aug_approve
              call: "POST /remittance-statements/${st_aug_id}/actions"
              payload: { action: "APPROVE" }
              as: UniversityProvost
              as_user_id: "provost-1"
          trigger:
            - call: "POST /remittance-statements/${st_aug_id}/actions"
              payload: { action: "REMIT", remittance_reference: "ACH-2026-08" }
              as: UniversityBursar
              as_user_id: "bursar-1"
              captures: { e17: $.data.error_id }
          assert:
            - "response status == 422"
            - "${e17} == ERR_NOTHING_TO_REMIT"
            - "RemittanceStatement.${st_aug_id}.recognized_revenue_cents == 0"
            - "RemittanceStatement.${st_aug_id}.net_payable_cents == 0"
            - "RemittanceStatement.${st_aug_id}.status == UNIVERSITY_APPROVED"
            - "Partnership.${ps_id}.remitted_to_partner_cents == 0"

      - name: graduation_milestone_plan_over_the_variable_envelope_is_rejected
        claim_type: violation_to_error
