# =============================================================================
# Task 0434 — 3PL Fulfillment & Pick-Pack-Ship benchmark seed tables (v1)
# =============================================================================

scenario: |
  434. 3PL Fulfillment & Pick-Pack-Ship: client/SKU onboarding & receiving,
  bin/location & inventory ownership, order import & wave/batch pick, pack &
  cartonization, rate-shop & label, returns grading & restock, storage/handling
  billing (per-order/per-pallet), cycle count & inventory sync

domain_name: 3pl-fulfillment
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation        # finite client-owned inventory reserved/committed/released across competing orders
  secondary_archetype: pricing_engine        # per-order/per-pallet storage & handling billing with estimate-vs-actual variants
  complexity_layers:
    - cascading_side_effects                  # ship → carton/order/inventory/billing cascade
    - dual_variant_calculation                # estimated handling at pack vs billed handling at ship; rate-shop estimate vs actual
    - optimistic_concurrency                  # cycle-count adjustment on a possibly-stale InventoryLot version
    - selector_policy                         # rate-shop picks one carrier quote from a candidate pool

  entity_topology: flat                       # peer entities linked by explicit FK fields, not nested ownership trees
  state_machine_shape: branching              # Order forks pick→pack→ship vs cancel/short; Return forks restock vs scrap
  relationship_patterns:
    - one_to_many                             # Client→Sku, Order→OrderLine(via lines array), Wave→Order
    - cross_aggregate                         # PickTask reads InventoryLot across the Bin aggregate; Shipment reads Order
  role_model: peer_roles                      # ClientUser owns import/onboarding; warehouse roles own physical ops; BillingClerk owns charges
  consistency_model: immediate                # all mutations and cascades atomic within the triggering request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Merchant/client legal name" }
      - { name: storage_rate_per_pallet_cents, type: integer, source: input, description: "Daily storage rate billed per occupied PALLET bin, in cents" }
      - { name: handling_rate_per_order_cents, type: integer, source: input, description: "Base handling fee per shipped order, in cents" }
      - { name: handling_rate_per_extra_unit_cents, type: integer, source: input, default: 0, description: "Incremental handling fee per shipped unit beyond the first, in cents" }
      - { name: handling_surcharge_per_extra_carton_cents, type: integer, source: input, default: 0, description: "Surcharge billed at SHIP per carton beyond the first; appears only in billed_handling, never in the PACK-time estimate" }
      - { name: carrier_discount_bps, type: integer, source: input, default: 0, description: "Negotiated carrier discount in basis points (1 bp = 0.01%) applied to the published rate-shop quote", constraints: "0..10000" }
      - { name: storage_balance_cents, type: integer, source: computed, default: 0, description: "Read-only running sum of all POSTED BillingCharge.amount_cents whose charge_type==STORAGE for this client" }
      - { name: handling_balance_cents, type: integer, source: computed, default: 0, description: "Read-only running sum of all POSTED BillingCharge.amount_cents whose charge_type==HANDLING for this client" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; suspended clients reject new receipts/orders", constraints: "ACTIVE, SUSPENDED" }

  - name: Sku
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client of this SKU" }
      - { name: code, type: string, source: input, description: "Client-scoped SKU code; unique per (client_id, code)" }
      - { name: unit_volume_cc, type: integer, source: input, description: "Volume of one unit in cubic centimetres, used for cartonization" }
      - { name: unit_cost_cents, type: integer, source: input, default: 0, description: "Declared per-unit cost in cents, used by inventory valuation" }
      - { name: hazmat, type: boolean, source: input, default: false, description: "Whether the SKU is hazardous; hazmat SKUs cannot ship via GROUND_ECONOMY carrier" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED; discontinued SKUs reject new receipts", constraints: "ACTIVE, DISCONTINUED" }

  - name: Bin
    parent: null
    common_fields: true
    fields:
      - { name: location_code, type: string, source: input, description: "Warehouse location code, globally unique" }
      - { name: bin_type, type: enum, source: input, description: "GENERAL (each-pick shelf) | PALLET (pallet position, storage-billable)", constraints: "GENERAL, PALLET" }
      - { name: capacity_cc, type: integer, source: input, description: "Total volume capacity in cubic centimetres" }
      - { name: occupied_cc, type: integer, source: computed, default: 0, description: "Read-only sum of (InventoryLot.on_hand_qty * Sku.unit_volume_cc) for all lots in this bin" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | BLOCKED; BLOCKED bins reject putaway and picks", constraints: "OPEN, BLOCKED" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; owning client (inventory ownership boundary)" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; the stocked SKU; Sku.client_id must equal this lot's client_id" }
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; physical bin holding this lot" }
      - { name: receipt_id, type: string, source: system, description: "FK -> Receipt.id; the receipt that created this lot via putaway" }
      - { name: on_hand_qty, type: integer, source: computed, default: 0, description: "Read-only physical units present = reserved_qty + available_qty" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Read-only units reserved by RESERVED/PICKING/PACKED order lines, not yet shipped" }
      - { name: available_qty, type: integer, source: computed, default: 0, description: "Read-only units free to reserve = on_hand_qty - reserved_qty" }

  - name: Receipt
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; client whose goods are inbound" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; SKU being received" }
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; destination bin for putaway" }
      - { name: expected_qty, type: integer, source: input, description: "Units announced on the ASN; must be > 0" }
      - { name: received_qty, type: integer, source: system, default: 0, description: "Units actually counted at the dock during RECEIVE", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: ANNOUNCED, description: "ANNOUNCED -> RECEIVED -> PUTAWAY; or ANNOUNCED -> CANCELLED", constraints: "ANNOUNCED, RECEIVED, PUTAWAY, CANCELLED" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; ordering client" }
      - { name: wave_id, type: string, source: system, default: null, description: "FK -> Wave.id; set when the order is added to a wave, null otherwise" }
      - { name: ship_to_zone, type: integer, source: input, description: "Destination zone 1..8 used by rate-shop", constraints: "1..8" }
      - { name: lines, type: array, source: input, description: "Order lines: [{ sku_id, qty }]; qty > 0; at least one line required" }
      - { name: total_units, type: integer, source: computed, description: "Read-only sum of line qty across all lines" }
      - { name: estimated_handling_cents, type: integer, source: computed, default: 0, description: "Read-only handling estimate stamped at PACK time, before shipped unit count is final" }
      - { name: billed_handling_cents, type: integer, source: computed, default: 0, description: "Read-only final handling charge stamped at SHIP time from cartonized shipped units" }
      - { name: status, type: enum, source: system, default: IMPORTED, description: "IMPORTED -> RESERVED -> PICKING -> PACKED -> SHIPPED; IMPORTED/RESERVED -> CANCELLED; RESERVED -> SHORT", constraints: "IMPORTED, RESERVED, PICKING, PACKED, SHIPPED, CANCELLED, SHORT" }

  - name: Wave
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; all orders in the wave belong to this client" }
      - { name: order_count, type: integer, source: computed, default: 0, description: "Read-only count of Orders whose wave_id == this wave" }
      - { name: status, type: enum, source: system, default: BUILDING, description: "BUILDING -> RELEASED -> COMPLETED; or BUILDING -> CANCELLED", constraints: "BUILDING, RELEASED, COMPLETED, CANCELLED" }

  - name: PickTask
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; order this pick fulfils" }
      - { name: lot_id, type: string, source: system, description: "FK -> InventoryLot.id; the lot picked from, chosen by the FEFO-by-created_at selector at RELEASE" }
      - { name: sku_id, type: string, source: system, description: "FK -> Sku.id; SKU picked (denormalized for sync)" }
      - { name: qty, type: integer, source: system, description: "Units to pick from lot_id for this order line" }
      - { name: picked_qty, type: integer, source: system, default: 0, description: "Units physically confirmed picked" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED -> PICKED; or ASSIGNED -> SHORT_CLOSED on cancel", constraints: "ASSIGNED, PICKED, SHORT_CLOSED" }

  - name: Carton
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being packed into this carton" }
      - { name: packed_units, type: integer, source: input, description: "Units placed in this carton; must be > 0 and not exceed remaining unpacked picked units" }
      - { name: fill_volume_cc, type: integer, source: computed, description: "Read-only sum of packed unit volumes from Sku.unit_volume_cc" }
      - { name: carton_size, type: enum, source: computed, description: "Smallest box whose inner_cc >= fill_volume_cc: SMALL | MEDIUM | LARGE", constraints: "SMALL, MEDIUM, LARGE" }
      - { name: status, type: enum, source: system, default: PACKED, description: "PACKED -> SHIPPED; or PACKED -> VOIDED", constraints: "PACKED, SHIPPED, VOIDED" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; order being shipped" }
      - { name: carrier, type: enum, source: computed, description: "Carrier selected by rate-shop: GROUND_ECONOMY | GROUND_PLUS | AIR_EXPRESS", constraints: "GROUND_ECONOMY, GROUND_PLUS, AIR_EXPRESS" }
      - { name: quoted_cost_cents, type: integer, source: computed, description: "Read-only winning rate-shop quote stamped at label purchase" }
      - { name: tracking_number, type: string, source: computed, description: "Read-only carrier tracking number minted at label purchase" }
      - { name: status, type: enum, source: system, default: LABELLED, description: "LABELLED -> DELIVERED; or LABELLED -> VOIDED", constraints: "LABELLED, DELIVERED, VOIDED" }

  - name: Return
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the SHIPPED order being returned; Order.status must be SHIPPED" }
      - { name: sku_id, type: string, source: input, description: "FK -> Sku.id; returned SKU; must have been shipped on the order" }
      - { name: bin_id, type: string, source: input, description: "FK -> Bin.id; restock destination bin used only when grade==SELLABLE" }
      - { name: qty, type: integer, source: input, description: "Units returned; must be > 0 and not exceed units shipped for this SKU on the order" }
      - { name: grade, type: enum, source: input, default: null, description: "Set at GRADE: SELLABLE (restock to available) | DAMAGED (scrap, no restock)", constraints: "SELLABLE, DAMAGED" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED -> GRADED -> CLOSED", constraints: "REQUESTED, GRADED, CLOSED" }

  - name: CycleCount
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> InventoryLot.id; the lot whose on-hand is being recounted" }
      - { name: expected_lot_version, type: integer, source: input, description: "OCC: InventoryLot.version the counter last observed; rejected if stale" }
      - { name: counted_qty, type: integer, source: input, description: "Physically counted units; must be >= 0" }
      - { name: variance_qty, type: integer, source: computed, description: "Read-only counted_qty - on_hand_qty_at_apply; may be negative" }
      - { name: status, type: enum, source: system, default: APPLIED, description: "Cycle counts apply immediately on create", constraints: "APPLIED" }

  - name: BillingCharge
    parent: null
    common_fields: false   # append-only ledger event: only id + created_at
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; charged client" }
      - { name: charge_type, type: enum, source: input, description: "STORAGE (per-pallet daily) | HANDLING (per-order at ship)", constraints: "STORAGE, HANDLING" }
      - { name: amount_cents, type: integer, source: computed, description: "Read-only charge amount; HANDLING from the order's billed_handling_cents, STORAGE from occupied pallet bins * rate" }
      - { name: source_order_id, type: string, source: input, default: null, description: "FK -> Order.id; the order that produced a HANDLING charge, null for STORAGE" }
      - { name: posted, type: boolean, source: system, default: true, description: "Always true; charges post immediately and are immutable (no reversal entry mutates them)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Receipt
    initial_state: ANNOUNCED
    terminal_states: [PUTAWAY, CANCELLED]
    transitions:
      - from: ANNOUNCED
        to: RECEIVED
        trigger: "POST /clients/{clientId}/receipts/{receiptId}/receive"
        actor: ReceivingClerk
        preconditions:
          - "Receipt.status == ANNOUNCED (ERR_RECEIPT_NOT_ANNOUNCED)"
          - "received_qty in body is >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "received_qty := body.received_qty"
      - from: RECEIVED
        to: PUTAWAY
        trigger: "POST /clients/{clientId}/receipts/{receiptId}/putaway"
        actor: ReceivingClerk
        preconditions:
          - "Receipt.status == RECEIVED (ERR_RECEIPT_NOT_RECEIVED)"
          - "Bin.status == OPEN (ERR_BIN_BLOCKED)"
          - "If Bin.bin_type == PALLET, the bin holds no InventoryLot of a DIFFERENT client (ERR_PALLET_OCCUPIED_BY_OTHER_CLIENT)"
          - "Adding received_qty units keeps Bin.occupied_cc <= Bin.capacity_cc (ERR_BIN_CAPACITY_EXCEEDED)"
        side_effects:
          - "Create or top up the InventoryLot for (client_id, sku_id, bin_id, receipt_id): on_hand_qty += received_qty"
          - "InventoryLot.available_qty += received_qty (cascade: Bin.occupied_cc recomputed)"
      - from: ANNOUNCED
        to: CANCELLED
        trigger: "POST /clients/{clientId}/receipts/{receiptId}/cancel"
        actor: ReceivingClerk
        preconditions:
          - "Receipt.status == ANNOUNCED (ERR_RECEIPT_NOT_ANNOUNCED)"
        side_effects: []

  - entity: Wave
    initial_state: BUILDING
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: BUILDING
        to: RELEASED
        trigger: "POST /clients/{clientId}/waves/{waveId}/release"
        actor: WavePlanner
        preconditions:
          - "Wave.status == BUILDING (ERR_WAVE_NOT_BUILDING)"
          - "Wave has >= 1 member Order (ERR_WAVE_EMPTY)"
          - "Every member Order has available_qty coverage for every line at release (ERR_INSUFFICIENT_INVENTORY)"
        side_effects:
          - "For each member Order: reserve each line's qty against the selected lot (FEFO by InventoryLot.created_at ASC, lot.id never used) -> InventoryLot.reserved_qty += qty (cascade: available_qty recomputed)"
          - "For each reserved line create a PickTask (status ASSIGNED) bound to the chosen lot"
          - "Each member Order: IMPORTED -> RESERVED, then RESERVED -> PICKING"
      - from: RELEASED
        to: COMPLETED
        trigger: "system (automatic when every member Order is SHIPPED, CANCELLED, or SHORT)"
        actor: system
        preconditions:
          - "All member Orders are in a terminal Order state {SHIPPED, CANCELLED, SHORT}"
        side_effects: []
      - from: BUILDING
        to: CANCELLED
        trigger: "POST /clients/{clientId}/waves/{waveId}/cancel"
        actor: WavePlanner
        preconditions:
          - "Wave.status == BUILDING (ERR_WAVE_NOT_BUILDING)"
        side_effects:
          - "Detach every member Order: Order.wave_id := null (orders stay IMPORTED)"

  - entity: Order
    initial_state: IMPORTED
    terminal_states: [SHIPPED, CANCELLED, SHORT]
    transitions:
      - from: IMPORTED
        to: RESERVED
        trigger: "system (during Wave RELEASE, before PICKING)"
        actor: system
        preconditions:
          - "Order.wave_id is set and that Wave is being released"
        side_effects:
          - "Each line reserves qty against its FEFO-selected lot: InventoryLot.reserved_qty += qty (cascade: available_qty -= qty)"
      - from: RESERVED
        to: PICKING
        trigger: "system (during Wave RELEASE, immediately after RESERVED)"
        actor: system
        preconditions: []
        side_effects:
          - "PickTasks for this order created in ASSIGNED state"
      - from: PICKING
        to: PACKED
        trigger: "POST /clients/{clientId}/orders/{orderId}/pack"
        actor: PackStation
        preconditions:
          - "Order.status == PICKING (ERR_ORDER_NOT_PICKING)"
          - "Every PickTask for this order is PICKED (ERR_PICKS_INCOMPLETE)"
          - "Sum of submitted carton packed_units equals Order.total_units (ERR_PACK_UNIT_MISMATCH)"
        side_effects:
          - "Create the submitted Cartons (cartonization assigns carton_size per carton)"
          - "Compute Order.estimated_handling_cents (per-order base + per-extra-unit over packed units)"
      - from: PACKED
        to: SHIPPED
        trigger: "POST /clients/{clientId}/orders/{orderId}/ship"
        actor: ShipStation
        preconditions:
          - "Order.status == PACKED (ERR_ORDER_NOT_PACKED)"
          - "A Shipment with a purchased label exists for this order (ERR_LABEL_REQUIRED)"
        side_effects:
          - "Convert reservations to consumption: for each reserved lot InventoryLot.reserved_qty -= qty AND on_hand_qty -= qty (cascade: available_qty unchanged, Bin.occupied_cc recomputed)"
          - "All Cartons for the order PACKED -> SHIPPED; the Shipment LABELLED stands"
          - "Compute Order.billed_handling_cents from shipped cartonized units; create a HANDLING BillingCharge with amount_cents == billed_handling_cents (cascade: Client.handling_balance_cents += amount_cents)"
          - "If the parent Wave now has all member Orders terminal, Wave RELEASED -> COMPLETED"
      - from: IMPORTED
        to: CANCELLED
        trigger: "POST /clients/{clientId}/orders/{orderId}/cancel"
        actor: ClientUser
        preconditions:
          - "Order.status == IMPORTED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "If Order.wave_id set, detach from wave (wave_id := null)"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /clients/{clientId}/orders/{orderId}/cancel"
        actor: ClientUser
        preconditions:
          - "Order.status == RESERVED (ERR_ORDER_NOT_CANCELLABLE)"
        side_effects:
          - "Release every reservation: InventoryLot.reserved_qty -= qty (cascade: available_qty += qty)"
          - "Each PickTask ASSIGNED -> SHORT_CLOSED"
          - "If the parent Wave now has all member Orders terminal, Wave RELEASED -> COMPLETED"
      - from: PICKING
        to: SHORT
        trigger: "POST /clients/{clientId}/orders/{orderId}/short"
        actor: PickOperator
        preconditions:
          - "Order.status == PICKING (ERR_ORDER_NOT_PICKING)"
          - "At least one PickTask has picked_qty < qty (ERR_NOT_SHORT)"
        side_effects:
          - "Release the unconsumed reservation for every line: InventoryLot.reserved_qty -= (qty - picked_qty) (cascade: available_qty += that delta)"
          - "Every ASSIGNED PickTask -> SHORT_CLOSED"
          - "If the parent Wave now has all member Orders terminal, Wave RELEASED -> COMPLETED"

  - entity: PickTask
    initial_state: ASSIGNED
    terminal_states: [PICKED, SHORT_CLOSED]
    transitions:
      - from: ASSIGNED
        to: PICKED
        trigger: "POST /clients/{clientId}/pick-tasks/{pickTaskId}/confirm"
        actor: PickOperator
        preconditions:
          - "PickTask.status == ASSIGNED (ERR_PICK_NOT_ASSIGNED)"
          - "Owning Bin of lot_id is OPEN (ERR_BIN_BLOCKED)"
          - "body.picked_qty >= 0 and <= PickTask.qty (ERR_INVALID_REQUEST)"
        side_effects:
          - "picked_qty := body.picked_qty"
      - from: ASSIGNED
        to: SHORT_CLOSED
        trigger: "system (during Order cancel from RESERVED or Order short)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Carton
    initial_state: PACKED
    terminal_states: [SHIPPED, VOIDED]
    transitions:
      - from: PACKED
        to: SHIPPED
        trigger: "system (during Order ship)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PACKED
        to: VOIDED
        trigger: "system (during Order short from PICKING after partial pack is impossible — pack only occurs after full pick)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Shipment
    initial_state: LABELLED
    terminal_states: [DELIVERED, VOIDED]
    transitions:
      - from: LABELLED
        to: DELIVERED
        trigger: "POST /clients/{clientId}/shipments/{shipmentId}/deliver"
        actor: ShipStation
        preconditions:
          - "Shipment.status == LABELLED (ERR_SHIPMENT_NOT_LABELLED)"
          - "Order.status == SHIPPED (ERR_ORDER_NOT_SHIPPED)"
        side_effects: []
      - from: LABELLED
        to: VOIDED
        trigger: "POST /clients/{clientId}/shipments/{shipmentId}/void"
        actor: ShipStation
        preconditions:
          - "Shipment.status == LABELLED (ERR_SHIPMENT_NOT_LABELLED)"
          - "Order.status == PACKED (ERR_ORDER_NOT_PACKED)"
        side_effects: []

  - entity: Return
    initial_state: REQUESTED
    terminal_states: [CLOSED]
    transitions:
      - from: REQUESTED
        to: GRADED
        trigger: "POST /clients/{clientId}/returns/{returnId}/grade"
        actor: ReturnsClerk
        preconditions:
          - "Return.status == REQUESTED (ERR_RETURN_NOT_REQUESTED)"
          - "body.grade in {SELLABLE, DAMAGED} (ERR_INVALID_REQUEST)"
          - "If grade==SELLABLE: restock Bin.status == OPEN (ERR_BIN_BLOCKED)"
          - "If grade==SELLABLE and Bin.bin_type==PALLET: the bin holds no DIFFERENT client's lot (ERR_PALLET_OCCUPIED_BY_OTHER_CLIENT)"
          - "If grade==SELLABLE: restock keeps Bin.occupied_cc <= capacity_cc (ERR_BIN_CAPACITY_EXCEEDED)"
        side_effects:
          - "grade := body.grade"
          - "If grade==SELLABLE: create or top up an InventoryLot in bin_id for (client_id, sku_id): on_hand_qty += qty AND available_qty += qty (cascade: Bin.occupied_cc recomputed)"
          - "If grade==DAMAGED: scrap, no inventory change"
      - from: GRADED
        to: CLOSED
        trigger: "POST /clients/{clientId}/returns/{returnId}/close"
        actor: ReturnsClerk
        preconditions:
          - "Return.status == GRADED (ERR_RETURN_NOT_GRADED)"
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: cycle-count-stale-lot
    parent_entity: InventoryLot
    write_endpoint: "POST /clients/{clientId}/cycle-counts"
    occ_field: "expected_lot_version"
    description: |
      Applying a CycleCount against an InventoryLot whose version has advanced
      since the counter last observed it is rejected. This captures the case
      where another operation (a putaway top-up, a ship consumption, a return
      restock, or a prior cycle count) has legitimately mutated the lot and the
      current counter's observed version is therefore stale. The count would
      otherwise overwrite on_hand_qty from an outdated baseline.
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: handling_fee
    trigger: "Order PICKING->PACKED (estimated_handling variant) and Order PACKED->SHIPPED (billed_handling variant)"
    algorithm: threshold
    formula: |
      base = Client.handling_rate_per_order_cents
      units = Order.total_units
      unit_component = 0 if units <= 1 else (units - 1) * Client.handling_rate_per_extra_unit_cents
      estimate_fee = base + unit_component
      # billed adds a per-extra-carton surcharge the estimate never includes:
      carton_count = count of the order's PACKED cartons
      carton_component = 0 if carton_count <= 1 else (carton_count - 1) * Client.handling_surcharge_per_extra_carton_cents
      billed_fee = base + unit_component + carton_component
      All inputs are integer cents; results are integer cents (no rounding).
    input_set: "A single Order, its PACKED cartons, plus its owning Client's rate fields"
    constants:
      FIRST_UNIT_INCLUDED: 1
      FIRST_CARTON_INCLUDED: 1
    precision: "integer cents, no fractional component"
    variants:
      - name: estimated_handling
        when: "Computed at PACK and written to Order.estimated_handling_cents."
        difference: "Unit-only basis (base + unit_component); carton surcharge is NOT applied; creates no BillingCharge."
      - name: billed_handling
        when: "Computed at SHIP and written to Order.billed_handling_cents."
        difference: "Adds carton_component for cartons beyond the first, so a multi-carton order is billed strictly more than its estimate; posts a HANDLING BillingCharge of exactly billed_handling_cents and credits Client.handling_balance_cents."

  - name: cartonization_size
    trigger: "Carton creation during Order PACK"
    algorithm: threshold
    formula: |
      fill_volume_cc = sum over packed units in the carton of Sku.unit_volume_cc
      Select the SMALLEST box whose inner_cc >= fill_volume_cc, evaluated in
      ascending box order SMALL, MEDIUM, LARGE:
        if fill_volume_cc <= SMALL_INNER_CC:  carton_size = SMALL
        elif fill_volume_cc <= MEDIUM_INNER_CC: carton_size = MEDIUM
        elif fill_volume_cc <= LARGE_INNER_CC:  carton_size = LARGE
        else: reject ERR_CARTON_OVERFLOW
      Boundary is inclusive: fill_volume_cc exactly == SMALL_INNER_CC is SMALL.
    input_set: "One Carton's packed units and their SKUs' unit_volume_cc"
    constants:
      SMALL_INNER_CC: 1000
      MEDIUM_INNER_CC: 5000
      LARGE_INNER_CC: 20000
    precision: "integer cubic centimetres"

  - name: rate_shop
    trigger: "Shipment label purchase (POST /shipments)"
    algorithm: weighted_scoring
    formula: |
      Eligibility filter (candidate set), evaluated BEFORE ranking:
        - GROUND_ECONOMY is EXCLUDED from the candidate set if ANY line SKU on the
          order has hazmat == true.
        - GROUND_PLUS and AIR_EXPRESS are always eligible.
      For each eligible carrier compute its PUBLISHED quote:
        published_cents = base_cents[carrier]
                          + per_zone_cents[carrier] * Order.ship_to_zone
                          + per_carton_cents[carrier] * (count of PACKED cartons on the order)
      Ranking is performed on the NEGOTIATED quote (see negotiated variant). The
      negotiated quote applies the client discount and then rounds. Pinned
      evaluation order (matters because discount-then-round != round-then-discount):
        1. compute published_cents (exact integer)
        2. negotiated_exact = published_cents * (10000 - Client.carrier_discount_bps) / 10000
        3. negotiated_cents = round_half_up(negotiated_exact) to an integer cent
      Ranking expression: choose the carrier with the LOWEST negotiated_cents.
      Tie-break when negotiated_cents ties: prefer the carrier earlier in the fixed
      precedence list [GROUND_ECONOMY, GROUND_PLUS, AIR_EXPRESS] (created_at/id never
      used). Empty candidate set is impossible (GROUND_PLUS always eligible).
      Winner sets Shipment.carrier; Shipment.quoted_cost_cents = winner's negotiated_cents.
    input_set: "The order's PACKED cartons, ship_to_zone, the hazmat flags of its line SKUs, and Client.carrier_discount_bps"
    constants:
      GROUND_ECONOMY: { base_cents: 300, per_zone_cents: 50, per_carton_cents: 100 }
      GROUND_PLUS:    { base_cents: 500, per_zone_cents: 40, per_carton_cents: 120 }
      AIR_EXPRESS:    { base_cents: 1200, per_zone_cents: 80, per_carton_cents: 150 }
    precision: "integer cents, round_half_up at step 3 only (single rounding, applied per-carrier after discount)"
    variants:
      - name: published_quote
        when: "The list-price quote a carrier would charge with no client agreement (carrier_discount_bps treated as 0)."
        difference: "No discount, no rounding step; equals base + zone + carton components exactly."
      - name: negotiated_quote
        when: "The quote actually stamped on Shipment.quoted_cost_cents at label purchase."
        difference: "Applies Client.carrier_discount_bps then round_half_up; for a client with a non-zero discount this is strictly less than the published quote, so the two variants diverge on the same Shipment inputs."

  - name: storage_charge
    trigger: "POST /clients/{clientId}/storage/accrue (daily storage sweep)"
    algorithm: aggregation
    formula: |
      occupied_pallets = count of Bin where bin_type == PALLET AND occupied_cc > 0
                         AND the bin holds >= 1 InventoryLot whose client_id == this client
      amount_cents = occupied_pallets * Client.storage_rate_per_pallet_cents * body.days
      A PALLET bin counts once for the client regardless of how many of that
      client's lots it holds. Bins holding zero of this client's units (occupied_cc
      contribution 0) do NOT count. body.days must be >= 1.
      Posts a STORAGE BillingCharge of amount_cents (source_order_id null).
    input_set: "All PALLET bins holding >=1 InventoryLot for the client, with occupied_cc > 0"
    constants:
      MIN_DAYS: 1
    precision: "integer cents"
    variants:
      - name: per_pallet_daily
        when: "Always; storage is billed strictly per occupied pallet-bin per day."
        difference: "Distinct conserved-quantity domain (storage_balance) from handling (handling_balance)."

  - name: cycle_count_variance
    trigger: "POST /clients/{clientId}/cycle-counts (immediate apply)"
    algorithm: aggregation
    formula: |
      Read on_hand_before = InventoryLot.on_hand_qty at apply time.
      variance_qty = counted_qty - on_hand_before
      Apply the correction conserving the reserved units:
        new_on_hand = counted_qty
        new_available = max(0, counted_qty - reserved_qty)   # reserved units are protected first
        reserved stays as-is unless counted_qty < reserved_qty, in which case
        reserved is clamped down to counted_qty (ERR_COUNT_BELOW_RESERVED is NOT
        raised; reserved is reduced and available floors at 0).
      Side effect: InventoryLot.version increments by 1 (cascade: Bin.occupied_cc recomputed).
    input_set: "One InventoryLot's on_hand_qty and reserved_qty"
    constants: {}
    precision: "integer units"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (client before nested resource)"
    error_id: "ERR_*_NOT_FOUND (per resource type)"
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "FK fields in the request body reference existing resources owned by the path client"
    error_id: "ERR_*_NOT_FOUND (per FK)"
    http_status: 404
    applies_to: "create endpoints with FK body fields"

  - priority: 5
    category: state
    check: "Target resource is in the required state for the requested transition"
    error_id: "varies (ERR_ORDER_NOT_PICKING, ERR_RECEIPT_NOT_RECEIVED, ERR_WAVE_NOT_BUILDING, etc.)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_lot_version equals the live InventoryLot.version on cycle-count apply"
    error_id: ERR_STALE_LOT_VERSION
    http_status: 412
    applies_to: "POST /clients/{clientId}/cycle-counts"

  - priority: 7
    category: business_referential
    check: "Cross-ownership integrity: Sku.client_id, InventoryLot.client_id, Order.client_id all match the path client; a lot's sku_id belongs to the same client"
    error_id: ERR_CLIENT_OWNERSHIP_MISMATCH
    http_status: 409
    applies_to: "receipts, orders, inventory-lots, cycle-counts, returns"

  - priority: 8
    category: business_safety
    check: "Hazmat routing: a SHIPMENT cannot be assigned GROUND_ECONOMY when any line SKU is hazmat (enforced inside rate-shop eligibility, but an explicit-carrier override is rejected)"
    error_id: ERR_HAZMAT_CARRIER_FORBIDDEN
    http_status: 409
    applies_to: "POST /clients/{clientId}/shipments"

  - priority: 9
    category: business_constraint
    check: "Bin status OPEN required for putaway, pick confirm, and sellable-return restock"
    error_id: ERR_BIN_BLOCKED
    http_status: 409
    applies_to: "putaway, pick confirm, return grade(SELLABLE)"

  - priority: 10
    category: business_temporal
    check: "Bin volume capacity (aggregate-capacity overlap): putaway or sellable-restock must not push Bin.occupied_cc above capacity_cc. Adjacency is allowed — occupied_cc may reach capacity_cc exactly (<=), only strictly-over is rejected."
    error_id: ERR_BIN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "putaway, return grade(SELLABLE)"

  - priority: 11
    category: business_temporal
    check: "Pallet exclusive occupancy (exclusive-occupancy overlap, distinct from volume capacity): a PALLET bin holds at most ONE client; putaway/restock of client B into a PALLET bin that already holds >=1 unit of client A's inventory is rejected even if volume capacity remains. GENERAL bins permit co-mingling and are exempt."
    error_id: ERR_PALLET_OCCUPIED_BY_OTHER_CLIENT
    http_status: 409
    applies_to: "putaway, return grade(SELLABLE) into a PALLET bin"

  - priority: 12
    category: business_constraint
    check: "Pack unit conservation: submitted carton packed_units sum to Order.total_units, each carton's fill fits LARGE"
    error_id: ERR_PACK_UNIT_MISMATCH
    http_status: 409
    applies_to: "POST /clients/{clientId}/orders/{orderId}/pack"

  - priority: 13
    category: business_fiscal
    check: "Inventory availability: at wave release every order line's qty must be coverable by available_qty across the client's lots for that SKU"
    error_id: ERR_INSUFFICIENT_INVENTORY
    http_status: 409
    applies_to: "POST /clients/{clientId}/waves/{waveId}/release"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

