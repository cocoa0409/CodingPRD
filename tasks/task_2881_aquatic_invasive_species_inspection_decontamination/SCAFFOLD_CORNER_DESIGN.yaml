              as: ProgramAdmin
            - call: "POST /inspection-stations/${st_id}/status"
              payload: { target_status: "OPEN" }
              as: ProgramAdmin
            - call: "POST /inspectors"
              payload: { full_name: "Ada Field", home_station_id: "${st_id}" }
              as: ProgramAdmin
              captures: { insp_a: $.data.id }
            - call: "POST /inspectors/${insp_a}/training-records"
              payload: { module_code: "AIS-101", hours: 8, passed: true }
              as: TrainingOfficer
            - call: "POST /watercraft"
              payload: { registration_number: "MT-0800", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 16 }
              as: ProgramAdmin
              captures: { wc_open: $.data.id }
            - call: "POST /watercraft"
              payload: { registration_number: "MT-1700", home_state_code: "MT", vessel_type: "OPEN_HULL", hull_length_ft: 16 }
              as: ProgramAdmin
              captures: { wc_close: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T08:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspection-records"
