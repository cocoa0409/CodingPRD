        excluded_because:
          difficulty_instance: resource_temporal_overlap / refurb_bay_window_conflict_uses_closed_interval_plus_sanitation_buffer
          rationale: "Asserted three times by the named §1.8 instance — touching end instant, sub-buffer gap after, and sub-buffer gap before."

      - name: error_rework_limit_exceeded_on_third_qc_failure
        claim_type: error_triggerability
        grounds: ["errors[ERR_REWORK_LIMIT_EXCEEDED]"]
        excluded_because:
          difficulty_instance: non_linear_state_machine / refurb_order_rework_cycle_reenters_in_progress_until_limit
          rationale: "Asserted as the third FAIL in the named §1.8 instance's cycle, after REWORK_LIMIT == 2 reworks are consumed."

      - name: error_refurb_not_viable_above_the_budget_cap
        claim_type: error_triggerability
        grounds: ["errors[ERR_REFURB_NOT_VIABLE]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / viability_ratio_exactly_at_tier_cap_is_still_viable
          rationale: "Asserted as the one-minor-unit-over side of the named §1.8 instance's boundary pair, whose at-cap side passes QC."

      - name: error_campaign_category_overlap_on_second_campaign
        claim_type: error_triggerability
        grounds: ["errors[ERR_CAMPAIGN_CATEGORY_OVERLAP]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / campaign_category_overlap_outranks_channel_capacity_exhaustion
          rationale: "Asserted as the winning error of the named §1.8 instance's double violation, and again as a one-day overlap in the half-open-window instance."

      - name: error_campaign_capacity_exceeded_on_third_campaign
        claim_type: error_triggerability
        grounds: ["errors[ERR_CAMPAIGN_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / campaign_category_overlap_outranks_channel_capacity_exhaustion
          rationale: "Asserted as the aggregate-only violation in the named §1.8 instance, where a BAG campaign has no category peer and MAX_CONCURRENT_CAMPAIGNS_PER_CHANNEL == 2 is exhausted."

      - name: error_min_cash_remainder_on_over_redeemed_order
        claim_type: error_triggerability
        grounds: ["errors[ERR_MIN_CASH_REMAINDER]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / cash_remainder_exactly_at_policy_minimum_is_accepted
          rationale: "Asserted as the 499-remainder side of the named §1.8 instance's boundary pair, whose exactly-500 side is accepted."

  - section: rbac
    instances:
      - name: program_admin_configuration_surface_is_exclusive
        claim_type: exclusive_operations_permitted
        grounds:
          - roles.ProgramAdmin.exclusive_operations
          - errors.ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: "Each of the four configuration creates is refused for a different non-admin role and then accepted for ProgramAdmin in the same run, so a blanket 403 or a blanket 201 both fail; the refusals leave no row behind, proven by the admin creates that follow succeeding on fresh codes."
        test_recipe:
          setup:
            - "Empty database; the four staff user ids intake-001, auth-001, tech-001 and merch-001 exist only as X-User-ID values."
          setup_api_calls: []
          trigger:
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes" }
              as: IntakeAgent
              as_user_id: "intake-001"
              captures: { e_cust: "$.data.error_id" }
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: MerchandisingManager
              as_user_id: "merch-001"
              captures: { e_grade: "$.data.error_id" }
