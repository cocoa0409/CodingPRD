  - rule_id: resource_temporal_overlap
    instances:
      - name: filing_slot_uses_half_open_intervals_and_permits_zero_gap_adjacency
        grounds:
          - calculations.insurance_coverage_interval_conflict
          - validations[priority=20]
          - errors[ERR_FILING_INTERVAL_OVERLAP]
          - state_machines.InsuranceFiling.ACTIVE_to_CANCELLED
          - entities.InsuranceFiling.fields.supersedes_filing_id
        distinguishing_aspect: |
          The (authority_id, filing_type) slot is governed by HALF-OPEN intervals
          [effective_at, cancellation_effective_at) with NO buffer: a same-instant
