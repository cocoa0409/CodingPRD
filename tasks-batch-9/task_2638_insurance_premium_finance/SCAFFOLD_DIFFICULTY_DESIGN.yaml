              as: ComplianceOfficer
              captures: { lic_1: "$.data.id" }
            - call: "POST /licenses/${lic_1}/suspend"
              payload: {}
              as: ComplianceOfficer
              captures: { lic_1_status: "$.data.status", lic_1_effective: "$.data.is_effective" }
            - call: "POST /insureds"
              payload: { legal_name: "Northwind Freight LLC", mailing_state_code: "TX", email: "ap@northwind.example" }
              as: FinanceAnalyst
              captures: { insured_1: "$.data.id" }
            - call: "POST /agents"
              payload: { agency_name: "Lone Star Brokers", state_code: "TX", agent_commission_bps: 1200, chargeback_basis: "COMMISSION_CAPPED", chargeback_liability_cap_cents: 500000, initial_reserve_balance_cents: 100000 }
              as: ComplianceOfficer
              captures: { agent_1: "$.data.id" }
          trigger:
