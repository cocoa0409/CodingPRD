      - name: approval_cascades_license_mint_to_permit_conversion_to_conversion_credit
        grounds:
          - state_machines.LicenseApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.TemporaryPermit.ACTIVE_to_CONVERTED
          - calculations.permit_conversion_credit_cents
          - calculations.processing_time_metrics
          - entities.License.fields.converted_from_permit_id
          - entities.License.fields.license_number
        distinguishing_aspect: |
          The approval decision mints a License, whose creation is what converts the outstanding
          TemporaryPermit, whose conversion is what emits the pro-rated CONVERSION_CREDIT ledger entry
          (-2950 from 59 unused of 90 permit days on a 4500-cent permit fee), driving
          fee_balance_cents negative. Three hops, and the credit amount is a function of the clock at
          approval time rather than of anything on the decision payload.
        test_recipe:
          setup:
            - "Profession PT (standard_processing_days 60, permit_fee_cents 9000, exam_fee_cents 6000, requirement_hours_total 200.0, critical_scope_elements empty, jurisprudence_exam_required false)."
            - "Applicant with military_status VETERAN so statutory_waiver_pct is 0.50 on a 48000 gross."
            - "Credential grants all three required scope elements with practice_hours 1000 of 1000, verified good standing."
            - "Two verified MOS_TRAINING records of 133 and 137 documented hours are awarded, satisfying requirement_hours_total exactly."
            - "The CredentialEvaluation is finalized EQUIVALENT/CLEAR with equivalency_score 100.00 and exam_waiver_granted true."
            - "The applicant pays the balance to 0, receives an ACTIVE permit effective 2026-08-01 expiring 2026-10-30, and pays the 4500 permit fee down to 0."
