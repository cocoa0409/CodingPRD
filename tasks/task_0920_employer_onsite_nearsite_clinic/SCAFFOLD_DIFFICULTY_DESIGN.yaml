              as: ClinicManager
              captures: { clin_id: $.data.id }
            - call: "POST /staffing-shifts"
              payload: { site_id: "${site_id}", provider_id: "${clin_id}", shift_start: "2026-06-08T08:00:00Z", shift_end: "2026-06-08T17:00:00Z", coverage_role: "PRIMARY_CARE" }
              as: ClinicManager
            - call: "POST /eligibility-records"
              payload: { employer_id: "${emp_id}", subscriber_external_id: "S-2301", member_external_id: "M-2301", tier: "EMPLOYEE", effective_date: "2026-01-01" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { elig_id: $.data.id }
            - call: "POST /participants"
              payload: { employer_id: "${emp_id}", eligibility_record_id: "${elig_id}", display_name: "Slot Tester" }
              as: EmployerBenefitsAdmin
              as_user_id: "${emp_id}"
              captures: { p_id: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { sv1: $.data.version }
            - call: "POST /appointments"
              payload: { participant_id: "${p_id}", site_id: "${site_id}", provider_id: "${clin_id}", visit_type: "PRIMARY_CARE", scheduled_start: "2026-06-08T09:00:00Z", expected_site_version: "${sv1}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { a1: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { sv2: $.data.version }
            - call: "POST /appointments"
              payload: { participant_id: "${p_id}", site_id: "${site_id}", provider_id: "${clin_id}", visit_type: "PRIMARY_CARE", scheduled_start: "2026-06-08T09:30:00Z", expected_site_version: "${sv2}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { a2: $.data.id }
            - call: "GET /sites/${site_id}"
              payload: {}
              as: Participant
              as_user_id: "${p_id}"
              captures: { sv3: $.data.version }
            - call: "POST /appointments"
              payload: { participant_id: "${p_id}", site_id: "${site_id}", provider_id: "${clin_id}", visit_type: "PRIMARY_CARE", scheduled_start: "2026-06-08T10:00:00Z", expected_site_version: "${sv3}" }
              as: Participant
              as_user_id: "${p_id}"
              captures: { a3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T11:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /appointments/${a1}/cancel"
