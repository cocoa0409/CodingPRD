            - "class 103 -> ${class102_id} -> ${class101_id} is a legal two-hop chain -> 201 with ShowClass.${class103_id}.qualifier_for_class_id == ${class102_id}"
            - "GET /classes?division_id=${div_j2_id} returns total_count == 0"

