            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-Z1", name: "Zone One Loop", service_mode: "DUAL", design_supply_temp_c: 95.0, max_pressure_kpa: 1600.0, rated_capacity_kw: 9000.0 }
              as: SystemController
              captures: { loop_z1_id: $.data.id }
          trigger:
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "00000000-0000-0000-0000-0000000000aa", code: "SEG-ORPHAN", length_m: 400.0, diameter_mm: 200, install_year: 2014, insulation_class: "A", buried_depth_m: 1.4 }
