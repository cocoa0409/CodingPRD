# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Nine Difficulty Rules (§0.5) × ≥2 grounded instances each.
# All numeric asserts pre-computed against §1.3 formulas + constants.
# Canonical config used throughout (unless an instance overrides):
#   program: base_earn_rate=1.0, point_value_cents=1.0, lot_expiration_months=12,
#            qualifying_window_months=12, birthday_reward_points=200,
#            referral_referrer_points=500, referral_referee_points=250,
#            referral_min_qualifying_cents=10000
#   tiers:  STANDARD(thr=0, earn=1.0, ratio=0.5, rank=0)
#           SILVER (thr=2000, earn=1.25, ratio=0.6, rank=1)
#           GOLD   (thr=5000, earn=1.5,  ratio=0.8, rank=2)
#           PLATINUM(thr=12000, earn=2.0, ratio=1.0, rank=3)
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: member_available_vs_projected_balance_diverge
        grounds:
          - calculations.member_balance
          - entities.Member.fields.available_points
          - entities.Member.fields.projected_points
          - state_machines.PointsLot.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          On the Member entity domain: available_points counts an ACTIVE-but-past-expiry lot
          while projected_points excludes it, so available=900 and projected=300 for the same data.
        test_recipe:
          setup:
            - "ACTIVE program; member M with one lot of 600 created 2026-01-15 (expires 2027-01-15) and one lot of 300 created 2026-02-15 (expires 2027-02-15)."
            - "Clock advanced to 2027-02-01: the 600-lot is past expiry (unswept), the 300-lot is still live. No sweep run yet."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 60000 }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 30000 }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /members/${m_id}"
              payload: {}
              as: ProgramAdmin
              captures: { avail: $.data.available_points, proj: $.data.projected_points }
          assert:
            - "Member.${m_id}.available_points == 900"
            - "Member.${m_id}.projected_points == 300"
            - "Member.${m_id}.available_points != Member.${m_id}.projected_points"

      - name: redemption_quoted_vs_final_cost_diverge_on_tier_crossing
        grounds:
          - calculations.redemption_cost
          - entities.Redemption.fields.quoted_cost_points
          - entities.Redemption.fields.final_cost_points
          - state_machines.Redemption.CONFIRMED_to_FULFILLED
        distinguishing_aspect: |
          On the Redemption entity domain: quoted_cost_points=1000 is computed at SILVER (no GOLD discount),
          final_cost_points=800 is recomputed at GOLD after the member crossed the boundary, so quoted != final.
        test_recipe:
          setup:
            - "ACTIVE program; reward R point_cost=1000, tier_discount_pct=0.2, stock=5."
            - "Member M is SILVER (qualifying 2000..4999) at quote time, then crosses to GOLD (>=5000) before fulfill."
            - "M has >= 1000 available points so confirm succeeds."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "SILVER", qualify_threshold: 2000, earn_multiplier: 1.25, transfer_ratio: 0.6, rank: 1 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "GOLD", qualify_threshold: 5000, earn_multiplier: 1.5, transfer_ratio: 0.8, rank: 2 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/rewards"
              payload: { program_id: "${prog_id}", name: "R", point_cost: 1000, tier_discount_pct: 0.2, stock: 5 }
              as: ProgramAdmin
              captures: { reward_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 300000 }
              as: ProgramAdmin
            - call: "POST /redemptions"
              payload: { member_id: "${m_id}", lines: [ { reward_id: "${reward_id}", quantity: 1 } ] }
              as: ProgramAdmin
              captures: { red_id: $.data.id, quoted: $.data.quoted_cost_points }
            - call: "GET /members/${m_id}"
              payload: {}
              as: ProgramAdmin
              captures: { m_v1: $.data.version }
            - call: "POST /redemptions/${red_id}/confirm"
              payload: { expected_member_version: "${m_v1}" }
              as: ProgramAdmin
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 200000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /redemptions/${red_id}/fulfill"
              payload: {}
              as: ProgramAdmin
              captures: { final: $.data.final_cost_points }
          assert:
            - "Redemption.${red_id}.quoted_cost_points == 1000"
            - "Redemption.${red_id}.final_cost_points == 800"
            - "Redemption.${red_id}.quoted_cost_points != Redemption.${red_id}.final_cost_points"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: earn_points_four_input_nested_multipliers_mode_a
        grounds:
          - calculations.purchase_earn_points
          - entities.PurchaseEvent.fields.earned_points
          - entities.Tier.fields.earn_multiplier
          - entities.Promotion.fields.bonus_multiplier
        distinguishing_aspect: |
          MODE (a): earned_points = floor((cents/100) * base_earn_rate * tier_multiplier * promo_multiplier)
          combines 4 inputs with a single trailing floor; floor(123.45*1*1.5*2.0)=370.
        test_recipe:
          setup:
            - "ACTIVE program base_earn_rate=1.0; member already GOLD (earn_multiplier 1.5)."
            - "An ACTIVE promotion bonus_multiplier=2.0 covers the purchase instant 2026-06-15 with min_eligible_cents=0."
            - "Purchase eligible_amount_cents=12345."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "SILVER", qualify_threshold: 2000, earn_multiplier: 1.25, transfer_ratio: 0.6, rank: 1 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "GOLD", qualify_threshold: 5000, earn_multiplier: 1.5, transfer_ratio: 0.8, rank: 2 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/promotions"
              payload: { program_id: "${prog_id}", name: "DBL", bonus_multiplier: 2.0, starts_at: "2026-06-01T00:00:00Z", ends_at: "2026-07-01T00:00:00Z", min_eligible_cents: 0 }
              as: ProgramAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 500000 }
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/refresh-promotions"
              payload: {}
              as: ProgramAdmin
          trigger:
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 12345 }
              as: ProgramAdmin
              captures: { earned: $.data.earned_points, applied: $.data.applied_promotion_id }
          assert:
            - "PurchaseEvent.earned_points == 370"
            - "PurchaseEvent.applied_promotion_id == ${promo_id}"

      - name: redemption_line_round_then_sum_mode_b
        grounds:
          - calculations.redemption_line_rounding
          - calculations.redemption_cost
          - entities.RedemptionLine.fields.line_cost_points
          - entities.Redemption.fields.quoted_cost_points
        distinguishing_aspect: |
          MODE (b): round_half_up PER LINE then sum gives 51+51=102, whereas sum-then-round gives 101.
          The scaffold pins round-then-sum, so quoted_cost_points==102 distinguishes the order.
        test_recipe:
          setup:
            - "ACTIVE program; member is GOLD (rank 2 >= GOLD) so tier_discount applies."
            - "Reward R1 point_cost=101 tier_discount_pct=0.5 stock=9; reward R2 point_cost=101 tier_discount_pct=0.5 stock=9."
            - "Redemption has two lines, one per reward, qty 1 each."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "GOLD", qualify_threshold: 5000, earn_multiplier: 1.5, transfer_ratio: 0.8, rank: 2 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/rewards"
              payload: { program_id: "${prog_id}", name: "R1", point_cost: 101, tier_discount_pct: 0.5, stock: 9 }
              as: ProgramAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /programs/${prog_id}/rewards"
              payload: { program_id: "${prog_id}", name: "R2", point_cost: 101, tier_discount_pct: 0.5, stock: 9 }
              as: ProgramAdmin
              captures: { r2_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 500000 }
              as: ProgramAdmin
          trigger:
            - call: "POST /redemptions"
              payload: { member_id: "${m_id}", lines: [ { reward_id: "${r1_id}", quantity: 1 }, { reward_id: "${r2_id}", quantity: 1 } ] }
              as: ProgramAdmin
              captures: { red_id: $.data.id, quoted: $.data.quoted_cost_points }
          assert:
            - "Redemption.${red_id}.quoted_cost_points == 102"
            - "RedemptionLine for ${r1_id} has line_cost_points == 51"
            - "RedemptionLine for ${r2_id} has line_cost_points == 51"

      - name: partner_transfer_ratio_from_tier_mode_c
        grounds:
          - calculations.partner_transfer_conversion
          - calculations.tier_evaluation
          - entities.PartnerTransfer.fields.partner_points
          - entities.Tier.fields.transfer_ratio
        distinguishing_aspect: |
          MODE (c): partner_points depends on transfer_ratio depends on current_tier_code depends on the
          qualifying window — evaluation order pinned tier-first; floor(1000 * 0.8 GOLD ratio)=800.
        test_recipe:
          setup:
            - "ACTIVE program; member is GOLD (transfer_ratio 0.8); partner P block_size=100 min_transfer=100, ACTIVE."
            - "Member has >= 1000 available points."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "GOLD", qualify_threshold: 5000, earn_multiplier: 1.5, transfer_ratio: 0.8, rank: 2 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/partners"
              payload: { program_id: "${prog_id}", name: "Air", transfer_block_size: 100, min_transfer_points: 100 }
              as: ProgramAdmin
              captures: { partner_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 500000 }
              as: ProgramAdmin
            - call: "GET /members/${m_id}"
              payload: {}
              as: ProgramAdmin
              captures: { m_v: $.data.version }
          trigger:
            - call: "POST /partner-transfers"
              payload: { member_id: "${m_id}", partner_account_id: "${partner_id}", loyalty_points: 1000, expected_member_version: "${m_v}" }
              as: ProgramAdmin
              captures: { xfer_id: $.data.id, ppts: $.data.partner_points }
          assert:
            - "PartnerTransfer.${xfer_id}.partner_points == 800"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: redemption_fork_join_confirmed_branches_to_fulfilled_or_cancelled
        grounds:
          - state_machines.Redemption.QUOTED_to_CONFIRMED
          - state_machines.Redemption.CONFIRMED_to_FULFILLED
          - state_machines.Redemption.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Redemption is fork-join: CONFIRMED branches to FULFILLED (stock decrement, final cost) OR
          CANCELLED (compensating mint) with divergent side-effect sets — verified the CANCELLED branch refunds.
        test_recipe:
          setup:
            - "ACTIVE program reward R point_cost=600 stock=5; member GOLD-or-any with >= 600 available; redemption QUOTED then CONFIRMED."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/rewards"
              payload: { program_id: "${prog_id}", name: "R", point_cost: 600, tier_discount_pct: 0.0, stock: 5 }
              as: ProgramAdmin
              captures: { reward_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "m@x.com", full_name: "M", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { m_id: $.data.id }
            - call: "POST /purchase-events"
              payload: { member_id: "${m_id}", eligible_amount_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /redemptions"
              payload: { member_id: "${m_id}", lines: [ { reward_id: "${reward_id}", quantity: 1 } ] }
              as: ProgramAdmin
              captures: { red_id: $.data.id }
            - call: "GET /members/${m_id}"
              payload: {}
              as: ProgramAdmin
              captures: { m_v: $.data.version }
            - call: "POST /redemptions/${red_id}/confirm"
              payload: { expected_member_version: "${m_v}" }
              as: ProgramAdmin
          trigger:
            - call: "POST /redemptions/${red_id}/cancel"
              payload: {}
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "Redemption.${red_id}.status == CANCELLED"
            - "Member.${m_id}.available_points == 1000"

      - name: referral_branches_pending_to_completed_or_revoked
        grounds:
          - state_machines.Referral.PENDING_to_COMPLETED
          - state_machines.Referral.PENDING_to_REVOKED
          - state_machines.Referral.PENDING_to_EXPIRED
        distinguishing_aspect: |
          Referral (different entity) is branching: PENDING forks to COMPLETED (grants points),
          REVOKED (no grant), or EXPIRED (no grant) — verified the REVOKED branch grants nothing.
        test_recipe:
          setup:
            - "ACTIVE program; referrer member exists; a PENDING referral created for a referee_email."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "ref@x.com", full_name: "Ref", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { referrer_id: $.data.id }
            - call: "POST /referrals"
              payload: { program_id: "${prog_id}", referrer_member_id: "${referrer_id}", referee_email: "friend@x.com" }
              as: ProgramAdmin
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /referrals/${ref_id}/revoke"
              payload: {}
              as: ProgramAdmin
              captures: { st: $.data.status }
          assert:
            - "Referral.${ref_id}.status == REVOKED"
            - "Member.${referrer_id}.available_points == 0"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: purchase_completes_referral_mints_two_lots_recomputes_balances_depth3
        grounds:
          - state_machines.Referral.PENDING_to_COMPLETED
          - calculations.purchase_earn_points
          - calculations.member_balance
          - entities.PointsLot.fields.source_type
        distinguishing_aspect: |
          Depth-3 chain from POST /purchase-events: (1) referee purchase mints an EARN_PURCHASE lot; that
          purchase (2) flips the matching PENDING Referral to COMPLETED; COMPLETED (3) mints a REFERRAL lot
          to BOTH referrer and referee; minting (4) recomputes both members' balances. Each link causes the next.
        test_recipe:
          setup:
            - "ACTIVE program referral_min_qualifying_cents=10000, referrer_points=500, referee_points=250."
            - "Referrer R registered; referee F registered with referred_by_member_id=R; a PENDING referral links them (referee_member_id=F)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "P", base_earn_rate: 1.0, point_value_cents: 1.0, lot_expiration_months: 12, qualifying_window_months: 12, birthday_reward_points: 200, referral_referrer_points: 500, referral_referee_points: 250, referral_min_qualifying_cents: 10000 }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/tiers"
              payload: { program_id: "${prog_id}", code: "STANDARD", qualify_threshold: 0, earn_multiplier: 1.0, transfer_ratio: 0.5, rank: 0 }
              as: ProgramAdmin
            - call: "POST /programs/${prog_id}/activate"
              payload: {}
              as: ProgramAdmin
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "ref@x.com", full_name: "Ref", birth_month_day: "03-10" }
              as: ProgramAdmin
              captures: { referrer_id: $.data.id }
            - call: "POST /referrals"
              payload: { program_id: "${prog_id}", referrer_member_id: "${referrer_id}", referee_email: "friend@x.com" }
              as: ProgramAdmin
              captures: { ref_id: $.data.id }
            - call: "POST /members"
              payload: { program_id: "${prog_id}", email: "friend@x.com", full_name: "Friend", birth_month_day: "04-20", referred_by_member_id: "${referrer_id}" }
