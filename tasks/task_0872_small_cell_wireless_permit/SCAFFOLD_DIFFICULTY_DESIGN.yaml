          - entities.SupportStructure.fields.max_collocations
        distinguishing_aspect: |
          Conserved quantity = physical slots: reserved_collocations + active_collocations +
          available_collocations == max_collocations (2). A design PASS (reserve 0->1) paired with the
          compensating release on aesthetic FAIL (reserve 1->0) returns reserved_collocations to 0.
        test_recipe:
          setup:
