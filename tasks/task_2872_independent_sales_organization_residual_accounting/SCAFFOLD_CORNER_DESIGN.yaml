      - name: restructure_reports_advance_state_before_the_conditional_shape_rule
        claim_type: Cascading validation
        grounds:
          - validations[priority 9 / ERR_ADVANCE_STATE_INVALID]
          - validations[priority 9 / conditional shape rule / ERR_INVALID_REQUEST]
          - validations[priority 11 / ERR_RECOUPMENT_WINDOW_INVALID]
          - endpoints.POST /agent-advances/{id}/restructure
        distinguishing_aspect: "One payload violates both the state rule and the conditional shape rule: a RECOUPED advance switched to STRAIGHT_LINE_AMORTIZATION with no amortization_months must report ERR_ADVANCE_STATE_INVALID, not ERR_INVALID_REQUEST. The identical payload against an ACTIVE advance then reports the shape error, and a shape-complete payload whose month span disagrees with amortization_months reports the priority-11 window error — three different errors from one endpoint."
        test_recipe:
          setup: ["Agent A1 with advance ADV_A (PERCENT_OF_RESIDUAL, principal 5000, pct 0.50, window 2026-07..2027-06) which is fully RECOUPED by issuing the 2026-07 statement (G 20000, tier 0.25, cap 5000), and advance ADV_B (PERCENT_OF_RESIDUAL, principal 100000, pct 0.30, window 2026-09..2027-08) which stays ACTIVE because its window starts after the issued period."]
          setup_api_calls:
            - call: "POST /processor-programs"
              payload: { name: "Atlantic Net Program", buy_rate_bps: 45, buy_rate_per_item_cents: 6, assessment_bps: 13, normalization_mode: "NET_REVENUE_SPLIT", minimum_billing_mode: "NO_MINIMUM" }
              as: IsoAdmin
              captures: { p1: $.data.id }
            - call: "POST /agents"
              payload: { name: "A1 Principal", split_pct: 0.50, override_pct: 0.60, vesting_start_date: "2024-01-15" }
              as: IsoAdmin
              captures: { a1: $.data.id, v1: $.data.version }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 5000, recoupment_pct: 0.50, first_recoupment_month: "2026-07", last_recoupment_month: "2027-06", funded_on: "2026-06-01", expected_agent_version: "${v1}" }
              as: IsoAdmin
              captures: { advA: $.data.id }
            - call: "GET /agents/${a1}"
              payload: {}
              as: IsoAdmin
              captures: { v2: $.data.version }
            - call: "POST /agents/${a1}/advances"
              payload: { advance_type: "CASH_ADVANCE", recoupment_mode: "PERCENT_OF_RESIDUAL", principal_cents: 100000, recoupment_pct: 0.30, first_recoupment_month: "2026-09", last_recoupment_month: "2027-08", funded_on: "2026-08-01", expected_agent_version: "${v2}" }
              as: IsoAdmin
              captures: { advB: $.data.id }
            - call: "POST /merchants"
              payload: { owning_agent_id: "${a1}", processor_program_id: "${p1}", mid: "MID-9001", monthly_minimum_cents: 0, per_transaction_fee_cents: 10, equipment_lease_monthly_cents: 0, boarded_on: "2026-04-10" }
              as: IsoAdmin
              captures: { m1: $.data.id }
            - call: "POST /merchants/${m1}/activate"
              payload: {}
              as: IsoAdmin
            - call: "POST /residual-batches"
              payload: { processor_program_id: "${p1}", period_month: "2026-07", coverage_start: "2026-07-01", coverage_end: "2026-08-01", file_checksum: "sha256:rs-0001" }
              as: ResidualAnalyst
              captures: { b1: $.data.id }
            - call: "POST /residual-batches/${b1}/lines"
              payload: { merchant_id: "${m1}", transaction_count: 100, sales_volume_cents: 1000000, interchange_cents: 0, assessments_cents: 0, gross_income_cents: 45100 }
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/normalize"
              payload: {}
              as: ResidualAnalyst
            - call: "POST /residual-batches/${b1}/post"
              payload: {}
              as: ResidualController
            - call: "GET /agent-statements"
              payload: { agent_id: "${a1}", period_month: "2026-07" }
              as: ResidualController
              captures: { st: "$.data[0].id" }
            - call: "POST /agent-statements/${st}/issue"
              payload: {}
              as: ResidualController
          trigger:
            - call: "POST /agent-advances/${advA}/restructure"
              payload: { recoupment_mode: "STRAIGHT_LINE_AMORTIZATION" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e1: $.data.error_id }
            - call: "POST /agent-advances/${advB}/restructure"
              payload: { recoupment_mode: "STRAIGHT_LINE_AMORTIZATION" }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e2: $.data.error_id }
            - call: "POST /agent-advances/${advB}/restructure"
              payload: { recoupment_mode: "STRAIGHT_LINE_AMORTIZATION", amortization_months: 12, last_recoupment_month: "2027-08" }
              as: IsoAdmin
            - call: "POST /agent-advances/${advB}/restructure"
              payload: { amortization_months: 11 }
              as: IsoAdmin
              is_negative_trigger: true
              captures: { e3: $.data.error_id }
          assert:
            - "the issue recouped ADV_A in full: AgentAdvance.${advA}.state == RECOUPED, outstanding_cents == 0, cumulative_recouped_cents == 5000, months_recouped == 1, and AgentStatement.${st}.advance_recoupment_cents == 5000 with net_payable_cents == 15000"
            - "AgentAdvance.${advB}.state == ACTIVE, outstanding_cents == 100000, months_recouped == 0 — its window opens in 2026-09"
            - "${e1} == ERR_ADVANCE_STATE_INVALID with HTTP 409 — the priority-9 state check runs BEFORE the conditional shape rule, even though amortization_months is also missing"
            - "${e2} == ERR_INVALID_REQUEST with HTTP 422 — the same payload against an ACTIVE advance now reaches the shape rule, which requires amortization_months for STRAIGHT_LINE_AMORTIZATION"
            - "the third call returns 200: AgentAdvance.${advB}.recoupment_mode == STRAIGHT_LINE_AMORTIZATION, amortization_months == 12, last_recoupment_month == 2027-08 — [2026-09, 2027-08] is exactly 12 inclusive months"
            - "${e3} == ERR_RECOUPMENT_WINDOW_INVALID with HTTP 422 — the shape rule passes (amortization_months present) so the priority-11 span rule is what refuses 11 against a 12-month window"
            - "AgentAdvance.${advA} was never mutated: recoupment_mode is still PERCENT_OF_RESIDUAL and recoupment_pct 0.50"

      - name: payout_floor_refuses_one_cent_below_and_admits_the_floor_exactly
        claim_type: Violation → Error
        grounds:
