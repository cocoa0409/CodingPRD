            - call: "POST /feedlot/lots"
              payload: { owner_id: "${o_id}", lot_number: "L-VD1", sex_class: "STEER", head_count_in: 5, in_weight_total_lbs: 3500, purchase_cost_cents: 700000, arrival_date: "2026-08-01" }
