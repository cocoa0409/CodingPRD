              as: System
            - call: "POST /creditors"
              payload: { name: "Cred", commission_rate_bps: 2500 }
              as: Creditor
              captures: { cred: $.data.id }
            - call: "POST /consumers"
              payload: { full_name: "Deb", timezone_offset_minutes: 0 }
              as: Collector
              captures: { con: $.data.id }
            - call: "POST /accounts"
              payload: { creditor_id: "${cred}", consumer_id: "${con}", original_principal_cents: 100000, charge_off_date: "2025-06-01T00:00:00Z", sol_years: 6 }
              as: Creditor
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/send-validation-notice"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/begin-work"
              payload: {}
              as: Collector
            - call: "POST /accounts/${acct}/disputes"
