            - call: "POST /contracts"
              payload: { team_id: "${f_id}", player_id: "${pf_id}", base_salary_cents: 10000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${f_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${g_id}", player_id: "${pg_id}", base_salary_cents: 12000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${g_id}"
              captures: { c2_id: $.data.id }
            - call: "POST /contracts"
              payload: { team_id: "${g_id}", player_id: "${pg3_id}", base_salary_cents: 3000000, contract_type: "STANDARD", term_start: "2026-01-01T00:00:00.000Z", term_end: "2026-12-31T00:00:00.000Z" }
              as: TeamGM
              as_user_id: "${g_id}"
              captures: { c3_id: $.data.id }
            - call: "POST /trades"
              payload: { season_id: "${season_id}", from_team_id: "${f_id}", to_team_id: "${g_id}", contract_ids_out: ["${c1_id}"], contract_ids_in: ["${c2_id}"] }
              as: TeamGM
              as_user_id: "${f_id}"
              captures: { tr_id: $.data.id }
            - call: "GET /teams/${g_id}"
              as: LeagueCommissioner
              captures: { g_v_stale: $.data.version }
            - call: "POST /contracts/${c3_id}/waive"
              payload: { expected_team_version: "${g_v_stale}" }
              as: TeamGM
              as_user_id: "${g_id}"
          trigger:
            - call: "POST /trades/${tr_id}/accept"
              payload: { expected_to_team_version: "${g_v_stale}" }
              as: TeamGM
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
      - name: sponsorship_distribute_stale_version_rejected
        grounds:
          - concurrency_rules[distribute-stale-sponsorship]
          - endpoints["POST /sponsorships/{id}/distribute"]
          - entities.Sponsorship.fields.version
        distinguishing_aspect: |
          OCC on Sponsorship.version (different parent than the trade-accept OCC):
          a distribute carrying expected_sponsorship_version one below the current
          version (${spo_v} - 1) is rejected with ERR_STALE_VERSION (412); the
          pool is never distributed.
        test_recipe:
          setup:
            - "Season with >=1 team; Sponsorship PENDING with current version captured as spo_v."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "S", salary_cap_cents: 50000000 }
              as: LeagueCommissioner
              captures: { season_id: $.data.id }
            - call: "POST /teams"
              payload: { season_id: "${season_id}", name: "A", market_size_weight: 1 }
              as: LeagueCommissioner
              captures: { a_id: $.data.id }
            - call: "POST /sponsorships"
              payload: { season_id: "${season_id}", sponsor_name: "Acme", pool_cents: 10000000, league_share_pct: 0.40 }
              as: LeagueCommissioner
              captures: { spo_id: $.data.id, spo_v: $.data.version }
          trigger:
            - call: "POST /sponsorships/${spo_id}/distribute"
              payload: { expected_sponsorship_version: "${spo_v} - 1" }
              as: LeagueCommissioner
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"
            - "Sponsorship.${spo_id}.status == PENDING"
