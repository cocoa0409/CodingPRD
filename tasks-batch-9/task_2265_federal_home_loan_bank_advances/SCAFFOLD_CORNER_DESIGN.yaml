            captures: { error_code: "$.data.error_id" }
          assert:
            - "HTTP 412 with data.error_id == \"ERR_STALE_MEMBER_VERSION\""
            - "the outgoing HELOC is still ELIGIBLE (not SUBSTITUTED) and no replacement row exists"
            - "the identical request carrying ${ver_fresh} succeeds and marks the outgoing asset SUBSTITUTED"

      - name: member_bank_version_increments_on_every_write
        claim_type: optimistic_concurrency
        grounds: ["entities.MemberBank.version", "state_machines (every transition increments MemberBank.version by 1)"]
        distinguishing_aspect: "The version must advance on writes that reach the member indirectly (a child asset's eligibility decision, a subscription issue) and not only on direct member endpoints, otherwise a stale client could not detect a capacity change."
        test_recipe:
          setup: ["Harbor Savings exists with an executed BLANKET_LIEN pledge and one submitted SF_MORTGAGE."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id", ver_0: "$.data.version" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_after_issue: "$.data.version" }
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
            payload: {}
            as: CreditOfficer
          assert:
            - "the member's version is 1 at creation, strictly greater after the subscription issue, strictly greater again after the pledge agreement and again after the eligibility decision"
            - "each of those four writes increments the version by exactly 1"
            - "read-only calls (any GET) never change the version"
            - "the eligibility decision proves a write to a CHILD entity still bumps the parent version, because it changed lendable_collateral_value_cents"

      - name: verification_haircut_band_resets_to_zero_after_a_clean_review
        claim_type: rate_threshold_reset
        grounds: ["calculations.verification_exception_rate", "entities.MemberBank.verification_haircut_bps", "state_machines.CollateralVerificationReview FINDINGS_ISSUED -> CLOSED"]
        distinguishing_aspect: "The haircut is a level, not a ratchet: a second, clean review must drive verification_haircut_bps from 700 back to 0 and restore every asset's factor, which distinguishes a recomputed band from an accumulated penalty."
        test_recipe:
          setup:
            - "Harbor Savings tier 1, ACTIVE, BLANKET_LIEN, one ELIGIBLE SF_MORTGAGE at factor 7800 / lendable 15,600,000, haircut 0."
            - "Review R1 over [2026-08-01, 2026-08-10) with sample_size 20 collects four MINOR findings, all left OPEN, and is closed: weighted score 4 * 0.25 = 1.0, exception rate exactly 5.00 percent, haircut band 700 bps, outcome QUALIFIED."
            - "MINOR findings never suspend an asset, so the asset stays ELIGIBLE and is merely repriced to 7800 - 700 = 7100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
