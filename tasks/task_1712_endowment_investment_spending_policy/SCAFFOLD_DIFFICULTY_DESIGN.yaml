            - "Fund.${rc_fund}.spending_posture == SPENDING_SUSPENDED"

  # ---------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (two different category pairs)
  # ---------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: approve_projected_underwater_returns_409_state_over_422_safety
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_UNDERWATER_SPENDING_BLOCKED]
        distinguishing_aspect: |
          Category pair (state vs business_safety): one request violates both — the
          distribution is PROJECTED (approve requires PROPOSED) AND the fund is underwater
          with no exception. The state error ERR_INVALID_STATE_TRANSITION (priority 6) must
          win over ERR_UNDERWATER_SPENDING_BLOCKED (priority 10).
        test_recipe:
          setup:
            - "Pool with allocation, policy ADOPTED, engaged manager, ACTIVE fund FPC1 holding 100000000000 micro-units (HGV 10000000); Q2 finalized at price 40000 so the fund is underwater; an FY2026 distribution exists in PROJECTED (never proposed)"
