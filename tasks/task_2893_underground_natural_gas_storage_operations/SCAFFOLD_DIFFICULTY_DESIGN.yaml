              captures: { e1: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-19T14:00:00Z" }
              as: SchedulingCoordinator
            - call: "POST /nominations/${n1}/submit"
              payload: {}
              as: Shipper
