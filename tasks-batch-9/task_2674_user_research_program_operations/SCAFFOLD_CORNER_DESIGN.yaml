  - section: endpoints
    instances:
      - name: theme_create_read_and_list_round_trip
        claim_type: Standard CRUD
        grounds:
          - endpoints[POST /themes]
          - endpoints[GET /themes/{id}]
          - endpoints[GET /themes]
        distinguishing_aspect: "The repository index is the only list endpoint with a non-created_at primary sort: evidence_weight DESC then created_at ASC, and it has to hold that order while every theme still sits at 0.00."
        test_recipe:
          setup:
            - "Three themes: two roots and one child of the first root"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
            - call: "POST /themes"
              payload: { label: "Navigation" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { th_1: $.data.id }
            - call: "POST /themes"
              payload: { label: "Notifications" }
              as: ResearchLead
              as_user_id: "u_lead_1"
              captures: { th_2: $.data.id }
            - call: "POST /themes"
              payload: { label: "Navigation / search", parent_theme_id: "${th_1}" }
              as: Researcher
              as_user_id: "u_res_1"
              captures: { th_3: $.data.id }
          trigger:
            - call: "GET /themes/${th_3}"
              payload: {}
              as: Stakeholder
              as_user_id: "u_stake_1"
            - call: "GET /themes"
              payload: { limit: 2, offset: 0 }
              as: PrivacyOfficer
              as_user_id: "u_priv_1"
            - call: "GET /themes"
              payload: { limit: 2, offset: 2 }
              as: PrivacyOfficer
              as_user_id: "u_priv_1"
            - call: "GET /themes"
              payload: { parent_theme_id: "${th_1}" }
              as: Researcher
              as_user_id: "u_res_1"
            - call: "GET /themes"
              payload: { label_contains: "Navigation", status: "EMERGING" }
              as: Researcher
              as_user_id: "u_res_1"
          assert:
            - "The single read returns label 'Navigation / search', parent_theme_id == ${th_1}, depth == 2, status == EMERGING, own_evidence_weight == 0.00, evidence_weight == 0.00, reuse_count == 0 and version == 1"
            - "The first page returns 2 rows with total_count == 3 and has_more == true, ordered ${th_1} then ${th_2} - all weights tie at 0.00 so created_at ASC decides"
            - "The second page returns the remaining row ${th_3} with has_more == false"
            - "Filtering by parent_theme_id returns exactly the one child ${th_3} with total_count == 1"
            - "Filtering by label_contains 'Navigation' plus status EMERGING returns ${th_1} and ${th_3} with total_count == 2 - filters compose"
            - "Every row carries id, created_at, updated_at and version, and every response is wrapped in the declared envelope"
      - name: auto_invite_creates_a_partial_batch_when_candidates_run_out
        claim_type: Bulk action
        grounds:
          - endpoints[POST /studies/{id}/recruitments/auto-invite]
          - calculations.auto_invite_selection
        distinguishing_aspect: "A short batch is a success, not a failure: count 5 against a pool that can only offer 2 candidates returns 201 with 2 rows, and the rows already created stay committed - skip semantics, not rollback."
        test_recipe:
          setup:
            - "Pool with 4 participants: one already recruited into the study, one in the wrong segment, two eligible"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ResearchOpsAdmin
              as_user_id: "u_ops_1"
