            - { call: "POST /carriers", payload: { carrier_name: "C04", credit_limit_cents: 100000 }, as: Dispatcher }
            - { call: "POST /carriers", payload: { carrier_name: "C05", credit_limit_cents: 100000 }, as: Dispatcher }
            - { call: "POST /carriers", payload: { carrier_name: "C06", credit_limit_cents: 100000 }, as: Dispatcher }
            - { call: "POST /carriers", payload: { carrier_name: "C07", credit_limit_cents: 100000 }, as: Dispatcher }
            - { call: "POST /carriers", payload: { carrier_name: "C08", credit_limit_cents: 100000 }, as: Dispatcher }
            - { call: "POST /carriers", payload: { carrier_name: "C09", credit_limit_cents: 100000 }, as: Dispatcher }
            - { call: "POST /carriers", payload: { carrier_name: "C10", credit_limit_cents: 100000 }, as: Dispatcher }
            - { call: "POST /carriers", payload: { carrier_name: "C11", credit_limit_cents: 100000 }, as: Dispatcher }
            - { call: "POST /carriers", payload: { carrier_name: "C12", credit_limit_cents: 100000 }, as: Dispatcher }
          trigger:
            - { call: "GET /carriers", payload: {}, as: Dispatcher }
            - { call: "GET /carriers?offset=10", payload: {}, as: Dispatcher }
            - { call: "GET /carriers?limit=0", payload: {}, as: Dispatcher, captures: { err1: $.data.error_id } }
            - { call: "GET /carriers?limit=101", payload: {}, as: Dispatcher, captures: { err2: $.data.error_id } }
          assert:
            - "Default page: 10 rows, total_count == 12, has_more == true (limit defaulted to 10, offset 0)"
            - "offset=10 page: 2 rows, total_count == 12, has_more == false"
            - "limit=0 and limit=101: http 400 ERR_INVALID_REQUEST (bounds 1..100)"

      - name: filter_and_list_composition
        claim_type: layer_pagination_with_filtering
        grounds: ["endpoints[GET /jobs]", "endpoints[GET /escorts]", "endpoints[GET /assignments]"]
        distinguishing_aspect: "Filters compose with enum membership and multi-value certification arrays: state_code=TX matches arrays CONTAINING TX; combined carrier+status filters intersect."
        test_recipe:
          setup: ["Carriers A, B; escorts certified [TX], [OK], [TX, OK]; jobs: jA (carrier A, BOOKED with OFFERED assignment to the TX escort), jB1 (carrier B, QUOTED), jB2 (carrier B, DRAFT)"]
          setup_api_calls:
            - { call: "POST /carriers", payload: { carrier_name: "FA", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_a: $.data.id } }
            - { call: "POST /carriers", payload: { carrier_name: "FB", credit_limit_cents: 10000000 }, as: Dispatcher, captures: { carrier_b: $.data.id } }
