            - { call: "POST /sample-kits/${k1}/custody-events", as: QualityLead, as_user_id: "${ql1}", payload: { event_type: LAB_OPENED, occurred_at: "2026-08-06T02:00:00Z", actor_label: "Analyst 3", expected_sample_kit_version: "${kv6}" } }
