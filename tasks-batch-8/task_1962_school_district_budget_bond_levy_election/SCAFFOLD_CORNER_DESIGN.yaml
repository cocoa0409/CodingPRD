        distinguishing_aspect: "Segregation of duties on capital-plan amendments: the approver's X-User-ID must differ from submitted_by_user_id; the same person (user-x) submitting as BudgetAnalyst and approving as Superintendent yields ERR_SEGREGATION_OF_DUTIES."
