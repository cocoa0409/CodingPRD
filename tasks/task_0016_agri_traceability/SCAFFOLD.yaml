scenario: |
  Agricultural product traceability system: planting batch registration with field plot
  mapping, crop variety, planting date, expected harvest period, and grower information;
  pesticide and fertilizer usage records with product registration number validation,
  application date and dosage, withdrawal period calculation, and prohibited-substance
  check; harvesting and warehousing with batch-level harvest records, quality grading,
  packaging specification, and warehouse-bin assignment; logistics chain temperature
  monitoring with IoT sensor data collection, threshold alerts, abnormal-segment marking,
  and chain-of-custody handover records; quality inspection report with sampling rules,
  test-item configuration (pesticide residue, heavy metals, microorganisms), report
  issuance, and pass/fail batch routing; consumer QR code traceability with full-chain
  query (planting/harvest/inspection/logistics), anti-counterfeit code verification,
  and one-code-one-product enforcement; recall workflow with recall-scope identification
  by batch, multi-level recall classification, distributor and retailer notification,
  recall execution tracking, and disposal record; event-driven synchronization with
  regulatory authority, logistics, and retail systems; audit logging for batch changes
  and recall actions.

domain_name: agri-traceability
api_prefix: /planting-batches

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - bulk_operations
    - idempotency
    - derived_field_reconciliation
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: PesticideRegistry
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID for the registry record.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp of catalog ingestion.
      - name: registration_no
        type: string
        source: input
        description: Government-issued pesticide/fertilizer registration number.
        constraints: "Unique; pattern: ^PD-[0-9]{6}$ for pesticides or FT-[0-9]{6}$ for fertilizers."
      - name: product_name
        type: string
        source: input
        description: Trade name of the agrochemical.
      - name: category
        type: enum
        source: input
        description: PESTICIDE or FERTILIZER.
        constraints: "enum: {PESTICIDE, FERTILIZER}"
      - name: withdrawal_period_days
        type: integer
        source: input
        description: Mandatory minimum days between last application and harvest.
        constraints: ">= 0"
      - name: max_dosage_per_hectare_g
        type: number
        source: input
        description: Regulatory upper bound on application dosage (grams per hectare).
      - name: prohibited
        type: boolean
        source: input
        description: True if the registry record was added to the prohibited list (still queryable).
        default: false
      - name: prohibited_since
        type: datetime
        source: input
        description: Date the substance entered prohibited status; null if not prohibited.
        default: null

  - name: PlantingBatch
    parent: null
    common_fields: true
    fields:
      - name: batch_code
        type: string
        source: input
        description: Human-readable batch code (uppercase, alphanumeric).
        constraints: "Unique; pattern: ^PB-[A-Z0-9]{8}$"
      - name: field_plot_id
        type: string
        source: input
        description: Identifier of the geographic plot (server stores as opaque string).
      - name: plot_area_hectares
        type: number
        source: input
        description: Area of the plot in hectares.
        constraints: "> 0"
      - name: crop_variety
        type: string
        source: input
        description: Crop variety (e.g., 'Tomato-Roma-VF').
      - name: planting_date
        type: datetime
        source: input
        description: Date plants were sown / transplanted (ISO 8601 date with 00:00:00 UTC time).
      - name: expected_harvest_start
        type: datetime
        source: input
        description: Earliest expected harvest date.
      - name: expected_harvest_end
        type: datetime
        source: input
        description: Latest expected harvest date.
        constraints: "Must be >= expected_harvest_start"
      - name: grower_id
        type: string
        source: input
        description: FK to a Grower role's user_id (opaque identifier matching X-User-ID of role Grower).
      - name: grower_name
        type: string
        source: input
        description: Snapshot of the grower's display name at registration.
      - name: status
        type: enum
        source: computed
        description: Lifecycle status of the batch.
        constraints: "enum: {REGISTERED, GROWING, HARVESTED, INSPECTED_PASS, INSPECTED_FAIL, IN_TRANSIT, DELIVERED, RECALLED, DISPOSED}"
        default: REGISTERED
      - name: posture
        type: enum
        source: computed
        description: Aggregate compliance posture derived from agrochemical and inspection state.
        constraints: "enum: {CLEAN, FLAGGED, BLOCKED}"
        default: CLEAN
      - name: earliest_legal_harvest_date
        type: datetime
        source: computed
        description: max over all AgrochemicalApplication of (application_date + registry.withdrawal_period_days). Null when no applications recorded.
        default: null
      - name: total_quantity_kg
        type: number
        source: computed
        description: Sum of HarvestRecord.quantity_kg for this batch (recomputed on harvest insertion).
        default: 0
      - name: recall_status
        type: enum
        source: computed
        description: Whether the batch is currently subject to a recall.
        constraints: "enum: {NONE, ACTIVE_RECALL, COMPLETED}"
        default: NONE

  - name: AgrochemicalApplication
    parent: PlantingBatch
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp of record creation.
      - name: planting_batch_id
        type: string
        source: input
        description: FK to PlantingBatch.id.
      - name: registration_no
        type: string
        source: input
        description: FK to PesticideRegistry.registration_no.
      - name: application_date
        type: datetime
        source: input
        description: Date of agrochemical application (must be >= PlantingBatch.planting_date).
      - name: dosage_g_per_hectare
        type: number
        source: input
        description: Applied dosage in grams per hectare.
        constraints: "> 0; must be <= registry.max_dosage_per_hectare_g"
      - name: applied_by_user_id
        type: string
        source: input
        description: Opaque user id (matches X-User-ID of role Grower).
      - name: withdrawal_end_date
        type: datetime
        source: computed
        description: application_date + registry.withdrawal_period_days (UTC midnight).

  - name: HarvestRecord
    parent: PlantingBatch
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC creation timestamp.
      - name: planting_batch_id
        type: string
        source: input
        description: FK to PlantingBatch.id.
      - name: harvest_date
        type: datetime
        source: input
        description: Date of harvest. Must be >= PlantingBatch.earliest_legal_harvest_date when not null.
      - name: quantity_kg
        type: number
        source: input
        description: Weight harvested in kilograms.
        constraints: "> 0"
      - name: quality_grade
        type: enum
        source: input
        description: Grade assigned at harvest.
        constraints: "enum: {A, B, C, REJECT}"
      - name: packaging_spec
        type: string
        source: input
        description: Free-form packaging specification (e.g., '5kg-carton-ventilated').
      - name: storage_bin_id
        type: string
        source: input
        description: FK to StorageBin.id.

  - name: StorageBin
    parent: null
    common_fields: true
    fields:
      - name: bin_code
        type: string
        source: input
        description: Warehouse bin code.
        constraints: "Unique; pattern: ^WH-[A-Z][0-9]{3}$"
      - name: warehouse_zone
        type: string
        source: input
        description: Warehouse zone (e.g., 'COLD', 'AMBIENT').
      - name: capacity_kg
        type: number
        source: input
        description: Maximum weight capacity in kilograms.
        constraints: "> 0"
      - name: occupied_kg
        type: number
        source: computed
        description: Sum of HarvestRecord.quantity_kg currently assigned to this bin and not yet shipped.
        default: 0
      - name: status
        type: enum
        source: computed
        description: Bin availability state.
        constraints: "enum: {AVAILABLE, FULL, QUARANTINE}"
        default: AVAILABLE

  - name: LogisticsLeg
    parent: PlantingBatch
    common_fields: true
    fields:
      - name: planting_batch_id
        type: string
        source: input
        description: FK to PlantingBatch.id.
      - name: leg_index
        type: integer
        source: input
        description: 1-based index of this leg within the batch's logistics chain.
        constraints: ">= 1; unique per (planting_batch_id, leg_index)"
      - name: from_party_id
        type: string
        source: input
        description: Opaque identifier of handover origin party.
      - name: to_party_id
        type: string
        source: input
        description: Opaque identifier of handover destination party (FK to Distributor.id when role=Distributor).
      - name: depart_at
        type: datetime
        source: input
        description: Departure timestamp.
      - name: arrive_at
        type: datetime
        source: input
        description: Arrival timestamp. Must be > depart_at.
      - name: temperature_min_c
        type: number
        source: input
        description: Required minimum temperature for the cargo (Celsius).
      - name: temperature_max_c
        type: number
        source: input
        description: Required maximum temperature for the cargo (Celsius).
        constraints: ">= temperature_min_c"
      - name: status
        type: enum
        source: computed
        description: Leg lifecycle.
        constraints: "enum: {PLANNED, IN_TRANSIT, HANDED_OVER, ABNORMAL}"
        default: PLANNED
      - name: abnormal_segment_count
        type: integer
        source: computed
        description: Count of contiguous SensorReading runs (>=3 readings) where temperature was outside [temperature_min_c, temperature_max_c].
        default: 0
      - name: handover_acknowledged
        type: boolean
        source: computed
        description: True after the to_party calls acknowledge endpoint.
        default: false

  - name: SensorReading
    parent: LogisticsLeg
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID.
      - name: created_at
        type: datetime
        source: system
        description: Ingest timestamp (server clock).
      - name: logistics_leg_id
        type: string
        source: input
        description: FK to LogisticsLeg.id.
      - name: device_id
        type: string
        source: input
        description: IoT sensor device identifier.
      - name: idempotency_key
        type: string
        source: input
        description: Client-supplied unique key (device_id + sequence). Duplicate POSTs are deduplicated.
        constraints: "Unique per logistics_leg_id"
      - name: reading_at
        type: datetime
        source: input
        description: Sensor reading timestamp (must lie within [LogisticsLeg.depart_at, LogisticsLeg.arrive_at])."
      - name: temperature_c
        type: number
        source: input
        description: Measured temperature in Celsius.
      - name: out_of_range
        type: boolean
        source: computed
        description: True if temperature_c < leg.temperature_min_c or > leg.temperature_max_c.

  - name: InspectionReport
    parent: PlantingBatch
    common_fields: true
    fields:
      - name: planting_batch_id
        type: string
        source: input
        description: FK to PlantingBatch.id.
      - name: sampling_rule
        type: enum
        source: input
        description: Sampling rule applied.
        constraints: "enum: {RANDOM_5PCT, FIXED_3KG, FULL_LOT}"
      - name: test_items
        type: array
        source: input
        description: Subset of {PESTICIDE_RESIDUE, HEAVY_METALS, MICROORGANISMS}; non-empty.
      - name: pesticide_residue_mg_per_kg
        type: number
        source: input
        description: Measured residue. Required when test_items contains PESTICIDE_RESIDUE.
        default: null
      - name: heavy_metals_mg_per_kg
        type: number
        source: input
        description: Total heavy-metal concentration. Required when HEAVY_METALS is in test_items.
        default: null
      - name: microorganism_cfu_per_g
        type: integer
        source: input
        description: Microbial colony-forming-unit count. Required when MICROORGANISMS is in test_items.
        default: null
      - name: status
        type: enum
        source: computed
        description: Report lifecycle.
        constraints: "enum: {DRAFT, ISSUED, REVOKED}"
        default: DRAFT
      - name: result
        type: enum
        source: computed
        description: Pass/fail decision computed at issuance.
        constraints: "enum: {PASS, FAIL, PENDING}"
        default: PENDING
      - name: issued_at
        type: datetime
        source: computed
        description: Timestamp of issuance.
        default: null
      - name: inspector_id
        type: string
        source: input
        description: Opaque identifier of inspector (X-User-ID of role Inspector).

  - name: QRCode
    parent: PlantingBatch
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC creation timestamp.
      - name: planting_batch_id
        type: string
        source: input
        description: FK to PlantingBatch.id.
      - name: harvest_record_id
        type: string
        source: input
        description: FK to HarvestRecord.id; one QR code maps to exactly one harvest record (one-code-one-product).
        constraints: "Unique"
      - name: qr_code_value
        type: string
        source: system
        description: Server-minted opaque QR payload (32 hex chars).
        constraints: "Unique"
      - name: anti_counterfeit_token
        type: string
        source: system
        description: Server-minted secret token used in verification.
      - name: scan_count
        type: integer
        source: computed
        description: Number of successful consumer scans.
        default: 0
      - name: revoked
        type: boolean
        source: computed
        description: True after recall execution voids the code.
        default: false

  - name: Distributor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Distributor display name.
      - name: contact_email
        type: string
        source: input
        description: Notification email (recall notices delivered here as event records).
      - name: tier
        type: enum
        source: input
        description: Distributor tier.
        constraints: "enum: {WHOLESALE, RETAIL}"
      - name: notification_endpoint
        type: string
        source: input
        description: External webhook URL captured at registration (used by event_driven_sync).

  - name: RecallOrder
    parent: PlantingBatch
    common_fields: true
    fields:
      - name: planting_batch_id
        type: string
        source: input
        description: FK to PlantingBatch.id (the recalled batch).
      - name: recall_class
        type: enum
        source: input
        description: Severity classification.
        constraints: "enum: {CLASS_I, CLASS_II, CLASS_III}"
      - name: reason_code
        type: enum
        source: input
        description: Cause of the recall.
        constraints: "enum: {INSPECTION_FAIL, COLD_CHAIN_BREACH, PROHIBITED_SUBSTANCE, CONSUMER_COMPLAINT}"
      - name: scope_distributor_ids
        type: array
        source: computed
        description: Distinct Distributor.id values appearing in to_party_id of LogisticsLeg rows for the batch.
      - name: status
        type: enum
        source: computed
        description: Recall lifecycle.
        constraints: "enum: {INITIATED, NOTIFIED, IN_PROGRESS, COMPLETED, CLOSED, CANCELLED}"
        default: INITIATED
      - name: initiated_by_user_id
        type: string
        source: input
        description: Opaque X-User-ID of the RegulatoryOfficer initiating the recall.
      - name: total_quantity_recalled_kg
        type: number
        source: computed
        description: Sum of HarvestRecord.quantity_kg on this batch at the moment status enters COMPLETED.
        default: 0
      - name: total_quantity_disposed_kg
        type: number
        source: computed
        description: Sum of disposal_records[].disposed_kg.
        default: 0
      - name: disposal_records
        type: array
        source: computed
        description: Append-only array of {distributor_id, disposed_kg, disposed_at}; once added, immutable.
        default: []

  - name: AuditLog
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC timestamp of the event.
      - name: actor_user_id
        type: string
        source: system
        description: X-User-ID of the actor whose request produced the event (system events use 'system').
      - name: actor_role
        type: string
        source: system
        description: X-User-Role of the actor.
      - name: entity_type
        type: enum
        source: system
        description: Affected entity type.
        constraints: "enum: {PlantingBatch, AgrochemicalApplication, HarvestRecord, InspectionReport, LogisticsLeg, RecallOrder, QRCode}"
      - name: entity_id
        type: string
        source: system
        description: Affected entity id.
      - name: action
        type: string
        source: system
        description: "One of: CREATE, UPDATE, STATE_TRANSITION, RECALL_INITIATE, RECALL_NOTIFY, RECALL_DISPOSE, RECALL_COMPLETE."
      - name: before_state
        type: string
        source: system
        description: Previous status (null on CREATE).
      - name: after_state
        type: string
        source: system
        description: Resulting status.
      - name: change_summary
        type: object
        source: system
        description: JSON object with relevant field deltas.

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PlantingBatch
    initial_state: REGISTERED
    terminal_states: [DELIVERED, DISPOSED]
    transitions:
      - from: REGISTERED
        to: GROWING
        trigger: "POST /planting-batches/{id}/agrochemical-applications (first record)"
        actor: Grower
        preconditions:
          - "Batch.status == REGISTERED"
          - "Application registration_no exists in PesticideRegistry"
          - "PesticideRegistry.prohibited == false at application_date"
        side_effects:
          - "Insert AgrochemicalApplication"
          - "Recompute PlantingBatch.earliest_legal_harvest_date"
          - "AuditLog CREATE on AgrochemicalApplication and STATE_TRANSITION on PlantingBatch"
      - from: REGISTERED
        to: GROWING
        trigger: "POST /planting-batches/{id}/declare-growing"
        actor: Grower
        preconditions: ["Batch.status == REGISTERED"]
        side_effects: ["AuditLog STATE_TRANSITION"]
      - from: GROWING
        to: HARVESTED
        trigger: "POST /planting-batches/{id}/harvest-records (first record)"
        actor: Grower
        preconditions:
          - "Batch.status == GROWING"
          - "harvest_date >= Batch.earliest_legal_harvest_date when not null"
          - "StorageBin.status != QUARANTINE and (occupied_kg + quantity_kg) <= capacity_kg"
        side_effects:
          - "Insert HarvestRecord"
          - "StorageBin.occupied_kg += quantity_kg; recompute StorageBin.status"
          - "PlantingBatch.total_quantity_kg += quantity_kg"
          - "AuditLog CREATE + STATE_TRANSITION"
      - from: HARVESTED
        to: INSPECTED_PASS
        trigger: "POST /inspection-reports/{id}/issue with computed result==PASS"
        actor: Inspector
        preconditions:
          - "Batch.status == HARVESTED"
          - "Inspection report status == DRAFT"
          - "Computed result == PASS per pass_fail_decision calculation"
        side_effects:
          - "Set InspectionReport.status=ISSUED, result=PASS, issued_at=now"
          - "PlantingBatch.posture transitions CLEAN unless agrochemical violation already FLAGGED"
          - "AuditLog STATE_TRANSITION"
      - from: HARVESTED
        to: INSPECTED_FAIL
        trigger: "POST /inspection-reports/{id}/issue with computed result==FAIL"
        actor: Inspector
        preconditions:
          - "Batch.status == HARVESTED"
          - "Inspection report status == DRAFT"
          - "Computed result == FAIL per pass_fail_decision calculation"
        side_effects:
          - "Set InspectionReport.status=ISSUED, result=FAIL"
          - "PlantingBatch.posture := BLOCKED"
          - "Auto-cascade: any LogisticsLeg in PLANNED is rejected on transition; AuditLog STATE_TRANSITION"
      - from: INSPECTED_PASS
        to: IN_TRANSIT
        trigger: "POST /planting-batches/{id}/logistics-legs (creates first leg) followed by leg depart"
        actor: LogisticsOperator
        preconditions:
          - "Batch.status == INSPECTED_PASS"
          - "Batch.posture != BLOCKED"
          - "QRCode exists for at least one HarvestRecord of the batch"
        side_effects:
          - "LogisticsLeg.status := IN_TRANSIT"
          - "AuditLog STATE_TRANSITION"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /logistics-legs/{id}/acknowledge on the final leg by Distributor"
        actor: Distributor
        preconditions:
          - "Leg.status == IN_TRANSIT"
          - "Leg is the last leg recorded for this batch (no leg with greater leg_index)"
          - "Leg.abnormal_segment_count == 0 OR recall not triggered by cold-chain"
        side_effects:
          - "Leg.status := HANDED_OVER, handover_acknowledged := true"
          - "PlantingBatch.status := DELIVERED"
          - "AuditLog STATE_TRANSITION"
      - from: INSPECTED_PASS
        to: RECALLED
        trigger: "POST /recall-orders (manual) or system POST when fail/breach found post-inspection"
        actor: RegulatoryOfficer
        preconditions: ["Batch.status IN {INSPECTED_PASS, IN_TRANSIT, DELIVERED}"]
        side_effects:
          - "Create RecallOrder with status=INITIATED"
          - "PlantingBatch.recall_status := ACTIVE_RECALL; status := RECALLED"
          - "Cascade: revoke all QRCode rows for the batch (qr.revoked := true)"
          - "Cascade: any LogisticsLeg with status==PLANNED or IN_TRANSIT marked ABNORMAL"
          - "AuditLog RECALL_INITIATE + STATE_TRANSITION"
      - from: IN_TRANSIT
        to: RECALLED
        trigger: "POST /recall-orders or auto on cold_chain_breach trigger"
        actor: RegulatoryOfficer | system
        preconditions: ["Batch.status IN {INSPECTED_PASS, IN_TRANSIT, DELIVERED}"]
        side_effects: ["Same as above"]
      - from: DELIVERED
        to: RECALLED
        trigger: "POST /recall-orders post-delivery"
        actor: RegulatoryOfficer
        preconditions: ["Batch.status IN {INSPECTED_PASS, IN_TRANSIT, DELIVERED}"]
        side_effects: ["Same as above"]
      - from: RECALLED
        to: DISPOSED
        trigger: "POST /recall-orders/{id}/complete after all distributors confirm disposal"
        actor: RegulatoryOfficer
        preconditions:
          - "RecallOrder.status == IN_PROGRESS"
          - "sum(disposal_records.disposed_kg) >= total_quantity_recalled_kg per recall_disposal_reconciliation"
        side_effects:
          - "RecallOrder.status := COMPLETED"
          - "PlantingBatch.recall_status := COMPLETED; PlantingBatch.status := DISPOSED"
          - "AuditLog RECALL_COMPLETE + STATE_TRANSITION"

  - entity: InspectionReport
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /inspection-reports/{id}/issue"
        actor: Inspector
        preconditions:
          - "Report.status == DRAFT"
          - "All test_items entries have measured values present"
          - "Inspector.id != PlantingBatch.grower_id (segregation of duties)"
        side_effects:
          - "Set issued_at=now, result := pass_fail_decision()"
          - "If result==FAIL → cascade: PlantingBatch.posture=BLOCKED, status:=INSPECTED_FAIL"
          - "If result==PASS → cascade: PlantingBatch.status:=INSPECTED_PASS"
          - "AuditLog STATE_TRANSITION"
      - from: ISSUED
        to: REVOKED
        trigger: "POST /inspection-reports/{id}/revoke"
        actor: RegulatoryOfficer
        preconditions:
          - "Report.status == ISSUED"
          - "PlantingBatch.status NOT IN {DELIVERED, DISPOSED}"
        side_effects:
          - "Report.status := REVOKED"
          - "Cascade: PlantingBatch reverts to HARVESTED; posture recomputed"
          - "AuditLog STATE_TRANSITION"

  - entity: LogisticsLeg
    initial_state: PLANNED
    terminal_states: [HANDED_OVER, ABNORMAL]
    transitions:
      - from: PLANNED
        to: IN_TRANSIT
        trigger: "POST /logistics-legs/{id}/depart"
        actor: LogisticsOperator
        preconditions:
          - "Leg.status == PLANNED"
          - "PlantingBatch.posture != BLOCKED"
          - "PlantingBatch.status IN {INSPECTED_PASS, IN_TRANSIT}"
        side_effects:
          - "Leg.status := IN_TRANSIT"
          - "On first leg of the batch: PlantingBatch.status := IN_TRANSIT"
      - from: IN_TRANSIT
        to: HANDED_OVER
        trigger: "POST /logistics-legs/{id}/acknowledge"
        actor: Distributor | LogisticsOperator
        preconditions:
          - "Leg.status == IN_TRANSIT"
          - "Acknowledger X-User-ID == Leg.to_party_id"
        side_effects:
          - "handover_acknowledged := true"
          - "If last leg → PlantingBatch.status := DELIVERED"
      - from: IN_TRANSIT
        to: ABNORMAL
        trigger: "Auto-transition when cold_chain_breach detected (third consecutive out-of-range reading)"
        actor: system
        preconditions:
          - "Leg.status == IN_TRANSIT"
          - "Latest 3 SensorReadings for this leg all out_of_range == true"
        side_effects:
          - "Leg.status := ABNORMAL"
          - "Leg.abnormal_segment_count incremented by 1"
          - "Auto-emit recall: POST /recall-orders with reason_code=COLD_CHAIN_BREACH (only if PlantingBatch.recall_status == NONE) → cascades full RECALLED transition"
          - "AuditLog STATE_TRANSITION"
      - from: ABNORMAL
        to: HANDED_OVER
        trigger: "POST /logistics-legs/{id}/acknowledge after recall closed or override"
        actor: RegulatoryOfficer
        preconditions:
          - "Leg.status == ABNORMAL"
          - "Acknowledger role == RegulatoryOfficer (cannot be Distributor)"
        side_effects:
          - "handover_acknowledged := true"
          - "AuditLog STATE_TRANSITION"

  - entity: RecallOrder
    initial_state: INITIATED
    terminal_states: [COMPLETED, CLOSED, CANCELLED]
    transitions:
      - from: INITIATED
        to: NOTIFIED
        trigger: "POST /recall-orders/{id}/notify"
        actor: RegulatoryOfficer
        preconditions: ["RecallOrder.status == INITIATED"]
        side_effects:
          - "For each Distributor.id in scope_distributor_ids: emit recall_notification event"
          - "Status := NOTIFIED"
          - "AuditLog RECALL_NOTIFY"
      - from: NOTIFIED
        to: IN_PROGRESS
        trigger: "First POST /recall-orders/{id}/disposals (any distributor records disposal)"
        actor: Distributor
        preconditions: ["RecallOrder.status == NOTIFIED"]
        side_effects:
          - "Append entry to disposal_records"
          - "Status := IN_PROGRESS"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "Subsequent POST /recall-orders/{id}/disposals"
        actor: Distributor
        preconditions:
          - "RecallOrder.status == IN_PROGRESS"
          - "Cumulative disposed_kg + disposed_kg <= total_quantity_recalled_kg"
        side_effects:
          - "Append disposal record; recompute total_quantity_disposed_kg"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /recall-orders/{id}/complete"
        actor: RegulatoryOfficer
        preconditions:
          - "RecallOrder.status == IN_PROGRESS"
          - "total_quantity_disposed_kg == total_quantity_recalled_kg (recall_disposal_reconciliation passes with zero residual)"
        side_effects:
          - "Status := COMPLETED"
          - "PlantingBatch.status := DISPOSED; recall_status := COMPLETED"
          - "AuditLog RECALL_COMPLETE"
      - from: INITIATED
        to: CANCELLED
        trigger: "POST /recall-orders/{id}/cancel"
        actor: RegulatoryOfficer
        preconditions:
          - "RecallOrder.status == INITIATED"
          - "No disposal records yet"
        side_effects:
          - "Status := CANCELLED"
          - "Cascade revert: PlantingBatch.recall_status := NONE; PlantingBatch.status reverts to prior status (recorded in audit log change_summary.before_state at recall initiation)"
          - "QRCode.revoked := false for the batch"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two recall-orders POSTed simultaneously for the same PlantingBatch"
    guarantee: "Exactly one RecallOrder is created; loser receives ERR_RECALL_ALREADY_ACTIVE."
    error_id: ERR_RECALL_ALREADY_ACTIVE
    http_status: 409
    serialization: "First-writer-wins on PlantingBatch.recall_status flip from NONE to ACTIVE_RECALL."

  - scenario: "Inspector issues report while RegulatoryOfficer revokes a previously issued report on the same batch"
    guarantee: "Exactly one operation succeeds; loser receives ERR_INVALID_STATE because target status changed."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on InspectionReport.status."

  - scenario: "Two harvest-records POSTed at the same instant for the same StorageBin where their combined weight would breach capacity"
    guarantee: "First-writer succeeds; second-writer rejected with ERR_BIN_CAPACITY_EXCEEDED."
    error_id: ERR_BIN_CAPACITY_EXCEEDED
    http_status: 409
    serialization: "Optimistic check on StorageBin.occupied_kg using StorageBin.version."

  - scenario: "Same SensorReading idempotency_key submitted twice"
    guarantee: "Exactly one SensorReading row exists; duplicate POST returns 200 with the original row (idempotent replay)."
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 200
    serialization: "Unique index on (logistics_leg_id, idempotency_key); replay path returns existing record."

  - scenario: "Two QR-code creations for the same HarvestRecord"
    guarantee: "Exactly one QRCode is created; loser rejected with ERR_QR_ALREADY_BOUND (one-code-one-product)."
    error_id: ERR_QR_ALREADY_BOUND
    http_status: 409
    serialization: "Unique constraint on QRCode.harvest_record_id."

  - scenario: "Distributor records disposal while RegulatoryOfficer cancels the recall"
    guarantee: "Exactly one operation succeeds; if cancel wins, the disposal POST gets ERR_INVALID_STATE; if disposal wins, cancel gets ERR_RECALL_HAS_DISPOSALS."
    error_id: ERR_RECALL_HAS_DISPOSALS
    http_status: 409
    serialization: "First-writer-wins on RecallOrder.status; cancel requires zero disposals."

  - scenario: "Distributor records disposal while RegulatoryOfficer cancels the recall (mirror — disposal arrives after cancel commits)"
    guarantee: "Disposal POST is rejected because RecallOrder is no longer IN_PROGRESS/NOTIFIED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on RecallOrder.status."

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: earliest_legal_harvest_date
    trigger: "After every successful AgrochemicalApplication insert on a PlantingBatch."
    algorithm: aggregation
    formula: |
      candidates = []
      for app in AgrochemicalApplication where app.planting_batch_id == batch.id:
        registry = PesticideRegistry where registration_no == app.registration_no
        candidates.append(app.application_date + timedelta(days=registry.withdrawal_period_days))
      result = max(candidates) if candidates else null
      # store at UTC midnight of the resulting date
    input_set: "All AgrochemicalApplication rows for the batch (no status filter — agrochemical applications are immutable)."
    constants: {}
    precision: "Date precision (UTC midnight); withdrawal_period_days integer arithmetic, no rounding."
    variants: []

  - name: pass_fail_decision
    trigger: "POST /inspection-reports/{id}/issue."
    algorithm: threshold
    formula: |
      # Threshold table per test_item:
      #   PESTICIDE_RESIDUE: pass iff pesticide_residue_mg_per_kg <= MAX_PESTICIDE_MG_PER_KG (boundary inclusive: == passes)
      #   HEAVY_METALS:     pass iff heavy_metals_mg_per_kg <= MAX_HEAVY_METAL_MG_PER_KG (boundary inclusive: == passes)
      #   MICROORGANISMS:   pass iff microorganism_cfu_per_g  <  MAX_MICRO_CFU_PER_G   (strict: == FAILS)
      # Two variants of aggregation:
      result = "PASS"
      for item in test_items:
        if not threshold_passes(item):
          result = "FAIL"; break
      return result
    input_set: "Single InspectionReport's measured values; thresholds drawn from constants."
    constants:
      MAX_PESTICIDE_MG_PER_KG: 0.50
      MAX_HEAVY_METAL_MG_PER_KG: 0.20
      MAX_MICRO_CFU_PER_G: 100000
    precision: "Use values as input. Apply 6-decimal truncation before comparison; no further rounding."
    variants:
      - name: aggregate_pass_fail
        when: "test_items contains multiple items; result is FAIL if ANY single item fails (forward-looking — first failure short-circuits and result is FAIL even if later items would have passed)."
        difference: "Short-circuit on first failure vs evaluate all then aggregate produce the same boolean but different audit details (which item caused failure). Pin: scaffold short-circuits and records first-failing item in change_summary."
      - name: boundary_treatment
        when: "Measurement equals threshold exactly."
        difference: "PESTICIDE_RESIDUE and HEAVY_METALS use inclusive (<=) — exact-equal passes. MICROORGANISMS uses strict (<) — exact-equal fails."

  - name: cold_chain_breach_detection
    trigger: "After every SensorReading insert on a LogisticsLeg."
    algorithm: chronological
    formula: |
      readings = SensorReading where logistics_leg_id == leg.id
                 sorted by reading_at ASC, then by created_at ASC (tie-break)
      # Walk readings; mark contiguous run of >=3 out_of_range readings as one abnormal segment.
      runs = []
      current = 0
      for r in readings:
        if r.out_of_range:
          current += 1
          if current == 3:
            runs.append(start_of_run)
        else:
          current = 0
      leg.abnormal_segment_count = len(runs)
      if leg.abnormal_segment_count >= 1 and leg.status == IN_TRANSIT:
        transition leg → ABNORMAL  # auto-recall side-effect chain
    input_set: "All SensorReadings for this leg, ordered by reading_at then created_at."
    constants:
      MIN_CONSECUTIVE_BREACHES: 3
    precision: "Integer count; out_of_range comparison uses leg.temperature_min_c and temperature_max_c with strict <,> (boundary == is in-range)."
    variants:
      - name: chronological_replay
        when: "Out-of-order ingest — a late reading arrives whose reading_at predates already-ingested readings."
        difference: "Recompute the entire chronological sort each insert; abnormal_segment_count is RE-derived from the new sorted sequence (not appended). A previously-abnormal leg may revert to IN_TRANSIT only if recall_status==NONE; otherwise the cascade is irreversible."

  - name: recall_disposal_reconciliation
    trigger: "Each POST /recall-orders/{id}/disposals AND POST /recall-orders/{id}/complete."
    algorithm: waterfall_allocation
    formula: |
      # Allocate disposed_kg across distributors in order of earliest LogisticsLeg.depart_at (chronological).
      total_recalled = sum(HarvestRecord.quantity_kg for hr where hr.planting_batch_id == batch.id and hr.created_at <= recall.created_at)
      cumulative = 0
      for d in disposal_records ordered by disposed_at ASC, created_at ASC (tie-break):
        cumulative += d.disposed_kg
      residual = total_recalled - cumulative
      complete_allowed = (residual == 0)   # boundary: strictly zero, NOT <= 0
      # On complete: if cumulative > total_recalled → ERR_RECALL_OVER_DISPOSED
    input_set: "All HarvestRecord rows for batch with created_at <= RecallOrder.created_at; all disposal_records on the recall."
    constants: {}
    precision: "Round each disposed_kg input to 2 decimal places (round_half_up) BEFORE summing. Sum is the final value (no rounding after sum). Order matters: per-record rounding then sum, NOT sum-then-round."
    variants:
      - name: scope_snapshot
        when: "Recall's total_quantity_recalled_kg snapshot at INITIATED moment."
        difference: "Only HarvestRecord rows with created_at <= RecallOrder.created_at count toward total_recalled. Harvest records created AFTER recall init are excluded — late harvests of an already-recalled batch are rejected separately by validation."

  - name: storage_bin_occupancy
    trigger: "After each HarvestRecord insert and after each successful LogisticsLeg HANDED_OVER transition that empties a leg."
    algorithm: aggregation
    formula: |
      occupied = sum(hr.quantity_kg
        for hr in HarvestRecord
        where hr.storage_bin_id == bin.id
        and PlantingBatch.where(id == hr.planting_batch_id).status NOT IN {DELIVERED, DISPOSED})
      bin.occupied_kg = round(occupied, 2)
      bin.status = "FULL" if occupied >= bin.capacity_kg else ("QUARANTINE" if any related batch posture==BLOCKED else "AVAILABLE")
    input_set: "HarvestRecord rows whose batch has not reached terminal status; status-filter is explicit."
    constants: {}
    precision: "round_half_up to 2 decimals on the SUMMED total."
    variants: []

  - name: qr_full_chain_query
    trigger: "GET /qr-codes/{qr_code_value}/trace"
    algorithm: projection
    formula: |
      qr = QRCode where qr_code_value == provided AND revoked == false
      batch = PlantingBatch where id == qr.planting_batch_id
      return {
        planting: { batch fields, agrochemical_applications: AgrochemicalApplication[batch.id] sorted by application_date ASC },
        harvest: HarvestRecord where id == qr.harvest_record_id,
        inspection: latest InspectionReport for batch where status==ISSUED (sort by issued_at DESC; tie-break by id ASC),
        logistics: LogisticsLeg[batch.id] sorted by leg_index ASC including abnormal_segment_count
      }
      qr.scan_count += 1   # idempotent on duplicate same-second scans? No — every successful 200 increments.
    input_set: "Single batch + child rows; explicit sort and tie-break per nested set."
    constants: {}
    precision: "No numeric output beyond what each child provides."
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty."
    error_id: ERR_AUTH_MISSING
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is one of {Grower, Inspector, RegulatoryOfficer, LogisticsOperator, Distributor, Consumer}."
    error_id: ERR_AUTH_INVALID_ROLE
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Acting role is permitted on the endpoint per §1.7 RBAC matrix."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Path parameters resolve to existing resources, validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is valid (see §1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_safety
    check: "PesticideRegistry.prohibited == true at application_date → reject."
    error_id: ERR_PROHIBITED_SUBSTANCE
    http_status: 422
    applies_to: "POST /planting-batches/{id}/agrochemical-applications"

  - priority: 7
    category: business_safety
    check: "Inspector.id != PlantingBatch.grower_id (segregation of duties on inspection issuance)."
    error_id: ERR_SEGREGATION_VIOLATION
    http_status: 403
    applies_to: "POST /inspection-reports/{id}/issue"

  - priority: 8
    category: business_safety
    check: "Recall already active for this batch (recall_status == ACTIVE_RECALL) → cannot start a second."
    error_id: ERR_RECALL_ALREADY_ACTIVE
    http_status: 409
    applies_to: "POST /recall-orders"

  - priority: 9
    category: business_referential
    check: "registration_no must reference an existing PesticideRegistry row."
    error_id: ERR_REGISTRATION_NOT_FOUND
    http_status: 422
    applies_to: "POST /planting-batches/{id}/agrochemical-applications"

  - priority: 10
    category: business_referential
    check: "harvest_date >= PlantingBatch.earliest_legal_harvest_date (when not null) — withdrawal-period guard."
    error_id: ERR_WITHDRAWAL_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /planting-batches/{id}/harvest-records"

  - priority: 11
    category: business_temporal
    check: "LogisticsLeg.arrive_at > LogisticsLeg.depart_at AND consecutive legs do not have overlapping intervals (closed-open: a leg's [depart_at, arrive_at) must not overlap any other leg's interval for the same batch)."
    error_id: ERR_LEG_INTERVAL_OVERLAP
    http_status: 422
    applies_to: "POST /planting-batches/{id}/logistics-legs"

  - priority: 12
    category: business_temporal
    check: "SensorReading.reading_at must lie within (LogisticsLeg.depart_at, LogisticsLeg.arrive_at]; readings at exactly depart_at are rejected (strict left-open), reading_at == arrive_at allowed (right-closed)."
    error_id: ERR_READING_OUT_OF_LEG_WINDOW
    http_status: 422
    applies_to: "POST /logistics-legs/{id}/sensor-readings"

  - priority: 13
    category: business_constraint
    check: "StorageBin.occupied_kg + new HarvestRecord.quantity_kg <= StorageBin.capacity_kg."
    error_id: ERR_BIN_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /planting-batches/{id}/harvest-records"

  - priority: 14
    category: business_constraint
    check: "AgrochemicalApplication.dosage_g_per_hectare <= PesticideRegistry.max_dosage_per_hectare_g."
    error_id: ERR_DOSAGE_EXCEEDED
    http_status: 422
    applies_to: "POST /planting-batches/{id}/agrochemical-applications"

  - priority: 15
    category: business_constraint
    check: "QRCode uniqueness — one QR per HarvestRecord (one-code-one-product)."
    error_id: ERR_QR_ALREADY_BOUND
    http_status: 409
    applies_to: "POST /harvest-records/{id}/qr-code"

  - priority: 16
    category: business_constraint
    check: "Disposal cumulative_disposed_kg + new disposal disposed_kg <= total_quantity_recalled_kg."
    error_id: ERR_RECALL_OVER_DISPOSED
    http_status: 422
    applies_to: "POST /recall-orders/{id}/disposals"

  - priority: 17
    category: business_constraint
    check: "Recall complete requires total_quantity_disposed_kg == total_quantity_recalled_kg (zero residual)."
    error_id: ERR_RECALL_RESIDUAL_NONZERO
    http_status: 422
    applies_to: "POST /recall-orders/{id}/complete"

  - priority: 18
    category: business_constraint
    check: "Idempotency key collision detection on SensorReading: existing same key returns 200 with original row."
    error_id: ERR_IDEMPOTENT_REPLAY
    http_status: 200
    applies_to: "POST /logistics-legs/{id}/sensor-readings"

  - priority: 19
    category: business_constraint
    check: "PlantingBatch.batch_code uniqueness AND format ^PB-[A-Z0-9]{8}$."
    error_id: ERR_BATCH_CODE_INVALID
    http_status: 422
    applies_to: "POST /planting-batches"

  - priority: 20
    category: business_constraint
    check: "expected_harvest_end >= expected_harvest_start AND planting_date <= expected_harvest_start."
    error_id: ERR_PLANTING_DATES_INVALID
    http_status: 422
    applies_to: "POST /planting-batches"

  - priority: 21
    category: business_referential
    check: "version (when supplied) on PATCH/PUT must match current entity version (OCC)."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- PesticideRegistry -----
  - method: POST
    path: "/pesticide-registry"
    description: "Register a pesticide/fertilizer (RegulatoryOfficer only)."
    roles: [RegulatoryOfficer]
    code: 201
    input: ["registration_no", "product_name", "category", "withdrawal_period_days", "max_dosage_per_hectare_g", "prohibited?", "prohibited_since?"]
    output: PesticideRegistry
    side_effects: []

  - method: GET
    path: "/pesticide-registry"
    description: "List registry entries; supports prohibited filter."
    roles: [RegulatoryOfficer, Grower, Inspector]
    code: 200
    input: ["limit?", "offset?", "prohibited?", "category?"]
    output: PesticideRegistry[]
    side_effects: []

  - method: PATCH
    path: "/pesticide-registry/{registration_no}/prohibit"
    description: "Mark a registry entry as prohibited (regulatory action)."
    roles: [RegulatoryOfficer]
    code: 200
    input: [prohibited_since]
    output: PesticideRegistry
    side_effects: ["AuditLog UPDATE"]

  # ----- PlantingBatch -----
  - method: POST
    path: "/planting-batches"
    description: "Register a new planting batch."
    roles: [Grower]
    code: 201
    input: [batch_code, field_plot_id, plot_area_hectares, crop_variety, planting_date, expected_harvest_start, expected_harvest_end, grower_name]
    output: PlantingBatch
    side_effects: ["AuditLog CREATE"]

  - method: GET
    path: "/planting-batches"
    description: "List batches; supports status, posture, recall_status filters."
    roles: [Grower, Inspector, RegulatoryOfficer]
    code: 200
    input: ["limit?", "offset?", "status?", "posture?", "recall_status?"]
    output: PlantingBatch[]
    side_effects: []

  - method: GET
    path: "/planting-batches/{id}"
    description: "Read a planting batch."
    roles: [Grower, Inspector, RegulatoryOfficer, LogisticsOperator, Distributor]
    code: 200
    input: []
    output: PlantingBatch
    side_effects: []

  - method: POST
    path: "/planting-batches/{id}/declare-growing"
    description: "Optionally advance batch to GROWING without first recording an application."
    roles: [Grower]
    code: 200
    input: []
    output: PlantingBatch
    side_effects: ["AuditLog STATE_TRANSITION"]

  - method: POST
    path: "/planting-batches/{id}/agrochemical-applications"
    description: "Record a pesticide/fertilizer application."
    roles: [Grower]
    code: 201
    input: [registration_no, application_date, dosage_g_per_hectare]
    output: AgrochemicalApplication
    side_effects: ["earliest_legal_harvest_date recompute", "auto-transition REGISTERED→GROWING on first record", "posture FLAGGED if registry was prohibited at application_date but not yet flipped at insert"]

  - method: GET
    path: "/planting-batches/{id}/agrochemical-applications"
    description: "List a batch's agrochemical applications."
    roles: [Grower, Inspector, RegulatoryOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: AgrochemicalApplication[]
    side_effects: []

  - method: POST
    path: "/planting-batches/{id}/harvest-records"
    description: "Record a harvest entry; auto-transitions GROWING→HARVESTED on first record."
    roles: [Grower]
    code: 201
    input: [harvest_date, quantity_kg, quality_grade, packaging_spec, storage_bin_id]
    output: HarvestRecord
    side_effects: ["StorageBin occupancy recompute", "PlantingBatch.total_quantity_kg recompute", "AuditLog CREATE + STATE_TRANSITION"]

  - method: GET
    path: "/planting-batches/{id}/harvest-records"
    description: "List a batch's harvest records."
    roles: [Grower, Inspector, RegulatoryOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: HarvestRecord[]
    side_effects: []

  # ----- StorageBin -----
  - method: POST
    path: "/storage-bins"
    description: "Create a warehouse bin."
    roles: [LogisticsOperator]
    code: 201
    input: [bin_code, warehouse_zone, capacity_kg]
    output: StorageBin
    side_effects: []

  - method: GET
    path: "/storage-bins/{id}"
    description: "Read a bin including current occupancy."
    roles: [LogisticsOperator, Grower, RegulatoryOfficer]
    code: 200
    input: []
    output: StorageBin
    side_effects: []

  # ----- LogisticsLeg -----
  - method: POST
    path: "/planting-batches/{id}/logistics-legs"
    description: "Plan a logistics leg for the batch."
    roles: [LogisticsOperator]
    code: 201
    input: [leg_index, from_party_id, to_party_id, depart_at, arrive_at, temperature_min_c, temperature_max_c]
    output: LogisticsLeg
    side_effects: []

  - method: POST
    path: "/logistics-legs/{id}/depart"
    description: "Mark leg as departed; transitions PLANNED→IN_TRANSIT."
    roles: [LogisticsOperator]
    code: 200
    input: []
    output: LogisticsLeg
    side_effects: ["batch status auto IN_TRANSIT on first leg"]

  - method: POST
    path: "/logistics-legs/{id}/acknowledge"
    description: "Receiving party (or RegulatoryOfficer for ABNORMAL) acknowledges the handover."
    roles: [Distributor, LogisticsOperator, RegulatoryOfficer]
    code: 200
    input: []
    output: LogisticsLeg
    side_effects: ["if last leg → batch DELIVERED; AuditLog STATE_TRANSITION"]

  - method: GET
    path: "/planting-batches/{id}/logistics-legs"
    description: "List legs for a batch ordered by leg_index ASC."
    roles: [Grower, Inspector, RegulatoryOfficer, LogisticsOperator, Distributor]
    code: 200
    input: ["limit?", "offset?"]
    output: LogisticsLeg[]
    side_effects: []

  # ----- SensorReading -----
  - method: POST
    path: "/logistics-legs/{id}/sensor-readings"
    description: "Ingest IoT temperature reading; idempotent on (logistics_leg_id, idempotency_key)."
    roles: [LogisticsOperator]
    code: 201
    input: [device_id, idempotency_key, reading_at, temperature_c]
    output: SensorReading
    side_effects: ["cold_chain_breach_detection recomputed; potential auto-transition leg → ABNORMAL → batch RECALLED"]

  - method: GET
    path: "/logistics-legs/{id}/sensor-readings"
    description: "List readings for a leg sorted by reading_at ASC."
    roles: [LogisticsOperator, RegulatoryOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: SensorReading[]
    side_effects: []

  # ----- Inspection -----
  - method: POST
    path: "/planting-batches/{id}/inspection-reports"
    description: "Create a draft inspection report."
    roles: [Inspector]
    code: 201
    input: ["sampling_rule", "test_items", "pesticide_residue_mg_per_kg?", "heavy_metals_mg_per_kg?", "microorganism_cfu_per_g?"]
    output: InspectionReport
    side_effects: []

  - method: POST
    path: "/inspection-reports/{id}/issue"
    description: "Issue the report; runs pass_fail_decision; cascades batch posture/status."
    roles: [Inspector]
    code: 200
    input: []
    output: InspectionReport
    side_effects: ["pass_fail_decision; cascade to PlantingBatch.status (INSPECTED_PASS or INSPECTED_FAIL); AuditLog STATE_TRANSITION"]

  - method: POST
    path: "/inspection-reports/{id}/revoke"
    description: "Revoke an issued report; cascades batch back to HARVESTED."
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: InspectionReport
    side_effects: ["batch reverts to HARVESTED unless DELIVERED/DISPOSED"]

  # ----- QRCode -----
  - method: POST
    path: "/harvest-records/{id}/qr-code"
    description: "Mint the QR code for this harvest record (one per record)."
    roles: [Grower]
    code: 201
    input: []
    output: QRCode
    side_effects: ["server-mint qr_code_value, anti_counterfeit_token"]

  - method: GET
    path: "/qr-codes/{qr_code_value}/trace"
    description: "Consumer full-chain query (planting, harvest, inspection, logistics)."
    roles: [Consumer, RegulatoryOfficer, Distributor]
    code: 200
    input: [anti_counterfeit_token]
    output: object
    side_effects: ["scan_count += 1; reject if revoked"]

  # ----- Distributor -----
  - method: POST
    path: "/distributors"
    description: "Register a distributor."
    roles: [RegulatoryOfficer]
    code: 201
    input: [name, contact_email, tier, notification_endpoint]
    output: Distributor
    side_effects: []

  - method: GET
    path: "/distributors"
    description: "List distributors."
    roles: [RegulatoryOfficer, LogisticsOperator]
    code: 200
    input: ["limit?", "offset?", "tier?"]
    output: Distributor[]
    side_effects: []

  # ----- RecallOrder -----
  - method: POST
    path: "/recall-orders"
    description: "Initiate a recall (manual)."
    roles: [RegulatoryOfficer]
    code: 201
    input: [planting_batch_id, recall_class, reason_code]
    output: RecallOrder
    side_effects: ["batch RECALLED cascade; QRCode revoked; LogisticsLeg PLANNED/IN_TRANSIT → ABNORMAL"]

  - method: POST
    path: "/recall-orders/{id}/notify"
    description: "Send recall notification to scope distributors (event_driven_sync)."
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: RecallOrder
    side_effects: ["emit recall_notification event per distributor"]

  - method: POST
    path: "/recall-orders/{id}/disposals"
    description: "Distributor records disposal of part or all of the recalled quantity."
    roles: [Distributor]
    code: 201
    input: [distributor_id, disposed_kg, disposed_at]
    output: RecallOrder
    side_effects: ["disposal_records appended; total_quantity_disposed_kg recomputed; status NOTIFIED→IN_PROGRESS on first record"]

  - method: POST
    path: "/recall-orders/{id}/complete"
    description: "Finalize recall after full disposal reconciliation."
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: RecallOrder
    side_effects: ["batch DISPOSED; recall_disposal_reconciliation must yield zero residual"]

  - method: POST
    path: "/recall-orders/{id}/cancel"
    description: "Cancel recall before any disposal occurs (mirrors INITIATED→CANCELLED)."
    roles: [RegulatoryOfficer]
    code: 200
    input: []
    output: RecallOrder
    side_effects: ["batch reverts; QRCode un-revoked"]

  - method: GET
    path: "/recall-orders/{id}"
    description: "Read a recall order including disposal history."
    roles: [RegulatoryOfficer, Distributor]
    code: 200
    input: []
    output: RecallOrder
    side_effects: []

  # ----- AuditLog -----
  - method: GET
    path: "/audit-logs"
    description: "Query audit trail (regulatory access). Supports entity_type, entity_id, action filters."
    roles: [RegulatoryOfficer]
    code: 200
    input: ["limit?", "offset?", "entity_type?", "entity_id?", "action?"]
    output: AuditLog[]
    side_effects: []

  # ----- Test driving (clock + sweep) -----
  - method: POST
    path: "/_clock/advance"
    description: "Test-only: advance the server's notion of 'now' to drive time-gated rules (withdrawal-period checks, recall scope snapshots)."
    roles: [RegulatoryOfficer]
    code: 200
    input: [to]
    output: object
    side_effects: ["server clock fast-forwards"]

  - method: POST
    path: "/_events/emit"
    description: "Test-only: simulate an external regulatory/logistics/retail event to exercise event-driven sync paths."
    roles: [RegulatoryOfficer]
    code: 200
    input: [event_type, payload]
    output: object
    side_effects: ["may trigger recall (e.g., REGULATORY_PROHIBITION_NOTICE) or distributor notification"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_MISSING
    http: 401
    condition: "X-User-ID or X-User-Role header missing or empty."

  - id: ERR_AUTH_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the recognized roles."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Acting role is not authorized to invoke this endpoint per RBAC matrix."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Requested resource does not exist (or is not visible to caller's role)."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the requested operation."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC: supplied version does not match current resource version."

  - id: ERR_PROHIBITED_SUBSTANCE
    http: 422
    condition: "AgrochemicalApplication references a PesticideRegistry entry with prohibited == true at application_date."

  - id: ERR_REGISTRATION_NOT_FOUND
    http: 422
    condition: "Referenced PesticideRegistry registration_no does not exist."

  - id: ERR_DOSAGE_EXCEEDED
    http: 422
    condition: "Application dosage_g_per_hectare exceeds the registry's max_dosage_per_hectare_g."

  - id: ERR_WITHDRAWAL_NOT_ELAPSED
    http: 422
    condition: "Harvest date precedes the batch's earliest_legal_harvest_date."

  - id: ERR_BIN_CAPACITY_EXCEEDED
    http: 409
    condition: "Adding the harvest weight would exceed the storage bin's capacity_kg (or bin is QUARANTINE)."

  - id: ERR_BATCH_CODE_INVALID
    http: 422
    condition: "PlantingBatch.batch_code fails format/uniqueness check."

  - id: ERR_PLANTING_DATES_INVALID
    http: 422
    condition: "expected_harvest_end < expected_harvest_start OR planting_date > expected_harvest_start."

  - id: ERR_LEG_INTERVAL_OVERLAP
    http: 422
    condition: "LogisticsLeg interval [depart_at, arrive_at) overlaps another leg of the same batch (closed-open semantics)."

  - id: ERR_READING_OUT_OF_LEG_WINDOW
    http: 422
    condition: "SensorReading.reading_at not in (depart_at, arrive_at]."

  - id: ERR_IDEMPOTENT_REPLAY
    http: 200
    condition: "Duplicate POST with same idempotency_key — original row is returned (not an error per se but recorded as a special outcome)."

  - id: ERR_SEGREGATION_VIOLATION
    http: 403
    condition: "Inspector.X-User-ID equals the PlantingBatch.grower_id at issuance time."

  - id: ERR_QR_ALREADY_BOUND
    http: 409
    condition: "QRCode already exists for the target HarvestRecord (one-code-one-product)."

  - id: ERR_QR_REVOKED
    http: 409
    condition: "QR code lookup encounters a revoked code (post-recall scan blocked)."

  - id: ERR_QR_TOKEN_INVALID
    http: 403
    condition: "Anti-counterfeit token does not match the stored token."

  - id: ERR_RECALL_ALREADY_ACTIVE
    http: 409
    condition: "Batch already has an ACTIVE_RECALL recall."

  - id: ERR_RECALL_OVER_DISPOSED
    http: 422
    condition: "Cumulative disposed_kg would exceed total_quantity_recalled_kg."

  - id: ERR_RECALL_RESIDUAL_NONZERO
    http: 422
    condition: "RecallOrder.complete called while total_quantity_disposed_kg < total_quantity_recalled_kg."

  - id: ERR_RECALL_HAS_DISPOSALS
    http: 409
    condition: "Recall cancellation attempted after at least one disposal record was appended."

  - id: ERR_VALIDATION
    http: 400
    condition: "Generic input validation failure (missing required field, type mismatch)."

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Grower
    description: "Farmer/producer who registers planting batches, records agrochemical applications and harvests, and mints QR codes for own batches."
    identity: "entity_backed:PlantingBatch"
    exclusive_operations:
      - "POST /planting-batches"
      - "POST /planting-batches/{id}/declare-growing"
      - "POST /planting-batches/{id}/agrochemical-applications"
      - "POST /planting-batches/{id}/harvest-records"
      - "POST /harvest-records/{id}/qr-code"
    shared_operations:
      - "GET /planting-batches (limited to own)"
      - "GET /planting-batches/{id} (own only)"
      - "GET /pesticide-registry"
      - "GET /storage-bins/{id}"

  - name: Inspector
    description: "Quality inspector who creates and issues inspection reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /planting-batches/{id}/inspection-reports"
      - "POST /inspection-reports/{id}/issue"
    shared_operations:
      - "GET /planting-batches/{id}"
      - "GET /pesticide-registry"

  - name: RegulatoryOfficer
    description: "Authority-level role: maintains pesticide registry, prohibits substances, initiates and finalizes recalls, revokes inspection reports, queries audit log, drives test clock and event injection."
    identity: "opaque"
    exclusive_operations:
      - "POST /pesticide-registry"
      - "PATCH /pesticide-registry/{registration_no}/prohibit"
      - "POST /distributors"
      - "POST /inspection-reports/{id}/revoke"
      - "POST /recall-orders"
      - "POST /recall-orders/{id}/notify"
      - "POST /recall-orders/{id}/complete"
      - "POST /recall-orders/{id}/cancel"
      - "GET /audit-logs"
      - "POST /_clock/advance"
      - "POST /_events/emit"
    shared_operations:
      - "GET endpoints across batches, distributors, recalls"

  - name: LogisticsOperator
    description: "Carrier role: plans legs, ingests sensor data, manages storage bins, departs and acknowledges legs."
    identity: "opaque"
    exclusive_operations:
      - "POST /storage-bins"
      - "POST /planting-batches/{id}/logistics-legs"
      - "POST /logistics-legs/{id}/depart"
      - "POST /logistics-legs/{id}/sensor-readings"
    shared_operations:
      - "POST /logistics-legs/{id}/acknowledge"
      - "GET listing endpoints for legs and bins"

  - name: Distributor
    description: "Wholesale or retail party that receives shipments and records disposals during recalls."
    identity: "entity_backed:Distributor"
    exclusive_operations:
      - "POST /recall-orders/{id}/disposals"
    shared_operations:
      - "POST /logistics-legs/{id}/acknowledge (only when X-User-ID == leg.to_party_id)"
      - "GET /recall-orders/{id}"
      - "GET /qr-codes/{qr_code_value}/trace"

  - name: Consumer
    description: "End consumer who scans QR codes for traceability."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /qr-codes/{qr_code_value}/trace"
