      - name: deny_override_longest_pattern_wins_over_radius
        claim_type: Violation -> Error
        grounds:
          - calculations.serviceability_check
          - entities.ServiceabilityOverride
        distinguishing_aspect: "A DENY override whose pattern matches the address blocks an otherwise in-radius quote (ERR_ADDRESS_NOT_SERVICEABLE); with both a DENY and a broader ALLOW pattern matching, the longest pattern wins, so adding a more specific ALLOW re-enables the same address."
        test_recipe:
          setup:
            - "Base chain through policy ACTIVE. Overrides: DENY 'Dest Rd' (len 7), then ALLOW '10 Dest' (len 7 ties? no — use ALLOW '10 Dest Rd' len 10 to win longest match over DENY len 7)."
          setup_api_calls:
            - *c_clock
            - *c_merchant
            - *c_activate
            - *c_store
            - *c_policy
            - *c_mgetv
            - *c_pact
            - call: "POST /stores/${s_id}/serviceability-overrides"
              payload: { address_pattern: "Dest Rd", effect: "DENY" }
              as: Merchant
              as_user_id: "${m_id}"
          trigger:
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "POST /stores/${s_id}/serviceability-overrides"
              payload: { address_pattern: "10 Dest Rd", effect: "ALLOW" }
              as: Merchant
              as_user_id: "${m_id}"
            - call: "POST /delivery-quotes"
              payload: { store_id: "${s_id}", dropoff_lat: 0.02, dropoff_lng: 0.0, address_text: "10 Dest Rd", order_value_cents: 5000, pickup_ready_at: "2026-09-01T09:00:00Z" }
              as: Merchant
              as_user_id: "${m_id}"
              captures: { q_id: $.data.id }
          assert:
            - "first quote: 409 and err == ERR_ADDRESS_NOT_SERVICEABLE (DENY match beats radius)"
            - "after the more specific ALLOW: quote succeeds 201 with quoted_fee_cents 500 (longest-pattern override wins)"

