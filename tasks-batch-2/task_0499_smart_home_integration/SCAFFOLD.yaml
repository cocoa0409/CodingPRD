# =============================================================================
# Smart Home & Home-Theater Integration (Control4 style) — Scaffold §1.0–§1.7
# =============================================================================
scenario: |
  499. Smart Home & Home-Theater Integration (Control4 style): project/design &
  equipment proposal, rack/network & device provisioning, automation scene
  programming, install scheduling & low-voltage crew, service/remote-support
  contract, firmware/update, warranty/RMA, change order

domain_name: smart-home-integration
api_prefix: /

# -----------------------------------------------------------------------------
# Complexity profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - scheduled_deferred_actions
    - derived_field_reconciliation

  entity_topology: hybrid
  # A Project root owns a Proposal, a Rack, scene programs, install Visits,
  # a service Contract and ChangeOrders (hierarchical), while Device and
  # CrewMember are flat peer entities referenced by FK across the tree,
  # and RmaTicket crosses the Device↔Contract aggregate boundary.

  state_machine_shape: branching
  # Project lifecycle forks at proposal acceptance and at change-order review;
  # Proposal has a revise→re-quote cycle; Visit has a reschedule cycle; RMA has
  # a return-vs-advance-replace branch. Several machines also carry guarded,
  # cross-entity transitions.

  relationship_patterns:
    - one_to_many        # Project -> ScenePrograms, Visits, ChangeOrders
    - many_to_many       # Visit <-> CrewMember via VisitAssignment junction
    - cross_aggregate    # RmaTicket references both a Device and the Contract
    - polymorphic        # ProposalLineItem.component_ref points at a Device sku catalog id

  role_model: peer_roles
  # SystemsDesigner owns proposals/design; ProjectManager owns scheduling &
  # change orders; LowVoltageTech owns visit execution & device provisioning;
  # SupportEngineer owns contracts/firmware/RMA; Client (entity-backed) approves
  # proposals & change orders; PlatformAdmin is the opaque operator.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Account holder name" }
      - { name: email, type: string, source: input, description: "Login/contact email; unique across Clients" }
      - { name: billing_tier, type: enum, source: input, default: "RESIDENTIAL", description: "RESIDENTIAL | COMMERCIAL — drives labor rate and tax treatment" }

  - name: Project
    parent: Client
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; the owning client" }
      - { name: site_address, type: string, source: input, description: "Physical install address" }
      - { name: region_code, type: enum, source: input, description: "Crew region: NORTH | SOUTH | EAST | WEST — install crew must serve this region" }
      - { name: status, type: enum, source: system, description: "DRAFT -> PROPOSED -> ACCEPTED -> PROVISIONING -> SCHEDULED -> INSTALLING -> COMMISSIONED -> ACTIVE / CANCELLED" }
      - { name: accepted_proposal_id, type: string, source: system, required: false, description: "FK -> Proposal.id; the Proposal version pinned at acceptance (version-pin on approval)" }
      - { name: provisioned_device_count, type: integer, source: computed, default: 0, description: "Count of Devices on this project's Rack in PROVISIONED or ONLINE state" }
      - { name: open_change_order_count, type: integer, source: computed, default: 0, description: "Count of ChangeOrders in SUBMITTED or APPROVED (not yet APPLIED/REJECTED) state" }
      - { name: contract_balance_cents, type: integer, source: computed, default: 0, description: "Remaining prepaid service hours value in cents on the active Contract; 0 if none" }

  - name: Proposal
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: revision, type: integer, source: system, default: 1, description: "Monotone revision number within the project; increments per superseding proposal" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SENT -> ACCEPTED / REJECTED / SUPERSEDED" }
      - { name: labor_hours_estimate, type: number, source: input, description: "Estimated low-voltage labor hours for install" }
      - { name: equipment_subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of (qty * unit_price_cents) across non-removed ProposalLineItems" }
      - { name: labor_cost_cents, type: integer, source: computed, default: 0, description: "labor_hours_estimate * region/tier labor rate, see calc proposal_total" }
      - { name: discount_cents, type: integer, source: computed, default: 0, description: "Volume + loyalty discount applied to equipment_subtotal_cents, see calc proposal_total" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Tax on taxable base, see calc proposal_total" }
      - { name: grand_total_cents, type: integer, source: computed, default: 0, description: "equipment_subtotal - discount + labor + tax, see calc proposal_total" }

  - name: ProposalLineItem
    parent: Proposal
    common_fields: true
    fields:
      - { name: proposal_id, type: string, source: system, description: "FK -> Proposal.id; owning proposal" }
      - { name: sku, type: string, source: input, description: "Equipment SKU/catalog code (polymorphic component reference into vendor catalog)" }
      - { name: category, type: enum, source: input, description: "CONTROLLER | AUDIO | VIDEO | NETWORK | LIGHTING | ACCESSORY — affects discount eligibility and tax" }
      - { name: qty, type: integer, source: input, description: "Quantity proposed; must be >= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit list price in cents" }
      - { name: removed, type: boolean, source: system, default: false, description: "Soft-removed from a DRAFT proposal; excluded from equipment_subtotal_cents" }

  - name: Rack
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; one rack per project" }
      - { name: rack_units_total, type: integer, source: input, description: "Total rack-unit (RU) capacity of the equipment rack" }
      - { name: rack_units_used, type: integer, source: computed, default: 0, description: "Sum of rack_units across Devices on this rack in REGISTERED/PROVISIONED/ONLINE state" }
      - { name: subnet_cidr, type: string, source: input, description: "Management subnet, e.g. 10.20.0.0/24 — bounds assignable device IPs" }
      - { name: ip_pool_size, type: integer, source: computed, default: 0, description: "Number of host addresses in subnet_cidr (2^(32-prefix) - 2)" }

  - name: Device
    parent: null
    common_fields: true
    fields:
      - { name: rack_id, type: string, source: input, description: "FK -> Rack.id; the rack this device is mounted in" }
      - { name: sku, type: string, source: input, description: "Equipment SKU; should match an accepted ProposalLineItem.sku" }
      - { name: category, type: enum, source: input, description: "CONTROLLER | AUDIO | VIDEO | NETWORK | LIGHTING | ACCESSORY" }
      - { name: rack_units, type: integer, source: input, default: 1, description: "Rack units occupied by this device (>= 0; 0 for non-rack accessories)" }
      - { name: mgmt_ip, type: string, source: system, required: false, description: "Management IP assigned from Rack.subnet_cidr at provisioning; null until PROVISIONED" }
      - { name: firmware_version, type: string, source: system, required: false, description: "Current firmware semver, e.g. 3.4.1; null until first applied update" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> PROVISIONED -> ONLINE -> RETIRED; or FAULTED (from ONLINE)" }
      - { name: is_controller, type: boolean, source: computed, default: false, description: "True iff category == CONTROLLER; scenes require an ONLINE controller" }

  - name: SceneProgram
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: name, type: string, source: input, description: "Scene name, e.g. 'Movie Night'; unique among non-ARCHIVED scenes per project" }
      - { name: device_ids, type: array, source: input, description: "Ordered list of Device.id this scene controls; each must belong to this project's rack" }
      - { name: status, type: enum, source: system, description: "DRAFT -> VALIDATED -> DEPLOYED -> ARCHIVED" }
      - { name: action_count, type: integer, source: input, description: "Number of programmed device actions in the scene; must be >= 1" }

  - name: Visit
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: region_code, type: enum, source: computed, description: "Copied from Project.region_code at creation; crew must serve it" }
      - { name: window_start, type: datetime, source: input, description: "Scheduled visit start (ISO 8601 UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Scheduled visit end; must be strictly after window_start" }
      - { name: visit_kind, type: enum, source: input, description: "INSTALL | COMMISSION | SERVICE — drives bubble-up: INSTALL drives PROVISIONING->SCHEDULED->INSTALLING, COMMISSION drives INSTALLING->COMMISSIONED" }
      - { name: status, type: enum, source: system, description: "PLANNED -> CONFIRMED -> IN_PROGRESS -> COMPLETED / CANCELLED / NO_SHOW" }
      - { name: crew_size_required, type: integer, source: input, description: "Number of crew members required; must be >= 1" }
      - { name: assigned_crew_count, type: integer, source: computed, default: 0, description: "Count of active VisitAssignments on this visit" }

  - name: CrewMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: region_code, type: enum, source: input, description: "Region this crew member serves: NORTH | SOUTH | EAST | WEST" }
      - { name: cert_level, type: enum, source: input, description: "APPRENTICE | JOURNEYMAN | MASTER — COMMISSION visits need >= JOURNEYMAN on at least one assignee" }
      - { name: daily_visit_cap, type: integer, source: input, default: 2, description: "Max concurrent-day visit assignments per UTC calendar day" }
      - { name: active, type: boolean, source: input, default: true, description: "Whether crew member is assignable" }

  - name: VisitAssignment
    parent: Visit
    common_fields: true
    fields:
      - { name: visit_id, type: string, source: system, description: "FK -> Visit.id; the visit being staffed" }
      - { name: crew_member_id, type: string, source: input, description: "FK -> CrewMember.id; the assigned technician" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> RELEASED — RELEASED assignments free capacity and do not count toward assigned_crew_count" }

  - name: Contract
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; one active service contract per project" }
      - { name: plan, type: enum, source: input, description: "BASIC | PLUS | PREMIER — sets monthly_fee and remote-support SLA" }
      - { name: prepaid_hours, type: number, source: input, description: "Prepaid remote-support hours bundled at activation; >= 0" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Overage support rate per hour in cents" }
      - { name: consumed_hours, type: number, source: computed, default: 0, description: "Support hours consumed against this contract (set by remote-support sessions)" }
      - { name: status, type: enum, source: system, description: "PENDING -> ACTIVE -> SUSPENDED -> CANCELLED; ACTIVE<->SUSPENDED cycle allowed" }
      - { name: balance_cents, type: integer, source: computed, default: 0, description: "Remaining prepaid value: max(0, round((prepaid_hours - consumed_hours) * hourly_rate_cents))" }

  - name: FirmwareUpdate
    parent: Device
    common_fields: true
    fields:
      - { name: device_id, type: string, source: system, description: "FK -> Device.id; the device targeted" }
      - { name: target_version, type: string, source: input, description: "Target firmware semver, e.g. 3.5.0; must be strictly greater than device.firmware_version" }
      - { name: status, type: enum, source: system, description: "STAGED -> APPLIED / ROLLED_BACK / FAILED" }
      - { name: prior_version, type: string, source: system, required: false, description: "Device.firmware_version captured at STAGED, restored on ROLLED_BACK" }

  - name: RmaTicket
    parent: null
    common_fields: true
    fields:
      - { name: device_id, type: string, source: input, description: "FK -> Device.id; the faulted device under warranty" }
      - { name: contract_id, type: string, source: input, description: "FK -> Contract.id; the service contract authorizing the RMA" }
      - { name: fault_code, type: enum, source: input, description: "HARDWARE | FIRMWARE | NETWORK | POWER — reason for return" }
      - { name: resolution, type: enum, source: input, default: "RETURN_REPAIR", description: "RETURN_REPAIR | ADVANCE_REPLACE — branch of the RMA flow" }
      - { name: status, type: enum, source: system, description: "OPENED -> AUTHORIZED -> SHIPPED -> CLOSED / DENIED" }
      - { name: replacement_device_id, type: string, source: system, required: false, description: "FK -> Device.id; new REGISTERED device minted for ADVANCE_REPLACE on AUTHORIZED" }

  - name: ChangeOrder
    parent: Project
    common_fields: true
    fields:
      - { name: project_id, type: string, source: system, description: "FK -> Project.id; owning project" }
      - { name: description, type: string, source: input, description: "What is changing (scope add/remove)" }
      - { name: delta_cents, type: integer, source: input, description: "Signed change to project grand total in cents (may be negative for credits)" }
      - { name: added_labor_hours, type: number, source: input, default: 0, description: "Additional labor hours introduced by this change (>= 0)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED -> APPLIED / REJECTED" }
      - { name: applied_at, type: datetime, source: system, required: false, description: "Logical clock time the change order was applied; null until APPLIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /projects/{id}/proposals/{proposalId}/send"
        actor: SystemsDesigner
        preconditions:
          - "Proposal has >= 1 ProposalLineItem with removed=false (ERR_EMPTY_PROPOSAL)"
          - "Project.status == DRAFT (ERR_INVALID_STATE)"
        side_effects:
          - "Recompute proposal_total (equipment_subtotal_cents, discount_cents, labor_cost_cents, tax_cents, grand_total_cents) and freeze line items against further edits"
          - "Project.status: DRAFT -> PROPOSED"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /projects/{id}/proposals/{proposalId}/accept"
        actor: Client
        preconditions:
          - "Acting Client owns the Project (ERR_NOT_OWNER)"
          - "Project.status == PROPOSED (ERR_INVALID_STATE)"
          - "No other Proposal of this project is already ACCEPTED (ERR_PROPOSAL_ALREADY_ACCEPTED)"
        side_effects:
          - "Project.accepted_proposal_id := this proposal id (version-pin on approval)"
          - "Project.status: PROPOSED -> ACCEPTED (bubble-up: triggers Rack auto-creatable state)"
      - from: SENT
        to: REJECTED
        trigger: "POST /projects/{id}/proposals/{proposalId}/reject"
        actor: Client
        preconditions:
          - "Acting Client owns the Project (ERR_NOT_OWNER)"
          - "Project.status == PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "Project.status: PROPOSED -> DRAFT (revision loop: designer may issue a superseding proposal)"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (when POST /projects/{id}/proposals creates a higher-revision proposal while this DRAFT is open)"
        actor: system
        preconditions: []
        side_effects: ["This proposal is closed; the new proposal carries revision = this.revision + 1"]
      - from: SENT
        to: SUPERSEDED
        trigger: "system (when a superseding proposal is created after a REJECTED-driven return to DRAFT project state)"
        actor: system
        preconditions: ["Project.status == DRAFT"]
        side_effects: ["This SENT proposal is closed in favor of the new revision"]

  - entity: Project
    initial_state: DRAFT
    terminal_states: [CANCELLED]
    transitions:
      - from: ACCEPTED
        to: PROVISIONING
        trigger: "POST /projects/{id}/start-provisioning"
        actor: ProjectManager
        preconditions:
          - "Project.accepted_proposal_id is set (ERR_INVALID_STATE)"
          - "A Rack exists for the project (ERR_RACK_REQUIRED)"
        side_effects: ["Devices may now be registered against the rack"]
      - from: PROVISIONING
        to: SCHEDULED
        trigger: "system (bubble-up when first INSTALL Visit reaches CONFIRMED)"
        actor: system
        preconditions: [">= 1 Visit of visit_kind INSTALL is CONFIRMED"]
        side_effects: []
      - from: SCHEDULED
        to: INSTALLING
        trigger: "system (bubble-up when an INSTALL Visit transitions to IN_PROGRESS)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INSTALLING
        to: COMMISSIONED
        trigger: "system (bubble-up when a COMMISSION Visit reaches COMPLETED and all project Devices are ONLINE)"
        actor: system
        preconditions:
          - "Every non-RETIRED Device on the project's rack is ONLINE (ERR_DEVICES_NOT_ONLINE)"
          - "At least one SceneProgram is DEPLOYED (ERR_NO_DEPLOYED_SCENE)"
        side_effects: []
      - from: COMMISSIONED
        to: ACTIVE
        trigger: "POST /projects/{id}/activate"
        actor: ProjectManager
        preconditions:
          - "A Contract for this project is ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "Project.open_change_order_count == 0 (ERR_OPEN_CHANGE_ORDERS)"
        side_effects: ["SERVICE visits and RMA tickets become permissible"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Cascade: any DRAFT/SENT Proposal -> SUPERSEDED"]
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "Cascade down: all non-terminal Visits -> CANCELLED (which releases each visit's ACTIVE VisitAssignments)"
          - "Cascade down: all non-RETIRED Devices -> RETIRED (releasing rack_units and mgmt_ip)"
      - from: PROVISIONING
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "Cascade down: all non-terminal Visits -> CANCELLED (which releases each visit's ACTIVE VisitAssignments)"
          - "Cascade down: all non-RETIRED Devices -> RETIRED (releasing rack_units and mgmt_ip)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /projects/{id}/cancel"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "Cascade down: all non-terminal Visits -> CANCELLED (which releases each visit's ACTIVE VisitAssignments)"
          - "Cascade down: all non-RETIRED Devices -> RETIRED (releasing rack_units and mgmt_ip)"

  - entity: Device
    initial_state: REGISTERED
    terminal_states: [RETIRED]
    transitions:
      - from: REGISTERED
        to: PROVISIONED
        trigger: "POST /devices/{id}/provision"
        actor: LowVoltageTech
        preconditions:
          - "Owning Project.status == PROVISIONING or later non-terminal (ERR_INVALID_STATE)"
          - "Rack has free RU: rack_units_used + device.rack_units <= rack_units_total (ERR_RACK_CAPACITY_EXCEEDED)"
          - "Rack management subnet has a free host address: provisioned device count < ip_pool_size (ERR_IP_POOL_EXHAUSTED)"
        side_effects:
          - "Assign mgmt_ip = lowest free host address in Rack.subnet_cidr (ascending numeric order)"
          - "Recompute Rack.rack_units_used and Project.provisioned_device_count"
      - from: PROVISIONED
        to: ONLINE
        trigger: "POST /devices/{id}/bring-online"
        actor: LowVoltageTech
        preconditions:
          - "device.firmware_version is set (a FirmwareUpdate has been APPLIED) (ERR_FIRMWARE_REQUIRED)"
        side_effects: ["Recompute Project.provisioned_device_count"]
      - from: ONLINE
        to: FAULTED
        trigger: "POST /devices/{id}/mark-faulted"
        actor: SupportEngineer
        preconditions: []
        side_effects:
          - "Cross-entity cascade: every DEPLOYED SceneProgram whose device_ids contains this device -> VALIDATED (de-deployed)"
          - "Recompute Project.provisioned_device_count"
      - from: FAULTED
        to: ONLINE
        trigger: "POST /devices/{id}/bring-online"
        actor: LowVoltageTech
        preconditions: ["device.firmware_version is set (ERR_FIRMWARE_REQUIRED)"]
        side_effects: ["Recompute Project.provisioned_device_count"]
      - from: REGISTERED
        to: RETIRED
        trigger: "POST /devices/{id}/retire OR cascade from Project cancel"
        actor: LowVoltageTech
        preconditions: ["Device not referenced by an OPEN/AUTHORIZED/SHIPPED RmaTicket (ERR_DEVICE_HAS_OPEN_RMA)"]
        side_effects: ["Release rack_units; recompute Rack.rack_units_used"]
      - from: PROVISIONED
        to: RETIRED
        trigger: "POST /devices/{id}/retire OR cascade from Project cancel"
        actor: LowVoltageTech
        preconditions: ["Device not referenced by an OPEN/AUTHORIZED/SHIPPED RmaTicket (ERR_DEVICE_HAS_OPEN_RMA)"]
        side_effects: ["Release mgmt_ip and rack_units; recompute Rack.rack_units_used and Project.provisioned_device_count"]
      - from: ONLINE
        to: RETIRED
        trigger: "POST /devices/{id}/retire OR cascade from Project cancel"
        actor: LowVoltageTech
        preconditions: ["Device not referenced by an OPEN/AUTHORIZED/SHIPPED RmaTicket (ERR_DEVICE_HAS_OPEN_RMA)"]
        side_effects:
          - "Cross-entity cascade: every DEPLOYED SceneProgram containing this device -> VALIDATED"
          - "Release mgmt_ip and rack_units; recompute Rack.rack_units_used and Project.provisioned_device_count"
      - from: FAULTED
        to: RETIRED
        trigger: "system (cascade when RmaTicket reaches SHIPPED with resolution RETURN_REPAIR)"
        actor: system
        preconditions: []
        side_effects: ["Release mgmt_ip and rack_units; recompute Rack.rack_units_used and Project.provisioned_device_count"]

  - entity: SceneProgram
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: VALIDATED
        trigger: "POST /projects/{id}/scenes/{sceneId}/validate"
        actor: SystemsDesigner
        preconditions:
          - "action_count >= 1 (ERR_EMPTY_SCENE)"
          - "Every Device in device_ids belongs to this project's Rack (ERR_SCENE_DEVICE_MISMATCH)"
          - "device_ids includes at least one Device with is_controller=true (ERR_NO_CONTROLLER_IN_SCENE)"
        side_effects: []
      - from: VALIDATED
        to: DEPLOYED
        trigger: "POST /projects/{id}/scenes/{sceneId}/deploy"
        actor: SystemsDesigner
        preconditions:
          - "Every Device in device_ids is ONLINE (ERR_SCENE_DEVICE_NOT_ONLINE)"
        side_effects: []
      - from: DEPLOYED
        to: VALIDATED
        trigger: "system (cross-entity cascade when a member Device goes FAULTED or RETIRED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: DRAFT
        trigger: "POST /projects/{id}/scenes/{sceneId}/revise"
        actor: SystemsDesigner
        preconditions: []
        side_effects: ["Scene re-opened for editing (revision loop)"]
      - from: DRAFT
        to: ARCHIVED
        trigger: "POST /projects/{id}/scenes/{sceneId}/archive"
        actor: SystemsDesigner
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: ARCHIVED
        trigger: "POST /projects/{id}/scenes/{sceneId}/archive"
        actor: SystemsDesigner
        preconditions: []
        side_effects: []

  - entity: Visit
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    transitions:
      - from: PLANNED
        to: CONFIRMED
        trigger: "POST /projects/{id}/visits/{visitId}/confirm"
        actor: ProjectManager
        preconditions:
          - "assigned_crew_count >= crew_size_required (ERR_UNDERSTAFFED_VISIT)"
          - "If visit_kind==COMMISSION: at least one ACTIVE assignee CrewMember has cert_level JOURNEYMAN or MASTER (ERR_CERT_TOO_LOW)"
        side_effects: ["Bubble-up: if visit_kind==INSTALL and Project.status==PROVISIONING -> Project.status SCHEDULED"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /projects/{id}/visits/{visitId}/cancel OR cascade from Project cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Release all ACTIVE VisitAssignments on this visit (status -> RELEASED)"]
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /projects/{id}/visits/{visitId}/cancel OR cascade from Project cancel"
        actor: ProjectManager
        preconditions: []
        side_effects: ["Release all ACTIVE VisitAssignments on this visit (status -> RELEASED)"]
      - from: CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /projects/{id}/visits/{visitId}/start"
        actor: LowVoltageTech
        preconditions:
          - "Logical clock >= window_start (ERR_VISIT_NOT_DUE)"
        side_effects: ["Bubble-up: if visit_kind==INSTALL and Project.status==SCHEDULED -> Project.status INSTALLING"]
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /projects/{id}/visits/{visitId}/complete"
        actor: LowVoltageTech
        preconditions: []
        side_effects:
          - "Bubble-up: if visit_kind==COMMISSION, attempt Project INSTALLING -> COMMISSIONED (guarded by all-devices-online + deployed-scene)"
          - "Release all ACTIVE VisitAssignments on this visit (status -> RELEASED)"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /projects/{id}/visits/{visitId}/no-show"
        actor: ProjectManager
        preconditions:
          - "Logical clock >= window_end (ERR_VISIT_NOT_DUE)"
        side_effects: ["Release all ACTIVE VisitAssignments on this visit (status -> RELEASED)"]

  - entity: VisitAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: ACTIVE
        to: RELEASED
        trigger: "POST /projects/{id}/visits/{visitId}/assignments/{assignmentId}/release OR cascade when the parent Visit transitions to CANCELLED / NO_SHOW / COMPLETED"
        actor: ProjectManager
        preconditions: []
        side_effects:
          - "Frees the crew member's capacity (this assignment no longer counts toward assigned_crew_count, crew_day_load, or crew time-overlap)"
          - "Recompute Visit.assigned_crew_count"

  - entity: Contract
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /projects/{id}/contract/activate"
        actor: SupportEngineer
        preconditions:
          - "Project.status is COMMISSIONED or ACTIVE (ERR_INVALID_STATE)"
          - "No other Contract of this project is ACTIVE or SUSPENDED (ERR_CONTRACT_ALREADY_ACTIVE)"
        side_effects: ["Recompute Contract.balance_cents and Project.contract_balance_cents"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /projects/{id}/contract/suspend"
        actor: SupportEngineer
        preconditions: []
        side_effects: ["Remote-support sessions and new RMA authorizations blocked while SUSPENDED"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /projects/{id}/contract/resume"
        actor: SupportEngineer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /projects/{id}/contract/cancel"
        actor: SupportEngineer
        preconditions: ["No RmaTicket on this contract in OPENED/AUTHORIZED/SHIPPED (ERR_CONTRACT_HAS_OPEN_RMA)"]
        side_effects: ["Project.contract_balance_cents -> 0"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /projects/{id}/contract/cancel"
        actor: SupportEngineer
        preconditions: ["No RmaTicket on this contract in OPENED/AUTHORIZED/SHIPPED (ERR_CONTRACT_HAS_OPEN_RMA)"]
        side_effects: ["Project.contract_balance_cents -> 0"]

  - entity: FirmwareUpdate
    initial_state: STAGED
    terminal_states: [APPLIED, ROLLED_BACK, FAILED]
    transitions:
      - from: STAGED
        to: APPLIED
        trigger: "POST /devices/{id}/firmware-updates/{updateId}/apply"
        actor: SupportEngineer
        preconditions:
          - "Device.status in {PROVISIONED, ONLINE, FAULTED} (ERR_INVALID_STATE)"
          - "target_version > Device.firmware_version by semver, or Device.firmware_version is null (ERR_FIRMWARE_NOT_NEWER)"
        side_effects:
          - "prior_version := Device.firmware_version (may be null)"
          - "Device.firmware_version := target_version"
      - from: STAGED
        to: FAILED
        trigger: "POST /devices/{id}/firmware-updates/{updateId}/fail"
        actor: SupportEngineer
        preconditions: []
        side_effects: ["Device.firmware_version unchanged"]
      - from: APPLIED
        to: ROLLED_BACK
        trigger: "POST /devices/{id}/firmware-updates/{updateId}/rollback"
        actor: SupportEngineer
        preconditions:
          - "This is the most recently APPLIED FirmwareUpdate for the device (ERR_NOT_LATEST_FIRMWARE)"
        side_effects:
          - "Compensation: Device.firmware_version := prior_version (restoring the exact value captured at STAGED)"

  - entity: RmaTicket
    initial_state: OPENED
    terminal_states: [CLOSED, DENIED]
    transitions:
      - from: OPENED
        to: AUTHORIZED
        trigger: "POST /rma-tickets/{rmaId}/authorize"
        actor: SupportEngineer
        preconditions:
          - "Contract.status == ACTIVE (ERR_CONTRACT_NOT_ACTIVE)"
          - "Device.status == FAULTED (ERR_DEVICE_NOT_FAULTED)"
        side_effects:
          - "If resolution==ADVANCE_REPLACE: cross-aggregate cascade — mint a new REGISTERED Device on the same Rack with the faulted device's sku/category/rack_units; set replacement_device_id"
      - from: OPENED
        to: DENIED
        trigger: "POST /rma-tickets/{rmaId}/deny"
        actor: SupportEngineer
        preconditions: []
        side_effects: []
      - from: AUTHORIZED
        to: SHIPPED
        trigger: "POST /rma-tickets/{rmaId}/ship"
        actor: SupportEngineer
        preconditions: []
        side_effects:
          - "If resolution==RETURN_REPAIR: cascade — faulted Device FAULTED -> RETIRED (releasing mgmt_ip + rack_units)"
      - from: SHIPPED
        to: CLOSED
        trigger: "POST /rma-tickets/{rmaId}/close"
        actor: SupportEngineer
        preconditions: []
        side_effects: []

  - entity: ChangeOrder
    initial_state: SUBMITTED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /projects/{id}/change-orders/{coId}/approve"
        actor: Client
        preconditions:
          - "Acting Client owns the Project (ERR_NOT_OWNER)"
          - "Project.status in {ACCEPTED, PROVISIONING, SCHEDULED, INSTALLING, COMMISSIONED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /projects/{id}/change-orders/{coId}/reject"
        actor: Client
        preconditions: ["Acting Client owns the Project (ERR_NOT_OWNER)"]
        side_effects: ["Recompute Project.open_change_order_count"]
      - from: APPROVED
        to: APPLIED
        trigger: "POST /projects/{id}/change-orders/{coId}/apply"
        actor: ProjectManager
        preconditions:
          - "Project.accepted_proposal_id is set (ERR_INVALID_STATE)"
        side_effects:
          - "Apply delta to accepted Proposal: grand_total_cents := grand_total_cents + delta_cents (the applied delta is authoritative for the total)"
          - "labor_hours_estimate := labor_hours_estimate + added_labor_hours; labor_cost_cents recomputed from the new labor hours for record-keeping (does NOT re-add to grand_total — the delta already accounts for it)"
          - "Set applied_at := logical clock now"
          - "Recompute Project.open_change_order_count"
      - from: APPROVED
        to: REJECTED
        trigger: "POST /projects/{id}/change-orders/{coId}/reject"
        actor: Client
        preconditions: ["Acting Client owns the Project (ERR_NOT_OWNER)"]
        side_effects: ["Recompute Project.open_change_order_count"]

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on parent version)
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: proposal-create-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/proposals"
    occ_field: "expected_project_version"
    description: |
      Creating a new Proposal against a Project whose version has advanced since
      the client last observed it is rejected. This captures the case where a
      superseding proposal (or a project-status change) has already mutated the
      project, so the current writer's view of the project — and of which DRAFT
      proposal it would supersede — is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: assignment-create-stale-visit
    parent_entity: Visit
    write_endpoint: "POST /projects/{id}/visits/{visitId}/assignments"
    occ_field: "expected_visit_version"
    description: |
      Creating a VisitAssignment against a Visit whose version has advanced since
      the client last observed it is rejected. This captures the case where the
      visit's staffing has already changed (another assignment added, or the
      visit confirmed) so the assigned_crew_count the writer reasoned about is
      stale and a fresh capacity re-check is required.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: change-order-apply-stale-project
    parent_entity: Project
    write_endpoint: "POST /projects/{id}/change-orders/{coId}/apply"
    occ_field: "expected_project_version"
    description: |
      Applying a ChangeOrder against a Project whose version has advanced since
      the client last observed it is rejected. This captures the case where a
      prior change order has already been applied (mutating the accepted
      proposal totals and the project), so the delta the writer computed against
      a stale grand total would corrupt the running total.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: proposal_total
    trigger: "Proposal DRAFT->SENT (send), and ChangeOrder APPROVED->APPLIED recompute on the accepted proposal"
    algorithm: tiered_pricing
    formula: |
      # Pinned evaluation order (circular-looking: discount depends on subtotal tier,
      # tax depends on post-discount base, grand_total depends on all):
      # 1) equipment_subtotal_cents = sum(li.qty * li.unit_price_cents
      #        for li in line_items if li.removed == false)
      # 2) discount_rate from VOLUME tier of equipment_subtotal_cents:
      #        subtotal <  500000        -> 0.00
      #        500000 <= subtotal < 2000000 -> 0.05
      #        subtotal >= 2000000        -> 0.10
      #    plus LOYALTY +0.02 if Client.billing_tier == COMMERCIAL
      #    discount_rate is capped at 0.12
      #    discount_cents = round_half_up(equipment_subtotal_cents * discount_rate)
      # 3) labor_cost_cents = round_half_up(labor_hours_estimate * labor_rate_cents)
      #        labor_rate_cents from region_code x billing_tier matrix (see constants)
      # 4) taxable_base = (equipment_subtotal_cents - discount_cents)   # labor is NOT taxed
      #        tax_rate = 0.00 if Client.billing_tier == COMMERCIAL else 0.0825
      #        tax_cents = round_half_up(taxable_base * tax_rate)
      # 5) grand_total_cents = (equipment_subtotal_cents - discount_cents)
      #                        + labor_cost_cents + tax_cents
    input_set: "ProposalLineItems with removed==false on the proposal; Client.billing_tier; Project.region_code"
    constants:
      VOLUME_T1_CENTS: 500000
      VOLUME_T2_CENTS: 2000000
      VOLUME_T1_RATE: 0.05
      VOLUME_T2_RATE: 0.10
      LOYALTY_COMMERCIAL_RATE: 0.02
      DISCOUNT_CAP_RATE: 0.12
      RESIDENTIAL_TAX_RATE: 0.0825
      COMMERCIAL_TAX_RATE: 0.00
      LABOR_RATE_CENTS:
        RESIDENTIAL: { NORTH: 12000, SOUTH: 10000, EAST: 13000, WEST: 11000 }
        COMMERCIAL:  { NORTH: 15000, SOUTH: 13000, EAST: 16000, WEST: 14000 }
    precision: "integer cents; round_half_up at each round() call above"
    variants:
      - name: estimate_at_send
        when: "Proposal DRAFT->SENT"
        difference: "Computed from line items only; labor_hours_estimate is the designer's input value."
      - name: final_after_change_orders
        when: "ChangeOrder APPLIED"
        difference: "grand_total_cents := grand_total_cents + delta_cents (the applied delta is authoritative — equipment_subtotal_cents, discount_cents, and tax_cents are NOT re-summed); labor_hours_estimate += added_labor_hours and labor_cost_cents is recomputed from the new labor hours for the record only, and is NOT re-added into grand_total. Multiple applied change orders accumulate: each adds its own delta_cents to the running grand_total_cents in apply order."

  - name: contract_balance
    trigger: "Contract PENDING->ACTIVE (activate); remote-support session consumes hours; ACTIVE->CANCELLED"
    algorithm: aggregation
    formula: |
      remaining_hours = prepaid_hours - consumed_hours
      if remaining_hours <= 0:
        balance_cents = 0
      else:
        balance_cents = round_half_up(remaining_hours * hourly_rate_cents)
      # Project.contract_balance_cents mirrors the active contract's balance_cents,
      # or 0 when no contract is ACTIVE/SUSPENDED.
    input_set: "The project's Contract in ACTIVE or SUSPENDED state; consumed_hours accumulated from POST /contract/consume calls"
    constants:
      FLOOR_CENTS: 0
    precision: "integer cents, round_half_up; floored at 0 (a conserved-quantity floor)"
    variants:
      - name: provisional_at_activation
        when: "Contract activate, consumed_hours == 0"
        difference: "balance = round_half_up(prepaid_hours * hourly_rate_cents)."
      - name: drawn_down
        when: "After remote-support consume sessions"
        difference: "balance reflects prepaid_hours - consumed_hours; never negative (floor at 0), so overage hours do not reduce the balance below zero."

  - name: ip_pool_size
    trigger: "Rack creation (derive from subnet_cidr)"
    algorithm: derived
    formula: |
      prefix = int(subnet_cidr.split('/')[1])
      ip_pool_size = (2 ** (32 - prefix)) - 2   # exclude network + broadcast
    input_set: "Rack.subnet_cidr"
    precision: "integer count"

  - name: mgmt_ip_allocation
    trigger: "Device REGISTERED->PROVISIONED (provision)"
    algorithm: waterfall_allocation
    formula: |
      # Host addresses in subnet_cidr, ascending numeric order, excluding the
      # network address (.0 offset) and broadcast (last). Skip any address
      # already held by a non-RETIRED Device on the same rack. Assign the
      # lowest free host address. If none free -> ERR_IP_POOL_EXHAUSTED.
      base = network_address(subnet_cidr)
      for offset in 1 .. (ip_pool_size):          # offset 0 is network addr
        candidate = base + offset
        if candidate not in {d.mgmt_ip for d in rack.devices if d.status != RETIRED}:
          return candidate
      raise ERR_IP_POOL_EXHAUSTED
    input_set: "Non-RETIRED Devices on the rack and their assigned mgmt_ip; Rack.subnet_cidr"
    precision: "exact IPv4 dotted-quad; deterministic lowest-free allocation (no randomness)"

  - name: rack_units_used
    trigger: "Device provision/retire and any status change in/out of {REGISTERED,PROVISIONED,ONLINE}"
    algorithm: aggregation
    formula: |
      rack_units_used = sum(d.rack_units for d in rack.devices
                            if d.status in {REGISTERED, PROVISIONED, ONLINE, FAULTED})
      # RETIRED devices release their RU.
    input_set: "Devices on the rack not in RETIRED state"
    precision: "integer RU"

  - name: crew_day_load
    trigger: "VisitAssignment creation (capacity guard)"
    algorithm: threshold
    formula: |
      # A crew member's load on a given UTC calendar day = number of ACTIVE
      # VisitAssignments whose Visit.window_start falls on that calendar day
      # (date(window_start) in UTC). Day key = window_start truncated to date.
      day = date(visit.window_start)   # UTC
      load = count(a for a in crew_member.assignments
                   if a.status == ACTIVE
                   and date(a.visit.window_start) == day)
      if load + 1 > crew_member.daily_visit_cap:
        raise ERR_CREW_DAILY_CAP_EXCEEDED
      # Boundary: load == daily_visit_cap rejects the (cap+1)-th; load == cap-1 accepts.
    input_set: "ACTIVE VisitAssignments of the crew member whose visit shares the same UTC calendar day as the target visit"
    constants:
      DEFAULT_DAILY_CAP: 2
    precision: "integer count; comparison uses > (strictly exceeding cap is rejected)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right (project before nested proposal/visit/scene/etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Acting entity-backed Client owns the referenced Project on ownership-gated operations (accept/reject proposal, approve/reject change order)"
    error_id: ERR_NOT_OWNER
    http_status: 403
    applies_to: "proposal accept/reject, change-order approve/reject"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enums in range; qty>=1, crew_size_required>=1, action_count>=1, window_end>window_start, rack_units>=0, prepaid_hours>=0, added_labor_hours>=0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all create/update endpoints with a body"

  - priority: 6
    category: business_referential
    check: "Foreign keys reference existing rows of the correct type and scope (Device.rack_id is a real Rack; VisitAssignment.crew_member_id is a real CrewMember; SceneProgram.device_ids all on the project's rack; RmaTicket device+contract belong to the same project)"
    error_id: ERR_REFERENTIAL_INTEGRITY
    http_status: 422
    applies_to: "device create, assignment create, scene create/validate, rma create"

  - priority: 7
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_temporal
    check: "Temporal ordering and clock gates: visit start requires clock>=window_start; no-show requires clock>=window_end; firmware target_version strictly newer than current"
    error_id: ERR_VISIT_NOT_DUE
    http_status: 409
    applies_to: "visit start, visit no-show"

  - priority: 9
    category: business_safety
    check: "Commission/online safety gates: scene needs a controller and all member devices ONLINE before deploy; commission visit needs a JOURNEYMAN+ assignee; device needs firmware before bring-online; project commission needs all devices ONLINE + a deployed scene"
    error_id: ERR_NO_CONTROLLER_IN_SCENE
    http_status: 409
    applies_to: "scene validate/deploy, visit confirm, device bring-online, project commission"

  - priority: 10
    category: business_temporal
    check: "Visit resource temporal-overlap (CLOSED interval): on visit create, the new visit's [window_start, window_end] may not overlap any non-terminal (PLANNED/CONFIRMED/IN_PROGRESS) Visit of the SAME Project. Closed-interval semantics: two visits that merely touch at an endpoint (visitA.window_end == visitB.window_start) DO conflict."
    error_id: ERR_VISIT_TIME_CONFLICT
    http_status: 409
    applies_to: "visit create"

  - priority: 11
    category: business_referential
    check: "Crew assignability: assigned CrewMember.active==true (else ERR_CREW_INACTIVE) and CrewMember.region_code == Visit.region_code (else ERR_CREW_REGION_MISMATCH)"
    error_id: ERR_CREW_REGION_MISMATCH
    http_status: 422
    applies_to: "assignment create"

  - priority: 12
    category: business_temporal
    check: "Crew resource temporal-overlap (HALF-OPEN interval): on assignment create, the crew member's other ACTIVE assignments' visit windows may not overlap the target visit window using [window_start, window_end) half-open semantics. Adjacency that merely touches at an endpoint (a.window_end == b.window_start) does NOT conflict."
    error_id: ERR_CREW_TIME_CONFLICT
    http_status: 409
    applies_to: "assignment create"

  - priority: 13
    category: business_constraint
    check: "Capacity/quota limits: crew daily visit cap (count of ACTIVE assignments on the same UTC calendar day + 1 must not exceed daily_visit_cap); rack RU (rack_units_used+rack_units<=rack_units_total); IP pool not exhausted; visit not understaffed at confirm"
    error_id: ERR_CREW_DAILY_CAP_EXCEEDED
    http_status: 409
    applies_to: "assignment create, device provision, visit confirm"

  - priority: 14
    category: business_fiscal
    check: "Fiscal gates last: project activation requires an ACTIVE contract and zero open change orders; contract activate requires no other active/suspended contract"
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 409
    applies_to: "project activate, contract activate"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_<parent>_version on guarded writes must equal current parent.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "proposal create, assignment create, change-order apply"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clients ----
  - method: POST
    path: "/clients"
    description: "Register a client account"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, "billing_tier?"]
    output: Client
    side_effects: []
  - method: GET
    path: "/clients/{clientId}"
    description: "Get a client"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, Client]
    code: 200
    input: []
    output: Client
    side_effects: []

  # ---- Projects ----
  - method: POST
    path: "/projects"
    description: "Create a project (status DRAFT)"
    roles: [ProjectManager, SystemsDesigner]
    code: 201
    input: [client_id, site_address, region_code]
    output: Project
    side_effects: ["status=DRAFT; computed counters initialized to 0"]
  - method: GET
    path: "/projects/{id}"
    description: "Get a project with computed counters"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, LowVoltageTech, Client]
    code: 200
    input: []
    output: Project
    side_effects: []
  - method: GET
    path: "/projects"
    description: "List projects, filterable by client_id or accepted_proposal_id (reverse-reachability for Project.client_id and Project.accepted_proposal_id)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, Client]
    code: 200
    input: ["client_id?", "accepted_proposal_id?", "status?", "limit?", "offset?"]
    output: Project[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/start-provisioning"
    description: "Move ACCEPTED project to PROVISIONING"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["status ACCEPTED->PROVISIONING"]
  - method: POST
    path: "/projects/{id}/activate"
    description: "Move COMMISSIONED project to ACTIVE"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects: ["status COMMISSIONED->ACTIVE; requires ACTIVE contract and zero open change orders"]
  - method: POST
    path: "/projects/{id}/cancel"
    description: "Cancel a project (cascades to visits and devices)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Project
    side_effects:
      - "status -> CANCELLED"
      - "cascade non-terminal Visits -> CANCELLED (releasing assignments)"
      - "cascade non-RETIRED Devices -> RETIRED (releasing RU and mgmt_ip)"
      - "DRAFT/SENT Proposals -> SUPERSEDED"

  # ---- Rack ----
  - method: POST
    path: "/projects/{id}/rack"
    description: "Create the project's rack"
    roles: [ProjectManager, SystemsDesigner]
    code: 201
    input: [rack_units_total, subnet_cidr]
    output: Rack
    side_effects: ["rack_units_used=0; ip_pool_size derived from subnet_cidr"]
  - method: GET
    path: "/projects/{id}/rack"
    description: "Get the project's rack (reverse-reachability for Rack.project_id; array of 0-1)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, LowVoltageTech, Client]
    code: 200
    input: []
    output: Rack[]
    side_effects: []

  # ---- Proposals ----
  - method: POST
    path: "/projects/{id}/proposals"
    description: "Create a proposal revision (supersedes any open DRAFT/SENT proposal). OCC-guarded on project version."
    roles: [SystemsDesigner]
    code: 201
    input: [labor_hours_estimate, expected_project_version]
    output: Proposal
    side_effects:
      - "revision = max(existing revision)+1; status=DRAFT"
      - "any open DRAFT/SENT Proposal -> SUPERSEDED"
      - "increments Project.version by 1"
  - method: GET
    path: "/projects/{id}/proposals"
    description: "List proposals of a project (reverse-reachability for Proposal.project_id)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/proposals/{proposalId}"
    description: "Get a proposal with computed totals (nested form)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, Client]
    code: 200
    input: []
    output: Proposal
    side_effects: []
  - method: GET
    path: "/proposals/{id}"
    description: "Get a proposal by id (flat form; defines the Proposal collection segment)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, Client]
    code: 200
    input: []
    output: Proposal
    side_effects: []
  - method: GET
    path: "/proposals/{id}/line-items"
    description: "List a proposal's line items (reverse-reachability for ProposalLineItem.proposal_id)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: ProposalLineItem[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/proposals/{proposalId}/line-items"
    description: "Add a line item to a DRAFT proposal"
    roles: [SystemsDesigner]
    code: 201
    input: [sku, category, qty, unit_price_cents]
    output: ProposalLineItem
    side_effects: ["recompute proposal totals (provisional)"]
  - method: GET
    path: "/projects/{id}/proposals/{proposalId}/line-items"
    description: "List line items of a proposal (reverse-reachability for ProposalLineItem.proposal_id)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, Client]
    code: 200
    input: ["limit?", "offset?"]
    output: ProposalLineItem[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/proposals/{proposalId}/line-items/{lineItemId}/remove"
    description: "Soft-remove a line item from a DRAFT proposal"
    roles: [SystemsDesigner]
    code: 200
    input: []
    output: ProposalLineItem
    side_effects: ["removed=true; recompute proposal totals"]
  - method: POST
    path: "/projects/{id}/proposals/{proposalId}/send"
    description: "Send proposal to client (freezes and totals it)"
    roles: [SystemsDesigner]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status DRAFT->SENT; run proposal_total; Project PROPOSED"]
  - method: POST
    path: "/projects/{id}/proposals/{proposalId}/accept"
    description: "Client accepts a SENT proposal"
    roles: [Client]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status SENT->ACCEPTED; Project.accepted_proposal_id pinned; Project PROPOSED->ACCEPTED"]
  - method: POST
    path: "/projects/{id}/proposals/{proposalId}/reject"
    description: "Client rejects a SENT proposal"
    roles: [Client]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status SENT->REJECTED; Project PROPOSED->DRAFT"]

  # ---- Devices ----
  - method: POST
    path: "/devices"
    description: "Register a device against a rack (status REGISTERED)"
    roles: [LowVoltageTech, ProjectManager]
    code: 201
    input: [rack_id, sku, category, "rack_units?"]
    output: Device
    side_effects: ["status=REGISTERED; is_controller derived from category; recompute Rack.rack_units_used"]
  - method: GET
    path: "/devices/{id}"
    description: "Get a device"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, LowVoltageTech, Client]
    code: 200
    input: []
    output: Device
    side_effects: []
  - method: GET
    path: "/devices"
    description: "List devices, filterable by rack_id (reverse-reachability for Device.rack_id)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, LowVoltageTech, Client]
    code: 200
    input: ["rack_id?", "status?", "limit?", "offset?"]
    output: Device[]
    side_effects: []
  - method: POST
    path: "/devices/{id}/provision"
    description: "Provision a device: allocate mgmt_ip + RU"
    roles: [LowVoltageTech]
    code: 200
    input: []
    output: Device
    side_effects: ["status REGISTERED->PROVISIONED; assign lowest free mgmt_ip; recompute counters"]
  - method: POST
    path: "/devices/{id}/bring-online"
    description: "Bring a PROVISIONED or FAULTED device ONLINE (requires firmware)"
    roles: [LowVoltageTech]
    code: 200
    input: []
    output: Device
    side_effects: ["status -> ONLINE; recompute Project.provisioned_device_count"]
  - method: POST
    path: "/devices/{id}/mark-faulted"
    description: "Mark an ONLINE device FAULTED (de-deploys scenes containing it)"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: Device
    side_effects: ["status ONLINE->FAULTED; DEPLOYED scenes with this device -> VALIDATED"]
  - method: POST
    path: "/devices/{id}/retire"
    description: "Retire a device (releases RU + mgmt_ip)"
    roles: [LowVoltageTech]
    code: 200
    input: []
    output: Device
    side_effects: ["status -> RETIRED; release RU/mgmt_ip; de-deploy scenes if was ONLINE"]

  # ---- Firmware ----
  - method: POST
    path: "/devices/{id}/firmware-updates"
    description: "Stage a firmware update for a device"
    roles: [SupportEngineer]
    code: 201
    input: [target_version]
    output: FirmwareUpdate
    side_effects: ["status=STAGED"]
  - method: GET
    path: "/devices/{id}/firmware-updates"
    description: "List firmware updates of a device (reverse-reachability for FirmwareUpdate.device_id)"
    roles: [PlatformAdmin, SupportEngineer, LowVoltageTech, ProjectManager]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FirmwareUpdate[]
    side_effects: []
  - method: POST
    path: "/devices/{id}/firmware-updates/{updateId}/apply"
    description: "Apply a staged firmware update"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: FirmwareUpdate
    side_effects: ["status STAGED->APPLIED; prior_version captured; Device.firmware_version := target_version"]
  - method: POST
    path: "/devices/{id}/firmware-updates/{updateId}/fail"
    description: "Mark a staged firmware update FAILED"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: FirmwareUpdate
    side_effects: ["status STAGED->FAILED; firmware unchanged"]
  - method: POST
    path: "/devices/{id}/firmware-updates/{updateId}/rollback"
    description: "Roll back the latest applied firmware update"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: FirmwareUpdate
    side_effects: ["status APPLIED->ROLLED_BACK; Device.firmware_version := prior_version"]

  # ---- Scenes ----
  - method: POST
    path: "/projects/{id}/scenes"
    description: "Create a scene program (status DRAFT)"
    roles: [SystemsDesigner]
    code: 201
    input: [name, device_ids, action_count]
    output: SceneProgram
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/projects/{id}/scenes"
    description: "List scenes of a project (reverse-reachability for SceneProgram.project_id)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SceneProgram[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/scenes/{sceneId}"
    description: "Get a scene program"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, Client]
    code: 200
    input: []
    output: SceneProgram
    side_effects: []
  - method: POST
    path: "/projects/{id}/scenes/{sceneId}/validate"
    description: "Validate a DRAFT scene (controller + membership checks)"
    roles: [SystemsDesigner]
    code: 200
    input: []
    output: SceneProgram
    side_effects: ["status DRAFT->VALIDATED"]
  - method: POST
    path: "/projects/{id}/scenes/{sceneId}/deploy"
    description: "Deploy a VALIDATED scene (all devices must be ONLINE)"
    roles: [SystemsDesigner]
    code: 200
    input: []
    output: SceneProgram
    side_effects: ["status VALIDATED->DEPLOYED"]
  - method: POST
    path: "/projects/{id}/scenes/{sceneId}/revise"
    description: "Re-open a VALIDATED scene to DRAFT"
    roles: [SystemsDesigner]
    code: 200
    input: []
    output: SceneProgram
    side_effects: ["status VALIDATED->DRAFT"]
  - method: POST
    path: "/projects/{id}/scenes/{sceneId}/archive"
    description: "Archive a DRAFT or VALIDATED scene"
    roles: [SystemsDesigner]
    code: 200
    input: []
    output: SceneProgram
    side_effects: ["status -> ARCHIVED"]

  # ---- Visits & assignments ----
  - method: POST
    path: "/projects/{id}/visits"
    description: "Create a visit (status PLANNED). Requires Project.status in {ACCEPTED, PROVISIONING, SCHEDULED, INSTALLING, COMMISSIONED, ACTIVE} (else ERR_INVALID_STATE). Rejected with ERR_VISIT_TIME_CONFLICT if [window_start, window_end] (closed) overlaps a non-terminal visit of the same project."
    roles: [ProjectManager]
    code: 201
    input: [window_start, window_end, visit_kind, crew_size_required]
    output: Visit
    side_effects: ["status=PLANNED; region_code copied from project"]
  - method: GET
    path: "/projects/{id}/visits"
    description: "List visits of a project (reverse-reachability for Visit.project_id)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, LowVoltageTech, Client]
    code: 200
    input: ["visit_kind?", "status?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/visits/{visitId}"
    description: "Get a visit (nested form)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, LowVoltageTech, Client]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/visits/{id}"
    description: "Get a visit by id (flat form; defines the Visit collection segment)"
    roles: [PlatformAdmin, SystemsDesigner, ProjectManager, SupportEngineer, LowVoltageTech, Client]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/visits/{id}/assignments"
    description: "List a visit's assignments (reverse-reachability for VisitAssignment.visit_id)"
    roles: [PlatformAdmin, ProjectManager, LowVoltageTech]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VisitAssignment[]
    side_effects: []
  - method: GET
    path: "/crew-members/{id}/assignments"
    description: "List a crew member's assignments (reverse-reachability for VisitAssignment.crew_member_id)"
    roles: [PlatformAdmin, ProjectManager, LowVoltageTech]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VisitAssignment[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/visits/{visitId}/assignments"
    description: "Assign a crew member to a visit. Enforces (in order) crew active/region match, half-open time-overlap, then daily cap. OCC-guarded on visit version."
    roles: [ProjectManager]
    code: 201
    input: [crew_member_id, expected_visit_version]
    output: VisitAssignment
    side_effects:
      - "status=ACTIVE; recompute Visit.assigned_crew_count"
      - "increments Visit.version by 1"
  - method: GET
    path: "/projects/{id}/visits/{visitId}/assignments"
    description: "List assignments of a visit (reverse-reachability for VisitAssignment.visit_id)"
    roles: [PlatformAdmin, ProjectManager, LowVoltageTech]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: VisitAssignment[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/visits/{visitId}/assignments/{assignmentId}/release"
    description: "Release a crew assignment (frees capacity)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: VisitAssignment
    side_effects: ["status ACTIVE->RELEASED; recompute Visit.assigned_crew_count"]
  - method: POST
    path: "/projects/{id}/visits/{visitId}/confirm"
    description: "Confirm a PLANNED visit (staffing + cert gates)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Visit
    side_effects: ["status PLANNED->CONFIRMED; bubble-up project SCHEDULED for INSTALL"]
  - method: POST
    path: "/projects/{id}/visits/{visitId}/start"
    description: "Start a CONFIRMED visit (clock gate)"
    roles: [LowVoltageTech]
    code: 200
    input: []
    output: Visit
    side_effects: ["status CONFIRMED->IN_PROGRESS; bubble-up project INSTALLING for INSTALL"]
  - method: POST
    path: "/projects/{id}/visits/{visitId}/complete"
    description: "Complete an IN_PROGRESS visit"
    roles: [LowVoltageTech]
    code: 200
    input: []
    output: Visit
    side_effects: ["status IN_PROGRESS->COMPLETED; release assignments; bubble-up commission for COMMISSION"]
  - method: POST
    path: "/projects/{id}/visits/{visitId}/cancel"
    description: "Cancel a PLANNED/CONFIRMED visit"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Visit
    side_effects: ["status -> CANCELLED; release assignments"]
  - method: POST
    path: "/projects/{id}/visits/{visitId}/no-show"
    description: "Mark a CONFIRMED visit NO_SHOW (clock past window_end)"
    roles: [ProjectManager]
    code: 200
    input: []
    output: Visit
    side_effects: ["status CONFIRMED->NO_SHOW; release assignments"]

  # ---- Crew ----
  - method: POST
    path: "/crew-members"
    description: "Register a crew member"
    roles: [PlatformAdmin, ProjectManager]
    code: 201
    input: [full_name, region_code, cert_level, "daily_visit_cap?", "active?"]
    output: CrewMember
    side_effects: []
  - method: GET
    path: "/crew-members/{crewMemberId}"
    description: "Get a crew member"
    roles: [PlatformAdmin, ProjectManager, LowVoltageTech]
    code: 200
    input: []
    output: CrewMember
    side_effects: []

  # ---- Contract ----
  - method: POST
    path: "/projects/{id}/contract"
    description: "Create the service contract (status PENDING)"
    roles: [SupportEngineer, ProjectManager]
    code: 201
    input: [plan, prepaid_hours, hourly_rate_cents]
    output: Contract
    side_effects: ["status=PENDING; consumed_hours=0; balance_cents=0"]
  - method: GET
    path: "/projects/{id}/contract"
    description: "Get the project's contract(s) (reverse-reachability for Contract.project_id; array of 0-1)"
    roles: [PlatformAdmin, SupportEngineer, ProjectManager, Client]
    code: 200
    input: []
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/projects/{id}/contract/activate"
    description: "Activate the PENDING contract"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: Contract
    side_effects: ["status PENDING->ACTIVE; compute balance_cents; mirror Project.contract_balance_cents"]
  - method: POST
    path: "/projects/{id}/contract/suspend"
    description: "Suspend an ACTIVE contract"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: Contract
    side_effects: ["status ACTIVE->SUSPENDED"]
  - method: POST
    path: "/projects/{id}/contract/resume"
    description: "Resume a SUSPENDED contract"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: Contract
    side_effects: ["status SUSPENDED->ACTIVE"]
  - method: POST
    path: "/projects/{id}/contract/cancel"
    description: "Cancel a contract"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: Contract
    side_effects: ["status -> CANCELLED; Project.contract_balance_cents -> 0"]
  - method: POST
    path: "/projects/{id}/contract/consume"
    description: "Record a remote-support session consuming support hours"
    roles: [SupportEngineer]
    code: 200
    input: [hours]
    output: Contract
    side_effects: ["consumed_hours += hours; recompute balance_cents and Project.contract_balance_cents"]

  # ---- RMA ----
  - method: POST
    path: "/rma-tickets"
    description: "Open an RMA ticket for a faulted device under a contract"
    roles: [SupportEngineer]
    code: 201
    input: [device_id, contract_id, fault_code, "resolution?"]
    output: RmaTicket
    side_effects: ["status=OPENED"]
  - method: GET
    path: "/rma-tickets/{rmaId}"
    description: "Get an RMA ticket"
    roles: [PlatformAdmin, SupportEngineer, ProjectManager]
    code: 200
    input: []
    output: RmaTicket
    side_effects: []
  - method: GET
    path: "/rma-tickets"
    description: "List RMA tickets, filterable by device_id, replacement_device_id, or contract_id (reverse-reachability for RmaTicket.device_id, RmaTicket.replacement_device_id, and RmaTicket.contract_id)"
    roles: [PlatformAdmin, SupportEngineer, ProjectManager]
    code: 200
    input: ["device_id?", "replacement_device_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: RmaTicket[]
    side_effects: []
  - method: POST
    path: "/rma-tickets/{rmaId}/authorize"
    description: "Authorize an OPENED RMA (advance-replace mints a replacement device)"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: RmaTicket
    side_effects: ["status OPENED->AUTHORIZED; ADVANCE_REPLACE mints replacement REGISTERED device, sets replacement_device_id"]
  - method: POST
    path: "/rma-tickets/{rmaId}/deny"
    description: "Deny an OPENED RMA"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: RmaTicket
    side_effects: ["status OPENED->DENIED"]
  - method: POST
    path: "/rma-tickets/{rmaId}/ship"
    description: "Ship an AUTHORIZED RMA (return-repair retires the faulted device)"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: RmaTicket
    side_effects: ["status AUTHORIZED->SHIPPED; RETURN_REPAIR retires faulted device"]
  - method: POST
    path: "/rma-tickets/{rmaId}/close"
    description: "Close a SHIPPED RMA"
    roles: [SupportEngineer]
    code: 200
    input: []
    output: RmaTicket
    side_effects: ["status SHIPPED->CLOSED"]

  # ---- Change orders ----
  - method: POST
    path: "/projects/{id}/change-orders"
    description: "Submit a change order (status SUBMITTED)"
    roles: [ProjectManager, SystemsDesigner]
    code: 201
    input: [description, delta_cents, "added_labor_hours?"]
    output: ChangeOrder
    side_effects: ["status=SUBMITTED; recompute Project.open_change_order_count"]
  - method: GET
    path: "/projects/{id}/change-orders"
    description: "List change orders of a project (reverse-reachability for ChangeOrder.project_id)"
    roles: [PlatformAdmin, ProjectManager, SystemsDesigner, Client]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ChangeOrder[]
    side_effects: []
  - method: GET
    path: "/projects/{id}/change-orders/{coId}"
    description: "Get a change order"
    roles: [PlatformAdmin, ProjectManager, SystemsDesigner, Client]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []
  - method: POST
    path: "/projects/{id}/change-orders/{coId}/approve"
    description: "Client approves a SUBMITTED change order"
    roles: [Client]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status SUBMITTED->APPROVED"]
  - method: POST
    path: "/projects/{id}/change-orders/{coId}/reject"
    description: "Client rejects a SUBMITTED/APPROVED change order"
    roles: [Client]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status -> REJECTED; recompute Project.open_change_order_count"]
  - method: POST
    path: "/projects/{id}/change-orders/{coId}/apply"
    description: "Apply an APPROVED change order to the accepted proposal. OCC-guarded on project version."
    roles: [ProjectManager]
    code: 200
    input: [expected_project_version]
    output: ChangeOrder
    side_effects:
      - "status APPROVED->APPLIED; applied_at set"
      - "accepted Proposal grand_total/labor recomputed; recompute Project.open_change_order_count"
      - "increments Project.version by 1"

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock for deterministic temporal tests. Server startup default is 2026-01-01T00:00:00Z; before any set call the logical clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock now := to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_OWNER, http: 403, condition: "Acting Client does not own the referenced project" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist or is out of scope" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed body field, enum out of range, or numeric bound violated (qty<1, window_end<=window_start, etc.)" }
  - { id: ERR_REFERENTIAL_INTEGRITY, http: 422, condition: "Foreign key references a non-existent or wrong-scope row (device rack, assignment crew, scene devices, rma device/contract project mismatch)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_EMPTY_PROPOSAL, http: 409, condition: "Sending a proposal with no non-removed line items" }
  - { id: ERR_PROPOSAL_ALREADY_ACCEPTED, http: 409, condition: "Another proposal of this project is already ACCEPTED" }
  - { id: ERR_RACK_REQUIRED, http: 409, condition: "start-provisioning before a rack exists for the project" }
  - { id: ERR_RACK_CAPACITY_EXCEEDED, http: 409, condition: "Provisioning a device would exceed rack_units_total" }
  - { id: ERR_IP_POOL_EXHAUSTED, http: 409, condition: "No free management host address in the rack subnet" }
  - { id: ERR_FIRMWARE_REQUIRED, http: 409, condition: "bring-online before the device has applied firmware" }
  - { id: ERR_FIRMWARE_NOT_NEWER, http: 409, condition: "Applying firmware whose target_version is not strictly greater than the device's current firmware" }
  - { id: ERR_NOT_LATEST_FIRMWARE, http: 409, condition: "Rolling back a firmware update that is not the most recently APPLIED for the device" }
  - { id: ERR_EMPTY_SCENE, http: 409, condition: "Validating a scene with action_count < 1" }
  - { id: ERR_SCENE_DEVICE_MISMATCH, http: 422, condition: "Scene references a device not on this project's rack" }
  - { id: ERR_NO_CONTROLLER_IN_SCENE, http: 409, condition: "Validating a scene whose device_ids contain no CONTROLLER device" }
  - { id: ERR_SCENE_DEVICE_NOT_ONLINE, http: 409, condition: "Deploying a scene while a member device is not ONLINE" }
  - { id: ERR_UNDERSTAFFED_VISIT, http: 409, condition: "Confirming a visit with assigned_crew_count < crew_size_required" }
  - { id: ERR_CERT_TOO_LOW, http: 409, condition: "Confirming a COMMISSION visit without a JOURNEYMAN+ assignee" }
  - { id: ERR_VISIT_NOT_DUE, http: 409, condition: "Starting before window_start, or no-show before window_end (logical clock gate)" }
  - { id: ERR_CREW_TIME_CONFLICT, http: 409, condition: "Crew member assignment overlaps an existing ACTIVE assignment interval [window_start, window_end) (half-open)" }
  - { id: ERR_VISIT_TIME_CONFLICT, http: 409, condition: "New visit window overlaps a non-terminal visit of the same project [window_start, window_end] (closed; touching endpoints conflict)" }
  - { id: ERR_CREW_DAILY_CAP_EXCEEDED, http: 409, condition: "Assignment would exceed the crew member's daily_visit_cap for the visit's UTC calendar day" }
  - { id: ERR_CREW_REGION_MISMATCH, http: 422, condition: "Assigned crew member does not serve the visit's region_code" }
  - { id: ERR_CREW_INACTIVE, http: 422, condition: "Assigned crew member is not active" }
  - { id: ERR_DEVICES_NOT_ONLINE, http: 409, condition: "Project commission requires all non-RETIRED devices ONLINE" }
  - { id: ERR_NO_DEPLOYED_SCENE, http: 409, condition: "Project commission requires at least one DEPLOYED scene" }
  - { id: ERR_DEVICE_NOT_FAULTED, http: 409, condition: "Authorizing an RMA whose device is not FAULTED" }
  - { id: ERR_DEVICE_HAS_OPEN_RMA, http: 409, condition: "Retiring a device referenced by an OPEN/AUTHORIZED/SHIPPED RMA" }
  - { id: ERR_CONTRACT_NOT_ACTIVE, http: 409, condition: "Operation requires an ACTIVE contract (project activate, RMA authorize)" }
  - { id: ERR_CONTRACT_ALREADY_ACTIVE, http: 409, condition: "Activating a contract when another is already ACTIVE/SUSPENDED" }
  - { id: ERR_CONTRACT_HAS_OPEN_RMA, http: 409, condition: "Cancelling a contract with an open RMA (OPENED/AUTHORIZED/SHIPPED)" }
  - { id: ERR_OPEN_CHANGE_ORDERS, http: 409, condition: "Activating a project with open change orders (open_change_order_count > 0)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the current parent version (OCC)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operational super-user: onboards clients/crew, runs the test clock, reads everything."
    identity: opaque
    exclusive_operations:
      - "POST /clients — register client"
      - "POST /_clock/set_current_utc — set logical clock"
    shared_operations:
      - "POST /crew-members — register crew (with ProjectManager)"
      - "GET (read) on all resources"

  - name: SystemsDesigner
    description: "Owns design & equipment proposals and automation scene programming."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/proposals — create proposal revision"
      - "POST .../proposals/{id}/line-items — add line item"
      - "POST .../proposals/{id}/line-items/{id}/remove — remove line item"
      - "POST .../proposals/{id}/send — send proposal"
      - "POST .../scenes — create scene"
      - "POST .../scenes/{id}/validate|deploy|revise|archive — scene lifecycle"
    shared_operations:
      - "POST /projects — create project (with ProjectManager)"
      - "POST /projects/{id}/rack — create rack (with ProjectManager)"
      - "POST /projects/{id}/change-orders — submit change order (with ProjectManager)"
      - "GET reads on projects, proposals, scenes, devices, visits"

  - name: ProjectManager
    description: "Owns project lifecycle, install scheduling, crew assignment, and change-order application."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/start-provisioning|activate|cancel — project lifecycle"
      - "POST .../visits — create visit"
      - "POST .../visits/{id}/assignments — assign crew"
      - "POST .../visits/{id}/assignments/{id}/release — release crew"
      - "POST .../visits/{id}/confirm|cancel|no-show — visit scheduling"
      - "POST .../change-orders/{id}/apply — apply change order"
    shared_operations:
      - "POST /projects — create project (with SystemsDesigner)"
      - "POST /projects/{id}/rack — create rack (with SystemsDesigner)"
      - "POST /devices — register device (with LowVoltageTech)"
      - "POST /crew-members — register crew (with PlatformAdmin)"
      - "POST /projects/{id}/contract — create contract (with SupportEngineer)"
      - "POST .../change-orders — submit change order (with SystemsDesigner)"
      - "GET reads"

  - name: LowVoltageTech
    description: "Low-voltage crew: provisions devices and executes install/commission visits."
    identity: opaque
    exclusive_operations:
      - "POST /devices/{id}/provision|bring-online|retire — device provisioning"
      - "POST .../visits/{id}/start|complete — visit execution"
    shared_operations:
      - "POST /devices — register device (with ProjectManager)"
      - "GET reads on devices, visits, racks, firmware"

  - name: SupportEngineer
    description: "Owns service/remote-support contracts, firmware/updates, and warranty/RMA."
    identity: opaque
    exclusive_operations:
      - "POST /projects/{id}/contract/activate|suspend|resume|cancel|consume — contract lifecycle"
      - "POST /devices/{id}/mark-faulted — fault a device"
      - "POST /devices/{id}/firmware-updates(+apply/fail/rollback) — firmware lifecycle"
      - "POST /rma-tickets(+authorize/deny/ship/close) — RMA lifecycle"
    shared_operations:
      - "POST /projects/{id}/contract — create contract (with ProjectManager)"
      - "GET reads"

  - name: Client
    description: "Project owner; accepts/rejects proposals and approves/rejects change orders."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST .../proposals/{id}/accept|reject — proposal decision"
      - "POST .../change-orders/{id}/approve|reject — change-order decision"
    shared_operations:
      - "GET reads on own projects, proposals, scenes, visits, contract, change orders"
