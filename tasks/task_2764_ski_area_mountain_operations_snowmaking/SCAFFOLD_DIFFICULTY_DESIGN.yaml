              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-2", role_on_lift: "BOTTOM_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
