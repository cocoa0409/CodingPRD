      - name: foreign_reporting_entity_cannot_touch_another_firms_filings
        claim_type: peer_isolation
        grounds:
          - validations.priority_6_ERR_FOREIGN_REPORTING_ENTITY
          - roles.ReporterAgent.identity
        distinguishing_aspect: |
          The entity-backed identity boundary between two peer reporters, which is
          a 403 distinct from the role gate: Bravo holds the ReporterAgent role,
          so every call passes rungs 1 and 2 and is refused only because the
          target belongs to Alpha — filing on Alpha's plant, attaching a line item
          to Alpha's filing, and appealing Alpha's registration. The same calls on
          Bravo's own plant succeed, and Bravo can still read the shared registry.
