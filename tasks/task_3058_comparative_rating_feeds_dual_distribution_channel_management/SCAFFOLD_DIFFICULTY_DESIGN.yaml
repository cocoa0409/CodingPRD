# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3058 — comparative rating feeds & dual distribution channel management
# 9 rules x >= 2 instances; every instance grounded in SCAFFOLD.yaml §1.1–§1.7.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: telematics_discount_realization_differs_by_channel_on_policy_domain
        grounds:
          - calculations.telematics_discount_realization
          - entities.TelematicsEnrollment.fields.channel
          - entities.Policy.fields.written_premium_cents
        distinguishing_aspect: |
          Entity domain: Policy/TelematicsEnrollment. For IDENTICAL coverage
          inputs, the DIRECT variant takes a 15% discount at bind (written
          107100) and reconciles at scoring (adjustment -6300 to a 100800
          final), while the AGENT variant takes nothing at bind (written
          161000) and realizes the whole score-based discount retroactively
          (adjustment -32200 to a 128800 final) — the two variants produce
          different written premium AND different adjustment for the same
          score, because the channel base premium itself differs.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. Product P-AUTO ACTIVE (BOTH channels; LIABILITY BASIC 50000 / COLLISION STANDARD 90000; direct_discount 0.10; agent_load 0.15; min_premium 40000; bundle_eligible true)."
            - "Rater PL-RATER with a PUBLISHED feed for P-AUTO covering 2026. Agent A APPOINTED with ACTIVE appointment (TX, AUTO)."
            - "Consumer C with a DIRECT quote [LIABILITY/BASIC, COLLISION/STANDARD], telematics_opt_in true, submitted and bound -> policy PD."
            - "Agent quote for the same consumer with identical coverages, telematics_opt_in true, submitted and bound -> policy PA."
            - "Both enrollments activated to PARTICIPATING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /products"
              payload: { product_code: "P-AUTO", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { LIABILITY: { BASIC: 50000, STANDARD: 70000 }, COLLISION: { STANDARD: 90000, PLUS: 120000 } }, direct_discount_pct: 0.10, agent_load_pct: 0.15, bundle_credit_pct: 0.05, min_premium_cents: 40000, bundle_eligible: true }
              as: RatingManager
              captures: { p_auto: $.data.id }
            - call: "POST /products/${p_auto}/activate"
              payload: {}
              as: RatingManager
            - call: "POST /raters"
              payload: { rater_code: "PL-RATER", display_name: "PL Rater", feed_format_version: "v4.2", accepted_line_of_business: "AUTO" }
              as: RatingManager
              captures: { rater_id: $.data.id, rater_v: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { table: "auto-tx-2026" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_id: $.data.id }
            - call: "POST /rate-feed-publications/${feed_id}/publish"
              payload: {}
              as: RatingManager
            - call: "POST /agents"
              payload: { agency_name: "Hill Country Insurance", principal_name: "A. Reyes", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { agent_a: $.data.id }
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z" }
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/appoint"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /consumers"
              payload: { email: "c1@example.com", full_name: "Casey One", date_of_birth: "1990-05-01", home_state_code: "TX" }
              as: Anonymous
              captures: { cons_id: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }, { coverage_code: "COLLISION", tier: "STANDARD" }], telematics_opt_in: true }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_direct: $.data.id }
            - call: "POST /quotes/${q_direct}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q_direct}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { pol_direct: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }, { coverage_code: "COLLISION", tier: "STANDARD" }], telematics_opt_in: true }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q_agent: $.data.id }
            - call: "POST /quotes/${q_agent}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
            - call: "POST /quotes/${q_agent}/bind"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
              captures: { pol_agent: $.data.id }
            - call: "GET /policies/${pol_direct}/telematics-enrollments"
              payload: {}
              as: System
              captures: { enr_direct: "$.data[0].id" }
            - call: "GET /policies/${pol_agent}/telematics-enrollments"
              payload: {}
              as: System
              captures: { enr_agent: "$.data[0].id" }
            - call: "POST /telematics-enrollments/${enr_direct}/activate-device"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /telematics-enrollments/${enr_agent}/activate-device"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
          trigger:
            - call: "POST /telematics-enrollments/${enr_direct}/score"
              payload: { driving_score: 92 }
              as: System
            - call: "POST /telematics-enrollments/${enr_agent}/score"
              payload: { driving_score: 92 }
              as: System
          assert:
            - "Policy.${pol_direct}.written_premium_cents == 107100 (126000 minus 15% up-front)"
            - "Policy.${pol_agent}.written_premium_cents == 161000 (no up-front discount in AGENT channel)"
            - "TelematicsEnrollment.${enr_direct}.upfront_discount_cents == 18900 and TelematicsEnrollment.${enr_agent}.upfront_discount_cents == 0"
            - "TelematicsEnrollment.${enr_direct}.discount_pct_applied == 0.20 and adjustment_cents == -6300 (final 100800)"
            - "TelematicsEnrollment.${enr_agent}.discount_pct_applied == 0.20 and adjustment_cents == -32200 (final 128800)"
            - "both enrollments have status == SCORED"

      - name: quote_to_bind_leakage_count_vs_premium_weighted_basis_on_quote_domain
        grounds:
          - calculations.leakage_rate_by_channel
          - endpoints.GET_/leakage-reports/quote-to-bind
        distinguishing_aspect: |
          Entity domain: Quote funnel analytics (different domain from the
          Policy/Telematics instance). Over one funnel the COUNT basis yields
          1/3 = 0.3333 while the PREMIUM_WEIGHTED basis yields 45000/297000 =
          0.1515 — two valid algorithm readings of "leakage" producing
          different numbers for identical data.
        test_recipe:
          setup:
            - "Logical clock at 2026-03-01T00:00:00Z. Product P-AUTO ACTIVE (BOTH; LIABILITY BASIC 50000; COLLISION STANDARD 90000; direct_discount 0.10; min_premium 40000; no cap)."
            - "Consumer C2 with three DIRECT quotes quoted inside March: Q1 [LIAB/BASIC + COLL/STANDARD] = 126000 bound; Q2 same = 126000 bound; Q3 [LIAB/BASIC] = 45000 withdrawn."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /products"
              payload: { product_code: "P-AUTO", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { LIABILITY: { BASIC: 50000, STANDARD: 70000 }, COLLISION: { STANDARD: 90000, PLUS: 120000 } }, direct_discount_pct: 0.10, agent_load_pct: 0.15, bundle_credit_pct: 0.05, min_premium_cents: 40000 }
              as: RatingManager
              captures: { p_auto: $.data.id }
            - call: "POST /products/${p_auto}/activate"
              payload: {}
              as: RatingManager
            - call: "POST /consumers"
              payload: { email: "c2@example.com", full_name: "Casey Two", date_of_birth: "1988-02-02", home_state_code: "TX" }
              as: Anonymous
              captures: { cons_id: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }, { coverage_code: "COLLISION", tier: "STANDARD" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q1}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }, { coverage_code: "COLLISION", tier: "STANDARD" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q2}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q3: $.data.id }
            - call: "POST /quotes/${q3}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q3}/withdraw"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
          trigger:
            - call: "GET /leakage-reports/quote-to-bind"
              payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", basis: "COUNT", channel: "DIRECT" }
              as: RatingManager
            - call: "GET /leakage-reports/quote-to-bind"
              payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", basis: "PREMIUM_WEIGHTED", channel: "DIRECT" }
              as: RatingManager
          assert:
            - "COUNT basis response: channels[DIRECT].cohort_count == 3, leaked_count == 1, leakage == 0.3333"
            - "PREMIUM_WEIGHTED basis response: channels[DIRECT].cohort_premium_cents == 297000, leaked_premium_cents == 45000, leakage == 0.1515"
            - "the two bases disagree (0.3333 != 0.1515) over the identical funnel"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: channel_quote_premium_multi_input_branch_and_floor_mode_a
        grounds:
          - calculations.channel_quote_premium
          - entities.CarrierProduct.fields.agent_load_pct
          - entities.CarrierProduct.fields.bundle_credit_pct
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — a conditional
          channel branch (discount vs load), a state-dependent bundle-credit
          subtraction, per-line rounding, and a post-sum floor. Same coverages
          price 126000 (DIRECT), 161000 (AGENT) and 154000 (AGENT with
          bundle intent): the bundle branch subtracts 0.05 from the load
          factor, a conditional nested inside the channel branch.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-01T00:00:00Z. P-AUTO ACTIVE (BOTH; LIABILITY BASIC 50000; COLLISION STANDARD 90000; direct_discount 0.10; agent_load 0.15; bundle_credit 0.05; min_premium 40000)."
            - "Rater with PUBLISHED 2026 feed for P-AUTO. Agent A APPOINTED (TX, AUTO). Consumer C3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /products"
              payload: { product_code: "P-AUTO", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { LIABILITY: { BASIC: 50000 }, COLLISION: { STANDARD: 90000 } }, direct_discount_pct: 0.10, agent_load_pct: 0.15, bundle_credit_pct: 0.05, min_premium_cents: 40000 }
              as: RatingManager
              captures: { p_auto: $.data.id }
            - call: "POST /products/${p_auto}/activate"
              payload: {}
              as: RatingManager
            - call: "POST /raters"
              payload: { rater_code: "PL-RATER", display_name: "PL Rater", feed_format_version: "v4.2", accepted_line_of_business: "AUTO" }
              as: RatingManager
              captures: { rater_id: $.data.id, rater_v: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_auto}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "x" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_id: $.data.id }
            - call: "POST /rate-feed-publications/${feed_id}/publish"
              payload: {}
              as: RatingManager
            - call: "POST /agents"
              payload: { agency_name: "Hill Country Insurance", principal_name: "A. Reyes", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { agent_a: $.data.id }
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z" }
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/appoint"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /consumers"
              payload: { email: "c3@example.com", full_name: "Casey Three", date_of_birth: "1991-01-01", home_state_code: "TX" }
              as: Anonymous
              captures: { cons_id: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }, { coverage_code: "COLLISION", tier: "STANDARD" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_d: $.data.id }
            - call: "POST /quotes/${q_d}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }, { coverage_code: "COLLISION", tier: "STANDARD" }] }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q_a: $.data.id }
            - call: "POST /quotes/${q_a}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }, { coverage_code: "COLLISION", tier: "STANDARD" }], bundled_home_intended: true }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q_ab: $.data.id }
          trigger:
            - call: "POST /quotes/${q_ab}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
          assert:
            - "Quote.${q_d}.quoted_premium_cents == 126000 (45000 + 81000 at factor 0.90)"
            - "Quote.${q_a}.quoted_premium_cents == 161000 (57500 + 103500 at factor 1.15)"
            - "Quote.${q_ab}.quoted_premium_cents == 154000 (55000 + 99000 at factor 1.15 - 0.05 = 1.10)"
            - "all three quotes cover identical coverage selections yet price differently per channel branch and bundle conditional"

      - name: commission_earned_per_policy_rounding_order_mode_b
        grounds:
          - calculations.commission_earned
          - entities.CommissionStatement.fields.line_items
          - entities.Policy.fields.per_policy_commission_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two policies of
          99995 cents at a 10% tier yield 10000 + 10000 = 20000 when rounding
          PER POLICY (pinned), but 19999 when summing raw commissions
          (19999.0) and rounding once. The scaffold pins per-policy-then-sum;
          the rejected order differs by exactly 1 cent.
        test_recipe:
          setup:
            - "Logical clock 2026-01-05T00:00:00Z. P-FLAT ACTIVE (BOTH; FLAT TIER_C 99995; all factors 0; min 0). Rater feed published for P-FLAT covering 2026."
            - "Agent A APPOINTED (TX, AUTO) with ACTIVE schedule [{1000000, 0.10}, {null, 0.12}] effective 2026-01-01."
            - "Two AGENT quotes for consumer C4, each [FLAT/TIER_C], submitted and bound inside January."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /products"
              payload: { product_code: "P-FLAT", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { FLAT: { TIER_A: 800000, TIER_B: 500000, TIER_C: 99995, TIER_D: 730000, TIER_E: 1095000, TIER_F: 1825000 } }, min_premium_cents: 0 }
              as: RatingManager
              captures: { p_flat: $.data.id }
            - call: "POST /products/${p_flat}/activate"
              payload: {}
              as: RatingManager
            - call: "POST /raters"
              payload: { rater_code: "PL-RATER", display_name: "PL Rater", feed_format_version: "v4.2", accepted_line_of_business: "AUTO" }
              as: RatingManager
              captures: { rater_id: $.data.id, rater_v: $.data.version }
            - call: "POST /raters/${rater_id}/rate-feed-publications"
              payload: { product_id: "${p_flat}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2027-01-01T00:00:00Z", rate_table_payload: { t: "f" }, expected_rater_version: "${rater_v}" }
              as: RatingManager
              captures: { feed_id: $.data.id }
            - call: "POST /rate-feed-publications/${feed_id}/publish"
              payload: {}
              as: RatingManager
            - call: "POST /agents"
              payload: { agency_name: "Hill Country Insurance", principal_name: "A. Reyes", resident_state_code: "TX" }
              as: CarrierAdmin
              captures: { agent_a: $.data.id, agent_v: $.data.version }
            - call: "POST /agents/${agent_a}/appointments"
              payload: { state_code: "TX", line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z" }
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/appoint"
              payload: {}
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/commission-schedules"
              payload: { line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z", tiers: [{ up_to_cents: 1000000, rate_pct: 0.10 }, { up_to_cents: null, rate_pct: 0.12 }], contingent_bonus_eligible: false, expected_agent_version: "${agent_v} + 1" }
              as: CarrierAdmin
            - call: "POST /consumers"
              payload: { email: "c4@example.com", full_name: "Casey Four", date_of_birth: "1992-03-03", home_state_code: "TX" }
              as: Anonymous
              captures: { cons_id: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_flat}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "FLAT", tier: "TIER_C" }] }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
            - call: "POST /quotes/${q1}/bind"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
              captures: { pol1: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_flat}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "FLAT", tier: "TIER_C" }] }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q2: $.data.id }
            - call: "POST /quotes/${q2}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
            - call: "POST /quotes/${q2}/bind"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
              captures: { pol2: $.data.id }
          trigger:
            - call: "POST /agents/${agent_a}/commission-statements"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: CarrierAdmin
              captures: { stmt_id: $.data.id }
          assert:
            - "CommissionStatement.${stmt_id}.written_premium_cents == 199990"
            - "CommissionStatement.${stmt_id}.commission_cents == 20000 (round_half_up(9999.5) per policy, twice)"
            - "CommissionStatement.${stmt_id}.commission_cents != 19999 (the rejected sum-then-round order)"
            - "Policy.${pol1}.per_policy_commission_cents == 10000 and Policy.${pol2}.per_policy_commission_cents == 10000"

      - name: contingent_bonus_evaluation_order_and_remainder_mode_c
        grounds:
          - calculations.contingent_bonus_settlement
          - entities.ContingentBonusPool.fields.undistributed_cents
          - entities.BonusPayout.fields.payout_cents
        distinguishing_aspect: |
          Mode (c): circular-looking dependency pinned by explicit evaluation
          order — the loss-ratio gate is computed EXCLUDING bonus accrual,
          then growth, then pro-rata allocation, then the floor-remainder is
          RETAINED (never redistributed). Pool 999999 over eligible earned
          200000/300000 yields payouts 399999 and 599999 with exactly 1 cent
          undistributed; an ineligible third agent (earned 500000) neither
          dilutes nor receives.
        test_recipe:
          setup:
            - "P-FLAT ACTIVE (BOTH; TIER_D 730000, TIER_E 1095000, TIER_F 1825000; factors 0; min 0). Rater feed published for P-FLAT covering 2026."
            - "Agents E1, E2, E3 each APPOINTED (TX, AUTO) with contingent-eligible ACTIVE schedules effective 2026-01-01."
            - "At clock 2026-01-01T00:00:00Z each agent binds one AGENT quote: E1 [FLAT/TIER_D] (730000), E2 [FLAT/TIER_E] (1095000), E3 [FLAT/TIER_F] (1825000)."
            - "Clock advanced to 2026-04-11T00:00:00Z (exactly 100 days in force -> earned 200000, 300000, 500000)."
            - "Claims: E1 100000 (ratio 0.5000), E2 120000 (0.4000), E3 350000 (0.7000 -> fails the strict < 0.70 gate)."
            - "First-year agents: prior-12m earned is 0 so growth is defined as 1.0 and passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: CarrierAdmin
            - call: "POST /products"
              payload: { product_code: "P-FLAT", line_of_business: "AUTO", state_code: "TX", channel_availability: "BOTH", coverage_rates: { FLAT: { TIER_A: 800000, TIER_B: 500000, TIER_C: 99995, TIER_D: 730000, TIER_E: 1095000, TIER_F: 1825000 } }, min_premium_cents: 0 }
