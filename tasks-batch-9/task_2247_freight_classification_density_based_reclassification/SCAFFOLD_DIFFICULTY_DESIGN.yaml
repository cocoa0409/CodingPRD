              captures: { cm2: "$.data[0].id"}
          assert:
            - "Customer.${cust1}.liability_index_rolling == 0.50"
            - "Customer.${cust1}.liability_index_lifetime == 1.50"
            - "Customer.${cust1}.offender_tier == TIER_0"
            - "Customer.${cust1}.dispute_window_days == 30"
            - "Customer.${cust1}.offender_strike_count == 2"
            - "CorrectionNotice.${n1}.status == UPHELD"
            - "CorrectionNotice.${n2}.status == PARTIALLY_OVERTURNED"
            - "CorrectionNotice.${n2}.applied_delta_cents == 28314"
            - "CreditMemo.${cm2}.freight_credit_cents == 12245"
            - "CreditMemo.${cm2}.fee_credit_cents == 0"
            - "CreditMemo.${cm2}.interest_credit_cents == 61"
            - "CreditMemo.${cm2}.amount_cents == 12306"
            - "Shipment.${sh1}.assessed_total_cents == 65883"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: cube_rounding_order_flips_density_bracket_and_fires_notice
        grounds:
          - calculations.line_cube_and_density
          - calculations.line_class_resolution
          - calculations.correction_notice_delta
          - entities.ShipmentLine.fields.measured_cubic_ft
        distinguishing_aspect: |
          Rounding mode: per-piece volume must be rounded to 3 decimals BEFORE multiplying by
          22 pieces (101.86 cft -> 29.99 pcf -> class 65, notice delta 3670), whereas rounding the
          whole-line volume once gives 101.85 cft -> 30.00 pcf -> class 60, which equals the declared
          class and raises no notice at all.
        test_recipe:
          setup:
            - "Logical clock at 2026-01-10T08:00:00Z; terminal TRM1; customer BOLT with an ACTIVE CLASS_BASED program (4200 c/cwt, 35%, 12500 minimum)."
            - "Shipment PRO3001 with one line: 3055 lb declared class 60, 22 pieces of 20.0x20.0x20.0 inches; billed at 44036."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T08:00:00Z" }
              as: PricingAnalyst
            - call: "POST /ltl/terminals"
              payload: { code: "TRM1", name: "Chicago Dock" }
              as: PricingAnalyst
              captures: { trm1: "$.data.id"}
            - call: "POST /ltl/customers"
              payload: { account_code: "BOLT", name: "Bolt Supply" }
              as: PricingAnalyst
              captures: { cust1: "$.data.id", cust1_v: "$.data.version"}
            - call: "POST /ltl/tariff-versions"
              payload: { code: "NMFC-2026A", effective_at: "2026-01-01T00:00:00Z", density_breaks: [{min_density_pcf: 30, class_code: 60}, {min_density_pcf: 22.5, class_code: 65}, {min_density_pcf: 15, class_code: 70}, {min_density_pcf: 13.5, class_code: 85}, {min_density_pcf: 12, class_code: 92.5}, {min_density_pcf: 10.5, class_code: 100}, {min_density_pcf: 9, class_code: 110}, {min_density_pcf: 8, class_code: 125}, {min_density_pcf: 6, class_code: 150}, {min_density_pcf: 4, class_code: 175}, {min_density_pcf: 2, class_code: 250}, {min_density_pcf: 1, class_code: 300}, {min_density_pcf: 0, class_code: 400}] }
              as: PricingAnalyst
              captures: { tv1: "$.data.id"}
            - call: "POST /ltl/commodity-profiles"
              payload: { tariff_version_id: "${tv1}", nmfc_item: "049880", description: "Fasteners in cartons", classification_basis: "DENSITY_BASED" }
              as: PricingAnalyst
              captures: { cp1: "$.data.id"}
            - call: "POST /ltl/tariff-versions/${tv1}/publish"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs"
              payload: { customer_id: "${cust1}", program_type: "CLASS_BASED", base_rate_per_cwt_cents: 4200, discount_pct: 0.35, min_charge_cents: 12500 }
              as: PricingAnalyst
              captures: { rp1: "$.data.id"}
            - call: "POST /ltl/rate-programs/${rp1}/approve"
              payload: {}
              as: PricingAnalyst
            - call: "POST /ltl/rate-programs/${rp1}/activate"
              payload: { expected_customer_version: "${cust1_v}" }
              as: PricingAnalyst
            - call: "POST /ltl/shipments"
              payload: { customer_id: "${cust1}", origin_terminal_id: "${trm1}", pro_number: "PRO3001", pickup_at: "2026-01-10T08:00:00Z", bol_declared_total_weight_lb: 3055 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { sh1: "$.data.id"}
            - call: "POST /ltl/shipments/${sh1}/lines"
              payload: { line_no: 1, commodity_profile_id: "${cp1}", declared_class_code: 60, declared_weight_lb: 3055, pieces: 22, declared_length_in: 20.0, declared_width_in: 20.0, declared_height_in: 20.0 }
              as: Shipper
              as_user_id: "${cust1}"
              captures: { ln1: "$.data.id"}
            - call: "POST /ltl/shipments/${sh1}/bill"
              payload: {}
              as: PricingAnalyst
          trigger:
            - call: "POST /ltl/capture-events"
              payload: { shipment_id: "${sh1}", device_type: "DIMENSIONER", measured_total_weight_lb: 3055, line_measurements: [{line_no: 1, measured_weight_lb: 3055, measured_length_in: 20.0, measured_width_in: 20.0, measured_height_in: 20.0}] }
              as: TerminalOperator
              as_user_id: "${trm1}"
              captures: { ce1: "$.data.id"}
            - call: "GET /ltl/correction-notices"
              payload: { shipment_id: "${sh1}" }
              as: ClassificationAuditor
              as_user_id: "aud-1"
              captures: { n1: "$.data[0].id"}
            - call: "POST /ltl/correction-notices/${n1}/issue"
              payload: {}
              as: ClassificationAuditor
              as_user_id: "aud-1"
          assert:
            - "ShipmentLine.${ln1}.measured_cubic_ft == 101.86"
            - "ShipmentLine.${ln1}.measured_density_pcf == 29.99"
            - "ShipmentLine.${ln1}.found_class_code == 65"
            - "ShipmentLine.${ln1}.effective_class_code == 65"
            - "Shipment.${sh1}.original_charge_cents == 44036"
            - "CaptureEvent.${ce1}.variance_pct == 0.00"
            - "CaptureEvent.${ce1}.triggered_reweigh == false"
            - "CaptureEvent.${ce1}.triggered_reclass == true"
            - "CorrectionNotice.${n1}.notice_type == RECLASS"
            - "CorrectionNotice.${n1}.final_delta_cents == 3670"
            - "CorrectionNotice.${n1}.applied_delta_cents == 3670"
            - "CorrectionNotice.${n1}.inspection_fee_cents == 4500"
            - "Shipment.${sh1}.assessed_total_cents == 52206"

      - name: migration_model_two_pass_volume_tier_from_undiscounted_gross
        grounds:
          - calculations.migration_impact_model
          - calculations.shipment_charge
          - entities.RateProgram.fields.modeled_annual_revenue_cents
          - entities.RateProgram.fields.migration_recommendation
          - state_machines.RateProgram.MODELING_to_APPROVED
        distinguishing_aspect: |
          Two-pass mode: the volume tier must be selected from the pass-1 UNDISCOUNTED gross
          (504504 -> tier 0.04 -> modeled 314810, delta 0.0920, MIGRATE_DENSITY_BASED), whereas
          selecting the tier from the discounted pass-2 revenue (327928) lands in the 0.00 tier and
          yields 327928 with delta 0.1376.
        test_recipe:
          setup:
            - "Logical clock at 2026-02-01T00:00:00Z; published standard NMFC-2026A effective 2026-01-01."
