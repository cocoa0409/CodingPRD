# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2672 - Domestic Violence Shelter & Safety Planning
# Nine rule_ids from SKILL.md §0.5, two instances each (18 total).
# Every grounds ref resolves into SCAFFOLD.yaml §1.1-§1.6; every numeric assert literal was
# computed by executing the cited calculations[].formula against its constants.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: risk_scoring_variant_divergence_on_risk_assessment
        grounds:
          - calculations.lethality_danger_score
          - entities.RiskAssessment.fields.variant_applied
          - entities.RiskAssessment.fields.corroborating_fact_count
          - entities.RiskAssessment.fields.base_subtotal
          - entities.Client.fields.current_risk_band
          - state_machines.HotlineCall.RECEIVED_to_RISK_ASSESSED
          - endpoints[POST /hotline-calls/{id}/risk-assessments]
        distinguishing_aspect: |
          This dual-variant calculation is risk scoring on the Client/RiskAssessment domain: with byte-identical
          factor inputs, INTAKE_SNAPSHOT scores 48.4 (MODERATE) and CORROBORATED_REVIEW scores 55.0 (ELEVATED),
          a 6.6-point divergence produced only by the corroboration bonus - a different entity domain from the
          money-valued shelter_stay_cost variant pair on ShelterAdmission.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one LegalAdvocate (Iris Vale) exist, both with wellness_posture OPEN."
            - "Client C-1001 (Alina Ford) exists and has exactly one corroborating fact: a ProtectiveOrderCase in status FILED."
            - "The client has no ShelterAdmission rows and no disposed HotlineCall rows, so facts 2 and 3 of the corroboration set are absent."
            - "The client's first HotlineCall is already RISK_ASSESSED by an INTAKE_SNAPSHOT read; a second HotlineCall sits in RECEIVED."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Iris Vale", role_type: "LEGAL_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { legal_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-1001", legal_name: "Alina Ford", household_size: 1, minor_children_count: 0, accessibility_required: false, location_confidential: true, hmis_disclosure_consent: "GRANTED" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /protective-order-cases"
              payload: { client_id: "${client_id}", order_type: "EMERGENCY_EX_PARTE" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
              captures: { poc_id: "$.data.id" }
            - call: "POST /protective-order-cases/${poc_id}/file"
              payload: { filed_court: "County Family Court", hearing_start_utc: "2026-08-20T09:00:00Z", hearing_end_utc: "2026-08-20T10:00:00Z", accompanying_advocate_id: "${legal_id}" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Partner has a handgun and blocked the door after she said she was leaving." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_a: "$.data.id" }
            - call: "POST /hotline-calls/${call_a}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2, corroborate_with_history: false }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { ra_a: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Supervisory call-back to re-read the same factors against her file." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_b: "$.data.id" }
          trigger:
            - call: "POST /hotline-calls/${call_b}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2, corroborate_with_history: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { ra_b: "$.data.id" }
          assert:
            - "RiskAssessment.${ra_a}.variant_applied == INTAKE_SNAPSHOT"
            - "RiskAssessment.${ra_a}.corroborating_fact_count == 0"
            - "RiskAssessment.${ra_a}.base_subtotal == 44.0"
            - "RiskAssessment.${ra_a}.escalation_multiplier == 1.1"
            - "RiskAssessment.${ra_a}.danger_score == 48.4"
            - "RiskAssessment.${ra_a}.risk_band == MODERATE"
            - "RiskAssessment.${ra_b}.variant_applied == CORROBORATED_REVIEW"
            - "RiskAssessment.${ra_b}.corroborating_fact_count == 1"
            - "RiskAssessment.${ra_b}.base_subtotal == 50.0"
            - "RiskAssessment.${ra_b}.escalation_multiplier == 1.1 (identical to ${ra_a}: the divergence comes from the bonus, not the multiplier)"
            - "RiskAssessment.${ra_b}.danger_score == 55.0"
            - "RiskAssessment.${ra_b}.risk_band == ELEVATED"
            - "RiskAssessment.${ra_b}.danger_score - RiskAssessment.${ra_a}.danger_score == 6.6"
            - "Client.${client_id}.current_danger_score == 55.0"
            - "Client.${client_id}.current_risk_band == ELEVATED"

      - name: stay_cost_projected_vs_settled_on_shelter_admission
        grounds:
          - calculations.shelter_stay_cost
          - entities.ShelterAdmission.fields.projected_stay_cost_cents
          - entities.ShelterAdmission.fields.settled_stay_cost_cents
          - entities.Shelter.fields.settled_revenue_cents
          - state_machines.ShelterAdmission.occupancy_status.CHECKED_IN_to_EXITED
          - endpoints[POST /shelter-admissions/{id}/exit]
        distinguishing_aspect: |
          This dual-variant calculation is money accounting on the ShelterAdmission domain: over the same five
          nights the PROJECTED variant estimates weekend nights as round_half_up(5 * 2 / 7) == 1 surcharge night
          for 57000 cents while the SETTLED chronological walk finds two real surcharge nights (Fri 2026-08-07,
          Sat 2026-08-08) for 59500 cents - a different entity domain and a different metric from the
          risk-band divergence on RiskAssessment.
        test_recipe:
          setup:
            - "Shelter Cedar House exists with nightly_rate_cents 8500, weekend_surcharge_cents 2500, child_supplement_cents 1200 and one FAMILY_SUITE unit A1 of bed_capacity 4."
            - "Client C-2001 (Alina Ford) has household_size 3 and minor_children_count 2, an APPROVED screening request, and a RESERVED admission for the planned window 2026-08-07 to 2026-08-12."
            - "The admission has been checked in with the clock at 2026-08-07T09:00:00Z, so occupancy_status is CHECKED_IN and projected_stay_cost_cents is already frozen."
            - "The clock has since advanced to 2026-08-12T09:00:00Z; Shelter.settled_revenue_cents is still 0."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Dana Whit", role_type: "SHELTER_MANAGER", max_caseload: 20 }
              as: AgencyAdmin
              captures: { mgr_id: "$.data.id" }
            - call: "POST /shelters"
              payload: { name: "Cedar House", confidential_location: true, nightly_rate_cents: 8500, weekend_surcharge_cents: 2500, child_supplement_cents: 1200 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { shelter_id: "$.data.id" }
            - call: "POST /shelters/${shelter_id}/units"
              payload: { unit_label: "A1", unit_type: "FAMILY_SUITE", bed_capacity: 4 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-2001", legal_name: "Alina Ford", household_size: 3, minor_children_count: 2, accessibility_required: false, location_confidential: true, hmis_disclosure_consent: "DENIED" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Needs a bed tonight for herself and two children." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2, corroborate_with_history: false }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "POST /screening-requests"
              payload: { client_id: "${client_id}", hotline_call_id: "${call_id}", requested_shelter_id: "${shelter_id}", requested_entry_date: "2026-08-07" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { sr_id: "$.data.id" }
            - call: "POST /screening-requests/${sr_id}/decide"
              payload: { decision: "APPROVE", assigned_advocate_id: "${adv_id}" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
            - call: "GET /shelter-units/${unit_id}"
              payload: {}
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_v: "$.data.version" }
            - call: "POST /shelter-admissions"
              payload: { screening_request_id: "${sr_id}", shelter_unit_id: "${unit_id}", entry_date: "2026-08-07", planned_exit_date: "2026-08-12", expected_shelter_unit_version: "${unit_v}" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { adm_id: "$.data.id", projected: "$.data.projected_stay_cost_cents" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T09:00:00Z" }
              as: AgencyAdmin
            - call: "POST /shelter-admissions/${adm_id}/check-in"
              payload: { school_enrollment_confirmed: true }
              as: ShelterManager
              as_user_id: "${mgr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T09:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /shelter-admissions/${adm_id}/exit"
              payload: { actual_exit_date: "2026-08-12", exit_destination: "FAMILY_FRIENDS" }
              as: ShelterManager
              as_user_id: "${mgr_id}"
          assert:
            - "ShelterAdmission.${adm_id}.projected_stay_cost_cents == 57000"
            - "ShelterAdmission.${adm_id}.settled_stay_cost_cents == 59500"
            - "ShelterAdmission.${adm_id}.settled_stay_cost_cents - ShelterAdmission.${adm_id}.projected_stay_cost_cents == 2500"
            - "ShelterAdmission.${adm_id}.projected_stay_cost_cents is unchanged by the exit and still equals ${projected}"
            - "Shelter.${shelter_id}.settled_revenue_cents == 59500"
            - "ShelterAdmission.${adm_id}.occupancy_status == EXITED"
            - "ShelterAdmission.${adm_id}.school_enrollment_status == ENROLLED"

  - rule_id: combinatorial_formula
    instances:
      - name: coverage_score_rounds_per_component_then_sums
        grounds:
          - calculations.safety_plan_coverage_score
          - entities.PlanComponent.fields.subscore
          - entities.PlanComponent.fields.weight_effective
          - entities.SafetyPlan.fields.coverage_score
          - endpoints[POST /safety-plans/{id}/components]
        distinguishing_aspect: |
          Mode (b) - nested rounding where the order is load-bearing: two DRAFT components (COMMUNICATION and
          TECHNOLOGY, weight 25 each, factor 0.350) each round to subscore 0.88, so the pinned round-then-sum
          order yields coverage_score 1.76, while the forbidden sum-then-round order would yield 1.75.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) exists with wellness_posture OPEN."
            - "Client C-3001 (Nadia Roe) is ACTIVE with current_risk_band MODERATE (danger_score 48.4), so IMMINENT_UPLIFT never applies and base weights stand."
            - "The advocate authored SafetyPlan P in status DRAFT (it superseded the plan auto-created by the SAFETY_PLAN_ONLY disposition)."
            - "Plan P already carries one DRAFT COMMUNICATION component; no component has been implemented."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-3001", legal_name: "Nadia Roe", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true, hmis_disclosure_consent: "DENIED" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Wants a plan for phones and messages before she leaves." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2, corroborate_with_history: false }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { ra_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/dispose"
              payload: { disposition: "SAFETY_PLAN_ONLY" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "GET /clients/${client_id}"
              payload: {}
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_v: "$.data.version" }
            - call: "POST /safety-plans"
              payload: { client_id: "${client_id}", based_on_risk_assessment_id: "${ra_id}", expected_client_version: "${client_v}" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { plan_id: "$.data.id" }
            - call: "POST /safety-plans/${plan_id}/components"
              payload: { component_type: "COMMUNICATION", detail: "Code word with her sister; second prepaid phone kept at work.", target_completion_date: "2026-08-15" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { comp_comm: "$.data.id" }
          trigger:
            - call: "POST /safety-plans/${plan_id}/components"
              payload: { component_type: "TECHNOLOGY", detail: "Factory-reset the tablet, remove shared cloud account, disable location sharing.", target_completion_date: "2026-08-16" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { comp_tech: "$.data.id" }
          assert:
            - "PlanComponent.${comp_comm}.weight_effective == 25"
            - "PlanComponent.${comp_comm}.subscore == 0.88"
            - "PlanComponent.${comp_tech}.weight_effective == 25"
            - "PlanComponent.${comp_tech}.subscore == 0.88"
            - "SafetyPlan.${plan_id}.coverage_score == 1.76"
            - "SafetyPlan.${plan_id}.coverage_score != 1.75 (sum-then-round is the wrong order)"
            - "SafetyPlan.${plan_id}.status == DRAFT"

      - name: landlord_incentive_tier_pinned_to_pre_commit_score
        grounds:
          - calculations.landlord_engagement_incentive
          - entities.HousingReferral.fields.incentive_fee_cents
          - entities.HousingReferral.fields.incentive_tier_applied
          - entities.LandlordPartner.fields.engagement_score
          - entities.LandlordPartner.fields.incentive_tier
          - entities.LandlordPartner.fields.incentive_accrued_cents
          - state_machines.HousingReferral.SUBMITTED_to_MATCHED
          - endpoints[POST /housing-referrals/{id}/match]
        distinguishing_aspect: |
          Mode (c) - circular-looking dependency with a pinned evaluation order: the fee depends on the tier, the
          tier depends on engagement_score, and engagement_score depends on units_committed, which this very match
          increments. Reading the tier BEFORE the commit locks 44000 + 15000 == 59000 at SILVER, whereas the
          post-commit read (GOLD, score 50.0) would lock 50000 + 15000 == 65000.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one HousingSpecialist (Omar Diaz) exist."
            - "Client C-4001 (Nadia Roe) is ACTIVE and has exactly one ACTIVE SafetyPlan carrying one RELOCATION component."
            - "LandlordPartner Vista Rentals has units_pledged 4, base_incentive_cents 40000, accepts_subsidy_type RAPID_REHOUSING_SUBSIDY, units_committed 1 (one TRANSITIONAL_HOUSING referral already MATCHED at BASE for 40000), units_available 3, engagement_score 25.0, incentive_tier SILVER, incentive_accrued_cents 40000."
            - "A second referral for the same client is SUBMITTED with program_type RAPID_REHOUSING."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Omar Diaz", role_type: "HOUSING_SPECIALIST", max_caseload: 15 }
              as: AgencyAdmin
              captures: { hs_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-4001", legal_name: "Nadia Roe", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true, hmis_disclosure_consent: "DENIED" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Needs help finding a rental she can hold on her own." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2, corroborate_with_history: false }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { ra_id: "$.data.id" }
            - call: "POST /hotline-calls/${call_id}/dispose"
              payload: { disposition: "SAFETY_PLAN_ONLY" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "GET /clients/${client_id}"
              payload: {}
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_v: "$.data.version" }
            - call: "POST /safety-plans"
              payload: { client_id: "${client_id}", based_on_risk_assessment_id: "${ra_id}", expected_client_version: "${client_v}" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { plan_id: "$.data.id" }
            - call: "POST /safety-plans/${plan_id}/components"
              payload: { component_type: "RELOCATION", detail: "Move to a unit outside the county with no forwarding address on file.", target_completion_date: "2026-08-20" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "POST /safety-plans/${plan_id}/activate"
              payload: {}
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
            - call: "POST /landlord-partners"
              payload: { name: "Vista Rentals", units_pledged: 4, accepts_subsidy_type: "RAPID_REHOUSING_SUBSIDY", base_incentive_cents: 40000 }
              as: HousingSpecialist
              as_user_id: "${hs_id}"
              captures: { lp_id: "$.data.id" }
            - call: "POST /housing-referrals"
              payload: { client_id: "${client_id}", landlord_partner_id: "${lp_id}", program_type: "TRANSITIONAL_HOUSING", subsidy_type: "RAPID_REHOUSING_SUBSIDY" }
              as: HousingSpecialist
              as_user_id: "${hs_id}"
              captures: { ref1: "$.data.id" }
            - call: "GET /landlord-partners/${lp_id}"
              payload: {}
              as: HousingSpecialist
              as_user_id: "${hs_id}"
              captures: { lp_v1: "$.data.version" }
            - call: "POST /housing-referrals/${ref1}/match"
              payload: { monthly_rent_cents: 145000, expected_landlord_partner_version: "${lp_v1}" }
              as: HousingSpecialist
              as_user_id: "${hs_id}"
            - call: "POST /housing-referrals"
              payload: { client_id: "${client_id}", landlord_partner_id: "${lp_id}", program_type: "RAPID_REHOUSING", subsidy_type: "RAPID_REHOUSING_SUBSIDY" }
              as: HousingSpecialist
              as_user_id: "${hs_id}"
              captures: { ref2: "$.data.id" }
            - call: "GET /landlord-partners/${lp_id}"
              payload: {}
              as: HousingSpecialist
              as_user_id: "${hs_id}"
              captures: { lp_v2: "$.data.version" }
          trigger:
            - call: "POST /housing-referrals/${ref2}/match"
              payload: { monthly_rent_cents: 152000, expected_landlord_partner_version: "${lp_v2}" }
              as: HousingSpecialist
              as_user_id: "${hs_id}"
          assert:
            - "HousingReferral.${ref1}.incentive_fee_cents == 40000"
            - "HousingReferral.${ref1}.incentive_tier_applied == BASE"
            - "HousingReferral.${ref2}.incentive_tier_applied == SILVER"
            - "HousingReferral.${ref2}.incentive_fee_cents == 59000"
            - "HousingReferral.${ref2}.incentive_fee_cents != 65000 (reading the tier after the commit is the wrong order)"
            - "HousingReferral.${ref2}.status == MATCHED"
            - "LandlordPartner.${lp_id}.units_committed == 2"
            - "LandlordPartner.${lp_id}.units_available == 2"
            - "LandlordPartner.${lp_id}.engagement_score == 50.0"
            - "LandlordPartner.${lp_id}.incentive_tier == GOLD"
            - "LandlordPartner.${lp_id}.incentive_accrued_cents == 99000"

  - rule_id: non_linear_state_machine
    instances:
      - name: admission_occupancy_and_security_dimensions_advance_independently
        grounds:
          - state_machines.ShelterAdmission.location_security_status.SECURE_to_COMPROMISED
          - state_machines.ShelterAdmission.occupancy_status.CHECKED_IN_to_EXITED
          - entities.ShelterAdmission.fields.occupancy_status
          - entities.ShelterAdmission.fields.location_security_status
          - calculations.unit_bed_ledger
          - calculations.client_confidentiality_posture
          - endpoints[POST /shelter-admissions/{id}/report-location-compromise]
        distinguishing_aspect: |
          ShelterAdmission carries two parallel state dimensions on one row: reporting a location compromise moves
          location_security_status SECURE -> COMPROMISED while leaving occupancy_status at CHECKED_IN and both bed
          counters untouched, and the later exit then moves occupancy_status CHECKED_IN -> EXITED while
          location_security_status stays COMPROMISED - neither dimension is a state of the other.
        test_recipe:
          setup:
            - "Shelter Cedar House has one FAMILY_SUITE unit A1 of bed_capacity 4 (nightly_rate_cents 8500, weekend_surcharge_cents 2500, child_supplement_cents 1200)."
            - "Client C-5001 (Alina Ford), household_size 3 and minor_children_count 2, is CHECKED_IN to unit A1 for 2026-08-07 to 2026-08-12."
            - "Unit A1 reads reserved_beds 0, occupied_beds 3, available_beds 1, status OCCUPIED; the client's confidentiality_posture is NORMAL."
