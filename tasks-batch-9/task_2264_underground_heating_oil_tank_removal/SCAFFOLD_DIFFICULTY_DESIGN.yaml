# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2264 — Underground Heating-Oil Tank Removal & Soil Remediation
# 23 instances across the nine §0.5 rule_ids. Every numeric literal in every
# `assert:` was produced by executing the §1.3 formula with its own constants.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: remediation_volume_provisional_grid_versus_final_surveyed
        grounds:
          - calculations.remediation_soil_volume
          - entities.TankProject.fields.remediation_volume_cubic_yards
          - entities.TankProject.fields.remediation_volume_basis
          - state_machines.TankProject.ASSESSED_to_REMEDIATION_ACTIVE
          - state_machines.DecommissionWorkOrder.INVOICED_to_RECONCILED
        distinguishing_aspect: |
          Soil-geometry domain on TankProject: the same project data yields 29.63 cy under
          PROVISIONAL_GRID (impacted grid cells x deepest impacted sample) and 9.19 cy under
          FINAL_SURVEYED (weigh-ticket tonnage / 1.35), a 20.44 cy divergence, because the two
          variants measure impacted footprint versus removed mass.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T13:00:00Z."
            - "One NJ Property, one TankProject whose sweep survey scored 36.00 (recommended_method REMOVAL)."
            - "Municipal permit ISSUED and fire-marshal notification ISSUED with notice_effective_at 2026-08-05T08:00:00Z."
            - "One DecommissionWorkOrder at field_status FIELD_COMPLETE / billing_status BILLABLE, reporting actual_excavated_cubic_yards 9.5 and hauled_tons 12.4."
            - "One SoilSample of round 1, sample_point TANK_BOTTOM, depth_inches 96, RESULTED at tph_mg_kg 6200.0 / benzene_mg_kg 1.2, so the project is REMEDIATION_ACTIVE with contamination_class GROSS."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "12 Birch Lane", state_code: "NJ", county_code: "MRS", homeowner_name: "Dana Reyes", homeowner_email: "dana@example.com", insurance_carrier_code: "CARR-NJ-1" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}", baseline_scope_cubic_yards: 8.0, excavation_limit_cubic_yards: 40.0 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /disclosures"
              payload: { tank_project_id: "${proj_id}", disclosure_kind: "SWEEP_FINDINGS" }
              as: ProjectCoordinator
              captures: { disc_id: $.data.id }
            - call: "POST /disclosures/${disc_id}/respond"
              payload: { response: "ACKNOWLEDGED", response_channel: "PORTAL" }
              as: Homeowner
              as_user_id: "${prop_id}"
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "MUNICIPAL_DECOMMISSION" }
              as: ProjectCoordinator
              captures: { mun_permit_id: $.data.id }
            - call: "POST /permits/${mun_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "FIRE_MARSHAL_NOTIFICATION" }
              as: ProjectCoordinator
              captures: { fm_permit_id: $.data.id }
            - call: "POST /permits/${fm_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /crews"
              payload: { crew_name: "Crew Alpha", cert_level: "TANK_TECH_II", mobilization_buffer_minutes: 90 }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z" }
              as: ProjectCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T13:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "MOBILIZE" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "START" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "COMPLETE", actual_excavated_cubic_yards: 9.5, hauled_tons: 12.4 }
              as: FieldTechnician
            - call: "POST /laboratories"
              payload: { lab_name: "Garden State Analytical", accredited: true, committed_turnaround_hours: 72, holding_time_hours: 336, max_concurrent_analyses: 2 }
              as: ComplianceOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /soil-samples"
              payload: { tank_project_id: "${proj_id}", work_order_id: "${wo_id}", laboratory_id: "${lab_id}", sample_point: "TANK_BOTTOM", depth_inches: 96 }
              as: FieldTechnician
              captures: { s1_id: $.data.id }
            - call: "POST /soil-samples/${s1_id}/chain-of-custody"
              payload: { event: "DISPATCH" }
              as: FieldTechnician
            - call: "POST /soil-samples/${s1_id}/chain-of-custody"
              payload: { event: "RECEIVE" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
            - call: "POST /soil-samples/${s1_id}/result"
              payload: { tph_mg_kg: 6200.0, benzene_mg_kg: 1.2 }
              as: LabAnalyst
              as_user_id: "${lab_id}"
          trigger:
            - call: "GET /tank-projects/${proj_id}"
              as: ProjectCoordinator
              captures: { vol_provisional: $.data.remediation_volume_cubic_yards, basis_provisional: $.data.remediation_volume_basis }
            - call: "POST /work-orders/${wo_id}/billing-events"
              payload: { event: "INVOICE" }
              as: ProjectCoordinator
            - call: "POST /work-orders/${wo_id}/billing-events"
              payload: { event: "RECONCILE" }
              as: ProjectCoordinator
          assert:
            - "${vol_provisional} == 29.63"
            - "${basis_provisional} == PROVISIONAL_GRID"
            - "TankProject.${proj_id}.remediation_volume_cubic_yards == 9.19"
            - "TankProject.${proj_id}.remediation_volume_basis == FINAL_SURVEYED"
            - "${vol_provisional} - TankProject.${proj_id}.remediation_volume_cubic_yards == 20.44"
            - "DecommissionWorkOrder.${wo_id}.billing_status == RECONCILED"
            - "DecommissionWorkOrder.${wo_id}.field_status == FIELD_COMPLETE"

      - name: trust_fund_preliminary_estimate_versus_final_settlement_eligibility
        grounds:
          - calculations.trust_fund_eligible_amount
          - entities.TrustFundClaim.fields.eligible_amount_cents
          - entities.TrustFundClaim.fields.variant
          - state_machines.TrustFundClaim.SUBMITTED_to_WITHDRAWN
          - concurrency_rules[final-claim-create-stale-project]
        distinguishing_aspect: |
          Fiscal-eligibility domain on TrustFundClaim, a different entity and metric from the soil-volume
          variant pair: on identical claimed_costs_cents 13000000 in NJ, PRELIMINARY_ESTIMATE caps first and
          then subtracts the deductible for 12012500, while FINAL_SETTLEMENT subtracts the deductible first
          and then caps for 12062500 — a delta of exactly one 50000 NJ deductible.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T13:00:00Z."
            - "NJ Property, TankProject in status CLEARED after a CLEAN round-1 result (tph 120.0 / benzene 0.05)."
            - "No trust-fund claim exists on the project yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "18 Cedar Court", state_code: "NJ", county_code: "MRS", homeowner_name: "Ivo Marsh", homeowner_email: "ivo@example.com", insurance_carrier_code: "CARR-NJ-2" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}", baseline_scope_cubic_yards: 8.0, excavation_limit_cubic_yards: 40.0 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /disclosures"
              payload: { tank_project_id: "${proj_id}", disclosure_kind: "SWEEP_FINDINGS" }
              as: ProjectCoordinator
              captures: { disc_id: $.data.id }
            - call: "POST /disclosures/${disc_id}/respond"
              payload: { response: "ACKNOWLEDGED", response_channel: "PORTAL" }
              as: Homeowner
              as_user_id: "${prop_id}"
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "MUNICIPAL_DECOMMISSION" }
              as: ProjectCoordinator
              captures: { mun_permit_id: $.data.id }
            - call: "POST /permits/${mun_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "FIRE_MARSHAL_NOTIFICATION" }
              as: ProjectCoordinator
              captures: { fm_permit_id: $.data.id }
            - call: "POST /permits/${fm_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /crews"
              payload: { crew_name: "Crew Bravo", cert_level: "TANK_TECH_II", mobilization_buffer_minutes: 90 }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z" }
              as: ProjectCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T13:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "MOBILIZE" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "START" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "COMPLETE", actual_excavated_cubic_yards: 9.5, hauled_tons: 12.4 }
              as: FieldTechnician
            - call: "POST /laboratories"
              payload: { lab_name: "Passaic Valley Labs", accredited: true, committed_turnaround_hours: 72, holding_time_hours: 336, max_concurrent_analyses: 2 }
              as: ComplianceOfficer
              captures: { lab_id: $.data.id }
            - call: "POST /soil-samples"
              payload: { tank_project_id: "${proj_id}", work_order_id: "${wo_id}", laboratory_id: "${lab_id}", sample_point: "CONFIRMATION_FLOOR", depth_inches: 84 }
              as: FieldTechnician
              captures: { s1_id: $.data.id }
            - call: "POST /soil-samples/${s1_id}/chain-of-custody"
              payload: { event: "DISPATCH" }
              as: FieldTechnician
            - call: "POST /soil-samples/${s1_id}/chain-of-custody"
              payload: { event: "RECEIVE" }
              as: LabAnalyst
              as_user_id: "${lab_id}"
            - call: "POST /soil-samples/${s1_id}/result"
              payload: { tph_mg_kg: 120.0, benzene_mg_kg: 0.05 }
              as: LabAnalyst
              as_user_id: "${lab_id}"
          trigger:
            - call: "GET /tank-projects/${proj_id}"
              as: ComplianceOfficer
              captures: { pv1: $.data.version }
            - call: "POST /trust-fund-claims"
              payload: { tank_project_id: "${proj_id}", variant: "PRELIMINARY_ESTIMATE", claimed_costs_cents: 13000000, expected_project_version: "${pv1}" }
              as: ComplianceOfficer
              captures: { prelim_id: $.data.id, prelim_eligible: $.data.eligible_amount_cents, prelim_admin: $.data.admin_fee_cents, prelim_cap: $.data.cap_cents }
            - call: "GET /tank-projects/${proj_id}"
              as: ComplianceOfficer
              captures: { pv2: $.data.version }
            - call: "POST /trust-fund-claims"
              payload: { tank_project_id: "${proj_id}", variant: "FINAL_SETTLEMENT", claimed_costs_cents: 13000000, expected_project_version: "${pv2}" }
              as: ComplianceOfficer
              captures: { final_id: $.data.id, final_eligible: $.data.eligible_amount_cents, final_admin: $.data.admin_fee_cents }
          assert:
            - "${prelim_cap} == 12500000"
            - "${prelim_admin} == 437500"
            - "${final_admin} == 437500"
            - "${prelim_eligible} == 12012500"
            - "${final_eligible} == 12062500"
            - "${final_eligible} - ${prelim_eligible} == 50000"
            - "TrustFundClaim.${prelim_id}.status == WITHDRAWN"
            - "TrustFundClaim.${prelim_id}.eligibility_findings contains SUPERSEDED_BY_FINAL_SETTLEMENT"
            - "TrustFundClaim.${final_id}.deductible_cents == 50000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: method_score_mode_a_nested_clamps_over_five_factors
        grounds:
          - calculations.decommission_method_recommendation
          - entities.TankProject.fields.method_score
          - entities.TankProject.fields.recommended_method
          - state_machines.TankProject.INTAKE_to_SURVEYED
        distinguishing_aspect: |
          Mode (a): five factors with non-linear interaction — each factor independently clamped by a nested
          min/max and two of them additionally branch on entity state — then the sum itself clamped. The raw
          factor sum is 88 + 45 + 35 + 15 + 10 = 193, the per-factor clamps reduce it to 40 + 30 + 35 + 15 + 10
          = 130, and the post-sum clamp pins method_score at exactly 100.00.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z."
            - "One NJ Property and one TankProject in status INTAKE with no survey recorded."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "3 Quarry Road", state_code: "NJ", county_code: "SSX", homeowner_name: "Pia Lund", homeowner_email: "pia@example.com", insurance_carrier_code: "CARR-NJ-3" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}" }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
          trigger:
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "MAGNETOMETER", tanks_detected_count: 1, tank_capacity_gallons: 1000, tank_depth_to_top_inches: 200, tank_distance_to_foundation_inches: 0, tank_under_structure: true, tank_material: "STEEL" }
              as: FieldTechnician
              captures: { score: $.data.method_score, rec: $.data.recommended_method }
          assert:
            - "${score} == 100.00"
            - "${score} != 193.00"
            - "${score} != 130.00"
            - "${rec} == ABANDONMENT_IN_PLACE"
            - "TankProject.${proj_id}.status == SURVEYED"
            - "TankProject.${proj_id}.survey_completed_at == 2026-08-03T08:00:00Z"

      - name: remediation_cost_mode_b_round_each_line_before_summation
        grounds:
          - calculations.remediation_cost
          - entities.RemediationChangeOrder.fields.line_amount_cents
          - entities.TankProject.fields.remediation_cost_cents
          - state_machines.RemediationChangeOrder.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Mode (b): two APPROVED change orders each land on a half-cent remainder — 3.5 x 1001 = 3503.5 and
          2.5 x 1001 = 2502.5. The pinned round-per-line-then-sum order yields 3504 + 2503 = 6007 and
          remediation_cost_cents 191007, whereas sum-then-round would yield 6006 and 191006.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-06T13:00:00Z."
            - "TankProject in REMEDIATION_ACTIVE (GROSS round-1 result), baseline_scope_cubic_yards 8.0, excavation_limit_cubic_yards 40.0, remediation_cost_cents 185000."
            - "No change order exists yet."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /properties"
              payload: { street_address: "44 Mill Street", state_code: "NJ", county_code: "MRS", homeowner_name: "Omar Vale", homeowner_email: "omar@example.com", insurance_carrier_code: "CARR-NJ-4" }
              as: ProjectCoordinator
              captures: { prop_id: $.data.id }
            - call: "POST /tank-projects"
              payload: { property_id: "${prop_id}", baseline_scope_cubic_yards: 8.0, excavation_limit_cubic_yards: 40.0 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /tank-projects/${proj_id}/sweep-survey"
              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /disclosures"
              payload: { tank_project_id: "${proj_id}", disclosure_kind: "SWEEP_FINDINGS" }
              as: ProjectCoordinator
              captures: { disc_id: $.data.id }
            - call: "POST /disclosures/${disc_id}/respond"
              payload: { response: "ACKNOWLEDGED", response_channel: "PORTAL" }
              as: Homeowner
              as_user_id: "${prop_id}"
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "MUNICIPAL_DECOMMISSION" }
              as: ProjectCoordinator
              captures: { mun_permit_id: $.data.id }
            - call: "POST /permits/${mun_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "FIRE_MARSHAL_NOTIFICATION" }
              as: ProjectCoordinator
              captures: { fm_permit_id: $.data.id }
            - call: "POST /permits/${fm_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /crews"
              payload: { crew_name: "Crew Charlie", cert_level: "TANK_TECH_II", mobilization_buffer_minutes: 90 }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z" }
              as: ProjectCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T13:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /work-orders/${wo_id}/field-events"
