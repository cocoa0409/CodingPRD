      - 'hop 1+2: exactly one OutbreakInvestigation TRIGGERED exists after it; OutbreakInvestigation.${inv_id}.origin == AUTO_THRESHOLD'
      - OutbreakInvestigation.${inv_id}.contributing_case_count == 3
