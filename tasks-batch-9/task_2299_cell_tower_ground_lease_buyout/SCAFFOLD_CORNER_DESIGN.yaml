  - section: errors
    instances:
      - name: unauthenticated_read_without_a_known_role_header_rejected
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - endpoints[GET /lease-buyouts/portfolios]
        distinguishing_aspect: |
          Every other 4XX in the catalog assumes an identified principal; this one proves the
          authentication gate fires first. The request omits X-Role entirely on an endpoint that
          four different roles are allowed to call, so it can only fail on priority 1: the response
          must be 401 ERR_UNAUTHENTICATED, not 403 ERR_UNAUTHORIZED (which would imply the header
          was parsed and then rejected) and not 200 with an empty page.
        test_recipe:
          setup:
            - "no fixtures are required - the failure happens before any resource is touched"
          setup_api_calls:
            []
          trigger:
            - { call: "GET /lease-buyouts/portfolios", payload: {}, as: none, captures: { err_id: $.data.error_id } }
          assert:
            - "status == 401"
            - "${err_id} == ERR_UNAUTHENTICATED"
            - "${err_id} != ERR_UNAUTHORIZED"
            - "response body carries data.message 'Missing or unknown X-Role header.'"
      - name: not_found_each_addressable_entity_type_returns_its_own_distinct_404_code
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PORTFOLIO_NOT_FOUND]
          - errors[ERR_FACILITY_NOT_FOUND]
          - errors[ERR_LANDOWNER_NOT_FOUND]
          - errors[ERR_TOWER_COMPANY_NOT_FOUND]
          - errors[ERR_TENANCY_NOT_FOUND]
          - errors[ERR_VALUATION_NOT_FOUND]
          - errors[ERR_DEAL_NOT_FOUND]
          - errors[ERR_OFFER_NOT_FOUND]
          - errors[ERR_TITLE_REPORT_NOT_FOUND]
          - errors[ERR_ROFR_NOTICE_NOT_FOUND]
          - errors[ERR_DISPUTE_NOT_FOUND]
          - errors[ERR_PLEDGE_NOT_FOUND]
          - errors[ERR_AMENDMENT_NOT_FOUND]
          - validations[priority=3]
          - validations[priority=4]
        distinguishing_aspect: |
          The cheap implementation raises one generic ERR_NOT_FOUND (or lets an ORM lookup surface
          a 500) for every unknown id, so a test that only checks 404 passes. This instance addresses
          thirteen different entity types with the same syntactically valid but unknown uuid and
          requires thirteen *distinct* codes back - including the two that would otherwise never be
          triggered on a happy path (ERR_TOWER_COMPANY_NOT_FOUND is raised from a request *body* FK,
          not a path segment, and ERR_LANDOWNER_NOT_FOUND from a plain read). Two of the calls also
          pin resolution order: the ROFR response is made by a real TowerCompanyAgent who is not the
          holder of the (non-existent) notice, so priority 3 existence must beat priority 7 ownership
          and return ERR_ROFR_NOTICE_NOT_FOUND rather than ERR_NOT_ROFR_HOLDER; the tenancy status
          call carries a legal status value, so it cannot be mistaken for an enum violation.
        test_recipe:
          setup:
            - "one TowerCompany exists so the TowerCompanyAgent caller in the ROFR probe is a real principal"
            - "no portfolio, facility, landowner, tenancy, valuation, deal, offer, title report, ROFR notice, dispute, pledge or amendment event with id 3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7 exists"
          setup_api_calls:
            - { call: "POST /lease-buyouts/tower-companies", payload: { legal_name: "Summit Towers LLC", notice_email: "rofr@summit.example", rofr_required: true, rofr_window_days: 30 }, as: PlatformAdmin, captures: { tc_id: $.data.id } }
          trigger:
            - { call: "GET /lease-buyouts/portfolios/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7", payload: {}, as: PlatformAdmin, captures: { e_portfolio: $.data.error_id } }
            - { call: "GET /lease-buyouts/financing-facilities/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7", payload: {}, as: TreasuryOfficer, captures: { e_facility: $.data.error_id } }
            - { call: "GET /lease-buyouts/landowners/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7", payload: {}, as: AcquisitionAnalyst, captures: { e_landowner: $.data.error_id } }
            - { call: "POST /lease-buyouts/tower-sites", payload: { tower_company_id: "3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7", site_code: "NE-9999", state_code: "NY", ground_area_sqft: 2500, structure_type: "MONOPOLE" }, as: AcquisitionAnalyst, captures: { e_towerco: $.data.error_id } }
            - { call: "POST /lease-buyouts/carrier-tenancies/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7/status", payload: { status: "TERMINATED" }, as: ServicingAgent, captures: { e_tenancy: $.data.error_id } }
            - { call: "POST /lease-buyouts/stream-valuations/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7/approve", payload: {}, as: PortfolioManager, as_user_id: "pm-alice", captures: { e_valuation: $.data.error_id } }
            - { call: "GET /lease-buyouts/deals/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7", payload: {}, as: PortfolioManager, captures: { e_deal: $.data.error_id } }
            - { call: "POST /lease-buyouts/offers/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7/transitions", payload: { action: "SEND" }, as: AcquisitionAnalyst, captures: { e_offer: $.data.error_id } }
            - { call: "GET /lease-buyouts/title-reports/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7", payload: {}, as: TitleOfficer, captures: { e_title: $.data.error_id } }
            - { call: "POST /lease-buyouts/rofr-notices/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7/response", payload: { decision: "WAIVE" }, as: TowerCompanyAgent, as_user_id: "${tc_id}", captures: { e_rofr: $.data.error_id } }
            - { call: "GET /lease-buyouts/disputes/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7", payload: {}, as: ServicingAgent, captures: { e_dispute: $.data.error_id } }
            - { call: "GET /lease-buyouts/collateral-pledges/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7", payload: {}, as: TreasuryOfficer, captures: { e_pledge: $.data.error_id } }
            - { call: "POST /lease-buyouts/amendment-events/3f7c1a52-9b64-4d18-8e2a-6c5f0b91d4e7/reverse", payload: { reversal_reason: "keyed the wrong event" }, as: ServicingAgent, captures: { e_amendment: $.data.error_id } }
          assert:
            - "every one of the thirteen calls returns status 404"
            - "${e_portfolio} == ERR_PORTFOLIO_NOT_FOUND"
            - "${e_facility} == ERR_FACILITY_NOT_FOUND"
            - "${e_landowner} == ERR_LANDOWNER_NOT_FOUND"
