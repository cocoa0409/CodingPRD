scaffold_corner_design:
  - section: entities
    instances:
      - name: client_create_applies_confidentiality_and_consent_defaults
        claim_type: defaults
        grounds: ['entities.Client.fields.confidentiality_tier', 'entities.Client.fields.consent_scope', 'entities.Client.fields.open_enrollment_count']
        distinguishing_aspect: "Omitting confidentiality_tier, consent_scope and consent_expires_on on POST /api/clients yields a STANDARD client with empty consent and open_enrollment_count 0, not a null field or a 422."
        test_recipe:
          setup: ["empty DB; the logical clock is pinned at the server startup default 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/clients"
              payload: { full_name: "Ada Vance", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK" }
              as: IntakeSpecialist
              captures: { c1: "$.data.id" }
          assert:
            - "response.code == 201 and response.data.confidentiality_tier == \"STANDARD\""
            - "response.data.consent_scope == []"
            - "response.data.open_enrollment_count == 0"
            - "response.data.created_at == \"2026-09-01T00:00:00.000Z\" and response.data.version == 1"

      - name: client_get_unknown_id_returns_not_found_error_envelope
        claim_type: not_found
        grounds: ['errors[ERR_CLIENT_NOT_FOUND]', 'endpoints[GET /api/clients/{id}]', 'entities.Client.fields.full_name']
        distinguishing_aspect: "A well-formed but unpersisted Client UUID on the path returns the error envelope with ERR_CLIENT_NOT_FOUND at 404, never an empty success object."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/clients/00000000-0000-4000-8000-000000000000"
              as: IntakeSpecialist
          assert:
            - "response.code == 404"
            - "response.response_type == \"error\" and response.data.error_id == \"ERR_CLIENT_NOT_FOUND\""
            - "response.meta.api_request_id != null"

      - name: program_create_initializes_capacity_counters_and_active_status
        claim_type: creation
        grounds: ['entities.Program.fields.enrolled_slots', 'entities.Program.fields.active_slots', 'endpoints[POST /api/programs]']
        distinguishing_aspect: "POST /api/programs returns the computed counters enrolled_slots 0 and active_slots 0 and status ACTIVE in the creation response itself, so a new program never starts at capacity."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/programs"
              payload: { name: "Housing First", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 3, match_eligible: true }
              as: ComplianceOfficer
              captures: { p1: "$.data.id" }
          assert:
            - "response.code == 201 and response.data.status == \"ACTIVE\""
            - "response.data.capacity_slots == 3 and response.data.enrolled_slots == 0 and response.data.active_slots == 0"
            - "response.data.match_eligible == true and response.data.nondiscrimination_attested == true"

      - name: grant_create_initializes_zero_ledgers_and_open_posture
        claim_type: creation
        grounds: ['entities.Grant.fields.expended_cents', 'entities.Grant.fields.obligated_cents', 'entities.Grant.fields.burn_ratio', 'calculations.grant_burn_posture']
        distinguishing_aspect: "A freshly created grant reports burn_ratio 0.0 and posture OPEN from the grant_burn_posture calculation rather than echoing an input or defaulting to THROTTLED."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/funders"
              payload: { name: "Diocesan Fund", funder_type: "DIOCESAN", allow_faith_based_activity: true, requires_time_and_effort_documentation: false, max_admin_rate_pct: 0.25, fiscal_year_start_month: 1 }
              as: ComplianceOfficer
              captures: { f1: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "Housing First", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 3, match_eligible: true }
              as: ComplianceOfficer
              captures: { p1: "$.data.id" }
          trigger:
            - call: "POST /api/grants"
              payload: { funder_id: "${f1}", program_id: "${p1}", grant_code: "G-1", total_award_cents: 200000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.25, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T23:59:59Z" }
              as: FinanceOfficer
              captures: { g1: "$.data.id" }
          assert:
            - "response.code == 201 and response.data.expended_cents == 0 and response.data.obligated_cents == 0"
            - "response.data.burn_ratio == 0.0 and response.data.status == \"OPEN\""
            - "response.data.funder_id == \"${f1}\" and response.data.program_id == \"${p1}\""

      - name: grant_list_filters_by_funder_and_status_with_pagination_envelope
        claim_type: listing
        grounds: ['endpoints[GET /api/grants]', 'response_envelope.pagination_fields']
        distinguishing_aspect: "GET /api/grants?funder_id= scopes the list to one funder while the envelope still carries limit 10, offset 0, total_count and has_more, and a status filter that matches nothing returns an empty array rather than a 404."
        test_recipe:
          setup: ["two funders each carrying one grant; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/funders"
              payload: { name: "Diocesan Fund", funder_type: "DIOCESAN", allow_faith_based_activity: true, requires_time_and_effort_documentation: false, max_admin_rate_pct: 0.25, fiscal_year_start_month: 1 }
              as: ComplianceOfficer
              captures: { f1: "$.data.id" }
            - call: "POST /api/funders"
              payload: { name: "County Human Services", funder_type: "COUNTY", allow_faith_based_activity: false, requires_time_and_effort_documentation: true, max_admin_rate_pct: 0.10, fiscal_year_start_month: 7 }
              as: ComplianceOfficer
              captures: { f2: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "Housing First", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 3, match_eligible: true }
              as: ComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${f1}", program_id: "${p1}", grant_code: "G-1", total_award_cents: 200000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.0, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T23:59:59Z" }
              as: FinanceOfficer
              captures: { g1: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${f2}", program_id: "${p1}", grant_code: "G-2", total_award_cents: 100000, admin_rate_pct: 0.10, allocation_rank: 2, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.0, cost_allocation_basis: "HEADCOUNT", restricted_purpose: "GENERAL_OPERATING", period_start: "2026-09-01T00:00:00Z", period_end: "2027-06-30T23:59:59Z" }
              as: FinanceOfficer
              captures: { g2: "$.data.id" }
          trigger:
            - call: "GET /api/grants?funder_id=${f1}"
              as: FinanceOfficer
            - call: "GET /api/grants?status=FROZEN"
              as: FinanceOfficer
          assert:
            - "first.data.length == 1 and first.data[0].id == \"${g1}\""
            - "the list envelope pagination fields read limit == 10, offset == 0, total_count == 1, has_more == false"
            - "second.data == [] and its pagination fields read total_count == 0 and has_more == false"

      - name: intake_assessment_path_client_must_resolve_before_body_is_read
        claim_type: parent_relationships
        grounds: ['validations[priority=3]', 'errors[ERR_CLIENT_NOT_FOUND]', 'endpoints[POST /api/clients/{id}/intake-assessments]']
        distinguishing_aspect: "POST /api/clients/{id}/intake-assessments against an unpersisted client id fails at the priority-3 existence check with ERR_CLIENT_NOT_FOUND even though the body is otherwise valid."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/clients/00000000-0000-4000-8000-000000000000/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
          assert:
            - "response.code == 404 and response.data.error_id == \"ERR_CLIENT_NOT_FOUND\""

      - name: eligibility_screen_creation_links_assessment_program_and_grant
        claim_type: creation
        grounds: ['entities.EligibilityScreen.fields.verification_state', 'entities.EligibilityScreen.fields.determination', 'endpoints[POST /api/intake-assessments/{id}/eligibility-screens]']
        distinguishing_aspect: "A new screen starts at determination PENDING and verification_state UNVERIFIED with screened_at stamped from the logical clock and all three FK links echoed, so the two independent state dimensions both start unadvanced."
        test_recipe:
          setup: ["one client, assessment, program and grant exist; clock 2026-09-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/funders"
              payload: { name: "Diocesan Fund", funder_type: "DIOCESAN", allow_faith_based_activity: true, requires_time_and_effort_documentation: false, max_admin_rate_pct: 0.25, fiscal_year_start_month: 1 }
              as: ComplianceOfficer
              captures: { f1: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "Housing First", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 3, match_eligible: true }
              as: ComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${f1}", program_id: "${p1}", grant_code: "G-1", total_award_cents: 200000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.0, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T23:59:59Z" }
              as: FinanceOfficer
              captures: { g1: "$.data.id" }
            - call: "POST /api/clients"
              payload: { full_name: "Ada Vance", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK" }
              as: IntakeSpecialist
              captures: { c1: "$.data.id" }
            - call: "POST /api/clients/${c1}/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
              captures: { a1: "$.data.id" }
          trigger:
            - call: "POST /api/intake-assessments/${a1}/eligibility-screens"
              payload: { program_id: "${p1}", grant_id: "${g1}", verified_income_cents: 120000, household_size_at_screen: 2 }
              as: IntakeSpecialist
              captures: { s1: "$.data.id" }
          assert:
            - "response.code == 201 and response.data.determination == \"PENDING\" and response.data.verification_state == \"UNVERIFIED\""
            - "response.data.screened_at == \"2026-09-01T00:00:00.000Z\""
            - "response.data.intake_assessment_id == \"${a1}\" and response.data.program_id == \"${p1}\" and response.data.grant_id == \"${g1}\""

      - name: service_delivery_sequence_no_is_server_assigned_and_monotonic
        claim_type: system_fields
        grounds: ['entities.ServiceDelivery.fields.sequence_no', 'endpoints[POST /api/service-deliveries]']
        distinguishing_aspect: "Two deliveries created back to back receive sequence_no 1 then 2 from the server counter, and neither sequence_no is derived from or equal to the row's UUID id."
        test_recipe:
          setup: ["an ACTIVE enrollment with one ACTIVE authorization of 10 units exists; clock 2026-09-02T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/funders"
              payload: { name: "Diocesan Fund", funder_type: "DIOCESAN", allow_faith_based_activity: true, requires_time_and_effort_documentation: false, max_admin_rate_pct: 0.25, fiscal_year_start_month: 1 }
              as: ComplianceOfficer
              captures: { f1: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "Housing First", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 3, match_eligible: true }
              as: ComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${f1}", program_id: "${p1}", grant_code: "G-1", total_award_cents: 200000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.0, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T23:59:59Z" }
              as: FinanceOfficer
              captures: { g1: "$.data.id" }
            - call: "POST /api/clients"
              payload: { full_name: "Ada Vance", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK" }
              as: IntakeSpecialist
              captures: { c1: "$.data.id" }
            - call: "POST /api/clients/${c1}/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
              captures: { a1: "$.data.id" }
            - call: "POST /api/intake-assessments/${a1}/eligibility-screens"
              payload: { program_id: "${p1}", grant_id: "${g1}", verified_income_cents: 120000, household_size_at_screen: 2 }
              as: IntakeSpecialist
              captures: { s1: "$.data.id" }
            - call: "POST /api/eligibility-screens/${s1}/determine"
              payload: { determination: "PENDING" }
              as: ComplianceOfficer
            - call: "POST /api/intake-assessments/${a1}/submit"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/intake-assessments/${a1}/route"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${s1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "GET /api/enrollments?client_id=${c1}&program_id=${p1}"
              as: ProgramManager
              captures: { e1: "$.data[0].id", e1v: "$.data[0].version" }
            - call: "POST /api/enrollments/${e1}/activate"
              payload: {}
              as: ProgramManager
            - call: "POST /api/service-authorizations"
              payload: { enrollment_id: "${e1}", grant_id: "${g1}", service_code: "HOUSING_RENT_ASSIST", authorized_units: 10, unit_rate_cents: 5000, period_start: "2026-09-01T00:00:00Z", period_end: "2026-10-01T00:00:00Z", expected_enrollment_version: "${e1v}" }
              as: ProgramManager
              captures: { au1: "$.data.id", au1v: "$.data.version" }
          trigger:
            - call: "POST /api/service-deliveries"
              payload: { service_authorization_id: "${au1}", grant_id: "${g1}", client_id: "${c1}", service_date: "2026-09-02T01:00:00Z", units_delivered: 2, unit_rate_cents: 5000, expected_service_authorization_version: "${au1v}" }
              as: ProgramManager
              captures: { d1: "$.data.id", d1seq: "$.data.sequence_no", au1v2: "$.data.version" }
            - call: "POST /api/service-deliveries"
              payload: { service_authorization_id: "${au1}", grant_id: "${g1}", client_id: "${c1}", service_date: "2026-09-02T02:00:00Z", units_delivered: 1, unit_rate_cents: 5000, expected_service_authorization_version: "${au1v2}" }
              as: ProgramManager
              captures: { d2: "$.data.id", d2seq: "$.data.sequence_no" }
          assert:
            - "first.sequence_no == 1 and second.sequence_no == 2"
            - "first.sequence_no != first.id and second.sequence_no != second.id"
            - "first.status == \"DRAFT\" and first.documentation_status == \"INCOMPLETE\" and first.gross_cost_cents == 10000"

      - name: client_get_computed_open_enrollment_count_after_activation
        claim_type: computed_fields
        grounds: ['entities.Client.fields.open_enrollment_count', 'state_machines.Enrollment.transitions.PENDING_to_ACTIVE']
        distinguishing_aspect: "Client.open_enrollment_count is recomputed from child Enrollment rows on read, moving 0 to 1 only after the PENDING to ACTIVE transition and not at enrollment creation."
        test_recipe:
          setup: ["an ELIGIBLE screen has already cascaded a PENDING enrollment into existence; clock 2026-09-02T00:00:00Z"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/funders"
              payload: { name: "Diocesan Fund", funder_type: "DIOCESAN", allow_faith_based_activity: true, requires_time_and_effort_documentation: false, max_admin_rate_pct: 0.25, fiscal_year_start_month: 1 }
              as: ComplianceOfficer
              captures: { f1: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "Housing First", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 3, match_eligible: true }
              as: ComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${f1}", program_id: "${p1}", grant_code: "G-1", total_award_cents: 200000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.0, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T23:59:59Z" }
              as: FinanceOfficer
              captures: { g1: "$.data.id" }
            - call: "POST /api/clients"
              payload: { full_name: "Ada Vance", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK" }
              as: IntakeSpecialist
              captures: { c1: "$.data.id" }
            - call: "POST /api/clients/${c1}/intake-assessments"
              payload: { assessment_date: "2026-09-01T00:00:00Z", presenting_needs: ["rent arrears"], requested_domains: ["HOUSING"] }
              as: IntakeSpecialist
              captures: { a1: "$.data.id" }
            - call: "POST /api/intake-assessments/${a1}/eligibility-screens"
              payload: { program_id: "${p1}", grant_id: "${g1}", verified_income_cents: 120000, household_size_at_screen: 2 }
              as: IntakeSpecialist
              captures: { s1: "$.data.id" }
            - call: "POST /api/eligibility-screens/${s1}/determine"
              payload: { determination: "PENDING" }
              as: ComplianceOfficer
            - call: "POST /api/intake-assessments/${a1}/submit"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/intake-assessments/${a1}/route"
              payload: {}
              as: IntakeSpecialist
            - call: "POST /api/eligibility-screens/${s1}/determine"
              payload: { determination: "ELIGIBLE" }
              as: ComplianceOfficer
            - call: "GET /api/enrollments?client_id=${c1}&program_id=${p1}"
              as: ProgramManager
              captures: { e1: "$.data[0].id" }
            - call: "GET /api/clients/${c1}"
              as: IntakeSpecialist
              captures: { before_count: "$.data.open_enrollment_count" }
          trigger:
            - call: "POST /api/enrollments/${e1}/activate"
              payload: {}
              as: ProgramManager
            - call: "GET /api/clients/${c1}"
              as: IntakeSpecialist
          assert:
            - "before_count == 0 (a PENDING enrollment consumes capacity but not an open-enrollment slot)"
            - "after.data.open_enrollment_count == 1"
            - "after.data.id == \"${c1}\" and after.data.confidentiality_tier == \"STANDARD\""
  - section: state_machines
    instances:
      - name: intake_submit_from_routed_returns_invalid_state_without_side_effects
        claim_type: invalid_transition
        grounds: ['state_machines.IntakeAssessment.transitions.DRAFT_to_SUBMITTED', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Once the assessment is ROUTED, POST submit matches no from-state, so the request fails at the priority-4 state check and neither status nor version moves."
        test_recipe:
          setup: ["assessment already ROUTED with one VERIFIED screen"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/funders"
              payload: { name: "Diocesan Fund", funder_type: "DIOCESAN", allow_faith_based_activity: true, requires_time_and_effort_documentation: false, max_admin_rate_pct: 0.25, fiscal_year_start_month: 1 }
              as: ComplianceOfficer
              captures: { f1: "$.data.id" }
            - call: "POST /api/programs"
              payload: { name: "Housing First", service_domain: "HOUSING", faith_based_activity_offered: false, nondiscrimination_attested: true, capacity_slots: 3, match_eligible: true }
              as: ComplianceOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /api/grants"
              payload: { funder_id: "${f1}", program_id: "${p1}", grant_code: "G-1", total_award_cents: 200000, admin_rate_pct: 0.10, allocation_rank: 1, max_in_kind_rate_cents: 3000, matching_requirement_pct: 0.0, cost_allocation_basis: "DIRECT_ONLY", restricted_purpose: "HOUSING_ASSISTANCE", period_start: "2026-09-01T00:00:00Z", period_end: "2027-08-31T23:59:59Z" }
              as: FinanceOfficer
              captures: { g1: "$.data.id" }
            - call: "POST /api/clients"
              payload: { full_name: "Ada Vance", date_of_birth: "1990-01-01", household_size: 2, immigration_status: "CITIZEN", county_code: "COOK" }
              as: IntakeSpecialist
