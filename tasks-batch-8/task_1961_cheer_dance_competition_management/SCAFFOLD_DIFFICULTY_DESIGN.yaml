  - rule_id: resource_temporal_overlap
    instances:
      - name: warmup_mat_half_open_interval_adjacency
        grounds:
          - validations[priority=12]
          - errors[ERR_WARM_UP_OVERLAP]
          - entities.WarmUpAssignment
        distinguishing_aspect: |
          Resource = warm-up mat; interval semantics = half-open [starts_at, ends_at) with
          adjacency allowed. [09:35,09:50) after [09:20,09:35) is legal (touching);
          [09:34,09:40) collides and is rejected.
        test_recipe:
          setup: ["Division scheduled (schedule_start 2026-09-05T10:00:00Z -> t1 performance at 10:00:00); team t1 REGISTERED with a SCHEDULED performance"]
          setup_api_calls:
            - { call: "POST /api/events", payload: { name: "Regionals", venue_name: "Arena", start_date: "2026-09-05", end_date: "2026-09-06", age_reference_date: "2026-08-31" }, as: EventDirector, captures: { ev: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J1", certified_levels: [3] }, as: EventDirector, captures: { j1: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J2", certified_levels: [3] }, as: EventDirector, captures: { j2: $.data.id } }
            - { call: "POST /api/judges", payload: { full_name: "J3", certified_levels: [3] }, as: EventDirector, captures: { j3: $.data.id } }
            - { call: "POST /api/divisions", payload: { event_id: "${ev}", name: "D1", category: "CHEER", level: 3, min_age: 11, max_age: 18, min_athletes: 1, max_athletes: 4, routine_time_limit_seconds: 150, warmup_mats: ["A", "B", "C"], schedule_start_at: "2026-09-05T10:00:00Z", judge_ids: ["${j1}", "${j2}", "${j3}"] }, as: EventDirector, captures: { dv: $.data.id, dv_v: $.data.version } }
            - { call: "POST /api/events/${ev}/open-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/athletes", payload: { full_name: "Ann", date_of_birth: "2010-05-01" }, as: TeamCoach, as_user_id: "coach-1", captures: { a1: $.data.id } }
            - { call: "POST /api/teams", payload: { event_id: "${ev}", division_id: "${dv}", name: "T1", organization: "Gym1", category: "CHEER", level: 3, coach_user_id: "coach-1" }, as: TeamCoach, as_user_id: "coach-1", captures: { t1: $.data.id } }
            - { call: "POST /api/roster-entries", payload: { team_id: "${t1}", athlete_id: "${a1}", bib_number: 1 }, as: TeamCoach, as_user_id: "coach-1" }
            - { call: "POST /api/events/${ev}/close-registration", payload: {}, as: EventDirector }
            - { call: "POST /api/divisions/${dv}/generate-schedule", payload: { expected_division_version: "${dv_v}" }, as: EventDirector }
          trigger:
            - { call: "POST /api/warm-up-assignments", payload: { event_id: "${ev}", team_id: "${t1}", mat: "M1", starts_at: "2026-09-05T09:20:00Z", ends_at: "2026-09-05T09:35:00Z" }, as: TeamCoach, as_user_id: "coach-1", captures: { w1: $.data.id } }
            - { call: "POST /api/warm-up-assignments", payload: { event_id: "${ev}", team_id: "${t1}", mat: "M1", starts_at: "2026-09-05T09:35:00Z", ends_at: "2026-09-05T09:50:00Z" }, as: TeamCoach, as_user_id: "coach-1", captures: { w2: $.data.id } }
            - { call: "POST /api/warm-up-assignments", payload: { event_id: "${ev}", team_id: "${t1}", mat: "M1", starts_at: "2026-09-05T09:34:00Z", ends_at: "2026-09-05T09:40:00Z" }, as: TeamCoach, as_user_id: "coach-1", captures: { err: "$.data.error_id" } }
          assert:
            - "First two bookings succeed (201): adjacency at 09:35:00 is NOT an overlap (half-open intervals)"
            - "09:50:00 end satisfies rest rule exactly: 09:50:00 + 600s == 10:00:00 == scheduled_start (inclusive)"
            - "Third booking (09:34-09:40) rejected with ERR_WARM_UP_OVERLAP, http 409"

      - name: performance_mat_buffer_pitch_and_mat_sufficiency
        grounds:
          - calculations.warmup_schedule_geometry
          - errors[ERR_INSUFFICIENT_WARM_UP_MATS]
        distinguishing_aspect: |
          Resource = performance mat; interval semantics = fixed pitch with a mandatory
          180s transition buffer (start spacing = limit + 180), NOT half-open adjacency —
