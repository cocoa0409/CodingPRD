  - name: segregation_of_duties_counterparty_rotation
    claim_type: Segregation of duties
    grounds:
    - complexity_profile.role_model
    - validations.p11_ERR_SEGREGATION_OF_DUTIES.check
    excluded_because:
      difficulty_instance: non_linear_state_machine / license_reject_resubmit_verify_cycle_swaps_sod_counterparty
      rationale: That instance rotates submitted_by_user_id through the REJECTED -> resubmit -> PENDING_REVIEW loop and shows that the officer who could review before the resubmit is exactly the officer who is refused after it, which subsumes any static same-user-cannot-do-both check; the static refusals themselves are covered by §1.9 validations / segregation_of_duties_blocks_self_review_and_self_override.

- section: cross_cutting_complexity_layers
  instances:
  - name: occ_stale_guest_version_rejects_intake_form_create
    claim_type: optimistic_concurrency
    grounds:
    - concurrency_rules.intake-form-create-stale-guest
    - validations.p8_stale_version.check
    - entities.Guest.fields.authoritative_intake_form_id
    distinguishing_aspect: "The guest's version is bumped by writes the client never issued — the first intake form's creation and its screening each increment it — so a writer replaying the version it read at registration must be refused; an implementation that only bumps version on direct guest updates, or that compares against the form rather than the guest, accepts the replay and silently discards the screening decision."
    test_recipe:
      setup: One registered guest whose version is captured at creation, then advanced twice by an intake form create and that form's screening.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-01T09:00:00.000Z" }
        as: SpaDirector
      - call: POST /guests
        payload: { full_name: "OCC Guest", resort_room_number: "2901", folio_limit_cents: 500000 }
        as: SpaCoordinator
        captures: { g1: $.data.id, v_at_create: $.data.version }
      - call: POST /guests/${g1}/intake-forms
        payload: { expected_guest_version: "${v_at_create}", condition_codes: [], medications: [] }
        as: Guest
        as_user_id: "${g1}"
        captures: { in1: $.data.id }
      - call: POST /intake-forms/${in1}/consent
        payload: { consent_version: "2026.1" }
        as: Guest
        as_user_id: "${g1}"
      - call: POST /intake-forms/${in1}/submit
        payload: {}
        as: Guest
        as_user_id: "${g1}"
      - call: POST /intake-forms/${in1}/screen
        payload: {}
        as: ComplianceOfficer
        as_user_id: "co-3"
      trigger:
      - call: POST /guests/${g1}/intake-forms
        payload: { expected_guest_version: "${v_at_create}", condition_codes: ["ACTIVE_INFECTION"], medications: [] }
        as: Guest
        as_user_id: "${g1}"
        captures: { err_stale: $.data.error_id }
      - call: GET /guests/${g1}
        as: Guest
        as_user_id: "${g1}"
        captures: { v_fresh: $.data.version }
      - call: POST /guests/${g1}/intake-forms
        payload: { expected_guest_version: "${v_fresh}", condition_codes: ["ACTIVE_INFECTION"], medications: [] }
        as: Guest
        as_user_id: "${g1}"
        captures: { in2: $.data.id }
      - call: GET /guests/${g1}
        as: Guest
        as_user_id: "${g1}"
      - call: GET /guests/${g1}/intake-forms
        as: SpaCoordinator
      assert:
      - "the replay of ${v_at_create} returns 412 ERR_STALE_GUEST_VERSION and creates no IntakeForm row"
      - "the guest's version at the fresh read is ${v_at_create} + 2: the first form's creation and its screening each incremented it, and the refused write did not"
      - "the retry with ${v_fresh} returns 201 with status DRAFT, and it bumps the guest's version by exactly one more"
      - "the new DRAFT form does not disturb the screening decision: authoritative_intake_form_id is still ${in1}, screened_condition_codes is still [] and ${in1} is still SCREENED_CLEAR — a DRAFT form is not authoritative and does not supersede"
      - "GET /guests/${g1}/intake-forms returns both forms in created_at ASC order with total_count 2"

  - name: occ_stale_appointment_version_rejects_final_settlement
