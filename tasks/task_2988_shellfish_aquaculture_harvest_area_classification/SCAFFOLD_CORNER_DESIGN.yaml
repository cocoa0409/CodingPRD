              as: SeafoodDealer
              as_user_id: "${dealer}"
          assert:
            - "All five reads return HTTP 200 with response_type == \"array\", total_count == 1 and data[0].code == GA-114"
            - "The clock call by the SeafoodDealer returns HTTP 200"
            - "No response carries a data.error_id"

  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_area_version_is_refused_then_the_reread_retry_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[classification-decision-stale-area]
          - errors[ERR_STALE_AREA_VERSION]
          - entities.GrowingArea.fields.version
        distinguishing_aspect: |
          The OCC token is the whole-row version, not a per-field one: the first decision bumps the
          area to version 2, a second decision replaying version 1 gets 412, and the same payload
          re-sent with the freshly read version 2 succeeds — so version must increment on every
          write and the refused write must not increment it.
        test_recipe:
          setup:
            - "GrowingArea GA-114 created with conditional_management_plan_on_file true, APPROVED/OPEN, version 1."
            - "Five ACCEPTED 2-MPN samples give accepted_sample_count 5 and eligible_classification APPROVED without changing version."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: true }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-12T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-19T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-26T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-31T09:00:00Z", fecal_coliform_mpn: 2, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
              captures: { area_v1: $.data.version }
            - call: "POST /shellfish/growing-areas/${area}/classification-decisions"
              payload: { classification: "RESTRICTED", expected_area_version: "${area_v1}", decision_note: "first downgrade" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/growing-areas/${area}/classification-decisions"
              payload: { classification: "CONDITIONALLY_APPROVED", expected_area_version: "${area_v1}", decision_note: "replay of a stale read" }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
              captures: { area_v2: $.data.version }
            - call: "POST /shellfish/growing-areas/${area}/classification-decisions"
              payload: { classification: "CONDITIONALLY_APPROVED", expected_area_version: "${area_v2}", decision_note: "retry after re-reading" }
              as: ShellfishControlAuthority
          assert:
            - "First call: HTTP 412 with data.error_id == ERR_STALE_AREA_VERSION"
            - "The GET between the two writes reports version == 2 and classification == RESTRICTED"
            - "Third call: HTTP 201 with data.classification == CONDITIONALLY_APPROVED and data.version == 3"
            - "GET /shellfish/growing-areas/${area} reports harvest_status == OPEN and eligible_classification == APPROVED throughout"

      - name: stale_dealer_version_is_refused_then_the_reread_retry_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[certification-renewal-stale-dealer]
          - errors[ERR_STALE_DEALER_VERSION]
          - entities.Dealer.fields.version
        distinguishing_aspect: |
          The second OCC rule guards a different entity with a different field name and a different
          error id: replaying expected_dealer_version 1 after a renewal has already advanced the
          dealer to version 2 is refused with 412, so a shared implementation that only honours
          expected_area_version fails here.
        test_recipe:
          setup:
            - "Dealer Coastal Shellstock (SHELLSTOCK_SHIPPER, NC-1234-SS, certified_through 2027-06-30) created at version 1, listing_status NOT_LISTED."
            - "A first renewal sets certified_through 2027-06-30 and icssl_listed_through 2027-06-30, so the dealer is LISTED at version 2."
          setup_api_calls:
            - call: "POST /shellfish/dealers"
              payload: { name: "Coastal Shellstock", state_code: "NC", certification_category: "SHELLSTOCK_SHIPPER", certification_no: "NC-1234-SS", certified_through: "2027-06-30" }
              as: ShellfishControlAuthority
              captures: { dealer: $.data.id, dealer_v: $.data.version }
            - call: "POST /shellfish/dealers/${dealer}/certification-renewals"
              payload: { expected_dealer_version: "${dealer_v}", certified_through: "2027-06-30", icssl_listed_through: "2027-06-30" }
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/dealers/${dealer}/certification-renewals"
              payload: { expected_dealer_version: "${dealer_v}", certified_through: "2028-06-30", icssl_listed_through: "2028-06-30" }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/dealers/${dealer}"
              payload: {}
              as: ShellfishControlAuthority
              captures: { dealer_v2: $.data.version }
            - call: "POST /shellfish/dealers/${dealer}/certification-renewals"
              payload: { expected_dealer_version: "${dealer_v2}", certified_through: "2028-06-30", icssl_listed_through: "2028-06-30" }
              as: ShellfishControlAuthority
          assert:
            - "First call: HTTP 412 with data.error_id == ERR_STALE_DEALER_VERSION, not ERR_STALE_AREA_VERSION"
            - "The GET reports version == 2, certified_through == 2027-06-30 and listing_status == LISTED"
            - "Third call: HTTP 200 with data.certified_through == 2028-06-30, data.icssl_listed_through == 2028-06-30 and data.version == 3"
            - "GET /shellfish/dealers/${dealer} reports recall_strike_count == 0 (renewals never touch strikes)"

      - name: the_fifth_failing_sample_is_what_fires_the_downgrade_sweep
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.area_water_quality_statistics
          - calculations.area_eligible_classification
          - state_machines[GrowingArea.harvest_status OPEN -> CLOSED_SAMPLE_FAILURE]
        distinguishing_aspect: |
          The sweep is gated on a cumulative count AND a threshold: after four 200-MPN samples the
          area is still APPROVED and OPEN with eligible_classification INSUFFICIENT_DATA, and the
          fifth identical sample simultaneously satisfies the 5-sample minimum and the 14.0
          geometric-mean threshold, so the downgrade lands on exactly that call.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED/OPEN with clean_sample_mpn_limit 14.0 and no samples."
            - "MIN_SAMPLES_FOR_DECISION is 5 and the sweep threshold is a geometric mean strictly above 14.0."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas"
              payload: { code: "GA-114", water_body: "Pamlico Sound", rainfall_closure_threshold_in: 1.0, rainfall_closure_hours: 96, reopen_sample_count_required: 3, clean_sample_mpn_limit: 14.0, conditional_management_plan_on_file: false }
              as: ShellfishControlAuthority
              captures: { area: $.data.id }
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-05T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-12T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-19T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-26T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
          trigger:
            - call: "POST /shellfish/growing-areas/${area}/water-samples"
              payload: { station_code: "ST-1", collected_at: "2026-07-31T09:00:00Z", fecal_coliform_mpn: 200, water_temp_c: 24.0, salinity_ppt: 30.0 }
              as: ShellfishControlAuthority
            - call: "GET /shellfish/growing-areas/${area}"
              payload: {}
              as: ShellfishControlAuthority
          assert:
            - "The setup GET after four samples reports accepted_sample_count == 4, classification == APPROVED, harvest_status == OPEN and eligible_classification == INSUFFICIENT_DATA"
            - "The fifth ingest returns HTTP 201 with data.sample_status == ACCEPTED"
            - "The trigger GET reports accepted_sample_count == 5, geometric_mean_mpn == 200.0, p90_mpn == 200.0, eligible_classification == PROHIBITED, classification == PROHIBITED, harvest_status == CLOSED_SAMPLE_FAILURE and consecutive_clean_samples == 0"
            - "GET /shellfish/growing-areas/${area}/classification-summary returns sample_count == 5 and geometric_mean_mpn == 200.0"

      - name: cascading_side_effects_chain_from_a_confirmed_illness_investigation
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers[cascading_side_effects]"
          - "state_machines[IllnessInvestigation.status]"
          - "state_machines[Dealer.listing_status LISTED -> SUSPENDED]"
        excluded_because:
          difficulty_instance: illness_confirmation_cascades_lot_recall_shipment_recall_dealer_suspension
          rationale: "That instance verifies the deepest declared chain end to end in one call (lot RECALLED, shipment RECALLED, strike increment and the threshold-driven dealer suspension), which is exactly the N-level claim this layer asks for."

      - name: cascading_side_effects_ordering_and_scope_on_a_rainfall_closure
        claim_type: cascading_side_effects
        grounds:
          - "complexity_profile.complexity_layers[cascading_side_effects]"
          - "state_machines[GrowingArea.harvest_status OPEN -> CLOSED_RAINFALL]"
          - "state_machines[HarvestAuthorization.status ACTIVE -> VOIDED]"
        excluded_because:
          difficulty_instance: rainfall_closure_cascades_authorization_void_lot_embargo_shipment_hold
          rationale: "The ordering sensitivity of the cascade is already pinned there: hop 4 can only find the shipment through the lots embargoed in hop 3, and lots outside the voided authorization are proven untouched, so a second recipe adds no new discrimination."

      - name: dual_variant_area_statistics_produce_two_different_answers
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers[dual_variant_calculation]"
          - "calculations.area_water_quality_statistics"
          - "endpoints[GET /shellfish/growing-areas/{id}/classification-summary]"
        excluded_because:
          difficulty_instance: area_stats_diverge_between_systematic_and_adverse_variants
          rationale: "That instance reads both variants over one stored sample set and pins the divergent statistics and the resulting eligible_classification delta, which is precisely the both-variants-plus-delta claim for this layer."

      - name: dual_variant_time_to_temperature_basis_switch
        claim_type: dual_variant_calculation
        grounds:
          - "complexity_profile.complexity_layers[dual_variant_calculation]"
          - "calculations.harvest_lot_time_to_temperature"
          - "entities.HarvestLot.fields.compliance_status"
        excluded_because:
          difficulty_instance: ttt_minutes_diverge_between_first_and_last_out_of_water_basis
          rationale: "The second dual-variant calculation is fully covered there, including the compliance_status flip that the basis switch causes on identical stored instants."
  - section: consistency_model
    instances:

      - name: closure_effects_are_visible_in_the_same_response_that_causes_them
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - entities.RainfallEvent.fields.triggered_closure
          - entities.RainfallEvent.fields.voided_authorization_count
        distinguishing_aspect: |
          The consistency model is immediate, so the ingest response itself must already report
          triggered_closure true and voided_authorization_count 1 — an implementation that computes
          the cascade lazily on the next read would return a null or zero count here even though the
          follow-up GETs eventually agree.
        test_recipe:
          setup:
            - "GrowingArea GA-114 APPROVED/OPEN with rainfall_closure_threshold_in 1.00 and rainfall_closure_hours 96."
            - "The standard active-authorization fixture on GA-114 with one landed COMPLIANT lot LOT-A, so open_authorization_count is 1."
            - "Clock 2026-08-10T11:00:00Z."
          setup_api_calls:
            - call: "POST /shellfish/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
