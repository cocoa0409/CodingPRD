              as_user_id: "qa-rb2"
              captures: { inv_rb2: $.data.id }
          trigger:
            - call: "POST /cleanroom/investigations/${inv_rb2}/approve"
              payload: {}
              as: ProductionOperator
              as_user_id: "op-rb2"
              captures: { err_rb2: $.data.error_id }
          assert:
            - "HTTP 403 error_id == ERR_FORBIDDEN  (role check at priority 2 precedes state checks)"

      - name: material_handler_cannot_record_sample
        claim_type: rbac_denial
        grounds:
          - "roles"
          - "validations[priority=2]"
        distinguishing_aspect: "MaterialHandler calling POST /cleanroom/samples (EnvironmentTech-exclusive) is denied with 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Room CR-RB3 with one ACTIVE PARTICLE point"]
