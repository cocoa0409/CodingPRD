              payload: {}
              as: SupplierRep
              as_user_id: "${sup_x_id}"
          assert:
            - "The first trigger call returns 403 ERR_SUPPLIER_SCOPE_VIOLATION — the row exists, so the scope rule at priority 3 answers before the 404 at priority 4"
            - "The second trigger call returns 403 ERR_SUPPLIER_SCOPE_VIOLATION because the mandatory supplier_id filter is absent"
            - "The third trigger call returns 200 with exactly 1 item, ${rec_x_id}, and total_count == 1"
            - "The same three calls as WarrantyAnalyst all return 200, and the unfiltered list then reports total_count == 2"

      - name: corner_supplier_rep_can_respond_to_its_own_asserted_recovery
        claim_type: Segregation of duties
