        distinguishing_aspect: "PortfolioManager (read-only) is denied on POST finalize."
        test_recipe:
          setup: ["Fund with OPEN NavPeriod"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { fund_name: "F1", domicile: "Cayman", gate_threshold_pct: 0.25, lockup_months_default: 0, notice_days_default: 0, fiscal_year_end_month: 12 }
