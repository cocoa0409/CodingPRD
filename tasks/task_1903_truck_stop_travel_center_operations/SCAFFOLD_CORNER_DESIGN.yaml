scaffold_corner_design:
  # =====================================================================
  # Section: entities
  # =====================================================================
  - section: entities
    instances:
      - name: entity_creation_defaults_applied
        claim_type: defaults
        grounds:
          - "entities.LoyaltyMember.fields.stack_cap_points"
          - "entities.TravelCenterSite.fields.water_usage_gallons"
          - "entities.FleetAccount.fields.current_balance_cents"
        distinguishing_aspect: "Omitting defaulted inputs yields documented defaults: member stack_cap_points 500 / points_balance 0 / status ACTIVE; site water_usage_gallons 0 and retail mirrors null; fleet current_balance_cents 0 / rolling 0 / tier as given."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site D1", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /loyalty-members", payload: { full_name: "Driver A", email: "a@x.com" }, as: Cashier, as_user_id: "cash-1", captures: { m_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 5000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
          trigger:
            - { call: "GET /sites/${site_id}", payload: {}, as: GeneralManager, captures: { water: "$.data.water_usage_gallons", diesel_mirror: "$.data.diesel_retail_cents_per_gallon" } }
            - { call: "GET /loyalty-members/${m_id}", payload: {}, as: GeneralManager, captures: { cap: "$.data.stack_cap_points", bal: "$.data.points_balance", mstatus: "$.data.status" } }
            - { call: "GET /fleet-accounts/${f_id}", payload: {}, as: GeneralManager, captures: { fbal: "$.data.current_balance_cents", froll: "$.data.rolling_30d_gallons", fstatus: "$.data.status" } }
          assert:
            - "site water_usage_gallons == 0 and diesel_retail_cents_per_gallon == null"
            - "member stack_cap_points == 500, points_balance == 0, status == ACTIVE"
            - "fleet current_balance_cents == 0, rolling_30d_gallons == 0, status == ACTIVE"

      - name: entity_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds:
          - "entities.TravelCenterSite.fields.parking_paid_capacity"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "POST /sites without required parking_paid_capacity is rejected ERR_INVALID_REQUEST (400); nothing is persisted."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sites", payload: { name: "Site Bad", parking_total_spaces: 60, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /sites", payload: {}, as: GeneralManager }
          assert:
            - "err == ERR_INVALID_REQUEST"
            - "site list remains empty"

      - name: entity_invalid_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - "entities.Pump.fields.fuel_types"
          - "errors[ERR_INVALID_REQUEST]"
        distinguishing_aspect: "Pump fuel_types containing JET_A (not in the declared enum) is rejected ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Site exists"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site D2", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["JET_A"] }, as: FuelDeskLead, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: entity_extra_system_field_rejected
        claim_type: system_fields
        grounds:
          - "entities.TravelCenterSite.fields.id"
          - "entities.TravelCenterSite.fields.version"
        distinguishing_aspect: "Client-supplied id/version on create are system-owned; the strict request contract rejects unknown/system fields with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /sites", payload: { name: "Site Bad", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1, id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", version: 7 }, as: GeneralManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: entity_get_missing_site_returns_not_found
        claim_type: not_found
        grounds:
          - "errors[ERR_NOT_FOUND]"
          - "endpoints.GET /sites/{id}"
        distinguishing_aspect: "GET on a non-existent UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /sites/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: GeneralManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: entity_list_pagination_counts
        claim_type: listing
        grounds:
          - "response_envelope.pagination_fields"
          - "endpoints.GET /sites/{id}/pumps"
        distinguishing_aspect: "List endpoint honors limit/offset and reports total_count and has_more: 2 pumps, limit 1 -> 1 row, total_count 2, has_more true; offset 1 -> has_more false."
        test_recipe:
          setup: ["Site with two pumps"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site D3", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 2, fuel_types: ["DIESEL"] }, as: FuelDeskLead }
          trigger:
            - { call: "GET /sites/${site_id}/pumps?limit=1&offset=0", payload: {}, as: GeneralManager }
            - { call: "GET /sites/${site_id}/pumps?limit=1&offset=1", payload: {}, as: GeneralManager }
          assert:
            - "page 1: 1 row, total_count == 2, has_more == true"
            - "page 2: 1 row, total_count == 2, has_more == false"

      - name: stock_is_low_stock_computed_rejects_client_input
        claim_type: computed_fields
        grounds:
          - "entities.StockItem.fields.is_low_stock"
        distinguishing_aspect: "is_low_stock is computed from on_hand <= reorder_point; a client-supplied is_low_stock field on create is rejected under the strict request contract (ERR_INVALID_REQUEST), so the stored value can only come from the computation."
        test_recipe:
          setup: ["Site exists"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site D4", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
          trigger:
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "SNACK-A", name: "Snack A", category: "RETAIL", unit: "ea", unit_price_cents: 999, reorder_point: 5, initial_on_hand_quantity: 50, is_low_stock: true }, as: GeneralManager, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_INVALID_REQUEST (client-supplied computed field rejected)"

      - name: entity_fk_child_scoped_to_parent
        claim_type: parent_relationships
        grounds:
          - "entities.Pump.fields.site_id"
          - "endpoints.GET /sites/{id}/pumps"
        distinguishing_aspect: "A pump created under site A appears in site A's list and not in site B's; cross-site reads by pump id are scoped (GET /pumps/{id} returns the pump regardless, but site-scoped lists are disjoint)."
        test_recipe:
          setup: ["Two sites; pump under site A"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site A5", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_a: "$.data.id" } }
            - { call: "POST /sites", payload: { name: "Site B5", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_b: "$.data.id" } }
            - { call: "POST /sites/${site_a}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
          trigger:
            - { call: "GET /sites/${site_a}/pumps", payload: {}, as: GeneralManager }
            - { call: "GET /sites/${site_b}/pumps", payload: {}, as: GeneralManager }
          assert:
            - "site A pumps list contains exactly the created pump (total_count 1)"
            - "site B pumps list is empty (total_count 0)"

  # =====================================================================
  # Section: state_machines
  # =====================================================================
  - section: state_machines
    instances:
      - name: sm_initial_states_on_create
        claim_type: initial_state
        grounds:
          - "state_machines.FuelSale"
          - "state_machines.PurchaseOrder"
          - "state_machines.FleetContract"
          - "state_machines.ServiceQueueTicket"
        distinguishing_aspect: "Newly created entities start in their declared initial states: FuelSale AUTHORIZED/UNPAID, PurchaseOrder DRAFT, FleetContract PENDING, ServiceQueueTicket QUEUED/UNPAID."
        test_recipe:
          setup: ["Site with diesel tank, pump, register, OPEN shift; fleet; vendor; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site S1", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DIESEL", capacity_gallons: 20000, reorder_threshold_gallons: 3000, safety_stock_gallons: 1500, daily_usage_gallons: 950, lead_time_days: 4, initial_gallons: 8500, rack_price_cents_per_gallon_4dp: 2.7000 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 50000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/vendors", payload: { name: "Parts R Us", category: "GENERAL" }, as: GeneralManager, captures: { vendor_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c_status: "$.data.status" } }
            - { call: "POST /sites/${site_id}/purchase-orders", payload: { vendor_id: "${vendor_id}", lines: [ { sku: "FILTER-X", quantity: 5, unit_price_cents: 3000 } ] }, as: GeneralManager, captures: { po_status: "$.data.status" } }
            - { call: "POST /sites/${site_id}/service-tickets", payload: { service_type: "LAUNDRY", shift_id: "${shift_id}" }, as: Cashier, as_user_id: "cash-1", captures: { t_status: "$.data.status", t_pay: "$.data.payment_status", t_pos: "$.data.queue_position" } }
          assert:
            - "contract status == PENDING; PO status == DRAFT; ticket status == QUEUED with payment_status UNPAID and queue_position == 1"

      - name: sm_finalize_from_authorized_invalid
        claim_type: invalid_transition
        grounds:
          - "state_machines.FuelSale"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "finalize from AUTHORIZED (never fueled) is an invalid transition -> ERR_INVALID_STATE; sale remains AUTHORIZED."
        test_recipe:
          setup: ["Site with diesel price 385, pump, register, OPEN shift; clock 2026-08-12T10:00:00Z; sale authorized"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site S2", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id", site_v: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/fuel-prices", payload: { fuel_type: "DIESEL", retail_cents_per_gallon: 385, effective_from: "2026-08-01T00:00:00Z", expected_site_version: "${site_v}" }, as: FuelDeskLead }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "RETAIL", fuel_type: "DIESEL", tender_type: "CASH", max_gallons: 10.0 }, as: Cashier, as_user_id: "cash-1", captures: { sale_id: "$.data.id" } }
          trigger:
            - { call: "POST /fuel-sales/${sale_id}/finalize", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /fuel-sales/${sale_id}", payload: {}, as: Cashier, as_user_id: "cash-1", captures: { st: "$.data.status" } }
          assert:
            - "err == ERR_INVALID_STATE (PENDING_FINALIZE is the only valid finalize source)"
            - "sale status remains AUTHORIZED"

      - name: sm_terminal_contract_locked
        claim_type: terminal_state_lockdown
        grounds:
          - "state_machines.FleetContract"
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A TERMINATED contract rejects every further transition: activate -> ERR_INVALID_STATE; contract stays TERMINATED."
        test_recipe:
          setup: ["Fleet with contract C-1 created and terminated"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 5000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /contracts/${c_id}/terminate", payload: {}, as: GeneralManager }
          trigger:
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: GeneralManager, captures: { err: "$.data.error_id" } }
            - { call: "GET /contracts/${c_id}", payload: {}, as: GeneralManager, captures: { st: "$.data.status" } }
          assert:
            - "err == ERR_INVALID_STATE"
            - "contract status remains TERMINATED"

      - name: sm_contract_suspend_resume_cycle
        claim_type: valid_transition
        grounds:
          - "state_machines.FleetContract.ACTIVE_to_SUSPENDED"
          - "state_machines.FleetContract.SUSPENDED_to_ACTIVE"
        distinguishing_aspect: "Contract supports the ACTIVE -> SUSPENDED -> ACTIVE cycle (cyclic machine); while SUSPENDED a contract sale authorize fails ERR_CONTRACT_NOT_ACTIVE and succeeds again after resume."
        test_recipe:
          setup: ["Site with diesel tank (rack 2.7000), pump, register, OPEN shift; fleet with ACTIVE contract C-1; clock 2026-08-12T10:00:00Z"]
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site S3", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/bulk-tanks", payload: { product_type: "DIESEL", capacity_gallons: 20000, reorder_threshold_gallons: 3000, safety_stock_gallons: 1500, daily_usage_gallons: 950, lead_time_days: 4, initial_gallons: 8500, rack_price_cents_per_gallon_4dp: 2.7000 }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/pumps", payload: { pump_number: 1, fuel_types: ["DIESEL"] }, as: FuelDeskLead, captures: { pump_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /fleet-accounts", payload: { name: "Fleet A", credit_limit_cents: 50000000, pricing_tier: "T1" }, as: GeneralManager, captures: { f_id: "$.data.id" } }
            - { call: "POST /fleet-accounts/${f_id}/contracts", payload: { contract_code: "C-1", pricing_tier: "T1", discount_per_gallon_off: 0.0, applicable_fuel_types: ["DIESEL"], effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: GeneralManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /contracts/${c_id}/activate", payload: {}, as: GeneralManager }
          trigger:
            - { call: "POST /contracts/${c_id}/suspend", payload: {}, as: GeneralManager, captures: { st1: "$.data.status" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c_id}", max_gallons: 50.0 }, as: Cashier, as_user_id: "cash-1", captures: { err: "$.data.error_id" } }
            - { call: "POST /contracts/${c_id}/resume", payload: {}, as: GeneralManager, captures: { st2: "$.data.status" } }
            - { call: "POST /sites/${site_id}/fuel-sales", payload: { pump_id: "${pump_id}", shift_id: "${shift_id}", pricing_mode: "CONTRACT", fuel_type: "DIESEL", tender_type: "FLEET_BILLING", fleet_account_id: "${f_id}", contract_id: "${c_id}", max_gallons: 50.0 }, as: Cashier, as_user_id: "cash-1", captures: { quote: "$.data.authorized_quote_cents_per_gallon" } }
          assert:
            - "suspend -> SUSPENDED; authorize while suspended -> ERR_CONTRACT_NOT_ACTIVE"
            - "resume -> ACTIVE (cycle closed); authorize succeeds with quote 283"

      - name: sm_work_order_vendor_loop_invoice
        claim_type: side_effect_execution
        grounds:
          - "state_machines.WorkOrder.IN_PROGRESS_to_WAITING_VENDOR"
          - "state_machines.WorkOrder.WAITING_VENDOR_to_IN_PROGRESS"
          - "calculations.shop_invoice_total"
        distinguishing_aspect: "WorkOrder loops IN_PROGRESS -> WAITING_VENDOR -> IN_PROGRESS (cyclic) and completes with an exactly computed invoice: parts 87599 + labor 18750 + env 300 + supplies 2628 = 109277; bay freed at complete; cash close posts 109277 to the shift and flips register posture to NEEDS_DROP."
        test_recipe:
          setup:
            - "Site; stock TIRE-STEER (41500 cents, on_hand 10, reorder 2) and FILTER-Y (4599 cents, on_hand 10, reorder 2); technician rate 12500; bay 1; register float 20000 with OPEN shift; clock 2026-08-12T10:00:00Z"
            - "WorkOrder advanced to IN_PROGRESS"
          setup_api_calls:
            - { call: "POST /sites", payload: { name: "Site S4", parking_total_spaces: 60, parking_paid_capacity: 2, shower_units_count: 1, laundry_machines_count: 1 }, as: GeneralManager, captures: { site_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "TIRE-STEER", name: "Steer tire", category: "SHOP_PART", unit: "ea", unit_price_cents: 41500, reorder_point: 2, initial_on_hand_quantity: 10 }, as: GeneralManager, captures: { tire_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/stock-items", payload: { sku: "FILTER-Y", name: "Filter Y", category: "SHOP_PART", unit: "ea", unit_price_cents: 4599, reorder_point: 2, initial_on_hand_quantity: 10 }, as: GeneralManager, captures: { filter_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/technicians", payload: { name: "Tech One", hourly_rate_cents: 12500 }, as: GeneralManager, captures: { tech_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/bays", payload: { bay_number: 1 }, as: GeneralManager, captures: { bay_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/registers", payload: { register_code: "R1", float_cents: 20000 }, as: GeneralManager, captures: { reg_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/shifts", payload: { register_id: "${reg_id}", cashier_user_id: "cash-1", shift_label: "DAY" }, as: ShiftManager, as_user_id: "sm-1", captures: { shift_id: "$.data.id" } }
            - { call: "POST /sites/${site_id}/work-orders", payload: { vehicle_plate: "TRK-1", complaint: "steering shake" }, as: Cashier, as_user_id: "cash-1", captures: { wo_id: "$.data.id" } }
            - { call: "POST /work-orders/${wo_id}/estimate", payload: { labor_hours_est: 2.0 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo_id}/approve-estimate", payload: {}, as: GeneralManager }
            - { call: "POST /work-orders/${wo_id}/schedule", payload: { bay_id: "${bay_id}", technician_id: "${tech_id}", scheduled_from: "2026-08-13T08:00:00Z", scheduled_to: "2026-08-13T10:00:00Z" }, as: GeneralManager }
            - { call: "POST /work-orders/${wo_id}/check-in", payload: {}, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo_id}/start-work", payload: {}, as: MaintenanceTech, as_user_id: "${tech_id}" }
          trigger:
            - { call: "POST /work-orders/${wo_id}/parts", payload: { stock_item_id: "${tire_id}", quantity: 2 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo_id}/parts", payload: { stock_item_id: "${filter_id}", quantity: 1 }, as: MaintenanceTech, as_user_id: "${tech_id}" }
            - { call: "POST /work-orders/${wo_id}/send-to-vendor", payload: { vendor_name: "Alignment Co", reason: "alignment rack down" }, as: MaintenanceTech, as_user_id: "${tech_id}", captures: { st_vendor: "$.data.status" } }
            - { call: "POST /work-orders/${wo_id}/return-from-vendor", payload: {}, as: MaintenanceTech, as_user_id: "${tech_id}", captures: { st_back: "$.data.status" } }
            - { call: "POST /work-orders/${wo_id}/complete-work", payload: { labor_hours_actual: 1.5 }, as: MaintenanceTech, as_user_id: "${tech_id}", captures: { parts_t: "$.data.parts_total_cents", labor_t: "$.data.labor_total_cents", env_t: "$.data.environmental_fee_cents", sup_t: "$.data.shop_supplies_cents", inv_t: "$.data.invoice_total_cents" } }
