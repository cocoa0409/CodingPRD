  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_institution_version_rejected_and_the_parent_version_climbs_per_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[application-create-stale-institution]
          - errors.ERR_STALE_INSTITUTION_VERSION
          - endpoints[POST /cdfi/institutions/{institution_id}/certification-applications]
        distinguishing_aspect: |
          The token is the Institution's version, not the application's, and the only thing wrong
          with the rejected request is that a board seat was added after the client's read: the
          412 ERR_STALE_INSTITUTION_VERSION carries no state or business defect. The corner also
          pins WHICH writes move that version - approving a target market recomputes
          accountability_score WITHOUT incrementing Institution.version, while adding a seat and
          creating an application each increment it, so the institution ends at version 3 after
          exactly two version-bumping writes.
        test_recipe:
          setup:
            - "One institution at version 1 with an APPROVED INVESTMENT_AREA market."
            - "One ACTIVE representing governing seat added AFTER the version 1 read, taking the institution to version 2 and accountability_score to 1.0000."
          setup_api_calls:
            - call: "POST /cdfi/institutions"
              payload: { legal_name: "Harborline Community Fund", ein: "210000053", entity_type: "LOAN_FUND", primary_mission_statement: "Primary mission of community development finance for underserved households and small businesses.", asset_size_cents: 250000000, reserve_method: "MIGRATION_ANALYSIS", loss_reserve_balance_cents: 0 }
              as: InstitutionOfficer
              captures: { inst_id: $.data.id, v_read: $.data.version }
            - call: "POST /cdfi/institutions/${inst_id}/target-markets"
              payload: { market_type: "INVESTMENT_AREA", name: "South Bronx Investment Area", census_tract_codes: ["36005010100"] }
              as: InstitutionOfficer
              as_user_id: "${inst_id}"
              captures: { tm_id: $.data.id }
            - call: "POST /cdfi/target-markets/${tm_id}/approve"
              payload: {}
              as: CertificationReviewer
              as_user_id: "rev-1"
            - call: "GET /cdfi/institutions/${inst_id}"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "ops-1"
              captures: { v_after_approve: $.data.version }
            - call: "POST /cdfi/institutions/${inst_id}/board-seats"
              payload: { structure: "GOVERNING_BOARD", holder_name: "R. Alvarez", represents_target_market: true, target_market_id: "${tm_id}" }
