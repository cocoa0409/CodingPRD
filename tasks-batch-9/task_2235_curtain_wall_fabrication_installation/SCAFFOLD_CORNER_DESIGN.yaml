    - endpoints[POST /shop-drawing-submittals/{id}/reopen-review]
    - state_machines.ShopDrawingSubmittal.APPROVED_AS_NOTED_to_UNDER_REVIEW
    - validations[priority=72]
    - entities.ShopDrawingSubmittal.fields.open_notes_count
    distinguishing_aspect: 'The reopen edge exists only for APPROVED_AS_NOTED submittals that still carry notes: it succeeds
      while open_notes_count is 2, is refused with ERR_SEALER_CANNOT_REVIEW when the sealer attempts it, and is refused
      with ERR_INVALID_STATE once close-notes has burned the count to 0 - which is what keeps a fully closed-out review
      from being reopened.'
