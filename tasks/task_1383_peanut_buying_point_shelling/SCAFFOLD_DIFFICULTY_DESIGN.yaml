            - { call: "POST /buying-points/aflatoxin-certificates/${certB}/confirm", payload: {}, as: LabTechnician, as_user_id: lab-2 }
            - call: "POST /buying-points/storage-receipts"
              payload: { load_id: "${loadB}", warehouse_id: "${whg}" }
              as: BuyingPointAdmin
              captures: { rcptB: $.data.id }
            - { call: "POST /buying-points/loan-pledges", payload: { grower_id: "${g1}", storage_receipt_id: "${rcptA}", pledged_tons: 25.0, maturity_date: "2026-12-01T00:00:00Z" }, as: Grower, as_user_id: "${g1}" }
            - call: "POST /buying-points/sheller-contracts"
              payload: { buying_point_id: "${bp}", sheller_ref: "sheller-acme", total_units_tons: 20.0, price_per_ton_cents: 61000, accepts_segregated: false, window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: BuyingPointAdmin
              captures: { ct: $.data.id }
            - { call: "POST /buying-points/sheller-contracts/${ct}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 20.0, dock_window_start: "2026-09-10T08:00:00Z", dock_window_end: "2026-09-10T12:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { dc: $.data.id, dc_v: $.data.version }
          trigger:
            - { call: "POST /buying-points/delivery-calls/${dc}/allocate", payload: { expected_delivery_call_version: "${dc_v}" }, as: BuyingPointAdmin }
            - call: "GET /buying-points/allocation-lines"
              payload: { delivery_call_id: "${dc}" }
              as: BuyingPointAdmin
              captures: { ln_rcpt: "$.data[0].storage_receipt_id", ln_tons: "$.data[0].allocated_tons" }
          assert:
            - "Exactly one AllocationLine exists for call ${dc}"
            - "AllocationLine.storage_receipt_id == ${rcptB} — the FIFO-earlier receipt ${rcptA} was skipped because its status is PLEDGED (cross-entity state gate from LoanPledge), not because of any ordering change"
            - "AllocationLine.allocated_tons == 20.0 (second receipt covered the full request)"
            - "StorageReceipt.${rcptA}.status == PLEDGED and tons_remaining == 25.0 (untouched by allocation)"
            - "Warehouse.${whg}.reserved_tons == 20"

      - name: load_create_blocked_when_grower_suspended
        grounds:
          - state_machines.Grower
          - validations[priority=6]
          - errors[ERR_GROWER_SUSPENDED]
        distinguishing_aspect: |
          Entity pair FarmerStockLoad x Grower (distinct from the DeliveryCall
          x StorageReceipt pair): load creation consults the Grower's status,
          and SUSPENDED rejects creation for BOTH the Grower role and the
          BuyingPointAdmin role — the gate lives on the related entity, not
          the caller's privileges.
        test_recipe:
          setup:
            - "Foundation (schedule ACTIVE, WH-G 2000); grower G1 ACTIVE, then administratively suspended"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
