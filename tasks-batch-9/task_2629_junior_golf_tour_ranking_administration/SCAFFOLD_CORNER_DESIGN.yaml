  # =========================================================================
  # §1.9.7  From Table 7 (RBAC, role_model segregation_of_duties)
  # =========================================================================
  - section: rbac
    instances:

      - name: a_missing_or_unknown_role_header_is_unauthenticated
        claim_type: denied_operations
        grounds:
          - validations.priority_1
          - errors.ERR_UNAUTHENTICATED
          - roles.Anonymous
        distinguishing_aspect: "Omitting X-Role, or sending a role name that §1.7 never declares, is ERR_UNAUTHENTICATED (401) - distinct from sending the declared role Anonymous, which is authenticated and reads the public schedule with 200."
        test_recipe:
          setup:
            - "One season exists so the read target resolves."
            - "The literal actor NO_ROLE_HEADER means the request carries no X-Role header at all; the literal Spectator is a role name absent from §1.7."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
          trigger:
            - { call: "GET /seasons/${season_id}", payload: {}, as: NO_ROLE_HEADER, captures: { e1: $.data.error_id } }
            - { call: "GET /seasons/${season_id}", payload: {}, as: Spectator, captures: { e2: $.data.error_id } }
            - { call: "GET /tournaments", payload: {}, as: Anonymous }
          assert:
            - "trigger 1: http_status == 401"
            - "${e1} == ERR_UNAUTHENTICATED"
            - "trigger 2: http_status == 401"
            - "${e2} == ERR_UNAUTHENTICATED"
            - "${e2} != ERR_UNAUTHORIZED"
            - "trigger 3: http_status == 200  (the declared role Anonymous is authenticated and the public schedule read succeeds)"

      - name: officiating_authority_is_exclusive_to_its_own_role
        claim_type: denied_operations
        grounds:
          - roles.ConductCommittee
          - roles.ChiefReferee
          - roles.TourAdmin
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Neither TourAdmin nor ChiefReferee may decide a conduct case, and ConductCommittee may not adjudicate a rules case; the adjudicate denial is returned even for a caseId that resolves to nothing, proving the role gate at priority 2 runs before the existence gate at priority 15."
        test_recipe:
          setup:
            - "One season, one VERIFIED U17 member m1, one tournament t1 and one UNDER_REVIEW conduct case cc1 filed by TourAdmin admin-1."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-10T00:00:00Z" }, as: Anonymous }
            - { call: "POST /seasons", payload: { name: "2026 Junior Tour", start_date: "2026-01-01", end_date: "2026-12-31", age_cutoff_date: "2026-08-31", ranking_window_start_date: "2026-01-01", assistance_budget_cents: 500000 }, as: TourAdmin, captures: { season_id: $.data.id } }
            - { call: "POST /members", payload: { season_id: "${season_id}", full_name: "Ava Stone", birth_date: "2010-05-04", state_code: "NC", guardian_email: "ava.guardian@example.com", handicap_index: 3.2, handicap_effective_date: "2026-07-15", handicap_source: "WHS_CLUB", publication_opt_in: true }, as: Anonymous, captures: { m1_id: $.data.id } }
            - { call: "POST /members/${m1_id}/verify-eligibility", payload: { decision: "VERIFIED" }, as: TourAdmin }
            - { call: "POST /tournaments", payload: { season_id: "${season_id}", name: "Carolina Regional U17", division: "U17", tier: "REGIONAL", start_date: "2026-09-10", end_date: "2026-09-11", entry_open_at: "2026-08-05T00:00:00Z", entry_close_at: "2026-09-01T00:00:00Z", withdrawal_deadline_at: "2026-09-05T00:00:00Z", field_size_limit: 4, max_handicap_index: 8.4, entry_fee_cents: 25000, round_count: 2, course_rating: 71.4, slope_rating: 128 }, as: TourAdmin, captures: { t1_id: $.data.id } }
            - { call: "POST /conduct-cases", payload: { member_id: "${m1_id}", tournament_id: "${t1_id}", subject_type: "PARENT", subject_name: "Peter Stone", incident_code: "COACHING_VIOLATION", narrative: "advice shouted from the gallery" }, as: TourAdmin, as_user_id: "admin-1", captures: { cc_id: $.data.id } }
          trigger:
            - { call: "POST /conduct-cases/${cc_id}/decide", payload: { decision: "SANCTIONED" }, as: TourAdmin, as_user_id: "admin-1", captures: { e1: $.data.error_id } }
            - { call: "POST /conduct-cases/${cc_id}/decide", payload: { decision: "SANCTIONED" }, as: ChiefReferee, as_user_id: "referee-nolan", captures: { e2: $.data.error_id } }
            - { call: "POST /rules-cases/00000000-0000-4000-8000-000000000000/adjudicate", payload: { decision: "DISMISSED" }, as: ConductCommittee, as_user_id: "cc-1", captures: { e3: $.data.error_id } }
            - { call: "POST /conduct-cases/${cc_id}/decide", payload: { decision: "SANCTIONED" }, as: ConductCommittee, as_user_id: "cc-1", captures: { cst: $.data.status, tier: $.data.sanction_tier } }
          assert:
            - "trigger 1: http_status == 403"
            - "${e1} == ERR_UNAUTHORIZED"
            - "trigger 2: http_status == 403"
            - "${e2} == ERR_UNAUTHORIZED"
            - "trigger 3: http_status == 403"
            - "${e3} == ERR_UNAUTHORIZED"
            - "${e3} != ERR_CASE_NOT_FOUND"
            - "trigger 4: http_status == 200"
            - "${cst} == SANCTIONED"
            - "${tier} == WARNING"

      - name: a_coach_may_read_the_schedule_but_never_write_competition_rows
        claim_type: denied_operations
        grounds:
          - roles.Coach
          - roles.Member
          - errors.ERR_UNAUTHORIZED
        distinguishing_aspect: "Coach is refused on POST /entries, POST /tournaments and even the administrative GET /entries list, yet succeeds on GET /tournaments - and Anonymous is refused on POST /entries too, so entry submission is confined to Member and TourAdmin."
        test_recipe:
          setup:
            - "One season, one VERIFIED U17 member m1 and one ENTRY_OPEN U17 tournament t1."
