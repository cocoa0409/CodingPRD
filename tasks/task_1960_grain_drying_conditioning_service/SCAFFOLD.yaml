  - { method: POST, path: "/grain-drying/damage-claims/{id}/pay", description: "Pay an ASSESSED claim: credit prepaid ledger, auto-apply waterfall, release lot", roles: [ElevatorManager], code: 200, input: [], output: DamageClaim, side_effects: ["ASSESSED -> PAID", "Customer.prepaid_balance_cents += assessed_liability_cents", "prepaid_waterfall_application to ISSUED invoices", "lot DAMAGE_HOLD -> DRIED"] }

