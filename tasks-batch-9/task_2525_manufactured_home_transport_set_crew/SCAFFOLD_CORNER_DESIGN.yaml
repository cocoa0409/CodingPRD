      - name: depart_and_arrive_on_arrived_leg_return_invalid_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.RouteLeg.terminal_states
          - errors[ERR_INVALID_STATE]
          - validations[priority=7]
        distinguishing_aspect: |
          ARRIVED is terminal for RouteLeg, so neither of the two triggers the
          machine knows (depart, arrive) is accepted from it: replaying depart is
          rejected as a backwards edge and replaying arrive is rejected as a
          repeat of a once-only action. Both return the same generic
          ERR_INVALID_STATE at priority 7, and neither re-fires the section
          transition, so the section stays DELIVERED exactly once.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "one Plant, one ACTIVE Hauler, a single-section AZ order whose section has been delivered (permit paid 16500 and ISSUED, leg departed and arrived)"
