    roles: [Regulator]
    code: 200
    input: [decision, "notes?"]
    output: AccessPlanRequest
    side_effects: ["on APPROVED: deficiency -> EXCUSED, reversed_penalty_cents += prior outstanding, evaluation.total_penalty_cents -= prior outstanding; decided_at = now; version += 1"]

  # --- MemberComplaint ---
  - method: POST
    path: "/network/complaints"
    description: "Member files a directory-error/access complaint against a listing; member identity from X-User-ID; listing must serve the member's region, not be REMOVED; 90-day filing window"
    roles: [Member]
    code: 201
    input: [listing_id, error_type, error_observed_date, description]
    output: MemberComplaint
    side_effects: ["status = OPEN; member_id = X-User-ID; filed_at = now"]
  - method: GET
    path: "/network/complaints"
    description: "List complaints (filtered-list FK reverse for member_id and listing_id)"
    roles: [NetworkManager, ComplianceOfficer, Regulator, ProviderRep, Member]
    code: 200
    input: ["member_id?", "listing_id?", "status?", "limit?", "offset?"]
    output: "MemberComplaint[]"
    side_effects: []
  - method: GET
    path: "/network/complaints/{id}"
    description: "Get one complaint"
    roles: [NetworkManager, ComplianceOfficer, Regulator, ProviderRep, Member]
    code: 200
    input: []
    output: MemberComplaint
    side_effects: []
  - method: POST
    path: "/network/complaints/{id}/adjudicate"
    description: "ComplianceOfficer confirms (spawns DirectoryCorrection, flags listing) or dismisses the complaint"
    roles: [ComplianceOfficer]
    code: 200
    input: [outcome, "notes?", "correction_changes?"]
    output: MemberComplaint
    side_effects: ["on CONFIRMED_ERROR: confirmed_at = now; spawn DirectoryCorrection(status=SUBMITTED, submitted_by_user_id='system:adjudication', sla_due_at = now + 72h); listing.has_confirmed_data_error = true"]

  # --- DirectoryCorrection ---
  - method: POST
    path: "/network/corrections"
    description: "Manually submit a directory correction (optionally linked to a CONFIRMED_ERROR complaint of the same listing)"
    roles: [NetworkManager]
    code: 201
    input: [listing_id, changes, "complaint_id?"]
    output: DirectoryCorrection
    side_effects: ["status = SUBMITTED; submitted_by_user_id = X-User-ID; sla_due_at = now + 72h"]
  - method: GET
    path: "/network/corrections"
    description: "List corrections (filtered-list FK reverse for listing_id and complaint_id)"
    roles: [NetworkManager, ComplianceOfficer, Regulator, ProviderRep, Member]
    code: 200
    input: ["listing_id?", "complaint_id?", "status?", "limit?", "offset?"]
    output: "DirectoryCorrection[]"
    side_effects: []
  - method: GET
    path: "/network/corrections/{id}"
    description: "Get one correction"
    roles: [NetworkManager, ComplianceOfficer, Regulator, ProviderRep, Member]
    code: 200
    input: []
    output: DirectoryCorrection
    side_effects: []
  - method: POST
    path: "/network/corrections/{id}/verify"
    description: "ComplianceOfficer verifies (applies changes, closes linked complaint, computes is_late) or rejects (approve=false); verifier must differ from submitter"
    roles: [ComplianceOfficer]
    code: 200
    input: ["approve?"]
    output: DirectoryCorrection
    side_effects: ["on verify: changes applied to listing (version += 1), verified_at = now, is_late computed vs sla_due_at, linked CONFIRMED_ERROR complaint -> CLOSED, listing.has_confirmed_data_error = false; correction.version += 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or role unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Caller role not permitted on this endpoint" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed identity mismatch: ProviderRep does not own the record's listing, or Member id unknown" }
  # --- request shape ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed payload, missing required field, invalid enum value, bad create-time date ordering (open<due<outreach_close, period_end>=period_start), or missing corrected_payload / correction_changes" }
  # --- not found (one per addressable entity) ---
  - { id: ERR_REGION_NOT_FOUND, http: 404, condition: "region id does not exist" }
  - { id: ERR_STANDARD_NOT_FOUND, http: 404, condition: "standard id does not exist" }
  - { id: ERR_PROVIDER_NOT_FOUND, http: 404, condition: "provider id does not exist" }
  - { id: ERR_LOCATION_NOT_FOUND, http: 404, condition: "location id does not exist" }
  - { id: ERR_LISTING_NOT_FOUND, http: 404, condition: "listing id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member id does not exist" }
  - { id: ERR_CYCLE_NOT_FOUND, http: 404, condition: "attestation cycle id does not exist" }
  - { id: ERR_ATTESTATION_RECORD_NOT_FOUND, http: 404, condition: "attestation record id does not exist" }
  - { id: ERR_PROBE_NOT_FOUND, http: 404, condition: "probe id does not exist" }
  - { id: ERR_EVALUATION_NOT_FOUND, http: 404, condition: "evaluation id does not exist" }
  - { id: ERR_DEFICIENCY_NOT_FOUND, http: 404, condition: "deficiency id does not exist" }
  - { id: ERR_ACCESS_PLAN_REQUEST_NOT_FOUND, http: 404, condition: "access plan request id does not exist" }
  - { id: ERR_COMPLAINT_NOT_FOUND, http: 404, condition: "complaint id does not exist" }
  - { id: ERR_CORRECTION_NOT_FOUND, http: 404, condition: "correction id does not exist" }
  # --- state ---
  - { id: ERR_PROVIDER_INVALID_TRANSITION, http: 409, condition: "PATCH providers to_status not allowed from current provider status" }
  - { id: ERR_PROVIDER_NOT_EFFECTIVE, http: 409, condition: "Operation requires provider.status == EFFECTIVE (publish, reinstate, clear-review)" }
  - { id: ERR_LISTING_INVALID_TRANSITION, http: 409, condition: "PATCH listings to_status/reason combination not allowed from current listing status (incl. manual reinstate of PROVIDER_SUSPENDED listings)" }
  - { id: ERR_LISTING_NOT_LISTED, http: 409, condition: "Probe create requires listing.status == LISTED" }
  - { id: ERR_LISTING_REMOVED, http: 409, condition: "Target listing is REMOVED (complaint filing, manual correction)" }
  - { id: ERR_LISTING_ATTESTATION_UNRESOLVED, http: 409, condition: "Reinstate from ATTESTATION_FAILURE requires an ATTESTED/CORRECTION_REQUESTED record with responded_at > suppressed_at" }
  - { id: ERR_LISTING_GHOST_UNRESOLVED, http: 409, condition: "Reinstate from GHOST_CONFIRMED requires a PASS probe with recorded_at > suppressed_at" }
  - { id: ERR_CYCLE_INVALID_STATE, http: 409, condition: "Cycle advance not allowed from current cycle status (or already CLOSED)" }
  - { id: ERR_RECORD_NOT_RESPONDABLE, http: 409, condition: "Record not in a respondable combination of (record.status, cycle.status)" }
  - { id: ERR_PROBE_INVALID_STATE, http: 409, condition: "Probe already RECORDED (terminal) or otherwise not SCHEDULED" }
  - { id: ERR_EVALUATION_INVALID_STATE, http: 409, condition: "Evaluation not OPEN for finalize" }
  - { id: ERR_UNRECORDED_PROBES_EXIST, http: 409, condition: "Finalize blocked: SCHEDULED probes with requested_date inside the measurement period exist" }
  - { id: ERR_DEFICIENCY_NOT_OPEN, http: 409, condition: "Deficiency must be OPEN to create a request or to approve one" }
  - { id: ERR_REQUEST_NOT_SUBMITTABLE, http: 409, condition: "Access plan request not in DRAFT or DENIED" }
  - { id: ERR_REQUEST_NOT_DECIDABLE, http: 409, condition: "Access plan request not SUBMITTED" }
  - { id: ERR_COMPLAINT_NOT_OPEN, http: 409, condition: "Complaint not OPEN for adjudication" }
  - { id: ERR_CORRECTION_NOT_VERIFIABLE, http: 409, condition: "Correction not SUBMITTED" }
  - { id: ERR_MEMBER_NOT_ENROLLED, http: 409, condition: "Member must be ENROLLED (disenroll, complaint filing)" }
  # --- temporal ---
  - { id: ERR_CYCLE_NOT_YET_ADVANCEABLE, http: 422, condition: "Clock date has not reached the gate date for the next cycle transition (open_date / due_date / outreach_close_date)" }
  - { id: ERR_COMPLAINT_WINDOW_EXPIRED, http: 422, condition: "filed_date - error_observed_date > 90 days, or error_observed_date in the future" }
  - { id: ERR_PROBE_DATE_ORDER, http: 422, condition: "offered_appointment_date < requested_date, or requested_date after current clock date" }
  - { id: ERR_EXCUSE_WINDOW_INVALID, http: 422, condition: "excuse_through_date < excuse_start_date, or excuse_start_date before current clock date" }
  # --- referential ---
  - { id: ERR_LOCATION_PROVIDER_MISMATCH, http: 422, condition: "listing.location_id belongs to a different provider than listing.provider_id" }
  - { id: ERR_LISTING_NOT_IN_MEMBER_REGION, http: 422, condition: "Complaint listing's location region differs from the filing member's region" }
  - { id: ERR_CORRECTION_LISTING_MISMATCH, http: 422, condition: "correction.complaint_id references a complaint whose listing_id differs" }
  - { id: ERR_SPECIALTY_STANDARD_MISSING, http: 422, condition: "No NetworkStandard for (listing.specialty, location region's geo_class) at publish" }
  # --- constraint ---
  - { id: ERR_NPI_DUPLICATE, http: 409, condition: "npi already registered" }
  - { id: ERR_REGION_DUPLICATE, http: 409, condition: "county_fips already registered" }
  - { id: ERR_MEMBER_REF_DUPLICATE, http: 409, condition: "member_ref already registered" }
  - { id: ERR_STANDARD_DUPLICATE, http: 409, condition: "(specialty, geo_class) standard already exists" }
  - { id: ERR_LISTING_ALREADY_LISTED, http: 409, condition: "A LISTED listing already exists for (location_id, specialty)" }
  - { id: ERR_CYCLE_WINDOW_OVERLAP, http: 409, condition: "New cycle window [open_date, outreach_close_date) overlaps an existing cycle window (half-open: adjacency allowed)" }
  - { id: ERR_CYCLE_ALREADY_ACTIVE, http: 409, condition: "Another cycle is OPEN or OUTREACH when advancing to OPEN" }
  - { id: ERR_EXCUSE_WINDOW_OVERLAP, http: 409, condition: "Approving would overlap another APPROVED request's excuse window for the same deficiency (closed interval: touching endpoints overlap)" }
  - { id: ERR_EVALUATION_ALREADY_OPEN, http: 409, condition: "Another AdequacyEvaluation is OPEN" }
  # --- safety ---
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Correction verifier X-User-ID equals correction.submitted_by_user_id" }
  # --- OCC (412) ---
  - { id: ERR_STALE_STANDARD_VERSION, http: 412, condition: "expected_standard_version does not match current NetworkStandard.version" }
  - { id: ERR_STALE_LOCATION_VERSION, http: 412, condition: "expected_location_version does not match current PracticeLocation.version" }
  - { id: ERR_STALE_LISTING_VERSION, http: 412, condition: "expected_listing_version does not match current DirectoryListing.version" }
  - { id: ERR_STALE_DEFICIENCY_VERSION, http: 412, condition: "expected_deficiency_version does not match current DeficiencyRecord.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: NetworkManager
    description: "Health-plan network management operator: owns regions, standards, provider loads, locations, listings, attestation cycles, probes, evaluations, access-plan filing, and manual corrections"
    identity: "opaque"
    exclusive_operations:
      - "POST /network/regions"
      - "POST /network/standards ; PUT /network/standards/{id}"
      - "POST /network/providers ; PATCH /network/providers/{id}"
      - "POST /network/locations ; PATCH /network/locations/{id}"
      - "POST /network/listings ; POST /network/listings/{id}/publish ; PATCH /network/listings/{id}"
      - "POST /network/members ; POST /network/members/{id}/disenroll"
      - "POST /network/attestation-cycles ; POST /network/attestation-cycles/{id}/advance"
      - "POST /network/probes ; POST /network/probes/{id}/record"
      - "POST /network/evaluations ; POST /network/evaluations/{id}/finalize"
      - "POST /network/deficiencies/{id}/access-plan-requests ; POST /network/access-plan-requests/{id}/submit"
      - "POST /network/corrections"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Directory-integrity adjudicator: decides complaints and verifies corrections; must not verify a correction they submitted (segregation of duties)"
    identity: "opaque"
    exclusive_operations:
      - "POST /network/complaints/{id}/adjudicate"
      - "POST /network/corrections/{id}/verify"
    shared_operations:
      - "All GET endpoints (incl. GET /network/evaluations/{id}/penalty-summary)"
  - name: Regulator
    description: "State regulator reviewer: decides submitted access plan (exception) requests and reads penalty exposure"
    identity: "opaque"
    exclusive_operations:
      - "POST /network/access-plan-requests/{id}/decide"
    shared_operations:
      - "All GET endpoints (incl. GET /network/evaluations/{id}/penalty-summary)"
  - name: ProviderRep
    description: "Provider office representative; X-User-ID equals the Provider.id they represent; responds to attestation records for that provider's listings only"
    identity: "entity_backed:Provider"
    exclusive_operations:
      - "POST /network/attestation-records/{id}/respond"
    shared_operations:
      - "All GET endpoints"
  - name: Member
    description: "Enrolled plan member; X-User-ID equals the Member.id; files complaints against listings serving their region"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /network/complaints"
    shared_operations:
      - "All GET endpoints"
