            - "GET /patients?insurance_plan_id=${plan_id} returns meta.total_count == 1 with data[0].id == ${insured_id}"

      - name: prescriber_attestation_verifies_despite_a_mismatched_claimed_npi
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/prescriptions/{id}/prescriber-attest
          - validations[priority=170]
          - errors.ERR_PRESCRIBER_RECORD_MISMATCH
          - roles.Prescriber
        distinguishing_aspect: >-
          Two action endpoints reach the same VERIFIED state through different rule sets: /verify is
          refused with ERR_PRESCRIBER_RECORD_MISMATCH because the paper Rx claims NPI 9999999999,
          while /prescriber-attest skips the npi/license comparison entirely and verifies, storing the
          attestation statement as verification_note.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; prescriber Dr Iris Vance with npi 1234567893 in CA; self-pay patient."
            - "A prescription whose prescriber_npi_claimed is 9999999999 (a transcription error) but which points at the correct prescriber_id."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
