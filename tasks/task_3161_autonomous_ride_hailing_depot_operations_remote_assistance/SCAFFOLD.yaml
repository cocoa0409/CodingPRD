    output: IncidentReport[]
    side_effects: []
  - method: POST
    path: "/fleet/incident-reports/{incidentId}/begin-review"
    description: "Move a report into review (FILED to UNDER_REVIEW)"
    roles: [SafetyReviewer]
    code: 200
    input: []
    output: IncidentReport
    side_effects:
      - "status=UNDER_REVIEW"
      - "territory.total_severe_incidents recomputed per §1.3 territory_total_severe_incidents"
      - "increments IncidentReport.version by 1"
  - method: POST
    path: "/fleet/incident-reports/{incidentId}/close"
    description: "Close a reviewed report (UNDER_REVIEW to CLOSED)"
    roles: [SafetyReviewer]
    code: 200
    input: []
    output: IncidentReport
    side_effects: ["status=CLOSED", "increments IncidentReport.version by 1"]
  - method: POST
    path: "/fleet/incident-reports/{incidentId}/void"
    description: "Void a filed report (FILED to VOIDED)"
