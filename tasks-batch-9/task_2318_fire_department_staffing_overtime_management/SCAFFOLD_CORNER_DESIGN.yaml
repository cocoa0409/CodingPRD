              as: StaffingOfficer
          trigger:
            - call: "POST /fire-ops/duty-shifts/${sh80}/staffing-run"
              payload: {}
              as: StaffingOfficer
          assert:
            - "${off80_exp} == \"2026-08-01T02:00:00Z\" — OFFER_RESPONSE_WINDOW_MINUTES is 120"
            - "OvertimeOffer.${off80}.status == \"EXPIRED\" — the sweep is inclusive at expires_at == clock"
            - "Vacancy.${vac80}.status == \"OPEN\" and filled_by_assignment_id == null"
            - "Firefighter.${ff80}.voluntary_ot_hours_charged == 24, ot_pass_count == 1, pending_offer_count == 0, roster_standing == \"AVAILABLE\""
            - "Station.${st80}.ot_committed_cents == 0 and budget_posture == \"WITHIN\""
            - "DutyShift.${sh80}.status == \"HIRING\", open_vacancy_count == 1, ops_run_index == 1"

