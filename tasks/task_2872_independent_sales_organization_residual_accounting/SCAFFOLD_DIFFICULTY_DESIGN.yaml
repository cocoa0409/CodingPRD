            - "AgentStatement.${st_x}.direct_residual_cents == 32 and AgentStatement.${st_y}.direct_residual_cents == 34"
            - "AgentStatement.${st_x}.minimum_true_up_cents == 0   # 125 * 20 == 2500 exactly, the >= comparison bills nothing"
            - "AgentStatement.${st_y}.minimum_true_up_cents == 5   # round_half_up(20 * 0.45 * 0.5) == 5, not 4"
