            - { call: "POST /hospitality-builds", payload: { event_id: "${ev1}", zone_code: "ZONE_A", service_window_start: "2027-02-01T09:00:00.000Z", service_window_end: "2027-02-01T20:00:00.000Z", space_units: 30, catering_covers: 20, staff_count: 5, build_cost_cents: 120000, catering_cost_cents: 60000, staffing_cost_cents: 40000 }, as: OperationsManager, as_user_id: u_ops, captures: { hb1: "$.data.id" } }
