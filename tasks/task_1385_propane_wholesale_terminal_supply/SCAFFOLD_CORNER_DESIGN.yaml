        claim_type: violation_to_error
        grounds: ["validations[priority=5]", "errors[ERR_REFERENCED_NOT_FOUND]"]
        distinguishing_aspect: "A body foreign key (freight_zone_id) that does not resolve yields 422 ERR_REFERENCED_NOT_FOUND, distinct from path-id 404 ERR_NOT_FOUND."
