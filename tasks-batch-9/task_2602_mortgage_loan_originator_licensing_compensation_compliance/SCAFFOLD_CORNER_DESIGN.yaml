          rationale: "The named §1.8 instance asserts ERR_CE_HOURS_INSUFFICIENT at seven hours and the 200 at exactly eight, covering the >= boundary in both directions."

  # ------------------------------------------------------------------------------
  # 7. RBAC (guide Table 7)
  # ------------------------------------------------------------------------------
  # Table 7 has no fixed claim_type vocabulary; the row labels of the section are used
  # as claim_type values: exclusive_operations (a role can perform its own exclusive
  # writes), forbidden_operations (a role cannot perform another role's exclusive
  # writes -> ERR_ROLE_NOT_PERMITTED 403), shared_operations (every role can read the
  # shared surface) and segregation_of_duties (the role_model row: the same X-User-ID
  # cannot occupy both sides of an approval).
  - section: rbac
    instances:
      - name: originator_and_admin_cannot_close_a_loan_only_loan_operations_can
        claim_type: forbidden_operations
        grounds:
          - roles.LoanOperations.exclusive_operations
          - roles.Originator.exclusive_operations
          - validations[priority=3]
          - errors[ERR_ROLE_NOT_PERMITTED]
        distinguishing_aspect: |
          POST /loan-applications/{id}/close is exclusive to LoanOperations. The Originator who
          took and locked the loan, the LicensingAnalyst who licensed him and the PlatformAdmin
          who owns the clock are all refused 403 ERR_ROLE_NOT_PERMITTED, and none of the three
          refusals mutates the loan; ops-1 then closes it and the commission accrues at 52500
          cents (105 bps of 5000000, volume tier disabled).
        test_recipe:
          setup:
            - "Originator 2200001 with an ACTIVE sponsored CA licence and an ACTIVE 105 bps plan
               assigned, plus one CA loan LOCKED at 5000000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_id}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_id: $.data.id }
            - call: "POST /license-registrations/${lic_id}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_v: $.data.version }
            - call: "POST /license-registrations/${lic_id}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-0001", effective_at: "2026-07-01T00:00:00Z", expected_license_registration_version: "${lic_v}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compensation-plans"
              payload: { plan_name: "Retail Base 2026", base_basis_points: 105, min_fee_cents: 0, max_fee_cents: 5000000, volume_tier_enabled: false, concession_absorption_enabled: false }
              as: CompensationDesigner
              as_user_id: "designer-1"
              captures: { plan_id: $.data.id }
            - call: "POST /compensation-plans/${plan_id}/variables"
              payload: { variable_type: "LOAN_VOLUME_UNITS", weight_pct: 100, justification_text: "Closed unit volume is a permissible compensation variable and is not a term of the transaction." }
              as: CompensationDesigner
              as_user_id: "designer-1"
            - call: "POST /compensation-plans/${plan_id}/approvals"
              payload: { decision: "APPROVE", note: "Reg Z review complete." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /originators/${orig_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { orig_v: $.data.version }
            - call: "POST /originators/${orig_id}/compensation-plan-assignments"
              payload: { compensation_plan_id: "${plan_id}", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z", expected_originator_version: "${orig_v}" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_id}", state_code: "CA", borrower_reference: "BR-9701", product_type: "FIXED_30", requested_amount_cents: 5000000, par_rate_bps: 650 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { loan1: $.data.id }
            - call: "POST /loan-applications/${loan1}/lock"
              payload: { note_rate_bps: 650, locked_amount_cents: 5000000 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { lk_st: $.data.status }
          trigger:
            - call: "POST /loan-applications/${loan1}/close"
              payload: { funded_amount_cents: 5000000, funded_at: "2026-08-01T00:00:00Z", lender_paid_comp_cents: 52500, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: Originator
              as_user_id: "${orig_id}"
              captures: { err1: $.data.error_id }
            - call: "POST /loan-applications/${loan1}/close"
              payload: { funded_amount_cents: 5000000, funded_at: "2026-08-01T00:00:00Z", lender_paid_comp_cents: 52500, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { err2: $.data.error_id }
            - call: "POST /loan-applications/${loan1}/close"
              payload: { funded_amount_cents: 5000000, funded_at: "2026-08-01T00:00:00Z", lender_paid_comp_cents: 52500, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { err3: $.data.error_id }
            - call: "GET /loan-applications/${loan1}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { mid_st: $.data.status, mid_cs: $.data.compensation_status }
            - call: "POST /loan-applications/${loan1}/close"
              payload: { funded_amount_cents: 5000000, funded_at: "2026-08-01T00:00:00Z", lender_paid_comp_cents: 52500, borrower_paid_comp_cents: 0, file_quality_score: 95, hours_worked_pct: 80 }
              as: LoanOperations
              as_user_id: "ops-1"
              captures: { st: $.data.status, cs: $.data.compensation_status }
            - call: "GET /compensation-records"
              payload: { loan_application_id: "${loan1}" }
              as: LoanOperations
              as_user_id: "ops-1"
              captures: { rec_acc: "$.data[0].accrued_cents", rec_var: "$.data[0].variant", rec_total: $.total_count }
          assert:
            - "${lk_st} == LOCKED"
            - "HTTP status is 403 for the Originator, and ${err1} == ERR_ROLE_NOT_PERMITTED"
            - "HTTP status is 403 for the PlatformAdmin, and ${err2} == ERR_ROLE_NOT_PERMITTED"
            - "HTTP status is 403 for the LicensingAnalyst, and ${err3} == ERR_ROLE_NOT_PERMITTED"
            - "${mid_st} == LOCKED and ${mid_cs} == NOT_APPLICABLE (no refusal mutated the loan)"
            - "HTTP status is 200 for LoanOperations, ${st} == FUNDED, ${cs} == ACCRUED"
            - "${rec_total} == 1, ${rec_var} == FINAL, ${rec_acc} == 52500"

      - name: originator_locking_another_originators_loan_returns_identity_mismatch
        claim_type: identity_ownership
        grounds:
          - roles.Originator.identity
          - validations[priority=4]
          - errors[ERR_ORIGINATOR_IDENTITY_MISMATCH]
        distinguishing_aspect: |
          The Originator role is entity_backed, so holding the role is not enough: X-User-ID must
          equal the Originator the request acts on. Originator B is fully licensed and sponsored
          in CA, yet locking A's loan is 403 ERR_ORIGINATOR_IDENTITY_MISMATCH (the body-side check
          also fires when B posts an application carrying A's originator_id), while the SHARED
          read of the same loan by B is a 200 - ownership gates writes, not reads.
        test_recipe:
          setup:
            - "Two originators: A (2200001) and B (2200002), each with an ACTIVE sponsored CA
               licence. One CA loan owned by A in status TAKEN."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_a: $.data.id }
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200002", legal_name: "Blake Rowe", hire_date: "2024-03-01T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_b: $.data.id }
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_a}", state_code: "CA", license_number: "CA-DFPI-70001", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_a: $.data.id }
            - call: "POST /license-registrations/${lic_a}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_a_v: $.data.version }
            - call: "POST /license-registrations/${lic_a}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-0001", effective_at: "2026-07-01T00:00:00Z", expected_license_registration_version: "${lic_a_v}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /license-registrations"
              payload: { originator_id: "${orig_b}", state_code: "CA", license_number: "CA-DFPI-70002", issue_date: "2026-01-02T00:00:00Z", expiration_date: "2027-01-31T00:00:00Z", renewal_window_opens_at: "2026-11-01T00:00:00Z", ce_reporting_year: 2026 }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_b: $.data.id }
            - call: "POST /license-registrations/${lic_b}/activations"
              payload: {}
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { lic_b_v: $.data.version }
            - call: "POST /license-registrations/${lic_b}/sponsorship-transfers"
              payload: { sponsoring_institution_code: "INST-0001", effective_at: "2026-07-01T00:00:00Z", expected_license_registration_version: "${lic_b_v}" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_a}", state_code: "CA", borrower_reference: "BR-9801", product_type: "FIXED_30", requested_amount_cents: 5000000, par_rate_bps: 650 }
              as: Originator
              as_user_id: "${orig_a}"
              captures: { loan_a: $.data.id }
          trigger:
            - call: "POST /loan-applications/${loan_a}/lock"
              payload: { note_rate_bps: 650, locked_amount_cents: 5000000 }
              as: Originator
              as_user_id: "${orig_b}"
              captures: { err1: $.data.error_id }
            - call: "POST /loan-applications"
              payload: { originator_id: "${orig_a}", state_code: "CA", borrower_reference: "BR-9802", product_type: "FIXED_30", requested_amount_cents: 4000000, par_rate_bps: 650 }
              as: Originator
              as_user_id: "${orig_b}"
              captures: { err2: $.data.error_id }
            - call: "POST /loan-applications/${loan_a}/pricing-exceptions"
              payload: { requested_rate_bps: 600, concession_cents: 50000, reason_code: "COMPETITIVE_MATCH", justification_text: "Another originator attempting to concede on a file that is not his own." }
              as: Originator
              as_user_id: "${orig_b}"
              captures: { err3: $.data.error_id }
            - call: "GET /loan-applications/${loan_a}"
              payload: {}
              as: Originator
              as_user_id: "${orig_b}"
              captures: { read_st: $.data.status, read_owner: $.data.originator_id }
