# =============================================================================
# Task 1578: Pump & Valve Repair / Rebuild Center — seed tables
# =============================================================================

scenario: |
  Pump & Valve Repair / Rebuild Center (Flowserve style service center): equipment
  intake & nameplate capture, teardown inspection report & quote approval, parts
  obsolescence & aftermarket substitution, performance test curve verification,
  safety-relief valve certification & tagging, customer rotable spare pool,
  turnaround/shutdown surge planning, warranty & re-repair analysis

domain_name: pump-valve-repair
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat            # peer entities joined by FK references; no URL nesting except sub-resource reads
  state_machine_shape: cyclic      # RepairOrder IN_REPAIR<->IN_TEST rework loop; Quote negotiation fork
  relationship_patterns:
    - one_to_many                  # Customer->Asset/RepairOrder/PoolUnit; RepairOrder->Quote/TestRun/etc.
    - self_referential             # Part.superseded_by_id (obsolescence chain); RepairOrder.warranty_parent_ro_id
    - cross_aggregate              # Quote.capacity_window_id; PoolUnit.reserved_for_ro_id
  role_model: segregation_of_duties  # SRV assembler (Technician) may not certify (Certifier) the same job
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer organization name" }
      - { name: account_number, type: string, source: input, description: "Billing account number; unique across customers" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum approved quote total (cents); approval rejected when total exceeds it" }
      - { name: warranty_terms_days, type: integer, source: input, description: "Warranty coverage length in days from prior CLOSED repair" }
      - { name: pool_program, type: boolean, source: input, default: false, description: "Customer participates in rotable spare pool program" }
      - { name: pool_available_count, type: integer, source: computed, description: "Count of PoolUnit rows for this customer with pool_status IN {IN_POOL, RESERVED}" }

  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: serial_number, type: string, source: input, description: "Nameplate serial; unique within customer" }
      - { name: equipment_class, type: enum, source: input, description: "PUMP | GENERAL_VALVE | SAFETY_RELIEF_VALVE" }
      - { name: manufacturer, type: string, source: input, description: "Nameplate manufacturer captured at intake" }
      - { name: model, type: string, source: input, description: "Nameplate model captured at intake" }
      - { name: rated_flow_gpm, type: number, source: input, description: "Nameplate rated flow (GPM); required iff equipment_class == PUMP" , constraints: "required when PUMP, else must be omitted/null" }
      - { name: set_pressure_psig, type: number, source: input, description: "Nameplate set pressure (psig); required iff equipment_class == SAFETY_RELIEF_VALVE", constraints: "required when SAFETY_RELIEF_VALVE, else must be omitted/null" }
      - { name: test_standard, type: enum, source: input, default: SHOP_WEIGHTED_AVG, description: "Acceptance standard selecting test_verdict variant: API_610_PER_POINT | SHOP_WEIGHTED_AVG" }

  - name: RepairOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; serialized unit in for repair" }
      - { name: warranty_parent_ro_id, type: string, source: input, description: "FK -> RepairOrder.id; optional prior CLOSED repair this order claims warranty against", constraints: "nullable" }
      - { name: failure_mode, type: enum, source: input, description: "SEAL_LEAK | BEARING_FAILURE | CAVITATION | SEAT_LEAKAGE | SPRING_DRIFT | OTHER" }
      - { name: failure_description, type: string, source: input, description: "Free-text failure description from intake" }
      - { name: intake_priority, type: enum, source: input, description: "STANDARD | SURGE (turnaround/shutdown surge work)" }
      - { name: planned_start_date, type: string, source: input, description: "Planned shop arrival date YYYY-MM-DD; CLOSED-interval service window start" }
      - { name: planned_end_date, type: string, source: input, description: "Planned shop completion date YYYY-MM-DD; CLOSED-interval service window end (inclusive)" }
      - { name: estimated_bay_hours, type: integer, source: input, description: "Estimated test-bay/shop hours; reserved against CapacityWindow at quote approval", constraints: "> 0" }
      - { name: exchange_requested, type: boolean, source: input, default: false, description: "Customer requests rotable pool exchange instead of waiting for repair" }
      - { name: status, type: enum, source: system, description: "RECEIVED | IN_INSPECTION | QUOTE_IN_PROGRESS | AUTHORIZED | IN_REPAIR | IN_TEST | READY_FOR_CERT | COMPLETE | CLOSED | CANCELLED" }
      - { name: warranty_case, type: boolean, source: computed, description: "true iff warranty_parent_ro_id supplied and eligible at creation (see warranty_eligibility)" }
      - { name: repeat_failure_flag, type: boolean, source: computed, description: "true iff warranty_case AND parent RO failure_mode equals this failure_mode (re-repair analysis)" }
      - { name: repair_round, type: integer, source: system, default: 0, description: "Number of IN_TEST -> IN_REPAIR rework loops taken (test FAIL count)" }
      - { name: repair_outcome, type: enum, source: computed, description: "NONE until CLOSED; then FIRST_TIME_FIX if repair_round == 0 else RE_REPAIR" }
      - { name: requires_certification, type: boolean, source: computed, description: "true iff asset.equipment_class == SAFETY_RELIEF_VALVE" }
      - { name: assembled_by_id, type: string, source: system, description: "Opaque X-User-ID of Technician who last logged assembly; null until log-assembly", constraints: "nullable" }
      - { name: capacity_window_id, type: string, source: system, description: "FK -> CapacityWindow.id; copied from approved Quote at approval; null before", constraints: "nullable" }
      - { name: quote_attention_required, type: boolean, source: system, default: false, description: "Set true when an ISSUED quote is forced to REVISION_REQUESTED by part obsolescence" }
      - { name: invoiced_total_cents, type: integer, source: system, description: "Snapshot of approved Quote.total_cents at close; null until CLOSED", constraints: "nullable" }
      - { name: closed_at, type: datetime, source: system, description: "Logical-clock timestamp of CLOSED transition; null until CLOSED", constraints: "nullable" }

  - name: InspectionReport
    parent: null
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id; one report per repair order" }
      - { name: findings_summary, type: string, source: input, description: "Teardown findings narrative" }
      - { name: recommended_action, type: enum, source: input, description: "REPAIR | REPLACE | RETURN_UNREPAIRED" }
      - { name: estimated_labor_hours, type: number, source: input, description: "Inspector estimate of repair labor hours" }
      - { name: part_lines, type: array, source: input, description: "Required parts: array of { part_id, quantity } referencing Part rows" }
      - { name: report_status, type: enum, source: system, description: "DRAFT | FINALIZED (immutable after finalize)" }
      - { name: inspector_id, type: string, source: system, description: "Opaque X-User-ID of the Inspector who created the report" }

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: input, description: "FK -> RepairOrder.id" }
      - { name: capacity_window_id, type: string, source: input, description: "FK -> CapacityWindow.id; window this work is planned into" }
      - { name: revision, type: integer, source: system, description: "1-based revision counter per repair order; increments on each new Quote" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | REVISION_REQUESTED | APPROVED | DECLINED | EXPIRED | SUPERSEDED | CANCELLED" }
      - { name: labor_hours, type: number, source: input, description: "Quoted labor hours" }
      - { name: labor_rate_cents, type: integer, source: input, description: "Labor rate in cents per hour" }
      - { name: part_lines, type: array, source: input, description: "Array of { part_id, quantity, unit_price_cents, substitution_for_part_id? }; substitution_for_part_id references an OBSOLETE OEM Part this line substitutes" }
      - { name: pricing_variant, type: enum, source: computed, description: "WARRANTY iff repair order warranty_case else COMMERCIAL" }
      - { name: surge_multiplier_applied, type: number, source: computed, description: "Snapshot of surge_multiplier at quote creation (forced 1.0 for WARRANTY)" }
      - { name: parts_subtotal_cents, type: integer, source: computed, description: "Sum of per-line rounded line totals (see quote_total)" }
      - { name: labor_cents, type: integer, source: computed, description: "round_half_up(labor_hours * labor_rate_cents); 0 for WARRANTY" }
      - { name: total_cents, type: integer, source: computed, description: "round_half_up((parts_subtotal_cents + labor_cents) * surge_multiplier_applied)" }
      - { name: supersedes_quote_id, type: string, source: system, description: "FK -> Quote.id; immediately-prior non-terminal quote this revision supersedes; null on revision 1", constraints: "nullable" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of ISSUED transition; null until issued", constraints: "nullable" }
      - { name: expires_at, type: datetime, source: system, description: "issued_at + QUOTE_VALIDITY_DAYS (14); null until issued", constraints: "nullable" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: part_number, type: string, source: input, description: "Catalog part number; unique" }
      - { name: description, type: string, source: input, description: "Part description" }
      - { name: unit_price_cents, type: integer, source: input, description: "Current sell price in cents" }
      - { name: aftermarket_allowed, type: boolean, source: input, default: false, description: "Whether an aftermarket substitute may replace this OEM part once OBSOLETE" }
      - { name: status, type: enum, source: system, description: "ACTIVE | OBSOLETE" }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> Part.id; replacement part recorded at obsolescence; null while ACTIVE or if none", constraints: "nullable, target must be ACTIVE and != self" }

  - name: PoolUnit
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; pool-owning customer" }
      - { name: asset_id, type: string, source: input, description: "FK -> Asset.id; serialized physical unit held in pool" }
      - { name: pool_status, type: enum, source: system, description: "IN_POOL | RESERVED | ISSUED | WITHDRAWN" }
      - { name: reserved_for_ro_id, type: string, source: system, description: "FK -> RepairOrder.id; repair order this unit is reserved for; null unless RESERVED", constraints: "nullable" }

  - name: TestRun
    parent: null
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: system, description: "FK -> RepairOrder.id; taken from path" }
      - { name: run_number, type: integer, source: system, description: "1-based chronological counter per repair order" }
      - { name: test_type, type: enum, source: input, description: "PERFORMANCE_CURVE | HYDROSTATIC | POP_TEST" }
      - { name: measured_points, type: array, source: input, description: "Array of { duty_pct, measured_value, reference_value }; duty_pct in (0, 150]" }
      - { name: max_deviation_pct, type: number, source: computed, description: "max over points of |deviation_pct|, each rounded to 2dp half-up" }
      - { name: weighted_deviation_pct, type: number, source: computed, description: "duty-weighted average of per-point rounded deviation_pct, rounded 2dp half-up" }
      - { name: verdict, type: enum, source: computed, description: "PASS | FAIL per asset.test_standard variant (see test_verdict)" }
      - { name: tested_by_id, type: string, source: system, description: "Opaque X-User-ID of the Technician who recorded the run" }

  - name: Certification
    parent: null
    common_fields: true
    fields:
      - { name: repair_order_id, type: string, source: system, description: "FK -> RepairOrder.id; taken from path" }
      - { name: tag_number, type: string, source: system, description: "Certification tag minted sequentially as SVT-000001, SVT-000002, ... (per server, creation order)" }
      - { name: set_pressure_psig, type: number, source: input, description: "As-tested pop set pressure; must be within +/-3% of asset set_pressure_psig" }
      - { name: seat_leakage_class, type: enum, source: input, description: "CLASS_IV | CLASS_V | CLASS_VI" }
      - { name: certified_by_id, type: string, source: system, description: "Opaque X-User-ID of the Certifier; MUST differ from RepairOrder.assembled_by_id (segregation of duties)" }
      - { name: cert_status, type: enum, source: system, description: "ISSUED | VOIDED" }
      - { name: void_reason, type: string, source: system, description: "Reason recorded on void; null while ISSUED", constraints: "nullable" }

  - name: CapacityWindow
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Window label (e.g. TA-2026-Q3-TAR turnaround)" }
      - { name: window_start, type: datetime, source: input, description: "Window start (inclusive); half-open interval start" }
      - { name: window_end, type: datetime, source: input, description: "Window end (exclusive); half-open interval end; must be > window_start" }
      - { name: bay_hours_capacity, type: integer, source: input, description: "Total bay hours available in window", constraints: "> 0" }
      - { name: bay_hours_reserved, type: integer, source: computed, description: "Sum of estimated_bay_hours over RepairOrders with capacity_window_id == this window and status IN {AUTHORIZED, IN_REPAIR, IN_TEST, READY_FOR_CERT, COMPLETE}" }
      - { name: window_posture, type: enum, source: computed, description: "FULL if reserved >= capacity; SURGE if reserved >= ceil(0.8 * capacity); else NORMAL" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RepairOrder
    initial_state: RECEIVED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: RECEIVED
        to: IN_INSPECTION
        trigger: "POST /repair-orders/{id}/start-teardown"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: ["RepairOrder.version += 1"]

      - from: IN_INSPECTION
        to: QUOTE_IN_PROGRESS
        trigger: "system (automatic when the InspectionReport for this RO is finalized)"
        actor: system
        preconditions: []
        side_effects: ["RepairOrder.version += 1"]

      - from: QUOTE_IN_PROGRESS
        to: AUTHORIZED
        trigger: "system (automatic when a Quote on this RO transitions ISSUED -> APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "RepairOrder.capacity_window_id := Quote.capacity_window_id"
          - "CapacityWindow.bay_hours_reserved += RepairOrder.estimated_bay_hours (cascade link 2)"
          - "CapacityWindow.window_posture recomputed; may flip NORMAL -> SURGE or SURGE -> FULL (cascade link 3)"
          - "RepairOrder.version += 1"

      - from: AUTHORIZED
        to: IN_REPAIR
        trigger: "POST /repair-orders/{id}/start-repair"
        actor: Technician
        preconditions:
          - "An APPROVED Quote exists for this repair order (cross-entity: Quote.status == APPROVED)"
        side_effects: ["RepairOrder.version += 1"]

      - from: IN_REPAIR
        to: IN_TEST
        trigger: "POST /repair-orders/{id}/submit-for-test"
        actor: Technician
        preconditions:
          - "If requires_certification: assembled_by_id must be non-null (ERR_ASSEMBLY_NOT_RECORDED)"
        side_effects: ["RepairOrder.version += 1"]

      - from: IN_TEST
        to: IN_REPAIR
        trigger: "system (a TestRun is recorded with verdict == FAIL)"
        actor: system
        preconditions: []
        side_effects:
          - "RepairOrder.repair_round += 1"
          - "RepairOrder.version += 1"
        note: "rework loop — RepairOrder is cyclic on IN_REPAIR <-> IN_TEST"

      - from: IN_TEST
        to: READY_FOR_CERT
        trigger: "system (a TestRun is recorded with verdict == PASS and requires_certification == true)"
        actor: system
        preconditions: []
        side_effects: ["RepairOrder.version += 1"]

      - from: IN_TEST
        to: COMPLETE
        trigger: "system (a TestRun is recorded with verdict == PASS and requires_certification == false)"
        actor: system
        preconditions: []
        side_effects: ["RepairOrder.version += 1"]

      - from: READY_FOR_CERT
        to: COMPLETE
        trigger: "system (a Certification is issued for this RO)"
        actor: system
        preconditions: []
        side_effects: ["RepairOrder.version += 1"]

      - from: COMPLETE
        to: READY_FOR_CERT
        trigger: "system (the Certification backing this COMPLETE is voided)"
        actor: system
        preconditions: []
        side_effects: ["RepairOrder.version += 1"]
        note: "compensation revert — voided certification reopens the certification step"

      - from: COMPLETE
        to: CLOSED
        trigger: "POST /repair-orders/{id}/close"
        actor: IntakeCoordinator
        preconditions: []
        side_effects:
          - "RepairOrder.closed_at := current logical clock; invoiced_total_cents := approved Quote.total_cents"
          - "repair_outcome := FIRST_TIME_FIX if repair_round == 0 else RE_REPAIR"
          - "CapacityWindow.bay_hours_reserved -= estimated_bay_hours (window released; posture recomputed)"
          - "If a PoolUnit is RESERVED with reserved_for_ro_id == this RO: that unit -> ISSUED, then a new PoolUnit (customer_id, asset_id of this RO, IN_POOL) is created as pool replenishment"
          - "RepairOrder.version += 1"

      - from: [RECEIVED, IN_INSPECTION, QUOTE_IN_PROGRESS, AUTHORIZED, IN_REPAIR, IN_TEST, READY_FOR_CERT, COMPLETE]
        to: CANCELLED
        trigger: "POST /repair-orders/{id}/cancel"
        actor: "IntakeCoordinator (any non-terminal); Customer (own orders, only from RECEIVED, IN_INSPECTION, QUOTE_IN_PROGRESS)"
        preconditions: []
        side_effects:
          - "If status was AUTHORIZED/IN_REPAIR/IN_TEST/READY_FOR_CERT/COMPLETE: CapacityWindow.bay_hours_reserved -= estimated_bay_hours (posture recomputed)"
          - "Any PoolUnit RESERVED with reserved_for_ro_id == this RO -> IN_POOL (reserved_for_ro_id := null)"
          - "All non-terminal Quotes (DRAFT/ISSUED/REVISION_REQUESTED) for this RO -> CANCELLED"
          - "RepairOrder.version += 1"

  - entity: Quote
    initial_state: DRAFT
    terminal_states: [APPROVED, DECLINED, EXPIRED, SUPERSEDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /quotes/{id}/issue"
        actor: ServiceManager
        preconditions:
          - "Every part_line references an ACTIVE Part (ERR_PART_OBSOLETE), or a valid substitution (ERR_SUBSTITUTION_TARGET_NOT_OBSOLETE, ERR_SUBSTITUTION_NOT_ALLOWED)"
        side_effects:
          - "issued_at := current logical clock; expires_at := issued_at + 14 days"

      - from: ISSUED
        to: APPROVED
        trigger: "POST /quotes/{id}/approve"
        actor: Customer (owner of the quote's repair order)
        preconditions:
          - "Lazy expiry: if current logical clock >= expires_at, quote -> EXPIRED and request rejected (ERR_QUOTE_EXPIRED)"
          - "CapacityWindow not FULL at approval: window.bay_hours_reserved + RO.estimated_bay_hours <= window.bay_hours_capacity (ERR_WINDOW_CAPACITY_EXCEEDED)"
          - "total_cents <= customer.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
          - "If RO.exchange_requested: a PoolUnit exists with reserved_for_ro_id == RO.id and pool_status == RESERVED (ERR_POOL_UNIT_UNAVAILABLE)"
        side_effects:
          - "RepairOrder QUOTE_IN_PROGRESS -> AUTHORIZED (cascade link 1; see RepairOrder machine for links 2-3)"

      - from: ISSUED
        to: REVISION_REQUESTED
        trigger: "POST /quotes/{id}/request-revision"
        actor: Customer (owner)
        preconditions:
          - "Lazy expiry: if current logical clock >= expires_at, quote -> EXPIRED and request rejected (ERR_QUOTE_EXPIRED)"
        side_effects: []

      - from: ISSUED
        to: DECLINED
        trigger: "POST /quotes/{id}/decline"
        actor: Customer (owner)
        preconditions:
          - "Lazy expiry: if current logical clock >= expires_at, quote -> EXPIRED and request rejected (ERR_QUOTE_EXPIRED)"
        side_effects:
          - "RepairOrder QUOTE_IN_PROGRESS -> CANCELLED (with its own cancel side effects: pool reservation released)"

      - from: ISSUED
        to: EXPIRED
        trigger: "system (lazy: any read or action on the quote when current logical clock >= expires_at)"
        actor: system
        preconditions: []
        side_effects: []

      - from: [DRAFT, ISSUED, REVISION_REQUESTED]
        to: SUPERSEDED
        trigger: "system (a new Quote revision is created for the same repair order)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: REVISION_REQUESTED
        trigger: "system (a Part referenced by this quote's part_lines becomes OBSOLETE)"
        actor: system
        preconditions: []
        side_effects:
          - "Matching part_lines flagged substitution_required := true"
          - "RepairOrder.quote_attention_required := true (cascade link 2)"
        note: "forced-revision branch of the obsolescence cascade"

      - from: [DRAFT, REVISION_REQUESTED]
        to: CANCELLED
        trigger: "system (repair order cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ISSUED
        to: CANCELLED
        trigger: "system (repair order cancelled)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: InspectionReport
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /inspection-reports/{id}/finalize"
        actor: Inspector
        preconditions:
          - "RepairOrder status == IN_INSPECTION"
        side_effects:
          - "RepairOrder IN_INSPECTION -> QUOTE_IN_PROGRESS"
          - "Report becomes immutable (no further writes accepted)"

  - entity: Part
    initial_state: ACTIVE
    terminal_states: [OBSOLETE]
    transitions:
      - from: ACTIVE
        to: OBSOLETE
        trigger: "POST /parts/{id}/mark-obsolete"
        actor: ServiceManager
        preconditions:
          - "If superseded_by_id provided: target Part exists, is ACTIVE, and != this Part (ERR_SUPERSEDES_NOT_ACTIVE)"
        side_effects:
          - "superseded_by_id recorded"
          - "Every Quote in DRAFT/ISSUED/REVISION_REQUESTED containing this part in part_lines: line flagged substitution_required := true (cascade link 1)"
          - "Every such Quote in ISSUED -> REVISION_REQUESTED, and its RepairOrder.quote_attention_required := true (cascade link 2)"

  - entity: PoolUnit
    initial_state: IN_POOL
    terminal_states: [ISSUED, WITHDRAWN]
    transitions:
      - from: IN_POOL
        to: RESERVED
        trigger: "POST /pool-units/{id}/reserve"
        actor: IntakeCoordinator
        preconditions:
          - "Target RepairOrder exists and is non-terminal"
          - "RepairOrder.customer_id == PoolUnit.customer_id (ERR_POOL_CUSTOMER_MISMATCH)"
          - "RepairOrder.exchange_requested == true (ERR_EXCHANGE_NOT_REQUESTED)"
        side_effects: ["reserved_for_ro_id := repair_order_id"]

      - from: RESERVED
        to: IN_POOL
        trigger: "POST /pool-units/{id}/release"
        actor: IntakeCoordinator
        preconditions: []
        side_effects: ["reserved_for_ro_id := null"]

      - from: RESERVED
        to: ISSUED
        trigger: "POST /pool-units/{id}/issue OR system (repair order close with exchange)"
        actor: IntakeCoordinator | system
        preconditions:
          - "Manual issue: reserved RepairOrder status IN {AUTHORIZED, IN_REPAIR, IN_TEST, READY_FOR_CERT, COMPLETE}"
        side_effects: []

      - from: IN_POOL
        to: WITHDRAWN
        trigger: "POST /pool-units/{id}/withdraw"
        actor: "Customer (own pool) | IntakeCoordinator"
        preconditions: []
        side_effects: []

  - entity: Certification
    initial_state: ISSUED
    terminal_states: [VOIDED]
    transitions:
      - from: ISSUED
        to: VOIDED
        trigger: "POST /certifications/{id}/void"
        actor: ServiceManager
        preconditions: []
        side_effects:
          - "void_reason recorded"
          - "RepairOrder COMPLETE -> READY_FOR_CERT (compensation revert; a new Certification is required to complete again)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-repair-order
    parent_entity: RepairOrder
    write_endpoint: "POST /quotes"
    occ_field: "expected_repair_order_version"
    description: |
      Creating a new Quote revision against a RepairOrder whose version has
      advanced since the client last observed it is rejected. A prior successful
      quote creation legitimately supersedes the client's base revision, so the
      current writer's view of the negotiation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: quote_total
    trigger: "Quote creation (POST /quotes); results stored on the Quote row"
    algorithm: aggregation
    formula: |
      # Pinned evaluation/rounding order (per-line round -> sum -> labor round -> multiply -> final round):
      discount_pct = 0.5 if pricing_variant == WARRANTY else 0.0
      for each line in part_lines:
        line_total_cents[line] = round_half_up(line.quantity * line.unit_price_cents * (1 - discount_pct))
      parts_subtotal_cents = sum(line_total_cents)            # already integers after per-line rounding
      labor_cents = 0 if pricing_variant == WARRANTY else round_half_up(labor_hours * labor_rate_cents)
      pre_surge_cents = parts_subtotal_cents + labor_cents
      total_cents = round_half_up(pre_surge_cents * surge_multiplier_applied)
    input_set: "The quote's own part_lines, labor_hours, labor_rate_cents; pricing_variant from RepairOrder.warranty_case; surge_multiplier_applied snapshot"
    constants:
      WARRANTY_PART_DISCOUNT_PCT: 0.5
    precision: "integer cents; per-line round_half_up BEFORE summation (sum-then-round is a different, non-conforming result)"
    variants:
      - name: COMMERCIAL
        when: "RepairOrder.warranty_case == false"
        difference: "full parts price, labor charged, surge multiplier applied"
      - name: WARRANTY
        when: "RepairOrder.warranty_case == true"
        difference: "parts at 50% (round_half_up per line), labor_cents = 0, surge_multiplier forced to 1.0"

  - name: surge_multiplier
    trigger: "Quote creation (POST /quotes); snapshot stored as Quote.surge_multiplier_applied"
    algorithm: threshold
    formula: |
      posture = CapacityWindow.window_posture of Quote.capacity_window_id at creation time
      base = 1.0
      if posture == SURGE: base = 1.25
      if posture == FULL: quote creation rejected (ERR_WINDOW_FULL) — no multiplier produced
      if RepairOrder.intake_priority == SURGE: base += 0.15
      if Customer.pool_program == true: base -= 0.10
      multiplier = min(max(base, 1.0), 1.50)      # floor 1.0, cap 1.5
      if pricing_variant == WARRANTY: multiplier = 1.0
    input_set: "CapacityWindow posture, RepairOrder.intake_priority, Customer.pool_program"
    constants:
      SURGE_BASE: 1.25
      SURGE_PRIORITY_ADD: 0.15
      POOL_PROGRAM_CREDIT: 0.10
      MULTIPLIER_FLOOR: 1.0
      MULTIPLIER_CAP: 1.50
    precision: "2 decimal places; snapshot immutable after creation"

  - name: window_posture
    trigger: "any change to CapacityWindow.bay_hours_reserved or bay_hours_capacity"
    algorithm: threshold
    formula: |
      if bay_hours_reserved >= bay_hours_capacity: posture = FULL
      elif bay_hours_reserved >= ceil(0.8 * bay_hours_capacity): posture = SURGE
      else: posture = NORMAL
    input_set: "the window's own bay_hours_reserved / bay_hours_capacity"
    constants:
      SURGE_THRESHOLD_PCT: 0.8
    precision: "boundary is inclusive: reserved == ceil(0.8*capacity) IS SURGE; reserved == capacity IS FULL"

  - name: bay_hours_reserved
    trigger: "RepairOrder approval (reserve), cancellation or close (release)"
    algorithm: aggregation
    formula: |
      bay_hours_reserved = sum(RO.estimated_bay_hours) over RepairOrders where
        RO.capacity_window_id == window.id AND
        RO.status IN {AUTHORIZED, IN_REPAIR, IN_TEST, READY_FOR_CERT, COMPLETE}
      # CLOSED and CANCELLED orders do NOT reserve hours.
    input_set: "RepairOrders linked to the window, filtered to the explicit status set above"
    precision: "integer hours"

  - name: test_verdict
    trigger: "TestRun creation (POST /repair-orders/{id}/test-runs)"
    algorithm: weighted_scoring
    formula: |
      for each point p in measured_points:
        deviation_pct[p] = round_half_up((p.measured_value - p.reference_value) / p.reference_value * 100, 2dp)
      max_deviation_pct = max(|deviation_pct[p]|)
      weighted_deviation_pct = round_half_up(sum(p.duty_pct * deviation_pct[p]) / sum(p.duty_pct), 2dp)
      variant PER_POINT:     PASS iff max_deviation_pct <= TOLERANCE_PCT
      variant WEIGHTED_AVG:  PASS iff |weighted_deviation_pct| <= TOLERANCE_PCT
      # Boundary is inclusive: deviation exactly == 5.00 PASSES; 5.01 FAILS.
    input_set: "the TestRun's measured_points; variant selected by Asset.test_standard (API_610_PER_POINT -> PER_POINT; SHOP_WEIGHTED_AVG -> WEIGHTED_AVG)"
    constants:
      TOLERANCE_PCT: 5.0
    precision: "per-point deviations rounded to 2dp half-up; comparisons use the ROUNDED values"
    variants:
      - name: PER_POINT
        when: "Asset.test_standard == API_610_PER_POINT"
        difference: "every point individually within tolerance; cancelling deviations cannot rescue a bad point"
      - name: WEIGHTED_AVG
        when: "Asset.test_standard == SHOP_WEIGHTED_AVG"
        difference: "duty-weighted average within tolerance; opposing deviations cancel, so identical data can PASS here and FAIL under PER_POINT"

  - name: warranty_eligibility
    trigger: "RepairOrder creation when warranty_parent_ro_id is provided"
    algorithm: chronological
    formula: |
      parent = RepairOrder(warranty_parent_ro_id)
      eligible iff ALL of:
        parent exists AND parent.status == CLOSED
        parent.asset_id == new.asset_id
        parent.customer_id == new.customer_id
        days_between(parent.closed_at, current logical clock) <= Customer.warranty_terms_days
      days_between = floor((current_utc - parent.closed_at) / 86400 seconds)
      # Boundary is inclusive: exactly warranty_terms_days days IS eligible.
      If not eligible: creation rejected with ERR_WARRANTY_NOT_ELIGIBLE.
      On success: warranty_case := true; repeat_failure_flag := (parent.failure_mode == new.failure_mode)
    input_set: "parent RepairOrder, Asset linkage, Customer.warranty_terms_days, logical clock"
    precision: "whole days, floor; inclusive boundary"

  - name: pool_available_count
    trigger: "any PoolUnit create / pool_status transition for the customer"
    algorithm: aggregation
    formula: |
      Customer.pool_available_count = count(PoolUnit) where
        PoolUnit.customer_id == customer.id AND pool_status IN {IN_POOL, RESERVED}
      # ISSUED and WITHDRAWN units are not available.
    input_set: "PoolUnits of the customer filtered to the explicit status set above"
    precision: "integer count"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and names a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: existence
    check: "Request body shape: required fields present, enum values valid, date/datetime formats valid, conditional nameplate fields present per equipment_class"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"

  - priority: 3
    category: auth
    check: "Role permitted for endpoint; ownership: Customer role may only act on resources whose customer_id == X-User-ID"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: existence
    check: "Path and body-referenced resources exist (left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target entity in a valid state for the operation (state machine from-state; terminal lockdown; OCC version match). For POST /repair-orders/{id}/certifications the permanent applicability gate is evaluated first within this priority: requires_certification false -> ERR_CERTIFICATION_NOT_APPLICABLE, before any from-state evaluation"
    error_id: "ERR_INVALID_STATE | ERR_STALE_VERSION | ERR_CERTIFICATION_NOT_APPLICABLE"
    http_status: 409
    applies_to: "all state-changing endpoints (ERR_STALE_VERSION is 412 on POST /quotes; ERR_CERTIFICATION_NOT_APPLICABLE only on the certification endpoint)"

  - priority: 6
    category: business_safety
    check: "Certification safety: certified_by != assembled_by (SoD); set pressure within +/-3% of nameplate"
    error_id: "ERR_SOD_VIOLATION | ERR_SET_PRESSURE_OUT_OF_TOLERANCE"
    http_status: 422
    applies_to: "POST /repair-orders/{id}/certifications"

  - priority: 7
    category: business_temporal
    check: "Interval rules: CapacityWindow half-open overlap; Asset closed-interval service overlap; quote lazy expiry"
    error_id: "ERR_WINDOW_OVERLAP | ERR_ASSET_WINDOW_OVERLAP | ERR_QUOTE_EXPIRED"
    http_status: 409
    applies_to: "POST /capacity-windows, POST /repair-orders, quote actions (issue/approve/request-revision/decline evaluated against logical clock)"

  - priority: 8
    category: business_referential
    check: "Referenced-entity usability: supersede target ACTIVE; pool unit customer match; substitution target OBSOLETE; warranty parent eligible"
    error_id: "ERR_SUPERSEDES_NOT_ACTIVE | ERR_POOL_CUSTOMER_MISMATCH | ERR_SUBSTITUTION_TARGET_NOT_OBSOLETE | ERR_WARRANTY_NOT_ELIGIBLE"
    http_status: 409
    applies_to: "POST /parts/{id}/mark-obsolete, POST /pool-units/{id}/reserve, POST /quotes, POST /repair-orders"

  - priority: 9
    category: business_constraint
    check: "Domain constraints: obsolete part without substitution; aftermarket not allowed; window FULL; capacity exceeded; duplicate report; assembly not recorded; pool/exchange rules"
    error_id: "ERR_PART_OBSOLETE | ERR_SUBSTITUTION_NOT_ALLOWED | ERR_WINDOW_FULL | ERR_WINDOW_CAPACITY_EXCEEDED | ERR_REPORT_ALREADY_EXISTS | ERR_ASSEMBLY_NOT_RECORDED | ERR_POOL_UNIT_UNAVAILABLE | ERR_EXCHANGE_NOT_REQUESTED | ERR_POOL_PROGRAM_REQUIRED"
    http_status: 409
    applies_to: "various write endpoints"

  - priority: 10
    category: business_fiscal
    check: "Quote total within customer credit limit (reject iff total_cents > credit_limit_cents; equality allowed)"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /quotes/{id}/approve"

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time. All timestamps (created_at, issued_at, expires_at, closed_at) and all date arithmetic use this clock."
    roles: [ServiceManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced; subsequent lazy quote expiry and warranty day-counts observe the new time"]

  # --- Customer ---
  - method: POST
    path: "/customers"
    description: "Onboard a customer"
    roles: [ServiceManager]
    code: 201
    input: [name, account_number, credit_limit_cents, warranty_terms_days, "pool_program?"]
    output: Customer
    side_effects: ["pool_available_count := 0"]

  - method: GET
    path: "/customers"
    description: "List customers (paginated)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/customers/{id}"
    description: "Get one customer"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: Customer
    side_effects: []

  # --- Asset ---
  - method: POST
    path: "/assets"
    description: "Register a serialized equipment unit with nameplate capture"
    roles: [IntakeCoordinator]
    code: 201
    input: [customer_id, serial_number, equipment_class, manufacturer, model, "rated_flow_gpm?", "set_pressure_psig?", "test_standard?"]
    output: Asset
    side_effects: []

  - method: GET
    path: "/assets"
    description: "List assets (paginated, filterable)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Asset[]
    side_effects: []

  - method: GET
    path: "/assets/{id}"
    description: "Get one asset"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: Asset
    side_effects: []

  # --- RepairOrder ---
  - method: POST
    path: "/repair-orders"
    description: "Intake a repair order for a customer asset"
    roles: [IntakeCoordinator, Customer]
    code: 201
    input: [customer_id, asset_id, failure_mode, failure_description, intake_priority, planned_start_date, planned_end_date, estimated_bay_hours, "warranty_parent_ro_id?", "exchange_requested?"]
    output: RepairOrder
    side_effects:
      - "status := RECEIVED, repair_round := 0, repair_outcome := NONE"
      - "warranty_case / repeat_failure_flag computed when warranty_parent_ro_id given (else warranty rejected ERR_WARRANTY_NOT_ELIGIBLE)"
      - "asset closed-interval service overlap checked against non-terminal ROs of the same asset (ERR_ASSET_WINDOW_OVERLAP)"

  - method: GET
    path: "/repair-orders"
    description: "List repair orders (paginated, filterable)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: ["customer_id?", "asset_id?", "status?", "capacity_window_id?", "warranty_parent_ro_id?", "limit?", "offset?"]
    output: RepairOrder[]
    side_effects: []

  - method: GET
    path: "/repair-orders/{id}"
    description: "Get one repair order"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: RepairOrder
    side_effects: []

  - method: POST
    path: "/repair-orders/{id}/start-teardown"
    description: "RECEIVED -> IN_INSPECTION"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["increments RepairOrder.version by 1"]

  - method: POST
    path: "/repair-orders/{id}/start-repair"
    description: "AUTHORIZED -> IN_REPAIR"
    roles: [Technician]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["increments RepairOrder.version by 1"]

  - method: POST
    path: "/repair-orders/{id}/log-assembly"
    description: "Record acting Technician (X-User-ID) as assembled_by_id; repeatable in IN_REPAIR, latest call wins"
    roles: [Technician]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["assembled_by_id := X-User-ID", "increments RepairOrder.version by 1"]

  - method: POST
    path: "/repair-orders/{id}/submit-for-test"
    description: "IN_REPAIR -> IN_TEST; SRV orders require an assembly record first"
    roles: [Technician]
    code: 200
    input: []
    output: RepairOrder
    side_effects: ["increments RepairOrder.version by 1"]

  - method: POST
    path: "/repair-orders/{id}/close"
    description: "COMPLETE -> CLOSED; releases window hours, issues reserved exchange unit, replenishes pool"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: RepairOrder
    side_effects:
      - "closed_at, invoiced_total_cents, repair_outcome set"
      - "CapacityWindow.bay_hours_reserved -= estimated_bay_hours; posture recomputed"
      - "reserved PoolUnit -> ISSUED; new PoolUnit (this RO's customer+asset) created IN_POOL"
      - "increments RepairOrder.version by 1"

  - method: POST
    path: "/repair-orders/{id}/cancel"
    description: "Any non-terminal state -> CANCELLED; releases window hours and pool reservation; cancels non-terminal quotes"
    roles: [IntakeCoordinator, Customer]
    code: 200
    input: []
    output: RepairOrder
    side_effects:
      - "window hours released if status was AUTHORIZED or later (non-terminal)"
      - "RESERVED PoolUnit -> IN_POOL; non-terminal Quotes -> CANCELLED"
      - "increments RepairOrder.version by 1"

  # --- InspectionReport ---
  - method: POST
    path: "/repair-orders/{id}/inspection-reports"
    description: "Create teardown inspection report (DRAFT) for an RO in IN_INSPECTION; one per RO"
    roles: [Inspector]
    code: 201
    input: [findings_summary, recommended_action, estimated_labor_hours, part_lines]
    output: InspectionReport
    side_effects: ["inspector_id := X-User-ID", "report_status := DRAFT"]

  - method: GET
    path: "/repair-orders/{id}/inspection-reports"
    description: "List inspection reports for an RO (0 or 1 element)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: InspectionReport[]
    side_effects: []

  - method: POST
    path: "/inspection-reports/{id}/finalize"
    description: "DRAFT -> FINALIZED; drives RO IN_INSPECTION -> QUOTE_IN_PROGRESS"
    roles: [Inspector]
    code: 200
    input: []
    output: InspectionReport
    side_effects: ["RepairOrder -> QUOTE_IN_PROGRESS; increments RepairOrder.version by 1"]

  # --- Quote ---
  - method: POST
    path: "/quotes"
    description: "Create a quote revision for an RO in QUOTE_IN_PROGRESS (OCC-guarded create-with-supersede)"
    roles: [ServiceManager]
    code: 201
    input: [repair_order_id, capacity_window_id, labor_hours, labor_rate_cents, part_lines, expected_repair_order_version]
    output: Quote
    side_effects:
      - "revision := prior max + 1; prior non-terminal quotes for this RO -> SUPERSEDED; supersedes_quote_id set"
      - "pricing_variant, surge_multiplier_applied, parts_subtotal_cents, labor_cents, total_cents computed and stored"
      - "increments RepairOrder.version by 1"

  - method: GET
    path: "/quotes"
    description: "List quotes (paginated, filterable)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: ["repair_order_id?", "capacity_window_id?", "status?", "supersedes_quote_id?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []

  - method: GET
    path: "/quotes/{id}"
    description: "Get one quote (lazy expiry applied on read)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["lazy expiry: ISSUED quote past expires_at transitions to EXPIRED"]

  - method: POST
    path: "/quotes/{id}/issue"
    description: "DRAFT -> ISSUED; validates part lines; stamps issued_at / expires_at"
    roles: [ServiceManager]
    code: 200
    input: []
    output: Quote
    side_effects: ["issued_at := clock; expires_at := issued_at + 14 days"]

  - method: POST
    path: "/quotes/{id}/approve"
    description: "ISSUED -> APPROVED by owning customer; cascades RO -> AUTHORIZED, window reservation, posture recompute"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects:
      - "RepairOrder QUOTE_IN_PROGRESS -> AUTHORIZED; capacity_window_id copied"
      - "CapacityWindow.bay_hours_reserved += RO.estimated_bay_hours; window_posture recomputed"
      - "increments RepairOrder.version by 1"

  - method: POST
    path: "/quotes/{id}/request-revision"
    description: "ISSUED -> REVISION_REQUESTED by owning customer"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: []

  - method: POST
    path: "/quotes/{id}/decline"
    description: "ISSUED -> DECLINED by owning customer; cascades RO -> CANCELLED"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: ["RepairOrder -> CANCELLED; pool reservation released if any"]

  # --- Part ---
  - method: POST
    path: "/parts"
    description: "Create a catalog part (ACTIVE)"
    roles: [ServiceManager]
    code: 201
    input: [part_number, description, unit_price_cents, "aftermarket_allowed?"]
    output: Part
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/parts"
    description: "List parts (paginated, filterable)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: ["status?", "superseded_by_id?", "limit?", "offset?"]
    output: Part[]
    side_effects: []

  - method: GET
    path: "/parts/{id}"
    description: "Get one part"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: Part
    side_effects: []

  - method: POST
    path: "/parts/{id}/mark-obsolete"
    description: "ACTIVE -> OBSOLETE with optional supersession; cascades to open quotes referencing the part"
    roles: [ServiceManager]
    code: 200
    input: ["superseded_by_id?"]
    output: Part
    side_effects:
      - "open quotes (DRAFT/ISSUED/REVISION_REQUESTED) containing part: line flagged substitution_required := true"
      - "ISSUED quotes among them -> REVISION_REQUESTED; their RepairOrders get quote_attention_required := true"

  # --- PoolUnit ---
  - method: POST
    path: "/pool-units"
    description: "Enroll a serialized unit into a customer's rotable pool"
    roles: [IntakeCoordinator]
    code: 201
    input: [customer_id, asset_id]
    output: PoolUnit
    side_effects: ["pool_status := IN_POOL", "Customer.pool_available_count recomputed"]

  - method: GET
    path: "/pool-units"
    description: "List pool units (paginated, filterable)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: ["customer_id?", "asset_id?", "pool_status?", "reserved_for_ro_id?", "limit?", "offset?"]
    output: PoolUnit[]
    side_effects: []

  - method: GET
    path: "/pool-units/{id}"
    description: "Get one pool unit"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: PoolUnit
    side_effects: []

  - method: POST
    path: "/pool-units/{id}/reserve"
    description: "IN_POOL -> RESERVED against an exchange-requested repair order of the same customer"
    roles: [IntakeCoordinator]
    code: 200
    input: [repair_order_id]
    output: PoolUnit
    side_effects: ["reserved_for_ro_id set"]

  - method: POST
    path: "/pool-units/{id}/release"
    description: "RESERVED -> IN_POOL"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: PoolUnit
    side_effects: ["reserved_for_ro_id := null"]

  - method: POST
    path: "/pool-units/{id}/issue"
    description: "RESERVED -> ISSUED once the linked repair order is AUTHORIZED or later"
    roles: [IntakeCoordinator]
    code: 200
    input: []
    output: PoolUnit
    side_effects: ["Customer.pool_available_count recomputed"]

  - method: POST
    path: "/pool-units/{id}/withdraw"
    description: "IN_POOL -> WITHDRAWN (customer pulls unit out of pool)"
    roles: [Customer, IntakeCoordinator]
    code: 200
    input: []
    output: PoolUnit
    side_effects: ["Customer.pool_available_count recomputed"]

  # --- TestRun ---
  - method: POST
    path: "/repair-orders/{id}/test-runs"
    description: "Record a performance test run for an RO in IN_TEST; verdict computed per asset test_standard"
    roles: [Technician]
    code: 201
    input: [test_type, measured_points]
    output: TestRun
    side_effects:
      - "run_number assigned chronologically; tested_by_id := X-User-ID; verdict computed"
      - "PASS: RO -> READY_FOR_CERT (SRV) or COMPLETE (non-SRV)"
      - "FAIL: RO -> IN_REPAIR and repair_round += 1"
      - "increments RepairOrder.version by 1"

  - method: GET
    path: "/repair-orders/{id}/test-runs"
    description: "List test runs for an RO (chronological)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: TestRun[]
    side_effects: []

  # --- Certification ---
  - method: POST
    path: "/repair-orders/{id}/certifications"
    description: "Issue SRV certification and tag for an RO in READY_FOR_CERT; SoD enforced"
    roles: [Certifier]
    code: 201
    input: [set_pressure_psig, seat_leakage_class]
    output: Certification
    side_effects:
      - "certified_by_id := X-User-ID; tag_number minted sequentially (SVT-000001, ...)"
      - "RO READY_FOR_CERT -> COMPLETE; increments RepairOrder.version by 1"

  - method: GET
    path: "/repair-orders/{id}/certifications"
    description: "List certifications for an RO"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: Certification[]
    side_effects: []

  - method: POST
    path: "/certifications/{id}/void"
    description: "ISSUED -> VOIDED; reverts RO COMPLETE -> READY_FOR_CERT"
    roles: [ServiceManager]
    code: 200
    input: [void_reason]
    output: Certification
    side_effects: ["RepairOrder COMPLETE -> READY_FOR_CERT; increments RepairOrder.version by 1"]

  # --- CapacityWindow ---
  - method: POST
    path: "/capacity-windows"
    description: "Create a turnaround/shutdown capacity window; half-open overlap with existing windows rejected"
    roles: [Planner]
    code: 201
    input: [label, window_start, window_end, bay_hours_capacity]
    output: CapacityWindow
    side_effects: ["bay_hours_reserved := 0; window_posture := NORMAL"]

  - method: GET
    path: "/capacity-windows"
    description: "List capacity windows (paginated)"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: CapacityWindow[]
    side_effects: []

  - method: GET
    path: "/capacity-windows/{id}"
    description: "Get one capacity window"
    roles: [ServiceManager, IntakeCoordinator, Inspector, Technician, Certifier, Planner, Customer]
    code: 200
    input: []
    output: CapacityWindow
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, invalid enum/date format, or conditional nameplate field missing for equipment_class" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or Customer acting on another customer's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a valid from-state for the requested transition; terminal-state lockdown" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_repair_order_version does not match current RepairOrder.version on POST /quotes" }
  - { id: ERR_QUOTE_EXPIRED, http: 409, condition: "Action on an ISSUED quote when logical clock >= expires_at; quote transitions to EXPIRED" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New CapacityWindow half-open interval [start, end) overlaps an existing window (adjacency allowed)" }
  - { id: ERR_ASSET_WINDOW_OVERLAP, http: 409, condition: "New RepairOrder planned [start, end] (closed interval) overlaps another non-terminal RepairOrder of the same asset (touching endpoints conflict)" }
  - { id: ERR_WARRANTY_NOT_ELIGIBLE, http: 409, condition: "warranty_parent_ro_id provided but parent not CLOSED / wrong asset / wrong customer / outside warranty_terms_days" }
  - { id: ERR_SUPERSEDES_NOT_ACTIVE, http: 409, condition: "mark-obsolete superseded_by_id missing, refers to a non-ACTIVE part, or refers to the part itself" }
  - { id: ERR_PART_OBSOLETE, http: 409, condition: "Quote issue with a part_line referencing an OBSOLETE part without valid substitution" }
  - { id: ERR_SUBSTITUTION_TARGET_NOT_OBSOLETE, http: 409, condition: "part_line substitution_for_part_id references a part that is not OBSOLETE" }
  - { id: ERR_SUBSTITUTION_NOT_ALLOWED, http: 409, condition: "substitution target is OBSOLETE but aftermarket_allowed == false" }
  - { id: ERR_WINDOW_FULL, http: 409, condition: "Quote creation referencing a CapacityWindow whose posture is FULL" }
  - { id: ERR_WINDOW_CAPACITY_EXCEEDED, http: 409, condition: "Approval would push bay_hours_reserved above bay_hours_capacity (reserved + estimated_bay_hours > capacity)" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 422, condition: "Quote total_cents exceeds customer credit_limit_cents on approve (equality allowed)" }
  - { id: ERR_POOL_UNIT_UNAVAILABLE, http: 409, condition: "Approve of an exchange-requested RO with no RESERVED pool unit linked to it" }
  - { id: ERR_POOL_CUSTOMER_MISMATCH, http: 409, condition: "Pool unit and repair order belong to different customers" }
  - { id: ERR_EXCHANGE_NOT_REQUESTED, http: 409, condition: "reserve called for a repair order whose exchange_requested is false" }
  - { id: ERR_POOL_PROGRAM_REQUIRED, http: 409, condition: "PoolUnit enrollment for a customer with pool_program == false" }
  - { id: ERR_REPORT_ALREADY_EXISTS, http: 409, condition: "Second inspection report for the same repair order" }
  - { id: ERR_ASSEMBLY_NOT_RECORDED, http: 409, condition: "submit-for-test on an SRV repair order with no assembled_by_id logged" }
  - { id: ERR_CERTIFICATION_NOT_APPLICABLE, http: 409, condition: "Certification attempted on a repair order whose asset is not a SAFETY_RELIEF_VALVE" }
  - { id: ERR_SOD_VIOLATION, http: 422, condition: "Certifier X-User-ID equals the repair order's assembled_by_id (segregation of duties)" }
  - { id: ERR_SET_PRESSURE_OUT_OF_TOLERANCE, http: 422, condition: "|set_pressure_psig - asset.set_pressure_psig| / asset.set_pressure_psig > 0.03" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "External customer organization; approves/declines quotes, withdraws own pool units, intakes own repair orders"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /quotes/{id}/approve, /request-revision, /decline — only for own repair orders"
    shared_operations:
      - "POST /repair-orders (customer_id must equal X-User-ID)"
      - "POST /repair-orders/{id}/cancel (own orders, pre-AUTHORIZED states only)"
      - "POST /pool-units/{id}/withdraw (own pool)"
      - "GET endpoints (own-customer scope)"

  - name: IntakeCoordinator
    description: "Service-center front desk: equipment intake, nameplate capture, pool administration, shipping/closeout"
    identity: opaque
    exclusive_operations:
      - "POST /assets"
      - "POST /repair-orders/{id}/start-teardown, /close"
      - "POST /pool-units, /pool-units/{id}/reserve, /release, /issue"
    shared_operations:
      - "POST /repair-orders, /repair-orders/{id}/cancel, /pool-units/{id}/withdraw"
      - "GET endpoints"

  - name: Inspector
    description: "Teardown inspector; authors and finalizes inspection reports"
    identity: opaque
    exclusive_operations:
      - "POST /repair-orders/{id}/inspection-reports"
      - "POST /inspection-reports/{id}/finalize"
    shared_operations:
      - "GET endpoints"

  - name: Technician
    description: "Repair technician; performs repair, assembly, and test runs"
    identity: opaque
    exclusive_operations:
      - "POST /repair-orders/{id}/start-repair, /log-assembly, /submit-for-test"
      - "POST /repair-orders/{id}/test-runs"
    shared_operations:
      - "GET endpoints"

  - name: Certifier
    description: "Certified SRV inspector; issues certification tags. Segregation of duties: may not certify a repair order whose assembled_by_id equals the Certifier's X-User-ID"
    identity: opaque
    exclusive_operations:
      - "POST /repair-orders/{id}/certifications"
    shared_operations:
      - "GET endpoints"

  - name: Planner
    description: "Turnaround/shutdown planner; manages capacity windows"
    identity: opaque
    exclusive_operations:
      - "POST /capacity-windows"
    shared_operations:
      - "GET endpoints"

  - name: ServiceManager
    description: "Service center manager; owns customer onboarding, catalog, quoting, certification voids, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /customers, /parts, /parts/{id}/mark-obsolete"
      - "POST /quotes, /quotes/{id}/issue"
      - "POST /certifications/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET endpoints"
