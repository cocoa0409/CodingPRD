scenario: "2200. Transformer & Switchgear Manufacturing (Eaton/ABB equipment plant): engineered order & submittal drawing, copper/aluminum & core material escalation, factory acceptance test witness scheduling, arc-flash/rating labels & compliance, long-lead component allocation, staged shipment & site storage, field commissioning & startup, warranty & failure-analysis return"
domain_name: "transformer-switchgear-manufacturing"
api_prefix: ""   # multi-root scaffold: all 127 §1.5 paths are absolute/full paths across 21 resource families; no single shared prefix

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - version_pinning_on_approval
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Calibrated ABOVE the Expert tier of §0.4 deliberately: 20 entities, 10 state
    machines (two with independent state dimensions on a single row, three with
    revision cycles, two compound/aggregate-driven), 14 interacting calculation
    chains with pinned rounding and evaluation order, a 44-step validation
    priority ladder, 5 OCC concurrency rules and 12 segregated roles. Density
    comes from the coupling: EngineeredOrder.production_posture is derived from
    six child aggregates and gates nearly every child mutation, escalation money
    and component units are each conserved across compensating actions, and the
    compliance label pins both a drawing revision and a test report so any
    upstream revision invalidates it.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: EngineeredOrder
    parent: null
    common_fields: true
    fields:
      - name: order_number
        type: string
        source: input
        description: "Customer-facing engineered order number"
        constraints: "unique across all EngineeredOrder rows; 6-24 chars"
      - name: customer_name
        type: string
        source: input
        description: "Purchasing utility or EPC contractor name"
      - name: product_family
        type: enum
        source: input
        description: "Equipment class being built"
        constraints: "POWER_TRANSFORMER | PAD_MOUNT_TRANSFORMER | MV_SWITCHGEAR | LV_SWITCHGEAR"
      - name: rated_kv
        type: number
        source: input
        description: "Nameplate system voltage in kV, used by arc-flash label tiering"
        constraints: "> 0 and <= 800"
      - name: contract_value_cents
        type: integer
        source: input
        description: "Base contract price in cents, exclusive of any material escalation"
        constraints: ">= 100000"
      - name: engineering_status
        type: enum
        source: system
        description: "First independent state dimension: design/submittal progression"
        default: ENG_OPEN
        constraints: "ENG_OPEN | SUBMITTAL_IN_REVIEW | DESIGN_RELEASED | ENG_CLOSED"
      - name: fulfillment_status
        type: enum
        source: system
        description: "Second independent state dimension: material/production/field progression"
        default: PLANNING
        constraints: "PLANNING | MATERIAL_ALLOCATED | IN_PRODUCTION | FAT_COMPLETE | SHIPPING | COMMISSIONING | CLOSED | CANCELLED"
      - name: production_posture
        type: enum
        source: computed
        description: "Derived gate over child mutations; recomputed by calc order_production_posture"
        default: OPEN
        constraints: "OPEN | RESTRICTED | FROZEN"
      - name: posture_reason_codes
        type: array
        source: computed
        description: "Sorted array of reason codes that produced the current posture"
      - name: escalation_accepted_total_cents
        type: integer
        source: computed
        description: "Sum of EscalationAdjustment.adjustment_amount_cents for adjustments in state ACCEPTED on this order"
        default: 0
      - name: warranty_credit_total_cents
        type: integer
        source: computed
        description: "Sum of WarrantyClaim.credit_issued_cents for claims in state SETTLED on this order"
        default: 0
      - name: net_contract_value_cents
        type: integer
        source: computed
        description: "contract_value_cents + escalation_accepted_total_cents - warranty_credit_total_cents; conserved quantity of invariant order-money-conservation"
      - name: billed_to_date_cents
        type: integer
        source: computed
        description: "Sum of ShipmentRelease.stage_billing_cents for releases in state IN_TRANSIT or DELIVERED"
        default: 0
      - name: released_drawing_revision
        type: integer
        source: computed
        description: "revision_round of the SubmittalDrawing that carried this order into DESIGN_RELEASED; null before release"
      - name: sold_at
        type: datetime
        source: input
        description: "Contract award instant; escalation base index month is derived from this"
      - name: promised_ship_at
        type: datetime
        source: input
        description: "Contractual ship date for stage 1; drives late-shipment liquidated damages checks"
      - name: owning_sales_user_id
        type: string
        source: input
        description: "Opaque SalesEngineer operator id that owns commercial scope of this order"
      - name: cancelled_reason
        type: string
        source: system
        description: "Populated when fulfillment_status becomes CANCELLED"

  - name: SubmittalDrawing
    parent: EngineeredOrder
    common_fields: true
    fields:
      - name: engineered_order_id
        type: string
        source: input
        description: "FK -> EngineeredOrder.id; owning order"
      - name: revision_round
        type: integer
        source: system
        description: "1 for the first drawing package on the order, incremented by one for each resubmission"
        default: 1
      - name: drawing_set_code
        type: string
        source: input
        description: "Drawing package identifier, e.g. OUTLINE-GA or SCHEMATIC-3LINE"
      - name: status
        type: enum
        source: system
        description: "Submittal review lifecycle with a revision cycle"
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | APPROVED_AS_NOTED | REVISE_AND_RESUBMIT | VOID"
      - name: authored_by_user_id
        type: string
        source: input
        description: "Opaque DesignEngineer operator id who authored this revision; used by segregation-of-duties checks"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: "Opaque CustomerReviewer operator id who recorded the disposition"
      - name: notes_count
        type: integer
        source: input
        description: "Count of customer review comments carried on the disposition"
        default: 0
      - name: as_noted_changes_bill_of_material
        type: boolean
        source: input
        description: "True when APPROVED_AS_NOTED comments alter the bill of material; forces component re-allocation cascade"
        default: false
      - name: submitted_at
        type: datetime
        source: system
        description: "Instant the revision entered SUBMITTED"
      - name: disposition_at
        type: datetime
        source: system
        description: "Instant the revision reached APPROVED, APPROVED_AS_NOTED or REVISE_AND_RESUBMIT"
      - name: supersedes_drawing_id
        type: string
        source: system
        description: "FK -> SubmittalDrawing.id; the revision this one replaced, null for revision_round 1"

  - name: EscalationClause
    parent: EngineeredOrder
    common_fields: true
    fields:
      - name: engineered_order_id
        type: string
        source: input
        description: "FK -> EngineeredOrder.id; owning order (at most one clause per order)"
        constraints: "unique per engineered_order_id"
      - name: copper_weight_bp
        type: integer
        source: input
        description: "Basis points of the escalatable base attributable to copper"
        constraints: "0..10000"
      - name: aluminum_weight_bp
        type: integer
        source: input
        description: "Basis points of the escalatable base attributable to aluminum"
        constraints: "0..10000"
      - name: core_steel_weight_bp
        type: integer
        source: input
        description: "Basis points of the escalatable base attributable to grain-oriented electrical steel"
        constraints: "0..10000; copper + aluminum + core_steel must equal exactly 10000"
      - name: escalatable_base_cents
        type: integer
        source: input
        description: "Portion of contract value exposed to commodity movement, in cents"
        constraints: ">= 0 and <= EngineeredOrder.contract_value_cents"
      - name: base_index_month
        type: string
        source: input
        description: "YYYY-MM month whose published indices form the escalation baseline"
      - name: cap_bp
        type: integer
        source: input
        description: "Maximum upward escalation as basis points of escalatable_base_cents"
        constraints: "0..5000"
      - name: collar_bp
        type: integer
        source: input
        description: "Deadband in basis points; movement whose absolute value is strictly below this is not escalatable"
        constraints: "0..1000"
      - name: de_escalation_enabled
        type: boolean
        source: input
        description: "When false, negative computed movement clamps to zero instead of producing a credit"
        default: true
      - name: final_window_end_month
        type: string
        source: input
        description: "YYYY-MM last month included in the FINAL variant's chronological averaging window"
      - name: status
        type: enum
        source: system
        description: "Clause usability; LOCKED once the order reaches DESIGN_RELEASED"
        default: ACTIVE
        constraints: "ACTIVE | LOCKED | SUPERSEDED"

  - name: CommodityIndexPoint
    parent: null
    common_fields: false
    fields:
      - name: commodity
        type: enum
        source: input
        description: "Indexed commodity"
        constraints: "COPPER | ALUMINUM | CORE_STEEL"
      - name: index_month
        type: string
        source: input
        description: "YYYY-MM the index value belongs to"
        constraints: "unique per (commodity, index_month)"
      - name: index_value
        type: number
        source: input
        description: "Published index level with 4 decimal places"
        constraints: "> 0"
      - name: published_at
        type: datetime
        source: input
        description: "Instant the index level became public; a point is usable only when published_at <= logical clock"
      - name: is_provisional
        type: boolean
        source: input
        description: "True for preliminary prints; the FINAL escalation variant excludes provisional points"
        default: false

  - name: EscalationAdjustment
    parent: EngineeredOrder
    common_fields: true
    fields:
      - name: engineered_order_id
        type: string
        source: input
        description: "FK -> EngineeredOrder.id; owning order"
      - name: escalation_clause_id
        type: string
        source: system
        description: "FK -> EscalationClause.id; clause snapshot used for this computation"
      - name: variant
        type: enum
        source: input
        description: "Which algorithm produced adjustment_amount_cents"
        constraints: "PROVISIONAL | FINAL"
      - name: status
        type: enum
        source: system
        description: "Commercial acceptance lifecycle with a dispute/recalculation cycle"
        default: CALCULATED
        constraints: "CALCULATED | SUBMITTED_TO_CUSTOMER | ACCEPTED | DISPUTED | RECALCULATING | WITHDRAWN"
      - name: copper_component_cents
        type: integer
        source: computed
        description: "Rounded copper contribution in cents"
      - name: aluminum_component_cents
        type: integer
        source: computed
        description: "Rounded aluminum contribution in cents"
      - name: core_steel_component_cents
        type: integer
        source: computed
        description: "Rounded core steel contribution in cents"
      - name: raw_movement_cents
        type: integer
        source: computed
        description: "Sum of the three rounded per-commodity components before collar and cap"
      - name: adjustment_amount_cents
        type: integer
        source: computed
        description: "Final signed amount after collar deadband and cap clamp; may be negative when de_escalation_enabled"
      - name: cap_applied
        type: boolean
        source: computed
        description: "True when the cap clamp changed the amount"
        default: false
      - name: collar_absorbed
        type: boolean
        source: computed
        description: "True when the collar deadband zeroed the amount"
        default: false
      - name: index_months_used
        type: array
        source: computed
        description: "Sorted ascending YYYY-MM list of index months that entered the computation"
      - name: dispute_reason
        type: string
        source: system
        description: "Customer-provided reason recorded on the DISPUTED transition"
      - name: recalculation_round
        type: integer
        source: system
        description: "0 on first computation, incremented each time the adjustment re-enters RECALCULATING"
        default: 0
      - name: prepared_by_user_id
        type: string
        source: input
        description: "Opaque ContractAdmin operator id who prepared this adjustment"
      - name: accepted_by_user_id
        type: string
        source: system
        description: "Opaque operator id who recorded customer acceptance; must differ from prepared_by_user_id"

  - name: Supplier
    parent: null
    common_fields: true
    fields:
      - name: supplier_code
        type: string
        source: input
        description: "Vendor code"
        constraints: "unique across all Supplier rows"
      - name: legal_name
        type: string
        source: input
        description: "Registered supplier name"
      - name: region
        type: enum
        source: input
        description: "Sourcing region"
        constraints: "NA | EU | APAC | LATAM"
      - name: status
        type: enum
        source: system
        description: "Approved-vendor-list standing"
        default: APPROVED
        constraints: "APPROVED | PROBATION | SUSPENDED"
      - name: quality_index_trailing
        type: number
        source: computed
        description: "Weighted quality index over the trailing window variant, 2 decimals"
        default: 100
      - name: quality_index_lifetime
        type: number
        source: computed
        description: "Weighted quality index over the lifetime cumulative variant, 2 decimals"
        default: 100
      - name: attributed_failure_count
        type: integer
        source: computed
        description: "Count of FailureAnalysisReport rows in state PUBLISHED whose attributed_supplier_id is this supplier"
        default: 0
      - name: receipt_event_count
        type: integer
        source: computed
        description: "Count of LongLeadComponent receipt events recorded against this supplier"
        default: 0
      - name: probation_entered_at
        type: datetime
        source: system
        description: "Instant status last became PROBATION"

  - name: LongLeadComponent
    parent: Supplier
    common_fields: true
    fields:
      - name: supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; sole source for this component"
      - name: part_number
        type: string
        source: input
        description: "Manufacturer part number"
        constraints: "unique per supplier_id"
      - name: category
        type: enum
        source: input
        description: "Long-lead component class"
        constraints: "HV_BUSHING | VACUUM_INTERRUPTER | TAP_CHANGER | CT_VT | CORE_STEEL_COIL | BREAKER_FRAME"
      - name: lead_time_days
        type: integer
        source: input
        description: "Quoted replenishment lead time in days"
        constraints: ">= 1"
      - name: quantity_on_hand
        type: integer
        source: system
        description: "Physical units held in the plant crib; conserved quantity of invariant component-unit-conservation"
        default: 0
      - name: quantity_reserved
        type: integer
        source: computed
        description: "Sum of ComponentAllocation.quantity for allocations in state RESERVED on this component"
        default: 0
      - name: quantity_committed
        type: integer
        source: computed
        description: "Sum of ComponentAllocation.quantity for allocations in state COMMITTED on this component"
        default: 0
      - name: quantity_consumed
        type: integer
        source: computed
        description: "Sum of ComponentAllocation.quantity for allocations in state CONSUMED on this component"
        default: 0
      - name: quantity_available
        type: integer
        source: computed
        description: "quantity_on_hand - quantity_reserved - quantity_committed; never negative"
        default: 0
      - name: allocation_policy
        type: enum
        source: input
        description: "Whether a higher-priority order may preempt an existing RESERVED allocation"
        default: PREEMPTIBLE
        constraints: "PREEMPTIBLE | PROTECTED"
      - name: status
        type: enum
        source: system
        description: "Component usability for new allocations"
        default: ACTIVE
        constraints: "ACTIVE | QUARANTINED | OBSOLETE"
      - name: quarantine_reason
        type: string
        source: system
        description: "Populated when status becomes QUARANTINED by a failure-analysis cascade"

  - name: ComponentAllocation
    parent: LongLeadComponent
    common_fields: true
    fields:
      - name: long_lead_component_id
        type: string
        source: input
        description: "FK -> LongLeadComponent.id; component whose pool is drawn down"
      - name: engineered_order_id
        type: string
        source: input
        description: "FK -> EngineeredOrder.id; order consuming the units"
      - name: quantity
        type: integer
        source: input
        description: "Units reserved for this order"
        constraints: ">= 1"
      - name: priority_class
        type: integer
        source: input
        description: "Allocation priority; 1 is the highest priority and may preempt classes with a strictly larger number"
        constraints: "1..5"
      - name: status
        type: enum
        source: system
        description: "Allocation lifecycle including preemption and release"
        default: RESERVED
        constraints: "RESERVED | COMMITTED | CONSUMED | RELEASED | PREEMPTED"
      - name: need_by_date
        type: datetime
        source: input
        description: "Date the units must be on the shop floor"
      - name: preempted_for_allocation_id
        type: string
        source: system
        description: "FK -> ComponentAllocation.id; the allocation that displaced this one, null unless status is PREEMPTED"
      - name: release_penalty_cents
        type: integer
        source: computed
        description: "Restocking penalty charged when a COMMITTED allocation is released; 0 for RESERVED releases"
        default: 0
      - name: committed_at
        type: datetime
        source: system
        description: "Instant the allocation entered COMMITTED"
      - name: released_at
        type: datetime
        source: system
        description: "Instant the allocation entered RELEASED or PREEMPTED"

  - name: TestBay
    parent: null
    common_fields: true
    fields:
      - name: bay_code
        type: string
        source: input
        description: "Test bay identifier, e.g. BAY-IMPULSE-1"
        constraints: "unique across all TestBay rows"
      - name: max_kv
        type: number
        source: input
        description: "Highest system voltage the bay can energize, in kV"
        constraints: "> 0"
      - name: changeover_buffer_hours
        type: integer
        source: input
        description: "Hours of teardown/setup appended to every occupation window before the next window may begin"
        default: 4
        constraints: "0..24"
      - name: status
        type: enum
        source: system
        description: "Bay availability for new scheduling"
        default: AVAILABLE
        constraints: "AVAILABLE | MAINTENANCE | DECOMMISSIONED"
      - name: supports_impulse
        type: boolean
        source: input
        description: "True when the bay can run lightning-impulse withstand tests"
        default: false
      - name: scheduled_hours_total
        type: integer
        source: computed
        description: "Sum of test_duration_hours over FactoryAcceptanceTest rows on this bay in states BAY_SCHEDULED, WITNESS_CONFIRMED, IN_PROGRESS"
        default: 0

  - name: FactoryAcceptanceTest
    parent: EngineeredOrder
    common_fields: true
    fields:
      - name: engineered_order_id
        type: string
        source: input
        description: "FK -> EngineeredOrder.id; unit under test"
      - name: test_bay_id
        type: string
        source: system
        description: "FK -> TestBay.id; bay holding the occupation window, null before BAY_SCHEDULED"
      - name: retest_of_fat_id
        type: string
        source: system
        description: "FK -> FactoryAcceptanceTest.id; the failed test this retest replaces, null for the first attempt"
      - name: attempt_number
        type: integer
        source: system
        description: "1 for the first attempt, incremented for each retest"
        default: 1
      - name: status
        type: enum
        source: system
        description: "FAT lifecycle with a retest cycle and a pass/fail branch"
        default: REQUESTED
        constraints: "REQUESTED | BAY_SCHEDULED | WITNESS_CONFIRMED | IN_PROGRESS | PASSED | FAILED | ABANDONED"
      - name: window_start_at
        type: datetime
        source: input
        description: "Requested start of the bay occupation window (inclusive)"
      - name: test_duration_hours
        type: integer
        source: input
        description: "Hours of bay time the test itself consumes"
        constraints: "1..120"
      - name: window_end_at
        type: datetime
        source: computed
        description: "window_start_at + test_duration_hours + TestBay.changeover_buffer_hours, exclusive upper bound"
      - name: witness_required
        type: boolean
        source: input
        description: "True when the contract requires at least one witness present"
        default: true
      - name: confirmed_witness_count
        type: integer
        source: computed
        description: "Count of WitnessAssignment rows on this test in state CONFIRMED"
        default: 0
      - name: requires_impulse
        type: boolean
        source: input
        description: "True when the test plan includes lightning-impulse withstand"
        default: false
      - name: run_by_user_id
        type: string
        source: system
        description: "Opaque TestEngineer operator id who started the test; used by segregation-of-duties checks"
      - name: started_at
        type: datetime
        source: system
        description: "Instant the test entered IN_PROGRESS"
      - name: concluded_at
        type: datetime
        source: system
        description: "Instant the test entered PASSED or FAILED"

  - name: WitnessParty
    parent: null
    common_fields: true
    fields:
      - name: party_code
        type: string
        source: input
        description: "Witness registration code"
        constraints: "unique across all WitnessParty rows"
      - name: display_name
        type: string
        source: input
        description: "Witness person or agency name"
      - name: party_type
        type: enum
        source: input
        description: "Who the witness represents"
        constraints: "CUSTOMER | THIRD_PARTY_LAB | INSURER"
      - name: home_region
        type: enum
        source: input
        description: "Region the witness travels from; drives the travel blackout rule"
        constraints: "NA | EU | APAC | LATAM"
      - name: daily_witness_capacity
        type: integer
        source: input
        description: "Maximum number of CONFIRMED assignments this party may hold whose window_start_at falls on a single UTC calendar day"
        default: 1
        constraints: "1..3"
      - name: status
        type: enum
        source: system
        description: "Witness eligibility"
        default: ACTIVE
        constraints: "ACTIVE | CREDENTIAL_EXPIRED | INACTIVE"
      - name: credential_expires_at
        type: datetime
        source: input
        description: "Instant the witness credential lapses; assignments cannot be confirmed at or after this instant"

  - name: WitnessAssignment
    parent: FactoryAcceptanceTest
    common_fields: true
    fields:
      - name: factory_acceptance_test_id
        type: string
        source: input
        description: "FK -> FactoryAcceptanceTest.id; test being witnessed"
      - name: witness_party_id
        type: string
        source: input
        description: "FK -> WitnessParty.id; invited witness"
      - name: status
        type: enum
        source: system
        description: "Invitation lifecycle with a decline/re-invite cycle"
        default: INVITED
        constraints: "INVITED | CONFIRMED | DECLINED | WAIVED | RELEASED"
      - name: travel_region
        type: enum
        source: input
        description: "Region the witness will travel from for this specific test"
        constraints: "NA | EU | APAC | LATAM"
      - name: blackout_days
        type: integer
        source: computed
        description: "0 when travel_region equals the plant region NA, otherwise 1 day before and 1 day after are blacked out"
        default: 0
      - name: confirmed_at
        type: datetime
        source: system
        description: "Instant the assignment entered CONFIRMED"
      - name: decline_reason
        type: string
        source: system
        description: "Reason captured on the DECLINED transition"

  - name: TestReport
    parent: FactoryAcceptanceTest
    common_fields: true
    fields:
      - name: factory_acceptance_test_id
        type: string
        source: input
        description: "FK -> FactoryAcceptanceTest.id; test the measurements belong to"
      - name: status
        type: enum
        source: system
        description: "Report lifecycle"
        default: DRAFT
        constraints: "DRAFT | ISSUED | SUPERSEDED"
      - name: winding_temp_rise_c
        type: number
        source: input
        description: "Measured average winding temperature rise in Kelvin above ambient"
        constraints: ">= 0"
      - name: temp_rise_limit_c
        type: number
        source: input
        description: "Contractual temperature rise limit; a measurement exactly equal to the limit passes"
        constraints: "> 0"
      - name: impulse_withstand_kv
        type: number
        source: input
        description: "Measured lightning-impulse withstand level in kV"
        constraints: ">= 0"
      - name: impulse_required_kv
        type: number
        source: input
        description: "Required BIL in kV; a measurement exactly equal to the requirement passes"
        constraints: ">= 0"
      - name: short_circuit_current_ka
        type: number
        source: input
        description: "Verified short-circuit withstand in kA rms symmetrical; feeds arc-flash incident energy"
        constraints: "> 0"
      - name: arc_duration_ms
        type: integer
        source: input
        description: "Verified protective clearing time in milliseconds; feeds arc-flash incident energy"
        constraints: "1..2000"
      - name: working_distance_mm
        type: integer
        source: input
        description: "Working distance used for the incident-energy computation"
        default: 455
        constraints: "100..2000"
      - name: pass_result
        type: enum
        source: computed
        description: "Aggregate verdict from calc test_report_verdict"
        constraints: "PASS | FAIL"
      - name: failed_criteria
        type: array
        source: computed
        description: "Sorted array of criterion codes that failed"
      - name: issued_at
        type: datetime
        source: system
        description: "Instant the report entered ISSUED"

  - name: ComplianceLabel
    parent: EngineeredOrder
    common_fields: true
    fields:
      - name: engineered_order_id
        type: string
        source: input
        description: "FK -> EngineeredOrder.id; unit the nameplate belongs to"
      - name: submittal_drawing_id
        type: string
        source: system
        description: "FK -> SubmittalDrawing.id; drawing revision pinned at generation time"
      - name: test_report_id
        type: string
        source: system
        description: "FK -> TestReport.id; issued report whose measurements were pinned"
      - name: pinned_drawing_revision
        type: integer
        source: system
        description: "Copy of SubmittalDrawing.revision_round taken at generation; label goes stale if the order releases a newer revision"
      - name: status
        type: enum
        source: system
        description: "Label lifecycle with a stale/void revert path"
        default: DRAFT
        constraints: "DRAFT | GENERATED | STALE | VERIFIED | ISSUED | VOIDED"
      - name: incident_energy_cal_cm2
        type: number
        source: computed
        description: "Arc-flash incident energy at working_distance_mm, rounded UP to 1 decimal place"
      - name: ppe_category
        type: integer
        source: computed
        description: "0..4 arc-flash PPE category selected from incident_energy_cal_cm2 tier boundaries"
      - name: arc_flash_boundary_mm
        type: integer
        source: computed
        description: "Distance in mm at which incident energy falls to 1.2 cal/cm2, rounded UP to the next whole mm"
      - name: rating_text
        type: string
        source: computed
        description: "Nameplate rating string composed from order rated_kv and report short_circuit_current_ka"
      - name: generated_by_user_id
        type: string
        source: system
        description: "Opaque ComplianceOfficer operator id who generated the label"
      - name: verified_by_user_id
        type: string
        source: system
        description: "Opaque ComplianceOfficer operator id who verified it; must differ from generated_by_user_id and from the pinned drawing's authored_by_user_id"
      - name: void_reason
        type: string
        source: system
        description: "Populated when status becomes VOIDED or STALE"

  - name: ShipmentRelease
    parent: EngineeredOrder
    common_fields: true
    fields:
      - name: engineered_order_id
        type: string
        source: input
        description: "FK -> EngineeredOrder.id; order being shipped"
      - name: stage_index
        type: integer
        source: input
        description: "1-based staged shipment sequence number"
        constraints: ">= 1; unique per engineered_order_id"
      - name: stage_share_bp
        type: integer
        source: input
        description: "Basis points of net_contract_value_cents billed when this stage ships"
        constraints: "1..10000"
      - name: stage_billing_cents
        type: integer
        source: computed
        description: "Cents billed for this stage per calc stage_billing_allocation"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Release lifecycle including a site-storage detour"
        default: HELD
        constraints: "HELD | CLEARED | STAGED | SITE_STORAGE | IN_TRANSIT | DELIVERED | CANCELLED"
      - name: is_final_stage
        type: boolean
        source: input
        description: "True for the stage that absorbs the rounding remainder of the billing allocation"
        default: false
      - name: cleared_at
        type: datetime
        source: system
        description: "Instant the release entered CLEARED"
      - name: shipped_at
        type: datetime
        source: system
        description: "Instant the release entered IN_TRANSIT"
      - name: delivered_at
        type: datetime
        source: system
        description: "Instant the release entered DELIVERED"
      - name: carrier_reference
        type: string
        source: input
        description: "Carrier bill-of-lading reference recorded at IN_TRANSIT"
      - name: storage_fee_accrued_cents
        type: integer
        source: computed
        description: "Cumulative site storage fee charged across all SiteStorageAgreement rows on this release"
        default: 0

  - name: SiteStorageAgreement
    parent: ShipmentRelease
    common_fields: true
    fields:
      - name: shipment_release_id
        type: string
        source: input
        description: "FK -> ShipmentRelease.id; release parked in storage"
      - name: storage_start_at
        type: datetime
        source: input
        description: "Inclusive start instant of the billable storage interval"
      - name: storage_end_at
        type: datetime
        source: system
        description: "Exclusive end instant; null while the agreement is OPEN"
      - name: billable_days
        type: integer
        source: computed
        description: "Whole UTC days in the half-open interval, computed by calc site_storage_fee"
        default: 0
      - name: crate_count
        type: integer
        source: input
        description: "Number of crates in storage, the tiered-rate quantity driver"
        constraints: ">= 1"
      - name: insured_value_cents
        type: integer
        source: input
        description: "Declared value used for the insurance surcharge"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Storage agreement lifecycle"
        default: OPEN
        constraints: "OPEN | CLOSED | WAIVED"
      - name: storage_subtotal_cents
        type: integer
        source: computed
        description: "Tiered day-rate subtotal before surcharge and discount"
        default: 0
      - name: insurance_surcharge_cents
        type: integer
        source: computed
        description: "Surcharge computed from storage_subtotal_cents and insured_value_cents"
        default: 0
      - name: long_stay_discount_cents
        type: integer
        source: computed
        description: "Discount keyed on the pre-discount grand total tier; always a non-negative amount that is subtracted"
        default: 0
      - name: total_fee_cents
        type: integer
        source: computed
        description: "storage_subtotal_cents + insurance_surcharge_cents - long_stay_discount_cents"
        default: 0
      - name: waived_by_user_id
        type: string
        source: system
        description: "Opaque LogisticsCoordinator operator id who waived the fee"

  - name: CommissioningJob
    parent: EngineeredOrder
    common_fields: true
    fields:
      - name: engineered_order_id
        type: string
        source: input
        description: "FK -> EngineeredOrder.id; order being started up in the field"
      - name: shipment_release_id
        type: string
        source: input
        description: "FK -> ShipmentRelease.id; delivered release whose equipment is being commissioned"
      - name: status
        type: enum
        source: system
        description: "Field startup lifecycle; PUNCH_OPEN to COMPLETE is gated on child punch items"
        default: SCHEDULED
        constraints: "SCHEDULED | MOBILIZED | ENERGIZATION_PENDING | PUNCH_OPEN | COMPLETE | DEMOBILIZED_INCOMPLETE | CANCELLED"
      - name: mobilization_at
        type: datetime
        source: input
        description: "Planned crew arrival instant"
      - name: energized_at
        type: datetime
        source: system
        description: "Instant first energization was recorded"
      - name: lead_field_user_id
        type: string
        source: input
        description: "Opaque FieldServiceEngineer operator id leading the crew"
      - name: open_punch_count
        type: integer
        source: computed
        description: "Count of PunchListItem rows on this job in states OPEN, ASSIGNED, RESOLVED"
        default: 0
      - name: blocking_punch_count
        type: integer
        source: computed
        description: "Count of PunchListItem rows on this job with severity BLOCKING and status not CLOSED"
        default: 0
      - name: completion_ratio_bp
        type: integer
        source: computed
        description: "Basis points of punch items closed, per calc punch_completion_ratio"
        default: 10000
      - name: demobilization_round
        type: integer
        source: system
        description: "Count of times the job has cycled through DEMOBILIZED_INCOMPLETE"
        default: 0
      - name: startup_certificate_issued
        type: boolean
        source: computed
        description: "True once the job reaches COMPLETE"
        default: false

  - name: PunchListItem
    parent: CommissioningJob
    common_fields: true
    fields:
      - name: commissioning_job_id
        type: string
        source: input
        description: "FK -> CommissioningJob.id; job the deficiency was raised against"
      - name: severity
        type: enum
        source: input
        description: "Deficiency severity; BLOCKING items prevent job completion"
        constraints: "BLOCKING | MAJOR | MINOR"
      - name: description_text
        type: string
        source: input
        description: "Deficiency description"
      - name: status
        type: enum
        source: system
        description: "Punch item lifecycle with a reject-back-to-open cycle"
        default: OPEN
        constraints: "OPEN | ASSIGNED | RESOLVED | CLOSED | REJECTED"
      - name: assigned_to_user_id
        type: string
        source: system
        description: "Opaque FieldServiceEngineer operator id assigned to remediate"
      - name: resolved_by_user_id
        type: string
        source: system
        description: "Opaque operator id who marked the item RESOLVED"
      - name: closed_by_user_id
        type: string
        source: system
        description: "Opaque QualityEngineer operator id who closed the item; must differ from resolved_by_user_id"
      - name: reject_count
        type: integer
        source: system
        description: "Number of times a RESOLVED item was rejected back to OPEN"
        default: 0
      - name: closed_at
        type: datetime
        source: system
        description: "Instant the item entered CLOSED"

  - name: WarrantyClaim
    parent: EngineeredOrder
    common_fields: true
    fields:
      - name: engineered_order_id
        type: string
        source: input
        description: "FK -> EngineeredOrder.id; order the failed unit belongs to"
      - name: suspect_component_id
        type: string
        source: input
        description: "FK -> LongLeadComponent.id; suspected component, null when the failure is workmanship"
      - name: claim_number
        type: string
        source: system
        description: "Server-minted claim reference"
        constraints: "unique across all WarrantyClaim rows"
      - name: status
        type: enum
        source: system
        description: "Warranty lifecycle with an analysis re-open cycle and a warrantable/non-warrantable branch"
        default: SUBMITTED
        constraints: "SUBMITTED | RMA_ISSUED | UNIT_RECEIVED | ANALYSIS_IN_PROGRESS | WARRANTABLE | NON_WARRANTABLE | SETTLED | REJECTED"
      - name: failure_reported_at
        type: datetime
        source: input
        description: "Instant the customer reported the failure; warranty window is measured from the commissioning completion"
      - name: rma_number
        type: string
        source: system
        description: "Return authorization reference issued on RMA_ISSUED"
      - name: parts_claim_cents
        type: integer
        source: input
        description: "Claimed parts cost in cents; bucket 1 of the credit waterfall"
        constraints: ">= 0"
      - name: labor_claim_cents
        type: integer
        source: input
        description: "Claimed field labor cost in cents; bucket 2 of the credit waterfall"
        constraints: ">= 0"
      - name: freight_claim_cents
        type: integer
        source: input
        description: "Claimed return freight cost in cents; bucket 3 of the credit waterfall"
        constraints: ">= 0"
      - name: consequential_claim_cents
        type: integer
        source: input
        description: "Claimed consequential/outage loss in cents; bucket 4, excluded unless consequential_covered is true"
        constraints: ">= 0"
      - name: consequential_covered
        type: boolean
        source: input
        description: "Contract rider flag enabling bucket 4 participation"
        default: false
      - name: liability_cap_cents
        type: integer
        source: computed
        description: "Warranty liability ceiling, per calc warranty_liability_cap"
        default: 0
      - name: credit_issued_cents
        type: integer
        source: computed
        description: "Credit granted, per calc warranty_credit_waterfall; 0 until SETTLED"
        default: 0
      - name: bucket_allocation
        type: object
        source: computed
        description: "Per-bucket cents granted, keyed PARTS, LABOR, FREIGHT, CONSEQUENTIAL"
      - name: analysis_round
        type: integer
        source: system
        description: "0 on first analysis, incremented each time the claim re-enters ANALYSIS_IN_PROGRESS"
        default: 0
      - name: settled_by_user_id
        type: string
        source: system
        description: "Opaque ContractAdmin operator id who settled the claim; must differ from every PUBLISHED report author on this claim"

  - name: FailureAnalysisReport
    parent: WarrantyClaim
    common_fields: true
    fields:
      - name: warranty_claim_id
        type: string
        source: input
        description: "FK -> WarrantyClaim.id; claim under investigation"
      - name: attributed_supplier_id
        type: string
        source: input
        description: "FK -> Supplier.id; supplier the root cause is attributed to, null for workmanship or misapplication"
      - name: root_cause_code
        type: enum
        source: input
        description: "Root cause classification"
        constraints: "SUPPLIER_DEFECT | WORKMANSHIP | MISAPPLICATION | TRANSPORT_DAMAGE | UNDETERMINED"
      - name: status
        type: enum
        source: system
        description: "Report lifecycle"
        default: DRAFT
        constraints: "DRAFT | PUBLISHED | RETRACTED"
      - name: authored_by_user_id
        type: string
        source: input
        description: "Opaque QualityEngineer operator id who authored the report"
      - name: quarantine_recommended
        type: boolean
        source: input
        description: "When true and root_cause_code is SUPPLIER_DEFECT, publishing quarantines the suspect component"
        default: false
      - name: defect_weight
        type: integer
        source: input
        description: "Severity weight 1-10 fed into the supplier quality index"
        constraints: "1..10"
      - name: published_at
        type: datetime
        source: system
        description: "Instant the report entered PUBLISHED"
      - name: retraction_reason
        type: string
        source: system
        description: "Populated when the report is RETRACTED"

state_machines:
  # --- EngineeredOrder carries TWO independent state dimensions on the same row.
  # engineering_status and fulfillment_status advance on their own triggers and
  # neither is derivable from the other; production_posture is a third, purely
  # derived dimension recomputed by calc order_production_posture after every
  # mutation that touches any child aggregate.
  - entity: EngineeredOrder
    state_dimension: engineering_status
    initial_state: ENG_OPEN
    terminal_states: [ENG_CLOSED]
    transitions:
      - from: ENG_OPEN
        to: SUBMITTAL_IN_REVIEW
        trigger: "POST /submittal-drawings/{id}/submit on the order's revision_round 1 drawing"
        actor: DesignEngineer
        preconditions:
          - "drawing.status == DRAFT"
          - "order.fulfillment_status NOT IN {CANCELLED, CLOSED}"
        side_effects:
          - "SubmittalDrawing.status := SUBMITTED, submitted_at := logical clock"
          - "recompute EngineeredOrder.production_posture (calc order_production_posture)"
          - "increments EngineeredOrder.version by 1"
      - from: SUBMITTAL_IN_REVIEW
        to: SUBMITTAL_IN_REVIEW
        trigger: "POST /submittal-drawings/{id}/disposition with disposition == REVISE_AND_RESUBMIT"
        actor: CustomerReviewer
        preconditions:
          - "drawing.status == UNDER_REVIEW"
        side_effects:
          - "SubmittalDrawing.status := REVISE_AND_RESUBMIT"
          - "posture_reason_codes gains SUBMITTAL_REJECTED; production_posture recomputed to at least RESTRICTED"
        note: "Self-loop: the order stays in review across unbounded revision rounds."
      - from: SUBMITTAL_IN_REVIEW
        to: DESIGN_RELEASED
        trigger: "POST /submittal-drawings/{id}/disposition with disposition IN {APPROVED, APPROVED_AS_NOTED}"
        actor: CustomerReviewer
        preconditions:
          - "drawing.status == UNDER_REVIEW"
          - "EscalationClause exists for the order OR order.contract_value_cents < 5000000"
        side_effects:
          - "EngineeredOrder.released_drawing_revision := drawing.revision_round"
          - "EscalationClause.status := LOCKED (clause inputs frozen from this point)"
          - "every other SubmittalDrawing on the order in status IN {DRAFT, SUBMITTED, UNDER_REVIEW} becomes VOID"
          - "recompute EngineeredOrder.production_posture"
          - "increments EngineeredOrder.version by 1"
      - from: DESIGN_RELEASED
        to: SUBMITTAL_IN_REVIEW
        trigger: "POST /submittal-drawings/{id}/submit on a revision whose revision_round > order.released_drawing_revision"
        actor: DesignEngineer
        preconditions:
          - "drawing.status == DRAFT"
          - "order.fulfillment_status NOT IN {CLOSED, CANCELLED}"
        side_effects:
          - "every ComplianceLabel on the order in status IN {GENERATED, VERIFIED, ISSUED} becomes STALE with void_reason DRAWING_SUPERSEDED"
          - "because those labels went STALE, every ShipmentRelease on the order in status CLEARED reverts to HELD"
          - "recompute EngineeredOrder.production_posture (expected FROZEN, reason LABEL_STALE)"
          - "increments EngineeredOrder.version by 1"
        note: "Cycle DESIGN_RELEASED -> SUBMITTAL_IN_REVIEW -> DESIGN_RELEASED; re-release requires a fresh disposition."
      - from: DESIGN_RELEASED
        to: ENG_CLOSED
        trigger: "POST /engineered-orders/{id}/close-engineering"
        actor: PlantAdmin
        preconditions:
          - "order.fulfillment_status == CLOSED"
          - "no SubmittalDrawing on the order in status IN {DRAFT, SUBMITTED, UNDER_REVIEW, REVISE_AND_RESUBMIT}"
          - "no EscalationAdjustment on the order in status IN {CALCULATED, SUBMITTED_TO_CUSTOMER, DISPUTED, RECALCULATING}"
        side_effects:
          - "EscalationClause.status := SUPERSEDED"
          - "production_posture := FROZEN with reason_codes [ORDER_CLOSED]"
          - "increments EngineeredOrder.version by 1"

  - entity: EngineeredOrder
    state_dimension: fulfillment_status
    initial_state: PLANNING
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNING
        to: MATERIAL_ALLOCATED
        trigger: "system: evaluated after every ComponentAllocation state change on the order"
        actor: system
        preconditions:
          - "count of ComponentAllocation on the order with status == COMMITTED >= 1"
          - "count of ComponentAllocation on the order with status == RESERVED == 0"
        side_effects:
          - "recompute EngineeredOrder.production_posture"
          - "increments EngineeredOrder.version by 1"
      - from: MATERIAL_ALLOCATED
        to: PLANNING
        trigger: "system: evaluated after any ComponentAllocation on the order leaves COMMITTED"
        actor: system
        preconditions:
          - "count of ComponentAllocation on the order with status == COMMITTED == 0"
        side_effects:
          - "posture_reason_codes gains MATERIAL_INCOMPLETE; production_posture recomputed"
          - "increments EngineeredOrder.version by 1"
        note: "Compensating revert closing the cascade opened by a BOM-changing as-noted approval."
      - from: MATERIAL_ALLOCATED
        to: IN_PRODUCTION
        trigger: "POST /engineered-orders/{id}/start-production"
        actor: MaterialsPlanner
        preconditions:
          - "order.engineering_status == DESIGN_RELEASED"
          - "order.production_posture == OPEN"
          - "every ComponentAllocation on the order with status == COMMITTED has need_by_date >= logical clock"
        side_effects:
          - "recompute EngineeredOrder.production_posture"
          - "increments EngineeredOrder.version by 1"
        note: "Cross-dimension guard: the fulfillment dimension cannot advance until the engineering dimension has released."
      - from: IN_PRODUCTION
        to: FAT_COMPLETE
        trigger: "system: a FactoryAcceptanceTest on the order enters PASSED"
        actor: system
        preconditions:
          - "fat.status transition target == PASSED"
        side_effects:
          - "every ComponentAllocation on the order with status == COMMITTED becomes CONSUMED"
          - "because those allocations were consumed, each LongLeadComponent.quantity_on_hand decreases by the allocation quantity and quantity_consumed increases by the same quantity (conserved sum unchanged)"
          - "recompute EngineeredOrder.production_posture"
          - "increments EngineeredOrder.version by 1"
      - from: FAT_COMPLETE
        to: IN_PRODUCTION
        trigger: "system: a retest FactoryAcceptanceTest on the order enters BAY_SCHEDULED"
        actor: system
        preconditions:
          - "the retest's retest_of_fat_id names a FactoryAcceptanceTest on this order in status FAILED"
        side_effects:
          - "posture_reason_codes gains FAT_RETEST_PENDING; production_posture recomputed"
          - "increments EngineeredOrder.version by 1"
      - from: FAT_COMPLETE
        to: SHIPPING
        trigger: "system: the first ShipmentRelease on the order enters IN_TRANSIT"
        actor: system
        preconditions:
          - "count of ShipmentRelease on the order with status IN {IN_TRANSIT, DELIVERED} >= 1"
        side_effects:
          - "recompute EngineeredOrder.billed_to_date_cents"
          - "increments EngineeredOrder.version by 1"
      - from: SHIPPING
        to: COMMISSIONING
        trigger: "system: a CommissioningJob on the order enters MOBILIZED"
        actor: system
        preconditions:
          - "count of CommissioningJob on the order with status == MOBILIZED >= 1"
        side_effects:
          - "recompute EngineeredOrder.production_posture"
          - "increments EngineeredOrder.version by 1"
      - from: COMMISSIONING
        to: CLOSED
        trigger: "system: evaluated after every CommissioningJob state change on the order"
        actor: system
        preconditions:
          - "count of CommissioningJob on the order with status NOT IN {COMPLETE, CANCELLED} == 0"
          - "count of CommissioningJob on the order with status == COMPLETE >= 1"
          - "count of ShipmentRelease on the order with status NOT IN {DELIVERED, CANCELLED} == 0"
        side_effects:
          - "production_posture := RESTRICTED with reason_codes [ORDER_FULFILLED]"
          - "increments EngineeredOrder.version by 1"
      - from: PLANNING
        to: CANCELLED
        trigger: "POST /engineered-orders/{id}/cancel"
        actor: SalesEngineer
        preconditions:
          - "order.engineering_status != ENG_CLOSED"
          - "count of ShipmentRelease on the order with status IN {IN_TRANSIT, DELIVERED} == 0"
        side_effects:
          - "every ComponentAllocation on the order in status IN {RESERVED, COMMITTED} becomes RELEASED"
          - "because those allocations released, each LongLeadComponent recomputes quantity_reserved, quantity_committed and quantity_available"
          - "every ShipmentRelease on the order in status IN {HELD, CLEARED, STAGED, SITE_STORAGE} becomes CANCELLED"
          - "production_posture := FROZEN with reason_codes [ORDER_CANCELLED]"
          - "increments EngineeredOrder.version by 1"
      - from: MATERIAL_ALLOCATED
        to: CANCELLED
        trigger: "POST /engineered-orders/{id}/cancel"
        actor: SalesEngineer
        preconditions:
          - "order.engineering_status != ENG_CLOSED"
          - "count of ShipmentRelease on the order with status IN {IN_TRANSIT, DELIVERED} == 0"
        side_effects:
          - "identical release cascade to the PLANNING -> CANCELLED transition, including release_penalty_cents on each COMMITTED allocation"
          - "production_posture := FROZEN with reason_codes [ORDER_CANCELLED]"
          - "increments EngineeredOrder.version by 1"

  - entity: SubmittalDrawing
    initial_state: DRAFT
    terminal_states: [APPROVED, APPROVED_AS_NOTED, VOID]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /submittal-drawings/{id}/submit"
        actor: DesignEngineer
        preconditions:
          - "no other SubmittalDrawing on the same order with the same drawing_set_code in status IN {SUBMITTED, UNDER_REVIEW}"
          - "order.production_posture != FROZEN"
        side_effects:
          - "submitted_at := logical clock"
          - "order.engineering_status advances to SUBMITTAL_IN_REVIEW (see EngineeredOrder engineering_status machine)"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /submittal-drawings/{id}/begin-review"
        actor: CustomerReviewer
        preconditions:
          - "drawing.status == SUBMITTED"
        side_effects:
          - "reviewed_by_user_id := acting X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /submittal-drawings/{id}/disposition with disposition == APPROVED"
        actor: CustomerReviewer
        preconditions:
          - "notes_count == 0"
          - "acting X-User-ID != drawing.authored_by_user_id (segregation of duties)"
        side_effects:
          - "disposition_at := logical clock"
          - "order.engineering_status := DESIGN_RELEASED, released_drawing_revision := revision_round"
      - from: UNDER_REVIEW
        to: APPROVED_AS_NOTED
        trigger: "POST /submittal-drawings/{id}/disposition with disposition == APPROVED_AS_NOTED"
        actor: CustomerReviewer
        preconditions:
          - "notes_count >= 1"
          - "acting X-User-ID != drawing.authored_by_user_id (segregation of duties)"
        side_effects:
          - "disposition_at := logical clock; order.engineering_status := DESIGN_RELEASED"
          - "CASCADE HOP 1 -> when as_noted_changes_bill_of_material == true, every ComponentAllocation on the order in status RESERVED becomes RELEASED with release_penalty_cents 0"
          - "CASCADE HOP 2 -> because those allocations left RESERVED, each affected LongLeadComponent recomputes quantity_reserved and quantity_available"
          - "CASCADE HOP 3 -> because the order now holds zero COMMITTED allocations, order.fulfillment_status reverts MATERIAL_ALLOCATED -> PLANNING"
          - "CASCADE HOP 4 -> because fulfillment_status reverted, order.production_posture recomputes to RESTRICTED with reason MATERIAL_INCOMPLETE"
        note: "Branch divergence: APPROVED and APPROVED_AS_NOTED both release the design but only the as-noted branch runs the four-hop BOM cascade."
      - from: UNDER_REVIEW
        to: REVISE_AND_RESUBMIT
        trigger: "POST /submittal-drawings/{id}/disposition with disposition == REVISE_AND_RESUBMIT"
        actor: CustomerReviewer
        preconditions:
          - "notes_count >= 1"
          - "acting X-User-ID != drawing.authored_by_user_id (segregation of duties)"
        side_effects:
          - "disposition_at := logical clock"
          - "order posture_reason_codes gains SUBMITTAL_REJECTED"
      - from: REVISE_AND_RESUBMIT
        to: VOID
        trigger: "system: POST /engineered-orders/{id}/submittal-drawings creates the successor revision"
        actor: system
        preconditions:
          - "the new drawing's supersedes_drawing_id == this drawing.id"
        side_effects:
          - "successor drawing.revision_round := this.revision_round + 1"
        note: "Revision cycle closes here: REVISE_AND_RESUBMIT -> (new DRAFT) -> SUBMITTED -> UNDER_REVIEW."
      - from: SUBMITTED
        to: VOID
        trigger: "system: a sibling drawing on the same order reaches APPROVED or APPROVED_AS_NOTED"
        actor: system
        preconditions:
          - "sibling drawing on the same engineered_order_id reached a terminal approval state"
        side_effects:
          - "void reason recorded as SUPERSEDED_BY_APPROVAL"

  - entity: EscalationAdjustment
    initial_state: CALCULATED
    terminal_states: [ACCEPTED, WITHDRAWN]
    transitions:
      - from: CALCULATED
        to: SUBMITTED_TO_CUSTOMER
        trigger: "POST /escalation-adjustments/{id}/submit"
        actor: ContractAdmin
        preconditions:
          - "adjustment.status == CALCULATED"
          - "no other EscalationAdjustment on the same order in status IN {SUBMITTED_TO_CUSTOMER, RECALCULATING}"
        side_effects:
          - "increments EngineeredOrder.version by 1"
      - from: SUBMITTED_TO_CUSTOMER
        to: ACCEPTED
        trigger: "POST /escalation-adjustments/{id}/accept"
        actor: CustomerReviewer
        preconditions:
          - "acting X-User-ID != adjustment.prepared_by_user_id (segregation of duties)"
          - "when variant == FINAL, order.engineering_status == DESIGN_RELEASED"
        side_effects:
          - "accepted_by_user_id := acting X-User-ID"
          - "order.escalation_accepted_total_cents increases by adjustment_amount_cents"
          - "because escalation_accepted_total_cents changed, order.net_contract_value_cents recomputes (invariant order-money-conservation)"
          - "because net_contract_value_cents changed, every ShipmentRelease on the order in status IN {HELD, CLEARED, STAGED, SITE_STORAGE} recomputes stage_billing_cents (calc stage_billing_allocation)"
          - "increments EngineeredOrder.version by 1"
      - from: SUBMITTED_TO_CUSTOMER
        to: DISPUTED
        trigger: "POST /escalation-adjustments/{id}/dispute"
        actor: CustomerReviewer
        preconditions:
          - "dispute_reason present and non-empty"
        side_effects:
          - "order posture_reason_codes gains ESCALATION_DISPUTED; production_posture recomputed to at least RESTRICTED"
          - "increments EngineeredOrder.version by 1"
      - from: DISPUTED
        to: RECALCULATING
        trigger: "POST /escalation-adjustments/{id}/recalculate"
        actor: ContractAdmin
        preconditions:
          - "EscalationClause.status IN {ACTIVE, LOCKED}"
          - "at least one CommodityIndexPoint with published_at <= logical clock exists for every commodity with a non-zero weight"
        side_effects:
          - "recalculation_round increases by 1"
          - "all computed component and amount fields are re-derived by calc material_escalation_amount using the same variant"
      - from: RECALCULATING
        to: SUBMITTED_TO_CUSTOMER
        trigger: "POST /escalation-adjustments/{id}/submit"
        actor: ContractAdmin
        preconditions:
          - "adjustment.status == RECALCULATING"
        side_effects:
          - "increments EngineeredOrder.version by 1"
        note: "Cycle SUBMITTED_TO_CUSTOMER -> DISPUTED -> RECALCULATING -> SUBMITTED_TO_CUSTOMER repeats per negotiation round."
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /escalation-adjustments/{id}/withdraw"
        actor: ContractAdmin
        preconditions:
          - "order.engineering_status != ENG_CLOSED"
          - "count of ShipmentRelease on the order with status == DELIVERED == 0"
        side_effects:
          - "order.escalation_accepted_total_cents decreases by adjustment_amount_cents (compensating action of the accept)"
          - "because escalation_accepted_total_cents changed, order.net_contract_value_cents recomputes to exactly its pre-accept value (invariant order-money-conservation)"
          - "because net_contract_value_cents changed, every ShipmentRelease on the order in status IN {HELD, CLEARED, STAGED, SITE_STORAGE} recomputes stage_billing_cents"
          - "increments EngineeredOrder.version by 1"
      - from: CALCULATED
        to: WITHDRAWN
        trigger: "POST /escalation-adjustments/{id}/withdraw"
        actor: ContractAdmin
        preconditions:
          - "adjustment.status == CALCULATED"
        side_effects:
          - "no ledger effect because the amount was never added to escalation_accepted_total_cents"

  - entity: ComponentAllocation
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED, PREEMPTED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /component-allocations/{id}/commit"
        actor: MaterialsPlanner
        preconditions:
          - "LongLeadComponent.status == ACTIVE"
          - "order.engineering_status == DESIGN_RELEASED"
          - "order.production_posture != FROZEN"
          - "allocation.quantity <= LongLeadComponent.quantity_on_hand - LongLeadComponent.quantity_committed"
        side_effects:
          - "committed_at := logical clock"
          - "LongLeadComponent.quantity_reserved decreases by quantity; quantity_committed increases by quantity; quantity_available unchanged"
          - "because the order may now hold zero RESERVED allocations, order.fulfillment_status is re-evaluated PLANNING -> MATERIAL_ALLOCATED"
      - from: COMMITTED
        to: CONSUMED
        trigger: "system: the order's FactoryAcceptanceTest enters PASSED"
        actor: system
        preconditions:
          - "order.fulfillment_status transition target == FAT_COMPLETE"
        side_effects:
          - "LongLeadComponent.quantity_committed decreases by quantity; quantity_consumed increases by quantity; quantity_on_hand decreases by quantity"
          - "the conserved quantity quantity_on_hand + quantity_consumed is unchanged by this transition"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /component-allocations/{id}/release"
        actor: MaterialsPlanner
        preconditions:
          - "allocation.status == RESERVED"
        side_effects:
          - "released_at := logical clock; release_penalty_cents := 0"
          - "LongLeadComponent.quantity_reserved decreases by quantity; quantity_available increases by quantity (restoring the exact pre-reservation value)"
      - from: COMMITTED
        to: RELEASED
        trigger: "POST /component-allocations/{id}/release"
        actor: MaterialsPlanner
        preconditions:
          - "allocation.status == COMMITTED"
          - "order.fulfillment_status != FAT_COMPLETE"
        side_effects:
          - "release_penalty_cents := calc allocation_release_penalty"
          - "LongLeadComponent.quantity_committed decreases by quantity; quantity_available increases by quantity; quantity_on_hand unchanged"
          - "because the order may now hold zero COMMITTED allocations, order.fulfillment_status is re-evaluated MATERIAL_ALLOCATED -> PLANNING"
        note: "Compensating pair with RESERVED -> COMMITTED: the conserved quantity quantity_on_hand + quantity_consumed is unchanged and quantity_available returns to its pre-commit value."
      - from: RESERVED
        to: PREEMPTED
        trigger: "system: POST /component-allocations creates a higher-priority allocation that cannot otherwise be satisfied"
        actor: system
        preconditions:
          - "LongLeadComponent.allocation_policy == PREEMPTIBLE"
          - "this allocation is the victim selected by calc preemption_victim_selector"
          - "incoming allocation.priority_class < this.priority_class (strictly smaller number wins)"
        side_effects:
          - "preempted_for_allocation_id := incoming allocation id; released_at := logical clock"
          - "LongLeadComponent.quantity_reserved decreases by quantity; quantity_available increases by quantity"
          - "because quantity_available rose, the incoming allocation is created in RESERVED against the freed units"
          - "because the victim order lost coverage, that order's production_posture recomputes to at least RESTRICTED with reason MATERIAL_PREEMPTED"
      - from: RESERVED
        to: RELEASED
        trigger: "system: a FailureAnalysisReport publish quarantines this allocation's component"
        actor: system
        preconditions:
          - "LongLeadComponent.status transition target == QUARANTINED"
        side_effects:
          - "release_penalty_cents := 0; released_at := logical clock"
          - "LongLeadComponent.quantity_reserved decreases by quantity; quantity_available increases by quantity"
          - "because the order lost coverage, that order's production_posture recomputes to FROZEN with reason COMPONENT_QUARANTINE"

  - entity: FactoryAcceptanceTest
    initial_state: REQUESTED
    terminal_states: [PASSED, ABANDONED]
    transitions:
      - from: REQUESTED
        to: BAY_SCHEDULED
        trigger: "POST /factory-acceptance-tests/{id}/schedule"
        actor: TestEngineer
        preconditions:
          - "TestBay.status == AVAILABLE (cross-entity dependency FactoryAcceptanceTest -> TestBay)"
          - "order.fulfillment_status IN {IN_PRODUCTION, FAT_COMPLETE}"
          - "order.rated_kv <= TestBay.max_kv"
          - "when fat.requires_impulse is true, TestBay.supports_impulse is true"
          - "the requested occupation window does not overlap any existing window on the bay per calc bay_occupation_window"
        side_effects:
          - "test_bay_id := body test_bay_id; window_end_at := calc bay_occupation_window"
          - "TestBay.scheduled_hours_total increases by test_duration_hours (invariant bay-hour-conservation)"
          - "when attempt_number > 1, order.fulfillment_status reverts FAT_COMPLETE -> IN_PRODUCTION"
      - from: BAY_SCHEDULED
        to: WITNESS_CONFIRMED
        trigger: "system: evaluated after every WitnessAssignment state change on this test"
        actor: system
        preconditions:
          - "fat.witness_required is false OR confirmed_witness_count >= 1"
        side_effects:
          - "recompute EngineeredOrder.production_posture"
      - from: WITNESS_CONFIRMED
        to: BAY_SCHEDULED
        trigger: "system: the last CONFIRMED WitnessAssignment on this test leaves CONFIRMED"
        actor: system
        preconditions:
          - "fat.witness_required is true"
          - "confirmed_witness_count == 0"
        side_effects:
          - "order posture_reason_codes gains WITNESS_MISSING"
        note: "Cycle BAY_SCHEDULED <-> WITNESS_CONFIRMED tracks witness churn without losing the bay window."
      - from: WITNESS_CONFIRMED
        to: IN_PROGRESS
        trigger: "POST /factory-acceptance-tests/{id}/start"
        actor: TestEngineer
        preconditions:
          - "logical clock >= fat.window_start_at"
          - "logical clock < fat.window_end_at"
          - "order.production_posture != FROZEN"
          - "every WitnessAssignment on this test in status CONFIRMED has WitnessParty.credential_expires_at > logical clock"
        side_effects:
          - "started_at := logical clock; run_by_user_id := acting X-User-ID"
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /factory-acceptance-tests/{id}/conclude with result == PASS"
        actor: TestEngineer
        preconditions:
          - "a TestReport on this test exists in status ISSUED with pass_result == PASS"
        side_effects:
          - "concluded_at := logical clock"
          - "order.fulfillment_status advances IN_PRODUCTION -> FAT_COMPLETE"
          - "because fulfillment_status advanced, every COMMITTED ComponentAllocation on the order becomes CONSUMED"
          - "because those allocations were consumed, each LongLeadComponent.quantity_on_hand and quantity_consumed adjust with their sum conserved"
          - "increments EngineeredOrder.version by 1"
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /factory-acceptance-tests/{id}/conclude with result == FAIL"
        actor: TestEngineer
        preconditions:
          - "a TestReport on this test exists in status ISSUED with pass_result == FAIL"
        side_effects:
          - "concluded_at := logical clock; TestBay.scheduled_hours_total decreases by test_duration_hours"
          - "CASCADE HOP 1 -> every ComplianceLabel whose test_report_id names a report on this test and whose status IN {GENERATED, VERIFIED, ISSUED} becomes VOIDED with void_reason FAT_FAILED"
          - "CASCADE HOP 2 -> because those labels were voided, every ShipmentRelease on the order in status CLEARED reverts to HELD"
          - "CASCADE HOP 3 -> because releases reverted to HELD, order.production_posture recomputes to FROZEN with reason LABEL_VOID"
          - "increments EngineeredOrder.version by 1"
        note: "Branch divergence from the PASS arm: no allocation consumption, and a three-hop invalidation cascade instead."
      - from: FAILED
        to: ABANDONED
        trigger: "system: POST /factory-acceptance-tests creates a retest naming this test"
        actor: system
        preconditions:
          - "the new test's retest_of_fat_id == this test.id"
        side_effects:
          - "retest.attempt_number := this.attempt_number + 1"
        note: "Retest cycle: FAILED -> (new REQUESTED) -> BAY_SCHEDULED -> ... -> PASSED."
      - from: BAY_SCHEDULED
        to: ABANDONED
        trigger: "POST /factory-acceptance-tests/{id}/abandon"
        actor: TestEngineer
        preconditions:
          - "logical clock < fat.window_start_at"
        side_effects:
          - "TestBay.scheduled_hours_total decreases by test_duration_hours (invariant bay-hour-conservation restores the pre-schedule total)"
          - "every WitnessAssignment on this test in status IN {INVITED, CONFIRMED} becomes RELEASED"
          - "because those assignments were released, each WitnessParty's daily confirmed load for the affected UTC day decreases"

  - entity: WitnessAssignment
    initial_state: INVITED
    terminal_states: [WAIVED, RELEASED]
    transitions:
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /witness-assignments/{id}/confirm"
        actor: CustomerWitness
        preconditions:
          - "WitnessParty.status == ACTIVE (cross-entity dependency WitnessAssignment -> WitnessParty)"
          - "WitnessParty.credential_expires_at > fat.window_start_at"
          - "fat.status IN {BAY_SCHEDULED, WITNESS_CONFIRMED}"
          - "the party's confirmed load for the test's UTC calendar day is strictly below WitnessParty.daily_witness_capacity per calc witness_daily_load"
          - "the test's UTC calendar day is not inside a blackout day set produced by another CONFIRMED assignment of the same party"
        side_effects:
          - "confirmed_at := logical clock; blackout_days := 0 when travel_region == NA else 1"
          - "fat.confirmed_witness_count increases by 1"
          - "because confirmed_witness_count reached 1, fat advances BAY_SCHEDULED -> WITNESS_CONFIRMED"
      - from: CONFIRMED
        to: DECLINED
        trigger: "POST /witness-assignments/{id}/decline"
        actor: CustomerWitness
        preconditions:
          - "fat.status IN {BAY_SCHEDULED, WITNESS_CONFIRMED}"
          - "decline_reason present and non-empty"
        side_effects:
          - "fat.confirmed_witness_count decreases by 1"
          - "because confirmed_witness_count fell to 0 while witness_required is true, fat reverts WITNESS_CONFIRMED -> BAY_SCHEDULED"
          - "because fat reverted, order posture_reason_codes gains WITNESS_MISSING and production_posture recomputes"
      - from: INVITED
        to: DECLINED
        trigger: "POST /witness-assignments/{id}/decline"
        actor: CustomerWitness
        preconditions:
          - "decline_reason present and non-empty"
        side_effects:
          - "no change to fat.confirmed_witness_count"
      - from: DECLINED
        to: INVITED
        trigger: "POST /witness-assignments/{id}/reinvite"
        actor: WitnessCoordinator
        preconditions:
          - "fat.status IN {BAY_SCHEDULED, WITNESS_CONFIRMED}"
          - "logical clock < fat.window_start_at"
        side_effects:
          - "decline_reason cleared"
        note: "Cycle INVITED -> CONFIRMED -> DECLINED -> INVITED supports unbounded witness renegotiation rounds."
      - from: INVITED
        to: WAIVED
        trigger: "POST /witness-assignments/{id}/waive"
        actor: WitnessCoordinator
        preconditions:
          - "fat.witness_required is true"
          - "count of WitnessAssignment on the test in status CONFIRMED == 0"
          - "logical clock < fat.window_start_at"
        side_effects:
          - "fat.witness_required := false"
          - "because witness_required became false, fat advances BAY_SCHEDULED -> WITNESS_CONFIRMED"
      - from: CONFIRMED
        to: RELEASED
        trigger: "system: the parent FactoryAcceptanceTest is abandoned"
        actor: system
        preconditions:
          - "fat.status transition target == ABANDONED"
        side_effects:
          - "fat.confirmed_witness_count decreases by 1"

  - entity: ComplianceLabel
    initial_state: DRAFT
    terminal_states: [ISSUED, VOIDED]
    transitions:
      - from: DRAFT
        to: GENERATED
        trigger: "POST /compliance-labels/{id}/generate"
        actor: ComplianceOfficer
        preconditions:
          - "the pinned TestReport.status == ISSUED with pass_result == PASS (cross-entity dependency ComplianceLabel -> TestReport)"
          - "the pinned SubmittalDrawing.status IN {APPROVED, APPROVED_AS_NOTED} (cross-entity dependency ComplianceLabel -> SubmittalDrawing)"
          - "pinned_drawing_revision == order.released_drawing_revision"
        side_effects:
          - "incident_energy_cal_cm2, ppe_category, arc_flash_boundary_mm and rating_text computed by calc arc_flash_label_values"
          - "generated_by_user_id := acting X-User-ID"
      - from: GENERATED
        to: VERIFIED
        trigger: "POST /compliance-labels/{id}/verify"
        actor: ComplianceOfficer
        preconditions:
          - "acting X-User-ID != label.generated_by_user_id (segregation of duties)"
          - "acting X-User-ID != the pinned SubmittalDrawing.authored_by_user_id (segregation of duties)"
          - "pinned_drawing_revision == order.released_drawing_revision"
        side_effects:
          - "verified_by_user_id := acting X-User-ID"
      - from: VERIFIED
        to: ISSUED
        trigger: "POST /compliance-labels/{id}/issue"
        actor: ComplianceOfficer
        preconditions:
          - "label.ppe_category <= 4"
          - "no other ComplianceLabel on the order in status ISSUED"
        side_effects:
          - "order.production_posture recomputed (LABEL_MISSING reason cleared)"
          - "increments EngineeredOrder.version by 1"
      - from: GENERATED
        to: STALE
        trigger: "system: a newer SubmittalDrawing revision on the order enters SUBMITTED"
        actor: system
        preconditions:
          - "the submitting drawing.revision_round > label.pinned_drawing_revision"
        side_effects:
          - "void_reason := DRAWING_SUPERSEDED"
      - from: VERIFIED
        to: STALE
        trigger: "system: a newer SubmittalDrawing revision on the order enters SUBMITTED"
        actor: system
        preconditions:
          - "the submitting drawing.revision_round > label.pinned_drawing_revision"
        side_effects:
          - "void_reason := DRAWING_SUPERSEDED; verified_by_user_id cleared so re-verification is required"
      - from: ISSUED
        to: STALE
        trigger: "system: a newer SubmittalDrawing revision on the order enters SUBMITTED"
        actor: system
        preconditions:
          - "the submitting drawing.revision_round > label.pinned_drawing_revision"
        side_effects:
          - "void_reason := DRAWING_SUPERSEDED"
          - "because the order lost its ISSUED label, every ShipmentRelease on the order in status CLEARED reverts to HELD"
          - "because releases reverted, order.production_posture recomputes to FROZEN with reason LABEL_STALE"
      - from: STALE
        to: VOIDED
        trigger: "POST /compliance-labels/{id}/void"
        actor: ComplianceOfficer
        preconditions:
          - "label.status == STALE"
        side_effects:
          - "void_reason preserved; a replacement label may now be created for the order"
        note: "Revert path ISSUED -> STALE -> VOIDED -> (new DRAFT) makes label lifecycle cyclic across revisions."
      - from: ISSUED
        to: VOIDED
        trigger: "system: the FactoryAcceptanceTest behind the pinned report concludes FAIL"
        actor: system
        preconditions:
          - "fat.status transition target == FAILED"
        side_effects:
          - "void_reason := FAT_FAILED"
          - "every ShipmentRelease on the order in status CLEARED reverts to HELD"

  - entity: TestReport
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /test-reports/{id}/issue"
        actor: TestEngineer
        preconditions:
          - "fat.status == IN_PROGRESS"
          - "acting X-User-ID == fat.run_by_user_id"
          - "when fat.requires_impulse is true, impulse_required_kv > 0"
        side_effects:
          - "pass_result and failed_criteria computed by calc test_report_verdict"
          - "issued_at := logical clock"
          - "any other TestReport on the same test in status ISSUED becomes SUPERSEDED"
      - from: ISSUED
        to: SUPERSEDED
        trigger: "system: a later TestReport on the same test is issued"
        actor: system
        preconditions:
          - "a sibling report on the same factory_acceptance_test_id transitioned to ISSUED"
        side_effects:
          - "every ComplianceLabel whose test_report_id names this report and whose status IN {GENERATED, VERIFIED} becomes STALE with void_reason REPORT_SUPERSEDED"

  - entity: ShipmentRelease
    initial_state: HELD
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: HELD
        to: CLEARED
        trigger: "POST /shipment-releases/{id}/clear"
        actor: LogisticsCoordinator
        preconditions:
          - "an ComplianceLabel on the order exists in status ISSUED (cross-entity dependency ShipmentRelease -> ComplianceLabel)"
          - "order.fulfillment_status IN {FAT_COMPLETE, SHIPPING}"
          - "order.production_posture != FROZEN"
          - "every ShipmentRelease on the order with a strictly smaller stage_index is in status IN {IN_TRANSIT, DELIVERED, CANCELLED}"
        side_effects:
          - "cleared_at := logical clock"
          - "stage_billing_cents recomputed by calc stage_billing_allocation"
      - from: CLEARED
        to: HELD
        trigger: "system: the order's ISSUED ComplianceLabel becomes STALE or VOIDED"
        actor: system
        preconditions:
          - "no ComplianceLabel on the order remains in status ISSUED"
        side_effects:
          - "cleared_at cleared"
          - "because the release reverted, order.production_posture recomputes to FROZEN with reason LABEL_VOID or LABEL_STALE"
      - from: CLEARED
        to: STAGED
        trigger: "POST /shipment-releases/{id}/stage"
        actor: LogisticsCoordinator
        preconditions:
          - "release.status == CLEARED"
        side_effects:
          - "no ledger effect"
      - from: STAGED
        to: SITE_STORAGE
        trigger: "POST /shipment-releases/{id}/site-storage-agreements"
        actor: LogisticsCoordinator
        preconditions:
          - "no SiteStorageAgreement on this release in status OPEN"
        side_effects:
          - "a SiteStorageAgreement is created in status OPEN with storage_start_at from the request body"
          - "order posture_reason_codes gains SITE_NOT_READY; production_posture recomputed to at least RESTRICTED"
      - from: SITE_STORAGE
        to: STAGED
        trigger: "POST /site-storage-agreements/{id}/close"
        actor: LogisticsCoordinator
        preconditions:
          - "agreement.status == OPEN"
          - "request body storage_end_at > agreement.storage_start_at"
        side_effects:
          - "agreement fee fields computed by calc site_storage_fee; agreement.status := CLOSED"
          - "release.storage_fee_accrued_cents increases by agreement.total_fee_cents"
          - "order posture_reason_codes loses SITE_NOT_READY; production_posture recomputed"
        note: "Cycle STAGED -> SITE_STORAGE -> STAGED may repeat, each pass adding a further SiteStorageAgreement."
      - from: STAGED
        to: IN_TRANSIT
        trigger: "POST /shipment-releases/{id}/ship"
        actor: LogisticsCoordinator
        preconditions:
          - "carrier_reference present and non-empty"
          - "no SiteStorageAgreement on this release in status OPEN"
          - "order.production_posture != FROZEN"
        side_effects:
          - "shipped_at := logical clock"
          - "order.billed_to_date_cents increases by stage_billing_cents"
          - "when this is the first release on the order to ship, order.fulfillment_status advances FAT_COMPLETE -> SHIPPING"
          - "increments EngineeredOrder.version by 1"
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipment-releases/{id}/deliver"
        actor: LogisticsCoordinator
        preconditions:
          - "release.status == IN_TRANSIT"
        side_effects:
          - "delivered_at := logical clock"
          - "a CommissioningJob may now be created against this release"
          - "increments EngineeredOrder.version by 1"
      - from: HELD
        to: CANCELLED
        trigger: "system: the order is cancelled"
        actor: system
        preconditions:
          - "order.fulfillment_status transition target == CANCELLED"
        side_effects:
          - "stage_billing_cents := 0"
          - "every SiteStorageAgreement on this release in status OPEN becomes WAIVED with total_fee_cents 0"

  - entity: SiteStorageAgreement
    initial_state: OPEN
    terminal_states: [CLOSED, WAIVED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /site-storage-agreements/{id}/close"
        actor: LogisticsCoordinator
        preconditions:
          - "release.status == SITE_STORAGE"
          - "storage_end_at > storage_start_at"
          - "storage_end_at <= logical clock"
        side_effects:
          - "billable_days, storage_subtotal_cents, insurance_surcharge_cents, long_stay_discount_cents and total_fee_cents computed by calc site_storage_fee"
          - "release.status reverts SITE_STORAGE -> STAGED"
          - "release.storage_fee_accrued_cents increases by total_fee_cents"
      - from: OPEN
        to: WAIVED
        trigger: "POST /site-storage-agreements/{id}/waive"
        actor: PlantAdmin
        preconditions:
          - "agreement.status == OPEN"
          - "acting role == PlantAdmin"
        side_effects:
          - "billable_days := 0; every fee field := 0; waived_by_user_id := acting X-User-ID"
          - "release.status reverts SITE_STORAGE -> STAGED"
          - "release.storage_fee_accrued_cents unchanged"

  - entity: CommissioningJob
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: MOBILIZED
        trigger: "POST /commissioning-jobs/{id}/mobilize"
        actor: FieldServiceEngineer
        preconditions:
          - "ShipmentRelease.status == DELIVERED (cross-entity dependency CommissioningJob -> ShipmentRelease)"
          - "logical clock >= job.mobilization_at"
          - "order.production_posture != FROZEN"
        side_effects:
          - "order.fulfillment_status advances SHIPPING -> COMMISSIONING"
          - "increments EngineeredOrder.version by 1"
      - from: MOBILIZED
        to: ENERGIZATION_PENDING
        trigger: "POST /commissioning-jobs/{id}/request-energization"
        actor: FieldServiceEngineer
        preconditions:
          - "an ComplianceLabel on the order exists in status ISSUED"
          - "job.blocking_punch_count == 0"
        side_effects:
          - "no ledger effect"
      - from: ENERGIZATION_PENDING
        to: PUNCH_OPEN
        trigger: "POST /commissioning-jobs/{id}/energize"
        actor: FieldServiceEngineer
        preconditions:
          - "job.status == ENERGIZATION_PENDING"
          - "order.production_posture != FROZEN"
        side_effects:
          - "energized_at := logical clock"
          - "completion_ratio_bp recomputed by calc punch_completion_ratio"
      - from: PUNCH_OPEN
        to: COMPLETE
        trigger: "system: evaluated after every PunchListItem state change on this job"
        actor: system
        preconditions:
          - "job.open_punch_count == 0"
          - "job.blocking_punch_count == 0"
          - "job.energized_at is not null"
        side_effects:
          - "startup_certificate_issued := true; completion_ratio_bp := 10000"
          - "because the job completed, order.fulfillment_status is re-evaluated COMMISSIONING -> CLOSED"
          - "increments EngineeredOrder.version by 1"
        note: "Compound/aggregate transition: the parent's state is a function of its children's states."
      - from: PUNCH_OPEN
        to: DEMOBILIZED_INCOMPLETE
        trigger: "POST /commissioning-jobs/{id}/demobilize"
        actor: FieldServiceEngineer
        preconditions:
          - "job.open_punch_count >= 1"
        side_effects:
          - "demobilization_round increases by 1"
          - "order posture_reason_codes gains COMMISSIONING_INCOMPLETE; production_posture recomputed to at least RESTRICTED"
      - from: DEMOBILIZED_INCOMPLETE
        to: MOBILIZED
        trigger: "POST /commissioning-jobs/{id}/mobilize"
        actor: FieldServiceEngineer
        preconditions:
          - "job.status == DEMOBILIZED_INCOMPLETE"
          - "order.production_posture != FROZEN"
        side_effects:
          - "order posture_reason_codes loses COMMISSIONING_INCOMPLETE; production_posture recomputed"
        note: "Cycle MOBILIZED -> PUNCH_OPEN -> DEMOBILIZED_INCOMPLETE -> MOBILIZED across return trips."
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /commissioning-jobs/{id}/cancel"
        actor: PlantAdmin
        preconditions:
          - "job.status == SCHEDULED"
        side_effects:
          - "every PunchListItem on this job in status IN {OPEN, ASSIGNED, RESOLVED} becomes REJECTED"

  - entity: PunchListItem
    initial_state: OPEN
    terminal_states: [CLOSED, REJECTED]
    transitions:
      - from: OPEN
        to: ASSIGNED
        trigger: "POST /punch-list-items/{id}/assign"
        actor: FieldServiceEngineer
        preconditions:
          - "job.status IN {PUNCH_OPEN, DEMOBILIZED_INCOMPLETE}"
        side_effects:
          - "assigned_to_user_id := body assignee_user_id"
      - from: ASSIGNED
        to: RESOLVED
        trigger: "POST /punch-list-items/{id}/resolve"
        actor: FieldServiceEngineer
        preconditions:
          - "item.status == ASSIGNED"
        side_effects:
          - "resolved_by_user_id := acting X-User-ID"
          - "job.completion_ratio_bp recomputed by calc punch_completion_ratio"
      - from: RESOLVED
        to: CLOSED
        trigger: "POST /punch-list-items/{id}/close"
        actor: QualityEngineer
        preconditions:
          - "acting X-User-ID != item.resolved_by_user_id (segregation of duties)"
          - "job.status IN {PUNCH_OPEN, DEMOBILIZED_INCOMPLETE}"
        side_effects:
          - "closed_at := logical clock; closed_by_user_id := acting X-User-ID"
          - "job.open_punch_count decreases by 1 and blocking_punch_count decreases by 1 when severity == BLOCKING"
          - "because open_punch_count may have reached 0, job is re-evaluated PUNCH_OPEN -> COMPLETE"
      - from: RESOLVED
        to: OPEN
        trigger: "POST /punch-list-items/{id}/reject"
        actor: QualityEngineer
        preconditions:
          - "acting X-User-ID != item.resolved_by_user_id (segregation of duties)"
        side_effects:
          - "reject_count increases by 1; assigned_to_user_id and resolved_by_user_id cleared"
          - "job.completion_ratio_bp recomputed"
        note: "Cycle OPEN -> ASSIGNED -> RESOLVED -> OPEN repeats per remediation round."
      - from: OPEN
        to: REJECTED
        trigger: "system: the parent CommissioningJob is cancelled"
        actor: system
        preconditions:
          - "job.status transition target == CANCELLED"
        side_effects:
          - "job.open_punch_count and blocking_punch_count recomputed"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [SETTLED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: RMA_ISSUED
        trigger: "POST /warranty-claims/{id}/issue-rma"
        actor: QualityEngineer
        preconditions:
          - "a CommissioningJob on the order exists in status COMPLETE (cross-entity dependency WarrantyClaim -> CommissioningJob)"
          - "claim.failure_reported_at is strictly before the warranty expiry computed by calc warranty_window_expiry"
          - "order.fulfillment_status != CANCELLED"
        side_effects:
          - "rma_number minted; liability_cap_cents computed by calc warranty_liability_cap"
      - from: RMA_ISSUED
        to: UNIT_RECEIVED
        trigger: "POST /warranty-claims/{id}/receive-unit"
        actor: QualityEngineer
        preconditions:
          - "claim.status == RMA_ISSUED"
        side_effects:
          - "no ledger effect"
      - from: UNIT_RECEIVED
        to: ANALYSIS_IN_PROGRESS
        trigger: "POST /warranty-claims/{id}/failure-analysis-reports"
        actor: QualityEngineer
        preconditions:
          - "no FailureAnalysisReport on the claim in status DRAFT"
        side_effects:
          - "a FailureAnalysisReport is created in status DRAFT"
      - from: ANALYSIS_IN_PROGRESS
        to: WARRANTABLE
        trigger: "system: a FailureAnalysisReport on the claim enters PUBLISHED with root_cause_code IN {SUPPLIER_DEFECT, WORKMANSHIP}"
        actor: system
        preconditions:
          - "report.status transition target == PUBLISHED"
        side_effects:
          - "credit_issued_cents and bucket_allocation computed by calc warranty_credit_waterfall"
      - from: ANALYSIS_IN_PROGRESS
        to: NON_WARRANTABLE
        trigger: "system: a FailureAnalysisReport on the claim enters PUBLISHED with root_cause_code IN {MISAPPLICATION, TRANSPORT_DAMAGE, UNDETERMINED}"
        actor: system
        preconditions:
          - "report.status transition target == PUBLISHED"
        side_effects:
          - "credit_issued_cents := 0; bucket_allocation := all buckets 0"
        note: "Branch divergence: only the WARRANTABLE arm runs the credit waterfall."
      - from: WARRANTABLE
        to: ANALYSIS_IN_PROGRESS
        trigger: "system: the deciding FailureAnalysisReport is RETRACTED"
        actor: system
        preconditions:
          - "report.status transition target == RETRACTED"
        side_effects:
          - "analysis_round increases by 1; credit_issued_cents := 0; bucket_allocation cleared"
        note: "Cycle ANALYSIS_IN_PROGRESS -> WARRANTABLE -> ANALYSIS_IN_PROGRESS on retraction."
      - from: NON_WARRANTABLE
        to: ANALYSIS_IN_PROGRESS
        trigger: "system: the deciding FailureAnalysisReport is RETRACTED"
        actor: system
        preconditions:
          - "report.status transition target == RETRACTED"
        side_effects:
          - "analysis_round increases by 1"
      - from: WARRANTABLE
        to: SETTLED
        trigger: "POST /warranty-claims/{id}/settle"
        actor: ContractAdmin
        preconditions:
          - "acting X-User-ID differs from authored_by_user_id of every FailureAnalysisReport on the claim in status PUBLISHED (segregation of duties)"
          - "credit_issued_cents <= liability_cap_cents"
        side_effects:
          - "settled_by_user_id := acting X-User-ID"
          - "order.warranty_credit_total_cents increases by credit_issued_cents"
          - "because warranty_credit_total_cents changed, order.net_contract_value_cents recomputes (invariant order-money-conservation)"
          - "increments EngineeredOrder.version by 1"
      - from: NON_WARRANTABLE
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/reject"
        actor: ContractAdmin
        preconditions:
          - "claim.status == NON_WARRANTABLE"
        side_effects:
          - "no ledger effect"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /warranty-claims/{id}/reject"
        actor: ContractAdmin
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "no ledger effect"

  - entity: FailureAnalysisReport
    initial_state: DRAFT
    terminal_states: [RETRACTED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /failure-analysis-reports/{id}/publish"
        actor: QualityEngineer
        preconditions:
          - "claim.status == ANALYSIS_IN_PROGRESS"
          - "when root_cause_code == SUPPLIER_DEFECT, attributed_supplier_id is not null"
          - "when root_cause_code != SUPPLIER_DEFECT, attributed_supplier_id is null"
        side_effects:
          - "published_at := logical clock"
          - "CASCADE HOP 1 -> claim advances ANALYSIS_IN_PROGRESS -> WARRANTABLE or NON_WARRANTABLE per root_cause_code, and the WARRANTABLE arm computes credit_issued_cents"
          - "CASCADE HOP 2 -> because the claim became WARRANTABLE with quarantine_recommended true and root_cause_code SUPPLIER_DEFECT, the claim's suspect LongLeadComponent moves ACTIVE -> QUARANTINED"
          - "CASCADE HOP 3 -> because that component was quarantined, every ComponentAllocation on it in status RESERVED becomes RELEASED and the component recomputes quantity_reserved and quantity_available"
          - "CASCADE HOP 4 -> because those allocations released, each affected EngineeredOrder recomputes production_posture to FROZEN with reason COMPONENT_QUARANTINE"
          - "CASCADE HOP 5 -> because a PUBLISHED report now names the supplier, Supplier.attributed_failure_count increases by 1 and both quality index variants are recomputed by calc supplier_quality_index"
          - "CASCADE HOP 6 -> because quality_index_trailing fell below 70.00, Supplier moves APPROVED -> PROBATION and probation_entered_at := logical clock"
        note: "Six-hop cascade; every hop is caused by the preceding hop, not by the publish call itself."
      - from: PUBLISHED
        to: RETRACTED
        trigger: "POST /failure-analysis-reports/{id}/retract"
        actor: QualityEngineer
        preconditions:
          - "claim.status IN {WARRANTABLE, NON_WARRANTABLE}"
          - "retraction_reason present and non-empty"
        side_effects:
          - "claim reverts to ANALYSIS_IN_PROGRESS with analysis_round increased by 1"
          - "Supplier.attributed_failure_count decreases by 1 and both quality index variants are recomputed"
          - "the suspect LongLeadComponent reverts QUARANTINED -> ACTIVE when no other PUBLISHED report recommends its quarantine"
      - from: DRAFT
        to: RETRACTED
        trigger: "POST /failure-analysis-reports/{id}/retract"
        actor: QualityEngineer
        preconditions:
          - "report.status == DRAFT"
          - "retraction_reason present and non-empty"
        side_effects:
          - "no supplier or component effect because the report was never published"

  - entity: LongLeadComponent
    initial_state: ACTIVE
    terminal_states: [OBSOLETE]
    transitions:
      - from: ACTIVE
        to: QUARANTINED
        trigger: "system: a FailureAnalysisReport naming this component publishes with quarantine_recommended true"
        actor: system
        preconditions:
          - "report.root_cause_code == SUPPLIER_DEFECT"
        side_effects:
          - "quarantine_reason := FAILURE_ANALYSIS"
          - "every ComponentAllocation on this component in status RESERVED becomes RELEASED"
      - from: QUARANTINED
        to: ACTIVE
        trigger: "POST /long-lead-components/{id}/release-quarantine"
        actor: MaterialsPlanner
        preconditions:
          - "no FailureAnalysisReport in status PUBLISHED with quarantine_recommended true names this component"
        side_effects:
          - "quarantine_reason cleared"
        note: "Cycle ACTIVE -> QUARANTINED -> ACTIVE."
      - from: ACTIVE
        to: OBSOLETE
        trigger: "POST /long-lead-components/{id}/obsolete"
        actor: PlantAdmin
        preconditions:
          - "count of ComponentAllocation on this component in status IN {RESERVED, COMMITTED} == 0"
        side_effects:
          - "component is excluded from every future allocation candidate set"

  - entity: Supplier
    initial_state: APPROVED
    terminal_states: [SUSPENDED]
    transitions:
      - from: APPROVED
        to: PROBATION
        trigger: "system: quality_index_trailing recomputes strictly below 70.00"
        actor: system
        preconditions:
          - "supplier.quality_index_trailing < 70.00"
        side_effects:
          - "probation_entered_at := logical clock"
      - from: PROBATION
        to: APPROVED
        trigger: "system: quality_index_trailing recomputes to 70.00 or above"
        actor: system
        preconditions:
          - "supplier.quality_index_trailing >= 70.00"
        side_effects:
          - "probation_entered_at cleared"
        note: "Cycle APPROVED -> PROBATION -> APPROVED tracks index churn; 70.00 exactly returns the supplier to APPROVED."
      - from: PROBATION
        to: SUSPENDED
        trigger: "POST /suppliers/{id}/suspend"
        actor: PlantAdmin
        preconditions:
          - "supplier.quality_index_lifetime < 60.00"
        side_effects:
          - "every LongLeadComponent of this supplier in status ACTIVE becomes QUARANTINED with quarantine_reason SUPPLIER_SUSPENDED"
          - "because those components were quarantined, every ComponentAllocation on them in status RESERVED becomes RELEASED"
          - "because those allocations released, each affected EngineeredOrder recomputes production_posture to FROZEN"

concurrency_rules:
  - rule_id: submittal-revision-create-stale-order
    parent_entity: EngineeredOrder
    write_endpoint: "POST /engineered-orders/{id}/submittal-drawings"
    occ_field: "expected_engineered_order_version"
    description: |
      Creating a new SubmittalDrawing revision against an EngineeredOrder whose
      version has advanced since the client last read it is rejected. A new
      revision legitimately supersedes the prior revision and voids sibling
      in-review packages, so a writer holding a stale view of the order would
      otherwise author a revision on top of a released design it never saw.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: escalation-adjustment-create-stale-order
    parent_entity: EngineeredOrder
    write_endpoint: "POST /engineered-orders/{id}/escalation-adjustments"
    occ_field: "expected_engineered_order_version"
    description: |
      Creating an EscalationAdjustment against an EngineeredOrder whose version
      has advanced since the client last read it is rejected. A newly computed
      adjustment legitimately supersedes an earlier PROVISIONAL amount, so a
      writer working from a stale order view would compute against an
      escalation_accepted_total_cents that has already moved.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: allocation-create-stale-component
    parent_entity: LongLeadComponent
    write_endpoint: "POST /component-allocations"
    occ_field: "expected_component_version"
    description: |
      Creating a ComponentAllocation against a LongLeadComponent whose version
      has advanced since the client last read it is rejected. Additional
      allocations on the same component are legitimate under the product rules,
      and a preempting allocation can silently reshuffle the pool, so a writer
      holding a stale component view would reserve against an availability
      figure that no longer holds.
    error_id: ERR_STALE_COMPONENT_VERSION
    http_status: 412

  - rule_id: label-create-stale-order
    parent_entity: EngineeredOrder
    write_endpoint: "POST /engineered-orders/{id}/compliance-labels"
    occ_field: "expected_engineered_order_version"
    description: |
      Creating a ComplianceLabel against an EngineeredOrder whose version has
      advanced since the client last read it is rejected. A replacement label
      legitimately supersedes an earlier VOIDED label and pins the order's
      released drawing revision, so a stale order view would pin a revision the
      order has already moved past.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

  - rule_id: shipment-release-create-stale-order
    parent_entity: EngineeredOrder
    write_endpoint: "POST /engineered-orders/{id}/shipment-releases"
    occ_field: "expected_engineered_order_version"
    description: |
      Creating a ShipmentRelease against an EngineeredOrder whose version has
      advanced since the client last read it is rejected. Adding a stage is
      legitimate at any point before order closure and every stage's
      stage_billing_cents is derived from net_contract_value_cents, so a writer
      with a stale order view would allocate stage billing over a contract value
      that has already changed.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

calculations:
  - name: material_escalation_amount
    trigger: "POST /engineered-orders/{id}/escalation-adjustments and POST /escalation-adjustments/{id}/recalculate"
    algorithm: tiered_pricing
    formula: |
      # ---- Step 1: usable index points -------------------------------------
      usable(c) = CommodityIndexPoint rows where commodity == c
                  AND published_at <= logical_clock
                  AND (variant == PROVISIONAL OR is_provisional == false)
      base(c)   = index_value of the usable(c) row whose index_month == clause.base_index_month
                  (absent -> ERR_INDEX_POINT_MISSING)

      # ---- Step 2: current level, per variant -------------------------------
      variant PROVISIONAL:
        cur(c) = index_value of the usable(c) row with the greatest index_month
                 that is <= clause.final_window_end_month
                 (index_month is unique per commodity so no tie is possible)
      variant FINAL:
        months(c) = usable(c) rows whose index_month lies in the INCLUSIVE range
                    [clause.base_index_month + 1 month, clause.final_window_end_month],
                    processed in ascending index_month order
        empty months(c) -> ERR_INDEX_WINDOW_EMPTY
        cur(c) = round_half_up(sum(index_value over months(c)) / count(months(c)), 4)

      # ---- Step 3: per-commodity component, ROUNDED BEFORE SUMMING ---------
      weight_bp(COPPER)     = clause.copper_weight_bp
      weight_bp(ALUMINUM)   = clause.aluminum_weight_bp
      weight_bp(CORE_STEEL) = clause.core_steel_weight_bp
      raw(c)       = clause.escalatable_base_cents * (weight_bp(c) / 10000)
                     * ((cur(c) - base(c)) / base(c))
      component(c) = round_half_up(raw(c), 0)        # whole cents, PER COMMODITY

      # PINNED ROUNDING ORDER: round each of the three commodity components to
      # whole cents FIRST, then sum. Summing the unrounded raw(c) values and
      # rounding once at the end is explicitly NOT the rule and can differ by up
      # to 1 cent per commodity.
      raw_movement_cents = component(COPPER) + component(ALUMINUM) + component(CORE_STEEL)

      # ---- Step 4: collar deadband ------------------------------------------
      collar_cents = round_half_up(clause.escalatable_base_cents * clause.collar_bp / 10000, 0)
      if abs(raw_movement_cents) < collar_cents:          # STRICTLY less absorbs
          adjustment_amount_cents = 0 ; collar_absorbed = true ; cap_applied = false ; STOP
      # abs(raw_movement_cents) == collar_cents does NOT absorb

      # ---- Step 5: de-escalation switch -------------------------------------
      if raw_movement_cents < 0 AND clause.de_escalation_enabled == false:
          adjustment_amount_cents = 0 ; collar_absorbed = false ; cap_applied = false ; STOP

      # ---- Step 6: cap clamp ------------------------------------------------
      cap_cents = round_half_up(clause.escalatable_base_cents * clause.cap_bp / 10000, 0)
      adjustment_amount_cents = max(-cap_cents, min(raw_movement_cents, cap_cents))
      cap_applied = (adjustment_amount_cents != raw_movement_cents)
      index_months_used = ascending sorted distinct index_month values consumed above
    input_set: |
      CommodityIndexPoint rows with published_at <= logical clock. The
      PROVISIONAL variant accepts is_provisional true or false; the FINAL variant
      excludes is_provisional == true rows entirely. EscalationClause fields are
      read from the clause row named by the adjustment's escalation_clause_id,
      whose status must be ACTIVE or LOCKED.
    constants:
      BP_DIVISOR: 10000
      INDEX_MEAN_DECIMALS: 4
    precision: "whole cents; round_half_up applied per commodity component before summation; index means round_half_up to 4 decimals"
    variants:
      - name: PROVISIONAL
        when: "adjustment.variant == PROVISIONAL; used before the FINAL window has fully published"
        difference: "Uses a single spot index level (the latest usable month at or before final_window_end_month) and admits provisional prints, so it reacts to the most recent month only."
      - name: FINAL
        when: "adjustment.variant == FINAL; requires order.engineering_status == DESIGN_RELEASED to be accepted"
        difference: "Uses the arithmetic mean of every usable non-provisional month strictly after base_index_month through final_window_end_month, so identical index data yields a different amount than PROVISIONAL whenever the series is not flat."

  - name: supplier_quality_index
    trigger: "system: after any FailureAnalysisReport enters PUBLISHED or RETRACTED, and after POST /suppliers/{id}/receipt-events"
    algorithm: weighted_scoring
    formula: |
      considered(TRAILING) =
        FailureAnalysisReport rows with attributed_supplier_id == supplier.id
        AND status == PUBLISHED,
        sorted by published_at ASC with tie-break created_at ASC,
        then keeping only the LAST 8 entries of that ordering
      considered(LIFETIME) =
        FailureAnalysisReport rows with attributed_supplier_id == supplier.id
        AND status == PUBLISHED (no window, no cap)

      denominator(TRAILING) = max(supplier.receipt_event_count, 8)
      denominator(LIFETIME) = max(supplier.receipt_event_count, 1)

      penalty(V) = sum(defect_weight over considered(V)) * 100.0 / (denominator(V) * 10)
      index(V)   = round_half_up(100.00 - penalty(V), 2)
      index(V)   = min(100.00, max(0.00, index(V)))

      quality_index_trailing := index(TRAILING)
      quality_index_lifetime := index(LIFETIME)
    input_set: "Only FailureAnalysisReport rows in status PUBLISHED participate; DRAFT and RETRACTED rows are excluded from both variants."
    constants:
      TRAILING_WINDOW_SIZE: 8
      MIN_TRAILING_DENOMINATOR: 8
      PROBATION_THRESHOLD: 70.00
      SUSPENSION_THRESHOLD: 60.00
    precision: "2 decimal places, round_half_up, floor 0.00 and ceiling 100.00"
    variants:
      - name: TRAILING
        when: "always computed into quality_index_trailing; drives the APPROVED/PROBATION cycle"
        difference: "Counts at most the 8 most recent published reports and floors the denominator at 8, so an older cluster of defects drops out of the score entirely."
      - name: LIFETIME
        when: "always computed into quality_index_lifetime; drives PlantAdmin suspension eligibility"
        difference: "Counts every published report ever attributed and floors the denominator at 1, so the same report set yields a strictly lower or equal index than TRAILING once more than 8 reports exist."

  - name: site_storage_fee
    trigger: "POST /site-storage-agreements/{id}/close"
    algorithm: tiered_pricing
    formula: |
      # ---- Step 1: billable days (half-open interval, ceiling) --------------
      elapsed_hours  = (storage_end_at - storage_start_at) in hours, exact
      billable_days  = ceil(elapsed_hours / 24)      # any partial day counts whole
      billable_days  = max(billable_days, 1)         # an interval under 24h bills 1 day

      # ---- Step 2: marginal per-day bands on billable_days -----------------
      band_1_days = min(billable_days, 30)
      band_2_days = min(max(billable_days - 30, 0), 60)     # days 31..90
      band_3_days = max(billable_days - 90, 0)              # days 91+
      storage_subtotal_cents = round_half_up(
          (band_1_days * 1200 + band_2_days * 900 + band_3_days * 700) * crate_count, 0)

      # ---- Step 3: insurance surcharge -------------------------------------
      insurance_surcharge_cents = round_half_up(
          min(insured_value_cents * 3 / 10000, storage_subtotal_cents * 25 / 100), 0)

      # ---- Step 4: pre-discount grand total --------------------------------
      pre_discount_total = storage_subtotal_cents + insurance_surcharge_cents

      # ---- Step 5: long-stay discount keyed on the PRE-discount total ------
      if   pre_discount_total <  500000: discount_bp = 0
      elif pre_discount_total < 2000000: discount_bp = 300
      else:                              discount_bp = 750
      long_stay_discount_cents = round_half_up(pre_discount_total * discount_bp / 10000, 0)

      # ---- Step 6: final total ---------------------------------------------
      total_fee_cents = pre_discount_total - long_stay_discount_cents

      # PINNED EVALUATION ORDER: the discount tier is selected from
      # pre_discount_total (Step 4) and is NEVER re-evaluated against
      # total_fee_cents. The dependency looks circular - the total needs the
      # discount and the discount tier needs the total - and this pin is what
      # makes the value well-defined. Re-running Step 5 against total_fee_cents
      # would drop some agreements into a lower band.
    input_set: "A single SiteStorageAgreement row in status OPEN, using its own crate_count and insured_value_cents; no sibling agreements participate."
    constants:
      BAND_1_RATE_CENTS_PER_CRATE_DAY: 1200
      BAND_2_RATE_CENTS_PER_CRATE_DAY: 900
      BAND_3_RATE_CENTS_PER_CRATE_DAY: 700
      BAND_1_LIMIT_DAYS: 30
      BAND_2_LIMIT_DAYS: 90
      INSURANCE_RATE_BP: 3
      INSURANCE_CAP_PCT_OF_SUBTOTAL: 25
      DISCOUNT_TIER_1_CENTS: 500000
      DISCOUNT_TIER_2_CENTS: 2000000
      DISCOUNT_TIER_1_BP: 300
      DISCOUNT_TIER_2_BP: 750
    precision: "whole cents, round_half_up at each of Steps 2, 3 and 5; days rounded by ceiling"

  - name: component_availability
    trigger: "system: after every ComponentAllocation state change and after POST /long-lead-components/{id}/receipts"
    algorithm: aggregation
    formula: |
      quantity_reserved  = sum(ComponentAllocation.quantity where long_lead_component_id == component.id
                               AND status == RESERVED)
      quantity_committed = sum(ComponentAllocation.quantity where long_lead_component_id == component.id
                               AND status == COMMITTED)
      quantity_consumed  = sum(ComponentAllocation.quantity where long_lead_component_id == component.id
                               AND status == CONSUMED)
      quantity_available = quantity_on_hand - quantity_reserved - quantity_committed

      # sufficiency test for a new allocation of q units:
      #   q <= quantity_available  ->  accepted
      #   q == quantity_available  ->  accepted (exact drain is legal)
      #   q == quantity_available + 1 -> ERR_COMPONENT_INSUFFICIENT (after the
      #   preemption_victim_selector has been given its chance to free units)
      #
      # INVARIANT component-unit-conservation:
      #   quantity_on_hand + quantity_consumed is unchanged by RESERVE, COMMIT,
      #   RELEASE and PREEMPT; only receipts increase it and only CONSUME moves
      #   units between the two terms.
      #   quantity_on_hand == quantity_available + quantity_reserved + quantity_committed
      #   holds after every mutation.
    input_set: "ComponentAllocation rows in states RESERVED, COMMITTED and CONSUMED only; RELEASED and PREEMPTED rows are excluded from every term."
    constants: {}
    precision: "integer units, no rounding"

  - name: bay_occupation_window
    trigger: "POST /factory-acceptance-tests/{id}/schedule"
    algorithm: interval_merge
    formula: |
      window_end_at = window_start_at + (test_duration_hours + bay.changeover_buffer_hours) hours
      # the changeover buffer is INSIDE the occupying window, not a gap between windows
      occupied(bay) = FactoryAcceptanceTest rows with test_bay_id == bay.id
                      AND status IN {BAY_SCHEDULED, WITNESS_CONFIRMED, IN_PROGRESS}
      conflict(candidate) = EXISTS e IN occupied(bay) where
                      e.window_start_at < candidate.window_end_at
                      AND candidate.window_start_at < e.window_end_at
      # HALF-OPEN [start, end): a candidate whose window_start_at equals an
      # existing window_end_at is ACCEPTED - back-to-back scheduling is legal
      # because the buffer is already inside the earlier window.
      conflict -> ERR_BAY_WINDOW_CONFLICT
      TestBay.scheduled_hours_total = sum(test_duration_hours over occupied(bay))
      # INVARIANT bay-hour-conservation: schedule(+h) followed by abandon(-h) or
      # conclude-FAIL(-h) returns scheduled_hours_total to its exact prior value.
    input_set: "FactoryAcceptanceTest rows on the same test_bay_id in states BAY_SCHEDULED, WITNESS_CONFIRMED or IN_PROGRESS; REQUESTED, PASSED, FAILED and ABANDONED rows never occupy the bay."
    constants: {}
    precision: "whole hours; instants compared at second granularity"

  - name: witness_daily_load
    trigger: "POST /witness-assignments/{id}/confirm"
    algorithm: aggregation
    formula: |
      day(f) = the UTC calendar date (YYYY-MM-DD, time of day discarded) of
               f.window_start_at
      confirmed(party) = WitnessAssignment rows with witness_party_id == party.id
                         AND status == CONFIRMED
      load(party, d) = count of a IN confirmed(party) where day(a.parent_fat) == d

      # ---- capacity check (strictly-less-than BEFORE adding the candidate) --
      load(party, day(candidate_fat)) < party.daily_witness_capacity   -> allowed
      otherwise -> ERR_WITNESS_DAY_CAPACITY

      # ---- travel blackout, computed as a DAY SET, not an interval ---------
      blackout(a) = {} when a.travel_region == NA
                    else { day(a.parent_fat) - 1 day, day(a.parent_fat) + 1 day }
      reject when day(candidate_fat) IN union(blackout(a) for a IN confirmed(party))
      reject when day(a.parent_fat) IN blackout(candidate) for any a IN confirmed(party)
      either rejection -> ERR_WITNESS_TRAVEL_BLACKOUT
      # NOTE the interval semantics differ deliberately from bay_occupation_window:
      # this rule buckets to whole UTC calendar days and tests set membership plus
      # an aggregate per-day count; it never compares half-open instant intervals.
    input_set: "WitnessAssignment rows in status CONFIRMED only; INVITED, DECLINED, WAIVED and RELEASED rows contribute neither load nor blackout days."
    constants:
      PLANT_REGION: NA
      BLACKOUT_DAYS_EACH_SIDE: 1
    precision: "integer counts; dates compared at UTC calendar-day granularity"

  - name: order_production_posture
    trigger: "system: after every mutation that touches any child of the order (drawings, adjustments, allocations, tests, witness assignments, labels, releases, storage agreements, commissioning jobs, punch items, warranty claims)"
    algorithm: constraint_propagation
    formula: |
      # Reason codes are evaluated in this exact fixed order and collected into a set.
      FROZEN_CLASS:
        ORDER_CANCELLED        when order.fulfillment_status == CANCELLED
        ORDER_CLOSED           when order.engineering_status == ENG_CLOSED
        COMPONENT_QUARANTINE   when count(ComponentAllocation on the order with
                                 status == RELEASED whose LongLeadComponent.status == QUARANTINED) >= 1
                                 AND order.fulfillment_status IN {PLANNING, MATERIAL_ALLOCATED, IN_PRODUCTION}
        LABEL_VOID             when count(ComplianceLabel on the order with status == VOIDED) >= 1
                                 AND count(ComplianceLabel on the order with status == ISSUED) == 0
                                 AND order.fulfillment_status IN {FAT_COMPLETE, SHIPPING}
        LABEL_STALE            when count(ComplianceLabel on the order with status == STALE) >= 1
                                 AND count(ComplianceLabel on the order with status == ISSUED) == 0
      RESTRICTED_CLASS:
        SUBMITTAL_REJECTED     when count(SubmittalDrawing on the order with status == REVISE_AND_RESUBMIT) >= 1
                                 AND count(SubmittalDrawing on the order with status IN {APPROVED, APPROVED_AS_NOTED}) == 0
        MATERIAL_INCOMPLETE    when order.fulfillment_status == PLANNING
                                 AND count(ComponentAllocation on the order with status IN {RESERVED, COMMITTED}) == 0
                                 AND count(ComponentAllocation on the order with status == RELEASED) >= 1
        MATERIAL_PREEMPTED     when count(ComponentAllocation on the order with status == PREEMPTED) >= 1
                                 AND count(ComponentAllocation on the order with status == COMMITTED) == 0
        ESCALATION_DISPUTED    when count(EscalationAdjustment on the order with status IN {DISPUTED, RECALCULATING}) >= 1
        WITNESS_MISSING        when count(FactoryAcceptanceTest on the order with status == BAY_SCHEDULED
                                 AND witness_required == true AND confirmed_witness_count == 0) >= 1
        SITE_NOT_READY         when count(SiteStorageAgreement in status OPEN under any ShipmentRelease of the order) >= 1
        COMMISSIONING_INCOMPLETE when count(CommissioningJob on the order with status == DEMOBILIZED_INCOMPLETE) >= 1
        ORDER_FULFILLED        when order.fulfillment_status == CLOSED

      production_posture = FROZEN     when the collected set contains any FROZEN_CLASS code
                         = RESTRICTED when it contains no FROZEN_CLASS code but at least one RESTRICTED_CLASS code
                         = OPEN       when the collected set is empty
      posture_reason_codes = the collected codes sorted ascending lexicographically;
                             the empty array when posture is OPEN
    input_set: "All non-terminal and terminal children of the order as filtered above; the evaluation reads current persisted child states only, never historical ones."
    constants: {}
    precision: "enum output plus a lexicographically sorted string array"

  - name: arc_flash_label_values
    trigger: "POST /compliance-labels/{id}/generate"
    algorithm: threshold
    formula: |
      kv_factor = 1.00 when order.rated_kv <= 15
                = 1.25 when order.rated_kv >  15 AND order.rated_kv <= 38
                = 1.60 when order.rated_kv >  38
      raw_energy = 512000.0 * report.short_circuit_current_ka
                   * (report.arc_duration_ms / 1000.0) * kv_factor
                   / (report.working_distance_mm * report.working_distance_mm)
      incident_energy_cal_cm2 = round_ceiling(raw_energy, 1)   # ALWAYS rounded UP
                                                              # to 1 decimal, never half-up
      # PPE tiers, inclusive lower bounds on the ROUNDED-UP value:
      ppe_category = 0 when incident_energy_cal_cm2 <  1.2
                   = 1 when incident_energy_cal_cm2 >= 1.2  AND < 4.0
                   = 2 when incident_energy_cal_cm2 >= 4.0  AND < 8.0
                   = 3 when incident_energy_cal_cm2 >= 8.0  AND < 25.0
                   = 4 when incident_energy_cal_cm2 >= 25.0 AND < 40.0
      incident_energy_cal_cm2 >= 40.0 -> ERR_ARC_ENERGY_UNLABELABLE (no label produced)
      # exactly 1.2 is category 1, not 0; exactly 40.0 is unlabelable, not category 4

      arc_flash_boundary_mm = round_ceiling(
          sqrt(512000.0 * report.short_circuit_current_ka
               * (report.arc_duration_ms / 1000.0) * kv_factor / 1.2), 0)
      rating_text = concat(order.rated_kv, "kV / ",
                           report.short_circuit_current_ka, "kA / PPE ", ppe_category)
    input_set: "The single TestReport named by label.test_report_id, which must be in status ISSUED with pass_result == PASS, plus the parent order's rated_kv."
    constants:
      ENERGY_COEFFICIENT: 512000.0
      REFERENCE_ENERGY_CAL_CM2: 1.2
      MAX_LABELABLE_CAL_CM2: 40.0
    precision: "incident energy rounded UP (ceiling) to 1 decimal; boundary distance rounded UP (ceiling) to whole mm"

  - name: test_report_verdict
    trigger: "POST /test-reports/{id}/issue"
    algorithm: threshold
    formula: |
      failed = empty set
      # TEMP_RISE: equality passes
      if winding_temp_rise_c > temp_rise_limit_c: failed += TEMP_RISE
      # IMPULSE: only evaluated when the test plan calls for it; equality passes
      if fat.requires_impulse == true AND impulse_withstand_kv < impulse_required_kv:
          failed += IMPULSE
      # SHORT_CIRCUIT: a zero reading is a failure
      if short_circuit_current_ka <= 0: failed += SHORT_CIRCUIT
      failed_criteria = failed sorted ascending lexicographically
      pass_result = PASS when failed_criteria is the EMPTY set else FAIL
      # empty-set boundary: PASS is defined by emptiness, so a report with
      # requires_impulse == false and every reading exactly at its limit passes
    input_set: "The single TestReport row being issued plus its parent FactoryAcceptanceTest.requires_impulse flag."
    constants: {}
    precision: "comparisons at full float precision on the submitted readings; no rounding is applied before comparison"

  - name: stage_billing_allocation
    trigger: "POST /engineered-orders/{id}/shipment-releases, POST /shipment-releases/{id}/clear, and after any change to order.net_contract_value_cents"
    algorithm: waterfall_allocation
    formula: |
      stages = ShipmentRelease rows on the order with status != CANCELLED,
               ordered by stage_index ASC (stage_index is unique per order so no tie exists)
      sum(stage_share_bp over stages) must equal exactly 10000
               otherwise -> ERR_STAGE_SHARE_TOTAL_INVALID
      provisional(s) = floor(order.net_contract_value_cents * s.stage_share_bp / 10000)
                       # FLOOR, not round_half_up
      remainder = order.net_contract_value_cents - sum(provisional(s) over stages)
                  # 0 <= remainder < count(stages)
      remainder_holder = the single stage with is_final_stage == true
                       ; when no stage carries is_final_stage == true, the stage with
                         the greatest stage_index
                       ; when more than one stage carries is_final_stage == true ->
                         ERR_MULTIPLE_FINAL_STAGES
      stage_billing_cents(s) = provisional(s) + (remainder when s == remainder_holder else 0)
      # sum(stage_billing_cents) == order.net_contract_value_cents exactly, always
    input_set: "ShipmentRelease rows on the order in every status except CANCELLED; cancelled stages are dropped from the denominator and their stage_billing_cents is forced to 0."
    constants:
      BP_TOTAL: 10000
    precision: "whole cents; per-stage floor with the entire remainder assigned to the remainder holder"

  - name: warranty_liability_cap
    trigger: "POST /warranty-claims/{id}/issue-rma"
    algorithm: threshold
    formula: |
      cap_pct = 25 when order.product_family == POWER_TRANSFORMER
              = 20 when order.product_family == PAD_MOUNT_TRANSFORMER
              = 15 otherwise
      pct_cap = round_half_up(order.contract_value_cents * cap_pct / 100, 0)
      liability_cap_cents = min(pct_cap, ABSOLUTE_CAP_CENTS)
      liability_cap_cents = max(liability_cap_cents, MIN_CAP_CENTS)
      # MIN then MAX order matters: an order small enough that pct_cap < MIN_CAP_CENTS
      # is floored to MIN_CAP_CENTS even though the absolute cap never binds
    input_set: "The parent EngineeredOrder's contract_value_cents at the instant the RMA is issued; later escalation acceptance does NOT re-open the cap."
    constants:
      ABSOLUTE_CAP_CENTS: 50000000
      MIN_CAP_CENTS: 100000
    precision: "whole cents, round_half_up"

  - name: warranty_credit_waterfall
    trigger: "system: a FailureAnalysisReport on the claim enters PUBLISHED with root_cause_code IN {SUPPLIER_DEFECT, WORKMANSHIP}"
    algorithm: waterfall_allocation
    formula: |
      # buckets are processed in this FIXED order; the order is load-bearing
      # because LABOR's sub-limit is a function of the PARTS amount actually granted
      claimed(PARTS)         = claim.parts_claim_cents
      claimed(LABOR)         = claim.labor_claim_cents
      claimed(FREIGHT)       = claim.freight_claim_cents
      claimed(CONSEQUENTIAL) = claim.consequential_claim_cents when claim.consequential_covered == true
                               else 0

      remaining = claim.liability_cap_cents
      grant(PARTS)   = min(claimed(PARTS), remaining) ; remaining -= grant(PARTS)
      labor_sublimit = round_half_up(grant(PARTS) * LABOR_PCT_OF_GRANTED_PARTS / 100, 0)
      grant(LABOR)   = min(claimed(LABOR), labor_sublimit, remaining) ; remaining -= grant(LABOR)
      grant(FREIGHT) = min(claimed(FREIGHT), FREIGHT_CAP_CENTS, remaining) ; remaining -= grant(FREIGHT)
      grant(CONSEQUENTIAL) = min(claimed(CONSEQUENTIAL), remaining) ; remaining -= grant(CONSEQUENTIAL)

      credit_issued_cents = grant(PARTS) + grant(LABOR) + grant(FREIGHT) + grant(CONSEQUENTIAL)
      bucket_allocation   = { PARTS: grant(PARTS), LABOR: grant(LABOR),
                              FREIGHT: grant(FREIGHT), CONSEQUENTIAL: grant(CONSEQUENTIAL) }
      # no remainder redistribution: once remaining reaches 0 every later bucket is 0
      # INVARIANT order-money-conservation: settling adds credit_issued_cents to
      # order.warranty_credit_total_cents and net_contract_value_cents becomes
      # contract_value_cents + escalation_accepted_total_cents - warranty_credit_total_cents
    input_set: "The single WarrantyClaim row and its liability_cap_cents pinned at RMA issuance; sibling claims on the same order do not share the cap."
    constants:
      LABOR_PCT_OF_GRANTED_PARTS: 60
      FREIGHT_CAP_CENTS: 250000
    precision: "whole cents, round_half_up on the labor sub-limit only"

  - name: allocation_release_penalty
    trigger: "POST /component-allocations/{id}/release when the allocation is in COMMITTED"
    algorithm: threshold
    formula: |
      unit_penalty_cents = 0     when component.lead_time_days <= 30
                         = 25000 when component.lead_time_days >= 31 AND <= 120
                         = 60000 when component.lead_time_days >= 121
      raw_penalty = unit_penalty_cents * allocation.quantity
      penalty_ceiling = round_half_up(order.contract_value_cents * 5 / 100, 0)
      release_penalty_cents = min(raw_penalty, penalty_ceiling)
      # a RESERVED -> RELEASED transition never runs this calculation; its
      # release_penalty_cents stays 0
    input_set: "The single ComponentAllocation being released plus its LongLeadComponent.lead_time_days and its EngineeredOrder.contract_value_cents."
    constants:
      TIER_1_LIMIT_DAYS: 30
      TIER_2_LIMIT_DAYS: 120
      TIER_2_UNIT_CENTS: 25000
      TIER_3_UNIT_CENTS: 60000
      PENALTY_CEILING_PCT: 5
    precision: "whole cents, round_half_up on the ceiling computation"

  - name: preemption_victim_selector
    trigger: "POST /component-allocations when quantity exceeds component.quantity_available"
    algorithm: waterfall_allocation
    formula: |
      shortfall = incoming.quantity - component.quantity_available
      # (a) eligibility filter - explicit predicate over entity fields
      candidates = ComponentAllocation rows where
          long_lead_component_id == component.id
          AND status == RESERVED
          AND priority_class > incoming.priority_class          # strictly larger number
          AND engineered_order_id != incoming.engineered_order_id
          AND component.allocation_policy == PREEMPTIBLE
      # (b) ranking expression
      ranked = candidates sorted by priority_class DESC,
                                then need_by_date DESC,
                                then created_at ASC
      # (c) tie-break - created_at ASC is the final tie-break; ComponentAllocation.id
      #     is NEVER consulted for ordering
      # (d) accumulate until the shortfall is covered
      victims = the shortest prefix of ranked whose summed quantity >= shortfall
      if no prefix of ranked reaches the shortfall:
          victims = empty ; nothing is preempted ; the create fails with
          ERR_COMPONENT_INSUFFICIENT
      # (d) empty-candidate fallback: an empty candidate set also fails with
      #     ERR_COMPONENT_INSUFFICIENT and leaves every existing allocation untouched
      each victim -> status PREEMPTED with preempted_for_allocation_id := incoming.id
    input_set: "ComponentAllocation rows on the same component in status RESERVED only; COMMITTED, CONSUMED, RELEASED and PREEMPTED rows are never eligible victims."
    constants: {}
    precision: "integer units; no rounding"

  - name: punch_completion_ratio
    trigger: "system: after every PunchListItem state change on the job"
    algorithm: aggregation
    formula: |
      total  = count(PunchListItem on the job where status != REJECTED)
      closed = count(PunchListItem on the job where status == CLOSED)
      completion_ratio_bp = 10000 when total == 0
                          else floor(closed * 10000 / total)
      open_punch_count     = count(PunchListItem on the job where status IN {OPEN, ASSIGNED, RESOLVED})
      blocking_punch_count = count(PunchListItem on the job where severity == BLOCKING
                                   AND status != CLOSED AND status != REJECTED)
      # empty-set boundary: a job with zero punch items reports 10000 bp (complete),
      # not 0 bp
    input_set: "PunchListItem rows under the job; REJECTED rows are excluded from both numerator and denominator."
    constants:
      BP_TOTAL: 10000
    precision: "integer basis points, floor"

  - name: warranty_window_expiry
    trigger: "POST /warranty-claims/{id}/issue-rma"
    algorithm: chronological
    formula: |
      anchor_jobs = CommissioningJob rows on the order with status == COMPLETE
      anchor = the energized_at of the anchor_jobs row with the EARLIEST energized_at,
               tie-break created_at ASC
      anchor_jobs empty -> ERR_WARRANTY_WINDOW_UNAVAILABLE
      window_months = 18 when order.product_family == POWER_TRANSFORMER else 12
      expiry = anchor + window_months calendar months, with day-of-month overflow
               clamped to the last day of the target month
               (e.g. 2026-01-31 + 1 month = 2026-02-28)
      admissible when claim.failure_reported_at < expiry     # STRICTLY before
      claim.failure_reported_at == expiry -> ERR_WARRANTY_WINDOW_EXPIRED
    input_set: "CommissioningJob rows on the order in status COMPLETE only; SCHEDULED, MOBILIZED, ENERGIZATION_PENDING, PUNCH_OPEN, DEMOBILIZED_INCOMPLETE and CANCELLED jobs never anchor the window."
    constants:
      WINDOW_MONTHS_POWER_TRANSFORMER: 18
      WINDOW_MONTHS_DEFAULT: 12
    precision: "calendar-month arithmetic with end-of-month clamping; instants compared at second granularity"

# =============================================================================
# 1.4 VALIDATION RULES (ordered by priority; first failing rule wins)
# =============================================================================
# Ladder shape for this domain:
#   1-6    authentication and authorization (incl. segregation of duties)
#   7-26   existence, left-to-right along the path, then body FK references
#   27-31  request payload shape, enum domains, pagination
#   32-33  optimistic concurrency (OCC) preconditions
#   34-41  state preconditions on the target row and its owning order
#   42-53  safety / compliance / regulatory business rules
#   54-66  constraint satisfaction (uniqueness, graph deps, temporal conflicts)
#   67-74  temporal window admissibility
#   75-82  capacity, quota and fiscal checks (always last)
validations:

  # --- 1-6 authentication / authorization -----------------------------------
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role request headers are both present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADER
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "X-User-Role names one of the 13 roles declared in the RBAC matrix; entity_backed roles additionally require X-User-ID to resolve to a live row of the backing entity"
    error_id: ERR_UNKNOWN_ROLE
    http_status: 401
    applies_to: "all"
  - priority: 3
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: "all"
  - priority: 4
    category: auth
    check: "when the acting role is SalesEngineer, X-User-ID equals EngineeredOrder.owning_sales_user_id of the order in scope"
    error_id: ERR_NOT_ORDER_OWNER
    http_status: 403
    applies_to: "all EngineeredOrder-scoped writes performed by SalesEngineer"
  - priority: 5
    category: auth
    check: "segregation of duties: the acting X-User-ID must differ from the user id that performed the paired upstream step - SubmittalDrawing.reviewed_by_user_id != authored_by_user_id on disposition; ComplianceLabel.verified_by_user_id != generated_by_user_id on verify; PunchListItem.closed_by_user_id != resolved_by_user_id on close; EscalationAdjustment.accepted_by_user_id != prepared_by_user_id on accept"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /submittal-drawings/{id}/disposition, POST /compliance-labels/{id}/verify, POST /punch-list-items/{id}/close, POST /escalation-adjustments/{id}/accept"
  - priority: 6
    category: auth
    check: "when the acting role is CustomerWitness, X-User-ID equals WitnessAssignment.witness_party_id of the assignment in scope"
    error_id: ERR_WITNESS_IDENTITY_MISMATCH
    http_status: 403
    applies_to: "POST /witness-assignments/{id}/confirm, POST /witness-assignments/{id}/decline"

  # --- 7-26 existence (path segments resolved strictly left-to-right) -------
  - priority: 7
    category: existence
    check: "the EngineeredOrder named by {id} or by engineered_order_id exists"
    error_id: ERR_ORDER_NOT_FOUND
    http_status: 404
    applies_to: "all /engineered-orders/{id}/** paths and any body carrying engineered_order_id"
  - priority: 8
    category: existence
    check: "the SubmittalDrawing named by {id}, by submittal_drawing_id or by supersedes_drawing_id exists"
    error_id: ERR_DRAWING_NOT_FOUND
    http_status: 404
    applies_to: "all /submittal-drawings/{id}/** paths"
  - priority: 9
    category: existence
    check: "the EscalationClause named by {id} or by escalation_clause_id exists and belongs to the order in scope"
    error_id: ERR_CLAUSE_NOT_FOUND
    http_status: 404
    applies_to: "POST /engineered-orders/{id}/escalation-adjustments, /escalation-clauses/{id}"
  - priority: 10
    category: existence
    check: "the EscalationAdjustment named by {id} exists"
    error_id: ERR_ADJUSTMENT_NOT_FOUND
    http_status: 404
    applies_to: "all /escalation-adjustments/{id}/** paths"
  - priority: 11
    category: existence
    check: "the CommodityIndexPoint named by {id} exists"
    error_id: ERR_INDEX_POINT_NOT_FOUND
    http_status: 404
    applies_to: "/commodity-index-points/{id}"
  - priority: 12
    category: existence
    check: "the Supplier named by {id} or by attributed_supplier_id exists"
    error_id: ERR_SUPPLIER_NOT_FOUND
    http_status: 404
    applies_to: "all /suppliers/{id}/** paths, POST /warranty-claims/{id}/failure-analysis-reports"
  - priority: 13
    category: existence
    check: "the LongLeadComponent named by {id}, by long_lead_component_id or by suspect_component_id exists"
    error_id: ERR_COMPONENT_NOT_FOUND
    http_status: 404
    applies_to: "all /long-lead-components/{id}/** paths, POST /component-allocations, POST /engineered-orders/{id}/warranty-claims"
  - priority: 14
    category: existence
    check: "the ComponentAllocation named by {id} or by preempted_for_allocation_id exists"
    error_id: ERR_ALLOCATION_NOT_FOUND
