              as: GovernanceDirector
              as_user_id: "gov-analyst-97"
          assert:
            - "Trigger call 2: HTTP 200 with data.version == ${mv_a} + 1 - a budget adjustment is a version-bumping write even though it carries no OCC token itself"
            - "Trigger call 3: HTTP 412 with ${occ1} == ERR_STALE_MARKET_VERSION - rule universe-create-stale-market; the payload is perfectly valid and only the token is old"
            - "Trigger call 4: ${mv_b} == ${mv_a} + 1 - the refused universe write left the market untouched (no partial bump)"
            - "Trigger call 5: HTTP 201 with data.status == DRAFT, data.total_population_households == 110000, data.total_population_persons == 275000 - the SAME payload succeeds at the refreshed version"
            - "Trigger call 6: HTTP 412 with ${occ2} == ERR_STALE_MARKET_VERSION - rule run-create-stale-market; ${mv_b} was current when the run writer read it and was invalidated by call 5"
            - "Trigger call 7: ${mv_c} == ${mv_b} + 1 - the successful universe creation is the only write that moved it"
            - "Trigger call 8: HTTP 201 with data.state == OPEN - same payload, refreshed token"
            - "Trigger call 9: ${mv_d} == ${mv_c} + 1 - run creation bumps the market too"
            - "Trigger call 11: HTTP 200 with data.status == PUBLISHED - 29 whole days after the 2026Q3 vintage, so VINTAGE_MIN_GAP_DAYS (28) is satisfied"
            - "Trigger call 12: data.version == ${mv_d} - publishing a vintage is NOT a version-bumping write even though it cascades the previous vintage to SUPERSEDED and pushes the OPEN run from call 8 to PENDING_REPIN; only the writes whose side_effects say 'increments market.version' move the token"
            - "Trigger call 15: HTTP 412 with ${occ3} == ERR_STALE_METHODOLOGY_CHANGE_VERSION - rule impact-analysis-stale-change; ${mv_d} is a real version number from the WRONG parent, which is exactly the mismatch the rule catches, and the error names the MethodologyChange rather than the market"
            - "Trigger call 16: HTTP 200 with data.state == IMPACT_ASSESSED and data.version == ${ch97_v} + 1 - the analysis bumps its own parent's token, so a replay of call 16 would now be stale in turn"

      - name: incentive_boost_releases_at_exactly_eight_tenths_fill_and_re_arms_on_retirement
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
          - calculations[quota_cell_fill]
          - calculations[market_recruitment_posture]
        distinguishing_aspect: "The boost is released by the ON_TARGET_THRESHOLD (0.8000), not by the FILLED one, so the reserved budget drops on the fourth of five households - and the market lands on RESTRICTED, the posture clause that fires precisely because there are no UNDER_TARGET cells and not all cells are FILLED. Retiring one household drives the counter back under the threshold and the reservation is re-made at its full target-based size, proving the trigger resets rather than latching."
        test_recipe:
          setup:
            - "CHAIN A with CODE DMA-700, RANK 200, T 5, B 2000, BUDGET 500000 - so the cell reserves round_half_up(2000 * 0.25 * 5, 0) == 2500 cents on creation."
            - "Three households taken to ACTIVE through CHAIN B steps B1..B4 on that cell with PERSONS 2 and serials MT-002099, MT-002100, MT-002101."
            - "A fourth household created with a meter (MT-002102) INSTALLED but NOT yet enumerated, so it is still ENUM_PENDING and outside the in-tab count."
            - "The clock is still at the startup value 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "GET /quota-cells"
              payload: {}
              as: PanelOperationsManager
              captures: { c100_id: "$.data[0].id", m100_id: "$.data[0].market_id" }
            - call: "GET /households"
              payload: { market_id: "${m100_id}", status: "ACTIVE" }
              as: PanelOperationsManager
              captures: { h100_first: "$.data[0].id" }
            - call: "GET /households"
              payload: { market_id: "${m100_id}", status: "ENUM_PENDING" }
              as: PanelOperationsManager
              captures: { h100_fourth: "$.data[0].id" }
          trigger:
            - call: "GET /quota-cells/${c100_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "GET /markets/${m100_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PanelOperationsManager
            - call: "POST /households/${h100_fourth}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c100_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "GET /markets/${m100_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-06T00:00:00Z" }
              as: PanelOperationsManager
            - call: "POST /households/${h100_first}/retire"
              payload: { retired_reason: "Moved out of the market" }
              as: PanelOperationsManager
            - call: "GET /quota-cells/${c100_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "GET /markets/${m100_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "GET /meters"
              payload: { household_id: "${h100_first}" }
              as: FieldTechnician
          assert:
            - "Trigger call 1 (below the threshold): data.intab_count == 3, data.fill_rate == 0.6000, data.quota_status == UNDER_TARGET, data.incentive_boost_active == true, data.effective_incentive_multiplier == 1.25"
            - "Trigger call 2: data.incentive_budget_reserved_cents == 2500, data.under_target_cell_count == 1, data.quota_cell_count == 1, data.recruitment_posture == OPEN, data.posture_changed_at == 2026-08-01T00:00:00Z"
            - "Trigger call 4: HTTP 201 and the household reaches ACTIVE, taking intab_count to 4"
            - "Trigger call 5 (AT the threshold): data.intab_count == 4, data.fill_rate == 0.8000 exactly (4 / 5 needs no rounding), data.quota_status == ON_TARGET, data.incentive_boost_active == false and data.effective_incentive_multiplier == 1.00 - the release branch is 'quota_status != UNDER_TARGET', so it fires at 0.8000 and NOT only at 1.0000"
            - "Trigger call 6: data.incentive_budget_reserved_cents == 0 - the full 2500 is released even though the cell is only four fifths full, and the release size is the target-based figure, not a per-household fraction"
            - "Trigger call 6 (posture ladder): data.under_target_cell_count == 0 and data.filled_cell_count == 0, so clause 2 (all cells FILLED -> CLOSED) does not fire and clause 3 does: data.recruitment_posture == RESTRICTED with data.posture_changed_at == 2026-08-05T00:00:00Z"
            - "Trigger call 9 (reset): data.intab_count == 3, data.fill_rate == 0.6000, data.quota_status == UNDER_TARGET, data.incentive_boost_active == true, data.effective_incentive_multiplier == 1.25 - the trigger re-arms instead of latching off"
            - "Trigger call 10: data.incentive_budget_reserved_cents == 2500 again (not 2000, not a prorated figure) and data.recruitment_posture == OPEN with data.posture_changed_at == 2026-08-06T00:00:00Z"
            - "Trigger call 11: the retired household's meter has install_status == REMOVED - the retirement's conditional meter cascade rode along with the threshold reset"

  # ===========================================================================
  # SECTION 9 - Consistency model (§1.1 consistency_model: immediate)
  # ===========================================================================
  - section: consistency_model
    instances:

      - name: every_derived_rollup_is_current_in_the_response_that_caused_it
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /markets/{market_id}/quota-cells]
          - endpoints[POST /households/{household_id}/enumerations]
        distinguishing_aspect: "There is no recompute, refresh or reconcile endpoint anywhere in §1.5, so every derived field has to be correct in the body of the write that caused it and in the very next read - no second write, no re-post, no settle time. The chain checked here spans three entities in one pass: the enumeration response itself carries the household's new status and verdict, and the cell and market rollups are already updated when read immediately afterwards."
        test_recipe:
          setup:
            - "An empty database with the clock at its startup value 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /markets"
              payload: { name: "Fairview DMA", market_code: "DMA-701", dma_rank: 201, incentive_budget_cents: 500000 }
              as: PanelOperationsManager
              captures: { m101_id: "$.data.id" }
            - call: "POST /markets/${m101_id}/quota-cells"
              payload: { age_band: "P18_34", income_band: "MID", geo_zone: "URBAN", target_households: 2, base_incentive_cents: 2000 }
              as: PanelOperationsManager
              captures: { c101_id: "$.data.id" }
            - call: "GET /markets/${m101_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /households"
              payload: { market_id: "${m101_id}", quota_cell_id: "${c101_id}", recruitment_source: "ADDRESS_SAMPLE", persons_count: 2 }
              as: PanelOperationsManager
              captures: { h101_id: "$.data.id" }
            - call: "GET /quota-cells/${c101_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "POST /meters"
              payload: { household_id: "${h101_id}", meter_type: "TV_TUNER", serial_no: "MT-002103" }
              as: FieldTechnician
              captures: { mt101_id: "$.data.id" }
            - call: "POST /meters/${mt101_id}/install-confirmations"
              payload: {}
              as: FieldTechnician
            - call: "POST /households/${h101_id}/enumerations"
              payload: { roster_persons_count: 2, tv_sets_count: 1 }
              as: FieldTechnician
            - call: "GET /quota-cells/${c101_id}"
              payload: {}
              as: PanelOperationsManager
            - call: "GET /markets/${m101_id}"
              payload: {}
              as: PanelOperationsManager
          assert:
            - "Trigger call 1: the creation response ALREADY carries data.recruitment_posture == RESTRICTED and data.posture_changed_at == 2026-08-01T00:00:00Z - the posture calculation runs inside the create, not on first read"
            - "Trigger call 2: the cell creation response ALREADY carries data.intab_count == 0, data.fill_rate == 0.0000, data.quota_status == UNDER_TARGET, data.incentive_boost_active == true and data.effective_incentive_multiplier == 1.25"
            - "Trigger call 3: data.incentive_budget_reserved_cents == 1000 (round_half_up(2000 * 0.25 * 2, 0)), data.quota_cell_count == 1, data.under_target_cell_count == 1 and data.recruitment_posture == OPEN - the parent's rollups moved on the child's write with no intervening call"
            - "Trigger call 4: data.status == RECRUITED - a household enters below the in-tab line"
            - "Trigger call 5: data.intab_count == 0 and data.fill_rate == 0.0000 - immediacy is not eagerness; a RECRUITED household is outside the calculation's input_set, so nothing changed"
            - "Trigger call 8: the enumeration response itself reports data.status == ACTIVE and data.enumeration_verdict == COMPLIANT together with data.enumeration_count == 1"
            - "Trigger call 9: data.intab_count == 1, data.fill_rate == 0.5000, data.quota_status == UNDER_TARGET - visible on the first read after the enumeration, with no refresh endpoint called because none exists in §1.5"
            - "Trigger call 10: data.under_target_cell_count == 1 and data.recruitment_posture == OPEN - the two-level rollup (household -> cell -> market) is settled by the time the enumeration returns"

      - name: cascaded_fields_need_no_second_write_to_become_visible
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines[Meter HEALTHY -> FAULTED]
        excluded_because:
          difficulty_instance: "transitive_cascade / fault_report_cascade_meter_household_cell_boost_posture"
          rationale: "The remaining consistency-model claim is that CASCADED fields - not merely directly derived ones - are current on the first read after the triggering write. That instance already reads the meter, the household, the cell and the market immediately after a single fault report, with no intervening write of any kind, and asserts the post-cascade value of each one."
