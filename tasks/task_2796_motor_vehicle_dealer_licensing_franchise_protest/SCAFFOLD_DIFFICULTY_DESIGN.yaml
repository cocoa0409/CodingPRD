scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: warranty_rate_per_order_mean_vs_aggregate_weighted
        grounds:
          - calculations.warranty_labor_rate_determination
          - entities.WarrantyRateDispute.fields.declared_rate_cents
          - entities.WarrantyRateDispute.fields.counter_rate_cents
          - entities.WarrantyRateDispute.fields.spread_pct
          - state_machines.WarrantyRateDispute.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          The two variants consume the identical five-line repair-order sample yet diverge by
          1971 cents (8400 vs 6429) because PER_ORDER_MEAN rounds each order before averaging
          while AGGREGATE_WEIGHTED pools charges and hours and rounds once at the end.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "Franchisor AURORA registered with posted_warranty_labor_rate_cents 6000."
            - "Dealer Lakeside Aurora licensed (INITIAL application approved) and FRANCHISED."
            - "A warranty rate dispute filed with a 7-line sample of which exactly 5 lines qualify."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_a_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_a_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_a_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_a_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_a_id}"
            - call: "POST /dealer-board/license-applications/${app_a_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
            - call: "POST /dealer-board/warranty-rate-disputes"
              payload: { dealer_id: "${dlr_a_id}", manufacturer_id: "${mfr_a_id}", repair_order_lines: [ { labor_charge_cents: 12000, labor_hours: 1.0, repair_type: "CUSTOMER_PAID" }, { labor_charge_cents: 9000, labor_hours: 1.5, repair_type: "CUSTOMER_PAID" }, { labor_charge_cents: 10000, labor_hours: 2.0, repair_type: "CUSTOMER_PAID" }, { labor_charge_cents: 8000, labor_hours: 0.5, repair_type: "CUSTOMER_PAID" }, { labor_charge_cents: 6000, labor_hours: 2.0, repair_type: "CUSTOMER_PAID" }, { labor_charge_cents: 5000, labor_hours: 0.4, repair_type: "CUSTOMER_PAID" }, { labor_charge_cents: 7000, labor_hours: 1.0, repair_type: "WARRANTY" } ] }
              as: Dealer
              as_user_id: "${dlr_a_id}"
              captures: { wrd_a_id: $.data.id, declared_a: $.data.declared_rate_cents }
          trigger:
            - call: "POST /dealer-board/warranty-rate-disputes/${wrd_a_id}/response"
              payload: { manufacturer_response_type: "REBUT", excluded_line_indexes: [] }
              as: Manufacturer
              as_user_id: "${mfr_a_id}"
              captures: { counter_a: $.data.counter_rate_cents }
            - call: "POST /dealer-board/warranty-rate-disputes/${wrd_a_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
          assert:
            - "WarrantyRateDispute.${wrd_a_id}.qualifying_line_count == 5"
            - "WarrantyRateDispute.${wrd_a_id}.declared_rate_cents == 8400"
            - "WarrantyRateDispute.${wrd_a_id}.counter_rate_cents == 6429"
            - "WarrantyRateDispute.${wrd_a_id}.declared_rate_cents != WarrantyRateDispute.${wrd_a_id}.counter_rate_cents"
            - "WarrantyRateDispute.${wrd_a_id}.spread_pct == 30.66"
            - "WarrantyRateDispute.${wrd_a_id}.approved_rate_cents == 7415"
            - "WarrantyRateDispute.${wrd_a_id}.status == APPROVED"
            - "WarrantyRateDispute.${wrd_a_id}.effective_on == 2026-10-01"
            - "Dealer.${dlr_a_id}.approved_warranty_labor_rate_cents == 7415"

      - name: good_cause_expected_penetration_statewide_vs_comparable
        grounds:
          - calculations.market_penetration_analysis
          - calculations.good_cause_score
          - entities.MarketStudy.fields.expected_penetration_pct
          - entities.MarketStudy.fields.shortfall_pts
          - endpoints["GET /dealer-board/protests/{id}/good-cause-analysis"]
        distinguishing_aspect: |
          Two studies carrying identical registration counts (40000 total, 3200 line-make,
          actual 8.00) return expected_penetration_pct 12.50 under STATEWIDE_AVERAGE and 10.00
          under COMPARABLE_MARKET, a 2.50-point shortfall delta that propagates into
          net_shortfall_pts 2.50 rather than 4.50.
        test_recipe:
          setup:
            - "Franchisor AURORA and licensed dealer Lakeside Aurora at site (0, 0)."
            - "An ADDITIONAL_POINT filing proposing a site at (9, 12), 15.00 km away, noticed on 2026-09-10."
            - "Protest filed on 2026-09-15; both parties tender one market study each."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_b_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_b_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_b_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_b_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_b_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_b_id}"
            - call: "POST /dealer-board/license-applications/${app_b_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_b_id}", filing_type: "ADDITIONAL_POINT", proposed_effective_on: "2026-11-15", site_x_km: 9, site_y_km: 12 }
              as: Manufacturer
              as_user_id: "${mfr_b_id}"
              captures: { fil_b_id: $.data.id }
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings/${fil_b_id}/serve-notice"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_b_id}"
              captures: { fil_b_v: $.data.version }
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/protests"
              payload: { franchise_filing_id: "${fil_b_id}", protestant_dealer_id: "${dlr_b_id}", grounds_code: "MARKET_ENCROACHMENT", expected_franchise_filing_version: "${fil_b_v}" }
              as: Dealer
              as_user_id: "${dlr_b_id}"
              captures: { prt_b_id: $.data.id }
          trigger:
            - call: "POST /dealer-board/protests/${prt_b_id}/market-studies"
              payload: { submitted_by_party: "PROTESTANT", basis: "STATEWIDE_AVERAGE", total_market_registrations: 40000, line_make_registrations: 3200, statewide_line_make_share_pct: 12.50, permanency_investment_cents: 250000000, consumer_access_drive_minutes: 22, market_growth_pct: 8.00 }
              as: Dealer
              as_user_id: "${dlr_b_id}"
              captures: { study_p_id: $.data.id, p_expected: $.data.expected_penetration_pct }
            - call: "POST /dealer-board/protests/${prt_b_id}/market-studies"
              payload: { submitted_by_party: "MANUFACTURER", basis: "COMPARABLE_MARKET", total_market_registrations: 40000, line_make_registrations: 3200, comparable_market_shares_pct: [9.00, 10.00, 11.00], permanency_investment_cents: 0, consumer_access_drive_minutes: 12, market_growth_pct: 8.00 }
              as: Manufacturer
              as_user_id: "${mfr_b_id}"
              captures: { study_m_id: $.data.id, m_expected: $.data.expected_penetration_pct }
          assert:
            - "MarketStudy.${study_p_id}.actual_penetration_pct == 8.00"
            - "MarketStudy.${study_p_id}.expected_penetration_pct == 12.50"
            - "MarketStudy.${study_p_id}.shortfall_pts == 4.50"
            - "MarketStudy.${study_m_id}.actual_penetration_pct == 8.00"
            - "MarketStudy.${study_m_id}.expected_penetration_pct == 10.00"
            - "MarketStudy.${study_m_id}.shortfall_pts == 2.00"
            - "GET /dealer-board/protests/${prt_b_id}/good-cause-analysis returns net_shortfall_pts == 2.50"
            - "GET /dealer-board/protests/${prt_b_id}/good-cause-analysis returns good_cause_score == 41.00 and good_cause_threshold == 60.00 and good_cause_established == false"

  - rule_id: combinatorial_formula
    instances:
      - name: license_fee_nested_caps_and_tier_multiplier
        grounds:
          - calculations.license_fee_assessment
          - entities.LicenseApplication.fields.fee_quoted_cents
          - entities.LicenseApplication.fields.fee_total_cents
          - entities.Dealer.fields.county_tier
        distinguishing_aspect: |
          Mode (a): four independent factors (base fee by application_type, county multiplier,
          line-make surcharge, facility credit) combine with the multiplier applied ONLY to the
          base, so the correct answer is 184000 while the plausible order-of-operations error
          (multiplying the surcharge-inclusive subtotal by 1.25) yields 192500.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "A TIER_1 dealer applying INITIAL with line_make_count 2 and a 12500 sqft facility (4500 sqft above the 8000 sqft credit baseline)."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_c_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Metro Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_1", site_x_km: 4, site_y_km: 3, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_c_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_c_id}", application_type: "INITIAL", facility_sqft: 12500, display_spaces: 20, service_bays: 6, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 2 }
              as: Dealer
              as_user_id: "${dlr_c_id}"
              captures: { app_c_id: $.data.id }
          trigger:
            - call: "POST /dealer-board/license-applications/${app_c_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_c_id}"
              captures: { quoted_c: $.data.fee_quoted_cents }
            - call: "POST /dealer-board/license-applications/${app_c_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
          assert:
            - "LicenseApplication.${app_c_id}.fee_quoted_cents == 184000"
            - "LicenseApplication.${app_c_id}.fee_quoted_cents != 192500"
            - "LicenseApplication.${app_c_id}.fee_total_cents == 184000"
            - "LicenseApplication.${app_c_id}.fee_delta_cents == 0"
            - "LicenseApplication.${app_c_id}.deficiency_count == 0"
            - "Dealer.${dlr_c_id}.license_status == LICENSED"

      - name: hearing_assessment_surcharge_tier_keyed_on_subtotal
        grounds:
          - calculations.hearing_cost_assessment
          - entities.Protest.fields.assessment_total_cents
          - entities.Protest.fields.protestant_share_cents
          - entities.Protest.fields.manufacturer_share_cents
          - state_machines.Protest.HEARD_to_SUSTAINED
        distinguishing_aspect: |
          Mode (c): the surcharge tier is selected from the 98200-cent SUBTOTAL (0.05 band),
          producing 4910 and a total of 103110; keying the tier off the post-surcharge total
          would cross into the 0.08 band and produce 7856 / 106056.
        test_recipe:
          setup:
            - "Franchisor AURORA, licensed dealer Lakeside Aurora, hearing room HR-1 (buffer 60 minutes, 2 hearings per day)."
            - "TERMINATION filing noticed 2026-09-10 with proposed_effective_on 2026-11-15; the affected dealer protests on 2026-09-15."
            - "Hearing docketed for 2026-11-02T10:00:00Z to 13:00:00Z as a single session, so evidence_deadline_at is 2026-10-26T10:00:00Z."
            - "Exhibits: 100 pages and 40 pages tendered on 2026-10-20 (ACCEPTED) and 12 pages tendered on 2026-10-30 with leave (LATE_ACCEPTED) — 152 accepted pages, 1 late."
            - "Both parties' market studies on file, giving good_cause_score 41.00 against the TERMINATION threshold 40.00."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_d_id: $.data.id }
            - call: "POST /dealer-board/hearing-rooms"
              payload: { room_code: "HR-1", seating_capacity: 60 }
              as: BoardAdmin
              captures: { room_d_id: $.data.id, room_d_v: $.data.version }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_d_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_d_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_d_id}"
              captures: { app_d_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_d_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_d_id}"
            - call: "POST /dealer-board/license-applications/${app_d_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_d_id}", filing_type: "TERMINATION", proposed_effective_on: "2026-11-15", affected_dealer_id: "${dlr_d_id}", termination_cause_code: "FAILURE_TO_MEET_SALES_OBJECTIVES" }
              as: Manufacturer
              as_user_id: "${mfr_d_id}"
              captures: { fil_d_id: $.data.id }
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings/${fil_d_id}/serve-notice"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_d_id}"
              captures: { fil_d_v: $.data.version }
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/protests"
              payload: { franchise_filing_id: "${fil_d_id}", protestant_dealer_id: "${dlr_d_id}", grounds_code: "NO_GOOD_CAUSE_FOR_TERMINATION", expected_franchise_filing_version: "${fil_d_v}" }
              as: Dealer
              as_user_id: "${dlr_d_id}"
              captures: { prt_d_id: $.data.id }
            - call: "POST /dealer-board/protests/${prt_d_id}/market-studies"
              payload: { submitted_by_party: "PROTESTANT", basis: "STATEWIDE_AVERAGE", total_market_registrations: 40000, line_make_registrations: 3200, statewide_line_make_share_pct: 12.50, permanency_investment_cents: 250000000, consumer_access_drive_minutes: 22, market_growth_pct: 8.00 }
              as: Dealer
              as_user_id: "${dlr_d_id}"
            - call: "POST /dealer-board/protests/${prt_d_id}/market-studies"
              payload: { submitted_by_party: "MANUFACTURER", basis: "COMPARABLE_MARKET", total_market_registrations: 40000, line_make_registrations: 3200, comparable_market_shares_pct: [9.00, 10.00, 11.00], permanency_investment_cents: 0, consumer_access_drive_minutes: 12, market_growth_pct: 8.00 }
              as: Manufacturer
              as_user_id: "${mfr_d_id}"
            - call: "POST /dealer-board/protests/${prt_d_id}/schedule"
              payload: { hearing_room_id: "${room_d_id}", hearing_start_at: "2026-11-02T10:00:00Z", hearing_end_at: "2026-11-02T13:00:00Z", hearing_session_count: 1, expected_hearing_room_version: "${room_d_v}" }
              as: HearingClerk
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/protests/${prt_d_id}/evidence-submissions"
              payload: { submitting_party: "PROTESTANT", exhibit_label: "P-1", page_count: 100 }
              as: Dealer
              as_user_id: "${dlr_d_id}"
            - call: "POST /dealer-board/protests/${prt_d_id}/evidence-submissions"
              payload: { submitting_party: "MANUFACTURER", exhibit_label: "M-1", page_count: 40 }
              as: Manufacturer
              as_user_id: "${mfr_d_id}"
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/protests/${prt_d_id}/evidence-submissions"
              payload: { submitting_party: "PROTESTANT", exhibit_label: "P-2", page_count: 12, leave_granted: true }
              as: Dealer
              as_user_id: "${dlr_d_id}"
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-02T10:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/protests/${prt_d_id}/convene"
              payload: {}
              as: HearingClerk
          trigger:
            - call: "POST /dealer-board/protests/${prt_d_id}/decision"
              payload: { outcome: "SUSTAINED", findings_note: "Franchisor failed to establish good cause." }
              as: BoardAdmin
          assert:
            - "Protest.${prt_d_id}.accepted_evidence_pages == 152"
            - "Protest.${prt_d_id}.late_evidence_count == 1"
            - "Protest.${prt_d_id}.good_cause_score == 41.00"
            - "Protest.${prt_d_id}.good_cause_threshold == 40.00"
            - "Protest.${prt_d_id}.assessment_total_cents == 103110"
            - "Protest.${prt_d_id}.assessment_total_cents != 106056"
            - "Protest.${prt_d_id}.protestant_share_cents == 30933"
            - "Protest.${prt_d_id}.manufacturer_share_cents == 72177"
            - "Protest.${prt_d_id}.protestant_share_cents + Protest.${prt_d_id}.manufacturer_share_cents == 103110"
            - "Protest.${prt_d_id}.status == SUSTAINED"
            - "FranchiseFiling.${fil_d_id}.status == BARRED"
            - "Dealer.${dlr_d_id}.franchise_status == FRANCHISED"

  - rule_id: non_linear_state_machine
    instances:
      - name: salesperson_parallel_license_and_discipline_dimensions
        grounds:
          - state_machines.Salesperson
          - entities.Salesperson.fields.license_status
          - entities.Salesperson.fields.discipline_status
          - calculations.salesperson_disciplinary_points
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          Parallel shape: license_status and discipline_status are independent dimensions of the
          same row. Two substantiated complaints drive discipline CLEAR -> PROBATION ->
          SUSPENDED_DISCIPLINARY while license_status never leaves LICENSED, and the sponsoring
          dealer's own 9-point total stays below its own 12-point suspension threshold — three
          thresholds read from one point stream.
        test_recipe:
          setup:
            - "Licensed dealer Lakeside Aurora with one licensed salesperson (licensed 2026-09-02, expiring 2027-09-01)."
            - "Complaint 1 on 2026-09-05: ADVERTISING_VIOLATION, alleged_loss_cents 200000, resolved PROBATION -> 6 points."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_e_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_e_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_e_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_e_id}"
              captures: { app_e_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_e_id}/submit"
              payload: {}
