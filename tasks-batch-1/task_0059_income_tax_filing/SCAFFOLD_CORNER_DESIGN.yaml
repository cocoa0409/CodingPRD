  # -----------------------------------------------------------------
  # Validations
  # -----------------------------------------------------------------
  - section: validations
    instances:
      - name: compute_with_no_income_documents
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_NO_INCOME_DOCUMENTS]"]
        distinguishing_aspect: "compute on a return with zero IncomeDocuments returns ERR_NO_INCOME_DOCUMENTS (409)."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn with no income documents."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "va1@x.com", full_name: "VA1", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_INCOME_DOCUMENTS"
            - "HTTP status == 409"

      - name: itemized_compute_without_schedule_a
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_ITEMIZED_REQUIRES_SCHEDULE_A]"]
        distinguishing_aspect: "compute on an ITEMIZED return lacking a Schedule A returns ERR_ITEMIZED_REQUIRES_SCHEDULE_A (409)."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn ITEMIZED with one W-2 but no Schedule A."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "va2@x.com", full_name: "VA2", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE", deduction_method: "ITEMIZED" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ITEMIZED_REQUIRES_SCHEDULE_A"
            - "HTTP status == 409"

      - name: duplicate_schedule_type_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_CHILD]"]
        distinguishing_aspect: "Adding a second Schedule of the same schedule_type (C) to a return returns ERR_DUPLICATE_CHILD (409)."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn with one Schedule C."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "va3@x.com", full_name: "VA3", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/schedules"
              payload: { schedule_type: "C", gross_amount_cents: 1000000, expense_amount_cents: 200000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /tax-returns/${ret_id}/schedules"
              payload: { schedule_type: "C", gross_amount_cents: 500000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_CHILD"
            - "HTTP status == 409"

      - name: duplicate_estimated_payment_quarter_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_CHILD]"]
        distinguishing_aspect: "A second EstimatedTaxPayment for the same (return, quarter) returns ERR_DUPLICATE_CHILD (409); note its non-overlapping periods rule out ERR_PAYMENT_PERIOD_OVERLAP so the duplicate-quarter check is what fires."
        test_recipe:
          setup: ["Taxpayer + DRAFT TaxReturn (one W-2) with a Q1 estimated payment."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "va4@x.com", full_name: "VA4", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /estimated-tax-payments"
              payload: { return_id: "${ret_id}", quarter: "Q1", amount_cents: 100000, paid_on: "2025-04-10T00:00:00Z", period_start: "2025-01-01T00:00:00Z", period_end: "2025-04-01T00:00:00Z" }
              as: Taxpayer
              as_user_id: "${tp_id}"
          trigger:
            - call: "POST /estimated-tax-payments"
              payload: { return_id: "${ret_id}", quarter: "Q1", amount_cents: 100000, paid_on: "2025-05-10T00:00:00Z", period_start: "2025-04-01T00:00:00Z", period_end: "2025-07-01T00:00:00Z" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DUPLICATE_CHILD"
            - "HTTP status == 409"

      - name: efile_twice_already_efiled
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_ALREADY_EFILED]"]
        distinguishing_aspect: "A second efile while a TRANSMITTED (non-REJECTED) EFilingSubmission already exists returns ERR_ALREADY_EFILED (409)."
        test_recipe:
          setup: ["Taxpayer + TaxReturn computed READY with one TRANSMITTED e-file."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "va5@x.com", full_name: "VA5", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
            - call: "POST /tax-returns"
              payload: { taxpayer_id: "${tp_id}", tax_year: 2025, filing_status: "SINGLE" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /tax-returns/${ret_id}/income-documents"
              payload: { doc_type: "W2", payer_name: "Acme", box_amount_cents: 8000000, federal_withholding_cents: 900000 }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "POST /tax-returns/${ret_id}/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_c: $.data.version }
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_c}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
            - call: "GET /tax-returns/${ret_id}"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { v_after_efile: $.data.version }
          trigger:
            - call: "POST /tax-returns/${ret_id}/efile"
              payload: { signature_pin: "12345", expected_return_version: "${v_after_efile}" }
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ALREADY_EFILED"
            - "HTTP status == 409"

      - name: existence_before_state_on_compute_unknown_return
        claim_type: priority_conflict
        grounds: ["validations[priority=4]", "validations[priority=7]"]
        distinguishing_aspect: "Existence(4) precedes state(7): compute on a non-existent return id returns ERR_RETURN_NOT_FOUND (404), never a state error."
        test_recipe:
          setup: ["Taxpayer exists; target return id is random."]
          setup_api_calls:
            - call: "POST /taxpayers"
              payload: { email: "va6@x.com", full_name: "VA6", filing_status: "SINGLE" }
              as: Taxpayer
              captures: { tp_id: $.data.id }
          trigger:
            - call: "POST /tax-returns/22222222-2222-4222-8222-222222222222/compute"
              payload: {}
              as: Taxpayer
              as_user_id: "${tp_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RETURN_NOT_FOUND"
            - "HTTP status == 404"

  # -----------------------------------------------------------------
  # Endpoints
  # -----------------------------------------------------------------
  - section: endpoints
    instances:
      - name: estimated_tax_status_computed_read
        claim_type: Computed read
        grounds: [endpoints, calculations.compute_underpayment_penalty]
        distinguishing_aspect: "GET /tax-returns/{id}/estimated-tax-status returns the current-year safe harbor figures when current 90% is the lesser harbor: tax_after_credits 1,375,300 -> required 1,237,770, covered 500,000, shortfall 737,770, penalty 59,021."
