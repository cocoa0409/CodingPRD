scaffold_corner_design:

  # =========================================================================
  # Entities
  # =========================================================================
  - section: entities
    instances:
      - name: create_template_returns_201_with_all_fields
        claim_type: Creation
        grounds: [entities.ClassTemplate]
        distinguishing_aspect: "POST /culinary/templates with all required fields returns 201 and the body echoes title, skill_level, base_price_cents, default_capacity, station_fixed_cost_cents, prep_minutes, cleanup_minutes, status=DRAFT."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /culinary/templates"
              payload: { title: "Basics", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1200, prep_minutes: 30, cleanup_minutes: 15 }
              as: StudioAdmin
              captures: { tid: $.data.id }
          assert:
            - "response code == 201"
            - "ClassTemplate.${tid}.status == DRAFT"
            - "ClassTemplate.${tid}.base_price_cents == 5000"

      - name: get_session_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.ClassSession]
        distinguishing_aspect: "GET /culinary/sessions/{id} with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /culinary/sessions/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND"
            - "response http status == 404"

      - name: create_member_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Member.fields.email]
        distinguishing_aspect: "POST /culinary/members omitting required full_name returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /culinary/members"
              payload: { email: "nofull@x.com" }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: member_dietary_flags_defaults_to_empty_array
        claim_type: Defaults
        grounds: [entities.Member.fields.dietary_flags]
        distinguishing_aspect: "POST /culinary/members omitting dietary_flags yields dietary_flags == [] and wallet_credit_cents == 0, reliability_score == 100."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /culinary/members"
              payload: { full_name: "Defaulter", email: "def@x.com" }
              as: StudioAdmin
              captures: { mid: $.data.id }
          assert:
            - "Member.${mid}.dietary_flags == []"
            - "Member.${mid}.wallet_credit_cents == 0"
            - "Member.${mid}.reliability_score == 100"
            - "Member.${mid}.booking_status == GOOD_STANDING"

      - name: session_system_fields_generated_input_ignored
        claim_type: System Fields
        grounds: [entities.ClassSession.fields.confirmed_seats]
        distinguishing_aspect: "POST /culinary/sessions ignores any client-sent confirmed_seats/status; server stamps confirmed_seats=0 and status=SCHEDULED. (confirmed_seats/status are not in input so they are silently ignored.)"
        test_recipe:
          setup: ["published template exists"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef SF", email: "sf@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Sys", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
          trigger:
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STSF", event_type: "GROUP", start_at: "2026-11-01T14:00:00Z", end_at: "2026-11-01T16:00:00Z", planned_seats: 4 }
              as: StudioAdmin
              captures: { sid: $.data.id }
          assert:
            - "ClassSession.${sid}.confirmed_seats == 0"
            - "ClassSession.${sid}.status == SCHEDULED"
            - "ClassSession.${sid}.version == 1"

      - name: create_template_invalid_skill_level_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.ClassTemplate.fields.skill_level]
        distinguishing_aspect: "POST /culinary/templates with skill_level not in the enum returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /culinary/templates"
              payload: { title: "Bad", skill_level: "WIZARD", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: list_sessions_pagination_envelope
        claim_type: Listing
        grounds: [entities.ClassSession]
        distinguishing_aspect: "GET /culinary/sessions returns a paginated array envelope with total_count and has_more present."
        test_recipe:
          setup: ["two sessions created"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef LP", email: "lp@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Pag", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STP1", event_type: "GROUP", start_at: "2026-11-02T14:00:00Z", end_at: "2026-11-02T16:00:00Z", planned_seats: 4 }
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STP2", event_type: "GROUP", start_at: "2026-11-03T14:00:00Z", end_at: "2026-11-03T16:00:00Z", planned_seats: 4 }
              as: StudioAdmin
          trigger:
            - call: "GET /culinary/sessions"
              payload: { limit: 1, offset: 0 }
              as: StudioAdmin
          assert:
            - "response total_count >= 2"
            - "response has_more == true"
            - "response data length == 1"

      - name: giftcardtxn_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.GiftCardTxn]
        distinguishing_aspect: "GiftCardTxn has common_fields:false — append-only ledger, exposed only via list endpoints, no update/version field; an ISSUE txn appears on a new gift card with kind=ISSUE."
        test_recipe:
          setup: ["a member owns a freshly issued gift card"]
          setup_api_calls:
            - call: "POST /culinary/members"
              payload: { full_name: "Mem TX", email: "tx@x.com" }
              as: StudioAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /culinary/gift-cards"
              payload: { code: "GC-TX1", owner_member_id: "${mem_id}", initial_value_cents: 5000 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { gc_id: $.data.id }
          trigger:
            - call: "GET /culinary/gift-cards/${gc_id}/transactions"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
          assert:
            - "response data length == 1"
            - "GiftCardTxn[0].kind == ISSUE"
            - "GiftCardTxn[0].amount_cents == 5000"

  # =========================================================================
  # State machines
  # =========================================================================
  - section: state_machines
    instances:
      - name: open_already_open_session_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.ClassSession.SCHEDULED_to_OPEN]
        distinguishing_aspect: "Opening a session already in OPEN returns ERR_INVALID_STATE (409); no state change."
        test_recipe:
          setup: ["an OPEN session"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef IV", email: "iv@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Inv", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STIV", event_type: "GROUP", start_at: "2026-11-04T14:00:00Z", end_at: "2026-11-04T16:00:00Z", planned_seats: 4 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "z", qty_per_seat: 1, unit_cost_cents: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          trigger:
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "ClassSession.${sess_id}.status == OPEN (unchanged)"

      - name: open_session_without_ingredient_lines_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClassSession.SCHEDULED_to_OPEN]
        distinguishing_aspect: "Opening a SCHEDULED session that has zero IngredientLine rows fails the precondition with ERR_INVALID_STATE (409); session stays SCHEDULED."
        test_recipe:
          setup: ["a SCHEDULED session with no ingredient lines"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef NoIng", email: "noing@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "NoIng", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STNI", event_type: "GROUP", start_at: "2026-11-05T14:00:00Z", end_at: "2026-11-05T16:00:00Z", planned_seats: 4 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
          trigger:
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "ClassSession.${sess_id}.status == SCHEDULED"

      - name: terminal_completed_session_cannot_cancel
        claim_type: Terminal State Lockdown
        grounds: [state_machines.ClassSession.LOCKED_to_COMPLETED]
        distinguishing_aspect: "A COMPLETED session is terminal; POST cancel returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a COMPLETED session"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef TC", email: "tc@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Term", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STTC", event_type: "GROUP", start_at: "2026-11-06T14:00:00Z", end_at: "2026-11-06T16:00:00Z", planned_seats: 4 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "z", qty_per_seat: 1, unit_cost_cents: 1 }
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/lock"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/sessions/${sess_id}/complete"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          trigger:
            - call: "POST /culinary/sessions/${sess_id}/cancel"
              payload: {}
              as: StudioAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "ClassSession.${sess_id}.status == COMPLETED"

      - name: substitution_reject_from_requested
        claim_type: Valid Transition
        grounds: [state_machines.SubstitutionRequest.REQUESTED_to_REJECTED]
        distinguishing_aspect: "POST /culinary/substitutions/{id}/reject moves a REQUESTED substitution to REJECTED with no charge change on the booking."
        test_recipe:
          setup: ["a REQUESTED substitution on a confirmed booking with a CONTAINS_NUT line"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef RJ", email: "rj@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem RJ", email: "memrj@x.com" }
              as: StudioAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Nut", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 2, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STRJ", event_type: "GROUP", start_at: "2026-11-07T14:00:00Z", end_at: "2026-11-07T16:00:00Z", planned_seats: 2 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "peanut", qty_per_seat: 0.02, unit_cost_cents: 500, dietary_tag: "CONTAINS_NUT" }
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { line_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_id}", seats_requested: 1 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_1: $.data.version }
            - call: "POST /culinary/bookings/${bk_id}/confirm"
              payload: { expected_session_version: "${occ_sv_1}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /culinary/substitutions"
              payload: { booking_id: "${bk_id}", ingredient_line_id: "${line_id}", alternate_unit_cost_cents: 900 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /culinary/substitutions/${sub_id}/reject"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          assert:
            - "SubstitutionRequest.${sub_id}.status == REJECTED"
            - "Booking.${bk_id}.charge_cents == 5000 (unchanged; BEGINNER 1 seat, no surcharge)"

      - name: substitution_approve_surcharge_billed
        claim_type: Side Effect Execution
        grounds: [state_machines.SubstitutionRequest.REQUESTED_to_APPROVED, calculations.substitution_surcharge]
        distinguishing_aspect: "Approving the substitution adds surcharge 720 (delta 2400 * 0.05 * 6) to the booking charge, lifting it from 52380 to 53100, and bumps Booking.version."
        test_recipe:
          setup: ["a CONFIRMED 6-seat ADVANCED booking (charge 52380) with a CONTAINS_DAIRY line (1850, qty 0.05) and a REQUESTED substitution (alt 4250)"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef AP", email: "ap@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem AP", email: "memap@x.com" }
              as: StudioAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Dairy", skill_level: "ADVANCED", base_price_cents: 8500, default_capacity: 6, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STAP", event_type: "GROUP", start_at: "2026-11-08T14:00:00Z", end_at: "2026-11-08T16:00:00Z", planned_seats: 6 }
              as: StudioAdmin
              captures: { sess_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/ingredient-lines"
              payload: { name: "cream", qty_per_seat: 0.05, unit_cost_cents: 1850, dietary_tag: "CONTAINS_DAIRY" }
              as: Instructor
              as_user_id: "${instr_id}"
              captures: { line_id: $.data.id }
            - call: "POST /culinary/sessions/${sess_id}/open"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
            - call: "POST /culinary/bookings"
              payload: { session_id: "${sess_id}", member_id: "${mem_id}", seats_requested: 6 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { bk_id: $.data.id }
            - call: "GET /culinary/sessions/${sess_id}"
              payload: {}
              as: StudioAdmin
              captures: { occ_sv_2: $.data.version }
            - call: "POST /culinary/bookings/${bk_id}/confirm"
              payload: { expected_session_version: "${occ_sv_2}" }
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /culinary/substitutions"
              payload: { booking_id: "${bk_id}", ingredient_line_id: "${line_id}", alternate_unit_cost_cents: 4250 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { sub_id: $.data.id }
          trigger:
            - call: "POST /culinary/substitutions/${sub_id}/approve"
              payload: {}
              as: Instructor
              as_user_id: "${instr_id}"
          assert:
            - "SubstitutionRequest.${sub_id}.surcharge_cents == 720"
            - "Booking.${bk_id}.charge_cents == 53100"

      - name: new_session_starts_scheduled
        claim_type: Initial State
        grounds: [state_machines.ClassSession.SCHEDULED_to_OPEN, entities.ClassSession.fields.status]
        distinguishing_aspect: "A freshly created session has status == SCHEDULED (initial_state)."
        test_recipe:
          setup: ["published template"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef IS", email: "is@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Init", skill_level: "BEGINNER", base_price_cents: 5000, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
          trigger:
            - call: "POST /culinary/sessions"
              payload: { template_id: "${tmpl_id}", instructor_id: "${instr_id}", station_id: "STIS", event_type: "GROUP", start_at: "2026-11-09T14:00:00Z", end_at: "2026-11-09T16:00:00Z", planned_seats: 4 }
              as: StudioAdmin
              captures: { sid: $.data.id }
          assert:
            - "ClassSession.${sid}.status == SCHEDULED"

      - name: session_full_blocks_direct_booking_excluded
        claim_type: guarded transitions
        grounds: [state_machines.ClassSession.OPEN_to_FULL]
        excluded_because:
          difficulty_instance: non_linear_state_machine / session_open_full_open_cycle
          rationale: "The OPEN->FULL auto-transition and its capacity gating are asserted within the session capacity cycle §1.8 instance."

  # =========================================================================
  # Calculations
  # =========================================================================
  - section: calculations
    instances:
      - name: private_event_uses_flat_fee_not_per_seat
        claim_type: Variant Selection
        grounds: [calculations.booking_charge, entities.ClassSession.fields.event_type, entities.ClassSession.fields.private_event_fee_cents]
        distinguishing_aspect: "For a PRIVATE event the booking charge equals private_event_fee_cents (40000), ignoring base_price/skill/discount entirely; seats_requested must equal planned_seats."
        test_recipe:
          setup: ["OPEN PRIVATE session planned_seats=4, private_event_fee_cents=40000"]
          setup_api_calls:
            - call: "POST /culinary/instructors"
              payload: { full_name: "Chef PV", email: "pv@x.com", max_skill_level: "PROFESSIONAL" }
              as: StudioAdmin
              captures: { instr_id: $.data.id }
            - call: "POST /culinary/members"
              payload: { full_name: "Mem PV", email: "mempv@x.com" }
              as: StudioAdmin
              captures: { mem_id: $.data.id }
            - call: "POST /culinary/templates"
              payload: { title: "Priv", skill_level: "ADVANCED", base_price_cents: 8500, default_capacity: 4, station_fixed_cost_cents: 1000, prep_minutes: 0, cleanup_minutes: 0 }
              as: StudioAdmin
              captures: { tmpl_id: $.data.id }
            - call: "POST /culinary/templates/${tmpl_id}/publish"
              payload: {}
              as: StudioAdmin
            - call: "POST /culinary/sessions"
