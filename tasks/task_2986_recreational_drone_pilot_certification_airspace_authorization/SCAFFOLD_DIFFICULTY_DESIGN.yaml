  - rule_id: transitive_cascade
    instances:
      - name: pilot_suspension_cascades_through_aircraft_authorization_to_flight
        grounds:
          - endpoints.POST_/drone-ops/pilots/{id}/suspend
          - state_machines.Aircraft
          - state_machines.AirspaceAuthorization
          - state_machines.Flight
          - calculations.zone_slot_conservation
          - entities.AirspaceZone.fields.reserved_slot_count
        distinguishing_aspect: |
          Trigger: a compliance suspension of the pilot. Depth 4 -
          Pilot -> SUSPENDED (link 1) grounds the REGISTERED airframe (link 2), which revokes the
          APPROVED authorization bound to that airframe and returns its zone slot (link 3), which
          cancels the PLANNED flight citing that authorization (link 4). Nothing in the pilot
          suspend request names the aircraft, the authorization, the zone counter or the flight.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-05T00:00:00Z."
            - "One COMMERCIAL pilot, CERTIFIED, with an ACTIVE indemnified InsurancePolicy of 5000000 cents."
            - "Aircraft #1: 249 g, max_altitude_ft 900, REGISTERED. Aircraft #2: 249 g, left in PENDING_REGISTRATION as a control."
            - "One class D zone with class_ceiling_ft 700, requires_authorization true, structure_relief_eligible false, max_concurrent_authorizations 2."
            - "One APPROVED authorization on aircraft #1 for 2026-08-20T09:00:00Z .. 2026-08-20T12:00:00Z with granted_ceiling_ft 400, so zone.reserved_slot_count is 1."
            - "One PLANNED flight citing that authorization for 2026-08-20T09:30:00Z .. 2026-08-20T10:30:00Z at 380 ft."
          setup_api_calls:
            - call: "POST /drone-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /drone-ops/pilots"
              payload: { full_name: "Hana Ito", email: "hana.ito@example.com", operator_category: "COMMERCIAL" }
              as: ComplianceOfficer
              captures: { pid: $.data.id }
            - call: "POST /drone-ops/pilots/${pid}/knowledge-tests"
              payload: { test_code: "PART107_COMMERCIAL", scheduled_at: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 93 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Ridge Runner", serial_number: "SN-CASC-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
