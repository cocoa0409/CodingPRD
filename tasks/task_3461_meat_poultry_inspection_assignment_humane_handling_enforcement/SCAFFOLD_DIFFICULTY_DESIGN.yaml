              as: Inspector
              as_user_id: "${insp_id}"
              captures: { s2: $.data.id }
            - call: "POST /inspection/pathogen-samples"
              payload: { establishment_id: "${est_id}", collected_by_inspector_id: "${insp_id}", pathogen: "SALMONELLA", collected_at: "2026-09-03T10:00:00Z" }
