              as: LabAnalyst
            - call: "POST /lab-pools/${pool_id}/transitions"
              payload: { action: "RESULT", result: "POSITIVE", ct_value: 26.0 }
              as: LabAnalyst
            - call: "GET /service-areas/${area_id}"
              payload: {}
              as: VectorEcologist
              as_user_id: "u-eco-1"
