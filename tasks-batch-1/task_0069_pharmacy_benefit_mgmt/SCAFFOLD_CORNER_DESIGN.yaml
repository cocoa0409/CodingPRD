  # ===========================================================================
  - section: rbac
    instances:
      - name: pharmacy_provider_cannot_create_plan
        claim_type: unauthorized_role
        grounds: [roles.PharmacyProvider, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "PharmacyProvider POSTing /plans (a PlanAdmin exclusive op) returns ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PharmacyProvider
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: reviewer_cannot_decide_pa
        claim_type: unauthorized_role
        grounds: [roles.PharmacistReviewer, roles.MedicalDirector, "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "PharmacistReviewer cannot call POST /prior-authorizations/{id}/decide (MedicalDirector exclusive) -> ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["PA submitted PENDING_REVIEW."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "X", drug_name: "X", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id, pa_v0: $.data.version }
          trigger:
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "APPROVE", expected_prior_authorization_version: "${pa_v0}" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: unauthenticated
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /pbm/plans"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_plan_version_on_finalize_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[rebate-finalize-stale-plan-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Finalizing rebates with an expected_benefit_plan_version one behind the current plan version returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Plan created (version 1); plan archived bumps version to 2; finalize sent with stale expected version 1."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id, plan_v0: $.data.version }
            - call: "POST /pbm/plans/${plan_id}/archive"
              payload: {}
              as: PlanAdmin
          trigger:
            - call: "POST /pbm/plans/${plan_id}/finalize-rebates"
              payload: { expected_benefit_plan_version: "${plan_v0}" }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_version_increments_on_pa_decide
        claim_type: optimistic_concurrency
        grounds: [entities.PriorAuthorization.fields.version, state_machines.PriorAuthorization.PENDING_REVIEW_to_APPROVED]
        distinguishing_aspect: "A successful PA decide with the correct expected version increments PriorAuthorization.version by exactly 1."
        test_recipe:
          setup: ["PA submitted PENDING_REVIEW (version 1)."]
          setup_api_calls:
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 0, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "X", drug_name: "X", tier: "TIER_2", ingredient_cost_cents: 30000, pa_required: true }
              as: PlanAdmin
              captures: { drug: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/prior-authorizations"
              payload: { member_id: "${m}", formulary_drug_id: "${drug}", authorized_fills: 1, valid_through_date: "2026-12-31T00:00:00.000Z" }
              as: PharmacistReviewer
              as_user_id: "U_REV"
              captures: { pa: $.data.id, pa_v0: $.data.version }
          trigger:
            - call: "POST /pbm/prior-authorizations/${pa}/decide"
              payload: { decision: "APPROVE", expected_prior_authorization_version: "${pa_v0}" }
              as: MedicalDirector
              as_user_id: "U_DIR"
              captures: { pa_v1: $.data.version }
          assert:
            - "PriorAuthorization.${pa}.status == APPROVED"
            - "PriorAuthorization.${pa}.version == 2"

      - name: derived_field_reconcile_after_partial_reversal_of_two_claims
        claim_type: derived_field_reconciliation
        grounds: [calculations.acc_oop_met, entities.Member.fields.oop_met_cents, state_machines.Claim.PAID_to_REVERSED]
        distinguishing_aspect: "After two PAID claims (oop_met 53500) reversing the SECOND leaves oop_met=30000 (chronological recompute of the surviving first claim)."
        test_recipe:
          setup: ["Plan deductible 50000; two T2 drugs ingredient 30000; member files C1 then C2 (both PAID)."]
          setup_api_calls:
            - call: "POST /pbm/_clock/set"
              payload: { to_iso8601: "2026-08-10T00:00:00.000Z" }
              as: PlanAdmin
            - call: "POST /pbm/plans"
              payload: { name: "P", plan_year: 2026, deductible_cents: 50000, oop_max_cents: 200000, tier_copay_cents: { TIER_1: 1000, TIER_2: 3500, TIER_3: 7000, SPECIALTY: 25000 } }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "D1", drug_name: "D1", tier: "TIER_2", ingredient_cost_cents: 30000 }
              as: PlanAdmin
              captures: { d1: $.data.id }
            - call: "POST /pbm/formulary-drugs"
              payload: { plan_id: "${plan_id}", ndc: "D2", drug_name: "D2", tier: "TIER_2", ingredient_cost_cents: 30000 }
              as: PlanAdmin
              captures: { d2: $.data.id }
            - call: "POST /pbm/members"
              payload: { plan_id: "${plan_id}", full_name: "M" }
              as: PlanAdmin
              captures: { m: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${d1}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { c1: $.data.id }
            - call: "POST /pbm/claims"
              payload: { member_id: "${m}", formulary_drug_id: "${d2}", days_supply: 30, pharmacy_type: "RETAIL" }
              as: PharmacyProvider
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /pbm/claims/${c2}/reverse"
