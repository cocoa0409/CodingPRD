              captures: { p1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-203", surface_class: "FOAM_OVERLAY", daily_rate_cents: 7000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s1_id: "$.data.id" }
            - call: "POST /support-surfaces"
              payload: { asset_tag: "BED-204", surface_class: "FOAM_OVERLAY", daily_rate_cents: 7000, vendor_name: "AirBeds Inc" }
              as: MaterialsCoordinator
              captures: { s2_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s1_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-08T00:00:00Z", authorized_days: 7 }
              as: MaterialsCoordinator
              captures: { o1_id: "$.data.id" }
            - call: "POST /support-surface-orders"
              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s2_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-08T00:00:00Z", authorized_days: 7 }
              as: MaterialsCoordinator
              captures: { o2_id: "$.data.id" }
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v1: "$.data.version" }
          trigger:
            - call: "POST /support-surface-orders/${o1_id}/approve"
              payload: { expected_unit_version: "${u1_v1}" }
              as: MaterialsCoordinator
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v2: "$.data.version" }
            - call: "POST /support-surface-orders/${o2_id}/approve"
              payload: { expected_unit_version: "${u1_v2}" }
              as: MaterialsCoordinator
              captures: { err_id: "$.data.error_id" }
            - call: "POST /units/${u1_id}/budget-adjustments"
              payload: { delta_cents: -1, reason: "Attempt to sweep one cent out of a fully encumbered ledger." }
              as: WocProgramDirector
            - call: "POST /units/${u1_id}/budget-adjustments"
              payload: { delta_cents: 52920, reason: "Second specialty bed approved by finance." }
              as: WocProgramDirector
            - call: "GET /units/${u1_id}"
              payload: {}
              as: MaterialsCoordinator
              captures: { u1_v3: "$.data.version" }
            - call: "POST /support-surface-orders/${o2_id}/approve"
              payload: { expected_unit_version: "${u1_v3}" }
              as: MaterialsCoordinator
          assert:
            - "Both orders report authorized_cost_cents == 52920 (projected 49000 at 7 tier-1 days plus an 8% fee of 3920)"
            - "Call 1 returns HTTP 200 at the exact boundary: 52920 <= rental_available_cents 52920"
            - "After call 1: Unit.${u1_id}.rental_encumbered_cents == 52920 and rental_available_cents == 0"
            - "Call 3 returns HTTP 402 with data.error_id == ERR_RENTAL_BUDGET_EXCEEDED — the second order is individually affordable against the cap but not against the remaining availability"
            - "After call 3 SupportSurfaceOrder.${o2_id}.fulfillment_status is still REQUESTED, SupportSurface.${s2_id}.status is still AVAILABLE and Unit.${u1_id}.version is unchanged"
            - "Call 4 returns HTTP 402 with ERR_RENTAL_BUDGET_EXCEEDED as well: lowering the cap by a single cent would make rental_available_cents negative, so the same rule guards the ledger from both sides"
            - "After call 4 Unit.${u1_id}.rental_budget_cap_cents is still 52920"
            - "Call 5 returns HTTP 200: rental_budget_cap_cents == 105840 and rental_available_cents == 52920 (105840 - 52920 encumbered - 0 committed)"
            - "Call 7 returns HTTP 200 with a byte-identical body to the refused call 3 apart from the OCC version — the order itself was never the problem"
            - "Final ledger: rental_encumbered_cents == 105840, rental_available_cents == 0, and both orders at fulfillment_status APPROVED with billing_status ENCUMBERED"

      - name: consult_close_rejected_until_hapi_rca_complete
        claim_type: Cascading validation
        grounds:
          - validations[priority=36]
          - errors[ERR_RCA_NOT_COMPLETE]
          - state_machines.PressureInjuryCase.RCA_REQUIRED_to_RCA_IN_PROGRESS
          - state_machines.PressureInjuryCase.RCA_IN_PROGRESS_to_RCA_COMPLETE
        distinguishing_aspect: "The consult's own state machine is fully satisfied — it sits at PLAN_ACTIVE with a live protocol — yet closure depends on a downstream entity reaching an allowed status. RCA_IN_PROGRESS is deliberately NOT in the allowed set, so starting the analysis is not enough; only completing it releases the consult."
        test_recipe:
          setup:
            - "Unit 3E exists with Nina at CANDIDATE and Omar fully CERTIFIED via the CERTIFY-A-NURSE idiom, so Omar can lead an RCA and is not the staging nurse."
            - "Patient MRN-AA1 was admitted 2026-07-30T00:00:00Z, so the POA window closed before the logical clock."
            - "Consult C1 is triaged, assigned to Nina and carries SACRUM assessment A1 observed 2026-08-01T00:00:00Z, validated by the director with present_on_admission_confirmed false — producing a HAPI case at RCA_REQUIRED."
            - "Protocol DP1 is then filed against RESTRICTED product DRSG-20, moving C1 to PLAN_ACTIVE."
          setup_api_calls:
            - call: "POST /units"
              payload: { unit_code: "3E", name: "Three East", bed_count: 18, rental_budget_cap_cents: 0 }
              as: WocProgramDirector
