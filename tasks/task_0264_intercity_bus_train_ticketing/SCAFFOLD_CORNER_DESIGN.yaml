  - section: validations
    instances:
      - name: sold_out_blocks_hold
        claim_type: Violation -> Error
        grounds: ["validations[priority=13]", "errors[ERR_SOLD_OUT]"]
        distinguishing_aspect: "Holding a leg on a ServiceDate whose seats_available == 0 -> ERR_SOLD_OUT (409)."
        test_recipe:
          setup: ["ServiceDate seats_total=1; one HELD booking already occupies the only seat (seats_available 0); a second passenger tries to hold."]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SupportAgent
            - call: "POST /v1/operators"
              payload: { name: "Coastliner", mode: "BUS" }
              as: ScheduleManager
              captures: { op_id: $.data.id }
            - call: "POST /v1/fare-classes"
              payload: { operator_id: "${op_id}", code: "ECONOMY", seating_mode: "OPEN" }
              as: FareAnalyst
