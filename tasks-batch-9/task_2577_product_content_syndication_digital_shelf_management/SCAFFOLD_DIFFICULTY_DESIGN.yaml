      - name: prohibited_claim_priority_35_beats_attribute_length_priority_40
        grounds:
          - validations[priority=35]
          - validations[priority=40]
          - errors[ERR_PROHIBITED_CLAIM]
          - errors[ERR_ATTRIBUTE_LENGTH_EXCEEDED]
          - entities.ContentAttributeValue.fields.char_count
        distinguishing_aspect: |
          A 66-character value carrying the token "cures" breaks the prohibited-claim screen at
          priority 35 and the 40-character taxonomy ceiling at priority 40 at once, and must return
          ERR_PROHIBITED_CLAIM; a clean 59-character value on the same key then returns
          ERR_ATTRIBUTE_LENGTH_EXCEEDED. Neither rejected write may leave a ContentAttributeValue row
          behind.
        test_recipe:
          setup:
            - "the taxonomy holds title (max_chars 200, base_weight 40.00) and description with a deliberately tight max_chars of 40 and base_weight 30.00"
            - "product SKU-P-1 has one DRAFT revision with no attribute values yet"
            - "PROHIBITED_CLAIM_TOKENS are 'cures', 'fda approved' and '100% guaranteed', matched case-insensitively as substrings of the stripped value"
          setup_api_calls:
            - call: "POST /digital-shelf/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "title", data_type: "STRING", taxonomy_group: "CORE", max_chars: 200, base_weight: 40.00, is_global_required: true }
              as: ShelfAdmin
            - call: "POST /digital-shelf/attribute-definitions"
              payload: { attribute_key: "description", data_type: "STRING", taxonomy_group: "MARKETING", max_chars: 40, base_weight: 30.00, is_global_required: false }
              as: ShelfAdmin
            - call: "POST /digital-shelf/products"
              payload: { sku: "SKU-P-1", gtin: "00012345678943", category_code: "SMALL_APPLIANCE", brand_code: "BRHM" }
              as: ContentAuthor
              captures: { pp_id: $.data.id }
            - call: "POST /digital-shelf/content-versions"
              payload: { product_id: "${pp_id}", image_count: 1 }
              as: ContentAuthor
              captures: { vp_id: $.data.id }
          trigger:
            - call: "POST /digital-shelf/content-versions/${vp_id}/attribute-values"
              payload: { attribute_key: "description", value: "This herbal tonic cures every ailment within a single week of use." }
              as: ContentAuthor
              captures: { err_1: $.data.error_id }
            - call: "POST /digital-shelf/content-versions/${vp_id}/attribute-values"
              payload: { attribute_key: "description", value: "A compact 900 watt blender with six speeds and a glass jar." }
              as: ContentAuthor
              captures: { err_2: $.data.error_id }
          assert:
            - "${err_1} == \"ERR_PROHIBITED_CLAIM\" with HTTP 422 — the 66-character value also exceeds max_chars 40, but priority 35 outranks priority 40"
            - "${err_2} == \"ERR_ATTRIBUTE_LENGTH_EXCEEDED\" with HTTP 422 — the 59-character value carries no prohibited token, so the ceiling rule is reached"
            - "GET /digital-shelf/content-versions/${vp_id}/attribute-values returns total_count 0 — neither rejected write created a row"
            - "ContentVersion.${vp_id}.state == \"DRAFT\" and version == 1 — a rejected attribute write never advances the revision"

