          Entity pair Order -> Customer, a third distinct pair: confirming a takeback_linked
          order is refused with ERR_TAKEBACK_AGREEMENT_INACTIVE while the account's
          takeback_agreement_status is NONE, and the identical confirm succeeds once the
          agreement is switched to ACTIVE.
