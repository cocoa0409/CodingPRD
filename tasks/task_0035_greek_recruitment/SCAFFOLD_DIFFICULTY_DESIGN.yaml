  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: tcasc_round_advance_party_to_mutual_expires_risk_recomputes_status_unblocks_chapter
        grounds:
          - state_machines.RecruitmentRound.PARTY_to_MUTUAL_SELECTION
          - state_machines.RiskIncident.ACTIVE_to_EXPIRED
          - calculations.risk_status_from_points
          - entities.Chapter.fields.risk_status
        distinguishing_aspect: |
          Depth-3 cascade with each link strictly caused by the previous:
          (1) POST /rush/rounds/{id}/advance flips Round.phase PARTY ->
          MUTUAL_SELECTION; (2) that phase change causes each party-tied
          ACTIVE RiskIncident on this round to transition ACTIVE -> EXPIRED
          (CAUSED BY the round transition, not by the original POST);
          (3) that incident expiry causes the Chapter to recompute
          risk_points and risk_status via §1.3 risk_status_from_points,
          flipping the chapter from PROBATION back to GOOD_STANDING. Each
          link is the consequence of the previous link.
        test_recipe:
          setup:
            - "Chapter H sits at risk_points=6 (PROBATION) — one ACTIVE RiskIncident severity_points=6 tied to the round's only party."
            - "Round.phase=PARTY; party already COMPLETED."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Theta", greek_type: "SORORITY", quota_total: 5, dues_per_member_cents: 20000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_h: $.data.id }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 tcasc1", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
              captures: { rnd: $.data.id }
            - call: "POST /rush/parties"
              payload: { round_id: "${rnd}", chapter_id: "${ch_h}", scheduled_start_utc: "2026-09-05T18:00:00Z", duration_minutes: 60, capacity: 10 }
              as: ChapterOfficer
              as_user_id: "${ch_h}"
              captures: { party_h: $.data.id }
            - call: "POST /rush/parties/${party_h}/open"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_h}"
            - call: "POST /rush/parties/${party_h}/complete"
              payload: {}
              as: ChapterOfficer
              as_user_id: "${ch_h}"
            - call: "POST /rush/risk-incidents"
              payload: { chapter_id: "${ch_h}", party_id: "${party_h}", severity_points: 6, reason: "noise complaint" }
              as: RiskOfficer
              captures: { ri: $.data.id }
            - call: "GET /rush/chapters/${ch_h}"
              payload: {}
              as: PanhellenicAdmin
              captures: { ch_h_pre_status: $.data.risk_status, ch_h_pre_points: $.data.risk_points }
          trigger:
            - call: "POST /rush/rounds/${rnd}/advance"
              payload: {}
              as: RecruitmentChair
          assert:
            - "Step 1: RecruitmentRound ${rnd}.phase == MUTUAL_SELECTION."
            - "Step 2 (caused by Step 1): RiskIncident ${ri}.status == EXPIRED (party_id is non-null and tied to this round)."
            - "Step 3 (caused by Step 2): Chapter ${ch_h}.risk_points == 0 (the only ACTIVE incident is now EXPIRED)."
            - "Step 3 (caused by Step 2): Chapter ${ch_h}.risk_status == GOOD_STANDING (recomputed via risk_status_from_points; 0 < 6 PROBATION_THRESHOLD)."
            - "ch_h_pre_status == PROBATION before the trigger; ch_h_pre_points == 6 — proving the chain advanced state, not just observed it."

      - name: tcasc_pnm_withdraw_cascades_decline_invitations_decrements_party_count
        grounds:
          - state_machines.PNM.ACTIVE_to_WITHDRAWN
          - state_machines.PartyInvitation.ACCEPTED_to_DECLINED
          - entities.Party.fields.confirmed_count
        distinguishing_aspect: |
          Depth-2 cascade originating from a DIFFERENT trigger (POST
          /pnms/{id}/withdraw, not the round-advance of instance A): (1) PNM
          status flips ACTIVE -> WITHDRAWN; (2) each ACCEPTED invitation on
          that PNM transitions to DECLINED CAUSED BY the PNM withdrawal;
          (2-derived) Party.confirmed_count for each affected party is
          recomputed downward as a derived-field consequence of the
          invitation transition — different originating transition from
          instance A, different propagation pattern.
        test_recipe:
          setup:
            - "Chapter J GOOD_STANDING; round in PARTY; two OPEN parties; PNM Y1 ACTIVE with ACCEPTED invitations on both parties."
          setup_api_calls:
            - call: "POST /rush/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PanhellenicAdmin
            - call: "POST /rush/chapters"
              payload: { name: "Iota", greek_type: "SORORITY", quota_total: 5, dues_per_member_cents: 20000, legacy_priority_slots: 0 }
              as: PanhellenicAdmin
              captures: { ch_j: $.data.id }
            - call: "POST /rush/rounds"
              payload: { cycle_label: "Fall 2026 tcasc2", bid_day_at: "2026-09-15T12:00:00Z" }
              as: PanhellenicAdmin
