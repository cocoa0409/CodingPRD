      - name: complete_overrun_acres_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=9]
          - errors[ERR_ACRES_OVERRUN]
        distinguishing_aspect: "Setting actual_acres > planned_acres * 1.10 then complete yields ERR_ACRES_OVERRUN."
        test_recipe:
          setup: ["Stop in CUTTING with planned_acres=100; actual_acres patched to 120 (exceeds 110 cap)"]
