            - "the refusals are temporal, not capacity or duplicate: slots B, C and D are all empty and none of them already holds a row for ${sm_1}"

      - name: accessibility_peak_units_half_open_slices
        grounds:
          - calculations.accessibility_peak_occupancy
          - constants.INTERVAL_SEMANTICS
          - validations[priority=18]
          - errors.ERR_ACCESSIBILITY_CAPACITY_EXCEEDED
          - state_machines.AccessibilityRequest.CONFIRMED_to_CANCELLED
          - entities.AccessibilityResource.fields.peak_committed_units
        distinguishing_aspect: |
          A DIFFERENT resource entity (AccessibilityResource) with DIFFERENT interval semantics:
          half-open [start, end) windows whose UNIT WEIGHTS are summed per elementary slice, and where
          the capacity comparison is <= rather than <. Adjacency is explicitly not concurrency - a
          request ending exactly when another begins adds nothing to the peak - and the refusal is
          driven by a 10-minute sliver of overlap rather than by whole-window containment. Releasing a
          confirmed request then frees exactly that sliver and the previously refused request becomes
          confirmable, which a naive running-counter implementation cannot reproduce.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T15:00:00Z; Event in PLANNED (one ACTIVE plan) so REQUESTED -> CONFIRMED is permitted."
            - "An ASSISTIVE_LISTENING_UNIT AccessibilityResource in zone Z960 with unit_count 3."
            - "Three CONFIRMED single-unit requests: r1 [18:00, 20:00), r2 [19:00, 21:00), r3 [19:30, 19:45). The elementary slice [19:30, 19:45) carries all three, so peak_committed_units == 3 and the pool is exactly full there."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T15:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Peak Occupancy Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T16:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z960", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /accessibility-resources"
              payload: { event_id: "${ev_id}", resource_type: "ASSISTIVE_LISTENING_UNIT", zone_code: "Z960", unit_count: 3 }
              as: GuestServicesSupervisor
              captures: { res_id: $.data.id }
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_id}", guest_reference: "G-901", window_start: "2026-09-12T18:00:00Z", window_end: "2026-09-12T20:00:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { req_1: $.data.id }
            - call: "POST /accessibility-requests/${req_1}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_id}", guest_reference: "G-902", window_start: "2026-09-12T19:00:00Z", window_end: "2026-09-12T21:00:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { req_2: $.data.id }
            - call: "POST /accessibility-requests/${req_2}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_id}", guest_reference: "G-903", window_start: "2026-09-12T19:30:00Z", window_end: "2026-09-12T19:45:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { req_3: $.data.id }
            - call: "POST /accessibility-requests/${req_3}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
          trigger:
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_id}", guest_reference: "G-907", window_start: "2026-09-12T17:00:00Z", window_end: "2026-09-12T18:00:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { req_7: $.data.id }
            - call: "POST /accessibility-requests/${req_7}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests"
              payload: { resource_id: "${res_id}", guest_reference: "G-904", window_start: "2026-09-12T19:00:00Z", window_end: "2026-09-12T19:40:00Z", units_requested: 1 }
              as: GuestServicesSupervisor
              captures: { req_4: $.data.id }
            - call: "POST /accessibility-requests/${req_4}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests/${req_3}/transition"
              payload: { target_status: "CANCELLED" }
              as: GuestServicesSupervisor
            - call: "POST /accessibility-requests/${req_4}/transition"
              payload: { target_status: "CONFIRMED" }
              as: GuestServicesSupervisor
          assert:
            - "before the trigger AccessibilityResource.${res_id}.peak_committed_units == 3, from the slice [19:30, 19:45) where r1, r2 and r3 are all live"
            - "adjacency: confirming r7 over [17:00, 18:00) returns 200 even though the pool is already at 3, because r7 ends exactly when r1 begins and half-open windows that merely touch are not concurrent"
            - "after r7 is confirmed AccessibilityResource.${res_id}.peak_committed_units == 3, unchanged - r7 adds nothing to the maximum"
            - "sliver overlap: confirming r4 over [19:00, 19:40) returns 409 with data.error_id == ERR_ACCESSIBILITY_CAPACITY_EXCEEDED, because only the 10-minute slice [19:30, 19:40) would reach 4 units against unit_count 3"
            - "after that refusal AccessibilityRequest.${req_4}.status == REQUESTED, confirmed_at == null and peak_committed_units is still 3"
            - "cancelling r3 releases its unit: AccessibilityRequest.${req_3}.status == CANCELLED and AccessibilityResource.${res_id}.peak_committed_units drops to 2 (the slice [19:00, 20:00) now carries only r1 and r2)"
            - "re-confirming r4 now returns 200 and peak_committed_units returns to exactly 3, so capacity is genuinely recomputed from the live row set rather than tracked as a monotone counter"
            - "the comparison is <= and not <: three concurrent single-unit requests on a unit_count 3 pool are all confirmable"

  # =====================================================================================
  # Rule 9 - compensating invariants over DIFFERENT conserved quantities, each pinned
  # as an explicit formula that must hold before AND after the compensation
  # =====================================================================================
  - rule_id: compensating_invariant
    instances:

      - name: backfill_release_restores_filled_headcount_identity
        grounds:
          - state_machines.StaffAssignment.SCHEDULED_to_RELEASED
          - state_machines.BackfillRequest.FILLED_to_OPEN
          - state_machines.PositionSlot.FILLED_to_PARTIALLY_FILLED
          - calculations.backfill_candidate_selection
          - entities.PositionSlot.fields.filled_headcount
          - entities.BackfillRequest.fields.attempt_count
        distinguishing_aspect: |
          Conserved quantity - a HEADCOUNT identity, pinned as the explicit formula
          PositionSlot.filled_headcount == count(StaffAssignment on that slot with attendance_status
          IN {SCHEDULED, CHECKED_IN, COMPLETED}). It is asserted at four points across a no-show /
          backfill / release round trip, so the compensation has to be a true inverse: releasing the
          backfill-sourced assignment must decrement the slot AND walk the BackfillRequest back from
          FILLED to OPEN with selected_staff_member_id and filled_assignment_id cleared, while
          attempt_count is deliberately NOT rolled back (attempts are a monotone audit counter, not
          part of the conserved quantity). Reversing only one of the two directions leaves drift.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T17:00:00Z; Event IN_PROGRESS with a LOCKED plan; TICKET_TAKER PositionType with no required certifications."
            - "One slot with required_headcount_override 2. M1, M2 and M3 are all ACTIVE with in_backfill_pool true, so the candidate set is decided by the exclusion rules and not by the pool flag."
            - "M1 and M2 are assigned, making the slot FILLED with filled_headcount 2."
            - "M1 is then marked NO_SHOW - its reliability_score falls to 75, which is above the 65 probation floor, so M1 stays ACTIVE and no probation cascade adds noise."
            - "The resulting OPEN BackfillRequest is auto-filled. M1 is excluded as the triggering member and M2 is excluded for already holding a non-terminal assignment on this slot, so M3 is the unique candidate and gets a BACKFILL assignment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T17:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Headcount Invariant Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "B100", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:00:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Fay Osei", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-01-01T00:00:00Z", hourly_rate_cents: 2000, in_backfill_pool: true }
              as: StaffingCoordinator
              captures: { sm_1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Gil Prado", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-02-01T00:00:00Z", hourly_rate_cents: 2000, in_backfill_pool: true }
              as: StaffingCoordinator
              captures: { sm_2: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Hana Ruiz", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-03-01T00:00:00Z", hourly_rate_cents: 2000, in_backfill_pool: true }
              as: StaffingCoordinator
              captures: { sm_3: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${sm_2}" }
              as: StaffingCoordinator
              captures: { asg_2: $.data.id }
            - call: "POST /staff-assignments/${asg_1}/attendance"
              payload: { action: "NO_SHOW" }
              as: StaffingCoordinator
            - call: "GET /backfill-requests?triggering_assignment_id=${asg_1}"
              payload: {}
              as: StaffingCoordinator
              captures: { br_id: "$.data[0].id" }
            - call: "POST /backfill-requests/${br_id}/auto-fill"
              payload: {}
              as: StaffingCoordinator
              captures: { asg_3: $.data.filled_assignment_id }
          trigger:
            - call: "POST /staff-assignments/${asg_3}/attendance"
              payload: { action: "RELEASE" }
              as: StaffingCoordinator
          assert:
            - "invariant after both original assignments: PositionSlot.${slot_id}.filled_headcount == 2 == count of assignments on the slot with attendance_status IN {SCHEDULED, CHECKED_IN, COMPLETED}, status FILLED"
            - "invariant after the NO_SHOW: filled_headcount == 1 == the same count (only ${asg_2} remains countable), status PARTIALLY_FILLED"
            - "invariant after the auto-fill: filled_headcount == 2 == the same count (${asg_2} and ${asg_3}), status FILLED"
            - "invariant after the RELEASE trigger: filled_headcount == 1 == the same count (only ${asg_2}), status PARTIALLY_FILLED - the identity holds at every one of the four observation points"
            - "the auto-fill winner is ${sm_3}: BackfillRequest.${br_id}.selected_staff_member_id was ${sm_3}, and StaffAssignment.${asg_3}.source == BACKFILL with attendance_status SCHEDULED"
            - "compensation on the assignment: StaffAssignment.${asg_3}.attendance_status == RELEASED, payout_status == VOIDED and total_payout_cents == 0"
            - "compensation on the request: BackfillRequest.${br_id}.status == OPEN again, with selected_staff_member_id == null and filled_assignment_id == null"
            - "deliberately NOT compensated: BackfillRequest.${br_id}.attempt_count == 1 both before and after the release (a monotone audit counter, outside the conserved quantity)"
            - "reliability is untouched by the compensation: StaffMember.${sm_3}.no_show_strikes == 0, reliability_score == 100 and season_reliability_score == 100"
            - "the no-show member is unchanged by the compensation: StaffMember.${sm_1}.status == ACTIVE, no_show_strikes == 1, reliability_score == 75"
            - "exactly one BackfillRequest exists for this slot: GET /backfill-requests?position_slot_id=${slot_id} returns total_count 1 - the release must reopen the original request, not create a second one"

      - name: refund_void_restores_budget_ledger_identity
        grounds:
          - calculations.event_refund_budget_ledger
          - calculations.refund_authorized_amount
          - endpoints.POST_/guest-issues/{id}/refund-decision
          - validations[priority=22]
          - entities.Event.fields.refund_budget_remaining_cents
          - entities.Event.fields.refund_approved_total_cents
        distinguishing_aspect: |
          A DIFFERENT conserved quantity - a MONEY identity rather than a headcount, pinned as
          Event.refund_budget_remaining_cents + Event.refund_approved_total_cents ==
          Event.refund_budget_total_cents. The compensation is a VOID, which must restore the ledger
          to its pre-approval value EXACTLY (not approximately, and not by re-adding a recomputed
          amount that double counts). Because the ledger is defined as a full recomputation over the
          issue set rather than an incremental credit, an implementation that increments and decrements
          a running remaining balance drifts the moment the same issue is decided twice.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T19:00:00Z; Event IN_PROGRESS with refund_budget_total_cents 100000."
            - "One ACTIVE member holding a VALID CODE_OF_CONDUCT certification, used to assign the issue."
            - "One OTHER / MEDIUM GuestIssue, assigned, with refund-request 3000 filed by u-sup-file and APPROVED by u-sup-decide: the supervisor cap is 5000 with a 0 uplift for MEDIUM, so 3000 is fully covered, refund_status is APPROVED and the issue stays IN_PROGRESS rather than moving to AWAITING_AUTHORIZATION."
            - "Three distinct X-User-IDs keep segregation of duties (priority 8) satisfied: u-sup-report reported, u-sup-file requested, u-sup-decide approved, and u-dir-decide will void."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T19:00:00Z" }
              as: GuestServicesSupervisor
            - call: "POST /events"
              payload: { name: "Ledger Invariant Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000, refund_budget_total_cents: 100000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "GUEST_SERVICES_REP", display_name: "Guest Services Rep", base_hourly_rate_cents: 2400, attendance_ratio_per_1000: 0.35, min_headcount: 2, required_certifications: ["CODE_OF_CONDUCT"] }
              as: StaffingCoordinator
              captures: { pt_gsr_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_gsr_id}", zone_code: "B200", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:00:00Z", required_headcount_override: 1 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ida Solis", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-01-01T00:00:00Z", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              captures: { sm_1: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${sm_1}", cert_type: "CODE_OF_CONDUCT", issued_on: "2026-01-01T00:00:00Z", expires_on: "2027-01-01T00:00:00Z" }
              as: StaffingCoordinator
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
            - call: "POST /guest-issues"
              payload: { event_id: "${ev_id}", channel: "KIOSK", category: "OTHER", severity: "MEDIUM", description: "Merchandise voucher dispute" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-report"
              captures: { gi_id: $.data.id }
            - call: "POST /guest-issues/${gi_id}/assign"
              payload: { staff_member_id: "${sm_1}" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-report"
            - call: "POST /guest-issues/${gi_id}/refund-request"
              payload: { refund_requested_cents: 3000 }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-file"
            - call: "POST /guest-issues/${gi_id}/refund-decision"
              payload: { decision: "APPROVE" }
              as: GuestServicesSupervisor
              as_user_id: "u-sup-decide"
          trigger:
            - call: "POST /guest-issues/${gi_id}/refund-decision"
              payload: { decision: "VOID" }
              as: GuestExperienceDirector
              as_user_id: "u-dir-decide"
            - call: "POST /guest-issues/${gi_id}/refund-decision"
              payload: { decision: "VOID" }
              as: GuestExperienceDirector
              as_user_id: "u-dir-decide"
          assert:
            - "invariant at creation: Event.${ev_id}.refund_budget_remaining_cents 100000 + refund_approved_total_cents 0 == refund_budget_total_cents 100000"
            - "invariant after the APPROVE: refund_budget_remaining_cents == 97000 and refund_approved_total_cents == 3000, summing to exactly 100000"
            - "after the APPROVE, GuestIssue.${gi_id}.refund_status == APPROVED, refund_approved_cents == 3000, status == IN_PROGRESS (a fully covered request does not need director authorization) and refund_decided_by_user_id == u-sup-decide"
            - "the first VOID returns 200: GuestIssue.${gi_id}.refund_status == VOIDED and refund_approved_cents == 0"
            - "invariant after the VOID: refund_approved_total_cents == 0 and refund_budget_remaining_cents == 100000 - restored EXACTLY to the pre-approval value, not 99999 or 103000"
            - "refund_requested_cents is preserved at 3000 and refund_requested_by_user_id at u-sup-file: the void reverses the authorization, not the ask"
            - "the second VOID returns 409 with data.error_id == ERR_REFUND_STATE_INVALID (priority 22: VOID requires refund_status IN {APPROVED, PARTIALLY_APPROVED}), and the ledger is still 100000 / 0 - no double credit is possible"
            - "GuestIssue.${gi_id}.status is still IN_PROGRESS after both calls, and a subsequent resolve with resolution_type REFUND is refused with ERR_REFUND_STATE_INVALID because the authorization is gone"
