scenario: "1165. Corporate Trustee & Bond Indenture Administration (corporate trust department): indenture obligation calendar & covenant certificate collection, payment agent duties (interest/principal distribution), default declaration & noteholder direction, sinking fund & redemption processing, collateral release & substitution approval, successor trustee transitions, noteholder communication & consent solicitation, fee schedule & extraordinary services"

domain_name: corporate-trustee-indenture
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_target: beyond_expert

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Indenture
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Indenture title" }
      - { name: issuer_ref, type: string, source: input, description: "Opaque issuer identity; ownership check compares X-User-ID of Issuer role to this value" }
      - { name: governing_law, type: string, source: input, description: "Governing law label" }
      - { name: initial_trustee_ref, type: string, source: input, description: "Trustee identity appointed at activation" }
      - { name: current_trustee_ref, type: string, source: system, description: "Active trustee; set from initial_trustee_ref at activation, swapped by TrusteeAppointment EFFECTIVE" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | DEFAULTED | ACCELERATED | SATISFIED" }
      - { name: annual_admin_fee_cents, type: integer, source: input, description: "Annual administration fee" }
      - { name: extraordinary_hourly_rate_cents, type: integer, source: input, description: "Hourly rate for extraordinary services while indenture not in default" }
      - { name: default_hourly_rate_cents, type: integer, source: input, description: "Hourly rate for extraordinary services while status in {DEFAULTED, ACCELERATED}" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "Sum of Tranche.outstanding_principal_cents over all tranches of this indenture" }
      - { name: covenant_posture, type: enum, source: computed, description: "CURRENT | GRACE | BREACH — derived: BREACH if any CovenantObligation BREACHED; else GRACE if any LATE; else CURRENT" }
      - { name: active_default_count, type: integer, source: computed, description: "Count of DefaultCase rows of this indenture with status in {CONFIRMED, ACCELERATED}" }

  - name: Tranche
    parent: null
    common_fields: true
    fields:
      - { name: indenture_id, type: string, source: input, description: "FK -> Indenture.id" }
      - { name: series_code, type: string, source: input, description: "Series label, unique within indenture" }
      - { name: original_principal_cents, type: integer, source: input, description: "Issued principal" }
      - { name: outstanding_principal_cents, type: integer, source: computed, description: "original_principal_cents minus sum of executed redemption reductions; equals sum of Position.principal_amount_cents over ACTIVE positions" }
      - { name: interest_rate_bps, type: integer, source: input, description: "Annual coupon in basis points" }
      - { name: day_count_convention, type: enum, source: input, description: "ACT_360 | ACT_365 | THIRTY_360" }
      - { name: payment_frequency, type: enum, source: input, description: "QUARTERLY | SEMI_ANNUAL | ANNUAL" }
      - { name: maturity_date, type: string, source: input, description: "ISO date of final maturity" }
      - { name: notice_period_days, type: integer, source: input, default: 30, description: "Minimum days between redemption notice (run creation) and scheduled_payment_date" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REDEEMED | MATURED | ACCELERATED" }

  - name: NoteholderAccount
    parent: null
    common_fields: true
    fields:
      - { name: holder_ref, type: string, source: input, description: "External holder reference, globally unique" }
      - { name: legal_name, type: string, source: input, description: "Registered holder name" }
      - { name: contact_email, type: string, source: input, description: "Notice email" }
      - { name: status, type: enum, source: system, description: "ACTIVE" }
      - { name: total_unpaid_cents, type: integer, source: computed, description: "Sum of DistributionRecord.allocated_cents with status HELD over positions of this account" }
      - { name: total_received_cents, type: integer, source: computed, description: "Sum of DistributionRecord.allocated_cents with status PAID over positions of this account" }

  - name: Position
    parent: null
    common_fields: true
    fields:
      - { name: tranche_id, type: string, source: input, description: "FK -> Tranche.id" }
      - { name: noteholder_account_id, type: string, source: input, description: "FK -> NoteholderAccount.id" }
      - { name: original_principal_cents, type: integer, source: input, description: "Principal at registration" }
      - { name: principal_amount_cents, type: integer, source: computed, description: "Current principal: original minus cumulative executed redemption reductions; starts equal to original_principal_cents" }
      - { name: principal_history, type: array, source: system, description: "Append-only [{effective_from: ISO datetime, principal_cents: integer}] snapshots; one entry at creation, one appended per executed redemption touching this position; used for record-date lookups" }
      - { name: status, type: enum, source: system, description: "ACTIVE | REDEEMED (principal_amount_cents == 0)" }

  - name: CovenantObligation
    parent: null
    common_fields: true
    fields:
      - { name: indenture_id, type: string, source: input, description: "FK -> Indenture.id" }
      - { name: covenant_type, type: enum, source: input, description: "FINANCIAL_REPORT | INSURANCE_CERT | DEBT_SERVICE_COVERAGE | LEVERAGE_RATIO | TAX_COMPLIANCE" }
      - { name: frequency, type: enum, source: input, description: "QUARTERLY | SEMI_ANNUAL | ANNUAL" }
      - { name: threshold_value, type: number, source: input, description: "Ratio threshold; required iff covenant_type in {DEBT_SERVICE_COVERAGE, LEVERAGE_RATIO}" }
      - { name: threshold_direction, type: enum, source: input, description: "MIN (metric must be >= threshold) | MAX (metric must be <= threshold); required iff threshold_value present" }
      - { name: measurement_basis, type: enum, source: input, description: "TTM | QUARTERLY_ANNUALIZED; required iff threshold_value present — selects which certificate metric is compared" }
      - { name: period_anchor_date, type: string, source: input, description: "ISO date; first due date" }
      - { name: next_due_date, type: string, source: computed, description: "Current period due date; starts = period_anchor_date; advances by frequency on each certificate ACCEPT" }
      - { name: grace_period_days, type: integer, source: input, default: 10, description: "Days after next_due_date before BREACHED" }
      - { name: status, type: enum, source: system, description: "OPEN | LATE | BREACHED | WAIVED" }

  - name: CovenantCertificate
    parent: null
    common_fields: true
    fields:
      - { name: covenant_obligation_id, type: string, source: input, description: "FK -> CovenantObligation.id" }
      - { name: period_end_date, type: string, source: input, description: "ISO date of reporting period end" }
      - { name: metric_value, type: number, source: input, description: "Period (quarterly-annualized basis) metric; required iff obligation.threshold_value present" }
      - { name: ttm_metric_value, type: number, source: input, description: "Trailing-twelve-months metric; required iff obligation.threshold_value present" }
      - { name: document_ref, type: string, source: input, description: "Document locator" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical clock time at submission" }
      - { name: is_late, type: boolean, source: computed, description: "true iff submitted_at date > obligation.next_due_date at submission time" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | ACCEPTED | REJECTED" }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID of reviewing TrustOfficer" }

  - name: PaymentRun
    parent: null
    common_fields: true
    fields:
      - { name: tranche_id, type: string, source: input, description: "FK -> Tranche.id" }
      - { name: payment_type, type: enum, source: input, description: "INTEREST | SINKING_FUND_REDEMPTION | FULL_REDEMPTION | FINAL_MATURITY" }
      - { name: period_start_date, type: string, source: input, description: "ISO date; required iff payment_type == INTEREST; accrual window half-open [period_start_date, period_end_date)" }
      - { name: period_end_date, type: string, source: input, description: "ISO date; required iff payment_type == INTEREST; exclusive" }
      - { name: scheduled_payment_date, type: string, source: input, description: "ISO date funds reach holders" }
      - { name: target_amount_cents, type: integer, source: input, description: "Redemption principal target; required iff payment_type in {SINKING_FUND_REDEMPTION, FULL_REDEMPTION, FINAL_MATURITY}" }
      - { name: notice_sent_at, type: datetime, source: system, description: "Set to logical clock at creation for redemption types (notice dispatched)" }
      - { name: gross_amount_cents, type: integer, source: computed, description: "INTEREST: sum of per-position rounded interest (calc interest_accrual); redemption types: target_amount_cents" }
      - { name: funded_amount_cents, type: integer, source: system, description: "Cumulative funds deposited via /fund; starts 0" }
      - { name: funding_status, type: enum, source: system, description: "Parallel dimension 1: UNFUNDED | PARTIALLY_FUNDED | FUNDED" }
      - { name: distribution_status, type: enum, source: system, description: "Parallel dimension 2: SCHEDULED | DISTRIBUTED | SUSPENDED | REVERSED" }
      - { name: executed_at, type: datetime, source: system, description: "Logical clock time of execute; null until executed" }

  - name: DistributionRecord
    parent: null
    common_fields: true
    fields:
      - { name: payment_run_id, type: string, source: system, description: "FK -> PaymentRun.id" }
      - { name: position_id, type: string, source: system, description: "FK -> Position.id" }
      - { name: allocated_cents, type: integer, source: computed, description: "Per-position allocation after rounding-remainder reconciliation (calc pro_rata_allocation)" }
      - { name: status, type: enum, source: system, description: "PENDING | PAID | HELD | RETURNED" }
      - { name: paid_at, type: datetime, source: system, description: "Logical clock time of settlement; null until PAID" }

  - name: DefaultCase
    parent: null
    common_fields: true
    fields:
      - { name: indenture_id, type: string, source: input, description: "FK -> Indenture.id" }
      - { name: default_type, type: enum, source: input, description: "PAYMENT | COVENANT_BREACH | CROSS_DEFAULT | BANKRUPTCY | SINKING_FUND_MISS" }
      - { name: source_ref, type: string, source: input, description: "Optional id of originating CovenantObligation or PaymentRun" }
      - { name: declared_at, type: datetime, source: system, description: "Logical clock time at declaration" }
      - { name: cure_deadline, type: datetime, source: input, description: "ISO datetime; cure must occur at or before this instant" }
      - { name: status, type: enum, source: system, description: "ALLEGED | CONFIRMED | CURED | WAIVED | ACCELERATED" }
      - { name: declared_by_user_id, type: string, source: system, description: "X-User-ID of declaring TrustOfficer" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of confirming TrustManager; must differ from declared_by_user_id" }

  - name: NoteholderDirection
    parent: null
    common_fields: true
    fields:
      - { name: default_case_id, type: string, source: input, description: "FK -> DefaultCase.id" }
      - { name: instruction_type, type: enum, source: input, description: "ACCELERATE | RESCIND_ACCELERATION | WAIVE_DEFAULT" }
      - { name: expires_at, type: datetime, source: input, description: "Circulation deadline (ISO datetime)" }
      - { name: eligible_principal_cents, type: integer, source: computed, description: "Sum of Position.principal_amount_cents over ACTIVE positions of tranches in {ACTIVE, ACCELERATED} of the indenture (acceleration does not extinguish voting principal); recomputed on every endorsement/withdrawal" }
      - { name: supporting_principal_cents, type: integer, source: computed, description: "Sum of endorsed_principal_cents over ACTIVE endorsements" }
      - { name: threshold_rule, type: string, source: computed, description: "ACCELERATE/WAIVE_DEFAULT: EFFECTIVE when supporting >= 25% of eligible (inclusive); RESCIND_ACCELERATION: EFFECTIVE when supporting > 50% of eligible (strict)" }
      - { name: status, type: enum, source: system, description: "CIRCULATING | EFFECTIVE | EXECUTED | SUPERSEDED | LAPSED" }

  - name: DirectionEndorsement
    parent: null
    common_fields: true
    fields:
      - { name: direction_id, type: string, source: input, description: "FK -> NoteholderDirection.id" }
      - { name: noteholder_account_id, type: string, source: input, description: "FK -> NoteholderAccount.id" }
      - { name: endorsed_principal_cents, type: integer, source: system, description: "Snapshot of the holder's aggregate ACTIVE Position.principal_amount_cents across the indenture at endorsement time" }
      - { name: status, type: enum, source: system, description: "ACTIVE | WITHDRAWN" }

  - name: ConsentSolicitation
    parent: null
    common_fields: true
    fields:
      - { name: indenture_id, type: string, source: input, description: "FK -> Indenture.id" }
      - { name: subject_type, type: enum, source: input, description: "AMEND_TERMS | WAIVE_COVENANT" }
      - { name: target_obligation_id, type: string, source: input, description: "Required iff subject_type == WAIVE_COVENANT; must reference a CovenantObligation of the same indenture" }
      - { name: amendment_payload, type: object, source: input, description: "Required iff subject_type == AMEND_TERMS; currently supported key: annual_admin_fee_cents (integer), applied to the Indenture when the solicitation PASSED" }
      - { name: consent_threshold_bps, type: integer, source: input, description: "Required consent share in basis points of eligible principal (e.g. 5000 = 50.00%)" }
      - { name: tabulation_basis, type: enum, source: input, description: "RECORD_DATE | CURRENT_OUTSTANDING" }
      - { name: record_date, type: string, source: input, description: "ISO date; ballot weight snapshot date for RECORD_DATE basis" }
      - { name: expiry_date, type: string, source: input, description: "ISO date; solicitation window is the CLOSED interval [record_date, expiry_date]" }
      - { name: ballots, type: array, source: system, description: "[{noteholder_account_id, vote: CONSENT | WITHHOLD, principal_voted_cents, cast_at}]; at most one ballot per account" }
      - { name: consenting_principal_cents, type: integer, source: computed, description: "Tabulated CONSENT weight per tabulation_basis at close" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | PASSED | FAILED | EXPIRED | REVOKED" }

  - name: CollateralItem
    parent: null
    common_fields: true
    fields:
      - { name: indenture_id, type: string, source: input, description: "FK -> Indenture.id" }
      - { name: description, type: string, source: input, description: "Collateral description" }
      - { name: collateral_type, type: enum, source: input, description: "REAL_ESTATE | EQUIPMENT | SECURITIES | GUARANTEE" }
      - { name: appraised_value_cents, type: integer, source: input, description: "Latest appraised value" }
      - { name: valuation_date, type: string, source: input, description: "ISO date of appraisal; stale when more than 180 days before the acting date" }
      - { name: substituted_from_item_id, type: string, source: system, description: "Set when this item was created as a substitute by an EFFECTED release request; null otherwise" }
      - { name: status, type: enum, source: system, description: "PLEDGED | RELEASED | SUBSTITUTED" }

  - name: CollateralReleaseRequest
    parent: null
    common_fields: true
    fields:
      - { name: collateral_item_id, type: string, source: input, description: "FK -> CollateralItem.id" }
      - { name: request_type, type: enum, source: input, description: "RELEASE | SUBSTITUTION" }
      - { name: substitute_description, type: string, source: input, description: "Required iff request_type == SUBSTITUTION" }
      - { name: substitute_collateral_type, type: enum, source: input, description: "REAL_ESTATE | EQUIPMENT | SECURITIES | GUARANTEE; required iff SUBSTITUTION" }
      - { name: substitute_appraised_value_cents, type: integer, source: input, description: "Required iff SUBSTITUTION" }
      - { name: substitute_valuation_date, type: string, source: input, description: "Required iff SUBSTITUTION" }
      - { name: post_release_coverage_bps, type: integer, source: computed, description: "Coverage after release per calc collateral_coverage (evaluation order pinned); computed at verify" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VERIFIED | APPROVED | REJECTED | EFFECTED | SUPERSEDED" }
      - { name: verified_by_user_id, type: string, source: system, description: "X-User-ID of verifying TrustOfficer" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID of deciding TrustManager; must differ from verified_by_user_id" }

  - name: FeeInvoice
    parent: null
    common_fields: true
    fields:
      - { name: indenture_id, type: string, source: input, description: "FK -> Indenture.id" }
      - { name: invoice_type, type: enum, source: input, description: "ANNUAL_ADMIN | EXTRAORDINARY_SERVICE" }
      - { name: service_period_start, type: string, source: input, description: "ISO date" }
      - { name: service_period_end, type: string, source: input, description: "ISO date" }
      - { name: extraordinary_hours, type: number, source: input, description: "Required iff invoice_type == EXTRAORDINARY_SERVICE" }
      - { name: description, type: string, source: input, description: "Narrative" }
      - { name: amount_cents, type: integer, source: computed, description: "ANNUAL_ADMIN: indenture.annual_admin_fee_cents; EXTRAORDINARY: per calc extraordinary_fee" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | DISPUTED | AMENDED | VOID" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of drafting TrustOfficer" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of issuing TrustManager; must differ from drafted_by_user_id" }

  - name: TrusteeAppointment
    parent: null
    common_fields: true
    fields:
      - { name: indenture_id, type: string, source: input, description: "FK -> Indenture.id" }
      - { name: outgoing_trustee_ref, type: string, source: system, description: "Indenture.current_trustee_ref at creation" }
      - { name: incoming_trustee_ref, type: string, source: input, description: "Successor trustee identity" }
      - { name: reason, type: enum, source: input, description: "RESIGNATION | REMOVAL | CONSOLIDATION" }
      - { name: proposed_effective_date, type: string, source: input, description: "ISO date; effect requires logical clock date >= this date" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | EFFECTIVE | RESCINDED | SUPERSEDED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Indenture
    initial_state: DRAFT
    terminal_states: [SATISFIED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /indentures/{id}/activate"
        actor: PlatformAdmin
        preconditions:
          - "At least one Tranche exists for the indenture (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "current_trustee_ref := initial_trustee_ref"
          - "increments Indenture.version by 1"
      - from: ACTIVE
        to: DEFAULTED
        trigger: "system cascade: a DefaultCase of this indenture transitions ALLEGED -> CONFIRMED"
        actor: system
        preconditions: []
        side_effects:
          - "Every PaymentRun of every tranche of this indenture with distribution_status == SCHEDULED becomes SUSPENDED (cascade link 2)"
          - "Every DistributionRecord with status PENDING under a DISTRIBUTED run of this indenture becomes HELD (cascade link 3)"
          - "For each affected record, its position's NoteholderAccount.total_unpaid_cents is recomputed (cascade link 4)"
      - from: DEFAULTED
        to: ACTIVE
        trigger: "system cascade: the last active DefaultCase (CONFIRMED/ACCELERATED) reaches CURED or WAIVED so active_default_count becomes 0"
        actor: system
        preconditions:
          - "active_default_count == 0 after the cure/waiver"
        side_effects:
          - "Every PaymentRun with distribution_status == SUSPENDED becomes SCHEDULED (resume cascade)"
          - "Every DistributionRecord with status HELD under runs of this indenture becomes PENDING"
          - "Affected NoteholderAccount.total_unpaid_cents recomputed; settled totals update at the next settlement sweep"
      - from: DEFAULTED
        to: ACCELERATED
        trigger: "POST /directions/{id}/execute with instruction_type == ACCELERATE"
        actor: TrustManager
        preconditions:
          - "direction.status == EFFECTIVE and direction.instruction_type == ACCELERATE"
        side_effects:
          - "DefaultCase.status -> ACCELERATED"
          - "Every Tranche of the indenture with status ACTIVE becomes ACCELERATED"
      - from: ACCELERATED
        to: DEFAULTED
        trigger: "POST /directions/{id}/execute with instruction_type == RESCIND_ACCELERATION"
        actor: TrustManager
        preconditions:
          - "direction.status == EFFECTIVE and direction.instruction_type == RESCIND_ACCELERATION"
        side_effects:
          - "DefaultCase.status ACCELERATED -> CONFIRMED"
          - "Every Tranche with status ACCELERATED becomes ACTIVE"
      - from: ACTIVE
        to: SATISFIED
        trigger: "system cascade: every Tranche reaches a terminal state (REDEEMED or MATURED) via payment-run execution"
        actor: system
        preconditions:
          - "all tranches in {REDEEMED, MATURED}"
        side_effects: []

  - entity: Tranche
    initial_state: ACTIVE
    terminal_states: [REDEEMED, MATURED]
    transitions:
      - from: ACTIVE
        to: REDEEMED
        trigger: "POST /payment-runs/{id}/execute where run.payment_type == FULL_REDEMPTION and post-execution outstanding_principal_cents == 0"
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "All ACTIVE positions with principal_amount_cents == 0 become REDEEMED"
          - "If all tranches of the indenture are terminal, Indenture -> SATISFIED (bubble up)"
      - from: ACTIVE
        to: MATURED
        trigger: "POST /payment-runs/{id}/execute where run.payment_type == FINAL_MATURITY and post-execution outstanding_principal_cents == 0"
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "All positions become REDEEMED; Indenture bubble-up as above"
      - from: ACTIVE
        to: ACCELERATED
        trigger: "system cascade from Indenture DEFAULTED -> ACCELERATED"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCELERATED
        to: ACTIVE
        trigger: "system cascade from Indenture ACCELERATED -> DEFAULTED (rescission)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CovenantObligation
    initial_state: OPEN
    terminal_states: [WAIVED]
    transitions:
      - from: OPEN
        to: LATE
        trigger: "system clock sweep: logical clock date > next_due_date and no ACCEPTED certificate for the current period"
        actor: system
        preconditions: []
        side_effects:
          - "Indenture.covenant_posture recomputed (may become GRACE)"
      - from: LATE
        to: BREACHED
        trigger: "system clock sweep: logical clock date > next_due_date + grace_period_days"
        actor: system
        preconditions: []
        side_effects:
          - "Indenture.covenant_posture recomputed (BREACH)"
          - "A DefaultCase is auto-created with default_type COVENANT_BREACH, source_ref = obligation id, status ALLEGED, cure_deadline = clock + 30 days (cascade link 2)"
      - from: OPEN
        to: OPEN
        trigger: "POST /covenant-certificates/{id}/review with decision == ACCEPT on a certificate of this obligation"
        actor: TrustOfficer
        preconditions:
          - "certificate satisfies ratio threshold when obligation.threshold_value present (ERR_COVENANT_RATIO_FAILED)"
        side_effects:
          - "Roll-forward cycle: status stays OPEN, next_due_date advances by frequency; the period outcome is observable on the certificate (ACCEPTED) and the advanced next_due_date"
        note: "Cyclic machine: OPEN -> (reject leaves OPEN; accept rolls forward to OPEN of the next period)"
      - from: LATE
        to: OPEN
        trigger: "POST /covenant-certificates/{id}/review with decision == ACCEPT on a late certificate"
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "Same roll-forward; Indenture.covenant_posture recomputed"
      - from: BREACHED
        to: OPEN
        trigger: "POST /covenant-certificates/{id}/review with decision == ACCEPT while BREACHED"
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "Roll-forward as above"
          - "The linked DefaultCase (source_ref == this obligation, status ALLEGED) becomes CURED (cascade link 2)"
          - "If that case was the last active default, Indenture DEFAULTED -> ACTIVE via the standard resume cascade (cascade link 3)"
      - from: OPEN
        to: WAIVED
        trigger: "system cascade: a ConsentSolicitation with subject_type == WAIVE_COVENANT and target_obligation_id == this obligation reaches PASSED"
        actor: system
        preconditions: []
        side_effects:
          - "Any linked DefaultCase (source_ref == this obligation) with status ALLEGED becomes WAIVED (cascade link 2)"
      - from: LATE
        to: WAIVED
        trigger: "same consent cascade"
        actor: system
        preconditions: []
        side_effects: ["same as OPEN -> WAIVED"]
      - from: BREACHED
        to: WAIVED
        trigger: "same consent cascade"
        actor: system
        preconditions: []
        side_effects: ["same as OPEN -> WAIVED"]

  - entity: CovenantCertificate
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /covenant-certificates/{id}/review with decision == ACCEPT"
        actor: TrustOfficer
        preconditions:
          - "obligation ratio check passes when applicable"
        side_effects:
          - "reviewed_by_user_id := X-User-ID"
          - "obligation roll-forward per CovenantObligation machine"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /covenant-certificates/{id}/review with decision == REJECT"
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "obligation remains in its current status; issuer may submit a replacement certificate"

  - entity: PaymentRun
    initial_state: SCHEDULED
    terminal_states: []
    note: "Two parallel state dimensions on one entity: funding_status (UNFUNDED -> PARTIALLY_FUNDED -> FUNDED) and distribution_status (SCHEDULED -> DISTRIBUTED | SUSPENDED -> SCHEDULED resume | DISTRIBUTED -> REVERSED). initial combined state: funding UNFUNDED, distribution SCHEDULED. Terminal combined state: DISTRIBUTED (unless REVERSED)."
    transitions:
      - from: "funding_status UNFUNDED"
        to: "PARTIALLY_FUNDED"
        trigger: "POST /payment-runs/{id}/fund with amount_cents < gross_amount_cents shortfall remaining"
        actor: Issuer
        preconditions:
          - "distribution_status == SCHEDULED"
          - "amount_cents > 0"
        side_effects:
          - "funded_amount_cents += amount_cents"
      - from: "funding_status UNFUNDED"
        to: "FUNDED"
        trigger: "POST /payment-runs/{id}/fund with funded_amount_cents + amount_cents >= gross_amount_cents"
        actor: Issuer
        preconditions: ["distribution_status == SCHEDULED"]
        side_effects: ["funded_amount_cents += amount_cents"]
      - from: "funding_status PARTIALLY_FUNDED"
        to: "FUNDED"
        trigger: "POST /payment-runs/{id}/fund crossing gross_amount_cents (funded + amount >= gross; exact-equality crossing is FUNDED)"
        actor: Issuer
        preconditions: ["distribution_status == SCHEDULED"]
        side_effects: ["funded_amount_cents += amount_cents"]
      - from: "distribution_status SCHEDULED"
        to: "DISTRIBUTED"
        trigger: "POST /payment-runs/{id}/execute"
        actor: TrustOfficer
        preconditions:
          - "funding_status == FUNDED (funded_amount_cents >= gross_amount_cents; equality is sufficient — ERR_FUNDING_SHORTFALL otherwise)"
          - "Indenture.status == ACTIVE (ERR_INDENTURE_NOT_ACTIVE otherwise)"
          - "Tranche.status in {ACTIVE} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "Compute per-position allocations per calc (interest_accrual for INTEREST, pro_rata_allocation for redemption types) and create one DistributionRecord (status PENDING) per ACTIVE position, including zero-cent allocations"
          - "NoteholderAccount totals change only at settlement: a system clock sweep at or after scheduled_payment_date moves PENDING records of DISTRIBUTED runs to PAID (skipped while indenture is DEFAULTED/ACCELERATED) and recomputes total_received_cents"
          - "Redemption types: Position.principal_amount_cents reduced by allocated share; principal_history appended; positions at 0 -> REDEEMED; Tranche.outstanding_principal_cents recomputed; FULL_REDEMPTION/FINAL_MATURITY with outstanding == 0 -> Tranche REDEEMED/MATURED; Indenture.outstanding_principal_cents recomputed"
      - from: "distribution_status SCHEDULED"
        to: "SUSPENDED"
        trigger: "system cascade: indenture enters DEFAULTED"
        actor: system
        preconditions: []
        side_effects:
          - "Execute is rejected while SUSPENDED; separately, PENDING DistributionRecords of DISTRIBUTED runs become HELD per the DistributionRecord machine"
      - from: "distribution_status SUSPENDED"
        to: "SCHEDULED"
        trigger: "system cascade: indenture resumes to ACTIVE"
        actor: system
        preconditions: []
        side_effects: []
      - from: "distribution_status DISTRIBUTED"
        to: "REVERSED"
        trigger: "POST /payment-runs/{id}/reverse"
        actor: TrustManager
        preconditions:
          - "no DistributionRecord of this run has status RETURNED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "All DistributionRecords of this run with status in {PENDING, HELD, PAID} become RETURNED"
          - "Redemption types: position principal reductions undone (principal_amount_cents restored, principal_history appended with restored value); positions REDEEMED by this run return to ACTIVE; Tranche.outstanding_principal_cents restored; Tranche status REDEEMED/MATURED -> ACTIVE if this run caused it"
          - "NoteholderAccount.total_received_cents decremented by returned allocations"
          - "funding_status remains FUNDED (funds stay on deposit)"

  - entity: DistributionRecord
    initial_state: PENDING
    terminal_states: [RETURNED]
    transitions:
      - from: PENDING
        to: PAID
        trigger: "system clock sweep: logical clock date >= run.scheduled_payment_date, run distribution_status == DISTRIBUTED, and indenture not in {DEFAULTED, ACCELERATED}"
        actor: system
        preconditions: []
        side_effects:
          - "paid_at := logical clock; NoteholderAccount.total_received_cents += allocated_cents"
      - from: PENDING
        to: HELD
        trigger: "system cascade: indenture enters DEFAULTED"
        actor: system
        preconditions: []
        side_effects:
          - "NoteholderAccount.total_unpaid_cents += allocated_cents"
      - from: HELD
        to: PENDING
        trigger: "system cascade: indenture resumes to ACTIVE"
        actor: system
        preconditions: []
        side_effects:
          - "NoteholderAccount.total_unpaid_cents -= allocated_cents"
      - from: PAID
        to: RETURNED
        trigger: "POST /distribution-records/{id}/return"
        actor: TrustOfficer
        preconditions:
          - "run distribution_status == DISTRIBUTED"
        side_effects:
          - "NoteholderAccount.total_received_cents -= allocated_cents"
      - from: PENDING
        to: RETURNED
        trigger: "POST /payment-runs/{id}/reverse on the parent run"
        actor: TrustManager
        preconditions: []
        side_effects: []
      - from: HELD
        to: RETURNED
        trigger: "POST /payment-runs/{id}/reverse on the parent run"
        actor: TrustManager
        preconditions: []
        side_effects:
          - "NoteholderAccount.total_unpaid_cents -= allocated_cents"

  - entity: DefaultCase
    initial_state: ALLEGED
    terminal_states: [CURED, WAIVED]
    transitions:
      - from: ALLEGED
        to: CONFIRMED
        trigger: "POST /default-cases/{id}/confirm"
        actor: TrustManager
        preconditions:
          - "X-User-ID != declared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "confirmed_by_user_id := X-User-ID"
          - "Indenture ACTIVE -> DEFAULTED with full payment-suspension cascade (see Indenture machine)"
      - from: CONFIRMED
        to: CURED
        trigger: "POST /default-cases/{id}/cure"
        actor: TrustManager
        preconditions:
          - "logical clock <= cure_deadline (ERR_CURE_DEADLINE_PASSED; equality is a valid cure)"
        side_effects:
          - "active_default_count recomputed; if 0, Indenture DEFAULTED -> ACTIVE with resume cascade"
      - from: CONFIRMED
        to: WAIVED
        trigger: "POST /directions/{id}/execute with instruction_type == WAIVE_DEFAULT"
        actor: TrustManager
        preconditions:
          - "direction EFFECTIVE"
        side_effects:
          - "active_default_count recomputed; if 0, Indenture resumes with cascade"
      - from: CONFIRMED
        to: ACCELERATED
        trigger: "POST /directions/{id}/execute with instruction_type == ACCELERATE"
        actor: TrustManager
        preconditions:
          - "direction EFFECTIVE"
        side_effects:
          - "Indenture DEFAULTED -> ACCELERATED; tranches -> ACCELERATED"
      - from: ACCELERATED
        to: CONFIRMED
        trigger: "POST /directions/{id}/execute with instruction_type == RESCIND_ACCELERATION"
        actor: TrustManager
        preconditions:
          - "direction EFFECTIVE"
        side_effects:
          - "Indenture ACCELERATED -> DEFAULTED; tranches -> ACTIVE"
      - from: ALLEGED
        to: CURED
        trigger: "system cascade: certificate ACCEPT curing a BREACHED covenant obligation (source_ref match)"
        actor: system
        preconditions: []
        side_effects: ["active_default_count recomputed; Indenture resume cascade if 0"]
      - from: ALLEGED
        to: WAIVED
        trigger: "system cascade: linked CovenantObligation WAIVED via passed consent solicitation"
        actor: system
        preconditions: []
        side_effects: ["active_default_count recomputed"]

  - entity: NoteholderDirection
    initial_state: CIRCULATING
    terminal_states: [EXECUTED, SUPERSEDED, LAPSED]
    transitions:
      - from: CIRCULATING
        to: EFFECTIVE
        trigger: "system: an endorsement causes the threshold rule to be satisfied (>= 25% for ACCELERATE/WAIVE_DEFAULT, > 50% for RESCIND_ACCELERATION)"
        actor: system
        preconditions: []
        side_effects: []
      - from: EFFECTIVE
        to: CIRCULATING
        trigger: "system: an endorsement withdrawal drops support below the threshold"
        actor: system
        preconditions: []
        side_effects: []
      - from: EFFECTIVE
        to: EXECUTED
        trigger: "POST /directions/{id}/execute"
        actor: TrustManager
        preconditions:
          - "direction.status == EFFECTIVE (ERR_THRESHOLD_NOT_MET otherwise)"
        side_effects:
          - "Per instruction_type: ACCELERATE -> DefaultCase CONFIRMED -> ACCELERATED + Indenture/tranche cascade; WAIVE_DEFAULT -> DefaultCase -> WAIVED + resume cascade; RESCIND_ACCELERATION -> DefaultCase ACCELERATED -> CONFIRMED + rescission cascade"
      - from: CIRCULATING
        to: SUPERSEDED
        trigger: "system: a new NoteholderDirection is created on the same DefaultCase"
        actor: system
        preconditions: []
        side_effects: []
      - from: CIRCULATING
        to: LAPSED
        trigger: "system clock sweep: logical clock > expires_at"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DirectionEndorsement
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /direction-endorsements/{id}/withdraw"
        actor: Noteholder
        preconditions:
          - "X-User-ID == noteholder_account_id (ownership)"
          - "direction.status in {CIRCULATING, EFFECTIVE} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "direction.supporting_principal_cents recomputed; EFFECTIVE -> CIRCULATING if threshold lost"

  - entity: ConsentSolicitation
    initial_state: DRAFT
    terminal_states: [PASSED, FAILED, EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /consent-solicitations/{id}/open"
        actor: TrustOfficer
        preconditions:
          - "logical clock date <= expiry_date (ERR_SOLICITATION_EXPIRED)"
        side_effects: []
      - from: OPEN
        to: PASSED
        trigger: "POST /consent-solicitations/{id}/close with logical clock date <= expiry_date and consenting_principal_cents * 10000 >= consent_threshold_bps * eligible_principal_cents"
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "subject application: WAIVE_COVENANT -> target CovenantObligation -> WAIVED + linked ALLEGED DefaultCase -> WAIVED + Indenture.covenant_posture recomputed; AMEND_TERMS -> amendment_payload.annual_admin_fee_cents applied to Indenture (bumps Indenture.version)"
      - from: OPEN
        to: FAILED
        trigger: "POST /consent-solicitations/{id}/close with clock <= expiry_date and threshold not met (including zero ballots: consenting == 0 fails any threshold > 0)"
        actor: TrustOfficer
        preconditions: []
        side_effects: []
      - from: OPEN
        to: EXPIRED
        trigger: "POST /consent-solicitations/{id}/close with logical clock date > expiry_date (EXPIRED wins over tabulation regardless of tally)"
        actor: TrustOfficer
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: REVOKED
        trigger: "POST /consent-solicitations/{id}/revoke"
        actor: Issuer
        preconditions: ["X-User-ID == indenture.issuer_ref (ownership)"]
        side_effects: []
      - from: OPEN
        to: REVOKED
        trigger: "POST /consent-solicitations/{id}/revoke"
        actor: Issuer
        preconditions: ["ownership as above"]
        side_effects: []

  - entity: CollateralItem
    initial_state: PLEDGED
    terminal_states: [RELEASED, SUBSTITUTED]
    transitions:
      - from: PLEDGED
        to: RELEASED
        trigger: "POST /collateral-release-requests/{id}/effect on an APPROVED RELEASE request"
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "Indenture-level collateral totals recompute implicitly via status filter"
      - from: PLEDGED
        to: SUBSTITUTED
        trigger: "POST /collateral-release-requests/{id}/effect on an APPROVED SUBSTITUTION request"
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "A new CollateralItem is auto-created (status PLEDGED, fields from substitute_*, substituted_from_item_id := this item id)"

  - entity: CollateralReleaseRequest
    initial_state: SUBMITTED
    terminal_states: [EFFECTED, REJECTED, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: VERIFIED
        trigger: "POST /collateral-release-requests/{id}/verify"
        actor: TrustOfficer
        preconditions:
          - "collateral item valuation fresh (valuation_date within 180 days of logical clock date; ERR_VALUATION_STALE); substitute valuation fresh when SUBSTITUTION"
        side_effects:
          - "post_release_coverage_bps computed per calc collateral_coverage"
          - "verified_by_user_id := X-User-ID"
      - from: VERIFIED
        to: APPROVED
        trigger: "POST /collateral-release-requests/{id}/decide with decision == APPROVE"
        actor: TrustManager
        preconditions:
          - "X-User-ID != verified_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "no DefaultCase of the indenture in {CONFIRMED, ACCELERATED} (ERR_DEFAULT_LOCK — business_safety)"
          - "post_release_coverage_bps >= 12500 (ERR_COVERAGE_BELOW_MINIMUM — business_constraint; equality approves)"
        side_effects:
          - "decided_by_user_id := X-User-ID"
      - from: VERIFIED
        to: REJECTED
        trigger: "POST /collateral-release-requests/{id}/decide with decision == REJECT"
        actor: TrustManager
        preconditions:
          - "SoD as above"
        side_effects: []
      - from: APPROVED
        to: EFFECTED
        trigger: "POST /collateral-release-requests/{id}/effect"
        actor: TrustOfficer
        preconditions:
          - "collateral item still PLEDGED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "CollateralItem -> RELEASED or SUBSTITUTED per request_type (with substitute auto-creation)"
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system: a new CollateralReleaseRequest is created for the same collateral item"
        actor: system
        preconditions: []
        side_effects: []

  - entity: FeeInvoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /fee-invoices/{id}/issue"
        actor: TrustManager
        preconditions:
          - "X-User-ID != drafted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "issued_by_user_id := X-User-ID"
      - from: ISSUED
        to: PAID
        trigger: "POST /fee-invoices/{id}/pay"
        actor: Issuer
        preconditions: ["X-User-ID == indenture.issuer_ref (ownership)"]
        side_effects: []
      - from: ISSUED
        to: DISPUTED
        trigger: "POST /fee-invoices/{id}/dispute"
        actor: Issuer
        preconditions: ["ownership as above"]
        side_effects: []
      - from: DISPUTED
        to: AMENDED
        trigger: "POST /fee-invoices/{id}/amend"
        actor: TrustOfficer
        preconditions: []
        side_effects:
          - "extraordinary_hours and/or description replaced; amount_cents recomputed per calc extraordinary_fee"
      - from: AMENDED
        to: ISSUED
        trigger: "POST /fee-invoices/{id}/issue"
        actor: TrustManager
        preconditions:
          - "X-User-ID != drafted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: []
      - from: DRAFT
        to: VOID
        trigger: "system cascade: a TrusteeAppointment on the same indenture becomes EFFECTIVE while this invoice is DRAFT"
        actor: system
        preconditions: []
        side_effects: []

  - entity: TrusteeAppointment
    initial_state: PROPOSED
    terminal_states: [EFFECTIVE, RESCINDED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /trustee-appointments/{id}/accept"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: EFFECTIVE
        trigger: "POST /trustee-appointments/{id}/effect"
        actor: PlatformAdmin
        preconditions:
          - "logical clock date >= proposed_effective_date (ERR_NOT_YET_EFFECTIVE)"
        side_effects:
          - "Indenture.current_trustee_ref := incoming_trustee_ref; Indenture.version += 1"
          - "All FeeInvoice rows of the indenture with status DRAFT become VOID (cascade link 2)"
      - from: PROPOSED
        to: RESCINDED
        trigger: "POST /trustee-appointments/{id}/rescind"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: RESCINDED
        trigger: "POST /trustee-appointments/{id}/rescind"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system: a new TrusteeAppointment is created for the same indenture"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACCEPTED
        to: SUPERSEDED
        trigger: "system: a new TrusteeAppointment is created for the same indenture"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1 — true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: appointment-supersede-stale-indenture
    parent_entity: Indenture
    write_endpoint: "POST /trustee-appointments"
    occ_field: "expected_indenture_version"
    description: |
      Creating a TrusteeAppointment against an Indenture whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just created an appointment (which
      legitimately supersedes the prior in-flight appointment per the
      TrusteeAppointment machine) and the current writer's view of the
      indenture is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: release-request-supersede-stale-item
    parent_entity: CollateralItem
    write_endpoint: "POST /collateral-release-requests"
    occ_field: "expected_collateral_item_version"
    description: |
      Creating a CollateralReleaseRequest against a CollateralItem whose
      version has advanced since the client last observed it is rejected.
      This captures the case where another writer has just created a request
      (which legitimately supersedes the prior SUBMITTED request per the
      CollateralReleaseRequest machine) and the current writer's view of the
      collateral item is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: direction-supersede-stale-case
    parent_entity: DefaultCase
    write_endpoint: "POST /directions"
    occ_field: "expected_default_case_version"
    description: |
      Creating a NoteholderDirection against a DefaultCase whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just created a direction (which
      legitimately supersedes the prior CIRCULATING direction per the
      NoteholderDirection machine) and the current writer's view of the
      default case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: interest_accrual
    trigger: "POST /payment-runs/{id}/execute for payment_type == INTEREST"
    algorithm: aggregation
    formula: |
      For each ACTIVE Position p of the tranche (selection order irrelevant; rounding is per-position):
        days = calendar days in the half-open window [period_start_date, period_end_date)
        per convention:
          ACT_360:  fraction = days / 360
          ACT_365:  fraction = days / 365
          THIRTY_360: days30 = 360*(Y2-Y1) + 30*(M2-M1) + (min(D2,30) - min(D1,30)); fraction = days30 / 360
        interest_p = round_half_up(p.principal_amount_cents * tranche.interest_rate_bps / 10000 * fraction)   # per-position rounding to cents FIRST
      gross_amount_cents = sum over positions of interest_p                                                    # then sum (pinned rounding order)
      DistributionRecord.allocated_cents for position p = interest_p
    input_set: "Positions of the tranche with status == ACTIVE at execute time"
    constants:
      ROUNDING: "round_half_up to integer cents, applied per position before summation"
    precision: "0 decimal places (integer cents), round_half_up per position"
    variants:
      - name: act_360_basis
        when: "tranche.day_count_convention == ACT_360"
        difference: "fraction = days/360 — larger interest than ACT_365 for identical inputs"
      - name: act_365_basis
        when: "tranche.day_count_convention == ACT_365"
        difference: "fraction = days/365 — smaller interest than ACT_360 for identical inputs"
      - name: thirty_360_basis
        when: "tranche.day_count_convention == THIRTY_360"
        difference: "30-day months / 360-day year; ignores actual month lengths"

  - name: pro_rata_allocation
    trigger: "POST /payment-runs/{id}/execute for payment_type in {SINKING_FUND_REDEMPTION, FULL_REDEMPTION, FINAL_MATURITY}"
    algorithm: waterfall_allocation
    formula: |
      eligible = ACTIVE positions of the tranche at execute time
      total_principal = sum of p.principal_amount_cents over eligible
      For each position (processing order: created_at ASC, tie-break original_principal_cents DESC — never id):
        raw_p = gross_amount_cents * p.principal_amount_cents / total_principal
        floor_p = floor(raw_p)
        frac_p = raw_p - floor_p
      remainder = gross_amount_cents - sum(floor_p)
      Distribute remainder one cent at a time to positions ordered by frac_p DESC,
      tie-break created_at ASC then original_principal_cents DESC (never id).
      allocated_cents = floor_p + remainder_cents_p
      PINNED rounding order: floor per line FIRST, reconcile remainder to the exact gross SECOND.
      Zero-quantity rule: an eligible position whose final allocated_cents == 0 still gets a DistributionRecord.
    input_set: "Positions with status == ACTIVE of the run's tranche"
    constants:
      REMAINDER_TIEBREAK: "created_at ASC, then original_principal_cents DESC"
    precision: "integer cents; floor per line, largest-remainder reconciliation"
    variants: []

  - name: extraordinary_fee
    trigger: "POST /fee-invoices create with invoice_type == EXTRAORDINARY_SERVICE; POST /fee-invoices/{id}/amend recomputes"
    algorithm: tiered_pricing
    formula: |
      rate = indenture.default_hourly_rate_cents if indenture.status in {DEFAULTED, ACCELERATED}
             else indenture.extraordinary_hourly_rate_cents
      tier1_hours = min(extraordinary_hours, TIER1_HOURS)
      tier2_hours = max(extraordinary_hours - TIER1_HOURS, 0)
      uncapped = round_half_up(tier1_hours * rate) + round_half_up(tier2_hours * rate * TIER2_MULTIPLIER)
      cap = FEE_CAP_MULTIPLE * indenture.annual_admin_fee_cents
      amount_cents = min(uncapped, cap)
      Non-linear interaction: 4 inputs (hours, indenture.status rate switch, tier split, cap) with nested min/max and a state-conditional branch.
    input_set: "single FeeInvoice row + parent Indenture rate fields and status"
    constants:
      TIER1_HOURS: 10
      TIER2_MULTIPLIER: 1.5
      FEE_CAP_MULTIPLE: 4
    precision: "integer cents; round_half_up applied per tier before summation"
    variants:
      - name: provisional_estimate
        when: "implicit at DRAFT creation — amount computed from declared extraordinary_hours"
        difference: "issuer disputes and officer amends hours; final amount after AMENDED -> ISSUED cycle generally differs for identical service period"
      - name: final_issued
        when: "after amend cycle re-issue"
        difference: "recomputed from amended hours; may flip rate basis if indenture default status changed between draft and amend"

  - name: collateral_coverage
    trigger: "POST /collateral-release-requests/{id}/verify"
    algorithm: constraint_propagation
    formula: |
      CIRCULAR-LOOKING DEPENDENCY, evaluation order PINNED:
      step 1: coverage_excluding_request = sum(pledged_collateral_value) EXCLUDING the item under request,
              over CollateralItem of the indenture with status == PLEDGED, each valued at appraised_value_cents * (10000 - haircut_bps(type))/10000
      step 2: select substitute haircut tier from coverage_excluding_request / indenture.outstanding_principal_cents:
              tier HIGH if ratio >= 2.00 -> substitute haircut 1000 bps; else tier STANDARD -> substitute haircut 2500 bps
      step 3: substitute_contribution = substitute_appraised_value_cents * (10000 - substitute_haircut_bps)/10000  (0 for RELEASE)
      step 4: post_release_coverage_bps = floor( (coverage_excluding_request + substitute_contribution) * 10000 / indenture.outstanding_principal_cents )
      The substitute's own haircut depends on coverage computed WITHOUT the substitute — evaluating in any other order is non-convergent; this order is the contract.
      Standard haircuts: REAL_ESTATE 2000 bps, EQUIPMENT 3000 bps, SECURITIES 500 bps, GUARANTEE 4000 bps.
    input_set: "CollateralItem rows of the indenture with status == PLEDGED; the request's substitute fields; Indenture.outstanding_principal_cents"
    constants:
      HAIRCUT_REAL_ESTATE_BPS: 2000
      HAIRCUT_EQUIPMENT_BPS: 3000
      HAIRCUT_SECURITIES_BPS: 500
      HAIRCUT_GUARANTEE_BPS: 4000
      SUBSTITUTE_HAIRCUT_HIGH_TIER_BPS: 1000
      SUBSTITUTE_HAIRCUT_STANDARD_BPS: 2500
      HIGH_TIER_THRESHOLD: 2.0
      MIN_COVERAGE_BPS: 12500
    precision: "integer bps; final division floor"
    variants: []

  - name: consent_tabulation
    trigger: "POST /consent-solicitations/{id}/ballots (weight validation) and POST /consent-solicitations/{id}/close (final tally)"
    algorithm: aggregation
    formula: |
      eligible_principal_cents at close = sum of Position.principal_amount_cents over ACTIVE positions of tranches in {ACTIVE, ACCELERATED} of the indenture
      Ballot weight per tabulation_basis:
        RECORD_DATE: weight = holder's aggregate principal as of end of record_date, resolved from Position.principal_history
                     (latest entry with effective_from <= record_date 23:59:59.999Z per position; positions whose first entry is later count 0)
        CURRENT_OUTSTANDING: weight = holder's aggregate current Position.principal_amount_cents at close
      consenting_principal_cents = sum of weights of ballots with vote == CONSENT
      PASSED iff consenting_principal_cents * 10000 >= consent_threshold_bps * eligible_principal_cents (integer cross-multiplication, no float)
    input_set: "Ballots array of the solicitation; positions of indenture per basis"
    constants:
      CROSS_MULTIPLY: 10000
    precision: "integer cents; cross-multiplication comparison, no division"
    variants:
      - name: record_date_snapshot
        when: "tabulation_basis == RECORD_DATE"
        difference: "weights frozen at record_date; redemptions executed between record_date and close do NOT change weights"
      - name: current_outstanding
        when: "tabulation_basis == CURRENT_OUTSTANDING"
        difference: "weights recomputed at close; interim redemptions reduce weights — identical ballots yield a smaller tally than record_date_snapshot"

  - name: covenant_ratio_check
    trigger: "POST /covenant-certificates/{id}/review with decision == ACCEPT, when obligation.threshold_value present"
    algorithm: threshold
    formula: |
      metric = certificate.ttm_metric_value if obligation.measurement_basis == TTM else certificate.metric_value
      pass = (metric >= threshold_value) if threshold_direction == MIN else (metric <= threshold_value)
      Failure -> ERR_COVENANT_RATIO_FAILED; boundary is INCLUSIVE for both directions (== passes).
    input_set: "the certificate under review + its obligation"
    constants: {}
    precision: "number comparison as given"
    variants:
      - name: ttm_basis
        when: "measurement_basis == TTM"
        difference: "compares ttm_metric_value; identical certificate financials can PASS on TTM while FAILING on QUARTERLY_ANNUALIZED"
      - name: quarterly_annualized_basis
        when: "measurement_basis == QUARTERLY_ANNUALIZED"
        difference: "compares metric_value (quarterly annualized); diverges from TTM outcome for the same submitted financials"

  - name: quorum_tally
    trigger: "POST /directions/{id}/endorsements and POST /direction-endorsements/{id}/withdraw"
    algorithm: threshold
    formula: |
      eligible_principal_cents = sum of Position.principal_amount_cents over ACTIVE positions of tranches in {ACTIVE, ACCELERATED} of the indenture (recomputed at each event)
      supporting_principal_cents = sum of endorsed_principal_cents over endorsements with status == ACTIVE
      ACCELERATE / WAIVE_DEFAULT:  EFFECTIVE iff supporting_principal_cents * 4 >= eligible_principal_cents            (>= 25%, INCLUSIVE)
      RESCIND_ACCELERATION:        EFFECTIVE iff supporting_principal_cents * 2 >  eligible_principal_cents            (> 50%, STRICT)
      Integer cross-multiplication only; no floats. Withdrawal that breaks the condition flips EFFECTIVE back to CIRCULATING.
    input_set: "DirectionEndorsement rows of the direction with status ACTIVE; current ACTIVE positions"
    constants:
      ACCELERATE_THRESHOLD: "1/4 inclusive"
      RESCIND_THRESHOLD: "1/2 exclusive"
    precision: "integer cents; cross-multiplication"
    variants: []

  - name: principal_position_reconciliation
    trigger: "every redemption execute and reverse; every position creation"
    algorithm: aggregation
    formula: |
      INVARIANT (principal conservation): for every Tranche,
        outstanding_principal_cents == original_principal_cents - sum(reductions applied by executed, non-reversed redemption runs)
                                     == sum(Position.principal_amount_cents over ACTIVE positions)
      and Indenture.outstanding_principal_cents == sum(Tranche.outstanding_principal_cents)
      Execute-then-reverse of the same run MUST leave all three quantities bit-identical to their pre-execute values.
    input_set: "positions and payment runs of the tranche"
    constants: {}
    precision: "integer cents exact"
    variants: []

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "Ownership: Noteholder must act on its own account (payload/path noteholder_account_id == X-User-ID); Issuer must own the target indenture (indenture.issuer_ref == X-User-ID)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "POST /directions/{id}/endorsements, POST /direction-endorsements/{id}/withdraw, POST /consent-solicitations/{id}/ballots, POST /payment-runs/{id}/fund, POST /covenant-certificates, POST /collateral-release-requests, POST /consent-solicitations, POST /consent-solicitations/{id}/revoke, POST /fee-invoices/{id}/pay, POST /fee-invoices/{id}/dispute"

  - priority: 4
    category: existence
    check: "Every id in path and every *_id reference in payload resolves to an existing resource"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource in a state that admits the operation per §1.2 (includes ERR_INVALID_STATE, ERR_ALREADY_TERMINAL for terminal-state writes, ERR_INDENTURE_NOT_ACTIVE for default-locked payment execution)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state transition endpoints"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: confirm/decide/issue actor must differ from declare/verify/draft actor recorded on the resource"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /default-cases/{id}/confirm, POST /collateral-release-requests/{id}/decide, POST /fee-invoices/{id}/issue"

  - priority: 7
    category: business_safety
    check: "Default lock: collateral release decide rejected while any DefaultCase of the indenture is CONFIRMED or ACCELERATED"
    error_id: ERR_DEFAULT_LOCK
    http_status: 409
    applies_to: "POST /collateral-release-requests/{id}/decide"

  - priority: 8
    category: business_safety
    check: "Extraordinary basis: EXTRAORDINARY_SERVICE invoice requires at least one DefaultCase of the indenture with status in {CONFIRMED, CURED, WAIVED, ACCELERATED} and declared_at <= service_period_end"
    error_id: ERR_NO_EXTRAORDINARY_BASIS
    http_status: 422
    applies_to: "POST /fee-invoices"

  - priority: 9
    category: business_constraint
    check: "Uniqueness: series_code unique per indenture; holder_ref globally unique; at most one ACTIVE endorsement per (direction, account); at most one ballot per (solicitation, account)"
    error_id: ERR_DUPLICATE_CONSTRAINT
    http_status: 409
    applies_to: "POST /tranches, POST /noteholder-accounts, POST /directions/{id}/endorsements, POST /consent-solicitations/{id}/ballots"

  - priority: 10
    category: business_constraint
    check: "Interval occupation: INTEREST payment-run windows of one tranche are half-open [start, end) and must not overlap another non-REVERSED run's window (adjacent allowed)"
    error_id: ERR_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /payment-runs"

  - priority: 11
    category: business_constraint
    check: "Solicitation windows [record_date, expiry_date] of one indenture are CLOSED intervals and must not overlap another solicitation in {DRAFT, OPEN}; adjacency (shared endpoint date) IS a collision"
    error_id: ERR_SOLICITATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /consent-solicitations"

  - priority: 12
    category: business_constraint
    check: "Aggregate principal: sum of Position.original_principal_cents for a tranche must not exceed Tranche.original_principal_cents"
    error_id: ERR_PRINCIPAL_EXCEEDS_POSITION
    http_status: 422
    applies_to: "POST /positions"

  - priority: 13
    category: business_constraint
    check: "Coverage floor: post_release_coverage_bps >= 12500 to approve a collateral release"
    error_id: ERR_COVERAGE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /collateral-release-requests/{id}/decide"

  - priority: 14
    category: business_temporal
    check: "Redemption notice: for redemption payment types, scheduled_payment_date - creation date >= tranche.notice_period_days"
    error_id: ERR_NOTICE_PERIOD_SHORT
    http_status: 422
    applies_to: "POST /payment-runs"

  - priority: 15
    category: business_temporal
    check: "Cure deadline: cure accepted only while logical clock <= cure_deadline (equality cures)"
    error_id: ERR_CURE_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /default-cases/{id}/cure"

  - priority: 16
    category: business_temporal
    check: "Direction circulation window: endorsement only while direction CIRCULATING/EFFECTIVE and logical clock < expires_at"
    error_id: ERR_DIRECTION_LAPSED
    http_status: 409
    applies_to: "POST /directions/{id}/endorsements"

  - priority: 17
    category: business_temporal
    check: "Solicitation expiry: ballots and open only while logical clock date <= expiry_date"
    error_id: ERR_SOLICITATION_EXPIRED
    http_status: 409
    applies_to: "POST /consent-solicitations/{id}/ballots, POST /consent-solicitations/{id}/open"

  - priority: 18
    category: business_temporal
    check: "Valuation freshness: collateral appraised valuation_date (and substitute valuation_date) within 180 days of logical clock date"
    error_id: ERR_VALUATION_STALE
    http_status: 422
    applies_to: "POST /collateral-release-requests, POST /collateral-release-requests/{id}/verify"

  - priority: 19
    category: business_temporal
    check: "Appointment effectiveness: effect requires logical clock date >= proposed_effective_date"
    error_id: ERR_NOT_YET_EFFECTIVE
    http_status: 409
    applies_to: "POST /trustee-appointments/{id}/effect"

  - priority: 20
    category: business_fiscal
    check: "Funding sufficiency: execute requires funded_amount_cents >= gross_amount_cents (equality executes)"
    error_id: ERR_FUNDING_SHORTFALL
    http_status: 422
    applies_to: "POST /payment-runs/{id}/execute"

  - priority: 21
    category: business_fiscal
    check: "Ratio covenant pass: certificate metric satisfies threshold per covenant_ratio_check (inclusive boundary)"
    error_id: ERR_COVENANT_RATIO_FAILED
    http_status: 422
    applies_to: "POST /covenant-certificates/{id}/review"

  - priority: 22
    category: business_referential
    check: "WAIVE_COVENANT solicitation requires target_obligation_id referencing a CovenantObligation of the same indenture"
    error_id: ERR_TARGET_OBLIGATION_MISMATCH
    http_status: 422
    applies_to: "POST /consent-solicitations"

  - priority: 23
    category: business_referential
    check: "SUBSTITUTION request requires all substitute_* fields present and valuation fresh; holder-of-record: endorser/balloter must hold ACTIVE positions with aggregate principal > 0 (record-date snapshot for RECORD_DATE solicitations)"
    error_id: ERR_NO_ELIGIBLE_POSITION
    http_status: 422
    applies_to: "POST /directions/{id}/endorsements, POST /consent-solicitations/{id}/ballots"

  - priority: 24
    category: business_referential
    check: "SUBSTITUTION request missing substitute fields"
    error_id: ERR_SUBSTITUTE_REQUIRED
    http_status: 400
    applies_to: "POST /collateral-release-requests"

  - priority: 25
    category: state
    check: "Direction execute requires status EFFECTIVE (threshold currently met)"
    error_id: ERR_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /directions/{id}/execute"

  - priority: 26
    category: business_constraint
    check: "Request shape: required fields present, enums valid, dates ISO — includes INTEREST run requiring period dates, redemption run requiring target_amount_cents, ratio obligation requiring threshold/basis fields"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- system ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (ISO datetime). Startup default is exactly 2026-05-01T00:00:00Z; before any call the clock reads this default and never wall-clock time. Each set triggers the system sweep: obligation OPEN->LATE->BREACHED transitions, direction LAPSED transitions, covenant-posture recomputes, and all cascades that follow."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["system sweep of time-based transitions"]

  # --- Indenture ---
  - method: POST
    path: "/indentures"
    description: "Create an indenture (DRAFT)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, issuer_ref, governing_law, initial_trustee_ref, annual_admin_fee_cents, extraordinary_hourly_rate_cents, default_hourly_rate_cents]
    output: Indenture
    side_effects: ["status=DRAFT, computed fields initialized (outstanding 0, posture CURRENT, active_default_count 0)"]

  - method: GET
    path: "/indentures"
    description: "List indentures"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["status?", "issuer_ref?", "limit?", "offset?"]
    output: "Indenture[]"
    side_effects: []

  - method: GET
    path: "/indentures/{id}"
    description: "Get one indenture"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: Indenture
    side_effects: []

  - method: POST
    path: "/indentures/{id}/activate"
    description: "Activate a DRAFT indenture; requires at least one tranche"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Indenture
    side_effects: ["status ACTIVE; current_trustee_ref := initial_trustee_ref; version += 1"]

  # --- Tranche ---
  - method: POST
    path: "/tranches"
    description: "Create a tranche; indenture must be DRAFT or ACTIVE (activation requires at least one tranche)"
    roles: [PlatformAdmin]
    code: 201
    input: [indenture_id, series_code, original_principal_cents, interest_rate_bps, day_count_convention, payment_frequency, maturity_date, "notice_period_days?"]
    output: Tranche
    side_effects: ["Indenture.outstanding_principal_cents recomputed"]

  - method: GET
    path: "/tranches"
    description: "List tranches (FK reverse for Tranche.indenture_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["indenture_id?", "status?", "limit?", "offset?"]
    output: "Tranche[]"
    side_effects: []

  - method: GET
    path: "/tranches/{id}"
    description: "Get one tranche"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: Tranche
    side_effects: []

  # --- NoteholderAccount ---
  - method: POST
    path: "/noteholder-accounts"
    description: "Register a noteholder account"
    roles: [PlatformAdmin]
    code: 201
    input: [holder_ref, legal_name, contact_email]
    output: NoteholderAccount
    side_effects: ["status ACTIVE; totals 0"]

  - method: GET
    path: "/noteholder-accounts"
    description: "List noteholder accounts"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "NoteholderAccount[]"
    side_effects: []

  - method: GET
    path: "/noteholder-accounts/{id}"
    description: "Get one noteholder account"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: NoteholderAccount
    side_effects: []

  # --- Position ---
  - method: POST
    path: "/positions"
    description: "Register a position; aggregate original principal per tranche may not exceed tranche original principal"
    roles: [PlatformAdmin]
    code: 201
    input: [tranche_id, noteholder_account_id, original_principal_cents]
    output: Position
    side_effects: ["principal_amount_cents := original_principal_cents; principal_history seeded; status ACTIVE"]

  - method: GET
    path: "/positions"
    description: "List positions (FK reverse for tranche_id and noteholder_account_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["tranche_id?", "noteholder_account_id?", "status?", "limit?", "offset?"]
    output: "Position[]"
    side_effects: []

  - method: GET
    path: "/positions/{id}"
    description: "Get one position"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: Position
    side_effects: []

  # --- CovenantObligation ---
  - method: POST
    path: "/covenant-obligations"
    description: "Create a covenant obligation on the indenture calendar (OPEN; next_due_date := period_anchor_date)"
    roles: [TrustOfficer]
    code: 201
    input: [indenture_id, covenant_type, frequency, period_anchor_date, "threshold_value?", "threshold_direction?", "measurement_basis?", "grace_period_days?"]
    output: CovenantObligation
    side_effects: ["Indenture.covenant_posture recomputed"]

  - method: GET
    path: "/covenant-obligations"
    description: "List covenant obligations (FK reverse for indenture_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["indenture_id?", "status?", "limit?", "offset?"]
    output: "CovenantObligation[]"
    side_effects: []

  - method: GET
    path: "/covenant-obligations/{id}"
    description: "Get one covenant obligation"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: CovenantObligation
    side_effects: []

  # --- CovenantCertificate ---
  - method: POST
    path: "/covenant-certificates"
    description: "Issuer submits a compliance certificate for an obligation"
    roles: [Issuer]
    code: 201
    input: [covenant_obligation_id, period_end_date, document_ref, "metric_value?", "ttm_metric_value?"]
    output: CovenantCertificate
    side_effects: ["is_late computed against obligation.next_due_date; submitted_at from logical clock"]

  - method: GET
    path: "/covenant-certificates"
    description: "List certificates (FK reverse for covenant_obligation_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["covenant_obligation_id?", "status?", "limit?", "offset?"]
    output: "CovenantCertificate[]"
    side_effects: []

  - method: GET
    path: "/covenant-certificates/{id}"
    description: "Get one certificate"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: CovenantCertificate
    side_effects: []

  - method: POST
    path: "/covenant-certificates/{id}/review"
    description: "Accept or reject a SUBMITTED certificate; accept rolls the obligation forward and cures linked ALLEGED default"
    roles: [TrustOfficer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: CovenantCertificate
    side_effects: ["certificate ACCEPTED/REJECTED; obligation roll-forward on accept; breach-cure cascade when obligation was BREACHED"]

  # --- PaymentRun ---
  - method: POST
    path: "/payment-runs"
    description: "Schedule a payment run on an ACTIVE tranche (ERR_INVALID_STATE otherwise). INTEREST: period window half-open non-overlap. Redemption types: notice period enforced at creation."
    roles: [TrustOfficer]
    code: 201
    input: [tranche_id, payment_type, scheduled_payment_date, "period_start_date?", "period_end_date?", "target_amount_cents?"]
    output: PaymentRun
    side_effects: ["gross_amount_cents computed (0 until execute for INTEREST; = target_amount_cents for redemption types); funding UNFUNDED; distribution SCHEDULED; notice_sent_at set for redemption types"]
    note: "For INTEREST runs gross_amount_cents is provisionally computed at creation AND recomputed at execute from current positions (position set may shrink via redemptions between create and execute)"

  - method: GET
    path: "/payment-runs"
    description: "List payment runs (FK reverse for tranche_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["tranche_id?", "funding_status?", "distribution_status?", "limit?", "offset?"]
    output: "PaymentRun[]"
    side_effects: []

  - method: GET
    path: "/payment-runs/{id}"
    description: "Get one payment run"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: PaymentRun
    side_effects: []

  - method: POST
    path: "/payment-runs/{id}/fund"
    description: "Issuer deposits funds; funding_status advances on cumulative amount"
    roles: [Issuer]
    code: 200
    input: [amount_cents]
    output: PaymentRun
    side_effects: ["funded_amount_cents += amount_cents; funding_status recomputed (FUNDED at funded >= gross)"]

  - method: POST
    path: "/payment-runs/{id}/execute"
    description: "Execute a FUNDED run: create per-position DistributionRecords, apply redemption reductions, bubble up tranche/indenture status"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["DistributionRecords created PENDING (zero-cent included); positions/tranche/indenture recomputed; noteholder totals updated at settlement sweep"]

  - method: POST
    path: "/payment-runs/{id}/reverse"
    description: "Compensating reversal of a DISTRIBUTED run; restores principal and cash ledgers exactly"
    roles: [TrustManager]
    code: 200
    input: []
    output: PaymentRun
    side_effects: ["records -> RETURNED; position/tranche/indenture principal restored; noteholder totals decremented"]

  # --- DistributionRecord ---
  - method: GET
    path: "/distribution-records"
    description: "List distribution records (FK reverse for payment_run_id and position_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["payment_run_id?", "position_id?", "status?", "limit?", "offset?"]
    output: "DistributionRecord[]"
    side_effects: []

  - method: GET
    path: "/distribution-records/{id}"
    description: "Get one distribution record"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: DistributionRecord
    side_effects: []

  - method: POST
    path: "/distribution-records/{id}/return"
    description: "Mark a PAID record RETURNED (misdirected funds clawed back to trustee)"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: DistributionRecord
    side_effects: ["status RETURNED; NoteholderAccount.total_received_cents -= allocated_cents"]

  # --- DefaultCase ---
  - method: POST
    path: "/default-cases"
    description: "TrustOfficer declares an event of default (ALLEGED)"
    roles: [TrustOfficer]
    code: 201
    input: [indenture_id, default_type, cure_deadline, "source_ref?"]
    output: DefaultCase
    side_effects: ["status ALLEGED; declared_by_user_id recorded; Indenture.active_default_count recomputed"]

  - method: GET
    path: "/default-cases"
    description: "List default cases (FK reverse for indenture_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["indenture_id?", "status?", "limit?", "offset?"]
    output: "DefaultCase[]"
    side_effects: []

  - method: GET
    path: "/default-cases/{id}"
    description: "Get one default case"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: DefaultCase
    side_effects: []

  - method: POST
    path: "/default-cases/{id}/confirm"
    description: "TrustManager confirms an ALLEGED default; triggers indenture default cascade"
    roles: [TrustManager]
    code: 200
    input: []
    output: DefaultCase
    side_effects: ["status CONFIRMED; Indenture -> DEFAULTED; payment runs SUSPENDED; records HELD; noteholder unpaid totals recomputed"]

  - method: POST
    path: "/default-cases/{id}/cure"
    description: "TrustManager cures a CONFIRMED default at or before cure_deadline"
    roles: [TrustManager]
    code: 200
    input: []
    output: DefaultCase
    side_effects: ["status CURED; Indenture resume cascade when last active default clears"]

  # --- NoteholderDirection ---
  - method: POST
    path: "/directions"
    description: "Open a noteholder direction circulation on a CONFIRMED/ACCELERATED default case; supersedes CIRCULATING siblings; OCC-guarded on DefaultCase.version"
    roles: [TrustOfficer]
    code: 201
    input: [default_case_id, instruction_type, expires_at, expected_default_case_version]
    output: NoteholderDirection
    side_effects: ["prior CIRCULATING directions on the case -> SUPERSEDED; increments DefaultCase.version by 1; status CIRCULATING"]

  - method: GET
    path: "/directions"
    description: "List directions (FK reverse for default_case_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["default_case_id?", "status?", "limit?", "offset?"]
    output: "NoteholderDirection[]"
    side_effects: []

  - method: GET
    path: "/directions/{id}"
    description: "Get one direction"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: NoteholderDirection
    side_effects: []

  - method: POST
    path: "/directions/{id}/endorsements"
    description: "Noteholder endorses a circulating direction; snapshots holder aggregate principal; may flip direction to EFFECTIVE"
    roles: [Noteholder]
    code: 201
    input: [noteholder_account_id]
    output: DirectionEndorsement
    side_effects: ["endorsed_principal_cents snapshot; direction supporting/eligible recomputed; EFFECTIVE when threshold met"]

  - method: GET
    path: "/direction-endorsements"
    description: "List endorsements (FK reverse for direction_id and noteholder_account_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["direction_id?", "noteholder_account_id?", "status?", "limit?", "offset?"]
    output: "DirectionEndorsement[]"
    side_effects: []

  - method: GET
    path: "/direction-endorsements/{id}"
    description: "Get one endorsement"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: DirectionEndorsement
    side_effects: []

  - method: POST
    path: "/direction-endorsements/{id}/withdraw"
    description: "Endorsing holder withdraws support; may flip EFFECTIVE direction back to CIRCULATING"
    roles: [Noteholder]
    code: 200
    input: []
    output: DirectionEndorsement
    side_effects: ["status WITHDRAWN; direction supporting recomputed; threshold loss flips direction to CIRCULATING"]

  - method: POST
    path: "/directions/{id}/execute"
    description: "TrustManager executes an EFFECTIVE direction (accelerate / waive / rescind)"
    roles: [TrustManager]
    code: 200
    input: []
    output: NoteholderDirection
    side_effects: ["status EXECUTED; DefaultCase/Indenture/Tranche transitions per instruction_type"]

  # --- ConsentSolicitation ---
  - method: POST
    path: "/consent-solicitations"
    description: "Issuer opens a consent solicitation draft; closed-interval window overlap with DRAFT/OPEN siblings rejected (adjacency collides)"
    roles: [Issuer]
    code: 201
    input: [indenture_id, subject_type, consent_threshold_bps, tabulation_basis, record_date, expiry_date, "target_obligation_id?", "amendment_payload?"]
    output: ConsentSolicitation
    side_effects: ["status DRAFT"]

  - method: GET
    path: "/consent-solicitations"
    description: "List solicitations (FK reverse for indenture_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["indenture_id?", "status?", "limit?", "offset?"]
    output: "ConsentSolicitation[]"
    side_effects: []

  - method: GET
    path: "/consent-solicitations/{id}"
    description: "Get one solicitation"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: ConsentSolicitation
    side_effects: []

  - method: POST
    path: "/consent-solicitations/{id}/open"
    description: "Open a DRAFT solicitation for balloting"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: ConsentSolicitation
    side_effects: ["status OPEN"]

  - method: POST
    path: "/consent-solicitations/{id}/ballots"
    description: "Noteholder casts a ballot; weight snapshot per tabulation_basis; one ballot per account"
    roles: [Noteholder]
    code: 201
    input: [noteholder_account_id, vote]
    output: ConsentSolicitation
    side_effects: ["ballot appended with principal_voted_cents per basis; consenting tally updated"]

  - method: POST
    path: "/consent-solicitations/{id}/close"
    description: "Tabulate and close: PASSED/FAILED per threshold, or EXPIRED when past expiry regardless of tally"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: ConsentSolicitation
    side_effects: ["PASSED applies subject (covenant waiver cascade or amendment application)"]

  - method: POST
    path: "/consent-solicitations/{id}/revoke"
    description: "Issuer revokes a DRAFT/OPEN solicitation"
    roles: [Issuer]
    code: 200
    input: []
    output: ConsentSolicitation
    side_effects: ["status REVOKED"]

  # --- CollateralItem ---
  - method: POST
    path: "/collateral-items"
    description: "Register pledged collateral"
    roles: [TrustOfficer]
    code: 201
    input: [indenture_id, description, collateral_type, appraised_value_cents, valuation_date]
    output: CollateralItem
    side_effects: ["status PLEDGED"]

  - method: GET
    path: "/collateral-items"
    description: "List collateral items (FK reverse for indenture_id; also discovery channel for substitution-created items)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["indenture_id?", "status?", "limit?", "offset?"]
    output: "CollateralItem[]"
    side_effects: []

  - method: GET
    path: "/collateral-items/{id}"
    description: "Get one collateral item"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: CollateralItem
    side_effects: []

  # --- CollateralReleaseRequest ---
  - method: POST
    path: "/collateral-release-requests"
    description: "Issuer requests release or substitution; supersedes SUBMITTED siblings; OCC-guarded on CollateralItem.version"
    roles: [Issuer]
    code: 201
    input: [collateral_item_id, request_type, expected_collateral_item_version, "substitute_description?", "substitute_collateral_type?", "substitute_appraised_value_cents?", "substitute_valuation_date?"]
    output: CollateralReleaseRequest
    side_effects: ["prior SUBMITTED requests on the item -> SUPERSEDED; increments CollateralItem.version by 1; status SUBMITTED"]

  - method: GET
    path: "/collateral-release-requests"
    description: "List release requests (FK reverse for collateral_item_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["collateral_item_id?", "status?", "limit?", "offset?"]
    output: "CollateralReleaseRequest[]"
    side_effects: []

  - method: GET
    path: "/collateral-release-requests/{id}"
    description: "Get one release request"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: CollateralReleaseRequest
    side_effects: []

  - method: POST
    path: "/collateral-release-requests/{id}/verify"
    description: "TrustOfficer verifies a SUBMITTED request; computes post_release_coverage_bps (pinned evaluation order)"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: CollateralReleaseRequest
    side_effects: ["status VERIFIED; post_release_coverage_bps computed; verified_by_user_id recorded"]

  - method: POST
    path: "/collateral-release-requests/{id}/decide"
    description: "TrustManager approves/rejects a VERIFIED request; SoD vs verifier; default lock before coverage floor"
    roles: [TrustManager]
    code: 200
    input: [decision]
    output: CollateralReleaseRequest
    side_effects: ["status APPROVED/REJECTED; decided_by_user_id recorded"]

  - method: POST
    path: "/collateral-release-requests/{id}/effect"
    description: "TrustOfficer effects an APPROVED request: item RELEASED, or SUBSTITUTED with auto-created substitute item"
    roles: [TrustOfficer]
    code: 200
    input: []
    output: CollateralReleaseRequest
    side_effects: ["status EFFECTED; collateral item transition; substitute item auto-created when SUBSTITUTION"]

  # --- FeeInvoice ---
  - method: POST
    path: "/fee-invoices"
    description: "TrustOfficer drafts an invoice; EXTRAORDINARY_SERVICE requires an extraordinary basis (a DefaultCase of the indenture that reached CONFIRMED or beyond, declared at or before service_period_end)"
    roles: [TrustOfficer]
    code: 201
    input: [indenture_id, invoice_type, service_period_start, service_period_end, description, "extraordinary_hours?"]
    output: FeeInvoice
    side_effects: ["status DRAFT; amount_cents computed; drafted_by_user_id recorded"]

  - method: GET
    path: "/fee-invoices"
    description: "List fee invoices (FK reverse for indenture_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["indenture_id?", "status?", "invoice_type?", "limit?", "offset?"]
    output: "FeeInvoice[]"
    side_effects: []

  - method: GET
    path: "/fee-invoices/{id}"
    description: "Get one fee invoice"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: []

  - method: POST
    path: "/fee-invoices/{id}/issue"
    description: "TrustManager issues a DRAFT or AMENDED invoice; SoD vs drafter"
    roles: [TrustManager]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status ISSUED; issued_by_user_id recorded"]

  - method: POST
    path: "/fee-invoices/{id}/pay"
    description: "Issuer pays an ISSUED invoice"
    roles: [Issuer]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status PAID"]

  - method: POST
    path: "/fee-invoices/{id}/dispute"
    description: "Issuer disputes an ISSUED invoice"
    roles: [Issuer]
    code: 200
    input: []
    output: FeeInvoice
    side_effects: ["status DISPUTED"]

  - method: POST
    path: "/fee-invoices/{id}/amend"
    description: "TrustOfficer amends a DISPUTED invoice; amount recomputed"
    roles: [TrustOfficer]
    code: 200
    input: ["extraordinary_hours?", "description?"]
    output: FeeInvoice
    side_effects: ["status AMENDED; amount_cents recomputed per extraordinary_fee"]

  # --- TrusteeAppointment ---
  - method: POST
    path: "/trustee-appointments"
    description: "Propose a successor trustee; supersedes in-flight (PROPOSED/ACCEPTED) siblings; OCC-guarded on Indenture.version"
    roles: [PlatformAdmin]
    code: 201
    input: [indenture_id, incoming_trustee_ref, reason, proposed_effective_date, expected_indenture_version]
    output: TrusteeAppointment
    side_effects: ["prior in-flight appointments -> SUPERSEDED; increments Indenture.version by 1; status PROPOSED; outgoing_trustee_ref recorded"]

  - method: GET
    path: "/trustee-appointments"
    description: "List appointments (FK reverse for indenture_id)"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: ["indenture_id?", "status?", "limit?", "offset?"]
    output: "TrusteeAppointment[]"
    side_effects: []

  - method: GET
    path: "/trustee-appointments/{id}"
    description: "Get one appointment"
    roles: [PlatformAdmin, TrustOfficer, TrustManager, Issuer, Noteholder]
    code: 200
    input: []
    output: TrusteeAppointment
    side_effects: []

  - method: POST
    path: "/trustee-appointments/{id}/accept"
    description: "Record successor acceptance"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TrusteeAppointment
    side_effects: ["status ACCEPTED"]

  - method: POST
    path: "/trustee-appointments/{id}/effect"
    description: "Complete the trustee transfer on/after proposed_effective_date; voids DRAFT fee invoices of the indenture"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TrusteeAppointment
    side_effects: ["status EFFECTIVE; Indenture.current_trustee_ref swapped and version += 1; DRAFT FeeInvoices -> VOID"]

  - method: POST
    path: "/trustee-appointments/{id}/rescind"
    description: "Rescind a PROPOSED or ACCEPTED appointment"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: TrusteeAppointment
    side_effects: ["status RESCINDED"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, invalid enum/date, type mismatch" }
  - { id: ERR_SUBSTITUTE_REQUIRED, http: 400, condition: "SUBSTITUTION release request missing one or more substitute_* fields" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a declared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_OWNERSHIP_VIOLATION, http: 403, condition: "Entity-backed identity mismatch: Noteholder acting on another account, or Issuer acting on an indenture whose issuer_ref differs from X-User-ID" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or referenced resource id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource state does not admit the operation per its state machine" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_INDENTURE_NOT_ACTIVE, http: 409, condition: "Payment run execute requires Indenture.status == ACTIVE" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same X-User-ID attempted both halves of a segregated step pair (declare/confirm, verify/decide, draft/issue)" }
  - { id: ERR_DEFAULT_LOCK, http: 409, condition: "Collateral release decision blocked while any DefaultCase of the indenture is CONFIRMED or ACCELERATED" }
  - { id: ERR_NO_EXTRAORDINARY_BASIS, http: 422, condition: "EXTRAORDINARY_SERVICE invoice without a qualifying DefaultCase (status in {CONFIRMED, CURED, WAIVED, ACCELERATED}, declared_at <= service_period_end)" }
  - { id: ERR_DUPLICATE_CONSTRAINT, http: 409, condition: "Uniqueness violation: series_code per indenture, holder_ref global, one ACTIVE endorsement per (direction, account), one ballot per (solicitation, account)" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "INTEREST run window [period_start, period_end) overlaps another non-REVERSED INTEREST run of the same tranche" }
  - { id: ERR_SOLICITATION_WINDOW_OVERLAP, http: 409, condition: "Solicitation closed window [record_date, expiry_date] overlaps another DRAFT/OPEN solicitation of the same indenture (shared boundary date counts)" }
  - { id: ERR_PRINCIPAL_EXCEEDS_POSITION, http: 422, condition: "Sum of position original principal would exceed tranche original principal" }
  - { id: ERR_COVERAGE_BELOW_MINIMUM, http: 422, condition: "post_release_coverage_bps < 12500 at collateral release decision" }
  - { id: ERR_NOTICE_PERIOD_SHORT, http: 422, condition: "Redemption run scheduled_payment_date - creation date < tranche.notice_period_days" }
  - { id: ERR_CURE_DEADLINE_PASSED, http: 409, condition: "Cure attempted after cure_deadline (strictly greater fails; equality cures)" }
  - { id: ERR_DIRECTION_LAPSED, http: 409, condition: "Endorsement attempted when direction not CIRCULATING/EFFECTIVE or logical clock >= expires_at" }
  - { id: ERR_SOLICITATION_EXPIRED, http: 409, condition: "Ballot or open attempted with logical clock date > expiry_date" }
  - { id: ERR_VALUATION_STALE, http: 422, condition: "Collateral or substitute valuation_date more than 180 days before the acting date" }
  - { id: ERR_NOT_YET_EFFECTIVE, http: 409, condition: "Trustee appointment effect attempted before proposed_effective_date" }
  - { id: ERR_FUNDING_SHORTFALL, http: 422, condition: "Execute attempted with funded_amount_cents < gross_amount_cents" }
  - { id: ERR_COVENANT_RATIO_FAILED, http: 422, condition: "Certificate metric fails the obligation threshold per measurement basis" }
  - { id: ERR_TARGET_OBLIGATION_MISMATCH, http: 422, condition: "WAIVE_COVENANT solicitation target_obligation_id missing or references an obligation of another indenture" }
  - { id: ERR_NO_ELIGIBLE_POSITION, http: 422, condition: "Endorser/balloter holds no eligible principal (aggregate ACTIVE position principal, or record-date snapshot, is 0)" }
  - { id: ERR_THRESHOLD_NOT_MET, http: 409, condition: "Direction execute attempted while direction is not EFFECTIVE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Corporate trust platform operator; structural setup, activation, successor trustee appointments, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /indentures, POST /indentures/{id}/activate"
      - "POST /tranches, POST /positions, POST /noteholder-accounts"
      - "POST /trustee-appointments and accept/effect/rescind actions"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"

  - name: TrustOfficer
    description: "Corporate trust administrator; covenant calendar, certificate review, payment agency, collateral registration/verification/effect, direction circulation, fee drafting"
    identity: opaque
    exclusive_operations:
      - "POST /covenant-obligations, POST /covenant-certificates/{id}/review"
      - "POST /payment-runs, POST /payment-runs/{id}/execute, POST /distribution-records/{id}/return"
      - "POST /default-cases, POST /directions, POST /consent-solicitations/{id}/open and /close"
      - "POST /collateral-items, POST /collateral-release-requests/{id}/verify and /effect"
      - "POST /fee-invoices, POST /fee-invoices/{id}/amend"
    shared_operations:
      - "All GET endpoints"

  - name: TrustManager
    description: "Senior trust approver; segregated from TrustOfficer on declare/confirm, verify/decide, draft/issue pairs"
    identity: opaque
    exclusive_operations:
      - "POST /default-cases/{id}/confirm and /cure"
      - "POST /directions/{id}/execute"
      - "POST /collateral-release-requests/{id}/decide"
      - "POST /fee-invoices/{id}/issue"
      - "POST /payment-runs/{id}/reverse"
    shared_operations:
      - "All GET endpoints"

  - name: Issuer
    description: "Bond issuer representative; owns indentures whose issuer_ref equals X-User-ID; submits certificates, funds payment runs, requests collateral actions, runs consent solicitations, pays/disputes fees"
    identity: opaque
    exclusive_operations:
      - "POST /covenant-certificates"
      - "POST /payment-runs/{id}/fund"
      - "POST /collateral-release-requests"
      - "POST /consent-solicitations, POST /consent-solicitations/{id}/revoke"
      - "POST /fee-invoices/{id}/pay, POST /fee-invoices/{id}/dispute"
    shared_operations:
      - "All GET endpoints"

  - name: Noteholder
    description: "Registered holder; acts as its own NoteholderAccount (X-User-ID equals account id); endorses directions and casts consent ballots"
    identity: "entity_backed:NoteholderAccount"
    exclusive_operations:
      - "POST /directions/{id}/endorsements"
      - "POST /direction-endorsements/{id}/withdraw"
      - "POST /consent-solicitations/{id}/ballots"
    shared_operations:
      - "All GET endpoints"
