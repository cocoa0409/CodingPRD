    roles: [RightsHolder]
    code: 200
    input: []
    output: PromotionEnrollment
    side_effects: []

  - method: POST
    path: "/catalog/promotions/{id}/terminate"
    description: "Terminate an enrollment"
    roles: [RightsHolder, FraudAnalyst]
    code: 200
    input: []
    output: PromotionEnrollment
    side_effects: ["status TERMINATED"]

  - method: POST
    path: "/catalog/streams"
    description: "Ingest a stream event into the OPEN royalty period"
    roles: [PlatformAdmin]
    code: 201
    input: [track_id, territory, source, occurred_on, ms_played]
    output: StreamEvent
    side_effects: ["royalty_period_id bound to the covering OPEN period"]

  - method: GET
    path: "/catalog/streams/{id}"
    description: "Fetch a single stream event"
    roles: [PlatformAdmin, FraudAnalyst]
    code: 200
    input: []
    output: StreamEvent
    side_effects: []

  - method: GET
    path: "/catalog/streams"
    description: "List stream events, filterable"
    roles: [PlatformAdmin, FraudAnalyst]
    code: 200
    input: ["track_id?", "royalty_period_id?", "is_tainted?", "limit?", "offset?"]
    output: "StreamEvent[]"
    side_effects: []

  - method: POST
    path: "/catalog/fraud-cases"
    description: "Open a fraud case on a track window; confidence computed, AUTO_FLAGGED at/above threshold"
    roles: [FraudAnalyst]
    code: 201
    input: [track_id, window_start, window_end, signal_bot_ratio, signal_velocity_zscore, signal_device_concentration]
    output: FraudCase
    side_effects: ["confidence_score computed; verdict OPEN or AUTO_FLAGGED"]

  - method: GET
    path: "/catalog/fraud-cases/{id}"
    description: "Fetch a fraud case"
    roles: [PlatformAdmin, FraudAnalyst]
    code: 200
    input: []
    output: FraudCase
    side_effects: []

  - method: GET
    path: "/catalog/fraud-cases"
    description: "List fraud cases, filterable by track_id/verdict"
    roles: [PlatformAdmin, FraudAnalyst]
    code: 200
    input: ["track_id?", "verdict?", "limit?", "offset?"]
    output: "FraudCase[]"
    side_effects: []

  - method: POST
    path: "/catalog/fraud-cases/{id}/adjudicate"
    description: "Confirm (threshold-gated, cascades taint+clawback+evictions) or dismiss"
    roles: [FraudAnalyst]
    code: 200
    input: [verdict]
    output: FraudCase
    side_effects: ["CONFIRM: taint streams, clawback, terminate enrollments, evict placements, artist strike cascade"]

  - method: POST
    path: "/catalog/royalty-periods"
    description: "Open a royalty period"
    roles: [PlatformAdmin]
    code: 201
    input: [period_start, period_end, pool_cents]
    output: RoyaltyPeriod
    side_effects: ["status OPEN"]

  - method: GET
    path: "/catalog/royalty-periods/{id}"
    description: "Fetch a period"
    roles: [PlatformAdmin, FraudAnalyst, RightsHolder]
    code: 200
    input: []
    output: RoyaltyPeriod
    side_effects: []

  - method: GET
    path: "/catalog/royalty-periods"
    description: "List periods"
    roles: [PlatformAdmin, FraudAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RoyaltyPeriod[]"
    side_effects: []

  - method: POST
    path: "/catalog/royalty-periods/{id}/close"
    description: "Close a period, freezing the share variant and generating statements (OCC-guarded)"
    roles: [PlatformAdmin]
    code: 200
    input: [variant, expected_period_version]
    output: RoyaltyPeriod
    side_effects: ["closed_variant frozen; RoyaltyStatement rows generated; increments RoyaltyPeriod.version by 1"]

  - method: POST
    path: "/catalog/royalty-periods/{id}/settle"
    description: "Settle a closed period; statements become immutable"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: RoyaltyPeriod
    side_effects: []

  - method: GET
    path: "/catalog/royalty-statements/{id}"
    description: "Fetch a single royalty statement"
    roles: [PlatformAdmin, RightsHolder, FraudAnalyst]
    code: 200
    input: []
    output: RoyaltyStatement
    side_effects: []

  - method: GET
    path: "/catalog/royalty-statements"
    description: "List statements, filterable by period_id/artist_id"
    roles: [PlatformAdmin, RightsHolder, FraudAnalyst]
    code: 200
    input: ["period_id?", "artist_id?", "limit?", "offset?"]
    output: "RoyaltyStatement[]"
    side_effects: []

  - method: POST
    path: "/catalog/profile-modules"
    description: "Attach a CANVAS or MERCH module to the artist profile"
    roles: [RightsHolder]
    code: 201
    input: [artist_id, module_type, "track_id?", payload_uri]
    output: ProfileModule
    side_effects: ["status ENABLED"]

  - method: GET
    path: "/catalog/profile-modules/{id}"
    description: "Fetch a single profile module"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: []
    output: ProfileModule
    side_effects: []

  - method: GET
    path: "/catalog/profile-modules"
    description: "List profile modules, filterable by artist_id/track_id/module_type/status"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: ["artist_id?", "track_id?", "module_type?", "status?", "limit?", "offset?"]
    output: "ProfileModule[]"
    side_effects: []

  - method: POST
    path: "/catalog/profile-modules/{id}/disable"
    description: "Disable a profile module"
    roles: [RightsHolder]
    code: 200
    input: []
    output: ProfileModule
    side_effects: []

  - method: POST
    path: "/catalog/presaves"
    description: "Register a fan pre-save for a scheduled release"
    roles: [PlatformAdmin]
    code: 201
    input: [release_id, fan_token, territory]
    output: PreSave
    side_effects: ["status SAVED; Release.presave_count recomputed"]

  - method: GET
    path: "/catalog/presaves/{id}"
    description: "Fetch a single pre-save"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: []
    output: PreSave
    side_effects: []

  - method: GET
    path: "/catalog/presaves"
    description: "List pre-saves, filterable by release_id/status"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: ["release_id?", "status?", "limit?", "offset?"]
    output: "PreSave[]"
    side_effects: []

  - method: POST
    path: "/catalog/presaves/{id}/cancel"
    description: "Cancel a pre-save"
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: []
    output: PreSave
    side_effects: ["Release.presave_count recomputed"]

  - method: POST
    path: "/catalog/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-09-01T00:00:00Z; before any set call the logical clock reads exactly that instant and never falls back to wall-clock time. Advancing the clock past a Release.release_date flips SCHEDULED -> LIVE (artist must be ACTIVE) and runs presave conversion; advancing past scheduled_rotation_on rotates ACTIVE/REINSTATED placements out."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["time-driven transitions fire deterministically in created_at order"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown role or user headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or RightsHolder acting on a resource owned by another artist" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path or body FK id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, or out-of-enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the resource's current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_PITCH_WINDOW_CLOSED, http: 409, condition: "Pitch submit/revise inside MIN_PITCH_LEAD_DAYS of release_date (or after it)" }
  - { id: ERR_PITCH_NOT_PITCHABLE, http: 409, condition: "Track is not the focus track, not AVAILABLE, or already has a non-terminal pitch" }
  - { id: ERR_PLAYLIST_FIT_MISMATCH, http: 409, condition: "Playlist retired, or genre/mood tags do not satisfy the playlist focus" }
  - { id: ERR_FRAUD_HOLD, http: 409, condition: "Track under OPEN/AUTO_FLAGGED fraud investigation blocks the action" }
  - { id: ERR_DATE_CHANGE_WINDOW, http: 409, condition: "Date change inside the pitch window, new date not in the future, or MAX_DATE_CHANGES reached" }
  - { id: ERR_ENROLLMENT_WINDOW_OVERLAP, http: 409, condition: "Enrollment window overlaps another non-terminal enrollment for the track (adjacent touching allowed), or starts_on >= ends_on" }
  - { id: ERR_SLOT_OCCUPIED, http: 409, condition: "Another ACTIVE/REINSTATED placement occupies (playlist_id, slot_index)" }
  - { id: ERR_ROTATION_TOO_EARLY, http: 409, condition: "Manual rotate before scheduled_rotation_on" }
  - { id: ERR_NO_FREE_SLOT, http: 409, condition: "Pitch accept found no free slot on the target playlist" }
  - { id: ERR_PERIOD_NOT_CLOSABLE, http: 409, condition: "Clock before period_end, or another OPEN period overlaps" }
  - { id: ERR_NO_OPEN_PERIOD, http: 409, condition: "No OPEN royalty period covers the stream's occurred_on" }
  - { id: ERR_FRAUD_THRESHOLD_NOT_MET, http: 409, condition: "CONFIRM adjudication with confidence_score < FRAUD_CONFIRM_THRESHOLD" }
  - { id: ERR_DISCLOSURE_TOKEN_MISMATCH, http: 403, condition: "Suspend attempted without the disclosure token minted at enroll" }
  - { id: ERR_TERRITORY_RESTRICTED, http: 422, condition: "Invalid territory code, or presave territory outside a non-empty allowlist" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RightsHolder
    description: "The artist or their label; owns releases, pitches, promotions, profile modules"
    identity: "entity_backed:Artist"
    exclusive_operations:
      - "POST /catalog/releases — create release"
      - "POST /catalog/releases/{id}/change-date — change release date"
      - "POST /catalog/tracks — add track"
      - "POST /catalog/pitches — submit pitch"
      - "POST /catalog/pitches/{id}/revise — revise pitch"
      - "POST /catalog/pitches/{id}/withdraw — withdraw pitch"
      - "POST /catalog/promotions — enroll in promotion"
      - "POST /catalog/promotions/{id}/suspend — suspend enrollment (disclosure token)"
      - "POST /catalog/promotions/{id}/resume — resume enrollment"
      - "POST /catalog/profile-modules — attach profile module"
      - "POST /catalog/profile-modules/{id}/disable — disable module"
    shared_operations:
      - "GET reads of own catalog, promotions, statements"
      - "POST /catalog/releases/{id}/remove (shared with FraudAnalyst)"
      - "POST /catalog/promotions/{id}/terminate (shared with FraudAnalyst)"
      - "POST /catalog/presaves/{id}/cancel (shared with PlatformAdmin)"

  - name: PlaylistEditor
    description: "Editorial team member; claims pitches, requests revisions, drives placement rotation"
    identity: opaque
    exclusive_operations:
      - "POST /catalog/pitches/{id}/claim — claim into review (team must match playlist owning_team)"
      - "POST /catalog/pitches/{id}/request-revision — request revision"
      - "POST /catalog/placements/{id}/activate — activate placement"
      - "POST /catalog/placements/{id}/rotate — rotate placement"
      - "POST /catalog/placements/{id}/reinstate — reinstate placement"
    shared_operations:
      - "GET reads of catalog, playlists, pitches, placements"

  - name: EditorialLead
    description: "Editorial leadership; owns playlists and accept/reject decisions"
    identity: opaque
    exclusive_operations:
      - "POST /catalog/playlists — create playlist"
      - "POST /catalog/playlists/{id}/retire — retire playlist"
      - "POST /catalog/pitches/{id}/decide — accept/reject pitch"
    shared_operations:
      - "GET reads of catalog, playlists, pitches, placements"

  - name: FraudAnalyst
    description: "Trust & safety; fraud cases, adjudication, artist suspension, content removal"
    identity: opaque
    exclusive_operations:
      - "POST /catalog/fraud-cases — open fraud case"
      - "POST /catalog/fraud-cases/{id}/adjudicate — confirm/dismiss"
      - "POST /catalog/artists/{id}/suspend — suspend artist"
      - "POST /catalog/artists/{id}/reinstate — reinstate artist"
    shared_operations:
      - "GET reads incl. streams and fraud cases"
      - "POST /catalog/releases/{id}/remove (shared with RightsHolder)"
      - "POST /catalog/promotions/{id}/terminate (shared with RightsHolder)"

  - name: PlatformAdmin
    description: "Platform operator; artist registry, stream ingest, royalty period lifecycle, presaves, clock"
    identity: opaque
    exclusive_operations:
      - "POST /catalog/artists — register artist"
      - "POST /catalog/streams — ingest stream"
      - "POST /catalog/royalty-periods — open period"
      - "POST /catalog/royalty-periods/{id}/close — close period (OCC)"
      - "POST /catalog/royalty-periods/{id}/settle — settle period"
      - "POST /catalog/presaves — register presave"
      - "POST /catalog/tracks/{id}/signal-rollup — submit signal rollup"
      - "POST /catalog/_clock/set_current_utc — advance the logical clock"
    shared_operations:
      - "GET reads of everything"
      - "POST /catalog/presaves/{id}/cancel (shared with RightsHolder)"

# =============================================================================
# Calculation/validation constants used across tables
# (declared here so downstream generators pin identical values)
# =============================================================================
constants:
  MIN_PITCH_LEAD_DAYS: 7
  PITCH_WINDOW_DAYS: 7
  MAX_REVISION_ROUNDS: 2
  MAX_DATE_CHANGES: 3
  FRAUD_STRIKE_LIMIT: 2
  TERMINATION_STRIKE_LIMIT: 3
