scenario: "586. Fleet Fuel Card & Telematics (WEX/Fleetcor style): card issuance & vehicle/driver assignment, purchase controls (product/$/gallon/time), odometer/MPG & exception flag, fuel-tax (IFTA) reporting, telematics fault & maintenance, rebate/discount network, fraud alert, GL/expense export"
domain_name: fleet-fuel-card
api_prefix: ""

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities (FleetAccount, Vehicle, Driver, FuelCard) joined by foreign
  # keys; CardAssignment and Transaction are association/event rows across them.
  # No deep URL nesting — every resource is addressed at its own collection root.

  state_machine_shape: parallel
  # Transaction carries two INDEPENDENT axes (posting_status × review_status).
  # FraudAlert is cyclic (CONFIRMED -> INVESTIGATING -> CONFIRMED via reopen).

  relationship_patterns:
    - one_to_many        # FleetAccount -> Vehicle/Driver/FuelCard
    - many_to_many       # CardAssignment junctions FuelCard × Vehicle × Driver
    - cross_aggregate    # Transaction reconciles onto FleetAccount ledger fields

  role_model: peer_roles
  # ProgramAdmin (platform), FleetManager (owns one FleetAccount's resources),
  # Merchant (fuel network POS), FraudAnalyst (alerts), TelematicsGateway (faults).

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — emitted verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: FleetAccount
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: Legal name of the fleet operator.
      - name: status
        type: enum
        source: input
        description: Account lifecycle flag.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"
      - name: base_jurisdiction
        type: string
        source: input
        description: Home IFTA jurisdiction (2-letter state code, e.g. CA).
      - name: credit_limit_cents
        type: integer
        source: input
        description: Total revolving credit ceiling for all cards on the account, in cents.
        constraints: ">= 0"
      - name: rebate_tiers
        type: array
        source: input
        description: >
          Ordered rebate schedule; each element {min_month_gallons:int, cpg_rebate:int}
          gives the cents-per-gallon rebate that applies once month-to-date gallons reach
          min_month_gallons. Must be sorted ascending by min_month_gallons with a first
          element of min_month_gallons=0.
        default: "[{min_month_gallons: 0, cpg_rebate: 5}, {min_month_gallons: 1000, cpg_rebate: 8}, {min_month_gallons: 5000, cpg_rebate: 12}]"
      - name: outstanding_holds_cents
        type: integer
        source: computed
        description: "Sum of gross_amount_cents over this account's Transactions in posting_status IN {AUTHORIZED, CAPTURED}."
      - name: settled_spend_cents
        type: integer
        source: computed
        description: "Sum of gross_amount_cents over this account's Transactions in posting_status == SETTLED."
      - name: available_credit_cents
        type: integer
        source: computed
        description: "credit_limit_cents - outstanding_holds_cents - settled_spend_cents."
      - name: rebate_accrual_cents
        type: integer
        source: computed
        description: "Running rebate liability: sum of provisional_rebate_cents over this account's non-VOIDED Transactions in posting_status IN {CAPTURED, SETTLED}, adjusted by (final_rebate_cents - provisional_rebate_cents) once each settles."

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: fleet_account_id
        type: string
        source: input
        description: "FK -> FleetAccount.id; owning account."
      - name: plate
        type: string
        source: input
        description: License plate.
      - name: tank_capacity_gallons
        type: number
        source: input
        description: Nominal tank capacity in gallons; used by the over-tank fraud rule.
        constraints: "> 0"
      - name: starting_odometer
        type: number
        source: input
        description: Odometer reading at vehicle onboarding.
        default: 0
        constraints: ">= 0"
      - name: current_odometer
        type: number
        source: computed
        description: "Odometer of the latest AUTHORIZED-or-later Transaction on this vehicle, else starting_odometer."
      - name: expected_mpg_min
        type: number
        source: input
        description: Lower bound of the acceptable fuel-economy band.
        constraints: "> 0"
      - name: expected_mpg_max
        type: number
        source: input
        description: Upper bound of the acceptable fuel-economy band.
        constraints: ">= expected_mpg_min"
      - name: home_jurisdiction
        type: string
        source: input
        description: Registered jurisdiction (2-letter state code).
      - name: status
        type: enum
        source: system
        description: Operational state.
        default: ACTIVE
        constraints: "one of {ACTIVE, OUT_OF_SERVICE, RETIRED}"

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: fleet_account_id
        type: string
        source: input
        description: "FK -> FleetAccount.id; owning account."
      - name: full_name
        type: string
        source: input
        description: Driver name.
      - name: pin
        type: string
        source: input
        description: 4-digit numeric PIN entered at the pump.
        constraints: "exactly 4 digits"
      - name: status
        type: enum
        source: input
        description: Driver availability.
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: FuelCard
    parent: null
    common_fields: true
    fields:
      - name: fleet_account_id
        type: string
        source: input
        description: "FK -> FleetAccount.id; owning account."
      - name: last4
        type: string
        source: input
        description: Last four digits of the PAN (display only).
      - name: status
        type: enum
        source: system
        description: Card lifecycle.
        default: ISSUED
        constraints: "one of {ISSUED, ACTIVE, SUSPENDED, CANCELLED}"
      - name: allowed_products
        type: array
        source: input
        description: "Purchase-control product whitelist; subset of {UNLEADED, PREMIUM, DIESEL, DEF}."
      - name: daily_dollar_limit_cents
        type: integer
        source: input
        description: Maximum settled+held spend per calendar day (UTC) across this card, in cents.
        constraints: ">= 0"
      - name: per_txn_gallon_limit
        type: number
        source: input
        description: Maximum gallons allowed in a single purchase.
        constraints: "> 0"
      - name: allowed_start_hour
        type: integer
        source: input
        description: Inclusive start of the permitted purchase window (UTC hour 0-23).
        default: 0
        constraints: "0 <= allowed_start_hour <= 23"
      - name: allowed_end_hour
        type: integer
        source: input
        description: "Exclusive end of the permitted purchase window (UTC hour 1-24); window is [allowed_start_hour, allowed_end_hour)."
        default: 24
        constraints: "allowed_start_hour < allowed_end_hour <= 24"

  - name: CardAssignment
    parent: null
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: "FK -> FuelCard.id; the assigned card."
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; vehicle the card is bound to."
      - name: driver_id
        type: string
        source: input
        description: "FK -> Driver.id; driver the card is bound to."
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of the assignment interval (ISO 8601 UTC).
      - name: effective_to
        type: datetime
        source: input
        description: "Exclusive end of the assignment interval; null means open-ended. Interval is half-open [effective_from, effective_to)."
        default: null
      - name: status
        type: enum
        source: system
        description: Assignment lifecycle.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUPERSEDED, ENDED}"

  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - name: card_id
        type: string
        source: input
        description: "FK -> FuelCard.id; card presented at the pump."
      - name: vehicle_id
        type: string
        source: computed
        description: "FK -> Vehicle.id; resolved from the card's ACTIVE CardAssignment covering purchased_at."
      - name: driver_id
        type: string
        source: computed
        description: "FK -> Driver.id; resolved from the card's ACTIVE CardAssignment covering purchased_at."
      - name: product
        type: enum
        source: input
        description: "Fuel product dispensed; one of {UNLEADED, PREMIUM, DIESEL, DEF}."
      - name: gallons
        type: number
        source: input
        description: Gallons dispensed.
        constraints: "> 0"
      - name: unit_price_cents
        type: integer
        source: input
        description: Posted price per gallon in cents.
        constraints: "> 0"
      - name: odometer
        type: number
        source: input
        description: Odometer reading captured at the pump.
        constraints: ">= 0"
      - name: jurisdiction
        type: string
        source: input
        description: 2-letter state code where the purchase occurred (IFTA jurisdiction).
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "round_half_up(gallons * unit_price_cents) — total charge in cents."
      - name: hold_amount_cents
        type: integer
        source: computed
        description: "Credit hold placed at authorization; equals gross_amount_cents while posting_status IN {AUTHORIZED, CAPTURED}, 0 once SETTLED or VOIDED."
      - name: segment_miles
        type: number
        source: computed
        description: "odometer - (previous Transaction odometer on the same vehicle, else vehicle.starting_odometer)."
      - name: mpg_snapshot
        type: number
        source: computed
        description: "SEGMENT fuel economy at authorization: round_half_up(segment_miles / gallons, 1)."
      - name: mpg_exception
        type: boolean
        source: computed
        description: "True when mpg_snapshot < vehicle.expected_mpg_min OR mpg_snapshot > vehicle.expected_mpg_max."
      - name: purchased_at
        type: datetime
        source: computed
        description: Logical clock value at authorization (ISO 8601 UTC).
      - name: posting_status
        type: enum
        source: system
        description: "Money axis; one of {AUTHORIZED, CAPTURED, SETTLED, VOIDED}."
        default: AUTHORIZED
      - name: review_status
        type: enum
        source: system
        description: "Fraud-review axis, independent of posting_status; one of {CLEAN, FLAGGED, CLEARED}."
        default: CLEAN
      - name: provisional_rebate_cents
        type: integer
        source: computed
        description: "Rebate accrued at capture using the tier for month-to-date gallons INCLUDING this transaction; 0 until CAPTURED."
      - name: final_rebate_cents
        type: integer
        source: computed
        description: "Rebate recomputed at settlement using the tier for the whole-month total gallons; 0 until SETTLED."

  - name: FraudAlert
    parent: null
    common_fields: true
    fields:
      - name: transaction_id
        type: string
        source: system
        description: "FK -> Transaction.id; transaction that tripped a fraud rule."
      - name: card_id
        type: string
        source: system
        description: "FK -> FuelCard.id; card of the flagged transaction."
      - name: rule_code
        type: enum
        source: system
        description: "Which rule fired; one of {OVER_TANK_FILL, OUTSIDE_HOURS, PRODUCT_MISMATCH}."
      - name: status
        type: enum
        source: system
        description: Alert lifecycle.
        default: OPEN
        constraints: "one of {OPEN, INVESTIGATING, CONFIRMED, DISMISSED}"
      - name: resolution_note
        type: string
        source: input
        description: Free-text analyst note recorded on confirm/dismiss/reopen.
        default: null

  - name: TelematicsFault
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; vehicle reporting the fault."
      - name: fault_code
        type: string
        source: input
        description: OEM/diagnostic trouble code (e.g. P0301).
      - name: severity
        type: enum
        source: input
        description: "Fault severity; one of {INFO, WARN, CRITICAL}. CRITICAL forces a maintenance window and takes the vehicle out of service."
      - name: status
        type: enum
        source: system
        description: Fault/maintenance lifecycle.
        default: OPEN
        constraints: "one of {OPEN, MAINTENANCE_SCHEDULED, MAINTENANCE_COMPLETE, CLEARED}"
      - name: maintenance_window_start
        type: datetime
        source: input
        description: Inclusive start of the scheduled maintenance window (ISO 8601 UTC); required when severity==CRITICAL.
        default: null
      - name: maintenance_window_end
        type: datetime
        source: input
        description: "Exclusive end of the maintenance window; interval is closed-with-buffer (see resource_temporal_overlap rule). Required when severity==CRITICAL."
        default: null

  - name: IftaReport
    parent: null
    common_fields: true
    fields:
      - name: fleet_account_id
        type: string
        source: input
        description: "FK -> FleetAccount.id; account the report aggregates."
      - name: quarter
        type: string
        source: input
        description: "IFTA quarter tag, e.g. 2026-Q1."
        constraints: "matches ^\\d{4}-Q[1-4]$"
      - name: period_start
        type: datetime
        source: computed
        description: Inclusive UTC start of the quarter derived from `quarter`.
      - name: period_end
        type: datetime
        source: computed
        description: Exclusive UTC end of the quarter derived from `quarter`.
      - name: jurisdiction_lines
        type: array
        source: computed
        description: >
          One element per jurisdiction with SETTLED activity in the period:
          {jurisdiction, miles, gallons_purchased, taxable_gallons, tax_rate_cents, net_tax_cents}.
      - name: total_tax_cents
        type: integer
        source: computed
        description: "Sum of net_tax_cents across jurisdiction_lines; may be negative (net credit)."
      - name: status
        type: enum
        source: system
        description: Report lifecycle.
        default: DRAFT
        constraints: "one of {DRAFT, FILED}"
      - name: filed_at
        type: datetime
        source: computed
        description: Logical clock value stamped when the report is filed.
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: FuelCard
    initial_state: ISSUED
    terminal_states: [CANCELLED]
    transitions:
      - from: ISSUED
        to: ACTIVE
        trigger: "POST /fuel-cards/{id}/activate"
        actor: FleetManager
        preconditions: ["card.status == ISSUED or card.status == SUSPENDED"]
        side_effects: ["increments FuelCard.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fuel-cards/{id}/activate"
        actor: FleetManager
        preconditions: ["card.status == SUSPENDED"]
        side_effects: ["increments FuelCard.version by 1"]
        note: reinstatement
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fuel-cards/{id}/suspend OR system side-effect of FraudAlert INVESTIGATING->CONFIRMED"
        actor: FleetManager | system
        preconditions: ["card.status == ACTIVE"]
        side_effects:
          - "increments FuelCard.version by 1"
          - "CASCADE: every Transaction of this card in posting_status IN {AUTHORIZED, CAPTURED} transitions to VOIDED (this in turn reverses each transaction's hold and accrued rebate — see Transaction *->VOIDED)"
      - from: ISSUED
        to: CANCELLED
        trigger: "POST /fuel-cards/{id}/cancel"
        actor: FleetManager
        preconditions: ["card.status != CANCELLED"]
        side_effects: ["increments FuelCard.version by 1", "any ACTIVE CardAssignment on this card transitions to ENDED"]
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /fuel-cards/{id}/cancel"
        actor: FleetManager
        preconditions: ["card.status != CANCELLED"]
        side_effects: ["increments FuelCard.version by 1", "any ACTIVE CardAssignment on this card transitions to ENDED"]
      - from: SUSPENDED
        to: CANCELLED
        trigger: "POST /fuel-cards/{id}/cancel"
        actor: FleetManager
        preconditions: ["card.status != CANCELLED"]
        side_effects: ["increments FuelCard.version by 1", "any ACTIVE CardAssignment on this card transitions to ENDED"]

  - entity: CardAssignment
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, ENDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system side-effect of POST /card-assignments creating a newer ACTIVE assignment for the same card_id"
        actor: system
        preconditions: ["a newer assignment for the same card_id is being created"]
        side_effects: []
        note: "Only the prior ACTIVE assignment of the SAME card is superseded; assignments of other cards are untouched."
      - from: ACTIVE
        to: ENDED
        trigger: "POST /card-assignments/{id}/end OR system side-effect of Vehicle ACTIVE->OUT_OF_SERVICE / FuelCard ->CANCELLED"
        actor: FleetManager | system
        preconditions: ["assignment.status == ACTIVE"]
        side_effects: ["sets effective_to to the current logical clock if it was null"]

  - entity: Transaction
    initial_state: AUTHORIZED
    terminal_states: [SETTLED, VOIDED]
    transitions:
      # ---- posting axis ----
      - from: AUTHORIZED
        to: CAPTURED
        trigger: "POST /transactions/{id}/capture"
        actor: Merchant
        preconditions: ["transaction.posting_status == AUTHORIZED"]
        side_effects:
          - "computes provisional_rebate_cents via provisional_final_rebate (provisional variant)"
          - "adds provisional_rebate_cents to FleetAccount.rebate_accrual_cents"
        note: posting axis
      - from: CAPTURED
        to: SETTLED
        trigger: "POST /transactions/{id}/settle"
        actor: Merchant
        preconditions: ["transaction.posting_status == CAPTURED"]
        side_effects:
          - "computes final_rebate_cents via provisional_final_rebate (final variant)"
          - "adjusts FleetAccount.rebate_accrual_cents by (final_rebate_cents - provisional_rebate_cents)"
          - "sets hold_amount_cents to 0 (hold releases; gross moves from outstanding_holds to settled_spend)"
        note: posting axis
      - from: AUTHORIZED
        to: VOIDED
        trigger: "POST /transactions/{id}/void"
        actor: Merchant | system
        preconditions: ["transaction.posting_status == AUTHORIZED"]
        side_effects: ["sets hold_amount_cents to 0 (releases the credit hold); no rebate was accrued so none is reversed"]
        note: posting axis; compensation of the authorization hold
      - from: CAPTURED
        to: VOIDED
        trigger: "POST /transactions/{id}/void OR CASCADE from FuelCard ACTIVE->SUSPENDED"
        actor: Merchant | system
        preconditions: ["transaction.posting_status == CAPTURED"]
        side_effects:
          - "sets hold_amount_cents to 0 (releases the credit hold)"
          - "subtracts the previously accrued provisional_rebate_cents from FleetAccount.rebate_accrual_cents"
        note: posting axis; compensation of both hold and accrued rebate
      # ---- review axis (independent of posting) ----
      - from: FLAGGED
        to: CLEARED
        trigger: "system side-effect of FraudAlert INVESTIGATING->DISMISSED"
        actor: system
        preconditions: ["transaction.review_status == FLAGGED"]
        side_effects: []
        note: "review axis; posting_status is unaffected by this transition"

  - entity: FraudAlert
    initial_state: OPEN
    terminal_states: [DISMISSED]
    transitions:
      - from: OPEN
        to: INVESTIGATING
        trigger: "POST /fraud-alerts/{id}/investigate"
        actor: FraudAnalyst
        preconditions: ["alert.status == OPEN"]
        side_effects: []
      - from: INVESTIGATING
        to: CONFIRMED
        trigger: "POST /fraud-alerts/{id}/confirm"
        actor: FraudAnalyst
        preconditions: ["alert.status == INVESTIGATING", "the alert's FuelCard is not CANCELLED"]
        side_effects:
          - "CASCADE ROOT: transitions the alert's FuelCard ACTIVE->SUSPENDED (which itself voids the card's open transactions, which themselves reverse holds+rebate)"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /fraud-alerts/{id}/dismiss"
        actor: FraudAnalyst
        preconditions: ["alert.status == INVESTIGATING"]
        side_effects: ["transitions the flagged Transaction review_status FLAGGED->CLEARED"]
      - from: CONFIRMED
        to: INVESTIGATING
        trigger: "POST /fraud-alerts/{id}/reopen"
        actor: FraudAnalyst
        preconditions: ["alert.status == CONFIRMED"]
        side_effects: []
        note: "cycle back for further review; does NOT un-suspend the card"

  - entity: Vehicle
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: OUT_OF_SERVICE
        trigger: "system side-effect of POST /telematics-faults with severity==CRITICAL"
        actor: system
        preconditions: ["vehicle.status == ACTIVE"]
        side_effects:
          - "CASCADE: every ACTIVE CardAssignment for this vehicle transitions to ENDED"
      - from: OUT_OF_SERVICE
        to: ACTIVE
        trigger: "system side-effect of POST /telematics-faults/{id}/complete-maintenance when no other fault on this vehicle is in {OPEN, MAINTENANCE_SCHEDULED}"
        actor: system
        preconditions: ["vehicle.status == OUT_OF_SERVICE", "no other TelematicsFault on this vehicle is in status IN {OPEN, MAINTENANCE_SCHEDULED}"]
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /vehicles/{id}/retire"
        actor: FleetManager
        preconditions: ["vehicle.status == ACTIVE"]
        side_effects: ["every ACTIVE CardAssignment for this vehicle transitions to ENDED"]
      - from: OUT_OF_SERVICE
        to: RETIRED
        trigger: "POST /vehicles/{id}/retire"
        actor: FleetManager
        preconditions: ["vehicle.status == OUT_OF_SERVICE"]
        side_effects: ["every ACTIVE CardAssignment for this vehicle transitions to ENDED"]

  - entity: TelematicsFault
    initial_state: OPEN
    terminal_states: [CLEARED]
    transitions:
      - from: OPEN
        to: MAINTENANCE_SCHEDULED
        trigger: "auto-transition at POST /telematics-faults when severity==CRITICAL"
        actor: system
        preconditions: ["severity == CRITICAL", "maintenance_window_start and maintenance_window_end are present", "the [start,end) window plus buffer does not collide with another non-CLEARED fault window on the same vehicle"]
        side_effects: ["transitions the Vehicle ACTIVE->OUT_OF_SERVICE (cascade origin)"]
      - from: MAINTENANCE_SCHEDULED
        to: MAINTENANCE_COMPLETE
        trigger: "POST /telematics-faults/{id}/complete-maintenance"
        actor: TelematicsGateway
        preconditions: ["fault.status == MAINTENANCE_SCHEDULED"]
        side_effects: ["transitions the Vehicle OUT_OF_SERVICE->ACTIVE if no other fault on the vehicle remains in {OPEN, MAINTENANCE_SCHEDULED}"]
      - from: MAINTENANCE_COMPLETE
        to: CLEARED
        trigger: "POST /telematics-faults/{id}/clear"
        actor: TelematicsGateway
        preconditions: ["fault.status == MAINTENANCE_COMPLETE"]
        side_effects: []
      - from: OPEN
        to: CLEARED
        trigger: "POST /telematics-faults/{id}/clear"
        actor: TelematicsGateway
        preconditions: ["fault.status == OPEN", "severity != CRITICAL"]
        side_effects: []

  - entity: IftaReport
    initial_state: DRAFT
    terminal_states: [FILED]
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /ifta-reports/{id}/file"
        actor: ProgramAdmin
        preconditions:
          - "report.status == DRAFT"
          - "every Transaction of report.fleet_account_id whose purchased_at is within [period_start, period_end) is in posting_status == SETTLED"
        side_effects: ["stamps filed_at with the current logical clock", "freezes jurisdiction_lines and total_tax_cents"]

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: assignment-create-stale-card
    parent_entity: FuelCard
    write_endpoint: "POST /card-assignments"
    occ_field: "expected_card_version"
    description: |
      Creating a CardAssignment against a FuelCard whose version has advanced
      since the client last observed it is rejected. A new assignment for a card
      legitimately supersedes the card's prior ACTIVE assignment, so a second
      create carrying a stale expected_card_version is refused: the first create
      already superseded the prior assignment and bumped the card's version, so
      the second client's view of the card is stale.
    error_id: ERR_STALE_CARD_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: credit_ledger
    trigger: "recomputed on every Transaction posting transition (authorize/capture/settle/void)"
    algorithm: aggregation
    formula: |
      outstanding_holds_cents = sum(t.gross_amount_cents for t in account.transactions
                                    if t.posting_status in {AUTHORIZED, CAPTURED})
      settled_spend_cents     = sum(t.gross_amount_cents for t in account.transactions
                                    if t.posting_status == SETTLED)
      available_credit_cents  = credit_limit_cents - outstanding_holds_cents - settled_spend_cents
      # INVARIANT (conserved): available_credit_cents + outstanding_holds_cents
      #                        + settled_spend_cents == credit_limit_cents
    input_set: "All Transactions of the FleetAccount, partitioned by posting_status."
    precision: "integer cents, exact"
    variants: []

  - name: provisional_final_rebate
    trigger: "provisional at Transaction AUTHORIZED->CAPTURED; final at CAPTURED->SETTLED"
    algorithm: tiered_pricing
    formula: |
      def cpg(tiers, month_gallons):
          # pick the highest tier whose min_month_gallons <= month_gallons
          rate = tiers[0].cpg_rebate
          for tier in sorted(tiers, key=lambda x: x.min_month_gallons):
              if month_gallons >= tier.min_month_gallons:   # boundary: >= (inclusive)
                  rate = tier.cpg_rebate
          return rate
      # per-transaction rebate, ROUNDED PER TRANSACTION (pinned order — see variants/mode note)
      rebate_cents = round_half_up(t.gallons * cpg(account.rebate_tiers, month_gallons))
      # rebate_accrual_cents = SUM of each transaction's rounded rebate_cents
      #                        (round-per-transaction-THEN-sum; NOT sum(gallons)*cpg then round)
    input_set: "month_gallons = sum of gallons over the account's non-VOIDED CAPTURED/SETTLED transactions whose purchased_at is in the same UTC calendar month as t."
    constants:
      DEFAULT_TIERS: "[{min_month_gallons:0,cpg_rebate:5},{min_month_gallons:1000,cpg_rebate:8},{min_month_gallons:5000,cpg_rebate:12}]"
    precision: "cents, round_half_up per transaction, then integer sum"
    variants:
      - name: provisional
        when: "at capture"
        difference: "month_gallons counts month-to-date gallons INCLUDING this transaction only (transactions posted so far this month up to and including t)."
      - name: final
        when: "at settlement"
        difference: "month_gallons counts the WHOLE-month total gallons across all of the account's non-VOIDED CAPTURED/SETTLED transactions in t's month; a later tier upgrade retroactively raises the rate, so final can exceed provisional."

  - name: vehicle_mpg
    trigger: "GET /vehicles/{id}/mpg?method=SEGMENT|ROLLING; mpg_snapshot also computed at authorization (SEGMENT of the new transaction)"
    algorithm: aggregation
    formula: |
      # transactions ordered by purchased_at ASC, tie-break created_at ASC
      SEGMENT: mpg = round_half_up(latest.segment_miles / latest.gallons, 1)
      ROLLING: total_miles   = latest.odometer - earliest.odometer_in_window
               total_gallons = sum(t.gallons for t in window)
               mpg           = round_half_up(total_miles / total_gallons, 1)
    input_set: "window = all AUTHORIZED-or-later, non-VOIDED transactions of the vehicle; SEGMENT uses only the latest such transaction; ROLLING uses the full window."
    precision: "1 decimal place, round_half_up"
    variants:
      - name: segment
        when: "method=SEGMENT (default)"
        difference: "miles/gallons of the single most-recent fill only."
      - name: rolling
        when: "method=ROLLING"
        difference: "cumulative miles over cumulative gallons across the whole window; differs from segment whenever per-fill economy varies."

  - name: ifta_tax_owed
    trigger: "POST /ifta-reports (generation) and frozen at POST /ifta-reports/{id}/file"
    algorithm: tiered_pricing
    formula: |
      # inputs per period: settled transactions of the account with purchased_at in [period_start, period_end)
      fleet_mpg = (sum(t.segment_miles for t in settled) )
                  / (sum(t.gallons for t in settled))        # 0 gallons -> fleet_mpg treated as 0, all lines empty
      for j in jurisdictions_with_activity:
          miles_j            = sum(t.segment_miles for t in settled if t.jurisdiction == j)
          gallons_purchased_j= sum(t.gallons       for t in settled if t.jurisdiction == j)
          taxable_gallons_j  = 0 if fleet_mpg == 0 else round_half_up(miles_j / fleet_mpg, 3)
          rate_j             = TAX_RATE_CENTS[j]
          net_tax_j          = round_half_up(taxable_gallons_j * rate_j)
                               - round_half_up(gallons_purchased_j * rate_j)   # credit for tax paid at pump
      total_tax_cents = sum(net_tax_j over jurisdictions)    # may be negative
    input_set: "SETTLED transactions of the account whose purchased_at is within the quarter; grouped by jurisdiction."
    constants:
      TAX_RATE_CENTS: "{CA: 68, AZ: 26, NV: 33, OR: 38, TX: 20}"
    precision: "taxable_gallons 3 decimals round_half_up; per-jurisdiction tax rounded to cents round_half_up, THEN summed"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the role is permitted to invoke this endpoint per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every resource referenced in the path or FK body fields exists (validated left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: all
  - priority: 4
    category: business_referential
    check: "for a FleetManager (entity_backed:FleetAccount), the target resource's fleet_account_id equals X-User-ID"
    error_id: ERR_FORBIDDEN_FLEET
    http_status: 403
    applies_to: "all FleetManager-owned resource mutations"
  - priority: 5
    category: state
    check: "target resource is in a state that permits the requested transition (card ACTIVE for authorize; transaction posting_status matches; alert/fault/report state matches)"
    error_id: "ERR_CARD_NOT_ACTIVE | ERR_INVALID_TXN_STATE | ERR_INVALID_ALERT_STATE | ERR_INVALID_FAULT_STATE | ERR_INVALID_REPORT_STATE | ERR_INVALID_CARD_STATE"
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: state
    check: "authorize: the vehicle resolved from the assignment is not OUT_OF_SERVICE / RETIRED; assignment create: vehicle.status == ACTIVE"
    error_id: ERR_VEHICLE_OUT_OF_SERVICE
    http_status: 409
    applies_to: "POST /card-assignments, POST /transactions/authorize"
  - priority: 7
    category: business_referential
    check: "authorize: an ACTIVE CardAssignment for card_id covers purchased_at (resolves vehicle_id + driver_id)"
    error_id: ERR_NO_ACTIVE_ASSIGNMENT
    http_status: 409
    applies_to: "POST /transactions/authorize"
  - priority: 8
    category: business_safety
    check: "authorize: product is in card.allowed_products"
    error_id: ERR_PRODUCT_NOT_ALLOWED
    http_status: 422
    applies_to: "POST /transactions/authorize"
  - priority: 9
    category: business_safety
    check: "authorize: purchased_at hour (UTC) is within [card.allowed_start_hour, card.allowed_end_hour)"
    error_id: ERR_OUTSIDE_ALLOWED_HOURS
    http_status: 422
    applies_to: "POST /transactions/authorize"
  - priority: 10
    category: business_constraint
    check: "authorize: gallons <= card.per_txn_gallon_limit (boundary: equal is allowed, strictly greater is rejected)"
    error_id: ERR_GALLON_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /transactions/authorize"
  - priority: 11
    category: business_temporal
    check: "assignment create: effective_to is null OR effective_from < effective_to; fault: maintenance_window_start < maintenance_window_end"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /card-assignments, POST /telematics-faults"
  - priority: 12
    category: business_constraint
    check: "assignment create: the half-open [effective_from, effective_to) interval does not overlap another ACTIVE assignment of the SAME driver_id (adjacent touching endpoints do NOT overlap)"
    error_id: ERR_DRIVER_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /card-assignments"
  - priority: 13
    category: business_constraint
    check: "fault (CRITICAL): the [start,end) maintenance window, expanded by MAINTENANCE_BUFFER_HOURS on both sides, does not intersect another non-CLEARED fault window on the SAME vehicle (buffered/closed semantics — touching within buffer collides)"
    error_id: ERR_MAINTENANCE_OVERLAP
    http_status: 409
    applies_to: "POST /telematics-faults"
  - priority: 14
    category: business_constraint
    check: "fault: severity==CRITICAL requires both maintenance_window_start and maintenance_window_end"
    error_id: ERR_MISSING_MAINTENANCE_WINDOW
    http_status: 422
    applies_to: "POST /telematics-faults"
  - priority: 15
    category: business_fiscal
    check: "authorize: card's same-UTC-day held+settled spend + this gross_amount_cents <= card.daily_dollar_limit_cents"
    error_id: ERR_DAILY_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /transactions/authorize"
  - priority: 16
    category: business_fiscal
    check: "authorize: account.available_credit_cents >= this gross_amount_cents"
    error_id: ERR_CREDIT_EXCEEDED
    http_status: 402
    applies_to: "POST /transactions/authorize"
  - priority: 17
    category: business_referential
    check: "ifta file: all in-period transactions are SETTLED"
    error_id: ERR_PERIOD_NOT_SETTLED
    http_status: 409
    applies_to: "POST /ifta-reports/{id}/file"
  - priority: 18
    category: state
    check: "assignment create: expected_card_version equals FuelCard.version (OCC)"
    error_id: ERR_STALE_CARD_VERSION
    http_status: 412
    applies_to: "POST /card-assignments"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving clock. Sets the server logical clock. Default at startup (before any call) is 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now: datetime }"
    side_effects: ["all subsequent purchased_at / effective_to / filed_at reads use this value"]

  - method: POST
    path: "/fleet-accounts"
    description: Create a fleet account.
    roles: [ProgramAdmin]
    code: 201
    input: [company_name, base_jurisdiction, credit_limit_cents, "rebate_tiers?", "status?"]
    output: FleetAccount
    side_effects: []
  - method: GET
    path: "/fleet-accounts/{id}"
    description: Fetch a fleet account.
    roles: [ProgramAdmin, FleetManager]
    code: 200
    input: []
    output: FleetAccount
    side_effects: []
  - method: GET
    path: "/fleet-accounts/{id}/summary"
    description: "GL / expense-export view: ledger snapshot plus per-transaction expense lines."
    roles: [ProgramAdmin, FleetManager]
    code: 200
    input: []
    output: "{ available_credit_cents: integer, outstanding_holds_cents: integer, settled_spend_cents: integer, rebate_accrual_cents: integer, gl_lines: array }"
    side_effects: []

  - method: POST
    path: "/vehicles"
    description: Onboard a vehicle.
    roles: [FleetManager]
    code: 201
    input: [fleet_account_id, plate, tank_capacity_gallons, expected_mpg_min, expected_mpg_max, home_jurisdiction, "starting_odometer?"]
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/vehicles/{id}"
    description: Fetch a vehicle.
    roles: [FleetManager, ProgramAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []
  - method: GET
    path: "/vehicles"
    description: List/filter vehicles.
    roles: [FleetManager, ProgramAdmin]
    code: 200
    input: ["fleet_account_id?", "status?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []
  - method: GET
    path: "/vehicles/{id}/mpg"
    description: Computed fuel economy under the requested method.
    roles: [FleetManager, ProgramAdmin]
    code: 200
    input: ["method?"]
    output: "{ method: string, mpg: number, exception: boolean }"
    side_effects: []
  - method: POST
    path: "/vehicles/{id}/retire"
    description: Retire a vehicle (terminal).
    roles: [FleetManager]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["ends ACTIVE CardAssignments for this vehicle"]

  - method: POST
    path: "/drivers"
    description: Create a driver.
    roles: [FleetManager]
    code: 201
    input: [fleet_account_id, full_name, pin, "status?"]
    output: Driver
    side_effects: []
  - method: GET
    path: "/drivers/{id}"
    description: Fetch a driver.
    roles: [FleetManager, ProgramAdmin]
    code: 200
    input: []
    output: Driver
    side_effects: []
  - method: GET
    path: "/drivers"
    description: List/filter drivers.
    roles: [FleetManager, ProgramAdmin]
    code: 200
    input: ["fleet_account_id?", "status?", "limit?", "offset?"]
    output: Driver[]
    side_effects: []

  - method: POST
    path: "/fuel-cards"
    description: Issue a fuel card with purchase controls.
    roles: [FleetManager]
    code: 201
    input: [fleet_account_id, last4, allowed_products, daily_dollar_limit_cents, per_txn_gallon_limit, "allowed_start_hour?", "allowed_end_hour?"]
    output: FuelCard
    side_effects: []
  - method: GET
    path: "/fuel-cards/{id}"
    description: Fetch a fuel card (includes version for OCC).
    roles: [FleetManager, ProgramAdmin]
    code: 200
    input: []
    output: FuelCard
    side_effects: []
  - method: GET
    path: "/fuel-cards"
    description: List/filter fuel cards.
    roles: [FleetManager, ProgramAdmin]
    code: 200
    input: ["fleet_account_id?", "status?", "limit?", "offset?"]
    output: FuelCard[]
    side_effects: []
  - method: POST
    path: "/fuel-cards/{id}/activate"
    description: Activate (or reinstate) a card.
    roles: [FleetManager]
    code: 200
    input: []
    output: FuelCard
    side_effects: ["increments FuelCard.version by 1"]
  - method: POST
    path: "/fuel-cards/{id}/suspend"
    description: Suspend a card; voids its open transactions.
    roles: [FleetManager]
    code: 200
    input: []
    output: FuelCard
    side_effects: ["increments FuelCard.version by 1", "voids AUTHORIZED/CAPTURED transactions of the card"]
  - method: POST
    path: "/fuel-cards/{id}/cancel"
    description: Cancel a card (terminal).
    roles: [FleetManager]
    code: 200
    input: []
    output: FuelCard
    side_effects: ["increments FuelCard.version by 1", "ends ACTIVE CardAssignments of the card"]

  - method: POST
    path: "/card-assignments"
    description: "Assign a card to a vehicle+driver for an interval; supersedes the card's prior ACTIVE assignment. OCC-guarded on the card's version."
    roles: [FleetManager]
    code: 201
    input: [card_id, vehicle_id, driver_id, effective_from, expected_card_version, "effective_to?"]
    output: CardAssignment
    side_effects:
      - "increments FuelCard.version by 1"
      - "transitions the card's prior ACTIVE assignment to SUPERSEDED"
  - method: GET
    path: "/card-assignments/{id}"
    description: Fetch an assignment.
    roles: [FleetManager, ProgramAdmin]
    code: 200
    input: []
    output: CardAssignment
    side_effects: []
  - method: GET
    path: "/card-assignments"
    description: List/filter assignments by card, vehicle, or driver.
    roles: [FleetManager, ProgramAdmin]
    code: 200
    input: ["card_id?", "vehicle_id?", "driver_id?", "status?", "limit?", "offset?"]
    output: CardAssignment[]
    side_effects: []
  - method: POST
    path: "/card-assignments/{id}/end"
    description: End an active assignment.
    roles: [FleetManager]
    code: 200
    input: []
    output: CardAssignment
    side_effects: ["sets effective_to to the current logical clock if null"]

  - method: POST
    path: "/transactions/authorize"
    description: Authorize a fuel purchase; runs purchase controls, fraud rules, hold, and MPG snapshot.
    roles: [Merchant]
    code: 201
    input: [card_id, product, gallons, unit_price_cents, odometer, jurisdiction]
    output: Transaction
    side_effects:
      - "resolves vehicle_id + driver_id from the card's ACTIVE assignment"
      - "computes gross_amount_cents, segment_miles, mpg_snapshot, mpg_exception, purchased_at"
      - "places hold_amount_cents against available_credit_cents"
      - "if a fraud rule fires: sets review_status=FLAGGED and creates a FraudAlert (OPEN)"
      - "updates vehicle.current_odometer"
  - method: GET
    path: "/transactions/{id}"
    description: Fetch a transaction.
    roles: [Merchant, FleetManager, ProgramAdmin]
    code: 200
    input: []
    output: Transaction
    side_effects: []
  - method: GET
    path: "/transactions"
    description: List/filter transactions by card, vehicle, driver, or jurisdiction.
    roles: [Merchant, FleetManager, ProgramAdmin]
    code: 200
    input: ["card_id?", "vehicle_id?", "driver_id?", "jurisdiction?", "posting_status?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []
  - method: POST
    path: "/transactions/{id}/capture"
    description: Capture an authorized transaction; accrues provisional rebate.
    roles: [Merchant]
    code: 200
    input: []
    output: Transaction
    side_effects: ["computes provisional_rebate_cents", "adds it to FleetAccount.rebate_accrual_cents"]
  - method: POST
    path: "/transactions/{id}/settle"
    description: Settle a captured transaction; finalizes rebate and moves the hold to settled spend.
    roles: [Merchant]
    code: 200
    input: []
    output: Transaction
    side_effects: ["computes final_rebate_cents", "adjusts rebate_accrual_cents by (final-provisional)", "releases hold, adds gross to settled_spend"]
  - method: POST
    path: "/transactions/{id}/void"
    description: Void an authorized or captured transaction; reverses hold and any accrued rebate.
    roles: [Merchant]
    code: 200
    input: []
    output: Transaction
    side_effects: ["releases hold_amount_cents", "reverses provisional_rebate_cents from rebate_accrual_cents if it was CAPTURED"]

  - method: GET
    path: "/fraud-alerts/{id}"
    description: Fetch a fraud alert.
    roles: [FraudAnalyst, FleetManager, ProgramAdmin]
    code: 200
    input: []
    output: FraudAlert
    side_effects: []
  - method: GET
    path: "/fraud-alerts"
    description: List/filter fraud alerts by card or transaction.
    roles: [FraudAnalyst, FleetManager, ProgramAdmin]
    code: 200
    input: ["card_id?", "transaction_id?", "status?", "limit?", "offset?"]
    output: FraudAlert[]
    side_effects: []
  - method: POST
    path: "/fraud-alerts/{id}/investigate"
    description: Move an alert into investigation.
    roles: [FraudAnalyst]
    code: 200
    input: []
    output: FraudAlert
    side_effects: []
  - method: POST
    path: "/fraud-alerts/{id}/confirm"
    description: Confirm fraud; suspends the card (which voids open transactions).
    roles: [FraudAnalyst]
    code: 200
    input: ["resolution_note?"]
    output: FraudAlert
    side_effects: ["suspends the alert's FuelCard (cascade)"]
  - method: POST
    path: "/fraud-alerts/{id}/dismiss"
    description: Dismiss an alert; clears the flagged transaction's review status.
    roles: [FraudAnalyst]
    code: 200
    input: ["resolution_note?"]
    output: FraudAlert
    side_effects: ["transitions the flagged Transaction review_status FLAGGED->CLEARED"]
  - method: POST
    path: "/fraud-alerts/{id}/reopen"
    description: Reopen a confirmed alert for further review (cycle).
    roles: [FraudAnalyst]
    code: 200
    input: ["resolution_note?"]
    output: FraudAlert
    side_effects: []

  - method: POST
    path: "/telematics-faults"
    description: Report a telematics fault; CRITICAL faults schedule maintenance and take the vehicle out of service.
    roles: [TelematicsGateway]
    code: 201
    input: [vehicle_id, fault_code, severity, "maintenance_window_start?", "maintenance_window_end?"]
    output: TelematicsFault
    side_effects: ["if CRITICAL: schedules maintenance and transitions Vehicle ACTIVE->OUT_OF_SERVICE (cascade ends assignments)"]
  - method: GET
    path: "/telematics-faults/{id}"
    description: Fetch a fault.
    roles: [TelematicsGateway, FleetManager, ProgramAdmin]
    code: 200
    input: []
    output: TelematicsFault
    side_effects: []
  - method: GET
    path: "/telematics-faults"
    description: List/filter faults by vehicle.
    roles: [TelematicsGateway, FleetManager, ProgramAdmin]
    code: 200
    input: ["vehicle_id?", "status?", "severity?", "limit?", "offset?"]
    output: TelematicsFault[]
    side_effects: []
  - method: POST
    path: "/telematics-faults/{id}/complete-maintenance"
    description: Mark scheduled maintenance complete; may return the vehicle to service.
    roles: [TelematicsGateway]
    code: 200
    input: []
    output: TelematicsFault
    side_effects: ["returns Vehicle OUT_OF_SERVICE->ACTIVE when no other blocking fault remains"]
  - method: POST
    path: "/telematics-faults/{id}/clear"
    description: Clear a fault (terminal).
    roles: [TelematicsGateway]
    code: 200
    input: []
    output: TelematicsFault
    side_effects: []

  - method: POST
    path: "/ifta-reports"
    description: Generate a DRAFT IFTA report for a quarter (computes jurisdiction lines and total tax).
    roles: [ProgramAdmin]
    code: 201
    input: [fleet_account_id, quarter]
    output: IftaReport
    side_effects: ["computes jurisdiction_lines, total_tax_cents from settled in-period transactions"]
  - method: GET
    path: "/ifta-reports/{id}"
    description: Fetch an IFTA report.
    roles: [ProgramAdmin, FleetManager]
    code: 200
    input: []
    output: IftaReport
    side_effects: []
  - method: GET
    path: "/ifta-reports"
    description: List/filter IFTA reports by fleet account.
    roles: [ProgramAdmin, FleetManager]
    code: 200
    input: ["fleet_account_id?", "status?", "limit?", "offset?"]
    output: IftaReport[]
    side_effects: []
  - method: POST
    path: "/ifta-reports/{id}/file"
    description: File a DRAFT report; requires all in-period transactions settled.
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: IftaReport
    side_effects: ["stamps filed_at, freezes totals"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this endpoint."
  - id: ERR_FORBIDDEN_FLEET
    http: 403
    condition: "FleetManager acting on a resource outside its own fleet_account."
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, or invalid enum value."
  - id: ERR_FLEET_ACCOUNT_NOT_FOUND
    http: 404
    condition: "Referenced fleet account does not exist."
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "Referenced vehicle does not exist."
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "Referenced driver does not exist."
  - id: ERR_CARD_NOT_FOUND
    http: 404
    condition: "Referenced fuel card does not exist."
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "Referenced card assignment does not exist."
  - id: ERR_TRANSACTION_NOT_FOUND
    http: 404
    condition: "Referenced transaction does not exist."
  - id: ERR_ALERT_NOT_FOUND
    http: 404
    condition: "Referenced fraud alert does not exist."
  - id: ERR_FAULT_NOT_FOUND
    http: 404
    condition: "Referenced telematics fault does not exist."
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "Referenced IFTA report does not exist."
  - id: ERR_CARD_NOT_ACTIVE
    http: 409
    condition: "Authorize attempted on a card whose status is not ACTIVE."
  - id: ERR_INVALID_CARD_STATE
    http: 409
    condition: "Card activate/suspend/cancel from a state that does not permit it (e.g. cancel an already CANCELLED card)."
  - id: ERR_INVALID_TXN_STATE
    http: 409
    condition: "capture/settle/void from an incompatible posting_status."
  - id: ERR_INVALID_ALERT_STATE
    http: 409
    condition: "Fraud alert transition from an incompatible status."
  - id: ERR_INVALID_FAULT_STATE
    http: 409
    condition: "Fault complete-maintenance/clear from an incompatible status."
  - id: ERR_INVALID_REPORT_STATE
    http: 409
    condition: "IFTA file attempted on a report not in DRAFT."
  - id: ERR_VEHICLE_OUT_OF_SERVICE
    http: 409
    condition: "Assignment or authorize against an OUT_OF_SERVICE/RETIRED vehicle."
  - id: ERR_NO_ACTIVE_ASSIGNMENT
    http: 409
    condition: "Authorize on a card with no ACTIVE assignment covering purchased_at."
  - id: ERR_PRODUCT_NOT_ALLOWED
    http: 422
    condition: "Purchased product not in the card's allowed_products."
  - id: ERR_OUTSIDE_ALLOWED_HOURS
    http: 422
    condition: "Purchase time outside the card's [allowed_start_hour, allowed_end_hour) window."
  - id: ERR_GALLON_LIMIT_EXCEEDED
    http: 422
    condition: "gallons strictly greater than card.per_txn_gallon_limit."
  - id: ERR_DRIVER_DOUBLE_BOOKED
    http: 409
    condition: "New assignment's half-open interval overlaps another ACTIVE assignment of the same driver."
  - id: ERR_MAINTENANCE_OVERLAP
    http: 409
    condition: "CRITICAL fault window (plus buffer) collides with another non-CLEARED fault window on the same vehicle."
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "effective_from >= effective_to, or maintenance_window_start >= maintenance_window_end."
  - id: ERR_MISSING_MAINTENANCE_WINDOW
    http: 422
    condition: "CRITICAL fault reported without both maintenance window bounds."
  - id: ERR_DAILY_LIMIT_EXCEEDED
    http: 402
    condition: "Same-day held+settled spend plus this charge exceeds the card's daily_dollar_limit_cents."
  - id: ERR_CREDIT_EXCEEDED
    http: 402
    condition: "Charge exceeds the account's available_credit_cents."
  - id: ERR_PERIOD_NOT_SETTLED
    http: 409
    condition: "IFTA file attempted while some in-period transactions are not SETTLED."
  - id: ERR_STALE_CARD_VERSION
    http: 412
    condition: "expected_card_version does not match the card's current version (OCC)."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "Platform operator: fleet accounts, IFTA reporting, GL export, and the logical clock."
    identity: opaque
    exclusive_operations:
      - "POST /fleet-accounts"
      - "POST /ifta-reports"
      - "POST /ifta-reports/{id}/file"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /fleet-accounts/{id}"
      - "GET /fleet-accounts/{id}/summary"
      - "GET (read) across vehicles, drivers, fuel-cards, card-assignments, transactions, fraud-alerts, telematics-faults, ifta-reports"
  - name: FleetManager
    description: "Owns one fleet account's vehicles, drivers, cards, and assignments."
    identity: "entity_backed:FleetAccount"
    exclusive_operations:
      - "POST /vehicles"
      - "POST /vehicles/{id}/retire"
      - "POST /drivers"
      - "POST /fuel-cards"
      - "POST /fuel-cards/{id}/activate"
      - "POST /fuel-cards/{id}/suspend"
      - "POST /fuel-cards/{id}/cancel"
      - "POST /card-assignments"
      - "POST /card-assignments/{id}/end"
    shared_operations:
      - "GET reads on owned vehicles, drivers, fuel-cards, card-assignments, transactions, fraud-alerts, telematics-faults, ifta-reports, fleet summary"
  - name: Merchant
    description: "Fuel network POS/terminal: authorizes and settles purchases."
    identity: opaque
    exclusive_operations:
      - "POST /transactions/authorize"
      - "POST /transactions/{id}/capture"
      - "POST /transactions/{id}/settle"
      - "POST /transactions/{id}/void"
    shared_operations:
      - "GET /transactions/{id}"
      - "GET /transactions"
  - name: FraudAnalyst
    description: "Works the fraud alert queue."
    identity: opaque
    exclusive_operations:
      - "POST /fraud-alerts/{id}/investigate"
      - "POST /fraud-alerts/{id}/confirm"
      - "POST /fraud-alerts/{id}/dismiss"
      - "POST /fraud-alerts/{id}/reopen"
    shared_operations:
      - "GET /fraud-alerts/{id}"
      - "GET /fraud-alerts"
  - name: TelematicsGateway
    description: "Vehicle telemetry ingest: reports faults and maintenance progress."
    identity: opaque
    exclusive_operations:
      - "POST /telematics-faults"
      - "POST /telematics-faults/{id}/complete-maintenance"
      - "POST /telematics-faults/{id}/clear"
    shared_operations:
      - "GET /telematics-faults/{id}"
      - "GET /telematics-faults"
