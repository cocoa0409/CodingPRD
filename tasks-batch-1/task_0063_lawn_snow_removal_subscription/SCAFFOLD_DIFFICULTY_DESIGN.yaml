scaffold_difficulty_design:

  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_finalized_vs_provisional_diverges_on_contract
        grounds:
          - calculations.final_season_invoice
          - entities.ServiceContract.fields.accrued_balance_cents
          - entities.SeasonInvoice.fields.total_due_cents
          - state_machines.ServiceContract.ACTIVE_to_CLOSED
        distinguishing_aspect: "On a ServiceContract, the provisional accrued_balance_cents (33500, no tax/deposit) and the finalized SeasonInvoice.total_due_cents (30845, tax-and-deposit applied) are different numbers from identical visit data."
        test_recipe:
          setup:
            - "Customer + property + ACTIVE contract (price 30000, term 3, deposit 5000); one route with a stop, a crew, and IDLE equipment; one SNOW visit (depth 4.0) and one FERTILIZATION visit both COMPLETED; no skips."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dv1@x.com", full_name: "DV One", service_zip: "10001" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "1 A St", lawn_area_sqft: 5000, zip: "10001" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /preferences"
              payload: { property_id: "${prop_id}", grass_height_mm: 40, fertilization_enabled: false }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 30000, term_months: 3, prepaid_deposit_cents: 5000 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "10001", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30, travel_minutes: 10 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew A", home_route_id: "${route_id}" }
              as: DispatchManager
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-DV1", equipment_type: "PLOW", age_months: 12, assigned_route_id: "${route_id}" }
              as: DispatchManager
              captures: { eq_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "SNOW", snow_depth_in: 4.0, runtime_hours: 2 }
              as: DispatchManager
              captures: { snow_visit_id: $.data.id }
            - call: "POST /visits/${snow_visit_id}/dispatch"
              payload: {}
              as: DispatchManager
            - call: "POST /visits/${snow_visit_id}/complete"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "FERTILIZATION", runtime_hours: 1 }
              as: DispatchManager
              captures: { fert_visit_id: $.data.id }
            - call: "POST /visits/${fert_visit_id}/dispatch"
              payload: {}
              as: DispatchManager
            - call: "POST /visits/${fert_visit_id}/complete"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /contracts/${con_id}/close-season"
              payload: {}
              as: DispatchManager
              captures: { final_status: $.data.status }
            - call: "GET /contracts/${con_id}/invoices"
              payload: {}
              as: DispatchManager
              captures: { inv0_total: $.data.0.total_due_cents }
          assert:
            - "ServiceContract.${con_id}.accrued_balance_cents == 33500"
            - "SeasonInvoice for ${con_id} has subtotal_cents == 33500"
            - "SeasonInvoice for ${con_id} has tax_cents == 2345"
            - "SeasonInvoice for ${con_id} has total_due_cents == 30845"
            - "ServiceContract.${con_id}.status == CLOSED"

      - name: equipment_wear_estimated_vs_actual_diverges
        grounds:
          - calculations.equipment_wear_score
          - entities.Equipment.fields.wear_score
          - state_machines.ServiceVisit.DISPATCHED_to_COMPLETED
        distinguishing_aspect: "On an Equipment, the actual persisted wear_score (57, post one completed visit) differs from the estimated wear (82) which forecasts an in-flight DISPATCHED visit's +10 runtime hours and +1 dispatch — different entity domain than the invoice calc."
        test_recipe:
          setup:
            - "Equipment age 24, one COMPLETED visit of 20 runtime hours (actual wear 57), then a second visit DISPATCHED with projected runtime 10 (not yet completed)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "dv2@x.com", full_name: "DV Two", service_zip: "20002" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "2 B St", lawn_area_sqft: 4000, zip: "20002" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 20000, term_months: 4 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "20002", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew B", home_route_id: "${route_id}" }
              as: DispatchManager
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-DV2", equipment_type: "MOWER", age_months: 24, assigned_route_id: "${route_id}" }
              as: DispatchManager
              captures: { eq_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "LAWN", runtime_hours: 20 }
              as: DispatchManager
              captures: { v1_id: $.data.id }
            - call: "POST /visits/${v1_id}/dispatch"
              payload: {}
              as: DispatchManager
            - call: "POST /visits/${v1_id}/complete"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "LAWN", runtime_hours: 10 }
              as: DispatchManager
              captures: { v2_id: $.data.id }
            - call: "POST /visits/${v2_id}/dispatch"
              payload: {}
              as: DispatchManager
          trigger:
            - call: "GET /equipment/${eq_id}/wear-estimate"
              payload: {}
              as: DispatchManager
              captures: { est: $.data.estimated_wear_score, act: $.data.actual_wear_score }
          assert:
            - "wear-estimate response actual_wear_score == 57"
            - "wear-estimate response estimated_wear_score == 82"
            - "Equipment.${eq_id}.wear_score == 57"

  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: route_load_overtime_tier_nonlinear
        grounds:
          - calculations.route_dispatch_load
          - state_machines.ServiceRoute.OPEN_to_DISPATCHED
          - entities.ServiceRoute.fields.last_dispatch_load_minutes
        distinguishing_aspect: "Mode (a): route_dispatch_load has ≥3 inputs (base minutes, snow-depth tier multiplier, travel) with nested branching and a tiered overtime breakpoint — raw 600 over capacity 480 yields load 660, not a linear sum."
        test_recipe:
          setup:
            - "Route capacity 480 with one active non-opted-out stop base 300 travel 0; an unprocessed weather reading depth 5.0 (>=4.0 tier, 2.0x). raw = 600 > 480."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cf1@x.com", full_name: "CF One", service_zip: "30003" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "3 C St", lawn_area_sqft: 9000, zip: "30003" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 50000, term_months: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "30003", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 300, travel_minutes: 0 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew C", home_route_id: "${route_id}" }
              as: DispatchManager
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-CF1", equipment_type: "PLOW", age_months: 6, assigned_route_id: "${route_id}" }
              as: DispatchManager
            - call: "POST /weather-readings"
              payload: { region_zip: "30003", snow_depth_in: 5.0, observed_at: "2026-01-10T06:00:00Z" }
              as: DispatchManager
              captures: { wr_id: $.data.id }
          trigger:
            - call: "POST /weather-readings/${wr_id}/process"
              payload: { route_id: "${route_id}" }
              as: DispatchManager
              captures: { load: $.data.last_dispatch_load_minutes, rstatus: $.data.status }
          assert:
            - "ServiceRoute.${route_id}.last_dispatch_load_minutes == 660"
            - "ServiceRoute.${route_id}.status == DISPATCHED"
            - "WeatherReading.${wr_id}.processed == true"

      - name: lawn_skip_credit_round_per_day_before_multiply
        grounds:
          - calculations.skip_credit
          - state_machines.SkipRequest.PENDING_to_APPROVED
          - entities.SkipRequest.fields.credit_cents
        distinguishing_aspect: "Mode (b): LAWN skip proration pins round-per-day-then-multiply (rhu(40000/5/30)=267, ×3 = 801) which differs from sum-then-round (rhu(40000/5/30*3)=800); the scaffold fixes the per-day order."
        test_recipe:
          setup:
            - "ACTIVE contract price 40000 term 5; one SCHEDULED LAWN visit; a PENDING SkipRequest on it."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "cf2@x.com", full_name: "CF Two", service_zip: "40004" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "4 D St", lawn_area_sqft: 3000, zip: "40004" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "SUMMER", contract_price_cents: 40000, term_months: 5 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "40004", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "LAWN", runtime_hours: 1 }
              as: DispatchManager
              captures: { v_id: $.data.id }
            - call: "POST /skip-requests"
              payload: { visit_id: "${v_id}", reason: "vacation" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { skip_id: $.data.id }
          trigger:
            - call: "POST /skip-requests/${skip_id}/approve"
              payload: {}
              as: DispatchManager
              captures: { credit: $.data.credit_cents, sstatus: $.data.status }
          assert:
            - "SkipRequest.${skip_id}.credit_cents == 801"
            - "SkipRequest.${skip_id}.status == APPROVED"
            - "ServiceVisit.${v_id}.status == SKIPPED"
            - "Customer.${cust_id}.wallet_credit_cents == 801"

  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_suspend_reactivate_cycle
        grounds:
          - state_machines.ServiceContract.ACTIVE_to_SUSPENDED
          - state_machines.ServiceContract.SUSPENDED_to_ACTIVE
          - entities.RouteStop.fields.active
        distinguishing_aspect: "ServiceContract has a cycle ACTIVE→SUSPENDED→ACTIVE; the SUSPENDED→ACTIVE revert re-flips its RouteStops' active back to true, distinct from any linear pipeline."
        test_recipe:
          setup:
            - "ACTIVE contract with one RouteStop (active true) for its property."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "nl1@x.com", full_name: "NL One", service_zip: "50005" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "5 E St", lawn_area_sqft: 2000, zip: "50005" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 10000, term_months: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "50005", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
          trigger:
            - call: "POST /contracts/${con_id}/suspend"
              payload: {}
              as: DispatchManager
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { final_status: $.data.status }
          assert:
            - "ServiceContract.${con_id}.status == ACTIVE"
            - "RouteStop.${stop_id}.active == true"

      - name: visit_branch_scheduled_to_skipped_vs_dispatched
        grounds:
          - state_machines.ServiceVisit.SCHEDULED_to_DISPATCHED
          - state_machines.ServiceVisit.SCHEDULED_to_SKIPPED
          - state_machines.ServiceVisit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: "ServiceVisit branches from SCHEDULED to {DISPATCHED, SKIPPED, CANCELLED} with divergent side-effect sets (DISPATCHED assigns equipment & flips crew; SKIPPED grants a credit); a different entity than ServiceContract's cycle."
        test_recipe:
          setup:
            - "Two SCHEDULED SNOW visits on the same ACTIVE contract; one gets a PENDING skip approved (->SKIPPED, credit), the other dispatched (->DISPATCHED, equipment assigned)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "nl2@x.com", full_name: "NL Two", service_zip: "60006" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "6 F St", lawn_area_sqft: 2500, zip: "60006" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "WINTER", contract_price_cents: 30000, term_months: 3 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "60006", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew F", home_route_id: "${route_id}" }
              as: DispatchManager
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-NL2", equipment_type: "PLOW", age_months: 3, assigned_route_id: "${route_id}" }
              as: DispatchManager
              captures: { eq_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "SNOW", snow_depth_in: 3.0, runtime_hours: 2 }
              as: DispatchManager
              captures: { skip_visit_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "SNOW", snow_depth_in: 3.0, runtime_hours: 2 }
              as: DispatchManager
              captures: { disp_visit_id: $.data.id }
            - call: "POST /skip-requests"
              payload: { visit_id: "${skip_visit_id}", reason: "away" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { skip_id: $.data.id }
          trigger:
            - call: "POST /skip-requests/${skip_id}/approve"
              payload: {}
              as: DispatchManager
            - call: "POST /visits/${disp_visit_id}/dispatch"
              payload: {}
              as: DispatchManager
              captures: { disp_status: $.data.status, disp_eq: $.data.equipment_id }
          assert:
            - "ServiceVisit.${skip_visit_id}.status == SKIPPED"
            - "ServiceVisit.${disp_visit_id}.status == DISPATCHED"
            - "ServiceVisit.${disp_visit_id}.equipment_id == ${eq_id}"
            - "Equipment.${eq_id}.status == IN_SERVICE"
            - "Customer.${cust_id}.wallet_credit_cents == 1500"

  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: complete_visit_cascades_to_equipment_maintenance_due
        grounds:
          - state_machines.ServiceVisit.DISPATCHED_to_COMPLETED
          - calculations.equipment_wear_score
          - entities.Equipment.fields.status
          - entities.Equipment.fields.wear_score
        distinguishing_aspect: "Depth-3 cascade: complete visit (A) → Equipment cumulative_runtime/dispatch incremented and wear recomputed to >=100 (B) → that recompute itself flips Equipment.status to MAINTENANCE_DUE (C); each hop caused by the prior."
        test_recipe:
          setup:
            - "ACTIVE contract; equipment age 24 on the route; a DISPATCHED LAWN visit with runtime_hours 44 (post-complete wear = 105 >= 100)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "tc1@x.com", full_name: "TC One", service_zip: "70007" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "7 G St", lawn_area_sqft: 5000, zip: "70007" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "SUMMER", contract_price_cents: 20000, term_months: 4 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { con_id: $.data.id }
            - call: "POST /contracts/${con_id}/activate"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /routes"
              payload: { region_zip: "70007", daily_capacity_minutes: 480 }
              as: DispatchManager
              captures: { route_id: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_id}", property_id: "${prop_id}", sequence: 1, base_service_minutes: 30 }
              as: DispatchManager
              captures: { stop_id: $.data.id }
            - call: "POST /crews"
              payload: { name: "Crew G", home_route_id: "${route_id}" }
              as: DispatchManager
              captures: { crew_id: $.data.id }
            - call: "POST /equipment"
              payload: { asset_tag: "EQ-TC1", equipment_type: "MOWER", age_months: 24, assigned_route_id: "${route_id}" }
              as: DispatchManager
              captures: { eq_id: $.data.id }
            - call: "POST /visits"
              payload: { contract_id: "${con_id}", route_stop_id: "${stop_id}", service_type: "LAWN", runtime_hours: 44 }
              as: DispatchManager
              captures: { v_id: $.data.id }
            - call: "POST /visits/${v_id}/dispatch"
              payload: {}
              as: DispatchManager
          trigger:
            - call: "POST /visits/${v_id}/complete"
              payload: {}
              as: CrewLead
              as_user_id: "${crew_id}"
              captures: { vstatus: $.data.status }
          assert:
            - "ServiceVisit.${v_id}.status == COMPLETED"
            - "Equipment.${eq_id}.cumulative_runtime_hours == 44"
            - "Equipment.${eq_id}.wear_score == 105"
            - "Equipment.${eq_id}.status == MAINTENANCE_DUE"

      - name: close_season_cascades_to_invoice_then_wallet_debit
        grounds:
          - state_machines.ServiceContract.ACTIVE_to_CLOSED
          - calculations.final_season_invoice
          - entities.SeasonInvoice.fields.total_due_cents
          - entities.Customer.fields.wallet_credit_cents
        distinguishing_aspect: "Depth-3 cascade from a different trigger (close-season): close (A) → SeasonInvoice synthesized with finalized billing (B) → invoice debits Customer.wallet_credit_cents (C); wallet 801→0 after a single LAWN skip credit is consumed."
        test_recipe:
          setup:
            - "ACTIVE contract price 40000 term 5; one LAWN visit SKIPPED via approved skip (wallet credit 801); no completed visits."
          setup_api_calls:
            - call: "POST /customers"
              payload: { email: "tc2@x.com", full_name: "TC Two", service_zip: "80008" }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /properties"
              payload: { customer_id: "${cust_id}", address: "8 H St", lawn_area_sqft: 3000, zip: "80008" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /contracts"
              payload: { customer_id: "${cust_id}", property_id: "${prop_id}", season: "SUMMER", contract_price_cents: 40000, term_months: 5 }
              as: Customer
              as_user_id: "${cust_id}"
