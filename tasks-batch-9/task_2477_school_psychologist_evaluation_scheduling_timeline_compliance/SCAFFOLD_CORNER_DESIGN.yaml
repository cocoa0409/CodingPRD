          - state_machines.ProtocolOrder.SUBMITTED_to_CANCELLED
          - errors.ERR_ORDER_STATE_INVALID
        distinguishing_aspect: "The decision endpoint is conditional on the order having landed in SUBMITTED: it CANCELs a 30-unit manual-review order (no stock movement, decided_by recorded) but is refused on an auto-APPROVED 10-unit order — and a CANCELLED order can no longer be received."
