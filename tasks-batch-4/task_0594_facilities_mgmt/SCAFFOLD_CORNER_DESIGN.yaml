              captures: { a1: $.data.id }
            - call: "POST /fm/assets/${a1}/report-failure"
              payload: {}
              as: FacilityManager
          trigger:
            - call: "POST /fm/assets/${a1}/report-failure"
              payload: {}
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_ASSET_NOT_IN_SERVICE"
            - "Asset.${a1}.failure_count == 1 and condition_score == 88.00"

      - name: work_order_funded_by_unapproved_project_rejected
        claim_type: Cross-entity validation
        grounds:
          - "validations[priority=52]"
          - "errors[ERR_PROJECT_NOT_FUNDABLE]"
        distinguishing_aspect: "funding_project_id must point at an APPROVED or IN_FLIGHT project: a PROPOSED project yields 409 ERR_PROJECT_NOT_FUNDABLE and its committed_amount stays 0."
        test_recipe:
          setup: ["A PROPOSED (not yet approved) capital project."]
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/capital-projects"
              payload: { building_id: "${b1}", title: "Lobby refit", base_cost: 1000.00 }
              as: FacilityManager
              as_user_id: "fm-1"
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 2, estimated_parts_cost: 0, funding_project_id: "${p1}" }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${err_id} == ERR_PROJECT_NOT_FUNDABLE"
            - "CapitalProject.${p1}.status == PROPOSED, committed_amount == 0, remaining_amount == 1100.00"

      - name: work_order_exceeding_project_remaining_budget_rejected
        claim_type: Aggregate validation
        grounds:
          - "validations[priority=80]"
          - "errors[ERR_PROJECT_BUDGET_EXCEEDED]"
          - entities.CapitalProject.fields.remaining_amount
        distinguishing_aspect: "Individually valid orders become invalid collectively: with budget 1100.00 and 800.00 already committed by a first order, a second 800.00 order is rejected with 402 ERR_PROJECT_BUDGET_EXCEEDED (remaining 300.00 < 800.00)."
        test_recipe:
          setup:
            - "APPROVED project with budget_amount 1100.00; one funded P3 order of 10 estimated hours (10 * 80.00 = 800.00) already committed."
          setup_api_calls:
            - call: "POST /fm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /fm/buildings"
              payload: { name: "Tower One", code: "BLD-1", gross_area_sqm: 1000 }
              as: FacilityManager
              captures: { b1: $.data.id }
            - call: "POST /fm/capital-projects"
              payload: { building_id: "${b1}", title: "Lobby refit", base_cost: 1000.00 }
              as: FinanceController
              as_user_id: "fc-1"
              captures: { p1: $.data.id }
            - call: "POST /fm/capital-projects/${p1}/approve"
              payload: { decision: "APPROVE" }
              as: FinanceController
              as_user_id: "fc-2"
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 10, estimated_parts_cost: 0, funding_project_id: "${p1}" }
              as: FacilityManager
              captures: { wo1: $.data.id }
          trigger:
            - call: "POST /fm/work-orders"
              payload: { building_id: "${b1}", wo_type: "CORRECTIVE", priority: "P3", estimated_labor_hours: 10, estimated_parts_cost: 0, funding_project_id: "${p1}" }
              as: FacilityManager
              captures: { err_id: $.data.error_id }
          assert:
            - "WorkOrder.${wo1}.estimated_amount == 800.00 and CapitalProject.${p1}.remaining_amount == 300.00"
            - "HTTP status is 402 and ${err_id} == ERR_PROJECT_BUDGET_EXCEEDED"
            - "CapitalProject.${p1}.committed_amount == 800.00 (unchanged by the rejected order) and status == IN_FLIGHT"

