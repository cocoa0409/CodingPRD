  - rule_id: combinatorial_formula
    instances:
      - name: fuel_passthrough_nested_cap_then_floor
        grounds:
          - calculations.renegotiated_annual_subsidy
          - calculations.renegotiated_annual_subsidy.constants.FUEL_PASSTHROUGH_RATE
          - calculations.renegotiated_annual_subsidy.constants.MAX_ANNUAL_INCREASE_PCT
          - calculations.renegotiated_annual_subsidy.constants.MAX_ANNUAL_DECREASE_PCT
          - entities.RateRenegotiation.fields.ceiling_annual_subsidy_usd
        composition_mode: "nested function application — min() of a passthrough product against a +15 percent cap, then max() of that result against a -5 percent floor, over a four-factor product"
        distinguishing_aspect: |
          Composition mode (a): the outer arithmetic is a nested min/max clamp pair, not a rounding
          order and not a conditional tier. Only this instance exercises both arms of the nest from
          the same agreement — a rising index leaves the inner value untouched at 71285.76 while a
          collapsing index is clipped by the -5 percent floor from -142571.52 to -80000.00.
        test_recipe:
          setup:
            - "Community HYS ELIGIBLE; ACTIVE agreement at annual_subsidy_usd 1600000.00, 12 min weekly round trips, term 24."
            - "annual_block_hours 1872.0 and baseline_fuel_index_usd 2.4000 taken from the 2026-08 FuelIndex."
            - "FuelIndex 2027-02 at 3.1000 and 2027-03 at 1.0000 published."
            - "Logical clock advanced to 2027-02-01T00:00:00Z, past the 180-day cooling-off point 2027-01-28T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eas/communities"
              payload: { code: "HYS", name: "Hays", state_code: "KS", driving_miles_to_nearest_hub: 165.0, enplanements_prior_year: 6200, min_required_weekly_round_trips: 12, min_required_weekly_seats: 400 }
              as: ProgramAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /eas/communities/${comm_id}/eligibility-determinations"
              payload: { waiver_requested: false }
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /eas/aircraft-types"
              payload: { code: "B190", name: "Beechcraft 1900D", seats: 19, is_jet: false, fuel_burn_gal_per_hour: 68.0, hourly_operating_cost_usd: 1450.00 }
              as: ProgramAdmin
              captures: { ac_b190_id: $.data.id }
            - call: "POST /eas/carriers"
              payload: { name: "Prairie Air", certificate_number: "CERT-1001" }
              as: ProgramAdmin
              captures: { car1_id: $.data.id }
            - call: "POST /eas/fuel-indices"
              payload: { index_month: "2026-08", price_per_gallon_usd: 2.4000 }
              as: ProgramAdmin
            - call: "POST /eas/fuel-indices"
              payload: { index_month: "2027-02", price_per_gallon_usd: 3.1000 }
              as: ProgramAdmin
            - call: "POST /eas/fuel-indices"
              payload: { index_month: "2027-03", price_per_gallon_usd: 1.0000 }
              as: ProgramAdmin
            - call: "POST /eas/solicitations"
              payload: { community_id: "${comm_id}", closes_at: "2026-08-20T00:00:00Z" }
              as: ProgramAdmin
              captures: { sol_id: $.data.id }
            - call: "POST /eas/proposals"
              payload: { solicitation_id: "${sol_id}", carrier_id: "${car1_id}", aircraft_type_id: "${ac_b190_id}", service_level: "ESSENTIAL_MINIMUM", weekly_round_trips: 12, seats_per_departure: 19, annual_subsidy_request_usd: 1600000.00, term_months: 24, payment_basis: "COMPLETED_FLIGHT_PRORATION" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /eas/proposals/${p1_id}/actions"
              payload: { action: "SUBMIT" }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/solicitations/${sol_id}/actions"
              payload: { action: "CLOSE" }
              as: ProgramAdmin
            - call: "POST /eas/solicitations/${sol_id}/selection-order"
              payload: { order_note: "award to sole candidate" }
              as: SelectionOfficer
              as_user_id: "officer-1"
              captures: { agr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /eas/rate-renegotiations"
              payload: { agreement_id: "${agr_id}", trigger_type: "FUEL_INDEX", fuel_index_month: "2027-02", requested_annual_subsidy_usd: 1750000.00, justification: "jet-A index rose to 3.1000" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { rn_up_id: $.data.id }
            - call: "POST /eas/rate-renegotiations/${rn_up_id}/actions"
              payload: { action: "WITHDRAW", action_note: "refiling on the March index" }
              as: Carrier
              as_user_id: "${car1_id}"
            - call: "POST /eas/rate-renegotiations"
              payload: { agreement_id: "${agr_id}", trigger_type: "FUEL_INDEX", fuel_index_month: "2027-03", requested_annual_subsidy_usd: 1560000.00, justification: "index collapsed to 1.0000" }
              as: Carrier
              as_user_id: "${car1_id}"
              captures: { rn_down_id: $.data.id }
          assert:
            - "ServiceAgreement.${agr_id}.annual_block_hours == 1872.0"
            - "ServiceAgreement.${agr_id}.baseline_fuel_index_usd == 2.4000"
            - "RateRenegotiation.${rn_up_id}.current_fuel_index_usd == 3.1000"
            - "RateRenegotiation.${rn_up_id}.fuel_cost_delta_usd == 89107.20"
            - "RateRenegotiation.${rn_up_id}.justified_delta_usd == 71285.76"
            - "RateRenegotiation.${rn_up_id}.ceiling_annual_subsidy_usd == 1671285.76"
            - "RateRenegotiation.${rn_down_id}.current_fuel_index_usd == 1.0000"
            - "RateRenegotiation.${rn_down_id}.fuel_cost_delta_usd == -178214.40"
            - "RateRenegotiation.${rn_down_id}.justified_delta_usd == -142571.52"
            - "RateRenegotiation.${rn_down_id}.ceiling_annual_subsidy_usd == 1520000.00"
            - "The +15 percent cap 240000.00 is never binding here, so a flat min() without the floor would wrongly return 1457428.48 on the second filing."

      - name: per_departure_rate_rounded_before_multiplication
        grounds:
          - calculations.subsidy_payment_amount
          - calculations.subsidy_payment_amount.precision
          - entities.SubsidyPayment.fields.per_departure_rate_usd
          - entities.SubsidyPayment.fields.gross_subsidy_usd
        composition_mode: "pinned rounding order — the per-departure rate is quantized to cents before it is multiplied by the credited departure count, instead of quantizing the product"
        distinguishing_aspect: |
          Composition mode (b): the operands and the shape of the expression are agreed, only the
          position of the rounding step is at stake. With 97 scheduled and 94 credited departures the
          pinned order yields gross_subsidy_usd 129209.58 while quantizing the product instead yields
          129209.62 — a 0.04 gap no other instance can produce.
