      - name: waiving_the_last_outcome_goal_empties_the_input_set_and_substitutes_sixty
        grounds:
          - calculations.outcome_attainment_index
          - calculations.account_health_score
          - state_machines.OutcomeGoal.DEFINED_to_WAIVED
        distinguishing_aspect: |
          A structurally different boundary from the three numeric thresholds
          above: the EMPTY-COLLECTION edge. Waiving the only OutcomeGoal removes
          both its numerator contribution and its weight_bp from the denominator,
          so outcome_attainment_index falls back to OUTCOME_EMPTY_SUBSTITUTE
          60.00 rather than 0.00, and the snapshot score rises from 62.35 to 73.85.
        test_recipe:
          setup:
            - "ENTERPRISE Account with the three usage rows (adoption snapshot term 86.00, trended 67.00), no sponsors and no tickets."
            - "Exactly one OutcomeGoal: weight_bp 10000, target_value 100, actual_value 14, so outcome_attainment_index is 14.00."
