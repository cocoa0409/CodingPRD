      - name: effect_determination_fork_join_topology
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: project_action_fork_join_informal_branch_converges_and_locks
          rationale: >-
            The three-way fork out of SCREENING and the convergence of the
            informal and formal branches on CONSULTATION_CONCLUDED with divergent
            side-effect sets is exactly that §1.8 instance's subject; a §1.9
            restatement would assert the same transitions with weaker numbers.

      - name: information_request_cycle_with_tolling
        claim_type: idempotency
        excluded_because:
          difficulty_instance: consultation_info_request_cycle_tolls_deadline_twice_then_refuses
          rationale: >-
            The UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW cycle, the
            tolled_days accumulation and the MAX_INFO_REQUESTS cap that turns the
            third request into a 409 are covered end to end there, including the
            sub-day flooring that a breadth probe would not exercise.

      - name: funding_dimension_regresses_independently
        claim_type: valid_transition
        excluded_because:
          difficulty_instance: hcp_funding_dimension_regresses_while_plan_status_dimension_holds
          rationale: >-
            The FULLY_ASSURED -> PARTIALLY_ASSURED regression triggered by a new
            commitment while plan_status stands still is the whole point of that
            §1.8 instance; this section instead pins the initial states of both
            dimensions and the cross-dimension gate on funding-assurance posting.

      - name: permit_expiry_cascade_on_clock_advance
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: clock_advance_expiry_cascade_releases_commitments_without_bank_movement
          rationale: >-
            ACTIVE -> EXPIRED, the plan's move to CLOSED and the conditional
            cascade that releases SECURED commitments WITHOUT returning credits to
            the bank are asserted there with the full ledger arithmetic.

      - name: return_for_revision_compensation
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: bank_credit_ledger_identity_restored_by_return_for_revision
          rationale: >-
            The compensating branch (commitments RELEASED, credits_reserved
            returned to credits_available rather than to credits_transferred,
            endowment aggregates driven to 0 and funding_status back to UNFUNDED)
            is that §1.8 instance's subject.

      - name: report_rejection_compensation
        claim_type: side_effect_execution
        excluded_because:
          difficulty_instance: permit_take_ledger_identity_restored_by_report_rejection
          rationale: >-
            REJECT reversing the take ledger, freeing the reporting interval and
            unwinding the suspension cascade back to ACTIVE / IMPLEMENTING is
            covered there; this section asserts only the ACCEPT mirror image.

  # ==========================================================================
  # From Table 3 (Calculations)
  # ==========================================================================
  - section: calculations
    instances:

      - name: database_query_maps_all_three_detection_results_to_presumptions
        claim_type: correct_result
        grounds:
          - calculations.presence_status_derivation
          - entities.PresenceDetermination.fields.presence_status
        distinguishing_aspect: >-
          A desktop database query can never produce a confirmed status: DETECTED
          and INCONCLUSIVE both map to PRESUMED_PRESENT and NOT_DETECTED maps to
          PRESUMED_ABSENT. The two-into-one mapping is the trap — DETECTED must
          NOT shortcut to PRESENT just because the observation was positive.
        test_recipe:
          setup:
            - "SP-E registered; one proponent; one NON_FEDERAL action with footprint 200.00 acres; clock 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
