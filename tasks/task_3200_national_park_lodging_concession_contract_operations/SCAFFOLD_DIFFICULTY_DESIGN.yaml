      - name: hire_termination_cascades_voucher_void_and_bed_release_then_rehire
        grounds:
          - state_machines.SeasonalHire.HIRED_to_TERMINATED
          - state_machines.TransportVoucher.BOOKED_to_VOID
          - calculations.housing_bed_capacity
        distinguishing_aspect: |
          Depth-3 cascade: terminate hire -> voucher VOID (caused by the hire
          transition) -> bed released into the unit pool (caused by the hire
          leaving occupancy) -> a NEW hire can be created into the freed bed
          (an allocation that was previously rejected with ERR_HOUSING_FULL).
