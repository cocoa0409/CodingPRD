              payload: { standard_code: "EM.02.01.01", title: "Emergency operations plan", risk_tier: "INDIRECT_IMPACT" }
              as: AccreditationDirector
              captures: { s14_s1: $.data.id }
            - call: "POST /accreditation/standards/${s14_s1}/owner-assignments"
