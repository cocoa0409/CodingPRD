  - rule_id: cross_entity_state_dependency
    instances:
      - name: advance_to_underwriting_blocked_by_pending_owner_screening
        grounds:
          - validations[priority=28]
          - errors.ERR_OWNER_SCREENING_INCOMPLETE
          - state_machines.BeneficialOwner.PENDING_to_CLEARED
          - state_machines.MerchantApplication.IN_VERIFICATION_to_UNDERWRITING
        dependent_entities: [MerchantApplication, BeneficialOwner]
        distinguishing_aspect: |
          The application's own fields are all in order (verification PASSED, coverage 80.00 percent,
          mcc ALLOWED); the transition is gated purely by the state of a *different* entity - a
          second BeneficialOwner still sitting in PENDING. Screening that owner, with no change to
          the application itself, unblocks the identical request.
        test_recipe:
          setup:
            - "one application in IN_VERIFICATION with a PASSED business verification"
            - "owner A holding 50.00 percent already screened to CLEARED"
            - "owner B holding 30.00 percent still in PENDING (never screened)"
