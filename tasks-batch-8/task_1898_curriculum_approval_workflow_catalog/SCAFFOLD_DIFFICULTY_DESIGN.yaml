            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "201", proposed_title: "Intro II", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["more basics"], justification: "sequence", proposed_requisites: [{ requisite_course_id: "${course_c}", requisite_type: "PREREQUISITE" }] }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop_d: $.data.id } }
