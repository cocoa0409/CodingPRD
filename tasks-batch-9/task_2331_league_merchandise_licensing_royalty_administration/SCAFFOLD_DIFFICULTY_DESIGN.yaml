            - call: "POST /licensing/agreements/${agr_w3}/territory-grants"
              payload: { territory_code: "US", channel_class: "DEPARTMENT", effective_from: "2026-06-30", effective_to: "2026-12-31" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_w3}/territory-grants"
              payload: { territory_code: "US", channel_class: "ECOMMERCE", effective_from: "2026-06-30", effective_to: "2026-12-31" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { grant_w3: $.data.id }
          assert:
            - "call 1 returns 201: TerritoryGrant.${grant_w2}.status == GRANTED, effective_from == 2026-07-01, exclusivity_mode_snapshot == EXCLUSIVE"
            - "call 2 returns 409 with data.error_id == ERR_TERRITORY_EXCLUSIVITY_CONFLICT and creates no TerritoryGrant row"
            - "call 3 returns 201: TerritoryGrant.${grant_w3}.status == GRANTED with channel_class == ECOMMERCE over the very window rejected in call 2"
            - "GET /licensing/territory-grants?territory_code=US&status=GRANTED reports total_count == 3 (LIC_W1 DEPARTMENT, LIC_W2 DEPARTMENT, LIC_W3 ECOMMERCE)"

      - name: retailer_window_buffer_exactly_thirty_days_still_conflicts
        grounds:
          - validations.priority_38
          - validations.priority_38.constants.RETAILER_WINDOW_BUFFER_DAYS
          - errors.ERR_RETAILER_WINDOW_CONFLICT
          - entities.RetailerAuthorization.fields.authorized_from
        distinguishing_aspect: |
          The retailer window test is a CLOSED interval inflated by a 30-day buffer, so
          the two windows need not intersect at all to conflict. The incumbent ends
          2026-06-30; a request starting 2026-07-30 is exactly 30 days later and is
          REJECTED with ERR_RETAILER_WINDOW_CONFLICT, while a request starting
          2026-07-31 (31 days later) is ACCEPTED. Testing plain overlap accepts both;
          using a strict inequality on the buffer accepts the 30-day case.
        test_recipe:
          setup:
            - "clock at the mandatory default 2026-08-01T00:00:00Z"
            - "licensee LIC_X is ACTIVE"
            - "one AUTHORIZED DEPARTMENT authorization for retailer 'Harborview Dept' covering 2026-01-01..2026-06-30"
            - "the two trigger calls reuse one captured licensee version because the rejected call leaves Licensee.version unchanged"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/product-categories"
              payload: { category_code: "JERSEY", display_name: "Authentic Jerseys", base_royalty_rate_bps: 1200, tier_schedule: [{ from_cents: 0, to_cents: 2000000, rate_bps: 1200 }, { from_cents: 2000000, to_cents: 5000000, rate_bps: 1000 }, { from_cents: 5000000, to_cents: null, rate_bps: 800 }], closeout_rate_bps: 500, exclusivity_allowed: true, minimum_guarantee_floor_cents: 1000000, mark_usage_class: "LEAGUE_CLUB_AND_PLAYER", closeout_cap_pct_bps: 1500, closeout_hard_limit_bps: 4000, deduction_cap_pct_bps: 500, deduction_hard_limit_bps: 2000, advance_floor_bps_of_mg: 2500, central_licensing_default: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { cat_jersey: $.data.id }
            - call: "POST /licensing/licensees"
              payload: { legal_name: "Harborline Brands", contact_email: "ops@harborline.example", home_country_code: "US", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { lic_x: $.data.id }
            - call: "POST /licensing/licensees/${lic_x}/status"
              payload: { action: "ACTIVATE", vendor_compliance_certified: true }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "GET /licensing/licensees/${lic_x}"
              as: LeagueLicensingManager
              captures: { lic_x_v1: $.data.version }
            - call: "POST /licensing/licensees/${lic_x}/retailer-authorizations"
              payload: { retailer_name: "Harborview Dept", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-01-01", authorized_to: "2026-06-30", closeout_allowed: false, expected_licensee_version: "${lic_x_v1}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_x1: $.data.id }
            - call: "POST /licensing/retailer-authorizations/${auth_x1}/status"
              payload: { action: "APPROVE" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
          trigger:
            - call: "GET /licensing/licensees/${lic_x}"
              as: LeagueLicensingManager
              captures: { lic_x_v2: $.data.version }
            - call: "POST /licensing/licensees/${lic_x}/retailer-authorizations"
              payload: { retailer_name: "Harborview Dept", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-07-30", authorized_to: "2026-12-31", closeout_allowed: false, expected_licensee_version: "${lic_x_v2}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/licensees/${lic_x}/retailer-authorizations"
              payload: { retailer_name: "Harborview Dept", channel_class: "DEPARTMENT", sku_classes: ["JERSEY"], authorized_from: "2026-07-31", authorized_to: "2026-12-31", closeout_allowed: false, expected_licensee_version: "${lic_x_v2}" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { auth_x3: $.data.id }
          assert:
            - "the 2026-07-30 request returns 409 with data.error_id == ERR_RETAILER_WINDOW_CONFLICT and Licensee.${lic_x}.version is unchanged"
            - "the 2026-07-31 request returns 201: RetailerAuthorization.${auth_x3}.status == PENDING with authorized_from == 2026-07-31"
            - "GET /licensing/retailer-authorizations?licensee_id=${lic_x}&retailer_name=Harborview Dept reports total_count == 2"

      - name: off_price_aggregate_capacity_counts_only_overlapping_windows
        grounds:
          - validations.priority_36
          - validations.priority_36.constants.MAX_CONCURRENT_OFF_PRICE
          - errors.ERR_OFF_PRICE_CAPACITY_EXCEEDED
          - entities.RetailerAuthorization.fields.channel_class
        distinguishing_aspect: |
          Capacity is an AGGREGATE over overlapping windows, not a per-row check and not
          a global count. Two OFF_PRICE authorizations already overlap each other
          (2026-01-01..2026-06-30 and 2026-06-01..2026-12-31), which is legal at
          MAX_CONCURRENT_OFF_PRICE 2. A third window that touches BOTH
          (2026-06-15..2026-07-15) makes three concurrent and is rejected, yet a fourth
          window overlapping only the later one (2026-08-01..2026-12-31) is accepted —
          so the licensee ends up with three live OFF_PRICE authorizations. Counting
          rows rather than overlaps rejects the fourth call too; the 30-day buffer of
          priority 38 cannot explain either verdict because every retailer_name differs.
