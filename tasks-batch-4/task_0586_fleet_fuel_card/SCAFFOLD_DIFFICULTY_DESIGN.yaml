    instances:
      - name: driver_assignment_halfopen_overlap
        grounds:
          - validations[priority=12]
          - errors[ERR_DRIVER_DOUBLE_BOOKED]
          - entities.CardAssignment.fields.effective_from
          - entities.CardAssignment.fields.effective_to
        distinguishing_aspect: >
          Half-open [from,to) semantics on the Driver resource: a second assignment [06-05,06-15)
          overlapping the driver's [06-01,06-10) is rejected (ERR_DRIVER_DOUBLE_BOOKED), while an
          adjacent [06-10,06-20) touching the endpoint is allowed (touching endpoints do not
          overlap).
