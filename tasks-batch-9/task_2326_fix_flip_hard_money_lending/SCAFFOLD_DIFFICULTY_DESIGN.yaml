          setup:
            - "TIER_A sponsor b1; one property p1 (purchase 20,000,000 / ARV 32,000,000) in UNDER_CONTRACT"
            - "application aA: two APPROVED lines of 2,500,000 each (rehab 5,000,000), sized committed 22,442,141, decisioned APPROVE"
            - "application aB on the SAME property: three APPROVED lines 4,000,000 / 3,500,000 / 2,500,000 (rehab 10,000,000), sized committed 23,953,713, decisioned APPROVE"
