              as: WblCoordinator
            - call: "POST /wbl/learning-objectives"
              payload: { training_plan_id: "${tp_id}", competency_code: "MFG-2", description: "Read a first-article inspection report", aligned_course_code: "CTE-410", assessment_method: "PORTFOLIO" }
              as: WblCoordinator
            - call: "POST /wbl/learning-objectives"
              payload: { training_plan_id: "${tp_id}", competency_code: "MFG-3", description: "Apply lockout tagout before machine service", aligned_course_code: "CTE-410", assessment_method: "EXAM" }
              as: WblCoordinator
            - call: "POST /wbl/training-plans/${tp_id}/submit"
              payload: {}
              as: WblCoordinator
            - call: "POST /wbl/training-plans/${tp_id}/approve"
              payload: {}
              as: WblCoordinator
              as_user_id: "coord-approver-3"
            - call: "POST /wbl/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T08:00:00Z" }
              as: WblCoordinator
            - call: "POST /wbl/timesheet-entries"
              payload: { placement_id: "${pl_id}", work_date: "2026-09-08", start_time: "08:00", end_time: "11:20", break_minutes: 0, is_school_day: true }
              as: EmployerSupervisor
              as_user_id: "${sup_id}"
            - call: "POST /wbl/timesheet-entries"
              payload: { placement_id: "${pl_id}", work_date: "2026-09-09", start_time: "08:00", end_time: "11:20", break_minutes: 0, is_school_day: true }
              as: EmployerSupervisor
              as_user_id: "${sup_id}"
            - call: "POST /wbl/timesheet-entries"
              payload: { placement_id: "${pl_id}", work_date: "2026-09-10", start_time: "08:00", end_time: "11:20", break_minutes: 0, is_school_day: true }
              as: EmployerSupervisor
              as_user_id: "${sup_id}"
          trigger:
            - call: "GET /wbl/placements/${pl_id}/wage-preview"
              payload: {}
              as: WblCoordinator
          assert:
            - "response data.total_verified_hours == 9.99"
            - "response data.logged_entry_count == 3"
            - "response data.provisional_wage_cents == 12738"
            - "response data.final_wage_cents == 12737"
            - "response data.variance_cents == 1"
            - "Placement.${pl_id}.provisional_wage_cents == 12738"
            - "Placement.${pl_id}.final_wage_cents == 12737"
            - "Placement.${pl_id}.settled_wage_cents == 0 and Placement.${pl_id}.wage_settlement_mode == NONE"

