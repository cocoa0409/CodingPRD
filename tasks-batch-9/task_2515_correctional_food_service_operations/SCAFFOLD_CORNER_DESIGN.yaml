      - name: corner_second_verify_on_active_diet_order_rejected
        claim_type: idempotency
        grounds:
          - state_machines[DietOrder].transitions[PENDING_VERIFICATION -> ACTIVE]
          - validations[priority=17]
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Verification is not idempotent: replaying verify on an order already in ACTIVE returns ERR_INVALID_STATE at HTTP 409 and does not double-increment the two special-diet census counters."
