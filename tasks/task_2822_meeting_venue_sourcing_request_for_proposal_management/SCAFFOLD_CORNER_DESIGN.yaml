    - name: rfp_issue_without_any_shortlisted_entry_returns_no_shortlisted_venues
      claim_type: Precondition Enforcement
      grounds:
      - state_machines.Rfp.DRAFT_to_ISSUED
      - validations[priority=60]
      - errors[ERR_NO_SHORTLISTED_VENUES]
      - entities.Rfp.fields.invited_count
      distinguishing_aspect: 'The DRAFT -> ISSUED precondition is ''at least one entry in SHORTLISTED (or beyond)'': a CANDIDATE-only shortlist is not enough, so issue returns HTTP 422 ERR_NO_SHORTLISTED_VENUES with the Rfp left in DRAFT and no Proposal created - and the same call succeeds the moment the entry is promoted to SHORTLISTED.'
      test_recipe:
        setup:
        - Logical clock at 2026-08-05T09:00:00.000Z throughout.
