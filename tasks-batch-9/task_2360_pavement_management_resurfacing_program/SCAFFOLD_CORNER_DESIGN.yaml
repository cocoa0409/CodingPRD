      - name: higher_priority_state_error_wins_over_a_lower_priority_money_error
        claim_type: priority_ordering
        grounds: ["validations.ERR_PROJECT_NOT_BID_READY", "validations.ERR_SCENARIO_FUNDS_EXCEEDED"]
        distinguishing_aspect: "The award endpoint can violate a priority-50 state rule and a priority-76 funding rule in the same request; §1.8 already proves the priority-50 code is the one returned and that the money ledger is untouched."
        excluded_because:
          difficulty_instance: "award_state_error_precedes_funds_exceeded_error"
          rationale: "That §1.8 priority_pair_validation_conflict instance awards a COORDINATING project an amount that simultaneously exceeds the scenario's uncommitted balance, asserts ERR_PROJECT_NOT_BID_READY (409) rather than ERR_SCENARIO_FUNDS_EXCEEDED (422), and pins committed_cents / uncommitted_cents to literals afterwards. The corner claim 'two rules violated -> higher priority wins' is exactly that instance's thesis."


  # endpoints — action, listing, computed read, cross reference, idempotency
  - section: endpoints
    instances:
      - name: clock_endpoint_is_writable_by_any_role_and_moves_every_derived_read
        claim_type: action_endpoint
        grounds: ["endpoints.POST /pavement/_clock/set_current_utc", "calculations.model_projected_condition_index"]
        distinguishing_aspect: "The clock is the ONLY endpoint open to all six roles, and it is not decorative: a Resident may set it, and moving it from 2026-08-01 to 2027-08-01 changes an untouched segment's published condition_index from 76.0 (age 10) to 73.6 (age 11, three knee years) with no write to the segment row in between — GOOD to GOOD but 2.4 points lost purely to the calendar."
        test_recipe:
          setup:
            - "Empty database."
            - "The clock is first set to 2026-08-01T00:00:00Z by a Resident caller."
            - "Maple St is LOCAL, baseline_condition_index 92.0, last_treatment_date 2016-08-01 (age_years 10 at the first clock, 11 at the second)."
            - "No survey exists, so the segment's index stays MODEL_PROJECTED throughout."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: Resident
              as_user_id: "resident-1"
              captures: { t0: "$.data.current_utc" }
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
          trigger:
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { pci_2026: "$.data.condition_index", band_2026: "$.data.condition_band", src_2026: "$.data.condition_index_source", upd_2026: "$.data.updated_at", ver_2026: "$.data.version" }
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2027-08-01T00:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { t1: "$.data.current_utc" }
            - call: "GET /pavement/segments/${seg1}"
              payload: {}
              as: PavementEngineer
              captures: { pci_2027: "$.data.condition_index", band_2027: "$.data.condition_band", upd_2027: "$.data.updated_at", ver_2027: "$.data.version" }
          assert:
            - "Both clock calls return HTTP 200 and echo data.current_utc back verbatim ('2026-08-01T00:00:00Z' then '2027-08-01T00:00:00Z') — the Resident call is NOT 403."
            - "${pci_2026} == 76.0 with condition_band 'GOOD' and condition_index_source 'MODEL_PROJECTED'."
            - "${pci_2027} == 73.6 (92.0 - 1.4*11 - 1.0*3) with condition_band still 'GOOD'."
            - "${ver_2027} == ${ver_2026} == 1 and ${upd_2027} == ${upd_2026} — the derived read moved without mutating the row."
            - "GET /pavement/segments?condition_band=GOOD returns meta.total_count == 1 at both instants."

      - name: contractor_scorecard_is_a_computed_read_with_a_null_final_score
        claim_type: computed_read
        grounds: ["endpoints.GET /pavement/contractors/{id}/scorecard", "calculations.contractor_performance_score"]
        distinguishing_aspect: "The scorecard is a projection, not a stored row: a brand-new contractor reads interim_performance_score 100.0 from the empty-set defaults (quality 100.00 because passed+failed == 0) while final_performance_score is NULL because accepted_project_count == 0 — a zero would be indistinguishable from a catastrophic record, and the two variants are published side by side in one payload."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "One contractor, Ace Paving LLC, max_concurrent_projects 2, created moments ago."
            - "The contractor has no projects, no acceptance tests, no remediation events and no acceptances."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
