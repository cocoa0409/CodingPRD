              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { e2_err: $.data.error_id }
            - call: "POST /escort-assignments/${e3_id}/confirm"
              payload: {}
              as: Carrier
              as_user_id: "${carrier_id}"
              captures: { e3_status: $.data.status }
          assert:
            - "confirming E2 returns error_id == ERR_PILOT_CAR_DOUBLE_BOOKED"
            - "EscortAssignment.${e3_id}.status == CONFIRMED (adjacency at 12:00 allowed)"

      - name: structure_crossing_buffer_conflict
        grounds:
          - state_machines.RouteSegment.PLANNED_to_RESERVED
          - validations[priority=22]
        distinguishing_aspect: >-
          Structure crossings use a CLOSED interval plus a 30-minute clearance buffer:
