            - "CrewBase.${base}.line_qualified_pilot_count == 1, required_pilot_count == 2, headcount_shortfall == 1, pipeline_shortfall == 1, staffing_posture == SHORT, allocatable_aircraft_count == 1 (hop 2)"
            - "Aircraft.${ac2}.status == GROUNDED_STAFFING and Aircraft.${ac2}.grounded_reason == PILOT_SHORTFALL (hop 3 — newest tail by created_at DESC)"
            - "Aircraft.${ac1}.status == IN_SERVICE — exactly assigned_aircraft_count - allocatable_aircraft_count == 1 tail was grounded"
            - "CrewBase.${base}.assigned_aircraft_count == 2 — a GROUNDED_STAFFING tail is still allocated to the base, so the cascade does not re-enter"
