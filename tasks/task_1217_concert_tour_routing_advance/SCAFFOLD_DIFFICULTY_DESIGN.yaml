              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/hospitality/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr2: $.data.packet_revision }
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/hospitality/approve"
              payload: { expected_packet_revision: "${pr2}" }
              as: VenueRep
            - call: "POST /tours/${tour_id}/shows/${show_id}/advance-packet/sections/immigration/submit"
              payload: {}
              as: TourManager
            - call: "GET /tours/${tour_id}/shows/${show_id}/advance-packet"
              payload: {}
              as: TourManager
              captures: { pr3: $.data.packet_revision }
