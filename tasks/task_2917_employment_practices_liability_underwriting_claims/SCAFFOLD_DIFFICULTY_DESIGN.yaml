            - call: "POST /epli/defense-invoices/${inv_id}/approve"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-002"
          trigger:
            - call: "POST /epli/defense-invoices/${inv_id}/void"
              payload: { void_reason: "Duplicate billing discovered during quarterly panel reconciliation" }
              as: ClaimsManager
              as_user_id: "clm-001"
          assert:
            - "immediately before the void DefenseAssignment.${asg_id}.budget_spent_cents == 2957705 AND budget_remaining_cents == 42295, and the invariant holds: 3000000 == 2957705 + 42295"
            - "immediately before the void Claim.${c1_id}.defense_paid_cents == 2957705 AND Policy.${pol_id}.defense_spend_cents == 2957705 AND Policy.${pol_id}.aggregate_limit_remaining_cents == 197042295 AND limit_posture == ERODED"
            - "the trigger returns http_status 200 with DefenseInvoice.${inv_id}.status == VOIDED AND void_reason == 'Duplicate billing discovered during quarterly panel reconciliation'"
            - "after the void DefenseAssignment.${asg_id}.budget_spent_cents == 0 AND budget_remaining_cents == 3000000, so the invariant still holds exactly: 3000000 == 0 + 3000000"
            - "after the void Claim.${c1_id}.defense_paid_cents == 0 AND Policy.${pol_id}.defense_spend_cents == 0 AND Policy.${pol_id}.aggregate_limit_remaining_cents == 200000000"
            - "Policy.${pol_id}.limit_posture == OPEN — the retention-only 5000000 payment contributed insurer_portion_cents 0, so with the defense spend reversed nothing erodes the aggregate"
            - "DefenseInvoice.${inv_id}.allowed_amount_cents == 2957705 AND disallowed_amount_cents == 796295 AND rate_cap_excess_cents == 452500 AND block_reduction_cents == 142884 AND expense_disallowance_cents == 200911 — the audit result is preserved verbatim on the voided invoice"
            - "IndemnityPayment.${pay_id}.status == APPROVED AND retention_portion_cents == 5000000 AND insurer_portion_cents == 0 — the invoice void touches only the defense ledger"
            - "DefenseAssignment.${asg_id}.status == ACTIVE — the void frees budget without closing the matter"

      - name: assignment_close_conserves_panel_open_matter_count
        grounds:
          - state_machines.DefenseAssignment.ACTIVE_to_CLOSED
          - state_machines.DefenseAssignment.SUSPENDED_FUNDING_to_ACTIVE
          - entities.DefensePanelFirm.fields.open_matter_count
          - validations[priority=8]
          - errors.ERR_ASSIGNMENT_NOT_CLOSABLE
        distinguishing_aspect: |
          Conserved quantity: an INTEGER RESOURCE COUNT rather than money — the identity
          DefensePanelFirm.open_matter_count == count(DefenseAssignment WHERE
          panel_firm_id == this firm AND status IN {ACTIVE, SUSPENDED_FUNDING}). The
          count must be invariant across a policy suspension and reinstatement, which
          moves all three matters between ACTIVE and SUSPENDED_FUNDING without changing
          the tally, must decrement by exactly one per close, and must NOT decrement
          again when an already-CLOSED assignment is closed a second time — the failed
          close is the compensation check that no double-decrement occurs.
        test_recipe:
          setup:
            - "Chain P (CA T4 / TX T2, ACTIVE RatePlan, 'Northgate Retail Group', policy ACTIVE for [2026-08-01, 2027-08-01))."
            - "'Bellweather Rowe LLP' (REGIONAL, CA, 70000 / 43000 / 16000, capacity_open_matters 3) is on the panel."
            - "Three HARASSMENT / EMPLOYEE claims are accepted and each holds a CLIENT_DIRECTED assignment with Bellweather Rowe over the identical window [2026-08-01, 2026-11-01), which is legal because capacity_open_matters is 3."
            - "The UnderwritingManager suspends the policy and then reinstates it, exercising the funding cascade in both directions before any close."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "CA", name: "California", hazard_tier: "T4", admin_agency_name: "California Civil Rights Department", pre_suit_window_days: 180, wage_hour_multiplier: 1.60, class_action_propensity_pct: 42.00, pre_suit_mediation_required: true }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00, pre_suit_mediation_required: false }
              as: PlatformAdmin
