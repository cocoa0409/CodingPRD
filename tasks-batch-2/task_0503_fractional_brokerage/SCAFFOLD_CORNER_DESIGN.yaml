              payload: { compliance_hold: true }
              as: AccountHolder
              as_user_id: "${acc_rb}"
              captures: { err_rb: $.data.error_id }
          assert:
            - "Response status 403 and data.error_id == ERR_FORBIDDEN"

      - name: account_holder_cannot_act_on_other_account
        claim_type: peer_roles
        grounds: [roles.AccountHolder, "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "An AccountHolder (X-User-ID = own account) placing a deposit on a DIFFERENT account returns ERR_FORBIDDEN (403) — entity_backed ownership check."
        test_recipe:
          setup: ["Two CASH accounts A_OWN and A_OTHER."]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_email: "own@x.com", account_type: "CASH" }
