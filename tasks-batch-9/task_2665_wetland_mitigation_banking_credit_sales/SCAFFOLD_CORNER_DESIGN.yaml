        claim_type: constraint_propagation
        grounds:
          - calculations.stewardship_endowment_requirement.formula
        excluded_because:
          difficulty_instance: combinatorial_formula / stewardship_endowment_single_pass_not_fixed_point
          rationale: "The circular-looking admin-fee dependency and its pinned single-pass result 113680000 are the subject of the named §1.8 instance."

