      - name: purge_becomes_due_exactly_at_the_retention_instant_and_not_one_second_earlier
        claim_type: threshold
        grounds:
          - calculations.retention_purge_schedule
          - state_machines.CourseShell.provisioning_state.ARCHIVED_to_PURGED
          - validations[28]
          - errors[ERR_PURGE_NOT_DUE]
        distinguishing_aspect: "The purge gate is `clock >= retention_purge_at`, so the two probes are one second apart: 2027-12-11T23:59:58Z must fail with ERR_PURGE_NOT_DUE and 2027-12-11T23:59:59Z must succeed. A strictly-greater-than implementation rejects the second probe too, and an off-by-one-day implementation accepts the first."
        test_recipe:
          setup:
            - "Term 2026FA with term_end_at 2026-12-11T00:00:00Z, access_grace_days 0 and retention_class STANDARD, so student_access_end_at is 2026-12-11T23:59:59Z and retention_purge_at is 2027-12-11T23:59:59Z."
            - "Its single OFFICIAL shell holds one 250.00 MB FILE; the term is walked to CLOSED and the shell to ARCHIVED."
          setup_api_calls:
            - call: "POST /academic-terms"
              payload: { term_code: "2026FA", term_start_at: "2026-08-24T00:00:00Z", term_end_at: "2026-12-11T00:00:00Z", access_grace_days: 0, retention_class: "STANDARD" }
              as: Registrar
              captures: { term_id: $.data.id, purge_at: $.data.retention_purge_at }
            - call: "POST /people"
              payload: { sis_person_id: "F-6050", full_name: "Frances Spence", primary_affiliation: "FACULTY" }
              as: Registrar
              captures: { prof_id: $.data.id }
            - call: "POST /course-shells"
              payload: { term_id: "${term_id}", owner_person_id: "${prof_id}", sis_section_code: "HI210-01", shell_type: "OFFICIAL", base_seat_cap: 20 }
              as: LmsAdmin
              captures: { shell_id: $.data.id }
            - call: "POST /course-shells/${shell_id}/provisioning-decisions"
              payload: { decision: "APPROVE" }
              as: LmsAdmin
            - call: "POST /content-items"
              payload: { shell_id: "${shell_id}", item_type: "FILE", title: "archive bundle", storage_mb: 250.00 }
              as: Instructor
              as_user_id: "${prof_id}"
              captures: { item_id: $.data.id }
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "REGISTRATION_OPEN" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "IN_SESSION" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "FINALS" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "GRADING" }
              as: Registrar
            - call: "POST /academic-terms/${term_id}/lifecycle-transitions"
              payload: { target_state: "CLOSED" }
              as: Registrar
            - call: "POST /course-shells/${shell_id}/lifecycle-transitions"
              payload: { target_state: "ARCHIVED" }
              as: Registrar
              captures: { shell_state0: $.data.provisioning_state, mb_before: $.data.storage_mb }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-11T23:59:58Z" }
              as: LmsAdmin
            - call: "POST /course-shells/${shell_id}/lifecycle-transitions"
              payload: { target_state: "PURGED" }
              as: Registrar
              captures: { err_not_due: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-11T23:59:59Z" }
              as: LmsAdmin
            - call: "POST /course-shells/${shell_id}/lifecycle-transitions"
              payload: { target_state: "PURGED" }
              as: Registrar
              captures: { shell_state1: $.data.provisioning_state, mb_after: $.data.storage_mb, items_after: $.data.content_item_count, pts_after: $.data.total_points_possible }
            - call: "GET /content-items/${item_id}"
              payload: {}
              as: LmsAdmin
              captures: { item_copy_state: $.data.copy_state, item_mb: $.data.storage_mb }
          assert:
            - "${purge_at} == \"2027-12-11T23:59:59Z\" and ${shell_state0} == ARCHIVED with ${mb_before} == 250.00"
            - "${err_not_due} == ERR_PURGE_NOT_DUE at HTTP 409 one second before the horizon"
            - "${shell_state1} == PURGED at exactly the horizon — the comparison is inclusive"
            - "${mb_after} == 0.00, ${items_after} == 0 and ${pts_after} == 0.00"
            - "${item_copy_state} == SKIPPED with ${item_mb} == 0.00 — the purge reached the content rows, it did not merely relabel the shell"

