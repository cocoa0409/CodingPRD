      - name: shared_window_releases_only_terminated_engagement_share
        grounds:
          - invariants.INV_VOLUNTEER_HOUR_CONSERVATION
          - invariants.INV_CYCLE_SLOT_CONSERVATION
          - calculations.cycle_posture
        distinguishing_aspect: |
          Two live engagements of the SAME volunteer draw on the SAME AvailabilityWindow and the
          SAME cycle, so the conserved quantity has two consumers and the release must be a
          per-consumer subtraction, not a reset. Instances 1, 2 and 4 all have a single holder,
          which lets a wrong implementation zero the field and still pass; here zeroing fails.
          Arithmetic (window hours_offered 300.00, capacity_slot_total 10, VOLUNTEER_MAX_CONCURRENT 2):
            engagement A accepted -> window hours_committed 40.00, hours_remaining round(300.00-40.00,2) = 260.00
                                     cycle committed 1, reserved 0, available 9, utilization round(1/10,4) = 0.1000
            engagement B matched  -> committed 1 + reserved 1, available max(0, 10-1-1) = 8,
                                     utilization round(2/10,4) = 0.2000 -> OPEN (below RESTRICTED_FLOOR 0.8000)
            engagement B accepted -> window hours_committed round(40.00+40.00,2) = 80.00,
                                     hours_remaining round(300.00-80.00,2) = 220.00,
                                     cycle committed 2, reserved 0, available 8, utilization 0.2000
            terminate A only      -> window hours_committed round(80.00-40.00,2) = 40.00,
                                     hours_remaining round(300.00-40.00,2) = 260.00,
                                     cycle committed 1, reserved 0, available max(0, 10-1-0) = 9,
                                     utilization round(1/10,4) = 0.1000 -> OPEN
                                     and B is still NOT_STARTED with committed_hours 40.00
          The invariant's own predicate is what pins 40.00: hours_committed must equal
          round(sum(reserved_hours over OFFERED offers) + sum(committed_hours over engagements in
          {NOT_STARTED, IN_PROGRESS, SUBMITTED, ACCEPTED}), 2) = round(0.00 + 40.00, 2) = 40.00.
          Three naive answers are excluded: 0.00 / remaining 300.00 (the release was implemented
          as a reset of the window), 80.00 / remaining 220.00 (the terminated engagement was left
          in the live set, so nothing was released), and 0.00 caused by the CASCADE-B-style
          volunteer pause - terminating A with reason ADMIN gives points
          max(0.00, round(0.25 - 0.10*0, 4)) = 0.2500, reliability_score 0.2500 < 0.4000, so the
          volunteer moves to PAUSED, and a pause may withdraw OFFERED MatchOffer rows only. It
          must NOT touch engagement B, whose 40.00 hours and cycle slot stay committed even
          though its volunteer is now paused.
        test_recipe:
          setup:
            - "Cycle 2026-Q1 open with 10 slots; LARGE partner (max_concurrent_engagements 6); SENIOR volunteer at 150.00/h, vetted with LEGAL_CONTRACTS proficiency 4 verified."
            - "Exactly ONE HARD availability window [2026-01-05, 2026-03-01) offering 300.00 hours, so both engagements must be pinned to it."
            - "ProjectRequest A scoped at estimated_hours 40.00 x complexity_factor 1.00, matched, accepted, agreement executed, engagement A started (work_status IN_PROGRESS)."
            - "ProjectRequest B of the same partner scoped identically at estimated_hours 40.00 x complexity_factor 1.00, matched to the same volunteer (open_engagement_count 1 < VOLUNTEER_MAX_CONCURRENT 2) and accepted, so engagement B sits at NOT_STARTED with committed_hours 40.00 and no agreement yet."
            - "Window hours_committed is 80.00 and cycle slots_committed is 2 immediately before the trigger."
            - "Logical clock at 2026-01-10T00:00:00Z."
          setup_api_calls:
            - call: "POST /program-cycles"
              payload: { cycle_code: "2026-Q1", starts_at: "2026-01-01T00:00:00Z", ends_at: "2026-04-01T00:00:00Z", capacity_slot_total: 10 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { cyc: $.data.id }
            - call: "POST /partner-orgs"
              payload: { name: "Harbor Aid", contact_email: "pc1@harboraid.org", sector: "HOUSING", annual_budget_usd: 12000000.00 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { org: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /volunteers"
              payload: { full_name: "Vera Ng", email: "vera@ex.org", professional_rate_usd_per_hour: 150.00, seniority: "SENIOR", weekly_hours_cap: 40 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { vol: $.data.id }
            - call: "POST /volunteers/${vol}/skill-profiles"
              payload: { skill_code: "LEGAL_CONTRACTS", proficiency: 4, years_experience: 10.0 }
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /volunteers/${vol}/vet"
              payload: { verify_skill_codes: ["LEGAL_CONTRACTS"] }
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /volunteers/${vol}/availability-windows"
              payload: { starts_at: "2026-01-05T00:00:00Z", ends_at: "2026-03-01T00:00:00Z", window_kind: "HARD", hours_offered: 300.00 }
              as: Volunteer
              as_user_id: "${vol}"
              captures: { win: $.data.id }
            - call: "POST /project-requests"
              payload: { partner_org_id: "${org}", cycle_id: "${cyc}", title: "Lease portfolio review", discipline: "LEGAL", required_skill_code: "LEGAL_CONTRACTS", min_proficiency: 3, requested_hours: 40.00, urgency: "ROUTINE" }
              as: PartnerContact
              as_user_id: "${org}"
              captures: { req: $.data.id }
            - call: "POST /project-requests/${req}/submit-for-scoping"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
              captures: { req_v: $.data.version }
            - call: "POST /project-requests/${req}/scope-definitions"
              payload: { expected_project_request_version: "${req_v}", estimated_hours: 40.00, complexity_factor: 1.00, confidentiality_tier: "STANDARD", ip_disposition: "ASSIGN_TO_PARTNER" }
              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { scope: $.data.id }
            - call: "POST /scope-definitions/${scope}/deliverables"
              payload: { title: "Redlined lease set", sequence_no: 1, weight_pct: 100.00, hours_estimate: 40.00, acceptance_criteria: "All 12 leases redlined and risk-ranked" }
              as: ScopingSpecialist
              as_user_id: "ss-1"
            - call: "POST /scope-definitions/${scope}/approve"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
            - call: "POST /project-requests/${req}/match"
              payload: {}
              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { offer: $.data.id }
            - call: "POST /match-offers/${offer}/accept"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
              captures: { eng: $.data.id, eng_v0: $.data.version }
            - call: "POST /engagements/${eng}/agreements"
              payload: { expected_engagement_version: "${eng_v0}", ip_disposition: "ASSIGN_TO_PARTNER", confidentiality_tier: "STANDARD", indemnity_cap_usd: 10000.00 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { agr: $.data.id }
            - call: "POST /agreements/${agr}/send"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
            - call: "POST /agreements/${agr}/execute"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /agreements/${agr}/execute"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
            - call: "POST /engagements/${eng}/start"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
            - call: "POST /project-requests"
              payload: { partner_org_id: "${org}", cycle_id: "${cyc}", title: "Vendor contract templates", discipline: "LEGAL", required_skill_code: "LEGAL_CONTRACTS", min_proficiency: 3, requested_hours: 40.00, urgency: "ROUTINE" }
              as: PartnerContact
              as_user_id: "${org}"
              captures: { req_b: $.data.id }
            - call: "POST /project-requests/${req_b}/submit-for-scoping"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
              captures: { req_b_v: $.data.version }
            - call: "POST /project-requests/${req_b}/scope-definitions"
              payload: { expected_project_request_version: "${req_b_v}", estimated_hours: 40.00, complexity_factor: 1.00, confidentiality_tier: "STANDARD", ip_disposition: "ASSIGN_TO_PARTNER" }
              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { scope_b: $.data.id }
            - call: "POST /scope-definitions/${scope_b}/deliverables"
              payload: { title: "Template pack", sequence_no: 1, weight_pct: 100.00, hours_estimate: 40.00, acceptance_criteria: "Six templates drafted and annotated" }
              as: ScopingSpecialist
              as_user_id: "ss-1"
            - call: "POST /scope-definitions/${scope_b}/approve"
              payload: {}
              as: PartnerContact
              as_user_id: "${org}"
            - call: "POST /project-requests/${req_b}/match"
              payload: {}
              as: ScopingSpecialist
              as_user_id: "ss-1"
              captures: { offer_b: $.data.id }
            - call: "POST /match-offers/${offer_b}/accept"
              payload: {}
              as: Volunteer
              as_user_id: "${vol}"
              captures: { eng_b: $.data.id }
          trigger:
            - call: "POST /engagements/${eng}/terminate"
              payload: { termination_reason: "ADMIN" }
              as: ProgramManager
              as_user_id: "pm-1"
          assert:
            - "response.status == 200"
            - "Engagement.${eng}.work_status == 'TERMINATED'"
            - "Engagement.${eng_b}.work_status == 'NOT_STARTED'"
            - "Engagement.${eng_b}.committed_hours == 40.00"
            - "AvailabilityWindow.${win}.hours_committed == 40.00"
            - "AvailabilityWindow.${win}.hours_remaining == 260.00"
            - "AvailabilityWindow.${win}.hours_committed + AvailabilityWindow.${win}.hours_remaining == 300.00"
            - "ProgramCycle.${cyc}.slots_committed == 1"
            - "ProgramCycle.${cyc}.slots_reserved == 0"
            - "ProgramCycle.${cyc}.slots_available == 9"
            - "ProgramCycle.${cyc}.utilization_ratio == 0.1000"
            - "ProgramCycle.${cyc}.posture == 'OPEN'"
            - "Volunteer.${vol}.status == 'PAUSED'"
            - "Volunteer.${vol}.reliability_score == 0.2500"
            - "MatchOffer.${offer_b}.status == 'ACCEPTED'"
