      - name: ssp_master_change_after_approval_keeps_pinned_allocation
        claim_type: version_pinning_on_approval
        grounds: [entities.PerformanceObligation.fields.ssp_cents, state_machines.Contract.IN_REVIEW_to_APPROVED]
        distinguishing_aspect: "Version-pinning layer: after approve, retiring the SSP record and creating a replacement does NOT change the POB's pinned ssp_cents (42000) or the allocated amount (90000 == full tx for the single POB)."
        test_recipe:
          setup: ["SSP GADGET/EU 42000; customer; contract fixed 90000 signed 2026-05-20 with one POINT_IN_TIME POB; APPROVED (allocated 90000, ssp pinned 42000)"]
          setup_api_calls:
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "GADGET", region: "EU", ssp_cents: 42000, effective_from: "2026-01-01", effective_to: "2026-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
              captures: { ssp_id: $.data.id }
            - call: "POST /revrec/customers"
              payload: { legal_name: "PinV Co", external_ref: "PINV-1" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { cust_id: $.data.id }
            - call: "POST /revrec/contracts"
              payload: { customer_id: "${cust_id}", contract_ref: "C-PINV", signed_date: "2026-05-20", fixed_consideration_cents: 90000, risk_tier: "STANDARD" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { c_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/pobs"
              payload: { pob_ref: "P1", product_code: "GADGET", region: "EU", recognition_pattern: "POINT_IN_TIME" }
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_id: $.data.id }
            - call: "POST /revrec/contracts/${c_id}/submit"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
            - call: "POST /revrec/contracts/${c_id}/approve"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
          trigger:
            - call: "POST /revrec/ssp-prices/${ssp_id}/retire"
              payload: {}
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "POST /revrec/ssp-prices"
              payload: { product_code: "GADGET", region: "EU", ssp_cents: 99000, effective_from: "2027-01-01", effective_to: "2027-12-31" }
              as: RevenueManager
              as_user_id: "mgr-1"
            - call: "GET /revrec/pobs/${pob_id}"
              payload: {}
              as: RevenueAccountant
              as_user_id: "acct-1"
              captures: { pob_ssp: $.data.ssp_cents, pob_alloc: $.data.allocated_amount_cents }
          assert:
            - "POB ssp_cents still == 42000 after the SSP record was retired"
            - "POB allocated_amount_cents still == 90000 — approval-time pinning is immutable against master-data churn"

      - name: cascades_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: cascade_modification_catchup_to_period_totals
          rationale: "N-level cascade (modification -> reallocation -> catch-up entries -> period total -> contract balances) is asserted hop-by-hop by the §1.8 instance; the reopen cascade by cascade_period_reopen_supersedes_pack."

