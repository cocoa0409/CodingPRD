              captures: { err_rev: $.data.error_id }
            - call: "GET /certifications/${cert_id}"
              payload: {}
              as: BoardAdministrator
              captures: { cert_st: $.data.status, cert_vu: $.data.valid_until }
          assert:
            - "Renewal created at exactly valid_until - 90 days (window lower bound inclusive): status SUBMITTED, total_hours == 44"
            - "APPROVE with 44 hours: 422 ERR_RENEWAL_HOURS_INSUFFICIENT (boundary: 45 passes, 44 fails)"
            - "RETURN moves the application to RETURNED; resubmission reuses the same application (${ren_id2} == ${ren_id}) back to SUBMITTED with total_hours == 45"
            - "APPROVE at exactly 45 hours succeeds: renewal APPROVED"
            - "Certification.${cert_id}.status == RENEWED and valid_until == 2037-05-29T00:00:00Z (2032-05-30 + 1825 days)"
            - "A second renewal create while one is SUBMITTED fails 409 ERR_ACTIVE_RENEWAL_EXISTS (err_dup)"
            - "Reviewing an already-APPROVED renewal fails 409 ERR_RENEWAL_NOT_REVIEWABLE (err_rev) — terminal lockdown"

  # ===========================================================================
  - section: validations
    instances:
      - name: cycle_transition_missing_auth_header_returns_400
        claim_type: Violation → Error
        grounds:
          - validations[priority=1]
          - errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]
        distinguishing_aspect: "A call without X-User-ID / X-User-Role fails 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role or existence check."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - *c_clk
            - *c_cycle
          trigger:
            - call: "POST /cycles/${cyc_id}/transition"
              payload: { to: "OPEN" }
              captures: { err: $.data.error_id }
          assert:
            - "response status 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: role_denial_precedes_existence_check
        claim_type: Priority Ordering
        grounds:
          - validations[priority=2]
          - validations[priority=4]
          - errors[ERR_INSUFFICIENT_PERMISSIONS]
        distinguishing_aspect: "A Candidate calling POST /cycles/{random-uuid}/transition hits the role gate (priority 2, 403 ERR_INSUFFICIENT_PERMISSIONS) before the cycle-existence check (priority 4) — no 404 leaks to unauthorized roles."
        test_recipe:
          setup: ["Clock 2027-01-10; candidate A registered."]
          setup_api_calls:
            - *c_clk
            - call: "POST /candidates"
              payload: { full_name: "Candidate A", email: "a@x.com", license_number: "LIC-A", license_state: "NM", district_code: "D-100", years_experience: 5 }
              as: Anonymous
              captures: { cand_a: $.data.id }
          trigger:
            - call: "POST /cycles/00000000-0000-0000-0000-000000000000/transition"
              payload: { to: "OPEN" }
              as: Candidate
              as_user_id: "${cand_a}"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403 with error_id == ERR_INSUFFICIENT_PERMISSIONS (not 404)"

      - name: submission_create_on_draft_cycle_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=5]
          - errors[ERR_CYCLE_NOT_OPEN]
        distinguishing_aspect: "Creating a submission while the cycle is still DRAFT fails 409 ERR_CYCLE_NOT_OPEN even for an ELIGIBLE candidate."
        test_recipe:
          setup: ["Clock 2027-01-10; cycle NB-2027 in DRAFT (never opened); candidate A ELIGIBLE."]
          setup_api_calls:
