          assert:
            - "all fifteen calls answer 403 ERR_UNAUTHORIZED"
            - "the clock is still 2026-08-03T00:00:00Z, so the refused clock write had no effect"
            - "GET /stage-gates, GET /retailers and GET /pilot-lines each return total_count == 0"
            - "GET /innovation-projects returns total_count == 1 and InnovationProject.${rb_p_id}.dev_status is still IDEA with version unchanged at ${rb_p_v1}"
