# Test-targeting index for task_2944 Deal Desk & Pricing Approval.
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7 only; deleting this file
# leaves the declared behaviour identical.
# Shared fixture chain (ACTIVE desk policy + 4 approval tiers + 4 products +
# Core Platform volume bands + the Core->Support bundle rule + one account) is
# defined once as YAML anchors in the first instance below and aliased by every
# later instance.
# Base configuration produced by the anchored chain:
#   DeskPolicy   margin_floor 0.35, absolute_floor 0.22, validity 30d,
#                standard payment terms 30d, uplift 0.015 / 30d,
#                max_stack 0.45, rebate 5000000->0.02 / 25000000->0.04,
#                surge_window 10d, surge_sla_multiplier 0.5,
#                price_hold_cooldown 30d, exception_allowance 4000000,
#                terms_review_threshold 30.0, terms_cfo_threshold 35.0
#   Tiers        L1 [0.00,0.15) DealDeskAnalyst 8h  delegable 0
#                L2 [0.15,0.25) SalesDirector  12h delegable 1
#                L3 [0.25,0.40) VPSales        24h delegable 1
#                L4 [0.40,1.00] CFO            48h delegable 0
#   Products     CORE-PLAT 120000/30000 RATABLE min 12
#                SUP-PREM   30000/6000  RATABLE min 12
#                SVC-IMPL  200000/150000 POINT_IN_TIME min 1
#                USG-API      500/200   USAGE_AS_INCURRED min 12
#   VolumeTiers  CORE-PLAT 1-49 @0.00, 50-199 @0.10, 200-null @0.18
#   BundleRule   anchor CORE-PLAT -> attached SUP-PREM 0.05 at ratio 1.0
#   Clock        2026-08-01T00:00:00Z

scaffold_difficulty_design:

  # =========================================================================
  # R1 dual_variant_calc
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: tiered_line_pricing_whole_quantity_average_vs_marginal_progressive_money
        grounds:
          - calculations.C1_line_pricing
          - calculations.C2_order_totals
          - entities.QuoteLine.fields.provisional_net_cents
          - entities.QuoteLine.fields.final_net_cents
          - entities.Quote.fields.provisional_net_total_cents
          - entities.Quote.fields.final_net_total_cents
        distinguishing_aspect: |
          This variant pair lives in the MONEY domain on Quote/QuoteLine cents: WHOLE_QUANTITY_AVERAGE
          prices all 250 Core Platform units at the single band discount reached by the total quantity
          (0.18), while MARGINAL_PROGRESSIVE prices each band slice at that band's own discount, so the
          identical line yields provisional_net_cents 20790000 against final_net_cents 23038560 and the
          quote yields provisional_net_total_cents 26506116 against final_net_total_cents 28697113.
        test_recipe:
          setup:
            - "One ACTIVE DeskPolicy with the four approval tiers, four products, the Core Platform volume bands and the Core->Support bundle rule."
            - "One ENTERPRISE account with credit_status CLEAR, booked_arr_cents 0 and exception_allowance_used_cents 0."
            - "One DRAFT quote, term_months 36 (term multiplier 0.90), payment_terms_days 60 (one 30-day uplift block)."
            - "Two lines: Core Platform quantity 250 at requested_discount_pct 0.05 (band 3, no bundle) and Premium Support quantity 250 at requested_discount_pct 0 (attach ratio 250/250 = 1.0, so the 0.05 bundle discount applies)."
          setup_api_calls:
            - &bc_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - &bc_policy
              call: "POST /desk-policies"
              payload: { name: "FY26 Deal Desk Policy", margin_floor_pct: 0.35, absolute_margin_floor_pct: 0.22, quote_validity_days: 30, standard_payment_terms_days: 30, uplift_rate_per_30_days: 0.015, max_stack_discount_pct: 0.45, volume_rebate_tier1_min_cents: 5000000, volume_rebate_tier1_pct: 0.02, volume_rebate_tier2_min_cents: 25000000, volume_rebate_tier2_pct: 0.04, surge_window_days: 10, surge_sla_multiplier: 0.5, price_hold_cooldown_days: 30, exception_allowance_cents: 4000000, terms_review_risk_threshold: 30.0, terms_cfo_risk_threshold: 35.0 }
              as: PlatformAdmin
              captures: { pol_id: $.data.id }
            - &bc_tier1
              call: "POST /approval-tiers"
              payload: { desk_policy_id: "${pol_id}", tier_level: 1, min_discount_pct: 0.00, max_discount_pct: 0.15, required_role: "DealDeskAnalyst", sla_hours: 8, max_delegation_levels: 0 }
              as: PlatformAdmin
              captures: { tier1_id: $.data.id }
            - &bc_tier2
              call: "POST /approval-tiers"
              payload: { desk_policy_id: "${pol_id}", tier_level: 2, min_discount_pct: 0.15, max_discount_pct: 0.25, required_role: "SalesDirector", sla_hours: 12, max_delegation_levels: 1 }
              as: PlatformAdmin
              captures: { tier2_id: $.data.id }
            - &bc_tier3
              call: "POST /approval-tiers"
              payload: { desk_policy_id: "${pol_id}", tier_level: 3, min_discount_pct: 0.25, max_discount_pct: 0.40, required_role: "VPSales", sla_hours: 24, max_delegation_levels: 1 }
              as: PlatformAdmin
              captures: { tier3_id: $.data.id }
            - &bc_tier4
              call: "POST /approval-tiers"
              payload: { desk_policy_id: "${pol_id}", tier_level: 4, min_discount_pct: 0.40, max_discount_pct: 1.00, required_role: "CFO", sla_hours: 48, max_delegation_levels: 0 }
              as: PlatformAdmin
              captures: { tier4_id: $.data.id }
            - &bc_activate
              call: "POST /desk-policies/${pol_id}/activate"
              payload: {}
              as: PlatformAdmin
              captures: { pol_status: $.data.status }
            - &bc_core
              call: "POST /products"
              payload: { sku: "CORE-PLAT", name: "Core Platform", product_type: "SUBSCRIPTION_LICENSE", list_unit_price_cents: 120000, unit_cost_cents: 30000, rev_rec_category: "RATABLE", min_term_months: 12 }
              as: PlatformAdmin
              captures: { core_id: $.data.id }
            - &bc_support
              call: "POST /products"
              payload: { sku: "SUP-PREM", name: "Premium Support", product_type: "SUPPORT_PLAN", list_unit_price_cents: 30000, unit_cost_cents: 6000, rev_rec_category: "RATABLE", min_term_months: 12 }
              as: PlatformAdmin
              captures: { sup_id: $.data.id }
            - &bc_service
              call: "POST /products"
              payload: { sku: "SVC-IMPL", name: "Implementation Services", product_type: "PROFESSIONAL_SERVICES", list_unit_price_cents: 200000, unit_cost_cents: 150000, rev_rec_category: "POINT_IN_TIME", min_term_months: 1 }
              as: PlatformAdmin
              captures: { svc_id: $.data.id }
            - &bc_usage
              call: "POST /products"
              payload: { sku: "USG-API", name: "Metered API Calls", product_type: "USAGE_METERED", list_unit_price_cents: 500, unit_cost_cents: 200, rev_rec_category: "USAGE_AS_INCURRED", min_term_months: 12 }
              as: PlatformAdmin
              captures: { usg_id: $.data.id }
            - &bc_vt1
              call: "POST /volume-tiers"
              payload: { product_id: "${core_id}", tier_level: 1, min_quantity: 1, max_quantity: 49, tier_discount_pct: 0.00 }
              as: PlatformAdmin
              captures: { vt1_id: $.data.id }
            - &bc_vt2
              call: "POST /volume-tiers"
              payload: { product_id: "${core_id}", tier_level: 2, min_quantity: 50, max_quantity: 199, tier_discount_pct: 0.10 }
              as: PlatformAdmin
              captures: { vt2_id: $.data.id }
            - &bc_vt3
              call: "POST /volume-tiers"
              payload: { product_id: "${core_id}", tier_level: 3, min_quantity: 200, tier_discount_pct: 0.18 }
              as: PlatformAdmin
              captures: { vt3_id: $.data.id }
            - &bc_bundle
              call: "POST /bundle-rules"
              payload: { anchor_product_id: "${core_id}", attached_product_id: "${sup_id}", bundle_discount_pct: 0.05, min_attach_quantity_ratio: 1.0 }
              as: PlatformAdmin
              captures: { bundle_id: $.data.id }
            - &bc_account
              call: "POST /accounts"
              payload: { name: "Northwind Industries", segment: "ENTERPRISE", region: "NA", existing_arr_cents: 0 }
              as: DealDeskAnalyst
              captures: { acct_id: $.data.id }
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind FY26 Expansion", term_months: 36, payment_terms_days: 60, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${core_id}", quantity: 250, requested_discount_pct: 0.05 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { core_line_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 250, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { sup_line_id: $.data.id }
          trigger:
            - call: "GET /quotes/${q_id}"
              payload: {}
              as: DealDeskAnalyst
          assert:
            - "QuoteLine.${core_line_id}.extended_list_cents == 30000000"
            - "QuoteLine.${core_line_id}.extended_cost_cents == 7500000"
            - "QuoteLine.${core_line_id}.volume_tier_level_applied == 3"
            - "QuoteLine.${core_line_id}.bundle_discount_applied_pct == 0.000000"
            - "QuoteLine.${core_line_id}.effective_stack_discount_pct == 0.230000"
            - "QuoteLine.${core_line_id}.provisional_net_cents == 20790000"
            - "QuoteLine.${core_line_id}.final_net_cents == 23038560"
            - "QuoteLine.${sup_line_id}.volume_tier_level_applied == 0"
            - "QuoteLine.${sup_line_id}.bundle_discount_applied_pct == 0.050000"
            - "QuoteLine.${sup_line_id}.provisional_net_cents == 6412500"
            - "QuoteLine.${sup_line_id}.final_net_cents == 6412500"
            - "Quote.${q_id}.list_total_cents == 37500000"
            - "Quote.${q_id}.cost_total_cents == 9000000"
            - "Quote.${q_id}.provisional_net_total_cents == 26506116"
            - "Quote.${q_id}.final_net_total_cents == 28697113"
            - "Quote.${q_id}.provisional_blended_discount_pct == 0.303616"
            - "Quote.${q_id}.final_blended_discount_pct == 0.246053"
            - "Quote.${q_id}.volume_rebate_cents == 1178042"
            - "Quote.${q_id}.payment_terms_uplift_cents == 424095"
            - "Quote.${q_id}.provisional_margin_pct == 0.660456"
            - "Quote.${q_id}.final_margin_pct == 0.686380"
            - "Quote.${q_id}.required_approval_level == 2"
            - "Quote.${q_id}.status == DRAFT"

      - name: nonstandard_term_risk_aggregate_weighted_vs_dominant_category_legal
        grounds:
          - calculations.C6_nonstandard_term_risk
          - entities.Quote.fields.terms_risk_score_aggregate
          - entities.Quote.fields.terms_risk_score_dominant
          - entities.NonStandardTerm.fields.risk_contribution
          - entities.NonStandardTerm.fields.requires_cfo_cosign
        distinguishing_aspect: |
          This variant pair lives in the LEGAL-RISK domain on NonStandardTerm score points, not in the
          money domain: AGGREGATE_WEIGHTED sums all three already-rounded contributions (10.00 + 15.00 +
          22.50 = 47.50) while DOMINANT_CATEGORY discards the other two rows and multiplies only the
          single largest contribution by 1.25 (22.50 * 1.25 = 28.13), so the same three terms drive the
          legal-review gate (aggregate >= 30.0) open while leaving the CFO co-sign gate (dominant >= 35.0)
          shut.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One DRAFT quote, term_months 24, payment_terms_days 90, with one Premium Support line of quantity 10."
            - "Two non-standard terms already recorded: PAYMENT_TERMS 90 days (severity (90-30)/120 = 0.5, weight 20, contribution 10.00) and INDEMNITY_CAP 3x fees (severity 3/6 = 0.5, weight 30, contribution 15.00)."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Support Renewal", term_months: 24, payment_terms_days: 90, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${sup_id}", quantity: 10, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { sup_line_id: $.data.id }
            - call: "POST /nonstandard-terms"
              payload: { quote_id: "${q_id}", term_category: "PAYMENT_TERMS", requested_numeric_value: 90, requested_text: "Net 90 payment terms" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { term_pay_id: $.data.id }
            - call: "POST /nonstandard-terms"
              payload: { quote_id: "${q_id}", term_category: "INDEMNITY_CAP", requested_numeric_value: 3, requested_text: "Indemnity capped at 3x annual fees" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { term_indem_id: $.data.id }
          trigger:
            - call: "POST /nonstandard-terms"
              payload: { quote_id: "${q_id}", term_category: "TERMINATION_FOR_CONVENIENCE", requested_numeric_value: 3, requested_text: "Termination for convenience on 3 months notice" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { term_term_id: $.data.id }
          assert:
            - "NonStandardTerm.${term_pay_id}.severity_factor == 0.500000"
            - "NonStandardTerm.${term_pay_id}.risk_contribution == 10.00"
            - "NonStandardTerm.${term_indem_id}.severity_factor == 0.500000"
            - "NonStandardTerm.${term_indem_id}.risk_contribution == 15.00"
            - "NonStandardTerm.${term_term_id}.severity_factor == 0.750000"
            - "NonStandardTerm.${term_term_id}.risk_contribution == 22.50"
            - "Quote.${q_id}.terms_risk_score_aggregate == 47.50"
            - "Quote.${q_id}.terms_risk_score_dominant == 28.13"
            - "NonStandardTerm.${term_pay_id}.requires_cfo_cosign == false"
            - "NonStandardTerm.${term_indem_id}.requires_cfo_cosign == false"
            - "NonStandardTerm.${term_term_id}.requires_cfo_cosign == false"
            - "NonStandardTerm.${term_term_id}.review_state == PENDING"

  # =========================================================================
  # R2 combinatorial_formula
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: line_stack_cap_min_binds_only_in_top_volume_band
        grounds:
          - calculations.C1_line_pricing
          - entities.QuoteLine.fields.effective_stack_discount_pct
          - entities.DeskPolicy.fields.max_stack_discount_pct
          - calculations.C3_blended_discount_and_approval_level
        distinguishing_aspect: |
          The formula composes a min() ceiling with a per-band stack sum, so the cap binds in one band
          and not in the others: the top band's 0.18 + 0.30 = 0.48 is clamped to max_stack_discount_pct
          0.45 while bands 1 and 2 (0.30 and 0.40) pass through untouched, producing final_net_cents
          14982000 rather than the uncapped 14978400, and the WHOLE_QUANTITY_AVERAGE stack is clamped
          for the entire quantity (0.45 instead of 0.48) producing provisional_net_cents 13200000.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One DRAFT quote, term_months 12 (term multiplier 1.00), payment_terms_days 30 (no uplift)."
            - "One Core Platform line of quantity 200 at requested_discount_pct 0.30, which straddles all three volume bands (49 units at 0.00, 150 units at 0.10, 1 unit at 0.18)."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Deep Discount", term_months: 12, payment_terms_days: 30, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${core_id}", quantity: 200, requested_discount_pct: 0.30 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { core_line_id: $.data.id }
          assert:
            - "QuoteLine.${core_line_id}.effective_stack_discount_pct == 0.450000"
            - "QuoteLine.${core_line_id}.volume_tier_level_applied == 3"
            - "QuoteLine.${core_line_id}.extended_list_cents == 24000000"
            - "QuoteLine.${core_line_id}.provisional_net_cents == 13200000"
            - "QuoteLine.${core_line_id}.final_net_cents == 14982000"
            - "Quote.${q_id}.volume_rebate_cents == 299640"
            - "Quote.${q_id}.payment_terms_uplift_cents == 0"
            - "Quote.${q_id}.final_net_total_cents == 14682360"
            - "Quote.${q_id}.provisional_blended_discount_pct == 0.461000"
            - "Quote.${q_id}.final_blended_discount_pct == 0.388235"
            - "Quote.${q_id}.final_margin_pct == 0.591346"
            - "Quote.${q_id}.required_approval_level == 3"

      - name: rebate_then_uplift_evaluation_order_with_ceiling_blocks
        grounds:
          - calculations.C2_order_totals
          - entities.Quote.fields.volume_rebate_cents
          - entities.Quote.fields.payment_terms_uplift_cents
          - entities.DeskPolicy.fields.uplift_rate_per_30_days
          - endpoints[GET /quotes/{id}/pricing-preview]
        distinguishing_aspect: |
          Three interacting terms must be evaluated in exactly one order: the rebate is keyed on
          net_subtotal_cents 15872600 (giving 317452, not the 315770 a net_total-keyed rebate would give),
          the uplift is charged on the post-rebate base 15555148 (giving 233327, not the 238089 a
          pre-rebate base would give), and the 15 extra payment days are billed as ceil(15/30) = 1 whole
          block rather than a 0.5 pro-rata block.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One DRAFT quote, term_months 24 (term multiplier 0.95), payment_terms_days 45 (15 extra days = one whole 30-day block)."
            - "Three lines: Core Platform 60 at 0.15, Implementation Services 4 at 0.10, Metered API Calls 20000 at 0.00 — net_subtotal_cents 15872600 lands in rebate tier 1 (>= 5000000) and below tier 2 (< 25000000)."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
            - *bc_bundle
            - *bc_account
            - call: "POST /quotes"
              payload: { account_id: "${acct_id}", title: "Northwind Platform Plus Usage", term_months: 24, payment_terms_days: 45, billing_frequency: "ANNUAL" }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { q_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${core_id}", quantity: 60, requested_discount_pct: 0.15 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { core_line_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${svc_id}", quantity: 4, requested_discount_pct: 0.10 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { svc_line_id: $.data.id }
            - call: "POST /quote-lines"
              payload: { quote_id: "${q_id}", product_id: "${usg_id}", quantity: 20000, requested_discount_pct: 0.00 }
              as: SalesRep
              as_user_id: "u-rep-1"
              captures: { usg_line_id: $.data.id }
          trigger:
            - call: "GET /quotes/${q_id}/pricing-preview"
              payload: {}
              as: DealDeskAnalyst
              captures: { preview_rebate: $.data.volume_rebate_cents, preview_uplift: $.data.payment_terms_uplift_cents, preview_net: $.data.final_net_total_cents }
          assert:
            - "pricing-preview.list_total_cents == 18000000"
            - "pricing-preview.cost_total_cents == 6400000"
            - "QuoteLine.${core_line_id}.final_net_cents == 5688600"
            - "QuoteLine.${svc_line_id}.final_net_cents == 684000"
            - "QuoteLine.${usg_line_id}.final_net_cents == 9500000"
            - "${preview_rebate} == 317452"
            - "${preview_uplift} == 233327"
            - "${preview_net} == 15788475"
            - "Quote.${q_id}.volume_rebate_cents == 317452"
            - "Quote.${q_id}.payment_terms_uplift_cents == 233327"
            - "Quote.${q_id}.final_net_total_cents == 15788475"
            - "Quote.${q_id}.final_blended_discount_pct == 0.135825"
            - "Quote.${q_id}.final_margin_pct == 0.594641"
            - "Quote.${q_id}.required_approval_level == 1"
            - "pricing-preview.arrangement_type == USAGE_BASED_HYBRID"
            - "pricing-preview.usage_excluded_cents == 9500000"
            - "pricing-preview.allocable_amount_cents == 6288475"

  # =========================================================================
  # R3 non_linear_state_machine
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_renegotiation_cycle_increments_revision_count_twice
        grounds:
          - state_machines.Quote.PENDING_APPROVAL_to_CHANGES_REQUESTED
          - state_machines.Quote.CHANGES_REQUESTED_to_DRAFT
          - state_machines.Quote.DRAFT_to_PENDING_APPROVAL
          - state_machines.ApprovalRequest.CHANGES_REQUESTED_to_CANCELLED
          - entities.Quote.fields.revision_count
        distinguishing_aspect: |
          The Quote machine is cyclic, not linear: DRAFT -> PENDING_APPROVAL -> CHANGES_REQUESTED ->
          DRAFT is traversed twice by the same quote and the loop count is observable as
          revision_count == 2 with exactly two CANCELLED ApprovalRequest rows, while the quote returns to
          the same DRAFT state it started in with submitted_at back to null.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain."
            - "One quote, term_months 12, payment_terms_days 30, one Premium Support line of quantity 10 at requested_discount_pct 0.20, so final_blended_discount_pct is 0.200000 and required_approval_level is 2."
            - "The quote has already completed one full negotiation loop: submitted, sent back by the level-1 approver, reopened, and submitted a second time, with the second level-1 step also sent back."
          setup_api_calls:
            - *bc_clock
            - *bc_policy
            - *bc_tier1
            - *bc_tier2
            - *bc_tier3
            - *bc_tier4
            - *bc_activate
            - *bc_core
            - *bc_support
            - *bc_service
            - *bc_usage
            - *bc_vt1
            - *bc_vt2
            - *bc_vt3
