        distinguishing_aspect: |
          Depth-3 cascade triggered by the logical clock (different trigger from
          the incident cascade): ISP ACTIVE -> EXPIRED (link 0, clock) causes each
          ACTIVE authorization to SUSPEND (link 1); each suspension itself REJECTS
          the authorization's PENDING EVV visits (link 2). The authorization that
          is SUSPENDED (not ACTIVE) is NOT flipped to EXPIRED by the same clock sweep.
        test_recipe:
          setup:
            - "Individual ENROLLED; ISP ACTIVE with plan_year_end 2026-06-30; DAY_PROG authorization ACTIVE (span ends 2026-06-30, 24 units, 1500 cents); one EVV visit left PENDING on 2026-06-15; clock 2026-06-02"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT", "CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-02T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-06-30", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 24, rate_cents: 1500, span_start: "2026-01-01", span_end: "2026-06-30" }, as: CaseManager, as_user_id: "${cm_id}", captures: { auth_id: $.data.id } }
            - { call: "POST /authorizations/${auth_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-15", check_in_at: "2026-06-15T09:00:00Z", check_out_at: "2026-06-15T10:00:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { visit_id: $.data.id } }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-01T00:00:00Z" }, as: AgencyAdmin }
            - call: "GET /isps/${isp_id}"
              payload: {}
              as: Any
              captures: { isp_st: $.data.status }
            - call: "GET /authorizations/${auth_id}"
              payload: {}
              as: Any
              captures: { auth_st: $.data.status }
            - call: "GET /evv-visits"
              payload: { authorization_id: "${auth_id}" }
              as: Any
              captures: { visit_vs: "$.data[0].verification_status", visit_bs: "$.data[0].billing_status" }
          assert:
            - "link 0: ISP status == EXPIRED after the clock crossed plan_year_end 2026-06-30"
            - "link 1: authorization status == SUSPENDED (caused by the ISP expiry, not by the clock directly — the ACTIVE->EXPIRED sweep does not fire because the suspension happened first)"
            - "link 2: visit verification_status == REJECTED (caused by the authorization suspension)"
            - "visit billing_status == UNBILLED (rejected visit never entered billing)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (2 instances, different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_isp_inactive_beats_fiscal_unit_cap
        grounds:
          - validations[priority=4.2]
          - validations[priority=9]
          - errors[ERR_ISP_NOT_ACTIVE]
          - errors[ERR_UNIT_CAP_EXCEEDED]
        distinguishing_aspect: |
          Category pair state vs business_fiscal: the request violates BOTH the
          ACTIVE-ISP gate (ISP is DRAFT) AND the per-authorization fiscal cap
          (400 units * 20000 cents = 8,000,000 > 5,000,000). The state error wins
          because priority 4.2 precedes priority 9.
        test_recipe:
          setup:
            - "Individual ENROLLED; ISP left in DRAFT (never submitted); clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
          trigger:
            - call: "POST /authorizations"
              payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "RESPITE", unit_type: "DAY", authorized_units: 400, rate_cents: 20000, span_start: "2026-01-01", span_end: "2026-12-31" }
              as: CaseManager
              as_user_id: "${cm_id}"
              captures: { err: $.data.error_id }
            - call: "GET /authorizations"
              payload: { individual_id: "${ind_id}" }
              as: Any
          assert:
            - "error_id == ERR_ISP_NOT_ACTIVE (state, priority 4.2) — NOT ERR_UNIT_CAP_EXCEEDED (business_fiscal, priority 9)"
            - "no authorization persisted: GET /authorizations?individual_id returns an empty list (total_count == 0)"

      - name: safety_certification_beats_temporal_shift_overlap
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_CERTIFICATION_MISSING]
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Category pair business_safety vs business_temporal (different pair from
          state-vs-fiscal): one request violates BOTH the MED_CERT requirement
          (requires_med_pass shift, DSP holds only CPR) AND the 8-hour rest buffer
          (prior shift ended 15:00, new starts 22:00). The safety error wins
          because priority 5 precedes priority 6.
        test_recipe:
          setup:
            - "Home ACTIVE; DSP D2 (certifications [CPR], no MED_CERT) with existing DAY shift 2026-06-02 07:00-15:00; clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 2 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Sptwo", staff_role: "DSP", certifications: ["CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d2_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /shifts", payload: { home_id: "${hm_id}", staff_member_id: "${d2_id}", window_start: "2026-06-02T07:00:00Z", window_end: "2026-06-02T15:00:00Z", shift_type: "DAY" }, as: AgencyAdmin, captures: { sh1_id: $.data.id } }
          trigger:
            - call: "POST /shifts"
              payload: { home_id: "${hm_id}", staff_member_id: "${d2_id}", window_start: "2026-06-02T22:00:00Z", window_end: "2026-06-03T06:00:00Z", shift_type: "NIGHT", requires_med_pass: true }
              as: AgencyAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CERTIFICATION_MISSING (business_safety, priority 5) — NOT ERR_SHIFT_OVERLAP (business_temporal, priority 6)"
            - "no second shift persisted: GET /shifts?staff_member_id=${d2_id} returns exactly 1 shift"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (3 instances, different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: authorization_exhaustion_at_exact_equality
        grounds:
          - calculations.authorization_waterfall_allocation
          - state_machines.ServiceAuthorization.ACTIVE_to_EXHAUSTED
          - entities.ServiceAuthorization.fields.consumed_units
        distinguishing_aspect: |
          Metric: unit count. Endpoint: POST /evv-visits/{visitId}/verify. The
          third verify lands consumed_units exactly equal to authorized_units
          (24 == 24) — the >= comparison triggers EXHAUSTED at equality, not one
          unit later.
        test_recipe:
          setup:
            - "Individual ENROLLED, ISP ACTIVE, DAY_PROG authorization ACTIVE (24 units, 1500 cents); clock 2026-06-01; three 120-minute visits on 2026-06-02 (8 units each); first two already VERIFIED (consumed 16)"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT", "CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /isps/${isp_id}/activate", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /authorizations", payload: { individual_id: "${ind_id}", isp_id: "${isp_id}", service_code: "DAY_PROG", unit_type: "FIFTEEN_MIN", authorized_units: 24, rate_cents: 1500, span_start: "2026-01-01", span_end: "2026-12-31" }, as: CaseManager, as_user_id: "${cm_id}", captures: { auth_id: $.data.id } }
            - { call: "POST /authorizations/${auth_id}/approve", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T06:00:00Z", check_out_at: "2026-06-02T08:00:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v1_id: $.data.id } }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T09:00:00Z", check_out_at: "2026-06-02T11:00:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v2_id: $.data.id } }
            - { call: "POST /evv-visits", payload: { individual_id: "${ind_id}", authorization_id: "${auth_id}", service_date: "2026-06-02", check_in_at: "2026-06-02T12:00:00Z", check_out_at: "2026-06-02T14:00:00Z", geo_within_radius: true }, as: DSP, as_user_id: "${d1_id}", captures: { v3_id: $.data.id } }
            - { call: "POST /evv-visits/${v1_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /evv-visits/${v2_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}" }
          trigger:
            - { call: "POST /evv-visits/${v3_id}/verify", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { v3_fin: $.data.final_units, v3_st: $.data.verification_status } }
            - call: "GET /authorizations/${auth_id}"
              payload: {}
              as: Any
              captures: { a_consumed: $.data.consumed_units, a_remaining: $.data.remaining_units, a_st: $.data.status }
          assert:
            - "third verify succeeds: final_units == 8, verification_status == VERIFIED"
            - "consumed_units == 24 == authorized_units exactly — equality triggers the auto-transition (>=, not >)"
            - "remaining_units == 0"
            - "authorization status == EXHAUSTED at exact equality"

      - name: incident_deadline_strictly_greater
        grounds:
          - calculations.incident_reporting_deadline
          - entities.Incident.fields.is_late
          - entities.Incident.fields.report_due_at
        distinguishing_aspect: |
          Metric: wall-clock time (different metric from unit count). Endpoint:
          POST /incidents/{incidentId}/submit (different endpoint from verify).
          Submission at exactly report_due_at is NOT late — the comparison is
          strictly-greater; one minute later IS late.
        test_recipe:
          setup:
            - "Individual ENROLLED; home ACTIVE; DSP D1; clock advanced to exactly 2026-06-03T08:30:00Z (the CRITICAL deadline for a 2026-06-02T08:30 discovery)"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 2 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT", "CPR"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-03T08:30:00Z" }, as: AgencyAdmin }
            - { call: "POST /incidents", payload: { individual_id: "${ind_id}", home_id: "${hm_id}", category: "INJURY", severity: "CRITICAL", occurred_at: "2026-06-02T08:00:00Z", discovered_at: "2026-06-02T08:30:00Z", description: "Resident fell in bathroom" }, as: DSP, as_user_id: "${d1_id}", captures: { inc_id: $.data.id } }
          trigger:
            - call: "POST /incidents/${inc_id}/submit"
              payload: {}
              as: DSP
              as_user_id: "${d1_id}"
              captures: { due: $.data.report_due_at, late: $.data.is_late, st: $.data.status }
          assert:
            - "report_due_at == 2026-06-03T08:30:00Z (discovered_at + 24h)"
            - "submitted_at == 2026-06-03T08:30:00Z (server clock)"
            - "is_late == false — submission exactly AT the deadline is not late (submitted_at > report_due_at is strict)"
            - "status == SUBMITTED"

      - name: home_capacity_exact_fill_allowed
        grounds:
          - validations[priority=8.1]
          - calculations.census_variants
          - errors[ERR_HOME_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric: resident count vs certified beds (different from units and from
          time). Endpoint: POST /bed-assignments (different from verify and
          submit). projected_census + 1 == certified_bed_count is ALLOWED
          (<= comparison); one more admission exceeds it.
        test_recipe:
          setup:
            - "Home with certified_bed_count 1; individuals I1, I2 ENROLLED; clock 2026-06-01; I1 has a PENDING assignment (move_in 2026-06-01) exactly filling the single certified bed"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 1 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind1_id: $.data.id } }
            - { call: "POST /individuals/${ind1_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind Two", medicaid_id: "MCD-002", date_of_birth: "1985-05-05", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind2_id: $.data.id } }
            - { call: "POST /individuals/${ind2_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: AgencyAdmin }
            - { call: "POST /bed-assignments", payload: { home_id: "${hm_id}", bed_label: "R1-A", individual_id: "${ind1_id}", move_in_date: "2026-06-01" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ba1_id: $.data.id, ba1_st: $.data.status } }
          trigger:
            - call: "POST /bed-assignments"
              payload: { home_id: "${hm_id}", bed_label: "R1-B", individual_id: "${ind2_id}", move_in_date: "2026-06-02" }
              as: CaseManager
              as_user_id: "${cm_id}"
              captures: { err: $.data.error_id }
          assert:
            - "first admission returned 201 with status PENDING — projected_census(2026-06-01) 0 + 1 == certified_bed_count 1 satisfies <="
            - "second admission fails with ERR_HOME_CAPACITY_EXCEEDED — projected_census(2026-06-02) 1 (the PENDING first assignment inside the 14-day window) + 1 = 2 > 1"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (3 instances, different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: authorization_create_requires_isp_active
        grounds:
          - validations[priority=4.2]
          - state_machines.ISP
          - state_machines.ServiceAuthorization
        distinguishing_aspect: |
          Entity pair ServiceAuthorization -> ISP: creating an authorization
          anchored to an ISP in PENDING_REVIEW (non-ACTIVE) is rejected; the same
          request succeeds once the ISP reaches ACTIVE.
        test_recipe:
          setup:
            - "Individual ENROLLED; ISP submitted (PENDING_REVIEW) but not yet approved; clock 2026-06-01"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
