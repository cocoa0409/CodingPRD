  - rule_id: transitive_cascade
    instances:
      - name: component_patch_decertifies_noticed_study_and_voids_protest_tally
        grounds:
          - state_machines.NexusComponent.VALID_to_STALE
          - state_machines.FeeStudy.NOTICE_PUBLISHED_to_DRAFT
          - entities.FeeScheduleItem.fields.schedule_status
          - entities.ProtestFiling.fields.status
          - entities.FeeStudy.fields.revision_round
        distinguishing_aspect: |
          A single PATCH that names only the component fires a four-hop chain the
          request never mentions: hop 1 the component goes VALID -> STALE with its three
          cost figures nulled, hop 2 its FeeScheduleItem goes STALE with fee_per_unit_cents
          null, hop 3 the parent study is remanded NOTICE_PUBLISHED -> DRAFT with
          revision_round 1, and hop 4 the remand voids both RECORDED protests and zeroes a
          2000bp tally. growth_demand_units is the one figure that survives, because it is
          recomputed rather than invalidated.
        test_recipe:
          setup:
            - "HARBOR program at default constants with the PARKS facility standard only."
            - "One PLAN_BASED study with an allocated PARKS component (adopted 101,667) and one SINGLE_FAMILY schedule line at 254,168."
            - "Study certified by analyst-1 on 2026-01-05 and noticed on 2026-01-15 for 30 days, so it sits in NOTICE_PUBLISHED with protest_window_ends_at 2026-02-14T00:00:00Z."
            - "Two RECORDED protest filings of 1000bp each, so protest_weight_bp is 2000 - below the 5000bp threshold, which proves the voiding comes from the remand and not from a sustained protest."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
