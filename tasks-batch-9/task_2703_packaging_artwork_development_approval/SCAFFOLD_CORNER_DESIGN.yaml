  # ==========================================================================
  # §1.9 breadth walk, section 7 of 9: errors - every id in §1.6 must be
  # triggerable. 51 of the 56 ids are already asserted by name in the §1.8
  # instances and in the earlier §1.9 sections; the three instances here close
  # the routing-existence pair (ERR_REVIEW_ROUTE_NOT_FOUND, ERR_REVIEW_TASK_NOT_FOUND
  # on the read, list and decision surfaces) and the two under-tested branches of
  # ERR_INVALID_REQUEST - the conditionally required payload fields. The three
  # remaining ids (ERR_MISSING_AUTH_HEADERS, ERR_UNAUTHORIZED,
  # ERR_PRINTER_IDENTITY_MISMATCH) belong to the rbac section, and
  # ERR_STALE_ESCAPE_VERSION to the cross-cutting optimistic-concurrency section.
