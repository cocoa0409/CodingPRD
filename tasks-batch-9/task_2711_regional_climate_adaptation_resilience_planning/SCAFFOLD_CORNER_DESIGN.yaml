      - name: aid_pact_expired_is_evaluated_before_exhausted
        claim_type: Correct Result
        grounds:
          - calculations.aid_unit_ledger.formula
          - entities.MutualAidPact.fields.status
          - endpoints.post_clock_set_current_utc
        distinguishing_aspect: "A pact whose free_units are already 0 reads EXHAUSTED while the clock is inside its window and flips to EXPIRED once the clock reaches window_end, so the temporal check wins over the capacity check on the same row."
        test_recipe:
          setup:
            - "Two ACTIVE Jurisdictions; one shared LifelineAsset owned by Harbor; one MutualAidPact hosted by Harbor pledging 10 COOLING_UNITS over [2026-09-01, 2026-10-01) with max_concurrent_commitments 3; one COMMITTED 10-unit commitment from Ridge over [2026-09-05, 2026-09-15) that consumes the whole pledge."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Harbor City", jurisdiction_code: "CITY-HARBOR", population: 180000, svi_score: 0.62, endorsement_weight: 4 }
              as: RegionalAdministrator
              captures: { j_harbor_id: $.data.id }
            - call: "POST /resilience/jurisdictions"
              payload: { name: "Ridge Town", jurisdiction_code: "TOWN-RIDGE", population: 40000, svi_score: 0.18, endorsement_weight: 3 }
              as: RegionalAdministrator
              captures: { j_ridge_id: $.data.id }
            - call: "POST /resilience/assets"
              payload: { jurisdiction_id: "${j_harbor_id}", asset_class: "HEALTH", name: "Harbor Cooling Centre", replacement_value_cents: 300000000, service_population: 60000, redundancy_factor: 0.10, is_shared: true }
              as: RegionalAdministrator
              captures: { a_shared_id: $.data.id }
            - call: "POST /resilience/mutual-aid-pacts"
              payload: { host_jurisdiction_id: "${j_harbor_id}", resource_class: "COOLING_UNITS", pledged_units: 10, window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", max_concurrent_commitments: 3 }
              as: JurisdictionDelegate
              as_user_id: "${j_harbor_id}"
              captures: { pact_id: $.data.id, pact_v1: $.data.version }
            - call: "POST /resilience/mutual-aid-pacts/${pact_id}/commitments"
              payload: { requesting_jurisdiction_id: "${j_ridge_id}", asset_id: "${a_shared_id}", committed_units: 10, window_start: "2026-09-05T00:00:00Z", window_end: "2026-09-15T00:00:00Z", expected_mutual_aid_pact_version: "${pact_v1}" }
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "GET /resilience/mutual-aid-pacts/${pact_id}"
              payload: {}
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
              captures: { pact_v2: $.data.version }
            - call: "POST /resilience/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: RegionalAdministrator
            - call: "GET /resilience/mutual-aid-pacts/${pact_id}"
              payload: {}
              as: JurisdictionDelegate
              as_user_id: "${j_ridge_id}"
          assert:
            - "first read, clock still at 2026-08-01T00:00:00Z: data.reserved_units == 10, data.free_units == 0 and data.status == EXHAUSTED"
            - "clock call: status 200 and data.current_utc == 2026-10-01T00:00:00Z"
            - "second read: data.status == EXPIRED even though free_units is still 0, because the EXPIRED test precedes the EXHAUSTED test"
            - "reserved_units + free_units == 10 at both reads"

      - name: vulnerability_dual_variant_divergence_excluded
