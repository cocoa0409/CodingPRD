# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3035_digital_make_line_capacity_second_line_throughput
#
# Breadth probe: every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# already covers appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: store_create_returns_defaults_and_computed_fields
        claim_type: Creation
        grounds:
          - entities.Store
          - endpoints.POST_/api/v1/stores
        distinguishing_aspect: "A store created with the seven required fields returns 201 with throttle_state OPEN, both interval loads 0, forecast_day_cents defaulted to 0, and system id/created_at/version 1 — none of the computed fields are client-suppliable."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/stores"
              payload: { store_code: "SC", name: "Corner Store", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 8, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.22 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Store.${store_id}.throttle_state == OPEN"
            - "Store.${store_id}.digital_interval_load == 0 and instore_interval_load == 0"
            - "Store.${store_id}.forecast_day_cents == 0 (default applied)"
            - "Store.${store_id}.version == 1 and id/created_at/updated_at are present"
            - "Store.${store_id}.theoretical_food_cost_cents == 0 and actual_food_cost_cents == 0"

      - name: store_get_by_id_round_trips
        claim_type: Retrieval
        grounds:
          - entities.Store
          - endpoints.GET_/api/v1/stores/{storeId}
        distinguishing_aspect: "GET /stores/{id} returns the exact stored configuration including the input pacing_interval_minutes and overage_threshold_pct."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. One store created."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "SG", name: "Get Store", digital_line_capacity_per_interval: 12, instore_line_capacity_per_interval: 9, pacing_interval_minutes: 20, overage_threshold_pct: 0.75, marketplace_commission_pct: 0.25 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          trigger:
            - call: "GET /api/v1/stores/${store_id}"
              payload: {}
              as: StoreManager
          assert:
            - "the response status is 200"
            - "Store.${store_id}.pacing_interval_minutes == 20 and overage_threshold_pct == 0.75"
            - "Store.${store_id}.digital_line_capacity_per_interval == 12 and instore_line_capacity_per_interval == 9"

      - name: stores_list_paginates
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/v1/stores
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three stores, limit=2 offset=0 returns 2 rows total_count 3 has_more true; offset=2 returns 1 row has_more false."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Three stores."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "L1", name: "One", digital_line_capacity_per_interval: 5, instore_line_capacity_per_interval: 5, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "L2", name: "Two", digital_line_capacity_per_interval: 5, instore_line_capacity_per_interval: 5, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "L3", name: "Three", digital_line_capacity_per_interval: 5, instore_line_capacity_per_interval: 5, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/v1/stores"
              payload: { limit: 2, offset: 0 }
              as: GeneralManager
              as_user_id: "gm-q"
          assert:
            - "the response status is 200 and response_type is array"
            - "returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /stores?limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"

      - name: store_get_unknown_id_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/v1/stores/{storeId}
          - errors.ERR_STORE_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated storeId yields the entity-specific 404 ERR_STORE_NOT_FOUND, not a generic error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. No stores."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/v1/stores/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: StoreManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_STORE_NOT_FOUND"
            - "response_type is error and data carries error_id and message"

      - name: ingredient_create_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Ingredient.fields.par_level_grams
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "par_level_grams is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, hold_time_minutes: 60, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /ingredients returns 0 rows"

      - name: menu_item_digital_eligible_defaults_true
        claim_type: Defaults
        grounds:
          - entities.MenuItem.fields.is_digital_eligible
        distinguishing_aspect: "is_digital_eligible declares default true; omitting it stores true rather than null."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. One store."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "MD", name: "Menu Default", digital_line_capacity_per_interval: 5, instore_line_capacity_per_interval: 5, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
          trigger:
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_id: $.data.id }
          assert:
            - "the response status is 201"
            - "MenuItem.${item_id}.is_digital_eligible == true"
            - "MenuItem.${item_id}.suppression_state == SELLABLE"

      - name: menu_item_theoretical_cost_recomputed_on_component_add
        claim_type: Computed Fields
        grounds:
          - entities.MenuItem.fields.theoretical_cost_cents
          - endpoints.POST_/api/v1/menu-items/{menuItemId}/recipe-components
        distinguishing_aspect: "theoretical_cost_cents is computed; after adding chicken 120g @2.1 and rice 180g @0.8 the item's theoretical cost is 396 (252+144), and a client-supplied theoretical_cost_cents is ignored."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store, two ingredients."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "MC", name: "Menu Cost", digital_line_capacity_per_interval: 5, instore_line_capacity_per_interval: 5, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 60, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "RICE", display_name: "Rice", unit_cost_cents_per_gram: 0.8, par_level_grams: 5000, hold_time_minutes: 90, batch_size_grams: 4000 }
              as: PlatformAdmin
              captures: { ing_rice: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /api/v1/menu-items/${item_id}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/menu-items/${item_id}/recipe-components"
              payload: { ingredient_id: "${ing_rice}", standard_grams: 180 }
              as: StoreManager
            - call: "GET /api/v1/menu-items/${item_id}"
              payload: {}
              as: StoreManager
          assert:
            - "MenuItem.${item_id}.theoretical_cost_cents == 396"
            - "the recomputation happens on the second component add (252 + 144)"

      - name: batch_create_extra_field_status_is_ignored_input
        claim_type: System Fields
        grounds:
          - entities.IngredientBatch.fields.status
          - endpoints.POST_/api/v1/ingredients/{ingredientId}/batches
        distinguishing_aspect: "IngredientBatch.status is source system; a client-supplied status field is ignored and the batch is created ACTIVE."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store and ingredient exist."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "SB", name: "Batch Store", digital_line_capacity_per_interval: 5, instore_line_capacity_per_interval: 5, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 60, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
          trigger:
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 1000, status: "EXPIRED" }
              as: StoreManager
              captures: { batch_id: $.data.id }
          assert:
            - "the response status is 201"
            - "IngredientBatch.${batch_id}.status == ACTIVE (client-supplied EXPIRED ignored)"
            - "IngredientBatch.${batch_id}.grams_remaining == 1000"

      - name: channel_create_invalid_markup_enum_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.MarketplaceChannel.fields.markup_pct
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "markup_pct must be a non-negative number; a negative value is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/v1/marketplace-channels"
              payload: { channel_code: "BAD", markup_pct: -0.5, commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"

      - name: order_line_requires_valid_parent_order
        claim_type: Parent Relationships
        grounds:
          - entities.OrderLine.fields.order_id
          - endpoints.GET_/api/v1/orders/{orderId}/lines
        distinguishing_aspect: "OrderLine is a child of Order; listing lines for a non-existent order returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/v1/orders/00000000-0000-4000-8000-000000000000/lines"
              payload: {}
              as: StoreManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ORDER_NOT_FOUND"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: order_initial_state_is_accepted_on_successful_place
        claim_type: Initial State
        grounds:
          - state_machines.Order
          - endpoints.POST_/api/v1/stores/{storeId}/orders
        distinguishing_aspect: "A successfully placed order reports fulfillment_status ACCEPTED (the PLACED->ACCEPTED system transition is atomic with creation), payment AUTHORIZED, accuracy UNVERIFIED."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Store, BOWL, stock, window."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "IS", name: "Init Store", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /api/v1/menu-items/${item_id}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
          trigger:
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_id}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { order_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Order.${order_id}.fulfillment_status == ACCEPTED"
            - "Order.${order_id}.payment_status == AUTHORIZED"
            - "Order.${order_id}.accuracy_status == UNVERIFIED"
            - "Order.${order_id}.line == IN_STORE"

      - name: pickup_from_terminal_picked_up_is_rejected
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Order
          - errors.ERR_ALREADY_TERMINAL
        distinguishing_aspect: "From terminal PICKED_UP no further transition is possible; a second pickup returns 409 ERR_ALREADY_TERMINAL."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. Full pipeline store; one order driven to PICKED_UP."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "TL", name: "Terminal Lock", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /api/v1/ingredients"
              payload: { ingredient_code: "CHICKEN", display_name: "Chicken", unit_cost_cents_per_gram: 2.1, par_level_grams: 5000, hold_time_minutes: 240, batch_size_grams: 3000 }
              as: PlatformAdmin
              captures: { ing_chicken: $.data.id }
            - call: "POST /api/v1/ingredients/${ing_chicken}/batches"
              payload: { store_id: "${store_id}", cooked_at: "2026-09-01T09:00:00Z", grams_cooked: 10000 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/menu-items"
              payload: { item_code: "BOWL", display_name: "Bowl", base_price_cents: 1095 }
              as: StoreManager
              captures: { item_id: $.data.id }
            - call: "POST /api/v1/menu-items/${item_id}/recipe-components"
              payload: { ingredient_id: "${ing_chicken}", standard_grams: 120 }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/production-windows"
              payload: { interval_start: "2026-09-01T10:15:00Z", interval_end: "2026-09-01T10:30:00Z" }
              as: StoreManager
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments"
              payload: { shift_date: "2026-09-01", predicted_digital_mix_pct: 0.5, predicted_instore_mix_pct: 0.5, headcount: 4, expected_store_version: "${store_v0}" }
              as: StoreManager
              captures: { deploy_id: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments/${deploy_id}/publish"
              payload: {}
              as: StoreManager
              as_user_id: "sm-pat"
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments/${deploy_id}/lock"
              payload: {}
              as: GeneralManager
              as_user_id: "gm-quinn"
            - call: "POST /api/v1/stores/${store_id}/orders"
              payload: { channel: "IN_STORE", lines: [{ menu_item_id: "${item_id}", quantity: 1, customizations: [] }] }
              as: LineWorker
              as_user_id: "lw-1"
              captures: { order_id: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/orders/${order_id}/start-production"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_id}/verify-accuracy"
              payload: { line_results: [{ menu_item_id: "${item_id}", matched: true }] }
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_id}/mark-ready"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
            - call: "POST /api/v1/stores/${store_id}/orders/${order_id}/pickup"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
          trigger:
            - call: "POST /api/v1/stores/${store_id}/orders/${order_id}/pickup"
              payload: {}
              as: LineWorker
              as_user_id: "lw-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ALREADY_TERMINAL"
            - "Order.${order_id}.fulfillment_status still == PICKED_UP"

      - name: deployment_publish_supersedes_existing_published
        claim_type: Side Effect Execution
        grounds:
          - state_machines.StaffingDeployment
        distinguishing_aspect: "Publishing a new deployment for a shift_date already covered by a PUBLISHED deployment drives the older one to SUPERSEDED (bubble/cross-instance side effect)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T10:00:00Z. One store. Deployment A published for 2026-09-01."
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T10:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/v1/stores"
              payload: { store_code: "DS", name: "Deploy Store", digital_line_capacity_per_interval: 10, instore_line_capacity_per_interval: 10, pacing_interval_minutes: 15, overage_threshold_pct: 0.8, marketplace_commission_pct: 0.2 }
              as: PlatformAdmin
              captures: { store_id: $.data.id, store_v0: $.data.version }
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments"
              payload: { shift_date: "2026-09-01", predicted_digital_mix_pct: 0.5, predicted_instore_mix_pct: 0.5, headcount: 4, expected_store_version: "${store_v0}" }
              as: StoreManager
              captures: { deploy_a: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments/${deploy_a}/publish"
              payload: {}
              as: StoreManager
              as_user_id: "sm-pat"
          trigger:
            - call: "GET /api/v1/stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { store_v_now: $.data.version }
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments"
              payload: { shift_date: "2026-09-01", predicted_digital_mix_pct: 0.6, predicted_instore_mix_pct: 0.4, headcount: 6, expected_store_version: "${store_v_now}" }
              as: StoreManager
              captures: { deploy_b: $.data.id }
            - call: "POST /api/v1/stores/${store_id}/staffing-deployments/${deploy_b}/publish"
              payload: {}
              as: StoreManager
              as_user_id: "sm-pat"
          assert:
            - "StaffingDeployment.${deploy_a}.status == SUPERSEDED"
