# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_3226_independent_film_acquisition_festival_premiere_strategy_awards
#
# Breadth probe. Enumerates testable claims that §1.8 does not already cover.
# Corner instances §1.8 already exercises appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # §1.9 — Entities
  # ===========================================================================
  - section: entities
    instances:

      - name: film_create_returns_declared_fields_and_initial_state
        claim_type: Creation
        grounds:
          - entities.Film
          - endpoints.POST_/films
        distinguishing_aspect: "POST /films with valid inputs returns 201, response carries system-minted id, created_at, updated_at, version=1, and the three computed postures default to SHOPPING/PRE_ACQUISITION/INELIGIBLE."
        test_recipe:
          setup:
            - "Logical clock at default 2026-09-01T00:00:00Z. Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /films"
              payload: { title: "Meridian", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 102, production_budget_cents: 2000000 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
          assert:
            - "response status 201; response_type object"
            - "Film.${film_id}.acquisition_status == SHOPPING"
            - "Film.${film_id}.release_posture == PRE_ACQUISITION"
            - "Film.${film_id}.awards_posture == INELIGIBLE"
            - "Film.${film_id}.version == 1"

      - name: film_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/films
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three films, limit=2 offset=0 returns 2 rows with total_count=3 has_more=true; offset=2 returns 1 row has_more=false; default limit=10 returns all 3."
        test_recipe:
          setup:
            - "Empty DB. Logical clock at default."
          setup_api_calls:
            - call: "POST /films"
              payload: { title: "F1", director_name: "D1", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "F2", director_name: "D2", principal_cast: ["X"], genre: "COMEDY", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "F3", director_name: "D3", principal_cast: ["X"], genre: "HORROR", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
          trigger:
            - call: "GET /films"
              payload: { limit: 2, offset: 0 }
              as: AcquisitionExec
          assert:
            - "returns 2 rows with total_count == 3 and has_more == true"
            - "GET /films?limit=2&offset=2 returns 1 row, has_more == false"
            - "GET /films?genre=HORROR returns exactly 1 row"

      - name: film_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/films/{film_id}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID on /films/{id} returns 404 ERR_NOT_FOUND, not 400."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /films/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: AcquisitionExec
              captures: { err: $.data.error_id }
          assert:
            - "response status 404"
            - "error_id == ERR_NOT_FOUND"

      - name: film_create_missing_runtime_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Film.fields.runtime_minutes
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Omitting required field runtime_minutes returns 400 ERR_INVALID_REQUEST; no Film row is persisted."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 400"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /films returns 0 rows"

      - name: film_create_invalid_genre_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Film.fields.genre
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "genre is a closed enum; value ROMANCE is rejected with 400 ERR_INVALID_REQUEST, not silently coerced."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "ROMANCE", runtime_minutes: 100, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response status 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: statement_immutable_no_update_endpoint
        claim_type: Immutability
        grounds:
          - entities.FilmmakerStatement
        distinguishing_aspect: "FilmmakerStatement declares common_fields: false — there is no PUT/PATCH/DELETE endpoint for statements; only POST create, GET, and POST /finalize."
        test_recipe:
          setup: ["Acquired film."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /films/${film_id}/statements"
              payload: { deal_id: "${deal_id}", period_label: "Q1-2027", basis: "GROSS_RECEIPTS", gross_receipts_cents: 10000000 }
              as: ParticipationAccountant
              captures: { st_id: $.data.id }
          trigger:
            - call: "GET /films/${film_id}/statements/${st_id}"
              payload: {}
              as: ParticipationAccountant
          assert:
            - "FilmmakerStatement.${st_id} has id and created_at but no updated_at and no version (common_fields: false)"
            - "There is no PUT or PATCH /films/{film_id}/statements/{id} endpoint declared in §1.5 (structural claim — confirmed by absence)"

  # ===========================================================================
  # §1.9 — State Machines
  # ===========================================================================
  - section: state_machines
    instances:

      - name: offer_accept_from_rejected_state_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.AcquisitionOffer
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "AcquisitionOffer in REJECTED state cannot be accepted; second accept attempt fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Film F with offer O1; O1 rejected."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "POST /films/${film_id}/offers/${offer_id}/reject"
              payload: {}
              as: AcquisitionExec
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v: $.data.version }
          trigger:
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v}" }
              as: AcquisitionExec
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "response status 409"

      - name: terminal_state_lockdown_passed_film_rejects_new_offer
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Film.acquisition_status
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "PASSED is terminal for acquisition_status; creating a new offer on a PASSED film is rejected."
        test_recipe:
          setup: ["Film F PASSED."]
          setup_api_calls:
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/pass"
              payload: {}
              as: AcquisitionExec
          trigger:
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (or ERR_TERRITORY_UNKNOWN if territory missing; here US not registered so ERR_TERRITORY_UNKNOWN expected, but state precedence means INVALID_STATE wins)"
            - "response status 409"

      - name: fulfill_before_window_end_returns_fulfill_too_early
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TalentObligation.CONFIRMED_to_FULFILLED
          - errors.ERR_FULFILL_TOO_EARLY
        distinguishing_aspect: "Fulfill before logical clock reaches window_ends_at is rejected with ERR_FULFILL_TOO_EARLY; obligation remains CONFIRMED."
        test_recipe:
          setup: ["Film F; obligation OB CONFIRMED for 2026-12-01T10:00-12:00; logical clock still at default 2026-09-01."]
          setup_api_calls:
            - call: "POST /films"
              payload: { title: "M", director_name: "Ana Ruiz", principal_cast: ["Jae Park"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/talent-obligations"
              payload: { talent_name: "Jae Park", obligation_kind: "PRESS_JUNKET", window_starts_at: "2026-12-01T10:00:00Z", window_ends_at: "2026-12-01T12:00:00Z", city_code: "NY" }
              as: TalentCoordinator
              captures: { ob_id: $.data.id }
            - call: "POST /films/${film_id}/talent-obligations/${ob_id}/confirm"
              payload: {}
              as: TalentCoordinator
          trigger:
            - call: "POST /films/${film_id}/talent-obligations/${ob_id}/fulfill"
              payload: {}
              as: TalentCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FULFILL_TOO_EARLY"
            - "TalentObligation.${ob_id}.status remains CONFIRMED"

      - name: campaign_submit_idempotent_when_already_submitted
        claim_type: Idempotency
        grounds:
          - state_machines.AwardsCampaign.ACTIVE_to_SUBMITTED
        distinguishing_aspect: "Second submit on an already-SUBMITTED campaign is rejected with ERR_INVALID_STATE (no double-submission)."
        test_recipe:
          setup: ["Acquired film with premiere booked; campaign OSCARS ACTIVE with zero obligations; submitted once."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /festivals"
              payload: { code: "SUNDANCE", name: "Sundance", start_date: "2027-01-21T00:00:00Z", end_date: "2027-01-31T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-01-22T20:00:00Z", screening_ends_at: "2027-01-22T22:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { slot_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
            - call: "GET /films/${film_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { film_v2: $.data.version }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/book"
              payload: { expected_film_version: "${film_v2}" }
              as: FestivalProgrammer
            - call: "POST /films/${film_id}/awards-campaigns"
              payload: { deal_id: "${deal_id}", awards_body: "OSCARS", target_categories: ["BEST_PICTURE"], budget_total_cents: 1000000 }
              as: AwardsStrategist
              captures: { campaign_id: $.data.id }
            - call: "POST /films/${film_id}/awards-campaigns/${campaign_id}/activate"
              payload: {}
              as: AwardsStrategist
            - call: "POST /films/${film_id}/awards-campaigns/${campaign_id}/submit"
              payload: {}
              as: AwardsStrategist
          trigger:
            - call: "POST /films/${film_id}/awards-campaigns/${campaign_id}/submit"
              payload: {}
              as: AwardsStrategist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "AwardsCampaign.${campaign_id}.status remains SUBMITTED"

  # ===========================================================================
  # §1.9 — Calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: deal_pa_shortfall_reconciles_after_each_spend
        claim_type: Correct Result
        grounds:
          - calculations.deal_pa_reconciliation
          - entities.AcquisitionDeal.fields.pa_shortfall_cents
        distinguishing_aspect: "P&A shortfall = commit - (theatrical + awards) — verified incrementally after each spend."
        test_recipe:
          setup: ["Acquired film with premiere booked; deal commit 5000000; campaign ACTIVE budget 2000000."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 5000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
            - call: "POST /festivals"
              payload: { code: "SUNDANCE", name: "Sundance", start_date: "2027-01-21T00:00:00Z", end_date: "2027-01-31T00:00:00Z", prestige_tier: "A_LIST", default_review_embargo_hours: 24 }
              as: PlatformAdmin
              captures: { fest_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots"
              payload: { section: "COMPETITION", screening_starts_at: "2027-01-22T20:00:00Z", screening_ends_at: "2027-01-22T22:00:00Z", review_embargo_lifts_at: "2027-01-23T08:00:00Z" }
              as: FestivalProgrammer
              captures: { slot_id: $.data.id }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/hold"
              payload: { film_id: "${film_id}" }
              as: FestivalProgrammer
            - call: "GET /films/${film_id}"
              payload: {}
              as: FestivalProgrammer
              captures: { film_v2: $.data.version }
            - call: "POST /festivals/${fest_id}/premiere-slots/${slot_id}/book"
              payload: { expected_film_version: "${film_v2}" }
              as: FestivalProgrammer
            - call: "POST /films/${film_id}/awards-campaigns"
              payload: { deal_id: "${deal_id}", awards_body: "OSCARS", target_categories: ["BEST_PICTURE"], budget_total_cents: 2000000 }
              as: AwardsStrategist
              captures: { campaign_id: $.data.id }
            - call: "POST /films/${film_id}/awards-campaigns/${campaign_id}/activate"
              payload: {}
              as: AwardsStrategist
          trigger:
            - call: "POST /deals/${deal_id}/report-theatrical-spend"
              payload: { amount_cents: 1000000 }
              as: DistributionExec
              captures: { shortfall_1: $.data.pa_shortfall_cents }
            - call: "POST /awards-campaigns/${campaign_id}/spends"
              payload: { category: "PUBLICITY", amount_cents: 500000, incurred_at: "2026-10-01T00:00:00Z", target_category: "BEST_PICTURE" }
              as: AwardsStrategist
            - call: "GET /deals/${deal_id}"
              payload: {}
              as: ParticipationAccountant
              captures: { shortfall_2: $.data.pa_shortfall_cents }
          assert:
            - "shortfall_1 == 4000000 (5000000 - 1000000 - 0)"
            - "shortfall_2 == 3500000 (5000000 - 1000000 - 500000)"
            - "AcquisitionDeal.${deal_id}.pa_spent_theatrical_cents == 1000000"
            - "AcquisitionDeal.${deal_id}.pa_spent_awards_cents == 500000"

  # ===========================================================================
  # §1.9 — Validations
  # ===========================================================================
  - section: validations
    instances:

      - name: missing_x_user_role_returns_unauthenticated
        claim_type: Violation → Error
        grounds:
          - validations.priority_1_auth
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: "Missing X-User-Role header returns 401 ERR_UNAUTHENTICATED on any endpoint."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /films/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response status 401"
            - "error_id == ERR_UNAUTHENTICATED"

      - name: acquisition_exec_cannot_create_territory
        claim_type: Violation → Error
        grounds:
          - validations.priority_2_auth
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "POST /territories is PlatformAdmin-exclusive; AcquisitionExec gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: AcquisitionExec
              captures: { err: $.data.error_id }
          assert:
            - "response status 403"
            - "error_id == ERR_FORBIDDEN"

      - name: home_ent_window_on_ineligible_territory_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_11_business_constraint
          - errors.ERR_WINDOW_NOT_AVAILABLE
        distinguishing_aspect: "Offer requesting HOME_ENT for a territory whose is_home_ent_eligible is false is rejected at accept time."
        test_recipe:
          setup: ["Territory JP registered with is_home_ent_eligible=false; film with offer requesting HOME_ENT in JP."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "JP", name: "Japan", is_home_ent_eligible: false }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["JP"], requested_windows: ["HOME_ENT"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v: $.data.version }
          trigger:
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v}" }
              as: AcquisitionExec
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WINDOW_NOT_AVAILABLE"
            - "response status 422"
            - "GET /films/${film_id}/deals returns 0 rows"

  # ===========================================================================
  # §1.9 — Endpoints
  # ===========================================================================
  - section: endpoints
    instances:

      - name: counter_offer_action_endpoint_returns_new_offer
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/films/{film_id}/offers/{offer_id}/counter
        distinguishing_aspect: "Counter returns 201 with a new AcquisitionOffer body (not the original) carrying round_number=2."
        test_recipe:
          setup: ["Film F; one OPEN offer round 1."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /films/${film_id}/offers/${o1}/counter"
              payload: { buyer_code: "NEON", upfront_price_cents: 2000000, backend_participation_pct: 0.12, prints_advertising_commit_cents: 1500000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { o2: $.data.id, r2: $.data.round_number }
          assert:
            - "response status 201"
            - "AcquisitionOffer.${o2}.round_number == 2"
            - "AcquisitionOffer.${o2}.status == OPEN"
            - "AcquisitionOffer.${o1}.status == COUNTERED"

      - name: list_endpoints_support_filter_query_params
        claim_type: Computed read
        grounds:
          - endpoints.GET_/films/{film_id}/offers
          - endpoints.GET_/deals/{deal_id}/rights-grants
        distinguishing_aspect: "Filtered list endpoints accept query params (status, window, territory_code) and return only matching rows."
        test_recipe:
          setup: ["Acquired film with THEATRICAL+HOME_ENT rights on US and FR."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /territories"
              payload: { code: "FR", name: "France", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US", "FR"], requested_windows: ["THEATRICAL", "HOME_ENT"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { offer_id: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v: $.data.version }
            - call: "POST /films/${film_id}/offers/${offer_id}/accept"
              payload: { expected_film_version: "${film_v}" }
              as: AcquisitionExec
              captures: { deal_id: $.data.id }
          trigger:
            - call: "GET /deals/${deal_id}/rights-grants"
              payload: { territory_code: "US" }
              as: AcquisitionExec
            - call: "GET /deals/${deal_id}/rights-grants"
              payload: { window: "HOME_ENT" }
              as: AcquisitionExec
          assert:
            - "territory_code=US returns 2 rows (THEATRICAL, HOME_ENT)"
            - "window=HOME_ENT returns 2 rows (US, FR)"
            - "no filter returns 4 rows"

  # ===========================================================================
  # §1.9 — Errors
  # ===========================================================================
  - section: errors
    instances:

      - name: stale_film_version_on_offer_accept_returns_412
        claim_type: Violation → Error
        grounds:
          - concurrency_rules[offer-accept-stale-film]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "Offer accept with expected_film_version one less than current is rejected with 412 ERR_STALE_VERSION (OCC)."
        test_recipe:
          setup: ["Film F; offer O1; client observed version v before counter. Counter increments Film.version."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id, film_v1: $.data.version }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { o1: $.data.id }
            # Counter bumps film.version (so film_v1 is now stale)
            - call: "POST /films/${film_id}/offers/${o1}/counter"
              payload: { buyer_code: "A24", upfront_price_cents: 2000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              captures: { o2: $.data.id }
          trigger:
            - call: "POST /films/${film_id}/offers/${o2}/accept"
              payload: { expected_film_version: "${film_v1}" }
              as: AcquisitionExec
              captures: { err: $.data.error_id }
          assert:
            - "response status 412"
            - "error_id == ERR_STALE_VERSION"
            - "AcquisitionOffer.${o2}.status remains OPEN"

      - name: duty_separation_offer_creator_cannot_accept
        claim_type: Violation → Error
        grounds:
          - validations.priority_6_business_safety
          - errors.ERR_DUTY_SEPARATION_VIOLATION
        distinguishing_aspect: "Same X-User-ID that created the offer attempts to accept it; rejected with 403 ERR_DUTY_SEPARATION_VIOLATION."
        test_recipe:
          setup: ["Film F; offer O1 created by AcquisitionExec user 'exec-1'."]
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "US", name: "United States", is_home_ent_eligible: true }
              as: PlatformAdmin
            - call: "POST /films"
              payload: { title: "M", director_name: "D", principal_cast: ["X"], genre: "DRAMA", runtime_minutes: 90, production_budget_cents: 100 }
              as: PlatformAdmin
              captures: { film_id: $.data.id }
            - call: "POST /films/${film_id}/offers"
              payload: { buyer_code: "A24", upfront_price_cents: 1000000, backend_participation_pct: 0.10, prints_advertising_commit_cents: 1000000, requested_territory_codes: ["US"], requested_windows: ["THEATRICAL"], expiry_at: "2026-12-31T00:00:00Z" }
              as: AcquisitionExec
              as_user_id: "exec-1"
              captures: { o1: $.data.id }
            - call: "GET /films/${film_id}"
              payload: {}
              as: AcquisitionExec
              captures: { film_v: $.data.version }
          trigger:
            - call: "POST /films/${film_id}/offers/${o1}/accept"
              payload: { expected_film_version: "${film_v}" }
              as: AcquisitionExec
              as_user_id: "exec-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status 403"
            - "error_id == ERR_DUTY_SEPARATION_VIOLATION"

  # ===========================================================================
  # §1.9 — RBAC
  # ===========================================================================
  - section: rbac
    instances:

      - name: festival_programmer_cannot_create_offers
        claim_type: Violation → Error
        grounds:
          - roles.FestivalProgrammer
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "FestivalProgrammer attempting POST /films/{id}/offers gets 403 ERR_FORBIDDEN (AcquisitionExec-exclusive)."
        test_recipe:
