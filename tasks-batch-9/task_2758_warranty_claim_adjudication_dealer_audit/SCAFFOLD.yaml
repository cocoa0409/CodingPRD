scenario: |
  Warranty Claim Adjudication & Dealer Audit (automaker warranty administration): claim
  submission with labor operation, part causal identification and repair narrative validation,
  coverage determination against warranty terms, mileage limits, and prior repair history,
  automated edits for duplicate, overlapping and excessive-time claims with suspension for
  review, parts return program for failed component analysis with claim debit on non-return,
  dealer labor rate and parts markup approval processes by state law, warranty expense per
  vehicle analytics with dealer outlier detection, on-site dealer audit with chargeback of
  unsupported claims and appeal rights, policy adjustment and goodwill authorization limits

domain_name: warranty-claim-adjudication-dealer-audit
api_prefix: "/warranty"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: graph
  # Peer entities linked by foreign keys plus a self-referential claim edge
  # (WarrantyClaim.resubmission_of_claim_id, ClaimEdit.conflicting_claim_id) and a
  # many-to-many bridge (AuditFinding joins DealerAudit x WarrantyClaim; AuditAppeal
  # re-joins the same findings). No strict ownership tree: a claim is co-owned by a
  # Dealer, a Vehicle, a LaborOperation and a PartCatalogItem.

  state_machine_shape: cyclic
  # WarrantyClaim.status cycles SUSPENDED -> SUBMITTED (resubmit) and carries a second,
  # independent payment_status dimension; DealerAudit cycles
  # FINDINGS_ISSUED -> APPEALED -> FINDINGS_ISSUED on DENIED/PARTIALLY_GRANTED appeal
  # rounds; PartsReturnRequest cycles NOT_RETURNED -> RECEIVED on a late return;
  # Dealer posture cycles ACTIVE -> PROBATION/SUSPENDED -> ACTIVE.

  relationship_patterns:
    - one_to_many          # Dealer -> WarrantyClaim, DealerAudit -> AuditFinding
    - many_to_many         # AuditFinding bridges DealerAudit x WarrantyClaim
    - self_referential     # WarrantyClaim.resubmission_of_claim_id -> WarrantyClaim.id
    - polymorphic          # ChargebackLedgerEntry.source_id points at a return/finding/appeal
    - cross_aggregate      # PartsReturnRequest mutates Dealer via WarrantyClaim

  role_model: segregation_of_duties
  # The AppealReviewer who decides an appeal must not be the audit's lead auditor, and the
  # AdjudicationManager who decides a goodwill authorization must not be the ClaimAdjudicator
  # who requested it. Both are enforced on X-User-ID, ahead of state checks.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 14 entities / 49 endpoints / 38 error codes / 9 calculations (4 carrying variants) /
  # 8 state machines. The surface is wide only where reverse-reachability GETs demand it;
  # the density lives in the nine calculations and the two five-hop cascades.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: StateLawProfile
    parent: null
    common_fields: false
    description: >
      Configuration entity holding one US state's warranty-reimbursement statute parameters.
      Never mutated after creation; a Dealer points at exactly one profile.
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no type prefix. Identity only; never a decision input.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC with exactly three fractional digits.
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code.
        constraints: "exactly 2 uppercase letters; unique across StateLawProfile"
      - name: markup_cap_pct
        type: number
        source: input
        description: Statutory ceiling on dealer parts markup, as a decimal fraction.
        constraints: "0.00 <= markup_cap_pct <= 1.00; 2 decimal places"
      - name: labor_rate_method
        type: enum
        source: input
        description: Statutory method for establishing the warranty labor rate ceiling.
        constraints: "one of {RETAIL_SAMPLE, TIME_AND_PRICE}"
      - name: min_sample_repair_orders
        type: integer
        source: input
        description: Minimum customer-pay repair orders a RETAIL_SAMPLE rate request must cite.
        constraints: ">= 0"
      - name: max_labor_rate_cents
        type: integer
        source: input
        description: Absolute statutory cap on the hourly warranty labor rate, in cents.
        constraints: "> 0"
      - name: deemed_approved_days
        type: integer
        source: input
        description: Days after which a still-SUBMITTED LaborRateRequest is deemed approved.
        constraints: "> 0"
      - name: appeal_window_days
        type: integer
        source: input
        description: Days a dealer has to appeal issued audit findings.
        constraints: "> 0"

  - name: Dealer
    parent: null
    common_fields: true
    description: >
      A franchised dealer. Carries the currently approved labor rate and parts markup, the
      derived warranty-expense posture, and the running chargeback balance.
    fields:
      - name: dealer_code
        type: string
        source: input
        description: Manufacturer dealer code.
        constraints: "non-empty; unique across Dealer"
      - name: name
        type: string
        source: input
        description: Dealer legal name.
        constraints: non-empty
      - name: state_law_profile_id
        type: string
        source: input
        description: FK -> StateLawProfile.id; the statute governing this dealer's rates.
      - name: approved_labor_rate_cents
        type: integer
        source: computed
        description: >
          Currently approved hourly warranty labor rate in cents. Initialized from
          initial_labor_rate_cents; overwritten only by a LaborRateRequest reaching APPROVED.
        constraints: "> 0"
      - name: approved_parts_markup_pct
        type: number
        source: computed
        description: >
          Currently approved parts markup as a decimal fraction. Initialized from
          initial_parts_markup_pct; overwritten only by a LaborRateRequest reaching APPROVED.
          May legitimately exceed the state cap when grandfathered at onboarding; the cap is
          applied at final adjudication, not here.
        constraints: "0.00 <= approved_parts_markup_pct <= 1.00"
      - name: labor_rate_effective_date
        type: string
        source: computed
        description: >
          YYYY-MM-DD effective date of the currently approved rate; null until the first
          LaborRateRequest reaches APPROVED.
        default: null
      - name: vehicles_in_operation
        type: integer
        source: input
        description: Denominator for warranty-expense-per-vehicle analytics.
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: >
          Posture derived from chargeback_balance_cents on every ledger append; gates claim
          submission and suspends the dealer's SUBMITTED claims.
        default: ACTIVE
        constraints: "one of {ACTIVE, PROBATION, SUSPENDED}"
      - name: chargeback_balance_cents
        type: integer
        source: computed
        description: >
          Signed sum of every ChargebackLedgerEntry.amount_cents for this dealer. Invariant:
          equals that sum exactly at all times.
        default: 0
      - name: open_parts_return_count
        type: integer
        source: computed
        description: >
          Count of PartsReturnRequest rows with status == REQUESTED whose claim belongs to
          this dealer. Invariant: equals that count exactly at all times.
        default: 0
      - name: audit_hold
        type: boolean
        source: computed
        description: >
          True iff at least one DealerAudit for this dealer has status IN
          {IN_FIELD, FINDINGS_ISSUED, APPEALED}. Blocks claim payment while true.
        default: false
      - name: outlier_flag
        type: boolean
        source: computed
        description: >
          Last value computed by the warranty_expense_per_vehicle calculation; refreshed on
          every GET /warranty/dealers/{id}/expense-analytics call for this dealer.
        default: false

  - name: LaborRateRequest
    parent: null
    common_fields: true
    description: >
      A dealer's petition to raise its warranty labor rate and/or parts markup. Adjudicated
      against the state law profile; auto-approved at its requested values if the manufacturer
      lets the statutory clock run out.
    fields:
      - name: dealer_id
        type: string
        source: input
        description: FK -> Dealer.id; the petitioning dealer.
      - name: state_law_profile_id
        type: string
        source: computed
        description: >
          FK -> StateLawProfile.id; snapshot of Dealer.state_law_profile_id at creation, so a
          later dealer re-assignment cannot retroactively change this request's ceiling.
      - name: requested_labor_rate_cents
        type: integer
        source: input
        description: Hourly rate the dealer is asking for, in cents.
        constraints: "> 0"
      - name: requested_parts_markup_pct
        type: number
        source: input
        description: Parts markup the dealer is asking for, as a decimal fraction.
        constraints: "0.00 <= requested_parts_markup_pct <= 1.00; 2 decimal places"
      - name: sample_repair_order_count
        type: integer
        source: input
        description: Number of customer-pay repair orders cited in the retail sample.
        constraints: ">= 0"
      - name: sample_median_rate_cents
        type: integer
        source: input
        description: Median customer-pay hourly rate across the cited sample, in cents.
        constraints: ">= 0"
      - name: effective_date
        type: string
        source: input
        description: YYYY-MM-DD date the requested rate would take effect.
      - name: statutory_ceiling_cents
        type: integer
        source: computed
        description: >
          Output of the labor_rate_statutory_ceiling calculation, pinned at creation from the
          state law profile, the sample and the dealer's current approved rate.
      - name: status
        type: enum
        source: computed
        description: Lifecycle state; see the LaborRateRequest state machine.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, UNDER_REVIEW, APPROVED, DENIED, WITHDRAWN}"
      - name: approved_labor_rate_cents
        type: integer
        source: computed
        description: >
          Rate actually granted. Null until APPROVED; equals requested_labor_rate_cents when
          approval came from the deemed-approval sweep.
        default: null
      - name: approved_parts_markup_pct
        type: number
        source: computed
        description: >
          Markup actually granted. Null until APPROVED; equals requested_parts_markup_pct when
          approval came from the deemed-approval sweep.
        default: null
      - name: deemed_approved
        type: boolean
        source: computed
        description: True iff this request reached APPROVED through the deemed-approval sweep.
        default: false
      - name: denial_reason
        type: string
        source: computed
        description: Free text recorded when the request is DENIED; null otherwise.
        default: null

  - name: Vehicle
    parent: null
    common_fields: false
    description: >
      A warranted vehicle. Immutable configuration of warranty terms; claims are validated
      against these limits.
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no type prefix. Identity only; never a decision input.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC with exactly three fractional digits.
      - name: vin
        type: string
        source: input
        description: Vehicle identification number.
        constraints: "exactly 17 characters; unique across Vehicle"
      - name: model_year
        type: integer
        source: input
        description: Model year.
        constraints: "1980 <= model_year <= 2100"
      - name: warranty_start_date
        type: string
        source: input
        description: YYYY-MM-DD warranty start (in-service) date.
      - name: in_service_odometer
        type: integer
        source: input
        description: Odometer reading in miles at warranty start; baseline for miles-used.
        constraints: ">= 0"
      - name: basic_months
        type: integer
        source: input
        description: Basic (bumper-to-bumper) coverage duration in months.
        constraints: "> 0"
      - name: basic_miles
        type: integer
        source: input
        description: Basic coverage mileage limit, measured from in_service_odometer.
        constraints: "> 0"
      - name: powertrain_months
        type: integer
        source: input
        description: Powertrain coverage duration in months.
        constraints: ">= basic_months"
      - name: powertrain_miles
        type: integer
        source: input
        description: Powertrain coverage mileage limit, measured from in_service_odometer.
        constraints: ">= basic_miles"

  - name: LaborOperation
    parent: null
    common_fields: false
    description: >
      Flat-rate labor operation catalog entry. Supplies the standard time used to cap
      reimbursed hours, the excessive-time edit threshold, and the overlap group used for
      repeat/overlapping repair detection.
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no type prefix. Identity only; never a decision input.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC with exactly three fractional digits.
      - name: op_code
        type: string
        source: input
        description: Labor operation code.
        constraints: "non-empty; unique across LaborOperation"
      - name: description
        type: string
        source: input
        description: Human-readable operation description.
        constraints: non-empty
      - name: standard_time_hours
        type: number
        source: input
        description: Flat-rate standard time in hours; caps reimbursed labor at final adjudication.
        constraints: "> 0; 1 decimal place"
      - name: max_time_hours
        type: number
        source: input
        description: Absolute ceiling on claimable hours; above it the claim is rejected outright.
        constraints: ">= standard_time_hours; 1 decimal place"
      - name: category
        type: enum
        source: input
        description: Coverage bucket this operation is adjudicated under.
        constraints: "one of {BASIC, POWERTRAIN}"
      - name: requires_causal_part
        type: boolean
        source: input
        description: When true, a claim citing this operation must name a causal part.
      - name: causal_failure_group
        type: string
        source: input
        description: >
          Failure group the causal part must belong to. Must be null when requires_causal_part
          is false, and non-empty when it is true.
        constraints: "null or non-empty"
      - name: overlap_group
        type: string
        source: input
        description: >
          Group label used for overlapping-repair and repeat-repair detection: two claims on
          the same vehicle collide only when their operations share this label.
        constraints: non-empty

  - name: PartCatalogItem
    parent: null
    common_fields: false
    description: >
      Part catalog entry supplying dealer net price, the parts-return obligation and its
      retention window.
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no type prefix. Identity only; never a decision input.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC with exactly three fractional digits.
      - name: part_number
        type: string
        source: input
        description: Manufacturer part number.
        constraints: "non-empty; unique across PartCatalogItem"
      - name: description
        type: string
        source: input
        description: Human-readable part description.
        constraints: non-empty
      - name: dealer_net_cents
        type: integer
        source: input
        description: Dealer net price per unit in cents; markup is applied to this value.
        constraints: "> 0"
      - name: failure_group
        type: string
        source: input
        description: >
          Component family this part belongs to. Must equal the citing LaborOperation's
          causal_failure_group for the part to be an admissible causal part.
        constraints: non-empty
      - name: return_required
        type: boolean
        source: input
        description: >
          When true, submitting a claim with this part as causal creates a PartsReturnRequest
          for failed-component analysis.
      - name: retention_days
        type: integer
        source: input
        description: >
          Days after the parts-return request is created before the part is deemed not
          returned. Must be 0 when return_required is false.
        constraints: ">= 0"

  - name: WarrantyClaim
    parent: null
    common_fields: true
    description: >
      A dealer's warranty reimbursement claim. Carries two independent state dimensions:
      `status` (adjudication lifecycle) and `payment_status` (money lifecycle). Provisional
      and final reimbursement amounts are both persisted so their divergence is observable.
    fields:
      - name: dealer_id
        type: string
        source: input
        description: FK -> Dealer.id; the submitting dealer.
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the repaired vehicle.
      - name: labor_operation_id
        type: string
        source: input
        description: FK -> LaborOperation.id; the flat-rate operation performed.
      - name: causal_part_id
        type: string
        source: input
        description: >
          FK -> PartCatalogItem.id; the part identified as causal. Null when the labor
          operation's requires_causal_part is false.
        default: null
      - name: resubmission_of_claim_id
        type: string
        source: input
        description: >
          FK -> WarrantyClaim.id; self-referential link to the claim this submission replaces
          after a dealer correction. Null for an original submission.
        default: null
      - name: repair_order_number
        type: string
        source: input
        description: Dealer repair order number.
        constraints: non-empty
      - name: repair_date
        type: string
        source: input
        description: YYYY-MM-DD date the repair was completed.
      - name: odometer_at_repair
        type: integer
        source: input
        description: Odometer reading in miles at repair.
        constraints: ">= 0"
      - name: claimed_labor_hours
        type: number
        source: input
        description: Hours the dealer is claiming.
        constraints: "> 0; 1 decimal place"
      - name: claimed_parts_qty
        type: integer
        source: input
        description: Units of the causal part claimed. Must be 0 when causal_part_id is null.
        constraints: ">= 0"
      - name: complaint_text
        type: string
        source: input
        description: Customer complaint, first of the three narrative elements.
      - name: cause_text
        type: string
        source: input
        description: Technician-determined cause, second narrative element.
      - name: correction_text
        type: string
        source: input
        description: Correction performed, third narrative element.
      - name: coverage_type
        type: enum
        source: computed
        description: >
          Output of the claim_coverage_determination calculation, recomputed on submission and
          on resubmission. Flipped from NONE to GOODWILL when a GoodwillAuthorization for this
          claim reaches APPROVED.
        constraints: "one of {BASIC, POWERTRAIN, GOODWILL, NONE}"
      - name: status
        type: enum
        source: computed
        description: Adjudication dimension; see the WarrantyClaim.status state machine.
        default: SUBMITTED
        constraints: "one of {SUBMITTED, SUSPENDED, APPROVED, DENIED, VOID}"
      - name: payment_status
        type: enum
        source: computed
        description: >
          Money dimension, independent of `status`; see the WarrantyClaim.payment_status state
          machine.
        default: UNPAID
        constraints: "one of {UNPAID, PAID, DEBITED, CREDIT_REINSTATED}"
      - name: provisional_total_cents
        type: integer
        source: computed
        description: >
          claim_reimbursement_amount / provisional_at_submission variant. Recomputed on every
          submission and resubmission; never overwritten by adjudication.
      - name: provisional_labor_amount_cents
        type: integer
        source: computed
        description: Labor component of provisional_total_cents.
      - name: provisional_parts_amount_cents
        type: integer
        source: computed
        description: Parts component of provisional_total_cents.
      - name: approved_labor_hours
        type: number
        source: computed
        description: >
          Hours the adjudicator granted, echoed from the adjudicate call. Null until the claim
          reaches APPROVED.
        default: null
      - name: approved_parts_qty
        type: integer
        source: computed
        description: >
          Part units the adjudicator granted, echoed from the adjudicate call. Null until the
          claim reaches APPROVED.
        default: null
      - name: approved_labor_amount_cents
        type: integer
        source: computed
        description: Labor component of approved_total_cents. Null until APPROVED.
        default: null
      - name: approved_parts_amount_cents
        type: integer
        source: computed
        description: Parts component of approved_total_cents. Null until APPROVED.
        default: null
      - name: approved_total_cents
        type: integer
        source: computed
        description: >
          claim_reimbursement_amount / final_at_adjudication variant, capped by the approved
          goodwill amount when coverage_type == GOODWILL. Null until APPROVED.
        default: null
      - name: dealer_participation_cents
        type: integer
        source: computed
        description: >
          Policy-adjustment share the dealer absorbs, from the approved GoodwillAuthorization's
          policy_adjustment_pct. 0 when coverage_type != GOODWILL.
        default: 0
      - name: oem_payable_cents
        type: integer
        source: computed
        description: >
          approved_total_cents - dealer_participation_cents. This is the amount paid on
          POST /warranty/claims/{id}/pay. Null until APPROVED.
        default: null
      - name: debited_amount_cents
        type: integer
        source: computed
        description: >
          Cumulative amount charged back against this claim by parts-return debits and audit
          findings.
        default: 0
      - name: reinstated_amount_cents
        type: integer
        source: computed
        description: >
          Cumulative amount reversed back to the dealer by a late parts return or a granted
          appeal.
        default: 0
      - name: suspend_edit_count
        type: integer
        source: computed
        description: >
          Count of ClaimEdit rows for this claim with severity == SUSPEND and resolved_at ==
          null. The claim is SUSPENDED iff this is > 0 and status is not terminal.
        default: 0
      - name: void_reason
        type: string
        source: computed
        description: Free text recorded when the claim is VOID; null otherwise.
        default: null
      - name: denial_reason
        type: string
        source: computed
        description: Free text recorded when the claim is DENIED; null otherwise.
        default: null

  - name: ClaimEdit
    parent: WarrantyClaim
    common_fields: false
    description: >
      Append-only automated-edit record raised by the claim edit engine. A SUSPEND-severity
      edit holds the claim out of payment until an adjudicator clears it or the underlying
      condition is compensated (which stamps resolved_at).
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no type prefix. Identity only; never a decision input.
      - name: created_at
        type: datetime
        source: system
        description: ISO 8601 UTC with exactly three fractional digits.
      - name: claim_id
        type: string
        source: system
        description: FK -> WarrantyClaim.id; the edited claim.
      - name: conflicting_claim_id
        type: string
        source: system
        description: >
          FK -> WarrantyClaim.id; the prior claim that triggered a REPEAT_REPAIR edit. Null for
          every other edit_code.
        default: null
      - name: edit_code
        type: enum
        source: system
        description: Which automated edit fired.
        constraints: "one of {EXCESSIVE_TIME, NARRATIVE_THIN, HIGH_VALUE, NO_COVERAGE, REPEAT_REPAIR, DEALER_POSTURE_HOLD}"
      - name: severity
        type: enum
        source: system
        description: >
          SUSPEND holds the claim; WARN is informational only. Fixed per edit_code:
          EXCESSIVE_TIME/HIGH_VALUE/NO_COVERAGE/DEALER_POSTURE_HOLD are SUSPEND;
          NARRATIVE_THIN/REPEAT_REPAIR are WARN.
        constraints: "one of {SUSPEND, WARN}"
      - name: detail
        type: string
        source: system
        description: Human-readable explanation naming the threshold that was crossed.
      - name: resolved_at
        type: datetime
        source: system
        description: >
          ISO 8601 UTC stamp set when the edit's condition is compensated away (dealer posture
          returns to ACTIVE, or the dealer resubmits with corrected hours). Null while open.
        default: null

  - name: PartsReturnRequest
    parent: null
    common_fields: true
    description: >
      Obligation for the dealer to ship the failed causal part back for analysis. Created
      automatically when a claim names a causal part whose return_required is true.
    fields:
      - name: claim_id
        type: string
        source: system
        description: FK -> WarrantyClaim.id; the claim that created this obligation.
      - name: part_id
        type: string
        source: system
        description: FK -> PartCatalogItem.id; the part to be returned.
      - name: due_date
        type: datetime
        source: computed
        description: >
          created_at + PartCatalogItem.retention_days, ISO 8601 UTC. The non-return sweep fires
          when the logical clock is at or past this instant.
      - name: received_date
        type: string
        source: input
        description: YYYY-MM-DD date the part was physically received; null until received.
        default: null
      - name: status
        type: enum
        source: computed
        description: See the PartsReturnRequest state machine.
        default: REQUESTED
        constraints: "one of {REQUESTED, RECEIVED, ANALYZED, NOT_RETURNED, WAIVED}"
      - name: analysis_result
        type: enum
        source: input
        description: Failed-component analysis outcome; null until ANALYZED.
        default: null
        constraints: "one of {DEFECT_CONFIRMED, NO_DEFECT_FOUND, NOT_AVAILABLE}"
      - name: analysis_note
        type: string
        source: input
        description: Free-text analysis note; null until ANALYZED.
        default: null
      - name: debit_amount_cents
        type: integer
        source: computed
        description: >
          Amount debited against the claim by this return, from the parts_non_return_debit
          calculation. 0 while no debit has been raised.
        default: 0
      - name: reversed_amount_cents
        type: integer
        source: computed
        description: Amount of a prior debit reversed by a late return. 0 when nothing reversed.
        default: 0

  - name: DealerAudit
    parent: null
    common_fields: true
    description: >
      On-site warranty audit of one dealer over one repair-date window. Holds the pinned
      snapshots that make the extrapolation formula's evaluation order observable.
    fields:
      - name: dealer_id
        type: string
        source: input
        description: FK -> Dealer.id; the audited dealer.
      - name: period_start
        type: string
        source: input
        description: YYYY-MM-DD inclusive start of the audited repair-date window.
      - name: period_end
        type: string
        source: input
        description: >
          YYYY-MM-DD exclusive end of the audited repair-date window. The window is half-open
          [period_start, period_end), so period_start == another audit's period_end is adjacent,
          not overlapping.
        constraints: "period_end > period_start"
      - name: sample_size
        type: integer
        source: input
        description: Number of claims the auditor intends to pull; advisory, not enforced.
        constraints: "> 0"
      - name: lead_auditor_user_id
        type: string
        source: input
        description: >
          Opaque X-User-ID of the FieldAuditor leading this audit. An AppealReviewer whose
          X-User-ID equals this value cannot decide this audit's appeals.
        constraints: non-empty
      - name: status
        type: enum
        source: computed
        description: See the DealerAudit state machine.
        default: SCHEDULED
        constraints: "one of {SCHEDULED, IN_FIELD, FINDINGS_ISSUED, APPEALED, CLOSED}"
      - name: sample_paid_snapshot_cents
        type: integer
        source: computed
        description: >
          Sum of approved_total_cents over the sampled claims, snapshotted at issue-findings
          time BEFORE any chargeback flips their payment_status. 0 until findings are issued.
        default: 0
      - name: population_paid_snapshot_cents
        type: integer
        source: computed
        description: >
          Sum of approved_total_cents over in-period PAID claims NOT in the sample, snapshotted
          at the same instant as sample_paid_snapshot_cents. 0 until findings are issued.
        default: 0
      - name: error_rate
        type: number
        source: computed
        description: >
          sample_unsupported / sample_paid_snapshot_cents, 4 decimal places, round_half_up.
          Recomputed on every appeal decision against the same snapshots.
        default: 0.0
      - name: extrapolation_factor
        type: number
        source: computed
        description: Tier factor selected from error_rate; one of 1.00, 0.50, 0.00.
        default: 0.0
      - name: sample_chargeback_cents
        type: integer
        source: computed
        description: >
          Sum of unsupported_amount_cents over this audit's findings whose status is in
          {CHARGED_BACK, UPHELD}.
        default: 0
      - name: extrapolated_chargeback_cents
        type: integer
        source: computed
        description: round_half_up(population_paid_snapshot_cents * error_rate * extrapolation_factor).
        default: 0
      - name: total_chargeback_cents
        type: integer
        source: computed
        description: sample_chargeback_cents + extrapolated_chargeback_cents.
        default: 0
      - name: findings_issued_at
        type: datetime
        source: computed
        description: Logical-clock instant of the most recent issue-findings or appeal-decision
          re-issue; null until findings are first issued.
        default: null
      - name: appeal_deadline
        type: datetime
        source: computed
        description: >
          findings_issued_at + StateLawProfile.appeal_window_days, ISO 8601 UTC. Reset on every
          re-issue. Null until findings are first issued.
        default: null

  - name: AuditFinding
    parent: DealerAudit
    common_fields: true
    description: >
      One unsupported-claim exception recorded during the field audit. Bridges DealerAudit and
      WarrantyClaim, and is the unit an appeal contests.
    fields:
      - name: audit_id
        type: string
        source: system
        description: FK -> DealerAudit.id; the audit that raised this finding.
      - name: claim_id
        type: string
        source: input
        description: FK -> WarrantyClaim.id; the claim held unsupported.
      - name: appeal_id
        type: string
        source: computed
        description: >
          FK -> AuditAppeal.id; the appeal that most recently contested this finding. Null until
          contested.
        default: null
      - name: finding_code
        type: enum
        source: input
        description: Why the claim is unsupported.
        constraints: "one of {NO_REPAIR_ORDER, NO_TECHNICIAN_SIGNATURE, PART_NOT_ON_HAND, TIME_NOT_DOCUMENTED, NARRATIVE_UNSUPPORTED}"
      - name: unsupported_amount_cents
        type: integer
        source: input
        description: Portion of the claim's approved_total_cents held unsupported.
        constraints: "> 0; <= WarrantyClaim.approved_total_cents"
      - name: evidence_note
        type: string
        source: input
        description: Auditor's evidence note.
        constraints: non-empty
      - name: status
        type: enum
        source: computed
        description: See the AuditFinding state machine.
        default: OPEN
        constraints: "one of {OPEN, CHARGED_BACK, OVERTURNED, UPHELD}"

  - name: AuditAppeal
    parent: DealerAudit
    common_fields: true
    description: >
      A dealer's appeal of issued audit findings. A granted appeal fully reverses; a partially
      granted or denied appeal returns the audit to FINDINGS_ISSUED with a fresh deadline,
      which is what makes the audit machine cyclic.
    fields:
      - name: audit_id
        type: string
        source: system
        description: FK -> DealerAudit.id; the appealed audit.
      - name: filed_by_dealer_id
        type: string
        source: system
        description: FK -> Dealer.id; the filing dealer, taken from X-User-ID.
      - name: grounds
        type: string
        source: input
        description: Dealer's written grounds for appeal.
        constraints: non-empty
      - name: contested_finding_ids
        type: array
        source: input
        description: >
          Array of AuditFinding ids being contested. Every element must belong to this audit
          and be in status CHARGED_BACK.
        constraints: "length >= 1"
      - name: overturned_finding_ids
        type: array
        source: computed
        description: >
          Subset of contested_finding_ids that the reviewer overturned. Empty array until a
          decision is recorded; equals contested_finding_ids on a GRANTED decision.
        default: []
      - name: reviewer_user_id
        type: string
        source: computed
        description: >
          Opaque X-User-ID of the AppealReviewer who decided this appeal; null until decided.
        default: null
      - name: status
        type: enum
        source: computed
        description: See the AuditAppeal state machine.
        default: FILED
        constraints: "one of {FILED, GRANTED, PARTIALLY_GRANTED, DENIED}"
      - name: reinstated_amount_cents
        type: integer
        source: computed
        description: >
          Total chargeback reversed by this decision, i.e. the audit's total_chargeback_cents
          before the decision minus its value after. 0 until decided.
        default: 0
      - name: decision_note
        type: string
        source: input
        description: Reviewer's written rationale; null until decided.
        default: null

  - name: GoodwillAuthorization
    parent: WarrantyClaim
    common_fields: true
    description: >
      Policy-adjustment / goodwill request for a claim the warranty terms do not cover. The
      authority tier is decided by the goodwill_authorization_limit calculation at creation.
    fields:
      - name: claim_id
        type: string
        source: system
        description: FK -> WarrantyClaim.id; the uncovered claim.
      - name: requested_by_user_id
        type: string
        source: system
        description: >
          Opaque X-User-ID of the ClaimAdjudicator who raised the request. An
          AdjudicationManager whose X-User-ID equals this value cannot decide it.
      - name: requested_amount_cents
        type: integer
        source: input
        description: Goodwill amount requested, in cents.
        constraints: "> 0"
      - name: policy_adjustment_pct
        type: number
        source: input
        description: >
          Share of the authorized amount the dealer absorbs, as a decimal fraction. Drives
          WarrantyClaim.dealer_participation_cents.
        constraints: "0.00 <= policy_adjustment_pct <= 0.50; 2 decimal places"
      - name: justification
        type: string
        source: input
        description: Adjudicator's written justification.
        constraints: non-empty
      - name: adjudicator_limit_cents
        type: integer
        source: computed
        description: ClaimAdjudicator authority ceiling from goodwill_authorization_limit.
      - name: manager_limit_cents
        type: integer
        source: computed
        description: AdjudicationManager authority ceiling from goodwill_authorization_limit.
      - name: out_of_warranty_margin_pct
        type: number
        source: computed
        description: >
          How far past the warranty terms the repair sits, 4 decimal places; the decay input to
          both limits.
      - name: status
        type: enum
        source: computed
        description: See the GoodwillAuthorization state machine.
        constraints: "one of {PENDING, ESCALATED, APPROVED, DENIED, WITHDRAWN}"
      - name: approved_amount_cents
        type: integer
        source: computed
        description: Amount actually authorized; null until APPROVED.
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: Opaque X-User-ID of the decider; null until decided.
        default: null
      - name: denial_reason
        type: string
        source: computed
        description: Free text recorded when DENIED; null otherwise.
        default: null

  - name: ChargebackLedgerEntry
    parent: null
    common_fields: false
    description: >
      Append-only signed money ledger for one dealer. Dealer.chargeback_balance_cents is
      defined as the signed sum of these rows, and every compensating action appends an
      offsetting row rather than editing an existing one.
    fields:
      - name: id
        type: string
        source: system
        description: Server-minted UUID, no type prefix. Identity only; never a decision input.
      - name: created_at
        type: datetime
        source: system
        description: >
          ISO 8601 UTC with exactly three fractional digits; the ordering key for ledger reads
          (created_at ASC, ties impossible within one dealer because entries are appended in
          sequence within a single request).
      - name: dealer_id
        type: string
        source: system
        description: FK -> Dealer.id; the dealer whose balance this row moves.
      - name: source_type
        type: enum
        source: system
        description: Which mechanism appended this row.
        constraints: "one of {PARTS_NON_RETURN, PARTS_NO_DEFECT, LATE_RETURN_REVERSAL, AUDIT_CHARGEBACK_SAMPLE, AUDIT_CHARGEBACK_EXTRAPOLATION, APPEAL_REVERSAL_SAMPLE, APPEAL_REVERSAL_EXTRAPOLATION}"
      - name: source_id
        type: string
        source: system
        description: >
          Polymorphic id of the originating row: a PartsReturnRequest.id for PARTS_* and
          LATE_RETURN_REVERSAL, a DealerAudit.id for AUDIT_CHARGEBACK_*, an AuditAppeal.id for
          APPEAL_REVERSAL_*. Deliberately not a declared FK because the target entity varies.
      - name: claim_id
        type: string
        source: system
        description: >
          Id of the WarrantyClaim whose money moved, or null for extrapolation rows which are
          not tied to a single claim. Deliberately not a declared FK: extrapolation rows carry
          null here.
        default: null
      - name: amount_cents
        type: integer
        source: system
        description: >
          Signed: positive increases the dealer's chargeback balance (money owed back to the
          manufacturer), negative reverses it.
        constraints: "!= 0"
      - name: balance_after_cents
        type: integer
        source: system
        description: >
          Dealer.chargeback_balance_cents immediately after appending this row; lets a reader
          reconcile the running balance without re-summing.

state_machines:
  - entity: LaborRateRequest
    state_field: status
    shape: branching_with_revert
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /warranty/labor-rate-requests/{id}/review with action=START_REVIEW"
        actor: WarrantyAdmin
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets LaborRateRequest.updated_at; increments LaborRateRequest.version by 1"
        note: "Starting review stops the deemed-approval clock: the sweep only promotes SUBMITTED rows."
      - from: UNDER_REVIEW
        to: SUBMITTED
        trigger: "POST /warranty/labor-rate-requests/{id}/review with action=RETURN_FOR_INFO"
        actor: WarrantyAdmin
        preconditions:
          - "request.status == UNDER_REVIEW"
        side_effects:
          - "sets LaborRateRequest.updated_at; increments LaborRateRequest.version by 1"
        note: >
          Revert edge. The deemed-approval clock still measures from LaborRateRequest.created_at,
          not from this instant, so returning for info cannot be used to reset the statutory clock.
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty/labor-rate-requests/{id}/decision with action=APPROVE"
        actor: AdjudicationManager
        preconditions:
          - "request.status IN {SUBMITTED, UNDER_REVIEW}"
          - "X-User-ID != request.submitted_by_user_id"
          - "approved_labor_rate_cents <= request.statutory_ceiling_cents"
          - "approved_parts_markup_pct <= StateLawProfile.markup_cap_pct"
        side_effects:
          - "sets LaborRateRequest.approved_labor_rate_cents and approved_parts_markup_pct"
          - "sets Dealer.approved_labor_rate_cents = request.approved_labor_rate_cents"
          - "sets Dealer.approved_parts_markup_pct = request.approved_parts_markup_pct"
          - "sets Dealer.labor_rate_effective_date = request.effective_date"
          - "increments Dealer.version by 1 and refreshes Dealer.updated_at"
          - "increments LaborRateRequest.version by 1"
        note: >
          Already-adjudicated claims are NOT recomputed: provisional_total_cents and
          approved_total_cents are pinned at their own transition instants.
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /warranty/labor-rate-requests/{id}/decision with action=APPROVE"
        actor: AdjudicationManager
        preconditions:
          - "request.status IN {SUBMITTED, UNDER_REVIEW}"
          - "X-User-ID != request.submitted_by_user_id"
          - "approved_labor_rate_cents <= request.statutory_ceiling_cents"
          - "approved_parts_markup_pct <= StateLawProfile.markup_cap_pct"
        side_effects:
          - "identical to the SUBMITTED -> APPROVED edge"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty/labor-rate-requests/{id}/decision with action=DENY"
        actor: AdjudicationManager
        preconditions:
          - "request.status IN {SUBMITTED, UNDER_REVIEW}"
          - "denial_reason is present and non-empty"
        side_effects:
          - "sets LaborRateRequest.denial_reason; increments LaborRateRequest.version by 1"
          - "Dealer rate and markup are left untouched"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /warranty/labor-rate-requests/{id}/decision with action=DENY"
        actor: AdjudicationManager
        preconditions:
          - "request.status IN {SUBMITTED, UNDER_REVIEW}"
          - "denial_reason is present and non-empty"
        side_effects:
          - "sets LaborRateRequest.denial_reason; increments LaborRateRequest.version by 1"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty/labor-rate-requests/deemed-approval-run (system sweep)"
        actor: system
        preconditions:
          - "request.status == SUBMITTED"
          - "current_utc >= request.created_at + StateLawProfile.deemed_approved_days days (inclusive)"
        side_effects:
          - "sets LaborRateRequest.deemed_approved = true"
          - "sets approved_labor_rate_cents = requested_labor_rate_cents"
          - "sets approved_parts_markup_pct = requested_parts_markup_pct"
          - "applies the same Dealer rate/markup/effective-date writes as a manual APPROVE"
          - "increments Dealer.version by 1; increments LaborRateRequest.version by 1"
        note: >
          The sweep promotes every eligible row in ascending LaborRateRequest.created_at order;
          statutory_ceiling_cents is NOT re-checked, because letting the clock run out waives the
          manufacturer's objection.
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /warranty/labor-rate-requests (a newer request for the same dealer supersedes this one)"
        actor: system
        preconditions:
          - "request.status == SUBMITTED"
          - "request.dealer_id == the new request's dealer_id"
        side_effects:
          - "increments LaborRateRequest.version by 1 on the superseded row"
        note: >
          Only SUBMITTED rows are superseded. A row already in UNDER_REVIEW is left alone, which
          is why creating a second request is a legitimate CREATE-with-supersede race resolved by
          OCC on Dealer.version.

  - entity: WarrantyClaim
    state_field: status
    shape: cyclic
    initial_state: SUBMITTED
    terminal_states: [DENIED, VOID]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /warranty/claims (claim edit engine raised no SUSPEND-severity edit)"
        actor: DealerWarrantyAdmin
        preconditions:
          - "Dealer.status != SUSPENDED"
          - "no other live claim of the same dealer_id carries this repair_order_number (validations priority 60)"
          - "no other live claim on the same vehicle in the same overlap_group lies inside the closed 30-day buffer (validations priority 62)"
          - "all three narrative elements satisfy the narrative floor"
          - "claimed_labor_hours <= LaborOperation.max_time_hours"
        side_effects:
          - "computes WarrantyClaim.coverage_type via claim_coverage_determination"
          - "computes provisional_total_cents / provisional_labor_amount_cents / provisional_parts_amount_cents"
          - "appends any WARN-severity ClaimEdit rows (NARRATIVE_THIN, REPEAT_REPAIR)"
          - "when PartCatalogItem.return_required is true, creates a PartsReturnRequest in REQUESTED and increments Dealer.open_parts_return_count by 1"
      - from: null
        to: SUSPENDED
        trigger: "POST /warranty/claims (claim edit engine raised at least one SUSPEND-severity edit)"
        actor: DealerWarrantyAdmin
        preconditions:
          - "same preconditions as the null -> SUBMITTED edge"
        side_effects:
          - "all side effects of the null -> SUBMITTED edge"
          - "appends one ClaimEdit per fired edit (EXCESSIVE_TIME when claimed_labor_hours > standard_time_hours; HIGH_VALUE when provisional_total_cents >= HIGH_VALUE_THRESHOLD_CENTS; NO_COVERAGE when coverage_type == NONE)"
          - "sets suspend_edit_count to the number of open SUSPEND-severity edits"
      - from: SUSPENDED
        to: SUBMITTED
        trigger: "POST /warranty/claims/{id}/resubmit"
        actor: DealerWarrantyAdmin
        preconditions:
          - "claim.status == SUSPENDED"
          - "claim.payment_status == UNPAID"
          - "Dealer.status != SUSPENDED"
          - "resubmitted claimed_labor_hours <= LaborOperation.max_time_hours"
          - "the re-run edit engine raises no SUSPEND-severity edit (otherwise the row stays in SUSPENDED and this edge does not fire)"
        side_effects:
          - "overwrites claimed_labor_hours, claimed_parts_qty and the three narrative fields"
          - "recomputes coverage_type and the three provisional_* fields"
          - "stamps resolved_at on every open EXCESSIVE_TIME and NARRATIVE_THIN edit"
          - "sets suspend_edit_count = 0; increments WarrantyClaim.version by 1"
        note: >
          Cycle edge. A resubmission that would still trip a SUSPEND edit (e.g. hours still above
          standard time, or coverage still NONE) is NOT rejected: the call succeeds 200, the fresh
          edit set is appended, and the claim simply stays in SUSPENDED. Only a claim whose status
          is not SUSPENDED is rejected, with ERR_CLAIM_NOT_RESUBMITTABLE.
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /warranty/claims/{id}/adjudicate with decision=APPROVE"
        actor: ClaimAdjudicator | AdjudicationManager
        preconditions:
          - "claim.status IN {SUBMITTED, SUSPENDED}"
          - "no open SUSPEND-severity ClaimEdit on this claim has edit_code == DEALER_POSTURE_HOLD (otherwise ERR_CLAIM_STILL_SUSPENDED)"
          - "approved_labor_hours <= LaborOperation.max_time_hours"
          - "approved_parts_qty <= claimed_parts_qty"
          - "coverage_type != NONE (a NONE claim needs an APPROVED GoodwillAuthorization first, which flips coverage_type to GOODWILL)"
        side_effects:
          - "computes approved_labor_amount_cents / approved_parts_amount_cents / approved_total_cents via claim_reimbursement_amount / final_at_adjudication"
          - "computes dealer_participation_cents and oem_payable_cents"
          - "stamps resolved_at on every remaining open ClaimEdit for this claim; sets suspend_edit_count = 0"
          - "increments WarrantyClaim.version by 1"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /warranty/claims/{id}/adjudicate with decision=APPROVE"
        actor: ClaimAdjudicator | AdjudicationManager
        preconditions:
          - "identical to the SUBMITTED -> APPROVED edge"
        side_effects:
          - "identical to the SUBMITTED -> APPROVED edge"
        note: >
          An adjudicator may clear an EXCESSIVE_TIME, HIGH_VALUE or NO_COVERAGE suspension directly
          and the SUSPEND edits are stamped resolved, but a DEALER_POSTURE_HOLD suspension cannot be
          adjudicated away: that row is rejected with ERR_CLAIM_STILL_SUSPENDED.
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty/claims/{id}/adjudicate with decision=DENY"
        actor: ClaimAdjudicator | AdjudicationManager
        preconditions:
          - "claim.status IN {SUBMITTED, SUSPENDED}"
          - "denial_reason is present and non-empty"
        side_effects:
          - "sets denial_reason; stamps resolved_at on every open ClaimEdit; sets suspend_edit_count = 0"
          - "cascade: every PartsReturnRequest for this claim in REQUESTED becomes WAIVED and Dealer.open_parts_return_count is decremented by one per waived row"
          - "increments WarrantyClaim.version by 1"
      - from: SUSPENDED
        to: DENIED
        trigger: "POST /warranty/claims/{id}/adjudicate with decision=DENY"
        actor: ClaimAdjudicator | AdjudicationManager
        preconditions:
          - "identical to the SUBMITTED -> DENIED edge"
        side_effects:
          - "identical to the SUBMITTED -> DENIED edge"
      - from: SUBMITTED
        to: SUSPENDED
        trigger: "system: Dealer posture entered PROBATION or SUSPENDED (cascaded from a ChargebackLedgerEntry append)"
        actor: system
        preconditions:
          - "claim.dealer_id == the dealer whose status changed"
          - "claim.status == SUBMITTED"
        side_effects:
          - "appends a ClaimEdit with edit_code=DEALER_POSTURE_HOLD, severity=SUSPEND"
          - "increments suspend_edit_count by 1; increments WarrantyClaim.version by 1"
        note: "Hop 5 of the parts-non-return cascade."
      - from: SUSPENDED
        to: SUBMITTED
        trigger: "system: Dealer posture returned to ACTIVE (cascaded from a reversal ChargebackLedgerEntry append)"
        actor: system
        preconditions:
          - "claim.dealer_id == the dealer whose status changed"
          - "claim.status == SUSPENDED"
          - "every open SUSPEND-severity ClaimEdit on this claim has edit_code == DEALER_POSTURE_HOLD"
        side_effects:
          - "stamps resolved_at on every open DEALER_POSTURE_HOLD edit"
          - "sets suspend_edit_count = 0; increments WarrantyClaim.version by 1"
        note: >
          Conditional cascade: a claim also holding an EXCESSIVE_TIME or NO_COVERAGE edit stays
          SUSPENDED. Hop 4 of the appeal-reversal cascade.
      - from: SUSPENDED
        to: SUBMITTED
        trigger: "system: a GoodwillAuthorization on this claim reached APPROVED (cascaded from POST /warranty/goodwill-authorizations/{id}/decision with action=APPROVE)"
        actor: system
        preconditions:
          - "claim.status == SUSPENDED"
          - "claim.coverage_type has just flipped NONE -> GOODWILL"
          - "the only open SUSPEND-severity ClaimEdit on this claim is the NO_COVERAGE row"
        side_effects:
          - "stamps resolved_at on the open NO_COVERAGE edit"
          - "sets suspend_edit_count = 0; increments WarrantyClaim.version by 1"
        note: >
          Second cycle edge back into SUBMITTED, and the hop that makes coverage_type GOODWILL
          reachable at all: without it a NONE-coverage claim would be permanently SUSPENDED. A claim
          also holding an EXCESSIVE_TIME, HIGH_VALUE or DEALER_POSTURE_HOLD edit stays SUSPENDED.
      - from: SUBMITTED
        to: VOID
        trigger: "POST /warranty/claims/{id}/void"
        actor: WarrantyAdmin | ClaimAdjudicator
        preconditions:
          - "claim.status IN {SUBMITTED, SUSPENDED}"
          - "claim.payment_status == UNPAID"
        side_effects:
          - "sets void_reason; stamps resolved_at on every open ClaimEdit; sets suspend_edit_count = 0"
          - "cascade: every PartsReturnRequest for this claim in REQUESTED becomes WAIVED"
          - "decrements Dealer.open_parts_return_count by one per waived row; increments Dealer.version by 1"
          - "increments WarrantyClaim.version by 1"
      - from: SUSPENDED
        to: VOID
        trigger: "POST /warranty/claims/{id}/void"
        actor: WarrantyAdmin | ClaimAdjudicator
        preconditions:
          - "identical to the SUBMITTED -> VOID edge"
        side_effects:
          - "identical to the SUBMITTED -> VOID edge"

  - entity: WarrantyClaim
    state_field: payment_status
    shape: parallel_dimension
    initial_state: UNPAID
    terminal_states: [CREDIT_REINSTATED]
    note: >
      Second, independent state dimension on the same row. `status` and `payment_status` evolve
      separately: an APPROVED claim walks UNPAID -> PAID -> DEBITED -> CREDIT_REINSTATED without
      its `status` ever leaving APPROVED, and a DEBITED claim is still an APPROVED claim.
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /warranty/claims/{id}/pay"
        actor: WarrantyAdmin
        preconditions:
          - "claim.status == APPROVED"
          - "claim.payment_status == UNPAID"
          - "claim.suspend_edit_count == 0"
          - "Dealer.audit_hold == false"
        side_effects:
          - "sets paid amount to claim.oem_payable_cents; increments WarrantyClaim.version by 1"
      - from: PAID
        to: DEBITED
        trigger: "system: PartsReturnRequest reached ANALYZED with NO_DEFECT_FOUND / NOT_AVAILABLE, or reached NOT_RETURNED"
        actor: system
        preconditions:
          - "claim.payment_status IN {UNPAID, PAID}"
        side_effects:
          - "increments claim.debited_amount_cents by the parts_non_return_debit output"
          - "increments WarrantyClaim.version by 1"
          - "cascade: appends a ChargebackLedgerEntry for the dealer (hop 3)"
      - from: UNPAID
        to: DEBITED
        trigger: "system: same triggers as PAID -> DEBITED, on a claim not yet paid"
        actor: system
        preconditions:
          - "claim.payment_status IN {UNPAID, PAID}"
        side_effects:
          - "identical to the PAID -> DEBITED edge"
        note: >
          A debit on an UNPAID claim still books a positive ledger entry; the claim can no longer
          be paid because pay requires payment_status == UNPAID.
      - from: PAID
        to: DEBITED
        trigger: "POST /warranty/audits/{id}/issue-findings (a finding named this claim)"
        actor: AuditManager
        preconditions:
          - "claim.payment_status == PAID"
          - "an AuditFinding for this claim moved OPEN -> CHARGED_BACK"
        side_effects:
          - "increments claim.debited_amount_cents by the finding's unsupported_amount_cents"
          - "increments WarrantyClaim.version by 1"
      - from: DEBITED
        to: CREDIT_REINSTATED
        trigger: "system: late parts return (PartsReturnRequest NOT_RETURNED -> RECEIVED) or an appeal overturned this claim's finding"
        actor: system
        preconditions:
          - "claim.payment_status == DEBITED"
        side_effects:
          - "increments claim.reinstated_amount_cents by the reversed amount"
          - "increments WarrantyClaim.version by 1"
          - "cascade: appends an offsetting ChargebackLedgerEntry for the dealer"
        note: >
          Invariant: after a full reversal, reinstated_amount_cents == debited_amount_cents and the
          dealer's chargeback_balance_cents returns to its pre-debit value with zero drift.

  - entity: PartsReturnRequest
    state_field: status
    shape: branching_with_cycle
    initial_state: REQUESTED
    terminal_states: [ANALYZED, WAIVED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /warranty/parts-returns/{id}/receive"
        actor: WarrantyAdmin
        preconditions:
          - "return.status IN {REQUESTED, NOT_RETURNED}"
          - "the linked WarrantyClaim.status != VOID"
        side_effects:
          - "sets received_date; decrements Dealer.open_parts_return_count by 1"
          - "increments Dealer.version by 1; increments PartsReturnRequest.version by 1"
      - from: NOT_RETURNED
        to: RECEIVED
        trigger: "POST /warranty/parts-returns/{id}/receive (late return)"
        actor: WarrantyAdmin
        preconditions:
          - "return.status IN {REQUESTED, NOT_RETURNED}"
          - "the linked WarrantyClaim.status != VOID"
        side_effects:
          - "sets received_date and reversed_amount_cents = return.debit_amount_cents"
          - "cascade hop 1: the linked WarrantyClaim goes DEBITED -> CREDIT_REINSTATED with reinstated_amount_cents += debit_amount_cents"
          - "cascade hop 2: appends a ChargebackLedgerEntry with source_type=LATE_RETURN_REVERSAL and amount_cents = -debit_amount_cents; Dealer.chargeback_balance_cents decreases by that amount"
          - "cascade hop 3: Dealer.status is recomputed from the new balance and may fall SUSPENDED -> ACTIVE or PROBATION -> ACTIVE"
          - "cascade hop 4: on return to ACTIVE, every SUSPENDED claim of that dealer whose only open SUSPEND edit is DEALER_POSTURE_HOLD returns to SUBMITTED"
          - "increments PartsReturnRequest.version by 1"
        note: >
          Cycle edge and the compensating half of the chargeback-balance invariant. open_parts_return_count
          is NOT re-decremented here: the row left REQUESTED when it was swept to NOT_RETURNED.
      - from: RECEIVED
        to: ANALYZED
        trigger: "POST /warranty/parts-returns/{id}/analysis"
        actor: WarrantyAdmin
        preconditions:
          - "return.status == RECEIVED"
          - "analysis_result is present"
        side_effects:
          - "sets analysis_result and analysis_note"
          - "when analysis_result == DEFECT_CONFIRMED: no money moves"
          - "when analysis_result IN {NO_DEFECT_FOUND, NOT_AVAILABLE}: sets debit_amount_cents from parts_non_return_debit, drives the linked claim to DEBITED, appends a ChargebackLedgerEntry (source_type=PARTS_NO_DEFECT), updates Dealer.chargeback_balance_cents, recomputes Dealer.status, and cascades the posture hold onto the dealer's SUBMITTED claims"
          - "increments PartsReturnRequest.version by 1"
      - from: REQUESTED
        to: NOT_RETURNED
        trigger: "POST /warranty/parts-returns/non-return-sweep (system sweep)"
        actor: system
        preconditions:
          - "return.status == REQUESTED"
          - "current_utc >= return.due_date (inclusive)"
          - "the linked WarrantyClaim.status == APPROVED"
        side_effects:
          - "sets debit_amount_cents = the linked claim's approved_total_cents (full-claim debit)"
          - "decrements Dealer.open_parts_return_count by 1"
          - "cascade hop 1: the linked WarrantyClaim goes PAID -> DEBITED (or UNPAID -> DEBITED)"
          - "cascade hop 2: appends a ChargebackLedgerEntry with source_type=PARTS_NON_RETURN and amount_cents = +debit_amount_cents; Dealer.chargeback_balance_cents increases"
          - "cascade hop 3: Dealer.status is recomputed and may rise ACTIVE -> PROBATION or ACTIVE -> SUSPENDED"
          - "cascade hop 4: on entering PROBATION or SUSPENDED, every SUBMITTED claim of that dealer becomes SUSPENDED with a DEALER_POSTURE_HOLD edit"
          - "increments PartsReturnRequest.version by 1; increments Dealer.version by 1"
        note: >
          The sweep processes eligible rows in ascending PartsReturnRequest.created_at order, so the
          balance_after_cents sequence on the ledger is deterministic.
      - from: REQUESTED
        to: WAIVED
        trigger: "system: the linked WarrantyClaim reached DENIED or VOID"
        actor: system
        preconditions:
          - "return.status == REQUESTED"
        side_effects:
          - "decrements Dealer.open_parts_return_count by 1; increments Dealer.version by 1"
          - "increments PartsReturnRequest.version by 1"
        note: "Compensating half of the open-parts-return-count invariant."

  - entity: Dealer
    state_field: status
    shape: posture_driven
    initial_state: ACTIVE
    terminal_states: []
    note: >
      Posture is a pure function of chargeback_balance_cents, recomputed synchronously after every
      ChargebackLedgerEntry append. It is never set directly by any endpoint.
    transitions:
      - from: ACTIVE
        to: PROBATION
        trigger: "system: ChargebackLedgerEntry appended"
        actor: system
        preconditions:
          - "PROBATION_THRESHOLD_CENTS <= chargeback_balance_cents < SUSPENSION_THRESHOLD_CENTS"
        side_effects:
          - "cascade: every SUBMITTED claim of this dealer becomes SUSPENDED with a DEALER_POSTURE_HOLD edit"
          - "increments Dealer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: ChargebackLedgerEntry appended"
        actor: system
        preconditions:
          - "chargeback_balance_cents >= SUSPENSION_THRESHOLD_CENTS"
        side_effects:
          - "cascade: every SUBMITTED claim of this dealer becomes SUSPENDED with a DEALER_POSTURE_HOLD edit"
          - "increments Dealer.version by 1"
        note: "A single large debit may skip PROBATION entirely."
      - from: PROBATION
        to: SUSPENDED
        trigger: "system: ChargebackLedgerEntry appended"
        actor: system
        preconditions:
          - "chargeback_balance_cents >= SUSPENSION_THRESHOLD_CENTS"
        side_effects:
          - "cascade: every SUBMITTED claim of this dealer becomes SUSPENDED with a DEALER_POSTURE_HOLD edit"
          - "increments Dealer.version by 1"
      - from: PROBATION
        to: ACTIVE
        trigger: "system: reversal ChargebackLedgerEntry appended"
        actor: system
        preconditions:
          - "chargeback_balance_cents < PROBATION_THRESHOLD_CENTS"
        side_effects:
          - "cascade: every SUSPENDED claim of this dealer whose only open SUSPEND edit is DEALER_POSTURE_HOLD returns to SUBMITTED"
          - "increments Dealer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: reversal ChargebackLedgerEntry appended"
        actor: system
        preconditions:
          - "chargeback_balance_cents < PROBATION_THRESHOLD_CENTS"
        side_effects:
          - "identical to the PROBATION -> ACTIVE edge"
      - from: SUSPENDED
        to: PROBATION
        trigger: "system: reversal ChargebackLedgerEntry appended"
        actor: system
        preconditions:
          - "PROBATION_THRESHOLD_CENTS <= chargeback_balance_cents < SUSPENSION_THRESHOLD_CENTS"
        side_effects:
          - "no claim cascade fires: PROBATION still holds the dealer's SUBMITTED claims"
          - "increments Dealer.version by 1"

  - entity: DealerAudit
    state_field: status
    shape: cyclic
    initial_state: SCHEDULED
    terminal_states: [CLOSED]
    transitions:
      - from: SCHEDULED
        to: IN_FIELD
        trigger: "POST /warranty/audits/{id}/start"
        actor: FieldAuditor
        preconditions:
          - "audit.status == SCHEDULED"
        side_effects:
          - "recomputes Dealer.audit_hold to true; increments Dealer.version by 1"
          - "increments DealerAudit.version by 1"
      - from: IN_FIELD
        to: FINDINGS_ISSUED
        trigger: "POST /warranty/audits/{id}/issue-findings"
        actor: AuditManager
        preconditions:
          - "audit.status == IN_FIELD"
        side_effects:
          - "step 1: snapshots sample_paid_snapshot_cents and population_paid_snapshot_cents from PAID claims BEFORE any chargeback"
          - "step 2: computes error_rate, extrapolation_factor, sample_chargeback_cents, extrapolated_chargeback_cents, total_chargeback_cents via audit_extrapolated_chargeback"
          - "step 3: every AuditFinding of this audit goes OPEN -> CHARGED_BACK"
          - "step 4: every sampled PAID claim goes PAID -> DEBITED with debited_amount_cents += its finding's unsupported_amount_cents"
          - "step 5: appends one AUDIT_CHARGEBACK_SAMPLE ledger entry (+sample_chargeback_cents) and, when extrapolated_chargeback_cents > 0, one AUDIT_CHARGEBACK_EXTRAPOLATION entry (+extrapolated_chargeback_cents); both skipped when the amount is 0"
          - "step 6: Dealer.chargeback_balance_cents updated, Dealer.status recomputed, posture hold cascaded onto the dealer's SUBMITTED claims"
          - "sets findings_issued_at = current_utc and appeal_deadline = findings_issued_at + StateLawProfile.appeal_window_days days"
          - "increments DealerAudit.version by 1"
      - from: FINDINGS_ISSUED
        to: APPEALED
        trigger: "POST /warranty/audits/{id}/appeals"
        actor: DealerWarrantyAdmin
        preconditions:
          - "audit.status == FINDINGS_ISSUED"
          - "current_utc <= audit.appeal_deadline (inclusive)"
          - "every contested finding id belongs to this audit and is in status CHARGED_BACK"
        side_effects:
          - "creates an AuditAppeal in FILED; sets appeal_id on each contested AuditFinding"
          - "increments DealerAudit.version by 1"
      - from: APPEALED
        to: CLOSED
        trigger: "POST /warranty/appeals/{id}/decision with action=GRANT"
        actor: AppealReviewer
        preconditions:
          - "audit.status == APPEALED"
          - "the appeal's reinstated set equals its contested set"
        side_effects:
          - "recomputes sample_chargeback_cents / error_rate / extrapolated_chargeback_cents / total_chargeback_cents against the pinned snapshots"
          - "appends APPEAL_REVERSAL_SAMPLE and APPEAL_REVERSAL_EXTRAPOLATION ledger entries for the deltas (each skipped when its delta is 0)"
          - "recomputes Dealer.audit_hold (false when no other audit of this dealer is open)"
          - "increments DealerAudit.version by 1"
      - from: APPEALED
        to: FINDINGS_ISSUED
        trigger: "POST /warranty/appeals/{id}/decision with action=PARTIAL or decision=DENY"
        actor: AppealReviewer
        preconditions:
          - "audit.status == APPEALED"
        side_effects:
          - "recomputes the chargeback figures against the pinned snapshots and appends reversal entries for any deltas"
          - "sets findings_issued_at = current_utc and a fresh appeal_deadline"
          - "increments DealerAudit.version by 1"
        note: >
          Cycle edge: the dealer may appeal the re-issued findings again within the new window, so
          FINDINGS_ISSUED -> APPEALED -> FINDINGS_ISSUED can repeat.
      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /warranty/audits/{id}/close"
        actor: AuditManager
        preconditions:
          - "audit.status IN {FINDINGS_ISSUED, APPEALED}"
          - "no AuditAppeal for this audit has status == FILED"
        side_effects:
          - "every AuditFinding still in CHARGED_BACK becomes UPHELD"
          - "recomputes Dealer.audit_hold; increments Dealer.version by 1"
          - "increments DealerAudit.version by 1"
        note: >
          The manual close endpoint accepts APPEALED as a from-state so that the pending-appeal
          check (priority 50) is the rule that speaks, rather than a generic state error. An audit in
          APPEALED always has a FILED appeal, so a manual close from APPEALED always yields
          ERR_APPEAL_PENDING.

  - entity: AuditFinding
    state_field: status
    shape: branching
    initial_state: OPEN
    terminal_states: [OVERTURNED, UPHELD]
    transitions:
      - from: OPEN
        to: CHARGED_BACK
        trigger: "POST /warranty/audits/{id}/issue-findings"
        actor: AuditManager
        preconditions:
          - "finding.status == OPEN"
          - "the parent DealerAudit is transitioning IN_FIELD -> FINDINGS_ISSUED"
        side_effects:
          - "the named claim's payment_status moves PAID -> DEBITED"
          - "increments AuditFinding.version by 1"
      - from: CHARGED_BACK
        to: OVERTURNED
        trigger: "POST /warranty/appeals/{id}/decision whose overturned_finding_ids contains this finding"
        actor: AppealReviewer
        preconditions:
          - "finding.status == CHARGED_BACK"
          - "finding.id IN appeal.contested_finding_ids"
        side_effects:
          - "the named claim's payment_status moves DEBITED -> CREDIT_REINSTATED with reinstated_amount_cents += unsupported_amount_cents"
          - "the parent audit's sample_chargeback_cents drops by unsupported_amount_cents"
          - "increments AuditFinding.version by 1"
      - from: CHARGED_BACK
        to: UPHELD
        trigger: "POST /warranty/appeals/{id}/decision (contested but not reinstated) or POST /warranty/audits/{id}/close"
        actor: AppealReviewer | AuditManager
        preconditions:
          - "finding.status == CHARGED_BACK"
        side_effects:
          - "the named claim stays DEBITED; increments AuditFinding.version by 1"

  - entity: AuditAppeal
    state_field: status
    shape: branching
    initial_state: FILED
    terminal_states: [GRANTED, PARTIALLY_GRANTED, DENIED]
    transitions:
      - from: FILED
        to: GRANTED
        trigger: "POST /warranty/appeals/{id}/decision with action=GRANT"
        actor: AppealReviewer
        preconditions:
          - "appeal.status == FILED"
          - "X-User-ID != DealerAudit.lead_auditor_user_id"
        side_effects:
          - "sets overturned_finding_ids = contested_finding_ids and reviewer_user_id"
          - "every contested finding goes CHARGED_BACK -> OVERTURNED"
          - "sets reinstated_amount_cents = audit.total_chargeback_cents before minus after"
          - "drives the parent audit APPEALED -> CLOSED"
          - "increments AuditAppeal.version by 1"
      - from: FILED
        to: PARTIALLY_GRANTED
        trigger: "POST /warranty/appeals/{id}/decision with action=PARTIAL"
        actor: AppealReviewer
        preconditions:
          - "appeal.status == FILED"
          - "X-User-ID != DealerAudit.lead_auditor_user_id"
          - "overturned_finding_ids is a non-empty strict subset of contested_finding_ids"
        side_effects:
          - "reinstated findings go CHARGED_BACK -> OVERTURNED; the rest go CHARGED_BACK -> UPHELD"
          - "drives the parent audit APPEALED -> FINDINGS_ISSUED with a fresh appeal_deadline"
          - "increments AuditAppeal.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /warranty/appeals/{id}/decision with action=DENY"
        actor: AppealReviewer
        preconditions:
          - "appeal.status == FILED"
          - "X-User-ID != DealerAudit.lead_auditor_user_id"
        side_effects:
          - "every contested finding goes CHARGED_BACK -> UPHELD; reinstated_amount_cents stays 0"
          - "drives the parent audit APPEALED -> FINDINGS_ISSUED with a fresh appeal_deadline"
          - "increments AuditAppeal.version by 1"

  - entity: GoodwillAuthorization
    state_field: status
    shape: branching
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED, WITHDRAWN]
    note: >
      The initial state is PENDING when requested_amount_cents <= adjudicator_limit_cents and
      ESCALATED when adjudicator_limit_cents < requested_amount_cents <= manager_limit_cents.
    transitions:
      - from: null
        to: PENDING
        trigger: "POST /warranty/claims/{id}/goodwill-authorizations"
        actor: ClaimAdjudicator
        preconditions:
          - "claim.coverage_type == NONE"
          - "claim.status IN {SUBMITTED, SUSPENDED}"
          - "requested_amount_cents <= adjudicator_limit_cents"
        side_effects:
          - "computes out_of_warranty_margin_pct, adjudicator_limit_cents, manager_limit_cents"
          - "any prior GoodwillAuthorization for this claim in {PENDING, ESCALATED} becomes WITHDRAWN"
          - "increments WarrantyClaim.version by 1"
      - from: null
        to: ESCALATED
        trigger: "POST /warranty/claims/{id}/goodwill-authorizations"
        actor: ClaimAdjudicator
        preconditions:
          - "claim.coverage_type == NONE"
          - "claim.status IN {SUBMITTED, SUSPENDED}"
          - "adjudicator_limit_cents < requested_amount_cents <= manager_limit_cents"
        side_effects:
          - "identical to the null -> PENDING edge"
      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /warranty/claims/{id}/goodwill-authorizations (a newer request supersedes this one)"
        actor: system
        preconditions:
          - "authorization.status IN {PENDING, ESCALATED}"
        side_effects:
          - "increments GoodwillAuthorization.version by 1"
      - from: ESCALATED
        to: WITHDRAWN
        trigger: "POST /warranty/claims/{id}/goodwill-authorizations (a newer request supersedes this one)"
        actor: system
        preconditions:
          - "authorization.status IN {PENDING, ESCALATED}"
        side_effects:
          - "increments GoodwillAuthorization.version by 1"
      - from: PENDING
        to: APPROVED
        trigger: "POST /warranty/goodwill-authorizations/{id}/decision with action=APPROVE"
        actor: ClaimAdjudicator | AdjudicationManager
        preconditions:
          - "authorization.status IN {PENDING, ESCALATED}"
          - "X-User-ID != authorization.requested_by_user_id"
          - "approved_amount_cents <= (adjudicator_limit_cents when acting as ClaimAdjudicator, else manager_limit_cents)"
        side_effects:
          - "sets approved_amount_cents and decided_by_user_id"
          - "cascade: the linked WarrantyClaim.coverage_type flips NONE -> GOODWILL, the claim's open NO_COVERAGE edit is stamped resolved, suspend_edit_count is recomputed, and the claim returns SUSPENDED -> SUBMITTED when that count reaches 0"
          - "increments WarrantyClaim.version by 1; increments GoodwillAuthorization.version by 1"
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /warranty/goodwill-authorizations/{id}/decision with action=APPROVE"
        actor: AdjudicationManager
        preconditions:
          - "authorization.status IN {PENDING, ESCALATED}"
          - "X-User-ID != authorization.requested_by_user_id"
          - "the acting role is AdjudicationManager (a ClaimAdjudicator cannot decide an ESCALATED row)"
        side_effects:
          - "identical to the PENDING -> APPROVED edge"
      - from: PENDING
        to: DENIED
        trigger: "POST /warranty/goodwill-authorizations/{id}/decision with action=DENY"
        actor: ClaimAdjudicator | AdjudicationManager
        preconditions:
          - "authorization.status IN {PENDING, ESCALATED}"
          - "X-User-ID != authorization.requested_by_user_id"
          - "denial_reason is present and non-empty"
        side_effects:
          - "sets denial_reason and decided_by_user_id; the claim's coverage_type stays NONE"
          - "increments GoodwillAuthorization.version by 1"
      - from: ESCALATED
        to: DENIED
        trigger: "POST /warranty/goodwill-authorizations/{id}/decision with action=DENY"
        actor: AdjudicationManager
        preconditions:
          - "identical to the PENDING -> DENIED edge, plus the acting role must be AdjudicationManager"
        side_effects:
          - "identical to the PENDING -> DENIED edge"

concurrency_rules:
  - rule_id: labor-rate-request-create-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /warranty/labor-rate-requests"
    occ_field: "expected_dealer_version"
    description: |
      Creating a LaborRateRequest against a Dealer whose version has advanced since the client
      last observed it is rejected. This captures the case where an earlier writer has already
      created a request that legitimately superseded the prior SUBMITTED one (LaborRateRequest
      SUBMITTED -> WITHDRAWN), so the current writer's view of the dealer's approved rate and
      pending petition is stale and its statutory_ceiling_cents would be computed from obsolete
      inputs.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
  - rule_id: audit-create-stale-dealer
    parent_entity: Dealer
    write_endpoint: "POST /warranty/audits"
    occ_field: "expected_dealer_version"
    description: |
      Scheduling a DealerAudit against a Dealer whose version has advanced since the client last
      observed it is rejected. A second audit for a different, non-overlapping period is a
      legitimate operation on its own, so nothing in the state machine would stop it; the OCC
      check is what forces the scheduler to re-read the dealer's posture and audit_hold before
      committing another audit against it.
    error_id: ERR_STALE_DEALER_VERSION
    http_status: 412
  - rule_id: goodwill-create-stale-claim
    parent_entity: WarrantyClaim
    write_endpoint: "POST /warranty/claims/{id}/goodwill-authorizations"
    occ_field: "expected_claim_version"
    description: |
      Creating a GoodwillAuthorization against a WarrantyClaim whose version has advanced since
      the client last observed it is rejected. A new authorization legitimately supersedes any
      prior PENDING or ESCALATED one, so a second create would otherwise succeed against a claim
      whose provisional_total_cents (the input to both authority limits) has since been
      recomputed by a resubmission.
    error_id: ERR_STALE_CLAIM_VERSION
    http_status: 412
  - rule_id: appeal-create-stale-audit
    parent_entity: DealerAudit
    write_endpoint: "POST /warranty/audits/{id}/appeals"
    occ_field: "expected_audit_version"
    description: |
      Filing an AuditAppeal against a DealerAudit whose version has advanced since the client
      last observed it is rejected. Because a PARTIALLY_GRANTED or DENIED decision returns the
      audit to FINDINGS_ISSUED with a fresh deadline, a second appeal round is legitimate; the
      OCC check forces the filer to re-read which findings are still CHARGED_BACK and what the
      current appeal_deadline is before filing again.
    error_id: ERR_STALE_AUDIT_VERSION
    http_status: 412

calculations:
  - name: claim_coverage_determination
    trigger: "POST /warranty/claims and POST /warranty/claims/{id}/resubmit (writes WarrantyClaim.coverage_type)"
    algorithm: threshold
    formula: |
      months_elapsed = months_between(Vehicle.warranty_start_date, WarrantyClaim.repair_date)
        where months_between(a, b) =
          (b.year - a.year) * 12 + (b.month - a.month) - (1 if b.day < a.day else 0)
      miles_used = WarrantyClaim.odometer_at_repair - Vehicle.in_service_odometer

      # Powertrain is tested first and only for POWERTRAIN-category operations.
      if LaborOperation.category == "POWERTRAIN"
         and months_elapsed <= Vehicle.powertrain_months        # inclusive
         and miles_used     <= Vehicle.powertrain_miles:        # inclusive
          coverage_type = "POWERTRAIN"
      elif months_elapsed <= Vehicle.basic_months               # inclusive
       and miles_used     <= Vehicle.basic_miles:               # inclusive
          coverage_type = "BASIC"
      else:
          coverage_type = "NONE"

      # A BASIC-category operation NEVER falls back to powertrain terms, even when the vehicle
      # still has powertrain coverage left. coverage_type is later flipped NONE -> GOODWILL, and
      # only NONE -> GOODWILL, by an APPROVED GoodwillAuthorization.
    input_set: >
      Exactly one Vehicle row (WarrantyClaim.vehicle_id) and one LaborOperation row
      (WarrantyClaim.labor_operation_id). No other claims participate; prior repair history
      affects the REPEAT_REPAIR edit only, never coverage_type.
    constants: {}
    precision: "months_elapsed and miles_used are exact integers; no rounding"
    variants: []

  - name: claim_reimbursement_amount
    trigger: >
      provisional_at_submission runs on POST /warranty/claims and
      POST /warranty/claims/{id}/resubmit (writes provisional_labor_amount_cents,
      provisional_parts_amount_cents, provisional_total_cents). final_at_adjudication runs on
      POST /warranty/claims/{id}/adjudicate with decision=APPROVE (writes
      approved_labor_amount_cents, approved_parts_amount_cents, approved_total_cents,
      dealer_participation_cents, oem_payable_cents).
    algorithm: tiered_pricing
    formula: |
      # ---- Step 1: select the four inputs (this is where the two variants diverge) ----
      # provisional_at_submission:
      #   rate_cents = Dealer.approved_labor_rate_cents          (as of submission)
      #   markup_pct = Dealer.approved_parts_markup_pct          (UNCAPPED)
      #   hours      = WarrantyClaim.claimed_labor_hours         (UNCAPPED)
      #   parts_qty  = WarrantyClaim.claimed_parts_qty
      # final_at_adjudication:
      #   rate_cents = Dealer.approved_labor_rate_cents          (as of adjudication)
      #   markup_pct = min(Dealer.approved_parts_markup_pct, StateLawProfile.markup_cap_pct)
      #   hours      = min(WarrantyClaim.approved_labor_hours, LaborOperation.standard_time_hours)
      #   parts_qty  = WarrantyClaim.approved_parts_qty

      # ---- Step 2: labor. ONE rounding, on the product. ----
      labor_amount_cents = round_half_up(hours * rate_cents, 0)

      # ---- Step 3: parts. PINNED ROUNDING ORDER (round the marked-up UNIT price first,
      #      THEN multiply by quantity, THEN sum). ----
      unit_marked_up_cents = round_half_up(PartCatalogItem.dealer_net_cents * (1 + markup_pct), 0)
      parts_amount_cents   = unit_marked_up_cents * parts_qty          # exact integer multiply
      # FORBIDDEN alternative order (produces different cents and MUST NOT be implemented):
      #   parts_amount_cents = round_half_up(dealer_net_cents * (1 + markup_pct) * parts_qty, 0)
      # Worked divergence: dealer_net_cents=24799, markup_pct=0.40, parts_qty=3
      #   pinned    -> round_half_up(34718.6) = 34719 ; 34719 * 3 = 104157
      #   forbidden -> round_half_up(104155.8)        = 104156      (1 cent low)
      # When causal_part_id is null, parts_amount_cents = 0.

      # ---- Step 4: total. NO further rounding. ----
      total_cents = labor_amount_cents + parts_amount_cents

      # ---- Step 5 (final variant only): goodwill cap and policy adjustment ----
      if WarrantyClaim.coverage_type == "GOODWILL":
          approved_total_cents      = min(total_cents, GoodwillAuthorization.approved_amount_cents)
          dealer_participation_cents = round_half_up(
              approved_total_cents * GoodwillAuthorization.policy_adjustment_pct, 0)
      else:
          approved_total_cents      = total_cents
          dealer_participation_cents = 0
      oem_payable_cents = approved_total_cents - dealer_participation_cents
    input_set: >
      One Dealer, one LaborOperation, at most one PartCatalogItem, one StateLawProfile (via
      Dealer.state_law_profile_id) and, when coverage_type == GOODWILL, the single
      GoodwillAuthorization for this claim whose status == APPROVED. No other claims participate.
    constants: {}
    precision: "whole cents, round_half_up, applied exactly twice per variant (labor product, parts unit price)"
    variants:
      - name: provisional_at_submission
        when: "on POST /warranty/claims and POST /warranty/claims/{id}/resubmit"
        difference: >
          Uses the dealer's UNCAPPED approved_parts_markup_pct and the dealer's UNCAPPED
          claimed_labor_hours. Persisted to provisional_total_cents and never overwritten.
      - name: final_at_adjudication
        when: "on POST /warranty/claims/{id}/adjudicate with decision=APPROVE"
        difference: >
          Caps markup at StateLawProfile.markup_cap_pct and caps hours at
          LaborOperation.standard_time_hours, then applies the goodwill cap and policy adjustment.
          Worked divergence on identical claim data (rate 13750, markup 0.40, cap 0.30,
          dealer_net 24799, qty 3, claimed 2.2h, approved 2.0h, standard_time 1.5h):
          provisional_total_cents = 134407 vs approved_total_cents = 117342.

  - name: labor_rate_statutory_ceiling
    trigger: "POST /warranty/labor-rate-requests (writes LaborRateRequest.statutory_ceiling_cents)"
    algorithm: constraint_propagation
    formula: |
      if StateLawProfile.labor_rate_method == "RETAIL_SAMPLE":
          # the sample-sufficiency check (validations priority 78) runs BEFORE this formula
          ceiling_cents = min(
              StateLawProfile.max_labor_rate_cents,
              max(
                  LaborRateRequest.sample_median_rate_cents,
                  round_half_up(Dealer.approved_labor_rate_cents * (1 + MAX_STEP_UP_PCT), 0)
              )
          )
      else:  # TIME_AND_PRICE
          ceiling_cents = min(
              StateLawProfile.max_labor_rate_cents,
              round_half_up(Dealer.approved_labor_rate_cents * (1 + TIME_AND_PRICE_STEP_PCT), 0)
          )
      # Approval gate (validations priority 80): requested_labor_rate_cents <= ceiling_cents,
      # INCLUSIVE. Worked example: max_labor_rate_cents=19500, sample_median=17600,
      # current rate 13750 -> step-up floor round_half_up(17187.5)=17188 ->
      # max(17600, 17188)=17600 -> min(19500, 17600)=17600. A request for 17600 is inside;
      # 17601 is rejected.
    input_set: >
      One StateLawProfile (snapshotted on the request), one Dealer's current
      approved_labor_rate_cents, and the request's own sample fields. Three inputs interact
      non-linearly through a nested min/max whose branch is selected by labor_rate_method.
    constants:
      MAX_STEP_UP_PCT: 0.25
      TIME_AND_PRICE_STEP_PCT: 0.10
    precision: "whole cents, round_half_up on the step-up product only"
    variants: []

  - name: claim_edit_engine
    trigger: "POST /warranty/claims and POST /warranty/claims/{id}/resubmit (appends ClaimEdit rows and sets WarrantyClaim.suspend_edit_count)"
    algorithm: threshold
    formula: |
      edits = []
      # SUSPEND-severity edits
      if claimed_labor_hours > LaborOperation.standard_time_hours:           # strictly greater
          edits += [(EXCESSIVE_TIME, SUSPEND)]
      if provisional_total_cents >= HIGH_VALUE_THRESHOLD_CENTS:              # inclusive
          edits += [(HIGH_VALUE, SUSPEND)]
      if coverage_type == "NONE":
          edits += [(NO_COVERAGE, SUSPEND)]
      # WARN-severity edits
      if len(correction_text) < NARRATIVE_THIN_CHARS:                        # strictly less
          edits += [(NARRATIVE_THIN, WARN)]
      prior = the WarrantyClaim P maximizing P.repair_date, tie-broken by P.created_at ASC, over
              claims where P.dealer_id == claim.dealer_id
                        and P.vehicle_id == claim.vehicle_id
                        and P.labor_operation.overlap_group == claim.labor_operation.overlap_group
                        and P.status IN {SUBMITTED, SUSPENDED, APPROVED}
                        and P.id != claim.id
                        and OVERLAP_BUFFER_DAYS
                            < (claim.repair_date - P.repair_date) in days
                            <= REPEAT_REPAIR_WINDOW_DAYS
      if prior exists:
          edits += [(REPEAT_REPAIR, WARN, conflicting_claim_id = prior.id)]
      # Edits are appended in the fixed order listed above, so ClaimEdit.created_at ordering is
      # deterministic. suspend_edit_count = count of appended edits with severity == SUSPEND.
      # status = SUSPENDED if suspend_edit_count > 0 else SUBMITTED
    input_set: >
      The claim under construction, its LaborOperation, its provisional_total_cents (already
      computed in the same request), and — for REPEAT_REPAIR only — prior claims on the same
      (dealer_id, vehicle_id, overlap_group) with status IN {SUBMITTED, SUSPENDED, APPROVED}.
      DENIED and VOID prior claims are excluded.
    constants:
      HIGH_VALUE_THRESHOLD_CENTS: 150000
      NARRATIVE_THIN_CHARS: 20
      OVERLAP_BUFFER_DAYS: 30
      REPEAT_REPAIR_WINDOW_DAYS: 180
    precision: "integer day arithmetic on repair_date; no rounding"
    variants: []

  - name: parts_non_return_debit
    trigger: >
      POST /warranty/parts-returns/{id}/analysis (analysis_result IN {NO_DEFECT_FOUND,
      NOT_AVAILABLE}) and POST /warranty/parts-returns/non-return-sweep (writes
      PartsReturnRequest.debit_amount_cents and WarrantyClaim.debited_amount_cents).
    algorithm: threshold
    formula: |
      claim = the WarrantyClaim named by PartsReturnRequest.claim_id
      if reason == "NOT_RETURNED":            # non-return sweep
          debit_amount_cents = claim.approved_total_cents                       # full claim
      elif analysis_result == "NO_DEFECT_FOUND":
          debit_amount_cents = claim.approved_parts_amount_cents                # parts only
      elif analysis_result == "NOT_AVAILABLE":
          debit_amount_cents = round_half_up(claim.approved_parts_amount_cents
                                             * NOT_AVAILABLE_SHARE, 0)          # half the parts
      else:  # DEFECT_CONFIRMED
          debit_amount_cents = 0
    input_set: >
      Exactly one PartsReturnRequest and the one WarrantyClaim it names, which must be in status
      APPROVED (a DENIED or VOID claim's return is WAIVED, never debited).
    constants:
      NOT_AVAILABLE_SHARE: 0.50
    precision: "whole cents, round_half_up on the NOT_AVAILABLE branch only"
    variants: []

  - name: audit_extrapolated_chargeback
    trigger: >
      POST /warranty/audits/{id}/issue-findings and POST /warranty/appeals/{id}/decision (writes
      DealerAudit.sample_paid_snapshot_cents, population_paid_snapshot_cents, error_rate,
      extrapolation_factor, sample_chargeback_cents, extrapolated_chargeback_cents,
      total_chargeback_cents).
    algorithm: forward_looking
    formula: |
      # ---------- PINNED EVALUATION ORDER ----------
      # The inputs read in steps 1 and 3 are the very fields step 7 mutates (claim
      # payment_status), so the order below is normative: the snapshots are taken BEFORE any
      # chargeback is applied, and they are PERSISTED on the audit so every later appeal
      # decision recomputes against the same denominators.

      # Step 1 (issue-findings only) — sampled paid amount
      sampled_claim_ids = { F.claim_id : F is an AuditFinding with F.audit_id == audit.id }
      sample_paid_snapshot_cents = SUM(C.approved_total_cents) over claims C where
          C.id IN sampled_claim_ids
          and C.dealer_id == audit.dealer_id
          and C.status == "APPROVED"
          and C.payment_status == "PAID"
          and audit.period_start <= C.repair_date < audit.period_end      # half-open
      # Step 2 (issue-findings only) — non-sampled paid remainder
      all_in_period_paid_cents = SUM(C.approved_total_cents) over claims C where
          C.dealer_id == audit.dealer_id
          and C.status == "APPROVED"
          and C.payment_status == "PAID"
          and audit.period_start <= C.repair_date < audit.period_end
      population_paid_snapshot_cents = all_in_period_paid_cents - sample_paid_snapshot_cents

      # Step 3 — unsupported amount still standing (recomputed on every appeal decision)
      sample_chargeback_cents = SUM(F.unsupported_amount_cents) over findings F where
          F.audit_id == audit.id and F.status IN {"OPEN", "CHARGED_BACK", "UPHELD"}
      # OVERTURNED findings are excluded; this is the only term an appeal changes.

      # Step 4 — error rate against the pinned denominator
      if sample_paid_snapshot_cents == 0:
          error_rate = 0.0
      else:
          error_rate = round_half_up(sample_chargeback_cents / sample_paid_snapshot_cents, 4)

      # Step 5 — tier selection (boundaries inclusive on the lower edge)
      if   error_rate >= EXTRAPOLATION_FULL_TIER:  extrapolation_factor = 1.00
      elif error_rate >= EXTRAPOLATION_HALF_TIER:  extrapolation_factor = 0.50
      else:                                        extrapolation_factor = 0.00

      # Step 6 — extrapolate, then total
      extrapolated_chargeback_cents = round_half_up(
          population_paid_snapshot_cents * error_rate * extrapolation_factor, 0)
      total_chargeback_cents = sample_chargeback_cents + extrapolated_chargeback_cents

      # Step 7 — ONLY NOW: flip findings, debit claims, append ledger entries, recompute the
      # dealer's balance and posture. On an appeal decision, the ledger entries appended are the
      # DELTAS: (old_sample - new_sample) and (old_extrapolated - new_extrapolated), each as a
      # negative amount_cents, and each entry omitted entirely when its delta is 0.
      #
      # Worked example (issue-findings): three in-period PAID claims of 50000 each, one sampled
      # with a 30000 finding. sample_paid=50000, population_paid=100000,
      # error_rate=round_half_up(0.6,4)=0.6000, factor=1.00, extrapolated=60000, total=90000.
      # Worked example (PARTIAL appeal): two sampled claims (sample_paid=100000, findings
      # 30000+10000=40000, population_paid=50000) give error_rate 0.4000, extrapolated 20000,
      # total 60000; overturning the 10000 finding recomputes error_rate 0.3000, extrapolated
      # 15000, total 45000, and appends -10000 and -5000 reversal entries.
    input_set: >
      Claims of audit.dealer_id with status == APPROVED, payment_status == PAID and repair_date in
      the half-open window [period_start, period_end), split by whether an AuditFinding of this
      audit names them. Steps 1 and 2 run once, at issue-findings time, against the pre-chargeback
      payment_status; step 3 onward re-run on every appeal decision against the persisted
      snapshots.
    constants:
      EXTRAPOLATION_FULL_TIER: 0.10
      EXTRAPOLATION_HALF_TIER: 0.05
    precision: "error_rate to 4 decimal places round_half_up; all money to whole cents round_half_up"
    variants: []

  - name: dealer_warranty_expense_per_vehicle
    trigger: "GET /warranty/dealers/{id}/expense-analytics (writes Dealer.outlier_flag)"
    algorithm: aggregation
    formula: |
      window_start = the request's window_start, else current_utc minus ANALYTICS_WINDOW_DAYS days
      window_end   = the request's window_end,   else current_utc
      # window applies to WarrantyClaim.repair_date, half-open: window_start <= repair_date < window_end

      # ---- variant paid_basis ----
      paid_numerator_cents = SUM(C.approved_total_cents) over claims C where
          C.dealer_id == dealer.id and C.status == "APPROVED"
          and C.payment_status == "PAID"
          and window_start <= C.repair_date < window_end
      # ---- variant incurred_basis ----
      incurred_numerator_cents = SUM(C.approved_total_cents) over claims C where
          C.dealer_id == dealer.id and C.status == "APPROVED"
          and C.payment_status IN {"UNPAID", "PAID", "DEBITED", "CREDIT_REINSTATED"}
          and window_start <= C.repair_date < window_end

      if dealer.vehicles_in_operation == 0:
          warranty_expense_per_vehicle_paid_cents     = 0
          warranty_expense_per_vehicle_incurred_cents = 0
      else:
          warranty_expense_per_vehicle_paid_cents = round_half_up(
              paid_numerator_cents / dealer.vehicles_in_operation, 0)
          warranty_expense_per_vehicle_incurred_cents = round_half_up(
              incurred_numerator_cents / dealer.vehicles_in_operation, 0)

      # ---- peer median (always on the paid_basis variant) ----
      peers = every Dealer D with D.vehicles_in_operation > 0 and
              D.status IN {"ACTIVE", "PROBATION", "SUSPENDED"}   # i.e. every dealer with vehicles
      peer_values = [ paid_basis expense per vehicle of D for D in peers ], including this dealer
      sort peer_values ascending by value, tie-broken by the owning Dealer.created_at ASC
      n = len(peer_values)
      if n == 0:            peer_median_paid_cents = 0
      elif n is odd:        peer_median_paid_cents = peer_values[(n - 1) // 2]
      else:                 peer_median_paid_cents = round_half_up(
                                (peer_values[n//2 - 1] + peer_values[n//2]) / 2, 0)

      if peer_median_paid_cents == 0:
          outlier_ratio = 0.0
      else:
          outlier_ratio = round_half_up(
              warranty_expense_per_vehicle_paid_cents / peer_median_paid_cents, 4)
      outlier_flag = (outlier_ratio >= OUTLIER_RATIO_THRESHOLD)     # inclusive
      # Worked example: DX1 (100 vehicles) has one PAID claim of 50000 and one UNPAID APPROVED
      # claim of 20000 -> paid 500/vehicle, incurred 700/vehicle. DX2 (100 vehicles) has one
      # PAID claim of 5000 -> 50/vehicle. peer_values=[50,500], median=round_half_up(275.0)=275,
      # outlier_ratio for DX1 = round_half_up(1.8181...,4) = 1.8182 >= 1.50 -> outlier_flag true.
    input_set: >
      All APPROVED claims of the dealer whose repair_date lies in the half-open analytics window,
      partitioned by payment_status per variant; plus every Dealer with vehicles_in_operation > 0
      for the peer median (which always uses the paid_basis variant, never the incurred one).
    constants:
      ANALYTICS_WINDOW_DAYS: 365
      OUTLIER_RATIO_THRESHOLD: 1.50
    precision: "whole cents round_half_up for the per-vehicle figures and the median; outlier_ratio to 4 decimals round_half_up"
    variants:
      - name: paid_basis
        when: "reported as warranty_expense_per_vehicle_paid_cents and used for the peer median and outlier_flag"
        difference: >
          Counts only claims whose payment_status == PAID, so an APPROVED-but-unpaid claim is
          invisible and a claim later charged back (DEBITED) drops out of the metric entirely.
      - name: incurred_basis
        when: "reported as warranty_expense_per_vehicle_incurred_cents"
        difference: >
          Counts every APPROVED claim regardless of payment_status, so unpaid and charged-back
          claims both stay in. On identical data this is strictly >= paid_basis; worked example
          500 vs 700 cents per vehicle.

  - name: goodwill_authorization_limit
    trigger: "POST /warranty/claims/{id}/goodwill-authorizations (writes out_of_warranty_margin_pct, adjudicator_limit_cents, manager_limit_cents and selects the initial status)"
    algorithm: decay_function
    formula: |
      if claim.coverage_type != "NONE":
          out_of_warranty_margin_pct = 0.0
      else:
          miles_over  = max(0, claim.odometer_at_repair
                               - Vehicle.in_service_odometer - Vehicle.basic_miles)
          months_over = max(0, months_between(Vehicle.warranty_start_date, claim.repair_date)
                               - Vehicle.basic_months)
          out_of_warranty_margin_pct = round_half_up(
              max(miles_over / Vehicle.basic_miles, months_over / Vehicle.basic_months), 4)

      decay = max(0.0, 1.0 - out_of_warranty_margin_pct * GOODWILL_DECAY_FACTOR)
      share_cap_cents = round_half_up(claim.provisional_total_cents * GOODWILL_MAX_SHARE, 0)
      adjudicator_limit_cents = min(round_half_up(ADJUDICATOR_BASE_LIMIT_CENTS * decay, 0),
                                    share_cap_cents)
      manager_limit_cents     = min(round_half_up(MANAGER_BASE_LIMIT_CENTS * decay, 0),
                                    share_cap_cents)

      if   requested_amount_cents <= adjudicator_limit_cents:  initial status = "PENDING"
      elif requested_amount_cents <= manager_limit_cents:      initial status = "ESCALATED"
      else:                                                    ERR_GOODWILL_LIMIT_EXCEEDED
      # Worked example: basic 36 months / 36000 miles, in_service 0, repair at 39600 miles and
      # 35 months -> miles_over 3600, months_over 0, margin = round_half_up(0.1,4) = 0.1000,
      # decay = 0.8. provisional_total 60000 -> share_cap 48000.
      # adjudicator_limit = min(40000, 48000) = 40000 ; manager_limit = min(200000, 48000) = 48000.
      # 40000 -> PENDING ; 45000 and 48000 -> ESCALATED ; 48001 -> ERR_GOODWILL_LIMIT_EXCEEDED.
    input_set: >
      One WarrantyClaim (its coverage_type, odometer_at_repair, repair_date and
      provisional_total_cents) and its one Vehicle. No other claims or authorizations participate;
      a superseded prior authorization does not raise or lower these limits.
    constants:
      ADJUDICATOR_BASE_LIMIT_CENTS: 50000
      MANAGER_BASE_LIMIT_CENTS: 250000
      GOODWILL_DECAY_FACTOR: 2.0
      GOODWILL_MAX_SHARE: 0.80
    precision: "margin to 4 decimals round_half_up; money to whole cents round_half_up"
    variants: []

  - name: dealer_chargeback_balance
    trigger: "every ChargebackLedgerEntry append (writes Dealer.chargeback_balance_cents, ChargebackLedgerEntry.balance_after_cents and Dealer.status)"
    algorithm: aggregation
    formula: |
      # Invariant, checked after every append:
      Dealer.chargeback_balance_cents ==
          SUM(E.amount_cents) over every ChargebackLedgerEntry E where E.dealer_id == Dealer.id
      # Incremental form actually executed, in ledger-append order (created_at ASC):
      new_balance = old_balance + entry.amount_cents
      entry.balance_after_cents = new_balance
      # Posture, recomputed from new_balance immediately after each append:
      if   new_balance >= SUSPENSION_THRESHOLD_CENTS: Dealer.status = "SUSPENDED"
      elif new_balance >= PROBATION_THRESHOLD_CENTS:  Dealer.status = "PROBATION"
      else:                                           Dealer.status = "ACTIVE"
      # Compensating invariant: for any forward debit of X followed by its reversal of -X, the
      # balance returns to its exact pre-debit value and Dealer.status returns to the posture that
      # value implies. Zero drift is required; no rounding occurs anywhere in this calculation.
    input_set: >
      Every ChargebackLedgerEntry for the dealer, with no status filter (the ledger is append-only
      and has no status). Entries appended within one request are applied in the order the
      triggering transition lists them.
    constants:
      PROBATION_THRESHOLD_CENTS: 90000
      SUSPENSION_THRESHOLD_CENTS: 200000
    precision: "exact integer cents; no rounding"
    variants: []

  - name: dealer_open_parts_return_count
    trigger: >
      PartsReturnRequest creation (claim submission), REQUESTED -> RECEIVED, REQUESTED ->
      NOT_RETURNED and REQUESTED -> WAIVED (writes Dealer.open_parts_return_count).
    algorithm: aggregation
    formula: |
      # Invariant, checked after every one of the four triggering transitions:
      Dealer.open_parts_return_count ==
          COUNT(R) over PartsReturnRequest R where
              R.status == "REQUESTED"
              and the WarrantyClaim named by R.claim_id has dealer_id == Dealer.id
      # Incremental form actually executed:
      #   +1 when a PartsReturnRequest is created in REQUESTED
      #   -1 when a REQUESTED row leaves REQUESTED for any of RECEIVED, NOT_RETURNED, WAIVED
      #   no change on NOT_RETURNED -> RECEIVED (the row already left REQUESTED)
      # Compensating invariant: submitting a claim whose causal part has return_required == true
      # and then voiding that claim leaves this count at its exact pre-submission value.
    input_set: >
      Every PartsReturnRequest whose claim belongs to the dealer, filtered to status ==
      REQUESTED. RECEIVED, ANALYZED, NOT_RETURNED and WAIVED rows are excluded.
    constants: {}
    precision: "exact integer count; no rounding"
    variants: []

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 22
    category: auth
    check: >
      for DealerWarrantyAdmin (identity entity_backed:Dealer) the X-User-ID must equal the
      dealer_id reached from the target resource: Dealer.id itself, WarrantyClaim.dealer_id,
      DealerAudit.dealer_id, AuditAppeal.filed_by_dealer_id, or the claim behind a
      PartsReturnRequest. On POST /warranty/claims and POST /warranty/audits/{id}/appeals the
      body's dealer_id / filed_by_dealer_id must equal X-User-ID.
    error_id: ERR_DEALER_SCOPE_VIOLATION
    http_status: 403
    applies_to: >
      GET /warranty/dealers/{id}, GET /warranty/dealers/{id}/ledger-entries,
      GET /warranty/dealers/{id}/expense-analytics, POST /warranty/claims,
      GET /warranty/claims/{id}, POST /warranty/claims/{id}/resubmit,
      GET /warranty/claims/{id}/edits, GET /warranty/audits/{id},
      POST /warranty/audits/{id}/appeals, GET /warranty/appeals/{id}

  - priority: 25
    category: auth
    check: >
      segregation of duties on X-User-ID. (a) POST /warranty/claims/{id}/adjudicate: the acting
      user must not equal an existing GoodwillAuthorization.decided_by_user_id for this claim.
      (b) POST /warranty/goodwill-authorizations/{id}/decision: the acting user must not equal
      GoodwillAuthorization.requested_by_user_id. (c) POST /warranty/appeals/{id}/decision: the
      acting user must not equal DealerAudit.lead_auditor_user_id of the appealed audit.
      (d) POST /warranty/labor-rate-requests/{id}/decision: the acting user must not equal
      LaborRateRequest.submitted_by_user_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: >
      POST /warranty/claims/{id}/adjudicate, POST /warranty/goodwill-authorizations/{id}/decision,
      POST /warranty/appeals/{id}/decision, POST /warranty/labor-rate-requests/{id}/decision

  - priority: 30
    category: existence
    check: "the path {id} resolves to a live row of the endpoint's own entity"
    error_id: >
      ERR_DEALER_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_LABOR_OPERATION_NOT_FOUND |
      ERR_CATALOG_ITEM_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_LABOR_RATE_REQUEST_NOT_FOUND |
      ERR_PARTS_RETURN_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_FINDING_NOT_FOUND |
      ERR_APPEAL_NOT_FOUND | ERR_GOODWILL_AUTH_NOT_FOUND | ERR_STATE_LAW_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint with a path parameter"

  - priority: 32
    category: existence
    check: >
      every foreign key in the request body resolves, validated in the fixed left-to-right order
      the endpoint's input list declares (e.g. POST /warranty/claims checks dealer_id, then
      vehicle_id, then labor_operation_id, then causal_part_id)
    error_id: >
      ERR_DEALER_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_LABOR_OPERATION_NOT_FOUND |
      ERR_CATALOG_ITEM_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_STATE_LAW_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "every POST that accepts a foreign key in its body"

  - priority: 35
    category: business_constraint
    check: >
      body shape: required fields present, enums within their declared domain, integers
      non-negative, decimal-string numerics parseable, repair_date/period dates ISO-8601,
      period_start < period_end, requested_labor_rate_cents > 0, claimed_labor_hours > 0,
      claimed_parts_qty >= 1 when causal_part_id is present and == 0 when it is absent,
      unsupported_amount_cents >= 0
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST endpoints"

  - priority: 38
    category: business_constraint
    check: >
      optimistic concurrency: the supplied expected_<parent>_version equals the parent's current
      version, per the four §1.2.1 concurrency_rules
    error_id: ERR_STALE_DEALER_VERSION | ERR_STALE_CLAIM_VERSION | ERR_STALE_AUDIT_VERSION
    http_status: 412
    applies_to: >
      POST /warranty/labor-rate-requests, POST /warranty/audits,
      POST /warranty/claims/{id}/goodwill-authorizations, POST /warranty/audits/{id}/appeals

  - priority: 40
    category: state
    check: >
      the target resource is in a state from which the requested transition is declared in §1.2
      (claim adjudicable / payable / voidable / resubmittable, parts-return receivable or
      analyzable, audit startable or closable, finding attachable, appeal decidable, goodwill
      decidable, labor-rate request reviewable or decidable). ERR_CLAIM_STILL_SUSPENDED is the
      narrower case: the claim IS adjudicable by state but carries an open DEALER_POSTURE_HOLD
      edit, which only a dealer posture recovery can lift
    error_id: >
      ERR_CLAIM_NOT_ADJUDICABLE | ERR_CLAIM_NOT_PAYABLE | ERR_CLAIM_NOT_VOIDABLE |
      ERR_CLAIM_NOT_RESUBMITTABLE | ERR_CLAIM_STILL_SUSPENDED |
      ERR_PARTS_RETURN_INVALID_STATE | ERR_AUDIT_INVALID_STATE | ERR_APPEAL_INVALID_STATE |
      ERR_GOODWILL_INVALID_STATE | ERR_LABOR_RATE_REQUEST_INVALID_STATE
    http_status: 409
    applies_to: "every action endpoint that drives a state transition"

  - priority: 45
    category: business_safety
    check: >
      the Dealer behind the operation is not SUSPENDED. Blocks new claim submission, claim
      resubmission, labor-rate requests and claim payment. Audits, findings, appeals and parts
      returns are deliberately NOT blocked — a suspended dealer must still be auditable and must
      still be able to appeal.
    error_id: ERR_DEALER_SUSPENDED
    http_status: 409
    applies_to: >
      POST /warranty/claims, POST /warranty/claims/{id}/resubmit, POST /warranty/claims/{id}/pay,
      POST /warranty/labor-rate-requests

  - priority: 47
    category: business_safety
    check: >
      cross-entity state dependency: the claim's Dealer must not have audit_hold == true (set when
      any DealerAudit of that dealer is IN_FIELD or FINDINGS_ISSUED, cleared when all its audits
      are CLOSED). Payment of an in-period claim is frozen for the duration of the audit.
    error_id: ERR_DEALER_UNDER_AUDIT_HOLD
    http_status: 409
    applies_to: "POST /warranty/claims/{id}/pay"

  - priority: 50
    category: business_safety
    check: >
      cross-entity state dependency: an audit cannot be closed while any AuditAppeal of that audit
      is in status FILED. Reached with the audit in FINDINGS_ISSUED or APPEALED, both of which the
      close transition accepts as from-states, so this rule — not a generic state error — speaks.
    error_id: ERR_APPEAL_PENDING
    http_status: 409
    applies_to: "POST /warranty/audits/{id}/close"

  - priority: 55
    category: business_temporal
    check: >
      the appeal is filed within StateLawProfile.appeal_window_days of
      DealerAudit.findings_issued_at, inclusive: current_utc <= findings_issued_at +
      appeal_window_days days
    error_id: ERR_APPEAL_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /warranty/audits/{id}/appeals"

  - priority: 57
    category: business_referential
    check: >
      every finding_id in the appeal body belongs to the audit named in the path and is in status
      CHARGED_BACK
    error_id: ERR_FINDING_NOT_IN_AUDIT
    http_status: 409
    applies_to: "POST /warranty/audits/{id}/appeals"

  - priority: 59
    category: business_referential
    check: >
      the claim named by a finding belongs to the audit's dealer, has status APPROVED, has
      payment_status IN {UNPAID, PAID}, has repair_date inside the half-open audit period
      [period_start, period_end), and is not already named by another finding of the same audit
    error_id: ERR_CLAIM_NOT_ELIGIBLE_FOR_FINDING
    http_status: 409
    applies_to: "POST /warranty/audits/{id}/findings"

  - priority: 60
    category: business_constraint
    check: >
      no other live claim (status IN {SUBMITTED, SUSPENDED, APPROVED}) of the same dealer_id has
      the same repair_order_number
    error_id: ERR_DUPLICATE_REPAIR_ORDER
    http_status: 409
    applies_to: "POST /warranty/claims, POST /warranty/claims/{id}/resubmit"

  - priority: 62
    category: business_temporal
    check: >
      resource-temporal overlap on the Vehicle. No other claim C with status IN {SUBMITTED,
      SUSPENDED, APPROVED}, the same vehicle_id, and the same LaborOperation.overlap_group may
      have abs(C.repair_date - repair_date) <= OVERLAP_BUFFER_DAYS (30). The interval is CLOSED
      on both ends: a gap of exactly 30 days collides, a gap of 31 days does not. A claim's own
      resubmission predecessor (resubmission_of_claim_id) is exempt.
    error_id: ERR_OVERLAPPING_REPAIR_CLAIM
    http_status: 409
    applies_to: "POST /warranty/claims, POST /warranty/claims/{id}/resubmit"

  - priority: 64
    category: business_temporal
    check: >
      resource-temporal overlap on the Dealer. No other DealerAudit of the same dealer_id with
      status IN {SCHEDULED, IN_FIELD, FINDINGS_ISSUED, APPEALED} may have a period intersecting
      [period_start, period_end). Intervals are HALF-OPEN with NO buffer, so a new period whose
      period_start equals another period's period_end is accepted.
    error_id: ERR_AUDIT_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /warranty/audits"

  - priority: 68
    category: business_constraint
    check: >
      repair narrative completeness: complaint_text, cause_text and correction_text are each
      present and each at least NARRATIVE_MIN_CHARS (10) characters after trimming
    error_id: ERR_NARRATIVE_INCOMPLETE
    http_status: 422
    applies_to: "POST /warranty/claims, POST /warranty/claims/{id}/resubmit"

  - priority: 70
    category: business_constraint
    check: >
      conditional validation on the labor operation's configuration: when
      LaborOperation.requires_causal_part is true the claim must supply causal_part_id, that part's
      failure_group must equal LaborOperation.causal_failure_group, and claimed_parts_qty must be
      >= 1. When requires_causal_part is false, supplying causal_part_id is also rejected by this
      rule.
    error_id: ERR_CAUSAL_PART_REQUIRED
    http_status: 422
    applies_to: "POST /warranty/claims, POST /warranty/claims/{id}/resubmit"

  - priority: 75
    category: business_fiscal
    check: >
      claimed_labor_hours must not exceed LaborOperation.max_time_hours (inclusive ceiling). Hours
      above standard_time_hours but at or below max_time_hours are accepted and merely raise an
      EXCESSIVE_TIME suspend edit. On adjudicate with decision=APPROVE the same ceiling applies to
      approved_labor_hours.
    error_id: ERR_LABOR_TIME_EXCEEDS_MAX
    http_status: 422
    applies_to: "POST /warranty/claims, POST /warranty/claims/{id}/resubmit, POST /warranty/claims/{id}/adjudicate"

  - priority: 78
    category: business_constraint
    check: >
      cascading validation: when StateLawProfile.labor_rate_method == RETAIL_SAMPLE the request
      must carry sample_repair_order_count >= StateLawProfile.min_sample_repair_orders and a non-null
      sample_median_rate_cents. This check runs BEFORE the statutory ceiling at priority 80,
      which consumes sample_median_rate_cents.
    error_id: ERR_INSUFFICIENT_RATE_SAMPLE
    http_status: 422
    applies_to: "POST /warranty/labor-rate-requests"

  - priority: 80
    category: business_fiscal
    check: >
      requested_labor_rate_cents <= statutory_ceiling_cents from the labor_rate_statutory_ceiling
      calculation, inclusive
    error_id: ERR_LABOR_RATE_ABOVE_STATUTORY_CEILING
    http_status: 422
    applies_to: "POST /warranty/labor-rate-requests"

  - priority: 82
    category: business_fiscal
    check: >
      requested_parts_markup_pct <= StateLawProfile.markup_cap_pct, inclusive, when the request
      carries a markup change
    error_id: ERR_MARKUP_ABOVE_STATE_CAP
    http_status: 422
    applies_to: "POST /warranty/labor-rate-requests"

  - priority: 85
    category: business_fiscal
    check: >
      requested_amount_cents <= manager_limit_cents from the goodwill_authorization_limit
      calculation, inclusive. At or below adjudicator_limit_cents the authorization opens PENDING;
      above that but at or below manager_limit_cents it opens ESCALATED; above
      manager_limit_cents this rule rejects the request.
    error_id: ERR_GOODWILL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /warranty/claims/{id}/goodwill-authorizations"

  - priority: 87
    category: business_fiscal
    check: >
      on POST /warranty/goodwill-authorizations/{id}/decision with action=APPROVE the
      approved_amount_cents must be > 0 and <= the limit for the deciding role
      (adjudicator_limit_cents for ClaimAdjudicator, manager_limit_cents for AdjudicationManager)
    error_id: ERR_GOODWILL_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /warranty/goodwill-authorizations/{id}/decision"

  - priority: 88
    category: business_fiscal
    check: >
      cross-entity state dependency: a claim whose coverage_type is NONE cannot be approved. It
      needs exactly one GoodwillAuthorization in status APPROVED, which flips coverage_type to
      GOODWILL before this check runs.
    error_id: ERR_NO_COVERAGE_WITHOUT_GOODWILL
    http_status: 409
    applies_to: "POST /warranty/claims/{id}/adjudicate"

  - priority: 90
    category: business_referential
    check: >
      an APPROVED claim whose causal part has return_required == true cannot be paid while its
      PartsReturnRequest is still in status REQUESTED and the logical clock is at or past that
      request's due_date; the non-return sweep must run first
    error_id: ERR_PARTS_RETURN_OVERDUE
    http_status: 409
    applies_to: "POST /warranty/claims/{id}/pay"

endpoints:
  # ---------------------------------------------------------------- reference data
  - method: POST
    path: "/warranty/state-law-profiles"
    description: "Register a state's warranty statute profile: parts markup cap, labor-rate method, deemed-approval clock and appeal window."
    roles: [WarrantyAdmin]
    code: 201
    input: [state_code, markup_cap_pct, labor_rate_method, min_sample_repair_orders, max_labor_rate_cents, deemed_approved_days, appeal_window_days]
    output: StateLawProfile
    side_effects: []

  - method: GET
    path: "/warranty/state-law-profiles/{id}"
    description: "Read one state law profile."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, AppealReviewer]
    code: 200
    input: []
    output: StateLawProfile
    side_effects: []

  - method: POST
    path: "/warranty/dealers"
    description: "Enroll a dealer in the warranty program with a starting approved labor rate and parts markup."
    roles: [WarrantyAdmin]
    code: 201
    input: [dealer_code, name, state_law_profile_id, vehicles_in_operation, initial_labor_rate_cents, initial_parts_markup_pct]
    output: Dealer
    side_effects:
      - "sets approved_labor_rate_cents = initial_labor_rate_cents and approved_parts_markup_pct = initial_parts_markup_pct"
      - "sets status=ACTIVE, chargeback_balance_cents=0, open_parts_return_count=0, audit_hold=false, outlier_flag=false, version=1"
      - "labor_rate_effective_date is left null until a LaborRateRequest is approved"

  - method: GET
    path: "/warranty/dealers/{id}"
    description: "Read one dealer, including the live chargeback_balance_cents, open_parts_return_count, audit_hold, outlier_flag and version."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, AppealReviewer, DealerWarrantyAdmin]
    code: 200
    input: []
    output: Dealer
    side_effects: []

  - method: GET
    path: "/warranty/dealers"
    description: "List dealers, filterable by state law profile, posture and outlier flag."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager]
    code: 200
    input: ["state_law_profile_id?", "status?", "outlier_flag?", "audit_hold?", "limit?", "offset?"]
    output: Dealer[]
    side_effects: []

  - method: GET
    path: "/warranty/dealers/{id}/ledger-entries"
    description: "List the dealer's append-only chargeback ledger in created_at ASC order; reverse-reachability channel for ChargebackLedgerEntry rows, which no create response ever returns."
    roles: [WarrantyAdmin, FieldAuditor, AuditManager, DealerWarrantyAdmin]
    code: 200
    input: ["source_type?", "claim_id?", "limit?", "offset?"]
    output: ChargebackLedgerEntry[]
    side_effects: []

  - method: GET
    path: "/warranty/dealers/{id}/expense-analytics"
    description: "Computed read: warranty expense per vehicle in operation on both the paid and incurred bases, the peer median on the paid basis, and the outlier ratio. Recomputes and persists Dealer.outlier_flag."
    roles: [WarrantyAdmin, AdjudicationManager, FieldAuditor, AuditManager, DealerWarrantyAdmin]
    code: 200
    input: ["window_start?", "window_end?"]
    output: "{ dealer_id: string, window_start: date, window_end: date, vehicles_in_operation: integer, paid_numerator_cents: integer, incurred_numerator_cents: integer, warranty_expense_per_vehicle_paid_cents: integer, warranty_expense_per_vehicle_incurred_cents: integer, peer_median_paid_cents: integer, outlier_ratio: decimal, outlier_flag: boolean, paid_claim_count: integer, incurred_claim_count: integer }"
    side_effects:
      - "runs dealer_warranty_expense_per_vehicle (both variants)"
      - "writes Dealer.outlier_flag; increments Dealer.version by 1 when outlier_flag changes"

  - method: POST
    path: "/warranty/vehicles"
    description: "Register a vehicle with its basic and powertrain warranty terms."
    roles: [WarrantyAdmin]
    code: 201
    input: [vin, model_year, warranty_start_date, in_service_odometer, basic_months, basic_miles, powertrain_months, powertrain_miles]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/warranty/vehicles/{id}"
    description: "Read one vehicle and its warranty terms."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, DealerWarrantyAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/warranty/labor-operations"
    description: "Publish a labor operation with its standard and maximum flat-rate times, coverage category, causal-part requirement and overlap group."
    roles: [WarrantyAdmin]
    code: 201
    input: [op_code, description, standard_time_hours, max_time_hours, category, requires_causal_part, "causal_failure_group?", overlap_group]
    output: LaborOperation
    side_effects: []

  - method: GET
    path: "/warranty/labor-operations/{id}"
    description: "Read one labor operation."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, DealerWarrantyAdmin]
    code: 200
    input: []
    output: LaborOperation
    side_effects: []

  - method: POST
    path: "/warranty/parts"
    description: "Publish a part with its dealer net price, return requirement and retention window."
    roles: [WarrantyAdmin]
    code: 201
    input: [part_number, description, dealer_net_cents, failure_group, return_required, retention_days]
    output: PartCatalogItem
    side_effects: []

  - method: GET
    path: "/warranty/parts/{id}"
    description: "Read one catalog part."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, DealerWarrantyAdmin]
    code: 200
    input: []
    output: PartCatalogItem
    side_effects: []

  # ---------------------------------------------------------------- labor rate & markup approval
  - method: POST
    path: "/warranty/labor-rate-requests"
    description: "Dealer petitions for a new warranty labor rate and parts markup. Snapshots the governing state law profile, computes the statutory ceiling, and rejects a rate above it."
    roles: [DealerWarrantyAdmin]
    code: 201
    input: [dealer_id, requested_labor_rate_cents, requested_parts_markup_pct, "sample_repair_order_count?", "sample_median_rate_cents?", effective_date, expected_dealer_version]
    output: LaborRateRequest
    side_effects:
      - "sets state_law_profile_id from Dealer.state_law_profile_id (snapshot)"
      - "sets submitted_by_user_id from X-User-ID"
      - "runs labor_rate_statutory_ceiling, writing statutory_ceiling_cents"
      - "any prior SUBMITTED or UNDER_REVIEW request of this dealer transitions to WITHDRAWN"
      - "increments Dealer.version by 1"
      - "opens the request in status SUBMITTED with deemed_approved=false"

  - method: GET
    path: "/warranty/labor-rate-requests/{id}"
    description: "Read one labor rate request, including its snapshotted statutory_ceiling_cents."
    roles: [WarrantyAdmin, AdjudicationManager, AuditManager, DealerWarrantyAdmin]
    code: 200
    input: []
    output: LaborRateRequest
    side_effects: []

  - method: GET
    path: "/warranty/labor-rate-requests"
    description: "List labor rate requests, filterable by dealer, governing state law profile and status."
    roles: [WarrantyAdmin, AdjudicationManager, AuditManager]
    code: 200
    input: ["dealer_id?", "state_law_profile_id?", "status?", "deemed_approved?", "limit?", "offset?"]
    output: LaborRateRequest[]
    side_effects: []

  - method: POST
    path: "/warranty/labor-rate-requests/{id}/review"
    description: "Move a rate request into review, or bounce it back to the dealer for more sample data."
    roles: [WarrantyAdmin]
    code: 200
    input: [action, "note?"]
    output: LaborRateRequest
    side_effects:
      - "action=START_REVIEW: SUBMITTED -> UNDER_REVIEW"
      - "action=RETURN_FOR_INFO: UNDER_REVIEW -> SUBMITTED, resetting the deemed-approval clock is explicitly NOT done (the original created_at still governs)"

  - method: POST
    path: "/warranty/labor-rate-requests/{id}/decision"
    description: "Approve or deny a rate request. Approval republishes the dealer's approved labor rate and parts markup and stamps the effective date."
    roles: [AdjudicationManager]
    code: 200
    input: [action, "approved_labor_rate_cents?", "approved_parts_markup_pct?", "denial_reason?"]
    output: LaborRateRequest
    side_effects:
      - "action=APPROVE: SUBMITTED or UNDER_REVIEW -> APPROVED; writes Dealer.approved_labor_rate_cents, approved_parts_markup_pct and labor_rate_effective_date; increments Dealer.version by 1"
      - "action=DENY: SUBMITTED or UNDER_REVIEW -> DENIED with denial_reason"
      - "segregation of duties: the acting X-User-ID must differ from submitted_by_user_id"

  - method: POST
    path: "/warranty/labor-rate-requests/deemed-approval-run"
    description: "Sweep every still-SUBMITTED rate request whose created_at is at or beyond StateLawProfile.deemed_approved_days before the logical clock, and deem it approved at the requested rate."
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: "{ promoted_count: integer, promoted_request_ids: string[] }"
    side_effects:
      - "each swept request: SUBMITTED -> APPROVED with deemed_approved=true, approved_labor_rate_cents = requested_labor_rate_cents, approved_parts_markup_pct = requested_parts_markup_pct"
      - "writes each affected Dealer's approved_labor_rate_cents, approved_parts_markup_pct and labor_rate_effective_date; increments that Dealer.version by 1"

  # ---------------------------------------------------------------- claims
  - method: POST
    path: "/warranty/claims"
    description: "Dealer submits a warranty claim. Determines coverage against the vehicle's terms, prices the claim provisionally, and runs the automated edit engine, which may open the claim SUSPENDED."
    roles: [DealerWarrantyAdmin]
    code: 201
    input: [dealer_id, vehicle_id, labor_operation_id, "causal_part_id?", repair_order_number, repair_date, odometer_at_repair, claimed_labor_hours, claimed_parts_qty, complaint_text, cause_text, correction_text]
    output: WarrantyClaim
    side_effects:
      - "runs claim_coverage_determination, writing coverage_type"
      - "runs claim_reimbursement_amount variant provisional_at_submission, writing provisional_labor_amount_cents, provisional_parts_amount_cents and provisional_total_cents"
      - "runs claim_edit_engine, appending ClaimEdit rows and writing suspend_edit_count"
      - "opens the claim in SUSPENDED when suspend_edit_count > 0, otherwise SUBMITTED; payment_status opens UNPAID"
      - "when PartCatalogItem.return_required is true, creates a PartsReturnRequest in REQUESTED with due_date = created_at + retention_days and increments Dealer.open_parts_return_count by 1, re-establishing the dealer_open_parts_return_count invariant"
      - "sets version=1"

  - method: GET
    path: "/warranty/claims/{id}"
    description: "Read one claim: coverage, both pricing variants, both status dimensions, debit and reinstatement totals, and version."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, AppealReviewer, DealerWarrantyAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: GET
    path: "/warranty/claims"
    description: "List claims with the full FK and status filter set; the reverse-reachability channel for every WarrantyClaim foreign key including the self-referential resubmission link."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, AppealReviewer]
    code: 200
    input: ["dealer_id?", "vehicle_id?", "labor_operation_id?", "causal_part_id?", "resubmission_of_claim_id?", "status?", "payment_status?", "coverage_type?", "repair_date_from?", "repair_date_to?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  - method: GET
    path: "/warranty/claims/{id}/edits"
    description: "List the automated edits raised against this claim in append order; the reverse-reachability channel for ClaimEdit.claim_id and ClaimEdit.conflicting_claim_id, neither of which any create response returns."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, DealerWarrantyAdmin]
    code: 200
    input: ["edit_code?", "severity?", "limit?", "offset?"]
    output: ClaimEdit[]
    side_effects: []

  - method: POST
    path: "/warranty/claims/{id}/resubmit"
    description: "Dealer corrects a SUSPENDED claim in place: re-runs coverage, provisional pricing and the edit engine against the corrected narrative, hours and quantity."
    roles: [DealerWarrantyAdmin]
    code: 200
    input: [claimed_labor_hours, claimed_parts_qty, complaint_text, cause_text, correction_text]
    output: WarrantyClaim
    side_effects:
      - "SUSPENDED -> SUBMITTED when the re-run edit engine raises no SUSPEND edit; the claim stays SUSPENDED otherwise"
      - "marks every prior unresolved ClaimEdit resolved_at and appends the fresh edit set"
      - "re-runs claim_coverage_determination and claim_reimbursement_amount variant provisional_at_submission"
      - "increments version by 1"

  - method: POST
    path: "/warranty/claims/{id}/adjudicate"
    description: "Adjudicator approves or denies a claim. Approval applies the final pricing variant with the statutory markup cap, the flat-rate time cap, and any approved goodwill cap."
    roles: [ClaimAdjudicator, AdjudicationManager]
    code: 200
    input: [decision, "approved_labor_hours?", "approved_parts_qty?", "denial_reason?"]
    output: WarrantyClaim
    side_effects:
      - "decision=APPROVE: SUBMITTED -> APPROVED; runs claim_reimbursement_amount variant final_at_adjudication, writing approved_labor_amount_cents, approved_parts_amount_cents, approved_total_cents, dealer_participation_cents and oem_payable_cents"
      - "decision=DENY: SUBMITTED -> DENIED with denial_reason; any REQUESTED PartsReturnRequest of this claim transitions to WAIVED and decrements Dealer.open_parts_return_count by 1"
      - "a SUSPENDED claim is adjudicable and its EXCESSIVE_TIME, HIGH_VALUE and NO_COVERAGE edits are stamped resolved, but one holding an open DEALER_POSTURE_HOLD edit is rejected with ERR_CLAIM_STILL_SUSPENDED"
      - "a coverage_type still NONE is rejected with ERR_NO_COVERAGE_WITHOUT_GOODWILL"
      - "increments version by 1"

  - method: POST
    path: "/warranty/claims/{id}/void"
    description: "Void a claim that should never have entered the program. Waives any open parts-return obligation."
    roles: [WarrantyAdmin, ClaimAdjudicator]
    code: 200
    input: [void_reason]
    output: WarrantyClaim
    side_effects:
      - "SUBMITTED or SUSPENDED or APPROVED (payment_status UNPAID only) -> VOID"
      - "any REQUESTED PartsReturnRequest of this claim transitions to WAIVED and decrements Dealer.open_parts_return_count by 1, restoring the dealer_open_parts_return_count invariant to its pre-submission value"
      - "increments version by 1"

  - method: POST
    path: "/warranty/claims/{id}/pay"
    description: "Pay an approved claim. Blocked while the dealer is suspended, under audit hold, or has an overdue parts return on this claim."
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "payment_status UNPAID -> PAID with status unchanged at APPROVED (the two dimensions move independently)"
      - "increments version by 1"

  # ---------------------------------------------------------------- goodwill / policy adjustment
  - method: POST
    path: "/warranty/claims/{id}/goodwill-authorizations"
    description: "Request goodwill authority for an out-of-warranty claim. Computes the out-of-warranty margin and the decaying adjudicator and manager authority limits, and opens PENDING or ESCALATED accordingly."
    roles: [ClaimAdjudicator]
    code: 201
    input: [requested_amount_cents, policy_adjustment_pct, justification, expected_claim_version]
    output: GoodwillAuthorization
    side_effects:
      - "sets requested_by_user_id from X-User-ID"
      - "runs goodwill_authorization_limit, writing out_of_warranty_margin_pct, adjudicator_limit_cents and manager_limit_cents"
      - "opens PENDING when requested_amount_cents <= adjudicator_limit_cents, else ESCALATED"
      - "any prior PENDING or ESCALATED authorization on this claim transitions to WITHDRAWN"
      - "increments WarrantyClaim.version by 1"

  - method: GET
    path: "/warranty/goodwill-authorizations/{id}"
    description: "Read one goodwill authorization with both authority limits and the computed out-of-warranty margin."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager]
    code: 200
    input: []
    output: GoodwillAuthorization
    side_effects: []

  - method: GET
    path: "/warranty/goodwill-authorizations"
    description: "List goodwill authorizations; the reverse-reachability channel for GoodwillAuthorization.claim_id."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager]
    code: 200
    input: ["claim_id?", "status?", "limit?", "offset?"]
    output: GoodwillAuthorization[]
    side_effects: []

  - method: POST
    path: "/warranty/goodwill-authorizations/{id}/decision"
    description: "Decide a goodwill authorization within the deciding role's authority limit. Approval flips the claim's coverage_type from NONE to GOODWILL."
    roles: [ClaimAdjudicator, AdjudicationManager]
    code: 200
    input: [action, "approved_amount_cents?", "denial_reason?"]
    output: GoodwillAuthorization
    side_effects:
      - "action=APPROVE: PENDING or ESCALATED -> APPROVED with approved_amount_cents and decided_by_user_id; sets WarrantyClaim.coverage_type = GOODWILL and increments WarrantyClaim.version by 1"
      - "action=DENY: PENDING or ESCALATED -> DENIED with denial_reason and decided_by_user_id"
      - "an ESCALATED authorization can only be approved by AdjudicationManager; ClaimAdjudicator gets ERR_UNAUTHORIZED_FOR_ESCALATED_GOODWILL"
      - "segregation of duties: the acting X-User-ID must differ from requested_by_user_id"

  # ---------------------------------------------------------------- parts return program
  - method: GET
    path: "/warranty/parts-returns/{id}"
    description: "Read one parts-return request with its due date, analysis outcome, debit and reversal amounts."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, DealerWarrantyAdmin]
    code: 200
    input: []
    output: PartsReturnRequest
    side_effects: []

  - method: GET
    path: "/warranty/parts-returns"
    description: "List parts-return requests; the reverse-reachability channel for PartsReturnRequest.claim_id and part_id, neither of which any create response returns because the row is cascade-created by claim submission."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, DealerWarrantyAdmin]
    code: 200
    input: ["claim_id?", "part_id?", "status?", "limit?", "offset?"]
    output: PartsReturnRequest[]
    side_effects: []

  - method: POST
    path: "/warranty/parts-returns/{id}/receive"
    description: "Record physical receipt of a returned part. A part received after a non-return debit was raised reverses that debit in full."
    roles: [WarrantyAdmin]
    code: 200
    input: [received_date]
    output: PartsReturnRequest
    side_effects:
      - "REQUESTED -> RECEIVED, decrementing Dealer.open_parts_return_count by 1"
      - "NOT_RETURNED -> RECEIVED: sets reversed_amount_cents = debit_amount_cents, appends a ChargebackLedgerEntry with source_type=LATE_RETURN_REVERSAL and amount_cents = -debit_amount_cents, sets WarrantyClaim.reinstated_amount_cents and payment_status=CREDIT_REINSTATED, recomputes dealer_chargeback_balance and Dealer.status, and increments Dealer.version by 1"

  - method: POST
    path: "/warranty/parts-returns/{id}/analysis"
    description: "Record the failed-component analysis outcome. NO_DEFECT_FOUND debits the claim's parts amount; NOT_AVAILABLE debits half of it; DEFECT_CONFIRMED debits nothing."
    roles: [WarrantyAdmin]
    code: 200
    input: [analysis_result, analysis_note]
    output: PartsReturnRequest
    side_effects:
      - "RECEIVED -> ANALYZED"
      - "runs parts_non_return_debit, writing debit_amount_cents"
      - "when debit_amount_cents > 0: appends a ChargebackLedgerEntry with source_type=PARTS_NO_DEFECT, sets WarrantyClaim.debited_amount_cents and payment_status=DEBITED, recomputes dealer_chargeback_balance and Dealer.status, and increments Dealer.version by 1"

  - method: POST
    path: "/warranty/parts-returns/non-return-sweep"
    description: "Sweep every REQUESTED parts-return request whose due_date is at or before the logical clock and debit the full approved claim amount back to the dealer. Depth-5 cascade: return -> claim -> ledger -> dealer posture -> sibling claims."
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: "{ swept_count: integer, debited_claim_ids: string[], total_debit_cents: integer }"
    side_effects:
      - "each swept request: REQUESTED -> NOT_RETURNED, decrementing Dealer.open_parts_return_count by 1"
      - "runs parts_non_return_debit with reason NOT_RETURNED, writing debit_amount_cents = claim.approved_total_cents"
      - "sets WarrantyClaim.debited_amount_cents and payment_status=DEBITED"
      - "appends a ChargebackLedgerEntry with source_type=PARTS_NON_RETURN and recomputes dealer_chargeback_balance"
      - "recomputes Dealer.status from the new balance; a dealer crossing SUSPENSION_THRESHOLD_CENTS goes SUSPENDED and every one of its SUBMITTED claims is suspended with a DEALER_POSTURE_HOLD ClaimEdit"
      - "increments Dealer.version by 1 per affected dealer"

  # ---------------------------------------------------------------- dealer audit
  - method: POST
    path: "/warranty/audits"
    description: "Schedule an on-site dealer audit over a half-open claim period. Rejects a period overlapping any live audit of the same dealer."
    roles: [AuditManager]
    code: 201
    input: [dealer_id, period_start, period_end, sample_size, lead_auditor_user_id, expected_dealer_version]
    output: DealerAudit
    side_effects:
      - "opens the audit in SCHEDULED with every chargeback figure at 0"
      - "increments Dealer.version by 1"

  - method: GET
    path: "/warranty/audits/{id}"
    description: "Read one audit with its pinned snapshots, error rate, extrapolation factor, chargeback figures, findings_issued_at, appeal_deadline and version."
    roles: [WarrantyAdmin, ClaimAdjudicator, AdjudicationManager, FieldAuditor, AuditManager, AppealReviewer, DealerWarrantyAdmin]
    code: 200
    input: []
    output: DealerAudit
    side_effects: []

  - method: GET
    path: "/warranty/audits"
    description: "List audits; the reverse-reachability channel for DealerAudit.dealer_id."
    roles: [WarrantyAdmin, FieldAuditor, AuditManager, AppealReviewer]
    code: 200
    input: ["dealer_id?", "status?", "limit?", "offset?"]
    output: DealerAudit[]
    side_effects: []

  - method: POST
    path: "/warranty/audits/{id}/start"
    description: "Field auditor goes on site. Places the dealer under audit hold, freezing payment of its claims."
    roles: [FieldAuditor]
    code: 200
    input: []
    output: DealerAudit
    side_effects:
      - "SCHEDULED -> IN_FIELD"
      - "sets Dealer.audit_hold = true and increments Dealer.version by 1"

  - method: POST
    path: "/warranty/audits/{id}/findings"
    description: "Attach an unsupported-claim finding to an in-field audit. The cited claim must be an APPROVED claim of the audited dealer with a repair_date inside the audit period."
    roles: [FieldAuditor]
    code: 201
    input: [claim_id, finding_code, unsupported_amount_cents, evidence_note]
    output: AuditFinding
    side_effects:
      - "opens the finding in OPEN with appeal_id null"
      - "requires the audit in IN_FIELD"

  - method: POST
    path: "/warranty/audits/{id}/issue-findings"
    description: "Issue the audit's findings: pins both paid denominators, computes the error rate, selects the extrapolation tier, charges back both the sampled and the extrapolated amounts, and opens the appeal window."
    roles: [AuditManager]
    code: 200
    input: []
    output: DealerAudit
    side_effects:
      - "IN_FIELD -> FINDINGS_ISSUED; sets findings_issued_at = current_utc and appeal_deadline = findings_issued_at + StateLawProfile.appeal_window_days days"
      - "runs audit_extrapolated_chargeback in its pinned six-step order, writing sample_paid_snapshot_cents, population_paid_snapshot_cents, error_rate, extrapolation_factor, sample_chargeback_cents, extrapolated_chargeback_cents and total_chargeback_cents"
      - "every OPEN finding -> CHARGED_BACK; each cited claim's payment_status -> DEBITED with debited_amount_cents = the finding's unsupported_amount_cents"
      - "appends one ChargebackLedgerEntry per charged-back finding with source_type=AUDIT_CHARGEBACK_SAMPLE, then, when extrapolated_chargeback_cents > 0, one row with source_type=AUDIT_CHARGEBACK_EXTRAPOLATION and claim_id null"
      - "recomputes dealer_chargeback_balance and Dealer.status; increments Dealer.version by 1"
      - "an audit with zero findings issues cleanly with every chargeback figure 0 and no ledger row appended"

  - method: POST
    path: "/warranty/audits/{id}/close"
    description: "Close an audit once no appeal is pending. Releases the dealer's audit hold when no other live audit holds it."
    roles: [AuditManager]
    code: 200
    input: []
    output: DealerAudit
    side_effects:
      - "FINDINGS_ISSUED or APPEALED -> CLOSED; an audit with an appeal still in FILED is rejected with ERR_APPEAL_PENDING"
      - "clears Dealer.audit_hold when no other DealerAudit of that dealer is IN_FIELD or FINDINGS_ISSUED or APPEALED; increments Dealer.version by 1"

  - method: GET
    path: "/warranty/audit-findings/{id}"
    description: "Read one audit finding."
    roles: [WarrantyAdmin, FieldAuditor, AuditManager, AppealReviewer, DealerWarrantyAdmin]
    code: 200
    input: []
    output: AuditFinding
    side_effects: []

  - method: GET
    path: "/warranty/audit-findings"
    description: "List audit findings; the reverse-reachability channel for AuditFinding.audit_id, claim_id and appeal_id, none of which any create response returns for cascade-set values."
    roles: [WarrantyAdmin, FieldAuditor, AuditManager, AppealReviewer, DealerWarrantyAdmin]
    code: 200
    input: ["audit_id?", "claim_id?", "appeal_id?", "status?", "limit?", "offset?"]
    output: AuditFinding[]
    side_effects: []

  - method: POST
    path: "/warranty/audits/{id}/appeals"
    description: "Dealer appeals charged-back findings within the statutory appeal window. Moves the audit to APPEALED and stamps the contested findings."
    roles: [DealerWarrantyAdmin]
    code: 201
    input: [grounds, contested_finding_ids, expected_audit_version]
    output: AuditAppeal
    side_effects:
      - "sets filed_by_dealer_id from X-User-ID and opens the appeal in FILED"
      - "sets AuditFinding.appeal_id on every contested finding"
      - "DealerAudit FINDINGS_ISSUED -> APPEALED; increments DealerAudit.version by 1"

  - method: GET
    path: "/warranty/appeals/{id}"
    description: "Read one appeal with its contested and reinstated finding ids and reinstated amount."
    roles: [WarrantyAdmin, FieldAuditor, AuditManager, AppealReviewer, DealerWarrantyAdmin]
    code: 200
    input: []
    output: AuditAppeal
    side_effects: []

  - method: GET
    path: "/warranty/appeals"
    description: "List appeals; the reverse-reachability channel for AuditAppeal.audit_id and filed_by_dealer_id."
    roles: [WarrantyAdmin, FieldAuditor, AuditManager, AppealReviewer]
    code: 200
    input: ["audit_id?", "filed_by_dealer_id?", "status?", "limit?", "offset?"]
    output: AuditAppeal[]
    side_effects: []

  - method: POST
    path: "/warranty/appeals/{id}/decision"
    description: "Independent reviewer grants, partially grants or denies an appeal. Overturned findings are removed from the chargeback base and the extrapolation is recomputed against the pinned snapshots, appending only the deltas to the ledger."
    roles: [AppealReviewer]
    code: 200
    input: [action, "overturned_finding_ids?", "decision_note?"]
    output: AuditAppeal
    side_effects:
      - "action=GRANT: FILED -> GRANTED, every contested finding -> OVERTURNED"
      - "action=PARTIAL: FILED -> PARTIALLY_GRANTED, the findings in overturned_finding_ids -> OVERTURNED and the rest -> UPHELD"
      - "action=DENY: FILED -> DENIED, every contested finding -> UPHELD"
      - "re-runs audit_extrapolated_chargeback steps 3-6 against the audit's pinned snapshots and rewrites error_rate, extrapolation_factor, sample_chargeback_cents, extrapolated_chargeback_cents and total_chargeback_cents"
      - "each OVERTURNED finding's claim: debited_amount_cents reduced by the finding amount and payment_status -> CREDIT_REINSTATED"
      - "appends a ChargebackLedgerEntry with source_type=APPEAL_REVERSAL_SAMPLE for the sample delta and one with source_type=APPEAL_REVERSAL_EXTRAPOLATION for the extrapolation delta, each omitted when its delta is 0"
      - "sets reviewer_user_id from X-User-ID, overturned_finding_ids and reinstated_amount_cents"
      - "DealerAudit APPEALED -> FINDINGS_ISSUED with a refreshed appeal_deadline"
      - "recomputes dealer_chargeback_balance and Dealer.status; a dealer dropping back below PROBATION_THRESHOLD_CENTS returns to ACTIVE and its posture-suspended claims return to SUBMITTED"
      - "increments Dealer.version and DealerAudit.version by 1"
      - "segregation of duties: the acting X-User-ID must differ from DealerAudit.lead_auditor_user_id"

  # ---------------------------------------------------------------- test-driving
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, retention window, appeal window and analytics window is evaluated against. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [WarrantyAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: timestamp }"
    side_effects:
      - "sets the logical clock; no entity is mutated and no sweep fires implicitly"

errors:
  # ---- auth ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_DEALER_SCOPE_VIOLATION
    http: 403
    condition: "a DealerWarrantyAdmin acts on a dealer, claim, audit, appeal or parts return that does not belong to the dealer named by X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID already performed the conflicting step: requested the goodwill it now decides, submitted the rate request it now decides, led the audit whose appeal it now decides, or decided the goodwill on the claim it now adjudicates"
  - id: ERR_UNAUTHORIZED_FOR_ESCALATED_GOODWILL
    http: 403
    condition: "a ClaimAdjudicator tries to decide a GoodwillAuthorization in status ESCALATED, which only AdjudicationManager may decide"

  # ---- existence ----
  - id: ERR_STATE_LAW_PROFILE_NOT_FOUND
    http: 404
    condition: "state_law_profile_id in the path or body names no StateLawProfile"
  - id: ERR_DEALER_NOT_FOUND
    http: 404
    condition: "dealer_id in the path or body names no Dealer"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "vehicle_id in the path or body names no Vehicle"
  - id: ERR_LABOR_OPERATION_NOT_FOUND
    http: 404
    condition: "labor_operation_id in the path or body names no LaborOperation"
  - id: ERR_CATALOG_ITEM_NOT_FOUND
    http: 404
    condition: "causal_part_id or part_id names no PartCatalogItem"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "the claim id in the path or body (including resubmission_of_claim_id and a finding's claim_id) names no WarrantyClaim"
  - id: ERR_LABOR_RATE_REQUEST_NOT_FOUND
    http: 404
    condition: "the labor rate request id in the path names no LaborRateRequest"
  - id: ERR_PARTS_RETURN_NOT_FOUND
    http: 404
    condition: "the parts return id in the path names no PartsReturnRequest"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "the audit id in the path names no DealerAudit"
  - id: ERR_FINDING_NOT_FOUND
    http: 404
    condition: "a finding id in the path or in contested_finding_ids / overturned_finding_ids names no AuditFinding"
  - id: ERR_APPEAL_NOT_FOUND
    http: 404
    condition: "the appeal id in the path names no AuditAppeal"
  - id: ERR_GOODWILL_AUTH_NOT_FOUND
    http: 404
    condition: "the goodwill authorization id in the path names no GoodwillAuthorization"

  # ---- shape ----
  - id: ERR_VALIDATION
    http: 422
    condition: "required field missing, enum outside its domain, non-positive rate or hours, negative amount, malformed date, or period_start not strictly before period_end"

  # ---- concurrency ----
  - id: ERR_STALE_DEALER_VERSION
    http: 412
    condition: "expected_dealer_version does not equal the Dealer's current version on POST /warranty/labor-rate-requests or POST /warranty/audits"
  - id: ERR_STALE_CLAIM_VERSION
    http: 412
    condition: "expected_claim_version does not equal the WarrantyClaim's current version on POST /warranty/claims/{id}/goodwill-authorizations"
  - id: ERR_STALE_AUDIT_VERSION
    http: 412
    condition: "expected_audit_version does not equal the DealerAudit's current version on POST /warranty/audits/{id}/appeals"

  # ---- state ----
  - id: ERR_CLAIM_NOT_ADJUDICABLE
    http: 409
    condition: "adjudicate called on a claim whose status is not SUBMITTED and not SUSPENDED"
  - id: ERR_CLAIM_STILL_SUSPENDED
    http: 409
    condition: "adjudicate APPROVE called on a SUSPENDED claim holding an open DEALER_POSTURE_HOLD edit; a dealer-posture suspension cannot be adjudicated away, only lifted by the dealer returning to ACTIVE"
  - id: ERR_CLAIM_NOT_RESUBMITTABLE
    http: 409
    condition: "resubmit called on a claim whose status is not SUSPENDED"
  - id: ERR_CLAIM_NOT_PAYABLE
    http: 409
    condition: "pay called on a claim whose status is not APPROVED or whose payment_status is not UNPAID"
  - id: ERR_CLAIM_NOT_VOIDABLE
    http: 409
    condition: "void called on a claim already DENIED or VOID, or on an APPROVED claim whose payment_status has left UNPAID"
  - id: ERR_LABOR_RATE_REQUEST_INVALID_STATE
    http: 409
    condition: "review or decision called on a LaborRateRequest that is not in a from-state the requested transition declares"
  - id: ERR_PARTS_RETURN_INVALID_STATE
    http: 409
    condition: "receive called on a PartsReturnRequest that is not REQUESTED or NOT_RETURNED, or analysis called on one that is not RECEIVED"
  - id: ERR_AUDIT_INVALID_STATE
    http: 409
    condition: "start, findings, issue-findings or close called on a DealerAudit that is not in a from-state the requested transition declares"
  - id: ERR_APPEAL_INVALID_STATE
    http: 409
    condition: "decision called on an AuditAppeal that is not FILED"
  - id: ERR_GOODWILL_INVALID_STATE
    http: 409
    condition: "decision called on a GoodwillAuthorization that is not PENDING or ESCALATED"

  # ---- business: posture and cross-entity holds ----
  - id: ERR_DEALER_SUSPENDED
    http: 409
    condition: "claim submission, resubmission, payment or a labor rate request attempted while the Dealer is SUSPENDED"
  - id: ERR_DEALER_UNDER_AUDIT_HOLD
    http: 409
    condition: "payment attempted while the claim's Dealer has audit_hold true"
  - id: ERR_APPEAL_PENDING
    http: 409
    condition: "close attempted while an AuditAppeal of that audit is still FILED"
  - id: ERR_PARTS_RETURN_OVERDUE
    http: 409
    condition: "payment attempted while the claim's PartsReturnRequest is still REQUESTED and the logical clock is at or past its due_date"

  # ---- business: constraint and temporal ----
  - id: ERR_DUPLICATE_REPAIR_ORDER
    http: 409
    condition: "another live claim of the same dealer already carries this repair_order_number"
  - id: ERR_OVERLAPPING_REPAIR_CLAIM
    http: 409
    condition: "another live claim on the same vehicle in the same overlap_group has a repair_date within the closed 30-day buffer"
  - id: ERR_AUDIT_PERIOD_OVERLAP
    http: 409
    condition: "the requested half-open audit period intersects the period of another live audit of the same dealer"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 409
    condition: "the appeal is filed after findings_issued_at plus the state's appeal_window_days"
  - id: ERR_FINDING_NOT_IN_AUDIT
    http: 409
    condition: "a contested finding id does not belong to the audit in the path or is not in status CHARGED_BACK"
  - id: ERR_CLAIM_NOT_ELIGIBLE_FOR_FINDING
    http: 409
    condition: "the cited claim is not an APPROVED, unpaid-or-paid claim of the audited dealer with a repair_date inside the half-open audit period, or is already cited by another finding of this audit"
  - id: ERR_NARRATIVE_INCOMPLETE
    http: 422
    condition: "complaint_text, cause_text or correction_text is missing or shorter than 10 characters after trimming"
  - id: ERR_CAUSAL_PART_REQUIRED
    http: 422
    condition: "the labor operation requires a causal part and none was supplied, the supplied part's failure_group does not match the operation's causal_failure_group, or a causal part was supplied for an operation that requires none"
  - id: ERR_INSUFFICIENT_RATE_SAMPLE
    http: 422
    condition: "a RETAIL_SAMPLE state's rate request cites fewer repair orders than min_sample_repair_orders or omits sample_median_rate_cents"

  # ---- business: fiscal ----
  - id: ERR_LABOR_TIME_EXCEEDS_MAX
    http: 422
    condition: "claimed_labor_hours or approved_labor_hours exceeds the labor operation's max_time_hours"
  - id: ERR_LABOR_RATE_ABOVE_STATUTORY_CEILING
    http: 422
    condition: "requested_labor_rate_cents exceeds the computed statutory_ceiling_cents"
  - id: ERR_MARKUP_ABOVE_STATE_CAP
    http: 422
    condition: "requested_parts_markup_pct exceeds the state's markup_cap_pct"
  - id: ERR_GOODWILL_LIMIT_EXCEEDED
    http: 422
    condition: "requested_amount_cents exceeds manager_limit_cents at request time, or approved_amount_cents exceeds the deciding role's authority limit at decision time"
  - id: ERR_NO_COVERAGE_WITHOUT_GOODWILL
    http: 409
    condition: "adjudicate APPROVE on a claim whose coverage_type is still NONE, with no APPROVED GoodwillAuthorization to flip it to GOODWILL"

roles:
  - name: WarrantyAdmin
    description: "Manufacturer warranty program administrator: publishes reference data, drives the parts return program, runs the deemed-approval and non-return sweeps, and pays approved claims."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/state-law-profiles"
      - "POST /warranty/dealers"
      - "POST /warranty/vehicles"
      - "POST /warranty/labor-operations"
      - "POST /warranty/parts"
      - "POST /warranty/labor-rate-requests/{id}/review"
      - "POST /warranty/labor-rate-requests/deemed-approval-run"
      - "POST /warranty/claims/{id}/pay"
      - "POST /warranty/parts-returns/{id}/receive"
      - "POST /warranty/parts-returns/{id}/analysis"
      - "POST /warranty/parts-returns/non-return-sweep"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /warranty/claims/{id}/void"
      - "every GET in the surface except GET /warranty/goodwill-authorizations/{id} filters"

  - name: ClaimAdjudicator
    description: "Adjudicates submitted claims against coverage, flat-rate time and statutory markup, and requests goodwill authority for out-of-warranty repairs."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/claims/{id}/goodwill-authorizations"
    shared_operations:
      - "POST /warranty/claims/{id}/adjudicate"
      - "POST /warranty/claims/{id}/void"
      - "POST /warranty/goodwill-authorizations/{id}/decision (PENDING only; ESCALATED is refused with ERR_UNAUTHORIZED_FOR_ESCALATED_GOODWILL)"
      - "read access to dealers, claims, edits, goodwill authorizations and parts returns"

  - name: AdjudicationManager
    description: "Approves dealer labor rate and parts markup petitions, and holds the higher goodwill authority limit for escalated authorizations."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/labor-rate-requests/{id}/decision"
    shared_operations:
      - "POST /warranty/claims/{id}/adjudicate"
      - "POST /warranty/goodwill-authorizations/{id}/decision (PENDING and ESCALATED)"
      - "read access to dealers, claims, expense analytics, rate requests and goodwill authorizations"

  - name: FieldAuditor
    description: "Performs the on-site dealer audit: goes in field and attaches unsupported-claim findings. Cannot issue or close the audit, and cannot decide the appeal against its own audit."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/audits/{id}/start"
      - "POST /warranty/audits/{id}/findings"
    shared_operations:
      - "read access to dealers, ledger entries, expense analytics, claims, audits, findings and appeals"

  - name: AuditManager
    description: "Schedules audits, issues findings with the extrapolated chargeback, and closes audits once no appeal is pending."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/audits"
      - "POST /warranty/audits/{id}/issue-findings"
      - "POST /warranty/audits/{id}/close"
    shared_operations:
      - "read access to dealers, ledger entries, expense analytics, claims, rate requests, audits, findings and appeals"

  - name: AppealReviewer
    description: "Independent reviewer of dealer appeals. Grants, partially grants or denies an appeal; may not decide an appeal against an audit it led."
    identity: opaque
    exclusive_operations:
      - "POST /warranty/appeals/{id}/decision"
    shared_operations:
      - "read access to state law profiles, claims, audits, findings and appeals"

  - name: DealerWarrantyAdmin
    description: "Dealership warranty administrator. X-User-ID is the Dealer.id it acts for; it may only submit, correct and appeal on its own dealership's behalf."
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /warranty/claims"
      - "POST /warranty/claims/{id}/resubmit"
      - "POST /warranty/labor-rate-requests"
      - "POST /warranty/audits/{id}/appeals"
    shared_operations:
      - "read access, scoped to its own dealership, to its Dealer row, ledger entries, expense analytics, claims, claim edits, parts returns, rate requests, audits, findings and appeals"
