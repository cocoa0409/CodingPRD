  - section: validations
    instances:
      - name: missing_auth_headers_returns_401_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Priority 1: a request with no X-User-Role/X-User-ID is rejected 401 before role, existence, or body checks — even on an otherwise valid payload."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - {call: "POST /legal-research/accounts", payload: {org_name: "NoAuth Co", account_type: CORPORATE, cost_recovery_enabled: false}, as: "", captures: {err: $.data.error_id}}
          assert:
            - "HTTP 401 and error_id == ERR_UNAUTHENTICATED (request sent without auth headers)"

      - name: researcher_cannot_create_document_returns_403
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Role gate: Researcher is not in POST /documents roles; the request is rejected 403 ERR_FORBIDDEN even though the payload is valid."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - {call: "POST /legal-research/documents", payload: {source_type: COURT, jurisdiction_code: "CA9", document_type: CASE, title: "Forbidden", raw_citation_string: "1 F.4th 99", decision_date: "2026-01-01"}, as: Researcher, as_user_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", captures: {err: $.data.error_id}}
          assert:
            - "HTTP 403 and error_id == ERR_FORBIDDEN"

      - name: government_plan_requires_government_account
        claim_type: conditional_validation
        grounds: ["validations[priority=37]", "errors[ERR_PLAN_ACCOUNT_INCOMPATIBLE]"]
        distinguishing_aspect: "government_only is a conditional plan flag: the same subscription create succeeds for a GOVERNMENT account and fails with 422 for a LAW_FIRM account."
        test_recipe:
          setup: ["government_only plan; one LAW_FIRM account and one GOVERNMENT account"]
          setup_api_calls:
            - {call: "POST /legal-research/_clock/set_current_utc", payload: {to_iso8601: "2026-09-05T00:00:00Z"}, as: PlatformAdmin}
            - call: "POST /legal-research/plans"
              payload: {name: "Gov Only", practice_area: ALL, jurisdiction_scope: FEDERAL, firm_size_tier: SOLO, billing_model: TRANSACTIONAL, scope_enforcement: SOFT, government_only: true, cost_recovery_allowed: false, per_search_fee_cents: 300, per_doc_view_fee_cents: 120}
              as: LicensingManager
              captures: {p_id: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "Private Firm", account_type: LAW_FIRM, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_firm: $.data.id}
            - call: "POST /legal-research/accounts"
              payload: {org_name: "State Agency", account_type: GOVERNMENT, cost_recovery_enabled: false}
              as: LicensingManager
              captures: {a_gov: $.data.id}
          trigger:
            - {call: "POST /legal-research/subscriptions", payload: {account_id: "${a_firm}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}, as: LicensingManager, captures: {err: $.data.error_id}}
            - {call: "POST /legal-research/subscriptions", payload: {account_id: "${a_gov}", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}, as: LicensingManager, captures: {s_gov: $.data.id}}
          assert:
            - "LAW_FIRM account rejected: error_id == ERR_PLAN_ACCOUNT_INCOMPATIBLE (422)"
            - "GOVERNMENT account accepted: subscription ${s_gov} created (201)"

      - name: matter_code_required_on_recovery_account
        claim_type: conditional_validation
        grounds: ["validations[priority=36]", "errors[ERR_MATTER_CODE_REQUIRED]"]
        distinguishing_aspect: "The matter_code requirement is conditional on the account's cost_recovery_enabled flag: omitted on a recovery account -> 422; supplied on a non-recovery account -> 422; matching the flag -> 201."
