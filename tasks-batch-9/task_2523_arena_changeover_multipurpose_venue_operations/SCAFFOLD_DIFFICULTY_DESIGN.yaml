            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", tenant_id: "${tb}", config_profile_id: "${p_ice}", title: "Riverton Athletics showcase", event_start_utc: "2026-09-20T00:00:00Z", event_end_utc: "2026-09-20T03:00:00Z", expected_attendance: 14000, rigging_load_kg: 2000 }
