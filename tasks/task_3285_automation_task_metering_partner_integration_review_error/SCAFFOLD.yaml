# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the four declared roles"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "the role is not permitted for the operation"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "the account id in the path does not resolve"
  - id: ERR_WORKFLOW_NOT_FOUND
    http: 404
    condition: "the workflow id in the path does not resolve"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "the member id referenced does not resolve"
  - id: ERR_CONNECTION_NOT_FOUND
    http: 404
    condition: "the connection id in the path does not resolve"
  - id: ERR_INTEGRATION_NOT_FOUND
    http: 404
    condition: "the integration id in the path does not resolve"
  - id: ERR_INTEGRATION_VERSION_NOT_FOUND
    http: 404
    condition: "the integration version id referenced by a migration does not resolve"
  - id: ERR_WORKFLOW_INVALID_STATE
    http: 409
    condition: "the workflow is not in a state that permits the requested lifecycle operation"
  - id: ERR_ACTION_NOT_REPLAYABLE
    http: 409
    condition: "the action is neither FAILED-without-held-sibling nor HELD-with-live-connection, so replay is refused"
  - id: ERR_CONNECTION_INVALID_STATE
    http: 409
    condition: "the connection is not in the state the requested operation requires"
  - id: ERR_INTEGRATION_NOT_IN_REVIEW
    http: 409
    condition: "a review decision is requested for an integration that is not SUBMITTED or IN_REVIEW"
  - id: ERR_INTEGRATION_ALREADY_REJECTED
    http: 409
    condition: "an integration is resubmitted in the same review cycle after a rejection"
  - id: ERR_WORKFLOW_VERSION_NOT_MIGRATABLE
    http: 409
    condition: "the workflow snapshot is not MIGRATION_REQUIRED, or an action is RUNNING during the migration attempt"
  - id: ERR_AUTH_METHOD_NOT_OAUTH2
    http: 422
    condition: "the integration's auth_method is API_KEY or BASIC, which reviewers refuse"
  - id: ERR_INTEGRATION_COVERAGE_INSUFFICIENT
    http: 422
    condition: "Integration.endpoint_coverage < 0.8 when submitting or reviewing"
  - id: ERR_MISSING_ERROR_SEMANTICS
    http: 422
    condition: "an integration endpoint lacks a response schema, so the integration fails the submit gate"
  - id: ERR_CONNECTION_TOKEN_EXPIRED
    http: 422
    condition: "a run charge is evaluated while the referenced Connection.status is TOKEN_EXPIRED"
  - id: ERR_TASK_ALLOWANCE_EXHAUSTED
    http: 402
    condition: "the charged task would push the account past task_allowance while overage_enabled is false"
  - id: ERR_DUPLICATE_FOLDER_NAME
    http: 409
    condition: "a folder name repeats an existing folder name within the same account"
  - id: ERR_DUPLICATE_ACTION_POSITION
    http: 409
    condition: "a workflow already has an action at the requested position"
  - id: ERR_VERSION_NOT_MONOTONIC
    http: 409
    condition: "a published integration version_number is not strictly greater than the existing maximum"
  - id: ERR_DUPLICATE_GRANT
    http: 409
    condition: "a member already holds a grant on the folder"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version does not equal TeamAccount.version"
  - id: ERR_STALE_WORKFLOW_VERSION
    http: 412
    condition: "expected_workflow_version does not equal Workflow.version"
  - id: ERR_FOLDER_NOT_PERMITTED
    http: 403
    condition: "the acting member neither owns the account nor holds a MANAGE grant on the folder"
  - id: ERR_CONNECTION_ACCOUNT_MISMATCH
    http: 422
    condition: "an action's connection belongs to a different account than the workflow"
  - id: ERR_WORKFLOW_MAX_STEPS_EXCEEDED
    http: 422
    condition: "a run dispatch would require more than 10 actions in a single run"
  - id: ERR_NO_RUNNABLE_ACTION
    http: 409
    condition: "a run dispatch finds no action eligible to execute for the requested charge"
  - id: ERR_DUPLICATE_EPOCH_STEP
    http: 409
    condition: "the metering epoch step named by the charge was already consumed on this account in this epoch"
  - id: ERR_TOKEN_REFRESH_CAP_EXHAUSTED
    http: 409
    condition: "a token refresh is attempted after the lifetime cap of 5 successful refreshes has been spent"
  - id: ERR_REPLAY_DEFERRED
    http: 409
    condition: "a replay is refused because its refund grant is not consumable while the connection is not CONNECTED"

