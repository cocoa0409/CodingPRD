            - "RepurchasePeriod.${per_oct_id}.opens_at == \"2026-10-05T00:00:00Z\""
            - "RepurchasePeriod.${per_oct_id}.quarter_key == \"2026-Q4\""
            - "RepurchasePeriod.${per_oct_id}.status == \"OPEN\""
            - "RepurchasePeriod.${per_oct_id}.prorated == false"
            - "RepurchasePeriod.${per_sep_id}.status == \"OPEN\""

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rescission_restores_share_and_proceeds_conservation
        grounds:
          - state_machines.Subscription.ACCEPTED_to_RESCINDED
          - state_machines.ShareLot.OPEN_to_RESCINDED
          - state_machines.Investor.account_status.ACTIVE_to_CLOSED_NO_POSITION
          - errors[ERR_RESCISSION_WINDOW_EXPIRED]
          - entities.Offering.fields.gross_proceeds_cents
        distinguishing_aspect: |
          Rescinding inside the 5-day window must unwind every derived total
          exactly — shares_outstanding_e4 back from 193000000 to 96500000,
          gross_proceeds_cents back to 10000000, aggregate_nav_cents back to
          9650000, the investor's cumulative_invested_cents back to 0 and the
          account closed — with no residue anywhere; two days later the same
          operation on the sibling subscription must be refused outright, so the
          compensation is available only inside the window.
        test_recipe:
          setup:
            - "Offering 'Cornerstone Income REIT' with minimum_offering_amount_cents 20000000, rescission_window_days 5 and class T at 300 + 50 bps."
            - "Two DOCUMENTED TX investors each subscribing 10000000 cents; escrow BROKEN at the default 2026-08-01 clock, so both lots carry issued_date 2026-08-01 and 96500000 e4 each."
            - "Clock advanced to 2026-08-04, three days into the five-day rescission window."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Cornerstone Income REIT", minimum_offering_amount_cents: 20000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 5 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "T", upfront_selling_commission_bps: 300, dealer_manager_fee_bps: 50, annual_distribution_fee_bps: 850, distribution_fee_cap_bps: 875, converts_to_class_code: "I" }
              as: SponsorOperator
              captures: { sc_t_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Meridian Securities LLC", crd_number: "CRD-100001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 500, suitability_documentation_required: true }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Avery Nolan", email: "avery.nolan@example.com", state_code: "TX", net_worth_cents: 500000000, annual_income_cents: 100000000 }
              as: SponsorOperator
              captures: { inv_a_id: $.data.id }
            - call: "POST /investors/${inv_a_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-A-2026-08" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Blake Ortiz", email: "blake.ortiz@example.com", state_code: "TX", net_worth_cents: 500000000, annual_income_cents: 100000000 }
              as: SponsorOperator
              captures: { inv_b_id: $.data.id }
            - call: "POST /investors/${inv_b_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-B-2026-08" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_t_id}", investor_id: "${inv_a_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 10000000 }
              as: SponsorOperator
              captures: { sub_a_id: $.data.id }
            - call: "POST /subscriptions/${sub_a_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_t_id}", investor_id: "${inv_b_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 10000000 }
              as: SponsorOperator
              captures: { sub_b_id: $.data.id }
            - call: "POST /subscriptions/${sub_b_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
            - call: "GET /share-lots"
              payload: { subscription_id: "${sub_b_id}" }
              as: TransferAgent
              captures: { lot_b_id: "$.data[0].id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: TransferAgent
          trigger:
            - call: "POST /subscriptions/${sub_b_id}/status"
              payload: { to_status: "RESCINDED", rejection_reason: "INVESTOR_RESCISSION" }
              as: TransferAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-08T00:00:00Z" }
              as: TransferAgent
            - call: "POST /subscriptions/${sub_a_id}/status"
              payload: { to_status: "RESCINDED", rejection_reason: "LATE_RESCISSION_ATTEMPT" }
              as: TransferAgent
              captures: { window_error: $.data.error_id }
          assert:
            - "window_error == \"ERR_RESCISSION_WINDOW_EXPIRED\""
            - "Subscription.${sub_b_id}.status == \"RESCINDED\""
            - "ShareLot.${lot_b_id}.status == \"RESCINDED\""
            - "ShareLot.${lot_b_id}.remaining_shares_e4 == 0"
            - "ShareLot.${lot_b_id}.original_shares_e4 == 96500000"
            - "Investor.${inv_b_id}.total_shares_e4 == 0"
            - "Investor.${inv_b_id}.cumulative_invested_cents == 0"
            - "Investor.${inv_b_id}.account_status == \"CLOSED_NO_POSITION\""
            - "Investor.${inv_b_id}.suitability_status == \"DOCUMENTED\""
            - "Subscription.${sub_a_id}.status == \"ACCEPTED\""
            - "Investor.${inv_a_id}.total_shares_e4 == 96500000"
            - "Investor.${inv_a_id}.cumulative_invested_cents == 10000000"
            - "Investor.${inv_a_id}.account_status == \"ACTIVE\""
            - "ShareClass.${sc_t_id}.shares_outstanding_e4 == 96500000"
            - "Offering.${off_id}.gross_proceeds_cents == 10000000"
            - "Offering.${off_id}.escrow_balance_cents == 0"
            - "Offering.${off_id}.aggregate_nav_cents == 9650000"

      - name: escrow_failure_refund_restores_zero_escrow_balance
        grounds:
          - state_machines.Offering.escrow_status.COLLECTING_to_FAILED
          - state_machines.Subscription.ESCROWED_to_REFUNDED
          - state_machines.Offering.repurchase_plan_status.ACTIVE_to_TERMINATED
          - errors[ERR_INVALID_STATE_TRANSITION]
          - entities.Offering.fields.escrow_balance_cents
        distinguishing_aspect: |
          A failed escrow must roll the whole fundraise back to its pre-money
          state — escrow_balance_cents to 0, gross_proceeds_cents still 0, every
          ESCROWED subscription REFUNDED with rejection_reason 'ESCROW_FAILED',
          no ShareLot ever minted, both investors at zero shares — and the
          repurchase plan is TERMINATED as a compensating side effect, so a later
          BREAK on the same offering is refused rather than silently reviving it.
        test_recipe:
          setup:
            - "Offering 'Halcyon Opportunity REIT' EFFECTIVE with minimum_offering_amount_cents 30000000 and escrow_deadline_date 2026-12-31."
            - "Two DOCUMENTED investors each with a 10000000-cent ESCROWED subscription, so escrow_balance_cents is 20000000 — below the minimum."
            - "Clock advanced to 2027-01-01, one day past the escrow deadline."
          setup_api_calls:
            - call: "POST /offerings"
              payload: { name: "Halcyon Opportunity REIT", minimum_offering_amount_cents: 30000000, maximum_offering_amount_cents: 50000000000, escrow_deadline_date: "2026-12-31", initial_offering_price_cents: 1000, rescission_window_days: 5 }
              as: SponsorOperator
              captures: { off_id: $.data.id }
            - call: "POST /share-classes"
              payload: { offering_id: "${off_id}", class_code: "I", upfront_selling_commission_bps: 0, dealer_manager_fee_bps: 0, annual_distribution_fee_bps: 0, distribution_fee_cap_bps: 0 }
              as: SponsorOperator
              captures: { sc_i_id: $.data.id }
            - call: "POST /broker-dealers"
              payload: { firm_name: "Halcyon Placement LLC", crd_number: "CRD-170001" }
              as: ComplianceOfficer
              captures: { bd_id: $.data.id }
            - call: "POST /selling-agreements"
              payload: { offering_id: "${off_id}", broker_dealer_id: "${bd_id}", max_commission_bps: 100, suitability_documentation_required: true }
              as: ComplianceOfficer
              captures: { sa_id: $.data.id }
            - call: "POST /offerings/${off_id}/registration"
              payload: { action: "DECLARE_EFFECTIVE" }
              as: ComplianceOfficer
            - call: "POST /selling-agreements/${sa_id}/status"
              payload: { to_status: "ACTIVE" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Hollis Vandermeer", email: "hollis.vandermeer@example.com", state_code: "TX", net_worth_cents: 500000000, annual_income_cents: 100000000 }
              as: SponsorOperator
              captures: { inv_h_id: $.data.id }
            - call: "POST /investors/${inv_h_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-H-2026-08" }
              as: ComplianceOfficer
            - call: "POST /investors"
              payload: { legal_name: "Odalys Menendez", email: "odalys.menendez@example.com", state_code: "TX", net_worth_cents: 500000000, annual_income_cents: 100000000 }
              as: SponsorOperator
              captures: { inv_o_id: $.data.id }
            - call: "POST /investors/${inv_o_id}/suitability-documentation"
              payload: { documentation_reference: "SUIT-O-2026-08" }
              as: ComplianceOfficer
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_i_id}", investor_id: "${inv_h_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 10000000 }
              as: SponsorOperator
              captures: { sub_h_id: $.data.id }
            - call: "POST /subscriptions/${sub_h_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /subscriptions"
              payload: { offering_id: "${off_id}", share_class_id: "${sc_i_id}", investor_id: "${inv_o_id}", selling_agreement_id: "${sa_id}", gross_investment_cents: 10000000 }
              as: SponsorOperator
              captures: { sub_o_id: $.data.id }
            - call: "POST /subscriptions/${sub_o_id}/status"
              payload: { to_status: "ESCROWED" }
              as: TransferAgent
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "FAIL" }
              as: ComplianceOfficer
            - call: "POST /offerings/${off_id}/escrow"
              payload: { action: "BREAK" }
              as: ComplianceOfficer
              captures: { revive_error: $.data.error_id }
          assert:
            - "revive_error == \"ERR_INVALID_STATE_TRANSITION\""
            - "Offering.${off_id}.escrow_status == \"FAILED\""
            - "Offering.${off_id}.escrow_balance_cents == 0"
            - "Offering.${off_id}.gross_proceeds_cents == 0"
            - "Offering.${off_id}.aggregate_nav_cents == 0"
            - "Offering.${off_id}.repurchase_plan_status == \"TERMINATED\""
            - "Offering.${off_id}.registration_status == \"EFFECTIVE\""
            - "Subscription.${sub_h_id}.status == \"REFUNDED\""
            - "Subscription.${sub_h_id}.rejection_reason == \"ESCROW_FAILED\""
            - "Subscription.${sub_o_id}.status == \"REFUNDED\""
            - "Subscription.${sub_o_id}.rejection_reason == \"ESCROW_FAILED\""
            - "ShareClass.${sc_i_id}.shares_outstanding_e4 == 0"
            - "Investor.${inv_h_id}.total_shares_e4 == 0"
            - "Investor.${inv_h_id}.cumulative_invested_cents == 0"
            - "Investor.${inv_o_id}.total_shares_e4 == 0"
