scenario: "Wire Transfer Operations & Sanctions Screening (bank wire room): payment initiation & callback verification by dollar threshold, dual approval & cutoff-time processing, sanctions/watchlist hit review & release decision, straight-through-processing exception repair, recall/return request handling & beneficiary bank coordination, fraud hold & customer confirmation, fee assessment & correspondent charge, investigation & tracer request"

domain_name: wire-transfer-operations-sanctions
api_prefix: /wire-ops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Segregation of duties is enforced by actor identity on dual approval and by
    role + hit-tier gating on sanctions disposition. The WireTransfer carries two
    independent state dimensions (status x screening_status). The BusinessDate
    posture machine gates payment submission and release dispatch. Two banks act
    on one RecallRequest with role-partitioned response actions.

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Customer legal name" }
      - { name: risk_rating, type: enum, source: input, description: "Relationship risk grade; constraints: LOW | MEDIUM | HIGH" }
      - { name: high_risk_jurisdiction, type: boolean, source: input, default: false, description: "Whether the customer is domiciled in a high-risk jurisdiction (drives geo risk component)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Customer lifecycle; constraints: ACTIVE | FROZEN | CLOSED" }
      - { name: frozen_at, type: datetime, source: system, description: "Timestamp when the customer entered FROZEN; null while ACTIVE; cleared on unfreeze" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning customer" }
      - { name: account_number, type: string, source: input, description: "External account number; unique across all accounts" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO currency; scaffold operates in USD only" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Account lifecycle; constraints: ACTIVE | DORMANT | CLOSED" }
      - { name: daily_outgoing_limit_cents, type: integer, source: input, description: "Business-day cap on executed outgoing wire principal; must be > 0" }
      - { name: daily_reserved_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this account's WireTransfers dated to the current business date with reservation_active = true" }
      - { name: daily_released_cents, type: integer, source: computed, default: 0, description: "Sum of amount_cents over this account's WireTransfers dated to the current business date with status = EXECUTED" }

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; originator customer who registered this beneficiary" }
      - { name: name, type: string, source: input, description: "Beneficiary name (screened text)" }
      - { name: bank_name, type: string, source: input, description: "Beneficiary bank name (screened text)" }
      - { name: account_number, type: string, source: input, description: "Beneficiary account number" }
      - { name: country_code, type: string, source: input, description: "ISO-3166 alpha-2 country of the beneficiary bank" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Beneficiary lifecycle; constraints: ACTIVE | RETIRED" }
      - { name: first_used_at, type: datetime, source: system, description: "Timestamp of this beneficiary's first EXECUTED wire on any account of the owning customer; null until then (drives new-beneficiary risk)" }

  - name: BusinessDate
    parent: null
    common_fields: true
    fields:
      - { name: business_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) this ops-day record represents; unique" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Ops-day posture; constraints: OPEN | CUTOFF_PASSED | CLOSED" }

  - name: WireTransfer
    parent: null
    common_fields: true
    fields:
      - { name: ordering_account_id, type: string, source: input, description: "FK -> Account.id; debit account" }
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id; payment beneficiary" }
      - { name: amount_cents, type: integer, source: input, description: "Wire principal in cents; must be > 0" }
      - { name: currency, type: string, source: input, default: "USD", description: "ISO currency" }
      - { name: method, type: enum, source: input, description: "Payment rail; constraints: Fedwire | SWIFT | CHIPS" }
      - { name: priority, type: enum, source: input, default: NORMAL, description: "Processing priority; constraints: NORMAL | SAME_DAY" }
      - { name: charge_mode, type: enum, source: input, default: OUR, description: "Who bears transfer charges; constraints: OUR | BENEFICIARY_REMUNERATION. BENEFICIARY_REMUNERATION activates the beneficiary-pays fee share on SWIFT wires" }
      - { name: purpose, type: string, source: input, description: "Free-text payment purpose" }
      - { name: requires_callback, type: boolean, source: computed, description: "True iff amount_cents >= CALLBACK_THRESHOLD_CENTS (>= $1,000,000.00, inclusive)" }
      - { name: callback_status, type: enum, source: system, default: NONE, description: "Verification posture; constraints: NONE | PENDING | VERIFIED | WAIVED" }
      - { name: initiated_by, type: string, source: system, description: "X-User-ID of the initiating WireOperator (segregation-of-duties reference)" }
      - { name: first_approved_by, type: string, source: system, description: "User id recorded at the first approval; null until first approval" }
      - { name: second_approved_by, type: string, source: system, description: "User id recorded at the second approval; null until second approval" }
      - { name: value_date, type: string, source: computed, description: "ISO business date assigned at submission from the business_date the operator named at submit" }
      - { name: status, type: enum, source: system, default: INITIATED, description: "Processing dimension; constraints: INITIATED | CALLBACK_PENDING | PENDING_APPROVAL | APPROVED | RELEASING | EXECUTED | REJECTED | CANCELLED | REPAIR | RECALLED" }
      - { name: screening_status, type: enum, source: system, default: NOT_SCREENED, description: "Sanctions dimension; independent of status; constraints: NOT_SCREENED | CLEAR | REVIEW | CONFIRMED_HIT" }
      - { name: reservation_active, type: boolean, source: computed, default: false, description: "True while this wire's amount participates in the account's daily_reserved_cents" }
      - { name: risk_score, type: integer, source: computed, description: "0-100 risk score computed at submission and recomputed at every repair (null until first submit)" }
      - { name: fee_assessed_cents, type: integer, source: computed, description: "Final assessed fee; null until execution" }
      - { name: net_principal_cents, type: integer, source: computed, description: "amount_cents minus POSTED correspondent charges with charge_type DEDUCTED_FROM_PRINCIPAL; null until execution" }
      - { name: executed_at, type: datetime, source: system, description: "Execution timestamp; null until EXECUTED" }
      - { name: hold_reason_code, type: enum, source: system, description: "Reason the wire sits blocked in APPROVED; one of SANCTIONS_HOLD | FRAUD_HOLD | REPAIR_HOLD; null otherwise" }
      - { name: repair_attempts, type: integer, source: system, default: 0, description: "Number of repair submissions; hard cap 2" }

  - name: ApprovalRecord
    parent: null
    common_fields: true
    fields:
      - { name: wire_id, type: string, source: input, description: "FK -> WireTransfer.id; approved wire" }
      - { name: sequence, type: enum, source: system, description: "Which approval step this record satisfies; constraints: FIRST | SECOND" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of the approving WireApprover" }
      - { name: decided_at, type: datetime, source: system, description: "Approval timestamp" }
      - { name: superseded, type: boolean, source: system, default: false, description: "True once a repair resubmit invalidates the record; superseded records never count toward dual approval" }

  - name: CallbackVerification
    parent: null
    common_fields: true
    fields:
      - { name: wire_id, type: string, source: input, description: "FK -> WireTransfer.id; wire under verification" }
      - { name: contact_name, type: string, source: input, description: "Customer contact reached on callback; null until recorded" }
      - { name: contact_phone, type: string, source: input, description: "Phone number used; null until recorded" }
      - { name: outcome, type: enum, source: input, description: "Callback result; constraints: CONFIRMED | DENIED | UNREACHABLE; null until recorded" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Case lifecycle; constraints: OPEN | CONFIRMED | DENIED | EXPIRED | SUPERSEDED" }
      - { name: opened_at, type: datetime, source: system, description: "Case open timestamp; 4-hour verification window starts here" }
      - { name: expires_at, type: datetime, source: computed, description: "opened_at + 4 hours; strict: at or after this instant an OPEN case auto-expires" }
      - { name: resolved_at, type: datetime, source: system, description: "Resolution timestamp; null while OPEN" }

  - name: SanctionsHit
    parent: null
    common_fields: true
    fields:
      - { name: wire_id, type: string, source: input, description: "FK -> WireTransfer.id; screened wire" }
      - { name: matched_list, type: enum, source: input, description: "Watchlist that matched; constraints: OFAC_SDN | INTERNAL_WATCH | EU_CONSOLIDATED" }
      - { name: matched_party, type: string, source: input, description: "Party text that matched (beneficiary name, bank, or ordering customer); the literal RISK_THRESHOLD marks a risk-score-driven review" }
      - { name: match_score, type: integer, source: input, description: "Screening engine score 0-100 (carries the risk_score value for RISK_THRESHOLD hits)" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Hit disposition lifecycle; constraints: OPEN | RELEASED_FALSE_POSITIVE | CONFIRMED | ESCALATED" }
      - { name: decided_by, type: string, source: system, description: "User id of the deciding screener/officer; null while OPEN or ESCALATED" }
      - { name: decided_at, type: datetime, source: system, description: "Disposition timestamp; null while OPEN or ESCALATED" }

  - name: FraudHold
    parent: null
    common_fields: true
    fields:
      - { name: wire_id, type: string, source: input, description: "FK -> WireTransfer.id; held wire" }
      - { name: reason_code, type: enum, source: input, description: "Suspicion driver; constraints: ACCOUNT_TAKEOVER | VELOCITY | MULE_SUSPECT | PHISHING" }
      - { name: note, type: string, source: input, description: "Analyst note" }
      - { name: placed_by, type: string, source: system, description: "User id of the placing FraudAnalyst" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Hold lifecycle; constraints: OPEN | CONFIRMED_FRAUD | CLEARED" }
      - { name: confirmation_window_hours, type: integer, source: computed, default: 24, description: "Customer confirmation window length in hours" }
      - { name: expires_at, type: datetime, source: computed, description: "Placement timestamp + 24 hours; at or after this instant an OPEN hold auto-resolves as AUTO_LAPSED" }
      - { name: resolution, type: enum, source: system, default: NONE, description: "Terminal resolution detail; constraints: NONE | CUSTOMER_CONFIRMED | CUSTOMER_DENIED | AUTO_LAPSED" }

  - name: RecallRequest
    parent: null
    common_fields: true
    fields:
      - { name: wire_id, type: string, source: input, description: "FK -> WireTransfer.id; wire to recall (must be EXECUTED)" }
      - { name: reason, type: enum, source: input, description: "Recall driver; constraints: DUPLICATE | FRAUD | ERROR_AMOUNT | ERROR_BENEFICIARY" }
      - { name: amount_to_recall_cents, type: integer, source: input, description: "Amount sought; must be > 0 and <= wire.amount_cents" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Recall negotiation lifecycle; constraints: REQUESTED | SENT_TO_BENEFICIARY_BANK | BENEFICIARY_RESPONDED | COMPLETED | DECLINED | EXPIRED" }
      - { name: beneficiary_bank_response, type: enum, source: system, default: NONE, description: "Recorded counterparty answer; constraints: NONE | FUNDS_RETURNED | FUNDS_DECLINED" }
      - { name: response_due_at, type: datetime, source: computed, description: "sent timestamp + 72 hours; strict: at or after this instant an unanswered recall auto-expires" }
      - { name: responded_at, type: datetime, source: system, description: "Beneficiary-bank response timestamp; null until response" }

  - name: FeeAssessment
    parent: null
    common_fields: true
    fields:
      - { name: wire_id, type: string, source: input, description: "FK -> WireTransfer.id; charged wire" }
      - { name: base_fee_cents, type: integer, source: computed, description: "Method base fee" }
      - { name: priority_fee_cents, type: integer, source: computed, default: 0, description: "Priority surcharge" }
      - { name: beneficiary_share_cents, type: integer, source: computed, default: 0, description: "Beneficiary-pays share of the base fee (SWIFT BENEFICIARY_REMUNERATION wires only)" }
      - { name: correspondent_share_cents, type: integer, source: computed, default: 0, description: "Bank-absorbed correspondent charge share after the per-charge-type rule" }
      - { name: total_fee_cents, type: integer, source: computed, description: "base + priority + beneficiary_share + correspondent_share" }
      - { name: kind, type: enum, source: system, description: "Assessment variant; constraints: PROVISIONAL | FINAL" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Assessment lifecycle; constraints: OPEN | BILLED | SUPERSEDED | WAIVED" }

  - name: CorrespondentCharge
    parent: null
    common_fields: true
    fields:
      - { name: wire_id, type: string, source: input, description: "FK -> WireTransfer.id; charged wire" }
      - { name: correspondent_name, type: string, source: input, description: "Correspondent bank name" }
      - { name: charge_type, type: enum, source: input, description: "Who contractually bears the charge; constraints: OUR | BENEFICIARY | DEDUCTED_FROM_PRINCIPAL" }
      - { name: amount_cents, type: integer, source: input, description: "Charge amount in cents; must be > 0" }
      - { name: source, type: enum, source: input, description: "Charge provenance; constraints: PROVISIONAL_ESTIMATE | ACTUAL_ADVICE" }
      - { name: status, type: enum, source: system, default: POSTED, description: "Charge lifecycle; constraints: POSTED | SUPERSEDED | CANCELLED" }

  - name: Investigation
    parent: null
    common_fields: true
    fields:
      - { name: wire_id, type: string, source: input, description: "FK -> WireTransfer.id; investigated wire (any status)" }
      - { name: type, type: enum, source: input, description: "Investigation flavor; constraints: TRACER | NON_RECEIPT | VALUE_DISPUTE" }
      - { name: note, type: string, source: input, description: "Investigator note" }
      - { name: opened_by, type: string, source: system, description: "User id of the opening WireInvestigator" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Investigation lifecycle with send-answer loop; constraints: OPEN | AWAITING_RESPONSE | RESOLVED | CLOSED" }
      - { name: max_tracers, type: integer, source: system, default: 3, description: "Cap on tracer dispatches per investigation" }
      - { name: tracer_count, type: integer, source: system, default: 0, description: "OUTBOUND tracers sent so far" }

  - name: TracerMessage
    parent: null
    common_fields: true
    fields:
      - { name: investigation_id, type: string, source: input, description: "FK -> Investigation.id; parent investigation" }
      - { name: direction, type: enum, source: input, description: "Message direction; constraints: OUTBOUND | INBOUND" }
      - { name: body, type: string, source: input, description: "Message text" }
      - { name: sequence_no, type: integer, source: computed, description: "Per-investigation sequence number assigned in creation order starting at 1" }

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the actor" }
      - { name: actor_role, type: string, source: system, description: "X-User-Role of the actor" }
      - { name: action, type: string, source: system, description: "Endpoint action label (e.g., wire.approve, sanctions.release)" }
      - { name: entity_type, type: string, source: system, description: "Affected entity type" }
      - { name: entity_id, type: string, source: system, description: "Affected entity id (identity only, no business semantics)" }
      - { name: wire_id, type: string, source: system, description: "FK -> WireTransfer.id; related wire when the action concerns one; null otherwise" }
      - { name: detail, type: string, source: system, description: "Free-text detail including before/after states" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: WireTransfer
    initial_state: INITIATED
    terminal_states: [EXECUTED, REJECTED, CANCELLED, RECALLED]
    note: "Two independent state dimensions: `status` (processing) and `screening_status` (sanctions). The transitions below list the status transitions first; screening_status evolves only via the screening transitions at the end."
    transitions:
      - from: INITIATED
        to: CALLBACK_PENDING
        trigger: "system (at creation when amount_cents >= CALLBACK_THRESHOLD_CENTS)"
        actor: system
        preconditions: []
        side_effects:
          - "callback_status = PENDING"
          - "create CallbackVerification(status=OPEN, opened_at=now, expires_at=now+4h) linked to this wire"

      - from: INITIATED
        to: PENDING_APPROVAL
        trigger: "POST /wire-ops/wires/{id}/submit"
        actor: WireOperator
        preconditions:
          - "status = INITIATED (ERR_INVALID_STATE otherwise)"
          - "wire.requires_callback = false (otherwise the machine is in CALLBACK_PENDING, not INITIATED)"
        side_effects:
          - "value_date = request business_date (must identify an OPEN BusinessDate)"
          - "screening runs: screening_status NOT_SCREENED -> CLEAR or REVIEW; risk_score computed per calculations.risk_score"
          - "reservation_active = true; ordering Account.daily_reserved_cents += amount_cents"
          - "increments WireTransfer.version by 1"

      - from: CALLBACK_PENDING
        to: PENDING_APPROVAL
        trigger: "POST /wire-ops/wires/{id}/submit"
        actor: WireOperator
        preconditions:
          - "status = CALLBACK_PENDING"
          - "callback_status = VERIFIED, or WAIVED via waive_callback on a LOW-risk customer (ERR_CALLBACK_NOT_VERIFIED otherwise)"
        side_effects:
          - "value_date = request business_date (must identify an OPEN BusinessDate)"
          - "screening runs: screening_status NOT_SCREENED -> CLEAR or REVIEW; risk_score computed"
          - "reservation_active = true; ordering Account.daily_reserved_cents += amount_cents"
          - "increments WireTransfer.version by 1"

      - from: PENDING_APPROVAL
        to: APPROVED
        trigger: "POST /wire-ops/wires/{id}/approve (the second of the dual approval)"
        actor: WireApprover
        preconditions:
          - "status = PENDING_APPROVAL"
          - "a non-superseded FIRST ApprovalRecord exists for the current repair round and the second approver differs from the first approver and from initiated_by (ERR_SOD_APPROVER_MISMATCH)"
        side_effects:
          - "second_approved_by = actor; create ApprovalRecord(sequence=SECOND)"
          - "increments WireTransfer.version by 1"

      - from: APPROVED
        to: RELEASING
        trigger: "POST /wire-ops/wires/{id}/release"
        actor: WireOperator
        preconditions:
          - "status = APPROVED (ERR_INVALID_STATE otherwise)"
          - "hold_reason_code is null (ERR_WIRE_ON_HOLD otherwise)"
          - "screening_status = CLEAR (ERR_SANCTIONS_NOT_CLEARED otherwise)"
          - "the BusinessDate of the wire's value_date is OPEN (ERR_CUTOFF_PASSED when CUTOFF_PASSED or CLOSED)"
        side_effects:
          - "reservation_active = false; Account.daily_reserved_cents -= amount_cents (reservation converts into the executed tally)"
          - "increments WireTransfer.version by 1"

      - from: RELEASING
        to: EXECUTED
        trigger: "system (immediate network dispatch within the release call)"
        actor: system
        preconditions:
          - "calculations.daily_limit_check passes: Account.daily_released_cents + amount_cents <= daily_outgoing_limit_cents (ERR_DAILY_LIMIT_EXCEEDED aborts the whole release atomically: wire stays APPROVED with reservation_active = true and daily_reserved_cents restored/unchanged)"
        side_effects:
          - "executed_at = now"
          - "Account.daily_released_cents += amount_cents"
          - "if Account.status = DORMANT it reactivates to ACTIVE"
          - "beneficiary.first_used_at set on first execution (null until then)"
          - "run calculations.fee_assessment (variant FINAL): create FeeAssessment(kind=FINAL, status=OPEN); mark any prior OPEN PROVISIONAL assessment SUPERSEDED and every POSTED PROVISIONAL_ESTIMATE CorrespondentCharge SUPERSEDED"
          - "fee_assessed_cents = that FINAL total; net_principal_cents = amount_cents - sum(POSTED DEDUCTED_FROM_PRINCIPAL charge amounts)"
          - "write AuditLogEntry(action=wire.execute)"

      - from: PENDING_APPROVAL
        to: REJECTED
        trigger: "POST /wire-ops/wires/{id}/reject"
        actor: WireApprover
        preconditions:
          - "status = PENDING_APPROVAL"
        side_effects:
          - "reservation_active = false; Account.daily_reserved_cents -= amount_cents"
          - "write AuditLogEntry(action=wire.reject)"

      - from: INITIATED
        to: CANCELLED
        trigger: "POST /wire-ops/wires/{id}/cancel"
        actor: WireOperator
        preconditions: []
        side_effects:
          - "write AuditLogEntry(action=wire.cancel)"

      - from: CALLBACK_PENDING
        to: CANCELLED
        trigger: "POST /wire-ops/wires/{id}/cancel OR system (linked CallbackVerification expires or is DENIED)"
        actor: WireOperator | system
        preconditions: []
        side_effects:
          - "if a CallbackVerification is OPEN: it transitions to SUPERSEDED (operator cancel) or EXPIRED (window lapse)"
          - "callback_status = NONE"
          - "write AuditLogEntry(action=wire.cancel)"

      - from: PENDING_APPROVAL
        to: CANCELLED
        trigger: "POST /wire-ops/wires/{id}/cancel"
        actor: WireOperator
        preconditions: []
        side_effects:
          - "reservation_active = false; Account.daily_reserved_cents -= amount_cents"
          - "write AuditLogEntry(action=wire.cancel)"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /wire-ops/wires/{id}/cancel"
        actor: WireOperator
        preconditions:
          - "hold_reason_code is null (ERR_WIRE_ON_HOLD: a held wire cannot be cancelled directly; the hold disposition cancels it)"
        side_effects:
          - "write AuditLogEntry(action=wire.cancel)"

      - from: PENDING_APPROVAL
        to: REPAIR
        trigger: "POST /wire-ops/wires/{id}/repair (STP exception handling)"
        actor: RepairSpecialist
        preconditions:
          - "status = PENDING_APPROVAL"
          - "repair_attempts < 2 (ERR_REPAIR_LIMIT_EXCEEDED otherwise)"
        side_effects:
          - "repair_attempts += 1; apply corrected fields from the payload"
          - "if amount_cents changed: Account.daily_reserved_cents is re-based by the delta (new minus old), keeping reservation_active = true"
          - "screening re-runs: screening_status reset to NOT_SCREENED, then NOT_SCREENED -> CLEAR or REVIEW; risk_score recomputed"
          - "increments WireTransfer.version by 1"
          - "write AuditLogEntry(action=wire.repair)"

      - from: REPAIR
        to: PENDING_APPROVAL
        trigger: "POST /wire-ops/wires/{id}/resubmit"
        actor: RepairSpecialist
        preconditions:
          - "status = REPAIR"
        side_effects:
          - "all ApprovalRecords from the prior round are marked superseded = true and stop counting; a fresh FIRST/SECOND pair is required"
          - "first_approved_by and second_approved_by reset to null"
          - "write AuditLogEntry(action=wire.resubmit)"

      - from: REPAIR
        to: CANCELLED
        trigger: "POST /wire-ops/wires/{id}/cancel"
        actor: WireOperator
        preconditions: []
        side_effects:
          - "reservation_active = false; Account.daily_reserved_cents -= current amount_cents"
          - "write AuditLogEntry(action=wire.cancel)"

      - from: EXECUTED
        to: RECALLED
        trigger: "system (when a linked RecallRequest completes with beneficiary_bank_response = FUNDS_RETURNED)"
        actor: system
        preconditions:
          - "a RecallRequest for this wire reaches COMPLETED"
        side_effects:
          - "write AuditLogEntry(action=wire.recalled)"

      # --- screening_status dimension (independent axis) ---
      - from: NOT_SCREENED
        to: CLEAR
        trigger: "system (screening runs at submit and at every repair)"
        actor: system
        preconditions:
          - "no unresolved SanctionsHit exists for this wire AND calculations.risk_score < RISK_REVIEW_THRESHOLD (50)"
        side_effects: []

      - from: NOT_SCREENED
        to: REVIEW
        trigger: "system (screening finds an unresolved hit OR risk_score >= RISK_REVIEW_THRESHOLD)"
        actor: system
        preconditions: []
        side_effects:
          - "when risk_score >= 50 without a party match, create one SanctionsHit(matched_list=INTERNAL_WATCH, matched_party=RISK_THRESHOLD, match_score=risk_score, status=OPEN) so the disposition path is uniform"
          - "if status = APPROVED and hold_reason_code is null: hold_reason_code = SANCTIONS_HOLD (an existing FRAUD_HOLD is never overwritten)"

      - from: REVIEW
        to: CLEAR
        trigger: "POST /wire-ops/sanctions-hits/{id}/release resolving the wire's last unresolved hit"
        actor: SanctionsScreener | ComplianceOfficer
        preconditions:
          - "every SanctionsHit for the wire is terminal (RELEASED_FALSE_POSITIVE or CONFIRMED) — an ESCALATED hit still blocks CLEAR"
        side_effects:
          - "if hold_reason_code = SANCTIONS_HOLD: hold_reason_code = null"

      - from: REVIEW
        to: CONFIRMED_HIT
        trigger: "POST /wire-ops/sanctions-hits/{id}/confirm on any unresolved hit of the wire"
        actor: SanctionsScreener | ComplianceOfficer
        preconditions: []
        side_effects:
          - "if status in {PENDING_APPROVAL, REPAIR}: status = REJECTED; reservation_active = false; Account.daily_reserved_cents -= amount_cents; hold_reason_code = null; write AuditLogEntry(action=sanctions.confirm)"

  - entity: ApprovalRecord
    initial_state: RECORDED
    terminal_states: [RECORDED]
    note: "Approval is a two-step accumulation on the wire rather than a status walk on the record. The wire's PENDING_APPROVAL -> APPROVED transition fires only when a FIRST and a SECOND record by two distinct eligible approvers (neither equal to initiated_by) exist for the current repair round. Resubmit marks prior records superseded; superseded records never count."
    transitions:
      - from: NONE
        to: RECORDED
        trigger: "POST /wire-ops/wires/{id}/approve"
        actor: WireApprover
        preconditions:
          - "wire.status = PENDING_APPROVAL (ERR_INVALID_STATE otherwise)"
          - "actor is not wire.initiated_by (ERR_SOD_APPROVER_MISMATCH)"
          - "actor has no non-superseded ApprovalRecord for this wire's current repair round (ERR_SOD_APPROVER_MISMATCH)"
        side_effects:
          - "create ApprovalRecord(sequence = FIRST if no non-superseded record exists for the current round else SECOND, approver_user_id = actor)"
          - "wire.first_approved_by / wire.second_approved_by populated in order"
          - "when the SECOND record is created the wire transitions to APPROVED"

  - entity: CallbackVerification
    initial_state: OPEN
    terminal_states: [CONFIRMED, DENIED, EXPIRED, SUPERSEDED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /wire-ops/callbacks/{id}/record with outcome = CONFIRMED"
        actor: WireOperator
        preconditions:
          - "status = OPEN (ERR_INVALID_STATE otherwise)"
          - "now < expires_at (ERR_CALLBACK_WINDOW_EXPIRED otherwise)"
        side_effects:
          - "resolved_at = now; wire.callback_status = VERIFIED"

      - from: OPEN
        to: DENIED
        trigger: "POST /wire-ops/callbacks/{id}/record with outcome = DENIED"
        actor: WireOperator
        preconditions:
          - "status = OPEN"
          - "now < expires_at (ERR_CALLBACK_WINDOW_EXPIRED otherwise)"
        side_effects:
          - "resolved_at = now; wire.callback_status = NONE; wire.status -> CANCELLED; write AuditLogEntry(action=callback.denied)"

      - from: OPEN
        to: OPEN
        trigger: "POST /wire-ops/callbacks/{id}/record with outcome = UNREACHABLE"
        actor: WireOperator
        preconditions:
          - "status = OPEN"
          - "now < expires_at (ERR_CALLBACK_WINDOW_EXPIRED otherwise)"
        side_effects:
          - "case stays OPEN; retries allowed until the window lapses"
        note: "UNREACHABLE is a non-terminal outcome: the case remains OPEN and retryable."

      - from: OPEN
        to: EXPIRED
        trigger: "system (evaluated lazily on any access to the case or its wire: if now >= expires_at the case auto-expires)"
        actor: system
        preconditions: []
        side_effects:
          - "wire.status -> CANCELLED; wire.callback_status = NONE; write AuditLogEntry(action=callback.expired)"

      - from: OPEN
        to: SUPERSEDED
        trigger: "system (operator cancels the wire while the case is OPEN)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SanctionsHit
    initial_state: OPEN
    terminal_states: [RELEASED_FALSE_POSITIVE, CONFIRMED]
    transitions:
      - from: OPEN
        to: RELEASED_FALSE_POSITIVE
        trigger: "POST /wire-ops/sanctions-hits/{id}/release"
        actor: SanctionsScreener
        preconditions:
          - "hit.status = OPEN (ERR_HIT_ALREADY_RESOLVED otherwise; a SanctionsScreener may disposition only OPEN hits — an ESCALATED hit under a SanctionsScreener is ERR_FORBIDDEN_ROLE)"
          - "wire.status in {PENDING_APPROVAL, REPAIR, APPROVED} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "decided_by = actor; decided_at = now"
          - "when this was the wire's last unresolved hit: wire.screening_status = CLEAR; if wire.hold_reason_code = SANCTIONS_HOLD then hold_reason_code = null"
          - "write AuditLogEntry(action=sanctions.release)"

      - from: OPEN
        to: CONFIRMED
        trigger: "POST /wire-ops/sanctions-hits/{id}/confirm"
        actor: SanctionsScreener
        preconditions:
          - "hit.status = OPEN (ERR_HIT_ALREADY_RESOLVED otherwise)"
          - "wire.status in {PENDING_APPROVAL, REPAIR, APPROVED} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "decided_by = actor; decided_at = now"
          - "wire.screening_status = CONFIRMED_HIT"
          - "wire.status -> REJECTED; reservation released (daily_reserved_cents -= amount_cents, reservation_active = false); hold_reason_code = null"
          - "write AuditLogEntry(action=sanctions.confirm)"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /wire-ops/sanctions-hits/{id}/escalate"
        actor: SanctionsScreener
        preconditions:
          - "hit.status = OPEN (ERR_HIT_ALREADY_RESOLVED otherwise)"
        side_effects:
          - "an ESCALATED hit is unresolved: it still blocks screening_status = CLEAR until dispositioned"
          - "write AuditLogEntry(action=sanctions.escalate)"

      - from: ESCALATED
        to: RELEASED_FALSE_POSITIVE
        trigger: "POST /wire-ops/sanctions-hits/{id}/release"
        actor: ComplianceOfficer
        preconditions:
          - "hit.status = ESCALATED (only a ComplianceOfficer may disposition an ESCALATED hit; SanctionsScreener gets ERR_FORBIDDEN_ROLE)"
          - "wire.status in {PENDING_APPROVAL, REPAIR, APPROVED} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "decided_by = actor; decided_at = now"
          - "when this was the wire's last unresolved hit: wire.screening_status = CLEAR; SANCTIONS_HOLD cleared if present"

      - from: ESCALATED
        to: CONFIRMED
        trigger: "POST /wire-ops/sanctions-hits/{id}/confirm"
        actor: ComplianceOfficer
        preconditions:
          - "hit.status = ESCALATED (ComplianceOfficer only)"
          - "wire.status in {PENDING_APPROVAL, REPAIR, APPROVED}"
        side_effects:
          - "same compensation as OPEN->CONFIRMED: wire REJECTED, reservation released, hold cleared"

  - entity: FraudHold
    initial_state: OPEN
    terminal_states: [CONFIRMED_FRAUD, CLEARED]
    transitions:
      - from: NONE
        to: OPEN
        trigger: "POST /wire-ops/wires/{id}/fraud-holds"
        actor: FraudAnalyst
        preconditions:
          - "wire.status = APPROVED (ERR_INVALID_STATE otherwise)"
          - "wire.hold_reason_code is null (ERR_WIRE_ON_HOLD otherwise)"
        side_effects:
          - "wire.hold_reason_code = FRAUD_HOLD"
          - "create FraudHold(status=OPEN, placed_by=actor, expires_at=now+24h)"
          - "write AuditLogEntry(action=fraud.hold_place)"

      - from: OPEN
        to: CLEARED
        trigger: "POST /wire-ops/fraud-holds/{id}/customer-confirm with confirmation = LEGITIMATE"
        actor: FraudAnalyst
        preconditions:
          - "hold.status = OPEN (ERR_INVALID_STATE otherwise)"
          - "now < expires_at (ERR_FRAUD_HOLD_WINDOW_EXPIRED otherwise)"
        side_effects:
          - "resolution = CUSTOMER_CONFIRMED; wire.hold_reason_code = null; wire remains APPROVED"
          - "write AuditLogEntry(action=fraud.cleared)"

      - from: OPEN
        to: CONFIRMED_FRAUD
        trigger: "POST /wire-ops/fraud-holds/{id}/customer-confirm with confirmation = FRAUDULENT, or system (window lapse: at now >= expires_at the hold auto-resolves, evaluated lazily on any access to the hold or its wire)"
        actor: FraudAnalyst | system
        preconditions:
          - "hold.status = OPEN"
        side_effects:
          - "resolution = CUSTOMER_DENIED (explicit) or AUTO_LAPSED (window lapse)"
          - "wire.status -> CANCELLED; wire.hold_reason_code = null"
          - "ordering Customer.status -> FROZEN (sets frozen_at = now); a FROZEN customer cannot initiate new wires"
          - "write AuditLogEntry(action=fraud.confirmed)"

  - entity: RecallRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DECLINED, EXPIRED]
    transitions:
      - from: REQUESTED
        to: SENT_TO_BENEFICIARY_BANK
        trigger: "POST /wire-ops/recalls/{id}/send"
        actor: WireOperator
        preconditions:
          - "recall.status = REQUESTED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "response_due_at = now + 72 hours"
          - "write AuditLogEntry(action=recall.send)"

      - from: SENT_TO_BENEFICIARY_BANK
        to: BENEFICIARY_RESPONDED
        trigger: "POST /wire-ops/recalls/{id}/respond (beneficiary bank answer)"
        actor: BeneficiaryBank
        preconditions:
          - "recall.status = SENT_TO_BENEFICIARY_BANK (ERR_RECALL_ALREADY_RESOLVED when terminal; ERR_INVALID_STATE when still REQUESTED)"
          - "now < response_due_at (ERR_RECALL_EXPIRED otherwise)"
        side_effects:
          - "beneficiary_bank_response = FUNDS_RETURNED or FUNDS_DECLINED per payload; responded_at = now"

      - from: BENEFICIARY_RESPONDED
        to: COMPLETED
        trigger: "POST /wire-ops/recalls/{id}/complete"
        actor: WireOperator
        preconditions:
          - "recall.status = BENEFICIARY_RESPONDED (ERR_RECALL_ALREADY_RESOLVED when terminal)"
          - "beneficiary_bank_response = FUNDS_RETURNED (ERR_RECALL_NOT_RETURNED otherwise)"
        side_effects:
          - "wire.status -> RECALLED"
          - "calculations.recall_compensation booked; any OPEN FeeAssessment on the wire is left billed/open per its own lifecycle (completion does not auto-waive)"
          - "write AuditLogEntry(action=recall.complete)"

      - from: BENEFICIARY_RESPONDED
        to: DECLINED
        trigger: "POST /wire-ops/recalls/{id}/decline (originating bank accepts the beneficiary bank's refusal)"
        actor: WireOperator
        preconditions:
          - "recall.status = BENEFICIARY_RESPONDED (ERR_RECALL_ALREADY_RESOLVED when terminal)"
          - "beneficiary_bank_response = FUNDS_DECLINED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "write AuditLogEntry(action=recall.declined)"

      - from: SENT_TO_BENEFICIARY_BANK
        to: EXPIRED
        trigger: "system (evaluated lazily on any access to the recall or its wire: if now >= response_due_at the recall auto-expires)"
        actor: system
        preconditions: []
        side_effects:
          - "wire.status is NOT affected — the recall dies, the payment stays EXECUTED"
          - "write AuditLogEntry(action=recall.expired)"

  - entity: Investigation
    initial_state: OPEN
    terminal_states: [RESOLVED, CLOSED]
    note: "Cyclic answer loop: OPEN -> AWAITING_RESPONSE -> OPEN may repeat; each OUTBOUND tracer dispatch increments tracer_count and is capped at max_tracers (3); INBOUND replies do not consume the budget."
    transitions:
      - from: OPEN
        to: AWAITING_RESPONSE
        trigger: "POST /wire-ops/investigations/{id}/tracers (OUTBOUND dispatch)"
        actor: WireInvestigator
        preconditions:
          - "investigation.status = OPEN (ERR_INVALID_STATE otherwise)"
          - "tracer_count < max_tracers (ERR_TRACER_LIMIT_EXCEEDED otherwise)"
        side_effects:
          - "create TracerMessage(direction=OUTBOUND, sequence_no = count of existing TracerMessages for this investigation + 1)"
          - "tracer_count += 1"

      - from: AWAITING_RESPONSE
        to: OPEN
        trigger: "POST /wire-ops/investigations/{id}/respond (register counterparty reply)"
        actor: WireInvestigator
        preconditions:
          - "investigation.status = AWAITING_RESPONSE (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "create TracerMessage(direction=INBOUND, sequence_no = existing message count + 1; INBOUND messages do not increment tracer_count)"
          - "investigation returns to OPEN and may dispatch another tracer"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /wire-ops/investigations/{id}/resolve"
        actor: WireInvestigator
        preconditions:
          - "investigation.status = OPEN (ERR_INVALID_STATE otherwise)"
        side_effects: []

      - from: OPEN
        to: CLOSED
        trigger: "POST /wire-ops/investigations/{id}/close"
        actor: WireInvestigator
        preconditions:
          - "investigation.status = OPEN"
        side_effects: []

      - from: AWAITING_RESPONSE
        to: CLOSED
        trigger: "POST /wire-ops/investigations/{id}/close"
        actor: WireInvestigator
        preconditions:
          - "investigation.status = AWAITING_RESPONSE"
        side_effects: []

  - entity: FeeAssessment
    initial_state: OPEN
    terminal_states: [BILLED, SUPERSEDED, WAIVED]
    transitions:
      - from: OPEN
        to: BILLED
        trigger: "POST /wire-ops/fees/{id}/bill"
        actor: WireOperator
        preconditions:
          - "fee.status = OPEN (ERR_INVALID_STATE otherwise)"
          - "linked wire.status = EXECUTED or RECALLED (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "write AuditLogEntry(action=fee.billed)"

      - from: OPEN
        to: SUPERSEDED
        trigger: "system (execution creates the FINAL assessment and supersedes any OPEN PROVISIONAL one; POSTED PROVISIONAL_ESTIMATE charges are likewise SUPERSEDED at execution)"
        actor: system
        preconditions: []
        side_effects: []

      - from: OPEN
        to: WAIVED
        trigger: "POST /wire-ops/fees/{id}/waive"
        actor: WireOpsAdmin
        preconditions:
          - "fee.status = OPEN (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "write AuditLogEntry(action=fee.waived)"

  - entity: BusinessDate
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CUTOFF_PASSED
        trigger: "POST /wire-ops/business-dates/{id}/close-cutoff"
        actor: WireOpsAdmin
        preconditions:
          - "status = OPEN (ERR_CUTOFF_ALREADY_PASSED otherwise)"
        side_effects:
          - "no wire may be submitted or released against this business date from this point on"
          - "write AuditLogEntry(action=date.cutoff_closed)"

      - from: CUTOFF_PASSED
        to: CLOSED
        trigger: "POST /wire-ops/business-dates/{id}/close-day"
        actor: WireOpsAdmin
        preconditions:
          - "status = CUTOFF_PASSED (ERR_INVALID_STATE otherwise)"
          - "end-of-day reconciliation: no wire with value_date = this business_date is in a non-terminal status {INITIATED, CALLBACK_PENDING, PENDING_APPROVAL, APPROVED, RELEASING, REPAIR} (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "write AuditLogEntry(action=date.closed)"

  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "system (a FraudHold on one of this customer's wires resolves CONFIRMED_FRAUD) OR POST /wire-ops/customers/{id}/freeze"
        actor: system | WireOpsAdmin
        preconditions: []
        side_effects:
          - "frozen_at = now"
          - "write AuditLogEntry(action=customer.frozen)"

      - from: FROZEN
        to: ACTIVE
        trigger: "POST /wire-ops/customers/{id}/unfreeze"
        actor: WireOpsAdmin
        preconditions:
          - "status = FROZEN"
          - "no OPEN FraudHold exists on any wire ordered by any account of this customer (ERR_CUSTOMER_STILL_FROZEN otherwise)"
        side_effects:
          - "frozen_at = null"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /wire-ops/customers/{id}/close"
        actor: WireOpsAdmin
        preconditions:
          - "status = ACTIVE (ERR_INVALID_STATE otherwise)"
          - "no wire in a non-terminal status exists on any account of this customer (ERR_CUSTOMER_NOT_SETTLED otherwise)"
        side_effects: []

  - entity: Account
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: DORMANT
        trigger: "POST /wire-ops/accounts/{id}/mark-dormant"
        actor: WireOpsAdmin
        preconditions:
          - "status = ACTIVE (ERR_INVALID_STATE otherwise)"
        side_effects: []

      - from: DORMANT
        to: ACTIVE
        trigger: "system (a wire on this account reaches EXECUTED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /wire-ops/accounts/{id}/close"
        actor: WireOpsAdmin
        preconditions:
          - "status = ACTIVE (ERR_INVALID_STATE otherwise)"
          - "no wire in a non-terminal status references this account and daily_reserved_cents = 0 (ERR_ACCOUNT_NOT_SETTLED otherwise)"
        side_effects: []

  - entity: Beneficiary
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /wire-ops/beneficiaries/{id}/retire"
        actor: WireOperator
        preconditions:
          - "status = ACTIVE"
          - "no wire in a non-terminal status references this beneficiary (ERR_BENEFICIARY_IN_USE otherwise)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: wire-approve-stale-version
    parent_entity: WireTransfer
    write_endpoint: "POST /wire-ops/wires/{id}/approve"
    occ_field: "expected_wire_version"
    description: |
      Approving a WireTransfer whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      meanwhile acted on the wire (a first approval recorded, a repair submitted,
      a cancellation, or a screening-driven rejection) and the current writer's
      view of the wire is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: wire-release-stale-version
    parent_entity: WireTransfer
    write_endpoint: "POST /wire-ops/wires/{id}/release"
    occ_field: "expected_wire_version"
    description: |
      Releasing a WireTransfer whose version has advanced since the client last
      observed it is rejected. A fraud hold, a sanctions hold, a repair cycle,
      or a cancellation that landed after the client's last read makes the
      client's view of the wire stale, and the release must not proceed on
      stale facts.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: wire-repair-stale-version
    parent_entity: WireTransfer
    write_endpoint: "POST /wire-ops/wires/{id}/repair"
    occ_field: "expected_wire_version"
    description: |
      Repairing a WireTransfer whose version has advanced since the repair
      specialist last observed it is rejected, because the corrections were
      prepared against a superseded view of the wire's fields and state.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: fee_assessment
    trigger: "wire execution (variant FINAL, automatic); POST /wire-ops/wires/{id}/fees/assess (kind PROVISIONAL pre-execution, or FINAL re-run post-execution)"
    algorithm: aggregation
    formula: |
      Evaluation order is pinned: compute each component independently, then sum.
      1. base_fee_cents      = BASE_FEE[method]                      # Fedwire 2500 | SWIFT 3500 | CHIPS 1800
      2. priority_fee_cents  = PRIORITY_SURCHARGE[priority]          # SAME_DAY 1000 | NORMAL 0
      3. beneficiary_share_cents = round_half_up(base_fee_cents * BENEPAY_SHARE)   # 0.40
                                 iff method = SWIFT and wire.charge_mode =
                                 BENEFICIARY_REMUNERATION; else 0
      4. correspondent_share_cents = sum over POSTED CorrespondentCharge rows of:
           round_half_up(amount_cents * DEDUCTED_FACTOR)   (0.50) if charge_type = DEDUCTED_FROM_PRINCIPAL
           amount_cents * 1.00                             if charge_type = OUR
           0                                               if charge_type = BENEFICIARY
         Each product is rounded_half_up to whole cents PER CHARGE, then summed.
         Variant input-set rule (see variants): only charges with source per the variant.
      5. total_fee_cents = base_fee_cents + priority_fee_cents
                           + beneficiary_share_cents + correspondent_share_cents
      (total is NOT rounded again — per-charge rounding then sum is the pinned order;
       rounding only the final sum is the rejected alternative.)
    input_set: "CorrespondentCharge rows for the wire with status = POSTED, filtered by source per the active variant; excludes SUPERSEDED and CANCELLED rows"
    constants:
      BASE_FEE_FEDWIRE_CENTS: 2500
      BASE_FEE_SWIFT_CENTS: 3500
      BASE_FEE_CHIPS_CENTS: 1800
      PRIORITY_SURCHARGE_SAME_DAY_CENTS: 1000
      BENEPAY_SHARE: 0.40
      DEDUCTED_FACTOR: 0.50
    precision: "whole cents; round_half_up applied per charge line before summation"
    variants:
      - name: PROVISIONAL
        when: "pre-execution estimate (the only kind allowed while the wire is not yet EXECUTED or RECALLED)"
        difference: "input_set restricted to charges with source = PROVISIONAL_ESTIMATE; ACTUAL_ADVICE charges excluded"
      - name: FINAL
        when: "execution (automatic) and any post-execution re-assessment"
        difference: "input_set restricted to charges with source = ACTUAL_ADVICE; PROVISIONAL_ESTIMATE charges excluded (they are marked SUPERSEDED at execution)"

  - name: risk_score
    trigger: "wire submission (POST /submit) and every repair (POST /repair re-screens)"
    algorithm: weighted_scoring
    formula: |
      amount_band = 0   if amount_cents <  100000000 ($1M)
                  = 25  if 100000000 <= amount_cents < 500000000 ($5M)
                  = 40  if amount_cents >= 500000000
      geo_component       = 20 if ordering customer.high_risk_jurisdiction else 0
      watchlist_component = min(30, 15 * (number of SanctionsHit rows for this wire
                                          with status in {OPEN, ESCALATED} at scoring time))
      velocity_component  = 15 if sum of amount_cents over the account's wires
                                 EXECUTED within the trailing 30 days (window:
                                 executed_at >= now - 30 days, executed_at <= now)
                                 > 1000000000 ($10M, strictly greater)
                            else 0
      behavior_component  = (10 if account.status = DORMANT else 0)
                          + (10 if beneficiary.first_used_at is null else 0)
      raw = amount_band + geo_component + watchlist_component + velocity_component + behavior_component
      risk_score = max(0, min(100, raw))
      Side effect of the score: risk_score >= RISK_REVIEW_THRESHOLD (50) forces
      screening_status = REVIEW even when no party match exists; in that case the
      screening run creates one SanctionsHit(matched_list = INTERNAL_WATCH,
      matched_party = "RISK_THRESHOLD", match_score = risk_score, status = OPEN)
      so the disposition path (release / confirm) is uniform for every REVIEW.
    input_set: "the wire, its ordering Account, that account's Customer, the Beneficiary, and the account's EXECUTED wires in the trailing 30-day window"
    constants:
      AMOUNT_BAND_1_CENTS: 100000000
      AMOUNT_BAND_2_CENTS: 500000000
      VELOCITY_WINDOW_DAYS: 30
      VELOCITY_THRESHOLD_CENTS: 1000000000
      RISK_REVIEW_THRESHOLD: 50
    precision: "integer score; no rounding"
    variants:
      - name: BENEFICIARY_CONSERVATIVE
        when: "applied iff the wire's method = SWIFT (cross-border convention: new-beneficiary risk is rated per beneficiary bank rather than per beneficiary record)"
        difference: "the new-beneficiary term (+10) is taken when the beneficiary's BANK (bank_name + country_code) has never appeared on a prior EXECUTED wire of this account, even when this beneficiary record's first_used_at is already set; the record-based reading (default) takes the term only when first_used_at is null — the two interpretations diverge on wires whose beneficiary record is reused but whose bank is new to the account, and vice versa"

  - name: daily_limit_check
    trigger: "wire execution (RELEASING -> EXECUTED)"
    algorithm: threshold
    formula: |
      available = account.daily_outgoing_limit_cents - account.daily_released_cents
      Execution proceeds iff available >= wire.amount_cents.
      Boundary: available == amount_cents EXACTLY is allowed (>= semantics);
      available == amount_cents - 1 cent rejects with ERR_DAILY_LIMIT_EXCEEDED.
      On rejection the release aborts atomically: wire stays APPROVED,
      reservation_active stays true, daily_reserved_cents unchanged.
      On success: daily_reserved_cents -= amount_cents (reservation conversion)
      AND daily_released_cents += amount_cents — the principal is counted
      exactly once against the limit on the current business date.
    input_set: "the wire's ordering Account and this wire"
    constants: {}
    precision: "whole cents; integer comparison"

  - name: callback_requirement
    trigger: "wire creation"
    algorithm: threshold
    formula: |
      requires_callback = (amount_cents >= CALLBACK_THRESHOLD_CENTS)   # inclusive: exactly $1,000,000.00 requires it
      Exemption: if the ordering Customer.risk_rating = LOW, the callback
      requirement may be waived at submit time via waive_callback = true
      (callback_status = WAIVED). Waivers are recorded in the audit log;
      waive_callback = true for a non-LOW customer is ERR_INVALID_REQUEST.
    input_set: "the wire's amount_cents and ordering Customer.risk_rating"
    constants:
      CALLBACK_THRESHOLD_CENTS: 100000000
    precision: "integer comparison, inclusive lower bound"

  - name: recall_compensation
    trigger: "recall completion (RecallRequest -> COMPLETED)"
    algorithm: aggregation
    formula: |
      wire_net_delta = amount_to_recall_cents - wire.net_principal_cents
      Positive delta: the bank recovered more than originally credited the
      beneficiary (correspondent deductions meant less than the principal left
      the building) — the difference is booked as correspondent loss recovery.
      Negative delta: partial recall — the unrecovered remainder
      (net_principal_cents - amount_to_recall_cents) is booked as recall loss.
      Conserved invariant (compensating-action invariant):
        amount_cents == net_principal_cents + correspondent_deducted_cents
        holds at execution AND after recall completion, where
        correspondent_deducted_cents = sum of POSTED DEDUCTED_FROM_PRINCIPAL
        charge amounts at the moment of execution.
    input_set: "the RecallRequest, its wire, the wire's POSTED CorrespondentCharge rows"
    constants: {}
    precision: "whole cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and non-empty"
    error_id: ERR_MISSING_AUTH
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The given role must be listed in the endpoint's roles (including tier-gated dispositions: SanctionsScreener handles only OPEN hits, ComplianceOfficer only ESCALATED hits)"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Every path id must exist (404), validated left-to-right; body-supplied FK references (ordering_account_id, beneficiary_id, wire_id, investigation_id, recall wire) must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: business_constraint
    check: "Request body schema: required fields present, types correct, enum values in domain, amount fields > 0, unknown keys rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: business_referential
    check: "Wire creation: beneficiary.customer_id must equal the ordering account's customer_id (cross-aggregate consistency)"
    error_id: ERR_BENEFICIARY_ACCOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /wire-ops/wires"

  - priority: 6
    category: business_referential
    check: "Wire creation: ordering account status = ACTIVE and beneficiary status = ACTIVE"
    error_id: "ERR_ACCOUNT_INACTIVE / ERR_BENEFICIARY_INACTIVE"
    http_status: 409
    applies_to: "POST /wire-ops/wires"

  - priority: 7
    category: business_safety
    check: "Wire creation: ordering customer status must be ACTIVE (FROZEN or CLOSED customers cannot initiate wires)"
    error_id: ERR_CUSTOMER_FROZEN
    http_status: 409
    applies_to: "POST /wire-ops/wires"

  - priority: 8
    category: business_temporal
    check: "Submit: the request's business_date must identify a BusinessDate in status OPEN (CUTOFF_PASSED or CLOSED rejects submission; an unknown date is ERR_NOT_FOUND at priority 3)"
    error_id: ERR_CUTOFF_PASSED
    http_status: 409
    applies_to: "POST /wire-ops/wires/{id}/submit"

  - priority: 9
    category: business_constraint
    check: "OCC: expected_wire_version must equal the wire's current version on approve/release/repair. Evaluated immediately after existence and request-schema checks and before state and business rules, so a stale client view is rejected with 412 even when a business gate would also fail"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /wire-ops/wires/{id}/approve | release | repair"

  - priority: 10
    category: state
    check: "Action endpoints: the resource must be in a state from which the transition is defined (generic fallback when no more specific error applies)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 11
    category: business_safety
    check: "Submit from CALLBACK_PENDING: callback_status must be VERIFIED or WAIVED"
    error_id: ERR_CALLBACK_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /wire-ops/wires/{id}/submit"

  - priority: 12
    category: business_safety
    check: "Segregation of duties: approver must not be the wire's initiated_by and must not already hold a non-superseded ApprovalRecord for the current repair round"
    error_id: ERR_SOD_APPROVER_MISMATCH
    http_status: 409
    applies_to: "POST /wire-ops/wires/{id}/approve"

  - priority: 13
    category: business_safety
    check: "Sanctions disposition: hit must be unresolved — OPEN (SanctionsScreener) or ESCALATED (ComplianceOfficer); a hit already RELEASED_FALSE_POSITIVE or CONFIRMED rejects"
    error_id: ERR_HIT_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /wire-ops/sanctions-hits/{id}/release | POST /wire-ops/sanctions-hits/{id}/confirm"

  - priority: 14
    category: business_safety
    check: "Release and fraud-hold placement: wire must carry no hold (hold_reason_code null); also gates cancel from APPROVED"
    error_id: ERR_WIRE_ON_HOLD
    http_status: 409
    applies_to: "POST /wire-ops/wires/{id}/release | POST /wire-ops/wires/{id}/fraud-holds | POST /wire-ops/wires/{id}/cancel"

  - priority: 15
    category: business_safety
    check: "Release: wire.screening_status must be CLEAR"
    error_id: ERR_SANCTIONS_NOT_CLEARED
    http_status: 409
    applies_to: "POST /wire-ops/wires/{id}/release"

  - priority: 16
    category: business_temporal
    check: "Release: the BusinessDate of the wire's value_date must be OPEN (CUTOFF_PASSED or CLOSED rejects)"
    error_id: ERR_CUTOFF_PASSED
    http_status: 409
    applies_to: "POST /wire-ops/wires/{id}/release"

  - priority: 17
    category: business_fiscal
    check: "Release: daily_limit_check must pass (available >= amount_cents)"
    error_id: ERR_DAILY_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /wire-ops/wires/{id}/release"

  - priority: 18
    category: business_temporal
    check: "Callback record: now must be strictly before expires_at"
    error_id: ERR_CALLBACK_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /wire-ops/callbacks/{id}/record"

  - priority: 19
    category: business_temporal
    check: "Fraud-hold customer confirmation: now must be strictly before expires_at; a lapsed window has already auto-resolved the hold"
    error_id: ERR_FRAUD_HOLD_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /wire-ops/fraud-holds/{id}/customer-confirm"

  - priority: 20
    category: business_temporal
    check: "Recall respond: now must be strictly before response_due_at"
    error_id: ERR_RECALL_EXPIRED
    http_status: 409
    applies_to: "POST /wire-ops/recalls/{id}/respond"

  - priority: 21
    category: business_referential
    check: "Recall lifecycle: respond/complete/decline require the matching prior state; acting on a terminal recall rejects"
    error_id: ERR_RECALL_ALREADY_RESOLVED
    http_status: 409
    applies_to: "POST /wire-ops/recalls/{id}/respond | complete | decline"

  - priority: 22
    category: business_referential
    check: "Recall completion requires beneficiary_bank_response = FUNDS_RETURNED"
    error_id: ERR_RECALL_NOT_RETURNED
    http_status: 409
    applies_to: "POST /wire-ops/recalls/{id}/complete"

  - priority: 23
    category: business_fiscal
    check: "Recall creation: amount_to_recall_cents must be > 0 and <= wire.amount_cents"
    error_id: ERR_RECALL_AMOUNT_EXCEEDS
    http_status: 422
    applies_to: "POST /wire-ops/recalls"

  - priority: 24
    category: business_constraint
    check: "Only one non-terminal recall per wire at a time"
    error_id: ERR_RECALL_IN_PROGRESS
    http_status: 409
    applies_to: "POST /wire-ops/recalls"

  - priority: 25
    category: business_constraint
    check: "Repair: wire.repair_attempts must be < 2"
    error_id: ERR_REPAIR_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /wire-ops/wires/{id}/repair"

  - priority: 26
    category: business_constraint
    check: "Tracer dispatch: investigation.tracer_count must be < max_tracers"
    error_id: ERR_TRACER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /wire-ops/investigations/{id}/tracers"

  - priority: 27
    category: business_temporal
    check: "BusinessDate cutoff: only an OPEN date can be cutoff-closed"
    error_id: ERR_CUTOFF_ALREADY_PASSED
    http_status: 409
    applies_to: "POST /wire-ops/business-dates/{id}/close-cutoff"

  - priority: 28
    category: business_referential
    check: "Customer close: no non-terminal wire on any of the customer's accounts; customer unfreeze: no OPEN FraudHold on the customer's wires"
    error_id: "ERR_CUSTOMER_NOT_SETTLED / ERR_CUSTOMER_STILL_FROZEN"
    http_status: 409
    applies_to: "POST /wire-ops/customers/{id}/close | unfreeze"

  - priority: 29
    category: business_referential
    check: "Account close: no non-terminal wire references the account and daily_reserved_cents = 0"
    error_id: ERR_ACCOUNT_NOT_SETTLED
    http_status: 409
    applies_to: "POST /wire-ops/accounts/{id}/close"

  - priority: 30
    category: business_referential
    check: "Beneficiary retire: no non-terminal wire references the beneficiary"
    error_id: ERR_BENEFICIARY_IN_USE
    http_status: 409
    applies_to: "POST /wire-ops/beneficiaries/{id}/retire"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving hooks ---
  - method: POST
    path: "/wire-ops/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO-8601 UTC). Default at startup is exactly 2026-08-01T00:00:00Z; the clock NEVER falls back to wall-clock time. All expiry windows and trailing-day windows evaluate against this clock."
    roles: [WireOpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  - method: POST
    path: "/wire-ops/_screening/simulate"
    description: "Test-driving endpoint: attach a deterministic party-match hit to a wire. If the wire has already been submitted, its screening_status is recomputed immediately (becomes REVIEW while the hit is unresolved)."
    roles: [SanctionsScreener]
    code: 201
    input: [wire_id, matched_list, matched_party, match_score]
    output: SanctionsHit
    side_effects:
      - "creates a SanctionsHit(status=OPEN) attached to the wire"
      - "if the wire has been submitted: screening_status -> REVIEW (and SANCTIONS_HOLD set when the wire is APPROVED with hold_reason_code null)"

  # --- customers ---
  - method: POST
    path: "/wire-ops/customers"
    description: "Register a customer"
    roles: [WireOpsAdmin]
    code: 201
    input: [legal_name, risk_rating, "high_risk_jurisdiction?"]
    output: Customer
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/wire-ops/customers/{id}"
    description: "Get a customer"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/wire-ops/customers"
    description: "List customers"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Customer[]"
    side_effects: []

  - method: POST
    path: "/wire-ops/customers/{id}/freeze"
    description: "Freeze a customer"
    roles: [WireOpsAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status -> FROZEN, frozen_at = now"]

  - method: POST
    path: "/wire-ops/customers/{id}/unfreeze"
    description: "Unfreeze a customer"
    roles: [WireOpsAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status -> ACTIVE if eligible (ERR_CUSTOMER_STILL_FROZEN otherwise), frozen_at = null"]

  - method: POST
    path: "/wire-ops/customers/{id}/close"
    description: "Close a customer"
    roles: [WireOpsAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["status -> CLOSED if settled (ERR_CUSTOMER_NOT_SETTLED otherwise)"]

  - method: GET
    path: "/wire-ops/customers/{id}/accounts"
    description: "List accounts of a customer"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: "Account[]"
    side_effects: []

  - method: GET
    path: "/wire-ops/customers/{id}/beneficiaries"
    description: "List beneficiaries registered by a customer"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: "Beneficiary[]"
    side_effects: []

  # --- accounts ---
  - method: POST
    path: "/wire-ops/accounts"
    description: "Open an account"
    roles: [WireOpsAdmin]
    code: 201
    input: [customer_id, account_number, "currency?", daily_outgoing_limit_cents]
    output: Account
    side_effects: ["status = ACTIVE; aggregates zeroed"]

  - method: GET
    path: "/wire-ops/accounts/{id}"
    description: "Get an account"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/wire-ops/accounts"
    description: "List accounts"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []

  - method: POST
    path: "/wire-ops/accounts/{id}/mark-dormant"
    description: "Mark an account dormant"
    roles: [WireOpsAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> DORMANT"]

  - method: POST
    path: "/wire-ops/accounts/{id}/close"
    description: "Close an account"
    roles: [WireOpsAdmin]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> CLOSED if settled (ERR_ACCOUNT_NOT_SETTLED otherwise)"]

  # --- beneficiaries ---
  - method: POST
    path: "/wire-ops/beneficiaries"
    description: "Register a beneficiary"
    roles: [WireOperator, WireOpsAdmin]
    code: 201
    input: [customer_id, name, bank_name, account_number, country_code]
    output: Beneficiary
    side_effects: ["status = ACTIVE; first_used_at = null"]

  - method: GET
    path: "/wire-ops/beneficiaries/{id}"
    description: "Get a beneficiary"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: GET
    path: "/wire-ops/beneficiaries"
    description: "List beneficiaries"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: ["customer_id?", "status?", "limit?", "offset?"]
    output: "Beneficiary[]"
    side_effects: []

  - method: POST
    path: "/wire-ops/beneficiaries/{id}/retire"
    description: "Retire a beneficiary"
    roles: [WireOperator, WireOpsAdmin]
    code: 200
    input: []
    output: Beneficiary
    side_effects: ["status -> RETIRED if not in use (ERR_BENEFICIARY_IN_USE otherwise)"]

  # --- business dates ---
  - method: POST
    path: "/wire-ops/business-dates"
    description: "Open a business date (ops day)"
    roles: [WireOpsAdmin]
    code: 201
    input: [business_date]
    output: BusinessDate
    side_effects: ["status = OPEN"]

  - method: GET
    path: "/wire-ops/business-dates/{id}"
    description: "Get a business date"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: BusinessDate
    side_effects: []

  - method: GET
    path: "/wire-ops/business-dates"
    description: "List business dates"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "BusinessDate[]"
    side_effects: []

  - method: POST
    path: "/wire-ops/business-dates/{id}/close-cutoff"
    description: "Close the wire cutoff for an OPEN business date"
    roles: [WireOpsAdmin]
    code: 200
    input: []
    output: BusinessDate
    side_effects: ["status -> CUTOFF_PASSED (ERR_CUTOFF_ALREADY_PASSED if not OPEN)"]

  - method: POST
    path: "/wire-ops/business-dates/{id}/close-day"
    description: "Close a business date after cutoff (end-of-day reconciliation: fails while any wire carries this value_date in a non-terminal status)"
    roles: [WireOpsAdmin]
    code: 200
    input: []
    output: BusinessDate
    side_effects: ["status -> CLOSED (ERR_INVALID_STATE when not CUTOFF_PASSED or when non-terminal wires remain)"]

  # --- wires ---
  - method: POST
    path: "/wire-ops/wires"
    description: "Initiate a wire transfer"
    roles: [WireOperator]
    code: 201
    input: [ordering_account_id, beneficiary_id, amount_cents, "currency?", method, "priority?", "charge_mode?", purpose]
    output: WireTransfer
    side_effects:
      - "status = INITIATED or CALLBACK_PENDING per calculations.callback_requirement"
      - "initiated_by = X-User-ID; if CALLBACK_PENDING, create CallbackVerification(OPEN, expires_at = now + 4h)"
      - "write AuditLogEntry(action=wire.initiate)"

  - method: GET
    path: "/wire-ops/wires/{id}"
    description: "Get a wire"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: WireTransfer
    side_effects: []

  - method: GET
    path: "/wire-ops/wires"
    description: "List wires"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: ["ordering_account_id?", "beneficiary_id?", "status?", "screening_status?", "value_date?", "limit?", "offset?"]
    output: "WireTransfer[]"
    side_effects: []

  - method: POST
    path: "/wire-ops/wires/{id}/submit"
    description: "Submit an initiated (or callback-cleared) wire into the approval pipeline"
    roles: [WireOperator]
    code: 200
    input: [business_date, "waive_callback?"]
    output: WireTransfer
    side_effects:
      - "status -> PENDING_APPROVAL (preconditions: priority 8 temporal, priority 11 callback)"
      - "waive_callback = true allowed only when ordering customer.risk_rating = LOW (else ERR_INVALID_REQUEST); waiver sets callback_status = WAIVED and is audit-logged"
      - "value_date assigned; reservation created (daily_reserved_cents += amount_cents)"
      - "screening runs; risk_score computed; increments WireTransfer.version by 1"

  - method: POST
    path: "/wire-ops/wires/{id}/approve"
    description: "Record one approval of the dual approval (first or second)"
    roles: [WireApprover]
    code: 200
    input: [expected_wire_version]
    output: WireTransfer
    side_effects:
      - "create ApprovalRecord for the current repair round; on the SECOND distinct non-initiator approval, status -> APPROVED"
      - "increments WireTransfer.version by 1"

  - method: POST
    path: "/wire-ops/wires/{id}/reject"
    description: "Reject a wire pending approval"
    roles: [WireApprover]
    code: 200
    input: [reason]
    output: WireTransfer
    side_effects: ["status -> REJECTED; reservation released (daily_reserved_cents -= amount_cents, reservation_active = false)"]

  - method: POST
    path: "/wire-ops/wires/{id}/release"
    description: "Release an approved, clear, unheld wire to the network; execution and fee finalization happen atomically in this call"
    roles: [WireOperator]
    code: 200
    input: [expected_wire_version]
    output: WireTransfer
    side_effects:
      - "status APPROVED -> RELEASING -> EXECUTED (ERR_DAILY_LIMIT_EXCEEDED aborts back to APPROVED with reservation intact)"
      - "daily_released_cents += amount_cents; DORMANT account reactivates; beneficiary.first_used_at set on first execution"
      - "FINAL FeeAssessment created; PROVISIONAL assessment and PROVISIONAL_ESTIMATE charges SUPERSEDED; fee_assessed_cents and net_principal_cents computed"
      - "increments WireTransfer.version by 1"

  - method: POST
    path: "/wire-ops/wires/{id}/cancel"
    description: "Cancel a wire in INITIATED, CALLBACK_PENDING, PENDING_APPROVAL, REPAIR, or unheld APPROVED"
    roles: [WireOperator]
    code: 200
    input: []
    output: WireTransfer
    side_effects: ["status -> CANCELLED; reservation released if active; OPEN callback case SUPERSEDED"]

  - method: POST
    path: "/wire-ops/wires/{id}/repair"
    description: "STP exception repair: correct wire fields, force re-screening and risk recompute"
    roles: [RepairSpecialist]
    code: 200
    input: [expected_wire_version, "beneficiary_id?", "amount_cents?", "method?", "purpose?"]
    output: WireTransfer
    side_effects:
      - "status PENDING_APPROVAL -> REPAIR; repair_attempts += 1 (cap 2: ERR_REPAIR_LIMIT_EXCEEDED)"
      - "if amount_cents changed: daily_reserved_cents re-based by the delta"
      - "screening re-runs; risk_score recomputed; increments WireTransfer.version by 1"

  - method: POST
    path: "/wire-ops/wires/{id}/resubmit"
    description: "Return a repaired wire to the approval pipeline; prior approvals are superseded"
    roles: [RepairSpecialist]
    code: 200
    input: []
    output: WireTransfer
    side_effects: ["status REPAIR -> PENDING_APPROVAL; prior ApprovalRecords superseded = true; first/second_approved_by reset"]

  - method: POST
    path: "/wire-ops/wires/{id}/fraud-holds"
    description: "Place a fraud hold on an APPROVED wire"
    roles: [FraudAnalyst]
    code: 201
    input: [reason_code, note]
    output: FraudHold
    side_effects: ["wire.hold_reason_code = FRAUD_HOLD; hold OPEN with expires_at = now + 24h"]

  # --- approvals ---
  - method: GET
    path: "/wire-ops/wires/{id}/approvals"
    description: "List approval records for a wire (current round and superseded), ordered by created_at ascending"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: "ApprovalRecord[]"
    side_effects: []

  # --- callbacks ---
  - method: GET
    path: "/wire-ops/wires/{id}/callbacks"
    description: "List callback verification cases for a wire"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: "CallbackVerification[]"
    side_effects: []

  - method: GET
    path: "/wire-ops/callbacks/{id}"
    description: "Get a callback verification case (lazy expiry evaluated)"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: CallbackVerification
    side_effects: ["if OPEN and now >= expires_at: -> EXPIRED and wire CANCELLED"]

  - method: POST
    path: "/wire-ops/callbacks/{id}/record"
    description: "Record the callback outcome"
    roles: [WireOperator]
    code: 200
    input: [outcome, contact_name, contact_phone]
    output: CallbackVerification
    side_effects:
      - "CONFIRMED: -> CONFIRMED; wire.callback_status = VERIFIED"
      - "DENIED: -> DENIED; wire CANCELLED, callback_status = NONE"
      - "UNREACHABLE: case stays OPEN (retries allowed) until the window lapses"

  # --- sanctions ---
  - method: GET
    path: "/wire-ops/wires/{id}/sanctions-hits"
    description: "List sanctions hits for a wire"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor, ComplianceOfficer]
    code: 200
    input: []
    output: "SanctionsHit[]"
    side_effects: []

  - method: GET
    path: "/wire-ops/sanctions-hits/{id}"
    description: "Get a sanctions hit"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor, ComplianceOfficer]
    code: 200
    input: []
    output: SanctionsHit
    side_effects: []

  - method: POST
    path: "/wire-ops/sanctions-hits/{id}/release"
    description: "Disposition a hit as false positive (SanctionsScreener for OPEN hits; ComplianceOfficer required when the hit is ESCALATED)"
    roles: [SanctionsScreener, ComplianceOfficer]
    code: 200
    input: [rationale]
    output: SanctionsHit
    side_effects: ["hit -> RELEASED_FALSE_POSITIVE; when wire's last unresolved hit: screening_status = CLEAR; SANCTIONS_HOLD cleared"]

  - method: POST
    path: "/wire-ops/sanctions-hits/{id}/confirm"
    description: "Disposition a hit as a true match (SanctionsScreener for OPEN hits; ComplianceOfficer required when ESCALATED)"
    roles: [SanctionsScreener, ComplianceOfficer]
    code: 200
    input: [rationale]
    output: SanctionsHit
    side_effects: ["hit -> CONFIRMED; wire REJECTED; reservation released; hold cleared"]

  - method: POST
    path: "/wire-ops/sanctions-hits/{id}/escalate"
    description: "Escalate an OPEN hit for compliance decision"
    roles: [SanctionsScreener]
    code: 200
    input: [rationale]
    output: SanctionsHit
    side_effects: ["hit -> ESCALATED"]

  # --- fraud holds ---
  - method: GET
    path: "/wire-ops/wires/{id}/fraud-holds"
    description: "List fraud holds for a wire"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: "FraudHold[]"
    side_effects: []

  - method: GET
    path: "/wire-ops/fraud-holds/{id}"
    description: "Get a fraud hold (lazy lapse evaluated)"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: FraudHold
    side_effects: ["if OPEN and now >= expires_at: -> CONFIRMED_FRAUD (AUTO_LAPSED); wire CANCELLED; customer FROZEN"]

  - method: POST
    path: "/wire-ops/fraud-holds/{id}/customer-confirm"
    description: "Record the customer confirmation outcome for a fraud hold"
    roles: [FraudAnalyst]
    code: 200
    input: [confirmation]
    output: FraudHold
    side_effects:
      - "confirmation = LEGITIMATE: hold CLEARED (CUSTOMER_CONFIRMED); wire hold cleared, stays APPROVED"
      - "confirmation = FRAUDULENT: hold CONFIRMED_FRAUD (CUSTOMER_DENIED); wire CANCELLED; customer FROZEN"

  # --- recalls ---
  - method: POST
    path: "/wire-ops/recalls"
    description: "Open a recall/return request against an EXECUTED wire"
    roles: [WireOperator]
    code: 201
    input: [wire_id, reason, amount_to_recall_cents]
    output: RecallRequest
    side_effects: ["status = REQUESTED (ERR_RECALL_IN_PROGRESS if a non-terminal recall exists for the wire)"]

  - method: GET
    path: "/wire-ops/recalls/{id}"
    description: "Get a recall (lazy expiry evaluated)"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor, BeneficiaryBank]
    code: 200
    input: []
    output: RecallRequest
    side_effects: ["if SENT_TO_BENEFICIARY_BANK and now >= response_due_at: -> EXPIRED"]

  - method: GET
    path: "/wire-ops/recalls"
    description: "List recalls"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor, BeneficiaryBank]
    code: 200
    input: ["wire_id?", "status?", "limit?", "offset?"]
    output: "RecallRequest[]"
    side_effects: []

  - method: POST
    path: "/wire-ops/recalls/{id}/send"
    description: "Dispatch the recall to the beneficiary bank"
    roles: [WireOperator]
    code: 200
    input: []
    output: RecallRequest
    side_effects: ["status -> SENT_TO_BENEFICIARY_BANK; response_due_at = now + 72h"]

  - method: POST
    path: "/wire-ops/recalls/{id}/respond"
    description: "Beneficiary bank records its answer"
    roles: [BeneficiaryBank]
    code: 200
    input: [response]
    output: RecallRequest
    side_effects: ["status -> BENEFICIARY_RESPONDED; beneficiary_bank_response per payload (FUNDS_RETURNED | FUNDS_DECLINED); responded_at = now"]

  - method: POST
    path: "/wire-ops/recalls/{id}/complete"
    description: "Complete a recall after funds returned; wire becomes RECALLED and recall compensation is booked"
    roles: [WireOperator]
    code: 200
    input: []
    output: RecallRequest
    side_effects:
      - "status -> COMPLETED; wire -> RECALLED"
      - "calculations.recall_compensation booked"

  - method: POST
    path: "/wire-ops/recalls/{id}/decline"
    description: "Originating bank accepts beneficiary bank's refusal"
    roles: [WireOperator]
    code: 200
    input: []
    output: RecallRequest
    side_effects: ["status -> DECLINED"]

  # --- fees & correspondent charges ---
  - method: POST
    path: "/wire-ops/wires/{id}/charges"
    description: "Post a correspondent charge against a wire"
    roles: [WireOperator, WireOpsAdmin]
    code: 201
    input: [correspondent_name, charge_type, amount_cents, source]
    output: CorrespondentCharge
    side_effects:
      - "status = POSTED"
      - "source = PROVISIONAL_ESTIMATE allowed only while wire.status in {INITIATED, CALLBACK_PENDING, PENDING_APPROVAL, REPAIR, APPROVED} (ERR_INVALID_STATE otherwise)"
      - "source = ACTUAL_ADVICE allowed only while wire.status in {PENDING_APPROVAL, REPAIR, APPROVED, EXECUTED, RECALLED} (ERR_INVALID_STATE otherwise)"

  - method: GET
    path: "/wire-ops/wires/{id}/charges"
    description: "List correspondent charges for a wire, ordered by created_at ascending"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: "CorrespondentCharge[]"
    side_effects: []

  - method: POST
    path: "/wire-ops/wires/{id}/fees/assess"
    description: "Run fee assessment on demand (PROVISIONAL pre-execution or FINAL re-run post-execution)"
    roles: [WireOperator, WireOpsAdmin]
    code: 201
    input: [kind]
    output: FeeAssessment
    side_effects:
      - "creates FeeAssessment(kind per request, status=OPEN) per calculations.fee_assessment using wire.charge_mode for the beneficiary-pays share"
      - "kind = PROVISIONAL requires wire.status in {INITIATED, CALLBACK_PENDING, PENDING_APPROVAL, REPAIR, APPROVED} (ERR_INVALID_STATE otherwise)"
      - "kind = FINAL requires wire.status in {EXECUTED, RECALLED} (ERR_INVALID_STATE otherwise)"

  - method: GET
    path: "/wire-ops/wires/{id}/fees"
    description: "List fee assessments for a wire, ordered by created_at ascending"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: "FeeAssessment[]"
    side_effects: []

  - method: GET
    path: "/wire-ops/fees/{id}"
    description: "Get a fee assessment"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: []

  - method: POST
    path: "/wire-ops/fees/{id}/bill"
    description: "Bill an OPEN fee assessment (wire must be EXECUTED or RECALLED)"
    roles: [WireOperator]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["status -> BILLED"]

  - method: POST
    path: "/wire-ops/fees/{id}/waive"
    description: "Waive an OPEN fee assessment"
    roles: [WireOpsAdmin]
    code: 200
    input: []
    output: FeeAssessment
    side_effects: ["status -> WAIVED"]

  # --- investigations & tracers ---
  - method: POST
    path: "/wire-ops/investigations"
    description: "Open an investigation (tracer, non-receipt, value dispute) on a wire"
    roles: [WireInvestigator]
    code: 201
    input: [wire_id, type, note]
    output: Investigation
    side_effects: ["status = OPEN; tracer_count = 0"]

  - method: GET
    path: "/wire-ops/investigations/{id}"
    description: "Get an investigation"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: Investigation
    side_effects: []

  - method: GET
    path: "/wire-ops/investigations"
    description: "List investigations"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: ["wire_id?", "status?", "limit?", "offset?"]
    output: "Investigation[]"
    side_effects: []

  - method: POST
    path: "/wire-ops/investigations/{id}/tracers"
    description: "Dispatch an outbound tracer message"
    roles: [WireInvestigator]
    code: 201
    input: [body]
    output: TracerMessage
    side_effects: ["investigation OPEN -> AWAITING_RESPONSE; tracer_count += 1 (ERR_TRACER_LIMIT_EXCEEDED at cap)"]

  - method: POST
    path: "/wire-ops/investigations/{id}/respond"
    description: "Register the counterparty's reply; investigation returns to OPEN"
    roles: [WireInvestigator]
    code: 200
    input: [body]
    output: TracerMessage
    side_effects: ["investigation AWAITING_RESPONSE -> OPEN; INBOUND TracerMessage recorded (no tracer_count increment)"]

  - method: POST
    path: "/wire-ops/investigations/{id}/resolve"
    description: "Resolve an open investigation"
    roles: [WireInvestigator]
    code: 200
    input: []
    output: Investigation
    side_effects: ["status -> RESOLVED"]

  - method: POST
    path: "/wire-ops/investigations/{id}/close"
    description: "Close an open or awaiting investigation without resolution"
    roles: [WireInvestigator]
    code: 200
    input: []
    output: Investigation
    side_effects: ["status -> CLOSED"]

  - method: GET
    path: "/wire-ops/investigations/{id}/tracers"
    description: "List tracer messages of an investigation, ordered by sequence_no ascending"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: "TracerMessage[]"
    side_effects: []

  # --- audit ---
  - method: GET
    path: "/wire-ops/audit-logs/{id}"
    description: "Get a single audit log entry"
    roles: [WireOpsAdmin, Auditor, ComplianceOfficer]
    code: 200
    input: []
    output: AuditLogEntry
    side_effects: []

  - method: GET
    path: "/wire-ops/audit-logs"
    description: "List audit log entries (append-only), ordered by created_at ascending"
    roles: [WireOpsAdmin, Auditor, ComplianceOfficer]
    code: 200
    input: ["wire_id?", "entity_type?", "limit?", "offset?"]
    output: "AuditLogEntry[]"
    side_effects: []

  # --- computed read ---
  - method: GET
    path: "/wire-ops/wires/{id}/summary"
    description: "Computed read: wire with its approval count (non-superseded records of the current round), open hits, open holds, recalls, open fees, and live reservation amount in one document"
    roles: [WireOpsAdmin, WireOperator, WireApprover, SanctionsScreener, FraudAnalyst, RepairSpecialist, WireInvestigator, Auditor]
    code: 200
    input: []
    output: { wire: WireTransfer, approvals: integer, open_hits: integer, open_holds: integer, recalls: integer, open_fees: integer, reserved_cents: integer }
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_AUTH, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role valid but not permitted for this endpoint or for the target's current disposition tier (SanctionsScreener dispositions only OPEN hits; ComplianceOfficer dispositions only ESCALATED hits; cross attempts are forbidden)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK reference does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, unknown key, bad type, enum out of domain, non-positive amount, or waive_callback on a non-LOW-risk customer" }
  - { id: ERR_BENEFICIARY_ACCOUNT_MISMATCH, http: 422, condition: "beneficiary.customer_id differs from the ordering account's customer_id" }
  - { id: ERR_ACCOUNT_INACTIVE, http: 409, condition: "Ordering account not ACTIVE at wire creation" }
  - { id: ERR_BENEFICIARY_INACTIVE, http: 409, condition: "Beneficiary not ACTIVE at wire creation" }
  - { id: ERR_CUSTOMER_FROZEN, http: 409, condition: "Ordering customer FROZEN or CLOSED blocks wire initiation" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a state from which the requested transition is defined" }
  - { id: ERR_CALLBACK_NOT_VERIFIED, http: 409, condition: "Submit attempted from CALLBACK_PENDING without VERIFIED or WAIVED callback status" }
  - { id: ERR_CALLBACK_WINDOW_EXPIRED, http: 409, condition: "Callback record attempted at or after expires_at (strict: now >= expires_at has already auto-expired the case)" }
  - { id: ERR_SOD_APPROVER_MISMATCH, http: 409, condition: "Approver is the wire's initiator, or already holds a non-superseded approval for the current repair round" }
  - { id: ERR_HIT_ALREADY_RESOLVED, http: 409, condition: "Sanctions disposition attempted on a hit already RELEASED_FALSE_POSITIVE or CONFIRMED" }
  - { id: ERR_WIRE_ON_HOLD, http: 409, condition: "Release, hold placement, or cancel-from-APPROVED attempted while hold_reason_code is set" }
  - { id: ERR_SANCTIONS_NOT_CLEARED, http: 409, condition: "Release attempted while screening_status is not CLEAR" }
  - { id: ERR_CUTOFF_PASSED, http: 409, condition: "Submit or release attempted against a business date that is CUTOFF_PASSED or CLOSED" }
  - { id: ERR_DAILY_LIMIT_EXCEEDED, http: 409, condition: "daily_limit_check failed: available < amount_cents at execution" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_wire_version does not match the wire's current version (OCC)" }
  - { id: ERR_RECALL_EXPIRED, http: 409, condition: "Beneficiary-bank respond attempted at or after response_due_at" }
  - { id: ERR_RECALL_ALREADY_RESOLVED, http: 409, condition: "Respond/complete/decline attempted on a recall in a terminal state" }
  - { id: ERR_RECALL_NOT_RETURNED, http: 409, condition: "Complete attempted while beneficiary_bank_response = FUNDS_DECLINED" }
  - { id: ERR_RECALL_AMOUNT_EXCEEDS, http: 422, condition: "amount_to_recall_cents <= 0 or > wire.amount_cents" }
  - { id: ERR_RECALL_IN_PROGRESS, http: 409, condition: "A non-terminal recall already exists for the wire" }
  - { id: ERR_REPAIR_LIMIT_EXCEEDED, http: 409, condition: "Third repair attempt (repair_attempts = 2)" }
  - { id: ERR_TRACER_LIMIT_EXCEEDED, http: 409, condition: "Fourth tracer dispatch (tracer_count = max_tracers = 3)" }
  - { id: ERR_FRAUD_HOLD_WINDOW_EXPIRED, http: 409, condition: "Customer confirmation attempted at or after the hold's expires_at (window already auto-lapsed)" }
  - { id: ERR_CUSTOMER_STILL_FROZEN, http: 409, condition: "Unfreeze attempted while an OPEN FraudHold exists on the customer's wires" }
  - { id: ERR_CUSTOMER_NOT_SETTLED, http: 409, condition: "Customer close attempted with non-terminal wires outstanding" }
  - { id: ERR_ACCOUNT_NOT_SETTLED, http: 409, condition: "Account close attempted with non-terminal wires or non-zero daily_reserved_cents" }
  - { id: ERR_BENEFICIARY_IN_USE, http: 409, condition: "Beneficiary retire attempted while non-terminal wires reference it" }
  - { id: ERR_CUTOFF_ALREADY_PASSED, http: 409, condition: "close-cutoff attempted on a business date not in OPEN" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: WireOpsAdmin
    description: "Wire room administrator: owns customers, accounts, business dates, fee waivers, the logical clock; superset read access"
    identity: opaque
    exclusive_operations:
      - "POST /wire-ops/_clock/set_current_utc"
      - "POST /wire-ops/customers | customers/{id}/freeze | unfreeze | close"
      - "POST /wire-ops/accounts | accounts/{id}/mark-dormant | close"
      - "POST /wire-ops/business-dates | close-cutoff | close-day"
      - "POST /wire-ops/fees/{id}/waive"
    shared_operations:
      - "POST /wire-ops/beneficiaries | beneficiaries/{id}/retire (with WireOperator)"
      - "POST /wire-ops/wires/{id}/charges | wires/{id}/fees/assess (with WireOperator)"
      - "all GET endpoints"

  - name: WireOperator
    description: "Wire room operator: initiates wires, records callbacks, submits, releases, cancels, opens and works recalls, posts charges, bills fees"
    identity: opaque
    exclusive_operations:
      - "POST /wire-ops/wires | wires/{id}/submit | release | cancel"
      - "POST /wire-ops/callbacks/{id}/record"
      - "POST /wire-ops/recalls | recalls/{id}/send | complete | decline"
      - "POST /wire-ops/fees/{id}/bill"
    shared_operations:
      - "POST /wire-ops/beneficiaries | beneficiaries/{id}/retire (with WireOpsAdmin)"
      - "POST /wire-ops/wires/{id}/charges | wires/{id}/fees/assess (with WireOpsAdmin)"
      - "all GET endpoints"

  - name: WireApprover
    description: "Approval officer: approves or rejects wires pending approval; cannot initiate, repair, or release"
    identity: opaque
    exclusive_operations:
      - "POST /wire-ops/wires/{id}/approve"
      - "POST /wire-ops/wires/{id}/reject"
    shared_operations:
      - "all GET endpoints"

  - name: SanctionsScreener
    description: "Sanctions analyst: reviews screening hits, releases false positives, confirms true matches, escalates; may disposition only OPEN hits"
    identity: opaque
    exclusive_operations:
      - "POST /wire-ops/sanctions-hits/{id}/release (hit OPEN)"
      - "POST /wire-ops/sanctions-hits/{id}/confirm (hit OPEN)"
      - "POST /wire-ops/sanctions-hits/{id}/escalate"
      - "POST /wire-ops/_screening/simulate"
    shared_operations:
      - "all GET endpoints"

  - name: ComplianceOfficer
    description: "Compliance officer: dispositions ESCALATED sanctions hits; audit read access"
    identity: opaque
    exclusive_operations:
      - "POST /wire-ops/sanctions-hits/{id}/release (hit ESCALATED)"
      - "POST /wire-ops/sanctions-hits/{id}/confirm (hit ESCALATED)"
      - "GET /wire-ops/audit-logs | audit-logs/{id} (with WireOpsAdmin, Auditor)"
    shared_operations:
      - "GET /wire-ops/sanctions-hits/{id} and wires/{id}/sanctions-hits"

  - name: FraudAnalyst
    description: "Fraud analyst: places fraud holds on approved wires and records customer confirmation outcomes"
    identity: opaque
    exclusive_operations:
      - "POST /wire-ops/wires/{id}/fraud-holds"
      - "POST /wire-ops/fraud-holds/{id}/customer-confirm"
    shared_operations:
      - "all GET endpoints"

  - name: RepairSpecialist
    description: "STP repair specialist: repairs wires in the approval pipeline and resubmits them; cannot approve or release"
    identity: opaque
    exclusive_operations:
      - "POST /wire-ops/wires/{id}/repair"
      - "POST /wire-ops/wires/{id}/resubmit"
    shared_operations:
      - "all GET endpoints"

  - name: WireInvestigator
    description: "Investigations officer: opens investigations, dispatches tracers, registers replies, resolves or closes"
    identity: opaque
    exclusive_operations:
      - "POST /wire-ops/investigations | investigations/{id}/tracers | respond | resolve | close"
    shared_operations:
      - "all GET endpoints"

  - name: BeneficiaryBank
    description: "External beneficiary bank counterparty: can only record recall responses; read access limited to recalls"
    identity: opaque
    exclusive_operations:
      - "POST /wire-ops/recalls/{id}/respond"
    shared_operations:
      - "GET /wire-ops/recalls/{id} | /wire-ops/recalls"

  - name: Auditor
    description: "Read-only auditor plus audit-log access"
    identity: opaque
    exclusive_operations:
      - "GET /wire-ops/audit-logs | audit-logs/{id} (with WireOpsAdmin, ComplianceOfficer)"
    shared_operations:
      - "all other GET endpoints"
