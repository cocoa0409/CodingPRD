              as: SystemAdmin
              captures: { opt_tower: $.data.id }
            - call: "POST /dealers"
              payload: { dealer_code: "D-100", name: "Coastal Marine", region: "SE", annual_allocation_quota: 5, floor_plan_limit_cents: 100000000, standing: "STANDARD" }
              as: AllocationManager
              captures: { dlr1: $.data.id }
            - call: "POST /production-runs"
              payload: { plant_line_code: "L1", season: "PEAK", build_week_start: "2026-08-03", build_week_end: "2026-08-10", option_change_cutoff_at: "2026-08-05T12:00:00Z" }
              as: ProductionPlanner
              captures: { run1: $.data.id }
            - call: "POST /build-slots"
              payload: { run_id: "${run1}", slot_code: "S1", capacity_hours: 200 }
              as: ProductionPlanner
              captures: { slot1: $.data.id }
            - call: "POST /dealer-orders"
              payload: { dealer_id: "${dlr1}", model_id: "${m_sp}", source: "RETAIL", deposit_paid_cents: 291748, option_package_ids: ["${opt_tower}"], slot_id: "${slot1}" }
              as: DealerPrincipal
              as_user_id: "${dlr1}"
              captures: { ord1: $.data.id }
            - call: "POST /dealer-orders/${ord1}/confirm"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dlr1}"
          trigger:
            - call: "POST /dealer-orders/${ord1}/confirm"
