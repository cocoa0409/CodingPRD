            - { call: "GET /jobs/${jb}", payload: {}, as: Customer, as_user_id: "${cust}", captures: { jv: "$.data.version" } }
            - { call: "POST /jobs/${jb}/book", payload: { quote_id: "${q}", expected_job_version: "${jv}" }, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /claims", payload: { job_id: "${jb}", damage_description: "big", claimed_amount_cents: 300000 }, as: Customer, as_user_id: "${cust}", captures: { cl: "$.data.id" } }
          trigger:
            - { call: "POST /claims/${cl}/approve", payload: {}, as: Admin, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Claim.${cl}.status == FILED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: quote_billable_hours_floor_boundary
        grounds:
          - calculations.job_charge
          - entities.RateCard.fields.min_billable_hours
          - entities.Quote.fields.base_labor_cents
        distinguishing_aspect: "billable_hours = max(estimated_hours, 2.0): at estimated_hours exactly 2.0 and below (1.5) the floor pins billable to 2.0 (base_labor 24000), while 2.5 uses the actual (30000); the max() floor is inclusive at 2.0."
        test_recipe:
          setup:
            - "RateCard MOVE (min_billable 2.0), Customer; three DRAFT jobs, crew 2, weekday, no truck/add-ons, with estimated_hours 2.0, 1.5, and 2.5."
          setup_api_calls:
            - { call: "POST /rate-cards", payload: { name: "RC-MOVE", job_type: "MOVE", base_hourly_rate_cents: 6000, min_billable_hours: 2.0, crew_surcharge_pct: 0.10, peak_surge_multiplier: 1.25, truck_fee_cents: 8000 }, as: Admin, captures: { rc: "$.data.id" } }
            - { call: "POST /insurance-policies", payload: { name: "IP-BASIC", tier: "BASIC", coverage_cap_cents: 200000, deductible_cents: 10000, coverage_pct: 1.0 }, as: Admin, captures: { pol: "$.data.id" } }
            - { call: "POST /customers", payload: { display_name: "Cust", email: "c@x.com" }, as: Admin, captures: { cust: "$.data.id" } }
