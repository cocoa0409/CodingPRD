              payload: { station_id: "${st_id}", production_lot_id: "${lot_id}", receiving_vessel_id: "${v_low}", mode: "LIQUID_TANKER", planned_kg: 100.000, window_start: "2026-08-02T08:00:00Z", window_end: "2026-08-02T12:00:00Z", departed_at: "2026-08-02T04:00:00Z" }
