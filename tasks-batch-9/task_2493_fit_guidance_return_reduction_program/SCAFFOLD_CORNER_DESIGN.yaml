  - section: errors
    instances:
      - name: unresolvable_path_ids_return_entity_specific_not_found_codes
        claim_type: triggerable
        grounds:
          - validations[priority=3]
          - errors[ERR_VENDOR_NOT_FOUND]
          - errors[ERR_CHART_NOT_FOUND]
          - errors[ERR_MAPPING_NOT_FOUND]
          - errors[ERR_CUSTOMER_PROFILE_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_ORDER_LINE_NOT_FOUND]
          - errors[ERR_RETURN_CASE_NOT_FOUND]
          - errors[ERR_FEEDBACK_NOT_FOUND]
          - errors[ERR_INTERVENTION_NOT_FOUND]
          - errors[ERR_DEPLOYMENT_NOT_FOUND]
        distinguishing_aspect: |
          Priority 3 resolves path ids per entity rather than emitting one generic 404, so ten
          reads against an empty database return ten distinct error_id values keyed to the entity
          named in the path segment - never a shared ERR_NOT_FOUND and never a 400.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z; database empty apart from the clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
          trigger:
            - call: "GET /fit-program/vendors/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: MerchOpsAdmin
              captures: { vendor_err: $.data.error_id }
            - call: "GET /fit-program/size-charts/00000000-0000-0000-0000-0000000000c2"
              payload: {}
              as: MerchOpsAdmin
              captures: { chart_err: $.data.error_id }
            - call: "GET /fit-program/size-chart-mappings/00000000-0000-0000-0000-0000000000d3"
              payload: {}
              as: MerchOpsAdmin
              captures: { mapping_err: $.data.error_id }
            - call: "GET /fit-program/customer-profiles/00000000-0000-0000-0000-0000000000e4"
              payload: {}
              as: MerchOpsAdmin
              captures: { profile_err: $.data.error_id }
            - call: "GET /fit-program/return-policies/00000000-0000-0000-0000-0000000000f5"
              payload: {}
              as: MerchOpsAdmin
              captures: { policy_err: $.data.error_id }
            - call: "GET /fit-program/order-lines/00000000-0000-0000-0000-0000000000b6"
              payload: {}
              as: MerchOpsAdmin
              captures: { line_err: $.data.error_id }
            - call: "GET /fit-program/return-cases/00000000-0000-0000-0000-0000000000a7"
              payload: {}
              as: MerchOpsAdmin
              captures: { case_err: $.data.error_id }
            - call: "GET /fit-program/fit-feedback/00000000-0000-0000-0000-0000000000c8"
              payload: {}
              as: MerchOpsAdmin
              captures: { feedback_err: $.data.error_id }
            - call: "GET /fit-program/interventions/00000000-0000-0000-0000-0000000000d9"
              payload: {}
              as: MerchOpsAdmin
              captures: { intervention_err: $.data.error_id }
            - call: "GET /fit-program/intervention-deployments/00000000-0000-0000-0000-0000000000ea"
              payload: {}
              as: MerchOpsAdmin
              captures: { deployment_err: $.data.error_id }
          assert:
            - "${vendor_err} == \"ERR_VENDOR_NOT_FOUND\""
            - "${chart_err} == \"ERR_CHART_NOT_FOUND\""
            - "${mapping_err} == \"ERR_MAPPING_NOT_FOUND\""
            - "${profile_err} == \"ERR_CUSTOMER_PROFILE_NOT_FOUND\""
            - "${policy_err} == \"ERR_POLICY_NOT_FOUND\""
            - "${line_err} == \"ERR_ORDER_LINE_NOT_FOUND\""
            - "${case_err} == \"ERR_RETURN_CASE_NOT_FOUND\""
            - "${feedback_err} == \"ERR_FEEDBACK_NOT_FOUND\""
            - "${intervention_err} == \"ERR_INTERVENTION_NOT_FOUND\""
            - "${deployment_err} == \"ERR_DEPLOYMENT_NOT_FOUND\""
            - "http_status == 404"

      - name: mapping_creation_without_a_verified_specification_returns_spec_not_verified
        claim_type: triggerable
        grounds:
          - validations[priority=19]
          - errors[ERR_SPEC_NOT_VERIFIED]
          - calculations.mapping_coverage
        distinguishing_aspect: |
          The specification is SUBMITTED, not VERIFIED, so priority 19 fires with 409
          ERR_SPEC_NOT_VERIFIED before coverage can be computed at all - even though the chart is
          STANDARDIZED, the expected_item_version is current and both pairs name labels that do
          exist in the stored size_points.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item whose only specification is SUBMITTED, plus a STANDARDIZED 2-row TOPS chart."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/measurement-specs"
              payload: { item_id: "${item_id}", size_system: "US_ALPHA", base_size_label: "S", fabric_stretch_class: "RIGID", size_points: [{ size_label: "S", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }, { size_label: "M", sort_index: 1, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }], grade_rules: [{ measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }] }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /fit-program/measurement-specs/${spec_id}/submit"
              payload: {}
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { spec_status: $.data.status }
            - call: "POST /fit-program/size-charts"
              payload: { chart_code: "STD-TOPS-E2", size_system: "US_ALPHA", category_code: "TOPS", rows: [{ size_label: "S", sort_index: 0, body_chest_min_mm: 820, body_chest_max_mm: 859, body_waist_min_mm: 740, body_waist_max_mm: 779, conversion_us_alpha: "S", conversion_us_numeric: "2", conversion_eu: "34", conversion_uk: "6" }, { size_label: "M", sort_index: 1, body_chest_min_mm: 860, body_chest_max_mm: 899, body_waist_min_mm: 780, body_waist_max_mm: 819, conversion_us_alpha: "M", conversion_us_numeric: "4", conversion_eu: "36", conversion_uk: "8" }] }
              as: MerchOpsAdmin
              captures: { chart_id: $.data.id }
            - call: "POST /fit-program/size-charts/${chart_id}/standardize"
              payload: {}
              as: MerchOpsAdmin
              captures: { chart_status: $.data.status }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { item_ver: $.data.version }
          trigger:
            - call: "POST /fit-program/size-chart-mappings"
              payload: { item_id: "${item_id}", chart_id: "${chart_id}", expected_item_version: "${item_ver}", size_label_pairs: [{ spec_size_label: "S", chart_size_label: "S" }, { spec_size_label: "M", chart_size_label: "M" }] }
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { err_id: $.data.error_id }
          assert:
            - "${spec_status} == \"SUBMITTED\""
            - "${chart_status} == \"STANDARDIZED\""
            - "${item_ver} == 2"
            - "${err_id} == \"ERR_SPEC_NOT_VERIFIED\""
            - "http_status == 409"
            - "count(SizeChartMapping where item_id == ${item_id}) == 0"
            - "CatalogItem.${item_id}.fit_readiness == \"UNVERIFIED\""
            - "CatalogItem.${item_id}.version == 2"

      - name: fit_recommendation_on_an_unpublished_item_returns_guidance_not_ready
        claim_type: triggerable
        grounds:
          - validations[priority=30]
          - errors[ERR_GUIDANCE_NOT_READY]
          - endpoints[GET /fit-program/catalog-items/{id}/fit-recommendation]
        distinguishing_aspect: |
          The recommendation read is gated on fit_readiness == GUIDANCE_READY, so an item that is
          LISTED and perfectly sellable still refuses to serve guidance with 409
          ERR_GUIDANCE_NOT_READY while its fit_readiness is UNVERIFIED - the failure is a 409 on a
          GET, not a 404 or an empty 200 payload.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item and no specification, chart or mapping at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
              captures: { listing: $.data.listing_status, readiness: $.data.fit_readiness }
          trigger:
            - call: "GET /fit-program/catalog-items/${item_id}/fit-recommendation"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { err_id: $.data.error_id }
          assert:
            - "${listing} == \"LISTED\""
            - "${readiness} == \"UNVERIFIED\""
            - "${err_id} == \"ERR_GUIDANCE_NOT_READY\""
            - "http_status == 409"

      - name: retracting_feedback_twice_returns_already_retracted
        claim_type: triggerable
        grounds:
          - validations[priority=27]
          - errors[ERR_FEEDBACK_ALREADY_RETRACTED]
          - endpoints[POST /fit-program/fit-feedback/{id}/retract]
        distinguishing_aspect: |
          The first retract is accepted and drains the item's signal pool from 100 to 0; the
          second retract of the same row returns 409 ERR_FEEDBACK_ALREADY_RETRACTED instead of
          being idempotent, so fit_signal_weight_total is never driven negative to -100.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; one non-purchasing shopper with one ACTIVE fit feedback row of weight 100."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-e4@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/fit-feedback"
              payload: { item_id: "${item_id}", customer_profile_id: "${customer_id}", purchased_size_label: "M", fit_verdict: "TOO_LARGE" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { feedback_id: $.data.id, weight: $.data.signal_weight, offset: $.data.verdict_offset_centi }
          trigger:
            - call: "POST /fit-program/fit-feedback/${feedback_id}/retract"
              payload: { retract_reason: "AUTHOR_WITHDRAWN" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { first_status: $.data.status }
            - call: "GET /fit-program/catalog-items/${item_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { pool_after: $.data.fit_signal_weight_total, count_after: $.data.active_fit_feedback_count }
            - call: "POST /fit-program/fit-feedback/${feedback_id}/retract"
              payload: { retract_reason: "AUTHOR_WITHDRAWN" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${weight} == 100"
            - "${offset} == -100"
            - "${first_status} == \"RETRACTED\""
            - "${pool_after} == 0"
            - "${count_after} == 0"
            - "${err_id} == \"ERR_FEEDBACK_ALREADY_RETRACTED\""
            - "http_status == 409"
            - "FitFeedback.${feedback_id}.status == \"RETRACTED\""
            - "FitFeedback.${feedback_id}.retract_reason == \"AUTHOR_WITHDRAWN\""
            - "CatalogItem.${item_id}.fit_signal_weight_total == 0"

      - name: resubmit_beyond_the_correction_budget_returns_budget_exhausted
        claim_type: triggerable
        grounds:
          - validations[priority=31]
          - errors[ERR_VENDOR_CORRECTION_BUDGET_EXHAUSTED]
          - calculations.vendor_reliability_score
          - state_machines.MeasurementSpec.status.SUBMITTED_to_CORRECTION_REQUESTED
        distinguishing_aspect: |
          The CORRECTION_REQUESTED debit is applied even when it overshoots the allowance, so one
          failed verification takes a vendor with a 2000-cent budget to correction_spend_cents
          2500; the next resubmit is then refused 402
          ERR_VENDOR_CORRECTION_BUDGET_EXHAUSTED. The vendor is only PROBATION - the demotion
          comes from spend > budget rather than from reliability_score_bp, which is still 9700 and
          far above VENDOR_SUSPEND_BP - so this is a fiscal refusal, not a suspension.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with correction_budget_cents 2000 (below one CORRECTION_COST_CENTS of 2500)."
            - "One DRAFT TOPS item with an out-of-tolerance specification already verified once, so the specification sits in CORRECTION_REQUESTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 2000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/measurement-specs"
              payload: { item_id: "${item_id}", size_system: "US_ALPHA", base_size_label: "S", fabric_stretch_class: "RIGID", size_points: [{ size_label: "S", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }, { size_label: "M", sort_index: 1, chest_mm: 940, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }], grade_rules: [{ measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }] }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /fit-program/measurement-specs/${spec_id}/submit"
              payload: {}
              as: VendorUser
              as_user_id: "${vendor_id}"
            - call: "POST /fit-program/measurement-specs/${spec_id}/verify"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { spec_status: $.data.status, violations: $.data.violation_count }
            - call: "GET /fit-program/vendors/${vendor_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { spend: $.data.correction_spend_cents, reliability: $.data.reliability_score_bp, vendor_status: $.data.status }
          trigger:
            - call: "POST /fit-program/measurement-specs/${spec_id}/resubmit"
              payload: { size_points: [{ size_label: "S", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }, { size_label: "M", sort_index: 1, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }] }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "${spec_status} == \"CORRECTION_REQUESTED\""
            - "${violations} == 1"
            - "${spend} == 2500"
            - "${reliability} == 9700"
            - "${vendor_status} == \"PROBATION\""
            - "${err_id} == \"ERR_VENDOR_CORRECTION_BUDGET_EXHAUSTED\""
            - "http_status == 402"
            - "MeasurementSpec.${spec_id}.status == \"CORRECTION_REQUESTED\""
            - "MeasurementSpec.${spec_id}.revision_round == 0"
            - "MeasurementSpec.${spec_id}.correction_reason == \"GRADE_TOLERANCE_VIOLATION\""
            - "Vendor.${vendor_id}.correction_round_count == 1"

      - name: delisted_item_write_returns_item_delisted
        claim_type: triggerable
        grounds:
          - validations[priority=9]
          - errors[ERR_ITEM_DELISTED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / delisted_item_outranks_vendor_budget_exhausted_on_resubmit
          rationale: "That instance already triggers ERR_ITEM_DELISTED on a resubmit against a DELISTED item and asserts the 409 body, so a standalone trigger for this code would repeat it."

      - name: blocked_customer_case_creation_returns_customer_return_blocked
        claim_type: triggerable
        grounds:
          - validations[priority=13]
          - errors[ERR_CUSTOMER_RETURN_BLOCKED]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / blocked_customer_outranks_closed_return_window
          rationale: "That instance drives a shopper to BLOCKED through the rate rule and then triggers ERR_CUSTOMER_RETURN_BLOCKED on a fresh return-case creation."

      - name: mapping_against_a_draft_chart_returns_chart_not_standardized
        claim_type: triggerable
        grounds:
          - validations[priority=20]
          - errors[ERR_CHART_NOT_STANDARDIZED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mapping_creation_requires_standardized_chart
          rationale: "That instance triggers ERR_CHART_NOT_STANDARDIZED on a DRAFT chart and then standardizes the same chart to show the identical request succeed."

      - name: publish_guidance_below_the_coverage_floor_returns_coverage_insufficient
        claim_type: triggerable
        grounds:
          - validations[priority=28]
          - errors[ERR_MAPPING_COVERAGE_INSUFFICIENT]
        excluded_because:
          difficulty_instance: boundary_precision_check / coverage_exactly_at_minimum_publishes_guidance
          rationale: "That instance sits one pair below MIN_COVERAGE_BP to trigger ERR_MAPPING_COVERAGE_INSUFFICIENT and then exactly at 8000 to pass, which covers both sides of the floor."

      - name: overlapping_customer_override_returns_policy_window_overlap
        claim_type: triggerable
        grounds:
          - validations[priority=23]
          - errors[ERR_POLICY_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / policy_override_closed_interval_adjacency_rejected
          rationale: "That instance triggers ERR_POLICY_WINDOW_OVERLAP on the touching-endpoint case, which is the hardest form of the same check."

      - name: overlapping_deployment_window_returns_deployment_window_overlap
        claim_type: triggerable
        grounds:
          - validations[priority=24]
          - errors[ERR_DEPLOYMENT_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / deployment_half_open_window_adjacency_admitted
          rationale: "That instance admits the touching half-open window and then triggers ERR_DEPLOYMENT_WINDOW_OVERLAP with a window that genuinely intersects."

  - section: rbac
    instances:
      - name: merch_ops_admin_cannot_verify_a_specification_returns_unauthorized
        claim_type: unauthorized_operation
        grounds:
          - rbac.roles.FitAnalyst.exclusive_operations
          - rbac.roles.MerchOpsAdmin
          - validations[priority=2]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          Verification is a FitAnalyst exclusive operation, and MerchOpsAdmin - the role that owns
          catalogue and chart administration - is not a superuser: its verify attempt returns 403
          ERR_UNAUTHORIZED and leaves the specification SUBMITTED, while the same call by a
          FitAnalyst verifies it.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one DRAFT TOPS item whose clean specification is SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/measurement-specs"
              payload: { item_id: "${item_id}", size_system: "US_ALPHA", base_size_label: "S", fabric_stretch_class: "RIGID", size_points: [{ size_label: "S", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }, { size_label: "M", sort_index: 1, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }], grade_rules: [{ measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }] }
              as: VendorUser
              as_user_id: "${vendor_id}"
              captures: { spec_id: $.data.id }
            - call: "POST /fit-program/measurement-specs/${spec_id}/submit"
              payload: {}
              as: VendorUser
              as_user_id: "${vendor_id}"
          trigger:
            - call: "POST /fit-program/measurement-specs/${spec_id}/verify"
              payload: {}
              as: MerchOpsAdmin
              captures: { err_id: $.data.error_id }
            - call: "GET /fit-program/measurement-specs/${spec_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { status_after_denial: $.data.status, verified_by: $.data.verified_by_user_id }
            - call: "POST /fit-program/measurement-specs/${spec_id}/verify"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { status_after_analyst: $.data.status, violations: $.data.violation_count }
          assert:
            - "${err_id} == \"ERR_UNAUTHORIZED\""
            - "http_status == 403"
            - "${status_after_denial} == \"SUBMITTED\""
            - "${verified_by} == null"
            - "${status_after_analyst} == \"VERIFIED\""
            - "${violations} == 0"
            - "MeasurementSpec.${spec_id}.verified_by_user_id == \"analyst-7\""
            - "MeasurementSpec.${spec_id}.verified_at == \"2026-06-01T00:00:00Z\""

      - name: vendor_user_cannot_file_a_specification_for_another_vendors_item
        claim_type: exclusive_operations
        grounds:
          - rbac.roles.VendorUser.entity_backed
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          VendorUser holds the specification-write operation, but the role check alone is not
          enough: priority 4 compares X-User-ID against the item's vendor_id, so the SOUT vendor's
          request against a NRTH item is refused 403 ERR_NOT_RESOURCE_OWNER while the byte-identical
          body sent by the owning vendor is accepted 201. The failure is ownership, not role, and
          it is a 403 rather than the 404 an item-scoping bug would produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Two vendors, NRTH and SOUT; one DRAFT TOPS item owned by NRTH."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { owner_vendor_id: $.data.id }
            - call: "POST /fit-program/vendors"
              payload: { name: "Southport Knitwear", brand_code: "SOUT", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { other_vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${owner_vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
          trigger:
            - call: "POST /fit-program/measurement-specs"
              payload: { item_id: "${item_id}", size_system: "US_ALPHA", base_size_label: "S", fabric_stretch_class: "RIGID", size_points: [{ size_label: "S", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }, { size_label: "M", sort_index: 1, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }], grade_rules: [{ measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }] }
              as: VendorUser
              as_user_id: "${other_vendor_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /fit-program/measurement-specs"
              payload: { item_id: "${item_id}", size_system: "US_ALPHA", base_size_label: "S", fabric_stretch_class: "RIGID", size_points: [{ size_label: "S", sort_index: 0, chest_mm: 840, waist_mm: 760, hip_mm: 880, inseam_mm: 710 }, { size_label: "M", sort_index: 1, chest_mm: 880, waist_mm: 800, hip_mm: 920, inseam_mm: 720 }] , grade_rules: [{ measurement_point: "CHEST", increment_mm: 40, tolerance_pct_bp: 1250, tolerance_abs_mm: 3 }] }
              as: VendorUser
              as_user_id: "${owner_vendor_id}"
              captures: { spec_id: $.data.id, spec_status: $.data.status, spec_round: $.data.revision_round }
          assert:
            - "${err_id} == \"ERR_NOT_RESOURCE_OWNER\""
            - "http_status == 403"
            - "${spec_status} == \"DRAFT\""
            - "${spec_round} == 0"
            - "count(MeasurementSpec where item_id == ${item_id}) == 1"
            - "MeasurementSpec.${spec_id}.item_id == ${item_id}"

      - name: customer_cannot_open_a_return_case_on_another_shoppers_order_line
        claim_type: unauthorized_operation
        grounds:
          - rbac.roles.Customer.entity_backed
          - validations[priority=4]
          - errors[ERR_NOT_RESOURCE_OWNER]
        distinguishing_aspect: |
          The Customer role is entity-backed on OrderLine.customer_profile_id, so shopper B
          quoting shopper A's order_line_id is refused 403 ERR_NOT_RESOURCE_OWNER even though
          shopper B holds a legitimate Customer header and the line is inside its return window;
          the owner's identical request then succeeds, and only one case exists on the line.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; TOPS 30-day default policy; two shoppers, A (owner of one delivered line) and B (no lines)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-a@example.com" }
              as: MerchOpsAdmin
              captures: { customer_a_id: $.data.id }
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-b@example.com" }
              as: MerchOpsAdmin
              captures: { customer_b_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_a_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "FIT_TOO_LARGE" }
              as: Customer
              as_user_id: "${customer_b_id}"
              captures: { err_id: $.data.error_id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "FIT_TOO_LARGE" }
              as: Customer
              as_user_id: "${customer_a_id}"
              captures: { case_id: $.data.id, case_status: $.data.status }
          assert:
            - "${err_id} == \"ERR_NOT_RESOURCE_OWNER\""
            - "http_status == 403"
            - "${case_status} == \"TRIAGE\""
            - "count(ReturnCase where order_line_id == ${line_id}) == 1"
            - "ReturnCase.${case_id}.effective_policy_id == ${policy_id}"
            - "CustomerProfile.${customer_b_id}.return_case_count == 0"
            - "CustomerProfile.${customer_a_id}.return_case_count == 1"

      - name: the_classifying_auditor_cannot_resolve_the_same_case
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=12]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - complexity_profile.role_model
          - state_machines.ReturnCase.status.FIT_REVIEW_to_RESOLVED_REFUNDED
        distinguishing_aspect: |
          Segregation is keyed on X-User-ID, not on role: auditor-1 holds exactly the right role
          for resolve and is still refused 403 ERR_SEGREGATION_OF_DUTIES because it is the
          classified_by_user_id, while auditor-2 - same role, different operator - resolves the
          case. No refund or cost posting is written by the refused attempt.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; TOPS 30-day default policy; one shopper with one delivered line whose case was classified FIT_TOO_SMALL by auditor-1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-r4@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "FIT_TOO_SMALL" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_id: $.data.id }
            - call: "POST /fit-program/return-cases/${case_id}/classify"
              payload: { reason_code: "FIT_TOO_SMALL", evidence_note: "photo shows chest pulling" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
              captures: { classified_status: $.data.status, classifier: $.data.classified_by_user_id }
          trigger:
            - call: "POST /fit-program/return-cases/${case_id}/resolve"
              payload: { item_condition: "RESELLABLE_A" }
              as: ReturnsAuditor
              as_user_id: "auditor-1"
              captures: { err_id: $.data.error_id }
            - call: "GET /fit-program/return-cases/${case_id}/cost-postings"
              payload: {}
              as: ReturnsAuditor
              as_user_id: "auditor-1"
              captures: { postings_after_denial: $.total_count }
            - call: "POST /fit-program/return-cases/${case_id}/resolve"
              payload: { item_condition: "RESELLABLE_A" }
              as: ReturnsAuditor
              as_user_id: "auditor-2"
              captures: { resolved_status: $.data.status, refund: $.data.refund_amount_cents, total_cost: $.data.total_cost_cents, resolver: $.data.resolved_by_user_id }
          assert:
            - "${classified_status} == \"FIT_REVIEW\""
            - "${classifier} == \"auditor-1\""
            - "${err_id} == \"ERR_SEGREGATION_OF_DUTIES\""
            - "http_status == 403"
            - "${postings_after_denial} == 0"
            - "${resolved_status} == \"RESOLVED_REFUNDED\""
            - "${refund} == 2295"
            - "${total_cost} == 1454"
            - "${resolver} == \"auditor-2\""
            - "ReturnCase.${case_id}.classified_by_user_id == \"auditor-1\""
            - "OrderLine.${line_id}.status == \"RETURNED\""
            - "CatalogItem.${item_id}.fit_return_count == 1"

      - name: return_case_read_is_shared_by_auditor_and_admin_but_fit_analyst_returns_unauthorized
        claim_type: shared_operations
        grounds:
          - rbac.roles.ReturnsAuditor.shared_operations
          - rbac.roles.MerchOpsAdmin.shared_operations
          - rbac.roles.FitAnalyst
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: |
          GET /fit-program/return-cases/{id} is shared by ReturnsAuditor and MerchOpsAdmin and is
          deliberately closed to FitAnalyst: the same id read by the two authorised roles returns
          the same TRIAGE row, while FitAnalyst - who may read the item and its charts - gets 403
          ERR_UNAUTHORIZED on the case. Return-reason detail is not part of the fit-analysis
          surface.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T00:00:00Z."
            - "Vendor NRTH with one LISTED TOPS item; TOPS 30-day default policy; one shopper with one delivered line and one case in TRIAGE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: MerchOpsAdmin
            - call: "POST /fit-program/vendors"
              payload: { name: "Northwind Apparel", brand_code: "NRTH", correction_budget_cents: 250000 }
              as: MerchOpsAdmin
              captures: { vendor_id: $.data.id }
            - call: "POST /fit-program/catalog-items"
              payload: { vendor_id: "${vendor_id}", sku: "NRTH-TEE-01", category_code: "TOPS", brand_size_system: "US_ALPHA", unit_price_cents: 2295 }
              as: MerchOpsAdmin
              captures: { item_id: $.data.id }
            - call: "POST /fit-program/catalog-items/${item_id}/list"
              payload: {}
              as: MerchOpsAdmin
            - call: "POST /fit-program/customer-profiles"
              payload: { email: "shopper-r5@example.com" }
              as: MerchOpsAdmin
              captures: { customer_id: $.data.id }
            - call: "POST /fit-program/return-policies"
              payload: { category_code: "TOPS", window_days: 30, restocking_applies: true, non_refundable_shipping: false, effective_from: "2026-01-01T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /fit-program/order-lines"
              payload: { customer_profile_id: "${customer_id}", item_id: "${item_id}", size_label: "M", quantity: 1, unit_price_cents: 2295, shipping_allocated_cents: 0, delivered_at: "2026-05-20T00:00:00Z" }
              as: MerchOpsAdmin
              captures: { line_id: $.data.id }
            - call: "POST /fit-program/return-cases"
              payload: { order_line_id: "${line_id}", requested_reason_code: "EXPECTATION_MISMATCH" }
              as: Customer
              as_user_id: "${customer_id}"
              captures: { case_id: $.data.id }
          trigger:
            - call: "GET /fit-program/return-cases/${case_id}"
              payload: {}
              as: ReturnsAuditor
              as_user_id: "auditor-1"
              captures: { auditor_status: $.data.status, auditor_reason: $.data.requested_reason_code }
            - call: "GET /fit-program/return-cases/${case_id}"
              payload: {}
              as: MerchOpsAdmin
              captures: { admin_status: $.data.status, admin_reason: $.data.requested_reason_code }
            - call: "GET /fit-program/return-cases/${case_id}"
              payload: {}
              as: FitAnalyst
              as_user_id: "analyst-7"
              captures: { err_id: $.data.error_id }
          assert:
            - "${auditor_status} == \"TRIAGE\""
            - "${admin_status} == \"TRIAGE\""
            - "${auditor_reason} == \"EXPECTATION_MISMATCH\""
            - "${admin_reason} == \"EXPECTATION_MISMATCH\""
            - "${err_id} == \"ERR_UNAUTHORIZED\""
            - "http_status == 403"
            - "ReturnCase.${case_id}.status == \"TRIAGE\""

  - section: cross_cutting_complexity_layers
