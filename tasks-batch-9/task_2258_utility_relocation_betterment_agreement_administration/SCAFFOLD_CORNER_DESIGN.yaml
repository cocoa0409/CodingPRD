      - name: corner_execution_state_rule_outranks_the_fiscal_rule
        claim_type: Priority Ordering
        grounds: ["validations[priority=9]", "validations[priority=29]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / state_priority_nine_beats_fiscal_priority_twentynine_on_agreement_execute"
          rationale: "That instance builds an agreement that is simultaneously in the wrong execution state and over the authority and asserts ERR_AGREEMENT_NOT_EXECUTABLE, then cures the state defect to reveal ERR_AUTHORITY_EXCEEDED, which is precisely the priority-conflict claim for this pair."

      - name: corner_temporal_window_rule_outranks_the_trench_capacity_rule
        claim_type: Priority Ordering
        grounds: ["validations[priority=22]", "validations[priority=25]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / temporal_priority_twentytwo_beats_constraint_priority_twentyfive_on_commitment_create"
          rationale: "That instance submits one commitment that both falls outside the construction period and targets a full joint trench slot, asserts ERR_WINDOW_OUTSIDE_CONSTRUCTION, then pulls the window back inside the period to expose ERR_TRENCH_SLOT_AT_CAPACITY, covering both the priority conflict and the temporal-versus-aggregate interaction."

      - name: corner_cross_entity_hold_state_gates_execution
        claim_type: Violation → Error
        grounds: ["validations[priority=15]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / agreement_execute_depends_on_utility_owner_reimbursement_hold"
          rationale: "That instance tests both directions of the cross-entity rule - execution blocked while the owner carries a reimbursement hold and permitted after release-hold clears it - which is the cross-entity validation claim for priority 15."

      - name: corner_facility_window_overlap_is_detected_across_commitments
        claim_type: Violation → Error
        grounds: ["validations[priority=23]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / facility_occupancy_windows_excluded_by_a_three_day_mobilization_buffer"
          rationale: "That instance walks two commitments on the same facility across the mobilisation buffer boundary, asserting the accepted gap and the rejected one, which covers the temporal-validation claim for priority 23 better than a single-point test would."

