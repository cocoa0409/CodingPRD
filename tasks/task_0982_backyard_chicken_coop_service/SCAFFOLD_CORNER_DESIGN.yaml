      - name: seasonal_window_day_overlap_rejected
        claim_type: violation_to_error
        grounds: [calculations.seasonal_surcharge_lookup, "errors[ERR_SEASONAL_WINDOW_OVERLAP]", "validations[priority=10]"]
        distinguishing_aspect: "Window overlap is wrap-aware at day granularity: a new RURAL window 01-01 -> 01-31 collides with the existing wrap window 11-15 -> 02-15 because January days are already covered."
        test_recipe:
          setup: ["RURAL wrap window WINTER_PEAK 11-15 -> 02-15 exists"]
