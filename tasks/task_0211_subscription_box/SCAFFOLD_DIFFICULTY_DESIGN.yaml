              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "CI1P", name: "CI1 P", on_hand_qty: 7 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "ci1@x.com", full_name: "CI1 S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id }
            - call: "POST /subscriptions/${s_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { box_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 10 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${s_id}", wave_id: "${wave_id}", box_selection_id: "${box_id}", expected_wave_version: "${wave_ver}" }
              as: CurationAdmin
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /allocations/${alloc_id}/release"
              payload: {}
              as: CurationAdmin
              captures: { astatus: $.data.status }
          assert:
            - "Allocation.${alloc_id}.status == RELEASED"
            - "Product.${p_id}.on_hand_qty == 7 (conserved, equal to pre-reserve)"
            - "Product.${p_id}.allocated_qty == 0 (returned to pre-reserve value)"

      - name: money_conserved_across_prepay_then_cancel_refund
        grounds:
          - state_machines.Subscription.ACTIVE_to_CANCELLED
          - calculations.cancellation_refund
          - calculations.wallet_balance
          - entities.Subscriber.fields.wallet_balance_cents
        distinguishing_aspect: |
          Conserved quantity = money (a DIFFERENT type than inventory units): for a prepaid term that
          is fully refunded before any box ships, the charged amount equals the credited refund —
          pinned formula: WalletEntry(REFUND_CREDIT).amount_cents == prepaid_total_paid_cents == 32400,
          so wallet_balance_cents lands at exactly the prepaid total with zero drift.
        test_recipe:
          setup:
            - "Subscriber prepaid 6 periods @6000 with 0.10 discount (total 32400, billing PREPAID), no boxes shipped, then cancels immediately."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "CI2", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1, prepaid_terms_offered: [6], prepaid_discount_pct: 0.10 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "ci2@x.com", full_name: "CI2 S" }
              as: Subscriber
              captures: { sub_acct_id: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${sub_acct_id}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { s_id: $.data.id, s_ver: $.data.version }
            - call: "POST /subscriptions/${s_id}/prepay"
              payload: { term_periods: 6, expected_subscription_version: "${s_ver}" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
          trigger:
            - call: "POST /subscriptions/${s_id}/cancel"
              payload: { effective: "IMMEDIATE" }
              as: Subscriber
              as_user_id: "${sub_acct_id}"
              captures: { life: $.data.lifecycle_status }
          assert:
            - "the created WalletEntry has kind == REFUND_CREDIT and amount_cents == 32400"
            - "Subscriber.${sub_acct_id}.wallet_balance_cents == 32400 (no drift)"
            - "the created Invoice has kind == CANCEL_REFUND and gross_amount_cents == -32400"
