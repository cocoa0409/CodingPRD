          - calculations.rig_occupation_conflict
          - validations[priority=67]
          - errors.ERR_RIG_WINDOW_CONFLICT
          - entities.ApplicationRig.fields.cleanout_buffer_minutes
          - entities.ApplicationTest.fields.window_start
        distinguishing_aspect: |
          A different resource (ApplicationRig) with different interval semantics:
          CLOSED windows [window_start, window_end] inflated by the rig's cleanout
          buffer on BOTH sides, and EXCLUSIVE occupancy (capacity 1, no aggregation).
          With a 30 minute buffer against an incumbent ending at 10:00, a candidate
          starting at 10:30 has gap == buffer and is REJECTED, while 10:31 has gap
