              payload: { full_name: "L14", email: "l14@x.com", phone: "555", mailing_address: "14 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "140 Reef", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id", prop_v: "$.data.version" }
            - call: "POST /rental-licenses"
              payload: { property_id: "${prop_id}", term_years: 1, expected_property_version: "${prop_v}" }
              as: Registrar
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "POST /rental-licenses/${lic_id}/pay"
              payload: { amount_cents: 30000 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "pay returns HTTP 409 with error_id ERR_NO_PASSED_INSPECTION (no PASSED PERIODIC inspection exists)"
            - "RentalLicense.${lic_id}.status == PENDING_PAYMENT (unchanged)"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspector_double_booking_halfopen_overlap
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_INSPECTOR_DOUBLE_BOOKED]"
          - entities.Inspection.fields.scheduled_date
          - entities.Inspection.fields.duration_minutes
        distinguishing_aspect: "Two inspections on the SAME inspector but different properties whose [scheduled_date, scheduled_date+duration) half-open intervals overlap ([09:00,10:00) vs [09:30,10:30)) are rejected; interval semantics = half-open, no buffer (back-to-back adjacency would be allowed). Resource = Inspector."
        test_recipe:
          setup:
            - "One inspector holding a SCHEDULED inspection on property A at 09:00 for 60 minutes."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L15", email: "l15@x.com", phone: "555", mailing_address: "15 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I15", badge_number: "B15", email: "i15@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "150 A", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_a: "$.data.id" }
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "151 B", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_b: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_a}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z", duration_minutes: 60 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins1: "$.data.id" }
          trigger:
            - call: "POST /inspections"
              payload: { property_id: "${prop_b}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:30:00Z", duration_minutes: 60 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "scheduling returns HTTP 409 with error_id ERR_INSPECTOR_DOUBLE_BOOKED (intervals [09:00,10:00) and [09:30,10:30) overlap)"

      - name: property_inspection_cooldown_buffer
        grounds:
          - "validations[priority=14]"
          - "errors[ERR_INSPECTION_COOLDOWN]"
          - entities.Inspection.fields.scheduled_date
        distinguishing_aspect: "Two inspections on the SAME property within a 24h buffer are rejected even when they do NOT overlap and use different inspectors (09:00 vs 19:00, 10h apart); interval semantics = closed proximity buffer (24h between scheduled_dates), distinct from the half-open no-buffer inspector rule. Resource = Property."
        test_recipe:
          setup:
            - "A property holding a SCHEDULED inspection at 09:00 with inspector 1."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L16", email: "l16@x.com", phone: "555", mailing_address: "16 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I16a", badge_number: "B16a", email: "i16a@x.com" }
              as: Registrar
              captures: { insp1: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I16b", badge_number: "B16b", email: "i16b@x.com" }
              as: Registrar
              captures: { insp2: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "160 C", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp1}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z", duration_minutes: 60 }
              as: Inspector
              as_user_id: "${insp1}"
              captures: { ins1: "$.data.id" }
          trigger:
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp2}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T19:00:00Z", duration_minutes: 60 }
              as: Inspector
              as_user_id: "${insp2}"
              captures: { err: "$.data.error_id" }
          assert:
            - "scheduling returns HTTP 409 with error_id ERR_INSPECTION_COOLDOWN (second inspection is 10h from the first, within the 24h property buffer; different inspector so no double-booking)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fee_ledger_conserved_on_pay_then_refund
        grounds:
          - entities.Property.fields.total_fees_paid_cents
          - state_machines.RentalLicense.PENDING_PAYMENT_to_ACTIVE
          - state_machines.RentalLicense.ACTIVE_to_PENDING_PAYMENT
        distinguishing_aspect: "Conserved quantity = money ledger: pay(+30000) then refund(-30000) leaves Property.total_fees_paid_cents at its pre-pay value 0, pinned as total_fees_paid_cents == sum of currently-paid license fees."
        test_recipe:
          setup:
            - "A property with a PASSED periodic inspection and a PENDING_PAYMENT license (fee 30000); ledger starts at 0."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L17", email: "l17@x.com", phone: "555", mailing_address: "17 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I17", badge_number: "B17", email: "i17@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "170 D", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins_id: "$.data.id" }
            - call: "POST /inspections/${ins_id}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/checklist-items"
              payload: { category: "HABITABILITY", code: "HEAT", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins_id}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { prop_v: "$.data.version", ledger0: "$.data.total_fees_paid_cents" }
            - call: "POST /rental-licenses"
              payload: { property_id: "${prop_id}", term_years: 1, expected_property_version: "${prop_v}" }
              as: Registrar
              captures: { lic_id: "$.data.id" }
          trigger:
            - call: "POST /rental-licenses/${lic_id}/pay"
              payload: { amount_cents: 30000 }
              as: Landlord
              as_user_id: "${ll_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { ledger_paid: "$.data.total_fees_paid_cents" }
            - call: "POST /rental-licenses/${lic_id}/refund"
              payload: {}
              as: Registrar
              captures: { lic_status: "$.data.status" }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { ledger_refunded: "$.data.total_fees_paid_cents" }
          assert:
            - "ledger0 == 0 (before pay)"
            - "ledger_paid == 30000 (after pay)"
            - "ledger_refunded == 0 (after refund; pay+refund conserves the money ledger)"
            - "RentalLicense.${lic_id}.status == PENDING_PAYMENT (after refund)"

      - name: open_violation_count_conserved_on_issue_then_resolve
        grounds:
          - entities.Property.fields.open_violation_count
          - state_machines.Inspection.IN_PROGRESS_to_FAILED
          - state_machines.Violation.REMEDIATION_SUBMITTED_to_VERIFIED_RESOLVED
        distinguishing_aspect: "Conserved quantity = violation count: a FAILED inspection issues one Violation (open_violation_count 0->1), and a reinspection that passes its code resolves it (1->0), returning the count to its pre-issue value; distinct conserved quantity from the money ledger."
        test_recipe:
          setup:
            - "A property; a FAILED periodic inspection recording only HABITABILITY/PLUMBING FAIL MAJOR (LIFE_SAFETY omitted forces a synthetic-CRITICAL final FAIL) issues exactly one MAJOR violation; the landlord then submits remediation."
          setup_api_calls:
            - call: "POST /landlords"
              payload: { full_name: "L18", email: "l18@x.com", phone: "555", mailing_address: "18 A St" }
              as: Registrar
              captures: { ll_id: "$.data.id" }
            - call: "POST /inspectors"
              payload: { full_name: "I18", badge_number: "B18", email: "i18@x.com" }
              as: Registrar
              captures: { insp_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Registrar
            - call: "POST /properties"
              payload: { landlord_id: "${ll_id}", street_address: "180 E", unit_count: 3, year_built: 1980 }
              as: Landlord
              as_user_id: "${ll_id}"
              captures: { prop_id: "$.data.id" }
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { count0: "$.data.open_violation_count" }
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "PERIODIC", scheduled_date: "2026-06-01T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins1: "$.data.id" }
            - call: "POST /inspections/${ins1}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins1}/checklist-items"
              payload: { category: "HABITABILITY", code: "PLUMBING", result: "FAIL", severity: "MAJOR" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins1}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { count1: "$.data.open_violation_count" }
            - call: "GET /violations?inspection_id=${ins1}"
              payload: {}
              as: Registrar
              captures: { v0: "$.data[0].id" }
            - call: "POST /violations/${v0}/submit-remediation"
              payload: { remediation_notes: "repaired" }
              as: Landlord
              as_user_id: "${ll_id}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T09:00:00Z" }
              as: Registrar
            - call: "POST /inspections"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", inspection_type: "REINSPECTION", prior_inspection_id: "${ins1}", scheduled_date: "2026-06-03T09:00:00Z" }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { ins2: "$.data.id" }
            - call: "POST /inspections/${ins2}/begin"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins2}/checklist-items"
              payload: { category: "LIFE_SAFETY", code: "SMOKE_DETECTOR", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins2}/checklist-items"
              payload: { category: "HABITABILITY", code: "PLUMBING", result: "PASS" }
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "POST /inspections/${ins2}/complete"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
            - call: "GET /properties/${prop_id}"
              payload: {}
              as: Registrar
              captures: { count2: "$.data.open_violation_count" }
            - call: "GET /violations/${v0}"
              payload: {}
              as: Registrar
              captures: { v0_status: "$.data.status" }
          assert:
            - "count0 == 0 (before the violation is issued)"
            - "count1 == 1 (after the FAILED inspection issues the violation)"
            - "count2 == 0 (after the reinspection resolves it; issue+resolve conserves the count)"
            - "Violation.${v0}.status == VERIFIED_RESOLVED"

