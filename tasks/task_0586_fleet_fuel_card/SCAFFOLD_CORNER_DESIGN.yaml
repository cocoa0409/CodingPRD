              payload: { card_id: "${card_id}", vehicle_id: "${veh2_id}", driver_id: "${drv_id}", effective_from: "2026-06-02T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_CARD_VERSION"

      - name: version_increments_on_activate
        claim_type: optimistic_concurrency
        grounds: [entities.FuelCard.fields.version, "endpoints.POST./fuel-cards/{id}/activate"]
        distinguishing_aspect: "A freshly issued card has version 1; after activate the version is 2 (increments by one per mutation)."
        test_recipe:
          setup: ["One fleet account."]
          setup_api_calls:
            - call: "POST /fleet-accounts"
              payload: { company_name: "Ver Co", base_jurisdiction: "CA", credit_limit_cents: 500000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "1001", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000, per_txn_gallon_limit: 100 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
          trigger:
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
          assert:
            - "FuelCard.${card_id}.version == 2"
            - "FuelCard.${card_id}.status == ACTIVE"

      - name: card_suspend_voids_open_transactions_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.FuelCard.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / fraud_confirm_cascades_card_txn_ledger_depth3
          rationale: "Card-suspend voiding open transactions and reversing the ledger is asserted end-to-end by that §1.8 cascade instance."

  # -------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: authorization_hold_visible_immediately
        claim_type: immediate
        grounds: [calculations.credit_ledger, entities.FleetAccount.fields.available_credit_cents]
        distinguishing_aspect: "Immediately after authorize, GET /fleet-accounts/{id} shows available_credit reduced by the hold (1000000 -> 996000 for a 4000 charge) in the same request cycle."
        test_recipe:
          setup: ["Fleet credit_limit 1000000, vehicle, active card+assignment; one 10-gal @400 authorization (gross 4000)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Imm Co", base_jurisdiction: "CA", credit_limit_cents: 1000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VT", tank_capacity_gallons: 5000, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Fay", pin: "3030" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "1002", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 10, unit_price_cents: 400, odometer: 10, jurisdiction: "CA" }
              as: Merchant
          trigger:
            - call: "GET /fleet-accounts/${fa_id}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "FleetAccount.${fa_id}.outstanding_holds_cents == 4000"
            - "FleetAccount.${fa_id}.available_credit_cents == 996000"
