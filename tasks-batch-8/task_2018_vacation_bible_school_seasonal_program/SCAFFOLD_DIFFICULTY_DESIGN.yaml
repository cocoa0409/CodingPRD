          Category pair business_safety (P5) vs state (P6): the check-in request
          violates BOTH (child has special needs with only a SUBMITTED plan; the
          program day is still SCHEDULED). Safety outranks state, so the error
          MUST be ERR_ACCOMMODATION_NOT_APPROVED, not ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Program Alpha IN_SESSION with day 2026-08-17 still SCHEDULED (never opened)"
            - "Koalas staffed ADEQUATE; special-needs child k1 ENROLLED; his FOOD_ALLERGY plan is SUBMITTED but never APPROVED"
            - "Logical clock at 2026-08-17T08:30:00Z so only the safety and day-state checks can fail"
