              as: PlatformAdmin
              captures: { rack1_id: $.data.id }
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-5501" }
              as: PosAssociate
              captures: { cardA_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 9000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardA_id}", pos_terminal_id: "T-55", packaging_seal_intact: true }
              as: PosAssociate
              captures: { irA_id: $.data.id }
            - call: "POST /issuance-requests/${irA_id}/screen"
              payload: {}
              as: PosAssociate
            - call: "POST /gift-cards"
              payload: { store_id: "${store1_id}", rack_id: "${rack1_id}", card_number_masked: "****-****-****-5502" }
              as: PosAssociate
              captures: { cardB_id: $.data.id }
            - call: "POST /issuance-requests"
              payload: { channel: "PHYSICAL", face_value_cents: 9000, store_id: "${store1_id}", rack_id: "${rack1_id}", card_id: "${cardB_id}", pos_terminal_id: "T-55", packaging_seal_intact: true }
              as: PosAssociate
              captures: { irB_id: $.data.id }
            - call: "POST /issuance-requests/${irB_id}/screen"
              payload: {}
              as: PosAssociate
          trigger:
            - call: "POST /draining-alerts"
              payload: { card_id: "${cardA_id}", detection_basis: "MANUAL_REVIEW", note: "first report" }
              as: FraudAnalyst
              as_user_id: "analyst-55"
              captures: { alertA_id: $.data.id }
            - call: "GET /stores/${store1_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-55"
              captures: { floor_1: $.data.floor_posture, count_1: $.data.open_alert_count }
            - call: "POST /draining-alerts"
              payload: { card_id: "${cardB_id}", detection_basis: "MANUAL_REVIEW", note: "second report" }
              as: FraudAnalyst
              as_user_id: "analyst-55"
              captures: { alertB_id: $.data.id }
            - call: "GET /stores/${store1_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-55"
              captures: { floor_2: $.data.floor_posture, count_2: $.data.open_alert_count }
            - call: "POST /draining-alerts/${alertB_id}/triage"
              payload: { triage_note: "no draining pattern", redemption_pattern_reviewed: true }
              as: FraudAnalyst
              as_user_id: "analyst-55"
              captures: { stB: $.data.state }
            - call: "GET /stores/${store1_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-55"
              captures: { floor_3: $.data.floor_posture, count_3: $.data.open_alert_count }
            - call: "POST /draining-alerts/${alertB_id}/resolve"
              payload: { resolution: "DISMISS", resolution_note: "legitimate spending" }
              as: RiskManager
              as_user_id: "risk-55"
              captures: { stB2: $.data.state }
            - call: "GET /stores/${store1_id}"
              payload: {}
              as: RiskManager
              as_user_id: "risk-55"
              captures: { floor_4: $.data.floor_posture, count_4: $.data.open_alert_count }
          assert:
            - "${count_1} == 1 and ${floor_1} == OPEN — threshold - 1 does not heighten"
            - "${count_2} == 2 and ${floor_2} == HEIGHTENED — exactly at floor_heightened_alert_threshold"
            - "${stB} == TRIAGED"
            - "${count_3} == 2 and ${floor_3} == HEIGHTENED — TRIAGED still counts toward open_alert_count"
            - "${stB2} == DISMISSED"
            - "${count_4} == 1 and ${floor_4} == OPEN — a DISMISSED alert stops counting immediately"
