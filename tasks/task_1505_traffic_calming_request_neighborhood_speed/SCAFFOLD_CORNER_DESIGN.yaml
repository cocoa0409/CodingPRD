        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A call with neither X-User-Role nor X-User-ID fails priority 1 with ERR_UNAUTHENTICATED (401) before any role or existence check runs."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/requests"
              payload: {}
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED (401); no resource data is returned"

      - name: rbac_role_denied_matrix
        claim_type: violation_to_error
        grounds:
          - "validations[priority=2]"
          - "errors[ERR_FORBIDDEN]"
          - "roles"
        distinguishing_aspect: "Exclusive operations reject other roles with ERR_FORBIDDEN (403): Resident cannot create cycles, TrafficEngineer cannot create segments, CityEngineer cannot open petitions."
        test_recipe:
          setup: ["one segment, one resident, one SUBMITTED request"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CityAdmin }
