  - rule_id: cross_entity_state_dependency
    instances:
      - name: authorization_activation_depends_on_license_expansion_gate
        grounds:
          - validations[priority=74]
          - errors[ERR_EXPANSION_GATE_BLOCKED]
          - entities.StateLicense.fields.expansion_gate
          - entities.StateLicense.fields.reporting_status
          - state_machines.DelegateAuthorization.PENDING_OVERSIGHT_to_ACTIVE
        distinguishing_aspect: |
          Entity pair (DelegateAuthorization -> StateLicense): the authorization is itself in a valid
          PENDING_OVERSIGHT state with a passing oversight score, yet activation is refused purely
          because the OTHER entity's expansion_gate is BLOCKED by its reporting dimension; the same
          call succeeds unchanged once the license's reporting_status returns to CURRENT.
        test_recipe:
          setup:
            - "Jurisdiction CA (QUARTERLY); licensee with one ACTIVE CA license and no obligations."
            - "Delegate with oversight_score 85 and a PENDING_OVERSIGHT authorization on that license."
            - "A late 2026Q1 call report has driven reporting_status to DELINQUENT and expansion_gate to BLOCKED."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { state_code: "CA", name: "California DFPI", min_net_worth_cents: 50000000, base_bond_cents: 5000000, per_delegate_bond_cents: 100000, bond_cap_cents: 40000000, response_window_days: 15, renewal_fee_cents: 500000, assessment_rate_bps: 25, call_report_frequency: "QUARTERLY", participates_in_multistate: true }
