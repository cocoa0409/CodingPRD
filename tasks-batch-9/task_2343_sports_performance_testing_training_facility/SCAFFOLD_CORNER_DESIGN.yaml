      - name: parallel_state_dimensions_move_independently
        claim_type: parallel
        excluded_because:
          difficulty_instance: athlete_membership_and_clearance_dimensions_evolve_independently
          rationale: "The declared state_machine_shape is parallel because Athlete carries two orthogonal dimensions (membership_status and training_clearance) and GroupSession carries session_status plus staffing_status. The cited §1.8 instance drives both Athlete dimensions through four combined states and asserts each independently."

      - name: cyclic_loop_termination_condition_respected
        claim_type: cyclic
        excluded_because:
          difficulty_instance: rts_plan_cycles_back_to_stage_active_by_fail_then_by_pass
          rationale: "The only looping machine is ReturnToSportPlan (STAGE_ACTIVE -> STAGE_TESTING -> STAGE_ACTIVE by fail and by pass). The cited §1.8 instance traverses both re-entry edges and asserts the RTS_MAX_STAGE_ATTEMPTS 2 termination condition that aborts the plan."

      - name: guarded_transition_requires_other_entity_state
        claim_type: guarded transitions
        excluded_because:
          difficulty_instance: rts_stage_pass_blocked_until_clearance_document_reaches_signed
          rationale: "Guarded transitions are exactly the cross-entity preconditions on stage-decision (needs a SIGNED ClearanceDocument) and lock-roster (needs staffing_status STAFFED). Both are driven by the cited instance and by roster_lock_blocked_until_staffing_recovers_from_staff_credential_state in §1.8."

      - name: cross_entity_side_effect_adjusts_counterpart
        claim_type: Cross-entity
        excluded_because:
          difficulty_instance: credential_review_lapse_cascades_five_hops_to_cleared_station_numbers
          rationale: "The credential-review lapse is the deepest cross-entity side effect in the scaffold (Certification -> StaffMember -> GroupSession.assigned_staff -> staffing_status -> session_status -> Enrollment.station_number); the cited §1.8 instance asserts every hop's field values."

      - name: ledger_sync_on_state_change
        claim_type: Ledger sync
        excluded_because:
          difficulty_instance: package_credit_ledger_conserved_across_reserve_deplete_refund_and_consume
          rationale: "Ledger synchronisation appears as MembershipPackage's four counters and TeamContract's slot/money counters. The cited §1.8 instance reconciles the package ledger against sessions_purchased at every transition."

      - name: compensating_undo_reverses_all_side_effects
        claim_type: Compensation
        excluded_because:
          difficulty_instance: contract_slot_and_money_ledger_reversed_from_snapshots_on_void_completion
          rationale: "The only compensating transition is void-completion (COMPLETED -> IN_PROGRESS). The cited §1.8 instance asserts that the contract slot counters, billed_amount_cents, rate_tier_applied and every ATTENDED -> RESERVED reversal return to their pre-completion values with no drift."

