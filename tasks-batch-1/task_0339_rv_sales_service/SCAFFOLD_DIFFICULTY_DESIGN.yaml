  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: ltv_band_boundary_exact_max_passes
        grounds:
          - calculations.monthly_payment
          - validations[priority=11]
          - errors[ERR_LTV_EXCEEDED]
          - entities.Deal.fields.amount_financed_cents
        distinguishing_aspect: |
          Numeric threshold boundary on the LTV metric reached via finance-decision: with
          credit_tier STANDARD (MAX_LTV 12000bps) and P/list = exactly 12000bps the approval
          passes (<=), proving the boundary is inclusive at the max rather than strict.
        test_recipe:
          setup:
            - "STANDARD customer; list_price 6000000; financed P chosen so LTV == 12000bps exactly; finance requested"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "LTV RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Kit Buyer", email: "kit@x.com", credit_tier: "STANDARD" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-LTV-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 6000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7200000, expected_unit_version: "${unit_v}", down_payment_cents: 0, term_months: 60 }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/quote"
              payload: {}
              as: SalesAgent
            - call: "POST /deals/${deal}/request-finance"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /deals/${deal}/finance-decision"
              payload: { decision: "APPROVE" }
              as: DealerManager
              captures: { fs: $.data.finance_status }
          assert:
            - "Deal.${deal}.amount_financed_cents == 7200000 (no tax/doc, no down)"
            - "ltv_bps == 12000 exactly (7200000*10000/6000000) and finance_status == APPROVED (boundary inclusive)"

      - name: storage_zero_overlap_adjacent_intervals_allowed
        grounds:
          - validations[priority=9]
          - errors[ERR_STORAGE_OVERLAP]
          - state_machines.StorageSlot
          - entities.StorageSlot.fields.end_utc
        distinguishing_aspect: |
          Empty/zero-gap boundary on a different metric (interval adjacency, not a numeric
          band) and a different endpoint (POST /storage-slots): two slots for the same unit
          where slot B.start_utc == slot A.end_utc are accepted because intervals are
          half-open [start,end), so a zero-length gap is not an overlap.
        test_recipe:
          setup:
            - "Unit with storage slot A [2026-06-01,2026-06-05); book slot B [2026-06-05,2026-06-10) for same unit"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Storage RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Lee Owner", email: "lee@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-ST-1", model_year: 2022, class_type: "FIFTH_WHEEL", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v0: $.data.version }
            - call: "POST /storage-slots"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", daily_rate_cents: 5000, start_utc: "2026-06-01T00:00:00.000Z", end_utc: "2026-06-05T00:00:00.000Z", expected_unit_version: "${unit_v0}" }
              as: ServiceAdvisor
              captures: { slotA: $.data.id }
            - call: "GET /units/${unit}"
              payload: {}
              as: ServiceAdvisor
              captures: { unit_v1: $.data.version }
          trigger:
            - call: "POST /storage-slots"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", daily_rate_cents: 5000, start_utc: "2026-06-05T00:00:00.000Z", end_utc: "2026-06-10T00:00:00.000Z", expected_unit_version: "${unit_v1}" }
              as: ServiceAdvisor
              captures: { slotB: $.data.id }
          assert:
            - "slot B created with status == BOOKED (adjacent boundary 06-05 not an overlap)"
            - "two non-cancelled StorageSlots now exist for Unit.${unit}"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: deliver_requires_unit_not_stop_sale_recalled
        grounds:
          - state_machines.Deal.sale_status=WALKTHROUGH_to_sale_status=DELIVERED
          - entities.Unit.fields.open_recall_count
          - errors[ERR_STOP_SALE_RECALL_OPEN]
        distinguishing_aspect: |
          Deal->Unit dependency: Deal's WALKTHROUGH->DELIVERED transition is gated by the
          referenced Unit's recall posture (open STOP_SALE RecallRemedy not CLEARED). The deal
          cannot advance based on a sibling Unit entity's state.
        test_recipe:
          setup:
            - "A deal driven to WALKTHROUGH (pdi passed); then unit becomes targeted by an OPEN STOP_SALE recall"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "XEnt RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Mia Buyer", email: "mia@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-XE-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v}" }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/quote"
              payload: {}
              as: SalesAgent
            - call: "POST /deals/${deal}/start-pdi"
              payload: {}
              as: SalesAgent
            - call: "POST /pdi-inspections"
              payload: { dealership_id: "${did}", deal_id: "${deal}", defects_found: 0 }
              as: ServiceAdvisor
            - call: "POST /recall-campaigns"
              payload: { dealership_id: "${did}", campaign_code: "RC-XE-1", target_class_type: "CLASS_C", target_model_year: 2024, severity: "STOP_SALE" }
              as: DealerManager
          trigger:
            - call: "POST /deals/${deal}/deliver"
              payload: {}
              as: DealerManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STOP_SALE_RECALL_OPEN"
            - "Unit.${unit}.open_recall_count == 1 and status == HELD (not SOLD)"

      - name: start_pdi_requires_finance_settled
        grounds:
          - state_machines.Deal.sale_status=QUOTED_to_sale_status=PDI_PENDING
          - entities.Deal.fields.finance_status
          - errors[ERR_FINANCE_NOT_SETTLED]
        distinguishing_aspect: |
          A different entity pair / dependency: the Deal's sale axis (QUOTED->PDI_PENDING)
          depends on the SAME Deal's finance axis being settled (CASH or APPROVED). With
          finance_status REQUESTED (not settled), start-pdi is rejected — sale dimension gated
          by the parallel finance dimension's state.
        test_recipe:
          setup:
            - "Quoted deal with finance REQUESTED (term supplied) but not yet decided"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Settle RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Ned Buyer", email: "ned@x.com", credit_tier: "STANDARD" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-SE-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 6000000, expected_unit_version: "${unit_v}", down_payment_cents: 0, term_months: 72 }
              as: SalesAgent
              captures: { deal: $.data.id }
            - call: "POST /deals/${deal}/quote"
              payload: {}
              as: SalesAgent
            - call: "POST /deals/${deal}/request-finance"
              payload: {}
              as: SalesAgent
          trigger:
            - call: "POST /deals/${deal}/start-pdi"
              payload: {}
              as: SalesAgent
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FINANCE_NOT_SETTLED"
            - "Deal.${deal}.sale_status == QUOTED (start-pdi rejected)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: bay_overlap_with_cleanup_buffer
        grounds:
          - validations[priority=8]
          - errors[ERR_BAY_DOUBLE_BOOKED]
          - entities.ServiceBay.fields.cleanup_buffer_minutes
          - entities.Appointment.fields.start_utc
        distinguishing_aspect: |
          Bay interval semantics include a cleanup buffer appended AFTER each appointment:
          appt A [10:00,11:00) on a bay with 30-min buffer blocks until 11:30, so appt B
          starting 11:15 is rejected. The buffer is the distinguishing interval geometry.
        test_recipe:
          setup:
            - "REPAIR bay with cleanup_buffer 30; appt A [10:00,11:00); book appt B [11:15,12:00)"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Bay RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Oma Owner", email: "oma@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-BAY-1", model_year: 2022, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /service-bays"
              payload: { dealership_id: "${did}", name: "Repair-1", bay_kind: "REPAIR", cleanup_buffer_minutes: 30 }
              as: ServiceAdvisor
              captures: { bay: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 1.0, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so1: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 1.0, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so2: $.data.id }
            - call: "POST /appointments"
              payload: { dealership_id: "${did}", service_bay_id: "${bay}", appt_kind: "REPAIR", service_order_id: "${so1}", start_utc: "2026-06-01T10:00:00.000Z", end_utc: "2026-06-01T11:00:00.000Z" }
              as: ServiceAdvisor
              captures: { apptA: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { dealership_id: "${did}", service_bay_id: "${bay}", appt_kind: "REPAIR", service_order_id: "${so2}", start_utc: "2026-06-01T11:15:00.000Z", end_utc: "2026-06-01T12:00:00.000Z" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_BAY_DOUBLE_BOOKED (11:15 < 11:00 + 30min buffer = 11:30)"
            - "only appt A exists for the bay"

      - name: storage_overlap_no_buffer_strict_intersection
        grounds:
          - validations[priority=9]
          - errors[ERR_STORAGE_OVERLAP]
          - entities.StorageSlot.fields.start_utc
          - state_machines.StorageSlot
        distinguishing_aspect: |
          Storage interval semantics differ from bays: NO buffer, plain half-open
          intersection on the SAME unit. Slot A [06-01,06-10); slot B [06-05,06-08) strictly
          intersects and is rejected — different resource entity and different interval
          arithmetic (no buffer) than the bay rule.
        test_recipe:
          setup:
            - "Unit with storage slot A [2026-06-01,2026-06-10); book B [2026-06-05,2026-06-08) same unit"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Stor2 RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Pia Owner", email: "pia@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-ST2-1", model_year: 2022, class_type: "TRAVEL_TRAILER", acquisition: "STOCK", list_price_cents: 4000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v0: $.data.version }
            - call: "POST /storage-slots"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", daily_rate_cents: 5000, start_utc: "2026-06-01T00:00:00.000Z", end_utc: "2026-06-10T00:00:00.000Z", expected_unit_version: "${unit_v0}" }
              as: ServiceAdvisor
              captures: { slotA: $.data.id }
            - call: "GET /units/${unit}"
              payload: {}
              as: ServiceAdvisor
              captures: { unit_v1: $.data.version }
          trigger:
            - call: "POST /storage-slots"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", daily_rate_cents: 5000, start_utc: "2026-06-05T00:00:00.000Z", end_utc: "2026-06-08T00:00:00.000Z", expected_unit_version: "${unit_v1}" }
              as: ServiceAdvisor
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STORAGE_OVERLAP"
            - "only slot A exists for Unit.${unit}"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: parts_conservation_reserve_then_cancel
        grounds:
          - state_machines.ServiceOrder.OPEN_to_CANCELLED
          - entities.PartItem.fields.qty_on_hand
          - entities.PartItem.fields.qty_reserved
          - entities.PartItem.fields.qty_available
        distinguishing_aspect: |
          Conserved quantity: PartItem.qty_on_hand. Reserving (forward) then cancelling the
          order (compensating) must leave qty_on_hand unchanged and qty_reserved back to 0, so
          qty_available == qty_on_hand exactly as before the reservation (no parts drift).
        test_recipe:
          setup:
            - "Part qty_on_hand 10; open SO started; reserve 4; then cancel SO"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "Cons RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Quy Owner", email: "quy@x.com" }
              as: ServiceAdvisor
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-CN-1", model_year: 2022, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 5000000 }
              as: SalesAgent
              captures: { unit: $.data.id }
            - call: "POST /part-items"
              payload: { dealership_id: "${did}", sku: "BELT-1", name: "Belt", unit_price_cents: 8000, qty_on_hand: 10 }
              as: ServiceAdvisor
              captures: { part: $.data.id }
            - call: "POST /service-orders"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", labor_hours: 1.0, labor_rate_cents: 10000 }
              as: ServiceAdvisor
              captures: { so: $.data.id }
            - call: "POST /service-orders/${so}/start"
              payload: {}
              as: ServiceAdvisor
            - call: "POST /part-reservations"
              payload: { service_order_id: "${so}", part_item_id: "${part}", quantity: 4 }
              as: ServiceAdvisor
          trigger:
            - call: "POST /service-orders/${so}/cancel"
              payload: {}
              as: ServiceAdvisor
          assert:
            - "PartItem.${part}.qty_on_hand == 10 (unchanged: no parts consumed)"
            - "PartItem.${part}.qty_reserved == 0 and qty_available == 10 (reservation released)"

      - name: unit_availability_conservation_deal_create_then_cancel
        grounds:
          - state_machines.Unit.AVAILABLE_to_HELD
          - state_machines.Unit.HELD_to_AVAILABLE
          - entities.Unit.fields.status
          - entities.Unit.fields.active_hold_deal_id
        distinguishing_aspect: |
          A different conserved quantity than parts: Unit availability posture. Creating a deal
          (forward, AVAILABLE->HELD) then cancelling it (compensating, HELD->AVAILABLE) must
          return Unit.status to AVAILABLE and active_hold_deal_id to null — the unit's sellable
          posture is conserved across the paired actions.
        test_recipe:
          setup:
            - "Available unit; create deal (unit HELD); cancel deal"
          setup_api_calls:
            - call: "POST /dealerships"
              payload: { name: "UCons RV", state_code: "TX", doc_fee_cents: 0, sales_tax_rate_bps: 0 }
              as: DealerManager
              captures: { did: $.data.id }
            - call: "POST /customers"
              payload: { dealership_id: "${did}", full_name: "Rex Buyer", email: "rex@x.com" }
              as: SalesAgent
              captures: { cust: $.data.id }
            - call: "POST /units"
              payload: { dealership_id: "${did}", vin: "VIN-UC-1", model_year: 2024, class_type: "CLASS_C", acquisition: "STOCK", list_price_cents: 7000000 }
              as: SalesAgent
              captures: { unit: $.data.id, unit_v: $.data.version }
            - call: "POST /deals"
              payload: { dealership_id: "${did}", unit_id: "${unit}", customer_id: "${cust}", sale_price_cents: 7000000, expected_unit_version: "${unit_v}" }
              as: SalesAgent
              captures: { deal: $.data.id }
          trigger:
            - call: "POST /deals/${deal}/cancel"
              payload: {}
              as: SalesAgent
          assert:
            - "Unit.${unit}.status == AVAILABLE (posture conserved after create+cancel)"
            - "Unit.${unit}.active_hold_deal_id == null"
