          - state_machines.Application.ZONING_CLEARED_to_REJECTED
          - calculations.application_fee_estimate
          - entities.FeeAssessment.fields.amount
          - entities.FeeAssessment.fields.kind
        distinguishing_aspect: |
          Conserved quantity #1 — the net application-fee ledger for an Application. Forward APPLICATION_FEE
          charge (+270.00) paired with the compensating REVERSAL on reject (-270.00) MUST leave
          sum(FeeAssessment.amount where application_id == app AND kind IN {APPLICATION_FEE, REVERSAL}) == 0.00.
        test_recipe:
          setup:
            - "Application MEDIUM, declared 4 employees, submitted (APPLICATION_FEE 270.00), zoning CLEARED, then REJECTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "REJ_MED", risk_tier: "MEDIUM", activity_base_risk: 20, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Reject Co", owner_name: "RJ", zone_code: "C1" }
              as: Applicant
              captures: { biz_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${biz_id}", activity_category_id: "${cat_id}", declared_employee_count: 4, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${biz_id}"
              captures: { est: $.data.estimated_fee }
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
          trigger:
            - call: "POST /applications/${app_id}/reject"
              payload: {}
              as: LicensingOfficer
            - call: "GET /applications/${app_id}/fee-assessments"
              payload: {}
              as: LicensingOfficer
          assert:
            - "Application.${app_id}.status == REJECTED"
            - "sum(FeeAssessment.amount for application_id ${app_id}) == 0.00"
            - "exactly one FeeAssessment with kind == REVERSAL and amount == -270.00 exists for ${app_id}"

      - name: transfer_cancel_zeroes_transfer_fee_quantity
        grounds:
          - state_machines.OwnershipTransfer.REQUESTED_to_CANCELLED
          - state_machines.OwnershipTransfer.APPROVED_to_COMPLETED
          - entities.OwnershipTransfer.fields.transfer_fee
          - calculations.transfer_fee
        distinguishing_aspect: |
          Conserved quantity #2 (different type — a per-transfer fee field, not a ledger sum): the
          OwnershipTransfer.transfer_fee starts 0 and the only forward action that sets it positive is
          COMPLETE (transfer_fee>0). A CANCEL before completion pins transfer_fee back to 0, so a
          cancelled transfer leaves the transfer-fee quantity at exactly 0.00 (no orphan charge).
        test_recipe:
          setup:
            - "ACTIVE HIGH license with a REQUESTED transfer; the transfer is cancelled before completion."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LicensingOfficer
            - call: "POST /activity-categories"
              payload: { code: "CANC_HIGH", risk_tier: "HIGH", activity_base_risk: 30, required_inspection_count: 0, requires_zoning_check: false, term_months: 12, allowed_zones: ["C1"] }
              as: LicensingOfficer
              captures: { cat_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "CancSeller", owner_name: "CS", zone_code: "C1" }
              as: Applicant
              captures: { seller_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "CancBuyer", owner_name: "CB", zone_code: "C1" }
              as: Applicant
              captures: { buyer_id: $.data.id }
            - call: "POST /applications"
              payload: { business_id: "${seller_id}", activity_category_id: "${cat_id}", declared_employee_count: 1, requested_zone_code: "C1" }
              as: Applicant
              as_user_id: "${seller_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: Applicant
              as_user_id: "${seller_id}"
            - call: "POST /applications/${app_id}/zoning-check"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: LicensingOfficer
            - call: "POST /applications/${app_id}/issue"
              payload: {}
              as: LicensingOfficer
              as_user_id: "officer-issuer"
              captures: { lic_id: $.data.id }
            - call: "POST /transfers"
              payload: { license_id: "${lic_id}", from_business_id: "${seller_id}", to_business_id: "${buyer_id}" }
              as: Applicant
              as_user_id: "${seller_id}"
              captures: { tr_id: $.data.id }
          trigger:
            - call: "POST /transfers/${tr_id}/cancel"
              payload: {}
              as: Applicant
              as_user_id: "${seller_id}"
              captures: { st: $.data.status, fee: $.data.transfer_fee }
          assert:
            - "OwnershipTransfer.${tr_id}.status == CANCELLED"
            - "OwnershipTransfer.${tr_id}.transfer_fee == 0"
