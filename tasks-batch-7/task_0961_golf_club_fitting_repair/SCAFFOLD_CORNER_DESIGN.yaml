      - name: instructor_cannot_create_package_forbidden
        claim_type: rbac_exclusive_denied
        grounds: [roles, endpoints]
        distinguishing_aspect: "Instructor may read lesson packages (shared) but creating one is ShopManager-exclusive -> 403."
        test_recipe:
          setup: ["customer C; instructor staff I; one existing package"]
          setup_api_calls:
            - call: "POST /golf-shop/customers"
              payload: { full_name: "Lea Loom", email: "lea@example.com" }
              as: ShopAdmin
              captures: { c_id: $.data.id }
            - call: "POST /golf-shop/staff"
              payload: { full_name: "Ivy Instructor", staff_role: "INSTRUCTOR" }
              as: ShopAdmin
              captures: { inst_id: $.data.id }
            - call: "POST /golf-shop/lesson-packages"
              payload: { customer_id: "${c_id}", total_credits: 4, price_cents: 30000, expires_at: "2027-01-01T00:00:00Z" }
              as: ShopManager
              captures: { pkg_id: $.data.id }
          trigger:
            - call: "GET /golf-shop/lesson-packages/${pkg_id}"
