            - { call: "POST /growers", payload: { legal_name: "GB", grower_code: "G-B", email: "b@x.com" }, as: IntegratorAdmin, captures: { grower_b: $.data.id } }
            - { call: "POST /contracts", payload: { grower_id: "${grower_a}", site_id: "${site_id}", base_pay_cents_per_head: 4000, bonus_cap_cents_per_head: 1200, fcr_target: 2.60, adg_target_lbs: 1.90, mortality_threshold_pct: 5.00, feed_budget_lbs_per_head: 650, structural_owner_pct: 100, equipment_owner_pct: 50, routine_owner_pct: 0, effective_date: "2026-01-01", expiry_date: "2026-12-31" }, as: IntegratorAdmin, captures: { contract_id: $.data.id } }
            - { call: "POST /contracts/${contract_id}/activate", payload: {}, as: IntegratorAdmin }
            - { call: "POST /barns", payload: { site_id: "${site_id}", barn_code: "B1", capacity_head: 1200, floor_space_sqft: 9600 }, as: IntegratorAdmin, captures: { barn_id: $.data.id, barn_v: $.data.version } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-02-15T00:00:00Z" }, as: IntegratorAdmin }
            - { call: "POST /pig-groups", payload: { barn_id: "${barn_id}", contract_id: "${contract_id}", placement_date: "2026-03-02", target_market_date: "2026-07-13", head_placed: 500, avg_start_weight_lbs: 50.0, expected_barn_version: "${barn_v}" }, as: FieldTech, captures: { group_id: $.data.id } }
