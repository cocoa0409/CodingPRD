# =============================================================================
# Task 1623: Generator Set Packaging & Integration — §1.9 Corner Design
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# Stubs (excluded_because) mark claims covered by a named §1.8 instance.
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_defaults_and_retrieval
        claim_type: creation
        grounds: [entities.CustomerAccount, "endpoints: POST /genset-packaging/customers"]
        distinguishing_aspect: "Creating a customer without status yields default ACTIVE, credit_utilized_cents == 0, and GET returns the persisted row at version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Sierra Health", credit_limit_cents: 75000000, primary_locale: "US_CA" }
              as: PlatformAdmin
              captures: { ce_cust: $.data.id }
          trigger:
            - call: "GET /genset-packaging/customers/${ce_cust}"
              payload: {}
              as: SalesEngineer
          assert:
            - "CustomerAccount.${ce_cust}.status == ACTIVE (default applied)"
            - "CustomerAccount.${ce_cust}.credit_utilized_cents == 0"
            - "CustomerAccount.${ce_cust}.version == 1"

      - name: order_creation_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.PackageOrder, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required occupancy_type on order creation is rejected with ERR_INVALID_REQUEST and no order is persisted."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Tango Co", credit_limit_cents: 1000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { rq_cust: $.data.id }
          trigger:
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${rq_cust}", site_locale: "US_TX", application: "STANDBY" }
              as: SalesEngineer
              captures: { rq_err: $.data.error_id }
          assert:
            - "create rejected with error_id == ERR_INVALID_REQUEST"

      - name: order_creation_invalid_enum_member_rejected
        claim_type: type_constraints
        grounds: [entities.PackageOrder.fields.site_locale, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "site_locale 'US_NV' is not a declared enum member; creation fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Umbrella Inc", credit_limit_cents: 1000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { en_cust: $.data.id }
          trigger:
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${en_cust}", site_locale: "US_NV", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { en_err: $.data.error_id }
          assert:
            - "create rejected with error_id == ERR_INVALID_REQUEST"

      - name: get_nonexistent_order_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "GET with a well-formed but absent UUID returns ERR_NOT_FOUND (404), exercising existence validation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /genset-packaging/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: SalesEngineer
              captures: { nf_err: $.data.error_id }
          assert:
            - "GET rejected with error_id == ERR_NOT_FOUND"

      - name: orders_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints: GET /genset-packaging/orders"]
        distinguishing_aspect: "List endpoint honors limit/offset and returns pagination fields total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["one customer; three orders on it"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Victor Pages", credit_limit_cents: 300000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { pg_cust: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${pg_cust}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${pg_cust}", site_locale: "US_CA", occupancy_type: "HOSPITAL", application: "PRIME" }
              as: SalesEngineer
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${pg_cust}", site_locale: "DE", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
          trigger:
            - call: "GET /genset-packaging/orders"
              payload: { customer_id: "${pg_cust}", limit: 2, offset: 0 }
              as: SalesEngineer
          assert:
            - "response data array length == 2"
            - "total_count == 3"
            - "has_more == true"

      - name: sizing_study_computed_field_ignores_client_input
        claim_type: computed_fields
        grounds: [entities.SizingStudy.fields.required_kva]
        distinguishing_aspect: "required_kva is source:computed; any client-supplied value in the create payload is ignored and the server value (formula result) is returned."
        test_recipe:
          setup: ["customer, engine, alternator, order exist"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Whiskey Computed", credit_limit_cents: 100000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { cmp_c: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "G", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { cmp_e: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { cmp_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${cmp_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { cmp_o: $.data.id, cmp_ov: $.data.version }
          trigger:
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${cmp_o}", engine_model_id: "${cmp_e}", alternator_model_id: "${cmp_a}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${cmp_ov}" }
              as: ApplicationEngineer
              captures: { cmp_s: $.data.id, cmp_kva: $.data.required_kva }
          assert:
            - "SizingStudy.${cmp_s}.required_kva == 300.0 (server-computed: running 100, starting 100-100+300=300, max=300)"
            - "SizingStudy.${cmp_s}.status == DRAFT"

      - name: configuration_computed_fields_at_creation
        claim_type: computed_fields
        grounds: [entities.PackageConfiguration.fields.usable_gallons, entities.PackageConfiguration.fields.tank_price_cents, entities.PackageConfiguration.fields.min_runtime_hours]
        distinguishing_aspect: "Configuration creation computes usable_gallons (ullage by locale), tank_price_cents (150/gal) and min_runtime_hours (occupancy) immediately, before any lock."
        test_recipe:
          setup: ["US_TX HOSPITAL order with APPROVED study (authorized not required for creation)"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Xray Med", credit_limit_cents: 100000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { cc_c: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "G", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { cc_e: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { cc_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${cc_c}", site_locale: "US_TX", occupancy_type: "HOSPITAL", application: "STANDBY" }
              as: SalesEngineer
              captures: { cc_o: $.data.id, cc_ov: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${cc_o}", engine_model_id: "${cc_e}", alternator_model_id: "${cc_a}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${cc_ov}" }
              as: ApplicationEngineer
              captures: { cc_s: $.data.id }
            - call: "POST /genset-packaging/sizing-studies/${cc_s}/submit"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/sizing-studies/${cc_s}/approve"
              payload: {}
              as: SalesEngineer
          trigger:
            - call: "POST /genset-packaging/configurations"
              payload: { order_id: "${cc_o}", sizing_study_id: "${cc_s}", enclosure_type: "WEATHERPROOF", enclosure_price_cents: 5000000, fuel_tank_gallons: 1000 }
              as: ApplicationEngineer
              captures: { cc_cfg: $.data.id, cc_usable: $.data.usable_gallons, cc_min: $.data.min_runtime_hours, cc_rt: $.data.runtime_hours }
          assert:
            - "PackageConfiguration.${cc_cfg}.usable_gallons == 900.0 (US_TX ullage 0.10)"
            - "PackageConfiguration.${cc_cfg}.tank_price_cents == 150000"
            - "PackageConfiguration.${cc_cfg}.min_runtime_hours == 48 (HOSPITAL)"
            - "PackageConfiguration.${cc_cfg}.runtime_hours == 60.0"

      - name: crane_slot_derived_fields_at_creation
        claim_type: defaults
        grounds: [entities.CraneSlot.fields.buffer_hours, entities.CraneSlot.fields.free_hours]
        distinguishing_aspect: "Omitting buffer_hours applies the 0.5 default; free_hours initializes to the full window length."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /genset-packaging/crane-slots"
              payload: { service_date: "2026-10-01", window_start_hour: 6, window_end_hour: 18 }
              as: PlatformAdmin
              captures: { df_slot: $.data.id, df_free: $.data.free_hours, df_buf: $.data.buffer_hours }
          assert:
            - "CraneSlot.${df_slot}.buffer_hours == 0.5 (default)"
            - "CraneSlot.${df_slot}.reserved_hours == 0"
            - "CraneSlot.${df_slot}.free_hours == 12.0"

      - name: foreign_key_integrity_unknown_engine_rejected
        claim_type: parent_relationships
        grounds: [entities.SizingStudy.fields.engine_model_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Creating a sizing study with a non-existent engine_model_id fails existence validation with ERR_NOT_FOUND before any business rule runs."
        test_recipe:
          setup: ["customer, alternator, order exist"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Yankee FK", credit_limit_cents: 100000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { fk_c: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { fk_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${fk_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { fk_o: $.data.id, fk_ov: $.data.version }
          trigger:
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${fk_o}", engine_model_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", alternator_model_id: "${fk_a}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${fk_ov}" }
              as: ApplicationEngineer
              captures: { fk_err: $.data.error_id }
          assert:
            - "create rejected with error_id == ERR_NOT_FOUND"

      - name: fk_reverse_reachability_sizing_studies_by_order
        claim_type: retrieval
        grounds: [entities.SizingStudy.fields.order_id, "endpoints: GET /genset-packaging/sizing-studies"]
        distinguishing_aspect: "Filtered list GET /sizing-studies?order_id returns exactly the studies of that order, satisfying FK reverse-reachability."
        test_recipe:
          setup: ["customer/engine/alternator; two orders; two studies on order A, none on order B"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Zulu Rev", credit_limit_cents: 300000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { rv_c: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "G", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { rv_e: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { rv_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${rv_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { rv_oa: $.data.id, rv_oav: $.data.version }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${rv_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { rv_ob: $.data.id }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${rv_oa}", engine_model_id: "${rv_e}", alternator_model_id: "${rv_a}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${rv_oav}" }
              as: ApplicationEngineer
            - call: "GET /genset-packaging/orders/${rv_oa}"
              payload: {}
              as: SalesEngineer
              captures: { rv_oav2: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${rv_oa}", engine_model_id: "${rv_e}", alternator_model_id: "${rv_a}", load_steps: [ { description: "B", kva: 50, duty: "CONTINUOUS" } ], largest_motor_kva: 50, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${rv_oav2}" }
              as: ApplicationEngineer
          trigger:
            - call: "GET /genset-packaging/sizing-studies"
              payload: { order_id: "${rv_oa}" }
              as: SalesEngineer
            - call: "GET /genset-packaging/sizing-studies"
              payload: { order_id: "${rv_ob}" }
              as: SalesEngineer
          assert:
            - "list for order A: total_count == 2"
            - "list for order B: total_count == 0"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: sizing_study_initial_state_is_draft
        claim_type: initial_state
        grounds: [state_machines.SizingStudy]
        distinguishing_aspect: "A freshly created SizingStudy starts in DRAFT with null superseded_by_id and null rejection_reason."
        test_recipe:
          setup: ["customer, engine, alternator, order exist"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Alpha Init", credit_limit_cents: 100000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { is_c: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "G", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { is_e: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { is_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${is_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { is_o: $.data.id, is_ov: $.data.version }
          trigger:
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${is_o}", engine_model_id: "${is_e}", alternator_model_id: "${is_a}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${is_ov}" }
              as: ApplicationEngineer
              captures: { is_s: $.data.id }
          assert:
            - "SizingStudy.${is_s}.status == DRAFT"
            - "SizingStudy.${is_s}.superseded_by_id == null"
            - "SizingStudy.${is_s}.rejection_reason == null"

      - name: approve_draft_study_rejected_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.SizingStudy.SUBMITTED_to_APPROVED, "errors[ERR_STUDY_STATE_INVALID]"]
        distinguishing_aspect: "Approving a DRAFT study (never submitted) is rejected with ERR_STUDY_STATE_INVALID; study remains DRAFT."
        test_recipe:
          setup: ["order with one DRAFT study"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Bravo Draft", credit_limit_cents: 100000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { iv_c: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "G", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { iv_e: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { iv_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${iv_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { iv_o: $.data.id, iv_ov: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${iv_o}", engine_model_id: "${iv_e}", alternator_model_id: "${iv_a}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${iv_ov}" }
              as: ApplicationEngineer
              captures: { iv_s: $.data.id }
          trigger:
            - call: "POST /genset-packaging/sizing-studies/${iv_s}/approve"
              payload: {}
              as: SalesEngineer
              captures: { iv_err: $.data.error_id }
          assert:
            - "approve rejected with error_id == ERR_STUDY_STATE_INVALID"
            - "SizingStudy.${iv_s}.status == DRAFT"

      - name: rejected_study_resubmit_loop
        claim_type: valid_transition
        grounds: [state_machines.SizingStudy.SUBMITTED_to_REJECTED, state_machines.SizingStudy.REJECTED_to_DRAFT]
        distinguishing_aspect: "The REJECTED -> SUBMITTED revision loop clears rejection_reason and returns the study to SUBMITTED via DRAFT semantics (resubmit), exercising the study's cyclic shape."
        test_recipe:
          setup: ["order with a SUBMITTED study; sales rejects it; engineer resubmits"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Charlie Loop", credit_limit_cents: 100000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { lp_c: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "G", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { lp_e: $.data.id }
            - call: "POST /genset-packaging/alternator-models"
              payload: { model_code: "A700", rated_kva: 700, efficiency_pct: 96.0, list_price_cents: 15000000 }
              as: PlatformAdmin
              captures: { lp_a: $.data.id }
            - call: "POST /genset-packaging/orders"
              payload: { customer_id: "${lp_c}", site_locale: "US_TX", occupancy_type: "STANDARD", application: "STANDBY" }
              as: SalesEngineer
              captures: { lp_o: $.data.id, lp_ov: $.data.version }
            - call: "POST /genset-packaging/sizing-studies"
              payload: { order_id: "${lp_o}", engine_model_id: "${lp_e}", alternator_model_id: "${lp_a}", load_steps: [ { description: "A", kva: 100, duty: "CONTINUOUS" } ], largest_motor_kva: 100, starting_method: "DOL", altitude_m: 500, ambient_c: 40, method: "NAMEPLATE_SUM", expected_order_version: "${lp_ov}" }
              as: ApplicationEngineer
              captures: { lp_s: $.data.id }
            - call: "POST /genset-packaging/sizing-studies/${lp_s}/submit"
              payload: {}
              as: ApplicationEngineer
            - call: "POST /genset-packaging/sizing-studies/${lp_s}/reject"
              payload: { reason: "load profile incomplete" }
              as: SalesEngineer
          trigger:
            - call: "POST /genset-packaging/sizing-studies/${lp_s}/submit"
              payload: {}
              as: ApplicationEngineer
              captures: { lp_st: $.data.status }
          assert:
            - "SizingStudy.${lp_s}.status == SUBMITTED after resubmission"
            - "SizingStudy.${lp_s}.rejection_reason == null (cleared on resubmit)"

      - name: study_approval_supersedes_prior_approved
        claim_type: side_effect_execution
        grounds: [state_machines.SizingStudy.SUBMITTED_to_APPROVED, entities.SizingStudy.fields.superseded_by_id]
        distinguishing_aspect: "Approving study B while study A is APPROVED moves A to SUPERSEDED with superseded_by_id == B.id; the self-referential link is observable via the filtered list."
        test_recipe:
          setup: ["order with study A APPROVED; study B SUBMITTED"]
          setup_api_calls:
            - call: "POST /genset-packaging/customers"
              payload: { name: "Echo Sup", credit_limit_cents: 100000000, primary_locale: "US_TX" }
              as: PlatformAdmin
              captures: { sp_c: $.data.id }
            - call: "POST /genset-packaging/engine-models"
              payload: { model_code: "E15", manufacturer: "G", rated_kw: 400, fuel_burn_gph_at_75: 15.0, emissions_tier_capability: "EPA_TIER_4", list_price_cents: 30000000 }
              as: PlatformAdmin
              captures: { sp_e: $.data.id }
