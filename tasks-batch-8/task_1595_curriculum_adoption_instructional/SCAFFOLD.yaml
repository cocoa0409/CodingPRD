# =============================================================================
# SCAFFOLD.yaml — task_1595_curriculum_adoption_instructional
# District curriculum office: adoption cycles, framework alignment, pilots,
# public review, board approval, bid award, procurement, inventory, challenges.
# =============================================================================

scenario: |
  Curriculum Adoption & Instructional Materials (district curriculum office): adoption cycle by subject & state framework alignment, pilot program & teacher review rubric, public review & board approval, publisher quote, bid rules & bundled digital licensing, distribution & inventory by classroom, supplemental material request & vetting, materials challenge/reconsideration process, replacement cycle & budget forecast

domain_name: curriculum-adoption
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit        # procurement bid rules, public-review windows, challenge/reconsideration due process, segregation of duties
  secondary_archetype: quota_allocation      # finite warehouse inventory allocated to classrooms; backorder waterfall
  complexity_layers:
    - optimistic_concurrency                 # OCC on AdoptionCycle.version for award posting and PO creation (create-with-supersede)
    - cascading_side_effects                 # challenge decision -> material freeze -> distribution cancellation -> inventory recompute
    - dual_variant_calculation               # provisional vs trimmed-official rubric; lowest-responsive vs best-value award; rolling vs straight-line forecast
    - version_pinning_on_approval            # award pins pinned_quote_id + quote_version_pin on the cycle; de-selection clears the pin

  entity_topology: flat                      # peer entities joined by foreign keys over a flat URL space
  state_machine_shape: branching             # revert loops (remand, return-to-draft), cycles (clarification, appeal), parallel dimensions (material, purchase order)
  relationship_patterns:
    - one_to_many                            # cycle -> materials/pilots/quotes/POs; challenge -> votes
    - cross_aggregate                        # DO -> material; SR -> cycle ledger; lot -> material
    - polymorphic                            # ChallengeCase.target_id -> InstructionalMaterial | SupplementalRequest
  role_model: segregation_of_duties          # requester != approver; filer != voter; plus peer role ownership per resource type
  consistency_model: immediate               # all mutations and cascades atomic within the request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CurriculumFramework
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Unique framework code, e.g. 'STATE-MATH-2026'" }
      - { name: subject_area, type: enum, source: input, description: "MATHEMATICS | ENGLISH_LANGUAGE_ARTS | SCIENCE | SOCIAL_STUDIES | WORLD_LANGUAGES" }
      - { name: grade_band, type: enum, source: input, description: "K_5 | GRADES_6_8 | GRADES_9_12" }
      - { name: standards_required_count, type: integer, source: input, description: "Total number of standards a material must be mapped against; denominator of coverage_pct; must be >= 1" }
      - { name: effective_year, type: integer, source: input, description: "First school year the framework is in force" }
      - { name: status, type: enum, source: input, default: ACTIVE, description: "ACTIVE | RETIRED; only ACTIVE frameworks may back new cycles" }

  - name: AdoptionCycle
    parent: null
    common_fields: true
    fields:
      - { name: subject_area, type: enum, source: input, description: "MATHEMATICS | ENGLISH_LANGUAGE_ARTS | SCIENCE | SOCIAL_STUDIES | WORLD_LANGUAGES" }
      - { name: grade_band, type: enum, source: input, description: "K_5 | GRADES_6_8 | GRADES_9_12" }
      - { name: school_year_start, type: integer, source: input, description: "Calendar year the adopted materials take effect, e.g. 2027" }
      - { name: framework_id, type: string, source: input, description: "FK -> CurriculumFramework.id; framework must be ACTIVE and match subject_area + grade_band" }
      - { name: award_method, type: enum, source: input, default: LOWEST_RESPONSIVE, description: "LOWEST_RESPONSIVE | BEST_VALUE; selects the award winner rule" }
      - { name: district_enrollment, type: integer, source: input, description: "Students in the grade band district-wide; feeds ROLLING budget forecast; must be >= 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | ALIGNMENT_REVIEW | PILOT_OPEN | SCORING | PUBLIC_REVIEW | BOARD_PENDING | ADOPTED | PROCURING | DISTRIBUTING | ACTIVE | SUNSET | NOT_ADOPTED" }
      - { name: public_review_opens_at, type: datetime, source: system, description: "Logical-clock instant the public review window opened; null until SCORING -> PUBLIC_REVIEW; cleared on remand" }
      - { name: public_review_closes_at, type: datetime, source: system, description: "public_review_opens_at + 30 days; cleared on remand" }
      - { name: adopted_material_id, type: string, source: system, description: "Material chosen by board decision; null until ADOPTED" }
      - { name: pinned_quote_id, type: string, source: system, description: "Quote currently selected by award; null until first award; cleared if the pinned quote leaves SELECTED" }
      - { name: quote_version_pin, type: integer, source: system, description: "PublisherQuote.version captured at award time; PO creation re-validates against it" }
      - { name: open_backorder_count, type: integer, source: computed, description: "Count of DistributionOrders in BACKORDERED for the cycle's adopted material; recomputed on every allocation event" }
      - { name: replacement_due, type: boolean, source: computed, default: false, description: "Set true when the adopted material is REMOVED by a challenge decision; gates nothing, feeds forecast narrative" }

  - name: InstructionalMaterial
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> AdoptionCycle.id (supplied via the nested create path)" }
      - { name: title, type: string, source: input, description: "Material title" }
      - { name: publisher_name, type: string, source: input, description: "Publisher name" }
      - { name: isbn, type: string, source: input, description: "Optional ISBN", default: null }
      - { name: material_type, type: enum, source: input, default: CORE, description: "CORE | SUPPLEMENTAL" }
      - { name: adoption_status, type: enum, source: system, description: "SUBMITTED | VETTED | PILOT_CANDIDATE | ADOPTED | REJECTED — parallel dimension 1" }
      - { name: availability_status, type: enum, source: system, description: "USABLE | UNDER_CHALLENGE | RESTRICTED | REMOVED — parallel dimension 2, driven by challenges" }
      - { name: coverage_pct, type: number, source: computed, description: "round(100 * sum(alignment weights) / framework.standards_required_count, 2); FULL=1.0, PARTIAL=0.5, NONE=0; 0.00 with no mappings" }
      - { name: provisional_composite, type: number, source: computed, description: "Live weighted mean of SUBMITTED review composites across this material's pilots in its cycle; null when zero reviews" }
      - { name: official_composite, type: number, source: computed, description: "Trimmed variant computed at cycle close-pilots; null until SCORING" }
      - { name: participation_rate, type: number, source: computed, description: "round(submitted reviews / sum(teacher_count of ACTIVE/CLOSED pilots), 4); computed at close-pilots; null until SCORING" }
      - { name: adopted_at, type: datetime, source: system, description: "Logical-clock instant of board adoption; basis of the 90-day challenge window; null until ADOPTED" }

  - name: AlignmentMapping
    parent: InstructionalMaterial
    common_fields: true
    fields:
      - { name: material_id, type: string, source: system, description: "FK -> InstructionalMaterial.id (supplied via the nested create path)" }
      - { name: standard_code, type: string, source: input, description: "Framework standard code string; upsert key together with material_id" }
      - { name: coverage_rating, type: enum, source: input, description: "NONE | PARTIAL | FULL" }

  - name: PilotProgram
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> AdoptionCycle.id (supplied via the nested create path)" }
      - { name: material_id, type: string, source: input, description: "FK -> InstructionalMaterial.id; material must belong to the same cycle and be VETTED" }
      - { name: school_code, type: string, source: input, description: "Free-form school identifier; pilot overlap rule keys on school_code + cycle subject_area" }
      - { name: starts_on, type: string, source: input, description: "ISO date YYYY-MM-DD, inclusive pilot window start" }
      - { name: ends_on, type: string, source: input, description: "ISO date YYYY-MM-DD, exclusive pilot window end; must be > starts_on" }
      - { name: teacher_count, type: integer, source: input, description: "Number of piloting teachers (participation denominator); must be >= 1" }
      - { name: status, type: enum, source: system, description: "PLANNED | ACTIVE | CLOSED | CANCELLED" }
      - { name: submitted_review_count, type: integer, source: computed, description: "Live count of SUBMITTED TeacherReviews for this pilot" }

  - name: TeacherReview
    parent: PilotProgram
    common_fields: true
    fields:
      - { name: pilot_id, type: string, source: system, description: "FK -> PilotProgram.id (supplied via the nested create path)" }
      - { name: teacher_user_id, type: string, source: system, description: "X-User-ID of the submitting Teacher; uniqueness key with pilot_id among SUBMITTED reviews" }
      - { name: pedagogy_score, type: integer, source: input, description: "Rubric dimension, integer 1..4" }
      - { name: alignment_score, type: integer, source: input, description: "Rubric dimension, integer 1..4" }
      - { name: usability_score, type: integer, source: input, description: "Rubric dimension, integer 1..4" }
      - { name: equity_score, type: integer, source: input, description: "Rubric dimension, integer 1..4" }
      - { name: review_composite, type: number, source: computed, description: "0.4*pedagogy + 0.3*alignment + 0.2*usability + 0.1*equity, exact decimal" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | WITHDRAWN" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of submission" }

  - name: PublisherQuote
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> AdoptionCycle.id (supplied via the nested create path)" }
      - { name: material_id, type: string, source: input, description: "FK -> InstructionalMaterial.id; material must belong to the same cycle" }
      - { name: publisher_name, type: string, source: input, description: "Bidding publisher" }
      - { name: print_unit_price, type: number, source: input, description: "Per-print-copy price in dollars; >= 0" }
      - { name: print_quantity, type: integer, source: input, description: "Quoted print copies; >= 0" }
      - { name: digital_seat_rate, type: number, source: input, description: "Per-student digital license price; >= 0" }
      - { name: digital_seat_count, type: integer, source: input, description: "Quoted digital seats; >= 0" }
      - { name: bundle_discount_pct, type: number, source: input, default: 0, description: "0..1; applies to the digital line only, and only when both print and digital quantities are > 0" }
      - { name: training_sessions, type: integer, source: input, description: "Included professional-development sessions; >= 0; feeds BEST_VALUE score" }
      - { name: license_years, type: integer, source: input, description: "Digital license term in years; >= 0; feeds BEST_VALUE score" }
      - { name: evaluated_total, type: number, source: computed, description: "bundled_pricing_total over the quoted quantities; computed on entry to UNDER_EVALUATION and on resubmit" }
      - { name: best_value_score, type: number, source: computed, description: "Computed for every responsive quote in the pool at award time when award_method = BEST_VALUE; null otherwise" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_EVALUATION | CLARIFICATION_REQUESTED | SELECTED | REJECTED | WITHDRAWN | SUPERSEDED" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock instant of quote creation" }

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> AdoptionCycle.id (supplied via the nested create path)" }
      - { name: quote_id, type: string, source: input, description: "FK -> PublisherQuote.id; must be the cycle's currently pinned SELECTED quote" }
      - { name: print_quantity, type: integer, source: input, description: "Print copies ordered; >= 1" }
      - { name: digital_seat_count, type: integer, source: input, description: "Digital seats ordered; >= 0" }
      - { name: total_amount, type: number, source: computed, description: "bundled_pricing_total priced off the pinned quote's rates with the PO's quantities" }
      - { name: amount_paid, type: number, source: system, default: 0, description: "Cumulative payments" }
      - { name: received_print_qty, type: integer, source: system, default: 0, description: "Cumulative print copies received" }
      - { name: quote_version_pin, type: integer, source: system, description: "Copy of PublisherQuote.version at PO creation" }
      - { name: order_status, type: enum, source: system, description: "DRAFT | ISSUED | PARTIALLY_RECEIVED | RECEIVED | CLOSED | CANCELLED | SUPERSEDED — parallel dimension 1" }
      - { name: payment_status, type: enum, source: system, description: "UNENCUMBERED | ENCUMBERED | PARTIALLY_PAID | PAID | RELEASED — parallel dimension 2" }

  - name: InventoryLot
    parent: null
    common_fields: true
    fields:
      - { name: material_id, type: string, source: system, description: "FK -> InstructionalMaterial.id; unique — one lot per material, auto-created on first receipt" }
      - { name: on_hand_units, type: integer, source: system, default: 0, description: "Units physically in the district warehouse" }
      - { name: in_transit_units, type: integer, source: system, default: 0, description: "Units shipped to schools but not yet received" }
      - { name: delivered_units, type: integer, source: system, default: 0, description: "Cumulative units received by classrooms" }
      - { name: total_received_units, type: integer, source: system, default: 0, description: "Cumulative units received from publishers; conservation: total_received_units == on_hand_units + in_transit_units + delivered_units" }
      - { name: allocated_units, type: integer, source: computed, description: "Sum of quantity over DistributionOrders of this material in APPROVED status" }
      - { name: available_units, type: integer, source: computed, description: "on_hand_units - allocated_units" }

  - name: DistributionOrder
    parent: null
    common_fields: true
    fields:
      - { name: material_id, type: string, source: input, description: "FK -> InstructionalMaterial.id; must be ADOPTED and USABLE at creation" }
      - { name: school_code, type: string, source: input, description: "Destination school" }
      - { name: classroom_label, type: string, source: input, description: "Destination classroom within the school" }
      - { name: quantity, type: integer, source: input, description: "Units requested; >= 1" }
      - { name: need_priority, type: integer, source: input, description: "1..5, 5 highest; backorder promotion ranks on this DESC, ties by created_at ASC" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | BACKORDERED | SHIPPED | RECEIVED | CANCELLED" }

  - name: SupplementalRequest
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: input, description: "FK -> AdoptionCycle.id; approval commits against this cycle's BudgetLedger" }
      - { name: requester_user_id, type: string, source: system, description: "X-User-ID of the requesting Teacher" }
      - { name: title, type: string, source: input, description: "Supplemental material title" }
      - { name: publisher_name, type: string, source: input, description: "Publisher" }
      - { name: estimated_cost, type: number, source: input, description: "Estimated total cost in dollars; > 0" }
      - { name: subject_area, type: enum, source: input, description: "Same enum as AdoptionCycle.subject_area" }
      - { name: grade_band, type: enum, source: input, description: "Same enum as AdoptionCycle.grade_band" }
      - { name: school_code, type: string, source: input, description: "Requesting school" }
      - { name: justification, type: string, source: input, default: null, description: "Optional pedagogical justification" }
      - { name: approver_user_id, type: string, source: system, description: "X-User-ID of the approving InstructionalSpecialist; null until APPROVED; must differ from requester_user_id" }
      - { name: approved_at, type: datetime, source: system, description: "Logical-clock instant of approval; basis of the 90-day challenge window; null until APPROVED" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | VETTING | APPROVED | DENIED | UNDER_CHALLENGE | REAFFIRMED | REVOKED" }

  - name: ChallengeCase
    parent: null
    common_fields: true
    fields:
      - { name: target_type, type: enum, source: input, description: "MATERIAL | SUPPLEMENTAL_REQUEST — polymorphic target" }
      - { name: target_id, type: string, source: input, description: "Polymorphic target reference: an InstructionalMaterial id when target_type=MATERIAL, a SupplementalRequest id when target_type=SUPPLEMENTAL_REQUEST (resolved per target_type, not a single-table FK)" }
      - { name: grounds, type: enum, source: input, description: "CONTENT_OBJECTION | AGE_APPROPRIATENESS | ALIGNMENT_DISPUTE | PROCEDURAL_IRREGULARITY" }
      - { name: filer_user_id, type: string, source: system, description: "X-User-ID of the filing CommunityMember; barred from voting on this case" }
      - { name: status, type: enum, source: system, description: "FILED | SCREENING | COMMITTEE_REVIEW | HEARING | DECIDED | APPEALED | CLOSED" }
      - { name: decision, type: enum, source: system, description: "UPHELD | RESTRICTED | REMOVED; null until first DECIDED; plurality of current-round votes, tie resolves to UPHELD" }
      - { name: vote_round, type: integer, source: system, default: 1, description: "Increments on each appeal; votes are scoped to (challenge_id, voter_user_id, vote_round)" }
      - { name: appeal_used, type: boolean, source: system, default: false, description: "Set true on the first appeal; second appeals are rejected" }
      - { name: filed_at, type: datetime, source: system, description: "Logical-clock instant of filing" }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock instant of the most recent decision; basis of the 14-day appeal window" }

  - name: CommitteeVote
    parent: ChallengeCase
    common_fields: false
    fields:
      - { name: challenge_id, type: string, source: system, description: "FK -> ChallengeCase.id (supplied via the nested create path)" }
      - { name: voter_user_id, type: string, source: system, description: "X-User-ID of the voting CommitteeMember" }
      - { name: vote, type: enum, source: input, description: "UPHOLD | RESTRICT | REMOVE" }
      - { name: vote_round, type: integer, source: system, description: "ChallengeCase.vote_round captured at cast time; immutable" }

  - name: BudgetLedger
    parent: AdoptionCycle
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> AdoptionCycle.id; unique — auto-created with the cycle" }
      - { name: appropriation_total, type: number, source: system, default: 0, description: "Cumulative appropriated dollars; grows via budget-appropriation postings" }
      - { name: encumbered_total, type: number, source: system, default: 0, description: "Open commitments: issued-not-fully-paid PO remainder + approved supplemental estimated costs" }
      - { name: expended_total, type: number, source: system, default: 0, description: "Cumulative PO payments" }
      - { name: available_balance, type: number, source: computed, description: "appropriation_total - encumbered_total - expended_total; invariant: appropriation_total == available_balance + encumbered_total + expended_total" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AdoptionCycle
    initial_state: DRAFT
    terminal_states: [NOT_ADOPTED, SUNSET]
    transitions:
      - from: DRAFT
        to: ALIGNMENT_REVIEW
        trigger: "POST /adoption-cycles/{cycleId}/transitions {to_state: ALIGNMENT_REVIEW}"
        actor: InstructionalSpecialist
        preconditions:
          - "cycle.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "increments AdoptionCycle.version by 1"

      - from: ALIGNMENT_REVIEW
        to: PILOT_OPEN
        trigger: "POST /adoption-cycles/{cycleId}/transitions {to_state: PILOT_OPEN}"
        actor: InstructionalSpecialist
        preconditions:
          - "cycle.status == ALIGNMENT_REVIEW (else ERR_INVALID_STATE)"
          - "at least one material of this cycle has adoption_status == VETTED (else ERR_NO_VETTED_MATERIALS)"
          - "every material of this cycle with adoption_status == VETTED has coverage_pct >= 85.00 (else ERR_ALIGNMENT_COVERAGE_BELOW_THRESHOLD; boundary is inclusive: exactly 85.00 passes)"
        side_effects:
          - "increments AdoptionCycle.version by 1"

      - from: ALIGNMENT_REVIEW
        to: DRAFT
        trigger: "POST /adoption-cycles/{cycleId}/transitions {to_state: DRAFT}"
        actor: CurriculumDirector
        preconditions:
          - "cycle.status == ALIGNMENT_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "increments AdoptionCycle.version by 1"
        note: "revert loop: alignment work is sent back to DRAFT"

      - from: PILOT_OPEN
        to: SCORING
        trigger: "POST /adoption-cycles/{cycleId}/transitions {to_state: SCORING} (close-pilots)"
        actor: CurriculumDirector
        preconditions:
          - "cycle.status == PILOT_OPEN (else ERR_INVALID_STATE)"
          - "every PilotProgram of this cycle has status in {CLOSED, CANCELLED} (else ERR_UNRESOLVED_PILOTS)"
        side_effects:
          - "for each material of the cycle with at least one pilot: compute official_composite (trimmed variant of pilot_composite_score) and participation_rate; store on the material"
          - "increments AdoptionCycle.version by 1"

      - from: SCORING
        to: PUBLIC_REVIEW
        trigger: "POST /adoption-cycles/{cycleId}/transitions {to_state: PUBLIC_REVIEW} (open-public-review)"
        actor: BoardSecretary
        preconditions:
          - "cycle.status == SCORING (else ERR_INVALID_STATE)"
          - "temporal gap rule: for every other AdoptionCycle with the same subject_area, status != NOT_ADOPTED, and non-null public_review_opens_at: the new window [now, now+30d] must leave a clear 30-day gap from the existing CLOSED window [opens, closes] — conflict iff NOT (new_opens > existing_closes + 30 days OR existing_opens > new_closes + 30 days) (else ERR_PUBLIC_REVIEW_WINDOW_CONFLICT); adjacency with a shorter gap is a conflict"
        side_effects:
          - "public_review_opens_at = current logical clock; public_review_closes_at = opens + 30 days"
          - "increments AdoptionCycle.version by 1"

      - from: PUBLIC_REVIEW
        to: BOARD_PENDING
        trigger: "POST /adoption-cycles/{cycleId}/transitions {to_state: BOARD_PENDING} (close-public-review)"
        actor: BoardSecretary
        preconditions:
          - "cycle.status == PUBLIC_REVIEW (else ERR_INVALID_STATE)"
          - "current logical clock >= public_review_closes_at (else ERR_PUBLIC_REVIEW_NOT_CLOSED; boundary is inclusive: exactly closes_at passes)"
        side_effects:
          - "increments AdoptionCycle.version by 1"

      - from: BOARD_PENDING
        to: PUBLIC_REVIEW
        trigger: "POST /adoption-cycles/{cycleId}/transitions {to_state: PUBLIC_REVIEW} (remand)"
        actor: BoardSecretary
        preconditions:
          - "cycle.status == BOARD_PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "public_review_opens_at = current logical clock; public_review_closes_at = opens + 30 days (window re-opens)"
          - "increments AdoptionCycle.version by 1"
        note: "remand loop: board sends the slate back for a fresh public review"

      - from: BOARD_PENDING
        to: ADOPTED
        trigger: "POST /adoption-cycles/{cycleId}/board-decision {material_id, decision: ADOPT}"
        actor: BoardSecretary
        preconditions:
          - "cycle.status == BOARD_PENDING (else ERR_INVALID_STATE)"
          - "material exists, belongs to this cycle, and has adoption_status == PILOT_CANDIDATE (else ERR_INVALID_STATE)"
          - "material.official_composite >= 3.20 (else ERR_COMPOSITE_BELOW_THRESHOLD; inclusive boundary: exactly 3.20 passes; null composite fails)"
          - "material.participation_rate >= 0.60 (else ERR_PARTICIPATION_BELOW_FLOOR; inclusive boundary: exactly 0.60 passes; checked after the composite check)"
        side_effects:
          - "material.adoption_status -> ADOPTED; material.adopted_at = current logical clock; cycle.adopted_material_id = material.id"
          - "every other material of this cycle with adoption_status == PILOT_CANDIDATE -> REJECTED"
          - "increments AdoptionCycle.version by 1"

      - from: BOARD_PENDING
        to: NOT_ADOPTED
        trigger: "POST /adoption-cycles/{cycleId}/board-decision {material_id, decision: REJECT}"
        actor: BoardSecretary
        preconditions:
          - "cycle.status == BOARD_PENDING (else ERR_INVALID_STATE)"
        side_effects:
          - "every material of this cycle with adoption_status == PILOT_CANDIDATE -> REJECTED"
          - "increments AdoptionCycle.version by 1"

      - from: ADOPTED
        to: PROCURING
        trigger: "POST /adoption-cycles/{cycleId}/award (first successful award)"
        actor: ProcurementOfficer
        preconditions:
          - "see award endpoint rules (OCC, bid rule, winner rule)"
        side_effects:
          - "see award endpoint rules"

      - from: PROCURING
        to: PROCURING
        trigger: "POST /adoption-cycles/{cycleId}/award (re-award while PROCURING)"
        actor: ProcurementOfficer
        preconditions:
          - "see award endpoint rules (OCC, bid rule, winner rule)"
        side_effects:
          - "the previously SELECTED quote -> SUPERSEDED; the new target -> SELECTED; pin updated (pinned_quote_id, quote_version_pin)"
          - "increments AdoptionCycle.version by 1"
        note: "legitimate supersede: re-award is a legal write, which is exactly what the OCC rule guards"

      - from: PROCURING
        to: DISTRIBUTING
        trigger: "system (automatic on the first successful POST /purchase-orders/{poId}/receive for this cycle)"
        actor: system
        preconditions: []
        side_effects:
          - "increments AdoptionCycle.version by 1"

      - from: DISTRIBUTING
        to: ACTIVE
        trigger: "POST /adoption-cycles/{cycleId}/transitions {to_state: ACTIVE}"
        actor: CurriculumDirector
        preconditions:
          - "cycle.status == DISTRIBUTING (else ERR_INVALID_STATE)"
          - "every PurchaseOrder of this cycle has order_status in {CLOSED, CANCELLED, SUPERSEDED} AND every DistributionOrder for the adopted material has status in {RECEIVED, CANCELLED} (else ERR_OPEN_WORK_REMAINS)"
        side_effects:
          - "increments AdoptionCycle.version by 1"

      - from: ACTIVE
        to: SUNSET
        trigger: "POST /adoption-cycles/{cycleId}/transitions {to_state: SUNSET}"
        actor: CurriculumDirector
        preconditions:
          - "cycle.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "increments AdoptionCycle.version by 1"

  - entity: InstructionalMaterial
    initial_state: "adoption_status=SUBMITTED, availability_status=USABLE"
    terminal_states: ["adoption_status=REJECTED (availability frozen)", "availability_status=REMOVED"]
    transitions:
      - from: "adoption_status=SUBMITTED"
        to: "adoption_status=VETTED"
        trigger: "POST /materials/{materialId}/transitions {to_state: VETTED}"
        actor: InstructionalSpecialist
        preconditions:
          - "material.adoption_status == SUBMITTED (else ERR_INVALID_STATE)"
          - "material's cycle status is in {DRAFT, ALIGNMENT_REVIEW} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments InstructionalMaterial.version by 1"

      - from: "adoption_status=SUBMITTED"
        to: "adoption_status=REJECTED"
        trigger: "POST /materials/{materialId}/transitions {to_state: REJECTED}"
        actor: InstructionalSpecialist
        preconditions:
          - "material.adoption_status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments InstructionalMaterial.version by 1"

      - from: "adoption_status=VETTED"
        to: "adoption_status=PILOT_CANDIDATE"
        trigger: "system (automatic when the first PilotProgram referencing this material transitions PLANNED -> ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "increments InstructionalMaterial.version by 1"

      - from: "adoption_status=PILOT_CANDIDATE"
        to: "adoption_status=ADOPTED"
        trigger: "system (via POST /adoption-cycles/{cycleId}/board-decision {decision: ADOPT})"
        actor: system
        preconditions: []
        side_effects:
          - "material.adopted_at = current logical clock"
          - "increments InstructionalMaterial.version by 1"

      - from: "adoption_status=PILOT_CANDIDATE"
        to: "adoption_status=REJECTED"
        trigger: "system (via board-decision adopting a different material, or decision REJECT)"
        actor: system
        preconditions: []
        side_effects:
          - "increments InstructionalMaterial.version by 1"

      - from: "availability_status=USABLE"
        to: "availability_status=UNDER_CHALLENGE"
        trigger: "system (automatic when a ChallengeCase targeting this material is filed)"
        actor: system
        preconditions: []
        side_effects:
          - "increments InstructionalMaterial.version by 1"
        note: "adoption_status is untouched — a material can be ADOPTED and UNDER_CHALLENGE at once (parallel dimensions)"

      - from: "availability_status=UNDER_CHALLENGE"
        to: "availability_status=USABLE"
        trigger: "system (challenge decided UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "increments InstructionalMaterial.version by 1"

      - from: "availability_status=UNDER_CHALLENGE"
        to: "availability_status=RESTRICTED"
        trigger: "system (challenge decided RESTRICTED)"
        actor: system
        preconditions: []
        side_effects:
          - "increments InstructionalMaterial.version by 1"

      - from: "availability_status in {UNDER_CHALLENGE, RESTRICTED}"
        to: "availability_status=REMOVED"
        trigger: "system (challenge decided REMOVED)"
        actor: system
        preconditions: []
        side_effects:
          - "every DistributionOrder with material_id == this material and status in {REQUESTED, APPROVED, BACKORDERED} -> CANCELLED; APPROVED orders release their allocation (InventoryLot.allocated_units decreases)"
          - "InventoryLot derived fields recomputed (allocated_units, available_units)"
          - "if this material is its cycle's adopted_material_id, that cycle's replacement_due = true"
          - "increments InstructionalMaterial.version by 1"

  - entity: PilotProgram
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: ACTIVE
        trigger: "POST /pilots/{pilotId}/transitions {to_state: ACTIVE}"
        actor: CurriculumDirector
        preconditions:
          - "pilot.status == PLANNED (else ERR_INVALID_STATE)"
          - "pilot's cycle status == PILOT_OPEN (else ERR_INVALID_STATE)"
          - "current logical clock date >= pilot.starts_on (else ERR_PILOT_NOT_STARTED)"
        side_effects:
          - "if pilot.material_id's adoption_status == VETTED, it becomes PILOT_CANDIDATE"
          - "increments PilotProgram.version by 1"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /pilots/{pilotId}/transitions {to_state: CLOSED}"
        actor: CurriculumDirector
        preconditions:
          - "pilot.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "increments PilotProgram.version by 1"

      - from: PLANNED
        to: CANCELLED
        trigger: "POST /pilots/{pilotId}/transitions {to_state: CANCELLED}"
        actor: CurriculumDirector
        preconditions:
          - "pilot.status == PLANNED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments PilotProgram.version by 1"

  - entity: TeacherReview
    initial_state: SUBMITTED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /reviews/{reviewId}/withdraw"
        actor: Teacher
        preconditions:
          - "review.status == SUBMITTED (else ERR_INVALID_STATE)"
          - "X-User-ID == review.teacher_user_id (else ERR_INSUFFICIENT_PERMISSIONS)"
          - "review's pilot status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "recompute pilot.submitted_review_count and the material's provisional_composite (review excluded)"
          - "increments TeacherReview.version by 1"

  - entity: PublisherQuote
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN, SUPERSEDED]
    transitions:
      - from: SUBMITTED
        to: UNDER_EVALUATION
        trigger: "POST /quotes/{quoteId}/transitions {to_state: UNDER_EVALUATION}"
        actor: ProcurementOfficer
        preconditions:
          - "quote.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "compute evaluated_total via bundled_pricing_total over the quote's own quantities"
          - "increments PublisherQuote.version by 1"

      - from: UNDER_EVALUATION
        to: CLARIFICATION_REQUESTED
        trigger: "POST /quotes/{quoteId}/transitions {to_state: CLARIFICATION_REQUESTED}"
        actor: ProcurementOfficer
        preconditions:
          - "quote.status in {UNDER_EVALUATION, SELECTED} (else ERR_INVALID_STATE)"
          - "if quote.status == SELECTED: the cycle's pin is cleared (pinned_quote_id = null, quote_version_pin = null)"
        side_effects:
          - "when entered from SELECTED: clear cycle pin (quote leaves the pinned position; a re-award is required before PO creation)"
          - "increments PublisherQuote.version by 1"

      - from: CLARIFICATION_REQUESTED
        to: UNDER_EVALUATION
        trigger: "POST /quotes/{quoteId}/transitions {to_state: UNDER_EVALUATION, ...optional updated pricing/service fields} (resubmit)"
        actor: ProcurementOfficer
        preconditions:
          - "quote.status == CLARIFICATION_REQUESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "apply any supplied pricing/service field updates"
          - "recompute evaluated_total via bundled_pricing_total"
          - "increments PublisherQuote.version by 1"
        note: "revision cycle: UNDER_EVALUATION <-> CLARIFICATION_REQUESTED may loop; each resubmit bumps version, which is what makes the cycle's quote_version_pin meaningful"

      - from: "SUBMITTED | UNDER_EVALUATION | CLARIFICATION_REQUESTED"
        to: WITHDRAWN
        trigger: "POST /quotes/{quoteId}/transitions {to_state: WITHDRAWN}"
        actor: ProcurementOfficer
        preconditions:
          - "quote.status in {SUBMITTED, UNDER_EVALUATION, CLARIFICATION_REQUESTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments PublisherQuote.version by 1"

      - from: UNDER_EVALUATION
        to: SELECTED
        trigger: "system (via POST /adoption-cycles/{cycleId}/award naming this quote)"
        actor: system
        preconditions: []
        side_effects:
          - "cycle.pinned_quote_id = quote.id; cycle.quote_version_pin = quote.version"

      - from: UNDER_EVALUATION
        to: REJECTED
        trigger: "system (via award of a different quote in the same responsive pool)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SELECTED
        to: SUPERSEDED
        trigger: "system (via a later award naming a different quote)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: PurchaseOrder
    initial_state: "order_status=DRAFT, payment_status=UNENCUMBERED"
    terminal_states: ["order_status=CLOSED", "order_status=CANCELLED", "order_status=SUPERSEDED"]
    transitions:
      - from: "order_status=DRAFT"
        to: "order_status=ISSUED, payment_status=ENCUMBERED"
        trigger: "POST /purchase-orders/{poId}/issue"
        actor: ProcurementOfficer
        preconditions:
          - "po.order_status == DRAFT (else ERR_INVALID_STATE)"
          - "ledger.available_balance >= po.total_amount (else ERR_BUDGET_ENVELOPE_EXCEEDED; inclusive boundary: equal passes)"
        side_effects:
          - "BudgetLedger.encumbered_total += po.total_amount"
          - "increments PurchaseOrder.version by 1"

      - from: "order_status=ISSUED | PARTIALLY_RECEIVED"
        to: "order_status=PARTIALLY_RECEIVED | RECEIVED"
        trigger: "POST /purchase-orders/{poId}/receive {qty_received}"
        actor: WarehouseManager
        preconditions:
          - "po.order_status in {ISSUED, PARTIALLY_RECEIVED} (else ERR_INVALID_STATE)"
          - "qty_received >= 1 (else ERR_VALIDATION)"
          - "po.received_print_qty + qty_received <= po.print_quantity (else ERR_OVER_RECEIPT)"
        side_effects:
          - "po.received_print_qty += qty_received; order_status -> PARTIALLY_RECEIVED if < print_quantity else RECEIVED"
          - "InventoryLot for po's material (auto-created on first receipt): on_hand_units += qty_received; total_received_units += qty_received"
          - "backorder promotion: for the received material, consider DistributionOrders in BACKORDERED ranked need_priority DESC then created_at ASC; promote the head of the ranking to APPROVED (allocated_units += its quantity) while it fits available_units; stop at the first order that does not fit (head-of-line blocking; later orders are not considered)"
          - "recompute cycle.open_backorder_count"
          - "if this is the cycle's first receipt: cycle PROCURING -> DISTRIBUTING"
          - "increments PurchaseOrder.version by 1"

      - from: "payment_status=ENCUMBERED | PARTIALLY_PAID (while order_status in ISSUED | PARTIALLY_RECEIVED | RECEIVED)"
        to: "payment_status=PARTIALLY_PAID | PAID"
        trigger: "POST /purchase-orders/{poId}/pay {amount}"
        actor: ProcurementOfficer
        preconditions:
          - "po.order_status in {ISSUED, PARTIALLY_RECEIVED, RECEIVED} and po.payment_status in {ENCUMBERED, PARTIALLY_PAID} (else ERR_INVALID_STATE)"
          - "amount > 0 (else ERR_VALIDATION)"
          - "amount <= po.total_amount - po.amount_paid (else ERR_PAYMENT_EXCEEDS_BALANCE; inclusive boundary: exactly the remaining balance passes and yields PAID)"
        side_effects:
          - "po.amount_paid += amount; payment_status -> PARTIALLY_PAID if amount_paid < total_amount else PAID"
          - "BudgetLedger.encumbered_total -= amount; BudgetLedger.expended_total += amount"
          - "increments PurchaseOrder.version by 1"

      - from: "order_status=RECEIVED"
        to: "order_status=CLOSED"
        trigger: "POST /purchase-orders/{poId}/transitions {to_state: CLOSED}"
        actor: ProcurementOfficer
        preconditions:
          - "po.order_status == RECEIVED (else ERR_INVALID_STATE)"
          - "po.payment_status == PAID (else ERR_PO_NOT_CLOSABLE)"
        side_effects:
          - "increments PurchaseOrder.version by 1"

      - from: "order_status=DRAFT | ISSUED | PARTIALLY_RECEIVED"
        to: "order_status=CANCELLED, payment_status=RELEASED"
        trigger: "POST /purchase-orders/{poId}/cancel"
        actor: ProcurementOfficer
        preconditions:
          - "po.order_status in {DRAFT, ISSUED, PARTIALLY_RECEIVED} (else ERR_INVALID_STATE)"
        side_effects:
          - "compensation: if payment_status was ENCUMBERED or PARTIALLY_PAID, BudgetLedger.encumbered_total -= (po.total_amount - po.amount_paid); expended_total unchanged"
          - "increments PurchaseOrder.version by 1"

      - from: "order_status=DRAFT"
        to: "order_status=SUPERSEDED"
        trigger: "system (a new PurchaseOrder created for the same cycle supersedes the existing DRAFT)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DistributionOrder
    initial_state: REQUESTED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: "REQUESTED | BACKORDERED"
        to: APPROVED
        trigger: "POST /distribution-orders/{doId}/transitions {to_state: APPROVED} (manual) or system promotion on PO receipt"
        actor: WarehouseManager
        preconditions:
          - "do.status in {REQUESTED, BACKORDERED} (else ERR_INVALID_STATE)"
          - "material.availability_status == USABLE (else ERR_MATERIAL_FROZEN — checked before the inventory check)"
          - "InventoryLot.available_units >= do.quantity (else ERR_INSUFFICIENT_INVENTORY; inclusive boundary: equal passes, leaving available_units == 0)"
        side_effects:
          - "InventoryLot.allocated_units += do.quantity (derived from APPROVED orders)"
          - "recompute cycle.open_backorder_count"
          - "increments DistributionOrder.version by 1"

      - from: REQUESTED
        to: BACKORDERED
        trigger: "POST /distribution-orders/{doId}/transitions {to_state: BACKORDERED}"
        actor: WarehouseManager
        preconditions:
          - "do.status == REQUESTED (else ERR_INVALID_STATE)"
        side_effects:
          - "recompute cycle.open_backorder_count"
          - "increments DistributionOrder.version by 1"

      - from: APPROVED
        to: SHIPPED
        trigger: "POST /distribution-orders/{doId}/transitions {to_state: SHIPPED}"
        actor: WarehouseManager
        preconditions:
          - "do.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "InventoryLot.on_hand_units -= quantity; allocated_units -= quantity; in_transit_units += quantity (available_units unchanged by shipment)"
          - "increments DistributionOrder.version by 1"

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /distribution-orders/{doId}/transitions {to_state: RECEIVED}"
        actor: WarehouseManager
        preconditions:
          - "do.status == SHIPPED (else ERR_INVALID_STATE)"
        side_effects:
          - "InventoryLot.in_transit_units -= quantity; delivered_units += quantity"
          - "increments DistributionOrder.version by 1"

      - from: "REQUESTED | APPROVED | BACKORDERED"
        to: CANCELLED
        trigger: "POST /distribution-orders/{doId}/transitions {to_state: CANCELLED} (manual) or system (challenge REMOVED cascade)"
        actor: WarehouseManager
        preconditions:
          - "do.status in {REQUESTED, APPROVED, BACKORDERED} (else ERR_INVALID_STATE)"
        side_effects:
          - "compensation: if status was APPROVED, InventoryLot.allocated_units -= quantity"
          - "recompute cycle.open_backorder_count"
          - "increments DistributionOrder.version by 1"

  - entity: SupplementalRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, REVOKED]
    transitions:
      - from: SUBMITTED
        to: VETTING
        trigger: "POST /supplemental-requests/{srId}/transitions {to_state: VETTING}"
        actor: InstructionalSpecialist
        preconditions:
          - "sr.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments SupplementalRequest.version by 1"

      - from: VETTING
        to: APPROVED
        trigger: "POST /supplemental-requests/{srId}/transitions {to_state: APPROVED}"
        actor: InstructionalSpecialist
        preconditions:
          - "sr.status == VETTING (else ERR_INVALID_STATE)"
          - "X-User-ID != sr.requester_user_id (segregation of duties: else ERR_SEGREGATION_OF_DUTIES)"
          - "ledger of sr.cycle_id: available_balance >= sr.estimated_cost (else ERR_BUDGET_ENVELOPE_EXCEEDED; inclusive boundary: equal passes)"
        side_effects:
          - "sr.approver_user_id = X-User-ID; sr.approved_at = current logical clock"
          - "BudgetLedger.encumbered_total += sr.estimated_cost"
          - "increments SupplementalRequest.version by 1"

      - from: VETTING
        to: DENIED
        trigger: "POST /supplemental-requests/{srId}/transitions {to_state: DENIED}"
        actor: InstructionalSpecialist
        preconditions:
          - "sr.status == VETTING (else ERR_INVALID_STATE)"
        side_effects:
          - "increments SupplementalRequest.version by 1"

      - from: "APPROVED | REAFFIRMED"
        to: UNDER_CHALLENGE
        trigger: "system (automatic when a ChallengeCase targeting this request is filed)"
        actor: system
        preconditions: []
        side_effects:
          - "increments SupplementalRequest.version by 1"
        note: "encumbrance is NOT released while under challenge"

      - from: UNDER_CHALLENGE
        to: REAFFIRMED
        trigger: "system (challenge decided UPHELD)"
        actor: system
        preconditions: []
        side_effects:
          - "increments SupplementalRequest.version by 1"
        note: "REAFFIRMED may be challenged again — the APPROVED/REAFFIRMED <-> UNDER_CHALLENGE loop is cyclic"

      - from: UNDER_CHALLENGE
        to: REVOKED
        trigger: "system (challenge decided RESTRICTED or REMOVED)"
        actor: system
        preconditions: []
        side_effects:
          - "compensation: BudgetLedger.encumbered_total -= sr.estimated_cost"
          - "increments SupplementalRequest.version by 1"

  - entity: ChallengeCase
    initial_state: FILED
    terminal_states: [CLOSED]
    transitions:
      - from: FILED
        to: SCREENING
        trigger: "POST /challenge-cases/{ccId}/transitions {to_state: SCREENING}"
        actor: CurriculumDirector
        preconditions:
          - "challenge.status == FILED (else ERR_INVALID_STATE)"
        side_effects:
          - "increments ChallengeCase.version by 1"

      - from: SCREENING
        to: COMMITTEE_REVIEW
        trigger: "POST /challenge-cases/{ccId}/transitions {to_state: COMMITTEE_REVIEW}"
        actor: CurriculumDirector
        preconditions:
          - "challenge.status in {SCREENING, APPEALED} (else ERR_INVALID_STATE)"
        side_effects:
          - "increments ChallengeCase.version by 1"

      - from: COMMITTEE_REVIEW
        to: HEARING
        trigger: "POST /challenge-cases/{ccId}/transitions {to_state: HEARING}"
        actor: CurriculumDirector
        preconditions:
          - "challenge.status == COMMITTEE_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "increments ChallengeCase.version by 1"

      - from: "COMMITTEE_REVIEW | HEARING"
        to: DECIDED
        trigger: "POST /challenge-cases/{ccId}/transitions {to_state: DECIDED}"
        actor: CommitteeMember
        preconditions:
          - "challenge.status in {COMMITTEE_REVIEW, HEARING} (else ERR_INVALID_STATE)"
          - "at least 3 CommitteeVotes exist for (challenge_id, vote_round == current) (else ERR_QUORUM_NOT_MET; boundary: exactly 3 passes)"
        side_effects:
          - "decision = plurality of current-round votes among UPHOLD/RESTRICT/REMOVE; any tie for the top count resolves to UPHELD; decided_at = current logical clock"
          - "target MATERIAL: UPHELD -> availability UNDER_CHALLENGE -> USABLE; RESTRICTED -> RESTRICTED; REMOVED -> REMOVED with the full removal cascade (DO cancellations, allocation release, lot recompute, cycle.replacement_due)"
          - "target SUPPLEMENTAL_REQUEST: UPHELD -> REAFFIRMED; RESTRICTED or REMOVED -> REVOKED with encumbrance release"
          - "increments ChallengeCase.version by 1"

      - from: DECIDED
        to: APPEALED
        trigger: "POST /challenge-cases/{ccId}/transitions {to_state: APPEALED}"
        actor: CommunityMember
        preconditions:
          - "challenge.status == DECIDED (else ERR_INVALID_STATE)"
          - "X-User-ID == challenge.filer_user_id (else ERR_INSUFFICIENT_PERMISSIONS)"
          - "challenge.appeal_used == false (else ERR_INVALID_STATE)"
          - "current logical clock <= decided_at + 14 days (else ERR_APPEAL_WINDOW_CLOSED; inclusive boundary: exactly decided_at + 14 days passes)"
        side_effects:
          - "appeal_used = true; vote_round += 1"
          - "increments ChallengeCase.version by 1"
        note: "appeal cycle: DECIDED -> APPEALED -> COMMITTEE_REVIEW -> ... -> DECIDED; the second DECIDED is final because appeal_used blocks another appeal"

      - from: DECIDED
        to: CLOSED
        trigger: "POST /challenge-cases/{ccId}/transitions {to_state: CLOSED}"
        actor: CurriculumDirector
        preconditions:
          - "challenge.status == DECIDED (else ERR_INVALID_STATE)"
          - "appeal_used == true OR current logical clock > decided_at + 14 days (else ERR_INVALID_STATE)"
        side_effects:
          - "increments ChallengeCase.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC only; both guard create-with-supersede writes)
# =============================================================================
concurrency_rules:
  - rule_id: award-post-stale-cycle
    parent_entity: AdoptionCycle
    write_endpoint: "POST /adoption-cycles/{cycleId}/award"
    occ_field: "expected_cycle_version"
    description: |
      Posting an award against an AdoptionCycle whose version has advanced since
      the client last read it is rejected. A posted award legitimately supersedes
      the prior award (prior SELECTED quote -> SUPERSEDED), so a writer holding a
      stale cycle version would otherwise silently overwrite a newer award.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

  - rule_id: po-create-stale-cycle
    parent_entity: AdoptionCycle
    write_endpoint: "POST /adoption-cycles/{cycleId}/purchase-orders"
    occ_field: "expected_cycle_version"
    description: |
      Creating a PurchaseOrder against an AdoptionCycle whose version has advanced
      since the client last read it is rejected. Creating a PO legitimately
      supersedes the cycle's existing DRAFT PO, so a writer holding a stale cycle
      version would otherwise supersede a draft it never saw.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: alignment_coverage
    trigger: "on every AlignmentMapping create/upsert for a material; read live by the ALIGNMENT_REVIEW -> PILOT_OPEN gate"
    algorithm: aggregation
    formula: |
      weights: FULL = 1.0, PARTIAL = 0.5, NONE = 0.0
      covered = sum(weight(m.coverage_rating) for m in AlignmentMappings of the material)
      required = the material's cycle's framework.standards_required_count
      coverage_pct = round(100 * covered / required, 2)
    input_set: "all AlignmentMapping rows of the material (any rating); duplicate standard_codes are impossible because (material_id, standard_code) is an upsert key"
    constants:
      FULL_WEIGHT: 1.0
      PARTIAL_WEIGHT: 0.5
      NONE_WEIGHT: 0.0
      ADOPTION_COVERAGE_THRESHOLD_PCT: 85.00
    precision: "2 decimal places, round_half_up"

  - name: pilot_composite_score
    trigger: "PROVISIONAL variant: on TeacherReview create/withdraw; OFFICIAL variant: on cycle close-pilots (PILOT_OPEN -> SCORING)"
    algorithm: weighted_scoring
    formula: |
      per review i: r_i = 0.4*pedagogy_score + 0.3*alignment_score + 0.2*usability_score + 0.1*equity_score  (exact decimal arithmetic)
      pool = all TeacherReviews with status == SUBMITTED whose pilot belongs to the material's cycle and references the material, over pilots in status {ACTIVE, CLOSED}
      PROVISIONAL: composite = round(mean(r_i over pool), 2); null when pool is empty
      OFFICIAL: if |pool| >= TRIM_MIN_REVIEWS: drop exactly one lowest and one highest r_i (one instance each even when tied), mean over the remaining |pool|-2 values, round 2dp;
                if |pool| < TRIM_MIN_REVIEWS: identical to PROVISIONAL
    input_set: "TeacherReviews of the material's pilots in the material's cycle with review status SUBMITTED (WITHDRAWN excluded); pilots in PLANNED or CANCELLED contribute no reviews (reviews can only be created while ACTIVE)"
    constants:
      W_PEDAGOGY: 0.4
      W_ALIGNMENT: 0.3
      W_USABILITY: 0.2
      W_EQUITY: 0.1
      TRIM_MIN_REVIEWS: 5
    precision: "2 decimal places, round_half_up"
    variants:
      - name: PROVISIONAL
        when: "live read while pilots run (material.provisional_composite)"
        difference: "untrimmed mean over all SUBMITTED reviews; recomputed on every review create/withdraw"
      - name: OFFICIAL
        when: "computed and persisted (material.official_composite) when the cycle enters SCORING"
        difference: "with >= 5 reviews, drops one lowest and one highest composite before averaging — same data yields a different value whenever an extreme review exists"

  - name: participation_rate
    trigger: "on cycle close-pilots (PILOT_OPEN -> SCORING)"
    algorithm: aggregation
    formula: |
      seats = sum(teacher_count over the material's pilots in this cycle with status in {ACTIVE, CLOSED})
      submitted = count of TeacherReviews with status SUBMITTED over those same pilots
      participation_rate = (seats == 0) ? null : round(submitted / seats, 4)
    input_set: "pilots of the material in this cycle with status in {ACTIVE, CLOSED} at close-pilots time; CANCELLED pilots are excluded from the denominator"
    constants:
      PARTICIPATION_FLOOR: 0.60
    precision: "4 decimal places, round_half_up"

  - name: bundled_pricing_total
    trigger: "quote enters UNDER_EVALUATION (evaluate/resubmit) -> evaluated_total; PurchaseOrder creation -> total_amount (same formula, PO quantities priced off the pinned quote's rates)"
    algorithm: aggregation
    formula: |
      print_line  = round(print_unit_price * print_quantity, 2)
      digital_line = round(digital_seat_rate * digital_seat_count, 2)
      if bundle_discount_pct > 0 AND print_quantity > 0 AND digital_seat_count > 0:
          digital_line = round(digital_line * (1 - bundle_discount_pct), 2)   # discount applied AFTER the per-line rounding, then rounded again
      total = print_line + digital_line                                       # sum of pre-rounded lines
      PINNED ROUNDING ORDER: round each line to cents FIRST, apply the bundle discount to the digital line SECOND (rounding again), sum LAST.
      The alternative order (sum unrounded lines, then round once) yields different cents and is NOT the specification.
    input_set: "the quote's (or PO's) own pricing and quantity fields only"
    constants: {}
    precision: "2 decimal places, round_half_up, per line before summation"

  - name: best_value_score
    trigger: "at award time, for every responsive quote in the pool, when cycle.award_method == BEST_VALUE"
    algorithm: weighted_scoring
    formula: |
      pool = quotes of this cycle with status UNDER_EVALUATION whose material_id == cycle.adopted_material_id (the award target included)
      min_total = min(evaluated_total over pool)
      price_score(q) = 100 if min_total == 0 else max(0, 100 * (2 - q.evaluated_total / min_total))     # cheapest responsive quote scores 100; a quote at 2x the minimum scores 0
      training_score(q) = min(100, q.training_sessions * 10)
      license_score(q) = min(100, q.license_years * 20)
      best_value_score(q) = round(0.50 * price_score(q) + 0.25 * training_score(q) + 0.25 * license_score(q), 2)
      No intermediate rounding: price_score/training_score/license_score are combined at full precision and only the final score is rounded.
    input_set: "responsive quotes = status UNDER_EVALUATION, same cycle, adopted material only"
    constants:
      W_PRICE: 0.50
      W_TRAINING: 0.25
      W_LICENSE: 0.25
      TRAINING_POINTS_PER_SESSION: 10
      LICENSE_POINTS_PER_YEAR: 20
    precision: "2 decimal places, round_half_up, final value only"

  - name: budget_ledger_balances
    trigger: "incrementally on: budget-appropriation, PO issue, PO pay, PO cancel, supplemental approve, supplemental revoke; audited by the invariant below"
    algorithm: aggregation
    formula: |
      available_balance = appropriation_total - encumbered_total - expended_total   (always; derived on read)
      Event deltas:
        budget-appropriation(amount):            appropriation_total += amount
        PO issue:                                encumbered_total += po.total_amount
        PO pay(amount):                          encumbered_total -= amount; expended_total += amount
        PO cancel (from ISSUED/PARTIALLY_RECEIVED): encumbered_total -= (po.total_amount - po.amount_paid)
        supplemental approve:                    encumbered_total += sr.estimated_cost
        supplemental revoke:                     encumbered_total -= sr.estimated_cost
      INVARIANT (money conservation): appropriation_total == available_balance + encumbered_total + expended_total
      Reconciliation view (audit formula, must agree with the incremental value):
        encumbered_total == sum(total_amount - amount_paid over POs with order_status in {ISSUED, PARTIALLY_RECEIVED, RECEIVED} and payment_status in {ENCUMBERED, PARTIALLY_PAID})
                          + sum(estimated_cost over SupplementalRequests of this cycle with status in {APPROVED, UNDER_CHALLENGE, REAFFIRMED})
    input_set: "POs and SupplementalRequests of the cycle in the statuses listed above"
    constants: {}
    precision: "2 decimal places, round_half_up"

  - name: inventory_availability
    trigger: "on DO approve/backorder/ship/receive/cancel and on PO receipt (including the promotion pass)"
    algorithm: aggregation
    formula: |
      allocated_units = sum(quantity over DistributionOrders of the material with status == APPROVED)
      available_units = on_hand_units - allocated_units
      INVARIANT (unit conservation): total_received_units == on_hand_units + in_transit_units + delivered_units
      receive(qty): on_hand_units += qty; total_received_units += qty
      approve(qty): allocated_units += qty
      ship(qty):    on_hand_units -= qty; allocated_units -= qty; in_transit_units += qty
      receive-at-school(qty): in_transit_units -= qty; delivered_units += qty
      cancel(qty from APPROVED): allocated_units -= qty
    input_set: "DistributionOrders of the material with status == APPROVED for the derived allocation"
    constants: {}
    precision: "integer units"

  - name: budget_forecast
    trigger: "on read: GET /adoption-cycles/{cycleId}/budget-forecast?variant=ROLLING|STRAIGHT_LINE"
    algorithm: forward_looking
    formula: |
      EVALUATION ORDER (pinned, resolves the circular-looking dependency between the base and the contingency tier):
        1. compute base_amount and round to 2dp
        2. select contingency_rate from the tier table keyed on the ROUNDED base_amount
        3. forecast_total = round(base_amount * (1 + contingency_rate), 2)
      base_amount by variant:
        ROLLING (forward-looking):
          base_amount = round(district_enrollment * PER_PUPIL_RATE * REPLACEMENT_RATIO * FORECAST_YEARS, 2)
        STRAIGHT_LINE (chronological):
          history = expended_total of the FORECAST_HISTORY_CYCLES most recent OTHER cycles with status in {ACTIVE, SUNSET}, ordered by school_year_start DESC (tie: created_at ASC — never id)
          if history is empty: base_amount = 0.00
          else: base_amount = round(mean(history) * (1 + INFLATION_FACTOR)^FORECAST_YEARS, 2)
      contingency tiers (keyed on rounded base_amount):
        base_amount < 100000.00                 -> 0.05
        100000.00 <= base_amount < 500000.00    -> 0.08
        base_amount >= 500000.00                -> 0.12
    input_set: "ROLLING: the cycle's district_enrollment; STRAIGHT_LINE: other cycles in {ACTIVE, SUNSET} (the queried cycle is excluded even if it qualifies)"
    constants:
      PER_PUPIL_RATE: 120.00
      REPLACEMENT_RATIO: 0.20
      FORECAST_YEARS: 5
      INFLATION_FACTOR: 0.03
      FORECAST_HISTORY_CYCLES: 3
    precision: "2 decimal places, round_half_up; base rounded before tier lookup and before the final multiply"
    variants:
      - name: ROLLING
        when: "variant=ROLLING"
        difference: "forward-looking driver model from enrollment; ignores historical spend"
      - name: STRAIGHT_LINE
        when: "variant=STRAIGHT_LINE"
        difference: "chronological model from prior completed cycles' expended_total with an inflation multiplier; identical cycle state yields a different forecast than ROLLING"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is one of the nine declared roles"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "the caller's role is listed in the endpoint's roles; plus user-level ownership rules: review withdraw requires the owning teacher, challenge appeal requires the filer"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "path ids exist, validated left-to-right; body-referenced ids (framework_id, material_id, quote_id, target_id per target_type) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with resource ids"

  - priority: 4
    category: existence
    check: "request shape: required fields present; enum values in range; integer quantities >= 1 (teacher_count, standards_required_count); prices >= 0; amount > 0; estimated_cost > 0; ends_on > starts_on; pagination limit in 1..100 and offset >= 0 (ERR_INVALID_PAGINATION_PARAMETERS on list endpoints)"
    error_id: "ERR_VALIDATION / ERR_INVALID_PAGINATION_PARAMETERS"
    http_status: 400
    applies_to: "all endpoints with a body; list endpoints"

  - priority: 5
    category: state
    check: "target entity is in the required from-state for the requested transition/action; includes cross-entity state gates: pilot activate requires cycle PILOT_OPEN; close-pilots requires all pilots CLOSED/CANCELLED (ERR_UNRESOLVED_PILOTS); cycle activate requires all POs and DOs terminal (ERR_OPEN_WORK_REMAINS)"
    error_id: "ERR_INVALID_STATE / ERR_UNRESOLVED_PILOTS / ERR_OPEN_WORK_REMAINS"
    http_status: 409
    applies_to: "all transition and action endpoints"

  - priority: 6
    category: state
    check: "OCC: expected_cycle_version equals the cycle's current version on award and PO create; evaluated after the entity's own state preconditions (p5) and before all business rules"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /adoption-cycles/{cycleId}/award; POST /adoption-cycles/{cycleId}/purchase-orders"

  - priority: 7
    category: business_temporal
    check: "pilot activation date reached (ERR_PILOT_NOT_STARTED); public review closed before board (ERR_PUBLIC_REVIEW_NOT_CLOSED); challenge filed within 90 days of adopted_at/approved_at (ERR_CHALLENGE_WINDOW_CLOSED); appeal within 14 days of decided_at (ERR_APPEAL_WINDOW_CLOSED)"
    error_id: "ERR_PILOT_NOT_STARTED / ERR_PUBLIC_REVIEW_NOT_CLOSED / ERR_CHALLENGE_WINDOW_CLOSED / ERR_APPEAL_WINDOW_CLOSED"
    http_status: 409
    applies_to: "pilot transitions, cycle transitions, challenge create, challenge appeal"

  - priority: 8
    category: business_temporal
    check: "interval occupation conflicts: pilot half-open [starts_on, ends_on) overlap on same school_code + subject among PLANNED/ACTIVE pilots (ERR_PILOT_WINDOW_CONFLICT); public-review closed-window 30-day gap per subject_area (ERR_PUBLIC_REVIEW_WINDOW_CONFLICT)"
    error_id: "ERR_PILOT_WINDOW_CONFLICT / ERR_PUBLIC_REVIEW_WINDOW_CONFLICT"
    http_status: 409
    applies_to: "POST /adoption-cycles/{cycleId}/pilots; cycle transition to PUBLIC_REVIEW"

  - priority: 9
    category: business_safety
    check: "material frozen by an open challenge (availability_status != USABLE) blocks distribution create/approve (ERR_MATERIAL_FROZEN); segregation of duties: supplemental approver != requester, challenge voter != filer (ERR_SEGREGATION_OF_DUTIES, 403)"
    error_id: "ERR_MATERIAL_FROZEN / ERR_SEGREGATION_OF_DUTIES"
    http_status: 409
    applies_to: "distribution create/approve; supplemental approve; vote cast"

  - priority: 10
    category: business_constraint
    check: "domain thresholds and structural constraints: coverage >= 85.00 (ERR_ALIGNMENT_COVERAGE_BELOW_THRESHOLD), at least one VETTED material (ERR_NO_VETTED_MATERIALS), official_composite >= 3.20 (ERR_COMPOSITE_BELOW_THRESHOLD, checked first) then participation_rate >= 0.60 (ERR_PARTICIPATION_BELOW_FLOOR), bid pool size (ERR_BID_RULE_NOT_SATISFIED), winner rule (ERR_QUOTE_NOT_AWARD_WINNER), quote selected + pinned (ERR_QUOTE_NOT_SELECTED), quote material == adopted material (ERR_QUOTE_MATERIAL_MISMATCH), inventory sufficient (ERR_INSUFFICIENT_INVENTORY), no over-receipt (ERR_OVER_RECEIPT), payment within balance (ERR_PAYMENT_EXCEEDS_BALANCE), close requires PAID (ERR_PO_NOT_CLOSABLE), quorum >= 3 (ERR_QUORUM_NOT_MET), no duplicate vote per round (ERR_DUPLICATE_VOTE), no duplicate submitted review per teacher per pilot (ERR_DUPLICATE_REVIEW), one open challenge per target (ERR_OPEN_CHALLENGE_EXISTS)"
    error_id: "ERR_ALIGNMENT_COVERAGE_BELOW_THRESHOLD / ERR_NO_VETTED_MATERIALS / ERR_COMPOSITE_BELOW_THRESHOLD / ERR_PARTICIPATION_BELOW_FLOOR / ERR_BID_RULE_NOT_SATISFIED / ERR_QUOTE_NOT_AWARD_WINNER / ERR_QUOTE_NOT_SELECTED / ERR_QUOTE_MATERIAL_MISMATCH / ERR_INSUFFICIENT_INVENTORY / ERR_OVER_RECEIPT / ERR_PO_NOT_CLOSABLE / ERR_PAYMENT_EXCEEDS_BALANCE / ERR_QUORUM_NOT_MET / ERR_DUPLICATE_VOTE / ERR_DUPLICATE_REVIEW / ERR_OPEN_CHALLENGE_EXISTS"
    http_status: 409
    applies_to: "business action endpoints"

  - priority: 11
    category: business_referential
    check: "framework ACTIVE and subject/grade match on cycle create (ERR_FRAMEWORK_MISMATCH); distribution target material is ADOPTED (ERR_MATERIAL_NOT_ADOPTED); challenge target eligible: material ADOPTED / supplemental in {APPROVED, REAFFIRMED} (ERR_CHALLENGE_TARGET_INVALID)"
    error_id: "ERR_FRAMEWORK_MISMATCH / ERR_MATERIAL_NOT_ADOPTED / ERR_CHALLENGE_TARGET_INVALID"
    http_status: 409
    applies_to: "cycle create, distribution create, challenge create"

  - priority: 12
    category: business_fiscal
    check: "funds sufficient: PO create and issue and supplemental approve require available_balance >= amount (inclusive: equal passes)"
    error_id: ERR_BUDGET_ENVELOPE_EXCEEDED
    http_status: 402
    applies_to: "PO create, PO issue, supplemental approve"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving logical clock (default time 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. All window/deadline rules (pilot activation, public review close, challenge window, appeal window, filed_at/decided_at/adopted_at/approved_at stamps) read this clock."
    roles: [DistrictAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- CurriculumFramework ---
  - method: POST
    path: "/frameworks"
    description: "Create a state curriculum framework"
    roles: [DistrictAdmin]
    code: 201
    input: [code, subject_area, grade_band, standards_required_count, effective_year, "status?"]
    output: CurriculumFramework
    side_effects: []

  - method: GET
    path: "/frameworks"
    description: "List frameworks"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "subject_area?", "status?"]
    output: "CurriculumFramework[]"
    side_effects: []

  - method: GET
    path: "/frameworks/{frameworkId}"
    description: "Get one framework"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: CurriculumFramework
    side_effects: []

  # --- AdoptionCycle ---
  - method: POST
    path: "/adoption-cycles"
    description: "Create an adoption cycle; framework must exist, be ACTIVE, and match subject_area/grade_band (ERR_FRAMEWORK_MISMATCH)"
    roles: [CurriculumDirector]
    code: 201
    input: [subject_area, grade_band, school_year_start, framework_id, district_enrollment, "award_method?"]
    output: AdoptionCycle
    side_effects:
      - "status = DRAFT"
      - "BudgetLedger auto-created for the cycle (appropriation_total=0, encumbered_total=0, expended_total=0)"

  - method: GET
    path: "/adoption-cycles"
    description: "List adoption cycles"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "framework_id?", "subject_area?", "status?"]
    output: "AdoptionCycle[]"
    side_effects: []

  - method: GET
    path: "/adoption-cycles/{cycleId}"
    description: "Get one adoption cycle (includes version for OCC clients)"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: AdoptionCycle
    side_effects: []

  - method: POST
    path: "/adoption-cycles/{cycleId}/transitions"
    description: "Drive the cycle state machine. to_state one of ALIGNMENT_REVIEW | PILOT_OPEN | DRAFT | SCORING | PUBLIC_REVIEW | BOARD_PENDING | ACTIVE | SUNSET; per-transition role and preconditions per the AdoptionCycle state machine"
    roles: [CurriculumDirector, InstructionalSpecialist, BoardSecretary]
    code: 200
    input: [to_state]
    output: AdoptionCycle
    side_effects:
      - "per AdoptionCycle state machine, including the close-pilots computation of official_composite/participation_rate and the public-review window stamps"

  - method: POST
    path: "/adoption-cycles/{cycleId}/board-decision"
    description: "Board adopts one material (decision=ADOPT) or rejects the slate (decision=REJECT)"
    roles: [BoardSecretary]
    code: 200
    input: [material_id, decision]
    output: AdoptionCycle
    side_effects:
      - "ADOPT: target material -> ADOPTED (adopted_at stamped), all other PILOT_CANDIDATE materials -> REJECTED, cycle -> ADOPTED, adopted_material_id set"
      - "REJECT: all PILOT_CANDIDATE materials -> REJECTED, cycle -> NOT_ADOPTED"
      - "increments AdoptionCycle.version by 1"

  - method: POST
    path: "/adoption-cycles/{cycleId}/award"
    description: "Award the contract to a quote (OCC-guarded; re-award legitimately supersedes the prior SELECTED quote). Check order after state and OCC: quote.material_id == adopted_material_id (ERR_QUOTE_MATERIAL_MISMATCH) -> responsive pool size (ERR_BID_RULE_NOT_SATISFIED) -> winner rule (ERR_QUOTE_NOT_AWARD_WINNER)"
    roles: [ProcurementOfficer]
    code: 200
    input: [quote_id, expected_cycle_version]
    output: AdoptionCycle
    side_effects:
      - "target quote UNDER_EVALUATION -> SELECTED; cycle.pinned_quote_id = quote.id, quote_version_pin = quote.version"
      - "all other responsive quotes of the pool (UNDER_EVALUATION, same adopted material) -> REJECTED"
      - "on re-award: the previously SELECTED quote -> SUPERSEDED"
      - "when award_method == BEST_VALUE: compute and persist best_value_score on every quote in the pool"
      - "cycle ADOPTED -> PROCURING (re-award while PROCURING keeps PROCURING)"
      - "increments AdoptionCycle.version by 1"

  - method: POST
    path: "/adoption-cycles/{cycleId}/budget-appropriation"
    description: "Post an additive appropriation to the cycle's BudgetLedger"
    roles: [DistrictAdmin]
    code: 200
    input: [amount]
    output: BudgetLedger
    side_effects:
      - "appropriation_total += amount (amount must be > 0)"

  - method: GET
    path: "/adoption-cycles/{id}/budget-ledger"
    description: "Read the cycle's BudgetLedger as an array of length 0 or 1 (available_balance derived on read)"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: "BudgetLedger[]"
    side_effects: []

  - method: GET
    path: "/adoption-cycles/{cycleId}/budget-forecast"
    description: "Computed read: replacement budget forecast for the cycle under the requested variant"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: [variant]
    output: { variant: string, base_amount: number, contingency_rate: number, forecast_total: number }
    side_effects: []

  # --- InstructionalMaterial ---
  - method: POST
    path: "/adoption-cycles/{cycleId}/materials"
    description: "Submit a material into a cycle (cycle must be in DRAFT or ALIGNMENT_REVIEW)"
    roles: [CurriculumDirector]
    code: 201
    input: [title, publisher_name, "isbn?", "material_type?"]
    output: InstructionalMaterial
    side_effects:
      - "adoption_status = SUBMITTED; availability_status = USABLE; coverage_pct = 0.00"

  - method: GET
    path: "/materials"
    description: "List materials"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "cycle_id?", "adoption_status?", "availability_status?"]
    output: "InstructionalMaterial[]"
    side_effects: []

  - method: GET
    path: "/materials/{materialId}"
    description: "Get one material"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: InstructionalMaterial
    side_effects: []

  - method: POST
    path: "/materials/{materialId}/transitions"
    description: "Drive the material adoption dimension: to_state one of VETTED | REJECTED (from SUBMITTED)"
    roles: [InstructionalSpecialist]
    code: 200
    input: [to_state]
    output: InstructionalMaterial
    side_effects:
      - "per InstructionalMaterial state machine"

  - method: POST
    path: "/materials/{id}/alignments"
    description: "Create or upsert an alignment mapping (material_id, standard_code); 201 on create, 200 on update"
    roles: [InstructionalSpecialist]
    code: 201
    input: [standard_code, coverage_rating]
    output: AlignmentMapping
    side_effects:
      - "recompute the material's coverage_pct"

  - method: GET
    path: "/materials/{id}/alignments"
    description: "List alignment mappings of a material"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?"]
    output: "AlignmentMapping[]"
    side_effects: []

  # --- PilotProgram ---
  - method: POST
    path: "/adoption-cycles/{cycleId}/pilots"
    description: "Plan a pilot of a VETTED material at a school; requires cycle status PILOT_OPEN and material adoption_status VETTED (ERR_INVALID_STATE); half-open window overlap with existing PLANNED/ACTIVE pilots at the same school for the cycle's subject is rejected"
    roles: [CurriculumDirector]
    code: 201
    input: [material_id, school_code, starts_on, ends_on, teacher_count]
    output: PilotProgram
    side_effects:
      - "status = PLANNED"

  - method: GET
    path: "/pilots"
    description: "List pilots"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "cycle_id?", "material_id?", "school_code?", "status?"]
    output: "PilotProgram[]"
    side_effects: []

  - method: GET
    path: "/pilots/{pilotId}"
    description: "Get one pilot"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: PilotProgram
    side_effects: []

  - method: POST
    path: "/pilots/{pilotId}/transitions"
    description: "Drive the pilot machine: to_state one of ACTIVE | CLOSED | CANCELLED"
    roles: [CurriculumDirector]
    code: 200
    input: [to_state]
    output: PilotProgram
    side_effects:
      - "per PilotProgram state machine; activation promotes the material VETTED -> PILOT_CANDIDATE"

  - method: POST
    path: "/pilots/{id}/reviews"
    description: "Teacher submits a rubric review for an ACTIVE pilot; one SUBMITTED review per teacher per pilot"
    roles: [Teacher]
    code: 201
    input: [pedagogy_score, alignment_score, usability_score, equity_score]
    output: TeacherReview
    side_effects:
      - "review_composite computed; pilot.submitted_review_count recomputed; material.provisional_composite recomputed (PROVISIONAL variant)"

  - method: GET
    path: "/pilots/{id}/reviews"
    description: "List reviews of a pilot"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "TeacherReview[]"
    side_effects: []

  - method: POST
    path: "/reviews/{reviewId}/withdraw"
    description: "Owning teacher withdraws a SUBMITTED review while the pilot is ACTIVE"
    roles: [Teacher]
    code: 200
    input: []
    output: TeacherReview
    side_effects:
      - "status -> WITHDRAWN; pilot.submitted_review_count and material.provisional_composite recomputed"

  # --- PublisherQuote ---
  - method: POST
    path: "/adoption-cycles/{cycleId}/quotes"
    description: "Submit a publisher quote for a material of the cycle; cycle status must be in {PILOT_OPEN, SCORING, PUBLIC_REVIEW, BOARD_PENDING, ADOPTED, PROCURING} and the material's adoption_status in {VETTED, PILOT_CANDIDATE, ADOPTED}"
    roles: [ProcurementOfficer]
    code: 201
    input: [material_id, publisher_name, print_unit_price, print_quantity, digital_seat_rate, digital_seat_count, "bundle_discount_pct?", training_sessions, license_years]
    output: PublisherQuote
    side_effects:
      - "status = SUBMITTED; submitted_at = current logical clock"

  - method: GET
    path: "/quotes"
    description: "List quotes"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "cycle_id?", "material_id?", "status?"]
    output: "PublisherQuote[]"
    side_effects: []

  - method: GET
    path: "/quotes/{quoteId}"
    description: "Get one quote"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: PublisherQuote
    side_effects: []

  - method: POST
    path: "/quotes/{quoteId}/transitions"
    description: "Drive the quote machine: to_state one of UNDER_EVALUATION | CLARIFICATION_REQUESTED | WITHDRAWN; UNDER_EVALUATION from CLARIFICATION_REQUESTED is a resubmit accepting optional updated pricing/service fields and recomputing evaluated_total"
    roles: [ProcurementOfficer]
    code: 200
    input: [to_state, "print_unit_price?", "print_quantity?", "digital_seat_rate?", "digital_seat_count?", "bundle_discount_pct?", "training_sessions?", "license_years?"]
    output: PublisherQuote
    side_effects:
      - "per PublisherQuote state machine (evaluated_total compute, pin clear on SELECTED -> CLARIFICATION_REQUESTED)"

  # --- PurchaseOrder ---
  - method: POST
    path: "/adoption-cycles/{cycleId}/purchase-orders"
    description: "Create a DRAFT PO against the cycle's pinned SELECTED quote (OCC-guarded; supersedes an existing DRAFT PO of the cycle); total_amount priced via bundled_pricing_total off the quote's rates"
    roles: [ProcurementOfficer]
    code: 201
    input: [quote_id, print_quantity, digital_seat_count, expected_cycle_version]
    output: PurchaseOrder
    side_effects:
      - "total_amount computed; quote_version_pin copied from the quote; any existing DRAFT PO of the cycle -> SUPERSEDED"
      - "precondition: quote.status == SELECTED AND quote.id == cycle.pinned_quote_id AND quote.version == cycle.quote_version_pin (else ERR_QUOTE_NOT_SELECTED)"
      - "precondition: ledger.available_balance >= total_amount (else ERR_BUDGET_ENVELOPE_EXCEEDED)"
      - "increments AdoptionCycle.version by 1"

  - method: GET
    path: "/purchase-orders"
    description: "List purchase orders"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "cycle_id?", "quote_id?", "order_status?", "payment_status?"]
    output: "PurchaseOrder[]"
    side_effects: []

  - method: GET
    path: "/purchase-orders/{poId}"
    description: "Get one purchase order"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects: []

  - method: POST
    path: "/purchase-orders/{poId}/issue"
    description: "Issue a DRAFT PO; encumbers total_amount on the cycle ledger"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects:
      - "order_status DRAFT -> ISSUED; payment_status UNENCUMBERED -> ENCUMBERED; encumbered_total += total_amount"

  - method: POST
    path: "/purchase-orders/{poId}/receive"
    description: "Post a publisher receipt; advances order_status, feeds the inventory lot, and runs the backorder promotion pass"
    roles: [WarehouseManager]
    code: 200
    input: [qty_received]
    output: PurchaseOrder
    side_effects:
      - "per PurchaseOrder state machine: lot upsert, head-of-line backorder promotion (need_priority DESC, created_at ASC), open_backorder_count recompute, first-receipt cycle auto-advance to DISTRIBUTING"

  - method: POST
    path: "/purchase-orders/{poId}/pay"
    description: "Pay against an issued PO; moves encumbered -> expended"
    roles: [ProcurementOfficer]
    code: 200
    input: [amount]
    output: PurchaseOrder
    side_effects:
      - "amount_paid += amount; payment_status -> PARTIALLY_PAID | PAID; encumbered_total -= amount; expended_total += amount"

  - method: POST
    path: "/purchase-orders/{poId}/cancel"
    description: "Cancel a non-terminal PO; releases the unpaid encumbrance"
    roles: [ProcurementOfficer]
    code: 200
    input: []
    output: PurchaseOrder
    side_effects:
      - "order_status -> CANCELLED; payment_status -> RELEASED; encumbered_total -= (total_amount - amount_paid) when encumbered"

  - method: POST
    path: "/purchase-orders/{poId}/transitions"
    description: "Close a fully-received, fully-paid PO (to_state: CLOSED)"
    roles: [ProcurementOfficer]
    code: 200
    input: [to_state]
    output: PurchaseOrder
    side_effects:
      - "order_status RECEIVED -> CLOSED (requires payment_status == PAID)"

  # --- InventoryLot ---
  - method: GET
    path: "/materials/{id}/inventory-lots"
    description: "Get the inventory lot of a material as an array of length 0 or 1 (lot auto-created on first receipt)"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: "InventoryLot[]"
    side_effects: []

  - method: GET
    path: "/materials/{id}/distribution-orders"
    description: "List distribution orders targeting a material"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DistributionOrder[]"
    side_effects: []

  # --- DistributionOrder ---
  - method: POST
    path: "/distribution-orders"
    description: "Request classroom distribution of an adopted, usable material"
    roles: [WarehouseManager]
    code: 201
    input: [material_id, school_code, classroom_label, quantity, need_priority]
    output: DistributionOrder
    side_effects:
      - "status = REQUESTED"
      - "preconditions: material.adoption_status == ADOPTED (ERR_MATERIAL_NOT_ADOPTED) and material.availability_status == USABLE (ERR_MATERIAL_FROZEN)"

  - method: GET
    path: "/distribution-orders"
    description: "List distribution orders"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "material_id?", "school_code?", "status?"]
    output: "DistributionOrder[]"
    side_effects: []

  - method: POST
    path: "/distribution-orders/{doId}/transitions"
    description: "Drive the distribution machine: to_state one of APPROVED | BACKORDERED | SHIPPED | RECEIVED | CANCELLED"
    roles: [WarehouseManager]
    code: 200
    input: [to_state]
    output: DistributionOrder
    side_effects:
      - "per DistributionOrder state machine (allocation, shipment ledger, cancellation compensation, open_backorder_count recompute)"

  # --- SupplementalRequest ---
  - method: POST
    path: "/supplemental-requests"
    description: "Teacher requests a supplemental material purchase"
    roles: [Teacher]
    code: 201
    input: [cycle_id, title, publisher_name, estimated_cost, subject_area, grade_band, school_code, "justification?"]
    output: SupplementalRequest
    side_effects:
      - "status = SUBMITTED; requester_user_id = X-User-ID"

  - method: GET
    path: "/supplemental-requests"
    description: "List supplemental requests"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "cycle_id?", "status?"]
    output: "SupplementalRequest[]"
    side_effects: []

  - method: GET
    path: "/supplemental-requests/{srId}"
    description: "Get one supplemental request"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: SupplementalRequest
    side_effects: []

  - method: POST
    path: "/supplemental-requests/{srId}/transitions"
    description: "Drive the vetting machine: to_state one of VETTING | APPROVED | DENIED; approval enforces segregation of duties and commits estimated_cost to the cycle ledger"
    roles: [InstructionalSpecialist]
    code: 200
    input: [to_state]
    output: SupplementalRequest
    side_effects:
      - "per SupplementalRequest state machine (encumbrance commit on approve)"

  # --- ChallengeCase ---
  - method: POST
    path: "/challenge-cases"
    description: "Community member files a challenge against an adopted material (within 90 days of adopted_at) or an approved/reaffirmed supplemental request (within 90 days of approved_at); one open challenge per target"
    roles: [CommunityMember]
    code: 201
    input: [target_type, target_id, grounds]
    output: ChallengeCase
    side_effects:
      - "status = FILED; filer_user_id = X-User-ID; filed_at = current logical clock; vote_round = 1"
      - "target MATERIAL with availability USABLE -> UNDER_CHALLENGE; target SUPPLEMENTAL_REQUEST in APPROVED/REAFFIRMED -> UNDER_CHALLENGE"

  - method: GET
    path: "/challenge-cases"
    description: "List challenge cases"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "target_id?", "status?"]
    output: "ChallengeCase[]"
    side_effects: []

  - method: GET
    path: "/challenge-cases/{ccId}"
    description: "Get one challenge case"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: []
    output: ChallengeCase
    side_effects: []

  - method: POST
    path: "/challenge-cases/{ccId}/transitions"
    description: "Drive the challenge machine: to_state one of SCREENING | COMMITTEE_REVIEW | HEARING | DECIDED | APPEALED | CLOSED; DECIDED aggregates current-round votes and fires the target cascade"
    roles: [CurriculumDirector, CommitteeMember, CommunityMember]
    code: 200
    input: [to_state]
    output: ChallengeCase
    side_effects:
      - "per ChallengeCase state machine (decision plurality, material removal cascade, supplemental reaffirm/revoke, appeal round bookkeeping)"

  - method: POST
    path: "/challenge-cases/{id}/votes"
    description: "Committee member casts an immutable vote for the current vote_round; the filer may not vote; one vote per member per round"
    roles: [CommitteeMember]
    code: 201
    input: [vote]
    output: CommitteeVote
    side_effects:
      - "voter_user_id = X-User-ID; vote_round pinned from the challenge"

  - method: GET
    path: "/challenge-cases/{id}/votes"
    description: "List votes of a challenge (all rounds)"
    roles: [DistrictAdmin, CurriculumDirector, InstructionalSpecialist, BoardSecretary, ProcurementOfficer, WarehouseManager, Teacher, CommitteeMember, CommunityMember]
    code: 200
    input: ["limit?", "offset?", "vote_round?"]
    output: "CommitteeVote[]"
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of the nine declared roles" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not allowed for this endpoint; or user-level ownership violated (withdrawing another teacher's review, appealing another member's challenge)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path id (validated left-to-right) or a body-referenced id does not exist; message names the resource type" }
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing, enum out of range, quantity/price/amount bounds violated, or ends_on <= starts_on" }
  - { id: ERR_INVALID_PAGINATION_PARAMETERS, http: 400, condition: "limit outside 1..100 or offset < 0 on a list endpoint" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity (or a cross-entity gate such as cycle status for pilot activation) is not in the required from-state for the requested transition" }
  - { id: ERR_UNRESOLVED_PILOTS, http: 409, condition: "close-pilots attempted while a pilot of the cycle is still PLANNED or ACTIVE" }
  - { id: ERR_OPEN_WORK_REMAINS, http: 409, condition: "cycle activation attempted with non-terminal purchase orders or distribution orders" }
  - { id: ERR_PILOT_NOT_STARTED, http: 409, condition: "pilot activation attempted before starts_on per the logical clock" }
  - { id: ERR_PUBLIC_REVIEW_NOT_CLOSED, http: 409, condition: "close-public-review attempted before public_review_closes_at per the logical clock" }
  - { id: ERR_CHALLENGE_WINDOW_CLOSED, http: 409, condition: "challenge filed more than 90 days after the target's adopted_at/approved_at" }
  - { id: ERR_APPEAL_WINDOW_CLOSED, http: 409, condition: "appeal attempted more than 14 days after decided_at" }
  - { id: ERR_PILOT_WINDOW_CONFLICT, http: 409, condition: "new pilot's half-open [starts_on, ends_on) window overlaps a PLANNED/ACTIVE pilot at the same school_code for the cycle's subject_area" }
  - { id: ERR_PUBLIC_REVIEW_WINDOW_CONFLICT, http: 409, condition: "new public review window fails the 30-day clear-gap rule against another same-subject cycle's closed window" }
  - { id: ERR_MATERIAL_FROZEN, http: 409, condition: "distribution create/approve attempted while the material's availability_status is UNDER_CHALLENGE, RESTRICTED, or REMOVED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "supplemental approver equals requester, or challenge voter equals the case filer" }
  - { id: ERR_ALIGNMENT_COVERAGE_BELOW_THRESHOLD, http: 409, condition: "a VETTED material's coverage_pct is below 85.00 at the alignment gate" }
  - { id: ERR_NO_VETTED_MATERIALS, http: 409, condition: "alignment gate attempted with no VETTED material in the cycle" }
  - { id: ERR_COMPOSITE_BELOW_THRESHOLD, http: 409, condition: "board adoption attempted with official_composite below 3.20 (or null)" }
  - { id: ERR_PARTICIPATION_BELOW_FLOOR, http: 409, condition: "board adoption attempted with participation_rate below 0.60 (or null)" }
  - { id: ERR_BID_RULE_NOT_SATISFIED, http: 409, condition: "responsive pool smaller than required: >= 3 when the target quote's evaluated_total >= 250000.00, else >= 2 (inclusive threshold: exactly 250000.00 is formal)" }
  - { id: ERR_QUOTE_NOT_AWARD_WINNER, http: 409, condition: "award target is not the rule winner: LOWEST_RESPONSIVE requires the minimum evaluated_total (ties broken by earliest created_at); BEST_VALUE requires the maximum best_value_score (ties broken by earliest created_at)" }
  - { id: ERR_QUOTE_NOT_SELECTED, http: 409, condition: "PO create attempted with a quote that is not the cycle's currently pinned SELECTED quote (never selected, superseded, or pin cleared)" }
  - { id: ERR_QUOTE_MATERIAL_MISMATCH, http: 409, condition: "award target quote's material_id differs from the cycle's adopted_material_id" }
  - { id: ERR_INSUFFICIENT_INVENTORY, http: 409, condition: "distribution approval attempted with available_units < quantity" }
  - { id: ERR_OVER_RECEIPT, http: 409, condition: "receipt would push received_print_qty beyond print_quantity" }
  - { id: ERR_PO_NOT_CLOSABLE, http: 409, condition: "close attempted while payment_status != PAID" }
  - { id: ERR_PAYMENT_EXCEEDS_BALANCE, http: 409, condition: "payment amount exceeds total_amount - amount_paid" }
  - { id: ERR_QUORUM_NOT_MET, http: 409, condition: "decision attempted with fewer than 3 votes in the current vote_round" }
  - { id: ERR_DUPLICATE_VOTE, http: 409, condition: "voter already cast a vote for this challenge in the current vote_round" }
  - { id: ERR_DUPLICATE_REVIEW, http: 409, condition: "teacher already has a SUBMITTED review for this pilot" }
  - { id: ERR_OPEN_CHALLENGE_EXISTS, http: 409, condition: "target already has a challenge in a non-terminal status (FILED..APPEALED)" }
  - { id: ERR_FRAMEWORK_MISMATCH, http: 409, condition: "cycle's framework missing, RETIRED, or mismatched in subject_area/grade_band" }
  - { id: ERR_MATERIAL_NOT_ADOPTED, http: 409, condition: "distribution create attempted for a material whose adoption_status is not ADOPTED" }
  - { id: ERR_CHALLENGE_TARGET_INVALID, http: 409, condition: "challenge target is not eligible: material not ADOPTED, or supplemental request not in {APPROVED, REAFFIRMED}" }
  - { id: ERR_BUDGET_ENVELOPE_EXCEEDED, http: 402, condition: "PO create/issue or supplemental approve would exceed the cycle ledger's available_balance" }
  - { id: ERR_STALE_CYCLE_VERSION, http: 412, condition: "expected_cycle_version does not equal the AdoptionCycle's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictAdmin
    description: "District administrator: frameworks, budget appropriations, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /frameworks"
      - "POST /adoption-cycles/{cycleId}/budget-appropriation"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: CurriculumDirector
    description: "Curriculum office director: cycle creation and most cycle transitions, materials, pilots, supplemental challenge administration"
    identity: opaque
    exclusive_operations:
      - "POST /adoption-cycles"
      - "POST /adoption-cycles/{cycleId}/materials"
      - "POST /adoption-cycles/{cycleId}/pilots"
      - "POST /pilots/{pilotId}/transitions"
    shared_operations:
      - "POST /adoption-cycles/{cycleId}/transitions (targets DRAFT, SCORING, ACTIVE, SUNSET)"
      - "POST /challenge-cases/{ccId}/transitions (targets SCREENING, COMMITTEE_REVIEW, HEARING, CLOSED)"
      - "all GET endpoints"

  - name: InstructionalSpecialist
    description: "Vets materials, maintains alignment mappings, vets supplemental requests"
    identity: opaque
    exclusive_operations:
      - "POST /materials/{materialId}/transitions"
      - "POST /materials/{materialId}/alignments"
      - "POST /supplemental-requests/{srId}/transitions"
    shared_operations:
      - "POST /adoption-cycles/{cycleId}/transitions (targets ALIGNMENT_REVIEW, PILOT_OPEN)"
      - "all GET endpoints"

  - name: BoardSecretary
    description: "Board of education secretary: public review window and board decisions"
    identity: opaque
    exclusive_operations:
      - "POST /adoption-cycles/{cycleId}/board-decision"
    shared_operations:
      - "POST /adoption-cycles/{cycleId}/transitions (targets PUBLIC_REVIEW, BOARD_PENDING)"
      - "all GET endpoints"

  - name: ProcurementOfficer
    description: "Purchasing: quotes, evaluation, award posting, purchase orders, payments"
    identity: opaque
    exclusive_operations:
      - "POST /adoption-cycles/{cycleId}/quotes"
      - "POST /quotes/{quoteId}/transitions"
      - "POST /adoption-cycles/{cycleId}/award"
      - "POST /adoption-cycles/{cycleId}/purchase-orders"
      - "POST /purchase-orders/{poId}/issue"
      - "POST /purchase-orders/{poId}/pay"
      - "POST /purchase-orders/{poId}/cancel"
      - "POST /purchase-orders/{poId}/transitions"
    shared_operations: ["all GET endpoints"]

  - name: WarehouseManager
    description: "District warehouse: receipts, inventory, distribution orders"
    identity: opaque
    exclusive_operations:
      - "POST /purchase-orders/{poId}/receive"
      - "POST /distribution-orders"
      - "POST /distribution-orders/{doId}/transitions"
    shared_operations: ["all GET endpoints"]

  - name: Teacher
    description: "Classroom teacher: pilot rubric reviews and supplemental requests; X-User-ID is the teacher's operator id used for ownership and segregation checks"
    identity: opaque
    exclusive_operations:
      - "POST /pilots/{pilotId}/reviews"
      - "POST /reviews/{reviewId}/withdraw"
      - "POST /supplemental-requests"
    shared_operations: ["all GET endpoints"]

  - name: CommitteeMember
    description: "Reconsideration committee member: casts votes and issues decisions"
    identity: opaque
    exclusive_operations:
      - "POST /challenge-cases/{ccId}/votes"
    shared_operations:
      - "POST /challenge-cases/{ccId}/transitions (target DECIDED)"
      - "all GET endpoints"

  - name: CommunityMember
    description: "Parent/community member: files challenges and appeals own cases"
    identity: opaque
    exclusive_operations:
      - "POST /challenge-cases"
    shared_operations:
      - "POST /challenge-cases/{ccId}/transitions (target APPEALED, own filings only)"
      - "all GET endpoints"
