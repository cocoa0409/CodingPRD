            - "both creates return HTTP 201, so POST /wind-ops/work-orders accepts MaintenancePlanner and ReliabilityEngineer alike"
            - "both submits return 200; WorkOrder.${wo_planner}.submitted_by_user_id == rel-1 and WorkOrder.${wo_engineer}.submitted_by_user_id == planner-1, each stamped with the ACTING user rather than the creator"
            - "both blade damages are created 201 with recorded_by_user rel-1 and lead-1 respectively, so the crew lead may record an inspection"
            - "both cancels return 200 and both orders are CANCELLED, so cancel accepts MaintenancePlanner and SiteAdmin alike"
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_versions_are_rejected_on_both_declared_occ_rules
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules
          - endpoints.POST_/wind-ops/farms/{id}/landowner-settlements
          - endpoints.POST_/wind-ops/turbines/{id}/curtailment-orders
          - errors[ERR_STALE_FARM_VERSION]
          - errors[ERR_STALE_TURBINE_VERSION]
        distinguishing_aspect: |
          Both concurrency rules are exercised the same way and must report DIFFERENT codes: a version
          captured before an intervening write is stale afterwards, the refusal is 412 with nothing
          persisted, and re-reading the parent yields a version that makes the identical payload
          succeed. The intervening writes are ordinary business calls, not version pokes.
        test_recipe:
          setup:
            - "one farm with one turbine, one approved settlement and one telemetry sync as the intervening writes"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Elk Basin", region_code: "MT-E", grid_operator_code: "NWMT", road_levy_pct: 2.5, community_levy_pct: 1.5, landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
