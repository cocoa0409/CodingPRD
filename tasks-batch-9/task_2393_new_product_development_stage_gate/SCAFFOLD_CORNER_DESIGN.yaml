      - name: err_gate_close_ladder_refuses_thin_quorum_then_thin_readiness
        claim_type: guard_ladder
        grounds:
          - errors[ERR_QUORUM_NOT_MET]
          - errors[ERR_GATE_READINESS_BELOW_FLOOR]
        distinguishing_aspect: |
          A close is refused first for missing ballots and then, with quorum satisfied, for a
          readiness index of 55.00 against a floor of 90.00, and the second refusal proves the
          index counts only the completeness and hurdle components a project without a concept test
          or a pilot run can earn.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 with an empty checklist, quorum 2, zero hurdles and readiness floor 90.00."
            - "A screened LINE_EXTENSION project with a hurdle-clearing case, no concept test and no pilot run, holding an IN_SESSION review."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 2, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 90.00 }
              as: PortfolioAdmin
              captures: { gc_g2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-gc"
              captures: { gc_p_id: $.data.id }
            - call: "POST /innovation-projects/${gc_p_id}/screen"
              payload: { screening_notes: "Into stage 2." }
              as: GateChair
              as_user_id: "chair-gc"
              captures: { gc_p_v2: $.data.version }
            - call: "POST /innovation-projects/${gc_p_id}/business-cases"
              payload: { expected_project_version: "${gc_p_v2}", variant_mode: "TOP_DOWN", category_size_units_year: 4000000, target_share_pct: 4.00, cogs_per_unit_usd: 2.5000, slotting_fees_usd: 0.00, capex_usd: 100000.00, discount_rate_pct: 10.00 }
              as: InnovationLead
              captures: { gc_bc_id: $.data.id }
            - call: "POST /business-cases/${gc_bc_id}/forecast-lines"
              payload: { channel: "GROCERY", store_count: 2000, base_velocity_units_per_store_week: 1.00, promo_weeks: 0, promo_lift_pct: 0.00, list_price_usd: 5.0000 }
              as: InnovationLead
            - call: "POST /innovation-projects/${gc_p_id}/gate-reviews"
              payload: { gate_id: "${gc_g2_id}", scheduled_at: "2026-08-12T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-gc"
              captures: { gc_gr_id: $.data.id }
            - call: "POST /gate-reviews/${gc_gr_id}/open"
              as: GateChair
              as_user_id: "chair-gc"
          trigger:
            - call: "POST /gate-reviews/${gc_gr_id}/close"
              as: GateChair
              as_user_id: "chair-gc"
            - call: "POST /gate-reviews/${gc_gr_id}/votes"
              payload: { function: "OPERATIONS", vote: "APPROVE", rationale: "Capacity is there." }
              as: FunctionalReviewer
              as_user_id: "rev-ops-gc"
            - call: "POST /gate-reviews/${gc_gr_id}/close"
              as: GateChair
              as_user_id: "chair-gc"
            - call: "POST /gate-reviews/${gc_gr_id}/votes"
              payload: { function: "FINANCE", vote: "APPROVE", rationale: "Numbers clear the bar." }
              as: FunctionalReviewer
              as_user_id: "rev-fin-gc"
            - call: "POST /gate-reviews/${gc_gr_id}/close"
              as: GateChair
              as_user_id: "chair-gc"
          assert:
            - "the first two closes answer 409 ERR_QUORUM_NOT_MET at vote_count 0 and 1 against quorum 2"
            - "the third close answers 422 ERR_GATE_READINESS_BELOW_FLOOR once vote_count reaches 2"
            - "GateReview.${gc_gr_id}.readiness_index == 55.00, being 0.30 * 100.00 for the empty checklist plus 0.25 * 100.00 for the cleared hurdles, with the concept and yield components at 0.00"
            - "the readiness refusal is not ERR_BUSINESS_CASE_HURDLE_NOT_MET, since BusinessCase.${gc_bc_id} clears the zero hurdles with npv_usd 793643.87 and payback_months 4"
            - "GateReview.${gc_gr_id}.status is still IN_SESSION with decision null and closed_at null after all three refusals"
            - "InnovationProject.${gc_p_id}.dev_status remains SCREENED and BusinessCase.${gc_bc_id}.status remains COMPUTED"
            - "GET /gate-reviews/${gc_gr_id}/votes returns total_count 2, so the ballots survived the refusals"

      - name: err_checklist_graph_guards_protect_order_and_uniqueness
        claim_type: guard_ladder
        grounds:
          - errors[ERR_PREREQUISITE_NOT_SATISFIED]
          - errors[ERR_DELIVERABLE_CYCLE]
          - errors[ERR_REGULATORY_WAIVER_FORBIDDEN]
          - errors[ERR_DUPLICATE_DELIVERABLE_TYPE]
        distinguishing_aspect: |
          The checklist is a graph with rules of its own: a dependent item cannot be handed in
          before its prerequisite is cleared, no edge may close a loop including a self-loop,
          regulatory clearance can never be waived, and one live item per type per gate is the
          limit.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 requiring CONSUMER_CONCEPT_TEST, PILOT_SCALE_UP_REPORT and REGULATORY_CLEARANCE."
            - "An IDEA project with those three PENDING items, the scale-up report depending on the concept test."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["CONSUMER_CONCEPT_TEST", "PILOT_SCALE_UP_REPORT", "REGULATORY_CLEARANCE"], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { cg_g2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Toffee Crunch Bites", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 500000.00 }
              as: InnovationLead
              as_user_id: "lead-cg"
              captures: { cg_p_id: $.data.id }
            - call: "POST /innovation-projects/${cg_p_id}/deliverables"
              payload: { gate_id: "${cg_g2_id}", deliverable_type: "CONSUMER_CONCEPT_TEST", owner_function: "MARKETING" }
              as: GateChair
              as_user_id: "chair-cg"
              captures: { cg_d1_id: $.data.id }
            - call: "POST /innovation-projects/${cg_p_id}/deliverables"
              payload: { gate_id: "${cg_g2_id}", deliverable_type: "PILOT_SCALE_UP_REPORT", owner_function: "OPERATIONS", prerequisite_deliverable_id: "${cg_d1_id}" }
              as: GateChair
              as_user_id: "chair-cg"
              captures: { cg_d2_id: $.data.id }
            - call: "POST /innovation-projects/${cg_p_id}/deliverables"
              payload: { gate_id: "${cg_g2_id}", deliverable_type: "REGULATORY_CLEARANCE", owner_function: "REGULATORY" }
              as: GateChair
              as_user_id: "chair-cg"
              captures: { cg_d3_id: $.data.id }
          trigger:
            - call: "POST /deliverables/${cg_d2_id}/submit"
              payload: { evidence_url: "https://npd.example/cg/scale-up" }
              as: RnDLead
              as_user_id: "sub-cg"
            - call: "POST /deliverables/${cg_d1_id}/set-prerequisite"
              payload: { prerequisite_deliverable_id: "${cg_d2_id}" }
              as: GateChair
              as_user_id: "chair-cg"
            - call: "POST /deliverables/${cg_d1_id}/set-prerequisite"
              payload: { prerequisite_deliverable_id: "${cg_d1_id}" }
              as: GateChair
              as_user_id: "chair-cg"
            - call: "POST /deliverables/${cg_d3_id}/waive"
              payload: { reason: "Nobody wants to wait for the regulator." }
              as: GateChair
              as_user_id: "chair-cg"
            - call: "POST /innovation-projects/${cg_p_id}/deliverables"
              payload: { gate_id: "${cg_g2_id}", deliverable_type: "CONSUMER_CONCEPT_TEST", owner_function: "FINANCE" }
              as: GateChair
              as_user_id: "chair-cg"
            - call: "POST /deliverables/${cg_d1_id}/submit"
              payload: { evidence_url: "https://npd.example/cg/concept" }
              as: InnovationLead
              as_user_id: "sub-cg"
            - call: "POST /deliverables/${cg_d1_id}/decide"
              payload: { decision: "APPROVE", comment: "Concept read is solid." }
              as: FunctionalReviewer
              as_user_id: "rev-cg"
            - call: "POST /deliverables/${cg_d2_id}/submit"
              payload: { evidence_url: "https://npd.example/cg/scale-up" }
              as: RnDLead
              as_user_id: "sub-cg"
          assert:
            - "the early submit answers 409 ERR_PREREQUISITE_NOT_SATISFIED and Deliverable.${cg_d2_id}.status stays PENDING with submission_count 0"
            - "the back edge from ${cg_d1_id} to ${cg_d2_id} answers 409 ERR_DELIVERABLE_CYCLE"
            - "the self edge from ${cg_d1_id} to itself answers 409 ERR_DELIVERABLE_CYCLE too"
            - "Deliverable.${cg_d1_id}.prerequisite_deliverable_id is still null after both cycle refusals"
            - "waiving ${cg_d3_id} answers 409 ERR_REGULATORY_WAIVER_FORBIDDEN and its status stays PENDING"
            - "the second CONSUMER_CONCEPT_TEST item answers 409 ERR_DUPLICATE_DELIVERABLE_TYPE even with a different owner_function"
            - "once ${cg_d1_id} is APPROVED the resubmission of ${cg_d2_id} answers 200 with status SUBMITTED and submission_count 1"
            - "GET /deliverables?project_id=${cg_p_id} returns total_count 3 throughout"

      - name: err_uniqueness_guards_key_on_the_declared_tuple
        claim_type: uniqueness_scope
        grounds:
          - errors[ERR_DUPLICATE_RESOURCE]
          - errors[ERR_DUPLICATE_CHANNEL_LINE]
        distinguishing_aspect: |
          Each uniqueness rule keys on exactly its declared tuple: the same gate number in another
          category is legal, the same plant with another line code is legal, and one channel per
          case is the limit, so a second GROCERY line is refused while a MASS line is accepted.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One SNACK gate 2, one pilot line TOL-41, one retailer MidStates Grocery and one project holding a case with a GROCERY line."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: [], quorum_size: 1, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { uq_g2_id: $.data.id }
            - call: "POST /pilot-lines"
              payload: { plant_name: "Toledo", line_code: "TOL-41", changeover_buffer_minutes: 240, allergen_regime: "NONE", hourly_cost_usd: 500.00 }
              as: PortfolioAdmin
              captures: { uq_line_id: $.data.id }
