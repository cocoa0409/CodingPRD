# =============================================================================
# Task 1209: Fair Lending Analysis & Redlining Monitoring — scaffold seed tables
# =============================================================================

scenario: "1209. Fair Lending Analysis & Redlining Monitoring (bank fair lending unit): statistical analysis of pricing & underwriting outcomes by prohibited basis, peer/market comparison & penetration analysis, marketing & branch footprint review, exception & override analysis by loan officer, matched-pair file review, corrective action & remediation payments, self-testing privilege considerations, board reporting & monitoring cadence"

domain_name: fair-lending-analysis
api_prefix: /fair-lending

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Market
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Market / MSA display name" }
      - { name: msa_code, type: string, source: input, description: "MSA code; unique across markets" }
      - { name: protected_group_population_share, type: number, source: input, description: "Share of market population in protected groups (0..1); denominator of penetration_index_branch_weighted" }
      - { name: peer_group_code, type: string, source: input, description: "Peer comparison cohort code" }

  - name: Branch
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; branch's market" }
      - { name: name, type: string, source: input, description: "Branch name" }
      - { name: tract_minority_pct, type: number, source: input, description: "Minority population share of the branch's census tract (0..100)" }
      - { name: opened_on, type: string, source: input, description: "ISO date the branch opened" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED; closure cascades officers to SUSPENDED", constraints: "ACTIVE | CLOSED" }

  - name: LoanOfficer
    parent: null
    common_fields: true
    fields:
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; employing branch" }
      - { name: full_name, type: string, source: input, description: "Officer legal name" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED blocks new exceptions/overrides", constraints: "ACTIVE | SUSPENDED" }
      - { name: approved_exception_count, type: integer, source: computed, default: 0, description: "Count of PricingExceptions currently in APPROVED status for this officer (rescind decrements)" }
      - { name: confirmed_override_count, type: integer, source: computed, default: 0, description: "Count of UnderwritingOverrides currently in CONFIRMED status for this officer (reverse decrements)" }
      - { name: validated_application_count, type: integer, source: computed, default: 0, description: "Count of Applications with status VALIDATED owned by this officer; denominator of officer rates" }
      - { name: risk_score, type: number, source: computed, default: 0, description: "Officer risk score per officer_risk_score calculation; 2 decimal places" }
      - { name: monitoring_tier, type: enum, source: computed, default: GREEN, description: "GREEN | WATCH | RED derived from risk_score; upward crossings cascade", constraints: "GREEN | WATCH | RED" }

  - name: Application
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; market of the loan application" }
      - { name: branch_id, type: string, source: input, description: "FK -> Branch.id; originating branch" }
      - { name: loan_officer_id, type: string, source: input, description: "FK -> LoanOfficer.id; owning loan officer" }
      - { name: product_type, type: enum, source: input, description: "CONVENTIONAL | FHA | VA", constraints: "CONVENTIONAL | FHA | VA" }
      - { name: applicant_group, type: enum, source: input, description: "Prohibited-basis cohort: PROTECTED_1 | PROTECTED_2 | CONTROL", constraints: "PROTECTED_1 | PROTECTED_2 | CONTROL" }
      - { name: outcome, type: enum, source: input, description: "ORIGINATED | DENIED | WITHDRAWN | APPROVED_NOT_ACCEPTED", constraints: "ORIGINATED | DENIED | WITHDRAWN | APPROVED_NOT_ACCEPTED" }
      - { name: note_rate_bps, type: integer, source: input, description: "Note rate in basis points" }
      - { name: loan_amount_cents, type: integer, source: input, description: "Loan amount in cents" }
      - { name: credit_score, type: integer, source: input, description: "Credit score 300..900" }
      - { name: dti_pct, type: number, source: input, description: "Debt-to-income percentage" }
      - { name: application_date, type: string, source: input, description: "ISO date of application" }
      - { name: decision_date, type: string, source: input, description: "ISO date of credit decision; scopes AnalysisRun period membership" }
      - { name: status, type: enum, source: system, default: RECEIVED, description: "RECEIVED | VALIDATED | EXCLUDED; RECEIVED <-> VALIDATED cycle via correction", constraints: "RECEIVED | VALIDATED | EXCLUDED" }
      - { name: has_exception, type: enum, source: computed, default: NONE, description: "NONE | REQUESTED | APPROVED — derived from this application's PricingExceptions; APPROVED rows are excluded from exception-adjusted pricing disparity", constraints: "NONE | REQUESTED | APPROVED" }

  - name: PricingException
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application priced outside standard" }
      - { name: loan_officer_id, type: string, source: system, description: "FK -> LoanOfficer.id; copied from the application's loan_officer_id at creation" }
      - { name: kind, type: enum, source: input, description: "RATE_ABOVE_CAP | RATE_BELOW_FLOOR | FEE_WAIVER", constraints: "RATE_ABOVE_CAP | RATE_BELOW_FLOOR | FEE_WAIVER" }
      - { name: requested_rate_bps, type: integer, source: input, description: "Requested note rate in basis points" }
      - { name: justification, type: string, source: input, description: "Business justification text" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "REQUESTED | ESCALATED | APPROVED | DENIED | WITHDRAWN | EXPIRED | RESCINDED", constraints: "REQUESTED | ESCALATED | APPROVED | DENIED | WITHDRAWN | EXPIRED | RESCINDED" }
      - { name: decided_by_user_id, type: string, source: system, description: "X-User-ID that approved or denied; null until decided" }
      - { name: decided_at, type: datetime, source: system, description: "Decision timestamp; null until decided" }

  - name: UnderwritingOverride
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; application whose decision was overridden" }
      - { name: loan_officer_id, type: string, source: system, description: "FK -> LoanOfficer.id; copied from the application's loan_officer_id at creation" }
      - { name: original_decision, type: enum, source: input, description: "APPROVE | DENY — decision before override", constraints: "APPROVE | DENY" }
      - { name: overridden_decision, type: enum, source: input, description: "APPROVE | DENY — decision after override; must differ from original_decision", constraints: "APPROVE | DENY" }
      - { name: justification, type: string, source: input, description: "Override justification" }
      - { name: status, type: enum, source: system, default: RECORDED, description: "RECORDED | CONFIRMED | REVERSED", constraints: "RECORDED | CONFIRMED | REVERSED" }

  - name: PeerBenchmark
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; benchmarked market" }
      - { name: period_start, type: string, source: input, description: "ISO period start (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO period end (exclusive)" }
      - { name: peer_protected_origination_rate, type: number, source: input, description: "Aggregate peer origination rate for protected-group applicants (0..1)" }
      - { name: peer_origination_count, type: integer, source: input, description: "Aggregate peer origination count" }
      - { name: source, type: string, source: input, description: "Data source citation (e.g., HMDA aggregate)" }

  - name: AnalysisRun
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; analyzed market" }
      - { name: product_type, type: enum, source: input, description: "CONVENTIONAL | FHA | VA — scope dimension", constraints: "CONVENTIONAL | FHA | VA" }
      - { name: prohibited_basis, type: enum, source: input, description: "RACE | ETHNICITY | SEX | AGE — basis under study", constraints: "RACE | ETHNICITY | SEX | AGE" }
      - { name: period_start, type: string, source: input, description: "ISO analysis period start (inclusive); half-open interval" }
      - { name: period_end, type: string, source: input, description: "ISO analysis period end (exclusive); half-open interval" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | DATA_LOCKED | COMPUTED | UNDER_REVIEW | FINALIZED | ARCHIVED", constraints: "DRAFT | DATA_LOCKED | COMPUTED | UNDER_REVIEW | FINALIZED | ARCHIVED" }
      - { name: locked_at, type: datetime, source: system, description: "Logical-clock timestamp of data lock; null until locked" }
      - { name: snapshot_application_count, type: integer, source: system, description: "Count of in-scope VALIDATED applications frozen at lock" }
      - { name: approval_rate_protected_net, type: number, source: computed, description: "Protected-cohort net approval rate computed at compute; 4 decimal places" }
      - { name: approval_rate_control_net, type: number, source: computed, description: "Control-cohort net approval rate computed at compute; 4 decimal places" }
      - { name: impact_ratio_net, type: number, source: computed, description: "Net-variant four-fifths impact ratio; 4 decimal places" }
      - { name: impact_ratio_raw, type: number, source: computed, description: "Raw-variant impact ratio (withdrawn + not-accepted included); 4 decimal places" }
      - { name: pricing_disparity_unadjusted_bps, type: number, source: computed, description: "Mean note-rate spread protected minus control over ORIGINATED rows; 4 decimal places" }
      - { name: pricing_disparity_adjusted_bps, type: number, source: computed, description: "Same spread excluding applications with has_exception == APPROVED; 4 decimal places" }
      - { name: adverse_classification, type: enum, source: computed, description: "NONE | MARGINAL | ADVERSE — classified on impact_ratio_net", constraints: "NONE | MARGINAL | ADVERSE" }
      - { name: screening_flag, type: boolean, source: computed, description: "True when min(impact_ratio_net, impact_ratio_raw) < 0.80; drives auto-finding" }
      - { name: open_finding_count, type: integer, source: computed, default: 0, description: "Linked findings not in a terminal state; ledger-synced by finding transitions" }
      - { name: finalized_at, type: datetime, source: system, description: "Timestamp of finalization; null until FINALIZED" }

  - name: DisparityFinding
    parent: null
    common_fields: true
    fields:
      - { name: analysis_run_id, type: string, source: input, description: "FK -> AnalysisRun.id; owning analysis run" }
      - { name: kind, type: enum, source: input, description: "DENIAL_DISPARITY | PRICING_DISPARITY | PENETRATION_SHORTFALL | OVERRIDE_ASYMMETRY | MANUAL", constraints: "DENIAL_DISPARITY | PRICING_DISPARITY | PENETRATION_SHORTFALL | OVERRIDE_ASYMMETRY | MANUAL" }
      - { name: source, type: enum, source: system, default: MANUAL, description: "AUTO (created by compute) | MANUAL (created by analyst)", constraints: "AUTO | MANUAL" }
      - { name: metric_value, type: number, source: system, description: "Metric that breached (auto findings); null on manual findings" }
      - { name: threshold_value, type: number, source: system, description: "Threshold breached (auto findings); null on manual findings" }
      - { name: notes, type: string, source: input, description: "Analyst notes" }
      - { name: status, type: enum, source: system, default: FLAGGED, description: "FLAGGED | UNDER_REVIEW | SUBSTANTIATED | REFUTED | CLOSED | SUPERSEDED", constraints: "FLAGGED | UNDER_REVIEW | SUBSTANTIATED | REFUTED | CLOSED | SUPERSEDED" }
      - { name: harmed_application_ids, type: array, source: system, default: [], description: "Ordered list of harmed Application ids recorded at substantiation; resolved via GET /fair-lending/applications/{applicationId}; drives remediation allocation" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of creator; 'system' for AUTO findings" }
      - { name: substantiated_by_user_id, type: string, source: system, description: "X-User-ID of substantiating officer; null until SUBSTANTIATED" }
      - { name: refute_reason, type: string, source: system, description: "Reason recorded at refutation" }
      - { name: reopen_count, type: integer, source: system, default: 0, description: "Number of REFUTED -> UNDER_REVIEW reopens" }
      - { name: superseded_by_finding_id, type: string, source: system, description: "FK -> DisparityFinding.id; set when a newer manual finding supersedes this one; null otherwise" }

  - name: MatchedPairReview
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: input, description: "FK -> DisparityFinding.id; finding this review evidences" }
      - { name: target_application_id, type: string, source: input, description: "FK -> Application.id; protected-group denied application under review" }
      - { name: control_application_id, type: string, source: system, description: "FK -> Application.id; control-group originated comparator; client-supplied or selector-chosen" }
      - { name: selector_used, type: boolean, source: system, default: false, description: "True when control_application_id was chosen by the server selector" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | INITIAL_REVIEWED | DISPUTED | CONFIRMED | SUPERSEDED", constraints: "PENDING | INITIAL_REVIEWED | DISPUTED | CONFIRMED | SUPERSEDED" }
      - { name: initial_outcome, type: enum, source: input, description: "COMPARABLE_TREATMENT | DIFFERENTIAL_TREATMENT recorded at submit-initial (from the outcome payload field)", constraints: "COMPARABLE_TREATMENT | DIFFERENTIAL_TREATMENT" }
      - { name: initial_reviewer_user_id, type: string, source: system, description: "X-User-ID of the initial reviewer" }
      - { name: confirmed_by_user_id, type: string, source: system, description: "X-User-ID of confirming officer; must differ from initial_reviewer_user_id" }
      - { name: dispute_reason, type: string, source: system, description: "Reason recorded by disputing loan officer" }

  - name: CorrectiveActionPlan
    parent: null
    common_fields: true
    fields:
      - { name: finding_id, type: string, source: input, description: "FK -> DisparityFinding.id; finding being remediated (at most one CAP in SUBMITTED/EXECUTING/OVERDUE per finding)" }
      - { name: title, type: string, source: input, description: "Plan title" }
      - { name: pool_cents, type: integer, source: input, description: "Total remediation pool in cents; conserved quantity of the funds invariant" }
      - { name: remaining_cents, type: integer, source: computed, description: "Unallocated/returned funds; pool_cents == remaining_cents + sum(amounts of PENDING/DISBURSED payments)" }
      - { name: disbursed_cents, type: integer, source: computed, default: 0, description: "Sum of amounts of DISBURSED payments" }
      - { name: due_date, type: string, source: input, description: "ISO date remediation must complete by" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | EXECUTING | OVERDUE | RETURNED | COMPLETED | SUPERSEDED | CANCELLED", constraints: "DRAFT | SUBMITTED | EXECUTING | OVERDUE | RETURNED | COMPLETED | SUPERSEDED | CANCELLED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of drafting analyst" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approver; payment disbursers must differ (SoD)" }
      - { name: approved_at, type: datetime, source: system, description: "Approval timestamp" }

  - name: RemediationPayment
    parent: null
    common_fields: true
    fields:
      - { name: corrective_action_plan_id, type: string, source: input, description: "FK -> CorrectiveActionPlan.id; funding plan" }
      - { name: application_id, type: string, source: input, description: "FK -> Application.id; harmed borrower application being compensated" }
      - { name: amount_cents, type: integer, source: input, description: "Payment amount in cents" }
      - { name: origin, type: enum, source: system, default: MANUAL, description: "AUTO_ALLOCATED (created at CAP approval) | MANUAL (created by specialist)", constraints: "AUTO_ALLOCATED | MANUAL" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | DISBURSED | VOIDED | RETURNED", constraints: "PENDING | DISBURSED | VOIDED | RETURNED" }
      - { name: disbursed_by_user_id, type: string, source: system, description: "X-User-ID of disbursing specialist; must differ from CAP approver" }
      - { name: disposition_reason, type: string, source: system, description: "Reason for void/return" }

  - name: SelfTest
    parent: null
    common_fields: true
    fields:
      - { name: market_id, type: string, source: input, description: "FK -> Market.id; self-tested market" }
      - { name: analysis_run_id, type: string, source: input, description: "FK -> AnalysisRun.id; linked privileged analysis run (optional at creation)" }
      - { name: window_start, type: string, source: input, description: "ISO window start (inclusive); CLOSED interval semantics" }
      - { name: window_end, type: string, source: input, description: "ISO window end (inclusive); CLOSED interval semantics" }
      - { name: privileged, type: boolean, source: system, default: false, description: "Privilege designation by ComplianceDirector" }
      - { name: disclosure_status, type: enum, source: system, default: DISCLOSABLE, description: "PRIVILEGED | DISCLOSABLE; PRIVILEGED excludes linked findings from board report counts", constraints: "PRIVILEGED | DISCLOSABLE" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED_NO_VIOLATION | CLOSED_VIOLATION | REMEDIATED | PRIVILEGE_LOST", constraints: "ACTIVE | CLOSED_NO_VIOLATION | CLOSED_VIOLATION | REMEDIATED | PRIVILEGE_LOST" }
      - { name: cycles_open, type: integer, source: system, default: 0, description: "Monitoring cycles elapsed while CLOSED_VIOLATION; forfeiture at 2" }

  - name: BoardReport
    parent: null
    common_fields: true
    fields:
      - { name: period_start, type: string, source: input, description: "ISO quarter start; must align to calendar quarter" }
      - { name: period_end, type: string, source: input, description: "ISO quarter end; must align to calendar quarter; contiguous tiling with prior reports" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | SUBMITTED | APPROVED | RETURNED | PUBLISHED", constraints: "DRAFT | SUBMITTED | APPROVED | RETURNED | PUBLISHED" }
      - { name: substantiated_finding_count, type: integer, source: computed, default: 0, description: "Findings in SUBSTANTIATED/CLOSED on runs overlapping the period, excluding privileged self-test runs" }
      - { name: caps_executing_count, type: integer, source: computed, default: 0, description: "CAPs in EXECUTING or OVERDUE at refresh time" }
      - { name: red_officer_count, type: integer, source: computed, default: 0, description: "LoanOfficers with monitoring_tier RED at refresh time" }
      - { name: privileged_exclusion_count, type: integer, source: computed, default: 0, description: "Substantiated/closed findings excluded because their run's self-test disclosure_status is PRIVILEGED" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID of submitting officer" }
      - { name: approved_by_user_id, type: string, source: system, description: "X-User-ID of approving director; must differ from submitter (SoD)" }
      - { name: published_at, type: datetime, source: system, description: "Publication timestamp; freezes counts" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Application
    initial_state: RECEIVED
    terminal_states: [EXCLUDED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /fair-lending/applications/{applicationId}/validate"
        actor: LendingDataOps
        preconditions: []
        side_effects:
          - "owning LoanOfficer.validated_application_count += 1; officer risk_score and monitoring_tier recompute (officer_risk_score)"
      - from: VALIDATED
        to: RECEIVED
        trigger: "PUT /fair-lending/applications/{applicationId}"
        actor: LendingDataOps
        preconditions:
          - "application is not frozen in any AnalysisRun snapshot whose run is FINALIZED or ARCHIVED (ERR_APPLICATION_LOCKED)"
        side_effects:
          - "any DATA_LOCKED AnalysisRun covering (market_id, product_type, decision_date in period) becomes stale per dataset_staleness"
          - "owning LoanOfficer.validated_application_count -= 1; officer risk_score and monitoring_tier recompute"
      - from: RECEIVED
        to: EXCLUDED
        trigger: "POST /fair-lending/applications/{applicationId}/exclude"
        actor: LendingDataOps
        preconditions:
          - "application is not frozen in any FINALIZED or ARCHIVED AnalysisRun snapshot (ERR_APPLICATION_LOCKED)"
        side_effects: []
      - from: VALIDATED
        to: EXCLUDED
        trigger: "POST /fair-lending/applications/{applicationId}/exclude"
        actor: LendingDataOps
        preconditions:
          - "application is not frozen in any FINALIZED or ARCHIVED AnalysisRun snapshot (ERR_APPLICATION_LOCKED)"
        side_effects:
          - "owning LoanOfficer.validated_application_count -= 1; officer risk_score and monitoring_tier recompute"

  - entity: AnalysisRun
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: DATA_LOCKED
        trigger: "POST /fair-lending/analysis-runs/{runId}/lock"
        actor: FairLendingAnalyst
        preconditions:
          - "in-scope set (market_id, product_type, decision_date in [period_start, period_end), status != EXCLUDED) has >= 1 application (ERR_NO_IN_SCOPE_APPLICATIONS)"
          - "every in-scope application has status VALIDATED (ERR_APPLICATIONS_NOT_VALIDATED)"
        side_effects:
          - "locked_at = current logical clock; snapshot_application_count = in-scope count; snapshot application id list frozen"
      - from: DATA_LOCKED
        to: DRAFT
        trigger: "POST /fair-lending/analysis-runs/{runId}/unlock"
        actor: FairLendingAnalyst
        preconditions:
          - "no linked DisparityFinding exists in any status (ERR_RUN_HAS_OPEN_FINDINGS)"
        side_effects:
          - "locked_at cleared; snapshot discarded"
      - from: DATA_LOCKED
        to: COMPUTED
        trigger: "POST /fair-lending/analysis-runs/{runId}/compute"
        actor: FairLendingAnalyst
        preconditions:
          - "dataset not stale: no in-scope application has updated_at later than locked_at (ERR_STALE_DATASET)"
        side_effects:
          - "runs denial_impact_ratio (net + raw variants) and pricing_disparity_bps (unadjusted + adjusted variants); sets rate/ratio/classification/screening_flag fields"
          - "if screening_flag is true: auto-create DisparityFinding kind=DENIAL_DISPARITY, source=AUTO, status=FLAGGED, metric_value=impact_ratio_raw, threshold_value=0.80; open_finding_count += 1"
          - "if pricing_disparity_unadjusted_bps > 15: auto-create DisparityFinding kind=PRICING_DISPARITY, source=AUTO, status=FLAGGED, metric_value=pricing_disparity_unadjusted_bps, threshold_value=15; open_finding_count += 1"
      - from: COMPUTED
        to: UNDER_REVIEW
        trigger: "system (automatic when the first linked finding enters UNDER_REVIEW)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COMPUTED
        to: FINALIZED
        trigger: "POST /fair-lending/analysis-runs/{runId}/finalize"
        actor: FairLendingOfficer
        preconditions:
          - "privilege gate: no SelfTest with analysis_run_id == this run has disclosure_status PRIVILEGED and status ACTIVE (ERR_PRIVILEGE_GATE)"
        side_effects:
          - "finalized_at = current logical clock; snapshot applications become frozen against correction/exclusion"
      - from: UNDER_REVIEW
        to: FINALIZED
        trigger: "POST /fair-lending/analysis-runs/{runId}/finalize"
        actor: FairLendingOfficer
        preconditions:
          - "every linked DisparityFinding is in a terminal state (REFUTED, CLOSED, or SUPERSEDED) (ERR_FINDINGS_OPEN)"
          - "privilege gate: no SelfTest with analysis_run_id == this run has disclosure_status PRIVILEGED and status ACTIVE (ERR_PRIVILEGE_GATE)"
        side_effects:
          - "finalized_at = current logical clock; snapshot applications become frozen against correction/exclusion"
      - from: FINALIZED
        to: ARCHIVED
        trigger: "POST /fair-lending/analysis-runs/{runId}/archive"
        actor: FairLendingOfficer
        preconditions: []
        side_effects:
          - "run no longer blocks scope overlap (overlap check considers only runs not in ARCHIVED)"

  - entity: DisparityFinding
    initial_state: FLAGGED
    terminal_states: [CLOSED, SUPERSEDED]
    transitions:
      - from: FLAGGED
        to: UNDER_REVIEW
        trigger: "POST /fair-lending/findings/{findingId}/begin-review"
        actor: FairLendingAnalyst
        preconditions: []
        side_effects:
          - "if owning AnalysisRun is COMPUTED: run auto-transitions COMPUTED -> UNDER_REVIEW"
      - from: UNDER_REVIEW
        to: SUBSTANTIATED
        trigger: "POST /fair-lending/findings/{findingId}/substantiate"
        actor: FairLendingOfficer
        preconditions:
          - "for kind DENIAL_DISPARITY or OVERRIDE_ASYMMETRY: at least one linked MatchedPairReview in CONFIRMED status (ERR_NO_CONFIRMED_MATCHED_PAIR)"
          - "SoD: when source == MANUAL, the officer's X-User-ID must differ from created_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "harmed_application_ids stored from payload; substantiated_by_user_id set"
      - from: UNDER_REVIEW
        to: REFUTED
        trigger: "POST /fair-lending/findings/{findingId}/refute"
        actor: FairLendingOfficer
        preconditions: []
        side_effects:
          - "refute_reason stored; owning AnalysisRun.open_finding_count -= 1"
      - from: REFUTED
        to: UNDER_REVIEW
        trigger: "POST /fair-lending/findings/{findingId}/reopen"
        actor: FairLendingAnalyst
        preconditions: []
        side_effects:
          - "reopen_count += 1; owning AnalysisRun.open_finding_count += 1"
      - from: SUBSTANTIATED
        to: CLOSED
        trigger: "system (automatic when the finding's non-superseded CorrectiveActionPlan reaches COMPLETED)"
        actor: system
        preconditions: []
        side_effects:
          - "owning AnalysisRun.open_finding_count -= 1"
      - from: FLAGGED
        to: SUPERSEDED
        trigger: "system (automatic when a manual finding is created with supersedes_finding_id naming this finding)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_finding_id set; owning AnalysisRun.open_finding_count -= 1"
      - from: UNDER_REVIEW
        to: SUPERSEDED
        trigger: "system (automatic when a manual finding is created with supersedes_finding_id naming this finding)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_finding_id set; owning AnalysisRun.open_finding_count -= 1"
      - from: REFUTED
        to: SUPERSEDED
        trigger: "system (automatic when a manual finding is created with supersedes_finding_id naming this finding)"
        actor: system
        preconditions: []
        side_effects:
          - "superseded_by_finding_id set"

  - entity: MatchedPairReview
    initial_state: PENDING
    terminal_states: [CONFIRMED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: INITIAL_REVIEWED
        trigger: "POST /fair-lending/matched-pair-reviews/{reviewId}/submit-initial"
        actor: FairLendingAnalyst
        preconditions: []
        side_effects:
          - "initial_outcome and initial_reviewer_user_id stored"
      - from: DISPUTED
        to: INITIAL_REVIEWED
        trigger: "POST /fair-lending/matched-pair-reviews/{reviewId}/submit-initial"
        actor: FairLendingAnalyst
        preconditions: []
        side_effects:
          - "initial_outcome and initial_reviewer_user_id overwritten (re-review cycle)"
        note: "cycle: a disputed pair returns to INITIAL_REVIEWED with a fresh reviewer record"
      - from: INITIAL_REVIEWED
        to: CONFIRMED
        trigger: "POST /fair-lending/matched-pair-reviews/{reviewId}/confirm"
        actor: FairLendingOfficer
        preconditions:
          - "SoD: confirming officer's X-User-ID must differ from initial_reviewer_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "confirmed_by_user_id stored"
      - from: INITIAL_REVIEWED
        to: DISPUTED
        trigger: "POST /fair-lending/matched-pair-reviews/{reviewId}/dispute"
        actor: LoanOfficer
        preconditions:
          - "ownership: X-User-ID must equal the target application's loan_officer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "dispute_reason stored"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (automatic when a new MatchedPairReview is created for the same finding)"
        actor: system
        preconditions: []
        side_effects: []
      - from: INITIAL_REVIEWED
        to: SUPERSEDED
        trigger: "system (automatic when a new MatchedPairReview is created for the same finding)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: SUPERSEDED
        trigger: "system (automatic when a new MatchedPairReview is created for the same finding)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: CorrectiveActionPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, SUPERSEDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fair-lending/corrective-action-plans/{capId}/submit"
        actor: FairLendingAnalyst
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: EXECUTING
        trigger: "POST /fair-lending/corrective-action-plans/{capId}/approve"
        actor: FairLendingOfficer
        preconditions:
          - "linked finding is SUBSTANTIATED (ERR_INVALID_STATE)"
          - "authority: pool_cents >= 25000000 requires actor role ComplianceDirector (ERR_DIRECTOR_APPROVAL_REQUIRED)"
        side_effects:
          - "approved_by_user_id and approved_at set"
          - "remediation_pool_allocation runs: one AUTO_ALLOCATED RemediationPayment PENDING per harmed_application_ids entry; per-payment amount round_half_up(pool_cents / n) to cents; residual (pool_cents - sum) applied to the payment whose application appears FIRST in finding.harmed_application_ids (client-pinned array order); remaining_cents = pool_cents - sum(allocated) (equal split leaves 0)"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /fair-lending/corrective-action-plans/{capId}/return"
        actor: FairLendingOfficer
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: DRAFT
        trigger: "POST /fair-lending/corrective-action-plans/{capId}/revise"
        actor: FairLendingAnalyst
        preconditions: []
        side_effects: []
        note: "cycle: returned plans re-enter DRAFT for revision"
      - from: EXECUTING
        to: OVERDUE
        trigger: "system (during POST /fair-lending/monitoring/run-cycle when current logical date > due_date and any payment is PENDING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: OVERDUE
        to: EXECUTING
        trigger: "POST /fair-lending/corrective-action-plans/{capId}/extend"
        actor: ComplianceDirector
        preconditions:
          - "new_due_date must be later than the current logical date (ERR_INVALID_REQUEST)"
        side_effects:
          - "due_date = new_due_date"
      - from: EXECUTING
        to: COMPLETED
        trigger: "system (automatic when every linked RemediationPayment is terminal — DISBURSED, VOIDED, or RETURNED — and at least one is DISBURSED)"
        actor: system
        preconditions: []
        side_effects:
          - "linked DisparityFinding -> CLOSED; finding's AnalysisRun.open_finding_count -= 1"
      - from: OVERDUE
        to: COMPLETED
        trigger: "system (automatic when every linked RemediationPayment is terminal and at least one is DISBURSED)"
        actor: system
        preconditions: []
        side_effects:
          - "linked DisparityFinding -> CLOSED; finding's AnalysisRun.open_finding_count -= 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /fair-lending/corrective-action-plans/{capId}/cancel"
        actor: FairLendingAnalyst
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: CANCELLED
        trigger: "POST /fair-lending/corrective-action-plans/{capId}/cancel"
        actor: FairLendingAnalyst
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (automatic when a new CorrectiveActionPlan is created for the same finding)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: SUPERSEDED
        trigger: "system (automatic when a new CorrectiveActionPlan is created for the same finding)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RemediationPayment
    initial_state: PENDING
    terminal_states: [VOIDED, RETURNED]
    transitions:
      - from: PENDING
        to: DISBURSED
        trigger: "POST /fair-lending/remediation-payments/{paymentId}/disburse"
        actor: RemediationSpecialist
        preconditions:
          - "owning CAP is EXECUTING or OVERDUE (ERR_CAP_NOT_EXECUTING)"
          - "SoD: disburser X-User-ID must differ from CAP.approved_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "disbursed_by_user_id set; CAP.disbursed_cents += amount_cents; CAP completion check runs (cap_funds_rollup)"
      - from: PENDING
        to: VOIDED
        trigger: "POST /fair-lending/remediation-payments/{paymentId}/void"
        actor: RemediationSpecialist
        preconditions: []
        side_effects:
          - "compensating: CAP.remaining_cents += amount_cents; CAP completion check runs"
      - from: DISBURSED
        to: RETURNED
        trigger: "POST /fair-lending/remediation-payments/{paymentId}/mark-returned"
        actor: RemediationSpecialist
        preconditions: []
        side_effects:
          - "compensating: CAP.remaining_cents += amount_cents; CAP.disbursed_cents -= amount_cents"

  - entity: PricingException
    initial_state: REQUESTED
    terminal_states: [DENIED, WITHDRAWN, EXPIRED, RESCINDED]
    transitions:
      - from: REQUESTED
        to: ESCALATED
        trigger: "system (automatic when the owning LoanOfficer's monitoring_tier crosses upward into RED)"
        actor: system
        preconditions: []
        side_effects:
          - "approval authority tightens: only ComplianceDirector may approve while ESCALATED"
        note: "one-way ratchet: downward tier moves never return ESCALATED to REQUESTED"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /fair-lending/pricing-exceptions/{exceptionId}/approve"
        actor: FairLendingOfficer
        preconditions:
          - "owning LoanOfficer is ACTIVE (ERR_OFFICER_SUSPENDED)"
          - "authority: when owning officer's monitoring_tier == RED, actor role must be ComplianceDirector (ERR_DIRECTOR_APPROVAL_REQUIRED)"
        side_effects:
          - "application.has_exception -> APPROVED; decided_by_user_id/decided_at set"
          - "officer.approved_exception_count += 1; officer risk_score/monitoring_tier recompute (officer_risk_score)"
          - "tier cascade: if monitoring_tier crosses upward to RED, every other PricingException of this officer in REQUESTED -> ESCALATED"
      - from: ESCALATED
        to: APPROVED
        trigger: "POST /fair-lending/pricing-exceptions/{exceptionId}/approve"
        actor: ComplianceDirector
        preconditions:
          - "actor role must be ComplianceDirector (ERR_DIRECTOR_APPROVAL_REQUIRED)"
        side_effects:
          - "application.has_exception -> APPROVED; officer.approved_exception_count += 1; officer risk_score/monitoring_tier recompute"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /fair-lending/pricing-exceptions/{exceptionId}/deny"
        actor: FairLendingOfficer
        preconditions: []
        side_effects:
          - "application.has_exception -> NONE; decided_by_user_id/decided_at set"
      - from: ESCALATED
        to: DENIED
        trigger: "POST /fair-lending/pricing-exceptions/{exceptionId}/deny"
        actor: FairLendingOfficer
        preconditions: []
        side_effects:
          - "application.has_exception -> NONE; decided_by_user_id/decided_at set"
      - from: REQUESTED
        to: WITHDRAWN
        trigger: "POST /fair-lending/pricing-exceptions/{exceptionId}/withdraw"
        actor: LoanOfficer
        preconditions:
          - "ownership: X-User-ID must equal exception's loan_officer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "application.has_exception -> NONE"
      - from: ESCALATED
        to: WITHDRAWN
        trigger: "POST /fair-lending/pricing-exceptions/{exceptionId}/withdraw"
        actor: LoanOfficer
        preconditions:
          - "ownership: X-User-ID must equal exception's loan_officer_id (ERR_OWNERSHIP_MISMATCH)"
        side_effects:
          - "application.has_exception -> NONE"
      - from: APPROVED
        to: RESCINDED
        trigger: "POST /fair-lending/pricing-exceptions/{exceptionId}/rescind"
        actor: FairLendingOfficer
        preconditions:
          - "application is not frozen in any FINALIZED or ARCHIVED AnalysisRun snapshot (ERR_APPLICATION_LOCKED)"
        side_effects:
          - "compensating: application.has_exception -> NONE; officer.approved_exception_count -= 1; officer risk_score/monitoring_tier recompute (de-escalation does NOT un-escalate ESCALATED exceptions — one-way ratchet)"
      - from: REQUESTED
        to: EXPIRED
        trigger: "system (during POST /fair-lending/monitoring/run-cycle when current logical time is strictly more than 30 days after created_at)"
        actor: system
        preconditions: []
        side_effects:
          - "application.has_exception -> NONE"
      - from: ESCALATED
        to: EXPIRED
        trigger: "system (during POST /fair-lending/monitoring/run-cycle when current logical time is strictly more than 30 days after created_at)"
        actor: system
        preconditions: []
        side_effects:
          - "application.has_exception -> NONE"

  - entity: UnderwritingOverride
    initial_state: RECORDED
    terminal_states: [CONFIRMED, REVERSED]
    transitions:
      - from: RECORDED
        to: CONFIRMED
        trigger: "POST /fair-lending/underwriting-overrides/{overrideId}/confirm"
        actor: FairLendingOfficer
        preconditions: []
        side_effects:
          - "officer.confirmed_override_count += 1; officer risk_score/monitoring_tier recompute; upward RED crossing escalates that officer's REQUESTED PricingExceptions to ESCALATED"
      - from: RECORDED
        to: REVERSED
        trigger: "POST /fair-lending/underwriting-overrides/{overrideId}/reverse"
        actor: FairLendingOfficer
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: REVERSED
        trigger: "POST /fair-lending/underwriting-overrides/{overrideId}/reverse"
        actor: FairLendingOfficer
        preconditions: []
        side_effects:
          - "compensating: officer.confirmed_override_count -= 1; officer risk_score/monitoring_tier recompute"

  - entity: LoanOfficer
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /fair-lending/loan-officers/{officerId}/suspend"
        actor: ComplianceDirector
        preconditions: []
        side_effects:
          - "officer blocked from creating PricingExceptions and UnderwritingOverrides (ERR_OFFICER_SUSPENDED)"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /fair-lending/loan-officers/{officerId}/reinstate"
        actor: ComplianceDirector
        preconditions: []
        side_effects: []

  - entity: Branch
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /fair-lending/branches/{branchId}/close"
        actor: BankAdmin
        preconditions: []
        side_effects:
          - "cascade: every ACTIVE LoanOfficer of this branch -> SUSPENDED"

  - entity: SelfTest
    initial_state: ACTIVE
    terminal_states: [CLOSED_NO_VIOLATION, REMEDIATED, PRIVILEGE_LOST]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /fair-lending/self-tests/{selfTestId}/designate-privileged"
        actor: ComplianceDirector
        preconditions: []
        side_effects:
          - "privileged = true; disclosure_status = PRIVILEGED"
        note: "field-mutation self-transition; status remains ACTIVE"
      - from: ACTIVE
        to: CLOSED_NO_VIOLATION
        trigger: "POST /fair-lending/self-tests/{selfTestId}/close with outcome NO_VIOLATION"
        actor: FairLendingOfficer
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: CLOSED_VIOLATION
        trigger: "POST /fair-lending/self-tests/{selfTestId}/close with outcome VIOLATION_FOUND"
        actor: FairLendingOfficer
        preconditions:
          - "linked analysis_run_id is non-null and that run has at least one finding in SUBSTANTIATED or CLOSED (ERR_NO_SUBSTANTIATED_FINDING)"
        side_effects:
          - "cycles_open = 0; remediation clock starts"
      - from: CLOSED_VIOLATION
        to: REMEDIATED
        trigger: "POST /fair-lending/self-tests/{selfTestId}/mark-remediated"
        actor: FairLendingOfficer
        preconditions:
          - "a CorrectiveActionPlan linked to a finding of the self-test's run is COMPLETED (ERR_REMEDIATION_OUTSTANDING)"
        side_effects:
          - "privilege preserved: disclosure_status stays PRIVILEGED"
      - from: CLOSED_VIOLATION
        to: PRIVILEGE_LOST
        trigger: "system (during POST /fair-lending/monitoring/run-cycle when cycles_open reaches 2)"
        actor: system
        preconditions: []
        side_effects:
          - "disclosure_status -> DISCLOSABLE; previously excluded findings become countable in board reports"

  - entity: BoardReport
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /fair-lending/board-reports/{reportId}/submit"
        actor: FairLendingOfficer
        preconditions: []
        side_effects:
          - "submitted_by_user_id set"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /fair-lending/board-reports/{reportId}/approve"
        actor: ComplianceDirector
        preconditions:
          - "SoD: approver X-User-ID must differ from submitted_by_user_id (ERR_SOD_VIOLATION)"
        side_effects:
          - "approved_by_user_id set"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /fair-lending/board-reports/{reportId}/return"
        actor: ComplianceDirector
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: DRAFT
        trigger: "POST /fair-lending/board-reports/{reportId}/revise"
        actor: FairLendingAnalyst
        preconditions: []
        side_effects: []
        note: "cycle: returned reports re-enter DRAFT"
      - from: APPROVED
        to: PUBLISHED
        trigger: "POST /fair-lending/board-reports/{reportId}/publish"
        actor: ComplianceDirector
        preconditions:
          - "every AnalysisRun overlapping [period_start, period_end) is FINALIZED or ARCHIVED (ERR_REPORT_NOT_READY)"
        side_effects:
          - "published_at set; aggregate counts frozen"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: cap-create-stale-finding
    parent_entity: DisparityFinding
    write_endpoint: "POST /fair-lending/corrective-action-plans"
    occ_field: expected_finding_version
    description: |
      Creating a CorrectiveActionPlan against a DisparityFinding whose version
      has advanced since the client last observed it is rejected. This captures
      the case where another writer has just created a CAP for the same finding
      (which legitimately supersedes the finding's prior DRAFT/RETURNED plans)
      and the current writer's view of the finding is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: matched-pair-create-stale-finding
    parent_entity: DisparityFinding
    write_endpoint: "POST /fair-lending/matched-pair-reviews"
    occ_field: expected_finding_version
    description: |
      Creating a MatchedPairReview against a DisparityFinding whose version has
      advanced since the client last observed it is rejected. This captures the
      case where another writer has just created a review for the same finding
      (which legitimately supersedes the finding's currently open review) and
      the current writer's view of the finding is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: application-correction-stale-version
    parent_entity: Application
    write_endpoint: "PUT /fair-lending/applications/{applicationId}"
    occ_field: expected_application_version
    description: |
      Correcting an Application whose version has advanced since the client
      last observed it is rejected. This captures the case where another writer
      has just corrected or validated the application and the current writer's
      view of the record is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: denial_impact_ratio
    trigger: "POST /fair-lending/analysis-runs/{runId}/compute"
    algorithm: threshold
    formula: |
      Let C = in-scope applications (run.market_id, run.product_type,
      decision_date in [period_start, period_end), status VALIDATED,
      applicant_group == CONTROL); P = same with applicant_group in
      {PROTECTED_1, PROTECTED_2}.
      NET variant denominators count only outcome in {ORIGINATED, DENIED}:
        approval_rate_control_net   = |C: ORIGINATED| / |C: ORIGINATED or DENIED|
        approval_rate_protected_net = |P: ORIGINATED| / |P: ORIGINATED or DENIED|
        impact_ratio_net = approval_rate_protected_net / approval_rate_control_net
      RAW variant denominators additionally count WITHDRAWN and
      APPROVED_NOT_ACCEPTED:
        impact_ratio_raw = (|P: ORIGINATED| / |P: any outcome|)
                         / (|C: ORIGINATED| / |C: any outcome|)
      Zero-division rule: if a cohort's denominator is 0 the cohort rate is
      undefined and the ratio is not computed (compute fails with
      ERR_NO_IN_SCOPE_APPLICATIONS at lock time instead); if the control rate
      is exactly 0 with non-empty denominators, the ratio is defined as 0.0
      when the protected rate > 0 and 1.0 when both rates are 0.
      Classification (on impact_ratio_net): ratio >= 0.90 -> NONE;
      0.80 <= ratio < 0.90 -> MARGINAL; ratio < 0.80 -> ADVERSE.
      Screening flag: screening_flag = (min(impact_ratio_net, impact_ratio_raw) < 0.80).
      Auto-finding fires when screening_flag is true (strictly below 0.80;
      exactly 0.80 does NOT flag).
    input_set: "VALIDATED applications in the run's market/product/period snapshot"
    constants:
      FOUR_FIFTHS_THRESHOLD: 0.80
      NONE_FLOOR: 0.90
    precision: "4 decimal places, round_half_up"
    variants:
      - name: net
        when: "board-reporting basis; drives adverse_classification"
        difference: "denominators exclude WITHDRAWN and APPROVED_NOT_ACCEPTED rows"
      - name: raw
        when: "screening basis; conservative outer bound"
        difference: "denominators include WITHDRAWN and APPROVED_NOT_ACCEPTED rows; identical data yields a different ratio whenever such rows exist"

  - name: pricing_disparity_bps
    trigger: "POST /fair-lending/analysis-runs/{runId}/compute"
    algorithm: aggregation
    formula: |
      Over the run snapshot restricted to outcome == ORIGINATED:
      unadjusted: mean(note_rate_bps over protected cohort)
                - mean(note_rate_bps over control cohort)
      adjusted:   same means but excluding every application whose
                  has_exception == APPROVED.
      Empty-cohort rule: if either cohort has zero ORIGINATED rows, both
      pricing_disparity fields are null and no pricing auto-finding is
      considered for the run.
      Auto-finding (kind=PRICING_DISPARITY) fires when the UNADJUSTED spread
      is strictly greater than 15 bps (exactly 15 does not flag).
    input_set: "snapshot applications with outcome ORIGINATED"
    constants:
      PRICING_FLAG_THRESHOLD_BPS: 15
    precision: "4 decimal places, round_half_up"
    variants:
      - name: unadjusted
        when: "screening; drives the PRICING_DISPARITY auto-finding"
        difference: "includes exception-priced applications"
      - name: exception_adjusted
        when: "remediation sizing and board reporting"
        difference: "excludes applications with has_exception == APPROVED; identical data yields a different spread whenever such rows exist"

  - name: market_penetration_index
    trigger: "GET /fair-lending/markets/{marketId}/penetration-report"
    algorithm: aggregation
    formula: |
      Over applications of the market with decision_date in
      [period_start, period_end) and status VALIDATED:
      bank_protected_origination_share = |ORIGINATED and applicant_group in {PROTECTED_1, PROTECTED_2}| / |ORIGINATED|
      branch_weighted variant: penetration_index_branch_weighted =
        bank_protected_origination_share / market.protected_group_population_share
      peer_relative variant: penetration_index_peer_relative =
        (|protected ORIGINATED| / |protected VALIDATED rows in period|)
        / peer_benchmark.peer_protected_origination_rate
      where peer_benchmark is the PeerBenchmark whose market_id matches and
      whose [period_start, period_end) equals the requested period; if none
      exists, penetration_index_peer_relative is null.
      Zero-row rule: if the period contains zero ORIGINATED rows,
      bank_protected_origination_share and both index fields are null.
    input_set: "VALIDATED applications of the market decided in the requested half-open period"
    constants: {}
    precision: "4 decimal places, round_half_up"
    variants:
      - name: branch_weighted
        when: "branch footprint review"
        difference: "benchmarks the bank's protected origination share against the market's protected population share"
      - name: peer_relative
        when: "peer/market comparison"
        difference: "benchmarks the bank's protected origination rate against aggregate peer rate; identical data yields a different index"

  - name: officer_risk_score
    trigger: "any mutation touching the officer's applications (validate/correct/exclude), PricingExceptions (approve/rescind/expire), or UnderwritingOverrides (confirm/reverse)"
    algorithm: weighted_scoring
    formula: |
      Let A = max(1, officer.validated_application_count).
      override_rate          = officer.confirmed_override_count / A
      exception_approval_rate = officer.approved_exception_count / A
      pricing_dispersion_bps = (max - min) of note_rate_bps over the officer's
                               VALIDATED applications with outcome ORIGINATED;
                               0 when fewer than 2 such rows exist.
      score = min(100,
                  40 * min(1, override_rate / 0.20)
                + 35 * min(1, exception_approval_rate / 0.10)
                + 25 * min(1, pricing_dispersion_bps / 70))
      Tier (evaluated on the rounded score): score >= 70 -> RED;
      40 <= score < 70 -> WATCH; score < 40 -> GREEN.
      Tier transitions fire escalation side effects only on UPWARD crossings
      into RED; downward moves never un-escalate ESCALATED exceptions.
    input_set: "the officer's VALIDATED applications, APPROVED exceptions, CONFIRMED overrides"
    constants:
      OVERRIDE_NORM: 0.20
      EXCEPTION_NORM: 0.10
      DISPERSION_NORM_BPS: 70
      WEIGHT_OVERRIDE: 40
      WEIGHT_EXCEPTION: 35
      WEIGHT_DISPERSION: 25
      WATCH_FLOOR: 40
      RED_FLOOR: 70
    precision: "2 decimal places, round_half_up"

  - name: remediation_pool_allocation
    trigger: "POST /fair-lending/corrective-action-plans/{capId}/approve"
    algorithm: waterfall_allocation
    formula: |
      n = |finding.harmed_application_ids| (must be >= 1, else no payments are
      generated and remaining_cents stays equal to pool_cents).
      Rounding order is pinned: FIRST round each per-payment share,
      THEN reconcile the residual:
        share_i = round_half_up(pool_cents / n) to whole cents, same for all i
        residual = pool_cents - n * share_i        (may be negative)
        The payment whose application appears FIRST in
        finding.harmed_application_ids (client-pinned array order) receives
        share_i + residual; all others receive share_i.
      Invariant after allocation: sum(payment amounts) == pool_cents exactly,
      so remaining_cents == 0 whenever n >= 1.
    input_set: "finding.harmed_application_ids recorded at substantiation"
    constants: {}
    precision: "whole cents, round_half_up per payment before residual reconciliation"

  - name: dataset_staleness
    trigger: "POST /fair-lending/analysis-runs/{runId}/compute (precondition evaluation)"
    algorithm: chronological
    formula: |
      stale = exists an in-scope application (market/product/period match,
      status VALIDATED or corrected out of it) whose updated_at is strictly
      later than run.locked_at. Both timestamps are stamped from the server
      logical clock (default 2026-05-01T00:00:00Z). When stale, compute is rejected with
      ERR_STALE_DATASET; the analyst must unlock and re-lock.
    input_set: "applications matching the run scope"
    constants: {}
    precision: "timestamps compared at millisecond precision"

  - name: cap_funds_rollup
    trigger: "any RemediationPayment transition (disburse, void, mark-returned) and manual payment creation"
    algorithm: aggregation
    formula: |
      disbursed_cents = sum(amount_cents over payments with status DISBURSED)
      remaining_cents = pool_cents - sum(amount_cents over payments with status in {PENDING, DISBURSED})
      Completion rule: when every linked payment is in {DISBURSED, VOIDED,
      RETURNED} and at least one is DISBURSED, the CAP auto-transitions to
      COMPLETED and its finding -> CLOSED (which decrements the run's
      open_finding_count).
    input_set: "payments of the CAP"
    constants: {}
    precision: "whole cents"

  - name: board_report_aggregation
    trigger: "POST /fair-lending/board-reports/{reportId}/refresh (DRAFT or RETURNED reports)"
    algorithm: aggregation
    formula: |
      Runs in scope: AnalysisRuns whose [period_start, period_end) overlaps the
      report period. Exclusion filter: a finding is EXCLUDED when its run is
      linked (SelfTest.analysis_run_id) to a SelfTest whose disclosure_status
      is PRIVILEGED.
      substantiated_finding_count = |findings in {SUBSTANTIATED, CLOSED} on in-scope runs, not excluded|
      privileged_exclusion_count  = |findings in {SUBSTANTIATED, CLOSED} on in-scope runs, excluded|
      caps_executing_count        = |CAPs in {EXECUTING, OVERDUE}|
      red_officer_count           = |LoanOfficers with monitoring_tier == RED|
      Publish freezes the counts; refresh recomputes them.
    input_set: "findings on overlapping runs, CAPs, officers; privileged self-test linkage"
    constants: {}
    precision: "integer counts"

  - name: monitoring_cycle_effects
    trigger: "POST /fair-lending/monitoring/run-cycle"
    algorithm: threshold
    formula: |
      Executed in this pinned order:
      1. PricingExceptions in REQUESTED or ESCALATED with created_at strictly
         more than 30 days before the current logical time -> EXPIRED
         (exactly 30 days old does NOT expire).
      2. CAPs in EXECUTING with due_date strictly before the current logical
         date and at least one PENDING payment -> OVERDUE (due_date equal to
         today does NOT flip).
      3. SelfTests in CLOSED_VIOLATION: cycles_open += 1; when cycles_open
         reaches 2 the self-test -> PRIVILEGE_LOST and disclosure_status ->
         DISCLOSABLE.
      4. Every LoanOfficer risk_score/monitoring_tier recomputed.
    input_set: "exceptions, CAPs, self-tests, officers"
    constants:
      EXCEPTION_EXPIRY_DAYS: 30
      PRIVILEGE_FORFEIT_CYCLES: 2
    precision: "day granularity against the logical clock"

  - name: snapshot_scope_membership
    trigger: "POST /fair-lending/analysis-runs/{runId}/lock"
    algorithm: aggregation
    formula: |
      in-scope = applications with market_id == run.market_id,
      product_type == run.product_type,
      period_start <= decision_date < period_end (half-open),
      status != EXCLUDED.
      snapshot_application_count = |in-scope|; the id list is frozen.
      Membership uses decision_date only (application_date is informational).
    input_set: "all non-EXCLUDED applications"
    constants: {}
    precision: "date granularity, half-open interval"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is declared"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "Identity-level checks: SoD (confirmer != initial reviewer; disburser != CAP approver; report approver != submitter; substantiator != manual-finding creator) and ownership (LoanOfficer X-User-ID == resource's loan_officer_id)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "confirm/disburse/approve/substantiate/dispute/withdraw endpoints"
  - priority: 4
    category: existence
    check: "Path ids exist, validated left-to-right; body FK references exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"
  - priority: 5
    category: state
    check: "Target resource lifecycle state permits the operation (ERR_ALREADY_TERMINAL only for transitions attempted on a resource already terminal; creation operations referencing a terminal or wrong-state entity yield ERR_INVALID_STATE)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 6
    category: business_safety
    check: "Compliance gates: privilege gate on finalize, suspended officer blocks exception/override creation, director-authority on high-value CAPs and RED-tier/ESCALATED exceptions, finalized-run freeze on correction/exclusion/rescind"
    error_id: ERR_PRIVILEGE_GATE
    http_status: 409
    applies_to: "finalize, pricing-exception/override create, CAP approve, exception approve, application PUT/exclude"
  - priority: 7
    category: business_temporal
    check: "Interval conflicts: run scope half-open overlap; self-test window closed-interval overlap; board-report quarter gap/overlap"
    error_id: ERR_SCOPE_OVERLAP
    http_status: 409
    applies_to: "POST analysis-runs, POST self-tests, POST board-reports"
  - priority: 8
    category: business_constraint
    check: "Structural rules: quarter alignment, non-empty scope, all-validated lock, single active CAP per finding, unlock requires zero findings, finalize requires terminal findings, override decision pair must differ, benchmark period uniqueness, substantiation evidence, self-test close/remediate evidence, publish readiness"
    error_id: ERR_PERIOD_NOT_QUARTER
    http_status: 422
    applies_to: "resource-specific business rules"
  - priority: 9
    category: business_referential
    check: "Cross-entity data coherence: matched-pair comparability, control-pool emptiness, payee membership in CAP harmed set, dataset staleness"
    error_id: ERR_MATCH_NOT_COMPARABLE
    http_status: 422
    applies_to: "POST matched-pair-reviews, POST remediation-payments, POST compute"
  - priority: 10
    category: business_fiscal
    check: "Funds checks: manual payment amount must be <= CAP remaining_cents"
    error_id: ERR_CAP_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /fair-lending/remediation-payments"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Markets ---
  - method: POST
    path: "/fair-lending/markets"
    description: "Create a market (assessment area)"
    roles: [BankAdmin]
    code: 201
    input: [name, msa_code, protected_group_population_share, peer_group_code]
    output: Market
    side_effects: []
  - method: GET
    path: "/fair-lending/markets"
    description: "List markets"
    roles: [BankAdmin, LendingDataOps, LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: ["limit?", "offset?"]
    output: Market[]
    side_effects: []
  - method: GET
    path: "/fair-lending/markets/{marketId}"
    description: "Get a market"
    roles: [BankAdmin, LendingDataOps, LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: []
    output: Market
    side_effects: []
  - method: GET
    path: "/fair-lending/markets/{marketId}/penetration-report"
    description: "Computed read: market penetration analysis with both variants (branch_weighted and peer_relative) over a half-open decision period"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: [period_start, period_end]
    output: "{ period_start: string, period_end: string, bank_protected_origination_share: number, penetration_index_branch_weighted: number, penetration_index_peer_relative: number, peer_benchmark_id: string }"
    side_effects: ["runs market_penetration_index (both variants)"]

  # --- Branches ---
  - method: POST
    path: "/fair-lending/branches"
    description: "Create a branch"
    roles: [BankAdmin]
    code: 201
    input: [market_id, name, tract_minority_pct, opened_on]
    output: Branch
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/fair-lending/branches"
    description: "List branches"
    roles: [BankAdmin, LendingDataOps, LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: ["market_id?", "status?", "limit?", "offset?"]
    output: Branch[]
    side_effects: []
  - method: GET
    path: "/fair-lending/branches/{branchId}"
    description: "Get a branch"
    roles: [BankAdmin, LendingDataOps, LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: []
    output: Branch
    side_effects: []
  - method: POST
    path: "/fair-lending/branches/{branchId}/close"
    description: "Close a branch; cascades its ACTIVE officers to SUSPENDED"
    roles: [BankAdmin]
    code: 200
    input: []
    output: Branch
    side_effects: ["status -> CLOSED", "ACTIVE LoanOfficers of branch -> SUSPENDED"]

  # --- LoanOfficers ---
  - method: POST
    path: "/fair-lending/loan-officers"
    description: "Create a loan officer"
    roles: [BankAdmin]
    code: 201
    input: [branch_id, full_name]
    output: LoanOfficer
    side_effects: ["status=ACTIVE, monitoring_tier=GREEN, risk_score=0"]
  - method: GET
    path: "/fair-lending/loan-officers"
    description: "List loan officers"
    roles: [BankAdmin, LendingDataOps, LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: ["branch_id?", "status?", "monitoring_tier?", "limit?", "offset?"]
    output: LoanOfficer[]
    side_effects: []
  - method: GET
    path: "/fair-lending/loan-officers/{officerId}"
    description: "Get a loan officer"
    roles: [BankAdmin, LendingDataOps, LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: []
    output: LoanOfficer
    side_effects: []
  - method: GET
    path: "/fair-lending/loan-officers/{officerId}/risk-scorecard"
    description: "Computed read: officer exception/override risk scorecard"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: "{ application_count: integer, confirmed_override_count: integer, override_rate: number, approved_exception_count: integer, exception_approval_rate: number, pricing_dispersion_bps: number, risk_score: number, monitoring_tier: string }"
    side_effects: ["runs officer_risk_score"]
  - method: POST
    path: "/fair-lending/loan-officers/{officerId}/suspend"
    description: "Suspend an officer (blocks new exceptions/overrides)"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: LoanOfficer
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/fair-lending/loan-officers/{officerId}/reinstate"
    description: "Reinstate a suspended officer"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: LoanOfficer
    side_effects: ["status -> ACTIVE"]

  # --- Applications ---
  - method: POST
    path: "/fair-lending/applications"
    description: "Ingest a loan application record"
    roles: [LendingDataOps]
    code: 201
    input: [market_id, branch_id, loan_officer_id, product_type, applicant_group, outcome, note_rate_bps, loan_amount_cents, credit_score, dti_pct, application_date, decision_date]
    output: Application
    side_effects: ["status=RECEIVED, has_exception=NONE"]
  - method: GET
    path: "/fair-lending/applications"
    description: "List applications with filters"
    roles: [BankAdmin, LendingDataOps, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: ["market_id?", "branch_id?", "loan_officer_id?", "product_type?", "applicant_group?", "outcome?", "status?", "limit?", "offset?"]
    output: Application[]
    side_effects: []
  - method: GET
    path: "/fair-lending/applications/{applicationId}"
    description: "Get an application"
    roles: [BankAdmin, LendingDataOps, LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: POST
    path: "/fair-lending/applications/{applicationId}/validate"
    description: "Mark an application data-validated (RECEIVED -> VALIDATED)"
    roles: [LendingDataOps]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> VALIDATED", "officer.validated_application_count += 1; officer risk recompute"]
  - method: PUT
    path: "/fair-lending/applications/{applicationId}"
    description: "Correct an application record (OCC; VALIDATED rows revert to RECEIVED)"
    roles: [LendingDataOps]
    code: 200
    input: ["outcome?", "note_rate_bps?", "credit_score?", "dti_pct?", expected_application_version]
    output: Application
    side_effects: ["if was VALIDATED: status -> RECEIVED and officer.validated_application_count -= 1", "increments Application.version by 1", "covering DATA_LOCKED runs become stale"]
  - method: POST
    path: "/fair-lending/applications/{applicationId}/exclude"
    description: "Exclude an application from analysis (terminal)"
    roles: [LendingDataOps]
    code: 200
    input: []
    output: Application
    side_effects: ["status -> EXCLUDED", "if was VALIDATED: officer.validated_application_count -= 1"]

  # --- PricingExceptions ---
  - method: POST
    path: "/fair-lending/pricing-exceptions"
    description: "Loan officer requests a pricing exception on an own application; requires application status VALIDATED and owning officer ACTIVE"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, kind, requested_rate_bps, justification]
    output: PricingException
    side_effects: ["status=REQUESTED; loan_officer_id copied from application", "application.has_exception -> REQUESTED"]
  - method: GET
    path: "/fair-lending/pricing-exceptions"
    description: "List pricing exceptions"
    roles: [LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: ["application_id?", "loan_officer_id?", "status?", "limit?", "offset?"]
    output: PricingException[]
    side_effects: []
  - method: GET
    path: "/fair-lending/pricing-exceptions/{exceptionId}"
    description: "Get a pricing exception"
    roles: [LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: PricingException
    side_effects: []
  - method: POST
    path: "/fair-lending/pricing-exceptions/{exceptionId}/approve"
    description: "Approve a pricing exception; RED-tier officers' exceptions require ComplianceDirector"
    roles: [FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: PricingException
    side_effects: ["status -> APPROVED", "application.has_exception -> APPROVED", "officer.approved_exception_count += 1; risk recompute", "upward RED crossing escalates officer's other REQUESTED exceptions"]
  - method: POST
    path: "/fair-lending/pricing-exceptions/{exceptionId}/deny"
    description: "Deny a pricing exception"
    roles: [FairLendingOfficer, ComplianceDirector]
    code: 200
    input: [reason]
    output: PricingException
    side_effects: ["status -> DENIED", "application.has_exception -> NONE"]
  - method: POST
    path: "/fair-lending/pricing-exceptions/{exceptionId}/rescind"
    description: "Rescind an approved exception (compensating action)"
    roles: [FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: PricingException
    side_effects: ["status -> RESCINDED", "application.has_exception -> NONE", "officer.approved_exception_count -= 1; risk recompute"]
  - method: POST
    path: "/fair-lending/pricing-exceptions/{exceptionId}/withdraw"
    description: "Owning loan officer withdraws a pending exception"
    roles: [LoanOfficer]
    code: 200
    input: []
    output: PricingException
    side_effects: ["status -> WITHDRAWN", "application.has_exception -> NONE"]

  # --- UnderwritingOverrides ---
  - method: POST
    path: "/fair-lending/underwriting-overrides"
    description: "Loan officer records an underwriting decision override on an own application; requires application status VALIDATED and owning officer ACTIVE"
    roles: [LoanOfficer]
    code: 201
    input: [application_id, original_decision, overridden_decision, justification]
    output: UnderwritingOverride
    side_effects: ["status=RECORDED; loan_officer_id copied from application"]
  - method: GET
    path: "/fair-lending/underwriting-overrides"
    description: "List underwriting overrides"
    roles: [LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: ["application_id?", "loan_officer_id?", "status?", "limit?", "offset?"]
    output: UnderwritingOverride[]
    side_effects: []
  - method: GET
    path: "/fair-lending/underwriting-overrides/{overrideId}"
    description: "Get an underwriting override"
    roles: [LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: UnderwritingOverride
    side_effects: []
  - method: POST
    path: "/fair-lending/underwriting-overrides/{overrideId}/confirm"
    description: "Confirm a recorded override after file check"
    roles: [FairLendingOfficer]
    code: 200
    input: []
    output: UnderwritingOverride
    side_effects: ["status -> CONFIRMED", "officer.confirmed_override_count += 1; risk recompute; upward RED crossing escalates officer's REQUESTED exceptions"]
  - method: POST
    path: "/fair-lending/underwriting-overrides/{overrideId}/reverse"
    description: "Reverse an override (compensating action; from CONFIRMED decrements the count)"
    roles: [FairLendingOfficer, ComplianceDirector]
    code: 200
    input: [reason]
    output: UnderwritingOverride
    side_effects: ["status -> REVERSED", "if was CONFIRMED: officer.confirmed_override_count -= 1; risk recompute"]

  # --- PeerBenchmarks ---
  - method: POST
    path: "/fair-lending/peer-benchmarks"
    description: "Load peer/market aggregate benchmark for a market+period"
    roles: [LendingDataOps]
    code: 201
    input: [market_id, period_start, period_end, peer_protected_origination_rate, peer_origination_count, source]
    output: PeerBenchmark
    side_effects: []
  - method: GET
    path: "/fair-lending/peer-benchmarks"
    description: "List peer benchmarks"
    roles: [LendingDataOps, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: ["market_id?", "limit?", "offset?"]
    output: PeerBenchmark[]
    side_effects: []
  - method: GET
    path: "/fair-lending/peer-benchmarks/{benchmarkId}"
    description: "Get a peer benchmark"
    roles: [LendingDataOps, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: PeerBenchmark
    side_effects: []

  # --- AnalysisRuns ---
  - method: POST
    path: "/fair-lending/analysis-runs"
    description: "Create an analysis run (scope overlap rejected at creation: same market+product+basis, half-open period overlap, among non-ARCHIVED runs)"
    roles: [FairLendingAnalyst]
    code: 201
    input: [market_id, product_type, prohibited_basis, period_start, period_end]
    output: AnalysisRun
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/fair-lending/analysis-runs"
    description: "List analysis runs"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: ["market_id?", "status?", "limit?", "offset?"]
    output: AnalysisRun[]
    side_effects: []
  - method: GET
    path: "/fair-lending/analysis-runs/{runId}"
    description: "Get an analysis run"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: AnalysisRun
    side_effects: []
  - method: POST
    path: "/fair-lending/analysis-runs/{runId}/lock"
    description: "Lock the dataset (requires >=1 in-scope app, all VALIDATED)"
    roles: [FairLendingAnalyst]
    code: 200
    input: []
    output: AnalysisRun
    side_effects: ["status -> DATA_LOCKED", "locked_at set; snapshot frozen"]
  - method: POST
    path: "/fair-lending/analysis-runs/{runId}/unlock"
    description: "Unlock back to DRAFT (requires zero linked findings)"
    roles: [FairLendingAnalyst]
    code: 200
    input: []
    output: AnalysisRun
    side_effects: ["status -> DRAFT", "snapshot discarded"]
  - method: POST
    path: "/fair-lending/analysis-runs/{runId}/compute"
    description: "Compute disparity metrics; auto-flags findings on threshold breach"
    roles: [FairLendingAnalyst]
    code: 200
    input: []
    output: AnalysisRun
    side_effects: ["status -> COMPUTED", "runs denial_impact_ratio + pricing_disparity_bps (both variants)", "auto-creates FLAGGED findings per screening rules; open_finding_count updated"]
  - method: POST
    path: "/fair-lending/analysis-runs/{runId}/finalize"
    description: "Finalize a run (requires all findings terminal; privilege gate)"
    roles: [FairLendingOfficer]
    code: 200
    input: []
    output: AnalysisRun
    side_effects: ["status -> FINALIZED", "finalized_at set; snapshot applications frozen against correction/exclusion"]
  - method: POST
    path: "/fair-lending/analysis-runs/{runId}/archive"
    description: "Archive a finalized run (releases scope-overlap block)"
    roles: [FairLendingOfficer]
    code: 200
    input: []
    output: AnalysisRun
    side_effects: ["status -> ARCHIVED"]

  # --- DisparityFindings ---
  - method: POST
    path: "/fair-lending/findings"
    description: "Create a manual finding on a COMPUTED/UNDER_REVIEW run; optional supersedes_finding_id supersedes that finding"
    roles: [FairLendingAnalyst]
    code: 201
    input: [analysis_run_id, kind, notes, "supersedes_finding_id?"]
    output: DisparityFinding
    side_effects: ["status=FLAGGED, source=MANUAL, created_by_user_id set", "run.open_finding_count += 1", "if supersedes_finding_id given: that finding -> SUPERSEDED with superseded_by_finding_id set"]
  - method: GET
    path: "/fair-lending/findings"
    description: "List findings"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: ["analysis_run_id?", "status?", "kind?", "superseded_by_finding_id?", "limit?", "offset?"]
    output: DisparityFinding[]
    side_effects: []
  - method: GET
    path: "/fair-lending/findings/{findingId}"
    description: "Get a finding"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: DisparityFinding
    side_effects: []
  - method: POST
    path: "/fair-lending/findings/{findingId}/begin-review"
    description: "Begin triage of a flagged finding"
    roles: [FairLendingAnalyst]
    code: 200
    input: []
    output: DisparityFinding
    side_effects: ["status -> UNDER_REVIEW", "if run COMPUTED: run -> UNDER_REVIEW"]
  - method: POST
    path: "/fair-lending/findings/{findingId}/substantiate"
    description: "Officer substantiates a finding, recording the harmed application set"
    roles: [FairLendingOfficer]
    code: 200
    input: [harmed_application_ids]
    output: DisparityFinding
    side_effects: ["status -> SUBSTANTIATED", "harmed_application_ids stored; substantiated_by_user_id set"]
  - method: POST
    path: "/fair-lending/findings/{findingId}/refute"
    description: "Officer refutes a finding under review"
    roles: [FairLendingOfficer]
    code: 200
    input: [reason]
    output: DisparityFinding
    side_effects: ["status -> REFUTED", "run.open_finding_count -= 1"]
  - method: POST
    path: "/fair-lending/findings/{findingId}/reopen"
    description: "Reopen a refuted finding (revision loop)"
    roles: [FairLendingAnalyst]
    code: 200
    input: [reason]
    output: DisparityFinding
    side_effects: ["status -> UNDER_REVIEW", "reopen_count += 1", "run.open_finding_count += 1"]

  # --- MatchedPairReviews ---
  - method: POST
    path: "/fair-lending/matched-pair-reviews"
    description: "Create a matched-pair review on a finding under review; control_application_id optional — when omitted the server selector picks the nearest CONTROL comparator; supersedes the finding's currently open review; OCC on finding version"
    roles: [FairLendingAnalyst]
    code: 201
    input: [finding_id, target_application_id, "control_application_id?", expected_finding_version]
    output: MatchedPairReview
    side_effects: ["status=PENDING", "increments DisparityFinding.version by 1", "any open review of the same finding -> SUPERSEDED", "selector when control omitted: candidates are CONTROL-group ORIGINATED VALIDATED applications with same market_id and product_type and |credit_score - target.credit_score| <= 40; ranked by |credit_score diff| ASC, then |dti_pct diff| ASC, then created_at ASC; empty pool -> ERR_EMPTY_CONTROL_POOL"]
  - method: GET
    path: "/fair-lending/matched-pair-reviews"
    description: "List matched-pair reviews"
    roles: [LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: ["finding_id?", "target_application_id?", "control_application_id?", "status?", "limit?", "offset?"]
    output: MatchedPairReview[]
    side_effects: []
  - method: GET
    path: "/fair-lending/matched-pair-reviews/{reviewId}"
    description: "Get a matched-pair review"
    roles: [LoanOfficer, FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: MatchedPairReview
    side_effects: []
  - method: POST
    path: "/fair-lending/matched-pair-reviews/{reviewId}/submit-initial"
    description: "Submit initial review outcome (PENDING or DISPUTED -> INITIAL_REVIEWED)"
    roles: [FairLendingAnalyst]
    code: 200
    input: [outcome, notes]
    output: MatchedPairReview
    side_effects: ["status -> INITIAL_REVIEWED", "initial_outcome/initial_reviewer_user_id stored"]
  - method: POST
    path: "/fair-lending/matched-pair-reviews/{reviewId}/confirm"
    description: "Officer confirms an initial review (SoD: confirmer != initial reviewer)"
    roles: [FairLendingOfficer]
    code: 200
    input: []
    output: MatchedPairReview
    side_effects: ["status -> CONFIRMED", "confirmed_by_user_id stored"]
  - method: POST
    path: "/fair-lending/matched-pair-reviews/{reviewId}/dispute"
    description: "Owning loan officer disputes an initial review"
    roles: [LoanOfficer]
    code: 200
    input: [reason]
    output: MatchedPairReview
    side_effects: ["status -> DISPUTED", "dispute_reason stored"]

  # --- CorrectiveActionPlans ---
  - method: POST
    path: "/fair-lending/corrective-action-plans"
    description: "Draft a CAP for a SUBSTANTIATED finding; supersedes the finding's DRAFT/RETURNED CAPs; blocked while one is SUBMITTED/EXECUTING/OVERDUE; OCC on finding version"
    roles: [FairLendingAnalyst]
    code: 201
    input: [finding_id, title, pool_cents, due_date, expected_finding_version]
    output: CorrectiveActionPlan
    side_effects: ["status=DRAFT; remaining_cents=pool_cents; disbursed_cents=0", "increments DisparityFinding.version by 1", "finding's DRAFT/RETURNED CAPs -> SUPERSEDED"]
  - method: GET
    path: "/fair-lending/corrective-action-plans"
    description: "List CAPs"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: ["finding_id?", "status?", "limit?", "offset?"]
    output: CorrectiveActionPlan[]
    side_effects: []
  - method: GET
    path: "/fair-lending/corrective-action-plans/{capId}"
    description: "Get a CAP"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: []
  - method: POST
    path: "/fair-lending/corrective-action-plans/{capId}/submit"
    description: "Submit a draft CAP for approval"
    roles: [FairLendingAnalyst]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["status -> SUBMITTED"]
  - method: POST
    path: "/fair-lending/corrective-action-plans/{capId}/approve"
    description: "Approve a CAP (pool_cents >= 25000000 requires ComplianceDirector); generates remediation payments"
    roles: [FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["status -> EXECUTING", "approved_by_user_id/approved_at set", "runs remediation_pool_allocation; AUTO_ALLOCATED PENDING payments created; remaining_cents = pool_cents - sum(allocated)"]
  - method: POST
    path: "/fair-lending/corrective-action-plans/{capId}/return"
    description: "Return a submitted CAP for revision"
    roles: [FairLendingOfficer, ComplianceDirector]
    code: 200
    input: [reason]
    output: CorrectiveActionPlan
    side_effects: ["status -> RETURNED"]
  - method: POST
    path: "/fair-lending/corrective-action-plans/{capId}/revise"
    description: "Revise a returned CAP back to DRAFT"
    roles: [FairLendingAnalyst]
    code: 200
    input: []
    output: CorrectiveActionPlan
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/fair-lending/corrective-action-plans/{capId}/extend"
    description: "Director extends an overdue CAP's due date (OVERDUE -> EXECUTING)"
    roles: [ComplianceDirector]
    code: 200
    input: [new_due_date]
    output: CorrectiveActionPlan
    side_effects: ["status -> EXECUTING", "due_date = new_due_date"]
  - method: POST
    path: "/fair-lending/corrective-action-plans/{capId}/cancel"
    description: "Cancel a DRAFT or RETURNED CAP"
    roles: [FairLendingAnalyst, ComplianceDirector]
    code: 200
    input: [reason]
    output: CorrectiveActionPlan
    side_effects: ["status -> CANCELLED"]

  # --- RemediationPayments ---
  - method: POST
    path: "/fair-lending/remediation-payments"
    description: "Specialist adds a manual payment against an EXECUTING/OVERDUE CAP's remaining funds"
    roles: [RemediationSpecialist]
    code: 201
    input: [corrective_action_plan_id, application_id, amount_cents]
    output: RemediationPayment
    side_effects: ["status=PENDING, origin=MANUAL", "CAP.remaining_cents -= amount_cents"]
  - method: GET
    path: "/fair-lending/remediation-payments"
    description: "List remediation payments"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: ["corrective_action_plan_id?", "application_id?", "status?", "limit?", "offset?"]
    output: RemediationPayment[]
    side_effects: []
  - method: GET
    path: "/fair-lending/remediation-payments/{paymentId}"
    description: "Get a remediation payment"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector, RemediationSpecialist]
    code: 200
    input: []
    output: RemediationPayment
    side_effects: []
  - method: POST
    path: "/fair-lending/remediation-payments/{paymentId}/disburse"
    description: "Disburse a pending payment (SoD vs CAP approver)"
    roles: [RemediationSpecialist]
    code: 200
    input: []
    output: RemediationPayment
    side_effects: ["status -> DISBURSED", "CAP.disbursed_cents += amount_cents", "CAP completion check -> possible COMPLETED -> finding CLOSED -> run.open_finding_count -= 1"]
  - method: POST
    path: "/fair-lending/remediation-payments/{paymentId}/void"
    description: "Void a pending payment (returns funds to the pool)"
    roles: [RemediationSpecialist]
    code: 200
    input: [reason]
    output: RemediationPayment
    side_effects: ["status -> VOIDED", "CAP.remaining_cents += amount_cents"]
  - method: POST
    path: "/fair-lending/remediation-payments/{paymentId}/mark-returned"
    description: "Mark a disbursed payment returned (funds clawed back to the pool)"
    roles: [RemediationSpecialist]
    code: 200
    input: [reason]
    output: RemediationPayment
    side_effects: ["status -> RETURNED", "CAP.remaining_cents += amount_cents; CAP.disbursed_cents -= amount_cents"]

  # --- SelfTests ---
  - method: POST
    path: "/fair-lending/self-tests"
    description: "Open a self-test engagement (closed-interval window overlap with ACTIVE/CLOSED_VIOLATION self-tests of the same market is rejected)"
    roles: [FairLendingAnalyst]
    code: 201
    input: [market_id, "analysis_run_id?", window_start, window_end]
    output: SelfTest
    side_effects: ["status=ACTIVE, privileged=false, disclosure_status=DISCLOSABLE"]
  - method: GET
    path: "/fair-lending/self-tests"
    description: "List self-tests"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: ["market_id?", "analysis_run_id?", "status?", "limit?", "offset?"]
    output: SelfTest[]
    side_effects: []
  - method: GET
    path: "/fair-lending/self-tests/{selfTestId}"
    description: "Get a self-test"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: SelfTest
    side_effects: []
  - method: POST
    path: "/fair-lending/self-tests/{selfTestId}/designate-privileged"
    description: "Director designates an ACTIVE self-test privileged"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: SelfTest
    side_effects: ["privileged=true, disclosure_status=PRIVILEGED"]
  - method: POST
    path: "/fair-lending/self-tests/{selfTestId}/close"
    description: "Close a self-test with an outcome; VIOLATION_FOUND requires a substantiated finding on the linked run"
    roles: [FairLendingOfficer]
    code: 200
    input: [outcome]
    output: SelfTest
    side_effects: ["status -> CLOSED_NO_VIOLATION or CLOSED_VIOLATION; cycles_open=0 on violation"]
  - method: POST
    path: "/fair-lending/self-tests/{selfTestId}/mark-remediated"
    description: "Mark a violation self-test remediated (requires a COMPLETED CAP on the linked run's findings)"
    roles: [FairLendingOfficer]
    code: 200
    input: []
    output: SelfTest
    side_effects: ["status -> REMEDIATED; privilege preserved"]

  # --- BoardReports ---
  - method: POST
    path: "/fair-lending/board-reports"
    description: "Create a quarterly board report (quarter-aligned; contiguous tiling with prior reports — gap or overlap rejected; first report exempt from gap check)"
    roles: [FairLendingAnalyst]
    code: 201
    input: [period_start, period_end]
    output: BoardReport
    side_effects: ["status=DRAFT; counts initialized to 0"]
  - method: GET
    path: "/fair-lending/board-reports"
    description: "List board reports"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: BoardReport[]
    side_effects: []
  - method: GET
    path: "/fair-lending/board-reports/{reportId}"
    description: "Get a board report"
    roles: [FairLendingAnalyst, FairLendingOfficer, ComplianceDirector]
    code: 200
    input: []
    output: BoardReport
    side_effects: []
  - method: POST
    path: "/fair-lending/board-reports/{reportId}/refresh"
    description: "Recompute aggregate counts (DRAFT/RETURNED only); privileged self-test findings excluded and counted separately"
    roles: [FairLendingAnalyst]
    code: 200
    input: []
    output: BoardReport
    side_effects: ["runs board_report_aggregation"]
  - method: POST
    path: "/fair-lending/board-reports/{reportId}/submit"
    description: "Officer submits a draft report"
    roles: [FairLendingOfficer]
    code: 200
    input: []
    output: BoardReport
    side_effects: ["status -> SUBMITTED; submitted_by_user_id set"]
  - method: POST
    path: "/fair-lending/board-reports/{reportId}/return"
    description: "Director returns a submitted report"
    roles: [ComplianceDirector]
    code: 200
    input: [reason]
    output: BoardReport
    side_effects: ["status -> RETURNED"]
  - method: POST
    path: "/fair-lending/board-reports/{reportId}/revise"
    description: "Analyst moves a returned report back to DRAFT"
    roles: [FairLendingAnalyst]
    code: 200
    input: []
    output: BoardReport
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/fair-lending/board-reports/{reportId}/approve"
    description: "Director approves a submitted report (SoD vs submitter)"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: BoardReport
    side_effects: ["status -> APPROVED; approved_by_user_id set"]
  - method: POST
    path: "/fair-lending/board-reports/{reportId}/publish"
    description: "Publish an approved report (requires all overlapping runs FINALIZED/ARCHIVED)"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: BoardReport
    side_effects: ["status -> PUBLISHED; published_at set; counts frozen"]

  # --- Monitoring checkpoint ---
  - method: POST
    path: "/fair-lending/monitoring/run-cycle"
    description: "Run the monitoring cycle checkpoint: expire stale exceptions (>30 days), flip overdue CAPs, advance self-test forfeiture counters, recompute officer tiers"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: "{ cycle_index: integer, expired_exception_ids: array, overdue_cap_ids: array, privilege_lost_self_test_ids: array }"
    side_effects: ["runs monitoring_cycle_effects in pinned order"]

  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set call the clock reads this default and never falls back to wall-clock time."
    roles: [BankAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or undeclared X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint per §1.5 roles" }
  - { id: ERR_SOD_VIOLATION, http: 403, condition: "Segregation-of-duties breach: confirmer == initial reviewer, disburser == CAP approver, report approver == submitter, or substantiator == manual-finding creator" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed LoanOfficer acting on a resource owned by a different officer" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist (path ids left-to-right, then body FKs)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request: missing required field, invalid enum, non-monotone dates, new_due_date not later than current logical date" }
  - { id: ERR_INVALID_DECISION_PAIR, http: 422, condition: "UnderwritingOverride original_decision equals overridden_decision (an override must flip the decision)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_<parent>_version does not match the parent's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource lifecycle state does not permit the operation" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Resource is in a terminal state; no further transitions" }
  - { id: ERR_PRIVILEGE_GATE, http: 409, condition: "Finalize blocked: run linked to a PRIVILEGED self-test still ACTIVE (privilege review incomplete)" }
  - { id: ERR_OFFICER_SUSPENDED, http: 409, condition: "Owning loan officer is SUSPENDED; new exceptions/overrides blocked" }
  - { id: ERR_DIRECTOR_APPROVAL_REQUIRED, http: 403, condition: "Conditional authority: RED-tier officer's exception, ESCALATED exception, or CAP with pool_cents >= 25000000 requires ComplianceDirector" }
  - { id: ERR_APPLICATION_LOCKED, http: 409, condition: "Application frozen in a FINALIZED/ARCHIVED run snapshot; correction/exclusion/rescind blocked" }
  - { id: ERR_SCOPE_OVERLAP, http: 409, condition: "Analysis run scope collides: same market+product+basis with overlapping half-open period among non-ARCHIVED runs (adjacency allowed)" }
  - { id: ERR_SELF_TEST_WINDOW_OVERLAP, http: 409, condition: "Self-test window collides: same market with overlapping CLOSED window among ACTIVE/CLOSED_VIOLATION self-tests (touching boundaries count as overlap)" }
  - { id: ERR_PERIOD_GAP, http: 409, condition: "Board report period not contiguous with the latest existing report's period_end" }
  - { id: ERR_PERIOD_OVERLAP, http: 409, condition: "Board report period overlaps an existing report" }
  - { id: ERR_PERIOD_NOT_QUARTER, http: 422, condition: "Board report period is not exactly one calendar quarter" }
  - { id: ERR_NO_IN_SCOPE_APPLICATIONS, http: 422, condition: "Lock rejected: zero in-scope applications" }
  - { id: ERR_APPLICATIONS_NOT_VALIDATED, http: 409, condition: "Lock rejected: an in-scope application is not VALIDATED" }
  - { id: ERR_STALE_DATASET, http: 409, condition: "Compute rejected: an in-scope application changed after locked_at" }
  - { id: ERR_RUN_HAS_OPEN_FINDINGS, http: 409, condition: "Unlock rejected: findings exist on the run" }
  - { id: ERR_FINDINGS_OPEN, http: 409, condition: "Finalize rejected: findings not in a terminal state remain" }
  - { id: ERR_NO_CONFIRMED_MATCHED_PAIR, http: 409, condition: "Substantiation of DENIAL_DISPARITY/OVERRIDE_ASYMMETRY requires a CONFIRMED matched-pair review" }
  - { id: ERR_MATCH_NOT_COMPARABLE, http: 422, condition: "Matched pair not comparable: different market/product, wrong cohorts, wrong outcome pairing, or credit-score delta > 40" }
  - { id: ERR_EMPTY_CONTROL_POOL, http: 422, condition: "Selector found no eligible CONTROL comparator for the target application" }
  - { id: ERR_CAP_ACTIVE, http: 409, condition: "A CAP in SUBMITTED/EXECUTING/OVERDUE already exists for the finding" }
  - { id: ERR_CAP_NOT_EXECUTING, http: 409, condition: "Payment operation requires CAP in EXECUTING or OVERDUE" }
  - { id: ERR_CAP_BUDGET_EXCEEDED, http: 422, condition: "Manual payment amount exceeds CAP remaining_cents" }
  - { id: ERR_PAYEE_NOT_IN_CAP_SCOPE, http: 422, condition: "Payment application_id is not in the finding's harmed_application_ids" }
  - { id: ERR_NO_SUBSTANTIATED_FINDING, http: 409, condition: "Self-test close VIOLATION_FOUND requires a SUBSTANTIATED/CLOSED finding on the linked run" }
  - { id: ERR_REMEDIATION_OUTSTANDING, http: 409, condition: "mark-remediated requires a COMPLETED CAP on the linked run's findings" }
  - { id: ERR_REPORT_NOT_READY, http: 409, condition: "Publish blocked: an overlapping AnalysisRun is not FINALIZED/ARCHIVED" }
  - { id: ERR_BENCHMARK_PERIOD_CONFLICT, http: 409, condition: "A PeerBenchmark already exists for this market_id + period_start" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: BankAdmin
    description: "Bank configuration operator: markets, branches, officers, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /fair-lending/markets"
      - "POST /fair-lending/branches"
      - "POST /fair-lending/branches/{branchId}/close"
      - "POST /fair-lending/loan-officers"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET read endpoints"
  - name: LendingDataOps
    description: "Data ingestion operator: application records and peer benchmarks"
    identity: opaque
    exclusive_operations:
      - "POST /fair-lending/applications"
      - "POST /fair-lending/applications/{applicationId}/validate"
      - "PUT /fair-lending/applications/{applicationId}"
      - "POST /fair-lending/applications/{applicationId}/exclude"
      - "POST /fair-lending/peer-benchmarks"
    shared_operations:
      - "GET read endpoints"
  - name: LoanOfficer
    description: "Entity-backed loan officer; acts only on own applications' exceptions/overrides and disputes"
    identity: "entity_backed:LoanOfficer"
    exclusive_operations:
      - "POST /fair-lending/pricing-exceptions"
      - "POST /fair-lending/pricing-exceptions/{exceptionId}/withdraw"
      - "POST /fair-lending/underwriting-overrides"
      - "POST /fair-lending/matched-pair-reviews/{reviewId}/dispute"
    shared_operations:
      - "GET read endpoints"
  - name: FairLendingAnalyst
    description: "Fair lending analyst: builds runs, locks/computes, drafts findings, matched pairs, CAPs, self-tests, board reports"
    identity: opaque
    exclusive_operations:
      - "POST /fair-lending/analysis-runs (+ lock/unlock/compute)"
      - "POST /fair-lending/findings (+ begin-review, reopen)"
      - "POST /fair-lending/matched-pair-reviews (+ submit-initial)"
      - "POST /fair-lending/corrective-action-plans (+ submit, revise, cancel)"
      - "POST /fair-lending/self-tests"
      - "POST /fair-lending/board-reports (+ refresh, revise)"
    shared_operations:
      - "GET read endpoints"
  - name: FairLendingOfficer
    description: "Fair lending officer: substantiates/refutes findings, confirms matched pairs, approves standard exceptions/CAPs, submits board reports, closes self-tests"
    identity: opaque
    exclusive_operations:
      - "POST /fair-lending/findings/{findingId}/substantiate and refute"
      - "POST /fair-lending/matched-pair-reviews/{reviewId}/confirm"
      - "POST /fair-lending/underwriting-overrides/{overrideId}/confirm and reverse"
      - "POST /fair-lending/analysis-runs/{runId}/finalize and archive"
      - "POST /fair-lending/self-tests/{selfTestId}/close and mark-remediated"
      - "POST /fair-lending/board-reports/{reportId}/submit"
    shared_operations:
      - "approve/deny/rescind pricing exceptions (standard authority)"
      - "approve/return CAPs below the director threshold"
      - "GET read endpoints"
  - name: ComplianceDirector
    description: "Compliance director: privilege designation, high-value and RED-tier approvals, officer suspension, board report approval/publication, monitoring cycle"
    identity: opaque
    exclusive_operations:
      - "POST /fair-lending/loan-officers/{officerId}/suspend and reinstate"
      - "POST /fair-lending/self-tests/{selfTestId}/designate-privileged"
      - "POST /fair-lending/corrective-action-plans/{capId}/extend"
      - "POST /fair-lending/board-reports/{reportId}/return, approve, publish"
      - "POST /fair-lending/monitoring/run-cycle"
    shared_operations:
      - "approve/deny/rescind pricing exceptions (required for RED-tier/ESCALATED)"
      - "approve/return/cancel CAPs (required at or above pool threshold)"
      - "GET read endpoints"
  - name: RemediationSpecialist
    description: "Remediation payment operator; segregated from CAP approvers"
    identity: opaque
    exclusive_operations:
      - "POST /fair-lending/remediation-payments"
      - "POST /fair-lending/remediation-payments/{paymentId}/disburse, void, mark-returned"
    shared_operations:
      - "GET read endpoints"
