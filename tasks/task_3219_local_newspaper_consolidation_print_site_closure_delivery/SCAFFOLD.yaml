# =============================================================================
# PRD Benchmark Seed Tables — task_3219
# Local Newspaper Consolidation, Print Site Closure & Delivery Outsourcing
#   regional print site consolidation; press capacity planning and transport
#   time to distant markets; publication deadline shifts as printing moves
#   farther from the market; late sports coverage; delivery contractor networks
#   and route economics; single-copy distribution decisions; print edition
#   frequency reduction with subscriber notification; refund and digital
#   replacement offers; newsroom staffing allocation across markets with shared
#   content and regional editing hubs; subscriber migration to digital with
#   churn management; legal notice publication obligations requiring qualifying
#   print circulation; closure and merger of titles with archive continuity.
# =============================================================================

scenario: |
  A regional newspaper group runs regional editing hubs, print sites, print
  markets, delivery contractor networks, and subscriber contracts while
  consolidating its printing base. Print sites close, markets are transferred
  onto distant surviving sites, publication deadlines shift later as printing
  moves farther from the market, and late sports coverage must be routed through
  a second-edition adjustment slot or reverted to digital-only. Delivery moves
  from owned routes to contractor networks whose route economics (banded mileage,
  per-stop fees, copy-volume tiers, contractor sanction states), single-copy
  distribution decisions, and exit-cost obligations must all reconcile. Print
  frequency is reduced; subscribers are notified and offered print credit,
  digital upgrade, or refund, then migrate to digital with churn management.
  Legal notice publication obligations require maintaining qualifying print
  circulation per market. Newsroom staffing is reallocated across markets with
  shared content and regional editing hubs. Titles are closed or merged with
  archive continuity handed off.

domain_name: regional-news-ops
api_prefix: /regional-news-ops

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: compliance_audit
  complexity_layers:
    - selector_policy
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: graph
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: RegionHub
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Name of the regional editing and distribution hub"
      - name: total_newsroom_headcount
        type: integer
        source: input
        description: "Total newsroom headcount the hub funds across its regions (>= 1)"
        constraints: "required; must be >= 1"
      - name: max_print_tonnage_budget_cents
        type: integer
        source: input
        description: "Aggregate print tonnage and transport budget ceiling for the hub, in cents (>= 1)"
      - name: transfer_cost_ceiling_cents
        type: integer
        source: input
        description: "Maximum cumulative print-site transfer cost any single member market may carry before a print site close is refused (>= 1)"
      - name: min_on_time_ratio_pct
        type: integer
        source: input
        default: 90
        description: "Legal-notice denominator floor: percent of member markets that must have an on-time latest edition (1..100)"
      - name: press_posture
        type: enum
        source: computed
        description: "Derived aggregate posture over member PrintSite.status. OPEN when no member site is CLOSING and none is CLOSED; RESTRICTED when at least one member site is CLOSING and not all are CLOSED; SUSPENDED when all member sites are CLOSED"
        constraints: "enum {OPEN, RESTRICTED, SUSPENDED}"
      - name: legal_notice_block
        type: boolean
        source: computed
        default: false
        description: "True while any member market's legal-notice enumeration eligibility is NOT_ELIGIBLE; blocks print frequency reduction and title closure announcements hub-wide"
      - name: unassigned_headcount
        type: integer
        source: computed
        description: "= total_newsroom_headcount - sum(Region.allocated_newsroom_headcount) over member regions; the documented sink for headcount the residual allocation could not place"

  # ---------------------------------------------------------------------------
  - name: Region
    parent: RegionHub
    common_fields: true
    fields:
      - name: region_hub_id
        type: string
        source: system
        description: "FK -> RegionHub.id; the editing hub that owns this region"
      - name: name
        type: string
        source: input
        description: "Region name; unique within the hub and the tie-break key for allocation ordering"
        constraints: "unique per region_hub_id; required; non-empty"
      - name: daily_headcount_floor
        type: integer
        source: input
        description: "Guaranteed headcount the region keeps in the first allocation pass (>= 0)"
      - name: daily_headcount_cap
        type: integer
        source: input
        description: "Maximum headcount the region may reach in the residual second allocation pass (>= daily_headcount_floor)"
      - name: allocation_priority
        type: integer
        source: input
        description: "Ordering rank for the residual pass; smaller value is served earlier"
      - name: region_need_score
        type: number
        source: computed
        description: "§1.3 newsroom_allocation_share: round_half_up(sum(member PrintMarket.weighted_demand_units) / 1000, 2)"
      - name: guaranteed_headcount
        type: integer
        source: computed
        description: "§1.3 newsroom_allocation_share first pass: floor(region_need_score) capped at daily_headcount_floor"
      - name: allocated_newsroom_headcount
        type: integer
        source: computed
        description: "Final headcount after the residual second pass; sum over a hub plus RegionHub.unassigned_headcount equals RegionHub.total_newsroom_headcount"
      - name: member_market_count
        type: integer
        source: computed
        description: "Count of PrintMarket rows whose region_id is this region"
      - name: status
        type: enum
        source: system
        description: "active on create; consolidated once every member PrintMarket.status is WITHDRAWN"
        constraints: "enum {active, consolidated}"

  # ---------------------------------------------------------------------------
  - name: PrintSite
    parent: RegionHub
    common_fields: true
    fields:
      - name: print_site_hub_id
        type: string
        source: system
        description: "FK -> RegionHub.id; the hub that owns this print site"
      - name: code
        type: string
        source: input
        description: "Site code; unique within the hub"
        constraints: "unique per print_site_hub_id; required"
      - name: press_units
        type: integer
        source: input
        description: "Number of presses installed at the site (>= 1)"
      - name: shifts_per_night
        type: integer
        source: input
        description: "Production shifts run per night (>= 1)"
      - name: copies_per_hour_per_press
        type: integer
        source: input
        description: "Nameplate press throughput per press per hour (>= 1)"
      - name: distinct_shifts_per_night
        type: integer
        source: input
        default: 4
        description: "Count of distinct dispatch shifts the site runs; the number of five-minute second-edition adjustment slots offered per shift is exactly 1"
      - name: loading_slot_minutes
        type: integer
        source: input
        default: 30
        description: "Dock loading window each route occupies when it dispatches"
      - name: max_concurrent_departures
        type: integer
        source: input
        description: "Maximum number of route dispatch windows that may overlap at this site (>= 1)"
      - name: allocation_method
        type: enum
        source: input
        description: "PRIORITY or PROPORTIONAL; selects which §1.3 allocated_print_run_copies variant is applied to every latest edition dispatched from this site"
        constraints: "enum {PRIORITY, PROPORTIONAL}"
      - name: capacity_copies
        type: integer
        source: computed
        description: "= press_units * shifts_per_night * 8 * copies_per_hour_per_press"
      - name: allocated_copies
        type: integer
        source: computed
        description: "Sum of LatestEdition.allocated_print_run_copies over editions whose assigned_print_site_id is this site"
      - name: capacity_remaining_copies
        type: integer
        source: computed
        description: "= capacity_copies - allocated_copies; never negative"
      - name: annualized_savings_cents
        type: number
        source: computed
        description: "§1.3 print_site_close_savings forward_looking variant: fixed + variable press cost avoided, projected forward across 30 flat-rate contract-days"
      - name: realized_savings_cents
        type: number
        source: computed
        description: "§1.3 print_site_close_savings chronological variant: variable cost counted per elapsed contract-day off the trailing mean, plus the fixed term"
      - name: savings_divergence_cents
        type: number
        source: computed
        description: "= round_half_up(abs(annualized_savings_cents - realized_savings_cents), 2); the pin the closure audit compares"
      - name: status
        type: enum
        source: system
        description: "active on create; closing while member routes drain; closed is terminal"
        constraints: "enum {active, closing, closed}"

  # ---------------------------------------------------------------------------
  - name: PrintMarket
    parent: Region
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: system
        description: "FK -> Region.id; the region this market belongs to"
      - name: name
        type: string
        source: input
        description: "Market name; the tie-break key wherever markets are ordered"
        constraints: "unique per region_id; required; non-empty"
      - name: publication_deadline_utc
        type: string
        source: input
        default: "05:30"
        description: "\"HH:MM\" UTC wall time by which the market's edition must be delivery-ready"
      - name: on_time_margin_minutes
        type: integer
        source: input
        default: 30
        description: "Slack required between delivery-ready time and publication_deadline_utc for the edition to count as on time"
      - name: per_copy_revenue_cents
        type: integer
        source: input
        description: "Single-copy (newsstand) net revenue per copy sold in this market"
      - name: daily_route_cost_ceiling_cents
        type: integer
        source: input
        description: "Ceiling on the summed route_night_cost of this market's DeliveryRoute rows in one night"
      - name: weighted_demand_units
        type: integer
        source: input
        description: "Demand weight fed into Region.region_need_score; must be 0 once the market is WITHDRAWN"
      - name: print_edition_per_week
        type: integer
        source: input
        description: "Current print frequency in editions per week (1..7); lowering it starts the frequency-reduction flow"
        constraints: "integer 1..7"
      - name: guaranteed_floor_copies
        type: integer
        source: input
        default: 0
        description: "Copies guaranteed to this market by contract; any allocated run below this floor is refused at allocation time"
      - name: selected_print_route_id
        type: string
        source: system
        description: "FK -> PrintRoute.id; the route currently chosen to serve this market; null while none is committed"
      - name: print_site_transfer_cost_cents
        type: number
        source: computed
        description: "§1.3 print_site_transfer_cost: allocated_print_run_copies * PrintRoute.marginal_cost_per_copy_cents, rounded half up to 2 decimals"
      - name: print_site_transfer_credit_cents
        type: number
        source: computed
        description: "Compensating credit; exactly -print_site_transfer_cost_cents once the market is WITHDRAWN or a correction stops the press"
      - name: net_print_site_transfer_cost_cents
        type: number
        source: computed
        description: "= print_site_transfer_cost_cents + print_site_transfer_credit_cents; the named conserved quantity of the transfer ledger"
      - name: route_selection_status
        type: enum
        source: computed
        description: "current when selected_print_route_id points at a route whose status is eligible or committed; needs_reassignment when it points at an ORPHANED route"
        constraints: "enum {current, needs_reassignment}"
      - name: delivery_boycott_active
        type: boolean
        source: computed
        default: false
        description: "True when the market has zero DeliveryStop rows whose status is ACTIVE after every delivery contractor serving it is TERMINATED"
      - name: transfer_cost_disputed
        type: boolean
        source: computed
        default: false
        description: "True when net_print_site_transfer_cost_cents is non-zero while status is WITHDRAWN"
      - name: target_print_edition_per_week
        type: integer
        source: input
        description: "Requested lower print frequency in editions per week (1..7); must be strictly below print_edition_per_week"
        constraints: "integer 1..7; strictly less than print_edition_per_week"
      - name: notices_dispatched_at
        type: datetime
        source: system
        description: "Server-stamped time the frequency-reduction notices went out; null until the notices are dispatched"
      - name: renewals_accepted_count
        type: integer
        source: computed
        default: 0
        description: "Count of subscriber renewals accepted against the open frequency change"
      - name: single_copy_market_rule
        type: enum
        source: input
        default: carrier
        description: "Which single-copy distribution rule this market follows; selects the §1.3 single_copy_distribution_decision variant"
        constraints: "enum {newsstand, carrier}"
      - name: newsstand_contribution_cents
        type: number
        source: computed
        description: "§1.3 single_copy_distribution_decision newsstand variant: floor(allocated_print_run_copies * 0.65) * per_copy_revenue_cents - route.route_transport_cost"
      - name: carrier_contribution_cents
        type: number
        source: computed
        description: "§1.3 single_copy_distribution_decision carrier variant: allocated_print_run_copies * (per_copy_revenue_cents - route.marginal_cost_per_copy_cents)"
      - name: keeps_print_single_copy
        type: boolean
        source: computed
        description: "True when the market's own single_copy_market_rule variant reports a contribution at or above zero"
      - name: status
        type: enum
        source: system
        description: "active on create; consolidation_planned once a transfer target is set; transfer_in_progress once the target site is CLOSING; withdrawn is terminal and the row stays listable"
        constraints: "enum {active, consolidation_planned, transfer_in_progress, withdrawn}"
      - name: frequency_change_status
        type: enum
        source: system
        default: none
        description: "Parallel state dimension on the same market row: none on create, proposed when a lower target frequency is set, notices_dispatched after subscriber notification, applied once the print frequency is lowered, rejected is terminal"
        constraints: "enum {none, proposed, notices_dispatched, applied, rejected}"

  # ---------------------------------------------------------------------------
  - name: PrintRoute
    parent: PrintSite
    common_fields: true
    fields:
      - name: origin_print_site_id
        type: string
        source: system
        description: "FK -> PrintSite.id; the site that prints and dispatches this run"
      - name: destination_market_id
        type: string
        source: system
        description: "FK -> PrintMarket.id; the market this route serves"
      - name: transit_minutes
        type: integer
        source: input
        description: "Drive time from the origin site dock to the destination market distribution point (>= 1)"
      - name: buffer_minutes
        type: integer
        source: input
        default: 45
        description: "Unload and local-handling allowance added to transit when computing delivery-ready time"
      - name: dispatch_cutoff_utc
        type: string
        source: input
        description: "\"HH:MM\" UTC wall time at which the run must leave the dock"
      - name: is_direct_hop
        type: boolean
        source: input
        description: "True when the route runs origin site to market in one leg; only direct hops are ELIGIBLE for selector consideration"
      - name: distance_miles
        type: number
        source: computed
        description: "§1.3 route_transport_cost: round_half_up(transit_minutes / 60 * 55, 2)"
      - name: marginal_mileage_cost
        type: number
        source: computed
        description: "§1.3 route_transport_cost: banded marginal mileage charge at 0.90 (first 50 miles), 0.75 (next 100), 0.60 (remainder) USD per mile"
      - name: stops_per_night
        type: integer
        source: computed
        description: "Count of DeliveryStop rows on DeliveryRoute rows whose print_market_id equals this route's destination_market_id"
      - name: total_copies_allocated
        type: integer
        source: computed
        description: "Sum of LatestEdition.allocated_print_run_copies over the destination market"
      - name: route_transport_cost
        type: number
        source: computed
        description: "§1.3 route_transport_cost: marginal_mileage_cost + stops_per_night * 1.25, rounded half up to 2 decimals"
      - name: marginal_cost_per_copy_cents
        type: number
        source: computed
        description: "= round_half_up(route_transport_cost / total_copies_allocated, 4); exactly 0 when total_copies_allocated == 0"
      - name: status
        type: enum
        source: system
        description: "eligible on create; committed once a market selects it; orphaned when its origin PrintSite status becomes closing"
        constraints: "enum {eligible, committed, orphaned}"

  # ---------------------------------------------------------------------------
  - name: LatestEdition
    parent: PrintMarket
    common_fields: true
    fields:
      - name: print_market_id
        type: string
        source: system
        description: "FK -> PrintMarket.id; the market this edition serves"
      - name: assigned_print_site_id
        type: string
        source: system
        description: "FK -> PrintSite.id; the site that prints this edition"
      - name: slug
        type: string
        source: input
        description: "Edition slug such as \"2026-09-21\"; the stable ordering key among a market's editions"
        constraints: "unique per print_market_id; required"
      - name: page_count
        type: integer
        source: input
        description: "Total pages; selects the press speed factor tier: <= 8 pages -> 1.00, <= 16 -> 0.85, otherwise 0.70 (>= 1)"
      - name: requested_print_run_copies
        type: integer
        source: input
        description: "Copies the market asks for (>= 0)"
      - name: allocated_print_run_copies
        type: integer
        source: computed
        description: "§1.3 allocated_print_run_copies; the variant applied is selected by the assigned PrintSite.allocation_method"
      - name: press_run_hours
        type: number
        source: computed
        description: "§1.3 press_run_hours: requested_print_run_copies / press_units / shifts_per_night / copies_per_hour_per_press / speed_factor, then rounded up to the next 0.25 hour"
      - name: press_ready_utc
        type: datetime
        source: computed
        description: "= dispatch_cutoff_utc of the selected PrintRoute + 60 minutes of make-ready + press_run_hours"
      - name: latest_edition_ready_utc
        type: datetime
        source: computed
        description: "= press_ready_utc + transit_minutes + buffer_minutes; recomputed whenever the selected route's status changes"
      - name: minutes_late
        type: integer
        source: computed
        description: "max(0, whole minutes from publication_deadline_utc to latest_edition_ready_utc)"
      - name: late_edition_penalty_cents
        type: integer
        source: computed
        description: "§1.3 late_edition_penalty: exactly 0 when minutes_late == 0, otherwise minutes_late * 45 * multiplier, half up"
      - name: is_on_time
        type: boolean
        source: computed
        description: "True when publication_deadline_utc - latest_edition_ready_utc >= on_time_margin_minutes"
      - name: late_sports_engineering_flag
        type: boolean
        source: input
        description: "True when the market's late sports coverage needs the second-edition adjustment slot"
      - name: legal_notice_count
        type: integer
        source: input
        description: "Number of statutory legal notices carried in this edition (>= 0)"
      - name: correction_open
        type: boolean
        source: computed
        default: false
        description: "True when the edition has been published with an uncorrected material error"
      - name: correction_redispatch_cost_cents
        type: number
        source: computed
        description: "§1.3 correction_redispatch_cost: reprint press cost plus a re-run of the full delivery route at the flat hourly rate"
      - name: next_edition_slot_taken
        type: integer
        source: computed
        default: 0
        description: "Parallel state dimension on the same edition row: 0 on create, 1 once the edition has taken its market's five-minute second-edition adjustment slot, reset to 0 when the edition is reverted"
        constraints: "integer 0 or 1"
      - name: second_edition_slot_open
        type: boolean
        source: computed
        default: false
        description: "True while the edition's print site still has an unconsumed five-minute second-edition adjustment slot"
      - name: status
        type: enum
        source: system
        description: "in_production on create; on_time_dispatch or late_dispatch at dispatch; delivered_market on market receipt; reverted_to_digital when no route can reach the market in time"
        constraints: "enum {in_production, on_time_dispatch, late_dispatch, delivered_market, reverted_to_digital}"

  # ---------------------------------------------------------------------------
  - name: DeliveryContractor
    parent: RegionHub
    common_fields: true
    fields:
      - name: contractor_hub_id
        type: string
        source: system
        description: "FK -> RegionHub.id; the hub that holds this delivery contract"
      - name: name
        type: string
        source: input
        description: "Contractor legal name; unique within the hub"
        constraints: "unique per contractor_hub_id; required"
      - name: pay_basis
        type: enum
        source: input
        description: "PER_STOP or PER_COPY; selects which component dominates a route's night cost"
        constraints: "enum {PER_STOP, PER_COPY}"
      - name: per_copy_rate_cents
        type: integer
        source: input
        description: "Rate per copy used when pay_basis is PER_COPY"
      - name: min_stop_guarantee
        type: integer
        source: input
        description: "Fewest stops the contractor must be paid for in one night (>= 1)"
      - name: net_60_available
        type: boolean
        source: input
        description: "True when the contractor still finances a net-60 settlement term"
      - name: cost_per_copy_ceiling_cents
        type: integer
        source: input
        description: "Ceiling on DeliveryRoute.cost_per_copy_cents; a breach puts the contractor on SUSPENDED"
      - name: last_load_claim_weight_lbs
        type: integer
        source: input
        description: "Weight claimed on the contractor's most recent load, checked against the run's actual weight"
      - name: sanction_reason_code
        type: string
        source: input
        description: "Reason code stamped when the contractor is SUSPENDED or TERMINATED"
      - name: status
        type: enum
        source: system
        description: "active on create; suspended holds member routes at PREPARED; terminated is terminal"
        constraints: "enum {active, suspended, terminated}"

  # ---------------------------------------------------------------------------
  - name: DeliveryRoute
    parent: DeliveryContractor
    common_fields: true
    fields:
      - name: delivery_contractor_id
        type: string
        source: system
        description: "FK -> DeliveryContractor.id; the contractor operating this route"
      - name: print_market_id
        type: string
        source: system
        description: "FK -> PrintMarket.id; the market this route delivers into"
      - name: route_code
        type: string
        source: input
        description: "Route code; unique within the contractor"
        constraints: "unique per delivery_contractor_id; required"
      - name: stop_capacity
        type: integer
        source: input
        description: "Maximum DeliveryStop rows this route may carry (>= 1)"
      - name: per_stop_fee_cents
        type: integer
        source: input
        description: "Per-stop fee used by the night-cost formula"
      - name: dist_per_stop_miles
        type: number
        source: input
        description: "Average distance between consecutive stops on the route"
      - name: cost_per_copy_ceiling_cents
        type: integer
        source: input
        description: "Route-level copy-cost ceiling; breaching it puts the route on SUSPENDED"
      - name: printed_copies_surcharge_cents
        type: integer
        source: input
        description: "Flat nightly surcharge applied while the route still carries printed copies"
      - name: cost_run_date
        type: string
        source: input
        description: "ISO date of the batch run the route was last costed in"
      - name: base_cost_cents
        type: number
        source: computed
        description: "§1.3 delivery_route_night_cost step 1: the per-copy term when pay_basis is PER_COPY plus the per-stop term over max(counted stops, min_stop_guarantee); the printed-copies surcharge is not part of step 1"
      - name: last_cost_run_date
        type: string
        source: system
        description: "Server-stamped date of the nightly cost run that last costed this route; null until the first cost run"
      - name: printed_copies_last_run
        type: integer
        source: system
        default: 0
        description: "LatestEdition.allocated_print_run_copies observed for this route's market at the route's most recent cost run; the source for copies_carried_night"
      - name: copy_volume_tier_pct
        type: number
        source: computed
        description: "§1.3 delivery_route_night_cost step 2: 0.00 / 0.05 / 0.10 / 0.15 selected from the edition copy total BEFORE any contractor sanction factor"
      - name: contractor_status_factor
        type: number
        source: computed
        description: "0.85 when the contractor's status is TERMINATED, otherwise 1.00"
      - name: copies_carried_night
        type: integer
        source: computed
        description: "The edition run size observed for this route's market at the route's most recent cost run; a cost run is refused when an edition exists in the market but has not yet been costed"
      - name: route_night_cost
        type: number
        source: computed
        description: "§1.3 delivery_route_night_cost: round_half_up(base_cost_cents * (1 + copy_volume_tier_pct) * contractor_status_factor + printed_copies_surcharge_cents, 2)"
      - name: cost_per_copy_cents
        type: number
        source: computed
        description: "= round_half_up(route_night_cost / copies_carried_night, 4); exactly 0 when copies_carried_night == 0"
      - name: status
        type: enum
        source: system
        description: "prepared on create; contract_active once its contractor is ACTIVE and the stop-capacity check passes; suspended when its contractor is SUSPENDED; terminated is terminal"
        constraints: "enum {prepared, contract_active, suspended, terminated}"

  # ---------------------------------------------------------------------------
  - name: DeliveryStop
    parent: DeliveryRoute
    common_fields: true
    fields:
      - name: delivery_route_id
        type: string
        source: system
        description: "FK -> DeliveryRoute.id; the route this stop sits on"
      - name: print_market_id
        type: string
        source: system
        description: "FK -> PrintMarket.id; the market this stop delivers into"
      - name: stop_code
        type: string
        source: input
        description: "Stop code; unique within the route and the tie-break key for stop ordering"
        constraints: "unique per delivery_route_id; required"
      - name: contracted_daily_copies
        type: integer
        source: input
        description: "Copies this stop takes per night; feeds qualifying print circulation (>= 0)"
      - name: contracted_daily_fee_cents
        type: integer
        source: input
        description: "Fee billed for this stop per night"
      - name: pause_start_date
        type: string
        source: input
        description: "ISO date the stop's pause window opens; null when no pause is planned"
      - name: pause_end_date
        type: string
        source: input
        description: "ISO date the pause window closes inclusive; null when no pause is planned"
      - name: pause_window_days
        type: integer
        source: computed
        description: "= pause_end_date - pause_start_date + 1 when both dates are set, otherwise 0"
      - name: status
        type: enum
        source: system
        description: "active on create; paused while the pause window is open; terminated is terminal"
        constraints: "enum {active, paused, terminated}"

  # ---------------------------------------------------------------------------
  - name: SubscriberContract
    parent: DeliveryStop
    common_fields: true
    fields:
      - name: delivery_stop_id
        type: string
        source: system
        description: "FK -> DeliveryStop.id; the stop that carries this subscriber's print copy"
      - name: subscriber_ref
        type: string
        source: input
        description: "Subscriber reference; unique within the region hub"
        constraints: "required; non-empty"
      - name: remaining_print_issues
        type: integer
        source: input
        description: "Paid print issues not yet delivered (>= 0)"
      - name: paid_through_utc
        type: datetime
        source: input
        description: "End of the paid term, ISO 8601 UTC"
      - name: print_issue_value_cents
        type: integer
        source: input
        description: "Value of one print issue to the subscriber, in cents"
      - name: migration_credit_cents
        type: integer
        source: computed
        description: "§1.3 subscriber_digital_migration_credit retained-print-margin variant"
      - name: churn_retention_credit_cents
        type: integer
        source: computed
        description: "§1.3 subscriber_digital_migration_credit refund-responsibility variant; capped at 5000"
      - name: offer_recommendation
        type: enum
        source: computed
        description: "PRINT_CREDIT when remaining contract value is below the credit threshold, DIGITAL_UPGRADE when term length is at least the long-term threshold, otherwise FULL_REFUND"
        constraints: "enum {PRINT_CREDIT, DIGITAL_UPGRADE, FULL_REFUND}"
      - name: status
        type: enum
        source: system
        description: "lifecycle dimension: active on create; paused while the carrying stop is paused; migrated after a digital upgrade; churned_pending_retention while a retention offer is open; churned is terminal"
        constraints: "enum {active, paused, migrated, churned_pending_retention, churned}"
      - name: offer_status
        type: enum
        source: system
        default: none
        description: "Parallel state dimension on the same subscriber row: none on create, offered once a digital-replacement or credit offer is issued, accepted once the subscriber takes it, declined is terminal when the subscriber refuses the offer"
        constraints: "enum {none, offered, accepted, declined}"
      - name: delivery_status
        type: enum
        source: system
        default: none
        description: "Parallel state dimension on the same subscriber row: none on create, paused while the carrying stop is paused, resumed once the stop resumes, terminated when the carrying stop is terminated"
        constraints: "enum {none, paused, resumed, terminated}"

  # ---------------------------------------------------------------------------
  - name: NewsroomPosition
    parent: Region
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: system
        description: "FK -> Region.id; the region this position is budgeted to"
      - name: role_code
        type: string
        source: input
        description: "Job family code such as REPORTER, SPORTS or COPY"
      - name: expertise_code
        type: string
        source: input
        description: "Expertise tag such as HIGH_SCHOOL_SPORTS or COURTS"
      - name: monthly_cost_cents
        type: integer
        source: input
        description: "Fully-loaded monthly cost of one head, in cents (>= 1)"
      - name: allocated_headcount
        type: integer
        source: computed
        description: "Sum of NewsroomChange.allocated_slots on this position; feeds Region.allocated_newsroom_headcount"
      - name: status
        type: enum
        source: system
        description: "open on create; closed once the owning Region becomes consolidated"
        constraints: "enum {open, closed}"

  # ---------------------------------------------------------------------------
  - name: NewsroomChange
    parent: NewsroomPosition
    common_fields: true
    fields:
      - name: newsroom_position_id
        type: string
        source: system
        description: "FK -> NewsroomPosition.id; the position whose headcount is being moved"
      - name: to_region_id
        type: string
        source: system
        description: "FK -> Region.id; the destination region"
      - name: from_region_id
        type: string
        source: system
        description: "FK -> Region.id; the origin region, equal to to_region_id for a pure headcount top-up"
      - name: effective_date
        type: string
        source: input
        description: "ISO date the change takes effect; must be strictly later than the logical clock's current date"
      - name: layoff_order_index
        type: integer
        source: input
        description: "Seniority-ordered layoff index; the smaller index is selected first when a reduction must choose"
      - name: requested_slots
        type: integer
        source: input
        description: "Headcount the change asks for (>= 1)"
      - name: allocated_slots
        type: integer
        source: computed
        description: "= min(requested_slots, residual_headcount); the ratio-keeping term of the residual pass"
      - name: residual_headcount
        type: integer
        source: computed
        description: "RegionHub pool left for this change after higher-ranked changes are served; exactly 0 when every slot of this change is placed"
      - name: severance_cost_cents
        type: number
        source: computed
        description: "§1.3 newsroom_severance_cost"
      - name: status
        type: enum
        source: system
        description: "proposed on create; approved on approval; applied once the effective date has arrived; rejected is terminal"
        constraints: "enum {proposed, approved, applied, rejected}"

  # ---------------------------------------------------------------------------
  - name: TitleClosure
    parent: RegionHub
    common_fields: true
    fields:
      - name: title_hub_id
        type: string
        source: system
        description: "FK -> RegionHub.id; the hub that owns the title"
      - name: title_code
        type: string
        source: input
        description: "Title code; unique within the hub"
        constraints: "unique per title_hub_id; required"
      - name: archive_retention_years
        type: integer
        source: input
        description: "Years the title's archive must remain retrievable (>= 1)"
      - name: digital_replacement_url
        type: string
        source: input
        description: "URL of the digital replacement title that inherits the archive"
      - name: archive_handoff_checksum
        type: string
        source: system
        description: "Checksum written at the archive handoff; null until the title reaches ARCHIVED"
      - name: status
        type: enum
        source: system
        description: "announced on create; notice_published after statutory publication; suspended when closure is halted; merged when folded into the replacement title; archived once the archive handoff is complete"
        constraints: "enum {announced, notice_published, suspended, merged, archived}"

  # ---------------------------------------------------------------------------
  - name: RetentionAction
    parent: SubscriberContract
    common_fields: true
    fields:
      - name: subscriber_contract_id
        type: string
        source: system
        description: "FK -> SubscriberContract.id; the subscriber whose churn this action is retaining"
      - name: retention_offer_code
        type: string
        source: input
        description: "Offer template code, e.g. CREDIT30 or DIGITAL12"
      - name: retention_credit_cents
        type: integer
        source: input
        description: "Credit granted if the offer is accepted, in cents (>= 0)"
      - name: cooling_off_expires_utc
        type: datetime
        source: system
        description: "Server-stamped end of the acceptance window; the offer can only be accepted strictly before this instant"
      - name: eligibility_policy_id
        type: string
        source: input
        description: "Eligibility policy code the subscriber must satisfy for acceptance"
      - name: status
        type: enum
        source: system
        description: "open on create; accepted when taken inside the window; expired when the window lapses; cancelled when the parent subscriber exits"
        constraints: "enum {open, accepted, expired, cancelled}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # Non-linear shape 1/3: branching fork-join. active forks into closing (the
  # consolidation branch) and consolidating (the archive-continuity branch);
  # both branches join at closed. The two branches carry divergent side-effect
  # sets.
  # ---------------------------------------------------------------------------
  - entity: PrintSite
    initial_state: active
    terminal_states: [closed]
    transitions:
      - from: active
        to: closing
        trigger: "POST /regional-news-ops/print-sites/{id}/plan-closure"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintSite.status == active"
          - "the site's member RegionHub.press_posture is OPEN or RESTRICTED"
          - "for every PrintMarket served by a PrintRoute of this site: transfer_cost_ceiling_check() passes against the hub's transfer_cost_ceiling_cents"
          - "for every LatestEdition on those markets: minutes_late == 0"
        side_effects:
          - "every PrintRoute of this site moves eligible -> orphaned or committed -> orphaned"
          - "for every PrintMarket whose selected_print_route_id is an orphaned route of this site: route_selection_status := needs_reassignment"
          - "for every such market: recompute print_site_transfer_cost_cents, print_site_transfer_credit_cents and net_print_site_transfer_cost_cents (§1.3 print_site_transfer_cost)"
          - "RegionHub.press_posture recomputed (compound: becomes RESTRICTED in the normal case)"
          - "increments RegionHub.version by 1"
      - from: active
        to: consolidating
        trigger: "POST /regional-news-ops/print-sites/{id}/begin-consolidating"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintSite.status == active or closing"
          - "every PrintMarket served by a PrintRoute of this site has status == withdrawn"
          - "PrintSite.allocated_copies == 0"
        side_effects:
          - "for every member RegionHub: the hub's archive continuity handoff is recorded"
          - "recompute PrintSite.annualized_savings_cents (§1.3 print_site_close_savings forward variant)"
          - "recompute PrintSite.realized_savings_cents (§1.3 print_site_close_savings chronological variant)"
          - "recompute PrintSite.savings_divergence_cents"
      - from: closing
        to: closed
        trigger: "POST /regional-news-ops/print-sites/{id}/close"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintSite.status == closing"
          - "every PrintRoute of this site has status == orphaned"
          - "every PrintMarket that carried this site's route has status == withdrawn"
        side_effects:
          - "PrintSite.status := closed"
          - "recompute PrintSite.realized_savings_cents (§1.3 print_site_close_savings chronological variant) and savings_divergence_cents"
          - "recompute RegionHub.press_posture (compound: SUSPENDED once every member site is closed)"
          - "for every member Region whose member markets are all withdrawn: Region.status := consolidated and every NewsroomPosition of that Region moves to closed"
          - "increments RegionHub.version by 1"
      - from: consolidating
        to: closed
        trigger: "POST /regional-news-ops/print-sites/{id}/close"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintSite.status == consolidating"
          - "the archive continuity handoff is recorded for every member RegionHub"
        side_effects:
          - "PrintSite.status := closed"
          - "recompute PrintSite.realized_savings_cents (§1.3 print_site_close_savings chronological variant) and savings_divergence_cents"
          - "recompute RegionHub.press_posture (compound: SUSPENDED once every member site is closed)"
          - "for every member Region whose member markets are all withdrawn: Region.status := consolidated and every NewsroomPosition of that Region moves to closed"
          - "increments RegionHub.version by 1"
      - from: closed
        to: closed
        trigger: "attempted close or any status write from closed (negative path)"
        actor: PrintOperationsDirector
        preconditions: []
        side_effects: []
        note: "Any status write while PrintSite.status == closed is rejected with ERR_PRESS_POSTURE_LOCKED and fires no side effects."

  # ---------------------------------------------------------------------------
  # Non-linear shape 2/3: cycle. The market re-enters transfer_in_progress
  # after every redispatch, so the same market can loop consolidation_planned ->
  # transfer_in_progress -> active -> consolidation_planned -> ... until it
  # terminates at withdrawn.
  # ---------------------------------------------------------------------------
  - entity: PrintMarket
    initial_state: active
    terminal_states: [withdrawn]
    transitions:
      - from: active
        to: consolidation_planned
        trigger: "POST /regional-news-ops/print-markets/{id}/plan-transfer"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintMarket.status == active"
          - "the receiving PrintSite.status == active"
          - "the receiving PrintSite.capacity_remaining_copies >= the market's latest edition requested_print_run_copies"
          - "select_transfer_route picks a route (§1.3 select_transfer_route); otherwise ERR_NO_ROUTE_IN_TIME"
        side_effects:
          - "PrintMarket.selected_print_route_id := the selected PrintRoute.id"
          - "the selected PrintRoute.status := committed"
          - "PrintMarket.status := consolidation_planned"
          - "PrintMarket.route_selection_status := current"
          - "increments RegionHub.version by 1"
      - from: consolidation_planned
        to: transfer_in_progress
        trigger: "system event on the receiving PrintSite moving to closing"
        actor: system
        preconditions:
          - "PrintMarket.status == consolidation_planned"
          - "the market's selected PrintRoute.origin_print_site_id is the site that just entered closing"
        side_effects:
          - "PrintMarket.status := transfer_in_progress"
          - "for every LatestEdition of the market: assigned_print_site_id := the closing site and latest_edition_ready_utc recomputed"
          - "for every LatestEdition of the market: recompute minutes_late, late_edition_penalty_cents and is_on_time (§1.3 late_edition_penalty)"
      - from: transfer_in_progress
        to: active
        trigger: "POST /regional-news-ops/print-markets/{id}/redispatch"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintMarket.status == transfer_in_progress"
          - "PrintMarket.route_selection_status == needs_reassignment"
          - "select_transfer_route picks a replacement route whose origin site status is active (§1.3 select_transfer_route)"
        side_effects:
          - "PrintMarket.replacement_route_id := the replacement PrintRoute.id; that route's status := committed"
          - "PrintMarket.selected_print_route_id := the replacement PrintRoute.id"
          - "PrintMarket.route_selection_status := current"
          - "PrintMarket.status := active"
          - "for every LatestEdition of the market: assigned_print_site_id := the replacement origin site, status := in_production, and latest_edition_ready_utc / minutes_late / late_edition_penalty_cents / is_on_time recomputed"
          - "increments RegionHub.version by 1"
      - from: transfer_in_progress
        to: withdrawn
        trigger: "POST /regional-news-ops/print-markets/{id}/withdraw"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintMarket.status == transfer_in_progress"
          - "PrintMarket.route_selection_status == needs_reassignment"
          - "PrintMarket.delivery_boycott_active == true"
        side_effects:
          - "PrintMarket.print_site_transfer_credit_cents := -1 * print_site_transfer_cost_cents"
          - "PrintMarket.net_print_site_transfer_cost_cents recomputed (target exactly 0.00)"
          - "PrintMarket.weighted_demand_units := 0"
          - "PrintMarket.status := withdrawn"
          - "for every DeliveryRoute of this market: status := terminated"
          - "for every DeliveryStop on those routes active or paused: status := terminated"
          - "for every SubscriberContract on those stops: status := churned_pending_retention, offer_status := offered, delivery_status := terminated"
          - "for every member Region whose member markets are all withdrawn: Region.status := consolidated and every NewsroomPosition of that Region moves to closed"
          - "RegionHub.legal_notice_block recomputed; RegionHub.version increments by 1"
      - from: transfer_in_progress
        to: transfer_in_progress
        trigger: "attempted withdrawal without a delivery boycott (negative path)"
        actor: PrintOperationsDirector
        preconditions: []
        side_effects: []
        note: "Requested when delivery_boycott_active is false; rejected with ERR_MARKET_NOT_WITHDRAWABLE and no side effects fire."

  # ---------------------------------------------------------------------------
  # Non-linear shape 3/3: parallel dimensions on one entity. PrintMarket.status
  # (consolidation) and PrintMarket.frequency_change_status (frequency
  # reduction) evolve independently on the same row.
  # ---------------------------------------------------------------------------
  - entity: PrintMarket
    initial_state: none
    terminal_states: [applied, rejected]
    state_field: frequency_change_status
    transitions:
      - from: none
        to: proposed
        trigger: "POST /regional-news-ops/print-markets/{id}/frequency-change"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintMarket.frequency_change_status == none"
          - "PrintMarket.target_print_edition_per_week < PrintMarket.print_edition_per_week"
          - "PrintMarket.status is active, consolidation_planned or transfer_in_progress"
        side_effects:
          - "PrintMarket.frequency_change_status := proposed"
      - from: proposed
        to: notices_dispatched
        trigger: "POST /regional-news-ops/print-markets/{id}/frequency-notices"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintMarket.frequency_change_status == proposed"
          - "RegionHub.legal_notice_block == false"
        side_effects:
          - "PrintMarket.frequency_change_status := notices_dispatched"
          - "PrintMarket.notices_dispatched_at := the logical clock's current time"
          - "for every SubscriberContract on DeliveryStops of the market with status active: status := paused"
          - "for every such contract: offer_recommendation computed (§1.3 offer_recommendation)"
      - from: notices_dispatched
        to: applied
        trigger: "POST /regional-news-ops/print-markets/{id}/frequency-apply"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintMarket.frequency_change_status == notices_dispatched"
          - "PrintMarket.renewals_accepted_count >= 1"
        side_effects:
          - "PrintMarket.frequency_change_status := applied"
          - "PrintMarket.print_edition_per_week := PrintMarket.target_print_edition_per_week"
          - "for every SubscriberContract on DeliveryStops of the market with status paused: status := migrated and offer_status := accepted"
          - "PrintMarket.weighted_demand_units recomputed as round_half_up(weighted_demand_units * target_print_edition_per_week / old print_edition_per_week, 0)"
      - from: proposed
        to: rejected
        trigger: "POST /regional-news-ops/print-markets/{id}/frequency-reject"
        actor: PrintOperationsDirector
        preconditions:
          - "PrintMarket.frequency_change_status == proposed or notices_dispatched"
        side_effects:
          - "PrintMarket.frequency_change_status := rejected"
          - "for every SubscriberContract on DeliveryStops of the market with status paused: status := active, offer_status := declined"
      - from: applied
        to: applied
        trigger: "attempted re-application (negative path)"
        actor: PrintOperationsDirector
        preconditions: []
        side_effects: []
        note: "Rejected with ERR_INVALID_STATE."

  # ---------------------------------------------------------------------------
  - entity: LatestEdition
    initial_state: in_production
    terminal_states: [delivered_market, reverted_to_digital]
    transitions:
      - from: in_production
        to: late_dispatch
        trigger: "POST /regional-news-ops/editions/{id}/dispatch"
        actor: PrintOperationsDirector
        preconditions:
          - "LatestEdition.status == in_production"
          - "print_site_slot_check reports an open five-minute adjustment slot at the edition's print site"
          - "LatestEdition.minutes_late > 0"
        side_effects:
          - "LatestEdition.status := late_dispatch"
          - "LatestEdition.next_edition_slot_taken := 1"
          - "LatestEdition.late_edition_penalty_cents recomputed (§1.3 late_edition_penalty)"
          - "the print site's consumed adjustment-slot count increments by 1 and its available-slot count decrements by 1"
          - "the edition's market gate is recomputed: PrintMarket.second_edition_slot_open is set false when the site's consumed slot count equals its distinct_shifts_per_night"
      - from: in_production
        to: on_time_dispatch
        trigger: "POST /regional-news-ops/editions/{id}/dispatch"
        actor: PrintOperationsDirector
        preconditions:
          - "LatestEdition.status == in_production"
          - "LatestEdition.is_on_time == true"
        side_effects:
          - "LatestEdition.status := on_time_dispatch"
      - from: late_dispatch
        to: reverted_to_digital
        trigger: "POST /regional-news-ops/editions/{id}/revert-to-digital"
        actor: PrintOperationsDirector
        preconditions:
          - "LatestEdition.status == late_dispatch"
          - "LatestEdition.late_sports_engineering_flag == true"
          - "no route to the edition's market has LatestEditionReady <= publication_deadline_utc"
        side_effects:
          - "LatestEdition.status := reverted_to_digital"
          - "LatestEdition.next_edition_slot_taken := 0"
          - "LatestEdition.print_run_hours := 0"
          - "LatestEdition.assigned_print_site_id := null; the former site's allocated_copies is decremented by the edition's allocated_print_run_copies"
          - "for every DeliveryRoute of the edition's market: printed_copies_surcharge_cents := 0 and route_night_cost recomputed"
      - from: late_dispatch
        to: delivered_market
        trigger: "PUT /regional-news-ops/editions/{id}/status"
        actor: PrintOperationsDirector
        preconditions:
          - "LatestEdition.status == late_dispatch"
          - "the market's delivery run for the night has completed"
        side_effects:
          - "LatestEdition.status := delivered_market"
          - "PrintSite.savings_divergence_cents recomputed for the edition's former print site (§1.3 print_site_close_savings)"
      - from: on_time_dispatch
        to: delivered_market
        trigger: "PUT /regional-news-ops/editions/{id}/status"
        actor: PrintOperationsDirector
        preconditions:
          - "LatestEdition.status == on_time_dispatch"
        side_effects:
          - "LatestEdition.status := delivered_market"
      - from: delivered_market
        to: reverted_to_digital
        trigger: "POST /regional-news-ops/editions/{id}/correct"
        actor: PrintOperationsDirector
        preconditions:
          - "LatestEdition.status == delivered_market"
          - "LatestEdition.legal_notice_count >= 1"
        side_effects:
          - "LatestEdition.correction_open := true"
          - "LatestEdition.correction_redispatch_cost_cents := §1.3 correction_redispatch_cost(edition)"
          - "the edition's market is re-examined under is_legal_notice_ratio_compliant() (§1.3 is_legal_notice_ratio_compliant)"
          - "LatestEdition.status := reverted_to_digital"

  # ---------------------------------------------------------------------------
  - entity: DeliveryContractor
    initial_state: active
    terminal_states: [terminated]
    transitions:
      - from: active
        to: suspended
        trigger: "POST /regional-news-ops/delivery-contractors/{id}/suspend, or system event on an eligibility failure"
        actor: DeliveryNetworkManager | system
        preconditions:
          - "DeliveryContractor.status == active"
          - "either net_60_available == false, or a member DeliveryRoute has cost_per_copy_cents > its cost_per_copy_ceiling_cents, or a member DeliveryRoute's cost_run_date is later than the batch run date being processed"
        side_effects:
          - "every DeliveryRoute of this contractor moves contract_active -> suspended"
          - "every DeliveryStop on those routes active -> paused"
          - "for every such market: recompute DeliveryRoute.route_night_cost and cost_per_copy_cents"
      - from: active
        to: terminated
        trigger: "POST /regional-news-ops/delivery-contractors/{id}/terminate"
        actor: DeliveryNetworkManager
        preconditions:
          - "DeliveryContractor.status == active or suspended"
          - "the contractor has no DeliveryRoute whose status is prepared"
        side_effects:
          - "every DeliveryRoute of this contractor moves to terminated"
          - "contractor_status_factor := 0.85 on every such route; recompute route_night_cost and cost_per_copy_cents (§1.3 delivery_route_night_cost)"
          - "every DeliveryStop on those routes active -> terminated or paused -> terminated"
          - "for every such market: recompute delivery_boycott_active (true once no ACTIVE stop remains)"
          - "for every SubscriberContract on those stops: status := churned_pending_retention, delivery_status := terminated"
          - "for every such market: re-examine is_legal_notice_ratio_compliant() (§1.3 is_legal_notice_ratio_compliant) and refresh RegionHub.legal_notice_block"
          - "RegionHub.legal_notice_block recomputed; RegionHub.version increments by 1"
      - from: suspended
        to: active
        trigger: "POST /regional-news-ops/delivery-contractors/{id}/reinstate"
        actor: DeliveryNetworkManager
        preconditions:
          - "DeliveryContractor.status == suspended"
          - "net_60_available == true"
          - "no member DeliveryRoute has cost_per_copy_cents > its cost_per_copy_ceiling_cents"
        side_effects:
          - "every DeliveryRoute of this contractor moves suspended -> contract_active"
          - "contractor_status_factor := 1.00 on every such route; route_night_cost recomputed"
          - "every DeliveryStop on those routes paused -> active"
      - from: terminated
        to: terminated
        trigger: "attempted reinstate from terminated (negative path)"
        actor: DeliveryNetworkManager
        preconditions: []
        side_effects: []
        note: "Reinstating a TERMINATED contractor is rejected with ERR_CONTRACTOR_TERMINAL and fires no side effects."

  # ---------------------------------------------------------------------------
  - entity: DeliveryRoute
    initial_state: prepared
    terminal_states: [terminated]
    transitions:
      - from: prepared
        to: contract_active
        trigger: "POST /regional-news-ops/delivery-routes/{id}/cost-run"
        actor: DeliveryNetworkManager
        preconditions:
          - "DeliveryRoute.status == prepared"
          - "the route's contractor status is active"
          - "the route's non-terminated stop count is at or below stop_capacity"
        side_effects:
          - "DeliveryRoute.status := contract_active"
          - "route_night_cost and cost_per_copy_cents recomputed (§1.3 delivery_route_night_cost) and last_cost_run_date stamped"
      - from: contract_active
        to: suspended
        trigger: "system event on the contractor moving to suspended"
        actor: system
        preconditions:
          - "the route's contractor status became suspended"
        side_effects:
          - "DeliveryRoute.status := suspended"
          - "route_night_cost and cost_per_copy_cents recomputed"
      - from: suspended
        to: contract_active
        trigger: "system event on the contractor moving to active"
        actor: system
        preconditions:
          - "the route's contractor status became active"
        side_effects:
          - "DeliveryRoute.status := contract_active"
          - "contractor_status_factor := 1.00 and route_night_cost recomputed"
      - from: contract_active
        to: terminated
        trigger: "system event on the market withdrawal or the contractor termination"
        actor: system
        preconditions:
          - "the market withdrew, or the contractor terminated"
        side_effects:
          - "DeliveryRoute.status := terminated"
          - "every member DeliveryStop moves to terminated"
      - from: suspended
        to: terminated
        trigger: "system event on the market withdrawal or the contractor termination"
        actor: system
        preconditions:
          - "the market withdrew, or the contractor terminated"
        side_effects:
          - "DeliveryRoute.status := terminated"
          - "every member DeliveryStop moves to terminated"

  # ---------------------------------------------------------------------------
  - entity: DeliveryStop
    initial_state: active
    terminal_states: [terminated]
    transitions:
      - from: active
        to: paused
        trigger: "POST /regional-news-ops/delivery-stops/{id}/pause"
        actor: DeliveryNetworkManager
        preconditions:
          - "DeliveryStop.status == active"
          - "pause_start_date is set and the logical clock's current date is inside [pause_start_date, pause_end_date] inclusive"
        side_effects:
          - "DeliveryStop.status := paused"
          - "for every SubscriberContract on this stop: status := paused, delivery_status := paused"
          - "re-examine is_legal_notice_ratio_compliant() (§1.3) for the stop's market; refresh RegionHub.legal_notice_block; RegionHub.version increments by 1"
      - from: paused
        to: active
        trigger: "POST /regional-news-ops/delivery-stops/{id}/resume"
        actor: DeliveryNetworkManager
        preconditions:
          - "DeliveryStop.status == paused"
          - "the logical clock's current date is later than pause_end_date"
        side_effects:
          - "DeliveryStop.status := active"
          - "for every SubscriberContract on this stop with status paused: status := active, delivery_status := resumed"
          - "re-examine is_legal_notice_ratio_compliant() (§1.3) for the stop's market; refresh RegionHub.legal_notice_block; RegionHub.version increments by 1"
      - from: active
        to: terminated
        trigger: "POST /regional-news-ops/delivery-stops/{id}/terminate"
        actor: DeliveryNetworkManager
        preconditions:
          - "DeliveryStop.status == active or paused"
        side_effects:
          - "DeliveryStop.status := terminated"
          - "for every SubscriberContract on this stop: status := churned_pending_retention, delivery_status := terminated"
          - "re-examine is_legal_notice_ratio_compliant() (§1.3) for the stop's market; refresh RegionHub.legal_notice_block; RegionHub.version increments by 1"
      - from: paused
        to: paused
        trigger: "attempted pause of an already-paused stop (negative path)"
        actor: DeliveryNetworkManager
        preconditions: []
        side_effects: []
        note: "Rejected with ERR_STOP_NOT_ACTIVE."

  # ---------------------------------------------------------------------------
  # Non-linear shape 4: a second branching fork-join, on a different entity —
  # active forks into churned_pending_retention (retention branch) and churned
  # (exit branch); the retention branch loops back to active, the exit branch
  # is terminal.
  # ---------------------------------------------------------------------------
  - entity: SubscriberContract
    initial_state: active
    terminal_states: [churned]
    transitions:
      - from: active
        to: migrated
        trigger: "POST /regional-news-ops/subscribers/{id}/migrate-digital"
        actor: Subscriber | CustomerService
        preconditions:
          - "SubscriberContract.status == active"
        side_effects:
          - "SubscriberContract.status := migrated"
          - "SubscriberContract.offer_status := accepted"
          - "SubscriberContract.migration_credit_cents computed (§1.3 subscriber_digital_migration_credit, retained-print-margin variant)"
      - from: active
        to: churned_pending_retention
        trigger: "system event seeded by the market-withdrawal and stop-termination edges only"
        actor: system
        preconditions:
          - "seeded by a market withdrawal or a stop termination, never by a client request"
        side_effects:
          - "SubscriberContract.status := churned_pending_retention"
          - "SubscriberContract.offer_status := offered"
          - "SubscriberContract.churn_retention_credit_cents computed (§1.3 subscriber_digital_migration_credit, refund-responsibility variant)"
          - "for contracts whose remaining contract value is >= 20000: one retention offer row is created"
      - from: churned_pending_retention
        to: active
        trigger: "POST /regional-news-ops/subscribers/{id}/accept-retention-offer"
        actor: CustomerService
        preconditions:
          - "SubscriberContract.status == churned_pending_retention"
          - "SubscriberContract.delivery_status is not terminated"
          - "the logical clock's current time is strictly earlier than the offer's cooling-off expiry"
        side_effects:
          - "SubscriberContract.status := active"
          - "SubscriberContract.offer_status := accepted"
      - from: churned_pending_retention
        to: churned
        trigger: "POST /regional-news-ops/subscribers/{id}/cancel"
        actor: Subscriber | CustomerService
        preconditions:
          - "SubscriberContract.status == active or churned_pending_retention"
        side_effects:
          - "SubscriberContract.status := churned"
          - "SubscriberContract.offer_status := declined"
          - "SubscriberContract.churn_retention_credit_cents computed (§1.3 subscriber_digital_migration_credit, refund-responsibility variant)"
      - from: active
        to: churned
        trigger: "POST /regional-news-ops/subscribers/{id}/refund"
        actor: CustomerService
        preconditions:
          - "SubscriberContract.status == active"
          - "the logical clock's current time is at or before paid_through_utc"
        side_effects:
          - "SubscriberContract.status := churned"
          - "SubscriberContract.churn_retention_credit_cents computed (§1.3 subscriber_digital_migration_credit, refund-responsibility variant)"
      - from: migrated
        to: churned
        trigger: "POST /regional-news-ops/subscribers/{id}/cancel"
        actor: Subscriber | CustomerService
        preconditions:
          - "SubscriberContract.status == migrated"
        side_effects:
          - "SubscriberContract.status := churned"
      - from: churned
        to: churned
        trigger: "attempted second exit (negative path)"
        actor: Subscriber
        preconditions: []
        side_effects: []
        note: "Any exit request against a CHURNED subscriber is rejected with ERR_SUBSCRIBER_TERMINAL."

  # ---------------------------------------------------------------------------
  - entity: TitleClosure
    initial_state: announced
    terminal_states: [archived]
    transitions:
      - from: announced
        to: notice_published
        trigger: "POST /regional-news-ops/title-closures/{id}/publish-notice"
        actor: PrintOperationsDirector
        preconditions:
          - "TitleClosure.status == announced"
          - "TitleClosure.archive_retention_years >= 1"
          - "the hub's qualifying print circulation for the title's market is at or above the census enumeration floor for a PrintMarket.status in {active, consolidation_planned, transfer_in_progress}"
        side_effects:
          - "TitleClosure.status := notice_published"
      - from: notice_published
        to: suspended
        trigger: "POST /regional-news-ops/title-closures/{id}/suspend"
        actor: PrintOperationsDirector
        preconditions:
          - "TitleClosure.status == notice_published"
          - "RegionHub.legal_notice_block == true"
        side_effects:
          - "TitleClosure.status := suspended"
      - from: suspended
        to: notice_published
        trigger: "POST /regional-news-ops/title-closures/{id}/resume"
        actor: PrintOperationsDirector
        preconditions:
          - "TitleClosure.status == suspended"
          - "RegionHub.legal_notice_block == false"
        side_effects:
          - "TitleClosure.status := notice_published"
      - from: notice_published
        to: merged
        trigger: "POST /regional-news-ops/title-closures/{id}/merge"
        actor: PrintOperationsDirector
        preconditions:
          - "TitleClosure.status == notice_published or suspended"
          - "TitleClosure.digital_replacement_url is non-empty"
        side_effects:
          - "TitleClosure.status := merged"
          - "the surviving TitleClosure in the same hub with the same digital_replacement_url and status merged inherits the archive; its archive_retention_years := max(survivor.archive_retention_years, source.archive_retention_years)"
      - from: merged
        to: archived
        trigger: "POST /regional-news-ops/title-closures/{id}/archive"
        actor: PrintOperationsDirector
        preconditions:
          - "TitleClosure.status == merged"
          - "the archive handoff has been recorded for the survivor chain"
        side_effects:
          - "TitleClosure.status := archived"
          - "TitleClosure.archive_handoff_checksum := the survivor's checksum"

  # ---------------------------------------------------------------------------
  - entity: NewsroomChange
    initial_state: proposed
    terminal_states: [rejected, applied]
    transitions:
      - from: proposed
        to: approved
        trigger: "POST /regional-news-ops/newsroom-changes/{id}/approve"
        actor: NewsroomOperationsManager
        preconditions:
          - "NewsroomChange.status == proposed"
          - "NewsroomChange.effective_date is strictly later than the logical clock's current date"
          - "the acting operator did not create this change"
        side_effects:
          - "NewsroomChange.status := approved"
      - from: approved
        to: applied
        trigger: "POST /regional-news-ops/newsroom-changes/{id}/apply"
        actor: NewsroomOperationsManager
        preconditions:
          - "NewsroomChange.status == approved"
          - "the logical clock's current date is at or later than NewsroomChange.effective_date"
        side_effects:
          - "NewsroomChange.residual_headcount computed for every sibling change in the hub by residual_pass_order (§1.3 newsroom_allocation_share second pass)"
          - "NewsroomChange.allocated_slots := min(requested_slots, residual_headcount)"
          - "NewsroomChange.severance_cost_cents computed (§1.3 newsroom_severance_cost)"
          - "the destination and source NewsroomPosition.allocated_headcount recomputed"
          - "Region.allocated_newsroom_headcount and RegionHub.unassigned_headcount recomputed"
          - "NewsroomChange.status := applied"
      - from: proposed
        to: rejected
        trigger: "POST /regional-news-ops/newsroom-changes/{id}/reject"
        actor: NewsroomOperationsManager
        preconditions:
          - "NewsroomChange.status == proposed"
        side_effects:
          - "NewsroomChange.status := rejected"
      - from: approved
        to: proposed
        trigger: "POST /regional-news-ops/newsroom-changes/{id}/reopen"
        actor: NewsroomOperationsManager
        preconditions:
          - "NewsroomChange.status == approved"
          - "the change has not been applied"
        side_effects:
          - "NewsroomChange.status := proposed"
          - "increments RegionHub.version by 1"

  # ---------------------------------------------------------------------------
  - entity: RetentionAction
    initial_state: open
    terminal_states: [accepted, expired, cancelled]
    transitions:
      - from: open
        to: accepted
        trigger: "POST /regional-news-ops/retention-actions/{id}/accept"
        actor: CustomerService
        preconditions:
          - "RetentionAction.status == open"
          - "the logical clock's current time is strictly earlier than cooling_off_expires_utc"
        side_effects:
          - "RetentionAction.status := accepted"
          - "the parent SubscriberContract moves churned_pending_retention -> active and offer_status := accepted"
      - from: open
        to: expired
        trigger: "system event at the cooling-off deadline"
        actor: system
        preconditions:
          - "RetentionAction.status == open"
          - "the logical clock's current time is at or later than cooling_off_expires_utc"
        side_effects:
          - "RetentionAction.status := expired"
      - from: open
        to: cancelled
        trigger: "system event on subscriber exit"
        actor: system
        preconditions:
          - "RetentionAction.status == open"
          - "the parent SubscriberContract entered churned"
        side_effects:
          - "RetentionAction.status := cancelled"
      - from: open
        to: open
        trigger: "attempted second acceptance (negative path)"
        actor: CustomerService
        preconditions: []
        side_effects: []
        note: "Accepting an already-accepted retention action is rejected with ERR_RETENTION_ALREADY_SETTLED."

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: market-transfer-stale-hub
    parent_entity: RegionHub
    write_endpoint: "POST /regional-news-ops/print-markets/{id}/plan-transfer"
    occ_field: "expected_hub_version"
    description: |
      Directing a market onto a receiving print site with a stale view of the
      hub permits the market's transfer to be planned against a hub state whose
      member press posture and transfer ledger the client has not observed. The
      write is rejected when the submitted expected_hub_version no longer
      matches the hub's current version, because the receiving site's available
      capacity and the market's transfer cost can only be sized from the
      observed version.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: newsroom-residual-stale-hub
    parent_entity: RegionHub
    write_endpoint: "POST /regional-news-ops/newsroom-changes"
    occ_field: "expected_hub_version"
    description: |
      Creating a staff-movement request inside a hub whose version has advanced
      since the client last read it permits the change to be sized against a
      residual headcount pool that a later headcount movement has already drawn
      down. The write is rejected when the submitted expected_hub_version no
      longer matches the hub's current version, because the residual pool the
      request would consume can only be sized from the observed version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # --- Rule 1 (dual-variant, domain A: route transport economics) -------------
  - name: route_transport_cost
    trigger: "route creation; transit_minutes edit; any DeliveryStop create/pause/terminate on the route's destination market"
    algorithm: tiered_pricing
    input_set: "one PrintRoute; delivery stops counted are DeliveryStop rows whose print_market_id equals the route's destination_market_id AND whose status IN {active, paused}; DeliveryStop rows whose status is terminated are excluded"
    formula: |
      distance_miles = round_half_up(transit_minutes / 60 * 55, 2)

      # Banded marginal mileage: the rate steps down as distance accumulates.
      band1 = min(distance_miles, 50) * 0.90
      band2 = min(max(distance_miles - 50, 0), 100) * 0.75
      band3 = max(distance_miles - 150, 0) * 0.60
      marginal_mileage_cost = round_half_up(band1 + band2 + band3, 2)

      route_transport_cost = round_half_up(marginal_mileage_cost + stops_per_night * 1.25, 2)
      marginal_cost_per_copy_cents = round_half_up(route_transport_cost / total_copies_allocated, 4)
        # exactly 0 when total_copies_allocated == 0
    constants:
      SPEED_MPH: 55
      MILEAGE_BAND_1_MILES: 50
      MILEAGE_BAND_1_RATE: 0.90
      MILEAGE_BAND_2_MILES: 100
      MILEAGE_BAND_2_RATE: 0.75
      MILEAGE_BAND_3_RATE: 0.60
      PER_STOP_TRANSPORT_FEE: 1.25
    precision: "USD, 2 decimal places, round_half_up on the total; marginal_cost_per_copy_cents 4 decimal places"
    variants:
      - name: banded_marginal
        when: "the default and only route-cost variant; every site's transport ledger uses it"
        difference: "the mileage rate steps down at the 50-mile and 150-mile boundaries rather than applying a single blended rate"
    note: "Boundary precision: at distance_miles == 50.00 exactly, band2 = 0 and no 0.75 rate applies; at distance_miles == 150.00 exactly, band3 = 0 and no 0.60 rate applies."

  # --- Rule 1 (dual-variant, domain B: press cost avoidance) ------------------
  - name: print_site_close_savings
    trigger: "PrintSite entering closing; PrintSite entering closed; region transfer ledger recompute"
    algorithm: forward_looking
    input_set: "one PrintSite; the savings window is the 30 contract-days immediately preceding the logical clock's current date. observed_days is the count of those days that carry a recorded press-volume charge; a recorded day with no edition printed carries charge 0 and still counts as observed"
    formula: |
      observed_days = count of days in the window carrying a recorded charge
      if observed_days == 0:
          flat_daily_rate_cents = 0
      else:
          flat_daily_rate_cents = sum(day_charge_cents) / observed_days

      # --- forward_looking variant: assume all 30 window days run at the
      #     observed per-run mean, including days that did not actually run.
      annualized_savings_cents = round_half_up(
          FIXED_PRESS_AVOIDED_CENTS + flat_daily_rate_cents * SAVINGS_WINDOW_DAYS, 2)

      # --- chronological variant: walk the elapsed days in date order and add
      #     each day's OWN observed charge; unobserved days add nothing.
      realized_savings_cents = round_half_up(
          FIXED_PRESS_AVOIDED_CENTS
          + sum(day_charge_cents for days with date <= logical_clock_date), 2)

      savings_divergence_cents = round_half_up(abs(annualized_savings_cents - realized_savings_cents), 2)
    constants:
      SAVINGS_WINDOW_DAYS: 30
      FIXED_PRESS_AVOIDED_CENTS: 180000
    precision: "USD, 2 decimal places, round_half_up"
    variants:
      - name: flat_rate_forward
        when: "the annualized figure quoted at the close announcement"
        difference: "multiplies the observed per-run mean by all 30 window days, so a window in which the site ran on only some days projects a savings figure strictly higher than the days actually earned"
      - name: observed_charge_chronological
        when: "the realized figure booked at site closure"
        difference: "adds only each elapsed day's own observed charge, so unrun days contribute nothing to the total"
    note: "Dual-variant divergence is pinned by savings_divergence_cents. Worked pin: 15 observed days at 10000 cents and no other observations -> flat_daily_rate_cents = 150000 / 15 = 10000.0, annualized_savings_cents = 180000 + 10000 * 30 = 480000.00, realized_savings_cents = 180000 + 150000 = 330000.00, savings_divergence_cents = 150000.00."

  # --- Rule 2 (combinatorial mode a: multi-input non-linear formula) ----------
  - name: delivery_route_night_cost
    trigger: "nightly batch cost run; contractor suspend/terminate/reinstate; edition revert to digital"
    algorithm: tiered_pricing
    input_set: "one DeliveryRoute; the copy total is the summed LatestEdition.allocated_print_run_copies over the route's print_market_id for the current night, counting only editions whose status IN {in_production, on_time_dispatch, late_dispatch, delivered_market}; copies_carried_night = that sum; the stop count is DeliveryStop rows on the route whose status IN {active, paused}, floored at the contractor's min_stop_guarantee"
    formula: |
      # step 1 — the base cost; the printed-copies surcharge is NOT part of it
      copy_term_cents = 0
      if contractor.pay_basis == "PER_COPY":
          copy_term_cents = copies_carried_night * contractor.per_copy_rate_cents
      billed_stop_count = max(counted_stop_count, contractor.min_stop_guarantee)
      base_cost_cents = round_half_up(copy_term_cents + billed_stop_count * route.per_stop_fee_cents, 2)

      # step 2 — the copy-volume tier, selected from copies_carried_night
      # BEFORE any contractor sanction factor is applied
      if copies_carried_night <= 7500:      copy_volume_tier_pct = 0.00
      elif copies_carried_night <= 15000:   copy_volume_tier_pct = 0.05
      elif copies_carried_night <= 30000:   copy_volume_tier_pct = 0.10
      else:                                  copy_volume_tier_pct = 0.15

      contractor_status_factor = 0.85 if contractor.status == "TERMINATED" else 1.00

      route_night_cost = round_half_up(
          base_cost_cents * (1 + copy_volume_tier_pct) * contractor_status_factor
          + route.printed_copies_surcharge_cents, 2)

      cost_per_copy_cents = round_half_up(route_night_cost / copies_carried_night, 4)
        # exactly 0 when copies_carried_night == 0
    constants:
      TIER_1_MAX_COPIES: 7500
      TIER_2_MAX_COPIES: 15000
      TIER_3_MAX_COPIES: 30000
      TIER_1_PCT: 0.00
      TIER_2_PCT: 0.05
      TIER_3_PCT: 0.10
      TIER_4_PCT: 0.15
      TERMINATED_STATUS_FACTOR: 0.85
    precision: "USD, 2 decimal places, round_half_up; cost_per_copy_cents 4 decimal places"
    variants:
      - name: per_stop_dominant
        when: "contractor.pay_basis == PER_STOP"
        difference: "the copy term is zero, so the tier percentage multiplies only the stop term"
      - name: per_copy_dominant
        when: "contractor.pay_basis == PER_COPY"
        difference: "the copy term scales with delivered copies, so the tier percentage is applied to a base that already grows with volume"
    note: "Cross-dependency pin: the tier is chosen on copies_carried_night, never on the post-discount amount, so a TERMINATED contractor does not fall into a lower tier. Boundary precision: exactly 7500 copies is tier 1 (0.00); 7501 copies is tier 2."

  # --- Rule 2 (combinatorial mode b: nested rounding, order pinned) -----------
  - name: press_run_hours
    trigger: "edition creation; market transfer or redispatch; revert to digital"
    algorithm: aggregation
    input_set: "one LatestEdition on its assigned PrintSite; a LatestEdition whose status is reverted_to_digital contributes 0.00 hours"
    formula: |
      speed_factor = 1.00 if page_count <= 8 else (0.85 if page_count <= 16 else 0.70)

      raw_hours = (requested_print_run_copies
                   / site.press_units
                   / site.shifts_per_night
                   / site.copies_per_hour_per_press
                   / speed_factor)

      # ROUNDING ORDER PINNED: divide to raw hours FIRST, then round the single
      # duration up to the next quarter hour. Rounding the per-press throughput
      # first and then dividing does NOT produce the same value.
      press_run_hours = ceil_to_next_quarter(raw_hours)

      press_ready_utc = route.dispatch_cutoff_utc + 60 minutes of make-ready + press_run_hours
      latest_edition_ready_utc = press_ready_utc + route.transit_minutes + route.buffer_minutes
    constants:
      MAKE_READY_MINUTES: 60
      QUARTER_HOUR_MINUTES: 15
      SPEED_FACTOR_TIER_1_MAX_PAGES: 8
      SPEED_FACTOR_TIER_2_MAX_PAGES: 16
      SPEED_FACTOR_TIER_1: 1.00
      SPEED_FACTOR_TIER_2: 0.85
      SPEED_FACTOR_TIER_3: 0.70
    precision: "hours to the next 0.25 hour, round up (ceil); timestamps ISO 8601 UTC"
    variants:
      - name: per_press_rounding_last
        when: "always; the pinned order"
        difference: "the division chain collapses to one raw duration that is rounded once"
      - name: rounded_throughput_first
        when: "rejected interpretation, documented only so the order stays pinned"
        difference: "rounding copies_per_hour_per_press * speed_factor to an integer first yields a different quarter-hour count for fractional throughputs; the scaffold pins per_press_rounding_last"

  # --- Rule 2 (combinatorial mode c: explicit evaluation order) ---------------
  - name: print_site_transfer_cost
    trigger: "market plan-transfer or redispatch; print site entering closing; market withdrawal; edition correction"
    algorithm: constraint_propagation
    input_set: "one PrintMarket; allocated_print_run_copies is the market's latest edition's allocated run; the marginal cost per copy is taken from the market's selected PrintRoute row"
    formula: |
      # EVALUATION ORDER PINNED — the three steps MUST run in this order:
      #   (1) cost       = allocated copies * the route's marginal cost per copy
      #   (2) credit     = 0 while the market is not withdrawn and no correction
      #                    is open; otherwise exactly -1 * cost
      #   (3) net        = cost + credit
      # Step 1's input (the route's marginal cost per copy) is itself derived
      # from the market's allocated copy count, so evaluating (3) before (1)
      # would read a stale per-copy rate. The order is pinned by stating step (1)
      # draws allocated_print_run_copies from the CURRENT edition row.
      print_site_transfer_cost_cents = round_half_up(allocated_print_run_copies * route.marginal_cost_per_copy_cents, 2)
      if market.status == "WITHDRAWN" or edition.correction_open:
          print_site_transfer_credit_cents = -1 * print_site_transfer_cost_cents
      else:
          print_site_transfer_credit_cents = 0
      net_print_site_transfer_cost_cents = round_half_up(
          print_site_transfer_cost_cents + print_site_transfer_credit_cents, 2)
    constants:
      WITHDRAWN_CREDIT_MULTIPLIER: -1
    precision: "USD, 2 decimal places, round_half_up"
    variants:
      - name: open_ledger
        when: "the market is live and no correction is open"
        difference: "credit is 0, so net equals the cost"
      - name: closed_ledger
        when: "the market is withdrawn or a correction has stopped the press"
        difference: "credit is exactly the negated cost, so net is exactly 0.00"

  # --- Rule 1 (dual-variant, domain C: commercial assortment decision) --------
  - name: single_copy_distribution_decision
    trigger: "market plan-transfer; market redispatch; print frequency apply"
    algorithm: threshold
    input_set: "one PrintMarket; the market's status IN {active, consolidation_planned, transfer_in_progress}; withdrawn markets are excluded from the assortment decision. The route figures are read from the market's selected PrintRoute row"
    formula: |
      # --- newsstand variant: single-copy retail only earns on what actually
      #     sells, so unsold copies are a return and earn nothing.
      newsstand_copies_sold = floor(allocated_print_run_copies * NEWSSTAND_SELL_THROUGH_PCT)
      newsstand_contribution_cents = round_half_up(
          newsstand_copies_sold * per_copy_revenue_cents - route.route_transport_cost, 2)
      plan_keeps_newsstand = newsstand_contribution_cents >= 0

      # --- carrier variant: every copy the route carries is billed at its own
      #     marginal delivery cost, and the full run is counted as sold.
      carrier_contribution_cents = round_half_up(
          allocated_print_run_copies * per_copy_revenue_cents
          - allocated_print_run_copies * route.marginal_cost_per_copy_cents, 2)
      field_keeps_newsstand = carrier_contribution_cents >= 0

      # single_copy_distribution_decisions.market_rule states which of the two
      # rules the market follows: "newsstand" or "carrier".
    constants:
      NEWSSTAND_SELL_THROUGH_PCT: 0.65
      NEWSSTAND_BREAK_EVEN_CENTS: 0
      CARRIER_BREAK_EVEN_CENTS: 0
    precision: "USD, 2 decimal places, round_half_up; newsstand_copies_sold floor to whole copies"
    variants:
      - name: newsstand_contribution
        when: "the market's single_copy_distribution_decisions.market_rule is newsstand"
        difference: "counts only the copies that actually sell at the sell-through rate, and charges the route's whole transport cost against them, so returns make the market look far worse than the carrier rule"
      - name: carrier_unit_margin
        when: "the market's single_copy_distribution_decisions.market_rule is carrier"
        difference: "counts the whole run as sold and charges only each copy's own marginal cost, so a market can be comfortably profitable under this rule while showing a thin or negative margin under the newsstand rule"

  # --- Rule 1 (dual-variant, domain D: subscriber economics) ------------------
  - name: subscriber_digital_migration_credit
    trigger: "subscriber digital migration; subscriber cancellation or refund; market withdrawal seeding"
    algorithm: aggregation
    input_set: "one SubscriberContract; remaining_print_issues counts only paid issues not yet delivered; the print-side margin uses the carrying market's per_copy_revenue_cents"
    formula: |
      # --- retained-print-margin variant: what the publisher keeps by NOT printing
      print_cost_per_issue_cents = carrier_labor_cents + 40
      migration_credit_cents = int(remaining_print_issues
                                   * (print_cost_per_issue_cents - market.per_copy_revenue_cents))

      # --- refund-responsibility variant: what the subscriber is owed back
      base_refund_cents = remaining_print_issues * print_issue_value_cents
      if days_remaining < 30:
          churn_retention_credit_cents = int(base_refund_cents * 0.5)
      elif days_remaining <= 89:
          churn_retention_credit_cents = int(base_refund_cents * 0.7)
      else:
          churn_retention_credit_cents = int(base_refund_cents * 0.9)
      churn_retention_credit_cents = max(churn_retention_credit_cents, 0)
      # ACTIVE-CONTRACT CAP: the refund-responsibility figure is never more than
      # 5000 cents, and the FULL_REFUND recommendation is suppressed at exactly
      # 5000 cents, so a high-value subscriber still resolves to PRINT_CREDIT.
      if churn_retention_credit_cents >= 5000:
          churn_retention_credit_cents = 5000
    constants:
      PER_ISSUE_HANDLING_CENTS: 40
      CARRIER_LABOR_CENTS: 85
      SHORT_TERM_DAYS_MAX: 30
      SHORT_TERM_PCT: 0.5
      MID_TERM_DAYS_MAX: 89
      MID_TERM_PCT: 0.7
      LONG_TERM_PCT: 0.9
      ACTIVE_CONTRACT_CAP_CENTS: 5000
    precision: "USD, integer cents, truncate toward zero"
    variants:
      - name: retained_print_margin
        when: "the subscriber migrates to digital while the print contract is still live"
        difference: "counts what the publisher avoids spending, so a market whose per-copy revenue exceeds the per-issue print cost produces a non-positive credit"
      - name: refund_responsibility
        when: "the subscriber's print contract is being ended without a replacement"
        difference: "counts what the subscriber is owed and steps down with remaining term length, so it is strictly larger than the retained-print-margin figure for the same subscriber"

  # --- Rule 2 support: offer selection (threshold, four branches) -------------
  - name: offer_recommendation
    trigger: "print frequency notices dispatched; subscriber migration eligibility check"
    algorithm: threshold
    input_set: "one SubscriberContract; remaining_contract_value_cents = round_half_up(remaining_print_issues * print_issue_value_cents, 2); days_remaining = whole days from the logical clock's current instant to paid_through_utc"
    formula: |
      remaining_contract_value_cents = round_half_up(remaining_print_issues * print_issue_value_cents, 2)
      days_remaining = floor_days(paid_through_utc - logical_clock_now)

      if remaining_contract_value_cents < 5000:
          offer_recommendation = "PRINT_CREDIT"
      elif days_remaining >= 180:
          offer_recommendation = "DIGITAL_UPGRADE"
      else:
          offer_recommendation = "FULL_REFUND"
    constants:
      LOW_VALUE_CREDIT_THRESHOLD_CENTS: 5000
      LONG_TERM_DAYS: 180
    precision: "USD, 2 decimal places, round_half_up"
    variants:
      - name: credit_branch
        when: "remaining contract value is below 5000 cents"
        difference: "a small residual balance converts to print credit regardless of term length"
      - name: upgrade_or_refund_branch
        when: "remaining contract value is at or above 5000 cents"
        difference: "the choice is driven purely by remaining term length, with 180 days as the boundary"

  # --- Rule 5/6 support: hub-level member ratio -------------------------------
  - name: newsroom_allocation_share
    trigger: "newsroom change apply; market weighted_demand_units change; region creation"
    algorithm: waterfall_allocation
    input_set: "one RegionHub; regions are ordered by (allocation_priority ASC, name ASC). The pool is the hub's total_newsroom_headcount. Pass 1 serves every region's guaranteed floor; pass 2 distributes the residual to regions in that same order"
    formula: |
      region_need_score = round_half_up(
          sum(market.weighted_demand_units for markets in the region
              whose status IN {active, consolidation_planned, transfer_in_progress}) / 1000, 2)

      # --- pass 1: guaranteed floors, in (allocation_priority ASC, name ASC) order
      guaranteed_headcount = min(floor(region_need_score), daily_headcount_floor)

      # --- pass 2: residual waterfall over the same order
      residual_pool = total_newsroom_headcount - sum(guaranteed_headcount)
      for region in ordered_regions:
          residual_grant = max(0, min(residual_pool,
                                      daily_headcount_cap - guaranteed_headcount))
          allocated_newsroom_headcount = guaranteed_headcount + residual_grant
          residual_pool = residual_pool - residual_grant

      unassigned_headcount = total_newsroom_headcount - sum(allocated_newsroom_headcount)
    constants:
      HEADCOUNT_PER_1000_DEMAND_UNITS: 1
    precision: "whole heads; region_need_score 2 decimal places, round_half_up"
    variants:
      - name: floor_only
        when: "the residual pool is exhausted before the region is reached"
        difference: "the region keeps only its guaranteed floor"
      - name: capped_residual
        when: "the region's cap binds before the pool empties"
        difference: "the region stops at daily_headcount_cap and the remainder is passed to the next region in order"

  # --- Rule 2 support: severance (tiered) -------------------------------------
  - name: newsroom_severance_cost
    trigger: "newsroom change apply; regional editing hub closure"
    algorithm: tiered_pricing
    input_set: "one NewsroomChange; the severed headcount is requested_slots - allocated_slots, so a fully placed change carries no severance"
    formula: |
      severed = requested_slots - allocated_slots
      monthly_cost_cents = position.monthly_cost_cents
      if severed <= 0:
          severance_cost_cents = 0
      elif severed <= 2:
          severance_cost_cents = round_half_up(severed * 2.1500 * 1.6500 * monthly_cost_cents, 2)
      else:
          severance_cost_cents = round_half_up(severed * 2.1500 * 0.2500 * monthly_cost_cents * 1.6500, 2)
    constants:
      SEVERANCE_MONTHS: 2.15
      SALARY_LOAD_MULTIPLIER: 1.65
      MITIGATION: 0.25
    precision: "USD, 2 decimal places, round_half_up"
    variants:
      - name: small_reduction
        when: "three or fewer heads are severed"
        difference: "no mitigation factor applies"
      - name: at_scale_reduction
        when: "four or more heads are severed"
        difference: "a 0.25 mitigation factor applies to the monthly cost before the load multiplier"

  # --- Rule 6 support: single-policy edge selection ---------------------------
  - name: select_active_sanction_policy
    trigger: "the nightly cost run, when one sanction policy must be chosen for a region hub"
    algorithm: threshold
    input_set: |
      Candidate set — the hub's DeliveryContractor rows whose status IN {active, suspended} AND whose net_60_available == true. Contractors on a residual programme (sanction_reason_code == "RESIDUAL_PROGRAMME") are excluded from the retailer credit policy. Candidate ranking key: per_copy_rate_cents ASC; tie-break: name ASC; final fallback when no candidate qualifies: sanction_reason_code == "NO_ELIGIBLE_CONTRACTOR" with the route held at prepared for the next cost run.
    formula: |
      eligible = [c for c in hub.delivery_contractors
                  if c.status in {ACTIVE, SUSPENDED}
                  and c.net_60_available == true
                  and c.sanction_reason_code != "RESIDUAL_PROGRAMME"]
      if not eligible:
          policy = NO_ELIGIBLE_CONTRACTOR   # routes stay at prepared
      else:
          eligible.sort(key=lambda c: (c.per_copy_rate_cents, c.name))
          policy = eligible[0]
    constants:
      EXCLUDED_SANCTION_REASON: "RESIDUAL_PROGRAMME"
      EMPTY_POOL_REASON: "NO_ELIGIBLE_CONTRACTOR"
    precision: "integer cents; name compared as a case-sensitive ASCII string"
    variants:
      - name: policy_selected
        when: "at least one contractor qualifies"
        difference: "the lowest per_copy_rate_cents wins; ties resolve to the lexicographically smaller name"
      - name: empty_pool
        when: "no contractor qualifies"
        difference: "no policy is applied and every route in the hub is held at prepared for the next cost run"

  # --- Rule 8/1 support: transfer route selector ------------------------------
  - name: select_transfer_route
    trigger: "market plan-transfer; market redispatch"
    algorithm: threshold
    input_set: |
      Candidate set — the receiving site's PrintRoute rows whose status == eligible AND whose is_direct_hop == true. Eligibility additionally requires the run to clear the market deadline: dispatch_cutoff_utc + 60 minutes of make-ready + press_run_hours + transit_minutes + buffer_minutes <= publication_deadline_utc. Ranking key: transit_minutes ASC; tie-break: dispatch_cutoff_utc ASC; final fallback when the ranking still ties: created_at ASC. Empty candidate set: ERR_NO_ROUTE_IN_TIME.
    formula: |
      candidates = [r for r in receiving_site.print_routes
                    if r.status == ELIGIBLE and r.is_direct_hop]
      candidates = [r for r in candidates if route_clears_deadline(r)]
      if not candidates:
          raise ERR_NO_ROUTE_IN_TIME
      candidates.sort(key=lambda r: (r.transit_minutes, r.dispatch_cutoff_utc, r.created_at))
      selected = candidates[0]
    constants:
      MAKE_READY_MINUTES: 60
    precision: "minutes as integers; timestamps compared as ISO 8601 UTC and never by id"
    variants:
      - name: direct_hop_selected
        when: "at least one direct hop clears the deadline"
        difference: "the shortest transit wins, then the earliest dispatch cutoff, then the earliest creation"
      - name: no_route_in_time
        when: "no direct hop clears the deadline"
        difference: "the transfer is refused and the market's route_selection_status stays needs_reassignment"

  # --- Rule 7 support: legal-notice ratio gate --------------------------------
  - name: is_legal_notice_ratio_compliant
    trigger: "delivery stop pause or terminate; edition correction; contractor terminate; publication cease or final settlement"
    algorithm: threshold
    input_set: "one RegionHub; markets counted are the hub's PrintMarket rows whose status IN {active, consolidation_planned, transfer_in_progress}; markets whose status is withdrawn are excluded from BOTH numerator and denominator"
    formula: |
      counted_markets = [m for m in hub.print_markets if m.status != WITHDRAWN]
      on_time_markets = [m for m in counted_markets if m's latest edition is_on_time]
      denominator = len(counted_markets)
      if denominator == 0:
          is_compliant = False          # the empty-set edge: no markets means no compliance basis
      else:
          is_compliant = (len(on_time_markets) * 100 >= hub.min_on_time_ratio_pct * denominator)
      # Boundary: equality satisfies the rule. 9 of 10 markets on time with
      # min_on_time_ratio_pct == 90 -> 900 >= 900 -> compliant.
    constants:
      MIN_ON_TIME_RATIO_PCT_DEFAULT: 90
    precision: "percentages compared as exact integer products, no floating point"
    variants:
      - name: compliant
        when: "the on-time share meets or exceeds the floor"
        difference: "the hub's legal_notice_block is cleared"
      - name: non_compliant
        when: "the on-time share falls below the floor"
        difference: "the hub's legal_notice_block is set and every print frequency change and title closure notice in the hub is refused"

  # --- Rule 4 support: late-edition penalty (escalation multiplier) -----------
  - name: late_edition_penalty
    trigger: "edition dispatch; edition correction"
    algorithm: threshold
    input_set: "one LatestEdition; minutes_late is measured from publication_deadline_utc to latest_edition_ready_utc in whole minutes; the multiplier counts the SAME edition's prior correction events"
    formula: |
      minutes_late = max(0, whole_minutes(latest_edition_ready_utc - publication_deadline_utc))
      if minutes_late == 0:
          late_edition_penalty_cents = 0
          multiplier = 1
      elif edition.correction_open:
          multiplier = 3
          late_edition_penalty_cents = int(minutes_late * 45 * multiplier)
      elif edition.late_sports_engineering_flag:
          multiplier = 2
          late_edition_penalty_cents = int(minutes_late * 45 * multiplier)
      else:
          multiplier = 1
          late_edition_penalty_cents = int(minutes_late * 45 * multiplier)
      # Route-reselection trigger: a corrected edition that is already late is
      # re-evaluated against select_transfer_route before the penalty is booked.
    constants:
      PER_MINUTE_PENALTY_CENTS: 45
      SPORTS_EDITION_MULTIPLIER: 2
      CORRECTION_MULTIPLIER: 3
    precision: "integer cents, truncate toward zero"
    variants:
      - name: plain_late
        when: "the edition carries neither a late sports flag nor an open correction"
        difference: "multiplier 1"
      - name: escalated_late
        when: "the edition carries a late sports flag or an open correction"
        difference: "multiplier 2 or 3, applied to the same minutes_late"

  # --- Rule 9 support: correction re-run --------------------------------------
  - name: correction_redispatch_cost
    trigger: "edition correction on a delivered edition"
    algorithm: aggregation
    input_set: "one LatestEdition with correction_open == true; the re-run covers the full delivery route, not a partial circulating set"
    formula: |
      correction_redispatch_cost_cents = round_half_up(
          press_run_hours * 2500.00
          + route.route_transport_cost * 1.40, 2)
    constants:
      REPRINT_HOURLY_CENTS: 2500.00
      RERUN_COST_MULTIPLIER: 1.40
    precision: "USD, 2 decimal places, round_half_up"
    variants:
      - name: full_route_rerun
        when: "always; the re-run covers every stop on the route"
        difference: "the whole route transport cost is charged at 1.40x, including stops whose copies were not affected"

  # --- Rule 1 support: dedicated second dual-variant pair (press) -------------
  - name: allocated_print_run_copies
    trigger: "edition creation; market plan-transfer or redispatch; print frequency apply"
    algorithm: waterfall_allocation
    input_set: "one LatestEdition; the contested pool is its assigned PrintSite's capacity_remaining_copies; the competing set is the site's other editions ordered by (slug ASC, print_market_id ASC)"
    formula: |
      # --- PRIORITY variant (the denominator of the site's other variants)
      if market.guaranteed_floor_copies > site.capacity_remaining_copies:
          raise ERR_FLOOR_COPIES_EXCEED_CAPACITY
      requested_print_run_copies = max(requested_print_run_copies, market.guaranteed_floor_copies)
      allocated_print_run_copies = min(requested_print_run_copies, site.capacity_remaining_copies)

      # --- PROPORTIONAL variant
      if market.guaranteed_floor_copies > site.capacity_remaining_copies:
          raise ERR_FLOOR_COPIES_EXCEED_CAPACITY
      total_requested = sum(e.requested_print_run_copies for e in site.editions)
      if total_requested == 0:
          allocated_print_run_copies = 0
      else:
          allocated_print_run_copies = int(requested_print_run_copies
                                           * site.capacity_remaining_copies
                                           // total_requested)
          allocated_print_run_copies = max(allocated_print_run_copies, market.guaranteed_floor_copies)
          allocated_print_run_copies = min(allocated_print_run_copies, requested_print_run_copies)
          allocated_print_run_copies = min(allocated_print_run_copies, site.capacity_remaining_copies)
    constants:
      REMAINDER_POLICY: "floor then floor at the market guarantee"
    precision: "whole copies, truncate toward zero"
    variants:
      - name: priority
        when: "the assigned PrintSite.allocation_method == PRIORITY"
        difference: "each market is served its whole request up to the site's remaining capacity in slug order, so an early market can consume the pool"
      - name: proportional
        when: "the assigned PrintSite.allocation_method == PROPORTIONAL"
        difference: "every market is scaled by the same remaining-capacity-to-requested ratio, then floored at its own guarantee, so no market is starved to zero"
    note: "Boundary precision: when the market guarantee exceeds the site's remaining capacity the allocation is refused outright with ERR_FLOOR_COPIES_EXCEED_CAPACITY and the edition is not created."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  # --- 0: request shape (runs before identity) --------------------------------
  - priority: 0
    category: existence
    check: "the request body parses and every supplied field matches the endpoint's declared input: required fields present, no unknown fields, enum members and numeric ranges honoured"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # --- 1-2: auth / authz ------------------------------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role names a role declared in §1.7; for every entity_backed role, X-User-ID equals the id of an existing row of that entity"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list; operations exclusive to another role or to an excluded role are refused"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 2
    category: auth
    check: "an operator may not approve a newsroom change it created itself; approval must come from a different operator"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /regional-news-ops/newsroom-changes/{changeId}/approve"

  # --- 3: existence ----------------------------------------------------------
  - priority: 3
    category: existence
    check: "every resource id in the request path resolves, walked left to right; the first unresolved segment is the one reported, and a nested child must belong to the path parent it was requested under"
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterised endpoints"

  - priority: 4
    category: existence
    check: "every id supplied in the request body as a foreign key resolves to an existing row (e.g. assigned_print_site_id, receiving_print_site_id, newsroom_position_id, to_region_id, from_region_id, delivery_stop_id)"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /regional-news-ops/print-sites/{siteId}/routes, POST /regional-news-ops/print-markets/{marketId}/editions, POST /regional-news-ops/newsroom-changes, POST /regional-news-ops/delivery-routes/{deliveryRouteId}/stops, POST /regional-news-ops/title-closures/{titleId}/merge"

  # --- 5-6: state ------------------------------------------------------------
  - priority: 5
    category: state
    check: "the target resource is in a status that permits the requested operation (the from-state of the matching transition in §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: state
    check: "the target resource is not in a terminal status; every action against a terminal row is refused"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  # --- 7-9: business_safety (regulatory compliance leads) ---------------------
  - priority: 7
    category: business_safety
    check: "the operation is refused while the owning RegionHub.legal_notice_block is true; print frequency notices, title closure publication, publication cessation and subscriber migration notices are all held"
    error_id: ERR_LEGAL_NOTICE_HOLD
    http_status: 422
    applies_to: "POST /regional-news-ops/print-markets/{marketId}/frequency-change, POST /regional-news-ops/print-markets/{marketId}/frequency-notices, POST /regional-news-ops/title-closures/{titleId}/publish-notice"

  - priority: 8
    category: business_safety
    check: "the operation is refused while the owning RegionHub.press_posture is SUSPENDED, meaning every member print site is closed"
    error_id: ERR_PRESS_POSTURE_LOCKED
    http_status: 422
    applies_to: "POST /regional-news-ops/print-sites/{siteId}/plan-closure, POST /regional-news-ops/delivery-contractors/{contractorId}/reinstate, POST /regional-news-ops/print-markets/{marketId}/plan-transfer"

  - priority: 9
    category: business_safety
    check: "the run may not be placed when the issuing site's press load would exceed its installed hourly capacity after the run; releasing physical copies with no printing capacity engaged is refused"
    error_id: ERR_PRESS_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /regional-news-ops/print-markets/{marketId}/editions"

  # --- 10-11: business_referential next, then constraint ---------------------
  - priority: 10
    category: business_referential
    check: "a forward action may not reference a row that a previous reverse action has already terminated in the same region (e.g. reinstating a delivery contractor whose own routes were all terminated by a market withdrawal)"
    error_id: ERR_BACKED_OUT_REFERENCE
    http_status: 422
    applies_to: "POST /regional-news-ops/delivery-contractors/{contractorId}/reinstate, POST /regional-news-ops/delivery-stops/{stopId}/resume"

  - priority: 11
    category: business_referential
    check: "the referenced delivery contractor is TERMINATED; a terminated contractor cannot be reinstated or carry new routes"
    error_id: ERR_CONTRACTOR_TERMINAL
    http_status: 409
    applies_to: "POST /regional-news-ops/delivery-contractors/{contractorId}/reinstate, POST /regional-news-ops/delivery-contractors/{contractorId}/routes"

  # --- 12-14: business_constraint -------------------------------------------
  - priority: 12
    category: business_constraint
    check: "within one hub, the requested identifier is already taken: Region.name, PrintSite.code, DeliveryContractor.name, DeliveryRoute.route_code and TitleClosure.title_code are unique per hub, and DeliveryStop.stop_code is unique per route"
    error_id: ERR_DUPLICATE_HUB_CODE
    http_status: 409
    applies_to: "POST /regional-news-ops/region-hubs/{hubId}/regions, POST /regional-news-ops/region-hubs/{hubId}/print-sites, POST /regional-news-ops/region-hubs/{hubId}/delivery-contractors, POST /regional-news-ops/delivery-contractors/{contractorId}/routes, POST /regional-news-ops/delivery-routes/{deliveryRouteId}/stops, POST /regional-news-ops/region-hubs/{hubId}/title-closures"

  - priority: 13
    category: business_constraint
    check: "a new delivery stop may not be placed when the number of non-terminated stops on the route would exceed the route's stop_capacity"
    error_id: ERR_STOP_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /regional-news-ops/delivery-routes/{deliveryRouteId}/stops"

  - priority: 14
    category: business_constraint
    check: "a stop's pause window must be a well-formed forward interval: pause_start_date and pause_end_date are supplied together and pause_end_date is at or after pause_start_date"
    error_id: ERR_OVERLAP_PAUSE_WINDOW
    http_status: 422
    applies_to: "POST /regional-news-ops/delivery-routes/{deliveryRouteId}/stops"

  # --- 15-21: business_temporal ---------------------------------------------
  - priority: 15
    category: business_temporal
    check: "a newsroom change's effective_date must be strictly later than the logical clock's current date; a same-day or retroactive effective date would make the change unreachable"
    error_id: ERR_EFFECTIVE_DATE_NOT_FUTURE
    http_status: 422
    applies_to: "POST /regional-news-ops/newsroom-changes, POST /regional-news-ops/newsroom-changes/{changeId}/approve"

  - priority: 16
    category: business_temporal
    check: "a delivery stop pause is only accepted while the logical clock's current date is inside the stop's declared pause window"
    error_id: ERR_PAUSE_WINDOW_NOT_OPEN
    http_status: 422
    applies_to: "POST /regional-news-ops/delivery-stops/{stopId}/pause"

  - priority: 17
    category: business_temporal
    check: "a delivery stop resume is only accepted once the logical clock's current date is later than the stop's pause_end_date"
    error_id: ERR_PAUSE_WINDOW_STILL_OPEN
    http_status: 422
    applies_to: "POST /regional-news-ops/delivery-stops/{stopId}/resume"

  - priority: 18
    category: business_temporal
    check: "a retention offer can only be accepted strictly before its cooling_off_expires_utc; an acceptance at or after the expiry instant is refused"
    error_id: ERR_COOLOFF_EXPIRED
    http_status: 409
    applies_to: "POST /regional-news-ops/subscribers/{subscriberId}/accept-retention-offer, POST /regional-news-ops/retention-actions/{actionId}/accept"

  - priority: 19
    category: business_temporal
    check: "a print frequency reduction may only be applied at least 14 calendar days after its notices were dispatched; applying inside the statutory notice period is refused"
    error_id: ERR_NOTICE_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /regional-news-ops/print-markets/{marketId}/frequency-apply"

  - priority: 19
    category: business_temporal
    check: "a frequency apply may not run before its notices are dispatched, and may not run while no renewal has been accepted"
    error_id: ERR_NOTICES_NOT_DISPATCHED
    http_status: 409
    applies_to: "POST /regional-news-ops/print-markets/{marketId}/frequency-apply"

  - priority: 20
    category: business_temporal
    check: "a subscriber refund is only accepted at or before paid_through_utc; a refund request after the paid-through instant is refused"
    error_id: ERR_REFUND_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /regional-news-ops/subscribers/{subscriberId}/refund"

  - priority: 21
    category: business_temporal
    check: "dock loading windows are half-open: a new route whose [dispatch_cutoff_utc, dispatch_cutoff_utc + loading_slot_minutes) window overlaps an existing departure at the same site is refused, unless the site's max_concurrent_departures allows one further overlapping departure"
    error_id: ERR_DOCK_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /regional-news-ops/print-sites/{siteId}/routes"

  - priority: 21
    category: business_temporal
    check: "a route cost run must advance the cost calendar: its run_date must be strictly later than the route's last_cost_run_date"
    error_id: ERR_COST_RUN_REGRESSION
    http_status: 409
    applies_to: "POST /regional-news-ops/delivery-routes/{deliveryRouteId}/cost-run"

  - priority: 21
    category: business_temporal
    check: "a route cost run may not be advanced while an edition exists in the route's market that has not itself been costed"
    error_id: ERR_RUN_NOT_COSTED
    http_status: 409
    applies_to: "POST /regional-news-ops/delivery-routes/{deliveryRouteId}/cost-run"

  # --- 22: business_fiscal (capacity first) ---------------------------------
  - priority: 22
    category: business_fiscal
    check: "the receiving print site must still be in status active and must not already be committed to another market's in-flight transfer"
    error_id: ERR_SITE_NOT_RECEIVING
    http_status: 422
    applies_to: "POST /regional-news-ops/print-markets/{marketId}/plan-transfer, POST /regional-news-ops/print-markets/{marketId}/redispatch"

  - priority: 23
    category: business_fiscal
    check: "the receiving print site's remaining capacity must cover the market's latest edition requested_print_run_copies; a site already fully allocated cannot absorb the market"
    error_id: ERR_NO_PRINT_CAPACITY
    http_status: 422
    applies_to: "POST /regional-news-ops/print-markets/{marketId}/plan-transfer, POST /regional-news-ops/print-markets/{marketId}/redispatch"

  - priority: 24
    category: business_fiscal
    check: "the market's allocated run may not fall below its guaranteed_floor_copies and may not exceed the receiving site's remaining capacity; a floor that cannot be met is refused outright"
    error_id: ERR_FLOOR_COPIES_EXCEED_CAPACITY
    http_status: 422
    applies_to: "POST /regional-news-ops/print-markets/{marketId}/editions"

  - priority: 25
    category: business_fiscal
    check: "the market's projected print_site_transfer_cost_cents may not exceed the hub's transfer_cost_ceiling_cents after the transfer is applied"
    error_id: ERR_TRANSFER_COST_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /regional-news-ops/print-markets/{marketId}/plan-transfer, POST /regional-news-ops/print-markets/{marketId}/redispatch"

  - priority: 26
    category: business_fiscal
    check: "the summed route_night_cost of a market's delivery routes may not exceed the market's daily_route_cost_ceiling_cents once the new or updated route is costed"
    error_id: ERR_ROUTE_COST_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /regional-news-ops/delivery-contractors/{contractorId}/routes"

  - priority: 27
    category: business_fiscal
    check: "the hub's aggregate print tonnage charge for the period may not exceed max_print_tonnage_budget_cents; partial-period consumption is counted, not annualized"
    error_id: ERR_PRINT_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "POST /regional-news-ops/print-markets/{marketId}/editions"

# =============================================================================
# §1.5 API Endpoint Table
#
# Path parameters are uniformly named {id}. Reverse-reachability for every §1.1
# foreign key is provided below in sub-resource form (`GET /<parent>/{id}/<seg>`)
# or filtered-list form (`GET /<children>` with the FK field as an optional input).
# =============================================================================
endpoints:

  # --- Operational clock and volume feed (test-driving, §1.5 last resort) -----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call, the clock reads the fixed startup default 2026-09-01T00:00:00Z and never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects: []

  - method: POST
    path: "/regional-news-ops/_print-volume/records"
    description: "Record one contract-day of actual press-volume charge for a print site's savings window. Days already recorded are overwritten; a day with no edition costs 0 cents. Only the 30 window days immediately preceding the logical clock's current date enter the savings calculation, so re-recording an older day changes nothing."
    roles: [PrintOperationsDirector]
    code: 201
    input: [print_site_id, day, charge_cents]
    output: null
    side_effects: ["PrintSite.annualized_savings_cents, realized_savings_cents and savings_divergence_cents recomputed (§1.3 print_site_close_savings)"]

  # --- RegionHub ------------------------------------------------------------
  - method: POST
    path: "/regional-news-ops/region-hubs"
    description: "Create a regional editing and distribution hub"
    roles: [PlatformAdmin]
    code: 201
    input: [name, total_newsroom_headcount, max_print_tonnage_budget_cents, transfer_cost_ceiling_cents]
    output: RegionHub
    side_effects: ["press_posture initialized to OPEN; legal_notice_block initialized to false"]

  - method: GET
    path: "/regional-news-ops/region-hubs"
    description: "List region hubs"
    roles: [PrintOperationsDirector, NewsroomOperationsManager, DeliveryNetworkManager, CustomerService, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: "RegionHub[]"
    side_effects: []

  - method: GET
    path: "/regional-news-ops/region-hubs/{id}"
    description: "Get one region hub"
    roles: [PrintOperationsDirector, NewsroomOperationsManager, DeliveryNetworkManager, CustomerService, Auditor, PlatformAdmin]
    code: 200
    input: []
    output: RegionHub
    side_effects: []

  - method: GET
