            - "Barrel.${b_id}.current_volume_ledger_liters == 100.00 (no partial deduction)"

      - name: reading_above_ledger_rejected
        claim_type: violation_to_error
        grounds:
          - "errors[ERR_ASSESSMENT_VOLUME_INCONSISTENT]"
        distinguishing_aspect: "An evaporation reading may only revise the ledger downward (or hold it); a measured volume of 250.0 against a 200.00 ledger is rejected as inconsistent."
        test_recipe:
          setup: ["Rickhouse 1x1x1 commissioned; barrel filled 2028-09-01 with 200.0 L."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - call: "POST /barrel-aging/expansion-projects"
