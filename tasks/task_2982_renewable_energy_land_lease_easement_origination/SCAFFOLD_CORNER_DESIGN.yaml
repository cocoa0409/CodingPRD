              as: TitleCounsel
              as_user_id: "tc-user-02"
              captures: { err: "$.data.error_id" }
          assert:
            - "${b_status} == BLOCKED at creation (its predecessor was OPEN)"
            - "HTTP 422"
            - "${err} == ERR_CURATIVE_BLOCKED_PREDECESSOR"
            - "TitleCurativeItem.${b_id}.status == BLOCKED and cleared_at is null"
            - "Parcel.${p_id}.curative_cost_cents == 0 and blocking_curative_open_count == 2 and status == SCREENING"

      - name: submit_memo_without_posted_security_returns_security_not_posted
        claim_type: violation_to_error
        grounds:
          - errors[ERR_SECURITY_NOT_POSTED]
          - validations[priority 28]
          - entities.LeaseAgreement.fields.security_posted_cents
        distinguishing_aspect: "A freshly exercised lease has security_posted_cents 0 against a requirement of 10450000, so the recording pipeline must be blocked at its FIRST hop: recording_status has to stay UNRECORDED and the parcel has to stay OPTIONED rather than advancing to LEASED."
        test_recipe:
          setup:
            - "One Landowner (w9_on_file true) and one clean 200.00-acre QUALIFIED parcel in county 48451."
            - "One OptionAgreement executed by pm-user-01 and exercised by pm-user-02; the lease has total_security_required_cents 10450000 and security_posted_cents 0."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l_id}"
            - call: "POST /land-origination/option-agreements/${o_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/exercise"
              payload: { exercise_notice_reference: "NOE-2026-0001" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { lease_id: "$.data.id", posted: "$.data.security_posted_cents" }
          trigger:
            - call: "POST /land-origination/leases/${lease_id}/submit-memo"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { err: "$.data.error_id" }
          assert:
            - "${posted} == 0 at exercise"
            - "HTTP 422"
            - "${err} == ERR_SECURITY_NOT_POSTED"
            - "LeaseAgreement.${lease_id}.recording_status == UNRECORDED and memo_submitted_at is null"
            - "Parcel.${p_id}.status == OPTIONED and Landowner.${l_id}.status == UNDER_OPTION"

      - name: record_memo_a_second_time_returns_already_recorded
        claim_type: violation_to_error
        grounds:
          - errors[ERR_ALREADY_RECORDED]
          - validations[priority 24]
          - state_machines.LeaseAgreement.recording_status
        distinguishing_aspect: "RECORDED is terminal on the recording dimension and carries a county instrument number, so a replayed recording must be refused with the dedicated 409 rather than the generic ERR_INVALID_STATE, and the original instrument number must survive intact."
        test_recipe:
          setup:
            - "The full chain of submit_memo_without_posted_security_returns_security_not_posted, but with security fully posted at 10450000, the memorandum submitted, and then recorded with instrument number 2026-0091001."
          setup_api_calls:
            - call: "POST /land-origination/landowners"
              payload: { legal_name: "Sandhill Prairie LLC", entity_type: "LLC", mailing_state: "TX", contact_email: "ops@sandhill.example", w9_on_file: true, payment_hold: false }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { l_id: "$.data.id" }
            - call: "POST /land-origination/parcels"
              payload: { apn: "R-9001-001", county_fips: "48451", landowner_id: "${l_id}", gross_acres: 200.00, interconnection_distance_km: 3.50, resource_capacity_factor: 0.38, slope_pct: 4.0, title_condition_grade: "B", zoning_code: "AG2" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { p_id: "$.data.id", p_v: "$.data.version" }
            - call: "POST /land-origination/option-agreements"
              payload: { parcel_id: "${p_id}", landowner_id: "${l_id}", expected_parcel_version: "${p_v}", option_term_days: 365, option_fee_per_acre_cents: 2500, extension_count_allowed: 1, extension_fee_per_acre_cents: 3000, rent_structure_type: "PER_ACRE", base_rent_per_acre_cents: 120000, royalty_rate_bps: 0, escalator_pct_bps: 200, escalator_mode: "SIMPLE" }
              as: LandAgent
              as_user_id: "la-user-01"
              captures: { o_id: "$.data.id" }
            - call: "POST /land-origination/option-agreements/${o_id}/send"
              payload: {}
              as: LandAgent
              as_user_id: "la-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/accept"
              payload: {}
              as: Landowner
              as_user_id: "${l_id}"
            - call: "POST /land-origination/option-agreements/${o_id}/execute"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-01"
            - call: "POST /land-origination/option-agreements/${o_id}/exercise"
              payload: { exercise_notice_reference: "NOE-2026-0001" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { lease_id: "$.data.id" }
            - call: "POST /land-origination/leases/${lease_id}/post-security"
              payload: { amount_cents: 10450000 }
              as: PaymentAdministrator
              as_user_id: "pa-user-01"
            - call: "POST /land-origination/leases/${lease_id}/submit-memo"
              payload: {}
              as: PortfolioManager
              as_user_id: "pm-user-02"
            - call: "POST /land-origination/leases/${lease_id}/record-memo"
              payload: { recording_instrument_no: "2026-0091001" }
              as: PortfolioManager
              as_user_id: "pm-user-02"
              captures: { recorded_at: "$.data.recorded_at" }
          trigger:
            - call: "POST /land-origination/leases/${lease_id}/record-memo"
              payload: { recording_instrument_no: "2026-0099999" }
