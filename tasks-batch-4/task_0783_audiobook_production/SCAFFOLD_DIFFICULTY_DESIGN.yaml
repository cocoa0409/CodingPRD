  # =================================================================
  # Rule 9 — compensating-action invariants across different conserved quantities
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payout_ledger_pay_then_reverse_conserves_money
        grounds:
          - calculations.payout_ledger_balance
          - state_machines.RoyaltyStatement.FINALIZED_to_PAID
          - state_machines.RoyaltyStatement.PAID_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity = money (sum of author + narrator payout_balance_cents). Paying the FINALIZED statement
          credits author 77550 + narrator 63450 = 141000; reversing it debits the identical 141000, so both balances
          return to 0 (total distributed unchanged, zero drift).
        test_recipe:
          setup:
            - "A FINALIZED statement (FINAL variant) with author_royalty_cents 77550 and narrator_royalty_cents 63450 (EXCLUSIVE, share 0.45; sales (100,ret10,1500) and (50,0,2000); channel cut 0.40)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { name: "A17", email: "a17@x.com" }
              as: PlatformAdmin
              captures: { au: $.data.id }
            - call: "POST /narrators"
              payload: { name: "N17", email: "n17@x.com", hourly_rate_cents: 20000 }
