  - section: calculations
    instances:
      - name: size_grading_eighth_inch_rounding
        claim_type: correct_result
        grounds: [calculations.size_grading]
        distinguishing_aspect: "Per-cell 1/8-inch rounding: base 20.0 @ M with +0.4/step yields L = 20.375 (20.4 -> 163.2 eighths -> 163) and XS = 19.25 (19.2 -> 153.6 -> 154); negative steps round symmetrically."
        test_recipe:
          setup: ["style sizes XS,S,M,L base M; DRAFT pack with chest base 20.0, grade 0.4 (DRAFT suffices: computed read is state-independent)"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-C1", base_size: "M", size_run: ["XS","S","M","L","XL"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [{ point: "chest", per_step_increment_in: 0.4 }], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
          trigger:
            - { call: "GET /tech-packs/${tp}/graded-measurements", as: Any }
          assert:
            - "cells: chest@XS == 19.25, chest@S == 19.625, chest@M == 20.0, chest@L == 20.375, chest@XL == 20.75"
            - "size_run echo == [XS,S,M,L,XL]"

      - name: line_balance_greedy_packing_efficiency
        claim_type: correct_result
        grounds: [calculations.line_balance]
        distinguishing_aspect: "Waterfall packing: ops 54s+66s (total 120) on a 2-station line -> takt ceil(120/2) == 60; station1 54 (54+66 exceeds 60), station2 66 alone (op larger than takt gets own station); efficiency 120/(2x66) == 90.9."
        test_recipe:
          setup: ["approved 2-op pack (op1 54s, op2 66s); order planned (pack pinned); line station_count 2"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-C2", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tp: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "OVERLOCK", sam_seconds: 54, piece_rate_cents: 12 }, as: Merchandiser }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 2, name: "topstitch", machine_type: "SINGLE_NEEDLE", sam_seconds: 66, piece_rate_cents: 12 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 10 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /production-orders/${po}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /sewing-lines", payload: { line_code: "L1", station_count: 2, shift_minutes: 480 }, as: ProductionPlanner, captures: { ln: $.data.id } }
          trigger:
            - { call: "GET /sewing-lines/${ln}/balance", payload: { production_order_id: "${po}" }, as: Any }
          assert:
            - "total_sam_seconds == 120; takt_seconds == 60; stations_used == 2; max_station_load_seconds == 66"
            - "balance_efficiency_pct == 90.9"

