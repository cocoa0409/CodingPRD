              payload: { assembly_id: "${asm_id}", chamber_id: "${chamber_id}", test_type: CYCLE_LIFE, scheduled_start_at: "2026-09-03T12:00:00Z", scheduled_end_at: "2026-09-03T14:00:00Z", draw_kw: 3.00 }
              captures: { t3_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-03T14:00:00Z" }
            - call: POST /capacity-tests/${t1_id}/record-result
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { measured_capacity_ah: 441.8 }
            - call: POST /capacity-tests/${t2_id}/record-result
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { measured_capacity_ah: 442.1 }
            - call: POST /capacity-tests/${t3_id}/record-result
              as: QualityInspector
              as_user_id: "${qa_a_id}"
              payload: { measured_capacity_ah: 372.0, cycles_completed: 1350 }
            - call: POST /production-lots/${lot_id}/disposition
              as: QualityInspector
              as_user_id: "${qa_b_id}"
              payload: { action: RELEASE, disposition_note: "acceptance met" }
            - call: POST /battery-units
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { lot_id: "${lot_id}", serial_number: "BU-U-001", customer_name: "Harbor Forklift Co", list_price_cents: 500000, shipped_at: "2026-09-03T14:00:00Z" }
              captures: { unit_id: "$.data.id", unit_v1: "$.data.version" }
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-12-01T00:00:00Z" }
          trigger:
            - call: POST /battery-units/${unit_id}/maintenance-logs
              as: WarrantyAdministrator
              payload: { event_type: WATERING, performed_at: "2026-10-01T00:00:00Z", electrolyte_level_ok: true }
            - call: POST /battery-units/${unit_id}/warranty-claims
              as: WarrantyAdministrator
              payload: { expected_battery_unit_version: "${unit_v1}", complaint_code: "CAPACITY_LOSS", reported_at: "2026-12-01T00:00:00Z" }
              captures: { err_stale_after_watering: "$.data.error_id" }
            - call: GET /battery-units/${unit_id}
              as: WarrantyAdministrator
              captures: { unit_v2: "$.data.version" }
            - call: POST /battery-units/${unit_id}/warranty-claims
              as: WarrantyAdministrator
              payload: { expected_battery_unit_version: "${unit_v2}", complaint_code: "CAPACITY_LOSS", reported_at: "2026-12-01T00:00:00Z" }
            - call: POST /battery-units/${unit_id}/warranty-claims
              as: WarrantyAdministrator
              payload: { expected_battery_unit_version: "${unit_v2}", complaint_code: "CAPACITY_LOSS", reported_at: "2026-12-01T00:00:00Z" }
              captures: { err_replay_stale: "$.data.error_id" }
            - call: GET /battery-units/${unit_id}
              as: WarrantyAdministrator
              captures: { unit_v3: "$.data.version" }
            - call: POST /battery-units/${unit_id}/warranty-claims
              as: WarrantyAdministrator
              payload: { expected_battery_unit_version: "${unit_v3}", complaint_code: "CAPACITY_LOSS", reported_at: "2026-12-01T00:00:00Z" }
              captures: { err_state_invalid: "$.data.error_id" }
            - call: POST /battery-units/${unit_id}/maintenance-logs
              as: WarrantyAdministrator
              payload: { event_type: CYCLE_REPORT, performed_at: "2026-08-01T00:00:00Z", cycles_delta: 120 }
              captures: { err_before_shipment: "$.data.error_id" }
            - call: POST /battery-units/${unit_id}/maintenance-logs
              as: WarrantyAdministrator
              payload: { event_type: CYCLE_REPORT, performed_at: "2027-06-01T00:00:00Z", cycles_delta: 120 }
              captures: { err_after_now: "$.data.error_id" }
            - call: GET /battery-units/${unit_id}
              as: WarrantyAdministrator
          assert:
            - "The shipped unit is version 1 with warranty_status \"IN_SERVICE\", cycle_count 0, watering_events_ok 0 and watering_compliance_ratio 1.0000."
            - "The WATERING log answers 201 and bumps the unit to version 2 - it raises watering_events_ok to 1 and touches no field the claim reads, yet it still invalidates the claimant's token."
            - "The claim carrying version 1 answers 412 with error_id \"ERR_STALE_BATTERY_UNIT_VERSION\"; claim_count stays 0 and warranty_status stays \"IN_SERVICE\"."
            - "The refreshed read answers version 2; the claim carrying version 2 answers 201 with warranty_status \"CLAIM_OPEN\", claim_count 1 and version 3."
            - "Replaying that identical body answers 412 with error_id \"ERR_STALE_BATTERY_UNIT_VERSION\" - NOT ERR_WARRANTY_STATE_INVALID, because OCC (priority 10) is evaluated before the state gate (priority 11) and the successful claim already moved the counter to 3."
            - "The same duplicate claim carrying the refreshed version 3 answers 409 with error_id \"ERR_WARRANTY_STATE_INVALID\" - a CLAIM_OPEN unit is not claimable, and this is the only way to reach that code on this endpoint."
            - "claim_count is still 1 after both refusals: neither the 412 nor the 409 increments it, and the unit is still at version 3."
            - "The CYCLE_REPORT dated 2026-08-01, before shipped_at, answers 422 with error_id \"ERR_EVENT_TIME_OUT_OF_RANGE\", and the one dated 2027-06-01, after logical now, answers the same code - the window is the closed interval [shipped_at, logical now] on both ends."
            - "The final read still answers version 3, cycle_count 0 and watering_events_ok 1: three refused writes in a row left the unit exactly as the last successful write did."

      - name: cascading_side_effects_layer_is_exercised_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile[cascading_side_effects]
          - cascades[CASCADE A]
          - cascades[CASCADE B]
        excluded_because:
          difficulty_instance: transitive_cascade / cascade_a_exposure_removal_freezes_plant_holds_lots_aborts_runs
          rationale: "The layer's whole surface is the two §1.7 cascades, and each is the subject of a §1.8 transitive_cascade instance: CASCADE A (exposure sample -> worker removal -> plant posture -> lot holds -> run aborts -> emission release) and CASCADE B (failed capacity test -> lot quarantine -> assembly revocation -> test voiding). A breadth probe would have to replay one of those five-hop chains with fewer asserts, which is strictly weaker than the depth probe it duplicates."

      - name: dual_variant_calculation_layer_is_exercised_on_both_variants
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile[dual_variant_calculation]
          - calculations[formation_energy_charge]
          - calculations[worker_exposure_index]
        excluded_because:
          difficulty_instance: dual_variant_calc / worker_exposure_air_twa_90d_vs_blood_peak_180d
          rationale: "Both dual-variant calculations are already pinned at depth: the exposure index across its AIR-TWA-90d and BLOOD-peak-180d variants (including the variant flip when a single BLOOD sample lands inside the window), and formation energy across its provisional_nameplate and final_metered variants in formation_energy_provisional_nameplate_vs_final_metered. The variant SELECTOR, not the arithmetic, is the whole difficulty, and it cannot be probed more cheaply than those instances do."

      - name: selector_policy_layer_is_exercised_over_the_full_candidate_grid
        claim_type: selector_policy
        grounds:
          - complexity_profile[selector_policy]
          - calculations[motive_power_sizing]
        excluded_because:
          difficulty_instance: combinatorial_formula / motive_power_sizing_design_charger_circular_order_mode_c
          rationale: "The only selector in the task is the motive-power design-then-charger matcher, and its §1.8 instance walks the pinned circular evaluation order over a candidate grid where a per-candidate-optimal choice and the pinned-order choice disagree on both the selected pack and the fleet capital. The endpoints instance fleet_analysis_is_a_computed_read_over_accepted_requests already covers the read side, so a further breadth probe would only re-run the same selector."

      - name: rate_threshold_triggers_layer_fires_exactly_at_its_threshold
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile[rate_threshold_triggers]
          - calculations[worker_exposure_index]
          - calculations[plant_compliance_posture]
        excluded_because:
          difficulty_instance: boundary_precision_check / blood_lead_index_exactly_100_removes_but_99_67_does_not
          rationale: "Both rate thresholds in the task are boundary instances in §1.8: the exposure index at exactly 100.00 (removal fires) versus 99.67 (it does not), and the emission utilisation ratio at exactly 1.0000 (accepted, then freezes) in emission_ratio_exactly_one_is_accepted_then_freezes. The calculations instance plant_compliance_posture_at_the_restricted_boundary additionally pins the RESTRICTED line at 0.8500. The threshold surface is fully covered at the only interesting inputs."

  # ===================================================================
  # SECTION 9 - consistency_model
  # -------------------------------------------------------------------
  # §1.0 declares consistency_model: immediate. There is no queue, no
  # background worker, no eventual projection and no cached aggregate in
  # this task: every derived field, every ledger, every cascade hop and
  # every list projection is committed inside the request that caused it
  # and is visible to the very next read. This matters most for the
  # fields a naive implementation would be tempted to recompute lazily -
  # plant.emission_reserved_g, plant.compliance_posture,
  # lot.lot_capacity_yield_pct and the lead mass balance.
  # ===================================================================
  - section: consistency_model
    instances:

      - name: every_derived_field_and_ledger_is_visible_to_the_next_read_in_the_same_session
        claim_type: immediate
        grounds:
          - consistency_model[immediate]
          - endpoints[GET /plants/{id}]
          - endpoints[GET /plants/{id}/emission-ledger]
          - endpoints[GET /plants/{id}/lead-mass-balance]
          - endpoints[GET /formation-runs]
          - endpoints[GET /production-lots/{id}/quality-summary]
        distinguishing_aspect: "Read-your-writes holds for DERIVED state, not just for the row that was written: the response to POST /formation-runs already carries the provisional charge, and the plant's emission_reserved_g, emission_utilization_ratio and compliance_posture have already moved when the very next request reads them - no refresh, no second call, no eventual reconciliation. The probe pairs each write with the cheapest read that could plausibly lag: the collection listing (is the new row indexed immediately?), the parent aggregate (has the ledger moved?), and the computed read (has the derived percentage moved?)."
        test_recipe:
          setup:
            - "Plant PLT-RIV with monthly_lead_emission_permit_g 100000.00 and lead_initial_inventory_kg 10000.000; workers Cara (PRODUCTION), Dana (QUALITY), Ada/Ben (ENGINEER); design CD-LEAD-465 APPROVED; bay FB-1 (rated_power_kw 20.00, cooldown_minutes 45); lot LOT-V quantity 9 advanced to FORMATION; clock 2026-09-01T00:00Z. The plant's ledger starts at emission_reserved_g 0.00, emission_consumed_g 0.00, emission_utilization_ratio 0.0000 and compliance_posture OPEN."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              as: PlantAdmin
              payload: { current_utc: "2026-09-01T00:00:00Z" }
            - call: POST /plants
              as: PlantAdmin
              payload: { name: "Riverside Battery Works", site_code: "PLT-RIV", licensed_chemistries: [LEAD_ACID, LITHIUM_LFP], permit_status: ACTIVE, monthly_lead_emission_permit_g: 100000.00, peak_tariff_cents_per_kwh: 25.00, offpeak_tariff_cents_per_kwh: 15.00, lead_initial_inventory_kg: 10000.000 }
              captures: { plant_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ada Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Ben Engineer", job_class: ENGINEER, hire_date: "2020-01-01T00:00:00Z" }
              captures: { eng_b_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Cara Supervisor", job_class: PRODUCTION, hire_date: "2020-01-01T00:00:00Z" }
              captures: { sup_a_id: "$.data.id" }
            - call: POST /workers
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", full_name: "Dana Quality", job_class: QUALITY, hire_date: "2020-01-01T00:00:00Z" }
              captures: { qa_a_id: "$.data.id" }
            - call: POST /cell-designs
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { code: "CD-LEAD-465", chemistry: LEAD_ACID, plate_type: TUBULAR, cells_per_battery: 12, cell_nominal_voltage_v: 2.00, nominal_capacity_ah: 465.0, rated_cycles: 1500, warranty_months: 60, pack_weight_kg: 900.0, lead_content_kg: 300.000, formation_charge_factor: 1.50, list_price_cents: 500000 }
              captures: { design_id: "$.data.id" }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_a_id}"
              payload: { action: SUBMIT }
            - call: POST /cell-designs/${design_id}/review-actions
              as: DesignEngineer
              as_user_id: "${eng_b_id}"
              payload: { action: APPROVE }
            - call: POST /formation-bays
              as: PlantAdmin
              payload: { plant_id: "${plant_id}", bay_code: "FB-1", rated_power_kw: 20.00, cooldown_minutes: 45 }
              captures: { bay_id: "$.data.id" }
            - call: POST /production-lots
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { plant_id: "${plant_id}", cell_design_id: "${design_id}", lot_code: "LOT-V", quantity: 9 }
              captures: { lot_id: "$.data.id" }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: PLATE_PRODUCTION }
            - call: POST /production-lots/${lot_id}/advance
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { to_state: FORMATION }
          trigger:
            - call: GET /plants/${plant_id}/emission-ledger
              as: PlantAdmin
            - call: POST /formation-runs
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { lot_id: "${lot_id}", bay_id: "${bay_id}", scheduled_start_at: "2026-09-02T06:00:00Z", scheduled_end_at: "2026-09-02T12:00:00Z" }
              captures: { run_id: "$.data.id" }
            - call: GET /formation-runs
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { lot_id: "${lot_id}", limit: 10, offset: 0 }
            - call: GET /plants/${plant_id}/emission-ledger
              as: PlantAdmin
            - call: GET /plants/${plant_id}
              as: PlantAdmin
            - call: POST /formation-runs/${run_id}/abort
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
              payload: { abort_reason: "ventilation maintenance" }
            - call: GET /plants/${plant_id}/emission-ledger
              as: PlantAdmin
            - call: GET /plants/${plant_id}/lead-mass-balance
              as: PlantAdmin
            - call: GET /production-lots/${lot_id}/quality-summary
              as: ProductionSupervisor
              as_user_id: "${sup_a_id}"
          assert:
            - "The ledger read BEFORE the run answers emission_reserved_g 0.00, emission_consumed_g 0.00 and emission_utilization_ratio 0.0000."
            - "POST /formation-runs answers 201 and its OWN body already carries estimated_energy_kwh 102.00 (nameplate 20.00 kW * 6 h * 0.85 binds below the 150.66 theoretical), reserved_emission_g 255.00 and provisional_charge_cents 2210 (68.00 peak kWh at 25 -> 1700 plus 34.00 off-peak kWh at 15 -> 510) - the derived figures are computed in the same request, not on the next read."
            - "GET /formation-runs immediately lists exactly one row for the lot with total_count 1 and run_state \"SCHEDULED\" - the collection index is not lagging behind the create."
            - "The ledger read immediately after the create answers emission_reserved_g 255.00, emission_consumed_g 0.00 and emission_utilization_ratio 0.0026 (255.00 / 100000.00 rounded to 4 decimals) - the parent aggregate moved inside the child's write."
            - "GET /plants/{id} in the same session answers compliance_posture \"OPEN\" with the same emission_utilization_ratio 0.0026: the two reads never disagree, so there is no cached copy anywhere."
            - "The abort answers 200 and the NEXT ledger read answers emission_reserved_g back to 0.00 with emission_utilization_ratio 0.0000 - the release is immediate too, and INVARIANT E1 closes on every single read, not eventually."
            - "GET /plants/{id}/lead-mass-balance answers lead_initial_inventory_kg 10000.000, lead_inventory_kg 10000.000, lead_in_field_kg 0.000, lead_recycled_kg 0.000 and lead_mass_variance_kg 0.000 throughout: formation reserves EMISSION quota, never lead mass, so the two ledgers move independently and neither is recomputed lazily from the other."
            - "GET /production-lots/{id}/quality-summary answers sample_size null, completed_test_count 0 and release_blocked_by \"ERR_LOT_STATE_INVALID\" for the FORMATION-stage lot - the computed read reflects the lot's state at this instant with no staleness."
