              payload: {}
              as: FilmOffice
            - call: "POST /productions/${prod_id}/shoot-days/${sd_id}/complete"
              payload: { actual_hours: 8 }
              as: LocationManager
          assert:
            - "ShootDay.${sd_id}.compliance_status == VIOLATION (strict variant: the RESOLVED HIGH complaint still contributes exactly 2 points; monitors all checked in, no overtime)"
            - "Complaint.${cmp_id}.status == RESOLVED (resolution happened yet did not erase the strict compliance fact)"
            - "ShootDay.${sd_id}.overtime_minutes == 0"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula: two instances in DIFFERENT modes.
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: monitors_required_multibranch_threshold_formula
        grounds:
          - calculations.monitors_required
          - entities.ShootDay.fields.monitors_required
        distinguishing_aspect: |
          Mode (a): a >=3-input formula with non-linear conditional branches on
          entity state — ceil(hours/8) + (lanes >= threshold) + (cast >
          threshold). With hours=12, lanes=2 (== threshold 2, >= so fires),
          cast=60 (> 50, fires): 2 + 1 + 1 = 4; each branch independently
          toggles the result.
        test_recipe:
          setup:
            - "J1 with police_monitor_lane_threshold 2 and large_cast_threshold 50"
            - "Production cast_size 60; agreement EXECUTED; permit submitted with closed_lanes 2, shoot_hours_per_day 12 and ISSUED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: FilmOffice
            - call: "POST /jurisdictions"
              payload: { code: "LA-CITY", name: "Los Angeles City", lead_time_business_days: 5, notification_lead_calendar_days: 3, notification_radius_ft: 500, base_fee_cents: 100000, per_day_fee_cents: 50000, per_lane_fee_cents: 20000, large_cast_threshold: 50, large_cast_multiplier_bps: 12500, min_liability_limit_cents: 100000000, police_monitor_lane_threshold: 2, holidays: [] }
              as: FilmOffice
              captures: { jur_id: $.data.id }
