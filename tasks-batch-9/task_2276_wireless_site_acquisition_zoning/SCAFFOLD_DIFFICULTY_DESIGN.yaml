  # =========================================================================
  # Rule 7 — cross-entity state dependencies over different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: zoning_submit_depends_on_candidate_lease_executed
        grounds:
          - validations[priority=49]
          - errors[ERR_LEASE_NOT_EXECUTED]
          - state_machines.ZoningApplication.PREPARING_to_SUBMITTED
          - entities.Candidate.fields.acquisition_status
        distinguishing_aspect: |
          Entity pair (ZoningApplication, Candidate): the application's own status is a perfectly valid
          PREPARING with both required simulations attached, yet submission is gated on the OTHER entity's
          acquisition_status being LEASE_EXECUTED. Executing the lease flips nothing on the application and
          the identical submit call then succeeds.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a candidate at LANDLORD_ENGAGED with an ACCEPTED (not yet executed) lease"
            - "a PREPARING CONDITIONAL_USE application with 2 visual simulations attached"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /jurisdictions"
              payload: { name: "Northeast Township", market_code: "MKT-NE-01", by_right_review_days: 60, conditional_use_review_days: 90, variance_review_days: 150, hearing_cadence_days: 14, requires_visual_simulation: true, min_visual_simulations: 2, max_continuances: 2, historic_district_flag: false, tribal_consultation_required: false, historical_delay_factor: 1.20, appeal_window_days: 30 }
              as: ZoningPlanner
              captures: { jur_id: $.data.id }
            - call: "POST /search-rings"
