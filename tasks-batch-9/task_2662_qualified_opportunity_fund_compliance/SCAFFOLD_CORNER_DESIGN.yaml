              captures: { ok_id: $.data.id, ok_basis_date: $.data.window_basis_date, ok_deadline: $.data.investment_deadline }
          assert:
            - "${err_ordinary} == ERR_GAIN_NOT_ELIGIBLE with HTTP 422"
            - "${err_basis} == ERR_GAIN_NOT_ELIGIBLE with HTTP 422 (SECTION_1231_YEAR_END demands SECTION_1231_NET character)"
            - "Third call HTTP 201: the matched pair is accepted, ${ok_basis_date} == 2026-12-31T00:00:00Z and ${ok_deadline} == 2027-06-29T00:00:00Z"
            - "Exactly one EligibleGain row exists for Investor.${inv_id} and its status == ELIGIBLE"

      - name: deferral_election_before_window_basis_rejected
        claim_type: error_triggerable
        grounds:
