            - call: "POST /optics/metrology-reports"
              payload: { process_run_id: "${r2}", surface_rms_waves: 0.0200, surface_roughness_nm_rms: 0.8000, transmitted_wavefront_rms_waves: 0.0500 }
              as: MetrologyTechnician
