            - "After the second receive: rolling_points == 100 and recognition_tier == BRONZE — the >= boundary is inclusive at exactly 100"

      - name: staleness_boundary_sweep_at_exactly_180_days
        grounds:
          - calculations.box_listing_posture
          - state_machines.LibraryBox.ACTIVE_to_SUSPENDED
          - entities.LibraryBox.fields.days_since_activity
        distinguishing_aspect: |
          Metric days_since_activity with an inclusive >= 180 boundary: at 179 days the sweep
          suspends nothing (posture only FLAGGED at >= 120); at exactly 180 days the sweep
          suspends the box. Reached through POST /library-network/map/sweeps — distinct metric
          (day count) and endpoint from the sibling's points boundary at allocation receive.
        test_recipe:
          setup:
            - "ACTIVE LISTED box whose last_activity_at == 2026-08-01T00:00:00Z (activation time); no complaints, no maintenance"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Jane Addams", email: "jane@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
