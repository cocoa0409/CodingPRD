              as: DeanOffice
              captures: { cx3_tr_b: $.data.id }
            - call: "POST /startup-packages/${cx3_pkg}/submit"
              payload: {}
              as: DeanOffice
              as_user_id: "U-DEANOFFICE-1"
            - call: "POST /startup-packages/${cx3_pkg}/endorse"
              payload: {}
              as: DepartmentChair
              as_user_id: "${cx3_dept}"
            - call: "POST /startup-packages/${cx3_pkg}/approve"
              payload: {}
              as: Dean
              as_user_id: "${cx3_col}"
            - call: "POST /faculty/${cx3_fac}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /startup-packages/${cx3_pkg}/activate"
              payload: {}
              as: DeanOffice
            - call: "POST /lab-spaces"
              payload: { building_code: "BIOL", room_number: "88", net_sq_ft: 900, space_class: "DRY", power_kw_capacity: 250.00, chilled_water_available: false, fume_hood_count: 0, floor_load_psf: 500 }
              as: FacilitiesManager
              captures: { cx3_space: $.data.id }
            - call: "POST /equipment-orders"
              payload: { package_id: "${cx3_pkg}", install_space_id: "${cx3_space}", vendor_name: "JEOL", item_description: "Electron microscope", quoted_cents: 19996000, lead_time_days: 90, required_power_kw: 40.00, requires_chilled_water: false, required_fume_hoods: 0, required_floor_load_psf: 400 }
              as: DeanOffice
              captures: { cx3_ord: $.data.id }
            - call: "GET /startup-packages/${cx3_pkg}"
              payload: {}
              as: DeanOffice
              captures: { cx3_pv: $.data.version }
            - call: "POST /equipment-orders/${cx3_ord}/place"
              payload: { expected_package_version: "${cx3_pv}" }
              as: DeanOffice
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-07-01T00:00:00Z" }
              as: DeanOffice
          trigger:
            - call: "POST /startup-packages/${cx3_pkg}/year-end-rollover"
              payload: { fiscal_year: 2027 }
              as: DeanOffice
          assert:
            - "the pre-rollover ratio is (0 + 19996000) / 40000000 == 0.4999 exactly, which is below MIN_SPENDDOWN_RATIO_FOR_CARRYFORWARD 0.5000, so step 1 marks the package carryforward-INELIGIBLE"
            - "response code is 200"
            - "NO CARRYFORWARD_OUT and NO CARRYFORWARD_IN row was written anywhere on the package, and CommitmentTranche.${cx3_tr_b}.carried_in_cents == 0 - despite policy FULL on the source and a valid FY2028 destination of the same category"
            - "CommitmentTranche.${cx3_tr_a}: status OBLIGATED (step 3 outranks the step 6 labels), encumbered_cents 19996000, available_balance_cents 0, carried_out_cents 0, expired_cents 5004000"
            - "exactly one EXPIRY row of 5004000 exists, splitting 2251800 / 1751400 / 1000800 - the largest-remainder split of the expiry, not of the tranche"
            - "CommitmentTranche.${cx3_tr_b} was opened by the same call (its window now contains the clock): status OPEN, available_balance_cents 15000000"
            - "StartupPackage.${cx3_pkg}.total_committed_cents is still 40000000 (no status filter), total_expired_cents == 5004000, total_available_cents == 15000000 (the OBLIGATED tranche is excluded) and spend_down_ratio is still 0.4999"
            - "counterfactual pinning the boundary: an order of 20000000 instead of 19996000 gives a ratio of exactly 0.5000, which is eligible on >=, and the FULL policy then carries the remaining 5000000 to ${cx3_tr_b} with no EXPIRY row at all - 4000 cents of encumbrance flips the entire outcome"
            - "counterfactual pinning the precision: an order of 19998000 gives 0.49995, which ROUND_HALF_UP renders as 0.5000 at 4 decimal places and is therefore ALSO eligible - the comparison is against the rounded ratio, not the exact rational"

      - name: corner_cx_separation_cascade_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
          - state_machines.Faculty.transitions.DEPARTURE_NOTICE_to_DEPARTED
        distinguishing_aspect: "The deepest cascade in the API has to be verified end to end, with ordering sensitivity and no partial application."
        excluded_because:
          difficulty_instance: separation_depth_four_faculty_to_package_to_appointment_to_tranche_to_funder
          rationale: "That instance walks the whole four-level chain from the faculty row down through the package, the staff appointment, the tranche and the funder ledger in one call and reconciles every level, which is exactly the end-to-end claim for this layer; the substantial-completion bubble-up instance covers the opposite direction."
      - name: corner_cx_renovation_dual_variant_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
          - calculations.renovation_cost_allocation
        distinguishing_aspect: "Both variants must produce their own result on the same project and the switch must post exactly the delta."
        excluded_because:
          difficulty_instance: renovation_scope_estimate_vs_final_actual_divergence
          rationale: "That instance runs SCOPE_ESTIMATE at award and FINAL_ACTUAL at substantial completion over the same project and pins cost_variance_cents plus the reconciling ledger rows, which is the complete both-variants-and-the-delta claim for this layer."

  - section: consistency_model
    instances:
      - name: corner_consistency_place_response_already_shows_the_ledger_movement
        claim_type: immediate
        grounds:
