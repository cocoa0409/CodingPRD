          HALF-OPEN [start, end) semantics on a per-evaluator resource: the boundary instant belongs
          to the later window, so 09:00-11:00 and 11:00-13:00 coexist on the same evaluator while
          10:30-12:00 is refused. The overlap set is scoped to status == ASSIGNED rows of the SAME
