          The aggregate ceiling is an inclusive integer count, not a money comparison: with
          max_concurrent_reservations 2 the second mutually intersecting hold is admitted because
          1 + 1 == 2 satisfies <= 2, and the third is refused because 2 + 1 == 3 exceeds it, on a
          different endpoint and a different quantity than the strictly-greater cent comparison of the
          spend-cap instance.
        test_recipe:
          setup:
