  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: case_revision_cycle_loop
        grounds:
          - state_machines.TenureCase.EXTERNAL_REVIEW_to_RETURNED_FOR_REVISION
          - state_machines.TenureCase.RETURNED_FOR_REVISION_to_DOSSIER_ASSEMBLY
          - state_machines.TenureCase.DOSSIER_ASSEMBLY_to_EXTERNAL_REVIEW
        distinguishing_aspect: |
          Cyclic shape on TenureCase: the dossier loop
          DOSSIER_ASSEMBLY -> EXTERNAL_REVIEW -> RETURNED_FOR_REVISION ->
          DOSSIER_ASSEMBLY -> EXTERNAL_REVIEW traverses the submission transition
          TWICE; dossier items survive the loop in SUBMITTED and
          dossier_submitted_at is refreshed on the second pass.
        test_recipe:
          setup:
            - "Case with standard complete dossier, submitted once, returned for revision (no invitations exist, so the ACCEPTED-invitation precondition is vacuous), resumed"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand R", employee_id: "E700", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_r: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_r}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY" }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_r: $.data.id, case_r_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_r}", category: "TEACHING", title: "T1", page_count: 10, expected_case_version: "${case_r_v}" }, as: Candidate, as_user_id: "${cand_r}", captures: { r_t1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_r}", category: "TEACHING", title: "T2", page_count: 10, expected_case_version: "${case_r_v} + 1" }, as: Candidate, as_user_id: "${cand_r}", captures: { r_t2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_r}", category: "RESEARCH", title: "R1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_r_v} + 2" }, as: Candidate, as_user_id: "${cand_r}", captures: { r_r1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_r}", category: "RESEARCH", title: "R2", page_count: 12, expected_case_version: "${case_r_v} + 3" }, as: Candidate, as_user_id: "${cand_r}", captures: { r_r2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_r}", category: "RESEARCH", title: "R3", page_count: 12, expected_case_version: "${case_r_v} + 4" }, as: Candidate, as_user_id: "${cand_r}", captures: { r_r3: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_r}", category: "SERVICE", title: "S1", page_count: 5, expected_case_version: "${case_r_v} + 5" }, as: Candidate, as_user_id: "${cand_r}", captures: { r_s1: $.data.id } }
            - { call: "POST /api/dossier-items/${r_t1}/submit", as: Candidate, as_user_id: "${cand_r}" }
            - { call: "POST /api/dossier-items/${r_t2}/submit", as: Candidate, as_user_id: "${cand_r}" }
            - { call: "POST /api/dossier-items/${r_r1}/submit", as: Candidate, as_user_id: "${cand_r}" }
            - { call: "POST /api/dossier-items/${r_r2}/submit", as: Candidate, as_user_id: "${cand_r}" }
            - { call: "POST /api/dossier-items/${r_r3}/submit", as: Candidate, as_user_id: "${cand_r}" }
            - { call: "POST /api/dossier-items/${r_s1}/submit", as: Candidate, as_user_id: "${cand_r}" }
            - { call: "POST /api/cases/${case_r}/submit-dossier", as: Candidate, as_user_id: "${cand_r}" }
            - { call: "POST /api/cases/${case_r}/return-for-revision", as: ProvostOfficer, captures: { case_r_ret: $.data.stage } }
            - { call: "POST /api/cases/${case_r}/resume-assembly", as: Candidate, as_user_id: "${cand_r}" }
          trigger:
            - { call: "POST /api/cases/${case_r}/submit-dossier", as: Candidate, as_user_id: "${cand_r}", captures: { case_r_stage2: $.data.stage, case_r_sub2: $.data.dossier_submitted_at } }
          assert:
            - "case_r_ret == RETURNED_FOR_REVISION (first pass left EXTERNAL_REVIEW backwards)"
            - "case_r_stage2 == EXTERNAL_REVIEW (second forward pass through the same transition)"
            - "DossierItem.${r_r1}.status == SUBMITTED (items survive the revision loop)"
            - "case_r_sub2 == 2026-08-01T00:00:00Z (refreshed by the second submission)"

      - name: round_reopen_recount_cycle
        grounds:
          - state_machines.ReviewRound.COMPLETED_to_VOTING_OPEN
          - state_machines.Vote.CAST_to_CAST
          - state_machines.ReviewRound.TALLYING_to_COMPLETED
        distinguishing_aspect: |
          Cyclic shape on ReviewRound: VOTING_OPEN -> TALLYING -> COMPLETED ->
          (reopen) VOTING_OPEN -> TALLYING -> COMPLETED. A ballot changed during
          the reopened window (YES -> NO) flips the certified verdict: first
          certification passed=true with yes_percentage 0.6667, second
          certification passed=false with yes_percentage 0.3333 — the cycle is
          stateful, not a no-op.
        test_recipe:
          setup:
            - "Case at DEPT_COMMITTEE with dept committee of 3 MEMBERs + 1 CHAIR (M = 4, quorum_required = 2), STRICT_MAJORITY_OF_CAST"
            - "Round opened; ballots YES, YES, NO cast (votes_cast 3 >= 2); voting closed; certified (passed=true, pct 0.6667); case NOT yet advanced"
          setup_api_calls:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /api/candidates", payload: { full_name: "Cand V", employee_id: "E800", department: "CS", college: "ENG", tenure_clock_start: "2020-08-01" }, as: ProvostOfficer, captures: { cand_v: $.data.id } }
            - { call: "POST /api/cases", payload: { candidate_id: "${cand_v}", review_cycle: "2026-2027", target_rank: "ASSOCIATE_PROFESSOR", seeking_tenure: true, clock_policy: "ANNIVERSARY", waiver_signed: true }, as: ProvostOfficer, as_user_id: "po_creator", captures: { case_v: $.data.id, case_v_v: $.data.version } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_v}", category: "TEACHING", title: "T1", page_count: 10, expected_case_version: "${case_v_v}" }, as: Candidate, as_user_id: "${cand_v}", captures: { v_t1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_v}", category: "TEACHING", title: "T2", page_count: 10, expected_case_version: "${case_v_v} + 1" }, as: Candidate, as_user_id: "${cand_v}", captures: { v_t2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_v}", category: "RESEARCH", title: "R1", page_count: 12, is_peer_reviewed: true, expected_case_version: "${case_v_v} + 2" }, as: Candidate, as_user_id: "${cand_v}", captures: { v_r1: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_v}", category: "RESEARCH", title: "R2", page_count: 12, expected_case_version: "${case_v_v} + 3" }, as: Candidate, as_user_id: "${cand_v}", captures: { v_r2: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_v}", category: "RESEARCH", title: "R3", page_count: 12, expected_case_version: "${case_v_v} + 4" }, as: Candidate, as_user_id: "${cand_v}", captures: { v_r3: $.data.id } }
            - { call: "POST /api/dossier-items", payload: { case_id: "${case_v}", category: "SERVICE", title: "S1", page_count: 5, expected_case_version: "${case_v_v} + 5" }, as: Candidate, as_user_id: "${cand_v}", captures: { v_s1: $.data.id } }
            - { call: "POST /api/dossier-items/${v_t1}/submit", as: Candidate, as_user_id: "${cand_v}" }
            - { call: "POST /api/dossier-items/${v_t2}/submit", as: Candidate, as_user_id: "${cand_v}" }
