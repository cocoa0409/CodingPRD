  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: ncr_supplier_fault_disposition_chain
        grounds:
          - state_machines.NonconformanceReport.CONTAINED_to_DISPOSITIONED
          - calculations.supplier_quality_score
          - state_machines.Supplier.QUALIFIED_to_SUSPENDED
          - state_machines.SupplierPart.QUALIFIED_to_ON_HOLD
          - state_machines.DeviceLot.hold
        distinguishing_aspect: |
          Depth-3 cascade triggered by NCR disposition (fault=SUPPLIER, second CRITICAL): NCR mutates
          Supplier score (100-30-30=40); the score crossing <50 mutates Supplier.status to SUSPENDED;
          suspension mutates SupplierParts to ON_HOLD; each part hold mutates in-flight lots to ON_HOLD.
          Distinct trigger from capa_process_change_revalidation_chain.
        test_recipe:
          setup:
            - "supplier SUP-N QUALIFIED (score 100) with parts PN-N1 and PN-N2 (received 100 each)"
            - "DMR DEV-N rev A APPROVED; protocol VP-N VALIDATED"
            - "lot LT-N1 (component PN-N1) and lot LT-N2 (component PN-N2), both IN_PRODUCTION"
            - "NCR-N1 (CRITICAL) on PN-N1 already dispositioned fault=SUPPLIER: score 70, PN-N1 ON_HOLD, LT-N1 ON_HOLD"
          setup_api_calls:
            - { call: "POST /api/manufacturing-lines", payload: { line_code: "L-N", changeover_buffer_hours: 24 }, as: QMSAdmin, as_user_id: "admin-1", captures: { line_id: "$.data.id" } }
