  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: ltv_test_blocked_without_fresh_valuation
        grounds:
          - calculations.covenant_measure
          - validations[priority=10]
          - errors[ERR_STALE_VALUATION]
        distinguishing_aspect: |
          Entity pair CovenantTest -> Valuation: recording a MAX_LTV test is rejected with
          ERR_STALE_VALUATION when the asset has no CONFIRMED valuation — the covenant's own
          state is valid; the blocker lives entirely on a different entity.
        test_recipe:
          setup:
            - "Asset A1 with loan 300,000,000 @ 1000bps and MAX_LTV covenant 6500; NO valuation exists"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id } }
            - { call: "POST /api/loans", payload: { asset_id: "${a1}", lender_name: "Bank", principal_balance_cents: 300000000, annual_interest_rate_bps: 1000, origination_date: "2026-01-01", maturity_date: "2028-06-30" }, as: PortfolioDirector, captures: { ln1: $.data.id } }
            - { call: "POST /api/covenants", payload: { loan_id: "${ln1}", covenant_type: "MAX_LTV", threshold_bps: 6500, test_frequency: "QUARTERLY", cure_period_days: 30 }, as: PortfolioDirector, captures: { cv1: $.data.id } }
          trigger:
            - { call: "POST /api/covenant-tests", payload: { covenant_id: "${cv1}", period_label: "2026-Q3" }, as: Analyst, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_VALUATION (409)"
            - "No CovenantTest row is persisted: GET /api/covenants/${cv1}/covenant-tests returns total_count == 0"

      - name: plan_approval_blocked_by_suspended_manager
        grounds:
          - state_machines.BusinessPlan.SUBMITTED_to_APPROVED
          - validations[priority=7]
          - errors[ERR_MANAGER_SUSPENDED]
        distinguishing_aspect: |
          Entity pair BusinessPlan -> PropertyManager (distinct from sibling's
          CovenantTest -> Valuation pair): approving a SUBMITTED plan whose asset's manager
          is SUSPENDED fails with ERR_MANAGER_SUSPENDED even though the plan itself is in a
          valid from-state.
        test_recipe:
          setup:
            - "FY2027 plan SUBMITTED on asset A1; PM1 then SUSPENDED manually"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 11000000 }
                  - { category: PARKING_REVENUE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: OTHER_REVENUE, month_index: 1, budget_amount_cents: 100000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 200000 }
                  - { category: TAX_EXPENSE, month_index: 1, budget_amount_cents: 300000 }
                  - { category: INSURANCE_EXPENSE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: UTILITIES_EXPENSE, month_index: 1, budget_amount_cents: 80000 }
                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/property-managers/${pm1}/suspend", payload: {}, as: PortfolioDirector }
          trigger:
            - { call: "POST /api/business-plans/${pl1}/approve", payload: {}, as: PortfolioDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_MANAGER_SUSPENDED (409)"
            - "BusinessPlan.${pl1}.status remains SUBMITTED (GET /api/business-plans/${pl1})"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: plan_year_window_occupied_rejected
        grounds:
          - validations[priority=9]
          - errors[ERR_DUPLICATE_PLAN]
        distinguishing_aspect: |
          Interval semantics = fiscal-year window identity on resource (asset, fiscal_year):
          a second DRAFT for an already-occupied year window is rejected even though no
          dates overlap arithmetically — the whole 12-month window is the occupied interval.
        test_recipe:
          setup:
            - "FY2027 plan exists in DRAFT for asset A1"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - { call: "GET /api/assets/${a1}", payload: {}, as: Analyst, captures: { a_v2: $.data.version } }
          trigger:
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a_v2}" }, as: AssetManager, as_user_id: "am-1", captures: { err: $.data.error_id } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2028, expected_asset_version: "${a_v2}" }, as: AssetManager, as_user_id: "am-2", captures: { pl2: $.data.id, st2: $.data.status } }
          assert:
            - "err == ERR_DUPLICATE_PLAN (409) — same (asset, 2027) window occupied by a DRAFT"
            - "Adjacent window FY2028 accepted: st2 == DRAFT (window identity, not date arithmetic)"
            - "Note on the two triggers: both carry the same fresh expected_asset_version because the first trigger FAILED and therefore did not bump Asset.version; the second create succeeds and bumps it"

      - name: capital_schedule_capacity_overlap_rejected
        grounds:
          - calculations.capital_schedule_capacity
          - errors[ERR_CAPITAL_SCHEDULE_OVER_COMMITTED]
        distinguishing_aspect: |
          Interval semantics = aggregate capacity over closed monthly intervals on resource
          (plan capital schedule) — distinct from sibling's window-identity: project Y's
          [4,5] overlaps project X's [3,6] at month 4 and their combined spend 4,500,000
          exceeds the 3,000,000 monthly cap; closed-interval treatment means touching
          endpoints (end == other's month) DO collide.
        test_recipe:
          setup:
            - "FY2027 plan APPROVED, CAPITAL 36,000,000 (monthly cap floor(36M/12) = 3,000,000)"
            - "Project X APPROVED 10,000,000 over months 3-6 (2,500,000 per month)"
            - "Project Y PROPOSED 4,000,000 over months 4-5 (2,000,000 per month)"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 11000000 }
                  - { category: PARKING_REVENUE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: OTHER_REVENUE, month_index: 1, budget_amount_cents: 100000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 200000 }
                  - { category: TAX_EXPENSE, month_index: 1, budget_amount_cents: 300000 }
                  - { category: INSURANCE_EXPENSE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: UTILITIES_EXPENSE, month_index: 1, budget_amount_cents: 80000 }
                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/business-plans/${pl1}/approve", payload: {}, as: PortfolioDirector }
            - { call: "POST /api/capital-projects", payload: { asset_id: "${a1}", plan_id: "${pl1}", name: "X", requested_amount_cents: 10000000, sched_start_month: 3, sched_end_month: 6 }, as: AssetManager, as_user_id: "am-1", captures: { cpx: $.data.id } }
            - { call: "GET /api/business-plans/${pl1}", payload: {}, as: Analyst, captures: { pl_v1: $.data.version } }
            - { call: "POST /api/capital-projects/${cpx}/approve", payload: { expected_plan_version: "${pl_v1}" }, as: InvestmentCommittee, as_user_id: "ic-1" }
            - { call: "POST /api/capital-projects", payload: { asset_id: "${a1}", plan_id: "${pl1}", name: "Y", requested_amount_cents: 4000000, sched_start_month: 4, sched_end_month: 5 }, as: AssetManager, as_user_id: "am-1", captures: { cpy: $.data.id } }
            - { call: "GET /api/business-plans/${pl1}", payload: {}, as: Analyst, captures: { pl_v2: $.data.version } }
          trigger:
            - { call: "POST /api/capital-projects/${cpy}/approve", payload: { expected_plan_version: "${pl_v2}" }, as: InvestmentCommittee, as_user_id: "ic-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CAPITAL_SCHEDULE_OVER_COMMITTED (409): month 4 committed 2,500,000 + 2,000,000 = 4,500,000 > cap 3,000,000"
            - "CapitalProject.${cpy}.status remains PROPOSED"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: capital_authorization_conserved_across_lifecycle
        grounds:
          - calculations.capital_availability
          - state_machines.CapitalProject.APPROVED_to_CANCELLED
          - state_machines.FundingDraw.APPROVED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity Q1 = plan capital authorization cents:
          total_capital_budget == available + reserved + drawn MUST hold after each of
          approve (26M/10M/0), draw release (26M/4M/6M), and cancel (30M/0/6M) — the
          compensating cancel exactly releases the undrawn reservation while drawn stays sunk.
        test_recipe:
          setup:
            - "FY2027 plan APPROVED, CAPITAL 36,000,000; project X APPROVED 10,000,000 (months 3-6)"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
                lines:
                  - { category: RENT_REVENUE, month_index: 1, budget_amount_cents: 11000000 }
                  - { category: PARKING_REVENUE, month_index: 1, budget_amount_cents: 500000 }
                  - { category: OTHER_REVENUE, month_index: 1, budget_amount_cents: 100000 }
                  - { category: CAM_EXPENSE, month_index: 1, budget_amount_cents: 200000 }
                  - { category: TAX_EXPENSE, month_index: 1, budget_amount_cents: 300000 }
                  - { category: INSURANCE_EXPENSE, month_index: 1, budget_amount_cents: 50000 }
                  - { category: UTILITIES_EXPENSE, month_index: 1, budget_amount_cents: 80000 }
                  - { category: MANAGEMENT_FEE_EXPENSE, month_index: 1, budget_amount_cents: 120000 }
                  - { category: OTHER_OPEX, month_index: 1, budget_amount_cents: 90000 }
                  - { category: CAPITAL, month_index: 1, budget_amount_cents: 36000000 }
              as: AssetManager
              as_user_id: "am-1"
            - { call: "POST /api/business-plans/${pl1}/submit", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/business-plans/${pl1}/approve", payload: {}, as: PortfolioDirector, captures: { avail0: $.data.available_capital_cents, res0: $.data.reserved_capital_cents, drn0: $.data.drawn_capital_cents } }
            - { call: "POST /api/capital-projects", payload: { asset_id: "${a1}", plan_id: "${pl1}", name: "X", requested_amount_cents: 10000000, sched_start_month: 3, sched_end_month: 6 }, as: AssetManager, as_user_id: "am-1", captures: { cpx: $.data.id } }
            - { call: "GET /api/business-plans/${pl1}", payload: {}, as: Analyst, captures: { pl_v: $.data.version } }
          trigger:
            - { call: "POST /api/capital-projects/${cpx}/approve", payload: { expected_plan_version: "${pl_v}" }, as: InvestmentCommittee, as_user_id: "ic-1" }
            - { call: "GET /api/business-plans/${pl1}", payload: {}, as: Analyst, captures: { avail1: $.data.available_capital_cents, res1: $.data.reserved_capital_cents, drn1: $.data.drawn_capital_cents } }
            - { call: "POST /api/funding-draws", payload: { project_id: "${cpx}", amount_cents: 6000000 }, as: AssetManager, as_user_id: "am-1", captures: { d1: $.data.id } }
            - { call: "POST /api/funding-draws/${d1}/approve", payload: {}, as: InvestmentCommittee, as_user_id: "ic-1" }
            - { call: "POST /api/funding-draws/${d1}/release", payload: {}, as: PortfolioDirector }
            - { call: "GET /api/business-plans/${pl1}", payload: {}, as: Analyst, captures: { avail2: $.data.available_capital_cents, res2: $.data.reserved_capital_cents, drn2: $.data.drawn_capital_cents } }
            - { call: "POST /api/capital-projects/${cpx}/start", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "POST /api/capital-projects/${cpx}/cancel", payload: {}, as: AssetManager, as_user_id: "am-1" }
            - { call: "GET /api/business-plans/${pl1}", payload: {}, as: Analyst, captures: { avail3: $.data.available_capital_cents, res3: $.data.reserved_capital_cents, drn3: $.data.drawn_capital_cents, tot3: $.data.total_capital_budget_cents } }
          assert:
            - "After approve: avail1 == 26000000, res1 == 10000000, drn1 == 0 (sum == 36000000)"
            - "After draw release: avail2 == 26000000, res2 == 4000000, drn2 == 6000000 (release shifts reserved -> drawn; available unchanged)"
            - "After cancel (compensating action): avail3 == 30000000, res3 == 0, drn3 == 6000000 (sunk), tot3 == 36000000 == avail3 + res3 + drn3 at every step"

      - name: reforecast_annual_total_conserved
        grounds:
          - calculations.reforecast_spread
          - entities.BudgetLine.fields.budget_amount_cents
        distinguishing_aspect: |
          Conserved quantity Q2 = per-category revised annual cents (distinct from sibling's
          capital authorization): after APPLIED, ytd actuals 33,000,000 + remaining-month
          budgets (8 x 11,111,111 + 11,111,112) == revised_annual 133,000,000 EXACTLY —
          the floor/remainder rounding must not drift the annual total by a cent.
        test_recipe:
          setup:
            - "FY2027 plan APPROVED: RENT 11,000,000/mo x12 + 9 singles; clock 2027-04-05 (month 4); actuals months 1-3 RENT 11,000,000 accepted"
            - "ReForecast R1 SUBMITTED with RENT_REVENUE revised 133,000,000 (others unchanged)"
          setup_api_calls:
            - { call: "POST /api/portfolios", payload: { name: "P1", fiscal_year_start_month: 1 }, as: PortfolioDirector, captures: { p1: $.data.id } }
            - { call: "POST /api/property-managers", payload: { firm_name: "PM Co", contact_email: "pm@x.com" }, as: PortfolioDirector, captures: { pm1: $.data.id } }
            - { call: "POST /api/assets", payload: { portfolio_id: "${p1}", property_manager_id: "${pm1}", name: "A1", address: "1 Main St", asset_class: "OFFICE", net_rentable_sqft: 100000, acquisition_price_cents: 800000000, acquisition_date: "2024-06-15", hold_period_years: 5 }, as: PortfolioDirector, captures: { a1: $.data.id, a1_v: $.data.version } }
            - { call: "POST /api/business-plans", payload: { asset_id: "${a1}", fiscal_year: 2027, expected_asset_version: "${a1_v}" }, as: AssetManager, as_user_id: "am-1", captures: { pl1: $.data.id } }
            - call: "POST /api/budget-lines"
              payload:
                plan_id: "${pl1}"
