  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: prorated_guarantee_equals_credited_hours_exactly_at_four_decimals
        grounds:
          - calculations.monthly_utilization_charge
          - entities.UtilizationPeriod.fields.mgh_effective_hours
          - entities.UtilizationPeriod.fields.credited_hours
          - entities.UtilizationPeriod.fields.shortfall_hours
          - entities.UtilizationPeriod.fields.overrun_hours
        distinguishing_aspect: |
          Exact equality at the guarantee, with both sides landing on the same 4-decimal value
          from different arithmetic: a term starting 2026-09-11 covers 20 of September's 30 days,
          so mgh_effective_hours = round(5 x 20 / 30, 4) = 3.3333, while a single 200-minute leg
          credits round(200 / 60, 4) = 3.3333. Because the shortfall branch is strict
          (credited < mgh), both shortfall_hours and overrun_hours must be 0.0000 and the charge
          must be exactly the base 1,599,984 = round(480000 x 3.3333). A >= branch, or 2-decimal
          rounding on either side, produces a non-zero shortfall credit or overrun.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "ACTIVE lease on G-ACMI: rate 480000, mgh 5, shortfall_credit_pct 0.60, term 2026-09-11..2026-12-31, so period 2026-09 is prorated over 20 of 30 days."
            - "One REVENUE leg on 2026-09-15 dispatched and completed with exactly 200 block minutes."
