            - "Inspection.${insp_id}.hazard_state == NONE"
            - "Establishment.${est_id}.license_status == PENDING_INSPECTION"
            - "GET /cosmetology/inspections?status=IN_PROGRESS returns total_count == 1"

      - name: state_machine_inspection_finalize_from_scheduled_rejected
        claim_type: invalid_transitions
        grounds:
          - state_machines.Inspection.status.transitions
          - validations.priority_38.ERR_INSPECTION_NOT_PENDING_REVIEW
        distinguishing_aspect: "finalize is not in the SCHEDULED row of the transition table, so the guard names the state finalize DOES require (PENDING_REVIEW) rather than the generic not-in-progress error, and no scores are written."
        test_recipe:
          setup:
            - "One establishment 'Premature Salon' with a SCHEDULED ROUTINE inspection that has never been started."
