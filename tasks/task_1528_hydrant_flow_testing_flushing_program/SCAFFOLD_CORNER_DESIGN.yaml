      - name: approve_budget_exceeded_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_WORK_ORDER_BUDGET_EXCEEDED]"]
        distinguishing_aspect: "With state valid (SUBMITTED) and parts available, the fiscal gate fires: quoted_total 25000 exceeds budget_cap_cents 20000 -> ERR_WORK_ORDER_BUDGET_EXCEEDED (422); no reservation happens."
        test_recipe:
          setup: ["Hydrant H; part P price 13158 on_hand 10; work order W (cap 20000) with line P x 2, SUBMITTED"]
          setup_api_calls:
            - { call: "POST /programs", payload: { program_year: 2026, season: "SPRING" }, as: ProgramAdmin, captures: { prog_id: $.data.id } }
            - { call: "POST /zones", payload: { name: "Z-North" }, as: ProgramAdmin, captures: { zone_id: $.data.id } }
            - { call: "POST /hydrants", payload: { hydrant_number: "H-100", program_id: "${prog_id}", zone_id: "${zone_id}", ownership: "MUNICIPAL", required_fire_flow_gpm: 1000 }, as: ProgramAdmin, captures: { h_id: $.data.id } }
            - { call: "POST /parts", payload: { sku: "VALVE-6", name: "6in gate valve", unit_price_cents: 13158, on_hand_qty: 10 }, as: ProgramAdmin, captures: { part_id: $.data.id } }
            - { call: "POST /work-orders", payload: { hydrant_id: "${h_id}", description: "Valve replacement", budget_cap_cents: 20000 }, as: FieldOperator, as_user_id: "op_1", captures: { wo_id: $.data.id } }
            - { call: "POST /work-orders/${wo_id}/part-lines", payload: { part_id: "${part_id}", qty: 2 }, as: FieldOperator, as_user_id: "op_1" }
            - { call: "POST /work-orders/${wo_id}/submit", as: FieldOperator, as_user_id: "op_1" }
