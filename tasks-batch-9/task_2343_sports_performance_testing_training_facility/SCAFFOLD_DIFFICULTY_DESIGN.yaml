  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: athlete_membership_and_clearance_dimensions_evolve_independently
        grounds:
          - state_machines.Athlete.membership_status.ACTIVE_to_SUSPENDED
          - state_machines.Athlete.membership_status.SUSPENDED_to_ACTIVE
          - state_machines.Athlete.training_clearance.CLEARED_to_MEDICAL_HOLD
          - entities.Athlete.fields.membership_status
          - entities.Athlete.fields.training_clearance
        distinguishing_aspect: |
          Parallel state dimensions on the Athlete row: membership_status and
          training_clearance advance on disjoint triggers, so after suspend + medical-hold +
          reinstate the combined state is (ACTIVE, MEDICAL_HOLD) — reinstating membership
          does not restore clearance, and placing a medical hold does not touch membership.
        test_recipe:
          setup:
            - "One StaffMember acting as Coach, credential_status COMPLIANT (insurance to 2027-12-31 plus one VALID CPR_AED certification)."
            - "One athlete born 2010-01-15 whose intake movement screen has been finalized, so membership_status == ACTIVE and training_clearance == CLEARED."
            - "The athlete has then been administratively suspended, and afterwards placed on medical hold."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rae Sandoval", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
            - call: "POST /certifications"
              payload: { staff_member_id: "${coach_id}", cert_code: "CPR_AED", issued_on: "2026-01-01", expires_on: "2027-12-31", ceu_credits_required: 6 }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Tariq Bello", date_of_birth: "2010-01-15", sport: "BASKETBALL", position: "GUARD", guardian_email: "parent.bello@example.com" }
              as: FrontDesk
              captures: { ath_id: $.data.id }
            - call: "POST /test-sessions"
              payload: { athlete_id: "${ath_id}", battery_type: "MOVEMENT_SCREEN" }
              as: Coach
              as_user_id: "${coach_id}"
              captures: { scr_id: $.data.id }
            - call: "POST /test-sessions/${scr_id}/results"
              payload: { results: [ { metric_code: "OH_SQUAT", value: 3, side: "BILATERAL" }, { metric_code: "HURDLE_STEP", value: 3, side: "BILATERAL" }, { metric_code: "INLINE_LUNGE", value: 3, side: "BILATERAL" }, { metric_code: "SL_HOP_L", value: 3, side: "LEFT" }, { metric_code: "SL_HOP_R", value: 3, side: "RIGHT" } ] }
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /test-sessions/${scr_id}/finalize"
              payload: {}
              as: Coach
              as_user_id: "${coach_id}"
            - call: "POST /athletes/${ath_id}/suspend"
              payload: { reason: "Unpaid balance review" }
              as: PerformanceDirector
            - call: "POST /athletes/${ath_id}/medical-hold"
              payload: { hold_reason: "Concussion protocol" }
              as: MedicalProvider
              as_user_id: "mp-1"
          trigger:
            - call: "POST /athletes/${ath_id}/reinstate"
              payload: {}
              as: PerformanceDirector
              captures: { ath_membership: $.data.membership_status, ath_clearance: $.data.training_clearance }
          assert:
            - "Athlete.${ath_id}.membership_status == ACTIVE"
            - "Athlete.${ath_id}.training_clearance == MEDICAL_HOLD"
            - "Athlete.${ath_id}.no_show_strikes == 0"
            - "Athlete.${ath_id}.injury_risk_score == 0.00"
            - "Athlete.${ath_id}.screen_count == 1"

      - name: rts_plan_cycles_back_to_stage_active_by_fail_then_by_pass
        grounds:
          - state_machines.ReturnToSportPlan.status.STAGE_ACTIVE_to_STAGE_TESTING
          - state_machines.ReturnToSportPlan.status.STAGE_TESTING_to_STAGE_ACTIVE
          - entities.ReturnToSportPlan.fields.current_stage
          - entities.ReturnToSportPlan.fields.stage_attempts
          - entities.ReturnToSportPlan.fields.total_failed_attempts
          - validations[priority=9]
        distinguishing_aspect: |
          A cycle on a different entity than instance 1: ReturnToSportPlan re-enters
          STAGE_ACTIVE twice by two different routes with divergent counter effects — a FAIL
          keeps current_stage at 1 while raising stage_attempts to 1 and
          total_failed_attempts to 1, whereas a PASS advances current_stage to 2 and resets
          stage_attempts to 0.
