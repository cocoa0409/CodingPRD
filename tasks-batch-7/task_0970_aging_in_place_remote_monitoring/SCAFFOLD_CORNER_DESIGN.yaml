  # ------------------------------------------------------------- endpoints
  - section: endpoints
    instances:
      - name: alerts_list_filtered_by_status_returns_subset
        claim_type: action_endpoint
        grounds: ["endpoints[GET /v1/alerts]", "response_envelope"]
        distinguishing_aspect: "Filter+list interaction: with one RESOLVED and one NOTIFYING alert, ?status=RESOLVED returns exactly the resolved one; unfiltered returns both."
        test_recipe:
          setup: ["ACTIVE senior with caregiver+contact; alert A1 raised+acked+resolved; alert A2 raised (NOTIFYING)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_lf: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Lf Senior", date_of_birth: "1940-01-01", address: "1 Lf St" }, as: PlatformAdmin, captures: { s_lf: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_lf}", plan_id: "${plan_lf}" }, as: PlatformAdmin, captures: { sub_lf: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_lf}" }, as: PlatformAdmin, captures: { kit_lf: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_lf}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_lf}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst LF", region: "R1" }, as: PlatformAdmin, captures: { inst_lf: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_lf}", kit_id: "${kit_lf}", installer_id: "${inst_lf}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_lf: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_lf}/confirm", payload: {}, as: Installer, as_user_id: "${inst_lf}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_lf}/complete", payload: {}, as: Installer, as_user_id: "${inst_lf}" }
            - { call: "POST /v1/subscriptions/${sub_lf}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_lf}", full_name: "Cg Lf", phone: "555-31" }, as: PlatformAdmin, captures: { cg_lf: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_lf}", caregiver_id: "${cg_lf}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 7200 }, as: PlatformAdmin }
            - { call: "POST /v1/alerts", payload: { senior_id: "${s_lf}", severity: "LOW" }, as: MonitoringAgent, captures: { al_lf1: $.data.id } }
            - { call: "POST /v1/alerts/${al_lf1}/acknowledge", payload: {}, as: Caregiver, as_user_id: "${cg_lf}" }
            - { call: "POST /v1/alerts/${al_lf1}/resolve", payload: {}, as: Caregiver, as_user_id: "${cg_lf}" }
            - { call: "POST /v1/alerts", payload: { senior_id: "${s_lf}", severity: "HIGH" }, as: MonitoringAgent, captures: { al_lf2: $.data.id } }
          trigger:
            - { call: "GET /v1/alerts", payload: { senior_id: "${s_lf}", status: "RESOLVED" }, as: PlatformAdmin }
            - { call: "GET /v1/alerts", payload: { senior_id: "${s_lf}" }, as: PlatformAdmin }
          assert:
            - "Filtered list returns exactly 1 row whose id == ${al_lf1}"
            - "Unfiltered list returns exactly 2 rows ordered by created_at ASC"
      - name: manual_alert_raise_immediately_notifies
        claim_type: action_endpoint
        grounds: ["endpoints[POST /v1/alerts]", "state_machines.Alert.RAISED_to_NOTIFYING"]
        distinguishing_aspect: "The create response itself shows the auto-transition: status NOTIFYING, escalation_level 1, and a level-1 SENT notification exists — immediate consistency in the same request."
        test_recipe:
          setup: ["ACTIVE senior with caregiver+contact entry rank 1"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 5, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_ma: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Ma Senior", date_of_birth: "1940-01-01", address: "1 Ma St" }, as: PlatformAdmin, captures: { s_ma: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_ma}", plan_id: "${plan_ma}" }, as: PlatformAdmin, captures: { sub_ma: $.data.id } }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_ma}" }, as: PlatformAdmin, captures: { kit_ma: $.data.id } }
            - { call: "POST /v1/sensor-kits/${kit_ma}/ship", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits/${kit_ma}/mark-delivered", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/installers", payload: { full_name: "Inst MA", region: "R1" }, as: PlatformAdmin, captures: { inst_ma: $.data.id } }
            - { call: "POST /v1/install-appointments", payload: { senior_id: "${s_ma}", kit_id: "${kit_ma}", installer_id: "${inst_ma}", window_start: "2026-05-01T09:00:00Z", window_end: "2026-05-01T10:00:00Z" }, as: PlatformAdmin, captures: { appt_ma: $.data.id } }
            - { call: "POST /v1/install-appointments/${appt_ma}/confirm", payload: {}, as: Installer, as_user_id: "${inst_ma}" }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:30:00Z" }, as: PlatformAdmin }
            - { call: "POST /v1/install-appointments/${appt_ma}/complete", payload: {}, as: Installer, as_user_id: "${inst_ma}" }
            - { call: "POST /v1/subscriptions/${sub_ma}/activate", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_ma}", full_name: "Cg Ma", phone: "555-32" }, as: PlatformAdmin, captures: { cg_ma: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_ma}", caregiver_id: "${cg_ma}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin }
          trigger:
            - { call: "POST /v1/alerts", payload: { senior_id: "${s_ma}", severity: "HIGH", note: "smell of smoke" }, as: MonitoringAgent, captures: { al_ma: $.data.id, al_ma_st: $.data.status, al_ma_lvl: $.data.escalation_level } }
          assert:
            - "al_ma_st == 'NOTIFYING' and al_ma_lvl == 1"
            - "GET /v1/alert-notifications?alert_id=${al_ma} returns exactly 1 row level 1 status SENT for ${cg_ma}"
      - name: contact_tree_delete_removes_and_preserves_ranks
        claim_type: standard_crud
        grounds: ["endpoints[DELETE /v1/contact-tree-entries/{entry_id}]", "entities.ContactTreeEntry.fields.status"]
        distinguishing_aspect: "DELETE marks the entry REMOVED (soft state, still queryable) and does NOT renumber remaining ACTIVE ranks — freeing max_contacts capacity for a new entry."
        test_recipe:
          setup: ["Plan max_contacts 2; ACTIVE senior with two contact entries ranks 1 and 2"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "PLUS", monthly_fee_cents: 6000, included_motion_sensors: 2, extra_sensor_fee_cents: 199, max_contacts: 2, checkin_interval_hours: 48, medication_reminders_enabled: true, wellness_report_enabled: true, wellness_report_cadence: "MONTHLY" }, as: PlatformAdmin, captures: { plan_ct: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Ct Senior", date_of_birth: "1940-01-01", address: "1 Ct St" }, as: PlatformAdmin, captures: { s_ct: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_ct}", plan_id: "${plan_ct}" }, as: PlatformAdmin }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_ct}", full_name: "Cg C1", phone: "555-41" }, as: PlatformAdmin, captures: { cg_c1: $.data.id } }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_ct}", full_name: "Cg C2", phone: "555-42" }, as: PlatformAdmin, captures: { cg_c2: $.data.id } }
            - { call: "POST /v1/caregivers", payload: { senior_id: "${s_ct}", full_name: "Cg C3", phone: "555-43" }, as: PlatformAdmin, captures: { cg_c3: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_ct}", caregiver_id: "${cg_c1}", priority_rank: 1, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin, captures: { cte_c1: $.data.id } }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_ct}", caregiver_id: "${cg_c2}", priority_rank: 2, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin }
          trigger:
            - { call: "DELETE /v1/contact-tree-entries/${cte_c1}", payload: {}, as: PlatformAdmin }
            - { call: "POST /v1/contact-tree-entries", payload: { senior_id: "${s_ct}", caregiver_id: "${cg_c3}", priority_rank: 3, min_severity: "LOW", response_timeout_seconds: 3600 }, as: PlatformAdmin, captures: { cte_c3: $.data.id } }
          assert:
            - "GET /v1/contact-tree-entries/${cte_c1} shows status REMOVED (soft-deleted, still queryable)"
            - "The rank-2 entry is unchanged (no renumbering)"
            - "cte_c3 created at rank 3 — the REMOVED entry no longer counts against max_contacts 2"

  # ------------------------------------------------------------- errors
  - section: errors
    instances:
      - name: seniors_list_missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers fails at priority 1 with ERR_UNAUTHENTICATED (401) before any role or schema check."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /v1/seniors", payload: {}, as: PlatformAdmin, captures: { err: $.data.error_id } }
          assert:
            - "Request is sent WITHOUT the X-User-Role and X-User-ID headers; err == 'ERR_UNAUTHENTICATED' (HTTP 401)"
      - name: telemetry_with_future_observed_at_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_REQUEST]", "endpoints[POST /v1/telemetry]"]
        distinguishing_aspect: "observed_at after the current logical clock is a schema-level rejection (ERR_INVALID_REQUEST 400) — the clock default 2026-05-01T00:00:00Z makes this deterministic."
        test_recipe:
          setup: ["Senior with kit (device PROVISIONED)"]
          setup_api_calls:
            - { call: "POST /v1/subscription-plans", payload: { tier: "ESSENTIAL", monthly_fee_cents: 3000, included_motion_sensors: 1, extra_sensor_fee_cents: 99, max_contacts: 3, checkin_interval_hours: 72, medication_reminders_enabled: false, wellness_report_enabled: false, wellness_report_cadence: "NONE" }, as: PlatformAdmin, captures: { plan_tf: $.data.id } }
            - { call: "POST /v1/seniors", payload: { full_name: "Tf Senior", date_of_birth: "1940-01-01", address: "1 Tf St" }, as: PlatformAdmin, captures: { s_tf: $.data.id } }
            - { call: "POST /v1/subscriptions", payload: { senior_id: "${s_tf}", plan_id: "${plan_tf}" }, as: PlatformAdmin }
            - { call: "POST /v1/sensor-kits", payload: { senior_id: "${s_tf}" }, as: PlatformAdmin, captures: { kit_tf: $.data.id } }
            - { call: "GET /v1/devices", payload: { kit_id: "${kit_tf}" }, as: PlatformAdmin, captures: { dev_tf: "$.data[0].id" } }
