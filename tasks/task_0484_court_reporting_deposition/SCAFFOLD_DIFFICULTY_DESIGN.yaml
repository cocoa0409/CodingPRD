              as: ScheduleCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /resources"
              payload: { full_name: "Rep DD", kind: "REPORTER", certifications: ["CSR_CA"], hourly_appearance_cents: 10000 }
              as: ScheduleCoordinator
              captures: { rep_id: $.data.id }
            - call: "POST /jobs"
              payload: { case_id: "${case_id}", deponent_name: "Witness W3", scheduled_start: "2026-06-13T09:00:00Z", scheduled_end: "2026-06-13T11:00:00Z" }
              as: ScheduleCoordinator
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /jobs/${job_id}/assignments"
              payload: { resource_id: "${rep_id}", role: "REPORTER", expected_job_version: "${job_v0}" }
              as: ScheduleCoordinator
            - call: "GET /jobs/${job_id}"
              payload: {}
              as: ScheduleCoordinator
              captures: { job_v1: $.data.version }
            - call: "POST /jobs/${job_id}/confirm"
              payload: { expected_job_version: "${job_v1}" }
              as: ScheduleCoordinator
          trigger:
            - call: "POST /transcript-orders"
              payload: { job_id: "${job_id}", ordering_attorney_id: "${att_id}", turnaround_tier: "STANDARD", certified_copy: true, estimated_pages: 30 }
              as: Attorney
              as_user_id: "${att_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_JOB_NOT_ADJOURNED"

      - name: rough_deliver_requires_reporter_completed_assignment
        grounds:
          - state_machines.TranscriptOrder.ORDERED_to_ROUGH_DELIVERED
          - entities.Assignment.fields.status
          - entities.Resource.fields.kind
        distinguishing_aspect: |
          deliver-rough (TranscriptOrder transition) requires the acting Reporter to have a
          COMPLETED REPORTER Assignment on the transcript's job; a reporter with no completed
          assignment on that job is rejected. The dependency crosses the
          TranscriptOrder->Assignment/Resource pair, a different pair than TranscriptOrder->Job.
        test_recipe:
          setup:
            - "An adjourned job whose reporter (Rep EE) has a COMPLETED assignment; a DIFFERENT reporter (Rep FF) never assigned to the job exists; a transcript order is ORDERED."
          setup_api_calls:
            - call: "POST /attorneys"
