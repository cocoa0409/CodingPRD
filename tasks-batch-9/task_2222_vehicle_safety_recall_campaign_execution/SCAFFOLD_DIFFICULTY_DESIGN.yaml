      - name: obligation_cents_conserved_when_claim_reversal_leaves_owner_reimbursement_intact
        grounds:
          - calculations.obligation_conservation_invariant
          - calculations.owner_reimbursement_amount
          - calculations.claim_reimbursement
          - state_machines.OwnerReimbursementRequest.SUBMITTED_to_APPROVED
          - entities.RecallCampaign.fields.reimbursement_obligation_cents
        distinguishing_aspect: |
          A different conserved quantity - money in cents rather than parts units: the ledger holds
          46996 cents (18980 dealer claim + 28016 owner reimbursement) and the claim reversal
          subtracts exactly the stored final_amount_cents 18980, leaving 28016 with the owner
          reimbursement untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T09:00:00Z; campaign 26V-101 with the defect notice filed 2026-08-03 (timely)."
            - "An interim advisory set do_not_drive true; the remedy was then released on 2026-08-03, so remedy_status is REMEDY_RELEASED, do_not_drive_flag stays true and campaign_status is INTERIM_NOTIFIED."
            - "Two labor operations exist: R101-01 flat_hours 1.10 effective 2026-08-01..2027-12-31 and the historic R101-00 flat_hours 1.30 effective 2025-01-01..2026-07-31."
            - "One NE vehicle is in the population; dealer D-NE-01 (rate 138.74) holds a 1-unit ALLOCATED allocation."
            - "A dealer claim for 2026-08-03 was approved for 18980 cents and an owner reimbursement for the 2026-07-15 invoice was approved for 28016 cents, so reimbursement_obligation_cents is 46996."
