            - "cost_both == 2880.0 + 2880.0 == 5760.0"
            - "after voiding the second ticket, cost_after_void == 2880.0 — the voided row is excluded, not zeroed in place"
            - "ProteinTicket.${pt1}.cost_cents is still 2880.0 and its status is still POSTED"
            - "the chef who issued the voided ticket has that ticket dropped from pounds_protein_issued, so the two chefs no longer report the same figure"

      - name: seat_surcharge_rounds_per_reservation_never_per_guest
        claim_type: Constants Applied
        grounds:
