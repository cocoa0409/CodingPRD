              captures: { ag_cap_equal_id: $.data.id }
            - call: "POST /wind-ops/service-agreements"
              payload: { wind_farm_id: "${farm_id}", guaranteed_availability_pct: 99.0, availability_basis: "TIME_BASED", lda_rate_cents_per_pct_point: 1000000, lda_cap_cents: 666699, period_start_utc: "2026-06-01T00:00:00Z", period_end_utc: "2026-07-01T00:00:00Z" }
              as: CommercialManager
