  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_issue_then_void_restores_net_surcharge_ledger
        grounds:
          - calculations.merchant_surcharge_ledger
          - state_machines.RemediationRefund.PENDING_to_ISSUED
          - state_machines.RemediationRefund.ISSUED_to_VOIDED
          - entities.Merchant.fields.net_surcharge_collected_cents
          - entities.Merchant.fields.gross_surcharge_collected_cents
          - entities.Transaction.fields.refunded_surcharge_cents
          - entities.ComplaintCase.fields.refund_total_cents
          - endpoints[GET /surcharge-programs/{id}/settlement-summary]
        distinguishing_aspect: |
          The conserved quantity is MONEY across four derived fields: issuing a 219-cent refund moves
          net_surcharge_collected_cents 219 -> 0, Transaction.refunded_surcharge_cents 0 -> 219 and
          ComplaintCase.refund_total_cents 0 -> 219 while gross_surcharge_collected_cents stays 219, and voiding
          the ISSUED refund restores every one of those to its pre-issue value with gross still never having moved.
        test_recipe:
          setup:
            - "Jurisdiction AZ, one merchant with docA (documented_cost_pct 2.1900), one ACTIVE SURCHARGE program with a VISA/ALL rate rule at 2.19 percent, one ENFORCING terminal; clock 2026-08-31T00:00:00Z."
            - "One captured sale of base_amount_cents 10000 -> surcharge_amount_cents 219 (round_half_up(10000 * 2.19 / 100)), so gross == net == 219 before the refund."
            - "One CARDHOLDER ComplaintCase on that program driven to investigation_state SUBSTANTIATED and remediation_state PLAN_ACCEPTED; a CARDHOLDER case scores 20 * 1.0 == 20.00 under NETWORK_METHOD, below REMEDIATION_EXPOSURE_THRESHOLD 30, so the program stays ACTIVE and no quarantine cascade perturbs the ledger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
