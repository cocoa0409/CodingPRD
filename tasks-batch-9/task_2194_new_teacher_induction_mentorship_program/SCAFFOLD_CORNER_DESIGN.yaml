      - name: novice_enrolment_blocked_by_closed_site
        claim_type: cross_entity_validation
        grounds: ["validations[priority=9]", "errors[ERR_SITE_CLOSED]", "endpoints[POST /sites/{id}/close]"]
        distinguishing_aspect: "Validity of a novice creation depends on a different entity's state: the identical request body succeeds against an OPEN site and fails against a CLOSED one, so both halves of the cross-entity gate are pinned in one instance."
        test_recipe:
          setup: ["Two sites exist — NG-001 is OPEN and SB-002 has been closed with a reason, so its status is CLOSED. Cohort NORTH-2026 is FORMING. The logical clock is at its startup default 2026-08-01T00:00:00Z."]
