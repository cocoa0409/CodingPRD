              as: Underwriter
            - call: "POST /inland-marine/coverage-parts/${cp}/equipment-items"
              payload: { description: "Bad Ownership Machine", equipment_type: "EXCAVATOR", model_year: 2022, original_cost_cents: 12000000, ownership: "BORROWED", expected_policy_version: "${pol_v2}" }
              as: Underwriter
            - call: "POST /inland-marine/policies/${pol}/claims"
              payload: { coverage_part_id: "${cp}", loss_date: "2026-08-01", loss_type: "THEFT", equipment_item_id: "${it1}", installation_floater_id: "${fl}" }
              as: Underwriter
          assert:
            - "every trigger returns HTTP status == 400 with error_id == ERR_INVALID_REQUEST"
            - "trigger[0]: model_year must be an integer, so a string value is a shape defect caught before any rate cell is selected"
            - "re-issuing trigger[0] with the required field equipment_type DELETED from the body also returns 400 ERR_INVALID_REQUEST (missing required field is the same priority 35 rule)"
            - "trigger[1]: expiration_date > effective_date is a shape rule, so the inverted term never reaches term_days computation and no Policy row is created"
            - "trigger[2]: original_cost_cents >= 0 is a shape rule, checked before any rate cell is selected"
            - "trigger[3]: BORROWED is not a declared member of the ownership enum {OWNED, RENTED, LEASED}"
            - "trigger[4]: a claim must name EXACTLY ONE loss subject; both ids resolve, so the defect is the arity and not existence, and 400 beats the 404 family here because priority 35 is evaluated after 30-34 only for ids that were actually looked up"
