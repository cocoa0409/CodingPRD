        as: AssetManager
        as_user_id: am-portfolio-1
        captures:
          ctr: $.data.id
      - call: POST /tenants
        payload:
          legal_name: Boxmart Retail Inc
          notice_email: legal@boxmart.example
          primary_use_code: DISCOUNT_DEPT
          is_national_chain: true
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
