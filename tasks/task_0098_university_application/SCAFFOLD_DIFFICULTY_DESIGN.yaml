scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: financial_aid_award_federal_vs_institutional
        grounds:
          - calculations.financial_aid_award
          - entities.FinancialAidPackage.fields.aid_method
          - entities.Applicant.fields.fafsa_efc_cents
          - entities.Applicant.fields.css_profile_efc_cents
          - state_machines.FinancialAidPackage.REQUESTED_to_OFFERED
        distinguishing_aspect: |
          Operates on the FinancialAidPackage entity domain (need-based aid waterfall).
          Same Applicant + same cost_of_attendance_cents produce different
          (grant_cents, loan_cents, work_study_cents) tuples under FEDERAL_METHODOLOGY
          versus INSTITUTIONAL_METHODOLOGY because EFC source and waterfall priority differ.
        test_recipe:
          setup:
            - "Create University U, Program P (capacity 1) under U."
            - "Create Applicant A with fafsa_efc_cents=2000000 (= $20,000) and css_profile_efc_cents=2000000."
            - "Create two Applications APP_FED and APP_INST for A on P (round=REGULAR_DECISION). Bring both to ADMITTED via submit -> begin-review -> decide(ADMIT). (Use two applicants if Program.capacity=1 is too tight: create A2 with identical EFCs.)"
            - "Create FinancialAidPackage F1 on APP_FED with aid_method=FEDERAL_METHODOLOGY, cost_of_attendance_cents=8000000."
            - "Create FinancialAidPackage F2 on APP_INST with aid_method=INSTITUTIONAL_METHODOLOGY, cost_of_attendance_cents=8000000."
          trigger:
            - "POST /financial-aid/{F1.id}/issue-offer (FinancialAidOfficer)"
            - "POST /financial-aid/{F2.id}/issue-offer (FinancialAidOfficer)"
          assert:
            - "F1.grant_cents == 5200000"
            - "F1.loan_cents == 550000"
            - "F1.work_study_cents == 250000"
            - "F1.total_award_cents == 6000000"
            - "F2.grant_cents == 4200000"
            - "F2.loan_cents == 350000"
            - "F2.work_study_cents == 1450000"
            - "F2.total_award_cents == 6000000"
            - "F1.grant_cents != F2.grant_cents"

      - name: essay_customization_provisional_vs_final
        grounds:
          - calculations.essay_customization_score
          - entities.EssaySubmission.fields.customization_score
          - entities.Application.fields.status
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Operates on the EssaySubmission entity domain (essay scoring), structurally
          different from FinancialAidPackage. Same essay body yields a higher
          customization_score under the DRAFT-variant weighting than under the
          SUBMITTED-variant weighting because the SUBMITTED variant raises the length
          divisor (500 -> 650) and reweights prompt match (0.20 -> 0.30).
        test_recipe:
          setup:
            - "Create University U (name='Northstar'), Program P (name='Computer Science') under U, Applicant A."
            - "Create Application APP for A on P (round=REGULAR_DECISION). It is in DRAFT."
            - "POST /applications/{APP.id}/essays with prompt_code=<U-prefixed code>, body of exactly 500 whitespace tokens that mentions 'Northstar' twice and 'Computer Science' twice."
            - "Read EssaySubmission.customization_score while APP.status=DRAFT (call it score_provisional)."
            - "Bring APP to SUBMITTED by satisfying recommendation + deadline preconditions (create 2 RecommendationRequests, accept and submit-letter on each with letter_word_count >= 200)."
          trigger:
            - "GET /essays/{essay.id} after APP.status becomes SUBMITTED (server recomputes customization_score under the FINAL variant on read or on submit)."
          assert:
            - "score_provisional == 1.00"
            - "EssaySubmission.customization_score after submit == 0.92"
            - "score_provisional != EssaySubmission.customization_score (different result, identical inputs)"


  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      # Mode (a): formula with >=3 inputs and non-linear interaction
      - name: yield_offer_batch_size_nonlinear_threshold
        grounds:
          - calculations.yield_offer_batch_size
          - endpoints.POST_/universities/{id}/yield-sweep
          - entities.University.fields.yield_target_count
          - entities.University.fields.enrolled_count
          - entities.Program.fields.capacity
          - entities.Program.fields.admitted_count
        distinguishing_aspect: |
          Mode (a): five inputs (yield_target_count, enrolled_count, admitted_open,
          MELT_RATE_CONSTANT, MAX_BATCH_PER_SWEEP) combine non-linearly through
          nested min/max(min(raw_batch, capacity_cap, MAX_BATCH_PER_SWEEP)) with a
          conditional rounding of expected_melt; output is not monotone in any single
          input alone.
        test_recipe:
          setup:
            - "Create University U with yield_target_count=100."
            - "Create Programs P1 (capacity=5) and P2 (capacity=5) under U."
            - "Bring U.enrolled_count to 80 by enrolling 80 Applicants across P1 and P2 collectively (capacities adjusted by registering programs with capacity=80 first, then resetting via test fixture; OR seed via PlatformAdmin-only fixture path). After enrollment, set P1.admitted_count=8 so P1.capacity must be 8; configure P2.admitted_count=2, capacity=4 such that admitted_open across U == 2 (P2 has 2 open slots, P1 has 0 since admitted_count==capacity)."
            - "Create 5 WaitlistEntries on P2 in ACTIVE state with distinct rank_scores."
          trigger:
            - "POST /universities/{U.id}/yield-sweep (PlatformAdmin)"
          assert:
            - "YieldSweep.offers_extended == 2"
            - "Top-2 ACTIVE WaitlistEntries (by rank_score DESC, created_at ASC tie-break) for P2 transitioned ACTIVE -> OFFERED"
            - "The 3rd-ranked WaitlistEntry remains ACTIVE (capacity cap binds before MAX_BATCH_PER_SWEEP)"

      # Mode (b): nested rounding where order matters — pinned
      - name: waitlist_rank_score_pinned_round_order
        grounds:
          - calculations.waitlist_rank_score
          - entities.WaitlistEntry.fields.rank_score
          - state_machines.WaitlistEntry.ACTIVE_to_OFFERED
        distinguishing_aspect: |
          Mode (b): each of four components is round_half_up to 2 decimals individually,
          then the sum is round_half_up once more. Computing as a single expression
          round_half_up(gpa/4*40 + cs*30 + ..., 2) — i.e. "sum then round" — produces
          different cents at half-up boundary inputs. The scaffold PINS per-component-then-sum.
        test_recipe:
          setup:
            - "Create University U, Program P, Applicant A (high_school_gpa=3.80)."
            - "Create Application APP for A on P (round=REGULAR_DECISION). Bring to WAITLISTED."
            - "EssaySubmission on APP has customization_score == 0.90 (use a body crafted to score 0.90 under the FINAL variant — or seed essays.customization_score=0.90 in the test fixture)."
            - "Advance the clock so days_on_waitlist == 10 from WaitlistEntry.created_at."
            - "A has demonstrated_interest == 2 (one additional Application by A to another Program at U in SUBMITTED state)."
          trigger:
            - "GET /waitlist/{w.id} (rank_score is computed on entry create and on each yield-sweep; read here)."
          assert:
            - "WaitlistEntry.rank_score == 80.00"
            - "gpa_component evaluated as 38.00, essay_component 27.00, tenure_component 5.00, interest_component 10.00 (each per-component round_half_up applied) — assert by reading server-derived component fields if exposed, or assert final 80.00 with documented expected derivation."


  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: application_cyclic_submit_withdraw_loop
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.Application.SUBMITTED_to_DRAFT
        distinguishing_aspect: |
          Cyclic shape on Application entity: DRAFT -> SUBMITTED -> DRAFT is reachable
          (revision loop via /withdraw-submission). Distinct from a linear pipeline.
        test_recipe:
          setup:
            - "Create University U with future regular_decision_deadline."
            - "Create Program P, Applicant A, Application APP (round=REGULAR_DECISION)."
            - "Attach essay scoring >= 0.30; create 2 RecommendationRequests; accept and submit-letter on each with letter_word_count >= 200."
          trigger:
            - "POST /applications/{APP.id}/submit (Applicant) -> APP.status becomes SUBMITTED"
            - "POST /applications/{APP.id}/withdraw-submission (Applicant) -> APP.status becomes DRAFT"
            - "POST /applications/{APP.id}/submit again -> APP.status becomes SUBMITTED"
          assert:
            - "After three transitions APP.status == SUBMITTED"
            - "APP.version >= 4 (initial + 3 mutations)"
            - "APP.submitted_at refers to the SECOND submission timestamp (not the first)"

      - name: waitlist_cyclic_offer_expire_reactivate
        grounds:
          - state_machines.WaitlistEntry.ACTIVE_to_OFFERED
          - state_machines.WaitlistEntry.OFFERED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic shape on a different entity (WaitlistEntry, not Application):
          ACTIVE -> OFFERED -> ACTIVE on offer expiry. The same row revisits ACTIVE
          and is eligible for promotion in a subsequent sweep.
        test_recipe:
          setup:
            - "Create University U, Program P with admitted_count strictly < capacity."
            - "Create Application APP in WAITLISTED state with a WaitlistEntry W in ACTIVE."
          trigger:
            - "POST /universities/{U.id}/yield-sweep -> W transitions ACTIVE -> OFFERED"
            - "POST /_clock/advance with seconds = 8 * 86400 (8 days, past 7-day offer expiry)"
            - "POST /universities/{U.id}/yield-sweep -> W transitions OFFERED -> ACTIVE (auto-expire) then potentially ACTIVE -> OFFERED again in the same sweep"
          assert:
            - "After both sweeps W.status in {ACTIVE, OFFERED}"
            - "W has had at least one OFFERED -> ACTIVE transition recorded (offered_at and offer_expires_at were cleared at least once)"
            - "W.version increased by at least 2 between the two sweeps"


  # ===========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: enroll_cascades_to_siblings_waitlists_aid
        grounds:
          - state_machines.Application.ADMITTED_to_ENROLLED
          - state_machines.WaitlistEntry.ACTIVE_to_RELEASED
          - state_machines.WaitlistEntry.OFFERED_to_RELEASED
          - state_machines.FinancialAidPackage.OFFERED_to_REVOKED
        distinguishing_aspect: |
          Depth 3 cascade from Application.enroll: hop 1 enroll mutates THIS Application
          (ADMITTED -> ENROLLED); hop 2 the enroll-induced mutation auto-withdraws every
          SIBLING Application of the same Applicant (each sibling's transition to WITHDRAWN
          is caused by the enroll mutation); hop 3 each sibling's WITHDRAWN transition itself
          causes its child WaitlistEntry to RELEASED and child FinancialAidPackage to REVOKED.
          Each link is caused by the previous link (sibling withdraw causes child release/revoke),
          not by the original enroll directly.
        test_recipe:
          setup:
            - "Create University U1 and U2, Programs P1 under U1 and P2 under U2."
            - "Create Applicant A. Create Applications APP1 on P1 (round=REGULAR_DECISION) and APP2 on P2 (round=REGULAR_DECISION)."
            - "Bring both to ADMITTED. On APP2 create FinancialAidPackage F2 (OFFERED). Also create a WaitlistEntry W2 on a different program (e.g. on P2: actually attach W2 to a third Application APP3 by A in WAITLISTED status on P3 to make depth-3 chain explicit)."
            - "Refined setup: A has APP1=ADMITTED, APP2=ADMITTED with F2 OFFERED, APP3=WAITLISTED with WaitlistEntry W3 ACTIVE."
          trigger:
            - "POST /applications/{APP1.id}/enroll (Applicant)"
          assert:
            - "APP1.status == ENROLLED"
            - "APP2.status == WITHDRAWN (hop 2, caused by APP1.enroll)"
            - "APP3.status == WITHDRAWN (hop 2, caused by APP1.enroll)"
            - "F2.status == REVOKED (hop 3, caused by APP2 transitioning to WITHDRAWN)"
            - "W3.status == RELEASED (hop 3, caused by APP3 transitioning to WITHDRAWN)"
            - "University.enrolled_count incremented by exactly 1 (only APP1)"

      - name: ed_admit_cascades_to_other_apps_and_aid
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_ADMITTED
          - state_machines.Application.DRAFT_to_WITHDRAWN
          - state_machines.Application.SUBMITTED_to_WITHDRAWN
          - state_machines.FinancialAidPackage.REQUESTED_to_REVOKED
        distinguishing_aspect: |
          Depth 2 cascade from a DIFFERENT trigger (decide(ADMIT) on an ED Application,
          not enroll). Hop 1: the ED Application transitions UNDER_REVIEW -> ADMITTED.
          Hop 2 (caused by hop 1): every other Application of this Applicant currently
          in DRAFT or SUBMITTED transitions to WITHDRAWN; for each such withdrawn
          Application with a FinancialAidPackage in REQUESTED, that package transitions
          to REVOKED (hop 2 chain: ED-admit mutates ED-app, which mutates sibling app, which
          causes child aid to revoke — but the spec frames the sibling-withdraw and aid-revoke
          as the two hops, with the second being caused by the first).
        test_recipe:
          setup:
            - "Create University U1 and U2, Programs P1 (U1) and P2 (U2)."
            - "Create Applicant A. Create APP_ED on P1 (round=EARLY_DECISION) and APP_RD on P2 (round=REGULAR_DECISION)."
            - "APP_ED submitted -> UNDER_REVIEW (begin-review by AdmissionsOfficer of U1). APP_RD in SUBMITTED state."
            - "Create FinancialAidPackage F_RD on APP_RD in REQUESTED status."
          trigger:
            - "POST /applications/{APP_ED.id}/decide with decision=ADMIT (AdmissionsOfficer of U1)"
          assert:
            - "APP_ED.status == ADMITTED"
            - "APP_RD.status == WITHDRAWN (hop 2 caused by ED ADMIT cascade)"
            - "F_RD.status == REVOKED (caused by APP_RD transition, which itself was caused by APP_ED ADMIT)"


  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_fiscal_on_admit
        grounds:
          - validations[priority=30]
          - validations[priority=60]
          - state_machines.Application.UNDER_REVIEW_to_ADMITTED
        distinguishing_aspect: |
          Category pair: (state) ERR_INVALID_STATE vs (business_fiscal) ERR_PROGRAM_AT_CAPACITY.
          When AdmissionsOfficer calls decide(ADMIT) on an Application that is BOTH not in
          UNDER_REVIEW AND whose program is at capacity, ERR_INVALID_STATE wins (priority 30 < 60).
        test_recipe:
          setup:
            - "Create University U, Program P with capacity=1 and admitted_count=1 (already at capacity from another applicant)."
            - "Create Application APP in SUBMITTED state (NOT UNDER_REVIEW)."
          trigger:
            - "POST /applications/{APP.id}/decide with decision=ADMIT (AdmissionsOfficer)"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_INVALID_STATE'"
            - "Response data.error_id != 'ERR_PROGRAM_AT_CAPACITY'"

      - name: business_safety_vs_business_referential_on_ed_submit
        grounds:
          - validations[priority=40]
          - validations[priority=51]
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Category pair: (business_safety) ERR_ED_ALREADY_BOUND vs (business_referential)
          ERR_INSUFFICIENT_RECOMMENDATIONS. When submitting an ED Application that BOTH
          conflicts with an existing ED commitment AND lacks enough SUBMITTED recommendations,
          ERR_ED_ALREADY_BOUND wins (priority 40 < 51). Different category pair than the
          first instance.
        test_recipe:
          setup:
            - "Create University U1 with future early_decision_deadline."
            - "Create Programs P_A and P_B under U1."
            - "Create Applicant A. Create APP1 (EARLY_DECISION on P_A) with full requirements satisfied; submit it -> APP1 SUBMITTED, A.ed_commitment_application_id = APP1.id."
            - "Create APP2 (EARLY_DECISION on P_B) in DRAFT with ZERO SUBMITTED recommendations and an essay scoring >= 0.30."
          trigger:
            - "POST /applications/{APP2.id}/submit (Applicant)"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_ED_ALREADY_BOUND'"
            - "Response data.error_id != 'ERR_INSUFFICIENT_RECOMMENDATIONS'"


  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: essay_customization_at_exact_threshold
        grounds:
          - validations[priority=50]
          - calculations.essay_customization_score
          - endpoints.POST_/applications/{id}/submit
        distinguishing_aspect: |
          Numeric metric: customization_score. The threshold is >= 0.30 (inclusive).
          customization_score == 0.30 is ACCEPTED; customization_score == 0.29 is rejected
          with ERR_ESSAY_NOT_CUSTOMIZED. Reachable through POST /applications/{id}/submit.
        test_recipe:
          setup:
            - "Create University U, Program P, Applicant A, Application APP. Satisfy recommendations precondition."
            - "Craft (or seed) the linked EssaySubmission to have customization_score == 0.30 exactly."
          trigger:
            - "POST /applications/{APP.id}/submit (Applicant)"
          assert:
            - "Response HTTP status == 200"
            - "APP.status == 'SUBMITTED'"
            - "Then PATCH /essays/{essay.id} via withdraw-submission flow to bring score to 0.29; POST /applications/{APP.id}/submit returns 422 with data.error_id == 'ERR_ESSAY_NOT_CUSTOMIZED'."

      - name: zero_recommendations_required_count_mismatch
        grounds:
          - validations[priority=51]
          - entities.Application.fields.required_recommendation_count
          - endpoints.POST_/applications/{id}/submit
        distinguishing_aspect: |
          Edge case on a different metric (count of SUBMITTED RecommendationRequests vs
          required_recommendation_count) — empty-set boundary. When required=2 and
          submitted=2 the submit succeeds; when submitted=1 the submit fails with
          ERR_INSUFFICIENT_RECOMMENDATIONS. Reachable through a different endpoint
          flow than the score threshold (recommendation submission path).
        test_recipe:
          setup:
            - "Create University U, Program P, Applicant A, Application APP with required_recommendation_count=2."
            - "Attach EssaySubmission with customization_score >= 0.30."
            - "Create 2 RecommendationRequests R1, R2. Accept and submit-letter on R1 with letter_word_count >= 200. Accept R2 but DO NOT submit-letter yet."
          trigger:
            - "POST /applications/{APP.id}/submit (Applicant)  # submitted count == 1, required == 2"
          assert:
            - "Response HTTP status == 422"
            - "Response data.error_id == 'ERR_INSUFFICIENT_RECOMMENDATIONS'"
            - "POST /recommendations/{R2.id}/submit-letter with letter_word_count >= 200; then POST /applications/{APP.id}/submit returns 200 and APP.status == 'SUBMITTED'."


  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: financial_aid_offer_requires_admitted_application
        grounds:
          - state_machines.FinancialAidPackage.REQUESTED_to_OFFERED
          - entities.Application.fields.status
          - validations[priority=30]
        distinguishing_aspect: |
          Entity pair: FinancialAidPackage -> Application. FinancialAidPackage transition
          REQUESTED -> OFFERED is rejected unless the linked Application.status == ADMITTED.
          Officer cannot issue an offer on an aid package whose application is still in
          UNDER_REVIEW or SUBMITTED.
        test_recipe:
          setup:
            - "Create University U, Program P, Applicant A with fafsa_efc_cents set, Application APP in UNDER_REVIEW state."
            - "Create FinancialAidPackage F on APP with aid_method=FEDERAL_METHODOLOGY in REQUESTED."
          trigger:
            - "POST /financial-aid/{F.id}/issue-offer (FinancialAidOfficer)  # APP not yet ADMITTED"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_INVALID_STATE'"
            - "F.status == 'REQUESTED' (unchanged)"
            - "Then POST /applications/{APP.id}/decide with decision=ADMIT; POST /financial-aid/{F.id}/issue-offer succeeds; F.status == 'OFFERED'."

      - name: waitlist_promotion_requires_program_under_capacity
        grounds:
          - state_machines.WaitlistEntry.ACTIVE_to_OFFERED
          - entities.Program.fields.admitted_count
          - entities.Program.fields.capacity
        distinguishing_aspect: |
          Entity pair: WaitlistEntry -> Program (different pair than the first instance).
          WaitlistEntry.ACTIVE -> OFFERED transition is only legal when Program.admitted_count
          < Program.capacity at sweep time. A WaitlistEntry whose Program is at capacity
          stays in ACTIVE through the sweep.
        test_recipe:
          setup:
            - "Create University U, Program P (capacity=1, admitted_count=1)."
            - "Create Application APP_WAIT on P in WAITLISTED state with WaitlistEntry W in ACTIVE."
          trigger:
            - "POST /universities/{U.id}/yield-sweep (PlatformAdmin)"
          assert:
            - "W.status == 'ACTIVE' (no promotion)"
            - "YieldSweep.offers_extended == 0 (no rows fit Program capacity)"
            - "Then POST /_clock/advance past admitted applicant's enrollment_deadline; the auto-revoke transitions the prior ADMITTED to WITHDRAWN and decrements Program.admitted_count; next yield-sweep then promotes W."


  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: ed_commitment_window_overlap_singleton
        grounds:
          - concurrency_rules[ed_already_bound]
          - entities.Applicant.fields.ed_commitment_application_id
          - validations[priority=40]
          - state_machines.Application.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Interval semantics #1: SINGLETON occupancy on a resource (Applicant). An Applicant
          can host at most one ED commitment at a time; the "interval" is the open-ended
          window between ED submission and ED resolution (ADMIT->ENROLLED or REJECT or
          WITHDRAW). A second ED submission attempting to overlap this open interval is
          rejected with ERR_ED_ALREADY_BOUND. The geometric treatment is "cardinality-1
          live interval per Applicant," distinct from buffered overlaps.
        test_recipe:
          setup:
            - "Create University U1 with future early_decision_deadline, Program P1, Applicant A."
            - "Create APP1 on P1 (round=EARLY_DECISION) fully satisfying recommendation + essay preconditions."
            - "Create University U2 with future early_decision_deadline, Program P2."
            - "Create APP2 on P2 (round=EARLY_DECISION) fully satisfying recommendation + essay preconditions."
          trigger:
            - "POST /applications/{APP1.id}/submit (Applicant)  # binds A to ED at U1"
            - "POST /applications/{APP2.id}/submit (Applicant)  # attempts to bind a second ED"
          assert:
            - "First submit returns 200 and APP1.status == 'SUBMITTED'; Applicant.ed_commitment_application_id == APP1.id"
            - "Second submit returns 409 with data.error_id == 'ERR_ED_ALREADY_BOUND'"
            - "APP2.status == 'DRAFT' (unchanged)"

      - name: program_capacity_aggregate_overlap_admit_plus_offer
        grounds:
          - concurrency_rules[program_at_capacity]
          - entities.Program.fields.admitted_count
          - entities.Program.fields.capacity
          - state_machines.WaitlistEntry.ACTIVE_to_OFFERED
          - state_machines.Application.UNDER_REVIEW_to_ADMITTED
        distinguishing_aspect: |
          Interval semantics #2 on a DIFFERENT resource (Program): AGGREGATE-CAPACITY
          overlap, not singleton. The "overlapping interval" is the bag of Applications
          simultaneously occupying ADMITTED ∪ ENROLLED ∪ OFFERED slots, capped by
          Program.capacity. A new ADMIT or yield-sweep OFFER is rejected if the aggregate
          occupancy would exceed capacity. Different geometric treatment than singleton —
          capacity is summed across multiple concurrent intervals.
        test_recipe:
          setup:
            - "Create University U, Program P with capacity=2, admitted_count=2 (two existing ADMITTED Applications)."
            - "Create Application APP_NEW in UNDER_REVIEW state on P."
          trigger:
            - "POST /applications/{APP_NEW.id}/decide with decision=ADMIT (AdmissionsOfficer)"
          assert:
            - "Response HTTP status == 409"
            - "Response data.error_id == 'ERR_PROGRAM_AT_CAPACITY'"
            - "APP_NEW.status == 'UNDER_REVIEW' (unchanged)"
            - "Program.admitted_count == 2 (unchanged)"


  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: submit_then_withdraw_submission_preserves_ed_commitment_count
        grounds:
          - state_machines.Application.DRAFT_to_SUBMITTED
          - state_machines.Application.SUBMITTED_to_DRAFT
          - entities.Applicant.fields.ed_commitment_application_id
        distinguishing_aspect: |
          Conserved quantity #1: the cardinality of active ED commitments per Applicant
          (i.e., 1 if Applicant.ed_commitment_application_id is not null, else 0).
          The pair (submit ED Application) followed by (withdraw-submission of that same
          ED Application) MUST leave this cardinality at exactly its original value (0).
          Pinned invariant: cardinality(Applicant.ed_commitment_application_id is not null) ==
          cardinality before the pair.
        test_recipe:
          setup:
            - "Create University U with future early_decision_deadline, Program P, Applicant A."
            - "Create APP on P (round=EARLY_DECISION). Satisfy recommendation + essay preconditions."
            - "Read pre = (Applicant.ed_commitment_application_id is null ? 0 : 1) -> pre == 0"
          trigger:
            - "POST /applications/{APP.id}/submit"
            - "POST /applications/{APP.id}/withdraw-submission"
          assert:
            - "After submit: Applicant.ed_commitment_application_id == APP.id"
            - "After withdraw-submission: Applicant.ed_commitment_application_id == null"
            - "post = (Applicant.ed_commitment_application_id is null ? 0 : 1) == pre == 0"
            - "APP.status == 'DRAFT' (returned to initial state)"

      - name: admit_waitlist_then_reject_preserves_program_admitted_count
        grounds:
          - state_machines.Application.UNDER_REVIEW_to_WAITLISTED
          - state_machines.Application.UNDER_REVIEW_to_REJECTED
          - state_machines.WaitlistEntry.ACTIVE_to_RELEASED
          - entities.Program.fields.admitted_count
        distinguishing_aspect: |
          Conserved quantity #2: Program.admitted_count (a DIFFERENT type of quantity than
          the ED-commitment cardinality — this one is an integer sum across all
          Applications in {ADMITTED, ENROLLED} on this Program). Pinned invariant:
          Program.admitted_count == count(Applications with status in {ADMITTED, ENROLLED}
          and program_id == this Program). When an Application transitions
          UNDER_REVIEW -> WAITLISTED (creating a WaitlistEntry but NOT incrementing
          admitted_count) and later UNDER_REVIEW->REJECTED on a sibling, neither path
          increments admitted_count; the invariant holds end-to-end.
          Compensating pair: a Waitlist promotion ADMITTED->ENROLLED in a YieldSweep
          increments admitted_count by 1, and the subsequent cascade (e.g., enroll triggers
          siblings to WITHDRAWN, which keep admitted_count -1 for each previously-ADMITTED
          sibling) MUST preserve the invariant: admitted_count == |{APPs in ADMITTED ∪ ENROLLED on P}|.
        test_recipe:
          setup:
            - "Create University U, Program P (capacity=2)."
            - "Create Applicant A1 with APP1 (round=REGULAR_DECISION) on P. Bring APP1 to ADMITTED. Now Program.admitted_count == 1."
            - "Create Applicant A2 with APP2 on P. Bring APP2 to UNDER_REVIEW."
          trigger:
            - "POST /applications/{APP2.id}/decide with decision=WAITLIST  # WAITLISTED, does NOT increment admitted_count"
            - "POST /applications/{APP1.id}/decide ... (already ADMITTED — skip)"
            - "Create Applicant A3 with APP3 on P; bring to UNDER_REVIEW; POST decide(REJECT). Does NOT increment admitted_count."
          assert:
            - "Program.admitted_count == 1 (unchanged from before WAITLIST and REJECT)"
            - "count(Applications with program_id==P.id and status in {ADMITTED, ENROLLED}) == 1"
            - "Program.admitted_count == that count (invariant holds)"
            - "WaitlistEntry created on APP2 has status == 'ACTIVE'"
