              as: PayerRep
              as_user_id: "${p1_id}"
              captures: { claim_n_id: $.data.id, claim_n_v: $.data.version }
            - call: "POST /claims/${claim_n_id}/lines"
              payload: { procedure_code: "99283", quantity_units: 2, unit_charge_cents: 30000, region_code: "R1" }
