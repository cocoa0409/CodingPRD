      - name: feed_call_on_empty_pen_rejected
        claim_type: precondition_enforcement
        grounds: ["validations[priority=7]", "errors[ERR_PEN_NOT_OCCUPIED]"]
        distinguishing_aspect: "A feed call requires the pen OCCUPIED (at least one ACTIVE assignment); an EMPTY pen fails with ERR_PEN_NOT_OCCUPIED."
        test_recipe:
          setup: ["Pen E-99 exists with no assignments"]
          setup_api_calls:
