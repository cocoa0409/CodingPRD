# SCAFFOLD_DIFFICULTY_DESIGN.yaml - task_2449_dropship_endless_aisle_vendor_program
# Section 1.8 of the scaffold. Nine difficulty rules, two differentiated instances each.
# Every arithmetic assertion below is a pre-computed literal derived from the pinned
# constants in SCAFFOLD.yaml section 1.3. The logical clock starts at its mandatory
# default of 2026-08-01T00:00:00Z in every recipe.
scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: promise_quoted_vs_recomputed_diverges_on_order_domain
    grounds:
    - calculations.delivery_promise_date
    - entities.DropshipOrder.fields.quoted_promise_date
    - entities.DropshipOrder.fields.recomputed_promise_date
    - entities.DropshipOrder.fields.promise_variant_in_effect
    - entities.Vendor.fields.promise_padding_days
    - state_machines.DropshipOrderLine.PENDING_TRANSMIT_to_TRANSMITTED
    - endpoints[GET /dropship/orders/{id}/promise]
    distinguishing_aspect: 'This instance lives in the ORDER/promise domain: variant QUOTED uses the item''s contracted
      lead_time_days (3) plus the vendor''s tier padding (1) while variant RECOMPUTED replaces the lead time with
      ceil(avg_ship_hours/24) = 2 from the latest PUBLISHED scorecard and drops padding to 0, so the identical order
      yields quoted_promise_date 2026-08-11 and recomputed_promise_date 2026-08-09 - a 2-day divergence on unchanged
      order data.'
    test_recipe:
      setup:
      - Logical clock starts at the mandatory default 2026-08-01T00:00:00Z.
      - Vendor V1 is ACTIVE, cost_model COMMISSION at 1500 bps, cadence 60 minutes, safety buffer 5, default_lead_time_days
        3, ack_sla_hours 24, ship_sla_grace_hours 12.
      - V1 has one ACTIVE ServiceabilityRule US-WEST / GROUND with transit_days 4 and cutoff_hour_utc 18.
      - A VendorScorecard for 2026-07-01..2026-07-31 is PUBLISHED from seeded prior history (avg_ship_hours 40.0,
        on_time 9200 bps, cancellation 400 bps, defect 600 bps), yielding composite_score 93.60, tier GOLD and promise_padding_days
        1 on the vendor.
      - Offer I1 (sku SKU-CHAIR-1, unit_retail_cents 24999, GROUND, lead_time_days 3) is ACTIVE with a fresh feed
        of 60 on-hand, so available_units is 55.
      - The clock is at 2026-08-03T10:00:00Z, one hour after the feed refresh and before the 18:00 cutoff.
      setup_api_calls:
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/vendors
        payload:
          vendor_code: V1
          legal_name: Northwind Dropship LLC
          cost_model: COMMISSION
          commission_rate_bps: 1500
          inventory_refresh_cadence_minutes: 60
          safety_buffer_units: 5
          oversell_grace_units: 0
          default_lead_time_days: 3
          ack_sla_hours: 24
          ship_sla_grace_hours: 12
        as: PlatformAdmin
        captures:
          v1_id: $.data.id
      - call: POST /dropship/vendors/${v1_id}/begin-integration
        payload: {}
        as: VendorOpsAnalyst
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: CATALOG
          sample_payload_digest: sha256-V1-catalog
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_catalog: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: INVENTORY
          sample_payload_digest: sha256-V1-inventory
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_inventory: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: ORDER
          sample_payload_digest: sha256-V1-order
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_order: $.data.id
      - call: POST /dropship/vendors/${v1_id}/integration-tests
        payload:
          message_type: SHIP_CONFIRM
          sample_payload_digest: sha256-V1-ship_confirm
        as: VendorOpsAnalyst
        as_user_id: ops-recorder-V1
        captures:
          v1_t_ship_confirm: $.data.id
      - call: POST /dropship/integration-tests/${v1_t_catalog}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/integration-tests/${v1_t_inventory}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/integration-tests/${v1_t_order}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/integration-tests/${v1_t_ship_confirm}/evaluate
        payload:
          outcome: PASS
          reported_error_count: 0
        as: VendorOpsAnalyst
        as_user_id: ops-evaluator-V1
      - call: POST /dropship/vendors/${v1_id}/serviceability-rules
        payload:
          zone_code: US-WEST
          ship_method: GROUND
          transit_days: 4
          cutoff_hour_utc: 18
          surcharge_cents: 0
        as: MerchandiseManager
        captures:
          v1_r1_id: $.data.id
      - call: POST /dropship/vendors/${v1_id}/certify
        payload: {}
        as: VendorOpsAnalyst
        as_user_id: ops-cert-V1
      - call: POST /dropship/vendors/${v1_id}/activate
        payload: {}
        as: MerchandiseManager
        as_user_id: mm-activator-V1
        captures:
          v1_ver: $.data.version
      - call: POST /dropship/vendors/${v1_id}/scorecards
        payload:
          period_start: '2026-07-01'
          period_end: '2026-07-31'
          metric_variant: EVENT_EQUAL
          seeded_prior_avg_ship_hours: 40.0
          seeded_prior_on_time_ship_rate_bps: 9200
          seeded_prior_cancellation_rate_bps: 400
          seeded_prior_defect_rate_bps: 600
        as: VendorOpsAnalyst
        captures:
          sc_gold_id: $.data.id
      - call: POST /dropship/scorecards/${sc_gold_id}/publish
        payload:
          expected_vendor_version: ${v1_ver}
        as: PlatformAdmin
      - call: POST /dropship/items
        payload:
          vendor_id: ${v1_id}
          sku: SKU-CHAIR-1
          unit_retail_cents: 24999
          ship_method: GROUND
          lead_time_days: 3
          reverse_freight_owner: RETAILER
          restock_policy: VENDOR_RESTOCK
          defect_window_days: 30
        as: MerchandiseManager
        captures:
          i1_id: $.data.id
      - call: POST /dropship/items/${i1_id}/activate
        payload: {}
        as: MerchandiseManager
        captures:
          i1_ver: $.data.version
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T09:00:00Z'
        as: PlatformAdmin
      - call: POST /dropship/items/${i1_id}/inventory-snapshots
        payload:
          on_hand_units: 60
          effective_from: '2026-08-03T09:00:00Z'
          feed_sequence: 1
          expected_item_version: ${i1_ver}
        as: VendorUser
        as_user_id: ${v1_id}
      - call: POST /dropship/_clock/set_current_utc
        payload:
          current_utc: '2026-08-03T10:00:00Z'
        as: PlatformAdmin
      trigger:
      - call: POST /dropship/orders
        payload:
          order_ref: ORD-PROMISE-1
          customer_zone_code: US-WEST
          lines:
          - item_id: ${i1_id}
            quantity: 2
        as: CareAgent
        captures:
          o1_id: $.data.id
      - call: POST /dropship/orders/${o1_id}/transmit
        payload: {}
        as: MerchandiseManager
      - call: GET /dropship/orders/${o1_id}/promise
        payload: {}
        as: CareAgent
      assert:
      - VendorScorecard.${sc_gold_id}.composite_score == 93.60
      - VendorScorecard.${sc_gold_id}.tier == GOLD
      - Vendor.${v1_id}.promise_padding_days == 1
      - DropshipOrder.${o1_id}.quoted_promise_date == "2026-08-11"
      - DropshipOrder.${o1_id}.recomputed_promise_date == "2026-08-09"
      - DropshipOrder.${o1_id}.promise_variant_in_effect == RECOMPUTED
      - GET /dropship/orders/${o1_id}/promise returns promise_divergence_days == 2
      - DropshipOrder.${o1_id}.total_retail_cents == 49998
      - DropshipOrder.${o1_id}.total_cost_cents == 42498
      - DropshipOrder.${o1_id}.margin_cents == 7500
  - name: scorecard_event_equal_vs_unit_weighted_diverges_on_vendor_domain
    grounds:
