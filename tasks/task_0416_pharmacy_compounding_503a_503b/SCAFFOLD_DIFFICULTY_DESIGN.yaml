              as_user_id: "comp-user-1"
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch1_id}", test_type: "POTENCY_ASSAY", measured_value: 100, lower_limit: 90, upper_limit: 110 }
              as: QualityAssurancePharmacist
              captures: { b1_qc1: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${b1_qc1}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${b1_qc1}/record"
              payload: { measured_value: 100 }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch1_id}", test_type: "VISUAL_INSPECTION" }
              as: QualityAssurancePharmacist
              captures: { b1_qc2: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${b1_qc2}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${b1_qc2}/record"
              payload: { pass: true }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch1_id}/quarantine"
              payload: {}
              as: CompoundingPharmacist
            - call: "GET /pharmacy-compounding/compounding-batches/${batch1_id}"
              payload: {}
              as: QualityAssurancePharmacist
              captures: { b1_v: $.data.version }
            - call: "POST /pharmacy-compounding/compounding-batches/${batch1_id}/release"
              payload: { expected_batch_version: "${b1_v}" }
              as: QualityAssurancePharmacist
              as_user_id: "qa-user-2"
            # ---- second batch: 90 units, would push window to 210 > 200 ----
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "OFFICE_USE" }
              as: CompoundingPharmacist
              captures: { batch2_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch2_id}", ingredient_lot_id: "${lot2_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch2_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch2_id}/compile"
              payload: { actual_yield_units: 90 }
              as: CompoundingPharmacist
              as_user_id: "comp-user-1"
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch2_id}", test_type: "POTENCY_ASSAY", measured_value: 100, lower_limit: 90, upper_limit: 110 }
              as: QualityAssurancePharmacist
              captures: { b2_qc1: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${b2_qc1}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${b2_qc1}/record"
              payload: { measured_value: 100 }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch2_id}", test_type: "VISUAL_INSPECTION" }
              as: QualityAssurancePharmacist
              captures: { b2_qc2: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${b2_qc2}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${b2_qc2}/record"
              payload: { pass: true }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch2_id}/quarantine"
              payload: {}
              as: CompoundingPharmacist
            - call: "GET /pharmacy-compounding/compounding-batches/${batch2_id}"
              payload: {}
              as: QualityAssurancePharmacist
              captures: { b2_v: $.data.version }
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch2_id}/release"
              payload: { expected_batch_version: "${b2_v}" }
              as: QualityAssurancePharmacist
              as_user_id: "qa-user-3"
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_ANTICIPATORY_LIMIT_EXCEEDED (consumed 120 + 90 = 210 > 200; ledger remaining_units 80 < 90)"
            - "CompoundingBatch.${batch2_id}.status == QUARANTINED (release rejected)"
            - "GET anticipatory-ledger for ${mfr_id} returns consumed_units == 120, remaining_units == 80 (unchanged)"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reject_restocks_lot_grams_conserves_total_grams
        grounds:
          - state_machines.CompoundingBatch.QUARANTINED_to_REJECTED
          - state_machines.CompoundingBatch.DRAFT_to_IN_PROCESS
          - calculations.lot_potency_adjustment
          - entities.IngredientLot.fields.remaining_grams
          - entities.IngredientLot.fields.initial_grams
        distinguishing_aspect: |
          Conserved quantity = total grams of an IngredientLot. start decrements
          remaining_grams by grams_used; reject restocks the same grams_used. The
          invariant: after start-then-reject, IngredientLot.remaining_grams ==
          initial_grams (50 -> 40 -> 50), a grams-conservation invariant.
        test_recipe:
          setup:
            - "503A facility, lot initial_grams=50, charged grams_used=10 to a PRESCRIPTION batch, started (remaining_grams=40), compiled, quarantined."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Inv1 A", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Omeprazole 2mg/mL Susp", dosage_form: "ORAL_LIQUID", default_bud_days_nonsterile: 14, theoretical_yield_units: 5, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "Omeprazole", lot_number: "O-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Sky Noor", prescriber_npi: "1234567890", units_prescribed: 5, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_id}" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 5 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/quarantine"
              payload: {}
              as: CompoundingPharmacist
          trigger:
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/reject"
              payload: {}
              as: QualityAssurancePharmacist
              as_user_id: "qa-user-2"
          assert:
            - "IngredientLot.${lot_id}.remaining_grams == 50.0 (restored to initial_grams; 50 -> 40 on start -> 50 on reject, total grams conserved)"
            - "CompoundingBatch.${batch_id}.status == REJECTED"

      - name: recall_then_decrement_conserves_prescription_units_dispensed
        grounds:
          - state_machines.CompoundingBatch.RELEASED_to_RECALLED
          - state_machines.FinishedPreparation.DISPENSED_to_RECALLED
          - state_machines.FinishedPreparation.IN_INVENTORY_to_DISPENSED
          - entities.Prescription.fields.units_dispensed
        distinguishing_aspect: |
          Conserved quantity = Prescription.units_dispensed (a different conserved
          quantity than grams). A dispense increments units_dispensed by 1; the
          recall's compensating cascade on that DISPENSED unit decrements it by 1.
          Invariant: after dispense-then-recall of the single unit,
          Prescription.units_dispensed returns to 0.
        test_recipe:
          setup:
            - "503A facility, MFR theoretical_yield_units=1, prescription units_prescribed=2."
            - "Batch released, the single prep dispensed against the prescription (units_dispensed=1, prescription still ACTIVE since 1 < 2)."
          setup_api_calls:
            - call: "POST /pharmacy-compounding/facilities"
              payload: { name: "Inv2 A", registration_type: "503A", state_code: "CA" }
              as: SystemAdmin
              captures: { f_id: $.data.id }
            - call: "POST /pharmacy-compounding/facilities/${f_id}/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /pharmacy-compounding/master-formulation-records"
              payload: { facility_id: "${f_id}", name: "Metoprolol 5mg Cap", dosage_form: "ORAL_SOLID", default_bud_days_nonsterile: 90, theoretical_yield_units: 1, anticipatory_max_units: 500 }
              as: CompoundingPharmacist
              captures: { mfr_id: $.data.id }
            - call: "POST /pharmacy-compounding/ingredient-lots"
              payload: { facility_id: "${f_id}", component_name: "Metoprolol", lot_number: "MT-1", labeled_potency_pct: 100, initial_grams: 50, expiration_utc: "2030-01-01T00:00:00.000Z" }
              as: CompoundingPharmacist
              captures: { lot_id: $.data.id }
            - call: "POST /pharmacy-compounding/prescriptions"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", patient_name: "Lane Cruz", prescriber_npi: "1234567890", units_prescribed: 2, written_utc: "2026-06-01T00:00:00.000Z" }
              as: DispensingPharmacist
              captures: { rx_id: $.data.id }
            - call: "POST /pharmacy-compounding/compounding-batches"
              payload: { facility_id: "${f_id}", master_formulation_record_id: "${mfr_id}", purpose: "PRESCRIPTION", prescription_id: "${rx_id}" }
              as: CompoundingPharmacist
              captures: { batch_id: $.data.id }
            - call: "POST /pharmacy-compounding/batch-ingredient-usages"
              payload: { compounding_batch_id: "${batch_id}", ingredient_lot_id: "${lot_id}", grams_used: 10 }
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/start"
              payload: {}
              as: CompoundingPharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/compile"
              payload: { actual_yield_units: 1 }
              as: CompoundingPharmacist
              as_user_id: "comp-user-1"
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "POTENCY_ASSAY", measured_value: 100, lower_limit: 90, upper_limit: 110 }
              as: QualityAssurancePharmacist
              captures: { qc1_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc1_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${qc1_id}/record"
              payload: { measured_value: 100 }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests"
              payload: { compounding_batch_id: "${batch_id}", test_type: "VISUAL_INSPECTION" }
              as: QualityAssurancePharmacist
              captures: { qc2_id: $.data.id }
            - call: "POST /pharmacy-compounding/qc-tests/${qc2_id}/begin"
              payload: {}
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/qc-tests/${qc2_id}/record"
              payload: { pass: true }
              as: QualityAssurancePharmacist
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/quarantine"
              payload: {}
              as: CompoundingPharmacist
            - call: "GET /pharmacy-compounding/compounding-batches/${batch_id}"
              payload: {}
              as: QualityAssurancePharmacist
              captures: { batch_v: $.data.version }
            - call: "POST /pharmacy-compounding/compounding-batches/${batch_id}/release"
              payload: { expected_batch_version: "${batch_v}" }
              as: QualityAssurancePharmacist
              as_user_id: "qa-user-2"
            - call: "GET /pharmacy-compounding/finished-preparations?compounding_batch_id=${batch_id}"
              payload: {}
              as: DispensingPharmacist
              captures: { prep_id: "$.data[0].id" }
            - call: "POST /pharmacy-compounding/dispenses"
              payload: { facility_id: "${f_id}", finished_preparation_id: "${prep_id}", prescription_id: "${rx_id}" }
              as: DispensingPharmacist
          trigger:
            - call: "POST /pharmacy-compounding/recalls"
              payload: { facility_id: "${f_id}", compounding_batch_id: "${batch_id}", reason: "LABELING_ERROR", classification: "CLASS_III" }
              as: QualityAssurancePharmacist
              captures: { recall_id: $.data.id }
          assert:
            - "Prescription.${rx_id}.units_dispensed == 0 (incremented to 1 on dispense, decremented back to 0 by the recall compensating cascade)"
            - "Prescription.${rx_id}.status == ACTIVE"
            - "FinishedPreparation.${prep_id}.dispense_status == RECALLED"
