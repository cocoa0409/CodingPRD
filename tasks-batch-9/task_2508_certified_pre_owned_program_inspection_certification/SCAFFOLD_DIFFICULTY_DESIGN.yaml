            - "Dealer.${d1}.audit_fail_count == 1 and privilege_status == ACTIVE, below audit_fail_suspension_count 2"

      - name: vehicle_certification_slot_conservation_on_supersede
        grounds:
          - state_machines.Certification.SUBMITTED_to_SUPERSEDED
          - entities.Vehicle.fields.active_certification_count
          - entities.Dealer.fields.lifetime_submitted_count
          - entities.Certification.fields.certification_number
          - validations[priority=21]
          - concurrency_rules.certification-create-stale-vehicle
        distinguishing_aspect: |
          Superseding is the one transition where a slot is handed over rather than released and
          retaken: Vehicle.active_certification_count must read 1 before, during and after the
          supersede and remain 1 through approval, never dipping to 0 nor climbing to 2, even though
          lifetime_submitted_count advances to 2 and two distinct certification_numbers are minted.
          The stale-version retry proves the handover is gated by OCC rather than by luck.
        test_recipe:
          setup:
            - "One dealer, one technician, the published MPI-172 template and vehicle V1 with a PASSED inspection."
            - "Certification C_FIRST is submitted using the vehicle version captured after the inspection passed; that version is retained for the stale retry."
