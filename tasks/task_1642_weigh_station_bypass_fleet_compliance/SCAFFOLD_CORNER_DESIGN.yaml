      - name: carrier_transition_role_split_returns_403
        claim_type: rbac_denial
        grounds:
          - roles[PlatformAdmin]
          - roles[ComplianceOfficer]
          - validations[priority=2]
        distinguishing_aspect: "The carrier transition endpoint splits by target state: PlatformAdmin attempting to_status ACTIVE is ERR_FORBIDDEN_ROLE, ComplianceOfficer attempting TERMINATED is ERR_FORBIDDEN_ROLE, and PlatformAdmin TERMINATED succeeds — role-per-target enforcement inside one endpoint."
        test_recipe:
          setup: ["clock 2026-08-01; carrier ENROLLED with snapshot iss 30 (approvable posture ELIGIBLE)"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
