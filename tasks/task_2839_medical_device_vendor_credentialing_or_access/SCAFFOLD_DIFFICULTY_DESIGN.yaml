              as: ORCoordinator
              as_user_id: "user_orc_1"
              captures: { case_9601_id: $.data.id }
            - call: "GET /vendor-access/surgical-cases/${case_9601_id}"
              as: SterileProcessingTech
              as_user_id: "user_spd_1"
              captures: { case_9601_ver: $.data.version }
            - call: "POST /vendor-access/loaner-sets"
              payload: { surgical_case_id: "${case_9601_id}", approved_product_id: "${ap_t7_id}", tray_count: 4, reprocessing_complexity: "SIMPLE", expected_case_version: "${case_9601_ver}" }
              as: SterileProcessingTech
