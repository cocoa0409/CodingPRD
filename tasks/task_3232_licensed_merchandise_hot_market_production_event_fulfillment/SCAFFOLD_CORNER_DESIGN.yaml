              as: ProductionPlanner
              captures: { pom_id: $.data.id, pom_v: $.data.version }
            - call: "POST /production-orders/${pom_id}/layers"
              payload: { expected_production_order_version: "${pom_v}", layers: [{ print_type: "BASE", quantity: 20 }] }
              as: ProductionPlanner
              captures: { pom_v2: $.data.version }
            - call: "POST /fulfillment-orders"
              payload: { production_order_id: "${pom_id}", channel: "ECOM", destination_code: "ECOM-PHI-3", quantity: 20 }
              as: FulfillmentCoordinator
              captures: { fom_id: $.data.id }
            - call: "POST /fulfillment-orders/${fom_id}/pick"
              payload: { expected_production_order_version: "${pom_v2}", quantity: 20, pick_remark: "pick-m" }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fom_id}/ship"
              payload: { quantity: 20, carrier: "GROUND", sla_hours: 48 }
              as: FulfillmentCoordinator
            - call: "POST /fulfillment-orders/${fom_id}/deliver"
              payload: {}
              as: FulfillmentCoordinator
          trigger:
            - call: "POST /fulfillment-orders/${fom_id}/pick"
              payload: { expected_production_order_version: "${pom_v2}", quantity: 5, pick_remark: "pick-m2" }
              as: FulfillmentCoordinator
              captures: { err_id: $.data.error_id }
          assert:
