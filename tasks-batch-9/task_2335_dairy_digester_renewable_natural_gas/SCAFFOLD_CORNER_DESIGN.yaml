        grounds:
          - concurrency_rules[credit-batch-create-stale-pathway]
          - errors[ERR_STALE_VERSION]
          - endpoints[POST /credit-batches]
        distinguishing_aspect: >
          Certification advances the pathway version, so a client that read the pathway
          before certification is refused with 412 even though its payload is otherwise
          perfect; replaying the identical body with the refreshed version succeeds, which
          proves the guard is on the version and not on the body.
