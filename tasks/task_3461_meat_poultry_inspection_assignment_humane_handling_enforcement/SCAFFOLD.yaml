# =============================================================================
# PRD Benchmark Scaffold — task_3461
# Meat & Poultry Inspection Assignment & Humane Handling Enforcement (FSIS)
# =============================================================================

scenario: |
  Meat and Poultry Inspection Assignment & Humane Handling Enforcement (USDA
  Food Safety and Inspection Service): continuous inspection presence
  requirements at slaughter establishments with inspector staffing and shift
  coverage, grant of inspection application review covering facility,
  sanitation and hazard plan adequacy, noncompliance record issuance with
  escalating enforcement from records to suspension of inspection, humane
  handling verification with suspension authority for egregious events,
  sampling programs for pathogens with establishment categorization based on
  results, labeling approval for claims requiring documentation of production
  practices, recall coordination with establishments including class
  determination and effectiveness checks, appeals of inspector findings and
  supervisory review

domain_name: meat-poultry-inspection
api_prefix: /inspection

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic   # plus parallel state dimensions on Establishment
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Establishment
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "Establishment name" }
      - { name: species_classes, type: array, source: input, description: "Species handled; members of enum {CATTLE, SWINE, POULTRY, SHEEP}; at least one required" }
      - { name: slaughter_capable, type: boolean, source: input, description: "True if the establishment performs slaughter (continuous presence rules apply)" }
      - { name: grant_status, type: enum, source: system, default: UNGRANTED, description: "Grant dimension: UNGRANTED | GRANTED | WITHDRAWN (parallel with inspection_status)" }
      - { name: inspection_status, type: enum, source: system, default: INACTIVE, description: "Inspection dimension: INACTIVE | ACTIVE | SUSPENDED (parallel with grant_status)" }
      - { name: pathogen_category, type: enum, source: computed, default: null, description: "CAT_1 | CAT_2 | CAT_3 | null; derived from PathogenSample results per pathogen_categorization" }
      - { name: open_nr_count, type: integer, source: computed, default: 0, description: "Count of NoncomplianceRecords with status IN {OPEN, RESPONSE_SUBMITTED, ESCALATED, APPEALED} for this establishment" }
      - { name: suspension_count, type: integer, source: computed, default: 0, description: "Lifetime count of EnforcementActions of type SUSPENSION that reached IN_EFFECT" }
      - { name: compliance_score, type: number, source: computed, description: "Weighted per-family score, see calculations.monthly_compliance_score" }
      - { name: enforcement_priority_score, type: integer, source: computed, description: "Base points + tier bonus, see calculations.enforcement_priority_score" }
      - { name: rolling_risk_score, type: integer, source: computed, description: "Windowed + recency-weighted NR risk, see calculations.establishment_risk_score (variant ROLLING)" }
      - { name: lifetime_risk_score, type: integer, source: computed, description: "Unwindowed NR risk over all non-VACATED NRs, see calculations.establishment_risk_score (variant LIFETIME)" }

  - name: GrantApplication
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; applicant establishment" }
      - { name: facility_doc_ref, type: string, source: input, description: "Document reference for facility adequacy" }
      - { name: sanitation_plan_ref, type: string, source: input, description: "Document reference for the sanitation standard-operating plan" }
      - { name: haccp_plan_ref, type: string, source: input, description: "Document reference for the hazard analysis (HACCP) plan" }
      - { name: facility_finding, type: enum, source: system, default: PENDING, description: "PENDING | ADEQUATE | DEFICIENT" }
      - { name: sanitation_finding, type: enum, source: system, default: PENDING, description: "PENDING | ADEQUATE | DEFICIENT" }
      - { name: haccp_finding, type: enum, source: system, default: PENDING, description: "PENDING | ADEQUATE | DEFICIENT" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | GRANTED | DENIED | WITHDRAWN" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each resubmission after DENIED" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the grant/deny decision" }

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Inspector full name" }
      - { name: badge_number, type: string, source: input, description: "Unique badge number" }
      - { name: species_qualifications, type: array, source: input, description: "Members of enum {CATTLE, SWINE, POULTRY, SHEEP}; assignment requires qualification for every species class of the shift's establishment" }
      - { name: employment_status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }

  - name: ShiftWindow
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; establishment operating this shift" }
      - { name: start_utc, type: datetime, source: input, description: "Shift start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Shift end (exclusive); must be strictly after start_utc" }
      - { name: shift_type, type: enum, source: input, description: "SLAUGHTER | PROCESSING" }
      - { name: planned_line_count, type: integer, source: input, description: "Number of slaughter/processing lines requiring coverage; >= 1" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | VERIFIED_COVERED | COVERAGE_GAP_FLAGGED | BLOCKED" }
      - { name: provisional_gap_minutes, type: integer, source: computed, default: null, description: "Gap under the provisional variant (SCHEDULED + CONFIRMED assignments); null until first verify-coverage" }
      - { name: final_gap_minutes, type: integer, source: computed, default: null, description: "Gap under the final variant (CONFIRMED assignments only); null until first verify-coverage" }

  - name: ShiftAssignment
    parent: null
    common_fields: true
    fields:
      - { name: shift_window_id, type: string, source: input, description: "FK -> ShiftWindow.id; covered shift" }
      - { name: establishment_id, type: string, source: computed, description: "FK -> Establishment.id; denormalized from the shift window at creation" }
      - { name: inspector_id, type: string, source: input, description: "FK -> Inspector.id; assigned inspector" }
      - { name: line_index, type: integer, source: input, description: "1-based line number; must satisfy 1 <= line_index <= ShiftWindow.planned_line_count" }
      - { name: start_utc, type: datetime, source: input, description: "Coverage start (inclusive); must lie within [ShiftWindow.start_utc, ShiftWindow.end_utc)" }
      - { name: end_utc, type: datetime, source: input, description: "Coverage end (exclusive); strictly after start_utc and <= ShiftWindow.end_utc" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | CONFIRMED | CANCELLED" }

  - name: NoncomplianceRecord
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; cited establishment" }
      - { name: issued_by_inspector_id, type: string, source: input, description: "FK -> Inspector.id; issuing inspector" }
      - { name: shift_window_id, type: string, source: input, default: null, description: "FK -> ShiftWindow.id; optional link to the shift during which the noncompliance was observed" }
      - { name: regulation_family, type: enum, source: input, description: "SANITATION | HACCP | HUMANE | LABELING | OTHER" }
      - { name: description, type: string, source: input, description: "Free-text finding" }
      - { name: observed_at, type: datetime, source: input, description: "When the noncompliance was observed; must not be after the logical clock" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance" }
      - { name: status, type: enum, source: system, default: OPEN, description: "OPEN | RESPONSE_SUBMITTED | ESCALATED | APPEALED | VERIFIED | VACATED" }
      - { name: status_before_appeal, type: enum, source: system, default: null, description: "Status the NR returns to if the appeal is REMANDED... records the status at appeal filing" }
      - { name: response_text, type: string, source: system, default: null, description: "Establishment's written response" }

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: computed, description: "FK -> Establishment.id; target establishment (from path)" }
      - { name: action_type, type: enum, source: input, description: "NOTICE_OF_INTENDED_ENFORCEMENT | WITHHOLD_MARKS | SUSPENSION | WITHDRAWAL" }
      - { name: basis, type: enum, source: input, description: "NR_LINKAGE | EGREGIOUS_HUMANE | CATEGORY_3_PATHOGEN | ADMINISTRATIVE" }
      - { name: regulation_family, type: enum, source: input, default: null, description: "Required when basis == NR_LINKAGE: the family whose qualifying-NR count is evaluated" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | IN_EFFECT | LIFTED" }
      - { name: auto_created, type: boolean, source: system, default: false, description: "True when created by a cascade (egregious humane confirmation or CAT_3 categorization)" }
      - { name: effective_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp when the action entered IN_EFFECT" }
      - { name: abatement_evidence, type: string, source: system, default: null, description: "Evidence supplied at lift; >= 20 characters" }

  - name: HumaneHandlingEvent
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; observed establishment" }
      - { name: reported_by_inspector_id, type: string, source: input, description: "FK -> Inspector.id; observing inspector" }
      - { name: species, type: enum, source: input, description: "CATTLE | SWINE | POULTRY | SHEEP; must be a member of the establishment's species_classes" }
      - { name: severity, type: enum, source: input, description: "EGREGIOUS | NON_EGREGIOUS" }
      - { name: observed_at, type: datetime, source: input, description: "Observation time; must not be after the logical clock" }
      - { name: description, type: string, source: input, description: "Free-text observation" }
      - { name: status, type: enum, source: system, default: REPORTED, description: "REPORTED | CONFIRMED | DISMISSED" }

  - name: PathogenSample
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; sampled establishment" }
      - { name: collected_by_inspector_id, type: string, source: input, description: "FK -> Inspector.id; collecting inspector" }
      - { name: pathogen, type: enum, source: input, description: "SALMONELLA | CAMPYLOBACTER" }
      - { name: collected_at, type: datetime, source: input, description: "Collection time; must not be after the logical clock" }
      - { name: result, type: enum, source: system, default: PENDING, description: "PENDING | POSITIVE | NEGATIVE" }
      - { name: resulted_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of result recording" }

  - name: LabelApplication
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; applicant establishment" }
      - { name: product_name, type: string, source: input, description: "Product the label applies to" }
      - { name: label_claim, type: enum, source: input, description: "GRASS_FED | NO_ANTIBIOTICS | ORGANIC | BREED_SPECIFIC" }
      - { name: documentation_refs, type: array, source: input, description: "Production-practice documentation references; minimum count depends on label_claim (see calculations.label_documentation_minimum)" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | RETURNED | HELD" }
      - { name: revision_count, type: integer, source: system, default: 0, description: "Increments on each resubmission after RETURNED" }

  - name: Recall
    parent: null
    common_fields: true
    fields:
      - { name: establishment_id, type: string, source: input, description: "FK -> Establishment.id; recalling establishment" }
      - { name: product_description, type: string, source: input, description: "Product under recall" }
      - { name: quantity_lbs, type: number, source: input, description: "Quantity in commerce, pounds; must be > 0" }
      - { name: reason_code, type: enum, source: input, description: "PATHOGEN | MISBRANDING | FOREIGN_MATTER" }
      - { name: recall_class, type: enum, source: system, default: null, description: "null | CLASS_I | CLASS_II | CLASS_III; set by determine-class" }
      - { name: status, type: enum, source: system, default: INITIATED, description: "INITIATED | CLASS_DETERMINED | CLOSED_EFFECTIVE | CLOSED_INEFFECTIVE" }
      - { name: required_min_checks, type: integer, source: computed, default: null, description: "Minimum effectiveness checks before close; class-derived (10 / 5 / 4)" }
      - { name: required_effectiveness_ratio, type: number, source: computed, default: null, description: "Minimum ratio of EFFECTIVE checks to close as CLOSED_EFFECTIVE; class-derived (0.95 / 0.80 / 0.75)" }
      - { name: checks_performed, type: integer, source: computed, default: 0, description: "Count of RecallEffectivenessCheck rows for this recall" }
      - { name: checks_effective, type: integer, source: computed, default: 0, description: "Count of checks with outcome EFFECTIVE" }
      - { name: effectiveness_ratio, type: number, source: computed, default: null, description: "checks_effective / checks_performed, 2 decimal places round_half_up; null when no checks recorded" }

  - name: RecallEffectivenessCheck
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: recall_id, type: string, source: computed, description: "FK -> Recall.id; parent recall (from path)" }
      - { name: consignee_name, type: string, source: input, description: "Consignee contacted" }
      - { name: outcome, type: enum, source: input, description: "EFFECTIVE | INEFFECTIVE" }
      - { name: checked_at, type: datetime, source: input, description: "When the check occurred; must not be after the logical clock" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: noncompliance_record_id, type: string, source: input, description: "FK -> NoncomplianceRecord.id; the finding under appeal" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds; >= 10 characters" }
      - { name: status, type: enum, source: system, default: FILED, description: "FILED | AFFIRMED | REMANDED | VACATED" }
      - { name: decided_by_reviewer_id, type: string, source: system, default: null, description: "X-User-ID of the deciding SupervisoryReviewer" }
      - { name: decided_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of the decision" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Establishment
    initial_state: "grant_status=UNGRANTED, inspection_status=INACTIVE (two independent state dimensions on one row)"
    terminal_states: ["grant_status=WITHDRAWN (both dimensions frozen)"]
    transitions:
      # --- grant_status dimension ---
      - from: "grant_status=UNGRANTED"
        to: "grant_status=GRANTED"
        trigger: "POST /inspection/grant-applications/{id}/decide with decision=GRANT"
        actor: DistrictManager
        preconditions:
          - "Application belongs to this establishment and is UNDER_REVIEW"
          - "All three findings ADEQUATE (else ERR_GRANT_DECISION_BLOCKED)"
        side_effects:
          - "inspection_status transitions INACTIVE -> ACTIVE in the same request"
          - "Establishment.version increments by 1"
      - from: "grant_status=GRANTED"
        to: "grant_status=WITHDRAWN"
        trigger: "POST /inspection/enforcement-actions/{id}/activate on an EnforcementAction with action_type=WITHDRAWAL"
        actor: DistrictManager
        preconditions:
          - "EnforcementAction is IN_EFFECT-ready per its validation rules (see validations)"
        side_effects:
          - "inspection_status -> INACTIVE"
          - "All ShiftWindows in PLANNED or COVERAGE_GAP_FLAGGED -> BLOCKED"
          - "All LabelApplications in SUBMITTED or UNDER_REVIEW or HELD -> REJECTED with reason withdrawal"
          - "Establishment.version increments by 1"
      # --- inspection_status dimension ---
      - from: "inspection_status=ACTIVE"
        to: "inspection_status=SUSPENDED"
        trigger: "POST /inspection/enforcement-actions/{id}/activate with action_type=SUSPENSION, or cascade from egregious humane confirmation"
        actor: DistrictManager | system
        preconditions:
          - "grant_status == GRANTED (else ERR_ESTABLISHMENT_NOT_GRANTED)"
        side_effects:
          - "suspension_count += 1"
          - "All ShiftWindows in PLANNED or COVERAGE_GAP_FLAGGED -> BLOCKED"
          - "All LabelApplications in UNDER_REVIEW -> HELD"
          - "Establishment.version increments by 1"
      - from: "inspection_status=SUSPENDED"
        to: "inspection_status=ACTIVE"
        trigger: "POST /inspection/enforcement-actions/{id}/lift on the IN_EFFECT SUSPENSION"
        actor: DistrictManager
        preconditions:
          - "abatement_evidence present, >= 20 characters (else ERR_INVALID_REQUEST)"
        side_effects:
          - "All LabelApplications in HELD -> UNDER_REVIEW"
          - "ShiftWindows that were BLOCKED stay BLOCKED (their windows are in the past)"
          - "Establishment.version increments by 1"

  - entity: GrantApplication
    initial_state: SUBMITTED
    terminal_states: [GRANTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /inspection/grant-applications/{id}/begin-review"
        actor: DistrictManager
        preconditions: ["status == SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: UNDER_REVIEW
        trigger: "POST /inspection/grant-applications/{id}/record-adequacy"
        actor: DistrictManager
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: ["Sets exactly one of facility_finding / sanitation_finding / haccp_finding to ADEQUATE or DEFICIENT"]
        note: "Self-loop: each dimension is recorded independently; recording is idempotent per call and may overwrite a prior finding"
      - from: UNDER_REVIEW
        to: GRANTED
        trigger: "POST /inspection/grant-applications/{id}/decide with decision=GRANT"
        actor: DistrictManager
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "facility_finding == ADEQUATE AND sanitation_finding == ADEQUATE AND haccp_finding == ADEQUATE (else ERR_GRANT_DECISION_BLOCKED)"
        side_effects:
          - "decided_at = logical clock"
          - "Establishment.grant_status -> GRANTED; Establishment.inspection_status -> ACTIVE"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /inspection/grant-applications/{id}/decide with decision=DENY"
        actor: DistrictManager
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: ["decided_at = logical clock"]
      - from: DENIED
        to: SUBMITTED
        trigger: "POST /inspection/grant-applications/{id}/resubmit with refreshed document references"
        actor: EstablishmentManager
        preconditions:
          - "status == DENIED (else ERR_INVALID_STATE)"
          - "X-User-ID == GrantApplication.establishment_id (ownership; else ERR_FORBIDDEN)"
        side_effects:
          - "revision_count += 1"
          - "All three findings reset to PENDING"
          - "document refs replaced by the request payload"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /inspection/grant-applications/{id}/withdraw"
        actor: EstablishmentManager
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW} (else ERR_INVALID_STATE)"
          - "X-User-ID == GrantApplication.establishment_id (else ERR_FORBIDDEN)"
        side_effects: []
      - from: UNDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /inspection/grant-applications/{id}/withdraw"
        actor: EstablishmentManager
        preconditions:
          - "status IN {SUBMITTED, UNDER_REVIEW} (else ERR_INVALID_STATE)"
          - "X-User-ID == GrantApplication.establishment_id (else ERR_FORBIDDEN)"
        side_effects: []

  - entity: Inspector
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /inspection/inspectors/{id}/deactivate"
        actor: ProgramAdministrator
        preconditions: ["employment_status == ACTIVE (else ERR_INVALID_STATE)"]
        side_effects: ["All of this inspector's ShiftAssignments in SCHEDULED status -> CANCELLED"]

  - entity: ShiftWindow
    initial_state: PLANNED
    terminal_states: [VERIFIED_COVERED, BLOCKED]
    transitions:
      - from: PLANNED
        to: VERIFIED_COVERED
        trigger: "POST /inspection/shift-windows/{id}/verify-coverage when final_gap_minutes == 0"
        actor: Inspector
        preconditions: ["status IN {PLANNED, COVERAGE_GAP_FLAGGED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "provisional_gap_minutes and final_gap_minutes recomputed and stored"
      - from: PLANNED
        to: COVERAGE_GAP_FLAGGED
        trigger: "POST /inspection/shift-windows/{id}/verify-coverage when final_gap_minutes > 0"
        actor: Inspector
        preconditions: ["status IN {PLANNED, COVERAGE_GAP_FLAGGED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "provisional_gap_minutes and final_gap_minutes recomputed and stored"
          - "If shift_type == SLAUGHTER: auto-create a NoncomplianceRecord (regulation_family=OTHER, description='inspection presence gap', observed_at=logical clock, issued_by = the verifying inspector, status=OPEN)"
      - from: COVERAGE_GAP_FLAGGED
        to: VERIFIED_COVERED
        trigger: "POST /inspection/shift-windows/{id}/verify-coverage when final_gap_minutes == 0"
        actor: Inspector
        preconditions: ["status IN {PLANNED, COVERAGE_GAP_FLAGGED} (else ERR_INVALID_STATE)"]
        side_effects: ["provisional_gap_minutes and final_gap_minutes recomputed and stored"]
      - from: PLANNED
        to: BLOCKED
        trigger: "system cascade: establishment inspection_status -> SUSPENDED or grant withdrawn"
        actor: system
        preconditions: []
        side_effects: []
      - from: COVERAGE_GAP_FLAGGED
        to: BLOCKED
        trigger: "system cascade: establishment inspection_status -> SUSPENDED or grant withdrawn"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ShiftAssignment
    initial_state: SCHEDULED
    terminal_states: [CONFIRMED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CONFIRMED
        trigger: "POST /inspection/shift-assignments/{id}/confirm"
        actor: Inspector
        preconditions:
          - "status == SCHEDULED (else ERR_INVALID_STATE)"
          - "X-User-ID == ShiftAssignment.inspector_id (else ERR_FORBIDDEN)"
        side_effects: []
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /inspection/shift-assignments/{id}/cancel, or cascade from inspector deactivation"
        actor: ProgramAdministrator | system
        preconditions: ["status == SCHEDULED (else ERR_INVALID_STATE)"]
        side_effects: []

  - entity: NoncomplianceRecord
    initial_state: OPEN
    terminal_states: [VERIFIED, VACATED]
    transitions:
      - from: OPEN
        to: RESPONSE_SUBMITTED
        trigger: "POST /inspection/noncompliance-records/{id}/respond"
        actor: EstablishmentManager
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE)"
          - "X-User-ID == NoncomplianceRecord.establishment_id (else ERR_FORBIDDEN)"
        side_effects: ["response_text stored"]
      - from: OPEN
        to: ESCALATED
        trigger: "POST /inspection/noncompliance-records/{id}/verify-response with outcome=ESCALATE"
        actor: Inspector
        preconditions: ["status IN {OPEN, RESPONSE_SUBMITTED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "If qualifying-NR count for (establishment, regulation_family) within the trailing NR_ESCALATION_WINDOW_DAYS reaches NR_ESCALATION_THRESHOLD: auto-create EnforcementAction(action_type=SUSPENSION, basis=NR_LINKAGE, regulation_family=this family, status=PROPOSED, auto_created=true)"
      - from: RESPONSE_SUBMITTED
        to: ESCALATED
        trigger: "POST /inspection/noncompliance-records/{id}/verify-response with outcome=ESCALATE"
        actor: Inspector
        preconditions: ["status IN {OPEN, RESPONSE_SUBMITTED} (else ERR_INVALID_STATE)"]
        side_effects:
          - "Same escalation auto-creation rule as OPEN -> ESCALATED"
      - from: OPEN
        to: VERIFIED
        trigger: "POST /inspection/noncompliance-records/{id}/verify-response with outcome=VERIFY"
        actor: Inspector
        preconditions: ["status IN {OPEN, RESPONSE_SUBMITTED} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: RESPONSE_SUBMITTED
        to: VERIFIED
        trigger: "POST /inspection/noncompliance-records/{id}/verify-response with outcome=VERIFY"
        actor: Inspector
        preconditions: ["status IN {OPEN, RESPONSE_SUBMITTED} (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: OPEN
        to: APPEALED
        trigger: "POST /inspection/appeals filing against this NR"
        actor: EstablishmentManager
        preconditions: ["status IN {OPEN, RESPONSE_SUBMITTED, ESCALATED} (else ERR_INVALID_STATE)"]
        side_effects: ["status_before_appeal = prior status"]
      - from: RESPONSE_SUBMITTED
        to: APPEALED
        trigger: "POST /inspection/appeals filing against this NR"
        actor: EstablishmentManager
        preconditions: ["status IN {OPEN, RESPONSE_SUBMITTED, ESCALATED} (else ERR_INVALID_STATE)"]
        side_effects: ["status_before_appeal = prior status"]
      - from: ESCALATED
        to: APPEALED
        trigger: "POST /inspection/appeals filing against this NR"
        actor: EstablishmentManager
        preconditions: ["status IN {OPEN, RESPONSE_SUBMITTED, ESCALATED} (else ERR_INVALID_STATE)"]
        side_effects: ["status_before_appeal = prior status"]
      - from: APPEALED
        to: OPEN
        trigger: "Appeal decided REMAND"
        actor: SupervisoryReviewer
        preconditions: []
        side_effects: []
      - from: APPEALED
        to: ESCALATED
        trigger: "Appeal decided AFFIRM"
        actor: SupervisoryReviewer
        preconditions: []
        side_effects:
          - "Same escalation auto-creation rule as verify-response ESCALATE (re-evaluated at affirm time)"
      - from: APPEALED
        to: VACATED
        trigger: "Appeal decided VACATE"
        actor: SupervisoryReviewer
        preconditions: []
        side_effects: ["NR is excluded from open_nr_count, escalation counts, and risk scores"]

  - entity: EnforcementAction
    initial_state: PROPOSED
    terminal_states: [LIFTED]
    transitions:
      - from: PROPOSED
        to: IN_EFFECT
        trigger: "POST /inspection/enforcement-actions/{id}/activate"
        actor: DistrictManager
        preconditions:
          - "status == PROPOSED (else ERR_INVALID_STATE)"
          - "Basis-specific eligibility still holds at activation time (re-evaluated; see validations priority 8)"
        side_effects:
          - "effective_at = logical clock"
          - "action_type == SUSPENSION: Establishment.inspection_status ACTIVE -> SUSPENDED (cascades to ShiftWindows and LabelApplications per Establishment machine)"
          - "action_type == WITHHOLD_MARKS: all LabelApplications of the establishment in SUBMITTED or UNDER_REVIEW -> HELD"
          - "action_type == WITHDRAWAL: Establishment.grant_status -> WITHDRAWN (terminal cascade per Establishment machine)"
          - "action_type == NOTICE_OF_INTENDED_ENFORCEMENT: no direct state change on other entities"
      - from: IN_EFFECT
        to: LIFTED
        trigger: "POST /inspection/enforcement-actions/{id}/lift"
        actor: DistrictManager
        preconditions:
          - "status == IN_EFFECT (else ERR_INVALID_STATE)"
          - "abatement_evidence present, >= 20 characters (else ERR_INVALID_REQUEST)"
        side_effects:
          - "abatement_evidence stored"
          - "action_type == SUSPENSION: Establishment.inspection_status SUSPENDED -> ACTIVE"
          - "action_type == WITHHOLD_MARKS: all LabelApplications of the establishment in HELD -> their pre-hold status (SUBMITTED or UNDER_REVIEW)"

  - entity: HumaneHandlingEvent
    initial_state: REPORTED
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: REPORTED
        to: CONFIRMED
        trigger: "POST /inspection/humane-handling-events/{id}/confirm"
        actor: SupervisoryReviewer
        preconditions:
          - "status == REPORTED (else ERR_INVALID_STATE)"
          - "X-User-ID != HumaneHandlingEvent.reported_by_inspector_id (segregation of duties; else ERR_SOD_REVIEWER_IS_ISSUER)"
        side_effects:
          - "If severity == EGREGIOUS: auto-create EnforcementAction(action_type=SUSPENSION, basis=EGREGIOUS_HUMANE, status=IN_EFFECT, auto_created=true, effective_at=logical clock), which itself cascades: Establishment.inspection_status -> SUSPENDED (suspension_count += 1), then that suspension cascades: PLANNED/COVERAGE_GAP_FLAGGED ShiftWindows -> BLOCKED and UNDER_REVIEW LabelApplications -> HELD"
          - "If severity == NON_EGREGIOUS: no enforcement cascade"
      - from: REPORTED
        to: DISMISSED
        trigger: "POST /inspection/humane-handling-events/{id}/dismiss"
        actor: SupervisoryReviewer
        preconditions:
          - "status == REPORTED (else ERR_INVALID_STATE)"
          - "X-User-ID != HumaneHandlingEvent.reported_by_inspector_id (else ERR_SOD_REVIEWER_IS_ISSUER)"
        side_effects: []

  - entity: PathogenSample
    initial_state: PENDING
    terminal_states: [POSITIVE, NEGATIVE]
    transitions:
      - from: PENDING
        to: POSITIVE
        trigger: "POST /inspection/pathogen-samples/{id}/record-result with result=POSITIVE"
        actor: Inspector
        preconditions: ["result == PENDING (else ERR_INVALID_STATE)"]
        side_effects:
          - "resulted_at = logical clock"
          - "Establishment.pathogen_category recomputed per calculations.pathogen_categorization (per pathogen)"
          - "If the recomputed category for ANY pathogen transitions to CAT_3 from a different value: auto-create EnforcementAction(action_type=NOTICE_OF_INTENDED_ENFORCEMENT, basis=CATEGORY_3_PATHOGEN, status=IN_EFFECT, auto_created=true, effective_at=logical clock)"
      - from: PENDING
        to: NEGATIVE
        trigger: "POST /inspection/pathogen-samples/{id}/record-result with result=NEGATIVE"
        actor: Inspector
        preconditions: ["result == PENDING (else ERR_INVALID_STATE)"]
        side_effects:
          - "resulted_at = logical clock"
          - "Establishment.pathogen_category recomputed (same rule as POSITIVE; CAT_3 transition cascade applies)"

  - entity: LabelApplication
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /inspection/label-applications/{id}/begin-review"
        actor: LabelOfficer
        preconditions: ["status == SUBMITTED (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /inspection/label-applications/{id}/decide with decision=APPROVE"
        actor: LabelOfficer
        preconditions:
          - "status == UNDER_REVIEW (else ERR_INVALID_STATE)"
          - "Establishment.grant_status == GRANTED (else ERR_ESTABLISHMENT_NOT_GRANTED)"
          - "Establishment.inspection_status != SUSPENDED (else ERR_ESTABLISHMENT_SUSPENDED)"
          - "documentation_refs count >= label_documentation_minimum[label_claim] (else ERR_INSUFFICIENT_DOCUMENTATION)"
        side_effects: []
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /inspection/label-applications/{id}/decide with decision=REJECT"
        actor: LabelOfficer
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: UNDER_REVIEW
        to: RETURNED
        trigger: "POST /inspection/label-applications/{id}/decide with decision=RETURN"
        actor: LabelOfficer
        preconditions: ["status == UNDER_REVIEW (else ERR_INVALID_STATE)"]
        side_effects: []
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /inspection/label-applications/{id}/resubmit"
        actor: EstablishmentManager
        preconditions:
          - "status == RETURNED (else ERR_INVALID_STATE)"
          - "X-User-ID == LabelApplication.establishment_id (else ERR_FORBIDDEN)"
          - "Establishment.inspection_status != SUSPENDED (else ERR_ESTABLISHMENT_SUSPENDED)"
        side_effects: ["revision_count += 1", "documentation_refs replaced by the request payload"]
      - from: UNDER_REVIEW
        to: HELD
        trigger: "system cascade: SUSPENSION activated or WITHHOLD_MARKS activated"
        actor: system
        preconditions: []
        side_effects: []
      - from: HELD
        to: UNDER_REVIEW
        trigger: "system cascade: the holding EnforcementAction is lifted"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Recall
    initial_state: INITIATED
    terminal_states: [CLOSED_EFFECTIVE, CLOSED_INEFFECTIVE]
    transitions:
      - from: INITIATED
        to: CLASS_DETERMINED
        trigger: "POST /inspection/recalls/{id}/determine-class"
        actor: DistrictManager
        preconditions: ["status == INITIATED (else ERR_INVALID_STATE)"]
        side_effects:
          - "recall_class set from payload"
          - "required_min_checks and required_effectiveness_ratio set per calculations.recall_class_requirements"
      - from: CLASS_DETERMINED
        to: CLOSED_EFFECTIVE
        trigger: "POST /inspection/recalls/{id}/close when checks_performed >= required_min_checks AND effectiveness_ratio >= required_effectiveness_ratio"
        actor: RecallCoordinator
        preconditions:
          - "status == CLASS_DETERMINED (else ERR_INVALID_STATE)"
          - "checks_performed >= required_min_checks (else ERR_EFFECTIVENESS_CRITERIA_NOT_MET)"
        side_effects: []
      - from: CLASS_DETERMINED
        to: CLOSED_INEFFECTIVE
        trigger: "POST /inspection/recalls/{id}/close when checks_performed >= required_min_checks AND effectiveness_ratio < required_effectiveness_ratio"
        actor: RecallCoordinator
        preconditions:
          - "status == CLASS_DETERMINED (else ERR_INVALID_STATE)"
          - "checks_performed >= required_min_checks (else ERR_EFFECTIVENESS_CRITERIA_NOT_MET)"
        side_effects: []
      - from: CLOSED_INEFFECTIVE
        to: CLASS_DETERMINED
        trigger: "POST /inspection/recalls/{id}/determine-class with a stricter or revised class (re-classification cycle)"
        actor: DistrictManager
        preconditions: ["status IN {INITIATED, CLOSED_INEFFECTIVE} (else ERR_INVALID_STATE)"]
        side_effects:
          - "recall_class replaced; required_min_checks and required_effectiveness_ratio recomputed"
          - "checks_performed, checks_effective, effectiveness_ratio RESET to 0 / 0 / null (new classification restarts effectiveness evidence)"
        note: "This is the recall re-classification cycle: an ineffective recall is reclassified and re-monitored"

  - entity: Appeal
    initial_state: FILED
    terminal_states: [AFFIRMED, REMANDED, VACATED]
    transitions:
      - from: FILED
        to: AFFIRMED
        trigger: "POST /inspection/appeals/{id}/decide with outcome=AFFIRM"
        actor: SupervisoryReviewer
        preconditions:
          - "status == FILED (else ERR_INVALID_STATE)"
          - "NoncomplianceRecord.status == APPEALED (else ERR_INVALID_STATE)"
          - "X-User-ID != NoncomplianceRecord.issued_by_inspector_id (else ERR_SOD_REVIEWER_IS_ISSUER)"
        side_effects:
          - "decided_by_reviewer_id = X-User-ID; decided_at = logical clock"
          - "NoncomplianceRecord APPEALED -> ESCALATED (escalation auto-creation re-evaluated)"
      - from: FILED
        to: REMANDED
        trigger: "POST /inspection/appeals/{id}/decide with outcome=REMAND"
        actor: SupervisoryReviewer
        preconditions:
          - "status == FILED (else ERR_INVALID_STATE)"
          - "NoncomplianceRecord.status == APPEALED (else ERR_INVALID_STATE)"
          - "X-User-ID != NoncomplianceRecord.issued_by_inspector_id (else ERR_SOD_REVIEWER_IS_ISSUER)"
        side_effects:
          - "decided_by_reviewer_id = X-User-ID; decided_at = logical clock"
          - "NoncomplianceRecord APPEALED -> OPEN"
      - from: FILED
        to: VACATED
        trigger: "POST /inspection/appeals/{id}/decide with outcome=VACATE"
        actor: SupervisoryReviewer
        preconditions:
          - "status == FILED (else ERR_INVALID_STATE)"
          - "NoncomplianceRecord.status == APPEALED (else ERR_INVALID_STATE)"
          - "X-User-ID != NoncomplianceRecord.issued_by_inspector_id (else ERR_SOD_REVIEWER_IS_ISSUER)"
        side_effects:
          - "decided_by_reviewer_id = X-User-ID; decided_at = logical clock"
          - "NoncomplianceRecord APPEALED -> VACATED"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; see filter in SKILL.md)
# =============================================================================
concurrency_rules:
  - rule_id: enforcement-create-stale-establishment
    parent_entity: Establishment
    write_endpoint: "POST /inspection/establishments/{id}/enforcement-actions"
    occ_field: "expected_establishment_version"
    description: |
      Creating an EnforcementAction against an Establishment whose version has
      advanced since the client last observed it (for example because a
      categorization cascade or a grant decision mutated the establishment in
      between) is rejected with a stale-version error. The client's view of the
      establishment's posture is stale; the creation must be re-based.
    error_id: ERR_STALE_ESTABLISHMENT_VERSION
    http_status: 412
  - rule_id: assignment-create-stale-shift-window
    parent_entity: ShiftWindow
    write_endpoint: "POST /inspection/shift-windows/{id}/assignments"
    occ_field: "expected_shift_window_version"
    description: |
      Adding a ShiftAssignment to a ShiftWindow whose version has advanced
      since the client last observed it (for example because a prior assignment
      creation bumped the window's version) is rejected with a stale-version
      error; the client must re-read the window before stacking more coverage.
    error_id: ERR_STALE_SHIFT_WINDOW_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: shift_coverage_gap
    trigger: "POST /inspection/shift-windows/{id}/verify-coverage"
    algorithm: interval_merge
    formula: |
      Per line L in 1..planned_line_count, collect the non-CANCELLED assignments
      of the matching variant whose line_index == L; merge their half-open
      [start_utc, end_utc) intervals; uncovered_minutes(L) = minutes of
      [ShiftWindow.start_utc, ShiftWindow.end_utc) not covered by the merged
      intervals. Adjacent intervals (one's end_utc == the next's start_utc)
      leave ZERO uncovered minutes between them.
      gap_minutes = sum over L of uncovered_minutes(L).
    input_set: "ShiftAssignments of this ShiftWindow with status filtered per variant"
    constants:
      ADJACENCY: "half-open intervals; end == next start is continuous coverage"
    precision: "integer minutes"
    variants:
      - name: PROVISIONAL
        when: "planning-time projection stored as provisional_gap_minutes"
        difference: "input set = assignments with status IN {SCHEDULED, CONFIRMED}"
      - name: FINAL
        when: "verification-time actuals stored as final_gap_minutes and used for the VERIFIED_COVERED vs COVERAGE_GAP_FLAGGED transition"
        difference: "input set = assignments with status == CONFIRMED only; for the same rows this yields a strictly larger-or-equal gap than PROVISIONAL"

  - name: establishment_risk_score
    trigger: "computed on every read of Establishment"
    algorithm: decay_function
    formula: |
      family_weight = {SANITATION: 2, HACCP: 3, HUMANE: 5, LABELING: 1, OTHER: 1}
      recency_factor(age_days) = 3 if age_days <= 30; 2 if 31..60; 1 if 61..90.
      rolling_risk_score = sum over NRs of this establishment with status IN
        {OPEN, RESPONSE_SUBMITTED, ESCALATED, APPEALED} AND issued_at within the
        trailing 90 days of the logical clock of family_weight * recency_factor.
      lifetime_risk_score = sum over ALL NRs of this establishment with status
        != VACATED of family_weight (no recency, no window).
    input_set: "NoncomplianceRecords of the establishment; rolling variant filters by window and status; lifetime variant filters out VACATED only"
    constants:
      ROLLING_WINDOW_DAYS: 90
      WEIGHT_SANITATION: 2
      WEIGHT_HACCP: 3
      WEIGHT_HUMANE: 5
      WEIGHT_LABELING: 1
      WEIGHT_OTHER: 1
      RECENCY_BAND_1_DAYS: 30
      RECENCY_BAND_2_DAYS: 60
    precision: "integer points"
    variants:
      - name: ROLLING
        when: "reported as the establishment's current operational risk"
        difference: "windowed + recency-weighted; an NR older than 90 days contributes 0"
      - name: LIFETIME
        when: "reported for trend auditing"
        difference: "unwindowed, unweighted by recency; strictly >= the rolling value for identical NR rows"

  - name: pathogen_categorization
    trigger: "POST /inspection/pathogen-samples/{id}/record-result (after result stored)"
    algorithm: threshold
    formula: |
      Per pathogen P, over samples of this establishment with pathogen == P,
      result IN {POSITIVE, NEGATIVE}, and resulted_at within the trailing
      SAMPLING_WINDOW_DAYS of the logical clock:
        resulted_count(P) = count; positive_count(P) = count of POSITIVE.
      If resulted_count(P) < MIN_SAMPLES_FOR_CATEGORIZATION: P contributes no
        categorization.
      Else positive_rate(P) = positive_count(P) / resulted_count(P), and:
        CAT_1 candidate if positive_rate(P) <= 0.5 * STANDARD_RATE[P]
        CAT_2 candidate if positive_rate(P) <= STANDARD_RATE[P]
        CAT_3 candidate if positive_rate(P) > STANDARD_RATE[P]
      Boundary: a rate exactly EQUAL to STANDARD_RATE[P] is CAT_2 (<=), never
      CAT_3; a rate exactly equal to half the standard is CAT_1 (<=).
      Establishment.pathogen_category = the WORST category across pathogens
      that have sufficient samples (CAT_3 > CAT_2 > CAT_1); if no pathogen has
      sufficient samples, category is unchanged (null if never categorized).
    input_set: "PathogenSamples of the establishment, resulted within window"
    constants:
      SAMPLING_WINDOW_DAYS: 90
      MIN_SAMPLES_FOR_CATEGORIZATION: 10
      SALMONELLA_STANDARD_RATE: 0.10
      CAMPYLOBACTER_STANDARD_RATE: 0.15
    precision: "rates compared as exact rationals (positive_count/resulted_count); no rounding before comparison"

  - name: monthly_compliance_score
    trigger: "computed on every read of Establishment (field compliance_score)"
    algorithm: weighted_scoring
    formula: |
      For each family F in {SANITATION, HACCP, HUMANE}:
        open_F = count of NRs of this establishment with regulation_family == F
                 and status IN {OPEN, RESPONSE_SUBMITTED, ESCALATED, APPEALED}
        family_penalty_F = round_half_up(open_F * NR_PENALTY_NUMERATOR / NR_PENALTY_DENOMINATOR, 1)
      compliance_score = 100 - (family_penalty_SANITATION + family_penalty_HACCP + family_penalty_HUMANE)
      ROUNDING ORDER IS PINNED (mode: nested rounding): round each family
      penalty to 0.1 FIRST, then subtract the sum of the ROUNDED penalties
      from 100; the result is exact at the 0.1 scale and is NOT rounded again.
      The non-conformant alternative (sum the raw thirds, subtract, round once)
      differs: with one OPEN NR in each family the pinned order yields
      100 - (3.3 + 3.3 + 3.3) = 90.1, the alternative yields 90.0.
    input_set: "NoncomplianceRecords of the establishment in the four non-terminal statuses"
    constants:
      NR_PENALTY_NUMERATOR: 10
      NR_PENALTY_DENOMINATOR: 3
      PASS_THRESHOLD: 80.0
    precision: "per-family penalty 1 decimal round_half_up; final subtraction exact, unrounded"

  - name: enforcement_priority_score
    trigger: "computed on every read of Establishment (field enforcement_priority_score)"
    algorithm: aggregation
    formula: |
      EVALUATION ORDER IS PINNED (removes the circularity between score and
      tier): (1) base = 10 * open_nr_count + 25 * suspension_count, computed
      from CURRENT Establishment fields; (2) tier is derived FROM base ALONE:
      base >= 100 -> HIGH (bonus 15); 50 <= base < 100 -> MEDIUM (bonus 10);
      base < 50 -> LOW (bonus 5); (3) score = base + bonus. The tier must NOT
      be derived from the post-bonus score.
    input_set: "Establishment.open_nr_count and Establishment.suspension_count"
    constants:
      OPEN_NR_POINTS: 10
      SUSPENSION_POINTS: 25
      TIER_HIGH_MIN: 100
      TIER_MEDIUM_MIN: 50
      BONUS_HIGH: 15
      BONUS_MEDIUM: 10
      BONUS_LOW: 5
    precision: "integer points"

  - name: nr_escalation_count
    trigger: "NoncomplianceRecord transitions INTO ESCALATED (via verify-response ESCALATE or appeal AFFIRM)"
    algorithm: chronological
    formula: |
      qualifying = NRs of this establishment with
        regulation_family == the transitioning NR's family,
        status IN {OPEN, RESPONSE_SUBMITTED, ESCALATED}   # APPEALED and VACATED excluded
        (the just-escalated NR included, now counted in its ESCALATED state),
        issued_at within the trailing NR_ESCALATION_WINDOW_DAYS of the logical
        clock (inclusive of the boundary day).
      If count(qualifying) >= NR_ESCALATION_THRESHOLD, auto-create the PROPOSED
      SUSPENSION EnforcementAction described in the state machine. The count is
      evaluated at the moment of the transition; exactly-at-threshold fires.
    input_set: "NoncomplianceRecords of the establishment, one family, trailing window"
    constants:
      NR_ESCALATION_THRESHOLD: 3
      NR_ESCALATION_WINDOW_DAYS: 90
    precision: "integer count; >= comparison"

  - name: recall_class_requirements
    trigger: "POST /inspection/recalls/{id}/determine-class"
    algorithm: threshold
    formula: |
      CLASS_I:   required_min_checks = 10, required_effectiveness_ratio = 0.95
      CLASS_II:  required_min_checks = 5,  required_effectiveness_ratio = 0.80
      CLASS_III: required_min_checks = 4,  required_effectiveness_ratio = 0.75
      effectiveness_ratio = round_half_up(checks_effective / checks_performed, 2)
      Closure rule at close time: checks_performed >= required_min_checks, then
      CLOSED_EFFECTIVE iff effectiveness_ratio >= required_effectiveness_ratio
      (equality closes as EFFECTIVE), else CLOSED_INEFFECTIVE.
    input_set: "RecallEffectivenessCheck rows of the recall since the last determine-class"
    constants:
      CLASS_I_MIN_CHECKS: 10
      CLASS_I_MIN_RATIO: 0.95
      CLASS_II_MIN_CHECKS: 5
      CLASS_II_MIN_RATIO: 0.80
      CLASS_III_MIN_CHECKS: 4
      CLASS_III_MIN_RATIO: 0.75
    precision: "ratio 2 decimal places round_half_up; comparison >= against the literal threshold"

  - name: label_documentation_minimum
    trigger: "POST /inspection/label-applications/{id}/decide with decision=APPROVE"
    algorithm: threshold
    formula: |
      required = {GRASS_FED: 2, NO_ANTIBIOTICS: 2, ORGANIC: 3, BREED_SPECIFIC: 1}
      Approve requires len(documentation_refs) >= required[label_claim];
      exactly-at-minimum passes.
    input_set: "LabelApplication.documentation_refs"
    constants:
      DOCS_GRASS_FED: 2
      DOCS_NO_ANTIBIOTICS: 2
      DOCS_ORGANIC: 3
      DOCS_BREED_SPECIFIC: 1
    precision: "integer count; >= comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role must be a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Resource ids in path (validated left-to-right) and body-supplied FK references exist"
    error_id: "ERR_ESTABLISHMENT_NOT_FOUND | ERR_GRANT_APPLICATION_NOT_FOUND | ERR_INSPECTOR_NOT_FOUND | ERR_SHIFT_WINDOW_NOT_FOUND | ERR_SHIFT_ASSIGNMENT_NOT_FOUND | ERR_NONCOMPLIANCE_RECORD_NOT_FOUND | ERR_ENFORCEMENT_ACTION_NOT_FOUND | ERR_HUMANE_EVENT_NOT_FOUND | ERR_PATHOGEN_SAMPLE_NOT_FOUND | ERR_LABEL_APPLICATION_NOT_FOUND | ERR_RECALL_NOT_FOUND | ERR_APPEAL_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK inputs"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version (endpoints declared in §1.2.1)"
    error_id: "ERR_STALE_ESTABLISHMENT_VERSION | ERR_STALE_SHIFT_WINDOW_VERSION"
    http_status: 412
    applies_to: "POST /inspection/establishments/{id}/enforcement-actions, POST /inspection/shift-windows/{id}/assignments"
    note: "evaluated after existence, before all business rules"
  - priority: 5
    category: state
    check: "Target entity is in a state from which the requested transition is defined (per §1.2); includes ERR_ESTABLISHMENT_SUSPENDED for operations barred during suspension and ERR_ESTABLISHMENT_NOT_GRANTED / ERR_ESTABLISHMENT_WITHDRAWN for grant-gated operations"
    error_id: "ERR_INVALID_STATE | ERR_ESTABLISHMENT_NOT_GRANTED | ERR_ESTABLISHMENT_SUSPENDED | ERR_ESTABLISHMENT_WITHDRAWN | ERR_INSPECTOR_INACTIVE"
    http_status: 409
    applies_to: "all action/transition endpoints"
  - priority: 6
    category: business_safety
    check: "Inspector qualification/employment gates: assignment inspector employment_status == ACTIVE; inspector.species_qualifications covers EVERY member of the shift establishment's species_classes"
    error_id: "ERR_INSPECTOR_INACTIVE (state, priority 5 when deactivated) | ERR_INSPECTOR_NOT_QUALIFIED"
    http_status: 422
    applies_to: "POST /inspection/shift-windows/{id}/assignments"
  - priority: 7
    category: business_temporal
    check: "Temporal rules: observed_at/collected_at/checked_at must be <= logical clock; assignment interval inside its window and end_utc > start_utc; no same-line overlapping assignments (half-open); cross-establishment assignments of one inspector separated by >= TRAVEL_BUFFER_MINUTES"
    error_id: "ERR_FUTURE_OBSERVATION | ERR_INVALID_REQUEST | ERR_ASSIGNMENT_OVERLAP | ERR_TRAVEL_BUFFER_VIOLATION"
    http_status: 422
    applies_to: "create/record endpoints carrying timestamps or intervals"
    constants:
      TRAVEL_BUFFER_MINUTES: 30
  - priority: 8
    category: business_constraint
    check: "Aggregate/eligibility gates — enforcement basis eligibility, evaluated at create AND re-evaluated at activate: NOTICE_OF_INTENDED_ENFORCEMENT is always eligible; WITHHOLD_MARKS is eligible when the establishment has >= 1 qualifying NR (status IN {OPEN, RESPONSE_SUBMITTED, ESCALATED}, issued within NR_ESCALATION_WINDOW_DAYS) for the given regulation_family, or a CONFIRMED EGREGIOUS humane event, or pathogen_category == CAT_3, or basis == ADMINISTRATIVE; SUSPENSION requires basis NR_LINKAGE with qualifying count >= NR_ESCALATION_THRESHOLD, or basis EGREGIOUS_HUMANE with a CONFIRMED EGREGIOUS event, or basis CATEGORY_3_PATHOGEN with pathogen_category == CAT_3 (ADMINISTRATIVE is never eligible for SUSPENSION); WITHDRAWAL requires an IN_EFFECT SUSPENSION whose effective_at is at least WITHDRAWAL_ABATEMENT_DAYS before the logical clock OR at least WITHDRAWAL_SUSPENSION_COUNT SUSPENSION actions with status IN_EFFECT or LIFTED created within WITHDRAWAL_SUSPENSION_WINDOW_DAYS; label documentation minimums; recall close criteria"
    error_id: "ERR_ESCALATION_THRESHOLD_NOT_MET | ERR_WITHDRAWAL_CONDITIONS_NOT_MET | ERR_INSUFFICIENT_DOCUMENTATION | ERR_EFFECTIVENESS_CRITERIA_NOT_MET"
    http_status: 409
    applies_to: "enforcement create/activate, label decide, recall close"
    constants:
      WITHDRAWAL_ABATEMENT_DAYS: 30
      WITHDRAWAL_SUSPENSION_COUNT: 2
      WITHDRAWAL_SUSPENSION_WINDOW_DAYS: 365
  - priority: 9
    category: business_referential
    check: "Cross-entity field consistency: NR.shift_window_id (when provided) belongs to the same establishment as the NR; humane event species is a member of the establishment's species_classes; pathogen sample's establishment has grant_status == GRANTED"
    error_id: "ERR_SHIFT_WINDOW_MISMATCH | ERR_SPECIES_NOT_SUPPORTED | ERR_ESTABLISHMENT_NOT_GRANTED"
    http_status: 422
    applies_to: "POST /inspection/noncompliance-records, POST /inspection/humane-handling-events, POST /inspection/pathogen-samples"
  - priority: 10
    category: business_constraint
    check: "Segregation of duties: SupervisoryReviewer deciding an appeal or confirming/dismissing a humane event MUST NOT be the inspector who issued/reported it (X-User-ID compared to issued_by_inspector_id / reported_by_inspector_id)"
    error_id: ERR_SOD_REVIEWER_IS_ISSUER
    http_status: 403
    applies_to: "POST /inspection/appeals/{id}/decide, POST /inspection/humane-handling-events/{id}/confirm, POST /inspection/humane-handling-events/{id}/dismiss"
    note: "priority 10: evaluated AFTER state checks, so a SoD-violating decision on a non-FILED appeal reports the state error first"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Platform (outside api_prefix) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. BEFORE any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All window/deadline/expiry rules evaluate against this clock."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock := to_iso8601"]

  # --- Establishments ---
  - method: POST
    path: "/inspection/establishments"
    description: "Register an establishment (UNGRANTED x INACTIVE)"
    roles: [ProgramAdministrator]
    code: 201
    input: [name, species_classes, slaughter_capable]
    output: Establishment
    side_effects: ["grant_status=UNGRANTED, inspection_status=INACTIVE, version=1"]

  - method: GET
    path: "/inspection/establishments/{id}"
    description: "Get one establishment incl. computed fields (pathogen_category, open_nr_count, suspension_count, compliance_score, enforcement_priority_score)"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, LabelOfficer, RecallCoordinator, ProgramAdministrator]
    code: 200
    input: []
    output: Establishment
    side_effects: []

  # --- Grant Applications ---
  - method: POST
    path: "/inspection/grant-applications"
    description: "Submit a grant of inspection application"
    roles: [EstablishmentManager]
    code: 201
    input: [establishment_id, facility_doc_ref, sanitation_plan_ref, haccp_plan_ref]
    output: GrantApplication
    side_effects: ["status=SUBMITTED, findings=PENDING; X-User-ID must equal establishment_id (else ERR_FORBIDDEN)"]

  - method: GET
    path: "/inspection/establishments/{id}/grant-applications"
    description: "List grant applications of an establishment"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "GrantApplication[]"
    side_effects: []

  - method: POST
    path: "/inspection/grant-applications/{id}/begin-review"
    description: "Move application SUBMITTED -> UNDER_REVIEW"
    roles: [DistrictManager]
    code: 200
    input: []
    output: GrantApplication
    side_effects: []

  - method: POST
    path: "/inspection/grant-applications/{id}/record-adequacy"
    description: "Record one adequacy finding (facility, sanitation, or hazard plan)"
    roles: [DistrictManager]
    code: 200
    input: [dimension, finding]
    output: GrantApplication
    side_effects: ["sets the named finding; dimension in {FACILITY, SANITATION, HACCP}, finding in {ADEQUATE, DEFICIENT}"]

  - method: POST
    path: "/inspection/grant-applications/{id}/decide"
    description: "Grant or deny the application"
    roles: [DistrictManager]
    code: 200
    input: [decision]
    output: GrantApplication
    side_effects: ["GRANT: establishment grant_status -> GRANTED, inspection_status -> ACTIVE; DENY: status -> DENIED"]

  - method: POST
    path: "/inspection/grant-applications/{id}/resubmit"
    description: "Resubmit a DENIED application with refreshed document references (revision_count += 1, findings reset to PENDING)"
    roles: [EstablishmentManager]
    code: 200
    input: [facility_doc_ref, sanitation_plan_ref, haccp_plan_ref]
    output: GrantApplication
    side_effects: ["status DENIED -> SUBMITTED"]

  - method: POST
    path: "/inspection/grant-applications/{id}/withdraw"
    description: "Withdraw a SUBMITTED or UNDER_REVIEW application"
    roles: [EstablishmentManager]
    code: 200
    input: []
    output: GrantApplication
    side_effects: ["status -> WITHDRAWN; X-User-ID must equal establishment_id"]

  # --- Inspectors ---
  - method: POST
    path: "/inspection/inspectors"
    description: "Onboard an inspector"
    roles: [ProgramAdministrator]
    code: 201
    input: [full_name, badge_number, species_qualifications]
    output: Inspector
    side_effects: ["employment_status=ACTIVE; badge_number unique (else ERR_INVALID_REQUEST)"]

  - method: POST
    path: "/inspection/inspectors/{id}/deactivate"
    description: "Deactivate an inspector; cancels their SCHEDULED assignments"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Inspector
    side_effects: ["employment_status -> INACTIVE; SCHEDULED ShiftAssignments -> CANCELLED"]

  # --- Shift Windows ---
  - method: POST
    path: "/inspection/shift-windows"
    description: "Plan an operating shift for a GRANTED establishment"
    roles: [EstablishmentManager]
    code: 201
    input: [establishment_id, start_utc, end_utc, shift_type, planned_line_count]
    output: ShiftWindow
    side_effects: ["status=PLANNED; X-User-ID must equal establishment_id; establishment must be GRANTED and not WITHDRAWN"]

  - method: GET
    path: "/inspection/establishments/{id}/shift-windows"
    description: "List shift windows of an establishment"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ShiftWindow[]"
    side_effects: []

  - method: GET
    path: "/inspection/shift-windows/{id}"
    description: "Get one shift window incl. stored gap fields and version"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: []
    output: ShiftWindow
    side_effects: []

  - method: POST
    path: "/inspection/shift-windows/{id}/verify-coverage"
    description: "Recompute provisional/final coverage gaps; transition VERIFIED_COVERED or COVERAGE_GAP_FLAGGED; slaughter shifts with final gap > 0 auto-receive an OTHER-family NR"
    roles: [Inspector]
    code: 200
    input: []
    output: ShiftWindow
    side_effects: ["per ShiftWindow state machine; may auto-create a NoncomplianceRecord"]

  # --- Shift Assignments ---
  - method: POST
    path: "/inspection/shift-windows/{id}/assignments"
    description: "Assign an inspector to a coverage interval on one line of a shift window (OCC on window version)"
    roles: [ProgramAdministrator]
    code: 201
    input: [inspector_id, line_index, start_utc, end_utc, expected_shift_window_version]
    output: ShiftAssignment
    side_effects: ["increments ShiftWindow.version by 1; status=SCHEDULED"]

  - method: GET
    path: "/inspection/shift-assignments"
    description: "List/filter shift assignments"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: ["shift_window_id?", "establishment_id?", "inspector_id?", "status?", "limit?", "offset?"]
    output: "ShiftAssignment[]"
    side_effects: []

  - method: GET
    path: "/inspection/shift-assignments/{id}"
    description: "Get one shift assignment"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: []

  - method: POST
    path: "/inspection/shift-assignments/{id}/confirm"
    description: "Assigned inspector confirms presence (X-User-ID must equal inspector_id)"
    roles: [Inspector]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["status SCHEDULED -> CONFIRMED"]

  - method: POST
    path: "/inspection/shift-assignments/{id}/cancel"
    description: "Cancel a SCHEDULED assignment"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: ShiftAssignment
    side_effects: ["status SCHEDULED -> CANCELLED"]

  # --- Noncompliance Records ---
  - method: POST
    path: "/inspection/noncompliance-records"
    description: "Issue a noncompliance record"
    roles: [Inspector]
    code: 201
    input: [establishment_id, issued_by_inspector_id, "shift_window_id?", regulation_family, description, observed_at]
    output: NoncomplianceRecord
    side_effects: ["status=OPEN; issued_at=logical clock; X-User-ID must equal issued_by_inspector_id (else ERR_FORBIDDEN)"]

  - method: GET
    path: "/inspection/noncompliance-records"
    description: "List/filter noncompliance records"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: ["establishment_id?", "issued_by_inspector_id?", "shift_window_id?", "status?", "regulation_family?", "limit?", "offset?"]
    output: "NoncomplianceRecord[]"
    side_effects: []

  - method: GET
    path: "/inspection/noncompliance-records/{id}"
    description: "Get one noncompliance record"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: []
    output: NoncomplianceRecord
    side_effects: []

  - method: POST
    path: "/inspection/noncompliance-records/{id}/respond"
    description: "Establishment responds to an OPEN NR"
    roles: [EstablishmentManager]
    code: 200
    input: [response_text]
    output: NoncomplianceRecord
    side_effects: ["status OPEN -> RESPONSE_SUBMITTED"]

  - method: POST
    path: "/inspection/noncompliance-records/{id}/verify-response"
    description: "Inspector verifies corrective action (VERIFY) or escalates (ESCALATE); escalation may cross the linkage threshold"
    roles: [Inspector]
    code: 200
    input: [outcome]
    output: NoncomplianceRecord
    side_effects: ["per NoncomplianceRecord state machine incl. escalation auto-creation"]

  # --- Enforcement Actions ---
  - method: POST
    path: "/inspection/establishments/{id}/enforcement-actions"
    description: "Propose an enforcement action against an establishment (OCC on establishment version)"
    roles: [DistrictManager]
    code: 201
    input: [action_type, basis, "regulation_family?", expected_establishment_version]
    output: EnforcementAction
    side_effects: ["increments Establishment.version by 1; status=PROPOSED; basis eligibility validated per §1.4 priority 8"]

  - method: GET
    path: "/inspection/establishments/{id}/enforcement-actions"
    description: "List enforcement actions of an establishment; rows are returned in created_at ascending order (deterministic for indexed access)"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: ["status?", "action_type?", "limit?", "offset?"]
    output: "EnforcementAction[]"
    side_effects: []

  - method: POST
    path: "/inspection/enforcement-actions/{id}/activate"
    description: "Activate a PROPOSED enforcement action (basis re-evaluated)"
    roles: [DistrictManager]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: ["per EnforcementAction state machine incl. establishment suspension/withdrawal cascades"]

  - method: POST
    path: "/inspection/enforcement-actions/{id}/lift"
    description: "Lift an IN_EFFECT action with abatement evidence"
    roles: [DistrictManager]
    code: 200
    input: [abatement_evidence]
    output: EnforcementAction
    side_effects: ["per EnforcementAction state machine; SUSPENSION lift reinstates inspection_status ACTIVE"]

  # --- Humane Handling Events ---
  - method: POST
    path: "/inspection/humane-handling-events"
    description: "Report a humane handling observation"
    roles: [Inspector]
    code: 201
    input: [establishment_id, reported_by_inspector_id, species, severity, observed_at, description]
    output: HumaneHandlingEvent
    side_effects: ["status=REPORTED; X-User-ID must equal reported_by_inspector_id"]

  - method: GET
    path: "/inspection/humane-handling-events"
    description: "List/filter humane handling events"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: ["establishment_id?", "reported_by_inspector_id?", "status?", "severity?", "limit?", "offset?"]
    output: "HumaneHandlingEvent[]"
    side_effects: []

  - method: GET
    path: "/inspection/humane-handling-events/{id}"
    description: "Get one humane handling event"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: []
    output: HumaneHandlingEvent
    side_effects: []

  - method: POST
    path: "/inspection/humane-handling-events/{id}/confirm"
    description: "Supervisory confirmation; EGREGIOUS triggers immediate suspension authority cascade"
    roles: [SupervisoryReviewer]
    code: 200
    input: []
    output: HumaneHandlingEvent
    side_effects: ["per HumaneHandlingEvent state machine incl. auto SUSPENSION EnforcementAction IN_EFFECT"]

  - method: POST
    path: "/inspection/humane-handling-events/{id}/dismiss"
    description: "Supervisory dismissal of a reported event"
    roles: [SupervisoryReviewer]
    code: 200
    input: []
    output: HumaneHandlingEvent
    side_effects: ["status REPORTED -> DISMISSED"]

  # --- Pathogen Samples ---
  - method: POST
    path: "/inspection/pathogen-samples"
    description: "Log a pathogen sample collection"
    roles: [Inspector]
    code: 201
    input: [establishment_id, collected_by_inspector_id, pathogen, collected_at]
    output: PathogenSample
    side_effects: ["result=PENDING; X-User-ID must equal collected_by_inspector_id"]

  - method: GET
    path: "/inspection/pathogen-samples"
    description: "List/filter pathogen samples"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: ["establishment_id?", "collected_by_inspector_id?", "pathogen?", "result?", "limit?", "offset?"]
    output: "PathogenSample[]"
    side_effects: []

  - method: GET
    path: "/inspection/pathogen-samples/{id}"
    description: "Get one pathogen sample"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: []
    output: PathogenSample
    side_effects: []

  - method: POST
    path: "/inspection/pathogen-samples/{id}/record-result"
    description: "Record POSITIVE or NEGATIVE result; recomputes establishment pathogen_category; CAT_3 transition auto-creates an IN_EFFECT NOTICE_OF_INTENDED_ENFORCEMENT"
    roles: [Inspector]
    code: 200
    input: [result]
    output: PathogenSample
    side_effects: ["per PathogenSample state machine incl. categorization cascade"]

  # --- Label Applications ---
  - method: POST
    path: "/inspection/label-applications"
    description: "Submit a label claim application with production-practice documentation"
    roles: [EstablishmentManager]
    code: 201
    input: [establishment_id, product_name, label_claim, documentation_refs]
    output: LabelApplication
    side_effects: ["status=SUBMITTED; X-User-ID must equal establishment_id"]

  - method: GET
    path: "/inspection/establishments/{id}/label-applications"
    description: "List label applications of an establishment"
    roles: [EstablishmentManager, LabelOfficer, DistrictManager, ProgramAdministrator]
    code: 200
    input: ["status?", "label_claim?", "limit?", "offset?"]
    output: "LabelApplication[]"
    side_effects: []

  - method: POST
    path: "/inspection/label-applications/{id}/begin-review"
    description: "Move label application SUBMITTED -> UNDER_REVIEW"
    roles: [LabelOfficer]
    code: 200
    input: []
    output: LabelApplication
    side_effects: []

  - method: POST
    path: "/inspection/label-applications/{id}/decide"
    description: "Approve, reject, or return for revision"
    roles: [LabelOfficer]
    code: 200
    input: [decision]
    output: LabelApplication
    side_effects: ["decision in {APPROVE, REJECT, RETURN}; per LabelApplication state machine"]

  - method: POST
    path: "/inspection/label-applications/{id}/resubmit"
    description: "Resubmit a RETURNED application with refreshed documentation"
    roles: [EstablishmentManager]
    code: 200
    input: [documentation_refs]
    output: LabelApplication
    side_effects: ["status RETURNED -> SUBMITTED; revision_count += 1"]

  # --- Recalls ---
  - method: POST
    path: "/inspection/recalls"
    description: "Open a recall coordination case"
    roles: [RecallCoordinator]
    code: 201
    input: [establishment_id, product_description, quantity_lbs, reason_code]
    output: Recall
    side_effects: ["status=INITIATED"]

  - method: GET
    path: "/inspection/recalls/{id}"
    description: "Get one recall incl. derived effectiveness fields"
    roles: [EstablishmentManager, Inspector, DistrictManager, RecallCoordinator, ProgramAdministrator]
    code: 200
    input: []
    output: Recall
    side_effects: []

  - method: GET
    path: "/inspection/establishments/{id}/recalls"
    description: "List recalls of an establishment"
    roles: [EstablishmentManager, Inspector, DistrictManager, RecallCoordinator, ProgramAdministrator]
    code: 200
    input: ["status?", "recall_class?", "limit?", "offset?"]
    output: "Recall[]"
    side_effects: []

  - method: POST
    path: "/inspection/recalls/{id}/determine-class"
    description: "Set or re-set the recall class; on CLOSED_INEFFECTIVE this re-opens the recall (cycle) and resets effectiveness evidence"
    roles: [DistrictManager]
    code: 200
    input: [recall_class]
    output: Recall
    side_effects: ["per Recall state machine"]

  - method: POST
    path: "/inspection/recalls/{id}/effectiveness-checks"
    description: "Record one effectiveness check; recall derived counters update immediately"
    roles: [RecallCoordinator]
    code: 201
    input: [consignee_name, outcome, checked_at]
    output: RecallEffectivenessCheck
    side_effects: ["Recall.checks_performed += 1; checks_effective += 1 iff EFFECTIVE; effectiveness_ratio recomputed; requires Recall.status == CLASS_DETERMINED (else ERR_RECALL_CLASS_REQUIRED)"]

  - method: GET
    path: "/inspection/recalls/{id}/effectiveness-checks"
    description: "List effectiveness checks of a recall"
    roles: [EstablishmentManager, Inspector, DistrictManager, RecallCoordinator, ProgramAdministrator]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: "RecallEffectivenessCheck[]"
    side_effects: []

  - method: POST
    path: "/inspection/recalls/{id}/close"
    description: "Close a CLASS_DETERMINED recall; outcome computed from effectiveness criteria"
    roles: [RecallCoordinator]
    code: 200
    input: []
    output: Recall
    side_effects: ["-> CLOSED_EFFECTIVE or CLOSED_INEFFECTIVE per calculations.recall_class_requirements"]

  # --- Appeals ---
  - method: POST
    path: "/inspection/appeals"
    description: "Appeal an NR (NR status -> APPEALED, status_before_appeal recorded)"
    roles: [EstablishmentManager]
    code: 201
    input: [noncompliance_record_id, grounds]
    output: Appeal
    side_effects: ["status=FILED; X-User-ID must equal the NR's establishment_id; NR -> APPEALED"]

  - method: GET
    path: "/inspection/noncompliance-records/{id}/appeals"
    description: "List appeals filed against one noncompliance record"
    roles: [EstablishmentManager, Inspector, SupervisoryReviewer, DistrictManager, ProgramAdministrator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Appeal[]"
    side_effects: []

  - method: POST
    path: "/inspection/appeals/{id}/decide"
    description: "Supervisory decision: AFFIRM | REMAND | VACATE (segregation of duties enforced)"
    roles: [SupervisoryReviewer]
    code: 200
    input: [outcome]
    output: Appeal
    side_effects: ["per Appeal and NoncomplianceRecord state machines"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not declared in §1.7" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this endpoint, or entity_backed ownership check failed (X-User-ID mismatch)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type mismatch, invalid enum member, end_utc <= start_utc, interval outside its window, quantity_lbs <= 0, grounds < 10 chars, abatement_evidence < 20 chars, duplicate badge_number, empty species_classes" }
  - { id: ERR_ESTABLISHMENT_NOT_FOUND, http: 404, condition: "Establishment id does not exist" }
  - { id: ERR_GRANT_APPLICATION_NOT_FOUND, http: 404, condition: "GrantApplication id does not exist" }
  - { id: ERR_INSPECTOR_NOT_FOUND, http: 404, condition: "Inspector id does not exist" }
  - { id: ERR_SHIFT_WINDOW_NOT_FOUND, http: 404, condition: "ShiftWindow id does not exist" }
  - { id: ERR_SHIFT_ASSIGNMENT_NOT_FOUND, http: 404, condition: "ShiftAssignment id does not exist" }
  - { id: ERR_NONCOMPLIANCE_RECORD_NOT_FOUND, http: 404, condition: "NoncomplianceRecord id does not exist" }
  - { id: ERR_ENFORCEMENT_ACTION_NOT_FOUND, http: 404, condition: "EnforcementAction id does not exist" }
  - { id: ERR_HUMANE_EVENT_NOT_FOUND, http: 404, condition: "HumaneHandlingEvent id does not exist" }
  - { id: ERR_PATHOGEN_SAMPLE_NOT_FOUND, http: 404, condition: "PathogenSample id does not exist" }
  - { id: ERR_LABEL_APPLICATION_NOT_FOUND, http: 404, condition: "LabelApplication id does not exist" }
  - { id: ERR_RECALL_NOT_FOUND, http: 404, condition: "Recall id does not exist" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "Appeal id does not exist" }
  - { id: ERR_STALE_ESTABLISHMENT_VERSION, http: 412, condition: "expected_establishment_version does not match Establishment.version (see concurrency_rules.enforcement-create-stale-establishment)" }
  - { id: ERR_STALE_SHIFT_WINDOW_VERSION, http: 412, condition: "expected_shift_window_version does not match ShiftWindow.version (see concurrency_rules.assignment-create-stale-shift-window)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Entity not in a state from which the requested transition is defined (per §1.2); also covers terminal-state lockdown and double-transition attempts" }
  - { id: ERR_ESTABLISHMENT_NOT_GRANTED, http: 409, condition: "Operation requires Establishment.grant_status == GRANTED (shift planning, pathogen sampling, label approval, suspension activation)" }
  - { id: ERR_ESTABLISHMENT_SUSPENDED, http: 409, condition: "Operation barred while Establishment.inspection_status == SUSPENDED (assignment creation, label approval, shift planning)" }
  - { id: ERR_ESTABLISHMENT_WITHDRAWN, http: 409, condition: "Operation barred on a WITHDRAWN establishment (any operational write)" }
  - { id: ERR_INSPECTOR_INACTIVE, http: 409, condition: "Inspector.employment_status != ACTIVE for an inspector-gated operation" }
  - { id: ERR_GRANT_DECISION_BLOCKED, http: 409, condition: "decision=GRANT while any of facility/sanitation/haccp findings is not ADEQUATE" }
  - { id: ERR_ESCALATION_THRESHOLD_NOT_MET, http: 409, condition: "SUSPENSION with basis=NR_LINKAGE but qualifying-NR count for the family < NR_ESCALATION_THRESHOLD (3) within 90 days" }
  - { id: ERR_WITHDRAWAL_CONDITIONS_NOT_MET, http: 409, condition: "WITHDRAWAL without an IN_EFFECT SUSPENSION at least 30 days old and without >= 2 SUSPENSION actions within 365 days" }
  - { id: ERR_INSPECTOR_NOT_QUALIFIED, http: 422, condition: "Inspector.species_qualifications does not cover every member of the shift establishment's species_classes" }
  - { id: ERR_SPECIES_NOT_SUPPORTED, http: 422, condition: "Humane event species not in the establishment's species_classes" }
  - { id: ERR_ASSIGNMENT_OVERLAP, http: 409, condition: "Non-CANCELLED assignment exists on the same shift window and line_index whose [start_utc, end_utc) overlaps the request's (half-open; end == start is allowed)" }
  - { id: ERR_TRAVEL_BUFFER_VIOLATION, http: 409, condition: "Inspector has a non-CANCELLED assignment at a DIFFERENT establishment whose interval is within 30 minutes of the request's interval" }
  - { id: ERR_FUTURE_OBSERVATION, http: 422, condition: "observed_at / collected_at / checked_at is after the logical clock" }
  - { id: ERR_SHIFT_WINDOW_MISMATCH, http: 422, condition: "NR.shift_window_id references a ShiftWindow whose establishment_id differs from the NR's establishment_id" }
  - { id: ERR_INSUFFICIENT_DOCUMENTATION, http: 422, condition: "documentation_refs count below the label_claim minimum (2/2/3/1)" }
  - { id: ERR_SOD_REVIEWER_IS_ISSUER, http: 403, condition: "SupervisoryReviewer X-User-ID equals the NR issuer / humane event reporter (segregation of duties)" }
  - { id: ERR_RECALL_CLASS_REQUIRED, http: 409, condition: "Effectiveness check or close attempted before determine-class" }
  - { id: ERR_EFFECTIVENESS_CRITERIA_NOT_MET, http: 409, condition: "Recall close attempted with checks_performed < required_min_checks" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EstablishmentManager
    description: "Acts for one establishment; files grant applications and label applications, responds to and appeals NRs, plans shifts"
    identity: "entity_backed:Establishment"
    exclusive_operations:
      - "POST /inspection/grant-applications, .../resubmit, .../withdraw-side ownership"
      - "POST /inspection/shift-windows"
      - "POST /inspection/noncompliance-records/{id}/respond"
      - "POST /inspection/label-applications (+resubmit)"
      - "POST /inspection/appeals"
    shared_operations: ["GET read endpoints"]
  - name: Inspector
    description: "Field inspector; issues NRs, reports humane events, collects samples, verifies coverage, confirms own assignments"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspection/noncompliance-records"
      - "POST /inspection/noncompliance-records/{id}/verify-response"
      - "POST /inspection/humane-handling-events"
      - "POST /inspection/pathogen-samples (+record-result)"
      - "POST /inspection/shift-windows/{id}/verify-coverage"
      - "POST /inspection/shift-assignments/{id}/confirm (own assignments only)"
    shared_operations: ["GET read endpoints"]
  - name: SupervisoryReviewer
    description: "Supervisory reviewer; decides appeals and confirms/dismisses humane events; segregated from the issuing inspector by X-User-ID comparison"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspection/appeals/{id}/decide"
      - "POST /inspection/humane-handling-events/{id}/confirm, .../dismiss"
    shared_operations: ["GET read endpoints"]
  - name: DistrictManager
    description: "District office manager; grant decisions, enforcement action lifecycle, recall class determination"
    identity: "opaque"
    exclusive_operations:
      - "POST /inspection/grant-applications/{id}/begin-review, .../record-adequacy, .../decide"
      - "POST /inspection/establishments/{id}/enforcement-actions"
      - "POST /inspection/enforcement-actions/{id}/activate, .../lift"
      - "POST /inspection/recalls/{id}/determine-class"
    shared_operations: ["GET read endpoints"]
  - name: LabelOfficer
    description: "Labeling review staff"
    identity: "opaque"
    exclusive_operations:
      - "POST /inspection/label-applications/{id}/begin-review, .../decide"
    shared_operations: ["GET read endpoints"]
  - name: RecallCoordinator
    description: "Recall coordination staff; opens recalls, records effectiveness checks, closes recalls"
    identity: "opaque"
    exclusive_operations:
      - "POST /inspection/recalls"
      - "POST /inspection/recalls/{id}/effectiveness-checks, .../close"
    shared_operations: ["GET read endpoints"]
  - name: ProgramAdministrator
    description: "Agency operations admin; registers establishments and inspectors, builds shift coverage, drives the logical clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /inspection/establishments"
      - "POST /inspection/inspectors, .../deactivate"
      - "POST /inspection/shift-windows/{id}/assignments"
      - "POST /inspection/shift-assignments/{id}/cancel"
    shared_operations: ["GET read endpoints"]
