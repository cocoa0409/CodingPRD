            - call: "POST /api/v1/background-check-orders/${order_id}/verifications"
              payload: { verification_type: "EDUCATION" }
              as: Recruiter
              as_user_id: "rec-mary"
              captures: { edu_id: $.data.id, edu_v0: $.data.version }
            - call: "POST /api/v1/verifications/${mvr_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${mvr_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${edu_id}/report"
              payload: { result: "PASS", report_payload: {}, expected_verification_version: "${edu_v0}" }
              as: VerificationProvider
              as_user_id: "vp-1"
            - call: "POST /api/v1/verifications/${crim_id}/report"
