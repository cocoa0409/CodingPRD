scenario: "Section 8 Housing Choice Voucher: applicant income, Voucher issuance, Payment Standard, HQS annual inspection, rent reasonableness, Portability across regions, annual review, Special Mobility"
domain_name: section-8-housing-voucher
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - cross_aggregate_reference
    - optimistic_concurrency
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: Region
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Region code, e.g. 'METRO_NORTH'; uppercase A-Z and underscore"
        constraints: "unique across all Region; 3-40 chars"
      - name: name
        type: string
        source: input
        description: "Human-readable region name"
      - name: fmr_year
        type: integer
        source: input
        description: "Fair Market Rent schedule year this region's payment standards are based on"
      - name: is_special_mobility_area
        type: boolean
        source: input
        default: false
        description: "True if this region is a designated low-poverty Special Mobility opportunity area"

  - name: PaymentStandard
    parent: null
    common_fields: true
    fields:
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id; the region this payment standard applies to"
      - name: bedroom_size
        type: integer
        source: input
        description: "Bedroom count (0=studio, max 6) this standard covers"
        constraints: "0-6; unique together with region_id"
      - name: amount_cents
        type: integer
        source: input
        description: "Monthly payment standard in cents for this region + bedroom size"
        constraints: ">= 0"
      - name: fmr_cents
        type: integer
        source: input
        description: "Published Fair Market Rent in cents used to validate the payment standard band (90%-110%)"
        constraints: ">= 0"

  - name: Household
    parent: null
    common_fields: true
    fields:
      - name: head_name
        type: string
        source: input
        description: "Name of the head of household"
      - name: family_size
        type: integer
        source: input
        description: "Number of persons in the household"
        constraints: ">= 1"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Self-reported gross annual income in cents at application"
        constraints: ">= 0"
      - name: dependents_count
        type: integer
        source: input
        default: 0
        description: "Number of dependents (used for income deduction)"
        constraints: ">= 0"
      - name: elderly_or_disabled
        type: boolean
        source: input
        default: false
        description: "True if head of household is elderly (62+) or disabled (enables extra deduction)"
      - name: childcare_expense_cents
        type: integer
        source: input
        default: 0
        description: "Annual reasonable childcare expense in cents (income deduction)"
        constraints: ">= 0"
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id; the jurisdiction region where the household applied"
      - name: adjusted_annual_income_cents
        type: integer
        source: computed
        description: "Annual income minus statutory deductions; recomputed on annual review"
      - name: status
        type: enum
        source: system
        description: "Application/voucher lifecycle status of the household"
        default: APPLIED
        constraints: "one of APPLIED, ELIGIBLE, INELIGIBLE, VOUCHER_ISSUED, LEASED, TERMINATED"

  - name: Voucher
    parent: null
    common_fields: true
    fields:
      - name: household_id
        type: string
        source: input
        description: "FK -> Household.id; the household this voucher was issued to"
      - name: issuing_region_id
        type: string
        source: input
        description: "FK -> Region.id; the region of the PHA that issued the voucher"
      - name: bedroom_size
        type: integer
        source: computed
        description: "Voucher bedroom size derived from family_size via occupancy standard"
        constraints: "0-6"
      - name: issued_date
        type: datetime
        source: system
        description: "UTC timestamp the voucher was issued (term clock start)"
      - name: expiration_date
        type: datetime
        source: computed
        description: "issued_date + term_days; voucher must be leased up before this"
      - name: term_days
        type: integer
        source: input
        default: 60
        description: "Voucher search term in days before expiration"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Voucher lifecycle status"
        default: ISSUED
        constraints: "one of ISSUED, EXPIRED, PORTING_OUT, ABSORBED, LEASED, TERMINATED"

  - name: Unit
    parent: null
    common_fields: true
    fields:
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; the landlord that owns this unit"
      - name: region_id
        type: string
        source: input
        description: "FK -> Region.id; the region where the unit is physically located"
      - name: bedroom_size
        type: integer
        source: input
        description: "Bedroom count of the unit"
        constraints: "0-6"
      - name: asking_rent_cents
        type: integer
        source: input
        description: "Landlord's asking gross rent in cents per month"
        constraints: ">= 0"
      - name: comparable_rent_cents
        type: integer
        source: input
        description: "PHA's surveyed comparable market rent in cents (rent reasonableness basis)"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "Unit availability/inspection status"
        default: LISTED
        constraints: "one of LISTED, UNDER_CONTRACT, OFF_MARKET"

  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Landlord legal name"
      - name: payee_account
        type: string
        source: input
        description: "HAP payee account reference"

  - name: HapContract
    parent: null
    common_fields: true
    fields:
      - name: voucher_id
        type: string
        source: input
        description: "FK -> Voucher.id; the voucher leased under this Housing Assistance Payment contract"
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit leased under this contract"
      - name: contract_rent_cents
        type: integer
        source: input
        description: "Agreed gross contract rent in cents (must pass rent reasonableness)"
        constraints: ">= 0"
      - name: administering_region_id
        type: string
        source: computed
        description: "FK -> Region.id; region whose payment standard governs the subsidy (may differ from issuing under portability)"
      - name: total_tenant_payment_cents
        type: integer
        source: computed
        description: "Tenant's share (TTP) computed from adjusted income at lease-up"
      - name: hap_subsidy_cents
        type: integer
        source: computed
        description: "Monthly HAP subsidy paid to landlord = capped_subsidy"
      - name: tenant_rent_burden_cents
        type: integer
        source: computed
        description: "Tenant out-of-pocket share = contract_rent - hap_subsidy"
      - name: status
        type: enum
        source: system
        description: "HAP contract lifecycle status"
        default: ACTIVE
        constraints: "one of ACTIVE, ABATED, TERMINATED"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit being inspected"
      - name: hap_contract_id
        type: string
        source: input
        description: "FK -> HapContract.id; the contract whose annual HQS inspection this is (null for initial inspection)"
      - name: inspection_type
        type: enum
        source: input
        description: "Type of HQS inspection"
        constraints: "one of INITIAL, ANNUAL"
      - name: scheduled_date
        type: datetime
        source: input
        description: "UTC date the inspection is scheduled for"
      - name: cure_deadline
        type: datetime
        source: computed
        description: "If failed, scheduled_date + CURE_WINDOW_DAYS; landlord must cure by this date"
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle status"
        default: SCHEDULED
        constraints: "one of SCHEDULED, PASSED, FAILED, CURED, ABATED"

  - name: RentReasonablenessDetermination
    parent: null
    common_fields: false
    fields:
      - name: unit_id
        type: string
        source: input
        description: "FK -> Unit.id; the unit whose rent was evaluated"
      - name: requested_rent_cents
        type: integer
        source: input
        description: "The contract rent submitted for reasonableness review in cents"
      - name: comparable_rent_cents
        type: integer
        source: computed
        description: "Comparable market rent in cents copied from the unit at evaluation time"
      - name: outcome
        type: enum
        source: computed
        description: "Reasonableness determination outcome"
        constraints: "one of REASONABLE, NOT_REASONABLE"

  - name: PortabilityMove
    parent: null
    common_fields: true
    fields:
      - name: voucher_id
        type: string
        source: input
        description: "FK -> Voucher.id; the voucher being ported"
      - name: receiving_region_id
        type: string
        source: input
        description: "FK -> Region.id; the destination region the household wants to move to"
      - name: billing_mode
        type: enum
        source: computed
        description: "Whether receiving PHA bills the initial PHA (BILLING) or absorbs the voucher (ABSORPTION)"
        constraints: "one of BILLING, ABSORPTION"
      - name: status
        type: enum
        source: system
        description: "Portability move lifecycle status"
        default: REQUESTED
        constraints: "one of REQUESTED, APPROVED, ABSORBED, DENIED"

  - name: AnnualReview
    parent: null
    common_fields: true
    fields:
      - name: hap_contract_id
        type: string
        source: input
        description: "FK -> HapContract.id; the contract being re-examined"
      - name: new_annual_income_cents
        type: integer
        source: input
        description: "Re-verified gross annual income in cents at reexamination"
        constraints: ">= 0"
      - name: effective_date
        type: datetime
        source: input
        description: "UTC date the recomputed tenant share takes effect"
      - name: new_total_tenant_payment_cents
        type: integer
        source: computed
        description: "Recomputed TTP from the new income"
      - name: new_hap_subsidy_cents
        type: integer
        source: computed
        description: "Recomputed monthly HAP subsidy after the review"
      - name: status
        type: enum
        source: system
        description: "Annual review lifecycle status"
        default: DRAFT
        constraints: "one of DRAFT, FINALIZED"

  - name: SpecialMobilityGrant
    parent: null
    common_fields: true
    fields:
      - name: voucher_id
        type: string
        source: input
        description: "FK -> Voucher.id; the voucher receiving a mobility incentive"
      - name: target_region_id
        type: string
        source: input
        description: "FK -> Region.id; the opportunity area the household is incentivized to move to"
      - name: term_extension_days
        type: integer
        source: input
        default: 30
        description: "Extra search-term days granted to support the mobility move"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Special mobility grant lifecycle status"
        default: GRANTED
        constraints: "one of GRANTED, CONSUMED, REVOKED"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: Household
    initial_state: APPLIED
    terminal_states: [INELIGIBLE, TERMINATED]
    transitions:
      - from: APPLIED
        to: ELIGIBLE
        trigger: "POST /households/{id}/determine-eligibility"
        actor: Caseworker
        preconditions:
          - "Household.status == APPLIED"
          - "adjusted_annual_income (computed via income_eligibility calc) <= income_limit_for(family_size)"
        side_effects:
          - "set Household.adjusted_annual_income_cents via adjusted_income calculation"
          - "set Household.status = ELIGIBLE"
        note: "Income limit is 50% of region area median; see income_eligibility calc."
      - from: APPLIED
        to: INELIGIBLE
        trigger: "POST /households/{id}/determine-eligibility"
        actor: Caseworker
        preconditions:
          - "Household.status == APPLIED"
          - "adjusted_annual_income > income_limit_for(family_size)"
        side_effects:
          - "set Household.adjusted_annual_income_cents via adjusted_income calculation"
          - "set Household.status = INELIGIBLE"
      - from: ELIGIBLE
        to: VOUCHER_ISSUED
        trigger: "POST /vouchers (issue)"
        actor: Caseworker
        preconditions:
          - "Household.status == ELIGIBLE"
        side_effects:
          - "create Voucher in ISSUED with bedroom_size from occupancy standard"
          - "set Household.status = VOUCHER_ISSUED"
      - from: VOUCHER_ISSUED
        to: LEASED
        trigger: "POST /hap-contracts (lease-up) success"
        actor: Caseworker
        preconditions:
          - "Household.status == VOUCHER_ISSUED"
          - "linked Voucher.status == ISSUED and not past expiration_date"
        side_effects:
          - "set Household.status = LEASED"
      - from: LEASED
        to: TERMINATED
        trigger: "POST /hap-contracts/{id}/terminate"
        actor: Caseworker
        preconditions:
          - "Household.status == LEASED"
        side_effects:
          - "set Household.status = TERMINATED"
      - from: VOUCHER_ISSUED
        to: TERMINATED
        trigger: "POST /vouchers/{id}/expire"
        actor: system
        preconditions:
          - "Household.status == VOUCHER_ISSUED"
          - "current_utc >= linked Voucher.expiration_date"
        side_effects:
          - "set Household.status = TERMINATED"

  - entity: Voucher
    initial_state: ISSUED
    terminal_states: [EXPIRED, ABSORBED, TERMINATED]
    transitions:
      - from: ISSUED
        to: LEASED
        trigger: "POST /hap-contracts success"
        actor: Caseworker
        preconditions:
          - "Voucher.status == ISSUED"
          - "current_utc < Voucher.expiration_date"
          - "Unit.bedroom_size >= Voucher.bedroom_size (occupancy fit)"
        side_effects:
          - "set Voucher.status = LEASED"
          - "create HapContract in ACTIVE"
      - from: ISSUED
        to: EXPIRED
        trigger: "POST /vouchers/{id}/expire"
        actor: system
        preconditions:
          - "Voucher.status == ISSUED"
          - "current_utc >= Voucher.expiration_date"
        side_effects:
          - "set Voucher.status = EXPIRED"
          - "set linked Household.status = TERMINATED (cascade)"
      - from: ISSUED
        to: PORTING_OUT
        trigger: "POST /portability-moves/{id}/approve (BILLING mode)"
        actor: PortabilityCoordinator
        preconditions:
          - "Voucher.status == ISSUED"
          - "PortabilityMove.billing_mode == BILLING"
        side_effects:
          - "set Voucher.status = PORTING_OUT"
          - "Voucher.issuing_region_id unchanged; administering region recorded on lease"
      - from: ISSUED
        to: ABSORBED
        trigger: "POST /portability-moves/{id}/approve (ABSORPTION mode)"
        actor: PortabilityCoordinator
        preconditions:
          - "Voucher.status == ISSUED"
          - "PortabilityMove.billing_mode == ABSORPTION"
        side_effects:
          - "set Voucher.status = ABSORBED"
          - "set Voucher.issuing_region_id = PortabilityMove.receiving_region_id (cascade)"
      - from: PORTING_OUT
        to: LEASED
        trigger: "POST /hap-contracts success (ported voucher)"
        actor: Caseworker
        preconditions:
          - "Voucher.status == PORTING_OUT"
          - "current_utc < Voucher.expiration_date"
        side_effects:
          - "set Voucher.status = LEASED"
          - "create HapContract with administering_region_id = receiving region"
      - from: LEASED
        to: TERMINATED
        trigger: "POST /hap-contracts/{id}/terminate"
        actor: Caseworker
        preconditions:
          - "Voucher.status == LEASED"
        side_effects:
          - "set Voucher.status = TERMINATED"

  - entity: HapContract
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: ABATED
        trigger: "POST /inspections/{id}/fail (annual inspection fail)"
        actor: Inspector
        preconditions:
          - "HapContract.status == ACTIVE"
          - "Inspection.inspection_type == ANNUAL"
          - "linked Inspection.hap_contract_id == HapContract.id"
        side_effects:
          - "set HapContract.status = ABATED"
          - "set HapContract.hap_subsidy_cents = 0 (subsidy abated)"
          - "set linked Unit.status = OFF_MARKET (cascade)"
        note: "Annual HQS fail abates the HAP; cascade flips unit OFF_MARKET."
      - from: ABATED
        to: ACTIVE
        trigger: "POST /inspections/{id}/cure"
        actor: Inspector
        preconditions:
          - "HapContract.status == ABATED"
          - "Inspection.status == FAILED"
          - "current_utc <= Inspection.cure_deadline"
        side_effects:
          - "set HapContract.status = ACTIVE"
          - "restore HapContract.hap_subsidy_cents via subsidy_calculation (recompute)"
          - "set Inspection.status = CURED"
          - "set linked Unit.status = UNDER_CONTRACT (cascade)"
      - from: ABATED
        to: TERMINATED
        trigger: "POST /inspections/{id}/fail-cure (cure deadline passed)"
        actor: system
        preconditions:
          - "HapContract.status == ABATED"
          - "current_utc > Inspection.cure_deadline"
        side_effects:
          - "set HapContract.status = TERMINATED"
          - "set Inspection.status = ABATED"
          - "set linked Voucher.status = TERMINATED (cascade)"
          - "set linked Household.status = TERMINATED (cascade-of-cascade)"
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /hap-contracts/{id}/terminate"
        actor: Caseworker
        preconditions:
          - "HapContract.status == ACTIVE"
        side_effects:
          - "set HapContract.status = TERMINATED"
          - "set linked Voucher.status = TERMINATED (cascade)"
          - "set linked Household.status = TERMINATED (cascade)"
          - "set linked Unit.status = OFF_MARKET (cascade)"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, CURED, ABATED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /inspections/{id}/pass"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED"
        side_effects:
          - "set Inspection.status = PASSED"
          - "if inspection_type == INITIAL: mark linked Unit.status = UNDER_CONTRACT"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /inspections/{id}/fail"
        actor: Inspector
        preconditions:
          - "Inspection.status == SCHEDULED"
        side_effects:
          - "set Inspection.status = FAILED"
          - "set Inspection.cure_deadline = scheduled_date + CURE_WINDOW_DAYS"
          - "if inspection_type == ANNUAL and HapContract ACTIVE: trigger HapContract ACTIVE->ABATED (cascade)"
      - from: FAILED
        to: CURED
        trigger: "POST /inspections/{id}/cure"
        actor: Inspector
        preconditions:
          - "Inspection.status == FAILED"
          - "current_utc <= Inspection.cure_deadline"
        side_effects:
          - "set Inspection.status = CURED"
          - "if linked HapContract ABATED: trigger HapContract ABATED->ACTIVE (cascade)"
      - from: FAILED
        to: ABATED
        trigger: "POST /inspections/{id}/fail-cure"
        actor: system
        preconditions:
          - "Inspection.status == FAILED"
          - "current_utc > Inspection.cure_deadline"
        side_effects:
          - "set Inspection.status = ABATED"
          - "trigger HapContract ABATED->TERMINATED (cascade)"

  - entity: PortabilityMove
    initial_state: REQUESTED
    terminal_states: [ABSORBED, DENIED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /portability-moves/{id}/approve (billing_mode resolves BILLING)"
        actor: PortabilityCoordinator
        preconditions:
          - "PortabilityMove.status == REQUESTED"
          - "linked Voucher.status == ISSUED"
          - "receiving_region_id != Voucher.issuing_region_id"
          - "resolved billing_mode == BILLING"
        side_effects:
          - "set PortabilityMove.billing_mode = BILLING"
          - "set PortabilityMove.status = APPROVED"
          - "trigger Voucher ISSUED->PORTING_OUT (cascade)"
      - from: REQUESTED
        to: ABSORBED
        trigger: "POST /portability-moves/{id}/approve (billing_mode resolves ABSORPTION)"
        actor: PortabilityCoordinator
        preconditions:
          - "PortabilityMove.status == REQUESTED"
          - "linked Voucher.status == ISSUED"
          - "receiving_region_id != Voucher.issuing_region_id"
          - "resolved billing_mode == ABSORPTION"
        side_effects:
          - "set PortabilityMove.billing_mode = ABSORPTION"
          - "set PortabilityMove.status = ABSORBED"
          - "trigger Voucher ISSUED->ABSORBED (cascade)"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /portability-moves/{id}/deny"
        actor: PortabilityCoordinator
        preconditions:
          - "PortabilityMove.status == REQUESTED"
        side_effects:
          - "set PortabilityMove.status = DENIED"

  - entity: AnnualReview
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /annual-reviews/{id}/finalize"
        actor: Caseworker
        preconditions:
          - "AnnualReview.status == DRAFT"
          - "linked HapContract.status == ACTIVE"
        side_effects:
          - "recompute Household.adjusted_annual_income_cents from new_annual_income_cents (adjusted_income calc)"
          - "set AnnualReview.new_total_tenant_payment_cents via ttp_calculation"
          - "set AnnualReview.new_hap_subsidy_cents via subsidy_calculation"
          - "update HapContract.total_tenant_payment_cents, hap_subsidy_cents, tenant_rent_burden_cents (cascade)"
          - "set AnnualReview.status = FINALIZED"

  - entity: SpecialMobilityGrant
    initial_state: GRANTED
    terminal_states: [CONSUMED, REVOKED]
    transitions:
      - from: GRANTED
        to: CONSUMED
        trigger: "POST /hap-contracts success where Unit.region_id == grant.target_region_id"
        actor: Caseworker
        preconditions:
          - "SpecialMobilityGrant.status == GRANTED"
          - "leased Unit.region_id == SpecialMobilityGrant.target_region_id"
        side_effects:
          - "set SpecialMobilityGrant.status = CONSUMED"
      - from: GRANTED
        to: REVOKED
        trigger: "POST /special-mobility-grants/{id}/revoke"
        actor: PortabilityCoordinator
        preconditions:
          - "SpecialMobilityGrant.status == GRANTED"
        side_effects:
          - "set SpecialMobilityGrant.status = REVOKED"
          - "subtract term_extension_days from linked Voucher.expiration_date (recompute expiration, cascade)"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: hap-create-stale-voucher
    parent_entity: Voucher
    write_endpoint: "POST /hap-contracts"
    occ_field: "expected_voucher_version"
    description: |
      Creating a HapContract against a Voucher whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another operation has already moved the voucher (e.g. an approved
      portability move flipped it to PORTING_OUT/ABSORBED, bumping its
      version) and the lease-up writer's view of the voucher is now stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: review-finalize-stale-contract
    parent_entity: HapContract
    write_endpoint: "POST /annual-reviews/{id}/finalize"
    occ_field: "expected_hap_contract_version"
    description: |
      Finalizing an AnnualReview against a HapContract whose version has
      advanced since the review was drafted is rejected. This captures the
      case where the contract was abated by a failed annual inspection
      (bumping its version) and the review writer's view is now stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: adjusted_income
    trigger: "on POST /households/{id}/determine-eligibility and on AnnualReview finalize"
    algorithm: aggregation
    formula: |
      dependent_deduction = dependents_count * DEPENDENT_DEDUCTION_CENTS
      elderly_deduction   = ELDERLY_DEDUCTION_CENTS if elderly_or_disabled else 0
      childcare_deduction = childcare_expense_cents
      adjusted = annual_income_cents
                 - dependent_deduction
                 - elderly_deduction
                 - childcare_deduction
      adjusted_annual_income_cents = max(adjusted, 0)   # floor at 0
    input_set: "Single Household; uses its own input fields only."
    constants:
      DEPENDENT_DEDUCTION_CENTS: 48000
      ELDERLY_DEDUCTION_CENTS: 40000
    precision: "integer cents, floor at 0"

  - name: income_eligibility
    trigger: "on POST /households/{id}/determine-eligibility"
    algorithm: threshold
    formula: |
      base_limit = REGION_VLI_BASE_CENTS
      if   family_size <= 1: factor = 0.70
      elif family_size == 2: factor = 0.80
      elif family_size == 3: factor = 0.90
      elif family_size == 4: factor = 1.00
      else:                  factor = 1.00 + 0.08 * (family_size - 4)
      income_limit_cents = round_half_up(base_limit * factor)
      eligible = adjusted_annual_income_cents <= income_limit_cents   # INCLUSIVE: == passes
    input_set: "Single Household after adjusted_income computed."
    constants:
      REGION_VLI_BASE_CENTS: 4000000
    precision: "round_half_up to nearest cent; boundary is INCLUSIVE (<=)"

  - name: ttp_calculation
    trigger: "on POST /hap-contracts (lease-up) and on AnnualReview finalize"
    algorithm: forward_looking
    formula: |
      monthly_adjusted = adjusted_annual_income_cents / 12.0
      candidate_30pct  = 0.30 * monthly_adjusted
      candidate_10pct_gross = 0.10 * (annual_income_cents / 12.0)
      ttp_raw = max(candidate_30pct, candidate_10pct_gross, MINIMUM_RENT_CENTS)
      total_tenant_payment_cents = round_half_up(ttp_raw)   # round ONCE, after the max
    input_set: "Household linked to the HapContract's Voucher."
    constants:
      MINIMUM_RENT_CENTS: 5000
    precision: "round_half_up to nearest cent; round AFTER taking max (not before)"
    variants:
      - name: initial_lease_up
        when: "POST /hap-contracts at first lease-up"
        difference: "uses Household.adjusted_annual_income_cents as set at eligibility"
      - name: reexam
        when: "AnnualReview finalize"
        difference: "uses adjusted income recomputed from new_annual_income_cents"

  - name: subsidy_calculation
    trigger: "on POST /hap-contracts (lease-up), on AnnualReview finalize, and on HapContract ABATED->ACTIVE cure"
    algorithm: tiered_pricing
    formula: |
      ps = PaymentStandard.amount_cents WHERE region_id == administering_region_id
                                          AND bedroom_size == Voucher.bedroom_size
      capped_rent = min(contract_rent_cents, ps)
      hap_subsidy_cents = max(capped_rent - total_tenant_payment_cents, 0)
      tenant_rent_burden_cents = contract_rent_cents - hap_subsidy_cents
    input_set: "HapContract + linked Voucher + PaymentStandard for administering_region_id."
    constants: {}
    precision: "integer cents; floor subsidy at 0"
    variants:
      - name: gross_subsidy
        when: "contract_rent_cents <= payment_standard"
        difference: "capped_rent == contract_rent; subsidy = contract_rent - TTP"
      - name: payment_standard_capped
        when: "contract_rent_cents > payment_standard"
        difference: "capped_rent == payment_standard; tenant absorbs the overage above the standard"

  - name: initial_rent_burden_check
    trigger: "on POST /hap-contracts (lease-up) — gate, not a stored field"
    algorithm: threshold
    formula: |
      monthly_adjusted = adjusted_annual_income_cents / 12.0
      max_burden = round_half_up(0.40 * monthly_adjusted)
      ok = tenant_rent_burden_cents <= max_burden   # boundary INCLUSIVE at 40%
    input_set: "HapContract being created at initial lease-up only; not applied at reexam."
    constants: {}
    precision: "round_half_up; boundary: burden == 40% PASSES, > 40% FAILS"

  - name: portability_billing_mode
    trigger: "on POST /portability-moves to resolve billing_mode (and re-read on approve)"
    algorithm: threshold
    formula: |
      receiving = Region WHERE id == receiving_region_id
      if receiving.is_special_mobility_area == true:
          billing_mode = ABSORPTION
      else:
          billing_mode = BILLING
    input_set: "Single PortabilityMove + its receiving Region."
    constants: {}
    precision: "enum result; deterministic on receiving region flag"

  - name: occupancy_bedroom_size
    trigger: "on POST /vouchers (issue) to set Voucher.bedroom_size"
    algorithm: threshold
    formula: |
      if family_size <= 1:
          bedroom_size = 0
      else:
          bedroom_size = min(ceil(family_size / 2.0), 6)
    input_set: "Single Household.family_size."
    constants:
      MAX_BEDROOM: 6
    precision: "integer; ceil division"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "All path/body referenced resources exist (validated left-to-right in path, then body FKs)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 4
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 5
    category: state
    check: "OCC: expected_<parent>_version matches current parent.version on supersede-capable writes"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /hap-contracts, POST /annual-reviews/{id}/finalize"
  - priority: 6
    category: business_referential
    check: "Voucher bedroom_size must fit the Unit: Unit.bedroom_size >= Voucher.bedroom_size (no over-housing under standard)"
    error_id: ERR_BEDROOM_MISMATCH
    http_status: 422
    applies_to: "POST /hap-contracts"
  - priority: 7
    category: business_temporal
    check: "Voucher must not be expired at lease-up: current_utc < Voucher.expiration_date"
    error_id: ERR_VOUCHER_EXPIRED
    http_status: 422
    applies_to: "POST /hap-contracts"
  - priority: 8
    category: business_safety
    check: "Initial HQS inspection for the unit must be PASSED before a HapContract can be created"
    error_id: ERR_INSPECTION_NOT_PASSED
    http_status: 422
    applies_to: "POST /hap-contracts"
  - priority: 9
    category: business_constraint
    check: "Contract rent must be rent-reasonable: contract_rent_cents <= Unit.comparable_rent_cents (INCLUSIVE)"
    error_id: ERR_RENT_NOT_REASONABLE
    http_status: 422
    applies_to: "POST /hap-contracts"
  - priority: 10
    category: business_fiscal
    check: "Initial rent burden gate: tenant_rent_burden_cents <= 40% of monthly adjusted income at initial lease-up"
    error_id: ERR_RENT_BURDEN_EXCEEDED
    http_status: 422
    applies_to: "POST /hap-contracts"
  - priority: 11
    category: business_constraint
    check: "PaymentStandard amount must be within FMR band: 0.90*fmr_cents <= amount_cents <= 1.10*fmr_cents"
    error_id: ERR_PAYMENT_STANDARD_OUT_OF_BAND
    http_status: 422
    applies_to: "POST /payment-standards"
  - priority: 12
    category: business_referential
    check: "Portability receiving_region_id must differ from Voucher.issuing_region_id"
    error_id: ERR_SAME_REGION_PORT
    http_status: 422
    applies_to: "POST /portability-moves"
  - priority: 13
    category: business_temporal
    check: "Inspection cure must occur on or before cure_deadline"
    error_id: ERR_CURE_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /inspections/{id}/cure"
  - priority: 14
    category: business_constraint
    check: "Special Mobility target_region_id must be a region with is_special_mobility_area == true"
    error_id: ERR_NOT_MOBILITY_AREA
    http_status: 422
    applies_to: "POST /special-mobility-grants"
  - priority: 15
    category: state
    check: "Voucher issuance requires the target Household.status == ELIGIBLE"
    error_id: ERR_HOUSEHOLD_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /vouchers"
  - priority: 16
    category: state
    check: "Lease-up requires the Voucher.status IN {ISSUED, PORTING_OUT}"
    error_id: ERR_VOUCHER_NOT_AVAILABLE
    http_status: 422
    applies_to: "POST /hap-contracts"
  - priority: 17
    category: business_constraint
    check: "PaymentStandard region_id + bedroom_size must be unique (no existing standard for that pair)"
    error_id: ERR_DUPLICATE_PAYMENT_STANDARD
    http_status: 409
    applies_to: "POST /payment-standards"
  - priority: 18
    category: business_constraint
    check: "Required body fields present and well-typed; enum/range constraints honored"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: all

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # --- Region ---
  - method: POST
    path: "/regions"
    description: "Create a region"
    roles: [ProgramAdmin]
    code: 201
    input:
      - code
      - name
      - fmr_year
      - is_special_mobility_area?
    output: Region
    side_effects: []
  - method: GET
    path: "/regions/{id}"
    description: "Get a region"
    roles: [ProgramAdmin, Caseworker, Inspector, PortabilityCoordinator, Landlord]
    code: 200
    input: []
    output: Region
    side_effects: []
  - method: GET
    path: "/regions"
    description: "List regions"
    roles: [ProgramAdmin, Caseworker, Inspector, PortabilityCoordinator, Landlord]
    code: 200
    input:
      - limit?
      - offset?
      - is_special_mobility_area?
    output: Region[]
    side_effects: []

  # --- PaymentStandard ---
  - method: POST
    path: "/payment-standards"
    description: "Create a payment standard for a region + bedroom size"
    roles: [ProgramAdmin]
    code: 201
    input: [region_id, bedroom_size, amount_cents, fmr_cents]
    output: PaymentStandard
    side_effects: ["validate FMR band 90%-110%"]
  - method: GET
    path: "/payment-standards/{id}"
    description: "Get a payment standard"
    roles: [ProgramAdmin, Caseworker, PortabilityCoordinator]
    code: 200
    input: []
    output: PaymentStandard
    side_effects: []
  - method: GET
    path: "/payment-standards"
    description: "List payment standards, filterable by region"
    roles: [ProgramAdmin, Caseworker, PortabilityCoordinator]
    code: 200
    input:
      - region_id?
      - bedroom_size?
      - limit?
      - offset?
    output: PaymentStandard[]
    side_effects: []

  # --- Household ---
  - method: POST
    path: "/households"
    description: "Register a household application"
    roles: [Caseworker]
    code: 201
    input:
      - head_name
      - family_size
      - annual_income_cents
      - region_id
      - dependents_count?
      - elderly_or_disabled?
      - childcare_expense_cents?
    output: Household
    side_effects: ["status=APPLIED"]
  - method: GET
    path: "/households/{id}"
    description: "Get a household"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: Household
    side_effects: []
  - method: GET
    path: "/households"
    description: "List households, filterable by region"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input:
      - region_id?
      - status?
      - limit?
      - offset?
    output: Household[]
    side_effects: []
  - method: POST
    path: "/households/{id}/determine-eligibility"
    description: "Run income eligibility; transitions APPLIED -> ELIGIBLE or INELIGIBLE"
    roles: [Caseworker]
    code: 200
    input: []
    output: Household
    side_effects: ["compute adjusted_annual_income_cents", "set status ELIGIBLE/INELIGIBLE"]

  # --- Voucher ---
  - method: POST
    path: "/vouchers"
    description: "Issue a voucher to an ELIGIBLE household"
    roles: [Caseworker]
    code: 201
    input:
      - household_id
      - term_days?
    output: Voucher
    side_effects: ["compute bedroom_size via occupancy_bedroom_size", "set issued_date/expiration_date", "Household status=VOUCHER_ISSUED"]
  - method: GET
    path: "/vouchers/{id}"
    description: "Get a voucher"
    roles: [Caseworker, ProgramAdmin, PortabilityCoordinator]
    code: 200
    input: []
    output: Voucher
    side_effects: []
  - method: GET
    path: "/vouchers"
    description: "List vouchers, filterable by household or issuing region"
    roles: [Caseworker, ProgramAdmin, PortabilityCoordinator]
    code: 200
    input:
      - household_id?
      - issuing_region_id?
      - status?
      - limit?
      - offset?
    output: Voucher[]
    side_effects: []
  - method: POST
    path: "/vouchers/{id}/expire"
    description: "System endpoint: expire a voucher whose term has elapsed"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Voucher
    side_effects: ["status=EXPIRED", "cascade Household status=TERMINATED"]

  # --- Landlord & Unit ---
  - method: POST
    path: "/landlords"
    description: "Register a landlord"
    roles: [ProgramAdmin, Landlord]
    code: 201
    input: [name, payee_account]
    output: Landlord
    side_effects: []
  - method: GET
    path: "/landlords/{id}"
    description: "Get a landlord"
    roles: [ProgramAdmin, Landlord, Caseworker]
    code: 200
    input: []
    output: Landlord
    side_effects: []
  - method: POST
    path: "/units"
    description: "List a rental unit"
    roles: [Landlord, ProgramAdmin]
    code: 201
    input: [landlord_id, region_id, bedroom_size, asking_rent_cents, comparable_rent_cents]
    output: Unit
    side_effects: ["status=LISTED"]
  - method: GET
    path: "/units/{id}"
    description: "Get a unit"
    roles: [Landlord, ProgramAdmin, Caseworker, Inspector]
    code: 200
    input: []
    output: Unit
    side_effects: []
  - method: GET
    path: "/units"
    description: "List units, filterable by landlord or region"
    roles: [Landlord, ProgramAdmin, Caseworker, Inspector]
    code: 200
    input:
      - landlord_id?
      - region_id?
      - status?
      - limit?
      - offset?
    output: Unit[]
    side_effects: []

  # --- Rent reasonableness ---
  - method: POST
    path: "/rent-reasonableness"
    description: "Run a rent reasonableness determination for a unit + requested rent"
    roles: [Caseworker]
    code: 201
    input: [unit_id, requested_rent_cents]
    output: RentReasonablenessDetermination
    side_effects: ["copy comparable_rent_cents from unit", "set outcome REASONABLE/NOT_REASONABLE"]
  - method: GET
    path: "/rent-reasonableness/{id}"
    description: "Get a rent reasonableness determination"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: RentReasonablenessDetermination
    side_effects: []
  - method: GET
    path: "/rent-reasonableness"
    description: "List rent reasonableness determinations, filterable by unit"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input:
      - unit_id?
      - limit?
      - offset?
    output: RentReasonablenessDetermination[]
    side_effects: []

  # --- Inspections ---
  - method: POST
    path: "/inspections"
    description: "Schedule an HQS inspection (INITIAL for a unit, or ANNUAL for a contract)"
    roles: [Inspector, Caseworker]
    code: 201
    input:
      - unit_id
      - inspection_type
      - scheduled_date
      - hap_contract_id?
    output: Inspection
    side_effects: ["status=SCHEDULED"]
  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [Inspector, Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List inspections, filterable by unit or hap_contract"
    roles: [Inspector, Caseworker, ProgramAdmin]
    code: 200
    input:
      - unit_id?
      - hap_contract_id?
      - status?
      - limit?
      - offset?
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/pass"
    description: "Mark an inspection PASSED"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status=PASSED", "initial: Unit UNDER_CONTRACT"]
  - method: POST
    path: "/inspections/{id}/fail"
    description: "Mark an inspection FAILED; sets cure_deadline; annual fail abates contract"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status=FAILED", "set cure_deadline", "annual: cascade HapContract ABATED + Unit OFF_MARKET"]
  - method: POST
    path: "/inspections/{id}/cure"
    description: "Record a cured deficiency before the cure deadline; restores abated contract"
    roles: [Inspector]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status=CURED", "cascade HapContract ACTIVE + recompute subsidy + Unit UNDER_CONTRACT"]
  - method: POST
    path: "/inspections/{id}/fail-cure"
    description: "System endpoint: cure deadline passed; terminate the abated contract"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: Inspection
    side_effects: ["status=ABATED", "cascade HapContract TERMINATED + Voucher TERMINATED + Household TERMINATED"]

  # --- HAP contracts (lease-up) ---
  - method: POST
    path: "/hap-contracts"
    description: "Lease up a voucher onto a unit; runs TTP, subsidy, burden gate, OCC"
    roles: [Caseworker]
    code: 201
    input: [voucher_id, unit_id, contract_rent_cents, expected_voucher_version]
    output: HapContract
    side_effects: ["compute administering_region_id", "compute TTP/subsidy/burden", "Voucher LEASED", "Household LEASED", "Unit UNDER_CONTRACT", "increments Voucher.version by 1", "consume SpecialMobilityGrant if target region matched"]
  - method: GET
    path: "/hap-contracts/{id}"
    description: "Get a HAP contract"
    roles: [Caseworker, ProgramAdmin, Landlord]
    code: 200
    input: []
    output: HapContract
    side_effects: []
  - method: GET
    path: "/hap-contracts"
    description: "List HAP contracts, filterable by voucher, unit, or administering region"
    roles: [Caseworker, ProgramAdmin, Landlord]
    code: 200
    input:
      - voucher_id?
      - unit_id?
      - administering_region_id?
      - status?
      - limit?
      - offset?
    output: HapContract[]
    side_effects: []
  - method: POST
    path: "/hap-contracts/{id}/terminate"
    description: "Terminate an active HAP contract"
    roles: [Caseworker]
    code: 200
    input: []
    output: HapContract
    side_effects: ["status=TERMINATED", "cascade Voucher/Household TERMINATED + Unit OFF_MARKET"]

  # --- Portability ---
  - method: POST
    path: "/portability-moves"
    description: "Request a portability move of a voucher to a receiving region"
    roles: [PortabilityCoordinator, Caseworker]
    code: 201
    input: [voucher_id, receiving_region_id]
    output: PortabilityMove
    side_effects: ["status=REQUESTED", "resolve billing_mode via portability_billing_mode calculation"]
  - method: GET
    path: "/portability-moves/{id}"
    description: "Get a portability move"
    roles: [PortabilityCoordinator, Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: PortabilityMove
    side_effects: []
  - method: GET
    path: "/portability-moves"
    description: "List portability moves, filterable by voucher or receiving region"
    roles: [PortabilityCoordinator, Caseworker, ProgramAdmin]
    code: 200
    input:
      - voucher_id?
      - receiving_region_id?
      - status?
      - limit?
      - offset?
    output: PortabilityMove[]
    side_effects: []
  - method: POST
    path: "/portability-moves/{id}/approve"
    description: "Approve a portability move; sets billing_mode and ports/absorbs the voucher"
    roles: [PortabilityCoordinator]
    code: 200
    input: []
    output: PortabilityMove
    side_effects: ["set billing_mode", "Voucher PORTING_OUT (BILLING) or ABSORBED (ABSORPTION) cascade"]
  - method: POST
    path: "/portability-moves/{id}/deny"
    description: "Deny a portability move"
    roles: [PortabilityCoordinator]
    code: 200
    input: []
    output: PortabilityMove
    side_effects: ["status=DENIED"]

  # --- Annual review ---
  - method: POST
    path: "/annual-reviews"
    description: "Draft an annual reexamination for a HAP contract"
    roles: [Caseworker]
    code: 201
    input: [hap_contract_id, new_annual_income_cents, effective_date]
    output: AnnualReview
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/annual-reviews/{id}"
    description: "Get an annual review"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: AnnualReview
    side_effects: []
  - method: GET
    path: "/annual-reviews"
    description: "List annual reviews, filterable by hap_contract"
    roles: [Caseworker, ProgramAdmin]
    code: 200
    input:
      - hap_contract_id?
      - status?
      - limit?
      - offset?
    output: AnnualReview[]
    side_effects: []
  - method: POST
    path: "/annual-reviews/{id}/finalize"
    description: "Finalize a review; recomputes TTP/subsidy and updates the contract (OCC on contract)"
    roles: [Caseworker]
    code: 200
    input: [expected_hap_contract_version]
    output: AnnualReview
    side_effects: ["recompute adjusted income/TTP/subsidy", "cascade update HapContract", "increments HapContract.version by 1", "status=FINALIZED"]

  # --- Special mobility ---
  - method: POST
    path: "/special-mobility-grants"
    description: "Grant a special mobility incentive (term extension) for a voucher targeting an opportunity area"
    roles: [PortabilityCoordinator]
    code: 201
    input:
      - voucher_id
      - target_region_id
      - term_extension_days?
    output: SpecialMobilityGrant
    side_effects: ["status=GRANTED", "extend linked Voucher.expiration_date by term_extension_days (cascade)"]
  - method: GET
    path: "/special-mobility-grants/{id}"
    description: "Get a special mobility grant"
    roles: [PortabilityCoordinator, Caseworker, ProgramAdmin]
    code: 200
    input: []
    output: SpecialMobilityGrant
    side_effects: []
  - method: GET
    path: "/special-mobility-grants"
    description: "List special mobility grants, filterable by voucher or target region"
    roles: [PortabilityCoordinator, Caseworker, ProgramAdmin]
    code: 200
    input:
      - voucher_id?
      - target_region_id?
      - status?
      - limit?
      - offset?
    output: SpecialMobilityGrant[]
    side_effects: []
  - method: POST
    path: "/special-mobility-grants/{id}/revoke"
    description: "Revoke a granted mobility incentive; rolls back the term extension"
    roles: [PortabilityCoordinator]
    code: 200
    input: []
    output: SpecialMobilityGrant
    side_effects: ["status=REVOKED", "subtract term_extension_days from Voucher.expiration_date (cascade)"]

  # --- Test-driving clock endpoint ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's current UTC clock for time-gated transitions"
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["sets server current_utc used by expiration / cure-deadline checks"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Authenticated role not permitted for this operation"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path id or body FK) does not exist"
  - id: ERR_VALIDATION
    http: 400
    condition: "Missing required field, wrong type, or out-of-range scalar (e.g. negative cents, bedroom_size>6)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a valid state for the requested transition"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current parent.version on a supersede-capable write"
  - id: ERR_BEDROOM_MISMATCH
    http: 422
    condition: "Unit.bedroom_size < Voucher.bedroom_size at lease-up"
  - id: ERR_VOUCHER_EXPIRED
    http: 422
    condition: "Voucher.expiration_date <= current_utc at lease-up"
  - id: ERR_INSPECTION_NOT_PASSED
    http: 422
    condition: "No PASSED INITIAL inspection exists for the unit at lease-up"
  - id: ERR_RENT_NOT_REASONABLE
    http: 422
    condition: "contract_rent_cents > Unit.comparable_rent_cents"
  - id: ERR_RENT_BURDEN_EXCEEDED
    http: 422
    condition: "tenant_rent_burden_cents > 40% of monthly adjusted income at initial lease-up"
  - id: ERR_PAYMENT_STANDARD_OUT_OF_BAND
    http: 422
    condition: "amount_cents outside [90%,110%] of fmr_cents"
  - id: ERR_SAME_REGION_PORT
    http: 422
    condition: "receiving_region_id equals Voucher.issuing_region_id"
  - id: ERR_CURE_DEADLINE_PASSED
    http: 422
    condition: "cure attempted after Inspection.cure_deadline"
  - id: ERR_NOT_MOBILITY_AREA
    http: 422
    condition: "Special mobility target_region_id is not an is_special_mobility_area region"
  - id: ERR_DUPLICATE_PAYMENT_STANDARD
    http: 409
    condition: "A payment standard already exists for that region_id + bedroom_size"
  - id: ERR_HOUSEHOLD_NOT_ELIGIBLE
    http: 422
    condition: "Issuing a voucher for a household not in ELIGIBLE status"
  - id: ERR_VOUCHER_NOT_AVAILABLE
    http: 422
    condition: "Lease-up attempted against a voucher not in ISSUED or PORTING_OUT status"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: ProgramAdmin
    description: "PHA administrator: regions, payment standards, system/clock operations"
    identity: opaque
    exclusive_operations:
      - "POST /regions"
      - "POST /payment-standards"
      - "POST /vouchers/{id}/expire"
      - "POST /inspections/{id}/fail-cure"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET (most resources)"
      - "POST /landlords"
      - "POST /units"

  - name: Caseworker
    description: "Manages households, eligibility, voucher issuance, lease-up, annual reviews"
    identity: opaque
    exclusive_operations:
      - "POST /households"
      - "POST /households/{id}/determine-eligibility"
      - "POST /vouchers"
      - "POST /rent-reasonableness"
      - "POST /hap-contracts"
      - "POST /hap-contracts/{id}/terminate"
      - "POST /annual-reviews"
      - "POST /annual-reviews/{id}/finalize"
    shared_operations:
      - "POST /inspections"
      - "POST /portability-moves"
      - "GET household/voucher/contract/unit resources"

  - name: Inspector
    description: "Conducts HQS inspections; passes, fails, and records cures"
    identity: opaque
    exclusive_operations:
      - "POST /inspections/{id}/pass"
      - "POST /inspections/{id}/fail"
      - "POST /inspections/{id}/cure"
    shared_operations:
      - "POST /inspections"
      - "GET inspection/unit resources"

  - name: PortabilityCoordinator
    description: "Handles portability moves across regions and special mobility grants"
    identity: opaque
    exclusive_operations:
      - "POST /portability-moves/{id}/approve"
      - "POST /portability-moves/{id}/deny"
      - "POST /special-mobility-grants"
      - "POST /special-mobility-grants/{id}/revoke"
    shared_operations:
      - "POST /portability-moves"
      - "GET voucher/region/portability resources"

  - name: Landlord
    description: "Lists units and views their own contracts"
    identity: entity_backed:Landlord
    exclusive_operations: []
    shared_operations:
      - "POST /landlords"
      - "POST /units"
      - "GET own unit/contract resources"
