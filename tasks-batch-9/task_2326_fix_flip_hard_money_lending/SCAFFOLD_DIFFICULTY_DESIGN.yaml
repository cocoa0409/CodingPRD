              as: LoanServicer
              as_user_id: "svc-01"
            - call: "POST /lending/draw-requests/${d_photo}/review"
              payload: { decision: "APPROVE" }
              as: LoanServicer
              as_user_id: "svc-01"
              captures: { photo_release: $.data.approved_release_cents }
            - call: "POST /lending/draw-requests/${d_photo}/fund"
              payload: { funding_date: "2026-09-01", joint_check_ack: false }
              as: LoanServicer
              as_user_id: "svc-02"
            - call: "GET /lending/loans/${loan1}"
              payload: {}
              as: LoanServicer
              captures: { loan1_v2: $.data.version }
            - call: "POST /lending/loans/${loan1}/draw-requests"
              payload: { line_allocations: [{ rehab_line_item_id: "${l_elec}", claimed_percent_complete: 0.70 }], verification_method: "INSPECTION", expected_loan_version: "${loan1_v2}" }
              as: Borrower
              as_user_id: "${b1}"
              captures: { d_insp: $.data.id }
            - call: "POST /lending/draw-requests/${d_insp}/inspection-visits"
              payload: { inspector_id: "insp-01", window_start: "2026-09-02T09:00:00Z", window_end: "2026-09-02T11:00:00Z" }
              as: LoanServicer
              captures: { v_insp: $.data.id }
            - call: "POST /lending/inspection-visits/${v_insp}/report"
