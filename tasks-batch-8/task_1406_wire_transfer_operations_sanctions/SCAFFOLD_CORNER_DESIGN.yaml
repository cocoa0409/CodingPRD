  # ========================== 8. cross-cutting complexity layers
  - section: cross_cutting_layers
    instances:
      - name: occ_approve_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[wire-approve-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on WireTransfer.version at approve: an approval carrying the pre-first-approval version is rejected 412 after the first approval advanced the version — the stale writer's view no longer matches the wire."
        test_recipe:
          setup:
            - "Customer CL1 (MEDIUM), Account AL1, Beneficiary BL1, BusinessDate 2026-10-06 OPEN, Wire WL1 (100000) submitted; version captured"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Layer One", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cl1: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cl1}", account_number: "A-L001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { al1: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cl1}", name: "Layer Ben", bank_name: "LayerBank", account_number: "B-L001", country_code: "US" }, as: WireOperator, captures: { bl1: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-10-06" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${al1}", beneficiary_id: "${bl1}", amount_cents: 100000, method: "Fedwire", purpose: "occ approve" }, as: WireOperator, as_user_id: "op-1", captures: { wl1: $.data.id } }
            - { call: "POST /wire-ops/wires/${wl1}/submit", payload: { business_date: "2026-10-06" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wl1}", as: WireOperator, captures: { l1_v: $.data.version } }
          trigger:
            - { call: "POST /wire-ops/wires/${wl1}/approve", payload: { expected_wire_version: "${l1_v}" }, as: WireApprover, as_user_id: "ap-1", captures: { l1_v_after: $.data.version } }
            - { call: "POST /wire-ops/wires/${wl1}/approve", payload: { expected_wire_version: "${l1_v}" }, as: WireApprover, as_user_id: "ap-2", captures: { l1_err: $.data.error_id } }
            - { call: "GET /wire-ops/wires/${wl1}/summary", as: WireOperator, captures: { l1_approvals: $.data.approvals } }
          assert:
            - "First approval with the observed version succeeds (version advanced to ${l1_v_after})"
            - "Second approval replaying the stale version ${l1_v}: ${l1_err} == ERR_STALE_VERSION, HTTP 412"
            - "WireTransfer.${wl1} still has exactly 1 approval (${l1_approvals}) and remains PENDING_APPROVAL — the stale write applied nothing"

      - name: occ_release_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[wire-release-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC at release: a fraud hold landing after the client's last read advances the wire version; the release carrying the pre-hold version is rejected 412 (before even evaluating the hold gate), while a release carrying the fresh version reaches the business rules."
        test_recipe:
          setup:
            - "Customer CL2 (MEDIUM), Account AL2, Beneficiary BL2, BusinessDate 2026-10-07 OPEN, Wire WL2 (100000) dual-approved; version captured at APPROVED; then a fraud hold is placed (advancing the version)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Layer Two", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cl2: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cl2}", account_number: "A-L002", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { al2: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cl2}", name: "Layer Ben2", bank_name: "LayerBank2", account_number: "B-L002", country_code: "US" }, as: WireOperator, captures: { bl2: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-10-07" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${al2}", beneficiary_id: "${bl2}", amount_cents: 100000, method: "Fedwire", purpose: "occ release" }, as: WireOperator, as_user_id: "op-1", captures: { wl2: $.data.id } }
            - { call: "POST /wire-ops/wires/${wl2}/submit", payload: { business_date: "2026-10-07" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wl2}", as: WireOperator, captures: { l2_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wl2}/approve", payload: { expected_wire_version: "${l2_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wl2}", as: WireOperator, captures: { l2_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wl2}/approve", payload: { expected_wire_version: "${l2_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${wl2}", as: WireOperator, captures: { l2_v_approved: $.data.version } }
            - { call: "POST /wire-ops/wires/${wl2}/fraud-holds", payload: { reason_code: "ACCOUNT_TAKEOVER", note: "ato" }, as: FraudAnalyst, as_user_id: "fa-1", captures: { hl2: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/wires/${wl2}/release", payload: { expected_wire_version: "${l2_v_approved}" }, as: WireOperator, as_user_id: "op-1", captures: { l2_err: $.data.error_id } }
            - { call: "GET /wire-ops/wires/${wl2}", as: WireOperator, captures: { l2_status_mid: $.data.status, l2_v_fresh: $.data.version } }
            - { call: "POST /wire-ops/wires/${wl2}/release", payload: { expected_wire_version: "${l2_v_fresh}" }, as: WireOperator, as_user_id: "op-1", captures: { l2_err2: $.data.error_id } }
          assert:
            - "Release with the stale (pre-hold) version: ${l2_err} == ERR_STALE_VERSION (412)"
            - "WireTransfer.${wl2}.status still APPROVED (${l2_status_mid}) — nothing was released"
            - "Release with the fresh version passes OCC and instead meets the business gate: ${l2_err2} == ERR_WIRE_ON_HOLD (409)"

      - name: occ_repair_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[wire-repair-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC at repair: a repair prepared against version N is rejected with 412 once the wire has moved past N (a prior repair plus resubmit advanced it), protecting the repair specialist's corrections from being applied to a superseded wire state."
        test_recipe:
          setup:
            - "Customer CL3 (MEDIUM), Account AL3, Beneficiary BL3, BusinessDate 2026-10-08 OPEN, Wire WL3 (100000) submitted; version captured"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Layer Three", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cl3: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cl3}", account_number: "A-L003", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { al3: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cl3}", name: "Layer Ben3", bank_name: "LayerBank3", account_number: "B-L003", country_code: "US" }, as: WireOperator, captures: { bl3: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-10-08" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${al3}", beneficiary_id: "${bl3}", amount_cents: 100000, method: "Fedwire", purpose: "occ repair" }, as: WireOperator, as_user_id: "op-1", captures: { wl3: $.data.id } }
            - { call: "POST /wire-ops/wires/${wl3}/submit", payload: { business_date: "2026-10-08" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wl3}", as: WireOperator, captures: { l3_v: $.data.version } }
          trigger:
            - { call: "POST /wire-ops/wires/${wl3}/repair", payload: { expected_wire_version: "${l3_v}", purpose: "fix one" }, as: RepairSpecialist, as_user_id: "rs-1", captures: { l3_att: $.data.repair_attempts } }
            - { call: "POST /wire-ops/wires/${wl3}/resubmit", payload: {}, as: RepairSpecialist, as_user_id: "rs-1" }
            - { call: "POST /wire-ops/wires/${wl3}/repair", payload: { expected_wire_version: "${l3_v}", purpose: "fix two on stale view" }, as: RepairSpecialist, as_user_id: "rs-1", captures: { l3_err: $.data.error_id } }
            - { call: "GET /wire-ops/wires/${wl3}", as: RepairSpecialist, captures: { l3_att_after: $.data.repair_attempts } }
          assert:
            - "First repair succeeded (repair_attempts == 1: ${l3_att}); second repair carrying the stale version: ${l3_err} == ERR_STALE_VERSION (412)"
            - "repair_attempts remains 1 (${l3_att_after}) — the stale repair consumed no attempt budget"

      - name: velocity_threshold_strictly_greater_than_10m
