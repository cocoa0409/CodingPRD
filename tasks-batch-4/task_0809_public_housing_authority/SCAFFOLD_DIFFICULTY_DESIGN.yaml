# SCAFFOLD_DIFFICULTY_DESIGN — Test Targeting Index (§1.8)
# 9 Difficulty Rules x 2 instances = 18 instances. Every grounds ref resolves
# into SCAFFOLD.yaml §1.1–§1.6; every setup_api_calls chain drives empty-DB into
# the described precondition using only §1.5 endpoints.
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: rent_anticipated_vs_actual_ttp
        grounds:
          - calculations.household_annual_gross_income
          - calculations.total_tenant_payment
          - entities.Certification.fields.ttp_cents
          - entities.HouseholdMember.fields.nonrecurring_income_cents
        distinguishing_aspect: >
          On the SAME household rows, the ANTICIPATED variant (ANNUAL cert) counts each
          member's nonrecurring_income_cents while the ACTUAL variant (INTERIM cert)
          excludes it, so the ANNUAL cert ttp_cents == 93600 and the INTERIM cert
          ttp_cents == 87600 — a 6000-cent divergence on the Certification/Tenancy domain.
        test_recipe:
          setup:
            - "Applicant with head (annual 3,600,000; nonrecurring 240,000) plus two dependents (income 0); on a bedroom-2 waitlist, drawn ACTIVE, offered and accepted into a bedroom-2 unit (UA 10,000, high income limit) so a Tenancy is ACTIVE."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Alvarez" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head Alvarez", relationship: "HEAD", annual_income_cents: 3600000, nonrecurring_income_cents: 240000 }
              as: IntakeClerk
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Dep One", relationship: "DEPENDENT", annual_income_cents: 0, is_dependent: true }
              as: IntakeClerk
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Dep Two", relationship: "DEPENDENT", annual_income_cents: 0, is_dependent: true }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-1", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 10000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id, t_v: $.data.version }
          trigger:
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-04-01T00:00:00Z", expected_tenancy_version: "${t_v}", childcare_expenses_annual_cents: 0, medical_expenses_annual_cents: 0 }
              as: HousingSpecialist
              captures: { ann_cert_id: $.data.id }
            - call: "POST /pha/certifications/${ann_cert_id}/finalize"
              payload: {}
              as: HousingSpecialist
            - call: "POST /pha/tenancies/${t_id}/interim-changes"
              payload: { change_type: "COMPOSITION", effective_date: "2026-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${app_id}"
              captures: { ic_id: $.data.id }
            - call: "POST /pha/interim-changes/${ic_id}/process"
              payload: { decision: "PROCESS" }
              as: HousingSpecialist
          assert:
            - "Certification ${ann_cert_id}.annual_gross_income_cents == 3840000"
            - "Certification ${ann_cert_id}.ttp_cents == 93600"
            - "the INTERIM Certification whose source_interim_change_id == ${ic_id} has annual_gross_income_cents == 3600000 and ttp_cents == 87600"
            - "the two variants diverge on identical member rows: 93600 (ANTICIPATED) != 87600 (ACTUAL)"

      - name: waitlist_preliminary_vs_final_rank
        grounds:
          - calculations.waitlist_effective_rank
          - entities.WaitlistEntry.fields.effective_rank
          - entities.WaitlistEntry.fields.total_points
          - entities.Applicant.fields.application_date
        distinguishing_aspect: >
          On the same three ACTIVE entries, PRELIMINARY ranks by applicant.application_date
          ASC (A1,A2,A3) while FINAL ranks by (total_points DESC, lottery_number ASC)
          (A2=50, A3=40, A1=0), so A2 moves from PRELIMINARY rank 2 to FINAL rank 1 — a
          reordering on the WaitlistEntry domain distinct from the rent variant.
        test_recipe:
          setup:
            - "Bedroom-2 waitlist with three applicants A1 (application_date 2026-03-01), A2 (2026-03-02), A3 (2026-03-03), each with a PENDING entry; A2 has a VERIFIED VETERAN claim (50 pts), A3 a VERIFIED INVOLUNTARY_DISPLACEMENT claim (40 pts), A1 none. Lottery not yet drawn."
          setup_api_calls:
            - call: "POST /pha/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: IntakeClerk
            - call: "POST /pha/applicants"
              payload: { household_name: "A1" }
              as: IntakeClerk
              captures: { a1_id: $.data.id }
            - call: "POST /pha/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: IntakeClerk
            - call: "POST /pha/applicants"
              payload: { household_name: "A2" }
              as: IntakeClerk
              captures: { a2_id: $.data.id }
            - call: "POST /pha/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-03T00:00:00Z" }
              as: IntakeClerk
            - call: "POST /pha/applicants"
              payload: { household_name: "A3" }
              as: IntakeClerk
              captures: { a3_id: $.data.id }
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${a1_id}" }
              as: IntakeClerk
              captures: { e1_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${a2_id}" }
              as: IntakeClerk
              captures: { e2_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${a3_id}" }
              as: IntakeClerk
              captures: { e3_id: $.data.id }
            - call: "POST /pha/applicants/${a2_id}/preference-claims"
              payload: { preference_type: "VETERAN" }
              as: IntakeClerk
              captures: { claim_a2: $.data.id }
            - call: "POST /pha/preference-claims/${claim_a2}/verify"
              payload: { decision: "VERIFY" }
              as: IntakeClerk
            - call: "POST /pha/applicants/${a3_id}/preference-claims"
              payload: { preference_type: "INVOLUNTARY_DISPLACEMENT" }
              as: IntakeClerk
              captures: { claim_a3: $.data.id }
            - call: "POST /pha/preference-claims/${claim_a3}/verify"
              payload: { decision: "VERIFY" }
              as: IntakeClerk
          trigger:
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
          assert:
            - "PRELIMINARY (immediately before the lottery-draw call): entry ${e1_id}.effective_rank == 1, entry ${e2_id}.effective_rank == 2, entry ${e3_id}.effective_rank == 3 (application_date ASC)"
            - "FINAL (after the lottery-draw call): entry ${e2_id}.total_points == 50, entry ${e3_id}.total_points == 40, entry ${e1_id}.total_points == 0"
            - "FINAL ranks: entry ${e2_id}.effective_rank == 1, entry ${e3_id}.effective_rank == 2, entry ${e1_id}.effective_rank == 3"
            - "the orderings diverge: entry ${e2_id} moves from PRELIMINARY rank 2 to FINAL rank 1"

  - rule_id: combinatorial_formula
    instances:
      - name: ttp_greatest_of_three_min_rent_floor
        grounds:
          - calculations.total_tenant_payment
          - entities.Certification.fields.ttp_cents
        distinguishing_aspect: >
          Mode (a): TTP = max(comp_adjusted, comp_gross, MINIMUM_RENT_CENTS) over 3 inputs;
          for a low-income household comp_adjusted == 3000 and comp_gross == 1000 both fall
          below the 5000 minimum-rent floor, so the constant-floor branch wins and
          ttp_cents == 5000 — a non-linear greatest-of, not a single weighted sum.
        test_recipe:
          setup:
            - "Single-member household (annual 120,000, no dependents) accepted into a bedroom-1 unit (UA 0, high income limit); Tenancy ACTIVE, no cert finalized yet."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "LowInc" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head Low", relationship: "HEAD", annual_income_cents: 120000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site B", bedroom_size: 1 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-2", bedroom_size: 1, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id, t_v: $.data.version }
          trigger:
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-04-01T00:00:00Z", expected_tenancy_version: "${t_v}" }
              as: HousingSpecialist
              captures: { cert_id: $.data.id }
            - call: "POST /pha/certifications/${cert_id}/finalize"
              payload: {}
              as: HousingSpecialist
          assert:
            - "Certification ${cert_id}.annual_adjusted_income_cents == 120000"
            - "Certification ${cert_id}.ttp_cents == 5000"
            - "the floor branch decided the result: both comp_adjusted (3000) and comp_gross (1000) are below MINIMUM_RENT_CENTS (5000)"

      - name: adjusted_income_medical_threshold_rounding
        grounds:
          - calculations.household_annual_adjusted_income
          - calculations.total_tenant_payment
          - entities.Certification.fields.annual_adjusted_income_cents
          - entities.Certification.fields.medical_expenses_annual_cents
        distinguishing_aspect: >
          Mode (b): the 3% medical threshold is round_half_up to whole cents (72300) BEFORE
          subtraction, and comp_adjusted = round_half_up(0.30 * 2124300 / 12) resolves the
          exact .5 case (53107.5 -> 53108) inside a single division-and-round step; adjusted
          == 2124300 and ttp == 53108 — order-sensitive rounding, a different mode than (a).
        test_recipe:
          setup:
            - "Elderly-head household (head annual 2,410,000, elderly) plus one disabled dependent (income 0, is_dependent, is_disabled); accepted into a bedroom-2 unit (UA 0, high income limit); Tenancy ACTIVE. Cert carries childcare 120,000 and medical 150,000."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Okafor" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head Okafor", relationship: "HEAD", annual_income_cents: 2410000, is_elderly: true }
              as: IntakeClerk
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Dep Okafor", relationship: "DEPENDENT", annual_income_cents: 0, is_dependent: true, is_disabled: true }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-3", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id, t_v: $.data.version }
          trigger:
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-04-01T00:00:00Z", expected_tenancy_version: "${t_v}", childcare_expenses_annual_cents: 120000, medical_expenses_annual_cents: 150000 }
              as: HousingSpecialist
              captures: { cert_id: $.data.id }
            - call: "POST /pha/certifications/${cert_id}/finalize"
              payload: {}
              as: HousingSpecialist
          assert:
            - "Certification ${cert_id}.annual_gross_income_cents == 2410000"
            - "Certification ${cert_id}.annual_adjusted_income_cents == 2124300"
            - "Certification ${cert_id}.ttp_cents == 53108"
            - "medical deduction used the rounded 72300 threshold (150000 - 72300 = 77700), and comp_adjusted resolved 53107.5 -> 53108 half-up"

  - rule_id: non_linear_state_machine
    instances:
      - name: certification_parallel_status_and_hud_axes
        grounds:
          - state_machines.Certification.EFFECTIVE_to_SUPERSEDED
          - state_machines.Certification.SUBMITTED_to_REJECTED
          - state_machines.Certification.REJECTED_to_SUBMITTED
          - entities.Certification.fields.hud_status
        distinguishing_aspect: >
          On one Certification the status axis walks EFFECTIVE -> SUPERSEDED while the
          hud_status axis independently walks SUBMITTED -> REJECTED -> SUBMITTED; the final
          observation cert1.status == SUPERSEDED with cert1.hud_status == SUBMITTED proves
          the two axes evolve independently (parallel dimensions on the same entity).
        test_recipe:
          setup:
            - "Tenancy ACTIVE with cert1 (ANNUAL, effective 2026-04-01) finalized EFFECTIVE; single-member household income 3,000,000, unit income limit high, UA 0."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Parallel" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head P", relationship: "HEAD", annual_income_cents: 3000000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-P", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-04-01T00:00:00Z", expected_tenancy_version: "${t_v}" }
              as: HousingSpecialist
              captures: { cert1_id: $.data.id }
            - call: "POST /pha/certifications/${cert1_id}/finalize"
              payload: {}
              as: HousingSpecialist
          trigger:
            - call: "POST /pha/certifications/${cert1_id}/hud-submit"
              payload: {}
              as: HousingSpecialist
            - call: "POST /pha/certifications/${cert1_id}/hud-result"
              payload: { result: "REJECTED" }
              as: HousingSpecialist
            - call: "POST /pha/certifications/${cert1_id}/hud-submit"
              payload: {}
              as: HousingSpecialist
            - call: "GET /pha/tenancies/${t_id}"
              payload: {}
              as: HousingSpecialist
              captures: { t_v2: $.data.version }
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-05-01T00:00:00Z", expected_tenancy_version: "${t_v2}" }
              as: HousingSpecialist
              captures: { cert2_id: $.data.id }
            - call: "POST /pha/certifications/${cert2_id}/finalize"
              payload: {}
              as: HousingSpecialist
          assert:
            - "Certification ${cert1_id}.status == SUPERSEDED"
            - "Certification ${cert1_id}.hud_status == SUBMITTED"
            - "Certification ${cert2_id}.status == EFFECTIVE and Certification ${cert2_id}.hud_status == NOT_SUBMITTED"
            - "the status axis moved to SUPERSEDED without disturbing the hud_status axis value SUBMITTED"

      - name: grievance_eviction_overruled_branch_cascade
        grounds:
          - state_machines.Grievance.FILED_to_OVERRULED
          - state_machines.Grievance.FILED_to_SUSTAINED
          - state_machines.Tenancy.ACTIVE_to_TERMINATED
        distinguishing_aspect: >
          Grievance FILED forks to SUSTAINED (tenancy unchanged) or OVERRULED; for an
          EVICTION the OVERRULED branch alone cascades Tenancy -> TERMINATED and Unit ->
          AVAILABLE, a divergent side-effect set the SUSTAINED branch does not produce.
        test_recipe:
          setup:
            - "Tenancy ACTIVE on a bedroom-2 unit; an EVICTION Grievance FILED against it by the PropertyManager."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Grieve" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head G", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-G", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id }
            - call: "POST /pha/tenancies/${t_id}/grievances"
              payload: { grievance_type: "EVICTION", reason: "chronic nonpayment" }
              as: PropertyManager
              captures: { griev_id: $.data.id }
          trigger:
            - call: "POST /pha/grievances/${griev_id}/decide"
              payload: { outcome: "OVERRULED" }
              as: PropertyManager
          assert:
            - "Grievance ${griev_id}.status == OVERRULED"
            - "Tenancy ${t_id}.status == TERMINATED and Tenancy ${t_id}.lease_end_date is set to the decision-time clock"
            - "Unit ${unit_id}.status == AVAILABLE and Unit ${unit_id}.last_lease_end_date == Tenancy ${t_id}.lease_end_date"

  - rule_id: transitive_cascade
    instances:
      - name: offer_accept_occupancy_chain
        grounds:
          - state_machines.Offer.PENDING_to_ACCEPTED
          - state_machines.Unit.OFFERED_to_OCCUPIED
          - state_machines.WaitlistEntry.OFFERED_to_HOUSED
          - state_machines.Applicant.WAITLISTED_to_HOUSED
        distinguishing_aspect: >
          A single accept triggers a depth-4 chain where each hop is caused by the prior:
          Offer -> ACCEPTED creates the Tenancy, the ACTIVE Tenancy drives Unit -> OCCUPIED,
          the OCCUPIED Unit drives entry1 -> HOUSED, and entry1 HOUSED drives Applicant ->
          HOUSED which withdraws the sibling entry2.
        test_recipe:
          setup:
            - "One applicant on TWO bedroom-2 waitlists, both drawn so entry1 (WL1) and entry2 (WL2) are ACTIVE; a bedroom-2 unit; an offer created on entry1 (entry1 OFFERED)."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Chain" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head C", relationship: "HEAD", annual_income_cents: 2400000 }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl1_id: $.data.id }
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site B", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl2_id: $.data.id }
            - call: "POST /pha/waitlists/${wl1_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry1_id: $.data.id }
            - call: "POST /pha/waitlists/${wl2_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry2_id: $.data.id }
            - call: "POST /pha/waitlists/${wl1_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/waitlists/${wl2_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-C", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 0 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry1_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
          trigger:
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id }
          assert:
            - "Offer ${offer_id}.status == ACCEPTED"
            - "Tenancy ${t_id}.status == ACTIVE and Tenancy ${t_id}.unit_id == ${unit_id}"
            - "Unit ${unit_id}.status == OCCUPIED"
            - "WaitlistEntry ${entry1_id}.status == HOUSED"
            - "Applicant ${app_id}.status == HOUSED"
            - "WaitlistEntry ${entry2_id}.status == WITHDRAWN"

      - name: interim_process_rent_recompute_chain
        grounds:
          - state_machines.InterimChange.REPORTED_to_PROCESSED
          - state_machines.Certification.EFFECTIVE_to_SUPERSEDED
          - calculations.monthly_tenant_rent_and_reimbursement
          - entities.Tenancy.fields.monthly_tenant_rent_cents
        distinguishing_aspect: >
          Processing an interim change is a depth-3 chain: InterimChange -> PROCESSED creates
          and finalizes an INTERIM cert2, cert2 becoming EFFECTIVE supersedes cert1, and
          cert2 EFFECTIVE recomputes Tenancy.monthly_tenant_rent_cents from 83600 to 77600 —
          each hop caused by the previous, a different trigger than the offer-accept chain.
        test_recipe:
          setup:
            - "Tenancy ACTIVE for the H1 household (head annual 3,600,000, nonrecurring 240,000; two dependents) in a bedroom-2 unit (UA 10,000); cert1 (ANNUAL) finalized EFFECTIVE at 2026-04-01 giving ttp 93600 and Tenancy rent 83600."
          setup_api_calls:
            - call: "POST /pha/applicants"
              payload: { household_name: "Alvarez2" }
              as: IntakeClerk
              captures: { app_id: $.data.id }
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Head A2", relationship: "HEAD", annual_income_cents: 3600000, nonrecurring_income_cents: 240000 }
              as: IntakeClerk
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Dep A", relationship: "DEPENDENT", annual_income_cents: 0, is_dependent: true }
              as: IntakeClerk
            - call: "POST /pha/applicants/${app_id}/members"
              payload: { full_name: "Dep B", relationship: "DEPENDENT", annual_income_cents: 0, is_dependent: true }
              as: IntakeClerk
            - call: "POST /pha/waitlists"
              payload: { site_name: "Site A", bedroom_size: 2 }
              as: IntakeClerk
              captures: { wl_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/entries"
              payload: { applicant_id: "${app_id}" }
              as: IntakeClerk
              captures: { entry_id: $.data.id }
            - call: "POST /pha/waitlists/${wl_id}/lottery-draw"
              payload: {}
              as: IntakeClerk
            - call: "POST /pha/units"
              payload: { address_label: "U-A2", bedroom_size: 2, income_limit_cents: 100000000, utility_allowance_cents: 10000 }
              as: PropertyManager
              captures: { unit_id: $.data.id }
            - call: "POST /pha/offers"
              payload: { waitlist_entry_id: "${entry_id}", unit_id: "${unit_id}", expires_at: "2026-12-31T00:00:00Z" }
              as: HousingSpecialist
              captures: { offer_id: $.data.id }
            - call: "POST /pha/offers/${offer_id}/accept"
              payload: {}
              as: Applicant
              as_user_id: "${app_id}"
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /pha/tenancies/${t_id}/certifications"
              payload: { cert_type: "ANNUAL", effective_date: "2026-04-01T00:00:00Z", expected_tenancy_version: "${t_v}" }
              as: HousingSpecialist
              captures: { cert1_id: $.data.id }
            - call: "POST /pha/certifications/${cert1_id}/finalize"
              payload: {}
              as: HousingSpecialist
          trigger:
            - call: "POST /pha/tenancies/${t_id}/interim-changes"
              payload: { change_type: "INCOME_DECREASE", effective_date: "2026-05-01T00:00:00Z" }
              as: Applicant
              as_user_id: "${app_id}"
              captures: { ic_id: $.data.id }
            - call: "POST /pha/interim-changes/${ic_id}/process"
              payload: { decision: "PROCESS" }
              as: HousingSpecialist
          assert:
            - "InterimChange ${ic_id}.status == PROCESSED"
            - "Certification ${cert1_id}.status == SUPERSEDED"
            - "the INTERIM Certification whose source_interim_change_id == ${ic_id} has status == EFFECTIVE and ttp_cents == 87600"
            - "Tenancy ${t_id}.monthly_tenant_rent_cents == 77600 (recomputed from 83600 via the cascade)"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: accept_invalid_state_beats_offer_expired
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_OFFER_EXPIRED]
        distinguishing_aspect: >
          Accepting an offer that is BOTH REFUSED (state, priority 5) and past its expires_at
          (business_temporal, priority 9) returns ERR_INVALID_STATE — the state category
          outranks the temporal category. Pair {state, business_temporal}.
        test_recipe:
          setup:
            - "A bedroom-2 unit offered to a drawn ACTIVE entry with expires_at 2026-03-05; the applicant has already REFUSED that offer; the clock is then advanced to 2026-03-10 (past expiry)."
          setup_api_calls:
