            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: GrowerManager
            - call: "POST /zones"
              payload: { code: "ZC-43", area_sqft: 9450, glazing_type: "GLASS", has_thermal_screen: true, has_supplemental_lighting: true, chp_connected: true, hive_slot_capacity: 8, labor_budget_usd: 20000.00 }
              as: GrowerManager
              captures: { zc43: $.data.id }
            - call: "POST /varieties"
              payload: { name: "Merlice TOV", crop_type: "TOMATO", cycle_length_weeks: 13, first_harvest_week: 4, plant_density_per_sqft: 0.24, yield_curve_lbs_per_sqft: [0.4, 0.8, 1.1, 1.3, 1.3, 1.2, 1.0, 0.9, 0.7, 0.5], grade_a_ratio_pct: 60, requires_pollination: true, ec_target_ms: 3.0 }
