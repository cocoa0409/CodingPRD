        distinguishing_aspect: "A second decision reaches execution against an already-EXITED account and fails the account-state precondition with ERR_ACCOUNT_NOT_OPEN."
        test_recipe:
          setup: ["Account ac1 EXITED via an executed EXIT decision; a second EXIT decision on ac1 is PROPOSED and APPROVED"]
          setup_api_calls:
            - { call: "POST /analysts", payload: { full_name: "Ann Analyst", capacity_max_cases: 10 }, as: ComplianceAdmin, captures: { an1: $.data.id } }
