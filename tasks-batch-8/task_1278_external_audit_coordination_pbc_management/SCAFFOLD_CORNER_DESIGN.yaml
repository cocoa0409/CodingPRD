# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth probe across claim-extraction-guide taxonomy; complements §1.8
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  # Section: entities — creation, retrieval, defaults, required fields
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: engagement_creation_returns_all_fields
        claim_type: creation
        grounds:
          - entities.AuditEngagement
          - endpoints[POST /audit-engagements]
        distinguishing_aspect: |
          POST with all required input fields returns 201 plus the full
          AuditEngagement shape including server-minted id, computed
          total_fee_cents, posture, open_pbc_count, and common fields.
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "AlphaCo", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id, eng_status: $.data.status, eng_posture: $.data.posture, eng_total_fee: $.data.total_fee_cents, eng_open_pbc: $.data.open_pbc_count }
          trigger: []
          assert:
            - "AuditEngagement.${eng_id}.status == PLANNING"
            - "AuditEngagement.${eng_id}.posture == OPEN"
            - "AuditEngagement.${eng_id}.total_fee_cents == 500000 (initial = base_fee_cents)"
            - "AuditEngagement.${eng_id}.open_pbc_count == 0"
            - "AuditEngagement.${eng_id}.open_query_count == 0"
            - "AuditEngagement.${eng_id}.passed_adjustment_total_cents == 0"

      - name: engagement_get_by_id_returns_persisted_fields
        claim_type: retrieval
        grounds:
          - entities.AuditEngagement
          - endpoints[GET /audit-engagements/{id}]
        distinguishing_aspect: "GET /audit-engagements/{id} returns the same client_name, base_fee_cents, materiality_cents, filing_deadline as POSTed."
        test_recipe:
          setup: ["Engagement E1 created"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "BetaCo", fiscal_year_end: "2026-06-30", base_fee_cents: 700000, materiality_cents: 75000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
          trigger:
            - call: "GET /audit-engagements/${eng_id}"
              as: Preparer
              captures: { name_back: $.data.client_name, fee_back: $.data.base_fee_cents }
          assert:
            - "GET response.client_name == 'BetaCo'"
            - "GET response.base_fee_cents == 700000"

      - name: engagement_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_ENGAGEMENT_NOT_FOUND]
          - endpoints[GET /audit-engagements/{id}]
        distinguishing_aspect: "GET /audit-engagements/<random-uuid> returns ERR_ENGAGEMENT_NOT_FOUND with http 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /audit-engagements/00000000-0000-0000-0000-000000000000"
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ENGAGEMENT_NOT_FOUND"

      - name: engagement_list_pagination_envelope
        claim_type: listing
        grounds:
          - endpoints[GET /audit-engagements]
          - response_envelope.pagination_fields
        distinguishing_aspect: "List endpoint returns response envelope with limit, offset, total_count, has_more."
        test_recipe:
          setup: ["Two engagements created"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C1", fiscal_year_end: "2026-06-30", base_fee_cents: 100000, materiality_cents: 10000, filing_deadline: "2026-12-31" }
              as: Controller
            - call: "POST /audit-engagements"
              payload: { client_name: "C2", fiscal_year_end: "2026-06-30", base_fee_cents: 100000, materiality_cents: 10000, filing_deadline: "2026-12-31" }
              as: Controller
          trigger:
            - call: "GET /audit-engagements"
              as: Controller
          assert:
            - "response.meta.api_request_id present"
            - "response.response_type == 'array'"
            - "response contains pagination fields limit, offset, total_count, has_more"

      - name: location_materiality_must_not_exceed_engagement
        claim_type: type_constraint
        grounds:
          - entities.Location.fields.materiality_cents
          - errors[ERR_LOCATION_MATERIALITY_TOO_HIGH]
        distinguishing_aspect: "Creating a Location with materiality_cents > engagement.materiality_cents returns ERR_LOCATION_MATERIALITY_TOO_HIGH."
        test_recipe:
          setup: ["Engagement E with materiality=50000"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
          trigger:
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "TooBig", materiality_cents: 75000 }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_LOCATION_MATERIALITY_TOO_HIGH"

      - name: evidence_upload_invalid_sha256_rejected
        claim_type: type_constraint
        grounds:
          - entities.EvidenceUpload.fields.sha256
          - errors[ERR_INVALID_HASH]
        distinguishing_aspect: "EvidenceUpload create with sha256 not 64 lowercase hex chars returns ERR_INVALID_HASH."
        test_recipe:
          setup: ["Engagement E in FIELDWORK with PBCRequest P1 owned by prep1"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/pbc-requests"
              payload: { title: "T", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
            - call: "GET /audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v: $.data.version }
          trigger:
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "f.pdf", file_size_bytes: 100, sha256: "not_a_valid_hash", expected_engagement_version: "${eng_v}" }
              as: Preparer
              as_user_id: "prep1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_HASH"

  # ---------------------------------------------------------------------------
  # Section: state_machines — valid transitions, invalid-from rejections,
  # terminal lockdown, idempotency, side effects
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: pbc_submit_from_open_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.PBCRequest
          - errors[ERR_PBC_NOT_SUBMITTABLE]
        distinguishing_aspect: "Submitting a PBCRequest still in OPEN (never uploaded) returns ERR_PBC_NOT_SUBMITTABLE; status unchanged."
        test_recipe:
          setup: ["Engagement E in FIELDWORK; PBCRequest P1 OPEN"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/pbc-requests"
              payload: { title: "T", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
          trigger:
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/submit"
              payload: {}
              as: Preparer
              as_user_id: "prep1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PBC_NOT_SUBMITTABLE"
            - "PBCRequest.${pbc_id}.status == OPEN"

      - name: pbc_terminal_accepted_rejects_further_upload
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PBCRequest
          - errors[ERR_PBC_NOT_OPEN_FOR_UPLOAD]
        distinguishing_aspect: "Once ACCEPTED (terminal), further evidence upload returns ERR_PBC_NOT_OPEN_FOR_UPLOAD."
        test_recipe:
          setup: ["Engagement E in FIELDWORK; PBCRequest P1 ACCEPTED"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/pbc-requests"
              payload: { title: "T", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
            - call: "GET /audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v: $.data.version }
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "f.pdf", file_size_bytes: 100, sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", expected_engagement_version: "${eng_v}" }
              as: Preparer
              as_user_id: "prep1"
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/submit"
              payload: {}
              as: Preparer
              as_user_id: "prep1"
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/review"
              payload: { decision: "ACCEPT" }
              as: ExternalAuditor
            - call: "GET /audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v2: $.data.version }
          trigger:
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "f2.pdf", file_size_bytes: 200, sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", expected_engagement_version: "${eng_v2}" }
              as: Preparer
              as_user_id: "prep1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_PBC_NOT_OPEN_FOR_UPLOAD"

      - name: query_close_from_open_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.AuditorQuery
          - errors[ERR_QUERY_NOT_CLOSABLE]
        distinguishing_aspect: "Closing a query still OPEN (never routed/responded) returns ERR_QUERY_NOT_CLOSABLE."
        test_recipe:
          setup: ["Engagement E in FIELDWORK; AuditorQuery Q1 OPEN"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/queries"
              payload: { subject: "S", severity: "LOW" }
              as: ExternalAuditor
              captures: { q_id: $.data.id }
          trigger:
            - call: "POST /audit-engagements/${eng_id}/queries/${q_id}/close"
              payload: {}
              as: ExternalAuditor
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_QUERY_NOT_CLOSABLE"

      - name: adjustment_disposition_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.AuditAdjustment
          - errors[ERR_ADJUSTMENT_NOT_PROPOSED]
        distinguishing_aspect: "After ACCEPTED, further disposition attempts return ERR_ADJUSTMENT_NOT_PROPOSED."
        test_recipe:
          setup: ["Engagement E in FIELDWORK; AuditAdjustment AdjA ACCEPTED"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/adjustments"
              payload: { description: "A", amount_cents: 5000, direction: "DEBIT" }
              as: ExternalAuditor
              captures: { adj_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/adjustments/${adj_id}/disposition"
              payload: { disposition: "ACCEPT" }
              as: Controller
          trigger:
            - call: "POST /audit-engagements/${eng_id}/adjustments/${adj_id}/disposition"
              payload: { disposition: "REJECT", rationale: "Second thoughts" }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ADJUSTMENT_NOT_PROPOSED"
            - "AuditAdjustment.${adj_id}.disposition == ACCEPTED (unchanged)"

      - name: fee_change_resolution_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.FeeChangeRequest
          - errors[ERR_FEE_CHANGE_NOT_PROPOSED]
        distinguishing_aspect: "Resolving an already-APPROVED fee change request returns ERR_FEE_CHANGE_NOT_PROPOSED."
        test_recipe:
          setup: ["Engagement E in FIELDWORK; FeeChangeRequest F1 APPROVED"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests"
              payload: { scope_description: "S", delta_cents: 50000 }
              as: ExternalAuditor
              captures: { fee_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests/${fee_id}/resolve"
              payload: { decision: "APPROVE" }
              as: Controller
          trigger:
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests/${fee_id}/resolve"
              payload: { decision: "REJECT" }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_FEE_CHANGE_NOT_PROPOSED"
            - "FeeChangeRequest.${fee_id}.status == APPROVED (unchanged)"

      - name: evidence_superseded_on_second_acceptance
        claim_type: side_effect_execution
        grounds:
          - state_machines.EvidenceUpload.ACCEPTED_to_SUPERSEDED
          - entities.PBCRequest.fields.current_evidence_id
        distinguishing_aspect: "When a second upload is ACCEPTED, the previously-ACCEPTED upload transitions to SUPERSEDED and PBCRequest.current_evidence_id points at the new upload."
        test_recipe:
          setup: ["Engagement E in FIELDWORK; PBCRequest P1 has gone through one full upload+submit+accept cycle"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 50000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/pbc-requests"
              payload: { title: "T", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
            - call: "GET /audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v1: $.data.version }
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "v1.pdf", file_size_bytes: 100, sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", expected_engagement_version: "${eng_v1}" }
              as: Preparer
              as_user_id: "prep1"
              captures: { u1_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/submit"
              payload: {}
              as: Preparer
              as_user_id: "prep1"
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/review"
              payload: { decision: "REJECT", rationale: "needs more" }
              as: ExternalAuditor
            - call: "GET /audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v2: $.data.version }
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "v2.pdf", file_size_bytes: 200, sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", expected_engagement_version: "${eng_v2}" }
              as: Preparer
              as_user_id: "prep1"
              captures: { u2_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/submit"
              payload: {}
              as: Preparer
              as_user_id: "prep1"
          trigger:
            - call: "POST /audit-engagements/${eng_id}/pbc-requests/${pbc_id}/review"
              payload: { decision: "ACCEPT" }
              as: ExternalAuditor
          assert:
            - "EvidenceUpload.${u1_id}.status == REJECTED (rejected in prior cycle, not superseded)"
            - "EvidenceUpload.${u2_id}.status == ACCEPTED"
            - "PBCRequest.${pbc_id}.current_evidence_id == ${u2_id}"

  # ---------------------------------------------------------------------------
  # Section: calculations — beyond difficulty rules, verify formula claims
  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: engagement_total_fee_ignores_rejected_and_withdrawn
        claim_type: input_set_filtering
        grounds:
          - calculations.engagement_total_fee
          - entities.AuditEngagement.fields.total_fee_cents
        distinguishing_aspect: "total_fee_cents counts only APPROVED fee changes; REJECTED and WITHDRAWN deltas are excluded from the input set."
        test_recipe:
          setup: ["Engagement E with base=1000000; F1 APPROVED +50000, F2 REJECTED +70000, F3 WITHDRAWN +30000"]
          setup_api_calls:
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 1000000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests"
              payload: { scope_description: "F1", delta_cents: 50000 }
              as: ExternalAuditor
              captures: { f1_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests"
              payload: { scope_description: "F2", delta_cents: 70000 }
              as: ExternalAuditor
              captures: { f2_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests"
              payload: { scope_description: "F3", delta_cents: 30000 }
              as: ExternalAuditor
              captures: { f3_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests/${f1_id}/resolve"
              payload: { decision: "APPROVE" }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests/${f2_id}/resolve"
              payload: { decision: "REJECT" }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/fee-change-requests/${f3_id}/withdraw"
              payload: {}
              as: ExternalAuditor
          trigger:
            - call: "GET /audit-engagements/${eng_id}"
              as: Controller
              captures: { total_fee: $.data.total_fee_cents }
          assert:
            - "AuditEngagement.${eng_id}.total_fee_cents == 1050000 (base + APPROVED only)"

      - name: query_turnaround_hours_boundary_below_one_hour
        claim_type: correct_result
        grounds:
          - calculations.query_turnaround_hours
        distinguishing_aspect: "Respond 30 minutes (1800 s) after raise: turnaround_hours == 1 (ceil)."
        test_recipe:
          setup: ["Engagement E in FIELDWORK; Q1 raised at T0, routed"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Controller
            - call: "POST /audit-engagements"
              payload: { client_name: "C", fiscal_year_end: "2026-06-30", base_fee_cents: 500000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/locations"
              payload: { location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /audit-engagements/${eng_id}/queries"
              payload: { subject: "Q", severity: "LOW" }
              as: ExternalAuditor
              captures: { q_id: $.data.id }
            - call: "POST /audit-engagements/${eng_id}/queries/${q_id}/route-to-client"
              payload: {}
              as: ExternalAuditor
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:30:00Z" }
              as: Controller
          trigger:
