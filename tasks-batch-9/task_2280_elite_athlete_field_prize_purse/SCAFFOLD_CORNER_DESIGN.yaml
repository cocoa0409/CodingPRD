            - "trigger call 3 returns HTTP 404 with error_id == ERR_PERFORMANCE_RECORD_NOT_FOUND"
            - "trigger call 4 returns HTTP 201 with status == DRAFT once all four FKs resolve"
            - "trigger call 5 returns total_count == 1 — the three rejected requests created nothing"

  # ===========================================================================
  # From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: corner_open_field_moves_edition_planning_to_field_open
        claim_type: valid_transition
        grounds:
          - state_machines.RaceEdition.PLANNING_to_FIELD_OPEN
        distinguishing_aspect: >-
          open-field is the one call that flips a fully configured PLANNING edition to FIELD_OPEN and
          bumps its version; before it, invitation creation is impossible.
        test_recipe:
          setup:
            - "One PLANNING edition with one ELITE MALE standard and one OVERALL MALE purse line — a complete minimum configuration."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Open Field Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id", ed_v0: "$.data.version" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
          trigger:
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 200 with status == FIELD_OPEN"
            - "trigger call 1 returns version == ${ed_v0} + 1"
            - "trigger call 2 confirms status == FIELD_OPEN was persisted, with the ledger untouched: appearance_committed_cents == 0 and purse_allocated_cents == 0"

      - name: corner_open_field_precondition_requires_standards_and_purse_lines
        claim_type: precondition_enforcement
        grounds:
          - state_machines.RaceEdition.PLANNING_to_FIELD_OPEN
          - errors.ERR_EDITION_CONFIG_INCOMPLETE
          - validations[priority=7]
        distinguishing_aspect: >-
          The PLANNING to FIELD_OPEN precondition requires BOTH at least one DivisionStandard and at
          least one PurseLine, so an edition holding only one of the two must still be refused with
          ERR_EDITION_CONFIG_INCOMPLETE.
        test_recipe:
          setup:
            - "One PLANNING edition with no configuration rows at all."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Incomplete Config Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
          trigger:
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
              captures: { err1: "$.data.error_id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
              captures: { err2: "$.data.error_id" }
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 422 with error_id == ERR_EDITION_CONFIG_INCOMPLETE — neither standards nor purse lines exist"
            - "trigger call 3 returns HTTP 422 with error_id == ERR_EDITION_CONFIG_INCOMPLETE — a standard alone is not enough"
            - "trigger call 5 returns HTTP 200 with status == FIELD_OPEN once both configuration kinds exist"
            - "the edition remained PLANNING through both rejections, so no partial transition occurred"

      - name: corner_offer_side_effects_stamp_deadline_round_and_negotiator
        claim_type: side_effect_execution
        grounds:
          - state_machines.Invitation.DRAFT_to_OFFERED
          - entities.Invitation.fields.offer_sent_at
          - entities.Invitation.fields.response_deadline_at
          - entities.Invitation.fields.negotiated_by_user_id
        distinguishing_aspect: >-
          Every declared side effect of DRAFT to OFFERED must fire in one call: round 1 is created on
          the COMMITTEE side, offer_sent_at takes the logical clock, response_deadline_at is clock
          plus offer_response_days, negotiated_by_user_id records the caller and the current_* terms
          mirror the payload.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition with offer_response_days set explicitly to 10 and an ELITE MALE standard of 8100."
            - "One athlete with a VERIFIED 7900 performance, one ACTIVE agent, one DRAFT invitation; the clock reads 2026-08-05T12:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "Side Effect Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0, offer_response_days: 10 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "Side Effect Reps", license_code: "AGT-SE-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
              payload: { full_name: "Stamped Stan", country_code: USA, gender: MALE, birth_date: "1996-11-11" }
              as: ElitesDirector
              captures: { ath_id: "$.data.id" }
            - call: POST /performance-records
              payload: { athlete_id: "${ath_id}", race_name: "Qual SE", performance_date: "2026-03-01", performance_seconds: 7900, division: ELITE, sanctioning_ref: "SB-SE-1", chip_timed: true }
              as: AthleteAgent
              as_user_id: "${agt_id}"
              captures: { pr_id: "$.data.id" }
            - call: POST /performance-records/${pr_id}/verification
              payload: { decision: VERIFIED, official_seconds: 7900 }
              as: TechnicalOfficial
            - call: POST /invitations
              payload: { race_edition_id: "${ed_id}", athlete_id: "${ath_id}", agent_id: "${agt_id}", qualifying_performance_id: "${pr_id}", division: ELITE }
              as: ElitesDirector
              captures: { inv_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-05T12:00:00Z" }
              as: ElitesDirector
          trigger:
            - call: POST /invitations/${inv_id}/offer
              payload: { appearance_fee_cents: 900000, air_class: BUSINESS, hotel_nights: 3, ground_transport: true, note: "committee opening package" }
              as: ElitesDirector
              as_user_id: "director-7"
            - call: GET /invitations/${inv_id}/negotiation-rounds
              as: ElitesDirector
          assert:
            - "trigger call 1 returns status == OFFERED, offer_sent_at == \"2026-08-05T12:00:00.000Z\" and response_deadline_at == \"2026-08-15T12:00:00.000Z\" (clock + offer_response_days 10)"
            - "trigger call 1 returns negotiated_by_user_id == \"director-7\", current_appearance_fee_cents == 900000, current_air_class == BUSINESS, current_hotel_nights == 3 and current_ground_transport == true"
            - "trigger call 1 returns guaranteed_commitment_cents == 1554000 (900,000 + 540,000 BUSINESS + 96,000 for 3 nights + 18,000 ground) and round_count == 1"
            - "trigger call 2 returns total_count == 1 with data[0].round_number == 1, data[0].side == COMMITTEE and data[0].note == \"committee opening package\""

      - name: corner_lock_field_from_planning_is_an_invalid_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.RaceEdition
          - errors.ERR_EDITION_STATE_INVALID
          - validations[priority=8]
        distinguishing_aspect: >-
          RaceEdition's posture pipeline admits no shortcut: lock-field, mark-raced and
          certify-results are all illegal from PLANNING and must each report
          ERR_EDITION_STATE_INVALID rather than skipping ahead.
        test_recipe:
          setup:
            - "One fully configured but still PLANNING edition (open-field has not been called)."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
              payload: { name: "No Shortcut Marathon", city: "Metro City", race_date: "2026-11-01", appearance_budget_cents: 9000000, total_purse_cents: 3000000, bonus_pool_cap_cents: 0 }
              as: ElitesDirector
              captures: { ed_id: "$.data.id" }
            - call: POST /division-standards
              payload: { race_edition_id: "${ed_id}", division: ELITE, gender: MALE, max_qualifying_seconds: 8100, bib_range_start: 11, bib_range_end: 20 }
              as: ElitesDirector
            - call: POST /purse-lines
              payload: { race_edition_id: "${ed_id}", category: OVERALL, gender: MALE, place: 1, amount_cents: 1000000 }
              as: ElitesDirector
          trigger:
            - call: POST /race-editions/${ed_id}/lock-field
              as: ElitesDirector
              captures: { err1: "$.data.error_id" }
            - call: POST /race-editions/${ed_id}/mark-raced
              as: TechnicalOfficial
              captures: { err2: "$.data.error_id" }
            - call: POST /race-editions/${ed_id}/certify-results
              as: TechnicalOfficial
              captures: { err3: "$.data.error_id" }
            - call: GET /race-editions/${ed_id}
              as: ElitesDirector
          assert:
            - "trigger call 1 returns HTTP 409 with error_id == ERR_EDITION_STATE_INVALID"
            - "trigger call 2 returns HTTP 409 with error_id == ERR_EDITION_STATE_INVALID"
            - "trigger call 3 returns HTTP 409 with error_id == ERR_EDITION_STATE_INVALID"
            - "trigger call 4 returns status == PLANNING with version unchanged from creation — three rejected transitions must not bump the version"

      - name: corner_initial_states_of_every_created_row
        claim_type: initial_state
        grounds:
          - state_machines.RaceEdition.initial_state
          - state_machines.Invitation.initial_state
          - state_machines.PerformanceRecord.initial_state
          - state_machines.DopingTest.initial_state
          - state_machines.RaceResult.initial_state
        distinguishing_aspect: >-
          Each entity with a state machine must be born in its declared initial state — edition
          PLANNING, invitation DRAFT, performance record SUBMITTED with verified_seconds null, doping
          test SCHEDULED — and never in a downstream state.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition with an ELITE MALE standard, one athlete and one agent."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ElitesDirector
            - call: POST /race-editions
