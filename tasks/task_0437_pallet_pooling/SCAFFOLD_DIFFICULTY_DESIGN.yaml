              as: PoolOperator
              captures: { z1: $.data.id }
            - call: "POST /assets"
              payload: { asset_type_id: "${at_id}", serial: "Z2", in_service_at: "2026-01-01T00:00:00Z", current_location_id: "${stock_id}" }
              as: PoolOperator
              captures: { z2: $.data.id }
            - call: "POST /transfer-orders"
              payload: { from_location_id: "${stock_id}", to_location_id: "${l1_id}", kind: "ISSUANCE", asset_ids: ["${z1}","${z2}"] }
              as: PoolOperator
              captures: { to_id: $.data.id }
