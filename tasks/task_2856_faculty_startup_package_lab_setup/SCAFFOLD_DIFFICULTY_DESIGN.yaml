  # =========================================================================
  # Rule 4 - transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: separation_depth_four_faculty_to_package_to_appointment_to_tranche_to_funder
        grounds:
          - state_machines.Faculty.transitions.DEPARTURE_NOTICE_to_DEPARTED
          - state_machines.StartupPackage.transitions.FROZEN_to_SETTLED
          - state_machines.StaffAppointment.transitions.ACTIVE_to_ENDED
          - state_machines.CommitmentTranche.transitions.OPEN_to_RECAPTURED
          - calculations.separation_settlement
          - calculations.staff_encumbrance_rounding
          - entities.FundingUnit.fields.reserved_cents
          - entities.FundingUnit.fields.refunded_cents
        distinguishing_aspect: |
          One POST /faculty/{id}/separate propagates four causal hops - Faculty -> StartupPackage
          spend_status -> StaffAppointment -> CommitmentTranche -> FundingUnit - where each hop is
          caused by the previous one: the package settles because the faculty separated, the
          appointment ends because the package settled, the personnel tranche's balances move
          because the appointment ended, and the funder pools move because the tranche's rows were
          written; the terminal observable is FundingUnit.reserved_cents landing on exactly the
          disbursed share (808499 / 628832 / 359333).
        test_recipe:
          setup:
            - "BASE fixture: three funding units, ACTIVE faculty, ACTIVE package with six tranches, spend_status SPENDING, clock 2026-08-01T00:00:00Z."
            - "One ACTIVE LAB_MANAGER appointment (fte 0.77, monthly_cost_cents 583333, 2026-09-01 .. 2027-08-31) holding an open encumbrance of 5_389_992 against the PERSONNEL tranche."
            - "A departure notice with intent DEPARTURE effective 2026-12-31 freezes the package; the clock is then advanced to 2026-12-31T00:00:00Z so the separation is due and exactly 4 of the 12 committed months have been served."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
              as: DeanOffice
              captures: { col6_id: $.data.id }
