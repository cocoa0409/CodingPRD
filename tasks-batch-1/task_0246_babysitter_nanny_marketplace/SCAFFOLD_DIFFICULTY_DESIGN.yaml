              as: PlatformAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /marketplace/caregivers"
              payload: { full_name: "Eli", email: "eli@x.com", hourly_rate_floor_cents: 1500 }
              as: PlatformAdmin
              captures: { cg_id: $.data.id }
            - call: "POST /marketplace/caregivers/${cg_id}/availability"
              payload: { availability_status: "AVAILABLE" }
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/background-checks"
              payload: { caregiver_id: "${cg_id}", requested_tier: "BASIC" }
              as: PlatformAdmin
              captures: { bc_id: $.data.id }
            - call: "POST /marketplace/background-checks/${bc_id}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /marketplace/background-checks/${bc_id}/adjudicate"
              payload: { decision: "CLEAR" }
              as: PlatformAdmin
            - call: "POST /marketplace/job-postings"
              payload: { family_id: "${fam_id}", title: "Sitter", care_type: "ONE_TIME", family_pay_rate_cents: 2000, required_tier: "BASIC" }
              as: Family
              as_user_id: "${fam_id}"
              captures: { jp_id: $.data.id }
            - call: "POST /marketplace/bookings"
              payload: { family_id: "${fam_id}", caregiver_id: "${cg_id}", job_posting_id: "${jp_id}", agreed_rate_cents: 2000, scheduled_start: "2026-03-15T08:00:00Z", scheduled_end: "2026-03-15T14:00:00Z", recurrence_count: 1 }
              as: Family
              as_user_id: "${fam_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /marketplace/bookings/${bk_id}/confirm"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-15T08:00:00Z" }
              as: PlatformAdmin
            - call: "GET /marketplace/sessions"
              payload: {}
              as: PlatformAdmin
              captures: { sess_id: "$.data[0].id" }
            - call: "POST /marketplace/sessions/${sess_id}/clock-in"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
            - call: "POST /marketplace/_clock/set"
              payload: { to_iso8601: "2026-03-15T16:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /marketplace/sessions/${sess_id}/clock-out"
              payload: {}
              as: Caregiver
              as_user_id: "${cg_id}"
          assert:
            - "BookingSession.${sess_id}.actual_hours == 8.5"
            - "BookingSession.${sess_id}.gross_pay_cents == 19250"

      - name: payout_fica_round_per_session_then_sum
        grounds:
          - calculations.compute_payout_withholding
          - entities.Payout.fields.fica_withheld_cents
          - entities.Payout.fields.net_pay_cents
        distinguishing_aspect: |
          Mode (b): FICA is rounded per session then summed (1010+1473+528=3011), which differs from
          sum-then-round (round(39350*0.0765)=3010); the scaffold pins per-session-then-sum.
        test_recipe:
          setup:
            - "Caregiver CLEAR/AVAILABLE; three COMPLETED one-time sessions for the same family with gross 13200, 19250, 6900."
          setup_api_calls:
            - call: "POST /marketplace/_clock/set"
