            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Ridgeway Brands LLC", us_address_line: "3 Mill Ct, Raleigh NC 27601", contact_phone: "+1-202-555-0116", contact_email: "rp@ridgeway.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Ridgeway Nail Extension Gel", category_code: "08D", product_form: "LEAVE_ON", professional_use_only: false, label_contact_type: "DOMESTIC_ADDRESS", label_contact_value: "3 Mill Ct, Raleigh NC 27601" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/substantiations"
              payload: { assessor_name: "Dr P Nayar", assessment_basis: "PANEL_MONOGRAPH" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "CLINICAL_SAFETY_STUDY", reviewer_credential: "BOARD_CERTIFIED_TOXICOLOGIST", citation: "Panel monograph 41" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/review-items"
              payload: { evidence_type: "IN_VITRO_TOXICOLOGY", reviewer_credential: "ERT", citation: "OECD 442D report" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/substantiations/${sub_id}/review-decision"
              payload: { review_mode: "FULL" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/listings/${lst_id}/submit"
              payload: {}
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/listings/${lst_id}/listing-decision"
              payload: { decision: "LIST" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/_clock/set_current_utc"
              payload: { current_utc: "2028-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "OPS-1"
          trigger:
            - call: "POST /cosmetics/_ops/compliance-sweep"
              payload: {}
              as: SystemOperator
              as_user_id: "OPS-1"
              captures: { lapsed: $.data.lapsed_facility_count, suspended: $.data.suspended_listing_count, revalidated: $.data.revalidation_required_count }
          assert:
            - "before the trigger: Facility.${fac_id}.registration_status == REGISTERED, compliance_posture == OPEN, listed_product_count == 1; ResponsiblePerson.${rp_id}.active_designation_count == 1 with status ACTIVE"
            - "hop 1: Facility.${fac_id}.registration_status == LAPSED and the RegistrationPeriod with sequence_index 1 has status EXPIRED"
            - "hop 2: Facility.${fac_id}.compliance_posture == FROZEN while serious_event_points is still 0.0 (the override branch, not the points branch)"
            - "hop 3: ProductListing.${lst_id}.listing_status == SUSPENDED with suspension_reason == FACILITY_LAPSED, marketable == false, and Facility.${fac_id}.listed_product_count == 0"
            - "hop 4: ResponsiblePerson.${rp_id}.active_designation_count == 0 and status == DORMANT"
            - "the hop-2 escalation also moved SafetySubstantiation.${sub_id} to REVALIDATION_REQUIRED and ProductListing.${lst_id}.safety_status to REVALIDATION_REQUIRED"
            - "${lapsed} == 1 and ${suspended} == 1 and ${revalidated} == 1, while the same response reports renewal_due_facility_count == 0 (the facility went straight past its period end)"
            - "a second identical sweep at the unchanged clock returns all-zero counts and changes nothing"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: stale_listing_version_outranks_same_person_transfer_target
        grounds:
          - validations[priority=18]
          - validations[priority=49]
          - concurrency_rules[transfer-designation-stale-listing]
          - entities.ProductListing.fields.responsible_person_id
        distinguishing_aspect: |
          Error-category pair STATE (priority 18, ERR_STALE_LISTING_VERSION, 412) versus
          BUSINESS_CONSTRAINT (priority 49, ERR_TRANSFER_TARGET_SAME_PERSON, 422). One request violates
          both: the expected_listing_version is the pre-transfer value while the incoming designee is
          already the listing's current designee. The OCC state check must win, so the caller learns
          its snapshot is stale before it learns the target is redundant — the reverse order would
          leak a 422 about a conflict the caller could not have known about.
        test_recipe:
          setup:
            - "one REGISTERED facility and two ResponsiblePersons, RP_A and RP_B"
            - "one DRAFT listing created under RP_A; its version at creation (1) is captured before any transfer"
            - "one successful transfer of the listing from RP_A to RP_B, which bumps ProductListing.version to 2 and makes the captured version stale"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Trellis Cosmetics", owner_operator_name: "Trellis Group", facility_type: "MANUFACTURER", country_code: "US", state_or_province: "MN" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Trellis Brands A", us_address_line: "20 Elm St, Duluth MN 55802", contact_phone: "+1-202-555-0117", contact_email: "a@trellis.example" }
              as: ResponsiblePersonAgent
              captures: { rp_a_id: $.data.id }
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Trellis Brands B", us_address_line: "22 Elm St, Duluth MN 55802", contact_phone: "+1-202-555-0118", contact_email: "b@trellis.example" }
              as: ResponsiblePersonAgent
              captures: { rp_b_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_a_id}", product_name: "Trellis Hair Straightener", category_code: "05G", product_form: "RINSE_OFF", professional_use_only: false, label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "care@trellis.example" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_a_id}"
              captures: { lst_id: $.data.id, lst_v_pre: $.data.version }
            - call: "POST /cosmetics/listings/${lst_id}/transfer-responsible-person"
              payload: { responsible_person_id: "${rp_b_id}", expected_listing_version: "${lst_v_pre}" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_a_id}"
              captures: { lst_v_post: $.data.version }
          trigger:
            - call: "POST /cosmetics/listings/${lst_id}/transfer-responsible-person"
              payload: { responsible_person_id: "${rp_b_id}", expected_listing_version: "${lst_v_pre}" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_b_id}"
          assert:
            - "after the setup transfer: ProductListing.${lst_id}.responsible_person_id == ${rp_b_id} and ${lst_v_post} == ${lst_v_pre} + 1"
            - "the trigger returns ERR_STALE_LISTING_VERSION with http 412 — NOT ERR_TRANSFER_TARGET_SAME_PERSON (422), even though the same request also violates validations[priority=49]"
            - "after the trigger: ProductListing.${lst_id}.version == ${lst_v_post} (unchanged) and responsible_person_id == ${rp_b_id}"
            - "ResponsiblePerson.${rp_a_id}.active_designation_count == 0 and ResponsiblePerson.${rp_b_id}.active_designation_count == 0 throughout (a DRAFT listing occupies no designation slot, so the rejected write leaves the slot ledger untouched)"
            - "repeating the trigger with expected_listing_version == ${lst_v_post} instead returns ERR_TRANSFER_TARGET_SAME_PERSON (422): with the state check satisfied, the lower-priority rule becomes observable"

      - name: allergen_disclosure_gap_outranks_designation_cap_at_submit
        grounds:
          - validations[priority=32]
          - validations[priority=53]
          - calculations.allergen_disclosure_completeness
