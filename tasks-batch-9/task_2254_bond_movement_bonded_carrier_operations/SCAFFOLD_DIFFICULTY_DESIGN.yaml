  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: revoked_carrier_blocks_new_filing_but_not_movements_already_in_transit
        grounds:
          - validations[priority=10].ERR_CARRIER_NOT_ACTIVE
          - state_machines.BondedCarrier.ACTIVE_to_REVOKED
          - state_machines.InBondMovement.transit_status.FILED_to_IN_TRANSIT
        distinguishing_aspect: |
          Entity pair (BondedCarrier -> InBondMovement): the identical filing
          payload succeeds while custodial_status == ACTIVE and fails with
          ERR_CARRIER_NOT_ACTIVE (409) once the carrier is REVOKED, while the
          already-departed M1 stays IN_TRANSIT and its 41.75 obligation stays on
          the bond — revocation only cancels FILED movements.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; ports 4601 (NE) and 3901 (MW); carrier ACTIVE; CONTINUOUS bond 50000.00."
            - "M1 is filed with the reference payload and then departed, so it is IN_TRANSIT with obligation 41.75."
            - "CBP then revokes the carrier's custodial privilege."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "PATCH /in-bond/carriers/${c1}"
              payload: { custodial_status: "REVOKED", reason_code: "PRIVILEGE_REVOKED" }
              as: CBPOfficer
              as_user_id: "OFF-1"
          trigger:
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0021", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_CARRIER_NOT_ACTIVE"
            - "BondedCarrier.${c1}.custodial_status == REVOKED"
            - "BondedCarrier.${c1}.suspension_reason == PRIVILEGE_REVOKED"
            - "InBondMovement.${m1}.transit_status == IN_TRANSIT"
            - "InBondMovement.${m1}.cancellation_reason == null"
            - "CustomsBond.${b1}.obligated_amount == 41.75"
            - "CustomsBond.${b1}.available_amount == 49958.25"
            - "CustomsBond.${b1}.open_movement_count == 1"
            - "GET /in-bond/movements?carrier_id=${c1} returns total_count == 1"

      - name: cancelling_a_claim_supersedes_its_petition_and_blocks_the_supplement
        grounds:
          - state_machines.MitigationPetition.SUPPLEMENT_REQUESTED_to_SUPERSEDED
          - state_machines.LiquidatedDamagesClaim.PETITIONED_to_CANCELLED
          - validations[priority=9].ERR_PETITION_INVALID_STATE
        distinguishing_aspect: |
          A different entity pair (LiquidatedDamagesClaim -> MitigationPetition):
          the supplement endpoint is legal while the petition is
          SUPPLEMENT_REQUESTED, and becomes ERR_PETITION_INVALID_STATE (409) purely
          because the *claim* was cancelled and drove the petition to SUPERSEDED —
          no field of the petition itself was touched by the carrier.
        test_recipe:
          setup:
            - "Clock advanced to 2026-09-11T12:00:00Z; M1 arrived 7 days late; OFF-1 issued a LATE_ARRIVAL claim assessed 1234.60."
            - "The carrier petitioned (round 1, offer_amount 717.30) and FPF-9 answered REQUEST_SUPPLEMENT, so the petition is SUPPLEMENT_REQUESTED and the claim is PETITIONED."
            - "FPF-9 then cancels the claim (segregation of duties holds: the issuer was OFF-1)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T12:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/reports"
              payload: { movement_id: "${m1}", port_id: "${p_chi}", report_type: "ARRIVAL", packages_reported: 3 }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/ld-claims"
              payload: { movement_id: "${m1}", claim_type: "LATE_ARRIVAL", reason_code: "OVERDUE_ARRIVAL" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { cl1: $.data.id, cl1_v: $.data.version }
            - call: "POST /in-bond/petitions"
              payload: { claim_id: "${cl1}", mitigation_factors: ["FIRST_VIOLATION", "CARGO_SECURED_INTACT", "CBP_ADMIN_DELAY", "EXTRAORDINARY_CIRCUMSTANCE"], narrative_reference: "PET-0031", expected_claim_version: "${cl1_v}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { pet3: $.data.id }
            - call: "POST /in-bond/petitions/${pet3}/decision"
              payload: { decision: "REQUEST_SUPPLEMENT", decision_reason_code: "NEED_SEAL_EVIDENCE" }
              as: FPFOfficer
              as_user_id: "FPF-9"
            - call: "POST /in-bond/ld-claims/${cl1}/disposition"
              payload: { action: "CANCEL", reason_code: "CLAIM_ISSUED_IN_ERROR" }
              as: FPFOfficer
              as_user_id: "FPF-9"
          trigger:
            - call: "POST /in-bond/petitions/${pet3}/supplement"
              payload: { mitigation_factors: ["FIRST_VIOLATION", "CARGO_SECURED_INTACT"], narrative_reference: "PET-0031-S1" }
              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_PETITION_INVALID_STATE"
            - "LiquidatedDamagesClaim.${cl1}.status == CANCELLED"
            - "LiquidatedDamagesClaim.${cl1}.cancellation_reason == CLAIM_ISSUED_IN_ERROR"
            - "MitigationPetition.${pet3}.status == SUPERSEDED"
            - "MitigationPetition.${pet3}.decision_reason_code == CLAIM_CANCELLED"
            - "MitigationPetition.${pet3}.round == 1"
            - "MitigationPetition.${pet3}.offer_amount == 717.30 (unchanged by the refused supplement)"
            - "MitigationPetition.${pet3}.narrative_reference == PET-0031"

  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: exam_bay_windows_are_half_open_so_touching_windows_share_no_slot
        grounds:
          - calculations.exam_window_occupancy
          - entities.Port.fields.exam_capacity_slots
          - validations[priority=13].ERR_EXAM_CAPACITY_EXCEEDED
        distinguishing_aspect: |
          Resource = Port examination bays, interval semantics = HALF-OPEN
          [start, end) at a port with exam_capacity_slots 1: the candidate
          [11:00, 13:00) overlaps the OPEN [08:00, 12:00) window and is refused,
          while [12:00, 16:00) — which touches it exactly at 12:00 — is accepted.
        test_recipe:
          setup:
            - "Clock 2026-08-03T00:00:00Z; ports 4601 (NE, 1 bay) and 2704 (PSW, exam_capacity_slots 1, no GO warehouse)."
