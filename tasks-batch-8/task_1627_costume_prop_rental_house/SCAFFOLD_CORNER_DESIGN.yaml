            - { call: "POST /rental-house/renters/${r_id}/insurance-certificates", payload: { insurer_name: "InsCo", policy_number: "PE-1", coverage_cents: 100000, effective_date: "2025-01-01", expiry_date: "2026-07-01" }, as: HouseAdmin, captures: { cert: $.data.id } }
          trigger:
            - { call: "POST /rental-house/insurance-certificates/${cert}/decide", payload: { decision: VERIFIED }, as: HouseAdmin, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CERTIFICATE_EXPIRED (422)"

