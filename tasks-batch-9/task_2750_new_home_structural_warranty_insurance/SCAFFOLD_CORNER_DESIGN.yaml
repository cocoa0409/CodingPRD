      - name: a_class_d_builder_cannot_be_approved_and_must_be_declined_instead
        claim_type: "Violation to Error"
        grounds:
          - validations.priority_52
          - errors[ERR_RISK_CLASS_INELIGIBLE]
          - state_machines.Builder.UNDER_REVIEW_to_DECLINED
        distinguishing_aspect: "A spotless-volume builder with a claims_history_score of 0 scores 92.00 and lands in class D, so APPROVE is refused with ERR_RISK_CLASS_INELIGIBLE 409 while the builder stays UNDER_REVIEW and no review row is written; the same endpoint with DECLINE succeeds, which shows the gate is on the decision value and not on the endpoint."
        test_recipe:
          setup:
            - "a builder with years_in_business 5, homes_closed_last_year 25, claims_history_score 0 and TIER_3, submitted and taken into review"
          setup_api_calls:
            - call: "POST /warranty/builders"
              payload: { company_name: "Hazard Homes", state_code: "TX", years_in_business: 5, homes_closed_last_year: 25, claims_history_score: 0, financial_strength_tier: "TIER_3" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { b1: $.data.id }
            - call: "POST /warranty/builders/${b1}/submission"
              payload: { attestation_signed: true }
              as: BuilderPrincipal
              as_user_id: "${b1}"
            - call: "POST /warranty/builders/${b1}/review-intake"
              payload: {}
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { score: $.data.risk_score, klass: $.data.risk_class, bstat: $.data.underwriting_status }
          trigger:
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "APPROVE", reviewer_notes: "attempted approval of a class D builder" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { e1: $.data.error_id }
            - call: "GET /warranty/builders/${b1}/underwriting-reviews"
              payload: { limit: 10, offset: 0 }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { rows: $.total_count }
            - call: "POST /warranty/builders/${b1}/underwriting-reviews"
              payload: { decision: "DECLINE", reviewer_notes: "class D is outside appetite" }
              as: UnderwritingOfficer
              as_user_id: "uw-officer-001"
              captures: { bstat2: $.data.resulting_underwriting_status, dec: $.data.decision }
          assert:
            - "${score} == 92.00 with ${klass} == \"D\" - 50 + 50 + 2 - 10 - 0; ${bstat} == \"UNDER_REVIEW\""
