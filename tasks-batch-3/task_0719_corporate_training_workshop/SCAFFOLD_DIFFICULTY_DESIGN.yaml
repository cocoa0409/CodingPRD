              as: ProgramDesigner
              captures: { pv_id: $.data.id }
            - call: "POST /training/program-versions/${pv_id}/submit"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/program-versions/${pv_id}/approve"
              payload: {}
              as: ProgramDesigner
            - call: "POST /training/facilitators"
              payload: { full_name: "Co Fac", email: "cofac@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { cofac_id: $.data.id }
            - call: "POST /training/facilitators"
              payload: { full_name: "Lead Fac", email: "leadfac@x.com", certified_categories: ["TECHNICAL"] }
              as: SchedulingCoordinator
              captures: { lead_id: $.data.id }
            - call: "POST /training/cohorts"
              payload: { program_version_id: "${pv_id}", lead_facilitator_id: "${lead_id}", seat_capacity: 5, delivery_mode: "ONSITE", starts_at: "2026-06-08T08:00:00Z", ends_at: "2026-06-08T18:00:00Z", enroll_deadline: "2026-06-07T00:00:00Z" }
              as: SchedulingCoordinator
              captures: { coh_id: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/sessions"
              payload: { title: "S1", starts_at: "2026-06-08T09:00:00Z", ends_at: "2026-06-08T10:00:00Z", room_or_url: "ROOM-1" }
              as: SchedulingCoordinator
              captures: { s1: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/sessions"
              payload: { title: "S2", starts_at: "2026-06-08T10:00:00Z", ends_at: "2026-06-08T11:00:00Z", room_or_url: "ROOM-2" }
              as: SchedulingCoordinator
              captures: { s2: $.data.id }
            - call: "POST /training/cohorts/${coh_id}/sessions"
              payload: { title: "S3", starts_at: "2026-06-08T09:30:00Z", ends_at: "2026-06-08T10:30:00Z", room_or_url: "ROOM-3" }
              as: SchedulingCoordinator
              captures: { s3: $.data.id }
            - call: "POST /training/sessions/${s1}/assignments"
              payload: { facilitator_id: "${cofac_id}", role: "ASSIST" }
              as: SchedulingCoordinator
              captures: { a1: $.data.id }
            - call: "POST /training/sessions/${s2}/assignments"
              payload: { facilitator_id: "${cofac_id}", role: "ASSIST" }
              as: SchedulingCoordinator
              captures: { a2: $.data.id }
          trigger:
            - call: "POST /training/sessions/${s3}/assignments"
              payload: { facilitator_id: "${cofac_id}", role: "ASSIST" }
              as: SchedulingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "Assignment a2 to S2 (10:00-11:00) succeeded — touching S1's 10:00 end under half-open semantics is allowed"
            - "Response status for S3 assignment == 409"
            - "data.error_id == ERR_FACILITATOR_DOUBLE_BOOKED (S3 09:30-10:30 genuinely overlaps S1 09:00-10:00)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_contract_reservation_committed_unchanged
        grounds:
          - state_machines.Cohort.LOCKED_to_CANCELLED
          - state_machines.Cohort.OPEN_to_LOCKED
          - calculations.contract_drawdown
          - entities.EnterpriseContract.fields.committed_cents
          - entities.EnterpriseContract.fields.remaining_cents
        distinguishing_aspect: |
          Conserved quantity = contract budget ledger (committed_cents): lock RESERVES a PROVISIONAL hold then cancel
          releases it; committed_cents MUST equal 0 both before lock and after cancel, and remaining_cents MUST return
          to the full budget — the forward (lock) and compensating (cancel) actions leave the committed ledger unchanged.
        test_recipe:
          setup:
            - "Contract budget_cents=300000; PER_SEAT ONSITE cohort with 2 CONFIRMED locked (PROVISIONAL reserve), then cancelled from LOCKED"
          setup_api_calls:
            - call: "POST /training/contracts"
              payload: { client_name: "Inv1", budget_cents: 300000 }
              as: FinanceManager
              captures: { ctr_id: $.data.id }
            - call: "POST /training/programs"
              payload: { title: "Inv Prog", category: "TECHNICAL", delivery_mode: "ONSITE" }
              as: ProgramDesigner
              captures: { prog_id: $.data.id }
            - call: "POST /training/program-versions"
              payload: { program_id: "${prog_id}", version_label: "v1", duration_hours: 8, pricing_model: "PER_SEAT", per_seat_cents: 50000, materials_kit_cents: 2500, min_seats: 1 }
              as: ProgramDesigner
              captures: { pv_id: $.data.id }
