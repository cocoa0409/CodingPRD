            - "response status code == 409"
            - "response body data.error_id == \"ERR_RECOVERY_ALREADY_INVOICED\""
            - "GET /carriage/invoices with agreement_id=${ac_id} and invoice_kind=\"AUDIT_RECOVERY\" and limit=10 returns total_count == 1"
            - "GET /carriage/audit-engagements/${eng_id} returns the same recovery_invoice_id == \"${rec_id}\" after the refusal"
            - "the same call issued as AuditManager with as_user_id u-audit-1 returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\" — role denial at priority 2 outranks the priority-83 duplicate check"

  # ============================================================================
  # SECTION 7 — rbac
  # Six roles, all opaque except DistributorLiaison, which is entity_backed on
  # Distributor. No role is a superuser: NetworkAdmin cannot write agreements,
  # reports, audits, rights or invoices.
  # ============================================================================
  - section: rbac
    instances:

      - name: other_roles_cannot_negotiate_or_advance_an_agreement
        claim_type: exclusive_operations
        grounds:
          - rbac.AffiliateSalesExec
          - endpoints[POST /carriage/agreements]
          - endpoints[POST /carriage/agreements/{agreementId}/lifecycle]
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: >-
          All five non-sales roles are refused 403 ERR_FORBIDDEN_ROLE on both
          POST /carriage/agreements and the agreement lifecycle — including
          NetworkAdmin, which created the distributor the agreement would hang off.
        test_recipe:
          setup:
            - "One ACTIVE distributor created by NetworkAdmin, plus one DRAFT agreement created by AffiliateSalesExec so the lifecycle endpoint has a real target."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-RBAC-1"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                am_id: "id"
          trigger:
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-RBAC-2"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: NetworkAdmin
              as_user_id: "u-admin-1"
            - call: "POST /carriage/agreements/${am_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
          assert:
            - "the NetworkAdmin creation returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "the RevenueAccountant lifecycle call returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "the same two calls as AuditManager (u-audit-1), RightsAdministrator (u-rights-1) and DistributorLiaison (${dm_id}) each return 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "GET /carriage/agreements with distributor_id=${dm_id} and limit=10 returns total_count == 1 — only the AffiliateSalesExec agreement exists"
            - "GET /carriage/agreements/${am_id} returns lifecycle_status == \"DRAFT\" and version == 1, untouched by any refusal"
            - "PATCH /carriage/agreements/${am_id} and POST /carriage/agreements/${am_id}/renewal and POST /carriage/renewal-analyses are likewise 403 for all five non-sales roles"

      - name: other_roles_cannot_adjudicate_reports_or_move_money
        claim_type: exclusive_operations
        grounds:
          - rbac.RevenueAccountant
          - endpoints[POST /carriage/invoices]
          - endpoints[POST /carriage/invoices/{invoiceId}/lifecycle]
          - endpoints[POST /carriage/subscriber-reports/{reportId}/review]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: >-
          Report adjudication and invoice creation belong to RevenueAccountant alone:
          the AffiliateSalesExec who negotiated the deal and the AuditManager who can
          open engagements are both 403 on POST /carriage/subscriber-reports/{id}/review,
          so no one can both sell carriage and bless the revenue it produces.
        test_recipe:
          setup:
            - "Cliffside Telco with an executed agreement and one SUBMITTED 2026-06 report at 130,000 subscribers filed by the liaison."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dc_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dc_id}"
                contract_code: "CT-RBAC"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ac_id: "id"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${ac_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ac_version: "version"
            - call: "POST /carriage/subscriber-reports"
              payload:
                agreement_id: "${ac_id}"
                period_month: "2026-06"
                reported_subscribers: 130000
                reported_tier: "BASIC"
                expected_agreement_version: "${ac_version}"
              as: DistributorLiaison
              as_user_id: "${dc_id}"
              captures:
                r_id: "id"
            - call: "GET /carriage/distributors/${dc_id}"
              as: RevenueAccountant
              as_user_id: "u-rev-1"
              captures:
                dc_version: "version"
          trigger:
            - call: "POST /carriage/subscriber-reports/${r_id}/review"
              payload:
                action: "ACCEPT"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/invoices"
              payload:
                distributor_id: "${dc_id}"
                agreement_id: "${ac_id}"
                period_month: "2026-06"
                invoice_kind: "LICENSE_FEE"
                expected_distributor_version: "${dc_version}"
              as: AuditManager
              as_user_id: "u-audit-1"
          assert:
            - "the AffiliateSalesExec review returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "the AuditManager invoice creation returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "GET /carriage/subscriber-reports/${r_id} still returns status == \"SUBMITTED\" and license_fee_due_cents == null"
            - "GET /carriage/invoices with agreement_id=${ac_id} and limit=10 returns total_count == 0"
            - "the same review call as RevenueAccountant with u-rev-1 returns 200 with data.status == \"ACCEPTED\" and data.license_fee_due_cents == 5200000"
            - "POST /carriage/invoices/{invoiceId}/lifecycle is 403 for AffiliateSalesExec, AuditManager, RightsAdministrator, NetworkAdmin and DistributorLiaison alike"

      - name: rights_administrator_cannot_read_money_and_others_cannot_write_rights
        claim_type: exclusive_operations
        grounds:
          - rbac.RightsAdministrator
          - endpoints[POST /carriage/content-titles]
          - endpoints[POST /carriage/rights-windows/{windowId}/lifecycle]
          - endpoints[GET /carriage/invoices]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: >-
          RightsAdministrator is the only role that may register titles, clear windows
          or schedule blackouts, and it is the only role whose READ surface is narrowed:
          GET /carriage/invoices and GET /carriage/subscriber-reports are 403 for it
          while every other role may read them.
        test_recipe:
          setup:
            - "One executed agreement plus a cleared title, so both a rights object and a revenue object exist to be read."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Harbor Satellite"
                distributor_type: "DBS"
                rate_card_class: "CLASS_B"
                total_subscribers: 800000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dh_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dh_id}"
                contract_code: "HS-RBAC"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                ah_id: "id"
            - call: "POST /carriage/content-titles"
              payload:
                title: "Night Circuit"
                home_territory_code: "US"
                linear_premiere_at: "2026-08-15T00:00:00Z"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
              captures:
                ct_id: "id"
          trigger:
            - call: "POST /carriage/content-titles"
              payload:
                title: "Rogue Signal"
                home_territory_code: "US"
                linear_premiere_at: "2026-08-15T00:00:00Z"
              as: NetworkAdmin
              as_user_id: "u-admin-1"
            - call: "GET /carriage/invoices"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
            - call: "GET /carriage/subscriber-reports"
              as: RightsAdministrator
              as_user_id: "u-rights-1"
          assert:
            - "the NetworkAdmin title creation returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "GET /carriage/content-titles as RightsAdministrator with limit=10 returns total_count == 1"
            - "the RightsAdministrator GET /carriage/invoices returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "the RightsAdministrator GET /carriage/subscriber-reports returns 403 with data.error_id == \"ERR_FORBIDDEN_ROLE\""
            - "GET /carriage/agreements as RightsAdministrator with limit=10 returns 200 and total_count == 1 — agreements ARE inside its read surface"
            - "POST /carriage/content-titles/${ct_id}/rights-status, POST /carriage/rights-windows, POST /carriage/blackout-rules and both of their lifecycle endpoints are 403 for all five non-rights roles"

      - name: network_admin_cannot_act_outside_its_own_exclusive_powers
        claim_type: hierarchical_override
        grounds:
          - rbac.NetworkAdmin
          - endpoints[POST /_clock/set_current_utc]
          - endpoints[POST /carriage/rate-card-entries]
          - endpoints[PATCH /carriage/distributors/{distributorId}]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: >-
          There is NO hierarchical override in this domain: NetworkAdmin exclusively
          owns the clock, the rate card and distributor edits, yet it cannot execute an
          agreement, accept a report, open an engagement, clear a window or issue an
          invoice — five 403s that a conventional admin-as-root model would allow.
        test_recipe:
          setup:
            - "One ACTIVE distributor and one DRAFT agreement, so every override attempt has a live target."
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Meridian Broadband"
                distributor_type: "CABLE_MSO"
                rate_card_class: "CLASS_A"
                total_subscribers: 1500000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                dm_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${dm_id}"
                contract_code: "MB-NOROOT"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
              as: AffiliateSalesExec
