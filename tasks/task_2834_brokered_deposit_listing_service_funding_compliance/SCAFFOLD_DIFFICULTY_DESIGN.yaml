          - state_machines.BrokerAgreement.RFI_ISSUED_to_UNDER_DILIGENCE
          - state_machines.BrokerAgreement.UNDER_DILIGENCE_to_CONDITIONAL
          - state_machines.BrokerAgreement.UNDER_DILIGENCE_to_APPROVED
          - state_machines.BrokerAgreement.SUSPENDED_to_UNDER_DILIGENCE
          - calculations.broker_diligence_score
