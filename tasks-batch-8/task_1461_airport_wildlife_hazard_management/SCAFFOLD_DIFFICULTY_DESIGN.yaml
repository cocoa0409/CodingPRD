            - call: "POST /wildlife/strike-reports"
              payload: { airport_id: "${ap_id}", reporter_biologist_id: "${b2_id}", strike_at: "2026-07-02T00:00:00Z", runway_designator: "09L", aircraft_registration: "N902", species_id: "${sp_id}", damage_class: "NONE", phase_of_flight: "LANDING", altitude_ft_agl: 50, strike_count_animals: 1, carcass_present: false }
              as: WildlifeBiologist
