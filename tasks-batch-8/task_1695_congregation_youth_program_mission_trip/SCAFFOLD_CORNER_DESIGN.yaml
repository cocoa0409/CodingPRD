      - name: lodging_cancel_recomputes_rollup_and_provisional_shares
        claim_type: side_effect_execution
        grounds:
          - state_machines.LodgingReservation.CONFIRMED_to_CANCELLED
          - calculations.lodging_cost_rollup
          - calculations.provisional_cost_share
        distinguishing_aspect: "Derived-field reconciliation: cancelling the only lodging reservation drops the trip rollup from 60000 to 0 and every non-terminal registration's provisional share falls back from 80000+2000=82000 to 80000 — the write propagates across aggregates synchronously."
        test_recipe:
          setup: ["Trip Beta base 80000 capacity 30 REGISTRATION_OPEN; one reservation cost 60000; reg1 DRAFT (provisional 82000)"]
          setup_api_calls:
