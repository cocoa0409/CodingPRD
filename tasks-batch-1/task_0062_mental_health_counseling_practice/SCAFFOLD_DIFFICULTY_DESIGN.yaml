            - "Claim.${cl_id}.deductible_applied_cents == 2000"
            - "Claim.${cl_id}.patient_responsibility_cents == 4200"
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 20000"
            - "Appointment.${a_id}.patient_charge_cents == 4200"

      - name: crisis_high_risk_cascade_patient_hold
        grounds:
          - state_machines.CrisisAssessment.OPEN_to_OPEN
          - entities.CrisisAssessment.fields.risk_band
          - entities.Patient.fields.status
        distinguishing_aspect: >-
          Depth-2 chain originating from CrisisAssessment creation (distinct trigger from the
          claim-adjudicate cascade): creating the assessment (A) stamps risk_band HIGH (B), and
          that HIGH band drives Patient.status -> ON_CLINICAL_HOLD (C, caused by B not by the raw create).
        test_recipe:
          setup:
            - "One ACTIVE patient and one therapist."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr H" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt H", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /crisis-assessments"
              payload: { patient_id: "${p_id}", therapist_id: "${t_id}", ideation_score: 3, plan_score: 3, means_access_score: 3, prior_attempts_score: 3 }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { ca_id: $.data.id }
          assert:
            - "CrisisAssessment.${ca_id}.risk_band == HIGH"
            - "Patient.${p_id}.status == ON_CLINICAL_HOLD"

  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: hold_gate_beats_license_gate_on_render
        grounds:
          - validations[priority=10]
          - validations[priority=11]
        distinguishing_aspect: >-
          A render request that violates BOTH business_safety (Patient ON_CLINICAL_HOLD, priority 10)
          and business_referential (therapist has no ACTIVE license for the patient's state, priority 11)
          returns ERR_PATIENT_ON_HOLD — the lower-priority-number safety check wins over the licensure check.
        test_recipe:
          setup:
            - "A SCHEDULED in-person appointment whose patient is ON_CLINICAL_HOLD and whose therapist has NO license in the patient's state."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-07T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr P" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt P", location_state_code: "NY", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-07T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /crisis-assessments"
              payload: { patient_id: "${p_id}", therapist_id: "${t_id}", ideation_score: 3, plan_score: 3, means_access_score: 3, prior_attempts_score: 3 }
              as: Therapist
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PATIENT_ON_HOLD"

      - name: invalid_state_beats_safety_plan_on_resolve
        grounds:
          - validations[priority=8]
          - validations[priority=9]
        distinguishing_aspect: >-
          Resolving an already-RESOLVED HIGH-risk crisis assessment violates BOTH state (priority 8,
          transition undefined from RESOLVED) and business_safety (priority 9, safety-plan gate);
          the state check at priority 8 wins, returning ERR_INVALID_STATE rather than ERR_SAFETY_PLAN_REQUIRED.
        test_recipe:
          setup:
            - "A HIGH-risk crisis assessment that has a SafetyPlan and has already been RESOLVED."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr S" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt S", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /crisis-assessments"
              payload: { patient_id: "${p_id}", therapist_id: "${t_id}", ideation_score: 3, plan_score: 3, means_access_score: 3, prior_attempts_score: 3 }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /safety-plans"
              payload: { crisis_assessment_id: "${ca_id}", warning_signs: "w", coping_strategies: "c", emergency_contacts: ["988"] }
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /crisis-assessments/${ca_id}/resolve"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /crisis-assessments/${ca_id}/resolve"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sliding_fee_band_boundary_150_percent_inclusive
        grounds:
          - calculations.sliding_fee_scale
          - entities.Patient.fields.sliding_fee_multiplier
          - entities.Patient.fields.fpl_percent
        distinguishing_aspect: >-
          Numeric threshold on fpl_percent: income 22590 / household 1 yields exactly 150.00% which is
          inclusive of the <=150 band (multiplier 0.20), whereas 22591 yields 150.01% falling into the
          next band (0.40) — exercised through POST /patients.
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /patients"
              payload: { full_name: "Edge", location_state_code: "CA", annual_household_income: 22590, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
          assert:
            - "Patient.${p_id}.fpl_percent == 150.00"
            - "Patient.${p_id}.sliding_fee_multiplier == 0.20"

      - name: empty_supervision_logs_yield_zero_supervision_hours
        grounds:
          - calculations.supervision_direct_hours
          - entities.Therapist.fields.verified_supervision_hours
        distinguishing_aspect: >-
          Empty-collection edge (distinct metric from the fpl_percent threshold): a freshly created
          therapist with zero ACCEPTED SupervisionLog rows has verified_supervision_hours == 0,
          reachable through GET /therapists/{id}.
        test_recipe:
          setup:
            - "One therapist, no supervision logs."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr Z" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
          trigger:
            - call: "GET /therapists/${t_id}"
              payload: {}
              as: ClinicalDirector
          assert:
            - "Therapist.${t_id}.verified_supervision_hours == 0"
            - "Therapist.${t_id}.verified_direct_hours == 0"

  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: render_blocked_by_expired_license_appointment_vs_statelicense
        grounds:
          - state_machines.Appointment.SCHEDULED_to_RENDERED
          - state_machines.StateLicense.ACTIVE_to_EXPIRED
          - validations[priority=11]
        distinguishing_aspect: >-
          Appointment->StateLicense pair: an Appointment cannot move SCHEDULED->RENDERED when the
          therapist's only StateLicense for the patient's state has lapsed past expires_on (effective
          EXPIRED), yielding ERR_NO_ACTIVE_LICENSE_IN_STATE.
        test_recipe:
          setup:
            - "A SCHEDULED self-pay appointment; therapist's CA license expires before the clock is advanced past it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr Exp" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LE", expires_on: "2026-06-09T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /patients"
              payload: { full_name: "Pt E", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-08T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-10T08:00:00Z" }
              as: ClinicalDirector
          trigger:
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_ACTIVE_LICENSE_IN_STATE"

      - name: complete_blocked_by_supervised_therapist_note_not_cosigned
        grounds:
          - state_machines.Appointment.RENDERED_to_COMPLETED
          - entities.Therapist.fields.requires_supervision
          - state_machines.ClinicalNote.DRAFT_to_SIGNED
          - validations[priority=13]
        distinguishing_aspect: >-
          Appointment->Therapist/ClinicalNote pair (different from the Appointment->StateLicense pair):
          an Appointment rendered by a Therapist whose requires_supervision==true cannot move
          RENDERED->COMPLETED while the ClinicalNote is merely SIGNED, yielding ERR_COSIGN_REQUIRED.
        test_recipe:
          setup:
