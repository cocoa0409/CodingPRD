            - "end_status == HOME_CHECK_PASSED AND end_attempts == 2 (loop re-entered and exited)"
            - "HomeCheck.${hc1}.status == COMPLETED with outcome CONDITIONAL; HomeCheck.${hc2}.outcome == PASSED"

  - rule_id: transitive_cascade
    instances:
