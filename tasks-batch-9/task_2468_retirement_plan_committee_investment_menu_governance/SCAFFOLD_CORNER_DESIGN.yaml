            - "trigger call 1 returned 201 and sc_c5_lc1_score == 96.00: excess_bps == 900 - 400 == 500 undiluted, so performance_component == 100.00, peer_component == 80.00, expense_component == 100.00 (net equals peer median), style_component == 100.00 and manager_component == 100.00, giving 0.40*100.00 + 0.20*80.00 + 0.20*100.00 + 0.10*100.00 + 0.10*100.00 == 96.00, and watch_recommendation == NONE"
            - "trigger call 1 is a strict divergence, not a rounding difference: the SAME row under TRAILING_PERIOD would give excess_bps == 0.6*(0-500) + 0.4*(0-500) == -500, performance_component 0.00 and composite 0.40*0.00 + 0.20*80.00 + 0.20*100.00 + 0.10*100.00 + 0.10*100.00 == 46.00, which is a breach and would have escalated LCGRA to REMEDIATION instead of curing it"
            - "trigger call 3 returned 201 and sc_c5_sm1_score == 32.20: excess_bps == 0 - 2000 == -2000, so performance_component clamps to 0.00, peer_component == 10.00, expense_component == 60.00 (20 bps over median at 2.00 points each), style_component == 100.00 (0.8800 >= the 0.8000 floor) and manager_component == 82.00 (min(100.00, 40.00 + 14*3.0)), giving 0.00 + 2.00 + 12.00 + 10.00 + 8.20 == 32.20, and watch_recommendation == REMEDIATION via ladder rung (c) because the fund is already WATCH and consecutive_breach_quarters + 1 == 2 >= watch_grace_quarters"
            - "trigger call 3 diverges in the opposite direction to call 1: the SAME row under TRAILING_PERIOD would give excess_bps == 0 (both trailing pairs are 500 against 500), performance_component 50.00 and composite 20.00 + 2.00 + 12.00 + 10.00 + 8.20 == 52.20, which is not a breach and is above the 50.00 cure line, so SMLVX would have cured. One variant switch flips both funds' verdicts, in opposite directions, on unchanged data"
            - "trigger call 7 returned 200 and hop 0 reconciled the ledger fields to the rolling numbers: Fund.${fund_lc_a_id}.latest_composite_score == 96.00 (was 33.00) and Fund.${fund_small_id}.latest_composite_score == 32.20 (was 40.00), both with last_scored_quarter_index == 1"
            - "hop 1 followed the rolling verdicts: Fund.${fund_lc_a_id} moved WATCH -> CLEAR with watch_status_before_last_review == WATCH, watch_started_quarter_index reset to null and consecutive_breach_quarters reset to 0; Fund.${fund_small_id} moved WATCH -> REMEDIATION with watch_status_before_last_review == WATCH and consecutive_breach_quarters == 2"
            - "QuarterlyReview.${review_c5_id}.watch_additions_count == 0: neither fund left CLEAR this quarter, so the counter is not a count of breaches but specifically of new entries onto the watch list"
            - "hop 2 moved only the cured fund's slot: AssetClassSlot.${slot_lc_id}.status AT_RISK -> ACTIVE with status_before_last_review == AT_RISK, while AssetClassSlot.${slot_small_id} stays AT_RISK"
            - "trigger call 8 returns exactly one row — ${fund_small_id} — with total_count 1 and has_more false"
            - "trigger call 9 shows hop 3 recomputed to Plan.at_risk_slot_ratio == 0.5000 (1 of the 2 counted slots) and menu_posture FROZEN, the inclusive freeze boundary; Fund.${fund_small_id}.menu_status is still ACTIVE because only the REMEDIATION -> TERMINATION_PENDING transition mutates the menu dimension"
            - "SPEC NOTE — the TERMINATE rung is unreachable from WATCH. calculations.watch_recommendation rung (a) fires whenever breach AND composite_score <= 25.00 AND consecutive_breach_quarters + 1 >= 2, which a WATCH fund in its second breach quarter satisfies, but §1.3's Fund watch dimension declares TERMINATION_PENDING only from REMEDIATION, and the WATCH -> REMEDIATION transition's own precondition requires watch_recommendation IN {WATCH, REMEDIATION}. A WATCH fund scoring 22.20 therefore has a recommendation with no declared transition. This instance deliberately lands SMLVX at 32.20 so the cascade stays inside the declared graph; reaching TERMINATION_PENDING legally needs three consecutive breach quarters with the third at or below 25.00."

      - name: one_quarter_roll_expires_a_term_a_training_module_and_a_meeting_and_the_second_roll_voids_the_stale_review
        claim_type: ops_run_checkpoint
        grounds:
          - endpoints.POST_governance_plans_advance_quarter
          - state_machines.CommitteeMember.ACTIVE_to_TERM_EXPIRED
          - state_machines.FiduciaryTrainingRecord.COMPLETED_to_EXPIRED
          - state_machines.CommitteeMeeting.SCHEDULED_to_VOID
          - state_machines.FeeLevelizationRun.DRAFT_to_VOID
          - calculations.fiduciary_training_status
        distinguishing_aspect: "advance-quarter is the only endpoint in the scaffold that mutates six unrelated entity families in one call, and its arms have DIFFERENT time horizons: term expiry and training expiry and meeting voiding fire on the FIRST roll, while review voiding and draft-run voiding need the object to be strictly more than one quarter stale and therefore fire only on the SECOND. This instance stages one victim per arm and calls the checkpoint twice, so the two horizons are separated by observation rather than by assumption, and it pins the two arms that deliberately do NOT fire on the first roll."
        test_recipe:
          setup:
            - "chain_l3 (three ACTIVE members, adopted charter, adopted IPS-2026-A, five seated slots, posture OPEN)."
            - "Two more voting members are appointed to bring the committee to the max_voting_seats ceiling of 5: Dana Whitfield on a PARTICIPANT_REP seat whose FIDUCIARY_DUTIES record is assigned with validity_quarters 1, and Elena Marchetti on an INDEPENDENT seat whose term ends 2026-09-30."
            - "One CommitteeMeeting is scheduled for quarter 0 and never convened; a quarter-0 review is opened pointing at it and one scorecard is submitted so the review sits in SCORING; a DRAFT quarter-0 fee levelization run exists with a zero credit pool."
            - "The clock is then moved to 2026-10-15, which is past Elena's term_end_date but leaves everyone else's 2027-12-31 term intact."
          setup_api_calls:
            - *chain_l3
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plan_id}", seat_code: "S-PAR", seat_class: "PARTICIPANT_REP", voting: true, seat_index: 4 }
