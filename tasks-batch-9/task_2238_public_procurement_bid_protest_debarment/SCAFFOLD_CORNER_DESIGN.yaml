  - section: validations
    instances:
      - name: corner_protest_filed_at_exactly_the_timeliness_deadline_is_accepted
        claim_type: Satisfaction → Pass
        grounds:
          - validations[priority=31]
          - calculations.protest_timeliness_deadline_utc
          - entities.Protest.fields.timeliness_deadline_utc
        distinguishing_aspect: "The timeliness comparison is <= : filing at exactly 2026-08-26T00:00:00Z (effective_bid_due_utc 2026-08-27T00:00:00Z minus PRE_BID_MARGIN_DAYS 1) is accepted with HTTP 201, and one millisecond later would be ERR_PROTEST_UNTIMELY."
        test_recipe:
          setup:
            - "clock pinned to 2026-08-01T00:00:00Z; one Vendor with a 100000-cent fee balance; one ISSUED Solicitation with estimated_value_cents 10000000 and effective_bid_due_utc 2026-08-27T00:00:00Z; the vendor submitted a question on 2026-08-01 so it has PROSPECTIVE_BIDDER standing; the clock is then set to exactly 2026-08-26T00:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "U-ADMIN-1"
            - call: "POST /procurement/vendors"
              payload: { legal_name: "Ashford Culvert Works", tax_id: "100000055", contact_email: "v55@example.gov" }
