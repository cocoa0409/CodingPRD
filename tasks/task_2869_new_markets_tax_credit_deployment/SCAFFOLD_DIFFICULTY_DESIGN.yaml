            - "AT THE EMPTY BOUNDARY — compliance_pct == 0.00 and local_hire_pct == 0.00 (an empty numerator over an empty denominator is defined as zero, not an error and not 100.00)"
            - "The response classification == SHORTFALL and resulting_status == BREACHED"
            - "The certification does NOT return HTTP 422 and does NOT return \"ERR_INVALID_REQUEST\""
            - "CommunityBenefitsAgreement.${cba_id}.status == BREACHED and measured_compliance_pct == 0.00"
