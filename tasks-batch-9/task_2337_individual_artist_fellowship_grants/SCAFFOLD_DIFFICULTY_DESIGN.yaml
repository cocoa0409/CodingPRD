      - name: waived_conflict_restores_review_count_score_and_readiness
        grounds:
          - state_machines.ConflictDeclaration.BLOCKING_to_WAIVED
          - state_machines.Review.INVALIDATED_to_SUBMITTED
          - state_machines.Panelist.RECUSED_to_SEATED
          - calculations.panel_readiness_score
          - calculations.application_composite_score
        distinguishing_aspect: |
          Screening a discretionary conflict as BLOCKING invalidates one submitted review,
          recuses its author, penalises panel readiness and pushes the cycle posture to
          RESTRICTED. The waive-override must undo all four in one call and land on the exact
          original numbers — provisional score back to 7.28 (not the 7.10 four-review mean),
          readiness back to 100.00 (not 92.00) — while the panel stays DELIBERATING throughout.
        test_recipe:
          setup:
            - "CycleMain panel DELIBERATING with five SUBMITTED reviews; app1 provisional 7.28, final 7.30, spread 2.50"
            - "pl1's conflict on app1 is SAME_INSTITUTION, which derives severity DISCRETIONARY and is therefore waivable"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - *k_panel
            - *k_pl1
            - *k_pl2
            - *k_pl3
            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
            - *k_round1
            - *k_rev1
            - *k_srev1
            - *k_rev2
            - *k_srev2
            - *k_rev3
            - *k_srev3
            - *k_rev4
            - *k_srev4
            - *k_rev5
            - *k_srev5
            - *k_close_round
          trigger:
            - *c_declare1
            - *c_screen1
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panels/${pan}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "POST /grants/conflicts/${cf1}/waive-override", payload: { override_justification: "Shared institutional affiliation only; no supervisory or financial relationship, documented by the programme officer." }, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/applications/${app1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panels/${pan}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/cycles/${cyc}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/panelists/${pl1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
            - { call: "GET /grants/reviews/${rv1}", payload: {}, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The conflict derives severity DISCRETIONARY from relationship_type SAME_INSTITUTION, so BLOCKING is waivable"
            - "After BLOCKING: rv1 INVALIDATED with invalidation_reason BLOCKING_CONFLICT, app1.valid_review_count 4, provisional_composite_score 7.10, pl1 RECUSED with recused_application_ids containing app1"
            - "After BLOCKING: panel.blocking_conflict_count 1, readiness_score 92.00, seated_count still 5, cycle.blocking_conflict_count 1 and posture RESTRICTED"
            - "After the waive-override: rv1 back to SUBMITTED with invalidation_reason null, app1.valid_review_count 5 and provisional_composite_score 7.28 exactly"
            - "After the waive-override: pl1 SEATED with recused_application_ids empty, panel.blocking_conflict_count 0, readiness_score 100.00, cycle.blocking_conflict_count 0 and posture OPEN"
            - "app1.final_composite_score stays 7.30 and score_spread stays 2.50 — invalidating and restoring a review does not re-run the FINAL variant, which only recomputes on close-round"
            - "The panel is DELIBERATING before and after, and reopen_required stays false because no RecommendationSlot existed to void"
            - "conflict.override_justification is persisted on the WAIVED row"

      - name: reversed_payment_conserves_award_gross_through_a_replacement_row
        grounds:
          - state_machines.PaymentInstallment.PAID_to_REVERSED
          - state_machines.Award.payment_status.PARTIALLY_PAID_to_UNPAID
          - calculations.installment_payment_schedule
        distinguishing_aspect: |
          Reversing a paid installment must not shrink the award: the reversed row leaves the
          live ledger and a replacement row carrying the identical installment_number, gross,
          withholding rate, withholding and net re-enters it, so the conservation identity
          gross_amount_cents == sum(gross_cents over {SCHEDULED, HELD, RELEASED, PAID}) still
          holds at 1500000. The replacement's scheduled_date is the logical clock date, not the
          original offset date, which distinguishes a true reversal from an undo of the payment.
        test_recipe:
          setup:
            - "CycleMain award ACTIVE with installment 1 PAID at clock 2027-01-01"
            - "Installment grosses are 600000 / 525000 / 375000 with withholding 162420 / 142118 / 101513 at rate 0.2707 (artist tin_status MISSING)"
          setup_api_calls:
            - *k_clock_sep
            - *k_cycle
            - *k_disc
            - *k_open
            - *k_art1
            - *k_app1
            - *k_ws1a
            - *k_ws1b
            - *k_sub1
            - *k_clock_oct16
            - *k_close_cycle
            - *k_elig1
            - *k_panel_review
            - *k_panel
            - *k_pl1
            - *k_pl2
            - *k_pl3
            - *k_pl4
            - *k_pl5
            - *k_seat1
            - *k_seat2
            - *k_seat3
            - *k_seat4
            - *k_seat5
            - *k_charter
            - *k_round1
            - *k_rev1
            - *k_srev1
            - *k_rev2
            - *k_srev2
            - *k_rev3
            - *k_srev3
            - *k_rev4
            - *k_srev4
            - *k_rev5
            - *k_srev5
            - *k_close_round
            - *x_board_review
            - *x_get_panel
            - *x_slate
            - *x_get_slots
            - *x_get_cyc
            - *x_approve1
            - *x_get_awards
            - *x_accept
            - *x_get_inst
            - *x_cycle_awarded
            - *x_clock_jan1
            - *x_rel1
            - *x_pay1
          trigger:
            - { call: "GET /grants/awards/${aw1}", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "POST /grants/payment-installments/${inst1}/reverse", payload: { reversal_reason_code: BANK_RETURN }, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/payment-installments", payload: { replaces_installment_id: "${inst1}" }, as: FiscalOfficer, as_user_id: "fiscal-1", captures: { inst1r: "$.data[0].id" } }
            - { call: "GET /grants/payment-installments/${inst1}", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/payment-installments/${inst1r}", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/payment-installments", payload: { award_id: "${aw1}" }, as: FiscalOfficer, as_user_id: "fiscal-1" }
            - { call: "GET /grants/awards/${aw1}", payload: {}, as: FiscalOfficer, as_user_id: "fiscal-1" }
          assert:
            - "Before the reversal: payment_status PARTIALLY_PAID, disbursed_gross_cents 600000, disbursed_net_cents 437580, total_withholding_cents 162420, undisbursed_gross_cents 900000"
            - "inst1 becomes REVERSED with reversal_reason_code BANK_RETURN and keeps paid_at 2027-01-01"
            - "Exactly one replacement row exists with replaces_installment_id == inst1, status SCHEDULED, installment_number 1, gross_cents 600000, withholding_rate 0.2707, withholding_cents 162420 and net_cents 437580"
            - "The replacement's scheduled_date is 2027-01-01 (the logical clock date), which here coincides with the original offset-0 date but is derived from the clock"
            - "The award lists four installment rows; summing gross_cents over the rows in {SCHEDULED, HELD, RELEASED, PAID} gives 600000 + 525000 + 375000 == 1500000 == award.gross_amount_cents"
            - "After the reversal: payment_status UNPAID, disbursed_gross_cents 0, disbursed_net_cents 0, total_withholding_cents 0, undisbursed_gross_cents 1500000"
            - "award.status stays ACTIVE — a reversal does not walk the award back to ACCEPTED"
