        distinguishing_aspect: "Proof sign-off is a shared operation with a person-level bar: either the director or a coordinator may decide, but never the user who requested the proof. Once the decision lands the style leaves PROOFING, so the requester's second attempt fails the state gate at priority 70 rather than the segregation gate at priority 80 - the same actor, the same call, a different error id depending on where the style now sits."
