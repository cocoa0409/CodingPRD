            - "the summary reports report_status \"FILED\""
            - "the summary reports prize_pool_remaining_tp == 32 because base_tp 48 minus the 20 drawn plus the 4 restored is 32"

      - name: prizing_summary_reports_not_filed_gate_for_unreported_events
        claim_type: Conditional action
        grounds:
