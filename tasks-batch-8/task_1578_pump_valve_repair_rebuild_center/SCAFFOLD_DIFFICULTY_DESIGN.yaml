      - name: quote_creation_blocked_when_window_full
        grounds:
          - state_machines.RepairOrder.QUOTE_IN_PROGRESS_to_AUTHORIZED
          - calculations.window_posture
          - errors[ERR_WINDOW_FULL]
        distinguishing_aspect: |
          Entity pair CapacityWindow -> Quote: quote creation is rejected when the
