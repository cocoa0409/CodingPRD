# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Donor-Advised Fund Administration — Expert band (breadth probe)
# Walks references/claim-extraction-guide.md sections against SCAFFOLD.yaml §1.1–§1.7.
# Every grounds[] ref resolves to a declared element; names unique across BOTH design files.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # SECTION: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_sponsor_returns_201_with_defaults_applied
        claim_type: Creation
        grounds:
          - entities.Sponsor.fields.minimum_grant_cents
          - entities.Sponsor.fields.inactivity_quarters
          - endpoints.POST /daf/sponsors
        distinguishing_aspect: "POST /daf/sponsors with only name+ein returns 201; minimum_grant_cents defaults to 5000, inactivity_quarters to 8, admin_fee_bps_default to 50, current_quarter_index to 0."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /daf/sponsors"
              payload: { name: "Default Sponsor", ein: "20-0000001" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Sponsor.${sponsor_id}.minimum_grant_cents == 5000"
            - "Sponsor.${sponsor_id}.inactivity_quarters == 8"
            - "Sponsor.${sponsor_id}.admin_fee_bps_default == 50"
            - "Sponsor.${sponsor_id}.current_quarter_index == 0"
            - "Sponsor.${sponsor_id}.version == 1"

      - name: get_pool_returns_stored_data
        claim_type: Retrieval
        grounds:
          - entities.InvestmentPool.fields.nav_per_unit_cents
          - endpoints.GET /daf/pools/{poolId}
        distinguishing_aspect: "GET /daf/pools/{poolId} returns the InvestmentPool with nav_per_unit_cents and risk_tier exactly as created."
        test_recipe:
          setup:
            - "Sponsor; one OPEN pool nav_per_unit_cents=2500, risk_tier=GROWTH."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Ret Sponsor", ein: "20-0000002" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/pools"
              payload: { sponsor_id: "${sponsor_id}", name: "Ret Pool", risk_tier: "GROWTH", nav_per_unit_cents: 2500, fee_bps: 50 }
              as: SponsorAdmin
              captures: { pool_id: $.data.id }
          trigger:
            - call: "GET /daf/pools/${pool_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-r1"
          assert:
            - "HTTP status == 200"
            - "InvestmentPool.${pool_id}.nav_per_unit_cents == 2500"
            - "InvestmentPool.${pool_id}.risk_tier == GROWTH"
            - "InvestmentPool.${pool_id}.status == OPEN"

      - name: list_charities_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET /daf/charities
          - entities.Charity.fields.sponsor_id
        distinguishing_aspect: "GET /daf/charities?sponsor_id=X returns array envelope with total_count and has_more; reverse-reachability for Charity.sponsor_id."
        test_recipe:
          setup:
            - "Sponsor with two registered charities."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "List Sponsor", ein: "20-0000003" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "C One", ein: "20-9000001", ntee_code: "A20" }
              as: ComplianceOfficer
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "C Two", ein: "20-9000002", ntee_code: "A21" }
              as: ComplianceOfficer
          trigger:
            - call: "GET /daf/charities?sponsor_id=${sponsor_id}"
              payload: {}
              as: SponsorAdmin
          assert:
            - "HTTP status == 200; response_type == array"
            - "data total_count == 2; has_more == false"
            - "Every returned Charity.sponsor_id == ${sponsor_id}"

      - name: get_account_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - endpoints.GET /daf/accounts/{accountId}
        distinguishing_aspect: "GET /daf/accounts/{accountId} with a random non-existent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty DB (no accounts)."
          setup_api_calls: []
          trigger:
            - call: "GET /daf/accounts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SponsorAdmin
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: create_pool_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /daf/pools
          - entities.InvestmentPool.fields.risk_tier
        distinguishing_aspect: "POST /daf/pools omitting required risk_tier returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Sponsor exists."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Req Sponsor", ein: "20-0000004" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
          trigger:
            - call: "POST /daf/pools"
              payload: { sponsor_id: "${sponsor_id}", name: "Bad Pool", nav_per_unit_cents: 2500, fee_bps: 50 }
              as: SponsorAdmin
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_grant_default_recurrence_one_time
        claim_type: Defaults
        grounds:
          - entities.GrantRecommendation.fields.recurrence
          - entities.GrantRecommendation.fields.is_anonymous
          - endpoints.POST /daf/grants
        distinguishing_aspect: "Submitting a grant without recurrence/is_anonymous defaults recurrence to ONE_TIME and is_anonymous to false."
        test_recipe:
          setup:
            - "Sponsor; VETTED Charity; ACTIVE DonorAccount funded 1000000 cash."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Def Sponsor", ein: "20-0000005" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Def Charity", ein: "20-9000005", ntee_code: "A20" }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Def Fund", primary_advisor_user_id: "adv-d1" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 1000000 }
              as: DonorAdvisor
              as_user_id: "adv-d1"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-d1"
              captures: { ver1: $.data.version }
          trigger:
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 100000, expected_account_version: "${ver1}" }
              as: DonorAdvisor
              as_user_id: "adv-d1"
              captures: { grant_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "GrantRecommendation.${grant_id}.recurrence == ONE_TIME"
            - "GrantRecommendation.${grant_id}.is_anonymous == false"
            - "GrantRecommendation.${grant_id}.recommended_by_user_id == adv-d1"

      - name: computed_cash_balance_ignores_client_input
        claim_type: Computed Fields
        grounds:
          - entities.DonorAccount.fields.cash_balance_cents
          - entities.DonorAccount.fields.grantable_balance_cents
          - endpoints.POST /daf/accounts
        distinguishing_aspect: "On account open, cash_balance_cents and grantable_balance_cents are computed (initialized to 0) and any client-supplied value is ignored."
        test_recipe:
          setup:
            - "Sponsor exists."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Comp Sponsor", ein: "20-0000006" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
          trigger:
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Comp Fund", primary_advisor_user_id: "adv-c1" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "DonorAccount.${acct_id}.cash_balance_cents == 0"
            - "DonorAccount.${acct_id}.grantable_balance_cents == 0"
            - "DonorAccount.${acct_id}.status == ACTIVE"
            - "DonorAccount.${acct_id}.last_grant_paid_quarter == null"

      - name: pool_invalid_risk_tier_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.InvestmentPool.fields.risk_tier
          - errors[ERR_INVALID_REQUEST]
          - endpoints.POST /daf/pools
        distinguishing_aspect: "POST /daf/pools with risk_tier='AGGRESSIVE' (not in {CONSERVATIVE,BALANCED,GROWTH}) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Sponsor exists."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Enum Sponsor", ein: "20-0000007" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
          trigger:
            - call: "POST /daf/pools"
              payload: { sponsor_id: "${sponsor_id}", name: "Enum Pool", risk_tier: "AGGRESSIVE", nav_per_unit_cents: 2500, fee_bps: 50 }
              as: SponsorAdmin
          assert:
            - "HTTP status == 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: substantiation_receipt_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.SubstantiationReceipt.fields.deductible_value_cents
          - endpoints.GET /daf/receipts/{receiptId}
        distinguishing_aspect: "SubstantiationReceipt has common_fields:false — it exposes id+created_at only (no version), is read-only, and its deductible_value_cents equals the contribution's frozen FMV."
        test_recipe:
          setup:
            - "Sponsor; ACTIVE account; one SETTLED CASH contribution of 500000 cents (mints a receipt)."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Imm Sponsor", ein: "20-0000008" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Imm Fund", primary_advisor_user_id: "adv-i1" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 500000 }
              as: DonorAdvisor
              as_user_id: "adv-i1"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "GET /daf/receipts?contribution_id=${contrib_id}"
              payload: {}
              as: ContributionAdmin
              captures: { receipt_id: "$.data[0].id" }
          trigger:
            - call: "GET /daf/receipts/${receipt_id}"
              payload: {}
              as: ContributionAdmin
          assert:
            - "HTTP status == 200"
            - "SubstantiationReceipt.${receipt_id}.deductible_value_cents == 500000"
            - "SubstantiationReceipt.${receipt_id} response has no version field"
            - "SubstantiationReceipt.${receipt_id}.contribution_id == ${contrib_id}"

      - name: create_charity_with_unknown_sponsor_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Charity.fields.sponsor_id
          - errors[ERR_NOT_FOUND]
          - endpoints.POST /daf/charities
        distinguishing_aspect: "POST /daf/charities with a non-existent sponsor_id FK returns 404 ERR_NOT_FOUND (FK existence validated)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /daf/charities"
              payload: { sponsor_id: "00000000-0000-4000-8000-000000000999", legal_name: "Orphan", ein: "20-9000099", ntee_code: "A20" }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 404"
            - "error_id == ERR_NOT_FOUND"

      - name: flat_fk_allocation_reverse_reachable_by_account
        claim_type: Foreign key references validated
        grounds:
          - entities.PoolAllocation.fields.donor_account_id
          - endpoints.GET /daf/allocations
        distinguishing_aspect: "Flat topology: GET /daf/allocations?donor_account_id=X reverse-reaches a cascade-created PoolAllocation that never appeared in a creation response."
        test_recipe:
          setup:
            - "Sponsor; OPEN pool nav=2500; ACTIVE account funded 100000 cash; one executed rebalance buy of 50000 cents creating a PoolAllocation lazily."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Flat Sponsor", ein: "20-0000009" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/pools"
              payload: { sponsor_id: "${sponsor_id}", name: "Flat Pool", risk_tier: "BALANCED", nav_per_unit_cents: 2500, fee_bps: 50 }
              as: SponsorAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Flat Fund", primary_advisor_user_id: "adv-f1" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 100000 }
              as: DonorAdvisor
              as_user_id: "adv-f1"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "POST /daf/rebalance-orders"
              payload: { donor_account_id: "${acct_id}", target_pool_id: "${pool_id}", amount_cents: 50000, target_pct_bps: 5000 }
              as: DonorAdvisor
              as_user_id: "adv-f1"
              captures: { order_id: $.data.id }
            - call: "POST /daf/rebalance-orders/${order_id}/execute"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-f1"
          trigger:
            - call: "GET /daf/allocations?donor_account_id=${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-f1"
          assert:
            - "HTTP status == 200; data array length == 1"
            - "data[0].donor_account_id == ${acct_id}; data[0].investment_pool_id == ${pool_id}"
            - "data[0].units_micro == 20000000; data[0].status == ACTIVE"

  # ===========================================================================
  # SECTION: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: contribution_starts_in_pending
        claim_type: Initial State
        grounds:
          - state_machines.Contribution
          - entities.Contribution.fields.status
          - endpoints.POST /daf/contributions
        distinguishing_aspect: "A newly recorded Contribution starts in status PENDING with fair_market_value_cents null."
        test_recipe:
          setup:
            - "Sponsor; ACTIVE account."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Init Sponsor", ein: "21-0000001" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Init Fund", primary_advisor_user_id: "adv-s1" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
          trigger:
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 100000 }
              as: DonorAdvisor
              as_user_id: "adv-s1"
              captures: { contrib_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Contribution.${contrib_id}.status == PENDING"
            - "Contribution.${contrib_id}.fair_market_value_cents == null"

      - name: settle_already_settled_contribution_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.Contribution.PENDING_to_SETTLED
          - errors[ERR_INVALID_STATE]
          - endpoints.POST /daf/contributions/{contributionId}/settle
        distinguishing_aspect: "Re-settling a SETTLED contribution returns 409 ERR_INVALID_STATE (irrevocable; SETTLED is terminal) and does not re-mint a receipt or re-credit cash."
        test_recipe:
          setup:
            - "Sponsor; ACTIVE account; one SETTLED CASH contribution of 300000 cents."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Idem Sponsor", ein: "21-0000002" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Idem Fund", primary_advisor_user_id: "adv-s2" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 300000 }
              as: DonorAdvisor
              as_user_id: "adv-s2"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
          trigger:
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "DonorAccount.${acct_id}.cash_balance_cents == 300000 (not double-credited)"

      - name: vet_revoked_charity_is_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Charity.VETTED_to_REVOKED
          - errors[ERR_INVALID_STATE]
          - endpoints.POST /daf/charities/{charityId}/vet
        distinguishing_aspect: "REVOKED is terminal: any further vet decision (e.g. APPROVE) on a REVOKED charity returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Sponsor; one charity VETTED then REVOKED."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Term Sponsor", ein: "21-0000003" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Term Charity", ein: "21-9000003", ntee_code: "A20" }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "REVOKE", vetting_note: "revoked" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"
            - "Charity.${charity_id}.status == REVOKED (unchanged)"

      - name: revet_into_current_state_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Charity.PENDING_VETTING_to_VETTED
          - errors[ERR_INVALID_STATE]
          - endpoints.POST /daf/charities/{charityId}/vet
        distinguishing_aspect: "Per the Charity machine note, re-APPROVE when already VETTED returns 409 ERR_INVALID_STATE (no self-transition VETTED->VETTED)."
        test_recipe:
          setup:
            - "Sponsor; one VETTED charity."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Inv Sponsor", ein: "21-0000004" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Inv Charity", ein: "21-9000004", ntee_code: "A20" }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
          assert:
            - "HTTP status == 409"
            - "error_id == ERR_INVALID_STATE"

      - name: contribution_reject_side_effects_no_valuation
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Contribution.PENDING_to_REJECTED
          - endpoints.POST /daf/contributions/{contributionId}/reject
          - entities.Contribution.fields.fair_market_value_cents
        distinguishing_aspect: "Rejecting a PENDING contribution sets status REJECTED with no valuation, no ledger entry, no receipt, and no cash credit."
        test_recipe:
          setup:
            - "Sponsor; ACTIVE account; one PENDING CASH contribution of 400000 cents."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Rej Sponsor", ein: "21-0000005" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Rej Fund", primary_advisor_user_id: "adv-s5" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 400000 }
              as: DonorAdvisor
              as_user_id: "adv-s5"
              captures: { contrib_id: $.data.id }
          trigger:
            - call: "POST /daf/contributions/${contrib_id}/reject"
              payload: {}
              as: ContributionAdmin
          assert:
            - "HTTP status == 200"
            - "Contribution.${contrib_id}.status == REJECTED"
            - "Contribution.${contrib_id}.fair_market_value_cents == null"
            - "DonorAccount.${acct_id}.cash_balance_cents == 0"
            - "GET /daf/receipts?contribution_id=${contrib_id} returns empty array"

      - name: pay_grant_from_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.GrantRecommendation.SCHEDULED_to_PAID
          - errors[ERR_INVALID_STATE]
          - endpoints.POST /daf/grants/{grantId}/pay
        distinguishing_aspect: "Calling pay on a SUBMITTED grant (skipping APPROVED/SCHEDULED) returns 409 ERR_INVALID_STATE — pay is only valid from SCHEDULED."
        test_recipe:
          setup:
            - "Sponsor; VETTED Charity; ACTIVE account funded 1000000 cash; one SUBMITTED grant of 100000 cents."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Skip Sponsor", ein: "21-0000006" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Skip Charity", ein: "21-9000006", ntee_code: "A20" }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
