              as: PlatformAdmin
              captures: { setx_id: $.data.id, setx_net: $.data.net_cents }
            - call: "POST /settlements/${setx_id}/pay"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_cycle/open_statement"
              payload: { patient_account_id: "${acctx_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_cycle/close_statement"
