scaffold_difficulty_design:

  # =============================================================================
  # Rule 1: Dual-variant calculations across different entity domains
  # =============================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: driving_hours_unextended_vs_adverse_extended
        grounds:
          - calculations.available_driving_hours
          - state_machines.AdverseConditionsExemption.ACTIVE_to_CONSUMED
          - entities.AdverseConditionsExemption.fields.extra_minutes_granted
          - endpoints.POST_drivers_driver_id_adverse_conditions
          - endpoints.POST_drivers_driver_id_duty_events
        distinguishing_aspect: |
          Lives in the DutyEvent/driving domain: same DutyEvent stream and same
          most_recent_qualifying_break_end produce minutes_remaining = 660 minus
          driving_minutes_since_break under UNEXTENDED, but minutes_remaining =
          780 minus driving_minutes_since_break under ADVERSE_EXTENDED. The
          variant key is the presence of an ACTIVE AdverseConditionsExemption
          attached to the current 14-hour window.
        test_recipe:
          setup:
            - "Carrier C with safety officer; Vehicle V with certified ELD; Driver D bound to V; clock at 2026-05-01T00:00:00Z."
            - "Driver D posts OFF_DUTY at 2026-05-01T00:00:00Z then SLEEPER_BERTH closing a 10h break at 2026-05-01T10:00:00Z."
            - "Driver D posts DRIVING events accumulating exactly 660 minutes of DRIVING between 10:00 and 21:00."
          trigger:
            - "GET /drivers/{D.id}/hos-snapshot at 2026-05-01T21:00:00Z (no exemption declared)."
            - "POST /drivers/{D.id}/adverse-conditions with declared_at=2026-05-01T21:00:00Z, reason 10+ chars."
            - "GET /drivers/{D.id}/hos-snapshot at 2026-05-01T21:00:00Z (exemption ACTIVE)."
          assert:
            - "First snapshot.available_driving_hours.UNEXTENDED.minutes_remaining == 0."
            - "Second snapshot.available_driving_hours.UNEXTENDED.minutes_remaining == 0 (unchanged)."
            - "Second snapshot.available_driving_hours.ADVERSE_EXTENDED.minutes_remaining == 120."
            - "The two variants disagree by exactly 120 for identical DutyEvent input."

      - name: cycle_hours_rolling_vs_post_restart
        grounds:
          - calculations.cycle_hours_remaining
          - entities.Driver.fields.last_34_hour_restart_completed_at
          - entities.Driver.fields.cycle_type
          - state_machines.Driver.duty_status.OFF_DUTY_to_SLEEPER_BERTH
          - endpoints.POST_drivers_driver_id_duty_events
        distinguishing_aspect: |
          Lives in the Driver/cycle domain (not DutyEvent/driving domain of
          instance 1): same DutyEvent history feeds two different rolling-window
          starts. ROLLING_WINDOW uses event_time - 8 days; POST_RESTART uses
          Driver.last_34_hour_restart_completed_at when that instant is more
          recent. The two variants therefore yield different on_duty_minutes_
          in_window for identical DutyEvent input, while the calculation in
          instance 1 acts on the 11-hour DRIVING metric instead.
        test_recipe:
          setup:
            - "Driver D on SEVENTY_HOUR_EIGHT_DAY cycle, with 3600 minutes (60h) of ACTIVE on-duty DutyEvents accumulated over the prior 6 days, none within the last 36h."
            - "Driver D begins OFF_DUTY at 2026-05-07T00:00:00Z and remains in OFF_DUTY+SLEEPER_BERTH for an unbroken 34h until 2026-05-08T10:00:00Z, completing the restart."
          trigger:
            - "GET /drivers/{D.id}/hos-snapshot at 2026-05-08T10:00:00Z."
          assert:
            - "snapshot.cycle_hours_remaining.ROLLING_WINDOW.minutes_remaining == 4200 - 3600 == 600."
            - "snapshot.cycle_hours_remaining.POST_RESTART.minutes_remaining == 4200 (full 70h cap restored)."
            - "Driver.last_34_hour_restart_completed_at == 2026-05-08T10:00:00Z."

  # =============================================================================
  # Rule 2: Combinatorial formulas across different modes
  # =============================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sleeper_berth_pair_qualifies_mode_a
        grounds:
          - calculations.sleeper_berth_pair_qualifies
          - validations[priority=9]
          - state_machines.Driver.duty_status.SLEEPER_BERTH_to_DRIVING
          - endpoints.POST_drivers_driver_id_duty_events
        distinguishing_aspect: |
          Mode (a) — formula with 3+ inputs and non-linear interaction: the
          predicate combines L1 (long-leg length), L2 (short-leg length),
          L1+L2 (combined), and E2<=S1 (ordering) under nested AND, with
          variant selection (7/3 vs 8/2 split) keyed on tiered length bands.
        test_recipe:
          setup:
            - "Driver D bound to Vehicle V, cycle clean. Clock at 2026-05-10T00:00:00Z."
            - "Driver D posts OFF_DUTY at 2026-05-10T00:00:00Z."
            - "Driver D posts SLEEPER_BERTH at 2026-05-10T02:00:00Z (after 120 min OFF_DUTY: leg L2)."
          trigger:
            - "Advance clock to 2026-05-10T10:00:00Z (480 minutes of SLEEPER_BERTH accrue — leg L1)."
            - "POST /drivers/{D.id}/duty-events with new_status=DRIVING at 2026-05-10T10:00:00Z."
          assert:
            - "Response is 201 Created (qualifies via EIGHT_TWO_SPLIT: L1=480, L2=120, sum=600, E2=2026-05-10T02:00:00Z <= S1=2026-05-10T02:00:00Z)."
            - "Resulting DutyEvent.edit_state == ACTIVE."
            - "available_driving_hours.UNEXTENDED.minutes_remaining == 660 (full 11h restored by the qualifying split)."

      - name: daily_log_integrity_hash_canonical_order_mode_b
        grounds:
          - calculations.daily_log_integrity_hash
          - entities.DailyLog.fields.integrity_hash
          - state_machines.DailyLog.UNCERTIFIED_to_CERTIFIED
          - state_machines.DailyLog.CERTIFIED_to_RECERTIFIED
          - endpoints.POST_drivers_driver_id_daily_logs_log_id_certify
        distinguishing_aspect: |
          Mode (b) — nested rounding/serialization where order matters: the
          hash is pinned to (sort by event_time then id, lat/lon rounded to
          6 decimals, timestamps to milliseconds, JSON separators (",",":"),
          ensure_ascii=False). Any reordering, alternate rounding step, or
          alternative serialization produces a different SHA-256, so the
          scaffold pins one canonical order explicitly.
        test_recipe:
          setup:
            - "Driver D on log_date 2026-05-09 posts three ACTIVE DutyEvents at 09:00, 12:00, 15:00 UTC with lat=37.7749295/lon=-122.4194155 (7+ decimal places)."
            - "Clock at 2026-05-10T01:00:00Z so log_date < today."
          trigger:
            - "POST /drivers/{D.id}/daily-logs/{log_id}/certify."
            - "GET /drivers/{D.id}/daily-logs/{log_id}."
          assert:
            - "Returned DailyLog.integrity_hash is the lowercase 64-char SHA-256 hex of the canonical-JSON projection sorted by (event_time, id) with lat/lon rounded to 6 decimal places to 37.774930 and -122.419416."
            - "Re-issuing the same three events in any order would produce the same canonical-JSON and the same hash (idempotent under reorder)."
            - "DailyLog.status == CERTIFIED and certification_count == 1."

      - name: cycle_hours_evaluation_order_mode_c
        grounds:
          - calculations.cycle_hours_remaining
          - entities.Driver.fields.last_34_hour_restart_completed_at
          - state_machines.Driver.duty_status.OFF_DUTY_to_SLEEPER_BERTH
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          effective_window_start depends on a comparison of
          Driver.last_34_hour_restart_completed_at against window_lower_bound,
          where window_lower_bound itself is derived from cycle_type and
          event_time. The formula pins the order: compute window_lower_bound
          from cycle_type first, then compare against the restart timestamp,
          then pick the later of the two as effective_window_start. Reversing
          that order would let a stale restart 9 days old override the cap.
        test_recipe:
          setup:
            - "Driver D on SEVENTY_HOUR_EIGHT_DAY cycle. last_34_hour_restart_completed_at = 2026-04-25T00:00:00Z (older than 8-day window)."
            - "Driver D has 4100 minutes of on-duty events between 2026-04-26 and 2026-05-04."
            - "Clock at 2026-05-04T10:00:00Z."
          trigger:
            - "GET /drivers/{D.id}/hos-snapshot."
          assert:
            - "snapshot.cycle_hours_remaining.minutes_remaining == 4200 - 4100 == 100 (rolling window wins because restart timestamp is BEFORE event_time - 8 days)."
            - "snapshot.cycle_hours_remaining.variant_used == ROLLING_WINDOW."
            - "If the implementation reversed the evaluation order and applied the stale restart, it would return 4200 (FULL cap) — the test catches that drift."

  # =============================================================================
  # Rule 3: Non-linear state-machine shape on different entities
  # =============================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: driver_duty_status_cyclic
        grounds:
          - state_machines.Driver.duty_status.OFF_DUTY_to_DRIVING
          - state_machines.Driver.duty_status.DRIVING_to_OFF_DUTY
          - state_machines.Driver.duty_status.OFF_DUTY_to_SLEEPER_BERTH
          - state_machines.Driver.duty_status.SLEEPER_BERTH_to_DRIVING
          - state_machines.Driver.duty_status.DRIVING_to_SLEEPER_BERTH
        distinguishing_aspect: |
          The Driver.duty_status machine is cyclic on the Driver entity: the
          path OFF_DUTY → DRIVING → OFF_DUTY → SLEEPER_BERTH → DRIVING → ...
          is a real cycle (driver legitimately re-enters DRIVING after each
          rest cycle). At least two distinct return edges to DRIVING from
          different predecessor states (OFF_DUTY, SLEEPER_BERTH, ON_DUTY_NOT_
          DRIVING, PERSONAL_CONVEYANCE) exist, giving a true cycle in the
          graph rather than a linear pipeline.
        test_recipe:
          setup:
            - "Driver D bound to Vehicle V, starting OFF_DUTY."
            - "Clock at 2026-05-15T00:00:00Z."
          trigger:
            - "POST DRIVING at T+10:00:00 (after 10h OFF_DUTY break)."
            - "POST OFF_DUTY at T+15:00:00 (5h drive)."
            - "POST SLEEPER_BERTH at T+15:30:00."
            - "Advance clock by 10h to T+25:30:00; POST DRIVING again."
          assert:
            - "Driver.duty_status sequence over four events == [DRIVING, OFF_DUTY, SLEEPER_BERTH, DRIVING]."
            - "Driver.id is unchanged; the cycle returned to DRIVING after re-entering rest."
            - "All four DutyEvents have edit_state == ACTIVE and strictly increasing event_time."

      - name: daily_log_cyclic_certification
        grounds:
          - state_machines.DailyLog.UNCERTIFIED_to_CERTIFIED
          - state_machines.DailyLog.CERTIFIED_to_RECERTIFIED
          - state_machines.DailyLog.RECERTIFIED_to_RECERTIFIED
          - endpoints.POST_drivers_driver_id_duty_events_event_id_edit
        distinguishing_aspect: |
          On a different entity (DailyLog, not Driver), the certification
          machine is cyclic: CERTIFIED → RECERTIFIED → RECERTIFIED loops on
          every subsequent edit within the 8-day FMCSA edit window. The self-
          loop on RECERTIFIED makes this strictly non-linear (a linear pipeline
          would terminate at CERTIFIED).
        test_recipe:
          setup:
            - "Driver D has DailyLog L for 2026-05-09 with three ACTIVE events; L.status=CERTIFIED at 2026-05-10T01:00:00Z."
          trigger:
            - "POST /drivers/{D.id}/duty-events/{event_id_1}/edit changing annotation."
            - "POST /drivers/{D.id}/duty-events/{event_id_2}/edit changing odometer."
          assert:
            - "After first edit: L.status == RECERTIFIED, L.certification_count == 2."
            - "After second edit: L.status == RECERTIFIED (self-loop), L.certification_count == 3."
            - "L.integrity_hash changes between each edit."

  # =============================================================================
  # Rule 4: Transitive cascade chains from different triggers
  # =============================================================================
  - rule_id: transitive_cascade
    instances:
      - name: limit_exceeded_event_creates_violation_chain_depth3
        grounds:
          - state_machines.Driver.duty_status.DRIVING_to_OFF_DUTY
          - calculations.available_driving_hours
          - entities.DailyLog.fields.total_driving_minutes
          - entities.DailyLog.fields.integrity_hash
          - entities.Violation
          - endpoints.POST_drivers_driver_id_duty_events
        distinguishing_aspect: |
          Triggered by the DRIVING→OFF_DUTY transition. Hop 1: appending the
          OFF_DUTY DutyEvent closes the open DRIVING interval. Hop 2: closing
          the interval *causes* DailyLog.total_driving_minutes to recompute
          and DailyLog.integrity_hash to be re-hashed (caused by the new
          ACTIVE event set, not by the original POST directly). Hop 3: the
          new total_driving_minutes *causes* available_driving_hours.minutes_
          remaining to recompute as <0, which in turn *causes* a Violation
          row to be inserted. Each hop is a consequence of the previous.
        test_recipe:
          setup:
            - "Driver D bound to V; 10h break ended at 2026-05-15T10:00:00Z."
            - "POST DRIVING at 2026-05-15T10:00:00Z."
          trigger:
            - "Advance clock to 2026-05-15T22:15:00Z (745 minutes elapsed driving)."
            - "POST OFF_DUTY at 2026-05-15T22:15:00Z."
          assert:
            - "Hop 1: a new ACTIVE DutyEvent with new_status=OFF_DUTY exists at 22:15."
            - "Hop 2: DailyLog for 2026-05-15 has total_driving_minutes == 745 (was 0 before)."
            - "Hop 3: a Violation row exists with rule_code=ELEVEN_HOUR_DRIVING, status=OPEN, overage_minutes == 745 - 660 == 85, triggering_duty_event_id == new event id."

      - name: driver_edit_resolves_violation_chain_depth3
        grounds:
          - state_machines.DailyLog.CERTIFIED_to_RECERTIFIED
          - state_machines.Violation.OPEN_to_RESOLVED
          - state_machines.Violation.ACKNOWLEDGED_to_RESOLVED
          - entities.DutyEvent.fields.edit_state
          - endpoints.POST_drivers_driver_id_duty_events_event_id_edit
        distinguishing_aspect: |
          Triggered by a different action (the driver edit on a DutyEvent, not
          the DRIVING→OFF_DUTY transition above). Hop 1: editing supersedes
          the old DutyEvent (old.edit_state := SUPERSEDED, new ACTIVE record
          inserted). Hop 2: the new ACTIVE event set *causes* DailyLog totals
          and integrity_hash to recompute. Hop 3: the recomputed totals
          *cause* the violation re-evaluation loop to flip the original
          Violation's status from OPEN/ACKNOWLEDGED to RESOLVED, since
          minutes_remaining at the triggering event time is now >= 0.
        test_recipe:
          setup:
            - "Reuse the chain from instance 1: Violation V_open exists with overage_minutes=85 on driver D."
            - "Driver acknowledges V_open: POST /violations/{V_open.id}/acknowledge → status=ACKNOWLEDGED."
          trigger:
            - "POST /drivers/{D.id}/duty-events/{driving_event_id}/edit changing event_time from 2026-05-15T10:00:00Z to 2026-05-15T11:25:00Z (so only 660 minutes of DRIVING are between break end and 22:15)."
          assert:
            - "Hop 1: original DRIVING DutyEvent.edit_state == SUPERSEDED; a new ACTIVE DRIVING event exists at 11:25."
            - "Hop 2: DailyLog.total_driving_minutes == 660; DailyLog.integrity_hash changed; DailyLog.status == RECERTIFIED."
            - "Hop 3: V_open.status == RESOLVED (was ACKNOWLEDGED)."

  # =============================================================================
  # Rule 5: Validation priority conflicts across different error-category pairs
  # =============================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_log_certified_blocks_order_check
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors.ERR_LOG_ALREADY_CERTIFIED
          - errors.ERR_DUTY_EVENT_OUT_OF_ORDER
          - endpoints.POST_drivers_driver_id_duty_events
        distinguishing_aspect: |
          Pair (state vs business_safety): both checks fail on a single
          POST /drivers/{id}/duty-events call when the DailyLog for that
          log_date is already CERTIFIED *and* the supplied event_time is
          earlier than the latest stored DutyEvent.event_time. Priority 5
          (state) must win over priority 7 (business_safety); the response
          MUST return ERR_LOG_ALREADY_CERTIFIED, never ERR_DUTY_EVENT_OUT_OF_ORDER.
        test_recipe:
          setup:
            - "Driver D has DailyLog L for 2026-05-09 in CERTIFIED status; latest DutyEvent.event_time on L is 2026-05-09T15:00:00Z."
            - "Clock at 2026-05-10T10:00:00Z."
          trigger:
            - "POST /drivers/{D.id}/duty-events with event_time=2026-05-09T12:00:00Z (earlier than latest), new_status=ON_DUTY_NOT_DRIVING, vehicle_id=V.id."
          assert:
            - "Response status 409."
            - "Response error_id == 'ERR_LOG_ALREADY_CERTIFIED' (state, priority 5), NOT 'ERR_DUTY_EVENT_OUT_OF_ORDER' (business_safety, priority 7)."

      - name: business_referential_vs_business_constraint_bind_cross_carrier_blocks_occupancy
        grounds:
          - validations[priority=15]
          - validations[priority=17]
          - errors.ERR_CROSS_CARRIER_BIND
          - errors.ERR_VEHICLE_ALREADY_BOUND
          - endpoints.POST_drivers_driver_id_bind
        distinguishing_aspect: |
          Pair (business_referential vs business_constraint), different
          from instance 1's pair: on POST /drivers/{D.id}/bind, both
          ERR_CROSS_CARRIER_BIND (priority 15, business_referential — driver
          and vehicle belong to different carriers) and ERR_VEHICLE_ALREADY_
          BOUND (priority 17, business_constraint — Vehicle.current_driver_id
          IS NOT NULL) hold. Priority 15 wins; response must be ERR_CROSS_
          CARRIER_BIND.
        test_recipe:
          setup:
            - "Carrier C1 with Driver D1; Carrier C2 with Vehicle V2 and Driver D2; D2 already bound to V2 (V2.current_driver_id=D2.id)."
            - "Clock at 2026-05-15T00:00:00Z."
          trigger:
            - "POST /drivers/{D1.id}/bind with vehicle_id=V2.id (D1 acts as Driver)."
          assert:
            - "Response status 422."
            - "Response error_id == 'ERR_CROSS_CARRIER_BIND' (business_referential, priority 15), NOT 'ERR_VEHICLE_ALREADY_BOUND' (business_constraint, priority 17)."

  # =============================================================================
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # =============================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: eleven_hour_exact_660_minutes_rejected
        grounds:
          - calculations.available_driving_hours
          - validations[priority=10]
          - errors.ERR_ELEVEN_HOUR_LIMIT_EXCEEDED
          - endpoints.POST_drivers_driver_id_duty_events
        distinguishing_aspect: |
          Numeric threshold boundary on the 11-hour DRIVING metric, reached
          via POST /drivers/{id}/duty-events. The validation check is
          `minutes_remaining > 0` (strict greater-than), so at exactly
          660 driving minutes since the qualifying break, minutes_remaining
          equals 0 and the next DRIVING event MUST be rejected. At 659
          minutes it MUST succeed.
        test_recipe:
          setup:
            - "Driver D bound to V; 10h OFF_DUTY break ended at 2026-05-20T10:00:00Z."
            - "POST DRIVING at 2026-05-20T10:00:00Z."
            - "POST ON_DUTY_NOT_DRIVING at 2026-05-20T21:00:00Z (exactly 660 minutes of DRIVING accumulated)."
          trigger:
            - "POST /drivers/{D.id}/duty-events with new_status=DRIVING at 2026-05-20T21:00:01Z."
          assert:
            - "Response status 409 with error_id == 'ERR_ELEVEN_HOUR_LIMIT_EXCEEDED' (driving_minutes_since_break == 660, minutes_remaining == 0 violates > 0)."
            - "If the same setup is replayed with 659 minutes of DRIVING (POST ON_DUTY_NOT_DRIVING at 20:59:00), the post-break DRIVING attempt succeeds (minutes_remaining == 1 > 0)."

      - name: daily_log_log_date_must_be_strictly_less_than_today
        grounds:
          - validations[priority=19]
          - errors.ERR_LOG_NOT_YET_CERTIFIABLE
          - entities.DailyLog.fields.log_date
          - entities.Driver.fields.home_terminal_timezone
          - endpoints.POST_drivers_driver_id_daily_logs_log_id_certify
          - endpoints.POST_clock_advance
        distinguishing_aspect: |
          Different metric (calendar-date comparison, not minute count) on a
          different endpoint (POST /drivers/{id}/daily-logs/{logId}/certify,
          not /duty-events). The check is `log_date < today` (strict less-
          than, NOT <=). At exactly log_date == today in the driver's
          home_terminal_timezone, certify MUST be rejected; after the clock
          advances past local midnight, certify MUST succeed.
        test_recipe:
          setup:
            - "Driver D with home_terminal_timezone='UTC'. DailyLog L exists for log_date='2026-05-20' with at least one ACTIVE event."
            - "Clock at 2026-05-20T23:59:59Z (still 2026-05-20 in UTC)."
          trigger:
            - "POST /drivers/{D.id}/daily-logs/{L.id}/certify (attempt 1)."
            - "POST /_clock/advance with to='2026-05-21T00:00:00Z'."
            - "POST /drivers/{D.id}/daily-logs/{L.id}/certify (attempt 2)."
          assert:
            - "Attempt 1: status 422, error_id == 'ERR_LOG_NOT_YET_CERTIFIABLE' (log_date == today, not strictly less)."
            - "Attempt 2: status 200; L.status == CERTIFIED; L.certified_at == 2026-05-21T00:00:00Z."

  # =============================================================================
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # =============================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: driver_drive_requires_vehicle_bound_state
        grounds:
          - state_machines.Driver.duty_status.OFF_DUTY_to_DRIVING
          - state_machines.Driver.binding_state.UNBOUND_to_BOUND
          - validations[priority=4]
          - validations[priority=13]
          - errors.ERR_DRIVER_NOT_BOUND
          - errors.ERR_VEHICLE_MISMATCH
        distinguishing_aspect: |
          Entity pair: Driver ↔ Vehicle. Driver's valid OFF_DUTY→DRIVING
          transition is gated by the Vehicle entity's binding occupancy state:
          Driver.bound_vehicle_id must reference a Vehicle whose current_
          driver_id == Driver.id. If the Vehicle's binding state is
          UNBOUND (current_driver_id IS NULL), the DRIVING transition is
          rejected even though the Driver's own duty_status is OFF_DUTY.
        test_recipe:
          setup:
            - "Driver D not bound to any vehicle; D.duty_status == OFF_DUTY; D.bound_vehicle_id IS NULL."
            - "Vehicle V exists, V.current_driver_id IS NULL."
            - "Clock at 2026-05-15T10:00:00Z."
          trigger:
            - "POST /drivers/{D.id}/duty-events with new_status=DRIVING, vehicle_id=V.id."
          assert:
            - "Response status 409, error_id == 'ERR_DRIVER_NOT_BOUND'."
            - "After POST /drivers/{D.id}/bind with vehicle_id=V.id, the same DRIVING POST succeeds."

      - name: violation_resolution_depends_on_duty_event_edit_state
        grounds:
          - state_machines.Violation.OPEN_to_RESOLVED
          - state_machines.Violation.ACKNOWLEDGED_to_RESOLVED
          - state_machines.DailyLog.CERTIFIED_to_RECERTIFIED
          - entities.DutyEvent.fields.edit_state
        distinguishing_aspect: |
          Different entity pair than instance 1 (Violation ↔ DutyEvent, not
          Driver ↔ Vehicle). Violation's transition OPEN→RESOLVED (or
          ACKNOWLEDGED→RESOLVED) is gated entirely by the DutyEvent edit
          state: when a previously ACTIVE DutyEvent transitions to SUPERSEDED
          and the replacement event recomputes the limit such that
          minutes_remaining at the triggering event time is now >= 0, the
          Violation transitions to RESOLVED. No Violation-side action is
          required.
        test_recipe:
          setup:
            - "Driver D has an OPEN Violation V with rule_code=ELEVEN_HOUR_DRIVING, triggering_duty_event_id=E1.id, overage_minutes=85."
            - "E1 has edit_state=ACTIVE; the supersession of E1 by E2 will reduce driving_minutes_since_break to exactly 660."
          trigger:
            - "POST /drivers/{D.id}/duty-events/{E1.id}/edit producing E2."
          assert:
            - "E1.edit_state == SUPERSEDED; E2.edit_state == ACTIVE; E1.superseded_by_event_id == E2.id."
            - "V.status == RESOLVED (transitioned from OPEN)."
            - "DailyLog.status == RECERTIFIED."

  # =============================================================================
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # =============================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duty_event_strict_monotonic_per_driver_point_conflict
        grounds:
          - validations[priority=7]
          - errors.ERR_DUTY_EVENT_OUT_OF_ORDER
          - entities.DutyEvent.fields.event_time
          - endpoints.POST_drivers_driver_id_duty_events
          - concurrency_rules[duty_events_simultaneous]
        distinguishing_aspect: |
          Resource: the per-Driver DutyEvent event_time timeline. Interval
          semantics: STRICT MONOTONIC POINT (event_time must be strictly
          greater than the latest stored event_time — exact equality is
          rejected, no buffer beyond zero duration). The overlap is a single-
          point conflict on a single-driver index.
        test_recipe:
          setup:
            - "Driver D bound to V. Latest ACTIVE DutyEvent for D has event_time = 2026-05-15T10:00:00.000Z."
          trigger:
            - "POST /drivers/{D.id}/duty-events with event_time=2026-05-15T10:00:00.000Z (exactly equal, not strictly greater), new_status=ON_DUTY_NOT_DRIVING."
          assert:
            - "Response status 409, error_id == 'ERR_DUTY_EVENT_OUT_OF_ORDER'."
            - "A subsequent POST with event_time=2026-05-15T10:00:00.001Z (one millisecond later) succeeds."

      - name: vehicle_current_driver_half_open_occupancy
        grounds:
          - validations[priority=17]
          - errors.ERR_VEHICLE_ALREADY_BOUND
          - entities.Vehicle.fields.current_driver_id
          - state_machines.Driver.binding_state.UNBOUND_to_BOUND
          - state_machines.Driver.binding_state.BOUND_to_UNBOUND
          - concurrency_rules[two_drivers_same_vehicle]
        distinguishing_aspect: |
          Different resource entity (Vehicle, not DutyEvent stream) and
          different interval semantics (HALF-OPEN OCCUPANCY: the binding
          occupies Vehicle.current_driver_id from POST /bind until POST
          /unbind — the closing unbind frees the slot immediately for a
          subsequent bind at the same instant, unlike instance 1 which
          rejects equal-instant point conflicts). A second bind during the
          open occupancy is rejected.
        test_recipe:
          setup:
            - "Driver D1 bound to Vehicle V at 2026-05-15T08:00:00Z; V.current_driver_id == D1.id."
            - "Driver D2 (same carrier) exists in OFF_DUTY status, unbound."
          trigger:
            - "POST /drivers/{D2.id}/bind with vehicle_id=V.id at 2026-05-15T09:00:00Z."
            - "POST /drivers/{D1.id}/unbind at 2026-05-15T10:00:00Z."
            - "POST /drivers/{D2.id}/bind with vehicle_id=V.id at 2026-05-15T10:00:00Z (same instant as unbind)."
          assert:
            - "First D2 bind: 409, error_id == 'ERR_VEHICLE_ALREADY_BOUND'."
            - "Unbind succeeds; V.current_driver_id IS NULL."
            - "Second D2 bind at the same instant as unbind succeeds (half-open semantics — the unbind closes the previous interval; the next bind opens a new one)."

  # =============================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =============================================================================
  - rule_id: compensating_invariant
    instances:
      - name: bind_unbind_round_trip_preserves_bound_driver_count
        grounds:
          - state_machines.Driver.binding_state.UNBOUND_to_BOUND
          - state_machines.Driver.binding_state.BOUND_to_UNBOUND
          - entities.Driver.fields.bound_vehicle_id
          - entities.Vehicle.fields.current_driver_id
        distinguishing_aspect: |
          Conserved quantity: count(*) over all Driver rows where bound_
          vehicle_id IS NOT NULL (global "bound driver" count). The forward
          action POST /bind increases the count by 1; the compensating
          POST /unbind decreases it by 1. After the bind→unbind pair the
          count returns to its initial value, with Driver.bound_vehicle_id,
          Driver.bound_eld_device_id, Vehicle.current_driver_id all back to
          NULL.
        test_recipe:
          setup:
            - "Driver D in OFF_DUTY, unbound; Vehicle V free. Some other Driver D' already bound to V', so initial count of bound drivers in the system == 1."
          trigger:
            - "Record count_before = count of drivers with bound_vehicle_id IS NOT NULL."
            - "POST /drivers/{D.id}/bind with vehicle_id=V.id."
            - "POST /drivers/{D.id}/unbind."
            - "Record count_after."
          assert:
            - "count_before == count_after == 1 (invariant)."
            - "After unbind: D.bound_vehicle_id IS NULL, D.bound_eld_device_id IS NULL, V.current_driver_id IS NULL."

      - name: noop_edit_round_trip_preserves_total_on_duty_minutes
        grounds:
          - state_machines.DailyLog.CERTIFIED_to_RECERTIFIED
          - state_machines.DailyLog.RECERTIFIED_to_RECERTIFIED
          - entities.DailyLog.fields.total_on_duty_minutes
          - entities.DutyEvent.fields.edit_state
          - endpoints.POST_drivers_driver_id_duty_events_event_id_edit
        distinguishing_aspect: |
          Different conserved quantity from instance 1 (aggregate on-duty
          minute total on a single DailyLog, not a global bound-driver count).
          A pair of edits with identical fields (the second edit restores the
          original values) is a forward + compensating action. The named
          invariant: DailyLog.total_on_duty_minutes equals its pre-pair value.
          ACTIVE event count on the log also stays the same (each edit
          promotes one new ACTIVE event and demotes one).
        test_recipe:
          setup:
            - "Driver D has DailyLog L for 2026-05-15 with two ACTIVE events: E_drv (DRIVING at 10:00, 5h interval) and E_ond (ON_DUTY_NOT_DRIVING at 15:00, 1h interval). L.total_on_duty_minutes == 360 (5h DRIVING + 1h ON_DUTY_NOT_DRIVING)."
          trigger:
            - "Record total_before = L.total_on_duty_minutes."
            - "POST /drivers/{D.id}/duty-events/{E_drv.id}/edit changing odometer_miles from 1000 to 1001 → E_drv2."
            - "POST /drivers/{D.id}/duty-events/{E_drv2.id}/edit changing odometer_miles back to 1000 → E_drv3."
            - "Record total_after = L.total_on_duty_minutes."
          assert:
            - "total_before == total_after == 360 (invariant)."
            - "E_drv.edit_state == SUPERSEDED; E_drv2.edit_state == SUPERSEDED; E_drv3.edit_state == ACTIVE."
            - "Count of ACTIVE DutyEvents on L unchanged (still 2)."
            - "L.certification_count incremented by exactly 2 (one per edit)."
