  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cash_conservation_across_pay_and_receive
        grounds:
          - calculations.unfunded_reconciliation
          - entities.CashLedgerEntry.fields.balance_after
          - entities.FoFProgram.fields.unrestricted_cash
        distinguishing_aspect: |
          Conserved quantity: unrestricted_cash always equals the signed sum
          of CashLedgerEntry amounts. A forward action (call pay, -4,000,000)
          followed by its compensating action (distribution receive,
          +4,000,000) returns unrestricted_cash to its exact pre-pair value
          and every entry's balance_after stays consistent with the running
          total — no drift.
        test_recipe:
          setup:
            - "Program opened with CONTRIBUTION 20,000,000; EXECUTED commitment 10,000,000 with ISSUED call 4,000,000 and PENDING distribution 4,000,000"
          setup_api_calls:
