              payload: { level_of_care: "INPATIENT", requested_day_count: 99, clinical_summary: "short", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_CLINICAL_DOC_INCOMPLETE with http 422 — safety (priority 12) precedes fiscal (priority 27)"
            - "No AuthorizationRequest is created: GET /api/utilization-cases/${case_id}/authorization-requests returns an empty list and case.auth_status remains AUTH_PENDING"

  - rule_id: boundary_precision_check
