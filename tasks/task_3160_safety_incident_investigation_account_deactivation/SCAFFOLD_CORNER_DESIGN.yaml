              payload: { decision_category: "DEACTIVATED", decision_basis: "S4 physical assault with a platform record and a law-enforcement contact on file.", expected_incident_version: "${high_inc_v_ready}" }
              as: SafetyOperationsLead
              captures: { lead_decision_err: $.data.error_id }
          assert:
            - "the investigator's withdraw is refused with error_id == \"ERR_UNAUTHORIZED\" with HTTP 403, because withdrawal is a SafetyOperationsLead exclusive operation"
            - "the operations lead's decision is refused with error_id == \"ERR_UNAUTHORIZED\" with HTTP 403, because the decision is a SafetyInvestigator exclusive operation"
            - "SafetyIncident.${low_inc}.incident_status is still \"OPEN\" and SafetyIncident.${high_inc}.incident_status is still \"PENDING_DECISION\""
            - "Account.${acct_id}.status is still \"PENDING_DECISION\" and no EnforcementAction row exists after both refusals"

      - name: role_appeal_reviewer_cannot_file_a_decision_on_any_incident
        claim_type: role_model_fit
        grounds:
          - roles.SafetyAppealReviewer
          - endpoints.POST_/safety/incidents/{incidentId}/decision
          - endpoints.POST_/safety/incidents/{incidentId}/appeals
        distinguishing_aspect: "The separation of duties is enforced at the operation layer as well as at the reviewer-identity layer: the appeal team holds the appeal operations and is refused every decision operation outright."
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S4. One ACTIVE driver account with one held, fully evidenced S4 incident."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
