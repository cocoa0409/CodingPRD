      - name: approve_monitoring_plan_without_atmospheric_method_rejected
        claim_type: error_code_triggerable
        grounds:
          - errors[ERR_MRV_DOMAIN_COVERAGE_MISSING]
          - validations[priority 87 ERR_MRV_DOMAIN_COVERAGE_MISSING]
          - validations[priority 88 ERR_MRV_COVERAGE_BELOW_MINIMUM]
        distinguishing_aspect: |
          The plan violates both MRV guards at once, coverage 65.00 below the 70.00 minimum and a zero
          atmospheric subscore, and the lower priority number wins: the response is 422
          ERR_MRV_DOMAIN_COVERAGE_MISSING, not ERR_MRV_COVERAGE_BELOW_MINIMUM, and the plan stays in
          REVIEW_COMPLETE.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in DRAFT"
            - "one MonitoringPlan in REVIEW_COMPLETE with a subsurface method scoring 1.0000 and a surface method scoring 0.5000 and no atmospheric method, so coverage_score is 65.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
