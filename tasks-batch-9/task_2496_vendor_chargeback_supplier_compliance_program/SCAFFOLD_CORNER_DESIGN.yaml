            - "Second trigger call returns HTTP 422 with $.data.error_id == ERR_GUIDE_HAS_NO_REQUIREMENTS"
            - "After the second trigger call RoutingGuide.${g_id}.status == DRAFT"
            - "Third trigger call returns HTTP 201"
            - "Fourth trigger call returns HTTP 409 with $.data.error_id == ERR_REQUIREMENT_CODE_TAKEN"
