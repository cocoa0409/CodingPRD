  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_design_approve
        grounds:
          - validations[priority=5]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STRIKE_THRESHOLD_EXCEEDED]
        distinguishing_aspect: |
          The request violates priority 5 (state: Design already APPROVED) — the state check fires
          first and returns ERR_INVALID_STATE (409). The pair (state vs business_safety) is what
          distinguishes this from instance B (business_safety vs business_fiscal); attempting to
          approve an APPROVED design also exercises the priority-5 vs priority-8 ordering because
          Rule 8 (STRIKE_THRESHOLD_EXCEEDED) never gets checked once state fails.
