  # ===========================================================================
  # §1.9 corner coverage, section 2 of 9
  # ===========================================================================
  - section: state_machines
    instances:
      - name: geologic_model_draft_to_submitted_advances_project_to_site_characterization
        claim_type: valid_transition
        grounds:
          - state_machines.GeologicModel.DRAFT_to_SUBMITTED
          - state_machines.StorageProject.DRAFT_to_SITE_CHARACTERIZATION
          - endpoints[POST /ccs/geologic-models/{id}/submit]
        distinguishing_aspect: |
          The declared DRAFT -> SUBMITTED transition succeeds once the plume simulation has run: the
          model reaches status SUBMITTED with revision_round_count 1 and, as the first submit of the
          project, drives StorageProject DRAFT -> SITE_CHARACTERIZATION in the same request.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT with one SIMULATED DRAFT GeologicModel"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
            - call: "POST /ccs/geologic-models/${model_id}/run-plume-simulation"
              payload: { injection_years: 20 }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { plume_state: $.data.plume_status }
          trigger:
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "initial site characterization" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_state: $.data.status, rounds: $.data.revision_round_count }
          assert:
            - "the trigger call returns HTTP 200"
            - "${plume_state} == SIMULATED"
            - "${model_state} == SUBMITTED"
            - "${rounds} == 1"
            - "StorageProject.${proj_id}.status == SITE_CHARACTERIZATION"
            - "GeologicModel.${model_id}.plume_status == SIMULATED"

      - name: geologic_model_submit_without_simulation_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.GeologicModel.DRAFT_to_SUBMITTED
          - validations[priority=57]
          - errors.ERR_INVALID_MODEL_STATE
        distinguishing_aspect: |
          The DRAFT -> SUBMITTED precondition on the second dimension (plume_status IN
          {SIMULATED, AOR_FINALIZED}) is enforced: submitting a model whose plume_status is still
          NOT_RUN returns HTTP 409 ERR_INVALID_MODEL_STATE, leaves revision_round_count at 0 and leaves
          the project in DRAFT.
        test_recipe:
          setup:
            - "logical clock at the 2026-08-01T00:00:00Z default"
            - "project 'Alpha Storage Hub' in status DRAFT with one DRAFT GeologicModel whose plume_status is NOT_RUN"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ccs/storage-projects"
              payload: { name: "Alpha Storage Hub", operator_name: "Alpha CCS LLC", basin_code: "ILB-01", total_project_acreage: 4000, requested_annual_injection_rate_tpy: 1000000, annual_monitoring_cost_usd: 200000, required_consent_pct: 60, ca_rig_slots: 2 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id, proj_v0: $.data.version }
            - call: "POST /ccs/geologic-models"
              payload: { project_id: "${proj_id}", expected_project_version: "${proj_v0}", model_label: "M1-DET", injection_zone_top_depth_m: 1800, injection_zone_thickness_m: 50, seal_thickness_m: 60, capillary_entry_pressure_psi: 900, p10_seal_thickness_m: 30, p10_capillary_entry_pressure_psi: 700, reservoir_pressure_psi: 3000, fracture_pressure_psi: 4500, permeability_md: 200, porosity_fraction: 0.20, assessment_variant: "DETERMINISTIC" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
              captures: { model_id: $.data.id }
          trigger:
            - call: "POST /ccs/geologic-models/${model_id}/submit"
              payload: { submission_note: "premature submission" }
              as: ProjectDeveloper
              as_user_id: "developer-1"
          assert:
            - "the trigger call returns HTTP 409 with error_id ERR_INVALID_MODEL_STATE"
            - "GeologicModel.${model_id}.status == DRAFT"
            - "GeologicModel.${model_id}.plume_status == NOT_RUN"
            - "GeologicModel.${model_id}.revision_round_count == 0"
            - "StorageProject.${proj_id}.status == DRAFT"

      - name: model_accept_sets_governing_model_and_requirement_snapshot
        claim_type: side_effect_execution
        grounds:
          - state_machines.GeologicModel.SUBMITTED_to_ACCEPTED
          - state_machines.StorageProject.SITE_CHARACTERIZATION_to_PERMITTING
          - calculations.required_financial_assurance
          - entities.StorageProject.fields.governing_geologic_model_id
        distinguishing_aspect: |
          The ACCEPT decision executes all four declared side effects of one transition in one request:
          model status ACCEPTED with reviewer_user_id recorded, project status PERMITTING,
          governing_geologic_model_id set, and the first requirement snapshot computed as
          10000000.00 pisc + 2000000.00 emergency floor + 500000.00 tier-2 admin fee = 12500000.00 with
          aor_radius_km still 0.
