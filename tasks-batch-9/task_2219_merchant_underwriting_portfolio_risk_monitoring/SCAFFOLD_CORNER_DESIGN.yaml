      - name: request_info_writes_the_supplied_item_labels_verbatim
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /merchant-applications/{id}/request-info]
          - state_machines.MerchantApplication.transitions.IN_VERIFICATION_to_INFO_REQUESTED
          - entities.MerchantApplication.fields.outstanding_info_items
        distinguishing_aspect: "A manual information request stores exactly the labels supplied in the body - [BANK_STATEMENTS, PROCESSING_HISTORY] - rather than the verification-derived check names, moves the application IN_VERIFICATION -> INFO_REQUESTED, and leaves verification_attempt_count at 1; the applicant's resubmit then clears the list to []."
        test_recipe:
          setup:
            - "application SUBMITTED at clock 2026-08-01 with one owner, then one all-true verification putting it in IN_VERIFICATION"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
