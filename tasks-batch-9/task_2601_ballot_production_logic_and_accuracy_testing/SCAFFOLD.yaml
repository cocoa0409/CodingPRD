    roles: [ElectionsDirector]
    input: []
    output: PrintJob
    side_effects:
      - "job.status = PRINTING; approved_by_user_id = X-User-ID; invoice_basis = ESTIMATE and the ESTIMATE variant of calculations.print_job_invoice_total is written."
      - "election.committed_print_cents += job.invoice_total_cents."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_PRINT_JOB_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_JOB_STATE_INVALID, ERR_STYLE_STATE_INVALID, ERR_VENDOR_NOT_SECURE, ERR_PROOF_VERSION_STALE]

  - method: POST
    path: /print-jobs/{id}/inspect
    description: "Records a quality-inspection sample and re-derives the cumulative defect rate (PRINTING or QC_HOLD -> QC_PASSED or QC_HOLD)."
    roles: [WarehouseCustodian]
    input: [sample_size, defect_count]
    output: PrintJob
    side_effects:
      - "Folds the sample into the job per calculations.print_job_quality_inspection and moves the job to QC_HOLD or QC_PASSED."
      - "vendor.quality_defect_rate_bp is re-derived."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PRINT_JOB_NOT_FOUND, ERR_JOB_STATE_INVALID]

  - method: POST
    path: /print-jobs/{id}/deliver
    description: |
      Records the vendor's secure delivery: creates one BallotLot per shipped pallet and rewrites the
      invoice on the FINAL basis (QC_PASSED -> DELIVERED). The caller's X-User-ID must be the vendor's id.
      The manifest is applied atomically and there is no partial success: every line is validated first
      (payload.lots must be a non-empty list whose lot_code values are distinct within the manifest, whose
      quantity_shipped values are >= 1, and whose seal_number values are distinct within the manifest and
      not already held by any BallotLot or TabulatorUnit of the election), and a single bad line rejects the
      whole call, creating no BallotLot rows, appending no CustodyEvent, leaving job.status QC_PASSED,
      invoice_basis null and election.committed_print_cents unchanged. A duplicate lot_code or a
      non-positive quantity_shipped is ERR_INVALID_REQUEST (priority 30); a colliding seal_number is
      ERR_SEAL_NUMBER_DUPLICATE (priority 90).
    roles: [PrintVendorRep]
    input: [lots]
    output: PrintJob
    side_effects:
      - "Creates one BallotLot per entry of payload.lots (each entry carries lot_code, quantity_shipped and seal_number) with custody_state IN_TRANSIT, quantity_received 0, issued_quantity 0, unused_quantity 0, returned_unused_quantity 0, voted_quantity 0, spoiled_quantity 0, accounted_quantity 0 and lot_variance 0."
      - "Appends a CustodyEvent TRANSFER_OUT per created lot."
      - "job.status = DELIVERED; invoice_basis = FINAL and the FINAL variant of calculations.print_job_invoice_total is written; delivered_quantity recomputed."
      - "election.committed_print_cents is adjusted by the FINAL total minus the ESTIMATE total."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_PRINT_JOB_NOT_FOUND, ERR_JOB_STATE_INVALID, ERR_SEAL_NUMBER_DUPLICATE]

  - method: GET
    path: /ballot-lots/{id}
    description: "Reads one ballot lot with its full accounting line."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: []
    output: BallotLot
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BALLOT_LOT_NOT_FOUND]

  - method: GET
    path: /ballot-lots
    description: "Lists ballot lots ordered by lot_code ASC, then created_at ASC (FK reverse-reachability for BallotLot.election_id, BallotLot.print_job_id and BallotLot.precinct_id). lot_code is unique within a print job, so the ordering is total and a test can address a lot positionally."
    roles: [ElectionsDirector, BallotCoordinator, LanguageAccessCoordinator, PrintVendorRep, WarehouseCustodian, VotingSystemTechnician, PublicObserver]
    input: ["election_id?", "print_job_id?", "precinct_id?", "custody_state?"]
    output: BallotLot[]
    side_effects: []
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST]

  - method: POST
    path: /ballot-lots/{id}/receive
    description: "Receives a shipped lot into the warehouse after verifying its seal (IN_TRANSIT -> RECEIVED)."
    roles: [WarehouseCustodian]
    input: [seal_number, quantity_received]
    output: BallotLot
    side_effects:
      - "quantity_received stored; unused_quantity = quantity_received; CustodyEvent RECEIPT appended; election.total_ballots_received recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BALLOT_LOT_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_LOT_STATE_INVALID, ERR_SEAL_MISMATCH]

  - method: POST
    path: /ballot-lots/{id}/issue
    description: "Issues a received lot to a precinct (RECEIVED -> ISSUED). The lot's style must be the precinct's assigned style."
    roles: [WarehouseCustodian]
    input: [precinct_id, issue_quantity]
    output: BallotLot
    side_effects:
      - "precinct_id and issued_quantity stored; unused_quantity = quantity_received - issued_quantity; issued_by_user_id = X-User-ID; CustodyEvent ISSUE appended."
      - "precinct.ballots_received and deployment_status recomputed; election.total_ballots_issued and deployment_readiness recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BALLOT_LOT_NOT_FOUND, ERR_PRECINCT_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_LOT_STATE_INVALID, ERR_LOT_NOT_FOR_PRECINCT, ERR_ISSUE_QUANTITY_EXCEEDS_RECEIPT]

  - method: POST
    path: /ballot-lots/{id}/recall
    description: "Compensating action: pulls an issued lot back into the warehouse (ISSUED -> RECEIVED) and reverses every side effect of the issue."
    roles: [WarehouseCustodian]
    input: ["recall_reason?"]
    output: BallotLot
    side_effects:
      - "issued_quantity = 0; unused_quantity = quantity_received; precinct_id = null; issued_by_user_id = null; CustodyEvent RECALL appended."
      - "The formerly referenced precinct recomputes ballots_received and deployment_status; election.total_ballots_issued and deployment_readiness recomputed."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_BALLOT_LOT_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_LOT_STATE_INVALID]

  - method: POST
    path: /ballot-lots/{id}/return-counts
    description: "Records the precinct's post-election ballot accounting for the lot (ISSUED -> RETURNED)."
    roles: [WarehouseCustodian]
    input: [voted_quantity, spoiled_quantity, returned_unused_quantity]
    output: BallotLot
    side_effects:
      - "voted_quantity, spoiled_quantity and returned_unused_quantity stored; accounted_quantity = their sum; lot_variance = issued_quantity - accounted_quantity; CustodyEvent RETURN appended."
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_BALLOT_LOT_NOT_FOUND, ERR_ELECTION_PHASE_INVALID, ERR_LOT_STATE_INVALID, ERR_LOT_ACCOUNTING_EXCEEDS_RECEIPT]

