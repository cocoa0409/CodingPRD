  - section: rbac
    instances:

      - name: each_exclusive_write_rejects_the_neighbouring_role_while_reads_stay_shared
        claim_type: role_cannot_perform_other_exclusive_operation
        grounds: [roles.BureauAdmin, roles.ClientLiaison, roles.ProductionScheduler, roles.PostageController, roles.IntegrityAuditor, errors.ERR_UNAUTHORIZED]
        distinguishing_aspect: "The six roles are peers rather than a hierarchy: BureauAdmin is refused the ClientLiaison's data-file intake exactly as the ClientLiaison is refused client creation, while every role can still read any row."
        test_recipe:
          setup:
            - "One client CL-R1 created by the BureauAdmin; nothing else."
