# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml - SKILL.md 1.8 Test Targeting Index
# domain: marketing-mix-incrementality   api_prefix: /mmm
# 9 rule_ids x 2 instances = 18 instances. Every literal below was executed
# against the SCAFFOLD.yaml formulas in Decimal ROUND_HALF_UP before being pinned.
#
# Canonical fixture F1 (reused by most instances):
#   Market US_CORE total_population 10000000, annual_budget_ceiling_cents 5000000000
#   MediaChannel A_SEARCH  decay 0.50 lag 2 half_point 200000 ceiling 1200 min 200000 max 3000000
#   MediaChannel B_SOCIAL  decay 0.25 lag 1 half_point 150000 ceiling  800 min 100000 max 3000000
#   DataWindow W1 [2026-08-03, 2026-08-31) WEEKLY -> 4 periods 08-03/08-10/08-17/08-24
#   SalesObservation  units/revenue_cents: 5000/25000000, 6000/30600000, 5500/27500000, 6500/32500000
#   SpendObservation A_SEARCH 400000, 600000, 300000, 500000
#   SpendObservation B_SOCIAL 200000, 200000, 400000, 100000
#   => modeled_sales_units 23000, unit_price_cents 5026, observation_period_count 4
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    note: >-
      Both instances pin BOTH branches of a declared variants: block on the SAME
      fixture data, and they live in two different entity domains - ChannelContribution
      (media response modelling) versus Experiment (incrementality readout) - so neither
      is a re-skin of the other.
    instances:
      - name: carryover_mode_variant_divergence_on_channel_contribution
        grounds:
          - "calculations.adstock_transform"
          - "calculations.channel_contribution_decomposition"
          - "calculations.roi_estimation"
          - "entities.ModelRun.fields.carryover_attribution_mode"
          - "entities.ChannelContribution.fields.attribution_mode_used"
          - "state_machines.ModelRun.fit_status=PENDING_to_fit_status=FITTED"
        distinguishing_aspect: |
          Two ModelRuns over byte-identical spend, sales, decay, lag, ceiling and half-point
          diverge only because carryover_attribution_mode differs: EFFECT_PERIOD yields
          A_SEARCH 3653.3333 / B_SOCIAL 2014.2857 / baseline 17332.3810 while SPEND_PERIOD
          yields A_SEARCH 3787.0430 / B_SOCIAL 1979.0210 / baseline 17233.9360 - and the
          divergence is NOT monotone per channel (A rises, B falls) because the Hill curve is
          concave, so a larger-but-flatter adstock series can buy fewer units.
        test_recipe:
          setup:
            - "Fixture F1 built to the point where DataWindow W1 is SEALED and no ModelRun exists yet."
            - "Logical clock at 2026-08-31T00:00:00Z (W1 has elapsed)."
            - "Both channels ACTIVE with 4 non-superseded SpendObservations each."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "B_SOCIAL", channel_type: "SOCIAL", adstock_decay_rate: 0.25, adstock_max_lag_periods: 1, saturation_half_point_cents: 150000, response_ceiling_units: 800, min_spend_cents: 100000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { chb: "$.data.id" }
            - call: "POST /mmm/data-windows"
              payload: { market_id: "${mkt}", window_start_date: "2026-08-03T00:00:00Z", window_end_date: "2026-08-31T00:00:00Z", granularity: "WEEKLY" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { w1: "$.data.id" }
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-03T00:00:00Z", units_sold: 5000, revenue_cents: 25000000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-10T00:00:00Z", units_sold: 6000, revenue_cents: 30600000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-17T00:00:00Z", units_sold: 5500, revenue_cents: 27500000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/sales-observations"
              payload: { data_window_id: "${w1}", period_start_date: "2026-08-24T00:00:00Z", units_sold: 6500, revenue_cents: 32500000, distribution_pct: 82.00, macro_index: 100.0000 }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "GET /mmm/data-windows/${w1}"
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v0: "$.data.version" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${cha}", period_start_date: "2026-08-03T00:00:00Z", spend_cents: 400000, impressions: 4000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v0}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { so_a1: "$.data.id", v1: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${cha}", period_start_date: "2026-08-10T00:00:00Z", spend_cents: 600000, impressions: 6000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v1}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v2: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${cha}", period_start_date: "2026-08-17T00:00:00Z", spend_cents: 300000, impressions: 3000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v2}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v3: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${cha}", period_start_date: "2026-08-24T00:00:00Z", spend_cents: 500000, impressions: 5000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v3}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v4: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${chb}", period_start_date: "2026-08-03T00:00:00Z", spend_cents: 200000, impressions: 2000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v4}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v5: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${chb}", period_start_date: "2026-08-10T00:00:00Z", spend_cents: 200000, impressions: 2000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v5}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v6: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${chb}", period_start_date: "2026-08-17T00:00:00Z", spend_cents: 400000, impressions: 4000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v6}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v7: "$.data.data_window_version_after" }
            - call: "POST /mmm/spend-observations"
              payload: { data_window_id: "${w1}", channel_id: "${chb}", period_start_date: "2026-08-24T00:00:00Z", spend_cents: 100000, impressions: 1000, price_index: 100.0000, distribution_index: 100.0000, expected_data_window_version: "${v7}" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { v8: "$.data.data_window_version_after" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: DataEngineer
              as_user_id: "de-1"
            - call: "POST /mmm/data-windows/${w1}/seal"
              as: DataEngineer
              as_user_id: "de-1"
          trigger:
            - call: "POST /mmm/model-runs"
              payload: { market_id: "${mkt}", data_window_id: "${w1}", included_channel_ids: ["${cha}", "${chb}"], control_variables: ["PRICE_INDEX", "MACRO_INDEX"], seasonality_mode: "WEEK_OF_YEAR", carryover_attribution_mode: "EFFECT_PERIOD", holdout_periods: 1 }
              as: Modeler
              as_user_id: "md-1"
              captures: { run_e: "$.data.id" }
            - call: "POST /mmm/model-runs/${run_e}/fit"
              as: Modeler
              as_user_id: "md-1"
            - call: "POST /mmm/model-runs"
              payload: { market_id: "${mkt}", data_window_id: "${w1}", included_channel_ids: ["${cha}", "${chb}"], control_variables: ["PRICE_INDEX", "MACRO_INDEX"], seasonality_mode: "WEEK_OF_YEAR", carryover_attribution_mode: "SPEND_PERIOD", holdout_periods: 1 }
              as: Modeler
              as_user_id: "md-1"
              captures: { run_s: "$.data.id" }
            - call: "POST /mmm/model-runs/${run_s}/fit"
              as: Modeler
              as_user_id: "md-1"
            - call: "GET /mmm/channel-contributions?model_run_id=${run_e}&is_current=true"
              as: Modeler
              as_user_id: "md-1"
            - call: "GET /mmm/channel-contributions?model_run_id=${run_s}&is_current=true"
              as: Modeler
              as_user_id: "md-1"
          assert:
            - "ModelRun.${run_e}.modeled_sales_units == 23000 and ModelRun.${run_s}.modeled_sales_units == 23000"
            - "ModelRun.${run_e}.unit_price_cents == 5026 and ModelRun.${run_s}.unit_price_cents == 5026"
            - "ModelRun.${run_e}.observation_period_count == 4 and ModelRun.${run_s}.observation_period_count == 4"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=A_SEARCH).adstocked_spend_series == [400000, 800000, 700000, 800000]"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=A_SEARCH).mean_adstocked_spend_cents == 675000"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=B_SOCIAL).adstocked_spend_series == [200000, 250000, 450000, 200000]"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=B_SOCIAL).mean_adstocked_spend_cents == 275000"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=A_SEARCH).adstocked_spend_series == [700000, 1050000, 525000, 875000] (closed-form gain G = 1 + 0.50 + 0.25 = 1.75)"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=A_SEARCH).mean_adstocked_spend_cents == 787500"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=B_SOCIAL).adstocked_spend_series == [250000, 250000, 500000, 125000] (G = 1 + 0.25 = 1.25)"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=B_SOCIAL).mean_adstocked_spend_cents == 281250"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=A_SEARCH).contribution_units == 3653.3333"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=B_SOCIAL).contribution_units == 2014.2857"
            - "ModelRun.${run_e}.baseline_sales_units == 17332.3810"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=A_SEARCH).contribution_units == 3787.0430"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=B_SOCIAL).contribution_units == 1979.0210"
            - "ModelRun.${run_s}.baseline_sales_units == 17233.9360"
            - "DIVERGENCE IS NON-MONOTONE: A_SEARCH 3787.0430 > 3653.3333 while B_SOCIAL 1979.0210 < 2014.2857"
            - "attributed_spend_cents is variant-INVARIANT: A_SEARCH 1800000 and B_SOCIAL 900000 on BOTH runs (raw spend, never adstocked)"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=A_SEARCH).average_roi == 10.2009 and .marginal_roi == 1.575497"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=B_SOCIAL).average_roi == 11.2487 and .marginal_roi == 3.339073"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=A_SEARCH).average_roi == 10.5743 and .marginal_roi == 1.236971"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=B_SOCIAL).average_roi == 11.0517 and .marginal_roi == 3.242989"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=A_SEARCH).contribution_revenue_cents == 18361653"
            - "ChannelContribution(model_run_id=${run_e}, channel_code=B_SOCIAL).contribution_revenue_cents == 10123800"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=A_SEARCH).contribution_revenue_cents == 19033678"
            - "ChannelContribution(model_run_id=${run_s}, channel_code=B_SOCIAL).contribution_revenue_cents == 9946560"
            - "every row of run_e has attribution_mode_used == EFFECT_PERIOD; every row of run_s has attribution_mode_used == SPEND_PERIOD"
            - "ci_half_width_pct == 20.00 on all four rows (40.0 / sqrt(4)); run_e A_SEARCH ci_low_units == 2922.6666 and ci_high_units == 4384.0000; run_s A_SEARCH ci_low_units == 3029.6344 and ci_high_units == 4544.4516"
            - "both GET responses carry response_type == array with total_count == 2 and has_more == false"
      - name: readout_method_variant_divergence_on_experiment_lift
        grounds:
          - "calculations.experiment_lift_readout"
          - "entities.Experiment.fields.readout_method"
          - "entities.Experiment.fields.synthetic_control_weight"
          - "entities.Experiment.fields.measured_lift_pct"
          - "state_machines.Experiment.RUNNING_to_READ_OUT"
        distinguishing_aspect: |
          Two Experiments fed the IDENTICAL four conversion counts and identical arm
          populations return measured_lift_pct 10.00 under DIFF_IN_DIFF and 10.53 under
          SYNTHETIC_CONTROL while sharing the byte-identical lift_ci_half_width_pct 3.97,
          which proves the 0.53pp gap is produced by the estimator (differenced drift versus
          a weight-rescaled control rate) and not by a different interval or a different input.
        test_recipe:
          setup:
            - "Market US_CORE and both channels exist; no DataWindow and no ModelRun are needed."
            - "Two AUDIENCE_SPLIT experiments on DIFFERENT channels so the priority-65 window-overlap test never fires."
            - "Both experiments DESIGN_LOCKED then RUNNING; clock advanced past their common end_date."
            - "Arms 245000/245000, minimum_detectable_effect_pct 5.0, baseline_conversion_rate 0.0200 -> power_index 2.5000 -> computed_power 0.8000, which passes the 0.80 gate exactly."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "B_SOCIAL", channel_type: "SOCIAL", adstock_decay_rate: 0.25, adstock_max_lag_periods: 1, saturation_half_point_cents: 150000, response_ceiling_units: 800, min_spend_cents: 100000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { chb: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${cha}", design_type: "AUDIENCE_SPLIT", readout_method: "DIFF_IN_DIFF", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp_did: "$.data.id" }
            - call: "POST /mmm/experiments"
              payload: { market_id: "${mkt}", channel_id: "${chb}", design_type: "AUDIENCE_SPLIT", readout_method: "SYNTHETIC_CONTROL", start_date: "2026-09-07T00:00:00Z", end_date: "2026-10-05T00:00:00Z", washout_days: 7, minimum_detectable_effect_pct: 5.0, baseline_conversion_rate: 0.0200, planned_treatment_population: 245000, planned_control_population: 245000 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
              captures: { exp_syn: "$.data.id" }
            - call: "POST /mmm/experiments/${exp_did}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp_syn}/lock-design"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-07T00:00:00Z" }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp_did}/start"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp_syn}/start"
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-05T00:00:00Z" }
              as: ExperimentDesigner
              as_user_id: "ed-1"
          trigger:
            - call: "POST /mmm/experiments/${exp_did}/read-out"
              payload: { treatment_conversions: 5145, control_conversions: 4900, pre_treatment_conversions: 4655, pre_control_conversions: 4900 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
            - call: "POST /mmm/experiments/${exp_syn}/read-out"
              payload: { treatment_conversions: 5145, control_conversions: 4900, pre_treatment_conversions: 4655, pre_control_conversions: 4900 }
              as: ExperimentDesigner
              as_user_id: "ed-1"
          assert:
            - "Experiment.${exp_did}.status == READ_OUT and Experiment.${exp_syn}.status == READ_OUT"
            - "both experiments stored treatment_conversions 5145, control_conversions 4900, pre_treatment_conversions 4655, pre_control_conversions 4900 with treatment_population 245000 and control_population 245000"
            - "Experiment.${exp_did}.synthetic_control_weight is null (DIFF_IN_DIFF never derives it)"
            - "Experiment.${exp_syn}.synthetic_control_weight == 0.950000 (4655/245000 divided by 4900/245000)"
            - "Experiment.${exp_did}.measured_lift_pct == 10.00 (t_post 0.021, t_pre 0.019, c_post 0.02, c_pre 0.02 -> did 0.002 over c_post 0.02)"
            - "Experiment.${exp_syn}.measured_lift_pct == 10.53 (scaled_control_rate 0.019 -> 100 * 0.002 / 0.019 = 10.5263)"
            - "VARIANT-INVARIANT INTERVAL: Experiment.${exp_did}.lift_ci_half_width_pct == 3.97 and Experiment.${exp_syn}.lift_ci_half_width_pct == 3.97"
            - "Experiment.${exp_did}.lift_ci_low_pct == 6.03 and .lift_ci_high_pct == 13.97"
            - "Experiment.${exp_syn}.lift_ci_low_pct == 6.56 and .lift_ci_high_pct == 14.50"
            - "the two measured_lift_pct values differ by exactly 0.53 while the two half widths differ by 0.00"
            - "both experiments have computed_power == 0.8000 and power_index == 2.5000"
  - rule_id: combinatorial_formula
    note: >-
      The two instances sit in DIFFERENT modes of Rule 2: the first is mode (b) - nested
      rounding whose ORDER changes the published cents and flips a materiality flag - and the
      second is mode (c) - a circular-looking dependency (the fee prices the churn, the churn
      is produced by a budget net of the fee) whose evaluation order the scaffold pins.
    instances:
      - name: reconciliation_rounding_order_flips_materiality
        grounds:
          - "calculations.reconciliation_variance"
          - "entities.ReconciliationReport.fields.variance_lines"
          - "entities.ReconciliationReport.fields.weighted_variance_pct"
          - "entities.ReconciliationReport.fields.attribution_gap_flag"
          - "global_constants.MATERIALITY_PCT"
          - "validations[priority=63]"
        distinguishing_aspect: |
          Mode (b): with model revenue A_SEARCH 18361653 / B_SOCIAL 10123800 and platform
          revenue 19000000 / 13756000 the MANDATED round-per-line-then-weight order yields
          weighted_variance_pct 15.00 and attribution_gap_flag MATERIAL, while the forbidden
          weight-the-unrounded-percentages-then-round order yields 14.99 and IMMATERIAL - the
          fixture sits exactly on MATERIALITY_PCT so a single hundredth of a percentage point
          changes the published flag, not merely the published number.
        test_recipe:
          setup:
            - "Fixture F1 fitted in EFFECT_PERIOD mode, validated (holdout_mape_pct 11.53) and PUBLISHED."
            - "Market.data_posture == OPEN and ModelRun.calibration_status == NOT_REQUIRED, so a report may be filed on the RAW basis."
            - "Two is_current ChannelContribution rows exist with contribution_revenue_cents 18361653 (A_SEARCH) and 10123800 (B_SOCIAL)."
          setup_api_calls:
            - call: "POST /mmm/markets"
              payload: { market_code: "US_CORE", name: "US Core Brand Market", total_population: 10000000, annual_budget_ceiling_cents: 5000000000, currency_code: "USD" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { mkt: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "A_SEARCH", channel_type: "SEARCH", adstock_decay_rate: 0.50, adstock_max_lag_periods: 2, saturation_half_point_cents: 200000, response_ceiling_units: 1200, min_spend_cents: 200000, max_spend_cents: 3000000, status: "ACTIVE" }
              as: DataEngineer
              as_user_id: "de-1"
              captures: { cha: "$.data.id" }
            - call: "POST /mmm/media-channels"
              payload: { market_id: "${mkt}", channel_code: "B_SOCIAL", channel_type: "SOCIAL", adstock_decay_rate: 0.25, adstock_max_lag_periods: 1, saturation_half_point_cents: 150000, response_ceiling_units: 800, min_spend_cents: 100000, max_spend_cents: 3000000, status: "ACTIVE" }
