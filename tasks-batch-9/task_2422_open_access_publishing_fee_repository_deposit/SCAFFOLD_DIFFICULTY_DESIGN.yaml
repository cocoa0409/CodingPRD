            - call: "POST /fund-requests/${fr9_id}/info-requests"
              payload: { info_needed: "Confirm the author's remaining annual allowance." }
              as: ScholCommLibrarian
          trigger:
            - call: "POST /fund-requests/${fr9_id}/decision"
              payload: { decision: "APPROVE" }
              as: FundManager
              as_user_id: "fm-approver-01"
              captures: { err_state: $.data.error_id }
            - call: "POST /fund-requests/${fr9_id}/resubmissions"
              payload: { requested_cents: 300000, response_note: "Allowance confirmed as fully consumed." }
              as: CorrespondingAuthor
