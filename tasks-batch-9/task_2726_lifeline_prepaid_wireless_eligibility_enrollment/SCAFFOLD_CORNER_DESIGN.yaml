      - name: stale_provider_version_blocks_the_claim_draft
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.claim-draft-stale-provider
          - errors[ERR_STALE_PROVIDER_VERSION]
          - endpoints[POST /lifeline/reimbursement-claims]
        distinguishing_aspect: |
          A DRAFT is priced from carrier ledger figures, so the guard is on the Provider row:
          adding one handset to inventory - an operation with no monetary meaning - bumps
          Provider.version and invalidates a draft attempt carrying the earlier version
          (412, no claim row created, open_claim_count still 0). The re-read version then
          succeeds and prices June at 925 with variance still null.
        test_recipe:
          setup:
            - "Logical clock at 2026-07-02T00:00:00Z; one ACTIVE carrier licensed in TX with cap 50."
            - "One VOICE enrollment with an explicit benefit_start_date of 2026-06-01, still ACTIVE, so June contributes 30 support days."
          setup_api_calls:
            - call: "POST /lifeline/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-02T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /lifeline/providers"
              payload: { name: "SafeLink Wireless", spin_id: "143182", study_area_code: "489182", licensed_state_codes: ["TX"], enrollment_cap: 50 }
              as: ProgramAdministrator
              captures: { prov_id: $.data.id }
            - call: "POST /lifeline/addresses"
              payload: { address_line1: "1200 N Main St", city: "El Paso", state_code: "TX", postal_code: "79901" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { addr_id: $.data.id }
            - call: "POST /lifeline/subscribers"
              payload: { full_name: "Ana Ruiz", date_of_birth: "1980-04-11", last4_ssn: "4417", address_id: "${addr_id}", household_size: 4, annual_income_cents: 3000000, last_3mo_income_cents: 750000 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /lifeline/subscribers/${sub_id}/eligibility-checks"
              payload: { claimed_basis: "INCOME", proof_document_ref: "DOC-U2" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { chk_id: $.data.id }
            - call: "POST /lifeline/eligibility-checks/${chk_id}/verifier-result"
              payload: { verifier_outcome: "MATCH" }
              as: NationalVerifier
            - call: "POST /lifeline/enrollments"
              payload: { subscriber_id: "${sub_id}", provider_id: "${prov_id}", eligibility_check_id: "${chk_id}", certified_address_id: "${addr_id}", service_type: "VOICE", one_per_household_attested: true, benefit_start_date: "2026-06-01T00:00:00Z" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { enr_id: $.data.id }
            - call: "GET /lifeline/providers/${prov_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { ver_stale: $.data.version, open_before: $.data.open_claim_count }
            - call: "POST /lifeline/providers/${prov_id}/devices"
              payload: { imei: "350000000000121", model_tier: "BASIC", unit_cost_cents: 2100 }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { dev_id: $.data.id }
          trigger:
            - call: "POST /lifeline/reimbursement-claims"
              payload: { provider_id: "${prov_id}", service_month: "2026-06", expected_provider_version: "${ver_stale}" }
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /lifeline/providers/${prov_id}"
              payload: {}
              as: ProviderAgent
              as_user_id: "${prov_id}"
              captures: { ver_fresh: $.data.version }
            - call: "POST /lifeline/reimbursement-claims"
