# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe over entities / state machines / calculations / validations /
# endpoints / errors / rbac / cross-cutting layers. §1.8 covers the depth.
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: get_nonexistent_resident_returns_not_found
        claim_type: not_found
        grounds:
          - 'endpoints."GET /access/residents/{residentId}"'
          - 'errors[ERR_RESIDENT_NOT_FOUND]'
        distinguishing_aspect: "GET a residents/{id} with a well-formed but unknown UUID returns ERR_RESIDENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty community context (no resident with that id)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
          trigger:
            - call: "GET /access/residents/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_RESIDENT_NOT_FOUND"
            - "HTTP status == 404"

      - name: create_resident_missing_email_returns_validation
        claim_type: required_fields
        grounds:
          - 'endpoints."POST /access/residents"'
          - 'entities.Resident.fields.email'
          - 'errors[ERR_VALIDATION]'
        distinguishing_aspect: "POST /access/residents without the required email field returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["Community exists"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
          trigger:
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "No Email", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_VALIDATION"
            - "HTTP status == 400"

      - name: resident_callbox_code_minted_by_system
        claim_type: computed_fields
        grounds:
          - 'entities.Resident.fields.callbox_code'
          - 'endpoints."POST /access/residents"'
        distinguishing_aspect: "On resident creation the server mints callbox_code; it is present and non-null in the response regardless of client input."
        test_recipe:
          setup: ["Community exists"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
          trigger:
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Cal Callbox", email: "cal@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { code: $.data.callbox_code }
          assert:
            - "Resident.callbox_code is non-null and non-empty"
            - "Resident.status == ACTIVE"
            - "Resident.standing == GOOD"

      - name: resident_directory_listed_defaults_true
        claim_type: defaults
        grounds:
          - 'entities.Resident.fields.directory_listed'
        distinguishing_aspect: "Omitting directory_listed on creation yields directory_listed == true (declared default)."
        test_recipe:
          setup: ["Community exists"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
          trigger:
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Deb Default", email: "deb@x.com", resident_type: "TENANT" }
              as: CommunityAdmin
              captures: { listed: $.data.directory_listed }
          assert:
            - "Resident.directory_listed == true"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: withdraw_appeal_from_issued_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - 'state_machines.Violation.APPEALED_to_ISSUED'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "withdraw-appeal is only valid from APPEALED; calling it on an ISSUED violation returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Community + resident + one ISSUED violation"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Ida Issued", email: "ida@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "PARKING", base_fine_cents: 5000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /access/violations/${v_id}/withdraw-appeal"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_INVALID_STATE"

      - name: reactivate_movedout_resident_returns_invalid_state
        claim_type: terminal_lockdown
        grounds:
          - 'state_machines.Resident.terminal_states'
          - 'errors[ERR_INVALID_STATE]'
        distinguishing_aspect: "MOVED_OUT is terminal; transitioning a MOVED_OUT resident back to ACTIVE returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["Community + resident transitioned to MOVED_OUT"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Gone Gary", email: "gary@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/residents/${res_id}/transition"
              payload: { to_status: "MOVED_OUT" }
              as: CommunityAdmin
          trigger:
            - call: "POST /access/residents/${res_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_INVALID_STATE"

      - name: incident_lifecycle_reported_to_closed
        claim_type: valid_transition
        grounds:
          - state_machines.Incident.REPORTED_to_INVESTIGATING
          - state_machines.Incident.INVESTIGATING_to_RESOLVED
          - state_machines.Incident.RESOLVED_to_CLOSED
        distinguishing_aspect: "An incident advances REPORTED -> INVESTIGATING -> RESOLVED -> CLOSED through the transition endpoint."
        test_recipe:
          setup: ["Community + one REPORTED incident"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/incidents"
              payload: { community_id: "${comm_id}", incident_type: "NOISE", severity: "LOW", description: "Loud party at pool" }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { inc_id: $.data.id }
          trigger:
            - call: "POST /access/incidents/${inc_id}/transition"
              payload: { to_status: "INVESTIGATING" }
              as: CommunityAdmin
            - call: "POST /access/incidents/${inc_id}/transition"
              payload: { to_status: "RESOLVED" }
              as: CommunityAdmin
            - call: "POST /access/incidents/${inc_id}/transition"
              payload: { to_status: "CLOSED" }
              as: CommunityAdmin
          assert:
            - "Incident.${inc_id}.status == CLOSED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: guest_pass_estimated_fee_zero_rate
        claim_type: constants_applied
        grounds:
          - 'calculations.pass_fee'
          - 'entities.Pass.fields.estimated_fee_cents'
        distinguishing_aspect: "GUEST_HOURLY_CENTS is 0, so a GUEST pass authorized for any window has estimated_fee_cents == 0."
        test_recipe:
          setup: ["Community + clock 2026-06-01T08:00:00Z + resident + PENDING GUEST pass [09:00,11:00)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Free Fred", email: "fred@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/passes"
              payload: { sponsor_resident_id: "${res_id}", pass_type: "GUEST", visitor_name: "Free Guest", visitor_plate: "FREE01", valid_from: "2026-06-01T09:00:00Z", valid_until: "2026-06-01T11:00:00Z" }
              as: CommunityAdmin
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /access/passes/${pass_id}/authorize"
              payload: { decision: "APPROVED" }
              as: SecurityOfficer
          assert:
            - "Pass.${pass_id}.auth_status == APPROVED"
            - "Pass.${pass_id}.estimated_fee_cents == 0"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: missing_role_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=1]'
          - 'errors[ERR_UNAUTHENTICATED]'
        distinguishing_aspect: "A request with no/unknown X-User-Role is rejected with ERR_UNAUTHENTICATED (401) before any resource work."
        test_recipe:
          setup: ["Community exists"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
          trigger:
            - call: "GET /access/communities/${comm_id}"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_UNAUTHENTICATED"
            - "HTTP status == 401"

      - name: resolve_by_issuer_returns_segregation_of_duties
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=4]'
          - 'errors[ERR_SEGREGATION_OF_DUTIES]'
          - 'state_machines.Violation.APPEALED_to_UPHELD'
        distinguishing_aspect: "SoD: resolving an appealed violation while the acting X-User-ID equals Violation.issued_by_user_id returns ERR_SEGREGATION_OF_DUTIES (403)."
        test_recipe:
          setup: ["Community + resident + violation issued by user off-1 + appealed by resident"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Sod Sam", email: "sods@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "SPEEDING", base_fine_cents: 9000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v_id: $.data.id }
            - call: "POST /access/violations/${v_id}/appeal"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /access/violations/${v_id}/resolve"
              payload: { resolution: "UPHELD" }
              as: CommunityAdmin
              as_user_id: "off-1"
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_SEGREGATION_OF_DUTIES"
            - "HTTP status == 403"

      - name: pay_wrong_amount_returns_invalid_resolution
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=10]'
          - 'errors[ERR_INVALID_RESOLUTION]'
          - 'state_machines.Violation.ISSUED_to_PAID'
        distinguishing_aspect: "Paying a violation with amount_cents != assessed_fine_cents returns ERR_INVALID_RESOLUTION (422)."
        test_recipe:
          setup: ["Community + resident + ISSUED violation base 5000 (assessed 5000)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Pay Pat", email: "pat@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "PARKING", base_fine_cents: 5000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /access/violations/${v_id}/pay"
              payload: { amount_cents: 4000 }
              as: Resident
              as_user_id: "${res_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_INVALID_RESOLUTION"

      - name: pass_authorize_past_window_returns_window_invalid
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=8]'
          - 'errors[ERR_PASS_WINDOW_INVALID]'
          - 'state_machines.Pass.PENDING_to_APPROVED'
        distinguishing_aspect: "With an eligible (ACTIVE, GOOD) sponsor but a pass window entirely in the past, authorize APPROVED returns ERR_PASS_WINDOW_INVALID (422) — the temporal gate fired in isolation."
        test_recipe:
          setup: ["Community + clock 2026-06-05T00:00:00Z + ACTIVE resident + pass window [2026-06-01T09:00,13:00) (past)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T00:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Wanda Window", email: "wanda@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/passes"
              payload: { sponsor_resident_id: "${res_id}", pass_type: "GUEST", visitor_name: "Old Otto", visitor_plate: "OLD777", valid_from: "2026-06-01T09:00:00Z", valid_until: "2026-06-01T13:00:00Z" }
              as: CommunityAdmin
              captures: { pass_id: $.data.id }
          trigger:
            - call: "POST /access/passes/${pass_id}/authorize"
              payload: { decision: "APPROVED" }
              as: SecurityOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_PASS_WINDOW_INVALID"

      - name: book_nonreservable_amenity_returns_not_reservable
        claim_type: violation_to_error
        grounds:
          - 'validations[priority=10]'
          - 'errors[ERR_AMENITY_NOT_RESERVABLE]'
          - 'entities.Amenity.fields.reservable'
        distinguishing_aspect: "Booking against an amenity with reservable=false returns ERR_AMENITY_NOT_RESERVABLE (422)."
        test_recipe:
          setup: ["Community + resident + amenity with reservable=false"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Reba Reserve", email: "reba@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/amenities"
              payload: { community_id: "${comm_id}", name: "Gym", amenity_type: "GYM", capacity: 20, hourly_fee_cents: 0, deposit_cents: 0, open_hour: 5, close_hour: 23, reservable: false }
              as: CommunityAdmin
              captures: { amen_id: $.data.id }
          trigger:
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-10T10:00:00Z", end_at: "2026-06-10T11:00:00Z", party_size: 1 }
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_AMENITY_NOT_RESERVABLE"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: resident_creates_amenity_returns_unauthorized
        claim_type: unauthorized_role
        grounds:
          - 'roles.Resident'
          - 'endpoints."POST /access/amenities"'
          - 'errors[ERR_UNAUTHORIZED]'
        distinguishing_aspect: "POST /access/amenities is CommunityAdmin-exclusive; a Resident calling it gets ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Community + resident acting as themselves"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Rita Role", email: "rr@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /access/amenities"
              payload: { community_id: "${comm_id}", name: "Rogue Pool", amenity_type: "POOL", capacity: 5, hourly_fee_cents: 0, deposit_cents: 0, open_hour: 6, close_hour: 22 }
              as: Resident
              as_user_id: "${res_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_UNAUTHORIZED"
            - "HTTP status == 403"

      - name: resident_creates_vehicle_for_other_resident_returns_unauthorized
        claim_type: ownership_enforcement
        grounds:
          - 'roles.Resident'
          - 'endpoints."POST /access/vehicles"'
          - 'errors[ERR_UNAUTHORIZED]'
        distinguishing_aspect: "A Resident may only register vehicles for themselves (resident_id == X-User-ID); registering for another resident returns ERR_UNAUTHORIZED (403)."
        test_recipe:
          setup: ["Community + resident A (actor) + resident B (target)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Owner A", email: "a@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { resA_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Owner B", email: "b@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { resB_id: $.data.id }
          trigger:
            - call: "POST /access/vehicles"
              payload: { resident_id: "${resB_id}", plate: "MINE01", plate_state: "CA" }
              as: Resident
              as_user_id: "${resA_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_UNAUTHORIZED"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: list_residents_pagination_envelope
        claim_type: listing
        grounds:
          - 'endpoints."GET /access/residents"'
          - 'response_envelope.pagination_fields'
        distinguishing_aspect: "GET /access/residents with limit=1 over 2 residents returns 1 item with total_count=2 and has_more=true in the envelope."
        test_recipe:
          setup: ["Community + two residents"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "One One", email: "one@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Two Two", email: "two@x.com", resident_type: "TENANT" }
              as: CommunityAdmin
          trigger:
            - call: "GET /access/residents"
              payload: { community_id: "${comm_id}", limit: 1, offset: 0 }
              as: CommunityAdmin
          assert:
            - "response meta total_count == 2"
            - "response has_more == true"
            - "len(data) == 1"

      - name: list_vehicles_by_resident_reverse_lookup
        claim_type: retrieval
        grounds:
          - 'endpoints."GET /access/vehicles"'
          - 'entities.Vehicle.fields.resident_id'
        distinguishing_aspect: "GET /access/vehicles?resident_id=<id> returns exactly the vehicles owned by that resident (FK reverse-reachability)."
        test_recipe:
          setup: ["Community + resident + one vehicle"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Val Vehicle", email: "val@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/vehicles"
              payload: { resident_id: "${res_id}", plate: "FIND01", plate_state: "CA" }
              as: CommunityAdmin
              captures: { veh_id: $.data.id }
          trigger:
            - call: "GET /access/vehicles"
              payload: { resident_id: "${res_id}" }
              as: CommunityAdmin
          assert:
            - "data contains exactly 1 Vehicle with id == ${veh_id}"

      - name: violations_summary_report_aggregates
        claim_type: computed_read
        grounds:
          - 'endpoints."GET /access/communities/{communityId}/reports/violations-summary"'
          - 'calculations.violation_fine'
        distinguishing_aspect: "The violations-summary report returns open_count=1 and total_assessed_cents=6000 after one base-6000 ISSUED violation."
        test_recipe:
          setup: ["Community + resident + one ISSUED violation base 6000 (assessed 6000)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Reba Report", email: "rep@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "NOISE", base_fine_cents: 6000 }
              as: SecurityOfficer
              as_user_id: "off-1"
          trigger:
            - call: "GET /access/communities/${comm_id}/reports/violations-summary"
              payload: {}
              as: CommunityAdmin
              captures: { open_count: $.data.open_count }
          assert:
            - "report open_count == 1"
            - "report total_assessed_cents == 6000"

  # ---------------------------------------------------------------------------
  - section: cross_cutting
    instances:
      - name: decal_issue_stale_vehicle_version_returns_412
        claim_type: occ_stale_version
        grounds:
          - 'concurrency_rules[decal-issue-stale-vehicle]'
          - 'endpoints."POST /access/decals"'
          - 'errors[ERR_STALE_VERSION]'
        distinguishing_aspect: "Issuing a second decal with a stale expected_vehicle_version (the version observed before the first issuance bumped it) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Community + resident + vehicle (version observed as v0). One decal already issued with expected_vehicle_version=v0, bumping the vehicle version."]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Occ Owen", email: "occ@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/vehicles"
              payload: { resident_id: "${res_id}", plate: "OCC001", plate_state: "CA" }
              as: CommunityAdmin
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /access/decals"
              payload: { vehicle_id: "${veh_id}", tier: "RESIDENT", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z", expected_vehicle_version: "${veh_v0}" }
              as: CommunityAdmin
              captures: { decal1_id: $.data.id }
          trigger:
            - call: "POST /access/decals"
              payload: { vehicle_id: "${veh_id}", tier: "TEMPORARY", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z", expected_vehicle_version: "${veh_v0}" }
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_STALE_VERSION"
            - "HTTP status == 412"

      - name: decal_issue_supersedes_prior_active_decal
        claim_type: cascading_side_effects
        grounds:
          - 'endpoints."POST /access/decals"'
          - 'state_machines.Decal.ACTIVE_to_REVOKED'
          - 'concurrency_rules[decal-issue-stale-vehicle]'
        distinguishing_aspect: "Issuing a new decal with the CURRENT vehicle version supersedes the vehicle's prior ACTIVE decal (prior -> REVOKED) and the new decal is ACTIVE."
        test_recipe:
          setup: ["Community + resident + vehicle + one ACTIVE decal (vehicle version now v1)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Sue Supersede", email: "sup@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/vehicles"
              payload: { resident_id: "${res_id}", plate: "SUP001", plate_state: "CA" }
              as: CommunityAdmin
              captures: { veh_id: $.data.id, veh_v0: $.data.version }
            - call: "POST /access/decals"
              payload: { vehicle_id: "${veh_id}", tier: "RESIDENT", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z", expected_vehicle_version: "${veh_v0}" }
              as: CommunityAdmin
              captures: { decal1_id: $.data.id }
            - call: "GET /access/vehicles/${veh_id}"
              payload: {}
              as: CommunityAdmin
              captures: { veh_v1: $.data.version }
          trigger:
            - call: "POST /access/decals"
              payload: { vehicle_id: "${veh_id}", tier: "TENANT", valid_from: "2026-05-01T00:00:00Z", valid_until: "2027-05-01T00:00:00Z", expected_vehicle_version: "${veh_v1}" }
              as: CommunityAdmin
              captures: { decal2_id: $.data.id }
          assert:
            - "Decal.${decal1_id}.status == REVOKED"
            - "Decal.${decal2_id}.status == ACTIVE"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_amenity_at_capacity_covered
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_AMENITY_AT_CAPACITY]'
        excluded_because:
          difficulty_instance: resource_temporal_overlap / amenity_reservation_capacity_overlap_half_open
          rationale: "ERR_AMENITY_AT_CAPACITY is asserted as the trigger outcome of that §1.8 overlap instance."

      - name: error_sponsor_not_eligible_covered
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_SPONSOR_NOT_ELIGIBLE]'
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / pass_authorize_depends_on_sponsor_resident_state
          rationale: "ERR_SPONSOR_NOT_ELIGIBLE is asserted as the trigger outcome of that §1.8 instance."

      - name: error_vehicle_inactive_covered
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_VEHICLE_INACTIVE]'
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / decal_issue_depends_on_vehicle_state
          rationale: "ERR_VEHICLE_INACTIVE is asserted as the trigger outcome of that §1.8 instance."

      - name: error_patrol_overlap_covered
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_PATROL_OVERLAP]'
        excluded_because:
          difficulty_instance: resource_temporal_overlap / patrol_officer_buffer_overlap_closed
          rationale: "ERR_PATROL_OVERLAP is asserted as the trigger outcome of that §1.8 instance."

      - name: error_invalid_state_covered
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_INVALID_STATE]'
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_reservation_checkin
          rationale: "ERR_INVALID_STATE is asserted (as the winning error) in that §1.8 priority-pair instance; also re-covered by §1.9 withdraw_appeal_from_issued_returns_invalid_state."

      - name: error_reservation_window_invalid_present
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_RESERVATION_WINDOW_INVALID]'
          - 'state_machines.AmenityReservation.BOOKED_to_CHECKED_IN'
        distinguishing_aspect: "Checking in before the reservation window opens (clock < start_at) returns ERR_RESERVATION_WINDOW_INVALID (422)."
        test_recipe:
          setup: ["Community + clock 2026-06-08T08:00:00Z + resident + amenity + BOOKED reservation window [10:00,12:00)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-08T08:00:00Z" }
              as: CommunityAdmin
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Early Err", email: "early@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/amenities"
              payload: { community_id: "${comm_id}", name: "Court 2", amenity_type: "TENNIS", capacity: 4, hourly_fee_cents: 500, deposit_cents: 0, open_hour: 6, close_hour: 22 }
              as: CommunityAdmin
              captures: { amen_id: $.data.id }
            - call: "POST /access/amenity-reservations"
              payload: { amenity_id: "${amen_id}", resident_id: "${res_id}", start_at: "2026-06-08T10:00:00Z", end_at: "2026-06-08T12:00:00Z", party_size: 1 }
              as: CommunityAdmin
              captures: { resv_id: $.data.id }
          trigger:
            - call: "POST /access/amenity-reservations/${resv_id}/transition"
              payload: { to_status: "CHECKED_IN" }
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error envelope error_id == ERR_RESERVATION_WINDOW_INVALID"

      - name: error_resident_not_eligible_reinstate_present
        claim_type: violation_to_error
        grounds:
          - 'errors[ERR_RESIDENT_NOT_ELIGIBLE]'
          - 'state_machines.Resident.SUSPENDED_to_ACTIVE'
        distinguishing_aspect: "Reinstating a SUSPENDED resident whose outstanding_balance_cents is still >= threshold returns ERR_RESIDENT_NOT_ELIGIBLE (409)."
        test_recipe:
          setup: ["Community + resident issued a base-30000 violation (assessed 30000 >= 25000 -> auto-suspended, DELINQUENT, still owing)"]
          setup_api_calls:
            - call: "POST /access/communities"
              payload: { name: "Oakcrest" }
              as: CommunityAdmin
              captures: { comm_id: $.data.id }
            - call: "POST /access/residents"
              payload: { community_id: "${comm_id}", full_name: "Still Owing", email: "owe@x.com", resident_type: "OWNER" }
              as: CommunityAdmin
              captures: { res_id: $.data.id }
            - call: "POST /access/violations"
              payload: { community_id: "${comm_id}", resident_id: "${res_id}", violation_type: "GATE_TAILGATING", base_fine_cents: 30000 }
              as: SecurityOfficer
              as_user_id: "off-1"
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /access/residents/${res_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: CommunityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Resident.${res_id}.status == SUSPENDED"
            - "error envelope error_id == ERR_RESIDENT_NOT_ELIGIBLE"

