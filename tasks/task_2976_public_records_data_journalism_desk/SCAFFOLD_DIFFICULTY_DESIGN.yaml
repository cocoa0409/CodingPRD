            - call: "POST /records-desk/datasets"
              payload: { request_id: "${req_id}", investigation_id: "${inv_id}", name: "partial-release-inspections", negotiated_format: "CSV", expected_field_count: 1, sensitivity_tier: "CONFIDENTIAL" }
