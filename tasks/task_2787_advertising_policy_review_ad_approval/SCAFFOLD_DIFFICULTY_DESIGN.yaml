# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2787 — Advertising Policy Review & Ad Approval
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Every numeric literal in an
# assert: line was computed by executing the referenced §1.3 formula.
# The logical clock starts at 2026-08-01T00:00:00Z in every chain.
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: creative_risk_provisional_vs_final_diverge_across_cert_credit_and_mismatch_penalty
        grounds:
          - calculations.creative_risk_score
          - calculations.destination_check_result
          - entities.AdCreative.fields.risk_score_provisional
          - entities.AdCreative.fields.risk_score_final
          - entities.ScreeningRun.fields.provisional_risk_score
          - state_machines.AdCreative.destination_status.DESTINATION_PENDING_to_MISMATCH_FLAGGED
        distinguishing_aspect: |
          Dual variant on the AdCreative entity domain (per-creative risk scoring): the
          provisional_screening variant ignores destination evidence and certification
          credit, so for identical data it reads 7.20 while post_destination_final reads
          0.00 immediately after screening (credit dominates and the floor clamps) and
          14.20 after a host mismatch (penalty dominates) — the same row therefore
          carries two different scores at the same instant, in both directions.
        test_recipe:
          setup:
            - "One RESTRICTED policy rule ALC_SPIRITS (base_severity_weight 6.00, requires_certification true, requires_disclaimer true, auto 0.90, manual 0.55) with a US override at severity_multiplier 1.50."
            - "One advertiser verified on identity and business standing, holding an ACTIVE ALC_SPIRITS/US certification valid 2026-07-01 through 2027-01-01."
            - "One creative declaring ALC_SPIRITS, targeting US only, with a disclaimer, submitted and therefore in review_status SCREENING and destination_status DESTINATION_PENDING."
            - "Logical clock untouched at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, requires_disclaimer: true, severity_multiplier: 1.50 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Northline Spirits LLC", country_code: "US", industry_code: "ALCOHOL_RETAIL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "IDENTITY", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers/${adv_id}/verifications"
              payload: { dimension: "BUSINESS_STANDING", outcome: "VERIFIED" }
              as: PolicyAdmin
            - call: "POST /ad-policy/certifications"
              payload: { advertiser_id: "${adv_id}", policy_rule_id: "${alc_id}", license_number: "US-SPIRITS-4471", issuing_country_code: "US", valid_from: "2026-07-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z" }
              as: PolicyAdmin
              captures: { cert_id: "$.data.id", cert_status: "$.data.status" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Small-batch bourbon delivered", body_text: "Order our single-barrel bourbon online today.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.northline.example/bourbon", display_url: "https://www.northline.example/bourbon", disclaimer_text: "Drink responsibly. 21+" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${alc_id}", confidence: 0.80, matched_snippet: "single-barrel bourbon" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
              captures: { run_id: "$.data.id", run_prov: "$.data.provisional_risk_score" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${cr_id}/destination-checks"
              payload: { check_type: "INITIAL", user_agent_variant: "CRAWLER", fetched_final_url: "https://promo-partner.example/bourbon", fetched_content_category: "ALC_SPIRITS", http_status: 200 }
              as: IntegrityAnalyst
              captures: { chk_id: "$.data.id" }
            - call: "GET /ad-policy/ad-creatives/${cr_id}"
              payload: {}
              as: PolicyAdmin
          assert:
            - "Certification.${cert_id}.status == ACTIVE"
            - "ScreeningRun.${run_id}.outcome == ROUTED_MANUAL"
            - "ScreeningRun.${run_id}.provisional_risk_score == 7.20"
            - "After the screening run: AdCreative.${cr_id}.risk_score_provisional == 7.20"
            - "After the screening run: AdCreative.${cr_id}.risk_score_final == 0.00 (7.20 + 0.00 penalty - 8.00 certification credit, clamped at 0.00)"
            - "DestinationCheck.${chk_id}.result == MISMATCH"
            - "DestinationCheck.${chk_id}.mismatch_detail == HOST_MISMATCH"
            - "After the destination check: AdCreative.${cr_id}.destination_status == MISMATCH_FLAGGED"
            - "After the destination check: AdCreative.${cr_id}.risk_score_provisional == 7.20 (unchanged)"
            - "After the destination check: AdCreative.${cr_id}.risk_score_final == 14.20 (7.20 + 15.00 - 8.00)"
            - "AdCreative.${cr_id}.review_status == PENDING_MANUAL_REVIEW throughout"

      - name: advertiser_points_raw_vs_decayed_diverge_after_ninety_two_days
        grounds:
          - calculations.advertiser_violation_points
          - calculations.disapproval_points_assessment
          - entities.Advertiser.fields.violation_points_raw
          - entities.Advertiser.fields.violation_points_decayed
          - entities.ViolationLedgerEntry.fields.delta_points
          - state_machines.AdCreative.review_status.SCREENING_to_DISAPPROVED
        distinguishing_aspect: |
          Dual variant on the Advertiser entity domain (account-level points ledger, not
          per-creative risk): with one 9.60-point ledger entry aged 92 days, raw_cumulative
          reads 9.60 while decayed_enforcement reads 4.80, and only the decayed variant
          feeds enforcement — a different subject and a different divergence mechanism
          (age decay) from the certification-credit divergence of the AdCreative instance.
        test_recipe:
          setup:
            - "ALC_SPIRITS as above with a US override at 1.50 and an SE override with disposition BLOCKED at severity_multiplier 2.00."
            - "One advertiser with one creative declaring ALC_SPIRITS targeting SE and US."
            - "The creative is screened at confidence 0.95, which is at or above the 0.90 auto-disapprove threshold and whose strictest country disposition is BLOCKED, so the run auto-disapproves and writes one 9.60-point ledger entry at 2026-08-01T00:00:00Z."
            - "The logical clock is then advanced to 2026-11-01T00:00:00Z (92 days later) and the policy sweep is run."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, requires_disclaimer: true, severity_multiplier: 1.50 }
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "SE", disposition: "BLOCKED", severity_multiplier: 2.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Northline Spirits LLC", country_code: "US", industry_code: "ALCOHOL_RETAIL" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Nordic spirits sale", body_text: "Buy imported spirits with free shipping.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["SE", "US"], landing_page_url: "https://www.northline.example/nordic", display_url: "https://www.northline.example/nordic", disclaimer_text: "Drink responsibly. 21+" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${alc_id}", confidence: 0.95, matched_snippet: "imported spirits" }], expected_ad_creative_version: "${cr_v}" }
              as: PolicyAdmin
              captures: { run_id: "$.data.id" }
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
          trigger:
            - call: "POST /ad-policy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-01T00:00:00Z" }
              as: PolicyAdmin
            - call: "POST /ad-policy/_policy-sweeps/run"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}/violation-ledger-entries"
              payload: {}
              as: PolicyAdmin
          assert:
            - "ScreeningRun.${run_id}.outcome == AUTO_DISAPPROVED"
            - "ScreeningRun.${run_id}.provisional_risk_score == 11.40 (6.00 * 2.00 * 0.95)"
            - "Before the clock advance: Advertiser.${adv_id}.violation_points_raw == 9.60 and violation_points_decayed == 9.60"
            - "Before the clock advance: Advertiser.${adv_id}.severity_index == 9.60, which is below the 10.00 WARNING threshold, so zero EnforcementAction rows exist"
            - "The single ViolationLedgerEntry has delta_points == 9.60, reason == DISAPPROVAL_ASSESSED, balance_after == 9.60 and entry_index == 1"
            - "After the sweep at 2026-11-01T00:00:00Z: Advertiser.${adv_id}.violation_points_raw == 9.60 (unchanged)"
            - "After the sweep: Advertiser.${adv_id}.violation_points_decayed == 4.80 (9.60 * 0.50 at age 92 days)"
            - "After the sweep: Advertiser.${adv_id}.severity_index == 4.80"
            - "The sweep response reports expired_notices == 1 and decay_refreshed_advertisers == 1"
            - "Advertiser.${adv_id}.account_status == ACTIVE"

  - rule_id: combinatorial_formula
    instances:
      - name: priority_score_nested_max_over_severity_and_history_with_two_conditional_gaps
        grounds:
          - calculations.review_task_priority_score
          - calculations.screening_disposition
          - calculations.advertiser_violation_points
          - entities.ReviewTask.fields.priority_score
          - entities.ReviewTask.fields.sla_deadline_at
        distinguishing_aspect: |
          Mode (a): five inputs interacting non-linearly — a tiered base keyed on queue,
          two capped components combined by a nested max (not a sum), and two conditional
          gap terms. With severity_component 15.00 and history_component 10.00 the max
          yields 97.00; summing the two components would yield 107.00 capped to 100.00,
          so the nested max is directly observable.
        test_recipe:
          setup:
            - "Rules WEAPONS_FIREARMS (PROHIBITED, weight 12.00, auto 0.90, manual 0.50, sla 24), ALC_SPIRITS (RESTRICTED, weight 6.00, auto 0.90, manual 0.55, sla 48) and POLITICAL_ISSUE (REGULATED, weight 5.00, requires_disclaimer true, auto 0.95, manual 0.60, sla 12, default_queue POLITICAL)."
            - "Overrides: WEAPONS_FIREARMS/SE BLOCKED 2.00, WEAPONS_FIREARMS/US RESTRICTED_CERT_REQUIRED 1.00, ALC_SPIRITS/SE BLOCKED 2.00, ALC_SPIRITS/US RESTRICTED_CERT_REQUIRED 1.50, POLITICAL_ISSUE/US ALLOWED_WITH_DISCLAIMER 1.00."
            - "One advertiser with identity_status and business_standing_status left at PENDING."
            - "Three creatives are created while the account is still ACTIVE: crA (WEAPONS_FIREARMS, SE+US), crB (ALC_SPIRITS, SE+US) and crC (POLITICAL_ISSUE + ALC_SPIRITS, US only, political_flag true, disclaimer_text null)."
            - "crA then crB are screened into auto-disapproval, lifting violation_points_decayed to 28.80 and the account to RESTRICTED; crC is created before that so validations[priority=82] cannot block it."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "WEAPONS_FIREARMS", title: "Weapons and firearms", category_class: "PROHIBITED", base_severity_weight: 12.00, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.50, review_sla_hours: 24, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { wpn_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${wpn_id}/country-overrides"
              payload: { country_code: "SE", disposition: "BLOCKED", severity_multiplier: 2.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules/${wpn_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", severity_multiplier: 1.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "ALC_SPIRITS", title: "Alcohol - spirits", category_class: "RESTRICTED", base_severity_weight: 6.00, requires_certification: true, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.55, review_sla_hours: 48, default_queue: "REGULATED_CERT" }
              as: PolicyAdmin
              captures: { alc_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "SE", disposition: "BLOCKED", severity_multiplier: 2.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules/${alc_id}/country-overrides"
              payload: { country_code: "US", disposition: "RESTRICTED_CERT_REQUIRED", requires_license: true, requires_disclaimer: true, severity_multiplier: 1.50 }
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "POLITICAL_ISSUE", title: "Political and social issue advertising", category_class: "REGULATED", base_severity_weight: 5.00, requires_disclaimer: true, confidence_auto_disapprove_threshold: 0.95, confidence_manual_threshold: 0.60, review_sla_hours: 12, default_queue: "POLITICAL" }
              as: PolicyAdmin
              captures: { pol_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${pol_id}/country-overrides"
              payload: { country_code: "US", disposition: "ALLOWED_WITH_DISCLAIMER", severity_multiplier: 1.00 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Harbor Civic Media Inc", country_code: "US", industry_code: "POLITICAL_CONSULTING" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Range gear clearance", body_text: "Rifles and accessories at clearance prices.", declared_category_codes: ["WEAPONS_FIREARMS"], target_country_codes: ["SE", "US"], landing_page_url: "https://www.harborcivic.example/gear", display_url: "https://www.harborcivic.example/gear" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { crA_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Spirits gift boxes", body_text: "Premium spirits gift boxes shipped fast.", declared_category_codes: ["ALC_SPIRITS"], target_country_codes: ["SE", "US"], landing_page_url: "https://www.harborcivic.example/spirits", display_url: "https://www.harborcivic.example/spirits", disclaimer_text: "Drink responsibly. 21+" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { crB_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Vote yes on measure 4", body_text: "Our coalition urges a yes vote, sponsored with spirits industry support.", declared_category_codes: ["POLITICAL_ISSUE", "ALC_SPIRITS"], target_country_codes: ["US"], landing_page_url: "https://www.harborcivic.example/measure4", display_url: "https://www.harborcivic.example/measure4", political_flag: true }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { crC_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${crA_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { crA_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${crA_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${wpn_id}", confidence: 0.95, matched_snippet: "rifles and accessories" }], expected_ad_creative_version: "${crA_v}" }
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${crB_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { crB_v: "$.data.version" }
            - call: "POST /ad-policy/ad-creatives/${crB_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${alc_id}", confidence: 0.95, matched_snippet: "premium spirits" }], expected_ad_creative_version: "${crB_v}" }
              as: PolicyAdmin
            - call: "GET /ad-policy/advertisers/${adv_id}"
              payload: {}
              as: PolicyAdmin
            - call: "POST /ad-policy/ad-creatives/${crC_id}/submit"
              payload: {}
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { crC_v: "$.data.version" }
          trigger:
            - call: "POST /ad-policy/ad-creatives/${crC_id}/screening-runs"
              payload: { classifier_version: "clf-2026.07", decisions: [{ policy_rule_id: "${pol_id}", confidence: 0.70, matched_snippet: "urges a yes vote" }, { policy_rule_id: "${alc_id}", confidence: 0.60, matched_snippet: "spirits industry support" }], expected_ad_creative_version: "${crC_v}" }
              as: PolicyAdmin
              captures: { runC_id: "$.data.id" }
            - call: "GET /ad-policy/review-tasks"
              payload: { ad_creative_id: "${crC_id}" }
              as: PolicyAdmin
              captures: { taskC_id: "$.data[0].id", taskC_priority: "$.data[0].priority_score" }
          assert:
            - "Before the trigger: Advertiser.${adv_id}.violation_points_raw == 28.80 and violation_points_decayed == 28.80 (19.20 from crA plus 9.60 from crB)"
            - "Before the trigger: Advertiser.${adv_id}.account_status == RESTRICTED"
            - "ScreeningRun.${runC_id}.outcome == ROUTED_MANUAL"
            - "ScreeningRun.${runC_id}.provisional_risk_score == 8.90 (5.00 * 1.00 * 0.70 + 6.00 * 1.50 * 0.60)"
            - "ReviewTask.${taskC_id}.queue == POLITICAL"
            - "ReviewTask.${taskC_id}.primary_policy_rule_id == ${pol_id}"
            - "ReviewTask.${taskC_id}.priority_score == 97.00 (base 60.00 + max(15.00, 10.00) + 10.00 verification gap + 12.00 disclosure gap)"
            - "ReviewTask.${taskC_id}.priority_score != 100.00, proving the components are combined by max and not by sum"
            - "ReviewTask.${taskC_id}.sla_deadline_at == 2026-08-01T12:00:00Z"
            - "ReviewTask.${taskC_id}.cycle_count == 0 and status == QUEUED"

      - name: disapproval_assessment_rounds_each_line_before_summing
        grounds:
          - calculations.disapproval_points_assessment
          - entities.DisapprovalNotice.fields.assessment_lines
          - entities.DisapprovalNotice.fields.assessed_points
          - state_machines.AdCreative.review_status.PENDING_MANUAL_REVIEW_to_DISAPPROVED
          - state_machines.ReviewTask.status.CLAIMED_to_RESOLVED
        distinguishing_aspect: |
          Mode (b): the two finding lines are 4.6230 and 6.9230 before rounding. Rounding
          per line then summing gives 4.62 + 6.92 == 11.54; summing then rounding gives
          11.55. The scaffold pins round-per-line-then-sum, so assessed_points == 11.54
          and the alternative order is falsified by a single cent.
        test_recipe:
          setup:
            - "Rules TOBACCO_VAPE (RESTRICTED, weight 6.02, auto 0.90, manual 0.50, sla 48, default_queue STANDARD) and SUPPLEMENTS_CLAIMS (REGULATED, weight 4.02, auto 0.90, manual 0.50, sla 48, default_queue STANDARD), neither requiring certification."
            - "Both rules carry a DE override with disposition ALLOWED_WITH_DISCLAIMER and severity_multiplier 1.15."
            - "One advertiser with one creative declaring both codes and targeting DE only."
            - "One reviewer with queue_specialties [STANDARD] and country_authorizations [DE]."
            - "The creative is screened with both rules at confidence 0.60, routing it to the STANDARD queue, and the reviewer claims the task."
          setup_api_calls:
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "TOBACCO_VAPE", title: "Tobacco and vaping", category_class: "RESTRICTED", base_severity_weight: 6.02, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.50, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { tob_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${tob_id}/country-overrides"
              payload: { country_code: "DE", disposition: "ALLOWED_WITH_DISCLAIMER", severity_multiplier: 1.15 }
              as: PolicyAdmin
            - call: "POST /ad-policy/policy-rules"
              payload: { code: "SUPPLEMENTS_CLAIMS", title: "Supplement health claims", category_class: "REGULATED", base_severity_weight: 4.02, confidence_auto_disapprove_threshold: 0.90, confidence_manual_threshold: 0.50, review_sla_hours: 48, default_queue: "STANDARD" }
              as: PolicyAdmin
              captures: { sup_id: "$.data.id" }
            - call: "POST /ad-policy/policy-rules/${sup_id}/country-overrides"
              payload: { country_code: "DE", disposition: "ALLOWED_WITH_DISCLAIMER", severity_multiplier: 1.15 }
              as: PolicyAdmin
            - call: "POST /ad-policy/advertisers"
              payload: { legal_name: "Rheinvale Wellness GmbH", country_code: "DE", industry_code: "SUPPLEMENTS" }
              as: PolicyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /ad-policy/reviewers"
              payload: { display_name: "Rev Standard DE", queue_specialties: ["STANDARD"], country_authorizations: ["DE"], max_concurrent_claims: 3 }
              as: PolicyAdmin
              captures: { rev_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives"
              payload: { advertiser_id: "${adv_id}", headline: "Vape kits and immunity boosters", body_text: "Our vape kits and immunity boosters cure fatigue fast.", declared_category_codes: ["TOBACCO_VAPE", "SUPPLEMENTS_CLAIMS"], target_country_codes: ["DE"], landing_page_url: "https://www.rheinvale.example/kits", display_url: "https://www.rheinvale.example/kits" }
              as: Advertiser
              as_user_id: "${adv_id}"
              captures: { cr_id: "$.data.id" }
            - call: "POST /ad-policy/ad-creatives/${cr_id}/submit"
              payload: {}
              as: Advertiser
