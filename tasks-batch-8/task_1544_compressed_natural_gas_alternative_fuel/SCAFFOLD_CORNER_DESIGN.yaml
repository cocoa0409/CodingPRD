# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index for Non-Difficulty Tests
# (task_1544 CNG station). Breadth walk over §1.1–§1.7 per the claim-extraction
# guide. Default logical clock is 2026-08-01T00:00:00Z unless a recipe sets it.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: station_create_applies_defaults
        claim_type: defaults
        grounds: [entities.Station.fields.status, entities.Station.fields.uptime_posture]
        distinguishing_aspect: "A new station starts in SETUP with uptime_posture OUTAGE (no equipment yet), version 1, and a server-minted id."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /cng/stations", payload: { station_name: "Tango", station_code: "ST-TANGO", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id, st_status: $.data.status, st_posture: $.data.uptime_posture, st_ver: $.data.version } }
          assert:
            - "st_status == SETUP"
            - "st_posture == OUTAGE (zero compressors / zero dispensers)"
            - "st_ver == 1"
            - "Station.${st_id}.created_at == 2026-08-01T00:00:00Z (default logical clock)"

      - name: station_create_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=3]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required station_code yields ERR_INVALID_REQUEST (400) before any persistence."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /cng/stations", payload: { station_name: "NoCode", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: station_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["validations[priority=3]", entities.Station.fields.access_mode]
        distinguishing_aspect: "access_mode 'MIXED' is not in {PUBLIC, PRIVATE, DUAL} -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /cng/stations", payload: { station_name: "BadEnum", station_code: "ST-BAD", access_mode: "MIXED", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: station_list_pagination_envelope
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /cng/stations]"]
        distinguishing_aspect: "limit=2 over 3 stations returns exactly 2 rows with total_count 3 and has_more true; offset=2 returns the third."
        test_recipe:
          setup: ["Three stations exist"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "P1", station_code: "ST-PG1", access_mode: "PUBLIC", backup_capacity_gge: 1000 }, as: NetworkOperator }
            - { call: "POST /cng/stations", payload: { station_name: "P2", station_code: "ST-PG2", access_mode: "PUBLIC", backup_capacity_gge: 1000 }, as: NetworkOperator }
            - { call: "POST /cng/stations", payload: { station_name: "P3", station_code: "ST-PG3", access_mode: "PUBLIC", backup_capacity_gge: 1000 }, as: NetworkOperator }
          trigger:
            - { call: "GET /cng/stations?limit=2&offset=0", payload: {}, as: NetworkOperator }
            - { call: "GET /cng/stations?limit=2&offset=2", payload: {}, as: NetworkOperator }
          assert:
            - "First page: len(data) == 2, total_count == 3, has_more == true"
            - "Second page: len(data) == 1, total_count == 3, has_more == false"

      - name: station_create_with_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.Station, "validations[priority=3]"]
        distinguishing_aspect: "Client-supplied id/version/created_at in a create payload are ignored; the server mints its own."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /cng/stations", payload: { station_name: "SysFields", station_code: "ST-SYS", access_mode: "DUAL", backup_capacity_gge: 5000, id: "00000000-0000-4000-8000-0000000000ff", version: 99 }, as: NetworkOperator, captures: { st_id: $.data.id, st_ver: $.data.version } }
          assert:
            - "st_id != 00000000-0000-4000-8000-0000000000ff (server-minted)"
            - "st_ver == 1 (client version 99 ignored)"

      - name: calibration_record_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.CalibrationRecord]
        distinguishing_aspect: "CalibrationRecord has common_fields false: its GET exposes id and created_at but no version/updated_at, and no update endpoint exists."
        test_recipe:
          setup: ["Station with one dispenser"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Imm", station_code: "ST-IMM", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-1", fuel_type: "CNG" }, as: StationManager, captures: { d1: $.data.id } }
          trigger:
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${d1}", measured_error_pct: 0.10 }, as: StationManager, captures: { rec_id: $.data.id } }
            - { call: "GET /cng/calibration-records/${rec_id}", payload: {}, as: StationManager }
          assert:
            - "GET response contains id, created_at, dispenser_id, measured_error_pct, result == PASS, applied_correction_factor == 0.9"
            - "GET response contains no version and no updated_at key"

      - name: posture_computed_readback_on_condition_change
        claim_type: computed_fields
        grounds: [calculations.uptime_posture_derivation, entities.Station.fields.uptime_posture]
        distinguishing_aspect: "uptime_posture is recomputed on compressor report: OPERATIONAL after activation, DEGRADED after a DEGRADED condition report."
        test_recipe:
          setup: ["ACTIVE station with one ONLINE compressor and one IN_SERVICE dispenser"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Post", station_code: "ST-POST", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager, captures: { cmp_id: $.data.id } }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-1", fuel_type: "CNG" }, as: StationManager }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { p1: $.data.uptime_posture } }
          trigger:
            - { call: "POST /cng/compressors/${cmp_id}/report-condition", payload: { condition: "DEGRADED" }, as: StationManager }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: StationManager, captures: { p2: $.data.uptime_posture } }
          assert:
            - "p1 == OPERATIONAL"
            - "p2 == DEGRADED (one DEGRADED compressor present, none offline)"

      - name: monthly_settlement_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.MonthlySettlement]
        distinguishing_aspect: "MonthlySettlement has common_fields false: no version/updated_at; a second settle of the same month is the only 'update path' and it is rejected."
        test_recipe:
          setup:
            - "ACTIVE station + account + ACTIVE contract (span 2026-06..2026-12); no sessions so delivered is 0"
            - "Month 2026-07 already settled once"
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Setl", station_code: "ST-SETL", access_mode: "PRIVATE", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Settle Co", billing_email: "ap@setl.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/supply-contracts", payload: { fleet_account_id: "${acct_id}", station_id: "${st_id}", committed_monthly_gge: 100.0, contract_price_per_gge_cents: 275, shortfall_tier1_rate_cents: 30, shortfall_tier2_rate_cents: 55, start_month: "2026-06", end_month: "2026-12" }, as: NetworkOperator, captures: { contract_id: $.data.id } }
            - { call: "POST /cng/supply-contracts/${contract_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/supply-contracts/${contract_id}/settle-month", payload: { month: "2026-07" }, as: NetworkOperator, captures: { setl_id: $.data.id } }
          trigger:
            - { call: "GET /cng/monthly-settlements/${setl_id}", payload: {}, as: NetworkOperator }
          assert:
            - "GET response contains id, created_at, supply_contract_id, month == 2026-07, delivered_gge == 0.000, shortfall_gge == 100.000, penalty_cents == 5250"
            - "GET response contains no version and no updated_at key"

  - section: state_machines
    instances:
      - name: session_settled_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.FuelingSession, "errors[ERR_SESSION_NOT_VOIDABLE]", "errors[ERR_SESSION_NOT_COMPLETABLE]"]
        distinguishing_aspect: "A SETTLED session rejects both void (ERR_SESSION_NOT_VOIDABLE) and complete (ERR_SESSION_NOT_COMPLETABLE); no side effects fire."
        test_recipe:
          setup: ["ACTIVE station/account/card; one July session completed; clock advanced to 2026-08-01 so the sweep settles it"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Lock", station_code: "ST-LOCK", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Lock Co", billing_email: "ap@lock.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-L001", vehicle_plate: "2QRS345", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T12:00:00Z" }, as: NetworkOperator }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av1: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-L1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 25.0 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkOperator }
          trigger:
            - { call: "POST /cng/fueling-sessions/${s1}/void", payload: { reason: "CUSTOMER_REQUEST" }, as: FleetDriver, as_user_id: "${card_id}", captures: { err_void: $.data.error_id } }
            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 25.0 }, as: FleetDriver, as_user_id: "${card_id}", captures: { err_complete: $.data.error_id } }
          assert:
            - "FuelingSession.${s1}.status == SETTLED (sweep settled the July session)"
            - "err_void == ERR_SESSION_NOT_VOIDABLE"
            - "err_complete == ERR_SESSION_NOT_COMPLETABLE"
            - "FuelingSession.${s1}.total_amount_cents == 2815 (unchanged by the rejected operations)"

      - name: claim_approved_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.TaxCreditClaim, "errors[ERR_CLAIM_NOT_DECIDABLE]", "errors[ERR_CLAIM_NOT_REOPENABLE]"]
        distinguishing_aspect: "An APPROVED claim rejects a second decision and reopen; APPROVED is terminal."
        test_recipe:
          setup: ["Claim with one SETTLED July session, finalized, submitted, approved"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "CLock", station_code: "ST-CLOCK", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/calibration-records", payload: { dispenser_id: "${dsp_c}", measured_error_pct: 0.50 }, as: StationManager }
            - { call: "GET /cng/stations/${st_id}", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "CLock Co", billing_email: "ap@clock.example", credit_limit_cents: 1000000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-L002", vehicle_plate: "2QRS346", daily_gge_limit: 500.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-15T12:00:00Z" }, as: NetworkOperator }
            - { call: "GET /cng/fleet-accounts/${acct_id}", payload: {}, as: FleetDriver, as_user_id: "${card_id}", captures: { av1: $.data.version } }
            - { call: "POST /cng/fueling-sessions/authorize", payload: { fleet_card_id: "${card_id}", dispenser_id: "${dsp_c}", client_ref: "CR-CL1", estimated_gge: 20.0, expected_fleet_account_version: "${av1}" }, as: FleetDriver, as_user_id: "${card_id}", captures: { s1: $.data.id } }
            - { call: "POST /cng/fueling-sessions/${s1}/complete", payload: { metered_mass_kg: 26.0 }, as: FleetDriver, as_user_id: "${card_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: NetworkOperator }
            - { call: "POST /cng/tax-credit-claims", payload: { station_id: "${st_id}", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }, as: StationManager, captures: { claim_id: $.data.id } }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/finalize", payload: {}, as: StationManager }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/submit", payload: {}, as: ComplianceOfficer }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/decision", payload: { outcome: "APPROVED" }, as: NetworkOperator }
          trigger:
            - { call: "POST /cng/tax-credit-claims/${claim_id}/decision", payload: { outcome: "REJECTED" }, as: NetworkOperator, captures: { err1: $.data.error_id } }
            - { call: "POST /cng/tax-credit-claims/${claim_id}/reopen", payload: {}, as: StationManager, captures: { err2: $.data.error_id } }
          assert:
            - "err1 == ERR_CLAIM_NOT_DECIDABLE"
            - "err2 == ERR_CLAIM_NOT_REOPENABLE"
            - "TaxCreditClaim.${claim_id}.status == APPROVED (unchanged)"

      - name: card_revoked_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.FleetCard, "errors[ERR_CARD_ALREADY_REVOKED]"]
        distinguishing_aspect: "A REVOKED card rejects every further set-status (including back to ACTIVE) with ERR_CARD_ALREADY_REVOKED."
        test_recipe:
          setup: ["ACTIVE account with card FC-L003 ACTIVE"]
          setup_api_calls:
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "CardLock", billing_email: "ap@cardlock.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-L003", vehicle_plate: "2QRS347", daily_gge_limit: 100.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_id: $.data.id } }
            - { call: "POST /cng/fleet-cards/${card_id}/set-status", payload: { to_status: "REVOKED" }, as: FleetAccountManager, as_user_id: "${acct_id}" }
          trigger:
            - { call: "POST /cng/fleet-cards/${card_id}/set-status", payload: { to_status: "ACTIVE" }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_CARD_ALREADY_REVOKED"
            - "FleetCard.${card_id}.status == REVOKED"

      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.FleetCard, state_machines.MaintenanceWindow, state_machines.SupplyContract, state_machines.BackupFuelingArrangement, state_machines.SafetyInspection, state_machines.TaxCreditClaim]
        distinguishing_aspect: "Every stateful entity lands in its declared initial state on create: card ACTIVE, window SCHEDULED, contract DRAFT, backup RESERVED, inspection SCHEDULED, claim DRAFT."
        test_recipe:
          setup: ["ACTIVE station + account"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "Init", station_code: "ST-INIT", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager, captures: { cmp_id: $.data.id } }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Init Co", billing_email: "ap@init.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { acct_id: $.data.id } }
          trigger:
            - { call: "POST /cng/fleet-cards", payload: { fleet_account_id: "${acct_id}", card_number: "FC-IN01", vehicle_plate: "1AAA001", daily_gge_limit: 100.0 }, as: FleetAccountManager, as_user_id: "${acct_id}", captures: { card_status: $.data.status } }
            - { call: "POST /cng/maintenance-windows", payload: { station_id: "${st_id}", compressor_id: "${cmp_id}", starts_at: "2026-08-20T10:00:00Z", ends_at: "2026-08-20T12:00:00Z", window_type: "PREVENTIVE" }, as: StationManager, captures: { win_status: $.data.status } }
            - { call: "POST /cng/supply-contracts", payload: { fleet_account_id: "${acct_id}", station_id: "${st_id}", committed_monthly_gge: 50.0, contract_price_per_gge_cents: 275, shortfall_tier1_rate_cents: 30, shortfall_tier2_rate_cents: 55, start_month: "2026-08", end_month: "2026-12" }, as: NetworkOperator, captures: { con_status: $.data.status } }
            - { call: "POST /cng/backup-arrangements", payload: { station_id: "${st_id}", partner_station_code: "ST-PX", available_from: "2026-08-10T00:00:00Z", available_until: "2026-08-20T00:00:00Z", committed_gge: 500 }, as: StationManager, captures: { bak_status: $.data.status } }
            - { call: "POST /cng/safety-inspections", payload: { station_id: "${st_id}", inspection_type: "ANNUAL_COMPREHENSIVE", scheduled_for: "2026-08-20T10:00:00Z" }, as: StationManager, captures: { insp_status: $.data.status } }
            - { call: "POST /cng/tax-credit-claims", payload: { station_id: "${st_id}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }, as: StationManager, captures: { claim_status: $.data.status } }
          assert:
            - "card_status == ACTIVE"
            - "win_status == SCHEDULED"
            - "con_status == DRAFT"
            - "bak_status == RESERVED"
            - "insp_status == SCHEDULED"
            - "claim_status == DRAFT"

      - name: clock_sweep_session_timeout_voids_with_hold_release
        claim_type: invalid_transition
        grounds: [state_machines.FuelingSession.AUTHORIZED_to_VOIDED, "endpoints[POST /_clock/set_current_utc]"]
        distinguishing_aspect: "An AUTHORIZED session older than 30 minutes is auto-VOIDED with reason TIMEOUT by the clock sweep and its hold is released."
        test_recipe:
          setup: ["Standard ACTIVE station/account/card/policy; session authorized at 2026-08-01T00:00:00Z (default clock)"]
          setup_api_calls:
            - { call: "POST /cng/stations", payload: { station_name: "TO", station_code: "ST-TO", access_mode: "DUAL", backup_capacity_gge: 5000 }, as: NetworkOperator, captures: { st_id: $.data.id } }
            - { call: "POST /cng/compressors", payload: { station_id: "${st_id}", compressor_code: "CMP-1", capacity_scf_per_minute: 120 }, as: StationManager }
            - { call: "POST /cng/dispensers", payload: { station_id: "${st_id}", dispenser_code: "DSP-C", fuel_type: "CNG" }, as: StationManager, captures: { dsp_c: $.data.id } }
            - { call: "POST /cng/stations/${st_id}/activate", payload: {}, as: NetworkOperator, captures: { st_v: $.data.version } }
            - { call: "POST /cng/pricing-policies", payload: { station_id: "${st_id}", access_scope: "PRIVATE", fuel_type: "CNG", price_per_gge_cents: 289, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_station_version: "${st_v}" }, as: NetworkOperator }
            - { call: "POST /cng/fleet-accounts", payload: { account_name: "Timeout Co", billing_email: "ap@to.example", credit_limit_cents: 100000 }, as: NetworkOperator, captures: { acct_id: $.data.id, av1: $.data.version } }
