            - "BackupSet.${set_id}.state == SUSPENDED"
            - "BackupSet.${set2_id}.state == SUSPENDED"
            - "Account.${acct_id}.usage_gb == 3.0 (the suspended sets keep their stored volume)"

      - name: billing_period_get_with_unknown_id_returns_billing_period_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/backup-provider/billing-periods/{id}
          - errors.ERR_BILLING_PERIOD_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated billing-period id yields the entity-specific 404 ERR_BILLING_PERIOD_NOT_FOUND rather than a generic 400 or a 403."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One account exists but no billing period has been opened."
          setup_api_calls:
            - *clk
            - *acct
          trigger:
            - call: "GET /backup-provider/billing-periods/00000000-0000-4000-8000-0000000000aa"
              payload: {}
              as: SystemOperator
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_BILLING_PERIOD_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"
            - "GET /backup-provider/billing-periods?account_id=${acct_id} returns 0 rows"

      - name: restore_cancel_from_ready_returns_invalid_state
        claim_type: Conditional Action
        grounds:
          - endpoints.POST_/backup-provider/restore-requests/{id}/cancel
          - state_machines.RestoreRequest.READY_to_COMPLETED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "cancel is conditional on the request state: it succeeds from REQUESTED and VALIDATING but the same call against a READY request is refused, because once the payload is prepared the restore can only complete, fail or be reversed."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-03T00:00:00Z. PERSONAL account with an ACTIVE set holding a 10 GB file, no MFA policy requirement."
          setup_api_calls:
            - *clk
            - *acct
            - *grp
