scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: score_normalization_mode_divergence
    grounds:
    - calculations.score_normalization
    - calculations.composite_raw
    - entities.Score.fields.normalized_score
    distinguishing_aspect: Two scoring rounds over identical judge raw composites (80/60/94, 66/86/46, 68/54/74) produce different per-score normalized_score values
      and different entry composites purely because round Z uses Z_SCORE and round R uses RAW_RANK — a dual-variant split in the judging/scoring entity domain.
    test_recipe:
      setup:
      - Season OPEN then SUBMISSION_CLOSED with two PUBLISHED categories CAT_Z and CAT_R.
      - Each category has 3 ELIGIBLE-then-IN_JUDGING entries (same 3 entrants file in both).
      - 'Each category has a round-1 ScoringRound (Z: Z_SCORE, R: RAW_RANK), panel of 3 ACTIVE judges, both rounds OPEN then CLOSED with complete ballots whose raw
        composites are 80/60/94 (J1), 66/86/46 (J2), 68/54/74 (J3).'
      - Both rounds NORMALIZED.
      setup_api_calls:
      - call: POST /awards/_clock/set_current_utc
        as: ProgramAdmin
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
      - call: POST /awards/seasons
        as: ProgramAdmin
        payload:
          code: GALA-2026
          title: Gala 2026
          submission_opens_at: '2026-08-10T00:00:00Z'
          early_fee_ends_at: '2026-08-20T00:00:00Z'
          submission_closes_at: '2026-09-01T00:00:00Z'
          eligibility_window_start: '2026-01-01T00:00:00Z'
          eligibility_window_end: '2026-08-01T00:00:00Z'
          ceremony_scheduled_at: '2026-10-01T19:00:00Z'
          refund_policy: FLAT_FEE
        captures:
          season_id: $.data.id
          season_v: $.data.version
      - call: POST /awards/seasons/${season_id}/categories
        as: ProgramAdmin
        payload:
          code: CAT_Z
          name: CAT_Z
          min_materials: 1
          max_entries_per_entrant: 3
          panel_size: 3
          finalist_slots: 2
          scoring_rubric: &id001
          - criterion_code: CRAFT
            weight_bp: 6000
            max_score: 10
          - criterion_code: IMPACT
            weight_bp: 4000
            max_score: 5
          early_fee_cents: 10000
          standard_fee_cents: 15000
          late_fee_cents: 20000
        captures:
          cat_z: $.data.id
      - call: POST /awards/categories/${cat_z}/publish
        as: ProgramAdmin
        payload: {}
      - call: POST /awards/seasons/${season_id}/categories
