  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: student_immediate_enroll_without_records
        claim_type: valid_transition
        grounds: [state_machines.Student.INTAKE_to_ENROLLED, entities.Student.fields.records_received]
        distinguishing_aspect: "A student with records_received=false enrolls INTAKE->ENROLLED (McKinney-Vento immediate enrollment), records are not a precondition."
        test_recipe:
          setup: ["Intake student, records_received=false."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "Imm", last_name: "Ediate", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "UNSHELTERED", records_received: false }
              as: Registrar
              captures: { s1: $.data.id }
          trigger:
            - call: "POST /mv/students/${s1}/enroll"
              payload: {}
              as: Registrar
          assert:
            - "Student.${s1}.status == ENROLLED"

      - name: plan_approve_from_draft_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.TransportationPlan.PROPOSED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Approving a plan still in DRAFT (never submitted) returns 409 ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A DRAFT plan for an eligible student."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "Dr", last_name: "Aft", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "SHELTER", decision: "ELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/transportation-plans"
              payload: { student_id: "${s1}", origin_district_id: "${d1}", serving_district_id: "${d1}", route_miles: 20 }
              as: StateCoordinator
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /mv/transportation-plans/${p1}/approve"
              payload: {}
              as: StateCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "TransportationPlan.${p1}.status == DRAFT"

      - name: student_enroll_twice_idempotency_rejected
        claim_type: idempotency
        grounds: ["state_machines.Student.INTAKE_to_ENROLLED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Enrolling an already-ENROLLED student a second time returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["An ENROLLED student."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "En", last_name: "Roll", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: Registrar
              captures: { s1: $.data.id }
            - call: "POST /mv/students/${s1}/enroll"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /mv/students/${s1}/enroll"
              payload: {}
              as: Registrar
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: dispute_resolve_after_terminal_invalid_state
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_DENIED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Resolving a dispute already in terminal RESOLVED_DENIED returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup: ["A dispute resolved DENIED."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "Di", last_name: "Spute", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id }
            - call: "POST /mv/disputes"
              payload: { student_id: "${s1}", dispute_type: "TRANSPORT", description: "Route too far" }
              as: StateCoordinator
              captures: { dsp1: $.data.id }
            - call: "POST /mv/disputes/${dsp1}/begin-review"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/disputes/${dsp1}/resolve"
              payload: { outcome: "DENIED" }
              as: StateCoordinator
          trigger:
            - call: "POST /mv/disputes/${dsp1}/resolve"
              payload: { outcome: "UPHELD" }
              as: StateCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "Dispute.${dsp1}.status == RESOLVED_DENIED"

      - name: dispute_resolve_upheld_restores_eligibility
        claim_type: side_effect_execution
        grounds:
          - state_machines.Dispute.UNDER_REVIEW_to_RESOLVED_UPHELD
          - entities.Student.fields.eligibility_status
          - entities.BenefitLink.fields.status
        distinguishing_aspect: "Resolving a dispute UPHELD for a previously INELIGIBLE student sets Student.eligibility_status=ELIGIBLE and creates an ACTIVE BenefitLink."
        test_recipe:
          setup: ["Student determined INELIGIBLE, then dispute filed and moved to UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "Up", last_name: "Held", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "DOUBLED_UP" }
              as: StateCoordinator
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /mv/students/${s1}/eligibility-determinations"
              payload: { category: "HOMELESS", basis: "DOUBLED_UP", decision: "INELIGIBLE", effective_date: "2026-05-01", expected_student_version: "${s1_v}" }
              as: StateCoordinator
              captures: { det1: $.data.id }
            - call: "POST /mv/eligibility-determinations/${det1}/finalize"
              payload: {}
              as: StateCoordinator
            - call: "POST /mv/disputes"
              payload: { student_id: "${s1}", dispute_type: "ELIGIBILITY", description: "Should be eligible" }
              as: StateCoordinator
              captures: { dsp1: $.data.id }
            - call: "POST /mv/disputes/${dsp1}/begin-review"
              payload: {}
              as: StateCoordinator
          trigger:
            - call: "POST /mv/disputes/${dsp1}/resolve"
              payload: { outcome: "UPHELD" }
              as: StateCoordinator
          assert:
            - "Dispute.${dsp1}.status == RESOLVED_UPHELD"
            - "Student.${s1}.eligibility_status == ELIGIBLE"
            - "District.${d1}.categorical_eligible_count == 1"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: trip_create_on_draft_plan_not_active
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_PLAN_NOT_ACTIVE]"]
        distinguishing_aspect: "Creating a trip against a plan still in DRAFT (never activated) returns 409 ERR_PLAN_NOT_ACTIVE (isolated, no other violation)."
        test_recipe:
          setup: ["Eligible student, a DRAFT plan, an IN_SERVICE vehicle."]
          setup_api_calls:
            - call: "POST /mv/districts"
              payload: { name: "D1", nces_code: "0601", transport_budget_cents: 100000000 }
              as: StateCoordinator
              captures: { d1: $.data.id }
            - call: "POST /mv/students"
              payload: { first_name: "Na", last_name: "Ta", birthdate: "2012-01-01", enrolled_district_id: "${d1}", origin_district_id: "${d1}", living_situation: "SHELTER" }
              as: StateCoordinator
              captures: { s1: $.data.id }
            - call: "POST /mv/transportation-plans"
              payload: { student_id: "${s1}", origin_district_id: "${d1}", serving_district_id: "${d1}", route_miles: 20 }
              as: StateCoordinator
              captures: { p1: $.data.id }
            - call: "POST /mv/vehicles"
              payload: { serving_district_id: "${d1}", label: "Bus1", capacity_students: 24 }
              as: StateCoordinator
              captures: { veh1: $.data.id }
          trigger:
            - call: "POST /mv/trip-assignments"
              payload: { transportation_plan_id: "${p1}", vehicle_id: "${veh1}", scheduled_start: "2026-05-04T08:00:00Z", scheduled_end: "2026-05-04T08:30:00Z" }
              as: StateCoordinator
              captures: { err: $.data.error_id }
          assert:
