          setup:
            - "Logical clock at 2026-08-01T08:00:00Z"
            - "Facility with compliance_posture OPEN and observation_bed_count 2"
            - "ACTIVE CARDIAC transfer agreement at capability_tier 3 accepting unstable patients, window 2026-07-01..2026-12-31"
            - "ACTIVE ambulance MOU with level_of_care CRITICAL_CARE, units_committed 2, coverage window 2026-07-01T00:00:00Z .. 2026-12-31T00:00:00Z"
            - "One encounter, acuity 4 CARDIAC, DISCLOSURE_ACKNOWLEDGED, screened STABLE, then admitted to OBSERVATION so observation_bed_held is true"
