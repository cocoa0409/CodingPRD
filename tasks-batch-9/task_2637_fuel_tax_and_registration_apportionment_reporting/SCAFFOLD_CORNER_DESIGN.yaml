              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { v1_id: $.data.id }
          trigger:
            - call: "GET /apportionment/vehicles/${v1_id}"
              payload: {}
              as: CarrierAdmin
              as_user_id: "${c2_id}"
            - call: "GET /apportionment/vehicles/${v1_id}"
              payload: {}
              as: MileageAnalyst
              as_user_id: "analyst-1"
            - call: "GET /apportionment/vehicles/${v1_id}"
              payload: {}
              as: TaxPreparer
              as_user_id: "preparer-1"
            - call: "GET /apportionment/vehicles/${v1_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "All four reads return HTTP 200 with body.data.id == ${v1_id} and identical payloads"
            - "Each response carries body.meta.api_request_id"
