      - name: applied_override_price_still_takes_the_nine_ending_branch
        claim_type: tiered_pricing
        grounds:
          - calculations.effective_zone_price.formula
          - state_machines.PriceChangeRequest.APPROVED_to_APPLIED
          - entities.MenuItem.fields.zone_price_overrides
        distinguishing_aspect: "The override branch of the price basis skips the multiplier but NOT the psychological rule: applying an approved proposal of 580 in ZONE_A stores 589, not the raw 580 and not 638 (the multiplier wrongly re-applied to an override)."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; ZONE_A (x1.10, NINE_ENDING, cap 1500) and Item A (base 500, effective 559) exist."
            - "A PriceChangeRequest proposes 580 for Item A in ZONE_A — uplift 376 bp, so required_approvals is 1."
            - "Cluster CL_ZONE and store S001 put at least one Store in this price zone, which validation priority 32 (ERR_PRICE_ZONE_MISMATCH) requires before any PriceChangeRequest may name it."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
            - call: "POST /kiosk-ops/price-zones"
              payload: { zone_code: "ZONE_A", currency_code: "USD", price_multiplier_bp: 11000, psychological_rounding: "NINE_ENDING", tax_rate_bp: 875, max_uplift_bp: 1500 }
              as: PlatformAdmin
              captures: { zone_a_id: $.data.id }
            # a Store must reference this zone before a PriceChangeRequest may name it (validation priority 32)
            - call: "POST /kiosk-ops/store-clusters"
              payload: { cluster_code: "CL_ZONE", tier: "REGION" }
              as: ContentManager
              captures: { zone_cluster_id: $.data.id }
            - call: "POST /kiosk-ops/stores"
              payload: { store_code: "S001", cluster_id: "${zone_cluster_id}", price_zone_id: "${zone_a_id}", timezone_offset_minutes: -300, accessibility_certified_until_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { zone_store_id: $.data.id }
            - call: "POST /kiosk-ops/menu-items"
              payload: { sku: "SKU-BURGER", display_name: "Classic Burger", category: "ENTREE", base_price_cents: 500, screen_reader_text: "Classic burger", contrast_ratio: 7.1 }
              as: ContentManager
              captures: { item_a_id: $.data.id, item_a_ver: $.data.version, overrides_before: $.data.zone_override_total_cents }
            - call: "POST /kiosk-ops/price-change-requests"
              payload: { menu_item_id: "${item_a_id}", price_zone_id: "${zone_a_id}", proposed_price_cents: 580, justification: "Beef cost", effective_from_utc: "2026-08-05T17:00:00Z", expected_menu_item_version: "${item_a_ver}" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { pcr_id: $.data.id, baseline: $.data.baseline_price_cents, up_bp: $.data.uplift_bp, req: $.data.required_approvals }
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "SUBMIT" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPROVE", comment: "Approved" }
              as: PricingApprover
              as_user_id: "u_approver_1"
              captures: { approved_state: $.data.state }
          trigger:
            - call: "POST /kiosk-ops/price-change-requests/${pcr_id}/actions"
              payload: { action: "APPLY" }
              as: PricingAnalyst
              as_user_id: "u_analyst_1"
              captures: { applied_state: $.data.state, applied_price: $.data.applied_price_cents }
            - call: "GET /kiosk-ops/menu-items/${item_a_id}"
              payload: {}
              as: PricingAnalyst
              captures: { override_total: $.data.zone_override_total_cents, lock: $.data.pricing_lock_state }
          assert:
            - "${overrides_before} == 0, ${baseline} == 559, ${up_bp} == 376 (21 / 559 = 375.67 rounded half up) and ${req} == 1"
            - "${approved_state} == APPROVED after a single approval"
            - "HTTP 200 with ${applied_state} == APPLIED and ${applied_price} == 589 — NINE_ENDING lifts 580 to 589"
            - "MenuItem.${item_a_id}.zone_price_overrides holds one entry for ${zone_a_id} with price_cents 589 and ${override_total} == 589"
            - "the override is NOT re-multiplied: a later effective_zone_price read for ZONE_A returns 589, not 648"
            - "AuditEvent with action PRICE_APPLIED records before_value_cents 559 and after_value_cents 589"

