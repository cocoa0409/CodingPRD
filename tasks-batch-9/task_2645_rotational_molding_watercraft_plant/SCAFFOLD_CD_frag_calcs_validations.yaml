            - call: "POST /finished-units/${fu1}/store"
              payload: { expected_warehouse_version: "${wh_v1}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /production-orders/${po_b}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /production-orders/${po_a}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "GET /warehouses/${wh}"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
              captures: { wh_v2: $.data.version }
            - call: "POST /finished-units/${fu2}/store"
              payload: { expected_warehouse_version: "${wh_v2}" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "POST /finished-units/${fu1}/release-storage"
              payload: { release_reason: "site frozen in error, hull pulled back to the line" }
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /warehouses/${wh}/footprint-summary"
              payload: {}
              as: LogisticsPlanner
              as_user_id: "planner-1"
            - call: "GET /production-orders/${po_b}"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
          assert:
            - "after the first store FinishedUnit.${fu1}.stored_footprint_cube_m3 == 10.0000 with is_zone_anchor == true — the ANCHOR_PLACEMENT variant charges the full gross cube, not the nested 5.0000"
            - "Warehouse.${wh}.committed_cube_m3 == 10.0000, utilization_pct == round(10.0000 / 10.0000 * 100, 2) == 100.00 and posture == FROZEN, since 100.00 >= frozen_threshold_pct 95.00"
            - "the two consecutive footprint-summary reads are byte-identical: zones[0] shows zone_code Z-J with committed 10.0000, remaining 0.0000, stored_unit_count 1 and anchor_product_model_ids containing ${pm}, and blocked_production_order_count == 1 in both — the propagation reached a fixed point and reading it does not advance it"
            - "ProductionOrder.${po_b}.status == BLOCKED_WAREHOUSE with blocked_reason == WAREHOUSE_FROZEN — CASCADE-H link 4 reached the order that merely targets the site"
            - "ProductionOrder.${po_a}.status == COMPLETE and blocked_reason == null — link 4 only sweeps READY_TO_SCHEDULE and IN_PRODUCTION orders, so the order that produced the freezing hull is untouched"
            - "the store of ${fu2} fails 422 ERR_NO_ELIGIBLE_ZONE — with an anchor present its candidate_footprint is the nested round(10.0000 * 0.5000, 4) = 5.0000, and remaining_after = 10.0000 - 10.0000 - 5.0000 = -5.0000 which fails the >= 0.0000 eligibility test; nesting shrinks the demand but cannot make it fit"
            - "after release-storage the third footprint-summary reports committed 0.0000, remaining 10.0000, stored_unit_count 0, an empty anchor_product_model_ids and blocked_production_order_count 0, and Warehouse.${wh}.utilization_pct == 0.00 with posture NORMAL"
            - "no anchor promotion occurred on that release because ${fu2} was never admitted, so the site's committed cube fell by the departing unit's full 10.0000"
            - "ProductionOrder.${po_b}.status is back to READY_TO_SCHEDULE with blocked_reason == null — CASCADE-C link 4 ran the propagation in reverse inside the release-storage request"

