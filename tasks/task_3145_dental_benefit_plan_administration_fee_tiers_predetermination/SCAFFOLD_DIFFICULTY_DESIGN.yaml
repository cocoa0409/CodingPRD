      - name: claim_branching_denied_path_and_paid_then_void_revert
        grounds:
          - state_machines.Claim.ADJUDICATED_to_DENIED
          - state_machines.Claim.PAID_to_VOID
          - state_machines.ClaimLine.PRICED_to_DENIED
        distinguishing_aspect: |
          Entity = Claim. Branching: an adjudicated claim forks to DENIED when
          every line is denied vs PAID when at least one line is payable, and
          the PAID branch supports a revert (PAID → VOID) that unwinds the
          accumulator — two divergent branches plus a backward edge.
        test_recipe:
