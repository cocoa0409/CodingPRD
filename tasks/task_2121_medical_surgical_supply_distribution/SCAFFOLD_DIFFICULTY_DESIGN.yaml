            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_z_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
          assert:
            - "${err} == ERR_CONTRACT_PERIOD_OVERLAP with HTTP 409"
            - "GpoContract.${ctr_y_id}.status == PENDING_ACTIVATION and activated_at == null"
            - "GpoContract.${ctr_z_id}.status == ACTIVE and activated_at == 2026-09-01T00:00:00.000Z"
            - "ContractLine.${cl_z_id}.activation_state == ACTIVE"
            - "GpoContract.${ctr_x_id}.status == ACTIVE - CTR-Z did not supersede it because their closed intervals do not intersect"

