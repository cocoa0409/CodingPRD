              as: CoopAdmin
              captures: { s1: "$.data.id" }
            - call: "POST /coop/seasons/${s1}/open"
              payload: {}
              as: CoopAdmin
            - call: "GET /coop/quotas"
              payload: { member_id: "${m1}", season_id: "${s1}" }
              as: CoopAdmin
              captures: { q1: "$.data[0].id", q1_v: "$.data[0].version" }
            - call: "PATCH /coop/quotas/${q1}"
              payload: { base_quota_barrels: 100, expected_quota_version: "${q1_v}" }
              as: CoopAdmin
            - call: "POST /coop/stations"
              payload: { name: "Station A", daily_capacity_barrels: 5000 }
              as: CoopAdmin
              captures: { st1: "$.data.id" }
            - call: "POST /coop/pools"
              payload: { season_id: "${s1}", code: "MAIN", provisional_advance_rate_per_barrel: 0.50, retain_pct: 0.20 }
              as: PoolManager
              captures: { p1: "$.data.id" }
            - call: "POST /coop/deliveries"
              payload: { season_id: "${s1}", bog_id: "${b1}", receiving_station_id: "${st1}", scheduled_date: "2026-10-10", expected_barrels: 150 }
              as: GrowerMember
              as_user_id: "${m1}"
              captures: { d1: "$.data.id" }
            - call: "POST /coop/deliveries/${d1}/receive"
              payload: { gross_barrels: 150, tare_barrels: 50 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/grade"
              payload: { color_score: 7.5, firmness_score: 7.0, foreign_matter_pct: 3.0 }
              as: StationOperator
              as_user_id: "${st1}"
            - call: "POST /coop/deliveries/${d1}/accept"
              payload: {}
              as: PoolManager
          trigger:
            - call: "POST /coop/deliveries/${d1}/accept"
              payload: {}
              as: PoolManager
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_INVALID_STATE (state priority 5 beats business_fiscal priority 9)"
            - "Delivery.${d1}.status remains ACCEPTED (no state change, no double quota credit)"
            - "MemberQuota.delivered_barrels remains 100"

      - name: ticket_create_temporal_error_beats_overlap_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_WINDOW_OUTSIDE_SEASON]
          - errors[ERR_HARVEST_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_constraint: the new
          ticket window [2026-10-04, 2026-11-20] both overlaps an APPROVED
          ticket on the same bog (constraint) AND extends past the season
          harvest end 2026-11-15 (temporal); the temporal error
          ERR_WINDOW_OUTSIDE_SEASON (priority 6) must win over
          ERR_HARVEST_WINDOW_OVERLAP (priority 7).
        test_recipe:
          setup:
            - "Member ACTIVE, ACTIVE bog, season 2026 OPEN (window 2026-09-15..2026-11-15)"
            - "Ticket T1 [2026-10-01T00:00Z, 2026-10-05T00:00Z) DRY, APPROVED"
