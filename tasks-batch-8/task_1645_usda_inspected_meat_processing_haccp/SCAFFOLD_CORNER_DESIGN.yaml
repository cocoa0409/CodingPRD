  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: qa_tech_cannot_approve_plan_returns_forbidden
        claim_type: role_exclusive_denied
        grounds: [roles.Inspector, "errors[ERR_FORBIDDEN_ROLE]", "validations[priority=2]"]
        distinguishing_aspect: "approve is Inspector-exclusive; QATech is denied even on a correctly SUBMITTED plan."
        test_recipe:
          setup: ["plant; plan with one CCP, SUBMITTED"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-40", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
            - { call: "POST /plants/${plant_id}/haccp-plans", payload: { process_type: "RAW_GROUND" }, as: QAManager, captures: { plan_id: $.data.id } }
            - { call: "POST /haccp-plans/${plan_id}/ccps", payload: { ccp_code: "CCP-1B", hazard_category: "BIOLOGICAL", description: "Chill cooler", critical_limit_max_f: 40.0, monitoring_frequency_minutes: 60 }, as: QAManager }
            - { call: "POST /haccp-plans/${plan_id}/submit", payload: {}, as: QAManager }
          trigger:
            - { call: "POST /haccp-plans/${plan_id}/approve", payload: {}, as: QATech, as_user_id: "qa-tech-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and HTTP status == 403"
            - "GET /haccp-plans/${plan_id} status remains SUBMITTED"

      - name: production_manager_cannot_report_sample_result_returns_forbidden
        claim_type: role_exclusive_denied
        grounds: [roles.LabAnalyst, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "report-result is LabAnalyst-exclusive; the role check (priority 2) fires even before existence (priority 5), so a ProductionManager gets 403 on any sample id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /pathogen-samples/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/report-result", payload: { result: "NEGATIVE" }, as: ProductionManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and HTTP status == 403 (not 404 — role denial precedes existence)"

      - name: inspector_cannot_create_lots_returns_forbidden
        claim_type: role_exclusive_denied
        grounds: [roles.ProductionManager, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "lot creation is ProductionManager-exclusive; an Inspector is denied with 403 even before the parent day is resolved."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /production-days/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2/lots", payload: { species: "BOVINE", supplier_name: "Verde Farms", head_count: 10, live_weight_lbs: 12500 }, as: Inspector, as_user_id: "insp-01", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FORBIDDEN_ROLE and HTTP status == 403"

      - name: missing_auth_headers_returns_unauthenticated
        claim_type: role_exclusive_denied
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Requests without X-User-Role/X-User-ID are rejected 401 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-41", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: "Anonymous", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_UNAUTHENTICATED and HTTP status == 401"

      - name: get_endpoints_are_shared_across_all_roles
        claim_type: shared_operation_allowed
        grounds: [roles]
        distinguishing_aspect: "Read access is shared: every declared role can GET plant and list resources."
        test_recipe:
          setup: ["plant registered"]
          setup_api_calls:
            - { call: "POST /plants", payload: { establishment_number: "EST-1645-42", name: "Prairie Packing", district_code: "D25", cooler_capacity_lbs: 10000 }, as: PlantAdmin, captures: { plant_id: $.data.id } }
          trigger:
            - { call: "GET /plants/${plant_id}", as: LabAnalyst, captures: { est: $.data.establishment_number } }
            - { call: "GET /haccp-plans?plant_id=${plant_id}", as: QATech }
            - { call: "GET /noncompliance-records?plant_id=${plant_id}", as: Inspector, as_user_id: "insp-01" }
          assert:
            - "LabAnalyst GET /plants/{id} returns 200 with establishment_number == EST-1645-42"
            - "QATech GET /haccp-plans returns 200 (empty list)"
            - "Inspector GET /noncompliance-records returns 200 (empty list)"

