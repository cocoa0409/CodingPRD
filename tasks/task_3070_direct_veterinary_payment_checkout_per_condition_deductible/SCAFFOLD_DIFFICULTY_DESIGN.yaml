# =============================================================================
# §1.8 Scaffold Difficulty Design — task_3070 Direct Vet Payment
# Two instances per §0.5 rule (18 total). Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and is reproducible from empty-DB via §1.5 calls.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: premium_enrollment_base_vs_age_band_recalc
        grounds:
          - calculations.monthly_premium
          - entities.Policy.fields.current_monthly_premium_cents
          - entities.Policy.fields.filed_base_cents
          - endpoints.POST_/vetpay/policies/{policyId}/recalculate-premium
        distinguishing_aspect: |
          Two valid variants of the same premium formula read different
          baselines: enrollment_base freezes the filing as of coverage_start
          (filed_base_cents), while age_band_recalc re-selects the newest
          EFFECTIVE filing as of the current date — after F2 supersedes F1,
          identical pet/territory data yields 100000 at enrollment and
          110250 at recalc (110000 x band-1 multiplier 1.0025 with
          round_half_up), and filed_base_cents provably stays 100000.
        test_recipe:
          setup:
            - "Filing F1 (territory 941, DOG, base 100000, bands {\"0\": 1.0, \"1\": 1.0025}, effective 2026-09-01) FILED then EFFECTIVE."
            - "Policy P (pet born 2025-09-01, coverage_start 2026-09-01) enrolled at 2026-09-01 -> filed_base_cents 100000, current_monthly_premium_cents 100000, next_birthday 2027-09-01."
            - "Filing F2 (same key, base 110000, same bands, effective 2027-08-01) FILED; clock at 2027-09-01 -> F2 EFFECTIVE, F1 SUPERSEDED."
          setup_api_calls:
            - &d1_clock0
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d1_f1_create
              call: "POST /vetpay/rate-filings"
              payload: { territory_code: "941", state_code: "CA", species: "DOG", base_monthly_premium_cents: 100000, age_band_multipliers: { "0": 1.0, "1": 1.0025 }, filing_effective_date: "2026-09-01", regulator_reference: "CA-2026-001" }
              as: RateFilingAdmin
              captures: { f1_id: $.data.id }
            - &d1_f1_file
              call: "POST /vetpay/rate-filings/${f1_id}/file"
              payload: {}
              as: RateFilingAdmin
            - &d1_policy
              call: "POST /vetpay/policies"
              payload: { owner_name: "Ana Reyes", pet_name: "Miso", species: "DOG", breed: "Shiba", pet_date_of_birth: "2025-09-01", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pol_id: $.data.id }
            - &d1_f2_create
              call: "POST /vetpay/rate-filings"
              payload: { territory_code: "941", state_code: "CA", species: "DOG", base_monthly_premium_cents: 110000, age_band_multipliers: { "0": 1.0, "1": 1.0025 }, filing_effective_date: "2027-08-01", regulator_reference: "CA-2027-002" }
              as: RateFilingAdmin
              captures: { f2_id: $.data.id }
            - &d1_f2_file
              call: "POST /vetpay/rate-filings/${f2_id}/file"
              payload: {}
              as: RateFilingAdmin
            - &d1_clock1
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - &d1_recalc
              call: "POST /vetpay/policies/${pol_id}/recalculate-premium"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Policy.${pol_id}.filed_base_cents == 100000 (enrollment variant frozen)"
            - "Policy.${pol_id}.current_monthly_premium_cents == 110250 (recalc variant: 110000 x 1.0025, round_half_up)"
            - "Policy.${pol_id}.applied_filing_id == ${f2_id}"
            - "Policy.${pol_id}.next_birthday == \"2028-09-01\""
            - "Policy.${pol_id}.enrollment_status == FULLY_ACTIVE"

      - name: reconciliation_expected_vs_actual_ledger
        grounds:
          - calculations.reconciliation_expected_vs_actual
          - entities.ReconciliationReport.fields.expected_cents
          - entities.ReconciliationReport.fields.actual_cents
          - entities.Hospital.fields.running_ledger_balance_cents
        distinguishing_aspect: |
          Two accumulation paths over the same payment set — a windowed sum of
          POSTED payments (expected_ledger) versus the hospital's incrementally
          maintained running ledger replayed over the same window
          (actual_ledger) — agree at 17500 only because the appeal-driven
          reversal posted a compensating negative CLAWBACK; the invariant the
          test pins is expected_cents == actual_cents == 17500 and
          discrepancy_cents == 0.
        test_recipe:
          setup:
            - "Filing F1 EFFECTIVE for (941, DOG); hospital H ACTIVE; policy P (deductible 20000, rate 0.9) past both waiting periods."
            - "Claim C1 (one TREATMENT line 150000, condition DXA) adjudicated -> reimbursement 117000, checkout-pay key K1 -> ledger 117000."
            - "Claim C2 (one TREATMENT line 25000, condition DXA) adjudicated -> DXA deductible already saturated by C1, reimbursement 22500, pay key K2 -> ledger 139500."
            - "Appeal A1 on C1 OVERTURNED by a different adjuster -> C1 REOPENED, Payment1 REVERSED, CLAWBACK -117000 POSTED -> ledger 22500."
            - "Claim C3 (one TREATMENT line 10000, condition DXB) adjudicated -> DXB consumes 10000 deductible, reimbursement 0; checkout-pay key K3 mints a 0-cent payment -> ledger unchanged at 22500."
          setup_api_calls:
            - *d1_clock0
            - *d1_f1_create
            - *d1_f1_file
            - &d1_hosp
              call: "POST /vetpay/hospitals"
              payload: { legal_name: "Sunset Vet", territory_code: "941", bank_account_ref: "BA-001", checkout_software_version: "1.2.3" }
              as: PlatformAdmin
              captures: { hosp_id: $.data.id, hosp_v: $.data.version }
            - &d1_approve
              call: "POST /vetpay/hospitals/${hosp_id}/approve"
              payload: { expected_hospital_version: "${hosp_v}" }
              as: PlatformAdmin
            - &d1_training
              call: "POST /vetpay/hospitals/${hosp_id}/training-complete"
              payload: {}
              as: HospitalStaff
              as_user_id: "${hosp_id}"
            - *d1_policy
            - &d1_clock_full
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &d1_c1
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pol_id}", hospital_id: "${hosp_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "surgery", amount_cents: 150000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { c1_id: $.data.id, c1_v: $.data.version }
            - &d1_c1_adj
              call: "POST /vetpay/claims/${c1_id}/adjudicate"
              payload: { expected_claim_version: "${c1_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d1_c1_pay
              call: "POST /vetpay/claims/${c1_id}/checkout-pay"
              payload: { idempotency_key: "K1" }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
            - &d1_c2
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pol_id}", hospital_id: "${hosp_id}", visit_date: "2026-10-03", claim_type: "INJURY", lines: [{ description: "followup", amount_cents: 25000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { c2_id: $.data.id, c2_v: $.data.version }
            - &d1_c2_adj
              call: "POST /vetpay/claims/${c2_id}/adjudicate"
              payload: { expected_claim_version: "${c2_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d1_c2_pay
              call: "POST /vetpay/claims/${c2_id}/checkout-pay"
              payload: { idempotency_key: "K2" }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
            - &d1_a1
              call: "POST /vetpay/claims/${c1_id}/appeals"
              payload: { reason_code: "COVERAGE_DENIAL" }
              as: PetOwner
              as_user_id: "${pol_id}"
              captures: { a1_id: $.data.id }
            - &d1_a1_resolve
              call: "POST /vetpay/appeals/${a1_id}/resolve"
              payload: { outcome: "OVERTURNED", resolution_note: "misapplied" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
            - &d1_c3
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pol_id}", hospital_id: "${hosp_id}", visit_date: "2026-10-04", claim_type: "INJURY", lines: [{ description: "xray", amount_cents: 10000, category: "TREATMENT", condition_code: "DXB" }] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { c3_id: $.data.id, c3_v: $.data.version }
            - &d1_c3_adj
              call: "POST /vetpay/claims/${c3_id}/adjudicate"
              payload: { expected_claim_version: "${c3_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d1_c3_pay
              call: "POST /vetpay/claims/${c3_id}/checkout-pay"
              payload: { idempotency_key: "K3" }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
          trigger:
            - &d1_report
              call: "POST /vetpay/hospitals/${hosp_id}/reconciliation-reports"
              payload: { period_start: "2026-09-01", period_end: "2026-11-01" }
              as: PlatformAdmin
              captures: { rep_id: $.data.id }
          assert:
            - "ReconciliationReport.${rep_id}.expected_cents == 22500 (117000 + 22500 + 0 - 117000 over POSTED payments)"
            - "ReconciliationReport.${rep_id}.actual_cents == 22500 (incremental ledger replay agrees)"
            - "ReconciliationReport.${rep_id}.discrepancy_cents == 0"
            - "Hospital.${hosp_id}.running_ledger_balance_cents == 22500"
            - "Claim.${c1_id}.status == REOPENED"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_line_rounding_then_sum_diverges
        grounds:
          - calculations.per_condition_deductible_and_reimbursement
          - entities.ClaimLine.fields.reimbursement_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-line
          round_half_up(base x 0.9) THEN sum; a sum-then-round implementation
          yields a different claim total — three deductible-free lines of
          8148 cents each give round_half_up(8148 x 0.9) = 7333 per line,
          x3 = 21999, whereas round_half_up(24444 x 0.9) = 22000; the pinned
          literal is 21999 and the two orderings diverge by exactly 1 cent.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P enrolled with deductible 0, rate 0.9; clock past both waiting periods."
            - "Claim C with three TREATMENT lines, each amount 8148, distinct condition codes DX1/DX2/DX3 so no deductible interactions (deductible 0 anyway)."
          setup_api_calls:
            - *d1_clock0
            - *d1_f1_create
            - *d1_f1_file
            - *d1_hosp
            - *d1_approve
            - *d1_training
            - &d2_policy0
              call: "POST /vetpay/policies"
              payload: { owner_name: "Bo Lin", pet_name: "Tofu", species: "DOG", breed: "Mix", pet_date_of_birth: "2020-01-15", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 0, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pol0_id: $.data.id }
            - *d1_clock_full
            - &d2_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pol0_id}", hospital_id: "${hosp_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "l1", amount_cents: 8148, category: "TREATMENT", condition_code: "DX1" }, { description: "l2", amount_cents: 8148, category: "TREATMENT", condition_code: "DX2" }, { description: "l3", amount_cents: 8148, category: "TREATMENT", condition_code: "DX3" }] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { c0_id: $.data.id, c0_v: $.data.version }
          trigger:
            - call: "POST /vetpay/claims/${c0_id}/adjudicate"
              payload: { expected_claim_version: "${c0_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "each ClaimLine of Claim.${c0_id} has reimbursement_cents == 7333 (round_half_up(8148 x 0.9) = round_half_up(7333.2))"
            - "Claim.${c0_id}.reimbursement_cents == 21999 (7333 x 3, per-line rounding then sum)"
            - "Claim.${c0_id}.eligible_cents == 24444"
            - "Claim.${c0_id}.member_responsibility_cents == 2445"
            - "a sum-then-round implementation would report round_half_up(24444 x 0.9) == 22000 and differs by exactly 1 cent"

      - name: age_band_fallback_and_premium_rounding
        grounds:
          - calculations.monthly_premium
          - entities.TerritoryRateFiling.fields.age_band_multipliers
        distinguishing_aspect: |
          Mode (a) combinatorial formula: premium = round_half_up(base x mult)
          where mult comes from a three-way conditional branch (exact band key
          present vs greatest-declared-band <= age fallback vs 1.0 default);
          age 7 with bands {0: 1.0, 1: 1.05} falls back to the band-1
          multiplier, and the pinned result is round_half_up(100000 x 1.05)
          == 105000 while next_birthday only advances after the crossing.
        test_recipe:
          setup:
            - "F1 EFFECTIVE with bands {\"0\": 1.0, \"1\": 1.05} (no band 7 key)."
            - "Policy P2 (pet born 2020-06-15, coverage_start 2026-09-01) enrolled: at coverage_start age band is 6 -> fallback mult 1.05 -> premium 105000; next_birthday 2027-06-15."
          setup_api_calls:
            - *d1_clock0
            - &d2_f1b
              call: "POST /vetpay/rate-filings"
              payload: { territory_code: "941", state_code: "CA", species: "DOG", base_monthly_premium_cents: 100000, age_band_multipliers: { "0": 1.0, "1": 1.05 }, filing_effective_date: "2026-09-01", regulator_reference: "CA-2026-009" }
              as: RateFilingAdmin
              captures: { f1b_id: $.data.id }
            - call: "POST /vetpay/rate-filings/${f1b_id}/file"
              payload: {}
              as: RateFilingAdmin
          trigger:
            - call: "POST /vetpay/policies"
              payload: { owner_name: "Cy Okafor", pet_name: "Rex", species: "DOG", breed: "Lab", pet_date_of_birth: "2020-06-15", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pol2_id: $.data.id }
          assert:
            - "Policy.${pol2_id}.current_monthly_premium_cents == 105000 (age band 6 -> greatest declared band <= 6 is band 1 -> mult 1.05)"
            - "Policy.${pol2_id}.filed_base_cents == 100000"
            - "Policy.${pol2_id}.next_birthday == \"2027-06-15\""
            - "Policy.${pol2_id}.applied_filing_id == ${f1b_id}"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: claim_preexisting_review_cycle
        grounds:
          - state_machines.Claim.SUBMITTED_to_PREEXISTING_REVIEW
          - state_machines.Claim.PREEXISTING_REVIEW_to_SUBMITTED
        distinguishing_aspect: |
          Claim has a genuine cycle SUBMITTED -> PREEXISTING_REVIEW ->
          SUBMITTED (review bounce) reachable twice before adjudication; each
          bounce increments Claim.version, so the adjudicate OCC token must be
          re-read after the cycle — an adjuster holding the version from
          before the cycle gets ERR_STALE_CLAIM_VERSION.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting periods; claim C submitted (one TREATMENT line 50000, DXA)."
          setup_api_calls:
            - *d1_clock0
            - *d1_f1_create
            - *d1_f1_file
            - *d1_hosp
            - *d1_approve
            - *d1_training
            - *d1_policy
            - *d1_clock_full
            - &d3_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pol_id}", hospital_id: "${hosp_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "surgery", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /vetpay/claims/${cyc_id}/flag-preexisting-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "POST /vetpay/claims/${cyc_id}/clear-preexisting-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - call: "GET /vetpay/claims/${cyc_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { cyc_v_after: $.data.version }
            - call: "POST /vetpay/claims/${cyc_id}/adjudicate"
              payload: { expected_claim_version: "${cyc_v_after}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
          assert:
            - "Claim.${cyc_id} reached PREEXISTING_REVIEW and returned to SUBMITTED (cycle traversed)"
            - "Claim.${cyc_id}.version == 3 after the cycle (create=1, flag=2, clear=3)"
            - "adjudication after the cycle succeeds with the re-read version and Claim.${cyc_id}.status == ADJUDICATED"
            - "Claim.${cyc_id}.reimbursement_cents == 27000 (50000 - 20000 deductible = 30000 x 0.9)"

      - name: policy_parallel_waiting_and_lifecycle_dimensions
        grounds:
          - state_machines.Policy
          - entities.Policy.fields.enrollment_status
          - entities.Policy.fields.lifecycle_status
        distinguishing_aspect: |
          Policy carries two independent state dimensions on one row:
          enrollment_status walks INJURY_WAITING -> ILLNESS_WAITING ->
          FULLY_ACTIVE on clock sweeps while lifecycle_status stays ACTIVE —
          and lifecycle cancellation is orthogonal: cancelling while still
          ILLNESS_WAITING leaves enrollment_status frozen at ILLNESS_WAITING
          (no sweep fires on a CANCELLED policy), proving the dimensions
          evolve independently.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; policy P3 (deductible 20000, rate 0.9, coverage_start 2026-09-01) at INJURY_WAITING."
            - "Clock advanced to 2026-09-06 (>= injury end 2026-09-06, < illness end 2026-09-15) -> ILLNESS_WAITING."
          setup_api_calls:
            - *d1_clock0
            - *d1_f1_create
            - *d1_f1_file
            - &d3_policy3
              call: "POST /vetpay/policies"
              payload: { owner_name: "Dana Kim", pet_name: "Nori", species: "DOG", breed: "Poodle", pet_date_of_birth: "2024-03-01", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pol3_id: $.data.id }
            - call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-06T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /vetpay/policies/${pol3_id}"
              payload: {}
              as: PetOwner
              as_user_id: "${pol3_id}"
          trigger:
            - call: "POST /vetpay/policies/${pol3_id}/cancel"
              payload: {}
              as: PetOwner
              as_user_id: "${pol3_id}"
            - call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /vetpay/policies/${pol3_id}"
              payload: {}
              as: PetOwner
              as_user_id: "${pol3_id}"
          assert:
            - "after the first clock advance Policy.${pol3_id}.enrollment_status == ILLNESS_WAITING while lifecycle_status == ACTIVE (dimensions independent)"
            - "after cancel Policy.${pol3_id}.lifecycle_status == CANCELLED"
            - "after the second clock advance Policy.${pol3_id}.enrollment_status remains ILLNESS_WAITING (no sweep on a non-ACTIVE policy)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: appeal_overturn_reversal_clawback_ledger_cascade
        grounds:
          - state_machines.ClaimAppeal.UNDER_REVIEW_to_OVERTURNED
          - state_machines.Claim.SETTLED_to_REOPENED
          - entities.Payment.fields.reverses_payment_id
          - entities.Hospital.fields.running_ledger_balance_cents
        distinguishing_aspect: |
          Depth-3 chain where each link is caused by the previous one:
          appeal resolve OVERTURNED (link 1) reopens the SETTLED claim (link
          2), the reopen itself reverses the DIRECT_PAY payment and mints a
          compensating negative CLAWBACK (link 3), and the clawback posting
          itself debits the hospital ledger and PolicyCondition lifetime
          totals (link 4) — distinct from a fan-out because removing link 2
          (no reopen) removes every downstream effect.
        test_recipe:
          setup:
            - "Full chain to SETTLED: F1 EFFECTIVE, H ACTIVE, P past waiting, claim C (one line 150000 DXA) adjudicated (reimbursement 117000), paid (K9), clock advanced 3 days -> SETTLED."
            - "Appeal A opened by owner, records requested, record submitted, appeal UNDER_REVIEW."
          setup_api_calls:
            - *d1_clock0
            - *d1_f1_create
            - *d1_f1_file
            - *d1_hosp
            - *d1_approve
            - *d1_training
            - *d1_policy
            - *d1_clock_full
            - &d4_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pol_id}", hospital_id: "${hosp_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "surgery", amount_cents: 150000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { cd_id: $.data.id, cd_v: $.data.version }
            - &d4_adj
              call: "POST /vetpay/claims/${cd_id}/adjudicate"
              payload: { expected_claim_version: "${cd_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d4_pay
              call: "POST /vetpay/claims/${cd_id}/checkout-pay"
              payload: { idempotency_key: "K9" }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { pay9_id: $.data.id }
            - &d4_clock_settle
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-04T00:00:00Z" }
              as: PlatformAdmin
            - &d4_get_settled
              call: "GET /vetpay/claims/${cd_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d4_appeal
              call: "POST /vetpay/claims/${cd_id}/appeals"
              payload: { reason_code: "COVERAGE_DENIAL" }
              as: PetOwner
              as_user_id: "${pol_id}"
              captures: { ap_id: $.data.id }
            - &d4_req
              call: "POST /vetpay/appeals/${ap_id}/request-records"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d4_rec
              call: "POST /vetpay/policies/${pol_id}/medical-records"
              payload: { hospital_id: "${hosp_id}", record_type: "PROCEDURE", recorded_at: "2026-10-02T10:00:00Z", diagnosis_code: "DXA", notes: "op report" }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { mr_id: $.data.id }
            - &d4_sub
              call: "POST /vetpay/appeals/${ap_id}/submit-records"
              payload: { medical_record_ids: ["${mr_id}"] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
          trigger:
            - call: "POST /vetpay/appeals/${ap_id}/resolve"
              payload: { outcome: "OVERTURNED", resolution_note: "new evidence" }
              as: ClaimsAdjuster
              as_user_id: "adj-2"
          assert:
            - "ClaimAppeal.${ap_id}.status == OVERTURNED"
            - "Claim.${cd_id}.status == REOPENED (link 2 caused by link 1)"
            - "Payment.${pay9_id}.status == REVERSED (link 3 caused by link 2)"
            - "GET /vetpay/payments?reverses_payment_id=${pay9_id} returns exactly 1 CLAWBACK payment with amount_cents == -117000 and ledger_status == POSTED"
            - "Hospital.${hosp_id}.running_ledger_balance_cents == 0 (link 4 caused by link 3)"
            - "PolicyCondition for DXA has lifetime_reimbursed_cents == 0 after recompute"

      - name: hospital_suspend_claim_deny_condition_reversal_cascade
        grounds:
          - state_machines.Hospital.ACTIVE_to_SUSPENDED
          - state_machines.Claim
          - entities.PolicyCondition.fields.deductible_accumulated_cents
        distinguishing_aspect: |
          Depth-2+ chain from a different trigger than the appeal cascade:
          suspending the hospital (link 1) denies only its non-terminal claims
          — the ADJUDICATED claim C2 flips to DENIED (link 2) — and that
          denial itself releases C2's PolicyCondition deductible consumption
          (link 3: DXB.deductible_accumulated_cents 10000 -> 0), while the
          already-PAID claim C1 is untouched (conditional cascade on child
          state), proving the chain is caused per-link rather than fanned out.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting."
            - "C1: line 150000 DXA, adjudicated and PAID (key KS1) -> DXA deductible 20000 consumed, DXB/DXC untouched, ledger 117000."
            - "C2: line 10000 DXB, ADJUDICATED but not paid -> DXB deductible_accumulated 10000."
            - "C3: line 8000 DXC, still SUBMITTED (no condition row exists yet)."
          setup_api_calls:
            - *d1_clock0
            - *d1_f1_create
            - *d1_f1_file
            - *d1_hosp
            - *d1_approve
            - *d1_training
            - *d1_policy
            - *d1_clock_full
            - &d5_c1
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pol_id}", hospital_id: "${hosp_id}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "surgery", amount_cents: 150000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - &d5_c1_adj
              call: "POST /vetpay/claims/${s1_id}/adjudicate"
              payload: { expected_claim_version: "${s1_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d5_c1_pay
              call: "POST /vetpay/claims/${s1_id}/checkout-pay"
              payload: { idempotency_key: "KS1" }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
            - &d5_c2
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pol_id}", hospital_id: "${hosp_id}", visit_date: "2026-10-03", claim_type: "ILLNESS", lines: [{ description: "labs", amount_cents: 10000, category: "TREATMENT", condition_code: "DXB" }] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { s2_id: $.data.id, s2_v: $.data.version }
            - &d5_c2_adj
              call: "POST /vetpay/claims/${s2_id}/adjudicate"
              payload: { expected_claim_version: "${s2_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d5_c3
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pol_id}", hospital_id: "${hosp_id}", visit_date: "2026-10-03", claim_type: "ILLNESS", lines: [{ description: "meds", amount_cents: 8000, category: "TREATMENT", condition_code: "DXC" }] }
              as: HospitalStaff
              as_user_id: "${hosp_id}"
              captures: { s3_id: $.data.id }
          trigger:
            - call: "POST /vetpay/hospitals/${hosp_id}/suspend"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Hospital.${hosp_id}.status == SUSPENDED (link 1)"
            - "Claim.${s2_id}.status == DENIED with denial_reason == HOSPITAL_SUSPENDED (link 2)"
            - "Claim.${s3_id}.status == DENIED with denial_reason == HOSPITAL_SUSPENDED (link 2, second branch)"
            - "Claim.${s1_id}.status remains PAID (conditional cascade: terminal/paid children untouched)"
            - "PolicyCondition DXB.deductible_accumulated_cents == 0 (link 3 released by the denial)"
            - "PolicyCondition DXA.deductible_accumulated_cents remains 20000"
            - "Hospital.${hosp_id}.running_ledger_balance_cents remains 117000"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_adjudicate
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_CLAIM_NOT_ADJUDICATABLE]
          - errors[ERR_PREEXISTING_CONDITION]
        distinguishing_aspect: |
          Error-category pair state vs business_safety: an adjudicate call on
          a claim that is already ADJUDICATED (state failure) AND whose
          TREATMENT line maps to a pre-existing condition (safety failure)
          must surface ERR_CLAIM_NOT_ADJUDICATABLE (priority 5) — the
          pre-existing evidence is never evaluated from a wrong state.
        test_recipe:
          setup:
            - "F1 EFFECTIVE; H ACTIVE; P past waiting."
            - "Claim C (TREATMENT 50000 DXA) adjudicated cleanly FIRST (no pre-existing records yet)."
            - "Then a pre-coverage EXAM record (DXA, recorded 2026-08-01) is uploaded, so a fresh adjudication of C would fail business_safety — but C is already ADJUDICATED, so the state rule must win."
          setup_api_calls:
            - &d6_clock0
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d6_f1
              call: "POST /vetpay/rate-filings"
              payload: { territory_code: "941", state_code: "CA", species: "DOG", base_monthly_premium_cents: 100000, age_band_multipliers: { "0": 1.0, "1": 1.0025 }, filing_effective_date: "2026-09-01", regulator_reference: "CA-2026-001" }
              as: RateFilingAdmin
              captures: { pf_f1: $.data.id }
            - &d6_f1_file
              call: "POST /vetpay/rate-filings/${pf_f1}/file"
              payload: {}
              as: RateFilingAdmin
            - &d6_hosp
              call: "POST /vetpay/hospitals"
              payload: { legal_name: "Sunset Vet", territory_code: "941", bank_account_ref: "BA-001", checkout_software_version: "1.2.3" }
              as: PlatformAdmin
              captures: { pf_h: $.data.id, pf_hv: $.data.version }
            - &d6_approve
              call: "POST /vetpay/hospitals/${pf_h}/approve"
              payload: { expected_hospital_version: "${pf_hv}" }
              as: PlatformAdmin
            - &d6_train
              call: "POST /vetpay/hospitals/${pf_h}/training-complete"
              payload: {}
              as: HospitalStaff
              as_user_id: "${pf_h}"
            - &d6_pol
              call: "POST /vetpay/policies"
              payload: { owner_name: "Ana Reyes", pet_name: "Miso", species: "DOG", breed: "Shiba", pet_date_of_birth: "2025-09-01", territory_code: "941", coverage_start: "2026-09-01", per_condition_deductible_cents: 20000, reimbursement_rate: 0.9 }
              as: PetOwner
              captures: { pf_p: $.data.id }
            - &d6_clock1
              call: "POST /vetpay/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - &d6_claim
              call: "POST /vetpay/claims"
              payload: { policy_id: "${pf_p}", hospital_id: "${pf_h}", visit_date: "2026-10-02", claim_type: "INJURY", lines: [{ description: "surgery", amount_cents: 50000, category: "TREATMENT", condition_code: "DXA" }] }
              as: HospitalStaff
              as_user_id: "${pf_h}"
              captures: { pf_c: $.data.id, pf_cv: $.data.version }
            - &d6_adj
              call: "POST /vetpay/claims/${pf_c}/adjudicate"
              payload: { expected_claim_version: "${pf_cv}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
            - &d6_late_record
              call: "POST /vetpay/policies/${pf_p}/medical-records"
              payload: { hospital_id: "${pf_h}", record_type: "EXAM", recorded_at: "2026-08-01T09:00:00Z", diagnosis_code: "DXA", notes: "limping noted pre-coverage" }
              as: HospitalStaff
              as_user_id: "${pf_h}"
            - &d6_read
              call: "GET /vetpay/claims/${pf_c}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { pf_cv2: $.data.version }
          trigger:
            - call: "POST /vetpay/claims/${pf_c}/adjudicate"
              payload: { expected_claim_version: "${pf_cv2}" }
              as: ClaimsAdjuster
              as_user_id: "adj-1"
              captures: { pf_err: $.data.error_id }
          assert:
            - "trigger returns http 409 with error_id == ERR_CLAIM_NOT_ADJUDICATABLE (priority 5 state beats priority 7 business_safety)"
            - "error_id is NOT ERR_PREEXISTING_CONDITION even though DXA is now pre-existing"

      - name: state_vs_business_temporal_on_adjudicate
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_WAITING_PERIOD_ACTIVE]
          - errors[ERR_CLAIM_NOT_ADJUDICATABLE]
        distinguishing_aspect: |
          Different category pair — state vs business_temporal: adjudicating a
          DENIED ILLNESS claim whose illness waiting window is still open must
          surface ERR_CLAIM_NOT_ADJUDICATABLE (priority 5), never
