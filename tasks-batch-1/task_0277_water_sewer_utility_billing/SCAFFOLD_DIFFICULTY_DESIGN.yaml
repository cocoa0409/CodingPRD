  - rule_id: resource_temporal_overlap
    instances:
      - name: shutoff_schedule_inside_moratorium_window_barred
        grounds:
          - validations[priority=10]
          - entities.Moratorium.fields.window_start
          - errors[ERR_MORATORIUM_ACTIVE]
        distinguishing_aspect: |
          A ShutoffOrder.scheduled_for that lands inside [window_start, window_end) of a Moratorium is
          rejected — half-open interval semantics on the Moratorium resource (window_start inclusive,
          window_end exclusive). Resource: Moratorium window vs a point-in-time scheduled date.
        test_recipe:
          setup:
            - "Account with past_due >= 7500; moratorium window [2026-12-01, 2027-03-01); scheduled_for = 2026-12-01 (boundary inclusive)."
