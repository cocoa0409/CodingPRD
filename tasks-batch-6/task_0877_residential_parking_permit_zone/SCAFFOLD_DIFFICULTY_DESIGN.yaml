            - { call: "POST /zones", payload: { name: "TO1 Zone", zone_code: "RPZ-TO1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 9, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id, zone_v: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "1 TO", resident_name: "To", contact_email: "to@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /households/${hh_id}/vehicles", payload: { license_plate: "TO1-A", make: "Volvo", model: "V40" }, as: Resident, as_user_id: "${hh_id}", captures: { va: $.data.id } }
            - { call: "POST /households/${hh_id}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hh_id}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${va}" }, as: Resident, as_user_id: "${hh_id}", captures: { aa: $.data.id } }
            - { call: "POST /permit-applications/${aa}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${aa}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { pa: $.data.id } }
            - { call: "POST /visitor-passes", payload: { household_id: "${hh_id}", permit_id: "${pa}", pass_type: "TEMPORARY", guest_plate: "GX", valid_from: "2026-05-02T08:00:00.000Z", valid_until: "2026-05-02T12:00:00.000Z" }, as: Resident, as_user_id: "${hh_id}", captures: { p1: $.data.id } }
            - { call: "POST /visitor-passes", payload: { household_id: "${hh_id}", permit_id: "${pa}", pass_type: "TEMPORARY", guest_plate: "GX", valid_from: "2026-05-02T12:00:00.000Z", valid_until: "2026-05-02T16:00:00.000Z" }, as: Resident, as_user_id: "${hh_id}", captures: { p2: $.data.id } }
          trigger:
            - { call: "POST /visitor-passes", payload: { household_id: "${hh_id}", permit_id: "${pa}", pass_type: "TEMPORARY", guest_plate: "GX", valid_from: "2026-05-02T11:00:00.000Z", valid_until: "2026-05-02T13:00:00.000Z" }, as: Resident, as_user_id: "${hh_id}", captures: { err: $.data.error_id } }
          assert:
            - "VisitorPass.${p1}.status == ACTIVE"
            - "VisitorPass.${p2}.status == ACTIVE"
            - "response.data.error_id == ERR_VISITOR_PASS_OVERLAP"
            - "response.status == 409"

      - name: permit_closed_interval_shared_endpoint_overlap
        grounds:
          - validations[priority=7]
          - entities.Permit.fields.issued_at
          - errors[ERR_PERMIT_PERIOD_OVERLAP]
        distinguishing_aspect: "Permit uses CLOSED [issued_at, expires_at]: issuing a second permit for the same vehicle whose period intersects the existing one (even at a shared endpoint) is rejected with ERR_PERMIT_PERIOD_OVERLAP — different interval semantics (closed vs half-open) on a different resource (vehicle) than the visitor-pass overlap."
        test_recipe:
          setup:
            - "Household (cap 2) with one ACTIVE permit on vehicle V issued 2026-05-01. A second SUBMITTED application for the SAME vehicle V is reviewed."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "TO2 Zone", zone_code: "RPZ-TO2", permit_capacity: 3, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id, zone_v: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "2 TO", resident_name: "Tp", contact_email: "tp@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /households/${hh_id}/vehicles", payload: { license_plate: "TO2-A", make: "Saab", model: "93" }, as: Resident, as_user_id: "${hh_id}", captures: { va: $.data.id } }
            - { call: "POST /households/${hh_id}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hh_id}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${va}" }, as: Resident, as_user_id: "${hh_id}", captures: { a1: $.data.id } }
            - { call: "POST /permit-applications/${a1}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${a1}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { p1: $.data.id } }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${va}" }, as: Resident, as_user_id: "${hh_id}", captures: { a2: $.data.id } }
            - { call: "POST /permit-applications/${a2}/review", payload: {}, as: ParkingClerk }
            - { call: "GET /zones/${zone_id}", payload: {}, as: PermitSupervisor, captures: { zone_v2: $.data.version } }
          trigger:
            - { call: "POST /permit-applications/${a2}/approve", payload: { expected_zone_version: "${zone_v2}" }, as: PermitSupervisor, captures: { err: $.data.error_id } }
          assert:
            - "Permit.${p1}.status == ACTIVE"
            - "response.data.error_id == ERR_PERMIT_PERIOD_OVERLAP"
            - "response.status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: slot_count_conserved_across_issue_and_refund
        grounds:
          - calculations.zone_active_permit_count
          - state_machines.PermitApplication.UNDER_REVIEW_to_APPROVED
          - state_machines.Permit.ACTIVE_to_REFUNDED
        distinguishing_aspect: "Conserved quantity #1 (slot count): Zone.active_permit_count == count(occupying permits) before issuance (0) and after the issuance+refund pair (0); the compensating refund leaves the count identical."
        test_recipe:
          setup:
            - "Fresh zone (active_permit_count 0). One permit issued then refunded."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "CI1 Zone", zone_code: "RPZ-CI1", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id, zone_v: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "1 CI", resident_name: "Ci", contact_email: "ci@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /households/${hh_id}/vehicles", payload: { license_plate: "CI1-A", make: "Jeep", model: "Renegade" }, as: Resident, as_user_id: "${hh_id}", captures: { va: $.data.id } }
            - { call: "POST /households/${hh_id}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hh_id}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${va}" }, as: Resident, as_user_id: "${hh_id}", captures: { aa: $.data.id } }
            - { call: "POST /permit-applications/${aa}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${aa}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { pa: $.data.id } }
          trigger:
            - { call: "POST /permits/${pa}/refund", payload: { refund_type: "ADMINISTRATIVE" }, as: PermitSupervisor }
            - { call: "GET /zones/${zone_id}", payload: {}, as: PermitSupervisor, captures: { final_count: $.data.active_permit_count } }
          assert:
            - "Zone.${zone_id}.active_permit_count == 0"
            - "Household.${hh_id}.active_permit_count == 0"
            - "Permit.${pa}.status == REFUNDED"

      - name: fee_ledger_conserved_across_issue_and_refund
        grounds:
          - calculations.zone_fee_ledger
          - entities.Zone.fields.fees_collected_cents
          - entities.Zone.fields.fees_refunded_cents
        distinguishing_aspect: "Conserved quantity #2 (money): net_fees == fees_collected_cents - fees_refunded_cents == fee_paid_cents - refund_amount_cents (10000 - 5246 = 4754); a different conserved quantity than the slot count."
        test_recipe:
          setup:
            - "One permit issued 2026-05-01 (fee 10000); clock advanced to 2026-08-01; permit refunded VOLUNTARY (refund 5246)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: PermitSupervisor }
            - { call: "POST /zones", payload: { name: "CI2 Zone", zone_code: "RPZ-CI2", permit_capacity: 2, max_permits_per_household: 2, guest_pass_daily_limit: 2, permit_annual_fee_cents: 12000, visitor_pass_fee_cents: 500 }, as: PermitSupervisor, captures: { zone_id: $.data.id, zone_v: $.data.version } }
            - { call: "POST /households", payload: { zone_id: "${zone_id}", unit_address: "2 CI", resident_name: "Cj", contact_email: "cj@x.com" }, as: Anonymous, captures: { hh_id: $.data.id } }
            - { call: "POST /households/${hh_id}/vehicles", payload: { license_plate: "CI2-A", make: "Dacia", model: "Duster" }, as: Resident, as_user_id: "${hh_id}", captures: { va: $.data.id } }
            - { call: "POST /households/${hh_id}/proof-submissions", payload: { document_type: "LEASE" }, as: Resident, as_user_id: "${hh_id}", captures: { pf: $.data.id } }
            - { call: "POST /proof-submissions/${pf}/review", payload: { outcome: "VERIFIED" }, as: ParkingClerk }
            - { call: "POST /permit-applications", payload: { zone_id: "${zone_id}", household_id: "${hh_id}", vehicle_id: "${va}" }, as: Resident, as_user_id: "${hh_id}", captures: { aa: $.data.id } }
            - { call: "POST /permit-applications/${aa}/review", payload: {}, as: ParkingClerk }
            - { call: "POST /permit-applications/${aa}/approve", payload: { expected_zone_version: "${zone_v}" }, as: PermitSupervisor, captures: { pa: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PermitSupervisor }
          trigger:
            - { call: "POST /permits/${pa}/refund", payload: { refund_type: "VOLUNTARY" }, as: PermitSupervisor, captures: { ref: $.data.refund_amount_cents } }
            - { call: "GET /zones/${zone_id}", payload: {}, as: PermitSupervisor, captures: { coll: $.data.fees_collected_cents, refd: $.data.fees_refunded_cents } }
          assert:
            - "Zone.${zone_id}.fees_collected_cents == 10000"
            - "Zone.${zone_id}.fees_refunded_cents == 5246"
            - "Zone.${zone_id}.fees_collected_cents - Zone.${zone_id}.fees_refunded_cents == 4754"
            - "Permit.${pa}.refund_amount_cents == 5246"
