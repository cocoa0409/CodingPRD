  # ---- MaterialOrder ----
  - method: POST
    path: "/material-orders"
    description: "Place a material order sized from the job's bound estimate"
    roles: [ProductionManager]
    code: 201
    input: [job_id]
    output: MaterialOrder
    side_effects: ["status=ORDERED; bundles/total_weight_lbs/freight_cents computed (§1.3 material_order_sizing)"]

  - method: GET
    path: "/material-orders/{id}"
    description: "Get a material order"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: []

  - method: GET
    path: "/material-orders"
    description: "List material orders, filterable by job_id"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: ["job_id?", "status?"]
    output: MaterialOrder[]
    side_effects: []

  - method: POST
    path: "/material-orders/{id}/deliver"
    description: "Mark a material order DELIVERED"
    roles: [ProductionManager]
    code: 200
    input: ["delivered_short?"]
    output: MaterialOrder
    side_effects: ["status -> DELIVERED; version+1"]

  - method: POST
    path: "/material-orders/{id}/cancel"
    description: "Cancel an ORDERED material order"
    roles: [ProductionManager]
    code: 200
    input: []
    output: MaterialOrder
    side_effects: ["status -> CANCELLED; version+1"]

  # ---- CrewAssignment ----
  - method: POST
    path: "/crew-assignments"
    description: "Book a crew window for a job (half-open overlap enforced)"
    roles: [ProductionManager]
    code: 201
    input: [job_id, crew_id, window_start, window_end]
    output: CrewAssignment
    side_effects: ["status=BOOKED; §1.3 crew_window_overlap enforced"]

  - method: GET
    path: "/crew-assignments/{id}"
    description: "Get a crew assignment"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: []
