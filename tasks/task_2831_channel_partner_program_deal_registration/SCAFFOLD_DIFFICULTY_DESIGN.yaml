  # =========================================================================
  # Rule 9 - compensating invariants over different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: credit_memo_preserves_per_invoice_margin_conservation
        grounds:
          - consistency_model.invariants.order_invoice_margin_conservation
          - state_machines.OrderInvoice.INVOICED_to_CREDITED
          - calculations.channel_margin_resolution
          - calculations.partner_revenue_rollup
          - entities.OrderInvoice.fields.margin_value_cents
        distinguishing_aspect: |
          Conserved quantity #1: the per-invoice decomposition
          list_amount_cents == invoice_amount_cents + margin_value_cents. A credit memo moves
          exactly credit_memo_cents from the net into the margin (9,660,000/2,340,000 ->
          9,160,000/2,840,000) while list_amount_cents stays 12,000,000, and the partner's
          trailing_revenue_cents drops by exactly 500,000 once (17,810,000) rather than twice,
          because invoice_amount_cents is already net of the memo.
        test_recipe:
          setup:
            - "The GOLD DISTRIBUTOR partner (seed STOCKING invoice 8,650,000 already INVOICED)."
            - "Clock 2026-01-20T00:00:00.000Z; one additional DROP_SHIP invoice with list_amount_cents 12,000,000 and no linked registration: GOLD base 0.18, no registration/spr/stocking uplift -> prelim_net 9,840,000 -> MID band +0.015 -> margin_pct 0.1950 -> invoice_amount 9,660,000, margin_value 2,340,000; then moved to INVOICED."
