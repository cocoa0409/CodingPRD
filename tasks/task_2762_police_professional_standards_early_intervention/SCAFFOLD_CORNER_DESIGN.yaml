              payload: { officer_id: "${vance_id}" }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { al_id: "$.data[0].id", al_v: "$.data[0].version" }
            - call: "POST /eis-alerts/${al_id}/intervention-plans"
              payload: { expected_alert_version: "${al_v}", supervisor_officer_id: "${sup_id}", required_checkin_count: 2, duration_days: 30, interventions: ["PEER_MENTORING"] }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /intervention-plans/${p1_id}/activate"
              payload: { activation_note: "A sergeant who does not own the plan trying to start it." }
              as: Supervisor
              as_user_id: "${sup2_id}"
              captures: { e_activate: "$.data.error_id" }
            - call: "POST /intervention-plans/${p1_id}/activate"
              payload: { activation_note: "The monitoring supervisor starts the plan." }
              as: Supervisor
              as_user_id: "${sup_id}"
            - call: "GET /intervention-plans/${p1_id}/check-ins"
              payload: {}
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { ck1_id: "$.data[0].id" }
            - call: "POST /check-ins/${ck1_id}/complete"
              payload: { outcome: "SATISFACTORY", notes: "Signed off by the wrong sergeant." }
              as: Supervisor
              as_user_id: "${sup2_id}"
              captures: { e_checkin: "$.data.error_id" }
            - call: "POST /intervention-plans/${p1_id}/close"
              payload: { closing_note: "Closed by the wrong sergeant." }
              as: Supervisor
              as_user_id: "${sup2_id}"
              captures: { e_close: "$.data.error_id" }
            - call: "POST /intervention-plans/${p1_id}/close"
              payload: { closing_note: "Closed by the commander while check-ins are still pending." }
              as: IACommander
              as_user_id: "${cmdr_id}"
              captures: { e_cmdr_close: "$.data.error_id" }
          assert:
            - "call 1: HTTP 403 with ${e_activate} == ERR_NOT_PLAN_SUPERVISOR and the plan still DRAFT with activated_at null"
            - "call 2: HTTP 200 with the plan ACTIVE and two PENDING check-ins created"
            - "call 4: HTTP 403 with ${e_checkin} == ERR_NOT_PLAN_SUPERVISOR; the check-in is still PENDING, so the refusal is about identity and not about state"
            - "call 5: HTTP 403 with ${e_close} == ERR_NOT_PLAN_SUPERVISOR, not ERR_PENDING_CHECKINS, because priority 6 precedes priority 10"
            - "call 6: HTTP 422 with ${e_cmdr_close} == ERR_PENDING_CHECKINS - the same request from IACommander passes the identity rule entirely, which is the difference the rule's role condition encodes"
            - "the plan is still ACTIVE with compliance_score null after all four refusals"

      - name: an_ia_commander_may_not_adjudicate_their_own_investigation
        claim_type: Segregation of duties
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / segregation_of_duties_outranks_preponderance_shortfall"
          rationale: |
            ERR_SEGREGATION_OF_DUTIES is already driven to its own error id by the difficulty
            instance, which files a disposition as the officer who was assigned the investigation
            while the evidence weights also fail the preponderance test, and asserts that the
            priority-9 duties rule answers rather than the priority-12 evidence rule. That instance
            also covers the subject-officer half of the same rule on POST /disciplines/{id}/impose.
            A separate corner instance would replay the same call with the same acting identity and
            the same expected code.

  # =========================================================================
  # Guide section 8 - Cross-cutting complexity layers
  # (rate_threshold_triggers, cascading_side_effects, dual_variant_calculation,
  #  optimistic_concurrency)
  # =========================================================================
  - section: cross_cutting_layers
    instances:
      - name: assignment_create_rejects_a_stale_investigation_version
        claim_type: Stale version rejected
        grounds:
          - concurrency_rules.assignment-create-stale-investigation
          - errors.ERR_STALE_INVESTIGATION_VERSION
          - state_machines.Investigation
        distinguishing_aspect: |
          Reassignment is a legal self-loop on this machine, so a stale-version write is not an
          obviously impossible request: it would look exactly like a valid reassignment and would
          move the caseload ledger a second time. The test therefore replays the version captured
          before the first assignment and proves three things at once - the 412 code, that
          assignment_count and both officers' open_case_load are untouched by the refused call, and
          that a re-read of the current version makes the same reassignment succeed with the ledger
          conserved.
        test_recipe:
          setup:
            - "The logical clock stands at 2026-08-01T00:00:00Z."
            - "Internal Affairs holds Commander Reyes, Investigator Ahn (IA-101, certification 3) and Investigator Briggs (IA-102, certification 3); Patrol North holds Sergeant Doyle and Officer Vance."
            - "One complaint with one allegation against Vance and an investigation in UNASSIGNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /units"
              payload: { name: "Internal Affairs", unit_role: "INTERNAL_AFFAIRS", command_code: "IA", peer_group_code: "PG_IA", sworn_headcount: 12, intake_enabled: true }
              as: SystemAdmin
              captures: { ia_unit_id: $.data.id }
            - call: "POST /units"
              payload: { name: "Patrol North", unit_role: "PATROL_DIVISION", command_code: "PN", peer_group_code: "PG_NORTH", sworn_headcount: 60, intake_enabled: true }
              as: SystemAdmin
              captures: { patrol_unit_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-001", full_name: "Commander Reyes", rank: "CAPTAIN", assignment_type: "ADMIN", annual_salary_cents: 16500000, demographic_code: "DG_A", hire_date: "2004-01-05T00:00:00Z", is_investigator: false, certification_level: 3, max_case_load: 0 }
              as: SystemAdmin
              captures: { cmdr_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-101", full_name: "Investigator Ahn", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 12800000, demographic_code: "DG_B", hire_date: "2011-03-01T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 8 }
              as: SystemAdmin
              captures: { inv_a_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${ia_unit_id}", badge_number: "IA-102", full_name: "Investigator Briggs", rank: "SERGEANT", assignment_type: "INVESTIGATIVE", annual_salary_cents: 12700000, demographic_code: "DG_A", hire_date: "2013-05-01T00:00:00Z", is_investigator: true, certification_level: 3, max_case_load: 8 }
              as: SystemAdmin
              captures: { inv_b_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-010", full_name: "Sergeant Doyle", rank: "SERGEANT", assignment_type: "PATROL", annual_salary_cents: 10500000, demographic_code: "DG_A", hire_date: "2012-02-02T00:00:00Z" }
              as: SystemAdmin
              captures: { sup_id: $.data.id }
            - call: "POST /officers"
              payload: { unit_id: "${patrol_unit_id}", badge_number: "PN-501", full_name: "Officer Vance", rank: "OFFICER", assignment_type: "PATROL", annual_salary_cents: 9100013, demographic_code: "DG_C", hire_date: "2019-06-01T00:00:00Z" }
              as: SystemAdmin
              captures: { vance_id: $.data.id }
            - call: "POST /complaints"
              payload: { intake_channel: "SUPERVISOR", narrative: "Report not filed after a call for service.", incident_datetime: "2026-07-20T22:00:00Z", alleged_injury: false, reported_allegation_types: ["NEGLECT_OF_DUTY"], subject_unit_id: "${patrol_unit_id}", complainant_name: "Sergeant Doyle", complainant_contact: "doyle@dept.gov", reporting_supervisor_officer_id: "${sup_id}" }
              as: Supervisor
              as_user_id: "${sup_id}"
              captures: { c_id: $.data.id }
            - call: "POST /complaints/${c_id}/allegations"
              payload: { subject_officer_id: "${vance_id}", allegation_type: "NEGLECT_OF_DUTY", narrative: "No report filed.", offense_class: "B" }
              as: IACommander
              as_user_id: "${cmdr_id}"
            - call: "POST /complaints/${c_id}/investigations"
              payload: { opening_note: "Opened." }
              as: IACommander
              as_user_id: "${cmdr_id}"
