            - call: "POST /billing-adjustments"
              payload: { invoice_line_id: "${line}", reason: "MANUAL", delta_cents: -100, expected_invoice_version: "${inv_v2}" }
              as: BillingOps
              as_user_id: "billing.one"
              captures: { adj2: $.data.id }
          assert:
            - "${c1_state} == ACTIVE, and the replayed activation returns HTTP 412 with ${e_shipper} == ERR_STALE_SHIPPER_VERSION because the first activation moved the shipper to version ${sh_v2} == ${sh_v1} + 1"
            - "${c2_state} == ACTIVE once the current version is supplied — both contracts end ACTIVE because their periods do not overlap"
            - "The replayed scan returns HTTP 412 with ${e_shipment} == ERR_STALE_SHIPMENT_VERSION, and ${p_v2} == ${p_v1} + 1"
            - "GET /shipments/${p}/scans returns total_count == 2 (${scan1} and ${scan2}) — the rejected scan created no DimensionScan row and did not bump the version a third time"
            - "The replayed adjustment proposal returns HTTP 412 with ${e_invoice} == ERR_STALE_INVOICE_VERSION and ${inv_v2} == ${inv_v1} + 1 — merely PROPOSING adj1 already consumed ${inv_v1}, with no apply involved"
            - "GET /billing-adjustments returns total_count == 2 (${adj1} and ${adj2}), both PROPOSED, and Invoice.${inv}.pending_adjustment_count == 2 with net_amount_cents still 2660"
