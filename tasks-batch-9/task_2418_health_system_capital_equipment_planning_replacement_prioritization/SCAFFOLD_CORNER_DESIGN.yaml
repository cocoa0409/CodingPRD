      - name: funding_over_the_allocation_is_rejected_until_a_negotiated_quote_fits
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=77]
          - calculations.request_funded_amount
          - calculations.negotiated_capital_price
          - errors.ERR_ALLOCATION_INSUFFICIENT
