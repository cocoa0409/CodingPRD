# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Domain: residential-solar-portfolio-servicing  (api_prefix /servicing)
#
# Every instance is grounded in SCAFFOLD.yaml §1.1–§1.7 only. All numeric
# asserts below were produced by executing the §1.3 formulas against the
# §1.3 constants with Decimal ROUND_HALF_UP; none are estimates.
#
# Shared clock convention: the logical clock is set explicitly by the first
# call of every chain. The service default is 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: true_up_monthly_rolling_vs_annual_diverge_on_same_twelve_months
        grounds:
          - calculations.annual_guarantee_true_up
          - calculations.monthly_shortfall_credit
          - calculations.monthly_expected_production
          - entities.GuaranteeTrueUp.fields.method
          - entities.GuaranteeTrueUp.fields.annual_guarantee_floor_kwh
          - entities.GuaranteeTrueUp.fields.gross_credit_cents
          - concurrency_rules[expected_agreement_version]
        distinguishing_aspect: |
          MONTHLY_ROLLING sums twelve independently rounded per-month credit_cents
          figures while ANNUAL_TRUE_UP rounds once off an annual kWh total, so the
          identical twelve ProductionPeriod rows yield gross_credit_cents 5429 under
          MONTHLY_ROLLING and 4587 under ANNUAL_TRUE_UP — a fixed 842-cent delta.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, so contract year 1 (2025-01..2025-12) is fully elapsed."
            - "One PPA SolarAgreement, ACTIVE: term 20y, contract_start_date 2025-01-01, escalator_pct 0.029, base_ppa_rate_per_kwh_millicents 14750, guaranteed_annual_kwh 9600, guarantee_band_pct 0.05, system_dc_kw 7.20, on the NEM_2 tariff."
            - "Twelve ProductionPeriod rows for 2025-01..2025-12, every one RECONCILED (never CREDIT_ISSUED), metered_kwh = 400, 580, 780, 900, 900, 950, 1000, 980, 800, 690, 450, 380."
            - "Per-month guarantee_floor_kwh = 474, 565, 757, 894, 994, 1021, 1031, 967, 848, 694, 484, 392; per-month shortfall_kwh = 74, 0, 0, 0, 94, 71, 31, 0, 48, 4, 34, 12; per-month credit_cents = 1092, 0, 0, 0, 1387, 1047, 457, 0, 708, 59, 502, 177."
            - "agreement.credit_earned_cents is 0 because no month issued its credit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { ho1_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { t_nem2_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${ho1_id}", tariff_id: "${t_nem2_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ag1_id: $.data.id }
            - call: "POST /servicing/agreements/${ag1_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 1, metered_kwh: 400, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { p2025_01_id: $.data.id }
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 2, metered_kwh: 580, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 3, metered_kwh: 780, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 4, metered_kwh: 900, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 5, metered_kwh: 900, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 6, metered_kwh: 950, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 7, metered_kwh: 1000, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 8, metered_kwh: 980, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 9, metered_kwh: 800, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 10, metered_kwh: 690, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 11, metered_kwh: 450, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2025, period_month: 12, metered_kwh: 380, auto_reconcile: true, auto_issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "GET /servicing/agreements/${ag1_id}"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ag1_ver_a: $.data.version }
          trigger:
            - call: "POST /servicing/guarantee-true-ups"
              payload: { agreement_id: "${ag1_id}", contract_year: 1, method: "MONTHLY_ROLLING", expected_agreement_version: "${ag1_ver_a}" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { tu_roll_id: $.data.id }
            - call: "GET /servicing/agreements/${ag1_id}"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ag1_ver_b: $.data.version }
            - call: "POST /servicing/guarantee-true-ups"
              payload: { agreement_id: "${ag1_id}", contract_year: 1, method: "ANNUAL_TRUE_UP", expected_agreement_version: "${ag1_ver_b}" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { tu_annual_id: $.data.id }
          assert:
            - "GuaranteeTrueUp.${tu_roll_id}.method == MONTHLY_ROLLING"
            - "GuaranteeTrueUp.${tu_roll_id}.total_metered_kwh == 8810"
            - "GuaranteeTrueUp.${tu_roll_id}.total_adjusted_expected_kwh == 9601"
            - "GuaranteeTrueUp.${tu_roll_id}.annual_guarantee_floor_kwh == 0"
            - "GuaranteeTrueUp.${tu_roll_id}.annual_shortfall_kwh == 368"
            - "GuaranteeTrueUp.${tu_roll_id}.credit_rate_millicents == 0"
            - "GuaranteeTrueUp.${tu_roll_id}.gross_credit_cents == 5429"
            - "GuaranteeTrueUp.${tu_roll_id}.already_issued_credit_cents == 0"
            - "GuaranteeTrueUp.${tu_roll_id}.net_credit_cents == 5429"
            - "GuaranteeTrueUp.${tu_roll_id}.status == DRAFT"
            - "length(GuaranteeTrueUp.${tu_roll_id}.covered_period_ids) == 12"
            - "GuaranteeTrueUp.${tu_roll_id}.covered_period_ids[0] == ${p2025_01_id}"
            - "GuaranteeTrueUp.${tu_annual_id}.method == ANNUAL_TRUE_UP"
            - "GuaranteeTrueUp.${tu_annual_id}.total_metered_kwh == 8810"
            - "GuaranteeTrueUp.${tu_annual_id}.total_adjusted_expected_kwh == 9601"
            - "GuaranteeTrueUp.${tu_annual_id}.annual_guarantee_floor_kwh == 9121"
            - "GuaranteeTrueUp.${tu_annual_id}.annual_shortfall_kwh == 311"
            - "GuaranteeTrueUp.${tu_annual_id}.credit_rate_millicents == 14750"
            - "GuaranteeTrueUp.${tu_annual_id}.gross_credit_cents == 4587"
            - "GuaranteeTrueUp.${tu_annual_id}.net_credit_cents == 4587"
            - "GuaranteeTrueUp.${tu_roll_id}.net_credit_cents - GuaranteeTrueUp.${tu_annual_id}.net_credit_cents == 842"
            - "SolarAgreement.${ag1_id}.credit_earned_cents == 0 (both true-ups are still DRAFT)"
            - "SolarAgreement.${ag1_id}.credit_balance_cents == 0"

      - name: payoff_npv_vs_unamortized_diverge_on_identical_terms
        grounds:
          - calculations.transfer_payoff_quote
          - calculations.escalated_billing_rate
          - entities.TransferCase.fields.payoff_method
          - entities.TransferCase.fields.payoff_quote_cents
          - entities.TransferCase.fields.remaining_term_months
          - state_machines.TransferCase.INITIATED_to_TITLE_CLEARED
        distinguishing_aspect: |
          Two agreements carrying byte-identical economic terms and the same
          2026-09-01 closing produce payoff_quote_cents 2090599 under the PREPAYMENT
          variant NPV_REMAINING_PAYMENTS and 2962000 under the RELOCATION variant
          UNAMORTIZED_SYSTEM_COST — the variant is selected by transfer_type, not by
          any difference in the priced data.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "Two ACTIVE PPA agreements with identical terms (term 20y, start 2025-01-01, escalator 0.029, base rate 14750 millicents, 9600 kWh, 7.20 kW) held by the same homeowner, differing only in site_address."
            - "No UccFiling exists for either agreement, so the title-clearance filing precondition holds vacuously."
            - "For a 2026-09-01 closing both cases derive elapsed_term_months 20 and remaining_term_months 220."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { ho1_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { t_nem2_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${ho1_id}", tariff_id: "${t_nem2_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ag_pre_id: $.data.id }
            - call: "POST /servicing/agreements/${ag_pre_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${ho1_id}", tariff_id: "${t_nem2_id}", site_address: "922 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ag_rel_id: $.data.id }
            - call: "POST /servicing/agreements/${ag_rel_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
          trigger:
            - call: "POST /servicing/transfer-cases"
              payload: { agreement_id: "${ag_pre_id}", transfer_type: "PREPAYMENT", closing_date: "2026-09-01" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { tc_pre_id: $.data.id }
            - call: "POST /servicing/transfer-cases/${tc_pre_id}/clear-title"
              payload: {}
              as: TitleAgent
              as_user_id: "u_title_1"
            - call: "POST /servicing/transfer-cases"
              payload: { agreement_id: "${ag_rel_id}", transfer_type: "RELOCATION", closing_date: "2026-09-01", new_site_address: "440 Juniper Ct, Fremont CA" }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { tc_rel_id: $.data.id }
            - call: "POST /servicing/transfer-cases/${tc_rel_id}/clear-title"
              payload: {}
              as: TitleAgent
              as_user_id: "u_title_1"
          assert:
            - "TransferCase.${tc_pre_id}.status == TITLE_CLEARED"
            - "TransferCase.${tc_pre_id}.elapsed_term_months == 20"
            - "TransferCase.${tc_pre_id}.remaining_term_months == 220"
            - "TransferCase.${tc_pre_id}.payoff_method == NPV_REMAINING_PAYMENTS"
            - "TransferCase.${tc_pre_id}.payoff_quote_cents == 2090599"
            - "TransferCase.${tc_rel_id}.status == TITLE_CLEARED"
            - "TransferCase.${tc_rel_id}.elapsed_term_months == 20"
            - "TransferCase.${tc_rel_id}.remaining_term_months == 220"
            - "TransferCase.${tc_rel_id}.payoff_method == UNAMORTIZED_SYSTEM_COST"
            - "TransferCase.${tc_rel_id}.payoff_quote_cents == 2962000"
            - "TransferCase.${tc_rel_id}.payoff_quote_cents - TransferCase.${tc_pre_id}.payoff_quote_cents == 871401"
            - "SolarAgreement.${ag_rel_id}.service_status == DECOMMISSION_PENDING"
            - "SolarAgreement.${ag_pre_id}.service_status == IN_SERVICE"
            - "TransferCase.${tc_pre_id}.buyer_homeowner_id is null and TransferCase.${tc_pre_id}.new_site_address is null"
            - "Discounting each of the 19 annual buckets to whole cents and then summing gives 2090599; summing the unrounded discounted buckets and rounding once gives 2090598, which is wrong"

  - rule_id: combinatorial_formula
    instances:

      - name: ppa_rate_rounded_before_multiplying_metered_kwh
        grounds:
          - calculations.escalated_billing_rate
          - calculations.period_net_settlement
          - entities.ProductionPeriod.fields.escalated_rate_millicents
          - entities.ProductionPeriod.fields.gross_due_cents
          - entities.ProductionPeriod.fields.escalated_monthly_rent_cents
        distinguishing_aspect: |
          Contract year 2 of a 0.029 escalator on a 14750-millicent base gives the
          exact rate 15177.750, which the pinned order rounds to 15178 BEFORE
          multiplying by 902 metered kWh — yielding gross_due_cents 13691, whereas
          deferring the rounding to the final cent figure yields 13690.
        test_recipe:
          setup:
            - "Clock at 2026-05-15T00:00:00Z, so April 2026 is fully elapsed and its due_date 2026-05-21 has not yet passed (late_fee_cents must be 0)."
            - "One ACTIVE PPA agreement: start 2025-01-01, escalator_pct 0.029, base_ppa_rate_per_kwh_millicents 14750, guaranteed_annual_kwh 9600, guarantee_band_pct 0.05."
            - "April 2026 falls in contract_year 2; gross_expected_kwh 941 and guarantee_floor_kwh 894, so metered_kwh 902 produces no shortfall and no credit interference."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-15T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { ho1_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { t_nem2_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${ho1_id}", tariff_id: "${t_nem2_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { ag1_id: $.data.id }
            - call: "POST /servicing/agreements/${ag1_id}/activate"
              payload: {}
              as: ServicingAgent
              as_user_id: "u_agent_1"
            - call: "POST /servicing/production-periods"
              payload: { agreement_id: "${ag1_id}", period_year: 2026, period_month: 4, metered_kwh: 902 }
              as: ServicingAgent
              as_user_id: "u_agent_1"
              captures: { p_apr_id: $.data.id }
          trigger:
            - call: "POST /servicing/production-periods/${p_apr_id}/reconcile"
              payload: { issue_credit: false }
              as: ServicingAgent
              as_user_id: "u_agent_1"
          assert:
            - "ProductionPeriod.${p_apr_id}.contract_year == 2"
            - "ProductionPeriod.${p_apr_id}.escalated_rate_millicents == 15178"
            - "ProductionPeriod.${p_apr_id}.escalated_monthly_rent_cents == 0"
            - "ProductionPeriod.${p_apr_id}.gross_expected_kwh == 941"
            - "ProductionPeriod.${p_apr_id}.excused_days == 0"
            - "ProductionPeriod.${p_apr_id}.adjusted_expected_kwh == 941"
            - "ProductionPeriod.${p_apr_id}.guarantee_floor_kwh == 894"
            - "ProductionPeriod.${p_apr_id}.shortfall_kwh == 0"
            - "ProductionPeriod.${p_apr_id}.credit_cents == 0"
            - "ProductionPeriod.${p_apr_id}.gross_due_cents == 13691"
            - "ProductionPeriod.${p_apr_id}.credit_applied_cents == 0"
            - "ProductionPeriod.${p_apr_id}.net_due_cents == 13691"
            - "ProductionPeriod.${p_apr_id}.due_date == 2026-05-21"
            - "ProductionPeriod.${p_apr_id}.late_fee_cents == 0"
            - "ProductionPeriod.${p_apr_id}.total_invoiced_cents == 13691"
            - "ProductionPeriod.${p_apr_id}.status == RECONCILED"
            - "gross_due_cents is NOT 13690, the value produced by multiplying the unrounded 15177.750 by 902"

      - name: late_fee_on_net_after_credit_and_credit_read_before_own_issue
        grounds:
          - calculations.period_net_settlement
          - calculations.monthly_shortfall_credit
          - entities.ProductionPeriod.fields.credit_applied_cents
          - entities.ProductionPeriod.fields.late_fee_cents
          - entities.SolarAgreement.fields.credit_balance_cents
          - state_machines.ProductionPeriod.RECORDED_to_CREDIT_ISSUED
        distinguishing_aspect: |
          Two independent evaluation-order traps fire in one chain: January 2025 both
          earns 1092 cents of credit and is invoiced, yet its credit_applied_cents is
          0 because the balance is read before its own credit is issued; February 2025
          then draws that 1092 and its late fee is 112 = 1.5% of net 7463, not 128 =
          1.5% of gross 8555.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z, far past both months' due dates (2025-02-21 and 2025-03-21)."
            - "One ACTIVE PPA agreement: start 2025-01-01, escalator_pct 0.029, base rate 14750 millicents, 9600 kWh, band 0.05; contract-year-1 escalated rate is 14750."
            - "agreement.credit_balance_cents is 0 before either month is settled."
            - "January 2025: gross_expected 499, floor 474, metered 400 -> shortfall 74, credit 1092. February 2025: gross_expected 595, floor 565, metered 580 -> shortfall 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /servicing/homeowners"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@example.com", state_code: "CA", fico_score: 742, dti_ratio: 0.28, monthly_income_cents: 1150000 }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { ho1_id: $.data.id }
            - call: "POST /servicing/utility-tariffs"
              payload: { utility_code: "PGE", tariff_code: "NEM2-ETOUC", generation: "NEM_2", retail_rate_per_kwh_millicents: 32500, export_credit_rate_per_kwh_millicents: 28000, monthly_fixed_charge_cents: 1500, effective_from_date: "2020-04-15", grandfathers_predecessors: true }
              as: PortfolioAdmin
              as_user_id: "u_admin_1"
              captures: { t_nem2_id: $.data.id }
            - call: "POST /servicing/agreements"
              payload: { homeowner_id: "${ho1_id}", tariff_id: "${t_nem2_id}", site_address: "918 Alder Way, Fremont CA", state_code: "CA", product_type: "PPA", term_years: 20, contract_start_date: "2025-01-01", escalator_pct: 0.029, guaranteed_annual_kwh: 9600, system_dc_kw: 7.20, guarantee_band_pct: 0.05, base_ppa_rate_per_kwh_millicents: 14750 }
              as: ServicingAgent
