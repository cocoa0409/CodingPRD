            - call: "POST /comp/self-assessments/${sa}/review-decision"
              payload: { decision: "ACCEPT" }
              as: CommitteeMember
              as_user_id: "${cm1}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "PEER_REVIEW" }
              as: CycleAdmin
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "DELIBERATION" }
              as: CycleAdmin
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${subj}", committee_member_id: "${cm1}" }
              as: CycleAdmin
              captures: { b1: "$.data[0].id" }
            - call: "GET /comp/ballots"
              payload: { subject_partner_id: "${subj}", committee_member_id: "${cm2}" }
              as: CycleAdmin
              captures: { b2: "$.data[0].id" }
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv1: "$.data.version" }
            - call: "POST /comp/ballots/${b1}/cast"
              payload: { action: "CAST", points_proposed: 800.00, rationale: "Outstanding origination year.", expected_cycle_version: "${cyv1}" }
              as: CommitteeMember
              as_user_id: "${cm1}"
            - call: "GET /comp/cycles/${cy}"
              payload: {}
              as: CycleAdmin
              captures: { cyv2: "$.data.version" }
            - call: "POST /comp/ballots/${b2}/cast"
              payload: { action: "CAST", points_proposed: 600.00, rationale: "Solid but not exceptional.", expected_cycle_version: "${cyv2}" }
              as: CommitteeMember
              as_user_id: "${cm2}"
            - call: "POST /comp/cycles/${cy}/advance"
              payload: { target_state: "AWARDS_PUBLISHED" }
              as: CycleAdmin
            - call: "GET /comp/awards"
              payload: { cycle_id: "${cy}", partner_id: "${subj}" }
