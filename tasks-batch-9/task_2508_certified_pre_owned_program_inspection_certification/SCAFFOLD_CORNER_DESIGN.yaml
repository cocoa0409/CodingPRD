  # ===========================================================================
  # 2. From Table 1.2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: checklist_template_publish_retires_earlier_published_template
        claim_type: side_effect_execution
        grounds:
          - state_machines[ChecklistTemplate].transitions[DRAFT->PUBLISHED]
          - state_machines[ChecklistTemplate].transitions[PUBLISHED->RETIRED]
          - entities.ChecklistTemplate.fields.published_at
        distinguishing_aspect: |
          Publishing is not a local state change: it retires every already-PUBLISHED template whose
          effective_from is <= the new one's, and the comparison direction matters. Publishing
          MPI-173 (2026-06-01) retires MPI-172 (2026-01-01), but publishing the back-dated MPI-171
          (2025-01-01) afterwards retires nothing, because 2026-06-01 <= 2025-01-01 is false, so two
          PUBLISHED templates legitimately coexist.
        test_recipe:
          setup:
            - "Three DRAFT templates, each carrying at least one CRITICAL point so publish is legal."
          setup_api_calls:
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-172", effective_from: "2026-01-01" }
              as: ProgramAdministrator
              captures: { tA: $.data.id }
            - call: "POST /cpo/checklist-templates/${tA}/items"
              payload: { item_code: "P1", category: "POWERTRAIN", severity: "CRITICAL", pass_criteria: "no engine or transmission fault codes", reconditioning_allowed: false }
              as: ProgramAdministrator
            - call: "POST /cpo/checklist-templates"
              payload: { code: "MPI-173", effective_from: "2026-06-01" }
              as: ProgramAdministrator
