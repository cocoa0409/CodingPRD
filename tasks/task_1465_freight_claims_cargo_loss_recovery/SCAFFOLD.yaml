scenario: |
  Freight Claims & Cargo Loss Recovery (shipper claims department): claim intake
  & documentation (BOL/invoice/photos), carrier liability determination &
  limitation of liability, salvage disposition & credit, filing deadline &
  acknowledgment clock, declined claim appeal & escalation, subrogation against
  responsible party, claim-ratio analytics by carrier/lane, settlement authority
  & reserve.

domain_name: freight-claims-cargo-loss
api_prefix: /freight-claims

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: scac_code, type: string, source: input, description: "Standard Carrier Alpha Code; unique per carrier" }
      - { name: legal_name, type: string, source: input, description: "Carrier legal entity name" }
      - { name: liability_model, type: enum, source: input, description: "FULL_VALUE | RELEASED_RATE | PER_PACKAGE | PER_POUND — governs limitation-of-liability algorithm selection" }
      - { name: released_rate_cents_per_lb, type: integer, source: input, description: "Released-rate valuation in cents per pound; only meaningful when liability_model == RELEASED_RATE" }
      - { name: per_package_cap_cents, type: integer, source: input, description: "Per-package cap in cents; only meaningful when liability_model == PER_PACKAGE" }
      - { name: per_pound_cap_cents, type: integer, source: input, description: "Per-pound cap in cents; only meaningful when liability_model == PER_POUND" }
      - { name: max_auto_settle_cents, type: integer, source: input, description: "Maximum settlement amount a ClaimsAdjuster may auto-approve for this carrier without escalation" }
      - { name: carmack_acknowledgment_days, type: integer, source: input, default: 30, description: "Carmack Amendment acknowledgment window in calendar days" }
      - { name: carmack_filing_days, type: integer, source: input, default: 270, description: "Carmack Amendment minimum civil-action filing window in calendar days (floor 270 by law; may be longer by contract)" }
      - { name: claims_filed_count, type: integer, source: computed, default: 0, description: "Running count of claims that ever reached FILED state for this carrier" }
      - { name: claims_paid_count, type: integer, source: computed, default: 0, description: "Running count of claims that reached PAID or CLOSED_WITH_PAYMENT" }
      - { name: claim_ratio_bp, type: integer, source: computed, default: 0, description: "Claims paid ratio in basis points = round(claims_paid_count * 10000 / max(claims_filed_count, 1))" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED" }

  - name: Lane
    parent: null
    common_fields: true
    fields:
      - { name: origin_zip3, type: string, source: input, description: "Origin ZIP-3 prefix" }
      - { name: destination_zip3, type: string, source: input, description: "Destination ZIP-3 prefix" }
      - { name: baseline_claim_ratio_bp, type: integer, source: input, description: "Industry-baseline claim ratio in basis points for this lane; used by claim_ratio_analytics" }
      - { name: shipments_count, type: integer, source: computed, default: 0, description: "Count of shipments on this lane" }
      - { name: claims_count, type: integer, source: computed, default: 0, description: "Count of FILED claims referencing shipments on this lane" }
      - { name: lane_claim_ratio_bp, type: integer, source: computed, default: 0, description: "round(claims_count * 10000 / max(shipments_count, 1))" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: CarrierLaneAssignment
    parent: null
    common_fields: false
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id" }
      - { name: contracted_discount_pct, type: integer, source: input, description: "Negotiated discount percent (0-100) applied to standard liability limit on this lane" }
      - { name: effective_from, type: datetime, source: input, description: "Start of assignment effectiveness (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "End of assignment effectiveness (exclusive); must be > effective_from" }

  - name: Shipment
    parent: null
    common_fields: true
    fields:
      - { name: bol_number, type: string, source: input, description: "Bill of lading number; unique" }
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id" }
      - { name: lane_id, type: string, source: input, description: "FK -> Lane.id" }
      - { name: ship_date, type: datetime, source: input, description: "Pickup/ship date-time (UTC)" }
      - { name: delivery_date, type: datetime, source: input, description: "Actual delivery date-time (UTC); must be >= ship_date" }
      - { name: declared_value_cents, type: integer, source: input, description: "Shipper-declared full invoice value in cents" }
      - { name: total_weight_lbs, type: integer, source: input, description: "Total shipped weight in whole pounds; > 0" }
      - { name: package_count, type: integer, source: input, description: "Number of packages; > 0" }
      - { name: commodity_class, type: enum, source: input, description: "GENERAL | FRAGILE | PERISHABLE | HIGH_VALUE | HAZMAT" }
      - { name: is_concealed_damage, type: boolean, source: input, default: false, description: "True if damage discovered after delivery without notation" }
      - { name: status, type: enum, source: system, description: "DELIVERED | CLAIMED | CLOSED" }

  - name: Claim
    parent: Shipment
    common_fields: true
    fields:
      - { name: shipment_id, type: string, source: system, description: "FK -> Shipment.id" }
      - { name: carrier_id, type: string, source: system, description: "FK -> Carrier.id (denormalized from Shipment for analytics)" }
      - { name: lane_id, type: string, source: system, description: "FK -> Lane.id (denormalized from Shipment for analytics)" }
      - { name: claim_type, type: enum, source: input, description: "LOSS | DAMAGE | SHORTAGE | CONCEALED_DAMAGE | DELAY" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount shipper demands; > 0; <= shipment.declared_value_cents" }
      - { name: filing_received_at, type: datetime, source: system, description: "Server-stamped time the claim was first submitted" }
      - { name: filing_deadline_at, type: datetime, source: computed, description: "= ship_date + carrier.carmack_filing_days (calendar days); computed at intake" }
      - { name: acknowledgment_due_at, type: datetime, source: computed, description: "= filing_received_at + carrier.carmack_acknowledgment_days" }
      - { name: acknowledged_at, type: datetime, source: system, description: "Null until carrier acknowledgment recorded" }
      - { name: acknowledgment_late, type: boolean, source: computed, default: false, description: "True if acknowledged_at > acknowledgment_due_at (set on acknowledge transition or by scheduler)" }
      - { name: liability_assessment_id, type: string, source: system, description: "FK -> LiabilityAssessment.id; null until assessment created" }
      - { name: computed_liability_cents, type: integer, source: computed, default: 0, description: "Result of limitation_of_liability calculation at latest assessment" }
      - { name: salvage_credit_cents, type: integer, source: computed, default: 0, description: "Sum of credits posted by salvage dispositions on this claim" }
      - { name: net_exposure_cents, type: integer, source: computed, default: 0, description: "max(computed_liability_cents - salvage_credit_cents, 0); recomputed on every assessment and salvage posting" }
      - { name: reserve_amount_cents, type: integer, source: computed, default: 0, description: "Current open reserve; equals active Reserve.amount_cents if any, else 0" }
      - { name: settlement_amount_cents, type: integer, source: system, description: "Final accepted settlement; null until PAID/CLOSED_WITH_PAYMENT" }
      - { name: appeal_round, type: integer, source: system, default: 0, description: "Count of appeal rounds completed" }
      - { name: filing_status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACKNOWLEDGED | UNDER_REVIEW | OFFERED | DECLINED | APPEALED | PAID | CLOSED_WITH_PAYMENT | CLOSED_NO_PAYMENT | WITHDRAWN | TIME_BARRED" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID | PARTIAL | PAID_IN_FULL | WAIVED — parallel dimension, independent of filing_status" }
      - { name: concurrency_token, type: integer, source: system, description: "OCC version integer; mirrors version, required by assessment/settlement writers" }

  - name: ClaimDocument
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: document_kind, type: enum, source: input, description: "BOL | COMMERCIAL_INVOICE | PHOTO | DELIVERY_RECEIPT | INSPECTION_REPORT | REPAIR_ESTIMATE" }
      - { name: storage_uri, type: string, source: input, description: "Document storage reference" }
      - { name: captured_at, type: datetime, source: input, description: "When the document was created externally" }
      - { name: verification_status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED" }
      - { name: rejection_reason, type: string, source: system, description: "Free text; populated only when verification_status == REJECTED" }

  - name: LiabilityAssessment
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: assessed_by_user_id, type: string, source: system, description: "Opaque user id of the ClaimsAdjuster who performed the assessment" }
      - { name: liability_model_applied, type: enum, source: system, description: "Echo of Carrier.liability_model captured at assessment time (immutable snapshot)" }
      - { name: limitation_basis_cents, type: integer, source: computed, description: "Pre-limitation eligible amount (claimed_amount_cents capped by declared_value)" }
      - { name: carrier_limit_cents, type: integer, source: computed, description: "Result of carrier-specific cap (per-lb, per-package, or released-rate) BEFORE lane discount" }
      - { name: lane_discount_pct, type: integer, source: computed, description: "Discount applied from CarrierLaneAssignment effective at shipment.ship_date" }
      - { name: computed_liability_cents, type: integer, source: computed, description: "Final carrier liability after cap and lane discount; feeds Claim.computed_liability_cents" }
      - { name: negligence_flag, type: enum, source: input, description: "NONE | CARRIER_NEGLIGENT | SHIPPER_FAULT | ACT_OF_GOD | THIRD_PARTY" }
      - { name: state, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | SUPERSEDED" }

  - name: SalvageDisposition
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: disposition_kind, type: enum, source: input, description: "RETURN_TO_SHIPPER | AUCTION | DESTROY | DONATE | REPAIR_AND_RETURN" }
      - { name: gross_proceeds_cents, type: integer, source: input, description: "Gross salvage proceeds; >= 0" }
      - { name: handling_cost_cents, type: integer, source: input, description: "Cost of disposition; >= 0" }
      - { name: net_credit_cents, type: integer, source: computed, description: "max(gross_proceeds_cents - handling_cost_cents, 0); feeds Claim.salvage_credit_cents" }
      - { name: scheduled_at, type: datetime, source: input, description: "Future time at which disposition executes" }
      - { name: state, type: enum, source: system, description: "SCHEDULED | EXECUTED | CANCELLED" }

  - name: Appeal
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: round_number, type: integer, source: system, description: "1-indexed; unique per claim" }
      - { name: opened_by_user_id, type: string, source: system, description: "Adjuster or manager who opened the appeal" }
      - { name: justification, type: string, source: input, description: "Appeal narrative" }
      - { name: requested_amount_cents, type: integer, source: input, description: "Amount appellant seeks; > 0" }
      - { name: decision, type: enum, source: system, description: "PENDING | UPHOLD_DECLINE | OVERTURN | PARTIAL" }
      - { name: decided_amount_cents, type: integer, source: system, description: "Null until decision in {OVERTURN, PARTIAL}" }
      - { name: escalated_to_user_id, type: string, source: system, description: "Null until escalated to ClaimsManager" }
      - { name: state, type: enum, source: system, description: "OPEN | UNDER_ESCALATION | DECIDED | CLOSED" }

  - name: Settlement
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: round_number, type: integer, source: system, description: "1-indexed; unique per claim; incremented per offer cycle" }
      - { name: offered_by_role, type: enum, source: system, description: "ADJUSTER | MANAGER | CARRIER — who proposed this offer" }
      - { name: amount_cents, type: integer, source: input, description: "Offered amount; > 0" }
      - { name: authority_tier_required, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 — derived from amount vs carrier.max_auto_settle_cents and global thresholds" }
      - { name: approved_by_user_id, type: string, source: system, description: "Null until accepted" }
      - { name: state, type: enum, source: system, description: "OFFERED | ACCEPTED | COUNTERED | REJECTED | WITHDRAWN | EXPIRED" }

  - name: SubrogationCase
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: responsible_party_kind, type: enum, source: input, description: "THIRD_PARTY_CARRIER | WAREHOUSE | BROKER | SHIPPER_VENDOR | OTHER" }
      - { name: responsible_party_name, type: string, source: input, description: "Legal name of pursued party" }
      - { name: target_recovery_cents, type: integer, source: input, description: "Amount sought from third party; > 0" }
      - { name: recovered_cents, type: integer, source: computed, default: 0, description: "Sum of posted recovery events" }
      - { name: recovery_ratio_bp, type: integer, source: computed, default: 0, description: "round(recovered_cents * 10000 / target_recovery_cents)" }
      - { name: state, type: enum, source: system, description: "OPEN | DEMAND_SENT | IN_LITIGATION | SETTLED | CLOSED_UNRECOVERABLE" }

  - name: Reserve
    parent: Claim
    common_fields: true
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: amount_cents, type: integer, source: input, description: "Reserve amount; >= 0" }
      - { name: posted_by_user_id, type: string, source: system, description: "Opaque id of FinanceController" }
      - { name: posted_at, type: datetime, source: system, description: "Server timestamp" }
      - { name: released_at, type: datetime, source: system, description: "Null until released" }
      - { name: state, type: enum, source: system, description: "OPEN | RELEASED | EXHAUSTED" }

  - name: ClaimEvent
    parent: Claim
    common_fields: false
    fields:
      - { name: claim_id, type: string, source: system, description: "FK -> Claim.id" }
      - { name: event_kind, type: enum, source: system, description: "FILED | ACKNOWLEDGED | ASSESSED | OFFER_EXTENDED | OFFER_ACCEPTED | OFFER_REJECTED | DECLINED | APPEAL_OPENED | APPEAL_DECIDED | SALVAGE_POSTED | RESERVE_POSTED | RESERVE_RELEASED | PAID_OUT | SUBROGATION_OPENED | SUBROGATION_RECOVERY | WITHDRAWN | TIME_BARRED | ACK_LATE_FLAGGED" }
      - { name: actor_user_id, type: string, source: system, description: "Who/what triggered; 'system' for scheduler" }
      - { name: event_at, type: datetime, source: system, description: "Server timestamp (from logical clock)" }
      - { name: payload_json, type: object, source: system, description: "Arbitrary event-specific payload snapshot" }

  - name: ClaimsCalendar
    parent: null
    common_fields: true
    fields:
      - { name: calendar_date, type: string, source: input, description: "ISO8601 date (YYYY-MM-DD) the calendar row governs" }
      - { name: is_business_day, type: boolean, source: input, description: "False for weekends/holidays" }
      - { name: day_kind, type: enum, source: input, description: "BUSINESS | WEEKEND | HOLIDAY" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Claim
    initial_state: DRAFT
    terminal_states: [PAID, CLOSED_WITH_PAYMENT, CLOSED_NO_PAYMENT, WITHDRAWN, TIME_BARRED]
    note: |
      Claim has TWO parallel state dimensions that evolve semi-independently:
      (a) filing_status tracks the claim workflow; (b) payment_status tracks
      remittance. They cross-gate in specific places: PAID filing_status requires
      payment_status PAID_IN_FULL, and partial payouts are permitted only when
      filing_status is OFFERED/ACCEPTED-via-Settlement.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /freight-claims/claims/{id}/submit"
        actor: ClaimsClerk
        preconditions:
          - "claim.filing_status == DRAFT (ERR_CLAIM_INVALID_STATE)"
          - "at least one ClaimDocument with document_kind == BOL and verification_status != REJECTED exists for this claim (ERR_REQUIRED_DOCUMENT_MISSING)"
          - "at least one ClaimDocument with document_kind == COMMERCIAL_INVOICE and verification_status != REJECTED exists (ERR_REQUIRED_DOCUMENT_MISSING)"
          - "logical clock now <= claim.filing_deadline_at (ERR_FILING_DEADLINE_PASSED)"
          - "claim.claimed_amount_cents <= shipment.declared_value_cents (ERR_CLAIM_AMOUNT_EXCEEDS_DECLARED_VALUE)"
        side_effects:
          - "filing_received_at := now()"
          - "filing_deadline_at := shipment.ship_date + carrier.carmack_filing_days"
          - "acknowledgment_due_at := now() + carrier.carmack_acknowledgment_days"
          - "carrier.claims_filed_count += 1; recompute carrier.claim_ratio_bp"
          - "lane.claims_count += 1; recompute lane.lane_claim_ratio_bp"
          - "shipment.status := CLAIMED"
          - "append ClaimEvent FILED"
          - "claim.version += 1"

      - from: SUBMITTED
        to: ACKNOWLEDGED
        trigger: "POST /freight-claims/claims/{id}/acknowledge"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.filing_status == SUBMITTED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "acknowledged_at := now()"
          - "if acknowledged_at > acknowledgment_due_at: acknowledgment_late := true; append ClaimEvent ACK_LATE_FLAGGED"
          - "append ClaimEvent ACKNOWLEDGED"
          - "claim.version += 1"

      - from: ACKNOWLEDGED
        to: UNDER_REVIEW
        trigger: "POST /freight-claims/claims/{id}/assessments (creates LiabilityAssessment in SUBMITTED state)"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.filing_status == ACKNOWLEDGED (ERR_CLAIM_INVALID_STATE)"
          - "all ClaimDocument for this claim have verification_status == VERIFIED (ERR_DOCUMENTS_NOT_VERIFIED)"
        side_effects:
          - "compute LiabilityAssessment fields via limitation_of_liability calculation"
          - "claim.computed_liability_cents := assessment.computed_liability_cents"
          - "claim.liability_assessment_id := new assessment id"
          - "claim.net_exposure_cents := max(computed_liability_cents - salvage_credit_cents, 0)"
          - "append ClaimEvent ASSESSED"
          - "claim.version += 1"

      - from: UNDER_REVIEW
        to: OFFERED
        trigger: "POST /freight-claims/claims/{id}/settlements (creates Settlement in OFFERED state)"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.filing_status == UNDER_REVIEW (ERR_CLAIM_INVALID_STATE)"
          - "claim.liability_assessment_id is not null (ERR_ASSESSMENT_REQUIRED)"
          - "request body expected_claim_version matches claim.version (ERR_STALE_VERSION)"
        side_effects:
          - "settlement.authority_tier_required computed via settlement_authority calculation"
          - "if authority_tier_required == TIER_1 and actor is ClaimsAdjuster: allowed; else require TIER_2 (ClaimsManager) or TIER_3 (FinanceController) approval chain before transition completes"
          - "claim.version += 1"
          - "append ClaimEvent OFFER_EXTENDED"

      - from: OFFERED
        to: PAID
        trigger: "POST /freight-claims/claims/{id}/settlements/{settlementId}/accept"
        actor: ClaimsManager
        preconditions:
          - "claim.filing_status == OFFERED (ERR_CLAIM_INVALID_STATE)"
          - "settlement.state == OFFERED (ERR_SETTLEMENT_INVALID_STATE)"
          - "settlement.amount_cents <= claim.net_exposure_cents (ERR_SETTLEMENT_EXCEEDS_NET_EXPOSURE)"
          - "actor has settlement authority >= settlement.authority_tier_required (ERR_AUTHORITY_TIER_INSUFFICIENT)"
          - "actor_user_id != settlement initiated-by user id AND actor_user_id != assessment.assessed_by_user_id (segregation-of-duties) (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
          - "claim.reserve_amount_cents >= settlement.amount_cents (ERR_RESERVE_INSUFFICIENT)"
        side_effects:
          - "settlement.state := ACCEPTED; settlement.approved_by_user_id := actor"
          - "claim.settlement_amount_cents := settlement.amount_cents"
          - "claim.payment_status := PAID_IN_FULL if amount == net_exposure else PARTIAL"
          - "claim.filing_status := PAID if amount == net_exposure else CLOSED_WITH_PAYMENT"
          - "release active Reserve: reserve.state := EXHAUSTED, released_at := now(); claim.reserve_amount_cents := 0"
          - "carrier.claims_paid_count += 1; recompute claim_ratio_bp"
          - "append ClaimEvent OFFER_ACCEPTED and PAID_OUT"
          - "claim.version += 1"

      - from: OFFERED
        to: UNDER_REVIEW
        trigger: "POST /freight-claims/claims/{id}/settlements/{settlementId}/counter"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.filing_status == OFFERED (ERR_CLAIM_INVALID_STATE)"
          - "settlement.state == OFFERED (ERR_SETTLEMENT_INVALID_STATE)"
        side_effects:
          - "settlement.state := COUNTERED"
          - "claim.version += 1"

      - from: UNDER_REVIEW
        to: DECLINED
        trigger: "POST /freight-claims/claims/{id}/decline"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.filing_status == UNDER_REVIEW (ERR_CLAIM_INVALID_STATE)"
          - "claim.liability_assessment_id is not null (ERR_ASSESSMENT_REQUIRED)"
          - "request body expected_claim_version matches claim.version (ERR_STALE_VERSION)"
        side_effects:
          - "append ClaimEvent DECLINED"
          - "claim.version += 1"

      - from: DECLINED
        to: APPEALED
        trigger: "POST /freight-claims/claims/{id}/appeals (creates Appeal in OPEN state)"
        actor: ClaimsAdjuster
        preconditions:
          - "claim.filing_status == DECLINED (ERR_CLAIM_INVALID_STATE)"
          - "claim.appeal_round < 2 (ERR_APPEAL_ROUND_EXHAUSTED)"
        side_effects:
          - "claim.appeal_round += 1"
          - "append ClaimEvent APPEAL_OPENED"
          - "claim.version += 1"

      - from: APPEALED
        to: UNDER_REVIEW
        trigger: "POST /freight-claims/claims/{id}/appeals/{appealId}/decide with decision == OVERTURN"
        actor: ClaimsManager
        preconditions:
          - "claim.filing_status == APPEALED (ERR_CLAIM_INVALID_STATE)"
          - "appeal.state in {OPEN, UNDER_ESCALATION} (ERR_APPEAL_INVALID_STATE)"
          - "actor_user_id != appeal.opened_by_user_id (segregation of duties) (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects:
          - "appeal.state := DECIDED; appeal.decision := OVERTURN; appeal.decided_amount_cents := body.decided_amount_cents"
          - "claim.computed_liability_cents := decided_amount_cents (overturn replaces prior assessment for settlement purposes)"
          - "claim.net_exposure_cents := max(computed_liability_cents - salvage_credit_cents, 0)"
          - "append ClaimEvent APPEAL_DECIDED"
          - "claim.version += 1"

      - from: APPEALED
        to: DECLINED
        trigger: "POST /freight-claims/claims/{id}/appeals/{appealId}/decide with decision == UPHOLD_DECLINE"
        actor: ClaimsManager
        preconditions:
          - "claim.filing_status == APPEALED (ERR_CLAIM_INVALID_STATE)"
          - "appeal.state in {OPEN, UNDER_ESCALATION} (ERR_APPEAL_INVALID_STATE)"
        side_effects:
          - "appeal.state := DECIDED; appeal.decision := UPHOLD_DECLINE"
          - "append ClaimEvent APPEAL_DECIDED"
          - "claim.version += 1"

      - from: DECLINED
        to: CLOSED_NO_PAYMENT
        trigger: "POST /freight-claims/claims/{id}/close"
        actor: ClaimsManager
        preconditions:
          - "claim.filing_status == DECLINED (ERR_CLAIM_INVALID_STATE)"
          - "claim.appeal_round >= 2 OR explicit waive_appeal=true in body (ERR_APPEAL_PENDING)"
        side_effects:
          - "release any open Reserve: state := RELEASED, released_at := now(); claim.reserve_amount_cents := 0"
          - "append ClaimEvent RESERVE_RELEASED"
          - "claim.version += 1"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /freight-claims/claims/{id}/withdraw"
        actor: ClaimsClerk
        preconditions:
          - "claim.filing_status in {DRAFT, SUBMITTED, ACKNOWLEDGED} (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "shipment.status := DELIVERED (reverts if no other open claim)"
          - "claim.version += 1"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /freight-claims/claims/{id}/withdraw"
        actor: ClaimsClerk
        preconditions:
          - "claim.filing_status in {DRAFT, SUBMITTED, ACKNOWLEDGED} (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "carrier.claims_filed_count -= 1; recompute claim_ratio_bp"
          - "lane.claims_count -= 1; recompute lane_claim_ratio_bp"
          - "shipment.status := DELIVERED"
          - "claim.version += 1"

      - from: ACKNOWLEDGED
        to: WITHDRAWN
        trigger: "POST /freight-claims/claims/{id}/withdraw"
        actor: ClaimsClerk
        preconditions:
          - "claim.filing_status in {DRAFT, SUBMITTED, ACKNOWLEDGED} (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "carrier.claims_filed_count -= 1; recompute claim_ratio_bp"
          - "lane.claims_count -= 1; recompute lane_claim_ratio_bp"
          - "shipment.status := DELIVERED"
          - "claim.version += 1"

      - from: SUBMITTED
        to: TIME_BARRED
        trigger: "system (logical clock advances past filing_deadline_at without acknowledgment)"
        actor: system
        preconditions:
          - "now() > claim.filing_deadline_at"
          - "claim.filing_status == SUBMITTED"
        side_effects:
          - "carrier.claims_filed_count -= 1; recompute claim_ratio_bp"
          - "append ClaimEvent TIME_BARRED"
          - "claim.version += 1"

      - from: ACKNOWLEDGED
        to: TIME_BARRED
        trigger: "system (logical clock advances past filing_deadline_at + 365 without UNDER_REVIEW transition)"
        actor: system
        preconditions:
          - "now() > claim.filing_deadline_at + 365 days"
          - "claim.filing_status == ACKNOWLEDGED"
        side_effects:
          - "append ClaimEvent TIME_BARRED"
          - "claim.version += 1"

  - entity: ClaimDocument
    initial_state: PENDING
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /freight-claims/claims/{id}/documents/{docId}/verify"
        actor: ClaimsAdjuster
        preconditions:
          - "document.verification_status == PENDING (ERR_DOCUMENT_INVALID_STATE)"
          - "claim.filing_status in {DRAFT, SUBMITTED, ACKNOWLEDGED} (ERR_CLAIM_LOCKED)"
        side_effects: []
      - from: PENDING
        to: REJECTED
        trigger: "POST /freight-claims/claims/{id}/documents/{docId}/reject"
        actor: ClaimsAdjuster
        preconditions:
          - "document.verification_status == PENDING (ERR_DOCUMENT_INVALID_STATE)"
          - "body.rejection_reason is non-empty (ERR_REJECTION_REASON_REQUIRED)"
        side_effects: []

  - entity: LiabilityAssessment
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "system (on creation via POST /claims/{claimId}/assessments, computed immediately)"
        actor: system
        preconditions: []
        side_effects:
          - "drives Claim ACKNOWLEDGED -> UNDER_REVIEW transition"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /freight-claims/claims/{id}/assessments/{assessmentId}/approve"
        actor: ClaimsManager
        preconditions:
          - "assessment.state == SUBMITTED (ERR_ASSESSMENT_INVALID_STATE)"
          - "actor_user_id != assessment.assessed_by_user_id (segregation of duties) (ERR_SEGREGATION_OF_DUTIES_VIOLATION)"
        side_effects: []
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system (when a new LiabilityAssessment is created for the same Claim)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: SalvageDisposition
    initial_state: SCHEDULED
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: EXECUTED
        trigger: "POST /freight-claims/claims/{id}/salvage/{salvageId}/execute (or system when logical clock reaches scheduled_at)"
        actor: SalvageCoordinator
        preconditions:
          - "salvage.state == SCHEDULED (ERR_SALVAGE_INVALID_STATE)"
          - "now() >= salvage.scheduled_at (ERR_SALVAGE_NOT_YET_DUE)"
          - "claim.filing_status in {UNDER_REVIEW, OFFERED, DECLINED, APPEALED} (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "compute net_credit_cents = max(gross_proceeds_cents - handling_cost_cents, 0)"
          - "claim.salvage_credit_cents += net_credit_cents"
          - "claim.net_exposure_cents := max(computed_liability_cents - salvage_credit_cents, 0)"
          - "append ClaimEvent SALVAGE_POSTED"
          - "claim.version += 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /freight-claims/claims/{id}/salvage/{salvageId}/cancel"
        actor: SalvageCoordinator
        preconditions:
          - "salvage.state == SCHEDULED (ERR_SALVAGE_INVALID_STATE)"
        side_effects: []

  - entity: Appeal
    initial_state: OPEN
    terminal_states: [DECIDED, CLOSED]
    note: "Cyclic via Claim: Appeal DECIDED with UPHOLD_DECLINE -> Claim back to DECLINED -> new Appeal round allowed if appeal_round < 2"
    transitions:
      - from: OPEN
        to: UNDER_ESCALATION
        trigger: "POST /freight-claims/claims/{id}/appeals/{appealId}/escalate"
        actor: ClaimsManager
        preconditions:
          - "appeal.state == OPEN (ERR_APPEAL_INVALID_STATE)"
          - "claim.filing_status == APPEALED (ERR_CLAIM_INVALID_STATE)"
        side_effects:
          - "appeal.escalated_to_user_id := body.escalated_to_user_id"
      - from: OPEN
        to: DECIDED
        trigger: "POST /freight-claims/claims/{id}/appeals/{appealId}/decide"
        actor: ClaimsManager
        preconditions:
          - "appeal.state in {OPEN, UNDER_ESCALATION}"
        side_effects:
          - "drives Claim APPEALED -> UNDER_REVIEW or APPEALED -> DECLINED per decision"
      - from: UNDER_ESCALATION
        to: DECIDED
        trigger: "POST /freight-claims/claims/{id}/appeals/{appealId}/decide"
        actor: ClaimsManager
        preconditions:
          - "appeal.state in {OPEN, UNDER_ESCALATION}"
        side_effects:
          - "drives Claim APPEALED -> UNDER_REVIEW or APPEALED -> DECLINED per decision"
      - from: DECIDED
        to: CLOSED
        trigger: "system (after claim leaves APPEALED state)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Settlement
    initial_state: OFFERED
    terminal_states: [ACCEPTED, REJECTED, WITHDRAWN, EXPIRED]
    note: "Cyclic via Claim: Settlement COUNTERED returns Claim to UNDER_REVIEW; a new Settlement (next round_number) may then be created"
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /freight-claims/claims/{id}/settlements/{settlementId}/accept"
        actor: ClaimsManager
        preconditions:
          - "settlement.state == OFFERED"
          - "actor satisfies authority tier + segregation of duties (see Claim OFFERED->PAID)"
        side_effects:
          - "drives Claim OFFERED -> PAID or CLOSED_WITH_PAYMENT"
      - from: OFFERED
        to: COUNTERED
        trigger: "POST /freight-claims/claims/{id}/settlements/{settlementId}/counter"
        actor: ClaimsAdjuster
        preconditions:
          - "settlement.state == OFFERED"
        side_effects:
          - "drives Claim OFFERED -> UNDER_REVIEW (revision loop)"
      - from: OFFERED
        to: REJECTED
        trigger: "POST /freight-claims/claims/{id}/settlements/{settlementId}/reject"
        actor: ClaimsManager
        preconditions:
          - "settlement.state == OFFERED"
        side_effects:
          - "drives Claim OFFERED -> DECLINED"
      - from: OFFERED
        to: EXPIRED
        trigger: "system (logical clock advances 14 days past settlement.created_at)"
        actor: system
        preconditions:
          - "now() > settlement.created_at + 14 days"
          - "settlement.state == OFFERED"
        side_effects:
          - "drives Claim OFFERED -> UNDER_REVIEW"
      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /freight-claims/claims/{id}/settlements/{settlementId}/withdraw"
        actor: ClaimsAdjuster
        preconditions:
          - "settlement.state == OFFERED"
          - "actor_user_id == settlement created-by (or ClaimsManager override)"
        side_effects:
          - "drives Claim OFFERED -> UNDER_REVIEW"

  - entity: SubrogationCase
    initial_state: OPEN
    terminal_states: [SETTLED, CLOSED_UNRECOVERABLE]
    transitions:
      - from: OPEN
        to: DEMAND_SENT
        trigger: "POST /freight-claims/claims/{id}/subrogation/{caseId}/send-demand"
        actor: SubrogationSpecialist
        preconditions:
          - "case.state == OPEN"
          - "claim.filing_status in {PAID, CLOSED_WITH_PAYMENT} (ERR_CLAIM_NOT_PAID)"
        side_effects:
          - "append ClaimEvent SUBROGATION_OPENED (only if first transition out of OPEN)"
      - from: DEMAND_SENT
        to: IN_LITIGATION
        trigger: "POST /freight-claims/claims/{id}/subrogation/{caseId}/litigate"
        actor: SubrogationSpecialist
        preconditions:
          - "case.state == DEMAND_SENT"
        side_effects: []
      - from: OPEN
        to: SETTLED
        trigger: "POST /freight-claims/claims/{id}/subrogation/{caseId}/settle"
        actor: SubrogationSpecialist
        preconditions:
          - "case.state in {OPEN, DEMAND_SENT, IN_LITIGATION}"
          - "body.recovered_cents >= 0"
        side_effects:
          - "case.recovered_cents := body.recovered_cents; recompute recovery_ratio_bp"
          - "claim.net_exposure_cents := max(net_exposure_cents - recovered_cents, 0)"
          - "append ClaimEvent SUBROGATION_RECOVERY"
          - "claim.version += 1"
      - from: DEMAND_SENT
        to: SETTLED
        trigger: "POST /freight-claims/claims/{id}/subrogation/{caseId}/settle"
        actor: SubrogationSpecialist
        preconditions:
          - "case.state in {OPEN, DEMAND_SENT, IN_LITIGATION}"
        side_effects: ["(same as OPEN->SETTLED)"]
      - from: IN_LITIGATION
        to: SETTLED
        trigger: "POST /freight-claims/claims/{id}/subrogation/{caseId}/settle"
        actor: SubrogationSpecialist
        preconditions:
          - "case.state in {OPEN, DEMAND_SENT, IN_LITIGATION}"
        side_effects: ["(same as OPEN->SETTLED)"]
      - from: OPEN
        to: CLOSED_UNRECOVERABLE
        trigger: "POST /freight-claims/claims/{id}/subrogation/{caseId}/close-unrecoverable"
        actor: SubrogationSpecialist
        preconditions:
          - "case.state in {OPEN, DEMAND_SENT, IN_LITIGATION}"
        side_effects: []
      - from: DEMAND_SENT
        to: CLOSED_UNRECOVERABLE
        trigger: "POST /freight-claims/claims/{id}/subrogation/{caseId}/close-unrecoverable"
        actor: SubrogationSpecialist
        preconditions:
          - "case.state in {OPEN, DEMAND_SENT, IN_LITIGATION}"
        side_effects: []
      - from: IN_LITIGATION
        to: CLOSED_UNRECOVERABLE
        trigger: "POST /freight-claims/claims/{id}/subrogation/{caseId}/close-unrecoverable"
        actor: SubrogationSpecialist
        preconditions:
          - "case.state in {OPEN, DEMAND_SENT, IN_LITIGATION}"
        side_effects: []

  - entity: Reserve
    initial_state: OPEN
    terminal_states: [RELEASED, EXHAUSTED]
    transitions:
      - from: OPEN
        to: RELEASED
        trigger: "POST /freight-claims/claims/{id}/reserves/{reserveId}/release"
        actor: FinanceController
        preconditions:
          - "reserve.state == OPEN"
          - "claim.filing_status in {DRAFT, SUBMITTED, ACKNOWLEDGED, UNDER_REVIEW, OFFERED, DECLINED, APPEALED} (ERR_CLAIM_ALREADY_TERMINAL)"
        side_effects:
          - "claim.reserve_amount_cents := 0"
          - "append ClaimEvent RESERVE_RELEASED"
          - "claim.version += 1"
      - from: OPEN
        to: EXHAUSTED
        trigger: "system (on settlement acceptance)"
        actor: system
        preconditions: []
        side_effects:
          - "claim.reserve_amount_cents := 0"

  - entity: Carrier
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /freight-claims/carriers/{carrierId}/suspend"
        actor: ClaimsManager
        preconditions:
          - "carrier.status == ACTIVE"
          - "no OPEN Reserve exists on any Claim with claim.carrier_id == carrier.id AND claim.filing_status not in terminal set (ERR_OPEN_EXPOSURE_EXISTS)"
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /freight-claims/carriers/{carrierId}/reinstate"
        actor: ClaimsManager
        preconditions: ["carrier.status == SUSPENDED"]
        side_effects: []
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /freight-claims/carriers/{carrierId}/terminate"
        actor: FinanceController
        preconditions:
          - "carrier.status == SUSPENDED"
          - "no Claim with claim.carrier_id == carrier.id in non-terminal filing_status (ERR_OPEN_EXPOSURE_EXISTS)"
        side_effects: []

  - entity: Lane
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /freight-claims/lanes/{laneId}/retire"
        actor: ClaimsManager
        preconditions:
          - "lane.status == ACTIVE"
          - "no Shipment with shipment.lane_id == lane.id AND shipment.status == CLAIMED (ERR_OPEN_EXPOSURE_EXISTS)"
        side_effects: []

  - entity: Shipment
    initial_state: DELIVERED
    terminal_states: [CLOSED]
    transitions:
      - from: DELIVERED
        to: CLAIMED
        trigger: "system (on Claim submit)"
        actor: system
        preconditions: []
        side_effects: []
      - from: CLAIMED
        to: DELIVERED
        trigger: "system (on Claim withdraw before ACKNOWLEDGED cascade)"
        actor: system
        preconditions: ["no other Claim on this shipment in non-terminal state"]
        side_effects: []
      - from: CLAIMED
        to: CLOSED
        trigger: "system (when all claims on shipment reach terminal state)"
        actor: system
        preconditions: ["all claims on shipment are in terminal state"]
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: claim-settle-stale-version
    parent_entity: Claim
    write_endpoint: "POST /freight-claims/claims/{id}/settlements"
    occ_field: "expected_claim_version"
    description: |
      Creating a Settlement against a Claim whose version has advanced since
      the client last observed it is rejected. This captures the case where
      another writer has just posted an assessment or salvage credit (both
      legitimately mutate claim.net_exposure_cents and bump claim.version)
      and the current writer's view of the claim is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-decline-stale-version
    parent_entity: Claim
    write_endpoint: "POST /freight-claims/claims/{id}/decline"
    occ_field: "expected_claim_version"
    description: |
      Declining a Claim whose version has advanced since the client last
      observed it is rejected. A concurrently-arriving salvage credit or
      reserve post alters net_exposure_cents; the decliner must re-read
      before committing to the decline.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-appeal-stale-version
    parent_entity: Claim
    write_endpoint: "POST /freight-claims/claims/{id}/appeals"
    occ_field: "expected_claim_version"
    description: |
      Opening an Appeal against a Claim whose version has advanced since
      the client last observed it is rejected; the appeal_round counter
      may have been incremented by another appeal, changing eligibility.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: limitation_of_liability
    trigger: "creation of a LiabilityAssessment (POST /freight-claims/claims/{id}/assessments)"
    algorithm: tiered_pricing
    formula: |
      Inputs: claim, shipment, carrier, carrier_lane_assignment effective at
      shipment.ship_date (effective_from <= ship_date < effective_to).
      Step 1 — limitation_basis_cents:
        basis = min(claim.claimed_amount_cents, shipment.declared_value_cents)
      Step 2 — carrier_limit_cents (dispatch on carrier.liability_model):
        if liability_model == FULL_VALUE:        carrier_limit = basis
        if liability_model == RELEASED_RATE:     carrier_limit = min(basis, shipment.total_weight_lbs * carrier.released_rate_cents_per_lb)
        if liability_model == PER_PACKAGE:       carrier_limit = min(basis, shipment.package_count * carrier.per_package_cap_cents)
        if liability_model == PER_POUND:         carrier_limit = min(basis, shipment.total_weight_lbs * carrier.per_pound_cap_cents)
      Step 3 — lane discount:
        if assignment exists and assignment.contracted_discount_pct > 0:
          carrier_limit = floor(carrier_limit * (100 - contracted_discount_pct) / 100)
      Step 4 — negligence modifier:
        if assessment.negligence_flag == CARRIER_NEGLIGENT:  no additional cap relaxation
        if assessment.negligence_flag == SHIPPER_FAULT:      carrier_limit := 0
        if assessment.negligence_flag == ACT_OF_GOD:         carrier_limit := 0
        if assessment.negligence_flag == THIRD_PARTY:        carrier_limit unchanged (subrogation may recover separately)
      Step 5 — result:
        computed_liability_cents = max(carrier_limit, 0)
      Pin the evaluation order: basis -> model cap -> lane discount -> negligence.
      Reversing the order of lane-discount and model-cap produces different cents
      because floor() is applied at each step.
    input_set: "single Claim + its Shipment + Carrier + the CarrierLaneAssignment whose effective window covers shipment.ship_date (ties broken by assignment.created_at ASC, earliest wins)"
    constants:
      NEGLIENCE_ZERO_FLAGS: "SHIPPER_FAULT | ACT_OF_GOD"
    precision: "integer cents; floor() at each multiplication step"
    variants:
      - name: provisional_at_intake
        when: "claim in DRAFT state, before submit — used by GET /claims/{id}/liability-preview"
        difference: "ignores negligence_flag entirely (no assessment exists yet); uses claim.claimed_amount_cents as basis and applies model cap + lane discount only"
      - name: final_at_assessment
        when: "POST /claims/{id}/assessments — full 5-step pipeline"
        difference: "applies negligence modifier step"

  - name: settlement_authority
    trigger: "POST /freight-claims/claims/{id}/settlements — determines authority_tier_required"
    algorithm: threshold
    formula: |
      Inputs: settlement.amount_cents, carrier.max_auto_settle_cents, global tiers.
      if amount_cents <= carrier.max_auto_settle_cents:                            tier = TIER_1 (ClaimsAdjuster)
      elif amount_cents <= TIER_2_CAP_CENTS:                                       tier = TIER_2 (ClaimsManager)
      else:                                                                        tier = TIER_3 (FinanceController)
      Boundary precision: <= at each tier (a settlement of exactly
      carrier.max_auto_settle_cents remains TIER_1).
    input_set: "single Settlement + Carrier"
    constants:
      TIER_2_CAP_CENTS: 10000000
    precision: "integer cents; comparisons are <="

  - name: claim_ratio_analytics
    trigger: "every Claim transition into or out of FILED-state set (SUBMITTED, ACKNOWLEDGED, UNDER_REVIEW, OFFERED, DECLINED, APPEALED) and into PAID/CLOSED_WITH_PAYMENT; also on Carrier read"
    algorithm: aggregation
    formula: |
      Per carrier:
        claims_filed_count = count of Claim rows with carrier_id == carrier.id
          whose filing_status EVER entered SUBMITTED (tracked via ClaimEvent
          kind == FILED, idempotent on repeated submission after withdraw —
          count only the first FILED event per claim).
        claims_paid_count  = count of Claim rows with carrier_id == carrier.id
          AND filing_status in {PAID, CLOSED_WITH_PAYMENT}.
        claim_ratio_bp     = round(claims_paid_count * 10000 / max(claims_filed_count, 1))
      Per lane:
        shipments_count    = count of Shipment with lane_id == lane.id
        claims_count       = count of Claim with lane_id == lane.id whose filing_status EVER entered SUBMITTED
        lane_claim_ratio_bp = round(claims_count * 10000 / max(shipments_count, 1))
      Boundary: when denominator is 0 the ratio is defined as 0 (via the max(,1)).
    input_set: "Claim and Shipment rows in any non-deleted state; uses ClaimEvent stream for 'ever FILED' semantics"
    constants:
      BASIS_POINT_DENOMINATOR: 10000
    precision: "integer basis points, round_half_up"
    variants:
      - name: trailing_12m
        when: "GET /freight-claims/analytics/carrier-claim-ratio?window=TRAILING_12M"
        difference: "input set filtered to claims whose first FILED event falls in [now-365d, now]"
      - name: lifetime
        when: "GET /freight-claims/analytics/carrier-claim-ratio?window=LIFETIME (default)"
        difference: "no time filter"

  - name: salvage_net_credit
    trigger: "SalvageDisposition SCHEDULED -> EXECUTED"
    algorithm: waterfall_allocation
    formula: |
      gross = salvage.gross_proceeds_cents
      handling = salvage.handling_cost_cents
      net_credit = max(gross - handling, 0)
      Apply net_credit to claim.salvage_credit_cents (additive, may exceed
      computed_liability_cents — floor of net_exposure at 0 is applied separately).
      claim.net_exposure_cents = max(claim.computed_liability_cents - claim.salvage_credit_cents, 0)
    input_set: "single SalvageDisposition + parent Claim"
    precision: "integer cents"

  - name: reserve_sizing
    trigger: "POST /freight-claims/claims/{id}/reserves — suggests and validates the reserve amount"
    algorithm: weighted_scoring
    formula: |
      base = claim.net_exposure_cents
      if claim.claim_type == HIGH_VALUE shipment.commodity_class:     base = base * 1.20
      if claim.is_concealed_damage == true on shipment:                base = base * 1.10
      if carrier.claim_ratio_bp > LANE_ALERT_THRESHOLD_BP:             base = base * 1.15
      if lane.lane_claim_ratio_bp > lane.baseline_claim_ratio_bp:      base = base * 1.05
      suggested_reserve_cents = round(min(base, claim.computed_liability_cents * MAX_RESERVE_MULTIPLE))
      Multipliers compound multiplicatively (NOT additive) — order of application
      does not matter for the final product, but the round() applies once at end.
    input_set: "single Claim + Carrier + Lane + Shipment"
    constants:
      LANE_ALERT_THRESHOLD_BP: 1500
      MAX_RESERVE_MULTIPLE: 2
    precision: "integer cents; round_half_up at final step only"

  - name: acknowledgment_late_check
    trigger: "POST /claims/{id}/acknowledge AND system scheduler daily sweep"
    algorithm: threshold
    formula: |
      late = (acknowledged_at IS NOT NULL AND acknowledged_at > acknowledgment_due_at)
           OR (acknowledged_at IS NULL AND now() > acknowledgment_due_at)
      Boundary: exactly at acknowledgment_due_at is NOT late (strictly greater than).
    input_set: "single Claim"
    precision: "strict inequality"

  - name: claim_aging_buckets
    trigger: "GET /freight-claims/analytics/claim-aging"
    algorithm: chronological
    formula: |
      For each Claim with filing_status in {SUBMITTED, ACKNOWLEDGED, UNDER_REVIEW, OFFERED, DECLINED, APPEALED}:
        age_days = floor((now() - filing_received_at) / 86400)
        bucket = B0_30 if age_days < 30
               | B31_60 if 30 <= age_days < 60
               | B61_90 if 60 <= age_days < 90
               | B91_PLUS if age_days >= 90
      Boundary precision: 30 and 90 days sit in the HIGHER bucket (30-day-old
      claim is B31_60, not B0_30).
      Sort within bucket: filing_received_at ASC, tie-break claim.created_at ASC.
    input_set: "all non-terminal Claims"
    precision: "integer days; floor division"

  - name: subrogation_recovery_ratio
    trigger: "SubrogationCase SETTLED transition; GET /claims/{id}/subrogation"
    algorithm: aggregation
    formula: |
      recovery_ratio_bp = round(recovered_cents * 10000 / max(target_recovery_cents, 1))
      Cap reported value at 10000 bp (over-recovery reported as 10000).
    input_set: "single SubrogationCase"
    precision: "integer basis points, round_half_up, capped at 10000"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must be listed in endpoint's roles array (RBAC)"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-template IDs (claim, document, assessment, settlement, appeal, salvage, reserve, subrogation, carrier, lane, shipment) must exist; validated left-to-right"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all nested endpoints"

  - priority: 4
    category: state
    check: "Parent Claim must be in a state that admits the requested child operation"
    error_id: ERR_CLAIM_INVALID_STATE
    http_status: 409
    applies_to: "all /claims/{id}/* action endpoints"

  - priority: 5
    category: state
    check: "Optimistic concurrency: expected_claim_version must match claim.version on write endpoints that take it"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /claims/{id}/settlements, POST /claims/{id}/decline, POST /claims/{id}/appeals"

  - priority: 6
    category: business_safety
    check: "Segregation of duties: settlement approver != assessment author AND != settlement creator; appeal decider != appeal opener"
    error_id: ERR_SEGREGATION_OF_DUTIES_VIOLATION
    http_status: 403
    applies_to: "POST /claims/{id}/settlements/{sid}/accept, POST /claims/{id}/assessments/{aid}/approve, POST /claims/{id}/appeals/{apid}/decide"

  - priority: 7
    category: business_temporal
    check: "Filing deadline: now() <= claim.filing_deadline_at at submit; salvage scheduled_at must be > now() at creation; shipment.delivery_date >= ship_date"
    error_id: ERR_FILING_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /claims/{id}/submit, POST /claims/{id}/salvage, POST /shipments"

  - priority: 8
    category: business_referential
    check: "Required documents: at least one VERIFIED-or-PENDING BOL and one COMMERCIAL_INVOICE attached before submit"
    error_id: ERR_REQUIRED_DOCUMENT_MISSING
    http_status: 422
    applies_to: "POST /claims/{id}/submit"

  - priority: 9
    category: business_referential
    check: "All attached documents must be VERIFIED (not PENDING, not REJECTED) before assessment creation"
    error_id: ERR_DOCUMENTS_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /claims/{id}/assessments"

  - priority: 10
    category: business_fiscal
    check: "claim.claimed_amount_cents > 0 AND <= shipment.declared_value_cents; settlement.amount_cents <= claim.net_exposure_cents; salvage gross_proceeds_cents >= 0 AND handling_cost_cents >= 0"
    error_id: ERR_CLAIM_AMOUNT_EXCEEDS_DECLARED_VALUE
    http_status: 422
    applies_to: "POST /claims, POST /claims/{id}/submit, POST /claims/{id}/settlements, POST /claims/{id}/salvage"

  - priority: 11
    category: business_fiscal
    check: "Reserve must cover settlement: claim.reserve_amount_cents >= settlement.amount_cents at accept time"
    error_id: ERR_RESERVE_INSUFFICIENT
    http_status: 402
    applies_to: "POST /claims/{id}/settlements/{sid}/accept"

  - priority: 12
    category: business_fiscal
    check: "Authority tier: actor role must satisfy settlement.authority_tier_required"
    error_id: ERR_AUTHORITY_TIER_INSUFFICIENT
    http_status: 403
    applies_to: "POST /claims/{id}/settlements/{sid}/accept"

  - priority: 13
    category: business_constraint
    check: "Appeal rounds: claim.appeal_round < 2 to open a new appeal"
    error_id: ERR_APPEAL_ROUND_EXHAUSTED
    http_status: 409
    applies_to: "POST /claims/{id}/appeals"

  - priority: 14
    category: business_constraint
    check: "Shipment must be in DELIVERED state to open a Claim; carrier must be ACTIVE; lane must be ACTIVE; CarrierLaneAssignment effective window must cover shipment.ship_date"
    error_id: ERR_SHIPMENT_NOT_DELIVERED
    http_status: 409
    applies_to: "POST /claims"

  - priority: 15
    category: business_constraint
    check: "Uniqueness: Carrier.scac_code unique; Shipment.bol_number unique; CarrierLaneAssignment (carrier_id, lane_id, effective_from) unique"
    error_id: ERR_DUPLICATE_KEY
    http_status: 409
    applies_to: "POST /carriers, POST /shipments, POST /carrier-lane-assignments"

  - priority: 16
    category: business_safety
    check: "Subrogation may only be opened on a PAID or CLOSED_WITH_PAYMENT claim (must first indemnify the shipper)"
    error_id: ERR_CLAIM_NOT_PAID
    http_status: 409
    applies_to: "POST /claims/{id}/subrogation"

  - priority: 17
    category: business_safety
    check: "Carrier suspend/terminate and Lane retire forbidden while open exposure exists (non-terminal claim referencing the resource)"
    error_id: ERR_OPEN_EXPOSURE_EXISTS
    http_status: 409
    applies_to: "POST /carriers/{id}/suspend, POST /carriers/{id}/terminate, POST /lanes/{id}/retire"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server default before any call is 2026-08-01T00:00:00Z; never falls back to wall clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ now_iso8601: string }"
    side_effects: ["drives scheduler-sensitive transitions (TIME_BARRED, salvage EXECUTED, settlement EXPIRED, acknowledgment_late flag)"]

  # --- Carrier ---
  - method: POST
    path: "/freight-claims/carriers"
    description: "Register a carrier"
    roles: [ClaimsManager]
    code: 201
    input: [scac_code, legal_name, liability_model, "released_rate_cents_per_lb?", "per_package_cap_cents?", "per_pound_cap_cents?", max_auto_settle_cents, "carmack_acknowledgment_days?", "carmack_filing_days?"]
    output: Carrier
    side_effects: ["status := ACTIVE", "claims_filed_count := 0", "claims_paid_count := 0", "claim_ratio_bp := 0"]

  - method: GET
    path: "/freight-claims/carriers"
    description: "List carriers (filter by status?)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Carrier[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/carriers/{carrierId}"
    description: "Get carrier"
    roles: [Any]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: POST
    path: "/freight-claims/carriers/{carrierId}/suspend"
    description: "Suspend a carrier (no open exposure allowed)"
    roles: [ClaimsManager]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status := SUSPENDED", "increments Carrier.version by 1"]

  - method: POST
    path: "/freight-claims/carriers/{carrierId}/reinstate"
    description: "Reinstate a suspended carrier"
    roles: [ClaimsManager]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status := ACTIVE", "increments Carrier.version by 1"]

  - method: POST
    path: "/freight-claims/carriers/{carrierId}/terminate"
    description: "Terminate a suspended carrier"
    roles: [FinanceController]
    code: 200
    input: []
    output: Carrier
    side_effects: ["status := TERMINATED", "increments Carrier.version by 1"]

  # --- Lane ---
  - method: POST
    path: "/freight-claims/lanes"
    description: "Create a lane"
    roles: [ClaimsManager]
    code: 201
    input: [origin_zip3, destination_zip3, baseline_claim_ratio_bp]
    output: Lane
    side_effects: ["status := ACTIVE"]

  - method: GET
    path: "/freight-claims/lanes"
    description: "List lanes"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Lane[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/lanes/{laneId}"
    description: "Get lane"
    roles: [Any]
    code: 200
    input: []
    output: Lane
    side_effects: []

  - method: POST
    path: "/freight-claims/lanes/{laneId}/retire"
    description: "Retire a lane"
    roles: [ClaimsManager]
    code: 200
    input: []
    output: Lane
    side_effects: ["status := RETIRED", "increments Lane.version by 1"]

  # --- CarrierLaneAssignment ---
  - method: POST
    path: "/freight-claims/carrier-lane-assignments"
    description: "Assign carrier to lane with discount + effective window"
    roles: [ClaimsManager]
    code: 201
    input: [carrier_id, lane_id, contracted_discount_pct, effective_from, effective_to]
    output: CarrierLaneAssignment
    side_effects: []

  - method: GET
    path: "/freight-claims/carrier-lane-assignments"
    description: "List assignments (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "carrier_id?", "lane_id?"]
    output: "CarrierLaneAssignment[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/carrier-lane-assignments/{assignmentId}"
    description: "Get assignment"
    roles: [Any]
    code: 200
    input: []
    output: CarrierLaneAssignment
    side_effects: []

  # --- Shipment ---
  - method: POST
    path: "/freight-claims/shipments"
    description: "Register a delivered shipment"
    roles: [ClaimsClerk]
    code: 201
    input: [bol_number, carrier_id, lane_id, ship_date, delivery_date, declared_value_cents, total_weight_lbs, package_count, commodity_class, "is_concealed_damage?"]
    output: Shipment
    side_effects: ["status := DELIVERED", "lane.shipments_count += 1", "recompute lane.lane_claim_ratio_bp"]

  - method: GET
    path: "/freight-claims/shipments"
    description: "List shipments (filterable by carrier_id?, lane_id?, status?)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "carrier_id?", "lane_id?", "status?"]
    output: "Shipment[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/shipments/{shipmentId}"
    description: "Get shipment"
    roles: [Any]
    code: 200
    input: []
    output: Shipment
    side_effects: []

  # --- Claim ---
  - method: POST
    path: "/freight-claims/claims"
    description: "Open a new claim in DRAFT state against a shipment"
    roles: [ClaimsClerk]
    code: 201
    input: [shipment_id, claim_type, claimed_amount_cents]
    output: Claim
    side_effects: ["filing_status := DRAFT", "payment_status := UNPAID", "denormalize carrier_id and lane_id from shipment", "appeal_round := 0"]

  - method: GET
    path: "/freight-claims/claims"
    description: "List claims (filterable)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "carrier_id?", "lane_id?", "shipment_id?", "filing_status?", "payment_status?", "liability_assessment_id?"]
    output: "Claim[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/claims/{id}"
    description: "Get claim"
    roles: [Any]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: POST
    path: "/freight-claims/claims/{id}/submit"
    description: "Submit a draft claim; stamps filing_received_at and deadlines"
    roles: [ClaimsClerk]
    code: 200
    input: []
    output: Claim
    side_effects: ["filing_status DRAFT -> SUBMITTED", "stamps filing_received_at, filing_deadline_at, acknowledgment_due_at", "increments Claim.version by 1", "carrier/lane counters + ratios recomputed", "shipment.status := CLAIMED"]

  - method: POST
    path: "/freight-claims/claims/{id}/acknowledge"
    description: "Carrier acknowledges claim"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Claim
    side_effects: ["filing_status SUBMITTED -> ACKNOWLEDGED", "acknowledged_at := now()", "sets acknowledgment_late if past due", "increments Claim.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/decline"
    description: "Decline an UNDER_REVIEW claim (OCC)"
    roles: [ClaimsAdjuster]
    code: 200
    input: [expected_claim_version]
    output: Claim
    side_effects: ["filing_status UNDER_REVIEW -> DECLINED", "increments Claim.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/withdraw"
    description: "Withdraw claim (from DRAFT/SUBMITTED/ACKNOWLEDGED)"
    roles: [ClaimsClerk]
    code: 200
    input: []
    output: Claim
    side_effects: ["filing_status -> WITHDRAWN", "counters decremented if was SUBMITTED+", "shipment.status may revert", "increments Claim.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/close"
    description: "Close a DECLINED claim with no payment"
    roles: [ClaimsManager]
    code: 200
    input: ["waive_appeal?"]
    output: Claim
    side_effects: ["filing_status DECLINED -> CLOSED_NO_PAYMENT", "release open Reserve", "increments Claim.version by 1"]

  - method: GET
    path: "/freight-claims/claims/{id}/liability-preview"
    description: "Provisional limitation_of_liability computation (no persistence)"
    roles: [ClaimsClerk, ClaimsAdjuster, ClaimsManager]
    code: 200
    input: []
    output: "{ basis_cents: integer, carrier_limit_cents: integer, lane_discount_pct: integer, computed_liability_cents: integer }"
    side_effects: []

  # --- ClaimDocument ---
  - method: POST
    path: "/freight-claims/claims/{id}/documents"
    description: "Attach a document to a claim"
    roles: [ClaimsClerk]
    code: 201
    input: [document_kind, storage_uri, captured_at]
    output: ClaimDocument
    side_effects: ["verification_status := PENDING"]

  - method: GET
    path: "/freight-claims/claims/{id}/documents"
    description: "List documents for a claim"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "verification_status?", "document_kind?"]
    output: "ClaimDocument[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/claims/{id}/documents/{docId}"
    description: "Get document"
    roles: [Any]
    code: 200
    input: []
    output: ClaimDocument
    side_effects: []

  - method: POST
    path: "/freight-claims/claims/{id}/documents/{docId}/verify"
    description: "Verify a document"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: ClaimDocument
    side_effects: ["verification_status := VERIFIED", "increments ClaimDocument.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/documents/{docId}/reject"
    description: "Reject a document"
    roles: [ClaimsAdjuster]
    code: 200
    input: [rejection_reason]
    output: ClaimDocument
    side_effects: ["verification_status := REJECTED", "increments ClaimDocument.version by 1"]

  # --- LiabilityAssessment ---
  - method: POST
    path: "/freight-claims/claims/{id}/assessments"
    description: "Create liability assessment; supersedes any prior SUBMITTED assessment; drives claim to UNDER_REVIEW"
    roles: [ClaimsAdjuster]
    code: 201
    input: [negligence_flag]
    output: LiabilityAssessment
    side_effects: ["computes limitation_of_liability", "claim ACKNOWLEDGED -> UNDER_REVIEW", "prior SUBMITTED assessment -> SUPERSEDED", "increments Claim.version by 1"]

  - method: GET
    path: "/freight-claims/claims/{id}/assessments"
    description: "List assessments for a claim"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "LiabilityAssessment[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/claims/{id}/assessments/{assessmentId}"
    description: "Get assessment"
    roles: [Any]
    code: 200
    input: []
    output: LiabilityAssessment
    side_effects: []

  - method: POST
    path: "/freight-claims/claims/{id}/assessments/{assessmentId}/approve"
    description: "Manager approves a SUBMITTED assessment"
    roles: [ClaimsManager]
    code: 200
    input: []
    output: LiabilityAssessment
    side_effects: ["state := APPROVED", "increments LiabilityAssessment.version by 1"]

  # --- SalvageDisposition ---
  - method: POST
    path: "/freight-claims/claims/{id}/salvage"
    description: "Schedule a salvage disposition"
    roles: [SalvageCoordinator]
    code: 201
    input: [disposition_kind, gross_proceeds_cents, handling_cost_cents, scheduled_at]
    output: SalvageDisposition
    side_effects: ["state := SCHEDULED"]

  - method: GET
    path: "/freight-claims/claims/{id}/salvage"
    description: "List salvage dispositions for a claim"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "state?"]
    output: "SalvageDisposition[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/claims/{id}/salvage/{salvageId}"
    description: "Get salvage"
    roles: [Any]
    code: 200
    input: []
    output: SalvageDisposition
    side_effects: []

  - method: POST
    path: "/freight-claims/claims/{id}/salvage/{salvageId}/execute"
    description: "Execute a scheduled salvage"
    roles: [SalvageCoordinator]
    code: 200
    input: []
    output: SalvageDisposition
    side_effects: ["state := EXECUTED", "computes net_credit_cents", "claim.salvage_credit_cents += net", "claim.net_exposure_cents recomputed", "increments Claim.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/salvage/{salvageId}/cancel"
    description: "Cancel a scheduled salvage"
    roles: [SalvageCoordinator]
    code: 200
    input: []
    output: SalvageDisposition
    side_effects: ["state := CANCELLED", "increments SalvageDisposition.version by 1"]

  # --- Appeal ---
  - method: POST
    path: "/freight-claims/claims/{id}/appeals"
    description: "Open an appeal on a DECLINED claim (OCC)"
    roles: [ClaimsAdjuster]
    code: 201
    input: [justification, requested_amount_cents, expected_claim_version]
    output: Appeal
    side_effects: ["claim DECLINED -> APPEALED", "claim.appeal_round += 1", "increments Claim.version by 1"]

  - method: GET
    path: "/freight-claims/claims/{id}/appeals"
    description: "List appeals for a claim"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "state?"]
    output: "Appeal[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/claims/{id}/appeals/{appealId}"
    description: "Get appeal"
    roles: [Any]
    code: 200
    input: []
    output: Appeal
    side_effects: []

  - method: POST
    path: "/freight-claims/claims/{id}/appeals/{appealId}/escalate"
    description: "Escalate an appeal to a manager"
    roles: [ClaimsManager]
    code: 200
    input: [escalated_to_user_id]
    output: Appeal
    side_effects: ["state := UNDER_ESCALATION", "increments Appeal.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/appeals/{appealId}/decide"
    description: "Decide an appeal (OVERTURN | UPHOLD_DECLINE | PARTIAL)"
    roles: [ClaimsManager]
    code: 200
    input: [decision, "decided_amount_cents?"]
    output: Appeal
    side_effects: ["state := DECIDED", "drives claim APPEALED -> UNDER_REVIEW or DECLINED", "increments Appeal.version by 1 and Claim.version by 1"]

  # --- Settlement ---
  - method: POST
    path: "/freight-claims/claims/{id}/settlements"
    description: "Extend a settlement offer on an UNDER_REVIEW claim (OCC)"
    roles: [ClaimsAdjuster]
    code: 201
    input: [amount_cents, expected_claim_version]
    output: Settlement
    side_effects: ["claim UNDER_REVIEW -> OFFERED", "authority_tier_required computed", "increments Claim.version by 1"]

  - method: GET
    path: "/freight-claims/claims/{id}/settlements"
    description: "List settlements for a claim"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "state?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/claims/{id}/settlements/{settlementId}"
    description: "Get settlement"
    roles: [Any]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: POST
    path: "/freight-claims/claims/{id}/settlements/{settlementId}/accept"
    description: "Accept a settlement; releases reserve; pays out"
    roles: [ClaimsManager, FinanceController]
    code: 200
    input: []
    output: Settlement
    side_effects: ["settlement.state := ACCEPTED", "claim OFFERED -> PAID or CLOSED_WITH_PAYMENT", "reserve EXHAUSTED", "claim.payment_status updated", "carrier.claims_paid_count += 1", "increments Claim.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/settlements/{settlementId}/counter"
    description: "Counter an offer (back to UNDER_REVIEW)"
    roles: [ClaimsAdjuster]
    code: 200
    input: []
    output: Settlement
    side_effects: ["settlement.state := COUNTERED", "claim OFFERED -> UNDER_REVIEW", "increments Claim.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/settlements/{settlementId}/reject"
    description: "Reject an offer (claim DECLINED)"
    roles: [ClaimsManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["settlement.state := REJECTED", "claim OFFERED -> DECLINED", "increments Claim.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/settlements/{settlementId}/withdraw"
    description: "Withdraw an offer"
    roles: [ClaimsAdjuster, ClaimsManager]
    code: 200
    input: []
    output: Settlement
    side_effects: ["settlement.state := WITHDRAWN", "claim OFFERED -> UNDER_REVIEW", "increments Claim.version by 1"]

  # --- SubrogationCase ---
  - method: POST
    path: "/freight-claims/claims/{id}/subrogation"
    description: "Open a subrogation case (claim must be PAID or CLOSED_WITH_PAYMENT)"
    roles: [SubrogationSpecialist]
    code: 201
    input: [responsible_party_kind, responsible_party_name, target_recovery_cents]
    output: SubrogationCase
    side_effects: ["state := OPEN"]

  - method: GET
    path: "/freight-claims/claims/{id}/subrogation"
    description: "List subrogation cases for a claim"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "state?"]
    output: "SubrogationCase[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/claims/{id}/subrogation/{caseId}"
    description: "Get subrogation case"
    roles: [Any]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: []

  - method: POST
    path: "/freight-claims/claims/{id}/subrogation/{caseId}/send-demand"
    description: "Mark demand sent"
    roles: [SubrogationSpecialist]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: ["state := DEMAND_SENT", "increments SubrogationCase.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/subrogation/{caseId}/litigate"
    description: "Move to litigation"
    roles: [SubrogationSpecialist]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: ["state := IN_LITIGATION", "increments SubrogationCase.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/subrogation/{caseId}/settle"
    description: "Settle subrogation; recovered amount offsets claim net_exposure"
    roles: [SubrogationSpecialist]
    code: 200
    input: [recovered_cents]
    output: SubrogationCase
    side_effects: ["state := SETTLED", "recovered_cents := body", "claim.net_exposure_cents reduced", "increments SubrogationCase.version by 1 and Claim.version by 1"]

  - method: POST
    path: "/freight-claims/claims/{id}/subrogation/{caseId}/close-unrecoverable"
    description: "Close subrogation as unrecoverable"
    roles: [SubrogationSpecialist]
    code: 200
    input: []
    output: SubrogationCase
    side_effects: ["state := CLOSED_UNRECOVERABLE", "increments SubrogationCase.version by 1"]

  # --- Reserve ---
  - method: POST
    path: "/freight-claims/claims/{id}/reserves"
    description: "Post a reserve on a claim (only one OPEN at a time)"
    roles: [FinanceController]
    code: 201
    input: [amount_cents]
    output: Reserve
    side_effects: ["state := OPEN", "posted_at := now()", "claim.reserve_amount_cents := amount_cents", "increments Claim.version by 1"]

  - method: GET
    path: "/freight-claims/claims/{id}/reserves"
    description: "List reserves for a claim"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "state?"]
    output: "Reserve[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/claims/{id}/reserves/{reserveId}"
    description: "Get reserve"
    roles: [Any]
    code: 200
    input: []
    output: Reserve
    side_effects: []

  - method: POST
    path: "/freight-claims/claims/{id}/reserves/{reserveId}/release"
    description: "Release a reserve (claim not yet terminal)"
    roles: [FinanceController]
    code: 200
    input: []
    output: Reserve
    side_effects: ["state := RELEASED", "released_at := now()", "claim.reserve_amount_cents := 0", "increments Claim.version by 1"]

  # --- ClaimEvent ---
  - method: GET
    path: "/freight-claims/claims/{id}/events"
    description: "Append-only event log for a claim"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "event_kind?"]
    output: "ClaimEvent[]"
    side_effects: []

  # --- ClaimsCalendar ---
  - method: POST
    path: "/freight-claims/calendar"
    description: "Declare calendar row (business day vs holiday) — used for business-day deadline math"
    roles: [PlatformAdmin]
    code: 201
    input: [calendar_date, is_business_day, day_kind]
    output: ClaimsCalendar
    side_effects: []

  - method: GET
    path: "/freight-claims/calendar"
    description: "List calendar rows"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?", "day_kind?"]
    output: "ClaimsCalendar[]"
    side_effects: []

  # --- Analytics ---
  - method: GET
    path: "/freight-claims/analytics/carrier-claim-ratio"
    description: "Per-carrier claim_ratio_bp; window=TRAILING_12M|LIFETIME"
    roles: [Any]
    code: 200
    input: ["window?", "carrier_id?", "limit?", "offset?"]
    output: "Carrier[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/analytics/lane-claim-ratio"
    description: "Per-lane claim_ratio_bp and variance vs baseline"
    roles: [Any]
    code: 200
    input: ["lane_id?", "limit?", "offset?"]
    output: "Lane[]"
    side_effects: []

  - method: GET
    path: "/freight-claims/analytics/claim-aging"
    description: "Open claims bucketed by age (B0_30 | B31_60 | B61_90 | B91_PLUS)"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "{ B0_30: integer, B31_60: integer, B61_90: integer, B91_PLUS: integer }"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role missing or malformed" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not allowed to call this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Generic input shape/type error" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field received value outside declared set" }
  - { id: ERR_INVALID_TEMPORAL_RANGE, http: 400, condition: "effective_to <= effective_from, or delivery_date < ship_date, or scheduled_at <= now()" }
  - { id: ERR_DUPLICATE_KEY, http: 409, condition: "Uniqueness violation on scac_code, bol_number, or assignment (carrier,lane,effective_from)" }
  - { id: ERR_CARRIER_NOT_FOUND, http: 404, condition: "carrier id does not resolve" }
  - { id: ERR_LANE_NOT_FOUND, http: 404, condition: "lane id does not resolve" }
  - { id: ERR_SHIPMENT_NOT_FOUND, http: 404, condition: "shipment id does not resolve" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "claim id does not resolve" }
  - { id: ERR_DOCUMENT_NOT_FOUND, http: 404, condition: "document id does not resolve" }
  - { id: ERR_ASSESSMENT_NOT_FOUND, http: 404, condition: "assessment id does not resolve" }
  - { id: ERR_SALVAGE_NOT_FOUND, http: 404, condition: "salvage id does not resolve" }
  - { id: ERR_APPEAL_NOT_FOUND, http: 404, condition: "appeal id does not resolve" }
  - { id: ERR_SETTLEMENT_NOT_FOUND, http: 404, condition: "settlement id does not resolve" }
  - { id: ERR_SUBROGATION_NOT_FOUND, http: 404, condition: "subrogation id does not resolve" }
  - { id: ERR_RESERVE_NOT_FOUND, http: 404, condition: "reserve id does not resolve" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "carrier-lane-assignment id does not resolve" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_claim_version != claim.version" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Claim.filing_status not in permitted set for this transition" }
  - { id: ERR_CLAIM_LOCKED, http: 409, condition: "Operation forbidden because claim has progressed past allowed state" }
  - { id: ERR_DOCUMENT_INVALID_STATE, http: 409, condition: "Document verification_status not PENDING" }
  - { id: ERR_REJECTION_REASON_REQUIRED, http: 422, condition: "Rejecting a document requires non-empty rejection_reason" }
  - { id: ERR_ASSESSMENT_INVALID_STATE, http: 409, condition: "Assessment state not SUBMITTED for approve" }
  - { id: ERR_ASSESSMENT_REQUIRED, http: 409, condition: "Operation requires a LiabilityAssessment on the claim" }
  - { id: ERR_SALVAGE_INVALID_STATE, http: 409, condition: "Salvage state not SCHEDULED" }
  - { id: ERR_SALVAGE_NOT_YET_DUE, http: 409, condition: "now() < salvage.scheduled_at at execute" }
  - { id: ERR_APPEAL_INVALID_STATE, http: 409, condition: "Appeal state not OPEN/UNDER_ESCALATION for decide" }
  - { id: ERR_APPEAL_ROUND_EXHAUSTED, http: 409, condition: "claim.appeal_round >= 2" }
  - { id: ERR_APPEAL_PENDING, http: 409, condition: "Cannot close DECLINED claim while appeal_round < 2 and no waive_appeal=true" }
  - { id: ERR_SETTLEMENT_INVALID_STATE, http: 409, condition: "Settlement state not OFFERED" }
  - { id: ERR_SETTLEMENT_EXCEEDS_NET_EXPOSURE, http: 422, condition: "settlement.amount_cents > claim.net_exposure_cents" }
  - { id: ERR_AUTHORITY_TIER_INSUFFICIENT, http: 403, condition: "Actor role does not satisfy required authority tier" }
  - { id: ERR_SEGREGATION_OF_DUTIES_VIOLATION, http: 403, condition: "Same user attempted two steps that segregation-of-duties forbids" }
  - { id: ERR_RESERVE_INSUFFICIENT, http: 402, condition: "claim.reserve_amount_cents < settlement.amount_cents at accept" }
  - { id: ERR_RESERVE_ALREADY_OPEN, http: 409, condition: "Only one OPEN reserve per claim" }
  - { id: ERR_RESERVE_INVALID_STATE, http: 409, condition: "Reserve state not OPEN for release" }
  - { id: ERR_CLAIM_ALREADY_TERMINAL, http: 409, condition: "Claim is in a terminal state; mutation forbidden" }
  - { id: ERR_CLAIM_NOT_PAID, http: 409, condition: "Subrogation requires claim PAID or CLOSED_WITH_PAYMENT" }
  - { id: ERR_OPEN_EXPOSURE_EXISTS, http: 409, condition: "Carrier suspend/terminate or Lane retire blocked by open claims" }
  - { id: ERR_FILING_DEADLINE_PASSED, http: 422, condition: "now() > claim.filing_deadline_at at submit" }
  - { id: ERR_REQUIRED_DOCUMENT_MISSING, http: 422, condition: "Missing required BOL or COMMERCIAL_INVOICE at submit" }
  - { id: ERR_DOCUMENTS_NOT_VERIFIED, http: 422, condition: "One or more ClaimDocument not in VERIFIED state at assessment" }
  - { id: ERR_CLAIM_AMOUNT_EXCEEDS_DECLARED_VALUE, http: 422, condition: "claimed_amount_cents > shipment.declared_value_cents" }
  - { id: ERR_SHIPMENT_NOT_DELIVERED, http: 409, condition: "Shipment not in DELIVERED state when opening claim" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Test-driving operations: logical clock, calendar"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /freight-claims/calendar"
    shared_operations: []

  - name: ClaimsClerk
    description: "Intake: opens claims, attaches documents, submits, withdraws"
    identity: opaque
    exclusive_operations:
      - "POST /freight-claims/shipments"
      - "POST /freight-claims/claims"
      - "POST /freight-claims/claims/{id}/submit"
      - "POST /freight-claims/claims/{id}/withdraw"
      - "POST /freight-claims/claims/{id}/documents"
    shared_operations:
      - "GET (any resource)"

  - name: ClaimsAdjuster
    description: "Assessment + first-line settlement authority (TIER_1)"
    identity: opaque
    exclusive_operations:
      - "POST /freight-claims/claims/{id}/acknowledge"
      - "POST /freight-claims/claims/{id}/documents/{docId}/verify"
      - "POST /freight-claims/claims/{id}/documents/{docId}/reject"
      - "POST /freight-claims/claims/{id}/assessments"
      - "POST /freight-claims/claims/{id}/decline"
      - "POST /freight-claims/claims/{id}/settlements (TIER_1 only)"
      - "POST /freight-claims/claims/{id}/settlements/{sid}/counter"
      - "POST /freight-claims/claims/{id}/settlements/{sid}/withdraw"
      - "POST /freight-claims/claims/{id}/appeals"
    shared_operations:
      - "GET (any resource)"
      - "GET /freight-claims/claims/{id}/liability-preview"

  - name: ClaimsManager
    description: "Approves assessments, TIER_2 settlement authority, appeal decision, carrier/lane admin"
    identity: opaque
    exclusive_operations:
      - "POST /freight-claims/carriers"
      - "POST /freight-claims/carriers/{id}/suspend"
      - "POST /freight-claims/carriers/{id}/reinstate"
      - "POST /freight-claims/lanes"
      - "POST /freight-claims/lanes/{id}/retire"
      - "POST /freight-claims/carrier-lane-assignments"
      - "POST /freight-claims/claims/{id}/assessments/{aid}/approve"
      - "POST /freight-claims/claims/{id}/appeals/{apid}/escalate"
      - "POST /freight-claims/claims/{id}/appeals/{apid}/decide"
      - "POST /freight-claims/claims/{id}/settlements/{sid}/accept (TIER_2)"
      - "POST /freight-claims/claims/{id}/settlements/{sid}/reject"
      - "POST /freight-claims/claims/{id}/close"
    shared_operations:
      - "GET (any resource)"
      - "GET /freight-claims/claims/{id}/liability-preview"

  - name: SalvageCoordinator
    description: "Schedules, executes, cancels salvage"
    identity: opaque
    exclusive_operations:
      - "POST /freight-claims/claims/{id}/salvage"
      - "POST /freight-claims/claims/{id}/salvage/{sid}/execute"
      - "POST /freight-claims/claims/{id}/salvage/{sid}/cancel"
    shared_operations:
      - "GET (any resource)"

  - name: SubrogationSpecialist
    description: "Pursues third-party recovery"
    identity: opaque
    exclusive_operations:
      - "POST /freight-claims/claims/{id}/subrogation"
      - "POST /freight-claims/claims/{id}/subrogation/{cid}/send-demand"
      - "POST /freight-claims/claims/{id}/subrogation/{cid}/litigate"
      - "POST /freight-claims/claims/{id}/subrogation/{cid}/settle"
      - "POST /freight-claims/claims/{id}/subrogation/{cid}/close-unrecoverable"
    shared_operations:
      - "GET (any resource)"

  - name: FinanceController
    description: "Reserve authority, TIER_3 settlement, carrier termination"
    identity: opaque
    exclusive_operations:
      - "POST /freight-claims/claims/{id}/reserves"
      - "POST /freight-claims/claims/{id}/reserves/{rid}/release"
      - "POST /freight-claims/carriers/{id}/terminate"
      - "POST /freight-claims/claims/{id}/settlements/{sid}/accept (TIER_3)"
    shared_operations:
      - "GET (any resource)"

  - name: Any
    description: "Read-only pseudo-role: every authenticated role shares GET access"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET /freight-claims/carriers, /carriers/{id}"
      - "GET /freight-claims/lanes, /lanes/{id}"
      - "GET /freight-claims/carrier-lane-assignments, /carrier-lane-assignments/{id}"
      - "GET /freight-claims/shipments, /shipments/{id}"
      - "GET /freight-claims/claims, /claims/{id}"
      - "GET /freight-claims/claims/{id}/documents, /documents/{docId}"
      - "GET /freight-claims/claims/{id}/assessments, /assessments/{aid}"
      - "GET /freight-claims/claims/{id}/salvage, /salvage/{sid}"
      - "GET /freight-claims/claims/{id}/appeals, /appeals/{apid}"
      - "GET /freight-claims/claims/{id}/settlements, /settlements/{sid}"
      - "GET /freight-claims/claims/{id}/subrogation, /subrogation/{cid}"
      - "GET /freight-claims/claims/{id}/reserves, /reserves/{rid}"
      - "GET /freight-claims/claims/{id}/events"
      - "GET /freight-claims/calendar"
      - "GET /freight-claims/analytics/*"
