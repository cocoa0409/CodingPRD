# =============================================================================
# task_2320 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 9 rule_ids x 2 instances = 18 instances. Every literal in `assert:` was
# computed against the §1.3 formulas and their constants before being written.
# The logical clock starts at 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: manifest_charge_provisional_vs_final_diverges
        grounds:
          - calculations.acceptance_charge
          - state_machines.Manifest.EN_ROUTE_to_DISCREPANT
          - state_machines.Manifest.DISCREPANT_to_VERIFIED
          - state_machines.Manifest.VERIFIED_to_CERTIFIED
          - entities.Manifest.fields.provisional_charge_cents
          - entities.Manifest.fields.final_charge_cents
          - entities.Generator.fields.charge_adjustment_cents
        distinguishing_aspect: |
          The PROVISIONAL variant prices received_quantity_kg (1250.5 kg -> 63774 cents) while the
          FINAL variant prices accepted_quantity_kg after the discrepancy adjustment (1180.0 kg ->
          60390 cents), so the two variants of the SAME calculation on the SAME manifest differ by
          exactly -3384 cents, which is the value the generator's charge_adjustment_cents records.
        test_recipe:
          setup:
            - "Facility with an ACTIVE permit and 90,000,000 cents of posted financial assurance"
            - "Generator ACTIVE, one APPROVED BULK_LIQUID / ORGANIC_SOLVENT / NONE profile (rate 48 cents per kg)"
            - "Manifest with one bulk line declared 1500.0 kg in 5 containers, received short at 1250.5 kg"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION", "STABILIZATION", "NEUTRALIZATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D001", "F003"], physical_form: "BULK_LIQUID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${prof_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_v1: $.data.version }
            - call: "POST /tsdf/waste-profiles/${prof_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 12500.0, measured_flash_point_c: 43.0, measured_ph: 7.2, expected_waste_profile_version: "${prof_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
            - call: "POST /tsdf/waste-profiles/${prof_id}/decision"
              payload: { decision: "APPROVE", approved_treatment_method: "INCINERATION" }
              as: WasteApprovalChemist
              as_user_id: "chem-02"
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000001", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 1500.0, declared_container_count: 5, is_bulk: true }] }
              as: ReceivingClerk
              captures: { man_id: $.data.id }
            - call: "POST /tsdf/manifests/${man_id}/receive"
              payload: { received_lines: [{ line_number: 1, received_quantity_kg: 1250.5, received_container_count: 5 }] }
              as: ReceivingClerk
            - call: "GET /tsdf/manifests/${man_id}/lines"
              payload: {}
              as: ReceivingClerk
              captures: { line1_id: "$.data[0].id" }
          trigger:
            - call: "POST /tsdf/manifests/${man_id}/discrepancy-resolution"
              payload: { resolution_type: "ACCEPT_ADJUSTED", discrepancy_report_filed: true, adjusted_lines: [{ line_number: 1, accepted_quantity_kg: 1180.0 }] }
              as: ComplianceManager
            - call: "POST /tsdf/manifests/${man_id}/certify"
              payload: {}
              as: ReceivingClerk
          assert:
            - "Manifest.${man_id}.provisional_charge_cents == 63774"
            - "Manifest.${man_id}.final_charge_cents == 60390"
            - "ManifestLine.${line1_id}.provisional_line_charge_cents == 63774"
            - "ManifestLine.${line1_id}.final_line_charge_cents == 60390"
            - "ManifestLine.${line1_id}.accepted_quantity_kg == 1180.0"
            - "ManifestLine.${line1_id}.returned_quantity_kg == 70.5"
            - "Generator.${gen_id}.open_charge_cents == 0"
            - "Generator.${gen_id}.settled_charge_cents == 60390"
            - "Generator.${gen_id}.charge_adjustment_cents == -3384"
            - "Manifest.${man_id}.status == CERTIFIED"

      - name: generator_reliability_rolling_vs_lifetime_diverges
        grounds:
          - calculations.generator_reliability_score
          - entities.Generator.fields.reliability_score_rolling
          - entities.Generator.fields.reliability_score_lifetime
          - state_machines.Manifest.VERIFIED_to_CERTIFIED
        distinguishing_aspect: |
          Four closed manifests where only the OLDEST was DISCREPANT: the ROLLING_WINDOW variant
          (3 most recent by arrived_at DESC) scores 100 while the LIFETIME variant scores 89, so the
          divergence is produced purely by the variant's manifest set, not by different weights.
        test_recipe:
          setup:
            - "Generator with four CERTIFIED manifests received on 2026-08-02, 08-03, 08-04 and 08-05"
            - "Only the 2026-08-02 manifest was DISCREPANT (bulk line declared 1000.0, received 900.0 = exactly 10%)"
            - "One APPROVED profile, so profile_fail_rate is 0 in both variants"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D001"], physical_form: "BULK_LIQUID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${prof_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_v1: $.data.version }
            - call: "POST /tsdf/waste-profiles/${prof_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 12500.0, measured_flash_point_c: 43.0, measured_ph: 7.2, expected_waste_profile_version: "${prof_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
            - call: "POST /tsdf/waste-profiles/${prof_id}/decision"
              payload: { decision: "APPROVE", approved_treatment_method: "INCINERATION" }
              as: WasteApprovalChemist
              as_user_id: "chem-02"
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000001", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 1000.0, declared_container_count: 1, is_bulk: true }] }
              as: ReceivingClerk
              captures: { man1_id: $.data.id }
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000002", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 100.0, declared_container_count: 1, is_bulk: true }] }
              as: ReceivingClerk
              captures: { man2_id: $.data.id }
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000003", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 100.0, declared_container_count: 1, is_bulk: true }] }
              as: ReceivingClerk
              captures: { man3_id: $.data.id }
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000004", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 100.0, declared_container_count: 1, is_bulk: true }] }
              as: ReceivingClerk
              captures: { man4_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/manifests/${man1_id}/receive"
              payload: { received_lines: [{ line_number: 1, received_quantity_kg: 900.0, received_container_count: 1 }] }
              as: ReceivingClerk
            - call: "POST /tsdf/manifests/${man1_id}/discrepancy-resolution"
              payload: { resolution_type: "ACCEPT_ADJUSTED", discrepancy_report_filed: true, adjusted_lines: [{ line_number: 1, accepted_quantity_kg: 900.0 }] }
              as: ComplianceManager
            - call: "POST /tsdf/manifests/${man1_id}/certify"
              payload: {}
              as: ReceivingClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/manifests/${man2_id}/receive"
              payload: { received_lines: [{ line_number: 1, received_quantity_kg: 100.0, received_container_count: 1 }] }
              as: ReceivingClerk
            - call: "POST /tsdf/manifests/${man2_id}/certify"
              payload: {}
              as: ReceivingClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/manifests/${man3_id}/receive"
              payload: { received_lines: [{ line_number: 1, received_quantity_kg: 100.0, received_container_count: 1 }] }
              as: ReceivingClerk
            - call: "POST /tsdf/manifests/${man3_id}/certify"
              payload: {}
              as: ReceivingClerk
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/manifests/${man4_id}/receive"
              payload: { received_lines: [{ line_number: 1, received_quantity_kg: 100.0, received_container_count: 1 }] }
              as: ReceivingClerk
            - call: "POST /tsdf/manifests/${man4_id}/certify"
              payload: {}
              as: ReceivingClerk
          trigger:
            - call: "GET /tsdf/generators/${gen_id}/reliability-score"
              payload: {}
              as: ComplianceManager
          assert:
            - "Generator.${gen_id}.reliability_score_rolling == 100"
            - "Generator.${gen_id}.reliability_score_lifetime == 89"
            - "Manifest.${man1_id}.discrepancy_type == QUANTITY_SIGNIFICANT"
            - "Manifest.${man4_id}.discrepancy_type == NONE"

  - rule_id: combinatorial_formula
    instances:
      - name: line_charge_rounds_per_line_then_sums
        grounds:
          - calculations.acceptance_charge
          - entities.ManifestLine.fields.provisional_line_charge_cents
          - entities.Manifest.fields.provisional_charge_cents
          - state_machines.Manifest.EN_ROUTE_to_VERIFIED
        distinguishing_aspect: |
          Mode b: two lines each land on a half-cent (23.0 kg x 43.50 = 1000.5 and 33.0 kg x 60.50 =
          1996.5), so rounding per line before summation yields 4498 while summing raw and rounding
          once yields 4497 — a one-cent discriminator that only per-line rounding reproduces.
        test_recipe:
          setup:
            - "Two APPROVED profiles: SOLID / WATER_REACTIVE / NONE (rate 43.50) and SLUDGE / ACID / NONE (rate 60.50)"
            - "One manifest with two containerized lines: 23.0 kg in 1 container and 33.0 kg in 1 container"
            - "Received exactly as declared, so the manifest verifies with no discrepancy"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["STABILIZATION", "NEUTRALIZATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "SURETY_BOND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D003"], physical_form: "SOLID", compatibility_class: "WATER_REACTIVE", ldr_subcategory: "NONE", declared_constituent_ppm: 8000.0, declared_flash_point_c: 90.0, declared_ph: 9.0, requested_treatment_method: "STABILIZATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { profA_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${profA_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { profA_v1: $.data.version }
            - call: "POST /tsdf/waste-profiles/${profA_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 8200.0, measured_flash_point_c: 91.0, measured_ph: 9.2, expected_waste_profile_version: "${profA_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
            - call: "POST /tsdf/waste-profiles/${profA_id}/decision"
              payload: { decision: "APPROVE", approved_treatment_method: "STABILIZATION" }
              as: WasteApprovalChemist
              as_user_id: "chem-02"
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D002"], physical_form: "SLUDGE", compatibility_class: "ACID", ldr_subcategory: "NONE", declared_constituent_ppm: 5000.0, declared_flash_point_c: 95.0, declared_ph: 2.0, requested_treatment_method: "NEUTRALIZATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { profB_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${profB_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { profB_v1: $.data.version }
            - call: "POST /tsdf/waste-profiles/${profB_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 5100.0, measured_flash_point_c: 95.0, measured_ph: 2.1, expected_waste_profile_version: "${profB_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
            - call: "POST /tsdf/waste-profiles/${profB_id}/decision"
              payload: { decision: "APPROVE", approved_treatment_method: "NEUTRALIZATION" }
              as: WasteApprovalChemist
              as_user_id: "chem-02"
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000010", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${profA_id}", declared_quantity_kg: 23.0, declared_container_count: 1, is_bulk: false }, { waste_profile_id: "${profB_id}", declared_quantity_kg: 33.0, declared_container_count: 1, is_bulk: false }] }
              as: ReceivingClerk
              captures: { man_id: $.data.id }
          trigger:
            - call: "POST /tsdf/manifests/${man_id}/receive"
              payload: { received_lines: [{ line_number: 1, received_quantity_kg: 23.0, received_container_count: 1 }, { line_number: 2, received_quantity_kg: 33.0, received_container_count: 1 }] }
              as: ReceivingClerk
            - call: "GET /tsdf/manifests/${man_id}/lines"
              payload: {}
              as: ReceivingClerk
              captures: { l1_id: "$.data[0].id", l2_id: "$.data[1].id" }
          assert:
            - "ManifestLine.${l1_id}.provisional_line_charge_cents == 1751"
            - "ManifestLine.${l2_id}.provisional_line_charge_cents == 2747"
            - "Manifest.${man_id}.provisional_charge_cents == 4498"
            - "Manifest.${man_id}.provisional_charge_cents != 4497"
            - "Generator.${gen_id}.open_charge_cents == 4498"
            - "Manifest.${man_id}.status == VERIFIED"

      - name: financial_assurance_tier_keyed_on_closure_cost_not_total
        grounds:
          - calculations.financial_assurance_requirement
          - entities.Facility.fields.closure_base_cost_cents
          - entities.Facility.fields.assurance_tier
          - entities.Facility.fields.required_assurance_cents
        distinguishing_aspect: |
          Mode c: with 2700.0 kg in storage the closure base is 29,860,000 cents, which is still below
          the 30,000,000 TIER_1 ceiling, so the surcharge is 5% and required assurance is 39,353,000 —
          re-deriving the tier from the SURCHARGED closure cost (31,353,000) would flip it to TIER_2
          and produce 40,846,000, which the assert forbids.
        test_recipe:
          setup:
            - "Facility with post_closure_cost_cents 8,000,000 and 90,000,000 cents posted"
            - "One APPROVED profile and a received manifest line of 2700.0 kg"
            - "A single container holding exactly 2700.0 kg, so held_mass_kg == 2700.0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tsdf/facilities"
              payload: { name: "Ridgeline TSDF", epa_id: "TXD000111222", permit_number: "TX-HW-0091", permit_expires_at: "2027-06-30T00:00:00Z", permitted_methods: ["INCINERATION"], max_concurrent_treatment_batches: 5, post_closure_cost_cents: 8000000 }
              as: PlatformAdmin
              captures: { fac_id: $.data.id, fac_v: $.data.version }
            - call: "POST /tsdf/financial-assurance-instruments"
              payload: { facility_id: "${fac_id}", instrument_type: "TRUST_FUND", face_amount_cents: 90000000, effective_on: "2026-07-01", expected_facility_version: "${fac_v}" }
              as: ComplianceManager
            - call: "POST /tsdf/generators"
              payload: { epa_id: "TXR000555666", name: "Bayou Coatings", generator_category: "LQG", state_code: "TX" }
              as: PlatformAdmin
              captures: { gen_id: $.data.id }
            - call: "POST /tsdf/storage-units"
              payload: { facility_id: "${fac_id}", unit_code: "CA-01", unit_type: "CONTAINER_AREA", permitted_capacity_kg: 20000.0, aisle_width_cm: 120.0, aisle_free_container_capacity: 20, inspection_frequency_days: 7, allowed_compatibility_classes: ["ORGANIC_SOLVENT", "ACID"], air_emission_control_level: "LEVEL_2", containment_volume_l: 5000.0 }
              as: ComplianceManager
              captures: { unit_id: $.data.id }
            - call: "POST /tsdf/waste-profiles"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", waste_codes: ["D001"], physical_form: "BULK_LIQUID", compatibility_class: "ORGANIC_SOLVENT", ldr_subcategory: "NONE", declared_constituent_ppm: 12000.0, declared_flash_point_c: 42.0, declared_ph: 7.0, requested_treatment_method: "INCINERATION", recertification_months: 12 }
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_id: $.data.id }
            - call: "POST /tsdf/waste-profiles/${prof_id}/submit"
              payload: {}
              as: Generator
              as_user_id: "${gen_id}"
              captures: { prof_v1: $.data.version }
            - call: "POST /tsdf/waste-profiles/${prof_id}/samples"
              payload: { sample_type: "FINGERPRINT", measured_constituent_ppm: 12500.0, measured_flash_point_c: 43.0, measured_ph: 7.2, expected_waste_profile_version: "${prof_v1}" }
              as: WasteApprovalChemist
              as_user_id: "chem-01"
            - call: "POST /tsdf/waste-profiles/${prof_id}/decision"
              payload: { decision: "APPROVE", approved_treatment_method: "INCINERATION" }
              as: WasteApprovalChemist
              as_user_id: "chem-02"
            - call: "POST /tsdf/manifests"
              payload: { generator_id: "${gen_id}", facility_id: "${fac_id}", manifest_tracking_number: "MTN0000020", transporter_epa_id: "TXT000999", shipped_on: "2026-08-01", lines: [{ waste_profile_id: "${prof_id}", declared_quantity_kg: 2700.0, declared_container_count: 1, is_bulk: true }] }
              as: ReceivingClerk
              captures: { man_id: $.data.id }
            - call: "POST /tsdf/manifests/${man_id}/receive"
              payload: { received_lines: [{ line_number: 1, received_quantity_kg: 2700.0, received_container_count: 1 }] }
              as: ReceivingClerk
            - call: "GET /tsdf/manifests/${man_id}/lines"
              payload: {}
              as: ReceivingClerk
