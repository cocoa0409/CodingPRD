      - name: seat_hold_windows_closed_interval_touching_rejected
        grounds:
          - validations.priority_18
          - entities.Seat.fields.max_concurrent_holds
          - entities.SeatAssignment.fields.hold_start
          - entities.SeatAssignment.fields.hold_end
          - state_machines.SeatAssignment.HELD_to_RELEASED_system_supersede
        distinguishing_aspect: |
          Seat hold windows use the OPPOSITE convention to event windows: the
          hold interval is CLOSED, so a second pick at exactly the prior hold's
          hold_end (2026-09-04T12:00:00.000Z) collides and returns
          ERR_SEAT_HOLD_CONFLICT, while the same pick one millisecond later
          succeeds and supersedes the stale hold with release_reason
          SUPERSEDED_BY_NEW_HOLD, leaving the seat in HELD rather than AVAILABLE.
        test_recipe:
          setup:
