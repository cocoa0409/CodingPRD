            - "Trigger 3: park_feature_count == 7 and park_risk_score == 84.0 (70.0 * 1.2) - stored, not rejected; the gate lives on the opening decision."
            - "Trigger 4: park_feature_count == 10 and park_risk_score == 100.0 (360.0 clamped by min(100.0, ...))."
            - "Every trigger leaves park_state == 'PARK_BUILT' and resets park_inspected_by_user_id to null."
            - "Every trigger increments TerrainArea.version by 1."

      - name: groom_coverage_on_a_winched_black_route_applies_both_penalty_factors
        claim_type: correct_result
        grounds:
          - calculations.groom_coverage_pct
          - entities.GroomingTask.fields.winch_required
          - entities.TerrainArea.fields.groom_ready
          - state_machines.TerrainArea.PREP_to_READY
        distinguishing_aspect: |
          WINCH_EFFICIENCY_FACTOR (0.8) and BLACK_CLASS_FACTOR (0.9) multiply, so a winched BLACK route
          needs 1 / 0.72 = 1.389x the passes of an unwinched BLUE run of the same acreage. 14 passes on
          12.0 acres yield 63.0 percent - just under the 70.0 readiness floor - and coverage is not
          accumulated across tasks, so the second task with 23 passes replaces rather than adds, lands
          above 100 and is clamped to 100.0, which finally fires PREP -> READY.
        test_recipe:
          setup:
            - "A BLACK 12.0 acre area with a 40.0 inch base and two on-duty patrollers assigned."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
