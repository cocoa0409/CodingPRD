      - name: rbac_missing_role_header_rejected_before_role_lookup
        claim_type: cross_role_denial
        grounds: ["errors[ERR_MISSING_AUTH_HEADERS]", "validations[priority=1]", response_envelope.error]
        distinguishing_aspect: "The companion of the blank-X-User-ID case: X-User-ID is present and valid while X-User-Role is absent, so the answer must be 401 ERR_MISSING_AUTH_HEADERS - not 403 ERR_ROLE_NOT_PERMITTED, which would leak that the operation is role-gated."
        test_recipe:
          setup: ["One partner, one cycle and one PENDING_VETTING volunteer."]
          setup_api_calls:
            - {call: "POST /partner-orgs", as: ProgramManager, as_user_id: "pm-1", payload: {name: "Riverside Literacy Trust", contact_email: "ops@riverside.example", sector: EDUCATION, annual_budget_usd: 3000000.00}, captures: {partner_id: "$.data.id"}}
            - {call: "POST /program-cycles", as: ProgramManager, as_user_id: "pm-1", payload: {cycle_code: "2026-Q4", starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z", capacity_slot_total: 4}, captures: {cycle_id: "$.data.id"}}
            - {call: "POST /volunteers", as: ProgramManager, as_user_id: "pm-1", payload: {full_name: "Dana Okafor", email: "dana@vol.example", professional_rate_usd_per_hour: 200.00, seniority: SENIOR, weekly_hours_cap: 20}, captures: {vol_id: "$.data.id"}}
          trigger:
            - {call: "POST /volunteers/${vol_id}/vet", as: "(X-User-Role header omitted entirely)", as_user_id: "pm-1", payload: {verify_skill_codes: ["TAX_LAW"]}, captures: {err: "$.data.error_id"}}
          assert:
            - "HTTP 401"
            - "data.error_id == \"ERR_MISSING_AUTH_HEADERS\""
            - "the error envelope carries meta.api_request_id and response_type == \"error\""
            - "GET /volunteers/${vol_id} shows status == \"PENDING_VETTING\""
