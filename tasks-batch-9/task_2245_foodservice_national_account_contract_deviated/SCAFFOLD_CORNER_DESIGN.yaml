          - entities.Manufacturer.fields.status
        excluded_because:
          difficulty_instance: manufacturer_decision_requires_active_manufacturer
          rationale: |
            That §1.8 instance is precisely an "A -> B only if entity C is in state X"
            guard: the deviation's SUBMITTED -> MANUFACTURER_APPROVED edge is allowed
            only while the Manufacturer is ACTIVE, tested from both sides.


