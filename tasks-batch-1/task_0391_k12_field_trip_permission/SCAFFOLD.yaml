# =============================================================================
# Scaffold: K-12 Field Trip & Permission Management (Expert)
# task_0391_k12_field_trip_permission
# =============================================================================

scenario: |
  391. K-12 Field Trip & Permission Management: trip request & approval chain,
  permission-slip e-sign & medical/allergy, fee collection & scholarship,
  chaperone & ratio, roster & headcount/attendance, transportation booking,
  emergency contact, refund/cancellation

domain_name: k12-field-trip
api_prefix: ""    # root-mounted; every entity is a flat top-level collection (/field-trips, /permission-slips, /chaperones, …) so each FK is reverse-reachable via a filtered list GET

# -----------------------------------------------------------------------------
# Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: multi-party negotiation     # teacher → principal → district approval chain
  secondary_archetype: quota / allocation         # seats, chaperone ratio, scholarship pool
  complexity_layers:
    - optimistic_concurrency                       # OCC on FieldTrip.version for roster-lock supersede
    - cascading_side_effects                       # trip cancel → slips → fees → bookings → vehicle seats
    - dual_variant_calculation                     # provisional vs final fee; withdrawal vs cancellation refund
    - rate_threshold_triggers                       # chaperone ratio tiers; scholarship pool boundary

  entity_topology: flat
  # Every entity is a flat top-level collection referenced by foreign key
  # (FieldTrip, PermissionSlip, Chaperone, TransportBooking, ScholarshipGrant,
  # FeeTransaction, AttendanceRecord, TripApproval, EmergencyContact, plus the
  # peer references Student, Guardian, Vehicle, ScholarshipPool). Creation and
  # state-transition actions are nested under the owning trip/slip for context,
  # but every read is a flat GET with FK filters.

  state_machine_shape: cyclic
  # FieldTrip: branching approval chain with reject→DRAFT revision loops (cyclic);
  # PermissionSlip: parallel signature_status × payment_status dimensions, each
  # cyclic (sign→revoke→re-sign; pay→refund).

  relationship_patterns:
    - one_to_many        # FieldTrip → PermissionSlip / Chaperone / TransportBooking / Attendance
    - many_to_many       # Guardian ↔ Student via PermissionSlip; Vehicle ↔ FieldTrip via TransportBooking
    - cross_aggregate    # PermissionSlip → Student / Guardian; TransportBooking → Vehicle; slip → ScholarshipPool

  role_model: approval_chain
  # Teacher (requester) → Principal (school approver) → DistrictAdmin (final approver);
  # Guardian signs/pays/withdraws their own student's slip; no approver can act as
  # the requester's role on the same step.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # --- Flat reference entities (peers, referenced by FK) ---
  - name: Student
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Student full name" }
      - { name: grade_level, type: integer, source: input, description: "Grade 0 (K) through 12", constraints: "0 <= grade_level <= 12" }
      - { name: special_needs, type: boolean, source: input, default: false, description: "True if student requires a dedicated 1:1 chaperone" }
      - { name: home_school_code, type: string, source: input, description: "School the student is enrolled at" }

  - name: Guardian
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Guardian / parent full name" }
      - { name: email, type: string, source: input, description: "Guardian email (unique)", constraints: "unique across Guardian" }
      - { name: phone, type: string, source: input, description: "Guardian phone number" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: label, type: string, source: input, description: "Bus/vehicle label e.g. 'Bus 12'" }
      - { name: seat_capacity, type: integer, source: input, description: "Total passenger seats", constraints: "seat_capacity >= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | RETIRED", constraints: "ACTIVE, RETIRED" }
      - { name: seats_reserved, type: integer, source: computed, description: "Sum of seat_count over this vehicle's CONFIRMED TransportBookings; conserved invariant" }

  - name: ScholarshipPool
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Funding pool name e.g. 'Title-I FY26'" }
      - { name: total_cents, type: integer, source: input, description: "Total funds in cents", constraints: "total_cents >= 0" }
      - { name: granted_cents, type: integer, source: computed, description: "Sum of award_cents over this pool's ACTIVE ScholarshipGrants" }
      - { name: remaining_cents, type: integer, source: computed, description: "total_cents - granted_cents; conserved invariant" }

  # --- Aggregate root ---
  - name: FieldTrip
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Trip title" }
      - { name: organizer_teacher_id, type: string, source: input, description: "FK -> Guardian.id; the Teacher user who requested the trip (Teacher identity is entity_backed:Guardian)" }
      - { name: school_code, type: string, source: input, description: "Owning school code" }
      - { name: grade_band, type: enum, source: input, description: "ELEMENTARY | MIDDLE | HIGH; selects the base chaperone ratio tier", constraints: "ELEMENTARY, MIDDLE, HIGH" }
      - { name: depart_at, type: datetime, source: input, description: "Trip departure timestamp (ISO 8601 UTC)" }
      - { name: return_at, type: datetime, source: input, description: "Trip return timestamp (ISO 8601 UTC); must be after depart_at" }
      - { name: has_water_activity, type: boolean, source: input, default: false, description: "True if trip includes swimming/water; raises ratio surcharge" }
      - { name: capacity, type: integer, source: input, description: "Max student participants", constraints: "capacity >= 1" }
      - { name: base_fee_cents, type: integer, source: input, description: "Fixed per-student admission portion in cents", constraints: "base_fee_cents >= 0" }
      - { name: transport_cost_cents, type: integer, source: input, description: "Total transport cost in cents to be split across confirmed students", constraints: "transport_cost_cents >= 0" }
      - { name: deposit_cents, type: integer, source: input, default: 0, description: "Non-refundable deposit portion of each per-student fee, in cents", constraints: "deposit_cents >= 0" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | PENDING_PRINCIPAL | PENDING_DISTRICT | APPROVED | ROSTER_LOCKED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: signed_count, type: integer, source: computed, description: "Count of PermissionSlips on this trip with signature_status == SIGNED" }
      - { name: confirmed_count, type: integer, source: computed, description: "Count of PermissionSlips with participation_status == CONFIRMED (snapshot taken at roster-lock)" }
      - { name: required_chaperones, type: integer, source: computed, description: "Output of chaperone_ratio_requirement over current SIGNED slips" }
      - { name: collected_fees_cents, type: integer, source: computed, description: "Sum of FeeTransaction.amount_cents (PAYMENT minus REFUND) over this trip; conserved cash invariant" }
      - { name: per_student_final_fee_cents, type: integer, source: computed, description: "Final per-student fee fixed at roster-lock; null until ROSTER_LOCKED" }

  # --- Aggregate children ---
  - name: TripApproval
    parent: FieldTrip
    common_fields: false   # append-only audit record: id + created_at only
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FieldTrip.id" }
      - { name: step, type: enum, source: system, description: "PRINCIPAL | DISTRICT; which approval step this record represents", constraints: "PRINCIPAL, DISTRICT" }
      - { name: decision, type: enum, source: input, description: "APPROVE | REJECT", constraints: "APPROVE, REJECT" }
      - { name: actor_role, type: enum, source: system, description: "PRINCIPAL | DISTRICT_ADMIN; role that recorded the decision", constraints: "PRINCIPAL, DISTRICT_ADMIN" }
      - { name: actor_user_id, type: string, source: system, description: "X-User-ID of the approver (opaque operator id)" }
      - { name: comment, type: string, source: input, required: false, description: "Optional decision comment" }

  - name: PermissionSlip
    parent: FieldTrip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FieldTrip.id" }
      - { name: student_id, type: string, source: input, description: "FK -> Student.id" }
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id; the signing guardian" }
      - { name: signature_status, type: enum, source: system, default: "UNSIGNED", description: "UNSIGNED | SIGNED | REVOKED (signature dimension)", constraints: "UNSIGNED, SIGNED, REVOKED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "UNPAID | PAID | REFUNDED (payment dimension, independent of signature)", constraints: "UNPAID, PAID, REFUNDED" }
      - { name: participation_status, type: enum, source: system, default: "PENDING", description: "PENDING | CONFIRMED | WITHDRAWN; CONFIRMED is snapshot at roster-lock for SIGNED slips", constraints: "PENDING, CONFIRMED, WITHDRAWN" }
      - { name: signed_at, type: datetime, source: system, description: "Timestamp signature_status last became SIGNED; null if never signed; tie-break key for remainder allocation" }
      - { name: medical_notes, type: string, source: input, required: false, description: "Free-text medical notes captured at signing" }
      - { name: allergies, type: array, source: input, default: [], description: "List of allergy strings captured at signing" }
      - { name: fee_due_cents, type: integer, source: computed, description: "Per-student fee owed by this slip after scholarship; provisional before roster-lock, final after" }
      - { name: scholarship_award_cents, type: integer, source: computed, description: "Active scholarship award applied to this slip; 0 if none" }
      - { name: net_paid_cents, type: integer, source: computed, description: "Sum of this slip's FeeTransaction PAYMENT amounts minus REFUND amounts" }

  - name: EmergencyContact
    parent: PermissionSlip
    common_fields: false   # immutable child record: id + created_at only
    fields:
      - { name: slip_id, type: string, source: system, description: "FK -> PermissionSlip.id" }
      - { name: name, type: string, source: input, description: "Emergency contact name" }
      - { name: phone, type: string, source: input, description: "Emergency contact phone" }
      - { name: relationship, type: string, source: input, description: "Relationship to student e.g. 'aunt'" }

  - name: ScholarshipGrant
    parent: PermissionSlip
    common_fields: true
    fields:
      - { name: slip_id, type: string, source: system, description: "FK -> PermissionSlip.id" }
      - { name: pool_id, type: string, source: input, description: "FK -> ScholarshipPool.id" }
      - { name: award_cents, type: integer, source: input, description: "Requested award in cents (capped at slip waivable amount)", constraints: "award_cents >= 1" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | REVOKED", constraints: "ACTIVE, REVOKED" }

  - name: Chaperone
    parent: FieldTrip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FieldTrip.id" }
      - { name: guardian_id, type: string, source: input, description: "FK -> Guardian.id; the person chaperoning" }
      - { name: assigned_student_id, type: string, source: input, required: false, description: "FK -> Student.id; set when this chaperone is the dedicated 1:1 for a special_needs student" }
      - { name: status, type: enum, source: system, default: "INVITED", description: "INVITED | CONFIRMED | CLEARED | WITHDRAWN", constraints: "INVITED, CONFIRMED, CLEARED, WITHDRAWN" }
      - { name: background_check_ref, type: string, source: input, required: false, description: "Background-check reference required to reach CLEARED" }

  - name: TransportBooking
    parent: FieldTrip
    common_fields: true
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FieldTrip.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: seat_count, type: integer, source: input, description: "Seats reserved on the vehicle for this trip", constraints: "seat_count >= 1" }
      - { name: status, type: enum, source: system, default: "REQUESTED", description: "REQUESTED | CONFIRMED | CANCELLED", constraints: "REQUESTED, CONFIRMED, CANCELLED" }

  - name: FeeTransaction
    parent: PermissionSlip
    common_fields: false   # append-only ledger entry: id + created_at only
    fields:
      - { name: slip_id, type: string, source: system, description: "FK -> PermissionSlip.id" }
      - { name: trip_id, type: string, source: system, description: "FK -> FieldTrip.id" }
      - { name: kind, type: enum, source: system, description: "PAYMENT | REFUND", constraints: "PAYMENT, REFUND" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: positive for PAYMENT, negative for REFUND" }
      - { name: reason, type: enum, source: system, description: "GUARDIAN_PAYMENT | TRIP_CANCELLATION | VOLUNTARY_WITHDRAWAL", constraints: "GUARDIAN_PAYMENT, TRIP_CANCELLATION, VOLUNTARY_WITHDRAWAL" }

  - name: AttendanceRecord
    parent: FieldTrip
    common_fields: false   # append-only headcount event: id + created_at only
    fields:
      - { name: trip_id, type: string, source: system, description: "FK -> FieldTrip.id" }
      - { name: slip_id, type: string, source: input, description: "FK -> PermissionSlip.id" }
      - { name: checkpoint, type: enum, source: input, description: "DEPARTURE | RETURN", constraints: "DEPARTURE, RETURN" }
      - { name: present, type: boolean, source: input, description: "True if student present at this checkpoint" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  # FieldTrip — branching approval chain with reject→DRAFT revision loops (cyclic)
  # ---------------------------------------------------------------------------
  - entity: FieldTrip
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_PRINCIPAL
        trigger: "POST /field-trips/{tripId}/submit"
        actor: Teacher
        preconditions:
          - "Trip in DRAFT (ERR_TRIP_NOT_DRAFT)"
          - "return_at strictly after depart_at (ERR_INVALID_TIME_WINDOW)"
          - "capacity >= 1 (ERR_INVALID_CAPACITY)"
        side_effects: []

      - from: PENDING_PRINCIPAL
        to: PENDING_DISTRICT
        trigger: "POST /field-trips/{tripId}/approvals (step PRINCIPAL, decision APPROVE)"
        actor: Principal
        preconditions:
          - "Trip in PENDING_PRINCIPAL (ERR_TRIP_NOT_AWAITING_PRINCIPAL)"
        side_effects:
          - "Append TripApproval{step:PRINCIPAL, decision:APPROVE, actor_role:PRINCIPAL}"

      - from: PENDING_PRINCIPAL
        to: DRAFT
        trigger: "POST /field-trips/{tripId}/approvals (step PRINCIPAL, decision REJECT)"
        actor: Principal
        preconditions:
          - "Trip in PENDING_PRINCIPAL (ERR_TRIP_NOT_AWAITING_PRINCIPAL)"
        side_effects:
          - "Append TripApproval{step:PRINCIPAL, decision:REJECT, actor_role:PRINCIPAL}"
        note: "Revision loop — trip returns to DRAFT for teacher edits, then can be resubmitted."

      - from: PENDING_DISTRICT
        to: APPROVED
        trigger: "POST /field-trips/{tripId}/approvals (step DISTRICT, decision APPROVE)"
        actor: DistrictAdmin
        preconditions:
          - "Trip in PENDING_DISTRICT (ERR_TRIP_NOT_AWAITING_DISTRICT)"
        side_effects:
          - "Append TripApproval{step:DISTRICT, decision:APPROVE, actor_role:DISTRICT_ADMIN}"

      - from: PENDING_DISTRICT
        to: DRAFT
        trigger: "POST /field-trips/{tripId}/approvals (step DISTRICT, decision REJECT)"
        actor: DistrictAdmin
        preconditions:
          - "Trip in PENDING_DISTRICT (ERR_TRIP_NOT_AWAITING_DISTRICT)"
        side_effects:
          - "Append TripApproval{step:DISTRICT, decision:REJECT, actor_role:DISTRICT_ADMIN}"
        note: "Revision loop — district reject returns trip all the way to DRAFT."

      - from: APPROVED
        to: ROSTER_LOCKED
        trigger: "POST /field-trips/{tripId}/lock-roster"
        actor: Teacher
        preconditions:
          - "Trip in APPROVED (ERR_TRIP_NOT_APPROVED)"
          - "expected_trip_version matches FieldTrip.version (ERR_STALE_TRIP_VERSION) — OCC supersede guard"
          - "signed_count >= 1 (ERR_EMPTY_ROSTER)"
          - "Confirmed chaperones (status CLEARED) >= required_chaperones (ERR_CHAPERONE_RATIO_UNMET)"
          - "Trip has >= 1 CONFIRMED TransportBooking whose summed seat_count >= signed_count (ERR_TRANSPORT_NOT_BOOKED)"
        side_effects:
          - "Snapshot: every SIGNED PermissionSlip → participation_status CONFIRMED; every UNSIGNED/REVOKED slip → participation_status WITHDRAWN"
          - "Fix per_student_final_fee_cents via per_student_cost_allocation over confirmed slips"
          - "Each CONFIRMED slip fee_due_cents recomputed with FINAL variant; confirmed_count set"
          - "increments FieldTrip.version by 1"

      - from: ROSTER_LOCKED
        to: IN_PROGRESS
        trigger: "POST /field-trips/{tripId}/start"
        actor: Teacher
        preconditions:
          - "Trip in ROSTER_LOCKED (ERR_TRIP_NOT_LOCKED)"
        side_effects: []

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /field-trips/{tripId}/complete"
        actor: Teacher
        preconditions:
          - "Trip in IN_PROGRESS (ERR_TRIP_NOT_IN_PROGRESS)"
          - "Every CONFIRMED slip has a RETURN AttendanceRecord (ERR_RETURN_HEADCOUNT_INCOMPLETE)"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /field-trips/{tripId}/cancel"
        actor: Teacher
        preconditions:
          - "Trip not COMPLETED and not CANCELLED (ERR_TRIP_NOT_CANCELLABLE)"
        side_effects: []

      - from: PENDING_PRINCIPAL
        to: CANCELLED
        trigger: "POST /field-trips/{tripId}/cancel"
        actor: Teacher
        preconditions:
          - "Trip not COMPLETED and not CANCELLED (ERR_TRIP_NOT_CANCELLABLE)"
        side_effects: []

      - from: PENDING_DISTRICT
        to: CANCELLED
        trigger: "POST /field-trips/{tripId}/cancel"
        actor: Teacher
        preconditions:
          - "Trip not COMPLETED and not CANCELLED (ERR_TRIP_NOT_CANCELLABLE)"
        side_effects: []

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /field-trips/{tripId}/cancel"
        actor: Principal
        preconditions:
          - "Trip not COMPLETED and not CANCELLED (ERR_TRIP_NOT_CANCELLABLE)"
        side_effects:
          - "CASCADE depth-3: every PAID PermissionSlip → payment_status REFUNDED + signature_status REVOKED; for each, append FeeTransaction{kind:REFUND, reason:TRIP_CANCELLATION, amount_cents:-net_paid_cents} which recomputes slip.net_paid_cents → 0 and bumps FieldTrip.collected_fees_cents; then every CONFIRMED/REQUESTED TransportBooking → CANCELLED which releases Vehicle.seats_reserved; then every non-WITHDRAWN Chaperone → WITHDRAWN"

      - from: ROSTER_LOCKED
        to: CANCELLED
        trigger: "POST /field-trips/{tripId}/cancel"
        actor: Principal
        preconditions:
          - "Trip not COMPLETED and not CANCELLED (ERR_TRIP_NOT_CANCELLABLE)"
        side_effects:
          - "Same TRIP_CANCELLATION cascade as APPROVED → CANCELLED"

  # ---------------------------------------------------------------------------
  # PermissionSlip — parallel dimensions: signature_status × payment_status
  # ---------------------------------------------------------------------------
  - entity: PermissionSlip
    initial_state: UNSIGNED            # signature_status dimension; payment_status starts UNPAID independently
    terminal_states: []                # neither dimension is terminal — slips cycle
    transitions:
      # --- signature dimension ---
      - from: UNSIGNED
        to: SIGNED
        trigger: "POST /field-trips/{tripId}/permission-slips/{slipId}/sign"
        actor: Guardian
        preconditions:
          - "Acting Guardian is slip.guardian_id (ERR_NOT_SLIP_GUARDIAN)"
          - "Parent FieldTrip in APPROVED (ERR_TRIP_NOT_OPEN_FOR_SIGNING) — cross-entity state dependency"
          - "signature_status is UNSIGNED or REVOKED (ERR_SLIP_ALREADY_SIGNED)"
          - "Slip has >= 1 EmergencyContact (ERR_EMERGENCY_CONTACT_REQUIRED)"
          - "signed_count of trip < capacity (ERR_TRIP_AT_CAPACITY)"
        side_effects:
          - "signature_status → SIGNED; stamp signed_at = now"
          - "Recompute fee_due_cents (PROVISIONAL variant); FieldTrip.signed_count += 1; FieldTrip.required_chaperones recomputed"

      - from: SIGNED
        to: REVOKED
        trigger: "POST /field-trips/{tripId}/permission-slips/{slipId}/revoke"
        actor: Guardian
        preconditions:
          - "Acting Guardian is slip.guardian_id (ERR_NOT_SLIP_GUARDIAN)"
          - "Parent FieldTrip status in {APPROVED} (ERR_ROSTER_LOCKED) — cannot revoke after lock; use withdraw"
          - "signature_status is SIGNED (ERR_SLIP_NOT_SIGNED)"
        side_effects:
          - "CASCADE depth-2: signature_status → REVOKED → FieldTrip.signed_count -= 1 → FieldTrip.required_chaperones recomputed; if a Chaperone has assigned_student_id == slip.student_id, that 1:1 requirement is dropped from the ratio"

      - from: REVOKED
        to: SIGNED
        trigger: "POST /field-trips/{tripId}/permission-slips/{slipId}/sign"
        actor: Guardian
        preconditions:
          - "Same as UNSIGNED → SIGNED"
        side_effects:
          - "Same as UNSIGNED → SIGNED (re-sign loop)"

      # --- payment dimension (independent of signature) ---
      - from: UNPAID
        to: PAID
        trigger: "POST /field-trips/{tripId}/permission-slips/{slipId}/pay"
        actor: Guardian
        preconditions:
          - "Acting Guardian is slip.guardian_id (ERR_NOT_SLIP_GUARDIAN)"
          - "signature_status is SIGNED (ERR_SLIP_NOT_SIGNED)"
          - "payment_status is UNPAID (ERR_SLIP_ALREADY_PAID)"
          - "amount_cents == slip.fee_due_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "payment_status → PAID; append FeeTransaction{kind:PAYMENT, reason:GUARDIAN_PAYMENT, amount_cents:+fee_due_cents}"
          - "slip.net_paid_cents recomputed; FieldTrip.collected_fees_cents += fee_due_cents"

      - from: PAID
        to: REFUNDED
        trigger: "POST /field-trips/{tripId}/permission-slips/{slipId}/withdraw"
        actor: Guardian
        preconditions:
          - "Acting Guardian is slip.guardian_id (ERR_NOT_SLIP_GUARDIAN)"
          - "Parent FieldTrip not in {IN_PROGRESS, COMPLETED, CANCELLED} (ERR_TRIP_NOT_OPEN_FOR_WITHDRAWAL)"
          - "payment_status is PAID (ERR_SLIP_NOT_PAID)"
        side_effects:
          - "participation_status → WITHDRAWN; signature_status → REVOKED (if SIGNED); payment_status → REFUNDED"
          - "Compute voluntary_withdrawal_refund; append FeeTransaction{kind:REFUND, reason:VOLUNTARY_WITHDRAWAL, amount_cents:-refund}"
          - "slip.net_paid_cents recomputed; FieldTrip.collected_fees_cents -= refund; FieldTrip.signed_count adjusted if was SIGNED"

  # ---------------------------------------------------------------------------
  # Chaperone — invited → confirmed → cleared, with withdraw revert (cyclic)
  # ---------------------------------------------------------------------------
  - entity: Chaperone
    initial_state: INVITED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: INVITED
        to: CONFIRMED
        trigger: "POST /field-trips/{tripId}/chaperones/{chaperoneId}/confirm"
        actor: Guardian
        preconditions:
          - "Acting Guardian is chaperone.guardian_id (ERR_NOT_CHAPERONE_GUARDIAN)"
          - "Chaperone in INVITED (ERR_CHAPERONE_NOT_INVITED)"
        side_effects: []

      - from: CONFIRMED
        to: CLEARED
        trigger: "POST /field-trips/{tripId}/chaperones/{chaperoneId}/clear"
        actor: Principal
        preconditions:
          - "Chaperone in CONFIRMED (ERR_CHAPERONE_NOT_CONFIRMED)"
          - "Parent FieldTrip in {APPROVED, ROSTER_LOCKED} (ERR_TRIP_NOT_APPROVED) — cross-entity state dependency"
          - "background_check_ref present on the chaperone (ERR_BACKGROUND_CHECK_MISSING)"
          - "No other CLEARED Chaperone with the same guardian_id on a trip whose buffered window overlaps this trip (ERR_CHAPERONE_TIME_CONFLICT) — a person cannot chaperone two trips at once; interval semantics: half-open with TRAVEL_BUFFER on each side"
        side_effects:
          - "status → CLEARED; counts toward required_chaperones satisfaction"

      - from: INVITED
        to: WITHDRAWN
        trigger: "POST /field-trips/{tripId}/chaperones/{chaperoneId}/withdraw"
        actor: Guardian
        preconditions:
          - "Chaperone not WITHDRAWN (ERR_CHAPERONE_NOT_WITHDRAWABLE)"
          - "Parent FieldTrip not ROSTER_LOCKED (ERR_ROSTER_LOCKED) — cleared chaperones are frozen once roster locks"
        side_effects: []

      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /field-trips/{tripId}/chaperones/{chaperoneId}/withdraw"
        actor: Guardian
        preconditions:
          - "Same as INVITED → WITHDRAWN"
        side_effects: []

      - from: CLEARED
        to: WITHDRAWN
        trigger: "POST /field-trips/{tripId}/chaperones/{chaperoneId}/withdraw"
        actor: Guardian
        preconditions:
          - "Same as INVITED → WITHDRAWN"
        side_effects: []

  # ---------------------------------------------------------------------------
  # TransportBooking — requested → confirmed → cancelled
  # ---------------------------------------------------------------------------
  - entity: TransportBooking
    initial_state: REQUESTED
    terminal_states: [CANCELLED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /field-trips/{tripId}/transport-bookings/{bookingId}/confirm"
        actor: Teacher
        preconditions:
          - "Booking in REQUESTED (ERR_BOOKING_NOT_REQUESTED)"
          - "Vehicle.status == ACTIVE (ERR_VEHICLE_RETIRED) — cross-entity state dependency"
          - "Vehicle.seats_reserved + seat_count <= Vehicle.seat_capacity (ERR_VEHICLE_OVERBOOKED)"
          - "No other CONFIRMED booking on this Vehicle whose trip window [depart_at, return_at] overlaps this trip's window (ERR_VEHICLE_TIME_CONFLICT)"
        side_effects:
          - "status → CONFIRMED; Vehicle.seats_reserved += seat_count (seat conservation invariant)"

      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /field-trips/{tripId}/transport-bookings/{bookingId}/cancel"
        actor: Teacher
        preconditions:
          - "Booking not CANCELLED (ERR_BOOKING_NOT_CANCELLABLE)"
        side_effects: []

      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /field-trips/{tripId}/transport-bookings/{bookingId}/cancel"
        actor: Teacher
        preconditions:
          - "Booking not CANCELLED (ERR_BOOKING_NOT_CANCELLABLE)"
          - "Parent FieldTrip not ROSTER_LOCKED (ERR_ROSTER_LOCKED) — confirmed transport frozen at lock"
        side_effects:
          - "status → CANCELLED; Vehicle.seats_reserved -= seat_count (seat conservation invariant)"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: roster-lock-stale-trip
    parent_entity: FieldTrip
    write_endpoint: "POST /field-trips/{id}/lock-roster"
    occ_field: "expected_trip_version"
    description: |
      Locking the roster against a FieldTrip whose version has advanced since the
      client last observed it is rejected. A roster-lock takes a snapshot of which
      SIGNED slips become CONFIRMED and fixes per_student_final_fee_cents; if another
      writer signed/revoked a slip after the client read the trip, the client's
      view of signed_count and required_chaperones is stale and its lock would
      snapshot the wrong roster. The lock supersedes that stale view and is rejected
      when expected_trip_version does not match the current FieldTrip.version.
    error_id: ERR_STALE_TRIP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: chaperone_ratio_requirement
    trigger: "Recomputed on slip sign/revoke/withdraw; read at lock-roster precondition"
    algorithm: tiered_pricing
    formula: |
      Let S = FieldTrip.signed_count (count of slips with signature_status == SIGNED).
      Let N = count of SIGNED slips whose Student.special_needs == true.
      base_ratio = RATIO_BY_BAND[FieldTrip.grade_band]            # students per chaperone
      # general chaperones cover ALL signed students (special-needs included),
      # but each special-needs student additionally needs a dedicated 1:1.
      general = ceil(S / base_ratio)
      dedicated = N                                               # one 1:1 each
      surcharge = WATER_EXTRA if FieldTrip.has_water_activity else 0
      required_chaperones = general + dedicated + surcharge
      # boundary precision: S=10 MIDDLE → ceil(10/12)=1; S=13 → ceil(13/12)=2.
    input_set: "PermissionSlips of this trip with signature_status == SIGNED only"
    constants:
      RATIO_BY_BAND: { ELEMENTARY: 8, MIDDLE: 12, HIGH: 15 }
      WATER_EXTRA: 1
    precision: "integer (ceil for the general term)"
    note: "≥3 inputs (S, N, band, water flag), tiered ratio selection, nested ceil — combinatorial mode (a)."

  - name: slip_fee_due
    trigger: "Recomputed on sign (PROVISIONAL) and at lock-roster (FINAL); read on pay"
    algorithm: forward_looking
    formula: |
      gross = FieldTrip.base_fee_cents + transport_share
      where transport_share depends on the variant (see variants).
      scholarship = sum of award_cents over this slip's ScholarshipGrants with status == ACTIVE
      waivable = gross - FieldTrip.deposit_cents          # deposit is never waivable
      effective_scholarship = min(scholarship, max(waivable, 0))
      fee_due_cents = gross - effective_scholarship
    input_set: "This slip; its ACTIVE ScholarshipGrants; parent FieldTrip fee fields"
    constants: {}
    precision: "integer cents"
    variants:
      - name: PROVISIONAL
        when: "Computed at sign time, before roster-lock"
        difference: "transport_share = ceil(FieldTrip.transport_cost_cents / max(FieldTrip.signed_count, 1)) using the CURRENT live signed_count (an estimate that shifts as others sign/revoke)"
      - name: FINAL
        when: "Computed at lock-roster, fixed thereafter"
        difference: "transport_share = per_student_cost_allocation share for THIS slip using the frozen confirmed_count snapshot (exact, includes remainder allocation); divergence from PROVISIONAL when signed_count != confirmed_count"
    note: "Rule 1 dual-variant on the PermissionSlip domain — provisional estimate vs final allocation produce different cents."

  - name: per_student_cost_allocation
    trigger: "lock-roster side-effect; fixes per_student_final_fee_cents and each confirmed slip's FINAL transport_share"
    algorithm: waterfall_allocation
    formula: |
      C = FieldTrip.confirmed_count (slips snapshotted CONFIRMED at lock)
      if C == 0: abort lock with ERR_EMPTY_ROSTER
      base_share = transport_cost_cents // C            # integer floor division (round DOWN per-line first)
      remainder = transport_cost_cents - base_share * C  # leftover cents, 0 <= remainder < C
      # PIN: assign each leftover cent to confirmed slips ordered by signed_at ASC,
      #      then PermissionSlip.created_at ASC as tie-break (NEVER by id).
      Sort confirmed slips by (signed_at ASC, created_at ASC).
      For the first `remainder` slips in that order: transport_share = base_share + 1
      For the rest:                                     transport_share = base_share
      per_student_final_fee_cents = base_fee_cents + base_share   # representative (pre-remainder) figure
    input_set: "Slips with participation_status == CONFIRMED at the lock snapshot"
    constants: {}
    precision: "integer cents; floor-then-distribute-remainder (rounding order PINNED: per-line floor BEFORE remainder sweep)"
    note: "Rule 2 combinatorial mode (b): nested rounding where 'floor each share then sweep remainder' diverges from 'sum then round'; order is pinned."

  - name: voluntary_withdrawal_refund
    trigger: "Slip withdraw (payment PAID → REFUNDED)"
    algorithm: aggregation
    formula: |
      paid = slip.net_paid_cents                          # what the guardian actually paid
      sunk_transport = transport_share_of_this_slip       # transport portion is non-refundable once committed
      forfeit = FieldTrip.deposit_cents + sunk_transport
      refund = max(paid - forfeit, 0)
    input_set: "This slip's net_paid_cents; parent FieldTrip.deposit_cents; this slip's transport_share"
    constants: {}
    precision: "integer cents"
    variants:
      - name: VOLUNTARY_WITHDRAWAL
        when: "Guardian initiates withdraw on their own slip"
        difference: "deposit AND committed transport_share are forfeited; refund = max(paid - deposit - transport_share, 0)"
      - name: TRIP_CANCELLATION
        when: "Principal cancels the whole trip (cascade)"
        difference: "FULL refund regardless of deposit/transport: refund = paid (refund_amount_cents == net_paid_cents); nothing forfeited"
    note: "Rule 1 dual-variant on the FieldTrip/FeeTransaction domain — same paid slip refunds differently by trigger."

  - name: collected_fees_reconciliation
    trigger: "Any FeeTransaction append (pay, withdraw refund, cancellation refund)"
    algorithm: aggregation
    formula: |
      FieldTrip.collected_fees_cents = sum(amount_cents) over all FeeTransactions of this trip
        where PAYMENT amount_cents is positive and REFUND amount_cents is negative.
      slip.net_paid_cents = sum(amount_cents) over this slip's FeeTransactions.
      INVARIANT (conserved cash): FieldTrip.collected_fees_cents == sum over slips of net_paid_cents.
    input_set: "All FeeTransactions of the trip (append-only, no deletes)"
    constants: {}
    precision: "integer cents"
    note: "Rule 9 compensating invariant — conserved quantity = net cash; pay+refund leaves the equality intact."

  - name: vehicle_seat_reservation
    trigger: "TransportBooking confirm (+seat_count) and cancel (-seat_count)"
    algorithm: aggregation
    formula: |
      Vehicle.seats_reserved = sum(seat_count) over this vehicle's TransportBookings with status == CONFIRMED.
      INVARIANT (conserved seats): Vehicle.seats_reserved == sum of seat_count over CONFIRMED bookings, never exceeding seat_capacity.
    input_set: "TransportBookings of the vehicle with status == CONFIRMED"
    constants: {}
    precision: "integer seats"
    note: "Rule 9 compensating invariant — conserved quantity = vehicle seats; confirm+cancel restores seats_reserved."

  - name: vehicle_window_overlap
    trigger: "TransportBooking confirm precondition"
    algorithm: interval_merge
    formula: |
      Let [a1, b1] = parent trip's [depart_at, return_at] for the booking being confirmed.
      For every OTHER CONFIRMED booking on the SAME vehicle with parent trip window [a2, b2]:
        CLOSED-interval overlap test (NO buffer): conflict iff a1 <= b2 AND a2 <= b1.
        Touching endpoints DO collide (b1 == a2 is a conflict).
      Any conflict → reject confirm with ERR_VEHICLE_TIME_CONFLICT.
    input_set: "CONFIRMED TransportBookings on the vehicle and their parent trip windows"
    constants: {}
    precision: "datetime comparison; closed interval, no buffer"
    note: "Rule 8 overlap instance A — closed interval, no buffer, on Vehicle."

  - name: chaperone_window_overlap
    trigger: "Chaperone clear precondition"
    algorithm: interval_merge
    formula: |
      Let [a1, b1] = parent trip's [depart_at, return_at] for the chaperone being cleared;
      expand to a buffered window [a1 - TRAVEL_BUFFER, b1 + TRAVEL_BUFFER].
      For every OTHER CLEARED Chaperone with the SAME guardian_id, take its trip window
      [a2, b2] (NOT buffered) and test HALF-OPEN overlap against the buffered window:
        conflict iff (a1 - TRAVEL_BUFFER) < b2 AND a2 < (b1 + TRAVEL_BUFFER).
        Touching after-buffer endpoints do NOT collide (strict <).
      Any conflict → reject clear with ERR_CHAPERONE_TIME_CONFLICT.
    input_set: "CLEARED Chaperones sharing guardian_id and their trip windows"
    constants:
      TRAVEL_BUFFER: 3600   # seconds (1 hour) of travel padding on each side
    precision: "datetime comparison; half-open interval expanded by TRAVEL_BUFFER"
    note: "Rule 8 overlap instance B — half-open buffered interval, on the Guardian-as-chaperone resource; DIFFERENT interval semantics from vehicle_window_overlap."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a known role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right (trip before slip before nested)"
    error_id: "ERR_*_NOT_FOUND (ERR_TRIP_NOT_FOUND, ERR_SLIP_NOT_FOUND, ERR_CHAPERONE_NOT_FOUND, ERR_BOOKING_NOT_FOUND, ERR_STUDENT_NOT_FOUND, ERR_GUARDIAN_NOT_FOUND, ERR_VEHICLE_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_GRANT_NOT_FOUND)"
    http_status: 404
    applies_to: "all endpoints with path ids / FK body ids"

  - priority: 4
    category: business_referential
    check: "Acting Guardian owns the slip/chaperone they mutate (X-User-ID == slip.guardian_id / chaperone.guardian_id)"
    error_id: "ERR_NOT_SLIP_GUARDIAN / ERR_NOT_CHAPERONE_GUARDIAN"
    http_status: 403
    applies_to: "slip sign/revoke/pay/withdraw; chaperone confirm/withdraw"

  - priority: 4.5
    category: business_constraint
    check: "On POST /field-trips/{id}/approvals the body `step` value must equal the trip's current pending step (PRINCIPAL when PENDING_PRINCIPAL, DISTRICT when PENDING_DISTRICT); a well-formed but wrong-for-now step is rejected before the state-precondition check"
    error_id: ERR_INVALID_APPROVAL_STEP
    http_status: 422
    applies_to: "POST /field-trips/{id}/approvals"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: "varies (ERR_TRIP_NOT_DRAFT, ERR_TRIP_NOT_AWAITING_PRINCIPAL, ERR_TRIP_NOT_AWAITING_DISTRICT, ERR_TRIP_NOT_APPROVED, ERR_TRIP_NOT_LOCKED, ERR_TRIP_NOT_IN_PROGRESS, ERR_SLIP_ALREADY_SIGNED, ERR_SLIP_NOT_SIGNED, ERR_SLIP_ALREADY_PAID, ERR_SLIP_NOT_PAID, ERR_CHAPERONE_NOT_INVITED, ERR_CHAPERONE_NOT_CONFIRMED, ERR_BOOKING_NOT_REQUESTED)"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Cross-entity state gate: parent FieldTrip is in the state required for this child operation (sign requires APPROVED; clear requires APPROVED/ROSTER_LOCKED; withdraw requires not IN_PROGRESS/COMPLETED/CANCELLED)"
    error_id: "ERR_TRIP_NOT_OPEN_FOR_SIGNING / ERR_TRIP_NOT_OPEN_FOR_WITHDRAWAL / ERR_ROSTER_LOCKED"
    http_status: 409
    applies_to: "slip sign/revoke/withdraw; chaperone clear; booking cancel"

  - priority: 7
    category: business_temporal
    check: "Confirming a TransportBooking must not overlap another CONFIRMED booking on the same Vehicle (CLOSED-interval [depart_at, return_at] overlap, NO buffer; touching endpoints DO collide)"
    error_id: ERR_VEHICLE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /transport-bookings/{id}/confirm"

  - priority: 7.5
    category: business_temporal
    check: "Clearing a Chaperone must not collide with another CLEARED chaperone sharing the same guardian_id on a trip whose buffered window overlaps (HALF-OPEN window expanded by TRAVEL_BUFFER on each side; touching after-buffer endpoints do NOT collide)"
    error_id: ERR_CHAPERONE_TIME_CONFLICT
    http_status: 409
    applies_to: "POST /chaperones/{id}/clear"

  - priority: 8
    category: business_safety
    check: "Chaperone ratio satisfied at lock-roster: CLEARED chaperones >= required_chaperones"
    error_id: ERR_CHAPERONE_RATIO_UNMET
    http_status: 409
    applies_to: "POST /lock-roster"

  - priority: 9
    category: business_constraint
    check: "Capacity / overbooking: trip signed_count < capacity at sign; Vehicle.seats_reserved + seat_count <= seat_capacity at booking confirm; transport seats >= signed_count at lock"
    error_id: "ERR_TRIP_AT_CAPACITY / ERR_VEHICLE_OVERBOOKED / ERR_TRANSPORT_NOT_BOOKED"
    http_status: 409
    applies_to: "slip sign; booking confirm; lock-roster"

  - priority: 10
    category: business_constraint
    check: "Emergency contact present before a slip can be signed (>= 1 EmergencyContact)"
    error_id: ERR_EMERGENCY_CONTACT_REQUIRED
    http_status: 409
    applies_to: "POST /permission-slips/{id}/sign"

  - priority: 11
    category: business_fiscal
    check: "Scholarship award must not exceed pool remaining_cents and must not exceed the slip's waivable amount (gross - deposit)"
    error_id: "ERR_SCHOLARSHIP_POOL_EXHAUSTED / ERR_AWARD_EXCEEDS_WAIVABLE"
    http_status: 409
    applies_to: "POST /permission-slips/{id}/scholarship-grants"

  - priority: 12
    category: business_fiscal
    check: "Payment amount must equal slip.fee_due_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /permission-slips/{id}/pay"

  - priority: 13
    category: business_constraint
    check: "Roster non-empty at lock (signed_count >= 1); RETURN headcount complete at complete"
    error_id: "ERR_EMPTY_ROSTER / ERR_RETURN_HEADCOUNT_INCOMPLETE"
    http_status: 409
    applies_to: "POST /lock-roster; POST /complete"

  - priority: 14
    category: business_temporal
    check: "OCC: expected_trip_version on lock-roster matches FieldTrip.version (stale supersede guard)"
    error_id: ERR_STALE_TRIP_VERSION
    http_status: 412
    applies_to: "POST /lock-roster"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ===========================================================================
  # NOTE on topology: api_prefix is "" (root). Every entity is a FLAT top-level
  # collection with its own single-resource GET (<collection>/{id}) and a list GET
  # carrying every foreign-key field as an optional filter — so each FK in §1.1 is
  # reverse-reachable. Creation and state-transition actions remain nested under
  # the owning trip/slip for real-world context.
  # ===========================================================================

  # --- Student ---
  - method: POST
    path: "/students"
    description: "Register a student"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 201
    input: [full_name, grade_level, home_school_code, "special_needs?"]
    output: Student
    side_effects: []

  - method: GET
    path: "/students"
    description: "List students (filterable by school)"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: ["home_school_code?", "limit?", "offset?"]
    output: "Student[]"
    side_effects: []

  - method: GET
    path: "/students/{id}"
    description: "Get a student"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: []
    output: Student
    side_effects: []

  # --- Guardian ---
  - method: POST
    path: "/guardians"
    description: "Register a guardian"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 201
    input: [full_name, email, phone]
    output: Guardian
    side_effects: ["email uniqueness enforced (ERR_GUARDIAN_EMAIL_TAKEN)"]

  - method: GET
    path: "/guardians"
    description: "List guardians (filterable by email)"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: ["email?", "limit?", "offset?"]
    output: "Guardian[]"
    side_effects: []

  - method: GET
    path: "/guardians/{id}"
    description: "Get a guardian"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: []
    output: Guardian
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/vehicles"
    description: "Register a transport vehicle"
    roles: [DistrictAdmin]
    code: 201
    input: [label, seat_capacity]
    output: Vehicle
    side_effects: ["status ACTIVE; seats_reserved 0"]

  - method: GET
    path: "/vehicles"
    description: "List vehicles"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  - method: GET
    path: "/vehicles/{id}"
    description: "Get a vehicle (with seats_reserved)"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/vehicles/{id}/retire"
    description: "Retire a vehicle (no new confirmations)"
    roles: [DistrictAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["status -> RETIRED"]

  # --- ScholarshipPool ---
  - method: POST
    path: "/scholarship-pools"
    description: "Create a scholarship funding pool"
    roles: [DistrictAdmin]
    code: 201
    input: [name, total_cents]
    output: ScholarshipPool
    side_effects: ["granted_cents 0; remaining_cents = total_cents"]

  - method: GET
    path: "/scholarship-pools"
    description: "List scholarship pools"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "ScholarshipPool[]"
    side_effects: []

  - method: GET
    path: "/scholarship-pools/{id}"
    description: "Get a pool (with remaining_cents)"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: []
    output: ScholarshipPool
    side_effects: []

  - method: GET
    path: "/scholarship-grants"
    description: "List scholarship grants; reverse-reachability for ScholarshipGrant.slip_id and pool_id"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: ["slip_id?", "pool_id?", "status?", "limit?", "offset?"]
    output: "ScholarshipGrant[]"
    side_effects: []

  - method: GET
    path: "/scholarship-grants/{id}"
    description: "Get a scholarship grant"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: []
    output: ScholarshipGrant
    side_effects: []

  # --- FieldTrip ---
  - method: POST
    path: "/field-trips"
    description: "Create a field trip in DRAFT"
    roles: [Teacher]
    code: 201
    input: [title, organizer_teacher_id, school_code, grade_band, depart_at, return_at, capacity, base_fee_cents, transport_cost_cents, "deposit_cents?", "has_water_activity?"]
    output: FieldTrip
    side_effects: ["status DRAFT; signed_count 0; collected_fees_cents 0; version 1"]

  - method: GET
    path: "/field-trips"
    description: "List field trips; reverse-reachability for FieldTrip.organizer_teacher_id -> Guardian"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: ["organizer_teacher_id?", "school_code?", "status?", "limit?", "offset?"]
    output: "FieldTrip[]"
    side_effects: []

  - method: GET
    path: "/field-trips/{id}"
    description: "Get a field trip (with computed counts and fees)"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: []
    output: FieldTrip
    side_effects: []

  - method: POST
    path: "/field-trips/{id}/submit"
    description: "Submit DRAFT trip into the approval chain"
    roles: [Teacher]
    code: 200
    input: []
    output: FieldTrip
    side_effects: ["status DRAFT -> PENDING_PRINCIPAL"]

  - method: POST
    path: "/field-trips/{id}/approvals"
    description: "Record an approval-chain decision (principal or district step)"
    roles: [Principal, DistrictAdmin]
    code: 201
    input: [step, decision, "comment?"]
    output: TripApproval
    side_effects:
      - "PRINCIPAL APPROVE: PENDING_PRINCIPAL -> PENDING_DISTRICT"
      - "PRINCIPAL REJECT: PENDING_PRINCIPAL -> DRAFT"
      - "DISTRICT APPROVE: PENDING_DISTRICT -> APPROVED"
      - "DISTRICT REJECT: PENDING_DISTRICT -> DRAFT"

  - method: POST
    path: "/field-trips/{id}/lock-roster"
    description: "Lock the roster: snapshot confirmed slips, fix final fees, enforce ratio + transport (OCC-guarded)"
    roles: [Teacher]
    code: 200
    input: [expected_trip_version]
    output: FieldTrip
    side_effects:
      - "status APPROVED -> ROSTER_LOCKED"
      - "SIGNED slips -> CONFIRMED; UNSIGNED/REVOKED -> WITHDRAWN; per_student_cost_allocation fixes final fees; confirmed_count set"
      - "increments FieldTrip.version by 1"

  - method: POST
    path: "/field-trips/{id}/start"
    description: "Start the trip (begin in-progress)"
    roles: [Teacher]
    code: 200
    input: []
    output: FieldTrip
    side_effects: ["status ROSTER_LOCKED -> IN_PROGRESS"]

  - method: POST
    path: "/field-trips/{id}/complete"
    description: "Complete the trip (requires RETURN headcount complete)"
    roles: [Teacher]
    code: 200
    input: []
    output: FieldTrip
    side_effects: ["status IN_PROGRESS -> COMPLETED"]

  - method: POST
    path: "/field-trips/{id}/cancel"
    description: "Cancel the trip; cascades refunds, booking cancellations, chaperone withdrawals"
    roles: [Teacher, Principal]
    code: 200
    input: []
    output: FieldTrip
    side_effects:
      - "status -> CANCELLED"
      - "TRIP_CANCELLATION cascade (full refunds, seats released, chaperones withdrawn) when trip was APPROVED/ROSTER_LOCKED"

  - method: GET
    path: "/trip-approvals"
    description: "List approval records; reverse-reachability for TripApproval.trip_id -> FieldTrip"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: ["trip_id?", "step?", "limit?", "offset?"]
    output: "TripApproval[]"
    side_effects: []

  - method: GET
    path: "/trip-approvals/{id}"
    description: "Get an approval record"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: []
    output: TripApproval
    side_effects: []

  # --- PermissionSlip ---
  - method: POST
    path: "/field-trips/{id}/permission-slips"
    description: "Create a permission slip (assign a student + signing guardian)"
    roles: [Teacher]
    code: 201
    input: [student_id, guardian_id, "medical_notes?", "allergies?"]
    output: PermissionSlip
    side_effects: ["signature_status UNSIGNED; payment_status UNPAID; participation_status PENDING"]

  - method: GET
    path: "/permission-slips"
    description: "List permission slips; reverse-reachability for PermissionSlip.trip_id, student_id, guardian_id"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: ["trip_id?", "student_id?", "guardian_id?", "signature_status?", "limit?", "offset?"]
    output: "PermissionSlip[]"
    side_effects: []

  - method: GET
    path: "/permission-slips/{id}"
    description: "Get a permission slip"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: []
    output: PermissionSlip
    side_effects: []

  - method: POST
    path: "/field-trips/{tripId}/permission-slips/{id}/sign"
    description: "Guardian e-signs the slip (or re-signs after revoke)"
    roles: [Guardian]
    code: 200
    input: []
    output: PermissionSlip
    side_effects:
      - "signature_status -> SIGNED; signed_at stamped"
      - "fee_due_cents recomputed (PROVISIONAL); FieldTrip.signed_count += 1; required_chaperones recomputed"

  - method: POST
    path: "/field-trips/{tripId}/permission-slips/{id}/revoke"
    description: "Guardian revokes signature before roster lock"
    roles: [Guardian]
    code: 200
    input: []
    output: PermissionSlip
    side_effects:
      - "signature_status -> REVOKED; FieldTrip.signed_count -= 1; required_chaperones recomputed"

  - method: POST
    path: "/field-trips/{tripId}/permission-slips/{id}/pay"
    description: "Guardian pays the slip fee"
    roles: [Guardian]
    code: 200
    input: [amount_cents]
    output: PermissionSlip
    side_effects:
      - "payment_status -> PAID; append FeeTransaction PAYMENT; FieldTrip.collected_fees_cents += fee_due_cents"

  - method: POST
    path: "/field-trips/{tripId}/permission-slips/{id}/withdraw"
    description: "Guardian withdraws their student (refund per voluntary_withdrawal_refund)"
    roles: [Guardian]
    code: 200
    input: []
    output: PermissionSlip
    side_effects:
      - "participation_status -> WITHDRAWN; signature_status -> REVOKED if SIGNED; payment_status -> REFUNDED if PAID"
      - "append FeeTransaction REFUND (VOLUNTARY_WITHDRAWAL); FieldTrip.collected_fees_cents -= refund"

  # --- EmergencyContact ---
  - method: POST
    path: "/field-trips/{tripId}/permission-slips/{id}/emergency-contacts"
    description: "Add an emergency contact to a slip"
    roles: [Teacher, Guardian]
    code: 201
    input: [name, phone, relationship]
    output: EmergencyContact
    side_effects: []

  - method: GET
    path: "/emergency-contacts"
    description: "List emergency contacts; reverse-reachability for EmergencyContact.slip_id -> PermissionSlip"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: ["slip_id?", "limit?", "offset?"]
    output: "EmergencyContact[]"
    side_effects: []

  - method: GET
    path: "/emergency-contacts/{id}"
    description: "Get an emergency contact"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: []
    output: EmergencyContact
    side_effects: []

  # --- ScholarshipGrant ---
  - method: POST
    path: "/field-trips/{tripId}/permission-slips/{id}/scholarship-grants"
    description: "Grant a scholarship award against a slip from a pool"
    roles: [Teacher, Principal]
    code: 201
    input: [pool_id, award_cents]
    output: ScholarshipGrant
    side_effects:
      - "status ACTIVE; pool.granted_cents += award_cents; pool.remaining_cents -= award_cents; slip.fee_due_cents + scholarship_award_cents recomputed"

  - method: POST
    path: "/field-trips/{tripId}/permission-slips/{slipId}/scholarship-grants/{id}/revoke"
    description: "Revoke a scholarship award (returns funds to pool)"
    roles: [Teacher, Principal]
    code: 200
    input: []
    output: ScholarshipGrant
    side_effects:
      - "status -> REVOKED; pool.granted_cents -= award_cents; pool.remaining_cents += award_cents; slip fee recomputed (pool conservation)"

  # --- Chaperone ---
  - method: POST
    path: "/field-trips/{id}/chaperones"
    description: "Invite a chaperone (optionally dedicated 1:1 for a special-needs student)"
    roles: [Teacher]
    code: 201
    input: [guardian_id, "assigned_student_id?", "background_check_ref?"]
    output: Chaperone
    side_effects: ["status INVITED"]

  - method: GET
    path: "/chaperones"
    description: "List chaperones; reverse-reachability for Chaperone.trip_id, guardian_id, assigned_student_id"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: ["trip_id?", "guardian_id?", "assigned_student_id?", "status?", "limit?", "offset?"]
    output: "Chaperone[]"
    side_effects: []

  - method: GET
    path: "/chaperones/{id}"
    description: "Get a chaperone"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: []
    output: Chaperone
    side_effects: []

  - method: POST
    path: "/field-trips/{tripId}/chaperones/{id}/confirm"
    description: "Guardian confirms a chaperone invitation"
    roles: [Guardian]
    code: 200
    input: []
    output: Chaperone
    side_effects: ["status INVITED -> CONFIRMED"]

  - method: POST
    path: "/field-trips/{tripId}/chaperones/{id}/clear"
    description: "Principal clears a confirmed chaperone (background check + overlap check)"
    roles: [Principal]
    code: 200
    input: []
    output: Chaperone
    side_effects: ["status CONFIRMED -> CLEARED"]

  - method: POST
    path: "/field-trips/{tripId}/chaperones/{id}/withdraw"
    description: "Chaperone withdraws"
    roles: [Guardian]
    code: 200
    input: []
    output: Chaperone
    side_effects: ["status -> WITHDRAWN"]

  # --- TransportBooking ---
  - method: POST
    path: "/field-trips/{id}/transport-bookings"
    description: "Request a transport booking on a vehicle"
    roles: [Teacher]
    code: 201
    input: [vehicle_id, seat_count]
    output: TransportBooking
    side_effects: ["status REQUESTED"]

  - method: GET
    path: "/transport-bookings"
    description: "List transport bookings; reverse-reachability for TransportBooking.trip_id and vehicle_id"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: ["trip_id?", "vehicle_id?", "status?", "limit?", "offset?"]
    output: "TransportBooking[]"
    side_effects: []

  - method: GET
    path: "/transport-bookings/{id}"
    description: "Get a transport booking"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: []
    output: TransportBooking
    side_effects: []

  - method: POST
    path: "/field-trips/{tripId}/transport-bookings/{id}/confirm"
    description: "Confirm a transport booking (overlap + capacity checks)"
    roles: [Teacher]
    code: 200
    input: []
    output: TransportBooking
    side_effects: ["status REQUESTED -> CONFIRMED; Vehicle.seats_reserved += seat_count"]

  - method: POST
    path: "/field-trips/{tripId}/transport-bookings/{id}/cancel"
    description: "Cancel a transport booking (releases seats)"
    roles: [Teacher]
    code: 200
    input: []
    output: TransportBooking
    side_effects: ["status -> CANCELLED; if was CONFIRMED, Vehicle.seats_reserved -= seat_count"]

  # --- FeeTransaction (append-only ledger; read-only surface) ---
  - method: GET
    path: "/fee-transactions"
    description: "List fee transactions; reverse-reachability for FeeTransaction.slip_id and trip_id"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: ["slip_id?", "trip_id?", "kind?", "limit?", "offset?"]
    output: "FeeTransaction[]"
    side_effects: []

  - method: GET
    path: "/fee-transactions/{id}"
    description: "Get a fee transaction"
    roles: [Teacher, Principal, DistrictAdmin, Guardian]
    code: 200
    input: []
    output: FeeTransaction
    side_effects: []

  # --- Attendance ---
  - method: POST
    path: "/field-trips/{id}/attendance"
    description: "Record a headcount/attendance event for a slip at a checkpoint"
    roles: [Teacher]
    code: 201
    input: [slip_id, checkpoint, present]
    output: AttendanceRecord
    side_effects: []

  - method: GET
    path: "/attendance-records"
    description: "List attendance records; reverse-reachability for AttendanceRecord.trip_id and slip_id"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: ["trip_id?", "slip_id?", "checkpoint?", "limit?", "offset?"]
    output: "AttendanceRecord[]"
    side_effects: []

  - method: GET
    path: "/attendance-records/{id}"
    description: "Get an attendance record"
    roles: [Teacher, Principal, DistrictAdmin]
    code: 200
    input: []
    output: AttendanceRecord
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing or role unknown" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Acting role not permitted for this endpoint per RBAC" }

  # --- Existence ---
  - { id: ERR_TRIP_NOT_FOUND, http: 404, condition: "FieldTrip with tripId does not exist" }
  - { id: ERR_SLIP_NOT_FOUND, http: 404, condition: "PermissionSlip with slipId does not exist on the trip" }
  - { id: ERR_CHAPERONE_NOT_FOUND, http: 404, condition: "Chaperone with chaperoneId does not exist on the trip" }
  - { id: ERR_BOOKING_NOT_FOUND, http: 404, condition: "TransportBooking with bookingId does not exist on the trip" }
  - { id: ERR_GRANT_NOT_FOUND, http: 404, condition: "ScholarshipGrant with grantId does not exist on the slip" }
  - { id: ERR_STUDENT_NOT_FOUND, http: 404, condition: "Student referenced by student_id does not exist" }
  - { id: ERR_GUARDIAN_NOT_FOUND, http: 404, condition: "Guardian referenced by guardian_id / organizer_teacher_id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "Vehicle referenced by vehicle_id does not exist" }
  - { id: ERR_POOL_NOT_FOUND, http: 404, condition: "ScholarshipPool referenced by pool_id does not exist" }

  # --- Referential ownership ---
  - { id: ERR_NOT_SLIP_GUARDIAN, http: 403, condition: "Acting Guardian's X-User-ID is not slip.guardian_id" }
  - { id: ERR_NOT_CHAPERONE_GUARDIAN, http: 403, condition: "Acting Guardian's X-User-ID is not chaperone.guardian_id" }
  - { id: ERR_GUARDIAN_EMAIL_TAKEN, http: 409, condition: "Guardian email already registered" }

  # --- Trip state ---
  - { id: ERR_TRIP_NOT_DRAFT, http: 409, condition: "submit requires trip in DRAFT" }
  - { id: ERR_TRIP_NOT_AWAITING_PRINCIPAL, http: 409, condition: "PRINCIPAL approval step requires trip in PENDING_PRINCIPAL" }
  - { id: ERR_TRIP_NOT_AWAITING_DISTRICT, http: 409, condition: "DISTRICT approval step requires trip in PENDING_DISTRICT" }
  - { id: ERR_TRIP_NOT_APPROVED, http: 409, condition: "operation requires trip in APPROVED" }
  - { id: ERR_TRIP_NOT_LOCKED, http: 409, condition: "start requires trip in ROSTER_LOCKED" }
  - { id: ERR_TRIP_NOT_IN_PROGRESS, http: 409, condition: "complete requires trip in IN_PROGRESS" }
  - { id: ERR_TRIP_NOT_CANCELLABLE, http: 409, condition: "cancel requires trip not already COMPLETED or CANCELLED" }
  - { id: ERR_ROSTER_LOCKED, http: 409, condition: "operation not allowed after roster is locked (revoke/withdraw-chaperone/cancel-booking)" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "return_at not strictly after depart_at" }
  - { id: ERR_INVALID_CAPACITY, http: 422, condition: "capacity < 1 at submit" }
  - { id: ERR_INVALID_APPROVAL_STEP, http: 422, condition: "approval step value does not match the trip's current pending step" }

  # --- Slip state / cross-entity ---
  - { id: ERR_TRIP_NOT_OPEN_FOR_SIGNING, http: 409, condition: "sign/revoke requires parent trip in APPROVED" }
  - { id: ERR_TRIP_NOT_OPEN_FOR_WITHDRAWAL, http: 409, condition: "withdraw requires parent trip not IN_PROGRESS/COMPLETED/CANCELLED" }
  - { id: ERR_SLIP_ALREADY_SIGNED, http: 409, condition: "sign requires signature_status UNSIGNED or REVOKED" }
  - { id: ERR_SLIP_NOT_SIGNED, http: 409, condition: "revoke/pay requires signature_status SIGNED" }
  - { id: ERR_SLIP_ALREADY_PAID, http: 409, condition: "pay requires payment_status UNPAID" }
  - { id: ERR_SLIP_NOT_PAID, http: 409, condition: "withdraw requires payment_status PAID" }
  - { id: ERR_EMERGENCY_CONTACT_REQUIRED, http: 409, condition: "sign requires at least one EmergencyContact on the slip" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 409, condition: "pay amount_cents does not equal slip.fee_due_cents" }

  # --- Chaperone / booking state ---
  - { id: ERR_CHAPERONE_NOT_INVITED, http: 409, condition: "confirm requires chaperone in INVITED" }
  - { id: ERR_CHAPERONE_NOT_CONFIRMED, http: 409, condition: "clear requires chaperone in CONFIRMED" }
  - { id: ERR_CHAPERONE_NOT_WITHDRAWABLE, http: 409, condition: "withdraw requires chaperone not already WITHDRAWN" }
  - { id: ERR_BACKGROUND_CHECK_MISSING, http: 409, condition: "clear requires background_check_ref on the chaperone" }
  - { id: ERR_BOOKING_NOT_REQUESTED, http: 409, condition: "confirm requires booking in REQUESTED" }
  - { id: ERR_BOOKING_NOT_CANCELLABLE, http: 409, condition: "cancel requires booking not already CANCELLED" }
  - { id: ERR_VEHICLE_RETIRED, http: 409, condition: "confirm requires Vehicle.status ACTIVE" }

  # --- Capacity / quota / temporal ---
  - { id: ERR_TRIP_AT_CAPACITY, http: 409, condition: "sign would push signed_count beyond capacity" }
  - { id: ERR_VEHICLE_OVERBOOKED, http: 409, condition: "confirm would push Vehicle.seats_reserved beyond seat_capacity" }
  - { id: ERR_VEHICLE_TIME_CONFLICT, http: 409, condition: "confirm overlaps another CONFIRMED booking window on the same vehicle" }
  - { id: ERR_CHAPERONE_TIME_CONFLICT, http: 409, condition: "clear conflicts with another CLEARED chaperone (same guardian) on an overlapping buffered trip window" }
  - { id: ERR_TRANSPORT_NOT_BOOKED, http: 409, condition: "lock requires CONFIRMED transport seats >= signed_count" }
  - { id: ERR_CHAPERONE_RATIO_UNMET, http: 409, condition: "lock requires CLEARED chaperones >= required_chaperones" }
  - { id: ERR_EMPTY_ROSTER, http: 409, condition: "lock requires signed_count >= 1" }
  - { id: ERR_RETURN_HEADCOUNT_INCOMPLETE, http: 409, condition: "complete requires a RETURN attendance record for every CONFIRMED slip" }

  # --- Scholarship fiscal ---
  - { id: ERR_SCHOLARSHIP_POOL_EXHAUSTED, http: 409, condition: "award_cents exceeds pool.remaining_cents" }
  - { id: ERR_AWARD_EXCEEDS_WAIVABLE, http: 409, condition: "award_cents exceeds slip waivable amount (gross - deposit)" }
  - { id: ERR_GRANT_NOT_ACTIVE, http: 409, condition: "revoke requires grant in ACTIVE" }

  # --- OCC ---
  - { id: ERR_STALE_TRIP_VERSION, http: 412, condition: "expected_trip_version on lock-roster does not match FieldTrip.version" }

  # --- Generic input ---
  - { id: ERR_VALIDATION, http: 422, condition: "missing/ill-typed required body field or invalid enum value" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Teacher
    description: "Trip organizer; creates/submits trips, builds roster, books transport, runs headcount"
    identity: "entity_backed:Guardian"   # a Teacher acts as a Guardian record; X-User-ID = that Guardian.id (= FieldTrip.organizer_teacher_id)
    exclusive_operations:
      - "POST /field-trips — create trip"
      - "POST /field-trips/{id}/submit — submit for approval"
      - "POST /field-trips/{id}/lock-roster — lock roster (OCC)"
      - "POST /field-trips/{id}/start — start trip"
      - "POST /field-trips/{id}/complete — complete trip"
      - "POST /field-trips/{id}/permission-slips — create slip"
      - "POST /field-trips/{id}/chaperones — invite chaperone"
      - "POST /field-trips/{id}/transport-bookings (+confirm/cancel) — manage transport"
      - "POST /field-trips/{id}/attendance — record headcount"
    shared_operations:
      - "POST /students, /guardians — register people (with Principal, DistrictAdmin)"
      - "POST /field-trips/{id}/cancel — cancel (with Principal)"
      - "POST .../scholarship-grants (+revoke) — grant scholarships (with Principal)"
      - "POST .../emergency-contacts — add emergency contact (with Guardian)"
      - "all GET reads"

  - name: Principal
    description: "School approver; approves/rejects principal step, clears chaperones, can cancel"
    identity: "opaque"
    exclusive_operations:
      - "POST /field-trips/{id}/approvals (step PRINCIPAL) — principal decision"
      - "POST /field-trips/{id}/chaperones/{id}/clear — clear chaperone background check"
    shared_operations:
      - "POST /students, /guardians — register people"
      - "POST /field-trips/{id}/cancel — cancel (with Teacher)"
      - "POST .../scholarship-grants (+revoke) — grant scholarships (with Teacher)"
      - "all GET reads"

  - name: DistrictAdmin
    description: "District approver and resource owner; approves district step, owns vehicles & pools"
    identity: "opaque"
    exclusive_operations:
      - "POST /field-trips/{id}/approvals (step DISTRICT) — district decision"
      - "POST /vehicles (+retire) — manage vehicles"
      - "POST /scholarship-pools — create funding pools"
    shared_operations:
      - "POST /students, /guardians — register people"
      - "all GET reads"

  - name: Guardian
    description: "Parent/guardian; signs/revokes/pays/withdraws own slip, confirms/withdraws own chaperone role"
    identity: "entity_backed:Guardian"   # X-User-ID = Guardian.id; ownership checks compare to slip.guardian_id / chaperone.guardian_id
    exclusive_operations:
      - "POST .../permission-slips/{id}/sign — e-sign own slip"
      - "POST .../permission-slips/{id}/revoke — revoke own signature"
      - "POST .../permission-slips/{id}/pay — pay own slip"
      - "POST .../permission-slips/{id}/withdraw — withdraw own student"
      - "POST .../chaperones/{id}/confirm — confirm own chaperone invite"
      - "POST .../chaperones/{id}/withdraw — withdraw own chaperone role"
    shared_operations:
      - "POST .../emergency-contacts — add emergency contact (with Teacher)"
      - "GET reads on trips/slips/chaperones/students/guardians they can view"
