# =============================================================================
# 1.8 Scaffold Difficulty Design — Test Targeting Index
# 19 instances across the nine Difficulty Rules (2 per rule; rule 6 has 3).
# All chains replay from empty-DB using only SCAFFOLD.yaml §1.5 endpoints.
# Canonical fixture literals: QUAL 6000bp / FEAT 4000bp; z=1.96, sd=60;
# embargo 2026-10-15T00:00:00Z; clock default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: index_score_provisional_vs_final_after_dedupe
        grounds:
          - calculations.index_score
          - calculations.factor_score
          - calculations.accepted_sample_count
          - state_machines.Study.FIELDING_to_FIELDING_CLOSED
        distinguishing_aspect: |
          BrandResult domain: provisional_index (pre-sweep ACCEPTED set) and final_index
          (post-sweep ACCEPTED set) apply the IDENTICAL weighted formula to different input
          sets — here 600 vs 800. The paired dual-variant instance lives on the License
          domain (fee quote vs invoice), so the two variants are on different entity domains.
        test_recipe:
          setup:
            - "Study (min_sample_per_brand 3) FIELDING with one PANEL frame for BrandA; respondent rt-1 submitted twice (QUAL10/FEAT10 at 09-02, QUAL2/FEAT2 at 09-03) and rt-2 once (QUAL6/FEAT6); all three ACCEPTED at ingest"
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 5 }
              as: FieldOps
              captures: { fa: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 10 }, { factor_code: "FEAT", score: 10 } ] }
              as: FieldOps
              captures: { r_keep: $.data.id }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-03T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 2 }, { factor_code: "FEAT", score: 2 } ] }
              as: FieldOps
              captures: { r_lost: $.data.id }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-2", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 6 }, { factor_code: "FEAT", score: 6 } ] }
              as: FieldOps
          trigger:
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING_CLOSED" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "SCORING" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/scoring/compute", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - { call: "GET /research/brand-results", payload: { study_id: "${sid}" }, as: AwardsOfficer }
          assert:
            - "BrandResult.provisional_accepted_n == 3 and BrandResult.accepted_n == 2 (the later rt-1 response is swept as DUPLICATE)"
            - "BrandResult.provisional_index == 600 (QUAL mean 6.0 -> 600, FEAT 600 over the pre-sweep 3-response set)"
            - "BrandResult.final_index == 800 (QUAL mean 8.0 -> 800, FEAT 800 over the post-sweep 2-response set)"
            - "Response ${r_lost}.quality_status == REJECTED with reject_reason DUPLICATE; ${r_keep} stays ACCEPTED (earlier submitted_at kept)"

      - name: license_fee_quote_vs_invoice_divergence
        grounds:
          - calculations.license_fee_quote
          - calculations.license_fee_invoice
          - state_machines.License.QUOTED_to_ACTIVE
        distinguishing_aspect: |
          License domain: fee_quote_cents (base + market surcharge only) vs fee_final_cents
          (term discount, prior-violation multiplier, floor) — 400000 vs 340000 on identical
          license fields. Distinct entity domain from the BrandResult index-score variant pair.
        test_recipe:
          setup:
            - "Study PUBLISHED (min_sample 1, single QUAL9/FEAT8 response -> final_index 860) with one PUBLISHED award for BrandA; ClientA (BRAND) registered for BrandA"
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 1, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 3 }
              as: FieldOps
              captures: { fa: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 9 }, { factor_code: "FEAT", score: 8 } ] }
              as: FieldOps
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING_CLOSED" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "SCORING" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/scoring/compute", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - { call: "POST /research/studies/${sid}/awards/determine", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - call: "GET /research/awards"
              payload: { study_id: "${sid}" }
              as: AwardsOfficer
              captures: { aw: "$.data[0].id" }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "PUBLISHED" }, as: StudyAdmin }
            - call: "POST /research/clients"
              payload: { name: "ClientA", client_type: "BRAND", country: "US", brand_id: "${ba}" }
              as: StudyAdmin
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /research/licenses"
              payload: { award_id: "${aw}", client_id: "${cl}", tier: "DIGITAL", term_months: 24, markets_count: 2 }
              as: LicensingManager
              captures: { lic: $.data.id }
            - { call: "POST /research/licenses/${lic}/state", payload: { to_status: "ACTIVE" }, as: LicensingManager }
            - { call: "GET /research/licenses/${lic}", payload: {}, as: LicensingManager }
          assert:
            - "License.fee_quote_cents == 400000 (250000 base + max(0, 2-1) x 150000 surcharge; no discount/multiplier/floor at quote)"
            - "License.fee_final_cents == 340000 (round_half_up(400000 x 0.85 term discount); floor 220000 not binding; no prior REVOKED license)"
            - "fee_quote_cents != fee_final_cents — the two variants diverge on the same license fields"

  - rule_id: combinatorial_formula
    instances:
      - name: index_score_per_factor_rounding_order
        grounds:
          - calculations.factor_score
          - calculations.index_score
        distinguishing_aspect: |
          Mode (b) nested rounding: factor scores are rounded to integers BEFORE the weighted
          sum, which is then rounded once. Fixture: 7 responses, QUAL all 4s (mean 400.0),
          FEAT [5,5,4,4,4,4,4] (mean 428.571.. -> 429). Pinned order: round_half_up(0.6*400 +
          0.4*429) = round_half_up(411.6) = 412; the unpinned sum-then-round order yields
          round_half_up(411.43) = 411 — a one-point observable difference.
        test_recipe:
          setup:
            - "Study (min_sample 3) FIELDING; BrandA PANEL frame with 7 ACCEPTED responses: QUAL always 4; FEAT scores 5,5,4,4,4,4,4"
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 7 }
              as: FieldOps
              captures: { fa: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 3, factor_scores: [ { factor_code: "QUAL", score: 4 }, { factor_code: "FEAT", score: 5 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-2", duration_seconds: 300, item_count: 15, distinct_values: 3, factor_scores: [ { factor_code: "QUAL", score: 4 }, { factor_code: "FEAT", score: 5 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-3", duration_seconds: 300, item_count: 15, distinct_values: 3, factor_scores: [ { factor_code: "QUAL", score: 4 }, { factor_code: "FEAT", score: 4 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-4", duration_seconds: 300, item_count: 15, distinct_values: 3, factor_scores: [ { factor_code: "QUAL", score: 4 }, { factor_code: "FEAT", score: 4 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-5", duration_seconds: 300, item_count: 15, distinct_values: 3, factor_scores: [ { factor_code: "QUAL", score: 4 }, { factor_code: "FEAT", score: 4 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-6", duration_seconds: 300, item_count: 15, distinct_values: 3, factor_scores: [ { factor_code: "QUAL", score: 4 }, { factor_code: "FEAT", score: 4 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-7", duration_seconds: 300, item_count: 15, distinct_values: 3, factor_scores: [ { factor_code: "QUAL", score: 4 }, { factor_code: "FEAT", score: 4 } ] }
              as: FieldOps
          trigger:
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING_CLOSED" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "SCORING" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/scoring/compute", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - { call: "GET /research/brand-results", payload: { study_id: "${sid}" }, as: AwardsOfficer }
          assert:
            - "BrandResult.final_index == 412 (per-factor rounding first: 400 and 429; 0.6*400 + 0.4*429 = 411.6 -> round_half_up = 412)"
            - "final_index != 411 — the sum-then-round order is observably wrong under the pinned rule"

      - name: license_fee_nested_surcharge_discount_multiplier
        grounds:
          - calculations.license_fee_quote
          - calculations.license_fee_invoice
        distinguishing_aspect: |
          Mode (a): fee combines tiered base selection, nested max(0, markets - included)
          surcharge, conditional term discount, conditional violation multiplier, and a final
          max() floor — >= 3 inputs with non-linear interaction. Exercises the market-surcharge
          boundary (4 vs 3 markets on NATIONAL's 3 included) plus all conditionals in the
          GLOBAL branch. Distinct mode from the rounding-order instance.
        test_recipe:
          setup:
            - "Study PUBLISHED with one award (same canonical chain as license_fee_quote_vs_invoice_divergence); ClientA registered; ClientA holds no prior licenses"
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 1, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 3 }
              as: FieldOps
              captures: { fa: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "rt-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 9 }, { factor_code: "FEAT", score: 8 } ] }
              as: FieldOps
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING_CLOSED" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "SCORING" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/scoring/compute", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - { call: "POST /research/studies/${sid}/awards/determine", payload: {}, as: AwardsOfficer, as_user_id: u_ao_001 }
            - call: "GET /research/awards"
              payload: { study_id: "${sid}" }
              as: AwardsOfficer
              captures: { aw: "$.data[0].id" }
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-10-15T00:00:00Z" }, as: StudyAdmin }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "PUBLISHED" }, as: StudyAdmin }
            - call: "POST /research/clients"
              payload: { name: "ClientA", client_type: "BRAND", country: "US", brand_id: "${ba}" }
              as: StudyAdmin
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /research/licenses"
              payload: { award_id: "${aw}", client_id: "${cl}", tier: "NATIONAL", term_months: 12, markets_count: 4 }
              as: LicensingManager
              captures: { l1: $.data.id }
            - call: "POST /research/licenses"
              payload: { award_id: "${aw}", client_id: "${cl}", tier: "NATIONAL", term_months: 12, markets_count: 3 }
              as: LicensingManager
              captures: { l2: $.data.id }
            - { call: "POST /research/licenses/${l1}/state", payload: { to_status: "ACTIVE" }, as: LicensingManager }
            - { call: "GET /research/licenses/${l1}", payload: {}, as: LicensingManager }
            - { call: "GET /research/licenses/${l2}", payload: {}, as: LicensingManager }
          assert:
            - "License ${l1}.fee_quote_cents == 750000 (600000 base + max(0, 4-3) x 150000)"
            - "License ${l1}.fee_final_cents == 750000 (term 12 < 24 -> no discount; no violations; above floor)"
            - "License ${l2}.fee_quote_cents == 600000 (markets_count 3 == INCLUDED_MARKETS[NATIONAL] -> surcharge max(0, 3-3) == 0; the nested max boundary)"

  - rule_id: non_linear_state_machine
    instances:
      - name: study_fielding_reopen_cycle
        grounds:
          - state_machines.Study.FIELDING_to_FIELDING_CLOSED
          - state_machines.Study.FIELDING_CLOSED_to_FIELDING
          - state_machines.SampleFrame.CLOSED_to_OPEN
        distinguishing_aspect: |
          Study machine is cyclic (FIELDING -> FIELDING_CLOSED -> FIELDING -> FIELDING_CLOSED)
          and the reopen cascade is conditional: only shortfall brands' frames reopen — BrandB's
          frame stays CLOSED across the whole cycle. The paired non-linear machine is the
          License ACTIVE<->SUSPENDED cycle (different entity).
        test_recipe:
          setup:
            - "Study (min_sample 3) FIELDING; BrandA PANEL frame with only 2 ACCEPTED responses (short); BrandB CUSTOMER_LIST frame with 4 ACCEPTED responses (meets min)"
          setup_api_calls:
            - { call: "POST /research/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: StudyAdmin }
            - call: "POST /research/studies"
              payload: { code: "VDS-2026", name: "2026 Vehicle Dependability", industry_code: "AUTO", cycle_year: 2026, min_sample_per_brand: 3, significance_alpha: 0.05, embargo_lift_at: "2026-10-15T00:00:00Z" }
              as: StudyAdmin
              captures: { sid: $.data.id, sv: $.data.version }
            - call: "POST /research/methodology-versions"
              payload: { study_id: "${sid}", change_class: "FULL_COMPARABLE", min_duration_seconds: 180, straightline_min_items: 12, pooled_sd_1000: 60, z_value: 1.96, tie_epsilon: 3, factors: [ { code: "QUAL", name: "Quality & Reliability", weight_bp: 6000, ordinal: 1 }, { code: "FEAT", name: "Features & Controls", weight_bp: 4000, ordinal: 2 } ] }
              as: MethodologyLead
              as_user_id: u_ml_001
              captures: { mv: $.data.id }
            - { call: "POST /research/methodology-versions/${mv}/pin", payload: { expected_study_version: "${sv}" }, as: MethodologyLead, as_user_id: u_ml_001 }
            - call: "POST /research/brands"
              payload: { name: "BrandA", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { ba: $.data.id }
            - call: "POST /research/brands"
              payload: { name: "BrandB", industry_code: "AUTO" }
              as: StudyAdmin
              captures: { bb: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${ba}", source_type: "PANEL", target_completes: 4 }
              as: FieldOps
              captures: { fa: $.data.id }
            - call: "POST /research/sample-frames"
              payload: { study_id: "${sid}", brand_id: "${bb}", source_type: "CUSTOMER_LIST", target_completes: 4 }
              as: FieldOps
              captures: { fb: $.data.id }
            - { call: "POST /research/studies/${sid}/state", payload: { to_status: "FIELDING" }, as: StudyAdmin }
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "ra-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 8 }, { factor_code: "FEAT", score: 8 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fa}", respondent_token: "ra-2", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 8 }, { factor_code: "FEAT", score: 8 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fb}", respondent_token: "rb-1", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 7 }, { factor_code: "FEAT", score: 7 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fb}", respondent_token: "rb-2", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 7 }, { factor_code: "FEAT", score: 7 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fb}", respondent_token: "rb-3", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 7 }, { factor_code: "FEAT", score: 7 } ] }
              as: FieldOps
            - call: "POST /research/responses"
              payload: { frame_id: "${fb}", respondent_token: "rb-4", duration_seconds: 300, item_count: 15, distinct_values: 4, factor_scores: [ { factor_code: "QUAL", score: 7 }, { factor_code: "FEAT", score: 7 } ] }
              as: FieldOps
          trigger:
