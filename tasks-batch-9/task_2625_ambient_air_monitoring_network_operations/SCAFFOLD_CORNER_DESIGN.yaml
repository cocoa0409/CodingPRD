            - "the second event has outcome == FAIL because 7.51 > 7.5"
            - "after the second event: Monitor.${mon_id}.monitor_status == OUT_OF_SERVICE, out_of_service_since == 2026-01-04T00:00:00Z, consecutive_qc_failure_count == 1"
            - "after the second event: last_span_check_at is still 2026-01-03T00:00:00Z because a FAIL does not advance the timestamp"
