      - name: second_validated_audited_filing_supersedes_only_its_own_triple
        claim_type: Side Effect Execution
        grounds:
          - state_machines.FilingRecord.VALIDATED_to_SUPERSEDED
          - endpoints.POST_/filing-records/{filing_record_id}/validate
          - calculations.winning_filing_selector
          - entities.FilingRecord.fields.superseded_at
        distinguishing_aspect: |
          The supersede sweep is keyed on the full triple (organization,
          fiscal_year, source_kind), not on the pair (organization,
          fiscal_year). A restated audited statement therefore retires only the
          earlier audited statement and must leave the same year's Form 990
          VALIDATED - that surviving Form 990 is exactly what keeps the
          source-precedence branch of the winning-filing selector reachable. It
          is also why no created_at tie-break is ever needed: at most one row
          per triple can be VALIDATED at a time.
        test_recipe:
          setup:
            - "Harbor Relief has a VALIDATED FY2025 audited statement and a VALIDATED FY2025 Form 990, at clock 2026-08-01"
