            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-02T08:00:00Z", planned_end_at: "2026-08-02T09:00:00Z" }, as: ProcessEngineer, captures: { su2: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su2}/close", payload: { closed_at: "2026-08-02T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 31.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "CONTINUITY", opens_count: 0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/electrical-test-records", payload: { harness_unit_id: "${u1}", test_type: "HIPOT", hipot_voltage_v: 1000.0, dwell_seconds: 2.0, measured_leakage_ua: 5.0, leakage_limit_ua: 10.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "GET /plant/build-orders/${bo}", payload: {}, as: ProductionPlanner }
          assert:
            - "MachineProgram.${pr}.status == QUALIFIED   # requalified"
            - "BuildOrder.${bo}.status == IN_BUILD and held_by_program_id is null   # resumed from QC_HOLD"
            - "HarnessUnit.${u1}.status == TEST_PASS   # SUSPECT cleared by passing retest"
            - "HarnessUnit.${u2}.status == SUSPECT   # not retested yet; stays SUSPECT"

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: c_immediate_consistency_read_after_write
        claim_type: immediate_consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.build_order_quantity_reconciliation
        distinguishing_aspect: "Immediate model: the harness-create response plus an immediate GET of the parent order show qty_built == 1 and status TESTING with no delay or reconciliation pass."
        test_recipe:
          setup: ["Qualified flow; order qty 1; kit delivered (IN_BUILD)"]
          setup_api_calls:
            - { call: "POST /plant/drawings", payload: { drawing_number: "DWG-M1", customer_code: "ACME", revision: "A", workmanship_class: "IPC_CLASS_2" }, as: HarnessEngineer, captures: { dr: $.data.id } }
            - { call: "POST /plant/components", payload: { drawing_id: "${dr}", find_number: "T1", component_type: "TERMINAL", mpn: "TERM-20", qty_per_harness: 1, supply_type: "FACTORY_STOCK", unit_cost_cents: 100 }, as: HarnessEngineer, captures: { t1: $.data.id } }
            - { call: "POST /plant/drawings/${dr}/release", payload: {}, as: HarnessEngineer }
            - { call: "POST /plant/applicators", payload: { applicator_code: "AP-M1", compatible_terminal_mpn: "TERM-20" }, as: ProcessEngineer, captures: { ap: $.data.id } }
            - { call: "POST /plant/machine-programs", payload: { program_code: "PG-M1", drawing_id: "${dr}", applicator_id: "${ap}", wire_gauge_awg: 20, wire_type: "TXL", cut_length_mm: 500.0, strip_length_mm: 5.0, terminal_mpn: "TERM-20", terminal_type: "OPEN_BARREL" }, as: ProcessEngineer, captures: { pr: $.data.id } }
            - { call: "POST /plant/operators", payload: { operator_name: "QI M1", badge_no: "B-QI-M1" }, as: QualityManager, captures: { qi: $.data.id } }
            - { call: "POST /plant/operator-certifications", payload: { operator_id: "${qi}", workmanship_class: "IPC_CLASS_2", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }, as: QualityManager }
            - { call: "POST /plant/applicator-setups", payload: { applicator_id: "${ap}", program_id: "${pr}", setup_operator_id: "${qi}", planned_start_at: "2026-08-01T08:00:00Z", planned_end_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer, captures: { su: $.data.id } }
            - { call: "POST /plant/applicator-setups/${su}/close", payload: { closed_at: "2026-08-01T09:00:00Z" }, as: ProcessEngineer }
            - { call: "POST /plant/crimp-pull-tests", payload: { applicator_id: "${ap}", program_id: "${pr}", sample_kind: "FIRST_ARTICLE", measured_force_n: 35.0 }, as: QualityInspector, as_user_id: "${qi}" }
            - { call: "POST /plant/build-orders", payload: { order_code: "BO-M1", drawing_id: "${dr}", qty_ordered: 1 }, as: ProductionPlanner, captures: { bo: $.data.id } }
            - { call: "POST /plant/build-orders/${bo}/release-to-kitting", payload: {}, as: ProductionPlanner }
            - { call: "GET /plant/kits", payload: { build_order_id: "${bo}" }, as: MaterialsClerk, captures: { kit: "$.data[0].id" } }
            - { call: "POST /plant/kits/${kit}/issues", payload: { component_id: "${t1}", qty_issued: 1, source: "FACTORY_STOCK" }, as: MaterialsClerk }
            - { call: "POST /plant/kits/${kit}/deliver", payload: {}, as: MaterialsClerk }
            - { call: "POST /plant/operators", payload: { operator_name: "LO M1", badge_no: "B-LO-M1" }, as: QualityManager, captures: { lo: $.data.id } }
          trigger:
            - { call: "POST /plant/build-orders/${bo}/harness-units", payload: {}, as: LineOperator, as_user_id: "${lo}", captures: { u1: $.data.id } }
            - { call: "GET /plant/build-orders/${bo}", payload: {}, as: ProductionPlanner }
          assert:
            - "HarnessUnit.${u1}.status == BUILT in the create response"
            - "BuildOrder.${bo}.qty_built == 1 and status == TESTING on the immediately-following read"

  # ===========================================================================
  # Corners already exercised as failure paths of §1.8 difficulty instances.
  - section: errors
    instances:
      - name: s_err_consigned_lot_not_issuable_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_CONSIGNED_LOT_NOT_ISSUABLE]"]
        excluded_because:
          difficulty_instance: referential_beats_fiscal_on_depleted_lot_issue
          rationale: "Triggered as the winning error of that §1.8 priority-pair instance (issue into a DEPLETED lot)."
      - name: s_err_operator_not_certified_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPERATOR_NOT_CERTIFIED]"]
        excluded_because:
          difficulty_instance: certification_expires_at_exact_instant
          rationale: "Triggered at the exact expiry instant in that §1.8 boundary instance; also exercised in state_beats_safety_on_scrapped_harness_test's setup space."
      - name: s_err_harness_not_testable_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_HARNESS_NOT_TESTABLE]"]
        excluded_because:
          difficulty_instance: electrical_test_gated_by_harness_unit_state
          rationale: "Asserted on a SHIPPED unit there; also the expected error of the §1.8 state-vs-safety priority pair on a SCRAPPED unit."
      - name: s_quarantine_sweep_excluded
        claim_type: side_effect_execution
        grounds:
          - state_machines.Applicator.QUALIFIED_to_QUARANTINED
          - state_machines.HarnessUnit.BUILT | REWORK | TEST_PASS_to_SUSPECT
        excluded_because:
          difficulty_instance: lot_sample_fail_quarantine_sweep
          rationale: "The depth-4 sweep (applicator -> program -> order -> units) is asserted hop-by-hop in that §1.8 cascade instance."
      - name: s_ecn_scrap_cascade_excluded
        claim_type: side_effect_execution
        grounds:
          - state_machines.EngineeringChangeNotice.OPEN_to_APPLIED
          - state_machines.BuildOrder.OPEN | KITTING | IN_BUILD | TESTING | QC_HOLD_to_CANCELLED
        excluded_because:
          difficulty_instance: ecn_apply_scrap_disposition_chain
          rationale: "ECN apply's supersede/disposition/scrap/consigned-transfer cascade is asserted hop-by-hop in that §1.8 cascade instance."
