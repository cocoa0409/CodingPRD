            - "GET /terminals?program_id=${prog_id}&state=ENFORCING returns total_count == 1"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: disclosure_artifact_half_open_windows_accept_exact_adjacency
        grounds:
          - state_machines.DisclosureArtifact.DRAFT_to_ATTESTED
          - validations[priority=93]
          - errors[ERR_DISCLOSURE_WINDOW_OVERLAP]
          - entities.DisclosureArtifact.fields.effective_from
          - entities.DisclosureArtifact.fields.expires_at
          - endpoints[POST /disclosure-artifacts/{id}/attest]
        distinguishing_aspect: |
          This is the HALF-OPEN [effective_from, expires_at) resource whose exclusivity is scoped to
          (program_id, artifact_type) and whose adjacency is LEGAL: attesting [2026-09-01, 2026-10-01) right after
          [2026-08-01, 2026-09-01) succeeds because the first window excludes its endpoint, while a window that
          starts one day before the incumbent's end is rejected with ERR_DISCLOSURE_WINDOW_OVERLAP.
        test_recipe:
          setup:
            - "Jurisdiction NY (signage and receipt mandates true), one merchant with docA, one DRAFT SURCHARGE program (no registration filed, so the program never leaves DRAFT and no activation interferes)."
            - "Four DisclosureArtifact rows on that program: three of artifact_type ENTRY_SIGNAGE and one of artifact_type POS_SIGNAGE, all in state DRAFT; clock 2026-08-01T00:00:00Z."
