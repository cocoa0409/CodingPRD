        grounds:
          - state_machines.Payout.PENDING_to_DISBURSED
          - calculations.policy_available_coverage
          - calculations.property_total_paid_claims
        distinguishing_aspect: |
          Disbursing a Payout (hop 1: Payout.status -> DISBURSED) itself triggers a Policy
          net_available_coverage_cents recompute (hop 2, caused by hop 1, not by the original
          DISBURSE call directly), which itself triggers a Property total_paid_claims_cents
          recompute (hop 3, caused by hop 2) — depth 3, chained strictly through Policy then
          Property, not a parallel fan-out from the DISBURSE call.
