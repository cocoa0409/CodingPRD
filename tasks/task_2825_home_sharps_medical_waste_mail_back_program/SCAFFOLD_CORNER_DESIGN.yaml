              payload: { expected_enrollment_version: "${enr_d_v}" }
              as: ProgramAdmin
              captures: { kit_d: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Fern Iqbal", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "fern@example.com" }
              as: ProgramAdmin
              captures: { pat_f: $.data.id }
            - call: "POST /sharps/patients/${pat_f}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_f}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr_f: $.data.id }
            - call: "POST /sharps/enrollments/${enr_f}/submit"
              payload: {}
