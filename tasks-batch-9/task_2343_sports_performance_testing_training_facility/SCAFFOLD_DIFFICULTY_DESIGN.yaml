  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: credential_review_lapse_cascades_five_hops_to_cleared_station_numbers
        grounds:
          - state_machines.Certification.status.VALID_to_LAPSED
          - state_machines.GroupSession.staffing_status.STAFFED_to_UNDERSTAFFED
          - state_machines.GroupSession.session_status.ROSTER_LOCKED_to_SCHEDULED
          - calculations.coach_ratio_requirement
          - calculations.station_rotation_assignment
          - entities.StaffMember.fields.credential_status
          - entities.Enrollment.fields.station_number
        distinguishing_aspect: |
          Depth-5 cascade triggered by POST /staff-members/{id}/credential-review:
          Certification VALID -> LAPSED causes StaffMember.credential_status -> LAPSED,
          which causes removal from GroupSession.assigned_staff, which causes
          staffing_status STAFFED -> UNDERSTAFFED, which causes session_status
          ROSTER_LOCKED -> SCHEDULED, which causes every RESERVED Enrollment.station_number
          to be cleared to null. Each hop is caused by the previous hop, not by the original
          call.
        test_recipe:
          setup:
            - "One StaffMember with liability insurance valid to 2027-12-31 and a single CSCS Certification expiring 2026-08-15."
            - "One CLEARED athlete born 2010-01-15."
            - "GroupSession on 2026-09-20T10:00Z-11:00Z, ONSITE, station_count 3, max_athletes 10, GENERAL_PREP, with that staff member assigned (STAFFED) and the athlete RESERVED."
            - "The roster has been locked, so the enrollment holds station_number 1."
            - "The logical clock has then been advanced to 2026-09-01T00:00:00Z, which is past the certification expiry but does NOT lapse it, because the clock sweep never touches Certification rows."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Omar Faruk", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
              captures: { coach_id: $.data.id }
