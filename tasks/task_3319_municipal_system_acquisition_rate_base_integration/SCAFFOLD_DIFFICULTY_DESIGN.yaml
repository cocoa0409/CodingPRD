              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "DISTRIBUTION", horizon: "IMMEDIATE", description: "d", cost_low_cents: 10000, cost_high_cents: 25000, crews_required: 2 }
              as: AcquisitionAnalyst
              captures: { i_id: $.data.id }
          trigger:
            - call: "POST /acquisitions/capital-items/${i_id}/split"
              payload: { split_low_cents: 4000, split_high_cents: 9000 }
              as: AcquisitionAnalyst
            - call: "GET /acquisitions/assessments/${a_id}/capital-items"
              payload: {}
              as: AcquisitionAnalyst
              captures: { child_a_low: "$.data[1].cost_low_cents", child_a_high: "$.data[1].cost_high_cents", child_b_low: "$.data[2].cost_low_cents", child_b_high: "$.data[2].cost_high_cents" }
          assert:
            - "CapitalNeedItem.${i_id}.status == SPLIT"
            - "child A: cost_low_cents == 4000 and cost_high_cents == 9000"
            - "child B: cost_low_cents == 6000 and cost_high_cents == 16000"
            - "child A low + child B low == 10000 == parent cost_low_cents"
            - "child A high + child B high == 25000 == parent cost_high_cents"
