# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Two instances per Difficulty Rule (§0.5), each grounded in SCAFFOLD.yaml §1.1–§1.7
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1: Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_vs_final_on_engagement
        grounds:
          - calculations.engagement_total_fee
          - entities.AuditEngagement.fields.total_fee_cents
          - entities.FeeChangeRequest.fields.status
        distinguishing_aspect: |
          Entity domain = AuditEngagement fee. The final variant counts only
          APPROVED fee changes; the provisional variant would additionally
          include PROPOSED. Same inputs, different totals depending on variant.
        test_recipe:
          setup:
            - "Engagement E1 exists with base_fee_cents=1000000, materiality_cents=500000, filing_deadline=2026-12-31"
            - "One FeeChangeRequest F1 with delta_cents=+200000 in PROPOSED status"
            - "One FeeChangeRequest F2 with delta_cents=+50000 already APPROVED"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "Acme Corp", fiscal_year_end: "2026-06-30", base_fee_cents: 1000000, materiality_cents: 500000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/fee-change-requests"
              payload: { engagement_id: "${eng_id}", scope_description: "Extra subsidiary scope", delta_cents: 200000 }
              as: ExternalAuditor
              captures: { fee_proposed_id: $.data.id }
            - call: "POST /api/fee-change-requests"
              payload: { engagement_id: "${eng_id}", scope_description: "Interim review add-on", delta_cents: 50000 }
              as: ExternalAuditor
              captures: { fee_to_approve_id: $.data.id }
            - call: "POST /api/fee-change-requests/${fee_to_approve_id}/resolve"
              payload: { decision: "APPROVE" }
              as: Controller
          trigger:
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { total_fee_final: $.data.total_fee_cents }
          assert:
            - "AuditEngagement.${eng_id}.total_fee_cents == 1050000 (final variant: base 1000000 + APPROVED 50000; PROPOSED 200000 excluded)"
            - "FeeChangeRequest.${fee_proposed_id}.status == PROPOSED"
            - "FeeChangeRequest.${fee_to_approve_id}.status == APPROVED"

      - name: passed_adjustment_materiality_per_engagement_vs_per_location
        grounds:
          - calculations.passed_adjustment_materiality_check
          - entities.AuditEngagement.fields.passed_adjustment_total_cents
          - entities.Location.fields.materiality_cents
        distinguishing_aspect: |
          Entity domain = AuditAdjustment materiality. Engagement-level variant
          uses strict less-than against engagement.materiality_cents at
          issue-report; per-location variant uses less-than-or-equal against
          Location.materiality_cents at sampling dispatch. Different entity,
          different operator, different threshold source.
        test_recipe:
          setup:
            - "Engagement E2 with materiality_cents=100000, filing_deadline=2026-12-31"
            - "Location L1 under E2 with materiality_cents=50000"
            - "Engagement E2 moved to FIELDWORK so adjustments can be proposed"
            - "Two AuditAdjustments A1 (60000 cents) and A2 (40000 cents) both PASSED; total=100000 == engagement.materiality_cents"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "BetaCo", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
              captures: { loc1_id: $.data.id }
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/adjustments"
              payload: { engagement_id: "${eng_id}", description: "Revenue cutoff", amount_cents: 60000, direction: "DEBIT" }
              as: ExternalAuditor
              captures: { adj1_id: $.data.id }
            - call: "POST /api/adjustments"
              payload: { engagement_id: "${eng_id}", description: "Accrual miss", amount_cents: 40000, direction: "DEBIT" }
              as: ExternalAuditor
              captures: { adj2_id: $.data.id }
            - call: "POST /api/adjustments/${adj1_id}/disposition"
              payload: { disposition: "PASS", rationale: "Client refuses" }
              as: Controller
            - call: "POST /api/adjustments/${adj2_id}/disposition"
              payload: { disposition: "PASS", rationale: "Client refuses" }
              as: Controller
          trigger:
            - call: "POST /api/audit-engagements/${eng_id}/complete-fieldwork"
              payload: {}
              as: ExternalAuditor
            - call: "POST /api/representation-letters"
              payload: { engagement_id: "${eng_id}" }
              as: Preparer
              captures: { rep_id: $.data.id }
            - call: "POST /api/representation-letters/${rep_id}/submit"
              payload: {}
              as: Preparer
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v_at_sign: $.data.version }
            - call: "POST /api/representation-letters/${rep_id}/sign"
              payload: { expected_engagement_version: "${eng_v_at_sign}" }
              as: Controller
              as_user_id: "ctrl_other"
            - call: "POST /api/audit-engagements/${eng_id}/issue-report"
              payload: {}
              as: ExternalAuditor
              captures: { issue_err: $.data.error_id }
          assert:
            - "AuditEngagement.${eng_id}.passed_adjustment_total_cents == 100000"
            - "POST issue-report response == error with error_id == ERR_PASSED_ADJUSTMENTS_EXCEED_MATERIALITY (100000 < 100000 is false; strict less-than)"

  # ---------------------------------------------------------------------------
  # Rule 2: Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: pbc_aging_score_circular_eval_order
        grounds:
          - calculations.pbc_aging_score
          - entities.PBCRequest.fields.rejection_count
          - entities.AuditEngagement.fields.open_query_count
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency. pbc_aging_score consumes
          engagement.open_query_count; the formula pins that open_query_count
          is read at Step 3 from the CURRENT engagement row, not recomputed
          inside the formula, so the evaluation order is well-defined.
        test_recipe:
          setup:
            - "Engagement E3 in FIELDWORK with materiality=100000, filing_deadline=2026-12-31"
            - "PBCRequest P1 created 2026-08-01 (owned by preparer user prep1), no evidence yet"
            - "One AuditorQuery Q1 raised and still OPEN (open_query_count == 1)"
            - "Logical clock advanced to 2026-08-11T00:00:00Z (10 days after PBC creation)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Controller
            - call: "POST /api/audit-engagements"
              payload: { client_name: "GammaInc", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/pbc-requests"
              payload: { engagement_id: "${eng_id}", title: "Trial balance", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
            - call: "POST /api/queries"
              payload: { engagement_id: "${eng_id}", subject: "Revenue recognition", severity: "HIGH" }
              as: ExternalAuditor
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-11T00:00:00Z" }
              as: Controller
          trigger:
            - call: "GET /api/pbc-requests"
              as: Controller
          assert:
            - "PBCRequest.${pbc_id} has pbc_aging_score computed via pinned evaluation order (recency_days=10, freshness=1/11≈0.0909, backlog_mult=1+0.1*1=1.1)"

      - name: query_turnaround_ceiling_boundary
        grounds:
          - calculations.query_turnaround_hours
          - entities.AuditorQuery.fields.turnaround_hours
        distinguishing_aspect: |
          Mode (a) — non-linear interaction with ceiling function and a
          boundary-precision sub-claim: an exactly-on-the-hour gap returns the
          hour count (not hour+1); one second over bumps it by one.
        test_recipe:
          setup:
            - "Engagement E4 in FIELDWORK"
            - "AuditorQuery Q1 raised at 2026-08-01T00:00:00Z (logical clock)"
            - "Q1 routed to client"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Controller
            - call: "POST /api/audit-engagements"
              payload: { client_name: "DeltaCo", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/queries"
              payload: { engagement_id: "${eng_id}", subject: "Cutoff", severity: "MEDIUM" }
              as: ExternalAuditor
              captures: { q_id: $.data.id }
            - call: "POST /api/queries/${q_id}/route-to-client"
              payload: {}
              as: ExternalAuditor
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T02:00:00Z" }
              as: Controller
          trigger:
            - call: "POST /api/queries/${q_id}/respond"
              payload: { response_text: "See attached" }
              as: Preparer
              captures: { turnaround: $.data.turnaround_hours }
          assert:
            - "AuditorQuery.${q_id}.turnaround_hours == 2 (exactly 7200 seconds elapsed; ceil(7200/3600)=2, not 3)"

  # ---------------------------------------------------------------------------
  # Rule 3: Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: pbc_request_reject_loop_cycle
        grounds:
          - state_machines.PBCRequest.REJECTED_to_IN_PROGRESS
          - state_machines.PBCRequest.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          PBCRequest exhibits a cycle OPEN→IN_PROGRESS→SUBMITTED→REJECTED→IN_PROGRESS
          — the REJECTED state loops back to IN_PROGRESS on next evidence upload,
          with rejection_count tracking iterations.
        test_recipe:
          setup:
            - "Engagement E5 in FIELDWORK with materiality=100000, filing_deadline=2026-12-31"
            - "PBCRequest P1 owned by prep1"
            - "One evidence upload on P1 (PBCRequest now IN_PROGRESS)"
            - "P1 submitted (SUBMITTED)"
            - "Auditor rejects P1 (REJECTED, rejection_count=1)"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "EpsilonLtd", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/pbc-requests"
              payload: { engagement_id: "${eng_id}", title: "GL detail", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v1: $.data.version }
            - call: "POST /api/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "gl.csv", file_size_bytes: 1024, sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", expected_engagement_version: "${eng_v1}" }
              as: Preparer
              as_user_id: "prep1"
            - call: "POST /api/pbc-requests/${pbc_id}/submit"
              payload: {}
              as: Preparer
              as_user_id: "prep1"
            - call: "POST /api/pbc-requests/${pbc_id}/review"
              payload: { decision: "REJECT", rationale: "Insufficient detail" }
              as: ExternalAuditor
          trigger:
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v2: $.data.version }
            - call: "POST /api/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "gl_v2.csv", file_size_bytes: 2048, sha256: "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb", expected_engagement_version: "${eng_v2}" }
              as: Preparer
              as_user_id: "prep1"
              captures: { upload2_seq: $.data.version_seq }
          assert:
            - "PBCRequest.${pbc_id}.status == IN_PROGRESS (cycle REJECTED → IN_PROGRESS)"
            - "PBCRequest.${pbc_id}.rejection_count == 1"
            - "EvidenceUpload version_seq == 2 for second upload"

      - name: audit_adjustment_branching_fork
        grounds:
          - state_machines.AuditAdjustment.PROPOSED_to_ACCEPTED
          - state_machines.AuditAdjustment.PROPOSED_to_PASSED
        distinguishing_aspect: |
          AuditAdjustment branches PROPOSED → {ACCEPTED, REJECTED, PASSED} with
          divergent side-effect sets: PASSED increments
          engagement.passed_adjustment_total_cents; ACCEPTED and REJECTED do not.
        test_recipe:
          setup:
            - "Engagement E6 in FIELDWORK with materiality=100000, filing_deadline=2026-12-31"
            - "Three AuditAdjustments: AdjA (10000), AdjB (20000), AdjC (30000), all PROPOSED"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "ZetaCorp", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/adjustments"
              payload: { engagement_id: "${eng_id}", description: "AdjA", amount_cents: 10000, direction: "DEBIT" }
              as: ExternalAuditor
              captures: { adj_a_id: $.data.id }
            - call: "POST /api/adjustments"
              payload: { engagement_id: "${eng_id}", description: "AdjB", amount_cents: 20000, direction: "DEBIT" }
              as: ExternalAuditor
              captures: { adj_b_id: $.data.id }
            - call: "POST /api/adjustments"
              payload: { engagement_id: "${eng_id}", description: "AdjC", amount_cents: 30000, direction: "CREDIT" }
              as: ExternalAuditor
              captures: { adj_c_id: $.data.id }
          trigger:
            - call: "POST /api/adjustments/${adj_a_id}/disposition"
              payload: { disposition: "ACCEPT" }
              as: Controller
            - call: "POST /api/adjustments/${adj_b_id}/disposition"
              payload: { disposition: "PASS", rationale: "Client refuses — booked next year" }
              as: Controller
            - call: "POST /api/adjustments/${adj_c_id}/disposition"
              payload: { disposition: "REJECT", rationale: "Auditor agreed to withdraw" }
              as: Controller
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { final_passed: $.data.passed_adjustment_total_cents }
          assert:
            - "AuditAdjustment.${adj_a_id}.disposition == ACCEPTED"
            - "AuditAdjustment.${adj_b_id}.disposition == PASSED"
            - "AuditAdjustment.${adj_c_id}.disposition == REJECTED"
            - "AuditEngagement.${eng_id}.passed_adjustment_total_cents == 20000 (only PASSED increments)"

  # ---------------------------------------------------------------------------
  # Rule 4: Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: engagement_cancel_cascades_to_pbc_evidence_fee
        grounds:
          - state_machines.AuditEngagement.FIELDWORK_to_CANCELLED
          - state_machines.PBCRequest.IN_PROGRESS_to_FROZEN
          - state_machines.EvidenceUpload.PENDING_REVIEW_to_INVALIDATED
          - state_machines.FeeChangeRequest.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: |
          Depth-3 cascade from engagement-cancel trigger: AuditEngagement →
          CANCELLED cascades to PBCRequest (FROZEN), which itself cascades to
          its PENDING_REVIEW EvidenceUpload (INVALIDATED). Each link caused by
          the previous link, not by the original cancel call.
        test_recipe:
          setup:
            - "Engagement E7 in FIELDWORK with materiality=100000, filing_deadline=2026-12-31"
            - "PBCRequest P1 IN_PROGRESS with one PENDING_REVIEW EvidenceUpload U1"
            - "One FeeChangeRequest F1 still PROPOSED"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "EtaCo", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/pbc-requests"
              payload: { engagement_id: "${eng_id}", title: "In-progress PBC", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v_for_upload: $.data.version }
            - call: "POST /api/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "doc.pdf", file_size_bytes: 1024, sha256: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc", expected_engagement_version: "${eng_v_for_upload}" }
              as: Preparer
              as_user_id: "prep1"
              captures: { upload_id: $.data.id }
            - call: "POST /api/fee-change-requests"
              payload: { engagement_id: "${eng_id}", scope_description: "Extra scope", delta_cents: 100000 }
              as: ExternalAuditor
              captures: { fee_id: $.data.id }
          trigger:
            - call: "POST /api/audit-engagements/${eng_id}/cancel"
              payload: {}
              as: Controller
          assert:
            - "AuditEngagement.${eng_id}.status == CANCELLED"
            - "PBCRequest.${pbc_id}.status == FROZEN (cascade link 1: engagement cancel → PBC freeze)"
            - "EvidenceUpload.${upload_id}.status == INVALIDATED (cascade link 2: PBC freeze → evidence invalidate)"
            - "FeeChangeRequest.${fee_id}.status == WITHDRAWN (parallel cascade to fee-change)"

      - name: query_close_decrements_engagement_open_count
        grounds:
          - state_machines.AuditorQuery.RESPONDED_to_CLOSED
          - entities.AuditEngagement.fields.open_query_count
        distinguishing_aspect: |
          Depth-2 cascade from queries/{id}/close trigger: AuditorQuery → CLOSED
          triggers AuditEngagement.open_query_count decrement. Different
          triggering transition from the engagement-cancel cascade.
        test_recipe:
          setup:
            - "Engagement E8 in FIELDWORK, filing_deadline=2026-12-31"
            - "Two AuditorQuery rows Q1 and Q2 raised; engagement.open_query_count == 2"
            - "Q1 routed to client and responded"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "ThetaLLC", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/queries"
              payload: { engagement_id: "${eng_id}", subject: "Q1", severity: "LOW" }
              as: ExternalAuditor
              captures: { q1_id: $.data.id }
            - call: "POST /api/queries"
              payload: { engagement_id: "${eng_id}", subject: "Q2", severity: "MEDIUM" }
              as: ExternalAuditor
              captures: { q2_id: $.data.id }
            - call: "POST /api/queries/${q1_id}/route-to-client"
              payload: {}
              as: ExternalAuditor
            - call: "POST /api/queries/${q1_id}/respond"
              payload: { response_text: "answered" }
              as: Preparer
          trigger:
            - call: "POST /api/queries/${q1_id}/close"
              payload: {}
              as: ExternalAuditor
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { open_q_after: $.data.open_query_count }
          assert:
            - "AuditorQuery.${q1_id}.status == CLOSED"
            - "AuditorQuery.${q2_id}.status == OPEN"
            - "AuditEngagement.${eng_id}.open_query_count == 1 (decremented by exactly 1)"

  # ---------------------------------------------------------------------------
  # Rule 5: Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_issue_report
        grounds:
          - validations[priority=5]
          - validations[priority=12]
        distinguishing_aspect: |
          Category pair = state vs business_fiscal. When issue-report is called
          on an engagement in FIELDWORK (not FIELDWORK_COMPLETE) AND passed
          adjustments would also exceed materiality, the state error
          ERR_ENGAGEMENT_NOT_CLOSING (priority 5) wins over the fiscal error
          ERR_PASSED_ADJUSTMENTS_EXCEED_MATERIALITY (priority 12).
        test_recipe:
          setup:
            - "Engagement E9 in FIELDWORK (NOT FIELDWORK_COMPLETE), materiality=100000, filing_deadline=2026-12-31"
            - "One PASSED adjustment of 100000 so passed_adjustment_total_cents >= materiality"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "IotaInc", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/adjustments"
              payload: { engagement_id: "${eng_id}", description: "Big miss", amount_cents: 100000, direction: "DEBIT" }
              as: ExternalAuditor
              captures: { adj_id: $.data.id }
            - call: "POST /api/adjustments/${adj_id}/disposition"
              payload: { disposition: "PASS", rationale: "Client refuses" }
              as: Controller
          trigger:
            - call: "POST /api/audit-engagements/${eng_id}/issue-report"
              payload: {}
              as: ExternalAuditor
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ENGAGEMENT_NOT_CLOSING (state beats business_fiscal)"
            - "AuditEngagement.${eng_id}.status == FIELDWORK (unchanged)"

      - name: business_safety_vs_business_referential_on_rep_sign
        grounds:
          - validations[priority=6]
          - validations[priority=8]
        distinguishing_aspect: |
          Category pair = business_safety vs business_referential. A rep-letter
          sign attempt by the same user as prepared_by_user_id (SoD violation,
          business_safety, priority 6) is checked before any owner-based
          referential rule (priority 8). Even if other ownership rules would
          also fail, the SoD error wins.
        test_recipe:
          setup:
            - "Engagement E10 in FIELDWORK_COMPLETE with materiality=100000, filing_deadline=2026-12-31"
            - "RepresentationLetter in PENDING_SIGNATURE, prepared_by_user_id == 'user_x'"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "KappaCo", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/complete-fieldwork"
              payload: {}
              as: ExternalAuditor
            - call: "POST /api/representation-letters"
              payload: { engagement_id: "${eng_id}" }
              as: Preparer
              as_user_id: "user_x"
              captures: { rep_id: $.data.id }
            - call: "POST /api/representation-letters/${rep_id}/submit"
              payload: {}
              as: Preparer
              as_user_id: "user_x"
          trigger:
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v_sign: $.data.version }
            - call: "POST /api/representation-letters/${rep_id}/sign"
              payload: { expected_engagement_version: "${eng_v_sign}" }
              as: Controller
              as_user_id: "user_x"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_REP_LETTER_SOD_VIOLATION (business_safety beats business_referential)"
            - "RepresentationLetter.status == PENDING_SIGNATURE (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 6: Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: materiality_threshold_strict_less_than
        grounds:
          - calculations.passed_adjustment_materiality_check
          - validations[priority=12]
        distinguishing_aspect: |
          Metric = passed_adjustment_total_cents; endpoint = issue-report. The
          operator is strictly less-than; total == materiality is rejected, so
          total == materiality - 1 is the largest succeeding value.
        test_recipe:
          setup:
            - "Engagement E11 in FIELDWORK_COMPLETE with materiality=100000, filing_deadline=2026-12-31"
            - "Passed adjustment total == 99999 cents (one cent below)"
            - "RepresentationLetter SIGNED"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "LambdaLtd", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/adjustments"
              payload: { engagement_id: "${eng_id}", description: "Cutoff", amount_cents: 99999, direction: "DEBIT" }
              as: ExternalAuditor
              captures: { adj_id: $.data.id }
            - call: "POST /api/adjustments/${adj_id}/disposition"
              payload: { disposition: "PASS", rationale: "Refused" }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/complete-fieldwork"
              payload: {}
              as: ExternalAuditor
            - call: "POST /api/representation-letters"
              payload: { engagement_id: "${eng_id}" }
              as: Preparer
              as_user_id: "prep_a"
              captures: { rep_id: $.data.id }
            - call: "POST /api/representation-letters/${rep_id}/submit"
              payload: {}
              as: Preparer
              as_user_id: "prep_a"
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v_sign: $.data.version }
            - call: "POST /api/representation-letters/${rep_id}/sign"
              payload: { expected_engagement_version: "${eng_v_sign}" }
              as: Controller
              as_user_id: "ctrl_b"
          trigger:
            - call: "POST /api/audit-engagements/${eng_id}/issue-report"
              payload: {}
              as: ExternalAuditor
          assert:
            - "AuditEngagement.${eng_id}.passed_adjustment_total_cents == 99999"
            - "AuditEngagement.${eng_id}.status == REPORT_ISSUED (99999 < 100000 succeeds)"

      - name: sampling_locations_empty_set_rejected
        grounds:
          - validations[priority=9]
          - entities.SamplingRequest.fields.location_ids
        distinguishing_aspect: |
          Metric = size of location_ids collection; endpoint = sampling-requests
          create. The empty set is rejected with ERR_NO_SAMPLING_LOCATIONS.
          Different metric and different endpoint from the materiality boundary.
        test_recipe:
          setup:
            - "Engagement E12 in FIELDWORK, filing_deadline=2026-12-31"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "MuCo", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
          trigger:
            - call: "POST /api/sampling-requests"
              payload: { engagement_id: "${eng_id}", title: "Empty", location_ids: [], window_start: "2026-09-01", window_end: "2026-09-15", sample_size: 5 }
              as: ExternalAuditor
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NO_SAMPLING_LOCATIONS (empty collection rejected)"

  # ---------------------------------------------------------------------------
  # Rule 7: Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: evidence_upload_requires_engagement_in_fieldwork
        grounds:
          - state_machines.PBCRequest.OPEN_to_IN_PROGRESS
          - entities.AuditEngagement.fields.status
        distinguishing_aspect: |
          Entity pair = EvidenceUpload → AuditEngagement. The upload transition
          requires engagement.status == FIELDWORK; an engagement in PLANNING
          rejects the upload.
        test_recipe:
          setup:
            - "Engagement E13 in PLANNING (NOT commenced), filing_deadline=2026-12-31"
            - "PBCRequest P1 in OPEN state, owner prep1"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "NuInc", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/pbc-requests"
              payload: { engagement_id: "${eng_id}", title: "Bank recs", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v: $.data.version }
          trigger:
            - call: "POST /api/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "rec.pdf", file_size_bytes: 1024, sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", expected_engagement_version: "${eng_v}" }
              as: Preparer
              as_user_id: "prep1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ENGAGEMENT_NOT_IN_FIELDWORK (EvidenceUpload depends on AuditEngagement.status)"
            - "PBCRequest.${pbc_id}.status == OPEN (unchanged)"

      - name: adjustment_disposition_blocked_when_posture_locked
        grounds:
          - state_machines.AuditAdjustment.PROPOSED_to_ACCEPTED
          - entities.AuditEngagement.fields.posture
        distinguishing_aspect: |
          Entity pair = AuditAdjustment → AuditEngagement (different pair from
          Evidence→Engagement). Disposition requires engagement.posture !=
          LOCKED. After rep-letter sign + issue-report, disposition is rejected.
        test_recipe:
          setup:
            - "Engagement E14 REPORT_ISSUED, posture LOCKED, materiality=100000, filing_deadline=2026-12-31"
            - "AuditAdjustment AdjA still PROPOSED (created before lock but never dispositioned)"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "XiCo", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/adjustments"
              payload: { engagement_id: "${eng_id}", description: "AdjA", amount_cents: 5000, direction: "DEBIT" }
              as: ExternalAuditor
              captures: { adj_id: $.data.id }
            - call: "POST /api/audit-engagements/${eng_id}/complete-fieldwork"
              payload: {}
              as: ExternalAuditor
            - call: "POST /api/representation-letters"
              payload: { engagement_id: "${eng_id}" }
              as: Preparer
              as_user_id: "prep_a"
              captures: { rep_id: $.data.id }
            - call: "POST /api/representation-letters/${rep_id}/submit"
              payload: {}
              as: Preparer
              as_user_id: "prep_a"
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { eng_v_sign: $.data.version }
            - call: "POST /api/representation-letters/${rep_id}/sign"
              payload: { expected_engagement_version: "${eng_v_sign}" }
              as: Controller
              as_user_id: "ctrl_b"
            - call: "POST /api/audit-engagements/${eng_id}/issue-report"
              payload: {}
              as: ExternalAuditor
          trigger:
            - call: "POST /api/adjustments/${adj_id}/disposition"
              payload: { disposition: "ACCEPT" }
              as: Controller
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_ENGAGEMENT_POSTURE_LOCKED (AuditAdjustment depends on AuditEngagement.posture)"
            - "AuditAdjustment.${adj_id}.disposition == PROPOSED (unchanged)"

  # ---------------------------------------------------------------------------
  # Rule 8: Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: sampling_window_half_open_adjacency_allowed
        grounds:
          - calculations.sampling_window_overlap_check
          - entities.SamplingRequest.fields.window_end
        distinguishing_aspect: |
          Resource = Location; interval semantics = HALF-OPEN [start, end).
          Two SamplingRequests whose windows touch at the boundary
          (new.start == existing.end) do NOT overlap and are both allowed.
        test_recipe:
          setup:
            - "Engagement E15 in FIELDWORK, filing_deadline=2026-12-31"
            - "Location L1"
            - "SamplingRequest S1 on L1 window [2026-09-01, 2026-09-15), DISPATCHED"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "Omicron", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
              captures: { loc_id: $.data.id }
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/sampling-requests"
              payload: { engagement_id: "${eng_id}", title: "S1", location_ids: ["${loc_id}"], window_start: "2026-09-01", window_end: "2026-09-15", sample_size: 5 }
              as: ExternalAuditor
              captures: { s1_id: $.data.id }
            - call: "POST /api/sampling-requests/${s1_id}/dispatch"
              payload: {}
              as: ExternalAuditor
            - call: "POST /api/sampling-requests"
              payload: { engagement_id: "${eng_id}", title: "S2 adjacent", location_ids: ["${loc_id}"], window_start: "2026-09-15", window_end: "2026-09-30", sample_size: 5 }
              as: ExternalAuditor
              captures: { s2_id: $.data.id }
          trigger:
            - call: "POST /api/sampling-requests/${s2_id}/dispatch"
              payload: {}
              as: ExternalAuditor
          assert:
            - "SamplingRequest.${s2_id}.status == DISPATCHED (adjacent half-open windows do not overlap)"

      - name: fieldwork_visit_closed_interval_with_buffer
        grounds:
          - calculations.fieldwork_visit_overlap_check
          - entities.FieldworkVisit.fields.visit_end
        distinguishing_aspect: |
          Resource = ExternalAuditor (auditor_user_id); interval semantics =
          CLOSED [start, end] PLUS a mandatory 1-day buffer between visits by
          the same auditor. Adjacent calendar dates for the same auditor
          ARE rejected (different from sampling half-open).
        test_recipe:
          setup:
            - "Engagement E16 in FIELDWORK, filing_deadline=2026-12-31"
            - "Location L1"
            - "FieldworkVisit V1 for auditor aud1 [2026-09-01, 2026-09-10] SCHEDULED"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "PiLLC", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
              captures: { loc_id: $.data.id }
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/fieldwork-visits"
              payload: { engagement_id: "${eng_id}", auditor_user_id: "aud1", location_id: "${loc_id}", visit_start: "2026-09-01", visit_end: "2026-09-10" }
              as: ExternalAuditor
              captures: { v1_id: $.data.id }
          trigger:
            - call: "POST /api/fieldwork-visits"
              payload: { engagement_id: "${eng_id}", auditor_user_id: "aud1", location_id: "${loc_id}", visit_start: "2026-09-11", visit_end: "2026-09-15" }
              as: ExternalAuditor
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_VISIT_WINDOW_OVERLAP (1-day buffer violated; same auditor must wait >=1 day after 2026-09-10)"

  # ---------------------------------------------------------------------------
  # Rule 9: Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: fee_approve_then_withdraw_proposed_conserves_total
        grounds:
          - calculations.engagement_total_fee
          - state_machines.FeeChangeRequest.PROPOSED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity = engagement.total_fee_cents. Forward action
          (PROPOSED has no effect) paired with compensating WITHDRAWN leaves
          total_fee_cents unchanged; only APPROVED changes it. Propose-then-
          withdraw is the identity pair.
        test_recipe:
          setup:
            - "Engagement E17 in FIELDWORK with base_fee_cents=1000000, materiality=100000, filing_deadline=2026-12-31"
            - "Initial total_fee_cents == 1000000"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "RhoCo", fiscal_year_end: "2026-06-30", base_fee_cents: 1000000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id, initial_total: $.data.total_fee_cents }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/fee-change-requests"
              payload: { engagement_id: "${eng_id}", scope_description: "Extra scope", delta_cents: 150000 }
              as: ExternalAuditor
              captures: { fee_id: $.data.id }
          trigger:
            - call: "POST /api/fee-change-requests/${fee_id}/withdraw"
              payload: {}
              as: ExternalAuditor
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { final_total: $.data.total_fee_cents }
          assert:
            - "FeeChangeRequest.${fee_id}.status == WITHDRAWN"
            - "AuditEngagement.${eng_id}.total_fee_cents == 1000000 (unchanged; propose+withdraw is identity)"

      - name: pbc_accept_decrements_open_count_to_zero
        grounds:
          - state_machines.PBCRequest.SUBMITTED_to_ACCEPTED
          - entities.AuditEngagement.fields.open_pbc_count
        distinguishing_aspect: |
          Conserved quantity = engagement.open_pbc_count. Creation increments
          by 1, accept decrements by 1; the paired forward+compensating actions
          leave the count unchanged. Different quantity from total_fee_cents.
        test_recipe:
          setup:
            - "Engagement E18 in FIELDWORK, filing_deadline=2026-12-31"
            - "Initial open_pbc_count == 0"
          setup_api_calls:
            - call: "POST /api/audit-engagements"
              payload: { client_name: "SigmaCo", fiscal_year_end: "2026-06-30", base_fee_cents: 800000, materiality_cents: 100000, filing_deadline: "2026-12-31" }
              as: Controller
              captures: { eng_id: $.data.id }
            - call: "POST /api/locations"
              payload: { engagement_id: "${eng_id}", location_code: "L1", name: "HQ", materiality_cents: 50000 }
              as: Controller
            - call: "POST /api/audit-engagements/${eng_id}/commence-fieldwork"
              payload: {}
              as: Controller
            - call: "POST /api/pbc-requests"
              payload: { engagement_id: "${eng_id}", title: "GL", owner_user_id: "prep1", due_date: "2026-11-30" }
              as: ExternalAuditor
              captures: { pbc_id: $.data.id }
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { count_after_create: $.data.open_pbc_count, eng_v_for_upload: $.data.version }
            - call: "POST /api/pbc-requests/${pbc_id}/evidence-uploads"
              payload: { file_name: "gl.pdf", file_size_bytes: 1024, sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", expected_engagement_version: "${eng_v_for_upload}" }
              as: Preparer
              as_user_id: "prep1"
            - call: "POST /api/pbc-requests/${pbc_id}/submit"
              payload: {}
              as: Preparer
              as_user_id: "prep1"
          trigger:
            - call: "POST /api/pbc-requests/${pbc_id}/review"
              payload: { decision: "ACCEPT" }
              as: ExternalAuditor
            - call: "GET /api/audit-engagements/${eng_id}"
              as: Controller
              captures: { count_after_accept: $.data.open_pbc_count }
          assert:
            - "open_pbc_count after create == 1"
            - "open_pbc_count after accept == 0 (forward+compensating leaves count at baseline)"
            - "PBCRequest.${pbc_id}.status == ACCEPTED"
