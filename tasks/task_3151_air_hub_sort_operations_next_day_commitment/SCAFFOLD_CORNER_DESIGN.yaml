            - call: "POST /airhub/banks"
              payload: { hub_id: "${ind_hub_id}", bank_code: "BANK_Z", scheduled_start_minutes: 1400, scheduled_end_minutes: 1520, hydraulic_crew_available: true }
              as: HubOpsManager
              captures: { bank_z_id: $.data.id }
            - call: "POST /airhub/aircraft"
              payload: { bank_id: "${bank_z_id}", tail_number: "N801UP", origin_station_code: "MIA", scheduled_arrival_minutes: 1395, capacity_weight_grams: 200000 }
              as: GatewayCoordinator
              captures: { ac_ind_id: $.data.id }
          trigger:
            - call: "POST /airhub/packages"
              payload: { hub_id: "00000000-0000-4000-8000-000000000001", aircraft_id: "00000000-0000-4000-8000-000000000002", tracking_number: "1Z-K-0001", commodity_class: "GENERAL", destination_hub_code: "LAX", service_level: "NEXT_DAY_AIR", planned_weight_grams: 20000, dimension_weight_grams: 20000 }
              as: SortOperator
              captures: { err_both: $.data.error_id }
            - call: "POST /airhub/packages"
