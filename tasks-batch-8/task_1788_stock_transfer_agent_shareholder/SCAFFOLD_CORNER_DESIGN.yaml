            - call: "POST /lost-certificate-claims/${claim}/approve"
              payload: {}
              as: TransferSupervisor
              as_user_id: "sup_2"
          assert:
            - "first approve: error_id == ERR_SEGREGATION_OF_DUTIES with HTTP 403 (approver == filed_by_examiner_id)"
            - "second approve by sup_2 succeeds: LostCertificateClaim.${claim}.status == APPROVED"

      - name: unauthenticated_call_missing_headers_rejected
        claim_type: role_exclusive_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "Calls without X-User-Role / X-User-ID headers fail authentication with ERR_UNAUTHENTICATED 401 before any role check — priority 1 precedes every other validation."
        test_recipe:
          setup: ["one issuer onboarded (so existence cannot mask the auth failure)"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Zeta Auth", cusip: "000000049", ticker: "ZAUT", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
          trigger:
            - call: "GET /issuers/${iss}"
              as: Shareholder
              captures: { err: $.data.error_id }
          assert:
            - "the call is sent with both auth headers omitted: error_id == ERR_UNAUTHENTICATED with HTTP 401"
            - "no issuer data is returned in the error response"

      - name: inquiry_answer_by_other_agent_denied
        claim_type: role_exclusive_denial
        grounds: ["errors[ERR_INQUIRY_CLAIMED_BY_OTHER]", state_machines.ShareholderInquiry.IN_REVIEW_to_ANSWERED]
        distinguishing_aspect: "Only the claiming agent may answer: agent_2 answering an inquiry claimed by agent_1 is denied with ERR_INQUIRY_CLAIMED_BY_OTHER 403."
        test_recipe:
          setup: ["account with an inquiry claimed by agent_1 (IN_REVIEW)"]
          setup_api_calls:
            - call: "POST /accounts"
              payload: { holder_name: "Inquiry Ivan", address_line1: "38 Desk St", city: "Tulsa", state_code: "OK", postal_code: "74133", country_code: "US", tax_id: "542-12-1212" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /inquiries"
              payload: { account_id: "${acct}", channel: "PHONE", subject: "statement copy" }
              as: Shareholder
              as_user_id: "${acct}"
              captures: { inq: $.data.id }
            - call: "POST /inquiries/${inq}/claim"
              payload: {}
              as: ServiceAgent
              as_user_id: "agent_1"
          trigger:
            - call: "POST /inquiries/${inq}/answer"
              payload: { answer_text: "impostor answer" }
              as: ServiceAgent
              as_user_id: "agent_2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INQUIRY_CLAIMED_BY_OTHER with HTTP 403"
            - "ShareholderInquiry.${inq}.status remains IN_REVIEW and claimed_by_agent_id == \"agent_1\""

  - section: cross_cutting_layers
    instances:
      - name: occ_stale_account_version_transfer_create
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[transfer-create-stale-account]", "errors[ERR_STALE_ACCOUNT_VERSION]"]
        distinguishing_aspect: "OCC on ShareholderAccount.version: after transfer t1 creation advances the account version 1 -> 2, a second create replaying expected_account_version == 1 is rejected with 412 ERR_STALE_ACCOUNT_VERSION; the fix is to re-read and resubmit."
        test_recipe:
          setup: ["issuer outstanding 100; accounts A (100 book, version 1) and B"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Eta Occ", cusip: "000000050", ticker: "EOCC", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Occ Otto", address_line1: "39 Version St", city: "Tulsa", state_code: "OK", postal_code: "74134", country_code: "US", tax_id: "552-12-1212", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct_a: $.data.id, a_v: $.data.version }
            - call: "POST /accounts"
              payload: { holder_name: "Occ Olga", address_line1: "40 Version St", city: "Tulsa", state_code: "OK", postal_code: "74135", country_code: "US", tax_id: "562-12-1212", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_a}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100 }
              as: AgentAdmin
            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 10, expected_account_version: "${a_v}" }
              as: TransferExaminer
              captures: { t1: $.data.id }
          trigger:
            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 5, expected_account_version: "${a_v}" }
              as: TransferExaminer
              captures: { err: $.data.error_id }
            - call: "GET /accounts/${acct_a}"
              as: TransferExaminer
              captures: { a_v2: $.data.version }
            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 5, expected_account_version: "${a_v2}" }
              as: TransferExaminer
              captures: { t2: $.data.id }
          assert:
            - "stale create: error_id == ERR_STALE_ACCOUNT_VERSION with HTTP 412 (expected 1, actual 2 after t1 bumped pending_transfer_count)"
            - "no TransferRequest row is created by the rejected call (t2 is created only by the resubmitted call)"
            - "resubmission with the re-read version ${a_v2} == 2 succeeds: TransferRequest.${t2}.status == UNDER_REVIEW"
            - "ShareholderAccount.${acct_a}.version == 3 after the two successful creates"

      - name: occ_stale_position_version_legend_create
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[legend-create-stale-position]", "errors[ERR_STALE_POSITION_VERSION]"]
        distinguishing_aspect: "OCC on Position.version (a different parent entity than the account rule): after a first legend request advances the position version 1 -> 2, replaying the stale version is rejected with 412 ERR_STALE_POSITION_VERSION."
        test_recipe:
          setup: ["issuer outstanding 100; account with position 100 book / 100 restricted at version 1"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Theta Occ", cusip: "000000051", ticker: "TOCC", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Occ Oscar", address_line1: "41 Version St", city: "Tulsa", state_code: "OK", postal_code: "74136", country_code: "US", tax_id: "572-12-1212" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100, restricted_shares: 100 }
              as: AgentAdmin
              captures: { pos: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /legend-removal-requests"
              payload: { position_id: "${pos}", account_id: "${acct}", share_quantity: 10, rule_basis: "RULE_144", acquisition_date: "2024-01-01T00:00:00Z", expected_position_version: "${p_v}" }
              as: Shareholder
              as_user_id: "${acct}"
              captures: { req1: $.data.id }
            - call: "POST /legend-removal-requests"
              payload: { position_id: "${pos}", account_id: "${acct}", share_quantity: 5, rule_basis: "RULE_144", acquisition_date: "2024-01-01T00:00:00Z", expected_position_version: "${p_v}" }
              as: Shareholder
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
            - call: "GET /positions?account_id=${acct}"
              as: Shareholder
              as_user_id: "${acct}"
          assert:
            - "LegendRemovalRequest.${req1}.status == SUBMITTED (first create succeeds at version 1)"
            - "second create: error_id == ERR_STALE_POSITION_VERSION with HTTP 412 (position version advanced to 2 by the first create)"
            - "Position.${pos}.pending_legend_removal_count == 1 (only the first request counted)"

      - name: audit_trail_records_full_transition_chain
        claim_type: cascade_end_to_end
        grounds: [entities.AuditEvent.fields.entry_hash, entities.AuditEvent.fields.from_state]
        distinguishing_aspect: "Every mutating endpoint appends to the tamper-evident chain: a transfer's full lifecycle yields ordered AuditEvents (create, medallion_verified, approve, settle) with from/to states, and the global chain links each entry to its predecessor."
        test_recipe:
          setup: ["issuer outstanding 100; accounts A (100 book) and B; transfer of 10 run through medallion, approve, settle"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Iota Audit", cusip: "000000052", ticker: "IAUD", shares_outstanding: 100, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Audit Ada", address_line1: "42 Ledger St", city: "Tulsa", state_code: "OK", postal_code: "74137", country_code: "US", tax_id: "582-12-1212", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct_a: $.data.id, a_v: $.data.version }
            - call: "POST /accounts"
              payload: { holder_name: "Audit Alan", address_line1: "43 Ledger St", city: "Tulsa", state_code: "OK", postal_code: "74138", country_code: "US", tax_id: "592-12-1212", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /accounts/${acct_a}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 100 }
              as: AgentAdmin
            - call: "POST /transfer-requests"
              payload: { from_account_id: "${acct_a}", to_account_id: "${acct_b}", issuer_id: "${iss}", share_quantity: 10, expected_account_version: "${a_v}" }
              as: TransferExaminer
              captures: { t: $.data.id }
            - call: "POST /transfer-requests/${t}/submit-medallion"
              payload: { medallion_reference: "MED-A", coverage_cents: 50000 }
              as: TransferExaminer
              as_user_id: "exam_1"
            - call: "POST /transfer-requests/${t}/approve"
              payload: {}
              as: TransferSupervisor
              as_user_id: "sup_1"
            - call: "POST /transfer-requests/${t}/settle"
              payload: {}
              as: TransferSupervisor
              as_user_id: "sup_1"
          trigger:
            - call: "GET /audit-events?entity_type=TransferRequest&entity_id=${t}"
              as: ComplianceOfficer
            - call: "GET /audit-events"
              as: ComplianceOfficer
          assert:
            - "filtered audit events for ${t} cover actions transfer.create, transfer.medallion_verified, transfer.approve, transfer.settle in created_at order"
            - "the settle entry carries from_state == APPROVED and to_state == SETTLED with actor_role == \"TransferSupervisor\""
            - "in the unfiltered list ordered by created_at, every entry after the first has prev_entry_hash equal to its predecessor's entry_hash"

      - name: clock_set_is_idempotent_for_passed_transitions
        claim_type: scheduled_transition
        grounds: [calculations.dormancy_determination, state_machines.TransferFreezeWindow]
        distinguishing_aspect: "Time-gated transitions fire once: a second clock set to the same instant does not re-accrue a declaration (payment count stays 1) and the freeze window stays ACTIVE without duplication."
        test_recipe:
          setup: ["issuer outstanding 50; account with 50 shares; declaration record 2026-09-01 payable 2026-09-15; freeze window [2026-08-01, 2026-12-31]"]
          setup_api_calls:
            - call: "POST /issuers"
              payload: { name: "Kappa Clock", cusip: "000000053", ticker: "KCLK", shares_outstanding: 50, par_value_cents: 1, current_market_price_cents: 5000 }
              as: AgentAdmin
              captures: { iss: $.data.id }
            - call: "POST /accounts"
              payload: { holder_name: "Clock Cleo", address_line1: "44 Epoch St", city: "Tulsa", state_code: "OK", postal_code: "74139", country_code: "US", tax_id: "602-12-1212", tin_status: "CERTIFIED" }
              as: AgentAdmin
              captures: { acct: $.data.id }
            - call: "POST /accounts/${acct}/positions"
              payload: { issuer_id: "${iss}", book_entry_shares: 50 }
              as: AgentAdmin
            - call: "POST /dividend-declarations"
              payload: { issuer_id: "${iss}", record_date: "2026-09-01T00:00:00Z", payable_date: "2026-09-15T00:00:00Z", amount_per_share_millicents: 500 }
              as: IssuerOfficer
              as_user_id: "${iss}"
              captures: { decl: $.data.id }
            - call: "POST /issuers/${iss}/freeze-windows"
              payload: { start_date: "2026-08-01T00:00:00Z", end_date: "2026-12-31T00:00:00Z", reason: "long freeze" }
              as: IssuerOfficer
              as_user_id: "${iss}"
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AgentAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: AgentAdmin
            - call: "GET /dividend-payments?declaration_id=${decl}"
              as: AgentAdmin
            - call: "GET /freeze-windows?issuer_id=${iss}"
              as: IssuerOfficer
              as_user_id: "${iss}"
          assert:
            - "GET /dividend-payments?declaration_id=${decl} returns total_count == 1 (accrual fired exactly once across two identical clock sets)"
            - "the freeze window is ACTIVE and remains a single row"
            - "DividendDeclaration.${decl}.status == ACCRUED (payable_date 2026-09-15 not yet reached)"

  - section: consistency_model
    instances:
      - name: settle_read_after_write_immediate
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model, "state_machines.TransferRequest.APPROVED_to_SETTLED"]
        distinguishing_aspect: "Immediate consistency: the GET issued right after settle (same logical instant, no waiting) already shows the transferee's new book balance — no eventual-consistency lag is permitted."
        test_recipe:
          setup: ["issuer outstanding 100; accounts A (100 book) and B; transfer of 25 medallion-verified and approved"]
          setup_api_calls:
