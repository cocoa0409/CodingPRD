# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: wish-grant eligibility, volunteer wish teams & in-kind sourcing
# 9 rules x 2 instances. All recipes replay from empty-DB via /wish-grant endpoints.
# Logical clock default: 2026-09-01T00:00:00Z (set explicitly in each recipe anyway).
# Canonical child: dob 2016-03-10 -> 125 complete months at 2026-09-01 (eligible;
# visit-method band 72..155 -> PLAY_BASED or DRAWING).
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: donation_fmv_retail_basis_vs_partner_declared
        grounds:
          - calculations.donation_fmv_unit
          - entities.DonationOffer.fields.fmv_unit_cents
        distinguishing_aspect: |
          The dual variant lives on the DonationOffer domain (donation valuation):
          identical unit_retail_cents and partner_declared_unit_cents inputs yield
          fmv 50000 under RETAIL_BASIS but min(35000, round_half_up(0.8*50000)) = 35000
          under PARTNER_DECLARED. The sibling instance operates on Chapter cost
          accounting, a different entity domain.
        test_recipe:
          setup:
            - "Empty DB; logical clock at the 2026-09-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/donation-offers"
              payload: { partner_name: "SkyWay Airlines", category: "AIRLINE", valuation_method: "RETAIL_BASIS", description: "2 round-trip tickets", quantity_total: 3, unit_retail_cents: 50000, partner_declared_unit_cents: 35000, valid_from: "2026-08-01", valid_until: "2026-12-31" }
              as: InKindOfficer
              captures: { offer_retail_id: $.data.id }
            - call: "POST /wish-grant/donation-offers"
              payload: { partner_name: "SkyWay Airlines", category: "AIRLINE", valuation_method: "PARTNER_DECLARED", description: "2 round-trip tickets (declared)", quantity_total: 3, unit_retail_cents: 50000, partner_declared_unit_cents: 35000, valid_from: "2026-08-01", valid_until: "2026-12-31" }
              as: InKindOfficer
              captures: { offer_decl_id: $.data.id }
          trigger:
            - call: "GET /wish-grant/donation-offers/${offer_retail_id}"
              as: InKindOfficer
            - call: "GET /wish-grant/donation-offers/${offer_decl_id}"
              as: InKindOfficer
          assert:
            - "DonationOffer.${offer_retail_id}.fmv_unit_cents == 50000"
            - "DonationOffer.${offer_decl_id}.fmv_unit_cents == 35000"
            - "DonationOffer.${offer_retail_id}.fmv_unit_cents != DonationOffer.${offer_decl_id}.fmv_unit_cents despite identical unit_retail_cents (50000) and partner_declared_unit_cents (35000)"

      - name: chapter_cost_per_wish_blended_vs_cash_only
        grounds:
          - calculations.chapter_cost_averages
          - entities.Chapter.fields.avg_cost_blended_cents
          - entities.Chapter.fields.avg_cost_cash_cents
        distinguishing_aspect: |
          The dual variant lives on the Chapter cost-accounting domain: the same
          granted wish (cash 10000 + one 12000-cent in-kind line) yields
          avg_cost_blended_cents == 22000 but avg_cost_cash_cents == 10000.
          The sibling instance operates on DonationOffer valuation, a different
          entity domain.
        test_recipe:
          setup:
            - "Chapter C (budget 2000000, target 800000); child 125 months, STANDARD prognosis (12); RECEIVE_ITEM wish granted with plan cash 10000 + 1 x 12000-cent retailer line."
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Bay Chapter", territory_zip_prefixes: ["700"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Nina Park", email: "nina@example.org" }
              as: WishCoordinator
              captures: { v1_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Owen Diaz", email: "owen@example.org" }
              as: WishCoordinator
              captures: { v2_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "70012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id, child_id: $.data.child_id }
            - call: "POST /wish-grant/referrals/${ref_id}/certify"
              payload: { qualifying_condition: "ONCOLOGY" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals/${ref_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { wish_id: $.data.wish_id }
            - call: "GET /wish-grant/wishes/${wish_id}"
              as: WishCoordinator
              captures: { wish_v1: $.data.version }
            - call: "POST /wish-grant/wish-teams"
              payload: { wish_id: "${wish_id}", lead_volunteer_id: "${v1_id}", second_volunteer_id: "${v2_id}", expected_wish_version: "${wish_v1}" }
              as: WishCoordinator
              captures: { team_id: $.data.id }
            - call: "POST /wish-grant/wish-visits"
              payload: { wish_team_id: "${team_id}", scheduled_start: "2026-09-05T09:00:00Z", scheduled_end: "2026-09-05T11:00:00Z", visit_method: "PLAY_BASED" }
              as: Volunteer
              as_user_id: "${v1_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /wish-grant/wish-visits/${visit_id}/conclude"
              payload: { outcome: "COMPLETED", captured_true_wish: "a big toy firetruck", captured_wish_type: "RECEIVE_ITEM" }
              as: Volunteer
              as_user_id: "${v1_id}"
            - call: "GET /wish-grant/wishes/${wish_id}"
              as: WishCoordinator
              captures: { wish_v2: $.data.version }
            - call: "POST /wish-grant/donation-offers"
              payload: { partner_name: "ToyWorld", category: "RETAILER", valuation_method: "RETAIL_BASIS", description: "toy firetruck", quantity_total: 10, unit_retail_cents: 12000, valid_from: "2026-08-01", valid_until: "2026-12-31" }
              as: InKindOfficer
              captures: { offer_id: $.data.id }
            - call: "POST /wish-grant/fulfillment-plans"
              payload: { wish_id: "${wish_id}", cash_cost_cents: 10000, expected_wish_version: "${wish_v2}" }
              as: WishCoordinator
              as_user_id: "coord-1"
              captures: { plan_id: $.data.id }
            - call: "POST /wish-grant/fulfillment-plans/${plan_id}/line-items"
              payload: { donation_offer_id: "${offer_id}", quantity: 1 }
              as: WishCoordinator
              as_user_id: "coord-1"
            - call: "POST /wish-grant/fulfillment-plans/${plan_id}/submit"
              payload: {}
              as: WishCoordinator
              as_user_id: "coord-1"
            - call: "POST /wish-grant/fulfillment-plans/${plan_id}/approve"
              payload: {}
              as: ChapterDirector
              as_user_id: "dir-1"
            - call: "POST /wish-grant/wish-events"
              payload: { wish_id: "${wish_id}", event_start_date: "2026-10-01", event_end_date: "2026-10-02" }
              as: WishCoordinator
              as_user_id: "coord-1"
              captures: { ev_id: $.data.id }
            - call: "POST /wish-grant/wish-events/${ev_id}/complete"
              payload: {}
              as: WishCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "GET /wish-grant/chapters/${ch_id}"
              as: ChapterDirector
              as_user_id: "dir-1"
          assert:
            - "Chapter.${ch_id}.granted_wish_count == 1"
            - "Chapter.${ch_id}.granted_cost_total_cents == 22000"
            - "Chapter.${ch_id}.granted_cash_total_cents == 10000"
            - "Chapter.${ch_id}.avg_cost_blended_cents == 22000"
            - "Chapter.${ch_id}.avg_cost_cash_cents == 10000"
            - "Chapter.${ch_id}.avg_cost_blended_cents != Chapter.${ch_id}.avg_cost_cash_cents for the identical granted-wish set"

  - rule_id: combinatorial_formula
    instances:
      - name: plan_total_rounds_unit_fmv_before_multiply
        grounds:
          - calculations.plan_cost_totals
          - calculations.donation_fmv_unit
          - entities.PlanLineItem.fields.line_fmv_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: cap = round_half_up(0.8 * 33333) = 26666 is rounded
          at the UNIT level, then multiplied: 3 x 26666 = 79998. The wrong order
          (round once after multiplying: round_half_up(26666.4 * 3) = 79999) differs by
          one cent; the scaffold pins unit-first. The sibling instance is mode (c).
        test_recipe:
          setup:
            - "Chapter, ACTIVE volunteers, RECEIVE_ITEM wish DETERMINED; offer with retail 33333 declared 31999 (fmv = min(31999, round_half_up(26666.4)) = 26666); plan with cash_cost_cents 2."
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Prairie Chapter", territory_zip_prefixes: ["600"], fiscal_year_budget_cents: 2000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Nina Park", email: "nina@example.org" }
              as: WishCoordinator
              captures: { v1_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Owen Diaz", email: "owen@example.org" }
              as: WishCoordinator
              captures: { v2_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "60012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref_id: $.data.id, child_id: $.data.child_id }
            - call: "POST /wish-grant/referrals/${ref_id}/certify"
              payload: { qualifying_condition: "ONCOLOGY" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals/${ref_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { wish_id: $.data.wish_id }
            - call: "GET /wish-grant/wishes/${wish_id}"
              as: WishCoordinator
              captures: { wish_v1: $.data.version }
            - call: "POST /wish-grant/wish-teams"
              payload: { wish_id: "${wish_id}", lead_volunteer_id: "${v1_id}", second_volunteer_id: "${v2_id}", expected_wish_version: "${wish_v1}" }
              as: WishCoordinator
              captures: { team_id: $.data.id }
            - call: "POST /wish-grant/wish-visits"
              payload: { wish_team_id: "${team_id}", scheduled_start: "2026-09-05T09:00:00Z", scheduled_end: "2026-09-05T11:00:00Z", visit_method: "DRAWING" }
              as: Volunteer
              as_user_id: "${v1_id}"
              captures: { visit_id: $.data.id }
            - call: "POST /wish-grant/wish-visits/${visit_id}/conclude"
              payload: { outcome: "COMPLETED", captured_true_wish: "a pallet of board games", captured_wish_type: "RECEIVE_ITEM" }
              as: Volunteer
              as_user_id: "${v1_id}"
            - call: "GET /wish-grant/wishes/${wish_id}"
              as: WishCoordinator
              captures: { wish_v2: $.data.version }
            - call: "POST /wish-grant/donation-offers"
              payload: { partner_name: "GameWholesale", category: "RETAILER", valuation_method: "PARTNER_DECLARED", description: "board game bundle", quantity_total: 8, unit_retail_cents: 33333, partner_declared_unit_cents: 31999, valid_from: "2026-08-01", valid_until: "2026-12-31" }
              as: InKindOfficer
              captures: { offer_id: $.data.id }
            - call: "POST /wish-grant/fulfillment-plans"
              payload: { wish_id: "${wish_id}", cash_cost_cents: 2, expected_wish_version: "${wish_v2}" }
              as: WishCoordinator
              as_user_id: "coord-1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /wish-grant/fulfillment-plans/${plan_id}/line-items"
              payload: { donation_offer_id: "${offer_id}", quantity: 3 }
              as: WishCoordinator
              as_user_id: "coord-1"
              captures: { line_id: $.data.id }
            - call: "GET /wish-grant/fulfillment-plans/${plan_id}"
              as: WishCoordinator
          assert:
            - "DonationOffer.${offer_id}.fmv_unit_cents == 26666"
            - "PlanLineItem.${line_id}.line_fmv_cents == 79998"
            - "FulfillmentPlan.${plan_id}.in_kind_value_cents == 79998"
            - "FulfillmentPlan.${plan_id}.total_cost_cents == 80000"

      - name: escalation_average_includes_pending_plan
        grounds:
          - calculations.cost_per_wish_escalation
          - validations[priority=39]
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: the plan under approval feeds the
          chapter average that gates its own approval. With granted history
          (1 wish, 600000) a pending plan of 1000001 yields projected
          round_half_up(1600001 / 2) = 800001 > 800000 target, so only a
          NationalDirector may approve; the pre-approval aggregates are read first,
          the pending plan added exactly once. The sibling instance is mode (b).
        test_recipe:
          setup:
            - "Chapter C_E (budget 5000000 -> freeze threshold 4750000, target 800000) with ONE granted cash-only wish of 600000 (granted_wish_count 1, granted_cost_total_cents 600000, committed back to 0). A second RECEIVE_ITEM wish DETERMINED in the same chapter with a cash-only plan of 1000001, submitted."
          setup_api_calls:
            - call: "POST /wish-grant/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: NationalAdmin
            - call: "POST /wish-grant/chapters"
              payload: { name: "Gulf Chapter", territory_zip_prefixes: ["800"], fiscal_year_budget_cents: 5000000, target_avg_cost_per_wish_cents: 800000 }
              as: NationalAdmin
              captures: { ch_id: $.data.id }
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Nina Park", email: "nina@example.org" }
              as: WishCoordinator
              captures: { v1_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v1_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers"
              payload: { chapter_id: "${ch_id}", full_name: "Owen Diaz", email: "owen@example.org" }
              as: WishCoordinator
              captures: { v2_id: $.data.id }
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "TRAINED" }
              as: WishCoordinator
            - call: "POST /wish-grant/volunteers/${v2_id}/transition"
              payload: { target_state: "ACTIVE" }
              as: WishCoordinator
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Lila Monroe", child_date_of_birth: "2016-03-10", child_zip_code: "80012", parent_email: "monroe@example.org", diagnosis_summary: "leukemia", source_type: "FAMILY", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref1_id: $.data.id }
            - call: "POST /wish-grant/referrals/${ref1_id}/certify"
              payload: { qualifying_condition: "CARDIAC" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals/${ref1_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { wish1_id: $.data.wish_id }
            - call: "GET /wish-grant/wishes/${wish1_id}"
              as: WishCoordinator
              captures: { wish1_v1: $.data.version }
            - call: "POST /wish-grant/wish-teams"
              payload: { wish_id: "${wish1_id}", lead_volunteer_id: "${v1_id}", second_volunteer_id: "${v2_id}", expected_wish_version: "${wish1_v1}" }
              as: WishCoordinator
              captures: { team1_id: $.data.id }
            - call: "POST /wish-grant/wish-visits"
              payload: { wish_team_id: "${team1_id}", scheduled_start: "2026-09-05T09:00:00Z", scheduled_end: "2026-09-05T11:00:00Z", visit_method: "PLAY_BASED" }
              as: Volunteer
              as_user_id: "${v1_id}"
              captures: { visit1_id: $.data.id }
            - call: "POST /wish-grant/wish-visits/${visit1_id}/conclude"
              payload: { outcome: "COMPLETED", captured_true_wish: "a gaming pc", captured_wish_type: "RECEIVE_ITEM" }
              as: Volunteer
              as_user_id: "${v1_id}"
            - call: "GET /wish-grant/wishes/${wish1_id}"
              as: WishCoordinator
              captures: { wish1_v2: $.data.version }
            - call: "POST /wish-grant/fulfillment-plans"
              payload: { wish_id: "${wish1_id}", cash_cost_cents: 600000, expected_wish_version: "${wish1_v2}" }
              as: WishCoordinator
              as_user_id: "coord-1"
              captures: { plan1_id: $.data.id }
            - call: "POST /wish-grant/fulfillment-plans/${plan1_id}/submit"
              payload: {}
              as: WishCoordinator
              as_user_id: "coord-1"
            - call: "POST /wish-grant/fulfillment-plans/${plan1_id}/approve"
              payload: {}
              as: ChapterDirector
              as_user_id: "dir-1"
            - call: "POST /wish-grant/wish-events"
              payload: { wish_id: "${wish1_id}", event_start_date: "2026-10-01", event_end_date: "2026-10-02" }
              as: WishCoordinator
              as_user_id: "coord-1"
              captures: { ev1_id: $.data.id }
            - call: "POST /wish-grant/wish-events/${ev1_id}/complete"
              payload: {}
              as: WishCoordinator
              as_user_id: "coord-1"
            - call: "POST /wish-grant/referrals"
              payload: { child_full_name: "Theo Alvarez", child_date_of_birth: "2015-06-15", child_zip_code: "80044", parent_email: "alvarez@example.org", diagnosis_summary: "cardiomyopathy", source_type: "MEDICAL_PROFESSIONAL", prognosis_months: 12 }
              as: ReferralSource
              captures: { ref2_id: $.data.id }
            - call: "POST /wish-grant/referrals/${ref2_id}/certify"
              payload: { qualifying_condition: "CARDIAC" }
              as: MedicalProvider
            - call: "POST /wish-grant/referrals/${ref2_id}/determine"
              payload: { decision: "APPROVED" }
              as: EligibilityReviewer
              captures: { wish2_id: $.data.wish_id }
            - call: "GET /wish-grant/wishes/${wish2_id}"
