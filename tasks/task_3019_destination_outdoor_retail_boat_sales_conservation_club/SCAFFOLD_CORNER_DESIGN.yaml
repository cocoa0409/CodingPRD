            - "a unit with a null prior_title_no would credit the full 50000 and 50001 respectively, the zero-penalty branch"

      - name: permit_remit_window_is_half_open_at_the_end_boundary
        claim_type: correct_result
        grounds:
          - calculations.permit_remit_snapshot
          - entities.PermitRemitBatch.fields.window_end_utc
          - validations[priority=19]
        distinguishing_aspect: "The window is half-open, so a sale stamped exactly at window_start_utc is included and one stamped exactly at window_end_utc is excluded, which is only observable by moving the logical clock across both instants."
        test_recipe:
          setup: ["a store, one member and one remit batch whose window is 2026-09-01T00:00Z to 2026-09-30T00:00Z"]
          setup_api_calls:
            - call: "POST /stores"
