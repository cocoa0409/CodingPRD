  # ===========================================================================
  - section: Cross-Cutting Complexity Layers
    instances:

      - name: stale_product_model_version_on_pattern_create_is_a_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[pattern-create-stale-model]
          - errors.ERR_STALE_PRODUCT_MODEL_VERSION
          - endpoints[POST /product-safety/hazard-patterns]
        distinguishing_aspect: |
          Pattern creation is an OCC-guarded CREATE-with-supersede, not an update: the
          write both mints a row and re-points the previous pattern's clustered
          incidents, so a writer holding the version it read BEFORE the first pattern
          existed would silently discard an analysis it never saw. The instance pins
          all three OCC obligations on the one endpoint — the stale token is a 412
          with the model-specific code, the refreshed token succeeds, and
          ProductModel.version advances by exactly one per accepted write.
        test_recipe:
          setup:
            - "logical clock at 2026-03-01T00:00:00Z, one product model at version 1, three CLASSIFIED BURN incidents inside the analysis window"
            - "one PRELIMINARY hazard pattern already created with the model's version-1 token, which bumped the model to version 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
              captures: { pm_id: $.data.id, pm_v1: $.data.version }
            - call: "POST /product-safety/incidents"
