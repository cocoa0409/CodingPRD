# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Medical Financing / Patient Payment Plan — EXPERT
# 9 rule_ids × 2 instances = 18 difficulty instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: deferred_interest_chronological_vs_forward_projection
        grounds:
          - calculations.deferred_interest
          - state_machines.FinancedPurchase.DEFERRED_to_INTEREST_FORFEITED
          - 'endpoints["GET /financed-purchases/{id}/payoff-projection"]'
        distinguishing_aspect: |
          On the SAME FinancedPurchase, the posted chronological_actual forfeit (218469 cents,
          time-weighted on real outstanding after a mid-window 400000-cent payment) is strictly
          less than the advisory forward_looking_projected payoff (273649 cents, full principal
          for the whole window), proving two algorithms diverge on the financing/purchase domain.
        test_recipe:
          setup:
            - "Clock at 2026-01-01. Provider ENROLLED; ACTIVE DEFERRED_INTEREST plan (apr 0.2699, 12 months); ProviderPromotion window [2026-01-01,2028-01-01)."
            - "Patient account ACTIVE with limit 2,000,000. One AUTHORIZED purchase principal 1,000,000, promo_end 2027-01-01."
            - "A 400000-cent MANUAL payment posted at 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Acme Dental", specialty: "DENTAL", tax_id: "TX-DV-1", base_merchant_discount_rate: 0.085 }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /providers/${prov_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "12mo No Interest", plan_category: "DEFERRED_INTEREST", deferred_period_months: 12, promo_apr: 0.2699, min_payment_factor: 0.0333 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /promotional-plans/${plan_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${prov_id}", promotional_plan_id: "${plan_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pp_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Pat A", applicant_ssn_last4: "1001", stated_annual_income_cents: 6000000, requested_limit_cents: 2000000 }
              as: Anonymous
              captures: { app_id: $.data.id }
            - call: "POST /credit-applications/${app_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { acct_id: $.data.patient_account_id }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acct_v0: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${prov_id}", patient_account_id: "${acct_id}", provider_promotion_id: "${pp_id}", principal_cents: 1000000, expected_patient_account_version: "${acct_v0}" }
              as: Provider
              as_user_id: "${prov_id}"
              captures: { fp_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /payments"
              payload: { patient_account_id: "${acct_id}", amount_cents: 400000, payment_type: "MANUAL" }
              as: Patient
              as_user_id: "${acct_id}"
          trigger:
            - call: "GET /financed-purchases/${fp_id}/payoff-projection"
              payload: {}
              as: Patient
              as_user_id: "${acct_id}"
              captures: { proj: $.data.projected_forfeit_interest_cents }
            - call: "POST /_clock/advance"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "FinancedPurchase.${fp_id}.promo_status == INTEREST_FORFEITED"
            - "FinancedPurchase.${fp_id}.deferred_interest_posted_cents == 218469"
            - "payoff-projection at 2026-07-01 projected_forfeit_interest_cents == 82769"
            - "the chronological posted forfeit 218469 < forward projection 273649 computed at promo_start"

      - name: credit_decision_provisional_vs_final_haircut
        grounds:
          - calculations.credit_decision
          - state_machines.CreditApplication.SUBMITTED_to_APPROVED
          - entities.CreditApplication.fields.provisional_limit_cents
          - entities.CreditApplication.fields.approved_limit_cents
        distinguishing_aspect: |
          For identical income (6,000,000) and request (1,500,000), the provisional line (1,200,000,
          income-band only) exceeds the final approved line (900,000) once the applicant has one prior
          DEFAULTED account, because final applies a 0.25 prior-default haircut — dual variants on the
          credit-application/account domain, structurally distinct from the deferred_interest pair.
        test_recipe:
          setup:
            - "An existing PatientAccount for holder 'Dee Fault' in DEFAULTED status (one prior default)."
            - "A fresh SUBMITTED application for the same holder name, income 6,000,000, requested 1,500,000."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Dee Fault", applicant_ssn_last4: "2001", stated_annual_income_cents: 6000000, requested_limit_cents: 1500000 }
              as: Anonymous
              captures: { prior_app_id: $.data.id }
            - call: "POST /credit-applications/${prior_app_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { prior_acct_id: $.data.patient_account_id }
            - call: "POST /_cycle/open_statement"
              payload: { patient_account_id: "${prior_acct_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Vol Clinic", specialty: "GENERAL", tax_id: "TX-G-2", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { prov2_id: $.data.id }
            - call: "POST /providers/${prov2_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "DI base", plan_category: "DEFERRED_INTEREST", deferred_period_months: 6, promo_apr: 0.2699, min_payment_factor: 0.05 }
              as: PlatformAdmin
              captures: { plan2_id: $.data.id }
            - call: "POST /promotional-plans/${plan2_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${prov2_id}", promotional_plan_id: "${plan2_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { pp2_id: $.data.id }
            - call: "GET /accounts/${prior_acct_id}"
              payload: {}
              as: PlatformAdmin
              captures: { prior_acct_v: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${prov2_id}", patient_account_id: "${prior_acct_id}", provider_promotion_id: "${pp2_id}", principal_cents: 1000000, expected_patient_account_version: "${prior_acct_v}" }
              as: Provider
              as_user_id: "${prov2_id}"
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_cycle/close_statement"
              payload: { patient_account_id: "${prior_acct_id}" }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_cycle/close_statement"
              payload: { patient_account_id: "${prior_acct_id}" }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-05-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_cycle/close_statement"
              payload: { patient_account_id: "${prior_acct_id}" }
              as: PlatformAdmin
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Dee Fault", applicant_ssn_last4: "2002", stated_annual_income_cents: 6000000, requested_limit_cents: 1500000 }
              as: Anonymous
              captures: { new_app_id: $.data.id, prov_limit: $.data.provisional_limit_cents }
          trigger:
            - call: "POST /credit-applications/${new_app_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { approved_limit: $.data.approved_limit_cents }
          assert:
            - "CreditApplication.${new_app_id}.provisional_limit_cents == 1200000"
            - "CreditApplication.${new_app_id}.approved_limit_cents == 900000"
            - "approved_limit_cents (900000) < provisional_limit_cents (1200000) for identical inputs"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: settlement_fee_circular_volume_tier_evaluation_order
        grounds:
          - calculations.settlement_fee
          - state_machines.FinancedPurchase.settlement_status_AUTHORIZED_to_SETTLED
          - entities.Settlement.fields.discount_rate_applied
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: discount_rate_applied depends on a tier keyed on
          prospective_volume = provider.monthly_settled_volume_cents + THIS gross, but
          monthly_settled_volume is only mutated at PENDING→PAID, never at settle — pinned order
          yields net 748000 for an already-paid 4,500,000 volume + 800,000 gross (prospective 5,300,000
          crosses TIER1, rate 0.065).
        test_recipe:
          setup:
            - "Provider base rate 0.085, ENROLLED, monthly_settled_volume_cents already 4,500,000 (from a prior PAID settlement in the same clock month)."
            - "A fresh AUTHORIZED purchase principal 800,000 ready to settle."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Vol Big", specialty: "VISION", tax_id: "TX-VS-3", base_merchant_discount_rate: 0.085 }
              as: PlatformAdmin
              captures: { provb_id: $.data.id }
            - call: "POST /providers/${provb_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "DI vol", plan_category: "DEFERRED_INTEREST", deferred_period_months: 12, promo_apr: 0.25, min_payment_factor: 0.04 }
              as: PlatformAdmin
              captures: { planb_id: $.data.id }
            - call: "POST /promotional-plans/${planb_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${provb_id}", promotional_plan_id: "${planb_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ppb_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Vol Pat", applicant_ssn_last4: "3001", stated_annual_income_cents: 30000000, requested_limit_cents: 2500000 }
              as: Anonymous
              captures: { appb_id: $.data.id }
            - call: "POST /credit-applications/${appb_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { acctb_id: $.data.patient_account_id }
            - call: "GET /accounts/${acctb_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acctb_v0: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${provb_id}", patient_account_id: "${acctb_id}", provider_promotion_id: "${ppb_id}", principal_cents: 4500000, expected_patient_account_version: "${acctb_v0}" }
              as: Provider
              as_user_id: "${provb_id}"
              captures: { fp_pre_id: $.data.id, fp_pre_v: $.data.version }
            - call: "POST /financed-purchases/${fp_pre_id}/settle"
              payload: { expected_financed_purchase_version: "${fp_pre_v}" }
              as: PlatformAdmin
              captures: { settle_pre_id: $.data.id }
            - call: "POST /settlements/${settle_pre_id}/pay"
              payload: {}
              as: PlatformAdmin
            - call: "GET /accounts/${acctb_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acctb_v1: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${provb_id}", patient_account_id: "${acctb_id}", provider_promotion_id: "${ppb_id}", principal_cents: 800000, expected_patient_account_version: "${acctb_v1}" }
              as: Provider
              as_user_id: "${provb_id}"
              captures: { fp2_id: $.data.id, fp2_v: $.data.version }
          trigger:
            - call: "POST /financed-purchases/${fp2_id}/settle"
              payload: { expected_financed_purchase_version: "${fp2_v}" }
              as: PlatformAdmin
              captures: { settle2_id: $.data.id }
          assert:
            - "Settlement.${settle2_id}.discount_rate_applied == 0.065"
            - "Settlement.${settle2_id}.discount_fee_cents == 52000"
            - "Settlement.${settle2_id}.net_cents == 748000"

      - name: minimum_payment_round_then_sum_vs_sum_then_round
        grounds:
          - calculations.minimum_payment
          - state_machines.BillingStatement.OPEN_to_CLOSED
          - entities.BillingStatement.fields.minimum_payment_due_cents
        distinguishing_aspect: |
          Mode (b) nested rounding order: two open purchases each open-principal 1020 under a plan with
          min_payment_factor 0.025 yield round-per-line(26)+round-per-line(26)=52 cents minimum,
          whereas sum-then-round (1020*0.025*2=51.0 -> 51) would give 51 — the scaffold pins
          round-then-sum, so the asserted minimum is 52, a distinct mode from settlement_fee's (c).
        test_recipe:
          setup:
            - "Account ACTIVE; plan min_payment_factor 0.025; two AUTHORIZED purchases each principal 1020, both open."
            - "An OPEN statement spanning the cycle, no payments yet."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Round Clinic", specialty: "DERMATOLOGY", tax_id: "TX-DR-4", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { provr_id: $.data.id }
            - call: "POST /providers/${provr_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "Quarter-pct", plan_category: "EQUAL_PAYMENT", deferred_period_months: 24, promo_apr: 0.0, min_payment_factor: 0.025 }
              as: PlatformAdmin
              captures: { planr_id: $.data.id }
            - call: "POST /promotional-plans/${planr_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${provr_id}", promotional_plan_id: "${planr_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ppr_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Round Pat", applicant_ssn_last4: "4001", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { appr_id: $.data.id }
            - call: "POST /credit-applications/${appr_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { acctr_id: $.data.patient_account_id }
            - call: "GET /accounts/${acctr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acctr_v0: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${provr_id}", patient_account_id: "${acctr_id}", provider_promotion_id: "${ppr_id}", principal_cents: 1020, expected_patient_account_version: "${acctr_v0}" }
              as: Provider
              as_user_id: "${provr_id}"
            - call: "GET /accounts/${acctr_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acctr_v1: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${provr_id}", patient_account_id: "${acctr_id}", provider_promotion_id: "${ppr_id}", principal_cents: 1020, expected_patient_account_version: "${acctr_v1}" }
              as: Provider
              as_user_id: "${provr_id}"
            - call: "POST /_cycle/open_statement"
              payload: { patient_account_id: "${acctr_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-02-28T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-28T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_cycle/close_statement"
              payload: { patient_account_id: "${acctr_id}" }
              as: PlatformAdmin
              captures: { stmt_id: $.data.id, min_due: $.data.minimum_payment_due_cents }
          assert:
            - "BillingStatement.${stmt_id}.minimum_payment_due_cents == 52"
            - "minimum_payment_due_cents != 51 (sum-then-round would give 51)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: patient_account_cyclic_active_delinquent_cure
        grounds:
          - state_machines.PatientAccount.ACTIVE_to_DELINQUENT
          - state_machines.PatientAccount.DELINQUENT_to_ACTIVE
          - entities.PatientAccount.fields.delinquency_strikes
        distinguishing_aspect: |
          PatientAccount cycles ACTIVE→DELINQUENT (missed minimum) →ACTIVE (cure) on the SAME row,
          delinquency_strikes 0→1→0 — a cycle on the account entity, distinct from FinancedPurchase's
          parallel axes below.
        test_recipe:
          setup:
            - "Account ACTIVE with one open purchase carrying a positive minimum; an OPEN statement past period_end with no payment."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Cyc Clinic", specialty: "GENERAL", tax_id: "TX-G-5", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { provc_id: $.data.id }
            - call: "POST /providers/${provc_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "Cyc plan", plan_category: "DEFERRED_INTEREST", deferred_period_months: 24, promo_apr: 0.2, min_payment_factor: 0.05 }
              as: PlatformAdmin
              captures: { planc_id: $.data.id }
            - call: "POST /promotional-plans/${planc_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${provc_id}", promotional_plan_id: "${planc_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ppc_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Cyc Pat", applicant_ssn_last4: "5001", stated_annual_income_cents: 6000000, requested_limit_cents: 500000 }
              as: Anonymous
              captures: { appc_id: $.data.id }
            - call: "POST /credit-applications/${appc_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { acctc_id: $.data.patient_account_id }
            - call: "GET /accounts/${acctc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acctc_v0: $.data.version }
            - call: "POST /financed-purchases"
              payload: { provider_id: "${provc_id}", patient_account_id: "${acctc_id}", provider_promotion_id: "${ppc_id}", principal_cents: 200000, expected_patient_account_version: "${acctc_v0}" }
              as: Provider
              as_user_id: "${provc_id}"
            - call: "POST /_cycle/open_statement"
              payload: { patient_account_id: "${acctc_id}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /_cycle/close_statement"
              payload: { patient_account_id: "${acctc_id}" }
              as: PlatformAdmin
          trigger:
            - call: "GET /accounts/${acctc_id}"
              payload: {}
              as: PlatformAdmin
              captures: { after_miss_status: $.data.status, after_miss_strikes: $.data.delinquency_strikes }
            - call: "POST /payments"
              payload: { patient_account_id: "${acctc_id}", amount_cents: 100000, payment_type: "MANUAL" }
              as: Patient
              as_user_id: "${acctc_id}"
          assert:
            - "after first close, PatientAccount.${acctc_id}.status == DELINQUENT and delinquency_strikes == 1"
            - "after the curing payment, PatientAccount.${acctc_id}.status == ACTIVE and delinquency_strikes == 0"

      - name: financed_purchase_parallel_settlement_and_promo_axes
        grounds:
          - state_machines.FinancedPurchase.settlement_status_AUTHORIZED_to_SETTLED
          - state_machines.FinancedPurchase.DEFERRED_to_PAID_IN_FULL
          - entities.FinancedPurchase.fields.settlement_status
          - entities.FinancedPurchase.fields.promo_status
        distinguishing_aspect: |
          On one FinancedPurchase the settlement axis (AUTHORIZED→SETTLED) and the promo axis
          (DEFERRED→PAID_IN_FULL) advance independently — settling does not touch promo_status and
          paying in full does not touch settlement_status — two parallel dimensions on the purchase
          entity, distinct from PatientAccount's cycle.
        test_recipe:
          setup:
            - "Clock 2026-01-01; ENROLLED provider, ACTIVE plan 12mo apr 0.2699; account ACTIVE limit 1,000,000."
            - "One AUTHORIZED purchase principal 100,000, promo_end 2027-01-01."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /providers"
              payload: { legal_name: "Par Clinic", specialty: "DENTAL", tax_id: "TX-DV-6", base_merchant_discount_rate: 0.08 }
              as: PlatformAdmin
              captures: { provp_id: $.data.id }
            - call: "POST /providers/${provp_id}/enroll"
              payload: {}
              as: PlatformAdmin
            - call: "POST /promotional-plans"
              payload: { name: "Par plan", plan_category: "DEFERRED_INTEREST", deferred_period_months: 12, promo_apr: 0.2699, min_payment_factor: 0.05 }
              as: PlatformAdmin
              captures: { planp_id: $.data.id }
            - call: "POST /promotional-plans/${planp_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /provider-promotions"
              payload: { provider_id: "${provp_id}", promotional_plan_id: "${planp_id}", effective_start: "2026-01-01T00:00:00Z", effective_end: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ppp_id: $.data.id }
            - call: "POST /credit-applications"
              payload: { applicant_full_name: "Par Pat", applicant_ssn_last4: "6001", stated_annual_income_cents: 6000000, requested_limit_cents: 1000000 }
              as: Anonymous
              captures: { appp_id: $.data.id }
            - call: "POST /credit-applications/${appp_id}/approve"
              payload: {}
              as: PlatformAdmin
              captures: { acctp_id: $.data.patient_account_id }
            - call: "GET /accounts/${acctp_id}"
              payload: {}
              as: PlatformAdmin
              captures: { acctp_v0: $.data.version }
