            - "The third trigger call returns 422 with error_id ERR_FIELD_ACTION_NOT_APPROVED (linked FieldAction is SUBMITTED)"
            - "After the third trigger call SupplierRecovery.${rec_m_id}.status == DRAFT, assert_count == 0 and recognized_recovery_cents == 1800000 from creation-time valuation"
            - "The fifth trigger call returns 200, SupplierRecovery.${rec_m_id}.status == ASSERTED, assert_count == 1, recognized_recovery_cents == 1800000, valuation_variant == EXPECTED_VALUE, collectability_rating_at_valuation == HIGH"
            - "Supplier.${sup3_id}.gross_asserted_recovery_cents == 2000000 and open_recovery_asset_cents == 1800000"
            - "FieldAction.${fa_m_id}.approval_state == APPROVED and specific_accrual_cents == 26000000"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: half_open_months_in_service_buckets_touch_without_overlapping
        grounds:
          - validations[priority=32]
          - entities.ClaimObservation.fields.months_in_service_from
          - entities.ClaimObservation.fields.months_in_service_to
          - errors[ERR_OBSERVATION_WINDOW_OVERLAP]
          - endpoints[POST /warranty/claim-observations]
        distinguishing_aspect: |
          HALF-OPEN interval semantics `[from, to)` scoped to the (vintage_id,
          failure_mode_id) pair: a bucket starting exactly where the previous one ends is
          NOT an overlap and must be accepted, while a bucket that straddles the shared
          endpoint by one month on each side, and an exact re-submission of an existing
          bucket, both raise ERR_OBSERVATION_WINDOW_OVERLAP — and the same straddling bucket
          is legal again under a different failure mode, proving the scope key.
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists (observation_period_code must resolve to a period)."
            - "ProductFamily FAM-R has one ACTIVE vintage R-MY2024 of 8000 units and two failure modes FM-R-01 and FM-R-02."
            - "One ClaimObservation already exists for (R-MY2024, FM-R-01) covering months_in_service [0, 12)."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-R", name: "Range Hood Platform", launch_date: "2024-01-01", base_warranty_months: 36, standard_cost_per_claim_cents: 16000, reserve_cap_cents: 40000000 }
              as: WarrantyAnalyst
              captures: { fam_r_id: $.data.id }
            - call: "POST /warranty/vintages"
              payload: { family_id: "${fam_r_id}", vintage_code: "R-MY2024", units_shipped: 8000, ship_period_code: "2024-Q1", warranty_expiry_date: "2028-12-31" }
              as: WarrantyAnalyst
              captures: { vin_r_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_r_id}", mode_code: "FM-R-01", description: "Blower motor seizure", severity: "FUNCTIONAL", cost_per_claim_cents: 16000 }
              as: WarrantyAnalyst
              captures: { fm_r1_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_r_id}", mode_code: "FM-R-02", description: "Filter latch fracture", severity: "COSMETIC", cost_per_claim_cents: 3000 }
              as: WarrantyAnalyst
              captures: { fm_r2_id: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_r_id}", failure_mode_id: "${fm_r1_id}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 12, claim_count: 40, paid_cost_cents: 640000 }
              as: WarrantyAnalyst
              captures: { obs_r1_id: $.data.id }
          trigger:
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_r_id}", failure_mode_id: "${fm_r1_id}", observation_period_code: "2026-Q3", months_in_service_from: 12, months_in_service_to: 24, claim_count: 30, paid_cost_cents: 480000 }
              as: WarrantyAnalyst
              captures: { obs_r2_id: $.data.id }
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_r_id}", failure_mode_id: "${fm_r1_id}", observation_period_code: "2026-Q3", months_in_service_from: 11, months_in_service_to: 13, claim_count: 5, paid_cost_cents: 80000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_r_id}", failure_mode_id: "${fm_r1_id}", observation_period_code: "2026-Q3", months_in_service_from: 0, months_in_service_to: 12, claim_count: 40, paid_cost_cents: 640000 }
              as: WarrantyAnalyst
            - call: "POST /warranty/claim-observations"
              payload: { vintage_id: "${vin_r_id}", failure_mode_id: "${fm_r2_id}", observation_period_code: "2026-Q3", months_in_service_from: 11, months_in_service_to: 13, claim_count: 5, paid_cost_cents: 15000 }
              as: WarrantyAnalyst
              captures: { obs_r4_id: $.data.id }
          assert:
            - "The first trigger call returns 201 (touching at month 12 is not an overlap under [from, to) semantics)"
            - "The second trigger call returns 409 with error_id ERR_OBSERVATION_WINDOW_OVERLAP"
            - "The third trigger call returns 409 with error_id ERR_OBSERVATION_WINDOW_OVERLAP"
            - "The fourth trigger call returns 201 because the (vintage_id, failure_mode_id) scope key differs"
            - "ClaimObservation.${obs_r2_id}.months_in_service_from == 12 and months_in_service_to == 24"
            - "ClaimObservation.${obs_r4_id}.months_in_service_from == 11 and months_in_service_to == 13"
            - "GET /warranty/claim-observations?vintage_id=${vin_r_id} reports total_count == 3"
            - "ProductFamily.${fam_r_id}.observed_history_months == 24 and observed_exposure_units == 8000"

      - name: closed_build_windows_need_a_thirty_day_buffer_and_ignore_rejected_actions
        grounds:
          - validations[priority=33]
          - entities.FieldAction.fields.affected_build_start_date
          - entities.FieldAction.fields.affected_build_end_date
          - errors[ERR_FIELD_ACTION_WINDOW_CONFLICT]
          - state_machines.FieldAction.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          A DIFFERENT interval semantics from the observation instance: CLOSED date windows
          `[start, end]` inflated by a 30-calendar-day buffer, scoped per family and filtered
          on approval_state != REJECTED. A window opening exactly 30 days after an existing
          window's end still conflicts; opening on day 31 is clear; and a window overlapping
          a REJECTED field action is accepted because REJECTED rows leave the input set.
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists so a decision has a booking period."
            - "ProductFamily FAM-S exists."
            - "FieldAction FA-S-01 is a DRAFT SERVICE_CAMPAIGN with affected build window [2025-01-01, 2025-03-31]."
            - "FieldAction FA-S-90 is a SERVICE_CAMPAIGN with affected build window [2025-08-01, 2025-08-31] that has been driven all the way to approval_state == REJECTED."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-S", name: "Steam Oven Platform", launch_date: "2024-06-01", base_warranty_months: 24, standard_cost_per_claim_cents: 22000, reserve_cap_cents: 60000000 }
              as: WarrantyAnalyst
              captures: { fam_s_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_s_id}", action_code: "FA-S-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-01-01", affected_build_end_date: "2025-03-31", affected_unit_count: 1200, regulatory_notice_filed: false }
              as: QualityEngineer
              captures: { fa_s1_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_s_id}", action_code: "FA-S-90", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-08-01", affected_build_end_date: "2025-08-31", affected_unit_count: 900, regulatory_notice_filed: false }
              as: QualityEngineer
              captures: { fa_s90_id: $.data.id, fa_s90_ver: $.data.version }
            - call: "POST /warranty/field-actions/${fa_s90_id}/remedy-options"
              payload: { option_code: "OPT-S90", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 2000, labor_hours_centi: 90, admin_cost_cents: 300, expected_take_rate_bps: 6000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_s90_id: $.data.id }
            - call: "POST /warranty/field-actions/${fa_s90_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_s90_ver}", remedy_option_id: "${opt_s90_id}" }
              as: QualityEngineer
            - call: "POST /warranty/field-actions/${fa_s90_id}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "uq-1"
            - call: "POST /warranty/field-actions/${fa_s90_id}/decision"
              payload: { decision: "REJECTED" }
              as: ReserveController
              as_user_id: "urc-1"
          trigger:
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_s_id}", action_code: "FA-S-02", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-04-30", affected_build_end_date: "2025-06-30", affected_unit_count: 700, regulatory_notice_filed: false }
              as: QualityEngineer
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_s_id}", action_code: "FA-S-03", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-05-01", affected_build_end_date: "2025-06-30", affected_unit_count: 700, regulatory_notice_filed: false }
              as: QualityEngineer
              captures: { fa_s3_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_s_id}", action_code: "FA-S-91", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-08-10", affected_build_end_date: "2025-09-10", affected_unit_count: 400, regulatory_notice_filed: false }
              as: QualityEngineer
              captures: { fa_s91_id: $.data.id }
          assert:
            - "The first trigger call returns 409 with error_id ERR_FIELD_ACTION_WINDOW_CONFLICT (2025-03-31 + 30 days == 2025-04-30, still inside the buffer)"
            - "The second trigger call returns 201 (2025-05-01 is 31 days clear of 2025-03-31)"
            - "The third trigger call returns 201 even though [2025-08-10, 2025-09-10] overlaps FA-S-90, because FA-S-90.approval_state == REJECTED is excluded from the conflict input set"
            - "FieldAction.${fa_s90_id}.approval_state == REJECTED and specific_accrual_cents == 0"
            - "FieldAction.${fa_s3_id}.approval_state == DRAFT and FieldAction.${fa_s91_id}.approval_state == DRAFT"
            - "GET /warranty/field-actions?family_id=${fam_s_id} reports total_count == 4"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: gross_asserted_recovery_is_conserved_when_a_claim_is_written_off
        grounds:
          - entities.Supplier.fields.gross_asserted_recovery_cents
          - entities.Supplier.fields.open_recovery_asset_cents
          - entities.Supplier.fields.written_off_recovery_cents
          - state_machines.SupplierRecovery.ASSERTED_to_WRITTEN_OFF
          - calculations.supplier_collectability_rating
        distinguishing_aspect: |
          Conserved quantity #1 — Supplier.gross_asserted_recovery_cents. Writing a claim off
          must NOT make the asserted exposure disappear: the recognized asset of 4500000 is
          removed from open_recovery_asset_cents and exactly compensated by a 5000000
          write-off entry, so that once every claim is closed the closure identity
          `gross_asserted_recovery_cents == realized_recovery_cents + written_off_recovery_cents`
          holds (5000000 == 0 + 5000000) while gross itself never moves.
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3 exists."
            - "Supplier SUP-4 has credit_rating AAA (base collectability HIGH), annual_purchase_volume_cents 1000000000 and contractual_recovery_cap_bps 2000, so its cap is 200000000 cents."
            - "ProductFamily FAM-W has failure mode FM-W-PMP whose supplier_id is SUP-4."
            - "FieldAction FA-W-01 is an APPROVED SERVICE_CAMPAIGN so the recovery may be asserted."
            - "A single SupplierRecovery of 5000000 cents exists in status DRAFT."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
            - call: "POST /warranty/suppliers"
              payload: { supplier_code: "SUP-4", name: "Vindal Pumpe GmbH", credit_rating: "AAA", annual_purchase_volume_cents: 1000000000, contractual_recovery_cap_bps: 2000 }
              as: WarrantyAnalyst
              captures: { sup4_id: $.data.id }
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-W", name: "Washer Platform W", launch_date: "2024-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 18000, reserve_cap_cents: 70000000 }
              as: WarrantyAnalyst
              captures: { fam_w_id: $.data.id }
            - call: "POST /warranty/failure-modes"
              payload: { family_id: "${fam_w_id}", mode_code: "FM-W-PMP", description: "Supplied drain pump impeller failure", severity: "FUNCTIONAL", cost_per_claim_cents: 18000, supplier_id: "${sup4_id}" }
              as: WarrantyAnalyst
              captures: { fm_w_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_w_id}", action_code: "FA-W-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-03-01", affected_build_end_date: "2025-05-31", affected_unit_count: 1000, regulatory_notice_filed: false }
              as: QualityEngineer
              captures: { fa_w_id: $.data.id, fa_w_ver: $.data.version }
            - call: "POST /warranty/field-actions/${fa_w_id}/remedy-options"
              payload: { option_code: "OPT-W-PERM", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 2500, labor_hours_centi: 100, admin_cost_cents: 400, expected_take_rate_bps: 5000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_w_id: $.data.id }
            - call: "POST /warranty/field-actions/${fa_w_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_w_ver}", remedy_option_id: "${opt_w_id}" }
              as: QualityEngineer
            - call: "POST /warranty/field-actions/${fa_w_id}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "uq-1"
            - call: "POST /warranty/field-actions/${fa_w_id}/decision"
              payload: { decision: "APPROVED" }
              as: ReserveController
              as_user_id: "urc-1"
            - call: "POST /warranty/supplier-recoveries"
              payload: { supplier_id: "${sup4_id}", failure_mode_id: "${fm_w_id}", field_action_id: "${fa_w_id}", asserted_amount_cents: 5000000 }
              as: WarrantyAnalyst
              captures: { rec_w_id: $.data.id }
          trigger:
            - call: "POST /warranty/supplier-recoveries/${rec_w_id}/assert"
              payload: {}
              as: WarrantyAnalyst
            - call: "POST /warranty/supplier-recoveries/${rec_w_id}/close"
              payload: { outcome: "WRITTEN_OFF" }
              as: ReserveController
          assert:
            - "After the first trigger call: SupplierRecovery.${rec_w_id}.status == ASSERTED, recognized_recovery_cents == 4500000, valuation_variant == EXPECTED_VALUE"
            - "After the first trigger call: Supplier.${sup4_id}.gross_asserted_recovery_cents == 5000000, open_recovery_asset_cents == 4500000, realized_recovery_cents == 0, written_off_recovery_cents == 0, closed_recovery_count == 0, realization_bps == 10000, collectability_rating == HIGH"
            - "The second trigger call returns 200 and SupplierRecovery.${rec_w_id}.status == WRITTEN_OFF with recognized_recovery_cents == 0 and settled_amount_cents == null"
            - "After the second trigger call: Supplier.${sup4_id}.gross_asserted_recovery_cents == 5000000 (unchanged — the conserved quantity)"
            - "After the second trigger call: Supplier.${sup4_id}.open_recovery_asset_cents == 0 and written_off_recovery_cents == 5000000, so the removed asset is exactly compensated"
            - "After the second trigger call: Supplier.${sup4_id}.realized_recovery_cents == 0, closed_recovery_count == 1, realization_bps == 0 and collectability_rating == LOW"
            - "The closure identity holds: gross_asserted_recovery_cents == realized_recovery_cents + written_off_recovery_cents (5000000 == 0 + 5000000)"

      - name: service_contract_price_is_conserved_across_recognition_and_refund
        grounds:
          - calculations.service_contract_recognition
          - entities.ServiceContract.fields.recognized_revenue_cents
          - entities.ServiceContract.fields.deferred_revenue_cents
          - entities.ServiceContract.fields.refunded_revenue_cents
          - state_machines.ServiceContract.ACTIVE_to_CANCELLED
          - endpoints[POST /warranty/_clock/set_current_utc]
        distinguishing_aspect: |
          A DIFFERENT conserved quantity from the supplier instance —
          ServiceContract.total_contract_price_cents. At every observable point
          `recognized_revenue_cents + deferred_revenue_cents + refunded_revenue_cents ==
          total_contract_price_cents == 480000`: the clock moving recognition from 120000 to
          240000 only shifts value out of deferral, cancellation converts the entire
          remaining 240000 deferral into a refund, and advancing the clock past cancellation
          must NOT resume recognition (recognized stays frozen at 240000) — the identity
          would break if it did.
        test_recipe:
          setup:
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
            - "ProductFamily FAM-X launched 2024-01-01, so a 2026-02-01 sale clears the ERR_CONTRACT_PRECEDES_LAUNCH guard."
            - "No other ServiceContract rows exist."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-X", name: "Premium Dishwasher Platform", launch_date: "2024-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 19000, reserve_cap_cents: 50000000 }
              as: WarrantyAnalyst
              captures: { fam_x_id: $.data.id }
            - call: "POST /warranty/service-contracts"
              payload: { family_id: "${fam_x_id}", contract_number: "ESC-X-0001", sold_date: "2026-02-01", term_months: 24, total_contract_price_cents: 480000, recognition_method: "STRAIGHT_LINE" }
              as: WarrantyAnalyst
              captures: { esc_x_id: $.data.id }
          trigger:
            - call: "POST /warranty/_clock/set_current_utc"
              payload: { to_iso8601: "2027-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /warranty/service-contracts/${esc_x_id}/cancel"
              payload: {}
              as: WarrantyAnalyst
            - call: "POST /warranty/_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
          assert:
            - "At creation (clock 2026-08-01): ServiceContract.${esc_x_id}.months_elapsed == 6, recognized_revenue_cents == 120000, deferred_revenue_cents == 360000, refunded_revenue_cents == 0, status == ACTIVE"
            - "Identity at creation: 120000 + 360000 + 0 == 480000"
            - "After the first trigger call (clock 2027-02-01): months_elapsed == 12, recognized_revenue_cents == 240000, deferred_revenue_cents == 240000, refunded_revenue_cents == 0, status == ACTIVE"
            - "Identity after the clock move: 240000 + 240000 + 0 == 480000"
            - "After the second trigger call: status == CANCELLED, refunded_revenue_cents == 240000, deferred_revenue_cents == 0, recognized_revenue_cents == 240000, cancelled_at == \"2027-02-01T00:00:00Z\""
            - "Identity after cancellation: 240000 + 0 + 240000 == 480000"
            - "After the third trigger call: recognized_revenue_cents is still 240000, months_elapsed is still 12, deferred_revenue_cents == 0, refunded_revenue_cents == 240000 and status is still CANCELLED (a CANCELLED contract is not re-recognized and does not auto-EXPIRE)"
            - "Identity after the final clock move: 240000 + 0 + 240000 == 480000"
