        distinguishing_aspect: "The buyer reads the contract version, the wholesaler then re-elects the structure and bumps it, and the buyer's offer carrying the now-stale expected_purchase_contract_version is rejected 412 ERR_STALE_CONTRACT_VERSION before any fiscal rule is evaluated."
