              payload: { cycle_id: "${cycle_id}", item_id: "${item_tight}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
