              as_user_id: "00000000-0000-4000-8000-000000000904"
          assert:
            - "HTTP 404 with error_id == 'ERR_ROUTE_NOT_FOUND'"

      - name: issue_of_an_unknown_statement_returns_statement_not_found
        claim_type: violation_to_error
        grounds:
          - validations[priority=3]
          - errors[ERR_STATEMENT_NOT_FOUND]
        distinguishing_aspect: "Existence beats the segregation-of-duties rule at priority 13: an unknown statement id returns 404 ERR_STATEMENT_NOT_FOUND even when the caller would also have failed the SoD check."
        test_recipe:
          setup:
            - "An empty database apart from the logical clock"
          setup_api_calls:
