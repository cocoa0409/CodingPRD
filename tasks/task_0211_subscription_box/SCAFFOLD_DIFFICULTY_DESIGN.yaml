          assert:
            - "response error_id == ERR_PLAN_RETIRED (422)"
            - "Subscription.${s_id}.lifecycle_status == CANCELLED (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: wave_aggregate_capacity_full_rejects_extra_allocation
        grounds:
          - calculations.allocation_fill
          - validations[priority=11]
          - errors[ERR_WAVE_CAPACITY_FULL]
          - entities.ShippingWave.fields.reserved_count
        distinguishing_aspect: |
          Aggregate-capacity interval semantics on ShippingWave: the wave holds at most `capacity`
          allocation slots; when reserved_count == capacity (capacity=1, already 1 reserved), a second
          allocation collides on aggregate capacity and is rejected ERR_WAVE_CAPACITY_FULL.
        test_recipe:
          setup:
            - "Wave W capacity=1 already holding one RESERVED allocation. A second curated box tries to join."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "TO1", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
              as: CurationAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /products"
              payload: { sku: "TO1P", name: "TO1 P", on_hand_qty: 9 }
              as: CurationAdmin
              captures: { p_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "to1a@x.com", full_name: "TO1 A" }
              as: Subscriber
              captures: { a1_acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${a1_acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${a1_acct}"
              captures: { sub1_id: $.data.id }
            - call: "POST /subscriptions/${sub1_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${a1_acct}"
              captures: { box1_id: $.data.id }
            - call: "POST /subscribers"
              payload: { email: "to1b@x.com", full_name: "TO1 B" }
              as: Subscriber
              captures: { a2_acct: $.data.id }
            - call: "POST /subscriptions"
              payload: { subscriber_id: "${a2_acct}", plan_id: "${plan_id}" }
              as: Subscriber
              as_user_id: "${a2_acct}"
              captures: { sub2_id: $.data.id }
            - call: "POST /subscriptions/${sub2_id}/box-selections"
              payload: { period_index: 2, product_ids: ["${p_id}"] }
              as: Subscriber
              as_user_id: "${a2_acct}"
              captures: { box2_id: $.data.id }
            - call: "POST /waves"
              payload: { cadence: "MONTHLY", cutoff_at: "2026-06-15T00:00:00Z", ship_date: "2026-06-16T00:00:00Z", capacity: 1 }
              as: CurationAdmin
              captures: { wave_id: $.data.id, wave_ver0: $.data.version }
            - call: "POST /allocations"
              payload: { subscription_id: "${sub1_id}", wave_id: "${wave_id}", box_selection_id: "${box1_id}", expected_wave_version: "${wave_ver0}" }
              as: CurationAdmin
              captures: { alloc1_id: $.data.id, wave_ver1: $.data.version }
          trigger:
            - call: "POST /allocations"
              payload: { subscription_id: "${sub2_id}", wave_id: "${wave_id}", box_selection_id: "${box2_id}", expected_wave_version: "${wave_ver1}" }
              as: CurationAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_WAVE_CAPACITY_FULL (422)"
            - "ShippingWave.${wave_id}.reserved_count == 1 (unchanged)"
            - "Product.${p_id}.allocated_qty == 1 (second box not reserved)"

      - name: box_period_point_exclusivity_rejects_double_allocation
        grounds:
          - validations[priority=8]
          - errors[ERR_BOX_ALREADY_FINALIZED]
          - entities.BoxSelection.fields.allocation_id
          - entities.BoxSelection.fields.decision
        distinguishing_aspect: |
          Point-exclusivity interval semantics on a DIFFERENT resource (a Subscription's box-period slot):
          a BoxSelection already FINALIZED into one wave (allocation_id set) cannot be allocated again into
          a second wave — the unit period-slot is singly-occupied, rejected ERR_BOX_ALREADY_FINALIZED.
          Different interval arithmetic (unit point exclusivity) and different resource than wave capacity.
        test_recipe:
          setup:
            - "Box B FINALIZED into wave W1 (allocation_id set, decision FINALIZED). A fresh OPEN wave W2 with ample capacity exists. Re-allocate B into W2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: CurationAdmin
            - call: "POST /plans"
              payload: { name: "TO2", cadence: "MONTHLY", period_price_cents: 6000, box_item_count: 1 }
