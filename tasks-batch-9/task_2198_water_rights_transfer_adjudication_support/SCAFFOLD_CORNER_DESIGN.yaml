            - "After protest E resolves: offset_af 9.00 == round(5.00 + 4.00, 2) and net_injury_af 69.00. The values 17.00 (folding in the hearing claim) and 4.00 (last-write-wins instead of a sum) must NOT appear."
            - "gross_depletion_af is unchanged at 78.00 throughout — only the offset leg moves."
            - "E was the fourth and last clearance, so the application is READY_FOR_DECISION, unresolved_protest_count 0, and the analysis is FINALIZED with offset_af frozen at 9.00."

