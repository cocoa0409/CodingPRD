          - entities.UnitOrder.fields.locked_option_versions
        distinguishing_aspect: "The DRAFT -> CONFIG_VALIDATED trigger does four things at once: it re-runs the configuration totals, writes provisional_invoice_cents 6620350, pins locked_floor_plan_version 1 together with one locked_option_versions entry carrying the option's version 1 and price_cents 100000, and leaves final_invoice_cents null."
