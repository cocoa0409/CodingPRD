            - "po1_rate == 500"
            - "PurchaseOrder.${po1_id}.total_cents == 500000"
            - "b1_ytd == 15500000 (9,000,000 + 500,000 + 6,000,000 from the booster PO accepted before PO1 closed)"
            - "po1_status == 'CLOSED' and po1_rate2 == 400"
            - "po1_final == 20000 (4% at close; identical PO data, divergent variant result: provisional 25,000 vs final 20,000)"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (mode (a) tiered/multi-input vs mode (b) rounding order)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: commission_cif_cap_binds_over_tier_rate
        grounds:
          - calculations.commission
          - entities.PurchaseOrder.fields.commission_rate_bp
        distinguishing_aspect: |
          Mode (a) multi-input interaction: tier rate (5% at this GMV) applied
          to the CIF base (goods 100,000 + freight 300,000 + insurance 0 =
          400,000) yields 20,000, but the CIF cap (12% of goods = 12,000)
          binds, so commission = 12,000 — a nested min() across tier, mode,
          and cap that the FOB mode (5,000) on identical goods does not hit.
        test_recipe:
          setup:
            - "Buyer b2 (fresh, ytd_gmv = 0), agent a1, factory f1 grade-A approved, posture COMPLIANT"
            - "SR with commission_mode CIF; quotation q2 at 10,000 cents/unit, moq 1, valid_until 2027-01-01"
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer Two", country_code: "US" }
              as: PlatformAdmin
              captures: { b2_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
              captures: { a1_id: "$.data.id" }
            - call: "POST /sourcing/factories"
              payload: { name: "Factory One", country_code: "CN", monthly_capacity_units: 100000 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { f1_id: "$.data.id" }
            - call: "POST /sourcing/factories/${f1_id}/audits"
              payload: { audit_type: "ONSITE", quality_system_score: 95, social_compliance_score: 92, production_capability_score: 90, financial_stability_score: 88, critical_findings: 0 }
              as: SourcingAgent
              as_user_id: "${a1_id}"
              captures: { au1_id: "$.data.id" }
            - call: "POST /sourcing/audits/${au1_id}/approve"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /sourcing/sourcing-requests"
              payload: { assigned_agent_id: "${a1_id}", title: "CIF goods", product_category: "APPAREL", target_price_cents: 10000, quantity: 10, commission_mode: "CIF" }
              as: BuyerManager
              as_user_id: "${b2_id}"
              captures: { sr2_id: "$.data.id" }
            - call: "POST /sourcing/sourcing-requests/${sr2_id}/quotations"
              payload: { unit_price_cents: 10000, moq: 1, lead_time_days: 30, valid_until: "2027-01-01T00:00:00Z" }
              as: FactoryRep
              as_user_id: "${f1_id}"
              captures: { q2_id: "$.data.id", q2_v: "$.data.version" }
          trigger:
            - call: "POST /sourcing/quotations/${q2_id}/accept"
              payload: { ordered_qty: 10, delivery_month: "2026-09", expected_quotation_version: "${q2_v}", freight_cents: 300000, insurance_cents: 0 }
              as: BuyerManager
              as_user_id: "${b2_id}"
              captures: { po2_id: "$.data.id", po2_prov: "$.data.provisional_commission_cents", po2_rate: "$.data.commission_rate_bp" }
          assert:
            - "PurchaseOrder.${po2_id}.total_cents == 100000"
            - "po2_rate == 500 (tier basis 100,000 < 10,000,000)"
            - "po2_prov == 12000 (min(5% * 400,000 = 20,000, 12% * 100,000 = 12,000))"

      - name: chargeback_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.chargeback
          - entities.QualityClaim.fields.penalty_cents
          - entities.QualityClaim.fields.total_chargeback_cents
        distinguishing_aspect: |
          Mode (b) rounding order: three claim lines of 333, 333, 334 cents at
          the 5% penalty tier (defect_rate 3/25 = 0.1200 > 0.10) round each
          line half-up to 17 + 17 + 17 = 51; the forbidden sum-then-round
          order would give round(1000 * 0.05) = 50. The scaffold pins
          per-line-then-sum, so total_chargeback_cents == 1051, not 1050.
        test_recipe:
          setup:
            - "Buyer b1, agents a1 (PO assigned) and a2 (adjudicator), factory f1 grade-A, COMPLIANT"
            - "PO p1: ordered_qty 25 @ 400 cents = 10,000 total, month 2026-09; fully milestone-complete, PSI passed, shipped 25, docs handed over, receipt confirmed (PO CLOSED)"
            - "Claim c1 on p1 with items [{d:1@333},{d:1@333},{d:1@334}] (defective_qty 3, defect_rate 0.1200)"
          setup_api_calls:
            - call: "POST /sourcing/buyers"
              payload: { name: "Buyer One", country_code: "US" }
              as: PlatformAdmin
              captures: { b1_id: "$.data.id" }
            - call: "POST /sourcing/agents"
              payload: { name: "Agent One", agency_name: "AgencyCo" }
              as: PlatformAdmin
