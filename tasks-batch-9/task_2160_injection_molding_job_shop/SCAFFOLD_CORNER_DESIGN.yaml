        distinguishing_aspect: "good_parts + scrap_parts must equal shots * cavity_count exactly (1000 * 4 = 4000), so 3900 + 50 is refused with 422 ERR_PARTS_BALANCE_MISMATCH; a scrap count below short_shot_shots * cavity_count is refused by the same rule."
