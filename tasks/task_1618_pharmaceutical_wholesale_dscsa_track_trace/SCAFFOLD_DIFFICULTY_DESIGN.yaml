scaffold_difficulty_design:
  # ===================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: order_pricing_provisional_vs_final_invoice
        grounds:
          - calculations.order_line_pricing
          - state_machines.PurchaseOrder.DRAFT_to_CONFIRMED
          - state_machines.PurchaseOrder.CONFIRMED_to_CONFIRMED
        distinguishing_aspect: |
          Same order, same lines, same prices: the provisional variant at CONFIRMED
          prices lines by quantity_requested (invoice 70000 cents) while the final
          variant after allocation prices by quantity_allocated (invoice 42000
          cents under a shortage granting 6 of 10 units) — two valid algorithms
          over identical input data producing different invoice totals on the
          PurchaseOrder domain.
        test_recipe:
          setup:
            - "Customer C1 with ACTIVE FULL license for CA and credit_limit 100000000"
            - "Product P340B: WAC 10000, 340B contract 7000, is_340b_contracted=true, shortage_status SHORTAGE"
            - "AllocationPolicy for P340B: pool 6, PRO_RATA, min_guarantee 0 (only this order competes)"
            - "Order O (is_340b_order=true) with one line qty_requested 10, CONFIRMED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "C1 Pharmacy", partner_kind: "CUSTOMER", dea_number: "AC1234567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_id: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_id}", state_code: "CA", license_number: "LIC-CA-1", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000001", product_name: "DrugA", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 10000, is_340b_contracted: true, contract_340b_price_cents: 7000 }
              as: OrderManager
              captures: { prod_id: $.data.id }
            - call: "POST /wholesale/products/${prod_id}/declare-shortage"
              payload: {}
              as: OrderManager
            - call: "POST /wholesale/allocation-policies"
              payload: { product_id: "${prod_id}", pool_units: 6, policy_mode: "PRO_RATA", min_guarantee_units: 0 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_id}", ship_to_state: "CA", is_340b_order: true }
              as: OrderManager
              captures: { order_id: $.data.id, order_v0: $.data.version }
            - call: "POST /wholesale/purchase-orders/${order_id}/lines"
              payload: { product_id: "${prod_id}", quantity_requested: 10 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${order_id}/confirm"
              payload: {}
              as: OrderManager
              captures: { order_v1: $.data.version }
          trigger:
            - call: "POST /wholesale/purchase-orders/${order_id}/allocate"
              payload: { expected_order_version: "${order_v1}" }
              as: OrderManager
              captures: { final_total: $.data.invoice_total_cents }
          assert:
            - "GET /wholesale/purchase-orders/${order_id} before allocate shows invoice_total_cents == 70000 (provisional: 10 * 7000)"
            - "final_total == 42000 (final variant: 6 * 7000)"
            - "final_total != 70000 — the two variants diverge on identical line inputs"

      - name: chargeback_gross_vs_net_basis
        grounds:
          - calculations.chargeback_amount
        distinguishing_aspect: |
          ChargebackClaim on the ChargebackClaim entity domain (a different domain
          from PurchaseOrder invoicing): under the gross basis (full allocation)
          computed_amount_cents == 30000 for a 10-unit line at a 3000-cent WAC-to-
          contract delta; under the net basis after a shortage allocation of 6 the
          identical claim input yields computed_amount_cents == 18000 — the same
          claimed amount matches under one variant and mismatches under the other.
        test_recipe:
          setup:
            - "Two fully-parallel setups, both with C1-style customers holding FULL CA licenses"
            - "Setup G (gross): product WAC 10000 / contract 7000, no shortage, line qty 10, order CONFIRMED then allocated (NORMAL shortage -> full allocation) then order allocated: quantity_allocated == 10"
            - "Setup N (net): identical product (different ndc) declared SHORTAGE with a PRO_RATA pool of 6, line qty 10 -> quantity_allocated == 6"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "CG Pharmacy", partner_kind: "CUSTOMER", dea_number: "AC1234568", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_g: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_g}", state_code: "CA", license_number: "LIC-CA-G", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000002", product_name: "DrugG", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 10000, is_340b_contracted: true, contract_340b_price_cents: 7000 }
              as: OrderManager
              captures: { prod_g: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_g}", ship_to_state: "CA", is_340b_order: true }
              as: OrderManager
              captures: { order_g: $.data.id }
            - call: "POST /wholesale/purchase-orders/${order_g}/lines"
              payload: { product_id: "${prod_g}", quantity_requested: 10 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${order_g}/confirm"
              payload: {}
              as: OrderManager
              captures: { order_g_v: $.data.version }
            - call: "POST /wholesale/purchase-orders/${order_g}/allocate"
              payload: { expected_order_version: "${order_g_v}" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "CN Pharmacy", partner_kind: "CUSTOMER", dea_number: "AC1234569", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_n: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_n}", state_code: "CA", license_number: "LIC-CA-N", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000003", product_name: "DrugN", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 10000, is_340b_contracted: true, contract_340b_price_cents: 7000 }
              as: OrderManager
              captures: { prod_n: $.data.id }
            - call: "POST /wholesale/products/${prod_n}/declare-shortage"
              payload: {}
              as: OrderManager
            - call: "POST /wholesale/allocation-policies"
              payload: { product_id: "${prod_n}", pool_units: 6, policy_mode: "PRO_RATA", min_guarantee_units: 0 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_n}", ship_to_state: "CA", is_340b_order: true }
              as: OrderManager
              captures: { order_n: $.data.id }
            - call: "POST /wholesale/purchase-orders/${order_n}/lines"
              payload: { product_id: "${prod_n}", quantity_requested: 10 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${order_n}/confirm"
              payload: {}
              as: OrderManager
              captures: { order_n_v: $.data.version }
            - call: "POST /wholesale/purchase-orders/${order_n}/allocate"
              payload: { expected_order_version: "${order_n_v}" }
              as: OrderManager
          trigger:
            - call: "POST /wholesale/chargeback-claims"
              payload: { order_id: "${order_g}", claimed_amount_cents: 30000 }
              as: ContractAdministrator
              captures: { claim_g: $.data.id, computed_g: $.data.computed_amount_cents }
            - call: "POST /wholesale/chargeback-claims"
              payload: { order_id: "${order_n}", claimed_amount_cents: 18000 }
              as: ContractAdministrator
              captures: { claim_n: $.data.id, computed_n: $.data.computed_amount_cents }
          assert:
            - "computed_g == 30000 (gross basis: (10000-7000) * 10)"
            - "computed_n == 18000 (net basis: (10000-7000) * 6)"
            - "computed_g != computed_n despite identical WAC, contract price, and requested quantity"

  # ===================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pro_rata_allocation_tiered_formula
        grounds:
          - calculations.shortage_allocation
        distinguishing_aspect: |
          Mode (a): a >=3-input non-linear formula — min-guarantee floor, floor-
          division pro-rata share, and a 3-way min(grant, requested, remaining)
          cap interact: pool 100 with min_guarantee 2 and competing demands 30/70
          yields grants 30 and 69 (not 30/70), leaving 1 unit stranded.
        test_recipe:
          setup:
            - "Product S in SHORTAGE with PRO_RATA policy pool=100, min_guarantee=2"
            - "Customer A order CONFIRMED with line qty 30; Customer B order CONFIRMED with line qty 70 (both FULL CA licenses, high credit limits)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "PA Pharmacy", partner_kind: "CUSTOMER", dea_number: "AC2234567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_a: $.data.id }
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "PB Pharmacy", partner_kind: "CUSTOMER", dea_number: "AC2234568", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_b: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_a}", state_code: "CA", license_number: "LIC-A", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_b}", state_code: "CA", license_number: "LIC-B", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000011", product_name: "DrugS", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_s: $.data.id }
            - call: "POST /wholesale/products/${prod_s}/declare-shortage"
              payload: {}
              as: OrderManager
            - call: "POST /wholesale/allocation-policies"
              payload: { product_id: "${prod_s}", pool_units: 100, policy_mode: "PRO_RATA", min_guarantee_units: 2 }
              as: OrderManager
              captures: { pol_s: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_a}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_a: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_a}/lines"
              payload: { product_id: "${prod_s}", quantity_requested: 30 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_a}/confirm"
              payload: {}
              as: OrderManager
              captures: { ord_a_v: $.data.version }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_b}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_b: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_b}/lines"
              payload: { product_id: "${prod_s}", quantity_requested: 70 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_b}/confirm"
              payload: {}
              as: OrderManager
              captures: { ord_b_v: $.data.version }
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_a}/allocate"
              payload: { expected_order_version: "${ord_a_v}" }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_b}/allocate"
              payload: { expected_order_version: "${ord_b_v}" }
              as: OrderManager
          assert:
            - "Order ${ord_a} line quantity_allocated == 30 (min_guarantee 2 + floor(96 * 30/100) = 30, capped at requested 30)"
            - "Order ${ord_b} line quantity_allocated == 69 (min_guarantee 2 + floor(96 * 70/100) = 69)"
            - "AllocationPolicy ${pol_s}.remaining_units == 1 (100 - 30 - 69)"
            - "Order ${ord_a}.fulfillment_status == ALLOCATED"
            - "Order ${ord_b} line line_status == PARTIALLY_ALLOCATED"

      - name: return_credit_nested_rounding_order
        grounds:
          - calculations.return_credit
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the pinned order
          floor(quantity_returned * per_unit * rate) yields 14998 for qty 3,
          per_unit 9999, cold-chain rate 0.50, whereas the alternative
          quantity * floor(per_unit * rate) yields 14997; the scaffold pins the
          former, a one-cent divergence on identical inputs.
        test_recipe:
          setup:
            - "Cold-chain product COLD: WAC 9999 (not 340B), not shortage"
            - "Customer with FULL CA license; order with line qty 3, CONFIRMED, ALLOCATED (full), SHIPPED with segregation_mode COLD_CHAIN, DELIVERED at clock 2026-08-01"
            - "Clock advanced to 2026-08-02 (1 day since delivery, within 48h cold window and <=2-day cold restock window)"
            - "ReturnAuthorization for qty 3 created and RECEIVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "ColdRx", partner_kind: "CUSTOMER", dea_number: "AC3234567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_c: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_c}", state_code: "CA", license_number: "LIC-C", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000012", product_name: "DrugCold", is_controlled: false, is_cold_chain: true, wholesale_acquisition_cost_cents: 9999, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_c: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_c}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_c: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_c}/lines"
              payload: { product_id: "${prod_c}", quantity_requested: 3 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_c}/confirm"
              payload: {}
              as: OrderManager
              captures: { ord_c_v1: $.data.version }
            - call: "POST /wholesale/purchase-orders/${ord_c}/allocate"
              payload: { expected_order_version: "${ord_c_v1}" }
              as: OrderManager
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-COLD-1", product_id: "${prod_c}", lot_number: "LC", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_cold: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_c}/ship"
              payload: { segregation_mode: "COLD_CHAIN", case_ids: ["${case_cold}"] }
              as: WarehouseOperator
            - call: "POST /wholesale/purchase-orders/${ord_c}/deliver"
              payload: {}
              as: WarehouseOperator
            - call: "POST /wholesale/return-authorizations"
              payload: { order_id: "${ord_c}", product_id: "${prod_c}", quantity_returned: 3 }
              as: OrderManager
              captures: { ret_c: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/return-authorizations/${ret_c}/receive"
              payload: {}
              as: WarehouseOperator
          trigger:
            - call: "POST /wholesale/return-authorizations/${ret_c}/credit"
              payload: {}
              as: BillingClerk
              captures: { credit_amt: $.data.credit_amount_cents }
          assert:
            - "credit_amt == 14998 (floor(3 * 9999 * 0.50), pinned rounding order)"
            - "credit_amt != 14997 (the per-unit-first rounding order is rejected)"
            - "ReturnAuthorization ${ret_c}.return_status == CREDITED"

  # ===================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: investigation_clear_reopen_cycle
        grounds:
          - state_machines.SuspectInvestigation.OPEN_to_QUARANTINED
          - state_machines.SuspectInvestigation.QUARANTINED_to_CLEARED
          - state_machines.SuspectInvestigation.CLEARED_to_OPEN
        distinguishing_aspect: |
          SuspectInvestigation is cyclic: OPEN -> QUARANTINED -> CLEARED -> OPEN
          loops with reopen_count incrementing per lap and a hard cap at 3 —
          not a linear pipeline; the cycle is exercised by two full laps.
        test_recipe:
          setup:
            - "Serialized case K (COMMISSIONED) on a normal product; investigation I opened on K"
            - "QA user qa-1 quarantines; a different QA user qa-2 clears (segregation of duties)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000021", product_name: "DrugQ", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_q: $.data.id }
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-Q-1", product_id: "${prod_q}", lot_number: "LOT1", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_q: $.data.id }
            - call: "POST /wholesale/suspect-investigations"
              payload: { case_id: "${case_q}", opened_reason: "suspect serial drift" }
              as: QualityAssuranceLead
              as_user_id: qa-opener-1
              captures: { inv_q: $.data.id }
            - call: "POST /wholesale/suspect-investigations/${inv_q}/quarantine"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-opener-1
            - call: "POST /wholesale/suspect-investigations/${inv_q}/clear"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-reviewer-2
          trigger:
            - call: "POST /wholesale/suspect-investigations/${inv_q}/reopen"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-opener-1
              captures: { inv_after: $.data.reopen_count }
          assert:
            - "SuspectInvestigation ${inv_q}.investigation_status == OPEN (cycle back to the initial state)"
            - "inv_after == 1"
            - "SerializedCase ${case_q}.case_status != QUARANTINED after the clear (released per release rule)"

      - name: purchase_order_parallel_dimensions
        grounds:
          - state_machines.PurchaseOrder.CONFIRMED_to_SHIPPED
          - state_machines.PurchaseOrder.INVOICED_to_PARTIALLY_PAID
        distinguishing_aspect: |
          PurchaseOrder carries two independent state axes — fulfillment_status
          (CONFIRMED -> SHIPPED) and financial_status (INVOICED -> PARTIALLY_PAID)
          — and a payment interleaved between fulfillment transitions changes only
          the financial axis: an order can be SHIPPED while PARTIALLY_PAID.
        test_recipe:
          setup:
            - "Customer with FULL CA license, product normal, order CONFIRMED with one line qty 4 at 1000 cents (invoice 4000), ALLOCATED via allocate"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "ParRx", partner_kind: "CUSTOMER", dea_number: "AC4234567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_p: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_p}", state_code: "CA", license_number: "LIC-P", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000022", product_name: "DrugPar", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_p: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_p}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_p: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_p}/lines"
              payload: { product_id: "${prod_p}", quantity_requested: 4 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_p}/confirm"
              payload: {}
              as: OrderManager
              captures: { ord_p_v1: $.data.version }
            - call: "POST /wholesale/purchase-orders/${ord_p}/allocate"
              payload: { expected_order_version: "${ord_p_v1}" }
              as: OrderManager
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-P-1", product_id: "${prod_p}", lot_number: "LP", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_p: $.data.id }
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_p}/payments"
              payload: { amount_cents: 1000 }
              as: BillingClerk
            - call: "POST /wholesale/purchase-orders/${ord_p}/ship"
              payload: { segregation_mode: "STANDARD", case_ids: ["${case_p}"] }
              as: WarehouseOperator
          assert:
            - "PurchaseOrder ${ord_p}.fulfillment_status == SHIPPED after the ship call"
            - "PurchaseOrder ${ord_p}.financial_status == PARTIALLY_PAID (payment on the financial axis did not block or alter the fulfillment axis)"
            - "PurchaseOrder ${ord_p}.invoice_balance_cents == 3000"

  # ===================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: confirm_illegitimate_cascade_depth3
        grounds:
          - state_machines.SuspectInvestigation.QUARANTINED_to_CONFIRMED_ILLEGITIMATE
          - state_machines.SerializedCase.QUARANTINED_to_DECOMMISSIONED
        distinguishing_aspect: |
          Depth-3 chain from the confirm-illegitimate trigger: investigation
          transition mutates SerializedCase (case_status -> DECOMMISSIONED); the
          case mutation itself cascades to every QUARANTINED SerializedUnit
          (unit_status -> DECOMMISSIONED); and each hop appends a DECOMMISSION
          EpcisEvent whose txn_history_hash chains onto the prior QUARANTINE
          event — three linked mutations each caused by the previous one.
        test_recipe:
          setup:
            - "Case K2 COMMISSIONED with two aggregated units U1, U2 (both COMMISSIONED)"
            - "Investigation opened by qa-a, quarantined by qa-a (case and units now QUARANTINED; QUARANTINE event appended)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000031", product_name: "DrugC", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_c2: $.data.id }
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-C-1", product_id: "${prod_c2}", lot_number: "L1", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_c2: $.data.id }
            - call: "POST /wholesale/serialized-units"
              payload: { sni: "SNI-C-1", case_id: "${case_c2}" }
              as: WarehouseOperator
              captures: { unit_c1: $.data.id }
            - call: "POST /wholesale/serialized-units"
              payload: { sni: "SNI-C-2", case_id: "${case_c2}" }
              as: WarehouseOperator
              captures: { unit_c2: $.data.id }
            - call: "POST /wholesale/suspect-investigations"
              payload: { case_id: "${case_c2}", opened_reason: "verification failure" }
              as: QualityAssuranceLead
              as_user_id: qa-a
              captures: { inv_c: $.data.id }
            - call: "POST /wholesale/suspect-investigations/${inv_c}/quarantine"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-a
          trigger:
            - call: "POST /wholesale/suspect-investigations/${inv_c}/confirm-illegitimate"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-b
          assert:
            - "SerializedCase ${case_c2}.case_status == DECOMMISSIONED (hop 1)"
            - "SerializedUnit ${unit_c1}.unit_status == DECOMMISSIONED (hop 2, caused by hop 1)"
            - "SerializedUnit ${unit_c2}.unit_status == DECOMMISSIONED (hop 2, caused by hop 1)"
            - "An EPCIS event with event_type == DECOMMISSION exists for case ${case_c2} whose txn_history_hash chains the QUARANTINE event (hop 3)"

      - name: order_cancel_cascade_depth2
        grounds:
          - state_machines.PurchaseOrder.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Depth-2 chain from the cancel trigger (a different trigger than the
          investigation cascade): order CONFIRMED -> CANCELLED mutates the
          financial axis to CREDITED; that financial mutation itself triggers a
          TradingPartner ledger mutation (open_receivable_cents decremented by
          the outstanding balance) — the partner change is caused by the order's
          financial flip, not by the cancel action directly.
        test_recipe:
          setup:
            - "Customer with FULL CA license, order CONFIRMED with one line qty 5 at 2000 cents (invoice 10000); open_receivable_cents == 10000"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "CasRx", partner_kind: "CUSTOMER", dea_number: "AC5234567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_x: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_x}", state_code: "CA", license_number: "LIC-X", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000032", product_name: "DrugX", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 2000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_x: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_x}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_x: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_x}/lines"
              payload: { product_id: "${prod_x}", quantity_requested: 5 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_x}/confirm"
              payload: {}
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_x}/cancel"
              payload: {}
              as: OrderManager
          assert:
            - "PurchaseOrder ${ord_x}.fulfillment_status == CANCELLED (hop 0)"
            - "PurchaseOrder ${ord_x}.financial_status == CREDITED (hop 1, caused by the cancel)"
            - "PurchaseOrder ${ord_x}.invoice_balance_cents == 0"
            - "TradingPartner ${cust_x}.open_receivable_cents == 0 (hop 2, caused by the hop-1 CREDITED flip)"

  # ===================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_fiscal_on_confirm
        grounds:
          - validations[priority=5]
          - validations[priority=16]
          - state_machines.PurchaseOrder.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Error-category pair state (priority 5) vs business_fiscal (priority
          16): a re-confirm of an already-CONFIRMED order whose re-invoice
          would also breach the customer's credit limit MUST surface the state
          error (ERR_ORDER_NOT_DRAFT), because state checks run strictly before
          fiscal checks; the control leg shows the fiscal error firing when
          state is clean.
        test_recipe:
          setup:
            - "Customer with credit_limit_cents == 4000 and FULL CA license"
            - "Order A with one line 4 x 1000 = 4000, CONFIRMED (receivable now 4000, exactly at limit)"
            - "Order B on the same customer with one line 1 x 1000, still DRAFT"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "DualRx", partner_kind: "CUSTOMER", dea_number: "AC6234567", credit_limit_cents: 4000 }
              as: OrderManager
              captures: { cust_d: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_d}", state_code: "CA", license_number: "LIC-D", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000041", product_name: "DrugD", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_d: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_d}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_a: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_a}/lines"
              payload: { product_id: "${prod_d}", quantity_requested: 4 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_a}/confirm"
              payload: {}
              as: OrderManager
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_d}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_b: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_b}/lines"
              payload: { product_id: "${prod_d}", quantity_requested: 1 }
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_b}/confirm"
              payload: {}
              as: OrderManager
              captures: { err_fiscal: $.data.error_id }
            - call: "POST /wholesale/purchase-orders/${ord_a}/confirm"
              payload: {}
              as: OrderManager
              captures: { err_dual: $.data.error_id }
          assert:
            - "err_fiscal == ERR_CREDIT_LIMIT_EXCEEDED (clean state, fiscal breach: projected 5000 > 4000)"
            - "err_dual == ERR_ORDER_NOT_DRAFT (order A is CONFIRMED; its re-invoice of 4000 would also push the projected receivable over the 4000 limit, but the priority-5 state error wins over the priority-16 fiscal error)"
            - "PurchaseOrder ${ord_b}.fulfillment_status == DRAFT (fiscal rejection leaves state untouched)"

      - name: safety_vs_referential_on_ship_and_claim
        grounds:
          - validations[priority=7]
          - validations[priority=13]
        distinguishing_aspect: |
          Error-category pair business_safety (priority 7) vs
          business_referential (priority 13) — a different pair from
          state-vs-fiscal: a ship request on an order whose case is under an
          OPEN investigation AND a chargeback validate whose claimed amount
          mismatches; the safety rejection (ERR_PRODUCT_UNDER_INVESTIGATION)
          precedes any referential reconciliation of downstream claims.
        test_recipe:
          setup:
            - "340B order CONFIRMED+ALLOCATED with a line 6 x (10000-7000 delta), computed chargeback 18000, claim SUBMITTED with wrong claimed_amount_cents 99999"
            - "A serialized case bound to the order is placed under an OPEN SuspectInvestigation"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "SafeRx", partner_kind: "CUSTOMER", dea_number: "AC7234567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_s: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_s}", state_code: "CA", license_number: "LIC-S", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000042", product_name: "DrugS2", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 10000, is_340b_contracted: true, contract_340b_price_cents: 7000 }
              as: OrderManager
              captures: { prod_s2: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_s}", ship_to_state: "CA", is_340b_order: true }
              as: OrderManager
              captures: { ord_s: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_s}/lines"
              payload: { product_id: "${prod_s2}", quantity_requested: 6 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_s}/confirm"
              payload: {}
              as: OrderManager
              captures: { ord_s_v: $.data.version }
            - call: "POST /wholesale/purchase-orders/${ord_s}/allocate"
              payload: { expected_order_version: "${ord_s_v}" }
              as: OrderManager
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-S-1", product_id: "${prod_s2}", lot_number: "LS", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_s: $.data.id }
            - call: "POST /wholesale/suspect-investigations"
              payload: { case_id: "${case_s}", opened_reason: "suspect" }
              as: QualityAssuranceLead
              as_user_id: qa-s
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_s}/ship"
              payload: { segregation_mode: "STANDARD", case_ids: ["${case_s}"] }
              as: WarehouseOperator
              captures: { err_ship: $.data.error_id }
            - call: "POST /wholesale/chargeback-claims"
              payload: { order_id: "${ord_s}", claimed_amount_cents: 99999 }
              as: ContractAdministrator
              captures: { claim_s: $.data.id }
            - call: "POST /wholesale/chargeback-claims/${claim_s}/validate"
              payload: {}
              as: ContractAdministrator
              captures: { err_claim: $.data.error_id }
          assert:
            - "err_ship == ERR_PRODUCT_UNDER_INVESTIGATION (business_safety at priority 7)"
            - "err_claim == ERR_CHARGEBACK_AMOUNT_MISMATCH (business_referential at priority 13)"
            - "The safety check fires on ship even though the order is otherwise shippable, and the referential check independently fires on claim validation — the two error categories are exercised as a pair with distinct endpoints"

  # ===================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: credit_limit_at_exactly_limit_passes
        grounds:
          - validations[priority=16]
          - state_machines.PurchaseOrder.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Numeric threshold boundary on the credit metric via the confirm
          endpoint: projected open receivable exactly == credit_limit_cents
          passes (rule is <=), while one cent over fails — >= vs > precision.
        test_recipe:
          setup:
            - "Customer with credit_limit_cents == 4000, FULL CA license"
            - "Order A with line 4 x 1000 = 4000 (exactly at limit)"
            - "Second order B on same customer with line 1 x 1000 (projected 5000 > 4000)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "EdgeRx", partner_kind: "CUSTOMER", dea_number: "AC8234567", credit_limit_cents: 4000 }
              as: OrderManager
              captures: { cust_e: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_e}", state_code: "CA", license_number: "LIC-E", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000051", product_name: "DrugE", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_e: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_e}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_e1: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_e1}/lines"
              payload: { product_id: "${prod_e}", quantity_requested: 4 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_e}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_e2: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_e2}/lines"
              payload: { product_id: "${prod_e}", quantity_requested: 1 }
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_e1}/confirm"
              payload: {}
              as: OrderManager
              captures: { conf_e1: $.data.fulfillment_status }
            - call: "POST /wholesale/purchase-orders/${ord_e2}/confirm"
              payload: {}
              as: OrderManager
              captures: { err_e2: $.data.error_id }
          assert:
            - "conf_e1 == CONFIRMED (projected receivable 4000 <= limit 4000 — the boundary value passes)"
            - "err_e2 == ERR_CREDIT_LIMIT_EXCEEDED (projected 5000 > 4000)"

      - name: reopen_limit_zero_remaining_rejects
        grounds:
          - state_machines.SuspectInvestigation.CLEARED_to_OPEN
        distinguishing_aspect: |
          Empty-collection/zero-count boundary on the reopen-count metric via
          the reopen endpoint: reopen succeeds while reopen_count < 3 (third
          reopen at count 2 passes), and fails at count == 3 — a zero-remaining
          budget edge distinct from the numeric credit threshold.
        test_recipe:
          setup:
            - "Case and investigation cycled OPEN->QUARANTINED->CLEARED->OPEN three times (reopen_count == 3), with segregation of duties honored by alternating QA users"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000052", product_name: "DrugR", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_r: $.data.id }
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-R-1", product_id: "${prod_r}", lot_number: "LR", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_r: $.data.id }
            - call: "POST /wholesale/suspect-investigations"
              payload: { case_id: "${case_r}", opened_reason: "suspect" }
              as: QualityAssuranceLead
              as_user_id: qa-1
              captures: { inv_r: $.data.id }
            - call: "POST /wholesale/suspect-investigations/${inv_r}/quarantine"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-1
            - call: "POST /wholesale/suspect-investigations/${inv_r}/clear"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-2
            - call: "POST /wholesale/suspect-investigations/${inv_r}/reopen"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-1
            - call: "POST /wholesale/suspect-investigations/${inv_r}/quarantine"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-2
            - call: "POST /wholesale/suspect-investigations/${inv_r}/clear"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-1
            - call: "POST /wholesale/suspect-investigations/${inv_r}/reopen"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-2
            - call: "POST /wholesale/suspect-investigations/${inv_r}/quarantine"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-1
            - call: "POST /wholesale/suspect-investigations/${inv_r}/clear"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-2
            - call: "POST /wholesale/suspect-investigations/${inv_r}/reopen"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-1
              captures: { rc3: $.data.reopen_count }
          trigger:
            - call: "POST /wholesale/suspect-investigations/${inv_r}/quarantine"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-2
            - call: "POST /wholesale/suspect-investigations/${inv_r}/clear"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-1
            - call: "POST /wholesale/suspect-investigations/${inv_r}/reopen"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-2
              captures: { err_reopen: $.data.error_id }
          assert:
            - "rc3 == 3 (third reopen succeeded at count 2 -> 3)"
            - "err_reopen == ERR_REOPEN_LIMIT_REACHED (fourth reopen at count == 3 hits the zero-remaining boundary)"

  # ===================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: order_confirm_depends_on_license_state
        grounds:
          - state_machines.PurchaseOrder.DRAFT_to_CONFIRMED
          - state_machines.PartnerStateLicense.ACTIVE_to_SUSPENDED
          - validations[priority=6]
        distinguishing_aspect: |
          PurchaseOrder -> PartnerStateLicense pair: confirm is gated on the
          customer's license being ACTIVE for ship_to_state; suspending the
          license (a different entity's transition) flips the order's confirm
          from success to ERR_LICENSE_VERIFICATION_FAILED with no change to the
          order itself.
        test_recipe:
          setup:
            - "Customer with ACTIVE CA license; DRAFT order with one line"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "LicRx", partner_kind: "CUSTOMER", dea_number: "AC9234567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_lic: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_lic}", state_code: "CA", license_number: "LIC-LIC", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000061", product_name: "DrugLic", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_lic: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_lic}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_lic: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_lic}/lines"
              payload: { product_id: "${prod_lic}", quantity_requested: 2 }
              as: OrderManager
            - call: "POST /wholesale/partner-state-licenses/${lic_id}/suspend"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_lic}/confirm"
              payload: {}
              as: OrderManager
              captures: { err_lic: $.data.error_id }
          assert:
            - "err_lic == ERR_LICENSE_VERIFICATION_FAILED (license SUSPENDED flips confirm to rejection)"
            - "PurchaseOrder ${ord_lic}.fulfillment_status == DRAFT (unchanged)"

      - name: ship_blocked_by_investigation_state
        grounds:
          - state_machines.PurchaseOrder.ALLOCATED_to_SHIPPED
          - state_machines.SuspectInvestigation.OPEN_to_QUARANTINED
          - validations[priority=7]
        distinguishing_aspect: |
          PurchaseOrder -> SuspectInvestigation pair (a different pair than
          order->license): an ALLOCATED order cannot ship while any bound case
          has an OPEN or QUARANTINED investigation; clearing the investigation
          (SuspectInvestigation transition) re-enables the ship transition.
        test_recipe:
          setup:
            - "Order CONFIRMED + ALLOCATED with one line; case K bound to the order's product with an OPEN investigation by qa-1, quarantined by qa-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "ShipRx", partner_kind: "CUSTOMER", dea_number: "AC0934567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_sh: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_sh}", state_code: "CA", license_number: "LIC-SH", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000062", product_name: "DrugShip", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_sh: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_sh}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_sh: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_sh}/lines"
              payload: { product_id: "${prod_sh}", quantity_requested: 2 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_sh}/confirm"
              payload: {}
              as: OrderManager
              captures: { ord_sh_v: $.data.version }
            - call: "POST /wholesale/purchase-orders/${ord_sh}/allocate"
              payload: { expected_order_version: "${ord_sh_v}" }
              as: OrderManager
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-SH-1", product_id: "${prod_sh}", lot_number: "LSH", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_sh: $.data.id }
            - call: "POST /wholesale/suspect-investigations"
              payload: { case_id: "${case_sh}", opened_reason: "suspect" }
              as: QualityAssuranceLead
              as_user_id: qa-1
              captures: { inv_sh: $.data.id }
            - call: "POST /wholesale/suspect-investigations/${inv_sh}/quarantine"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-1
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_sh}/ship"
              payload: { segregation_mode: "STANDARD", case_ids: ["${case_sh}"] }
              as: WarehouseOperator
              captures: { err_sh: $.data.error_id }
            - call: "POST /wholesale/suspect-investigations/${inv_sh}/clear"
              payload: {}
              as: QualityAssuranceLead
              as_user_id: qa-2
            - call: "POST /wholesale/purchase-orders/${ord_sh}/ship"
              payload: { segregation_mode: "STANDARD", case_ids: ["${case_sh}"] }
              as: WarehouseOperator
              captures: { ship_ok: $.data.fulfillment_status }
          assert:
            - "err_sh == ERR_PRODUCT_UNDER_INVESTIGATION (QUARANTINED investigation blocks ship)"
            - "ship_ok == SHIPPED (the SuspectInvestigation CLEARED transition re-enabled ship without touching the order)"

  # ===================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: license_validity_window_expiry_boundary
        grounds:
          - entities.PartnerStateLicense.fields.valid_to
          - validations[priority=6]
          - state_machines.PartnerStateLicense.SUSPENDED_to_ACTIVE
        distinguishing_aspect: |
          Interval semantics: closed-end validity — confirm requires
          valid_to >= current clock (an order shipping on the exact expiry
          instant is allowed), while reinstate requires clock <= valid_to;
          one second past valid_to, the same license is unusable and
          unreinstatable — closed-interval boundary arithmetic on the license
          resource.
        test_recipe:
          setup:
            - "Customer with CA license valid_to 2026-08-01T12:00:00Z, scope FULL"
            - "DRAFT order; clock at exactly 2026-08-01T12:00:00Z (boundary), then advanced one second past"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "WinRx", partner_kind: "CUSTOMER", dea_number: "AC1134567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_w: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_w}", state_code: "CA", license_number: "LIC-W", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2026-08-01T12:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_w: $.data.id }
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000071", product_name: "DrugW", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_w: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_w}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_w: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_w}/lines"
              payload: { product_id: "${prod_w}", quantity_requested: 1 }
              as: OrderManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_w}/confirm"
              payload: {}
              as: OrderManager
              captures: { conf_w: $.data.fulfillment_status }
            - call: "POST /wholesale/partner-state-licenses/${lic_w}/suspend"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:01Z" }
              as: OrderManager
            - call: "POST /wholesale/partner-state-licenses/${lic_w}/reinstate"
              payload: {}
              as: ComplianceOfficer
              captures: { err_reinstate: $.data.error_id }
          assert:
            - "conf_w == CONFIRMED at the exact valid_to instant (closed interval: valid_to >= clock passes)"
            - "err_reinstate == ERR_LICENSE_EXPIRED one second past valid_to (closed interval end excludes later instants)"

      - name: cold_chain_return_window_48h
        grounds:
          - calculations.return_credit
          - state_machines.ReturnAuthorization.REQUESTED_to_RECEIVED
          - validations[priority=15]
        distinguishing_aspect: |
          Different interval semantics from the license window: an elapsed-
          duration window measured from a delivery timestamp — cold-chain
          returns are receivable when clock - delivery <= 48h and rejected at
          48h + 1s; half-open elapsed-time arithmetic on the order resource,
          not a closed validity interval on a license.
        test_recipe:
          setup:
            - "Cold-chain order DELIVERED at 2026-08-01T00:00:00Z; return requested for the cold product"
            - "First receive attempt at delivery+48h exactly (passes for a second return); main return received at delivery+48h+1s (rejected)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "ColdWin", partner_kind: "CUSTOMER", dea_number: "AC1234560", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_cw: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_cw}", state_code: "CA", license_number: "LIC-CW", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000072", product_name: "DrugCW", is_controlled: false, is_cold_chain: true, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_cw: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_cw}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_cw: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_cw}/lines"
              payload: { product_id: "${prod_cw}", quantity_requested: 2 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_cw}/confirm"
              payload: {}
              as: OrderManager
              captures: { ord_cw_v: $.data.version }
            - call: "POST /wholesale/purchase-orders/${ord_cw}/allocate"
              payload: { expected_order_version: "${ord_cw_v}" }
              as: OrderManager
            - call: "POST /wholesale/serialized-cases"
              payload: { sscc: "SSCC-CW-1", product_id: "${prod_cw}", lot_number: "LCW", expiry_date: "2027-01-01T00:00:00Z" }
              as: WarehouseOperator
              captures: { case_cw: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_cw}/ship"
              payload: { segregation_mode: "COLD_CHAIN", case_ids: ["${case_cw}"] }
              as: WarehouseOperator
            - call: "POST /wholesale/purchase-orders/${ord_cw}/deliver"
              payload: {}
              as: WarehouseOperator
            - call: "POST /wholesale/return-authorizations"
              payload: { order_id: "${ord_cw}", product_id: "${prod_cw}", quantity_returned: 1 }
              as: OrderManager
              captures: { ret_early: $.data.id }
            - call: "POST /wholesale/return-authorizations"
              payload: { order_id: "${ord_cw}", product_id: "${prod_cw}", quantity_returned: 1 }
              as: OrderManager
              captures: { ret_late: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: OrderManager
          trigger:
            - call: "POST /wholesale/return-authorizations/${ret_early}/receive"
              payload: {}
              as: WarehouseOperator
              captures: { recv_ok: $.data.return_status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:01Z" }
              as: OrderManager
            - call: "POST /wholesale/return-authorizations/${ret_late}/receive"
              payload: {}
              as: WarehouseOperator
              captures: { err_late: $.data.error_id }
          assert:
            - "recv_ok == RECEIVED at exactly delivery+48h (elapsed window boundary inclusive)"
            - "err_late == ERR_COLD_RETURN_WINDOW_EXPIRED at delivery+48h+1s"

  # ===================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===================================================================
  - rule_id: compensating_invariant
    instances:
      - name: receivable_confirm_cancel_invariant
        grounds:
          - calculations.open_receivable_balance
          - state_machines.PurchaseOrder.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: TradingPartner.open_receivable_cents. Forward
          action confirm adds invoice_total_cents; the compensating cancel
          (CONFIRMED -> CANCELLED) removes exactly the outstanding balance —
          open_receivable_cents after the pair equals its pre-confirm value,
          pinned as sum of invoice_balance_cents over INVOICED/PARTIALLY_PAID
          orders.
        test_recipe:
          setup:
            - "Customer starts with open_receivable_cents == 0; order with one line 5 x 2000 = 10000 CONFIRMED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "InvRx", partner_kind: "CUSTOMER", dea_number: "AC1334567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_i: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_i}", state_code: "CA", license_number: "LIC-I", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000081", product_name: "DrugI", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 2000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_i: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_i}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_i: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_i}/lines"
              payload: { product_id: "${prod_i}", quantity_requested: 5 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_i}/confirm"
              payload: {}
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_i}/cancel"
              payload: {}
              as: OrderManager
          assert:
            - "TradingPartner ${cust_i}.open_receivable_cents == 0 (confirm added 10000; cancel removed exactly 10000)"
            - "PurchaseOrder ${ord_i}.invoice_balance_cents == 0"
            - "Invariant: open_receivable_cents == sum of invoice_balance_cents over orders with financial_status IN {INVOICED, PARTIALLY_PAID} == 0"

      - name: allocation_pool_cancel_release_invariant
        grounds:
          - calculations.shortage_allocation
          - state_machines.PurchaseOrder.CONFIRMED_to_CANCELLED
          - entities.AllocationPolicy.fields.remaining_units
        distinguishing_aspect: |
          Different conserved quantity: AllocationPolicy pool conservation —
          pool_units == remaining_units + sum(quantity_allocated across
          non-cancelled orders). Allocating 6 of 6 drains remaining_units to 0;
          the compensating cancel of the CONFIRMED allocated order releases the
          units back, restoring remaining_units == 6 — a different invariant
          family (inventory pool) than the monetary receivable.
        test_recipe:
          setup:
            - "Product in SHORTAGE, PRO_RATA policy pool 6, min 0; customer order CONFIRMED with line qty 10, allocated 6 (sole competitor)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OrderManager
            - call: "POST /wholesale/trading-partners"
              payload: { partner_name: "PoolRx", partner_kind: "CUSTOMER", dea_number: "AC1434567", credit_limit_cents: 100000000 }
              as: OrderManager
              captures: { cust_pl: $.data.id }
            - call: "POST /wholesale/partner-state-licenses"
              payload: { partner_id: "${cust_pl}", state_code: "CA", license_number: "LIC-PL", license_scope: "FULL", valid_from: "2026-01-01T00:00:00Z", valid_to: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /wholesale/products"
              payload: { ndc: "00000000082", product_name: "DrugPool", is_controlled: false, is_cold_chain: false, wholesale_acquisition_cost_cents: 1000, is_340b_contracted: false }
              as: OrderManager
              captures: { prod_pl: $.data.id }
            - call: "POST /wholesale/products/${prod_pl}/declare-shortage"
              payload: {}
              as: OrderManager
            - call: "POST /wholesale/allocation-policies"
              payload: { product_id: "${prod_pl}", pool_units: 6, policy_mode: "PRO_RATA", min_guarantee_units: 0 }
              as: OrderManager
              captures: { pol_pl: $.data.id }
            - call: "POST /wholesale/purchase-orders"
              payload: { customer_id: "${cust_pl}", ship_to_state: "CA" }
              as: OrderManager
              captures: { ord_pl: $.data.id }
            - call: "POST /wholesale/purchase-orders/${ord_pl}/lines"
              payload: { product_id: "${prod_pl}", quantity_requested: 10 }
              as: OrderManager
            - call: "POST /wholesale/purchase-orders/${ord_pl}/confirm"
              payload: {}
              as: OrderManager
              captures: { ord_pl_v: $.data.version }
            - call: "POST /wholesale/purchase-orders/${ord_pl}/allocate"
              payload: { expected_order_version: "${ord_pl_v}" }
              as: OrderManager
          trigger:
            - call: "POST /wholesale/purchase-orders/${ord_pl}/cancel"
              payload: {}
              as: OrderManager
          assert:
            - "Before cancel: AllocationPolicy ${pol_pl}.remaining_units == 0 and policy_status == EXHAUSTED"
            - "After cancel: AllocationPolicy ${pol_pl}.remaining_units == 6 and policy_status == OPEN (released units flip EXHAUSTED back to OPEN)"
            - "Invariant: pool_units (6) == remaining_units (6) + sum(quantity_allocated on non-cancelled orders) (0)"
