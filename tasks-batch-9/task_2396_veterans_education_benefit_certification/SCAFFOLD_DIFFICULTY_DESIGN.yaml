  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: student_coe_cycle_with_parallel_account_hold_dimension
        grounds:
          - state_machines.VeteranStudent.coe_status.NOT_SUBMITTED_to_VERIFIED
          - state_machines.VeteranStudent.coe_status.VERIFIED_to_EXPIRED
          - state_machines.VeteranStudent.coe_status.EXPIRED_to_VERIFIED
          - state_machines.VeteranStudent.account_hold_status.NONE_to_REGISTRATION_HOLD
          - state_machines.VeteranStudent.account_hold_status.REGISTRATION_HOLD_to_NONE
          - calculations.student_protection_window
        distinguishing_aspect: |
          The VeteranStudent row is not a pipeline: coe_status re-enters VERIFIED from
          EXPIRED (a true cycle that rewrites coe_verified_on and protected_until from
          2026-10-30 to 2026-12-09), and account_hold_status is a PARALLEL axis on the
          same row that moves NONE -> REGISTRATION_HOLD -> NONE without constraining or
          being constrained by any coe_status transition.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One SCO official and one SUPERVISORY official are ACTIVE."
            - "Student V-1001 exists with coe_status NOT_SUBMITTED and account_hold_status NONE, and has no EnrollmentCertification at all, so the CALC-7 protection predicate is false throughout."
          setup_api_calls:
            - call: "POST /certifying-officials"
              payload: { full_name: "Dana Reyes", email: "dana.reyes@u.edu", official_level: "SCO" }
              as: VaProcessingOffice
              captures: { sco1: $.data.id }
            - call: "POST /certifying-officials"
              payload: { full_name: "Morgan Blake", email: "morgan.blake@u.edu", official_level: "SUPERVISORY" }
              as: VaProcessingOffice
              captures: { sup1: $.data.id }
            - call: "POST /veteran-students"
              payload: { student_number: "V-1001", full_name: "Alex Rivera", chapter: "CH33", benefit_level_pct: 100, entitlement_days_granted: 1080, delimiting_date: "2030-06-30" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
              captures: { stu1: $.data.id }
          trigger:
            - call: "POST /veteran-students/${stu1}/verify-coe"
              payload: { coe_issued_on: "2026-07-15", verified_document_reference: "COE-2026-77120" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
            - call: "POST /veteran-students/${stu1}/account-holds"
              payload: { hold_status: "REGISTRATION_HOLD" }
              as: BursarOfficer
            - call: "POST /veteran-students/${stu1}/expire-coe"
              payload: {}
              as: VaProcessingOffice
            - call: "POST /veteran-students/${stu1}/account-holds"
              payload: { hold_status: "NONE" }
              as: BursarOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: VaProcessingOffice
            - call: "POST /veteran-students/${stu1}/verify-coe"
              payload: { coe_issued_on: "2026-08-20", verified_document_reference: "COE-2026-88431" }
              as: SchoolCertifyingOfficial
              as_user_id: "${sco1}"
          assert:
            - "After trigger step 1 VeteranStudent.${stu1}.coe_status == VERIFIED with coe_verified_on == 2026-08-01 and protected_until == 2026-10-30"
            - "After trigger step 2 VeteranStudent.${stu1}.account_hold_status == REGISTRATION_HOLD and coe_status is still VERIFIED"
            - "After trigger step 3 VeteranStudent.${stu1}.coe_status == EXPIRED and account_hold_status is still REGISTRATION_HOLD"
            - "After trigger step 4 VeteranStudent.${stu1}.account_hold_status == NONE and coe_status is still EXPIRED"
            - "After trigger step 6 VeteranStudent.${stu1}.coe_status == VERIFIED again, coe_verified_on == 2026-09-10 and protected_until == 2026-12-09"
            - "VeteranStudent.${stu1}.verified_document_reference == COE-2026-88431"
            - "VeteranStudent.${stu1}.benefit_payment_protected == false at every step because no CERTIFIED certification with a null tuition_payment_posted_on exists"

      - name: catalog_pending_saa_three_way_fork_with_divergent_program_effects
        grounds:
          - state_machines.CatalogVersion.PENDING_SAA_to_APPROVED
          - state_machines.CatalogVersion.PENDING_SAA_to_APPROVED_WITH_CONDITIONS
          - state_machines.CatalogVersion.PENDING_SAA_to_REJECTED
          - state_machines.CatalogVersion.REJECTED_to_PENDING_SAA
          - entities.Program.fields.approval_status
          - entities.Program.fields.approved_catalog_version_id
        distinguishing_aspect: |
          PENDING_SAA is a genuine three-way fork on ONE endpoint: the same
          POST /catalog-versions/{id}/saa-decision drives APPROVED, APPROVED_WITH_CONDITIONS
          or REJECTED with DIVERGENT side effects on the parent Program
          (APPROVED / CONDITIONAL / DRAFT and pin / pin / clear of
          approved_catalog_version_id), and REJECTED is not terminal — it re-enters
          PENDING_SAA, so the graph contains a cycle rather than a single path.
        test_recipe:
          setup:
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
            - "One SUPERVISORY official is ACTIVE."
            - "Three DRAFT programs PROG-A, PROG-B and PROG-C each own exactly one catalog version for 2026-07-01..2027-07-01 with all three compliance flags true, and each version has been submitted so it sits in PENDING_SAA with its Program in PENDING_SAA."
