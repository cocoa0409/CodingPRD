            - call: "POST /warranty/claims/${cl_r2_id}/adjudicate"
              payload: { decision: "DENY", denial_reason: "Narrative does not support the repair." }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "GET /warranty/dealers/${dr_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/parts-returns/non-return-sweep"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/dealers/${dr_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          assert:
            - "first call: Dealer.open_parts_return_count == 3"
            - "third call: open_parts_return_count == 2 after the receive"
            - "fifth call: open_parts_return_count == 1 - denying CL_R2 waived its return"
            - "seventh call: swept_count == 1 and total_debit_cents == 20000 (only CL_R3 is APPROVED with a REQUESTED overdue return)"
            - "eighth call: open_parts_return_count == 0 and chargeback_balance_cents == 20000 with status ACTIVE"
            - "eighth call: Dealer.version advanced once per decrement, so it is strictly greater after each of the three steps"
      - name: cascade_depth_five_end_to_end_verified
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / non_return_sweep_depth_five_return_claim_ledger_posture_sibling
          rationale: "The named §1.8 instance walks all five hops of the sweep cascade in one call and asserts each hop's field, which is this layer's end-to-end claim."
      - name: cascade_ordering_sensitivity_on_appeal_grant
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: transitive_cascade / appeal_grant_depth_five_finding_recompute_ledger_posture_release
          rationale: "The named §1.8 instance asserts the reversal hops run in the pinned order and that the posture release only fires after the ledger row is appended."
      - name: dual_variant_layer_both_variants_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_pricing_provisional_versus_final_variant_divergence
          rationale: "The named §1.8 instance asserts both variants on one row and the 7440 delta, covering this layer directly."
      - name: chargeback_balance_reversal_reconciles_to_zero
        claim_type: derived_field_reconciliation
        grounds:
          - complexity_profile.complexity_layers.derived_field_reconciliation
        excluded_because:
          difficulty_instance: compensating_invariant / late_part_return_reverses_non_return_debit_to_exact_zero
          rationale: "The named §1.8 instance asserts the derived balance returns to exactly 0 after the compensating reversal, with no drift."
      - name: suspension_threshold_boundary_trigger
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers.rate_threshold_triggers
        excluded_because:
          difficulty_instance: transitive_cascade / non_return_sweep_depth_five_return_claim_ledger_posture_sibling
          rationale: "The named §1.8 instance crosses SUSPENSION_THRESHOLD_CENTS in one debit and asserts the ACTIVE -> SUSPENDED skip past PROBATION."

  - section: consistency_model
    instances:
      - name: cascade_is_visible_in_the_same_response_immediate
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - response_envelope.success
          - calculations.claim_reimbursement_amount
        distinguishing_aspect: |
          Nothing is deferred: the adjudicate response itself already carries every recomputed money field and
          the analysis response already carries the debit, and an immediate re-read returns byte-identical
          values - no second request is needed to observe a cascade and none of it lags.
        test_recipe:
          setup:
            - "WORLD-BRAKE: claim CL1 was submitted at 2.0 h and qty 3 with provisional_total_cents 124782."
            - "Adjudication caps hours to 1.5 and markup to 0.30, so approved_total_cents is 117342."
            - "The part is received on 2026-05-01 and analysed NO_DEFECT_FOUND, whose debit is the full approved parts amount 96717."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00Z" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "POST /warranty/state-law-profiles"
              payload: { state_code: "CA", markup_cap_pct: 0.30, labor_rate_method: "RETAIL_SAMPLE", min_sample_repair_orders: 5, max_labor_rate_cents: 19500, deemed_approved_days: 30, appeal_window_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { slp_ca_id: $.data.id }
            - call: "POST /warranty/dealers"
              payload: { dealer_code: "D1", name: "Dealer One", state_law_profile_id: "${slp_ca_id}", vehicles_in_operation: 100, initial_labor_rate_cents: 13750, initial_parts_markup_pct: 0.40 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { d1_id: $.data.id }
            - call: "POST /warranty/vehicles"
              payload: { vin: "VIN00000000000001", model_year: 2024, warranty_start_date: "2024-01-15", in_service_odometer: 0, basic_months: 36, basic_miles: 36000, powertrain_months: 60, powertrain_miles: 60000 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { veh1_id: $.data.id }
            - call: "POST /warranty/labor-operations"
              payload: { op_code: "A1234-56", description: "Front brake pad replacement", standard_time_hours: 1.5, max_time_hours: 2.5, category: "BASIC", requires_causal_part: true, causal_failure_group: "BRAKE_FRONT", overlap_group: "BRAKE_FRONT" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { lo_brake_id: $.data.id }
            - call: "POST /warranty/parts"
              payload: { part_number: "BRK-PAD-9931", description: "Front brake pad set", dealer_net_cents: 24799, failure_group: "BRAKE_FRONT", return_required: true, retention_days: 30 }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { part_brake_id: $.data.id }
            - call: "POST /warranty/claims"
              payload: { dealer_id: "${d1_id}", vehicle_id: "${veh1_id}", labor_operation_id: "${lo_brake_id}", causal_part_id: "${part_brake_id}", repair_order_number: "RO-1001", repair_date: "2026-04-10", odometer_at_repair: 20000, claimed_labor_hours: 2.0, claimed_parts_qty: 3, complaint_text: "Customer reports brake squeal at low speed.", cause_text: "Front brake pads worn beyond specification.", correction_text: "Replaced front brake pads and verified normal braking." }
              as: DealerWarrantyAdmin
              as_user_id: "${d1_id}"
              captures: { cl1_id: $.data.id }
            - call: "POST /warranty/claims/${cl1_id}/adjudicate"
              payload: { decision: "APPROVE", approved_labor_hours: 2.0, approved_parts_qty: 3 }
              as: ClaimAdjudicator
              as_user_id: "adj-user-1"
            - call: "POST /warranty/claims/${cl1_id}/pay"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/parts-returns?claim_id=${cl1_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
              captures: { pr_id: "$.data[0].id" }
            - call: "POST /warranty/parts-returns/${pr_id}/receive"
              payload: { received_date: "2026-05-01" }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          trigger:
            - call: "POST /warranty/parts-returns/${pr_id}/analysis"
              payload: { analysis_result: "NO_DEFECT_FOUND", analysis_note: "Bench test found the component within specification." }
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/claims/${cl1_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/dealers/${d1_id}"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
            - call: "GET /warranty/dealers/${d1_id}/ledger-entries?limit=10&offset=0"
              as: WarrantyAdmin
              as_user_id: "wa-user-1"
          assert:
            - "first call: the response body already carries status ANALYZED and debit_amount_cents 96717"
            - "second call: WarrantyClaim.payment_status == DEBITED and debited_amount_cents == 96717 with no re-read delay"
            - "third call: Dealer.chargeback_balance_cents == 96717 and status == PROBATION, already recomputed"
            - "fourth call: the ledger row exists with balance_after_cents 96717 equal to the dealer's stored balance"
            - "every value read in calls 2 to 4 was already final at the moment call 1 returned"

