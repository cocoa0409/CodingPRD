            - "${e10} is 403 for the Shipper on the field's report listing, while the same listing is a shared read for all four operator roles"
            - "${e11} is 403 — the Shipper is the one role excluded from the logical clock, and the clock still reads 2026-08-01T00:00:00Z afterwards"
            - "GET /wells as the Shipper returns HTTP 200 with total_count == 1 and MINI-1's operational_state IN_SERVICE — the customer's read surface is narrow, not empty"
            - "GET /storage-fields/${f1} as the IntegrityEngineer returns HTTP 200 with the full derived block, so its lockout is commercial-only"
            - "RegulatoryReport.${rp1} is still DRAFT and no version anywhere advanced"

      - name: a_shipper_cannot_read_or_write_another_shippers_contract_nomination_or_ticket
        claim_type: peer_roles
        grounds:
          - segregation_of_duties_rules
          - validations.priority_6_ERR_CONTRACT_NOT_OWNED
          - errors.ERR_CONTRACT_NOT_OWNED
          - roles.Shipper.identity
        distinguishing_aspect: |
          Shipper identity is entity_backed, so ownership is a comparison of X-User-ID against
          contract.shipper_id reached through up to two hops — directly for a contract, via
          Nomination.contract_id for a nomination, and via GasMovementTicket.nomination_id.contract_id
          for a ticket. The by-id READS are gated exactly like the writes (403, not 404 and not a
          redacted 200), and the second shipper is a fully legitimate, credit-good customer with its own
          ACTIVE contract on the SAME field — so nothing but the ownership hop separates the two.
        test_recipe:
          setup:
            - "Field F_MINI with one well MINI-1. Shippers NORTHLINE (s1) and SOUTHLINE (s2), each with an ACTIVE FIRM contract on F_MINI (CN-1 for s1, CS-1 for s2)."
            - "s1 files, submits and has confirmed Nomination N1 for 80000 Dth INJECTION on gas day 2026-08-02; FieldOperator meters ticket G1 for 80000 Dth and confirms it, which appends one DAILY_IMBALANCE ledger entry to CN-1."
