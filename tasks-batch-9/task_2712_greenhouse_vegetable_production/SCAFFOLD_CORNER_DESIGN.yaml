              captures: { auth_err: $.data.error_id }
          assert:
            - "the request carries X-User-Role: GrowerManager but an empty X-User-ID header"
            - "${auth_err} == ERR_UNAUTHENTICATED"
            - "the call returns HTTP 401 before any field validation runs, even though the payload is otherwise perfect"
