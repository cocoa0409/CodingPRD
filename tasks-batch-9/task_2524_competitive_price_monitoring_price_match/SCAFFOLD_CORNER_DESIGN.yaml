              captures: { c1_id: $.data.id }
            - call: "POST /pricing/matches"
              payload: { product_id: "${p_id}", competitor_id: "${c1_id}", match_method: "ATTRIBUTE", identifier_score: 50, attribute_score: 50, image_score: 50 }
              as: PricingAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "OPEN_REVIEW" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/matches/${l_id}/revise"
              payload: { attribute_score: 60 }
              as: PricingAnalyst
            - call: "POST /pricing/matches/${l_id}/review"
              payload: { decision: "OPEN_REVIEW" }
              as: PricingManager
              as_user_id: "manager-9"
            - call: "POST /pricing/matches/${l_id}/revise"
