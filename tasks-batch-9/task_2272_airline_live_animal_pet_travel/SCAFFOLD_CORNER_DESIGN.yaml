scaffold_corner_design:
  - section: entities
    instances:
      - name: species_profile_created_with_required_fields_returns_created
        claim_type: creation
        grounds:
          - entities.SpeciesProfile
          - endpoints.POST /species-profiles
        distinguishing_aspect: "POST /species-profiles with every required input field returns 201 and echoes the inputs; the two computed/defaulted fields (breed_restriction_count 0, status ACTIVE) and the four common fields are present on the create response itself, not only on a later GET."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
          assert:
            - "response status is 201"
            - "SpeciesProfile.${sp_dog}.species_code == DOG"
            - "SpeciesProfile.${sp_dog}.acceptance_class == ACCEPTED_ALL_ROUTINGS"
            - "SpeciesProfile.${sp_dog}.max_cabin_weight_kg == 12"
            - "SpeciesProfile.${sp_dog}.min_age_weeks == 16"
            - "SpeciesProfile.${sp_dog}.requires_veterinary_review == false"
            - "SpeciesProfile.${sp_dog}.breed_restriction_count == 0"
            - "SpeciesProfile.${sp_dog}.status == ACTIVE"
            - "SpeciesProfile.${sp_dog}.version == 1"
            - "the response carries meta.api_request_id and response_type == object per the declared envelope"

      - name: flight_leg_get_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - entities.FlightLeg.fields.block_minutes
          - endpoints.GET /flight-legs/{id}
          - calculations.leg_posture_derivation
        distinguishing_aspect: "GET /flight-legs/{id} returns the stored schedule AND the fields the create-time calculations wrote: block_minutes 780 from the 13-hour schedule, posture OPEN with no embargo rule in the database, and all three booked counters still 0."
        test_recipe:
          setup:
            - "Stations HKG (HK) and LAX (US); AN101 HKG->LAX 2026-09-10T02:00Z-15:00Z with no TemperatureEmbargoRule anywhere in the database"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
          trigger:
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01" }
          assert:
            - "response status is 200"
            - "FlightLeg.${leg1}.block_minutes == 780"
            - "FlightLeg.${leg1}.posture == OPEN"
            - "FlightLeg.${leg1}.governing_embargo_rule_id is null"
            - "FlightLeg.${leg1}.booked_cabin_count == 0 and booked_checked_count == 0 and booked_cargo_count == 0"
            - "FlightLeg.${leg1}.status == SCHEDULED"
            - "FlightLeg.${leg1}.version == 1"

      - name: station_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /stations
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three stations exist and limit 2 / offset 0 returns exactly 2 rows with total_count 3 and has_more true; the guide's listing claim is about the envelope counters, not about the row contents."
        test_recipe:
          setup:
            - "Exactly three Station rows: HKG, LAX and JFK, all with status ACCEPTING"
          setup_api_calls:
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "JFK", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_jfk: $.data.id } }
          trigger:
            - { call: "GET /stations", payload: { limit: 2, offset: 0 }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 200 and response_type == array"
            - "the data array holds exactly 2 Station rows"
            - "total_count == 3"
            - "has_more == true"
            - "the same call with offset 2 returns 1 row, total_count 3 and has_more false"

      - name: animal_record_get_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_6
          - errors.ERR_ANIMAL_NOT_FOUND
        distinguishing_aspect: "A syntactically valid UUID that matches no AnimalRecord row yields the entity-specific 404 ERR_ANIMAL_NOT_FOUND, not a generic 404 and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database, so no AnimalRecord row exists"
          setup_api_calls: []
          trigger:
            - { call: "GET /animal-records/2f4d9a10-6c5b-4e77-9f21-0d4a7b3c8e55", payload: {}, as: AcceptanceAgent, as_user_id: "accept-01" }
          assert:
            - "response status is 404 with error_id ERR_ANIMAL_NOT_FOUND"
            - "response_type == error"

      - name: container_model_create_without_ventilation_area_pct_rejected
        claim_type: required_fields
        grounds:
          - validations.priority_4
          - endpoints.POST /container-models
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "Every ContainerModel field is `source: input` with no default, so omitting the single field ventilation_area_pct is a 400 ERR_INVALID_REQUEST at priority 4 - before any domain rule can look at the geometry."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 400 with error_id ERR_INVALID_REQUEST"
            - "no ContainerModel row is created"

      - name: reservation_and_animal_defaults_applied_when_optional_fields_omitted
        claim_type: defaults
        grounds:
          - entities.Reservation.fields.is_service_animal_booking
          - entities.AnimalRecord.fields.animal_kind
          - entities.AnimalRecord.fields.measured_weight_kg
        distinguishing_aspect: "Omitting every optional input on POST /reservations and POST /animal-records applies the declared defaults across two entities at once: is_service_animal_booking false, animal_kind PET, behavior_attestation_on_file false, measured_weight_kg null, plus the initial computed values (booking_status PENDING, compliance_status UNVERIFIED, status DRAFT, container_compliance_state UNEVALUATED, deficiency_codes empty)."
        test_recipe:
          setup:
            - "A DOG SpeciesProfile and a K9-L ContainerModel exist"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
          trigger:
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
          assert:
            - "response status is 201"
            - "AnimalRecord.${an1}.animal_kind == PET"
            - "AnimalRecord.${an1}.behavior_attestation_on_file == false"
            - "AnimalRecord.${an1}.measured_weight_kg is null"
            - "AnimalRecord.${an1}.chargeable_weight_kg == 0"
            - "AnimalRecord.${an1}.container_compliance_state == UNEVALUATED"
            - "AnimalRecord.${an1}.deficiency_codes == []"
            - "AnimalRecord.${an1}.status == DRAFT"
            - "Reservation.${res1}.is_service_animal_booking == false"
            - "Reservation.${res1}.booking_status == PENDING and Reservation.${res1}.compliance_status == UNVERIFIED"

      - name: species_breed_restriction_count_recomputes_on_withdrawal
        claim_type: computed_fields
        grounds:
          - entities.SpeciesProfile.fields.breed_restriction_count
          - endpoints.POST /breed-restrictions
          - endpoints.PUT /breed-restrictions/{id}/status
        distinguishing_aspect: "breed_restriction_count is `source: computed` on the PARENT and is maintained by writes to the CHILD: two creates take it to 2 and withdrawing one recomputes it to 1, with SpeciesProfile.version advancing on each child write."
        test_recipe:
          setup:
            - "A DOG SpeciesProfile with two ACTIVE BreedRestriction rows: a SNUB_NOSED row for Bulldog and a BANNED row for Wolf Hybrid, so breed_restriction_count is 2 and SpeciesProfile.version is 3"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /breed-restrictions", payload: { species_profile_id: "${sp_dog}", breed_name: "Bulldog", restriction_type: "SNUB_NOSED" }, as: ProgramAdmin, as_user_id: "admin-01", captures: { br1: $.data.id } }
            - { call: "POST /breed-restrictions", payload: { species_profile_id: "${sp_dog}", breed_name: "Wolf Hybrid", restriction_type: "BANNED" }, as: ProgramAdmin, as_user_id: "admin-01", captures: { br2: $.data.id } }
          trigger:
            - { call: "PUT /breed-restrictions/${br2}/status", payload: { status: "WITHDRAWN" }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 200 and BreedRestriction.${br2}.status == WITHDRAWN"
            - "SpeciesProfile.${sp_dog}.breed_restriction_count == 1"
            - "SpeciesProfile.${sp_dog}.version == 4"
            - "BreedRestriction.${br1}.status == ACTIVE"
            - "GET /species-profiles/${sp_dog}/breed-restrictions with status ACTIVE returns exactly 1 row"

      - name: welfare_check_stamps_recorded_at_from_logical_clock_and_performer
        claim_type: system_fields
        grounds:
          - entities.WelfareCheck.fields.recorded_at_utc
          - entities.WelfareCheck.fields.performed_by_user_id
          - endpoints.POST /welfare-checks
        distinguishing_aspect: "recorded_at_utc and performed_by_user_id are `source: system`: the first comes from the logical clock (moved to 2026-08-05T08:30:00Z in setup) and the second from the acting X-User-ID, and neither appears in the endpoint's declared input."
        test_recipe:
          setup:
            - "The logical clock is advanced from its 2026-08-01T00:00:00Z default to 2026-08-05T08:30:00Z"
            - "A CHECKED reservation whose animal holds one RESERVED sequence-1 segment on AN101"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T08:30:00Z" }, as: ProgramAdmin, as_user_id: "admin-01" }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CHECKED", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg1: $.data.id } }
          trigger:
            - { call: "POST /welfare-checks", payload: { segment_assignment_id: "${seg1}", check_type: "WATER" }, as: AcceptanceAgent, as_user_id: "accept-07", captures: { wc1: $.data.id } }
          assert:
            - "response status is 201"
            - "WelfareCheck.${wc1}.recorded_at_utc == 2026-08-05T08:30:00Z"
            - "WelfareCheck.${wc1}.performed_by_user_id == accept-07"
            - "WelfareCheck.${wc1}.outcome == NORMAL"
            - "WelfareCheck.${wc1}.notes is null"
            - "SegmentAssignment.${seg1}.completed_welfare_check_count == 1"

      - name: station_create_with_lowercase_iata_code_rejected
        claim_type: type_constraints
        grounds:
          - entities.Station.fields.iata_code
          - validations.priority_4
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "iata_code declares `exactly 3 uppercase letters`, so a lowercase three-letter code fails the priority-4 shape check with 400 ERR_INVALID_REQUEST rather than the 409 duplicate check or any station-status rule."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - { call: "POST /stations", payload: { iata_code: "hkg", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 400 with error_id ERR_INVALID_REQUEST"
            - "no Station row is created"
            - "the same payload with iata_code HKG returns 201"

      - name: welfare_check_row_is_immutable_with_no_version_field
        claim_type: immutability
        grounds:
          - entities.WelfareCheck
          - endpoints.GET /segment-assignments/{id}/welfare-checks
        distinguishing_aspect: "WelfareCheck is the only entity declared `common_fields: false`: its rows carry id and created_at but no version and no updated_at, and §1.5 declares no PUT, PATCH or DELETE for welfare checks, so an appended check can never be amended."
        test_recipe:
          setup:
            - "A CHECKED reservation whose animal holds one RESERVED sequence-1 segment on AN101, with one WATER welfare check already appended"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
            - { call: "GET /flight-legs/${leg1}", payload: {}, as: ReservationsAgent, as_user_id: "agent-01", captures: { leg1_v1: $.data.version } }
            - { call: "POST /segment-assignments", payload: { animal_record_id: "${an1}", flight_leg_id: "${leg1}", routing_type: "CHECKED", sequence_index: 1, expected_flight_leg_version: "${leg1_v1}" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { seg1: $.data.id } }
            - { call: "POST /welfare-checks", payload: { segment_assignment_id: "${seg1}", check_type: "WATER" }, as: AcceptanceAgent, as_user_id: "accept-01", captures: { wc1: $.data.id } }
          trigger:
            - { call: "GET /segment-assignments/${seg1}/welfare-checks", payload: { limit: 10, offset: 0 }, as: ComplianceOfficer, as_user_id: "officer-01" }
          assert:
            - "response status is 200 and the data array holds exactly 1 WelfareCheck row"
            - "the returned WelfareCheck row exposes id and created_at"
            - "the returned WelfareCheck row exposes no version field and no updated_at field"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint whose path targets a welfare check"

      - name: breed_restriction_create_with_unknown_species_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations.priority_7
          - entities.BreedRestriction.fields.species_profile_id
          - errors.ERR_SPECIES_NOT_FOUND
        distinguishing_aspect: "BreedRestriction declares SpeciesProfile as its parent, and the parent FK is validated from the request BODY at priority 7 - a well-formed payload naming a non-existent species yields 404 ERR_SPECIES_NOT_FOUND, not 400."
        test_recipe:
          setup:
            - "Empty database, so no SpeciesProfile row exists"
          setup_api_calls: []
          trigger:
            - { call: "POST /breed-restrictions", payload: { species_profile_id: "7c1b8e42-55aa-4c19-8f03-9d2e6a41b7c0", breed_name: "Bulldog", restriction_type: "SNUB_NOSED" }, as: ProgramAdmin, as_user_id: "admin-01" }
          assert:
            - "response status is 404 with error_id ERR_SPECIES_NOT_FOUND"
            - "no BreedRestriction row is created"

      - name: segment_assignment_is_reachable_from_both_animal_and_leg_filters
        claim_type: graph
        grounds:
          - entities.SegmentAssignment.fields.animal_record_id
          - entities.SegmentAssignment.fields.flight_leg_id
          - endpoints.GET /segment-assignments
        distinguishing_aspect: "SegmentAssignment is the many-to-many junction of the graph topology (one animal on many legs, one leg carrying many animals); the same row must be reachable through the animal_record_id filter and through the flight_leg_id filter, and a filter naming the other animal on the leg returns only that animal's row."
        test_recipe:
          setup:
            - "Two CHECKED reservations, each with one animal, each holding one RESERVED sequence-1 segment on the same leg AN101 (checked_animal_limit 2)"
          setup_api_calls:
            - { call: "POST /species-profiles", payload: { species_code: "DOG", common_name: "Dog", acceptance_class: "ACCEPTED_ALL_ROUTINGS", max_cabin_weight_kg: 12, min_age_weeks: 16 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { sp_dog: $.data.id } }
            - { call: "POST /container-models", payload: { model_code: "K9-L", interior_length_cm: 60, interior_width_cm: 40, interior_height_cm: 45, tare_weight_kg: 7, ventilation_area_pct: 15, ventilated_side_count: 3, wheels_removable: true, cabin_eligible: false }, as: ProgramAdmin, as_user_id: "admin-01", captures: { cm_k9l: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "HKG", country_code: "HK", kennel_bay_count: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_hkg: $.data.id } }
            - { call: "POST /stations", payload: { iata_code: "LAX", country_code: "US", kennel_bay_count: 6 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { st_lax: $.data.id } }
            - { call: "POST /flight-legs", payload: { flight_number: "AN101", origin_station_id: "${st_hkg}", destination_station_id: "${st_lax}", scheduled_departure_utc: "2026-09-10T02:00:00Z", scheduled_arrival_utc: "2026-09-10T15:00:00Z", forecast_high_c: 25, forecast_low_c: 15, cabin_animal_limit: 2, checked_animal_limit: 2, cargo_animal_limit: 4 }, as: ProgramAdmin, as_user_id: "admin-01", captures: { leg1: $.data.id } }
            - { call: "POST /reservations", payload: { passenger_name: "Wu", contact_email: "wu@example.com", routing_type: "CHECKED" }, as: ReservationsAgent, as_user_id: "agent-01", captures: { res1: $.data.id } }
            - { call: "POST /animal-records", payload: { reservation_id: "${res1}", species_profile_id: "${sp_dog}", container_model_id: "${cm_k9l}", animal_name: "Mochi", breed_name: "Labrador", declared_weight_kg: 20, height_at_shoulder_cm: 35, length_nose_to_tail_cm: 50, age_weeks: 52 }, as: ReservationsAgent, as_user_id: "agent-01", captures: { an1: $.data.id } }
