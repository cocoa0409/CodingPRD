          rationale: "That §1.8 instance asserts the 409 ERR_COURSE_NOT_COMPLETED for a COURSE_PLUS_EXAM code whose course_completed_at is null."
      - name: batch_assignment_rejections_bundle_depleted_then_batch_state_then_batch_expired
        claim_type: violation_to_error
        grounds:
          - validations[priority=11]
          - validations[priority=49]
          - validations[priority=50]
          - errors.ERR_BATCH_DEPLETED
          - errors.ERR_BATCH_STATE_INVALID
          - errors.ERR_BATCH_EXPIRED
          - state_machines.AccessCodeBatch
        distinguishing_aspect: |
          The three batch-level rejections are distinguishable only by how the batch is broken.
          ERR_BATCH_DEPLETED is bundle-type-scoped, NOT batch-scoped: a batch with one EXAM_ONLY and one
          COURSE_PLUS_EXAM code whose EXAM_ONLY code is already assigned still has available_count 1 and
          status ACTIVE, so a second EXAM_ONLY request must be 409 ERR_BATCH_DEPLETED and not
          ERR_BATCH_STATE_INVALID. Once available_count really reaches 0 the batch is DEPLETED and §1.4
          priority 11 outranks priority 50, so the answer flips to ERR_BATCH_STATE_INVALID. And a batch whose
          expires_at has passed is still ACTIVE until a compliance run touches it, so an assignment fails with
          ERR_BATCH_EXPIRED (priority 49) while a void of the same batch still SUCCEEDS — void carries no
          clock precondition.
        test_recipe:
          setup:
            - "A jurisdiction / a provider prepaid 500000 / one ACTIVE EN form / two candidates A and B of that provider."
            - "Batch B1 with line_items [EXAM_ONLY x1, COURSE_PLUS_EXAM x1] expiring 2026-08-15T00:00:00Z, whose EXAM_ONLY code is already assigned to A — so B1 is ACTIVE with available_count 1, assigned_count 1."
