          grounds: "§1.3 shared_pool_allocation: floor each exact share, then hand out remainder cents one at a time by frac(exact) DESC with BusinessUnit.created_at ASC as the tie-break; precision note requires SUM(SHARED lines) == pooled_cost_cents exactly."
