            - "CLOSED INTERVALS: assigning Dana to A2 (10:00-11:00, same venue as A1 which ends 10:00) returns HTTP 409 with error_id == ERR_PERSONNEL_DOUBLE_BOOKED, because A1.end_utc <= A2.start_utc is an inclusive touch under the closed-interval test"
            - "the same touching pair 09:00-10:00 / 10:00-11:00 was ACCEPTED by the Venue rule in venue_area_half_open_end_buffer_with_aggregate_area_capacity, so the two interval semantics give opposite verdicts on identical timestamps"
            - "ONE MINUTE OF DAYLIGHT IS ENOUGH AT THE SAME VENUE: assigning Dana to A3 (10:01-11:00, same venue) returns HTTP 201 with PersonnelAssignment.${asg_a3_id}.status == ASSIGNED and duration_minutes == 59, because no travel buffer applies within a venue"
            - "VENUE-CONDITIONAL BUFFER: assigning Dana to B1 (11:30-12:30 at the OTHER venue) returns HTTP 409 with error_id == ERR_PERSONNEL_DOUBLE_BOOKED, because A3 ends 11:00 and the 45-minute cross-venue buffer widens it to 11:45, which inclusively covers 11:30"
            - "the identical B1 interval would have been accepted had B1 been at Venue A, so the refusal is attributable to the venue-conditional buffer and not to the raw timestamps"
            - "BUFFER EDGE IS EXACTLY 45 MINUTES AND INCLUSIVE: assigning Dana to B2 (11:46-12:46 at the other venue) returns HTTP 201 with PersonnelAssignment.${asg_b2_id}.status == ASSIGNED and duration_minutes == 60, because 11:46 sits one minute past the 11:45 buffered edge"
