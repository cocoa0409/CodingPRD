          - validations[priority=3]
          - errors[ERR_SCOPE_VIOLATION]
        distinguishing_aspect: "VendorIntegrationManager is an opaque identity that becomes scoped by what it creates: a second manager holding the identical role is refused ERR_SCOPE_VIOLATION (403) on PATCH, on the roster feed and on the renewal summary of a licence registered by the first — while POST /rostering/vendor-apps stays open to it, because that call is what establishes a new binding."
