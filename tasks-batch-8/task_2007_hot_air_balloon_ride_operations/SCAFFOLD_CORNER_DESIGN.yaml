# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Hot Air Balloon Ride Operations (task 2007)
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: launch_site_created_with_pending_permission_default
        claim_type: defaults
        grounds: [entities.LaunchSite.fields.permission_status]
        distinguishing_aspect: "A freshly created LaunchSite starts with permission_status PENDING and null permission_granted_at — the default is applied without client input."
        test_recipe:
          setup: ["empty database; clock at default"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /v1/launch-sites"
              payload: { name: "Corrales Bosque", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
          assert:
            - "LaunchSite.${s1}.permission_status == PENDING"
            - "LaunchSite.${s1}.permission_granted_at is null"
            - "LaunchSite.${s1}.version == 1"

      - name: pilot_optional_experience_defaults_to_zero
        claim_type: defaults
        grounds: [entities.Pilot.fields.external_pic_hours_180d, entities.Pilot.fields.external_takeoffs_landings_90d]
        distinguishing_aspect: "Omitting the optional external-experience fields yields 0 / 0.0 and computed currency EXPIRED (both methods unmet at zero)."
        test_recipe:
          setup: ["clock at default"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "POST /v1/pilots"
              payload: { name: "New Pilot", certificate_number: "PC-0001", medical_expires_on: "2027-06-30" }
              as: OperationsManager
              captures: { p0: $.data.id }
          assert:
            - "Pilot.${p0}.external_pic_hours_180d == 0"
            - "Pilot.${p0}.external_takeoffs_landings_90d == 0"
            - "Pilot.${p0}.faa_currency_met == false"
            - "Pilot.${p0}.operator_currency_met == false"
            - "Pilot.${p0}.currency_status == EXPIRED"

      - name: flight_season_tier_computed_peak_vs_regular
        claim_type: computed_fields
        grounds: [entities.Flight.fields.season_tier, calculations.fare_quote]
        distinguishing_aspect: "season_tier is computed from scheduled_date (Oct 1–14 → PEAK, else REGULAR); an input-supplied value is not accepted and the two boundary dates Oct 1 and Oct 15 land on different tiers."
        test_recipe:
          setup: ["GRANTED site, inspected balloon, CURRENT pilot"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id }
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-10-01", dawn_window_start: "2026-10-01T05:30:00Z", dawn_window_end: "2026-10-01T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED" }
              as: OperationsManager
              captures: { f_peak: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-10-15", dawn_window_start: "2026-10-15T05:30:00Z", dawn_window_end: "2026-10-15T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED" }
              as: OperationsManager
              captures: { f_reg: $.data.id }
          assert:
            - "Flight.${f_peak}.season_tier == PEAK"
            - "Flight.${f_reg}.season_tier == REGULAR"

      - name: balloon_inspection_due_on_computed
        claim_type: computed_fields
        grounds: [entities.Balloon.fields.inspection_due_on]
        distinguishing_aspect: "inspection_due_on is last_inspection_on + 365 days, recomputed by RECORD_INSPECTION; null before the first inspection."
        test_recipe:
          setup: ["balloon created, never inspected"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
          trigger:
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
          assert:
            - "Balloon.${b1}.last_inspection_on == 2026-07-01"
            - "Balloon.${b1}.inspection_due_on == 2027-07-01"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID yields ERR_NOT_FOUND (404) on a single-resource endpoint."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
          trigger:
            - call: "GET /v1/flights/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: ["validations[priority=4]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /v1/flights without required kind fails with ERR_INVALID_REQUEST before any state or business check runs."
        test_recipe:
          setup: ["one site and balloon and pilot exist"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id }
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: flight_dawn_window_must_be_ninety_minutes
        claim_type: type_constraints
        grounds: ["validations[priority=4]", entities.Flight.fields.dawn_window_end]
        distinguishing_aspect: "A dawn window of 120 minutes (not exactly 90) is rejected with ERR_INVALID_REQUEST at flight creation."
        test_recipe:
          setup: ["site, balloon, pilot exist"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id }
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:30:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: reservation_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.Reservation.fields.photo_package_tier, "validations[priority=4]"]
        distinguishing_aspect: "photo_package_tier value PREMIUM (not a declared enum member) fails with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["SCHEDULED SHARED flight"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED" }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/customers"
              payload: { name: "Cara Diaz", email: "cara@x.com" }
              as: Anonymous
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /v1/flights/${f1}/reservations"
              payload: { customer_id: "${c1}", party_size: 1, declared_weight_lbs: 180, photo_package_tier: "PREMIUM" }
              as: Customer
              as_user_id: "${c1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: flight_publish_valid_transition
        claim_type: valid_transition
        grounds: [state_machines.Flight.DRAFT_to_SCHEDULED]
        distinguishing_aspect: "Happy path: DRAFT flight with all preconditions met transitions to SCHEDULED and version increments."
        test_recipe:
          setup: ["GRANTED site, inspected ACTIVE balloon, CURRENT pilot, DRAFT flight"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED" }
              as: OperationsManager
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
          assert:
            - "Flight.${f1}.status == SCHEDULED"
            - "Flight.${f1}.version == 2"

      - name: flight_terminal_cancelled_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Flight]
        distinguishing_aspect: "From CANCELLED (terminal), every further event — including RESCHEDULE — is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["flight CANCELLED from SCHEDULED (operator cancel)"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED" }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "CANCEL" }
              as: OperationsManager
          trigger:
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "RESCHEDULE", new_scheduled_date: "2026-08-11", new_dawn_window_start: "2026-08-11T05:30:00Z", new_dawn_window_end: "2026-08-11T07:00:00Z" }
              as: OperationsManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"

      - name: record_go_rejected_when_briefing_is_no_go
        claim_type: precondition_enforcement
        grounds: [state_machines.Flight.WEATHER_REVIEW_to_CLEARED_FOR_LAUNCH, "errors[ERR_WEATHER_LIMITS_EXCEEDED]", calculations.site_candidacy]
        distinguishing_aspect: "RECORD_GO with a latest RECORDED briefing whose computed decision is NO_GO (surface wind 10 > site limit 8) fails with ERR_WEATHER_LIMITS_EXCEEDED; flight stays WEATHER_REVIEW."
        test_recipe:
          setup: ["flight in WEATHER_REVIEW, clock inside window; briefing with surface_wind_kts 10 over site limit 8"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED" }
              as: OperationsManager
              captures: { f1: $.data.id }
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "PUBLISH" }
              as: OperationsManager
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T06:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "ENTER_WEATHER_REVIEW" }
              as: Pilot
              as_user_id: "${p1}"
            - call: "POST /v1/flights/${f1}/weather-briefings"
              payload: { surface_wind_kts: 10, aloft_wind_kts: 12, visibility_mi: 10.0, precipitation: false }
              as: Pilot
              as_user_id: "${p1}"
          trigger:
            - call: "POST /v1/flights/${f1}/events"
              payload: { event_type: "RECORD_GO" }
              as: Pilot
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_WEATHER_LIMITS_EXCEEDED"
            - "Flight.${f1}.status == WEATHER_REVIEW"

      - name: briefing_supersede_side_effect
        claim_type: side_effect_execution
        grounds: [state_machines.WeatherBriefing.RECORDED_to_SUPERSEDED]
        distinguishing_aspect: "Recording a second briefing on the same flight flips the first from RECORDED to SUPERSEDED; exactly one RECORDED briefing exists per flight at any time."
        test_recipe:
          setup: ["flight in WEATHER_REVIEW; first briefing recorded (decision NO_GO)"]
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: OperationsManager
            - call: "POST /v1/launch-sites"
              payload: { name: "Rio Grande North", surface_wind_limit_kts: 8, aloft_wind_limit_kts: 20, per_use_fee_cents: 15000, permission_expires_on: "2027-12-31" }
              as: OperationsManager
              captures: { s1: $.data.id }
            - call: "POST /v1/launch-sites/${s1}/events"
              payload: { event_type: "GRANT_PERMISSION" }
              as: OperationsManager
            - call: "POST /v1/balloons"
              payload: { registration: "N700AB", basket_capacity_passengers: 6, max_gross_weight_lbs: 1400, empty_weight_lbs: 600 }
              as: OperationsManager
              captures: { b1: $.data.id, b1_v: $.data.version }
            - call: "POST /v1/balloons/${b1}/events"
              payload: { event_type: "RECORD_INSPECTION", inspected_on: "2026-07-01", expected_balloon_version: "${b1_v}" }
              as: OperationsManager
            - call: "POST /v1/pilots"
              payload: { name: "Pat Harwell", certificate_number: "PC-2211", medical_expires_on: "2027-06-30", external_pic_hours_180d: 20.0, external_takeoffs_landings_90d: 5 }
              as: OperationsManager
              captures: { p1: $.data.id }
            - call: "POST /v1/flights"
              payload: { scheduled_date: "2026-08-10", dawn_window_start: "2026-08-10T05:30:00Z", dawn_window_end: "2026-08-10T07:00:00Z", launch_site_id: "${s1}", balloon_id: "${b1}", pilot_id: "${p1}", kind: "SHARED" }
