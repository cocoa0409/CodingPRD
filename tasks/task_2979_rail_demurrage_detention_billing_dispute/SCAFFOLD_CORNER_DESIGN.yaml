      - name: actual_placement_dated_before_the_constructive_placement
        claim_type: violation_to_error
        grounds:
          - validations.priority_64_chronology
          - errors.ERR_NON_CHRONOLOGICAL_EVENT
        distinguishing_aspect: |
          The rule compares recorded instants to EACH OTHER and never to the
          logical clock, so a whole cycle may be back-dated; what fails is
          placing a car physically before it was constructively placed. The
          clock sits far in the future to prove the clock is not the reference.
        test_recipe:
          setup:
            - "a cycle constructively placed 2026-08-05T08:00:00Z with a notice sent 2026-08-05T09:00:00Z, at a logical clock of 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9VD-CUST", name: "Chronology Chalcedony", serving_station_code: "STN82", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9VD-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9VD-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9VD-CCX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9VD-A", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-05T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-05T09:00:00Z" }
              as: RailroadAgent
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-04T10:00:00Z" }
              as: RailroadAgent
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "422 with error_id ERR_NON_CHRONOLOGICAL_EVENT"
            - "the cycle is still CONSTRUCTIVELY_PLACED with actual_placement_at null, clock_basis CONSTRUCTIVE and its charge untouched"
            - "Facility.occupied_spot_count did not increase"
            - "the constructive placement itself was accepted even though it postdates the logical clock: only recorded instants are compared"

