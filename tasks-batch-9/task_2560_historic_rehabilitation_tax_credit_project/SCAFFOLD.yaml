scenario: |
  Generate task harder than expert level!

  2560. Historic Rehabilitation Tax Credit Project (historic tax credit developer): certification of historic status and evaluation of significance for the property, rehabilitation plan review against preservation standards with part-by-part application submissions, qualified rehabilitation expenditure tracking segregated from non-qualified costs, substantial rehabilitation test against the adjusted basis within the measuring period, investor structure with a master lease or single-tier pass-through and disqualification risks, construction changes requiring amendment submissions and reviewer concurrence, placed-in-service certification and credit claiming timeline, five-year recapture monitoring and compliance covenants

domain_name: "historic-rehab-tax-credit"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by foreign keys declared on the child. URL paths are
  # flat collections (`/projects`, `/part-applications`, `/cost-line-items`,
  # `/amendments`) plus read-only sub-resource lists under `/projects/{id}/...`.
  # No entity is created through a nested path except StandardFinding, whose
  # only parent is the PartApplication that raised it.

  state_machine_shape: cyclic
  state_machine_shape_secondary: parallel
  # PartApplication cycles REVISION_REQUIRED -> SHPO_REVIEW on resubmission and
  # ComplianceCovenant cycles BREACHED -> CURED -> COMPLIANT. Project carries two
  # independent state dimensions on one row (`certification_status` advanced by
  # part-by-part review, `compliance_status` advanced by placed-in-service,
  # covenant monitoring and recapture) which evolve on separate axes. Amendment
  # is a fork-join branching machine with divergent side-effect sets per branch.

  relationship_patterns:
    - one_to_many          # Project -> CostLineItem / PartApplication / Amendment / InvestorInterest / CreditClaim / RecaptureEvent / ComplianceCovenant
    - self_referential     # PartApplication.supersedes_application_id -> PartApplication.id
    - cross_aggregate      # Amendment.addresses_finding_id -> StandardFinding.id (crosses the PartApplication aggregate)
    - polymorphic_free     # no polymorphic FKs: every FK names exactly one parent entity

  role_model: segregation_of_duties
  # The Reviewer who issues the SHPO recommendation on a PartApplication may not
  # be the Reviewer who issues the NPS determination on that same application.
  # Developer / ShpoReviewer / NpsReviewer / ComplianceMonitor / InvestorAdmin own
  # disjoint operation sets; PlatformAdmin only seeds identities and reads.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: building or complex name as it appears on the nomination
        constraints: "1..120 chars, non-blank"
      - name: street_address
        type: string
        source: input
        description: street address of the rehabilitated building
        constraints: "1..160 chars"
      - name: city
        type: string
        source: input
        description: municipality of the building
        constraints: "1..80 chars"
      - name: state_code
        type: string
        source: input
        description: two-letter USPS state code of the building
        constraints: "exactly 2 chars, uppercase A-Z"
      - name: year_built
        type: integer
        source: input
        description: construction year used by the evaluation of significance
        constraints: "1600..2010 inclusive"
      - name: listing_status
        type: enum
        source: input
        description: register listing posture at intake
        default: NOT_LISTED
        constraints: "NOT_LISTED | INDIVIDUAL_LISTED | DISTRICT_CONTRIBUTING | DISTRICT_NONCONTRIBUTING"
      - name: evaluation_status
        type: enum
        source: computed
        description: >
          evaluation-of-significance outcome; set to CERTIFIED_HISTORIC by the
          Part 1 NPS determination cascade (determination == APPROVED) and to
          NON_CERTIFIED when the Part 1 determination is DENIED
        default: UNEVALUATED
        constraints: "UNEVALUATED | CERTIFIED_HISTORIC | NON_CERTIFIED"
      - name: certified_at
        type: datetime
        source: computed
        description: logical-clock instant at which evaluation_status became CERTIFIED_HISTORIC; null before that
        default: null
      - name: open_project_count
        type: integer
        source: computed
        description: >
          count of Project rows where property_id == this.id AND
          certification_status IN {PRE_CERTIFICATION, PART1_CERTIFIED, PART2_APPROVED, PART3_CERTIFIED}
        default: 0

  - name: Developer
    parent: null
    common_fields: false
    fields:
      - name: legal_name
        type: string
        source: input
        description: legal name of the taxpayer that owns the rehabilitation
        constraints: "1..120 chars, non-blank"
      - name: taxpayer_id_last4
        type: string
        source: input
        description: last four characters of the taxpayer identification number
        constraints: "exactly 4 chars, digits only"
      - name: entity_type
        type: enum
        source: input
        description: tax classification of the owning taxpayer
        constraints: "C_CORP | S_CORP | PARTNERSHIP | LLC"
      - name: contact_email
        type: string
        source: input
        description: notification address for review correspondence
        default: null
        constraints: "must contain '@' when supplied"

  - name: Reviewer
    parent: null
    common_fields: false
    fields:
      - name: full_name
        type: string
        source: input
        description: reviewer name recorded on the determination
        constraints: "1..80 chars, non-blank"
      - name: agency
        type: enum
        source: input
        description: reviewing agency that this reviewer acts for
        constraints: "SHPO | NPS"
      - name: state_code
        type: string
        source: input
        description: two-letter USPS state code of the reviewer's office
        constraints: "exactly 2 chars, uppercase A-Z"
      - name: credential_status
        type: enum
        source: input
        description: credential posture; only ACTIVE reviewers may be assigned or may decide
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: Project
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the building being rehabilitated"
      - name: developer_id
        type: string
        source: input
        description: "FK -> Developer.id; owning taxpayer; must equal X-User-ID of the acting Developer"
      - name: project_name
        type: string
        source: input
        description: internal project label
        constraints: "1..120 chars, non-blank"
      - name: structure_type
        type: enum
        source: input
        description: investor structure elected for the project
        constraints: "MASTER_LEASE | SINGLE_TIER"
      - name: adjusted_basis_cents
        type: integer
        source: input
        description: adjusted basis of the building at the start of the measuring period, in cents
        constraints: ">= 0"
      - name: measuring_period_months
        type: integer
        source: input
        description: length of the substantial-rehabilitation measuring period in whole months
        constraints: "exactly 24 or exactly 60"
      - name: measuring_period_start_date
        type: string
        source: input
        description: inclusive first date of the measuring period (ISO 8601 calendar date)
        constraints: "YYYY-MM-DD"
      - name: measuring_period_end_date
        type: string
        source: computed
        description: >
          exclusive upper bound of the measuring period = measuring_period_start_date
          advanced by measuring_period_months calendar months, same day-of-month
        constraints: "YYYY-MM-DD"
      - name: certification_status
        type: enum
        source: computed
        description: >
          part-by-part certification dimension; advanced only by PartApplication
          determinations (Part 1 -> PART1_CERTIFIED, Part 2 -> PART2_APPROVED,
          Part 3 -> PART3_CERTIFIED) and set to DECERTIFIED by a Part 1 DENIED
          determination on the first application
        default: PRE_CERTIFICATION
        constraints: "PRE_CERTIFICATION | PART1_CERTIFIED | PART2_APPROVED | PART3_CERTIFIED | DECERTIFIED"
      - name: compliance_status
        type: enum
        source: computed
        description: >
          post-certification monitoring dimension, independent of
          certification_status; advanced by Part 3 certification, covenant
          attestation outcomes, recapture assessment and recapture settlement
        default: NOT_MONITORED
        constraints: "NOT_MONITORED | IN_SERVICE_MONITORING | CURE_PENDING | COMPLIANT_CLOSED | RECAPTURED"
      - name: qre_total_final_cents
        type: integer
        source: computed
        description: FINAL-variant qualified rehabilitation expenditure total (calculations.qre_totals)
        default: 0
      - name: qre_total_provisional_cents
        type: integer
        source: computed
        description: PROVISIONAL-variant qualified rehabilitation expenditure total (calculations.qre_totals)
        default: 0
      - name: nonqualified_total_cents
        type: integer
        source: computed
        description: in-period non-qualified cost total including developer-fee excess (calculations.qre_totals)
        default: 0
      - name: classified_cost_total_cents
        type: integer
        source: computed
        description: >
          conserved quantity for the reclassification invariant: sum of
          CostLineItem.amount_cents for this project where
          classification IN {QRE, NON_QRE, LOCKED_QRE, LOCKED_NON_QRE}
          AND in_measuring_period == true
        default: 0
      - name: developer_fee_disallowed_cents
        type: integer
        source: computed
        description: developer-fee amount above the 15% hard-cost cap, reallocated to nonqualified_total_cents
        default: 0
      - name: substantial_test_threshold_cents
        type: integer
        source: computed
        description: "max(adjusted_basis_cents, SUBSTANTIAL_TEST_FLOOR_CENTS) (calculations.substantial_rehabilitation_test)"
        default: 500000
      - name: substantial_test_status
        type: enum
        source: computed
        description: MET when qre_total_final_cents >= substantial_test_threshold_cents, else NOT_MET
        default: NOT_MET
        constraints: "NOT_MET | MET"
      - name: placed_in_service_date
        type: string
        source: input
        description: placed-in-service date declared through POST /projects/{id}/place-in-service; null before that
        default: null
        constraints: "YYYY-MM-DD"
      - name: annual_credit_cents
        type: integer
        source: computed
        description: >
          per-year ratable credit (calculations.ratable_credit_schedule); recomputed
          on every qre_total_final_cents change until certification_status becomes
          PART3_CERTIFIED, then frozen
        default: 0
      - name: total_claimable_credit_cents
        type: integer
        source: computed
        description: "annual_credit_cents * RATABLE_YEARS (calculations.ratable_credit_schedule)"
        default: 0
      - name: credit_claimed_to_date_cents
        type: integer
        source: computed
        description: sum of net_claim_cents over CreditClaim rows of this project with status IN {FILED, ADJUSTED}
        default: 0
      - name: credit_recaptured_cents
        type: integer
        source: computed
        description: cumulative recapture offsets actually applied against filed claims
        default: 0
      - name: credit_unclaimed_cents
        type: integer
        source: computed
        description: "total_claimable_credit_cents - credit_claimed_to_date_cents - credit_recaptured_cents"
        default: 0
      - name: recapture_balance_cents
        type: integer
        source: computed
        description: outstanding recapture obligation awaiting offset against a future claim
        default: 0
      - name: max_investor_risk_score
        type: integer
        source: computed
        description: >
          max disqualification_risk_score over InvestorInterest rows of this project
          with status == ADMITTED; 0 when no ADMITTED interest exists
        default: 0
      - name: frozen_at_certification
        type: boolean
        source: computed
        description: true once certification_status == PART3_CERTIFIED; annual_credit_cents stops being recomputed
        default: false

  - name: PartApplication
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project this part application belongs to"
      - name: part_number
        type: integer
        source: input
        description: which part of the certification application this row carries
        constraints: "exactly 1, 2 or 3"
      - name: narrative
        type: string
        source: input
        description: description of significance (Part 1), rehabilitation work (Part 2) or completion (Part 3)
        constraints: "1..2000 chars, non-blank"
      - name: status
        type: enum
        source: computed
        description: review lifecycle state (state_machines.PartApplication)
        default: DRAFT
        constraints: "DRAFT | SHPO_REVIEW | NPS_REVIEW | CONDITIONAL | REVISION_REQUIRED | APPROVED | SUPERSEDED"
      - name: supersedes_application_id
        type: string
        source: computed
        description: >
          FK -> PartApplication.id; set by the server at creation to the id of the
          non-terminal same-part application this row supersedes; null when no such
          application existed
        default: null
      - name: review_round
        type: integer
        source: computed
        description: incremented by one on every resubmission of this row
        default: 1
      - name: shpo_reviewer_id
        type: string
        source: computed
        description: "FK -> Reviewer.id; SHPO reviewer supplied on submit; null while DRAFT"
        default: null
      - name: nps_reviewer_id
        type: string
        source: computed
        description: "FK -> Reviewer.id; X-User-ID of the NpsReviewer who issued the determination; null before that"
        default: null
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent submit or resubmit
        default: null
      - name: review_window_end
        type: datetime
        source: computed
        description: "submitted_at + SHPO_REVIEW_WINDOW_DAYS days; closed upper bound of the reviewer occupation interval"
        default: null
      - name: decision_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent NPS determination
        default: null
      - name: shpo_recommendation
        type: enum
        source: computed
        description: SHPO recommendation; reset to NONE on resubmission
        default: NONE
        constraints: "NONE | RECOMMEND_APPROVAL | RECOMMEND_DENIAL"
      - name: determination
        type: enum
        source: computed
        description: NPS determination; reset to NONE on resubmission
        default: NONE
        constraints: "NONE | APPROVED | CONDITIONAL | DENIED"
      - name: unresolved_condition_count
        type: integer
        source: computed
        description: >
          count of StandardFinding rows of this application with
          severity == CONDITION AND resolution_state == UNRESOLVED
        default: 0
      - name: unresolved_violation_count
        type: integer
        source: computed
        description: >
          count of StandardFinding rows of this application with
          severity == VIOLATION AND resolution_state == UNRESOLVED
        default: 0

  - name: StandardFinding
    parent: PartApplication
    common_fields: true
    fields:
      - name: part_application_id
        type: string
        source: input
        description: "FK -> PartApplication.id; the application under review when the finding was raised"
      - name: standard_number
        type: integer
        source: input
        description: which of the ten preservation standards the finding cites
        constraints: "1..10 inclusive"
      - name: severity
        type: enum
        source: input
        description: >
          ADVISORY is informational, CONDITION must be cleared by a concurred
          Amendment before approval, VIOLATION blocks approval and cannot be waived
        constraints: "ADVISORY | CONDITION | VIOLATION"
      - name: description
        type: string
        source: input
        description: reviewer text describing the deviation from the standard
        constraints: "1..1000 chars, non-blank"
      - name: resolution_state
        type: enum
        source: computed
        description: >
          UNRESOLVED at creation; set to RESOLVED by the concurrence cascade of the
          Amendment whose addresses_finding_id equals this row; set to WAIVED when an
          NPS determination lists this row in waived_finding_ids
        default: UNRESOLVED
        constraints: "UNRESOLVED | RESOLVED | WAIVED"

  - name: CostLineItem
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; the project that incurred this cost"
      - name: vendor_name
        type: string
        source: input
        description: payee recorded on the invoice
        constraints: "1..120 chars, non-blank"
      - name: category
        type: enum
        source: input
        description: cost category driving statutory QRE eligibility
        constraints: >
          HARD_CONSTRUCTION | ARCHITECTURAL_ENGINEERING | DEVELOPER_FEE |
          CONSTRUCTION_INTEREST | ACQUISITION | ENLARGEMENT | SITE_WORK |
          PERSONAL_PROPERTY | FFE | LANDSCAPING
      - name: amount_cents
        type: integer
        source: input
        description: invoiced amount in cents
        constraints: "> 0"
      - name: incurred_date
        type: string
        source: input
        description: date the cost was incurred (ISO 8601 calendar date)
        constraints: "YYYY-MM-DD"
      - name: classification
        type: enum
        source: computed
        description: >
          QRE segregation state (state_machines.CostLineItem); optional
          `classification` input on creation may set QRE or NON_QRE directly,
          otherwise PENDING_CLASSIFICATION
        default: PENDING_CLASSIFICATION
        constraints: "PENDING_CLASSIFICATION | QRE | NON_QRE | LOCKED_QRE | LOCKED_NON_QRE"
      - name: exclusion_reason
        type: enum
        source: computed
        description: >
          why the item sits outside QRE; mirrors the classify request's
          exclusion_reason when a ComplianceMonitor supplies one, otherwise derived
          (NONQUALIFIED_CATEGORY for statutorily excluded categories,
          OUTSIDE_MEASURING_PERIOD when in_measuring_period == false,
          DEVELOPER_FEE_CAP for the disallowed fee slice)
        default: NONE
        constraints: "NONE | NONQUALIFIED_CATEGORY | OUTSIDE_MEASURING_PERIOD | DEVELOPER_FEE_CAP | REVIEWER_DISALLOWED"
      - name: in_measuring_period
        type: boolean
        source: computed
        description: >
          true iff project.measuring_period_start_date <= incurred_date <
          project.measuring_period_end_date (half-open window)
        default: false
      - name: reclassification_count
        type: integer
        source: computed
        description: number of successful POST /cost-line-items/{id}/classify calls applied to this row
        default: 0

  - name: Amendment
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose construction scope is changing"
      - name: part_application_id
        type: string
        source: input
        description: "FK -> PartApplication.id; the Part 2 application whose approved scope the change alters"
      - name: addresses_finding_id
        type: string
        source: input
        description: "FK -> StandardFinding.id; finding this amendment clears; null for a pure scope change"
        default: null
      - name: scope_category
        type: enum
        source: input
        description: nature of the construction change
        constraints: >
          WINDOW_REPLACEMENT | MASONRY_TREATMENT | INTERIOR_PARTITION |
          ROOF_ALTERATION | SYSTEMS_UPGRADE | ADDITION
      - name: change_description
        type: string
        source: input
        description: narrative of the construction change submitted for concurrence
        constraints: "1..1000 chars, non-blank"
      - name: cost_delta_cents
        type: integer
        source: input
        description: signed change in project cost attributable to this amendment, in cents
      - name: requires_nps_concurrence
        type: boolean
        source: computed
        description: >
          true iff scope_category IN {ADDITION, ROOF_ALTERATION}
          OR abs(cost_delta_cents) >= NPS_CONCURRENCE_DELTA_CENTS
          OR the addressed finding has severity == VIOLATION
        default: false
      - name: status
        type: enum
        source: computed
        description: concurrence lifecycle (state_machines.Amendment)
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | SHPO_CONCURRED | CONCURRED | OBJECTED"
      - name: shpo_decision
        type: enum
        source: computed
        description: decision recorded by the acting SHPO reviewer
        default: NONE
        constraints: "NONE | CONCUR | OBJECT"
      - name: nps_decision
        type: enum
        source: computed
        description: decision recorded by the acting NPS reviewer
        default: NONE
        constraints: "NONE | CONCUR | OBJECT"
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of submission for concurrence
        default: null

  - name: InvestorInterest
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose credit this party takes an interest in"
      - name: kind
        type: enum
        source: input
        description: >
          MASTER_LEASE_LESSEE is the master tenant that receives the credit by
          pass-through election; DIRECT_PARTNER is a single-tier pass-through partner
        constraints: "MASTER_LEASE_LESSEE | DIRECT_PARTNER"
      - name: party_legal_name
        type: string
        source: input
        description: legal name of the investing party
        constraints: "1..120 chars, non-blank"
      - name: party_tax_status
        type: enum
        source: input
        description: tax status of the investing party; drives disqualification risk
        constraints: "TAXABLE_C_CORP | PARTNERSHIP | TAX_EXEMPT_ORG | GOVERNMENTAL_UNIT"
      - name: capital_committed_cents
        type: integer
        source: input
        description: capital the party commits to the project, in cents
        constraints: "> 0"
      - name: credit_allocation_pct
        type: number
        source: input
        description: percentage of the project credit allocated to this party
        constraints: "0 < value <= 100, at most 2 decimal places"
      - name: lease_term_years
        type: integer
        source: input
        description: master-lease term in whole years; required iff kind == MASTER_LEASE_LESSEE, else must be omitted
        default: null
        constraints: "1..99 when supplied"
      - name: pass_through_election
        type: enum
        source: computed
        description: >
          NOT_APPLICABLE for kind == DIRECT_PARTNER; PENDING at creation for
          kind == MASTER_LEASE_LESSEE; ELECTED after POST /investor-interests/{id}/elect-pass-through
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | PENDING | ELECTED"
      - name: election_at
        type: datetime
        source: computed
        description: logical-clock instant of the pass-through election; null before that
        default: null
      - name: status
        type: enum
        source: computed
        description: ADMITTED at creation; DISQUALIFIED by the LEASE_TO_DISQUALIFIED recapture cascade
        default: ADMITTED
        constraints: "ADMITTED | DISQUALIFIED"
      - name: disqualification_risk_score
        type: integer
        source: computed
        description: calculations.investor_disqualification_risk output, 0..100
        default: 0
      - name: risk_variant_applied
        type: enum
        source: computed
        description: which variant of calculations.investor_disqualification_risk produced disqualification_risk_score
        default: ADMISSION
        constraints: "ADMISSION | IN_SERVICE"

  - name: CreditClaim
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project whose ratable credit slice is being claimed"
      - name: tax_year
        type: integer
        source: input
        description: tax year the claim is filed for
        constraints: "2000..2100"
      - name: claim_sequence
        type: integer
        source: computed
        description: >
          1-based position of this claim among the project's claims ordered by
          tax_year ASC (ties impossible: tax_year is unique per project)
        default: 1
      - name: gross_credit_cents
        type: integer
        source: computed
        description: project.annual_credit_cents captured at claim creation
        default: 0
      - name: recapture_offset_cents
        type: integer
        source: computed
        description: "min(gross_credit_cents, project.recapture_balance_cents) evaluated at filing (calculations.claim_settlement)"
        default: 0
      - name: net_claim_cents
        type: integer
        source: computed
        description: "gross_credit_cents - recapture_offset_cents, evaluated at filing"
        default: 0
      - name: status
        type: enum
        source: computed
        description: claim lifecycle (state_machines.CreditClaim)
        default: DRAFT
        constraints: "DRAFT | FILED | ADJUSTED"
      - name: filed_at
        type: datetime
        source: computed
        description: logical-clock instant of filing; null while DRAFT
        default: null
      - name: filed_by_user_id
        type: string
        source: computed
        description: X-User-ID of the InvestorAdmin who filed the claim (audit only; not a foreign-key constraint)
        default: null

  - name: RecaptureEvent
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project under five-year recapture monitoring"
      - name: event_type
        type: enum
        source: input
        description: recapture trigger; SUBSTANTIAL_TEST_FAILURE rows are only created by the system cascade
        constraints: >
          OWNERSHIP_TRANSFER | CESSATION_OF_USE | LEASE_TO_DISQUALIFIED |
          COVENANT_BREACH | SUBSTANTIAL_TEST_FAILURE
      - name: event_date
        type: string
        source: input
        description: date the recapture trigger occurred (ISO 8601 calendar date)
        constraints: "YYYY-MM-DD"
      - name: full_years_elapsed
        type: integer
        source: computed
        description: "floor(days_between(project.placed_in_service_date, event_date) / DAYS_PER_YEAR)"
        default: 0
      - name: recapture_pct
        type: number
        source: computed
        description: fraction of credit claimed to date subject to recapture (calculations.recapture_assessment)
        default: 0
      - name: recapture_amount_cents
        type: integer
        source: computed
        description: assessed recapture obligation in cents (calculations.recapture_assessment)
        default: 0
      - name: status
        type: enum
        source: computed
        description: ASSESSED at creation; SETTLED once offsets have consumed recapture_amount_cents
        default: ASSESSED
        constraints: "ASSESSED | SETTLED"
      - name: source
        type: enum
        source: computed
        description: REPORTED for ComplianceMonitor-created rows; SYSTEM_DERIVED for cascade-created rows
        default: REPORTED
        constraints: "REPORTED | SYSTEM_DERIVED"

  - name: ComplianceCovenant
    parent: null
    common_fields: true
    fields:
      - name: project_id
        type: string
        source: input
        description: "FK -> Project.id; project bound by this covenant"
      - name: covenant_type
        type: enum
        source: input
        description: subject of the covenant
        constraints: "USE_RESTRICTION | OWNERSHIP_HOLD | MAINTENANCE_STANDARD | INSURANCE_COVERAGE | REPORTING"
      - name: monitoring_frequency
        type: enum
        source: input
        description: attestation cadence
        constraints: "ANNUAL | SEMIANNUAL"
      - name: window_start_date
        type: string
        source: input
        description: inclusive first date of the covenant monitoring window
        constraints: "YYYY-MM-DD"
      - name: window_end_date
        type: string
        source: input
        description: inclusive last date of the covenant monitoring window
        constraints: "YYYY-MM-DD, strictly after window_start_date"
      - name: status
        type: enum
        source: computed
        description: covenant lifecycle (state_machines.ComplianceCovenant)
        default: PENDING_ATTESTATION
        constraints: "PENDING_ATTESTATION | COMPLIANT | BREACHED | CURED"
      - name: attestation_count
        type: integer
        source: computed
        description: number of accepted attestations recorded against this covenant
        default: 0
      - name: exception_count
        type: integer
        source: computed
        description: number of attestations recorded with outcome == EXCEPTION
        default: 0
      - name: last_attested_period_end
        type: string
        source: computed
        description: period_end_date of the most recent accepted attestation; null before the first
        default: null
      - name: cure_deadline_date
        type: string
        source: computed
        description: "window_end_date advanced by CURE_WINDOW_DAYS (90) days; set when status becomes BREACHED"
        default: null

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: PartApplication
    state_field: status
    initial_state: DRAFT
    terminal_states: [APPROVED, SUPERSEDED]
    shape: cyclic
    transitions:
      - from: DRAFT
        to: SHPO_REVIEW
        trigger: "POST /part-applications/{id}/submit"
        actor: Developer
        preconditions:
          - "status == DRAFT"
          - "reviewer identified by shpo_reviewer_id exists and Reviewer.agency == SHPO and Reviewer.credential_status == ACTIVE"
          - "property.listing_status != DISTRICT_NONCONTRIBUTING"
          - "for part_number IN {2, 3}: property.evaluation_status == CERTIFIED_HISTORIC"
          - "for part_number == 3: project.placed_in_service_date != null"
          - "count of other PartApplication rows with shpo_reviewer_id == this.shpo_reviewer_id AND status IN {SHPO_REVIEW, NPS_REVIEW, CONDITIONAL} whose closed review window [submitted_at date, review_window_end date] overlaps this application's prospective closed window [now date, now date + SHPO_REVIEW_WINDOW_DAYS] is < REVIEWER_WINDOW_CAPACITY"
        side_effects:
          - "set shpo_reviewer_id from the request body"
          - "set submitted_at = logical clock now"
          - "set review_window_end = submitted_at + SHPO_REVIEW_WINDOW_DAYS days"
          - "increments PartApplication.version by 1"
      - from: SHPO_REVIEW
        to: NPS_REVIEW
        trigger: "POST /part-applications/{id}/shpo-recommend"
        actor: ShpoReviewer
        preconditions:
          - "status == SHPO_REVIEW"
          - "X-User-ID == shpo_reviewer_id"
          - "Reviewer.credential_status == ACTIVE"
        side_effects:
          - "set shpo_recommendation from the request body"
          - "the reviewer occupation interval is released: status leaves SHPO_REVIEW so it no longer counts toward REVIEWER_CONCURRENT_CAP"
          - "increments PartApplication.version by 1"
      - from: NPS_REVIEW
        to: APPROVED
        trigger: "POST /part-applications/{id}/nps-determination with determination == APPROVED"
        actor: NpsReviewer
        preconditions:
          - "status == NPS_REVIEW"
          - "X-User-ID identifies a Reviewer with agency == NPS and credential_status == ACTIVE"
          - "X-User-ID != shpo_reviewer_id (segregation of duties)"
          - "unresolved_violation_count == 0 after applying waived_finding_ids"
          - "no StandardFinding listed in waived_finding_ids has severity == VIOLATION"
          - "unresolved_condition_count == 0 after applying waived_finding_ids"
          - "for part_number == 3: project.substantial_test_status == MET"
        side_effects:
          - "set determination = APPROVED, nps_reviewer_id = X-User-ID, decision_at = logical clock now"
          - "set resolution_state = WAIVED on every StandardFinding listed in waived_finding_ids"
          - "cascade hop 1: for part_number == 1, Property.evaluation_status -> CERTIFIED_HISTORIC and Property.certified_at = now"
          - "cascade hop 2: Project.certification_status -> PART1_CERTIFIED (part 1) | PART2_APPROVED (part 2) | PART3_CERTIFIED (part 3)"
          - "cascade hop 3 (part 3 only): Project.frozen_at_certification -> true, freezing annual_credit_cents and total_claimable_credit_cents (compliance_status already left NOT_MONITORED at place-in-service)"
          - "cascade hop 3 (part 3 only): every CostLineItem of the project with classification == QRE -> LOCKED_QRE and classification == NON_QRE -> LOCKED_NON_QRE"
          - "increments PartApplication.version by 1; increments Project.version by 1; increments Property.version by 1 when hop 1 fires"
      - from: NPS_REVIEW
        to: CONDITIONAL
        trigger: "POST /part-applications/{id}/nps-determination with determination == CONDITIONAL"
        actor: NpsReviewer
        preconditions:
          - "status == NPS_REVIEW"
          - "X-User-ID identifies a Reviewer with agency == NPS and credential_status == ACTIVE"
          - "X-User-ID != shpo_reviewer_id (segregation of duties)"
          - "unresolved_violation_count == 0 after applying waived_finding_ids"
          - "unresolved_condition_count >= 1 after applying waived_finding_ids"
        side_effects:
          - "set determination = CONDITIONAL, nps_reviewer_id = X-User-ID, decision_at = logical clock now"
          - "set resolution_state = WAIVED on every StandardFinding listed in waived_finding_ids"
          - "Project.certification_status is NOT advanced"
          - "increments PartApplication.version by 1"
        note: "CONDITIONAL parks the application until every CONDITION finding is cleared by a concurred Amendment."
      - from: NPS_REVIEW
        to: REVISION_REQUIRED
        trigger: "POST /part-applications/{id}/nps-determination with determination == DENIED"
        actor: NpsReviewer
        preconditions:
          - "status == NPS_REVIEW"
          - "X-User-ID identifies a Reviewer with agency == NPS and credential_status == ACTIVE"
          - "X-User-ID != shpo_reviewer_id (segregation of duties)"
        side_effects:
          - "set determination = DENIED, nps_reviewer_id = X-User-ID, decision_at = logical clock now"
          - "for part_number == 1 on a project whose certification_status == PRE_CERTIFICATION: Property.evaluation_status -> NON_CERTIFIED and Project.certification_status -> DECERTIFIED"
          - "increments PartApplication.version by 1"
      - from: REVISION_REQUIRED
        to: SHPO_REVIEW
        trigger: "POST /part-applications/{id}/resubmit"
        actor: Developer
        preconditions:
          - "status == REVISION_REQUIRED"
          - "project.developer_id == X-User-ID"
          - "reviewer identified by the existing shpo_reviewer_id still has credential_status == ACTIVE"
          - "reviewer occupation capacity check as in DRAFT -> SHPO_REVIEW"
        side_effects:
          - "replace narrative with the request body narrative"
          - "review_round += 1"
          - "reset shpo_recommendation -> NONE, determination -> NONE, nps_reviewer_id -> null, decision_at -> null"
          - "set submitted_at = logical clock now and review_window_end = submitted_at + SHPO_REVIEW_WINDOW_DAYS days"
          - "increments PartApplication.version by 1"
        note: "The revision loop; the same row re-enters review instead of a new row being created."
      - from: CONDITIONAL
        to: APPROVED
        trigger: "system event: the last UNRESOLVED CONDITION finding of this application is resolved by an Amendment concurrence cascade"
        actor: system
        preconditions:
          - "status == CONDITIONAL"
          - "unresolved_condition_count == 0 immediately after the finding was set to RESOLVED"
          - "unresolved_violation_count == 0"
        side_effects:
          - "set determination = APPROVED and decision_at = logical clock now"
          - "cascade: Project.certification_status -> PART1_CERTIFIED (part 1) | PART2_APPROVED (part 2) | PART3_CERTIFIED (part 3)"
          - "increments PartApplication.version by 1; increments Project.version by 1"
      - from: CONDITIONAL
        to: REVISION_REQUIRED
        trigger: "system event: an Amendment addressing a CONDITION finding of this application is OBJECTED"
        actor: system
        preconditions:
          - "status == CONDITIONAL"
          - "the objected Amendment's addresses_finding_id names a StandardFinding of this application with severity == CONDITION and resolution_state == UNRESOLVED"
        side_effects:
          - "set determination = DENIED and decision_at = logical clock now"
          - "increments PartApplication.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system event: POST /part-applications creates a new row with the same project_id and part_number"
        actor: system
        preconditions:
          - "status IN {DRAFT, SHPO_REVIEW, NPS_REVIEW, CONDITIONAL, REVISION_REQUIRED}"
        side_effects:
          - "the new row's supersedes_application_id is set to this row's id"
          - "the reviewer occupation interval of this row is released"
          - "increments PartApplication.version by 1"
        note: "Applies from every non-terminal state, not only DRAFT; APPROVED and SUPERSEDED rows are never superseded (see ERR_PART_ALREADY_CERTIFIED)."

  - entity: Project
    state_field: certification_status
    initial_state: PRE_CERTIFICATION
    terminal_states: [DECERTIFIED]
    shape: compound
    transitions:
      - from: PRE_CERTIFICATION
        to: PART1_CERTIFIED
        trigger: "system event: Part 1 PartApplication reaches APPROVED"
        actor: system
        preconditions:
          - "the approved application has part_number == 1 and project_id == this.id"
        side_effects:
          - "Property.evaluation_status -> CERTIFIED_HISTORIC (same cascade)"
          - "increments Project.version by 1"
      - from: PART1_CERTIFIED
        to: PART2_APPROVED
        trigger: "system event: Part 2 PartApplication reaches APPROVED"
        actor: system
        preconditions:
          - "the approved application has part_number == 2 and project_id == this.id"
        side_effects:
          - "increments Project.version by 1"
      - from: PART2_APPROVED
        to: PART3_CERTIFIED
        trigger: "system event: Part 3 PartApplication reaches APPROVED"
        actor: system
        preconditions:
          - "the approved application has part_number == 3 and project_id == this.id"
          - "placed_in_service_date != null"
          - "substantial_test_status == MET"
        side_effects:
          - "frozen_at_certification -> true; annual_credit_cents and total_claimable_credit_cents stop being recomputed"
          - "every CostLineItem with classification == QRE -> LOCKED_QRE; NON_QRE -> LOCKED_NON_QRE"
          - "increments Project.version by 1"
      - from: PRE_CERTIFICATION
        to: DECERTIFIED
        trigger: "system event: Part 1 PartApplication determination == DENIED"
        actor: system
        preconditions:
          - "certification_status == PRE_CERTIFICATION"
        side_effects:
          - "Property.evaluation_status -> NON_CERTIFIED"
          - "increments Project.version by 1"
        note: "Terminal: no part application may be created on a DECERTIFIED project."

  - entity: Project
    state_field: compliance_status
    initial_state: NOT_MONITORED
    terminal_states: [COMPLIANT_CLOSED, RECAPTURED]
    shape: parallel
    note: >
      Second independent state dimension on the same Project row. It advances only
      on the place-in-service declaration, covenant attestation outcomes, recapture
      assessment and recapture settlement. No certification_status transition ever
      writes it, which is what makes the two dimensions independent: monitoring
      starts at place-in-service, which is legal from PART2_APPROVED onward.
    transitions:
      - from: NOT_MONITORED
        to: IN_SERVICE_MONITORING
        trigger: "POST /projects/{id}/place-in-service"
        actor: Developer
        preconditions:
          - "compliance_status == NOT_MONITORED"
          - "placed_in_service_date becomes non-null in this same write"
        side_effects:
          - "increments Project.version by 1"
      - from: IN_SERVICE_MONITORING
        to: CURE_PENDING
        trigger: "system event: a ComplianceCovenant of this project becomes BREACHED, or a RecaptureEvent is ASSESSED with recapture_amount_cents > 0"
        actor: system
        preconditions:
          - "compliance_status == IN_SERVICE_MONITORING"
          - "when the trigger is a recapture assessment: RecaptureEvent.event_type != OWNERSHIP_TRANSFER"
        side_effects:
          - "recapture_balance_cents += RecaptureEvent.recapture_amount_cents when the trigger is a recapture assessment"
          - "recompute disqualification_risk_score with the IN_SERVICE variant for every ADMITTED InvestorInterest of this project; refresh max_investor_risk_score"
          - "increments Project.version by 1"
      - from: CURE_PENDING
        to: IN_SERVICE_MONITORING
        trigger: "system event: recapture_balance_cents reaches 0 through a claim offset, or the last BREACHED covenant becomes CURED"
        actor: system
        preconditions:
          - "compliance_status == CURE_PENDING"
          - "recapture_balance_cents == 0"
          - "no ComplianceCovenant of this project has status == BREACHED"
        side_effects:
          - "every RecaptureEvent of this project with status == ASSESSED and fully offset -> SETTLED"
          - "increments Project.version by 1"
      - from: IN_SERVICE_MONITORING
        to: COMPLIANT_CLOSED
        trigger: "system event: an accepted attestation whose period_end_date >= placed_in_service_date + COMPLIANCE_PERIOD_YEARS*DAYS_PER_YEAR days closes the last covenant"
        actor: system
        preconditions:
          - "compliance_status == IN_SERVICE_MONITORING"
          - "every ComplianceCovenant of this project has status == COMPLIANT"
          - "recapture_balance_cents == 0"
        side_effects:
          - "increments Project.version by 1"
        note: "Terminal: no further RecaptureEvent may be created (five-year compliance period is over)."
      - from: IN_SERVICE_MONITORING
        to: RECAPTURED
        trigger: "POST /recapture-events with event_type == OWNERSHIP_TRANSFER"
        actor: ComplianceMonitor
        preconditions:
          - "compliance_status IN {IN_SERVICE_MONITORING, CURE_PENDING}"
          - "event_type == OWNERSHIP_TRANSFER"
        side_effects:
          - "recapture_balance_cents += recapture_amount_cents"
          - "every InvestorInterest of this project with kind == MASTER_LEASE_LESSEE -> DISQUALIFIED"
          - "increments Project.version by 1"
        note: "Terminal: no further credit claim may be created or filed."

  - entity: Amendment
    state_field: status
    initial_state: DRAFT
    terminal_states: [CONCURRED, OBJECTED]
    shape: branching
    note: >
      Fork-join: SUBMITTED forks on the acting reviewer's agency. When
      requires_nps_concurrence is false the SHPO concurrence alone joins to
      CONCURRED; when it is true the join needs both agencies, and either agency's
      OBJECT decision short-circuits to OBJECTED with a different side-effect set.
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /amendments/{id}/submit"
        actor: Developer
        preconditions:
          - "status == DRAFT"
          - "project.developer_id == X-User-ID"
          - "the referenced PartApplication has part_number == 2 and status IN {CONDITIONAL, APPROVED}"
        side_effects:
          - "set submitted_at = logical clock now"
          - "increments Amendment.version by 1"
      - from: SUBMITTED
        to: CONCURRED
        trigger: "POST /amendments/{id}/concur with decision == CONCUR by a Reviewer whose agency == SHPO, when requires_nps_concurrence == false"
        actor: ShpoReviewer
        preconditions:
          - "status == SUBMITTED"
          - "requires_nps_concurrence == false"
          - "acting Reviewer.agency == SHPO and credential_status == ACTIVE"
          - "when addresses_finding_id != null: that StandardFinding has resolution_state == UNRESOLVED and part_application_id == this.part_application_id"
        side_effects:
          - "set shpo_decision = CONCUR"
          - "cascade hop 1: the addressed StandardFinding.resolution_state -> RESOLVED"
          - "cascade hop 2: its PartApplication.unresolved_condition_count -= 1"
          - "cascade hop 3: when that count reaches 0 and the application status == CONDITIONAL, the application transitions CONDITIONAL -> APPROVED"
          - "cascade hop 4: Project.certification_status advances per the part number of that application"
          - "increments Amendment.version by 1; increments StandardFinding.version by 1; increments PartApplication.version by 1; increments Project.version by 1 when hop 4 fires"
      - from: SUBMITTED
        to: SHPO_CONCURRED
        trigger: "POST /amendments/{id}/concur with decision == CONCUR by a Reviewer whose agency == SHPO, when requires_nps_concurrence == true"
        actor: ShpoReviewer
        preconditions:
          - "status == SUBMITTED"
          - "requires_nps_concurrence == true"
          - "acting Reviewer.agency == SHPO and credential_status == ACTIVE"
        side_effects:
          - "set shpo_decision = CONCUR"
          - "no finding is resolved yet: the join is incomplete"
          - "increments Amendment.version by 1"
      - from: SHPO_CONCURRED
        to: CONCURRED
        trigger: "POST /amendments/{id}/concur with decision == CONCUR by a Reviewer whose agency == NPS"
        actor: NpsReviewer
        preconditions:
          - "status == SHPO_CONCURRED"
          - "acting Reviewer.agency == NPS and credential_status == ACTIVE"
          - "when addresses_finding_id != null: that StandardFinding has resolution_state == UNRESOLVED and part_application_id == this.part_application_id"
          - "the referenced PartApplication has unresolved_violation_count == 0"
        side_effects:
          - "set nps_decision = CONCUR"
          - "cascade hop 1: the addressed StandardFinding.resolution_state -> RESOLVED"
          - "cascade hop 2: its PartApplication.unresolved_condition_count -= 1"
          - "cascade hop 3: when that count reaches 0 and the application status == CONDITIONAL, the application transitions CONDITIONAL -> APPROVED"
          - "cascade hop 4: Project.certification_status advances per the part number of that application"
          - "increments Amendment.version by 1; increments StandardFinding.version by 1; increments PartApplication.version by 1; increments Project.version by 1 when hop 4 fires"
      - from: SUBMITTED
        to: OBJECTED
        trigger: "POST /amendments/{id}/concur with decision == OBJECT by a Reviewer whose agency == SHPO"
        actor: ShpoReviewer
        preconditions:
          - "status == SUBMITTED"
          - "acting Reviewer.agency == SHPO and credential_status == ACTIVE"
        side_effects:
          - "set shpo_decision = OBJECT"
          - "the addressed StandardFinding stays UNRESOLVED"
          - "when the addressed finding has severity == CONDITION and its application status == CONDITIONAL, that application transitions CONDITIONAL -> REVISION_REQUIRED"
          - "increments Amendment.version by 1"
      - from: SHPO_CONCURRED
        to: OBJECTED
        trigger: "POST /amendments/{id}/concur with decision == OBJECT by a Reviewer whose agency == NPS"
        actor: NpsReviewer
        preconditions:
          - "status == SHPO_CONCURRED"
          - "acting Reviewer.agency == NPS and credential_status == ACTIVE"
        side_effects:
          - "set nps_decision = OBJECT"
          - "the addressed StandardFinding stays UNRESOLVED"
          - "when the addressed finding has severity == CONDITION and its application status == CONDITIONAL, that application transitions CONDITIONAL -> REVISION_REQUIRED"
          - "increments Amendment.version by 1"

  - entity: CostLineItem
    state_field: classification
    initial_state: PENDING_CLASSIFICATION
    terminal_states: [LOCKED_QRE, LOCKED_NON_QRE]
    shape: cyclic
    transitions:
      - from: PENDING_CLASSIFICATION
        to: QRE
        trigger: "POST /cost-line-items/{id}/classify with classification == QRE (or POST /cost-line-items with classification == QRE)"
        actor: Developer
        preconditions:
          - "classification IN {PENDING_CLASSIFICATION, NON_QRE}"
          - "category NOT IN NON_QRE_CATEGORIES"
          - "in_measuring_period == true"
        side_effects:
          - "reclassification_count += 1 (classify endpoint only)"
          - "exclusion_reason -> NONE"
          - "recompute Project.qre_total_final_cents / qre_total_provisional_cents / nonqualified_total_cents / classified_cost_total_cents / developer_fee_disallowed_cents (calculations.qre_totals)"
          - "recompute Project.substantial_test_status (calculations.substantial_rehabilitation_test)"
          - "recompute Project.annual_credit_cents and total_claimable_credit_cents unless frozen_at_certification == true"
          - "increments CostLineItem.version by 1; increments Project.version by 1"
      - from: QRE
        to: NON_QRE
        trigger: "POST /cost-line-items/{id}/classify with classification == NON_QRE"
        actor: Developer
        preconditions:
          - "classification IN {PENDING_CLASSIFICATION, QRE}"
        side_effects:
          - "reclassification_count += 1"
          - "exclusion_reason -> the supplied value, or NONQUALIFIED_CATEGORY when category IN NON_QRE_CATEGORIES"
          - "recompute the same Project aggregates as PENDING_CLASSIFICATION -> QRE"
          - "cascade: when the recomputed substantial_test_status flips MET -> NOT_MET on a project with certification_status == PART3_CERTIFIED, a SYSTEM_DERIVED RecaptureEvent with event_type == SUBSTANTIAL_TEST_FAILURE is created"
          - "increments CostLineItem.version by 1; increments Project.version by 1"
      - from: NON_QRE
        to: QRE
        trigger: "POST /cost-line-items/{id}/classify with classification == QRE"
        actor: Developer
        preconditions:
          - "category NOT IN NON_QRE_CATEGORIES"
          - "in_measuring_period == true"
        side_effects:
          - "reclassification_count += 1"
          - "exclusion_reason -> NONE"
          - "the same Project aggregates are recomputed; the round trip restores classified_cost_total_cents exactly (compensating invariant)"
          - "increments CostLineItem.version by 1; increments Project.version by 1"
        note: "The reclassification cycle QRE -> NON_QRE -> QRE is the compensating-action pair for the classified-cost invariant."
      - from: QRE
        to: LOCKED_QRE
        trigger: "system event: Project.certification_status becomes PART3_CERTIFIED"
        actor: system
        preconditions:
          - "classification == QRE"
        side_effects:
          - "increments CostLineItem.version by 1"
      - from: NON_QRE
        to: LOCKED_NON_QRE
        trigger: "system event: Project.certification_status becomes PART3_CERTIFIED"
        actor: system
        preconditions:
          - "classification == NON_QRE"
        side_effects:
          - "increments CostLineItem.version by 1"
      - from: LOCKED_QRE
        to: LOCKED_NON_QRE
        trigger: "POST /cost-line-items/{id}/classify with classification == NON_QRE by a ComplianceMonitor (audit disallowance)"
        actor: ComplianceMonitor
        preconditions:
          - "classification IN {LOCKED_QRE, LOCKED_NON_QRE}"
          - "acting role is ComplianceMonitor (a Developer is rejected with ERR_COST_ITEM_LOCKED)"
        side_effects:
          - "reclassification_count += 1; exclusion_reason -> REVIEWER_DISALLOWED"
          - "recompute Project.qre_total_final_cents / nonqualified_total_cents / classified_cost_total_cents; annual_credit_cents stays frozen"
          - "cascade: substantial_test_status MET -> NOT_MET creates a SYSTEM_DERIVED SUBSTANTIAL_TEST_FAILURE RecaptureEvent, which raises Project.recapture_balance_cents and drives compliance_status IN_SERVICE_MONITORING -> CURE_PENDING"
          - "increments CostLineItem.version by 1; increments Project.version by 1"
        note: "Terminal for the Developer, reachable for the ComplianceMonitor only."

  - entity: ComplianceCovenant
    state_field: status
    initial_state: PENDING_ATTESTATION
    terminal_states: []
    shape: cyclic
    transitions:
      - from: PENDING_ATTESTATION
        to: COMPLIANT
        trigger: "POST /compliance-covenants/{id}/attest with outcome == SATISFIED"
        actor: Developer
        preconditions:
          - "status IN {PENDING_ATTESTATION, CURED}"
          - "project.developer_id == X-User-ID"
          - "period_end_date > last_attested_period_end when last_attested_period_end != null"
          - "period_end_date <= logical clock date"
        side_effects:
          - "attestation_count += 1; last_attested_period_end = period_end_date"
          - "when period_end_date >= placed_in_service_date + COMPLIANCE_PERIOD_YEARS*DAYS_PER_YEAR days and every covenant of the project is COMPLIANT and recapture_balance_cents == 0: Project.compliance_status -> COMPLIANT_CLOSED"
          - "increments ComplianceCovenant.version by 1"
      - from: PENDING_ATTESTATION
        to: BREACHED
        trigger: "POST /compliance-covenants/{id}/attest with outcome == EXCEPTION"
        actor: Developer
        preconditions:
          - "status IN {PENDING_ATTESTATION, COMPLIANT, CURED}"
          - "project.developer_id == X-User-ID"
          - "period_end_date > last_attested_period_end when last_attested_period_end != null"
        side_effects:
          - "attestation_count += 1; exception_count += 1; last_attested_period_end = period_end_date"
          - "cure_deadline_date = window_end_date + CURE_WINDOW_DAYS days"
          - "cascade hop 1: Project.compliance_status IN_SERVICE_MONITORING -> CURE_PENDING"
          - "cascade hop 2: every ADMITTED InvestorInterest of the project has disqualification_risk_score recomputed with the IN_SERVICE variant"
          - "cascade hop 3: Project.max_investor_risk_score refreshed from those scores"
          - "increments ComplianceCovenant.version by 1; increments Project.version by 1; increments InvestorInterest.version by 1 per recomputed interest"
      - from: COMPLIANT
        to: BREACHED
        trigger: "POST /compliance-covenants/{id}/attest with outcome == EXCEPTION"
        actor: Developer
        preconditions:
          - "status == COMPLIANT"
        side_effects:
          - "same side-effect chain as PENDING_ATTESTATION -> BREACHED"
      - from: BREACHED
        to: CURED
        trigger: "POST /compliance-covenants/{id}/attest with outcome == SATISFIED"
        actor: Developer
        preconditions:
          - "status == BREACHED"
          - "period_end_date <= cure_deadline_date"
        side_effects:
          - "attestation_count += 1; last_attested_period_end = period_end_date"
          - "cascade: when no other covenant of the project is BREACHED and recapture_balance_cents == 0, Project.compliance_status CURE_PENDING -> IN_SERVICE_MONITORING"
          - "cascade: every ADMITTED InvestorInterest has disqualification_risk_score recomputed with the IN_SERVICE variant"
          - "increments ComplianceCovenant.version by 1; increments Project.version by 1"
      - from: CURED
        to: COMPLIANT
        trigger: "POST /compliance-covenants/{id}/attest with outcome == SATISFIED for a later period"
        actor: Developer
        preconditions:
          - "status == CURED"
          - "period_end_date > last_attested_period_end"
        side_effects:
          - "attestation_count += 1; last_attested_period_end = period_end_date"
          - "increments ComplianceCovenant.version by 1"
        note: "Closes the covenant cycle BREACHED -> CURED -> COMPLIANT."

  - entity: CreditClaim
    state_field: status
    initial_state: DRAFT
    terminal_states: [ADJUSTED]
    shape: linear
    transitions:
      - from: DRAFT
        to: FILED
        trigger: "POST /credit-claims/{id}/file"
        actor: InvestorAdmin
        preconditions:
          - "status == DRAFT"
          - "project.certification_status == PART3_CERTIFIED"
          - "project.compliance_status != RECAPTURED"
          - "acting InvestorInterest.status == ADMITTED and its project_id == claim.project_id"
          - "for project.structure_type == MASTER_LEASE: the MASTER_LEASE_LESSEE interest has pass_through_election == ELECTED"
          - "project.max_investor_risk_score < HIGH_RISK_THRESHOLD"
        side_effects:
          - "compute recapture_offset_cents and net_claim_cents (calculations.claim_settlement) in the pinned order"
          - "set status = FILED, filed_at = logical clock now, filed_by_user_id = X-User-ID"
          - "Project.credit_claimed_to_date_cents += net_claim_cents; Project.credit_recaptured_cents += recapture_offset_cents; Project.credit_unclaimed_cents -= gross_credit_cents; Project.recapture_balance_cents -= recapture_offset_cents"
          - "cascade: RecaptureEvent rows of this project with status == ASSESSED become SETTLED once recapture_balance_cents reaches 0"
          - "cascade: Project.compliance_status CURE_PENDING -> IN_SERVICE_MONITORING when recapture_balance_cents == 0 and no covenant is BREACHED"
          - "increments CreditClaim.version by 1; increments Project.version by 1"
      - from: FILED
        to: ADJUSTED
        trigger: "system event: a RecaptureEvent with event_type == SUBSTANTIAL_TEST_FAILURE is assessed against the project"
        actor: system
        preconditions:
          - "status == FILED"
        side_effects:
          - "the claim's net_claim_cents is left unchanged; the obligation is carried on Project.recapture_balance_cents"
          - "increments CreditClaim.version by 1"
        note: "Terminal: an ADJUSTED claim cannot be re-filed."

  - entity: RecaptureEvent
    state_field: status
    initial_state: ASSESSED
    terminal_states: [SETTLED]
    shape: linear
    transitions:
      - from: ASSESSED
        to: SETTLED
        trigger: "system event: Project.recapture_balance_cents reaches 0 through claim offsets"
        actor: system
        preconditions:
          - "status == ASSESSED"
          - "project.recapture_balance_cents == 0"
        side_effects:
          - "increments RecaptureEvent.version by 1"

  - entity: InvestorInterest
    state_field: status
    initial_state: ADMITTED
    terminal_states: [DISQUALIFIED]
    shape: linear
    transitions:
      - from: ADMITTED
        to: DISQUALIFIED
        trigger: "system event: POST /recapture-events with event_type IN {LEASE_TO_DISQUALIFIED, OWNERSHIP_TRANSFER} on this project"
        actor: system
        preconditions:
          - "status == ADMITTED"
          - "kind == MASTER_LEASE_LESSEE"
        side_effects:
          - "Project.max_investor_risk_score is refreshed over the remaining ADMITTED interests"
          - "increments InvestorInterest.version by 1"
        note: "A DISQUALIFIED interest can no longer create or file credit claims (ERR_INVESTOR_NOT_ADMITTED)."

# =============================================================================
# 1.2.1 Concurrency Rules — OCC on Project.version only
# =============================================================================
concurrency_rules:
  - rule_id: partapp-create-supersede-stale-project
    parent_entity: Project
    write_endpoint: "POST /part-applications"
    occ_field: "expected_project_version"
    description: |
      Creating a PartApplication against a Project whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has already created an application for the same part number
      (which legitimately supersedes the prior one under state_machines.PartApplication
      DRAFT -> SUPERSEDED) so the current writer's view of the project — including
      which application is the live one — is stale.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
  - rule_id: basis-revision-stale-project
    parent_entity: Project
    write_endpoint: "PATCH /projects/{id}"
    occ_field: "expected_project_version"
    description: |
      Revising adjusted_basis_cents or the measuring period on a Project whose
      version has advanced since the client last observed it is rejected. A basis
      revision legitimately supersedes the prior basis, so the write cannot be
      re-derived from a stale read: the substantial-rehabilitation threshold the
      client believed it was moving away from may already have changed.
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules
# =============================================================================
calculations:
  - name: qre_totals
    description: >
      Segregates qualified rehabilitation expenditures from non-qualified costs for
      a project. Statutorily non-qualified categories are excluded outright, costs
      incurred outside the measuring period are excluded, and the developer fee is
      capped at a percentage of hard costs with the excess reallocated to the
      non-qualified total. Two variants differ only in how PENDING_CLASSIFICATION
      line items are treated.
    trigger: >
      Any CostLineItem create or classify on the project; any PATCH /projects/{id}
      that moves the measuring period; POST /projects/{id}/place-in-service;
      and on read for GET /projects/{id}/qre-summary.
    inputs:
      - "CostLineItem rows of the project (amount_cents, category, classification, incurred_date, in_measuring_period)"
      - "Project.measuring_period_start_date, Project.measuring_period_end_date"
    algorithm: aggregation
    formula: |
      # Category partition (fixed):
      NON_QRE_CATEGORIES = {ACQUISITION, ENLARGEMENT, SITE_WORK,
                            PERSONAL_PROPERTY, FFE, LANDSCAPING}
      QRE_ELIGIBLE_CATEGORIES = {HARD_CONSTRUCTION, ARCHITECTURAL_ENGINEERING,
                                 DEVELOPER_FEE, CONSTRUCTION_INTEREST}

      # in_measuring_period is a half-open window on the incurred date:
      #   measuring_period_start_date <= incurred_date < measuring_period_end_date
      in_period = [c for c in project.cost_line_items if c.in_measuring_period]

      # Variant-dependent membership. counted_qre is the set of line items that
      # count toward the qualified side for this variant:
      if variant == FINAL:
          counted_qre = [c for c in in_period
                         if c.classification in {QRE, LOCKED_QRE}]
      else:  # variant == PROVISIONAL
          counted_qre = [c for c in in_period
                         if c.classification in {QRE, LOCKED_QRE}
                         or (c.classification == PENDING_CLASSIFICATION
                             and c.category in QRE_ELIGIBLE_CATEGORIES)]

      hard_qre    = sum(c.amount_cents for c in counted_qre
                        if c.category != DEVELOPER_FEE)
      fee_claimed = sum(c.amount_cents for c in counted_qre
                        if c.category == DEVELOPER_FEE)

      # Developer-fee cap: floor, never round.
      fee_cap    = floor(hard_qre * DEVELOPER_FEE_CAP_RATE)
      fee_allowed = min(fee_claimed, fee_cap)
      fee_disallowed = fee_claimed - fee_allowed

      qre_total = hard_qre + fee_allowed

      nonqualified_total = sum(c.amount_cents for c in in_period
                               if c.classification in {NON_QRE, LOCKED_NON_QRE}) \
                         + fee_disallowed

      classified_cost_total = sum(c.amount_cents for c in in_period
                                  if c.classification in {QRE, NON_QRE,
                                                          LOCKED_QRE, LOCKED_NON_QRE})

      # Persisted fields:
      #   Project.qre_total_final_cents        <- qre_total under variant FINAL
      #   Project.qre_total_provisional_cents  <- qre_total under variant PROVISIONAL
      #   Project.nonqualified_total_cents     <- nonqualified_total under FINAL
      #   Project.developer_fee_disallowed_cents <- fee_disallowed under FINAL
      #   Project.classified_cost_total_cents  <- classified_cost_total
      #
      # Invariant (compensating): qre_total_final_cents + nonqualified_total_cents
      # == classified_cost_total_cents, for every classification history, because the
      # disallowed fee slice is moved between the two sides rather than dropped.
    constants:
      DEVELOPER_FEE_CAP_RATE: 0.15
    precision: "integer cents; the fee cap uses floor; no other rounding occurs"
    variants:
      - name: PROVISIONAL
        when: >
          Default for GET /projects/{id}/qre-summary (variant omitted or
          variant == PROVISIONAL) and for the substantial-test preview shown before
          Part 3 certification.
        difference: >
          Unclassified line items whose category is QRE-eligible are counted as
          qualified, so the total is an upper bound on the final figure.
      - name: FINAL
        when: >
          Used for Project.qre_total_final_cents, for the substantial
          rehabilitation test that gates Part 3 certification, and for the ratable
          credit schedule. Also returned when variant == FINAL is requested.
        difference: >
          PENDING_CLASSIFICATION items are excluded entirely, so the total can only
          be lower than or equal to the PROVISIONAL total.

  - name: substantial_rehabilitation_test
    description: >
      Determines whether the qualified rehabilitation expenditures incurred within
      the measuring period exceed the greater of the property's adjusted basis and
      the statutory floor.
    trigger: >
      Recomputed immediately after every qre_totals recomputation and after any
      PATCH /projects/{id} that changes adjusted_basis_cents or the measuring period.
    inputs:
      - "Project.qre_total_final_cents"
      - "Project.adjusted_basis_cents"
    algorithm: threshold
    formula: |
      threshold = max(project.adjusted_basis_cents, SUBSTANTIAL_TEST_FLOOR_CENTS)
      status    = MET if project.qre_total_final_cents >= threshold else NOT_MET

      # Persisted: Project.substantial_test_threshold_cents <- threshold
      #            Project.substantial_test_status          <- status
      #
      # The comparison is inclusive: equality at the threshold is MET.
    constants:
      SUBSTANTIAL_TEST_FLOOR_CENTS: 500000
    precision: "integer cents; inclusive >= comparison; no rounding"

  - name: ratable_credit_schedule
    description: >
      Converts the final qualified rehabilitation expenditure total into a per-year
      ratable credit and a total claimable credit. The rounding order is pinned:
      the per-year amount is rounded first and the total is the rounded per-year
      amount multiplied by the number of ratable years.
    trigger: >
      Recomputed after every substantial_rehabilitation_test recomputation while
      Project.frozen_at_certification == false; frozen when certification_status
      becomes PART3_CERTIFIED.
    inputs:
      - "Project.qre_total_final_cents"
      - "Project.substantial_test_status"
      - "Project.frozen_at_certification"
    algorithm: threshold
    formula: |
      if project.substantial_test_status == NOT_MET:
          annual = 0
          total  = 0
      else:
          # Step 1 — round the per-year amount to whole cents.
          annual = round_half_up(project.qre_total_final_cents * CREDIT_RATE_PER_YEAR)
          # Step 2 — multiply the ROUNDED per-year amount.
          total  = annual * RATABLE_YEARS

      # The evaluation order is normative. Computing
      #   total = round_half_up(qre_total_final_cents * CREDIT_RATE_PER_YEAR * RATABLE_YEARS)
      # is WRONG and yields a different total for most inputs.
      #
      # Persisted: Project.annual_credit_cents          <- annual
      #            Project.total_claimable_credit_cents <- total
      #            Project.credit_unclaimed_cents       <- total - credit_claimed_to_date_cents
      #                                                   - credit_recaptured_cents
      #
      # If frozen_at_certification == true the schedule is not recomputed: a later
      # QRE change (for example a ComplianceMonitor disallowance) leaves
      # annual_credit_cents and total_claimable_credit_cents untouched and is
      # expressed through recapture instead.
    constants:
      CREDIT_RATE_PER_YEAR: 0.04
      RATABLE_YEARS: 5
    precision: "round_half_up to whole cents on the per-year amount only; the total is an exact integer product"

  - name: investor_disqualification_risk
    description: >
      Scores the risk that an investor interest disqualifies the credit — a
      tax-exempt or governmental party, a master lease long enough to be treated as
      a transfer of the building, a pass-through election that has not been made,
      and (after placed-in-service) live covenant breaches and unresolved
      preservation violations.
    trigger: >
      POST /investor-interests (variant ADMISSION),
      POST /investor-interests/{id}/elect-pass-through (variant ADMISSION),
      and any covenant attestation with outcome == EXCEPTION, covenant cure, or
      Part 2/3 finding change on a project whose compliance_status !=
      NOT_MONITORED (variant IN_SERVICE).
    inputs:
      - "InvestorInterest.kind, party_tax_status, lease_term_years, pass_through_election"
      - "count of ComplianceCovenant rows of the project with status == BREACHED"
      - "sum of PartApplication.unresolved_violation_count over the project's applications with status != SUPERSEDED"
    algorithm: weighted_scoring
    formula: |
      TAX_STATUS_POINTS = { TAXABLE_C_CORP: 0, PARTNERSHIP: 10,
                            GOVERNMENTAL_UNIT: 35, TAX_EXEMPT_ORG: 45 }

      # --- lease-term component (master-lease structures only) ---
      safe_harbor_years = floor(BUILDING_USEFUL_LIFE_YEARS * LEASE_TERM_SAFE_HARBOR_RATIO)
      if interest.kind == MASTER_LEASE_LESSEE and interest.lease_term_years != null:
          if interest.lease_term_years >= safe_harbor_years:
              lease_points = LEASE_TERM_POINTS_CAP
          else:
              lease_points = round_half_up(LEASE_TERM_POINTS_CAP
                                           * interest.lease_term_years
                                           / safe_harbor_years)
      else:
          lease_points = 0

      # --- election component ---
      election_points = ELECTION_PENDING_POINTS if interest.pass_through_election == PENDING else 0

      base_score = BASE_RISK \
                 + TAX_STATUS_POINTS[interest.party_tax_status] \
                 + lease_points \
                 + election_points

      if variant == ADMISSION:
          score = min(100, base_score)
      else:  # variant == IN_SERVICE
          adder = COVENANT_BREACH_POINTS * breached_covenant_count \
                + UNRESOLVED_VIOLATION_POINTS * unresolved_violation_total
          score = min(100, base_score + min(IN_SERVICE_ADDER_CAP, adder))

      # Persisted: InvestorInterest.disqualification_risk_score <- score
      #            InvestorInterest.risk_variant_applied        <- variant
      #            Project.max_investor_risk_score <- max(score) over the project's
      #                                               ADMITTED interests, else 0
      #
      # A score >= HIGH_RISK_THRESHOLD blocks admission (ERR_DISQUALIFICATION_RISK_TOO_HIGH
      # on POST /investor-interests) and blocks filing (same error on
      # POST /credit-claims/{id}/file) once it is reached in service.
    constants:
      BASE_RISK: 10
      BUILDING_USEFUL_LIFE_YEARS: 39
      LEASE_TERM_SAFE_HARBOR_RATIO: 0.80
      LEASE_TERM_POINTS_CAP: 30
      ELECTION_PENDING_POINTS: 12
      COVENANT_BREACH_POINTS: 20
      UNRESOLVED_VIOLATION_POINTS: 10
      IN_SERVICE_ADDER_CAP: 60
      HIGH_RISK_THRESHOLD: 70
    precision: "integer points 0..100; round_half_up on the lease-term component only; the adder is capped before it is added"
    variants:
      - name: ADMISSION
        when: >
          Applied when the interest is created and when the pass-through election is
          made, i.e. before the project is placed in service.
        difference: >
          Counts only the party's own attributes: tax status, lease term, election
          state. Covenant and finding history is ignored because none can exist yet.
      - name: IN_SERVICE
        when: >
          Applied to every ADMITTED interest of a project whose compliance_status
          != NOT_MONITORED whenever a covenant breach, covenant cure, or unresolved
          violation count changes.
        difference: >
          Adds a capped project-level adder for breached covenants and unresolved
          preservation violations, so the same party attributes can score higher
          after placed-in-service than they did at admission.

  - name: recapture_assessment
    description: >
      Assesses the recapture obligation for a compliance failure inside the
      five-year monitoring period. The step-down rate depends on how many full years
      the building has been in service; a failed substantial rehabilitation test
      recaptures the entire credit claimed to date regardless of elapsed time.
    trigger: >
      POST /recapture-events, and the system cascade that creates a
      SUBSTANTIAL_TEST_FAILURE event when a locked-cost disallowance flips
      substantial_test_status from MET to NOT_MET.
    inputs:
      - "Project.placed_in_service_date"
      - "Project.credit_claimed_to_date_cents"
      - "RecaptureEvent.event_type, RecaptureEvent.event_date"
    algorithm: threshold
    formula: |
      elapsed_days      = days_between(project.placed_in_service_date, event.event_date)
      full_years_elapsed = floor(elapsed_days / DAYS_PER_YEAR)

      if event.event_type == SUBSTANTIAL_TEST_FAILURE:
          pct = 1.00
      else:
          remaining_years = COMPLIANCE_PERIOD_YEARS - full_years_elapsed
          pct = remaining_years * RECAPTURE_STEP_RATE

      amount = round_half_up(project.credit_claimed_to_date_cents * pct)

      # Persisted: RecaptureEvent.full_years_elapsed / recapture_pct / recapture_amount_cents
      #            Project.recapture_balance_cents += amount
      #
      # An event whose full_years_elapsed >= COMPLIANCE_PERIOD_YEARS, or whose
      # event_date precedes placed_in_service_date, is rejected with
      # ERR_RECAPTURE_OUTSIDE_COMPLIANCE_PERIOD before this calculation runs, so pct
      # is always in (0, 1].
    constants:
      COMPLIANCE_PERIOD_YEARS: 5
      RECAPTURE_STEP_RATE: 0.20
      DAYS_PER_YEAR: 365
    precision: "round_half_up to whole cents on the amount; recapture_pct carries exactly 2 decimal places"

  - name: claim_settlement
    description: >
      Settles a credit claim at filing time. The order of evaluation is normative:
      the gross slice is fixed at claim creation, the recapture offset is taken
      against the balance outstanding at filing, the net claim is the remainder, and
      only then are the project ledger fields mutated and the downstream state
      changes evaluated.
    trigger: "POST /credit-claims/{id}/file"
    inputs:
      - "CreditClaim.gross_credit_cents"
      - "Project.recapture_balance_cents, credit_claimed_to_date_cents, credit_recaptured_cents, credit_unclaimed_cents"
      - "ComplianceCovenant.status rows of the project"
    algorithm: waterfall_allocation
    formula: |
      # Step 1 — gross is the snapshot taken at claim creation; it is NOT re-read
      #          from Project.annual_credit_cents at filing time.
      gross = claim.gross_credit_cents

      # Step 2 — offset the outstanding recapture balance first, capped by gross.
      offset = min(gross, project.recapture_balance_cents)

      # Step 3 — the net claim is what survives the offset.
      net = gross - offset

      # Step 4 — mutate the ledger, in this order:
      project.credit_claimed_to_date_cents += net
      project.credit_recaptured_cents      += offset
      project.recapture_balance_cents      -= offset
      project.credit_unclaimed_cents        = project.total_claimable_credit_cents \
                                            - project.credit_claimed_to_date_cents \
                                            - project.credit_recaptured_cents

      # Step 5 — settle recapture events only after the balance has been reduced.
      if project.recapture_balance_cents == 0:
          every RecaptureEvent of the project with status == ASSESSED -> SETTLED

      # Step 6 — re-derive compliance posture only after steps 4 and 5.
      if project.recapture_balance_cents == 0
         and no ComplianceCovenant of the project has status == BREACHED
         and project.compliance_status == CURE_PENDING:
          project.compliance_status -> IN_SERVICE_MONITORING

      # Invariant (compensating): after every filing,
      #   credit_claimed_to_date_cents + credit_recaptured_cents
      #     + credit_unclaimed_cents == total_claimable_credit_cents
      # Reversing steps 2 and 4 (mutating the ledger before computing the offset)
      # double-counts the offset and breaks this invariant.
    constants: {}
    precision: "integer cents throughout; no rounding — every term is already a whole-cent integer"

  - name: compliance_posture
    description: >
      Derives Project.compliance_status from the placed-in-service milestone, the
      covenant portfolio, the outstanding recapture balance, and the elapsed portion
      of the five-year monitoring period. The certification dimension is not an
      input, which is what makes the two Project state dimensions independent.
    trigger: >
      POST /projects/{id}/place-in-service, POST /compliance-covenants/{id}/attest,
      POST /recapture-events, POST /credit-claims/{id}/file, and the locked-cost
      disallowance cascade.
    inputs:
      - "Project.placed_in_service_date, Project.recapture_balance_cents"
      - "ComplianceCovenant.status and last_attested_period_end rows of the project"
      - "RecaptureEvent.event_type rows of the project"
    algorithm: constraint_propagation
    formula: |
      if project.placed_in_service_date == null:
          posture = NOT_MONITORED
      elif any RecaptureEvent of the project has event_type == OWNERSHIP_TRANSFER:
          posture = RECAPTURED                      # absorbing
      elif any ComplianceCovenant of the project has status == BREACHED
           or project.recapture_balance_cents > 0:
          posture = CURE_PENDING
      elif every ComplianceCovenant of the project has status == COMPLIANT
           and monitoring_end_date <= logical clock date
           and project.recapture_balance_cents == 0:
          posture = COMPLIANT_CLOSED                # absorbing
      else:
          posture = IN_SERVICE_MONITORING

      monitoring_end_date = project.placed_in_service_date
                            + COMPLIANCE_PERIOD_YEARS * DAYS_PER_YEAR days

      # Propagation reaches a fixed point in one pass: posture depends only on
      # covenant/recapture facts, never on its own previous value, except that
      # RECAPTURED and COMPLIANT_CLOSED are absorbing and are never left once
      # entered.
    constants:
      COMPLIANCE_PERIOD_YEARS: 5
      DAYS_PER_YEAR: 365
    precision: "not applicable — enum output"

# =============================================================================
# 1.4 Validation Rules — evaluated in ascending priority order; the first
# violated rule determines the response. Lower number = checked earlier.
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-ID header present and non-empty"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: >
      Every endpoint except POST /_clock/set_current_utc requires the caller
      identity header. Checked before role resolution and before any body parsing.

  - priority: 20
    category: auth
    check: "the resolved role of X-User-ID is in the endpoint's authorized_roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: >
      Role authorization precedes schema validation, so an unauthorized caller
      sending a malformed body still receives ERR_UNAUTHORIZED.

  - priority: 30
    category: validation
    check: "request body types, enum membership, ranges and required fields conform to §1.1 constraints"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
    description: >
      Covers missing required fields, unknown enum values, non-integer cents,
      malformed YYYY-MM-DD dates, amount_cents <= 0, credit_allocation_pct outside
      (0, 100], part_number outside {1,2,3}, standard_number outside 1..10,
      measuring_period_months not in {24, 60}, and pagination limit/offset outside
      the declared bounds.

  - priority: 40
    category: existence
    check: "the path {id} resolves to an existing row of the endpoint's entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: >
      Path existence is resolved before body references so that an unknown path id
      always yields the path entity's 404, never a body reference error.

  - priority: 45
    category: existence
    check: "every foreign key supplied in the request body resolves to an existing row of its declared parent entity"
    error_id: "ERR_<ENTITY>_NOT_FOUND"
    http_status: 404
    applies_to:
      - "POST /projects"
      - "POST /part-applications"
      - "POST /part-applications/{id}/submit"
      - "POST /cost-line-items"
      - "POST /amendments"
      - "POST /investor-interests"
      - "POST /credit-claims"
      - "POST /recapture-events"
      - "POST /compliance-covenants"
    description: >
      Body references are resolved left to right in the order the fields appear in
      the endpoint's request_body list, so POST /projects with both an unknown
      developer_id and an unknown property_id returns ERR_DEVELOPER_NOT_FOUND.

  - priority: 50
    category: auth
    check: "the acting Developer owns the project the write targets (project.developer_id == X-User-ID)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to:
      - "PATCH /projects/{id}"
      - "POST /projects/{id}/place-in-service"
      - "POST /part-applications"
      - "POST /part-applications/{id}/submit"
      - "POST /part-applications/{id}/resubmit"
      - "POST /cost-line-items"
      - "POST /amendments"
      - "POST /amendments/{id}/submit"
      - "POST /compliance-covenants"
      - "POST /compliance-covenants/{id}/attest"
    description: >
      Ownership is checked after existence, so a Developer touching another
      developer's project gets 403 while an unknown project id gets 404.

  - priority: 50
    category: auth
    check: "the Reviewer issuing the NPS determination is not the Reviewer who issued the SHPO recommendation on the same application"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to:
      - "POST /part-applications/{id}/nps-determination"
    description: >
      Segregation of duties: X-User-ID must differ from the application's
      shpo_reviewer_id. Within the priority-50 band on
      POST /part-applications/{id}/nps-determination this identity-reuse check runs
      BEFORE the agency check below, so a Reviewer whose id equals the application's
      shpo_reviewer_id receives ERR_SEGREGATION_OF_DUTIES rather than
      ERR_UNAUTHORIZED, whatever its agency. The agency check therefore only ever
      reports on a Reviewer that did not issue the recommendation on this
      application.

  - priority: 50
    category: auth
    check: "the acting Reviewer's agency matches the decision being recorded"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to:
      - "POST /part-applications/{id}/shpo-recommend"
      - "POST /part-applications/{id}/nps-determination"
      - "POST /amendments/{id}/concur"
    description: >
      A Reviewer with agency == NPS cannot issue an SHPO recommendation and vice
      versa; on POST /amendments/{id}/concur the acting agency selects which branch
      of the fork the decision applies to.

  - priority: 50
    category: auth
    check: "the acting InvestorAdmin's InvestorInterest belongs to the claim's project and has status == ADMITTED"
    error_id: ERR_INVESTOR_NOT_ADMITTED
    http_status: 403
    applies_to:
      - "POST /credit-claims"
      - "POST /credit-claims/{id}/file"
      - "POST /investor-interests/{id}/elect-pass-through"
    description: >
      A DISQUALIFIED interest, or an interest belonging to a different project, may
      not create, elect for, or file claims.

  - priority: 55
    category: business_safety
    check: "the assigned Reviewer is eligible: credential_status == ACTIVE and agency matches the assignment slot"
    error_id: ERR_REVIEWER_NOT_ELIGIBLE
    http_status: 422
    applies_to:
      - "POST /part-applications/{id}/submit"
    description: >
      shpo_reviewer_id must name a Reviewer whose agency == SHPO and whose
      credential_status == ACTIVE. A SUSPENDED reviewer cannot be assigned.

  - priority: 60
    category: state
    check: "the target entity is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_<ENTITY>_INVALID_STATE"
    http_status: 409
    applies_to:
      - "POST /part-applications/{id}/submit"
      - "POST /part-applications/{id}/shpo-recommend"
      - "POST /part-applications/{id}/nps-determination"
      - "POST /part-applications/{id}/resubmit"
      - "POST /part-applications/{id}/findings"
      - "POST /amendments/{id}/submit"
      - "POST /amendments/{id}/concur"
      - "POST /compliance-covenants/{id}/attest"
    description: >
      Maps to ERR_PART_APPLICATION_INVALID_STATE, ERR_AMENDMENT_INVALID_STATE and
      ERR_COVENANT_INVALID_STATE respectively. Also catches idempotent replays: a
      second POST of the same action on an already-advanced row. For a BREACHED
      covenant the declared cure transition additionally requires period_end_date <=
      cure_deadline_date, where cure_deadline_date = window_end_date +
      CURE_WINDOW_DAYS days and CURE_WINDOW_DAYS = 90.

  - priority: 60
    category: state
    check: "the credit claim being filed has status == DRAFT"
    error_id: ERR_CREDIT_CLAIM_ALREADY_FILED
    http_status: 409
    applies_to:
      - "POST /credit-claims/{id}/file"
    description: >
      A FILED or ADJUSTED claim cannot be filed again. This state check runs before
      the fiscal substantial-test check, so a re-file attempt on a project whose
      substantial test has since failed still reports the state error.

  - priority: 60
    category: state
    check: "the project has certification_status == PART3_CERTIFIED"
    error_id: ERR_PROJECT_NOT_CERTIFIED
    http_status: 409
    applies_to:
      - "POST /credit-claims"
      - "POST /credit-claims/{id}/file"
    description: >
      Credits cannot be claimed before the Part 3 certification of completed work.

  - priority: 60
    category: state
    check: "the project has a non-null placed_in_service_date"
    error_id: ERR_PROJECT_NOT_PLACED_IN_SERVICE
    http_status: 409
    applies_to:
      - "POST /credit-claims"
      - "POST /recapture-events"
      - "POST /compliance-covenants"
      - "POST /compliance-covenants/{id}/attest"
    description: >
      The five-year monitoring period, its covenants, and the claiming timeline all
      key off the placed-in-service date.

  - priority: 60
    category: state
    check: "a Developer may not reclassify a cost line item whose classification is LOCKED_QRE or LOCKED_NON_QRE"
    error_id: ERR_COST_ITEM_LOCKED
    http_status: 409
    applies_to:
      - "POST /cost-line-items/{id}/classify"
    description: >
      Costs lock when the project reaches PART3_CERTIFIED. Only a ComplianceMonitor
      may reclassify a locked item, as an audit disallowance.

  - priority: 60
    category: state
    check: "the pass-through election has not already been made and the interest's project structure permits it"
    error_id: ERR_ELECTION_WINDOW_CLOSED
    http_status: 422
    applies_to:
      - "POST /investor-interests/{id}/elect-pass-through"
    description: >
      pass_through_election must be PENDING. An interest on a SINGLE_TIER project
      has pass_through_election == NOT_APPLICABLE and is rejected, as is a second
      election on an already-ELECTED interest.

  - priority: 65
    category: state
    check: "expected_project_version equals the current Project.version"
    error_id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    applies_to:
      - "POST /part-applications"
      - "PATCH /projects/{id}"
    description: >
      Optimistic concurrency control per §1.2.1. Checked after existence, role,
      ownership and state so that a stale version on an otherwise invalid request
      does not mask the more specific error.

  - priority: 60
    category: state
    check: "the project is still editable: certification_status NOT IN {PART3_CERTIFIED, DECERTIFIED}, and place-in-service has not already been declared"
    error_id: ERR_PROJECT_INVALID_STATE
    http_status: 409
    applies_to:
      - "PATCH /projects/{id}"
      - "POST /projects/{id}/place-in-service"
    description: >
      The adjusted basis and measuring period freeze at Part 3 certification, and
      the placed-in-service date may be declared only once.

  - priority: 60
    category: state
    check: "the project has certification_status IN {PART2_APPROVED, PART3_CERTIFIED} before place-in-service may be declared"
    error_id: ERR_PROJECT_NOT_CERTIFIED
    http_status: 409
    applies_to:
      - "POST /projects/{id}/place-in-service"
    description: >
      A building cannot be certified as placed in service before the rehabilitation
      plan has cleared Part 2 review.

  - priority: 70
    category: business_safety
    check: "part applications are created in order: part N requires the part N-1 application of the same project to have status IN {CONDITIONAL, APPROVED}"
    error_id: ERR_PART_SEQUENCE_VIOLATION
    http_status: 422
    applies_to:
      - "POST /part-applications"
    description: >
      Part 2 requires a Part 1 that has cleared review at least conditionally; Part 3
      requires the same of Part 2. Part 1 has no predecessor. Creation is permitted on
      a CONDITIONAL predecessor so the developer can prepare the next part while
      conditions are being cleared by amendment — but submission of that next part is
      still gated on the property's certification (ERR_PROPERTY_NOT_CERTIFIED_HISTORIC),
      which only an APPROVED Part 1 produces.

  - priority: 70
    category: business_safety
    check: "no APPROVED application already exists for the same project and part_number"
    error_id: ERR_PART_ALREADY_CERTIFIED
    http_status: 409
    applies_to:
      - "POST /part-applications"
    description: >
      A part may be re-applied for only while the prior application for that part is
      still DRAFT (which supersedes it). Once a part is APPROVED it is closed.

  - priority: 70
    category: business_safety
    check: "the project's Property has evaluation_status == CERTIFIED_HISTORIC before a Part 2 or Part 3 application may be submitted"
    error_id: ERR_PROPERTY_NOT_CERTIFIED_HISTORIC
    http_status: 422
    applies_to:
      - "POST /part-applications/{id}/submit"
    description: >
      Cross-entity dependency: the rehabilitation plan can only be reviewed against
      the preservation standards once the evaluation of significance has certified
      the building as historic. Part 1 submissions are exempt — they are what produce
      the certification.

  - priority: 70
    category: business_safety
    check: "an NPS determination of APPROVED requires unresolved_violation_count == 0 on the application"
    error_id: ERR_PRESERVATION_STANDARD_VIOLATION
    http_status: 422
    applies_to:
      - "POST /part-applications/{id}/nps-determination"
      - "POST /amendments/{id}/concur"
    description: >
      An unresolved VIOLATION-severity finding against the Secretary's Standards
      blocks approval outright; only CONDITION-severity findings may be carried into
      the CONDITIONAL state.

  - priority: 70
    category: referential
    check: "addresses_finding_id, when supplied, names a StandardFinding whose part_application_id equals the amendment's part_application_id"
    error_id: ERR_AMENDMENT_FINDING_MISMATCH
    http_status: 422
    applies_to:
      - "POST /amendments"
    description: >
      A construction-change amendment may only clear a finding raised against the
      very application whose approved scope it amends.

  - priority: 70
    category: business_safety
    check: "the cost line item's category is not a statutorily non-qualified category when it is being classified as QRE"
    error_id: ERR_NONQUALIFIED_CATEGORY
    http_status: 422
    applies_to:
      - "POST /cost-line-items"
      - "POST /cost-line-items/{id}/classify"
    description: >
      ACQUISITION, ENLARGEMENT, SITE_WORK, PERSONAL_PROPERTY, FFE and LANDSCAPING can
      never be qualified rehabilitation expenditures. This safety check precedes the
      measuring-period temporal check, so a non-qualified category incurred outside
      the period reports the category error.

  - priority: 70
    category: business_safety
    check: "the investor interest kind matches the project's structure_type"
    error_id: ERR_STRUCTURE_TYPE_MISMATCH
    http_status: 422
    applies_to:
      - "POST /investor-interests"
    description: >
      A MASTER_LEASE project admits exactly one MASTER_LEASE_LESSEE and requires
      lease_term_years on it; a SINGLE_TIER project admits only DIRECT_PARTNER
      interests and rejects lease_term_years.

  - priority: 70
    category: business_safety
    check: "a master-lease lessee is not a tax-exempt or governmental party"
    error_id: ERR_DISQUALIFIED_PARTY
    http_status: 422
    applies_to:
      - "POST /investor-interests"
    description: >
      party_tax_status IN {TAX_EXEMPT_ORG, GOVERNMENTAL_UNIT} disqualifies the credit
      for a MASTER_LEASE_LESSEE interest.

  - priority: 70
    category: business_safety
    check: "the interest's computed disqualification_risk_score is below HIGH_RISK_THRESHOLD at admission, and the project's max_investor_risk_score is below it at filing"
    error_id: ERR_DISQUALIFICATION_RISK_TOO_HIGH
    http_status: 422
    applies_to:
      - "POST /investor-interests"
      - "POST /credit-claims/{id}/file"
    description: >
      Uses the ADMISSION variant at admission and the standing IN_SERVICE score at
      filing (calculations.investor_disqualification_risk).

  - priority: 70
    category: business_safety
    check: "for a MASTER_LEASE project, the MASTER_LEASE_LESSEE interest has pass_through_election == ELECTED before a claim may be filed"
    error_id: ERR_PASS_THROUGH_ELECTION_REQUIRED
    http_status: 422
    applies_to:
      - "POST /credit-claims/{id}/file"
    description: >
      Cross-entity dependency between CreditClaim and InvestorInterest: without the
      pass-through election the credit stays with the lessor and cannot be claimed by
      the lessee.

  - priority: 80
    category: business_temporal
    check: "no two projects on the same Property have overlapping measuring periods"
    error_id: ERR_PROPERTY_MEASURING_PERIOD_OVERLAP
    http_status: 409
    applies_to:
      - "POST /projects"
      - "PATCH /projects/{id}"
    description: >
      Measuring periods are half-open [start, end): two periods overlap iff
      a.start < b.end AND b.start < a.end. Periods that merely touch (a.end ==
      b.start) do not overlap and are accepted. Only projects whose
      certification_status != DECERTIFIED are considered.

  - priority: 80
    category: business_temporal
    check: "the assigned SHPO reviewer has fewer than REVIEWER_WINDOW_CAPACITY overlapping review windows"
    error_id: ERR_REVIEWER_WINDOW_CAPACITY
    http_status: 409
    applies_to:
      - "POST /part-applications/{id}/submit"
    description: >
      A review window is the closed interval [submitted_at date,
      review_window_end date] of an application whose status IN {SHPO_REVIEW,
      NPS_REVIEW, CONDITIONAL}. Two closed intervals overlap iff a.start <= b.end
      AND b.start <= a.end, so windows that share only an endpoint DO overlap — the
      opposite of the half-open measuring-period semantics.
      REVIEWER_WINDOW_CAPACITY = 2 concurrent windows per reviewer and
      SHPO_REVIEW_WINDOW_DAYS = 30.

  - priority: 80
    category: business_temporal
    check: "a cost line item classified as QRE was incurred inside the project's half-open measuring period"
    error_id: ERR_OUTSIDE_MEASURING_PERIOD
    http_status: 422
    applies_to:
      - "POST /cost-line-items"
      - "POST /cost-line-items/{id}/classify"
    description: >
      Qualification requires measuring_period_start_date <= incurred_date <
      measuring_period_end_date. An item incurred exactly on the end date is outside
      the period; an item incurred exactly on the start date is inside it. Items
      outside the period may still be recorded as NON_QRE.

  - priority: 80
    category: business_temporal
    check: "the claim's tax_year falls inside the ratable claiming window"
    error_id: ERR_CLAIM_YEAR_OUT_OF_WINDOW
    http_status: 422
    applies_to:
      - "POST /credit-claims"
    description: >
      The window is year(placed_in_service_date) .. year(placed_in_service_date) +
      RATABLE_YEARS - 1 inclusive.

  - priority: 80
    category: business_temporal
    check: "no other claim exists for the same project and tax_year"
    error_id: ERR_CLAIM_YEAR_DUPLICATE
    http_status: 409
    applies_to:
      - "POST /credit-claims"
    description: >
      One claim per project per tax year, regardless of the claim's status.

  - priority: 80
    category: business_temporal
    check: "the recapture event falls inside the five-year compliance period"
    error_id: ERR_RECAPTURE_OUTSIDE_COMPLIANCE_PERIOD
    http_status: 422
    applies_to:
      - "POST /recapture-events"
    description: >
      event_date must be >= placed_in_service_date and its full_years_elapsed must be
      strictly less than COMPLIANCE_PERIOD_YEARS.

  - priority: 80
    category: business_temporal
    check: "the covenant window and attestation period are coherent"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to:
      - "POST /compliance-covenants"
      - "POST /compliance-covenants/{id}/attest"
    description: >
      window_end_date must be strictly after window_start_date; an attestation's
      period_end_date must be <= the logical clock date and strictly after
      last_attested_period_end when one exists.

  - priority: 90
    category: business_fiscal
    check: "the sum of credit_allocation_pct over the project's ADMITTED interests does not exceed MAX_ALLOCATION_PCT"
    error_id: ERR_ALLOCATION_EXCEEDS_LIMIT
    http_status: 422
    applies_to:
      - "POST /investor-interests"
    description: >
      Aggregate validation: each interest's percentage can be individually valid
      while the portfolio exceeds 100.00 percent. MAX_ALLOCATION_PCT = 100.00.

  - priority: 90
    category: business_fiscal
    check: "the project's substantial_test_status == MET"
    error_id: ERR_SUBSTANTIAL_TEST_NOT_MET
    http_status: 422
    applies_to:
      - "POST /part-applications"
      - "POST /credit-claims/{id}/file"
    description: >
      Applies to Part 3 applications only on POST /part-applications: the request for
      certification of completed work requires qualified expenditures at or above the
      substantial rehabilitation threshold. At filing, the fiscal check runs last, so
      an already-filed claim reports its state error instead.

# =============================================================================
# 1.5 API Endpoints
# =============================================================================
endpoints:
  - method: POST
    path: /_clock/set_current_utc
    description: >
      Test-driving control: sets the logical clock used for every created_at,
      submitted_at, decision_at, filed_at and every "logical clock date" comparison
      in this scaffold. The default clock at process start is 2026-08-01T00:00:00Z.
      The clock only ever moves forward; a to_iso8601 earlier than the current
      logical clock is rejected with ERR_INVALID_REQUEST.
    roles: [PlatformAdmin]
    input: [to_iso8601]
    output: "{ current_utc: string }"
    success_code: 200
    side_effects:
      - "subsequent requests observe the new logical clock; no entity is mutated"

  - method: POST
    path: /developers
    description: Registers a developer taxpayer identity that can own projects.
    roles: [PlatformAdmin]
    input: [legal_name, taxpayer_id_last4, entity_type, "contact_email?"]
    output: Developer
    success_code: 201
    side_effects: []

  - method: GET
    path: /developers/{id}
    description: Reads a developer taxpayer identity.
    roles: [PlatformAdmin, Developer, ComplianceMonitor, InvestorAdmin]
    input: []
    output: Developer
    success_code: 200
    side_effects: []

  - method: POST
    path: /reviewers
    description: Registers an SHPO or NPS reviewer identity.
    roles: [PlatformAdmin]
    input: [full_name, agency, state_code, "credential_status?"]
    output: Reviewer
    success_code: 201
    side_effects: []

  - method: GET
    path: /reviewers/{id}
    description: Reads a reviewer identity with its agency and credential status.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor]
    input: []
    output: Reviewer
    success_code: 200
    side_effects: []

  - method: POST
    path: /properties
    description: Records a candidate building for historic certification.
    roles: [PlatformAdmin, Developer]
    input: [name, street_address, city, state_code, year_built, "listing_status?"]
    output: Property
    success_code: 201
    side_effects:
      - "evaluation_status initialised to UNEVALUATED; open_project_count initialised to 0"

  - method: GET
    path: /properties/{id}
    description: Reads a property with its evaluation-of-significance outcome.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor, InvestorAdmin]
    input: []
    output: Property
    success_code: 200
    side_effects: []

  - method: POST
    path: /projects
    description: >
      Opens a rehabilitation project on a property, fixing the adjusted basis and
      the measuring period within which qualified expenditures must be incurred.
    roles: [Developer]
    input: [developer_id, property_id, project_name, structure_type, adjusted_basis_cents, measuring_period_months, measuring_period_start_date]
    output: Project
    success_code: 201
    side_effects:
      - "measuring_period_end_date = measuring_period_start_date + measuring_period_months months"
      - "substantial_test_threshold_cents computed (calculations.substantial_rehabilitation_test)"
      - "certification_status = PRE_CERTIFICATION; compliance_status = NOT_MONITORED"
      - "Property.open_project_count += 1"
      - "rejects an overlapping measuring period on the same property (ERR_PROPERTY_MEASURING_PERIOD_OVERLAP)"

  - method: GET
    path: /projects/{id}
    description: Reads a project with both state dimensions and the full credit ledger.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor, InvestorAdmin]
    input: []
    output: Project
    success_code: 200
    side_effects: []

  - method: GET
    path: /projects
    description: Lists projects, filterable by developer, property and either state dimension.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor, InvestorAdmin]
    input: ["developer_id?", "property_id?", "certification_status?", "compliance_status?", "limit?", "offset?"]
    output: Project[]
    success_code: 200
    side_effects: []

  - method: PATCH
    path: /projects/{id}
    description: >
      Revises the adjusted basis or the measuring period before Part 3
      certification. Requires expected_project_version (§1.2.1
      basis-revision-stale-project).
    roles: [Developer]
    input: [expected_project_version, "adjusted_basis_cents?", "measuring_period_start_date?", "measuring_period_months?"]
    output: Project
    success_code: 200
    side_effects:
      - "measuring_period_end_date recomputed when the start date or month count changes"
      - "every CostLineItem.in_measuring_period recomputed against the new half-open window"
      - "qre_totals, substantial_rehabilitation_test and ratable_credit_schedule recomputed in that order"
      - "increments Project.version by 1"

  - method: POST
    path: /projects/{id}/place-in-service
    description: >
      Certifies the building as placed in service, which starts the five-year
      recapture monitoring period and opens the credit claiming timeline.
    roles: [Developer]
    input: [placed_in_service_date]
    output: Project
    success_code: 200
    side_effects:
      - "compliance_status NOT_MONITORED -> IN_SERVICE_MONITORING (state_machines.Project/compliance_status)"
      - "every ADMITTED InvestorInterest has disqualification_risk_score recomputed with the IN_SERVICE variant"
      - "max_investor_risk_score refreshed"
      - "increments Project.version by 1"

  - method: GET
    path: /projects/{id}/qre-summary
    description: >
      Computed read of the qualified/non-qualified segregation under the requested
      variant of calculations.qre_totals. Defaults to PROVISIONAL when variant is
      omitted.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor, InvestorAdmin]
    input: ["variant?"]
    output:
      variant_applied: string
      qre_total_cents: integer
      hard_qre_cents: integer
      developer_fee_claimed_cents: integer
      developer_fee_allowed_cents: integer
      developer_fee_disallowed_cents: integer
      nonqualified_total_cents: integer
      classified_cost_total_cents: integer
      substantial_test_threshold_cents: integer
      substantial_test_status_under_variant: string
      in_period_item_count: integer
      pending_classification_item_count: integer
    success_code: 200
    side_effects: []

  - method: GET
    path: /projects/{id}/cost-line-items
    description: Lists the project's cost line items with their classification.
    roles: [PlatformAdmin, Developer, ComplianceMonitor, ShpoReviewer, NpsReviewer]
    input: ["classification?", "category?", "limit?", "offset?"]
    output: CostLineItem[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /projects/{id}/investor-interests
    description: Lists the project's investor interests with their standing risk scores.
    roles: [PlatformAdmin, Developer, InvestorAdmin, ComplianceMonitor]
    input: ["kind?", "status?", "limit?", "offset?"]
    output: InvestorInterest[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /projects/{id}/credit-claims
    description: Lists the project's credit claims and their settlement figures.
    roles: [PlatformAdmin, Developer, InvestorAdmin, ComplianceMonitor]
    input: ["status?", "tax_year?", "limit?", "offset?"]
    output: CreditClaim[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /projects/{id}/recapture-events
    description: Lists the project's recapture assessments.
    roles: [PlatformAdmin, Developer, InvestorAdmin, ComplianceMonitor]
    input: ["event_type?", "status?", "limit?", "offset?"]
    output: RecaptureEvent[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /projects/{id}/compliance-covenants
    description: Lists the project's compliance covenants and their attestation posture.
    roles: [PlatformAdmin, Developer, InvestorAdmin, ComplianceMonitor]
    input: ["covenant_type?", "status?", "limit?", "offset?"]
    output: ComplianceCovenant[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /part-applications
    description: >
      Creates a part-by-part certification application (Part 1 significance, Part 2
      rehabilitation plan, Part 3 completed work). Requires
      expected_project_version (§1.2.1 partapp-create-supersede-stale-project).
    roles: [Developer]
    input: [project_id, part_number, narrative, expected_project_version]
    output: PartApplication
    success_code: 201
    side_effects:
      - "status = DRAFT; review_round = 1"
      - "when a DRAFT application already exists for the same project and part_number, that application transitions DRAFT -> SUPERSEDED and its id is recorded on supersedes_application_id"
      - "part_number 3 requires substantial_test_status == MET (ERR_SUBSTANTIAL_TEST_NOT_MET)"
      - "increments Project.version by 1"

  - method: GET
    path: /part-applications/{id}
    description: Reads a part application with its review round and reviewer assignments.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor, InvestorAdmin]
    input: []
    output: PartApplication
    success_code: 200
    side_effects: []

  - method: GET
    path: /part-applications
    description: >
      Lists part applications, filterable by project, part number, status, either
      reviewer assignment, and the application a row supersedes.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor, InvestorAdmin]
    input: ["project_id?", "part_number?", "status?", "shpo_reviewer_id?", "nps_reviewer_id?", "supersedes_application_id?", "limit?", "offset?"]
    output: PartApplication[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /part-applications/{id}/submit
    description: >
      Submits a DRAFT application for review and assigns the SHPO reviewer, subject
      to that reviewer's overlapping-window capacity.
    roles: [Developer]
    input: [shpo_reviewer_id]
    output: PartApplication
    success_code: 200
    side_effects:
      - "status DRAFT -> SHPO_REVIEW; submitted_at = logical clock now"
      - "review_window_end = submitted_at date + SHPO_REVIEW_WINDOW_DAYS (30) days"
      - "rejects a SUSPENDED or wrong-agency reviewer (ERR_REVIEWER_NOT_ELIGIBLE)"
      - "rejects a reviewer already holding REVIEWER_WINDOW_CAPACITY overlapping closed review windows (ERR_REVIEWER_WINDOW_CAPACITY)"
      - "for part_number 2 or 3, requires Property.evaluation_status == CERTIFIED_HISTORIC (ERR_PROPERTY_NOT_CERTIFIED_HISTORIC)"
      - "increments PartApplication.version by 1"

  - method: POST
    path: /part-applications/{id}/shpo-recommend
    description: Records the SHPO recommendation and forwards the application to NPS review.
    roles: [ShpoReviewer]
    input: [recommendation, "review_note?"]
    output: PartApplication
    success_code: 200
    side_effects:
      - "status SHPO_REVIEW -> NPS_REVIEW; shpo_recommendation set"
      - "increments PartApplication.version by 1"

  - method: POST
    path: /part-applications/{id}/nps-determination
    description: >
      Records the NPS determination. APPROVED advances the project's certification
      dimension, CONDITIONAL holds the application open pending amendments, DENIED
      returns it for revision. May not be issued by the reviewer who recommended.
    roles: [NpsReviewer]
    input: [determination, "waived_finding_ids?", "review_note?"]
    output: PartApplication
    success_code: 200
    side_effects:
      - "determination set; decision_at = logical clock now; nps_reviewer_id = X-User-ID"
      - "waived_finding_ids move those StandardFinding rows to resolution_state WAIVED and decrement the matching unresolved counters"
      - "APPROVED: status -> APPROVED, then Project.certification_status advances (part 1 -> PART1_CERTIFIED and Property.evaluation_status -> CERTIFIED_HISTORIC; part 2 -> PART2_APPROVED; part 3 -> PART3_CERTIFIED)"
      - "part 3 approval freezes the credit schedule (frozen_at_certification = true) and locks every classified CostLineItem"
      - "CONDITIONAL: status -> CONDITIONAL while unresolved_condition_count > 0"
      - "DENIED: status -> REVISION_REQUIRED; a part 1 denial sets Property.evaluation_status = NON_CERTIFIED and Project.certification_status = DECERTIFIED"
      - "rejects APPROVED while unresolved_violation_count > 0 (ERR_PRESERVATION_STANDARD_VIOLATION)"
      - "rejects X-User-ID == shpo_reviewer_id (ERR_SEGREGATION_OF_DUTIES)"
      - "increments PartApplication.version by 1; increments Project.version by 1 when the certification dimension moves"

  - method: POST
    path: /part-applications/{id}/resubmit
    description: >
      Resubmits an application that was returned for revision, reopening the review
      cycle at SHPO_REVIEW with the previously assigned reviewer.
    roles: [Developer]
    input: [narrative]
    output: PartApplication
    success_code: 200
    side_effects:
      - "status REVISION_REQUIRED -> SHPO_REVIEW; review_round += 1"
      - "shpo_recommendation -> NONE; determination -> NONE; decision_at -> null"
      - "submitted_at = logical clock now; review_window_end recomputed"
      - "rejects review_round > MAX_REVIEW_ROUNDS (3) with ERR_PART_APPLICATION_INVALID_STATE"
      - "increments PartApplication.version by 1"

  - method: POST
    path: /part-applications/{id}/findings
    description: >
      Raises a finding against one of the ten Secretary's Standards for
      Rehabilitation on an application under review.
    roles: [ShpoReviewer, NpsReviewer]
    input: [standard_number, severity, description]
    output: StandardFinding
    success_code: 201
    side_effects:
      - "resolution_state = UNRESOLVED"
      - "severity CONDITION increments the application's unresolved_condition_count"
      - "severity VIOLATION increments the application's unresolved_violation_count"
      - "requires the application status IN {SHPO_REVIEW, NPS_REVIEW, CONDITIONAL}"
      - "increments PartApplication.version by 1"

  - method: GET
    path: /part-applications/{id}/findings
    description: Lists the findings raised against an application.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor]
    input: ["severity?", "resolution_state?", "standard_number?", "limit?", "offset?"]
    output: StandardFinding[]
    success_code: 200
    side_effects: []

  - method: GET
    path: /findings/{id}
    description: Reads a single standards finding with its resolution state.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor]
    input: []
    output: StandardFinding
    success_code: 200
    side_effects: []

  - method: POST
    path: /cost-line-items
    description: >
      Records a rehabilitation cost. May be recorded unclassified or classified
      immediately; classification is validated against the category partition and
      the half-open measuring period.
    roles: [Developer]
    input: [project_id, vendor_name, category, amount_cents, incurred_date, "classification?"]
    output: CostLineItem
    success_code: 201
    side_effects:
      - "in_measuring_period computed against the project's half-open window"
      - "classification defaults to PENDING_CLASSIFICATION"
      - "qre_totals, substantial_rehabilitation_test and ratable_credit_schedule recomputed in that order"
      - "increments Project.version by 1"

  - method: POST
    path: /cost-line-items/{id}/classify
    description: >
      Classifies or reclassifies a cost as qualified or non-qualified. Locked items
      may only be reclassified by a ComplianceMonitor as an audit disallowance.
    roles: [Developer, ComplianceMonitor]
    input: [classification, "exclusion_reason?"]
    output: CostLineItem
    success_code: 200
    side_effects:
      - "reclassification_count += 1; exclusion_reason set or derived"
      - "qre_totals, substantial_rehabilitation_test and ratable_credit_schedule recomputed in that order"
      - "a MET -> NOT_MET flip on a PART3_CERTIFIED project creates a SYSTEM_DERIVED SUBSTANTIAL_TEST_FAILURE RecaptureEvent, raises recapture_balance_cents, moves compliance_status IN_SERVICE_MONITORING -> CURE_PENDING and moves FILED claims to ADJUSTED"
      - "increments CostLineItem.version by 1; increments Project.version by 1"

  - method: GET
    path: /cost-line-items/{id}
    description: Reads a cost line item with its classification and exclusion reason.
    roles: [PlatformAdmin, Developer, ComplianceMonitor, ShpoReviewer, NpsReviewer]
    input: []
    output: CostLineItem
    success_code: 200
    side_effects: []

  - method: POST
    path: /amendments
    description: >
      Submits a construction change against an approved or conditional Part 2 scope,
      optionally addressing an outstanding standards finding.
    roles: [Developer]
    input: [project_id, part_application_id, scope_category, change_description, cost_delta_cents, "addresses_finding_id?"]
    output: Amendment
    success_code: 201
    side_effects:
      - "status = DRAFT"
      - "requires_nps_concurrence computed from scope_category, abs(cost_delta_cents) >= NPS_CONCURRENCE_DELTA_CENTS (5000000) and the addressed finding's severity"
      - "rejects a finding raised against a different application (ERR_AMENDMENT_FINDING_MISMATCH)"

  - method: GET
    path: /amendments/{id}
    description: Reads an amendment with both agencies' concurrence decisions.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor]
    input: []
    output: Amendment
    success_code: 200
    side_effects: []

  - method: GET
    path: /amendments
    description: >
      Lists amendments, filterable by project, the amended part application, the
      finding addressed, and concurrence status.
    roles: [PlatformAdmin, Developer, ShpoReviewer, NpsReviewer, ComplianceMonitor]
    input: ["project_id?", "part_application_id?", "addresses_finding_id?", "status?", "limit?", "offset?"]
    output: Amendment[]
    success_code: 200
    side_effects: []

  - method: POST
    path: /amendments/{id}/submit
    description: Submits a DRAFT amendment for reviewer concurrence.
    roles: [Developer]
    input: []
    output: Amendment
    success_code: 200
    side_effects:
      - "status DRAFT -> SUBMITTED; submitted_at = logical clock now"
      - "increments Amendment.version by 1"

  - method: POST
    path: /amendments/{id}/concur
    description: >
      Records one agency's concurrence decision. The acting reviewer's agency selects
      the fork branch; the join completes when every required agency has concurred,
      and the completing concurrence fires the finding-resolution cascade.
    roles: [ShpoReviewer, NpsReviewer]
    input: [decision, "concurrence_note?"]
    output: Amendment
    success_code: 200
    side_effects:
      - "shpo_decision or nps_decision set according to the acting reviewer's agency"
      - "status advances per state_machines.Amendment (SUBMITTED -> CONCURRED, SUBMITTED -> SHPO_CONCURRED, SHPO_CONCURRED -> CONCURRED, or either -> OBJECTED)"
      - "on the completing CONCUR: the addressed StandardFinding -> RESOLVED, the application's unresolved_condition_count -= 1, a CONDITIONAL application whose count reaches 0 -> APPROVED, and the project's certification_status advances"
      - "on OBJECT: the finding stays UNRESOLVED and a CONDITIONAL application addressing a CONDITION finding -> REVISION_REQUIRED"
      - "increments Amendment.version by 1, plus StandardFinding / PartApplication / Project versions touched by the cascade"

  - method: POST
    path: /investor-interests
    description: >
      Admits an investor party under the project's structure — the lessee of a master
      lease or a direct partner in a single-tier pass-through — scoring its
      disqualification risk at admission.
    roles: [InvestorAdmin, Developer]
    input: [project_id, kind, party_legal_name, party_tax_status, capital_committed_cents, credit_allocation_pct, "lease_term_years?"]
    output: InvestorInterest
    success_code: 201
    side_effects:
      - "status = ADMITTED"
      - "pass_through_election = PENDING for a MASTER_LEASE_LESSEE, NOT_APPLICABLE otherwise"
      - "disqualification_risk_score computed with the ADMISSION variant; risk_variant_applied = ADMISSION"
      - "Project.max_investor_risk_score refreshed; increments Project.version by 1"
      - "rejects kind/structure_type mismatches, disqualified parties, an admission score at or above HIGH_RISK_THRESHOLD, and an allocation portfolio above 100.00 percent"

  - method: POST
    path: /investor-interests/{id}/elect-pass-through
    description: >
      Makes the pass-through election that lets the master-lease lessee claim the
      credit. Re-scores the interest under the ADMISSION variant.
    roles: [InvestorAdmin]
    input: []
    output: InvestorInterest
    success_code: 200
    side_effects:
      - "pass_through_election PENDING -> ELECTED; election_at = logical clock now"
      - "disqualification_risk_score recomputed with the ADMISSION variant (the pending-election penalty drops out)"
      - "Project.max_investor_risk_score refreshed; increments InvestorInterest.version by 1; increments Project.version by 1"

  - method: GET
    path: /investor-interests/{id}
    description: Reads an investor interest with its election state and risk score.
    roles: [PlatformAdmin, Developer, InvestorAdmin, ComplianceMonitor]
    input: []
    output: InvestorInterest
    success_code: 200
    side_effects: []

  - method: POST
    path: /credit-claims
    description: >
      Opens a DRAFT claim for one tax year of the ratable schedule, snapshotting the
      project's per-year credit as the claim's gross amount.
    roles: [InvestorAdmin]
    input: [project_id, tax_year]
    output: CreditClaim
    success_code: 201
    side_effects:
      - "gross_credit_cents = Project.annual_credit_cents at creation"
      - "claim_sequence derived from tax_year ordering among the project's claims"
      - "status = DRAFT"
      - "rejects a tax year outside the ratable window or already claimed"

  - method: POST
    path: /credit-claims/{id}/file
    description: >
      Files a DRAFT claim, applying any outstanding recapture balance as an offset in
      the pinned order of calculations.claim_settlement.
    roles: [InvestorAdmin]
    input: []
    output: CreditClaim
    success_code: 200
    side_effects:
      - "recapture_offset_cents = min(gross_credit_cents, Project.recapture_balance_cents); net_claim_cents = gross - offset"
      - "status DRAFT -> FILED; filed_at = logical clock now; filed_by_user_id = X-User-ID"
      - "Project ledger updated: credit_claimed_to_date_cents, credit_recaptured_cents, recapture_balance_cents, credit_unclaimed_cents"
      - "ASSESSED RecaptureEvent rows settle once recapture_balance_cents reaches 0, after which compliance_status CURE_PENDING -> IN_SERVICE_MONITORING when no covenant is BREACHED"
      - "increments CreditClaim.version by 1; increments Project.version by 1"

  - method: GET
    path: /credit-claims/{id}
    description: Reads a credit claim with its gross, offset and net amounts.
    roles: [PlatformAdmin, Developer, InvestorAdmin, ComplianceMonitor]
    input: []
    output: CreditClaim
    success_code: 200
    side_effects: []

  - method: POST
    path: /compliance-covenants
    description: >
      Creates a monitoring covenant for the five-year compliance period of a
      placed-in-service project.
    roles: [ComplianceMonitor, Developer]
    input: [project_id, covenant_type, monitoring_frequency, window_start_date, window_end_date]
    output: ComplianceCovenant
    success_code: 201
    side_effects:
      - "status = PENDING_ATTESTATION; attestation_count = 0; exception_count = 0"

  - method: POST
    path: /compliance-covenants/{id}/attest
    description: >
      Records a periodic attestation. An EXCEPTION outcome breaches the covenant,
      moves the project into CURE_PENDING and re-scores every admitted investor
      interest under the IN_SERVICE variant.
    roles: [Developer, ComplianceMonitor]
    input: [period_end_date, outcome]
    output: ComplianceCovenant
    success_code: 200
    side_effects:
      - "attestation_count += 1; last_attested_period_end = period_end_date"
      - "status advances per state_machines.ComplianceCovenant"
      - "EXCEPTION: exception_count += 1; cure_deadline_date set; Project.compliance_status -> CURE_PENDING; every ADMITTED InvestorInterest re-scored with the IN_SERVICE variant; max_investor_risk_score refreshed"
      - "SATISFIED on a BREACHED covenant: status -> CURED and, when nothing else is outstanding, compliance_status CURE_PENDING -> IN_SERVICE_MONITORING"
      - "increments ComplianceCovenant.version by 1; increments Project.version by 1 when the project posture or a risk score changes"

  - method: GET
    path: /compliance-covenants/{id}
    description: Reads a covenant with its attestation and exception counters.
    roles: [PlatformAdmin, Developer, ComplianceMonitor, InvestorAdmin]
    input: []
    output: ComplianceCovenant
    success_code: 200
    side_effects: []

  - method: POST
    path: /recapture-events
    description: >
      Reports a compliance failure inside the five-year period and assesses the
      recapture obligation against the credit claimed to date.
    roles: [ComplianceMonitor]
    input: [project_id, event_type, event_date]
    output: RecaptureEvent
    success_code: 201
    side_effects:
      - "full_years_elapsed, recapture_pct and recapture_amount_cents computed (calculations.recapture_assessment)"
      - "status = ASSESSED; source = REPORTED"
      - "Project.recapture_balance_cents += recapture_amount_cents"
      - "event_type OWNERSHIP_TRANSFER moves compliance_status -> RECAPTURED (absorbing); other types move IN_SERVICE_MONITORING -> CURE_PENDING"
      - "event_type IN {LEASE_TO_DISQUALIFIED, OWNERSHIP_TRANSFER} moves the MASTER_LEASE_LESSEE interest ADMITTED -> DISQUALIFIED"
      - "rejects an event_type of SUBSTANTIAL_TEST_FAILURE (system-derived only) with ERR_INVALID_REQUEST"
      - "increments Project.version by 1"

  - method: GET
    path: /recapture-events/{id}
    description: Reads an assessed or settled recapture event.
    roles: [PlatformAdmin, Developer, ComplianceMonitor, InvestorAdmin]
    input: []
    output: RecaptureEvent
    success_code: 200
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http_status: 401
    condition: "X-User-ID header missing or empty"
    applies_to: ["all except POST /_clock/set_current_utc"]
  - id: ERR_UNAUTHORIZED
    http_status: 403
    condition: "the caller's role is not authorized for the endpoint, or a Developer targets a project it does not own, or a Reviewer acts outside its agency"
    applies_to: ["all"]
  - id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    condition: "the NPS determination is issued by the same user who issued the SHPO recommendation on that application"
    applies_to: ["POST /part-applications/{id}/nps-determination"]
  - id: ERR_INVESTOR_NOT_ADMITTED
    http_status: 403
    condition: "the acting investor interest is DISQUALIFIED or belongs to a different project"
    applies_to: ["POST /credit-claims", "POST /credit-claims/{id}/file", "POST /investor-interests/{id}/elect-pass-through"]
  - id: ERR_INVALID_REQUEST
    http_status: 400
    condition: "malformed body, missing required field, unknown enum value, out-of-range number, malformed date, incoherent covenant window, backwards clock, or a client-supplied SUBSTANTIAL_TEST_FAILURE event_type"
    applies_to: ["all write endpoints"]
  - id: ERR_PROPERTY_NOT_FOUND
    http_status: 404
    condition: "the referenced Property does not exist"
    applies_to: ["GET /properties/{id}", "POST /projects"]
  - id: ERR_DEVELOPER_NOT_FOUND
    http_status: 404
    condition: "the referenced Developer does not exist"
    applies_to: ["GET /developers/{id}", "POST /projects"]
  - id: ERR_REVIEWER_NOT_FOUND
    http_status: 404
    condition: "the referenced Reviewer does not exist"
    applies_to: ["GET /reviewers/{id}", "POST /part-applications/{id}/submit"]
  - id: ERR_PROJECT_NOT_FOUND
    http_status: 404
    condition: "the referenced Project does not exist"
    applies_to: ["GET /projects/{id}", "PATCH /projects/{id}", "POST /projects/{id}/place-in-service", "GET /projects/{id}/qre-summary", "GET /projects/{id}/cost-line-items", "GET /projects/{id}/investor-interests", "GET /projects/{id}/credit-claims", "GET /projects/{id}/recapture-events", "GET /projects/{id}/compliance-covenants", "POST /part-applications", "POST /cost-line-items", "POST /amendments", "POST /investor-interests", "POST /credit-claims", "POST /recapture-events", "POST /compliance-covenants"]
  - id: ERR_PART_APPLICATION_NOT_FOUND
    http_status: 404
    condition: "the referenced PartApplication does not exist"
    applies_to: ["GET /part-applications/{id}", "POST /part-applications/{id}/submit", "POST /part-applications/{id}/shpo-recommend", "POST /part-applications/{id}/nps-determination", "POST /part-applications/{id}/resubmit", "POST /part-applications/{id}/findings", "GET /part-applications/{id}/findings", "POST /amendments"]
  - id: ERR_STANDARD_FINDING_NOT_FOUND
    http_status: 404
    condition: "the referenced StandardFinding does not exist (addresses_finding_id, or an id in waived_finding_ids)"
    applies_to: ["GET /findings/{id}", "POST /amendments", "POST /part-applications/{id}/nps-determination"]
  - id: ERR_COST_LINE_ITEM_NOT_FOUND
    http_status: 404
    condition: "the referenced CostLineItem does not exist"
    applies_to: ["GET /cost-line-items/{id}", "POST /cost-line-items/{id}/classify"]
  - id: ERR_AMENDMENT_NOT_FOUND
    http_status: 404
    condition: "the referenced Amendment does not exist"
    applies_to: ["GET /amendments/{id}", "POST /amendments/{id}/submit", "POST /amendments/{id}/concur"]
  - id: ERR_INVESTOR_INTEREST_NOT_FOUND
    http_status: 404
    condition: "the referenced InvestorInterest does not exist"
    applies_to: ["GET /investor-interests/{id}", "POST /investor-interests/{id}/elect-pass-through"]
  - id: ERR_CREDIT_CLAIM_NOT_FOUND
    http_status: 404
    condition: "the referenced CreditClaim does not exist"
    applies_to: ["GET /credit-claims/{id}", "POST /credit-claims/{id}/file"]
  - id: ERR_COMPLIANCE_COVENANT_NOT_FOUND
    http_status: 404
    condition: "the referenced ComplianceCovenant does not exist"
    applies_to: ["GET /compliance-covenants/{id}", "POST /compliance-covenants/{id}/attest"]
  - id: ERR_RECAPTURE_EVENT_NOT_FOUND
    http_status: 404
    condition: "the referenced RecaptureEvent does not exist"
    applies_to: ["GET /recapture-events/{id}"]
  - id: ERR_PART_APPLICATION_INVALID_STATE
    http_status: 409
    condition: "the requested action is not declared from the application's current status, or review_round would exceed MAX_REVIEW_ROUNDS"
    applies_to: ["POST /part-applications/{id}/submit", "POST /part-applications/{id}/shpo-recommend", "POST /part-applications/{id}/nps-determination", "POST /part-applications/{id}/resubmit", "POST /part-applications/{id}/findings"]
  - id: ERR_AMENDMENT_INVALID_STATE
    http_status: 409
    condition: "the amendment is not in a status from which the requested submit or concurrence is declared, including a second concurrence by the same agency"
    applies_to: ["POST /amendments/{id}/submit", "POST /amendments/{id}/concur"]
  - id: ERR_COVENANT_INVALID_STATE
    http_status: 409
    condition: "the attestation is not declared from the covenant's current status, or a cure attestation arrives after cure_deadline_date"
    applies_to: ["POST /compliance-covenants/{id}/attest"]
  - id: ERR_PROJECT_INVALID_STATE
    http_status: 409
    condition: "the project is PART3_CERTIFIED or DECERTIFIED and no longer editable, or place-in-service has already been declared"
    applies_to: ["PATCH /projects/{id}", "POST /projects/{id}/place-in-service"]
  - id: ERR_PROJECT_NOT_CERTIFIED
    http_status: 409
    condition: "place-in-service before PART2_APPROVED, or a credit claim action before PART3_CERTIFIED"
    applies_to: ["POST /projects/{id}/place-in-service", "POST /credit-claims", "POST /credit-claims/{id}/file"]
  - id: ERR_PROJECT_NOT_PLACED_IN_SERVICE
    http_status: 409
    condition: "the project has no placed_in_service_date"
    applies_to: ["POST /credit-claims", "POST /recapture-events", "POST /compliance-covenants", "POST /compliance-covenants/{id}/attest"]
  - id: ERR_COST_ITEM_LOCKED
    http_status: 409
    condition: "a Developer attempts to reclassify a LOCKED_QRE or LOCKED_NON_QRE line item"
    applies_to: ["POST /cost-line-items/{id}/classify"]
  - id: ERR_CREDIT_CLAIM_ALREADY_FILED
    http_status: 409
    condition: "the claim's status is FILED or ADJUSTED"
    applies_to: ["POST /credit-claims/{id}/file"]
  - id: ERR_PART_ALREADY_CERTIFIED
    http_status: 409
    condition: "an APPROVED application already exists for the same project and part_number"
    applies_to: ["POST /part-applications"]
  - id: ERR_CLAIM_YEAR_DUPLICATE
    http_status: 409
    condition: "another claim already exists for the same project and tax_year"
    applies_to: ["POST /credit-claims"]
  - id: ERR_PROPERTY_MEASURING_PERIOD_OVERLAP
    http_status: 409
    condition: "the project's half-open measuring period overlaps another non-decertified project's period on the same property"
    applies_to: ["POST /projects", "PATCH /projects/{id}"]
  - id: ERR_REVIEWER_WINDOW_CAPACITY
    http_status: 409
    condition: "the assigned SHPO reviewer already holds REVIEWER_WINDOW_CAPACITY overlapping closed review windows"
    applies_to: ["POST /part-applications/{id}/submit"]
  - id: ERR_STALE_PROJECT_VERSION
    http_status: 412
    condition: "expected_project_version does not equal the current Project.version"
    applies_to: ["POST /part-applications", "PATCH /projects/{id}"]
  - id: ERR_PART_SEQUENCE_VIOLATION
    http_status: 422
    condition: "part N is applied for before the part N-1 application of the same project reaches CONDITIONAL or APPROVED"
    applies_to: ["POST /part-applications"]
  - id: ERR_PROPERTY_NOT_CERTIFIED_HISTORIC
    http_status: 422
    condition: "a Part 2 or Part 3 application is submitted while the property's evaluation_status != CERTIFIED_HISTORIC"
    applies_to: ["POST /part-applications/{id}/submit"]
  - id: ERR_REVIEWER_NOT_ELIGIBLE
    http_status: 422
    condition: "the assigned reviewer is SUSPENDED or belongs to the wrong agency for the slot"
    applies_to: ["POST /part-applications/{id}/submit"]
  - id: ERR_PRESERVATION_STANDARD_VIOLATION
    http_status: 422
    condition: "an approval is attempted while the application has unresolved VIOLATION-severity findings"
    applies_to: ["POST /part-applications/{id}/nps-determination", "POST /amendments/{id}/concur"]
  - id: ERR_AMENDMENT_FINDING_MISMATCH
    http_status: 422
    condition: "addresses_finding_id names a finding raised against a different part application"
    applies_to: ["POST /amendments"]
  - id: ERR_NONQUALIFIED_CATEGORY
    http_status: 422
    condition: "a cost in a statutorily non-qualified category is classified as QRE"
    applies_to: ["POST /cost-line-items", "POST /cost-line-items/{id}/classify"]
  - id: ERR_OUTSIDE_MEASURING_PERIOD
    http_status: 422
    condition: "a cost incurred outside the half-open measuring period is classified as QRE"
    applies_to: ["POST /cost-line-items", "POST /cost-line-items/{id}/classify"]
  - id: ERR_SUBSTANTIAL_TEST_NOT_MET
    http_status: 422
    condition: "a Part 3 application is created, or a claim is filed, while substantial_test_status == NOT_MET"
    applies_to: ["POST /part-applications", "POST /credit-claims/{id}/file"]
  - id: ERR_STRUCTURE_TYPE_MISMATCH
    http_status: 422
    condition: "the investor interest kind or lease term does not match the project's structure_type, or a second master-lease lessee is admitted"
    applies_to: ["POST /investor-interests"]
  - id: ERR_DISQUALIFIED_PARTY
    http_status: 422
    condition: "a tax-exempt or governmental party is admitted as the master-lease lessee"
    applies_to: ["POST /investor-interests"]
  - id: ERR_DISQUALIFICATION_RISK_TOO_HIGH
    http_status: 422
    condition: "the admission score, or the project's standing max_investor_risk_score at filing, is at or above HIGH_RISK_THRESHOLD"
    applies_to: ["POST /investor-interests", "POST /credit-claims/{id}/file"]
  - id: ERR_ALLOCATION_EXCEEDS_LIMIT
    http_status: 422
    condition: "the sum of credit_allocation_pct over the project's ADMITTED interests would exceed 100.00"
    applies_to: ["POST /investor-interests"]
  - id: ERR_PASS_THROUGH_ELECTION_REQUIRED
    http_status: 422
    condition: "a claim on a MASTER_LEASE project is filed before the lessee's pass-through election"
    applies_to: ["POST /credit-claims/{id}/file"]
  - id: ERR_ELECTION_WINDOW_CLOSED
    http_status: 422
    condition: "the pass-through election is already ELECTED, or the interest's project is SINGLE_TIER so the election is NOT_APPLICABLE"
    applies_to: ["POST /investor-interests/{id}/elect-pass-through"]
  - id: ERR_CLAIM_YEAR_OUT_OF_WINDOW
    http_status: 422
    condition: "tax_year falls outside year(placed_in_service_date) .. year(placed_in_service_date) + RATABLE_YEARS - 1"
    applies_to: ["POST /credit-claims"]
  - id: ERR_RECAPTURE_OUTSIDE_COMPLIANCE_PERIOD
    http_status: 422
    condition: "event_date precedes placed_in_service_date, or full_years_elapsed >= COMPLIANCE_PERIOD_YEARS"
    applies_to: ["POST /recapture-events"]

# =============================================================================
# 1.7 RBAC Permission Matrix
# =============================================================================
roles:
  - name: Developer
    description: >
      The rehabilitation taxpayer. Owns projects, files part applications and
      amendments, records and classifies costs, declares placed-in-service, and
      attests to compliance covenants. Scoped to its own projects.
    identity: "entity_backed:Developer"
    exclusive_operations:
      - "POST /projects"
      - "PATCH /projects/{id}"
      - "POST /projects/{id}/place-in-service"
      - "POST /part-applications"
      - "POST /part-applications/{id}/submit"
      - "POST /part-applications/{id}/resubmit"
      - "POST /cost-line-items"
      - "POST /amendments"
      - "POST /amendments/{id}/submit"
    shared_operations:
      - "POST /properties"
      - "POST /cost-line-items/{id}/classify"
      - "POST /investor-interests"
      - "POST /compliance-covenants"
      - "POST /compliance-covenants/{id}/attest"
      - "all GET endpoints"
  - name: ShpoReviewer
    description: >
      State Historic Preservation Office reviewer. Issues the SHPO recommendation on
      applications assigned to it, raises standards findings, and records the SHPO
      side of an amendment concurrence. Identity resolves to a Reviewer whose
      agency == SHPO.
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /part-applications/{id}/shpo-recommend"
    shared_operations:
      - "POST /part-applications/{id}/findings"
      - "POST /amendments/{id}/concur"
      - "all GET endpoints except the investor and ledger sub-resource lists"
  - name: NpsReviewer
    description: >
      National Park Service reviewer. Issues the binding determination on each part
      application and the NPS side of an amendment concurrence. May never decide an
      application it recommended on as SHPO. Identity resolves to a Reviewer whose
      agency == NPS.
    identity: "entity_backed:Reviewer"
    exclusive_operations:
      - "POST /part-applications/{id}/nps-determination"
    shared_operations:
      - "POST /part-applications/{id}/findings"
      - "POST /amendments/{id}/concur"
      - "all GET endpoints except the investor and ledger sub-resource lists"
  - name: ComplianceMonitor
    description: >
      Monitors the five-year recapture period: reports recapture events, disallows
      locked costs on audit, and creates or attests covenants. Not bound to a single
      developer.
    identity: "opaque"
    exclusive_operations:
      - "POST /recapture-events"
    shared_operations:
      - "POST /cost-line-items/{id}/classify"
      - "POST /compliance-covenants"
      - "POST /compliance-covenants/{id}/attest"
      - "all GET endpoints"
  - name: InvestorAdmin
    description: >
      Administers the investor side of the structure: makes the pass-through
      election and opens and files credit claims. Identity resolves to an
      InvestorInterest, which scopes it to exactly one project.
    identity: "entity_backed:InvestorInterest"
    exclusive_operations:
      - "POST /investor-interests/{id}/elect-pass-through"
      - "POST /credit-claims"
      - "POST /credit-claims/{id}/file"
    shared_operations:
      - "POST /investor-interests"
      - "GET /projects/{id}"
      - "GET /projects"
      - "GET /projects/{id}/investor-interests"
      - "GET /projects/{id}/credit-claims"
      - "GET /projects/{id}/recapture-events"
      - "GET /projects/{id}/compliance-covenants"
      - "GET /properties/{id}"
      - "GET /developers/{id}"
      - "GET /investor-interests/{id}"
      - "GET /credit-claims/{id}"
      - "GET /recapture-events/{id}"
      - "GET /compliance-covenants/{id}"
  - name: PlatformAdmin
    description: >
      Seeds developer, reviewer and property identities and drives the logical clock.
      Holds no domain decision rights: it can neither review, classify costs, nor
      claim credits.
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /developers"
      - "POST /reviewers"
    shared_operations:
      - "POST /properties"
      - "all GET endpoints"
