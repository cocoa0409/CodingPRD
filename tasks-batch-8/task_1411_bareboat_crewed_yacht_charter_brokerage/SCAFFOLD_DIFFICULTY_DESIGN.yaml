            - "after both signs: status == SIGNED, funds_status == UNFUNDED (signature does not touch funds axis), version == 3"
            - "after SIGNING fund: status == SIGNED (unchanged), funds_status == DEPOSIT_HELD"
            - "start-prep while DEPOSIT_HELD fails with err == ERR_ESCROW_INSUFFICIENT"
            - "after FINAL fund: status == SIGNED, funds_status == FULLY_FUNDED"
