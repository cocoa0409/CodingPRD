  - section: complexity_layers
    instances:

      - name: optimistic_concurrency_stale_expected_pledge_version_on_designation_amend
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.designation-amend-stale-pledge
          - validations.priority_8
          - errors.ERR_STALE_VERSION
          - endpoints.POST /fundraising/pledges/{id}/designations:amend
          - entities.Pledge.fields.version
        distinguishing_aspect: |
          The OCC rule is checked before the state rule it would otherwise hide behind: the first
          amend carrying the version read after confirm (2) succeeds and advances the pledge to
          version 3 / designation_status AMENDED, and replaying the identical body with the same
          stale 2 returns ERR_STALE_VERSION (412, priority 8) rather than the
          ERR_PLEDGE_NOT_CONFIRMED (409, priority 13) that the AMENDED status would produce. The
          version must advance on every mutation for the second call to be stale at all.
        test_recipe:
          setup:
            - "One GOOD_STANDING agency, one OPEN campaign, one 500.00 pledge with a single 100.00 designation line, confirmed."
          setup_api_calls:
            - call: "POST /fundraising/agencies"
              payload: { legal_name: "Waverly Reading Project", ein: "640000001", primary_priority_area: "EDUCATION" }
              as: UnitedFundAdmin
              captures: { ag: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews"
              payload: { fiscal_year: 2025, program_expense_ratio: 0.7800, admin_expense_ratio: 0.1900, months_operating_reserve: 4.00, governance_checklist_passed_count: 8, audit_opinion: "UNQUALIFIED" }
              as: FinanceReviewer
              captures: { rev: $.data.id }
            - call: "POST /fundraising/agencies/${ag}/reviews/${rev}/certify"
              payload: { audited_program_expense_ratio: 0.7800, audited_admin_expense_ratio: 0.1900, audited_months_operating_reserve: 4.00 }
              as: FinanceReviewer
            - call: "POST /fundraising/employers"
              payload: { legal_name: "Kingfisher Software", employee_count: 130 }
              as: UnitedFundAdmin
              captures: { emp: $.data.id }
            - call: "POST /fundraising/employers/${emp}/activate"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp: $.data.id }
            - call: "POST /fundraising/campaigns/${camp}/open"
              payload: {}
              as: UnitedFundAdmin
            - call: "POST /fundraising/campaigns/${camp}/pledges"
              payload: { donor_reference: "V-001", giving_method: "ONE_TIME_CHECK", gross_amount: 500.00, designations: [ { agency_id: "${ag}", designated_amount: 100.00 } ] }
              as: UnitedFundAdmin
              captures: { pl: $.data.id, v_create: $.data.version }
            - call: "POST /fundraising/pledges/${pl}/confirm"
              payload: {}
              as: UnitedFundAdmin
              captures: { v_conf: $.data.version }
          trigger:
            - call: "POST /fundraising/pledges/${pl}/designations:amend"
              payload: { expected_pledge_version: "${v_conf}", designations: [ { agency_id: "${ag}", designated_amount: 200.00 }, { agency_id: "${ag}", designated_amount: 50.00 } ] }
              as: UnitedFundAdmin
              captures: { v_amend: $.data.version, ds: $.data.designation_status, fee: $.data.designation_fee_total }
            - call: "POST /fundraising/pledges/${pl}/designations:amend"
              payload: { expected_pledge_version: "${v_conf}", designations: [ { agency_id: "${ag}", designated_amount: 200.00 }, { agency_id: "${ag}", designated_amount: 50.00 } ] }
              as: UnitedFundAdmin
              captures: { err: $.data.error_id }
            - call: "GET /fundraising/pledges/${pl}/designations?status=ACTIVE"
              payload: {}
              as: UnitedFundAdmin
          assert:
            - "${v_create} == 1 and ${v_conf} == 2 (version increments on every mutation)"
            - "First amend: HTTP 200 with version 3, designation_status AMENDED, designated_amount_total 250.00, designation_fee_total 18.13 (14.50 + 3.63), net_designated_total 231.87, undesignated_amount 250.00"
            - "Second amend with the stale version 2: HTTP 412 with error_id ERR_STALE_VERSION - not ERR_PLEDGE_NOT_CONFIRMED, because priority 8 precedes priority 13"
            - "Pledge.${pl}.version is still 3 after the refused amend"
            - "GET designations?status=ACTIVE returns total_count == 2 (the 100.00 line is SUPERSEDED, not deleted)"
            - "GET /fundraising/pledges/${pl}/designations?status=SUPERSEDED returns total_count == 1 with collected_designated_amount 0.00"

      - name: optimistic_concurrency_stale_expected_allocation_cycle_version_on_award
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.award-create-stale-cycle
          - validations.priority_8
          - errors.ERR_STALE_VERSION
          - endpoints.POST /fundraising/allocation-cycles/{id}/awards
          - entities.AllocationCycle.fields.version
        distinguishing_aspect: |
          The cycle's OCC field advances on postures and pool recomputes, not only on awards, and
          priority 8 outranks the request-status rule: a version captured while the cycle was still
          DRAFT is already stale after the cycle opens, so the award is refused with
          ERR_STALE_VERSION (412) even though the request is legitimately PANEL_APPROVED; the same
          body with the freshly read version awards 34556.00; and replaying that same now-stale
          version returns ERR_STALE_VERSION again rather than the ERR_REQUEST_INVALID_STATE the
          AWARDED status would give.
        test_recipe:
          setup:
            - "One GOOD_STANDING agency; cycle pool 200000.00, max_award_per_agency 60000.00, ask 40000.00, three conflict-free panelists scoring 90/80/70 so the composite is 81.50 and the request reaches PANEL_APPROVED."
