  - rule_id: cross_entity_state_dependency
    instances:
      - name: placement_blocked_by_expired_governing_agreement
        entity_pair: "ConsignmentItem depends on ConsignmentAgreement.status"
        grounds:
          - validations[priority 14]
          - errors.ERR_AGREEMENT_NOT_ACTIVE
          - state_machines.ConsignmentAgreement
          - endpoints[POST /consignment-items/{id}/place]
          - endpoints[POST /_ops/markdown-run]
        distinguishing_aspect: |
          The dependency runs from an item to the agreement that governs it, and the
          agreement's expiry is not caused by any call against the item: the markdown epoch
          flips ACTIVE -> EXPIRED purely on the clock. The item itself is in a perfectly
          legal from-state for placement, so the refusal is attributable only to the other
          entity's state, and a second item on a longer-term agreement proves the same call
          still succeeds when the neighbour is healthy.
        test_recipe:
          setup:
            - "one consignor at floor 1 with no elevator, holding TWO activated agreements: AG1 with term_days 30 (expires 2026-08-31T00:00:00Z) and AG2 with term_days 365"
            - "item PA: SOFA, declared 189950, volume 55 cuft, footprint 24 sqft on AG1, screened and received at 7.0 / 6.5 / 6.0 -> grade B -> list_price_cents 126317"
            - "item PB: CASEGOOD, declared 60000, volume 20 cuft, footprint 18 sqft on AG2, screened and received at 8.0 / 9.0 / 9.0 -> grade A -> list_price_cents 51000"
            - "both collected on one completed 2-mover job from floor 1 while the clock is still the epoch: 12000 + 8 * 2500 == 32000, cap 87483 not binding, balance -32000, consignor ACTIVE"
            - "neither piece is placed yet; both sit in AWAITING_PLACEMENT with inventory_state IN_CUSTODY"
            - "clock moved to 2026-09-30T00:00:00Z and the markdown epoch run once, which expires AG1 and leaves AG2 ACTIVE"
            - "Front A zone is OPEN with capacity 200 and occupied_sqft 0"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { ps_id: "$.data.id" }
