            - "The fresh create returns HTTP 201 with MigrationBatch.${b2_id}.status == STAGED and MigrationBatch.${b1_id}.status == SUPERSEDED"
            - "GET /dso/migration-batches?practice_id=${prac_id}&status=STAGED returns total_count == 1"

