  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: tuition_money_conservation
        grounds:
          - entities.Enrollment.fields.retained_cents
          - calculations.granted_refund_cents
          - state_machines.RefundRequest.APPROVED_to_PAID
        distinguishing_aspect: |
          Conserved quantity: CAPTURED TUITION DOLLARS. Forward action pay (capture 51500)
          paired with compensating withdraw+refund (grant 41350) must satisfy
          paid_cents == retained_cents + granted_refund_cents (51500 == 10150 + 41350) with
          payment_status PARTIALLY_REFUNDED — no cents created or destroyed.
        test_recipe:
          setup:
            - "LICENSED school; course tuition 50000, required 3000; PUBLISHED offering 2026-09-01..2026-09-10; enrollment PAID 51500 with 300 VERIFIED minutes on 2026-09-03"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu One", email: "s1@x.com", license_goal_state: "TX" }, as: Registrar, captures: { st: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${st}" }, as: Registrar, captures: { enr: $.data.id } }
            - { call: "POST /enrollments/${enr}/pay", payload: { amount_cents: 51500 }, as: Registrar }
            - { call: "POST /enrollments/${enr}/attendance-records", payload: { session_date: "2026-09-03", minutes: 300 }, as: Instructor, as_user_id: "${ins}" }
          trigger:
            - { call: "POST /enrollments/${enr}/withdraw", payload: { reason: "VOLUNTARY", effective_date: "2026-09-04" }, as: Registrar }
            - { call: "GET /refund-requests?enrollment_id=${enr}", as: Registrar, captures: { rr: "$.data[0].id" } }
            - { call: "POST /refund-requests/${rr}/approve", as: SchoolDirector }
            - { call: "POST /refund-requests/${rr}/pay", as: Registrar }
            - { call: "GET /enrollments/${enr}", as: Registrar, captures: { paid: $.data.paid_cents, ret: $.data.retained_cents, pst: $.data.payment_status } }
          assert:
            - "RefundRequest.${rr}.status == PAID and granted_refund_cents == 41350"
            - "Enrollment.${enr}: paid_cents == 51500 and retained_cents == 10150"
            - "INVARIANT: paid_cents == retained_cents + granted_refund_cents  (51500 == 10150 + 41350)"
            - "Enrollment.${enr}.payment_status == PARTIALLY_REFUNDED   # granted < paid"

      - name: seat_conservation_cycle
        grounds:
          - calculations.enrolled_count_seats
          - entities.CourseOffering.fields.seats_available
          - state_machines.Enrollment.ENROLLED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: OFFERING SEATS. Enroll + withdraw (forward + compensating)
          must leave capacity == enrolled_count + seats_available at every step
          (2 == 1+1 == 2+0 == 1+1) — a PENDING-payment withdrawal frees the seat and VOIDs
          the payment without any refund artifact.
        test_recipe:
          setup:
            - "LICENSED school; PUBLISHED offering capacity 2; two students, both enrollments UNPAID (PENDING)"
          setup_api_calls:
            - { call: "POST /schools", payload: { school_name: "Lone Star Realty School", school_code: "LSRS", home_state_code: "TX" }, as: SchoolDirector, captures: { sch: $.data.id } }
            - { call: "POST /schools/${sch}/license", as: StateCommission }
            - { call: "POST /courses", payload: { school_id: "${sch}", course_code: "PRE-101", title: "TX Pre-Licensing", course_type: "PRE_LICENSING", required_seat_minutes: 3000, tuition_cents: 50000, pass_score_pct: 70, completion_deadline_days: 30, ce_credit_hours: 0 }, as: SchoolDirector, captures: { crs: $.data.id } }
            - { call: "POST /courses/${crs}/approvals", payload: { state_code: "TX" }, as: ComplianceOfficer, captures: { cap: $.data.id } }
            - { call: "POST /approvals/${cap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /courses/${crs}/activate", as: SchoolDirector }
            - { call: "POST /instructors", payload: { school_id: "${sch}", full_name: "Ira Instructor", license_number: "INS-001" }, as: Registrar, captures: { ins: $.data.id } }
            - { call: "POST /instructors/${ins}/approvals", payload: { state_code: "TX" }, as: Registrar, captures: { iap: $.data.id } }
            - { call: "POST /instructor-approvals/${iap}/decide", payload: { decision: "APPROVED", valid_from: "2026-08-01", valid_until: "2027-07-31" }, as: StateCommission }
            - { call: "POST /offerings", payload: { course_id: "${crs}", instructor_id: "${ins}", state_code: "TX", start_date: "2026-09-01", end_date: "2026-09-10", capacity: 2, delivery_mode: "IN_PERSON" }, as: SchoolDirector, captures: { off: $.data.id } }
            - { call: "POST /offerings/${off}/publish", as: SchoolDirector }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu A", email: "sa@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sa: $.data.id } }
            - { call: "POST /students", payload: { school_id: "${sch}", full_name: "Stu B", email: "sb@x.com", license_goal_state: "TX" }, as: Registrar, captures: { sb: $.data.id } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sa}" }, as: Registrar, captures: { ea: $.data.id } }
            - { call: "GET /offerings/${off}", as: Registrar, captures: { c1: $.data.enrolled_count, s1: $.data.seats_available } }
            - { call: "POST /enrollments", payload: { offering_id: "${off}", student_id: "${sb}" }, as: Registrar, captures: { eb: $.data.id } }
            - { call: "GET /offerings/${off}", as: Registrar, captures: { c2: $.data.enrolled_count, s2: $.data.seats_available } }
          trigger:
            - { call: "POST /enrollments/${ea}/withdraw", payload: { reason: "VOLUNTARY" }, as: Registrar, captures: { pyst: $.data.payment_status } }
            - { call: "GET /offerings/${off}", as: Registrar, captures: { c3: $.data.enrolled_count, s3: $.data.seats_available } }
            - { call: "GET /refund-requests?enrollment_id=${ea}", as: Registrar, captures: { n: $.data } }
          assert:
            - "step 1 (one enroll): enrolled_count == 1 and seats_available == 1   # 2 == 1 + 1"
            - "step 2 (two enrolls): enrolled_count == 2 and seats_available == 0  # 2 == 2 + 0"
            - "after withdraw: enrolled_count == 1 and seats_available == 1        # 2 == 1 + 1 — seat conserved"
            - "Enrollment.${ea}.payment_status == VOIDED and NO RefundRequest exists for it (refund list empty)  # PENDING never captured money"

      - name: certificate_sequence_conservation
        grounds:
          - calculations.certificate_number_assignment
          - entities.Certificate.fields.certificate_number
          - state_machines.Certificate.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Conserved quantity: ISSUED CERTIFICATE SEQUENCE. Issue + revoke (forward +
          compensating) never frees a number: after issuing 0001 and 0002 and revoking 0001,
          the next issuance is 0003 (not a reused 0001), and total issued (3) ==
          count(ACTIVE) (2) + count(REVOKED) (1). Different conserved quantity from money
          and seats.
        test_recipe:
          setup:
            - "LICENSED school (school_code LSRS); course required 60 min, ce_credit_hours 0; PUBLISHED offering; students A and B fully COMPLETED with certificates issued (clock at default 2026-08-01, issue year 2026); student C EXAM_PASSED awaiting certificate"
