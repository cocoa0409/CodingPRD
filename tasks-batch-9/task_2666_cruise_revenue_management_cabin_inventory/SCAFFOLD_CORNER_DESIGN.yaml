              as: ReservationAgent
              captures: { bk_nell: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_gt}", cabin_category_id: "${cat_ia}", guest_id: "${g_ada}", occupancy_adults: 2 }
