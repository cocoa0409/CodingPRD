      - name: reversal_assessment_seven_hop_cascade
        grounds:
          - state_machines.ReversalEvent.REPORTED_to_ASSESSED
          - calculations.reversal_assessment
          - entities.BufferAccount.fields.pool_status
          - state_machines.CreditBatch.LISTED_to_SUSPENDED
          - state_machines.GrowerPayment.ACCRUED_to_CLAWED_BACK
          - state_machines.Grower.ACTIVE_to_SUSPENDED
          - constants.CLAWBACK_SUSPENSION_THRESHOLD_CENTS
        distinguishing_aspect: |
          A single assess call must traverse seven hops in order: assessment arithmetic and
          reversal_count, buffer draw, pool DEFICIT, programme-wide listing freeze,
          permanence BREACHED, payment clawback, and finally grower suspension once
          outstanding_clawback_cents (792000) crosses 250000 - which itself re-cascades onto the
          enrollment and the field. The numbers are tuned so each hop is individually
          falsifiable: buffer_draw_credits is min(balance 199, affected 487) = 199 rather than
          487, unbacked_credits 288 drives a PER_ACRE clawback at the FULL 100 pct share
          (792000, not the 60 pct PER_CREDIT share), and Grower.outstanding_clawback_cents is
          booked once per reversal event rather than once per clawed-back payment.
        test_recipe:
          setup:
            - "Clock 2026-06-01T00:00:00Z; COVER_CROP standard v1 with buffer_base_pct 10.00."
            - "Grower G5 ACTIVE with reversal_count 0 and lifetime_credits_issued 0; field F5 (0,0)-(10000,2000) with mapped_acres 5000.00, LOAM; practice history scaled to prior_adoption_pct 12.00 (2021 FARM_RECORD 1000.00 adopted, 2022 REMOTE_SENSING 2500.00 adopted, non-adopted 2023/2024/2025 rows)."
