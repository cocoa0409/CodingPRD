      - name: market_freeze_cascades_program_pause_reservation_release
        grounds:
          - state_machines.Market.ACTIVE_to_FROZEN
          - state_machines.IncentiveProgram.ACTIVE_to_PAUSED
          - entities.Market.fields.budget_reserved_cents
        distinguishing_aspect: |
          Depth-2 cascade from trigger POST /markets/{id}/freeze: the freeze
          (link 1) pauses the ACTIVE GUARANTEE program (link 2), and that pause
          releases the 500000-cent reservation from market.budget_reserved_cents
          (link 3) — the budget shift is caused by the program pause, not
          directly by the freeze.
        test_recipe:
          setup:
            - "Clock default; Market SHV budget 1000000; GUARANTEE program ACTIVE with guaranteed_weekly_cents 500000 (reserved)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
