  - section: consistency_model
    instances:
      - name: derived_fields_are_visible_in_the_response_that_changed_them
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.number_inventory_census
          - calculations.account_e911_posture
          - calculations.fee_ledger_reconciliation
        distinguishing_aspect: "No re-read is needed anywhere: the device-create response already shows the number ASSIGNED in the block census, the verify response already shows the account COMPLIANT, and the assessment response already shows the jurisdiction and account ledgers raised - a follow-up GET returns byte-identical derived values."
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; block 415636 with number 5001; an ACTIVE account"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
