  - section: cross_cutting_layers
    instances:
      - name: occ_tasting_event_stale_version_on_seat_book
        claim_type: optimistic_concurrency
        grounds:
          - "\"concurrency_rules[tasting-seat-book-stale-event\"]"
        distinguishing_aspect: "Seat booking with stale expected_event_version returns 412."
        test_recipe:
          setup: ["Published TastingEvent; one seat booked (version advanced)"]
          setup_api_calls:
            - call: "POST /nabs/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
