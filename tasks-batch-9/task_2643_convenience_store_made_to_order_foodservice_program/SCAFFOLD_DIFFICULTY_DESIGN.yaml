# ===========================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml
# task_2643 - Convenience-Store Made-to-Order Foodservice Program (Wawa)
#
# Test-targeting index for SCAFFOLD.yaml section 1.8. Every instance grounds in
# elements already declared in sections 1.1-1.7; this file adds no new behavior.
# All money is integer cents, all point values are integers, and every numeric
# assertion below was executed against the section 1.3 formulas before being written.
#
# Shared fixture vocabulary used by the setup chains (each instance is
# self-contained and drives an empty database):
#   Store            WAWA-0101, fuel site, hot_case_slot_capacity 4, pickup_slot_capacity 2
#   HoldingUnit      BC-1, BAKERY_CASE, band 135..185 F, slot_count 3
#   MenuItem HOAGIE  HOAGIE-ITAL  SANDWICH MADE_TO_ORDER   899c / 300c cost / prep 180s / 1 premium included
#   MenuItem COFFEE  COFFEE-LG    BEVERAGE MADE_TO_ORDER   249c /  40c cost / prep  45s
#   MenuItem WRAP    WRAP-CHKN    SANDWICH MADE_TO_ORDER   505c / 180c cost / prep 120s
#   MenuItem PRETZEL PRETZEL-SOFT BAKERY   PAR_BAKED_CASE  199c /  40c cost / bake 25m / hold 240m
# ===========================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: loyalty_points_provisional_vs_final_diverge_on_catering_fuel_combo
        grounds:
          - calculations.loyalty_points_accrual
          - calculations.loyalty_tier_derivation
          - calculations.order_total_assembly
          - calculations.fuel_gallons_30d
          - state_machines.Order.DRAFT_to_PLACED
          - state_machines.Order.AUTHORIZED_to_SETTLED
          - entities.Order.fields.points_provisional
          - entities.Order.fields.points_final
        distinguishing_aspect: |
          The two variants of loyalty_points_accrual read DIFFERENT bases and DIFFERENT tiers off the
          same order: PROVISIONAL uses total_cents (5394 - 900 + 500 = 4994) at the pre-order BASIC
          tier and yields 49, while FINAL uses subtotal_gross_cents - promo_discount_cents (4494,
          service fee excluded) at the PLUS tier the provisional accrual itself unlocked and adds the
          FUEL_FOOD_COMBO bonus, yielding 106 - a settlement delta of +57 on the Order entity domain.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T11:00:00Z, store operating in the LUNCH daypart with a PUBLISHED staffing plan for 2026-08-01"
            - "fuel-site store; loyalty member seeded to lifetime_points_earned 495+ but still BASIC at 480, with 12.5 gallons of fuel inside the 30-day window"
            - "one ACTIVE FUEL_FOOD_COMBO promotion: CENTS_OFF 900, cap 900, min food subtotal 3000, requires 8 gallons, valid in LUNCH"
            - "one CATERING order holding a single line of 6 Italian Hoagies (6 x 899 = 5394 gross) with a next-day pickup window"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: true }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /promotion-rules"
              payload: { code: "FUELFOOD900", kind: "FUEL_FOOD_COMBO", discount_kind: "CENTS_OFF", discount_cents: 900, max_discount_cents: 900, min_food_subtotal_cents: 3000, requires_fuel_gallons: 8, valid_dayparts: ["LUNCH"], target_station: "ALL", stacking_rank: 10 }
              as: ChainAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /loyalty-accounts"
              payload: { member_code: "MBR-0001", email: "member1@example.com" }
              as: ChainAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /loyalty-accounts/${acct_id}/points-adjustments"
              payload: { delta_points: 480, reason: "GOODWILL_SEED" }
              as: ChainAdmin
            - call: "POST /loyalty-accounts/${acct_id}/fuel-transactions"
              payload: { gallons: 12.5, price_per_gallon_cents: 329, occurred_at: "2026-07-25T08:00:00Z" }
              as: ChainAdmin
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "CATERING", loyalty_account_id: "${acct_id}", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-02T00:30:00Z" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 6 }
              as: StoreTerminal
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { prov: $.data.points_provisional, total: $.data.total_cents }
            - call: "POST /orders/${order_id}/authorize"
              payload: { tender_type: "CARD" }
              as: StoreTerminal
            - call: "POST /orders/${order_id}/settle"
              payload: {}
              as: StoreTerminal
              captures: { fin: $.data.points_final }
          assert:
            - "Order.${order_id}.subtotal_gross_cents == 5394"
            - "Order.${order_id}.applied_promotion_id == ${promo_id}"
            - "Order.${order_id}.promo_discount_cents == 900"
            - "Order.${order_id}.service_fee_cents == 500"
            - "Order.${order_id}.total_cents == 4994"
            - "Order.${order_id}.points_provisional == 49"
            - "Order.${order_id}.points_final == 106"
            - "Order.${order_id}.points_final - Order.${order_id}.points_provisional == 57"
            - "LoyaltyAccount.${acct_id}.points_balance == 586"
            - "LoyaltyAccount.${acct_id}.lifetime_points_earned == 586"
            - "LoyaltyAccount.${acct_id}.points_reversed_total == 0"
            - "LoyaltyAccount.${acct_id}.tier == PLUS"

      - name: waste_valuation_food_cost_vs_retail_diverge_on_quality_discard
        grounds:
          - calculations.waste_valuation
          - calculations.inspection_readiness
          - state_machines.ProductionBatch.HOLDING_to_HOLDING
          - entities.WasteLog.fields.food_cost_cents
          - entities.WasteLog.fields.retail_value_cents
          - entities.Store.fields.waste_cost_cents_mtd
        distinguishing_aspect: |
          The same 24-unit pretzel write-off is valued twice on the ProductionBatch/WasteLog domain:
          FOOD_COST at unit_food_cost_cents gives 960 and is the ONLY basis that lands in
          Store.waste_cost_cents_mtd, while RETAIL at base_price_cents gives 4776 and surfaces only
          as WasteLog.retail_value_cents and readiness.retail_waste_exposure_cents - so the store
          ledger and the inspection binder disagree by 3816 cents on the identical event.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T11:00:00Z, store in the LUNCH daypart"
            - "one BAKERY_CASE holding unit with 3 slots, OPERATIONAL"
            - "one pretzel batch of 40 units baked and pulled into slot 1, HOLDING with hold_expires_at 2026-08-01T15:00:00Z"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "POST /stores/${store_id}/holding-units"
              payload: { unit_code: "BC-1", unit_type: "BAKERY_CASE", min_temp_f: 135, max_temp_f: 185, slot_count: 3 }
              as: StoreManager
              captures: { unit_id: $.data.id }
            - call: "POST /menu-items"
              payload: { sku: "PRETZEL-SOFT", name: "Soft Pretzel", station: "BAKERY", fulfillment_mode: "PAR_BAKED_CASE", base_price_cents: 199, unit_food_cost_cents: 40, bake_minutes: 25, hold_minutes: 240, valid_dayparts: ["BREAKFAST", "LUNCH"], is_catering_eligible: true }
              as: ChainAdmin
              captures: { pretzel_id: $.data.id }
            - call: "POST /production-batches"
              payload: { store_id: "${store_id}", menu_item_id: "${pretzel_id}", holding_unit_id: "${unit_id}", slot_index: 1, planned_qty: 40, bake_start_at: "2026-08-01T11:00:00Z" }
              as: KitchenAssociate
              captures: { batch_id: $.data.id }
            - call: "POST /production-batches/${batch_id}/bake"
              payload: {}
              as: KitchenAssociate
            - call: "POST /production-batches/${batch_id}/pull"
              payload: {}
              as: KitchenAssociate
              captures: { batch_v: $.data.version }
          trigger:
            - call: "POST /production-batches/${batch_id}/discard"
              payload: { qty: 24, reason: "QUALITY_REJECT", expected_batch_version: "${batch_v}" }
              as: KitchenAssociate
              as_user_id: "assoc-1"
            - call: "GET /production-batches/${batch_id}/waste-logs"
              payload: {}
              as: ShiftLead
              captures: { wl_food: "$.data[0].food_cost_cents", wl_retail: "$.data[0].retail_value_cents" }
            - call: "GET /stores/${store_id}/readiness"
              payload: {}
              as: FoodSafetyLead
          assert:
            - "WasteLog[0].food_cost_cents == 960"
            - "WasteLog[0].retail_value_cents == 4776"
            - "WasteLog[0].retail_value_cents - WasteLog[0].food_cost_cents == 3816"
            - "WasteLog[0].qty == 24"
            - "WasteLog[0].reason == QUALITY_REJECT"
            - "Store.${store_id}.waste_cost_cents_mtd == 960"
            - "GET /stores/${store_id}/readiness -> food_cost_waste_cents_mtd == 960"
            - "GET /stores/${store_id}/readiness -> retail_waste_exposure_cents == 4776"
            - "ProductionBatch.${batch_id}.remaining_qty == 16"
            - "ProductionBatch.${batch_id}.discarded_qty == 24"
            - "ProductionBatch.${batch_id}.status == HOLDING"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: promotion_discount_rounds_per_line_then_sums_to_304_not_303
        grounds:
          - calculations.promotion_discount
          - calculations.promotion_selection
          - calculations.line_gross_pricing
          - entities.OrderLine.fields.line_discount_cents
          - entities.OrderLine.fields.line_net_cents
        distinguishing_aspect: |
          Rounding-boundary mode: two SANDWICH lines of 1010 cents each at 1500 bp land exactly on the
          half-cent (151.5 per line), so round_half_up-per-line-then-sum gives 152 + 152 = 304 while
          the sum-then-round-once reading gives round_half_up(2020 * 0.15) = 303 - a one-cent fork that
          only the pinned two-step order resolves.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T11:00:00Z, store in the LUNCH daypart with a PUBLISHED staffing plan for 2026-08-01"
            - "one ACTIVE DAYPART_BUNDLE promotion: PCT_PER_LINE 1500 bp, cap 5000, target_station SANDWICH, valid in LUNCH"
            - "one anonymous TOUCHSCREEN order carrying two separate lines of 2 Chicken Wraps each (505 x 2 = 1010 gross per line)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /menu-items"
              payload: { sku: "WRAP-CHKN", name: "Chicken Wrap", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 505, unit_food_cost_cents: 180, prep_seconds: 120, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 0, is_catering_eligible: true }
              as: ChainAdmin
              captures: { wrap_id: $.data.id }
            - call: "POST /promotion-rules"
              payload: { code: "SANDWICH15", kind: "DAYPART_BUNDLE", discount_kind: "PCT_PER_LINE", discount_bp: 1500, max_discount_cents: 5000, min_food_subtotal_cents: 0, valid_dayparts: ["LUNCH"], target_station: "SANDWICH", stacking_rank: 10 }
              as: ChainAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "TOUCHSCREEN" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${wrap_id}", qty: 2 }
              as: StoreTerminal
              captures: { line_a: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${wrap_id}", qty: 2 }
              as: StoreTerminal
              captures: { line_b: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { promo_total: $.data.promo_discount_cents }
          assert:
            - "OrderLine.${line_a}.line_gross_cents == 1010"
            - "OrderLine.${line_b}.line_gross_cents == 1010"
            - "OrderLine.${line_a}.line_discount_cents == 152"
            - "OrderLine.${line_b}.line_discount_cents == 152"
            - "OrderLine.${line_a}.line_net_cents == 858"
            - "OrderLine.${line_b}.line_net_cents == 858"
            - "Order.${order_id}.subtotal_gross_cents == 2020"
            - "Order.${order_id}.promo_discount_cents == 304"
            - "Order.${order_id}.promo_discount_cents != 303"
            - "Order.${order_id}.applied_promotion_id == ${promo_id}"
            - "Order.${order_id}.service_fee_cents == 0"
            - "Order.${order_id}.total_cents == 1716"

      - name: catering_service_fee_evaluated_after_discount_not_on_gross
        grounds:
          - calculations.order_total_assembly
          - calculations.promotion_discount
          - entities.Order.fields.service_fee_cents
          - entities.Order.fields.total_cents
          - validations[priority=40]
        distinguishing_aspect: |
          Evaluation-order mode: the 800 bp catering fee is computed on the DISCOUNTED food subtotal
          (10788 - 2000 = 8788 -> 703) and is itself excluded from the promotion's eligibility basis,
          so total_cents is 9491; taking the fee on the gross subtotal instead gives 863 and a total of
          9651. The 6-step pipeline is the only reading that produces 703.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T11:00:00Z, store in the LUNCH daypart with a PUBLISHED staffing plan for 2026-08-01"
            - "one ACTIVE DAYPART_BUNDLE promotion: CENTS_OFF 2000, cap 2000, min food subtotal 5000, valid in LUNCH, target ALL"
            - "one anonymous CATERING order of 12 Italian Hoagies (10788 gross) with a next-day pickup window 13 hours out"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T11:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
            - call: "POST /stores/${store_id}/daypart-transitions"
              payload: { to_daypart: "LUNCH" }
              as: StoreManager
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { st_v: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${st_v}" }
              as: StoreManager
              captures: { plan_id: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/publish"
              payload: {}
              as: StoreManager
            - call: "POST /menu-items"
              payload: { sku: "HOAGIE-ITAL", name: "Italian Hoagie", station: "SANDWICH", fulfillment_mode: "MADE_TO_ORDER", base_price_cents: 899, unit_food_cost_cents: 300, prep_seconds: 180, valid_dayparts: ["BREAKFAST", "LUNCH", "DINNER", "OVERNIGHT"], included_premium_count: 1, is_catering_eligible: true }
              as: ChainAdmin
              captures: { hoagie_id: $.data.id }
            - call: "POST /promotion-rules"
              payload: { code: "TRAY2000", kind: "DAYPART_BUNDLE", discount_kind: "CENTS_OFF", discount_cents: 2000, max_discount_cents: 2000, min_food_subtotal_cents: 5000, valid_dayparts: ["LUNCH"], target_station: "ALL", stacking_rank: 20 }
              as: ChainAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /orders"
              payload: { store_id: "${store_id}", channel: "CATERING", pickup_window_start: "2026-08-02T00:00:00Z", pickup_window_end: "2026-08-02T00:30:00Z" }
              as: StoreTerminal
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/lines"
              payload: { menu_item_id: "${hoagie_id}", qty: 12 }
              as: StoreTerminal
              captures: { line_id: $.data.id }
          trigger:
            - call: "POST /orders/${order_id}/place"
              payload: {}
              as: StoreTerminal
              captures: { fee: $.data.service_fee_cents, tot: $.data.total_cents }
          assert:
            - "Order.${order_id}.subtotal_gross_cents == 10788"
            - "Order.${order_id}.promo_discount_cents == 2000"
            - "Order.${order_id}.service_fee_cents == 703"
            - "Order.${order_id}.service_fee_cents != 863"
            - "Order.${order_id}.total_cents == 9491"
            - "Order.${order_id}.total_cents != 9651"
            - "Order.${order_id}.applied_promotion_id == ${promo_id}"
            - "OrderLine.${line_id}.line_discount_cents == 2000"

      - name: staffing_labor_minutes_depend_on_station_split_not_total_forecast
        grounds:
          - calculations.staffing_labor_minutes
          - entities.StaffingPlan.fields.planned_labor_minutes
          - entities.StaffingPlan.fields.peak_multiplier_bp
          - concurrency_rules[staffing-plan-create-stale-store]
        distinguishing_aspect: |
          Input-interaction mode: three plans that all forecast 300 transactions yield 780, 600 and 900
          planned labor minutes, because the two ceil() terms are per-station (5000 bp split -> ceil(150/18)
          + ceil(150/45) = 9 + 4 hours; 3000 bp split -> ceil(90/18) + ceil(210/45) = 5 + 5 hours) and the
          BREAKFAST branch adds a flat 120 - so no single blended transactions-per-hour rate reproduces
          all three numbers.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T09:00:00Z; one store, still in its initial BREAKFAST daypart"
            - "no menu items, orders or batches are required - only the store exists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: ChainAdmin
            - call: "POST /stores"
              payload: { store_code: "WAWA-0101", name: "Wawa Route 1", hot_case_slot_capacity: 4, pickup_slot_capacity: 2, is_fuel_site: false }
              as: ChainAdmin
              captures: { store_id: $.data.id }
          trigger:
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { v1: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-01", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${v1}" }
              as: StoreManager
              captures: { plan_a: $.data.id, lm_a: $.data.planned_labor_minutes }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { v2: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-02", daypart: "LUNCH", forecast_txn_count: 300, mto_share_bp: 3000, expected_store_version: "${v2}" }
              as: StoreManager
              captures: { plan_b: $.data.id, lm_b: $.data.planned_labor_minutes }
            - call: "GET /stores/${store_id}"
              payload: {}
              as: StoreManager
              captures: { v3: $.data.version }
            - call: "POST /stores/${store_id}/staffing-plans"
              payload: { service_date: "2026-08-03", daypart: "BREAKFAST", forecast_txn_count: 300, mto_share_bp: 5000, expected_store_version: "${v3}" }
              as: StoreManager
              captures: { plan_c: $.data.id, lm_c: $.data.planned_labor_minutes }
          assert:
            - "StaffingPlan.${plan_a}.planned_labor_minutes == 780"
            - "StaffingPlan.${plan_b}.planned_labor_minutes == 600"
            - "StaffingPlan.${plan_c}.planned_labor_minutes == 900"
            - "StaffingPlan.${plan_a}.peak_multiplier_bp == 10000"
            - "StaffingPlan.${plan_b}.peak_multiplier_bp == 10000"
            - "StaffingPlan.${plan_c}.peak_multiplier_bp == 10000"
            - "StaffingPlan.${plan_a}.status == DRAFT"
            - "StaffingPlan.${plan_b}.status == DRAFT"
            - "StaffingPlan.${plan_c}.status == DRAFT"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: order_production_and_settlement_axes_advance_independently
        grounds:
          - state_machines.Order.DRAFT_to_PLACED
          - state_machines.Order.PLACED_to_IN_PRODUCTION
          - state_machines.Order.IN_PRODUCTION_to_ASSEMBLED
          - state_machines.Order.ASSEMBLED_to_READY
          - state_machines.Order.UNPAID_to_AUTHORIZED
          - state_machines.Order.AUTHORIZED_to_SETTLED
          - entities.Order.fields.production_status
          - entities.Order.fields.settlement_status
        distinguishing_aspect: |
          PARALLEL shape: the same Order row carries two state fields that move on different triggers -
