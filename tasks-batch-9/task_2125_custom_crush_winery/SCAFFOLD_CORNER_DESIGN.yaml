            - call: "GET /harvest-intakes/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { e_intake: $.data.error_id }
            - call: "GET /blend-trials/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: FacilityAdmin
              as_user_id: "fa-carol"
              captures: { e_trial: $.data.error_id }
