          assert:
            - "notice required_by_date == 2026-09-03 (effective 2026-09-10 minus 7 days)"
            - "sent on 2026-09-03: is_late == false (equality is on-time; the late comparison is strict >)"
            - "activate on 2026-09-10 succeeds: status == EFFECTIVE"

      - name: repricing_cadence_due_date_inclusive
        grounds:
          - calculations.repricing_cadence_status
          - entities.RepricingCycle.fields.status
        distinguishing_aspect: |
          Metric: cadence days, via GET /repricing-cycles. The due date itself is already OVERDUE
          (inclusive >=): last_reviewed 2026-08-15 + 30 days -> due 2026-09-14; 2026-09-13 reads
          CURRENT, 2026-09-14 reads OVERDUE.
        test_recipe:
          setup:
            - "P-CAD (SAVINGS, term 0, WHOLE_BALANCE, cap 500); RepricingCycle for (P-CAD, US-WEST) with cadence_days 30"
            - "Sheet for the pair EFFECTIVE 2026-08-15 (activation sets last_reviewed_at = 2026-08-15)"
          setup_api_calls:
