              as: DesignSystemLead
              captures: { a3: $.data.id, d3: $.data.alias_depth }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v4: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.a4", category: "COLOR", expected_token_set_version: "${v4}", alias_of_token_id: "${a3}" }
              as: DesignSystemLead
              captures: { a4: $.data.id, d4: $.data.alias_depth }
            - call: "GET /design-system/token-sets/${ts_id}"
              payload: {}
              as: DesignSystemLead
              captures: { v5: $.data.version }
            - call: "POST /design-system/tokens"
              payload: { token_set_id: "${ts_id}", name: "color.a5", category: "COLOR", expected_token_set_version: "${v5}", alias_of_token_id: "${a4}" }
              as: DesignSystemLead
              captures: { a5: $.data.id, d5: $.data.alias_depth, r5: $.data.resolved_value }
            - call: "GET /design-system/token-sets/${ts_id}"
