# =============================================================================
# PRD-Bench Scaffold — task_2526
# Legislative Bill Drafting & Fiscal Note Preparation (legislative services agency)
#
# §1.0–§1.7. The §1.8 Test Targeting Index lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml
# and the §1.9 Coverage Index lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Generate task harder than expert level!

  2526. Legislative Bill Drafting & Fiscal Note Preparation (legislative services
  agency): drafting request intake with confidentiality rules and member priority
  handling, statutory research, conflict identification with existing code and
  drafting style compliance, bill introduction, numbering, committee referral and
  companion bill tracking, fiscal note request routing to affected agencies with
  cost estimate methodology and assumptions, revenue impact estimation and
  multi-year projections with alternative scenarios, amendment drafting during
  committee and floor action with rapid turnaround, enrolled bill preparation,
  technical correction and signature routing, session deadline management and bill
  status reporting

domain_name: legislative-drafting-fiscal-notes

# Flat topology: every entity is a top-level collection addressed by its own id.
# There is no nesting prefix; `api_prefix: ""` means paths start at the collection
# segment (e.g. `/drafting-requests/{id}`). Nested POSTs exist only where the
# parent supplies an immutable field (e.g. `POST /bills/{id}/referrals`).
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: graph
  # Two self-referential edges (Bill.companion_bill_id -> Bill.id,
  # Amendment.supersedes_amendment_id -> Amendment.id) plus cross-aggregate edges
  # (FiscalNoteRequest.reopened_by_amendment_id -> Amendment.id) make the reference
  # graph non-tree: Bill<->Bill companions are mutually pointing, and the fiscal
  # subgraph points back into the amendment subgraph.

  state_machine_shape: cyclic
  # DraftingRequest DRAFTING -> RETURNED_FOR_CLARIFICATION -> DRAFTING,
  # FiscalNoteRequest SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED and
  # CERTIFIED -> ROUTED, Amendment ADOPTED -> DRAFTED (rescind) are all true
  # loops. Bill additionally carries two parallel state dimensions
  # (legislative_status x fiscal_status) that advance independently.

  relationship_patterns:
    - one_to_many        # Session -> Committee/Bill, Bill -> CommitteeReferral/Amendment
    - self_referential   # Bill.companion_bill_id, Amendment.supersedes_amendment_id
    - cross_aggregate    # FiscalNoteRequest.reopened_by_amendment_id, Amendment.committee_referral_id
    - polymorphic: false # not used — every reference names exactly one target entity

  role_model: segregation_of_duties
  # ReviewCounsel may not certify a draft they personally drafted, and may not
  # apply a technical correction they personally proposed. Both roles resolve
  # X-User-ID against the same Drafter table, so the separation is by identity,
  # not merely by role name.

  consistency_model: immediate

  difficulty_level: above_expert
  # 14 entities / 59 endpoints (24 GET, 35 POST) / 69 error codes / 12 calculations
  # (4 with variants) / 44 ordered validations / 10 state machines with 53
  # transitions. Density, not volume, is the point: every calculation is
  # gated by a state filter, every deadline is measured off a logical clock, and
  # the fiscal ledger on Session must survive adopt/rescind round trips exactly.

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  # ---------------------------------------------------------------------------
  - name: Session
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label for the legislative session, e.g. '2027 Regular Session'" }
      - { name: introduction_deadline_utc, type: datetime, source: input, description: "Last instant at which a bill may be introduced; POST /bills is rejected once the logical clock passes it", constraints: "ISO 8601 UTC; MUST be < committee_report_deadline_utc" }
      - { name: committee_report_deadline_utc, type: datetime, source: input, description: "Last instant at which a CommitteeReferral may be reported out", constraints: "MUST be < sine_die_utc" }
      - { name: sine_die_utc, type: datetime, source: input, description: "Scheduled adjournment instant; used by amendment turnaround compression" }
      - { name: fiscal_note_default_days, type: integer, source: input, description: "Baseline number of days granted to an agency for a fiscal note", default: 21, constraints: ">= 1" }
      - { name: constrained_threshold_cents, type: integer, source: input, description: "certified_fiscal_total_cents at or above which fiscal_posture becomes CONSTRAINED", constraints: ">= 0" }
      - { name: fiscal_cap_cents, type: integer, source: input, description: "Hard ceiling: a certification that would push certified_fiscal_total_cents above this value is rejected", constraints: ">= constrained_threshold_cents" }
      - { name: required_fiscal_years, type: array, source: input, description: "Ascending list of fiscal years every BASELINE cost estimate set MUST cover, e.g. [2027, 2028]", constraints: "non-empty array of integers, strictly ascending" }
      - { name: status, type: enum, source: system, description: "PENDING | CONVENED | ADJOURNED", default: PENDING }
      - { name: convened_utc, type: datetime, source: system, description: "Logical-clock instant at which POST /sessions/{id}/convene ran; null while PENDING", default: null }
      - { name: adjourned_utc, type: datetime, source: system, description: "Logical-clock instant at which POST /sessions/{id}/adjourn ran; null until ADJOURNED", default: null }
      - { name: next_house_bill_number, type: integer, source: system, description: "Next sequence number to mint for a HOUSE bill; never decremented, never reused", default: 1 }
      - { name: next_senate_bill_number, type: integer, source: system, description: "Next sequence number to mint for a SENATE bill; never decremented, never reused", default: 1 }
      - { name: certified_fiscal_total_cents, type: integer, source: computed, description: "Ledger: sum of certified_total_cents over FiscalNoteRequest rows in status CERTIFIED whose bill belongs to this session (see calculations.session_certified_fiscal_ledger)", default: 0 }
      - { name: fiscal_posture, type: enum, source: computed, description: "NORMAL | CONSTRAINED — CONSTRAINED iff certified_fiscal_total_cents >= constrained_threshold_cents", default: NORMAL }
      - { name: bills_introduced_count, type: integer, source: computed, description: "Count of Bill rows with this session_id, regardless of legislative_status", default: 0 }
      - { name: bills_enrolled_count, type: integer, source: computed, description: "Count of Bill rows with this session_id whose legislative_status is ENROLLED or TRANSMITTED", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legislator name" }
      - { name: chamber, type: enum, source: input, description: "HOUSE | SENATE — fixes the chamber of every bill this member sponsors" }
      - { name: party, type: string, source: input, description: "Party label, audit only" }
      - { name: priority_slots_total, type: integer, source: input, description: "Number of priority drafting requests this member may hold at once", default: 2, constraints: ">= 0" }
      - { name: priority_slots_used, type: integer, source: computed, description: "Count of this member's DraftingRequest rows with priority_flag true and status NOT IN {WITHDRAWN, LAPSED} (see calculations.member_priority_slot_ledger)", default: 0 }
      - { name: clarification_pending_count, type: integer, source: computed, description: "Count of this member's DraftingRequest rows in status RETURNED_FOR_CLARIFICATION", default: 0 }
      - { name: intake_hold, type: boolean, source: computed, description: "True iff clarification_pending_count >= MEMBER_CLARIFICATION_HOLD_THRESHOLD (2); blocks POST /drafting-requests for this member", default: false }

  # ---------------------------------------------------------------------------
  - name: Drafter
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Legislative services attorney name" }
      - { name: is_senior, type: boolean, source: input, description: "True iff this attorney may act under the ReviewCounsel role", default: false }
      - { name: max_concurrent_engagements, type: integer, source: input, description: "Maximum number of occupancy intervals whose closed windows may intersect at once", default: 2, constraints: ">= 1" }
      - { name: active_engagement_count, type: integer, source: computed, description: "Denormalized size of this drafter's occupancy set: DraftingRequest rows with assigned_drafter_id = this id and status IN {RESEARCH, DRAFTING}, plus Amendment rows with drafted_by_drafter_id = this id and status = DRAFTED", default: 0 }

  # ---------------------------------------------------------------------------
  - name: Agency
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Executive agency name" }
      - { name: agency_code, type: string, source: input, description: "Short agency code", constraints: "unique across agencies" }
      - { name: status, type: enum, source: input, description: "ACTIVE | INACTIVE — INACTIVE agencies may not receive new fiscal note requests", default: ACTIVE }
      - { name: max_open_requests, type: integer, source: input, description: "Maximum number of FiscalNoteRequest rows in status IN {ROUTED, SUBMITTED, RETURNED_FOR_REVISION} this agency may hold", default: 3, constraints: ">= 1" }
      - { name: open_request_count, type: integer, source: computed, description: "Count of this agency's FiscalNoteRequest rows in status IN {ROUTED, SUBMITTED, RETURNED_FOR_REVISION}", default: 0 }
      - { name: late_submission_count, type: integer, source: computed, description: "Number of times this agency submitted a fiscal note after its due_utc", default: 0 }
      - { name: revision_count, type: integer, source: computed, description: "Number of times a fiscal note from this agency was returned for revision", default: 0 }
      - { name: responsiveness_score, type: integer, source: computed, description: "max(0, min(100, 100 - 12*late_submission_count - 5*revision_count)); drives the due-date grant band (see calculations.fiscal_note_due_date)", default: 100 }

  # ---------------------------------------------------------------------------
  - name: Committee
    parent: Session
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id; taken from the POST /sessions/{id}/committees path, never from the body" }
      - { name: chamber, type: enum, source: input, description: "HOUSE | SENATE — a bill may only be referred to a committee of its own chamber" }
      - { name: name, type: string, source: input, description: "Committee name" }
      - { name: is_fiscal_committee, type: boolean, source: input, description: "True iff this committee satisfies the CONSTRAINED-posture fiscal referral requirement", default: false }
      - { name: max_concurrent_referrals, type: integer, source: input, description: "Maximum number of CommitteeReferral rows in status IN_COMMITTEE this committee may hold", default: 2, constraints: ">= 1" }
      - { name: active_referral_count, type: integer, source: computed, description: "Count of this committee's CommitteeReferral rows in status IN_COMMITTEE", default: 0 }

  # ---------------------------------------------------------------------------
  - name: DraftingRequest
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: input, description: "FK -> Session.id; the session the request is filed under" }
      - { name: member_id, type: string, source: system, description: "FK -> Member.id; set from the submitting Member's X-User-ID, never from the body" }
      - { name: subject, type: string, source: input, description: "Short subject line" }
      - { name: summary, type: string, source: input, description: "Narrative description of the requested legislation" }
      - { name: confidentiality, type: enum, source: input, description: "CONFIDENTIAL | PUBLIC — CONFIDENTIAL requests are readable only by their sponsor and by agency-internal roles", default: PUBLIC }
      - { name: priority_flag, type: boolean, source: input, description: "True iff the request consumes one of the member's priority slots", default: false }
      - { name: requested_sections_count, type: integer, source: input, description: "Number of statute sections the member believes must be touched; feeds the INTAKE_ESTIMATE complexity variant", constraints: ">= 1" }
      - { name: target_code_chapter, type: string, source: input, description: "Code chapter the request is aimed at, audit only" }
      - { name: appropriation_requested_cents, type: integer, source: input, description: "Appropriation the member is asking for; strictly positive values make a fiscal note mandatory on introduction", default: 0, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | RESEARCH | DRAFTING | RETURNED_FOR_CLARIFICATION | DRAFT_READY | CONVERTED | WITHDRAWN | LAPSED", default: SUBMITTED }
      - { name: assigned_drafter_id, type: string, source: system, description: "FK -> Drafter.id; null until POST /drafting-requests/{id}/assign", default: null }
      - { name: engagement_start_utc, type: datetime, source: system, description: "Start of the drafter occupancy interval reserved by the assignment; null until assigned", default: null }
      - { name: engagement_end_utc, type: datetime, source: system, description: "End of the drafter occupancy interval reserved by the assignment; intervals are CLOSED at both ends", default: null }
      - { name: affected_sections_count, type: integer, source: system, description: "Section count established by statutory research; supplied at complete-research and used by the POST_RESEARCH_ACTUAL complexity variant", default: null }
      - { name: research_completed_utc, type: datetime, source: system, description: "Logical-clock instant of complete-research; baseline for sla_due_utc", default: null }
      - { name: intake_complexity_estimate, type: integer, source: computed, description: "INTAKE_ESTIMATE variant of calculations.drafting_complexity_score, frozen at submission", default: null }
      - { name: actual_complexity_score, type: integer, source: computed, description: "POST_RESEARCH_ACTUAL variant of calculations.drafting_complexity_score, recomputed at every complete-research and clarify", default: null }
      - { name: sla_due_utc, type: datetime, source: computed, description: "calculations.drafting_sla_due_utc; cleared to null whenever the request leaves DRAFTING", default: null }
      - { name: revision_round, type: integer, source: computed, description: "Number of completed RETURNED_FOR_CLARIFICATION -> DRAFTING loops", default: 0 }
      - { name: blocking_conflict_count, type: integer, source: computed, description: "Count of this request's StatutoryConflict rows with severity BLOCKING, any resolution_status", default: 0 }
      - { name: open_blocking_conflict_count, type: integer, source: computed, description: "Count of this request's StatutoryConflict rows with severity BLOCKING and resolution_status OPEN", default: 0 }
      - { name: advisory_conflict_count, type: integer, source: computed, description: "Count of this request's StatutoryConflict rows with severity ADVISORY, any resolution_status", default: 0 }
      - { name: style_findings_count, type: integer, source: system, description: "Drafting-style findings reported by review counsel at certify-draft; null before the first attempt", default: null }

  # ---------------------------------------------------------------------------
  - name: StatutoryConflict
    parent: DraftingRequest
    common_fields: true
    fields:
      - { name: drafting_request_id, type: string, source: input, description: "FK -> DraftingRequest.id; the request whose research produced this finding" }
      - { name: code_citation, type: string, source: input, description: "Citation of the existing code provision in conflict" }
      - { name: conflict_type, type: enum, source: input, description: "AMENDS_SAME_SECTION | REPEALS_ACTIVE | DUPLICATE_ENACTMENT | STYLE_VIOLATION" }
      - { name: severity, type: enum, source: input, description: "BLOCKING | ADVISORY — BLOCKING findings logged while the request is DRAFTING bounce it back to the sponsor" }
      - { name: resolution_status, type: enum, source: system, description: "OPEN | RESOLVED | WAIVED — WAIVED requires review counsel", default: OPEN }
      - { name: resolution_note, type: string, source: system, description: "Narrative supplied at resolve time; for WAIVED it is the waiver justification", default: null }
      - { name: resolved_utc, type: datetime, source: system, description: "Logical-clock instant at which resolution_status left OPEN", default: null }

  # ---------------------------------------------------------------------------
  - name: Bill
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> Session.id; copied from the originating drafting request" }
      - { name: drafting_request_id, type: string, source: input, description: "FK -> DraftingRequest.id; the DRAFT_READY request being introduced" }
      - { name: sponsor_member_id, type: string, source: system, description: "FK -> Member.id; copied from the originating drafting request" }
      - { name: companion_bill_id, type: string, source: system, description: "FK -> Bill.id; opposite-chamber companion, set on BOTH rows by POST /bills/{id}/companion", default: null }
      - { name: chamber, type: enum, source: system, description: "HOUSE | SENATE — copied from the sponsor's chamber" }
      - { name: bill_number, type: string, source: computed, description: "calculations.bill_number_assignment, e.g. 'HB 1' / 'SB 4'; immutable once minted" }
      - { name: legislative_status, type: enum, source: system, description: "Dimension 1: INTRODUCED | REFERRED | REPORTED | PASSED_CHAMBER | ENROLLED | TRANSMITTED | DEAD", default: INTRODUCED }
      - { name: fiscal_status, type: enum, source: system, description: "Dimension 2, independent of legislative_status: NOT_REQUIRED | NOTE_PENDING | NOTE_STALE | NOTE_COMPLETE" }
      - { name: appropriation_requested_cents, type: integer, source: system, description: "Copied from the drafting request at introduction; frozen thereafter" }
      - { name: priority_bill, type: boolean, source: system, description: "Copied from the drafting request's priority_flag" }
      - { name: introduced_utc, type: datetime, source: system, description: "Logical-clock instant of introduction" }
      - { name: adopted_fiscal_delta_cents, type: integer, source: computed, description: "Sum of fiscal_impact_delta_cents over this bill's Amendment rows in status ADOPTED", default: 0 }
      - { name: adopted_amendment_count, type: integer, source: computed, description: "Count of this bill's Amendment rows in status ADOPTED", default: 0 }
      - { name: referral_count, type: integer, source: computed, description: "Count of this bill's CommitteeReferral rows, any status; also the source of the next referral_order", default: 0 }

  # ---------------------------------------------------------------------------
  - name: CommitteeReferral
    parent: Bill
    common_fields: true
    fields:
      - { name: bill_id, type: string, source: system, description: "FK -> Bill.id; taken from the POST /bills/{id}/referrals path" }
      - { name: committee_id, type: string, source: input, description: "FK -> Committee.id; must be a committee of the bill's session and chamber" }
      - { name: referral_order, type: integer, source: computed, description: "1-based sequence within the bill: bill.referral_count + 1 at creation time" }
      - { name: hearing_window_start_utc, type: datetime, source: input, description: "Start of the committee's exclusive hearing window; windows are HALF-OPEN [start, end)" }
      - { name: hearing_window_end_utc, type: datetime, source: input, description: "End of the hearing window, exclusive", constraints: "MUST be > hearing_window_start_utc" }
      - { name: report_deadline_utc, type: datetime, source: computed, description: "min(hearing_window_end_utc + 7 days, session.committee_report_deadline_utc)" }
      - { name: status, type: enum, source: system, description: "IN_COMMITTEE | REPORTED_FAVORABLE | REPORTED_UNFAVORABLE | DIED_IN_COMMITTEE", default: IN_COMMITTEE }
      - { name: reported_utc, type: datetime, source: system, description: "Logical-clock instant of the report action", default: null }

  # ---------------------------------------------------------------------------
  - name: FiscalNoteRequest
    parent: Bill
    common_fields: true
    fields:
      - { name: bill_id, type: string, source: system, description: "FK -> Bill.id; taken from the POST /bills/{id}/fiscal-note-requests path" }
      - { name: agency_id, type: string, source: input, description: "FK -> Agency.id; the affected agency the request is routed to" }
      - { name: reopened_by_amendment_id, type: string, source: system, description: "FK -> Amendment.id; set when an adopted amendment decertified this note, cleared when that amendment is rescinded", default: null }
      - { name: methodology, type: enum, source: input, description: "INCREMENTAL_COST | FULL_ABSORPTION — selects the cost-total variant" }
      - { name: routed_utc, type: datetime, source: system, description: "Logical-clock instant of the most recent routing (initial or re-open)" }
      - { name: due_utc, type: datetime, source: computed, description: "calculations.fiscal_note_due_date, recomputed on every routing" }
      - { name: submitted_utc, type: datetime, source: system, description: "Logical-clock instant of the most recent submission", default: null }
      - { name: certified_utc, type: datetime, source: system, description: "Logical-clock instant of certification; retained while re-opened", default: null }
      - { name: status, type: enum, source: system, description: "ROUTED | SUBMITTED | RETURNED_FOR_REVISION | CERTIFIED | LAPSED", default: ROUTED }
      - { name: revision_round, type: integer, source: computed, description: "Incremented on every return-for-revision and on every amendment-driven re-open; CostEstimate rows carry the round they were filed under", default: 0 }
      - { name: late_submission, type: boolean, source: computed, description: "True iff the most recent submitted_utc was strictly after due_utc", default: false }
      - { name: direct_cost_cents, type: integer, source: computed, description: "Methodology-dependent direct cost from calculations.fiscal_note_cost_total; null until first submission", default: null }
      - { name: contingency_pct, type: number, source: computed, description: "Contingency rate selected from the direct_cost_cents tier (0.05 / 0.08 / 0.12)", default: null }
      - { name: contingency_cents, type: integer, source: computed, description: "round_half_up(direct_cost_cents * contingency_pct)", default: null }
      - { name: certified_total_cents, type: integer, source: computed, description: "direct_cost_cents + contingency_cents; the amount posted to Session.certified_fiscal_total_cents on certification", default: null }
      - { name: projected_revenue_total_cents, type: integer, source: computed, description: "BASELINE four-year revenue projection from calculations.multi_year_revenue_projection", default: null }
      - { name: high_scenario_total_cents, type: integer, source: computed, description: "HIGH-scenario four-year revenue projection", default: null }
      - { name: low_scenario_total_cents, type: integer, source: computed, description: "LOW-scenario four-year revenue projection", default: null }

  # ---------------------------------------------------------------------------
  - name: CostEstimate
    parent: FiscalNoteRequest
    common_fields: false
    fields:
      - { name: fiscal_note_request_id, type: string, source: system, description: "FK -> FiscalNoteRequest.id; taken from the POST path" }
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year this line covers", constraints: ">= 2000" }
      - { name: scenario, type: enum, source: input, description: "BASELINE | HIGH | LOW — only BASELINE lines enter the cost total" }
      - { name: revision_round, type: integer, source: system, description: "Copied from the parent's revision_round at creation; append-only lines from earlier rounds are excluded from every total" }
      - { name: personnel_cost_cents, type: integer, source: input, description: "Personnel cost for the year", constraints: ">= 0" }
      - { name: operating_cost_cents, type: integer, source: input, description: "Operating cost for the year", constraints: ">= 0" }
      - { name: one_time_cost_cents, type: integer, source: input, description: "Non-recurring cost for the year", constraints: ">= 0" }
      - { name: fte_count, type: number, source: input, description: "Full-time-equivalent staffing; under INCREMENTAL_COST a line with fte_count < 0.5 has its personnel cost absorbed by existing staff and excluded", constraints: ">= 0" }
      - { name: revenue_impact_cents, type: integer, source: input, description: "Signed revenue impact for the year; only the earliest required fiscal year's value seeds the projection" }
      - { name: assumption_note, type: string, source: input, description: "Cost estimate methodology assumptions, audit only" }
      - { name: included_in_certification, type: boolean, source: computed, description: "True iff revision_round equals the parent's current revision_round" }

  # ---------------------------------------------------------------------------
  - name: Amendment
    parent: Bill
    common_fields: true
    fields:
      - { name: bill_id, type: string, source: input, description: "FK -> Bill.id; the bill being amended" }
      - { name: committee_referral_id, type: string, source: input, description: "FK -> CommitteeReferral.id; required for stage COMMITTEE, MUST be null for stage FLOOR", default: null }
      - { name: requested_by_member_id, type: string, source: system, description: "FK -> Member.id; set from the requesting Member's X-User-ID" }
      - { name: drafted_by_drafter_id, type: string, source: system, description: "FK -> Drafter.id; set from the drafting attorney's X-User-ID at draft time", default: null }
      - { name: supersedes_amendment_id, type: string, source: input, description: "FK -> Amendment.id; an earlier amendment on the SAME bill in status REJECTED or LAPSED that this one replaces", default: null }
      - { name: stage, type: enum, source: input, description: "COMMITTEE | FLOOR" }
      - { name: summary, type: string, source: input, description: "Amendment description" }
      - { name: fiscal_impact_delta_cents, type: integer, source: input, description: "Signed change to the bill's fiscal footprint; a non-zero value staled the certified note on adoption" }
      - { name: drafting_start_utc, type: datetime, source: input, description: "Start of the drafter occupancy interval this amendment will need; intervals are CLOSED at both ends" }
      - { name: drafting_due_utc, type: datetime, source: input, description: "End of the drafter occupancy interval", constraints: "MUST be > drafting_start_utc" }
      - { name: requested_utc, type: datetime, source: system, description: "Logical-clock instant of the member's request" }
      - { name: turnaround_deadline_utc, type: datetime, source: computed, description: "calculations.amendment_turnaround_deadline; drafting after this instant is refused" }
      - { name: status, type: enum, source: system, description: "REQUESTED | DRAFTED | ADOPTED | REJECTED | LAPSED", default: REQUESTED }
      - { name: drafted_utc, type: datetime, source: system, description: "Logical-clock instant of drafting", default: null }
      - { name: adopted_utc, type: datetime, source: system, description: "Logical-clock instant of the most recent adoption", default: null }
      - { name: rescind_count, type: integer, source: computed, description: "Number of completed ADOPTED -> DRAFTED rescissions", default: 0 }

  # ---------------------------------------------------------------------------
  - name: EnrolledBill
    parent: Bill
    common_fields: true
    fields:
      - { name: bill_id, type: string, source: system, description: "FK -> Bill.id; exactly one EnrolledBill per bill" }
      - { name: adopted_amendment_count, type: integer, source: computed, description: "Count of the bill's ADOPTED amendments frozen at enrollment" }
      - { name: net_fiscal_delta_cents, type: integer, source: computed, description: "Sum of fiscal_impact_delta_cents over the bill's ADOPTED amendments, frozen at enrollment" }
      - { name: enrollment_sequence, type: array, source: computed, description: "Ordered amendment ids: COMMITTEE-stage before FLOOR-stage, then created_at ASC within stage" }
      - { name: origin_signature_role, type: enum, source: computed, description: "SPEAKER | SENATE_PRESIDENT — presiding officer of the bill's originating chamber, who must sign first" }
      - { name: expected_next_signature, type: enum, source: computed, description: "SPEAKER | SENATE_PRESIDENT | GOVERNOR_TRANSMITTAL | NONE — the only signature_role POST /enrolled-bills/{id}/signatures will accept next" }
      - { name: status, type: enum, source: system, description: "PREPARED | ORIGIN_SIGNED | SECOND_SIGNED | TRANSMITTED", default: PREPARED }
      - { name: corrections_applied_count, type: integer, source: computed, description: "Count of this enrollment's TechnicalCorrection rows in status APPLIED", default: 0 }
      - { name: open_corrections_count, type: integer, source: computed, description: "Count of this enrollment's TechnicalCorrection rows in status PROPOSED", default: 0 }
      - { name: origin_signed_utc, type: datetime, source: system, description: "Logical-clock instant of the origin-chamber signature", default: null }
      - { name: second_signed_utc, type: datetime, source: system, description: "Logical-clock instant of the second-chamber signature", default: null }
      - { name: transmitted_utc, type: datetime, source: system, description: "Logical-clock instant of transmittal to the governor", default: null }

  # ---------------------------------------------------------------------------
  - name: TechnicalCorrection
    parent: EnrolledBill
    common_fields: true
    fields:
      - { name: enrolled_bill_id, type: string, source: system, description: "FK -> EnrolledBill.id; taken from the POST path" }
      - { name: proposed_by_drafter_id, type: string, source: system, description: "FK -> Drafter.id; set from the proposing attorney's X-User-ID" }
      - { name: applied_by_drafter_id, type: string, source: system, description: "FK -> Drafter.id; set from the applying review counsel's X-User-ID; MUST differ from proposed_by_drafter_id", default: null }
      - { name: correction_type, type: enum, source: input, description: "TYPO | CITATION | CROSS_REFERENCE | NUMBERING" }
      - { name: description, type: string, source: input, description: "What the correction changes" }
      - { name: is_substantive, type: boolean, source: input, description: "Self-declared substantive flag; a substantive correction is refused outright — enrolled text may only be corrected non-substantively" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPLIED | REJECTED", default: PROPOSED }
      - { name: applied_utc, type: datetime, source: system, description: "Logical-clock instant of application", default: null }

# =============================================================================
# §1.2 State Machine Table
#
# Ten machines. Bill carries TWO parallel dimensions (legislative_status and
# fiscal_status) that advance independently on the same row, so it appears twice
# with an explicit `state_field:`. Cyclic machines: DraftingRequest
# (DRAFTING <-> RETURNED_FOR_CLARIFICATION), FiscalNoteRequest
# (SUBMITTED <-> RETURNED_FOR_REVISION and CERTIFIED -> ROUTED -> CERTIFIED),
# Amendment (DRAFTED <-> ADOPTED).
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: Session
    state_field: status
    initial_state: PENDING
    terminal_states: [ADJOURNED]
    transitions:
      - from: PENDING
        to: CONVENED
        trigger: "POST /sessions/{id}/convene"
        actor: Clerk
        preconditions:
          - "session.status == PENDING"
        side_effects:
          - "sets Session.convened_utc = logical clock"
        note: "Committees, members, drafters and agencies may be created before convening; drafting requests may not."

      - from: CONVENED
        to: ADJOURNED
        trigger: "POST /sessions/{id}/adjourn"
        actor: Clerk
        preconditions:
          - "session.status == CONVENED"
        side_effects:
          - "sets Session.adjourned_utc = logical clock"
          - "every DraftingRequest with this session_id and status IN {SUBMITTED, RESEARCH, DRAFTING, RETURNED_FOR_CLARIFICATION, DRAFT_READY} -> LAPSED, sla_due_utc = null"
          - "for each such lapsed request: recomputes Member.priority_slots_used (LAPSED rows leave the slot ledger), Member.clarification_pending_count, Member.intake_hold, and Drafter.active_engagement_count"
          - "every Amendment on a bill of this session with status IN {REQUESTED, DRAFTED} -> LAPSED, then recomputes Drafter.active_engagement_count"
          - "every CommitteeReferral on a bill of this session with status IN_COMMITTEE -> DIED_IN_COMMITTEE, then recomputes Committee.active_referral_count"
          - "every FiscalNoteRequest on a bill of this session with status IN {ROUTED, SUBMITTED, RETURNED_FOR_REVISION} -> LAPSED, then recomputes Agency.open_request_count"
          - "every TechnicalCorrection on an EnrolledBill of this session with status PROPOSED -> REJECTED, then recomputes EnrolledBill.open_corrections_count"
          - "every Bill of this session with legislative_status IN {INTRODUCED, REFERRED, REPORTED, PASSED_CHAMBER} -> DEAD; fiscal_status is left untouched"
          - "does NOT change Session.certified_fiscal_total_cents: CERTIFIED notes survive adjournment"
        note: "Fan-out, not a transitive chain — every target is reached directly from the adjourn action."

  # ---------------------------------------------------------------------------
  - entity: DraftingRequest
    state_field: status
    initial_state: SUBMITTED
    terminal_states: [CONVERTED, WITHDRAWN, LAPSED]
    transitions:
      - from: null
        to: SUBMITTED
        trigger: "POST /drafting-requests"
        actor: Member
        preconditions:
          - "session.status == CONVENED"
          - "member.intake_hold == false"
          - "priority_flag == false OR member.priority_slots_used < member.priority_slots_total"
        side_effects:
          - "sets DraftingRequest.member_id = X-User-ID"
          - "computes DraftingRequest.intake_complexity_estimate via calculations.drafting_complexity_score variant INTAKE_ESTIMATE"
          - "when priority_flag is true: increments Member.priority_slots_used by 1"

      - from: SUBMITTED
        to: RESEARCH
        trigger: "POST /drafting-requests/{id}/assign"
        actor: ReviewCounsel
        preconditions:
          - "drafting_request.status == SUBMITTED"
          - "session.status == CONVENED"
          - "the drafter named by drafter_id exists"
          - "calculations.drafter_engagement_occupancy admits [engagement_start_utc, engagement_end_utc] for that drafter"
        side_effects:
          - "sets DraftingRequest.assigned_drafter_id, engagement_start_utc, engagement_end_utc"
          - "recomputes Drafter.active_engagement_count for the assigned drafter (+1: the request enters the occupancy set)"

      - from: RESEARCH
        to: DRAFTING
        trigger: "POST /drafting-requests/{id}/complete-research"
        actor: Drafter
        preconditions:
          - "drafting_request.status == RESEARCH"
          - "X-User-ID == drafting_request.assigned_drafter_id"
        side_effects:
          - "sets DraftingRequest.affected_sections_count from the body and research_completed_utc = logical clock"
          - "computes DraftingRequest.actual_complexity_score via calculations.drafting_complexity_score variant POST_RESEARCH_ACTUAL"
          - "computes DraftingRequest.sla_due_utc via calculations.drafting_sla_due_utc"

      - from: DRAFTING
        to: RETURNED_FOR_CLARIFICATION
        trigger: "system — POST /statutory-conflicts creates a BLOCKING conflict while the request is DRAFTING (Cascade B link 1)"
        actor: system
        preconditions:
          - "drafting_request.status == DRAFTING"
          - "the new StatutoryConflict.severity == BLOCKING"
        side_effects:
          - "L1: increments DraftingRequest.blocking_conflict_count and open_blocking_conflict_count by 1"
          - "L2 (caused by the status leaving DRAFTING): clears DraftingRequest.sla_due_utc to null, recomputes Drafter.active_engagement_count for assigned_drafter_id (-1: the request leaves the occupancy set), and increments Member.clarification_pending_count by 1"
          - "L3 (caused by L2's Member.clarification_pending_count reaching MEMBER_CLARIFICATION_HOLD_THRESHOLD = 2): sets Member.intake_hold = true, which blocks that member's next POST /drafting-requests"
        note: "Conditional cascade: an ADVISORY conflict, or a BLOCKING conflict logged while the request is still in RESEARCH, changes the counters but does NOT move the status."

      - from: RETURNED_FOR_CLARIFICATION
        to: DRAFTING
        trigger: "POST /drafting-requests/{id}/clarify"
        actor: Member
        preconditions:
          - "drafting_request.status == RETURNED_FOR_CLARIFICATION"
          - "X-User-ID == drafting_request.member_id"
          - "drafting_request.open_blocking_conflict_count == 0"
          - "calculations.drafter_engagement_occupancy admits the stored [engagement_start_utc, engagement_end_utc] for assigned_drafter_id again"
        side_effects:
          - "increments DraftingRequest.revision_round by 1"
          - "recomputes DraftingRequest.actual_complexity_score (conflict counts have grown, so the score rises)"
          - "recomputes DraftingRequest.sla_due_utc from the current logical clock"
          - "recomputes Drafter.active_engagement_count (+1: the request re-enters the occupancy set)"
          - "decrements Member.clarification_pending_count by 1 and recomputes Member.intake_hold"
        note: "Cycle: a request may loop DRAFTING -> RETURNED_FOR_CLARIFICATION -> DRAFTING any number of times; revision_round records the loop count."

      - from: DRAFTING
        to: DRAFT_READY
        trigger: "POST /drafting-requests/{id}/certify-draft"
        actor: ReviewCounsel
        preconditions:
          - "drafting_request.status == DRAFTING"
          - "X-User-ID != drafting_request.assigned_drafter_id (segregation of duties)"
          - "drafting_request.open_blocking_conflict_count == 0"
          - "body style_findings_count == 0"
        side_effects:
          - "stores DraftingRequest.style_findings_count from the body"
          - "clears DraftingRequest.sla_due_utc to null"
          - "recomputes Drafter.active_engagement_count for assigned_drafter_id (-1: the request leaves the occupancy set)"

      - from: DRAFT_READY
        to: CONVERTED
        trigger: "system — POST /bills introduces the drafted measure"
        actor: system
        preconditions:
          - "drafting_request.status == DRAFT_READY"
        side_effects:
          - "the priority slot is NOT refunded: a converted priority request keeps consuming Member.priority_slots_used"

      - from: "SUBMITTED | RESEARCH | DRAFTING | RETURNED_FOR_CLARIFICATION | DRAFT_READY"
        to: WITHDRAWN
        trigger: "POST /drafting-requests/{id}/withdraw"
        actor: Member
        preconditions:
          - "drafting_request.status NOT IN {CONVERTED, WITHDRAWN, LAPSED}"
          - "X-User-ID == drafting_request.member_id"
        side_effects:
          - "clears DraftingRequest.sla_due_utc to null"
          - "when priority_flag is true: decrements Member.priority_slots_used by 1 (compensating action for the intake debit)"
          - "when the prior status was RETURNED_FOR_CLARIFICATION: decrements Member.clarification_pending_count by 1 and recomputes Member.intake_hold"
          - "when the prior status was RESEARCH or DRAFTING: recomputes Drafter.active_engagement_count for assigned_drafter_id"

      - from: "SUBMITTED | RESEARCH | DRAFTING | RETURNED_FOR_CLARIFICATION | DRAFT_READY"
        to: LAPSED
        trigger: "system — POST /sessions/{id}/adjourn"
        actor: system
        preconditions:
          - "session.status transitions CONVENED -> ADJOURNED"
        side_effects:
          - "same counter recomputations as WITHDRAWN, including release of the priority slot"

  # ---------------------------------------------------------------------------
  - entity: StatutoryConflict
    state_field: resolution_status
    initial_state: OPEN
    terminal_states: [RESOLVED, WAIVED]
    transitions:
      - from: null
        to: OPEN
        trigger: "POST /statutory-conflicts"
        actor: Drafter
        preconditions:
          - "drafting_request.status IN {RESEARCH, DRAFTING}"
          - "X-User-ID == drafting_request.assigned_drafter_id"
        side_effects:
          - "increments DraftingRequest.blocking_conflict_count + open_blocking_conflict_count (severity BLOCKING) or advisory_conflict_count (severity ADVISORY)"
          - "when severity == BLOCKING and drafting_request.status == DRAFTING: fires the DraftingRequest DRAFTING -> RETURNED_FOR_CLARIFICATION cascade"

      - from: OPEN
        to: RESOLVED
        trigger: "POST /statutory-conflicts/{id}/resolve with resolution_status RESOLVED"
        actor: Drafter
        preconditions:
          - "statutory_conflict.resolution_status == OPEN"
          - "X-User-ID == drafting_request.assigned_drafter_id when acting as Drafter"
        side_effects:
          - "sets resolution_note and resolved_utc"
          - "recomputes DraftingRequest.open_blocking_conflict_count"

      - from: OPEN
        to: WAIVED
        trigger: "POST /statutory-conflicts/{id}/resolve with resolution_status WAIVED"
        actor: ReviewCounsel
        preconditions:
          - "statutory_conflict.resolution_status == OPEN"
          - "acting role is ReviewCounsel and the backing Drafter row has is_senior == true"
        side_effects:
          - "sets resolution_note (waiver justification) and resolved_utc"
          - "recomputes DraftingRequest.open_blocking_conflict_count"
        note: "A waiver leaves the conflict on the record; it only stops it from blocking certification."

  # ---------------------------------------------------------------------------
  - entity: Bill
    state_field: legislative_status
    initial_state: INTRODUCED
    terminal_states: [TRANSMITTED, DEAD]
    transitions:
      - from: null
        to: INTRODUCED
        trigger: "POST /bills"
        actor: Clerk
        preconditions:
          - "drafting_request.status == DRAFT_READY"
          - "session.status == CONVENED"
          - "logical clock <= session.introduction_deadline_utc"
        side_effects:
          - "mints Bill.bill_number via calculations.bill_number_assignment and increments Session.next_house_bill_number or next_senate_bill_number by 1"
          - "copies session_id, sponsor_member_id, chamber, appropriation_requested_cents, priority_bill from the drafting request"
          - "sets Bill.fiscal_status = NOTE_PENDING when appropriation_requested_cents > 0, else NOT_REQUIRED"
          - "moves the DraftingRequest DRAFT_READY -> CONVERTED"
          - "increments Session.bills_introduced_count by 1"

      - from: INTRODUCED
        to: REFERRED
        trigger: "POST /bills/{id}/referrals (first referral)"
        actor: Clerk
        preconditions:
          - "bill.legislative_status == INTRODUCED"
          - "bill.referral_count == 0"
        side_effects:
          - "creates the CommitteeReferral in IN_COMMITTEE with referral_order 1"
          - "increments Bill.referral_count by 1 and Committee.active_referral_count by 1"

      - from: REFERRED
        to: REFERRED
        trigger: "POST /bills/{id}/referrals (subsequent referral)"
        actor: Clerk
        preconditions:
          - "bill.legislative_status == REFERRED"
        side_effects:
          - "creates another CommitteeReferral with referral_order = bill.referral_count + 1"
          - "increments Bill.referral_count by 1 and Committee.active_referral_count by 1"
        note: "Self-transition: sequential referrals are how a bill picks up a fiscal-committee referral under CONSTRAINED posture."

      - from: REFERRED
        to: REPORTED
        trigger: "system — POST /committee-referrals/{id}/report with outcome FAVORABLE clears the last IN_COMMITTEE referral"
        actor: system
        preconditions:
          - "the reporting referral moves IN_COMMITTEE -> REPORTED_FAVORABLE"
          - "no CommitteeReferral of this bill remains in status IN_COMMITTEE"
        side_effects:
          - "sets Bill.legislative_status = REPORTED"

      - from: REFERRED
        to: DEAD
        trigger: "system — POST /committee-referrals/{id}/report with outcome UNFAVORABLE"
        actor: system
        preconditions:
          - "the reporting referral moves IN_COMMITTEE -> REPORTED_UNFAVORABLE"
        side_effects:
          - "sets Bill.legislative_status = DEAD immediately, regardless of other IN_COMMITTEE referrals"
          - "every remaining CommitteeReferral of this bill in IN_COMMITTEE -> DIED_IN_COMMITTEE, then recomputes each Committee.active_referral_count"

      - from: REPORTED
        to: PASSED_CHAMBER
        trigger: "POST /bills/{id}/pass"
        actor: Clerk
        preconditions:
          - "bill.legislative_status == REPORTED"
          - "bill.fiscal_status IN {NOT_REQUIRED, NOTE_COMPLETE}"
          - "no Amendment of this bill is in status REQUESTED or DRAFTED"
          - "logical clock <= session.sine_die_utc"
        side_effects:
          - "sets Bill.legislative_status = PASSED_CHAMBER"

      - from: PASSED_CHAMBER
        to: ENROLLED
        trigger: "POST /bills/{id}/enroll"
        actor: Clerk
        preconditions:
          - "bill.legislative_status == PASSED_CHAMBER"
          - "bill.fiscal_status IN {NOT_REQUIRED, NOTE_COMPLETE}"
          - "bill.companion_bill_id IS NULL OR the companion bill's legislative_status IN {PASSED_CHAMBER, ENROLLED, TRANSMITTED, DEAD}"
        side_effects:
          - "creates the EnrolledBill in PREPARED with adopted_amendment_count, net_fiscal_delta_cents, enrollment_sequence and origin_signature_role frozen per calculations.enrollment_composition"
          - "increments Session.bills_enrolled_count by 1"

      - from: ENROLLED
        to: TRANSMITTED
        trigger: "system — POST /enrolled-bills/{id}/signatures with signature_role GOVERNOR_TRANSMITTAL"
        actor: system
        preconditions:
          - "the EnrolledBill moves SECOND_SIGNED -> TRANSMITTED"
        side_effects:
          - "sets Bill.legislative_status = TRANSMITTED"

      - from: "INTRODUCED | REFERRED | REPORTED | PASSED_CHAMBER"
        to: DEAD
        trigger: "system — POST /sessions/{id}/adjourn"
        actor: system
        preconditions:
          - "session.status transitions CONVENED -> ADJOURNED"
        side_effects:
          - "sets Bill.legislative_status = DEAD; ENROLLED and TRANSMITTED bills are untouched"

  # ---------------------------------------------------------------------------
  - entity: Bill
    state_field: fiscal_status
    initial_state: "NOT_REQUIRED | NOTE_PENDING (chosen at introduction by appropriation_requested_cents > 0)"
    terminal_states: []
    transitions:
      - from: NOT_REQUIRED
        to: NOTE_PENDING
        trigger: "system — POST /amendments/{id}/adopt where fiscal_impact_delta_cents != 0"
        actor: system
        preconditions:
          - "bill.fiscal_status == NOT_REQUIRED"
          - "the adopted amendment's fiscal_impact_delta_cents != 0"
        side_effects:
          - "sets Bill.fiscal_status = NOTE_PENDING — a fiscally material amendment creates a note obligation on a bill that had none"

      - from: NOTE_PENDING
        to: NOTE_COMPLETE
        trigger: "system — POST /fiscal-note-requests/{id}/certify"
        actor: system
        preconditions:
          - "the certified FiscalNoteRequest.bill_id == this bill"
        side_effects:
          - "sets Bill.fiscal_status = NOTE_COMPLETE"

      - from: NOTE_COMPLETE
        to: NOTE_STALE
        trigger: "system — POST /amendments/{id}/adopt where fiscal_impact_delta_cents != 0 (Cascade A link 1)"
        actor: system
        preconditions:
          - "bill.fiscal_status == NOTE_COMPLETE"
          - "the adopted amendment's fiscal_impact_delta_cents != 0"
        side_effects:
          - "L1: sets Bill.fiscal_status = NOTE_STALE"
          - "L2 (caused by fiscal_status becoming NOTE_STALE): the bill's FiscalNoteRequest in status CERTIFIED moves CERTIFIED -> ROUTED, revision_round += 1, reopened_by_amendment_id = the amendment id, routed_utc = clock, due_utc recomputed, Agency.open_request_count += 1"
          - "L3 (caused by L2's note leaving CERTIFIED): Session.certified_fiscal_total_cents -= that note's certified_total_cents"
          - "L4 (caused by L3's ledger change): Session.fiscal_posture recomputed against constrained_threshold_cents"

      - from: NOTE_STALE
        to: NOTE_COMPLETE
        trigger: "system — POST /fiscal-note-requests/{id}/certify on the re-opened note"
        actor: system
        preconditions:
          - "the certified FiscalNoteRequest.bill_id == this bill"
        side_effects:
          - "sets Bill.fiscal_status = NOTE_COMPLETE and clears FiscalNoteRequest.reopened_by_amendment_id"

      - from: NOTE_STALE
        to: NOTE_COMPLETE
        trigger: "system — POST /amendments/{id}/rescind removes the last fiscally material adopted amendment"
        actor: system
        preconditions:
          - "bill.fiscal_status == NOTE_STALE"
          - "after the rescission no Amendment of this bill in status ADOPTED has fiscal_impact_delta_cents != 0"
          - "a FiscalNoteRequest of this bill has reopened_by_amendment_id == the rescinded amendment id"
        side_effects:
          - "restores that FiscalNoteRequest ROUTED -> CERTIFIED with its retained certified_total_cents, clears reopened_by_amendment_id, decrements Agency.open_request_count by 1"
          - "adds the retained certified_total_cents back to Session.certified_fiscal_total_cents and recomputes Session.fiscal_posture"
          - "sets Bill.fiscal_status = NOTE_COMPLETE"
        note: "Compensating action: adopt-then-rescind must leave Session.certified_fiscal_total_cents bit-identical to its pre-adoption value."

  # ---------------------------------------------------------------------------
  - entity: CommitteeReferral
    state_field: status
    initial_state: IN_COMMITTEE
    terminal_states: [REPORTED_FAVORABLE, REPORTED_UNFAVORABLE, DIED_IN_COMMITTEE]
    transitions:
      - from: null
        to: IN_COMMITTEE
        trigger: "POST /bills/{id}/referrals"
        actor: Clerk
        preconditions:
          - "bill.legislative_status IN {INTRODUCED, REFERRED}"
          - "committee.session_id == bill.session_id"
          - "committee.chamber == bill.chamber"
          - "committee.active_referral_count < committee.max_concurrent_referrals"
          - "calculations.committee_hearing_window_occupancy admits [hearing_window_start_utc, hearing_window_end_utc)"
          - "hearing_window_end_utc <= session.committee_report_deadline_utc"
        side_effects:
          - "computes report_deadline_utc = min(hearing_window_end_utc + 7 days, session.committee_report_deadline_utc)"
          - "increments Committee.active_referral_count and Bill.referral_count by 1"
          - "moves Bill.legislative_status INTRODUCED -> REFERRED on the first referral"

      - from: IN_COMMITTEE
        to: REPORTED_FAVORABLE
        trigger: "POST /committee-referrals/{id}/report with outcome FAVORABLE"
        actor: Clerk
        preconditions:
          - "referral.status == IN_COMMITTEE"
          - "logical clock <= referral.report_deadline_utc"
          - "bill.fiscal_status IN {NOT_REQUIRED, NOTE_COMPLETE}"
          - "session.fiscal_posture == NORMAL OR bill has no CERTIFIED note with certified_total_cents > 0 OR committee.is_fiscal_committee == true"
        side_effects:
          - "sets reported_utc = logical clock"
          - "decrements Committee.active_referral_count by 1"
          - "moves Bill.legislative_status REFERRED -> REPORTED when no IN_COMMITTEE referral of the bill remains"

      - from: IN_COMMITTEE
        to: REPORTED_UNFAVORABLE
        trigger: "POST /committee-referrals/{id}/report with outcome UNFAVORABLE"
        actor: Clerk
        preconditions:
          - "referral.status == IN_COMMITTEE"
          - "logical clock <= referral.report_deadline_utc"
        side_effects:
          - "sets reported_utc = logical clock"
          - "decrements Committee.active_referral_count by 1"
          - "moves Bill.legislative_status -> DEAD and every sibling IN_COMMITTEE referral -> DIED_IN_COMMITTEE"
        note: "An unfavorable report needs no fiscal note: killing a bill never requires the cost to be known."

      - from: IN_COMMITTEE
        to: DIED_IN_COMMITTEE
        trigger: "system — POST /sessions/{id}/adjourn, or a sibling referral reported UNFAVORABLE"
        actor: system
        preconditions:
          - "referral.status == IN_COMMITTEE"
        side_effects:
          - "decrements Committee.active_referral_count by 1"

  # ---------------------------------------------------------------------------
  - entity: FiscalNoteRequest
    state_field: status
    initial_state: ROUTED
    terminal_states: [LAPSED]
    transitions:
      - from: null
        to: ROUTED
        trigger: "POST /bills/{id}/fiscal-note-requests"
        actor: Clerk
        preconditions:
          - "bill.fiscal_status IN {NOTE_PENDING, NOTE_STALE}"
          - "bill.legislative_status NOT IN {DEAD, TRANSMITTED}"
          - "agency.status == ACTIVE"
          - "agency.open_request_count < agency.max_open_requests"
          - "no FiscalNoteRequest of this bill is in status IN {ROUTED, SUBMITTED, RETURNED_FOR_REVISION}"
        side_effects:
          - "sets routed_utc = logical clock and computes due_utc via calculations.fiscal_note_due_date"
          - "increments Agency.open_request_count by 1"

      - from: ROUTED
        to: SUBMITTED
        trigger: "POST /fiscal-note-requests/{id}/submit"
        actor: AgencyAnalyst
        preconditions:
          - "note.status IN {ROUTED, RETURNED_FOR_REVISION}"
          - "X-User-ID == note.agency_id"
          - "at least one CostEstimate with included_in_certification true exists"
          - "the BASELINE lines of the current revision_round cover every year in session.required_fiscal_years"
        side_effects:
          - "sets submitted_utc = logical clock and late_submission = (submitted_utc > due_utc)"
          - "when late_submission is true: increments Agency.late_submission_count by 1 and recomputes Agency.responsiveness_score"
          - "computes direct_cost_cents, contingency_pct, contingency_cents, certified_total_cents via calculations.fiscal_note_cost_total"
          - "computes projected_revenue_total_cents, high_scenario_total_cents, low_scenario_total_cents via calculations.multi_year_revenue_projection"

      - from: RETURNED_FOR_REVISION
        to: SUBMITTED
        trigger: "POST /fiscal-note-requests/{id}/submit (resubmission)"
        actor: AgencyAnalyst
        preconditions:
          - "same preconditions as ROUTED -> SUBMITTED, evaluated against the CURRENT revision_round"
        side_effects:
          - "same recomputation set; estimate lines from earlier revision rounds stay on the record but are excluded from every total"
        note: "Cycle: SUBMITTED -> RETURNED_FOR_REVISION -> SUBMITTED may repeat; each return bumps revision_round."

      - from: SUBMITTED
        to: RETURNED_FOR_REVISION
        trigger: "POST /fiscal-note-requests/{id}/return"
        actor: FiscalOfficer
        preconditions:
          - "note.status == SUBMITTED"
        side_effects:
          - "increments FiscalNoteRequest.revision_round by 1"
          - "increments Agency.revision_count by 1 and recomputes Agency.responsiveness_score"
          - "leaves Agency.open_request_count unchanged: the note is still open"

      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /fiscal-note-requests/{id}/certify"
        actor: FiscalOfficer
        preconditions:
          - "note.status == SUBMITTED"
          - "the BASELINE lines of the current revision_round cover every year in session.required_fiscal_years"
          - "session.certified_fiscal_total_cents + note.certified_total_cents <= session.fiscal_cap_cents"
        side_effects:
          - "sets certified_utc = logical clock"
          - "adds certified_total_cents to Session.certified_fiscal_total_cents and recomputes Session.fiscal_posture"
          - "decrements Agency.open_request_count by 1"
          - "moves Bill.fiscal_status NOTE_PENDING|NOTE_STALE -> NOTE_COMPLETE and clears reopened_by_amendment_id"

      - from: CERTIFIED
        to: ROUTED
        trigger: "system — POST /amendments/{id}/adopt stales the note (Cascade A link 2)"
        actor: system
        preconditions:
          - "note.status == CERTIFIED"
          - "the bill's fiscal_status moved NOTE_COMPLETE -> NOTE_STALE"
        side_effects:
          - "increments revision_round by 1, sets reopened_by_amendment_id, routed_utc = clock, recomputes due_utc"
          - "increments Agency.open_request_count by 1"
          - "retains certified_total_cents and certified_utc so a rescission can restore them exactly"
        note: "Cycle back into an earlier state: certification is not terminal."

      - from: ROUTED
        to: CERTIFIED
        trigger: "system — POST /amendments/{id}/rescind removes the amendment that staled this note"
        actor: system
        preconditions:
          - "note.reopened_by_amendment_id == the rescinded amendment id"
          - "after the rescission no ADOPTED amendment of the bill has fiscal_impact_delta_cents != 0"
        side_effects:
          - "clears reopened_by_amendment_id, decrements Agency.open_request_count by 1"
          - "adds the retained certified_total_cents back to Session.certified_fiscal_total_cents and recomputes Session.fiscal_posture"

      - from: "ROUTED | SUBMITTED | RETURNED_FOR_REVISION"
        to: LAPSED
        trigger: "system — POST /sessions/{id}/adjourn"
        actor: system
        preconditions:
          - "session.status transitions CONVENED -> ADJOURNED"
        side_effects:
          - "decrements Agency.open_request_count by 1"
          - "leaves Session.certified_fiscal_total_cents unchanged"

  # ---------------------------------------------------------------------------
  - entity: Amendment
    state_field: status
    initial_state: REQUESTED
    terminal_states: [REJECTED, LAPSED]
    transitions:
      - from: null
        to: REQUESTED
        trigger: "POST /amendments"
        actor: Member
        preconditions:
          - "expected_bill_version == bill.version (see concurrency_rules.amendment-create-stale-bill)"
          - "stage == COMMITTEE requires committee_referral_id naming a referral of this bill in status IN_COMMITTEE"
          - "stage == FLOOR requires committee_referral_id null and bill.legislative_status == REPORTED"
          - "supersedes_amendment_id, when present, names an Amendment of the SAME bill in status REJECTED or LAPSED"
          - "session.status == CONVENED"
        side_effects:
          - "sets requested_by_member_id = X-User-ID and requested_utc = logical clock"
          - "computes turnaround_deadline_utc via calculations.amendment_turnaround_deadline"
          - "increments Bill.version by 1 (the bill's amendment set changed)"

      - from: REQUESTED
        to: DRAFTED
        trigger: "POST /amendments/{id}/draft"
        actor: Drafter
        preconditions:
          - "amendment.status == REQUESTED"
          - "logical clock <= amendment.turnaround_deadline_utc"
          - "calculations.drafter_engagement_occupancy admits [drafting_start_utc, drafting_due_utc] for the acting drafter"
        side_effects:
          - "sets drafted_by_drafter_id = X-User-ID and drafted_utc = logical clock"
          - "recomputes Drafter.active_engagement_count (+1: the amendment enters the occupancy set)"

      - from: DRAFTED
        to: ADOPTED
        trigger: "POST /amendments/{id}/adopt"
        actor: Clerk
        preconditions:
          - "amendment.status == DRAFTED"
          - "stage == COMMITTEE requires the named referral still IN_COMMITTEE"
          - "stage == FLOOR requires bill.legislative_status == REPORTED"
        side_effects:
          - "sets adopted_utc = logical clock"
          - "increments Bill.adopted_amendment_count by 1 and adds fiscal_impact_delta_cents to Bill.adopted_fiscal_delta_cents"
          - "recomputes Drafter.active_engagement_count (-1: the amendment leaves the occupancy set)"
          - "when fiscal_impact_delta_cents != 0: fires the Bill.fiscal_status cascade (NOT_REQUIRED -> NOTE_PENDING, or NOTE_COMPLETE -> NOTE_STALE with links L2/L3/L4)"

      - from: DRAFTED
        to: REJECTED
        trigger: "POST /amendments/{id}/reject"
        actor: Clerk
        preconditions:
          - "amendment.status == DRAFTED"
        side_effects:
          - "recomputes Drafter.active_engagement_count (-1)"
          - "leaves Bill.adopted_fiscal_delta_cents and Bill.fiscal_status untouched"

      - from: ADOPTED
        to: DRAFTED
        trigger: "POST /amendments/{id}/rescind"
        actor: Clerk
        preconditions:
          - "amendment.status == ADOPTED"
          - "bill.legislative_status NOT IN {ENROLLED, TRANSMITTED, DEAD}"
        side_effects:
          - "increments rescind_count by 1 and clears adopted_utc to null"
          - "decrements Bill.adopted_amendment_count by 1 and subtracts fiscal_impact_delta_cents from Bill.adopted_fiscal_delta_cents"
          - "recomputes Drafter.active_engagement_count (+1: the amendment re-enters the occupancy set as DRAFTED)"
          - "when the bill's fiscal_status is NOTE_STALE and no other ADOPTED amendment carries a non-zero delta: restores the re-opened FiscalNoteRequest to CERTIFIED and adds its retained certified_total_cents back to Session.certified_fiscal_total_cents"
        note: "Cycle: ADOPTED -> DRAFTED -> ADOPTED is permitted; rescind_count records how often."

      - from: "REQUESTED | DRAFTED"
        to: LAPSED
        trigger: "system — POST /sessions/{id}/adjourn"
        actor: system
        preconditions:
          - "session.status transitions CONVENED -> ADJOURNED"
        side_effects:
          - "recomputes Drafter.active_engagement_count for drafted_by_drafter_id when it was DRAFTED"

  # ---------------------------------------------------------------------------
  - entity: EnrolledBill
    state_field: status
    initial_state: PREPARED
    terminal_states: [TRANSMITTED]
    transitions:
      - from: null
        to: PREPARED
        trigger: "POST /bills/{id}/enroll"
        actor: Clerk
        preconditions:
          - "bill.legislative_status == PASSED_CHAMBER"
          - "bill.fiscal_status IN {NOT_REQUIRED, NOTE_COMPLETE}"
          - "companion, when linked, is in legislative_status IN {PASSED_CHAMBER, ENROLLED, TRANSMITTED, DEAD}"
          - "no EnrolledBill exists for this bill"
        side_effects:
          - "freezes adopted_amendment_count, net_fiscal_delta_cents and enrollment_sequence per calculations.enrollment_composition"
          - "sets origin_signature_role = SPEAKER when bill.chamber == HOUSE else SENATE_PRESIDENT, and expected_next_signature = origin_signature_role"
          - "moves Bill.legislative_status PASSED_CHAMBER -> ENROLLED and increments Session.bills_enrolled_count by 1"

      - from: PREPARED
        to: ORIGIN_SIGNED
        trigger: "POST /enrolled-bills/{id}/signatures with signature_role == origin_signature_role"
        actor: Clerk
        preconditions:
          - "enrolled_bill.status == PREPARED"
          - "body signature_role == enrolled_bill.expected_next_signature"
        side_effects:
          - "sets origin_signed_utc = logical clock"
          - "sets expected_next_signature to the other presiding officer (SENATE_PRESIDENT for a HOUSE bill, SPEAKER for a SENATE bill)"

      - from: ORIGIN_SIGNED
        to: SECOND_SIGNED
        trigger: "POST /enrolled-bills/{id}/signatures with the second presiding officer's role"
        actor: Clerk
        preconditions:
          - "enrolled_bill.status == ORIGIN_SIGNED"
          - "body signature_role == enrolled_bill.expected_next_signature"
        side_effects:
          - "sets second_signed_utc = logical clock"
          - "sets expected_next_signature = GOVERNOR_TRANSMITTAL"

      - from: SECOND_SIGNED
        to: TRANSMITTED
        trigger: "POST /enrolled-bills/{id}/signatures with signature_role GOVERNOR_TRANSMITTAL"
        actor: Clerk
        preconditions:
          - "enrolled_bill.status == SECOND_SIGNED"
          - "enrolled_bill.open_corrections_count == 0"
        side_effects:
          - "sets transmitted_utc = logical clock and expected_next_signature = NONE"
          - "moves Bill.legislative_status ENROLLED -> TRANSMITTED"

  # ---------------------------------------------------------------------------
  - entity: TechnicalCorrection
    state_field: status
    initial_state: PROPOSED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: null
        to: PROPOSED
        trigger: "POST /enrolled-bills/{id}/technical-corrections"
        actor: Drafter
        preconditions:
          - "expected_enrolled_bill_version == enrolled_bill.version (see concurrency_rules.correction-create-stale-enrollment)"
          - "enrolled_bill.status IN {PREPARED, ORIGIN_SIGNED, SECOND_SIGNED}"
          - "is_substantive == false"
        side_effects:
          - "sets proposed_by_drafter_id = X-User-ID"
          - "increments EnrolledBill.open_corrections_count by 1 and EnrolledBill.version by 1"

      - from: PROPOSED
        to: APPLIED
        trigger: "POST /technical-corrections/{id}/apply"
        actor: ReviewCounsel
        preconditions:
          - "correction.status == PROPOSED"
          - "X-User-ID != correction.proposed_by_drafter_id (segregation of duties)"
          - "enrolled_bill.status != TRANSMITTED"
        side_effects:
          - "sets applied_by_drafter_id = X-User-ID and applied_utc = logical clock"
          - "increments EnrolledBill.corrections_applied_count by 1, decrements open_corrections_count by 1, increments EnrolledBill.version by 1"

      - from: PROPOSED
        to: REJECTED
        trigger: "system — POST /sessions/{id}/adjourn"
        actor: system
        preconditions:
          - "session.status transitions CONVENED -> ADJOURNED"
        side_effects:
          - "decrements EnrolledBill.open_corrections_count by 1"

# =============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
#
# Every entry below survives the serial-observability filter: a second, strictly
# sequential request carrying a FRESH version would legitimately succeed, because
# the product allows many children per parent. Write-write conflicts that a
# sequential retry would hit as a state precondition (a second companion link, a
# second certify, a second adopt) are NOT here — they live in §1.2 / §1.4.
# =============================================================================
concurrency_rules:

  - rule_id: amendment-create-stale-bill
    parent_entity: Bill
    write_endpoint: "POST /amendments"
    occ_field: "expected_bill_version"
    description: |
      An amendment is drafted against a specific version of the bill's text. When
      the request carries an expected_bill_version lower than the bill's current
      version, the member's view of the measure is stale — another amendment has
      already been filed, drafted, adopted or rescinded against it — and the
      creation is rejected rather than silently attached to text the requester
      never saw. Multiple amendments per bill are legitimate, so nothing but the
      version check distinguishes the accepted case from the rejected one.
    error_id: ERR_STALE_BILL_VERSION
    http_status: 412

  - rule_id: cost-estimate-create-stale-note
    parent_entity: FiscalNoteRequest
    write_endpoint: "POST /fiscal-note-requests/{id}/cost-estimates"
    occ_field: "expected_fiscal_note_request_version"
    description: |
      A cost estimate line is computed under the revision round and methodology
      the analyst last observed on the fiscal note request. When the request
      carries an expected_fiscal_note_request_version lower than the note's
      current version, the note has moved on — a prior line was appended, the
      note was returned for revision, or an adopted amendment re-opened it — and
      the line is rejected instead of being filed under a round the analyst did
      not intend. Many lines per note are legitimate, so only the version check
      separates the two outcomes.
    error_id: ERR_STALE_FISCAL_NOTE_VERSION
    http_status: 412

  - rule_id: correction-create-stale-enrollment
    parent_entity: EnrolledBill
    write_endpoint: "POST /enrolled-bills/{id}/technical-corrections"
    occ_field: "expected_enrolled_bill_version"
    description: |
      A technical correction cites a location in the enrolled text. When the
      request carries an expected_enrolled_bill_version lower than the
      enrollment's current version, an earlier correction has already been
      proposed or applied and the citation may no longer point where the drafter
      thinks, so the proposal is rejected. Many corrections per enrollment are
      legitimate; the version check is the only discriminator.
    error_id: ERR_STALE_ENROLLMENT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
#
# Money is integer cents throughout. `round_half_up(x)` means: compute the exact
# rational product, then round to the nearest integer cent with ties away from
# zero. No floating-point accumulation is permitted anywhere a cent is observable.
# =============================================================================
calculations:

  - name: drafting_complexity_score
    trigger: "INTAKE_ESTIMATE at POST /drafting-requests (frozen into intake_complexity_estimate); POST_RESEARCH_ACTUAL at every POST /drafting-requests/{id}/complete-research and every POST /drafting-requests/{id}/clarify (recomputed into actual_complexity_score)"
    algorithm: weighted_scoring
    formula: |
      # -------- variant INTAKE_ESTIMATE (member's own view, no research yet) ----
      tier_bonus(appropriation_requested_cents) =
          0   when appropriation_requested_cents == 0
          5   when 1 <= appropriation_requested_cents <= APPROPRIATION_TIER_CENTS   # 5_000_000
          15  when appropriation_requested_cents >  APPROPRIATION_TIER_CENTS

      intake_complexity_estimate =
            SECTION_WEIGHT * requested_sections_count            # 4 * n
          + (CONFIDENTIAL_WEIGHT if confidentiality == CONFIDENTIAL else 0)   # 12
          + (PRIORITY_WEIGHT     if priority_flag   == true       else 0)     # 8
          + tier_bonus(appropriation_requested_cents)

      # -------- variant POST_RESEARCH_ACTUAL (what research actually found) ----
      actual_complexity_score =
            SECTION_WEIGHT * affected_sections_count             # 4 * n
          + ADVISORY_WEIGHT * advisory_conflict_count            # 3 * n
          + BLOCKING_WEIGHT * blocking_conflict_count            # 9 * n
          + (CONFIDENTIAL_WEIGHT if confidentiality == CONFIDENTIAL else 0)   # 12
          + (PRIORITY_WEIGHT     if priority_flag   == true       else 0)     # 8
          # NOTE: no appropriation tier bonus here — once research has established
          # the true section footprint, the appropriation size is no longer a proxy
          # for drafting effort. This is the structural divergence between variants,
          # not a scale factor.

      # Worked example (identical request, two variants):
      #   requested_sections_count 6, CONFIDENTIAL, priority_flag true,
      #   appropriation_requested_cents 12_000_000
      #     INTAKE_ESTIMATE      = 24 + 12 + 8 + 15 = 59
      #   research then finds affected_sections_count 9, 2 ADVISORY, 1 BLOCKING
      #     POST_RESEARCH_ACTUAL = 36 + 6 + 9 + 12 + 8 = 71
    input_set: "Conflict counts include StatutoryConflict rows of this request in ANY resolution_status (OPEN, RESOLVED and WAIVED all count — a resolved conflict still cost drafting effort). Rows belonging to other drafting requests never contribute."
    constants:
      SECTION_WEIGHT: 4
      ADVISORY_WEIGHT: 3
      BLOCKING_WEIGHT: 9
      CONFIDENTIAL_WEIGHT: 12
      PRIORITY_WEIGHT: 8
      APPROPRIATION_TIER_CENTS: 5000000
    precision: "integer score, no rounding required"
    variants:
      - name: INTAKE_ESTIMATE
        when: "at submission, before any statutory research exists; stored in intake_complexity_estimate and never recomputed"
        difference: "uses the member-declared requested_sections_count, has no conflict terms at all, and adds a three-band appropriation tier bonus (0 / 5 / 15)"
      - name: POST_RESEARCH_ACTUAL
        when: "from complete-research onward; stored in actual_complexity_score and recomputed on every clarify loop"
        difference: "uses the researched affected_sections_count, adds weighted advisory and blocking conflict terms, and drops the appropriation tier bonus entirely"

  - name: drafting_sla_due_utc
    trigger: "POST /drafting-requests/{id}/complete-research (SUBMITTED-path entry into DRAFTING) and POST /drafting-requests/{id}/clarify (re-entry into DRAFTING)"
    algorithm: threshold
    formula: |
      base_hours = max(SLA_FLOOR_HOURS, min(SLA_CEILING_HOURS, actual_complexity_score * SLA_HOURS_PER_POINT))
                 # = max(24, min(240, score * 6))

      hours = base_hours
      if priority_flag == true:
          hours = hours * PRIORITY_MULTIPLIER                    # * 0.5
      if logical_clock >= session.introduction_deadline_utc - DEADLINE_PRESSURE_WINDOW_DAYS days:
          hours = hours * DEADLINE_PRESSURE_MULTIPLIER           # * 0.75
      hours = ceil(hours)          # ceiling AFTER both multipliers, once

      sla_due_utc = min(research_completed_utc + hours hours,
                        session.introduction_deadline_utc)

      # Worked example: actual_complexity_score 71, priority_flag true, clock
      # 2026-09-11T00:00:00Z, introduction deadline 2026-10-15T00:00:00Z.
      #   base_hours = max(24, min(240, 426)) = 240
      #   priority   -> 240 * 0.5 = 120 ; no deadline pressure (2026-10-01 not yet reached)
      #   due        = 2026-09-11T00:00:00Z + 120h = 2026-09-16T00:00:00Z
    input_set: "Uses the request's own actual_complexity_score as recomputed by drafting_complexity_score in the same request, its priority_flag, and its session's introduction_deadline_utc."
    constants:
      SLA_HOURS_PER_POINT: 6
      SLA_FLOOR_HOURS: 24
      SLA_CEILING_HOURS: 240
      PRIORITY_MULTIPLIER: 0.5
      DEADLINE_PRESSURE_MULTIPLIER: 0.75
      DEADLINE_PRESSURE_WINDOW_DAYS: 14
    precision: "hours as an integer after a single ceil(); the clamp is applied to base_hours BEFORE the multipliers, so a priority request may legitimately end below SLA_FLOOR_HOURS"

  - name: fiscal_note_cost_total
    trigger: "POST /fiscal-note-requests/{id}/submit — recomputed in full on every submission and resubmission"
    algorithm: tiered_pricing
    formula: |
      # ---- step 1: direct cost, methodology-dependent ------------------------
      lines = CostEstimate rows of this note with scenario == BASELINE
              AND revision_round == note.revision_round        # current round only

      if note.methodology == INCREMENTAL_COST:
          direct_cost_cents = sum over lines of (
              operating_cost_cents
            + one_time_cost_cents
            + (personnel_cost_cents if fte_count >= INCREMENTAL_FTE_FLOOR else 0)
          )
          # no indirect overhead: incremental costing charges only marginal spend

      if note.methodology == FULL_ABSORPTION:
          personnel_total = sum over lines of personnel_cost_cents   # every line, no FTE filter
          direct_cost_cents = sum over lines of (
              operating_cost_cents + one_time_cost_cents + personnel_cost_cents
          ) + round_half_up(personnel_total * INDIRECT_OVERHEAD_PCT)

      # ---- step 2..4: contingency, in this pinned order ---------------------
      # The tier is selected from the DIRECT subtotal, never from the running
      # certified total. Order is fixed to remove the apparent circularity:
      #   (2) tier from direct_cost_cents
      #   (3) contingency_cents = round_half_up(direct_cost_cents * contingency_pct)
      #   (4) certified_total_cents = direct_cost_cents + contingency_cents
      contingency_pct =
          CONTINGENCY_PCT_LOW   when direct_cost_cents <= CONTINGENCY_TIER_1_CENTS   # <= 10_000_000  -> 0.05
          CONTINGENCY_PCT_MID   when direct_cost_cents <= CONTINGENCY_TIER_2_CENTS   # <= 100_000_000 -> 0.08
          CONTINGENCY_PCT_HIGH  otherwise                                           #                -> 0.12
      contingency_cents      = round_half_up(direct_cost_cents * contingency_pct)
      certified_total_cents  = direct_cost_cents + contingency_cents

      # Worked example A — two BASELINE lines of the current round:
      #   L1 fiscal_year 2027: personnel 14_000_000, operating 4_100_000, one_time 3_000_000, fte 1.0
      #   L2 fiscal_year 2028: personnel 10_400_000, operating 3_500_000, one_time 0,         fte 0.4
      #   INCREMENTAL_COST — L2 personnel excluded (fte 0.4 < 0.5), no overhead:
      #     direct = (4_100_000+3_000_000+14_000_000) + (3_500_000+0) = 24_600_000
      #     tier 0.08 ; contingency 1_968_000 ; certified_total 26_568_000
      #   FULL_ABSORPTION on the SAME two lines:
      #     personnel_total = 24_400_000 ; indirect = round_half_up(24_400_000*0.185) = 4_514_000
      #     direct = 21_100_000 + 13_900_000 + 4_514_000 = 39_514_000
      #     tier 0.08 ; contingency 3_161_120 ; certified_total 42_675_120
      #   Same rows, two methodologies, 16_107_120 cents apart.
      #
      # Worked example B — tier boundary: direct exactly 10_000_000
      #     tier 0.05 (<= is inclusive) ; contingency 500_000 ; total 10_500_000
      # Worked example C — threshold-exact certified totals:
      #     direct 46_296_296 -> contingency 3_703_704 -> total 50_000_000
      #     direct 46_296_295 -> contingency 3_703_704 -> total 49_999_999
    input_set: "BASELINE scenario lines whose revision_round equals the note's CURRENT revision_round. HIGH and LOW scenario lines never enter the cost total (they feed multi_year_revenue_projection only). Lines filed under an earlier revision_round remain on the record with included_in_certification false and are excluded from every total."
    constants:
      INCREMENTAL_FTE_FLOOR: 0.5
      INDIRECT_OVERHEAD_PCT: 0.185
      CONTINGENCY_TIER_1_CENTS: 10000000
      CONTINGENCY_TIER_2_CENTS: 100000000
      CONTINGENCY_PCT_LOW: 0.05
      CONTINGENCY_PCT_MID: 0.08
      CONTINGENCY_PCT_HIGH: 0.12
    precision: "integer cents; a single round_half_up on the indirect overhead and a single round_half_up on the contingency, both computed from exact integer subtotals"
    variants:
      - name: INCREMENTAL_COST
        when: "note.methodology == INCREMENTAL_COST — the agency asserts existing staff absorb sub-half-FTE work"
        difference: "excludes personnel_cost_cents on any line whose fte_count < 0.5, and applies no indirect overhead at all"
      - name: FULL_ABSORPTION
        when: "note.methodology == FULL_ABSORPTION — the agency must show fully loaded cost"
        difference: "counts personnel on every line regardless of fte_count, and adds round_half_up(personnel_total * 0.185) of indirect overhead into the direct subtotal (which can also push the contingency into a higher tier)"

  - name: multi_year_revenue_projection
    trigger: "POST /fiscal-note-requests/{id}/submit — all three scenario totals recomputed on every submission and resubmission"
    algorithm: projection
    formula: |
      base_year = min(session.required_fiscal_years)

      base_for(scenario):
        row = the CostEstimate row of this note with scenario == <scenario>,
              fiscal_year == base_year, revision_round == note.revision_round
        if row exists:  return row.revenue_impact_cents          # agency supplied it
        else:           return round_half_up(base_for(BASELINE) * SCENARIO_MULTIPLIER[scenario])
        # BASELINE has no fallback: a note cannot be submitted without its
        # BASELINE base-year line (see ERR_ESTIMATE_YEARS_INCOMPLETE).

      project(base):
        # ROUNDING ORDER IS PINNED: round each fiscal year to whole cents FIRST,
        # then sum the rounded years. Summing exact rationals and rounding once
        # at the end is a DIFFERENT number and is wrong.
        total = 0
        for k in 0 .. PROJECTION_HORIZON_YEARS - 1:            # k = 0,1,2,3
            year_cents = round_half_up(base * (1 + GROWTH_RATE) ** k)
            total = total + year_cents
        return total

      projected_revenue_total_cents = project(base_for(BASELINE))
      high_scenario_total_cents     = project(base_for(HIGH))
      low_scenario_total_cents      = project(base_for(LOW))

      # Worked example — BASELINE base-year revenue_impact_cents = 3_333_333,
      # no HIGH row supplied, LOW row supplied as 2_000_000:
      #   BASELINE per-year: 3_333_333 + 3_441_666 + 3_553_520 + 3_669_010
      #                    = 13_997_529
      #     (rounding the exact sum once instead would give 13_997_530 — the
      #      pinned per-year order is observable on exactly this input)
      #   HIGH  base = round_half_up(3_333_333 * 1.15) = 3_833_333
      #         per-year: 3_833_333 + 3_957_916 + 4_086_549 + 4_219_361 = 16_097_159
      #   LOW   base = 2_000_000 (supplied, multiplier NOT applied)
      #         per-year: 2_000_000 + 2_065_000 + 2_132_113 + 2_201_406 = 8_398_519
    input_set: "Exactly one seed row per scenario: the row for the earliest year in session.required_fiscal_years at the note's current revision_round. Later-year rows carry their own revenue_impact_cents for the record but do NOT enter the projection — the projection is a growth curve off the base year, not a sum of supplied years."
    constants:
      GROWTH_RATE: 0.0325
      PROJECTION_HORIZON_YEARS: 4
      SCENARIO_MULTIPLIER_HIGH: 1.15
      SCENARIO_MULTIPLIER_LOW: 0.85
    precision: "integer cents, round_half_up per fiscal year, then integer summation of the rounded years"
    variants:
      - name: SUPPLIED_SCENARIO
        when: "the agency filed a HIGH (or LOW) base-year line in the current revision round"
        difference: "uses that row's revenue_impact_cents verbatim as the base; the scenario multiplier is NOT applied on top"
      - name: DERIVED_SCENARIO
        when: "no HIGH (or LOW) base-year line exists in the current revision round"
        difference: "derives the base as round_half_up(BASELINE base * 1.15) or (* 0.85) before projecting"

  - name: fiscal_note_due_date
    trigger: "POST /bills/{id}/fiscal-note-requests (initial routing) and the system re-routing that follows POST /amendments/{id}/adopt"
    algorithm: threshold
    formula: |
      responsiveness_score = max(0, min(100,
            100 - LATE_PENALTY * agency.late_submission_count
                - REVISION_PENALTY * agency.revision_count))
          # LATE_PENALTY 12, REVISION_PENALTY 5

      grant_days = session.fiscal_note_default_days + extension_days where
          extension_days =
              0   when responsiveness_score >= RESPONSIVE_BAND_HIGH   # >= 70
              5   when RESPONSIVE_BAND_LOW <= responsiveness_score < 70      # 40..69
             10   when responsiveness_score < RESPONSIVE_BAND_LOW            # < 40

      due_utc = routed_utc + grant_days days

      # A struggling agency is given MORE time, not less — the extension is a
      # workload accommodation, so the band boundaries (>= 70, >= 40) are the
      # observable edges.
      #
      # Worked example: default 21 days, late_submission_count 2, revision_count 3
      #   score = 100 - 24 - 15 = 61  ->  band 40..69  ->  extension 5
      #   routed 2026-09-20T00:00:00Z  ->  due 2026-10-16T00:00:00Z (26 days)
    input_set: "The agency's own late_submission_count and revision_count accumulated across ALL of its notes in every session; the session's fiscal_note_default_days."
    constants:
      LATE_PENALTY: 12
      REVISION_PENALTY: 5
      RESPONSIVE_BAND_HIGH: 70
      RESPONSIVE_BAND_LOW: 40
      EXTENSION_DAYS_MID: 5
      EXTENSION_DAYS_LOW: 10
    precision: "whole days added to routed_utc; the resulting due_utc keeps routed_utc's time-of-day exactly"

  - name: bill_number_assignment
    trigger: "POST /bills"
    algorithm: chronological
    formula: |
      if bill.chamber == HOUSE:
          n = session.next_house_bill_number
          bill_number = "HB " + str(n)
          session.next_house_bill_number = n + 1
      else:
          n = session.next_senate_bill_number
          bill_number = "SB " + str(n)
          session.next_senate_bill_number = n + 1

      # The two counters are independent: HB 1 and SB 1 coexist. A counter is
      # never decremented and never reused — a bill that later goes DEAD does
      # NOT return its number to the pool. Introduction order is therefore
      # recoverable from bill_number within a chamber.
    input_set: "The bill's own session and chamber. Bills of other sessions never affect a session's counters."
    constants:
      HOUSE_PREFIX: "HB "
      SENATE_PREFIX: "SB "
    precision: "exact string concatenation; no zero padding"

  - name: session_certified_fiscal_ledger
    trigger: "POST /fiscal-note-requests/{id}/certify (post), the amendment-driven decertification cascade (unpost), and POST /amendments/{id}/rescind (re-post)"
    algorithm: aggregation
    formula: |
      certified_fiscal_total_cents =
          sum of certified_total_cents over FiscalNoteRequest rows where
              row.status == CERTIFIED
              AND row.bill.session_id == session.id

      fiscal_posture = CONSTRAINED  when certified_fiscal_total_cents >= session.constrained_threshold_cents
                       NORMAL       otherwise
      # Boundary is inclusive: total exactly equal to the threshold is CONSTRAINED.

      # Maintained incrementally by +=/-= on the three trigger paths above, and
      # the incremental value MUST equal a full recompute of the sum at all times.
      # Because every posted and unposted amount is the SAME retained
      # certified_total_cents, certify -> decertify -> re-certify returns the
      # ledger to a bit-identical value: no drift is permitted.
    input_set: "Only CERTIFIED notes. ROUTED, SUBMITTED, RETURNED_FOR_REVISION and LAPSED notes contribute zero, even though a re-opened note retains its certified_total_cents field for restoration."
    constants: {}
    precision: "integer cents; exact addition and subtraction only, never a re-derivation from cost lines"

  - name: member_priority_slot_ledger
    trigger: "POST /drafting-requests (claim) and POST /drafting-requests/{id}/withdraw plus the adjourn cascade (release)"
    algorithm: aggregation
    formula: |
      priority_slots_used =
          count of DraftingRequest rows where
              row.member_id == member.id
              AND row.priority_flag == true
              AND row.status NOT IN {WITHDRAWN, LAPSED}

      # POST /drafting-requests with priority_flag true is refused when
      # priority_slots_used would exceed priority_slots_total.
      # A request that reaches CONVERTED still holds its slot for the whole
      # session: the slot is spent on the bill, not merely on the drafting queue.

      clarification_pending_count =
          count of DraftingRequest rows where
              row.member_id == member.id AND row.status == RETURNED_FOR_CLARIFICATION
      intake_hold = (clarification_pending_count >= MEMBER_CLARIFICATION_HOLD_THRESHOLD)
    input_set: "The member's own drafting requests across every session; WITHDRAWN and LAPSED rows are the only ones excluded from the slot count."
    constants:
      MEMBER_CLARIFICATION_HOLD_THRESHOLD: 2
    precision: "integer counts; withdraw must return the count to its exact pre-submission value"

  - name: amendment_turnaround_deadline
    trigger: "POST /amendments"
    algorithm: threshold
    formula: |
      base_minutes = COMMITTEE_TURNAROUND_MINUTES when stage == COMMITTEE   # 240
                     FLOOR_TURNAROUND_MINUTES     when stage == FLOOR       # 60

      if session.sine_die_utc - requested_utc <= SINE_DIE_COMPRESSION_HOURS hours:   # 48h
          minutes = floor(base_minutes * SINE_DIE_COMPRESSION_FACTOR)   # * 0.5, floor
      else:
          minutes = base_minutes

      turnaround_deadline_utc = requested_utc + minutes minutes

      # Worked example: FLOOR amendment requested 2026-11-14T10:00:00Z with
      # sine_die 2026-11-15T18:00:00Z (32h out, <= 48h):
      #   minutes = floor(60 * 0.5) = 30  ->  deadline 2026-11-14T10:30:00Z
      # The same request 5 days before sine die keeps the full 60 minutes.
    input_set: "The amendment's own stage and requested_utc, and its session's sine_die_utc."
    constants:
      COMMITTEE_TURNAROUND_MINUTES: 240
      FLOOR_TURNAROUND_MINUTES: 60
      SINE_DIE_COMPRESSION_HOURS: 48
      SINE_DIE_COMPRESSION_FACTOR: 0.5
    precision: "whole minutes; floor() after the compression factor"

  - name: enrollment_composition
    trigger: "POST /bills/{id}/enroll"
    algorithm: chronological
    formula: |
      adopted = this bill's Amendment rows with status == ADOPTED

      adopted_amendment_count = count(adopted)
      net_fiscal_delta_cents  = sum of fiscal_impact_delta_cents over adopted

      enrollment_sequence = ids of `adopted`, ordered by
            (0 if stage == COMMITTEE else 1) ASC,     # committee work engrosses first
            created_at ASC                            # then filing order
      # created_at ASC is the ONLY tie-break. Row id is never a decision input.

      origin_signature_role = SPEAKER          when bill.chamber == HOUSE
                              SENATE_PRESIDENT when bill.chamber == SENATE
      expected_next_signature = origin_signature_role   # at PREPARED

      # All four values are FROZEN at enrollment. A later rescission of an
      # adopted amendment does not rewrite them — the enrolled text is a snapshot.
    input_set: "ADOPTED amendments only. REQUESTED, DRAFTED, REJECTED and LAPSED amendments are excluded from the count, the delta and the sequence."
    constants: {}
    precision: "integer cents for the delta; the sequence is a stable total order with no random component"

  - name: drafter_engagement_occupancy
    trigger: "POST /drafting-requests/{id}/assign and POST /amendments/{id}/draft"
    algorithm: interval_merge
    formula: |
      # Intervals are CLOSED at both ends: [start, end]. Two intervals that merely
      # touch at an endpoint (A.end == B.start) DO overlap and both count.
      occupancy_set(drafter) =
            DraftingRequest rows with assigned_drafter_id == drafter.id
              AND status IN {RESEARCH, DRAFTING}
              -> interval [engagement_start_utc, engagement_end_utc]
          + Amendment rows with drafted_by_drafter_id == drafter.id
              AND status == DRAFTED
              -> interval [drafting_start_utc, drafting_due_utc]

      admits(drafter, candidate_interval):
          for every instant t in candidate_interval:
              concurrent = count of intervals in occupancy_set(drafter) containing t
              if concurrent + 1 > drafter.max_concurrent_engagements: return false
          return true
      # Equivalently: the maximum pointwise multiplicity over the union of the
      # existing closed intervals restricted to candidate_interval must be
      # strictly below max_concurrent_engagements.

      # This is an AGGREGATE capacity, not a pairwise conflict: with
      # max_concurrent_engagements == 2 a third overlapping engagement is the
      # first refusal, and the two kinds of work (drafting requests and
      # amendments) share the same pool.
    input_set: "A drafting request occupies its drafter only while in RESEARCH or DRAFTING — RETURNED_FOR_CLARIFICATION, DRAFT_READY, CONVERTED, WITHDRAWN and LAPSED release the interval. An amendment occupies its drafter only while DRAFTED — adoption, rejection and lapse release it, and rescission re-acquires it."
    constants: {}
    precision: "instant comparison at whole-second resolution; endpoint equality counts as overlap"

  - name: committee_hearing_window_occupancy
    trigger: "POST /bills/{id}/referrals"
    algorithm: interval_merge
    formula: |
      # Committee hearing windows are HALF-OPEN: [start, end). Back-to-back
      # windows where A.end == B.start do NOT overlap on the raw interval — but a
      # changeover buffer is added to the END of every EXISTING window before the
      # comparison, so a truly adjacent window is still refused.
      effective(existing) = [existing.hearing_window_start_utc,
                             existing.hearing_window_end_utc + CHANGEOVER_BUFFER_MINUTES minutes)

      conflict(candidate) = exists an existing CommitteeReferral of the SAME
          committee_id with status == IN_COMMITTEE such that
              candidate.hearing_window_start_utc < effective(existing).end
              AND existing.hearing_window_start_utc < candidate.hearing_window_end_utc

      # Single occupancy: a committee hears one bill at a time, so ANY overlap
      # after buffering is a refusal (ERR_COMMITTEE_HEARING_WINDOW_CONFLICT).
      # Separately, the committee's own max_concurrent_referrals caps how many
      # IN_COMMITTEE referrals it may hold at all, whatever their windows.
      #
      # Worked example: existing window 2026-10-05T14:00:00Z..16:00:00Z.
      #   candidate starting 2026-10-05T16:00:00Z -> REFUSED (inside the 30-min buffer)
      #   candidate starting 2026-10-05T16:30:00Z -> ACCEPTED (buffer boundary is exclusive)
    input_set: "Only IN_COMMITTEE referrals of the same committee occupy windows. REPORTED_FAVORABLE, REPORTED_UNFAVORABLE and DIED_IN_COMMITTEE referrals free their window immediately."
    constants:
      CHANGEOVER_BUFFER_MINUTES: 30
    precision: "instant comparison at whole-second resolution; the buffered end boundary is exclusive"

# =============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
#
# Lower `priority:` wins. The ladder is evaluated top to bottom on every request
# and stops at the FIRST violated row. Domain ordering inside the business band:
#   compliance / segregation of duties  ->  drafting-quality gates  ->
#   referential integrity  ->  temporal deadlines  ->  capacity  ->  fiscal
# Rationale: a bill that violates the code or the separation of duties must be
# refused before the schedule is even consulted, and money is checked last so a
# fiscally-clean-but-structurally-broken request never reports a budget error.
# =============================================================================
validations:

  # ---- auth ----------------------------------------------------------------
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the target endpoint's declared roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 30
    category: auth
    check: "for endpoints restricted to ReviewCounsel, the Drafter row named by X-User-ID exists and has is_senior == true"
    error_id: ERR_SENIOR_COUNSEL_REQUIRED
    http_status: 403
    applies_to: "POST /drafting-requests/{id}/assign, POST /drafting-requests/{id}/certify-draft, POST /statutory-conflicts/{id}/resolve with resolution WAIVED, POST /technical-corrections/{id}/apply"

  # ---- existence (path, left to right) -------------------------------------
  - priority: 40
    category: existence
    check: "every id in the request path resolves to a live row, validated left to right"
    error_id: "ERR_SESSION_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_DRAFTER_NOT_FOUND | ERR_AGENCY_NOT_FOUND | ERR_COMMITTEE_NOT_FOUND | ERR_DRAFTING_REQUEST_NOT_FOUND | ERR_STATUTORY_CONFLICT_NOT_FOUND | ERR_BILL_NOT_FOUND | ERR_COMMITTEE_REFERRAL_NOT_FOUND | ERR_FISCAL_NOTE_REQUEST_NOT_FOUND | ERR_AMENDMENT_NOT_FOUND | ERR_ENROLLED_BILL_NOT_FOUND | ERR_TECHNICAL_CORRECTION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  # ---- ownership and confidentiality --------------------------------------
  - priority: 50
    category: auth
    check: "for entity-backed roles the acting X-User-ID owns the resource: Member acts only on their own drafting requests and amendments; AgencyAnalyst files and submits only notes routed to their own agency and reads only their own Agency row; Drafter acts only where assigned (assigned_drafter_id or drafted_by_drafter_id)"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /drafting-requests/{id}/withdraw, POST /drafting-requests/{id}/complete-research, POST /statutory-conflicts, POST /fiscal-note-requests/{id}/cost-estimates, POST /fiscal-note-requests/{id}/submit, POST /amendments/{id}/draft, GET /agencies/{id} when the acting role is AgencyAnalyst"

  - priority: 55
    category: auth
    check: "a DraftingRequest with confidentiality CONFIDENTIAL, and any StatutoryConflict beneath it, is readable only by its sponsoring Member, by Drafter/ReviewCounsel, by FiscalOfficer, by Clerk and by PlatformAdmin — never by another Member. On the single-row and sub-resource reads a denial is ERR_CONFIDENTIAL_ACCESS_DENIED; on the unscoped collection read GET /drafting-requests the confidential rows are OMITTED from the page (and from total_count) rather than raising. AgencyAnalyst never reaches this rule: §1.7 excludes that role from every drafting-request read, so it is stopped at priority 20 with ERR_UNAUTHORIZED."
    error_id: ERR_CONFIDENTIAL_ACCESS_DENIED
    http_status: 403
    applies_to: "GET /drafting-requests/{id}, GET /drafting-requests, GET /drafting-requests/{id}/statutory-conflicts, GET /statutory-conflicts/{id}"

  # ---- payload shape -------------------------------------------------------
  - priority: 60
    category: existence
    check: "every required input field is present, every enum value is a declared member of its enum, every *_cents integer honors its >= constraint, every interval satisfies end > start, and required_fiscal_years is a non-empty strictly ascending integer array"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 60
    category: existence
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_PAGINATION_INVALID
    http_status: 400
    applies_to: "all list endpoints"

  - priority: 70
    category: existence
    check: "every id referenced in the request BODY resolves to a live row (session_id, drafting_request_id, committee_id, agency_id, bill_id, committee_referral_id, supersedes_amendment_id, companion_bill_id)"
    error_id: "the corresponding ERR_*_NOT_FOUND"
    http_status: 404
    applies_to: "POST /drafting-requests, POST /statutory-conflicts, POST /bills, POST /bills/{id}/companion, POST /bills/{id}/referrals, POST /bills/{id}/fiscal-note-requests, POST /amendments"

  # ---- optimistic concurrency ---------------------------------------------
  - priority: 80
    category: state
    check: "the supplied expected_<parent>_version equals the parent's current version (see §1.2.1)"
    error_id: "ERR_STALE_BILL_VERSION | ERR_STALE_FISCAL_NOTE_VERSION | ERR_STALE_ENROLLMENT_VERSION"
    http_status: 412
    applies_to: "POST /amendments, POST /fiscal-note-requests/{id}/cost-estimates, POST /enrolled-bills/{id}/technical-corrections"

  # ---- session lifecycle --------------------------------------------------
  - priority: 90
    category: state
    check: "the governing Session is CONVENED before any drafting, introduction, referral, fiscal-note, amendment or enrollment write"
    error_id: ERR_SESSION_NOT_CONVENED
    http_status: 409
    applies_to: "all business writes except POST /sessions, POST /sessions/{id}/convene, POST /members, POST /drafters, POST /agencies, POST /sessions/{id}/committees"

  - priority: 90
    category: state
    check: "the governing Session is not already ADJOURNED"
    error_id: ERR_SESSION_ADJOURNED
    http_status: 409
    applies_to: "all business writes, plus POST /sessions/{id}/adjourn itself"

  # ---- target state -------------------------------------------------------
  - priority: 100
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: "ERR_INVALID_SESSION_STATE | ERR_INVALID_DRAFTING_REQUEST_STATE | ERR_INVALID_CONFLICT_STATE | ERR_INVALID_BILL_STATE | ERR_INVALID_REFERRAL_STATE | ERR_INVALID_FISCAL_NOTE_STATE | ERR_INVALID_AMENDMENT_STATE | ERR_INVALID_ENROLLMENT_STATE | ERR_INVALID_CORRECTION_STATE"
    http_status: 409
    applies_to: "every action endpoint"

  # ---- compliance / segregation of duties ---------------------------------
  - priority: 110
    category: business_safety
    check: "the acting Drafter is not the same person as the drafter whose work is being reviewed: certify-draft requires X-User-ID != request.assigned_drafter_id, and correction apply requires X-User-ID != correction.proposed_by_drafter_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /drafting-requests/{id}/certify-draft, POST /technical-corrections/{id}/apply"

  - priority: 120
    category: business_safety
    check: "the drafting request has no StatutoryConflict with severity BLOCKING still in resolution_status OPEN (open_blocking_conflict_count == 0)"
    error_id: ERR_BLOCKING_CONFLICT_UNRESOLVED
    http_status: 409
    applies_to: "POST /drafting-requests/{id}/certify-draft, POST /bills"

  - priority: 125
    category: business_safety
    check: "the certify-draft call reports style_findings_count == 0; a positive finding count refuses certification and records the count without advancing the state"
    error_id: ERR_STYLE_NONCOMPLIANT
    http_status: 422
    applies_to: "POST /drafting-requests/{id}/certify-draft"

  - priority: 130
    category: business_safety
    check: "a technical correction against enrolled text declares is_substantive == false; enrolled text may only be corrected non-substantively"
    error_id: ERR_SUBSTANTIVE_CORRECTION_FORBIDDEN
    http_status: 422
    applies_to: "POST /enrolled-bills/{id}/technical-corrections"

  # ---- fiscal-note completeness gates -------------------------------------
  - priority: 133
    category: business_safety
    check: "at least one CostEstimate row of the note's CURRENT revision_round exists before submission"
    error_id: ERR_NO_COST_ESTIMATES
    http_status: 422
    applies_to: "POST /fiscal-note-requests/{id}/submit"

  - priority: 135
    category: business_safety
    check: "the BASELINE CostEstimate rows of the note's CURRENT revision_round cover every year in session.required_fiscal_years, with no year missing"
    error_id: ERR_ESTIMATE_YEARS_INCOMPLETE
    http_status: 422
    applies_to: "POST /fiscal-note-requests/{id}/submit, POST /fiscal-note-requests/{id}/certify"

  # ---- referential business rules -----------------------------------------
  - priority: 140
    category: business_referential
    check: "a companion link joins two DIFFERENT bills of OPPOSITE chambers in the SAME session, neither of which already has a companion"
    error_id: "ERR_COMPANION_SELF_LINK | ERR_COMPANION_CHAMBER_INVALID | ERR_COMPANION_SESSION_MISMATCH | ERR_COMPANION_ALREADY_LINKED"
    http_status: 422
    applies_to: "POST /bills/{id}/companion"

  - priority: 140
    category: business_referential
    check: "supersedes_amendment_id, when present, names an Amendment of the SAME bill whose status is REJECTED or LAPSED"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /amendments"

  - priority: 140
    category: business_referential
    check: "stage COMMITTEE supplies a committee_referral_id naming an IN_COMMITTEE referral of this same bill; stage FLOOR supplies no committee_referral_id and requires the bill to be REPORTED"
    error_id: ERR_AMENDMENT_STAGE_MISMATCH
    http_status: 422
    applies_to: "POST /amendments"

  - priority: 140
    category: business_referential
    check: "the referred committee belongs to the bill's own session and its own chamber"
    error_id: "ERR_COMMITTEE_SESSION_MISMATCH | ERR_COMMITTEE_CHAMBER_MISMATCH"
    http_status: 422
    applies_to: "POST /bills/{id}/referrals"

  - priority: 140
    category: business_referential
    check: "the bill's fiscal_status is IN {NOT_REQUIRED, NOTE_COMPLETE}: a bill whose fiscal_status is NOTE_PENDING or NOTE_STALE cannot be reported FAVORABLE, cannot pass its chamber and cannot be enrolled until a note is CERTIFIED. An UNFAVORABLE report is exempt — killing a bill never requires the cost to be known."
    error_id: ERR_FISCAL_NOTE_REQUIRED
    http_status: 409
    applies_to: "POST /committee-referrals/{id}/report (outcome FAVORABLE only), POST /bills/{id}/pass, POST /bills/{id}/enroll"

  - priority: 140
    category: business_referential
    check: "signature_role in the body equals enrolled_bill.expected_next_signature"
    error_id: ERR_SIGNATURE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /enrolled-bills/{id}/signatures"

  - priority: 140
    category: business_referential
    check: "transmittal is refused while open_corrections_count > 0"
    error_id: ERR_UNAPPLIED_CORRECTIONS
    http_status: 409
    applies_to: "POST /enrolled-bills/{id}/signatures with signature_role GOVERNOR_TRANSMITTAL"

  - priority: 145
    category: business_referential
    check: "the sponsoring Member's intake_hold is false (clarification_pending_count < 2)"
    error_id: ERR_MEMBER_INTAKE_HOLD
    http_status: 409
    applies_to: "POST /drafting-requests"

  # ---- temporal deadlines -------------------------------------------------
  - priority: 150
    category: business_temporal
    check: "the logical clock is at or before session.introduction_deadline_utc"
    error_id: ERR_INTRODUCTION_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /bills"

  - priority: 150
    category: business_temporal
    check: "the logical clock is at or before referral.report_deadline_utc"
    error_id: ERR_COMMITTEE_REPORT_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /committee-referrals/{id}/report"

  - priority: 150
    category: business_temporal
    check: "the logical clock is at or before amendment.turnaround_deadline_utc"
    error_id: ERR_AMENDMENT_TURNAROUND_EXPIRED
    http_status: 409
    applies_to: "POST /amendments/{id}/draft"

  - priority: 150
    category: business_temporal
    check: "the logical clock is at or before session.sine_die_utc"
    error_id: ERR_SINE_DIE_PASSED
    http_status: 409
    applies_to: "POST /bills/{id}/pass"

  - priority: 150
    category: business_temporal
    check: "hearing_window_end_utc is at or before session.committee_report_deadline_utc — a window that ends after the reporting deadline could never be reported out"
    error_id: ERR_HEARING_WINDOW_AFTER_DEADLINE
    http_status: 422
    applies_to: "POST /bills/{id}/referrals"

  # ---- capacity and uniqueness -------------------------------------------
  - priority: 160
    category: business_constraint
    check: "the candidate hearing window does not intersect any IN_COMMITTEE window of the same committee after the 30-minute changeover buffer is added to the existing window's end (see calculations.committee_hearing_window_occupancy)"
    error_id: ERR_COMMITTEE_HEARING_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /bills/{id}/referrals"

  - priority: 160
    category: business_constraint
    check: "committee.active_referral_count < committee.max_concurrent_referrals"
    error_id: ERR_COMMITTEE_REFERRAL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bills/{id}/referrals"

  - priority: 160
    category: business_constraint
    check: "the acting/assigned Drafter's closed occupancy intervals admit the candidate interval within max_concurrent_engagements (see calculations.drafter_engagement_occupancy)"
    error_id: ERR_DRAFTER_ENGAGEMENT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /drafting-requests/{id}/assign, POST /amendments/{id}/draft"

  - priority: 160
    category: business_constraint
    check: "agency.status == ACTIVE"
    error_id: ERR_AGENCY_INACTIVE
    http_status: 409
    applies_to: "POST /bills/{id}/fiscal-note-requests"

  - priority: 160
    category: business_constraint
    check: "agency.open_request_count < agency.max_open_requests"
    error_id: ERR_AGENCY_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /bills/{id}/fiscal-note-requests"

  - priority: 160
    category: business_constraint
    check: "no other FiscalNoteRequest of this bill is already in status ROUTED, SUBMITTED or RETURNED_FOR_REVISION"
    error_id: ERR_FISCAL_NOTE_ALREADY_OPEN
    http_status: 409
    applies_to: "POST /bills/{id}/fiscal-note-requests"

  - priority: 165
    category: business_constraint
    check: "no CostEstimate row already exists for this note with the same (fiscal_year, scenario, revision_round)"
    error_id: ERR_DUPLICATE_COST_ESTIMATE
    http_status: 409
    applies_to: "POST /fiscal-note-requests/{id}/cost-estimates"

  - priority: 165
    category: business_constraint
    check: "agency_code is unique across agencies"
    error_id: ERR_DUPLICATE_AGENCY_CODE
    http_status: 409
    applies_to: "POST /agencies"

  # ---- fiscal (last) ------------------------------------------------------
  - priority: 170
    category: business_fiscal
    check: "a priority_flag request fits within the member's remaining slots: priority_slots_used < priority_slots_total"
    error_id: ERR_PRIORITY_SLOTS_EXHAUSTED
    http_status: 409
    applies_to: "POST /drafting-requests"

  - priority: 170
    category: business_fiscal
    check: "session.certified_fiscal_total_cents + note.certified_total_cents <= session.fiscal_cap_cents"
    error_id: ERR_SESSION_FISCAL_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /fiscal-note-requests/{id}/certify"

  - priority: 170
    category: business_fiscal
    check: "while session.fiscal_posture == CONSTRAINED, a bill carrying a CERTIFIED note with certified_total_cents > 0 may only be reported out by a committee with is_fiscal_committee == true"
    error_id: ERR_FISCAL_COMMITTEE_REFERRAL_REQUIRED
    http_status: 409
    applies_to: "POST /committee-referrals/{id}/report"

  # ---- test-driving surface ----------------------------------------------
  - priority: 60
    category: business_temporal
    check: "the requested logical clock instant is greater than or equal to the current logical clock — the clock never runs backwards"
    error_id: ERR_CLOCK_NOT_MONOTONIC
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

# =============================================================================
# §1.5 API Endpoint Table
#
# Reads first, then writes grouped by aggregate. Every FK declared in §1.1 has a
# reverse-reachability GET here: sub-resource form for the three composition
# children (Committee under Session, StatutoryConflict under DraftingRequest,
# CostEstimate under FiscalNoteRequest) and filtered-list form for every other FK,
# including the two self-referential edges and the cross-aggregate edge.
# =============================================================================
endpoints:

  # ---- reads: reference data ----------------------------------------------
  - method: GET
    path: "/sessions/{id}"
    description: "Read a legislative session including its live fiscal ledger, posture and bill-number counters."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel, AgencyAnalyst]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: GET
    path: "/sessions"
    description: "List sessions, newest first by created_at DESC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel, AgencyAnalyst]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: "/sessions/{id}/committees"
    description: "List the committees of a session (reverse reachability for Committee.session_id)."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel, AgencyAnalyst]
    code: 200
    input: ["chamber?", "is_fiscal_committee?", "limit?", "offset?"]
    output: Committee[]
    side_effects: []

  - method: GET
    path: "/committees/{id}"
    description: "Read a committee including active_referral_count and its concurrency cap."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel, AgencyAnalyst]
    code: 200
    input: []
    output: Committee
    side_effects: []

  - method: GET
    path: "/members/{id}"
    description: "Read a member including priority_slots_used, clarification_pending_count and intake_hold."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/drafters/{id}"
    description: "Read a drafting attorney including is_senior and active_engagement_count."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Drafter, ReviewCounsel]
    code: 200
    input: []
    output: Drafter
    side_effects: []

  - method: GET
    path: "/agencies/{id}"
    description: "Read an agency including open_request_count, late_submission_count, revision_count and responsiveness_score."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, AgencyAnalyst]
    code: 200
    input: []
    output: Agency
    side_effects: []

  # ---- reads: drafting ----------------------------------------------------
  - method: GET
    path: "/drafting-requests/{id}"
    description: "Read a drafting request including both complexity variants, sla_due_utc and its conflict counters. CONFIDENTIAL requests are gated by validation priority 55."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: []
    output: DraftingRequest
    side_effects: []

  - method: GET
    path: "/drafting-requests"
    description: "List drafting requests with filtering (reverse reachability for session_id, member_id and assigned_drafter_id). Ordered by created_at ASC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: ["session_id?", "member_id?", "assigned_drafter_id?", "status?", "confidentiality?", "priority_flag?", "limit?", "offset?"]
    output: DraftingRequest[]
    side_effects: []

  - method: GET
    path: "/drafting-requests/{id}/statutory-conflicts"
    description: "List the statutory conflicts found for a request (reverse reachability for StatutoryConflict.drafting_request_id). Ordered by created_at ASC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: ["severity?", "resolution_status?", "limit?", "offset?"]
    output: StatutoryConflict[]
    side_effects: []

  - method: GET
    path: "/statutory-conflicts/{id}"
    description: "Read a single statutory conflict finding."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: []
    output: StatutoryConflict
    side_effects: []

  # ---- reads: bills -------------------------------------------------------
  - method: GET
    path: "/bills/{id}"
    description: "Read a bill, including both state dimensions, its minted bill_number and its adopted-amendment rollups."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel, AgencyAnalyst]
    code: 200
    input: []
    output: Bill
    side_effects: []

  - method: GET
    path: "/bills"
    description: "Bill status report with filtering (reverse reachability for session_id, drafting_request_id, sponsor_member_id and the self-referential companion_bill_id). Ordered by created_at ASC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel, AgencyAnalyst]
    code: 200
    input: ["session_id?", "drafting_request_id?", "sponsor_member_id?", "companion_bill_id?", "chamber?", "legislative_status?", "fiscal_status?", "priority_bill?", "limit?", "offset?"]
    output: Bill[]
    side_effects: []

  - method: GET
    path: "/committee-referrals/{id}"
    description: "Read a referral including its hearing window and computed report_deadline_utc."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: []
    output: CommitteeReferral
    side_effects: []

  - method: GET
    path: "/committee-referrals"
    description: "List referrals with filtering (reverse reachability for bill_id and committee_id). Ordered by created_at ASC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: ["bill_id?", "committee_id?", "status?", "limit?", "offset?"]
    output: CommitteeReferral[]
    side_effects: []

  # ---- reads: fiscal ------------------------------------------------------
  - method: GET
    path: "/fiscal-note-requests/{id}"
    description: "Read a fiscal note request including revision_round, due_utc, the methodology-dependent cost totals and all three projection scenarios. This is also how a client refreshes `version` between chained cost-estimate writes."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel, AgencyAnalyst]
    code: 200
    input: []
    output: FiscalNoteRequest
    side_effects: []

  - method: GET
    path: "/fiscal-note-requests"
    description: "List fiscal note requests with filtering (reverse reachability for bill_id, agency_id and the cross-aggregate reopened_by_amendment_id). Ordered by created_at ASC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel, AgencyAnalyst]
    code: 200
    input: ["bill_id?", "agency_id?", "reopened_by_amendment_id?", "status?", "methodology?", "limit?", "offset?"]
    output: FiscalNoteRequest[]
    side_effects: []

  - method: GET
    path: "/fiscal-note-requests/{id}/cost-estimates"
    description: "List the append-only cost estimate lines of a note (reverse reachability for CostEstimate.fiscal_note_request_id), including superseded rows with included_in_certification false. Ordered by created_at ASC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel, AgencyAnalyst]
    code: 200
    input: ["fiscal_year?", "scenario?", "revision_round?", "included_in_certification?", "limit?", "offset?"]
    output: CostEstimate[]
    side_effects: []

  # ---- reads: amendments and enrollment ----------------------------------
  - method: GET
    path: "/amendments/{id}"
    description: "Read an amendment including turnaround_deadline_utc and rescind_count."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: []
    output: Amendment
    side_effects: []

  - method: GET
    path: "/amendments"
    description: "List amendments with filtering (reverse reachability for bill_id, committee_referral_id, requested_by_member_id, drafted_by_drafter_id and the self-referential supersedes_amendment_id). Ordered by created_at ASC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: ["bill_id?", "committee_referral_id?", "requested_by_member_id?", "drafted_by_drafter_id?", "supersedes_amendment_id?", "stage?", "status?", "limit?", "offset?"]
    output: Amendment[]
    side_effects: []

  - method: GET
    path: "/enrolled-bills/{id}"
    description: "Read an enrollment including the frozen composition, the signature expectation and its correction counters."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: []
    output: EnrolledBill
    side_effects: []

  - method: GET
    path: "/enrolled-bills"
    description: "List enrollments with filtering (reverse reachability for EnrolledBill.bill_id; the array is length 0 or 1 for a given bill). Ordered by created_at ASC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Member, Drafter, ReviewCounsel]
    code: 200
    input: ["bill_id?", "status?", "limit?", "offset?"]
    output: EnrolledBill[]
    side_effects: []

  - method: GET
    path: "/technical-corrections/{id}"
    description: "Read a technical correction."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Drafter, ReviewCounsel]
    code: 200
    input: []
    output: TechnicalCorrection
    side_effects: []

  - method: GET
    path: "/technical-corrections"
    description: "List technical corrections with filtering (reverse reachability for enrolled_bill_id, proposed_by_drafter_id and applied_by_drafter_id). Ordered by created_at ASC."
    roles: [PlatformAdmin, Clerk, FiscalOfficer, Drafter, ReviewCounsel]
    code: 200
    input: ["enrolled_bill_id?", "proposed_by_drafter_id?", "applied_by_drafter_id?", "correction_type?", "status?", "limit?", "offset?"]
    output: TechnicalCorrection[]
    side_effects: []

  # ---- writes: test-driving surface ---------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Every deadline, window and SLA in this domain is measured against this clock, never against wall-clock time. DEFAULT: before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it MUST NOT fall back to real wall-clock time. The clock is monotonic — a value earlier than the current clock is refused with ERR_CLOCK_NOT_MONOTONIC."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: null
    side_effects:
      - "advances the logical clock; no entity is mutated and no deadline is retroactively evaluated"

  # ---- writes: session and reference data --------------------------------
  - method: POST
    path: "/sessions"
    description: "Create a legislative session in PENDING with its three deadlines, its fiscal thresholds and the fiscal years every cost estimate must cover."
    roles: [PlatformAdmin]
    code: 201
    input: [name, introduction_deadline_utc, committee_report_deadline_utc, sine_die_utc, constrained_threshold_cents, fiscal_cap_cents, required_fiscal_years, "fiscal_note_default_days?"]
    output: Session
    side_effects:
      - "status = PENDING, certified_fiscal_total_cents = 0, fiscal_posture = NORMAL"
      - "next_house_bill_number = 1 and next_senate_bill_number = 1"

  - method: POST
    path: "/sessions/{id}/convene"
    description: "Convene a PENDING session. Drafting requests, bills, referrals, notes and amendments are only writable while CONVENED."
    roles: [Clerk]
    code: 200
    input: []
    output: Session
    side_effects:
      - "status PENDING -> CONVENED, convened_utc = logical clock"
      - "increments Session.version by 1"

  - method: POST
    path: "/sessions/{id}/adjourn"
    description: "Adjourn sine die. Fires the full end-of-session fan-out declared in §1.2: open drafting requests LAPSE, open amendments LAPSE, open referrals DIE_IN_COMMITTEE, open fiscal notes LAPSE, proposed corrections are REJECTED, and non-enrolled bills go DEAD."
    roles: [Clerk]
    code: 200
    input: []
    output: Session
    side_effects:
      - "status CONVENED -> ADJOURNED, adjourned_utc = logical clock"
      - "cascades exactly as the Session CONVENED -> ADJOURNED transition declares, including every counter recomputation"
      - "leaves certified_fiscal_total_cents and fiscal_posture unchanged"
      - "increments Session.version by 1"

  - method: POST
    path: "/sessions/{id}/committees"
    description: "Create a committee of the session, in a chamber, with its own concurrent-referral cap and its fiscal-committee designation."
    roles: [Clerk, PlatformAdmin]
    code: 201
    input: [chamber, name, "is_fiscal_committee?", "max_concurrent_referrals?"]
    output: Committee
    side_effects:
      - "session_id is taken from the path, never from the body; active_referral_count = 0"

  - method: POST
    path: "/members"
    description: "Register a legislator with a chamber and a priority-request allowance."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, chamber, party, "priority_slots_total?"]
    output: Member
    side_effects:
      - "priority_slots_used = 0, clarification_pending_count = 0, intake_hold = false"

  - method: POST
    path: "/drafters"
    description: "Register a legislative services attorney. is_senior true is required to act under the ReviewCounsel role."
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, "is_senior?", "max_concurrent_engagements?"]
    output: Drafter
    side_effects:
      - "active_engagement_count = 0"

  - method: POST
    path: "/agencies"
    description: "Register an affected executive agency with its open-request cap. status INACTIVE may be supplied at creation to model an agency that cannot receive routings."
    roles: [PlatformAdmin]
    code: 201
    input: [name, agency_code, "status?", "max_open_requests?"]
    output: Agency
    side_effects:
      - "open_request_count = 0, late_submission_count = 0, revision_count = 0, responsiveness_score = 100"

  # ---- writes: drafting request lifecycle --------------------------------
  - method: POST
    path: "/drafting-requests"
    description: "Member files a drafting request. member_id is taken from X-User-ID. Refused when the member is on intake hold or has no priority slot left for a priority request."
    roles: [Member]
    code: 201
    input: [session_id, subject, summary, requested_sections_count, target_code_chapter, "confidentiality?", "priority_flag?", "appropriation_requested_cents?"]
    output: DraftingRequest
    side_effects:
      - "status = SUBMITTED, member_id = X-User-ID"
      - "computes intake_complexity_estimate via calculations.drafting_complexity_score variant INTAKE_ESTIMATE"
      - "when priority_flag is true: increments Member.priority_slots_used by 1"

  - method: POST
    path: "/drafting-requests/{id}/assign"
    description: "Review counsel assigns a drafter and reserves that drafter's closed occupancy interval. Moves the request SUBMITTED -> RESEARCH."
    roles: [ReviewCounsel]
    code: 200
    input: [drafter_id, engagement_start_utc, engagement_end_utc]
    output: DraftingRequest
    side_effects:
      - "status SUBMITTED -> RESEARCH; sets assigned_drafter_id, engagement_start_utc, engagement_end_utc"
      - "recomputes Drafter.active_engagement_count (+1)"
      - "increments DraftingRequest.version by 1"

  - method: POST
    path: "/drafting-requests/{id}/complete-research"
    description: "The assigned drafter reports the researched section footprint. Moves RESEARCH -> DRAFTING and computes both the actual complexity score and the drafting SLA."
    roles: [Drafter]
    code: 200
    input: [affected_sections_count]
    output: DraftingRequest
    side_effects:
      - "status RESEARCH -> DRAFTING; sets affected_sections_count and research_completed_utc = logical clock"
      - "computes actual_complexity_score (POST_RESEARCH_ACTUAL) and sla_due_utc"
      - "increments DraftingRequest.version by 1"

  - method: POST
    path: "/drafting-requests/{id}/clarify"
    description: "The sponsoring member answers a clarification and returns the request to drafting. Refused while any BLOCKING conflict is still OPEN."
    roles: [Member]
    code: 200
    input: [clarification_note]
    output: DraftingRequest
    side_effects:
      - "status RETURNED_FOR_CLARIFICATION -> DRAFTING; increments revision_round by 1"
      - "recomputes actual_complexity_score and sla_due_utc from the current clock"
      - "recomputes Drafter.active_engagement_count (+1) and Member.clarification_pending_count / intake_hold"
      - "increments DraftingRequest.version by 1"

  - method: POST
    path: "/drafting-requests/{id}/certify-draft"
    description: "Review counsel certifies drafting-style compliance. Refused when the certifying counsel is the assigned drafter, when a BLOCKING conflict is still OPEN, or when style_findings_count is positive — in the last case the count is recorded and the state does not advance."
    roles: [ReviewCounsel]
    code: 200
    input: [style_findings_count]
    output: DraftingRequest
    side_effects:
      - "stores style_findings_count; on style_findings_count == 0 moves DRAFTING -> DRAFT_READY and clears sla_due_utc"
      - "recomputes Drafter.active_engagement_count (-1)"
      - "increments DraftingRequest.version by 1"

  - method: POST
    path: "/drafting-requests/{id}/withdraw"
    description: "The sponsoring member withdraws the request. Compensating action: a priority request returns its slot to the member's ledger exactly."
    roles: [Member]
    code: 200
    input: ["withdrawal_reason?"]
    output: DraftingRequest
    side_effects:
      - "status -> WITHDRAWN, sla_due_utc = null"
      - "when priority_flag is true: decrements Member.priority_slots_used by 1"
      - "recomputes Member.clarification_pending_count / intake_hold and Drafter.active_engagement_count as the prior status requires"
      - "increments DraftingRequest.version by 1"

  # ---- writes: statutory conflicts ---------------------------------------
  - method: POST
    path: "/statutory-conflicts"
    description: "The assigned drafter records a conflict with existing code. A BLOCKING conflict logged while the request is DRAFTING fires the three-level clarification cascade; an ADVISORY conflict, or a BLOCKING one logged during RESEARCH, only updates counters."
    roles: [Drafter]
    code: 201
    input: [drafting_request_id, code_citation, conflict_type, severity]
    output: StatutoryConflict
    side_effects:
      - "resolution_status = OPEN"
      - "increments the request's blocking_conflict_count + open_blocking_conflict_count, or advisory_conflict_count"
      - "when severity BLOCKING and status DRAFTING: request -> RETURNED_FOR_CLARIFICATION, sla_due_utc = null, Drafter.active_engagement_count -1, Member.clarification_pending_count +1, and Member.intake_hold = true at the threshold of 2"
      - "increments DraftingRequest.version by 1"

  - method: POST
    path: "/statutory-conflicts/{id}/resolve"
    description: "Resolve or waive an open conflict. resolution_status WAIVED requires the ReviewCounsel role backed by a senior drafter; RESOLVED may be recorded by the assigned drafter."
    roles: [Drafter, ReviewCounsel]
    code: 200
    input: [resolution_status, resolution_note]
    output: StatutoryConflict
    side_effects:
      - "resolution_status OPEN -> RESOLVED or WAIVED; sets resolution_note and resolved_utc"
      - "recomputes DraftingRequest.open_blocking_conflict_count"
      - "increments StatutoryConflict.version by 1"

  # ---- writes: bills -----------------------------------------------------
  - method: POST
    path: "/bills"
    description: "Introduce a DRAFT_READY drafting request as a bill: mints the chamber-scoped bill number, copies the sponsor, chamber and appropriation, sets the initial fiscal_status from appropriation_requested_cents, and converts the request."
    roles: [Clerk]
    code: 201
    input: [drafting_request_id]
    output: Bill
    side_effects:
      - "legislative_status = INTRODUCED; fiscal_status = NOTE_PENDING when appropriation_requested_cents > 0 else NOT_REQUIRED"
      - "mints bill_number and increments the chamber's Session counter by 1"
      - "moves the DraftingRequest DRAFT_READY -> CONVERTED without refunding its priority slot"
      - "increments Session.bills_introduced_count by 1"

  - method: POST
    path: "/bills/{id}/companion"
    description: "Link an opposite-chamber companion bill in the same session. The link is written on BOTH rows."
    roles: [Clerk]
    code: 200
    input: [companion_bill_id]
    output: Bill
    side_effects:
      - "sets companion_bill_id on this bill and the reciprocal companion_bill_id on the named bill"
      - "increments the version of BOTH Bill rows by 1"

  - method: POST
    path: "/bills/{id}/referrals"
    description: "Refer the bill to a committee of its own session and chamber, reserving an exclusive hearing window. Computes report_deadline_utc and advances the bill INTRODUCED -> REFERRED on the first referral."
    roles: [Clerk]
    code: 201
    input: [committee_id, hearing_window_start_utc, hearing_window_end_utc]
    output: CommitteeReferral
    side_effects:
      - "status = IN_COMMITTEE, referral_order = bill.referral_count + 1"
      - "computes report_deadline_utc = min(hearing_window_end_utc + 7 days, session.committee_report_deadline_utc)"
      - "increments Committee.active_referral_count and Bill.referral_count by 1; increments Bill.version by 1"

  - method: POST
    path: "/committee-referrals/{id}/report"
    description: "Report the bill out of committee. FAVORABLE requires the bill's fiscal_status to be NOT_REQUIRED or NOTE_COMPLETE and, under CONSTRAINED session posture, a fiscal committee. UNFAVORABLE kills the bill and every sibling referral."
    roles: [Clerk]
    code: 200
    input: [outcome]
    output: CommitteeReferral
    side_effects:
      - "status IN_COMMITTEE -> REPORTED_FAVORABLE or REPORTED_UNFAVORABLE; sets reported_utc = logical clock"
      - "decrements Committee.active_referral_count by 1"
      - "FAVORABLE and no IN_COMMITTEE referral left: Bill.legislative_status REFERRED -> REPORTED"
      - "UNFAVORABLE: Bill.legislative_status -> DEAD and every sibling IN_COMMITTEE referral -> DIED_IN_COMMITTEE"
      - "increments Bill.version by 1"

  - method: POST
    path: "/bills/{id}/pass"
    description: "Pass the bill in its chamber. Refused while any amendment is still REQUESTED or DRAFTED, while the fiscal note is pending or stale, or after sine die."
    roles: [Clerk]
    code: 200
    input: []
    output: Bill
    side_effects:
      - "legislative_status REPORTED -> PASSED_CHAMBER"
      - "increments Bill.version by 1"

  - method: POST
    path: "/bills/{id}/enroll"
    description: "Prepare the enrolled bill: freezes the adopted-amendment composition and engrossment sequence, derives the origin presiding officer from the bill's chamber, and sets the first expected signature."
    roles: [Clerk]
    code: 201
    input: []
    output: EnrolledBill
    side_effects:
      - "status = PREPARED with adopted_amendment_count, net_fiscal_delta_cents, enrollment_sequence, origin_signature_role and expected_next_signature per calculations.enrollment_composition"
      - "Bill.legislative_status PASSED_CHAMBER -> ENROLLED; increments Session.bills_enrolled_count by 1; increments Bill.version by 1"

  # ---- writes: fiscal notes ----------------------------------------------
  - method: POST
    path: "/bills/{id}/fiscal-note-requests"
    description: "Route a fiscal note request to an affected agency and pin the cost-estimate methodology. Computes due_utc from the agency's responsiveness band. Refused when the agency is INACTIVE, at its open-request cap, or when another note of this bill is still open."
    roles: [Clerk, FiscalOfficer]
    code: 201
    input: [agency_id, methodology]
    output: FiscalNoteRequest
    side_effects:
      - "status = ROUTED, revision_round = 0, routed_utc = logical clock"
      - "computes due_utc via calculations.fiscal_note_due_date from Agency.responsiveness_score"
      - "increments Agency.open_request_count by 1"

  - method: POST
    path: "/fiscal-note-requests/{id}/cost-estimates"
    description: "Append one cost estimate line, with its assumptions, under the note's current revision round. Append-only: a line is never edited or deleted, and lines from earlier rounds survive with included_in_certification false. Carries the OCC guard on the note's version (see §1.2.1 cost-estimate-create-stale-note)."
    roles: [AgencyAnalyst]
    code: 201
    input: [expected_fiscal_note_request_version, fiscal_year, scenario, personnel_cost_cents, operating_cost_cents, one_time_cost_cents, fte_count, revenue_impact_cents, assumption_note]
    output: CostEstimate
    side_effects:
      - "revision_round is copied from the parent's current revision_round; included_in_certification = true"
      - "increments FiscalNoteRequest.version by 1 (so the next line must carry a refreshed expected_fiscal_note_request_version, obtainable from GET /fiscal-note-requests/{id})"

  - method: POST
    path: "/fiscal-note-requests/{id}/submit"
    description: "The agency analyst submits the note. Runs the methodology-dependent cost total, the contingency tier and all three multi-year revenue projections, and records lateness against due_utc."
    roles: [AgencyAnalyst]
    code: 200
    input: ["submission_note?"]
    output: FiscalNoteRequest
    side_effects:
      - "status ROUTED or RETURNED_FOR_REVISION -> SUBMITTED; submitted_utc = logical clock; late_submission = (submitted_utc > due_utc)"
      - "computes direct_cost_cents, contingency_pct, contingency_cents, certified_total_cents via calculations.fiscal_note_cost_total"
      - "computes projected_revenue_total_cents, high_scenario_total_cents, low_scenario_total_cents via calculations.multi_year_revenue_projection"
      - "on lateness: increments Agency.late_submission_count by 1 and recomputes Agency.responsiveness_score"
      - "increments FiscalNoteRequest.version by 1"

  - method: POST
    path: "/fiscal-note-requests/{id}/return"
    description: "The fiscal officer returns a submitted note for revision. Opens a new revision round, so every previously filed estimate line drops out of the totals."
    roles: [FiscalOfficer]
    code: 200
    input: [return_reason]
    output: FiscalNoteRequest
    side_effects:
      - "status SUBMITTED -> RETURNED_FOR_REVISION; increments revision_round by 1"
      - "flips included_in_certification to false on every CostEstimate line of the prior round"
      - "increments Agency.revision_count by 1 and recomputes Agency.responsiveness_score; leaves Agency.open_request_count unchanged"
      - "increments FiscalNoteRequest.version by 1"

  - method: POST
    path: "/fiscal-note-requests/{id}/certify"
    description: "The fiscal officer certifies the note. Posts certified_total_cents to the session ledger, recomputes the session's fiscal posture, and completes the bill's fiscal dimension. Refused when a required fiscal year is missing or when the posting would breach the session's fiscal cap."
    roles: [FiscalOfficer]
    code: 200
    input: ["certification_note?"]
    output: FiscalNoteRequest
    side_effects:
      - "status SUBMITTED -> CERTIFIED; certified_utc = logical clock"
      - "adds certified_total_cents to Session.certified_fiscal_total_cents and recomputes Session.fiscal_posture (inclusive >= threshold)"
      - "decrements Agency.open_request_count by 1"
      - "Bill.fiscal_status NOTE_PENDING or NOTE_STALE -> NOTE_COMPLETE and clears reopened_by_amendment_id"
      - "increments FiscalNoteRequest.version and Session.version by 1"

  # ---- writes: amendments ------------------------------------------------
  - method: POST
    path: "/amendments"
    description: "A member requests an amendment against a specific version of the bill's text and reserves the drafter window it will need. Computes the rapid-turnaround deadline, compressed within 48 hours of sine die. Carries the OCC guard on the bill's version (see §1.2.1 amendment-create-stale-bill)."
    roles: [Member]
    code: 201
    input: [expected_bill_version, bill_id, stage, summary, fiscal_impact_delta_cents, drafting_start_utc, drafting_due_utc, "committee_referral_id?", "supersedes_amendment_id?"]
    output: Amendment
    side_effects:
      - "status = REQUESTED; requested_by_member_id = X-User-ID; requested_utc = logical clock"
      - "computes turnaround_deadline_utc via calculations.amendment_turnaround_deadline"
      - "increments Bill.version by 1"

  - method: POST
    path: "/amendments/{id}/draft"
    description: "A drafter drafts the requested amendment inside its turnaround deadline, consuming one of their concurrent engagement slots."
    roles: [Drafter]
    code: 200
    input: [draft_text]
    output: Amendment
    side_effects:
      - "status REQUESTED -> DRAFTED; drafted_by_drafter_id = X-User-ID; drafted_utc = logical clock"
      - "recomputes Drafter.active_engagement_count (+1: the amendment's closed window enters the occupancy set)"
      - "increments Amendment.version by 1"

  - method: POST
    path: "/amendments/{id}/adopt"
    description: "Adopt a drafted amendment. A non-zero fiscal_impact_delta_cents drives the four-level fiscal cascade: the bill's note goes stale, the certified note is re-opened and re-routed, the session ledger is debited, and the session's fiscal posture is recomputed."
    roles: [Clerk]
    code: 200
    input: []
    output: Amendment
    side_effects:
      - "status DRAFTED -> ADOPTED; adopted_utc = logical clock"
      - "increments Bill.adopted_amendment_count by 1 and adds fiscal_impact_delta_cents to Bill.adopted_fiscal_delta_cents"
      - "recomputes Drafter.active_engagement_count (-1)"
      - "when fiscal_impact_delta_cents != 0: Bill.fiscal_status NOT_REQUIRED -> NOTE_PENDING, or NOTE_COMPLETE -> NOTE_STALE with the note re-opened (CERTIFIED -> ROUTED, revision_round +1, reopened_by_amendment_id set, Agency.open_request_count +1), Session.certified_fiscal_total_cents debited and Session.fiscal_posture recomputed"
      - "increments Amendment.version and Bill.version by 1"

  - method: POST
    path: "/amendments/{id}/reject"
    description: "Reject a drafted amendment. Releases the drafter's engagement slot and touches neither the bill's fiscal delta nor its fiscal_status."
    roles: [Clerk]
    code: 200
    input: ["rejection_reason?"]
    output: Amendment
    side_effects:
      - "status DRAFTED -> REJECTED"
      - "recomputes Drafter.active_engagement_count (-1)"
      - "increments Amendment.version by 1"

  - method: POST
    path: "/amendments/{id}/rescind"
    description: "Rescind an adopted amendment back to DRAFTED. Compensating action: when this removes the last fiscally material adopted amendment, the re-opened note is restored to CERTIFIED with its retained total and the session ledger returns to a bit-identical value."
    roles: [Clerk]
    code: 200
    input: [rescission_reason]
    output: Amendment
    side_effects:
      - "status ADOPTED -> DRAFTED; increments rescind_count by 1; clears adopted_utc"
      - "decrements Bill.adopted_amendment_count by 1 and subtracts fiscal_impact_delta_cents from Bill.adopted_fiscal_delta_cents"
      - "recomputes Drafter.active_engagement_count (+1)"
      - "when no ADOPTED amendment of the bill carries a non-zero delta any more: FiscalNoteRequest ROUTED -> CERTIFIED with its retained certified_total_cents, reopened_by_amendment_id cleared, Agency.open_request_count -1, Session.certified_fiscal_total_cents credited back, Session.fiscal_posture recomputed, Bill.fiscal_status NOTE_STALE -> NOTE_COMPLETE"
      - "increments Amendment.version and Bill.version by 1"

  # ---- writes: enrollment, corrections and signatures --------------------
  - method: POST
    path: "/enrolled-bills/{id}/technical-corrections"
    description: "A drafter proposes a non-substantive technical correction to enrolled text. A substantive correction is refused outright. Carries the OCC guard on the enrollment's version (see §1.2.1 correction-create-stale-enrollment)."
    roles: [Drafter, ReviewCounsel]
    code: 201
    input: [expected_enrolled_bill_version, correction_type, description, is_substantive]
    output: TechnicalCorrection
    side_effects:
      - "status = PROPOSED; proposed_by_drafter_id = X-User-ID"
      - "increments EnrolledBill.open_corrections_count by 1 and EnrolledBill.version by 1"

  - method: POST
    path: "/technical-corrections/{id}/apply"
    description: "Review counsel applies a proposed correction. Segregation of duties: the applying counsel MUST NOT be the drafter who proposed it."
    roles: [ReviewCounsel]
    code: 200
    input: []
    output: TechnicalCorrection
    side_effects:
      - "status PROPOSED -> APPLIED; applied_by_drafter_id = X-User-ID; applied_utc = logical clock"
      - "increments EnrolledBill.corrections_applied_count by 1, decrements open_corrections_count by 1, increments EnrolledBill.version by 1"

  - method: POST
    path: "/enrolled-bills/{id}/signatures"
    description: "Record a presiding-officer signature or the governor transmittal, in the exact order the enrollment expects. Transmittal is refused while any proposed correction is still open."
    roles: [Clerk]
    code: 200
    input: [signature_role]
    output: EnrolledBill
    side_effects:
      - "PREPARED -> ORIGIN_SIGNED -> SECOND_SIGNED -> TRANSMITTED, one step per call, each setting its own *_signed_utc or transmitted_utc"
      - "advances expected_next_signature to the next role in the chain, ending at NONE"
      - "on TRANSMITTED: Bill.legislative_status ENROLLED -> TRANSMITTED"
      - "increments EnrolledBill.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- auth ---------------------------------------------------------------
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the seven declared roles" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "the acting role is not listed in the target endpoint's roles" }
  - { id: ERR_SENIOR_COUNSEL_REQUIRED, http: 403, condition: "a ReviewCounsel-only operation is attempted with an X-User-ID whose Drafter row has is_senior false" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "an entity-backed role acts on or reads a resource it does not own (wrong member, wrong agency, or a drafter who is not the assigned drafter)" }
  - { id: ERR_CONFIDENTIAL_ACCESS_DENIED, http: 403, condition: "a CONFIDENTIAL drafting request or one of its conflicts is read by a member other than its sponsor" }

  # ---- not found ----------------------------------------------------------
  - { id: ERR_SESSION_NOT_FOUND, http: 404, condition: "no Session with the given id" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "no Member with the given id" }
  - { id: ERR_DRAFTER_NOT_FOUND, http: 404, condition: "no Drafter with the given id" }
  - { id: ERR_AGENCY_NOT_FOUND, http: 404, condition: "no Agency with the given id" }
  - { id: ERR_COMMITTEE_NOT_FOUND, http: 404, condition: "no Committee with the given id" }
  - { id: ERR_DRAFTING_REQUEST_NOT_FOUND, http: 404, condition: "no DraftingRequest with the given id" }
  - { id: ERR_STATUTORY_CONFLICT_NOT_FOUND, http: 404, condition: "no StatutoryConflict with the given id" }
  - { id: ERR_BILL_NOT_FOUND, http: 404, condition: "no Bill with the given id, including a companion_bill_id that resolves to nothing" }
  - { id: ERR_COMMITTEE_REFERRAL_NOT_FOUND, http: 404, condition: "no CommitteeReferral with the given id" }
  - { id: ERR_FISCAL_NOTE_REQUEST_NOT_FOUND, http: 404, condition: "no FiscalNoteRequest with the given id" }
  - { id: ERR_AMENDMENT_NOT_FOUND, http: 404, condition: "no Amendment with the given id, including a supersedes_amendment_id that resolves to nothing" }
  - { id: ERR_ENROLLED_BILL_NOT_FOUND, http: 404, condition: "no EnrolledBill with the given id" }
  - { id: ERR_TECHNICAL_CORRECTION_NOT_FOUND, http: 404, condition: "no TechnicalCorrection with the given id" }

  # ---- payload ------------------------------------------------------------
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "a required input field is missing, an enum value is not declared, a *_cents value violates its >= constraint, an interval has end <= start, or required_fiscal_years is empty or not strictly ascending" }
  - { id: ERR_PAGINATION_INVALID, http: 400, condition: "limit outside 1..100 or offset negative" }
  - { id: ERR_CLOCK_NOT_MONOTONIC, http: 422, condition: "POST /_clock/set_current_utc is given an instant earlier than the current logical clock" }

  # ---- optimistic concurrency --------------------------------------------
  - { id: ERR_STALE_BILL_VERSION, http: 412, condition: "POST /amendments carries an expected_bill_version that is not the bill's current version" }
  - { id: ERR_STALE_FISCAL_NOTE_VERSION, http: 412, condition: "POST /fiscal-note-requests/{id}/cost-estimates carries an expected_fiscal_note_request_version that is not the note's current version" }
  - { id: ERR_STALE_ENROLLMENT_VERSION, http: 412, condition: "POST /enrolled-bills/{id}/technical-corrections carries an expected_enrolled_bill_version that is not the enrollment's current version" }

  # ---- session lifecycle -------------------------------------------------
  - { id: ERR_SESSION_NOT_CONVENED, http: 409, condition: "a drafting, introduction, referral, fiscal-note, amendment or enrollment write is attempted while the session is still PENDING" }
  - { id: ERR_SESSION_ADJOURNED, http: 409, condition: "any business write, or a second adjourn, is attempted on an ADJOURNED session" }

  # ---- state -------------------------------------------------------------
  - { id: ERR_INVALID_SESSION_STATE, http: 409, condition: "convene on a non-PENDING session, or adjourn on a non-CONVENED session" }
  - { id: ERR_INVALID_DRAFTING_REQUEST_STATE, http: 409, condition: "assign, complete-research, clarify, certify-draft or withdraw invoked from a status the DraftingRequest machine does not allow" }
  - { id: ERR_INVALID_CONFLICT_STATE, http: 409, condition: "resolve invoked on a conflict whose resolution_status is already RESOLVED or WAIVED, or a conflict is filed against a request that is not in RESEARCH or DRAFTING" }
  - { id: ERR_INVALID_BILL_STATE, http: 409, condition: "referral, companion link, pass or enroll invoked from a legislative_status the Bill machine does not allow, including any write against a DEAD or TRANSMITTED bill" }
  - { id: ERR_INVALID_REFERRAL_STATE, http: 409, condition: "report invoked on a referral that is not IN_COMMITTEE" }
  - { id: ERR_INVALID_FISCAL_NOTE_STATE, http: 409, condition: "cost-estimate append, submit, return or certify invoked from a status the FiscalNoteRequest machine does not allow, including any write against a LAPSED note" }
  - { id: ERR_INVALID_AMENDMENT_STATE, http: 409, condition: "draft, adopt, reject or rescind invoked from a status the Amendment machine does not allow" }
  - { id: ERR_INVALID_ENROLLMENT_STATE, http: 409, condition: "a signature or a correction is attempted from an enrollment status that does not admit it, including any correction against a TRANSMITTED enrollment" }
  - { id: ERR_INVALID_CORRECTION_STATE, http: 409, condition: "apply invoked on a correction that is already APPLIED or REJECTED" }

  # ---- compliance and drafting quality ----------------------------------
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "the acting drafter is the same person as the drafter being reviewed: certify-draft by the assigned drafter, or correction apply by the proposing drafter" }
  - { id: ERR_BLOCKING_CONFLICT_UNRESOLVED, http: 409, condition: "certify-draft or introduction attempted while open_blocking_conflict_count > 0" }
  - { id: ERR_STYLE_NONCOMPLIANT, http: 422, condition: "certify-draft reports style_findings_count > 0" }
  - { id: ERR_SUBSTANTIVE_CORRECTION_FORBIDDEN, http: 422, condition: "a technical correction is proposed with is_substantive true" }

  # ---- fiscal-note completeness -----------------------------------------
  - { id: ERR_NO_COST_ESTIMATES, http: 422, condition: "submit attempted with no CostEstimate line in the note's current revision round" }
  - { id: ERR_ESTIMATE_YEARS_INCOMPLETE, http: 422, condition: "submit or certify attempted while the current round's BASELINE lines do not cover every year in session.required_fiscal_years" }

  # ---- referential business rules ---------------------------------------
  - { id: ERR_COMPANION_SELF_LINK, http: 422, condition: "companion_bill_id equals the path bill id" }
  - { id: ERR_COMPANION_CHAMBER_INVALID, http: 422, condition: "the two bills of a companion link are in the same chamber" }
  - { id: ERR_COMPANION_SESSION_MISMATCH, http: 422, condition: "the two bills of a companion link belong to different sessions" }
  - { id: ERR_COMPANION_ALREADY_LINKED, http: 422, condition: "either bill of a companion link already has a companion_bill_id" }
  - { id: ERR_SUPERSEDE_TARGET_INVALID, http: 422, condition: "supersedes_amendment_id names an amendment of a different bill, or one whose status is not REJECTED or LAPSED" }
  - { id: ERR_AMENDMENT_STAGE_MISMATCH, http: 422, condition: "stage COMMITTEE without an IN_COMMITTEE referral of this bill, or stage FLOOR with a committee_referral_id, or stage FLOOR while the bill is not REPORTED" }
  - { id: ERR_COMMITTEE_SESSION_MISMATCH, http: 422, condition: "the referred committee belongs to a different session than the bill" }
  - { id: ERR_COMMITTEE_CHAMBER_MISMATCH, http: 422, condition: "the referred committee's chamber differs from the bill's chamber" }
  - { id: ERR_FISCAL_NOTE_REQUIRED, http: 409, condition: "favorable report, pass or enroll attempted while the bill's fiscal_status is NOTE_PENDING or NOTE_STALE" }
  - { id: ERR_SIGNATURE_OUT_OF_ORDER, http: 409, condition: "the submitted signature_role is not the enrollment's expected_next_signature" }
  - { id: ERR_UNAPPLIED_CORRECTIONS, http: 409, condition: "governor transmittal attempted while open_corrections_count > 0" }
  - { id: ERR_MEMBER_INTAKE_HOLD, http: 409, condition: "a member with intake_hold true files a new drafting request" }

  # ---- temporal ----------------------------------------------------------
  - { id: ERR_INTRODUCTION_DEADLINE_PASSED, http: 409, condition: "POST /bills after session.introduction_deadline_utc" }
  - { id: ERR_COMMITTEE_REPORT_DEADLINE_PASSED, http: 409, condition: "report after referral.report_deadline_utc" }
  - { id: ERR_AMENDMENT_TURNAROUND_EXPIRED, http: 409, condition: "draft after amendment.turnaround_deadline_utc" }
  - { id: ERR_SINE_DIE_PASSED, http: 409, condition: "pass attempted after session.sine_die_utc" }
  - { id: ERR_HEARING_WINDOW_AFTER_DEADLINE, http: 422, condition: "hearing_window_end_utc is after session.committee_report_deadline_utc" }

  # ---- capacity and uniqueness ------------------------------------------
  - { id: ERR_COMMITTEE_HEARING_WINDOW_CONFLICT, http: 409, condition: "the candidate hearing window intersects an IN_COMMITTEE window of the same committee once the 30-minute changeover buffer is added to the existing window's end" }
  - { id: ERR_COMMITTEE_REFERRAL_CAPACITY_EXCEEDED, http: 409, condition: "the committee already holds max_concurrent_referrals referrals in IN_COMMITTEE" }
  - { id: ERR_DRAFTER_ENGAGEMENT_CAPACITY_EXCEEDED, http: 409, condition: "the drafter's closed occupancy intervals already reach max_concurrent_engagements somewhere inside the candidate interval" }
  - { id: ERR_AGENCY_INACTIVE, http: 409, condition: "a fiscal note request is routed to an agency whose status is INACTIVE" }
  - { id: ERR_AGENCY_CAPACITY_EXCEEDED, http: 409, condition: "the agency already holds max_open_requests notes in ROUTED, SUBMITTED or RETURNED_FOR_REVISION" }
  - { id: ERR_FISCAL_NOTE_ALREADY_OPEN, http: 409, condition: "another FiscalNoteRequest of this bill is already ROUTED, SUBMITTED or RETURNED_FOR_REVISION" }
  - { id: ERR_DUPLICATE_COST_ESTIMATE, http: 409, condition: "a CostEstimate line already exists for this note with the same fiscal_year, scenario and revision_round" }
  - { id: ERR_DUPLICATE_AGENCY_CODE, http: 409, condition: "agency_code is already registered" }

  # ---- fiscal ------------------------------------------------------------
  - { id: ERR_PRIORITY_SLOTS_EXHAUSTED, http: 409, condition: "a priority drafting request is filed while priority_slots_used == priority_slots_total" }
  - { id: ERR_SESSION_FISCAL_CAP_EXCEEDED, http: 409, condition: "certification would push Session.certified_fiscal_total_cents above session.fiscal_cap_cents" }
  - { id: ERR_FISCAL_COMMITTEE_REFERRAL_REQUIRED, http: 409, condition: "under CONSTRAINED session posture, a bill carrying a CERTIFIED note with certified_total_cents > 0 is reported out by a committee whose is_fiscal_committee is false" }

# =============================================================================
# §1.7 RBAC Matrix — segregation of duties
#
# Drafter and ReviewCounsel are BOTH backed by the same Drafter table, so the
# separation between drafting and review is by identity (X-User-ID), not merely by
# role name: the same senior attorney can legitimately hold both roles, and the
# rules therefore compare ids, not role strings.
# =============================================================================
roles:

  - name: PlatformAdmin
    description: "Legislative services system administrator. Owns the reference data (sessions, members, drafters, agencies) and the logical clock. Performs no legislative act."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /sessions"
      - "POST /members"
      - "POST /drafters"
      - "POST /agencies"
    shared_operations:
      - "POST /sessions/{id}/committees (with Clerk)"
      - "every GET in §1.5"

  - name: Clerk
    description: "Chamber clerk. Drives the public legislative record: introduction and numbering, committee referral and reporting, passage, enrollment, amendment disposition and signature routing. Never drafts and never certifies fiscal numbers."
    identity: opaque
    exclusive_operations:
      - "POST /sessions/{id}/convene"
      - "POST /sessions/{id}/adjourn"
      - "POST /bills"
      - "POST /bills/{id}/companion"
      - "POST /bills/{id}/referrals"
      - "POST /committee-referrals/{id}/report"
      - "POST /bills/{id}/pass"
      - "POST /bills/{id}/enroll"
      - "POST /amendments/{id}/adopt"
      - "POST /amendments/{id}/reject"
      - "POST /amendments/{id}/rescind"
      - "POST /enrolled-bills/{id}/signatures"
    shared_operations:
      - "POST /sessions/{id}/committees (with PlatformAdmin)"
      - "POST /bills/{id}/fiscal-note-requests (with FiscalOfficer)"
      - "every GET in §1.5 (the agency read is included: routing a note needs it)"

  - name: FiscalOfficer
    description: "Legislative fiscal office analyst. Owns the fiscal note pipeline downstream of the agency: return for revision, certification, and the session ledger those actions maintain. Cannot draft, introduce or amend."
    identity: opaque
    exclusive_operations:
      - "POST /fiscal-note-requests/{id}/return"
      - "POST /fiscal-note-requests/{id}/certify"
    shared_operations:
      - "POST /bills/{id}/fiscal-note-requests (with Clerk)"
      - "every GET in §1.5"

  - name: Member
    description: "Legislator. Files and withdraws drafting requests, answers clarifications, and requests amendments. Acts only on their own resources."
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /drafting-requests"
      - "POST /drafting-requests/{id}/clarify"
      - "POST /drafting-requests/{id}/withdraw"
      - "POST /amendments"
    shared_operations:
      - "GET on their own drafting requests, their own amendments, and any PUBLIC drafting request"
      - "GET /sessions/{id}, GET /bills/{id}, GET /bills, GET /committee-referrals, GET /fiscal-note-requests"

  - name: Drafter
    description: "Legislative services attorney. Performs statutory research, records conflicts, and drafts amendments. Acts only where assigned."
    identity: "entity_backed:Drafter"
    exclusive_operations:
      - "POST /drafting-requests/{id}/complete-research"
      - "POST /statutory-conflicts"
      - "POST /amendments/{id}/draft"
    shared_operations:
      - "POST /statutory-conflicts/{id}/resolve with resolution_status RESOLVED (WAIVED requires ReviewCounsel)"
      - "POST /enrolled-bills/{id}/technical-corrections (with ReviewCounsel)"
      - "every GET except GET /agencies/{id}"

  - name: ReviewCounsel
    description: "Senior legislative services attorney. Assigns drafters, waives statutory conflicts, certifies drafting-style compliance, and applies technical corrections. Backed by the SAME Drafter table as Drafter, and required to have is_senior true."
    identity: "entity_backed:Drafter"
    exclusive_operations:
      - "POST /drafting-requests/{id}/assign"
      - "POST /drafting-requests/{id}/certify-draft"
      - "POST /technical-corrections/{id}/apply"
      - "POST /statutory-conflicts/{id}/resolve with resolution_status WAIVED"
    shared_operations:
      - "POST /statutory-conflicts/{id}/resolve with resolution_status RESOLVED (with Drafter)"
      - "POST /enrolled-bills/{id}/technical-corrections (with Drafter)"
      - "every GET except GET /agencies/{id}"

  - name: AgencyAnalyst
    description: "Executive agency fiscal analyst. Files cost estimate lines with their assumptions and submits the fiscal note for the agency they belong to. Cannot certify their own numbers and cannot read the drafting pipeline at all — no drafting-request or statutory-conflict read is granted to this role."
    identity: "entity_backed:Agency"
    exclusive_operations:
      - "POST /fiscal-note-requests/{id}/cost-estimates"
      - "POST /fiscal-note-requests/{id}/submit"
    shared_operations:
      - "GET /agencies/{id} for their own agency"
      - "GET /sessions/{id}, GET /bills/{id}, GET /bills, GET /fiscal-note-requests, GET /fiscal-note-requests/{id}, GET /fiscal-note-requests/{id}/cost-estimates"
