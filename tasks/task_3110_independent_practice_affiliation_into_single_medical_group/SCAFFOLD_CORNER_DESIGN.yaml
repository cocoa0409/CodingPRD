# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3110_independent_practice_affiliation_into_single_medical_group
#
# Breadth probe. Every claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners §1.8
# covers appear as excluded_because stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: medical_group_create_applies_defaults_and_returns_common_fields
        claim_type: Creation
        grounds:
          - entities.MedicalGroup
          - endpoints.POST_/api/medical-groups
        distinguishing_aspect: "A group created with only tin and display_name returns 201 with status FORMING, version 1, and every fee/departure parameter at its documented default (tier1 0.07, cap 50,000,000, tier2 0.05, hold 5,000, notice 180, non-compete 24, base 2,500,000, monthly 250,000, notice penalty 500,000) — none client-supplied."
        test_recipe:
          setup: ["Empty database; logical clock at its default 2026-09-01T00:00:00Z."]
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
          trigger:
            - &c_group
              call: "POST /api/medical-groups"
              payload: { tin: "76-0001111", display_name: "Unified Medical Group" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { mg_id: $.data.id }
          assert:
            - "the response status is 201, response_type is object, and meta.api_request_id and meta.api_request_timestamp are present"
            - "MedicalGroup.${mg_id}.status == FORMING and version == 1"
            - "shared_services_tier1_rate == 0.07, shared_services_tier1_cap_cents == 50000000, shared_services_tier2_rate == 0.05"
            - "distribution_hold_threshold_cents == 5000, departure_notice_days == 180, non_compete_term_months == 24"
            - "early_exit_base_penalty_cents == 2500000, early_exit_per_month_cents == 250000, insufficient_notice_penalty_cents == 500000"
            - "id is a prefix-free UUID and created_at/updated_at are non-null"

      - name: practice_get_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Practice
          - endpoints.GET_/api/practices/{id}
        distinguishing_aspect: "GET returns every stored Practice field exactly as created, with wave_id and affiliation/departure dates null before any agreement execution."
        test_recipe:
          setup:
            - "Clock set; group OPERATING; market TX; practice created and still PROSPECT."
          setup_api_calls:
            - *c_clock
            - *c_group
            - &c_group_act
              call: "POST /api/medical-groups/${mg_id}/activate"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
            - &c_market
              call: "POST /api/markets"
              payload: { medical_group_id: "${mg_id}", name: "North Texas", state_code: "TX", max_practices: 10 }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { mkt_id: $.data.id }
            - &c_practice
              call: "POST /api/practices"
              payload: { medical_group_id: "${mg_id}", market_id: "${mkt_id}", legal_name: "Oak Cliff Family Medicine", legacy_tin: "75-9999999", org_npi: "1234567890" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prac_id: $.data.id, prac_v: $.data.version }
          trigger:
            - call: "GET /api/practices/${prac_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
          assert:
            - "the response status is 200"
            - "Practice.${prac_id}.legal_name == \"Oak Cliff Family Medicine\", legacy_tin == \"75-9999999\", org_npi == \"1234567890\""
            - "status == PROSPECT, wave_id is null, affiliation_effective_date is null, departure_effective_date is null"
            - "active_provider_count == 0"

      - name: practices_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/api/practices
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three practices, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns 1 row with has_more false; the status filter narrows the counted set."
        test_recipe:
          setup:
            - "Clock set; group OPERATING; market with max_practices 5; three practices created, all PROSPECT."
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - &c_market5
              call: "POST /api/markets"
              payload: { medical_group_id: "${mg_id}", name: "North Texas", state_code: "TX", max_practices: 5 }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { mkt_id: $.data.id }
            - *c_practice
            - call: "POST /api/practices"
              payload: { medical_group_id: "${mg_id}", market_id: "${mkt_id}", legal_name: "Bishop Arts Pediatrics", legacy_tin: "75-8888888", org_npi: "2234567891" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/practices"
              payload: { medical_group_id: "${mg_id}", market_id: "${mkt_id}", legal_name: "Trinity Internal Medicine", legacy_tin: "75-7777777", org_npi: "3234567892" }
              as: GroupAdministrator
              as_user_id: "ga-root"
          trigger:
            - call: "GET /api/practices"
              payload: { market_id: "${mkt_id}", limit: 2, offset: 0 }
              as: GroupFinancialController
              as_user_id: "gfc-lena"
          assert:
            - "the response status is 200 and response_type is array"
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /api/practices?market_id=${mkt_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /api/practices?market_id=${mkt_id}&status=PROSPECT returns 3 rows; status=AFFILIATED returns 0 rows"
            - "GET /api/practices with no parameters returns 3 rows under the default limit 10 / offset 0"

      - name: practice_get_unknown_id_returns_practice_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/api/practices/{id}
          - errors.ERR_PRACTICE_NOT_FOUND
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id produces the entity-specific 404 ERR_PRACTICE_NOT_FOUND with the error envelope shape, not a 400 and not a generic body."
        test_recipe:
          setup: ["Clock set; nothing else created."]
          setup_api_calls:
            - *c_clock
          trigger:
            - call: "GET /api/practices/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PRACTICE_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: batch_create_missing_period_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CollectionBatch.fields.period
          - endpoints.POST_/api/collection-batches
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "period is a required input with no default; omitting it is a 400 ERR_INVALID_REQUEST from the required-field check, evaluated before any state or referential rule."
        test_recipe:
          setup:
            - "Base affiliated setup with EFFECTIVE enrollment (batch would otherwise be valid)."
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
            - &c_wave
              call: "POST /api/implementation-waves"
              payload: { market_id: "${mkt_id}", wave_code: "W1", cutover_start_date: "2026-08-01", cutover_end_date: "2026-12-31" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { wave_id: $.data.id, wave_v: $.data.version }
            - &c_wave_lock
              call: "POST /api/implementation-waves/${wave_id}/lock"
              payload: { expected_wave_version: "${wave_v}" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - &c_wave_start
              call: "POST /api/implementation-waves/${wave_id}/start-cutover"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
            - *c_practice
            - &c_agreement
              call: "POST /api/affiliation-agreements"
              payload: { practice_id: "${prac_id}", distribution_model: "NET_OF_SHARED_SERVICES", non_compete_accepted: true, expected_practice_version: "${prac_v}" }
              as: PracticeExecutive
              as_user_id: "${prac_id}"
              captures: { ag_id: $.data.id }
            - &c_agreement_exec
              call: "POST /api/affiliation-agreements/${ag_id}/execute"
              payload: {}
              as: PracticeExecutive
              as_user_id: "${prac_id}"
            - &c_provider
              call: "POST /api/providers"
              payload: { practice_id: "${prac_id}", npi: "1112223334", full_name: "Dr. Ada Fields", specialty: "Family Medicine", provider_role: "PHYSICIAN", employment_start_date: "2026-01-15" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prov_id: $.data.id }
            - &c_contract
              call: "POST /api/payer-contracts"
              payload: { medical_group_id: "${mg_id}", payer_name: "Lone Star Health Plan", contract_type: "HYBRID", effective_date: "2026-09-01" }
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
              captures: { pc_id: $.data.id }
            - &c_rate
              call: "POST /api/fee-schedule-rates"
              payload: { payer_contract_id: "${pc_id}", cpt_code: "99213", legacy_rate_cents: 10000, group_rate_cents: 10800 }
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
            - &c_vote
              call: "POST /api/committee-votes"
              payload: { market_id: "${mkt_id}", motion_type: "PAYER_CONTRACT_RATIFICATION", subject_contract_id: "${pc_id}" }
              as: MarketCommitteeChair
              as_user_id: "${prov_id}"
              captures: { vote_id: $.data.id }
            - &c_vote_cast
              call: "POST /api/committee-votes/${vote_id}/cast"
              payload: { ballot: "FOR" }
              as: PhysicianBoardMember
              as_user_id: "${prov_id}"
            - &c_contract_act
              call: "POST /api/payer-contracts/${pc_id}/activate"
              payload: {}
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
            - &c_enrollment
              call: "POST /api/credentialing-enrollments"
              payload: { provider_id: "${prov_id}", payer_contract_id: "${pc_id}", channel: "STANDARD", requested_effective_date: "2026-12-01" }
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
              captures: { enr_id: $.data.id }
            - &c_enroll_approve
              call: "POST /api/credentialing-enrollments/${enr_id}/approve"
              payload: {}
              as: CredentialingCoordinator
              as_user_id: "cc-jules"
            - &c_wave_complete
              call: "POST /api/implementation-waves/${wave_id}/complete"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
          trigger:
            - call: "POST /api/collection-batches"
              payload: { practice_id: "${prac_id}", payer_contract_id: "${pc_id}", posted_amount_cents: 100000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /api/collection-batches?practice_id=${prac_id} returns 0 rows"

      - name: market_create_omitting_weight_defaults_to_one
        claim_type: Defaults
        grounds:
          - entities.Market.fields.market_weight
        distinguishing_aspect: "market_weight declares default 1.0; omitting it stores exactly 1.0, which later makes incentive weights equal quality x lives with no market multiplier."
        test_recipe:
          setup: ["Clock set; group OPERATING."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
          trigger:
            - *c_market
          assert:
            - "the response status is 201"
            - "Market.${mkt_id}.market_weight == 1.0"

      - name: fee_schedule_rate_uplift_is_computed_and_client_value_ignored
        claim_type: Computed Fields
        grounds:
          - entities.FeeScheduleRate.fields.uplift_pct
          - calculations.fee_schedule_avg_uplift
        distinguishing_aspect: "uplift_pct is source: computed — the server derives 0.0800 from legacy 10,000 / group 10,800 at 4dp round-half-up; a client-supplied uplift_pct is not an input and is ignored."
        test_recipe:
          setup: ["Clock set; group OPERATING; contract in NEGOTIATION."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_contract
          trigger:
            - call: "POST /api/fee-schedule-rates"
              payload: { payer_contract_id: "${pc_id}", cpt_code: "99213", legacy_rate_cents: 10000, group_rate_cents: 10800 }
              as: PayerContractingOfficer
              as_user_id: "pco-marsha"
              captures: { rate_id: $.data.id }
          assert:
            - "the response status is 201"
            - "FeeScheduleRate.${rate_id}.uplift_pct == 0.0800"
            - "FeeScheduleRate.${rate_id}.status == PROPOSED"

      - name: provider_create_ignores_extra_field_status_and_version
        claim_type: System Fields
        grounds:
          - entities.Provider.fields.status
          - endpoints.POST_/api/providers
        distinguishing_aspect: "Provider.status is source: system with initial ROSTERED; a client sending status ACTIVE or version 99 is ignored — the row is created ROSTERED with version 1."
        test_recipe:
          setup: ["Clock set; group OPERATING; market; practice PROSPECT."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
            - *c_practice
          trigger:
            - call: "POST /api/providers"
              payload: { practice_id: "${prac_id}", npi: "5556667778", full_name: "Dr. Cy Rao", specialty: "Cardiology", provider_role: "PHYSICIAN", employment_start_date: "2026-04-01", status: "ACTIVE", version: 99 }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prov_id: $.data.id }
          assert:
            - "the response status is 201"
            - "Provider.${prov_id}.status == ROSTERED and version == 1"
            - "Provider.${prov_id}.practice_id == ${prac_id}"

      - name: provider_create_with_out_of_enum_role_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Provider.fields.provider_role
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "provider_role is a closed enum {PHYSICIAN, APP}; DOCTOR is rejected with 400 ERR_INVALID_REQUEST and nothing is persisted."
        test_recipe:
          setup: ["Clock set; group OPERATING; market; practice PROSPECT."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
            - *c_practice
          trigger:
            - call: "POST /api/providers"
              payload: { practice_id: "${prac_id}", npi: "5556667778", full_name: "Dr. Cy Rao", specialty: "Cardiology", provider_role: "DOCTOR", employment_start_date: "2026-04-01" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "GET /api/providers?practice_id=${prac_id} returns 0 rows"

      - name: batch_create_body_foreign_keys_checked_in_input_order
        claim_type: Parent Relationships
        grounds:
          - validations[priority=4]
          - endpoints.POST_/api/collection-batches
          - errors.ERR_PRACTICE_NOT_FOUND
          - errors.ERR_PAYER_CONTRACT_NOT_FOUND
          - complexity_profile.entity_topology
        distinguishing_aspect: "Flat topology puts both FKs in the body. When both ids are unknown the failure is a single 404 naming the practice resource (ERR_PRACTICE_NOT_FOUND); when only the contract id is unknown it is ERR_PAYER_CONTRACT_NOT_FOUND — the resource named by the error follows the first unresolvable reference."
        test_recipe:
          setup: ["Clock set; base affiliated setup with EFFECTIVE enrollment."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
            - *c_wave
            - *c_wave_lock
            - *c_wave_start
            - *c_practice
            - *c_agreement
            - *c_agreement_exec
            - *c_provider
            - *c_contract
            - *c_rate
            - *c_vote
            - *c_vote_cast
            - *c_contract_act
            - *c_enrollment
            - *c_enroll_approve
            - *c_wave_complete
          trigger:
            - call: "POST /api/collection-batches"
              payload: { practice_id: "00000000-0000-4000-8000-000000000001", payer_contract_id: "00000000-0000-4000-8000-000000000002", period: "2026-09", posted_amount_cents: 1000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { err_both: $.data.error_id }
            - call: "POST /api/collection-batches"
              payload: { practice_id: "${prac_id}", payer_contract_id: "00000000-0000-4000-8000-000000000002", period: "2026-09", posted_amount_cents: 1000 }
              as: DistributionAccountant
              as_user_id: "da-roy"
              captures: { err_pc: $.data.error_id }
          assert:
            - "err_both == ERR_PRACTICE_NOT_FOUND (http 404) and err_both != ERR_PAYER_CONTRACT_NOT_FOUND"
            - "err_pc == ERR_PAYER_CONTRACT_NOT_FOUND (http 404)"
            - "GET /api/collection-batches?practice_id=${prac_id} returns 0 rows"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: practice_initial_state_is_prospect
        claim_type: initial_state
        grounds:
          - state_machines.Practice
        distinguishing_aspect: "A newly created practice is PROSPECT — not ONBOARDING — until an agreement executes; the wave cascade only touches ONBOARDING practices."
        test_recipe:
          setup: ["Clock set; group OPERATING; market."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
          trigger:
            - *c_practice
          assert:
            - "Practice.${prac_id}.status == PROSPECT and wave_id is null"

      - name: reinstate_from_affiliated_returns_invalid_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.Practice.SUSPENDED_to_AFFILIATED
          - errors.ERR_INVALID_TRANSITION
        distinguishing_aspect: "Reinstate is declared only from SUSPENDED; calling it on an AFFILIATED practice is a 409 ERR_INVALID_TRANSITION and no version bump occurs."
        test_recipe:
          setup: ["Base affiliated setup; practice AFFILIATED."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
            - *c_wave
            - *c_wave_lock
            - *c_wave_start
            - *c_practice
            - *c_agreement
            - *c_agreement_exec
            - *c_wave_complete
          trigger:
            - call: "POST /api/practices/${prac_id}/reinstate"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_TRANSITION"
            - "Practice.${prac_id}.status remains AFFILIATED"

      - name: departed_practice_is_terminal_and_rejects_suspend
        claim_type: terminal_lockdown
        grounds:
          - state_machines.Practice
          - errors.ERR_INVALID_TRANSITION
        distinguishing_aspect: "DEPARTED is terminal: suspend, reinstate, new agreements, and new departure cases are all rejected once the departure cascade has run."
        test_recipe:
          setup: ["Base affiliated setup; departure case settled at 2027-12-01; practice DEPARTED."]
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
            - *c_wave
            - *c_wave_lock
            - *c_wave_start
            - *c_practice
            - *c_agreement
            - *c_agreement_exec
            - *c_wave_complete
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/departure-cases"
              payload: { practice_id: "${prac_id}", requested_exit_date: "2027-12-01" }
              as: PracticeExecutive
              as_user_id: "${prac_id}"
              captures: { dc_id: $.data.id }
            - call: "POST /api/departure-cases/${dc_id}/complete-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-12-01T00:00:00Z" }
              as: GroupAdministrator
              as_user_id: "ga-root"
            - call: "POST /api/departure-cases/${dc_id}/settle"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-irene"
          trigger:
            - call: "POST /api/practices/${prac_id}/suspend"
              payload: {}
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { err_susp: $.data.error_id }
            - call: "POST /api/departure-cases"
              payload: { practice_id: "${prac_id}", requested_exit_date: "2028-06-01" }
              as: PracticeExecutive
              as_user_id: "${prac_id}"
              captures: { err_dc: $.data.error_id }
          assert:
            - "err_susp == ERR_INVALID_TRANSITION (http 409)"
            - "err_dc == ERR_INVALID_TRANSITION (http 409) — DEPARTED cannot re-enter the departure flow"
            - "Practice.${prac_id}.status remains DEPARTED"

      - name: vote_auto_closes_rejected_when_against_exceeds_half
        claim_type: side_effect_execution
        grounds:
          - state_machines.CommitteeVote.OPEN_to_REJECTED
        distinguishing_aspect: "With 3 eligible voters, the second AGAINST ballot makes votes_against 2 > floor(3/2) and closes the vote REJECTED mid-cast — there is no close endpoint, and a third ballot then hits ERR_INVALID_TRANSITION."
        test_recipe:
          setup:
            - "Base affiliated setup with THREE physician providers across the market's affiliated practice(s); vote created on the contract (eligible_voter_count snapshot 3). Two providers cast AGAINST."
          setup_api_calls:
            - *c_clock
            - *c_group
            - *c_group_act
            - *c_market
            - *c_wave
            - *c_wave_lock
            - *c_wave_start
            - *c_practice
            - *c_agreement
            - *c_agreement_exec
            - *c_provider
            - call: "POST /api/providers"
              payload: { practice_id: "${prac_id}", npi: "5556667778", full_name: "Dr. Cy Rao", specialty: "Cardiology", provider_role: "PHYSICIAN", employment_start_date: "2026-04-01" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prov2_id: $.data.id }
            - call: "POST /api/providers"
              payload: { practice_id: "${prac_id}", npi: "6667778889", full_name: "Dr. Dee Ito", specialty: "Dermatology", provider_role: "PHYSICIAN", employment_start_date: "2026-05-01" }
              as: GroupAdministrator
              as_user_id: "ga-root"
              captures: { prov3_id: $.data.id }
            - *c_contract
            - *c_wave_complete
            - call: "POST /api/committee-votes"
              payload: { market_id: "${mkt_id}", motion_type: "PAYER_CONTRACT_RATIFICATION", subject_contract_id: "${pc_id}" }
              as: MarketCommitteeChair
              as_user_id: "${prov_id}"
              captures: { vote3_id: $.data.id }
            - call: "POST /api/committee-votes/${vote3_id}/cast"
