          - "errors.ERR_RESERVATION_NOT_ACTIVE"
          - "entities.Robot.fields.current_bay_reservation_id"
        distinguishing_aspect: >-
          The guard on AVAILABLE -> CHARGING lives on another entity: the named BayReservation must already
          be ACTIVE, so BEGIN_CHARGE against a merely HELD reservation is 409 ERR_RESERVATION_NOT_ACTIVE,
          and the same call succeeds once the clock reaches the window and the reservation is activated -
          at which point current_bay_reservation_id is stamped while the bay ledger stays at 60 minutes
          because HELD and ACTIVE both occupy the interval.
