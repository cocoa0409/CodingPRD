              payload: { name: "err-incident-scope", validation_type: "DV", max_validity_days: 90, dcv_reuse_days: 30, max_dcv_reuse_count: 5, org_vetting_reuse_days: 0, allowed_dcv_methods: ["DNS_TXT"], required_sct_count: 1, base_fee_cents: 20000, crl_trigger_threshold: 100, max_crl_validity_hours: 24 }
