              payload: { booking_number: "C-2250", full_name: "Rex Tulli", facility_code: "FAC-01", custody_level: "MEDIUM", booked_at: "2026-05-01T00:00:00Z" }
              as: IntakeOfficer
              captures: { inm: $.data.id }
            - call: "POST /specialty-referrals"
              payload: { inmate_id: "${inm}", specialty: "CARDIOLOGY", urgency: "EMERGENT" }
              as: Provider
              as_user_id: "u-prov-1"
              captures: { ref_p: $.data.id }
            - call: "POST /specialty-referrals"
              payload: { inmate_id: "${inm}", specialty: "ONCOLOGY", urgency: "EMERGENT" }
