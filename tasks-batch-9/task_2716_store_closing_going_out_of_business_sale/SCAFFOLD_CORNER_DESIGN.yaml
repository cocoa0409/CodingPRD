        distinguishing_aspect: "Rounding happens once per item and the retailer takes the remainder: two 333,333 items at 35% give 116,667 each so the liquidator aggregate is 233,334, one cent above the 233,333 a pooled round of 666,666 would produce."
        test_recipe:
