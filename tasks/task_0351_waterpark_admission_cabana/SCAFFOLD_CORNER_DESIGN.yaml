              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FREEZE_NOT_ALLOWED"

      - name: assign_window_over_capacity_returns_capacity_exceeded
        claim_type: Aggregate validation
        grounds: ["validations[priority=15]", "errors[ERR_WINDOW_CAPACITY_EXCEEDED]"]
        distinguishing_aspect: "Window capacity 1 already filled by one CONFIRMED admission; assigning a second admission returns ERR_WINDOW_CAPACITY_EXCEEDED."
        test_recipe:
          setup: ["window_capacity 1, one admission CONFIRMED; a second FULFILLED admission ISSUED ready to assign"]
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Cap Park", total_gate_capacity: 100 }
              as: ParkManager
              captures: { park_id: $.data.id }
            - call: "POST /pricing-policies"
              payload: { park_id: "${park_id}", product_type: "DAY_TICKET", base_price_cents: 5000 }
