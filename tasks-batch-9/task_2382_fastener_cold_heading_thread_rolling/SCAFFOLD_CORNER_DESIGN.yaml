          The rule is symmetric and reads the pinned PartSpec, not the operation's own intent: an
          AFTER_HEAT_TREAT part refuses a THREAD_ROLL queued while the lot is still HEADED, and a
          BEFORE_HEAT_TREAT part refuses a THREAD_ROLL queued once the lot is HEAT_TREATED — while a
          non-thread operation such as DRILL is accepted at either stage.
