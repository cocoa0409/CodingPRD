scenario: "244. Audiology & Hearing Aid Clinic: hearing evaluation, device selection/fitting trial, insurance/allowance benefit, follow-up adjustment, warranty/loss-damage, battery/supply subscription, trial-period return, recall/reprogramming"
domain_name: audiology-hearing-aid-clinic
api_prefix: /clinic

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"

  entity_topology: hybrid
  # Patients own evaluations and orders (hierarchy); DeviceModel + AllowanceBenefit
  # + RecallNotice are flat configuration/reference entities cross-cut by FK; the
  # device fitting/warranty/subscription chain hangs off the order line.

  state_machine_shape: branching
  # FittingOrder forks at trial outcome: PURCHASED vs RETURNED, with divergent
  # side-effect sets per branch; WarrantyClaim has a revert (DENIED->APPEALED->...).

  relationship_patterns:
    - one_to_many       # Patient -> HearingEvaluation, Patient -> FittingOrder
    - cross_aggregate   # FittingOrder references DeviceModel and AllowanceBenefit
    - polymorphic       # LedgerEntry.source_ref_id points at order / claim / subscription-cycle

  role_model: peer_roles
  # Audiologist owns clinical evaluation + fitting/adjustment; BillingClerk owns
  # benefit application, refunds, warranty financials; ClinicAdmin manages catalog,
  # recalls, clock; Patient is the entity-backed self-service actor.

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:
  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Tie-break/fallback key when one is needed."
      - name: updated_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, refreshed on every mutation including cascaded side effects."
      - name: version
        type: integer
        source: system
        description: "Starts at 1, increments by 1 on every mutation. Used for OCC."
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "YYYY-MM-DD. Used to derive pediatric flag at evaluation time."
      - name: insurer_name
        type: string
        source: input
        description: "Insurer of record; informational, not a benefit pool."
        default: null
      - name: status
        type: enum
        source: system
        description: "Lifecycle of the patient record."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: DeviceModel
    parent: null
    common_fields: true
    fields:
      - name: model_code
        type: string
        source: input
        description: "Unique catalog code, e.g. 'OTI-MORE-3'. Uniqueness constraint."
        constraints: "globally unique among non-DISCONTINUED DeviceModel rows"
      - name: name
        type: string
        source: input
        description: "Marketing name."
      - name: list_price_cents
        type: integer
        source: input
        description: "Per-device retail price in cents (one ear). Must be > 0."
        constraints: "> 0"
      - name: restock_fee_cents
        type: integer
        source: input
        description: "Flat restocking fee charged on a trial-period return of this model. >= 0."
        constraints: ">= 0"
      - name: min_severity
        type: enum
        source: input
        description: "Minimum hearing-loss severity this model is indicated for."
        constraints: "one of {MILD, MODERATE, SEVERE, PROFOUND}"
      - name: firmware_version
        type: string
        source: input
        description: "Current shipping firmware string, e.g. '4.2.0'."
      - name: warranty_months
        type: integer
        source: input
        description: "Manufacturer warranty length in months from purchase. > 0."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Catalog lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, DISCONTINUED}"

  - name: AllowanceBenefit
    parent: null
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient this benefit pool belongs to."
      - name: plan_name
        type: string
        source: input
        description: "Benefit plan label, e.g. 'GoldHearing-2026'."
      - name: total_allowance_cents
        type: integer
        source: input
        description: "Total hearing-aid allowance granted for the benefit period, in cents. > 0."
        constraints: "> 0"
      - name: per_device_cap_cents
        type: integer
        source: input
        description: "Maximum allowance applicable to a single device, in cents. > 0."
        constraints: "> 0"
      - name: coinsurance_pct
        type: number
        source: input
        description: "Patient coinsurance fraction (0..1) applied to the post-allowance remainder before any device cap reasoning. e.g. 0.20."
        constraints: "0 <= coinsurance_pct < 1"
      - name: consumed_allowance_cents
        type: integer
        source: computed
        description: "Sum of allowance_applied_cents across this patient's FittingOrders whose status is in {PURCHASED, WARRANTY_ACTIVE}. Recomputed on every order purchase, return, and warranty replacement."
      - name: period_end
        type: string
        source: input
        description: "YYYY-MM-DD inclusive last day the benefit may be applied (compared against clock date)."
      - name: status
        type: enum
        source: system
        description: "Benefit lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, EXHAUSTED, EXPIRED}"

  - name: HearingEvaluation
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the evaluated patient."
      - name: audiologist_user_id
        type: string
        source: input
        description: "Opaque Audiologist operator id who performed the evaluation."
      - name: pure_tone_avg_db
        type: integer
        source: input
        description: "Pure-tone average threshold in dB HL (better ear). 0..120."
        constraints: "0 <= pure_tone_avg_db <= 120"
      - name: severity
        type: enum
        source: computed
        description: "Classified from pure_tone_avg_db via the severity_classification calculation."
        constraints: "one of {NORMAL, MILD, MODERATE, SEVERE, PROFOUND}"
      - name: is_pediatric
        type: boolean
        source: computed
        description: "True when patient age at evaluation date < 18, derived from Patient.date_of_birth and the clock date."
      - name: candidate
        type: boolean
        source: computed
        description: "True when severity is not NORMAL (patient is a hearing-aid candidate)."
      - name: status
        type: enum
        source: system
        description: "Evaluation lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, FINALIZED, SUPERSEDED}"

  - name: FittingOrder
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient receiving the device."
      - name: evaluation_id
        type: string
        source: input
        description: "FK -> HearingEvaluation.id; the FINALIZED evaluation justifying this fit."
      - name: device_model_id
        type: string
        source: input
        description: "FK -> DeviceModel.id; the fitted model."
      - name: allowance_benefit_id
        type: string
        source: input
        description: "FK -> AllowanceBenefit.id; pool tapped at purchase. Nullable for self-pay."
        default: null
      - name: ear_count
        type: integer
        source: input
        description: "1 (monaural) or 2 (binaural). Multiplies device list price."
        constraints: "ear_count in {1, 2}"
      - name: trial_started_at
        type: datetime
        source: system
        description: "Clock timestamp when the trial began (set on START_TRIAL)."
        default: null
      - name: trial_deadline_at
        type: datetime
        source: computed
        description: "trial_started_at + TRIAL_PERIOD_DAYS days; the inclusive cutoff for a no-penalty-window return decision."
        default: null
      - name: gross_price_cents
        type: integer
        source: computed
        description: "DeviceModel.list_price_cents * ear_count, snapshotted at PURCHASE."
        default: null
      - name: allowance_applied_cents
        type: integer
        source: computed
        description: "Allowance dollars applied at PURCHASE via the benefit_waterfall calculation."
        default: 0
      - name: patient_due_cents
        type: integer
        source: computed
        description: "Net amount the patient owes at PURCHASE via the patient_due calculation."
        default: null
      - name: refund_cents
        type: integer
        source: computed
        description: "Amount refunded to the patient on a RETURNED order via the return_refund calculation."
        default: 0
      - name: fitted_firmware_version
        type: string
        source: computed
        description: "DeviceModel.firmware_version snapshotted at PURCHASE; compared against recalls."
        default: null
      - name: status
        type: enum
        source: system
        description: "Order lifecycle (see §1.2)."
        default: DRAFT
        constraints: "one of {DRAFT, TRIAL, PURCHASED, WARRANTY_ACTIVE, RETURNED, CANCELLED}"

  - name: AdjustmentSession
    parent: FittingOrder
    common_fields: true
    fields:
      - name: fitting_order_id
        type: string
        source: input
        description: "FK -> FittingOrder.id; the order whose device is being adjusted/reprogrammed."
      - name: audiologist_user_id
        type: string
        source: input
        description: "Opaque Audiologist operator id performing the session."
      - name: reason
        type: enum
        source: input
        description: "Why the session occurred."
        constraints: "one of {COMFORT, RECALL_REPROGRAM, GAIN_TUNE}"
      - name: applied_firmware_version
        type: string
        source: input
        description: "Firmware flashed during this session; for RECALL_REPROGRAM must equal the recall's target_firmware_version."
        default: null
      - name: recall_notice_id
        type: string
        source: input
        description: "FK -> RecallNotice.id; set only when reason is RECALL_REPROGRAM."
        default: null
      - name: status
        type: enum
        source: system
        description: "Session lifecycle."
        default: COMPLETED
        constraints: "one of {COMPLETED, VOIDED}"

  - name: WarrantyClaim
    parent: FittingOrder
    common_fields: true
    fields:
      - name: fitting_order_id
        type: string
        source: input
        description: "FK -> FittingOrder.id; the device under claim. Order must be WARRANTY_ACTIVE."
      - name: claim_type
        type: enum
        source: input
        description: "Nature of the claim."
        constraints: "one of {DEFECT, LOSS, DAMAGE}"
      - name: incident_date
        type: string
        source: input
        description: "YYYY-MM-DD when the loss/damage/defect occurred; must be on/before clock date and within warranty window."
      - name: assessed_value_cents
        type: integer
        source: input
        description: "Replacement device value the clerk assesses, in cents. > 0."
        constraints: "> 0"
      - name: deductible_cents
        type: integer
        source: computed
        description: "Patient out-of-pocket via the warranty_settlement calculation; depends on claim_type."
        default: null
      - name: clinic_cost_cents
        type: integer
        source: computed
        description: "Amount the clinic/manufacturer absorbs via the warranty_settlement calculation."
        default: null
      - name: status
        type: enum
        source: system
        description: "Claim lifecycle (see §1.2)."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, DENIED, APPEALED, REPLACED}"

  - name: SupplySubscription
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; subscriber."
      - name: fitting_order_id
        type: string
        source: input
        description: "FK -> FittingOrder.id; the device this supply plan feeds. Order must be PURCHASED or WARRANTY_ACTIVE."
      - name: cadence_days
        type: integer
        source: input
        description: "Days between shipment cycles. One of {30, 60, 90}."
        constraints: "cadence_days in {30, 60, 90}"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price per shipment cycle in cents, before any loyalty discount. > 0."
        constraints: "> 0"
      - name: started_at
        type: datetime
        source: system
        description: "Clock timestamp when subscription was activated."
        default: null
      - name: cycles_fulfilled
        type: integer
        source: computed
        description: "Count of SupplyCycle rows under this subscription with status SHIPPED."
        default: 0
      - name: lifetime_billed_cents
        type: integer
        source: computed
        description: "Sum of billed_cents across this subscription's SHIPPED SupplyCycle rows."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle."
        default: ACTIVE
        constraints: "one of {ACTIVE, PAUSED, CANCELLED}"

  - name: SupplyCycle
    parent: SupplySubscription
    common_fields: true
    fields:
      - name: subscription_id
        type: string
        source: input
        description: "FK -> SupplySubscription.id; the parent subscription."
      - name: cycle_index
        type: integer
        source: system
        description: "1-based monotonic index within the subscription (1, 2, 3, ...)."
      - name: due_at
        type: datetime
        source: computed
        description: "subscription.started_at + cycle_index * cadence_days days."
      - name: billed_cents
        type: integer
        source: computed
        description: "Per-cycle charge via the supply_cycle_billing calculation (loyalty discount applies past threshold)."
        default: null
      - name: status
        type: enum
        source: system
        description: "Cycle lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, SHIPPED, SKIPPED}"

  - name: RecallNotice
    parent: null
    common_fields: true
    fields:
      - name: device_model_id
        type: string
        source: input
        description: "FK -> DeviceModel.id; the affected model."
      - name: affected_firmware_version
        type: string
        source: input
        description: "Firmware string that is being recalled."
      - name: target_firmware_version
        type: string
        source: input
        description: "Firmware string devices must be reprogrammed to."
      - name: severity_level
        type: enum
        source: input
        description: "Recall urgency."
        constraints: "one of {ADVISORY, MANDATORY}"
      - name: affected_order_count
        type: integer
        source: computed
        description: "Count of FittingOrders set to RECALL pending by this notice when ISSUED."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Recall lifecycle."
        default: DRAFT
        constraints: "one of {DRAFT, ISSUED, CLOSED}"

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: id
        type: string
        source: system
        description: "Server-minted UUID, no type prefix. Identity only; never a business-decision input."
      - name: created_at
        type: datetime
        source: system
        description: "ISO 8601 UTC, three fractional digits. Chronological replay key for ledger reconciliation."
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id; the patient whose money this entry moves."
      - name: source_kind
        type: enum
        source: input
        description: "Which subsystem produced this entry."
        constraints: "one of {ORDER_PURCHASE, ORDER_RETURN, ALLOWANCE_APPLIED, WARRANTY_DEDUCTIBLE, SUPPLY_BILLING}"
      - name: source_ref_id
        type: string
        source: input
        description: "Polymorphic id of the FittingOrder / WarrantyClaim / SupplyCycle that produced this entry (resolved by source_kind)."
      - name: amount_cents
        type: integer
        source: input
        description: "Signed cents: positive = charge to patient, negative = credit/refund to patient. allowance_applied is recorded as a negative offset."
      - name: memo
        type: string
        source: input
        description: "Human-readable description."
        default: null

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:
  - entity: HearingEvaluation
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /clinic/evaluations/{id}/finalize"
        actor: Audiologist
        preconditions:
          - "evaluation.status == DRAFT"
          - "pure_tone_avg_db is set"
        side_effects:
          - "compute severity via severity_classification"
          - "compute is_pediatric from Patient.date_of_birth and clock date"
          - "compute candidate = (severity != NORMAL)"
          - "increments HearingEvaluation.version by 1"
        note: "A patient may hold at most one FINALIZED evaluation at a time (see SUPERSEDED transition)."
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: another evaluation for the same patient is FINALIZED"
        actor: system
        preconditions:
          - "a newer evaluation for the same patient_id reaches FINALIZED"
        side_effects:
          - "this evaluation.status = SUPERSEDED"
          - "increments HearingEvaluation.version by 1"
        note: "Cascade hop: finalize new -> supersede old. A FittingOrder already referencing the superseded evaluation is unaffected (snapshot)."

  - entity: FittingOrder
    initial_state: DRAFT
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: DRAFT
        to: TRIAL
        trigger: "POST /clinic/orders/{id}/start-trial"
        actor: Audiologist
        preconditions:
          - "order.status == DRAFT"
          - "referenced HearingEvaluation.status == FINALIZED"
          - "referenced HearingEvaluation.candidate == true"
          - "DeviceModel.status == ACTIVE"
          - "device indicated: severity rank >= DeviceModel.min_severity rank (severity_indication check)"
        side_effects:
          - "set trial_started_at = clock now"
          - "compute trial_deadline_at = trial_started_at + TRIAL_PERIOD_DAYS days"
          - "increments FittingOrder.version by 1"
      - from: TRIAL
        to: PURCHASED
        trigger: "POST /clinic/orders/{id}/purchase"
        actor: BillingClerk
        preconditions:
          - "order.status == TRIAL"
          - "clock now <= trial_deadline_at"
          - "if allowance_benefit_id set: AllowanceBenefit.status == ACTIVE and clock date <= period_end"
        side_effects:
          - "snapshot gross_price_cents = DeviceModel.list_price_cents * ear_count"
          - "snapshot fitted_firmware_version = DeviceModel.firmware_version"
          - "compute allowance_applied_cents via benefit_waterfall"
          - "compute patient_due_cents via patient_due"
          - "append LedgerEntry ORDER_PURCHASE amount_cents = +gross_price_cents"
          - "append LedgerEntry ALLOWANCE_APPLIED amount_cents = -allowance_applied_cents (only when allowance_applied_cents > 0)"
          - "recompute AllowanceBenefit.consumed_allowance_cents (cascade hop 2)"
          - "if consumed_allowance_cents >= total_allowance_cents: AllowanceBenefit.status = EXHAUSTED (cascade hop 3)"
          - "increments FittingOrder.version by 1"
        note: "Branch point: TRIAL forks to PURCHASED or RETURNED with divergent side-effect sets."
      - from: TRIAL
        to: RETURNED
        trigger: "POST /clinic/orders/{id}/return"
        actor: BillingClerk
        preconditions:
          - "order.status == TRIAL"
        side_effects:
          - "compute refund_cents via return_refund (within-window vs late branch)"
          - "append LedgerEntry ORDER_RETURN amount_cents = -refund_cents"
          - "increments FittingOrder.version by 1"
        note: "Compensating action for a not-yet-purchased trial; no allowance was consumed so none is released."
      - from: PURCHASED
        to: RETURNED
        trigger: "POST /clinic/orders/{id}/return"
        actor: BillingClerk
        preconditions:
          - "order.status == PURCHASED"
          - "clock now <= trial_deadline_at"
        side_effects:
          - "compute refund_cents via return_refund"
          - "append LedgerEntry ORDER_RETURN amount_cents = -refund_cents"
          - "release allowance: recompute AllowanceBenefit.consumed_allowance_cents excluding this now-RETURNED order (cascade hop 2)"
          - "if AllowanceBenefit was EXHAUSTED and consumed_allowance_cents < total_allowance_cents: status = ACTIVE (cascade hop 3)"
          - "increments FittingOrder.version by 1"
        note: "Compensating action for a purchase: refund + allowance release must conserve the patient net-charge invariant (see calculations)."
      - from: PURCHASED
        to: WARRANTY_ACTIVE
        trigger: "POST /clinic/orders/{id}/activate-warranty"
        actor: BillingClerk
        preconditions:
          - "order.status == PURCHASED"
          - "clock now > trial_deadline_at (trial window closed -> sale is final)"
        side_effects:
          - "increments FittingOrder.version by 1"
        note: "Guarded by trial window closure; once WARRANTY_ACTIVE the order can no longer be returned."
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /clinic/orders/{id}/cancel"
        actor: Audiologist
        preconditions:
          - "order.status == DRAFT"
        side_effects:
          - "increments FittingOrder.version by 1"

  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [REPLACED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /clinic/warranty-claims/{id}/approve"
        actor: BillingClerk
        preconditions:
          - "claim.status == SUBMITTED"
          - "FittingOrder.status == WARRANTY_ACTIVE"
          - "incident_date within warranty window: clock date <= purchase_date + DeviceModel.warranty_months months"
        side_effects:
          - "compute deductible_cents and clinic_cost_cents via warranty_settlement"
          - "increments WarrantyClaim.version by 1"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /clinic/warranty-claims/{id}/deny"
        actor: BillingClerk
        preconditions:
          - "claim.status == SUBMITTED"
        side_effects:
          - "increments WarrantyClaim.version by 1"
      - from: DENIED
        to: APPEALED
        trigger: "POST /clinic/warranty-claims/{id}/appeal"
        actor: Patient
        preconditions:
          - "claim.status == DENIED"
        side_effects:
          - "increments WarrantyClaim.version by 1"
        note: "Revert/cycle edge: DENIED -> APPEALED -> APPROVED or DENIED again."
      - from: APPEALED
        to: APPROVED
        trigger: "POST /clinic/warranty-claims/{id}/approve"
        actor: BillingClerk
        preconditions:
          - "claim.status == APPEALED"
          - "FittingOrder.status == WARRANTY_ACTIVE"
        side_effects:
          - "compute deductible_cents and clinic_cost_cents via warranty_settlement"
          - "increments WarrantyClaim.version by 1"
      - from: APPEALED
        to: DENIED
        trigger: "POST /clinic/warranty-claims/{id}/deny"
        actor: BillingClerk
        preconditions:
          - "claim.status == APPEALED"
        side_effects:
          - "increments WarrantyClaim.version by 1"
        note: "Second leg of the cycle; an appeal can be denied again."
      - from: APPROVED
        to: REPLACED
        trigger: "POST /clinic/warranty-claims/{id}/replace"
        actor: BillingClerk
        preconditions:
          - "claim.status == APPROVED"
          - "expected_warranty_claim_version matches (OCC)"
        side_effects:
          - "append LedgerEntry WARRANTY_DEDUCTIBLE amount_cents = +deductible_cents"
          - "if claim_type == LOSS: FittingOrder.fitted_firmware_version = DeviceModel.firmware_version (replacement ships current firmware)"
          - "increments WarrantyClaim.version by 1"

  - entity: SupplySubscription
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /clinic/subscriptions/{id}/pause"
        actor: Patient
        preconditions:
          - "subscription.status == ACTIVE"
        side_effects:
          - "increments SupplySubscription.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /clinic/subscriptions/{id}/resume"
        actor: Patient
        preconditions:
          - "subscription.status == PAUSED"
        side_effects:
          - "increments SupplySubscription.version by 1"
        note: "Cyclic edge: ACTIVE -> PAUSED -> ACTIVE."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /clinic/subscriptions/{id}/cancel"
        actor: Patient
        preconditions:
          - "subscription.status == ACTIVE"
        side_effects:
          - "all SCHEDULED SupplyCycle rows -> SKIPPED (conditional cascade: only non-terminal cycles)"
          - "increments SupplySubscription.version by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /clinic/subscriptions/{id}/cancel"
        actor: Patient
        preconditions:
          - "subscription.status == PAUSED"
        side_effects:
          - "all SCHEDULED SupplyCycle rows -> SKIPPED"
          - "increments SupplySubscription.version by 1"

  - entity: SupplyCycle
    initial_state: SCHEDULED
    terminal_states: [SHIPPED, SKIPPED]
    transitions:
      - from: SCHEDULED
        to: SHIPPED
        trigger: "POST /clinic/supply-cycles/{id}/ship"
        actor: ClinicAdmin
        preconditions:
          - "cycle.status == SCHEDULED"
          - "parent SupplySubscription.status == ACTIVE"
          - "clock now >= due_at"
        side_effects:
          - "compute billed_cents via supply_cycle_billing"
          - "append LedgerEntry SUPPLY_BILLING amount_cents = +billed_cents"
          - "recompute SupplySubscription.cycles_fulfilled and lifetime_billed_cents (cascade hop)"
          - "increments SupplyCycle.version by 1"
      - from: SCHEDULED
        to: SKIPPED
        trigger: "POST /clinic/supply-cycles/{id}/skip OR subscription cancel cascade"
        actor: ClinicAdmin
        preconditions:
          - "cycle.status == SCHEDULED"
        side_effects:
          - "increments SupplyCycle.version by 1"

  - entity: RecallNotice
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /clinic/recalls/{id}/issue"
        actor: ClinicAdmin
        preconditions:
          - "recall.status == DRAFT"
          - "expected_recall_notice_version matches (OCC)"
        side_effects:
          - "scan FittingOrders where device_model_id == recall.device_model_id AND fitted_firmware_version == affected_firmware_version AND status == WARRANTY_ACTIVE"
          - "for each matched order: create an AdjustmentSession placeholder is NOT auto-made; instead mark order via recall by setting affected_order_count and (for MANDATORY) the order is flagged recall_pending through reprogramming requirement"
          - "set affected_order_count = number of matched orders"
          - "increments RecallNotice.version by 1"
        note: "Fan-out (NOT a transitive cascade): one issue directly marks each matched order; the matched orders are independent of one another. The transitive chain lives elsewhere (see §1.8)."
      - from: ISSUED
        to: CLOSED
        trigger: "POST /clinic/recalls/{id}/close"
        actor: ClinicAdmin
        preconditions:
          - "recall.status == ISSUED"
          - "every affected order has a COMPLETED AdjustmentSession with reason RECALL_REPROGRAM and applied_firmware_version == target_firmware_version (for MANDATORY recalls)"
        side_effects:
          - "increments RecallNotice.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC only — true races)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: replace-stale-claim
    parent_entity: WarrantyClaim
    write_endpoint: "POST /clinic/warranty-claims/{id}/replace"
    occ_field: "expected_warranty_claim_version"
    description: |
      Marking an APPROVED WarrantyClaim REPLACED against a claim whose version
      has advanced since the client last observed it is rejected. The settlement
      (deductible_cents / clinic_cost_cents) is recomputed on each APPROVE, so a
      replace carrying a stale version would post a deductible LedgerEntry that
      no longer reflects the current assessed settlement.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: issue-stale-recall
    parent_entity: RecallNotice
    write_endpoint: "POST /clinic/recalls/{id}/issue"
    occ_field: "expected_recall_notice_version"
    description: |
      Issuing a RecallNotice whose version has advanced since the client last
      observed it is rejected. A recall's affected-order scan snapshots the
      affected_order_count; issuing on a stale view (e.g. after the device
      model's firmware was edited) would freeze a count that no longer matches
      the catalog, so the write is gated on the parent's current version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:
  - name: severity_classification
    trigger: "on HearingEvaluation FINALIZE"
    algorithm: threshold
    formula: |
      ptag = pure_tone_avg_db
      if ptag <= 25:        severity = NORMAL
      elif ptag <= 40:      severity = MILD       # 26..40
      elif ptag <= 55:      severity = MODERATE   # 41..55
      elif ptag <= 70:      severity = SEVERE     # 56..70
      else:                 severity = PROFOUND   # 71..120
      candidate = (severity != NORMAL)
    input_set: "Single HearingEvaluation; reads only pure_tone_avg_db."
    constants:
      NORMAL_MAX_DB: 25
      MILD_MAX_DB: 40
      MODERATE_MAX_DB: 55
      SEVERE_MAX_DB: 70
    precision: "integer dB; boundaries are inclusive upper bounds (<=)."
    variants:
      - name: boundary_normal_mild
        when: "ptag == 25 vs ptag == 26"
        difference: "25 -> NORMAL (not a candidate); 26 -> MILD (candidate). Exact >= boundary."

  - name: benefit_waterfall
    trigger: "on FittingOrder PURCHASE (TRIAL->PURCHASED)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order is pinned: cap-then-pool, NOT pool-then-cap.
      gross = DeviceModel.list_price_cents * ear_count                 # snapshot
      if allowance_benefit_id is null: return allowance_applied = 0
      benefit = AllowanceBenefit
      # Step 1: per-device cap limits how much pool can touch THIS order's gross.
      per_device_eligible = min(gross, benefit.per_device_cap_cents)
      # Step 2: remaining pool after already-consumed.
      pool_remaining = max(0, benefit.total_allowance_cents - benefit.consumed_allowance_cents)
      # Step 3: applied = min(cap-eligible, pool-remaining).
      allowance_applied = min(per_device_eligible, pool_remaining)
    input_set: "One FittingOrder + its DeviceModel + its AllowanceBenefit. consumed_allowance_cents reflects only PURCHASED/WARRANTY_ACTIVE sibling orders."
    constants: {}
    precision: "integer cents; min/max only, no rounding needed."
    variants:
      - name: cap_binds_first
        when: "gross > per_device_cap and pool_remaining > per_device_cap"
        difference: "applied = per_device_cap (cap binds before pool)."
      - name: pool_binds_first
        when: "pool_remaining < per_device_cap_eligible"
        difference: "applied = pool_remaining (pool exhausted before cap)."

  - name: patient_due
    trigger: "on FittingOrder PURCHASE (TRIAL->PURCHASED)"
    algorithm: forward_looking
    formula: |
      # Evaluation order pinned: allowance first, THEN coinsurance on the remainder.
      gross = gross_price_cents
      allowance = allowance_applied_cents             # from benefit_waterfall
      post_allowance = gross - allowance
      coins = AllowanceBenefit.coinsurance_pct (0 if self-pay)
      coinsurance_amount = round_half_up(post_allowance * coins)   # per-order, single rounding
      patient_due = post_allowance + coinsurance_amount
    input_set: "Single FittingOrder after benefit_waterfall has run."
    constants: {}
    precision: "round_half_up to whole cents; coinsurance rounded once on the post-allowance remainder."
    variants:
      - name: self_pay
        when: "allowance_benefit_id is null"
        difference: "allowance = 0, coins = 0, patient_due = gross."

  - name: return_refund
    trigger: "on FittingOrder RETURN (TRIAL->RETURNED or PURCHASED->RETURNED)"
    algorithm: chronological
    formula: |
      # Conserved-quantity compensation. Net patient charge must end at the
      # restocking fee (within window) or full gross retention boundary (late).
      model = DeviceModel
      now = clock_now
      within_window = (now <= trial_deadline_at)
      if order was never PURCHASED (TRIAL->RETURNED):
          # patient paid nothing yet; refund is 0, but a restock fee is still owed.
          refund = -model.restock_fee_cents     # negative refund == a charge
      else:  # PURCHASED->RETURNED
          if within_window:
              refund = patient_due_cents - model.restock_fee_cents
          else:
              refund = 0      # late return after window: no refund (sale stands)
      # Conserved-quantity invariant (purchased return in window):
      #   net_patient_charge := patient_due_cents - refund_cents == DeviceModel.restock_fee_cents
      #   This holds for self-pay and allowance/coinsurance orders alike, since
      #   patient_due_cents already folds allowance + coinsurance into the patient's bill.
    input_set: "Single FittingOrder + its DeviceModel; reads patient_due_cents and trial_deadline_at."
    constants: {}
    precision: "integer cents."
    variants:
      - name: trial_return_no_purchase
        when: "order.status == TRIAL at return time"
        difference: "refund = -restock_fee (patient owes restock fee only); no allowance was consumed."
      - name: purchased_return_in_window
        when: "order.status == PURCHASED and now <= trial_deadline_at"
        difference: "refund = patient_due - restock_fee; allowance released back to pool."
      - name: purchased_return_late
        when: "order.status == PURCHASED and now > trial_deadline_at"
        difference: "refund = 0 (return rejected by precondition in practice; calc pins the boundary)."

  - name: warranty_settlement
    trigger: "on WarrantyClaim APPROVE (SUBMITTED->APPROVED or APPEALED->APPROVED)"
    algorithm: tiered_pricing
    formula: |
      av = assessed_value_cents
      if claim_type == DEFECT:
          deductible = 0
          clinic_cost = av
      elif claim_type == DAMAGE:
          # patient pays DAMAGE_DEDUCTIBLE_PCT of assessed value, capped at DEDUCTIBLE_CAP_CENTS.
          deductible = min(round_half_up(av * DAMAGE_DEDUCTIBLE_PCT), DEDUCTIBLE_CAP_CENTS)
          clinic_cost = av - deductible
      else:  # LOSS
          # higher rate, same cap.
          deductible = min(round_half_up(av * LOSS_DEDUCTIBLE_PCT), DEDUCTIBLE_CAP_CENTS)
          clinic_cost = av - deductible
      # Invariant: deductible + clinic_cost == assessed_value_cents (conserved).
    input_set: "Single WarrantyClaim; reads claim_type and assessed_value_cents."
    constants:
      DAMAGE_DEDUCTIBLE_PCT: 0.25
      LOSS_DEDUCTIBLE_PCT: 0.50
      DEDUCTIBLE_CAP_CENTS: 40000
    precision: "round_half_up to whole cents; cap applied AFTER rounding."
    variants:
      - name: defect_free
        when: "claim_type == DEFECT"
        difference: "deductible = 0; clinic absorbs full assessed value."
      - name: damage_vs_loss_rate
        when: "claim_type in {DAMAGE, LOSS}"
        difference: "LOSS uses 0.50 rate, DAMAGE uses 0.25; both share the 40000 cap."

  - name: supply_cycle_billing
    trigger: "on SupplyCycle SHIP (SCHEDULED->SHIPPED)"
    algorithm: threshold
    formula: |
      # cycle_index is 1-based. Loyalty discount kicks in strictly AFTER the
      # threshold cycle: cycles with cycle_index > LOYALTY_THRESHOLD_CYCLES
      # bill at the discounted rate.
      base = subscription.unit_price_cents
      if cycle_index > LOYALTY_THRESHOLD_CYCLES:
          billed = round_half_up(base * (1 - LOYALTY_DISCOUNT_PCT))
      else:
          billed = base
    input_set: "Single SupplyCycle + its SupplySubscription."
    constants:
      LOYALTY_THRESHOLD_CYCLES: 6
      LOYALTY_DISCOUNT_PCT: 0.10
    precision: "round_half_up to whole cents."
    variants:
      - name: pre_loyalty
        when: "cycle_index <= 6"
        difference: "billed = unit_price (no discount). cycle_index == 6 still full price."
      - name: post_loyalty
        when: "cycle_index >= 7"
        difference: "billed = unit_price * 0.90 rounded. Boundary is > not >=."

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "Acting role is permitted to call this endpoint per §1.7 RBAC."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all
  - priority: 3
    category: auth
    check: "For entity_backed Patient acting on own resource, X-User-ID equals the resource's patient_id."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "patient self-service endpoints (appeal, pause, resume, cancel subscription)"
  - priority: 4
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right in the path then body FKs."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all
  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: business_referential
    check: "On start-trial, the referenced HearingEvaluation belongs to the same patient as the order."
    error_id: ERR_EVALUATION_PATIENT_MISMATCH
    http_status: 422
    applies_to: "POST /clinic/orders/{id}/start-trial"
  - priority: 7
    category: business_safety
    check: "On start-trial, referenced HearingEvaluation.candidate == true (severity != NORMAL)."
    error_id: ERR_NOT_A_CANDIDATE
    http_status: 422
    applies_to: "POST /clinic/orders/{id}/start-trial"
  - priority: 8
    category: business_safety
    check: "On start-trial, DeviceModel.min_severity rank <= evaluation.severity rank (device indicated for the loss)."
    error_id: ERR_DEVICE_NOT_INDICATED
    http_status: 422
    applies_to: "POST /clinic/orders/{id}/start-trial"
  - priority: 9
    category: business_temporal
    check: "On purchase, clock now <= trial_deadline_at."
    error_id: ERR_TRIAL_EXPIRED
    http_status: 422
    applies_to: "POST /clinic/orders/{id}/purchase"
  - priority: 10
    category: business_temporal
    check: "On benefit application at purchase, clock date <= AllowanceBenefit.period_end."
    error_id: ERR_BENEFIT_EXPIRED
    http_status: 422
    applies_to: "POST /clinic/orders/{id}/purchase"
  - priority: 11
    category: business_temporal
    check: "On warranty-claim approve, incident_date within purchase_date + warranty_months months (clock date check)."
    error_id: ERR_OUTSIDE_WARRANTY_WINDOW
    http_status: 422
    applies_to: "POST /clinic/warranty-claims/{id}/approve"
  - priority: 12
    category: business_temporal
    check: "On return (PURCHASED->RETURNED), clock now <= trial_deadline_at (late returns rejected)."
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /clinic/orders/{id}/return"
  - priority: 13
    category: business_temporal
    check: "On activate-warranty, clock now > trial_deadline_at (cannot finalize sale before trial closes)."
    error_id: ERR_TRIAL_NOT_CLOSED
    http_status: 422
    applies_to: "POST /clinic/orders/{id}/activate-warranty"
  - priority: 14
    category: business_temporal
    check: "On supply-cycle ship, clock now >= due_at (cannot ship a cycle before its due date)."
    error_id: ERR_CYCLE_NOT_DUE
    http_status: 422
    applies_to: "POST /clinic/supply-cycles/{id}/ship"
  - priority: 15
    category: business_constraint
    check: "On recall close (MANDATORY), every affected order has a COMPLETED RECALL_REPROGRAM AdjustmentSession with applied_firmware_version == target_firmware_version."
    error_id: ERR_RECALL_NOT_REMEDIATED
    http_status: 422
    applies_to: "POST /clinic/recalls/{id}/close"
  - priority: 16
    category: business_constraint
    check: "On RECALL_REPROGRAM adjustment, applied_firmware_version must equal the referenced RecallNotice.target_firmware_version."
    error_id: ERR_FIRMWARE_MISMATCH
    http_status: 422
    applies_to: "POST /clinic/orders/{id}/adjustments"
  - priority: 17
    category: business_constraint
    check: "DeviceModel.model_code unique among non-DISCONTINUED models on create."
    error_id: ERR_DUPLICATE_MODEL_CODE
    http_status: 409
    applies_to: "POST /clinic/device-models"
  - priority: 18
    category: business_fiscal
    check: "On purchase with allowance, AllowanceBenefit.status must be ACTIVE (not EXHAUSTED/EXPIRED)."
    error_id: ERR_BENEFIT_INACTIVE
    http_status: 422
    applies_to: "POST /clinic/orders/{id}/purchase"
  - priority: 19
    category: business_constraint
    check: "OCC: expected_<parent>_version equals current parent version on guarded writes."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clinic/warranty-claims/{id}/replace, POST /clinic/recalls/{id}/issue"
  - priority: 20
    category: business_constraint
    check: "Request body fields satisfy type/enum/range constraints declared in §1.1 (e.g. ear_count in {1,2}, cadence_days in {30,60,90})."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 21
    category: business_constraint
    check: "Pagination params in range: 1 <= limit <= 100 and offset >= 0 on list endpoints."
    error_id: ERR_VALIDATION_LIMIT
    http_status: 422
    applies_to: "all GET list endpoints"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:
  # ---- Patients ----
  - method: POST
    path: "/clinic/patients"
    description: "Register a patient."
    roles: [ClinicAdmin, BillingClerk]
    code: 201
    input: [full_name, date_of_birth, "insurer_name?"]
    output: Patient
    side_effects: ["create Patient status=ACTIVE"]
  - method: GET
    path: "/clinic/patients/{id}"
    description: "Fetch a patient."
    roles: [ClinicAdmin, BillingClerk, Audiologist, Patient]
    code: 200
    input: []
    output: Patient
    side_effects: []
  - method: GET
    path: "/clinic/patients"
    description: "List patients."
    roles: [ClinicAdmin, BillingClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  # ---- Device models (catalog) ----
  - method: POST
    path: "/clinic/device-models"
    description: "Create a device model."
    roles: [ClinicAdmin]
    code: 201
    input: [model_code, name, list_price_cents, restock_fee_cents, min_severity, firmware_version, warranty_months]
    output: DeviceModel
    side_effects: ["uniqueness check on model_code"]
  - method: GET
    path: "/clinic/device-models/{id}"
    description: "Fetch a device model."
    roles: [ClinicAdmin, BillingClerk, Audiologist]
    code: 200
    input: []
    output: DeviceModel
    side_effects: []
  - method: GET
    path: "/clinic/device-models"
    description: "List device models."
    roles: [ClinicAdmin, BillingClerk, Audiologist]
    code: 200
    input: ["status?", "min_severity?", "limit?", "offset?"]
    output: DeviceModel[]
    side_effects: []
  - method: PATCH
    path: "/clinic/device-models/{id}"
    description: "Edit a device model's firmware_version or list_price_cents (bumps version)."
    roles: [ClinicAdmin]
    code: 200
    input: ["firmware_version?", "list_price_cents?", "status?"]
    output: DeviceModel
    side_effects: ["increments DeviceModel.version by 1"]

  # ---- Allowance benefits ----
  - method: POST
    path: "/clinic/allowance-benefits"
    description: "Grant an allowance benefit pool to a patient."
    roles: [BillingClerk, ClinicAdmin]
    code: 201
    input: [patient_id, plan_name, total_allowance_cents, per_device_cap_cents, coinsurance_pct, period_end]
    output: AllowanceBenefit
    side_effects: ["create AllowanceBenefit status=ACTIVE consumed_allowance_cents=0"]
  - method: GET
    path: "/clinic/allowance-benefits/{id}"
    description: "Fetch a benefit pool (consumed_allowance_cents reflects current ledger)."
    roles: [BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: []
    output: AllowanceBenefit
    side_effects: []
  - method: GET
    path: "/clinic/allowance-benefits"
    description: "List/filter benefit pools by patient."
    roles: [BillingClerk, ClinicAdmin]
    code: 200
    input: ["patient_id?", "status?", "limit?", "offset?"]
    output: AllowanceBenefit[]
    side_effects: []

  # ---- Hearing evaluations ----
  - method: POST
    path: "/clinic/evaluations"
    description: "Create a DRAFT hearing evaluation."
    roles: [Audiologist]
    code: 201
    input: [patient_id, audiologist_user_id, pure_tone_avg_db]
    output: HearingEvaluation
    side_effects: ["create HearingEvaluation status=DRAFT"]
  - method: POST
    path: "/clinic/evaluations/{id}/finalize"
    description: "Finalize an evaluation; classifies severity and supersedes any prior FINALIZED eval for the patient."
    roles: [Audiologist]
    code: 200
    input: []
    output: HearingEvaluation
    side_effects:
      - "compute severity, is_pediatric, candidate"
      - "supersede prior FINALIZED evaluation for same patient (cascade)"
  - method: GET
    path: "/clinic/evaluations/{id}"
    description: "Fetch an evaluation."
    roles: [Audiologist, BillingClerk, ClinicAdmin]
    code: 200
    input: []
    output: HearingEvaluation
    side_effects: []
  - method: GET
    path: "/clinic/patients/{id}/evaluations"
    description: "List a patient's evaluations (FK reverse-reachability for HearingEvaluation.patient_id)."
    roles: [Audiologist, BillingClerk, ClinicAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: HearingEvaluation[]
    side_effects: []

  # ---- Fitting orders ----
  - method: POST
    path: "/clinic/orders"
    description: "Create a DRAFT fitting order."
    roles: [Audiologist]
    code: 201
    input: [patient_id, evaluation_id, device_model_id, ear_count, "allowance_benefit_id?"]
    output: FittingOrder
    side_effects: ["create FittingOrder status=DRAFT"]
  - method: GET
    path: "/clinic/orders/{id}"
    description: "Fetch a fitting order with computed financial fields."
    roles: [Audiologist, BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: []
    output: FittingOrder
    side_effects: []
  - method: GET
    path: "/clinic/patients/{id}/orders"
    description: "List a patient's fitting orders (FK reverse-reachability for FittingOrder.patient_id)."
    roles: [Audiologist, BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FittingOrder[]
    side_effects: []
  - method: GET
    path: "/clinic/orders"
    description: "List/filter orders (reverse-reachability for evaluation_id, device_model_id, allowance_benefit_id)."
    roles: [Audiologist, BillingClerk, ClinicAdmin]
    code: 200
    input: ["evaluation_id?", "device_model_id?", "allowance_benefit_id?", "status?", "limit?", "offset?"]
    output: FittingOrder[]
    side_effects: []
  - method: POST
    path: "/clinic/orders/{id}/start-trial"
    description: "Begin the fitting trial (DRAFT->TRIAL)."
    roles: [Audiologist]
    code: 200
    input: []
    output: FittingOrder
    side_effects: ["set trial_started_at, trial_deadline_at"]
  - method: POST
    path: "/clinic/orders/{id}/purchase"
    description: "Convert trial to purchase (TRIAL->PURCHASED); applies allowance and posts ledger."
    roles: [BillingClerk]
    code: 200
    input: []
    output: FittingOrder
    side_effects:
      - "snapshot gross_price_cents, fitted_firmware_version"
      - "compute allowance_applied_cents, patient_due_cents"
      - "append ORDER_PURCHASE and ALLOWANCE_APPLIED ledger entries"
      - "recompute AllowanceBenefit.consumed_allowance_cents; maybe EXHAUSTED"
  - method: POST
    path: "/clinic/orders/{id}/return"
    description: "Return within trial window (TRIAL/PURCHASED->RETURNED); refund + allowance release."
    roles: [BillingClerk]
    code: 200
    input: []
    output: FittingOrder
    side_effects:
      - "compute refund_cents"
      - "append ORDER_RETURN ledger entry"
      - "release allowance; maybe reactivate AllowanceBenefit"
  - method: POST
    path: "/clinic/orders/{id}/activate-warranty"
    description: "Finalize sale once trial window closes (PURCHASED->WARRANTY_ACTIVE)."
    roles: [BillingClerk]
    code: 200
    input: []
    output: FittingOrder
    side_effects: []
  - method: POST
    path: "/clinic/orders/{id}/cancel"
    description: "Cancel a DRAFT order (DRAFT->CANCELLED)."
    roles: [Audiologist]
    code: 200
    input: []
    output: FittingOrder
    side_effects: []

  # ---- Adjustment sessions ----
  - method: POST
    path: "/clinic/orders/{id}/adjustments"
    description: "Record an adjustment/reprogramming session on a WARRANTY_ACTIVE order."
    roles: [Audiologist]
    code: 201
    input: [audiologist_user_id, reason, "applied_firmware_version?", "recall_notice_id?"]
    output: AdjustmentSession
    side_effects: ["create AdjustmentSession status=COMPLETED"]
  - method: GET
    path: "/clinic/orders/{id}/adjustments"
    description: "List adjustment sessions for an order (FK reverse-reachability for AdjustmentSession.fitting_order_id)."
    roles: [Audiologist, BillingClerk, ClinicAdmin]
    code: 200
    input: ["reason?", "status?", "limit?", "offset?"]
    output: AdjustmentSession[]
    side_effects: []

  # ---- Warranty claims ----
  - method: POST
    path: "/clinic/orders/{id}/warranty-claims"
    description: "Submit a warranty claim against a WARRANTY_ACTIVE order."
    roles: [BillingClerk, Patient]
    code: 201
    input: [claim_type, incident_date, assessed_value_cents]
    output: WarrantyClaim
    side_effects: ["create WarrantyClaim status=SUBMITTED"]
  - method: GET
    path: "/clinic/warranty-claims/{id}"
    description: "Fetch a warranty claim."
    roles: [BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: GET
    path: "/clinic/orders/{id}/warranty-claims"
    description: "List warranty claims for an order (FK reverse-reachability for WarrantyClaim.fitting_order_id)."
    roles: [BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: ["claim_type?", "status?", "limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []
  - method: POST
    path: "/clinic/warranty-claims/{id}/approve"
    description: "Approve a SUBMITTED/APPEALED claim; computes settlement."
    roles: [BillingClerk]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["compute deductible_cents, clinic_cost_cents"]
  - method: POST
    path: "/clinic/warranty-claims/{id}/deny"
    description: "Deny a SUBMITTED/APPEALED claim."
    roles: [BillingClerk]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/clinic/warranty-claims/{id}/appeal"
    description: "Patient appeals a DENIED claim (DENIED->APPEALED)."
    roles: [Patient]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []
  - method: POST
    path: "/clinic/warranty-claims/{id}/replace"
    description: "Fulfil an APPROVED claim with a replacement (APPROVED->REPLACED); posts deductible ledger. OCC-guarded."
    roles: [BillingClerk]
    code: 200
    input: [expected_warranty_claim_version]
    output: WarrantyClaim
    side_effects:
      - "append WARRANTY_DEDUCTIBLE ledger entry"
      - "if LOSS: refresh order.fitted_firmware_version to current model firmware"
      - "increments WarrantyClaim.version by 1"

  # ---- Supply subscriptions ----
  - method: POST
    path: "/clinic/subscriptions"
    description: "Create an ACTIVE supply subscription and schedule its first SupplyCycle."
    roles: [BillingClerk, Patient]
    code: 201
    input: [patient_id, fitting_order_id, cadence_days, unit_price_cents]
    output: SupplySubscription
    side_effects: ["set started_at; create SupplyCycle cycle_index=1 SCHEDULED"]
  - method: GET
    path: "/clinic/subscriptions/{id}"
    description: "Fetch a subscription with computed cycles_fulfilled and lifetime_billed_cents."
    roles: [BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: []
    output: SupplySubscription
    side_effects: []
  - method: GET
    path: "/clinic/patients/{id}/subscriptions"
    description: "List a patient's subscriptions (FK reverse-reachability for SupplySubscription.patient_id)."
    roles: [BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SupplySubscription[]
    side_effects: []
  - method: GET
    path: "/clinic/subscriptions"
    description: "List/filter subscriptions (reverse-reachability for fitting_order_id)."
    roles: [BillingClerk, ClinicAdmin]
    code: 200
    input: ["fitting_order_id?", "patient_id?", "status?", "limit?", "offset?"]
    output: SupplySubscription[]
    side_effects: []
  - method: POST
    path: "/clinic/subscriptions/{id}/pause"
    description: "Pause an ACTIVE subscription (ACTIVE->PAUSED)."
    roles: [Patient]
    code: 200
    input: []
    output: SupplySubscription
    side_effects: []
  - method: POST
    path: "/clinic/subscriptions/{id}/resume"
    description: "Resume a PAUSED subscription (PAUSED->ACTIVE)."
    roles: [Patient]
    code: 200
    input: []
    output: SupplySubscription
    side_effects: []
  - method: POST
    path: "/clinic/subscriptions/{id}/cancel"
    description: "Cancel a subscription; skips all SCHEDULED cycles."
    roles: [Patient]
    code: 200
    input: []
    output: SupplySubscription
    side_effects: ["all SCHEDULED cycles -> SKIPPED"]
  - method: POST
    path: "/clinic/subscriptions/{id}/cycles"
    description: "Schedule the next SupplyCycle for a subscription (cycle_index = max+1)."
    roles: [BillingClerk, ClinicAdmin]
    code: 201
    input: []
    output: SupplyCycle
    side_effects: ["create SupplyCycle next cycle_index SCHEDULED; compute due_at"]

  # ---- Supply cycles ----
  - method: GET
    path: "/clinic/supply-cycles/{id}"
    description: "Fetch a supply cycle."
    roles: [BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: []
    output: SupplyCycle
    side_effects: []
  - method: GET
    path: "/clinic/subscriptions/{id}/cycles"
    description: "List a subscription's cycles (FK reverse-reachability for SupplyCycle.subscription_id)."
    roles: [BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SupplyCycle[]
    side_effects: []
  - method: POST
    path: "/clinic/supply-cycles/{id}/ship"
    description: "Ship a due cycle (SCHEDULED->SHIPPED); bills the cycle."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: SupplyCycle
    side_effects:
      - "compute billed_cents"
      - "append SUPPLY_BILLING ledger entry"
      - "recompute subscription cycles_fulfilled, lifetime_billed_cents"
  - method: POST
    path: "/clinic/supply-cycles/{id}/skip"
    description: "Skip a scheduled cycle (SCHEDULED->SKIPPED)."
    roles: [ClinicAdmin, Patient]
    code: 200
    input: []
    output: SupplyCycle
    side_effects: []

  # ---- Recalls ----
  - method: POST
    path: "/clinic/recalls"
    description: "Create a DRAFT recall notice for a model+firmware."
    roles: [ClinicAdmin]
    code: 201
    input: [device_model_id, affected_firmware_version, target_firmware_version, severity_level]
    output: RecallNotice
    side_effects: ["create RecallNotice status=DRAFT"]
  - method: POST
    path: "/clinic/recalls/{id}/issue"
    description: "Issue a recall; scans and counts affected WARRANTY_ACTIVE orders. OCC-guarded."
    roles: [ClinicAdmin]
    code: 200
    input: [expected_recall_notice_version]
    output: RecallNotice
    side_effects: ["set affected_order_count", "increments RecallNotice.version by 1"]
  - method: POST
    path: "/clinic/recalls/{id}/close"
    description: "Close an issued recall once all affected orders are remediated."
    roles: [ClinicAdmin]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []
  - method: GET
    path: "/clinic/recalls/{id}"
    description: "Fetch a recall notice."
    roles: [ClinicAdmin, Audiologist, BillingClerk]
    code: 200
    input: []
    output: RecallNotice
    side_effects: []
  - method: GET
    path: "/clinic/recalls"
    description: "List/filter recalls (reverse-reachability for device_model_id)."
    roles: [ClinicAdmin, Audiologist, BillingClerk]
    code: 200
    input: ["device_model_id?", "status?", "severity_level?", "limit?", "offset?"]
    output: RecallNotice[]
    side_effects: []
  - method: GET
    path: "/clinic/recalls/{id}/adjustments"
    description: "List the RECALL_REPROGRAM adjustment sessions tied to this recall (FK reverse-reachability for AdjustmentSession.recall_notice_id)."
    roles: [ClinicAdmin, Audiologist, BillingClerk]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: AdjustmentSession[]
    side_effects: []

  # ---- Ledger ----
  - method: GET
    path: "/clinic/patients/{id}/ledger"
    description: "List a patient's ledger entries (FK reverse-reachability for LedgerEntry.patient_id), chronological by created_at."
    roles: [BillingClerk, ClinicAdmin, Patient]
    code: 200
    input: ["source_kind?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  # ---- Test-driving: clock ----
  - method: POST
    path: "/clinic/_clock/set"
    description: "Set the server's current UTC clock (test-driving)."
    roles: [ClinicAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock now = to_iso8601"]

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid auth headers or unknown role."
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for the endpoint, or Patient acting on a resource it does not own."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource (path or body FK) does not exist."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, wrong type, enum/range violation (ear_count, cadence_days, coinsurance_pct, etc.)."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not defined from the resource's current state."
  - id: ERR_DUPLICATE_MODEL_CODE
    http: 409
    condition: "model_code already used by a non-DISCONTINUED DeviceModel."
  - id: ERR_EVALUATION_PATIENT_MISMATCH
    http: 422
    condition: "start-trial: evaluation.patient_id != order.patient_id."
  - id: ERR_NOT_A_CANDIDATE
    http: 422
    condition: "start-trial: referenced evaluation.candidate == false (severity NORMAL)."
  - id: ERR_DEVICE_NOT_INDICATED
    http: 422
    condition: "start-trial: DeviceModel.min_severity rank exceeds evaluation.severity rank."
  - id: ERR_TRIAL_EXPIRED
    http: 422
    condition: "purchase: clock now > trial_deadline_at."
  - id: ERR_BENEFIT_EXPIRED
    http: 422
    condition: "purchase: clock date > AllowanceBenefit.period_end."
  - id: ERR_BENEFIT_INACTIVE
    http: 422
    condition: "purchase: AllowanceBenefit.status is EXHAUSTED or EXPIRED."
  - id: ERR_RETURN_WINDOW_CLOSED
    http: 422
    condition: "return of a PURCHASED order after clock now > trial_deadline_at."
  - id: ERR_TRIAL_NOT_CLOSED
    http: 422
    condition: "activate-warranty: clock now <= trial_deadline_at."
  - id: ERR_OUTSIDE_WARRANTY_WINDOW
    http: 422
    condition: "warranty approve: incident_date beyond purchase_date + warranty_months."
  - id: ERR_CYCLE_NOT_DUE
    http: 422
    condition: "supply-cycle ship: clock now < due_at."
  - id: ERR_FIRMWARE_MISMATCH
    http: 422
    condition: "RECALL_REPROGRAM adjustment: applied_firmware_version != RecallNotice.target_firmware_version."
  - id: ERR_RECALL_NOT_REMEDIATED
    http: 422
    condition: "recall close: a MANDATORY recall has affected orders without a matching COMPLETED RECALL_REPROGRAM session."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC: expected_<parent>_version != current parent version on replace/issue."
  - id: ERR_VALIDATION_LIMIT
    http: 422
    condition: "Pagination limit out of [1,100] or offset negative."

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: ClinicAdmin
    description: "Operations: catalog management, recalls, supply fulfillment, clock."
    identity: opaque
    exclusive_operations:
      - "POST /clinic/device-models"
      - "PATCH /clinic/device-models/{id}"
      - "POST /clinic/recalls"
      - "POST /clinic/recalls/{id}/issue"
      - "POST /clinic/recalls/{id}/close"
      - "POST /clinic/supply-cycles/{id}/ship"
      - "POST /clinic/_clock/set"
    shared_operations:
      - "POST /clinic/patients"
      - "POST /clinic/allowance-benefits"
      - "POST /clinic/subscriptions/{id}/cycles"
      - "POST /clinic/supply-cycles/{id}/skip"
      - "GET (most read endpoints)"
  - name: Audiologist
    description: "Clinical: evaluations, order creation/trial/cancel, adjustments."
    identity: opaque
    exclusive_operations:
      - "POST /clinic/evaluations"
      - "POST /clinic/evaluations/{id}/finalize"
      - "POST /clinic/orders"
      - "POST /clinic/orders/{id}/start-trial"
      - "POST /clinic/orders/{id}/cancel"
      - "POST /clinic/orders/{id}/adjustments"
    shared_operations:
      - "GET clinical read endpoints (patients, evaluations, orders, device-models, recalls, adjustments)"
  - name: BillingClerk
    description: "Financial: benefits, purchase, return, warranty financials, activate-warranty."
    identity: opaque
    exclusive_operations:
      - "POST /clinic/orders/{id}/purchase"
      - "POST /clinic/orders/{id}/return"
      - "POST /clinic/orders/{id}/activate-warranty"
      - "POST /clinic/warranty-claims/{id}/approve"
      - "POST /clinic/warranty-claims/{id}/deny"
      - "POST /clinic/warranty-claims/{id}/replace"
    shared_operations:
      - "POST /clinic/patients"
      - "POST /clinic/allowance-benefits"
      - "POST /clinic/orders/{id}/warranty-claims"
      - "POST /clinic/subscriptions"
      - "POST /clinic/subscriptions/{id}/cycles"
      - "GET financial read endpoints (ledger, benefits, claims, subscriptions)"
  - name: Patient
    description: "Self-service: appeal claims, manage own subscriptions, submit own warranty claims."
    identity: "entity_backed:Patient"
    exclusive_operations:
      - "POST /clinic/warranty-claims/{id}/appeal"
      - "POST /clinic/subscriptions/{id}/pause"
      - "POST /clinic/subscriptions/{id}/resume"
    shared_operations:
      - "POST /clinic/orders/{id}/warranty-claims (own orders)"
      - "POST /clinic/subscriptions (own)"
      - "POST /clinic/subscriptions/{id}/cancel (own)"
      - "POST /clinic/supply-cycles/{id}/skip (own)"
      - "GET own patient, orders, evaluations(view), benefits, ledger, claims, subscriptions, cycles"
