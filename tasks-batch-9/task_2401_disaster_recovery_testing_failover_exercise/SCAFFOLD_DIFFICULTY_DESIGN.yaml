            - "The RG-1 fixture of rto_variant_wall_clock_vs_net_execution exists with readiness 100.00 and posture READY."
            - "The clock stands at 2026-09-10T00:00:00Z and AST-DB1 (ASYNCHRONOUS) carries one observation with replication_lag_seconds 240 and unreplicated_txn_count 900."
            - "Exercise exP (COMPONENT_FAILOVER) has already completed failover against RG-1 while AST-DB1 was the only in-scope DATA_STORE."
            - "A second DATA_STORE AST-DB2 with replication_mode BATCH_SNAPSHOT, expected_txn_rate_per_minute 150 and an identical observation is then added to RG-1."
            - "Exercise exQ (COMPONENT_FAILOVER, window 2026-09-11T00:00:00Z - 06:00:00Z) is scoped on RG-1, approved, scheduled, started and carries one step execution."
