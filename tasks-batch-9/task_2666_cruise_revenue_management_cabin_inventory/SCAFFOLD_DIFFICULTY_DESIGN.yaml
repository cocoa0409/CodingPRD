            - "SailingInventory.${inv_ov}.booked_cabins == 1 and available_cabins == 0"
            - "SailingInventory.${inv_ia}.booked_cabins == 0 and effective_oversell_cabins == 4 and available_cabins == 64"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: fare_windows_may_touch_but_not_overlap
        grounds:
          - validations[priority=16].ERR_FARE_WINDOW_OVERLAP
          - entities.FareRule.fields.window_open_days_to_sail
          - entities.FareRule.fields.window_close_days_to_sail
        distinguishing_aspect: |
          Booking windows are half-open intervals [window_close, window_open) over days_to_sail,
          so two rules sharing an endpoint do NOT overlap while two that share any interior day
          do. Four sequential creations on the same (sailing, category) probe every case:
          touching below (120), interior overlap (90..30 against 120..60), touching above (60)
          and touching on the open side (400..365). An implementation using closed intervals
          rejects three of the four legal creations.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing FWO-2701 in PLANNED with an IA allotment of 10 cabins."
            - "One fare rule already covers days_to_sail [120, 365)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "FWO-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 20, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_v: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_v}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_v}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
              captures: { fr_1: $.data.id }
          trigger:
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_v}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 120, window_close_days_to_sail: 60, base_lower_berth_fare_cents: 219995, third_berth_fare_cents: 69997, fourth_berth_fare_cents: 54997 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_v}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 90, window_close_days_to_sail: 30, base_lower_berth_fare_cents: 239995, third_berth_fare_cents: 74997, fourth_berth_fare_cents: 59997 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_v}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 60, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 259995, third_berth_fare_cents: 79997, fourth_berth_fare_cents: 64997 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_v}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 400, window_close_days_to_sail: 365, base_lower_berth_fare_cents: 179995, third_berth_fare_cents: 59997, fourth_berth_fare_cents: 44997 }
              as: RevenueManager
          assert:
            - "the 120..60 creation returns 201 (it touches the existing window at 120 without sharing a day)"
            - "the 90..30 creation returns 422 with data.error_id == ERR_FARE_WINDOW_OVERLAP (it shares days 60..89 with 120..60)"
            - "the 60..0 creation returns 201 (touching at 60)"
            - "the 400..365 creation returns 201 (touching at 365 on the open side)"
            - "GET /fare-rules?sailing_id=${sail_v}&cabin_category_id=${cat_ia} returns total_count == 4"
            - "each stored FareRule has bookings_pinned_count == 0"

      - name: promotion_cadence_requires_seven_day_separation
        grounds:
          - validations[priority=16].ERR_PROMO_CADENCE_CONFLICT
          - validations[priority=16].constants.PROMO_CADENCE_GAP_DAYS
          - concurrency_rules.promotion-create-stale-sailing
        distinguishing_aspect: |
          Promotions must be separated by a GAP rather than merely be non-overlapping, so the
          conflict region extends past the end of the existing campaign: against a campaign
          ending 2026-09-10 a start on 09-15 (gap 5) and on 09-16 (gap 6) are both refused while
          09-17 (gap 7) is accepted. This is the mirror image of the fare-window rule, where
          touching is legal - the same temporal-overlap machinery with an inverted tolerance,
          and each attempt also carries the parent Sailing's version, which the refusals must
          not bump.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing PCD-2701 OPEN_FOR_SALE with an IA allotment of 10 cabins and a 730..0 fare window."
            - "One SCHEDULED promotion EARLY covers the closed interval 2026-09-01..2026-09-10."
            - "The Sailing version after that creation is re-read and captured as ${sv2}, because POST /promotions bumps the parent Sailing's version."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "PCD-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 20, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_p2: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_p2}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 0 }
              as: RevenueManager
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_p2}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail_p2}/open-for-sale"
              payload: {}
              as: RevenueManager
              captures: { sv1: $.data.version }
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_p2}", code: "EARLY", audience: "GENERAL", discount_pct: 0.10, starts_on: "2026-09-01T00:00:00Z", ends_on: "2026-09-10T00:00:00Z", max_redemptions: 25, expected_sailing_version: "${sv1}" }
              as: RevenueManager
              captures: { promo_early: $.data.id }
            - call: "GET /sailings/${sail_p2}"
              payload: {}
              as: RevenueManager
              captures: { sv2: $.data.version }
          trigger:
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_p2}", code: "GAP5", audience: "GENERAL", discount_pct: 0.12, starts_on: "2026-09-15T00:00:00Z", ends_on: "2026-09-20T00:00:00Z", max_redemptions: 25, expected_sailing_version: "${sv2}" }
              as: RevenueManager
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_p2}", code: "GAP6", audience: "GENERAL", discount_pct: 0.12, starts_on: "2026-09-16T00:00:00Z", ends_on: "2026-09-21T00:00:00Z", max_redemptions: 25, expected_sailing_version: "${sv2}" }
              as: RevenueManager
            - call: "POST /promotions"
              payload: { sailing_id: "${sail_p2}", code: "GAP7", audience: "GENERAL", discount_pct: 0.12, starts_on: "2026-09-17T00:00:00Z", ends_on: "2026-09-22T00:00:00Z", max_redemptions: 25, expected_sailing_version: "${sv2}" }
              as: RevenueManager
          assert:
            - "the GAP5 attempt returns 422 with data.error_id == ERR_PROMO_CADENCE_CONFLICT"
            - "the GAP6 attempt returns 422 with data.error_id == ERR_PROMO_CADENCE_CONFLICT"
            - "the GAP7 attempt returns 201 with status SCHEDULED and redemption_count == 0"
            - "Sailing.${sail_p2}.version == ${sv2} + 1 (only the accepted creation bumps it; the two refusals do not)"
            - "GET /promotions?sailing_id=${sail_p2} returns total_count == 2 with codes EARLY and GAP7"
            - "Promotion.${promo_early}.status == SCHEDULED and ends_on == 2026-09-10T00:00:00Z"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: settled_cash_retained_equals_final_penalty
        grounds:
          - calculations.cancellation_settlement
          - state_machines.Booking.PENALTY_ASSESSED_to_REFUNDED
          - entities.Booking.fields.refund_cents
        distinguishing_aspect: |
          The money invariant of a cancellation: after settlement, cash retained by the line -
          the signed sum of every PaymentEvent, i.e. amount_paid_cents minus refund_cents - must
          equal cancellation_penalty_cents EXACTLY, even though the clock advanced between the
          cancel and the settlement so that the FINAL penalty (284993 at days_to_sail 59) is
          harsher than the PROVISIONAL quote (189995 at days_to_sail 60). The stale quote must
          survive untouched as an audit figure while the refund absorbs the whole difference: any
          double-application of a penalty band, or any rounding taken twice, breaks the identity.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing AUR-2701 OPEN_FOR_SALE with the 365..120 IA fare window at base 189995."
            - "One booking of 2 adults: net_ticket_cents 379990, deposit_due_cents 75998, final_payment_due_date 2026-10-27T17:00:00Z."
            - "The deposit of 75998 is paid, then the clock moves to 2026-10-27T17:00:00Z and the final payment of 303992 is posted, so amount_paid_cents == 379990 and payment_status == PAID_IN_FULL."
            - "The clock then moves to 2026-11-11T17:00:00Z, days_to_sail 60, the first day of the 0.50 penalty band."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "AUR-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail1: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_ia: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 365, window_close_days_to_sail: 120, base_lower_berth_fare_cents: 189995, third_berth_fare_cents: 64997, fourth_berth_fare_cents: 49997 }
              as: RevenueManager
            - call: "POST /sailings/${sail1}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_none: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail1}", cabin_category_id: "${cat_ia}", guest_id: "${g_none}", occupancy_adults: 2 }
              as: ReservationAgent
              captures: { bk_s: $.data.id }
            - call: "POST /bookings/${bk_s}/payments"
              payload: { kind: "DEPOSIT", amount_cents: 75998 }
              as: ReservationAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-27T17:00:00Z" }
              as: RevenueManager
            - call: "POST /bookings/${bk_s}/payments"
              payload: { kind: "FINAL_PAYMENT", amount_cents: 303992 }
              as: ReservationAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-11T17:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /bookings/${bk_s}/cancel"
              payload: { reason: "GUEST_REQUEST" }
              as: ReservationAgent
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-12T17:00:00Z" }
              as: RevenueManager
            - call: "POST /bookings/${bk_s}/settle-cancellation"
              payload: {}
              as: RevenueManager
          assert:
            - "at the cancel instant Booking.${bk_s}.provisional_penalty_cents == 189995 (0.50 band at days_to_sail 60) and cancellation_penalty_cents == null and refund_cents == null"
            - "Booking.${bk_s}.booking_status == CANCELLED and payment_status == PENALTY_ASSESSED after the cancel"
            - "after settlement Booking.${bk_s}.cancellation_penalty_cents == 284993 (0.75 band at days_to_sail 59)"
            - "Booking.${bk_s}.provisional_penalty_cents == 189995 still (the quote is never retroactively corrected)"
            - "Booking.${bk_s}.refund_cents == 94997 and payment_status == REFUNDED and settled_at == 2026-11-12T17:00:00Z"
            - "invariant: amount_paid_cents - refund_cents == cancellation_penalty_cents, i.e. 379990 - 94997 == 284993"
            - "GET /bookings/${bk_s}/payment-events returns total_count == 3 with kinds [DEPOSIT, FINAL_PAYMENT, REFUND] and amount_cents [75998, 303992, 94997]"
            - "SailingInventory.${inv_ia}.booked_cabins == 0 and available_cabins == 64"
            - "Sailing.${sail1}.gross_ticket_revenue_cents == 0 and paid_in_full_bookings_count == 0"

      - name: inventory_capacity_identity_across_group_and_booking_moves
        grounds:
          - calculations.oversell_availability
          - entities.SailingInventory.fields.available_cabins
          - state_machines.GroupBlock.TENTATIVE_to_PARTIALLY_RELEASED
          - state_machines.Booking.OPTION_to_CANCELLED
        distinguishing_aspect: |
          The structural invariant of an allotment: booked_cabins + group_held_cabins +
          available_cabins == physical_cabins + effective_oversell_cabins must hold after EVERY
          move, and the sequence deliberately shuffles a cabin between all three buckets - a
          group fence, a booking drawn from that fence, a booking drawn from open inventory, an
          attrition release and two cancellations. The group-drawn booking is the trap: it moves
          a cabin from group_held to booked without changing the total, and cancelling it must
          return the cabin to the fence rather than to open availability.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; sailing INV-2701 OPEN_FOR_SALE, 40 lower berths over 4 nights."
            - "One guarantee IA allotment with physical_cabins 10 and oversell_allowance 3, so the cap is ceil(10 * 0.10) == 1, effective_oversell_cabins == min(3, 1) == 1 and total capacity is 11."
            - "A single 730..0 fare window at base 50000, so each single-adult booking prices at net_ticket_cents 87500 with deposit_due_cents 25000."
            - "A TENTATIVE group block holds 3 cabins with release_policy ATTRITION_50 and review_date 2026-08-16T00:00:00Z: booked 0 + held 3 + available 8 == 11."
            - "One booking draws on the block (picked_up_cabins 1, unpicked 2): booked 1 + held 2 + available 8 == 11."
            - "One booking draws on open inventory: booked 2 + held 2 + available 7 == 11."
            - "The clock then moves to 2026-08-16T00:00:00Z, the review date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: RevenueManager
            - call: "POST /cabin-categories"
              payload: { code: "IA", tier_rank: 1, max_occupancy: 4, is_guarantee: true, onboard_spend_lower_per_night_cents: 9000, onboard_spend_upper_per_night_cents: 6000 }
              as: RevenueManager
              captures: { cat_ia: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "INV-2701", embark_date: "2027-01-10T17:00:00Z", nights: 4, total_lower_berths: 40, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_n: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_n}", cabin_category_id: "${cat_ia}", physical_cabins: 10, oversell_allowance: 3 }
              as: RevenueManager
              captures: { inv_n: $.data.id }
            - call: "POST /fare-rules"
              payload: { sailing_id: "${sail_n}", cabin_category_id: "${cat_ia}", window_open_days_to_sail: 730, window_close_days_to_sail: 0, base_lower_berth_fare_cents: 50000, third_berth_fare_cents: 20000, fourth_berth_fare_cents: 15000 }
              as: RevenueManager
            - call: "POST /sailings/${sail_n}/open-for-sale"
              payload: {}
              as: RevenueManager
            - call: "POST /group-blocks"
              payload: { sailing_id: "${sail_n}", cabin_category_id: "${cat_ia}", agency_name: "Meridian Travel", cabins_held: 3, review_date: "2026-08-16T00:00:00Z", release_policy: "ATTRITION_50" }
              as: GroupSalesAgent
              as_user_id: "gsa-001"
              captures: { blk_n: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_a: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Bo Chen", email: "bo@example.com", prior_sailings_count: 0 }
              as: ReservationAgent
              captures: { g_b: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_n}", cabin_category_id: "${cat_ia}", guest_id: "${g_a}", occupancy_adults: 1, group_block_id: "${blk_n}" }
              as: ReservationAgent
              captures: { bk_grp: $.data.id }
            - call: "POST /bookings"
              payload: { sailing_id: "${sail_n}", cabin_category_id: "${cat_ia}", guest_id: "${g_b}", occupancy_adults: 1 }
              as: ReservationAgent
              captures: { bk_free: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-16T00:00:00Z" }
              as: RevenueManager
          trigger:
            - call: "POST /group-blocks/${blk_n}/review"
              payload: {}
              as: GroupSalesAgent
              as_user_id: "gsa-002"
            - call: "POST /bookings/${bk_free}/cancel"
              payload: { reason: "GUEST_REQUEST" }
              as: ReservationAgent
            - call: "POST /bookings/${bk_grp}/cancel"
              payload: { reason: "GUEST_REQUEST" }
              as: ReservationAgent
          assert:
            - "SailingInventory.${inv_n}.effective_oversell_cabins == 1 at every step (capacity 11)"
            - "after the review: GroupBlock.${blk_n}.cabins_held == 2, released_cabins_total == 1, status == PARTIALLY_RELEASED; SailingInventory.${inv_n}.booked_cabins == 2, group_held_cabins == 1, available_cabins == 8 (2 + 1 + 8 == 11)"
            - "after cancelling the open-inventory booking: booked_cabins == 1, group_held_cabins == 1, available_cabins == 9 (1 + 1 + 9 == 11)"
            - "after cancelling the group-drawn booking: GroupBlock.${blk_n}.picked_up_cabins == 0 and cabins_held == 2, so group_held_cabins == 2, booked_cabins == 0 and available_cabins == 9 (0 + 2 + 9 == 11)"
            - "the released cabin never re-enters the group fence: GroupBlock.${blk_n}.cabins_held stays 2 and released_cabins_total stays 1 after both cancellations"
            - "SailingInventory.${inv_n}.waitlisted_bookings_count == 0 throughout (nothing was ever waitlisted, so no promotion runs)"
            - "Sailing.${sail_n}.lower_berths_sold == 0, occupancy_pct == 0.00, gross_ticket_revenue_cents == 0 and inventory_posture == OPEN at the end"
            - "Booking.${bk_grp}.provisional_penalty_cents == 0 and Booking.${bk_free}.provisional_penalty_cents == 0 (days_to_sail 147 is inside the penalty-free window)"
