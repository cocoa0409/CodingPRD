              as_user_id: "${br_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "HTTP status == 409"
            - "${err_id} == ERR_PARALLEL_SET_INCOMPLETE"
            - "Reel.${ra_id}.allocated_length_ft == 0 and Reel.${rb_id}.allocated_length_ft == 0"
            - "SalesOrder.${so_id}.fulfillment_status == PENDING_ALLOCATION"
            - "GET /allocations?sales_order_id=${so_id} returns 0 rows"

      - name: parallel_set_takes_three_distinct_best_fit_reels_from_one_lot
        claim_type: Satisfaction to Pass
        grounds:
          - calculations.reel_allocation_plan
          - entities.OrderLine.fields.lot_code
