              payload: { action: "RECEIVE", received_lead_kg: 300.000 }
              as: WarrantyAdministrator
              captures: { a_credit_at_receive: $.data.core_credit_issued_cents }
            - call: "POST /battery-units/${unit_a_id}/core-return/transitions"
              payload: { action: "RECYCLE", transition_note: "smelted, credit issued" }
              as: WarrantyAdministrator
              captures: { a_status: $.data.core_status, a_credit: $.data.core_credit_issued_cents }
            - call: "GET /plants/${plant_id}/lead-mass-balance"
              payload: {}
              as: PlantAdmin
              captures: { c1_mid_liab: $.data.core_deposit_liability_cents }
            - call: "POST /battery-units/${unit_b_id}/core-return"
              payload: { core_manifest_number: "CM-0102" }
              as: WarrantyAdministrator
            - call: "POST /battery-units/${unit_b_id}/core-return/transitions"
              payload: { action: "SHIP", transition_note: "hauler picked up" }
              as: WarrantyAdministrator
            - call: "POST /battery-units/${unit_b_id}/core-return/transitions"
              payload: { action: "REJECT", transition_note: "case cracked, electrolyte lost" }
              as: WarrantyAdministrator
              captures: { b_status: $.data.core_status, b_credit: $.data.core_credit_issued_cents }
            - call: "POST /battery-units/${unit_b_id}/core-return/transitions"
              payload: { action: "RECYCLE", transition_note: "second attempt at a credit" }
              as: WarrantyAdministrator
              expect_error: ERR_CORE_STATE_INVALID
            - call: "GET /plants/${plant_id}/lead-mass-balance"
              payload: {}
              as: PlantAdmin
              captures: { c1_end_liab: $.data.core_deposit_liability_cents, c1_end_field: $.data.lead_in_field_kg, c1_end_rec: $.data.lead_recycled_kg, c1_end_var: $.data.lead_mass_variance_kg }
          assert:
            - "${lot_state} == RELEASED and ${c1_open_liab} == 25000   # two LEAD_ACID shipments at CORE_DEPOSIT_CENTS 12500 each"
            - "${a_credit_at_receive} == 0   # RECEIVE moves MASS only; the deposit is still owed at that point"
            - "${a_status} == RECYCLED and ${a_credit} == 12500 and ${c1_mid_liab} == 12500   # the refund route closes exactly one deposit"
            - "${b_status} == REJECTED and ${b_credit} == 0   # the forfeit route issues nothing"
            - "${c1_end_liab} == 0   # both routes closed the liability to the cent, from opposite economics"
            - "the sum of core_credit_issued_cents over both units is 12500, NOT 25000 - liability is conserved but cash is not"
            - "the second RECYCLE attempt on ${unit_b_id} is 409 ERR_CORE_STATE_INVALID, so a forfeited deposit can never be double-refunded"
            - "${c1_end_field} == 0.000 and ${c1_end_rec} == 600.000 and ${c1_end_var} == 0.000   # the mass account closes independently of the money account"
