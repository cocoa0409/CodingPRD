              as: PipelineScheduler
          trigger:
            - call: "POST /pipeline/batch-tickets/${bt2_id}/inject"
              payload: { injected_bbl: 26100, measured_sulfur_ppm: 120, measured_rvp_psi: 14 }
              as: TerminalOperator
            - call: "POST /pipeline/batch-tickets/${bt2_id}/inject"
              payload: { injected_bbl: 26100, measured_sulfur_ppm: 120, measured_rvp_psi: 14 }
