  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: response_envelope_success_shape
        claim_type: standard_crud
        grounds: ["response_envelope"]
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, and data; list responses use response_type 'array' and expose limit/offset/total_count/has_more."
        test_recipe:
          setup: ["one seller exists"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Env Eve", contact_email: "eve@x.com" }
              as: BrokerOps
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /sellers/${s_id}/buy-offers"
              payload: {}
              as: BrokerOps
          assert:
            - "response has meta.api_request_id and meta.api_request_timestamp"
            - "response_type == 'array' and data == [] with total_count == 0 and has_more == false"

      - name: seller_offers_subresource_lists_only_own
        claim_type: standard_crud
        grounds: ["entities.BuyOffer.fields.seller_id"]
        distinguishing_aspect: "GET /sellers/{id}/buy-offers returns exactly that seller's offers; a second seller's offers never appear."
        test_recipe:
          setup: ["sellers A and B; A has one offer"]
          setup_api_calls:
            - call: "POST /sellers"
              payload: { name: "Sub Al", contact_email: "al@x.com" }
              as: BrokerOps
              captures: { sa_id: $.data.id }
            - call: "POST /sellers"
              payload: { name: "Sub Bo", contact_email: "bo@x.com" }
              as: BrokerOps
              captures: { sb_id: $.data.id }
            - call: "POST /buy-offers"
              payload: { seller_id: "${sa_id}", mpn: "LM317T", quantity: 3, ask_price_per_unit_cents: 4000 }
              as: Seller
              as_user_id: "${sa_id}"
              captures: { oa_id: $.data.id }
          trigger:
            - call: "GET /sellers/${sa_id}/buy-offers"
              payload: {}
              as: Seller
              as_user_id: "${sa_id}"
            - call: "GET /sellers/${sb_id}/buy-offers"
              payload: {}
              as: Seller
              as_user_id: "${sb_id}"
          assert:
            - "seller A list contains exactly [${oa_id}]"
            - "seller B list is empty"

      - name: snapshot_list_sorted_observed_at_desc
        claim_type: computed_read
        grounds: ["entities.MarketPriceSnapshot.fields.observed_at"]
