            - { call: "POST /plant/retail-audits", payload: { job_id: "${job}", retailer_code: "CLUB-A", orientation: "LENGTHWISE", case_w_cin: 1524, case_h_cin: 2540, case_d_cin: 9000, case_weight_g: 14000, cases_per_layer: 8, layers: 6, case_count: 48 }, as: KittingLead, captures: { aud: $.data.id, aud_verdict: $.data.verdict } }
            - { call: "POST /plant/retail-audits/${aud}/submit", payload: {}, as: KittingLead }
            - { call: "POST /plant/retail-audits/${aud}/certify", payload: {}, as: BrandQuality, as_user_id: "${cust}" }
            - { call: "POST /plant/jobs/${job}/complete", payload: {}, as: PlantAdmin, captures: { st2: $.data.status } }
