          The fee is a three-tier function of net_before_fee_cents, which is itself a function of the
          election and of whether the taxable amount cleared 20000 — so the fee depends on a
          two-stage composition, not on the gross. Four distributions on one account walk the whole
          lattice: DIRECT_ROLLOVER 1000000 sits exactly on FEE_TIER_HIGH_FLOOR_CENTS and pays 7500;
          CASH 600000 withholds 118253 and drops to the mid tier at 5000; CASH 24000 has taxable
