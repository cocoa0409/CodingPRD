              as: PropertyAccountant
              captures: { err_zero: $.data.error_id }
            - call: "POST /mgmt/properties/${p16_id}/vendor-contracts"
              payload: { vendor_name: "InvertedCo", service_type: "PEST", monthly_cost_cents: 10000, start_date: "2026-11-01T00:00:00Z", end_date: "2026-10-01T00:00:00Z" }
              as: PropertyAccountant
              captures: { err_inv: $.data.error_id }
            - call: "POST /mgmt/properties/${p16_id}/vendor-contracts"
              payload: { vendor_name: "ThinCo", service_type: "PEST", monthly_cost_cents: 10000, start_date: "2026-10-01T00:00:00Z", end_date: "2026-10-01T00:00:01Z" }
              as: PropertyAccountant
              captures: { v16_id: $.data.id }
          assert:
            - "Empty window (start == end) rejected with error_id == ERR_INVALID_REQUEST"
            - "Inverted window (start > end) rejected with error_id == ERR_INVALID_REQUEST"
            - "One-second window accepted: VendorContract.${v16_id}.assignment_status == PENDING"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: claim_reserve_hold_and_release_conserves_distributable_cash
        grounds:
          - state_machines.Claim.OPEN_to_UNDER_REVIEW
          - state_machines.Claim.UNDER_REVIEW_to_SETTLED
          - calculations.owner_distribution
        distinguishing_aspect: |
          Conserved quantity: distributable cash. Reserving R cents
          (begin_review) reduces distributable by exactly R; settling for A
          cents with owner share S (indemnified_by OWNER -> S == A) releases
          the R hold and deducts S, so net change in distributable across the
          forward+compensating pair is exactly -S, never -R-S or -R.
        test_recipe:
          setup:
            - "Owner O17 with distribution_day_of_month == 28; Agreement AG17 ACTIVE (min fee 250000, pct 0.04, threshold 12000000, rate 0.10); Property P17 MANAGED (zero-balance onboarding, one resident)"
            - "Ledger: RENT 60000000 collected 2026-09 (cash 60000000); statement SM17 (2026-09 CASH) with a DRAFT MONTHLY_OWNER report RP17; clock 2026-10-01T00:00:00Z"
            - "Baseline: closing SM17 debits fee 2400000 (0.04 * 60000000; incentive on 60000000-12000000 = 4800000... see asserts) and generates RP17 with distribution D0"
            - "Claim C17 on P17: RESERVED 5000000, indemnified_by OWNER, incident 2026-09-05"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Conserve Owner LP", distribution_day_of_month: 28 }
              as: PortfolioManager
              captures: { o17_id: $.data.id }
            - call: "POST /mgmt/owners/${o17_id}/properties"
              payload: { name: "Conserve Property", unit_count: 400 }
              as: PortfolioManager
              captures: { p17_id: $.data.id }
            - call: "POST /mgmt/owners/${o17_id}/agreements"
              payload: { property_id: "${p17_id}", base_fee_pct: 0.04, minimum_monthly_fee_cents: 250000, incentive_threshold_egi_cents: 12000000, incentive_tier1_rate: 0.10, effective_date: "2026-08-01T00:00:00Z", term_end_date: "2027-07-31T00:00:00Z" }
              as: PortfolioManager
              captures: { ag17_id: $.data.id, ag17_v: $.data.version }
            - call: "POST /mgmt/agreements/${ag17_id}/activate"
              payload: { expected_agreement_version: "${ag17_v}" }
              as: PortfolioManager
            - call: "POST /mgmt/properties/${p17_id}/onboardings"
              payload: { prior_manager_name: "PriorCo", takeover_date: "2026-08-01T00:00:00Z", deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PortfolioManager
              captures: { ob17_id: $.data.id }
            - call: "POST /mgmt/properties/${p17_id}/residents"
              payload: { unit_label: "17A", full_name: "Res Seventeen", lease_end_date: "2027-07-31T00:00:00Z" }
              as: PropertyAccountant
              captures: { r17_id: $.data.id }
            - call: "POST /mgmt/onboardings/${ob17_id}/verify_resident_data"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob17_id}/import_ledger"
              payload: { deposits_received_cents: 0, prepaid_rent_cents: 0, delinquency_cents: 0 }
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob17_id}/begin_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob17_id}/complete_vendor_review"
              payload: {}
              as: PropertyAccountant
            - call: "POST /mgmt/onboardings/${ob17_id}/activate"
              payload: {}
              as: PortfolioManager
            - call: "POST /mgmt/properties/${p17_id}/ledger-entries"
              payload: { resident_id: "${r17_id}", kind: RENT, amount_cents: 60000000, accrual_month: "2026-09", collected_month: "2026-09" }
              as: PropertyAccountant
            - call: "POST /mgmt/properties/${p17_id}/claims"
              payload: { claim_type: RESIDENT_INCIDENT, reserved_amount_cents: 5000000, indemnified_by: OWNER, incident_date: "2026-09-05T00:00:00Z" }
              as: RiskOfficer
              captures: { c17_id: $.data.id }
            - call: "POST /mgmt/properties/${p17_id}/statements"
              payload: { period_month: "2026-09", basis: CASH }
              as: PropertyAccountant
              captures: { sm17_id: $.data.id }
            - call: "POST /mgmt/properties/${p17_id}/reports"
              payload: { period_month: "2026-09", package_type: MONTHLY_OWNER }
              as: PropertyAccountant
              captures: { rp17_id: $.data.id }
            - call: "POST /mgmt/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PortfolioManager
          trigger:
            - call: "POST /mgmt/claims/${c17_id}/begin_review"
              payload: {}
              as: RiskOfficer
              captures: { c17_v: $.data.version }
            - call: "POST /mgmt/statements/${sm17_id}/close"
              payload: {}
              as: PropertyAccountant
            - call: "GET /mgmt/reports/${rp17_id}"
              payload: {}
              as: PropertyAccountant
              captures: { rp17_dist_held: $.data.distribution_amount_cents }
            - call: "POST /mgmt/claims/${c17_id}/settle"
              payload: { amount_cents: 3000000, expected_claim_version: "${c17_v}" }
              as: RiskOfficer
            - call: "POST /mgmt/statements/${sm17_id}/restate"
              payload: {}
              as: PropertyAccountant
            - call: "GET /mgmt/reports/${rp17_id}"
              payload: {}
              as: PropertyAccountant
              captures: { rp17_dist_released: $.data.distribution_amount_cents }
          assert:
            - "Fee math pinned: base_fee = round(0.04 * 60000000) == 2400000; incentive = round(0.10 * (60000000 - 12000000)) == 4800000; management_fee_total_cents == 7200000"
            - "While reserve held: distributable == cash(60000000) - fees(7200000) - payroll(0) - floor(20000000) - holdback(0) - claim_holds(5000000) == 27800000 -> OwnerReportPackage.${rp17_id}.distribution_amount_cents == 27800000"
            - "After settle (owner share == 3000000) and restate: claim hold released, owner share deducted -> distribution_amount_cents == 60000000 - 7200000 - 20000000 - 3000000 == 29800000"
            - "Invariant: delta(distributable across hold+settle pair) == -3000000 == -(owner share), not -(5000000 + 3000000)"

      - name: suspend_resume_cycle_conserves_staffing_payroll_charge
        grounds:
          - state_machines.ManagementAgreement.ACTIVE_to_SUSPENDED
          - state_machines.ManagementAgreement.SUSPENDED_to_ACTIVE
          - calculations.staffing_cost_allocation
        distinguishing_aspect: |
          Different conserved quantity: monthly payroll_charge_cents. The
          forward action (suspend) zeroes the charge by cascading positions
          INACTIVE; the compensating action (resume) restores exactly the
          pre-suspension charge — a statement closed before suspension and a
          statement closed after resume MUST compute identical
          payroll_charge_cents == 570240, and the statement closed DURING
          suspension computes 0.
        test_recipe:
          setup:
            - "Owner O18; Agreements AG18a (P18a) and AG18b (P18b) ACTIVE; both properties MANAGED with zero-balance onboarding and one resident each"
            - "SP18a on P18a: 3000 cents/hr x 30 hr/wk, region R9; SP18b on P18b: 3000 cents/hr x 30 hr/wk, region R9"
            - "Three OPEN CASH statements on P18a for 2026-09 (pre), 2026-10 (during suspension), 2026-11 (post resume); no revenue rows; clocks stepped so each statement closes after its month ends"
            - "P18b stays ACTIVE throughout so the regional pool math is driven by P18a's position alone when active (pool 720000, share 288000) and collapses to P18b-only when P18a is suspended (P18a charge 0)"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Suspend Owner LP", distribution_day_of_month: 10 }
