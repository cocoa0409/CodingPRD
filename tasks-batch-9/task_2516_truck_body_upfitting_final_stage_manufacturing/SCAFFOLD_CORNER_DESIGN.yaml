      - name: interface_approval_supersedes_the_prior_interface_on_the_same_signal_source
        claim_type: Side Effect Execution
        grounds:
          - state_machines.ElectricalInterface.PROPOSED_to_APPROVED
          - state_machines.ElectricalInterface.APPROVED_to_SUPERSEDED
          - calculations.aux_electrical_load
          - entities.UpfitOrder.fields.chassis_warranty_status
        distinguishing_aspect: |
          Approving a second interface on the same signal_source must retire the first AND remove its
          amps from committed_aux_amp_draw in the same call. The subtle part is that the ceiling test
          runs with the candidate counted but the outgoing row still APPROVED, so a naive
          implementation double-counts 20 + 8 against the 60 A ceiling and later leaves the order
          reading 40 A for a truck that draws 20.
        test_recipe:
          setup:
            - "A DRAFT service order on F550-DRW-84CA (body draws 12 A, ceiling 60 A) with two PROPOSED BODY_BUILDER_MODULE interfaces on signal_source BODY_CONTROLLER drawing 20 A and 8 A."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "adm-1"
            - call: "POST /upfit/chassis-models"
