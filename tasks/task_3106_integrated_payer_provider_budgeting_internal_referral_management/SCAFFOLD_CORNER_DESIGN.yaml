      - name: provider_volume_component_stays_zero_across_compensation_models
        claim_type: Constants Applied
        grounds:
          - calculations.provider_comp_total_cents
          - entities.Provider.fields.volume_component_cents
          - validations[priority=11]
          - errors.ERR_VOLUME_COMPONENT_NOT_PERMITTED
        distinguishing_aspect: "volume_component_cents is pinned to 0 under SALARY, PANEL_CAPITATION and QUALITY_BONUS alike, and a plan that would link compensation to volume is refused."
        test_recipe:
