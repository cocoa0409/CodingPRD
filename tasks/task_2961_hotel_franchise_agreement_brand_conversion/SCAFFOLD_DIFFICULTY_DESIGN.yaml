            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: FranchiseDevelopmentManager
            - call: "POST /applications/${app_id}/financial-review"
              payload: { capacity_basis: "PORTFOLIO_ADJUSTED" }
              as: FranchiseDevelopmentManager
              as_user_id: "fdm-review-01"
            - call: "POST /applications/${app_id}/impact-analysis"
              payload: {}
              as: BrandStandardsDirector
            - call: "POST /applications/${app_id}/finalize-impact"
              payload: {}
