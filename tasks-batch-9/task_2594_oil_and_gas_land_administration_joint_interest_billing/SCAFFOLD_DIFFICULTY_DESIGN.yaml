            - "An assignment notice from OB to OC for OB's entire holding (0.200000 working interest, 0.150000 net revenue interest), with both eligible preferential-right holders OP and OA waiving so the transfer reaches PPR_WAIVED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: LandAdministrator
            - call: "POST /land-admin/leases"
