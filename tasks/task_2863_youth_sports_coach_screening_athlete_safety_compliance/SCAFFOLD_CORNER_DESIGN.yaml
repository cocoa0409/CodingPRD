              as: ClubAdministrator
              as_user_id: "${club_a_id}"
              captures: { m_nf_id: $.data.id }
          trigger:
            - call: "GET /safesport/clubs/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NgbAdmin
              captures: { nf_club: $.data.error_id }
            - call: "GET /safesport/members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NgbAdmin
