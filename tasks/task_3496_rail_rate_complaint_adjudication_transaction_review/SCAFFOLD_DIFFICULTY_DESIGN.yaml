  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: reparation_ledger_invariant_under_payment_and_reversal
        grounds:
          - entities.RateComplaint.fields.award_outstanding_cents
          - entities.Carrier.fields.reparation_exposure_cents
          - state_machines.RateComplaint.DECIDED_to_CLOSED
        distinguishing_aspect: "Fiscal conserved quantity: award_granted == award_paid + award_outstanding holds after every PAYMENT and after REVERSAL (which sets granted := paid with paid == 0); the carrier's reparation_exposure returns exactly to its pre-decision value once the compensating reversal lands."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Carrier OKTX with findings 2021-2025 (ADEQUATE). Two identical complaints RC1 and RC2 (challenged 19500, alleged 10000, tons 1000, FULL_SAC, year 2025), each with VERIFIED evidence (reference 11200, cost 10500) and decided UPHELD with shipments 10.515t + 5.005t -> award 128817 each; carrier exposure 257634."
          setup_api_calls:
            - call: "POST /stb/carriers"
              payload: { carrier_code: "OKTX", legal_name: "Oklahoma & Texas Railway", carrier_class: "I", base_route_miles: 1000 }
              as: PlatformAdmin
              captures: { c_oktx: $.data.id }
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2021, operating_revenue_cents: 620000000, operating_expense_cents: 500000000, net_investment_cents: 1000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2022, operating_revenue_cents: 600000000, operating_expense_cents: 500000000, net_investment_cents: 800000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2023, operating_revenue_cents: 565000000, operating_expense_cents: 500000000, net_investment_cents: 500000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2024, operating_revenue_cents: 730000000, operating_expense_cents: 500000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/carriers/${c_oktx}/revenue-adequacy-findings"
              payload: { fiscal_year: 2025, operating_revenue_cents: 1000000000, operating_expense_cents: 800000000, net_investment_cents: 2000000000 }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "GRAIN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc1: $.data.id }
            - call: "POST /stb/rate-complaints/${rc1}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev1: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev1}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc1}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-A", tons: 10.515 }, { shipment_ref: "S-B", tons: 5.005 }] }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints"
              payload: { shipper_id: "shp-ada", carrier_id: "${c_oktx}", commodity: "CORN", challenged_rate_cents_per_ton: 19500, alleged_variable_cost_cents_per_ton: 10000, annual_tons: 1000, relief_sought_cents: 400000001, contested_fiscal_year: 2025 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { rc2: $.data.id }
            - call: "POST /stb/rate-complaints/${rc2}/determine-market-dominance"
              payload: { product_competition_exists: false, geographic_competition_exists: false }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc2}/evidence"
              payload: { submission_type: "SAC_STUDY", submitted_by_party: "SHIPPER", reference_rate_cents_per_ton: 11200, verified_variable_cost_cents_per_ton: 10500 }
              as: Shipper
              as_user_id: "shp-ada"
              captures: { ev2: $.data.id }
            - call: "POST /stb/evidence-submissions/${ev2}/verify"
              payload: { review_outcome: "VERIFIED" }
              as: BoardAdjudicator
            - call: "POST /stb/rate-complaints/${rc2}/decide"
              payload: { outcome: "UPHELD", shipments: [{ shipment_ref: "S-A", tons: 10.515 }, { shipment_ref: "S-B", tons: 5.005 }] }
              as: BoardAdjudicator
          trigger:
            - call: "POST /stb/rate-complaints/${rc1}/reparation-events"
              payload: { event_type: "PAYMENT", amount_cents: 50000 }
              as: CarrierOperator
              as_user_id: "${c_oktx}"
            - call: "POST /stb/rate-complaints/${rc1}/reparation-events"
              payload: { event_type: "PAYMENT", amount_cents: 28817 }
              as: CarrierOperator
              as_user_id: "${c_oktx}"
            - call: "POST /stb/rate-complaints/${rc1}/reparation-events"
              payload: { event_type: "PAYMENT", amount_cents: 50000 }
              as: CarrierOperator
              as_user_id: "${c_oktx}"
            - call: "POST /stb/rate-complaints/${rc2}/reparation-events"
              payload: { event_type: "REVERSAL" }
              as: BoardAdjudicator
          assert:
            - "after payments of 50000 + 28817 + 50000: RC1.award_granted_cents == 128817, award_paid_cents == 128817, award_outstanding_cents == 0, award_status == PAID, status == CLOSED"
            - "invariant held at every step: award_granted_cents == award_paid_cents + award_outstanding_cents"
            - "after REVERSAL on RC2: award_granted_cents == 0, award_outstanding_cents == 0, award_paid_cents == 0, award_status == REVERSED, status == CLOSED"
            - "Carrier.${c_oktx}.reparation_exposure_cents == 0 — exactly the pre-decision exposure (grant/reversal pair conserved the carrier ledger)"
      - name: interchange_slot_conservation_grant_terminate
