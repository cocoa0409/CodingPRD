            - "Performance.${perf2_id}.status == CANCELLED"
            - "cancellation_refund_rule ran with refund_fraction per days_until_window_start; payment_status reflects refund"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_approve_on_withdrawn_title
        grounds:
          - validations[priority=8]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_TITLE_WITHDRAWN]
        distinguishing_aspect: |
          Pair (state vs business_safety): when an application is not in UNDER_REVIEW AND
          its title has been withdrawn, the state error (priority 8) wins over the
          business_safety error (priority 10).
        test_recipe:
          setup:
            - "Application in DRAFT state (never submitted); title withdrawn after creation"
          setup_api_calls:
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: RightsAdmin
            - call: "POST /licensing/titles"
              payload: { name: "T", author: "A", title_kind: "PLAY", royalty_basis: "PER_PERFORMANCE", base_flat_fee_cents: 50000, gross_percent_bp: 0, restricted_material: false, perusal_fee_cents: 500, rental_deposit_cents: 20000, late_fee_per_day_cents: 500, restricted_late_fee_per_day_cents: 1500, recording_royalty_flat_cents: 30000 }
              as: RightsAdmin
              captures: { title_id: $.data.id }
            - call: "POST /licensing/organizations"
              payload: { legal_name: "O", org_kind: "COMMUNITY", home_territory_code: "US-CA" }
              as: RightsAdmin
              captures: { org_id: $.data.id }
            - call: "POST /licensing/applications"
              payload: { title_id: "${title_id}", organization_id: "${org_id}", requested_territory_code: "US-CA", requested_classification: "AMATEUR", venue_seating_capacity: 100, ticket_top_price_cents: 1000, performers_compensated: false, admission_charged: true, projected_gross_cents: 100000, performance_count: 1, first_performance_date: "2026-06-01T19:00:00Z", last_performance_date: "2026-06-01T19:00:00Z" }
              as: Applicant
              as_user_id: "${org_id}"
              captures: { app_id: $.data.id }
            - call: "POST /licensing/titles/${title_id}/withdraw"
              payload: {}
              as: RightsAdmin
          trigger:
            - call: "POST /licensing/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v}" }
              as: LicensingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (state check at priority 8 fires before business_safety at 10)"
            - "HTTP status == 409"

      - name: business_referential_vs_business_fiscal_payment_when_suspended
        grounds:
          - validations[priority=9]
          - validations[priority=16]
          - errors[ERR_ORG_SUSPENDED]
