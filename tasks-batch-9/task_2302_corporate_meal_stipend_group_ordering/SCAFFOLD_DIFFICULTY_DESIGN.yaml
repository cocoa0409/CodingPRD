  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: deliver_cascades_period_program_imputed_record_and_flips_employee_flag
        grounds:
          - state_machines.Order.CONFIRMED_to_DELIVERED
          - calculations.imputed_income_accrual
          - entities.Employee.fields.ytd_imputed_cents
          - entities.Employee.fields.tax_treatment_flag
        distinguishing_aspect: |
          FOUR entities beyond the trigger target move on one deliver: Order -> BenefitPeriod ->
          MealProgram and Order -> ImputedIncomeRecord -> Employee. The fourth-level effect is
          conditional on the third-level aggregate: only because the record's cumulative taxable
          total reaches 1000 does Employee.tax_treatment_flag flip NONE -> W2_IMPUTED.
        test_recipe:
          setup:
            - "Program (DE_MINIMIS_EXCLUSION) / Engineering group / HQ dock / Thai Garden / Ada with an OPEN 2026-08 period of 50000 allocated cents."
            - "Ada's first 3 x 1000 order with tip 200 is already DELIVERED, so ImputedIncomeRecord 2026-08 holds gross 2500 / taxable 500 and Employee.ytd_imputed_cents is 500 with tax_treatment_flag NONE."
            - "Ada's second identical order for 2026-08-04 is PLACED and CONFIRMED but not yet delivered."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { now: "2026-08-01T00:00:00Z" }, as: PlatformAdmin }
