            - "PrepBatch.${batch_id}.status == CANCELLED (caused by the suspension)"
            - "GET /api/stations/${st_id}/throughput-summary shows rack_load == 0 (cancelled batch released)"

      - name: batch_expire_cascade_depth2
        grounds:
          - state_machines.PrepBatch.PREPPED_to_EXPIRED
          - calculations.station_par_health
          - entities.Station.fields.par_health
