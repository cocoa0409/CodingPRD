      - name: cancellation_exactly_at_late_cancel_window_boundary_refunds_package_credit
        grounds:
          - state_machines.Enrollment.status.RESERVED_to_CANCELED
          - state_machines.Enrollment.status.RESERVED_to_LATE_CANCEL
          - state_machines.MembershipPackage.status.DEPLETED_to_ACTIVE
          - entities.MembershipPackage.fields.sessions_remaining
        distinguishing_aspect: |
          A different metric on a different endpoint: hours remaining before start_at against
          LATE_CANCEL_WINDOW_HOURS on POST /enrollments/{enrollment_id}/cancel. The clock is
          parked exactly 24.0 hours before start_at, the inclusive edge of the refund window,
          so the row must become CANCELED with the package credit restored, never LATE_CANCEL
          with the credit forfeited.
        test_recipe:
          setup:
            - "One StaffMember acting as Coach, credential_status COMPLIANT (insurance to 2027-12-31 plus one VALID CPR_AED certification)."
            - "One CLEARED, ACTIVE athlete born 2010-01-15."
            - "A one-session MembershipPackage for the athlete, price 12000 cents, expires_on 2026-12-31, so effective_expires_on is 2026-12-31."
            - "A GENERAL_PREP ONSITE GroupSession on 2026-08-11T10:00Z-11:00Z, station_count 3, max_athletes 10, with one compliant coach."
            - "The athlete holds a PACKAGE_ONLY enrollment on it, so the package is DEPLETED with sessions_remaining 0 and sessions_reserved 1."
            - "The clock is then set to 2026-08-10T10:00:00Z — exactly LATE_CANCEL_WINDOW_HOURS (24) before start_at."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Tom Ferreira", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
