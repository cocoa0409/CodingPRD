            - call: "POST /customers"
              payload: { full_name: "Jonna Ristola", email: "jonna.ristola@example.com", mobile_number: "+15550100046" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { cust: "$.data.id" }
            - call: "POST /credit-applications"
              payload: { customer_id: "${cust}", device_model_id: "${m_b}", requested_term_months: 24, declared_down_payment_cents: 0 }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { app: "$.data.id" }
            - call: "POST /credit-applications/${app}/decision"
              payload: { credit_score_band: "PRIME" }
              as: CreditUnderwriter
              as_user_id: "u-uw-1"
            - call: "POST /loans"
              payload: { credit_application_id: "${app}", down_payment_cents: 0, imei: "356938035643028" }
              as: RetailAssociate
              as_user_id: "u-assoc-1"
              captures: { loan: "$.data.id" }
            - call: "POST /loans/${loan}/payoff-quotes"
              payload: { quote_type: "UPGRADE_ROLLOVER" }
              as: Customer
              as_user_id: "${cust}"
              captures: { q_roll: "$.data.id" }
          trigger:
            - call: "POST /loans/${loan}/cancellation"
              payload: { payoff_quote_id: "${q_roll}", payment_amount_cents: 89900 }
              as: Customer
