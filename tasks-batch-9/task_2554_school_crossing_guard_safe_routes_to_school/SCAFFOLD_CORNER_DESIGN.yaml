      - name: corner_priority_ordering_state_before_fiscal_stub
        claim_type: priority_ordering
        grounds:
          - validations.priority_40
          - validations.priority_72.ERR_GRANT_FUNDS_EXHAUSTED
        excluded_because:
          difficulty_instance: deferred_and_unaffordable_project_reports_state_error_not_fiscal_error
          rationale: |
            The priority-40 state check beating the priority-72 fiscal check on a single
            request that violates both is asserted directly by the §1.8
            priority-pair instance.

      - name: corner_priority_conflict_safety_before_temporal_stub
        claim_type: priority_conflict
        grounds:
          - validations.priority_50.ERR_GUARD_CERT_EXPIRED
          - validations.priority_58.ERR_ASSIGNMENT_OVERLAP
        excluded_because:
          difficulty_instance: expiring_certification_beats_assignment_overlap_on_same_guard
          rationale: |
            A single assignment request that violates the priority-50 certification-expiry
            rule and the priority-58 overlap rule simultaneously, expecting the
            priority-50 error, is the subject of the §1.8 priority-pair instance.

      - name: corner_cross_entity_validation_stub
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_50.ERR_GUARD_NOT_CERTIFIED
        excluded_because:
          difficulty_instance: assignment_creation_gated_on_guard_certification_state
          rationale: |
            Validity of an assignment depending on the Guard's certification_status, tested
            in both the passing and the failing configuration, is the §1.8 cross-entity
            state dependency instance.

      - name: corner_temporal_validation_stub
        claim_type: temporal_validation
        grounds:
          - validations.priority_58.ERR_ASSIGNMENT_OVERLAP
        excluded_because:
          difficulty_instance: guard_assignment_closed_interval_overlap_and_shift_matrix
          rationale: |
            Closed-interval overlap detection, the legal back-to-back window and the full
            AM/PM/BOTH shift conflict matrix are asserted by the §1.8 resource temporal
            overlap instance.

      - name: corner_cascading_validation_stub
        claim_type: cascading_validation
        grounds:
          - validations.priority_50.ERR_ROUTE_CROSSING_NOT_WARRANTED
          - validations.priority_66.ERR_ROUTE_SEGMENT_SCHOOL_MISMATCH
        excluded_because:
          difficulty_instance: unwarranted_crossing_beats_out_of_district_segment_at_publish
          rationale: |
            Running the priority-50 warrant safety gate before the priority-66
            school-ownership consistency check on a route that violates both is asserted by
            the §1.8 priority-pair instance.

