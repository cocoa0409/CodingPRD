      - name: reserve_crane_prefers_safety_50_over_referential_67_on_a_foreign_farm_crane
        grounds:
          - validations[priority=50]
          - validations[priority=67]
          - errors.ERR_LIFT_WIND_LIMIT_EXCEEDED
          - errors.ERR_CRANE_FARM_MISMATCH
          - endpoints.POST_/wind-ops/component-replacements/{id}/reserve-crane
          - calculations.crane_cost_and_allocation
        distinguishing_aspect: |
          The natural implementation order is to resolve the crane, notice it belongs to another
          farm and refuse with ERR_CRANE_FARM_MISMATCH. The declared ladder inverts that: the
          workable-day gate at priority 50 is evaluated first, so a foreign crane whose window is
          also too short must report ERR_LIFT_WIND_LIMIT_EXCEEDED. Only after the window is long
          enough does the farm mismatch surface.
        test_recipe:
          setup:
            - "farm A with one ONLINE turbine, and a second farm B on which every crane below is requested"
            - "one GEARBOX spare part with quantity_on_hand 2 and reorder_point 1"
            - "one PLANNED ComponentReplacement R on a MAJOR_COMPONENT work order of farm A's turbine, estimated_lift_hours 15, so lift_days is 2"
            - "crane C_short on farm B running 2026-06-20T00:00:00Z to 2026-06-21T00:00:00Z, i.e. one workable date, which is fewer than the required 2 lift days"
            - "crane C_long on farm B running 2026-08-20T00:00:00Z to 2026-08-25T00:00:00Z, i.e. five workable dates, placed far enough from C_short that the 48-hour crane buffer on farm B does not conflict"
            - "crane C_home on farm A running 2026-07-20T00:00:00Z to 2026-07-25T00:00:00Z, i.e. five workable dates"
          setup_api_calls:
            - call: "POST /wind-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-06-15T00:00:00Z" }
              as: SiteAdmin
              as_user_id: "admin-1"
            - call: "POST /wind-ops/farms"
              payload: { name: "Alkali Flat A", region_code: "NM-W", grid_operator_code: "ERCOT", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_a_id: $.data.id }
            - call: "POST /wind-ops/farms"
              payload: { name: "Alkali Flat B", region_code: "NM-W", grid_operator_code: "ERCOT", landowner_budget_cap_cents: 500000000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { farm_b_id: $.data.id }
            - call: "POST /wind-ops/turbine-models"
              payload: { model_code: "V150-4.2", rated_power_kw: 4200, hub_height_m: 105, rotor_diameter_m: 150, service_interval_hours: 4000, service_interval_tolerance_hours: 250, gearbox_lead_time_days: 210, blade_lead_time_days: 150, generator_lead_time_days: 120 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { model_id: $.data.id }
            - call: "POST /wind-ops/farms/${farm_a_id}/turbines"
              payload: { turbine_model_id: "${model_id}", asset_tag: "T-A1", commissioning_date: "2024-03-15", expected_kwh_per_hour: 2000 }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { ta1_id: $.data.id }
            - call: "POST /wind-ops/spare-parts"
              payload: { component_type: "GEARBOX", part_number: "GB-11", quantity_on_hand: 2, lead_time_days: 210, reorder_point: 1, unit_cost_cents: 90000000, uptower_repairable: false }
              as: SiteAdmin
              as_user_id: "admin-1"
              captures: { sp_id: $.data.id }
            - call: "POST /wind-ops/work-orders"
              payload: { turbine_id: "${ta1_id}", work_type: "MAJOR_COMPONENT", required_certification: "CRANE_BANKSMAN", estimated_hours: 10 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { wo_id: $.data.id }
            - call: "POST /wind-ops/component-replacements"
              payload: { work_order_id: "${wo_id}", spare_part_id: "${sp_id}", component_type: "GEARBOX", estimated_lift_hours: 15, uptower_labor_hours: 40 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { r_id: $.data.id }
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_b_id}", crane_class: "CRAWLER_600T", mobilization_start_utc: "2026-06-20T00:00:00Z", demobilization_end_utc: "2026-06-21T00:00:00Z", day_rate_cents: 2240000, mobilization_fee_cents: 4000000, max_lift_wind_speed_ms: 12 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { c_short_id: $.data.id }
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_b_id}", crane_class: "CRAWLER_600T", mobilization_start_utc: "2026-08-20T00:00:00Z", demobilization_end_utc: "2026-08-25T00:00:00Z", day_rate_cents: 2240000, mobilization_fee_cents: 4000000, max_lift_wind_speed_ms: 12 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { c_long_id: $.data.id }
            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_a_id}", crane_class: "CRAWLER_600T", mobilization_start_utc: "2026-07-20T00:00:00Z", demobilization_end_utc: "2026-07-25T00:00:00Z", day_rate_cents: 2240000, mobilization_fee_cents: 4000000, max_lift_wind_speed_ms: 12 }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { c_home_id: $.data.id }
          trigger:
            - call: "POST /wind-ops/component-replacements/${r_id}/reserve-crane"
              payload: { crane_mobilization_id: "${c_short_id}" }
              as: MaintenancePlanner
              as_user_id: "planner-1"
              captures: { err_pair: $.data.error_id }
            - call: "POST /wind-ops/component-replacements/${r_id}/reserve-crane"
              payload: { crane_mobilization_id: "${c_long_id}" }
