          Pair business_safety (priority 8, ERR_PERMIT_NOT_VERIFIED) vs business_constraint
          (priority 9, ERR_CATEGORY_NOT_ALLOWED): a DAILY assignment by a vendor whose permit is not
          verified AND whose category is disallowed by the booth must return ERR_PERMIT_NOT_VERIFIED
          (priority 8 wins), not ERR_CATEGORY_NOT_ALLOWED.
        test_recipe:
          setup:
            - "Standard market; one booth allowed_categories=[PRODUCE]; OPEN MarketDay 2026-06-06."
            - "Vendor APPROVED for DAIRY (a category not in the booth list) AND lacks a VERIFIED HEALTH permit (DAIRY requires_health_permit)."
            - "NOTE: to reach an APPROVED DAIRY application without a verified permit we need a HEALTH permit verified for approval, then expire it before the assignment so permit_ok=false at assignment time."
          setup_api_calls:
            - call: "POST /markets"
              payload: { name: "Green Sq", season_start_date: "2026-06-01", season_end_date: "2026-09-30", season_fee_cents: 50000, daily_fee_cents: 4000, commission_bps: 700, voucher_face_value_cents: 200 }
