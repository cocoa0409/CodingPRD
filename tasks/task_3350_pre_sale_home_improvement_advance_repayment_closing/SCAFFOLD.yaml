# =============================================================================
# Task 3350: Pre-Sale Home Improvement Advance & Repayment at Closing
# (Compass Concierge-style program)
# =============================================================================
# Difficulty target: MUCH HARDER THAN EXPERT. The mechanism is layered:
#   * Dual-variant payoff calculation (listed-within-window vs not) that
#     switches the fee basis and accrual model.
#   * Nested rounding in the closing statement that MUST pin order.
#   * Circular-looking fee evaluation: fee depends on payoff_basis, which
#     depends on advance_total, which itself is recomputed from disbursements
#     — the scaffold pins evaluation order.
#   * Vendor capacity windows (calendar) with half-open vs closed-interval
#     semantics on two different resource kinds.
#   * A posture-driven ConciergeCase gate whose transitions depend on
#     aggregate state of ImprovementProject children.
#   * Compensating invariants: advance ledger conservation and deposit
#     conservation across cancel/void paths.
# =============================================================================

scenario: |
  Pre-Sale Home Improvement Advance & Repayment at Closing (Compass Concierge):
  eligibility assessment based on property value, expected sale proceeds and
  listing agreement execution, improvement scope development with an agent
  recommending projects expected to raise the sale price, advance limit setting
  against estimated proceeds with no upfront homeowner payment, vendor
  engagement, scheduling and payment administration with quality accountability,
  repayment at closing from sale proceeds with fee terms and what happens if
  the home does not sell within a period, listing price and timeline
  expectations tied to the improvement plan with market change risk,
  disclosure obligations about the program in the listing agreement,
  dispute handling on workmanship and cost overruns.

domain_name: concierge-pre-sale-advance
api_prefix: /concierge

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - derived_field_reconciliation
    - temporal_windowing
    - optimistic_concurrency
  entity_topology: hierarchical
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: approval_chain
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ConciergeCase
    parent: null
    common_fields: true
    fields:
      - { name: address_line, type: string, source: input, description: "Street address of the property" }
      - { name: estimated_property_value_cents, type: integer, source: input, description: "Current appraised / agent-estimated market value before improvements" }
      - { name: expected_sale_proceeds_cents, type: integer, source: input, description: "Gross expected sale price minus seller closing costs" }
      - { name: listing_agreement_signed, type: boolean, source: input, default: false, description: "Whether homeowner has executed the listing agreement" }
      - { name: listing_agreement_disclosure_ack, type: boolean, source: input, default: false, description: "Whether listing agreement carries the program disclosure clause" }
      - { name: advance_limit_cents, type: integer, source: computed, description: "Hard cap on total program advances = floor(expected_sale_proceeds_cents * ADVANCE_LIMIT_RATE)" }
      - { name: advance_total_cents, type: integer, source: computed, description: "Sum of approved + disbursed advances against this case" }
      - { name: homeowner_contribution_cents, type: integer, source: input, default: 0, description: "Optional upfront homeowner co-pay; must be zero for no-upfront-payment track" }
      - { name: upfront_payment_track, type: enum, source: system, description: "NO_UPFRONT | CONTRIBUTION; derived from homeowner_contribution_cents" }
      - { name: listing_price_target_cents, type: integer, source: computed, description: "Target listing price after improvement plan; recomputed on plan approval" }
      - { name: listing_window_days, type: integer, source: input, default: 180, description: "Days from first listing to the no-sale penalty trigger" }
      - { name: listed_at, type: datetime, source: system, description: "When the case entered LISTED; null until then" }
      - { name: closed_at, type: datetime, source: system, description: "When the case entered CLOSED_SOLD or CLOSED_UNSOLD" }
      - { name: status, type: enum, source: system, description: "ELIGIBILITY_REVIEW | SCOPE_PLANNING | PLAN_APPROVED | FUNDED | IN_PROGRESS | READY_TO_LIST | LISTED | UNDER_CONTRACT | CLOSED_SOLD | CLOSED_UNSOLD | CANCELLED" }
      - { name: posture, type: enum, source: computed, description: "OPEN | RESTRICTED | FROZEN; derived from open disputes and market-risk flag" }

  - name: ImprovementProject
    parent: ConciergeCase
    common_fields: true
    fields:
      - { name: concierge_case_id, type: string, source: system, description: "FK -> ConciergeCase.id" }
      - { name: title, type: string, source: input, description: "Short project label (e.g. 'Kitchen refresh')" }
      - { name: recommended_by_agent, type: boolean, source: input, description: "Whether the listing agent recommended this project" }
      - { name: expected_sale_price_lift_cents, type: integer, source: input, description: "Agent-estimated sale-price lift from this project" }
      - { name: estimated_cost_cents, type: integer, source: input, description: "Estimated project cost used for advance-limit headroom checks" }
      - { name: approved_cost_cents, type: integer, source: system, description: "Cost locked at project approval" }
      - { name: cost_overrun_cents, type: integer, source: computed, description: "= max(0, sum of APPROVED change orders) - approved_cost_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | PROPOSED | APPROVED | SCHEDULED | IN_WORK | COMPLETE | VERIFIED | CANCELLED" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Vendor legal name" }
      - { name: trade, type: enum, source: input, description: "GENERAL | ELECTRIC | PLUMBING | HVAC | PAINT | LANDSCAPE" }
      - { name: quality_score_bp, type: integer, source: computed, description: "Rolling quality score in basis points 0..10000, updated on dispute resolution" }
      - { name: on_time_streak, type: integer, source: computed, description: "Count of consecutive on-time completions; reset on late completion" }

  - name: VendorEngagement
    parent: ImprovementProject
    common_fields: true
    fields:
      - { name: improvement_project_id, type: string, source: system, description: "FK -> ImprovementProject.id" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id" }
      - { name: agreed_price_cents, type: integer, source: input, description: "Contract price for this engagement" }
      - { name: start_date, type: datetime, source: input, description: "Scheduled start" }
      - { name: end_date, type: datetime, source: input, description: "Scheduled end (inclusive)" }
      - { name: completion_deadline, type: datetime, source: computed, description: "= end_date + LATE_GRACE_DAYS (7 days)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_WORK | COMPLETE_ON_TIME | COMPLETE_LATE | CANCELLED | DISPUTED" }

  - name: Disbursement
    parent: ConciergeCase
    common_fields: true
    fields:
      - { name: concierge_case_id, type: string, source: system, description: "FK -> ConciergeCase.id" }
      - { name: improvement_project_id, type: string, source: input, description: "FK -> ImprovementProject.id" }
      - { name: vendor_engagement_id, type: string, source: input, description: "FK -> VendorEngagement.id" }
      - { name: amount_cents, type: integer, source: input, description: "Gross amount paid to vendor" }
      - { name: kind, type: enum, source: input, description: "DEPOSIT | PROGRESS | FINAL | CHANGE_ORDER" }
      - { name: sequence_in_case, type: integer, source: system, description: "Monotone counter within the case (stable tie-breaker)" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | RELEASED | VOIDED" }

  - name: ChangeOrder
    parent: ImprovementProject
    common_fields: true
    fields:
      - { name: improvement_project_id, type: string, source: system, description: "FK -> ImprovementProject.id" }
      - { name: vendor_engagement_id, type: string, source: input, description: "FK -> VendorEngagement.id" }
      - { name: delta_cents, type: integer, source: input, description: "Signed cost delta; positive = overrun" }
      - { name: reason, type: enum, source: input, description: "SCOPE_CREEP | HIDDEN_DAMAGE | MATERIAL_PRICE | CODE_UPGRADE | OTHER" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED" }

  - name: Dispute
    parent: ConciergeCase
    common_fields: true
    fields:
      - { name: concierge_case_id, type: string, source: system, description: "FK -> ConciergeCase.id" }
      - { name: improvement_project_id, type: string, source: input, description: "FK -> ImprovementProject.id" }
      - { name: vendor_engagement_id, type: string, source: input, description: "FK -> VendorEngagement.id" }
      - { name: dispute_kind, type: enum, source: input, description: "WORKMANSHIP | COST_OVERRUN | SCHEDULE_DELAY" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Amount the filer wants held back / refunded" }
      - { name: status, type: enum, source: system, description: "OPEN | IN_REVIEW | RESOLVED_VENDOR_FAULT | RESOLVED_HOMEOWNER_FAULT | WITHDRAWN" }

  - name: ClosingStatement
    parent: ConciergeCase
    common_fields: true
    fields:
      - { name: concierge_case_id, type: string, source: system, description: "FK -> ConciergeCase.id" }
      - { name: gross_sale_price_cents, type: integer, source: input, description: "Actual sale price at closing; null if unsold" }
      - { name: payoff_basis, type: enum, source: computed, description: "LISTED_WITHIN_WINDOW | NOT_LISTED_WITHIN_WINDOW | SOLD_WITHIN_WINDOW | SOLD_AFTER_WINDOW" }
      - { name: advance_repayment_cents, type: integer, source: computed, description: "Total advance principal being repaid" }
      - { name: program_fee_cents, type: integer, source: computed, description: "Program fee owed at closing (variant A or B)" }
      - { name: late_fee_cents, type: integer, source: computed, description: "Additional fee if not sold within window" }
      - { name: vendor_holdback_cents, type: integer, source: computed, description: "Amount withheld from vendor payments pending dispute resolution" }
      - { name: net_repayment_cents, type: integer, source: computed, description: "= advance_repayment_cents + program_fee_cents + late_fee_cents - vendor_holdback_cents" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED | PAID | WAIVED" }

  - name: ListingEvent
    parent: ConciergeCase
    common_fields: true
    fields:
      - { name: concierge_case_id, type: string, source: system, description: "FK -> ConciergeCase.id" }
      - { name: event_kind, type: enum, source: input, description: "LISTED | PRICE_REDUCED | OFFER_ACCEPTED | CLOSED_SOLD | CLOSED_UNSOLD | DELISTED" }
      - { name: event_at, type: datetime, source: input, description: "Timestamp of the listing event" }
      - { name: price_cents, type: integer, source: input, description: "Listing or offer price; required for LISTED, PRICE_REDUCED, OFFER_ACCEPTED, CLOSED_SOLD" }
      - { name: market_risk_flag, type: boolean, source: input, default: false, description: "True when market conditions deteriorate materially from the improvement plan baseline" }

  - name: VendorCapacityWindow
    parent: Vendor
    common_fields: true
    fields:
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id" }
      - { name: window_start, type: datetime, source: input, description: "Capacity window start (inclusive)" }
      - { name: window_end, type: datetime, source: input, description: "Capacity window end (exclusive — half-open)" }
      - { name: capacity_crew_days, type: integer, source: input, description: "Crew-days available in this window" }
      - { name: reserved_crew_days, type: integer, source: computed, description: "Crew-days reserved by SCHEDULED VendorEngagements" }
      - { name: status, type: enum, source: system, description: "OPEN | FULL | CANCELLED" }

  - name: Agent
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Listing agent name" }
      - { name: license_number, type: string, source: input, description: "State real-estate license number" }
      - { name: brokerage, type: string, source: input, description: "Brokerage name" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ConciergeCase
    initial_state: ELIGIBILITY_REVIEW
    terminal_states: [CLOSED_SOLD, CLOSED_UNSOLD, CANCELLED]
    transitions:
      - from: ELIGIBILITY_REVIEW
        to: SCOPE_PLANNING
        trigger: "POST /concierge/cases/{caseId}/eligibility/approve"
        actor: ProgramUnderwriter
        preconditions:
          - "estimated_property_value_cents > 0"
          - "expected_sale_proceeds_cents > estimated_property_value_cents * MIN_EQUITY_RATIO (1.10)"
          - "listing_agreement_signed == true"
          - "listing_agreement_disclosure_ack == true"
        side_effects:
          - "advance_limit_cents = floor(expected_sale_proceeds_cents * ADVANCE_LIMIT_RATE (0.15))"

      - from: ELIGIBILITY_REVIEW
        to: CANCELLED
        trigger: "POST /concierge/cases/{caseId}/eligibility/reject"
        actor: ProgramUnderwriter
        preconditions: []
        side_effects: []

      - from: SCOPE_PLANNING
        to: PLAN_APPROVED
        trigger: "POST /concierge/cases/{caseId}/plan/approve"
        actor: Homeowner
        preconditions:
          - "At least one ImprovementProject in APPROVED status"
          - "Sum of approved_cost_cents across APPROVED projects <= advance_limit_cents"
          - "posture == OPEN"
        side_effects:
          - "listing_price_target_cents = estimated_property_value_cents + sum(expected_sale_price_lift_cents for APPROVED projects)"

      - from: PLAN_APPROVED
        to: FUNDED
        trigger: "system (automatic when the first Disbursement transitions REQUESTED→APPROVED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FUNDED
        to: IN_PROGRESS
        trigger: "system (automatic when the first VendorEngagement transitions SCHEDULED→IN_WORK)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: READY_TO_LIST
        trigger: "system (automatic when every ImprovementProject is VERIFIED or CANCELLED and no Dispute is OPEN or IN_REVIEW)"
        actor: system
        preconditions: []
        side_effects: []

      - from: READY_TO_LIST
        to: LISTED
        trigger: "POST /concierge/cases/{caseId}/listing-events with event_kind=LISTED"
        actor: ListingAgent
        preconditions:
          - "No ListingEvent with event_kind=LISTED already exists for this case"
        side_effects:
          - "listed_at = event_at"

      - from: LISTED
        to: UNDER_CONTRACT
        trigger: "POST /concierge/cases/{caseId}/listing-events with event_kind=OFFER_ACCEPTED"
        actor: ListingAgent
        preconditions: []
        side_effects: []

      - from: UNDER_CONTRACT
        to: CLOSED_SOLD
        trigger: "POST /concierge/cases/{caseId}/listing-events with event_kind=CLOSED_SOLD"
        actor: ListingAgent
        preconditions: []
        side_effects:
          - "closed_at = event_at"
          - "Create ClosingStatement in DRAFT with payoff_basis computed"

      - from: LISTED
        to: CLOSED_UNSOLD
        trigger: "POST /concierge/cases/{caseId}/listing-events with event_kind=CLOSED_UNSOLD"
        actor: ListingAgent
        preconditions:
          - "Days between listed_at and event_at >= listing_window_days"
        side_effects:
          - "closed_at = event_at"
          - "Create ClosingStatement in DRAFT with payoff_basis=NOT_LISTED_WITHIN_WINDOW"

      - from: LISTED
        to: CANCELLED
        trigger: "POST /concierge/cases/{caseId}/cancel"
        actor: Homeowner
        preconditions:
          - "posture != FROZEN"
          - "No Disbursement in RELEASED status that is not yet covered by a ClosingStatement"
        side_effects:
          - "ImprovementProjects not in terminal state -> CANCELLED"
          - "VendorEngagements not in terminal state -> CANCELLED"

      - from: SCOPE_PLANNING
        to: CANCELLED
        trigger: "POST /concierge/cases/{caseId}/cancel"
        actor: Homeowner
        preconditions:
          - "posture != FROZEN"
        side_effects:
          - "ImprovementProjects not in terminal state -> CANCELLED"
          - "VendorEngagements not in terminal state -> CANCELLED"

  - entity: ImprovementProject
    initial_state: DRAFT
    terminal_states: [VERIFIED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /concierge/cases/{caseId}/projects/{projectId}/propose"
        actor: ListingAgent
        preconditions:
          - "concierge_case.status == SCOPE_PLANNING"
        side_effects: []

      - from: PROPOSED
        to: APPROVED
        trigger: "POST /concierge/cases/{caseId}/projects/{projectId}/approve"
        actor: Homeowner
        preconditions:
          - "concierge_case.status == SCOPE_PLANNING"
          - "concierge_case.advance_total_cents + estimated_cost_cents <= concierge_case.advance_limit_cents"
        side_effects:
          - "approved_cost_cents = estimated_cost_cents"

      - from: APPROVED
        to: SCHEDULED
        trigger: "system (automatic when the first VendorEngagement for this project becomes SCHEDULED)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: IN_WORK
        trigger: "system (automatic when the first VendorEngagement becomes IN_WORK)"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_WORK
        to: COMPLETE
        trigger: "system (automatic when every non-CANCELLED VendorEngagement for this project is COMPLETE_ON_TIME or COMPLETE_LATE)"
        actor: system
        preconditions: []
        side_effects: []

      - from: COMPLETE
        to: VERIFIED
        trigger: "POST /concierge/cases/{caseId}/projects/{projectId}/verify"
        actor: ListingAgent
        preconditions:
          - "No Dispute on this project in OPEN or IN_REVIEW status"
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: "POST /concierge/cases/{caseId}/projects/{projectId}/cancel"
        actor: Homeowner
        preconditions: []
        side_effects: []

      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /concierge/cases/{caseId}/projects/{projectId}/cancel"
        actor: Homeowner
        preconditions: []
        side_effects: []

  - entity: VendorEngagement
    initial_state: SCHEDULED
    terminal_states: [COMPLETE_ON_TIME, COMPLETE_LATE, CANCELLED, DISPUTED]
    transitions:
      - from: SCHEDULED
        to: IN_WORK
        trigger: "POST /concierge/engagements/{engagementId}/start"
        actor: Vendor
        preconditions:
          - "improvement_project.status in {APPROVED, SCHEDULED, IN_WORK}"
          - "Vendor has an OPEN VendorCapacityWindow covering [start_date, end_date) with reserved_crew_days + required_crew_days <= capacity_crew_days"
        side_effects:
          - "reserved_crew_days += required_crew_days on the matching VendorCapacityWindow"

      - from: IN_WORK
        to: COMPLETE_ON_TIME
        trigger: "POST /concierge/engagements/{engagementId}/complete"
        actor: Vendor
        preconditions:
          - "Current clock <= completion_deadline"
        side_effects:
          - "Vendor.on_time_streak += 1"

      - from: IN_WORK
        to: COMPLETE_LATE
        trigger: "POST /concierge/engagements/{engagementId}/complete"
        actor: Vendor
        preconditions:
          - "Current clock > completion_deadline"
        side_effects:
          - "Vendor.on_time_streak = 0"
          - "Vendor.quality_score_bp = max(0, quality_score_bp - LATE_PENALTY_BP)"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /concierge/engagements/{engagementId}/cancel"
        actor: Homeowner
        preconditions:
          - "No Disbursement for this engagement in RELEASED status"
        side_effects:
          - "Release reserved crew-days on the matching VendorCapacityWindow"

      - from: IN_WORK
        to: DISPUTED
        trigger: "system (automatic when a Dispute referencing this engagement is created)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Disbursement
    initial_state: REQUESTED
    terminal_states: [RELEASED, VOIDED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /concierge/disbursements/{disbursementId}/approve"
        actor: ProgramUnderwriter
        preconditions:
          - "concierge_case.advance_total_cents + amount_cents <= concierge_case.advance_limit_cents"
          - "vendor_engagement.status in {SCHEDULED, IN_WORK}"
        side_effects:
          - "concierge_case.advance_total_cents += amount_cents"

      - from: APPROVED
        to: RELEASED
        trigger: "POST /concierge/disbursements/{disbursementId}/release"
        actor: ProgramUnderwriter
        preconditions:
          - "vendor_engagement.status in {IN_WORK, COMPLETE_ON_TIME, COMPLETE_LATE}"
          - "No Dispute on this engagement in OPEN or IN_REVIEW status"
        side_effects: []

      - from: REQUESTED
        to: VOIDED
        trigger: "POST /concierge/disbursements/{disbursementId}/void"
        actor: ProgramUnderwriter
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: VOIDED
        trigger: "POST /concierge/disbursements/{disbursementId}/void"
        actor: ProgramUnderwriter
        preconditions: []
        side_effects:
          - "concierge_case.advance_total_cents -= amount_cents"

  - entity: ChangeOrder
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /concierge/change-orders/{changeOrderId}/approve"
        actor: Homeowner
        preconditions:
          - "improvement_project.status in {SCHEDULED, IN_WORK}"
          - "concierge_case.advance_total_cents + delta_cents <= concierge_case.advance_limit_cents"
        side_effects:
          - "improvement_project.cost_overrun_cents recomputed"

      - from: PENDING
        to: REJECTED
        trigger: "POST /concierge/change-orders/{changeOrderId}/reject"
        actor: Homeowner
        preconditions: []
        side_effects: []

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_VENDOR_FAULT, RESOLVED_HOMEOWNER_FAULT, WITHDRAWN]
    transitions:
      - from: OPEN
        to: IN_REVIEW
        trigger: "POST /concierge/disputes/{disputeId}/review"
        actor: ProgramUnderwriter
        preconditions: []
        side_effects:
          - "concierge_case.posture recomputed (OPEN -> RESTRICTED if any open dispute)"

      - from: IN_REVIEW
        to: RESOLVED_VENDOR_FAULT
        trigger: "POST /concierge/disputes/{disputeId}/resolve"
        actor: ProgramUnderwriter
        preconditions: []
        side_effects:
          - "vendor.quality_score_bp = max(0, quality_score_bp - VENDOR_FAULT_PENALTY_BP)"
          - "concierge_case.posture recomputed"
          - "If vendor_engagement.status == DISPUTED: vendor_engagement -> IN_WORK"

      - from: IN_REVIEW
        to: RESOLVED_HOMEOWNER_FAULT
        trigger: "POST /concierge/disputes/{disputeId}/resolve"
        actor: ProgramUnderwriter
        preconditions: []
        side_effects:
          - "concierge_case.posture recomputed"
          - "If vendor_engagement.status == DISPUTED: vendor_engagement -> IN_WORK"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /concierge/disputes/{disputeId}/withdraw"
        actor: Homeowner
        preconditions: []
        side_effects:
          - "concierge_case.posture recomputed"
          - "If vendor_engagement.status == DISPUTED: vendor_engagement -> IN_WORK"

  - entity: ClosingStatement
    initial_state: DRAFT
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /concierge/closing-statements/{statementId}/finalize"
        actor: ProgramUnderwriter
        preconditions:
          - "All Disputes on the case are in terminal status"
        side_effects:
          - "program_fee_cents, late_fee_cents, vendor_holdback_cents, net_repayment_cents computed"

      - from: FINALIZED
        to: PAID
        trigger: "POST /concierge/closing-statements/{statementId}/pay"
        actor: Homeowner
        preconditions:
          - "concierge_case.status in {CLOSED_SOLD, CLOSED_UNSOLD}"
        side_effects: []

      - from: FINALIZED
        to: WAIVED
        trigger: "POST /concierge/closing-statements/{statementId}/waive"
        actor: ProgramUnderwriter
        preconditions:
          - "concierge_case.status == CLOSED_UNSOLD"
          - "market_risk_flag == true on the most recent ListingEvent before closed_at"
        side_effects:
          - "net_repayment_cents adjusted to advance_repayment_cents only (fees waived)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: case-plan-approve-stale-case
    parent_entity: ConciergeCase
    write_endpoint: "POST /concierge/cases/{caseId}/plan/approve"
    occ_field: "expected_case_version"
    description: |
      Approving an improvement plan against a ConciergeCase whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just approved a project (which bumps
      the case version via the advance_total_cents cascade) and the current
      writer's view of the case is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: disbursement-approve-stale-case
    parent_entity: ConciergeCase
    write_endpoint: "POST /concierge/disbursements/{disbursementId}/approve"
    occ_field: "expected_case_version"
    description: |
      Approving a disbursement against a ConciergeCase whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just approved a different disbursement
      or change order (which bumps advance_total_cents) and the current
      writer's view of the remaining headroom is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: advance_limit_cents
    trigger: "concierge case eligibility approval"
    algorithm: threshold
    formula: |
      advance_limit_cents = floor(expected_sale_proceeds_cents * ADVANCE_LIMIT_RATE)
      If homeowner_contribution_cents > 0:
        advance_limit_cents = min(advance_limit_cents, expected_sale_proceeds_cents - estimated_property_value_cents)
    constants:
      ADVANCE_LIMIT_RATE: 0.15
      MIN_EQUITY_RATIO: 1.10
      LATE_GRACE_DAYS: 7
    precision: "integer cents, floor"

  - name: listing_price_target_cents
    trigger: "plan approval"
    algorithm: aggregation
    formula: |
      listing_price_target_cents = estimated_property_value_cents +
        sum(expected_sale_price_lift_cents for ImprovementProject where status == APPROVED)
    precision: "integer cents"

  - name: program_fee_cents
    trigger: "closing statement finalization"
    algorithm: dual_variant
    formula: |
      Variant A (SOLD_WITHIN_WINDOW or LISTED_WITHIN_WINDOW):
        program_fee_cents = round_half_up(advance_repayment_cents * PROGRAM_FEE_RATE_A)
      Variant B (NOT_LISTED_WITHIN_WINDOW or SOLD_AFTER_WINDOW):
        program_fee_cents = round_half_up(advance_repayment_cents * PROGRAM_FEE_RATE_B) +
                            round_half_up(advance_repayment_cents * LATE_ACCRUAL_RATE * months_late)
      where months_late = ceil(days_between(listed_at, closed_at) - listing_window_days) / 30)
    constants:
      PROGRAM_FEE_RATE_A: 0.03
      PROGRAM_FEE_RATE_B: 0.01
      LATE_ACCRUAL_RATE: 0.005
    precision: "integer cents, round_half_up per line then sum"
    variants:
      - name: variant_a
        when: "Home listed and sold within listing_window_days"
        difference: "Single 3% fee on advance principal"
      - name: variant_b
        when: "Home not sold within listing_window_days"
        difference: "Reduced 1% base fee plus 0.5% per month late accrual"

  - name: late_fee_cents
    trigger: "closing statement finalization"
    algorithm: threshold
    formula: |
      if payoff_basis in {NOT_LISTED_WITHIN_WINDOW, SOLD_AFTER_WINDOW}:
        late_fee_cents = round_half_up(advance_repayment_cents * LATE_FEE_RATE * months_late)
      else:
        late_fee_cents = 0
      months_late computed as in program_fee_cents
    constants:
      LATE_FEE_RATE: 0.002
    precision: "integer cents, round_half_up"

  - name: vendor_holdback_cents
    trigger: "closing statement finalization"
    algorithm: aggregation
    formula: |
      vendor_holdback_cents = sum(claimed_amount_cents for Dispute where status == IN_REVIEW)
      # Note: OPEN disputes are excluded — only IN_REVIEW disputes trigger holdback
    precision: "integer cents"

  - name: net_repayment_cents
    trigger: "closing statement finalization"
    algorithm: circular_resolution
    formula: |
      # Evaluation order is pinned to resolve the circular-looking dependency:
      # 1. advance_repayment_cents = sum(amount_cents for Disbursement where status == RELEASED)
      # 2. payoff_basis determined from listing events and clock
      # 3. program_fee_cents depends on payoff_basis and advance_repayment_cents
      # 4. late_fee_cents depends on payoff_basis and advance_repayment_cents
      # 5. vendor_holdback_cents from open disputes
      # 6. net_repayment_cents = advance_repayment_cents + program_fee_cents + late_fee_cents - vendor_holdback_cents
    precision: "integer cents"

  - name: vendor_quality_score_bp
    trigger: "dispute resolution or late completion"
    algorithm: weighted_scoring
    formula: |
      On VENDOR_FAULT resolution:
        quality_score_bp = max(0, quality_score_bp - VENDOR_FAULT_PENALTY_BP)
      On LATE completion:
        quality_score_bp = max(0, quality_score_bp - LATE_PENALTY_BP)
      On ON_TIME completion with no dispute:
        quality_score_bp = min(10000, quality_score_bp + QUALITY_RECOVERY_BP)
    constants:
      VENDOR_FAULT_PENALTY_BP: 500
      LATE_PENALTY_BP: 200
      QUALITY_RECOVERY_BP: 50
    precision: "integer basis points"

  - name: posture
    trigger: "dispute opened, dispute resolved, market_risk_flag set"
    algorithm: derived
    formula: |
      if any Dispute on case in {OPEN, IN_REVIEW} and market_risk_flag == true:
        posture = FROZEN
      else if any Dispute on case in {OPEN, IN_REVIEW}:
        posture = RESTRICTED
      else:
        posture = OPEN

  - name: capacity_overlap_check
    trigger: "vendor engagement start"
    algorithm: interval_merge
    formula: |
      A VendorCapacityWindow covers [window_start, window_end) — half-open.
      An engagement [start_date, end_date) overlaps if:
        start_date < window_end AND end_date > window_start
      # Note: end_date is exclusive for capacity purposes even though the
      # engagement's completion_deadline uses end_date + LATE_GRACE_DAYS (7 days).
    precision: "datetime comparison, strict inequality"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role must have permission for this endpoint"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Resource IDs must exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Resource must be in correct state for operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All state transition endpoints"

  - priority: 5
    category: business_safety
    check: "ConciergeCase posture must not be FROZEN for homeowner-initiated actions"
    error_id: ERR_CASE_FROZEN
    http_status: 409
    applies_to: "Case cancel, project cancel, engagement cancel, dispute withdraw"

  - priority: 6
    category: business_referential
    check: "Cross-entity state precondition: vendor engagement must reference an APPROVED project"
    error_id: ERR_PROJECT_NOT_APPROVED
    http_status: 409
    applies_to: "VendorEngagement create"

  - priority: 7
    category: business_temporal
    check: "Vendor capacity window must cover engagement dates"
    error_id: ERR_VENDOR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "VendorEngagement start"

  - priority: 8
    category: business_fiscal
    check: "Advance limit headroom check"
    error_id: ERR_ADVANCE_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "Disbursement approve, ChangeOrder approve"

  - priority: 9
    category: business_fiscal
    check: "Disbursement release blocked by open dispute on same engagement"
    error_id: ERR_DISPUTE_ACTIVE
    http_status: 409
    applies_to: "Disbursement release"

  - priority: 10
    category: business_constraint
    check: "Listing event sequence must be monotonic (LISTED before OFFER_ACCEPTED before CLOSED_SOLD)"
    error_id: ERR_LISTING_EVENT_ORDER
    http_status: 409
    applies_to: "ListingEvent create"

  - priority: 11
    category: business_temporal
    check: "CLOSED_UNSOLD requires listed_at + listing_window_days <= event_at"
    error_id: ERR_LISTING_WINDOW_NOT_ELAPSED
    http_status: 409
    applies_to: "ListingEvent create with event_kind=CLOSED_UNSOLD"

  - priority: 12
    category: business_safety
    check: "Closing statement finalization blocked by non-terminal disputes"
    error_id: ERR_DISPUTE_NOT_TERMINAL
    http_status: 409
    applies_to: "ClosingStatement finalize"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- Test-driving clock endpoint ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Default startup time is 2026-09-01T00:00:00Z."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string }"
    side_effects: ["Update logical clock"]

  # --- Agent ---
  - method: POST
    path: "/concierge/agents"
    description: "Create an Agent"
    roles: [PlatformAdmin]
    code: 201
    input: [display_name, license_number, brokerage]
    output: Agent
    side_effects: []

  - method: GET
    path: "/concierge/agents/{agentId}"
    description: "Get an Agent"
    roles: [Any]
    code: 200
    input: []
    output: Agent
    side_effects: []

  # --- Vendor ---
  - method: POST
    path: "/concierge/vendors"
    description: "Create a Vendor"
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, trade]
    output: Vendor
    side_effects: ["quality_score_bp=10000, on_time_streak=0"]

  - method: GET
    path: "/concierge/vendors/{vendorId}"
    description: "Get a Vendor"
    roles: [Any]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/concierge/vendors"
    description: "List Vendors"
    roles: [Any]
    code: 200
    input: ["trade?"]
    output: "Vendor[]"
    side_effects: []

  # --- VendorCapacityWindow ---
  - method: POST
    path: "/concierge/vendors/{vendorId}/capacity-windows"
    description: "Create a VendorCapacityWindow"
    roles: [PlatformAdmin]
    code: 201
    input: [window_start, window_end, capacity_crew_days]
    output: VendorCapacityWindow
    side_effects: ["reserved_crew_days=0, status=OPEN"]

  - method: GET
    path: "/concierge/vendors/{vendorId}/capacity-windows"
    description: "List capacity windows for a vendor"
    roles: [Any]
    code: 200
    input: []
    output: "VendorCapacityWindow[]"
    side_effects: []

  # --- ConciergeCase ---
  - method: POST
    path: "/concierge/cases"
    description: "Create a ConciergeCase"
    roles: [ListingAgent]
    code: 201
    input: ["address_line", "estimated_property_value_cents", "expected_sale_proceeds_cents", "listing_agreement_signed", "listing_agreement_disclosure_ack", "homeowner_contribution_cents?", "listing_window_days?", "advance_total_cents?"]
    output: ConciergeCase
    side_effects: ["status=ELIGIBILITY_REVIEW"]

  - method: GET
    path: "/concierge/cases/{caseId}"
    description: "Get a ConciergeCase"
    roles: [Any]
    code: 200
    input: []
    output: ConciergeCase
    side_effects: []

  - method: GET
    path: "/concierge/cases"
    description: "List ConciergeCases"
    roles: [Any]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ConciergeCase[]"
    side_effects: []

  - method: POST
    path: "/concierge/cases/{caseId}/eligibility/approve"
    description: "Approve case eligibility"
    roles: [ProgramUnderwriter]
    code: 200
    input: []
    output: ConciergeCase
    side_effects: ["status -> SCOPE_PLANNING", "advance_limit_cents computed"]

  - method: POST
    path: "/concierge/cases/{caseId}/eligibility/reject"
    description: "Reject case eligibility"
    roles: [ProgramUnderwriter]
    code: 200
    input: []
    output: ConciergeCase
    side_effects: ["status -> CANCELLED"]

  - method: POST
    path: "/concierge/cases/{caseId}/plan/approve"
    description: "Approve improvement plan"
    roles: [Homeowner]
    code: 200
    input: [expected_case_version]
    output: ConciergeCase
    side_effects:
      - "status -> PLAN_APPROVED"
      - "listing_price_target_cents computed"
      - "increments ConciergeCase.version by 1"

  - method: POST
    path: "/concierge/cases/{caseId}/cancel"
    description: "Cancel a ConciergeCase"
    roles: [Homeowner]
    code: 200
    input: []
    output: ConciergeCase
    side_effects: ["status -> CANCELLED", "cascade to projects and engagements"]

  # --- ImprovementProject ---
  - method: POST
    path: "/concierge/cases/{caseId}/projects"
    description: "Create an ImprovementProject"
    roles: [ListingAgent]
    code: 201
    input: [title, recommended_by_agent, expected_sale_price_lift_cents, estimated_cost_cents]
    output: ImprovementProject
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/concierge/cases/{caseId}/projects/{projectId}"
    description: "Get an ImprovementProject"
    roles: [Any]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: []

  - method: GET
    path: "/concierge/cases/{caseId}/projects"
    description: "List projects for a case"
    roles: [Any]
    code: 200
    input: []
    output: "ImprovementProject[]"
    side_effects: []

  - method: POST
    path: "/concierge/cases/{caseId}/projects/{projectId}/propose"
    description: "Propose a project"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: ["status -> PROPOSED"]

  - method: POST
    path: "/concierge/cases/{caseId}/projects/{projectId}/approve"
    description: "Approve a project"
    roles: [Homeowner]
    code: 200
    input: []
    output: ImprovementProject
    side_effects:
      - "status -> APPROVED"
      - "approved_cost_cents = estimated_cost_cents"
      - "concierge_case.advance_total_cents += approved_cost_cents"
      - "increments ConciergeCase.version by 1"

  - method: POST
    path: "/concierge/cases/{caseId}/projects/{projectId}/verify"
    description: "Verify a completed project"
    roles: [ListingAgent]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: ["status -> VERIFIED"]

  - method: POST
    path: "/concierge/cases/{caseId}/projects/{projectId}/cancel"
    description: "Cancel a project"
    roles: [Homeowner]
    code: 200
    input: []
    output: ImprovementProject
    side_effects: ["status -> CANCELLED"]

  # --- VendorEngagement ---
  - method: POST
    path: "/concierge/engagements"
    description: "Create a VendorEngagement"
    roles: [ListingAgent]
    code: 201
    input: [improvement_project_id, vendor_id, agreed_price_cents, start_date, end_date]
    output: VendorEngagement
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/concierge/engagements/{engagementId}"
    description: "Get a VendorEngagement"
    roles: [Any]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: []

  - method: GET
    path: "/concierge/engagements"
    description: "List VendorEngagements"
    roles: [Any]
    code: 200
    input: ["improvement_project_id?", "vendor_id?"]
    output: "VendorEngagement[]"
    side_effects: []

  - method: POST
    path: "/concierge/engagements/{engagementId}/start"
    description: "Start a vendor engagement"
    roles: [Vendor]
    code: 200
    input: []
    output: VendorEngagement
    side_effects:
      - "status -> IN_WORK"
      - "VendorCapacityWindow.reserved_crew_days += required_crew_days"
      - "improvement_project.status -> SCHEDULED or IN_WORK"

  - method: POST
    path: "/concierge/engagements/{engagementId}/complete"
    description: "Complete a vendor engagement"
    roles: [Vendor]
    code: 200
    input: []
    output: VendorEngagement
    side_effects:
      - "status -> COMPLETE_ON_TIME or COMPLETE_LATE"
      - "Vendor.on_time_streak and quality_score_bp updated"

  - method: POST
    path: "/concierge/engagements/{engagementId}/cancel"
    description: "Cancel a vendor engagement"
    roles: [Homeowner]
    code: 200
    input: []
    output: VendorEngagement
    side_effects: ["status -> CANCELLED", "release reserved crew-days"]

  # --- Disbursement ---
  - method: POST
    path: "/concierge/disbursements"
    description: "Create a Disbursement"
    roles: [ProgramUnderwriter]
    code: 201
    input: [concierge_case_id, improvement_project_id, vendor_engagement_id, amount_cents, kind]
    output: Disbursement
    side_effects: ["status=REQUESTED", "sequence_in_case assigned"]

  - method: GET
    path: "/concierge/disbursements/{disbursementId}"
    description: "Get a Disbursement"
    roles: [Any]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/concierge/disbursements"
    description: "List Disbursements"
    roles: [Any]
    code: 200
    input: ["concierge_case_id?", "improvement_project_id?"]
    output: "Disbursement[]"
    side_effects: []

  - method: POST
    path: "/concierge/disbursements/{disbursementId}/approve"
    description: "Approve a disbursement"
    roles: [ProgramUnderwriter]
    code: 200
    input: [expected_case_version]
    output: Disbursement
    side_effects:
      - "status -> APPROVED"
      - "concierge_case.advance_total_cents += amount_cents"
      - "increments ConciergeCase.version by 1"

  - method: POST
    path: "/concierge/disbursements/{disbursementId}/release"
    description: "Release a disbursement to vendor"
    roles: [ProgramUnderwriter]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status -> RELEASED"]

  - method: POST
    path: "/concierge/disbursements/{disbursementId}/void"
    description: "Void a disbursement"
    roles: [ProgramUnderwriter]
    code: 200
    input: []
    output: Disbursement
    side_effects: ["status -> VOIDED", "advance_total_cents reversed if was APPROVED"]

  # --- ChangeOrder ---
  - method: POST
    path: "/concierge/change-orders"
    description: "Create a ChangeOrder"
    roles: [Vendor]
    code: 201
    input: [improvement_project_id, vendor_engagement_id, delta_cents, reason]
    output: ChangeOrder
    side_effects: ["status=PENDING"]

  - method: GET
    path: "/concierge/change-orders/{changeOrderId}"
    description: "Get a ChangeOrder"
    roles: [Any]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: []

  - method: GET
    path: "/concierge/change-orders"
    description: "List ChangeOrders"
    roles: [Any]
    code: 200
    input: ["improvement_project_id?"]
    output: "ChangeOrder[]"
    side_effects: []

  - method: POST
    path: "/concierge/change-orders/{changeOrderId}/approve"
    description: "Approve a change order"
    roles: [Homeowner]
    code: 200
    input: []
    output: ChangeOrder
    side_effects:
      - "status -> APPROVED"
      - "improvement_project.cost_overrun_cents recomputed"
      - "concierge_case.advance_total_cents += delta_cents"
      - "increments ConciergeCase.version by 1"

  - method: POST
    path: "/concierge/change-orders/{changeOrderId}/reject"
    description: "Reject a change order"
    roles: [Homeowner]
    code: 200
    input: []
    output: ChangeOrder
    side_effects: ["status -> REJECTED"]

  # --- Dispute ---
  - method: POST
    path: "/concierge/disputes"
    description: "Create a Dispute"
    roles: [Homeowner, Vendor]
    code: 201
    input: [concierge_case_id, improvement_project_id, vendor_engagement_id, dispute_kind, claimed_amount_cents]
    output: Dispute
    side_effects:
      - "status=OPEN"
      - "concierge_case.posture recomputed"
      - "vendor_engagement.status -> DISPUTED if IN_WORK"

  - method: GET
    path: "/concierge/disputes/{disputeId}"
    description: "Get a Dispute"
    roles: [Any]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/concierge/disputes"
    description: "List Disputes"
    roles: [Any]
    code: 200
    input: ["concierge_case_id?", "vendor_engagement_id?"]
    output: "Dispute[]"
    side_effects: []

  - method: POST
    path: "/concierge/disputes/{disputeId}/review"
    description: "Move dispute to IN_REVIEW"
    roles: [ProgramUnderwriter]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> IN_REVIEW", "posture recomputed"]

  - method: POST
    path: "/concierge/disputes/{disputeId}/resolve"
    description: "Resolve a dispute"
    roles: [ProgramUnderwriter]
    code: 200
    input: [resolution]
    output: Dispute
    side_effects:
      - "status -> RESOLVED_VENDOR_FAULT or RESOLVED_HOMEOWNER_FAULT"
      - "vendor.quality_score_bp updated if VENDOR_FAULT"
      - "posture recomputed"

  - method: POST
    path: "/concierge/disputes/{disputeId}/withdraw"
    description: "Withdraw a dispute"
    roles: [Homeowner]
    code: 200
    input: []
    output: Dispute
    side_effects: ["status -> WITHDRAWN", "posture recomputed"]

  # --- ListingEvent ---
  - method: POST
    path: "/concierge/cases/{caseId}/listing-events"
    description: "Record a listing event"
    roles: [ListingAgent]
    code: 201
    input: ["event_kind", "event_at", "price_cents?", "market_risk_flag?"]
    output: ListingEvent
    side_effects: ["May transition ConciergeCase status"]

  - method: GET
    path: "/concierge/cases/{caseId}/listing-events"
    description: "List listing events for a case"
    roles: [Any]
    code: 200
    input: []
    output: "ListingEvent[]"
    side_effects: []

  # --- ClosingStatement ---
  - method: GET
    path: "/concierge/cases/{caseId}/closing-statement"
    description: "Get the closing statement for a case"
    roles: [Any]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: []

  - method: POST
    path: "/concierge/closing-statements/{statementId}/finalize"
    description: "Finalize a closing statement"
    roles: [ProgramUnderwriter]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: ["status -> FINALIZED", "fees computed"]

  - method: POST
    path: "/concierge/closing-statements/{statementId}/pay"
    description: "Record payment of closing statement"
    roles: [Homeowner]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: ["status -> PAID"]

  - method: POST
    path: "/concierge/closing-statements/{statementId}/waive"
    description: "Waive fees on a closing statement"
    roles: [ProgramUnderwriter]
    code: 200
    input: []
    output: ClosingStatement
    side_effects: ["status -> WAIVED", "net_repayment_cents adjusted"]

  # --- Vendor reverse-reachability for FK ---
  - method: GET
