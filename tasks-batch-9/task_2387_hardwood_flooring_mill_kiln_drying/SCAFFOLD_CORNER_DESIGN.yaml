          rationale: "The named §1.8 instance raises ERR_PREFINISH_CAPACITY_EXCEEDED from the aggregate of overlapping half-open windows."
      - name: warranty_reserve_insufficient_triggerable
        claim_type: error_triggerable
        grounds: ["errors[ERR_WARRANTY_RESERVE_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / claim_state_beats_warranty_reserve_insufficient"
          rationale: "The named §1.8 instance raises ERR_WARRANTY_RESERVE_INSUFFICIENT once the blocking state error is cleared."

  - section: rbac
    instances:
      - name: species_profile_create_without_role_header_unauthenticated
        claim_type: authentication_required
        grounds: ["rbac.roles[Anonymous]", "validations[priority 1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "The missing X-Role header is rejected at priority 1 with 401 even though the payload is otherwise valid, and it beats the 400 that a bad payload would earn."
        test_recipe:
          setup: ["An empty database beyond the logical clock."]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: MillAdmin }
          trigger:
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", common_name: "Red Oak", density_class: "DENSE", tangential_shrinkage_coefficient: 0.145, target_moisture_pct: 7.0, max_moisture_gradient_pp: 2.0 }, as: Anonymous }
            - { call: "POST /mill/species-profiles", payload: { species_code: "RED_OAK", density_class: "NOT_A_CLASS" }, as: Anonymous }
            - { call: "GET /mill/species-profiles", payload: {}, as: Anonymous }
          assert:
            - "Valid payload with no role header: status 401 with data.error_id == \"ERR_UNAUTHENTICATED\"."
            - "Malformed payload with no role header: status 401 with data.error_id == \"ERR_UNAUTHENTICATED\", not 400 - authentication precedes schema validation."
            - "Anonymous read: status 401 with data.error_id == \"ERR_UNAUTHENTICATED\" - reads are not public."
            - "GET /mill/species-profiles as MillAdmin afterwards returns total_count 0 - no anonymous call wrote anything."

