        distinguishing_aspect: |
          Different metric and different endpoint from the notice instance: the metric is overlap_days /
          days_credited produced by the interval intersection against the closed base window, and the endpoint
          is the exclusion decision. The edge is the base_due_date itself — a claim starting on 2026-09-30
          credits exactly 1 day and is approvable, a claim starting one day later credits 0 and is rejected.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z, consent effective 2026-08-01T09:00:00Z, so clock_start_date 2026-08-01 and the closed base window is [2026-08-01, 2026-09-30]."
            - "The clock is advanced to 2026-10-10T00:00:00Z (no compliance run, so compliance_status stays ON_TRACK and both decisions remain permissible)."
            - "Exclusion A claims BREAK_CLOSURE 2026-09-30..2026-10-05 and is approved (6 days claimed, exactly 1 creditable), moving statutory_due_date to 2026-10-01."
            - "Exclusion B claims BREAK_CLOSURE 2026-10-01..2026-10-06 and sits CLAIMED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
            - call: "POST /psych-services/schools"
