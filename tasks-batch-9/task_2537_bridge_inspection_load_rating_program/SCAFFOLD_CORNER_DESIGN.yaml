      - name: federal_submission_accept_below_ninety_percent_compliance_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_COMPLIANCE_BELOW_THRESHOLD
          - validations.priority_34
          - calculations.inspection_compliance_pct
        distinguishing_aspect: "Compliance is computed statewide over ALL bridges at submit time, including never-inspected ones whose due date was derived from their creation date: one stale bridge out of three yields 66.67 and blocks ACCEPT with 422, while REJECT is still permitted and records rejection_reason_code COMPLIANCE_BELOW_THRESHOLD."
        test_recipe:
          setup:
            - "Logical clock pinned to 2020-01-01T00:00:00Z, one bridge created there (interval 24 months from the default 7/7/7 seeds, so next_inspection_due_date 2022-01-01), then the clock is moved to 2026-09-01T00:00:00Z and two more bridges are created (due 2028-09-01)."
            - "No bridge has a scour evaluation, so every poa_compliant is true and the priority-29 gate passes."
            - "A LOCKED 2027 cycle with a BUILDING annual submission, submitted by admin ProgramAdmin user pa-1; the FHWA reviewer is a different user, fr-9."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2020-01-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000001", name: "Cedar Creek Bridge", owner_agency: "STATE_DOT", structure_type: "STEEL_GIRDER", deck_area_sqm: 1000, year_built: 1972, adt: 12000, detour_length_km: 8.5, spans_water: true }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { br_stale_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000002", name: "Willow Slough Bridge", owner_agency: "STATE_DOT", structure_type: "CONCRETE_BOX", deck_area_sqm: 600, year_built: 1988, adt: 3000, detour_length_km: 2.0 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { br_ok1_id: $.data.id }
            - call: "POST /bridges"
              payload: { nbi_structure_number: "STR-000003", name: "Rock Fork Bridge", owner_agency: "COUNTY", structure_type: "PRESTRESSED_GIRDER", deck_area_sqm: 450, year_built: 1996, adt: 900, detour_length_km: 12.0 }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { br_ok2_id: $.data.id }
            - call: "POST /program-cycles"
              payload: { fiscal_year: 2027, authorized_budget_cents: 10000000000, ranking_policy: "CONDITION_BASED" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pc_id: $.data.id }
            - call: "POST /program-cycles/${pc_id}/lock"
              payload: {}
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /program-cycles/${pc_id}/federal-submissions"
              payload: { submission_type: "ANNUAL_NBI" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fs_id: $.data.id }
            - call: "POST /federal-submissions/${fs_id}/submit"
              payload: {}
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fs_status: $.data.status }
          trigger:
            - call: "POST /federal-submissions/${fs_id}/review"
              payload: { decision: "ACCEPT" }
              as: FhwaReviewer
              as_user_id: "fr-9"
              captures: { err_compliance: $.data.error_id }
            - call: "POST /federal-submissions/${fs_id}/review"
              payload: { decision: "REJECT" }
              as: FhwaReviewer
              as_user_id: "fr-9"
              captures: { rejected_status: $.data.status }
          assert:
            - "After submit, FederalSubmission.${fs_id}.total_bridge_count == 3, overdue_inspection_count == 1 (only ${br_stale_id}, whose due date 2022-01-01 is strictly before 2026-09-01) and inspection_compliance_pct == 66.67"
            - "poa_noncompliant_count == 0, open_immediate_finding_count == 0 and error_count == 0 - the block is purely the compliance percentage"
            - "The ACCEPT returns 422 with data.error_id == ERR_COMPLIANCE_BELOW_THRESHOLD; status stays SUBMITTED, reviewed_at stays null and ProgramCycle.${pc_id}.status stays SUBMITTED"
            - "The REJECT returns 200 with status REJECTED, rejection_reason_code == COMPLIANCE_BELOW_THRESHOLD (not DATA_GAPS, because the percentage is the failing input) and reviewer_user_id == fr-9"
            - "ProgramCycle.${pc_id}.status returns to LOCKED after the rejection, leaving the resubmission loop open"

