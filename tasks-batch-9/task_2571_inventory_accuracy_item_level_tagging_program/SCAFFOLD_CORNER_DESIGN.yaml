            - "One stock position at S100 for TEE-001 with 100 units, so the FAIL cascade has a position to hold."
            - "A TagBatch for VEND1 / TEE-001 / S100 with quantity_encoded 1000, encoded (required_sample_units 50) and received."
          setup_api_calls:
