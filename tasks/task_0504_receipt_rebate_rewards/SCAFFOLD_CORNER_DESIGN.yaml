              as: ReviewAgent
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 403"
            - "response.data.error_id == ERR_FORBIDDEN"

      - name: missing_role_header_unauthenticated
        claim_type: peer_roles
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "A request with an unrecognized X-User-Role -> ERR_UNAUTHENTICATED (401), checked before authorization."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /merchants"
              payload: { name: "M", online_rate_bps: 500, instore_rate_bps: 200 }
              as: Nobody
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 401"
            - "response.data.error_id == ERR_UNAUTHENTICATED"

