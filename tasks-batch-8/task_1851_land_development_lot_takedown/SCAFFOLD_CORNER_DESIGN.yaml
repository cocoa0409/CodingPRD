              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${ocp}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "OCB", license_number: "LIC-OC", contact_email: "oc@x.com" }
              as: DeveloperOperator
              captures: { ocb: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${ocp}", builder_id: "${ocb}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 2 }
              as: DeveloperOperator
              captures: { ocag: $.data.id }
            - call: "POST /api/takedown-agreements/${ocag}/activate"
              payload: {}
              as: DeveloperOperator
              captures: { ocag_v: $.data.version }
          trigger:
            - call: "POST /api/takedown-agreements/${ocag}/amend"
              payload: { expected_agreement_version: "${ocag_v}", price_cap_bp: 12500 }
              as: DeveloperOperator
              captures: { ocag_v2: $.data.version, ocag_cap: $.data.price_cap_bp }
            - call: "POST /api/takedown-agreements/${ocag}/amend"
              payload: { expected_agreement_version: "${ocag_v}", price_cap_bp: 13000 }
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "first amend: captured ocag_v2 == ocag_v + 1 and ocag_cap == 12500"
            - "second amend replaying the stale captured version: captured err == ERR_STALE_AGREEMENT_VERSION (412)"
            - "agreement still shows price_cap_bp 12500 after the rejected amend"

