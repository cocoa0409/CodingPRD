# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# 1099 Vendor Reporting & W-9 Collection
# 9 rules x >=2 instances = 20 active instances.
# All chains replay from empty DB using only SCAFFOLD.yaml §1.5 endpoints.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (different entity domains: TaxReturn vs Remittance)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: return_box_provisional_vs_final_on_late_payment
        grounds:
          - calculations.reportable_box_aggregation
          - state_machines.TaxReturn.federal_status.VALIDATED_to_TRANSMITTED
          - entities.TaxReturn.fields.provisional_box_amounts
          - entities.TaxReturn.fields.amount_basis
        distinguishing_aspect: |
          Same vendor-year ledger, two valid aggregation bases on the TaxReturn
          domain: PROVISIONAL (payments existing at generate time) yields
          box_1_cents 100000, FINAL (all POSTED in-year payments, including the
          late-recorded one) yields box_1_cents 125000 — both fields coexist on
          the same return and MUST differ.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN (default thresholds 60000, efile threshold 10, copy deadline 2026-01-31T00:00:00Z)"
            - "Vendor V (INDIVIDUAL_SOLE_PROP) with a MATCHED W-9 (tin 123456789)"
            - "Payment P1 100000c SERVICE dated 2025-03-10 recorded BEFORE generate; payment P2 25000c SERVICE dated 2025-11-20 recorded AFTER generate"
            - "NEC return exists as DRAFT with provisional box_1 100000; then VALIDATED; then sealed (FINAL recompute)"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Able Contracting", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "1 Main St", address_city: "Austin", address_state: "TX", address_postal: "78701" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Able Contracting", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "A Able" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-03-10T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}", tax_year: 2025 }, as: TaxSpecialist, captures: { r: "$.data[0].id"} }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "CORP_CARD", payment_type: "SERVICE", amount_cents: 25000, payment_date: "2025-11-20T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1" }
          trigger:
            - { call: "GET /tax1099/returns/${r}", payload: {}, as: TaxSpecialist }
          assert:
            - "TaxReturn.${r}.provisional_box_amounts.box_1_cents == 100000"
            - "TaxReturn.${r}.box_amounts.box_1_cents == 125000"
            - "TaxReturn.${r}.amount_basis == FINAL"
            - "TaxReturn.${r}.federal_status == TRANSMITTED"

      - name: remittance_accrual_vs_statutory_divergence
        grounds:
          - calculations.withholding_reconciliation
          - entities.Remittance.fields.amount_cents
          - entities.Remittance.fields.statutory_expected_cents
        distinguishing_aspect: |
          Same withheld payments, two valid bases on the Remittance domain
          (different entity domain from the TaxReturn instance): ACCRUAL sums
          per-payment rounded entries (244 + 250 = 494) while STATUTORY rounds
          the aggregate once (round_half_up(2055 * 0.24) = 493) — the remittance
          MUST expose both and they MUST differ by exactly 1 cent.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN"
            - "Vendor V (INDIVIDUAL_SOLE_PROP) with a MISMATCHED W-9 (backup_withholding_flag = true)"
            - "Payments 1015c (2025-04-10, Q2) and 1040c (2025-05-10, Q2), each accruing per-payment withholding"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Baker LLC", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "2 Oak Ave", address_city: "Dallas", address_state: "TX", address_postal: "75201" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Baker LLC", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "B Baker" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 1015, payment_date: "2025-04-10T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 1040, payment_date: "2025-05-10T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/remittances", payload: { tax_year: 2025, quarter: 2 }, as: TaxSpecialist, as_user_id: "spec-1", captures: { rem: $.data.id } }
          trigger:
            - { call: "POST /tax1099/remittances/${rem}/submit", payload: {}, as: TaxTransmitter, as_user_id: "xmtr-1" }
            - { call: "GET /tax1099/remittances/${rem}", payload: {}, as: TaxSpecialist }
          assert:
            - "Remittance.${rem}.amount_cents == 494"
            - "Remittance.${rem}.statutory_expected_cents == 493"
            - "Remittance.${rem}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (modes a, b, c — three different modes)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: box_mapping_classification_matrix
        grounds:
          - calculations.box_classification
          - entities.Payment.fields.reportable_box
        distinguishing_aspect: |
          Mode (a) — a 3-input branch formula (payment_type x vendor
          entity_classification x exemption set): identical SERVICE payments are
          reportable NEC_1 for an individual but NONE for a C_CORP, while
          ATTORNEY_FEE pierces the corporate exemption and MEDICAL_HEALTH routes
          an LLC_S to MISC_6.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN"
            - "Vendors IND (INDIVIDUAL_SOLE_PROP), CORP (C_CORP), LLCS (LLC_S), each with a MATCHED W-9"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Ind", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "1 A St", address_city: "Austin", address_state: "TX", address_postal: "78701" }, as: APClerk, captures: { v_ind: $.data.id } }
            - { call: "POST /tax1099/vendors/${v_ind}/w9-submissions", payload: { submitted_legal_name: "Ind", submitted_tin: "111111111", submitted_tin_type: "SSN", signature_name: "I" }, as: APClerk, captures: { w_ind: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w_ind}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Corp", entity_classification: "C_CORP", address_line1: "2 B St", address_city: "Dallas", address_state: "TX", address_postal: "75201" }, as: APClerk, captures: { v_corp: $.data.id } }
            - { call: "POST /tax1099/vendors/${v_corp}/w9-submissions", payload: { submitted_legal_name: "Corp", submitted_tin: "222222222", submitted_tin_type: "EIN", signature_name: "C" }, as: APClerk, captures: { w_corp: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w_corp}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Llcs", entity_classification: "LLC_S", address_line1: "3 C St", address_city: "Houston", address_state: "TX", address_postal: "77001" }, as: APClerk, captures: { v_llcs: $.data.id } }
            - { call: "POST /tax1099/vendors/${v_llcs}/w9-submissions", payload: { submitted_legal_name: "Llcs", submitted_tin: "333333333", submitted_tin_type: "EIN", signature_name: "L" }, as: APClerk, captures: { w_llcs: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w_llcs}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v_ind}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 70000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { p_ind_svc: $.data.reportable_box } }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v_corp}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 70000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { p_corp_svc: $.data.reportable_box } }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v_corp}", source_system: "AP_ERP", payment_type: "ATTORNEY_FEE", amount_cents: 30000, payment_date: "2025-06-02T00:00:00Z" }, as: APClerk, captures: { p_corp_atty: $.data.reportable_box } }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v_llcs}", source_system: "AP_ERP", payment_type: "MEDICAL_HEALTH", amount_cents: 50000, payment_date: "2025-06-03T00:00:00Z" }, as: APClerk, captures: { p_llcs_med: $.data.reportable_box } }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v_ind}", source_system: "AP_ERP", payment_type: "RENT", amount_cents: 20000, payment_date: "2025-06-04T00:00:00Z" }, as: APClerk, captures: { p_ind_rent: $.data.reportable_box } }
          assert:
            - "Payment(ind SERVICE).reportable_box == NEC_1 and is_reportable == true"
            - "Payment(corp SERVICE).reportable_box == NONE and is_reportable == false"
            - "Payment(corp ATTORNEY_FEE).reportable_box == NEC_1 and is_reportable == true (corporate exemption pierced)"
            - "Payment(llcs MEDICAL_HEALTH).reportable_box == MISC_6 and is_reportable == true"
            - "Payment(ind RENT).reportable_box == MISC_1 and is_reportable == true"

      - name: withholding_per_payment_rounding_order
        grounds:
          - calculations.backup_withholding_amount
          - entities.Payment.fields.withheld_cents
          - entities.Vendor.fields.withholding_balance_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding order is pinned per-payment-then-sum:
          payments 1015c and 1040c round to 244c and 250c individually (vendor
          balance 494c); the forbidden aggregate-then-round order yields 493c.
          The test discriminates the two orders by exactly 1 cent.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN"
            - "Vendor V with MISMATCHED W-9 (backup_withholding_flag = true)"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Round Test", entity_classification: "PARTNERSHIP", address_line1: "9 Pine", address_city: "El Paso", address_state: "TX", address_postal: "79901" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Round Test", submitted_tin: "444444444", submitted_tin_type: "EIN", signature_name: "R" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_2" }, as: IRSSystem }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "MANUAL", payment_type: "SERVICE", amount_cents: 1015, payment_date: "2025-03-01T00:00:00Z" }, as: APClerk, captures: { w1: $.data.withheld_cents } }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "MANUAL", payment_type: "SERVICE", amount_cents: 1040, payment_date: "2025-03-02T00:00:00Z" }, as: APClerk, captures: { w2: $.data.withheld_cents } }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: APClerk }
          assert:
            - "first payment withheld_cents == 244 (round_half_up(1015*0.24)=round_half_up(243.6))"
            - "second payment withheld_cents == 250 (round_half_up(1040*0.24)=round_half_up(249.6))"
            - "Vendor.${v}.withholding_balance_cents == 494 (per-payment sum; NOT 493 from aggregate rounding)"

      - name: efile_channel_evaluation_order
        grounds:
          - calculations.efile_threshold_channel
          - state_machines.Transmittal.OPEN_to_SEALED
          - errors[ERR_EFILE_REQUIRED]
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency with pinned evaluation order:
          the transmittal's own member returns count toward the qualifying total
          that decides its channel. A NEC transmittal sealed at count 1 (PAPER)
          with threshold 2 MUST be re-evaluated at submit after a MISC return is
          validated (count 2 >= 2): declared PAPER is rejected with
          ERR_EFILE_REQUIRED even though the seal-time recommendation was PAPER.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN with efiling_threshold_count = 2"
            - "Vendor A matched with SERVICE 100000c (NEC return validated; transmittal sealed PAPER while count == 1)"
            - "Vendor B matched with RENT 70000c (MISC return validated AFTER the seal, lifting qualifying count to 2)"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z", efiling_threshold_count: 2 }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "A Co", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "1 A", address_city: "Austin", address_state: "TX", address_postal: "78701" }, as: APClerk, captures: { va: $.data.id } }
            - { call: "POST /tax1099/vendors/${va}/w9-submissions", payload: { submitted_legal_name: "A Co", submitted_tin: "555555555", submitted_tin_type: "SSN", signature_name: "A" }, as: APClerk, captures: { wa: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wa}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${va}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-04-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "B Co", entity_classification: "PARTNERSHIP", address_line1: "2 B", address_city: "Dallas", address_state: "TX", address_postal: "75201" }, as: APClerk, captures: { vb: $.data.id } }
            - { call: "POST /tax1099/vendors/${vb}/w9-submissions", payload: { submitted_legal_name: "B Co", submitted_tin: "666666666", submitted_tin_type: "EIN", signature_name: "B" }, as: APClerk, captures: { wb: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wb}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vb}", source_system: "AP_ERP", payment_type: "RENT", amount_cents: 70000, payment_date: "2025-04-02T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${va}", form_type: "NEC" }, as: TaxSpecialist, captures: { ra: "$.data[0].id"} }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${vb}", form_type: "MISC" }, as: TaxSpecialist, captures: { rb: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${ra}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1", captures: { ch0: $.data.filing_channel } }
            - { call: "POST /tax1099/returns/${rb}/validate", payload: {}, as: TaxSpecialist }
          trigger:
            - { call: "POST /tax1099/transmittals/${t}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-1", captures: { err: $.data.error_id } }
            - { call: "POST /tax1099/transmittals/${t}/submit", payload: { channel: "EFILE" }, as: TaxTransmitter, as_user_id: "xmtr-1" }
          assert:
            - "seal-time filing_channel == PAPER (qualifying_count 1 < threshold 2 at seal)"
            - "first submit error_id == ERR_EFILE_REQUIRED (recomputed qualifying_count 2 >= 2 at submit)"
            - "second submit succeeds: Transmittal.${t}.status == SUBMITTED"

  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cyclic Vendor.tin_match_status vs
  #           parallel dimensions on TaxReturn — different entities, shapes)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: vendor_tin_status_resubmission_cycle
        grounds:
          - state_machines.Vendor.tin_match_status
          - state_machines.W9Submission
        distinguishing_aspect: |
          Cyclic shape on Vendor: NOT_SUBMITTED -> PENDING_MATCH -> MISMATCHED
          -> PENDING_MATCH -> MATCHED loops through re-submission, and the cycle
          is observable through mismatch_count_3yr incrementing exactly once.
        test_recipe:
          setup: ["Vendor V freshly onboarded; no TaxYear needed (the chain touches no payments)"]
          setup_api_calls:
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Cycle V", entity_classification: "PARTNERSHIP", address_line1: "5 Elm", address_city: "Waco", address_state: "TX", address_postal: "76701" }, as: APClerk, captures: { v: $.data.id } }
          trigger:
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Cycle V", submitted_tin: "777777777", submitted_tin_type: "EIN", signature_name: "C" }, as: APClerk, captures: { w1: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w1}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Cycle V", submitted_tin: "777777777", submitted_tin_type: "EIN", signature_name: "C" }, as: APClerk, captures: { w2: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w2}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: APClerk }
          assert:
            - "after w9#1: Vendor.${v}.tin_match_status was PENDING_MATCH"
            - "after mismatch: tin_match_status was MISMATCHED, backup_withholding_flag == true"
            - "after w9#2: tin_match_status returned to PENDING_MATCH (cycle)"
            - "final: Vendor.${v}.tin_match_status == MATCHED, mismatch_count_3yr == 1, backup_withholding_flag == false, tin == 777777777"

      - name: tax_return_parallel_dimensions
        grounds:
          - state_machines.TaxReturn.federal_status
          - state_machines.TaxReturn.recipient_copy_status
          - entities.TaxReturn.fields.recipient_copy_status
        distinguishing_aspect: |
          Parallel state dimensions on TaxReturn (different entity AND different
          non-linear shape from the Vendor cycle): recipient_copy_status walks
          PENDING -> POSTAL_SENT -> UNDELIVERABLE while federal_status walks
          VALIDATED -> TRANSMITTED -> ACCEPTED, each dimension moving without
          disturbing the other, until E-delivery closes the copy loop.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN; logical clock 2026-01-15 (before copy deadline)"
            - "Vendor V matched with e_delivery_consent = true; SERVICE payment 100000c; NEC return DRAFT"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Par V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "6 Oak", address_city: "Lubbock", address_state: "TX", address_postal: "79401", e_delivery_consent: true }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Par V", submitted_tin: "888888888", submitted_tin_type: "SSN", signature_name: "P" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-15T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist }
          trigger:
            - { call: "POST /tax1099/returns/${r}/deliver-copy", payload: { channel: "POSTAL" }, as: TaxSpecialist }
            - { call: "POST /tax1099/returns/${r}/record-copy-bounce", payload: {}, as: IRSSystem }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1" }
            - { call: "POST /tax1099/transmittals/${t}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-1" }
            - { call: "POST /tax1099/transmittals/${t}/record-outcome", payload: { outcome: "ACCEPTED" }, as: IRSSystem }
            - { call: "GET /tax1099/returns/${r}", payload: {}, as: TaxSpecialist, captures: { fed: $.data.federal_status, cpy: $.data.recipient_copy_status } }
            - { call: "POST /tax1099/returns/${r}/deliver-copy", payload: { channel: "ELECTRONIC" }, as: TaxSpecialist }
          assert:
            - "after postal delivery: federal_status == VALIDATED and recipient_copy_status == POSTAL_SENT"
            - "after bounce: federal_status == VALIDATED and recipient_copy_status == UNDELIVERABLE"
            - "after accept: federal_status == ACCEPTED and recipient_copy_status == UNDELIVERABLE (dimensions independent)"
            - "final ELECTRONIC delivery: recipient_copy_status == E_DELIVERED, federal_status == ACCEPTED"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (two cascades, different triggers, depth >= 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: merge_approve_reparents_and_invalidates_returns
        grounds:
          - state_machines.VendorMergeRequest.PENDING_to_EXECUTED
          - state_machines.Vendor.ACTIVE_to_MERGED
          - state_machines.TaxReturn.federal_status.VALIDATED_to_DRAFT
        distinguishing_aspect: |
          Depth-3 cascade from merge approve (different trigger from the payment
          void cascade): approve -> source Vendor MERGED -> target's payments and
          withholding re-parented (target balance recomputed) -> target's
          VALIDATED return invalidated to DRAFT with FINAL-recomputed
          box_1_cents 150000 (100000 own + 50000 inherited).
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN"
            - "Source vendor S matched (tin 123456789), SERVICE payment 50000c (below threshold alone — no return)"
            - "Target vendor G matched (same tin 123456789), SERVICE payment 100000c, NEC return VALIDATED at box_1 100000"
            - "Merge request created by clerk-1, approved by a DIFFERENT user admin-1"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Dup S", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "7 A", address_city: "Austin", address_state: "TX", address_postal: "78701" }, as: APClerk, captures: { vs: $.data.id } }
            - { call: "POST /tax1099/vendors/${vs}/w9-submissions", payload: { submitted_legal_name: "Dup S", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "S" }, as: APClerk, captures: { ws: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${ws}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vs}", source_system: "CORP_CARD", payment_type: "SERVICE", amount_cents: 50000, payment_date: "2025-04-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Dup G", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "8 B", address_city: "Dallas", address_state: "TX", address_postal: "75201" }, as: APClerk, captures: { vg: $.data.id } }
            - { call: "POST /tax1099/vendors/${vg}/w9-submissions", payload: { submitted_legal_name: "Dup G", submitted_tin: "123456789", submitted_tin_type: "SSN", signature_name: "G" }, as: APClerk, captures: { wg: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wg}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vg}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-05-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${vg}", tax_year: 2025 }, as: TaxSpecialist, captures: { rg: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${rg}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/vendor-merge-requests", payload: { source_vendor_id: "${vs}", target_vendor_id: "${vg}", reason: "duplicate vendor" }, as: APClerk, as_user_id: "clerk-1", captures: { m: $.data.id } }
          trigger:
            - { call: "POST /tax1099/vendor-merge-requests/${m}/approve", payload: {}, as: TaxAdmin, as_user_id: "admin-1" }
            - { call: "GET /tax1099/vendors/${vs}", payload: {}, as: TaxAdmin }
            - { call: "GET /tax1099/payments", payload: { vendor_id: "${vg}" }, as: TaxAdmin }
            - { call: "GET /tax1099/returns/${rg}", payload: {}, as: TaxAdmin }
          assert:
            - "Vendor.${vs}.status == MERGED and merged_into_vendor_id == ${vg}"
            - "GET /payments?vendor_id=${vg} total_count == 2 (re-parented)"
            - "TaxReturn.${rg}.federal_status == DRAFT (invalidated by cascade)"
            - "TaxReturn.${rg}.box_amounts.box_1_cents == 150000 and amount_basis == FINAL"

      - name: payment_void_reverses_withholding_and_recomputes
        grounds:
          - state_machines.Payment.POSTED_to_VOIDED
          - state_machines.WithholdingEntry.UNREMITTED_to_REVERSED
          - entities.Remittance.fields.amount_cents
          - errors[ERR_NOTHING_TO_REMIT]
        distinguishing_aspect: |
          Depth-3 cascade from payment void (different trigger from merge
          approve): void -> DEBIT_WITHHELD entry REVERSED + compensating
          REVERSAL entry created -> vendor.withholding_balance_cents drops
          24000 -> DRAFT remittance amount_cents recomputes to 0, which then
          makes the submit fail with ERR_NOTHING_TO_REMIT.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN"
            - "Vendor V MISMATCHED; payment 100000c on 2025-02-10 (Q1) withheld 24000c"
            - "DRAFT remittance for (2025, Q1) created by spec-1 with amount_cents 24000"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Void V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "9 C", address_city: "Amarillo", address_state: "TX", address_postal: "79101" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Void V", submitted_tin: "999999999", submitted_tin_type: "SSN", signature_name: "V" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-02-10T00:00:00Z" }, as: APClerk, captures: { p: $.data.id } }
            - { call: "POST /tax1099/remittances", payload: { tax_year: 2025, quarter: 1 }, as: TaxSpecialist, as_user_id: "spec-1", captures: { rem: $.data.id } }
          trigger:
            - { call: "POST /tax1099/payments/${p}/void", payload: {}, as: APClerk }
            - { call: "GET /tax1099/withholding-entries", payload: { vendor_id: "${v}", entry_type: "REVERSAL" }, as: TaxSpecialist, captures: { rev_amt: "$.data[0].amount_cents", rev_status: "$.data[0].status"} }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: TaxSpecialist }
            - { call: "GET /tax1099/remittances/${rem}", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/remittances/${rem}/submit", payload: {}, as: TaxTransmitter, as_user_id: "xmtr-1", captures: { err: $.data.error_id } }
          assert:
            - "Payment.${p}.status == VOIDED"
            - "REVERSAL entry amount_cents == -24000 with status REVERSED (nets against the original, also REVERSED)"
            - "Vendor.${v}.withholding_balance_cents == 0"
            - "Remittance.${rem}.amount_cents == 0 (recomputed while DRAFT)"
            - "submit error_id == ERR_NOTHING_TO_REMIT"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (two different category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_safety_beats_channel_constraint
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_UNRESOLVED_SECOND_B_NOTICE]
          - errors[ERR_EFILE_REQUIRED]
        distinguishing_aspect: |
          Category pair business_safety vs business_constraint: the submit
          violates BOTH the unresolved-SECOND-B-notice safety rule (priority 6)
          and the e-file threshold constraint (priority 10, count 1 >= threshold
          1); the safety error ERR_UNRESOLVED_SECOND_B_NOTICE MUST win.
        test_recipe:
          setup:
            - "TaxYear 2025 with efiling_threshold_count = 1"
            - "Vendor V matched; SERVICE payment 100000c; NEC return VALIDATED and sealed (channel EFILE because 1 >= 1)"
            - "B-notice for 2024 recorded (stage FIRST), then B-notice for 2025 recorded (stage SECOND, OPEN)"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z", efiling_threshold_count: 1 }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Safety V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "10 D", address_city: "Midland", address_state: "TX", address_postal: "79701" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Safety V", submitted_tin: "121212121", submitted_tin_type: "SSN", signature_name: "S" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-03-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1" }
            - { call: "POST /tax1099/b-notices", payload: { vendor_id: "${v}", notice_year: 2024 }, as: IRSSystem }
            - { call: "POST /tax1099/b-notices", payload: { vendor_id: "${v}", notice_year: 2025 }, as: IRSSystem, captures: { stage2: $.data.stage } }
          trigger:
            - { call: "POST /tax1099/transmittals/${t}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-1", captures: { err: $.data.error_id } }
          assert:
            - "second BNotice stage == SECOND (prior notice in [2023, 2025])"
            - "submit error_id == ERR_UNRESOLVED_SECOND_B_NOTICE (safety, priority 6), NOT ERR_EFILE_REQUIRED (constraint, priority 10)"

      - name: payment_temporal_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_TAX_YEAR_CLOSED]
          - errors[ERR_INVALID_AMOUNT]
        distinguishing_aspect: |
          Category pair business_temporal vs business_fiscal (different pair
          from the safety/constraint instance): a payment into a CLOSED year
          with a negative amount violates both rules; the temporal error
          ERR_TAX_YEAR_CLOSED (priority 8) MUST win over ERR_INVALID_AMOUNT
          (priority 11).
        test_recipe:
          setup:
            - "TaxYear 2025 created then CLOSED"
            - "Vendor V matched"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin, captures: { ty: $.data.id } }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Tempo V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "11 E", address_city: "Odessa", address_state: "TX", address_postal: "79761" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Tempo V", submitted_tin: "343434343", submitted_tin_type: "SSN", signature_name: "T" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/tax-years/${ty}/close", payload: {}, as: TaxAdmin }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: -100, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TAX_YEAR_CLOSED (business_temporal, priority 8), NOT ERR_INVALID_AMOUNT (business_fiscal, priority 11)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (cents threshold vs count threshold vs
  #           empty-set, three different metrics on three different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: nec_threshold_exact_600
        grounds:
          - calculations.reportable_box_aggregation
          - entities.TaxYear.fields.nec_reportable_threshold_cents
        distinguishing_aspect: |
          Cents metric on POST /returns/generate: aggregate 59999c (threshold-1)
          produces generated_count 0, and one additional 1c payment reaching
          exactly 60000c (>= boundary, inclusive) produces generated_count 1.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN, default nec threshold 60000c"
            - "Vendor V matched; SERVICE payments 40000c and 19999c already posted"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Edge V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "12 F", address_city: "Abilene", address_state: "TX", address_postal: "79601" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Edge V", submitted_tin: "454545454", submitted_tin_type: "SSN", signature_name: "E" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 40000, payment_date: "2025-03-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 19999, payment_date: "2025-03-02T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist, captures: { gen0: $.data.generated_count } }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "MANUAL", payment_type: "SERVICE", amount_cents: 1, payment_date: "2025-03-03T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist, captures: { gen1: $.data.generated_count } }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { box1: "$.data[0].box_amounts"} }
          assert:
            - "first generate generated_count == 0 (59999 < 60000)"
            - "second generate generated_count == 1 (60000 >= 60000, inclusive boundary)"
            - "return box_amounts.box_1_cents == 60000"

      - name: efile_threshold_exactly_at_count
        grounds:
          - calculations.efile_threshold_channel
          - entities.TaxYear.fields.efiling_threshold_count
        distinguishing_aspect: |
          Count metric on POST /transmittals/{id}/seal+submit (different metric
          and endpoint from the cents threshold): with threshold 2, a transmittal
          sealed at qualifying_count 1 is PAPER and submits PAPER successfully,
          while a second transmittal sealed at qualifying_count exactly 2 is
          EFILE and rejects a declared PAPER submit — >= is inclusive.
        test_recipe:
          setup:
            - "TaxYear 2025 with efiling_threshold_count = 2"
            - "Vendors A and B, each matched with a SERVICE 70000c payment; both NEC returns generated"
            - "Only A's return validated before the first seal"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z", efiling_threshold_count: 2 }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "EA", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "1 EA", address_city: "Austin", address_state: "TX", address_postal: "78701" }, as: APClerk, captures: { va: $.data.id } }
            - { call: "POST /tax1099/vendors/${va}/w9-submissions", payload: { submitted_legal_name: "EA", submitted_tin: "565656565", submitted_tin_type: "SSN", signature_name: "A" }, as: APClerk, captures: { wa: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wa}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${va}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 70000, payment_date: "2025-04-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "EB", entity_classification: "PARTNERSHIP", address_line1: "2 EB", address_city: "Dallas", address_state: "TX", address_postal: "75201" }, as: APClerk, captures: { vb: $.data.id } }
            - { call: "POST /tax1099/vendors/${vb}/w9-submissions", payload: { submitted_legal_name: "EB", submitted_tin: "676767676", submitted_tin_type: "EIN", signature_name: "B" }, as: APClerk, captures: { wb: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${wb}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${vb}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 70000, payment_date: "2025-04-02T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${va}" }, as: TaxSpecialist, captures: { ra: "$.data[0].id"} }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${vb}" }, as: TaxSpecialist, captures: { rb: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${ra}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t1: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t1}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1", captures: { ch1: $.data.filing_channel } }
          trigger:
            - { call: "POST /tax1099/transmittals/${t1}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-1" }
            - { call: "POST /tax1099/returns/${rb}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t2: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t2}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1", captures: { ch2: $.data.filing_channel } }
            - { call: "POST /tax1099/transmittals/${t2}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-1", captures: { err2: $.data.error_id } }
            - { call: "POST /tax1099/transmittals/${t2}/submit", payload: { channel: "EFILE" }, as: TaxTransmitter, as_user_id: "xmtr-1" }
          assert:
            - "T1 seal filing_channel == PAPER (count 1 < 2) and PAPER submit succeeds (status SUBMITTED)"
            - "T2 seal filing_channel == EFILE (count exactly 2 >= 2)"
            - "T2 PAPER submit error_id == ERR_EFILE_REQUIRED"
            - "T2 EFILE submit succeeds (status SUBMITTED)"

      - name: remittance_empty_set_boundary
        grounds:
          - calculations.withholding_reconciliation
          - errors[ERR_NOTHING_TO_REMIT]
        distinguishing_aspect: |
          Empty-collection metric on POST /remittances (different metric and
          endpoint from the cents and count boundaries): drafting a remittance
          when the UNREMITTED entry set for (2025, Q1) is empty is rejected with
          ERR_NOTHING_TO_REMIT rather than creating a zero-amount draft.
        test_recipe:
          setup: ["TaxYear 2025 OPEN; no payments exist at all"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
          trigger:
            - { call: "POST /tax1099/remittances", payload: { tax_year: 2025, quarter: 1 }, as: TaxSpecialist, as_user_id: "spec-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOTHING_TO_REMIT (409) and no Remittance row is created"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (Payment x TaxYear vs
  #           TaxReturn x Vendor — different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: payment_blocked_when_tax_year_closed
        grounds:
          - state_machines.TaxYear.OPEN_to_CLOSED
          - validations[priority=8]
          - errors[ERR_TAX_YEAR_CLOSED]
        distinguishing_aspect: |
          Payment x TaxYear pair: the legality of POST /payments depends on the
          status of the TaxYear covering payment_date — OPEN accepts, CLOSED
          rejects with ERR_TAX_YEAR_CLOSED even though the vendor side is fully
          compliant.
        test_recipe:
          setup: ["TaxYear 2025 created; vendor V matched; then the year is CLOSED"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin, captures: { ty: $.data.id } }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Gate V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "13 G", address_city: "Tyler", address_state: "TX", address_postal: "75701" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Gate V", submitted_tin: "787878787", submitted_tin_type: "SSN", signature_name: "G" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 1000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk, captures: { p0: $.data.id } }
            - { call: "POST /tax1099/tax-years/${ty}/close", payload: {}, as: TaxAdmin }
          trigger:
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 1000, payment_date: "2025-06-02T00:00:00Z" }, as: APClerk, captures: { err: $.data.error_id } }
          assert:
            - "payment before close succeeded (id captured)"
            - "payment after close: error_id == ERR_TAX_YEAR_CLOSED (409)"

      - name: validate_blocked_while_rematch_pending
        grounds:
          - state_machines.TaxReturn.federal_status.DRAFT_to_VALIDATED
          - state_machines.Vendor.tin_match_status
          - errors[ERR_W9_NOT_ON_FILE]
        distinguishing_aspect: |
          TaxReturn x Vendor pair (different pair from Payment x TaxYear): a
          DRAFT return cannot validate while its vendor's tin_match_status has
          regressed to PENDING_MATCH due to a fresh W-9 re-submission; once the
          re-match lands MATCHED, the same validate call succeeds.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN; vendor V matched; SERVICE payment 100000c; NEC return DRAFT"
            - "A second W-9 is submitted, moving V back to PENDING_MATCH"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "ReV", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "14 H", address_city: "Wichita Falls", address_state: "TX", address_postal: "76301" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "ReV", submitted_tin: "898989898", submitted_tin_type: "SSN", signature_name: "R" }, as: APClerk, captures: { w1: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w1}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r: "$.data[0].id"} }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "ReV", submitted_tin: "898989898", submitted_tin_type: "SSN", signature_name: "R2" }, as: APClerk, captures: { w2: $.data.id } }
          trigger:
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist, captures: { err: $.data.error_id } }
            - { call: "POST /tax1099/w9-submissions/${w2}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/returns/${r}/validate", payload: {}, as: TaxSpecialist }
          assert:
            - "validate during PENDING_MATCH: error_id == ERR_W9_NOT_ON_FILE"
            - "after re-match: validate succeeds, TaxReturn.${r}.federal_status == VALIDATED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (half-open TaxYear vs closed StateRule —
  #           different resources AND different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: tax_year_half_open_adjacency
        grounds:
          - errors[ERR_TAX_YEAR_OVERLAP]
          - entities.TaxYear.fields.period_end_exclusive
        distinguishing_aspect: |
          Half-open interval semantics on the TaxYear resource: a period
          starting exactly at the previous period's exclusive end is ADJACENT,
          not overlapping (accepted), while a period starting one day earlier
          overlaps (rejected).
        test_recipe:
          setup: ["TaxYear 2025 covering [2025-01-01, 2026-01-01)"]
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
          trigger:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2026, period_start: "2025-12-31T00:00:00Z", period_end_exclusive: "2027-01-01T00:00:00Z", recipient_copy_deadline: "2027-01-31T00:00:00Z" }, as: TaxAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2026, period_start: "2026-01-01T00:00:00Z", period_end_exclusive: "2027-01-01T00:00:00Z", recipient_copy_deadline: "2027-01-31T00:00:00Z" }, as: TaxAdmin, captures: { ty26: $.data.id } }
          assert:
            - "overlapping create (start 2025-12-31): error_id == ERR_TAX_YEAR_OVERLAP"
            - "adjacent create (start == prior exclusive end 2026-01-01): 201 created (half-open adjacency allowed)"

      - name: state_rule_closed_interval_touching
        grounds:
          - errors[ERR_STATE_RULE_OVERLAP]
          - entities.StateRule.fields.effective_to
        distinguishing_aspect: |
          Closed-interval semantics on the StateRule resource (different
          resource, opposite adjacency rule from TaxYear): two CA rules whose
          effective windows merely TOUCH at 2025-12-31 DO overlap (closed-closed
          intersection is non-empty), while a window starting 2026-01-01 is
          accepted.
        test_recipe:
          setup: ["StateRule CA [2025-01-01, 2025-12-31] (closed both ends)"]
          setup_api_calls:
            - { call: "POST /tax1099/state-rules", payload: { state_code: "CA", participates_in_cfsf: true, direct_reporting_threshold_cents: 0, effective_from: "2025-01-01T00:00:00Z", effective_to: "2025-12-31T00:00:00Z" }, as: TaxAdmin }
          trigger:
            - { call: "POST /tax1099/state-rules", payload: { state_code: "CA", participates_in_cfsf: false, direct_reporting_threshold_cents: 50000, effective_from: "2025-12-31T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }, as: TaxAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /tax1099/state-rules", payload: { state_code: "CA", participates_in_cfsf: false, direct_reporting_threshold_cents: 50000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T00:00:00Z" }, as: TaxAdmin, captures: { sr2: $.data.id } }
          assert:
            - "touching-window create (effective_from == prior effective_to): error_id == ERR_STATE_RULE_OVERLAP"
            - "disjoint create (effective_from 2026-01-01): 201 created"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (money conservation vs accepted-document
  #           cardinality — different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: withholding_ledger_conservation_across_void_and_remit
        grounds:
          - calculations.backup_withholding_amount
          - calculations.withholding_reconciliation
          - state_machines.WithholdingEntry
          - entities.Vendor.fields.withholding_balance_cents
        distinguishing_aspect: |
          Conserved quantity = money: at every step, Vendor
          .withholding_balance_cents + sum(REMITTED signed amounts) == sum of
          signed amount_cents over ALL entries. Voiding payment 2 (forward
          action) plus its automatic REVERSAL (compensating action) removes
          exactly 12000c from both sides; the remit sweep moves 24000c from
          balance to remitted without changing the 24000c total.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN; vendor V MISMATCHED"
            - "Payments 100000c (2025-02-10, Q1, withheld 24000c) and 50000c (2025-02-20, Q1, withheld 12000c); balance 36000c"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Cons V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "15 I", address_city: "Laredo", address_state: "TX", address_postal: "78040" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Cons V", submitted_tin: "909090909", submitted_tin_type: "SSN", signature_name: "C" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MISMATCHED", mismatch_reason_code: "IRS_CODE_1" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-02-10T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 50000, payment_date: "2025-02-20T00:00:00Z" }, as: APClerk, captures: { p2: $.data.id } }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: APClerk, captures: { bal0: $.data.withholding_balance_cents } }
          trigger:
            - { call: "POST /tax1099/payments/${p2}/void", payload: {}, as: APClerk }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: APClerk, captures: { bal1: $.data.withholding_balance_cents } }
            - { call: "GET /tax1099/withholding-entries", payload: { vendor_id: "${v}" }, as: TaxSpecialist }
            - { call: "POST /tax1099/remittances", payload: { tax_year: 2025, quarter: 1 }, as: TaxSpecialist, as_user_id: "spec-1", captures: { rem: $.data.id, ramt: $.data.amount_cents } }
            - { call: "POST /tax1099/remittances/${rem}/submit", payload: {}, as: TaxTransmitter, as_user_id: "xmtr-1" }
            - { call: "GET /tax1099/vendors/${v}", payload: {}, as: TaxSpecialist, captures: { bal2: $.data.withholding_balance_cents } }
          assert:
            - "before void: withholding_balance_cents == 36000 (24000 + 12000)"
            - "after void+reversal: withholding_balance_cents == 24000 and entry count == 3 (+24000 UNREMITTED, +12000 REVERSED, -12000 REVERSED)"
            - "remittance draft amount_cents == 24000 (only the surviving UNREMITTED debit)"
            - "after submit: withholding_balance_cents == 0; invariant balance(0) + remitted(24000) == signed entry total(24000)"

      - name: accepted_return_cardinality_invariant_under_correction
        grounds:
          - state_machines.TaxReturn.federal_status.TRANSMITTED_to_ACCEPTED
          - state_machines.TaxReturn.federal_status.ACCEPTED_to_SUPERSEDED
          - concurrency_rules[return-correction-stale-version]
        distinguishing_aspect: |
          Conserved quantity = accepted-document cardinality per
          (vendor, tax_year, form_type) — a different conserved quantity from
          money: correction creation leaves the ACCEPTED count at 1, and the
          correction's acceptance atomically supersedes the original, so the
          count is still exactly 1 (never 0, never 2) throughout the whole flow.
        test_recipe:
          setup:
            - "TaxYear 2025 OPEN (default efile threshold 10, so PAPER is legal at count 1..2)"
            - "Vendor V matched; SERVICE payment 100000c; NEC return generated, validated, sealed, submitted PAPER, ACCEPTED"
          setup_api_calls:
            - { call: "POST /tax1099/tax-years", payload: { tax_year: 2025, period_start: "2025-01-01T00:00:00Z", period_end_exclusive: "2026-01-01T00:00:00Z", recipient_copy_deadline: "2026-01-31T00:00:00Z" }, as: TaxAdmin }
            - { call: "POST /tax1099/vendors", payload: { legal_name: "Corr V", entity_classification: "INDIVIDUAL_SOLE_PROP", address_line1: "16 J", address_city: "McAllen", address_state: "TX", address_postal: "78501" }, as: APClerk, captures: { v: $.data.id } }
            - { call: "POST /tax1099/vendors/${v}/w9-submissions", payload: { submitted_legal_name: "Corr V", submitted_tin: "101010101", submitted_tin_type: "SSN", signature_name: "C" }, as: APClerk, captures: { w9: $.data.id } }
            - { call: "POST /tax1099/w9-submissions/${w9}/record-match-result", payload: { match_result: "MATCHED" }, as: IRSSystem }
            - { call: "POST /tax1099/payments", payload: { vendor_id: "${v}", source_system: "AP_ERP", payment_type: "SERVICE", amount_cents: 100000, payment_date: "2025-06-01T00:00:00Z" }, as: APClerk }
            - { call: "POST /tax1099/returns/generate", payload: { tax_year: 2025 }, as: TaxSpecialist }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}" }, as: TaxSpecialist, captures: { r1: "$.data[0].id"} }
            - { call: "POST /tax1099/returns/${r1}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t1: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t1}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-1" }
            - { call: "POST /tax1099/transmittals/${t1}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-1" }
            - { call: "POST /tax1099/transmittals/${t1}/record-outcome", payload: { outcome: "ACCEPTED" }, as: IRSSystem }
            - { call: "GET /tax1099/returns/${r1}", payload: {}, as: TaxSpecialist, captures: { r1v: $.data.version } }
          trigger:
            - { call: "POST /tax1099/returns/${r1}/correct", payload: { expected_return_version: "${r1v}" }, as: TaxSpecialist, captures: { r2: $.data.id } }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}", federal_status: "ACCEPTED" }, as: TaxSpecialist }
            - { call: "POST /tax1099/returns/${r2}/validate", payload: {}, as: TaxSpecialist }
            - { call: "POST /tax1099/transmittals", payload: { tax_year: 2025, form_type: "NEC" }, as: TaxSpecialist, captures: { t2: $.data.id } }
            - { call: "POST /tax1099/transmittals/${t2}/seal", payload: {}, as: TaxSpecialist, as_user_id: "spec-2" }
            - { call: "POST /tax1099/transmittals/${t2}/submit", payload: { channel: "PAPER" }, as: TaxTransmitter, as_user_id: "xmtr-2" }
            - { call: "POST /tax1099/transmittals/${t2}/record-outcome", payload: { outcome: "ACCEPTED" }, as: IRSSystem }
            - { call: "GET /tax1099/returns", payload: { vendor_id: "${v}", federal_status: "ACCEPTED" }, as: TaxSpecialist, captures: { acc_id: "$.data[0].id"} }
            - { call: "GET /tax1099/returns/${r1}", payload: {}, as: TaxSpecialist }
          assert:
            - "after correction creation: ACCEPTED count for (V, 2025, NEC) == 1 (still the original)"
            - "after correction accepted: ACCEPTED count == 1 and the ACCEPTED row id == ${r2} (the correction)"
            - "TaxReturn.${r1}.federal_status == SUPERSEDED"
            - "TaxReturn.${r2}.is_correction == true and corrects_return_id == ${r1}"
