  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: room_booking_turnover_buffer_half_open
        grounds:
          - calculations.room_booking_conflict
          - validations[priority=17]
          - errors[ERR_ROOM_CONFLICT]
        distinguishing_aspect: |
          Buffer-augmented half-open semantics on ProcedureRoomBooking: an
          existing booking [09:00,10:00) blocks a new one starting at 10:15
          (inside the 30-minute turnover buffer) but ALLOWS one starting at
          exactly 10:30 (buffer end is exclusive).
