# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# task_0410_oncology_infusion_chemo_center
# Breadth probe across the claim-extraction-guide taxonomy. Corners already
# proven by a §1.8 difficulty instance are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_patient_computes_bsa_and_returns_envelope
        claim_type: Creation
        grounds:
          - entities.Patient.fields.bsa_m2
          - calculations.patient_bsa_mosteller
        distinguishing_aspect: "POST /patients with mrn,full_name,height_cm=160,weight_kg=60,gfr=90 returns 201 with computed bsa_m2==1.63 and status==ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C1", full_name: "Corner One", height_cm: 160, weight_kg: 60, gfr_ml_min: 90 }
              as: Pharmacist
              captures: { pat_id: $.data.id, bsa: $.data.bsa_m2 }
          assert:
            - "Patient.${pat_id}.bsa_m2 == 1.63"
            - "Patient.${pat_id}.status == ACTIVE"
            - "Patient.${pat_id}.version == 1"

      - name: create_patient_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Patient.fields.height_cm
          - "validations[priority=4]"
        distinguishing_aspect: "POST /patients omitting height_cm returns ERR_INVALID_REQUEST (400); no patient is created."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C2", full_name: "Corner Two", weight_kg: 60, gfr_ml_min: 90 }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

      - name: get_patient_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Patient
          - "errors[ERR_PATIENT_NOT_FOUND]"
        distinguishing_aspect: "GET /patients/{random-uuid} returns ERR_PATIENT_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /infusion-center/patients/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATIENT_NOT_FOUND"

      - name: list_patients_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.Patient
          - endpoints.GET /infusion-center/patients
        distinguishing_aspect: "GET /patients returns response_type=array with pagination fields total_count and has_more present."
        test_recipe:
          setup: ["One patient created"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C3", full_name: "Corner Three", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
          trigger:
            - call: "GET /infusion-center/patients"
              payload: {}
              as: Nurse
              as_user_id: "auditor-1"
          assert:
            - "response_type == array"
            - "meta.total_count == 1"
            - "meta.has_more == false"

      - name: patient_bsa_recomputed_on_patch_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Patient.fields.bsa_m2
          - calculations.patient_bsa_mosteller
        distinguishing_aspect: "PATCH /patients/{id} to 180/80 recomputes bsa_m2 to 2.0 server-side; client cannot set bsa_m2 directly."
        test_recipe:
          setup: ["Patient 170/70 (bsa 1.82)"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C4", full_name: "Corner Four", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
          trigger:
            - call: "PATCH /infusion-center/patients/${pat_id}"
              payload: { height_cm: 180, weight_kg: 80 }
              as: Pharmacist
              captures: { bsa: $.data.bsa_m2, ver: $.data.version }
          assert:
            - "Patient.${pat_id}.bsa_m2 == 2.0"
            - "Patient.${pat_id}.version == 2"

      - name: order_set_item_invalid_dosing_enum_rejected
        claim_type: Type Constraints
        grounds:
          - entities.OrderSetItem.fields.dosing_method
          - "validations[priority=4]"
        distinguishing_aspect: "POST /order-set-items with dosing_method='XYZ' returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["DRAFT protocol exists"]
          setup_api_calls:
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CEN1", name: "Enum", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
          trigger:
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "XYZ", flat_dose_mg: 100, vial_size_mg: 50, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: publish_protocol_without_items_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RegimenProtocol.DRAFT_to_PUBLISHED
          - "errors[ERR_NO_ORDER_SET_ITEMS]"
        distinguishing_aspect: "Publishing a protocol with zero order set items returns ERR_NO_ORDER_SET_ITEMS (409); status stays DRAFT."
        test_recipe:
          setup: ["DRAFT protocol with no items"]
          setup_api_calls:
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CPUB1", name: "Pub", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
          trigger:
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_ORDER_SET_ITEMS"
            - "RegimenProtocol.${proto_id}.status == DRAFT"

      - name: publish_protocol_premed_only_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.RegimenProtocol.DRAFT_to_PUBLISHED
          - "errors[ERR_NO_CHEMO_ITEM]"
        distinguishing_aspect: "Publishing a protocol whose only item is role=PREMED returns ERR_NO_CHEMO_ITEM (409)."
        test_recipe:
          setup: ["DRAFT protocol with a single PREMED item"]
          setup_api_calls:
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CPUB2", name: "Pub2", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "Ondansetron", role: "PREMED", dosing_method: "FLAT", flat_dose_mg: 8, vial_size_mg: 8, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
          trigger:
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NO_CHEMO_ITEM"

      - name: activate_cycle_unpublished_protocol_rejected
        claim_type: guarded transitions
        grounds:
          - state_machines.TreatmentCycle.PLANNED_to_ACTIVE
          - "errors[ERR_PROTOCOL_NOT_PUBLISHED]"
        distinguishing_aspect: "Activating a cycle whose protocol is still DRAFT returns ERR_PROTOCOL_NOT_PUBLISHED (409)."
        test_recipe:
          setup: ["DRAFT protocol (never published) with a CHEMO item; planned cycle on it"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C5", full_name: "Corner Five", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CACT1", name: "Act", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PROTOCOL_NOT_PUBLISHED"

      - name: activate_cycle_deceased_patient_rejected
        claim_type: guarded transitions
        grounds:
          - state_machines.TreatmentCycle.PLANNED_to_ACTIVE
          - "errors[ERR_PATIENT_NOT_ACTIVE]"
          - entities.Patient.fields.status
        distinguishing_aspect: "Activating a cycle for a DECEASED patient returns ERR_PATIENT_NOT_ACTIVE (409)."
        test_recipe:
          setup: ["Published protocol; planned cycle; patient then marked DECEASED"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C6", full_name: "Corner Six", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CACT2", name: "Act2", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/patients/${pat_id}/mark-deceased"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_PATIENT_NOT_ACTIVE"

      - name: verify_dose_mismatch_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DrugOrder.PREPARED_to_VERIFIED
          - "errors[ERR_DOSE_VERIFICATION_MISMATCH]"
          - "validations[priority=9]"
        distinguishing_aspect: "VERIFY with recomputed_dose_mg=599 against a stored ordered_dose_mg=600 returns ERR_DOSE_VERIFICATION_MISMATCH (409); order stays PREPARED."
        test_recipe:
          setup: ["ACTIVE cycle; FLAT 600 order PREPARED by N1; certified N2 verifies with wrong recomputed dose"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C7", full_name: "Corner Seven", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "N1", is_chemo_certified: true }
              as: Pharmacist
              captures: { n1: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "N2", is_chemo_certified: true }
              as: Pharmacist
              captures: { n2: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CVER1", name: "Ver", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi}" }
              as: Pharmacist
              captures: { do_id: $.data.id }
            - call: "POST /infusion-center/drug-orders/${do_id}/prepare"
              payload: {}
              as: Nurse
              as_user_id: "${n1}"
          trigger:
            - call: "POST /infusion-center/drug-orders/${do_id}/verify"
              payload: { recomputed_dose_mg: 599 }
              as: Nurse
              as_user_id: "${n2}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DOSE_VERIFICATION_MISMATCH"
            - "DrugOrder.${do_id}.status == PREPARED"

      - name: prepare_order_already_prepared_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.DrugOrder.ORDERED_to_PREPARED
          - "errors[ERR_ORDER_NOT_ORDERED]"
        distinguishing_aspect: "Calling prepare twice: second prepare on a PREPARED order returns ERR_ORDER_NOT_ORDERED (409)."
        test_recipe:
          setup: ["ACTIVE cycle; FLAT order PREPARED by N1"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C8", full_name: "Corner Eight", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "N1", is_chemo_certified: true }
              as: Pharmacist
              captures: { n1: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CPREP1", name: "Prep", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi}" }
              as: Pharmacist
              captures: { do_id: $.data.id }
            - call: "POST /infusion-center/drug-orders/${do_id}/prepare"
              payload: {}
              as: Nurse
              as_user_id: "${n1}"
          trigger:
            - call: "POST /infusion-center/drug-orders/${do_id}/prepare"
              payload: {}
              as: Nurse
              as_user_id: "${n1}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ORDER_NOT_ORDERED"

      - name: cancel_appointment_already_completed_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.InfusionAppointment.SCHEDULED_to_CANCELLED
          - "errors[ERR_APPOINTMENT_TERMINAL]"
        distinguishing_aspect: "Cancelling a COMPLETED appointment returns ERR_APPOINTMENT_TERMINAL (409); no state change."
        test_recipe:
          setup: ["ACTIVE cycle; appointment checked-in then COMPLETED"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C9", full_name: "Corner Nine", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/chairs"
              payload: { label: "CC-9" }
              as: Pharmacist
              captures: { chair_id: $.data.id }
            - call: "POST /infusion-center/nurses"
              payload: { full_name: "N9", is_chemo_certified: true }
              as: Pharmacist
              captures: { nurse_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CCMP1", name: "Cmp", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
              captures: { cyc_v1: $.data.version }
            - call: "POST /infusion-center/infusion-appointments"
              payload: { treatment_cycle_id: "${cyc_id}", chair_id: "${chair_id}", nurse_id: "${nurse_id}", start_at: "2026-07-01T09:00:00Z", end_at: "2026-07-01T10:30:00Z", acuity: 2, expected_treatment_cycle_version: "${cyc_v1}" }
              as: Pharmacist
              captures: { appt_id: $.data.id }
            - call: "POST /infusion-center/infusion-appointments/${appt_id}/check-in"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
            - call: "POST /infusion-center/infusion-appointments/${appt_id}/complete"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
          trigger:
            - call: "POST /infusion-center/infusion-appointments/${appt_id}/cancel"
              payload: {}
              as: Nurse
              as_user_id: "${nurse_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_APPOINTMENT_TERMINAL"

      - name: resume_cycle_not_on_hold_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.TreatmentCycle.ON_HOLD_to_ACTIVE
          - "errors[ERR_CYCLE_NOT_ON_HOLD]"
        distinguishing_aspect: "Resuming an ACTIVE (not ON_HOLD) cycle returns ERR_CYCLE_NOT_ON_HOLD (409)."
        test_recipe:
          setup: ["ACTIVE cycle that was never held"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C10", full_name: "Corner Ten", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CRES1", name: "Res", cycle_length_days: 21, total_cycles: 1 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
          trigger:
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/resume"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CYCLE_NOT_ON_HOLD"

      - name: advance_cycle_with_unresolved_order_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TreatmentCycle.ACTIVE_to_ACTIVE
          - "errors[ERR_UNRESOLVED_ORDERS]"
        distinguishing_aspect: "advance-cycle while a current-cycle DrugOrder is still ORDERED returns ERR_UNRESOLVED_ORDERS (409)."
        test_recipe:
          setup: ["ACTIVE cycle (total_cycles=2) with one ORDERED drug order"]
          setup_api_calls:
            - call: "POST /infusion-center/patients"
              payload: { mrn: "C11", full_name: "Corner Eleven", height_cm: 170, weight_kg: 70, gfr_ml_min: 80 }
              as: Pharmacist
              captures: { pat_id: $.data.id }
            - call: "POST /infusion-center/regimen-protocols"
              payload: { code: "CADV1", name: "Adv", cycle_length_days: 21, total_cycles: 2 }
              as: Pharmacist
              captures: { proto_id: $.data.id }
            - call: "POST /infusion-center/order-set-items"
              payload: { regimen_protocol_id: "${proto_id}", drug_name: "DrugC", role: "CHEMO", dosing_method: "FLAT", flat_dose_mg: 600, vial_size_mg: 150, day_offset: 1, sequence_index: 1 }
              as: Pharmacist
              captures: { osi: $.data.id }
            - call: "POST /infusion-center/regimen-protocols/${proto_id}/publish"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/treatment-cycles"
              payload: { patient_id: "${pat_id}", regimen_protocol_id: "${proto_id}", treatment_start_date: "2026-07-01" }
              as: Pharmacist
              captures: { cyc_id: $.data.id }
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/activate"
              payload: {}
              as: Pharmacist
            - call: "POST /infusion-center/drug-orders"
              payload: { treatment_cycle_id: "${cyc_id}", order_set_item_id: "${osi}" }
              as: Pharmacist
          trigger:
            - call: "POST /infusion-center/treatment-cycles/${cyc_id}/advance-cycle"
              payload: {}
              as: Pharmacist
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNRESOLVED_ORDERS"

      - name: advance_cycle_to_completed_on_final_cycle
        claim_type: Valid Transition
        grounds:
          - state_machines.TreatmentCycle.ACTIVE_to_COMPLETED
          - entities.TreatmentCycle.fields.current_cycle_number
        distinguishing_aspect: "advance-cycle on a single-cycle protocol (current==total==1) with all orders resolved completes the cycle: status==COMPLETED."
