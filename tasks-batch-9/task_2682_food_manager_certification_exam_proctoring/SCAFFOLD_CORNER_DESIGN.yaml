  - section: endpoints
    instances:
      - name: testing_site_create_read_and_filtered_list_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /testing-sites]
          - endpoints[GET /testing-sites/{id}]
          - endpoints[GET /testing-sites]
          - entities.TestingSite
        distinguishing_aspect: |
          The create/read/list trio must round-trip the array field languages_supported and the integer
          seat_count untouched, mint reserved_seat_minutes at 0 (a computed occupancy field, never an
          input), and the jurisdiction_id filter must return only the matching site: with one site in each
          of two jurisdictions, GET /testing-sites?jurisdiction_id=<A> has total_count 1 while the
          unfiltered list has total_count 2.
        test_recipe:
          setup:
            - "Two jurisdictions A (TX-TRAVIS) and B (TX-BEXAR) and nothing else."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "Travis County Health TX", jurisdiction_code: "TX-TRAVIS", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN", "ES"] }
              as: PlatformAdmin
              captures: { jur_a: $.data.id }
            - call: "POST /jurisdictions"
              payload: { name: "Bexar County Health TX", jurisdiction_code: "TX-BEXAR", accepted_accreditation_bodies: ["ANAB_CFP"], accepted_languages: ["EN"] }
              as: PlatformAdmin
              captures: { jur_b: $.data.id }
          trigger:
            - call: "POST /testing-sites"
              payload: { name: "Austin Exam Center", jurisdiction_id: "${jur_a}", seat_count: 3, address_line: "100 Congress Ave", languages_supported: ["EN", "ES"] }
              as: PlatformAdmin
              captures: { site_a: $.data.id, res_a: $.data.reserved_seat_minutes }
