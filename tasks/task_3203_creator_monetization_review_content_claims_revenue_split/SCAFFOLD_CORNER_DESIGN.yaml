              payload: { channel_name: "Rank Members Channel", country_code: "US", lifetime_watch_hours: 4000, subscriber_count: 1000 }
              as: Anonymous
              captures: { ch_rm: $.data.id }
            - call: "POST /api/channels/${ch_rm}/memberships"
              payload: { member_name: "Long Time Member", monthly_fee_cents: 499, joined_at: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { mem_rm1: $.data.id }
            - call: "POST /api/channels/${ch_rm}/memberships"
              payload: { member_name: "New Member", monthly_fee_cents: 499, joined_at: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { mem_rm2: $.data.id }
            - call: "GET /api/channels/${ch_rm}"
              payload: {}
              as: Any
              captures: { ch_rmv: $.data.version }
          trigger:
            - call: "POST /api/channels/${ch_rm}/member-payout-runs"
