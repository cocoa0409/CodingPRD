# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3236_community_center_membership_scholarships_program_subsidy
# Nine Difficulty Rules x 2 instances each = 18 instances.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: scholarship_preview_vs_final_award_diverge_after_income_correction
        grounds:
          - calculations.sliding_scale_award
          - state_machines.ScholarshipApplication.MORE_INFO_REQUIRED_to_UNDER_REVIEW
          - state_machines.ScholarshipApplication.UNDER_REVIEW_to_APPROVED
        distinguishing_aspect: |
          Same application, two valid award computations on the Scholarship
          domain: the provisional tier computed at submission uses declared
          income (preview_award_pct), while the final tier at approval uses
          the corrected verified income submitted via submit-info — the two
          variants produce different award_pct values for the same
          application row.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Association ami_base_cents=5000000 (50k). Branch with 200000 cents of RECEIVED SCHOLARSHIP pool. Category monthly_dues_cents=8000. Member M with an ACTIVE membership."
            - "Application submitted with household_size=1 (multiplier 1.00) and declared income 2000000 (ratio 0.4000 -> preview 0.50)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /campaigns"
              payload: { association_id: "${assoc_id}", name: "Annual 2026", goal_cents: 2000000 }
              as: AssociationAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/activate"
              payload: {}
              as: AssociationAdmin
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", branch_id: "${branch_id}", amount_cents: 200000, designation: "SCHOLARSHIP" }
              as: BranchDirector
              captures: { don_id: $.data.id }
            - call: "POST /donations/${don_id}/receive"
              payload: {}
              as: BranchDirector
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 5000, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Applicant", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id, mship_v: $.data.version }
            - call: "POST /scholarship-applications"
              payload: { branch_id: "${branch_id}", membership_id: "${mship_id}", applicant_member_id: "${member_id}", household_size: 1, annual_income_cents: 2000000, documentation: ["PAY_STUB"] }
              as: Member
              as_user_id: "${member_id}"
              captures: { app_id: $.data.id, preview_pct: $.data.preview_award_pct }
            - call: "POST /scholarship-applications/${app_id}/review"
              payload: {}
              as: BranchDirector
            - call: "POST /scholarship-applications/${app_id}/request-info"
              payload: {}
              as: BranchDirector
            - call: "POST /scholarship-applications/${app_id}/submit-info"
              payload: { documentation: ["TAX_RETURN"], annual_income_cents: 1300000 }
              as: Member
              as_user_id: "${member_id}"
          trigger:
            - call: "POST /scholarship-applications/${app_id}/approve"
              payload: { expected_membership_version: "${mship_v}" }
              as: BranchDirector
          assert:
            - "ScholarshipApplication.${app_id}.preview_award_pct == 0.50 (declared income 2000000 -> ratio 0.4000)"
            - "ScholarshipApplication.${app_id}.award_pct == 0.75 (verified income 1300000 -> ratio 0.2600 < 0.30)"
            - "preview and final variants diverge for the same application: preview_award_pct != award_pct"
            - "Membership.${mship_id}.assistance_pct == 0.75"
            - "ScholarshipApplication.${app_id}.award_obligation_cents == 72000 (12 * 8000 * 0.75)"
            - "Branch.${branch_id}.scholarship_pool_available_cents == 128000"

      - name: campaign_live_vs_frozen_match_after_close
        grounds:
          - calculations.campaign_attainment_and_match
          - state_machines.Campaign.ACTIVE_to_CLOSED
          - state_machines.Donation.RECEIVED_to_REFUNDED
        distinguishing_aspect: |
          Same campaign totals, two valid match computations on the Campaign
          domain: the live variant recomputes match_pct on every receive/refund
          while ACTIVE (tier moves down when a refund drops attainment below
          50%), while the frozen variant pins match_pct at close — a post-close
          refund reduces base_raised_cents but leaves match_pct untouched.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Association + branch created. Campaign goal_cents=100000, ACTIVE, with one RECEIVED donation of 60000 (attainment 0.6000 -> match 0.10, matched 66000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 50000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /campaigns"
              payload: { association_id: "${assoc_id}", name: "Annual 2026", goal_cents: 100000 }
              as: AssociationAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/activate"
              payload: {}
              as: AssociationAdmin
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", branch_id: "${branch_id}", amount_cents: 60000, designation: "GENERAL" }
              as: BranchDirector
              captures: { don1_id: $.data.id }
            - call: "POST /donations/${don1_id}/receive"
              payload: {}
              as: BranchDirector
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: AssociationAdmin
              captures: { camp_v: $.data.version }
          trigger:
            - call: "POST /campaigns/${camp_id}/close"
              payload: { expected_campaign_version: "${camp_v}" }
              as: AssociationAdmin
            - call: "POST /donations/${don1_id}/refund"
              payload: {}
              as: AssociationAdmin
            - call: "GET /campaigns/${camp_id}"
              payload: {}
              as: AssociationAdmin
          assert:
            - "live variant before close: match_pct was 0.10 and matched_raised_cents was 66000"
            - "Campaign.${camp_id}.base_raised_cents == 0 after the refund"
            - "frozen variant after close: Campaign.${camp_id}.match_pct == 0.10 (NOT recomputed to 0 despite attainment now 0)"
            - "Campaign.${camp_id}.matched_raised_cents == 66000 (frozen)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: sliding_scale_multi_input_tiered_with_nested_min_and_rounding
        grounds:
          - calculations.sliding_scale_award
          - calculations.household_multiplier
          - entities.ScholarshipApplication.fields.income_ratio
        distinguishing_aspect: |
          Mode (a): the award formula has >= 3 inputs (income, household_size,
          ami_base_cents) with non-linear interaction — a nested min(n,12) in
          the household multiplier, a conditional tier branch on the ratio, and
          rounding of the ratio to 4 decimals BEFORE tier comparison; changing
          household_size alone can flip the tier without income changing.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Association ami_base_cents=5000000. Branch with 300000 SCHOLARSHIP pool. Category dues 8000. Member M with ACTIVE membership."
            - "Application A: income 2400000, household_size 4 -> multiplier 1.60 -> ratio round4(2400000/8000000)=0.3000 -> tier 0.50 (boundary: exactly 0.30 is NOT < 0.30)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /campaigns"
              payload: { association_id: "${assoc_id}", name: "Annual 2026", goal_cents: 4000000 }
              as: AssociationAdmin
              captures: { camp_id: $.data.id }
            - call: "POST /campaigns/${camp_id}/activate"
              payload: {}
              as: AssociationAdmin
            - call: "POST /donations"
              payload: { campaign_id: "${camp_id}", branch_id: "${branch_id}", amount_cents: 300000, designation: "SCHOLARSHIP" }
              as: BranchDirector
              captures: { don_id: $.data.id }
            - call: "POST /donations/${don_id}/receive"
              payload: {}
              as: BranchDirector
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Family", household_type: "FAMILY", joining_fee_cents: 7500, monthly_dues_cents: 8000, max_adults: 2, max_dependents: 6 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Sam Applicant", email: "sam@x.com", birth_date: "1985-01-15", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id, mship_v: $.data.version }
            - call: "POST /scholarship-applications"
              payload: { branch_id: "${branch_id}", membership_id: "${mship_id}", applicant_member_id: "${member_id}", household_size: 4, annual_income_cents: 2400000, documentation: ["TAX_RETURN"] }
              as: Member
              as_user_id: "${member_id}"
              captures: { app_id: $.data.id }
            - call: "POST /scholarship-applications/${app_id}/review"
              payload: {}
              as: BranchDirector
          trigger:
            - call: "POST /scholarship-applications/${app_id}/approve"
              payload: { expected_membership_version: "${mship_v}" }
              as: BranchDirector
          assert:
            - "ScholarshipApplication.${app_id}.income_ratio == 0.3000 (round4 applied before comparison)"
            - "ScholarshipApplication.${app_id}.award_pct == 0.50 (ratio exactly 0.3000 is NOT < 0.30, falls to second tier)"
            - "ScholarshipApplication.${app_id}.award_obligation_cents == 48000 (12 * 8000 * 0.50)"
            - "Membership.${mship_id}.assistance_pct == 0.50"

      - name: registration_fee_nested_rounding_order_pinned
        grounds:
          - calculations.registration_fee
          - entities.Registration.fields.fee_charged_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the reciprocity
          surcharge round_half_up(base * 1.25) must be applied FIRST and the
          assistance discount round_half_up(gross * (1 - pct)) SECOND; applying
          the discount to the unrounded product, or summing then rounding,
          produces different cents on odd base fees.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default). Association + branch. Program SWIM_LESSON base_fee_cents=4999 (odd), member_only=false, member_priority_days=0, min_age 0, max_age 99. Space POOL. Session start_on 2026-09-20 (public_opens_on = member_opens_on = 2026-09-06); clock advanced to 2026-09-10 so the session is REG_OPEN."
            - "Visiting member V (visiting_association_name set, no membership here) -> registrant_class RECIPROCITY_VISITOR; no assistance applies."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /spaces"
              payload: { branch_id: "${branch_id}", name: "Pool A", kind: "POOL", capacity: 40, dropin_capacity: 10 }
              as: BranchDirector
              captures: { space_id: $.data.id }
            - call: "POST /programs"
              payload: { branch_id: "${branch_id}", name: "Swim 101", kind: "SWIM_LESSON", base_fee_cents: 4999, member_priority_days: 0 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${prog_id}", space_id: "${space_id}", start_on: "2026-09-20", end_on: "2026-09-27", time_start: "09:00", time_end: "10:00", capacity: 10 }
              as: ProgramCoordinator
              captures: { sess_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /members"
              payload: { full_name: "Visitor Vic", email: "vic@x.com", birth_date: "1988-08-08", home_branch_id: "${branch_id}", visiting_association_name: "OtherTown YMCA" }
              as: FrontDesk
              captures: { vis_id: $.data.id }
          trigger:
            - call: "POST /registrations"
              payload: { session_id: "${sess_id}", member_id: "${vis_id}", participant_name: "Visitor Vic", participant_birth_date: "1988-08-08" }
              as: Member
              as_user_id: "${vis_id}"
              captures: { reg_id: $.data.id }
          assert:
            - "Registration.${reg_id}.registrant_class == RECIPROCITY_VISITOR"
            - "Registration.${reg_id}.fee_charged_cents == 6249 (round_half_up(4999 * 1.25) = round_half_up(6248.75) = 6249; the pinned single rounding step — NOT 6248 truncation and NOT double-rounded)"
            - "Registration.${reg_id}.status == REGISTERED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: scholarship_review_info_cycle_repeats_until_decision
        grounds:
          - state_machines.ScholarshipApplication.UNDER_REVIEW_to_MORE_INFO_REQUIRED
          - state_machines.ScholarshipApplication.MORE_INFO_REQUIRED_to_UNDER_REVIEW
        distinguishing_aspect: |
          ScholarshipApplication has a cycle (UNDER_REVIEW -> MORE_INFO_REQUIRED
          -> UNDER_REVIEW) that can repeat multiple times before the
          APPROVED/DENIED fork; this is a cyclic machine on the application
          entity, distinct from the parallel-dimension machine on Membership.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Association, branch, category, member, ACTIVE membership all present."
            - "Application submitted and moved to UNDER_REVIEW."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 5000, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Applicant", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id }
            - call: "POST /scholarship-applications"
              payload: { branch_id: "${branch_id}", membership_id: "${mship_id}", applicant_member_id: "${member_id}", household_size: 1, annual_income_cents: 2000000, documentation: ["PAY_STUB"] }
              as: Member
              as_user_id: "${member_id}"
              captures: { app_id: $.data.id }
            - call: "POST /scholarship-applications/${app_id}/review"
              payload: {}
              as: BranchDirector
          trigger:
            - call: "POST /scholarship-applications/${app_id}/request-info"
              payload: {}
              as: BranchDirector
            - call: "POST /scholarship-applications/${app_id}/submit-info"
              payload: { documentation: ["PAY_STUB", "BENEFITS_LETTER"] }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /scholarship-applications/${app_id}/request-info"
              payload: {}
              as: BranchDirector
            - call: "POST /scholarship-applications/${app_id}/submit-info"
              payload: { documentation: ["TAX_RETURN"] }
              as: Member
              as_user_id: "${member_id}"
          assert:
            - "the cycle traversed twice: after both loops ScholarshipApplication.${app_id}.status == UNDER_REVIEW"
            - "a third request-info from UNDER_REVIEW is legal (cycle has no iteration cap in the machine)"
            - "DENIED/APPROVED remain reachable only from UNDER_REVIEW, never from MORE_INFO_REQUIRED"

      - name: membership_parallel_status_and_draft_dimensions
        grounds:
          - state_machines.Membership
          - entities.Membership.fields.status
          - entities.Membership.fields.draft_status
        distinguishing_aspect: |
          Membership carries two independent state dimensions on one row:
          status (ACTIVE/ON_HOLD/LAPSED/CANCELLED) evolves via hold/cancel,
          while draft_status (CURRENT/RETRY_PENDING/DELINQUENT) evolves via
          draft fail/settle — a hold does not touch draft_status and a failed
          draft does not touch status until the 45-day delinquency fires.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Association, branch, category (monthly_dues 8000, hold_fee 1000), member, ACTIVE membership with a PENDING draft for 2026-09."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /categories"
              payload: { branch_id: "${branch_id}", name: "Adult", household_type: "ADULT", joining_fee_cents: 0, monthly_dues_cents: 8000, max_adults: 1, max_dependents: 0, hold_fee_cents: 1000 }
              as: BranchDirector
              captures: { cat_id: $.data.id }
            - call: "POST /members"
              payload: { full_name: "Pat Member", email: "pat@x.com", birth_date: "1990-04-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { member_id: $.data.id }
            - call: "POST /memberships"
              payload: { branch_id: "${branch_id}", category_id: "${cat_id}", primary_member_id: "${member_id}", member_ids: ["${member_id}"] }
              as: FrontDesk
              captures: { mship_id: $.data.id }
            - call: "GET /memberships/${mship_id}/drafts"
              payload: {}
              as: BranchDirector
              captures: { draft_id: "$.data[0].id" }
          trigger:
            - call: "POST /memberships/${mship_id}/hold"
              payload: { hold_until: "2026-11-15" }
              as: Member
              as_user_id: "${member_id}"
            - call: "POST /drafts/${draft_id}/fail"
              payload: {}
              as: BranchDirector
            - call: "GET /memberships/${mship_id}"
              payload: {}
              as: BranchDirector
          assert:
            - "Membership.${mship_id}.status == ON_HOLD (first dimension moved)"
            - "Membership.${mship_id}.draft_status == RETRY_PENDING (second dimension moved independently by the draft failure)"
            - "the two dimensions are orthogonal: the hold did not reset draft_status to CURRENT and the failed draft did not change status"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: session_cancel_cascades_through_registrations_to_reservation
        grounds:
          - state_machines.ProgramSession.REG_OPEN_to_CANCELLED
          - state_machines.Registration.REGISTERED_to_REFUNDED
          - state_machines.FacilityReservation.APPROVED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from POST /sessions/{id}/cancel: session cancel (A)
          flips REGISTERED registrations to REFUNDED (B), and the session
          cancel also flips its linked PROGRAM reservation to CANCELLED (C),
          releasing the space — the reservation mutation is caused by the
          session transition, and the registration refunds are caused by the
          same session transition, each spelled out as linked hops.
        test_recipe:
          setup:
            - "Logical clock 2026-09-10. Association, branch, POOL space, program (non-licensed), session in REG_OPEN with 1 REGISTERED registration and 1 WAITLISTED registration, plus a linked PROGRAM FacilityReservation in APPROVED on the same space."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /associations"
              payload: { name: "Metro YMCA", ami_base_cents: 5000000, campaign_year: 2026 }
              as: AssociationAdmin
              captures: { assoc_id: $.data.id }
            - call: "POST /branches"
              payload: { association_id: "${assoc_id}", code: "DT", name: "Downtown", branch_goal_cents: 1000000 }
              as: AssociationAdmin
              captures: { branch_id: $.data.id }
            - call: "POST /spaces"
              payload: { branch_id: "${branch_id}", name: "Pool A", kind: "POOL", capacity: 40, dropin_capacity: 10 }
              as: BranchDirector
              captures: { space_id: $.data.id }
            - call: "POST /programs"
              payload: { branch_id: "${branch_id}", name: "Swim 101", kind: "SWIM_LESSON", base_fee_cents: 5000, member_priority_days: 0 }
              as: ProgramCoordinator
              captures: { prog_id: $.data.id }
            - call: "POST /sessions"
              payload: { program_id: "${prog_id}", space_id: "${space_id}", start_on: "2026-09-20", end_on: "2026-09-27", time_start: "09:00", time_end: "10:00", capacity: 1 }
              as: ProgramCoordinator
              captures: { sess_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-10T00:00:00Z" }
              as: AssociationAdmin
            - call: "POST /members"
              payload: { full_name: "Reg One", email: "one@x.com", birth_date: "1990-01-01", home_branch_id: "${branch_id}" }
              as: FrontDesk
              captures: { mem1: $.data.id }
            - call: "POST /members"
