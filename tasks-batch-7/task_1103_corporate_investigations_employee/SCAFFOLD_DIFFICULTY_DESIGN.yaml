            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: SUBMITTED }, as: Investigator, as_user_id: "inv-1" }
            - { call: "POST /api/plans/${plan_id}/transition", payload: { to_status: APPROVED }, as: InvestigationsManager, as_user_id: "mgr-1" }
            - { call: "POST /api/cases/${case_id}/transition", payload: { to_status: FINDINGS }, as: Investigator, as_user_id: "inv-1" }
            - call: "POST /api/cases/${case_id}/findings"
