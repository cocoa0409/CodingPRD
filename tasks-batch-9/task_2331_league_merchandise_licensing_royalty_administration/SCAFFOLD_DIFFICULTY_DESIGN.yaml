              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
              captures: { agr_t: $.data.id }
            - call: "POST /licensing/agreements/${agr_t}/advance-payments"
              payload: { amount_cents: 250000 }
              as: FinanceController
              as_user_id: "u_fin_1"
            - call: "POST /licensing/agreements/${agr_t}/territory-grants"
              payload: { territory_code: "US", channel_class: "ALL", effective_from: "2026-01-01", effective_to: "2028-01-01" }
              as: LeagueLicensingManager
              as_user_id: "u_ops_1"
            - call: "POST /licensing/agreements/${agr_t}/contract-status"
