      - state_machines.DepositInstallment.SCHEDULED_to_PAID
      distinguishing_aspect: 'The two payment guards fire in priority order on the same endpoint: paying installment 2 first is refused by the LOWER-numbered rule 92 with HTTP 409 ERR_DEPOSIT_SEQUENCE_VIOLATION even though its amount would have been correct, and once the sequence is respected a one-cent-short 44081.36 is refused by rule 94 with HTTP 422 ERR_DEPOSIT_AMOUNT_MISMATCH - only the exact 44081.37 is accepted, leaving deposit_outstanding_usd at 85569.71.'
