scaffold_corner_design:
  - section: entities
    instances:
      - name: create_engineered_order_returns_initial_states_and_open_posture
        claim_type: creation
        grounds:
          - endpoints[create_engineered_order]
          - entities.EngineeredOrder.fields.engineering_status
          - entities.EngineeredOrder.fields.fulfillment_status
          - entities.EngineeredOrder.fields.production_posture
        distinguishing_aspect: "A brand-new order must land on BOTH state dimensions' initial states at once (ENG_OPEN and PLANNING) with production_posture OPEN and posture_reason_codes empty; an implementation that seeds only one dimension, or that emits RESTRICTED/MATERIAL_INCOMPLETE because no allocation exists yet, fails."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned to 2026-03-02T08:00:00Z."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-001"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
          assert:
            - "HTTP 201."
            - "data.engineering_status == \"ENG_OPEN\"."
            - "data.fulfillment_status == \"PLANNING\"."
            - "data.production_posture == \"OPEN\"."
            - "data.posture_reason_codes == []."
            - "data.order_number == \"ORD-CORNER-001\" and data.rated_kv == 15."
            - "data.version == 1."
            - "meta.api_request_id and meta.api_request_timestamp are both present; response_type == \"object\"."

      - name: get_engineered_order_unknown_id_returns_order_not_found
        claim_type: not_found
        grounds:
          - endpoints[get_engineered_order]
          - validations[P7]
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "A syntactically valid but unknown order id must yield ERR_ORDER_NOT_FOUND (404), not an empty 200 body and not a 500."
        test_recipe:
          setup:
            - "Empty database; no EngineeredOrder rows exist."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: GET /engineered-orders/00000000-0000-4000-8000-000000000000
              payload: {}
              as: PlantAdmin
          assert:
            - "HTTP 404 with data.error_id == \"ERR_ORDER_NOT_FOUND\"."
            - "response_type == \"error\"; data carries no EngineeredOrder fields."

      - name: list_engineered_orders_on_empty_database_returns_empty_page
        claim_type: listing
        grounds:
          - endpoints[list_engineered_orders]
          - response_envelope.pagination_fields
        distinguishing_aspect: "Absent-collection boundary: the list endpoint on an empty database must return a well-formed empty page (data == [], total_count == 0, has_more == false) rather than 404 or a bare array."
        test_recipe:
          setup:
            - "Empty database; zero EngineeredOrder rows."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: GET /engineered-orders
              payload: {}
              as: PlantAdmin
          assert:
            - "HTTP 200 with response_type == \"array\" and data == []."
            - "total_count == 0, has_more == false, limit == 10, offset == 0."

      - name: create_supplier_missing_legal_name_returns_missing_required_field
        claim_type: required_fields
        grounds:
          - endpoints[create_supplier]
          - validations[P27]
          - errors[ERR_MISSING_REQUIRED_FIELD]
        distinguishing_aspect: "Payload-shape violation: legal_name is a required input with no default, so omitting it must fail with ERR_MISSING_REQUIRED_FIELD (422) and persist no Supplier row."
        test_recipe:
          setup:
            - "Empty database; no Supplier rows."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: POST /suppliers
              payload: { supplier_code: "SUP-NOLEGAL", region: "NA" }
              as: PlantAdmin
          assert:
            - "HTTP 422 with data.error_id == \"ERR_MISSING_REQUIRED_FIELD\"."
            - "A subsequent GET /suppliers as PlantAdmin returns data == [] and total_count == 0."

      - name: create_long_lead_component_omitting_allocation_policy_defaults_to_preemptible
        claim_type: defaults
        grounds:
          - endpoints[create_long_lead_component]
          - entities.LongLeadComponent.fields.allocation_policy
        distinguishing_aspect: "allocation_policy declares default PREEMPTIBLE; omitting it must yield PREEMPTIBLE rather than null or PROTECTED, and the derived quantity fields must initialise from quantity_on_hand alone."
        test_recipe:
          setup:
            - "One Supplier in status APPROVED exists."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /suppliers
              payload: { supplier_code: "SUP-DEF-01", legal_name: "Copperline Windings AG", region: "EU" }
              as: PlantAdmin
              captures: { supplier_id: "$.data.id" }
          trigger:
            - call: POST /suppliers/${supplier_id}/long-lead-components
              payload: { part_number: "PN-BUSH-15", category: "HV_BUSHING", lead_time_days: 120, quantity_on_hand: 10 }
              as: MaterialsPlanner
          assert:
            - "HTTP 201 with data.allocation_policy == \"PREEMPTIBLE\"."
            - "data.status == \"ACTIVE\", data.quantity_reserved == 0, data.quantity_committed == 0, data.quantity_consumed == 0."
            - "data.quantity_available == 10."

      - name: create_long_lead_component_under_unknown_supplier_returns_supplier_not_found
        claim_type: parent_relationships
        grounds:
          - endpoints[create_long_lead_component]
          - validations[P12]
          - errors[ERR_SUPPLIER_NOT_FOUND]
        distinguishing_aspect: "Parent-scoped creation must resolve the {id} path segment against Supplier before any body validation, so an unknown supplier id yields ERR_SUPPLIER_NOT_FOUND (404) even though the body is fully valid."
        test_recipe:
          setup:
            - "Empty database; no Supplier rows."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: POST /suppliers/00000000-0000-4000-8000-0000000000aa/long-lead-components
              payload: { part_number: "PN-ORPHAN", category: "TAP_CHANGER", lead_time_days: 90, quantity_on_hand: 4, allocation_policy: "PROTECTED" }
              as: MaterialsPlanner
          assert:
            - "HTTP 404 with data.error_id == \"ERR_SUPPLIER_NOT_FOUND\"."
            - "A subsequent GET /long-lead-components as MaterialsPlanner returns data == [] and total_count == 0."

      - name: commodity_index_point_is_immutable_entity_without_version_field
        claim_type: immutability
        grounds:
          - entities.CommodityIndexPoint
          - endpoints[create_commodity_index_point]
        distinguishing_aspect: "CommodityIndexPoint declares common_fields: false, so unlike every other entity its rows carry no version field; an implementation that bolts the common audit block onto it fails."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: POST /commodity-index-points
              payload: { commodity: "COPPER", index_month: "2026-01", index_value: 41250, published_at: "2026-02-10T00:00:00Z", is_provisional: false }
              as: ContractAdmin
          assert:
            - "HTTP 201 with data.commodity == \"COPPER\" and data.index_month == \"2026-01\"."
            - "data contains no \"version\" key."
            - "data.is_provisional == false."

      - name: create_engineered_order_rated_kv_zero_returns_field_value_out_of_range
        claim_type: type_constraints
        grounds:
          - endpoints[create_engineered_order]
          - validations[P30]
          - errors[ERR_FIELD_VALUE_OUT_OF_RANGE]
        distinguishing_aspect: "rated_kv must be strictly greater than 0; the boundary value 0 is rejected with ERR_FIELD_VALUE_OUT_OF_RANGE (422), distinguishing a range check from the type check that a non-numeric value would trip."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-KV0"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 0
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
          assert:
            - "HTTP 422 with data.error_id == \"ERR_FIELD_VALUE_OUT_OF_RANGE\"."
            - "A subsequent GET /engineered-orders as PlantAdmin returns total_count == 0."

      - name: create_engineered_order_extra_field_input_ignored
        claim_type: system_fields
        grounds:
          - endpoints[create_engineered_order]
          - entities.EngineeredOrder.fields.cancelled_reason
          - entities.EngineeredOrder.fields.released_drawing_revision
        distinguishing_aspect: "cancelled_reason and released_drawing_revision are system/computed fields absent from the create input schema; supplying them must be treated as an unknown-field payload violation rather than silently persisted."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-SYS"
                customer_name: "Riverbend Utility"
                product_family: "POWER_TRANSFORMER"
                rated_kv: 69
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
                engineering_status: "DESIGN_RELEASED"
                released_drawing_revision: 7
              as: ContractAdmin
          assert:
            - "Either HTTP 422 with data.error_id == \"ERR_FIELD_TYPE_INVALID\", or HTTP 201 whose data.engineering_status == \"ENG_OPEN\" and data.released_drawing_revision is null."
            - "In no case is engineering_status persisted as \"DESIGN_RELEASED\" - a follow-up GET /engineered-orders as PlantAdmin shows engineering_status \"ENG_OPEN\" for every row."

      - name: get_component_allocation_resolves_both_component_and_order_foreign_keys
        claim_type: parent_relationships
        grounds:
          - endpoints[get_component_allocation]
          - entities.ComponentAllocation.fields.long_lead_component_id
          - entities.ComponentAllocation.fields.engineered_order_id
        distinguishing_aspect: "ComponentAllocation is the cross-aggregate junction between the LongLeadComponent tree and the EngineeredOrder tree; a stored row must echo BOTH foreign keys and be reachable by filtered list on either side."
        test_recipe:
          setup:
            - "One order, one APPROVED supplier, one ACTIVE component with quantity_on_hand 10, one RESERVED allocation of 4 units."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-FK1"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id" }
            - call: POST /suppliers
              payload: { supplier_code: "SUP-FK-01", legal_name: "Copperline Windings AG", region: "NA" }
              as: PlantAdmin
              captures: { supplier_id: "$.data.id" }
            - call: POST /suppliers/${supplier_id}/long-lead-components
              payload: { part_number: "PN-FK-01", category: "HV_BUSHING", lead_time_days: 120, quantity_on_hand: 10, allocation_policy: "PROTECTED" }
              as: MaterialsPlanner
              captures: { component_id: "$.data.id", component_version: "$.data.version" }
            - call: POST /component-allocations
              payload: { long_lead_component_id: "${component_id}", engineered_order_id: "${order_id}", quantity: 4, priority_class: 2, need_by_date: "2026-09-01T00:00:00Z", expected_component_version: "${component_version}" }
              as: MaterialsPlanner
              captures: { allocation_id: "$.data.id" }
          trigger:
            - call: GET /component-allocations/${allocation_id}
              payload: {}
              as: MaterialsPlanner
          assert:
            - "HTTP 200 with data.long_lead_component_id == ${component_id} and data.engineered_order_id == ${order_id}."
            - "data.status == \"RESERVED\", data.quantity == 4, data.priority_class == 2."
            - "GET /component-allocations?engineered_order_id=${order_id} as MaterialsPlanner returns total_count == 1 and data[0].id == ${allocation_id}."

  - section: state_machines
    instances:
      - name: first_submittal_drawing_starts_in_draft_at_revision_round_one
        claim_type: initial_state
        grounds:
          - state_machines.SubmittalDrawing.initial_state
          - endpoints[create_submittal_drawing]
        distinguishing_aspect: "The first drawing on an order must be DRAFT at revision_round 1 with supersedes_drawing_id null; revision_round is system-assigned as max(existing)+1, so an implementation that accepts a client-supplied round or starts at 0 fails."
        test_recipe:
          setup:
            - "One fresh order at version 1, engineering_status ENG_OPEN."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-SM1"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id", order_version: "$.data.version" }
          trigger:
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-100", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${order_version}" }
              as: DesignEngineer
          assert:
            - "HTTP 201 with data.status == \"DRAFT\"."
            - "data.revision_round == 1 and data.supersedes_drawing_id is null."
            - "data.engineered_order_id == ${order_id}, data.authored_by_user_id == \"u-design-1\", data.reviewed_by_user_id is null."
            - "data.notes_count == 0 and data.submitted_at is null."

      - name: submit_drawing_advances_engineering_dimension_leaving_fulfillment_in_planning
        claim_type: parallel
        grounds:
          - state_machines.EngineeredOrder.engineering_status.transitions.ENG_OPEN_to_SUBMITTAL_IN_REVIEW
          - state_machines.EngineeredOrder.fulfillment_status.initial_state
        distinguishing_aspect: "EngineeredOrder carries two independent state dimensions on one row: submitting revision 1 moves engineering_status ENG_OPEN -> SUBMITTAL_IN_REVIEW while fulfillment_status must stay exactly PLANNING; an implementation that collapses both dimensions into one status column fails."
        test_recipe:
          setup:
            - "One order at version 1 with a DRAFT revision-1 drawing."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-SM2"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id", order_version: "$.data.version" }
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-100", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${order_version}" }
              as: DesignEngineer
              captures: { drawing_id: "$.data.id" }
          trigger:
            - call: POST /submittal-drawings/${drawing_id}/submit
              payload: {}
              as: DesignEngineer
          assert:
            - "HTTP 200 with data.status == \"SUBMITTED\" and data.submitted_at == \"2026-03-02T08:00:00Z\"."
            - "GET /engineered-orders/${order_id} as PlantAdmin shows engineering_status == \"SUBMITTAL_IN_REVIEW\"."
            - "The same GET shows fulfillment_status == \"PLANNING\" and production_posture == \"OPEN\" with posture_reason_codes == []."

      - name: begin_review_on_draft_drawing_returns_invalid_state_transition
        claim_type: invalid_transitions
        grounds:
          - state_machines.SubmittalDrawing.transitions.SUBMITTED_to_UNDER_REVIEW
          - validations[P35]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "begin-review's only legal source state is SUBMITTED; firing it on a DRAFT drawing must return ERR_INVALID_STATE_TRANSITION (409) and leave the drawing DRAFT - the reviewer cannot skip the designer's submit step."
        test_recipe:
          setup:
            - "One order with a DRAFT revision-1 drawing that has never been submitted."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-SM3"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id", order_version: "$.data.version" }
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-100", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${order_version}" }
              as: DesignEngineer
              captures: { drawing_id: "$.data.id" }
          trigger:
            - call: POST /submittal-drawings/${drawing_id}/begin-review
              payload: {}
              as: CustomerReviewer
              as_user_id: "u-reviewer-1"
          assert:
            - "HTTP 409 with data.error_id == \"ERR_INVALID_STATE_TRANSITION\"."
            - "GET /submittal-drawings/${drawing_id} as PlantAdmin still shows status == \"DRAFT\"."
            - "GET /engineered-orders/${order_id} as PlantAdmin still shows engineering_status == \"ENG_OPEN\"."

      - name: second_submit_of_already_submitted_drawing_returns_invalid_state_transition
        claim_type: idempotency
        grounds:
          - state_machines.SubmittalDrawing.transitions.DRAFT_to_SUBMITTED
          - validations[P35]
          - errors[ERR_INVALID_STATE_TRANSITION]
        distinguishing_aspect: "Replaying submit on a SUBMITTED (non-terminal) drawing must fail with ERR_INVALID_STATE_TRANSITION rather than the terminal-state error, and must not re-stamp submitted_at or bump the order version a second time."
        test_recipe:
          setup:
            - "One order whose revision-1 drawing is SUBMITTED; order engineering_status SUBMITTAL_IN_REVIEW."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-SM4"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id", order_version: "$.data.version" }
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-100", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${order_version}" }
              as: DesignEngineer
              captures: { drawing_id: "$.data.id" }
            - call: POST /submittal-drawings/${drawing_id}/submit
              payload: {}
              as: DesignEngineer
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-03T09:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: POST /submittal-drawings/${drawing_id}/submit
              payload: {}
              as: DesignEngineer
          assert:
            - "HTTP 409 with data.error_id == \"ERR_INVALID_STATE_TRANSITION\"."
            - "GET /submittal-drawings/${drawing_id} as PlantAdmin shows submitted_at still == \"2026-03-02T08:00:00Z\" (not re-stamped to the new clock)."
            - "GET /engineered-orders/${order_id} as PlantAdmin shows engineering_status == \"SUBMITTAL_IN_REVIEW\"."

      - name: begin_review_on_approved_drawing_returns_terminal_state
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.SubmittalDrawing.terminal_states
          - validations[P34]
          - errors[ERR_TERMINAL_STATE]
        distinguishing_aspect: "APPROVED is a terminal state for SubmittalDrawing, so the terminal guard (P34) must fire BEFORE the source-state guard (P35): the response is ERR_TERMINAL_STATE, not ERR_INVALID_STATE_TRANSITION."
        test_recipe:
          setup:
            - "One order whose revision-1 drawing has been submitted, reviewed and APPROVED; order engineering_status DESIGN_RELEASED with released_drawing_revision 1."
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-03-02T08:00:00Z" }
              as: PlantAdmin
            - call: POST /engineered-orders
              payload:
                order_number: "ORD-CORNER-SM5"
                customer_name: "Riverbend Utility"
                product_family: "MV_SWITCHGEAR"
                rated_kv: 15
                contract_value_cents: 4000000
                sold_at: "2026-01-05T00:00:00Z"
                promised_ship_at: "2026-10-01T00:00:00Z"
                owning_sales_user_id: "u-sales-1"
              as: ContractAdmin
              captures: { order_id: "$.data.id", order_version: "$.data.version" }
            - call: POST /engineered-orders/${order_id}/submittal-drawings
              payload: { drawing_set_code: "DS-100", authored_by_user_id: "u-design-1", expected_engineered_order_version: "${order_version}" }
              as: DesignEngineer
              captures: { drawing_id: "$.data.id" }
            - call: POST /submittal-drawings/${drawing_id}/submit
              payload: {}
              as: DesignEngineer
            - call: POST /submittal-drawings/${drawing_id}/begin-review
              payload: {}
              as: CustomerReviewer
              as_user_id: "u-reviewer-1"
            - call: POST /submittal-drawings/${drawing_id}/disposition
              payload: { disposition: "APPROVED", reviewed_by_user_id: "u-reviewer-1", notes_count: 0, as_noted_changes_bill_of_material: false }
              as: CustomerReviewer
              as_user_id: "u-reviewer-1"
          trigger:
            - call: POST /submittal-drawings/${drawing_id}/begin-review
              payload: {}
              as: CustomerReviewer
              as_user_id: "u-reviewer-2"
          assert:
