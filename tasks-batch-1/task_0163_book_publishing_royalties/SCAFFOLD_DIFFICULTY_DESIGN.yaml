  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: tier_boundary_5000_inclusive_vs_5001_crosses
        grounds:
          - calculations.tiered_royalty_escalator
          - entities.RoyaltyTier.fields.upper_unit
        distinguishing_aspect: |
          Numeric threshold metric on the generate-statement endpoint: exactly 5000 net units stays entirely in
          tier-1 (gross 1500000 = 5000*300), while 5001 crosses (1500375 = 5000*300 + 1*375). upper_unit=5000 is
          INCLUSIVE; unit 5001 is the first tier-2 unit.
        test_recipe:
          setup:
            - "ACTIVE contract C tiers [1..5000]=0.10,[5001..10000]=0.125,[10001..]=0.15, HARDCOVER 3000c, period seq1 net 5001 CLOSED."
