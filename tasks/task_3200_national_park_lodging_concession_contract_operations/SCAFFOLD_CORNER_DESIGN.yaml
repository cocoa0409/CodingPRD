# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# task_3200_national_park_lodging_concession_contract_operations
# Breadth probe: every testable claim of SCAFFOLD.yaml §1.1–§1.7 that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Claims covered by
# §1.8 appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: contract_create_returns_all_fields_and_computed_end_date
        claim_type: Creation
        grounds:
          - entities.Contract
          - endpoints.POST_/contracts
        distinguishing_aspect: "A contract created with term_months 24 and start_date 2027-01-01 returns 201 with status DRAFT, version 1, server id/created_at/updated_at, and computed end_date exactly 24 months later (2029-01-01)."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - &en_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SystemTestHarness
          trigger:
            - &en_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-100", term_months: 24, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.04, employee_housing_capacity: 60, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 45 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Contract.${c_id}.status == DRAFT and version == 1"
            - "Contract.${c_id}.end_date == 2029-01-01T00:00:00Z (computed, not client-supplied)"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: contract_create_with_non_multiple_of_12_term_rejected
        claim_type: Type Constraints
        grounds:
          - entities.Contract.fields.term_months
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "term_months 18 violates the % 12 == 0 constraint; the create fails 400 ERR_INVALID_REQUEST and no contract row exists."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *en_clock
          trigger:
            - call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-101", term_months: 18, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.04, employee_housing_capacity: 60, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 45 }
              as: AgencyContractingOfficer
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /contracts returns 0 rows"

      - name: reservation_default_occupancy_mode_is_banded
        claim_type: Defaults
        grounds:
          - entities.Reservation.fields.occupancy_mode
          - calculations.occupancy_rate_resolution
        distinguishing_aspect: "Omitting occupancy_mode stores the default BANDED and prices at the declared band even when beds_occupied would imply a cheaper band."
        test_recipe:
          setup:
            - "ACTIVE contract with season, room class, APPROVED filing (SOLO 19000 / DOUBLE 23000 / FAMILY 26000); clock inside the lottery window."
          setup_api_calls:
            - *en_clock
            - &df_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-102", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id, c_v: $.data.version }
            - &df_l1
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
            - &df_l2
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
            - &df_l3
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "RETAIL" }
              as: AgencyContractingOfficer
            - &df_l4
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "TOURS" }
              as: AgencyContractingOfficer
            - &df_season
              call: "POST /contracts/${c_id}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 720 }
              as: ConcessionerOpsManager
              captures: { s_id: $.data.id }
            - &df_activate
              call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: ConcessionerOpsManager
            - &df_room
              call: "POST /contracts/${c_id}/room-classes"
              payload: { code: "CABIN_A", total_rooms: 10, peak_season_months: [6, 7, 8] }
              as: ConcessionerOpsManager
              captures: { rc_id: $.data.id }
            - &df_study
              call: "POST /contracts/${c_id}/comparability-studies"
              payload: { title: "S1", comparables: [{ property_name: "A", nightly_rate_cents: 25000, weight: 1.0 }, { property_name: "B", nightly_rate_cents: 24000, weight: 1.0 }, { property_name: "C", nightly_rate_cents: 26000, weight: 1.0 }], prepared_at: "2026-06-01T00:00:00Z", valid_through: "2028-01-01T00:00:00Z" }
              as: AgencyRateAnalyst
              captures: { st1: $.data.id }
            - &df_getc
              call: "GET /contracts/${c_id}"
              payload: {}
              as: ConcessionerRateManager
              captures: { c_v2: $.data.version }
            - &df_filing
              call: "POST /contracts/${c_id}/rate-filings"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", submitted_rates: [{ occupancy_band: "SOLO", nightly_rate_cents: 19000 }, { occupancy_band: "DOUBLE", nightly_rate_cents: 23000 }, { occupancy_band: "FAMILY", nightly_rate_cents: 26000 }], reference_study_id: "${st1}", expected_contract_version: "${c_v2}" }
              as: ConcessionerRateManager
              captures: { f_id: $.data.id }
            - &df_rev
              call: "POST /contracts/${c_id}/rate-filings/${f_id}/start-review"
              payload: {}
              as: AgencyRateAnalyst
            - &df_app
              call: "POST /contracts/${c_id}/rate-filings/${f_id}/approve"
              payload: {}
              as: AgencyRateAnalyst
            - &df_clock2
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-12-01T01:00:00Z" }
              as: SystemTestHarness
            - &df_getc2
              call: "GET /contracts/${c_id}"
              payload: {}
              as: ConcessionerFrontDesk
              captures: { c_v3: $.data.version }
          trigger:
            - call: "POST /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", guest_ref: "g-def", check_in_date: "2027-07-10T00:00:00Z", check_out_date: "2027-07-12T00:00:00Z", occupancy_band: "FAMILY", expected_contract_version: "${c_v3}" }
              as: ConcessionerFrontDesk
              captures: { r_id: $.data.id }
          assert:
            - "Reservation.${r_id}.occupancy_mode == BANDED (default applied)"
            - "Reservation.${r_id}.quoted_nightly_rate_cents == 26000"
            - "Reservation.${r_id}.nights == 2 and total_charge_cents == 52000 and deposit_cents == 10400"

      - name: season_get_returns_computed_month_offset
        claim_type: Computed Fields
        grounds:
          - entities.OperatingSeason.fields.month_offset
        distinguishing_aspect: "month_offset is computed from the contract start_date, not stored from input: a season opening 2027-06-01 on a contract starting 2027-01-01 reports month_offset 5."
        test_recipe:
          setup:
            - "Contract starting 2027-01-01 with one season opening 2027-06-01."
          setup_api_calls:
            - *en_clock
            - &mo_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-103", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id }
            - &mo_season
              call: "POST /contracts/${c_id}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
              captures: { s_id: $.data.id }
          trigger:
            - call: "GET /contracts/${c_id}/seasons/${s_id}"
              payload: {}
              as: ConcessionerOpsManager
          assert:
            - "OperatingSeason.${s_id}.month_offset == 5"
            - "OperatingSeason.${s_id}.status == PLANNED (initial state)"

      - name: reservations_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/contracts/{id}/reservations
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three reservations and limit=2, the first page reports total_count 3 and has_more true; the second page (offset=2) reports has_more false — total_count is the filtered total, not the page size."
        test_recipe:
          setup:
            - "ACTIVE contract with season, room class, APPROVED filing; three reservations created inside the lottery window."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
            - *df_season
            - *df_activate
            - *df_room
            - *df_study
            - *df_getc
            - *df_filing
            - *df_rev
            - *df_app
            - *df_clock2
            - *df_getc2
            - &pg_r1
              call: "POST /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", guest_ref: "g-1", check_in_date: "2027-07-10T00:00:00Z", check_out_date: "2027-07-11T00:00:00Z", occupancy_band: "SOLO", expected_contract_version: "${c_v3}" }
              as: ConcessionerFrontDesk
            - &pg_r2
              call: "POST /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", guest_ref: "g-2", check_in_date: "2027-07-11T00:00:00Z", check_out_date: "2027-07-12T00:00:00Z", occupancy_band: "SOLO", expected_contract_version: "${c_v3}" }
              as: ConcessionerFrontDesk
            - &pg_r3
              call: "POST /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", guest_ref: "g-3", check_in_date: "2027-07-12T00:00:00Z", check_out_date: "2027-07-13T00:00:00Z", occupancy_band: "SOLO", expected_contract_version: "${c_v3}" }
              as: ConcessionerFrontDesk
          trigger:
            - call: "GET /contracts/${c_id}/reservations"
              payload: { season_id: "${s_id}", limit: 2, offset: 0 }
              as: ConcessionerFrontDesk
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true"
            - "page 2 (offset=2) returns exactly 1 row with total_count == 3 and has_more == false"

      - name: contract_get_unknown_id_returns_contract_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/contracts/{id}
          - errors.ERR_CONTRACT_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unknown contract id returns the entity-specific 404 ERR_CONTRACT_NOT_FOUND, not a generic error."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. No contracts exist."
          setup_api_calls:
            - *en_clock
          trigger:
            - call: "GET /contracts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ConcessionerFrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_CONTRACT_NOT_FOUND"
            - "response_type is error with data.error_id and data.message present"

      - name: filing_create_missing_submitted_rates_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.RateFiling.fields.submitted_rates
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "submitted_rates is required with no default; omitting it yields 400 ERR_INVALID_REQUEST and no filing row."
        test_recipe:
          setup:
            - "ACTIVE contract with season, room class, and REGISTERED study."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
            - *df_season
            - *df_activate
            - *df_room
            - *df_study
            - *df_getc
          trigger:
            - call: "POST /contracts/${c_id}/rate-filings"
              payload: { season_id: "${s_id}", room_class_id: "${rc_id}", reference_study_id: "${st1}", expected_contract_version: "${c_v2}" }
              as: ConcessionerRateManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 400 and err == ERR_INVALID_REQUEST"
            - "GET /contracts/${c_id}/rate-filings returns 0 rows"

      - name: system_fields_id_and_timestamps_are_server_generated
        claim_type: System Fields
        grounds:
          - entities.Contract
          - response_envelope
        distinguishing_aspect: "Client-supplied id/created_at/version values in the create body are ignored; the server mints its own id, stamps created_at, and initializes version to 1."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - *en_clock
          trigger:
            - call: "POST /contracts"
              payload: { park_code: "GRCA", contract_number: "GRCA-104", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.04, employee_housing_capacity: 60, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 45 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id }
          assert:
            - "Contract.${c_id}.id is a UUID with no type prefix and does not equal any client-supplied value"
            - "Contract.${c_id}.created_at == 2026-09-01T00:00:00Z (the logical clock) and version == 1"

      - name: filing_belongs_to_its_own_contract_not_another
        claim_type: Parent Relationships
        grounds:
          - entities.RateFiling.fields.contract_id
          - entities.RateFiling.fields.season_id
        distinguishing_aspect: "A filing created under contract C1 citing a season of contract C2 is rejected 404 ERR_SEASON_NOT_FOUND — child FKs must resolve within the same parent contract."
        test_recipe:
          setup:
            - "Two contracts C1 and C2; C2 has a season; C1 is ACTIVE with lines and a room class."
          setup_api_calls:
            - *en_clock
            - &xr_c1
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-105A", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c1: $.data.id, c1_v: $.data.version }
            - &xr_c2
              call: "POST /contracts"
              payload: { park_code: "GRCA", contract_number: "GRCA-105B", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.0385, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c2: $.data.id }
            - &xr_c2_season
              call: "POST /contracts/${c2}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
              captures: { c2_s: $.data.id }
            - &xr_c1_l1
              call: "POST /contracts/${c1}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
            - &xr_c1_l2
              call: "POST /contracts/${c1}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
            - &xr_c1_l3
              call: "POST /contracts/${c1}/service-lines"
              payload: { line_type: "RETAIL" }
              as: AgencyContractingOfficer
            - &xr_c1_l4
              call: "POST /contracts/${c1}/service-lines"
              payload: { line_type: "TOURS" }
              as: AgencyContractingOfficer
            - &xr_c1_act
              call: "POST /contracts/${c1}/activate"
              payload: {}
              as: ConcessionerOpsManager
            - &xr_c1_room
              call: "POST /contracts/${c1}/room-classes"
              payload: { code: "CABIN_A", total_rooms: 10, peak_season_months: [6] }
              as: ConcessionerOpsManager
              captures: { c1_rc: $.data.id }
            - &xr_c1_study
              call: "POST /contracts/${c1}/comparability-studies"
              payload: { title: "S1", comparables: [{ property_name: "A", nightly_rate_cents: 25000, weight: 1.0 }, { property_name: "B", nightly_rate_cents: 24000, weight: 1.0 }, { property_name: "C", nightly_rate_cents: 26000, weight: 1.0 }], prepared_at: "2026-06-01T00:00:00Z", valid_through: "2028-01-01T00:00:00Z" }
              as: AgencyRateAnalyst
              captures: { c1_st: $.data.id }
            - &xr_getc1
              call: "GET /contracts/${c1}"
              payload: {}
              as: ConcessionerRateManager
              captures: { c1_v2: $.data.version }
          trigger:
            - call: "POST /contracts/${c1}/rate-filings"
              payload: { season_id: "${c2_s}", room_class_id: "${c1_rc}", submitted_rates: [{ occupancy_band: "SOLO", nightly_rate_cents: 19000 }, { occupancy_band: "DOUBLE", nightly_rate_cents: 23000 }, { occupancy_band: "FAMILY", nightly_rate_cents: 26000 }], reference_study_id: "${c1_st}", expected_contract_version: "${c1_v2}" }
              as: ConcessionerRateManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and err == ERR_SEASON_NOT_FOUND — the season exists globally but not under contract C1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: contract_activate_from_active_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Contract
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Activating an already-ACTIVE contract is not in the transition table; the second activate is rejected 409 ERR_INVALID_STATE and version does not advance."
        test_recipe:
          setup:
            - "ACTIVE contract with one season and four service lines."
          setup_api_calls:
            - *en_clock
            - *df_contract
            - *df_l1
            - *df_l2
            - *df_l3
            - *df_l4
            - *df_season
            - *df_activate
          trigger:
            - call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: ConcessionerOpsManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "GET /contracts/${c_id} shows status ACTIVE and version unchanged from the first activation"

      - name: statement_pay_twice_is_idempotency_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.FranchiseFeeStatement
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "Paying an already-PAID statement is rejected 409 ERR_INVALID_STATE — the same trigger twice never double-applies."
        test_recipe:
          setup:
            - "ACTIVE contract with one ACCEPTED report (LODGING 2027-07, 20000) and an ISSUED then PAID statement for 2027-07."
          setup_api_calls:
            - *en_clock
            - &sp_contract
              call: "POST /contracts"
              payload: { park_code: "YELL", contract_number: "YELL-106", term_months: 120, start_date: "2027-01-01T00:00:00Z", franchise_fee_rate: 0.04, employee_housing_capacity: 100, lsi_annual_schedule_type: "LINEAR", environmental_plan_due_day_of_year: 60 }
              as: AgencyContractingOfficer
              captures: { c_id: $.data.id, c_v: $.data.version }
            - &sp_l1
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "LODGING" }
              as: AgencyContractingOfficer
              captures: { sl_l: $.data.id }
            - &sp_l2
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "FOOD" }
              as: AgencyContractingOfficer
              captures: { sl_f: $.data.id }
            - &sp_l3
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "RETAIL" }
              as: AgencyContractingOfficer
            - &sp_l4
              call: "POST /contracts/${c_id}/service-lines"
              payload: { line_type: "TOURS" }
              as: AgencyContractingOfficer
            - &sp_season
              call: "POST /contracts/${c_id}/seasons"
              payload: { year: 2027, open_date: "2027-06-01T00:00:00Z", close_date: "2027-09-01T00:00:00Z", lottery_open_date: "2026-12-01T00:00:00Z", lottery_window_hours: 72 }
              as: ConcessionerOpsManager
            - &sp_act
              call: "POST /contracts/${c_id}/activate"
              payload: {}
              as: ConcessionerOpsManager
            - &sp_getc
              call: "GET /contracts/${c_id}"
              payload: {}
              as: ConcessionerAccountant
              captures: { c_v2: $.data.version }
            - &sp_rep
              call: "POST /contracts/${c_id}/receipts-reports"
              payload: { period_month: "2027-07", service_line_id: "${sl_l}", gross_receipts_cents: 20000, expected_contract_version: "${c_v2}" }
              as: ConcessionerAccountant
              captures: { rep: $.data.id }
            - &sp_sub
              call: "POST /contracts/${c_id}/receipts-reports/${rep}/submit"
              payload: {}
              as: ConcessionerAccountant
            - &sp_acc
              call: "POST /contracts/${c_id}/receipts-reports/${rep}/accept"
              payload: {}
              as: AgencyFinancialAuditor
            - &sp_stmt
              call: "POST /contracts/${c_id}/fee-statements"
              payload: { period_month: "2027-07" }
              as: ConcessionerAccountant
              captures: { stmt: $.data.id }
            - &sp_pay1
              call: "POST /contracts/${c_id}/fee-statements/${stmt}/pay"
              payload: {}
              as: ConcessionerAccountant
          trigger:
            - call: "POST /contracts/${c_id}/fee-statements/${stmt}/pay"
              payload: {}
              as: ConcessionerAccountant
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and err == ERR_INVALID_STATE"
            - "FranchiseFeeStatement.${stmt}.status == PAID and total_fee_cents == 800 (20000 * 0.04)"

      - name: terminal_state_lockdown_on_closed_incident
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.EnvironmentalIncident
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "From CLOSED (terminal), every incident action — start-review, require-corrective-plan, submit-corrective-plan, close — is rejected 409."
        test_recipe:
          setup:
