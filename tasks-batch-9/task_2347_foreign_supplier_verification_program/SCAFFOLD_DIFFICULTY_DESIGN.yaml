        grounds:
          - state_machines[SupplierFoodPair.exemption_status].transitions.CLAIMED_to_VERIFIED
          - state_machines[SupplierFoodPair.entry_eligibility_status].transitions.PENDING_to_ELIGIBLE
          - entities.SupplierFoodPair.fields.verification_status
          - endpoints["POST /fsvp/supplier-food-pairs/{id}/exemption"]
        distinguishing_aspect: "Parallel state dimensions on ONE SupplierFoodPair row: verifying a juice-HACCP exemption moves exemption_status NONE→CLAIMED→VERIFIED and entry_eligibility_status PENDING→ELIGIBLE while verification_status remains DRAFT and hazard_analysis_count stays 0 — eligibility is reached on a dimension the verification pipeline never touched."
