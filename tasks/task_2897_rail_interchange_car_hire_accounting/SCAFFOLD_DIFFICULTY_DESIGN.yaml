            - "after allow: ReclaimClaim.${claim_id}.status == ALLOWED, allowed_hours == 24.00, credit_cents == 2843"
            - "after allow: CarHireMovement.${mv_id}.reclaim_credit_cents == 2843 and net_hire_cents == 8621"
            - "after allow: SettlementCycle.${cycle_id} == (reclaim_credit_cents 2843, pre_fee_net_cents 8621, clearinghouse_fee_cents 43, net_settlement_cents 8578) and status is still COMPUTED"
            - "after withdraw: ReclaimClaim.${claim_id}.status == WITHDRAWN, credit_cents == 0, withdraw_reason is the supplied text"
            - "after withdraw: CarHireMovement.${mv_id}.reclaim_credit_cents == 0 and net_hire_cents == 11464 — exactly the baseline, not 11463 or 11465"
            - "after withdraw: SettlementCycle.${cycle_id} == (reclaim_credit_cents 0, pre_fee_net_cents 11464, clearinghouse_fee_cents 57, net_settlement_cents 11407, reopen_count 0, status COMPUTED)"
            - "ledger audit trail: GET /car-hire/ledger-entries?settlement_cycle_id=${cycle_id} contains a HIRE_CHARGE of 11464, a RECLAIM_CREDIT of -2843 and a RECLAIM_REVERSAL of +2843; no entry was deleted"
            - "SUM(amount_cents) over those three entries == 11464 == SettlementCycle.${cycle_id}.pre_fee_net_cents"
            - "no SETTLEMENT_PAYMENT entry exists and SettlementCycle.${cycle_id}.settled_at is null"

      - name: timestamp_amend_conserves_total_custody_hours_across_three_segments
        grounds:
          - state_machines.CorrectionRequest.CONFIRMED_to_APPLIED
          - state_machines.InterchangeEvent.RECORDED_to_SUPERSEDED
          - calculations.hire_time_component
          - calculations.per_diem_exposure
          - entities.InterchangeEvent.fields.source
          - entities.CorrectionRequest.fields.resulting_event_id
          - entities.CarHireMovement.fields.chargeable_hours
        distinguishing_aspect: |
          Moving one interchange_at six hours earlier (2026-08-26T06:00:00Z ->
          2026-08-26T00:00:00Z) must shift custody hours BETWEEN the adjoining segments
          without creating or destroying any: 150.00 + 76.00 + 38.00 == 264.00 elapsed
          hours before, and 144.00 + 82.00 + 38.00 == 264.00 after. Only the boundary
          between the first two segments moves; the still-OPEN third segment is
          untouched. Because free time is subtracted per segment and days are then
          ceilinged per segment, the MONEY does not conserve — BN's segment rises from
          chargeable 72.00/3 days/7800 to chargeable 78.00/4 days/10900 — which is
          exactly why the conserved quantity must be asserted on hours and the
          non-conserved one on cents.
        test_recipe:
          setup:
            - "Railroads BN and CX ACTIVE; car type XM; junction JCT-CHI."
            - "CX-owned car CX 100070 is registered at 2026-08-20T00:00:00Z, opening CX's home segment M0."
            - "It is delivered to BN at 2026-08-26T06:00:00Z (odometer 12000) and returned to CX at 2026-08-29T10:00:00Z (odometer 12415), so M0 = 150.00 h, M1 = 76.00 h, and M2 is OPEN from 2026-08-29T10:00:00Z."
            - "The clock is advanced to 2026-08-31T00:00:00Z, making M2 38.00 hours old and the running total 264.00 hours."
            - "BN files a TIMESTAMP_AMEND on the first delivery event proposing 2026-08-26T00:00:00Z and CX confirms it inside the 72-hour window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "BN", name: "Bear Northern Railway" }
              as: ClearinghouseAdmin
              captures: { bn_id: "$.data.id" }
            - call: "POST /car-hire/railroads"
              payload: { reporting_mark: "CX", name: "Coast Express Lines" }
              as: ClearinghouseAdmin
              captures: { cx_id: "$.data.id" }
            - call: "POST /car-hire/car-types"
              payload: { car_type_code: "XM", description: "Box car, plain door", time_component_mode: "PER_DIEM", free_time_hours: 4, per_diem_rate_cents: 2350, tier2_threshold_days: 2, tier2_per_diem_rate_cents: 3100, mileage_rate_millicents_per_mile: 2350, loaded_mileage_only: true }
              as: ClearinghouseAdmin
              captures: { xm_id: "$.data.id" }
            - call: "POST /car-hire/junctions"
              payload: { junction_code: "JCT-CHI", name: "Chicago Interchange", road_a_id: "${cx_id}", road_b_id: "${bn_id}" }
              as: ClearinghouseAdmin
              captures: { jct_id: "$.data.id" }
            - call: "POST /car-hire/cars"
              payload: { car_mark: "CX 100070", car_type_id: "${xm_id}", owner_road_id: "${cx_id}", initial_handling_road_id: "${cx_id}" }
              as: FleetOwner
              as_user_id: "${cx_id}"
              captures: { car_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-29T10:00:00Z" }
              as: ClearinghouseAdmin
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${cx_id}", receiving_road_id: "${bn_id}", interchange_at: "2026-08-26T06:00:00Z", odometer_miles: 12000, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
              captures: { target_event_id: "$.data.id" }
            - call: "POST /car-hire/interchange-events"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", event_type: "INTERCHANGE_DELIVERY", delivering_road_id: "${bn_id}", receiving_road_id: "${cx_id}", interchange_at: "2026-08-29T10:00:00Z", odometer_miles: 12415, load_status: "LOADED" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-31T00:00:00Z" }
              as: ClearinghouseAdmin
            - call: "GET /car-hire/hire-movements?car_id=${car_id}&handling_road_id=${bn_id}&status=CLOSED"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { m1_id: "$.data[0].id" }
            - call: "POST /car-hire/correction-requests"
              payload: { car_id: "${car_id}", junction_id: "${jct_id}", counterparty_road_id: "${cx_id}", correction_type: "TIMESTAMP_AMEND", target_event_id: "${target_event_id}", proposed_interchange_at: "2026-08-26T00:00:00Z", filing_note: "Clerk logged the handoff six hours late" }
              as: InterchangeClerk
              as_user_id: "${bn_id}"
              captures: { corr_id: "$.data.id" }
            - call: "POST /car-hire/correction-requests/${corr_id}/confirm"
              payload: { confirm_note: "CX yard log agrees the car left at 00:00" }
              as: InterchangeClerk
              as_user_id: "${cx_id}"
          trigger:
            - call: "POST /car-hire/correction-requests/${corr_id}/apply"
              payload: {}
              as: InterchangeClerk
              as_user_id: "${bn_id}"
            - call: "GET /car-hire/hire-movements?car_id=${car_id}"
              payload: {}
              as: CarHireAccountant
              as_user_id: "${bn_id}"
              captures: { first_mv_id: "$.data[0].id" }
          assert:
            - "before the trigger: the three segments are M0 150.00 elapsed hours (2026-08-20T00:00:00Z -> 2026-08-26T06:00:00Z), M1 76.00 (-> 2026-08-29T10:00:00Z, chargeable_hours 72.00, chargeable_days 3, time_component_cents 7800, gross_hire_cents 8775) and M2 OPEN from 2026-08-29T10:00:00Z accruing 38.00 hours at the clock 2026-08-31T00:00:00Z; total 264.00"
            - "CorrectionRequest.${corr_id}.status == APPLIED and resulting_event_id is a new InterchangeEvent with source == CORRECTION_APPLY and interchange_at == 2026-08-26T00:00:00Z"
            - "InterchangeEvent.${target_event_id}.status == SUPERSEDED and its interchange_at is left at 2026-08-26T06:00:00Z (the row is superseded, not edited)"
            - "M0 now ends at 2026-08-26T00:00:00Z: 144.00 elapsed hours, chargeable_hours 140.00, chargeable_days 6"
            - "CarHireMovement.${m1_id} now spans 2026-08-26T00:00:00Z -> 2026-08-29T10:00:00Z: 82.00 elapsed hours, chargeable_hours 78.00, chargeable_days 4, time_component_cents 10900, mileage_component_cents 975, gross_hire_cents 11875, net_hire_cents 11875, recompute_count 1"
            - "M2 is unchanged: still OPEN, still starting 2026-08-29T10:00:00Z, still 38.00 hours at the clock"
            - "CONSERVED: 144.00 + 82.00 + 38.00 == 264.00 == 150.00 + 76.00 + 38.00 (total custody hours are invariant)"
            - "NOT CONSERVED: BN's chargeable_hours rose 72.00 -> 78.00 and its time_component_cents 7800 -> 10900, because free time is subtracted and days ceilinged per segment"
            - "GET /car-hire/railroads/${bn_id}/exposure returns exposure_cents == 11875 and open_movement_count == 0"
            - "GET /car-hire/interchange-events?car_id=${car_id}&status=RECORDED returns exactly 2 rows (the replacement and the return); the SUPERSEDED row is excluded"
