            - call: "POST /operating-days"
              payload: { landfill_id: "${lf_id}", active_cell_id: "${c1_id}", operating_date: "2026-08-01T00:00:00Z", working_face_area_sf: 5000, cover_material_type: "ALTERNATIVE_TARP" }
              as: SiteOperator
