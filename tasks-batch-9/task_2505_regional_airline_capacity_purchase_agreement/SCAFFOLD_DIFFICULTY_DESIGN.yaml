            - "ScheduleCycle.${cyc}.open_leg_count == 3"
            - "error.code is never ERR_AIRCRAFT_TURN_CONFLICT for either attempt — the new leg departs 3 hours after N1402RG's 17:00 arrival, so no pairwise turn violation exists and only the aggregate rule can fire"
            - "Pilot.${p1}.status == LINE_QUALIFIED and Pilot.${p2}.status == LINE_QUALIFIED — the cap is a scheduling constraint and mutates no Pilot row"

  - rule_id: compensating_invariant
    instances:
      - name: settled_money_restored_by_invoice_void
        grounds:
          - state_machines.Invoice.ISSUED_to_VOIDED
          - entities.Agreement.fields.settled_to_date_usd
          - entities.Invoice.fields.void_reason
          - state_machines.ScheduleCycle.SETTLED_to_CLOSED
        distinguishing_aspect: |
          Conserved quantity = settled money (Agreement.settled_to_date_usd). Voiding
          an ISSUED invoice is a compensating action rather than a reversal of state
          alone: the money returns to exactly its pre-issue value 0.00, the cycle
          drops back from SETTLED to CLOSED, and the invoice keeps its frozen
          components so the audit trail survives the compensation.
        test_recipe:
          setup:
            - "ACTIVE agreement, one base, one LINE_QUALIFIED captain, one REGIONAL_OWNED tail IN_SERVICE."
            - "Cycle 2026-09, published_departures 100, three COMPLETED legs (1.155 / 2.007 / 0.616) and one CANCELLED leg classified UNCONTROLLABLE but not finalized; no pass-through claims."
            - "Cycle CLOSED with a PUBLISHED scorecard, FINAL invoice ISSUED for 334362.99, cycle SETTLED, Agreement.settled_to_date_usd 334362.99."
          setup_api_calls:
            - call: "POST /cpa/agreements"
              payload: { mainline_partner_name: "Summit Air", regional_carrier_name: "Cascade Regional", fixed_monthly_fee_usd: 250000.00, block_hour_rate_usd: 1450.75, departure_rate_usd: 320.00, aircraft_ownership_fee_usd: 62000.00, incentive_pool_cap_usd: 90000.00, penalty_cap_usd: 120000.00, term_end_date: "2029-12-31" }
              as: CPAAdministrator
              captures: { ag: $.data.id }
            - call: "POST /cpa/crew-bases"
              payload: { agreement_id: "${ag}", station_code: "ORD", pilots_required_per_aircraft: 1, aircraft_allocation_cap: 4 }
              as: RegionalOpsController
              captures: { base: $.data.id }
            - call: "POST /cpa/agreements/${ag}/activate"
              payload: {}
              as: CPAAdministrator
            - call: "POST /cpa/pilots"
              payload: { base_id: "${base}", employee_ref: "EMP-1701", seat: "CAPTAIN", hire_class_date: "2026-06-01" }
              as: RegionalOpsController
              captures: { p1: $.data.id }
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "IN_TRAINING" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/pilots/${p1}/advance"
              payload: { to_status: "LINE_QUALIFIED" }
              as: BaseChiefPilot
              as_user_id: "${base}"
            - call: "POST /cpa/aircraft"
              payload: { agreement_id: "${ag}", assigned_base_id: "${base}", tail_number: "N1501RG", seat_count: 76, ownership: "REGIONAL_OWNED" }
              as: RegionalOpsController
              captures: { ac1: $.data.id }
            - call: "POST /cpa/aircraft/${ac1}/induct"
              payload: {}
              as: RegionalOpsController
            - call: "POST /cpa/schedule-cycles"
              payload: { agreement_id: "${ag}", cycle_month: "2026-09", published_departures: 100 }
              as: MainlineScheduler
              captures: { cyc: $.data.id }
            - call: "POST /cpa/schedule-cycles/${cyc}/open"
              payload: {}
              as: MainlineScheduler
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM5201", origin: "ORD", destination: "DSM", scheduled_departure_utc: "2026-09-02T08:00:00Z", scheduled_arrival_utc: "2026-09-02T09:12:00Z", planned_block_hours: 1.200 }
              as: MainlineScheduler
              captures: { l1: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM5202", origin: "ORD", destination: "MSP", scheduled_departure_utc: "2026-09-04T08:00:00Z", scheduled_arrival_utc: "2026-09-04T10:00:00Z", planned_block_hours: 2.000 }
              as: MainlineScheduler
              captures: { l2: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM5203", origin: "ORD", destination: "SBN", scheduled_departure_utc: "2026-09-06T08:00:00Z", scheduled_arrival_utc: "2026-09-06T08:42:00Z", planned_block_hours: 0.700 }
              as: MainlineScheduler
              captures: { l3: $.data.id }
            - call: "POST /cpa/flight-legs"
              payload: { cycle_id: "${cyc}", aircraft_id: "${ac1}", captain_pilot_id: "${p1}", flight_number: "SM5204", origin: "ORD", destination: "GRR", scheduled_departure_utc: "2026-09-08T08:00:00Z", scheduled_arrival_utc: "2026-09-08T09:30:00Z", planned_block_hours: 1.500 }
              as: MainlineScheduler
              captures: { l4: $.data.id }
            - call: "POST /cpa/flight-legs/${l1}/complete"
              payload: { actual_block_hours: 1.155, actual_arrival_utc: "2026-09-02T09:26:00Z", enplaned_bags: 120, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l2}/complete"
              payload: { actual_block_hours: 2.007, actual_arrival_utc: "2026-09-04T10:14:00Z", enplaned_bags: 100, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l3}/complete"
              payload: { actual_block_hours: 0.616, actual_arrival_utc: "2026-09-06T08:40:00Z", enplaned_bags: 80, mishandled_bags: 0 }
              as: RegionalOpsController
            - call: "POST /cpa/flight-legs/${l4}/cancel"
              payload: { cause_code: "WEATHER" }
              as: RegionalOpsController
            - call: "GET /cpa/cancellation-claims"
              payload: { leg_id: "${l4}" }
              as: CPAAdministrator
              captures: { cl: "$.data[0].id" }
            - call: "POST /cpa/cancellation-claims/${cl}/classify"
              payload: { classification: "UNCONTROLLABLE" }
              as: MainlineScheduler
            - call: "POST /cpa/schedule-cycles/${cyc}/close"
              payload: {}
              as: MainlineScheduler
            - call: "GET /cpa/schedule-cycles/${cyc}"
              payload: {}
              as: CPAAdministrator
              captures: { cyc_v: $.data.version }
            - call: "POST /cpa/schedule-cycles/${cyc}/invoices"
              payload: { variant: "FINAL", expected_schedule_cycle_version: "${cyc_v}" }
              as: CPAAdministrator
              captures: { inv: $.data.id }
            - call: "POST /cpa/invoices/${inv}/issue-final"
              payload: {}
              as: CPAAdministrator
          trigger:
            - call: "POST /cpa/invoices/${inv}/void"
              payload: {}
              as: CPAAdministrator
          assert:
            - "HTTP 200 with Invoice.${inv}.status == VOIDED and Invoice.${inv}.void_reason == MANUAL — not AUTO_SCORECARD_STALE and not AUTO_SUPERSEDED"
            - "Agreement.${ag}.settled_to_date_usd == 0.00 — exactly the pre-issue figure, restored by subtracting 334362.99"
            - "ScheduleCycle.${cyc}.status == CLOSED — reverted from SETTLED"
            - "Invoice.${inv}.total_usd == 334362.99, fixed_component_usd == 312000.00, variable_component_usd == 6440.94, incentive_component_usd == 15922.05 — components are never recomputed by the compensation"
            - "Invoice.${inv}.issued_final_at is unchanged and non-null — the void records history rather than erasing it"
            - "Agreement.${ag}.open_invoice_count == 0"
            - "Scorecard for ${cyc} still has status == PUBLISHED — a manual void does not stale performance"

      - name: departure_ledger_restored_by_leg_reinstate
        grounds:
          - state_machines.FlightLeg.CANCELLED_to_SCHEDULED
          - state_machines.CancellationClaim.OPEN_to_VOIDED
          - entities.ScheduleCycle.fields.departure_ledger_total
          - entities.ScheduleCycle.fields.metric_completed_departures
          - entities.FlightLeg.fields.reinstate_count
        distinguishing_aspect: |
          A DIFFERENT conserved quantity from settled money: the departure ledger,
          which must equal published_departures at every instant. Cancelling moves a
          departure from the completed bucket into the controllable bucket and
          reinstating moves it back — the compensation is a rebalancing between
          buckets, and the invariant total 10 never changes even mid-flow.
        test_recipe:
          setup:
            - "ACTIVE agreement, one base (pilots_required_per_aircraft 1, cap 1), one LINE_QUALIFIED captain, one REGIONAL_OWNED tail IN_SERVICE."
            - "OPEN cycle 2026-09 with published_departures 10: leg L1 COMPLETED (1.000) and leg L2 still SCHEDULED."
