scaffold_difficulty_design:

  # =====================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: invoice_gross_provisional_then_void_restore_rebill
        grounds:
          - calculations.invoice_gross
          - state_machines.Invoice.OPEN_to_VOID
          - entities.Invoice.fields.credit_applied_cents
          - entities.MissedPickupCredit.fields.status
        distinguishing_aspect: |
          On the Invoice domain: a provisional invoice consumes the credit available at
          generation time; voiding it restores that credit to ISSUED, so re-billing the
          identical period yields a different amount_due_cents than the first invoice.
        test_recipe:
          setup:
            - "STANDARD plan (base 4000, extra_cart 1200, extra_pickup_base 2500, bulk_item 800); zone with Mon pickup."
            - "ACTIVE account with one TRASH + one RECYCLING cart and one ISSUED TRASH credit of 300 (from a missed pickup)."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "North 12", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "10 Oak St", holder_name: "Pat R" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}/pickup-schedules"
              payload: { stream: "TRASH" }
              as: Dispatcher
              captures: { sched0_id: $.data.0.id, sched0_eff: $.data.0.effective_pickup_date }
            - call: "POST /pickup-schedules/${sched0_id}/events"
              payload: { outcome: "MISSED", reported_at: "${sched0_eff}" }
              as: CrewLead
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { v1: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { expected_account_version: "${v1}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: Dispatcher
              captures: { inv1_id: $.data.id, inv1_due: $.data.amount_due_cents, inv1_credit: $.data.credit_applied_cents }
            - call: "POST /invoices/${inv1_id}/void"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { v2: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { expected_account_version: "${v2}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: Dispatcher
              captures: { inv2_credit: $.data.credit_applied_cents, inv2_due: $.data.amount_due_cents }
          assert:
            - "Invoice.${inv1_id}.gross_amount_cents == 4000"
            - "Invoice.${inv1_id}.credit_applied_cents == 300"
            - "Invoice.${inv1_id}.amount_due_cents == 3700"
            - "After void, MissedPickupCredit originating from the missed event has status == ISSUED"
            - "inv2_credit == 300 and inv2_due == 3700"
      - name: extra_pickup_charge_frozen_vs_reversed_on_cancel
        grounds:
          - calculations.extra_pickup_charge
          - state_machines.ExtraPickupRequest.SCHEDULED_to_CANCELLED
          - entities.ExtraPickupRequest.fields.charge_cents
        distinguishing_aspect: |
          On the ExtraPickupRequest domain (distinct from the Invoice domain above): identical
          plan + bulk_item_count inputs yield charge_cents 3300 when SCHEDULED but 0 after the
          SCHEDULED request is CANCELLED — same inputs, divergent result by lifecycle context.
        test_recipe:
          setup:
            - "ACTIVE account on STANDARD plan with a REQUESTED extra pickup of 3 bulk items."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "North 12", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "12 Oak St", holder_name: "Lee K" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/extra-pickups"
              payload: { requested_date: "2026-03-20T00:00:00Z", bulk_item_count: 3 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { epr_id: $.data.id }
          trigger:
            - call: "POST /extra-pickups/${epr_id}/schedule"
              payload: {}
              as: Dispatcher
              captures: { charge_after_schedule: $.data.charge_cents }
            - call: "POST /extra-pickups/${epr_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { charge_after_cancel: $.data.charge_cents }
          assert:
            - "charge_after_schedule == 3300"
            - "charge_after_cancel == 0"
            - "ExtraPickupRequest.${epr_id}.status == CANCELLED"

  # =====================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: extra_pickup_charge_conditional_branch_three_inputs
        grounds:
          - calculations.extra_pickup_charge
          - entities.ServicePlan.fields.bulk_item_cents
          - entities.ExtraPickupRequest.fields.bulk_item_count
        distinguishing_aspect: |
          Mode (a): formula over 3 inputs (extra_pickup_base_cents, bulk_item_count, bulk_item_cents)
          with a conditional branch on the FREE_BULK_ALLOWANCE threshold and a multiplicative
          billable-item term — non-linear interaction, not a flat per-unit rate.
        test_recipe:
          setup:
            - "ACTIVE STANDARD account; one REQUESTED extra pickup of 5 bulk items."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "14 Oak St", holder_name: "Ana B" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/extra-pickups"
              payload: { requested_date: "2026-03-21T00:00:00Z", bulk_item_count: 5 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { epr_id: $.data.id }
          trigger:
            - call: "POST /extra-pickups/${epr_id}/schedule"
              payload: {}
              as: Dispatcher
              captures: { charge: $.data.charge_cents }
          assert:
            - "charge == 4900"
      - name: invoice_gross_pinned_order_subtotal_then_credit_application
        grounds:
          - calculations.invoice_gross
          - entities.Invoice.fields.gross_amount_cents
          - entities.Invoice.fields.amount_due_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned by evaluation order —
          amount_due depends on credit_applied which depends on gross; the scaffold pins
          gross first (base+extra_cart+extras+contam), THEN credit_applied = min(gross, balance),
          THEN amount_due = max(0, gross-credit) so the value is well-defined.
        test_recipe:
          setup:
            - "ACTIVE STANDARD account with 3 ACTIVE carts (one extra) AND one SCHEDULED extra pickup (3 items) in March AND credit balance 300 from a missed pickup."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "16 Oak St", holder_name: "Ivo M" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 35 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}/pickup-schedules"
              payload: { stream: "TRASH" }
              as: Dispatcher
              captures: { s0_id: $.data.0.id, s0_eff: $.data.0.effective_pickup_date }
            - call: "POST /pickup-schedules/${s0_id}/events"
              payload: { outcome: "MISSED", reported_at: "${s0_eff}" }
              as: CrewLead
            - call: "POST /accounts/${acct_id}/extra-pickups"
              payload: { requested_date: "2026-03-22T00:00:00Z", bulk_item_count: 3 }
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { epr_id: $.data.id }
            - call: "POST /extra-pickups/${epr_id}/schedule"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { av: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { expected_account_version: "${av}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: Dispatcher
              captures: { gross: $.data.gross_amount_cents, credit: $.data.credit_applied_cents, due: $.data.amount_due_cents }
          assert:
            - "gross == 8500"
            - "credit == 300"
            - "due == 8200"

  # =====================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: account_parallel_status_and_billing_status_dimensions
        grounds:
          - state_machines.ServiceAccount.ACTIVE_to_STOPPED
          - state_machines.ServiceAccount.CURRENT_to_PAST_DUE
          - entities.ServiceAccount.fields.status
          - entities.ServiceAccount.fields.billing_status
        distinguishing_aspect: |
          ServiceAccount carries two independent state dimensions: an account stopped
          (status=STOPPED) while an unpaid invoice drives billing_status=PAST_DUE — the two
          axes evolve independently on the same row (parallel dimensions).
        test_recipe:
          setup:
            - "ACTIVE STANDARD account with one OPEN invoice (due 2026-03-10)."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-25T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "18 Oak St", holder_name: "Mo T" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { v0: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { expected_account_version: "${v0}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-03-01T00:00:00Z", due_date: "2026-03-10T00:00:00Z" }
              as: Dispatcher
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-11T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/stop"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { st: $.data.status, bs: $.data.billing_status }
          assert:
            - "st == STOPPED"
            - "bs == PAST_DUE"
      - name: contamination_notice_branching_acknowledge_or_waive
        grounds:
          - state_machines.ContaminationNotice.OPEN_to_ACKNOWLEDGED
          - state_machines.ContaminationNotice.OPEN_to_WAIVED
          - state_machines.ContaminationNotice.ACKNOWLEDGED_to_WAIVED
        distinguishing_aspect: |
          ContaminationNotice (a different entity from ServiceAccount) branches from OPEN into
          two divergent paths — ACKNOWLEDGED (fee preserved, still billable) or WAIVED (fee zeroed)
          — with different side-effect sets per branch; ACKNOWLEDGED can still later converge to WAIVED.
        test_recipe:
          setup:
            - "Two ACTIVE STANDARD accounts, each with a second-ever contamination notice (fee 1500) OPEN."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "20 Oak St", holder_name: "Sy P" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}/pickup-schedules"
              payload: { stream: "RECYCLING" }
              as: Dispatcher
              captures: { rec1_id: $.data.0.id, rec1_eff: $.data.0.effective_pickup_date, rec2_id: $.data.1.id, rec2_eff: $.data.1.effective_pickup_date }
            - call: "POST /pickup-schedules/${rec1_id}/events"
              payload: { outcome: "CONTAMINATED", reported_at: "${rec1_eff}" }
              as: CrewLead
            - call: "POST /pickup-schedules/${rec2_id}/events"
              payload: { outcome: "CONTAMINATED", reported_at: "${rec2_eff}" }
              as: CrewLead
            - call: "GET /accounts/${acct_id}/contamination-notices"
              payload: {}
              as: Dispatcher
              captures: { n1_id: $.data.0.id, n2_id: $.data.1.id }
          trigger:
            - call: "POST /contamination-notices/${n1_id}/acknowledge"
              payload: {}
              as: AccountHolder
              as_user_id: "${acct_id}"
              captures: { n1_status: $.data.status, n1_fee: $.data.fee_cents }
            - call: "POST /contamination-notices/${n2_id}/waive"
              payload: {}
              as: Dispatcher
              captures: { n2_status: $.data.status, n2_fee: $.data.fee_cents }
          assert:
            - "n1_status == ACKNOWLEDGED and n1_fee == 1500"
            - "n2_status == WAIVED and n2_fee == 0"

  # =====================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: missed_event_credits_then_invoice_consumes_then_void_restores
        grounds:
          - state_machines.PickupSchedule.PLANNED_to_MISSED
          - state_machines.Invoice.OPEN_to_VOID
          - calculations.invoice_gross
          - entities.MissedPickupCredit.fields.status
          - entities.MissedPickupCredit.fields.applied_invoice_id
        distinguishing_aspect: |
          Depth-3 chain from the MISSED trigger: report MISSED -> PickupSchedule MISSED issues
          a MissedPickupCredit (ISSUED) -> generating an invoice consumes it (APPLIED, applied_invoice_id set)
          -> voiding that invoice restores it (ISSUED, applied_invoice_id null). Each link is caused by the prior.
        test_recipe:
          setup:
            - "ACTIVE STANDARD account; first PLANNED schedule reported MISSED, then an invoice generated, then voided."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
              captures: { zone_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: Dispatcher
            - call: "POST /accounts"
              payload: { plan_id: "${plan_id}", zone_id: "${zone_id}", service_address: "22 Oak St", holder_name: "Ed N" }
              as: Dispatcher
              captures: { acct_id: $.data.id }
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "TRASH", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/carts"
              payload: { cart_type: "RECYCLING", size_gallons: 65 }
              as: Dispatcher
            - call: "POST /accounts/${acct_id}/activate-start"
              payload: {}
              as: Dispatcher
            - call: "GET /accounts/${acct_id}/pickup-schedules"
              payload: { stream: "TRASH" }
              as: Dispatcher
              captures: { s0_id: $.data.0.id, s0_eff: $.data.0.effective_pickup_date }
          trigger:
            - call: "POST /pickup-schedules/${s0_id}/events"
              payload: { outcome: "MISSED", reported_at: "${s0_eff}" }
              as: CrewLead
              captures: { ev_id: $.data.id }
            - call: "GET /accounts/${acct_id}/credits"
              payload: {}
              as: Dispatcher
              captures: { cr_id: $.data.0.id, cr_status_issued: $.data.0.status }
            - call: "GET /accounts/${acct_id}"
              payload: {}
              as: Dispatcher
              captures: { av: $.data.version }
            - call: "POST /accounts/${acct_id}/invoices"
              payload: { expected_account_version: "${av}", period_start: "2026-03-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", due_date: "2026-04-15T00:00:00Z" }
              as: Dispatcher
              captures: { inv_id: $.data.id }
            - call: "POST /invoices/${inv_id}/void"
              payload: {}
              as: Dispatcher
          assert:
            - "cr_status_issued == ISSUED"
            - "After invoice generation, MissedPickupCredit.${cr_id}.status was APPLIED with applied_invoice_id == ${inv_id}"
            - "After void, MissedPickupCredit.${cr_id}.status == ISSUED and applied_invoice_id == null"
      - name: stop_cancels_schedules_and_expires_credits_depth2
        grounds:
          - state_machines.ServiceAccount.ACTIVE_to_STOPPED
          - state_machines.PickupSchedule.PLANNED_to_MISSED
          - entities.PickupSchedule.fields.status
          - entities.MissedPickupCredit.fields.status
        distinguishing_aspect: |
          Depth-2 chain from a different trigger (account stop): ACTIVE->STOPPED cancels the
          account's PLANNED PickupSchedule rows AND expires its ISSUED MissedPickupCredit to EXPIRED
          — a propagation pattern distinct from the void-restore chain above.
        test_recipe:
          setup:
            - "ACTIVE STANDARD account with one ISSUED TRASH credit (from a missed pickup) and remaining PLANNED schedule rows."
          setup_api_calls:
            - call: "POST /service-plans"
              payload: { tier: "STANDARD", trash_cart_size_gallons: 65, recycling_cart_size_gallons: 65, monthly_base_cents: 4000, extra_cart_monthly_cents: 1200, extra_pickup_base_cents: 2500, bulk_item_cents: 800 }
              as: Dispatcher
              captures: { plan_id: $.data.id }
            - call: "POST /collection-zones"
              payload: { name: "Z", base_pickup_weekday: 0, recycling_week_parity: "EVEN" }
              as: Dispatcher
