      - name: escalated_repair_authorization_requires_a_live_carrier_claim
        grounds:
          - validations.priority_13
          - errors.ERR_CLAIM_REQUIRED
          - state_machines.RepairOrder.ESCALATED_to_AUTHORIZED
          - state_machines.DamageSurvey.SUBMITTED_to_CLAIMED
          - entities.Vehicle.fields.claim_mandatory
        distinguishing_aspect: |
          A third entity pair, RepairOrder -> CarrierClaim: an ESCALATED repair on a
          claim_mandatory unit cannot be authorized while no CarrierClaim exists for the unit's
          survey. Filing the claim touches only the CarrierClaim and DamageSurvey rows, yet it
          unblocks the RepairOrder transition — the gate is on a sibling aggregate, not on the
          repair order's own fields.
        test_recipe:
          setup:
            - "One unit surveyed with line items 95000 (UNDERBODY 34) and 32000 (GLASS 30) -> severity_index 66, claim_mandatory true."
            - "A repair order for 220000 cents, which the tier rule puts in ESCALATED."
            - "No CarrierClaim exists yet for the survey."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_id: $.data.id }
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/start-discharge"
              payload: {}
              as: PortOperationsPlanner
            - call: "POST /vpc/vessels/${vessel_id}/vehicles"
              payload: { vin: "1VWSA7A3XFC000027", model_line: "EV900" }
              as: PortOperationsPlanner
              captures: { veh_id: $.data.id }
            - call: "POST /vpc/vehicles/${veh_id}/damage-surveys"
              payload: { line_items: [{ damage_zone: "UNDERBODY", severity_points: 34, repair_estimate_cents: 95000 }, { damage_zone: "GLASS", severity_points: 30, repair_estimate_cents: 32000 }] }
              as: DamageSurveyor
              captures: { survey_id: $.data.id }
            - call: "POST /vpc/damage-surveys/${survey_id}/submit"
              payload: {}
              as: DamageSurveyor
              captures: { survey_v: $.data.version, survey_status: $.data.status }
            - call: "POST /vpc/vehicles/${veh_id}/repair-orders"
              payload: { description: "Frame and underbody rebuild", estimate_cents: 220000 }
              as: DamageSurveyor
              captures: { ro_id: $.data.id, tier: $.data.authorization_tier }
          trigger:
            - call: "POST /vpc/repair-orders/${ro_id}/authorize"
              payload: { decision: "AUTHORIZE" }
              as: DistributionManager
              captures: { claim_required_error: $.data.error_id }
            - call: "POST /vpc/damage-surveys/${survey_id}/claims"
              payload: { carrier_scac: "OCNL", expected_damage_survey_version: "${survey_v}" }
              as: DamageSurveyor
              captures: { claim_id: $.data.id }
            - call: "POST /vpc/repair-orders/${ro_id}/authorize"
              payload: { decision: "AUTHORIZE" }
              as: DistributionManager
              captures: { ro_status_after: $.data.status }
          assert:
            - "${survey_status} == SUBMITTED, ${tier} == ESCALATED and Vehicle.${veh_id}.claim_mandatory == true"
            - "${claim_required_error} == ERR_CLAIM_REQUIRED with HTTP 409"
            - "RepairOrder.${ro_id}.status == ESCALATED after the refusal — no partial transition"
            - "CarrierClaim.${claim_id}.status == FILED and DamageSurvey.${survey_id}.status == CLAIMED"
            - "${ro_status_after} == AUTHORIZED and Vehicle.${veh_id}.damage_status == REPAIR_AUTHORIZED"
            - "The unblocking request modified only CarrierClaim and DamageSurvey, never the RepairOrder"

  - rule_id: resource_temporal_overlap
    instances:
      - name: berth_window_requires_turnaround_buffer_clearance_on_both_sides
        grounds:
          - calculations.berth_window_conflict
          - validations.priority_15
          - errors.ERR_BERTH_WINDOW_CONFLICT
          - entities.Berth.fields.turnaround_buffer_minutes
        distinguishing_aspect: |
          Interval semantics A on the Berth resource: exclusive single-occupancy half-open windows
          plus a mandatory 120-minute turnaround buffer applied symmetrically, so adjacency is
          forbidden. A window starting 19:00 — one hour after the incumbent ends at 18:00 — is
          rejected, while a window starting exactly at 20:00 (end + buffer) is accepted.
        test_recipe:
          setup:
            - "One berth B1 with turnaround_buffer_minutes 120."
            - "Incumbent vessel V001 SCHEDULED on B1 for [2026-08-01T06:00Z, 2026-08-01T18:00Z)."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/processing-centers"
              payload: { name: "Newport VPC", port_code: "USNPT", yard_capacity_slots: 50, daily_storage_rate_cents: 1450, labor_rate_cents_per_hour: 9000, fuel_surcharge_pct: 0.0925, free_storage_days: 5 }
              as: PortOperationsPlanner
              captures: { center_id: $.data.id }
            - call: "POST /vpc/berths"
              payload: { processing_center_id: "${center_id}", berth_code: "B1", turnaround_buffer_minutes: 120 }
              as: PortOperationsPlanner
              captures: { berth_id: $.data.id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V001", carrier_scac: "OCNL", berth_window_start: "2026-08-01T06:00:00Z", berth_window_end: "2026-08-01T18:00:00Z", declared_unit_count: 10 }
              as: PortOperationsPlanner
              captures: { vessel_1: $.data.id }
          trigger:
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V002", carrier_scac: "OCNL", berth_window_start: "2026-08-01T19:00:00Z", berth_window_end: "2026-08-02T05:00:00Z", declared_unit_count: 4 }
              as: PortOperationsPlanner
              captures: { buffer_error: $.data.error_id }
            - call: "POST /vpc/vessels"
              payload: { processing_center_id: "${center_id}", berth_id: "${berth_id}", voyage_code: "V003", carrier_scac: "OCNL", berth_window_start: "2026-08-01T20:00:00Z", berth_window_end: "2026-08-02T06:00:00Z", declared_unit_count: 4 }
              as: PortOperationsPlanner
              captures: { vessel_3: $.data.id, v3_status: $.data.discharge_status }
          assert:
            - "${buffer_error} == ERR_BERTH_WINDOW_CONFLICT with HTTP 409 — 19:00 < 18:00 + 120 minutes, so the buffer is breached even though the raw windows do not overlap"
            - "${vessel_3} is created and ${v3_status} == SCHEDULED — a start at exactly 20:00 clears the buffer"
            - "Vessel rows on ${berth_id} with discharge_status in {SCHEDULED, DISCHARGING} == 2 (V001 and V003); V002 was never created"
            - "The same 19:00 window on a berth whose turnaround_buffer_minutes is 0 would be accepted — the rejection comes from the buffer, not the interval arithmetic"

