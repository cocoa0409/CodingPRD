          APPROVED and REJECTED are terminal on the exception fork, so a second decision of ANY
          kind -- APPROVE, REJECT or REQUEST_INFO -- answers ERR_EXCEPTION_NOT_PENDING (409) rather
          than re-running the side effects. The excused seconds are therefore applied exactly once:
