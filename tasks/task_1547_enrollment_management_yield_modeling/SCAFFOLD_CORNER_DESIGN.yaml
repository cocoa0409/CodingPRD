      - name: intake_paused_blocks_admission
        claim_type: precondition_enforcement
        grounds: [state_machines.Application.DECISION_PENDING_to_ADMITTED, entities.Program.fields.intake_posture, "errors[ERR_INTAKE_PAUSED]"]
        distinguishing_aspect: "Once deposited_count + enrolled_count reaches target_enrollment the program posture flips to PAUSED and a further ADMITTED transition is rejected with ERR_INTAKE_PAUSED even though the cycle phase still permits admissions."
        test_recipe:
          setup:
            - "Program capacity 1, target 1; A ADMITTED; B left SUBMITTED before review close; cycle DECISIONS_RELEASED; A deposited at 2027-04-01 (posture PAUSED); B driven to DECISION_PENDING"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: SystemAdmin }
            - call: "POST /enrollment/cycles"
              payload: { name: "Fall 2027", application_opens_at: "2026-08-01T00:00:00Z", application_deadline_at: "2026-11-01T00:00:00Z", deposit_deadline_at: "2027-05-01T00:00:00Z", census_at: "2027-06-01T00:00:00Z", target_class_size: 100 }
              as: EnrollmentManager
              captures: { c_id: $.data.id }
            - call: "POST /enrollment/programs"
              payload: { cycle_id: "${c_id}", name: "PAU", capacity_seats: 1, target_enrollment: 1, tuition_cents: 5000000, scholarship_budget_cents: 0, deposit_amount_cents: 50000 }
              as: EnrollmentManager
              captures: { p_id: $.data.id }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "OPEN" }, as: EnrollmentManager }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "P A", email: "pa@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_a: $.data.id }
            - call: "POST /enrollment/applicants"
              payload: { cycle_id: "${c_id}", full_name: "P B", email: "pb@x.com", applicant_type: "FIRST_YEAR", inquiry_source: "WEB_FORM", distance_band: "LOCAL" }
              as: AdmissionsOfficer
              captures: { ap_b: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_a}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 80, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_a: $.data.id }
            - call: "POST /enrollment/applications"
              payload: { applicant_id: "${ap_b}", program_id: "${p_id}", cycle_id: "${c_id}", academic_score: 81, efc_cents: 5000000 }
              as: AdmissionsOfficer
              captures: { app_b: $.data.id }
            # --- A admitted while posture OPEN ---
            - { call: "POST /enrollment/applications/${app_a}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_a}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-06-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { ra1: $.data.id }
            - { call: "POST /enrollment/reviews/${ra1}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_a}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-06-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { ra2: $.data.id }
            - { call: "POST /enrollment/reviews/${ra2}/submit", payload: { score_academic: 80, score_fit: 80, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_a}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
            - { call: "POST /enrollment/applications/${app_a}/transition", payload: { to_status: "ADMITTED" }, as: AdmissionsOfficer }
            # --- B stays SUBMITTED (does not block DECISIONS_RELEASED); advance cycle ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "REVIEW_CLOSED" }, as: EnrollmentManager }
            - { call: "POST /enrollment/cycles/${c_id}/advance", payload: { to_status: "DECISIONS_RELEASED" }, as: EnrollmentManager }
            # --- A deposits -> posture PAUSED ---
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-04-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /enrollment/deposits", payload: { application_id: "${app_a}", amount_cents: 50000 }, as: Applicant, as_user_id: "${ap_a}" }
            # --- B driven to DECISION_PENDING ---
            - { call: "POST /enrollment/applications/${app_b}/transition", payload: { to_status: "IN_REVIEW" }, as: AdmissionsOfficer }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_b}", reader_id: "reader-1", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-06-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rb1: $.data.id }
            - { call: "POST /enrollment/reviews/${rb1}/submit", payload: { score_academic: 81, score_fit: 81, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-1" }
            - call: "POST /enrollment/reviews"
              payload: { application_id: "${app_b}", reader_id: "reader-2", window_start_at: "2026-08-01T00:00:00Z", window_end_at: "2027-06-01T00:00:00Z" }
              as: AdmissionsOfficer
              captures: { rb2: $.data.id }
            - { call: "POST /enrollment/reviews/${rb2}/submit", payload: { score_academic: 81, score_fit: 81, recommendation: "ADMIT" }, as: ApplicationReader, as_user_id: "reader-2" }
            - { call: "POST /enrollment/applications/${app_b}/transition", payload: { to_status: "DECISION_PENDING" }, as: AdmissionsOfficer }
          trigger:
            - call: "POST /enrollment/applications/${app_b}/transition"
              payload: { to_status: "ADMITTED" }
              as: AdmissionsOfficer
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INTAKE_PAUSED (409) — deposited_count 1 >= target_enrollment 1 -> posture PAUSED"
            - "Application ${app_b} remains DECISION_PENDING"
            - "Program ${p_id}.intake_posture == PAUSED"

