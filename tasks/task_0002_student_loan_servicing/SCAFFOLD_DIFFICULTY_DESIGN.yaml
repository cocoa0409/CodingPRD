              payload: { borrower_id: "${brw_id}", discharge_type: "VETERAN_TOTAL_PERMANENT_DISABILITY", va_certification_doc_id: "VA-DOC-X", filed_on: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_VETERAN"
            - "response.http_status == 422"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: active_repayment_plan_supersede_semantics
        grounds:
          - state_machines.RepaymentPlan.transitions.PENDING_to_ACTIVE
          - state_machines.RepaymentPlan.transitions.ACTIVE_to_SUPERSEDED
          - validations[priority=24]
          - concurrency_rules[plan-create-stale-loan]
        distinguishing_aspect: |
          Resource = Loan; interval = "ACTIVE plan ownership of the Loan". Interval
          semantics: AT MOST ONE plan can be ACTIVE per Loan at any instant — a
          point-occupation overlap rule (zero-length tolerance). The supersede
          mechanism makes this LEGAL (the prior plan exits ACTIVE the instant the
          new one enters), but only via the OCC-guarded POST /repayment-plans
          path. A stale-version create — observing the prior plan's loan.version
          but issuing AFTER another create has bumped it — overlaps the new
          ACTIVE window with stale intent and is rejected with ERR_STALE_VERSION
          (412). Different "interval" from the FORBEARANCE/DEFERMENT window rule
          below: this is a singleton-occupation rule on a Loan resource.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Loan in REPAYMENT with one ACTIVE STANDARD_10YR plan."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "7070", full_name: "Su Per", date_of_birth: "1990-01-01", email: "sup@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 533, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2025-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan1_id: $.data.id }
            - call: "GET /v1/loans/${loan_id}"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v4: $.data.version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "IBR", agi_cents: 4000000, family_size: 2, state_of_residence: "CONTIGUOUS", expected_loan_version: "${v4}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { plan2_id: $.data.id }
          trigger:
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "PAYE", agi_cents: 4000000, family_size: 2, state_of_residence: "CONTIGUOUS", expected_loan_version: "${v4}" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "RepaymentPlan.${plan1_id}.status == SUPERSEDED"
            - "RepaymentPlan.${plan2_id}.status == ACTIVE"
            - "response.error_id == ERR_STALE_VERSION"
            - "response.http_status == 412"

      - name: forbearance_overlapping_active_window_collides_on_loan_status
        grounds:
          - state_machines.Loan.transitions.REPAYMENT_to_FORBEARANCE
          - state_machines.Loan.transitions.FORBEARANCE_to_REPAYMENT
          - validations[priority=21]
        distinguishing_aspect: |
          DIFFERENT resource entity (Loan) AND DIFFERENT interval semantics: this is a
          half-open status-window collision, NOT a singleton-occupation rule.
          A FORBEARANCE_BEGIN attempted while the Loan is already in FORBEARANCE
          (an open status interval [forbearance_begin_date, FORBEARANCE_END]) fails
          with ERR_INVALID_STATE — geometric treatment of adjacency differs: the
          status interval is open-ended (no preset end date) and rejects ANY new
          BEGIN until the interval closes via FORBEARANCE_END. The plan-supersede
          rule above uses pointwise occupation; this uses an open-ended window.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Loan in FORBEARANCE (entered via FORBEARANCE_BEGIN on 2026-06-01)."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "8080", full_name: "For Br", date_of_birth: "1990-01-01", email: "forbr@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 533, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2025-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_BEGIN", effective_on: "2026-06-01", reason_code: "ECONOMIC_HARDSHIP" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "FORBEARANCE_BEGIN", effective_on: "2026-06-15", reason_code: "ECONOMIC_HARDSHIP" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { err: $.data.error_id }
          assert:
            - "Loan.${loan_id}.status == FORBEARANCE"
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_post_then_reverse_preserves_total_balance_cents
        grounds:
          - state_machines.Payment.transitions.PENDING_to_POSTED
          - state_machines.Payment.transitions.POSTED_to_REVERSED
          - calculations.payment_allocation
          - entities.Loan.fields.outstanding_principal_cents
          - entities.Loan.fields.accrued_interest_cents
        distinguishing_aspect: |
          Conserved quantity #1: total_balance_cents := Loan.outstanding_principal_cents
          + Loan.accrued_interest_cents + Loan.capitalized_interest_cents - sum-of-POSTED
          Payment.applied_to_principal_cents - sum-of-POSTED Payment.applied_to_interest_cents.
          Pinned invariant: for the same Loan, total_balance_cents BEFORE
          POST /payments equals total_balance_cents AFTER subsequent POST
          /payments/{id}/reverse (no drift in principal/interest accounting).
          Specifically, on a $20,000 loan with no accrued interest, posting then
          reversing a 50000-cent payment leaves outstanding_principal_cents back at
          2000000 and accrued_interest_cents back at 0.
        test_recipe:
          setup:
            - "Clock at 2026-06-01T00:00:00Z. Loan in REPAYMENT with outstanding_principal_cents=2000000, accrued_interest_cents=0."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "9090", full_name: "Inv One", date_of_birth: "1990-01-01", email: "inv1@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 0, disbursement_date: "2026-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2026-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-06-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
              payload: { loan_id: "${loan_id}", plan_type: "STANDARD_10YR", state_of_residence: "CONTIGUOUS", expected_loan_version: "${v3}" }
              as: LoanServicer
              as_user_id: "svc-1"
          trigger:
            - call: "POST /v1/payments"
              payload: { loan_id: "${loan_id}", amount_cents: 50000, posted_on: "2026-06-01", source: "ACH" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { pay_id: $.data.id }
            - call: "POST /v1/payments/${pay_id}/reverse"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "GET /v1/loans/${loan_id}"
              payload: {}
              as: LoanServicer
              as_user_id: "svc-1"
          assert:
            - "Loan.${loan_id}.outstanding_principal_cents == 2000000"
            - "Loan.${loan_id}.accrued_interest_cents == 0"
            - "Payment.${pay_id}.status == REVERSED"

      - name: pslf_qualifying_count_invariant_under_payment_reverse_then_recount
        grounds:
          - state_machines.PSLFTracker.transitions.TRACKING_to_ELIGIBLE_FOR_FORGIVENESS
          - state_machines.Payment.transitions.PENDING_to_POSTED
          - state_machines.Payment.transitions.POSTED_to_REVERSED
          - entities.PSLFTracker.fields.qualifying_payment_count
        distinguishing_aspect: |
          DIFFERENT conserved quantity: PSLFTracker.qualifying_payment_count
          (count, not currency). Pinned invariant:
          qualifying_payment_count BEFORE any POST /payments equals
          qualifying_payment_count AFTER (POST /payments then immediate
          POST /payments/{id}/reverse). For a borrower with tracker count starting
          at 5 (5 prior qualifying payments), posting + reversing one more
          payment leaves the count at exactly 5 — and if the tracker had
          progressed to ELIGIBLE_FOR_FORGIVENESS during the post (e.g., count
          temporarily hit 120 then dropped to 119 on reverse), the tracker
          reverts to TRACKING, with the count back to its pre-action value.
          The conserved quantity (count) is integer-typed and entity-scoped
          (PSLFTracker), distinct from the cents-typed Loan-scoped quantity above.
        test_recipe:
          setup:
            - "Clock at 2027-01-01T00:00:00Z. Borrower with PSLFTracker.qualifying_payment_count=5 (achieved via 5 prior qualifying Payments + APPROVED EmploymentCertification covering them). REPAYMENT loan, ACTIVE STANDARD_10YR plan."
          setup_api_calls:
            - call: "POST /v1/_clock/advance"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: LoanServicer
              as_user_id: "svc-1"
            - call: "POST /v1/borrowers"
              payload: { ssn_last4: "1212", full_name: "Inv Two", date_of_birth: "1990-01-01", email: "inv2@example.com", military_status: "NONE" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { brw_id: $.data.id }
            - call: "POST /v1/loans"
              payload: { borrower_id: "${brw_id}", loan_type: "DIRECT_UNSUBSIDIZED", original_principal_cents: 2000000, interest_rate_bps: 533, disbursement_date: "2025-06-01" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { loan_id: $.data.id }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "GRACE_BEGIN", effective_on: "2025-06-01", reason_code: "OTHER" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v2: $.data.loan_version }
            - call: "POST /v1/loans/${loan_id}/servicing-events"
              payload: { event_type: "REPAYMENT_BEGIN", effective_on: "2026-02-01", reason_code: "GRACE_EXPIRY" }
              as: LoanServicer
              as_user_id: "svc-1"
              captures: { v3: $.data.loan_version }
            - call: "POST /v1/repayment-plans"
