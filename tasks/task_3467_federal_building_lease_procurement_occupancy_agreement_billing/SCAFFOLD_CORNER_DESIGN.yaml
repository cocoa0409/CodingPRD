          trigger:
            - { call: "POST /leasing/occupancy-agreements/${oa}/amend", payload: { expected_oa_version: "${oa_v} - 1", delta_sf: 1000, note: "stale writer" }, as: GSALeasingOfficer, captures: { err: $.data.error_id } }
            - { call: "POST /leasing/occupancy-agreements/${oa}/amend", payload: { expected_oa_version: "${oa_v}", delta_sf: 1000, note: "rebased writer" }, as: GSALeasingOfficer, captures: { new_v: $.data.version } }
          assert:
            - "Stale amend: ${err} == ERR_STALE_VERSION (412); OA unchanged (assigned_sf still 20000, version still ${oa_v})"
            - "Rebased amend: 200; ${new_v} == ${oa_v} + 1; assigned_sf == 21000"
            - "Building ${bld}.available_sf == 29000 (delta debited); amendment_history last entry: delta_sf == 1000, old_sf == 20000, new_sf == 21000"

