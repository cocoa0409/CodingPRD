  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_unit_version_blocks_a_silent_refurb_order_supersession
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[refurb-order-create-stale-unit]
          - errors.ERR_STALE_UNIT_VERSION
          - state_machines.RefurbOrder[SCHEDULED -> SUPERSEDED]
          - validations[priority 52]
        distinguishing_aspect: "The stale create is refused with 412 and — the point of the rule — leaves the existing SCHEDULED order alive; the identical body with the correct version then succeeds AND supersedes it. Scheduling itself does not touch ResaleUnit.version, so the correct value is still the version read before the first order; only /start bumps it to 2."
        test_recipe:
          setup:
            - "One INTAKE ResaleUnit at version 1, two bays at ST-01, and one SCHEDULED refurb order booking BAY-1 for 09:00-11:00."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "OUTERWEAR", condition_grade: "B", base_credit_pct_bp: 2000, resale_price_pct_bp: 3900, refurb_budget_cap_pct_bp: 3000, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/store-locations"
              payload: { code: "ST-01", region_code: "US-CA" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { store_id: "$.data.id" }
            - call: "POST /recommerce/store-locations/${store_id}/refurb-bays"
              payload: { code: "BAY-1", bay_type: "CLEANING" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { bay_1: "$.data.id" }
            - call: "POST /recommerce/store-locations/${store_id}/refurb-bays"
              payload: { code: "BAY-2", bay_type: "REPAIR" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { bay_2: "$.data.id" }
            - call: "POST /recommerce/customers"
              payload: { email: "ava@example.com", full_name: "Ava Reyes", loyalty_tier: "PLUS" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { cust_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins"
              payload: { customer_id: "${cust_id}", store_location_id: "${store_id}", channel: "MAIL_IN", product_category: "OUTERWEAR", declared_grade: "B", msrp_minor: 50000, item_mass_grams: 1400 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ti_id: "$.data.id" }
            - call: "POST /recommerce/trade-ins/${ti_id}/receive"
              payload: {}
              as: IntakeAgent
              as_user_id: "intake-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/authenticate"
              payload: { authenticity_result: "GENUINE", assessed_grade: "B" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "POST /recommerce/trade-ins/${ti_id}/disposition"
              payload: { decision: "ACCEPT", ownership_treatment: "OWNED_INVENTORY" }
              as: Authenticator
              as_user_id: "auth-001"
            - call: "GET /recommerce/resale-units?trade_in_id=${ti_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { unit_id: "$.data[0].id", ver_1: "$.data[0].version", life_1: "$.data[0].lifecycle_state" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${unit_id}", refurb_bay_id: "${bay_1}", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_resale_unit_version: "${ver_1}" }
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro_1: "$.data.id", ro_1_status: "$.data.status" }
          trigger:
            - call: "GET /recommerce/resale-units/${unit_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ver_after_schedule: "$.data.version" }
            - call: "PATCH /recommerce/customers/${cust_id}"
              payload: { loyalty_tier: "STANDARD" }
              as: ProgramAdmin
              as_user_id: "admin-001"
              captures: { wrong_ver: "$.data.version" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${unit_id}", refurb_bay_id: "${bay_2}", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_resale_unit_version: "${wrong_ver}" }
              as: RefurbTechnician
              as_user_id: "tech-002"
              captures: { e_stale: "$.data.error_id" }
            - call: "GET /recommerce/refurb-orders/${ro_1}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro_1_after_stale: "$.data.status" }
            - call: "POST /recommerce/refurb-orders"
              payload: { resale_unit_id: "${unit_id}", refurb_bay_id: "${bay_2}", window_start_at: "2026-08-01T09:00:00Z", window_end_at: "2026-08-01T11:00:00Z", expected_resale_unit_version: "${ver_1}" }
              as: RefurbTechnician
              as_user_id: "tech-002"
              captures: { ro_2: "$.data.id", ro_2_status: "$.data.status", ro_2_bay: "$.data.refurb_bay_id" }
            - call: "GET /recommerce/refurb-orders/${ro_1}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ro_1_final: "$.data.status", ro_1_ver: "$.data.version" }
            - call: "POST /recommerce/refurb-orders/${ro_2}/start"
              payload: {}
              as: RefurbTechnician
              as_user_id: "tech-002"
              captures: { ro_2_started: "$.data.status" }
            - call: "GET /recommerce/resale-units/${unit_id}"
              as: RefurbTechnician
              as_user_id: "tech-001"
              captures: { ver_after_start: "$.data.version", life_after_start: "$.data.lifecycle_state" }
          assert:
            - "${life_1} == INTAKE and ${ver_1} == 1 on the freshly created unit"
            - "${ro_1_status} == SCHEDULED and ${ver_after_schedule} == 1 — booking a bay does not write the unit, so its version does not move"
            - "${wrong_ver} == 3 — Ava's Customer row is at version 3 after creation, the acceptance cascade and this PATCH, so the caller is quoting a version that belongs to another row"
            - "${e_stale} == ERR_STALE_UNIT_VERSION with HTTP 412 — 3 is not the unit's current version 1"
            - "${ro_1_after_stale} == SCHEDULED — the refused create superseded nothing, which is exactly the silent bay-cancellation the rule prevents"
            - "the create with version 1 returns 201 with ${ro_2_status} == SCHEDULED and ${ro_2_bay} == ${bay_2}"
            - "${ro_1_final} == SUPERSEDED and ${ro_1_ver} == 2 — the accepted create did supersede the earlier order"
            - "${ro_2_started} == IN_PROGRESS, and then ${ver_after_start} == 2 with ${life_after_start} == IN_REFURB — /start is the write that increments the unit version"

