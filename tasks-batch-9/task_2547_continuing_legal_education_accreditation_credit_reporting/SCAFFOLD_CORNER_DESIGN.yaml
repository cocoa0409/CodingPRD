      - name: the_audit_pool_is_a_closed_interval_and_a_redraw_recomputes_it_from_scratch
        claim_type: chronological
        grounds:
          - calculations.audit_sample_selection
          - domain_constants.RISK_SAMPLE_N_LOW
          - state_machines.ProviderAudit.SAMPLED_to_SAMPLED
          - endpoints[POST /cle/provider-audits/{id}/audit-actions]
        distinguishing_aspect: "The eligibility window is a CLOSED interval on presented_at — a course presented at the exact audit_period_start and one at the exact audit_period_end are both in the pool while courses one second outside either edge are not — and the ranking is presented_at ASC with created_at ASC as the tiebreak. A redraw after a new course is registered replaces the whole list rather than appending: the course sharing the earliest instant but created later takes the second slot and evicts the end-of-window course."
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default; a freshly accredited provider therefore opens the audit at risk_score 0.0, which is the RISK_SAMPLE_N_LOW tier (target 2)."
            - "Four ON_DEMAND courses of the provider: cA presented exactly at the audit_period_start, cB presented exactly at the audit_period_end, cD one second before the start, cE one second after the end."
            - "The audit window is the closed interval [2025-03-05T09:00:00Z, 2025-06-05T09:00:00Z]."
          setup_api_calls:
            - call: "POST /cle/providers"
              payload: { name: "Meridian Course Publishers", provider_type: "LAW_SCHOOL" }
              as: BoardAdmin
              captures: { prov_id: $.data.id, prov_v1: $.data.version }
            - call: "POST /cle/providers/${prov_id}/accreditation-actions"
              payload: { action: "GRANT_FULL", expected_provider_version: "${prov_v1}" }
              as: BoardAdmin
            - call: "POST /cle/courses"
              payload: { title: "Boundary Course At Window Start", delivery_format: "ON_DEMAND", total_minutes: 120, presented_at: "2025-03-05T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_a: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "Boundary Course At Window End", delivery_format: "ON_DEMAND", total_minutes: 120, presented_at: "2025-06-05T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_b: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "One Second Before The Window", delivery_format: "ON_DEMAND", total_minutes: 120, presented_at: "2025-03-05T08:59:59Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_d: $.data.id }
            - call: "POST /cle/courses"
              payload: { title: "One Second After The Window", delivery_format: "ON_DEMAND", total_minutes: 120, presented_at: "2025-06-05T09:00:01Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_e: $.data.id }
            - call: "POST /cle/provider-audits"
              payload: { provider_id: "${prov_id}", audit_period_start: "2025-03-05T09:00:00Z", audit_period_end: "2025-06-05T09:00:00Z", trigger_type: "RISK_BASED" }
              as: BoardAdmin
              captures: { aud_id: $.data.id, aud_v1: $.data.version }
          trigger:
            - call: "POST /cle/provider-audits/${aud_id}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${aud_v1}" }
              as: BoardAdmin
              captures: { aud_v2: $.data.version }
            - call: "POST /cle/courses"
              payload: { title: "Late Registered Course Sharing The Start Instant", delivery_format: "ON_DEMAND", total_minutes: 120, presented_at: "2025-03-05T09:00:00Z", attendance_verification_method: "CERTIFICATE", credit_allocations: [ { category: "GENERAL", minutes: 120 } ], provider_id: "${prov_id}" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
              captures: { c_f: $.data.id }
            - call: "POST /cle/provider-audits/${aud_id}/audit-actions"
              payload: { action: "DRAW_SAMPLE", expected_audit_version: "${aud_v2}" }
              as: BoardAdmin
          assert:
            - "ProviderAudit.${aud_id}.risk_score_at_open == 0.0 (a provider accredited on the current clock instant has zero staleness and zero counters)"
            - "First draw -> status == 'SAMPLED', sample_size == 2 and sampled_course_ids == [${c_a}, ${c_b}] in exactly that order — both closed-interval boundaries are inside the pool"
            - "First draw: neither ${c_d} (one second before the start) nor ${c_e} (one second after the end) appears in sampled_course_ids"
            - "Second draw -> status is STILL 'SAMPLED' (the repeatable self-transition), sample_size == 2 and sampled_course_ids == [${c_a}, ${c_f}] — the list is recomputed from scratch, not appended to, and ${c_b} has been evicted"
            - "The presented_at tie between ${c_a} and ${c_f} is broken by created_at ASC, so ${c_a} keeps the first slot"
            - "Provider.${prov_id}.courses_sampled_lifetime == 2 — the redraw adds (new sample_size - prior sample_size) == 0, so replacing a two-course sample with another two-course sample does not double the lifetime counter"
            - "ProviderAudit.${aud_id}.version == 3 after the second draw"

      - name: a_waived_election_and_a_non_live_excess_both_forfeit_the_carryover
        claim_type: threshold
        grounds:
          - calculations.carryover_determination
          - domain_constants.CARRYOVER_CAP_GENERAL_MINUTES
          - entities.ComplianceCycle.fields.carryover_election
          - entities.ComplianceCycle.fields.earned_live_minutes
        distinguishing_aspect: "Two independent gates zero an otherwise real surplus. A prorated cycle that requires 720 minutes and earns 900 entirely from on-demand and self-study minutes has a 180-minute excess but earned_live_minutes 0, so min(600, 180, 0) forfeits all of it; and a cycle with a 720-minute general excess and a 120-minute ethics excess entirely in LIVE minutes still carries nothing forward when it certifies with carryover_election WAIVE_CARRYOVER. An implementation that omits the earned_live_minutes term transfers 180 minutes the rules forfeit."
        test_recipe:
          setup:
            - "Logical clock left at its 2026-08-01T00:00:00Z default."
            - "One ACCREDITED self-certifying provider offering ON_DEMAND OD1 720 minutes (ETHICS 90 / TECH 60 / BIAS 60 / GENERAL 510), SELF_STUDY SS1 180 GENERAL minutes, LIVE_IN_PERSON L1 1800 minutes (ETHICS 300 / TECH 60 / BIAS 120 / GENERAL 1320) and LIVE_IN_PERSON L2 720 GENERAL minutes on a different day."
            - "Attorney P admitted 2025-03-15 with the 2024-01-01 -> 2026-01-01 period, which prorates to 720 / 90 / 60 / 60, holding the two non-live records."
