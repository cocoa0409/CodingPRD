  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: hearing_courtroom_overlap_rejected
        grounds:
          - validations[priority=10]
          - entities.Hearing.fields.courtroom
          - entities.Hearing.fields.start_at
          - entities.Hearing.fields.end_at
          - errors[ERR_HEARING_CONFLICT]
        distinguishing_aspect: |
          Courtroom interval semantics: a second SCHEDULED hearing in the SAME courtroom
          whose [start_at,end_at) interval overlaps an existing one is rejected
          (ERR_HEARING_CONFLICT); back-to-back adjacency (new.start == existing.end) is
          allowed (half-open intervals).
        test_recipe:
          setup:
            - "An OPEN case with a hearing SCHEDULED in courtroom 'A' 10:00-11:00 by judge jdg_1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00.000Z" }
              as: SystemAdmin
            - call: "POST /courts"
              payload: { name: "Sup Ct O", jurisdiction_code: "CA", filing_fee_cents: 43500, business_days_only: true, holidays: [], appeal_window_days: 30 }
              as: SystemAdmin
              captures: { court_id: $.data.id }
            - call: "POST /cases"
              payload: { court_id: "${court_id}", caption: "Acme v Beta", case_type: "CONTRACT" }
              as: Clerk
              captures: { case_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Acme", role: "PLAINTIFF", attorney_user_id: "att_1" }
              as: Clerk
              captures: { p_pl_id: $.data.id }
            - call: "POST /parties"
              payload: { case_id: "${case_id}", display_name: "Beta", role: "DEFENDANT", attorney_user_id: "att_2" }
              as: Clerk
              captures: { p_df_id: $.data.id }
            - call: "POST /filings"
              payload: { case_id: "${case_id}", filed_by_party_id: "${p_pl_id}", document_type: "COMPLAINT", title: "Complaint" }
              as: Attorney
              as_user_id: "att_1"
              captures: { f_comp_id: $.data.id }
            - call: "POST /filings/${f_comp_id}/pay-fee"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/claim-review"
              payload: {}
              as: Clerk
            - call: "POST /filings/${f_comp_id}/accept"
              payload: {}
              as: Clerk
            - call: "POST /cases/${case_id}/open"
              payload: {}
              as: Clerk
            - call: "POST /hearings"
              payload: { case_id: "${case_id}", courtroom: "A", judge_user_id: "jdg_1", start_at: "2026-03-05T10:00:00.000Z", end_at: "2026-03-05T11:00:00.000Z" }
              as: Judge
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /hearings"
              payload: { case_id: "${case_id}", courtroom: "A", judge_user_id: "jdg_9", start_at: "2026-03-05T10:30:00.000Z", end_at: "2026-03-05T11:30:00.000Z" }
              as: Judge
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == 'ERR_HEARING_CONFLICT'"

      - name: hearing_judge_overlap_across_courtrooms_rejected
        grounds:
          - validations[priority=10]
          - entities.Hearing.fields.judge_user_id
          - errors[ERR_HEARING_CONFLICT]
        distinguishing_aspect: |
          A different interval-semantics axis from the courtroom rule: the same
          judge_user_id may not preside over two overlapping hearings even in DIFFERENT
          courtrooms — the conflict is keyed on the judge resource, not the room.
        test_recipe:
          setup:
            - "An OPEN case with a hearing SCHEDULED courtroom 'A' 10:00-11:00 judge jdg_1; second hearing courtroom 'B' same time same judge."
          setup_api_calls:
