  # =========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: dual_agency_safety_beats_budget_constraint
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_DUAL_AGENCY_FORBIDDEN]
          - errors[ERR_OVER_BUDGET]
        distinguishing_aspect: |
          An offer where the buyer_agent IS the listing agent (business_safety, priority 5) AND
          initial_price_cents exceeds budget (business_constraint, priority 9) must return ERR_DUAL_AGENCY_FORBIDDEN
          (lower priority number wins), pinning a safety-vs-constraint category pair.
        test_recipe:
          setup:
            - "ACTIVE listing whose listing_agent also represents a buyer; that buyer's budget is 40000000."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Dual", license_no: "L-1009" }
              as: Anonymous
              captures: { dual_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${dual_id}", full_name: "Bob", max_budget_cents: 40000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${dual_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${dual_id}", address: "9 Oak St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${dual_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-9" }
              as: ListingAgent
              as_user_id: "${dual_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${dual_id}"
          trigger:
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${dual_id}", initial_price_cents: 50000000, earnest_money_cents: 0 }
              as: BuyerAgent
              as_user_id: "${dual_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_DUAL_AGENCY_FORBIDDEN (422), NOT ERR_OVER_BUDGET — priority 5 beats priority 9"

      - name: invalid_state_beats_turn_on_terminal_offer
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_NOT_YOUR_TURN]
        distinguishing_aspect: |
          Countering a REJECTED (terminal) offer where it is also not the acting side's turn must return
          ERR_INVALID_STATE (state, priority 6), NOT ERR_NOT_YOUR_TURN (state-turn, priority 7) — a state-vs-turn
          category pair distinct from the safety/constraint pair above.
        test_recipe:
          setup:
            - "An offer that has been REJECTED by the listing agent (terminal)."
          setup_api_calls:
            - call: "POST /brokerages"
              payload: { name: "Acme", default_total_commission_pct: 0.06, default_coop_split_pct: 0.50 }
              as: Anonymous
              captures: { brk_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Lara", license_no: "L-1010" }
              as: Anonymous
              captures: { la_id: $.data.id }
            - call: "POST /agents"
              payload: { brokerage_id: "${brk_id}", full_name: "Ben", license_no: "B-2010" }
              as: Anonymous
              captures: { ba_id: $.data.id }
            - call: "POST /buyers"
              payload: { buyer_agent_id: "${ba_id}", full_name: "Bob", max_budget_cents: 60000000, monthly_income_cents: 2000000 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { buyer_id: $.data.id }
            - call: "POST /listings"
              payload: { listing_agent_id: "${la_id}", address: "10 Oak St", list_price_cents: 50000000 }
              as: ListingAgent
              as_user_id: "${la_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /listings/${lst_id}/lockboxes"
              payload: { serial_no: "LB-10" }
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/activate"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
            - call: "POST /listings/${lst_id}/offers"
              payload: { buyer_id: "${buyer_id}", buyer_agent_id: "${ba_id}", initial_price_cents: 49000000, earnest_money_cents: 0 }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offers/${off_id}/reject"
              payload: {}
              as: ListingAgent
              as_user_id: "${la_id}"
          trigger:
            - call: "POST /offers/${off_id}/counter"
              payload: { counter_price_cents: 48000000, actor_agent_id: "${ba_id}" }
              as: BuyerAgent
              as_user_id: "${ba_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_INVALID_STATE (409), NOT ERR_NOT_YOUR_TURN — priority 6 beats priority 7"

  # =========================================================================
