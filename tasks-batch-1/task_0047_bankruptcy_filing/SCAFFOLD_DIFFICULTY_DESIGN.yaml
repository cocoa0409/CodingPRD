              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /schedules"
              payload: { case_id: "${case_id}", schedule_letter: "J", description: "rent" }
              as: Debtor
              as_user_id: "${dbtr_id}"
            - call: "POST /debts"
              payload: { case_id: "${case_id}", creditor_id: "${cr_id}", debt_class: "PRIORITY", scheduled_amount_cents: 200000 }
              as: Debtor
              as_user_id: "${dbtr_id}"
              captures: { p_debt_id: $.data.id }
            - call: "POST /cases/${case_id}/petition"
              payload: {}
