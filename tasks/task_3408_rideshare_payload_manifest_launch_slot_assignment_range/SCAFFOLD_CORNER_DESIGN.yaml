      - name: license_composite_weighted_score_threshold_69_vs_70
        claim_type: Constants Applied
        grounds:
          - calculations.license_composite_score
          - errors.ERR_LICENSE_SCORE_TOO_LOW
        distinguishing_aspect: "Weights 0.5/0.3/0.2 with round_half_up: scores (50,90,80) composite to 68 and GRANT is 422 ERR_LICENSE_SCORE_TOO_LOW; scores (60,80,80) composite to exactly 70 and GRANT succeeds — the threshold is >= 70. A DENIED license is terminal and rejects a later GRANT with 409."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. One customer; two PAYLOAD_OPERATOR applications filed."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - call: "POST /rideshare/licenses"
              payload: { subject_type: "CUSTOMER", kind: "PAYLOAD_OPERATOR", customer_id: "${c_id}", valid_until: "2027-01-01T00:00:00Z", debris_score: 50, spectrum_score: 90, operator_history_score: 80 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l1: $.data.id }
            - call: "POST /rideshare/licenses"
              payload: { subject_type: "CUSTOMER", kind: "PAYLOAD_OPERATOR", customer_id: "${c_id}", valid_until: "2027-01-01T00:00:00Z", debris_score: 60, spectrum_score: 80, operator_history_score: 80 }
              as: Customer
              as_user_id: "${c_id}"
              captures: { l2: $.data.id }
          trigger:
            - call: "POST /rideshare/licenses/${l1}/transition"
              payload: { to_state: "GRANTED" }
              as: Regulator
              captures: { e1: $.data.error_id }
            - call: "POST /rideshare/licenses/${l1}/transition"
              payload: { to_state: "DENIED" }
              as: Regulator
            - call: "POST /rideshare/licenses/${l1}/transition"
              payload: { to_state: "GRANTED" }
              as: Regulator
              captures: { e2: $.data.error_id }
            - call: "POST /rideshare/licenses/${l2}/transition"
              payload: { to_state: "GRANTED" }
              as: Regulator
          assert:
            - "RegulatoryLicense.${l1}.composite_score == 68 (0.5x50 + 0.3x90 + 0.2x80)"
            - "the L1 GRANT attempt returns 422 and e1 == ERR_LICENSE_SCORE_TOO_LOW"
            - "the L1 DENY returns 200 and status == DENIED"
            - "the post-DENIED GRANT returns 409 and e2 == ERR_INVALID_STATE (terminal lockdown)"
            - "RegulatoryLicense.${l2}.composite_score == 70 and its GRANT returns 200 with status == GRANTED (boundary >=)"

      - name: rebooking_fee_consumes_right_first_then_charges_25_percent_bracket
        claim_type: Correct Result
        grounds:
          - calculations.rebooking_fee
          - entities.LaunchContract.fields.rebookings_remaining
          - entities.LaunchContract.fields.total_rebooking_fees_cents
        distinguishing_aspect: "Fee precedence: the first rebook consumes the free right (fee 0, rights 1 -> 0); the second, with rights exhausted and 49 days to the target window (31 <= 49 <= 60 bracket), charges 25% of the 30,000,000-cent quote = 7,500,000."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Contract (MARGINAL, one 50 kg payload -> quoted 30,000,000 cents at signing) SIGNED with 1 rebooking right. Target missions M2 [2026-10-16..2026-10-26] and M3 [2026-10-20..2026-10-30] both MANIFEST_OPEN, both covered by the contract window [2026-10-01, 2026-10-31]."
          setup_api_calls:
            - *k_clock
            - *k_customer
            - call: "POST /rideshare/missions"
              payload: { mission_name: "Transporter-B2", target_orbit: "SSO", window_open_utc: "2026-10-16T00:00:00Z", window_close_utc: "2026-10-26T00:00:00Z", mass_capacity_kg: 100, volume_capacity_m3: 2.0 }
              as: MissionOps
