              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { ded_id: $.data.id }
            - call: "POST /trade-marketing/deductions/${ded_id}/dispute"
              payload: { reason_code: "NO_AGREEMENT", disputed_amount: 100.00 }
              as: DeductionSpecialist
              as_user_id: "ded-1"
              captures: { disp_id: $.data.id }
            - call: "POST /trade-marketing/disputes/${disp_id}/write-off"
              payload: { write_off_amount: 100.00, write_off_reason: "Below recovery cost threshold." }
              as: DeductionSpecialist
              as_user_id: "ded-2"
              captures: { wo_status: $.data.status }
          trigger:
            - call: "POST /trade-marketing/disputes/${disp_id}/write-off"
              payload: { write_off_amount: 100.00 }
              as: DeductionSpecialist
              as_user_id: "ded-2"
