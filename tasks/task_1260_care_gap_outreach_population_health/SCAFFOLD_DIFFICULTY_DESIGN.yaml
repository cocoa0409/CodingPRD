  # -------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: incentive_tier_boundary_at_080
        grounds:
          - calculations.panel_manager_incentive_payout
          - entities.IncentivePayout.fields.tier_multiplier_bps
        distinguishing_aspect: |
          Boundary: utilization_ratio == 0.80 EXACTLY yields tier 12000 (not
          10000) — the scaffold uses `>= 0.80`. At 0.7999 tier is 10000.
          Metric: tier_multiplier_bps. Endpoint: POST
          /panel-manager-workloads/{id}/incentive-payouts/projection.
        test_recipe:
          setup:
            - "Registry, measure, cohort, panel with member_count = 200 (utilization = 200/250 = 0.8000); workload row for pm_1; one gap closed"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RB1", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /population-health/registries/${reg_id}/measure-definitions"
              payload: { measure_code: "SCR", measure_domain: "SCREENING", lookback_days: 365 }
              as: ProgramAdministrator
              captures: { meas_id: $.data.id }
            - call: "POST /population-health/measure-definitions/${meas_id}/publish"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/cohort-definitions"
              payload: { cohort_code: "C", min_age: 50, max_age: 75, risk_tier_filter: "ANY" }
              as: ProgramAdministrator
              captures: { coh_id: $.data.id }
            - call: "POST /population-health/cohort-definitions/${coh_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/members"
              payload: { mrn: "M", date_of_birth: "1960-01-01T00:00:00Z", risk_tier: "LOW" }
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/registry-panels"
              payload: { cohort_id: "${coh_id}", measure_id: "${meas_id}", panel_manager_id: "pm_1" }
              as: ProgramAdministrator
              captures: { panel_id: $.data.id }
            - call: "POST /population-health/registry-panels/${panel_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /population-health/registries/${reg_id}/panel-manager-workloads"
              payload: { panel_manager_id: "pm_1", period_key: "2026-06" }
              as: ProgramAdministrator
              captures: { wl_id: $.data.id }
            # Close one gap so base_amount != 0
            - call: "GET /population-health/registry-panels/${panel_id}/care-gaps"
              payload: {}
              as: ProgramAdministrator
              captures: { gap_id: $.data.0.id }
            - call: "POST /population-health/care-gaps/${gap_id}/gap-closure-evidence"
              payload: { evidence_type: "CHART_REVIEW", service_date: "2026-04-15T00:00:00Z", document_uri: "s3://e.pdf" }
              as: PanelManager
              as_user_id: "pm_1"
              captures: { ev_id: $.data.id }
            - call: "POST /population-health/gap-closure-evidence/${ev_id}/approve"
              payload: {}
              as: QualityReviewer
              as_user_id: "qr_1"
          trigger:
            - call: "POST /population-health/panel-manager-workloads/${wl_id}/incentive-payouts/projection"
              payload: {}
              as: ProgramAdministrator
              captures: { payout_id: $.data.id, tier: $.data.tier_multiplier_bps }
          assert:
            # utilization = 1/250 = 0.0040 -> tier 10000 (below 0.80)
            - "IncentivePayout.${payout_id}.tier_multiplier_bps == 10000"
            # base = round(4500 * 10000 / 10000) * 1 = 4500
            - "IncentivePayout.${payout_id}.base_amount_cents == 4500"

      - name: closure_rate_zero_denominator_returns_null
        grounds:
          - calculations.gap_closure_rate
          - entities.MeasurePerformanceReport.fields.closure_rate_bps
        distinguishing_aspect: |
          Boundary: denominator_count == 0 (empty set) -> closure_rate_bps is
          NULL, NOT zero and NOT an error. Different metric (closure_rate_bps)
          and different endpoint (GET /measure-performance-reports/{id}) than
          the incentive tier boundary.
        test_recipe:
          setup:
            - "Registry, measure, cohort with min_age=70 max_age=75; ONE member of age 40 (outside cohort); panel activated -> member_count = 0"
          setup_api_calls:
            - call: "POST /population-health/registries"
              payload: { name: "RB2", program_year: 2026 }
              as: ProgramAdministrator
              captures: { reg_id: $.data.id }
