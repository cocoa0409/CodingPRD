    side_effects: []

  - method: GET
    path: "/hr-org-units/performance-concerns"
    description: "Flat list of concerns with FK filters"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager]
    code: 200
    input: ["employee_id?", "raised_by_manager_id?", "decided_by_hrbp_id?", "status?", "category?", "limit?", "offset?"]
    output: "PerformanceConcern[]"
    side_effects: []

  - method: GET
    path: "/hr-org-units/pip-templates/{templateId}"
    description: "Flat read of a PIP template by id"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: []
    output: PIPTemplate
    side_effects: []

  - method: GET
    path: "/hr-org-units/pip-templates"
    description: "Flat list of PIP templates with FK filters"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["hr_org_unit_id?", "template_status?", "category?", "limit?", "offset?"]
    output: "PIPTemplate[]"
    side_effects: []

  - method: GET
    path: "/hr-org-units/pips/{pipId}"
    description: "Flat read of a PIP by id"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: []
    output: PerformanceImprovementPlan
    side_effects: []

  - method: GET
    path: "/hr-org-units/pips"
    description: "Flat list of PIPs with FK filters"
    roles: [HRSystemAdmin, HRBusinessPartner, HRDirector, LegalCounsel, Manager, Employee]
    code: 200
    input: ["employee_id?", "concern_id?", "template_id?", "issuing_hrbp_id?", "status?", "limit?", "offset?"]
    output: "PerformanceImprovementPlan[]"
    side_effects: []

  - method: GET
