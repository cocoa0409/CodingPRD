      - name: only_one_dispute_may_be_open_on_a_deduction_at_a_time
        claim_type: error_triggerable
        grounds:
          - errors[ERR_DISPUTE_ALREADY_OPEN]
          - validations[priority=65]
          - endpoints[POST /ppp/deduction-events/{id}/disputes]
        distinguishing_aspect: |
          Uniqueness here is scoped to the live dispute, not to the deduction's history: a
          RAISED dispute blocks a second one even though the deduction is still ISSUED and
          the concessionaire is the right party. The check must key on the open dispute
          rather than on any counter, so the deduction's status must remain DISPUTED and the
          period's money must not move — the second request costs nothing.
        test_recipe:
          setup:
            - "The base chain with ServicePeriod 1 verified at (100, 2, 4), one 400-point UNAVAILABILITY event, and one dispute already RAISED against it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ppp/concessionaires"
              payload: { legal_name: "Meridian Infrastructure Partners", sponsor_equity_commitment_cents: 100000000 }
