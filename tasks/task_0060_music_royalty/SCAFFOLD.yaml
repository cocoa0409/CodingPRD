scenario: "Music royalty distribution system: work registration with work metadata (title/duration/ISRC/ISWC), rights-type classification (composition/lyrics/recording/performance), co-creator declaration, original-work proof, and registration review; rights-holder share with multi-rights-holder share ratio, agency-relationship binding (publisher/label/CMO), share-change history, share dispute marking, and minor-rights-holder handling; playback data collection with multi-channel data ingestion (streaming/radio/TV/public venue/live), data-source authentication, data-validity check, deduplication and aggregation, and missing-data supplementation; royalty pool calculation with revenue-source classification, platform-share-ratio deduction, mechanical and performance royalty separation, regional-revenue separate accounting, and pool-distribution-period closing; distribution rules (per play / per duration) with hybrid distribution rules by channel, minimum-payout threshold, weighting by playback type, micro-revenue accumulation, and rule-version control; dispute freezing with disputed-work fund freezing, dispute-investigation workflow, multi-party evidence submission, mediation and arbitration, and post-resolution release and disbursement; batch disbursement with payout-cycle configuration, batch-payment generation, multi-currency settlement, tax withholding by jurisdiction, payment-channel routing, and payment-failure retry; event-driven synchronization with payment, banking, and external CMO systems; audit logging for share changes and distribution records."

domain_name: "music-royalty-distribution"
api_prefix: "/royalty"

complexity_profile:
  primary_archetype: "pricing_engine"
  secondary_archetype: "workflow_orchestration"
  complexity_layers:
    - "dual_variant_calculation"
    - "cascading_side_effects"
    - "rate_threshold_triggers"
    - "compliance_audit"

  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate

  role_model: "peer_roles"
  consistency_model: "immediate"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:

  - name: Work
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Title of the musical work."
        constraints: "1..200 chars; required"
      - name: duration_seconds
        type: integer
        source: input
        description: "Playback duration in whole seconds."
        constraints: "1..7200"
      - name: isrc
        type: string
        source: input
        description: "International Standard Recording Code (12 chars, format CC-XXX-YY-NNNNN without dashes)."
        constraints: "exactly 12 alphanumeric chars; unique across Work when not null; required when rights_type IN {RECORDING, PERFORMANCE}"
      - name: iswc
        type: string
        source: input
        description: "International Standard Musical Work Code (T-XXXXXXXXX-C)."
        constraints: "exactly 11 chars matching ^T\\d{9}\\d$; unique across Work when not null; required when rights_type IN {COMPOSITION, LYRICS}"
      - name: rights_type
        type: enum
        source: input
        description: "Type of rights this work registration represents."
        constraints: "one of {COMPOSITION, LYRICS, RECORDING, PERFORMANCE}"
      - name: co_creators
        type: array
        source: input
        description: "List of co-creator declarations. Each item: {full_name, role, contribution_percent} where role in {COMPOSER,LYRICIST,PRODUCER,PERFORMER}."
        constraints: "sum(contribution_percent) MUST equal 100 at registration submit; 1..16 entries"
      - name: original_proof_url
        type: string
        source: input
        description: "URL of original-work proof artifact (e.g., notarized manuscript scan)."
        constraints: "http/https URL; required at submit"
      - name: registration_status
        type: enum
        source: computed
        description: "Lifecycle status of the registration."
        default: "DRAFT"
        constraints: "one of {DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, WITHDRAWN}"
      - name: dispute_posture
        type: enum
        source: computed
        description: "Derived aggregate dispute posture used to gate fund distribution. Recomputed on every Dispute open/resolve."
        default: "CLEAR"
        constraints: "one of {CLEAR, FROZEN}; FROZEN iff exists Dispute on this work with status IN {OPEN, UNDER_INVESTIGATION, MEDIATION, ARBITRATION}"
      - name: reject_reason
        type: string
        source: input
        description: "Reviewer-supplied rejection reason."
        default: null
        constraints: "1..500 chars when registration_status == REJECTED"
      - name: reviewer_id
        type: string
        source: system
        description: "RegistrationReviewer X-User-ID that approved/rejected."
        default: null

  - name: RightsHolder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Legal name of the rights-holder (person or organization)."
        constraints: "1..200 chars; required"
      - name: holder_kind
        type: enum
        source: input
        description: "Whether the holder is a natural person or an organization."
        constraints: "one of {INDIVIDUAL, ORGANIZATION}"
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date YYYY-MM-DD. Required when holder_kind == INDIVIDUAL."
        default: null
      - name: is_minor
        type: boolean
        source: computed
        description: "True iff holder_kind == INDIVIDUAL and (current_date - date_of_birth) < 18 years on the date the record was created. Frozen at creation."
        default: false
      - name: guardian_holder_id
        type: string
        source: input
        description: "id of the legal guardian RightsHolder. Required at create when is_minor == true; the guardian holder MUST have holder_kind == ORGANIZATION OR (holder_kind == INDIVIDUAL AND is_minor == false)."
        default: null
      - name: tax_jurisdiction
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country code used for tax withholding."
        constraints: "exactly 2 uppercase letters"
      - name: payout_currency
        type: enum
        source: input
        description: "Currency in which the holder is paid."
        constraints: "one of {USD, EUR, GBP, JPY, CNY}"
      - name: bank_account_token
        type: string
        source: input
        description: "Tokenized bank routing handle from the payment system."
        constraints: "1..64 chars; required for payout"

  - name: AgencyBinding
    parent: RightsHolder
    common_fields: true
    fields:
      - name: rights_holder_id
        type: string
        source: input
        description: "Foreign key to RightsHolder."
        constraints: "must exist"
      - name: agency_kind
        type: enum
        source: input
        description: "Type of agency representing the holder."
        constraints: "one of {PUBLISHER, LABEL, CMO}"
      - name: agency_name
        type: string
        source: input
        description: "Legal name of the agency."
        constraints: "1..200 chars"
      - name: territory
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country code where this binding is in force, or 'WW' for worldwide."
        constraints: "2 uppercase letters or 'WW'"
      - name: commission_percent
        type: number
        source: input
        description: "Agency commission as integer-precision percentage applied to the holder's gross share before payout."
        constraints: "0.00 <= x <= 50.00; 2 decimal places"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive UTC start of this binding."
      - name: effective_until
        type: datetime
        source: input
        description: "Exclusive UTC end of this binding; null means open-ended."
        default: null
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while now() in [effective_from, effective_until); TERMINATED after explicit termination."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, TERMINATED}"

  - name: RightsShare
    parent: Work
    common_fields: true
    fields:
      - name: work_id
        type: string
        source: input
        description: "Foreign key to Work."
      - name: rights_holder_id
        type: string
        source: input
        description: "Foreign key to RightsHolder."
      - name: share_percent
        type: number
        source: input
        description: "Percentage of this work's royalty pool allocated to this rights-holder. Two decimal places."
        constraints: "0.01 <= x <= 100.00; sum over all non-terminated shares for a work MUST equal 100.00 ± 0.00"
      - name: share_status
        type: enum
        source: computed
        description: "Lifecycle of this share."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, DISPUTED, TERMINATED}"
      - name: agency_binding_id
        type: string
        source: input
        description: "Optional reference to an active AgencyBinding that represents this holder for this work. When set, the binding's commission is deducted from this share's payouts."
        default: null

  - name: ShareChangeAudit
    parent: RightsShare
    common_fields: false
    fields:
      - name: rights_share_id
        type: string
        source: input
        description: "Foreign key to RightsShare being mutated."
      - name: changed_by_role
        type: string
        source: system
        description: "X-User-Role of the actor performing the change."
      - name: changed_by_id
        type: string
        source: system
        description: "X-User-ID of the actor."
      - name: change_kind
        type: enum
        source: system
        description: "Kind of mutation captured."
        constraints: "one of {CREATED, PERCENT_UPDATED, STATUS_TRANSITION, AGENCY_REBOUND, TERMINATED}"
      - name: before_snapshot
        type: object
        source: system
        description: "Pre-change snapshot of {share_percent, share_status, agency_binding_id}. Null for CREATED."
        default: null
      - name: after_snapshot
        type: object
        source: system
        description: "Post-change snapshot of the same fields."

  - name: PlaybackBatch
    parent: null
    common_fields: true
    fields:
      - name: channel
        type: enum
        source: input
        description: "Channel through which playback data was reported."
        constraints: "one of {STREAMING, RADIO, TV, PUBLIC_VENUE, LIVE}"
      - name: source_signature
        type: string
        source: input
        description: "HMAC-SHA256 hex digest provided by the reporting source. Server validates against the source's pre-registered secret."
        constraints: "exactly 64 hex chars"
      - name: source_identifier
        type: string
        source: input
        description: "Stable identifier of the reporting source (e.g., 'spotify-us', 'bbc-r2')."
        constraints: "1..64 chars"
      - name: reporting_period_start
        type: datetime
        source: input
        description: "Inclusive UTC start of the reporting window."
      - name: reporting_period_end
        type: datetime
        source: input
        description: "Exclusive UTC end of the reporting window."
      - name: validity_status
        type: enum
        source: computed
        description: "Validity classification after server-side checks."
        default: "PENDING"
        constraints: "one of {PENDING, VALID, INVALID_SIGNATURE, INVALID_RANGE, DEDUPED_REJECTED}"
      - name: total_events_submitted
        type: integer
        source: input
        description: "Count of playback events in this batch as claimed by the reporter."
        constraints: ">= 0"
      - name: total_events_accepted
        type: integer
        source: computed
        description: "Count of events that survived dedup and validity filters."
        default: 0

  - name: PlaybackEvent
    parent: PlaybackBatch
    common_fields: false
    fields:
      - name: playback_batch_id
        type: string
        source: input
        description: "Foreign key to PlaybackBatch."
      - name: work_id
        type: string
        source: input
        description: "Foreign key to the Work that was played. Null only when supplementation is needed."
        default: null
      - name: isrc
        type: string
        source: input
        description: "ISRC reported by source; used for resolving work_id when work_id is null. May be null only when iswc is supplied."
        default: null
      - name: iswc
        type: string
        source: input
        description: "ISWC reported by source; alternative resolver."
        default: null
      - name: played_at
        type: datetime
        source: input
        description: "UTC timestamp the playback occurred."
      - name: play_duration_seconds
        type: integer
        source: input
        description: "Seconds of the work that were played in this event."
        constraints: "0 < x <= Work.duration_seconds"
      - name: region
        type: string
        source: input
        description: "ISO 3166-1 alpha-2 country code where playback occurred."
        constraints: "2 uppercase letters"
      - name: dedup_key
        type: string
        source: system
        description: "SHA-256 hex of (source_identifier|work_id|played_at_ms). Unique across PlaybackEvent for the same batch's source over a 24h window."
      - name: status
        type: enum
        source: computed
        description: "Lifecycle of the event after ingestion."
        default: "ACCEPTED"
        constraints: "one of {ACCEPTED, DUPLICATE_DROPPED, SUPPLEMENTED, REJECTED}"

  - name: RoyaltyPool
    parent: null
    common_fields: true
    fields:
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive UTC start of the distribution period."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive UTC end of the distribution period."
      - name: revenue_source
        type: enum
        source: input
        description: "Revenue source classification."
        constraints: "one of {STREAMING, RADIO, TV, PUBLIC_VENUE, LIVE, SYNC, MECHANICAL_LICENSE}"
      - name: region
        type: string
        source: input
        description: "Region this pool aggregates revenue for ('WW' for worldwide aggregation)."
        constraints: "2 uppercase letters or 'WW'"
      - name: gross_revenue_cents
        type: integer
        source: input
        description: "Gross revenue collected in this period, in the smallest unit of pool_currency (e.g., USD cents)."
        constraints: ">= 0"
      - name: platform_share_percent
        type: number
        source: input
        description: "Platform share retention applied to gross before distribution."
        constraints: "0.00 <= x <= 40.00; 2 decimal places"
      - name: pool_currency
        type: enum
        source: input
        description: "Currency the pool is denominated in."
        constraints: "one of {USD, EUR, GBP, JPY, CNY}"
      - name: net_distributable_cents
        type: integer
        source: computed
        description: "Net amount available to distribute after platform share. See calculations.net_distributable."
        default: 0
      - name: mechanical_split_percent
        type: number
        source: input
        description: "Percentage of net_distributable allocated to the mechanical sub-pool (composition+lyrics rights). The remainder goes to the performance sub-pool (recording+performance rights)."
        constraints: "0.00 <= x <= 100.00"
      - name: status
        type: enum
        source: computed
        description: "Pool lifecycle."
        default: "OPEN"
        constraints: "one of {OPEN, CLOSED, DISTRIBUTED}"
      - name: distribution_rule_version_id
        type: string
        source: input
        description: "Foreign key to DistributionRuleVersion pinned at pool close."
        default: null
      - name: closed_at
        type: datetime
        source: system
        description: "Timestamp pool was closed."
        default: null

  - name: DistributionRuleVersion
    parent: null
    common_fields: false
    fields:
      - name: version_tag
        type: string
        source: input
        description: "Human-readable rule version tag (e.g., 'v2026.05')."
        constraints: "unique; 1..32 chars"
      - name: channel
        type: enum
        source: input
        description: "Channel these rules apply to (matches RoyaltyPool.revenue_source)."
        constraints: "one of {STREAMING, RADIO, TV, PUBLIC_VENUE, LIVE, SYNC, MECHANICAL_LICENSE}"
      - name: distribution_mode
        type: enum
        source: input
        description: "How distribution is computed."
        constraints: "one of {PER_PLAY, PER_DURATION, HYBRID}"
      - name: per_play_weight
        type: number
        source: input
        description: "Used when distribution_mode IN {PER_PLAY, HYBRID}. Weight assigned to each play count."
        constraints: "0.00 <= x <= 1.00; required iff distribution_mode IN {PER_PLAY, HYBRID}"
      - name: per_duration_weight
        type: number
        source: input
        description: "Used when distribution_mode IN {PER_DURATION, HYBRID}. Weight assigned per second played."
        constraints: "0.00 <= x <= 1.00; required iff distribution_mode IN {PER_DURATION, HYBRID}; per_play_weight + per_duration_weight MUST equal 1.00 when HYBRID"
      - name: playback_type_weights
        type: object
        source: input
        description: "Map of playback_type → multiplier applied to weighted score. Keys: FULL_PLAY, SKIP, BACKGROUND, FOREGROUND. Values 0.00..2.00."
      - name: minimum_payout_cents
        type: integer
        source: input
        description: "Minimum cents per RightsHolder per disbursement; sub-threshold amounts accumulate in MicroBalance instead of being paid."
        constraints: ">= 0"
      - name: micro_accumulation_cap_cents
        type: integer
        source: input
        description: "Cap on accumulated MicroBalance before forced disbursement irrespective of minimum_payout."
        constraints: ">= minimum_payout_cents"
      - name: effective_from
        type: datetime
        source: input
        description: "Inclusive UTC moment this version becomes effective for closing pools."

  - name: Distribution
    parent: RoyaltyPool
    common_fields: true
    fields:
      - name: royalty_pool_id
        type: string
        source: input
        description: "Foreign key to RoyaltyPool."
      - name: work_id
        type: string
        source: input
        description: "Foreign key to Work."
      - name: rights_holder_id
        type: string
        source: input
        description: "Foreign key to RightsHolder."
      - name: rights_share_id
        type: string
        source: input
        description: "Foreign key to the RightsShare snapshot used."
      - name: sub_pool
        type: enum
        source: computed
        description: "Which sub-pool this distribution drew from. MECHANICAL when Work.rights_type IN {COMPOSITION, LYRICS}; PERFORMANCE when IN {RECORDING, PERFORMANCE}."
        constraints: "one of {MECHANICAL, PERFORMANCE}"
      - name: gross_amount_cents
        type: integer
        source: computed
        description: "Gross cents allocated to this holder for this work in this pool (before commission and tax)."
      - name: commission_cents
        type: integer
        source: computed
        description: "Agency commission deducted from gross_amount_cents."
        default: 0
      - name: net_after_commission_cents
        type: integer
        source: computed
        description: "gross_amount_cents - commission_cents."
      - name: status
        type: enum
        source: computed
        description: "Distribution lifecycle."
        default: "PENDING"
        constraints: "one of {PENDING, FROZEN, RELEASED, PAID, FORFEITED}"

  - name: MicroBalance
    parent: RightsHolder
    common_fields: true
    fields:
      - name: rights_holder_id
        type: string
        source: input
        description: "Foreign key to RightsHolder."
      - name: currency
        type: enum
        source: input
        description: "Currency of accumulated micro-revenue."
        constraints: "one of {USD, EUR, GBP, JPY, CNY}"
      - name: balance_cents
        type: integer
        source: computed
        description: "Accumulated sub-threshold cents."
        constraints: ">= 0"

  - name: Dispute
    parent: Work
    common_fields: true
    fields:
      - name: work_id
        type: string
        source: input
        description: "Foreign key to Work being disputed."
      - name: claimant_rights_holder_id
        type: string
        source: input
        description: "Foreign key to the RightsHolder filing the dispute."
      - name: dispute_kind
        type: enum
        source: input
        description: "Nature of the dispute."
        constraints: "one of {SHARE_RATIO, OWNERSHIP, ORIGINALITY, AGENCY_AUTHORITY}"
      - name: claim_summary
        type: string
        source: input
        description: "Free-text claim summary."
        constraints: "1..2000 chars"
      - name: status
        type: enum
        source: computed
        description: "Dispute workflow status."
        default: "OPEN"
        constraints: "one of {OPEN, UNDER_INVESTIGATION, MEDIATION, ARBITRATION, RESOLVED_UPHELD, RESOLVED_DISMISSED, WITHDRAWN}"
      - name: evidence_items
        type: array
        source: input
        description: "List of evidence URLs submitted by parties. Each item: {submitter_role, submitter_id, url, submitted_at}. Append-only."
        default: []
      - name: arbitration_decision
        type: string
        source: input
        description: "Free-text arbitration ruling text. Required when status IN {RESOLVED_UPHELD, RESOLVED_DISMISSED}."
        default: null
      - name: arbitrator_id
        type: string
        source: system
        description: "X-User-ID of the DisputeOfficer who issued the resolution."
        default: null

  - name: PayoutBatch
    parent: null
    common_fields: true
    fields:
      - name: cycle_tag
        type: string
        source: input
        description: "Cycle tag (e.g., '2026-Q2-W2'). Unique."
        constraints: "1..32 chars; unique"
      - name: scheduled_run_at
        type: datetime
        source: input
        description: "UTC moment the batch becomes eligible for execution."
      - name: status
        type: enum
        source: computed
        description: "Batch lifecycle."
        default: "PENDING"
        constraints: "one of {PENDING, RUNNING, COMPLETED, FAILED}"
      - name: total_payments
        type: integer
        source: computed
        description: "Total Payment rows created in this batch."
        default: 0
      - name: total_paid_cents_by_currency
        type: object
        source: computed
        description: "Map currency→cents successfully paid in this batch."
        default: {}

  - name: Payment
    parent: PayoutBatch
    common_fields: true
    fields:
      - name: payout_batch_id
        type: string
        source: input
        description: "Foreign key to PayoutBatch."
      - name: rights_holder_id
        type: string
        source: input
        description: "Foreign key to RightsHolder being paid."
      - name: currency
        type: enum
        source: input
        description: "Payment currency."
        constraints: "one of {USD, EUR, GBP, JPY, CNY}"
      - name: gross_cents
        type: integer
        source: computed
        description: "Sum of net_after_commission_cents across released Distributions plus drained MicroBalance for this holder/currency."
        constraints: ">= minimum_payout_cents at time of batch generation OR drained_micro_balance == true"
      - name: tax_withheld_cents
        type: integer
        source: computed
        description: "Tax withheld per RightsHolder.tax_jurisdiction."
      - name: net_payable_cents
        type: integer
        source: computed
        description: "gross_cents - tax_withheld_cents."
      - name: routing_channel
        type: enum
        source: computed
        description: "Selected payment channel."
        constraints: "one of {SWIFT, SEPA, ACH, LOCAL_JP, LOCAL_CN}"
      - name: status
        type: enum
        source: computed
        description: "Payment lifecycle."
        default: "QUEUED"
        constraints: "one of {QUEUED, SENT, SUCCEEDED, FAILED, RETRYING, ABANDONED}"
      - name: retry_count
        type: integer
        source: computed
        description: "Number of retry attempts so far."
        default: 0
      - name: last_failure_reason
        type: string
        source: system
        description: "Last failure reason from upstream PSP."
        default: null

  - name: ExternalSyncEvent
    parent: null
    common_fields: false
    fields:
      - name: target_system
        type: enum
        source: input
        description: "External system this event targets."
        constraints: "one of {PAYMENT_PSP, BANK, CMO_GATEWAY}"
      - name: event_kind
        type: enum
        source: input
        description: "Kind of event."
        constraints: "one of {PAYMENT_INITIATED, PAYMENT_SUCCEEDED, PAYMENT_FAILED, BANK_RECONCILIATION, CMO_SHARE_PUSH, CMO_REVENUE_PULL}"
      - name: related_entity_kind
        type: enum
        source: input
        description: "Kind of entity referenced."
        constraints: "one of {Payment, PayoutBatch, RightsShare, RoyaltyPool}"
      - name: related_entity_id
        type: string
        source: input
        description: "id of the related entity."
      - name: payload
        type: object
        source: input
        description: "Free-form payload mirrored to or received from the external system."

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:

  - entity: Work
    initial_state: DRAFT
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /royalty/works/{id}/submit"
        actor: RightsHolder
        preconditions:
          - "all required metadata present (title, duration_seconds, rights_type)"
          - "isrc required when rights_type IN {RECORDING, PERFORMANCE}; iswc required when rights_type IN {COMPOSITION, LYRICS}"
          - "sum(co_creators[].contribution_percent) == 100"
          - "original_proof_url present"
        side_effects:
          - "registration_status := SUBMITTED"
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /royalty/works/{id}/take-review"
        actor: RegistrationReviewer
        preconditions: []
        side_effects:
          - "reviewer_id := X-User-ID"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /royalty/works/{id}/approve"
        actor: RegistrationReviewer
        preconditions:
          - "at least one RightsShare exists for this work whose share_status IN {ACTIVE} and whose sum(share_percent) == 100.00"
        side_effects:
          - "Work.registration_status := APPROVED"
          - "Work.dispute_posture := CLEAR (initial)"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /royalty/works/{id}/reject"
        actor: RegistrationReviewer
        preconditions:
          - "reject_reason supplied (1..500 chars)"
        side_effects:
          - "registration_status := REJECTED"
          - "cascade: all RightsShare rows for this work transition ACTIVE → TERMINATED (depth 2)"
          - "cascade: each TERMINATED RightsShare emits a ShareChangeAudit row with change_kind = TERMINATED (depth 3)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /royalty/works/{id}/withdraw"
        actor: RightsHolder
        preconditions: []
        side_effects:
          - "registration_status := WITHDRAWN"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /royalty/works/{id}/return-to-draft"
        actor: RegistrationReviewer
        preconditions: []
        side_effects:
          - "registration_status := DRAFT"
        note: "Revision loop: SUBMITTED → DRAFT allows the rights-holder to amend metadata before re-submitting."
      - from: APPROVED
        to: APPROVED
        trigger: "system event: Dispute open/resolve on this Work"
        actor: system
        preconditions: []
        side_effects:
          - "dispute_posture recomputed: FROZEN if any Dispute on this work has status IN {OPEN, UNDER_INVESTIGATION, MEDIATION, ARBITRATION} else CLEAR"
          - "cascade: when posture flips CLEAR→FROZEN, every PENDING Distribution.royalty_pool_id with this work_id flips PENDING→FROZEN (depth 2); when posture flips FROZEN→CLEAR, every FROZEN such Distribution flips FROZEN→RELEASED (depth 2)"

  - entity: PlaybackBatch
    initial_state: PENDING
    terminal_states: [VALID, INVALID_SIGNATURE, INVALID_RANGE, DEDUPED_REJECTED]
    transitions:
      - from: PENDING
        to: INVALID_SIGNATURE
        trigger: "POST /royalty/playback-batches (ingest)"
        actor: PlaybackSource
        preconditions:
          - "HMAC-SHA256(payload, source_secret) != source_signature"
        side_effects:
          - "validity_status := INVALID_SIGNATURE"
          - "total_events_accepted := 0"
      - from: PENDING
        to: INVALID_RANGE
        trigger: "POST /royalty/playback-batches (ingest)"
        actor: PlaybackSource
        preconditions:
          - "signature valid AND (reporting_period_end <= reporting_period_start OR reporting_period_end - reporting_period_start > 31 days OR reporting_period_end > now())"
        side_effects:
          - "validity_status := INVALID_RANGE"
      - from: PENDING
        to: DEDUPED_REJECTED
        trigger: "POST /royalty/playback-batches (ingest)"
        actor: PlaybackSource
        preconditions:
          - "signature and range valid"
          - "a prior batch from same source_identifier covering [reporting_period_start, reporting_period_end) with validity_status == VALID exists"
        side_effects:
          - "validity_status := DEDUPED_REJECTED"
      - from: PENDING
        to: VALID
        trigger: "POST /royalty/playback-batches (ingest)"
        actor: PlaybackSource
        preconditions:
          - "all of signature, range, and uniqueness checks pass"
        side_effects:
          - "validity_status := VALID"
          - "for each event in payload: compute dedup_key; if dedup_key already exists from same source within 24h, mark event status = DUPLICATE_DROPPED; else mark ACCEPTED"
          - "if event has work_id == null but isrc or iswc resolves an APPROVED Work uniquely, set event.work_id and status := SUPPLEMENTED"
          - "if work_id cannot be resolved, status := REJECTED"
          - "total_events_accepted := count(events with status IN {ACCEPTED, SUPPLEMENTED})"

  - entity: RoyaltyPool
    initial_state: OPEN
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /royalty/pools/{id}/close"
        actor: FinanceOps
        preconditions:
          - "now() >= period_end"
          - "distribution_rule_version_id is set and references a DistributionRuleVersion whose channel == this pool's revenue_source"
          - "DistributionRuleVersion.effective_from <= period_end"
        side_effects:
          - "status := CLOSED"
          - "closed_at := now()"
          - "compute net_distributable_cents via calculations.net_distributable"
          - "cascade: for every approved Work eligible for this pool, create one Distribution per active RightsShare (depth 2) with status PENDING and gross_amount_cents computed via calculations.distribution_share (depth 3)"
      - from: CLOSED
        to: DISTRIBUTED
        trigger: "POST /royalty/pools/{id}/finalize"
        actor: FinanceOps
        preconditions:
          - "no Distribution under this pool has status == FROZEN"
        side_effects:
          - "status := DISTRIBUTED"
          - "all Distributions in this pool with status == PENDING flip to RELEASED"

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED_UPHELD, RESOLVED_DISMISSED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: UNDER_INVESTIGATION
        trigger: "POST /royalty/disputes/{id}/start-investigation"
        actor: DisputeOfficer
        preconditions: []
        side_effects:
          - "status := UNDER_INVESTIGATION"
      - from: UNDER_INVESTIGATION
        to: MEDIATION
        trigger: "POST /royalty/disputes/{id}/advance-to-mediation"
        actor: DisputeOfficer
        preconditions:
          - "evidence_items length >= 2 (at least two parties have submitted evidence)"
        side_effects:
          - "status := MEDIATION"
      - from: MEDIATION
        to: UNDER_INVESTIGATION
        trigger: "POST /royalty/disputes/{id}/reopen-investigation"
        actor: DisputeOfficer
        preconditions: []
        side_effects:
          - "status := UNDER_INVESTIGATION"
        note: "Cyclic loop: mediation may require returning to investigation to gather more evidence."
      - from: MEDIATION
        to: ARBITRATION
        trigger: "POST /royalty/disputes/{id}/advance-to-arbitration"
        actor: DisputeOfficer
        preconditions: []
        side_effects:
          - "status := ARBITRATION"
      - from: ARBITRATION
        to: RESOLVED_UPHELD
        trigger: "POST /royalty/disputes/{id}/resolve"
        actor: DisputeOfficer
        preconditions:
          - "arbitration_decision present"
          - "body.outcome == UPHELD"
        side_effects:
          - "status := RESOLVED_UPHELD"
          - "arbitrator_id := X-User-ID"
          - "cascade: Work.dispute_posture recomputed (depth 1) → if no other open Dispute, posture := CLEAR (depth 2) → every FROZEN Distribution for this work flips FROZEN→RELEASED (depth 3)"
          - "if dispute_kind == SHARE_RATIO and body contains new_share_percentages, every affected RightsShare is updated and ShareChangeAudit rows are written"
      - from: ARBITRATION
        to: RESOLVED_DISMISSED
        trigger: "POST /royalty/disputes/{id}/resolve"
        actor: DisputeOfficer
        preconditions:
          - "arbitration_decision present"
          - "body.outcome == DISMISSED"
        side_effects:
          - "status := RESOLVED_DISMISSED"
          - "arbitrator_id := X-User-ID"
          - "cascade: Work.dispute_posture recomputed → if no other open Dispute, posture := CLEAR → every FROZEN Distribution for this work flips FROZEN→RELEASED"
      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /royalty/disputes/{id}/withdraw"
        actor: RightsHolder
        preconditions:
          - "X-User-ID == claimant_rights_holder_id"
        side_effects:
          - "status := WITHDRAWN"
          - "cascade: Work.dispute_posture recomputed → if no other open Dispute, posture := CLEAR → every FROZEN Distribution for this work flips FROZEN→RELEASED"

  - entity: Distribution
    initial_state: PENDING
    terminal_states: [PAID, FORFEITED]
    transitions:
      - from: PENDING
        to: FROZEN
        trigger: "system event: Work.dispute_posture flips CLEAR→FROZEN"
        actor: system
        preconditions:
          - "Distribution.work_id == disputed Work.id"
        side_effects:
          - "status := FROZEN"
      - from: FROZEN
        to: RELEASED
        trigger: "system event: Work.dispute_posture flips FROZEN→CLEAR"
        actor: system
        preconditions: []
        side_effects:
          - "status := RELEASED"
      - from: PENDING
        to: RELEASED
        trigger: "system event: RoyaltyPool.status flips CLOSED→DISTRIBUTED"
        actor: system
        preconditions:
          - "Distribution.status == PENDING (not FROZEN)"
        side_effects:
          - "status := RELEASED"
      - from: RELEASED
        to: PAID
        trigger: "system event: Payment.status flips QUEUED→SUCCEEDED"
        actor: system
        preconditions: []
        side_effects:
          - "status := PAID"
      - from: RELEASED
        to: FORFEITED
        trigger: "POST /royalty/distributions/{id}/forfeit"
        actor: PlatformAdmin
        preconditions:
          - "the holding RightsHolder has been TERMINATED-equivalent (bank_account_token revoked AND no successor)"
        side_effects:
          - "status := FORFEITED"
          - "gross_amount_cents reverts to the parent RoyaltyPool.net_distributable_cents pool (reabsorption)"

  - entity: Payment
    initial_state: QUEUED
    terminal_states: [SUCCEEDED, ABANDONED]
    transitions:
      - from: QUEUED
        to: SENT
        trigger: "POST /royalty/payout-batches/{id}/execute"
        actor: FinanceOps
        preconditions:
          - "PayoutBatch.status IN {PENDING}"
          - "now() >= PayoutBatch.scheduled_run_at"
        side_effects:
          - "PayoutBatch.status := RUNNING"
          - "ExternalSyncEvent row created with event_kind == PAYMENT_INITIATED"
      - from: SENT
        to: SUCCEEDED
        trigger: "POST /royalty/_events/psp-callback (outcome=SUCCESS)"
        actor: system
        preconditions: []
        side_effects:
          - "status := SUCCEEDED"
          - "associated Distribution rows: RELEASED → PAID (cascade depth 2)"
          - "MicroBalance for {rights_holder_id, currency} reset to 0 by the drained_micro_balance_cents recorded at batch generation"
      - from: SENT
        to: FAILED
        trigger: "POST /royalty/_events/psp-callback (outcome=FAILURE)"
        actor: system
        preconditions: []
        side_effects:
          - "status := FAILED"
          - "last_failure_reason := body.reason"
      - from: FAILED
        to: RETRYING
        trigger: "POST /royalty/payments/{id}/retry"
        actor: FinanceOps
        preconditions:
          - "retry_count < 3"
        side_effects:
          - "retry_count := retry_count + 1"
          - "status := RETRYING"
      - from: RETRYING
        to: SENT
        trigger: "system: retry executor picks up RETRYING payment"
        actor: system
        preconditions: []
        side_effects:
          - "status := SENT"
      - from: FAILED
        to: ABANDONED
        trigger: "POST /royalty/payments/{id}/abandon"
        actor: FinanceOps
        preconditions:
          - "retry_count >= 3"
        side_effects:
          - "status := ABANDONED"
          - "associated Distribution rows revert RELEASED → FORFEITED OR re-enter MicroBalance, per body.policy"

# ============================================================================
# §1.2.1 Concurrency Rules
# ============================================================================
concurrency_rules:
  - scenario: "Two reviewers approve the same Work simultaneously"
    guarantee: "Exactly one approval succeeds; the second sees the work no longer in UNDER_REVIEW."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Work.registration_status transition out of UNDER_REVIEW."

  - scenario: "Two RightsHolders submit competing RightsShare modifications on the same Work"
    guarantee: "Optimistic version conflict; second writer rejected."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "OCC on RightsShare.version."

  - scenario: "PlaybackBatch ingest collides with an identical-window batch from the same source"
    guarantee: "At most one VALID batch per (source_identifier, [period_start, period_end)); second ingest marked DEDUPED_REJECTED."
    error_id: ERR_DUPLICATE_BATCH
    http_status: 409
    serialization: "Uniqueness on (source_identifier, period_start, period_end) limited to validity_status == VALID."

  - scenario: "FinanceOps closes a RoyaltyPool while another close is in flight"
    guarantee: "Exactly one close succeeds; the second sees pool already CLOSED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on RoyaltyPool.status transition out of OPEN."

  - scenario: "Two FinanceOps execute the same PayoutBatch simultaneously"
    guarantee: "Exactly one execute succeeds; loser sees batch already RUNNING."
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on PayoutBatch.status transition PENDING→RUNNING."

  - scenario: "Dispute resolution races with a fresh dispute opening on the same Work"
    guarantee: "Work.dispute_posture is recomputed atomically; if any open dispute exists after both ops settle, posture stays FROZEN."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    serialization: "OCC on Work.version when transitioning dispute_posture."

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:

  - name: net_distributable
    trigger: "RoyaltyPool transition OPEN→CLOSED"
    algorithm: tiered_pricing
    formula: |
      # Apply platform share, then split into mechanical and performance sub-pools.
      # Rounding order is PINNED: first round platform_take, then mechanical_take, then performance_take.
      platform_take = round_half_up(gross_revenue_cents * (platform_share_percent / 100), 0)   # round to whole cent
      net_distributable_cents = gross_revenue_cents - platform_take                            # integer
      mechanical_take = round_half_up(net_distributable_cents * (mechanical_split_percent / 100), 0)
      performance_take = net_distributable_cents - mechanical_take
      # ORDER: platform_take rounded BEFORE subtracting; mechanical_take rounded BEFORE subtracting performance.
      # This pinned order produces a deterministic remainder lodged with performance_take, not mechanical.
    input_set: "RoyaltyPool fields gross_revenue_cents, platform_share_percent, mechanical_split_percent at the moment of close."
    constants: {}
    precision: "0 decimal places (whole cents), round_half_up"
    variants: []

  - name: distribution_share
    trigger: "RoyaltyPool transition OPEN→CLOSED, per (Work, RightsShare) pair"
    algorithm: weighted_scoring
    formula: |
      # For each approved Work eligible for this pool (Work.registration_status == APPROVED
      # AND Work.dispute_posture == CLEAR at close-time is NOT a precondition — frozen works
      # still receive a PENDING distribution that is immediately flipped to FROZEN by the cascade).
      # Eligibility filter: PlaybackEvent.status IN {ACCEPTED, SUPPLEMENTED}
      # AND PlaybackEvent.region matches RoyaltyPool.region (region == 'WW' matches any)
      # AND PlaybackEvent.played_at in [pool.period_start, pool.period_end)
      # AND PlaybackEvent.work_id == Work.id
      # AND PlaybackEvent's source channel == pool.revenue_source

      # Step 1: Compute weighted play units for each Work.
      # DistributionRuleVersion.distribution_mode determines the formula:
      #   PER_PLAY:    units(work) = count(events) * (avg playback_type_weight across events)
      #   PER_DURATION:units(work) = sum(play_duration_seconds * playback_type_weight) across events
      #   HYBRID:      units(work) = per_play_weight * count(events_weighted) + per_duration_weight * sum(duration_weighted)
      # where event_weight = playback_type_weights[classify(event)]  (FULL_PLAY if play_duration>=0.95*Work.duration; SKIP if <0.30; FOREGROUND otherwise; BACKGROUND for background-tagged events).

      # Step 2: Allocate sub-pool by sum of units.
      # sub_pool_amount = mechanical_take if Work.rights_type IN {COMPOSITION, LYRICS} else performance_take
      # work_pool_cents = round_half_up(sub_pool_amount * (units(work) / sum_units_in_sub_pool), 0)
      # ROUND ORDER: round per-work cents FIRST, then sum-residual lodged with the highest-units work in the sub-pool (tie-break: lowest Work.id lexicographically).

      # Step 3: Allocate per RightsShare.
      # gross_amount_cents(share) = round_half_up(work_pool_cents * (share.share_percent / 100), 0)
      # ROUND ORDER: round per-share FIRST, then sum-residual lodged with the share whose share_percent is highest (tie-break: lowest RightsShare.id).

      # Step 4: Apply commission.
      # commission_cents = round_half_up(gross_amount_cents * (binding.commission_percent / 100), 0) if share.agency_binding_id is set AND binding.status == ACTIVE AND now in [binding.effective_from, binding.effective_until)
      # net_after_commission_cents = gross_amount_cents - commission_cents
    input_set: "All ACCEPTED or SUPPLEMENTED PlaybackEvent rows whose batch.validity_status == VALID, region matches, and timestamp falls in the pool's [period_start, period_end). All ACTIVE RightsShare rows on the Work at the moment of pool close."
    constants:
      FULL_PLAY_THRESHOLD_RATIO: 0.95
      SKIP_THRESHOLD_RATIO: 0.30
    precision: "0 decimal places (whole cents), round_half_up; rounding order pinned (per-work BEFORE residual; per-share BEFORE residual)"
    variants:
      - name: per_play_mode
        when: "DistributionRuleVersion.distribution_mode == PER_PLAY"
        difference: "Weighted units count plays only; duration is ignored. A 5-second skip and a 5-minute full play contribute equally before playback_type_weights are applied."
      - name: per_duration_mode
        when: "DistributionRuleVersion.distribution_mode == PER_DURATION"
        difference: "Weighted units count seconds played; play count is ignored. A single 5-minute play outweighs 50 five-second skips even before type weights."
      - name: hybrid_mode
        when: "DistributionRuleVersion.distribution_mode == HYBRID"
        difference: "Weighted blend of the two modes per per_play_weight and per_duration_weight, which MUST sum to 1.00. Sub-pool allocation rounding still happens per-work first."

  - name: payment_aggregation
    trigger: "POST /royalty/payout-batches (generate)"
    algorithm: aggregation
    formula: |
      # For each RightsHolder × currency:
      # 1. candidate_distributions = Distribution rows with status == RELEASED, sub_pool covered by this cycle,
      #    rights_holder_id == holder.id, currency = holder.payout_currency
      #    (currency conversion: pool.pool_currency must equal holder.payout_currency; mismatches are excluded and routed to a CurrencyMismatch queue).
      # 2. base_amount_cents = sum(net_after_commission_cents over candidate_distributions)
      # 3. drained_micro = MicroBalance.balance_cents for (rights_holder_id, currency)
      # 4. gross_cents_candidate = base_amount_cents + drained_micro
      # 5. If gross_cents_candidate < minimum_payout_cents:
      #      - If drained_micro + base_amount_cents > micro_accumulation_cap_cents: force payout (drain micro to 0, base amount paid).
      #      - Else: do NOT create a Payment; instead, MicroBalance.balance_cents += base_amount_cents; mark candidate Distributions status := PAID (consumed into micro).
      #    Else (>= minimum_payout):
      #      - Create Payment with gross_cents = gross_cents_candidate; drain MicroBalance to 0; mark candidate Distributions status := PAID on PSP success.
      # ORDER OF EVALUATION: micro-accumulation cap check FIRST, minimum-payout threshold SECOND. Reversing the order would create rows that should have been paid.

      # Tax withholding:
      # tax_withheld_cents = round_half_up(gross_cents * tax_rate(holder.tax_jurisdiction), 0)
      # net_payable_cents = gross_cents - tax_withheld_cents
    input_set: "Distributions with status == RELEASED whose royalty_pool.status == DISTRIBUTED; MicroBalance for the same (holder, currency)."
    constants:
      TAX_RATE_BY_JURISDICTION:
        US: 0.30
        GB: 0.20
        DE: 0.26
        JP: 0.20
        CN: 0.10
        FR: 0.25
        IE: 0.20
        DEFAULT: 0.30
    precision: "0 decimal places (whole cents), round_half_up; threshold checks evaluated as: micro_accumulation FIRST, minimum_payout SECOND"
    variants: []

  - name: holder_dispute_exposure_score
    trigger: "GET /royalty/rights-holders/{id}/dispute-exposure"
    algorithm: weighted_scoring
    formula: |
      # Risk-scoring on a RightsHolder. Independent of cost accounting.
      # Inputs:
      #   open_disputes = count of Dispute rows where claimant_rights_holder_id == holder.id OR
      #                   any RightsShare on the disputed Work has rights_holder_id == holder.id,
      #                   AND status IN {OPEN, UNDER_INVESTIGATION, MEDIATION, ARBITRATION}
      #   frozen_distribution_cents = sum(gross_amount_cents) over Distribution rows where
      #                   rights_holder_id == holder.id AND status == FROZEN
      #   ratio = frozen_distribution_cents / max(1, total_lifetime_paid_cents)

      # Variant A (forward_looking):  score = 0.6 * open_disputes + 0.4 * ceil(ratio * 100)
      # Variant B (chronological):    score replays each dispute event in opened_at order, decaying earlier
      #                               disputes by 0.9 per dispute since opened, then sums.
      # Both variants are valid; the system pins forward_looking as the live score.
    input_set: "Dispute rows touching this holder; Distribution rows with this holder."
    constants:
      DECAY_FACTOR: 0.9
    precision: "0 decimal places (whole score), round_half_up"
    variants:
      - name: forward_looking
        when: "live score; default for GET /royalty/rights-holders/{id}/dispute-exposure"
        difference: "Aggregates open disputes plus frozen-exposure ratio without time decay."
      - name: chronological
        when: "audit replay; requested with ?mode=chronological"
        difference: "Replays disputes in opened_at order with decay; older disputes contribute less. Identical inputs produce a strictly different number except when there is exactly one dispute."

  - name: pool_tier_fee
    trigger: "RoyaltyPool transition OPEN→CLOSED (after net_distributable computed)"
    algorithm: tiered_pricing
    formula: |
      # Tiered admin fee deducted from net_distributable BEFORE sub-pool split.
      # Tiers based on gross_revenue_cents (the same value used for platform_take):
      #   < 100_000_00         : 5.00% flat
      #   100_000_00 .. 999_999_99 : 4.00% on the portion above 100_000_00 plus the prior tier's cap
      #   >= 1_000_000_00       : 3.00% on the portion above 1_000_000_00 plus prior tiers' caps
      # Marginal computation: walk tiers in order; cumulative fee = sum over tiers entered.
      # Tier boundaries are HALF-OPEN [low, high). A pool whose gross_revenue_cents == exactly 100_000_00 enters tier 2.
      # PINNED EVALUATION ORDER (combinatorial circular look):
      #   1) compute platform_take from gross_revenue_cents (calc net_distributable)
      #   2) compute admin_fee from gross_revenue_cents (NOT from net_distributable — the tier breakpoints reference gross to avoid a circular self-reference between fee and tier-detection)
      #   3) net_distributable_cents := gross_revenue_cents - platform_take - admin_fee
      # ROUND ORDER: round each per-tier slice FIRST, then sum; this yields a slightly different number than round-after-sum at boundary inputs.
    input_set: "gross_revenue_cents of the closing pool."
    constants:
      TIER1_CAP_CENTS: 10000000   # 100,000.00 in cents
      TIER2_CAP_CENTS: 99999999
      TIER1_RATE: 0.05
      TIER2_RATE: 0.04
      TIER3_RATE: 0.03
    precision: "0 decimal places (whole cents), round_half_up; round per-tier-slice BEFORE summing"
    variants: []

# ============================================================================
# §1.4 Validation Rules Table (Ordered by Priority)
# ============================================================================
validations:

  - priority: 1
    category: auth
    check: "Both X-User-Role and X-User-ID headers present."
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role matches one of the declared roles in §1.7."
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "Role permitted to invoke this endpoint per §1.5."
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "Each path resource referenced exists (Work, RightsHolder, etc.), validated left-to-right."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: existence
    check: "RightsShare.rights_holder_id, agency_binding_id, work_id all resolve to existing entities."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "POST/PATCH /royalty/works/{id}/shares*"

  - priority: 6
    category: state
    check: "Target Work in correct state for action: submit requires DRAFT; approve/reject requires UNDER_REVIEW; take-review requires SUBMITTED."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "/royalty/works/{id}/* action endpoints"

  - priority: 7
    category: state
    check: "Work.dispute_posture must be CLEAR to mark a RightsShare share_status TERMINATED via owner request; FROZEN posture blocks holder-initiated share termination."
    error_id: ERR_WORK_FROZEN
    http_status: 409
    applies_to: "PATCH /royalty/works/{id}/shares/{share_id}"

  - priority: 8
    category: state
    check: "Pool close requires pool.status == OPEN AND now() >= pool.period_end."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /royalty/pools/{id}/close"

  - priority: 9
    category: state
    check: "Pool finalize requires pool.status == CLOSED AND no Distribution under pool has status == FROZEN."
    error_id: ERR_POOL_HAS_FROZEN_DISTRIBUTIONS
    http_status: 409
    applies_to: "POST /royalty/pools/{id}/finalize"

  - priority: 10
    category: business_safety
    check: "When creating a RightsHolder with holder_kind == INDIVIDUAL and is_minor == true, guardian_holder_id MUST be supplied AND reference an adult ORGANIZATION or non-minor INDIVIDUAL."
    error_id: ERR_MINOR_REQUIRES_GUARDIAN
    http_status: 422
    applies_to: "POST /royalty/rights-holders"

  - priority: 11
    category: business_safety
    check: "Minor RightsHolder cannot receive direct payment routing: payments for minors MUST route to guardian's bank_account_token. A minor without an active guardian binding is rejected."
    error_id: ERR_MINOR_PAYOUT_BLOCKED
    http_status: 422
    applies_to: "POST /royalty/payout-batches"

  - priority: 12
    category: business_safety
    check: "PlaybackBatch ingest requires source_signature to match HMAC-SHA256(canonical_payload, source_secret)."
    error_id: ERR_PLAYBACK_SIGNATURE_INVALID
    http_status: 403
    applies_to: "POST /royalty/playback-batches"

  - priority: 13
    category: business_constraint
    check: "Work.isrc unique across all Work rows where isrc IS NOT NULL; same for iswc."
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /royalty/works"

  - priority: 14
    category: business_constraint
    check: "Co-creator contribution_percent values sum to exactly 100.00 at submit."
    error_id: ERR_COCREATOR_SUM_INVALID
    http_status: 422
    applies_to: "POST /royalty/works/{id}/submit"

  - priority: 15
    category: business_constraint
    check: "All ACTIVE RightsShare rows on a Work MUST sum to exactly 100.00 to allow approval."
    error_id: ERR_SHARE_SUM_INVALID
    http_status: 422
    applies_to: "POST /royalty/works/{id}/approve"

  - priority: 16
    category: business_referential
    check: "RightsShare.agency_binding_id, when set, must reference an AgencyBinding whose rights_holder_id == this share's rights_holder_id AND whose status == ACTIVE AND whose territory IN {'WW', pool.region}."
    error_id: ERR_AGENCY_BINDING_INAPPLICABLE
    http_status: 422
    applies_to: "POST/PATCH /royalty/works/{id}/shares"

  - priority: 17
    category: business_constraint
    check: "DistributionRuleVersion: when distribution_mode == HYBRID, per_play_weight + per_duration_weight MUST equal 1.00."
    error_id: ERR_RULE_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /royalty/distribution-rules"

  - priority: 18
    category: business_temporal
    check: "DistributionRuleVersion.effective_from MUST be < closing pool's period_end at pool close."
    error_id: ERR_RULE_NOT_EFFECTIVE
    http_status: 422
    applies_to: "POST /royalty/pools/{id}/close"

  - priority: 19
    category: business_temporal
    check: "AgencyBinding: effective_from < effective_until (when effective_until is set); a new binding for the same (rights_holder_id, agency_kind, territory) MUST NOT overlap an existing ACTIVE binding [effective_from, effective_until) closed-open."
    error_id: ERR_AGENCY_BINDING_OVERLAP
    http_status: 409
    applies_to: "POST /royalty/agency-bindings"

  - priority: 20
    category: business_temporal
    check: "AgencyBinding for the same (rights_holder_id, agency_kind) in the same territory cannot have a successor binding starting strictly before predecessor's effective_until; the start MUST be >= predecessor.effective_until (no buffer required)."
    error_id: ERR_AGENCY_BINDING_OVERLAP
    http_status: 409
    applies_to: "POST /royalty/agency-bindings"

  - priority: 21
    category: business_temporal
    check: "PlaybackBatch: reporting_period_end > reporting_period_start AND reporting_period_end <= now() AND (reporting_period_end - reporting_period_start) <= 31 days."
    error_id: ERR_PLAYBACK_RANGE_INVALID
    http_status: 422
    applies_to: "POST /royalty/playback-batches"

  - priority: 22
    category: business_constraint
    check: "PlaybackBatch: duplicate (source_identifier, period_start, period_end) for an existing VALID batch is rejected."
    error_id: ERR_DUPLICATE_BATCH
    http_status: 409
    applies_to: "POST /royalty/playback-batches"

  - priority: 23
    category: business_fiscal
    check: "Payment.gross_cents >= DistributionRuleVersion.minimum_payout_cents OR drained_micro_balance_flag == true. A payment whose gross is below threshold and micro cap not exceeded must NOT be generated."
    error_id: ERR_BELOW_MIN_PAYOUT
    http_status: 422
    applies_to: "POST /royalty/payout-batches"

  - priority: 24
    category: business_fiscal
    check: "PayoutBatch: cycle_tag must be unique across all PayoutBatch rows."
    error_id: ERR_DUPLICATE_CYCLE
    http_status: 409
    applies_to: "POST /royalty/payout-batches"

  - priority: 25
    category: business_referential
    check: "Distribution.forfeit: payment for this rights_holder must have status IN {FAILED, ABANDONED} OR holder.bank_account_token revoked."
    error_id: ERR_DISTRIBUTION_NOT_FORFEITABLE
    http_status: 409
    applies_to: "POST /royalty/distributions/{id}/forfeit"

  - priority: 26
    category: business_constraint
    check: "OCC: when client supplies version on a mutating endpoint, server compares to current version."
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PATCH /royalty/*"

  - priority: 27
    category: business_constraint
    check: "Dispute resolution body.outcome must be one of {UPHELD, DISMISSED} and arbitration_decision MUST be present."
    error_id: ERR_RESOLUTION_INVALID
    http_status: 422
    applies_to: "POST /royalty/disputes/{id}/resolve"

  - priority: 28
    category: business_constraint
    check: "Generic input shape validation (missing required fields, type errors, out-of-range numeric values) for any endpoint after auth/existence/state checks pass."
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: all

# ============================================================================
# §1.5 API Endpoint Table
# ============================================================================
endpoints:

  # ---- Rights Holder management ----
  - method: POST
    path: "/royalty/rights-holders"
    description: "Create a rights-holder (individual or organization). Minors require guardian binding."
    roles: [PlatformAdmin]
    code: 201
    input: ["legal_name", "holder_kind", "date_of_birth?", "guardian_holder_id?", "tax_jurisdiction", "payout_currency", "bank_account_token"]
    output: RightsHolder
    side_effects: ["computes is_minor at creation"]

  - method: GET
    path: "/royalty/rights-holders/{id}"
    description: "Read a rights-holder."
    roles: [PlatformAdmin, RightsHolder, FinanceOps, RegistrationReviewer, DisputeOfficer]
    code: 200
    input: []
    output: RightsHolder
    side_effects: []

  - method: GET
    path: "/royalty/rights-holders"
    description: "List rights-holders."
    roles: [PlatformAdmin, FinanceOps]
    code: 200
    input: ["limit?", "offset?", "holder_kind?", "is_minor?", "tax_jurisdiction?"]
    output: RightsHolder[]
    side_effects: []

  - method: GET
    path: "/royalty/rights-holders/{id}/dispute-exposure"
    description: "Compute dispute exposure score for a holder. Supports ?mode=forward_looking (default) or ?mode=chronological."
    roles: [PlatformAdmin, FinanceOps]
    code: 200
    input: ["mode?"]
    output: "{ score: integer, mode: string }"
    side_effects: ["calculation holder_dispute_exposure_score runs in the requested variant"]

  # ---- Agency bindings ----
  - method: POST
    path: "/royalty/agency-bindings"
    description: "Create an agency binding for a rights-holder."
    roles: [PlatformAdmin, RightsHolder]
    code: 201
    input: ["rights_holder_id", "agency_kind", "agency_name", "territory", "commission_percent", "effective_from", "effective_until?"]
    output: AgencyBinding
    side_effects: []

  - method: POST
    path: "/royalty/agency-bindings/{id}/terminate"
    description: "Terminate an active agency binding."
    roles: [PlatformAdmin, RightsHolder]
    code: 200
    input: ["version?"]
    output: AgencyBinding
    side_effects: ["status := TERMINATED"]

  # ---- Works ----
  - method: POST
    path: "/royalty/works"
    description: "Register a new work in DRAFT."
    roles: [RightsHolder]
    code: 201
    input: ["title", "duration_seconds", "isrc?", "iswc?", "rights_type", "co_creators", "original_proof_url"]
    output: Work
    side_effects: []

  - method: GET
    path: "/royalty/works/{id}"
    description: "Read a work."
    roles: [PlatformAdmin, RightsHolder, RegistrationReviewer, DisputeOfficer, FinanceOps]
    code: 200
    input: []
    output: Work
    side_effects: []

  - method: GET
    path: "/royalty/works"
    description: "List works with filters."
    roles: [PlatformAdmin, RegistrationReviewer, FinanceOps]
    code: 200
    input: ["limit?", "offset?", "registration_status?", "dispute_posture?", "rights_type?"]
    output: Work[]
    side_effects: []

  - method: POST
    path: "/royalty/works/{id}/submit"
    description: "Submit a DRAFT work for review."
    roles: [RightsHolder]
    code: 200
    input: ["version?"]
    output: Work
    side_effects: ["state: DRAFT → SUBMITTED"]

  - method: POST
    path: "/royalty/works/{id}/take-review"
    description: "Reviewer takes a SUBMITTED work into UNDER_REVIEW."
    roles: [RegistrationReviewer]
    code: 200
    input: ["version?"]
    output: Work
    side_effects: ["state: SUBMITTED → UNDER_REVIEW; reviewer_id := X-User-ID"]

  - method: POST
    path: "/royalty/works/{id}/approve"
    description: "Approve an UNDER_REVIEW work."
    roles: [RegistrationReviewer]
    code: 200
    input: ["version?"]
    output: Work
    side_effects: ["state: UNDER_REVIEW → APPROVED; requires shares summing to 100"]

  - method: POST
    path: "/royalty/works/{id}/reject"
    description: "Reject an UNDER_REVIEW work."
    roles: [RegistrationReviewer]
    code: 200
    input: ["reject_reason", "version?"]
    output: Work
    side_effects: ["state: UNDER_REVIEW → REJECTED; cascade terminates RightsShares (depth 2); ShareChangeAudit (depth 3)"]

  - method: POST
    path: "/royalty/works/{id}/withdraw"
    description: "Owner withdraws a DRAFT work."
    roles: [RightsHolder]
    code: 200
    input: ["version?"]
    output: Work
    side_effects: ["state: DRAFT → WITHDRAWN"]

  - method: POST
    path: "/royalty/works/{id}/return-to-draft"
    description: "Return a SUBMITTED work to DRAFT for amendment (revision loop)."
    roles: [RegistrationReviewer]
    code: 200
    input: ["version?"]
    output: Work
    side_effects: ["state: SUBMITTED → DRAFT"]

  # ---- Rights shares ----
  - method: POST
    path: "/royalty/works/{id}/shares"
    description: "Add a RightsShare to a work."
    roles: [RightsHolder, PlatformAdmin]
    code: 201
    input: ["rights_holder_id", "share_percent", "agency_binding_id?"]
    output: RightsShare
    side_effects: ["ShareChangeAudit (CREATED)"]

  - method: PATCH
    path: "/royalty/works/{id}/shares/{share_id}"
    description: "Update a RightsShare (percent, agency binding, or terminate)."
    roles: [RightsHolder, PlatformAdmin]
    code: 200
    input: ["share_percent?", "agency_binding_id?", "share_status?", "version?"]
    output: RightsShare
    side_effects: ["ShareChangeAudit (PERCENT_UPDATED | AGENCY_REBOUND | STATUS_TRANSITION | TERMINATED); blocked when Work.dispute_posture == FROZEN"]

  - method: GET
    path: "/royalty/works/{id}/shares/{share_id}/audit"
    description: "Read the share-change audit history for a share."
    roles: [PlatformAdmin, RightsHolder, DisputeOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: ShareChangeAudit[]
    side_effects: []

  # ---- Playback ----
  - method: POST
    path: "/royalty/playback-batches"
    description: "Ingest a playback batch. Validates HMAC signature, range, dedup; classifies and supplements events."
    roles: [PlaybackSource]
    code: 201
    input: ["channel", "source_identifier", "source_signature", "reporting_period_start", "reporting_period_end", "total_events_submitted", "events"]
    output: PlaybackBatch
    side_effects: ["state machine PlaybackBatch fires; PlaybackEvent rows created with status classification"]

  - method: GET
    path: "/royalty/playback-batches/{id}"
    description: "Read a playback batch with its validity status."
    roles: [PlatformAdmin, FinanceOps, PlaybackSource]
    code: 200
    input: []
    output: PlaybackBatch
    side_effects: []

  - method: GET
    path: "/royalty/playback-batches/{id}/events"
    description: "List events in a batch with their per-event status."
    roles: [PlatformAdmin, FinanceOps]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: PlaybackEvent[]
    side_effects: []

  # ---- Distribution rules ----
  - method: POST
    path: "/royalty/distribution-rules"
    description: "Create a new DistributionRuleVersion."
    roles: [PlatformAdmin]
    code: 201
    input: ["version_tag", "channel", "distribution_mode", "per_play_weight?", "per_duration_weight?", "playback_type_weights", "minimum_payout_cents", "micro_accumulation_cap_cents", "effective_from"]
    output: DistributionRuleVersion
    side_effects: []

  - method: GET
    path: "/royalty/distribution-rules"
    description: "List distribution rule versions."
    roles: [PlatformAdmin, FinanceOps]
    code: 200
    input: ["limit?", "offset?", "channel?"]
    output: DistributionRuleVersion[]
    side_effects: []

  # ---- Royalty pools ----
  - method: POST
    path: "/royalty/pools"
    description: "Open a royalty pool for a period × revenue_source × region."
    roles: [FinanceOps]
    code: 201
    input: ["period_start", "period_end", "revenue_source", "region", "gross_revenue_cents", "platform_share_percent", "pool_currency", "mechanical_split_percent", "distribution_rule_version_id?"]
    output: RoyaltyPool
    side_effects: []

  - method: PATCH
    path: "/royalty/pools/{id}"
    description: "Patch a pool's distribution_rule_version_id or gross_revenue_cents before close."
    roles: [FinanceOps]
    code: 200
    input: ["gross_revenue_cents?", "distribution_rule_version_id?", "version?"]
    output: RoyaltyPool
    side_effects: []

  - method: POST
    path: "/royalty/pools/{id}/close"
    description: "Close an OPEN pool. Computes net_distributable_cents, admin tier fee, creates Distribution rows."
    roles: [FinanceOps]
    code: 200
    input: ["version?"]
    output: RoyaltyPool
    side_effects: ["calc net_distributable (depth 1); calc pool_tier_fee (depth 1); cascade Distribution creation (depth 2); each Distribution's gross via distribution_share (depth 3); FROZEN cascade applied if Work.dispute_posture == FROZEN"]

  - method: POST
    path: "/royalty/pools/{id}/finalize"
    description: "Finalize a CLOSED pool: flip all PENDING Distributions to RELEASED."
    roles: [FinanceOps]
    code: 200
    input: ["version?"]
    output: RoyaltyPool
    side_effects: ["state: CLOSED → DISTRIBUTED; Distribution PENDING → RELEASED"]

  - method: GET
    path: "/royalty/pools/{id}"
    description: "Read a pool."
    roles: [PlatformAdmin, FinanceOps]
    code: 200
    input: []
    output: RoyaltyPool
    side_effects: []

  - method: GET
    path: "/royalty/pools/{id}/distributions"
    description: "List distributions under a pool."
    roles: [PlatformAdmin, FinanceOps, RightsHolder]
    code: 200
    input: ["limit?", "offset?", "status?", "work_id?", "rights_holder_id?"]
    output: Distribution[]
    side_effects: []

  - method: POST
    path: "/royalty/distributions/{id}/forfeit"
    description: "Forfeit a RELEASED distribution that cannot be paid; cents reabsorb into pool."
    roles: [PlatformAdmin]
    code: 200
    input: ["version?"]
    output: Distribution
    side_effects: ["status := FORFEITED; cents reabsorbed"]

  # ---- Disputes ----
  - method: POST
    path: "/royalty/disputes"
    description: "Open a dispute on a work."
    roles: [RightsHolder]
    code: 201
    input: ["work_id", "dispute_kind", "claim_summary"]
    output: Dispute
    side_effects: ["Work.dispute_posture := FROZEN; cascade Distribution PENDING/RELEASED → FROZEN (depth 2)"]

  - method: POST
    path: "/royalty/disputes/{id}/submit-evidence"
    description: "Submit an evidence item (URL) on a dispute."
    roles: [RightsHolder, DisputeOfficer]
    code: 200
    input: ["url", "version?"]
    output: Dispute
    side_effects: ["evidence_items appended"]

  - method: POST
    path: "/royalty/disputes/{id}/start-investigation"
    description: "Move dispute OPEN → UNDER_INVESTIGATION."
    roles: [DisputeOfficer]
    code: 200
    input: ["version?"]
    output: Dispute
    side_effects: []

  - method: POST
    path: "/royalty/disputes/{id}/advance-to-mediation"
    description: "Move dispute UNDER_INVESTIGATION → MEDIATION."
    roles: [DisputeOfficer]
    code: 200
    input: ["version?"]
    output: Dispute
    side_effects: []

  - method: POST
    path: "/royalty/disputes/{id}/reopen-investigation"
    description: "Move dispute MEDIATION → UNDER_INVESTIGATION (cyclic loop)."
    roles: [DisputeOfficer]
    code: 200
    input: ["version?"]
    output: Dispute
    side_effects: []

  - method: POST
    path: "/royalty/disputes/{id}/advance-to-arbitration"
    description: "Move dispute MEDIATION → ARBITRATION."
    roles: [DisputeOfficer]
    code: 200
    input: ["version?"]
    output: Dispute
    side_effects: []

  - method: POST
    path: "/royalty/disputes/{id}/resolve"
    description: "Resolve a dispute (UPHELD or DISMISSED)."
    roles: [DisputeOfficer]
    code: 200
    input: ["outcome", "arbitration_decision", "new_share_percentages?", "version?"]
    output: Dispute
    side_effects: ["state: ARBITRATION → RESOLVED_UPHELD/DISMISSED; cascade Work.dispute_posture (depth 1) → distributions FROZEN→RELEASED (depth 2 → 3); if SHARE_RATIO upheld, RightsShare percentages mutated"]

  - method: POST
    path: "/royalty/disputes/{id}/withdraw"
    description: "Claimant withdraws an OPEN dispute."
    roles: [RightsHolder]
    code: 200
    input: ["version?"]
    output: Dispute
    side_effects: ["state: OPEN → WITHDRAWN; cascade unfreezes"]

  # ---- Payouts ----
  - method: POST
    path: "/royalty/payout-batches"
    description: "Generate a PayoutBatch with Payments aggregated from RELEASED Distributions and drained MicroBalance."
    roles: [FinanceOps]
    code: 201
    input: ["cycle_tag", "scheduled_run_at"]
    output: PayoutBatch
    side_effects: ["calc payment_aggregation per holder/currency; Payment rows created; sub-threshold amounts deposited to MicroBalance"]

  - method: POST
    path: "/royalty/payout-batches/{id}/execute"
    description: "Execute a PENDING batch (after scheduled_run_at). Marks payments SENT and emits ExternalSyncEvents."
    roles: [FinanceOps]
    code: 200
    input: ["version?"]
    output: PayoutBatch
    side_effects: ["state: PENDING → RUNNING; each Payment QUEUED → SENT; ExternalSyncEvent PAYMENT_INITIATED rows"]

  - method: GET
    path: "/royalty/payout-batches/{id}"
    description: "Read a payout batch."
    roles: [PlatformAdmin, FinanceOps]
    code: 200
    input: []
    output: PayoutBatch
    side_effects: []

  - method: GET
    path: "/royalty/payout-batches/{id}/payments"
    description: "List payments in a batch."
    roles: [PlatformAdmin, FinanceOps]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/royalty/payments/{id}/retry"
    description: "Retry a FAILED payment."
    roles: [FinanceOps]
    code: 200
    input: ["version?"]
    output: Payment
    side_effects: ["state: FAILED → RETRYING; retry_count++"]

  - method: POST
    path: "/royalty/payments/{id}/abandon"
    description: "Abandon a FAILED payment after retries exhausted."
    roles: [FinanceOps]
    code: 200
    input: ["policy", "version?"]
    output: Payment
    side_effects: ["state: FAILED → ABANDONED; Distribution either FORFEITED or returned to MicroBalance per policy"]

  # ---- External sync ----
  - method: POST
    path: "/royalty/_events/psp-callback"
    description: "Test-driving endpoint: receive an external PSP callback to advance payment state."
    roles: [PlatformAdmin]
    code: 200
    input: ["payment_id", "outcome", "reason?"]
    output: Payment
    side_effects: ["state: SENT → SUCCEEDED or FAILED; cascade Distribution RELEASED→PAID on success; ExternalSyncEvent row written"]

  - method: GET
    path: "/royalty/_events/external-sync"
    description: "List ExternalSyncEvent rows for verification."
    roles: [PlatformAdmin]
    code: 200
    input: ["limit?", "offset?", "target_system?", "event_kind?", "related_entity_id?"]
    output: ExternalSyncEvent[]
    side_effects: []

  - method: POST
    path: "/royalty/_clock/advance"
    description: "Test-driving endpoint: advance the server logical clock to a UTC moment."
    roles: [PlatformAdmin]
    code: 200
    input: ["to"]
    output: "{ now: ISO8601 }"
    side_effects: ["server clock used in all time comparisons advances; does not by itself trigger any state machine"]

  - method: POST
    path: "/royalty/_sweep/run"
    description: "Test-driving endpoint: run the retry executor and the dispute-posture recomputation sweep."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ swept_payments: integer, swept_works: integer }"
    side_effects: ["RETRYING payments → SENT; Work.dispute_posture recomputed for all approved works; idempotent"]

  # ---- Micro balance ----
  - method: GET
    path: "/royalty/rights-holders/{id}/micro-balance"
    description: "Read a holder's per-currency MicroBalance."
    roles: [PlatformAdmin, RightsHolder, FinanceOps]
    code: 200
    input: []
    output: MicroBalance[]
    side_effects: []

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or unknown X-User-Role / X-User-ID."

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role lacks permission for this operation."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."

  - id: ERR_VALIDATION
    http: 422
    condition: "Generic input validation failure (missing required field, bad type)."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in correct state for this operation."

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "OCC version mismatch."

  - id: ERR_WORK_FROZEN
    http: 409
    condition: "Work.dispute_posture == FROZEN blocks share-mutation operation."

  - id: ERR_POOL_HAS_FROZEN_DISTRIBUTIONS
    http: 409
    condition: "Finalize attempted while at least one Distribution.status == FROZEN."

  - id: ERR_DISTRIBUTION_NOT_FORFEITABLE
    http: 409
    condition: "Forfeit attempted on a distribution whose payment is still live and bank token not revoked."

  - id: ERR_MINOR_REQUIRES_GUARDIAN
    http: 422
    condition: "Minor RightsHolder created without valid guardian binding."

  - id: ERR_MINOR_PAYOUT_BLOCKED
    http: 422
    condition: "Payout to minor without guardian routing rejected."

  - id: ERR_PLAYBACK_SIGNATURE_INVALID
    http: 403
    condition: "HMAC signature on PlaybackBatch ingest does not match source secret."

  - id: ERR_PLAYBACK_RANGE_INVALID
    http: 422
    condition: "PlaybackBatch reporting window invalid (end<=start, future, or >31 days)."

  - id: ERR_DUPLICATE_BATCH
    http: 409
    condition: "PlaybackBatch with same source_identifier and exact period already accepted as VALID."

  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "ISRC or ISWC already registered."

  - id: ERR_COCREATOR_SUM_INVALID
    http: 422
    condition: "co_creators[].contribution_percent does not sum to 100.00."

  - id: ERR_SHARE_SUM_INVALID
    http: 422
    condition: "RightsShare ACTIVE rows do not sum to 100.00 at approval."

  - id: ERR_AGENCY_BINDING_INAPPLICABLE
    http: 422
    condition: "Referenced AgencyBinding does not match share's holder/territory/status."

  - id: ERR_AGENCY_BINDING_OVERLAP
    http: 409
    condition: "New AgencyBinding overlaps an existing ACTIVE binding on the same (rights_holder_id, agency_kind, territory)."

  - id: ERR_RULE_WEIGHTS_INVALID
    http: 422
    condition: "DistributionRuleVersion HYBRID mode weights do not sum to 1.00."

  - id: ERR_RULE_NOT_EFFECTIVE
    http: 422
    condition: "Pinned DistributionRuleVersion.effective_from > pool.period_end."

  - id: ERR_BELOW_MIN_PAYOUT
    http: 422
    condition: "Generated Payment.gross below minimum_payout_cents and micro_accumulation_cap not exceeded."

  - id: ERR_DUPLICATE_CYCLE
    http: 409
    condition: "PayoutBatch cycle_tag already used."

  - id: ERR_RESOLUTION_INVALID
    http: 422
    condition: "Dispute resolution body missing outcome or arbitration_decision."

# ============================================================================
# §1.7 RBAC Matrix
# ============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator with administrative override on rights-holders, distribution rules, and forfeitures."
    identity: "opaque"
    exclusive_operations:
