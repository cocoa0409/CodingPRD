          - state_machines.Project.commercial_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / project_delivery_and_commercial_dimensions_advance_independently
          rationale: "That instance already drives both dimensions on one Project row and asserts the combined state after each independent move."

      - name: fabrication_lot_rework_cycle_returns_to_fabricating_after_a_failed_fat
        claim_type: valid_transition
        grounds:
          - state_machines.FabricationLot.FAT_FAILED_to_FABRICATING
          - calculations.fat_result_evaluation
        excluded_because:
          difficulty_instance: non_linear_state_machine / fabrication_lot_fat_rework_cycle_then_third_failure_scraps
          rationale: "That instance walks FAT_FAILED -> FABRICATING -> STAGED twice and then the attempt-cap scrap on the third failure."

