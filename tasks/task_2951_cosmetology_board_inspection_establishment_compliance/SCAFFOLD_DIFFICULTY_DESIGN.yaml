            - call: "POST /cosmetology/violation-codes"
              payload: { code: "FSP-300", category: "FOOT_SPA", severity: "CRITICAL", base_points: 4.0, fine_cents_base: 30000 }
              as: BoardAdmin
              as_user_id: "admin-001"
