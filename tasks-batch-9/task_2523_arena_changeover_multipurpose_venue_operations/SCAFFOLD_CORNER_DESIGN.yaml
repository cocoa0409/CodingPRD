              as: BookingManager
              captures: { bk_c: $.data.id }
            - call: "POST /event-bookings"
              payload: { venue_id: "${venue_id}", config_profile_id: "${p_ice}", title: "Booking B hockey Sep 12", promoter_name: "Lakeside Hockey Club", event_start_utc: "2026-09-12T00:00:00Z", event_end_utc: "2026-09-12T03:00:00Z", expected_attendance: 15000, rigging_load_kg: 5000 }
              as: BookingManager
              captures: { bk_b: $.data.id }
