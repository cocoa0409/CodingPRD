          - entities.Closing.fields.scheduled_date
          - entities.Closing.fields.window_days
        distinguishing_aspect: |
          Property-scoped half-open pairwise overlap: closing #1 occupies [2026-08-01, 2026-08-08) and
          closing #2 [2026-08-05, 2026-08-12); since 08-05 < 08-08 the windows overlap and #2 is rejected
          with ERR_CLOSING_WINDOW_CONFLICT. Interval semantics = half-open [start, start+window_days) with
          adjacency allowed - distinct from the applicant-scoped buffered session rule.
