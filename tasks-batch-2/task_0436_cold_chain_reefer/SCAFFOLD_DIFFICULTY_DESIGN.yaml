  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: deliver_cascade_degree_minutes_to_impairment_to_posture
        grounds:
          - state_machines.Shipment.IN_TRANSIT_to_DELIVERED
          - calculations.degree_minutes_out_of_range
          - calculations.compartment_impairment
          - entities.Compartment.fields.impairment
          - entities.Shipment.fields.load_integrity_posture
        distinguishing_aspect: "Depth-3 cascade from DELIVER: deliver finalizes Compartment.degree_minutes_out (link 1) -> that value reclassifies Compartment.impairment to TOTAL_LOSS (link 2, caused by the finalized degree-minutes) -> that impairment drives Shipment.load_integrity_posture to COMPROMISED (link 3, caused by the compartment impairment)."
        test_recipe:
          setup:
            - "IN_TRANSIT FROZEN shipment; TEMP readings forcing FINAL degree_minutes 300 (TOTAL_LOSS)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { legal_name: "Cascade Carrier", fsma_registered: true, sanitary_training_current: true }
              as: Carrier
              as_user_id: "carrier-op-7"
              captures: { carrier_id: $.data.id }
            - call: "POST /temp-lanes"
              payload: { code: "FROZEN", setpoint_min_c: -25, setpoint_max_c: -15, regulated: true, tolerance_degree_minutes: 30 }
