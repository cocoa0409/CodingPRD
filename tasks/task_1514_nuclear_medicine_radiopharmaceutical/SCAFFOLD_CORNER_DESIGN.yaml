          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (certifier == sealer rso-1)"

      - name: calibrator_cannot_administer_same_vial
        claim_type: segregation_of_duties
        grounds: ["validations[priority=14]", "errors[ERR_SEGREGATION_OF_DUTIES]", entities.DoseVial.fields.calibrated_by_user_id]
        distinguishing_aspect: "The technologist role may administer, but the same operator id that calibrated the vial is rejected even though role checks pass"
        test_recipe:
          setup: ["Base F-18 fixture; vial calibrated at 08:30 by operator id shared-1; clock 10:20"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries", payload: { isotope_product_id: "${iso}", scheduled_arrival_at: "2026-08-01T08:00:00Z", reference_activity_mbq: 5000, reference_time_at: "2026-08-01T08:00:00Z" }, as: Radiopharmacist, captures: { del: $.data.id } }
            - { call: "POST /nuclear-medicine/isotope-deliveries/${del}/receive", payload: { measured_activity_mbq: 5000 }, as: Radiopharmacist }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:30:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials", payload: { order_id: "${ord}", delivery_id: "${del}" }, as: Radiopharmacist, captures: { vial: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/calibrate", payload: { measured_activity_mbq: 220 }, as: Radiopharmacist, as_user_id: "shared-1" }
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T10:20:00Z" }, as: DepartmentAdmin }
          trigger:
            - { call: "POST /nuclear-medicine/dose-vials/${vial}/administer", payload: {}, as: NuclearMedicineTechnologist, as_user_id: "shared-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_SEGREGATION_OF_DUTIES (administrator id shared-1 == calibrated_by_user_id)"

      - name: spill_reporter_cannot_clear_own_report
        claim_type: segregation_of_duties
        grounds: ["validations[priority=14]", "errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.SpillIncident.DECONTAMINATED_to_CLEARED]
        distinguishing_aspect: "The RSO who reported the spill cannot clear it; a different RSO clears successfully and the room posture restores"
        test_recipe:
          setup: ["Spill reported by rso-1, advanced to DECONTAMINATED by rso-2, PASS survey recorded"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Room-9", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
            - { call: "POST /nuclear-medicine/spill-incidents", payload: { room_id: "${room}", isotope_product_id: "${iso}", estimated_activity_mbq: 10, occurred_at: "2026-08-01T08:00:00Z" }, as: RadiationSafetyOfficer, as_user_id: "rso-1", captures: { spill: $.data.id } }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CONTAINED" }, as: RadiationSafetyOfficer, as_user_id: "rso-2" }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "DECONTAMINATED" }, as: RadiationSafetyOfficer, as_user_id: "rso-2" }
            - { call: "POST /nuclear-medicine/radiation-surveys", payload: { room_id: "${room}", ambient_dose_rate_usv_h: 0.4, result: "PASS" }, as: RadiationSafetyOfficer, as_user_id: "rso-2" }
          trigger:
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CLEARED" }, as: RadiationSafetyOfficer, as_user_id: "rso-1", captures: { err: $.data.error_id } }
            - { call: "POST /nuclear-medicine/spill-incidents/${spill}/advance", payload: { to_state: "CLEARED" }, as: RadiationSafetyOfficer, as_user_id: "rso-2", captures: { st: $.data.status } }
            - { call: "GET /nuclear-medicine/imaging-rooms/${room}", as: DepartmentAdmin, captures: { roomst: $.data.status } }
          assert:
            - "First trigger rejected: error_id == ERR_SEGREGATION_OF_DUTIES (clearer rso-1 == reporter)"
            - "Second trigger succeeds: status == CLEARED and ImagingRoom.${room}.status == OPERATIONAL"

  - section: complexity_layers
    instances:
      - name: occ_stale_substitute_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[order-substitute-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential substitutions carrying the same captured version 1: the first succeeds (original version advances to 2), the second is rejected 412 ERR_STALE_VERSION — no overlap in time required"
        test_recipe:
          setup: ["F-18 fixture; order ORDERED at version 1 (no vial)"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/licenses", payload: { license_number: "L-100", max_possession_mbq: 100000, isotope_conditions: [ { isotope_product_id: "${iso}", max_possession_mbq: 50000, allowed_use: "BOTH" } ], expires_at: "2027-08-01T00:00:00Z" }, as: DepartmentAdmin, captures: { lic: $.data.id } }
            - { call: "POST /nuclear-medicine/authorized-users", payload: { full_name: "Dr. A", license_id: "${lic}", scope: "BOTH", expires_at: "2027-01-01T00:00:00Z" }, as: DepartmentAdmin, captures: { au: $.data.id } }
            - { call: "POST /nuclear-medicine/patients", payload: { full_name: "P One", weight_kg: 70 }, as: NuclearMedicineTechnologist, captures: { pat: $.data.id } }
            - { call: "POST /nuclear-medicine/dose-orders", payload: { patient_id: "${pat}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T10:20:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { ord: $.data.id, ord_v: $.data.version } }
          trigger:
            - { call: "POST /nuclear-medicine/dose-orders/${ord}/substitute", payload: { expected_order_version: "${ord_v}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T11:00:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { neword: $.data.id, rep: $.data.replaces_order_id } }
            - { call: "GET /nuclear-medicine/dose-orders/${ord}", as: DepartmentAdmin, captures: { ost: $.data.status, ov: $.data.version, sup: $.data.superseded_by_order_id } }
            - { call: "POST /nuclear-medicine/dose-orders/${ord}/substitute", payload: { expected_order_version: "${ord_v}", isotope_product_id: "${iso}", use_type: "DIAGNOSTIC", prescribed_activity_mbq: 100, administration_scheduled_at: "2026-08-01T11:30:00Z" }, as: AuthorizedUser, as_user_id: "${au}", captures: { err: $.data.error_id } }
          assert:
            - "First substitute returns 201 with replaces_order_id == ${ord}"
            - "Original order: status == SUPERSEDED, version == 2, superseded_by_order_id == ${neword}"
            - "Second substitute with the same captured version rejected: error_id == ERR_STALE_VERSION, http 412"

      - name: occ_container_seal_stale_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[container-seal-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential seals carrying the captured version 1: the first seals (version 2), the second hits the priority-4 OCC check before the state check and gets 412 ERR_STALE_VERSION rather than ERR_INVALID_STATE"
        test_recipe:
          setup: ["Container created at version 1"]
          setup_api_calls:
            - { call: "POST /nuclear-medicine/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T08:00:00Z" }, as: DepartmentAdmin }
            - { call: "POST /nuclear-medicine/isotope-products", payload: { name: "F-18 FDG", half_life_minutes: 110, spill_major_threshold_mbq: 37, release_activity_limit_mbq: 1221, min_usable_activity_mbq: 10 }, as: DepartmentAdmin, captures: { iso: $.data.id } }
            - { call: "POST /nuclear-medicine/imaging-rooms", payload: { name: "Waste-Store", cleanup_buffer_minutes: 15 }, as: DepartmentAdmin, captures: { room: $.data.id } }
            - { call: "POST /nuclear-medicine/waste-containers", payload: { isotope_product_id: "${iso}", room_id: "${room}" }, as: RadiationSafetyOfficer, as_user_id: "rso-1", captures: { con: $.data.id, con_v: $.data.version } }
          trigger:
            - { call: "POST /nuclear-medicine/waste-containers/${con}/seal", payload: { expected_container_version: "${con_v}" }, as: RadiationSafetyOfficer, as_user_id: "rso-1", captures: { st: $.data.status, v2: $.data.version } }
            - { call: "POST /nuclear-medicine/waste-containers/${con}/seal", payload: { expected_container_version: "${con_v}" }, as: RadiationSafetyOfficer, as_user_id: "rso-1", captures: { err: $.data.error_id } }
          assert:
            - "First seal: status == SEALED, version == 2, sealed_at == 2026-08-01T08:00:00Z, clearable_after_at == 2026-08-02T02:20:00Z"
            - "Second seal with the stale captured version: error_id == ERR_STALE_VERSION, http 412 (OCC beats the state check)"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "transitive_cascade / spill_report_cascade_depth3"
          rationale: "The 4-hop spill cascade is asserted hop-by-hop in the difficulty instance."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "dual_variant_calc / release_activity_variant_vs_measured_rate_variant"
          rationale: "Both calculation variant families are covered by the two dual_variant_calc difficulty instances."

      - name: rate_threshold_layer
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers, calculations.spill_classification]
        excluded_because:
          difficulty_instance: "boundary_precision_check / spill_threshold_inclusive_major"
          rationale: "Threshold boundary behavior (inclusive >=) is asserted in the boundary difficulty instance."

