      - name: rationing_credit_hold_customer_is_withheld_and_excluded_from_pro_rata
        claim_type: Input Set Filtering
        grounds:
          - calculations.calc_rationing_waterfall
          - entities.Customer.fields.credit_hold
          - entities.Allocation.fields.allocation_status
        distinguishing_aspect: |
          A credit-held customer is removed from the pro-rata DENOMINATOR, not merely zeroed
          after the split. Two customers each request 500 of a 900-unit supply: the credit-held
          one gets 0 / WITHHELD_CREDIT_HOLD / NONE and the other gets its FULL 500 because the
          pool total is 500, leaving 400 in unallocated_units. Zeroing after the split would
          give 450 and 450, and leaving the held customer in the pool would give 450 to the
          eligible one.
