              captures: { e_prot_ca: $.data.error_id }
            - call: "GET /incentives/dealers/${dealer_id}"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { d_ok_fsm: $.data.dealer_code }
            - call: "GET /incentives/dealers/${dealer_id}"
              payload: {}
              as: ProgramDesigner
              as_user_id: "u-designer-1"
              captures: { d_ok_pd: $.data.dealer_code }
            - call: "GET /incentives/dealers/${dealer_id}"
              payload: {}
              as: ClaimsAuditor
              as_user_id: "u-auditor-1"
              captures: { d_ok_ca: $.data.dealer_code }
            - call: "GET /incentives/dealers/${dealer_id}"
              payload: {}
              as: Dealer
              as_user_id: "${dealer_id}"
              captures: { d_ok_dlr: $.data.dealer_code }
            - call: "GET /incentives/deliveries/${del_id}/eligible-programs"
              payload: {}
              as: FieldSalesManager
              as_user_id: "u-fsm-1"
              captures: { e_elig_fsm: $.data.error_id }
          assert:
            - "${sum_ok_units} == 0 and ${sum_ok_spend} == 0 for the auditor — spend-summary is readable by ProgramDesigner, IncentiveController and ClaimsAuditor"
            - "${e_sum_fsm} == ${e_sum_dlr} == ERR_UNAUTHORIZED (403) — the field manager who SETS objectives and the dealer who earns the money may not see program-level spend"
            - "${list_ok_total} == 1 for the manager but ${e_list_dlr} == ERR_UNAUTHORIZED — a dealer cannot enumerate the program catalogue"
            - "${one_ok_code} == CRN-X-RDS — yet the SAME dealer may read a program BY ID; the collection and the item endpoint have deliberately different role sets"
            - "${del_ok_total} == 1 for the manager but ${e_del_pd} == ERR_UNAUTHORIZED — the designer who writes the rules cannot browse the retail sales feed"
            - "${prot_ok_total} == 1 with ${prot_ok_first} == ${prot_id} for the dealer, while ${e_prot_pd} == ${e_prot_ca} == ERR_UNAUTHORIZED — protest traffic is confined to FieldSalesManager, IncentiveController and the Dealer"
            - "${d_ok_fsm} == ${d_ok_pd} == ${d_ok_ca} == ${d_ok_dlr} == CRN-D-RDS — GET /incentives/dealers/{id} is the one read shared by all five roles"
            - "${e_elig_fsm} == ERR_UNAUTHORIZED — the eligible-programs projection is for IncentiveController, ClaimsAuditor and the Dealer only"
            - "every refusal is a 403 with an error envelope, and every admitted read returns success true with a data payload — no endpoint answers a wrong-role read with an empty list, which would silently hide the authorization bug"

      - name: segregation_of_duties_is_scoped_to_the_resource_pair_not_to_the_person
        claim_type: segregation_of_duties
        grounds:
          - complexity_profile.role_model
          - validations[priority=3]
          - errors[ERR_SEGREGATION_OF_DUTIES]
        distinguishing_aspect: "One user, u-dual-1, is blocked at the program site (it submitted P1, so it cannot approve P1) yet is ALLOWED to approve P2 which someone else submitted, and is ALLOWED to adjudicate a claim under P1 because the claim site compares against delivery.validated_by_user_id and nothing else. The natural over-implementation — remembering that u-dual-1 already acted on this program, or banning a user from a whole workflow — fails the two positive halves."
        test_recipe:
          setup:
            - "Two DRAFT-then-submitted CUSTOMER_CASH programs with deliberately disjoint footprints: P1 submitted by u-dual-1, P2 submitted by u-designer-1. One dealer with a delivery validated by u-auditor-1 inside P1's footprint."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-12T00:00:00.000Z" }
              as: IncentiveController
