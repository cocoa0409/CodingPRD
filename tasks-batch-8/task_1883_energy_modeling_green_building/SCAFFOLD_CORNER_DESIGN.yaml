        claim_type: correct_result
        grounds: ["calculations.credit_points_rounding", "entities.CreditAttempt.fields.points_awarded"]
        distinguishing_aspect: "Pinned rounding order: raw 1.4 + 1.4 awards per-credit round_half_up -> 1 + 1 = 2 on the project total, NOT round(2.8) = 3."
        test_recipe:
          setup: ["Strategy locked; two 2-point DESIGN attempts UNDER_REVIEW (no prerequisite entries exist)"]
          setup_api_calls:
            - { call: "POST /team-members", payload: { full_name: "Adam Admin", email: "adam@x.com", specialty: "MANAGEMENT" }, as: ProgramAdmin, captures: { m_admin: $.data.id } }
