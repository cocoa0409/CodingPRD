  # --- Test-driving clock ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the server's logical clock (test-driving endpoint). Startup default is exactly 2026-08-01T00:00:00Z and the server MUST NOT fall back to wall-clock time. Advancing the clock fires, in this order: (1) nomination auto-expiry past review_deadline, (2) award expiry sweep, (3) budget auto-close when current date >= period_end_date."
    roles: [HRAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["runs the ordered auto-transition sweep", "clock never moves backward (ERR_INVALID_REQUEST when to_iso8601 < current)"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Role not permitted for this endpoint, or ownership check failed (Employee/Manager acting on another user's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-supplied FK does not resolve to an existing entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, invalid enum member, out-of-range integer, duplicate employee_ref, manager-chain cycle, budget adjustment result <= 0 or < reserved+committed, clock moved backward" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "Redemption quantity outside 1..5" }
  - { id: ERR_INVALID_TAX_YEAR, http: 400, condition: "tax_year outside 2000..2100" }
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Resource's current state does not permit the requested transition (incl. program close with open work, reinstate with open flags)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_PROGRAM_NOT_ACTIVE, http: 409, condition: "Program not ACTIVE for nomination submit/resubmit, redemption create, budget create, anniversary scan, catalog item create" }
  - { id: ERR_EMPLOYEE_SUSPENDED, http: 409, condition: "Suspended employee attempted to nominate or redeem" }
  - { id: ERR_VELOCITY_LIMIT_EXCEEDED, http: 409, condition: "Nominator already at velocity_limit_per_7_days in the trailing 7-day window; an OPEN AbuseFlag(VELOCITY_EXCEEDED) is created" }
  - { id: ERR_SELF_NOMINATION, http: 422, condition: "nominee_id equals the nominator's own id" }
  - { id: ERR_SELF_APPROVAL, http: 409, condition: "Approver is the nomination's nominator" }
  - { id: ERR_NOMINEE_NOT_IN_SCOPE, http: 409, condition: "PEER nomination across departments, MANAGER nomination from outside the manager chain, or Manager-role approver outside the nominee's chain" }
  - { id: ERR_NOMINATION_TYPE_DISABLED, http: 409, condition: "Program config disables the requested nomination type (peer/manager)" }
  - { id: ERR_DUPLICATE_NOMINATION, http: 409, condition: "Same nominator, nominee, and reason_code with a non-terminal nomination inside duplicate_window_days" }
  - { id: ERR_IDEMPOTENCY_CONFLICT, http: 409, condition: "idempotency_key reused with a different payload" }
  - { id: ERR_BUDGET_NOT_FOUND, http: 409, condition: "No PointBudget whose window contains the relevant date for the (program, department) selector (or the only match is CLOSED)" }
  - { id: ERR_BUDGET_PERIOD_OVERLAP, http: 409, condition: "New budget window intersects an existing budget window for the same (program, department); half-open adjacency is allowed" }
  - { id: ERR_BUDGET_RESTRICTED_AMOUNT, http: 409, condition: "Budget posture RESTRICTED and points_requested > 500" }
  - { id: ERR_BUDGET_EXHAUSTED, http: 409, condition: "reserved + committed + points_requested would exceed allocated_points" }
  - { id: ERR_BUDGET_CLOSED, http: 409, condition: "Adjustment attempted on a CLOSED budget" }
  - { id: ERR_INSUFFICIENT_POINTS, http: 409, condition: "available_points < points_total at redemption creation" }
  - { id: ERR_CATALOG_ITEM_UNAVAILABLE, http: 409, condition: "Item RETIRED or current logical time outside [active_window_start, active_window_end)" }
  - { id: ERR_ITEM_OUT_OF_STOCK, http: 409, condition: "inventory_quantity (non-null) < quantity" }
  - { id: ERR_VENDOR_SUSPENDED, http: 409, condition: "Order submit while the item's vendor is SUSPENDED" }
  - { id: ERR_VENDOR_CAPACITY_EXCEEDED, http: 409, condition: "No ship_date with free capacity within 45 calendar days" }
  - { id: ERR_RETURN_NOT_ALLOWED, http: 409, condition: "Return of a GIFT_CARD item or later than 14 days after delivered_at" }
  - { id: ERR_DUPLICATE_ACCRUAL_RUN, http: 409, condition: "A non-VOIDED AccrualRun already exists for (program_id, period_year, period_month)" }
  - { id: ERR_ACCRUAL_VARIANCE, http: 409, condition: "Recomputed period net chargeback differs from the posted total (variance_cents != 0) at reconcile" }
  - { id: ERR_PERIODS_NOT_CLOSED, http: 409, condition: "finalize-tax-year requested while some month's AccrualRun is missing, OPEN, or RECONCILED" }
  - { id: ERR_TAX_YEAR_FINALIZED, http: 409, condition: "finalize-tax-year repeated for an already-finalized year" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: HRAdmin
    description: "Program administrator: owns program config, departments, employees, anniversary scans, award revocation, and abuse-flag adjudication"
    identity: opaque
    exclusive_operations:
      - "POST /api/programs; PATCH /api/programs/{id}; POST /api/programs/{id}/activate; POST /api/programs/{id}/suspend"
      - "POST /api/departments; POST /api/employees; POST /api/employees/{id}/reinstate"
      - "POST /api/programs/{id}/anniversary-scans"
      - "POST /api/awards/{id}/revoke"
      - "POST /api/abuse-flags; POST /api/abuse-flags/{id}/review; POST /api/abuse-flags/{id}/confirm; POST /api/abuse-flags/{id}/dismiss"
      - "POST /api/vendors/{id}/suspend; POST /api/vendors/{id}/reactivate"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "POST /api/nominations/{id}/approve; POST /api/nominations/{id}/reject; POST /api/nominations/{id}/return-for-revision (shared with Manager; HRAdmin is never scope-limited)"
      - "POST /api/redemption-orders/{id}/cancel (shared with the owning Employee)"
      - "all GET endpoints"

  - name: FinanceAdmin
    description: "Finance operator: owns point budgets and the monthly accrual/chargeback cycle. Segregation of duties: cannot touch payroll compensation or tax-year finalization."
    identity: opaque
    exclusive_operations:
      - "POST /api/budgets; POST /api/budgets/{id}/adjustments"
      - "POST /api/accrual-runs; POST /api/accrual-runs/{id}/reconcile; POST /api/accrual-runs/{id}/close; POST /api/accrual-runs/{id}/void"
    shared_operations:
      - "all GET endpoints"

  - name: PayrollSpecialist
    description: "Payroll/tax operator: owns compensation sync and tax-year finalization. Segregation of duties: cannot create or close accrual runs."
    identity: opaque
    exclusive_operations:
      - "POST /api/employees/{id}/compensation-adjustments"
      - "POST /api/programs/{id}/finalize-tax-year"
    shared_operations:
      - "all GET endpoints"

  - name: Manager
    description: "People manager; is also an Employee. Approves/returns/rejects nominations within their reporting chain and may nominate."
    identity: "entity_backed:Employee"
    exclusive_operations: []
    shared_operations:
      - "POST /api/nominations; POST /api/nominations/{id}/resubmit; POST /api/nominations/{id}/cancel (as nominator; shared with Employee)"
      - "POST /api/nominations/{id}/approve; POST /api/nominations/{id}/reject; POST /api/nominations/{id}/return-for-revision (scope-limited to their chain; shared with HRAdmin)"
      - "all GET endpoints"

  - name: Employee
    description: "Program participant: nominates peers, resubmits/cancels own nominations, redeems points, manages own returns"
    identity: "entity_backed:Employee"
    exclusive_operations:
      - "POST /api/redemption-orders; POST /api/redemption-orders/{id}/request-return"
    shared_operations:
      - "POST /api/nominations; POST /api/nominations/{id}/resubmit; POST /api/nominations/{id}/cancel (own only; shared with Manager)"
      - "POST /api/redemption-orders/{id}/cancel (own only; shared with HRAdmin)"
      - "all GET endpoints"

  - name: VendorOps
    description: "Fulfillment vendor operator: manages vendors and catalog items, advances order fulfillment, completes returns"
    identity: opaque
    exclusive_operations:
      - "POST /api/vendors; POST /api/catalog-items; PATCH /api/catalog-items/{id}"
      - "POST /api/redemption-orders/{id}/submit; POST /api/redemption-orders/{id}/mark-shipped; POST /api/redemption-orders/{id}/mark-delivered; POST /api/redemption-orders/{id}/complete-return"
    shared_operations:
      - "all GET endpoints"
