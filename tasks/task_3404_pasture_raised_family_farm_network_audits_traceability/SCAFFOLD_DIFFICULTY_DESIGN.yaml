              as: PlatformAdmin
            - call: "POST /farm-network/audits/${a_id}/complete"
              payload: { outcome: "PASSED" }
              as: Auditor
              as_user_id: "auditor-a"
            - call: "GET /farm-network/farms/${f_id}"
              as: NetworkManager
              captures: { f_v2: $.data.version }
            - call: "POST /farm-network/farms/${f_id}/contracts"
              payload: { commodity_base_cents_per_dozen: 150, premium_cents_per_dozen: 90, start_date: "2026-09-01", end_date: "2027-08-31", expected_farm_version: "${f_v2}" }
              as: NetworkManager
              captures: { ct_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/activate"
              as: NetworkManager
            - call: "POST /farm-network/retailers"
              payload: { name: "Heartland Grocers", banner: "Heartland", terms_net_days: 60 }
              as: PlatformAdmin
              captures: { r_tailer_id: $.data.id }
            - call: "POST /farm-network/farms/${f_id}/forecasts"
              payload: { week_start: "2026-09-14", season: "AUTUMN", weather_severity: "NONE" }
              as: NetworkManager
            - call: "POST /farm-network/commitments"
              payload: { retailer_id: "${r_tailer_id}", farm_id: "${f_id}", week_start: "2026-09-14", committed_dozens: 40 }
              as: NetworkManager
              captures: { c_id: $.data.id }
            - call: "POST /farm-network/routes"
              payload: { route_date: "2026-09-21", driver_name: "Dale", capacity_cases: 10 }
              as: PlantOperator
              captures: { r_id: $.data.id }
            - call: "POST /farm-network/routes/${r_id}/stops"
              payload: { farm_id: "${f_id}", stop_sequence: 1, planned_cases: 3 }
              as: PlantOperator
            - call: "POST /farm-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /farm-network/farms/${f_id}/incidents"
              payload: { severity: "CRITICAL", incident_type: "PREDATOR_BREACH", description: "coyote breached the perimeter, flock losses" }
