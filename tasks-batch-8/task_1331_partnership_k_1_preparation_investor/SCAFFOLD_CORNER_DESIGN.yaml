              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 5000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { t1: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T2", partner_type: US_ENTITY, partner_class: LIMITED, residency_state: "DE", ownership_pct_bps: 3000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { t2: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T3", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "WA", ownership_pct_bps: 2000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { t3: "$.data.id" }
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${t1}", transferee_partner_id: "${t2}", pct_bps: 100, effective_date: "2025-03-01", settlement_date: "2025-03-05" }
              as: FundTaxAdmin
              captures: { tr1: "$.data.id" }
            - call: "POST /funds/transfers"
              payload: { fund_id: "${f}", transferor_partner_id: "${t3}", transferee_partner_id: "${t2}", pct_bps: 100, effective_date: "2025-04-01", settlement_date: "2025-04-05" }
              as: FundTaxAdmin
              captures: { tr3: "$.data.id" }
          trigger:
            - call: "GET /funds/transfers?transferor_partner_id=${t1}"
              payload: {}
              as: FundTaxAdmin
          assert:
            - "exactly one transfer returned: id == ${tr1}; ${tr3} is excluded"

  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: all_error_codes_triggerable
        claim_type: violation_to_error
        grounds: [errors]
        distinguishing_aspect: "Catalog-wide coverage is realized by the union of difficulty and corner instances: each declared error_id is triggered by at least one named instance (see grounds of each violation_to_error instance)."
        test_recipe:
          setup: ["coverage note instance — no API calls; every error_id maps to a named instance in this file or the difficulty design"]
          setup_api_calls: []
          trigger: []
          assert:
            - "ERR_MISSING_AUTH_CONTEXT -> missing_auth_headers_returns_400; ERR_FORBIDDEN_FOR_ROLE -> rbac section instances; ERR_INVALID_REQUEST -> create_partner_* instances; ERR_NOT_FOUND -> get_nonexistent_partner_returns_not_found / not_found_beats_state_check; ERR_INVALID_STATE_TRANSITION -> close_books_twice / ticket_reopen_from_open / lock_provisional_run_rejected / transfer_confirm_requires_active_partners; ERR_STALE_TAX_YEAR_VERSION -> occ_stale_expected_version_rejected; ERR_SEGREGATION_OF_DUTIES -> three *_sod instances; ERR_FOREIGN_OWNERSHIP_CAP_EXCEEDED -> transfer_confirm_safety_beats_temporal; ERR_TAX_YEAR_WINDOW_CLOSED / ERR_TAX_YEAR_NOT_BOOKS_CLOSED -> transfer_settle_before_settlement_date_rejected / final_run_requires_books_closed_tax_year; ERR_SPECIAL_ALLOCATION_OVERLAP / ERR_TRANSFER_WINDOW_OVERLAP -> Rule-8 instances; ERR_DUPLICATE_* -> three duplicate_* instances; ERR_AMENDMENT_ALREADY_ACTIVE / ERR_K1_ALREADY_GENERATED / ERR_K1_NOT_DELIVERED -> amendment_already_active_rejected / second_k1_generation_rejected / amendment_on_undelivered_k1_returns_k1_not_delivered; ERR_CROSS_FUND_REFERENCE / ERR_SAME_PARTNER_TRANSFER / ERR_REVERSAL_OF_REVERSAL -> cross_fund_capital_event_rejected / same_partner_transfer_rejected / reversal_of_mirror_rejected; ERR_DISTRIBUTION_EXCEEDS_CAPITAL / ERR_REMIT_EXCEEDS_ACCRUED / ERR_INSUFFICIENT_OWNERSHIP -> distribution_exceeding_capital_rejected / remit_exceeding_accrued_rejected / insufficient_ownership_rejected; ERR_ALLOCATION_NOT_LOCKED / ERR_ALLOCATION_STALE -> generation_without_locked_run_rejected / tax_year_approve_with_stale_run_returns_allocation_stale; ERR_SPECIAL_ALLOCATION_OVERFLOW / ERR_APPORTIONMENT_OVERFLOW -> special_allocation_overflow_at_lock / apportionment_overflow_at_capacity_edge; ERR_NO_ALLOCABLE_PARTNERS / ERR_NO_FOREIGN_PARTNERS / ERR_COMPOSITE_PARTNER_INELIGIBLE / ERR_PARTNER_CAPITAL_NOT_ZERO -> close_books_without_partners_rejected / accrual_without_foreign_partners_rejected / composite_file_with_empty_included_set_rejected / withdraw_with_one_cent_balance_rejected"

      - name: insufficient_ownership_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_INSUFFICIENT_OWNERSHIP]"]
        distinguishing_aspect: "pct_bps exceeding the transferor's current ownership by one basis point fails at confirm; equal to current ownership succeeds (inclusive edge)."
        test_recipe:
          setup: ["fund with T1 (6000bps) and T2 (4000bps); PROPOSED transfer of 6001bps and a second of exactly 6000bps"]
          setup_api_calls:
            - call: "POST /funds"
              payload: { legal_name: "Fund ER1", ein: "22-6000001", waterfall_hurdle_rate_bps: 800, waterfall_catchup_bps: 2000, waterfall_carry_bps: 2000, foreign_ownership_cap_pct_bps: 10000, management_fee_rate_bps: 0, fee_discount_threshold_cents: 1, fee_discount_bps: 0 }
              as: FundTaxAdmin
              captures: { f: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T1", partner_type: US_INDIVIDUAL, partner_class: LIMITED, residency_state: "CA", ownership_pct_bps: 6000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
              as: FundTaxAdmin
              captures: { t1: "$.data.id" }
            - call: "POST /funds/partners"
              payload: { fund_id: "${f}", legal_name: "T2", partner_type: US_ENTITY, partner_class: LIMITED, residency_state: "DE", ownership_pct_bps: 4000, capital_commitment_cents: 1, admission_date: "2025-01-01" }
