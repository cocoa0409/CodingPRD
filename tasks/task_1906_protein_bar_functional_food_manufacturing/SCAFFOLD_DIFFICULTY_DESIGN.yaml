      - name: chamber_position_closed_interval_capacity
        grounds:
          - validations[priority=22]
          - entities.ShelfLifeStudy.fields.shelf_position
        distinguishing_aspect: |
          Interval semantics 2 (CLOSED intervals + aggregate capacity 1 per position) on the
          stability chamber resource: a study starting exactly on another's expiry_utc
