            - { call: "POST /routes", payload: { zone_id: "${zone_u}", weekday: "MONDAY", effective_start_date: "2026-05-01", effective_end_date: "2026-10-31", max_stops: 10, max_tonnage_lbs: 100000 }, as: ProgramAdmin, captures: { route_a: $.data.id } }
