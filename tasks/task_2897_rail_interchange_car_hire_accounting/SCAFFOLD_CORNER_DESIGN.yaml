          setup:
            - "CYCLE_1: clock 2026-08-28T00:00:00Z; railroads BN/CX; car type XM; junction JCT-CHI; CX-owned car CX 100001 delivered to BN 2026-08-24T00:00:00Z odo 1000 LOADED and returned 2026-08-28T00:00:00Z odo 1240 LOADED; clock advanced to 2026-09-01T00:00:00Z; cycle (payer BN, payee CX, 2026-08) created and COMPUTED with gross_hire_cents 11464 / clearinghouse_fee_cents 57 / net_settlement_cents 11407."
