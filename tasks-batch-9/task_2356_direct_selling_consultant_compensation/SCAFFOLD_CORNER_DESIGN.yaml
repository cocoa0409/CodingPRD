          - call: "POST /direct-selling/commission-runs/${run_id}/calculate"
            as: CommissionAnalyst
            as_user_id: "ANALYST-1"
          - call: "POST /direct-selling/commission-runs/${run_id}/approval-decision"
            payload: { decision: "APPROVE" }
            as: FinanceController
            as_user_id: "FC-1"
          - call: "POST /direct-selling/commission-runs/${run_id}/pay"
            as: FinanceController
            as_user_id: "FC-1"
