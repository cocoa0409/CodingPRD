# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_2438 — Nursing Licensure & Discipline
#
# Breadth probe over SCAFFOLD.yaml §1.0–§1.7. `section:` values are the nine
# sections of references/claim-extraction-guide.md; `claim_type:` values are the
# per-section rows of that guide's tables. Corners that §1.8 already asserts are
# emitted as `excluded_because:` stubs citing the covering instance by name.
#
# Fixed logical clock default: 2026-08-01T00:00:00Z (POST /_clock/set_current_utc
# is only issued where an instance genuinely needs to move time).
# Board defaults relied on throughout: compact_member false unless passed true,
# ce_hours_required 30.00, practice_hours_required 960, renewal_period_months 24,
# renewal_grace_period_days 60, lapse_after_grace_days 90, audit_sample_rate_bp 500,
# criminal_lookback_years 7, disqualifying_offense_codes ["FEL-A","SEX-1"],
# renewal_base_fee_cents 12000, late_fee_tier1_cents 5000, late_fee_tier2_cents 12000,
# phi_authorization_required true, max_concurrent_custodian_holds 2,
# monitoring_clearance_gap_days 90, revocation_vote_threshold_bp 6667,
# majority_vote_threshold_bp 5001.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: create_state_board_config_returns_201_with_envelope_and_system_fields
        claim_type: creation
        grounds:
          - entities.StateBoardConfig
          - endpoints.POST /state-board-configs
          - response_envelope.success
        distinguishing_aspect: "A create returns 201 with the §1.0 success envelope (meta.api_request_id, meta.api_request_timestamp, response_type object, data payload), every submitted field echoed, and the four common fields minted server-side with version exactly 1."
        test_recipe:
          setup:
            - "The database is empty; no StateBoardConfig row exists."
          setup_api_calls: []
          trigger:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          assert:
            - "HTTP status is 201 and response_type == object"
            - "meta.api_request_id and meta.api_request_timestamp are both present"
            - "data.state_code == OH and data.board_name == Ohio Board of Nursing and data.compact_member == true"
            - "data.status == ACTIVE"
            - "data.version == 1"
            - "${board_id} is a bare UUID with no type prefix, and data.created_at == data.updated_at in ISO 8601 UTC with three fractional digits"

      - name: state_board_config_defaults_applied_when_every_optional_is_omitted
        claim_type: defaults
        grounds:
          - entities.StateBoardConfig.fields.ce_hours_required
          - entities.StateBoardConfig.fields.disqualifying_offense_codes
          - entities.StateBoardConfig.fields.compact_member
        distinguishing_aspect: "Only the two required inputs are supplied, so all 23 optional configuration knobs must materialise at their declared defaults — including compact_member false (NOT true) and the two-code disqualifying-offence list."
        test_recipe:
          setup:
            - "The database is empty."
          setup_api_calls: []
          trigger:
            - call: "POST /state-board-configs"
              payload: { state_code: "MI", board_name: "Michigan Board of Nursing" }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          assert:
            - "data.compact_member == false"
            - "data.ce_hours_required == 30.00 and data.ce_self_study_cap_hours == 12.00 and data.ce_in_service_cap_hours == 4.00 and data.ce_carry_over_cap_hours == 5.00"
            - "data.practice_hours_required == 960 and data.practice_lookback_months == 60"
            - "data.renewal_period_months == 24 and data.renewal_grace_period_days == 60 and data.lapse_after_grace_days == 90"
            - "data.audit_sample_rate_bp == 500 and data.criminal_lookback_years == 7"
            - "data.disqualifying_offense_codes == [FEL-A, SEX-1]"
            - "data.renewal_base_fee_cents == 12000 and data.late_fee_tier1_cents == 5000 and data.late_fee_tier2_cents == 12000 and data.reinstatement_fee_cents == 25000 and data.failed_audit_surcharge_cents == 2500"
            - "data.phi_authorization_required == true and data.max_concurrent_custodian_holds == 2 and data.monitoring_clearance_gap_days == 90"
            - "data.revocation_vote_threshold_bp == 6667 and data.majority_vote_threshold_bp == 5001"
            - "data.status == ACTIVE"

      - name: get_education_program_returns_the_stored_representation
        claim_type: retrieval
        grounds:
          - endpoints.GET /education-programs/{id}
          - entities.EducationProgram.fields.approval_status
        distinguishing_aspect: "A read-back returns exactly what the create persisted, including the system-assigned approval_status default APPROVED, and does not bump version."
        test_recipe:
          setup:
            - "Board OH exists and program OH-BSN-01 was created with degree_level BSN, nclex_first_time_pass_rate_bp 8800 and approval_expires_on 2032-01-01."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /education-programs/${prog_id}"
              payload: {}
              as: LicensureAnalyst
              captures: { got_id: $.data.id, got_version: $.data.version }
          assert:
            - "HTTP status is 200 and ${got_id} == ${prog_id}"
            - "data.state_board_config_id == ${board_id} and data.program_code == OH-BSN-01 and data.degree_level == BSN"
            - "data.nclex_first_time_pass_rate_bp == 8800 and data.approval_expires_on == 2032-01-01T00:00:00Z"
            - "data.approval_status == APPROVED"
            - "${got_version} == 1 — a GET is not a mutation"

      - name: list_education_programs_under_board_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET /state-board-configs/{id}/education-programs
          - response_envelope.pagination_fields
        distinguishing_aspect: "With three child programs and limit 2, the first page carries total_count 3 / has_more true / two items and the second page carries has_more false / one item, so total_count counts the filtered set rather than the returned page."
        test_recipe:
          setup:
            - "Board OH exists with exactly three education programs: OH-PN-01, OH-ADN-01 and OH-BSN-01, created in that order."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-PN-01", program_name: "Buckeye PN", degree_level: "PN", nclex_first_time_pass_rate_bp: 7800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-ADN-01", program_name: "Buckeye ADN", degree_level: "ADN", nclex_first_time_pass_rate_bp: 8400, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { p3_id: $.data.id }
          trigger:
            - call: "GET /state-board-configs/${board_id}/education-programs"
              payload: { limit: 2, offset: 0 }
              as: SystemAdmin
              captures: { first_id: "$.data[0].id" }
            - call: "GET /state-board-configs/${board_id}/education-programs"
              payload: { limit: 2, offset: 2 }
              as: SystemAdmin
              captures: { third_id: "$.data[0].id" }
          assert:
            - "the first response has HTTP 200, response_type == array, total_count == 3, has_more == true, limit == 2, offset == 0 and exactly 2 items"
            - "the second response has total_count == 3, has_more == false, offset == 2 and exactly 1 item"
            - "${first_id} == ${p1_id} and ${third_id} == ${p3_id} — created_at ASC ordering, never id ordering"
            - "filtering by degree_level BSN returns total_count 1 containing only ${p3_id}"

      - name: get_nurse_with_unknown_uuid_returns_nurse_not_found
        claim_type: not_found
        grounds:
          - errors.ERR_NURSE_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but absent UUID on a single-resource GET yields the entity's own 404 code, not a generic 404 and not ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Board OH exists but no Nurse row has ever been created."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          trigger:
            - call: "GET /nurses/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err} == ERR_NURSE_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"

      - name: create_education_program_missing_degree_level_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.EducationProgram.fields.degree_level
          - validations[priority=6]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "degree_level is a required input with no default, so omitting it is a 400 at priority 6 and no EducationProgram row is written."
        test_recipe:
          setup:
            - "Board OH exists."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          trigger:
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /state-board-configs/${board_id}/education-programs returns total_count == 0"

      - name: create_nurse_without_residency_evidence_defaults_to_empty_array
        claim_type: defaults
        grounds:
          - entities.Nurse.fields.residency_evidence
          - entities.Nurse.fields.status
          - entities.Nurse.fields.fee_credit_cents
        distinguishing_aspect: "Omitting the optional residency_evidence array yields [] rather than null, and every computed counter on Nurse starts at its declared zero/ACTIVE default."
        test_recipe:
          setup:
            - "Board OH exists."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          trigger:
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
          assert:
            - "HTTP status is 201 and data.residency_evidence == [] (an empty array, not null)"
            - "data.status == ACTIVE"
            - "data.fee_credit_cents == 0 and data.fee_paid_total_cents == 0"
            - "data.prior_discipline_count == 0 and data.atd_participation_count == 0"
            - "data.version == 1"

      - name: license_application_computed_status_extra_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.LicenseApplication.fields.status
          - entities.LicenseApplication.fields.deficiency_cycle_count
          - entities.LicenseApplication.fields.board_decision
        distinguishing_aspect: "status, deficiency_cycle_count and board_decision are server-owned; supplying them in the create body must not move the application off DRAFT / 0 / NONE."
        test_recipe:
          setup:
            - "Board OH and an approved BSN program exist, and nurse Dana Reed is registered."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
          trigger:
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS", status: "APPROVED", deficiency_cycle_count: 9, board_decision: "APPROVED_UNCONDITIONAL" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
          assert:
            - "HTTP status is 201 and data.status == DRAFT — the submitted APPROVED was ignored"
            - "data.deficiency_cycle_count == 0 and data.board_decision == NONE"
            - "data.screening_status == NOT_ORDERED and data.screening_offense_records == []"
            - "data.submitted_at is null and data.decided_at is null"
            - "data.prior_license_verified == false and data.nclex_result == PASS"

      - name: nurse_system_fields_are_server_minted_extra_field_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Nurse
          - endpoints.POST /nurses
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server; client-supplied values for them are discarded, so the returned id is not the submitted sentinel and version is 1 rather than 42."
        test_recipe:
          setup:
            - "Board OH exists."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          trigger:
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Kai Moreno", birth_year: 1990, ssn_last4: "7712", declared_primary_state: "OH", id: "11111111-1111-4111-8111-111111111111", version: 42, created_at: "1999-01-01T00:00:00.000Z" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
          assert:
            - "HTTP status is 201 and ${nurse_id} != 11111111-1111-4111-8111-111111111111"
            - "data.version == 1"
            - "data.created_at == 2026-08-01T00:00:00.000Z, the logical clock, not 1999-01-01"
            - "data.updated_at == data.created_at"

      - name: create_license_application_with_invalid_pathway_enum_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.LicenseApplication.fields.pathway
          - validations[priority=6]
        distinguishing_aspect: "pathway is constrained to EXAMINATION | ENDORSEMENT; a third value is a 400 at priority 6 and never a 422 business error."
        test_recipe:
          setup:
            - "Board OH, an approved BSN program and nurse Dana Reed exist."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
          trigger:
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "RECIPROCITY", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "GET /license-applications with nurse_id ${nurse_id} returns total_count == 0"

      - name: create_evidence_request_with_hold_end_before_start_returns_invalid_request
        claim_type: type_constraints
        grounds:
          - entities.EvidenceRequest.fields.hold_start_at
          - entities.EvidenceRequest.fields.hold_end_at
          - validations[priority=6]
        distinguishing_aspect: "The hold window must be well-formed before any interval arithmetic runs, so hold_end_at <= hold_start_at is a 400 at priority 6 rather than an ERR_CUSTODIAN_HOLD_CAPACITY 409 at priority 20."
        test_recipe:
          setup:
            - "An RN license exists and a PRACTICE_STANDARD complaint listing custodian MERCY-GEN is INVESTIGATION_OPEN."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "${board_id}", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { app_id: $.data.id }
            - call: "POST /license-applications/${app_id}/submit"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/qualification-verification"
              payload: {}
              as: LicensureAnalyst
            - call: "POST /license-applications/${app_id}/screening-result"
              payload: { screening_offense_records: [] }
              as: LicensureAnalyst
            - call: "POST /licenses"
              payload: { source_application_id: "${app_id}" }
              as: LicensureAnalyst
              captures: { lic_id: $.data.id }
            - call: "POST /complaints"
              payload: { license_id: "${lic_id}", complainant_type: "PATIENT", violation_category: "PRACTICE_STANDARD", incident_date: "2026-07-02T00:00:00Z", employer_custodian_codes: ["MERCY-GEN"] }
              as: Investigator
              as_user_id: "inv-c1"
              captures: { comp_id: $.data.id }
            - call: "POST /complaints/${comp_id}/triage"
              payload: { jurisdiction_finding: "JURISDICTION_CONFIRMED" }
              as: Investigator
              as_user_id: "inv-c1"
            - call: "POST /complaints/${comp_id}/investigation"
              payload: {}
              as: Investigator
              as_user_id: "inv-c1"
          trigger:
            - call: "POST /complaints/${comp_id}/evidence-requests"
              payload: { record_class: "EMPLOYER_PERSONNEL", custodian_code: "MERCY-GEN", hold_start_at: "2026-09-05T00:00:00Z", hold_end_at: "2026-08-05T00:00:00Z" }
              as: Investigator
              as_user_id: "inv-c1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 400 and ${err} == ERR_INVALID_REQUEST"
            - "${err} != ERR_CUSTODIAN_HOLD_CAPACITY"
            - "GET /complaints/${comp_id}/evidence-requests returns total_count == 0"

      - name: create_license_application_with_unknown_board_config_id_returns_board_config_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors.ERR_BOARD_CONFIG_NOT_FOUND
          - entities.LicenseApplication.fields.board_config_id
        distinguishing_aspect: "A body foreign key that names no existing row is a 404 with the referenced entity's own code at priority 4, ahead of every business rule, and the flat topology means the check is on the FK value rather than on a URL segment."
        test_recipe:
          setup:
            - "Board OH, an approved BSN program and nurse Dana Reed exist; the board_config_id used in the trigger belongs to no row."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
            - call: "POST /education-programs"
              payload: { state_board_config_id: "${board_id}", program_code: "OH-BSN-01", program_name: "Buckeye BSN", degree_level: "BSN", nclex_first_time_pass_rate_bp: 8800, approval_expires_on: "2032-01-01T00:00:00Z" }
              as: SystemAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /nurses"
              payload: { home_board_config_id: "${board_id}", full_name: "Dana Reed", birth_year: 1988, ssn_last4: "4417", declared_primary_state: "OH" }
              as: LicensureAnalyst
              captures: { nurse_id: $.data.id }
          trigger:
            - call: "POST /license-applications"
              payload: { nurse_id: "${nurse_id}", board_config_id: "00000000-0000-4000-8000-0000000000ff", pathway: "EXAMINATION", credential_type: "RN", education_program_id: "${prog_id}", nclex_result: "PASS" }
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 404 and ${err} == ERR_BOARD_CONFIG_NOT_FOUND"
            - "GET /license-applications with nurse_id ${nurse_id} returns total_count == 0"

      - name: create_ce_record_under_unknown_renewal_returns_renewal_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=3]
          - errors.ERR_RENEWAL_NOT_FOUND
          - endpoints.POST /renewal-applications/{id}/ce-records
        distinguishing_aspect: "The path-segment parent is resolved before the body is validated, so a well-formed CE payload under an absent renewal id returns ERR_RENEWAL_NOT_FOUND rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Board OH exists; no RenewalApplication row has ever been created."
          setup_api_calls:
            - call: "POST /state-board-configs"
              payload: { state_code: "OH", board_name: "Ohio Board of Nursing", compact_member: true }
              as: SystemAdmin
              captures: { board_id: $.data.id }
          trigger:
            - call: "POST /renewal-applications/00000000-0000-4000-8000-0000000000aa/ce-records"
              payload: { provider_code: "OHNA-100", provider_accredited: true, category: "LIVE_CONTACT", minutes: 600, completion_date: "2027-03-15T00:00:00Z" }
              as: LicensureAnalyst
              captures: { err: $.data.error_id }
