              captures: { kit_id: "$.data.id" }
          trigger:
            - call: "POST /cbb/enrollments/${enr_id}/consent-amendment"
              payload: { amendment_reason_code: "RESEARCH_OPT_IN" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "GET /cbb/collection-kits/${kit_id}"
              as: IntakeCoordinator
              as_user_id: "ic-001"
            - call: "POST /cbb/enrollments/${enr_id}/consent"
              payload: { consent_document_hash: "hash-bbb" }
              as: ParentGuardian
              as_user_id: "${enr_id}"
            - call: "GET /cbb/collection-kits/${kit_id}"
              as: IntakeCoordinator
              as_user_id: "ic-001"
          assert:
            - "after the amendment: enrollment consent_status == AMENDMENT_PENDING, consent_amendment_count == 1, consent_version still 1, lifecycle_status still KIT_DISPATCHED"
            - "first kit read: status == HELD and hold_reason_code == CONSENT_AMENDMENT_PENDING"
            - "after the re-consent: consent_status == CONSENTED, consent_version == 2, consent_amendment_count == 1 (the counter does not decrement)"
            - "second kit read: status == DISPATCHED, hold_reason_code == null, expires_at unchanged at 2026-11-29T00:00:00Z (the hold does not extend shelf life)"

      - name: corner_cryopreserve_from_processing_status_received_is_rejected
        claim_type: invalid_transitions
