scaffold_difficulty_design:

  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: fee_as_filed_vs_as_audited_divergence
        grounds:
          - calculations.franchise_fee_due
          - state_machines.Audit.OPEN_to_COMPLETED_FINDING
          - entities.RevenueReport.fields.fee_basis
        distinguishing_aspect: "On the revenue-accounting domain (RevenueReport): the same report yields fee_due 9169 as_filed and 10169 as_audited after an audit finding, a different value for identical line items."
        test_recipe:
          setup:
            - "ACTIVE franchise (homes_in_territory 10000, fee_rate_pct 0.05); one RevenueReport filed with gross 100010/50010/33330 (fee_due 9169 as_filed), ACCEPTED then PAID 9169; logical clock at 2026-07-09; an OPEN audit targeting that report (report now UNDER_AUDIT)."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9169 }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-09T00:00:00Z" }
              as: FranchiseAuthority
            - call: "POST /audits"
              payload: { franchise_id: "${fr_id}", target_report_id: "${rr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31" }
              as: FranchiseAuthority
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /audits/${au_id}/finalize"
              payload: { finding: "FINDING", audited_gross_residential_cents: 120010, audited_gross_commercial_cents: 50010, audited_gross_advertising_cents: 33330 }
              as: FranchiseAuthority
              as_user_id: "authority-lead"
          assert:
            - "RevenueReport.${rr_id}.fee_due_cents == 10169"
            - "RevenueReport.${rr_id}.fee_basis == AS_AUDITED"
            - "RevenueReport.${rr_id}.status == ADJUSTED"

      - name: buildout_provisional_vs_final_damage_divergence
        grounds:
          - calculations.buildout_liquidated_damages
          - state_machines.BuildoutMilestone.PENDING_to_MISSED
          - entities.BuildoutMilestone.fields.provisional_damage_cents
        distinguishing_aspect: "On the build-out domain (BuildoutMilestone): provisional damages 2500000 (interim, homes_passed 5000) diverge from final damages 500000 (deadline, homes_passed 5800) for the same milestone — a different entity than the fee dual-variant."
        test_recipe:
          setup:
            - "ACTIVE franchise (homes_in_territory 10000); one BuildoutMilestone required_pct 0.60 (required_homes 6000), deadline 2026-08-01; clock at startup default 2026-05-01 (< deadline)."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /buildout-milestones"
              payload: { franchise_id: "${fr_id}", label: "Y2 density", deadline_date: "2026-08-01", required_pct: 0.60 }
              as: FranchiseAuthority
              captures: { ms_id: $.data.id }
          trigger:
            - call: "POST /buildout-milestones/${ms_id}/certify"
              payload: { homes_passed: 5000 }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: FranchiseAuthority
            - call: "POST /buildout-milestones/${ms_id}/certify"
              payload: { homes_passed: 5800 }
              as: Operator
              as_user_id: "${fr_id}"
          assert:
            - "BuildoutMilestone.${ms_id}.provisional_damage_cents == 2500000"
            - "BuildoutMilestone.${ms_id}.final_damage_cents == 500000"
            - "BuildoutMilestone.${ms_id}.status == MISSED"

  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: assessment_tiered_penalty_plus_interest_mode_a
        grounds:
          - calculations.audit_underpayment_assessment
          - state_machines.Audit.OPEN_to_COMPLETED_FINDING
          - entities.Assessment.fields.total_cents
        distinguishing_aspect: "Mode (a): total = principal 1000 + simple interest (1000*0.0005*100 days = 50) + tiered penalty (underpayment 10.9% >= 0.10 tier -> 0.15*1000 = 150, under cap) = 1200; >=3 inputs with tier selection, a min cap, and per-day interest."
        test_recipe:
          setup:
            - "Same as fee_as_filed_vs_as_audited_divergence up to the OPEN audit: ACTIVE franchise, report gross 100010/50010/33330 PAID 9169, clock 2026-07-09, OPEN audit on the report."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9169 }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-09T00:00:00Z" }
              as: FranchiseAuthority
            - call: "POST /audits"
              payload: { franchise_id: "${fr_id}", target_report_id: "${rr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31" }
              as: FranchiseAuthority
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /audits/${au_id}/finalize"
              payload: { finding: "FINDING", audited_gross_residential_cents: 120010, audited_gross_commercial_cents: 50010, audited_gross_advertising_cents: 33330 }
              as: FranchiseAuthority
              as_user_id: "authority-lead"
            - call: "GET /audits/${au_id}/assessments"
              payload: {}
              as: FranchiseAuthority
              captures: { as_id: "$.data[0].id" }
          assert:
            - "Assessment.${as_id}.principal_cents == 1000"
            - "Assessment.${as_id}.interest_cents == 50"
            - "Assessment.${as_id}.penalty_cents == 150"
            - "Assessment.${as_id}.days_late == 100"
            - "Assessment.${as_id}.total_cents == 1200"

      - name: franchise_fee_round_per_line_then_sum_mode_b
        grounds:
          - calculations.franchise_fee_due
          - state_machines.RevenueReport.FILED
          - entities.RevenueReport.fields.fee_due_cents
        distinguishing_aspect: "Mode (b): rounding order is pinned round-per-line-item-then-sum, giving 5001+2501+1667 = 9169, which differs from the sum-then-round value 9168 for the same three gross figures."
        test_recipe:
          setup:
            - "ACTIVE franchise fee_rate_pct 0.05."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
          assert:
            - "RevenueReport.${rr_id}.fee_due_cents == 9169"
            - "RevenueReport.${rr_id}.fee_basis == AS_FILED"

  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: complaint_resolve_reopen_cycle
        grounds:
          - state_machines.Complaint.RESOLVED_to_REOPENED
          - state_machines.Complaint.REOPENED_to_RESOLVED
          - entities.Complaint.fields.status
        distinguishing_aspect: "Complaint is cyclic: RESOLVED -> REOPENED -> RESOLVED revisits the RESOLVED state, incrementing version each hop; not a forward-only pipeline."
        test_recipe:
          setup:
            - "ACTIVE franchise; one OPEN complaint filed by Resident res-1."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /complaints"
              payload: { franchise_id: "${fr_id}", category: "BILLING", description: "Overcharged on last bill" }
              as: Resident
              as_user_id: "res-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /complaints/${c_id}/resolve"
              payload: { resolution_note: "Credit applied" }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /complaints/${c_id}/reopen"
              payload: {}
              as: Resident
              as_user_id: "res-1"
            - call: "POST /complaints/${c_id}/resolve"
              payload: { resolution_note: "Credit re-applied and confirmed" }
              as: Operator
              as_user_id: "${fr_id}"
          assert:
            - "Complaint.${c_id}.status == RESOLVED"
            - "Complaint.${c_id}.version == 4"

      - name: application_approve_transfer_branch_side_effects
        grounds:
          - state_machines.FranchiseApplication.SUBMITTED_to_APPROVED
          - state_machines.Franchise.lifecycle_ACTIVE_to_TRANSFERRED
          - entities.Franchise.fields.operator_name
        distinguishing_aspect: "FranchiseApplication branches SUBMITTED -> {APPROVED, DENIED, DEEMED_APPROVED}; the APPROVE-TRANSFER branch uniquely sets Franchise.lifecycle_status TRANSFERRED and rewrites operator_name to the transferee, side-effects absent from the DENY and RENEWAL branches."
        test_recipe:
          setup:
            - "ACTIVE franchise (version 2 after activate); a SUBMITTED TRANSFER application to transferee NewCo."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", transferee_name: "NewCo", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /franchise-applications/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: FranchiseAuthority
          assert:
            - "FranchiseApplication.${app_id}.status == APPROVED"
            - "Franchise.${fr_id}.lifecycle_status == TRANSFERRED"
            - "Franchise.${fr_id}.operator_name == NewCo"

  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: audit_finding_depth3_cascade
        grounds:
          - state_machines.Audit.OPEN_to_COMPLETED_FINDING
          - state_machines.RevenueReport.UNDER_AUDIT_to_ADJUSTED
          - state_machines.Franchise.compliance_to_IN_VIOLATION
        distinguishing_aspect: "Depth-3 chain from audit finalize: Audit->Assessment(ISSUED) [hop1] whose issuance drives RevenueReport UNDER_AUDIT->ADJUSTED [hop2] which drives Franchise compliance COMPLIANT->IN_VIOLATION [hop3]; each hop is caused by the prior one."
        test_recipe:
          setup:
            - "ACTIVE franchise; report gross 100010/50010/33330 PAID 9169; clock 2026-07-09; OPEN audit on the report."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9169 }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-09T00:00:00Z" }
              as: FranchiseAuthority
            - call: "POST /audits"
              payload: { franchise_id: "${fr_id}", target_report_id: "${rr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31" }
              as: FranchiseAuthority
              captures: { au_id: $.data.id }
          trigger:
            - call: "POST /audits/${au_id}/finalize"
              payload: { finding: "FINDING", audited_gross_residential_cents: 120010, audited_gross_commercial_cents: 50010, audited_gross_advertising_cents: 33330 }
              as: FranchiseAuthority
              as_user_id: "authority-lead"
            - call: "GET /audits/${au_id}/assessments"
              payload: {}
              as: FranchiseAuthority
              captures: { as_id: "$.data[0].id" }
          assert:
            - "Assessment.${as_id}.status == ISSUED"
            - "RevenueReport.${rr_id}.status == ADJUSTED"
            - "Franchise.${fr_id}.compliance_status == IN_VIOLATION"

      - name: complaint_escalation_depth2_cascade
        grounds:
          - state_machines.Complaint.OPEN_to_ESCALATED
          - state_machines.Franchise.compliance_to_IN_VIOLATION
          - state_machines.FranchiseApplication.SUBMITTED_to_HELD
        distinguishing_aspect: "Depth-2 chain from complaint escalate: Complaint->Franchise (unresolved_complaint_count reaches ESCALATION_VIOLATION_THRESHOLD 2, compliance IN_VIOLATION) [hop1] -> FranchiseApplication SUBMITTED->HELD [hop2]; different originating trigger than the audit cascade."
        test_recipe:
          setup:
            - "ACTIVE franchise; a SUBMITTED TRANSFER application; two SERVICE_INTERRUPTION complaints filed at clock 2026-05-01 (SLA 24h, deadline 2026-05-02); clock advanced to 2026-05-03; complaint #1 already ESCALATED (count 1)."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "TRANSFER", transferee_name: "NewCo", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_id: $.data.id }
            - call: "POST /complaints"
              payload: { franchise_id: "${fr_id}", category: "SERVICE_INTERRUPTION", description: "Outage block A" }
              as: Resident
              as_user_id: "res-1"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints"
              payload: { franchise_id: "${fr_id}", category: "SERVICE_INTERRUPTION", description: "Outage block B" }
              as: Resident
              as_user_id: "res-2"
              captures: { c2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-03T00:00:00Z" }
              as: FranchiseAuthority
            - call: "POST /complaints/${c1_id}/escalate"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /complaints/${c2_id}/escalate"
              payload: {}
              as: FranchiseAuthority
          assert:
            - "Franchise.${fr_id}.unresolved_complaint_count == 2"
            - "Franchise.${fr_id}.compliance_status == IN_VIOLATION"
            - "FranchiseApplication.${app_id}.status == HELD"

  # =================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pay_paid_report_state_beats_fiscal
        grounds:
          - validations[priority=45]
          - validations[priority=65]
          - state_machines.RevenueReport.ACCEPTED_to_PAID
        distinguishing_aspect: "Dual failure on POST /revenue-reports/{id}/pay of an already-PAID report with a wrong amount: state (priority 45, ERR_INVALID_STATE) is returned, not business_fiscal (priority 65, ERR_PAYMENT_AMOUNT_MISMATCH)."
        test_recipe:
          setup:
            - "ACTIVE franchise; report gross 100010/50010/33330 (fee_due 9169), ACCEPTED then PAID 9169 (status PAID)."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9169 }
              as: Operator
              as_user_id: "${fr_id}"
          trigger:
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 1 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_INVALID_STATE"
            - "response.status == 409"

      - name: rowpermit_inactive_franchise_referential_beats_temporal
        grounds:
          - validations[priority=50]
          - validations[priority=60]
          - calculations.row_permit_window_overlap
        distinguishing_aspect: "Dual failure on POST /row-permits when the franchise is REVOKED and the window also overlaps an existing permit: business_referential (priority 50, ERR_FRANCHISE_NOT_ACTIVE) wins over business_temporal (priority 60, ERR_PERMIT_WINDOW_OVERLAP) — a different category pair than {state, business_fiscal}."
        test_recipe:
          setup:
            - "Franchise activated, a RowSegment, one REQUESTED permit on it for [2026-06-01T00:00Z, 2026-06-02T00:00Z); then the franchise is REVOKED."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /row-segments"
              payload: { name: "Main St 100-400", length_miles: 0.4, homes_along: 120 }
              as: FranchiseAuthority
              captures: { seg_id: $.data.id }
            - call: "POST /row-permits"
              payload: { franchise_id: "${fr_id}", row_segment_id: "${seg_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z", purpose: "conduit" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { p1_id: $.data.id }
            - call: "POST /franchises/${fr_id}/revoke"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /row-permits"
              payload: { franchise_id: "${fr_id}", row_segment_id: "${seg_id}", window_start: "2026-06-01T12:00:00Z", window_end: "2026-06-01T18:00:00Z", purpose: "aerial" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FRANCHISE_NOT_ACTIVE"
            - "response.status == 409"

  # =================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: buildout_met_at_exact_required_pct
        grounds:
          - calculations.buildout_liquidated_damages
          - state_machines.BuildoutMilestone.PENDING_to_MET
          - entities.BuildoutMilestone.fields.status
        distinguishing_aspect: "Percentage boundary with '>=': homes_passed 6000 of 10000 == required_pct 0.60 exactly certifies MET with final_damage 0 (not MISSED); reached through POST /buildout-milestones/{id}/certify."
        test_recipe:
          setup:
            - "ACTIVE franchise (homes_in_territory 10000); milestone required_pct 0.60 deadline 2026-08-01; clock at/after deadline (2026-08-15) so the certify is final."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /buildout-milestones"
              payload: { franchise_id: "${fr_id}", label: "Y2 density", deadline_date: "2026-08-01", required_pct: 0.60 }
              as: FranchiseAuthority
              captures: { ms_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: FranchiseAuthority
          trigger:
            - call: "POST /buildout-milestones/${ms_id}/certify"
              payload: { homes_passed: 6000 }
              as: Operator
              as_user_id: "${fr_id}"
          assert:
            - "BuildoutMilestone.${ms_id}.status == MET"
            - "BuildoutMilestone.${ms_id}.final_damage_cents == 0"

      - name: complaint_escalate_at_exact_deadline_refused
        grounds:
          - validations[priority=55]
          - calculations.complaint_sla_deadline
          - state_machines.Complaint.OPEN_to_ESCALATED
        distinguishing_aspect: "Time boundary with strict '>': at current_clock exactly equal to sla_deadline (2026-05-02T00:00:00Z) escalation is refused with ERR_SLA_NOT_BREACHED; a different metric (wall-time) and endpoint than the percentage boundary."
        test_recipe:
          setup:
            - "ACTIVE franchise; a SERVICE_INTERRUPTION complaint filed at clock 2026-05-01 (sla_deadline 2026-05-02T00:00:00Z); clock set exactly to 2026-05-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /complaints"
              payload: { franchise_id: "${fr_id}", category: "SERVICE_INTERRUPTION", description: "No service since morning" }
              as: Resident
              as_user_id: "res-1"
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: FranchiseAuthority
          trigger:
            - call: "POST /complaints/${c_id}/escalate"
              payload: {}
              as: FranchiseAuthority
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_SLA_NOT_BREACHED"
            - "response.status == 409"

  # =================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: rowpermit_approve_requires_franchise_active
        grounds:
          - state_machines.RowPermit.REQUESTED_to_APPROVED
          - validations[priority=50]
          - entities.Franchise.fields.lifecycle_status
        distinguishing_aspect: "RowPermit's REQUESTED->APPROVED transition is gated by Franchise.lifecycle_status == ACTIVE; after the franchise is REVOKED, approve is refused (pair RowPermit<-Franchise)."
        test_recipe:
          setup:
            - "ACTIVE franchise; RowSegment; one REQUESTED permit; then franchise REVOKED."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /row-segments"
              payload: { name: "Elm Ave", length_miles: 0.3, homes_along: 80 }
              as: FranchiseAuthority
              captures: { seg_id: $.data.id }
            - call: "POST /row-permits"
              payload: { franchise_id: "${fr_id}", row_segment_id: "${seg_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z", purpose: "conduit" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { p_id: $.data.id }
            - call: "POST /franchises/${fr_id}/revoke"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /row-permits/${p_id}/decide"
              payload: { decision: "APPROVE" }
              as: FranchiseAuthority
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_FRANCHISE_NOT_ACTIVE"
            - "RowPermit.${p_id}.status == REQUESTED"

      - name: renewal_approve_requires_milestones_met
        grounds:
          - state_machines.FranchiseApplication.SUBMITTED_to_APPROVED
          - validations[priority=58]
          - entities.BuildoutMilestone.fields.status
        distinguishing_aspect: "A RENEWAL application's approve is gated by every BuildoutMilestone status == MET; with a PENDING milestone the approve is refused with ERR_MILESTONES_NOT_MET (pair FranchiseApplication<-BuildoutMilestone), a different entity pair than RowPermit<-Franchise."
        test_recipe:
          setup:
            - "ACTIVE franchise; one PENDING BuildoutMilestone; a SUBMITTED RENEWAL application (franchise RENEWAL_PENDING)."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
              captures: { fr_v1: $.data.version }
            - call: "POST /buildout-milestones"
              payload: { franchise_id: "${fr_id}", label: "Y2 density", deadline_date: "2026-08-01", required_pct: 0.60 }
              as: FranchiseAuthority
            - call: "POST /franchise-applications"
              payload: { franchise_id: "${fr_id}", application_type: "RENEWAL", proposed_term_end_date: "2040-01-01", expected_franchise_version: "${fr_v1}" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { app_id: $.data.id }
          trigger:
            - call: "POST /franchise-applications/${app_id}/decide"
              payload: { decision: "APPROVE" }
              as: FranchiseAuthority
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_MILESTONES_NOT_MET"
            - "FranchiseApplication.${app_id}.status == SUBMITTED"

  # =================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rowpermit_window_overlap_within_buffer
        grounds:
          - calculations.row_permit_window_overlap
          - validations[priority=60]
          - entities.RowPermit.fields.window_start
        distinguishing_aspect: "Half-open [start,end) windows on a RowSegment require a >= 24h (PERMIT_BUFFER_HOURS) gap; a new window starting only 12h after an existing permit's end collides -> ERR_PERMIT_WINDOW_OVERLAP."
        test_recipe:
          setup:
            - "ACTIVE franchise; RowSegment; one REQUESTED permit for [2026-06-01T00:00Z, 2026-06-02T00:00Z)."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /row-segments"
              payload: { name: "Oak Blvd", length_miles: 0.5, homes_along: 140 }
              as: FranchiseAuthority
              captures: { seg_id: $.data.id }
            - call: "POST /row-permits"
              payload: { franchise_id: "${fr_id}", row_segment_id: "${seg_id}", window_start: "2026-06-01T00:00:00Z", window_end: "2026-06-02T00:00:00Z", purpose: "conduit" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /row-permits"
              payload: { franchise_id: "${fr_id}", row_segment_id: "${seg_id}", window_start: "2026-06-02T12:00:00Z", window_end: "2026-06-03T00:00:00Z", purpose: "aerial" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_PERMIT_WINDOW_OVERLAP"
            - "response.status == 409"

      - name: audit_period_closed_interval_shared_endpoint_overlap
        grounds:
          - calculations.audit_period_overlap
          - validations[priority=61]
          - entities.Audit.fields.period_start_date
        distinguishing_aspect: "Closed date intervals on a Franchise with NO buffer: a second audit period [2026-03-31, 2026-06-30] sharing only the endpoint 2026-03-31 with an existing audit period [2026-01-01, 2026-03-31] overlaps -> ERR_AUDIT_PERIOD_OVERLAP; different interval semantics/resource than the half-open+buffer permit rule."
        test_recipe:
          setup:
            - "ACTIVE franchise; two ACCEPTED reports (Q1 and Q2); an OPEN audit over [2026-01-01, 2026-03-31] targeting the Q1 report."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100000, commercial_gross_cents: 40000, advertising_gross_cents: 20000 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr1_id: $.data.id }
            - call: "POST /revenue-reports/${rr1_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-04-01", period_end_date: "2026-06-30", residential_gross_cents: 110000, commercial_gross_cents: 45000, advertising_gross_cents: 22000 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr2_id: $.data.id }
            - call: "POST /revenue-reports/${rr2_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /audits"
              payload: { franchise_id: "${fr_id}", target_report_id: "${rr1_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31" }
              as: FranchiseAuthority
              captures: { au1_id: $.data.id }
          trigger:
            - call: "POST /audits"
              payload: { franchise_id: "${fr_id}", target_report_id: "${rr2_id}", period_start_date: "2026-03-31", period_end_date: "2026-06-30" }
              as: FranchiseAuthority
              captures: { err_id: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_AUDIT_PERIOD_OVERLAP"
            - "response.status == 409"

  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: assessment_issue_then_waive_conserves_total_owed
        grounds:
          - calculations.franchise_total_owed
          - state_machines.Audit.OPEN_to_COMPLETED_FINDING
          - state_machines.Assessment.ISSUED_to_WAIVED
        distinguishing_aspect: "Conserved quantity total_owed_cents (money owed): finalize-with-finding adds the 1200 assessment to owed; waiving it removes exactly 1200; Franchise.total_owed_cents returns to its pre-issue value 0."
        test_recipe:
          setup:
            - "ACTIVE franchise; report PAID 9169 (total_owed 0 pre-finding); clock 2026-07-09; OPEN audit; finalize FINDING creates a 1200 assessment (issued by authority-lead) and total_owed becomes 1200."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports"
              payload: { franchise_id: "${fr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31", residential_gross_cents: 100010, commercial_gross_cents: 50010, advertising_gross_cents: 33330 }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { rr_id: $.data.id }
            - call: "POST /revenue-reports/${rr_id}/accept"
              payload: {}
              as: FranchiseAuthority
            - call: "POST /revenue-reports/${rr_id}/pay"
              payload: { amount_cents: 9169 }
              as: Operator
              as_user_id: "${fr_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-09T00:00:00Z" }
              as: FranchiseAuthority
            - call: "POST /audits"
              payload: { franchise_id: "${fr_id}", target_report_id: "${rr_id}", period_start_date: "2026-01-01", period_end_date: "2026-03-31" }
              as: FranchiseAuthority
              captures: { au_id: $.data.id }
            - call: "POST /audits/${au_id}/finalize"
              payload: { finding: "FINDING", audited_gross_residential_cents: 120010, audited_gross_commercial_cents: 50010, audited_gross_advertising_cents: 33330 }
              as: FranchiseAuthority
              as_user_id: "authority-lead"
            - call: "GET /audits/${au_id}/assessments"
              payload: {}
              as: FranchiseAuthority
              captures: { as_id: "$.data[0].id" }
          trigger:
            - call: "POST /assessments/${as_id}/waive"
              payload: {}
              as: FranchiseAuthority
              as_user_id: "authority-review"
          assert:
            - "Assessment.${as_id}.status == WAIVED"
            - "Franchise.${fr_id}.total_owed_cents == 0"

      - name: peg_record_then_void_conserves_peg_credit
        grounds:
          - calculations.franchise_peg_credit
          - state_machines.PegContribution.RECORDED_to_VOIDED
          - entities.Franchise.fields.peg_credit_cents
        distinguishing_aspect: "Conserved quantity peg_credit_cents (PEG capital credit, distinct from money owed): recording a 250000 contribution raises it, voiding lowers it by exactly 250000; Franchise.peg_credit_cents returns to its pre-record value 0."
        test_recipe:
          setup:
            - "ACTIVE franchise; peg_credit_cents 0."
          setup_api_calls:
            - call: "POST /franchises"
              payload: { operator_name: "CableCo", territory_name: "North Ward", homes_in_territory: 10000, road_miles: 50, fee_rate_pct: 0.05, term_start_date: "2026-01-01", term_end_date: "2036-01-01" }
              as: FranchiseAuthority
              captures: { fr_id: $.data.id }
            - call: "POST /franchises/${fr_id}/activate"
              payload: {}
              as: FranchiseAuthority
          trigger:
            - call: "POST /peg-contributions"
              payload: { franchise_id: "${fr_id}", amount_cents: 250000, contribution_type: "CAPITAL_GRANT" }
              as: Operator
              as_user_id: "${fr_id}"
              captures: { peg_id: $.data.id }
            - call: "POST /peg-contributions/${peg_id}/void"
              payload: { voided_reason: "duplicate deposit" }
              as: FranchiseAuthority
          assert:
            - "PegContribution.${peg_id}.status == VOIDED"
            - "Franchise.${fr_id}.peg_credit_cents == 0"
