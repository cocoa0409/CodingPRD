            - "the follow-up inspection call returns HTTP 409 with data.error_id == ERR_DAM_NOT_OPERABLE"
            - "Dam.${dam_id}.safety_status == POOR is untouched by the breach order"

      - name: dam_safety_and_regulatory_dimensions_advance_independently
        claim_type: parallel_dimensions
        grounds:
          - state_machines.Dam.safety_status
          - state_machines.Dam.regulatory_status
          - complexity_profile.state_machine_shape
        distinguishing_aspect: |
          The two Dam dimensions are independent: enforcement moves regulatory_status without
          touching safety_status and acceptance moves safety_status without touching
          regulatory_status.
        excluded_because:
          difficulty_instance: dam_regulatory_status_cycles_back_to_registered_while_safety_status_holds
          rationale: |
            That §1.8 non_linear_state_machine instance already drives REGISTERED ->
            UNDER_ENFORCEMENT -> REGISTERED while asserting that safety_status stays
            CONDITIONALLY_SATISFACTORY across every hop, which is exactly this parallel-dimension
            claim with a harder cycle attached.

