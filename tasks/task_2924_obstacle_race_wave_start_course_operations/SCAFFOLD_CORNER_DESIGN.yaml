            - call: "POST /ocr/participants/${p1_id}/waiver"
              payload: { signature_name: "Runner Two" }
              as: Participant
              as_user_id: "${p2_id}"
            - call: "GET /ocr/entries/${entry1_id}"
              payload: {}
              as: Participant
              as_user_id: "${p1_id}"
            - call: "GET /ocr/entries/${entry1_id}"
              payload: {}
              as: RaceDirector
          assert:
            - "The first trigger call, sent with neither X-User-Role nor X-User-ID, returns 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "The second trigger call, sent with the undeclared role Spectator, also returns 401 with data.error_id == ERR_UNAUTHENTICATED — an unknown role is not merely forbidden"
            - "The third trigger call returns 403 with data.error_id == ERR_NOT_ENTRY_OWNER: Runner Two may not read Runner One's entry"
            - "The fourth trigger call returns 403 with data.error_id == ERR_NOT_ENTRY_OWNER: a runner may not sign someone else's waiver, and Participant.${p1_id}.waiver_signed is unchanged at true from its own signature"
            - "The fifth trigger call returns 200 with Entry.${entry1_id}.bib_number == 1"
            - "The sixth trigger call returns 200 for RaceDirector, so the ownership rule binds only the Participant role"
            - "Entry.${entry2_id} is untouched throughout, still progress_status REGISTERED"

