            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-30T00:00:00Z" }, as: ProgramManager }
            - { call: "GET /api/invoices/${inv1}", payload: {}, as: ProgramManager, captures: { fee30: "$.data.late_fee_cents", due30: "$.data.amount_due_cents" } }
            - { call: "POST /api/invoices/${inv1}/transition", payload: { to: PAID, paid_amount_cents: 406000 }, as: UtilityCoordinator, as_user_id: "${p1}", captures: { pay1: "$.data.status" } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: ProgramManager }
            - { call: "GET /api/invoices/${inv2}", payload: {}, as: ProgramManager, captures: { fee60: "$.data.late_fee_cents", due60: "$.data.amount_due_cents" } }
            - { call: "POST /api/invoices/${inv2}/transition", payload: { to: PAID, paid_amount_cents: 1648000 }, as: UtilityCoordinator, as_user_id: "${p2}", captures: { pay2: "$.data.status" } }
