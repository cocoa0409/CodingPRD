            - "during: ${open_mid} == 0, ${mand_mid} == 0, ${proj_mand_mid} == 0, ${posture_mid} == OPEN"
            - "${plan_status} == REVISION_REQUIRED and ${rounds} == 1"
            - "after: ${open_after} == 1 and ${mand_after} == 1 (both counters restored exactly)"
            - "${cmt_status_after} == OPEN, ${cmt_disp_after} == null, ${reopens} == 1"
            - "${proj_mand_after} == 1 and ${posture_after} == RESTRICTED (the posture is restored, not merely recomputed to OPEN)"
            - "ResourceStudy rows and StudyPlan.attached_study_count == 1 are untouched by the compensation"
