- rule_id: resource_temporal_overlap
  instances:
  - name: price_version_point_collision_rejects_a_duplicate_effective_from
    grounds:
    - validations[priority=36]
    - errors[ERR_PRICE_VERSION_OVERLAP]
    - entities.PriceVersion.fields.effective_from
    - calculations.price_binding
    distinguishing_aspect: 'Interval semantics one - point collision on the Item resource: an item''s price history is a partition of half-open intervals, so two versions may not share a left endpoint, but they may sit one second apart with no buffer at all.'
    test_recipe:
      setup:
      - OAT-25 already carries one price version effective 2026-04-01T00:00:00Z at 12000 cents.
      - No cycle or order exists; this is a pure catalog operation.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-05T00:00:00Z'
        as: ClubAdmin
      - call: POST /routes
        payload:
          code: R-NORTH
          name: North Route
          reefer_slots: 2
          route_minimum_cents: 1000
          max_pallets: 12
        as: ClubAdmin
        captures:
          r_north: $.data.id
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
          name: Depot A
          drop_minimum_cents: 1000
        as: ClubAdmin
        captures:
          d_a: $.data.id
      - call: POST /members
        payload:
          email: cora@coop.test
          full_name: Cora Ord
          home_drop_point_id: ${d_a}
          tier: PRO
        as: ClubAdmin
        captures:
          mc_id: $.data.id
          mc_v: $.data.version
      - call: POST /members/${mc_id}/dues-payments
        payload:
          amount_cents: 18000
          term_years: 1
          expected_member_version: ${mc_v}
        as: ClubAdmin
      - call: POST /drop-points
        payload:
          route_id: ${r_north}
