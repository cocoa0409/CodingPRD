        distinguishing_aspect: "One sweep proves the 404 catalog is per-entity rather than a single generic code: eight detail reads with well-formed but unknown UUIDs return eight distinct error_ids, and none of them is ERR_STORE_NOT_FOUND or ERR_INVALID_REQUEST."
