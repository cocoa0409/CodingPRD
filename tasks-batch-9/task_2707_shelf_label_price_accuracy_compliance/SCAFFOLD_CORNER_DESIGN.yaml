              as: PriceAuditor
              as_user_id: "${pa1}"
              captures: { audit_exp: $.data.id }
            - call: "POST /price-integrity/scanner-audits/${audit_exp}/scan-lines"
              payload: { item_upc: "00000000002001", shelf_price_cents: 1000, register_price_cents: 1199 }
              as: PriceAuditor
              as_user_id: "${pa1}"
            - call: "POST /price-integrity/scanner-audits/${audit_exp}/scan-lines"
