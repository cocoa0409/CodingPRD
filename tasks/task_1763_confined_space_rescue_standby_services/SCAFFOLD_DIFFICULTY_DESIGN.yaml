# =============================================================================
# Task 1763: Confined-Space & Rescue-Standby Services
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 2 instances per Difficulty Rule (§0.5) — 18 instances total
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: billing_mode_hourly_vs_event_divergence
        grounds:
          - calculations.standby_line_amount_hourly
          - calculations.event_mode_billing
          - entities.ClientAccount.fields.billing_mode
          - entities.StandbyAssignment.fields.line_amount_cents
        distinguishing_aspect: |
          Entity domain = ClientAccount billing. Identical standby activity (rescuer
          checked in 2026-08-03T10:00Z, released 2026-08-03T12:07Z) bills 80000 cents
          under HOURLY_STANDBY (127 min -> 135 billable min -> 2.25h floored to the
          4h minimum * 20000) but 25000 cents under EVENT (flat per-rescuer fee,
          duration ignored). Same subject, two valid variants, divergent totals.
        test_recipe:
          setup:
            - "Two accounts: H (HOURLY_STANDBY) and E (EVENT), identical rate fields (hourly 20000, event base 150000, per-rescuer 25000, credit 100000000)"
            - "Each account: one PERMIT_REQUIRED space (continuous monitoring off, max_entrants 2, no isolation required, TWA8), one APPROVED plan (team size 1), one ISSUED permit"
            - "Each permit: one standby assignment for rescuer r1 with window 2026-08-03T10:00:00Z-20:00:00Z, checked in at 10:00, released at 12:07"
            - "Both accounts then generate a statement for period [2026-08-03T00:00:00Z, 2026-08-04T00:00:00Z)"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Hourly Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct_h: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct_h}/confined-spaces", payload: { space_code: "TK-H", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { space_h: "$.data.id", space_h_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${space_h}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${space_h_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan_h: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${space_h}", as: OperationsManager, captures: { space_h_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan_h}/approve", payload: { expected_space_version: "${space_h_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${space_h}", as: OperationsManager, captures: { space_h_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${space_h}/entry-permits", payload: { purpose: "Hourly job", planned_start_at: "2026-08-03T09:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${space_h_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { permit_h: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${permit_h}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${permit_h}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T10:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa_h: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Event Co", billing_mode: "EVENT", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct_e: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct_e}/confined-spaces", payload: { space_code: "TK-E", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { space_e: "$.data.id", space_e_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${space_e}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${space_e_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan_e: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${space_e}", as: OperationsManager, captures: { space_e_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan_e}/approve", payload: { expected_space_version: "${space_e_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${space_e}", as: OperationsManager, captures: { space_e_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${space_e}/entry-permits", payload: { purpose: "Event job", planned_start_at: "2026-08-03T09:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${space_e_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { permit_e: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${permit_e}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${permit_e}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T10:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa_e: "$.data.id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa_h}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/standby-assignments/${sa_e}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T12:07:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/standby-assignments/${sa_h}/release", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa_h_amt: "$.data.line_amount_cents" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa_e}/release", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/client-accounts/${acct_h}/statements/generate", payload: { period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }, as: BillingClerk, captures: { stmt_h: "$.data.id", stmt_h_total: "$.data.total_cents", stmt_h_lines: "$.data.line_count" } }
            - { call: "POST /rescue-ops/client-accounts/${acct_e}/statements/generate", payload: { period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-04T00:00:00Z" }, as: BillingClerk, captures: { stmt_e: "$.data.id", stmt_e_total: "$.data.total_cents", stmt_e_lines: "$.data.line_count" } }
          trigger:
            - { call: "GET /rescue-ops/statements/${stmt_h}", as: BillingClerk, captures: { stmt_h_final: "$.data.total_cents" } }
            - { call: "GET /rescue-ops/statements/${stmt_e}", as: BillingClerk, captures: { stmt_e_final: "$.data.total_cents" } }
          assert:
            - "StandbyAssignment.${sa_h}.line_amount_cents == 80000 (127 min -> ceil(127/15)*15 = 135 billable min -> 2.25h -> max(4, 2.25) = 4h * 20000 * 1.0)"
            - "StandbyAssignment.${sa_e}.line_amount_cents == null (EVENT account: hourly line never computed)"
            - "BillingStatement.${stmt_h}.line_count == 1 and its single line has line_kind STANDBY_HOURLY, amount_cents 80000"
            - "BillingStatement.${stmt_h}.total_cents == 80000"
            - "BillingStatement.${stmt_e}.line_count == 1 and its single line has line_kind EVENT_RESCUER, amount_cents 25000"
            - "BillingStatement.${stmt_e}.total_cents == 25000"
            - "80000 != 25000 — identical standby activity bills divergently under the two billing_mode variants"

      - name: exposure_standard_twa8_vs_peak_divergence
        grounds:
          - calculations.entrant_exposure_classification
          - entities.ConfinedSpace.fields.exposure_standard
          - entities.RosterEntry.fields.exposure_class
        distinguishing_aspect: |
          Entity domain = RosterEntry safety exposure (different domain from billing).
          An identical reading stream (8 ppm H2S for 240 min, then 2 ppm for 240 min)
          classifies the entrant ACTION on a TWA8 space (TWA8 = 5.0 >= 5) but OK on a
          PEAK_CEILING space (peak = 8 < 10). Two valid exposure variants, same data,
          divergent classification.
        test_recipe:
          setup:
            - "One HOURLY_STANDBY account with two spaces: S1 exposure_standard TWA8, S2 exposure_standard PEAK_CEILING (both PERMIT_REQUIRED, continuous monitoring OFF, no isolation required, max_entrants 2)"
            - "Each space: APPROVED plan (team size 1), ISSUED-then-ACTIVE permit (planned 2026-08-03T05:00-20:00Z), own attendant+entrant roster entries ON_DUTY from 10:00, own rescuer ON_STANDBY"
            - "Each permit gets CONTINUOUS readings h2s 8 ppm at 10:00, 2 ppm at 14:00, 2 ppm at 18:00 (o2 20.9, lel 0, co 0 — always within limits)"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T05:30:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Safe One", role_qualifications: ["SAFETY_OFFICER"] }, as: OperationsManager, captures: { so_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att One", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Att Two", role_qualifications: ["ATTENDANT"] }, as: OperationsManager, captures: { att2_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Ent One", role_qualifications: [] }, as: OperationsManager, captures: { ent1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Ent Two", role_qualifications: [] }, as: OperationsManager, captures: { ent2_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer Two", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r2_id: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts", payload: { name: "Exposure Co", billing_mode: "HOURLY_STANDBY", hourly_standby_rate_cents: 20000, event_base_fee_cents: 150000, event_per_rescuer_cents: 25000, credit_limit_cents: 100000000 }, as: OperationsManager, captures: { acct: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-TWA", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "TWA8" }, as: OperationsManager, captures: { sp1: "$.data.id", sp1_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp1}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp1_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan1: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp1}", as: OperationsManager, captures: { sp1_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan1}/approve", payload: { expected_space_version: "${sp1_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp1}", as: OperationsManager, captures: { sp1_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp1}/entry-permits", payload: { purpose: "TWA job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp1_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per1: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per1}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per1}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att1_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per1}/standby-assignments", payload: { rescuer_id: "${r1_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa1: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa1}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per1}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per1}/roster-entries", payload: { personnel_id: "${att1_id}", assignment_role: "ATTENDANT", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T18:30:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_att1: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per1}/roster-entries", payload: { personnel_id: "${ent1_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T18:30:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_ent1: "$.data.id" } }
            - { call: "POST /rescue-ops/client-accounts/${acct}/confined-spaces", payload: { space_code: "TK-PEAK", classification: "PERMIT_REQUIRED", requires_continuous_monitoring: false, max_entrants: 2, ventilation_required: false, blind_flange_required: false, exposure_standard: "PEAK_CEILING" }, as: OperationsManager, captures: { sp2: "$.data.id", sp2_v: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp2}/rescue-plans", payload: { required_team_size: 1, required_certifications: ["CONFINED_SPACE_RESCUE"], retrieval_system_type: "TRIPOD", expected_space_version: "${sp2_v}" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { plan2: "$.data.id" } }
            - { call: "GET /rescue-ops/confined-spaces/${sp2}", as: OperationsManager, captures: { sp2_v2: "$.data.version" } }
            - { call: "POST /rescue-ops/rescue-plans/${plan2}/approve", payload: { expected_space_version: "${sp2_v2}" }, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "GET /rescue-ops/confined-spaces/${sp2}", as: OperationsManager, captures: { sp2_v3: "$.data.version" } }
            - { call: "POST /rescue-ops/confined-spaces/${sp2}/entry-permits", payload: { purpose: "Peak job", planned_start_at: "2026-08-03T05:00:00Z", planned_end_at: "2026-08-03T20:00:00Z", expected_space_version: "${sp2_v3}" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { per2: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per2}/issue", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per2}/atmospheric-readings", payload: { reading_kind: "PRE_ENTRY", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 0, co_ppm: 0 }, as: Attendant, as_user_id: "${att2_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per2}/standby-assignments", payload: { rescuer_id: "${r2_id}", standby_start_at: "2026-08-03T05:00:00Z", standby_end_at: "2026-08-03T20:00:00Z" }, as: RescueTeamLead, as_user_id: "${rtl_id}", captures: { sa2: "$.data.id" } }
            - { call: "POST /rescue-ops/standby-assignments/${sa2}/check-in", payload: {}, as: RescueTeamLead, as_user_id: "${rtl_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per2}/activate", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per2}/roster-entries", payload: { personnel_id: "${att2_id}", assignment_role: "ATTENDANT", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T18:30:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_att2: "$.data.id" } }
            - { call: "POST /rescue-ops/entry-permits/${per2}/roster-entries", payload: { personnel_id: "${ent2_id}", assignment_role: "ENTRANT", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T18:30:00Z" }, as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ro_ent2: "$.data.id" } }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T10:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/roster-entries/${ro_att1}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/roster-entries/${ro_ent1}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/roster-entries/${ro_att2}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/roster-entries/${ro_ent2}/check-in", payload: {}, as: EntrySupervisor, as_user_id: "${sup_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per1}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 8, co_ppm: 0 }, as: Attendant, as_user_id: "${att1_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per2}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 8, co_ppm: 0 }, as: Attendant, as_user_id: "${att2_id}" }
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T14:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per1}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 2, co_ppm: 0 }, as: Attendant, as_user_id: "${att1_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per2}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 2, co_ppm: 0 }, as: Attendant, as_user_id: "${att2_id}" }
          trigger:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/entry-permits/${per1}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 2, co_ppm: 0 }, as: Attendant, as_user_id: "${att1_id}" }
            - { call: "POST /rescue-ops/entry-permits/${per2}/atmospheric-readings", payload: { reading_kind: "CONTINUOUS", o2_pct: 20.9, lel_pct: 0, h2s_ppm: 2, co_ppm: 0 }, as: Attendant, as_user_id: "${att2_id}" }
            - { call: "GET /rescue-ops/roster-entries/${ro_ent1}", as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ent1_class: "$.data.exposure_class" } }
            - { call: "GET /rescue-ops/roster-entries/${ro_ent2}", as: EntrySupervisor, as_user_id: "${sup_id}", captures: { ent2_class: "$.data.exposure_class" } }
          assert:
            - "RosterEntry.${ro_ent1}.exposure_twa_ppm == 5.0 ( (8*240 + 2*240) / 480 )"
            - "RosterEntry.${ro_ent1}.exposure_peak_ppm == 8"
            - "RosterEntry.${ro_ent1}.exposure_class == ACTION (TWA8 standard: 5.0 >= 5)"
            - "RosterEntry.${ro_ent2}.exposure_twa_ppm == 5.0 (computed regardless of standard)"
            - "RosterEntry.${ro_ent2}.exposure_peak_ppm == 8"
            - "RosterEntry.${ro_ent2}.exposure_class == OK (PEAK_CEILING standard: 8 < 10)"
            - "Identical reading streams produce divergent exposure_class under the two space exposure_standard variants"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: hourly_tier_crossing_with_after_hours_multiplier
        grounds:
          - calculations.standby_line_amount_hourly
          - entities.ClientAccount.fields.tier1_hours_threshold
          - entities.ClientAccount.fields.after_hours_multiplier
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction. A 10.0h assignment
          straddles the 8h tier boundary (8h * 20000 + 2h * 20000 * 1.5 = 220000)
          AND takes the after-hours multiplier because checked_in_at hour 20 >= 19
          (220000 * 1.5 = 330000). Tier split, minimum-floor max(), and conditional
          multiplier selection interact in one formula.
        test_recipe:
          setup:
            - "HOURLY_STANDBY account (rate 20000, min 4h, tier1 8h, tier2 x1.5, after-hours x1.5, weekend x2.0), one space, APPROVED plan, ISSUED permit"
            - "One standby assignment window 2026-08-03T20:00:00Z - 2026-08-04T08:00:00Z, checked in Monday 2026-08-03T20:00:00Z (after-hours: hour 20 >= 19, not weekend), released 2026-08-04T06:00:00Z (600 actual minutes)"
          setup_api_calls:
            - { call: "POST /rescue-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T18:00:00Z" }, as: OperationsManager }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Lead One", role_qualifications: ["RESCUE_LEAD"] }, as: OperationsManager, captures: { rtl_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Sup One", role_qualifications: ["ENTRY_SUPERVISOR"] }, as: OperationsManager, captures: { sup_id: "$.data.id" } }
            - { call: "POST /rescue-ops/personnel", payload: { full_name: "Rescuer One", role_qualifications: ["RESCUER"], certifications: ["CONFINED_SPACE_RESCUE"] }, as: OperationsManager, captures: { r1_id: "$.data.id" } }
