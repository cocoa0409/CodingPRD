          The region comparison is TRANSITIVE — crew.region_code against the region of the
          Grower that farms the block, reached through VineyardBlock.grower_id, not against
          anything on the contract or the block itself. An implementation that compares the
          crew against the block's ava_code or skips the hop passes nothing here. The 422 also
