# =============================================================================
# Task 1856: SCAFFOLD_CORNER_DESIGN (Section 1.9 — Coverage Index for
# Non-Difficulty Tests). Breadth walk over the claim-extraction-guide taxonomy.
# Sections are the guide's nine section names; claim_type values come from its
# per-section tables. Instances already exercised by SCAFFOLD_DIFFICULTY_DESIGN
# are emitted as excluded_because stubs (no test_recipe).
# Clock default: 2026-08-01T00:00:00Z.
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # Section: entities (creation, retrieval, listing, not-found, required
  # fields, defaults, computed fields, system fields, type constraints,
  # immutability)
  # ===========================================================================
  - section: entities
    instances:
      - name: account_create_and_get_roundtrip
        claim_type: creation
        grounds: [entities.ComplianceAccount, "endpoints[POST /rfs/compliance-accounts]"]
        distinguishing_aspect: "POST with all required fields returns 201 with system fields populated; GET returns the stored entity."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-RT-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "GET /rfs/compliance-accounts/${acct}"
              as: ComplianceManager
          assert:
            - "GET returns company_name == 'Acme Refining' and epa_registration_id == 'EPA-RT-1'"
            - "escrow_reserved_cents == 0 and spent_cents == 0 (computed defaults)"
            - "version == 1 and created_at is non-null (system fields server-stamped)"

      - name: account_duplicate_epa_registration_rejected
        claim_type: type_constraints
        grounds: [entities.ComplianceAccount.fields.epa_registration_id, "validations[priority=10]"]
        distinguishing_aspect: "Natural-key uniqueness: second account with the same epa_registration_id is rejected."
        test_recipe:
          setup: ["one account with epa_registration_id EPA-DUP-1 exists"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-DUP-1" }
              as: OpsAdmin
          trigger:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Other Refining", epa_registration_id: "EPA-DUP-1" }
              as: OpsAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_REQUEST (uniqueness on epa_registration_id)"

      - name: year_create_missing_required_field
        claim_type: required_fields
        grounds: [entities.ObligationYear, "validations[priority=5]"]
        distinguishing_aspect: "Missing std_total_pct (required input) is rejected before any other rule runs."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-REQ-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0 }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_REQUEST"

      - name: year_standards_must_be_nondecreasing
        claim_type: type_constraints
        grounds: ["validations[priority=5]", entities.ObligationYear.fields.std_advanced_pct]
        distinguishing_aspect: "Nested RFS standards: advanced (25) below biomass_diesel (30) violates the monotone ordering constraint."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-REQ-2" }
              as: OpsAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 30.0, std_advanced_pct: 25.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_REQUEST (standards must satisfy cellulosic <= biomass_diesel <= advanced <= total)"

      - name: lot_create_invalid_d_code_enum
        claim_type: type_constraints
        grounds: [entities.RINLot.fields.d_code, "validations[priority=5]"]
        distinguishing_aspect: "Enum field d_code rejects a value outside {D3, D4, D5, D6}."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-REQ-3" }
              as: OpsAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D9", vintage_year: 2026, gallon_qty: 10, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_REQUEST"

      - name: lot_get_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rfs/rin-lots/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_NOT_FOUND with http 404"

      - name: rin_lots_list_filter_and_pagination
        claim_type: listing
        grounds: ["endpoints[GET /rfs/rin-lots]", response_envelope]
        distinguishing_aspect: "Filtered list returns only the account's lots and honors pagination envelope fields (limit/offset/total_count/has_more)."
        test_recipe:
          setup: ["two accounts, each with one GENERATED lot"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-LST-1" }
              as: OpsAdmin
              captures: { acct_a: $.data.id }
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Beta Fuels", epa_registration_id: "EPA-LST-2" }
              as: OpsAdmin
              captures: { acct_b: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct_a}", d_code: "D6", vintage_year: 2026, gallon_qty: 10, equivalence_value: 1.0 }
              as: ComplianceManager
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct_b}", d_code: "D4", vintage_year: 2026, gallon_qty: 20, equivalence_value: 1.5 }
              as: ComplianceManager
          trigger:
            - call: "GET /rfs/rin-lots"
              payload: { account_id: "${acct_a}" }
              as: ComplianceManager
          assert:
            - "response contains exactly 1 lot, all with account_id == ${acct_a}"
            - "envelope includes limit == 10, offset == 0, total_count == 1, has_more == false (pagination defaults)"

      - name: blending_record_immutable_event
        claim_type: immutability
        grounds: [entities.BlendingRecord]
        distinguishing_aspect: "BlendingRecord has common_fields: false — it carries id + created_at only, no version/updated_at, and the API surface declares no update endpoint."
        test_recipe:
          setup: ["account + GENERATED lot with a separation recorded"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-IMM-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 10, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot: $.data.id }
            - call: "POST /rfs/rin-lots/${lot}/separations"
              payload: { blended_gallons: 4 }
              as: ComplianceManager
              captures: { br: $.data.id }
          trigger:
            - call: "GET /rfs/blending-records/${br}"
              as: ComplianceManager
          assert:
            - "BlendingRecord.${br} has no version field and no updated_at field"
            - "blended_gallons == 4 and rin_lot_id == ${lot}"
            - "retention_until == created_at + 1825 days"

      - name: computed_fields_ignore_client_input
        claim_type: computed_fields
        grounds: [entities.RINLot.fields.rin_qty, entities.RINTrade.fields.total_price_cents]
        distinguishing_aspect: "Server-computed fields (rin_qty, total_price_cents, available_qty) derive from formulas even if the client omits them; input for them is not accepted."
        test_recipe:
          setup: ["account + vendor exist"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-CMP-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: false }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
          trigger:
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D4", vintage_year: 2026, gallon_qty: 101, equivalence_value: 1.5 }
              as: ComplianceManager
              captures: { lot: $.data.id }
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 12, price_per_rin_cents: 137 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
          assert:
            - "RINLot.${lot}.rin_qty == 152 (round_half_up(101 * 1.5), not client-supplied)"
            - "RINTrade.${trd}.total_price_cents == 1644 (12 * 137)"

      - name: body_fk_reference_must_exist
        claim_type: parent_relationships
        grounds: ["validations[priority=6]", "errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "Body FK (vendor_id) referencing a nonexistent vendor is a 422 referential error, distinct from path 404."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-FK-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", d_code: "D6", vintage_year: 2026, rin_qty: 10, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_REFERENCE_NOT_FOUND with http 422"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: lot_initial_state_active
        claim_type: initial_state
        grounds: [state_machines.RINLot]
        distinguishing_aspect: "New GENERATED lot starts ACTIVE with attached_qty == rin_qty and separated_qty == 0."
        test_recipe:
          setup: ["account exists"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-SM-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 50, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot: $.data.id }
          assert:
            - "RINLot.${lot}.status == ACTIVE"
            - "RINLot.${lot}.attached_qty == 50 and separated_qty == 0 and available_qty == 50"

      - name: deliver_before_pay_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RINTrade.PENDING_to_DELIVERED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Parallel-dimension guard: deliver requires payment_status == PAID; delivering an UNPAID trade is rejected."
        test_recipe:
          setup: ["account + vendor; trade created (UNPAID, PENDING)"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-SM-2" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: false }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 10, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
          trigger:
            - call: "POST /rfs/rin-trades/${trd}/deliver"
              as: Trader
              as_user_id: "tr-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_STATE"
            - "RINTrade.${trd}.transfer_status == PENDING (unchanged)"

      - name: pay_twice_rejected
        claim_type: idempotency
        grounds: [state_machines.RINTrade.UNPAID_to_PAID]
        distinguishing_aspect: "Second pay on an already-PAID trade is an invalid from-state transition (no double spend)."
        test_recipe:
          setup: ["account + vendor; trade paid once"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-SM-3" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: false }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 10, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
          trigger:
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_STATE"
            - "ComplianceAccount.${acct}.spent_cents == 1000 (exactly once)"

      - name: cancel_after_deliver_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RINTrade.PENDING_to_CANCELLED]
        distinguishing_aspect: "Cancel is only legal while transfer_status == PENDING; a DELIVERED trade cannot be cancelled."
        test_recipe:
          setup: ["account + vendor; trade paid and delivered"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-SM-4" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: false }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 10, price_per_rin_cents: 100 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/deliver"
              as: Trader
              as_user_id: "tr-1"
          trigger:
            - call: "POST /rfs/rin-trades/${trd}/cancel"
              as: Trader
              as_user_id: "tr-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_STATE"
            - "RINTrade.${trd}.transfer_status == DELIVERED"

      - name: report_terminal_superseded_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ComplianceReport.DRAFT_to_SUPERSEDED]
        distinguishing_aspect: "A SUPERSEDED draft is terminal: submit on it is rejected."
        test_recipe:
          setup: ["account + year; QUARTERLY report R1 created then superseded by R2 (same year + report_type)"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-SM-5" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id, yr_v: $.data.version }
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "QUARTERLY", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v}" }
              as: ComplianceManager
              captures: { r1: $.data.id, yr_v2: $.data.version }
            - call: "GET /rfs/obligation-years/${yr}"
              as: ComplianceManager
              captures: { yr_v_fresh: $.data.version }
            - call: "POST /rfs/compliance-reports"
              payload: { obligation_year_id: "${yr}", report_type: "QUARTERLY", quarter_end_date: "2026-06-30T00:00:00Z", expected_obligation_year_version: "${yr_v_fresh}" }
              as: ComplianceManager
              captures: { r2: $.data.id }
          trigger:
            - call: "POST /rfs/compliance-reports/${r1}/submit"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "ComplianceReport.${r1}.status == SUPERSEDED"
            - "trigger error_id == ERR_INVALID_STATE (terminal lockdown)"
            - "ComplianceReport.${r2}.status == DRAFT"

      - name: attest_close_with_adverse_findings_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.AttestEngagement.FINDINGS_ISSUED_to_CLOSED_CLEAN, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Close requires findings == CLEAN; closing an ADVERSE engagement is rejected (remediation loop is the only path)."
        test_recipe:
          setup: ["account + year; engagement in FINDINGS_ISSUED with findings ADVERSE"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-SM-6" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/attest-engagements"
              payload: { obligation_year_id: "${yr}", auditor_user_id: "aud-1", fieldwork_start: "2026-09-01T00:00:00Z", fieldwork_end: "2026-10-01T00:00:00Z" }
              as: ComplianceManager
              captures: { eng: $.data.id }
            - call: "POST /rfs/attest-engagements/${eng}/begin-fieldwork"
              as: Auditor
              as_user_id: "aud-1"
            - call: "POST /rfs/attest-engagements/${eng}/issue-findings"
              payload: { findings: "ADVERSE" }
              as: Auditor
              as_user_id: "aud-1"
          trigger:
            - call: "POST /rfs/attest-engagements/${eng}/close"
              as: Auditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INVALID_STATE"
            - "AttestEngagement.${eng}.status == FINDINGS_ISSUED"

      - name: year_finalize_requires_report_and_attest
        claim_type: precondition_enforcement
        grounds: [state_machines.ObligationYear.VOLUME_CLOSED_to_FINALIZED, "errors[ERR_YEAR_NOT_FINALIZABLE]"]
        distinguishing_aspect: "Guarded transition: finalize is rejected while the year lacks an ACCEPTED annual report (even with volume closed)."
        test_recipe:
          setup: ["account + year with volume closed; no annual report, no engagement"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-SM-7" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/obligation-years/${yr}/close-volume"
              payload: { actual_volume_gal: 1000 }
              as: ComplianceManager
          trigger:
            - call: "POST /rfs/obligation-years/${yr}/finalize"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_YEAR_NOT_FINALIZABLE"
            - "ObligationYear.${yr}.status == VOLUME_CLOSED"

      - name: lot_expiry_sweep_on_clock_advance
        claim_type: valid_transition
        grounds: [state_machines.RINLot.ACTIVE_to_EXPIRED, calculations.rin_vintage_expiry]
        distinguishing_aspect: "System transition: advancing the clock past (vintage+2)-03-31T23:59:59Z expires an ACTIVE vintage-2025 lot and moves its remaining RINs to expired_qty."
        test_recipe:
          setup: ["account + vintage-2025 lot (100 RINs, 60 separated, 40 attached); clock advanced to 2028-04-01"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-SM-8" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2025, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot: $.data.id }
            - call: "POST /rfs/rin-lots/${lot}/separations"
              payload: { blended_gallons: 60 }
              as: ComplianceManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-04-01T00:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "GET /rfs/rin-lots/${lot}"
              as: ComplianceManager
          assert:
            - "RINLot.${lot}.status == EXPIRED"
            - "RINLot.${lot}.expired_qty == 100 (60 separated + 40 attached)"
            - "RINLot.${lot}.available_qty == 0"

      - name: invalidate_cascade_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.RINTrade.VERIFIED_to_INVALIDATED, state_machines.RINLot.ACTIVE_to_INVALIDATED]
        distinguishing_aspect: "Covered by difficulty instance vendor_revocation_invalidation_cascade as its cascade core."
        excluded_because:
          difficulty_instance: transitive_cascade / vendor_revocation_invalidation_cascade
          rationale: "That instance asserts the full invalidation chain (trade -> lot -> year -> report) including this transition's side effects."

      - name: nested_retirement_counters_side_effects
        claim_type: side_effect_execution
        grounds: [state_machines.RetirementBatch.SUBMITTED_to_ACCEPTED]
        distinguishing_aspect: "Covered by difficulty instance retirement_acceptance_cascade_to_satisfied."
        excluded_because:
          difficulty_instance: transitive_cascade / retirement_acceptance_cascade_to_satisfied
          rationale: "Nested d_code counter mapping and EXHAUSTED flip are asserted there."

      - name: report_reopen_clears_submission_fields
        claim_type: valid_transition
        grounds: [state_machines.ComplianceReport.REJECTED_to_DRAFT]
        distinguishing_aspect: "Covered by difficulty instance compliance_report_revision_and_amendment_cycles (both REJECTED->DRAFT and ACCEPTED->DRAFT loops)."
        excluded_because:
          difficulty_instance: non_linear_state_machine / compliance_report_revision_and_amendment_cycles
          rationale: "Cycle traversal plus field resets (submitted_at null, is_late false) asserted there."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: fifo_allocation_order_and_partial_final_lot
        claim_type: correct_result
        grounds: [calculations.retirement_fifo_allocation]
        distinguishing_aspect: "Chronological draw: older lot drained first, newer lot partially drawn; allocations array preserves draw order (created_at ASC, rin_qty ASC tie-break); lot2 retains the remainder."
        test_recipe:
          setup:
            - "Year 2026 (RVOs 100/200/300/400); two GENERATED D6/2026 lots: lot1 100 gal (created first), lot2 50 gal (created second); both fully separated"
            - "Batch TOTAL_RENEWABLE/D6 qty 120 created"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-CALC-1" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 100, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot1: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 50, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot2: $.data.id }
            - call: "POST /rfs/rin-lots/${lot1}/separations"
              payload: { blended_gallons: 100 }
              as: ComplianceManager
            - call: "POST /rfs/rin-lots/${lot2}/separations"
              payload: { blended_gallons: 50 }
              as: ComplianceManager
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 120 }
              as: ComplianceManager
              captures: { b: $.data.id }
          trigger:
            - call: "POST /rfs/retirement-batches/${b}/submit"
              as: ComplianceManager
          assert:
            - "RetirementBatch.${b}.allocations == [{rin_lot_id: ${lot1}, qty: 100}, {rin_lot_id: ${lot2}, qty: 20}] (FIFO with partial final lot)"
            - "RINLot.${lot1}.pending_retired_qty == 100 and separated_qty == 0"
            - "RINLot.${lot2}.pending_retired_qty == 20 and separated_qty == 30"

      - name: insufficient_eligible_rins_at_submit
        claim_type: correct_result
        grounds: [calculations.retirement_fifo_allocation, "errors[ERR_INSUFFICIENT_RINS]"]
        distinguishing_aspect: "Input-set filtering: an UNVERIFIED purchased lot does NOT count toward eligible supply (10 separated generated + 100 unverified purchased < 120 requested)."
        test_recipe:
          setup:
            - "Year 2026; GENERATED D6/2026 lot with 10 separated; PURCHASED D6/2026 lot (100) delivered but NOT verified"
            - "Batch TOTAL_RENEWABLE/D6 qty 120 created"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-CALC-2" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/obligation-years"
              payload: { account_id: "${acct}", year: 2026, projected_volume_gal: 1000, std_cellulosic_pct: 10.0, std_biomass_diesel_pct: 20.0, std_advanced_pct: 30.0, std_total_pct: 40.0 }
              as: ComplianceManager
              captures: { yr: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, gallon_qty: 10, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_g: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_g}/separations"
              payload: { blended_gallons: 10 }
              as: ComplianceManager
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: false }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 100, price_per_rin_cents: 90 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd: $.data.id }
            - call: "POST /rfs/rin-trades/${trd}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd}/deliver"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/retirement-batches"
              payload: { obligation_year_id: "${yr}", category: "TOTAL_RENEWABLE", d_code: "D6", rin_qty: 120 }
              as: ComplianceManager
              captures: { b: $.data.id }
          trigger:
            - call: "POST /rfs/retirement-batches/${b}/submit"
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "trigger error_id == ERR_INSUFFICIENT_RINS (only 10 eligible; unverified purchased 100 excluded)"
            - "RetirementBatch.${b}.status == DRAFT"

      - name: separation_boundary_exactly_attached
        claim_type: constants_applied
        grounds: [calculations.rin_generation_qty, "errors[ERR_SEPARATION_EXCEEDS_ATTACHED]"]
        distinguishing_aspect: "Boundary: separating exactly attached_qty (152 from 101 gal x 1.5) succeeds; one more RIN fails."
        test_recipe:
          setup: ["account + GENERATED D4 lot 101 gal @ 1.5 (rin_qty 152, attached 152)"]
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-CALC-3" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D4", vintage_year: 2026, gallon_qty: 101, equivalence_value: 1.5 }
              as: ComplianceManager
              captures: { lot: $.data.id }
          trigger:
            - call: "POST /rfs/rin-lots/${lot}/separations"
              payload: { blended_gallons: 152 }
              as: ComplianceManager
            - call: "POST /rfs/rin-lots/${lot}/separations"
              payload: { blended_gallons: 1 }
              as: ComplianceManager
              captures: { err: $.data.error_id }
          assert:
            - "first separation succeeds: attached_qty == 0, separated_qty == 152"
            - "second separation error_id == ERR_SEPARATION_EXCEEDS_ATTACHED"
            - "RINLot.${lot}.rin_qty == 152 (conservation: 0 attached + 152 separated)"

      - name: exposure_mark_to_market_weighted_buckets
        claim_type: correct_result
        grounds: [calculations.exposure_mark_to_market]
        distinguishing_aspect: "Weighted-scoring: WAC per (d_code, vintage) bucket from verified-purchase unit costs, zero-basis generated RINs, covering-quote selector, and unpriced-bucket fallback — totals computed as literals."
        test_recipe:
          setup:
            - "Account with: (D6,2026) bucket = 3 RINs @150c + 4 RINs @160c purchased and verified (available 7, wac = 1060/7 = 151.4286c); (D4,2026) bucket = 10 generated RINs (basis 0); (D3,2026) bucket = 5 generated RINs (no quote -> unpriced)"
            - "Quotes: (D6,2026) 170c and (D4,2026) 40c covering the default clock 2026-08-01; no (D3,2026) quote"
          setup_api_calls:
            - call: "POST /rfs/compliance-accounts"
              payload: { company_name: "Acme Refining", epa_registration_id: "EPA-CALC-4" }
              as: OpsAdmin
              captures: { acct: $.data.id }
            - call: "POST /rfs/vendors"
              payload: { account_id: "${acct}", vendor_name: "GreenRIN LLC", qap_audited: true }
              as: Trader
              as_user_id: "tr-1"
              captures: { ven: $.data.id }
            - call: "POST /rfs/vendors/${ven}/diligence"
              payload: { outcome: "APPROVED" }
              as: ComplianceManager
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 3, price_per_rin_cents: 150 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd1: $.data.id }
            - call: "POST /rfs/rin-trades/${trd1}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd1}/deliver"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd1}/verify"
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /rfs/rin-trades"
              payload: { account_id: "${acct}", vendor_id: "${ven}", d_code: "D6", vintage_year: 2026, rin_qty: 4, price_per_rin_cents: 160 }
              as: Trader
              as_user_id: "tr-1"
              captures: { trd2: $.data.id }
            - call: "POST /rfs/rin-trades/${trd2}/pay"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd2}/deliver"
              as: Trader
              as_user_id: "tr-1"
            - call: "POST /rfs/rin-trades/${trd2}/verify"
              as: ComplianceManager
              as_user_id: "cm-1"
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D4", vintage_year: 2026, gallon_qty: 10, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_d4: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_d4}/separations"
              payload: { blended_gallons: 10 }
              as: ComplianceManager
            - call: "POST /rfs/rin-lots"
              payload: { account_id: "${acct}", d_code: "D3", vintage_year: 2026, gallon_qty: 5, equivalence_value: 1.0 }
              as: ComplianceManager
              captures: { lot_d3: $.data.id }
            - call: "POST /rfs/rin-lots/${lot_d3}/separations"
              payload: { blended_gallons: 5 }
              as: ComplianceManager
            - call: "POST /rfs/price-quotes"
              payload: { account_id: "${acct}", d_code: "D6", vintage_year: 2026, price_cents: 170, effective_start: "2026-07-01T00:00:00Z", effective_end: "2026-08-31T23:59:59Z" }
              as: OpsAdmin
            - call: "POST /rfs/price-quotes"
              payload: { account_id: "${acct}", d_code: "D4", vintage_year: 2026, price_cents: 40, effective_start: "2026-07-01T00:00:00Z", effective_end: "2026-08-31T23:59:59Z" }
              as: OpsAdmin
          trigger:
            - call: "GET /rfs/compliance-accounts/${acct}/exposure"
              as: ComplianceManager
          assert:
            - "exposure.priced_bucket_count == 2"
            - "exposure.unpriced_bucket_count == 1 (D3 bucket has no covering quote)"
            - "exposure.total_exposure_cents == 530 (D6: round_half_up(7 * (170 - 151.4286)) = 130; D4: round_half_up(10 * (40 - 0)) = 400)"

      - name: position_input_set_filtering_by_status
        claim_type: input_set_filtering
        grounds: [calculations.position_aggregation]
        distinguishing_aspect: "Position buckets include INVALIDATED and EXPIRED lots so the ledger reconciles: generated 100 + purchased 50, invalidated 50, available 100 after invalidation."
        test_recipe:
          setup:
            - "Account with GENERATED D6/2026 lot 100 (separated) and PURCHASED D6/2026 lot 50 (verified) then invalidated via trade invalidate"
          setup_api_calls:
