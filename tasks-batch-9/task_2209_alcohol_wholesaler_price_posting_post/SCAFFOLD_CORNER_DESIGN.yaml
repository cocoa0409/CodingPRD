          assert:
            - "The certify response is HTTP 200 with status == \"POSTED\", certified_at == \"2026-08-01T00:00:00.000Z\", hold_window_ends_at == \"2026-08-04T00:00:00.000Z\" and effective_date == \"2026-10-01T00:00:00.000Z\"."
            - "The immediately following GET on the schedule returns byte-identical values for status, certified_at, certified_by_user_id, hold_window_ends_at and effective_date."
            - "The filtered item list returns total_count == 2 in the same run."
            - "GET /price-schedule-items/${itemA} shows certified_case_price_cents == 120000 and certified_unit_price_cents == 11000; GET /price-schedule-items/${itemA2} shows 30000 and 5500."

      - name: the_assess_response_and_an_immediately_following_wholesaler_read_agree_on_the_penalty
        claim_type: immediate
        grounds: [complexity_profile.consistency_model, calculations.audit_penalty_assessment, entities.Wholesaler.assessed_penalty_cents]
        distinguishing_aspect: "The assessment writes across three aggregates — audit, wholesaler ledger and the audited invoices — and every one of them must be readable at its final value in the same run. Because the wholesaler ledger field is denormalized from findings, a deferred or cached rollup shows 0 on the read that immediately follows a response reporting 4000."
        test_recipe:
          setup:
            - "Wholesaler A filed the 2026-08 schedule on time and it became EFFECTIVE on 2026-09-01 at 120000 per case."
            - "A 2026-09-05 invoice charges 2 cases at 115000, so it validated FLAGGED with a 10000 variance."
            - "A COLLECTED 2026-09 audit holds exactly that one finding; the wholesaler has no other penalties."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
