              as: DealerAdmin
              captures: { agr2_id: $.data.id }
            - call: "POST /national-agreements"
              payload: { fleet_account_id: "${fleet_id}", agreement_code: "SOL-2027B", effective_from: "2027-01-01", effective_to: "2027-06-30", tier_discount_pct: 0.10, casing_credit_rate_cents: 16000, emergency_response_minutes: 90, emergency_labor_rate_cents_per_hour: 13500 }
