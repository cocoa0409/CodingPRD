              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m1}", category: "OTHER", occurred_at: "2026-07-10T09:00:00Z", severity: 1 }
              as: Member
              as_user_id: "${m1}"
              captures: { ra: $.data.id }
            - call: "POST /watch/incident-reports"
              payload: { block_id: "${b1}", reporter_member_id: "${m1}", category: "NOISE", occurred_at: "2026-07-20T09:00:00Z", severity: 1 }
              as: Member
              as_user_id: "${m1}"
              captures: { rb: $.data.id }
            - call: "POST /watch/incident-reports/${ra}/begin-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/incident-reports/${ra}/corroborate"
              payload: {}
              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "POST /watch/incident-reports/${rb}/begin-review"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/incident-reports/${rb}/dismiss"
              payload: {}
              as: ProgramCoordinator
          trigger:
            - call: "GET /watch/blocks/${b1}"
              payload: {}
              as: ProgramCoordinator
              captures: { last: $.data.last_incident_at }
          assert:
            - "last == 2026-07-10T09:00:00Z (the dismissed report B with the later occurred_at does NOT move the derived field — only CORROBORATED/CLEARED reports count)"

      - name: scheduled_action_alert_send_at_exact_time
        claim_type: scheduled_actions
        grounds: [state_machines.Alert.QUEUED_to_SENT, "validations[priority=7]"]
        distinguishing_aspect: "A QUEUED alert sent before its scheduled_send_at is rejected ERR_INVALID_STATE (the scheduler-side gate); sent at exactly scheduled_send_at it succeeds — the scheduled instant is inclusive."
        test_recipe:
          setup: ["OPERATIONAL group, captain on block; GROUP SAFETY_TIP alert QUEUED with scheduled_send_at 2026-08-09T12:00:00Z; clock first at 11:59 then at 12:00"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Sched Watch", precinct_code: "L04" }
              as: ProgramCoordinator
              captures: { wg: $.data.id, wg_v: $.data.version }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "4-4 Sched St", household_count: 4 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { b1_v: $.data.version }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Sch M", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "BL04", full_name: "Officer Sch", precinct_code: "L04" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/training-sessions"
              payload: { watch_group_id: "${wg}", trainer_officer_id: "${off}", curriculum: "BIAS_AVOIDANCE", scheduled_at: "2026-08-02T10:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { ts: $.data.id }
            - call: "POST /watch/training-sessions/${ts}/complete"
              payload: { attending_member_ids: ["${m1}"] }
              as: LiaisonOfficer
              as_user_id: "${off}"
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m1}", expected_block_version: "${b1_v}" }
              as: ProgramCoordinator
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { wg_v2: $.data.version }
            - call: "POST /watch/alerts"
              payload: { watch_group_id: "${wg}", alert_kind: "SAFETY_TIP", audience_scope: "GROUP", scheduled_send_at: "2026-08-09T12:00:00Z", expected_watch_group_version: "${wg_v2}" }
              as: ProgramCoordinator
              captures: { al: $.data.id }
            - call: "POST /watch/alerts/${al}/queue"
              payload: {}
              as: ProgramCoordinator
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T11:59:00Z" }
              as: ProgramCoordinator
          trigger:
            - call: "POST /watch/alerts/${al}/send"
              payload: {}
              as: ProgramCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /watch/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-09T12:00:00Z" }
              as: ProgramCoordinator
            - call: "POST /watch/alerts/${al}/send"
              payload: {}
              as: ProgramCoordinator
              captures: { st: $.data.distribution_status }
          assert:
            - "err == ERR_INVALID_STATE (send before scheduled_send_at is not yet fireable)"
            - "st == SENT at exactly the scheduled instant (inclusive boundary)"

      - name: cascading_side_effects_version_propagation
        claim_type: cascading_side_effects
        grounds: [state_machines.Member.ACTIVE_to_SUSPENDED, state_machines.WatchGroup.OPERATIONAL_to_DEGRADED]
        distinguishing_aspect: "Excluded — the full depth-3 cascade with version propagation is the §1.8 transitive-cascade instance."
        excluded_because:
          difficulty_instance: member_suspend_cascades_captain_posture_alert_hold
          rationale: "Covered end-to-end with posture + alert-gate assertions there."

  # =====================================================================
  # Section: consistency_model
  # =====================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_posture_visible_in_same_sequence
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, entities.WatchGroup.fields.posture]
        distinguishing_aspect: "All derived changes are visible on the very next read with no reconciliation lag: immediately after the captain assignment that completes the OPERATIONAL gate, GET shows posture OPERATIONAL — no eventual-consistency window."
        test_recipe:
          setup: ["FORMATION group: 1 REGISTERED block, training completed, captain not yet assigned"]
          setup_api_calls:
            - call: "POST /watch/watch-groups"
              payload: { name: "Imm Watch", precinct_code: "M01" }
              as: ProgramCoordinator
              captures: { wg: $.data.id }
            - call: "POST /watch/watch-groups/${wg}/blocks"
              payload: { street_segment: "1-1 Imm St", household_count: 4 }
              as: ProgramCoordinator
              captures: { b1: $.data.id }
            - call: "POST /watch/blocks/${b1}/register"
              payload: {}
              as: ProgramCoordinator
              captures: { b1_v: $.data.version }
            - call: "POST /watch/members"
              payload: { watch_group_id: "${wg}", block_id: "${b1}", full_name: "Imm M", contact_channel: "SMS" }
              as: ProgramCoordinator
              captures: { m1: $.data.id }
            - call: "POST /watch/liaison-officers"
              payload: { badge_number: "BM01", full_name: "Officer Im", precinct_code: "M01" }
              as: ProgramCoordinator
              captures: { off: $.data.id }
            - call: "POST /watch/training-sessions"
              payload: { watch_group_id: "${wg}", trainer_officer_id: "${off}", curriculum: "BIAS_AVOIDANCE", scheduled_at: "2026-08-02T10:00:00Z" }
              as: LiaisonOfficer
              as_user_id: "${off}"
              captures: { ts: $.data.id }
            - call: "POST /watch/training-sessions/${ts}/complete"
              payload: { attending_member_ids: ["${m1}"] }
              as: LiaisonOfficer
              as_user_id: "${off}"
          trigger:
            - call: "POST /watch/blocks/${b1}/captain-assignments"
              payload: { member_id: "${m1}", expected_block_version: "${b1_v}" }
              as: ProgramCoordinator
            - call: "GET /watch/watch-groups/${wg}"
              payload: {}
              as: ProgramCoordinator
              captures: { post: $.data.posture }
          assert:
            - "post == OPERATIONAL on the read immediately following the captain assignment (no delay, no async reconciliation)"
