        claim_type: rbac_denial
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers is rejected with 400 ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any role check."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: None
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: offer_create_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[offer-create-stale-audit-case]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on AuditCase.version: after offer O1 is tendered (bumping the case version), a second create carrying the pre-tender version is rejected with 412 ERR_STALE_VERSION and O1 remains the only TENDERED offer."
        test_recipe:
          setup: ["Case in SETTLEMENT_NEGOTIATION (full flow, finding 70000); case version cv captured; O1 (CUSTOMER, 50000) tendered with cv"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_USER", notice_response_deadline_days: 30 }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_USER", unit_list_price_cents: 5000, support_rate_pct: 0.2 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/entitlements"
              payload: { product_id: "${p_id}", purchase_order_number: "PO-1", quantity: 50, coverage_class: "PRODUCTION", effective_from: "2026-01-01T00:00:00Z", source: "MANUAL_IMPORT" }
              as: SAMManager
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 60, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
            - call: "POST /sam/audit-cases"
              payload: { vendor_id: "${v_id}", audit_firm_name: "AuditCo LLP", notice_received_on: "2026-08-01T00:00:00Z" }
              as: LegalCounsel
              captures: { case_id: $.data.id }
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SCOPE_NEGOTIATION" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items"
              payload: { audit_case_id: "${case_id}", product_id: "${p_id}", inclusion_rationale: "in scope" }
              as: VendorAuditor
              captures: { si: $.data.id }
            - call: "POST /sam/audit-scope-items/${si}/confirm"
              payload: {}
              as: LegalCounsel
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "EVIDENCE_COLLECTION" }
              as: LegalCounsel
            - call: "POST /sam/data-submissions"
              payload: { audit_case_id: "${case_id}", submission_label: "extract", covered_scope_item_ids: ["${si}"] }
              as: SAMManager
              as_user_id: "sam-mgr-1"
              captures: { sub: $.data.id }
            - call: "POST /sam/data-submissions/${sub}/submit-for-review"
              payload: {}
              as: SAMManager
            - call: "POST /sam/data-submissions/${sub}/approve"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /sam/data-submissions/${sub}/release"
              payload: {}
              as: LegalCounsel
              as_user_id: "counsel-1"
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "FINDINGS_REVIEW" }
              as: LegalCounsel
            - call: "POST /sam/audit-scope-items/${si}/vendor-finding"
              payload: {}
              as: VendorAuditor
            - call: "POST /sam/audit-cases/${case_id}/advance"
              payload: { to_state: "SETTLEMENT_NEGOTIATION" }
              as: LegalCounsel
              captures: { cv: $.data.version }
            - call: "POST /sam/settlement-offers"
              payload: { audit_case_id: "${case_id}", offered_by: "CUSTOMER", amount_cents: 50000, expected_audit_case_version: "${cv}" }
              as: ProcurementLead
              as_user_id: "proc-1"
              captures: { o1: $.data.id }
          trigger:
            - call: "POST /sam/settlement-offers"
              payload: { audit_case_id: "${case_id}", offered_by: "VENDOR", amount_cents: 65000, expected_audit_case_version: "${cv}" }
              as: VendorAuditor
              as_user_id: "aud-1"
              captures: { err: $.data.error_id }
            - call: "GET /sam/settlement-offers/${o1}"
              as: LegalCounsel
              captures: { o1_status: $.data.status }
          assert:
            - "err == ERR_STALE_VERSION (${cv} is stale: O1's tender already advanced AuditCase.version)"
            - "o1_status == TENDERED (the failed create did not supersede it)"

      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: [state_machines.RemediationAction.IN_PROGRESS_to_COMPLETED]
        excluded_because:
          difficulty_instance: true_up_remediation_cascade
          rationale: "Depth-4 cascade (remediation -> entitlement -> position -> case/alerts) asserted end-to-end in the named §1.8 instance."

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [calculations.position_exposure]
        excluded_because:
          difficulty_instance: position_exposure_self_audit_vs_vendor_list
          rationale: "Variant divergence with literal values asserted in the named §1.8 instance."

      - name: layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds: [calculations.alert_evaluation]
        excluded_because:
          difficulty_instance: alert_suppress_worsen_reopen_conserves_cardinality
          rationale: "Threshold-triggered alert lifecycle asserted in the named §1.8 instance and in expiry_alert_fires_at_exactly_30_days."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: mutations_visible_immediately_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the confirm response itself carries status CONFIRMED, and a subsequent GET of the position in the same test step shows the quantity already included — no lag."
        test_recipe:
          setup: ["Product with one REPORTED deployment of 7 units"]
          setup_api_calls:
            - call: "POST /sam/vendors"
              payload: { name: "Vendor A", vendor_code: "VND-A", default_license_metric: "PER_INSTALL" }
              as: SAMPlatformAdmin
              captures: { v_id: $.data.id }
            - call: "POST /sam/products"
              payload: { vendor_id: "${v_id}", name: "Prod", license_metric: "PER_INSTALL", unit_list_price_cents: 10000, support_rate_pct: 0.22 }
              as: SAMPlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /sam/deployments"
              payload: { product_id: "${p_id}", measured_quantity: 7, environment: "PRODUCTION", measurement_method: "SCAN", measured_on: "2026-07-15T00:00:00Z" }
              as: ITAnalyst
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /sam/deployments/${d1}/confirm"
              payload: {}
              as: SAMManager
              captures: { st: $.data.status }
            - call: "GET /sam/products/${p_id}/license-positions"
              as: SAMManager
              captures: { dep: "$.data[0].deployed_quantity" }
          assert:
            - "st == CONFIRMED (visible in the mutation response itself)"
            - "dep == 7 (position reflects the mutation on the very next read)"


