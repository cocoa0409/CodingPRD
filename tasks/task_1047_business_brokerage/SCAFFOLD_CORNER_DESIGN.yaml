              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/activate"
              payload: {}
              as: Broker
              as_user_id: "${broker_id}"
            - call: "POST /brokerage/listings/${listing_id}/ndas"
