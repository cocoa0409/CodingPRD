  - rule_id: compensating_invariant
    instances:
      - name: escalate_dismiss_restore_invariant
        grounds:
          - state_machines.ManipulationSignal.OPEN_to_ESCALATED
          - state_machines.Investigation.OPEN_to_CLOSED
          - calculations.chart_points
        distinguishing_aspect: |
          Conserved quantity: the ACCEPTED-report set and per-batch countable_units for a (title, week). Forward action: BULK_PURCHASE escalation (SaleBatch CLEARED→UNDER_REVIEW, countable_units→0) plus a QUARANTINE of a RECEIVED streaming report; compensating action: investigation resolved DISMISSED restores all batches to CLEARED with recomputed countable_units and quarantined reports to ACCEPTED — the total countable input set after compensation equals the pre-escalation set exactly.
        test_recipe:
          setup:
            - "Album title T, week W1 OPEN; buyer buyer-Z has one CLEARED D2C batch of quantity 3 (countable_units 3)"
            - "One ACCEPTED STREAM_ON_DEMAND_PAID report of quantity 2500 (2 SEA units)"
            - "Signal (BULK_PURCHASE) filed by ops-88, escalated to investigator 'inv-99'"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-04T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /labels"
              payload: { legal_name: "Label CI", account_code: "LBL-CI" }
              as: PlatformAdmin
              captures: { lbl_id: $.data.id }
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-CI", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /titles"
              payload: { upc: "UPC-CI-1", title: "Album CI", artist_name: "A", product_kind: "ALBUM", genre_tag: "rock", release_date: "2026-08-01T00:00:00Z", base_price_cents: 999, label_account_id: "${lbl_id}", availability_policy: { available_from: "2026-08-01T00:00:00Z", available_until: null } }
              as: LabelRep
              as_user_id: "${lbl_id}"
              captures: { t_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "ALB-CI", title: "Albums CI", chart_kind: "ALBUMS", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/methodology-versions"
              payload: { version_label: "v1", w_sales: 1.0, w_on_demand: 0.5, w_programmed: 0.2, w_airplay: 0.0001, paid_stream_divisor: 1250, ad_stream_divisor: 3750, prog_stream_divisor: 2500, tea_rate: 10, effective_from: "2026-09-01T00:00:00Z" }
              as: ChartManager
              captures: { mv_id: $.data.id }
            - call: "POST /charts/${ch_id}/methodology-versions/${mv_id}/activate"
              payload: { expected_chart_version: "${ch_ver}" }
              as: ChartManager
            - call: "POST /charts/${ch_id}/weeks"
              payload: { week_index: 1, opens_at: "2026-09-04T00:00:00Z", closes_at: "2026-09-11T00:00:00Z" }
              as: ChartManager
              captures: { wk_id: $.data.id }
            - call: "POST /titles/${t_id}/sale-batches"
              payload: { channel: "D2C", quantity: 3, buyer_key: "buyer-Z", chart_week_id: "${wk_id}" }
              as: ChartOps
              captures: { b_id: $.data.id, b_count0: $.data.countable_units }
            - call: "POST /providers"
              payload: { provider_code: "DSP-CI", display_name: "DSP CI", feed_kind: "STREAM_ON_DEMAND", territory: "DOMESTIC" }
              as: PlatformAdmin
              captures: { pv_id: $.data.id }
            - call: "POST /providers/${pv_id}/reports"
              payload: { title_product_id: "${t_id}", chart_week_id: "${wk_id}", component_kind: "STREAM_ON_DEMAND_PAID", quantity: 2500, event_time: "2026-09-05T00:00:00Z", file_fingerprint: "ci-1" }
              as: DataProvider
              as_user_id: "${pv_id}"
              captures: { r_id: $.data.id }
            - call: "POST /consumption-reports/${r_id}/accept"
              payload: {}
              as: ChartOps
            - call: "POST /manipulation-signals"
              payload: { title_product_id: "${t_id}", chart_week_id: "${wk_id}", signal_kind: "BULK_PURCHASE", evidence: "bulk pattern" }
              as: ChartOps
              as_user_id: "ops-88"
              captures: { sig_id: $.data.id }
            - call: "POST /manipulation-signals/${sig_id}/escalate"
              payload: { assigned_to: "inv-99" }
              as: ChartOps
              as_user_id: "ops-88"
              captures: { inv_id: $.data.id }
          trigger:
            - call: "POST /investigations/${inv_id}/resolve"
              payload: { finding: "DISMISSED", notes: "no manipulation found" }
              as: Investigator
              as_user_id: "inv-99"
            - call: "GET /titles/${t_id}/sale-batches"
              payload: { chart_week_id: "${wk_id}" }
              as: ChartOps
              captures: { batches: $.data }
          assert:
            - "SaleBatch.${b_id}.review_status == CLEARED (restored)"
            - "SaleBatch.${b_id}.countable_units == 3 (== pre-escalation value; invariant: sum of countable_units for (buyer-Z, ${t_id}, ${wk_id}) unchanged by escalate+dismiss round trip)"
            - "ConsumptionReport.${r_id}.status == ACCEPTED (unchanged by the BULK_PURCHASE cascade and untouched by dismissal)"
            - "TitleProduct.${t_id}.eligibility_posture == ELIGIBLE and LabelAccount.${lbl_id}.strike_count == 0 (no drift)"

      - name: methodology_activation_supersession_singleton_invariant
        grounds:
          - state_machines.MethodologyVersion.DRAFT_to_ACTIVE
          - state_machines.MethodologyVersion.ACTIVE_to_SUPERSEDED
          - entities.Chart.fields.current_methodology_version_id
        distinguishing_aspect: |
          Different conserved quantity: the count of ACTIVE methodology versions per chart plus pointer coherence. Forward: activate V1 (chart gains exactly 1 ACTIVE); compensating-like follow-up: activate V2 supersedes V1 — invariant ACTIVE count == 1 and chart.current_methodology_version_id equals the latest activated version at every step; freeze+resolve round trip preserves the same singleton invariant.
        test_recipe:
          setup:
            - "Chart C; DRAFT methodology versions V1 and V2 (V2 with different weights)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /recurrent-rules"
              payload: { rule_code: "RR-MS", max_weeks: 20, min_rank: 25, reentry_min_rank: 10, description: "std" }
              as: ChartManager
              captures: { rr_id: $.data.id }
            - call: "POST /charts"
              payload: { chart_code: "SNG-MS", title: "Singles MS", chart_kind: "SINGLES", chart_scope: "MAIN", recurrent_rule_id: "${rr_id}" }
              as: ChartManager
              captures: { ch_id: $.data.id, ch_ver: $.data.version }
            - call: "POST /charts/${ch_id}/methodology-versions"
              payload: { version_label: "v1", w_sales: 1.0, w_on_demand: 0.5, w_programmed: 0.2, w_airplay: 0.0001, paid_stream_divisor: 1250, ad_stream_divisor: 3750, prog_stream_divisor: 2500, tea_rate: 10, effective_from: "2026-09-01T00:00:00Z" }
              as: ChartManager
              captures: { mv1_id: $.data.id }
            - call: "POST /charts/${ch_id}/methodology-versions"
              payload: { version_label: "v2", w_sales: 2.0, w_on_demand: 0.5, w_programmed: 0.2, w_airplay: 0.0001, paid_stream_divisor: 1250, ad_stream_divisor: 3750, prog_stream_divisor: 2500, tea_rate: 10, effective_from: "2026-09-01T00:00:00Z" }
              as: ChartManager
              captures: { mv2_id: $.data.id }
          trigger:
            - call: "POST /charts/${ch_id}/methodology-versions/${mv1_id}/activate"
              payload: { expected_chart_version: "${ch_ver}" }
              as: ChartManager
            - call: "GET /charts/${ch_id}"
              payload: {}
              as: ChartManager
              captures: { ch_ver2: $.data.version, ptr1: $.data.current_methodology_version_id }
            - call: "POST /charts/${ch_id}/methodology-versions/${mv2_id}/activate"
              payload: { expected_chart_version: "${ch_ver2}" }
              as: ChartManager
            - call: "GET /charts/${ch_id}/methodology-versions"
              payload: { limit: 100 }
              as: ChartManager
              captures: { versions: $.data }
            - call: "GET /charts/${ch_id}"
              payload: {}
              as: ChartManager
              captures: { ptr2: $.data.current_methodology_version_id }
          assert:
            - "after first activation: exactly one version with status ACTIVE (${mv1_id}) and Chart.current_methodology_version_id == ${mv1_id}"
            - "after second activation: exactly one version with status ACTIVE (${mv2_id}); ${mv1_id}.status == SUPERSEDED"
            - "Chart.current_methodology_version_id == ${mv2_id} (singleton invariant: count(ACTIVE per chart) == 1 across the activation pair)"

