            - "res1_nights == 1 and res2_nights == 3"
            - "pre_m09_picked == 1 and pre_m09_open == 1 and pre_m11_open == 3 (before the cancel, R2 occupies one room on each of the three master nights)"
            - "res2_status == CANCELLED"
            - "after the cancel m09_sub == 2, m09_picked == 0, m09_released == 0, m09_open == 2 (the rooms went back to open, not to released)"
            - "after the cancel m11_picked == 0 and m11_open == 4"
            - "the conservation identity rooms_allotted == rooms_sub_allocated + rooms_picked_up + rooms_released + rooms_open holds on every BlockNight of both blocks after the cancel"
            - "master_status_after == CUT_OFF and RoomBlock.${sub_block_id}.inventory_status == CUT_OFF (hop 2)"
            - "cut_m09_released == 2 and cut_m09_open == 0"
            - "cut_m10_released == 2"
            - "cut_m11_released == 4 and cut_m11_open == 0"
            - "cut_s09_picked == 1, cut_s09_released == 1, cut_s09_open == 0 (the sub-block releases allotted - sub_allocated - picked_up)"
            - "cut_s10_released == 2"
            - "the conservation identity holds again on every BlockNight of both blocks after the cutoff cascade"
            - "sum_released == 8 (2 + 2 + 4 on the master's own nights only)"
            - "sum_picked == 1 (the master's own nights hold 0 and the sub-block's single room night rolls up)"
            - "sum_peak == 0 (peak_night_rooms reads only the master's own BlockNight rows)"
            - "sum_base == 12"
            - "committed_09 == 2, committed_10 == 2, committed_11 == 0 (only the master's 2/2/4 releases moved inventory; the sub-block's 3 released room nights moved none)"
            - "Reservation.${res1_id}.status == PENDING (cutoff never touches reservations)"

      - name: force_majeure_termination_returns_receivable_to_zero
        grounds:
          - calculations.receivable_conservation
          - calculations.cancellation_damages
          - state_machines.GroupContract.SIGNED_to_TERMINATED_FORCE_MAJEURE
          - state_machines.AncillaryCharge.POSTED_to_VOIDED
        distinguishing_aspect: |
          Two posted ancillary charges drive receivable_total_cents up to 620000; terminating the
          contract for FORCE_MAJEURE under a STANDARD clause is the compensating action that must void
          both charges, zero assessed_damages_cents and return receivable_total_cents to exactly its
          pre-charge value of 0 with no residue. The same cancel with CLIENT_CANCEL at this clock would
          assess 93960 (tier 0.50 on the mitigated base of (12 - 3) * 20880 = 187920), so a
          zero-damages result is only correct because of the reason/clause pair — an implementation that
          skips the clause test, or that voids the charges without rewriting ancillary_posted_cents,
          leaves a non-zero receivable behind.
        test_recipe:
          setup:
            - "clock 2026-08-01T00:00:00Z; InventoryDay rows for 2026-11-09..11; package P1; lead CLEARED"
            - "contract signed with force_majeure_clause STANDARD and allotments 4/4/4; InventoryDay committed 4/4/4; master block OPEN"
            - "reservation R1 in the master for 2026-11-09..12 (3 room nights) advanced to CONFIRMED"
            - "a BANQUET charge of 500000 gross (net 450000) and an AUDIOVISUAL charge of 200000 gross (net 170000), both POSTED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
              as_user_id: "op-001"
            - call: "POST /group-sales/accounts"
              payload: { name: "Northwind Manufacturing", market_segment: "CORPORATE", billing_contact_email: "ap@northwind.example" }
              as: SalesManager
              as_user_id: "sm-001"
              captures: { acct_id: "$.data.id" }
            - call: "POST /group-sales/inventory-days"
              payload: { stay_date: "2026-11-09", total_rooms: 400, group_ceiling_rooms: 250, transient_demand_rooms: 398, transient_adr_cents: 21000, historical_pickup_rooms: 390, historical_adr_cents: 19500 }
              as: RevenueManager
