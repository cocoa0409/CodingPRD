              as: ChainAdmin
              captures: { supplier_id: $.data.id }
            - call: "POST /seafood-ops/species"
              payload: { market_name: "Atlantic Cod", scientific_name: "Gadus morhua", acceptable_market_names: ["Atlantic Cod", "Cod"], simp_covered: false, high_risk_substitution: false, sustainability_program_eligible: true }
              as: ChainAdmin
              captures: { cod_id: $.data.id }
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-A", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: false, fresh_claim: true, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_a: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_a}/case"
              payload: { case_slot: 1 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/lots"
              payload: { counter_id: "${counter_id}", supplier_id: "${supplier_id}", species_id: "${cod_id}", lot_code: "COD-0801-C", harvest_method: "WILD_LONGLINE", production_method: "WILD", origin_country_code: "US", previously_frozen: true, fresh_claim: false, received_weight_kg: 10.000, unit_cost_cents_per_kg: 1700, retail_price_cents_per_kg: 2450, cooked_retail_price_cents_per_kg: 2600 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { lot_b: $.data.id }
            - call: "POST /seafood-ops/lots/${lot_b}/case"
              payload: { case_slot: 2 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_a}", reason: "UNSOLD_FRESH", shrink_weight_kg: 8.000, conversion_requested_kg: 7.000 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { se_over: $.data.id }
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_a}", reason: "UNSOLD_FRESH", shrink_weight_kg: 2.000 }
              as: SeafoodManager
              as_user_id: "${counter_id}"
              captures: { se_zero: $.data.id }
            - call: "POST /seafood-ops/shrink-events"
              payload: { lot_id: "${lot_b}", reason: "UNSOLD_FRESH", shrink_weight_kg: 5.000, conversion_requested_kg: 2.000 }
              as: SeafoodManager
