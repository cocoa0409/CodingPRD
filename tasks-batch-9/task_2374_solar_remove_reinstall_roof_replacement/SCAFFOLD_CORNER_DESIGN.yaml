scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_party_creation_returns_201_with_every_declared_field
        claim_type: creation
        grounds:
          - entities.Party
          - endpoints["POST /reroof/parties"]
          - response_envelope.success
        distinguishing_aspect: "A create with all required and all optional inputs must echo every declared field, mint id/created_at/updated_at, and start version at 1 - a client-supplied version would be ignored."
        test_recipe:
          setup:
            - "Empty database; logical clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
          trigger:
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example", mobilization_buffer_minutes: 90, daily_crew_capacity: 2, license_number: "ROC-338211" }
              as: ProjectCoordinator
              captures: { party_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Party.${party_id}.name == Ridgeline Roofing"
            - "Party.${party_id}.party_type == ROOFER"
            - "Party.${party_id}.contact_email == ops@ridgeline.example"
            - "Party.${party_id}.mobilization_buffer_minutes == 90"
            - "Party.${party_id}.daily_crew_capacity == 2"
            - "Party.${party_id}.license_number == ROC-338211"
            - "Party.${party_id}.version == 1"
            - "Party.${party_id}.created_at == 2026-08-01T00:00:00.000Z"
            - "response body has meta.api_request_id and response_type == object"

      - name: corner_party_and_jurisdiction_defaults_applied_when_optional_inputs_omitted
        claim_type: defaults
        grounds:
          - entities.Party.fields.mobilization_buffer_minutes
          - entities.Party.fields.daily_crew_capacity
          - entities.Jurisdiction.fields.expedite_fee_cents
        distinguishing_aspect: "Omitting the three optional inputs must yield the declared defaults 120 minutes, 1 crew slot per day and 0 expedite cents - not null and not zero for the buffer."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
          trigger:
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { party_id: $.data.id }
            - call: "POST /reroof/jurisdictions"
              payload: { name: "Flatrock AHJ", code: "FLATROCK", repermit_required_for_reinstall: false, reinspection_required: true, inspection_slots_per_day: 2, backlog_days: 5, permit_review_days: 7 }
              as: ProjectCoordinator
              captures: { juris_id: $.data.id }
          assert:
            - "Party.${party_id}.mobilization_buffer_minutes == 120"
            - "Party.${party_id}.daily_crew_capacity == 1"
            - "Party.${party_id}.license_number == null"
            - "Jurisdiction.${juris_id}.expedite_fee_cents == 0"
            - "Jurisdiction.${juris_id}.backlog_days == 5"

      - name: corner_project_retrieval_returns_stored_and_derived_fields
        claim_type: retrieval
        grounds:
          - endpoints["GET /reroof/projects/{id}"]
          - entities.ReroofProject
        distinguishing_aspect: "A freshly created LEASE project reads back with its stored inputs plus the derived initial values phase INTAKE, posture OPEN, negotiation_round 1, required_approval_party_count 3 and warranty_notice_status PENDING."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; four parties exist; one LEASE project has been created and nothing else has happened to it."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Nguyen Household", party_type: "SOLAR_OWNER", contact_email: "owner@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Helio Lease Holdings", party_type: "SYSTEM_OWNER", contact_email: "asset@helio.example" }
              as: ProjectCoordinator
              captures: { sysowner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "418 Mesquite Way, Tempe AZ", ownership_model: "LEASE", system_dc_kw: 8.4, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", system_owner_party_id: "${sysowner_id}", baseline_daily_kwh: 41.75, downtime_days_estimated: 9, upgrade_budget_cents: 5000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
          trigger:
            - call: "GET /reroof/projects/${proj_id}"
              as: SolarOwner
              as_user_id: "${owner_id}"
          assert:
            - "HTTP status == 200"
            - "ReroofProject.${proj_id}.phase == INTAKE"
            - "ReroofProject.${proj_id}.posture == OPEN"
            - "ReroofProject.${proj_id}.negotiation_round == 1"
            - "ReroofProject.${proj_id}.required_approval_party_count == 3"
            - "ReroofProject.${proj_id}.warranty_notice_status == PENDING"
            - "ReroofProject.${proj_id}.system_dc_kw == 8.4"
            - "ReroofProject.${proj_id}.version == 1"
            - "ReroofProject.${proj_id}.registered_unit_count == 0"
            - "ReroofProject.${proj_id}.credit_authorized_cents == 0"
            - "ReroofProject.${proj_id}.warranty_preserved == true"

      - name: corner_project_listing_is_paginated_and_filterable_by_phase
        claim_type: listing
        grounds:
          - endpoints["GET /reroof/projects"]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three projects with limit 2 must return exactly 2 rows with total_count 3 and has_more true, offset 2 must return the remaining row with has_more false, and the phase filter must narrow the set - so the envelope's pagination fields are real, not decorative."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three HOST_OWNED projects share the same three parties; none has any approval yet, so all three are in phase INTAKE."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "1 First St, Tempe AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "2 Second St, Tempe AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { p2: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "3 Third St, Tempe AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { p3: $.data.id }
          trigger:
            - call: "GET /reroof/projects"
              payload: { limit: 2, offset: 0 }
              as: ProjectCoordinator
            - call: "GET /reroof/projects"
              payload: { limit: 2, offset: 2 }
              as: ProjectCoordinator
            - call: "GET /reroof/projects"
              payload: { phase: "AUTHORIZED" }
              as: ProjectCoordinator
          assert:
            - "trigger call 1 returns 2 rows with total_count == 3 and has_more == true"
            - "trigger call 2 returns 1 row with total_count == 3 and has_more == false"
            - "trigger call 3 returns 0 rows with total_count == 0 and has_more == false"
            - "every returned row has response_type == array in the envelope"

      - name: corner_project_create_missing_required_ownership_model_is_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
          - endpoints["POST /reroof/projects"]
        distinguishing_aspect: "ownership_model has source input and no default, so omitting it must yield ERR_INVALID_REQUEST (422) before any party-type or business rule is consulted, and no project row may be created."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the three referenced parties exist and are of the correct types, so only the missing field is wrong."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "GET /reroof/projects returns 0 rows with total_count == 0"

      - name: corner_party_create_with_invalid_enum_party_type_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Party.fields.party_type
          - validations[priority=5]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "party_type is closed over four members; INSPECTOR is not one of them, so the create must fail 422 with ERR_INVALID_REQUEST rather than persisting an out-of-domain enum value."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; no parties exist yet."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
          trigger:
            - call: "POST /reroof/parties"
              payload: { name: "Bogus Inspector Co", party_type: "INSPECTOR", contact_email: "nobody@example.com" }
              as: ProjectCoordinator
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "${err_id} == ERR_INVALID_REQUEST"
            - "GET /reroof/parties returns 0 rows with total_count == 0"

      - name: corner_jurisdiction_is_immutable_and_exposes_no_version_field
        claim_type: immutability
        grounds:
          - entities.Jurisdiction
          - endpoints["GET /reroof/jurisdictions/{id}"]
        distinguishing_aspect: "Jurisdiction declares common_fields false: the read must expose id and created_at but no version and no updated_at, and §1.5 declares no mutation endpoint for it, so its policy figures can never drift under a permit that already priced against them."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; one jurisdiction registered."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/jurisdictions"
              payload: { name: "Westvale AHJ", code: "WESTVALE", repermit_required_for_reinstall: true, reinspection_required: true, inspection_slots_per_day: 2, backlog_days: 2, permit_review_days: 10, expedite_fee_cents: 12000 }
              as: ProjectCoordinator
              captures: { juris_id: $.data.id }
          trigger:
            - call: "GET /reroof/jurisdictions/${juris_id}"
              as: AHJInspector
              as_user_id: "${juris_id}"
          assert:
            - "HTTP status == 200"
            - "Jurisdiction.${juris_id}.code == WESTVALE"
            - "Jurisdiction.${juris_id}.expedite_fee_cents == 12000"
            - "Jurisdiction.${juris_id}.created_at == 2026-08-01T00:00:00.000Z"
            - "the response payload contains no version field and no updated_at field"

      - name: corner_project_system_and_computed_fields_ignore_extra_field_input
        claim_type: system_fields
        grounds:
          - entities.ReroofProject.fields.phase
          - entities.ReroofProject.fields.credit_authorized_cents
          - entities.ReroofProject.fields.registered_unit_count
          - endpoints["POST /reroof/projects"]
        distinguishing_aspect: "phase, posture, version and every credit/counter field are source system or computed; supplying them in the create body must not change the server-derived values, which stay INTAKE / OPEN / 1 / 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the three referenced parties exist with correct types."
            - "The create body carries the declared inputs only; any additional keys such as phase or credit_authorized_cents are extra fields the endpoint does not declare and must ignore rather than honour."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
          trigger:
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "ReroofProject.${proj_id}.phase == INTAKE"
            - "ReroofProject.${proj_id}.posture == OPEN"
            - "ReroofProject.${proj_id}.version == 1"
            - "ReroofProject.${proj_id}.credit_authorized_cents == 0"
            - "ReroofProject.${proj_id}.registered_unit_count == 0"
            - "ReroofProject.${proj_id}.warranty_notice_status == NOT_REQUIRED"
            - "ReroofProject.${proj_id}.required_approval_party_count == 2"
            - "ReroofProject.${proj_id}.created_at == 2026-08-01T00:00:00.000Z"

      - name: corner_hardware_unit_body_foreign_keys_must_exist_and_stay_within_the_project
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - validations[priority=15]
          - errors.ERR_CIRCUIT_NOT_FOUND
          - errors.ERR_CROSS_PROJECT_REFERENCE
        distinguishing_aspect: "Flat topology means the parent arrives in the body: an unknown array_circuit_id is a 404 ERR_CIRCUIT_NOT_FOUND (priority 4), while a circuit that exists but belongs to another project is a 422 ERR_CROSS_PROJECT_REFERENCE (priority 15) - two different failures for the same field."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two HOST_OWNED projects P1 and P2 share the same parties; P2 owns circuit S2 and P1 owns nothing."
            - "No ArrayCircuit exists with id 00000000-0000-0000-0000-0000000000aa."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "912 Saguaro Rd, Mesa AZ", ownership_model: "HOST_OWNED", system_dc_kw: 5.2, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 26.0, downtime_days_estimated: 3, upgrade_budget_cents: 1500000 }
              as: ProjectCoordinator
              captures: { p2: $.data.id }
            - call: "POST /reroof/projects/${p2}/array-circuits"
              payload: { circuit_label: "S2", module_count: 1, dc_kw: 0.41 }
              as: ProjectCoordinator
              captures: { c2: $.data.id }
          trigger:
            - call: "POST /reroof/projects/${p1}/hardware-units"
              payload: { array_circuit_id: "00000000-0000-0000-0000-0000000000aa", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0001", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { err_missing: $.data.error_id }
            - call: "POST /reroof/projects/${p1}/hardware-units"
              payload: { array_circuit_id: "${c2}", unit_type: "PANEL", manufacturer: "Meridian Solar", model_code: "MS-410", serial_number: "SN-0001", rated_watts: 410 }
              as: SolarContractor
              as_user_id: "${crew_id}"
              captures: { err_cross: $.data.error_id }
          assert:
            - "trigger call 1 returns HTTP 404 and ${err_missing} == ERR_CIRCUIT_NOT_FOUND"
            - "trigger call 2 returns HTTP 422 and ${err_cross} == ERR_CROSS_PROJECT_REFERENCE"
            - "ReroofProject.${p1}.registered_unit_count == 0"
            - "ReroofProject.${p2}.registered_unit_count == 0"

      - name: corner_path_ids_that_do_not_exist_return_the_resource_specific_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors.ERR_PROJECT_NOT_FOUND
          - errors.ERR_UNIT_NOT_FOUND
          - errors.ERR_FINDING_NOT_FOUND
          - errors.ERR_PERMIT_NOT_FOUND
          - errors.ERR_WINDOW_NOT_FOUND
          - errors.ERR_SOURCING_ORDER_NOT_FOUND
          - errors.ERR_INSPECTION_NOT_FOUND
          - errors.ERR_APPROVAL_NOT_FOUND
          - errors.ERR_CIRCUIT_NOT_FOUND
          - errors.ERR_PARTY_NOT_FOUND
        distinguishing_aspect: "Existence is checked per resource family, so each unknown path id must return its own error_id rather than a single generic 404: project, party, approval, circuit, unit, finding, permit, inspection, window and sourcing order each have a distinct code."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the database holds nothing but the clock, so every id below is unknown."
            - "All calls use a role the endpoint permits, so the priority-2 role gate cannot mask the priority-3 existence gate."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
          trigger:
            - call: "GET /reroof/projects/00000000-0000-0000-0000-000000000001"
              as: ProjectCoordinator
              captures: { e_project: $.data.error_id }
            - call: "GET /reroof/parties/00000000-0000-0000-0000-000000000002"
              as: ProjectCoordinator
              captures: { e_party: $.data.error_id }
            - call: "GET /reroof/party-approvals/00000000-0000-0000-0000-000000000003"
              as: ProjectCoordinator
              captures: { e_approval: $.data.error_id }
            - call: "GET /reroof/array-circuits/00000000-0000-0000-0000-000000000004"
              as: ProjectCoordinator
              captures: { e_circuit: $.data.error_id }
            - call: "GET /reroof/hardware-units/00000000-0000-0000-0000-000000000005"
              as: ProjectCoordinator
              captures: { e_unit: $.data.error_id }
            - call: "GET /reroof/deck-findings/00000000-0000-0000-0000-000000000006"
              as: ProjectCoordinator
              captures: { e_finding: $.data.error_id }
            - call: "GET /reroof/permit-applications/00000000-0000-0000-0000-000000000007"
              as: ProjectCoordinator
              captures: { e_permit: $.data.error_id }
            - call: "GET /reroof/inspections/00000000-0000-0000-0000-000000000008"
              as: ProjectCoordinator
              captures: { e_inspection: $.data.error_id }
            - call: "GET /reroof/work-windows/00000000-0000-0000-0000-000000000009"
              as: ProjectCoordinator
              captures: { e_window: $.data.error_id }
            - call: "GET /reroof/sourcing-orders/00000000-0000-0000-0000-00000000000a"
              as: ProjectCoordinator
              captures: { e_order: $.data.error_id }
          assert:
