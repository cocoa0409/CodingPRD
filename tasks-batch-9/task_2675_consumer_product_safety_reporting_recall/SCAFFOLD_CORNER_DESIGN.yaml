      - name: determination_must_be_supported_by_the_scores_in_both_directions
        claim_type: Violation -> Error
        grounds:
          - validations[18]
          - errors.ERR_DETERMINATION_UNSUPPORTED
          - state_machines[ReportabilityEvaluation].transitions[IN_REVIEW -> REPORTABLE]
        distinguishing_aspect: |
          The rule is basis-scoped and symmetric, and both halves are probed on the
          same DEFECT-basis evaluation: a REPORTABLE call with defect_score 4 fails
          even though risk_score is 9 (the irrelevant score cannot rescue it), and a
          NOT_REPORTABLE call with defect_score 7 fails on the strict mirror, so an
          analyst cannot file a no-action determination on qualifying evidence.
          defect_score exactly 5 is the accepted boundary.
        test_recipe:
          setup:
            - "fixture chain F1 stopped at an IN_REVIEW evaluation whose standard_basis is DEFECT"
