  - rule_id: cross_entity_state_dependency
    instances:
      - name: lead_apply_is_gated_on_the_program_being_launched
        grounds:
          - state_machines.Lead.CONTACTED_to_APPLIED
          - validations[priority=19]
          - errors[ERR_PROGRAM_INVALID_STATE]
          - state_machines.Program.SUSPENDED_to_LAUNCHED
        distinguishing_aspect: |
          Entity pair Lead -> Program: the Lead's own CONTACTED -> APPLIED transition is
          legal, yet it is refused while the referenced Program sits in SUSPENDED and
          succeeds unchanged once that Program is RESUMED — the blocking state lives
          entirely on the other entity.
        test_recipe:
          setup:
            - "EXECUTED Partnership, Program 'MBA Online' LAUNCHED then SUSPENDED by the provost."
            - "Lead P-1001 in status CONTACTED with hours_to_first_contact 6, owned by counselor Rosa Vento."
          setup_api_calls:
            - *c_clock_aug1
            - *c_ps_create
            - *c_ps_submit
            - *c_ps_execute
            - *c_pg_create
            - *c_course_create
            - *c_course_start
            - *c_course_submit
            - *c_course_approve
            - *c_scope_marketing
            - *c_pg_submit
            - *c_pg_approve
            - *c_pg_launch
            - *c_co_create
            - *c_co_plan
            - *c_co_review_approve
            - *c_lead_create
            - *c_lead_contact
            - *c_pg_suspend
          trigger:
            - call: "POST /leads/${ld_id}/advance"
              payload: { action: "APPLY" }
              as: PartnerAccountLead
              as_user_id: "${ps_id}"
              captures: { err4_id: $.data.error_id }
            - &c_pg_resume
              call: "POST /programs/${pg_id}/lifecycle-actions"
              payload: { action: "RESUME" }
              as: UniversityProvost
              as_user_id: "provost-1"
            - *c_lead_apply
          assert:
            - "first response status == 409"
            - "${err4_id} == 'ERR_PROGRAM_INVALID_STATE'"
            - "Program.${pg_id}.status == LAUNCHED"
            - "Lead.${ld_id}.status == APPLIED"
            - "EnrollmentCounselor.${co_id}.open_pipeline_count == 1"

      - name: course_faculty_review_is_gated_on_its_prerequisite_course_design_state
        grounds:
          - state_machines.Course.IN_DESIGN_to_FACULTY_REVIEW
          - validations[priority=20]
          - errors[ERR_COURSE_INVALID_DESIGN_STATE]
          - entities.Course.fields.prerequisite_course_id
        distinguishing_aspect: |
          A different entity pair — Course -> Course across the self-referential
          prerequisite edge rather than Lead -> Program: MBA-502 may not enter
          FACULTY_REVIEW while its prerequisite MBA-501 is still NOT_STARTED, and the very
          same request succeeds once MBA-501 itself reaches FACULTY_REVIEW.
        test_recipe:
          setup:
            - "EXECUTED Partnership and Program 'MBA Online' in DRAFT."
            - "Course MBA-501 created and left in design_status NOT_STARTED."
            - "Course MBA-502 created with prerequisite_course_id pointing at MBA-501 and moved to IN_DESIGN."
          setup_api_calls:
            - *c_clock_aug1
            - *c_ps_create
            - *c_ps_submit
            - *c_ps_execute
            - *c_pg_create
            - *c_course_create
            - &c_course2p_create
              call: "POST /programs/${pg_id}/courses"
              payload:
                course_code: "MBA-502"
                title: "Advanced Analytics"
                credits: 3
                content_owner: "PARTNER"
                design_cost_cents: 900000
                required_for_launch: false
                prerequisite_course_id: "${c1_id}"
