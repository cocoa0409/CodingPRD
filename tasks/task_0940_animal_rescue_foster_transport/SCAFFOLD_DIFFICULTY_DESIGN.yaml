              as: PlatformAdmin
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/foster-applications/${app_id}/home-check"
              payload: { result: "PASS", checked_at: "2026-05-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/animals"
              payload: { name: "Rex", species: "DOG", size_class: "LARGE", weight_lb: 65.0, date_of_birth: "2022-01-01T00:00:00Z", current_organization_id: "${org_id}" }
