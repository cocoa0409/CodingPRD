        grounds: [calculations.use_tax_liability, endpoints.POST /use-tax-purchases, entities.UseTaxPurchase]
        distinguishing_aspect: |
          A CAPITAL_ASSET first used outside the state for 8 months (>= the 6-month
          stepdown) must take fair_market_value_at_entry_cents 6000000 as the base,
          NOT purchase_price_cents 10000000: basis
          round_half_up(6000000*7500/10000) = 4500000, gross
          round_half_up(4500000*625/10000) = 281250, credit min(200000, 281250) =
          200000, due 81250. Skipping the stepdown gives basis 7500000 / gross
          468750 / due 268750, and apportioning after taxing gives a different
          rounding again.
