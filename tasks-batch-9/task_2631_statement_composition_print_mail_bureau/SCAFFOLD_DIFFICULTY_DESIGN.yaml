      - name: entry_facility_induction_windows_are_half_open_with_aggregate_tray_capacity
        grounds:
          - validations.priority_71_ERR_INDUCTION_CAPACITY_EXCEEDED
          - entities.EntryFacility.fields.tray_capacity_per_window
          - entities.EntryFacility.fields.committed_tray_count
          - state_machines.PresortBatch.SEALED_to_MANIFESTED
          - calculations.postage_cost
        distinguishing_aspect: |
          A different resource (EntryFacility dock capacity) under the opposite interval convention:
          induction windows are HALF-OPEN, so two windows that merely touch at an instant do not
          intersect and both fit under a tray_capacity_per_window of 1, while a genuinely overlapping
          window is refused — the aggregate is over already-MANIFESTED batches at that facility rather
          than over a single incumbent, which is why the second batch is measured against a sum.
