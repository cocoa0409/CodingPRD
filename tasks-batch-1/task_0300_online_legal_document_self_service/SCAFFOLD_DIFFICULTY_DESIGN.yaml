            - "Order.amount_refunded_cents == 6375 (review surcharge refunded by the cascade)"
            - "Order.net_collected_cents == 0 (money conserved; the charge/refund pair nets to zero, no drift)"

      - name: credit_invariant_consume_then_return_on_abandon
        grounds:
          - calculations.credit_conservation
          - state_machines.DocumentProject.IN_PROGRESS_to_ABANDONED
          - entities.Subscription.fields.credits_used
          - entities.Subscription.fields.credits_remaining
        distinguishing_aspect: |
          Conserved quantity = subscription document credits (a DIFFERENT conserved
          quantity than money). Forward (create project, credits_used +1) paired with
          compensating (ABANDON before assembly, credits_used -1) leaves credits_used
          equal to the count of credit-holding projects (no drift): 2 after 3 creates + 1 abandon.
        test_recipe:
          setup:
            - "STANDARD ACTIVE subscription (included_project_credits 3); create 3 projects (credits_used 3)"
          setup_api_calls:
            - call: "POST /legal/subscription-plans"
              payload: { tier: "STANDARD", monthly_fee_cents: 0, included_project_credits: 3, included_clause_count: 5, subscription_discount_pct: 0.15, review_discount_pct: 0.15 }
