        distinguishing_aspect: |
          The computed read forces BOTH variants over the same stored rows: the
          full-count total counts only the 9 imaged coupons (450) while the
          sampled total extrapolates the 41-coupon lot to 2050 and totals 2250.
          settled_gross_face_value_cents equals the sampled figure because that
          is the variant the big lot actually resolved to, and the endpoint is
          side-effect free, so the submission's version is identical before and
          after the call.
