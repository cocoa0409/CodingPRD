              as: Landlord
              as_user_id: "${ll_id}"
              captures: { case_id: $.data.id }
            - call: "POST /cases/${case_id}/transition"
              payload: { to_status: "SERVED" }
              as: Clerk
            - call: "POST /answers"
              payload: { case_id: "${case_id}", defenses: ["RENT_PAID"] }
              as: Tenant
              as_user_id: "${tn_id}"
            - call: "POST /referrals"
              payload: { case_id: "${case_id}", referral_type: "RENTAL_ASSISTANCE", provider_name: "RA" }
              as: Tenant
              as_user_id: "${tn_id}"
              captures: { ref_id: $.data.id }
            - call: "POST /referrals/${ref_id}/transition"
              payload: { to_status: "APPROVED" }
              as: ProgramAdmin
          trigger:
            - call: "POST /referrals/${ref_id}/transition"
              payload: { to_status: "DISBURSED" }
