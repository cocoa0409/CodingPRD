            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tp}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser, captures: { op1: $.data.id } }
            - { call: "POST /tech-packs/${tp}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tp}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 4 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /production-orders/${po}/plan", payload: { tech_pack_id: "${tp}" }, as: ProductionPlanner }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 41.3 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 4 }, as: CuttingManager, captures: { mk: $.data.id } }
            - { call: "POST /markers/${mk}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
            - { call: "POST /production-orders/${po}/start-cutting", payload: {}, as: ProductionPlanner }
            - { call: "POST /markers/${mk}/cut", payload: { size_quantities: [{ size: "M", qty: 4 }] }, as: CuttingManager }
            - { call: "GET /bundles?marker_id=${mk}", as: Any, captures: { b1: "$.data[0].id" } }
            - { call: "POST /bundles/${b1}/release", payload: {}, as: LineSupervisor }
            - { call: "POST /operators", payload: { employee_no: "E1", full_name: "Ann" }, as: LineSupervisor, captures: { opr: $.data.id } }
            - { call: "POST /sewing-lines", payload: { line_code: "L1", station_count: 2, shift_minutes: 480 }, as: ProductionPlanner, captures: { ln: $.data.id } }
            - { call: "POST /line-assignments", payload: { sewing_line_id: "${ln}", production_order_id: "${po}", operation_spec_id: "${op1}", operator_id: "${opr}", shift_date: "2026-08-03", start_minute: 480, end_minute: 580, assigned_pieces: 4 }, as: LineSupervisor }
          trigger:
            - { call: "POST /piece-work-entries", payload: { bundle_id: "${b1}", operation_spec_id: "${op1}", work_date: "2026-08-03", qty: 1 }, as: SewingOperator, as_user_id: "${opr}", captures: { pe: $.data.id } }
          assert:
            - "PieceWorkEntry.${pe}.operator_id == ${opr} (from X-User-ID, entity-backed identity)"
            - "PieceWorkEntry.${pe}.status == LOGGED"

  - section: cross_cutting_layers
    instances:
      - name: occ_tech_pack_review_stale_style_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[tech-pack-review-stale-style]"]
        distinguishing_aspect: "After pack A's approval advances Style.version 1->2, reviewing pack B with the pre-approval version 1 -> 412 ERR_STALE_VERSION; re-reading and retrying with version 2 succeeds."
        test_recipe:
          setup: ["style v1; pack A approved (style -> v2); pack B submitted"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-X1", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id, st_v: $.data.version } }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 1, base_measurements: [{ point: "chest", base_value_in: 20.0 }], grade_rules: [], labor_cost_cents_per_unit: 800, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tpA: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tpA}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 60, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tpA}/submit", payload: {}, as: Merchandiser }
            - { call: "POST /tech-packs/${tpA}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1 }
            - { call: "POST /tech-packs", payload: { style_id: "${st}", version_no: 2, base_measurements: [{ point: "chest", base_value_in: 20.5 }], grade_rules: [], labor_cost_cents_per_unit: 810, fabric_cost_cents_per_unit: 500 }, as: Merchandiser, as_user_id: u-m1, captures: { tpB: $.data.id } }
            - { call: "POST /operation-specs", payload: { tech_pack_id: "${tpB}", sequence_no: 1, name: "join", machine_type: "MANUAL", sam_seconds: 58, piece_rate_cents: 10 }, as: Merchandiser }
            - { call: "POST /tech-packs/${tpB}/submit", payload: {}, as: Merchandiser }
          trigger:
            - { call: "POST /tech-packs/${tpB}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v}" }, as: PlantManager, as_user_id: u-pm1, captures: { err: $.data.error_id } }
            - { call: "GET /styles/${st}", as: Any, captures: { st_v2: $.data.version } }
            - { call: "POST /tech-packs/${tpB}/review", payload: { decision: "APPROVE", expected_style_version: "${st_v2}" }, as: PlantManager, as_user_id: u-pm1 }
          assert:
            - "first attempt: err == ERR_STALE_VERSION (412); TechPack.${tpB} still PENDING_APPROVAL"
            - "retry with fresh version succeeds: TechPack.${tpB} APPROVED; ${tpA} SUPERSEDED"

      - name: occ_marker_approve_stale_roll_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[marker-approve-stale-roll]"]
        distinguishing_aspect: "After marker m1's approval advances FabricRoll.version 2->3, approving marker m2 with the stale version 2 -> 412 ERR_STALE_VERSION, even though the remaining 41.3 yards would exactly suffice for m2."
        test_recipe:
          setup: ["order; roll 82.6 AVAILABLE (v2); markers m1, m2 DRAFT (40.0 each); m1 approved (roll -> v3)"]
          setup_api_calls:
            - { call: "POST /styles", payload: { style_code: "ST-X2", base_size: "M", size_run: ["M"], declared_fabric_domestic: true, target_content_claim: "NONE" }, as: Merchandiser, captures: { st: $.data.id } }
            - { call: "POST /production-orders", payload: { style_id: "${st}", color: "navy", size_quantities: [{ size: "M", qty: 200 }] }, as: ProductionPlanner, captures: { po: $.data.id } }
            - { call: "POST /fabric-rolls", payload: { roll_code: "R1", fabric_code: "DEN", origin_country: "US", cost_cents_per_yard: 200, received_yards: 82.6 }, as: MaterialsPlanner, captures: { fr: $.data.id } }
            - { call: "POST /fabric-rolls/${fr}/record-qc", payload: { result: "PASS" }, as: MaterialsPlanner, captures: { fr_v: $.data.version } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 100 }, as: CuttingManager, captures: { mk1: $.data.id } }
            - { call: "POST /markers", payload: { production_order_id: "${po}", fabric_roll_id: "${fr}", marker_length_yards: 40.0, planned_pieces: 100 }, as: CuttingManager, captures: { mk2: $.data.id } }
            - { call: "POST /markers/${mk1}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager }
          trigger:
            - { call: "POST /markers/${mk2}/approve", payload: { expected_fabric_roll_version: "${fr_v}" }, as: CuttingManager, captures: { err: $.data.error_id } }
            - { call: "GET /fabric-rolls/${fr}", as: Any, captures: { fr_v3: $.data.version } }
            - { call: "POST /markers/${mk2}/approve", payload: { expected_fabric_roll_version: "${fr_v3}" }, as: CuttingManager }
          assert:
            - "stale attempt: err == ERR_STALE_VERSION; Marker.${mk2} still DRAFT"
            - "retry with fresh version succeeds (82.6 - 41.3 = 41.3 >= 41.3, equality allowed): Marker.${mk2} APPROVED"

      - name: occ_payroll_calculate_stale_run_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[payroll-calculate-stale-run]"]
        distinguishing_aspect: "calculate -> decide REJECT (back to OPEN) -> second calculate carrying the ORIGINAL version 1: 412 even though the run is legitimately OPEN again and re-calculation is allowed."
        test_recipe:
          setup: ["run v1; calculated (v2, CALCULATED); rejected by u-pm1 (v3, OPEN)"]
          setup_api_calls:
            - { call: "POST /payroll-runs", payload: { period_start: "2026-08-01", period_end: "2026-08-31" }, as: PayrollClerk, as_user_id: u-pc1, captures: { pr: $.data.id, pr_v: $.data.version } }
            - { call: "POST /payroll-runs/${pr}/calculate", payload: { expected_payroll_run_version: "${pr_v}" }, as: PayrollClerk, as_user_id: u-pc1 }
            - { call: "POST /payroll-runs/${pr}/decide", payload: { decision: "REJECT" }, as: PlantManager, as_user_id: u-pm1 }
          trigger:
            - { call: "POST /payroll-runs/${pr}/calculate", payload: { expected_payroll_run_version: "${pr_v}" }, as: PayrollClerk, as_user_id: u-pc1, captures: { err: $.data.error_id } }
            - { call: "GET /payroll-runs/${pr}", as: Any, captures: { pr_v3: $.data.version } }
            - { call: "POST /payroll-runs/${pr}/calculate", payload: { expected_payroll_run_version: "${pr_v3}" }, as: PayrollClerk, as_user_id: u-pc1 }
          assert:
            - "stale attempt: err == ERR_STALE_VERSION (state alone would have permitted it)"
            - "retry with fresh version succeeds: status CALCULATED"

      - name: cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: audit_fail_cascade_to_logged_entry_rejection
          rationale: "Depth-4 cascade asserted hop-by-hop in the named §1.8 instance (plus payroll_pay_cascade_to_operator_metrics for the second trigger)."

      - name: derived_fields_reconcile_after_plan_and_finish
        claim_type: derived_field_reconciliation
        grounds: [complexity_profile.complexity_layers, entities.TrimItem.fields.qty_reserved]
        excluded_because:
          difficulty_instance: trim_units_plan_finish_conservation
          rationale: "qty_reserved/qty_available reconciled after reservation and release in the named §1.8 instance."

      - name: dual_variant_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: piece_rate_straight_vs_guaranteed_minimum
          rationale: "Both payroll variants asserted with literals in the named §1.8 instance (plus domestic_content_cost_basis_vs_unit_basis and marker_utilization_gross_vs_net)."

  - section: consistency_model
    instances:
      - name: mutations_visible_in_same_request_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        excluded_because:
          difficulty_instance: fabric_approve_at_exact_available_then_depleted
          rationale: "Immediate visibility of allocation/consumption and the auto-DEPLETED transition asserted within the named §1.8 instance's own trigger responses; marker_approve_response_reflects_mutation_immediately (endpoints section) covers the response-body side."
