            - { call: "POST /mfg/ingredient-lots", payload: { ingredient_id: "${disc}", supplier_id: "${supp}", lot_code: "D-1", received_qty_kg: 10, received_at: "2026-08-01T00:00:00Z" }, as: PlantAdmin, captures: { e1: "$.data.error_id" } }
            - { call: "POST /mfg/revisions/${rd}/submit", payload: {}, as: FormulationScientist, captures: { e2: "$.data.error_id" } }
            - { call: "POST /mfg/formulas", payload: { customer_id: "${c2}", name: "FX", bar_weight_g: 50 }, as: FormulationScientist, captures: { e3: "$.data.error_id" } }
            - { call: "POST /mfg/formulas/${fa}/revisions", payload: { ingredient_lines: [{ ingredient_id: "${disc}", qty_kg_per_batch: 10, is_protein_contributor: false }], batch_size_kg: 50, target_protein_g_per_serving: 0, claim_tags: [] }, as: FormulationScientist, captures: { e4: "$.data.error_id" } }
          assert:
            - "lot from PROVISIONAL supplier -> ERR_SUPPLIER_NOT_QUALIFIED (422)"
            - "submit of revision containing DISCONTINUED ingredient -> ERR_INGREDIENT_DISCONTINUED (422)"
            - "formula create for SUSPENDED customer -> ERR_CUSTOMER_SUSPENDED (422)"
