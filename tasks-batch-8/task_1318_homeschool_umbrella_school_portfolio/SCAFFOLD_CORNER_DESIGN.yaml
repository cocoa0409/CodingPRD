            - { call: "POST /notices/${noi}/file", payload: {}, as: Parent, as_user_id: "${fam}" }
            - { call: "POST /notices/${noi}/acknowledge", payload: {}, as: Registrar }
            - { call: "POST /academic-years/${yr}/run-compliance-sweep", payload: {}, as: AcademicDirector }
            - { call: "GET /enrollments/${enr}", payload: {}, as: Registrar, captures: { std2: $.data.compliance_standing } }
          assert:
            - "after first sweep (2026-09-16 > deadline, no ACKNOWLEDGED notice): compliance_standing == NONCOMPLIANT"
            - "after file + acknowledge + second sweep: compliance_standing == GOOD_STANDING (hard violation cleared, no soft violation: 2026-09-16 precedes portfolio_due_date and mid_year_date)"
