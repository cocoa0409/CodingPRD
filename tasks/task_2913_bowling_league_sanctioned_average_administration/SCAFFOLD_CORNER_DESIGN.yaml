# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml - task 2913 Bowling League & Sanctioned Average
# Administration
#
# §1.9 breadth probe. Walked row-by-row through
# references/claim-extraction-guide.md's nine sections against this scaffold's
# §1.1-§1.7 surface. Every one of the 57 §1.6 error ids is triggered at least
# once across §1.8 + §1.9; corners already asserted by a §1.8 instance are
# emitted as `excluded_because:` stubs naming that instance.
#
# CONFIG-B (the bylaw set shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml, quoted
# here so each recipe is readable standalone):
#   handicap_base 220, handicap_percentage 0.90, handicap_percentage_youth 0.80,
#   max_handicap_per_game 60, handicap_average_basis CURRENT,
#   minimum_games_for_average 9, carryover_policy BLENDED,
#   vacancy_average 120, vacancy_score 120, absentee_deduction 10,
#   lineup_positions 2, legal_lineup_minimum 2, max_vacancy_slots_per_lineup 1,
#   weekly_dues_cents 1200, weekly_expense_cents 500, max_dues_arrears_weeks 2,
#   prize_place_weights [0.60, 0.40], declared_team_count 2, total_weeks 2.
#
# Pinned CONFIG-B literals reused below (all computed by code):
#   entering handicaps  180 -> 36, 195 -> 22, 170 -> 45, 160 -> 54
#   Team.team_handicap_per_game  team1 58, team2 99
#   VACANCY slot handicap  min(60, floor((220 - 120) * 0.90)) = 60
#   ABSENTEE slot handicap for a 195 adult  floor((220 - 185) * 0.90) = 31
# =============================================================================

scaffold_corner_design:

  # ==========================================================================
  # SECTION 1 - entities  (claim-extraction-guide Table 1)
  # ==========================================================================
  - section: entities
    instances:

      - name: corner_member_creation_returns_declared_and_system_fields
        claim_type: creation
        grounds:
          - entities.Member.fields.member_class
          - entities.Member.fields.national_member_number
          - entities.Member.fields.sanctioned_membership_count
        distinguishing_aspect: "POST /members with all three required inputs returns 201 with the three inputs echoed, national_member_number null (no membership is sanctioned yet), sanctioned_membership_count 0 and a server-minted id."
        test_recipe:
          setup:
            - "Empty database with the logical clock pinned to 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AssociationOfficer
          trigger:
            - call: "POST /members"
              payload: { full_name: "Ivy Novice", email: "ivy@bowl.test", member_class: "YOUTH" }
              as: AssociationOfficer
              captures: { ivy_id: "$.data.id" }
            - call: "GET /members/${ivy_id}"
              payload: {}
              as: AssociationOfficer
          assert:
            - "the POST returns 201 with data.full_name == 'Ivy Novice', data.email == 'ivy@bowl.test' and data.member_class == 'YOUTH'"
            - "data.national_member_number == null - the number is minted only when this member's first Membership is sanctioned"
            - "data.sanctioned_membership_count == 0 and data.version == 1"
            - "data.id is a non-empty string and data.created_at is a non-null ISO-8601 instant"
            - "the GET returns 200 and every field of data equals the POST response body byte for byte"

      - name: corner_league_system_and_computed_defaults_before_bylaws
        claim_type: defaults
        grounds:
          - entities.League.fields.status
          - entities.League.fields.total_weeks
          - entities.League.fields.bylaws_adopted_at
          - entities.League.fields.confirmed_team_count
          - entities.League.fields.certified_week_high_water
        distinguishing_aspect: "A freshly created League sits at every declared default - status FORMING, total_weeks 0, sanctioned_member_count 0, confirmed_team_count 0, certified_week_high_water 0 - and every bylaw field is still null because bylaws are adopted by a separate call."
        test_recipe:
          setup:
            - "Two members exist to serve as secretary and treasurer; the logical clock is 2026-08-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: AssociationOfficer
            - call: "POST /members"
              payload: { full_name: "Ann Secretary", email: "sec@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { sec_id: "$.data.id" }
            - call: "POST /members"
              payload: { full_name: "Bob Treasurer", email: "tre@bowl.test", member_class: "ADULT" }
              as: AssociationOfficer
              captures: { tre_id: "$.data.id" }
          trigger:
            - call: "POST /leagues"
              payload: { name: "Monday Mixed", season_year: 2026, center_name: "Cedar Lanes", declared_team_count: 2, organizational_meeting_at: "2026-08-05T00:00:00Z", secretary_member_id: "${sec_id}", treasurer_member_id: "${tre_id}" }
              as: LeagueSecretary
              as_user_id: "${sec_id}"
              captures: { lg_id: "$.data.id" }
            - call: "GET /leagues/${lg_id}"
              payload: {}
              as: LeagueSecretary
              as_user_id: "${sec_id}"
          assert:
            - "the POST returns 201 with data.status == 'FORMING' and data.version == 1"
            - "data.total_weeks == 0, data.sanctioned_member_count == 0, data.confirmed_team_count == 0 and data.certified_week_high_water == 0"
            - "data.bylaws_adopted_at == null"
            - "data.handicap_base == null, data.handicap_percentage == null, data.minimum_games_for_average == null and data.prize_place_weights == null"
            - "data.declared_team_count == 2, data.secretary_member_id == ${sec_id} and data.treasurer_member_id == ${tre_id}"
            - "the GET returns the same status FORMING - no background job promotes the league"

      - name: corner_membership_listing_filters_and_pagination_envelope
        claim_type: listing
        grounds:
          - entities.Membership.fields.sanction_status
          - entities.Membership.fields.team_id
          - entities.League.fields.sanctioned_member_count
        distinguishing_aspect: "GET /memberships honours league_id, team_id and sanction_status filters together and reports total_count / has_more against the FILTERED set, not the whole table: 4 SANCTIONED rows for the league, 2 for team 1, and limit=2&offset=2 returns the trailing 2 rows with has_more false."
