  - name: compensation_cancel_reverses_every_release_side_effect
    claim_type: compensation
    grounds:
    - state_machines.PurchaseCommitment.COMMITTED_to_CANCELLED
    - entities.Project.fields.escalation_contingency_committed
    excluded_because:
      difficulty_instance: compensating_invariant / cancel_returns_the_escalation_contingency_ledger_to_zero
      rationale: 'The §1.8 instance is exactly this compensation claim: it cancels a released commitment and asserts the ledger returns to 0.00 / 500000.00 with no drift.'
  - name: cyclic_negotiation_loops_countered_back_to_proposed
    claim_type: cyclic
    grounds:
    - state_machines.EscalationAgreement.PROPOSED_to_COUNTERED
    - state_machines.EscalationAgreement.COUNTERED_to_PROPOSED
    - entities.EscalationAgreement.fields.round_number
    excluded_because:
      difficulty_instance: non_linear_state_machine / negotiation_cycle_returns_to_proposed_and_stops_at_three_rounds
      rationale: The §1.8 instance walks the full cycle and pins the MAX_NEGOTIATION_ROUNDS termination condition.
  - name: parallel_delivery_axis_moves_without_the_contractual_axis
    claim_type: parallel
    grounds:
    - state_machines.PurchaseCommitment.STORED_OFFSITE_to_STORAGE_NONCOMPLIANT
    - state_machines.PurchaseCommitment.STORAGE_NONCOMPLIANT_to_STORED_OFFSITE
    excluded_because:
      difficulty_instance: non_linear_state_machine / commitment_delivery_axis_cycles_while_commitment_status_holds_committed
      rationale: The §1.8 instance asserts the independence of the two axes directly, including that commitment_status never leaves COMMITTED.
  - name: cross_entity_document_revocation_suspends_the_arrangement
    claim_type: cross_entity
    grounds:
    - state_machines.OffsiteStorageArrangement.ACTIVE_to_SUSPENDED
    - state_machines.PurchaseCommitment.STORED_OFFSITE_to_STORAGE_NONCOMPLIANT
    excluded_because:
      difficulty_instance: transitive_cascade / document_revocation_suspends_arrangement_and_flags_posture
      rationale: The §1.8 instance is the three-hop revoke cascade and asserts every intermediate row.
  - name: ledger_sync_release_debits_the_project_contingency
    claim_type: ledger_sync
    grounds:
    - state_machines.PurchaseCommitment.SCHEDULED_to_RELEASED_FOR_FAB
    - entities.Project.fields.escalation_contingency_remaining
    excluded_because:
      difficulty_instance: dual_variant_calc / escalation_provisional_at_release_versus_final_at_delivery
      rationale: The §1.8 instance asserts the ancestor ledger before and after both variants, including the 22258.02 delta on the switch.
- section: calculations
  instances:
  - name: correct_result_lead_time_and_release_date_derive_from_three_day_counts
    claim_type: correct_result
    grounds:
    - calculations.release_for_fabrication_schedule
    - entities.MaterialPackage.fields.lead_time_days
    - entities.MaterialPackage.fields.release_for_fabrication_date
    distinguishing_aspect: 'All four derived schedule fields land in one create: 21 + 70 + 20 = 111 lead days counted back from required_onsite_date 2027-03-01 puts release_for_fabrication_date at 2026-11-10, giving float_days 101 and rff_risk_band ON_TRACK at the startup clock.'
    test_recipe:
      setup:
      - A project with no packages
      - Clock at its 2026-08-01T00:00:00Z startup default
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      trigger:
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      assert:
      - the trigger returns HTTP 201
      - MaterialPackage.${pkg_id}.lead_time_days == 111
      - MaterialPackage.${pkg_id}.release_for_fabrication_date == "2026-11-10T00:00:00.000Z"
      - MaterialPackage.${pkg_id}.is_long_lead == true
      - MaterialPackage.${pkg_id}.float_days == 101
      - MaterialPackage.${pkg_id}.rff_risk_band == ON_TRACK
      - MaterialPackage.${pkg_id}.status == IDENTIFIED and open_quote_count == 0
  - name: input_set_filtering_float_days_recomputes_on_the_clock_without_a_package_write
    claim_type: input_set_filtering
    grounds:
    - calculations.release_for_fabrication_schedule
    - entities.MaterialPackage.fields.float_days
    - endpoints[POST /procurement/_clock/set_current_utc]
    distinguishing_aspect: 'The calculation''s input set is the package row PLUS the clock: advancing the clock to the release date alone flips float_days 101 -> 0 and rff_risk_band ON_TRACK -> CRITICAL on the very next read, while the clock-independent fields (lead_time_days, release_for_fabrication_date, is_long_lead) do not move and updated_at is untouched.'
    test_recipe:
      setup:
      - One steel package with release_for_fabrication_date 2026-11-10 read once at the startup clock
      - No PATCH is issued against the package at any point
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
        as: BuyoutManager
      trigger:
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-11-10T00:00:00.000Z'}
        as: BuyoutManager
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
        as: BuyoutManager
      assert:
      - the first read (setup) reported float_days == 101 and rff_risk_band == ON_TRACK
      - the clock trigger returns HTTP 200 with current_utc == "2026-11-10T00:00:00.000Z"
      - the clock response's stalled_package_ids is empty (the package is IDENTIFIED, not SOURCING)
      - MaterialPackage.${pkg_id}.float_days == 0
      - MaterialPackage.${pkg_id}.rff_risk_band == CRITICAL
      - MaterialPackage.${pkg_id}.release_for_fabrication_date == "2026-11-10T00:00:00.000Z" (unchanged)
      - MaterialPackage.${pkg_id}.lead_time_days == 111 and is_long_lead == true (unchanged)
  - name: precision_float_days_floors_toward_negative_infinity_on_a_half_day
    claim_type: precision
    grounds:
    - calculations.release_for_fabrication_schedule
    - entities.MaterialPackage.fields.float_days
    distinguishing_aspect: 'float_days is a floor, not a truncation or a round: at 2026-11-09T12:00Z the remaining 0.5 day floors to 0 (CRITICAL, not 1 / AT_RISK) and at 2026-11-25T12:00Z the -15.5 day span floors to -16, not -15.'
    test_recipe:
      setup:
      - One steel package with release_for_fabrication_date 2026-11-10T00:00:00.000Z
      - The clock is only ever moved forward (a rewind would be ERR_CLOCK_REWIND)
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
        as: BuyoutManager
        captures: {proj_id: $.data.id}
      - call: POST /procurement/material-packages
        payload: {project_id: '${proj_id}', scope_code: STRUCT-STEEL-01, description: Structural steel frame package, commodity_index_code: PPI_STEEL_MILL, estimated_cost: '1200000.00', required_onsite_date: '2027-03-01T00:00:00.000Z', fabrication_duration_days: 70, delivery_transit_days: 20, submittal_review_days: 21}
        as: BuyoutManager
        captures: {pkg_id: $.data.id}
      trigger:
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-11-09T12:00:00.000Z'}
        as: BuyoutManager
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
        as: BuyoutManager
      - call: POST /procurement/_clock/set_current_utc
        payload: {to_iso8601: '2026-11-25T12:00:00.000Z'}
        as: BuyoutManager
      - call: GET /procurement/material-packages/${pkg_id}
        payload: {}
        as: BuyoutManager
      assert:
      - after the first clock hop MaterialPackage.${pkg_id}.float_days == 0 (not 1)
      - after the first clock hop MaterialPackage.${pkg_id}.rff_risk_band == CRITICAL (not AT_RISK)
      - after the second clock hop MaterialPackage.${pkg_id}.float_days == -16 (not -15)
      - after the second clock hop MaterialPackage.${pkg_id}.rff_risk_band == CRITICAL
      - MaterialPackage.${pkg_id}.lead_time_days == 111 across both reads
  - name: constants_applied_long_lead_threshold_uses_fabrication_plus_transit_only
    claim_type: constants_applied
    grounds:
    - calculations.release_for_fabrication_schedule.constants.LONG_LEAD_THRESHOLD_DAYS
    - entities.MaterialPackage.fields.is_long_lead
    excluded_because:
      difficulty_instance: boundary_precision_check / long_lead_threshold_inclusive_at_exactly_ninety_days
      rationale: The §1.8 instance pins the 90-day constant at 90 and 89 and proves submittal_review_days is excluded from the classification while still counting in lead_time_days.
  - name: threshold_deadband_absorbs_a_two_percent_move_and_the_next_cent_escapes_it
    claim_type: threshold
    grounds:
    - calculations.escalation_adjustment
    - entities.EscalationAgreement.fields.deadband_pct
    - entities.PurchaseCommitment.fields.escalation_accrued
    distinguishing_aspect: The deadband is a subtraction floored at zero, so an index move of exactly 2.0000 pct against a deadband_pct of 2.0 accrues 0.00 while a 2.0500 pct move on an identically priced PO accrues 345.00 — the threshold-and-one-cent-above pair on the same formula.
    test_recipe:
      setup:
      - Two packages on one project, each with a 1150000.00 quote from Ironworks Fabricators LLC and an EXECUTED clause at deadband 2.0 / cap 8.0 / contractor share 40.0
      - PPI_STEEL_MILL moves 310.00 (2026-07 baseline) -> 316.20 (2026-08), exactly +2.0000 pct
      - PPI_COPPER_WIRE moves 200.00 (2026-07 baseline) -> 204.10 (2026-08), +2.0500 pct
      - Both commitments are released for fabrication at clock 2026-08-05, so the provisional look-back selects the 2026-08 readings
      setup_api_calls:
      - call: POST /procurement/projects
        payload: {name: Riverside Medical Tower, contract_number: GC-2996-A, owner_name: Riverside Health System, schedule_data_date: '2026-08-01T00:00:00.000Z', escalation_contingency_budget: '500000.00'}
