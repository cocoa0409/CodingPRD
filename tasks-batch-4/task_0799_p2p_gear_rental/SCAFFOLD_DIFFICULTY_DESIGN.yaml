          Listing resource, half-open [start,end) aggregate-capacity semantics: a back-to-back booking
          (start == prior end, 2026-06-08) is ACCEPTED on a quantity-1 listing (adjacency allowed), but an
          overlapping window is REJECTED with ERR_LISTING_UNAVAILABLE. Interval math = half-open + capacity count.
        test_recipe:
          setup:
            - "Verified renter, quantity-1 ACTIVE listing base 10000. Renter books 2026-06-01..2026-06-08, then books the ADJACENT window 2026-06-08..2026-06-15 (accepted, proving adjacency)."
