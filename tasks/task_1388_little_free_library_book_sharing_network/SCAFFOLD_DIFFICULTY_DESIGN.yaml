# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Little Free Library & Book Sharing Network
# 9 rule groups x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and is replayable from empty-DB via §1.5 endpoints.
# Conventions:
#   - Logical clock pinned to 2026-08-01T00:00:00Z unless the instance moves it.
#   - Moderators are pinned as "mod-1"/"mod-2"/"mod-3" so segregation-of-duties
#     actor identity is observable; NetworkAdmin is "admin-1"/"admin-2";
#     HubCoordinator is "hub-1".
#   - All asserted numbers were computed by executing the §1.3 formulas by hand.
# =============================================================================
scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: recognition_rolling_vs_lifetime_window_ageout
        grounds:
          - calculations.recognition_points
          - entities.Steward.fields.lifetime_points
          - entities.Steward.fields.rolling_points
          - entities.Steward.fields.recognition_tier
        distinguishing_aspect: |
          Same RecognitionEvent log produces lifetime_points == 65 and rolling_points == 40:
          the +25 TRAINING_PASSED event at 2025-01-01 falls outside the closed 365-day rolling
          window [now-365d, now] evaluated at 2026-08-01, so the rolling variant excludes it
          while the lifetime variant counts it. Steward-domain dual variant; tier keys off
          rolling only (stays NONE at 40 even though lifetime is 65).
        test_recipe:
          setup:
            - "Steward registered and ORIENTATION-completed at clock 2025-01-01T00:00:00Z (+25 points), then activated"
            - "One ACTIVE LISTED box owned by the steward"
            - "One maintenance request REPORTED at 2025-01-01 (WINTER season)"
            - "Clock advanced to 2026-08-01T00:00:00Z; rolling window is [2025-08-01T00:00:00Z, 2026-08-01T00:00:00Z]; the +25 event has aged out"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-01-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Ada Lovelace", email: "ada@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Maple St Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/maintenance-requests", payload: { box_id: "${box}", category: "WEAR", description: "Roof seam splitting" }, as: Anonymous, captures: { mr: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/maintenance-requests/${mr}/triage", payload: { severity: "LOW", scheduled_date: "2026-08-02" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "GET /library-network/stewards/${stw}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1", captures: { pre_rolling: "$.data.rolling_points", pre_lifetime: "$.data.lifetime_points" } }
          trigger:
            - { call: "POST /library-network/maintenance-requests/${mr}/resolve", payload: { outcome: "RESOLVED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "GET /library-network/stewards/${stw}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "Before resolve: Steward.${stw}.rolling_points == 0 (captured ${pre_rolling}) and lifetime_points == 25 (captured ${pre_lifetime}) — the aged-out +25 event counts only in lifetime"
            - "After resolve: Steward.${stw}.lifetime_points == 65 (25 + 40)"
            - "After resolve: Steward.${stw}.rolling_points == 40 (only the 2026-08-01 MAINTENANCE_RESOLVED event is inside the window)"
            - "Steward.${stw}.recognition_tier == NONE because tier keys off rolling_points (40 < 100), not lifetime_points (65)"

      - name: drive_fulfillment_gross_vs_net_quarantine
        grounds:
          - calculations.drive_fulfillment
          - entities.BookDrive.fields.fulfillment_pct_gross
          - entities.BookDrive.fields.fulfillment_pct_net
          - entities.BookDrive.fields.qualifies_for_bonus
          - state_machines.BookItem.PLACED_to_QUARANTINED
        distinguishing_aspect: |
          Identical collected items produce fulfillment_pct_gross == 100 and
          fulfillment_pct_net == 50: gross counts all 4 collected items while net excludes the
          2 QUARANTINED ones. BookDrive-domain dual variant (distinct entity domain from the
          Steward recognition variants); the variant also flips the completion recognition
          event from +150 to +50 because qualifies_for_bonus keys off net.
        test_recipe:
          setup:
            - "ACTIVE steward with an ACTIVE LISTED box (capacity 10, region OR)"
            - "ACTIVE school with empty restricted_categories; drive goal_books 4, window [2026-08-01T00:00:00Z, 2026-08-20T00:00:00Z), both approvals APPROVED, swept to OPEN, linked batch exists"
            - "Linked batch holds 4 graded items created in array order: C1 CHILDREN, C2 CHILDREN, F1 FICTION, F2 FICTION; batch SORTED"
            - "Distribution run confirmed and dispatched: all 4 items DISPATCHED to the box; C1 and C2 received (PLACED), F1 and F2 remain DISPATCHED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Grace Hopper", email: "grace@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Oak Ave Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/schools", payload: { name: "Ridgeview Elementary", district_code: "D-7", contact_email: "liaison@ridgeview.edu", region_code: "OR", restricted_categories: [] }, as: NetworkAdmin, as_user_id: "admin-1", captures: { sch: "$.data.id" } }
            - { call: "POST /library-network/schools/${sch}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/drives", payload: { school_id: "${sch}", goal_books: 4, starts_at: "2026-08-01T00:00:00Z", ends_at: "2026-08-20T00:00:00Z" }, as: Steward, as_user_id: "${stw}", captures: { drv: "$.data.id" } }
            - { call: "POST /library-network/drives/${drv}/school-decision", payload: { decision: "APPROVE" }, as: SchoolLiaison, as_user_id: "${sch}" }
            - { call: "POST /library-network/drives/${drv}/network-decision", payload: { decision: "APPROVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/map/sweeps", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "GET /library-network/batches?drive_id=${drv}", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { d_batch: "$.data[0].id" } }
            - { call: "POST /library-network/batches/${d_batch}/items", payload: { items: [ { title: "C1", category: "CHILDREN", condition_grade: "A" }, { title: "C2", category: "CHILDREN", condition_grade: "B" }, { title: "F1", category: "FICTION", condition_grade: "A" }, { title: "F2", category: "FICTION", condition_grade: "B" } ] }, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/batches/${d_batch}/sort-complete", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { d_batch_v: "$.data.version" } }
            - { call: "POST /library-network/batches/${d_batch}/distribution-runs", payload: { expected_batch_version: "${d_batch_v}" }, as: HubCoordinator, as_user_id: "hub-1", captures: { run: "$.data.id" } }
            - { call: "POST /library-network/distribution-runs/${run}/confirm", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/distribution-runs/${run}/allocations", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { a_c1: "$.data[0].id", a_c2: "$.data[1].id" } }
            - { call: "POST /library-network/distribution-runs/${run}/dispatch", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/allocations/${a_c1}/receive", payload: {}, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/allocations/${a_c2}/receive", payload: {}, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/drives/${drv}/status", payload: { target_status: "COLLECTION_CLOSED" }, as: Steward, as_user_id: "${stw}" }
          trigger:
            - { call: "POST /library-network/complaints", payload: { box_id: "${box}", category: "INAPPROPRIATE_CONTENT", description: "Age-inappropriate children's books", target_category: "CHILDREN" }, as: Anonymous, captures: { cmp: "$.data.id" } }
            - { call: "POST /library-network/complaints/${cmp}/triage", payload: {}, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/complaints/${cmp}/respond", payload: { response_text: "I will pull the flagged titles." }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/complaints/${cmp}/resolve", payload: { outcome: "UPHELD", resolution_notes: "Confirmed guideline breach" }, as: Moderator, as_user_id: "mod-2" }
            - { call: "POST /library-network/drives/${drv}/status", payload: { target_status: "COMPLETED" }, as: Steward, as_user_id: "${stw}" }
            - { call: "GET /library-network/drives/${drv}", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
          assert:
            - "BookDrive.${drv}.collected_count == 4"
            - "BookDrive.${drv}.fulfillment_pct_gross == 100 (floor(4*100/4); QUARANTINED items still count)"
            - "BookDrive.${drv}.fulfillment_pct_net == 50 (floor(2*100/4); the 2 QUARANTINED CHILDREN items are excluded, the 2 DISPATCHED FICTION items still count)"
            - "BookDrive.${drv}.qualifies_for_bonus == false (50 < 80)"
            - "Steward.${stw} recognition log contains exactly one DRIVE_COMPLETED event with points_delta == 50 (not 150)"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes: (a) multi-input non-linear, (b) rounding order)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: need_score_ranking_quantity_and_region_bonus
        grounds:
          - calculations.need_score
          - entities.DistributionRun.fields.plan_snapshot
          - entities.DistributionRun.fields.planned_item_count
        distinguishing_aspect: |
          Mode (a): need_score combines >= 3 inputs (capacity_remaining, days_since_activity,
          region match) with nested min() clamps and a conditional +20 region bonus; the plan
          allocates in ranked order with per-box quantity min(capacity_remaining, 10, remaining).
          Distinct mode from parts_reimbursement_per_line_rounding_order (mode b).
          Scores computed from the formula: A = min(10,10)*2 + 0 + 20 = 40, B = min(6,10)*2 + 0 + 20 = 32,
          C = min(20,10)*2 + 0 + 0 = 20; with 12 items: A gets 10, B gets min(6,10,2) = 2, C gets 0 and is dropped.
        test_recipe:
          setup:
            - "Three ACTIVE stewards, each with one ACTIVE LISTED box activated at clock 2026-08-01T00:00:00Z (days_since_activity == 0 for all)"
            - "Box A capacity 10 region OR; box B capacity 6 region OR; box C capacity 20 region CA"
            - "One PUBLIC_DROP batch in region OR with 12 graded AVAILABLE FICTION items, SORTED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Steward A", email: "sa@example.org", region_code: "OR" }, as: Anonymous, captures: { stw_a: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw_a}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw_a}" }
            - { call: "POST /library-network/stewards/${stw_a}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/stewards", payload: { full_name: "Steward B", email: "sb@example.org", region_code: "OR" }, as: Anonymous, captures: { stw_b: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw_b}/training-completions", payload: { module_id: "${mod_ori}", score: 88 }, as: Steward, as_user_id: "${stw_b}" }
            - { call: "POST /library-network/stewards/${stw_b}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/stewards", payload: { full_name: "Steward C", email: "sc@example.org", region_code: "CA" }, as: Anonymous, captures: { stw_c: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw_c}/training-completions", payload: { module_id: "${mod_ori}", score: 85 }, as: Steward, as_user_id: "${stw_c}" }
            - { call: "POST /library-network/stewards/${stw_c}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw_a}", name: "Box A", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw_a}", captures: { box_a: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box_a}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box_a}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box_a}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw_b}", name: "Box B", latitude: 45.53, longitude: -122.69, capacity_books: 6, region_code: "OR" }, as: Steward, as_user_id: "${stw_b}", captures: { box_b: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box_b}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box_b}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box_b}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw_c}", name: "Box C", latitude: 34.05, longitude: -118.24, capacity_books: 20, region_code: "CA" }, as: Steward, as_user_id: "${stw_c}", captures: { box_c: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box_c}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box_c}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box_c}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/batches", payload: { source_type: "PUBLIC_DROP", region_code: "OR" }, as: HubCoordinator, as_user_id: "hub-1", captures: { batch: "$.data.id" } }
            - { call: "POST /library-network/batches/${batch}/items", payload: { items: [ { title: "T01", category: "FICTION", condition_grade: "A" }, { title: "T02", category: "FICTION", condition_grade: "A" }, { title: "T03", category: "FICTION", condition_grade: "B" }, { title: "T04", category: "FICTION", condition_grade: "B" }, { title: "T05", category: "FICTION", condition_grade: "A" }, { title: "T06", category: "FICTION", condition_grade: "C" }, { title: "T07", category: "FICTION", condition_grade: "B" }, { title: "T08", category: "FICTION", condition_grade: "A" }, { title: "T09", category: "FICTION", condition_grade: "B" }, { title: "T10", category: "FICTION", condition_grade: "A" }, { title: "T11", category: "FICTION", condition_grade: "C" }, { title: "T12", category: "FICTION", condition_grade: "B" } ] }, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "POST /library-network/batches/${batch}/sort-complete", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
            - { call: "GET /library-network/batches/${batch}", payload: {}, as: HubCoordinator, as_user_id: "hub-1", captures: { b_v: "$.data.version" } }
          trigger:
            - { call: "POST /library-network/batches/${batch}/distribution-runs", payload: { expected_batch_version: "${b_v}" }, as: HubCoordinator, as_user_id: "hub-1", captures: { run: "$.data.id" } }
            - { call: "GET /library-network/distribution-runs/${run}", payload: {}, as: HubCoordinator, as_user_id: "hub-1" }
          assert:
            - "DistributionRun.${run}.plan_snapshot == [ { box_id: ${box_a}, quantity: 10, need_score: 40 }, { box_id: ${box_b}, quantity: 2, need_score: 32 } ] — ranked by need_score DESC, in that exact order"
            - "plan_snapshot contains no entry for ${box_c}: its min(20,10)*2+0+0 = 20 score ranks last and remaining_items reaches 0 after box B, so it is dropped (qty == 0)"
            - "DistributionRun.${run}.planned_item_count == 12"

      - name: parts_reimbursement_per_line_rounding_order
        grounds:
          - calculations.parts_reimbursement
          - entities.MaintenanceRequest.fields.reimbursement_cents
          - calculations.repair_sla_deadline
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum, so lines
          1x101x0.8 = 80.8 -> 81 and 2x51x0.8 = 81.6 -> 82 give reimbursement_cents == 163;
          the forbidden sum-then-round order would give round(162.4) == 162. Distinct mode from
          need_score_ranking_quantity_and_region_bonus (mode a).
        test_recipe:
          setup:
            - "ACTIVE steward with an ACTIVE LISTED box"
            - "Maintenance request reported at 2026-08-01 (SUMMER, multiplier 1.0), triaged MEDIUM with scheduled_date 2026-08-05"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/training-modules", payload: { code: "ORIENTATION", title: "Orientation", level: 1 }, as: NetworkAdmin, as_user_id: "admin-1", captures: { mod_ori: "$.data.id" } }
            - { call: "POST /library-network/stewards", payload: { full_name: "Mary Anning", email: "mary@example.org", region_code: "OR" }, as: Anonymous, captures: { stw: "$.data.id" } }
            - { call: "POST /library-network/stewards/${stw}/training-completions", payload: { module_id: "${mod_ori}", score: 90 }, as: Steward, as_user_id: "${stw}" }
            - { call: "POST /library-network/stewards/${stw}/activate", payload: {}, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes", payload: { steward_id: "${stw}", name: "Pine St Box", latitude: 45.52, longitude: -122.68, capacity_books: 10, region_code: "OR" }, as: Steward, as_user_id: "${stw}", captures: { box: "$.data.id" } }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "CHARTERED" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/boxes/${box}/inspections", payload: { result: "CONFIRMED" }, as: Moderator, as_user_id: "mod-1" }
            - { call: "POST /library-network/boxes/${box}/status", payload: { target_status: "ACTIVE" }, as: NetworkAdmin, as_user_id: "admin-1" }
            - { call: "POST /library-network/maintenance-requests", payload: { box_id: "${box}", category: "VANDALISM", description: "Door kicked in" }, as: Anonymous, captures: { mr: "$.data.id" } }
            - { call: "POST /library-network/maintenance-requests/${mr}/triage", payload: { severity: "MEDIUM", scheduled_date: "2026-08-05" }, as: Moderator, as_user_id: "mod-1" }
          trigger:
            - { call: "POST /library-network/maintenance-requests/${mr}/resolve", payload: { outcome: "RESOLVED", parts: [ { description: "Replacement board", qty: 1, unit_cost_cents: 101 }, { description: "Paint tins", qty: 2, unit_cost_cents: 51 } ], labor_hours: 0 }, as: Moderator, as_user_id: "mod-1" }
            - { call: "GET /library-network/maintenance-requests/${mr}", payload: {}, as: Moderator, as_user_id: "mod-1" }
          assert:
            - "MaintenanceRequest.${mr}.reimbursement_cents == 163 (round_half_up(80.8)=81 plus round_half_up(81.6)=82; sum-first order would yield 162 and is forbidden)"
            - "MaintenanceRequest.${mr}.sla_deadline_at == 2026-08-08T00:00:00Z (triaged_at 2026-08-01T00:00:00Z + 168h * 1.0 SUMMER multiplier)"
            - "MaintenanceRequest.${mr}.sla_breached == false"
            - "MaintenanceRequest.${mr}.season_at_report == SUMMER and season_multiplier == 1.0"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: box_parallel_dimensions_posture_independent_of_charter
        grounds:
