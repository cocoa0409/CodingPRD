          reason: FIELD_BREAKAGE
          expected_glass_order_version: ${go_v4}
        as: GlazingProcurement
        captures:
          e_exhausted_again: $.data.error_id
      assert:
      - after receipt GlassOrder.${go}.committable_lites == 2400, breakage_stock_lites == 72, available_stock_lites == 72,
        drawn_lites == 0
      - after both releases GlassOrder.${go}.allocated_lites == 92 and unallocated_lites == 2236
      - the 30-lite draw against lot 2 returns ERR_DRAW_QUANTITY_INVALID with HTTP 422 (30 > lot lite_count 20 although
        30 <= available 72)
      - the 73-lite draw returns ERR_BREAKAGE_STOCK_EXHAUSTED with HTTP 422 (73 > available 72, and priority 102 outranks
        103 when both hold)
      - 'the 72-lite draw succeeds: BreakageDraw.${bd1}.status == DRAWN, GlassOrder.${go}.drawn_lites == 72, available_stock_lites
        == 0'
      - the following 1-lite draw returns ERR_BREAKAGE_STOCK_EXHAUSTED - the boundary is exclusive once availability is
        0
      - the invariant breakage_stock_lites == available_stock_lites + drawn_lites holds after every one of the four attempts
      - GlassOrder.${go}.version incremented exactly once across the four attempts (only the accepted draw wrote)
      - GlassOrder.${go}.unallocated_lites is unaffected by the draws - breakage stock is reserved outside the allocation
        pool
