        distinguishing_aspect: "EPOCH_WINDOW selects the three HIGHEST epoch_index rows, so a huge epoch 1 (value 80000, enough to hit the 100.00 cap on its own) contributes nothing once epochs 2-4 exist and the index settles at 33.12."
