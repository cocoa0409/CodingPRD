            - "A LedgerEntry with entry_type == FINE_REVERSAL and amount_cents == -2500 exists for application ${a}"
            - "PermitApplication.${a}.balance_due_cents == 33789"

      - name: revision_reset_conserves_review_count
        grounds:
          - state_machines.AgencyReview.REJECTED_to_PENDING
          - entities.PermitApplication.fields.total_review_count
          - entities.PermitApplication.fields.pending_review_count
        distinguishing_aspect: "Review-count conservation: pending+approved+rejected always equals total_review_count (3). Before request-revisions the split is 2 approved + 1 rejected + 0 pending; the reset compensating action makes it 0/0/3 — the conserved quantity is the review count (a distinct type from money cents)."
