          - calculations.benefit_cost_ratio
          - entities.ProjectAssetLink
        distinguishing_aspect: |
          The boundary here is a set cardinality, not a decimal: the same POST /analyses call is
          rejected at exactly zero ProjectAssetLink rows and accepted at exactly one, with nothing
          else changed. It probes the empty-input-set edge of the benefit summation — an
          implementation that lets an empty sum through would mint benefit_measure_cents 0 and a
          bcr of 0.0000 instead of refusing the analysis.
        test_recipe:
          setup:
            - "One ACTIVE Jurisdiction, one DRAFT PlanCycle and one PUBLISHED HazardProfile."
            - "One LifelineAsset ranked to criticality_status RANKED, so priority 37 can never be the reason for a rejection."
            - "One AdaptationProject screened to SCREENED_IN with total_program_cost_cents 35316000 and zero ProjectAssetLink rows."
          setup_api_calls:
            - call: "POST /resilience/jurisdictions"
