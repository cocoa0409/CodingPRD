        grounds:
          - state_machines.Appeal.FILED_to_OVERTURNED
          - state_machines.Manuscript.UNDER_APPEAL_to_UNDER_REVIEW
          - calculations.editor_assignment_selection
          - entities.EditorAssignment.fields.selected_by
          - entities.Editor.fields.active_assignment_count
