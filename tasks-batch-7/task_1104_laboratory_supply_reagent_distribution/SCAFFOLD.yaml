    input: ["agreement_id?", "limit?", "offset?"]
    output: "ConsumptionRecord[]"
    side_effects: []
  - method: GET
    path: "/lab/consumption-records/{recordId}"
    description: "Get one consumption record"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: []
    output: ConsumptionRecord
    side_effects: []

