            - "DripStep.${step1_id}.computed_in_home_date == 2026-06-15"
            - "DripStep.${step1_id}.status == PENDING"
            - "the 2026-06-16 anchor returned status 422 with data.error_id == ERR_DRIP_GAP_TOO_SMALL"
            - "DripStep.${step3_id}.computed_mail_date == 2026-06-07"
            - "DripSchedule.${sched_id}.step_count == 2"
            - "DripSchedule.${sched_id}.status == ACTIVE"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: void_job_restores_permit_balance_exactly
        grounds:
          - state_machines.MailJob.status.COMMITTED_to_DRAFT
          - calculations.campaign_postage_reconciliation
          - entities.Account.fields.permit_balance_cents
          - entities.PostageLedgerEntry.fields.signed_amount_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY in the permit escrow. Commit draws 306 cents and void refunds
          exactly 306, so permit_balance_cents returns to 500000 and the ledger's signed sum over the
          campaign is exactly 0 — no rounding drift and no orphaned DRAW row.
        test_recipe:
          setup:
            - "A committed ADDRESSED MARKETING_MAIL job whose total_due_cents is 306, drawn against a 500000-cent balance."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mail/accounts"
              payload: { name: "Northwind Mailers", permit_number: "PMT-170" }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /mail/accounts/${acct_id}/postage-topups"
              payload: { amount_cents: 500000, reason: "seed escrow" }
              as: PlatformAdmin
            - call: "POST /mail/handwriting-styles"
              payload: { name: "Casual Script", pen_type: "GEL", ink_type: "INK_BLUE_A", chars_per_minute: 4000, ink_ul_per_1000_chars: 4.0 }
              as: ProductionOperator
              captures: { style_id: $.data.id }
            - call: "POST /mail/templates"
              payload: { account_id: "${acct_id}", handwriting_style_id: "${style_id}", name: "Spring Note", body_text: "Thank you kindly", character_count: 400 }
              as: CampaignManager
              captures: { tpl_id: $.data.id, tpl_v: $.data.version }
            - call: "POST /mail/campaigns"
              payload: { account_id: "${acct_id}", name: "Spring 2026" }
              as: CampaignManager
              captures: { camp_id: $.data.id }
            - call: "POST /mail/mailing-lists"
              payload: { account_id: "${acct_id}", name: "Mini List" }
              as: ListOperator
              captures: { list_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/records"
              payload: { first_name: "Bob", last_name: "Jones", address_line1: "200 Oak Ave", city: "Chicago", state_code: "IL", zip5: "60602", dpv_confirmation_code: "Y" }
              as: ListOperator
              captures: { rec_bob_id: $.data.id }
            - call: "POST /mail/mailing-lists/${list_id}/cass-runs"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/dedupe-runs"
              payload: { mode: "EXACT" }
              as: ListOperator
            - call: "POST /mail/mailing-lists/${list_id}/lock"
              payload: {}
              as: ListOperator
            - call: "POST /mail/mail-jobs"
              payload: { campaign_id: "${camp_id}", template_id: "${tpl_id}", job_kind: "ADDRESSED", mail_class: "MARKETING_MAIL", mailing_list_id: "${list_id}", target_in_home_date: "2026-06-15" }
              as: CampaignManager
              captures: { job_id: $.data.id }
            - call: "POST /mail/proofs"
              payload: { mail_job_id: "${job_id}", template_id: "${tpl_id}" }
              as: CampaignManager
              captures: { proof_id: $.data.id }
            - call: "POST /mail/proofs/${proof_id}/submit"
              payload: {}
              as: CampaignManager
              as_user_id: "cm-1"
            - call: "POST /mail/proofs/${proof_id}/approve"
              payload: { expected_template_version: "${tpl_v}" }
              as: AccountOwner
              as_user_id: "${acct_id}"
            - call: "POST /mail/mail-jobs/${job_id}/schedule"
              payload: { target_in_home_date: "2026-06-15" }
              as: CampaignManager
            - call: "POST /mail/mail-jobs/${job_id}/commit"
              payload: {}
              as: CampaignManager
              captures: { job_v: $.data.version }
          trigger:
            - call: "POST /mail/mail-jobs/${job_id}/void"
              payload: { reason: "customer pulled the drop" }
              as: CampaignManager
            - call: "GET /mail/campaigns/${camp_id}/postage-reconciliation"
              payload: {}
              as: CampaignManager
              captures: { net_cents: $.data.net_postage_cents, draws: $.data.draw_cents, refunds: $.data.refund_cents }
          assert:
            - "Account.${acct_id}.permit_balance_cents == 500000"
            - "Account.${acct_id}.lifetime_draw_cents == 306"
            - "Account.${acct_id}.lifetime_refund_cents == 306"
            - "MailJob.${job_id}.status == DRAFT"
            - "MailJob.${job_id}.drawn_postage_cents == 0"
            - "MailJob.${job_id}.refunded_postage_cents == 306"
            - "GET /mail/campaigns/${camp_id}/postage-reconciliation .net_postage_cents == 0"
            - "GET /mail/campaigns/${camp_id}/postage-reconciliation .draw_cents == 306"
            - "GET /mail/campaigns/${camp_id}/postage-reconciliation .refund_cents == 306"
            - "ListRecord.${rec_bob_id}.mail_status == NOT_MAILED"

      - name: void_run_restores_ink_volume_and_machine_slot_minutes
        grounds:
          - state_machines.ProductionRun.status.RESERVED_to_VOIDED
          - calculations.ink_lot_conservation
          - calculations.machine_day_capacity_utilization
          - entities.InkLot.fields.remaining_ul
        distinguishing_aspect: |
          Two different conserved quantities from the money one: INK VOLUME in microlitres and
          MACHINE SLOT-MINUTES per day. Voiding a 13-minute, 2-microlitre reservation restores the
          lot to exactly 20000 and frees the whole 13-minute day, which is proven by a second
          identical reservation succeeding on a machine whose capacity is exactly 13.
        test_recipe:
          setup:
            - "A committed ADDRESSED MARKETING_MAIL job with 1 billable piece."
            - "A machine SLOT-EXACT whose daily_capacity_minutes is exactly 13, and a 20000-microlitre INK_BLUE_A lot."
