      - name: v_high_value_routes_through_sponsor
        claim_type: cross_entity_validation
        grounds: [entities.DisbursementRequest.fields.high_value, state_machines.DisbursementRequest.SUBMITTED_to_PENDING_SPONSOR, "errors[ERR_DISBURSEMENT_STATE_INVALID]"]
        distinguishing_aspect: "amount == 1,000,000 hits the >= threshold exactly (high_value true): compliance APPROVE routes to PENDING_SPONSOR; pay there fails; only after sponsor-approve does pay succeed."
        test_recipe:
          setup: ["COMPREHENSIVE project ACTIVE; received 2,000,000 (fee 160,000; available 1,840,000); DRAFT disbursement 1,000,000"]
          setup_api_calls:
