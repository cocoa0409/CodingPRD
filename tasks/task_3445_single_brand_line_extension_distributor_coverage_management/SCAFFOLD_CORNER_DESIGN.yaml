  # ===========================================================================
  - section: calculations
    instances:
      - name: attainment_window_excludes_out_of_window_reports
        claim_type: correct_result
        grounds:
          - calculations.coverage_attainment
        distinguishing_aspect: "The trailing window is exactly the 3 months before the current logical month: a report for 2026-05 (outside {2026-06, 2026-07, 2026-08}) is accepted but changes nothing — attainment stays exactly 9000 bps."
        test_recipe:
          setup:
            - "Logical clock at the startup default 2026-09-01T00:00:00Z. Full launch setup; distributor APPROVED with ACTIVE assignment quota 1200; June report net 270 already filed (attainment exactly 9000, tier WATCH, no cascade)."
          setup_api_calls:
            - *k_brand
            - *k_market
            - *k_mfr1
            - *k_mfr1q
            - *k_mfr2
            - *k_mfr2q
            - *k_line_core
            - *k_form
            - *k_seal
            - *k_g1
            - *k_g1g
            - *k_g1a
            - *k_g2
            - *k_g2g
            - *k_g2a
            - *k_review
            - *k_pack
            - *k_tool
            - *k_price
            - *k_enterprod
            - *k_launch
            - *k_dist
            - *k_dist_app
