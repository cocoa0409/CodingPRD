# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1383: Peanut Buying Point & Shelling. 9 rules x 2 instances = 18.
# All fixture math pre-computed: load A = 25.0t gross, m 9.2, fm 5.5, dmg 2.0,
# lsk 1.0 => payable 23.375t; per-line discounts 5844+9350+7013 = 22207
# (sum-then-round would give 22206); all-quota gross 1309000; net 1286793.
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_divergence
        grounds:
          - calculations.provisional_net_estimate
          - calculations.load_net_value
          - calculations.hull_credit_allocation
          - entities.FarmerStockLoad.fields.provisional_net_estimate_cents
          - entities.Settlement.fields.net_payment_cents
        distinguishing_aspect: |
          Settlement/pricing entity domain: the forward-looking provisional
          estimate written at grade finalize (1286793, hull/loan excluded) and
          the chronological final settlement at compute (1301993) differ by
          exactly the hull pool share (15200) for identical load data; the
          paired instance lives in the LoanPledge domain, satisfying the
          different-entity-domain clause.
        test_recipe:
          setup:
            - "Buying point configured (quota price 56000, additional 40000, drying 9000/cycle, loan rates 35500/30000); FALL-2026 schedule ACTIVE"
            - "Grower G1 with quota 100t; warehouses WH-G GENERAL 2000t and WH-S SEGREGATED 500t"
            - "Load A 25.0t graded (m9.2/fm5.5/d2.0/lsk1.0, payable 23.375), aflatoxin PASS, STORED in WH-G"
            - "Contract 40t @61000 ACTIVE; call for 20t allocated, delivered, reconciled (16.0 shelled, 3.8 hull); hull lot SOLD @4000 => pool 15200; clock at 2026-09-02"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: 8.0, discount_cents_per_ton: 0 }, { up_to_pct: 10.49, discount_cents_per_ton: 250 }, { up_to_pct: 12.0, discount_cents_per_ton: 700 }, { up_to_pct: 15.0, discount_cents_per_ton: 1500 }, { up_to_pct: null, discount_cents_per_ton: 3000 } ], foreign_material_tiers: [ { up_to_pct: 4.0, discount_cents_per_ton: 0 }, { up_to_pct: 7.0, discount_cents_per_ton: 400 }, { up_to_pct: 10.0, discount_cents_per_ton: 1000 }, { up_to_pct: null, discount_cents_per_ton: 2000 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id, g1_v: $.data.version }
            - { call: "POST /buying-points/quota-histories", payload: { grower_id: "${g1}", crop_year: 2026, quota_tons: 100 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/warehouses"
              payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }
              as: BuyingPointAdmin
              captures: { whg: $.data.id }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-S", compartment: SEGREGATED, capacity_tons: 500 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { la_v: $.data.version }
            - call: "POST /buying-points/loads/${loadA}/grade-sheets"
              payload: { moisture_pct: 9.2, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${la_v}" }
              as: GradingInspector
              as_user_id: insp-1
              captures: { gsA: $.data.id }
            - { call: "POST /buying-points/grade-sheets/${gsA}/finalize", payload: {}, as: GradingInspector, as_user_id: insp-1 }
            - call: "POST /buying-points/loads/${loadA}/aflatoxin-certificates"
              payload: { sample_ref: "SAMP-A1" }
              as: LabTechnician
              as_user_id: lab-1
              captures: { certA: $.data.id }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/record-result", payload: { result_ppb: 8.0 }, as: LabTechnician, as_user_id: lab-1 }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/confirm", payload: {}, as: LabTechnician, as_user_id: lab-2 }
            - call: "POST /buying-points/storage-receipts"
              payload: { load_id: "${loadA}", warehouse_id: "${whg}" }
              as: BuyingPointAdmin
              captures: { rcptA: $.data.id }
            - call: "POST /buying-points/sheller-contracts"
              payload: { buying_point_id: "${bp}", sheller_ref: "sheller-acme", total_units_tons: 40.0, price_per_ton_cents: 61000, accepts_segregated: false, window_start: "2026-09-01T00:00:00Z", window_end: "2026-11-01T00:00:00Z" }
              as: BuyingPointAdmin
              captures: { ct: $.data.id }
            - { call: "POST /buying-points/sheller-contracts/${ct}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/delivery-calls"
              payload: { contract_id: "${ct}", requested_tons: 20.0, dock_window_start: "2026-09-10T08:00:00Z", dock_window_end: "2026-09-10T12:00:00Z" }
              as: ShellerRep
              as_user_id: sheller-acme
              captures: { dc: $.data.id, dc_v: $.data.version }
            - { call: "POST /buying-points/delivery-calls/${dc}/allocate", payload: { expected_delivery_call_version: "${dc_v}" }, as: BuyingPointAdmin }
            - { call: "POST /buying-points/delivery-calls/${dc}/deliver", payload: {}, as: BuyingPointAdmin }
            - { call: "POST /buying-points/delivery-calls/${dc}/reconcile", payload: { shelled_kernel_tons: 16.0, hull_tons: 3.8 }, as: ShellerRep, as_user_id: sheller-acme }
            - call: "GET /buying-points/hull-lots"
              payload: { delivery_call_id: "${dc}" }
              as: BuyingPointAdmin
              captures: { hl: "$.data[0].id" }
            - { call: "POST /buying-points/hull-lots/${hl}/list-for-sale", payload: { sale_price_cents_per_ton: 4000 }, as: BuyingPointAdmin }
            - { call: "POST /buying-points/hull-lots/${hl}/sell", payload: {}, as: BuyingPointAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-02T00:00:00Z" }, as: BuyingPointAdmin }
          trigger:
            - call: "POST /buying-points/growers/${g1}/settlements"
              payload: { crop_year: 2026, expected_grower_version: "${g1_v}" }
              as: SettlementClerk
              as_user_id: clerk-1
              captures: { s1: $.data.id }
          assert:
            - "FarmerStockLoad.${loadA}.provisional_net_estimate_cents == 1286793 (computed at finalize: gross 1309000 - discounts 22207, no hull/loan)"
            - "Settlement.${s1}.gross_value_cents == 1309000"
            - "Settlement.${s1}.discount_cents == 22207"
            - "Settlement.${s1}.drying_cents == 0"
            - "Settlement.${s1}.loan_offset_cents == 0"
            - "Settlement.${s1}.hull_credit_cents == 15200 (sole grower takes whole pool: 3.8t x 4000)"
            - "Settlement.${s1}.net_payment_cents == 1301993"
            - "Variant delta: 1301993 - 1286793 == 15200 == hull_credit_cents — provisional and final diverge by exactly the actual hull pool share"

      - name: collateral_coverage_dual_variant_margin_flip
        grounds:
          - calculations.collateral_coverage
          - calculations.loan_offset_with_interest
          - entities.LoanPledge.fields.margin_status
          - entities.LoanPledge.fields.collateral_value_standard_cents
          - entities.LoanPledge.fields.collateral_value_conservative_cents
        distinguishing_aspect: |
          LoanPledge entity domain (distinct from the Settlement-domain paired
          instance): the standard variant values a 25t all-quota pledge at
          1400000 while the conservative variant values it at 1000000 for
          identical data; margin_status (conservative vs outstanding x 1.10,
          unrounded threshold) flips MARGIN_OK -> MARGIN_CALL on day 122 of
          interest accrual while the standard value stays clear.
        test_recipe:
          setup:
            - "Foundation as in settlement_provisional_vs_final_divergence through load A STORED (receipt rcptA, 25t OPEN)"
            - "LoanPledge on rcptA: full-receipt 25.0t, maturity 2026-12-01, pledged at 2026-09-01T09:00:00Z; quota headroom 100 => all-quota principal 887500"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: 8.0, discount_cents_per_ton: 0 }, { up_to_pct: 10.49, discount_cents_per_ton: 250 }, { up_to_pct: 12.0, discount_cents_per_ton: 700 }, { up_to_pct: 15.0, discount_cents_per_ton: 1500 }, { up_to_pct: null, discount_cents_per_ton: 3000 } ], foreign_material_tiers: [ { up_to_pct: 4.0, discount_cents_per_ton: 0 }, { up_to_pct: 7.0, discount_cents_per_ton: 400 }, { up_to_pct: 10.0, discount_cents_per_ton: 1000 }, { up_to_pct: null, discount_cents_per_ton: 2000 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - { call: "POST /buying-points/quota-histories", payload: { grower_id: "${g1}", crop_year: 2026, quota_tons: 100 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/warehouses"
              payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }
              as: BuyingPointAdmin
              captures: { whg: $.data.id }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { la_v: $.data.version }
            - call: "POST /buying-points/loads/${loadA}/grade-sheets"
              payload: { moisture_pct: 9.2, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${la_v}" }
              as: GradingInspector
              as_user_id: insp-1
              captures: { gsA: $.data.id }
            - { call: "POST /buying-points/grade-sheets/${gsA}/finalize", payload: {}, as: GradingInspector, as_user_id: insp-1 }
            - call: "POST /buying-points/loads/${loadA}/aflatoxin-certificates"
              payload: { sample_ref: "SAMP-A1" }
              as: LabTechnician
              as_user_id: lab-1
              captures: { certA: $.data.id }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/record-result", payload: { result_ppb: 8.0 }, as: LabTechnician, as_user_id: lab-1 }
            - { call: "POST /buying-points/aflatoxin-certificates/${certA}/confirm", payload: {}, as: LabTechnician, as_user_id: lab-2 }
            - call: "POST /buying-points/storage-receipts"
              payload: { load_id: "${loadA}", warehouse_id: "${whg}" }
              as: BuyingPointAdmin
              captures: { rcptA: $.data.id }
            - call: "POST /buying-points/loan-pledges"
              payload: { grower_id: "${g1}", storage_receipt_id: "${rcptA}", pledged_tons: 25.0, maturity_date: "2026-12-01T00:00:00Z" }
              as: Grower
              as_user_id: "${g1}"
              captures: { lp: $.data.id }
          trigger:
            - { call: "GET /buying-points/loan-pledges/${lp}", payload: {}, as: SettlementClerk, as_user_id: clerk-1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-12-31T09:00:00Z" }, as: BuyingPointAdmin }
            - { call: "GET /buying-points/loan-pledges/${lp}", payload: {}, as: SettlementClerk, as_user_id: clerk-1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2027-01-01T09:00:00Z" }, as: BuyingPointAdmin }
            - { call: "GET /buying-points/loan-pledges/${lp}", payload: {}, as: SettlementClerk, as_user_id: clerk-1 }
          assert:
            - "LoanPledge.${lp}.principal_cents == 887500 (full-receipt 25.0t all quota tier: 25 x 35500)"
            - "LoanPledge.${lp}.quota_part_tons == 25.0 and additional_part_tons == 0"
            - "LoanPledge.${lp}.collateral_value_standard_cents == 1400000 (25 x 56000)"
            - "LoanPledge.${lp}.collateral_value_conservative_cents == 1000000 (25 x 40000) — the two variants diverge by 400000 on identical pledge data"
            - "At day 0: accrued_interest_cents == 0, outstanding 887500, margin_status == MARGIN_OK (1000000 >= 976250.00)"
            - "At day 121 (2026-12-31T09:00Z): accrued_interest_cents == 21478 (177.5 x 121 = 21477.5 half-up), outstanding 908978, margin_status == MARGIN_OK (threshold 999875.80 <= 1000000)"
            - "At day 122 (2027-01-01T09:00Z): accrued_interest_cents == 21655, outstanding 909155, margin_status == MARGIN_CALL (threshold 1000070.50 > 1000000); standard value 1400000 still clears — variant choice decides the flag"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: load_value_per_line_rounding_order
        grounds:
          - calculations.load_net_value
          - calculations.discount_cents_per_ton
          - calculations.payable_tons
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins per-line round-then-sum
          for the three discount lines (5844 + 9350 + 7013 = 22207); the
          alternative sum-cents-per-ton-then-round order yields 22206 — a
          falsifiable 1-cent divergence on the same inputs.
        test_recipe:
          setup:
            - "Buying point + FALL-2026 schedule ACTIVE (moisture tier (8.00,10.49] => 250c/t; fm tier (4.00,7.00] => 400c/t; damage 150c/pct); WH-G 2000t keeps posture OPEN"
            - "Grower G1 quota 100t; load A WEIGHED at 25.0t"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: 8.0, discount_cents_per_ton: 0 }, { up_to_pct: 10.49, discount_cents_per_ton: 250 }, { up_to_pct: 12.0, discount_cents_per_ton: 700 }, { up_to_pct: 15.0, discount_cents_per_ton: 1500 }, { up_to_pct: null, discount_cents_per_ton: 3000 } ], foreign_material_tiers: [ { up_to_pct: 4.0, discount_cents_per_ton: 0 }, { up_to_pct: 7.0, discount_cents_per_ton: 400 }, { up_to_pct: 10.0, discount_cents_per_ton: 1000 }, { up_to_pct: null, discount_cents_per_ton: 2000 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id }
            - { call: "POST /buying-points/quota-histories", payload: { grower_id: "${g1}", crop_year: 2026, quota_tons: 100 }, as: BuyingPointAdmin }
            - { call: "POST /buying-points/warehouses", payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { la_v: $.data.version }
          trigger:
            - call: "POST /buying-points/loads/${loadA}/grade-sheets"
              payload: { moisture_pct: 9.2, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${la_v}" }
              as: GradingInspector
              as_user_id: insp-1
              captures: { gsA: $.data.id }
            - { call: "POST /buying-points/grade-sheets/${gsA}/finalize", payload: {}, as: GradingInspector, as_user_id: insp-1 }
          assert:
            - "GradeSheet.${gsA}.payable_tons == 23.375 (fm 1.375 + lsk 0.250 deducted after per-component 3dp rounding)"
            - "Discount lines: moisture 5844 (23.375 x 250 = 5843.75 -> half-up), foreign-material 9350, damage 7013 (7012.5 -> half-up); total == 22207"
            - "FarmerStockLoad.${loadA}.provisional_net_estimate_cents == 1286793 (gross 1309000 - 22207); the forbidden sum-then-round order would give 22206 and 1286794"

      - name: loan_offset_frozen_at_compute
        grounds:
          - calculations.loan_offset_with_interest
          - calculations.load_net_value
          - entities.Settlement.fields.loan_offset_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: settlement net depends on loan
          offset, loan interest depends on how long the loan lives, and the
          settlement itself retires the loan at pay — the scaffold pins
          evaluation order by freezing interest at settlement.created_at, so a
          later approve/pay at day 40 never recomputes the day-30 offset
          (892825 frozen vs 894600 recomputed) — a different mode than the
          rounding-order instance.
        test_recipe:
          setup:
            - "Foundation as in collateral_coverage_dual_variant_margin_flip: load A STORED; full-receipt pledge 25t principal 887500 ACTIVE at 2026-09-01T09:00Z; clock advanced to 2026-10-01T09:00Z (day 30)"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
              as: BuyingPointAdmin
              captures: { bp: $.data.id }
            - call: "POST /buying-points/discount-schedules"
              payload: { schedule_code: "FALL-2026", effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", moisture_tiers: [ { up_to_pct: 8.0, discount_cents_per_ton: 0 }, { up_to_pct: 10.49, discount_cents_per_ton: 250 }, { up_to_pct: 12.0, discount_cents_per_ton: 700 }, { up_to_pct: 15.0, discount_cents_per_ton: 1500 }, { up_to_pct: null, discount_cents_per_ton: 3000 } ], foreign_material_tiers: [ { up_to_pct: 4.0, discount_cents_per_ton: 0 }, { up_to_pct: 7.0, discount_cents_per_ton: 400 }, { up_to_pct: 10.0, discount_cents_per_ton: 1000 }, { up_to_pct: null, discount_cents_per_ton: 2000 } ], damage_rate_cents_per_pct: 150 }
              as: BuyingPointAdmin
              captures: { ds: $.data.id }
            - { call: "POST /buying-points/discount-schedules/${ds}/activate", payload: {}, as: BuyingPointAdmin }
            - call: "POST /buying-points/growers"
              payload: { name: "Grower One", farm_number: "F-1001" }
              as: BuyingPointAdmin
              captures: { g1: $.data.id, g1_v: $.data.version }
            - { call: "POST /buying-points/quota-histories", payload: { grower_id: "${g1}", crop_year: 2026, quota_tons: 100 }, as: BuyingPointAdmin }
            - call: "POST /buying-points/warehouses"
              payload: { buying_point_id: "${bp}", name: "WH-G", compartment: GENERAL, capacity_tons: 2000 }
              as: BuyingPointAdmin
              captures: { whg: $.data.id }
            - call: "POST /buying-points/loads"
              payload: { grower_id: "${g1}", crop_year: 2026 }
              as: Grower
              as_user_id: "${g1}"
              captures: { loadA: $.data.id }
            - call: "POST /buying-points/loads/${loadA}/weigh"
              payload: { gross_tons: 25.0 }
              as: BuyingPointAdmin
              captures: { la_v: $.data.version }
            - call: "POST /buying-points/loads/${loadA}/grade-sheets"
              payload: { moisture_pct: 9.2, foreign_material_pct: 5.5, damage_pct: 2.0, lsk_pct: 1.0, expected_farmer_stock_load_version: "${la_v}" }
              as: GradingInspector
              as_user_id: insp-1
              captures: { gsA: $.data.id }
            - { call: "POST /buying-points/grade-sheets/${gsA}/finalize", payload: {}, as: GradingInspector, as_user_id: insp-1 }
            - call: "POST /buying-points/loads/${loadA}/aflatoxin-certificates"
              payload: { sample_ref: "SAMP-A1" }
              as: LabTechnician
              as_user_id: lab-1
              captures: { certA: $.data.id }
