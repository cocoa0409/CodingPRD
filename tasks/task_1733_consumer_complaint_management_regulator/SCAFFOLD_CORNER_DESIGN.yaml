      - name: product_complaints_subresource_reverse_reachability
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /complaint-office/products/{productId}/complaints]
          - entities.Complaint.fields.product_code
        distinguishing_aspect: "GET /products/{id}/complaints returns exactly the complaints created with that product_code, in creation order (created_at ASC), and excludes other products' complaints."
        test_recipe:
          setup: ["Two products each with one complaint"]
          setup_api_calls:
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-E2A", display_name: "E2A" }
              as: ComplaintManager
              captures: { pa: $.data.id }
            - call: "POST /complaint-office/products"
              payload: { product_code: "P-E2B", display_name: "E2B" }
              as: ComplaintManager
              captures: { pb: $.data.id }
            - call: "POST /complaint-office/channels"
              payload: { channel_code: "WEB", display_name: "Web" }
              as: ComplaintManager
            - call: "POST /complaint-office/taxonomy-categories"
              payload: { category_code: "C.E2" }
              as: ComplaintManager
            - call: "POST /complaint-office/complaints"
