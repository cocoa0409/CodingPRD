  - rule_id: transitive_cascade
    instances:
      - name: late_laundry_return_cascades_to_deferred_deep_clean_and_day_ledger
        grounds:
          - state_machines.LaundryCycle.QUEUED_to_LATE_ESCALATED
          - state_machines.RoomAssignment.ASSIGNED_to_DEFERRED
          - calculations.laundry_turnaround
          - calculations.linen_coverage_status
          - calculations.roster_workload_compliance
          - entities.ForecastDay.fields.allocated_credits_total
        distinguishing_aspect: |
          A single laundry return propagates FIVE hops across five different entities -
          LaundryCycle.status to LATE_ESCALATED, LinenItem.shortage_status forced to ESCALATED,
          every ASSIGNED DEEP_CLEAN RoomAssignment to DEFERRED, ShiftRoster.assigned_credits down from
          3.00 to 1.00, and ForecastDay.allocated_credits_total down to 1.00 - none of which the
          returning cycle names in its own request.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T07:00:00.000Z."
            - "Property with laundry_sla_minutes 240 and laundry_capacity_sets 300."
            - "KING room type (420 sqft, checkout 1.00, deep 2.00, 2 linen sets); rooms 101 in DUE_OUT and 103 in VACANT, so par_required_sets is 4."
            - "SHEET_SET linen line with 20 owned sets and 8 initially soiled, so on_hand_clean is 12, coverage 3.0000 and shortage_status OK."
            - "PUBLISHED ForecastDay 2026-08-03 with a PLANNED roster carrying one ASSIGNED checkout (1.00) and one ASSIGNED deep clean (2.00), so assigned_credits is 3.00 and allocated_credits_total is 3.00."
