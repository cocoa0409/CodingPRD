  - rule_id: resource_temporal_overlap
    instances:
      - name: exclusivity_grant_half_open_windows_reject_overlap_but_accept_exact_adjacency
        interval_semantics: "half-open [effective_from, effective_to); adjacency is NOT an overlap; REVOKED grants are ignored"
        grounds:
          - validations[priority=73]
          - errors.ERR_EXCLUSIVITY_WINDOW_OVERLAP
          - entities.ExclusivityGrant.fields.effective_from
          - state_machines.ExclusivityGrant.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Endpoint POST /exclusivity-grants uses HALF-OPEN interval semantics per
          (terminal_id, category): a window starting one day before the incumbent's end is rejected
          with 409 ERR_EXCLUSIVITY_WINDOW_OVERLAP, a window starting EXACTLY at the incumbent's
          effective_to is accepted, and revoking the incumbent frees its own window for reuse -
          contrast the closed-interval-plus-buffer semantics of reservation capacity.
        test_recipe:
          setup:
            - "Terminal SIN in SG"
            - "Two LIQUOR brands: Aurora Spirits and Northwind Distillers, both ACTIVE"
            - "No grants exist at the start"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /brands"
              payload: { name: "Northwind Distillers", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_nw: $.data.id }
          trigger:
            - call: "POST /exclusivity-grants"
              payload: { brand_id: "${b_aurora}", terminal_id: "${t_sin}", category: "LIQUOR", scope: "TERMINAL_EXCLUSIVE", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z" }
              as: TerminalAdmin
              captures: { g_1: $.data.id }
            - call: "POST /exclusivity-grants"
              payload: { brand_id: "${b_nw}", terminal_id: "${t_sin}", category: "LIQUOR", scope: "TERMINAL_EXCLUSIVE", effective_from: "2026-08-31T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: TerminalAdmin
            - call: "POST /exclusivity-grants"
              payload: { brand_id: "${b_nw}", terminal_id: "${t_sin}", category: "LIQUOR", scope: "TERMINAL_EXCLUSIVE", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z" }
              as: TerminalAdmin
              captures: { g_3: $.data.id }
            - call: "POST /exclusivity-grants/${g_1}/revoke"
              payload: {}
              as: TerminalAdmin
            - call: "POST /exclusivity-grants"
              payload: { brand_id: "${b_nw}", terminal_id: "${t_sin}", category: "LIQUOR", scope: "TERMINAL_EXCLUSIVE", effective_from: "2026-08-05T00:00:00Z", effective_to: "2026-08-20T00:00:00Z" }
              as: TerminalAdmin
              captures: { g_4: $.data.id }
          assert:
            - "the first grant create returns HTTP 201 and ExclusivityGrant.${g_1}.status == ACTIVE"
            - "the second grant create returns HTTP 409 with error_id ERR_EXCLUSIVITY_WINDOW_OVERLAP"
            - "the third grant create returns HTTP 201 because 2026-09-01T00:00:00Z is exactly the incumbent's effective_to"
            - "ExclusivityGrant.${g_3}.effective_from == 2026-09-01T00:00:00Z"
            - "ExclusivityGrant.${g_1}.status == REVOKED after the revoke call"
            - "ExclusivityGrant.${g_1}.revoked_at == 2026-08-01T00:00:00Z"
            - "the fourth grant create returns HTTP 201 because the REVOKED grant's window is ignored"
            - "ExclusivityGrant.${g_4}.status == ACTIVE"
            - "GET /exclusivity-grants filtered by terminal_id ${t_sin} and status ACTIVE returns exactly 2 grants"

      - name: reservation_capacity_closed_windows_with_24h_buffer_aggregate_against_on_hand
        interval_semantics: "CLOSED [reservation_window_start, reservation_window_end] widened by a 24h buffer on both sides; conflicts are aggregated, not pairwise"
        grounds:
          - validations[priority=85]
          - errors.ERR_RESERVATION_CAPACITY_OVERLAP
          - calculations.bonded_duty_suspended_value
          - state_machines.PreOrder.initial_state
        distinguishing_aspect: |
          Endpoint POST /pre-orders uses CLOSED windows widened by a 24h buffer and compares the
          SUM of conflicting reserved quantities against on_hand_qty: a window whose raw span is
          disjoint from the incumbent still conflicts once buffered (end 2026-08-12 vs start
          2026-08-13) and is refused with 409 ERR_RESERVATION_CAPACITY_OVERLAP, while a window one
          day later falls outside the buffer and is accepted even though total reservations then
          reach on_hand_qty exactly - the opposite treatment of touching endpoints from the
          half-open exclusivity rule.
        test_recipe:
          setup:
            - "Terminal SIN in SG"
            - "One LISTED LIQUOR product with a bonded stock item holding on_hand_qty 10"
            - "One itinerary departing 2026-08-20T00:00:00Z, so every PICKUP_ON_DEPARTURE window ends before departure"
            - "Logical clock at 2026-08-01T00:00:00Z, so every window starts in the future"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "SIN", name: "Changi T3 Duty Free", country_code: "SG", sealed_bag_regime: "NONE", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_sin: $.data.id }
            - call: "POST /brands"
              payload: { name: "Aurora Spirits", category: "LIQUOR" }
              as: TerminalAdmin
              captures: { b_aurora: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_aurora}", sku: "AUR-WHISKY-700", category: "LIQUOR", unit_price_cents: 8000, duty_rate_bps: 1500, vat_rate_bps: 900, is_liquid: true, liquid_ml: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_whisky: $.data.id }
            - call: "POST /products/${p_whisky}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_sin}", product_id: "${p_whisky}" }
              as: StockController
              captures: { si_whisky: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_whisky}", movement_type: "RECEIPT", qty_delta: 10 }
              as: StockController
            - call: "POST /itineraries"
              payload: { passenger_ref: "PAX-0019", nationality_code: "CN", boarding_pass_barcode: "BP-0019", departure_terminal_id: "${t_sin}", departure_utc: "2026-08-20T00:00:00Z", destination_country: "AU", final_destination_country: "AU", has_connection: false }
              as: SalesAssociate
              captures: { it_19: $.data.id }
            - call: "GET /bonded-stock-items/${si_whisky}"
              as: StockController
              captures: { si_v0: $.data.version }
          trigger:
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_19}", stock_item_id: "${si_whisky}", qty: 6, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-10T00:00:00Z", reservation_window_end: "2026-08-12T00:00:00Z", expected_stock_item_version: "${si_v0}" }
              as: Passenger
              as_user_id: "${it_19}"
              captures: { po_1: $.data.id }
            - call: "GET /bonded-stock-items/${si_whisky}"
              as: StockController
              captures: { si_v1: $.data.version }
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_19}", stock_item_id: "${si_whisky}", qty: 5, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-13T00:00:00Z", reservation_window_end: "2026-08-14T00:00:00Z", expected_stock_item_version: "${si_v1}" }
              as: Passenger
              as_user_id: "${it_19}"
            - call: "POST /pre-orders"
              payload: { itinerary_id: "${it_19}", stock_item_id: "${si_whisky}", qty: 4, program: "PICKUP_ON_DEPARTURE", reservation_window_start: "2026-08-14T00:00:00Z", reservation_window_end: "2026-08-15T00:00:00Z", expected_stock_item_version: "${si_v1}" }
              as: Passenger
              as_user_id: "${it_19}"
              captures: { po_3: $.data.id }
          assert:
            - "the first pre-order create returns HTTP 201 and PreOrder.${po_1}.status == RESERVED"
            - "BondedStockItem.${si_whisky}.reserved_qty == 6 after the first create"
            - "BondedStockItem.${si_whisky}.available_qty == 4 after the first create"
            - "the second pre-order create returns HTTP 409 with error_id ERR_RESERVATION_CAPACITY_OVERLAP because the 24h buffer makes 2026-08-13 touch the incumbent window ending 2026-08-12 and 6 + 5 > 10"
            - "BondedStockItem.${si_whisky}.reserved_qty == 6 after the rejected create"
            - "the third pre-order create returns HTTP 201 because 2026-08-14 minus 24h is 2026-08-13, which is after the incumbent's end 2026-08-12"
            - "PreOrder.${po_3}.status == RESERVED"
            - "PreOrder.${po_3}.qty == 4"
            - "BondedStockItem.${si_whisky}.reserved_qty == 10"
            - "BondedStockItem.${si_whisky}.available_qty == 0"
            - "BondedStockItem.${si_whisky}.on_hand_qty == 10"
            - "BondedStockItem.${si_whisky}.duty_suspended_value_cents == 19200"
            - "GET /bonded-movements filtered by stock_item_id ${si_whisky} and movement_type RESERVATION_HOLD returns exactly 2 movements with qty_delta 6 and 4 in created_at ASC order"

  - rule_id: compensating_invariant
    instances:
      - name: receipt_reversal_conserves_physical_units_and_duty_suspended_value
        conserved_quantity: "BondedStockItem.on_hand_qty and its derived duty_suspended_value_cents"
        grounds:
          - state_machines.BondedMovement_append_only
          - calculations.bonded_duty_suspended_value
          - validations[priority=64]
          - entities.BondedMovement.fields.reversal_of_movement_id
        distinguishing_aspect: |
          Endpoint POST /bonded-movements/{movement_id}/reverse conserves PHYSICAL UNITS: the append-only
          ledger never edits the original RECEIPT, it appends a REVERSAL of qty_delta -40 that carries
          reversal_of_movement_id, flips the original's reversed flag, and returns on_hand_qty and
          duty_suspended_value_cents to exactly their pre-receipt values (100 units / 140000 cents) -
          and a second reverse of the same movement is refused with ERR_MOVEMENT_NOT_REVERSIBLE, so the
          compensation cannot be double-applied.
        test_recipe:
          setup:
            - "Terminal HKG in HK"
            - "One LISTED ELECTRONICS product priced 20000 cents at 700 bps total"
            - "A BondedStockItem for it, credited with a RECEIPT of 100 and then a RECEIPT of 40"
          setup_api_calls:
            - call: "POST /terminals"
              payload: { iata_code: "HKG", name: "Hong Kong Duty Free", country_code: "HK", sealed_bag_regime: "ICAO_STEB", liquid_limit_ml: 3000 }
              as: TerminalAdmin
              captures: { t_hkg: $.data.id }
            - call: "POST /brands"
              payload: { name: "Meridian Timepieces", category: "ELECTRONICS" }
              as: TerminalAdmin
              captures: { b_mer: $.data.id }
            - call: "POST /products"
              payload: { brand_id: "${b_mer}", sku: "MER-WATCH-01", category: "ELECTRONICS", unit_price_cents: 20000, duty_rate_bps: 0, vat_rate_bps: 700, target_nationality_code: "CN", required_nationality_share_bps: 0 }
              as: TerminalAdmin
              captures: { p_watch: $.data.id }
            - call: "POST /products/${p_watch}/list"
              payload: {}
              as: TerminalAdmin
            - call: "POST /bonded-stock-items"
              payload: { terminal_id: "${t_hkg}", product_id: "${p_watch}" }
              as: StockController
              captures: { si_watch: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_watch}", movement_type: "RECEIPT", qty_delta: 100 }
              as: StockController
              captures: { mv_1: $.data.id }
            - call: "POST /bonded-movements"
              payload: { stock_item_id: "${si_watch}", movement_type: "RECEIPT", qty_delta: 40 }
              as: StockController
              captures: { mv_2: $.data.id }
          trigger:
            - call: "POST /bonded-movements/${mv_2}/reverse"
              payload: {}
              as: StockController
              captures: { mv_rev: $.data.id }
            - call: "POST /bonded-movements/${mv_2}/reverse"
              payload: {}
              as: StockController
          assert:
            - "BondedStockItem.${si_watch}.on_hand_qty == 140 before the reverse"
            - "BondedStockItem.${si_watch}.duty_suspended_value_cents == 196000 before the reverse"
            - "the first reverse returns HTTP 201"
            - "BondedMovement.${mv_rev}.movement_type == REVERSAL"
            - "BondedMovement.${mv_rev}.qty_delta == -40"
            - "BondedMovement.${mv_rev}.affects == ON_HAND"
            - "BondedMovement.${mv_rev}.reversal_of_movement_id == ${mv_2}"
            - "BondedMovement.${mv_rev}.source_ref_type == REVERSAL"
            - "BondedMovement.${mv_2}.reversed == true"
            - "BondedMovement.${mv_2}.qty_delta == 40 (the original row is never edited)"
            - "BondedMovement.${mv_1}.reversed == false"
            - "BondedStockItem.${si_watch}.on_hand_qty == 100"
            - "BondedStockItem.${si_watch}.reserved_qty == 0"
            - "BondedStockItem.${si_watch}.available_qty == 100"
            - "BondedStockItem.${si_watch}.duty_suspended_value_cents == 140000"
            - "the second reverse returns HTTP 409 with error_id ERR_MOVEMENT_NOT_REVERSIBLE"
            - "GET /bonded-movements filtered by stock_item_id ${si_watch} returns exactly 3 movements"

      - name: void_of_picked_up_sale_conserves_concession_gross_sales_and_rent_basis
        conserved_quantity: "ConcessionAgreement.gross_sales_cents and the percentage_rent_cents / rent_basis derived from it"
        grounds:
          - state_machines.Sale.PICKED_UP_to_VOIDED
          - calculations.concession_rent_accrual
          - calculations.bonded_duty_suspended_value
          - validations[priority=85]
        distinguishing_aspect: |
          Endpoint POST /sales/{sale_id}/void conserves MONEY rather than units: voiding a PICKED_UP
          sale rolls the agreement's gross_sales_cents from 100000 back to 0, recomputes
          percentage_rent_cents to 0 and re-derives rent_basis from PERCENTAGE back to
          MINIMUM_GUARANTEE, while Sale.gross_amount_cents is deliberately LEFT at 100000 as the
