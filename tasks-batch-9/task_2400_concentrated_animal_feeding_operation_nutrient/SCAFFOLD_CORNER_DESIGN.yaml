              payload: { plan_id: "${pl_id}", field_id: "${fld_id}", soil_test_id: "${soil_id}", crop: "CORN_GRAIN", yield_goal: 190, previous_crop: "SOYBEAN", planned_application_method: "INJECTION" }
              as: CertifiedPlanner
              as_user_id: "planner-1"
              captures: { bd2_id: $.data.id, bd2_status: $.data.budget_status }
            - call: "POST /cafo/application-events"
              payload: { plan_id: "${pl_id}", budget_id: "${bd2_id}", storage_id: "${st_id}", applied_on: "2026-07-10T00:00:00Z", gallons_applied: 100000, acres_treated: 20, application_method: "INJECTION", setback_maintained_ft: 60, soil_condition: "DRY", precipitation_forecast_in_24h: 0.10, applicator_name: "J. Kroeger" }
              as: Operator
              as_user_id: "${op_id}"
              captures: { e_locked: $.data.error_id }
            - call: "POST /cafo/application-events"
              payload: { plan_id: "${pl_id}", budget_id: "${bd_id}", storage_id: "${st_id}", applied_on: "2026-07-10T00:00:00Z", gallons_applied: 100000, acres_treated: 20, application_method: "INJECTION", setback_maintained_ft: 60, soil_condition: "DRY", precipitation_forecast_in_24h: 0.10, applicator_name: "J. Kroeger" }
              as: Operator
