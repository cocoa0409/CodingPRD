            - "HTTP 201: neither ERR_WIND_LIMIT_EXCEEDED nor ERR_BUFFER_ZONE_VIOLATION is raised at the limit"
            - "Application.${app1_id}.record_status == RECORDED and posting_status == NOT_REQUIRED"
            - "Application.${app1_id}.total_lb == 12.63 (100 * 5500 / 43560 == 12.6262626 -> 12.63)"
            - "Application.${app1_id}.nitrogen_lb == 0.00 and rei_expires_at == 2026-08-01T06:00:00Z"
            - "TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 0.000 and rei_expires_at == null (no POSTED row on the area)"

      - name: wind_one_mph_above_the_product_limit_is_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=29]
          - errors[ERR_WIND_LIMIT_EXCEEDED]
        distinguishing_aspect: "13 mph against the same 12 mph ceiling is the first value outside the inclusive comparison, so the call returns ERR_WIND_LIMIT_EXCEEDED (422) and no Application row is created even though every other gate on the row is satisfied."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course, one 5500 sq ft GREEN on hole 7 sitting 40 ft from water."
            - "One CAT_3_TURF applicator and one contact fungicide with a 12 mph wind ceiling, a 25 ft buffer and no posting."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-13002", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Chlorothalonil 720", epa_reg_no: "US-50534-210", requires_license_category: "CAT_3_TURF", rei_hours: 0, min_buffer_ft: 25, max_wind_speed_mph: 12, posting_required: false, nitrogen_pct: 0 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { fung_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "${fung_id}", applicator_id: "${appl_a_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 100, wind_speed_mph: 13, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { err_id: $.data.error_id, err_msg: $.data.message }
          assert:
            - "HTTP 422 and ${err_id} == ERR_WIND_LIMIT_EXCEEDED"
            - "${err_msg} is a non-empty human-readable string"
            - "GET /applications with turf_area_id == ${green7_id} returns total_count == 0"
            - "TurfArea.${green7_id}.version == 1: the rejected call wrote nothing"

      - name: reading_on_an_out_of_play_green_is_rejected_until_the_storm_clears
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=34]
          - validations[priority=33]
          - errors[ERR_TURF_AREA_OUT_OF_PLAY]
          - endpoints[POST /playability-readings]
        distinguishing_aspect: "A reading's admissibility depends on another aggregate's state: while the STORM_DAMAGE event holds the green OUT_OF_PLAY the call fails with ERR_TURF_AREA_OUT_OF_PLAY (409) and specifically not with ERR_COURSE_CLOSED, whose applies_to list omits playability readings, and the identical call succeeds once the event is cleared."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course at version 1, one 5500 sq ft GREEN on hole 7."
            - "One ACTIVE STORM_DAMAGE event naming that green, which puts it OUT_OF_PLAY and closes the course."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, course_v1: $.data.version }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /weather-events"
              payload: { course_id: "${course_id}", event_type: "STORM_DAMAGE", expected_clear_at: "2026-08-01T18:00:00Z", affected_turf_area_ids: ["${green7_id}"], expected_course_version: "${course_v1}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { wx1_id: $.data.id }
          trigger:
            - call: "POST /playability-readings"
              payload: { turf_area_id: "${green7_id}", measured_at: "2026-08-01T06:00:00Z", green_speed_ft: 11.5, firmness_gravities: 1.40, moisture_pct: 19.0 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /weather-events/${wx1_id}/clear"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /playability-readings"
              payload: { turf_area_id: "${green7_id}", measured_at: "2026-08-01T06:00:00Z", green_speed_ft: 11.5, firmness_gravities: 1.40, moisture_pct: 19.0 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { read_ok_id: $.data.id }
          assert:
            - "the first call returns HTTP 409 with ${err_id} == ERR_TURF_AREA_OUT_OF_PLAY, not ERR_COURSE_CLOSED"
            - "after the first call GET /turf-areas/${green7_id}/playability-readings returns total_count == 0"
            - "after the clear TurfArea.${green7_id}.agronomic_status == ACTIVE and Course.${course_id}.play_posture == OPEN"
            - "the second call returns HTTP 201 and PlayabilityReading.${read_ok_id}.within_tournament_spec == true (abs(11.5 - 11.0) == 0.5 <= 1.5 and abs(1.40 - 1.35) == 0.05 <= 0.30)"
            - "TurfArea.${green7_id}.current_moisture_pct == 19.0 and TurfArea.${green7_id}.version == 4 (create, storm, clear, reading)"

      - name: reclaimed_water_is_exempt_from_the_allocation_check_that_stops_a_well
        claim_type: conditional_validation
        grounds:
          - validations[priority=50]
          - errors[ERR_WATER_ALLOCATION_EXCEEDED]
          - entities.PumpStation.fields.source_type
        distinguishing_aspect: "The fiscal gate is conditional on source_type: the same 341.0 gal demand is refused on a WELL station because 0 + 341.0 exceeds the 300 gal allocation, then accepted unchanged on a RECLAIMED station, which proves the exemption rather than a different allotment."
        test_recipe:
          setup:
            - "One course whose annual allocation is only 300 gal and whose water_used_gal is 0."
            - "One 5500 sq ft GREEN on hole 3."
            - "One ONLINE WELL station and one ONLINE RECLAIMED station, both with a 10000 gal daily cap."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 300 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 3, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green3_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "WELL", max_flow_gpm: 50, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 10000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_well_id: $.data.id, pump_well_v: $.data.version }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "RECLAIMED", max_flow_gpm: 50, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 10000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_recl_id: $.data.id, pump_recl_v: $.data.version }
          trigger:
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_well_id}", turf_area_id: "${green3_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_well_v}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_recl_id}", turf_area_id: "${green3_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_recl_v}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_ok_id: $.data.id }
          assert:
            - "the WELL call returns HTTP 422 and ${err_id} == ERR_WATER_ALLOCATION_EXCEEDED (gross 10 * 5.5 * 6.2 == 341.0 against a 300 gal allocation)"
            - "GET /irrigation-runs with pump_station_id == ${pump_well_id} returns total_count == 0"
            - "the RECLAIMED call returns HTTP 201 with IrrigationRun.${run_ok_id}.allotted_gal == 341.0 and flow_gpm == 5.68 (341.0 / 60 == 5.68333 -> 5.68)"
            - "IrrigationRun.${run_ok_id}.status == SCHEDULED and volume_gal == 0"
            - "Course.${course_id}.water_used_gal == 0.0 and water_posture == OPEN: only COMPLETED runs move the ledger"

      - name: scheduling_requires_the_window_to_sit_inside_the_planned_window
        claim_type: temporal_validation
        grounds:
          - validations[priority=41]
          - errors[ERR_APPLICATION_OUTSIDE_PLAN_WINDOW]
          - endpoints[POST /plan-tasks/{id}/schedule]
        distinguishing_aspect: "Containment is checked on both ends with the lower bound inclusive and the upper bound inclusive of window_end: a window starting one day before planned_window_start is refused with ERR_APPLICATION_OUTSIDE_PLAN_WINDOW (422), a window inside is accepted, and a window whose end lands exactly on planned_window_end is also accepted."
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN on hole 7."
            - "One ACTIVE 2026 plan with two PLANNED AERATION tasks on that green, both planned for [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z)."
            - "Three SCHEDULED AERATION windows on that green: 2026-08-09 06:00-08:00, 2026-08-10 06:00-08:00 and 2026-08-19 22:00 - 2026-08-20 00:00."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "AERATION", planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "AERATION", planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task2_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "AERATION", window_start: "2026-08-09T06:00:00Z", window_end: "2026-08-09T08:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_early_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "AERATION", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T08:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_inside_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "AERATION", window_start: "2026-08-19T22:00:00Z", window_end: "2026-08-20T00:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_edge_id: $.data.id }
          trigger:
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${w_early_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${w_inside_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "GET /agronomic-plans/${plan_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_now: $.data.version }
            - call: "POST /plan-tasks/${task2_id}/schedule"
              payload: { maintenance_window_id: "${w_edge_id}", expected_plan_version: "${plan_v_now}" }
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "the 2026-08-09 window returns HTTP 422 with ${err_id} == ERR_APPLICATION_OUTSIDE_PLAN_WINDOW (window_start is one day before planned_window_start)"
            - "MaintenanceWindow.${w_early_id}.plan_task_id == null and MaintenanceWindow.${w_early_id}.status == SCHEDULED"
            - "after the rejected call PlanTask.${task1_id}.status == PLANNED, so ${plan_v_active} was still current for the retry"
            - "the 2026-08-10 window succeeds: PlanTask.${task1_id}.status == SCHEDULED and MaintenanceWindow.${w_inside_id}.plan_task_id == ${task1_id}"
            - "the 2026-08-19 22:00 window succeeds: PlanTask.${task2_id}.status == SCHEDULED and MaintenanceWindow.${w_edge_id}.plan_task_id == ${task2_id}, because window_end == planned_window_end is inside the inclusive upper bound"
            - "AgronomicPlan.${plan_id}.status == ACTIVE and committed_nitrogen_lb == 0.00 (both tasks are AERATION)"

      - name: higher_priority_error_wins_when_two_rules_are_violated
        claim_type: priority_conflict
        grounds:
          - validations[priority=30]
          - validations[priority=35]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / buffer_zone_safety_outranks_license_category_referential
          rationale: "That §1.8 instance violates the safety buffer and the license category on one call and asserts only the safety error, then fixes the buffer to reveal the referential one."

      - name: individually_valid_tasks_collectively_exceed_the_budget
        claim_type: aggregate_validation
        grounds:
          - validations[priority=51]
          - calculations.plan_nitrogen_commitment_lb
        excluded_because:
          difficulty_instance: boundary_precision_check / plan_ledger_exactly_at_budget_then_one_nickel_over
          rationale: "That §1.8 instance schedules tasks that are each admissible until the aggregate lands exactly on the budget and then five hundredths of a pound over it."

      - name: the_state_gate_runs_before_the_fiscal_gate
        claim_type: cascading_validation
        grounds:
          - validations[priority=17]
          - validations[priority=51]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / plan_state_outranks_nitrogen_budget_fiscal
          rationale: "That §1.8 instance violates the plan-state precondition and the nitrogen budget on the same call and asserts the state error, which is only observable if the state check runs first."

  # =========================================================================
  - section: endpoints
    instances:
      - name: water_assessment_computed_read_returns_a_zero_bill_in_tier_one
        claim_type: computed_read
        grounds:
          - endpoints[GET /courses/{id}/water-assessment]
          - calculations.water_overage_assessment
        distinguishing_aspect: "The computed read is defined on a course that has never irrigated: every money field is 0.00, yet the tier is still resolved to T1 and surcharge_rate is still reported as 0.90, so the endpoint returns the full six-field breakdown rather than an empty or null body."
        test_recipe:
          setup:
            - "One course with a 100000 gal allocation and no pump stations and no irrigation runs."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 100000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          trigger:
            - call: "GET /courses/${course_id}/water-assessment"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { billable: $.data.billable_gal, base: $.data.base_charge, tier: $.data.tier, rate: $.data.surcharge_rate, surcharge: $.data.surcharge, total: $.data.total_charge }
          assert:
            - "HTTP 200 with response_type object"
            - "${billable} == 0.0 (max(0.0 - 100000, 0))"
            - "${base} == 0.00 and ${tier} == T1 (0.00 < TIER_T2_FLOOR)"
            - "${rate} == 0.90, ${surcharge} == 0.00 and ${total} == 0.00"
            - "Course.${course_id}.water_used_gal == 0.0 and Course.${course_id}.version == 1: a computed read writes nothing"

      - name: equipment_retire_with_a_correct_type_replacement_links_the_successor
        claim_type: conditional_action
        grounds:
          - endpoints[POST /equipment-units/{id}/retire]
          - validations[priority=37]
          - errors[ERR_REPLACEMENT_UNIT_TYPE_MISMATCH]
          - state_machines.EquipmentUnit.IN_SERVICE_to_RETIRED
        distinguishing_aspect: "Retire is conditional on the replacement's unit_type: naming the FAIRWAY_MOWER returns ERR_REPLACEMENT_UNIT_TYPE_MISMATCH (422) and writes nothing, while naming the second SPRAYER retires the unit, sets replaced_by_unit_id and leaves the dependent PEST_CONTROL window SCHEDULED because an IN_SERVICE sprayer still exists."
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN on hole 7."
            - "Two IN_SERVICE SPRAYER units and one IN_SERVICE FAIRWAY_MOWER, each with a 6000 hour life, a 250 hour service interval and 3.5 average daily hours."
            - "One SCHEDULED PEST_CONTROL window on that green for 2026-08-15 06:00-10:00 with a crew of 1 requiring a SPRAYER."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { course_id: "${course_id}", unit_type: "SPRAYER", model_year: 2018, purchase_cost: 62000, expected_life_hours: 6000, service_interval_hours: 250, avg_daily_hours: 3.5 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { spray_old_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { course_id: "${course_id}", unit_type: "SPRAYER", model_year: 2026, purchase_cost: 78000, expected_life_hours: 6000, service_interval_hours: 250, avg_daily_hours: 3.5 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { spray_new_id: $.data.id }
            - call: "POST /equipment-units"
              payload: { course_id: "${course_id}", unit_type: "FAIRWAY_MOWER", model_year: 2024, purchase_cost: 110000, expected_life_hours: 6000, service_interval_hours: 250, avg_daily_hours: 3.5 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { mower_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "PEST_CONTROL", window_start: "2026-08-15T06:00:00Z", window_end: "2026-08-15T10:00:00Z", crew_size: 1, required_unit_type: "SPRAYER" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_pest_id: $.data.id }
          trigger:
            - call: "POST /equipment-units/${spray_old_id}/retire"
              payload: { replacement_unit_id: "${mower_id}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /equipment-units/${spray_old_id}/retire"
              payload: { replacement_unit_id: "${spray_new_id}" }
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "the FAIRWAY_MOWER attempt returns HTTP 422 with ${err_id} == ERR_REPLACEMENT_UNIT_TYPE_MISMATCH"
            - "after the rejected call EquipmentUnit.${spray_old_id}.status == IN_SERVICE, replaced_by_unit_id == null and version == 1"
            - "the SPRAYER attempt returns HTTP 200: EquipmentUnit.${spray_old_id}.status == RETIRED, replaced_by_unit_id == ${spray_new_id} and version == 2"
            - "EquipmentUnit.${spray_new_id}.status == IN_SERVICE and version == 1: the successor is untouched"
            - "EquipmentUnit.${mower_id}.status == IN_SERVICE and version == 1"
            - "MaintenanceWindow.${w_pest_id}.status == SCHEDULED, deferral_count == 0 and crew_hours == 4.00 (one crew member for four hours): the dependent window survives because an IN_SERVICE SPRAYER remains"

      - name: pump_station_create_read_list_and_status_update_round_trip
        claim_type: standard_crud
        grounds:
          - endpoints[POST /pump-stations]
          - endpoints[GET /pump-stations/{id}]
          - endpoints[GET /pump-stations]
          - endpoints[PATCH /pump-stations/{id}/status]
        distinguishing_aspect: "The station family exposes create, read-by-id, filtered list and a status update, and the round trip proves they agree: the read-back carries the stored limits with withdrawn_today_gal 0.0, the status filter partitions the two rows before and after the update, and the update bumps only the updated row's version."
        test_recipe:
          setup:
            - "One course with a 500000 gal allocation."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "WELL", max_flow_gpm: 300, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 10000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_a_id: $.data.id, pump_a_status: $.data.status, pump_a_v: $.data.version }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "POND", max_flow_gpm: 450, max_concurrent_zones: 4, daily_withdrawal_cap_gal: 25000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_b_id: $.data.id }
            - call: "GET /pump-stations/${pump_a_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { read_cap: $.data.daily_withdrawal_cap_gal, read_withdrawn: $.data.withdrawn_today_gal }
            - call: "GET /pump-stations"
              payload: { course_id: "${course_id}", status: "ONLINE" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "PATCH /pump-stations/${pump_a_id}/status"
              payload: { status: "OFFLINE" }
              as: EquipmentTechnician
              as_user_id: "tech-1"
              captures: { patched_status: $.data.status, patched_v: $.data.version }
            - call: "GET /pump-stations"
              payload: { course_id: "${course_id}", status: "OFFLINE" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "GET /pump-stations"
              payload: { course_id: "${course_id}", source_type: "POND" }
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "both creates return HTTP 201 with ${pump_a_status} == ONLINE and ${pump_a_v} == 1 (the course posture is OPEN)"
            - "${read_cap} == 10000 and ${read_withdrawn} == 0.0"
            - "the first list call returns total_count == 2 and has_more == false"
            - "${patched_status} == OFFLINE and ${patched_v} == 2"
            - "the OFFLINE list call returns total_count == 1 whose single row id == ${pump_a_id}"
            - "the POND list call returns total_count == 1 whose single row id == ${pump_b_id} and whose status is still ONLINE and version 1"

      - name: window_action_endpoints_enforce_their_preconditions
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /maintenance-windows/{id}/reschedule]
          - errors[ERR_DEFERRAL_LIMIT_REACHED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / maintenance_window_defer_reschedule_cycle_caps_at_two
          rationale: "That §1.8 instance drives start, defer and reschedule in sequence and asserts each precondition, including the refusal of the third reschedule."

      - name: schedule_links_a_task_to_a_window_only_when_both_are_valid
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /plan-tasks/{id}/schedule]
          - validations[priority=18]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / task_scheduling_depends_on_target_window_state
          rationale: "That §1.8 instance tries the same link against a DEFERRED, a CANCELLED and a SCHEDULED window and asserts the association only forms on the last."

  # =========================================================================
  - section: errors
    instances:
      - name: every_declared_get_by_id_returns_its_own_not_found_error
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
          - errors[ERR_TURF_AREA_NOT_FOUND]
          - errors[ERR_PLAN_NOT_FOUND]
          - errors[ERR_PLAN_TASK_NOT_FOUND]
          - errors[ERR_APPLICATOR_NOT_FOUND]
          - errors[ERR_APPLICATION_NOT_FOUND]
          - errors[ERR_PUMP_STATION_NOT_FOUND]
          - errors[ERR_IRRIGATION_RUN_NOT_FOUND]
          - errors[ERR_WINDOW_NOT_FOUND]
          - errors[ERR_PLAY_EVENT_NOT_FOUND]
          - errors[ERR_EQUIPMENT_NOT_FOUND]
        distinguishing_aspect: "Ten reads against an empty database with ten distinct well-formed UUIDs prove each collection reports its OWN error_id rather than one shared generic 404, which is the failure mode a single not-found test cannot detect."
        test_recipe:
          setup:
            - "Empty database; no rows of any kind."
          setup_api_calls: []
          trigger:
            - call: "GET /turf-areas/11111111-1111-4111-8111-111111111102"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_turf: $.data.error_id }
            - call: "GET /agronomic-plans/11111111-1111-4111-8111-111111111103"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_plan: $.data.error_id }
            - call: "GET /plan-tasks/11111111-1111-4111-8111-111111111104"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_task: $.data.error_id }
            - call: "GET /applicators/11111111-1111-4111-8111-111111111105"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_appl: $.data.error_id }
            - call: "GET /applications/11111111-1111-4111-8111-111111111106"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_app: $.data.error_id }
            - call: "GET /pump-stations/11111111-1111-4111-8111-111111111107"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_pump: $.data.error_id }
            - call: "GET /irrigation-runs/11111111-1111-4111-8111-111111111108"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_run: $.data.error_id }
            - call: "GET /maintenance-windows/11111111-1111-4111-8111-111111111109"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_window: $.data.error_id }
            - call: "GET /play-events/11111111-1111-4111-8111-111111111110"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_play: $.data.error_id }
            - call: "GET /equipment-units/11111111-1111-4111-8111-111111111111"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_equip: $.data.error_id }
          assert:
            - "every call returns HTTP 404 with an error envelope carrying error_id and message"
            - "${err_turf} == ERR_TURF_AREA_NOT_FOUND"
            - "${err_plan} == ERR_PLAN_NOT_FOUND"
            - "${err_task} == ERR_PLAN_TASK_NOT_FOUND"
            - "${err_appl} == ERR_APPLICATOR_NOT_FOUND"
            - "${err_app} == ERR_APPLICATION_NOT_FOUND"
            - "${err_pump} == ERR_PUMP_STATION_NOT_FOUND"
            - "${err_run} == ERR_IRRIGATION_RUN_NOT_FOUND"
            - "${err_window} == ERR_WINDOW_NOT_FOUND"
            - "${err_play} == ERR_PLAY_EVENT_NOT_FOUND"
            - "${err_equip} == ERR_EQUIPMENT_NOT_FOUND"

      - name: clearing_an_unknown_weather_event_returns_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=16]
          - errors[ERR_WEATHER_EVENT_NOT_FOUND]
        distinguishing_aspect: "WeatherEvent has no read-by-id endpoint, so its existence error is only reachable through the clear action; the call must report ERR_WEATHER_EVENT_NOT_FOUND (404) and not the state error ERR_WEATHER_STATE_INVALID, because existence outranks state."
        test_recipe:
          setup:
            - "One course, so that the failure cannot be blamed on a missing course."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
          trigger:
            - call: "POST /weather-events/11111111-1111-4111-8111-111111111112/clear"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_id} == ERR_WEATHER_EVENT_NOT_FOUND"
            - "GET /courses/${course_id}/weather-events returns total_count == 0"
            - "Course.${course_id}.play_posture == OPEN and version == 1"

      - name: application_naming_an_unknown_product_returns_not_found
        claim_type: error_triggerable
        grounds:
          - validations[priority=9]
          - errors[ERR_PRODUCT_NOT_FOUND]
        distinguishing_aspect: "PesticideProduct's existence error is declared only on POST /applications, so it needs a fully valid surrounding chain — real turf area, real applicator, in-licence date — with only product_id unresolvable."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course, one 5500 sq ft GREEN on hole 7 and one CAT_3_TURF applicator whose licence is current."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-14001", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "11111111-1111-4111-8111-111111111113", applicator_id: "${appl_a_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 100, wind_speed_mph: 4, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 and ${err_id} == ERR_PRODUCT_NOT_FOUND"
            - "GET /applications with turf_area_id == ${green7_id} returns total_count == 0"
            - "TurfArea.${green7_id}.version == 1 and nitrogen_applied_lb_per_1000_ytd == 0.000"

      - name: a_reused_license_number_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=42]
          - errors[ERR_DUPLICATE_LICENSE_NUMBER]
        distinguishing_aspect: "Uniqueness is on license_number alone, not on the pair with full_name or category, so a second applicator with a different name and a different category but the same number is refused with ERR_DUPLICATE_LICENSE_NUMBER (409) while a one-character-different number is accepted."
        test_recipe:
          setup:
            - "One registered CAT_3_TURF applicator holding licence OR-CAT3-15001."
          setup_api_calls:
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-15001", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
          trigger:
            - call: "POST /applicators"
              payload: { full_name: "Miguel Santos", license_number: "OR-CAT3-15001", license_category: "CAT_7_AQUATIC", license_expires_on: "2028-01-31" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { err_id: $.data.error_id }
            - call: "POST /applicators"
              payload: { full_name: "Miguel Santos", license_number: "OR-CAT3-15002", license_category: "CAT_7_AQUATIC", license_expires_on: "2028-01-31" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_b_id: $.data.id }
          assert:
            - "the duplicate returns HTTP 409 and ${err_id} == ERR_DUPLICATE_LICENSE_NUMBER"
            - "the distinct number returns HTTP 201 with Applicator.${appl_b_id}.license_category == CAT_7_AQUATIC"
            - "GET /applicators returns total_count == 2, so the rejected call created nothing"
            - "Applicator.${appl_a_id}.version == 1"

      - name: a_run_with_no_remaining_daily_headroom_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=49]
          - errors[ERR_ZERO_ALLOTMENT]
          - calculations.irrigation_run_allotment
        distinguishing_aspect: "The zero-allotment guard is reachable only through the pump ledger: the first run consumes the station's entire 341 gal daily cap, so the second run's min(gross, headroom) collapses to 0.0 and the strict `> 0` test returns ERR_ZERO_ALLOTMENT (422) rather than booking a useless run."
        test_recipe:
          setup:
            - "One course with a 500000 gal allocation and one 5500 sq ft GREEN on hole 3."
            - "One ONLINE RECLAIMED station whose daily withdrawal cap is exactly 341 gal."
            - "One run 04:00-05:00 on 2026-08-05 already COMPLETED, which withdraws the whole cap."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 3, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green3_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "RECLAIMED", max_flow_gpm: 50, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 341 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_id: $.data.id, pump_v1: $.data.version }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green3_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_v1}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_a_id: $.data.id }
            - call: "POST /irrigation-runs/${run_a_id}/complete"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "GET /pump-stations/${pump_id}"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_v_now: $.data.version, withdrawn_now: $.data.withdrawn_today_gal }
          trigger:
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green3_id}", window_start: "2026-08-05T06:00:00Z", window_end: "2026-08-05T07:00:00Z", target_moisture_deficit_pct: 10, expected_pump_station_version: "${pump_v_now}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "IrrigationRun.${run_a_id}.allotted_gal == 341.0, flow_gpm == 5.68 and volume_gal == 341.0 (gross 10 * 5.5 * 6.2 == 341.0 exactly equals the cap)"
            - "${withdrawn_now} == 341.0, so headroom is max(341 - 341, 0) == 0"
            - "HTTP 422 and ${err_id} == ERR_ZERO_ALLOTMENT, not ERR_WATER_ALLOCATION_EXCEEDED (a RECLAIMED station is exempt from the fiscal gate)"
            - "GET /irrigation-runs with pump_station_id == ${pump_id} returns total_count == 1"
            - "Course.${course_id}.water_used_gal == 341.0 and water_posture == OPEN"

      - name: scheduling_a_task_that_is_already_scheduled_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=18]
          - errors[ERR_TASK_STATE_INVALID]
        distinguishing_aspect: "Only PLANNED is a legal `from` state for schedule, so re-scheduling the same task onto a second, perfectly valid window returns ERR_TASK_STATE_INVALID (409) and the second window keeps plan_task_id null."
        test_recipe:
          setup:
            - "One course, one 5500 sq ft GREEN on hole 7."
            - "One ACTIVE 2026 plan with one AERATION task planned for [2026-08-10T00:00:00Z, 2026-08-20T00:00:00Z)."
            - "Two AERATION windows on that green: 2026-08-11 06:00-08:00 and 2026-08-12 06:00-08:00, the first already carrying the task."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "AERATION", planned_window_start: "2026-08-10T00:00:00Z", planned_window_end: "2026-08-20T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "AERATION", window_start: "2026-08-11T06:00:00Z", window_end: "2026-08-11T08:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_first_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "AERATION", window_start: "2026-08-12T06:00:00Z", window_end: "2026-08-12T08:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_second_id: $.data.id }
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${w_first_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "GET /agronomic-plans/${plan_id}"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_now: $.data.version }
          trigger:
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${w_second_id}", expected_plan_version: "${plan_v_now}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and ${err_id} == ERR_TASK_STATE_INVALID (the expected_plan_version was current, so this is not the 412)"
            - "PlanTask.${task1_id}.status == SCHEDULED and maintenance_window_id still resolves to ${w_first_id}"
            - "MaintenanceWindow.${w_first_id}.plan_task_id == ${task1_id}"
            - "MaintenanceWindow.${w_second_id}.plan_task_id == null and status == SCHEDULED"
            - "AgronomicPlan.${plan_id}.version == ${plan_v_now}: the rejected call wrote nothing"

      - name: certifying_a_cancelled_play_event_is_rejected
        claim_type: error_triggerable
        grounds:
          - validations[priority=24]
          - validations[priority=33]
          - errors[ERR_PLAY_EVENT_STATE_INVALID]
        distinguishing_aspect: "A LIGHTNING declaration both cancels the event and closes the course, so two rules are violated at once; the priority-24 state error must win over ERR_COURSE_CLOSED (33) and over ERR_INSUFFICIENT_READINGS (48), even though no green has been measured."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course at version 1 and one SCHEDULED tournament round 14:00-18:00 over 18 holes."
            - "One ACTIVE LIGHTNING event expected to clear at 18:00, which cancels the round and closes the course."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, course_v1: $.data.version }
            - call: "POST /play-events"
              payload: { course_id: "${course_id}", event_type: "TOURNAMENT_ROUND", start_at: "2026-08-01T14:00:00Z", end_at: "2026-08-01T18:00:00Z", holes_in_play: 18, field_size: 78 }
