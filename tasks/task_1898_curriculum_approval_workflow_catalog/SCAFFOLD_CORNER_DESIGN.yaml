# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1898: Curriculum Approval Workflow & Catalog Publication
# Breadth walk over claim-extraction-guide sections. Instances already exercised
# by §1.8 appear as excluded_because stubs citing the covering difficulty instance.
# Fixture conventions: logical clock defaults to 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_term_applies_defaults
        claim_type: creation_defaults
        grounds:
          - entities.Term.fields.status
          - entities.Term.fields.scheduled_proposal_count
        distinguishing_aspect: "A new term starts in OPEN_FOR_PROPOSALS with version 1 and computed scheduled_proposal_count 0."
        test_recipe:
          setup: ["empty database; clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t_status: $.data.status, t_version: $.data.version, t_count: $.data.scheduled_proposal_count } }
          assert:
            - "captured t_status == OPEN_FOR_PROPOSALS (initial state)"
            - "captured t_version == 1"
            - "captured t_count == 0 (computed field initialized)"
      - name: create_proposal_missing_required_field_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /proposals without proposal_type is rejected 400 before any state change."
        test_recipe:
          setup: ["Department CS and term T1 exist (needed so only the missing field fails)"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /curriculum/proposals", payload: { proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}" }, as: FacultyProposer, as_user_id: "fac-001", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_VALIDATION"
            - "GET /curriculum/proposals returns 0 records (nothing persisted)"
      - name: create_proposal_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - entities.Proposal.fields.proposal_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "proposal_type outside {NEW_COURSE, COURSE_CHANGE, DEACTIVATION} is rejected 400."
        test_recipe:
          setup: ["Department CS and term T1 exist"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_PROGRAM", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}" }, as: FacultyProposer, as_user_id: "fac-001", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_VALIDATION"
      - name: create_proposal_extra_field_rejected
        claim_type: system_fields
        grounds:
          - entities.Proposal.fields.substantive_change_score
          - validations[priority=4]
        distinguishing_aspect: "Client-supplied computed field (substantive_change_score) is an unknown input key and rejected 400 — computed fields cannot be seeded by callers."
        test_recipe:
          setup: ["Department CS and term T1 exist"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", substantive_change_score: 99 }, as: FacultyProposer, as_user_id: "fac-001", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_VALIDATION (unknown field rejected, not silently ignored)"
      - name: proposal_create_copies_proposer_identity
        claim_type: system_fields
        grounds:
          - entities.Proposal.fields.proposer_id
          - entities.Proposal.fields.status
        distinguishing_aspect: "proposer_id is copied from X-User-ID at creation (not from the body), initial status is DRAFT, version is 1."
        test_recipe:
          setup: ["Department CS and term T1 exist"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
          trigger:
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "Compilers", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["build a compiler"], justification: "gap" }, as: FacultyProposer, as_user_id: "fac-001", captures: { pid: $.data.proposer_id, st: $.data.status, ver: $.data.version } }
          assert:
            - "captured pid == 'fac-001'"
            - "captured st == DRAFT"
            - "captured ver == 1"
      - name: get_proposal_not_found_returns_404
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /curriculum/proposals/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_NOT_FOUND"
      - name: list_proposals_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
          - entities.Proposal
        distinguishing_aspect: "limit/offset windowing over 3 proposals returns total_count 3 with correct has_more flips between pages."
        test_recipe:
          setup: ["Department CS, term T1; three DRAFT proposals created by fac-001 (distinct course numbers)"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "451", proposed_title: "B", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["b"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "452", proposed_title: "C", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["c"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001" }
          trigger:
            - { call: "GET /curriculum/proposals", payload: { limit: 2, offset: 0 }, as: Registrar, as_user_id: "reg-1" }
            - { call: "GET /curriculum/proposals", payload: { limit: 2, offset: 2 }, as: Registrar, as_user_id: "reg-1" }
          assert:
            - "page 1: data array length 2, total_count == 3, has_more == true"
            - "page 2: data array length 1, total_count == 3, has_more == false"
            - "every element carries meta envelope with api_request_id and api_request_timestamp"
      - name: decision_record_immutable_shape
        claim_type: immutability
        grounds:
          - entities.DecisionRecord
        distinguishing_aspect: "DecisionRecord has common_fields: false — records expose id and created_at but no version/updated_at keys, and no update endpoint exists."
        test_recipe:
          setup: ["Department CS, term T1; one proposal submitted (creates the SUBMIT record)"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
          trigger:
            - { call: "GET /curriculum/proposals/${prop}/decisions", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { rec_action: "$.data[0].action", rec_from: "$.data[0].from_status" } }
          assert:
            - "captured rec_action == SUBMIT and rec_from == DRAFT"
            - "each record JSON object contains keys id, created_at, proposal_id, action, from_status, to_status, actor_role, actor_id, rationale, recorded_term_id — and does NOT contain version or updated_at"
  - section: state_machines
    instances:
      - name: withdraw_effective_proposal_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Proposal
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "EFFECTIVE is terminal: withdrawing an EFFECTIVE proposal returns ERR_INVALID_STATE and the proposal stays EFFECTIVE."
        test_recipe:
          setup:
            - "Department CS; term T1; NEW_COURSE proposal fully approved with effective term T1; T1 PROPOSAL_FROZEN; proposal EFFECTIVE"
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "POST /curriculum/_clock/set_current_utc", payload: { to_iso8601: "2026-10-02T00:00:00Z" }, as: Registrar, as_user_id: "reg-1" }
            - { call: "POST /curriculum/terms/${t1}/freeze-proposals", payload: {}, as: Registrar, as_user_id: "reg-1" }
            - { call: "POST /curriculum/proposals/${prop}/activate", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { st: $.data.status } }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/withdraw", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { err: $.data.error_id } }
          assert:
            - "captured st == EFFECTIVE"
            - "captured err == ERR_INVALID_STATE"
            - "Proposal.${prop}.status remains EFFECTIVE"
      - name: decision_on_rejected_proposal_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Proposal.DEPT_REVIEW_to_REJECTED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "REJECTED is terminal: any further decision action returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Department CS; term T1; proposal submitted then REJECTED by the chair at DEPT_REVIEW"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "REJECT", rationale: "not needed" }, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { st: $.data.status } }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}", captures: { err: $.data.error_id } }
          assert:
            - "captured st == REJECTED"
            - "captured err == ERR_INVALID_STATE"
      - name: double_submit_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Proposal.DRAFT_to_DEPT_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Idempotency via state: a second submit of an already-submitted proposal fails with ERR_INVALID_STATE (no duplicate DEPT_REVIEW entry, no duplicate number hold)."
        test_recipe:
          setup: ["Department CS; term T1; proposal submitted once (DEPT_REVIEW)"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_INVALID_STATE"
            - "GET /curriculum/proposals/${prop}/decisions shows exactly 1 SUBMIT record"
      - name: activate_with_unlocked_term_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Proposal.APPROVED_to_EFFECTIVE
          - errors[ERR_TERM_NOT_LOCKED]
        distinguishing_aspect: "Activate requires the effective term to be PROPOSAL_FROZEN or CATALOG_FROZEN; with the term still OPEN_FOR_PROPOSALS the call fails ERR_TERM_NOT_LOCKED and the proposal stays APPROVED."
        test_recipe:
          setup: ["Department CS; term T1 OPEN_FOR_PROPOSALS; NEW_COURSE proposal fully approved with effective term T1"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
            - { call: "POST /curriculum/terms", payload: { term_code: "2026FA", academic_year: "2026-2027", sequence_index: 1, classes_start_date: "2026-08-24", classes_end_date: "2026-12-15", proposal_freeze_at: "2026-10-01T00:00:00Z", catalog_freeze_at: "2027-01-10T00:00:00Z" }, as: Registrar, as_user_id: "reg-1", captures: { t1: $.data.id } }
            - { call: "POST /curriculum/proposals", payload: { proposal_type: "NEW_COURSE", proposer_department_id: "${dept_cs}", requested_effective_term_id: "${t1}", proposed_subject_code: "CS", proposed_course_number: "450", proposed_title: "A", proposed_credit_hours: 3, contact_hours_per_week: 3, out_of_class_hours_per_week: 6, learning_outcomes: ["a"], justification: "x" }, as: FacultyProposer, as_user_id: "fac-001", captures: { prop: $.data.id } }
            - { call: "POST /curriculum/proposals/${prop}/submit", payload: {}, as: FacultyProposer, as_user_id: "fac-001" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: DepartmentChair, as_user_id: "${dept_cs}" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: CurriculumCommittee, as_user_id: "cc-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE" }, as: FacultySenate, as_user_id: "sen-1" }
            - { call: "POST /curriculum/proposals/${prop}/decisions", payload: { action: "APPROVE", effective_term_id: "${t1}" }, as: Registrar, as_user_id: "reg-1" }
          trigger:
            - { call: "POST /curriculum/proposals/${prop}/activate", payload: {}, as: Registrar, as_user_id: "reg-1", captures: { err: $.data.error_id } }
          assert:
            - "captured err == ERR_TERM_NOT_LOCKED"
            - "Proposal.${prop}.status remains APPROVED"
            - "no Course with number 450 exists (GET /curriculum/courses?course_number=450 returns empty array)"
      - name: notify_when_not_required_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.Proposal.REGISTRAR_REVIEW_to_REGISTRAR_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "NOTIFY is only valid when accreditor_notification_required == true and unsent; a NEW_COURSE proposal with score 20 in REGISTRAR_REVIEW rejects NOTIFY with ERR_INVALID_STATE."
        test_recipe:
          setup: ["Department CS; term T1; NEW_COURSE proposal (score 20) advanced to REGISTRAR_REVIEW"]
          setup_api_calls:
            - { call: "POST /curriculum/departments", payload: { dept_name: "Computer Science", subject_codes: ["CS"], college: "Engineering" }, as: Registrar, as_user_id: "reg-1", captures: { dept_cs: $.data.id } }
