        actor: HubAdmin
        preconditions:
          - "Agency must be PAUSED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: OutreachEvent
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "POST /outreach-events/{eid}/open"
        actor: HubAdmin
        preconditions:
          - "Event must be PLANNED (ERR_INVALID_STATE)"
        side_effects: []
      - from: OPEN
        to: FULL
        trigger: "system (automatic when registered_count reaches capacity)"
        actor: system
        preconditions:
          - "registered_count == capacity"
        side_effects:
          - "New registrations rejected (ERR_EVENT_FULL)"
      - from: FULL
        to: OPEN
        trigger: "system (automatic when a cancellation drops registered_count below capacity)"
        actor: system
        preconditions:
          - "registered_count < capacity"
        side_effects:
          - "Registrations accepted again"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /outreach-events/{eid}/complete or system (sweep: now >= event_date + 24h)"
        actor: HubAdmin | system
        preconditions:
          - "Event must be OPEN or FULL (ERR_INVALID_STATE)"
        side_effects:
          - "Registrations become markable as ATTENDED"
      - from: FULL
        to: COMPLETED
        trigger: "POST /outreach-events/{eid}/complete or system (sweep: now >= event_date + 24h)"
        actor: HubAdmin | system
        preconditions:
          - "Event must be OPEN or FULL (ERR_INVALID_STATE)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /outreach-events/{eid}/cancel"
        actor: HubAdmin
        preconditions:
          - "Event must be PLANNED, OPEN, or FULL (ERR_INVALID_STATE)"
        side_effects:
          - "All REGISTERED EventRegistrations -> CANCELLED; registered_count recomputed"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /outreach-events/{eid}/cancel"
        actor: HubAdmin
        preconditions:
          - "Event must be PLANNED, OPEN, or FULL (ERR_INVALID_STATE)"
        side_effects:
          - "All REGISTERED EventRegistrations -> CANCELLED; registered_count recomputed"
      - from: FULL
        to: CANCELLED
        trigger: "POST /outreach-events/{eid}/cancel"
        actor: HubAdmin
        preconditions:
          - "Event must be PLANNED, OPEN, or FULL (ERR_INVALID_STATE)"
        side_effects:
          - "All REGISTERED EventRegistrations -> CANCELLED; registered_count recomputed"

  - entity: EventRegistration
    initial_state: REGISTERED
    terminal_states: [ATTENDED]
    transitions:
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /event-registrations/{rid}/cancel or system (event cancel / client exit)"
        actor: Client (self) | IntakeCoordinator | HubAdmin | system
        preconditions:
          - "Registration must be REGISTERED (ERR_REGISTRATION_NOT_ACTIONABLE)"
        side_effects:
          - "OutreachEvent.registered_count -= 1; event FULL -> OPEN when count drops below capacity"
      - from: CANCELLED
        to: REGISTERED
        trigger: "POST /outreach-events/{eid}/registrations (re-registration of the same client reactivates the cancelled row)"
        actor: Client (self) | IntakeCoordinator | HubAdmin
        preconditions:
          - "Event must be OPEN (ERR_EVENT_FULL when FULL)"
          - "Logical now < event.event_date (ERR_EVENT_PAST)"
          - "Client must be ACTIVE (ERR_CLIENT_NOT_ACTIVE)"
        side_effects:
          - "OutreachEvent.registered_count += 1; event OPEN -> FULL when count reaches capacity"
      - from: REGISTERED
        to: ATTENDED
        trigger: "POST /event-registrations/{rid}/mark-attended"
        actor: HubAdmin
        preconditions:
          - "Registration must be REGISTERED (ERR_REGISTRATION_NOT_ACTIONABLE)"
          - "Event must be COMPLETED (ERR_EVENT_NOT_COMPLETED)"
        side_effects:
          - "OutreachEvent.attended_count += 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: assessment-verify-stale-client
    parent_entity: Client
    write_endpoint: "POST /clients/{cid}/assessments/{aid}/verify"
    occ_field: expected_client_version
    description: |
      Verifying an assessment against a Client whose version has advanced since the
      caller last read it is rejected. A prior successful verify legitimately
      supersedes the previous VERIFIED assessment and bumps Client.version, so a
      second verify carrying the older expected_client_version is operating on a
      stale client snapshot.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pantry-item-config-stale-version
    parent_entity: PantryItem
    write_endpoint: "PATCH /pantry-items/{iid}"
    occ_field: expected_item_version
    description: |
      Updating a PantryItem's point_cost, reorder_threshold, or per_visit_limit
      against a version the caller no longer holds is rejected. Restocks and
      checkouts legitimately advance PantryItem.version between the caller's read
      and this write.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: grant-approve-stale-fund
    parent_entity: GrantFund
    write_endpoint: "POST /grant-applications/{gid}/approve"
    occ_field: expected_fund_version
    description: |
      Approving an application against a GrantFund whose version has advanced
      since the caller read the fund is rejected. Any approval, disbursement, or
      expiry on the same fund legitimately moves committed_cents and bumps
      GrantFund.version, so the caller's remaining-basis snapshot is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412


# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: eligibility_band
    trigger: "IntakeAssessment DRAFT -> SUBMITTED (computed once, frozen on the assessment)"
    algorithm: threshold
    formula: |
      hh = household_size
      threshold = POVERTY_MONTHLY_CENTS[min(hh, 8)] + max(0, hh - 8) * POVERTY_ADDL_PERSON_CENTS
      income_ratio = round4_half_up(monthly_income_cents / threshold)   # 4 decimal places
      if housing_status == HOMELESS:  eligibility_band = FULL            # unconditional floor override
      elif income_ratio <= FULL_BAND_MAX_RATIO:  eligibility_band = FULL
      elif income_ratio <= PARTIAL_BAND_MAX_RATIO: eligibility_band = PARTIAL
      else: eligibility_band = INELIGIBLE
    input_set: "The submitting assessment's household_size, monthly_income_cents, housing_status"
    constants:
      POVERTY_MONTHLY_CENTS: {1: 125500, 2: 169300, 3: 213100, 4: 256900, 5: 300700, 6: 344500, 7: 388300, 8: 432100}
      POVERTY_ADDL_PERSON_CENTS: 43800
      FULL_BAND_MAX_RATIO: 1.30
      PARTIAL_BAND_MAX_RATIO: 2.00
    precision: "income_ratio 4 decimal places round_half_up; band comparisons are inclusive (<=)"

  - name: snap_benefit_estimate
    trigger: "POST /screenings/{sid}/score when program == SNAP"
    algorithm: tiered_pricing
    formula: |
      # Rounding order is pinned: each numbered step rounds BEFORE the next step reads it.
      a = client VERIFIED assessment
      (1) earned_deduction_cents   = round_half_up_cents(a.earned_income_cents * 0.20)
      (2) adjusted_income_cents    = max(0, a.monthly_income_cents - earned_deduction_cents - SNAP_STD_DED_CENTS)
      (3) excess_shelter_cents     = max(0, a.shelter_cost_cents - floor_cents(adjusted_income_cents / 2))
      (4) capped_shelter_cents     = min(excess_shelter_cents, SNAP_SHELTER_CAP_CENTS)
      (5) net_income_cents         = max(0, adjusted_income_cents - capped_shelter_cents)
      (6) thirty_pct_share_cents   = ceil_cents(net_income_cents * 0.30)
      (7) snap_estimate_cents      = max(0, SNAP_MAX_ALLOTMENT_CENTS[min(a.household_size, 8)] - thirty_pct_share_cents)
      # Compute-all-then-round (no per-step rounding) yields different cents; this scaffold pins the per-step order above.
    input_set: "The client's VERIFIED IntakeAssessment (earned_income_cents, monthly_income_cents, shelter_cost_cents, household_size)"
    constants:
      SNAP_STD_DED_CENTS: 19800
      SNAP_SHELTER_CAP_CENTS: 67200
      SNAP_MAX_ALLOTMENT_CENTS: {1: 29200, 2: 53600, 3: 76800, 4: 97500, 5: 115800, 6: 139000, 7: 153600, 8: 175600}
    precision: "whole cents; per-step rounding as pinned in formula (round_half_up at steps 1, floor at 3, ceil at 6)"

  - name: screening_score
    trigger: "POST /screenings/{sid}/score"
    algorithm: weighted_scoring
    formula: |
      a = client VERIFIED assessment
      income_pts  = 100 * max(0, 1 - a.income_ratio / 2.0)          # linear decay, floored at 0
      food_pts    = 100 * a.food_insecurity_score / 6
      housing_pts = HOUSING_POINTS[a.housing_status]                # STABLE 0 | COST_BURDENED 60 | UNSTABLE 85 | HOMELESS 100
      if program == CHILDCARE and a.dependents_under_18 == 0:  score = 0      # hard gate
      elif program == HOUSING and a.housing_status == STABLE:  score = min(39, raw)   # ceiling gate
      elif program == SNAP and a.receives_snap == true:        score = 0      # already receiving -> nothing to screen
      else: score = round_half_up_int(w_income * income_pts + w_food * food_pts + w_housing * housing_pts)
      weights:  SNAP {income 0.6, food 0.3, housing 0.1} | CHILDCARE {income 0.5, food 0.1, housing 0.4} | HOUSING {income 0.4, food 0.1, housing 0.5}
      score = clamp(0, 100, score)
      result_band: score >= 70 -> LIKELY_ELIGIBLE; 40 <= score <= 69 -> POSSIBLY_ELIGIBLE; score < 40 -> NOT_ELIGIBLE
    input_set: "The client's VERIFIED IntakeAssessment fields and the screening's program"
    constants:
      HOUSING_POINTS: {STABLE: 0, COST_BURDENED: 60, UNSTABLE: 85, HOMELESS: 100}
      LIKELY_MIN: 70
      POSSIBLY_MIN: 40
    precision: "integer score, round_half_up; band boundaries inclusive as stated"

  - name: pantry_points
    trigger: "assessment verify (allotment), line-item add (provisional), checkout (settled), void (reversal), client suspend/exit"
    algorithm: aggregation
    formula: |
      week_start(ts) = the Monday 00:00:00.000Z of the logical week containing ts
      allotment = min(WEEKLY_POINTS_BASE + WEEKLY_POINTS_PER_DEPENDENT * (household_size_effective - 1), WEEKLY_POINTS_CAP)
                = 0 when household_size_effective is null
      settled  = sum(PantryVisit.points_spent) over this client's visits
                 with status == COMPLETED and week_start == week_start(now)
      reserved = settled + provisional_points of this client's CHECKED_IN visit (at most one open visit enforced)
      Checkout admission: settled + this_visit.provisional_points <= allotment   (inclusive: exactly hitting the cap passes)
    input_set: "Client's PantryVisits filtered by status and week_start == current window; VERIFIED assessment for allotment"
    constants:
      WEEKLY_POINTS_BASE: 30
      WEEKLY_POINTS_PER_DEPENDENT: 10
      WEEKLY_POINTS_CAP: 60
    precision: "integer points; window boundary inclusive (a visit whose week_start equals current week_start counts)"
    variants:
      - name: settled_basis
        when: "Public client balance display (GET /clients/{id} field pantry_points_spent_settled)"
        difference: "Counts only COMPLETED visits; an open CHECKED_IN visit does not reduce the displayed settled figure"
      - name: reserved_basis
        when: "Checkout admission control"
        difference: "Adds the open visit's provisional_points; identical data yields a larger spent figure than settled_basis while a visit is open"

  - name: visit_frequency_check
    trigger: "POST /clients/{cid}/pantry-visits"
    algorithm: threshold
    formula: |
      window_visits = count of this client's PantryVisits with status IN {CHECKED_IN, COMPLETED}
                      and visit_date > (now - 168h)     # strict: a visit exactly 168h old does NOT count
      reject when window_visits >= MAX_VISITS_PER_168H  # the 2nd visit inside the window is admitted, the 3rd rejected
      also reject when the client already has a CHECKED_IN visit (ERR_VISIT_ALREADY_OPEN)
    input_set: "Client's PantryVisits in the trailing 168h, statuses CHECKED_IN and COMPLETED only (VOIDED excluded)"
    constants:
      MAX_VISITS_PER_168H: 2
      WINDOW_HOURS: 168
    precision: "strict > on the window edge; >= on the count"

  - name: grant_award_sizing
    trigger: "POST /grant-applications/{gid}/approve (BEFORE any fund mutation; reads pre-approval state)"
    algorithm: waterfall_allocation
    formula: |
      # Evaluation order pinned to break the circular appearance: approved_cents depends on
      # remaining_committed_basis, which depends on committed_cents, which includes this
      # application's approved_cents. Resolve by computing from PRE-approval state, then committing.
      remaining_pre   = fund.remaining_committed_basis          # before this approval
      lifetime_room   = LIFETIME_CAP_CENTS - client.lifetime_grant_cents
      approved_cents  = min(requested_cents, PER_AWARD_CAP_CENTS, remaining_pre, lifetime_room)
      if approved_cents <= 0: reject ERR_AWARD_CAP_EXHAUSTED
      then commit: committed_cents += approved_cents; fund.version += 1
    input_set: "Application.requested_cents; fund.remaining_committed_basis (pre); client.lifetime_grant_cents (pre)"
    constants:
      PER_AWARD_CAP_CENTS: 150000
      LIFETIME_CAP_CENTS: 300000
    precision: "integer cents; min over four caps evaluated on pre-approval snapshot"

  - name: fund_remaining
    trigger: "any approval, disbursement, approval-expiry sweep, or fund read"
    algorithm: aggregation
    formula: |
      committed_cents  = sum(approved_cents) over fund's applications with status == APPROVED
      disbursed_cents  = sum(approved_cents) over fund's applications with status == DISBURSED
      remaining_committed_basis = allocated_cents - committed_cents - disbursed_cents
      remaining_cash_basis      = allocated_cents - disbursed_cents
    input_set: "Fund's EmergencyGrantApplications filtered by status IN {APPROVED} / {DISBURSED} respectively"
    precision: "integer cents"
    variants:
      - name: committed_basis
        when: "Award sizing and EXHAUSTED posture (conservative: committed money is spoken for)"
        difference: "Subtracts committed_cents; with committed 100000 and disbursed 50000 on a 500000 fund -> 350000"
      - name: cash_basis
        when: "Cash-planning reads on GET /grant-funds/{fid} (optimistic: only disbursed money has left)"
        difference: "Ignores committed_cents; same data -> 450000, diverging from committed_basis by exactly committed_cents"

  - name: referral_capacity_check
    trigger: "POST /clients/{cid}/referrals and POST /referrals/{rid}/resend"
    algorithm: threshold
    formula: |
      active = agency.active_referral_count           # statuses {SENT, ACKNOWLEDGED, APPOINTMENT_BOOKED}
      admit when active < agency.weekly_capacity      # inclusive boundary: active == capacity rejects
      overflow: when client.risk_tier == CRISIS, admit while active < floor(agency.weekly_capacity * CRISIS_OVERFLOW_PCT)
      otherwise reject ERR_AGENCY_CAPACITY_FULL
    input_set: "Agency's Referrals in active statuses; client's current risk_tier"
    constants:
      CRISIS_OVERFLOW_PCT: 1.2
    precision: "integer count vs floor-scaled capacity; strict < on admit"

  - name: risk_tier
    trigger: "assessment verify, shelter check-out, assessment expiry"
    algorithm: weighted_scoring
    formula: |
      a = client's VERIFIED assessment (null-safe: when none, risk_tier = null)
      if a.housing_status IN {UNSTABLE, HOMELESS} or a.food_insecurity_score >= 5: risk_tier = CRISIS
      elif a.housing_status == COST_BURDENED or a.food_insecurity_score >= 3 or a.income_ratio <= FULL_BAND_MAX_RATIO: risk_tier = ELEVATED
      else: risk_tier = STABLE
    input_set: "Client's single VERIFIED IntakeAssessment (at most one exists by the supersede rule)"
    precision: "enum; food_insecurity thresholds inclusive (>=)"

  - name: counselor_assignment
    trigger: "POST /clients/{cid}/screenings (server selects the assigned counselor)"
    algorithm: topological
    formula: |
      candidates = StaffMember where staff_role == BENEFITS_COUNSELOR and status == ACTIVE
      empty pool -> reject ERR_NO_COUNSELOR_AVAILABLE
      rank by active_case_load ASC; ties broken by created_at ASC
      selected counselor's active_case_load += 1 on assignment
    input_set: "All StaffMember rows (filter as above); active_case_load counts screenings in {STARTED, SCREENED, APPLICATION_ASSISTED, SUBMITTED}"
    precision: "deterministic total order: (active_case_load, created_at); random fields forbidden"

  - name: shelter_stay_windows
    trigger: "POST /clients/{cid}/shelter-stays"
    algorithm: interval_merge
    formula: |
      check_out_exclusive    = date(check_in_date) + planned_nights days
      buffer_until_exclusive = check_out_exclusive + 1 day when bed.features contains PET_FRIENDLY, else check_out_exclusive
      Bed rule (half-open with sanitation buffer): conflict when an existing stay s2 on the same bed
        with status IN {RESERVED, OCCUPIED} satisfies  new.check_in_date < s2.buffer_until_exclusive
        AND s2.check_in_date < new.buffer_until_exclusive.
        Back-to-back turnover (new.check_in_date == s2.check_out_exclusive) is ALLOWED for non-PET beds;
        for PET_FRIENDLY beds the next check-in must be >= s2.check_out_exclusive + 1 day.
      Client rule (closed night-set intersection): conflict when an existing stay s2 for the same client
        with status IN {RESERVED, OCCUPIED} satisfies  new.check_in_date <= s2.check_out_exclusive - 1 day
        AND s2.check_in_date <= new.check_out_exclusive - 1 day.
        Same-day turnover IS allowed for the client (their nights do not intersect), but is NOT allowed
        on a PET_FRIENDLY bed — the two rules differ in interval semantics by design.
    input_set: "ShelterStays sharing the same bed_id (bed rule) or same client_id (client rule), statuses RESERVED and OCCUPIED"
    constants:
      MAX_STAY_NIGHTS: 14
      BOOKING_HORIZON_DAYS: 13
      NO_SHOW_GRACE_DAYS: 1
      PET_SANITATION_BUFFER_DAYS: 1
    precision: "whole ISO days; half-open [check_in, buffer_until) for beds, closed nights [check_in, check_out-1] for clients"

  - name: usage_summary
    trigger: "GET /reports/usage-summary"
    algorithm: aggregation
    formula: |
      Window: records with the relevant timestamp in [from_date 00:00:00Z, to_date 23:59:59.999Z] inclusive;
      omitted bounds are open-ended. All counts/sums scoped to the window:
        clients_active            = count(Client status == ACTIVE)                                   # point-in-time, window-agnostic
        visits_completed          = count(PantryVisit status == COMPLETED, visit_date in window)
        points_redeemed           = sum(PantryVisit.points_spent over those visits)
        screenings_by_program     = {p: count(BenefitsScreening program == p, created_at in window)} for p in {SNAP, CHILDCARE, HOUSING}
        grants_approved_cents     = sum(approved_cents over applications with approved_at in window)
        grants_disbursed_cents    = sum(approved_cents over applications with disbursed_at in window)
        referrals_by_status       = {s: count(Referral status == s, created_at in window)} for all 8 statuses
        shelter_nights_served     = sum over CHECKED_OUT stays with actual_check_out_date in window of
                                    (date(actual_check_out_date) - date(check_in_date)) nights
        event_attendance          = count(EventRegistration status == ATTENDED, event.event_date in window)
    input_set: "All hub entities; per-metric filters and window fields as pinned in formula"
    precision: "integer counts/cents/nights; window boundaries inclusive"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present except for Anonymous. For staff-backed roles, X-User-ID must reference an ACTIVE StaffMember whose staff_role matches the role claim; for Client, an existing non-EXITED Client.id; for PartnerAgencyRep, an existing PartnerAgency.id"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The claimed role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (client, then child resource, then deeper segments)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: auth
    check: "Ownership/scope: Client role may only touch resources whose owning client_id == X-User-ID; PartnerAgencyRep may only touch referrals whose agency_id == X-User-ID; action endpoints pinned to a recorded actor (screening.counselor_id, grant reviewed_by) require that actor"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "endpoints acting on owned resources"

  - priority: 5
    category: auth
    check: "Confidentiality wall: PantryStaff, ShelterCoordinator, and PartnerAgencyRep never read IntakeAssessment or BenefitsScreening data (GET /assessments, GET /screenings)"
    error_id: ERR_CONFIDENTIAL
    http_status: 403
    applies_to: "GET /assessments, GET /screenings"

  - priority: 6
    category: state
    check: "Target resource's current state admits the requested transition per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints (generic fallback when no machine-specific error applies)"

  - priority: 7
    category: state
    check: "Optimistic concurrency: on endpoints taking expected_<parent>_version, the supplied value must equal the parent entity's current version; evaluated immediately after state preconditions and before business rules"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /clients/{cid}/assessments/{aid}/verify, PATCH /pantry-items/{iid}, POST /grant-applications/{gid}/approve"

  - priority: 8
    category: state
    check: "Client status gate: client must be ACTIVE (never SUSPENDED/EXITED/INTAKE_PENDING) for pantry check-in, screening creation, grant creation/submit, shelter-stay creation, referral creation, event registration"
    error_id: ERR_CLIENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /clients/{cid}/pantry-visits, POST /clients/{cid}/screenings, POST /clients/{cid}/grant-applications, POST /grant-applications/{gid}/submit, POST /clients/{cid}/shelter-stays, POST /clients/{cid}/referrals, POST /outreach-events/{eid}/registrations, POST /shelter-stays/{sid}/check-in"

  - priority: 9
    category: state
    check: "Client holds a VERIFIED IntakeAssessment (required for services that size benefits off household data)"
    error_id: ERR_ASSESSMENT_REQUIRED
    http_status: 409
    applies_to: "POST /clients/{cid}/pantry-visits, POST /clients/{cid}/screenings, POST /clients/{cid}/grant-applications, POST /grant-applications/{gid}/submit, POST /clients/{cid}/shelter-stays, POST /screenings/{sid}/score"

  - priority: 10
    category: business_safety
    check: "Segregation of duties on grant review: reviewer StaffMember.id must differ from application.created_by_user_id (a GrantReviewer who assisted the intake may not review that application)"
    error_id: ERR_SOD_CONFLICT
    http_status: 409
    applies_to: "POST /grant-applications/{gid}/begin-review"

  - priority: 11
    category: business_safety
    check: "Two-person rule on disbursement: acting HubAdmin X-User-ID must differ from application.reviewed_by"
    error_id: ERR_SOD_CONFLICT
    http_status: 409
    applies_to: "POST /grant-applications/{gid}/disburse"

  - priority: 12
    category: business_safety
    check: "Assessment submission requires consent_confidential == true"
    error_id: ERR_CONSENT_REQUIRED
    http_status: 422
    applies_to: "POST /clients/{cid}/assessments/{aid}/submit"

  - priority: 13
    category: business_temporal
    check: "Shelter stay window: check_in_date within [today, today + 13 days]; planned_nights in 1..14; check-in action only on [check_in_date, check_in_date + 1 day]"
    error_id: ERR_STAY_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /clients/{cid}/shelter-stays, POST /shelter-stays/{sid}/check-in"

  - priority: 14
    category: business_temporal
    check: "Pantry visit frequency: fewer than 2 visits with status IN {CHECKED_IN, COMPLETED} and visit_date > now - 168h"
    error_id: ERR_VISIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /clients/{cid}/pantry-visits"

  - priority: 15
    category: business_temporal
    check: "Event registration only before event_date; grant disbursement only within approved_at + 72h inclusive"
    error_id: ERR_EVENT_PAST
    http_status: 422
    applies_to: "POST /outreach-events/{eid}/registrations (ERR_EVENT_PAST); POST /grant-applications/{gid}/disburse (ERR_DISBURSE_WINDOW_LAPSED, http 409)"

  - priority: 16
    category: business_constraint
    check: "Shelter placement: bed.status == AVAILABLE (ERR_BED_OUT_OF_SERVICE); bed half-open interval incl. PET buffer free (ERR_BED_NOT_AVAILABLE); client closed night-set intersection free (ERR_CLIENT_STAY_OVERLAP); client not shelter_restricted (ERR_SHELTER_RESTRICTED); no second CHECKED_IN visit (ERR_VISIT_ALREADY_OPEN)"
    error_id: ERR_BED_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /clients/{cid}/shelter-stays, POST /clients/{cid}/pantry-visits"

  - priority: 17
    category: business_constraint
    check: "Uniqueness: (event_id, client_id) among non-CANCELLED registrations (ERR_ALREADY_REGISTERED); (shelter_site, bed_label) (ERR_DUPLICATE_BED_LABEL); agency_name (ERR_DUPLICATE_AGENCY); staff email (ERR_DUPLICATE_STAFF_EMAIL); (fund_name, fiscal_year) (ERR_DUPLICATE_FUND); item_name among ACTIVE items (ERR_DUPLICATE_ITEM)"
    error_id: ERR_ALREADY_REGISTERED
    http_status: 409
    applies_to: "creation endpoints for events/registrations/beds/agencies/staff/funds/items"

  - priority: 18
    category: business_referential
    check: "Referral service_category must be an element of the agency's service_categories; warm_handoff requires agency.accepts_walk_ins == true (ERR_WALK_INS_NOT_ACCEPTED)"
    error_id: ERR_CATEGORY_NOT_SERVED
    http_status: 422
    applies_to: "POST /clients/{cid}/referrals"

  - priority: 19
    category: business_constraint
    check: "Agency admission per referral_capacity_check (weekly_capacity with CRISIS overflow up to floor(capacity*1.2)); PATCH weekly_capacity must be >= active_referral_count (ERR_CAPACITY_BELOW_ACTIVE)"
    error_id: ERR_AGENCY_CAPACITY_FULL
    http_status: 409
    applies_to: "POST /clients/{cid}/referrals, POST /referrals/{rid}/resend, PATCH /partner-agencies/{aid}"

  - priority: 20
    category: business_constraint
    check: "Pantry line-item rules: item ACTIVE and quantity_on_hand >= quantity at line-add (ERR_ITEM_NOT_AVAILABLE); cumulative per-item units in the visit <= per_visit_limit (ERR_ITEM_LIMIT_EXCEEDED)"
    error_id: ERR_ITEM_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /pantry-visits/{vid}/line-items"

  - priority: 21
    category: business_fiscal
    check: "Checkout points admission per pantry_points reserved basis: settled + this visit's provisional <= allotment (inclusive); grant creation requested_cents within [100, 150000] (ERR_INVALID_REQUEST); award sizing > 0 at approval (ERR_AWARD_CAP_EXHAUSTED)"
    error_id: ERR_POINTS_BALANCE_EXCEEDED
    http_status: 422
    applies_to: "POST /pantry-visits/{vid}/checkout, POST /clients/{cid}/grant-applications, POST /grant-applications/{gid}/approve"

  - priority: 22
    category: business_fiscal
    check: "Fund lifecycle gates: creation/submit against CLOSED fund rejected; close rejected while applications occupy open states (ERR_FUND_HAS_OPEN_APPLICATIONS)"
    error_id: ERR_FUND_CLOSED
    http_status: 409
    applies_to: "POST /clients/{cid}/grant-applications, POST /grant-applications/{gid}/submit, POST /grant-funds/{fid}/close"

  - priority: 23
    category: business_safety
    check: "Shelter eligibility: client's VERIFIED assessment housing_status must be UNSTABLE or HOMELESS (ERR_NOT_HOUSING_INSECURE); client.shelter_restricted must be false (ERR_SHELTER_RESTRICTED, http 409)"
    error_id: ERR_NOT_HOUSING_INSECURE
    http_status: 422
    applies_to: "POST /clients/{cid}/shelter-stays"

  - priority: 24
    category: business_constraint
    check: "Screening assist requires result_band in {LIKELY_ELIGIBLE, POSSIBLY_ELIGIBLE}; counselor pool non-empty per counselor_assignment (ERR_NO_COUNSELOR_AVAILABLE); event registration requires event status OPEN (ERR_EVENT_FULL when FULL); mark-attended requires event COMPLETED (ERR_EVENT_NOT_COMPLETED)"
    error_id: ERR_SCREENING_NOT_ACTIONABLE
    http_status: 409
    applies_to: "POST /screenings/{sid}/assist, POST /clients/{cid}/screenings, POST /outreach-events/{eid}/registrations, POST /event-registrations/{rid}/mark-attended"

  - priority: 25
    category: business_temporal
    check: "Referral SLA bookkeeping: sweep expires SENT referrals strictly after ack_due_at; assessment VERIFIED expires at now >= expires_at; approved grants expire strictly after approved_at + 72h; RESERVED stays flip NO_SHOW after check_in_date + 1 day; events auto-complete at now >= event_date + 24h"
    error_id: ERR_DISBURSE_WINDOW_LAPSED
    http_status: 409
    applies_to: "system sweep ordering; manual disburse after window"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Test-driving infrastructure ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; never falls back to wall-clock). All date-window rules (168h visit window, week windows, SLA, expiry, event dates) evaluate against this clock."
    roles: [HubAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["Clock moves forward only; does NOT itself run auto-transitions (use /_sweeps/run_pending_transitions)"]

  - method: POST
    path: "/_sweeps/run_pending_transitions"
    description: "Ops-run checkpoint: evaluates all clock-driven auto-transitions in pinned order (1) IntakeAssessment VERIFIED->EXPIRED, (2) Referral SENT->EXPIRED, (3) ShelterStay RESERVED->NO_SHOW, (4) EmergencyGrantApplication APPROVED->EXPIRED, (5) OutreachEvent OPEN/FULL->COMPLETED; each fired transition runs its §1.2 side effects (including fund reopens and queued-grant promotion)"
    roles: [HubAdmin]
    code: 200
    input: []
    output: { assessments_expired: integer, referrals_expired: integer, stays_marked_no_show: integer, grants_expired: integer, events_completed: integer, queued_grants_promoted: integer }
    side_effects: ["Per-type auto transitions and their cascades"]

  # --- Staff ---
  - method: POST
    path: "/staff"
    description: "Create a StaffMember (bootstrap path for every staff-backed role)"
    roles: [HubAdmin]
    code: 201
    input: [full_name, email, staff_role]
    output: StaffMember
    side_effects: ["status=ACTIVE, active_case_load=0; duplicate email -> ERR_DUPLICATE_STAFF_EMAIL"]

  - method: GET
    path: "/staff"
    description: "List staff with optional filters"
    roles: [HubAdmin]
    code: 200
    input: ["staff_role?", "status?", "limit?", "offset?"]
    output: StaffMember[]
    side_effects: []

  # --- Clients ---
  - method: POST
    path: "/clients"
    description: "Register a client (self-service via Anonymous, or assisted by staff)"
    roles: [Anonymous, IntakeCoordinator, HubAdmin]
    code: 201
    input: [alias_name, contact_channel, population_type, "enrolled_credits?"]
    output: Client
    side_effects: ["status=INTAKE_PENDING; enrolled_credits >= 6 required when population_type == ENROLLED_STUDENT (ERR_INVALID_REQUEST)"]

  - method: GET
    path: "/clients"
    description: "List clients with filters and envelope pagination"
    roles: [IntakeCoordinator, PantryStaff, BenefitsCounselor, GrantReviewer, ShelterCoordinator, HubAdmin]
    code: 200
    input: ["status?", "population_type?", "risk_tier?", "limit?", "offset?"]
    output: Client[]
    side_effects: []

  - method: GET
    path: "/clients/{cid}"
    description: "Read one client; Client role may read only its own record"
    roles: [Client, IntakeCoordinator, PantryStaff, BenefitsCounselor, GrantReviewer, ShelterCoordinator, HubAdmin]
    code: 200
    input: []
    output: Client
    side_effects: []

  - method: POST
    path: "/clients/{cid}/suspend"
    description: "Suspend an ACTIVE client; auto-voids any CHECKED_IN visit"
    roles: [HubAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["Client ACTIVE -> SUSPENDED; CHECKED_IN PantryVisit -> VOIDED (provisional lines discarded)"]

  - method: POST
    path: "/clients/{cid}/reinstate"
    description: "Reinstate a SUSPENDED client"
    roles: [HubAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["Client SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/clients/{cid}/exit"
    description: "Exit a client; unwinds open engagements (stays, referrals, registrations, open visit, DRAFT assessments)"
    roles: [IntakeCoordinator, HubAdmin]
    code: 200
    input: []
    output: Client
    side_effects: ["Client -> EXITED; RESERVED ShelterStays -> CANCELLED; INITIATED/SENT Referrals -> WITHDRAWN (SENT decrement agency.active_referral_count); future REGISTERED EventRegistrations -> CANCELLED (event count/FLIP recompute); CHECKED_IN PantryVisit -> VOIDED; DRAFT IntakeAssessments -> DISCARDED"]

  # --- Intake assessments (confidential) ---
  - method: POST
    path: "/clients/{cid}/assessments"
    description: "Create a DRAFT intake assessment"
    roles: [Client, IntakeCoordinator]
    code: 201
    input: [household_size, monthly_income_cents, "earned_income_cents?", "shelter_cost_cents?", housing_status, dependents_under_18, receives_snap, receives_childcare_subsidy, food_insecurity_score, consent_confidential]
    output: IntakeAssessment
    side_effects: ["status=DRAFT; client must not be EXITED (ERR_CLIENT_NOT_ACTIVE)"]

  - method: GET
    path: "/assessments"
    description: "List assessments (confidential: walled off from PantryStaff/ShelterCoordinator/PartnerAgencyRep)"
    roles: [Client, IntakeCoordinator, BenefitsCounselor, GrantReviewer, HubAdmin]
    code: 200
    input: [client_id, "status?", "verified_by?", "limit?", "offset?"]
    output: IntakeAssessment[]
    side_effects: []

  - method: GET
    path: "/assessments/{aid}"
    description: "Read one assessment (confidential)"
    roles: [Client, IntakeCoordinator, BenefitsCounselor, GrantReviewer, HubAdmin]
    code: 200
    input: []
    output: IntakeAssessment
    side_effects: []

  - method: POST
    path: "/clients/{cid}/assessments/{aid}/submit"
    description: "Submit a DRAFT assessment; freezes income_ratio and eligibility_band"
    roles: [Client, IntakeCoordinator]
    code: 200
    input: []
    output: IntakeAssessment
    side_effects: ["DRAFT -> SUBMITTED; computes eligibility_band + income_ratio"]

  - method: POST
    path: "/clients/{cid}/assessments/{aid}/verify"
    description: "Verify a SUBMITTED assessment; supersedes the client's prior VERIFIED assessment; OCC on Client.version"
    roles: [IntakeCoordinator]
    code: 200
    input: [expected_client_version]
    output: IntakeAssessment
    side_effects: ["SUBMITTED -> VERIFIED; prior VERIFIED -> SUPERSEDED; client derived fields recomputed; first verification flips Client INTAKE_PENDING -> ACTIVE; increments Client.version by 1"]

  - method: POST
    path: "/clients/{cid}/assessments/{aid}/return"
    description: "Return a SUBMITTED assessment for corrections"
    roles: [IntakeCoordinator]
    code: 200
    input: [return_notes]
    output: IntakeAssessment
    side_effects: ["SUBMITTED -> RETURNED; return_notes recorded"]

  - method: POST
    path: "/clients/{cid}/assessments/{aid}/revise"
    description: "Reopen a RETURNED assessment to DRAFT, optionally overwriting fields in place"
    roles: [Client, IntakeCoordinator]
    code: 200
    input: ["household_size?", "monthly_income_cents?", "earned_income_cents?", "shelter_cost_cents?", "housing_status?", "dependents_under_18?", "receives_snap?", "receives_childcare_subsidy?", "food_insecurity_score?", "consent_confidential?"]
    output: IntakeAssessment
    side_effects: ["RETURNED -> DRAFT; supplied fields overwritten; income_ratio/eligibility_band cleared"]

  # --- Pantry catalog ---
  - method: POST
    path: "/pantry-items"
    description: "Create a pantry item with initial stock"
    roles: [HubAdmin]
    code: 201
    input: [item_name, category, point_cost, quantity_on_hand, reorder_threshold, per_visit_limit]
    output: PantryItem
    side_effects: ["status=ACTIVE; restock_flag initialized (quantity_on_hand <= reorder_threshold)"]

  - method: GET
    path: "/pantry-items"
    description: "List pantry items (clients may browse the catalog)"
    roles: [Client, IntakeCoordinator, PantryStaff, BenefitsCounselor, GrantReviewer, ShelterCoordinator, HubAdmin]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: PantryItem[]
    side_effects: []

  - method: PATCH
    path: "/pantry-items/{iid}"
    description: "Update pricing/limits config; OCC on PantryItem.version"
    roles: [HubAdmin]
    code: 200
    input: ["point_cost?", "reorder_threshold?", "per_visit_limit?", expected_item_version]
    output: PantryItem
    side_effects: ["increments PantryItem.version by 1; point_cost changes never retro-edit pinned VisitLineItem.points_charged"]

  - method: POST
    path: "/pantry-items/{iid}/restock"
    description: "Add stock; quantity >= 1"
    roles: [PantryStaff, HubAdmin]
    code: 200
    input: [quantity]
    output: PantryItem
    side_effects: ["quantity_on_hand += quantity; restock_flag recomputed; increments PantryItem.version by 1"]

  - method: POST
    path: "/pantry-items/{iid}/discontinue"
    description: "Discontinue an item (blocks new line-item adds)"
    roles: [HubAdmin]
    code: 200
    input: []
    output: PantryItem
    side_effects: ["ACTIVE -> DISCONTINUED"]

  # --- Pantry visits ---
  - method: POST
    path: "/clients/{cid}/pantry-visits"
    description: "Check in a client to the pantry; enforces ACTIVE client, VERIFIED assessment, one-open-visit, and the 168h frequency limit"
    roles: [PantryStaff]
    code: 201
    input: []
    output: PantryVisit
    side_effects: ["status=CHECKED_IN; visit_date=now; week_start computed"]

  - method: GET
    path: "/pantry-visits"
    description: "List visits (Client sees only own)"
    roles: [Client, PantryStaff, HubAdmin]
    code: 200
    input: [client_id, "status?", "limit?", "offset?"]
    output: PantryVisit[]
    side_effects: []

  - method: GET
    path: "/pantry-visits/{vid}"
    description: "Read one visit (Client only own)"
    roles: [Client, PantryStaff, HubAdmin]
    code: 200
    input: []
    output: PantryVisit
    side_effects: []

  - method: POST
    path: "/pantry-visits/{vid}/line-items"
    description: "Add an item line to an open visit; pins points_charged at add time"
    roles: [PantryStaff]
    code: 201
    input: [item_id, quantity]
    output: VisitLineItem
    side_effects: ["visit.provisional_points += quantity * item.point_cost (pinned)"]

  - method: GET
    path: "/visit-line-items"
    description: "List line items filtered by visit and/or item"
    roles: [PantryStaff, HubAdmin]
    code: 200
    input: ["visit_id?", "item_id?", "limit?", "offset?"]
    output: VisitLineItem[]
    side_effects: []

  - method: GET
    path: "/visit-line-items/{liid}"
    description: "Read one line item"
    roles: [PantryStaff, HubAdmin]
    code: 200
    input: []
    output: VisitLineItem
    side_effects: []

  - method: POST
    path: "/pantry-visits/{vid}/checkout"
    description: "Complete a visit: points admission on reserved basis, then stock decrement and restock_flag recompute per line"
    roles: [PantryStaff]
    code: 200
    input: []
    output: PantryVisit
    side_effects: ["CHECKED_IN -> COMPLETED; points_spent finalized; per-line quantity_on_hand decrement + restock_flag recompute; client settled/reserved points recomputed"]

  - method: POST
    path: "/pantry-visits/{vid}/void"
    description: "Void a visit; from COMPLETED restores stock and points and frees the frequency slot"
    roles: [PantryStaff, HubAdmin]
    code: 200
    input: []
    output: PantryVisit
    side_effects: ["CHECKED_IN|COMPLETED -> VOIDED; COMPLETED void restores quantity_on_hand per line, recomputes restock_flag, decrements settled points, frees frequency slot"]

  # --- Benefits screenings ---
  - method: POST
    path: "/clients/{cid}/screenings"
    description: "Open a benefits screening; counselor auto-assigned per counselor_assignment selector"
    roles: [IntakeCoordinator, BenefitsCounselor]
    code: 201
    input: [program]
    output: BenefitsScreening
    side_effects: ["status=STARTED; counselor assigned (least active_case_load, tie created_at ASC); empty pool -> ERR_NO_COUNSELOR_AVAILABLE"]

  - method: GET
    path: "/screenings"
    description: "List screenings (confidential)"
    roles: [Client, IntakeCoordinator, BenefitsCounselor, HubAdmin]
    code: 200
    input: ["client_id?", "counselor_id?", "program?", "status?", "limit?", "offset?"]
    output: BenefitsScreening[]
    side_effects: []

  - method: GET
    path: "/screenings/{sid}"
    description: "Read one screening (confidential)"
    roles: [Client, IntakeCoordinator, BenefitsCounselor, HubAdmin]
    code: 200
    input: []
    output: BenefitsScreening
    side_effects: []

  - method: POST
    path: "/screenings/{sid}/score"
    description: "Compute score/result_band (and snap_estimate_cents for SNAP) from the VERIFIED assessment"
    roles: [BenefitsCounselor]
    code: 200
    input: []
    output: BenefitsScreening
    side_effects: ["STARTED -> SCREENED; score, result_band, snap_estimate_cents computed"]

  - method: POST
    path: "/screenings/{sid}/assist"
    description: "Record application assistance; requires band LIKELY_ELIGIBLE or POSSIBLY_ELIGIBLE"
    roles: [BenefitsCounselor]
    code: 200
    input: []
    output: BenefitsScreening
    side_effects: ["SCREENED -> APPLICATION_ASSISTED"]

  - method: POST
    path: "/screenings/{sid}/submit-application"
    description: "Mark the assisted application submitted to the agency"
    roles: [BenefitsCounselor]
    code: 200
    input: []
    output: BenefitsScreening
    side_effects: ["APPLICATION_ASSISTED -> SUBMITTED"]

  - method: POST
    path: "/screenings/{sid}/determine"
    description: "Record the agency determination"
    roles: [BenefitsCounselor]
    code: 200
    input: [outcome]
    output: BenefitsScreening
    side_effects: ["SUBMITTED -> DETERMINED; determined_at set"]

  - method: POST
    path: "/screenings/{sid}/withdraw"
    description: "Withdraw a screening from any pre-terminal state"
    roles: [BenefitsCounselor]
    code: 200
    input: []
    output: BenefitsScreening
    side_effects: ["{STARTED, SCREENED, APPLICATION_ASSISTED, SUBMITTED} -> WITHDRAWN"]

  # --- Grant funds ---
  - method: POST
    path: "/grant-funds"
    description: "Create a fiscal-year grant fund"
    roles: [HubAdmin]
    code: 201
    input: [fund_name, fiscal_year, allocated_cents]
    output: GrantFund
    side_effects: ["status=OPEN; counters zeroed"]

  - method: GET
    path: "/grant-funds/{fid}"
    description: "Read a fund including both remaining bases"
    roles: [GrantReviewer, HubAdmin]
    code: 200
    input: []
    output: GrantFund
    side_effects: []

  - method: POST
    path: "/grant-funds/{fid}/close"
    description: "Close a fund with no open applications"
    roles: [HubAdmin]
    code: 200
    input: []
    output: GrantFund
    side_effects: ["OPEN|EXHAUSTED -> CLOSED"]

  # --- Emergency grant applications ---
  - method: POST
    path: "/clients/{cid}/grant-applications"
    description: "Create a DRAFT emergency grant application (self-service or staff-assisted; a GrantReviewer who assists becomes created_by_user_id and is then barred from reviewing it)"
    roles: [Client, IntakeCoordinator, GrantReviewer]
    code: 201
    input: [fund_id, category, requested_cents, hardship_statement]
    output: EmergencyGrantApplication
    side_effects: ["status=DRAFT; created_by_user_id stamped from X-User-ID; fund must not be CLOSED (ERR_FUND_CLOSED)"]

  - method: GET
    path: "/grant-applications"
    description: "List grant applications (Client sees only own)"
    roles: [Client, IntakeCoordinator, GrantReviewer, HubAdmin]
    code: 200
    input: ["client_id?", "fund_id?", "reviewed_by?", "status?", "limit?", "offset?"]
    output: EmergencyGrantApplication[]
    side_effects: []

  - method: GET
    path: "/grant-applications/{gid}"
    description: "Read one application (Client only own)"
    roles: [Client, IntakeCoordinator, GrantReviewer, HubAdmin]
    code: 200
    input: []
    output: EmergencyGrantApplication
    side_effects: []

  - method: POST
    path: "/grant-applications/{gid}/submit"
    description: "Submit from DRAFT (fund OPEN -> SUBMITTED; fund EXHAUSTED -> QUEUED) or resubmit from MORE_INFO_REQUESTED"
    roles: [Client, IntakeCoordinator]
    code: 200
    input: []
    output: EmergencyGrantApplication
    side_effects: ["DRAFT -> SUBMITTED|QUEUED or MORE_INFO_REQUESTED -> SUBMITTED (reviewed_by cleared)"]

  - method: POST
    path: "/grant-applications/{gid}/begin-review"
    description: "Reviewer claims a SUBMITTED application; enforces segregation of duties"
    roles: [GrantReviewer]
    code: 200
    input: []
    output: EmergencyGrantApplication
    side_effects: ["SUBMITTED -> UNDER_REVIEW; reviewed_by stamped"]

  - method: POST
    path: "/grant-applications/{gid}/request-info"
    description: "Send the application back for more information"
    roles: [GrantReviewer]
    code: 200
    input: [info_request_notes]
    output: EmergencyGrantApplication
    side_effects: ["UNDER_REVIEW -> MORE_INFO_REQUESTED"]

  - method: POST
    path: "/grant-applications/{gid}/approve"
    description: "Approve with award sizing per grant_award_sizing; OCC on GrantFund.version"
    roles: [GrantReviewer]
    code: 200
    input: [expected_fund_version]
    output: EmergencyGrantApplication
    side_effects: ["UNDER_REVIEW -> APPROVED; approved_cents computed from pre-approval state; fund committed += approved_cents; increments GrantFund.version by 1; fund may flip OPEN -> EXHAUSTED"]

  - method: POST
    path: "/grant-applications/{gid}/deny"
    description: "Deny the application"
    roles: [GrantReviewer]
    code: 200
    input: [decision_rationale]
    output: EmergencyGrantApplication
    side_effects: ["UNDER_REVIEW -> DENIED"]

  - method: POST
    path: "/grant-applications/{gid}/disburse"
    description: "Disburse an APPROVED application within 72h; two-person rule vs reviewed_by"
    roles: [HubAdmin]
    code: 200
    input: []
    output: EmergencyGrantApplication
    side_effects: ["APPROVED -> DISBURSED; fund committed -= approved, disbursed += approved; increments GrantFund.version by 1; client.lifetime_grant_cents += approved; fund may flip EXHAUSTED -> OPEN and promote oldest QUEUED application"]

  - method: POST
    path: "/grant-applications/{gid}/withdraw"
    description: "Withdraw from DRAFT/SUBMITTED/QUEUED"
    roles: [Client, IntakeCoordinator]
    code: 200
    input: []
    output: EmergencyGrantApplication
    side_effects: ["{DRAFT, SUBMITTED, QUEUED} -> WITHDRAWN"]

  # --- Shelter beds & stays ---
  - method: POST
    path: "/shelter-beds"
    description: "Register a shelter bed"
    roles: [ShelterCoordinator, HubAdmin]
    code: 201
    input: [shelter_site, bed_label, "features?"]
    output: ShelterBed
    side_effects: ["status=AVAILABLE; (shelter_site, bed_label) unique"]

  - method: GET
    path: "/shelter-beds"
    description: "List beds"
    roles: [IntakeCoordinator, ShelterCoordinator, HubAdmin]
    code: 200
    input: ["shelter_site?", "status?", "limit?", "offset?"]
    output: ShelterBed[]
    side_effects: []

  - method: PATCH
    path: "/shelter-beds/{bid}"
    description: "Set bed status AVAILABLE | OUT_OF_SERVICE; blocked while OCCUPIED"
    roles: [ShelterCoordinator, HubAdmin]
    code: 200
    input: [status]
    output: ShelterBed
    side_effects: ["OUT_OF_SERVICE rejected while a stay is OCCUPIED on the bed (ERR_BED_OCCUPIED)"]

  - method: POST
    path: "/clients/{cid}/shelter-stays"
    description: "Reserve a stay: eligibility, temporal window, bed half-open+buffer overlap, client night-intersection rules"
    roles: [ShelterCoordinator]
    code: 201
    input: [bed_id, check_in_date, planned_nights]
    output: ShelterStay
    side_effects: ["status=RESERVED; check_out_exclusive and buffer_until_exclusive computed"]

  - method: GET
    path: "/shelter-stays"
    description: "List stays (Client sees only own)"
    roles: [Client, ShelterCoordinator, HubAdmin]
    code: 200
    input: ["client_id?", "bed_id?", "status?", "limit?", "offset?"]
    output: ShelterStay[]
    side_effects: []

  - method: GET
    path: "/shelter-stays/{sid}"
    description: "Read one stay (Client only own)"
    roles: [Client, ShelterCoordinator, HubAdmin]
    code: 200
    input: []
    output: ShelterStay
    side_effects: []

  - method: POST
    path: "/shelter-stays/{sid}/check-in"
    description: "Mark arrival on [check_in_date, check_in_date + 1 day]"
    roles: [ShelterCoordinator]
    code: 200
    input: []
    output: ShelterStay
    side_effects: ["RESERVED -> OCCUPIED"]

  - method: POST
    path: "/shelter-stays/{sid}/check-out"
    description: "Mark departure; recomputes client risk_tier"
    roles: [ShelterCoordinator]
    code: 200
    input: []
    output: ShelterStay
    side_effects: ["OCCUPIED -> CHECKED_OUT; actual_check_out_date set; client risk_tier recomputed"]

  - method: POST
    path: "/shelter-stays/{sid}/cancel"
    description: "Cancel a RESERVED stay, freeing the bed interval"
    roles: [ShelterCoordinator, HubAdmin]
    code: 200
    input: []
    output: ShelterStay
    side_effects: ["RESERVED -> CANCELLED"]

  # --- Partner agencies & referrals ---
  - method: POST
    path: "/partner-agencies"
    description: "Register a partner agency"
    roles: [HubAdmin]
    code: 201
    input: [agency_name, service_categories, weekly_capacity, "accepts_walk_ins?"]
    output: PartnerAgency
    side_effects: ["status=ACTIVE; active_referral_count=0"]

  - method: GET
    path: "/partner-agencies"
    description: "List agencies (transparent to clients)"
    roles: [Client, IntakeCoordinator, PantryStaff, BenefitsCounselor, ShelterCoordinator, HubAdmin, PartnerAgencyRep]
    code: 200
    input: ["status?", "service_category?", "limit?", "offset?"]
    output: PartnerAgency[]
    side_effects: []

  - method: PATCH
    path: "/partner-agencies/{aid}"
    description: "Update capacity/categories/walk-ins; capacity must be >= active_referral_count"
    roles: [HubAdmin]
    code: 200
    input: ["weekly_capacity?", "service_categories?", "accepts_walk_ins?"]
    output: PartnerAgency
    side_effects: ["ERR_CAPACITY_BELOW_ACTIVE when weekly_capacity < active_referral_count"]

  - method: POST
    path: "/partner-agencies/{aid}/pause"
    description: "Pause an agency (blocks send/resend)"
    roles: [HubAdmin]
    code: 200
    input: []
    output: PartnerAgency
    side_effects: ["ACTIVE -> PAUSED"]

  - method: POST
    path: "/partner-agencies/{aid}/resume"
    description: "Resume a paused agency"
    roles: [HubAdmin]
    code: 200
    input: []
    output: PartnerAgency
    side_effects: ["PAUSED -> ACTIVE"]

  - method: POST
    path: "/clients/{cid}/referrals"
    description: "Initiate a referral with capacity check (CRISIS overflow) and category/warm-handoff validation"
    roles: [IntakeCoordinator, BenefitsCounselor, ShelterCoordinator]
    code: 201
    input: [agency_id, service_category, "warm_handoff?", "notes?"]
    output: Referral
    side_effects: ["status=INITIATED; capacity pre-checked per referral_capacity_check"]

  - method: GET
    path: "/referrals"
    description: "List referrals (Client sees only own; PartnerAgencyRep only own agency)"
    roles: [Client, IntakeCoordinator, BenefitsCounselor, ShelterCoordinator, HubAdmin, PartnerAgencyRep]
    code: 200
    input: ["client_id?", "agency_id?", "status?", "limit?", "offset?"]
    output: Referral[]
    side_effects: []

  - method: GET
    path: "/referrals/{rid}"
    description: "Read one referral (Client only own; PartnerAgencyRep only own agency)"
    roles: [Client, IntakeCoordinator, BenefitsCounselor, ShelterCoordinator, HubAdmin, PartnerAgencyRep]
    code: 200
    input: []
    output: Referral
    side_effects: []

  - method: POST
    path: "/referrals/{rid}/send"
    description: "Send an INITIATED referral; agency must be ACTIVE; stamps sent_at/ack_due_at"
    roles: [IntakeCoordinator, BenefitsCounselor, ShelterCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["INITIATED -> SENT; agency.active_referral_count += 1"]

  - method: POST
    path: "/referrals/{rid}/acknowledge"
    description: "Agency acknowledges a SENT referral"
    roles: [PartnerAgencyRep]
    code: 200
    input: []
    output: Referral
    side_effects: ["SENT -> ACKNOWLEDGED"]

  - method: POST
    path: "/referrals/{rid}/book-appointment"
    description: "Agency books an appointment (date >= logical today)"
    roles: [PartnerAgencyRep]
    code: 200
    input: [appointment_date]
    output: Referral
    side_effects: ["ACKNOWLEDGED -> APPOINTMENT_BOOKED"]

  - method: POST
    path: "/referrals/{rid}/record-service"
    description: "Agency records service delivered"
    roles: [PartnerAgencyRep]
    code: 200
    input: []
    output: Referral
    side_effects: ["APPOINTMENT_BOOKED -> SERVICE_RECEIVED; agency.active_referral_count -= 1"]

  - method: POST
    path: "/referrals/{rid}/decline"
    description: "Agency declines a SENT or ACKNOWLEDGED referral"
    roles: [PartnerAgencyRep]
    code: 200
    input: [decline_reason]
    output: Referral
    side_effects: ["SENT|ACKNOWLEDGED -> DECLINED; agency.active_referral_count -= 1"]

  - method: POST
    path: "/referrals/{rid}/withdraw"
    description: "Hub withdraws an INITIATED or SENT referral"
    roles: [IntakeCoordinator, BenefitsCounselor, ShelterCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["INITIATED|SENT -> WITHDRAWN; SENT withdrawal decrements agency.active_referral_count"]

  - method: POST
    path: "/referrals/{rid}/resend"
    description: "Resend an EXPIRED referral; re-checks agency ACTIVE and capacity at current risk tier"
    roles: [IntakeCoordinator, BenefitsCounselor, ShelterCoordinator]
    code: 200
    input: []
    output: Referral
    side_effects: ["EXPIRED -> SENT; sent_at/ack_due_at reset; agency.active_referral_count += 1"]

  # --- Outreach events & registrations ---
  - method: POST
    path: "/outreach-events"
    description: "Create an outreach event (PLANNED)"
    roles: [HubAdmin]
    code: 201
    input: [title, event_date, capacity, stigma_theme, "anonymous_attendance_allowed?"]
    output: OutreachEvent
    side_effects: ["status=PLANNED; counts zeroed"]

  - method: GET
    path: "/outreach-events"
    description: "Public event list (stigma reduction: anonymous browsing)"
    roles: [Anonymous, Client, IntakeCoordinator, PantryStaff, BenefitsCounselor, GrantReviewer, ShelterCoordinator, HubAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OutreachEvent[]
    side_effects: []

  - method: POST
    path: "/outreach-events/{eid}/open"
    description: "Open a PLANNED event for registration"
    roles: [HubAdmin]
    code: 200
    input: []
    output: OutreachEvent
    side_effects: ["PLANNED -> OPEN"]

  - method: POST
    path: "/outreach-events/{eid}/complete"
    description: "Complete an OPEN/FULL event (registrations become markable ATTENDED)"
    roles: [HubAdmin]
    code: 200
    input: []
    output: OutreachEvent
    side_effects: ["OPEN|FULL -> COMPLETED"]

  - method: POST
    path: "/outreach-events/{eid}/cancel"
    description: "Cancel an event; cascades REGISTERED registrations to CANCELLED"
    roles: [HubAdmin]
    code: 200
    input: []
    output: OutreachEvent
    side_effects: ["PLANNED|OPEN|FULL -> CANCELLED; REGISTERED registrations -> CANCELLED"]

  - method: POST
    path: "/outreach-events/{eid}/registrations"
    description: "Register a client; reactivates a prior CANCELLED row for the same (event, client); enforces capacity/past-event/ACTIVE checks"
    roles: [Client, IntakeCoordinator, HubAdmin]
    code: 201
    input: [client_id, "display_alias?"]
    output: EventRegistration
    side_effects: ["status=REGISTERED; event.registered_count += 1; event OPEN -> FULL at capacity"]

  - method: GET
    path: "/event-registrations"
    description: "List registrations filtered by event and/or client (Client sees only own)"
    roles: [Client, IntakeCoordinator, HubAdmin]
    code: 200
    input: ["event_id?", "client_id?", "status?", "limit?", "offset?"]
    output: EventRegistration[]
    side_effects: []

  - method: GET
    path: "/event-registrations/{rid}"
    description: "Read one registration (Client only own)"
    roles: [Client, IntakeCoordinator, HubAdmin]
    code: 200
    input: []
    output: EventRegistration
    side_effects: []

  - method: POST
    path: "/event-registrations/{rid}/cancel"
    description: "Cancel a registration; may flip event FULL -> OPEN"
    roles: [Client, IntakeCoordinator, HubAdmin]
    code: 200
    input: []
    output: EventRegistration
    side_effects: ["REGISTERED -> CANCELLED; event.registered_count -= 1; event FULL -> OPEN when below capacity"]

  - method: POST
    path: "/event-registrations/{rid}/mark-attended"
    description: "Mark attendance after the event completed"
    roles: [HubAdmin]
    code: 200
    input: []
    output: EventRegistration
    side_effects: ["REGISTERED -> ATTENDED; event.attended_count += 1"]

  # --- Reporting ---
  - method: GET
    path: "/reports/usage-summary"
    description: "Outcome/usage aggregates per usage_summary calculation (de-identified counts only)"
    roles: [HubAdmin]
    code: 200
    input: ["from_date?", "to_date?"]
    output: { clients_active: integer, visits_completed: integer, points_redeemed: integer, screenings_by_program: object, grants_approved_cents: integer, grants_disbursed_cents: integer, referrals_by_status: object, shelter_nights_served: integer, event_attendance: integer }
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed request, missing required field, invalid enum value, or numeric range violation (e.g., enrolled_credits < 6 for ENROLLED_STUDENT, requested_cents outside [100, 150000], planned_nights outside 1..14, appointment_date before today)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role; missing X-User-ID; or entity-backed identity invalid (no such Client/StaffMember/PartnerAgency, INACTIVE staff, EXITED client, or staff_role mismatch with the claimed role)" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_FORBIDDEN_OWNERSHIP, http: 403, condition: "Client touches another client's resource; PartnerAgencyRep touches another agency's referral; screening action by a counselor other than counselor_id; grant request-info/approve/deny by a reviewer other than reviewed_by" }
  - { id: ERR_CONFIDENTIAL, http: 403, condition: "PantryStaff, ShelterCoordinator, or PartnerAgencyRep attempts to read assessment or screening data" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist (validated left-to-right)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent's current version (OCC)" }
  - { id: ERR_CLIENT_NOT_ACTIVE, http: 409, condition: "Client status does not admit the operation (service gates require ACTIVE; suspend requires ACTIVE; reinstate requires SUSPENDED; exit requires ACTIVE or SUSPENDED)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Generic state-machine mismatch where no machine-specific error applies (e.g., discontinuing a DISCONTINUED item, pausing a PAUSED agency, opening a non-PLANNED event)" }
  - { id: ERR_ASSESSMENT_REQUIRED, http: 409, condition: "Operation requires the client to hold a VERIFIED IntakeAssessment" }
  - { id: ERR_ASSESSMENT_NOT_EDITABLE, http: 409, condition: "Assessment transition attempted from a state that does not admit it (submit non-DRAFT, verify/return non-SUBMITTED, revise non-RETURNED)" }
  - { id: ERR_CONSENT_REQUIRED, http: 422, condition: "Assessment submit with consent_confidential != true" }
  - { id: ERR_VISIT_LIMIT_EXCEEDED, http: 409, condition: "Client already has 2 visits with status IN {CHECKED_IN, COMPLETED} and visit_date > now - 168h" }
  - { id: ERR_VISIT_ALREADY_OPEN, http: 409, condition: "Client already has a CHECKED_IN visit; a second concurrent open visit is forbidden" }
  - { id: ERR_VISIT_NOT_OPEN, http: 409, condition: "Line-item add / checkout / void attempted on a visit not in the admitting state" }
  - { id: ERR_EMPTY_CHECKOUT, http: 422, condition: "Checkout of a visit with zero line items" }
  - { id: ERR_ITEM_NOT_AVAILABLE, http: 409, condition: "Line-item add on a DISCONTINUED item or with quantity exceeding quantity_on_hand; checkout when stock no longer covers a pinned line" }
  - { id: ERR_ITEM_LIMIT_EXCEEDED, http: 422, condition: "Cumulative units of one item in a visit would exceed per_visit_limit" }
  - { id: ERR_POINTS_BALANCE_EXCEEDED, http: 422, condition: "Checkout would push reserved-basis weekly points above the client's pantry_points_allotment" }
  - { id: ERR_SCREENING_NOT_ACTIONABLE, http: 409, condition: "Screening transition attempted from a non-admitting state (including assist on NOT_ELIGIBLE band)" }
  - { id: ERR_NO_COUNSELOR_AVAILABLE, http: 409, condition: "Screening creation when no ACTIVE BENEFITS_COUNSELOR StaffMember exists" }
  - { id: ERR_GRANT_NOT_REVIEWABLE, http: 409, condition: "Grant transition attempted from a non-admitting state" }
  - { id: ERR_SOD_CONFLICT, http: 409, condition: "Segregation-of-duties violation: reviewer is the application creator or the verifying coordinator; or disburser equals reviewed_by" }
  - { id: ERR_AWARD_CAP_EXHAUSTED, http: 409, condition: "Approval sizing yields approved_cents <= 0 (fund remaining or client lifetime room exhausted)" }
  - { id: ERR_FUND_CLOSED, http: 409, condition: "Application creation/submission against a CLOSED fund" }
  - { id: ERR_FUND_HAS_OPEN_APPLICATIONS, http: 409, condition: "Fund close while applications occupy {SUBMITTED, QUEUED, UNDER_REVIEW, MORE_INFO_REQUESTED, APPROVED}" }
  - { id: ERR_DISBURSE_WINDOW_LAPSED, http: 409, condition: "Manual disbursement attempted after approved_at + 72h" }
  - { id: ERR_STAY_WINDOW_INVALID, http: 422, condition: "check_in_date outside [today, today + 13 days], or check-in action outside [check_in_date, check_in_date + 1 day]" }
  - { id: ERR_BED_OUT_OF_SERVICE, http: 409, condition: "Stay creation on an OUT_OF_SERVICE bed" }
  - { id: ERR_BED_OCCUPIED, http: 409, condition: "Setting a bed OUT_OF_SERVICE while a stay is OCCUPIED on it" }
  - { id: ERR_BED_NOT_AVAILABLE, http: 409, condition: "Bed half-open interval (with PET_FRIENDLY sanitation buffer) collides with an existing RESERVED/OCCUPIED stay" }
  - { id: ERR_CLIENT_STAY_OVERLAP, http: 409, condition: "Client closed night-set intersects another RESERVED/OCCUPIED stay of the same client" }
  - { id: ERR_NOT_HOUSING_INSECURE, http: 422, condition: "Stay creation when the client's VERIFIED assessment housing_status is STABLE or COST_BURDENED" }
  - { id: ERR_SHELTER_RESTRICTED, http: 409, condition: "Stay creation while client.shelter_restricted is true (2+ no-shows in trailing 90 days)" }
  - { id: ERR_STAY_NOT_ACTIONABLE, http: 409, condition: "Stay transition attempted from a non-admitting state" }
  - { id: ERR_AGENCY_NOT_ACTIVE, http: 409, condition: "Send/resend against a PAUSED agency" }
  - { id: ERR_AGENCY_CAPACITY_FULL, http: 409, condition: "Referral creation/resend would exceed weekly_capacity (or the CRISIS overflow ceiling floor(capacity*1.2))" }
  - { id: ERR_CAPACITY_BELOW_ACTIVE, http: 409, condition: "PATCH weekly_capacity below the agency's current active_referral_count" }
  - { id: ERR_CATEGORY_NOT_SERVED, http: 422, condition: "Referral service_category not in agency.service_categories" }
  - { id: ERR_WALK_INS_NOT_ACCEPTED, http: 422, condition: "warm_handoff=true against an agency with accepts_walk_ins=false" }
  - { id: ERR_REFERRAL_NOT_ACTIONABLE, http: 409, condition: "Referral transition attempted from a non-admitting state" }
  - { id: ERR_EVENT_FULL, http: 409, condition: "Registration against a FULL event" }
  - { id: ERR_EVENT_PAST, http: 422, condition: "Registration at or after event_date" }
  - { id: ERR_EVENT_NOT_COMPLETED, http: 409, condition: "mark-attended before the event is COMPLETED" }
  - { id: ERR_ALREADY_REGISTERED, http: 409, condition: "A non-CANCELLED registration already exists for (event_id, client_id)" }
  - { id: ERR_REGISTRATION_NOT_ACTIONABLE, http: 409, condition: "Cancel/mark-attended from a non-admitting registration state" }
  - { id: ERR_DUPLICATE_BED_LABEL, http: 409, condition: "bed_label already used within the same shelter_site" }
  - { id: ERR_DUPLICATE_AGENCY, http: 409, condition: "agency_name already registered" }
  - { id: ERR_DUPLICATE_STAFF_EMAIL, http: 409, condition: "email already used by another StaffMember" }
  - { id: ERR_DUPLICATE_FUND, http: 409, condition: "(fund_name, fiscal_year) already exists" }
  - { id: ERR_DUPLICATE_ITEM, http: 409, condition: "item_name already used by an ACTIVE PantryItem" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated visitor; self-registration and public event browsing only (stigma reduction)"
    identity: opaque
    exclusive_operations: ["POST /clients (self-registration)"]
    shared_operations: ["GET /outreach-events"]

  - name: Client
    description: "Student/resident receiving services; sees only own records; never sees other clients"
    identity: "entity_backed:Client"
    exclusive_operations: ["Own-scope reads and actions: GET /clients/{self}, POST own assessments, submit/revise own assessments, create/submit/withdraw own grant applications, register/cancel own event registrations"]
    shared_operations: ["GET /pantry-items", "GET /partner-agencies", "GET /outreach-events", "GET /pantry-visits (own)", "GET /assessments (own)", "GET /screenings (own)", "GET /grant-applications (own)", "GET /shelter-stays (own)", "GET /referrals (own)", "GET /event-registrations (own)"]

  - name: IntakeCoordinator
    description: "Runs confidential intake; verifies assessments; initiates referrals; assists grant drafts; may exit clients"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /clients/{cid}/assessments/{aid}/verify", "POST /clients/{cid}/assessments/{aid}/return", "POST /clients/{cid}/exit (shared with HubAdmin)"]
    shared_operations: ["POST /clients", "GET /clients", "POST/GET assessments", "POST /clients/{cid}/screenings", "POST /clients/{cid}/referrals + referral send/withdraw/resend", "POST /clients/{cid}/grant-applications (assisted)", "GET /shelter-beds", "event registration management"]

  - name: PantryStaff
    description: "Operates the pantry; hard confidentiality wall — no access to assessments, screenings, grants, referrals, or stays"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /clients/{cid}/pantry-visits", "POST /pantry-visits/{vid}/line-items", "POST /pantry-visits/{vid}/checkout", "POST /pantry-visits/{vid}/void (shared with HubAdmin)", "POST /pantry-items/{iid}/restock (shared with HubAdmin)"]
    shared_operations: ["GET /clients", "GET /clients/{cid}", "GET /pantry-items", "GET /pantry-visits", "GET /visit-line-items", "GET /partner-agencies", "GET /outreach-events"]

  - name: BenefitsCounselor
    description: "Runs benefits screenings and application assistance; actions pinned to the assigned counselor"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /screenings/{sid}/score", "POST /screenings/{sid}/assist", "POST /screenings/{sid}/submit-application", "POST /screenings/{sid}/determine", "POST /screenings/{sid}/withdraw"]
    shared_operations: ["POST /clients/{cid}/screenings", "GET /screenings", "GET /assessments", "POST /clients/{cid}/referrals + send/withdraw/resend", "GET /clients", "GET /pantry-items", "GET /partner-agencies", "GET /outreach-events"]

  - name: GrantReviewer
    description: "Reviews emergency grant applications; segregation of duties blocks reviewing self-created or self-verified cases"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /grant-applications/{gid}/begin-review", "POST /grant-applications/{gid}/request-info", "POST /grant-applications/{gid}/approve", "POST /grant-applications/{gid}/deny"]
    shared_operations: ["GET /grant-applications", "GET /grant-funds/{fid}", "GET /clients", "GET /clients/{cid}", "GET /assessments", "GET /pantry-items", "GET /outreach-events"]

  - name: ShelterCoordinator
    description: "Coordinates beds and short-term stays; no confidential intake access"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /shelter-beds", "PATCH /shelter-beds/{bid}", "POST /clients/{cid}/shelter-stays", "POST /shelter-stays/{sid}/check-in", "POST /shelter-stays/{sid}/check-out", "POST /shelter-stays/{sid}/cancel (shared with HubAdmin)"]
    shared_operations: ["GET /shelter-beds", "GET /shelter-stays", "POST /clients/{cid}/referrals + send/withdraw/resend", "GET /clients", "GET /clients/{cid}", "GET /pantry-items", "GET /partner-agencies", "GET /outreach-events"]

  - name: HubAdmin
    description: "Operational administrator (operator identity not tied to a staff row); owns config, funds, disbursement two-person rule, events, sweeps, clock"
    identity: opaque
    exclusive_operations: ["POST /staff", "GET /staff", "POST /pantry-items", "PATCH /pantry-items/{iid}", "POST /pantry-items/{iid}/discontinue", "POST /clients/{cid}/suspend", "POST /clients/{cid}/reinstate", "POST /grant-funds", "POST /grant-funds/{fid}/close", "POST /grant-applications/{gid}/disburse", "POST /partner-agencies + PATCH + pause/resume", "POST /outreach-events + open/complete/cancel", "POST /event-registrations/{rid}/mark-attended", "POST /_clock/set_current_utc", "POST /_sweeps/run_pending_transitions", "GET /reports/usage-summary"]
    shared_operations: ["POST /clients", "GET /clients", "GET /clients/{cid}", "GET /assessments", "GET /screenings", "GET /grant-applications", "GET /pantry-items", "GET /pantry-visits", "GET /visit-line-items", "GET /shelter-beds", "GET /shelter-stays", "GET /referrals", "GET /partner-agencies", "GET /outreach-events", "GET /event-registrations", "POST /clients/{cid}/exit", "POST /pantry-visits/{vid}/void", "POST /pantry-items/{iid}/restock", "POST /shelter-beds", "PATCH /shelter-beds/{bid}", "POST /shelter-stays/{sid}/cancel", "event registration create/cancel"]

  - name: PartnerAgencyRep
    description: "External partner agency acting on its own referrals; X-User-ID equals the PartnerAgency.id"
    identity: "entity_backed:PartnerAgency"
    exclusive_operations: ["POST /referrals/{rid}/acknowledge", "POST /referrals/{rid}/book-appointment", "POST /referrals/{rid}/record-service", "POST /referrals/{rid}/decline"]
    shared_operations: ["GET /referrals (own agency only)", "GET /partner-agencies"]
