  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: tc_reconcile_lot_slot_machine_depth3
        grounds:
          - state_machines.RestockVisit.DRAFT_to_RECONCILED
          - entities.InventoryLot.fields.remaining_units
          - entities.PlanogramSlot.fields.on_hand
          - entities.Machine.fields.stock_status
        distinguishing_aspect: |
          Depth-3 cascade originating at RestockVisit reconcile: (1) reconcile creates an
          InventoryLot; (2) the new lot causes PlanogramSlot.on_hand to recompute; (3) the changed
          on_hand causes Machine.stock_status to re-derive STOCKOUT->STOCKED. Each link is caused by
          the previous link, not directly by the reconcile.
        test_recipe:
          setup:
            - "Machine with one empty slot (capacity 20 par 20 price 100c, on_hand 0 -> stock_status STOCKOUT)."
            - "A dispatched route with one kitted stop on that machine; a DRAFT visit refilling 20 units."
          setup_api_calls:
            - call: "POST /operations/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-03T00:00:00Z" }
              as: FieldOps
            - call: "POST /operations/host-sites"
              payload: { name: "Casc Host", contact_email: "c@x.com" }
              as: FieldOps
              captures: { host_id: $.data.id }
            - call: "POST /operations/products"
              payload: { sku: "CAS", name: "Cas Item", category: "SNACK", unit_cost_cents: 50, shelf_life_days: 0 }
              as: FieldOps
              captures: { prod_id: $.data.id }
            - call: "POST /operations/machines"
              payload: { host_site_id: "${host_id}", asset_tag: "M-7", machine_type: "SNACK_VENDOR", par_fill_threshold_pct: 0.25 }
              as: FieldOps
              captures: { mach_id: $.data.id, mach_v0: $.data.version }
            - call: "POST /operations/machines/${mach_id}/slots"
              payload: { product_id: "${prod_id}", slot_code: "D1", capacity: 20, par_level: 20, price_cents: 100 }
              as: FieldOps
              captures: { slot_id: $.data.id }
            - call: "POST /operations/drivers"
              payload: { full_name: "Cas", employee_code: "EMP7" }
              as: FieldOps
              captures: { drv_id: $.data.id }
            - call: "POST /operations/routes"
              payload: { driver_id: "${drv_id}", service_date: "2026-06-03T00:00:00Z" }
              as: FieldOps
              captures: { route_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/stops"
              payload: { machine_id: "${mach_id}", window_start_min: 480, window_end_min: 540 }
              as: FieldOps
              captures: { stop_id: $.data.id }
            - call: "POST /operations/routes/${route_id}/dispatch"
              payload: {}
              as: FieldOps
            - call: "POST /operations/restock-visits"
              payload: { route_stop_id: "${stop_id}", counted_lines: [ { slot_id: "${slot_id}", physical_count: 0, refill_units: 20 } ], expected_machine_version: "${mach_v0}" }
              as: RouteDriver
              as_user_id: "${drv_id}"
              captures: { visit_id: $.data.id }
          trigger:
