            - "StaffAssignment.${assignment_id}.status == PROPOSED and approved_by_user_id == null"

      - name: cancelled_tour_stop_is_terminal_and_refuses_confirm_and_complete
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.TourStop.terminal_states
          - errors[ERR_INVALID_STOP_STATE]
        distinguishing_aspect: "CANCELLED is terminal for TourStop, so confirm, complete and a second cancel must all fail with ERR_INVALID_STOP_STATE and leave the version untouched — an implementation that only guards the transition it expected will let one of the three through."
        test_recipe:
          setup: ["A PLANNED stop has been cancelled."]
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
