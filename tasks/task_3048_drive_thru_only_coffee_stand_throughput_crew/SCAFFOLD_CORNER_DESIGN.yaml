        distinguishing_aspect: "Inclusive thresholds: 199 -> NONE, 200 -> SILVER, 499 -> SILVER, 500 -> GOLD, verified by accumulating goodwill adjustments on one account and reading tier after each."
        test_recipe:
          setup: ["Stand booted; loyalty account at 0 points."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_stand
            - *k_approve
