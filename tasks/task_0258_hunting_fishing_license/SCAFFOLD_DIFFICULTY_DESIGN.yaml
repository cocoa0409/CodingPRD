            # winning pool with W alone
            - call: "POST /draw-pools"
              payload: { species_season_id: "${seas_id}", license_product_id: "${p_tag_id}", quota: 1, entry_deadline: "2026-04-20T00:00:00Z", scoring_model: "SQUARED" }
              as: DrawOfficer
              captures: { pool_id: $.data.id }
            - call: "POST /draw-applications"
              payload: { draw_pool_id: "${pool_id}", applicant_id: "${w_id}" }
              as: DrawOfficer
              captures: { da_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-21T00:00:00Z" }
              as: DrawOfficer
            - call: "POST /draw-pools/${pool_id}/close-entries"
              payload: {}
              as: DrawOfficer
              captures: { pool_v: $.data.version }
          trigger:
