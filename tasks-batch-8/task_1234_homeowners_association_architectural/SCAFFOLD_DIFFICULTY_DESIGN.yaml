            - { call: "POST /arc/applications/${app3}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
          trigger:
            - { call: "POST /arc/applications/${app2}/decide", payload: { conditions: [] }, as: Manager, captures: { err: $.data.error_id } }
            - { call: "GET /arc/applications/${app2}", as: Manager, captures: { app2_status: $.data.status } }
            - { call: "POST /arc/applications/${app3}/decide", payload: { conditions: [] }, as: Manager, captures: { app3_status: $.data.status } }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { open_permits: $.data.open_permit_count } }
          assert:
            - "app2 decide (interior overlap with permit1): error_id == ERR_WINDOW_OVERLAP; app2 stays UNDER_REVIEW"
            - "app3 decide (start == permit1 end, pure adjacency): status == APPROVED_WITH_CONDITIONS"
            - "Property.open_permit_count == 2 after app3 approval (half-open adjacency allowed)"

      - name: blackout_closed_interval_boundary_conflict
        grounds:
          - calculations.window_conflict_detection
          - validations[priority=8]
          - entities.BlackoutPeriod.fields.end_date
        distinguishing_aspect: |
          Resource: Association blackout calendar; semantics: CLOSED [start_date, end_date].
          A window starting exactly on blackout end_date (2026-06-27) still conflicts because
          that day is inside the closed blackout — ERR_BLACKOUT_CONFLICT; a window starting
          the next day (2026-06-28) is accepted. Contrasts with the half-open permit
          adjacency instance where touching endpoints are allowed.
        test_recipe:
          setup:
            - "Association with BlackoutPeriod [2026-06-20, 2026-06-27] (closed)"
            - "app1 (window [2026-06-27, 2026-07-27)) and app2 (window [2026-06-28, 2026-07-28)) UNDER_REVIEW with three APPROVE ballots each"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Blackout HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cal C", email: "cal.c@x.com" }, as: Manager, captures: { owner_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Eve E", email: "eve.e@x.com" }, as: Manager, captures: { owner_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "BL-1", address: "1 Blackout Blvd", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop1: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "BL-2", address: "2 Blackout Blvd", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop2: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/blackouts", payload: { start_date: "2026-06-20", end_date: "2026-06-27", reason: "street repaving moratorium" }, as: Manager }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop1}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "fence", requested_window_start: "2026-06-27", requested_window_end: "2026-07-27" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app1: $.data.id } }
            - { call: "POST /arc/applications/${app1}/attachments", payload: { kind: DRAWING, label: "plan", uri: "s3://b/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app1}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "wood", uri: "s3://b/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app1}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app1}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app1}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app1}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app1}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
            - { call: "POST /arc/properties/${prop2}/applications", payload: { owner_id: "${owner_a}", project_type: FENCE, guideline_section: "SEC-4.2", description: "fence", requested_window_start: "2026-06-28", requested_window_end: "2026-07-28" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app2: $.data.id } }
            - { call: "POST /arc/applications/${app2}/attachments", payload: { kind: DRAWING, label: "plan", uri: "s3://b/d2" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app2}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "wood", uri: "s3://b/m2" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app2}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app2}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app2}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}" }
            - { call: "POST /arc/applications/${app2}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app2}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_e}" }
          trigger:
            - { call: "POST /arc/applications/${app1}/decide", payload: { conditions: [] }, as: Manager, captures: { err: $.data.error_id } }
            - { call: "GET /arc/applications/${app1}", as: Manager, captures: { app1_status: $.data.status } }
            - { call: "POST /arc/applications/${app2}/decide", payload: { conditions: [] }, as: Manager, captures: { app2_status: $.data.status } }
          assert:
            - "app1 (window_start == blackout end_date 2026-06-27): error_id == ERR_BLACKOUT_CONFLICT; stays UNDER_REVIEW (closed-interval end is inside the blackout)"
            - "app2 (window_start == 2026-06-28, first day after): status == APPROVED_WITH_CONDITIONS"

  # =================================================================
  # Rule 9 — compensating_invariant (different conserved quantities:
  #           money per fine vs ballot count per application)
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: fine_settle_waive_conserves_accounted_cents
        grounds:
          - calculations.property_outstanding_balance
          - state_machines.Fine.ACCRUING_to_SETTLED
          - state_machines.Fine.ACCRUING_to_ACCRUING
          - entities.Fine.fields.outstanding_cents
        distinguishing_aspect: |
          Conserved quantity: accounted money per fine — accrued_cents == settled_cents +
          waived_cents + outstanding_cents. Forward accrual to 12000, compensating waive of
          2000 (0+2000+10000), then settle of the remaining 10000 (10000+2000+0): the
          identity holds at every step with zero drift.
        test_recipe:
          setup:
            - "Association SIMPLE_DAILY base 10000 daily 1000; violation at 2026-05-01; sweep at 2026-05-03 accrues 2 days -> accrued 12000"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Ledger HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "M-1", address: "1 Money Ln", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/violations", payload: { kind: UNAPPROVED_WORK, description: "unapproved shed" }, as: Manager, captures: { vio: $.data.id } }
            - { call: "GET /arc/violations/${vio}/fines", as: Manager, captures: { fine: "$.data[0].id" } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-03T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/_sweeps/daily", as: Manager }
          trigger:
            - { call: "POST /arc/fines/${fine}/waive", payload: { amount_cents: 2000, reason: "goodwill partial waiver" }, as: Manager, captures: { w_accrued: $.data.accrued_cents, w_waived: $.data.waived_cents, w_outstanding: $.data.outstanding_cents } }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { bal_after_waive: $.data.outstanding_fine_balance_cents } }
            - { call: "POST /arc/fines/${fine}/settle", payload: { amount_cents: 10000 }, as: Homeowner, as_user_id: "${owner_a}", captures: { s_status: $.data.status, s_settled: $.data.settled_cents, s_waived: $.data.waived_cents, s_outstanding: $.data.outstanding_cents, s_accrued: $.data.accrued_cents } }
            - { call: "GET /arc/properties/${prop}", as: Manager, captures: { bal_after_settle: $.data.outstanding_fine_balance_cents, posture_after_settle: $.data.compliance_posture } }
          assert:
            - "after waive: accrued_cents == 12000, waived_cents == 2000, outstanding_cents == 10000 (12000 == 0 + 2000 + 10000)"
            - "property balance after waive == 10000"
            - "after settle: status == SETTLED, settled_cents == 10000, waived_cents == 2000, outstanding_cents == 0 (12000 == 10000 + 2000 + 0)"
            - "property balance after settle == 0 and compliance_posture == CLEAR"

      - name: vote_recast_conserves_ballot_count
        grounds:
          - calculations.quorum_decision_tally
          - entities.CommitteeVote.fields.recast_count
          - entities.CommitteeVote.fields.ballot
        distinguishing_aspect: |
          Conserved quantity: ballot count per application — a recast moves one existing
          ballot between APPROVE/DENY/ABSTAIN buckets without changing the row count
          (approve+deny+abstain == distinct voters == 3 before and after each recast).
          Different conserved quantity type (count) than the money instance.
        test_recipe:
          setup:
            - "Standard association; application UNDER_REVIEW at 2026-05-01 with ballots b=APPROVE, c=APPROVE, e=DENY (3 rows)"
          setup_api_calls:
            - { call: "POST /arc/associations", payload: { name: "Ballot HOA", statutory_response_days: 30, counting_mode: CALENDAR, fine_mode: SIMPLE_DAILY, base_fine_cents: 10000, daily_fine_cents: 1000, lien_threshold_cents: 1000000, committee_size: 5, quorum_min: 3, supermajority_required: true, max_window_days: 180 }, as: Manager, captures: { assoc: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Ann A", email: "ann.a@x.com" }, as: Manager, captures: { owner_a: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cid B", email: "cid.b@x.com" }, as: Manager, captures: { owner_b: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Cal C", email: "cal.c@x.com" }, as: Manager, captures: { owner_c: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/owners", payload: { full_name: "Eve E", email: "eve.e@x.com" }, as: Manager, captures: { owner_e: $.data.id } }
            - { call: "POST /arc/associations/${assoc}/properties", payload: { lot_number: "V-9", address: "9 Vote Ct", primary_owner_id: "${owner_a}" }, as: Manager, captures: { prop: $.data.id } }
            - { call: "POST /arc/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T09:00:00Z" }, as: Manager }
            - { call: "POST /arc/properties/${prop}/applications", payload: { owner_id: "${owner_a}", project_type: SOLAR, guideline_section: "SEC-8.3", description: "solar array", requested_window_start: "2026-06-01", requested_window_end: "2026-07-15" }, as: Homeowner, as_user_id: "${owner_a}", captures: { app: $.data.id } }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: DRAWING, label: "layout", uri: "s3://v9/d1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/attachments", payload: { kind: MATERIAL_SAMPLE, label: "panel", uri: "s3://v9/m1" }, as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/submit", as: Homeowner, as_user_id: "${owner_a}" }
            - { call: "POST /arc/applications/${app}/start-review", as: Manager }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_b}", captures: { vote_b: $.data.id } }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: APPROVE }, as: CommitteeMember, as_user_id: "${owner_c}" }
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: DENY }, as: CommitteeMember, as_user_id: "${owner_e}" }
          trigger:
            - { call: "POST /arc/applications/${app}/votes", payload: { ballot: DENY }, as: CommitteeMember, as_user_id: "${owner_b}", captures: { recast_ballot: $.data.ballot, recast_count: $.data.recast_count, recast_id: $.data.id } }
            - { call: "GET /arc/applications/${app}/votes", as: Manager, captures: { first_ballot: "$.data[0].ballot" } }
          assert:
            - "recast returns the SAME vote row (id == ${vote_b}) with ballot == DENY and recast_count == 1"
            - "GET votes returns exactly 3 rows (no new row created by recast)"
            - "tally conservation: APPROVE(1: c) + DENY(2: b,e) + ABSTAIN(0) == 3 == distinct voter count, before and after the recast"
