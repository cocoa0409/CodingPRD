            - "Shipment SHP-P5 out of WH-P5 to Z2 with trailer_cube_capacity_m3 5.0000 carries both hulls at cube_utilization_pct exactly 60.00 == MIN_SEAL_UTILIZATION_PCT, departs 2026-08-01T15:00:00Z and delivers 2026-08-02T00:00:00Z, so both FinishedUnits are DELIVERED with delivered_at 2026-08-02T00:00:00Z and the approve precondition ERR_UNIT_NOT_DELIVERED is vacuous."
