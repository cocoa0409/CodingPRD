              as: URDirector
            - call: "POST /api/payers"
              payload: { name: "Medicare FFS", plan_class: "MEDICARE", requires_inpatient_auth: true, concurrent_review_cadence_hours: 48, p2p_window_hours: 72, appeal_deadline_days: 60, bed_day_budget_per_case: 30, avoidable_attribution_method: "FIRST_CAUSE" }
              as: URDirector
              captures: { pay_med: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Attend", specialty: "Internal Medicine", is_advisor: false }
              as: URDirector
              captures: { dr_att: $.data.id }
            - call: "POST /api/physicians"
              payload: { full_name: "Dr. Advisor", specialty: "Utilization Medicine", is_advisor: true }
              as: URDirector
              captures: { dr_adv: $.data.id }
            - call: "POST /api/utilization-cases"
              payload: { patient_mrn: "MRN-CE3", payer_id: "${pay_med}", attending_physician_id: "${dr_att}", admit_at: "2026-08-01T08:00:00Z", expected_discharge_at: "2026-08-03T10:00:00Z", requested_admission_status: "INPATIENT" }
              as: URNurse
              captures: { case_id: $.data.id, case_v: $.data.version }
            - call: "POST /api/utilization-cases/${case_id}/authorization-requests"
              payload: { level_of_care: "INPATIENT", requested_day_count: 3, clinical_summary: "Patient with acute decompensated heart failure requiring IV diuresis.", expected_case_version: "${case_v}" }
              as: URNurse
              captures: { auth_id: $.data.id }
            - call: "POST /api/authorization-requests/${auth_id}/payer-decision"
              payload: { decision: "DENY", denial_reason_code: "LEVEL_OF_CARE" }
              as: PayerReviewer
            - call: "GET /api/utilization-cases/${case_id}/denial-cases"
              as: URNurse
              captures: { den_id: "$.data[0].id" }
            - call: "POST /api/authorization-requests/${auth_id}/peer-to-peer-conferences"
              payload: { advisor_physician_id: "${dr_adv}", scheduled_start_at: "2026-08-03T10:00:00Z", scheduled_end_at: "2026-08-03T10:30:00Z" }
              as: AttendingPhysician
              as_user_id: "${dr_att}"
              captures: { conf_id: $.data.id }
          trigger:
            - call: "POST /api/denial-cases/${den_id}/appeals"
              payload: { appeal_level: 1, argument_summary: "Filed while conference still scheduled." }
              as: AppealsCoordinator
              captures: { err: $.data.error_id }
            - call: "POST /api/peer-to-peer-conferences/${conf_id}/complete"
              payload: { outcome: "UPHELD" }
              as: PhysicianAdvisor
