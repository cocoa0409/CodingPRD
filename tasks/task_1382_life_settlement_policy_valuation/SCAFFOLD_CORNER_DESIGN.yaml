          trigger:
            - { call: "GET /api/portfolios/${pf1}", as: Investor, as_user_id: "${inv1}", captures: { err: "$.data.error_id" } }
            - { call: "GET /api/portfolios/${pf2}", as: Investor, as_user_id: "${inv1}", captures: { name2: "$.data.name" } }
            - { call: "GET /api/portfolios", as: Investor, as_user_id: "${inv1}" }
          assert:
