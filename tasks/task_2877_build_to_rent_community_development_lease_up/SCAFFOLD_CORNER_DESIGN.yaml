              payload: { name: "Harrowgate", market_code: "TX-SAT", total_planned_units: 4, product_mix: { DETACHED: 4, COTTAGE: 0, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 20000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-HG-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "POST /phases"
              payload: { community_id: "${c}", sequence_index: 1, kind: "HOUSING", planned_unit_count: 4, amenity_weight: 0, construction_window_start: "2026-08-01T00:00:00Z", construction_window_end: "2026-11-01T00:00:00Z" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { ph: $.data.id }
            - call: "POST /phases/${ph}/construction-start"
              payload: {}
              as: ConstructionManager
              as_user_id: "u_cm_1"
            - call: "POST /homesites"
              payload: { phase_id: "${ph}", lot_number: "H1", product_type: "DETACHED", bedrooms: 4, square_feet: 2100 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
              captures: { hs1: $.data.id }
          trigger:
            - call: "POST /homesites"
              payload: { phase_id: "${ph}", lot_number: "H1", product_type: "DETACHED", bedrooms: 3, square_feet: 1900 }
              as: ConstructionManager
              as_user_id: "u_cm_1"
          assert:
            - "HTTP 409 with data.error_id == ERR_DUPLICATE_RESOURCE"
            - "GET /homesites filtered by phase_id ${ph} reports total_count == 1 with the single row ${hs1} unchanged"

