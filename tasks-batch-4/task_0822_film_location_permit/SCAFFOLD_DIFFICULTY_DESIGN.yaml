scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: permit_fee_estimate_vs_final
        grounds:
          - calculations.permit_fee
          - entities.PermitApplication.fields.estimated_fee_cents
          - entities.PermitApplication.fields.final_fee_cents
          - entities.PermitApplication.fields.total_fee_cents
          - state_machines.PermitApplication.UNDER_REVIEW_to_ISSUED
        distinguishing_aspect: "ESTIMATE (PENDING bookings + REQUESTED riders) and FINAL (CONFIRMED bookings + APPROVED riders only) produce different totals for the SAME PermitApplication — the cost-accounting dual-variant, on the Application domain."
        test_recipe:
          setup:
            - "Company + POLICE(ALL_APPLICATIONS) dept + one street segment exist; clock at 2026-05-01."
            - "Application (crew 40, 3 shoot days, road-closure + parking) has 1 PENDING road-closure booking, a DRONE rider and a STILL_PHOTO rider (both REQUESTED at submit), a VERIFIED aviation COI."
            - "At submit the ESTIMATE subtotal = 25000 + 15000*3 + 20000(crew tier 16-50) + 40000(1 booking) + 10000*3(parking) + 30000(drone) + 5000(still) = 195000; +5% surcharge 9750 => estimated_fee_cents 204750."
            - "Before issue the DRONE rider is APPROVED and the STILL_PHOTO rider is DENIED; the booking is confirmed at issue."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "Acme Films", contact_email: "ops@acme.test", primary_contact: "Pat Lee" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /street-segments"
              payload: { segment_code: "MAIN-100", name: "Main St 100", length_m: 120 }
              as: FilmOfficeCoordinator
              captures: { seg1_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Night Shoot", synopsis: "City scene", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-03T20:00:00Z", crew_size: 40, requires_road_closure: true, requires_parking: true }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "100 Main St", geo_zone: "Z1", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-03T20:00:00Z", uses_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /applications/${app_id}"
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { v1: $.data.version }
            - call: "POST /applications/${app_id}/insurance-certificates"
              payload: { policy_number: "POL-1", coverage_amount_cents: 100000000, aviation_coverage: true, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", expected_application_version: "${v1}" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { coi_id: $.data.id }
            - call: "POST /insurance-certificates/${coi_id}/verify"
              payload: { decision: "VERIFY" }
              as: FilmOfficeCoordinator
            - call: "POST /applications/${app_id}/riders"
              payload: { rider_type: "DRONE", faa_waiver_number: "FAA-1", max_altitude_ft: 200, flight_start_at: "2026-06-01T09:00:00Z", flight_end_at: "2026-06-01T12:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { rider_drone_id: $.data.id }
            - call: "POST /applications/${app_id}/riders"
              payload: { rider_type: "STILL_PHOTO" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { rider_still_id: $.data.id }
            - call: "POST /road-closure-bookings"
              payload: { application_id: "${app_id}", street_segment_id: "${seg1_id}", closure_start_at: "2026-06-01T08:00:00Z", closure_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { b1_id: $.data.id }
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /department-reviews?application_id=${app_id}&department_id=${dept_pol_id}"
              as: FilmOfficeCoordinator
              captures: { rev_pol_id: "$.data[0].id" }
            - call: "POST /department-reviews/${rev_pol_id}/decision"
              payload: { decision: "APPROVE" }
              as: DepartmentReviewer
              as_user_id: "${dept_pol_id}"
            - call: "POST /riders/${rider_drone_id}/decision"
              payload: { decision: "APPROVE" }
              as: FilmOfficeCoordinator
            - call: "POST /riders/${rider_still_id}/decision"
              payload: { decision: "DENY" }
              as: FilmOfficeCoordinator
            - call: "POST /applications/${app_id}/payments"
              payload: { entry_type: "PERMIT_FEE", amount_cents: 204750 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /applications/${app_id}"
              as: FilmOfficeCoordinator
              captures: { v_issue: $.data.version }
          trigger:
            - call: "POST /applications/${app_id}/issue"
              payload: { expected_application_version: "${v_issue}" }
              as: FilmOfficeCoordinator
          assert:
            - "PermitApplication.${app_id}.estimated_fee_cents == 204750"
            - "PermitApplication.${app_id}.final_fee_cents == 190000"
            - "PermitApplication.${app_id}.municipal_surcharge_cents == 9500"
            - "PermitApplication.${app_id}.total_fee_cents == 199500"
            - "PermitApplication.${app_id}.deposit_cents == 89900"
            - "estimated_fee_cents (204750) != total_fee_cents (199500): the denied STILL_PHOTO rider (5000) drops out of FINAL, so the two variants diverge"

      - name: compliance_score_provisional_vs_final
        grounds:
          - calculations.production_compliance_score
          - entities.ProductionCompany.fields.compliance_score
          - entities.ProductionCompany.fields.late_wrap_count
          - entities.ProductionCompany.fields.damage_incident_count
          - state_machines.PermitApplication.WRAP_REQUESTED_to_WRAPPED
        distinguishing_aspect: "PROVISIONAL score (100, before wrap) vs FINAL score (75, after the wrap increments late_wrap_count and damage_incident_count) is a risk-scoring dual-variant on the ProductionCompany domain — a different entity domain than permit_fee's Application cost accounting."
        test_recipe:
          setup:
            - "Fresh company (all counters 0, compliance_score 100). Clock 2026-05-01."
            - "A minimal application (crew 5, 1 shoot day, no flags) is issued (estimate 41200 paid), deposit 8240 paid, wrap requested."
            - "PROVISIONAL read of the company before wrap returns compliance_score 100."
            - "The wrap-close reports actual_end 2026-06-01T21:00 (3h after permitted end 18:00 => late) and damage 5000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "Beta Pictures", contact_email: "ops@beta.test", primary_contact: "Sam Roe" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /officers"
              payload: { full_name: "Ofc Diaz", badge_number: "B-1", rank: "OFFICER", hourly_rate_cents: 8000 }
              as: FilmOfficeCoordinator
              captures: { officer_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Alley Scene", synopsis: "Short", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "5 Alley Ct", geo_zone: "Z2", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /applications/${app_id}"
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { v1: $.data.version }
            - call: "POST /applications/${app_id}/insurance-certificates"
              payload: { policy_number: "POL-2", coverage_amount_cents: 5000000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z", expected_application_version: "${v1}" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { coi_id: $.data.id }
            - call: "POST /insurance-certificates/${coi_id}/verify"
              payload: { decision: "VERIFY" }
              as: FilmOfficeCoordinator
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /department-reviews?application_id=${app_id}&department_id=${dept_pol_id}"
              as: FilmOfficeCoordinator
              captures: { rev_id: "$.data[0].id" }
            - call: "POST /department-reviews/${rev_id}/decision"
              payload: { decision: "APPROVE" }
              as: DepartmentReviewer
              as_user_id: "${dept_pol_id}"
            - call: "POST /applications/${app_id}/payments"
              payload: { entry_type: "PERMIT_FEE", amount_cents: 41200 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /applications/${app_id}"
              as: FilmOfficeCoordinator
              captures: { v_issue: $.data.version }
            - call: "POST /applications/${app_id}/issue"
              payload: { expected_application_version: "${v_issue}" }
              as: FilmOfficeCoordinator
            - call: "POST /applications/${app_id}/payments"
              payload: { entry_type: "DEPOSIT", amount_cents: 8240 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /production-companies/${pc_id}"
              as: FilmOfficeCoordinator
              captures: { prov_score: $.data.compliance_score }
            - call: "POST /applications/${app_id}/wrap-request"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
          trigger:
            - call: "POST /applications/${app_id}/wrap-close"
              payload: { actual_end_at: "2026-06-01T21:00:00Z", damages_reported: true, damage_cost_cents: 5000 }
              as: FieldOfficer
              as_user_id: "${officer_id}"
          assert:
            - "The PROVISIONAL read captured as prov_score during setup == 100"
            - "ProductionCompany.${pc_id}.late_wrap_count == 1"
            - "ProductionCompany.${pc_id}.damage_incident_count == 1"
            - "ProductionCompany.${pc_id}.compliance_score == 75 (FINAL: 100 - 10 late - 15 damage), diverging from the PROVISIONAL 100"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across different modes (a) and (c)
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: permit_fee_nonlinear_crew_and_flags
        grounds:
          - calculations.permit_fee
          - entities.PermitApplication.fields.crew_size
          - entities.PermitApplication.fields.estimated_fee_cents
          - entities.PermitApplication.fields.shoot_days
        distinguishing_aspect: "Mode (a): >=3 inputs (per-day rate, tiered crew surcharge, conditional road-closure flag) with non-linear tiered-rate selection on crew_size (60 -> the 51-150 tier -> 50000)."
        test_recipe:
          setup:
            - "Company + one segment; clock 2026-05-01."
            - "Application crew 60 (tier 51-150 => 50000), 2 shoot days, road-closure ON, parking OFF, one PENDING booking, no riders."
            - "ESTIMATE subtotal = 25000 + 15000*2 + 50000 + 40000*1 + 0 + 0 = 145000; +5% surcharge 7250 => estimated_fee_cents 152250."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "Gamma Studios", contact_email: "ops@gamma.test", primary_contact: "Jo Kim" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /street-segments"
              payload: { segment_code: "OAK-200", name: "Oak Ave 200", length_m: 90 }
              as: FilmOfficeCoordinator
              captures: { seg1_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Chase", synopsis: "Action", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-02T20:00:00Z", crew_size: 60, requires_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "200 Oak Ave", geo_zone: "Z3", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-02T20:00:00Z", uses_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /road-closure-bookings"
              payload: { application_id: "${app_id}", street_segment_id: "${seg1_id}", closure_start_at: "2026-06-01T08:00:00Z", closure_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { est: $.data.estimated_fee_cents }
          assert:
            - "PermitApplication.${app_id}.shoot_days == 2"
            - "PermitApplication.${app_id}.estimated_fee_cents == 152250"

      - name: municipal_surcharge_tier_keyed_on_subtotal
        grounds:
          - calculations.municipal_surcharge
          - calculations.permit_fee
          - entities.PermitApplication.fields.estimated_fee_cents
        distinguishing_aspect: "Mode (c): total = subtotal + surcharge, but the surcharge RATE is keyed on the 290000 SUBTOTAL's tier (500 bps => 14500), NOT on the post-surcharge total 304500 (which would be tier 700 bps => 20300); evaluation order is pinned."
        test_recipe:
          setup:
            - "Company + three distinct segments; clock 2026-05-01."
            - "Application crew 200 (>150 => 100000), 3 shoot days, road-closure ON, parking OFF, three PENDING bookings (one per segment, no overlap), no riders."
            - "ESTIMATE subtotal = 25000 + 15000*3 + 100000 + 40000*3 + 0 = 290000 (tier2, 500 bps)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "Delta Media", contact_email: "ops@delta.test", primary_contact: "Lee Ng" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /street-segments"
              payload: { segment_code: "SEG-A", name: "Seg A", length_m: 80 }
              as: FilmOfficeCoordinator
              captures: { seg_a_id: $.data.id }
            - call: "POST /street-segments"
              payload: { segment_code: "SEG-B", name: "Seg B", length_m: 80 }
              as: FilmOfficeCoordinator
              captures: { seg_b_id: $.data.id }
            - call: "POST /street-segments"
              payload: { segment_code: "SEG-C", name: "Seg C", length_m: 80 }
              as: FilmOfficeCoordinator
              captures: { seg_c_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Parade", synopsis: "Big", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-03T20:00:00Z", crew_size: 200, requires_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 Plaza", geo_zone: "Z4", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-03T20:00:00Z", uses_road_closure: true }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /road-closure-bookings"
              payload: { application_id: "${app_id}", street_segment_id: "${seg_a_id}", closure_start_at: "2026-06-01T08:00:00Z", closure_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /road-closure-bookings"
              payload: { application_id: "${app_id}", street_segment_id: "${seg_b_id}", closure_start_at: "2026-06-01T08:00:00Z", closure_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /road-closure-bookings"
              payload: { application_id: "${app_id}", street_segment_id: "${seg_c_id}", closure_start_at: "2026-06-01T08:00:00Z", closure_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { est: $.data.estimated_fee_cents }
          assert:
            - "PermitApplication.${app_id}.estimated_fee_cents == 304500 (= 290000 + floor(290000*0.05))"
            - "estimated_fee_cents is NOT 310300 (= 290000 + floor(290000*0.07)) which is what keying the rate on the post-surcharge total would wrongly produce"

  # =========================================================================
  # Rule 3 — Non-linear (cyclic) state machines on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: application_revision_loop
        grounds:
          - state_machines.PermitApplication.UNDER_REVIEW_to_REVISION_REQUIRED
          - state_machines.PermitApplication.REVISION_REQUIRED_to_UNDER_REVIEW
          - entities.PermitApplication.fields.status
        distinguishing_aspect: "PermitApplication cycles UNDER_REVIEW -> REVISION_REQUIRED -> UNDER_REVIEW (a revision loop), a non-linear shape on the PermitApplication entity."
        test_recipe:
          setup:
            - "Company + POLICE(ALL) dept; clock 2026-05-01."
            - "A minimal application is submitted (UNDER_REVIEW, 1 PENDING review), then that review is REJECTED, driving the application to REVISION_REQUIRED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "Loop Films", contact_email: "ops@loop.test", primary_contact: "Ada" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Loop", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "1 Loop", geo_zone: "Z5", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /department-reviews?application_id=${app_id}&department_id=${dept_pol_id}"
              as: FilmOfficeCoordinator
              captures: { rev_id: "$.data[0].id" }
            - call: "POST /department-reviews/${rev_id}/decision"
              payload: { decision: "REJECT" }
              as: DepartmentReviewer
              as_user_id: "${dept_pol_id}"
          trigger:
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { st: $.data.status }
          assert:
            - "After the REJECT the application was REVISION_REQUIRED; the resubmit returns PermitApplication.${app_id}.status == UNDER_REVIEW (loop closed)"

      - name: department_review_revision_cycle
        grounds:
          - state_machines.DepartmentReview.PENDING_to_REVISION_REQUESTED
          - state_machines.DepartmentReview.REVISION_REQUESTED_to_PENDING
          - entities.DepartmentReview.fields.status
        distinguishing_aspect: "DepartmentReview cycles REVISION_REQUESTED -> PENDING on resubmit — a non-linear shape on the DepartmentReview entity (a different entity than application_revision_loop's PermitApplication)."
        test_recipe:
          setup:
            - "Company + two ALL_APPLICATIONS depts (POLICE, FIRE); clock 2026-05-01."
            - "Application submitted (UNDER_REVIEW, 2 PENDING reviews). POLICE review set to REVISION_REQUESTED; FIRE review REJECTED (drives app to REVISION_REQUIRED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: FilmOfficeCoordinator
            - call: "POST /production-companies"
              payload: { legal_name: "Cycle Co", contact_email: "ops@cycle.test", primary_contact: "Bo" }
              as: FilmOfficeCoordinator
              captures: { pc_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "POLICE", name: "Police", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_pol_id: $.data.id }
            - call: "POST /departments"
              payload: { code: "FIRE", name: "Fire", trigger_condition: "ALL_APPLICATIONS" }
              as: FilmOfficeCoordinator
              captures: { dept_fire_id: $.data.id }
            - call: "POST /applications"
              payload: { production_company_id: "${pc_id}", title: "Cyc", synopsis: "x", shoot_start_at: "2026-06-01T08:00:00Z", shoot_end_at: "2026-06-01T18:00:00Z", crew_size: 5 }
              as: ProductionCompany
              as_user_id: "${pc_id}"
              captures: { app_id: $.data.id }
            - call: "POST /applications/${app_id}/location-details"
              payload: { address: "2 Cyc", geo_zone: "Z6", activity_type: "FILMING", requested_start_at: "2026-06-01T08:00:00Z", requested_end_at: "2026-06-01T18:00:00Z" }
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "POST /applications/${app_id}/submit"
              payload: {}
              as: ProductionCompany
              as_user_id: "${pc_id}"
            - call: "GET /department-reviews?application_id=${app_id}&department_id=${dept_pol_id}"
              as: FilmOfficeCoordinator
              captures: { rev_pol_id: "$.data[0].id" }
            - call: "GET /department-reviews?application_id=${app_id}&department_id=${dept_fire_id}"
              as: FilmOfficeCoordinator
