    distinguishing_aspect: 'common_fields discipline: suspend and reactivate each bump version by one (1 -> 2 -> 3) and refresh updated_at.'
    test_recipe:
      setup:
      - Logical clock set; one HOSPITAL org (version 1).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
