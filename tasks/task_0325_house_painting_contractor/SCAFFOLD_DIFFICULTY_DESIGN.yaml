# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index) — task_0325
# Nine §0.5 Difficulty Rules x 2 instances = 18 instances.
# Canonical numeric fixtures (computed against §1.3 formulas):
#   Product P1: price_per_gallon_cents=4000, coverage_sqft_per_gallon_per_coat=350
#   SQFT_PER_HOUR=160, LABOR_RATE_CENTS_PER_HOUR=6550
#   PREP_FACTOR: LIGHT 1.0, STANDARD 1.25, HEAVY 1.6, RESTORATION 2.0
#   Surface S1 (120 sqft, 1 coat, LIGHT): gallons=1, material=4000, labor_raw=4912.5 -> labor=4913
#   Surface S2 (100 sqft, 2 coats, LIGHT): gallons=1, material=4000, labor_raw=8187.5 -> labor=8188
#   estimate_material=8000, estimate_labor (round-per-line THEN sum)=13101, estimate_total=21101
#   deposit_due(30%)=6330, balance_after_deposit=14771
#   ADD S3 (300 sqft, 2 coats, HEAVY): gallons=2, material=8000, labor=39300, delta=+47300
#   REMOVE S2 delta=-12188
#   warranty provisional (0.20*S1 labor 4913)=983 ; warranty final (3.0h)=19650
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: project_estimate_vs_final_total_diverge_on_removed_surface
        grounds:
          - calculations.project_totals
          - state_machines.Project.WALKTHROUGH_PENDING_to_COMPLETED
          - entities.Project.fields.final_total_cents
        distinguishing_aspect: |
          On the Project domain, the ESTIMATE variant is FROZEN at finalize over PLANNED line items
          (estimate_total_cents=21101) while the FINAL variant at COMPLETED sums EXECUTED line items only;
          a surface REMOVED by an approved change order after finalize is excluded from FINAL, so
          final_total_cents (8913) != the frozen estimate_total_cents (21101).
        test_recipe:
          setup:
            - "Project with surfaces S1(120,1,LIGHT) and S2(100,2,LIGHT); finalize freezes estimate_total=21101, deposit_due=6330."
            - "An approved REMOVE_SURFACE change order drops S2 AFTER finalize, leaving revised_total=8913 (frozen estimate stays 21101)."
            - "Deposit 6330 paid, color approved, crew scheduled, work done, walkthrough passed, balance 2583 paid -> COMPLETED."
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30, warranty_months: 12 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
              captures: { s1: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Hall", surface_kind: "INTERIOR", area_sqft: 100, coats: 2, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
              captures: { s2: $.data.id }
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
              captures: { v_after_est: $.data.version }
            - call: "POST /painting/change-orders"
              payload: { project_id: "${proj}", expected_project_version: "${v_after_est}", reason: "drop hall", action: "REMOVE_SURFACE", target_surface_id: "${s2}" }
              as: Estimator
              captures: { co: $.data.id }
            - call: "POST /painting/change-orders/${co}/submit"
              payload: {}
              as: Estimator
            - call: "POST /painting/change-orders/${co}/approve"
              payload: {}
              as: Customer
            - call: "POST /painting/color-selections"
              payload: { surface_id: "${s1}", color_code: "SW-7005" }
              as: Estimator
              captures: { cs1: $.data.id }
            - call: "POST /painting/color-selections/${cs1}/approve"
              payload: {}
              as: Customer
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-02", end_date: "2026-03-03" }
              as: ProjectManager
              captures: { ca1: $.data.id }
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "DEPOSIT", amount_cents: 6330 }
              as: Customer
            - call: "POST /painting/projects/${proj}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /painting/projects/${proj}/start-work"
              payload: {}
              as: ProjectManager
            - call: "POST /painting/crew-assignments/${ca1}/begin"
              payload: {}
              as: CrewMember
            - call: "POST /painting/crew-assignments/${ca1}/complete"
              payload: {}
              as: CrewMember
            - call: "POST /painting/projects/${proj}/request-walkthrough"
              payload: {}
              as: ProjectManager
            - call: "GET /painting/walkthroughs?project_id=${proj}"
              payload: {}
              as: ProjectManager
              captures: { wt: "$.data[0].id" }
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "FINAL", amount_cents: 2583 }
              as: Customer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T09:00:00Z" }
              as: ProjectManager
          trigger:
            - call: "POST /painting/walkthroughs/${wt}/pass"
              payload: {}
              as: Customer
            - call: "GET /painting/projects/${proj}"
              payload: {}
              as: ProjectManager
              captures: { final_total: $.data.final_total_cents, est_total: $.data.estimate_total_cents }
          assert:
            - "Project.${proj}.workflow_status == COMPLETED"
            - "Project.${proj}.estimate_total_cents == 21101"
            - "Project.${proj}.revised_total_cents == 8913"
            - "Project.${proj}.final_total_cents == 8913"
            - "final_total_cents (8913) != estimate_total_cents (21101) — the dual variants diverge"

      - name: warranty_provisional_vs_final_payout_diverge
        grounds:
          - calculations.warranty_payout
          - state_machines.WarrantyClaim.APPROVED_to_RESOLVED
          - entities.WarrantyClaim.fields.provisional_payout_cents
          - entities.WarrantyClaim.fields.final_payout_cents
        distinguishing_aspect: |
          On the WarrantyClaim domain (a different entity from project_totals), provisional_payout_cents=983
          is derived from 20% of the surface's original line-item labor (4913) at FILED, while final_payout_cents
          is round_half_up(logged_touchup_hours * 6550); logging 3.0h yields 19650, diverging from 983.
        test_recipe:
          setup:
            - "A COMPLETED project (single surface S1, labor 4913) within its warranty window; clock at 2026-04-01."
            - "A warranty claim FILED on S1 (provisional_payout_cents=983), then APPROVED."
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30, warranty_months: 12 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
              captures: { s1: $.data.id }
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
            - call: "POST /painting/color-selections"
              payload: { surface_id: "${s1}", color_code: "SW-7005" }
              as: Estimator
              captures: { cs1: $.data.id }
            - call: "POST /painting/color-selections/${cs1}/approve"
              payload: {}
              as: Customer
            - call: "POST /painting/crew-members"
              payload: { full_name: "Pat Painter", skill_level: "MASTER", daily_rate_cents: 50000 }
              as: ProjectManager
              captures: { cm1: $.data.id }
            - call: "POST /painting/crew-assignments"
              payload: { project_id: "${proj}", crew_member_id: "${cm1}", start_date: "2026-03-02", end_date: "2026-03-03" }
              as: ProjectManager
              captures: { ca1: $.data.id }
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "DEPOSIT", amount_cents: 2674 }
              as: Customer
            - call: "POST /painting/projects/${proj}/schedule"
              payload: {}
              as: ProjectManager
            - call: "POST /painting/projects/${proj}/start-work"
              payload: {}
              as: ProjectManager
            - call: "POST /painting/crew-assignments/${ca1}/begin"
              payload: {}
              as: CrewMember
            - call: "POST /painting/crew-assignments/${ca1}/complete"
              payload: {}
              as: CrewMember
            - call: "POST /painting/projects/${proj}/request-walkthrough"
              payload: {}
              as: ProjectManager
            - call: "GET /painting/walkthroughs?project_id=${proj}"
              payload: {}
              as: ProjectManager
              captures: { wt: "$.data[0].id" }
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "FINAL", amount_cents: 6239 }
              as: Customer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T09:00:00Z" }
              as: ProjectManager
            - call: "POST /painting/walkthroughs/${wt}/pass"
              payload: {}
              as: Customer
            - call: "POST /painting/warranty-claims"
              payload: { project_id: "${proj}", surface_id: "${s1}", description: "peeling near trim", filed_at: "2026-05-01T00:00:00.000Z" }
              as: Customer
              captures: { claim: $.data.id, prov: $.data.provisional_payout_cents }
            - call: "POST /painting/warranty-claims/${claim}/approve"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /painting/warranty-claims/${claim}/resolve"
              payload: { logged_touchup_hours: 3.0 }
              as: ProjectManager
              captures: { fin: $.data.final_payout_cents }
          assert:
            - "WarrantyClaim.${claim}.provisional_payout_cents == 983"
            - "WarrantyClaim.${claim}.final_payout_cents == 19650"
            - "final_payout_cents != provisional_payout_cents (19650 != 983)"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: material_gallons_ceil_three_input_nonlinear
        grounds:
          - calculations.material_estimate
          - entities.LineItem.fields.gallons_required
          - entities.LineItem.fields.material_cost_cents
        distinguishing_aspect: |
          Mode (a): gallons_required = ceil(area_sqft * coats / coverage) combines three inputs with a
          non-linear ceiling; 600 sqft x 2 coats / 350 = 3.43 -> 4 gallons -> material 16000, not a linear
          rate times area.
        test_recipe:
          setup:
            - "Project with one surface 600 sqft, 2 coats, STANDARD, product coverage 350."
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
          trigger:
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Great Room", surface_kind: "INTERIOR", area_sqft: 600, coats: 2, prep_level: "STANDARD", paint_product_id: "${p1}" }
              as: Estimator
              captures: { s1: $.data.id }
            - call: "GET /painting/line-items?project_id=${proj}"
              payload: {}
              as: Estimator
              captures: { gal: "$.data[0].gallons_required", mat: "$.data[0].material_cost_cents" }
          assert:
            - "LineItem for surface ${s1} gallons_required == 4"
            - "LineItem for surface ${s1} material_cost_cents == 16000"

      - name: project_labor_rounding_order_per_line_then_sum
        grounds:
          - calculations.project_totals
          - calculations.labor_estimate
          - entities.Project.fields.estimate_labor_cents
        distinguishing_aspect: |
          Mode (b): two LIGHT line items with raw labor 4912.5 and 8187.5 round per-line to 4913+8188=13101
          (the pinned order); sum-then-round would give round_half_up(13100.0)=13100. The 1-cent gap proves
          rounding order is pinned to per-line-item THEN sum.
        test_recipe:
          setup:
            - "Project with S1(120,1,LIGHT) raw labor 4912.5 and S2(100,2,LIGHT) raw labor 8187.5."
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Hall", surface_kind: "INTERIOR", area_sqft: 100, coats: 2, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
          trigger:
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
              captures: { lab: $.data.estimate_labor_cents, tot: $.data.estimate_total_cents }
          assert:
            - "Project.${proj}.estimate_labor_cents == 13101"
            - "Project.${proj}.estimate_material_cents == 8000"
            - "Project.${proj}.estimate_total_cents == 21101"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: change_order_cyclic_reject_revise_to_draft
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_REJECTED
          - state_machines.ChangeOrder.REJECTED_to_DRAFT
          - state_machines.ChangeOrder.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          ChangeOrder is cyclic: SUBMITTED -> REJECTED -> DRAFT -> SUBMITTED again, a genuine revision loop
          on the ChangeOrder entity; delta_total_cents is reset to 0 on revise and recomputed on re-submit.
        test_recipe:
          setup:
            - "ESTIMATED project (S1) with a SUBMITTED ADD_SURFACE change order, then REJECTED."
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR" }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
              captures: { v: $.data.version }
            - call: "POST /painting/change-orders"
              payload: { project_id: "${proj}", expected_project_version: "${v}", reason: "add study", action: "ADD_SURFACE", new_label: "Study", new_surface_kind: "INTERIOR", new_area_sqft: 300, new_coats: 2, new_prep_level: "HEAVY", new_paint_product_id: "${p1}" }
              as: Estimator
              captures: { co: $.data.id }
            - call: "POST /painting/change-orders/${co}/submit"
              payload: {}
              as: Estimator
            - call: "POST /painting/change-orders/${co}/reject"
              payload: {}
              as: Customer
          trigger:
            - call: "POST /painting/change-orders/${co}/revise"
              payload: { new_area_sqft: 200 }
              as: Estimator
              captures: { st: $.data.status, d: $.data.delta_total_cents }
            - call: "POST /painting/change-orders/${co}/submit"
              payload: {}
              as: Estimator
              captures: { st2: $.data.status }
          assert:
            - "After revise: ChangeOrder.${co}.status == DRAFT and delta_total_cents == 0"
            - "After re-submit: ChangeOrder.${co}.status == SUBMITTED"

      - name: project_parallel_workflow_and_payment_axes_independent
        grounds:
          - state_machines.Project.UNPAID_to_DEPOSIT_PAID
          - state_machines.Project.DRAFT_to_ESTIMATED
          - entities.Project.fields.payment_status
          - entities.Project.fields.workflow_status
        distinguishing_aspect: |
          Project carries two independent state dimensions on one row: paying the deposit advances
          payment_status UNPAID->DEPOSIT_PAID while workflow_status stays ESTIMATED, proving the axes evolve
          independently (parallel shape) on the Project entity.
        test_recipe:
          setup:
            - "ESTIMATED project (S1), payment_status UNPAID, deposit_due=2674."
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
              captures: { dep: $.data.deposit_due_cents }
          trigger:
            - call: "POST /painting/payments"
              payload: { project_id: "${proj}", kind: "DEPOSIT", amount_cents: 2674 }
              as: Customer
            - call: "GET /painting/projects/${proj}"
              payload: {}
              as: ProjectManager
              captures: { wf: $.data.workflow_status, pay: $.data.payment_status }
          assert:
            - "Project.${proj}.payment_status == DEPOSIT_PAID"
            - "Project.${proj}.workflow_status == ESTIMATED"
            - "Project.${proj}.deposit_due_cents == 2674"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: change_order_approve_cascade_depth3_to_project_totals
        grounds:
          - state_machines.ChangeOrder.SUBMITTED_to_APPROVED
          - calculations.material_estimate
          - calculations.project_totals
          - calculations.deposit_due
          - entities.Project.fields.revised_total_cents
        distinguishing_aspect: |
          Depth>=3 chain from ChangeOrder approve: approve -> creates a Surface (link1) -> that surface's
          LineItem is computed (link2) -> the new LineItem set re-derives Project revised_total_cents and
          balance_due_cents (link3). Each link is caused by the prior, not by the approve action directly.
        test_recipe:
          setup:
            - "ESTIMATED project (S1) frozen estimate_total=8913, deposit_due=2674; SUBMITTED ADD_SURFACE order for S3(300,2,HEAVY) delta=+47300."
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30 }
              as: Estimator
              captures: { proj: $.data.id }
            - call: "POST /painting/surfaces"
              payload: { project_id: "${proj}", label: "Bedroom", surface_kind: "INTERIOR", area_sqft: 120, coats: 1, prep_level: "LIGHT", paint_product_id: "${p1}" }
              as: Estimator
            - call: "POST /painting/projects/${proj}/finalize-estimate"
              payload: {}
              as: Estimator
              captures: { v: $.data.version }
            - call: "POST /painting/change-orders"
              payload: { project_id: "${proj}", expected_project_version: "${v}", reason: "add study", action: "ADD_SURFACE", new_label: "Study", new_surface_kind: "INTERIOR", new_area_sqft: 300, new_coats: 2, new_prep_level: "HEAVY", new_paint_product_id: "${p1}" }
              as: Estimator
              captures: { co: $.data.id }
            - call: "POST /painting/change-orders/${co}/submit"
              payload: {}
              as: Estimator
              captures: { delta: $.data.delta_total_cents }
          trigger:
            - call: "POST /painting/change-orders/${co}/approve"
              payload: {}
              as: Customer
            - call: "GET /painting/projects/${proj}"
              payload: {}
              as: ProjectManager
              captures: { rev: $.data.revised_total_cents, dep: $.data.deposit_due_cents }
          assert:
            - "ChangeOrder.${co}.delta_total_cents == 47300"
            - "Project.${proj}.revised_total_cents == 56213"
            - "Project.${proj}.estimate_total_cents == 8913 (frozen; unchanged by the change order)"
            - "Project.${proj}.deposit_due_cents == 2674 (frozen; unchanged by the change order)"
            - "A new Surface exists for the project with status PLANNED and an associated LineItem (material 8000, labor 39300)"

      - name: walkthrough_pass_cascade_depth2_to_completed_warranty
        grounds:
          - state_machines.Walkthrough.PENDING_to_PASSED
          - state_machines.Project.WALKTHROUGH_PENDING_to_COMPLETED
          - entities.Project.fields.warranty_expires_at
        distinguishing_aspect: |
          Depth>=2 chain from a different trigger (Walkthrough pass): pass -> Project transitions to COMPLETED
          (link1) -> COMPLETED sets warranty_expires_at = completion_time + 12 months (link2). Originates from
          Walkthrough, distinct from the change-order cascade.
        test_recipe:
          setup:
            - "WALKTHROUGH_PENDING project, PAID_IN_FULL, latest Walkthrough PENDING with punch_list_count 0; clock pinned to 2026-04-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /painting/paint-products"
              payload: { name: "PremiumMatte White", surface_kind: "INTERIOR", finish_type: "FLAT", price_per_gallon_cents: 4000, coverage_sqft_per_gallon_per_coat: 350 }
              as: Estimator
              captures: { p1: $.data.id }
            - call: "POST /painting/projects"
              payload: { customer_id: "cust-1", site_address: "1 Oak St", scope: "INTERIOR", deposit_pct: 30, warranty_months: 12 }
              as: Estimator
