  - rule_id: boundary_precision_check
    instances:
      - name: appeal_deadline_inclusive_instant
        grounds:
          - calculations.calc_appeal_deadline
          - errors[ERR_APPEAL_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Metric: deadline instant on POST /api/cases/{id}/appeals. A dismissal appeal filed at exactly
          closed_at + 5 days (2026-08-08T00:00:00Z) is timely (inclusive boundary, 201); a determination
          appeal filed one second after its deadline on a different case is ERR_APPEAL_WINDOW_EXPIRED -
          the same 1-second delta on the same metric flips the outcome. Clock moves monotonically.
        test_recipe:
          setup:
            - "Case 2 [STALKING] dismissed at 2026-08-03T00:00:00Z (dismissal appeal deadline 2026-08-08T00:00:00Z)"
            - "Case 1 [OTHER_SEX_BASED] with determination issued at 2026-09-01T10:00:00Z (appeal_deadline 2026-09-06T10:00:00Z)"
