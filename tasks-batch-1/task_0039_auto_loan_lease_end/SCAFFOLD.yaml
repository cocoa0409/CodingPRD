# =============================================================================
# Auto Loan & Lease End — benchmark seed tables (v1)
# =============================================================================

scenario: "Auto Loan & Lease End: credit tier (FICO Tier), down payment/monthly payment, Gap insurance, mileage overage penalty, lease-end renewal/purchase/return, Disposition Fee, default rate"

domain_name: auto-loan-lease-end
api_prefix: /

complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: compliance_audit
  complexity_layers:
    - dual_variant_calculation        # loan payoff actuarial vs gross; lease-end RETURN vs PURCHASE
    - rate_threshold_triggers         # FICO tier breakpoints, mileage overage threshold, delinquency day count
    - cascading_side_effects          # default -> gap claim -> deficiency waiver; lease-end election -> settlement -> contract close
    - optimistic_concurrency          # OCC on Loan.version / Lease.version for supersede-style writes

  entity_topology: flat
  # Customer, Vehicle, RateCard are independent peers; Loan/Lease/Payment/LeaseEndSettlement
  # reference them by FK in the body. No nesting in URL paths beyond /customers/{id}/loans
  # reverse-reachability sub-resources.

  state_machine_shape: cyclic
  # Loan has a CURRENT<->DELINQUENT cure cycle; Lease is branching fork-join.

  relationship_patterns:
    - one_to_many        # Customer 1:N Loan, Customer 1:N Lease, Loan 1:N Payment
    - cross_aggregate    # Loan/Lease reference Vehicle and RateCard across aggregate boundaries

  role_model: peer_roles
  # FinanceManager owns contract origination & rate cards; Borrower owns payments &
  # lease-end elections on their own contracts; Auditor is read-only.

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Borrower legal name" }
      - { name: email, type: string, source: input, description: "Contact email; unique across customers" }
      - { name: fico_score, type: integer, source: input, description: "Raw FICO score 300-850" }
      - { name: fico_tier, type: enum, source: computed, description: "TIER_1 | TIER_2 | TIER_3 | TIER_4 — derived from fico_score via RateCard breakpoints at calculation time" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: vin, type: string, source: input, description: "Vehicle identification number; unique across vehicles" }
      - { name: make_model, type: string, source: input, description: "Display name e.g. 'Acme Sedan LX'" }
      - { name: msrp_cents, type: integer, source: input, description: "Manufacturer suggested retail price in integer cents" }
      - { name: sale_price_cents, type: integer, source: input, description: "Negotiated sale/cap-cost price in integer cents" }
      - { name: residual_value_cents, type: integer, source: input, description: "Contractual residual (lease-end purchase) value in integer cents" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | FINANCED — set FINANCED when a Loan or Lease is originated against it", default: AVAILABLE }

  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Rate card label e.g. '2026-Q2'" }
      - { name: tier_1_min_fico, type: integer, source: input, description: "Minimum FICO for TIER_1 (inclusive)" }
      - { name: tier_2_min_fico, type: integer, source: input, description: "Minimum FICO for TIER_2 (inclusive); below tier_1_min_fico" }
      - { name: tier_3_min_fico, type: integer, source: input, description: "Minimum FICO for TIER_3 (inclusive); below tier_2_min_fico. Scores below this are TIER_4" }
      - { name: tier_1_apr, type: number, source: input, description: "Annual loan APR for TIER_1 as decimal e.g. 0.0399" }
      - { name: tier_2_apr, type: number, source: input, description: "Annual loan APR for TIER_2" }
      - { name: tier_3_apr, type: number, source: input, description: "Annual loan APR for TIER_3" }
      - { name: tier_4_apr, type: number, source: input, description: "Annual loan APR for TIER_4" }
      - { name: lease_money_factor, type: number, source: input, description: "Lease money factor (monthly), tier-independent in this model e.g. 0.00125" }
      - { name: default_rate_apr, type: number, source: input, description: "Penalty APR applied to delinquent loan balance e.g. 0.2499" }
      - { name: lease_tax_rate, type: number, source: input, description: "Sales tax rate applied to lease base monthly e.g. 0.0725" }
      - { name: active, type: boolean, source: system, description: "Whether this card is the one used for new originations; exactly one active at a time", default: false }

  - name: Loan
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the borrower" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; financed vehicle" }
      - { name: rate_card_id, type: string, source: system, description: "FK -> RateCard.id; the active card pinned at origination" }
      - { name: down_payment_cents, type: integer, source: input, description: "Cash down at origination in integer cents" }
      - { name: term_months, type: integer, source: input, description: "Loan term in months e.g. 60" }
      - { name: gap_insurance, type: boolean, source: input, description: "Whether Gap (Guaranteed Asset Protection) coverage is purchased", default: false }
      - { name: financed_principal_cents, type: integer, source: computed, description: "sale_price_cents - down_payment_cents, pinned at origination" }
      - { name: apr, type: number, source: computed, description: "Loan APR selected from rate_card by customer fico_tier, pinned at origination" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "Amortized level payment, pinned at origination (see calc loan_monthly_payment)" }
      - { name: payments_made_count, type: integer, source: computed, description: "Count of Payment rows with status=POSTED against this loan", default: 0 }
      - { name: principal_balance_cents, type: integer, source: computed, description: "Actuarial scheduled remaining principal after payments_made_count posted payments" }
      - { name: missed_payment_count, type: integer, source: computed, description: "Number of MISSED Payment rows since the last cure", default: 0 }
      - { name: status, type: enum, source: system, description: "CURRENT | DELINQUENT | DEFAULT | PAID_OFF — CURRENT initial; DEFAULT/PAID_OFF terminal", default: CURRENT }

  - name: Lease
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; the lessee" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; leased vehicle" }
      - { name: rate_card_id, type: string, source: system, description: "FK -> RateCard.id; the active card pinned at origination" }
      - { name: down_payment_cents, type: integer, source: input, description: "Capitalized cost reduction (cash down) in integer cents" }
      - { name: term_months, type: integer, source: input, description: "Lease term in months e.g. 36" }
      - { name: annual_mileage_allowance, type: integer, source: input, description: "Permitted miles per lease-year e.g. 12000" }
      - { name: per_mile_overage_rate_cents, type: number, source: input, description: "Cents charged per mile over the allowance e.g. 22.5" }
      - { name: disposition_fee_cents, type: integer, source: input, description: "Flat fee charged on RETURN at lease end e.g. 39500" }
      - { name: purchase_option_fee_cents, type: integer, source: input, description: "Flat fee charged on PURCHASE at lease end e.g. 30000" }
      - { name: gap_insurance, type: boolean, source: input, description: "Whether Gap coverage is purchased", default: false }
      - { name: adjusted_cap_cost_cents, type: integer, source: computed, description: "sale_price_cents - down_payment_cents, pinned at origination" }
      - { name: base_monthly_cents, type: integer, source: computed, description: "Depreciation fee + finance fee, pre-tax, pinned at origination" }
      - { name: monthly_payment_cents, type: integer, source: computed, description: "base_monthly_cents + lease tax, pinned at origination (see calc lease_monthly_payment)" }
      - { name: odometer_miles, type: integer, source: system, description: "Latest odometer reading recorded at maturity/return", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | MATURING | RETURNED | PURCHASED | RENEWED | SETTLED — ACTIVE initial; SETTLED terminal", default: ACTIVE }

  - name: Payment
    parent: null
    common_fields: false   # append-only event: only id + created_at
    fields:
      - { name: loan_id, type: string, source: input, description: "FK -> Loan.id; the loan this payment applies to" }
      - { name: amount_cents, type: integer, source: input, description: "Posted amount in integer cents" }
      - { name: kind, type: enum, source: input, description: "SCHEDULED | LATE_FEE | PAYOFF — type of payment event" }
      - { name: status, type: enum, source: system, description: "POSTED | MISSED — POSTED on record-payment, MISSED on mark-missed", default: POSTED }
      - { name: late_fee_cents, type: integer, source: computed, description: "Late fee assessed when this payment was recorded as a cure on a delinquent loan, else 0", default: 0 }

  - name: LeaseEndSettlement
    parent: null
    common_fields: true
    fields:
      - { name: lease_id, type: string, source: input, description: "FK -> Lease.id; the lease being settled" }
      - { name: election, type: enum, source: input, description: "RETURN | PURCHASE | RENEW — lessee's lease-end choice" }
      - { name: odometer_miles, type: integer, source: input, description: "Final odometer reading at lease end" }
      - { name: per_year_excess_miles, type: array, source: input, description: "Per-lease-year excess-mile counts, length term_months/12; used for RETURN mileage overage. Required when election=RETURN" }
      - { name: renew_term_months, type: integer, source: input, description: "Term for the renewed lease; required when election=RENEW" }
      - { name: mileage_overage_cents, type: integer, source: computed, description: "Per-year-rounded mileage overage charge (RETURN only, else 0)" }
      - { name: disposition_charge_cents, type: integer, source: computed, description: "Disposition fee applied (RETURN only, else 0)" }
      - { name: purchase_amount_cents, type: integer, source: computed, description: "residual + purchase_option_fee (PURCHASE only, else 0)" }
      - { name: total_due_cents, type: integer, source: computed, description: "Net amount owed by lessee for this settlement (see calc lease_end_settlement)" }
      - { name: renewed_lease_id, type: string, source: computed, description: "FK -> Lease.id; the new Lease minted on a RENEW election, else null" }
      - { name: status, type: enum, source: system, description: "FINALIZED — settlements are computed-and-finalized atomically on creation", default: FINALIZED }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: Loan
    initial_state: CURRENT
    terminal_states: [DEFAULT, PAID_OFF]
    # Shape: CYCLIC — CURRENT <-> DELINQUENT cure loop, plus DELINQUENT -> DEFAULT
    # and CURRENT -> PAID_OFF (early payoff).
    transitions:
      - from: CURRENT
        to: CURRENT
        trigger: "POST /loans/{id}/payments (kind=SCHEDULED) — system event record-payment"
        actor: Borrower
        preconditions:
          - "Loan.status == CURRENT (ERR_LOAN_NOT_PAYABLE)"
          - "amount_cents == monthly_payment_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
          - "payments_made_count < term_months (ERR_LOAN_TERM_COMPLETE)"
        side_effects:
          - "create Payment(status=POSTED, kind=SCHEDULED, late_fee_cents=0)"
          - "payments_made_count increments by 1"
          - "principal_balance_cents recomputed via actuarial schedule (calc loan_principal_balance)"

      - from: CURRENT
        to: DELINQUENT
        trigger: "POST /loans/{id}/miss-payment — system event mark-missed"
        actor: FinanceManager
        preconditions:
          - "Loan.status == CURRENT (ERR_LOAN_NOT_PAYABLE)"
        side_effects:
          - "create Payment(status=MISSED, kind=SCHEDULED, late_fee_cents=0)"
          - "missed_payment_count increments by 1"

      - from: DELINQUENT
        to: DELINQUENT
        trigger: "POST /loans/{id}/miss-payment — system event mark-missed"
        actor: FinanceManager
        preconditions:
          - "Loan.status == DELINQUENT (ERR_LOAN_NOT_PAYABLE)"
          - "missed_payment_count < DEFAULT_THRESHOLD (ERR_LOAN_NOT_PAYABLE)"
        side_effects:
          - "create Payment(status=MISSED, kind=SCHEDULED, late_fee_cents=0)"
          - "missed_payment_count increments by 1"

      - from: DELINQUENT
        to: CURRENT
        trigger: "POST /loans/{id}/payments (kind=SCHEDULED) — cure a delinquent loan"
        actor: Borrower
        preconditions:
          - "Loan.status == DELINQUENT (ERR_LOAN_NOT_PAYABLE)"
          - "amount_cents == monthly_payment_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "create Payment(status=POSTED, kind=SCHEDULED, late_fee_cents=calc loan_late_fee)"
          - "payments_made_count increments by 1"
          - "missed_payment_count reset to 0"
          - "principal_balance_cents recomputed via actuarial schedule (calc loan_principal_balance)"

      - from: DELINQUENT
        to: DEFAULT
        trigger: "POST /loans/{id}/default — system event declare-default"
        actor: FinanceManager
        preconditions:
          - "Loan.status == DELINQUENT (ERR_LOAN_NOT_PAYABLE)"
          - "missed_payment_count >= DEFAULT_THRESHOLD (ERR_DEFAULT_THRESHOLD_NOT_MET)"
        side_effects:
          - "CASCADE: set associated Vehicle.status to AVAILABLE (repossession)"
          - "CASCADE: if gap_insurance true, the deficiency-waiver invariant applies on the gap settlement (see calc gap_deficiency_waiver)"

      - from: CURRENT
        to: PAID_OFF
        trigger: "POST /loans/{id}/payoff — system event early-payoff"
        actor: Borrower
        preconditions:
          - "Loan.status == CURRENT (ERR_LOAN_NOT_PAYABLE)"
          - "expected_loan_version matches Loan.version (ERR_STALE_VERSION)"
          - "amount_cents == actuarial payoff quote (calc loan_payoff_quote, ACTUARIAL variant) (ERR_PAYOFF_AMOUNT_MISMATCH)"
        side_effects:
          - "create Payment(status=POSTED, kind=PAYOFF, late_fee_cents=0)"
          - "principal_balance_cents set to 0"
          - "CASCADE: set associated Vehicle.status to AVAILABLE"
          - "increments Loan.version by 1"

  - entity: Lease
    initial_state: ACTIVE
    terminal_states: [SETTLED]
    # Shape: BRANCHING fork-join — MATURING forks into RETURNED | PURCHASED | RENEWED with
    # divergent side-effect sets, then each joins to SETTLED.
    transitions:
      - from: ACTIVE
        to: MATURING
        trigger: "POST /leases/{id}/mature — system event mature-lease"
        actor: FinanceManager
        preconditions:
          - "Lease.status == ACTIVE (ERR_LEASE_NOT_MATURABLE)"
        side_effects:
          - "Lease becomes eligible for a LeaseEndSettlement election"

      - from: MATURING
        to: RETURNED
        trigger: "POST /lease-end-settlements (election=RETURN) — fork branch RETURN"
        actor: Borrower
        preconditions:
          - "Lease.status == MATURING (ERR_LEASE_NOT_ELECTABLE)"
          - "expected_lease_version matches Lease.version (ERR_STALE_VERSION)"
          - "per_year_excess_miles length == term_months/12 (ERR_MILEAGE_SCHEDULE_INVALID)"
        side_effects:
          - "create LeaseEndSettlement(election=RETURN, status=FINALIZED)"
          - "settlement.mileage_overage_cents = calc lease_mileage_overage (per-year round-then-sum)"
          - "settlement.disposition_charge_cents = disposition_fee_cents"
          - "settlement.total_due_cents = calc lease_end_settlement (RETURN variant)"
          - "Lease.odometer_miles set from settlement.odometer_miles"
          - "CASCADE: set associated Vehicle.status to AVAILABLE"
          - "increments Lease.version by 1"

      - from: MATURING
        to: PURCHASED
        trigger: "POST /lease-end-settlements (election=PURCHASE) — fork branch PURCHASE"
        actor: Borrower
        preconditions:
          - "Lease.status == MATURING (ERR_LEASE_NOT_ELECTABLE)"
          - "expected_lease_version matches Lease.version (ERR_STALE_VERSION)"
        side_effects:
          - "create LeaseEndSettlement(election=PURCHASE, status=FINALIZED)"
          - "settlement.purchase_amount_cents = residual_value_cents + purchase_option_fee_cents"
          - "settlement.total_due_cents = calc lease_end_settlement (PURCHASE variant; no disposition, no mileage overage)"
          - "CASCADE: Vehicle.status stays FINANCED (title transfers to lessee, vehicle leaves the fleet)"
          - "increments Lease.version by 1"

      - from: MATURING
        to: RENEWED
        trigger: "POST /lease-end-settlements (election=RENEW) — fork branch RENEW"
        actor: Borrower
        preconditions:
          - "Lease.status == MATURING (ERR_LEASE_NOT_ELECTABLE)"
          - "expected_lease_version matches Lease.version (ERR_STALE_VERSION)"
          - "renew_term_months present and > 0 (ERR_RENEW_TERM_INVALID)"
        side_effects:
          - "create LeaseEndSettlement(election=RENEW, status=FINALIZED, total_due_cents=0)"
          - "CASCADE: mint a new Lease (status=ACTIVE) on the same Vehicle with cap cost = residual_value_cents, term=renew_term_months; settlement.renewed_lease_id set to its id"
          - "increments Lease.version by 1"

      - from: RETURNED
        to: SETTLED
        trigger: "system auto-transition — settlement finalized"
        actor: system
        preconditions:
          - "a FINALIZED LeaseEndSettlement exists for this lease"
        side_effects:
          - "Lease reaches terminal SETTLED state"

      - from: PURCHASED
        to: SETTLED
        trigger: "system auto-transition — settlement finalized"
        actor: system
        preconditions:
          - "a FINALIZED LeaseEndSettlement exists for this lease"
        side_effects:
          - "Lease reaches terminal SETTLED state"

      - from: RENEWED
        to: SETTLED
        trigger: "system auto-transition — settlement finalized"
        actor: system
        preconditions:
          - "a FINALIZED LeaseEndSettlement exists for this lease"
        side_effects:
          - "Lease reaches terminal SETTLED state"

# -----------------------------------------------------------------------------
# Table 1.2.1: Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - rule_id: payoff-stale-loan
    parent_entity: Loan
    write_endpoint: "POST /loans/{id}/payoff"
    occ_field: "expected_loan_version"
    description: |
      Submitting an early-payoff against a Loan whose version has advanced since
      the client last observed it is rejected. A posted scheduled payment between
      the client's read and the payoff bumps Loan.version and changes the actuarial
      payoff quote, so the client's view is stale and the payoff is rejected.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: lease-end-election-stale-lease
    parent_entity: Lease
    write_endpoint: "POST /lease-end-settlements"
    occ_field: "expected_lease_version"
    description: |
      Creating a LeaseEndSettlement against a Lease whose version has advanced
      since the client last observed it is rejected. A prior election already
      moved the lease out of MATURING (legitimately superseding the lessee's
      intended election), so this writer's view of the lease is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: customer_fico_tier
    trigger: "computed on read / at Loan origination from Customer.fico_score against the active RateCard breakpoints"
    algorithm: threshold
    formula: |
      if fico_score >= rate_card.tier_1_min_fico: TIER_1
      elif fico_score >= rate_card.tier_2_min_fico: TIER_2
      elif fico_score >= rate_card.tier_3_min_fico: TIER_3
      else: TIER_4
      # Breakpoints are inclusive lower bounds (>=), not (>).
    input_set: "Customer.fico_score; the active RateCard's tier_*_min_fico fields"
    precision: "integer comparison"

  - name: loan_monthly_payment
    trigger: "at Loan origination (POST /loans)"
    algorithm: tiered_pricing
    formula: |
      P = financed_principal_cents = sale_price_cents - down_payment_cents
      apr = rate_card APR selected by customer_fico_tier (tier_1_apr..tier_4_apr)
      i = apr / 12
      monthly_payment_cents = round_half_up( P * (i*(1+i)^n) / ((1+i)^n - 1) ), n = term_months
      # Combinatorial mode (a): >=3 inputs (P, apr-via-tier, n) with non-linear
      # amortization and tiered-rate selection.
    input_set: "Vehicle.sale_price_cents, Loan.down_payment_cents, Loan.term_months, RateCard APR by tier"
    constants: {}
    precision: "integer cents, round_half_up on the final payment only"

  - name: loan_principal_balance
    trigger: "after each POSTED scheduled payment; computed on read"
    algorithm: chronological
    formula: |
      bal = financed_principal_cents
      for each of the payments_made_count posted scheduled payments, in chronological order:
        interest_cents = round_half_up( bal * (apr/12) )
        principal_cents = monthly_payment_cents - interest_cents
        bal = bal - principal_cents
      principal_balance_cents = round_half_up(bal)
    input_set: "financed_principal_cents, apr, monthly_payment_cents, payments_made_count"
    precision: "integer cents, round_half_up per period (interest rounded each month before subtracting)"

  - name: loan_payoff_quote
    trigger: "at early payoff (POST /loans/{id}/payoff) and on GET /loans/{id}/payoff-quote"
    algorithm: forward_looking
    formula: |
      k = payments_made_count
      ACTUARIAL variant (binding for payoff): = loan_principal_balance after k payments
      GROSS variant (informational, naive): = monthly_payment_cents * (term_months - k)
      The unearned-interest rebate is (GROSS - ACTUARIAL).
    input_set: "financed_principal_cents, apr, monthly_payment_cents, term_months, payments_made_count"
    precision: "integer cents"
    variants:
      - name: actuarial
        when: "binding payoff amount the borrower must tender on POST /loans/{id}/payoff"
        difference: "remaining scheduled principal balance — excludes future (unearned) interest"
      - name: gross
        when: "informational sum-of-remaining-payments view"
        difference: "monthly_payment_cents * remaining periods — includes future interest; larger than actuarial"

  - name: loan_late_fee
    trigger: "when a payment cures a DELINQUENT loan (DELINQUENT -> CURRENT)"
    algorithm: threshold
    formula: |
      late_fee_cents = max( LATE_FEE_MIN_CENTS, round_half_up(monthly_payment_cents * LATE_FEE_PCT) )
      # Boundary: at exactly LATE_FEE_MIN_CENTS the floor applies (>=), the percentage does not override it.
    input_set: "Loan.monthly_payment_cents"
    constants:
      LATE_FEE_PCT: 0.05
      LATE_FEE_MIN_CENTS: 2500
    precision: "integer cents, round_half_up"

  - name: lease_monthly_payment
    trigger: "at Lease origination (POST /leases)"
    algorithm: constraint_propagation
    formula: |
      adjusted_cap_cost_cents = sale_price_cents - down_payment_cents
      depreciation_fee = (adjusted_cap_cost_cents - residual_value_cents) / term_months
      finance_fee      = (adjusted_cap_cost_cents + residual_value_cents) * lease_money_factor
      base_monthly_cents = round_half_up(depreciation_fee + finance_fee)
      lease_tax_cents    = round_half_up((depreciation_fee + finance_fee) * lease_tax_rate)
      monthly_payment_cents = base_monthly_cents + lease_tax_cents
      # Combinatorial mode (c): EVALUATION ORDER pinned. depreciation_fee and finance_fee
      # are computed on the UNROUNDED real values; base and tax are each rounded from the
      # SAME unrounded (depreciation_fee + finance_fee) sum, THEN added. Rounding the base
      # first and taxing the rounded base would diverge — the scaffold pins tax-on-unrounded.
    input_set: "Vehicle.sale_price_cents, Vehicle.residual_value_cents, Lease.down_payment_cents, Lease.term_months, RateCard.lease_money_factor, RateCard.lease_tax_rate"
    precision: "integer cents; base and tax each round_half_up from the unrounded pre-tax sum, then summed"

  - name: lease_mileage_overage
    trigger: "at RETURN settlement (POST /lease-end-settlements, election=RETURN)"
    algorithm: aggregation
    formula: |
      # per_year_excess_miles is the list of excess miles in each lease-year.
      # Pinned order: round EACH lease-year's charge to whole cents, THEN sum.
      mileage_overage_cents = sum over years y of round_half_up( per_year_excess_miles[y] * per_mile_overage_rate_cents )
      # Combinatorial mode (b): nested rounding where order matters. "round per-year then sum"
      # is pinned and differs from "sum the miles then round once" at the half-cent boundary.
    input_set: "LeaseEndSettlement.per_year_excess_miles, Lease.per_mile_overage_rate_cents"
    precision: "integer cents; round_half_up PER lease-year, then sum (NOT sum-then-round)"

  - name: lease_end_settlement
    trigger: "at LeaseEndSettlement creation"
    algorithm: aggregation
    formula: |
      RETURN variant:   total_due_cents = disposition_fee_cents + lease_mileage_overage
      PURCHASE variant: total_due_cents = residual_value_cents + purchase_option_fee_cents
      RENEW variant:    total_due_cents = 0   (obligation rolls into the new lease)
    input_set: "Lease + Vehicle fields per election"
    precision: "integer cents"
    variants:
      - name: return_charge
        when: "election == RETURN"
        difference: "disposition fee + per-year-rounded mileage overage; no residual purchase"
      - name: purchase_payoff
        when: "election == PURCHASE"
        difference: "residual + purchase option fee; NO disposition fee and NO mileage overage are charged"

  - name: gap_deficiency_waiver
    trigger: "on Loan DEFAULT when gap_insurance is true and a total-loss/repossession settlement occurs"
    algorithm: aggregation
    formula: |
      deficiency_cents = max(0, principal_balance_cents - insurance_settlement_cents)
      With gap_insurance == true: gap covers the full deficiency, so the borrower's
      net post-default balance equals 0:
        borrower_net_balance = principal_balance_cents - insurance_settlement_cents - gap_payout_cents == 0
      where gap_payout_cents = deficiency_cents.
      INVARIANT (conserved quantity = borrower_net_balance): forward action (declare default,
      apply insurance settlement) plus compensating action (gap payout) leave borrower_net_balance
      unchanged at 0. Without gap_insurance, gap_payout_cents = 0 and borrower_net_balance = deficiency_cents.
    input_set: "Loan.principal_balance_cents, insurance_settlement_cents (supplied on declare-default), Loan.gap_insurance"
    precision: "integer cents"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per RBAC matrix"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body-referenced resources exist, validated left-to-right (Customer, Vehicle, RateCard, Loan, Lease)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Borrower acting on a Loan/Lease/Payment/LeaseEndSettlement must own it (X-User-ID == contract.customer_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "POST /loans/{id}/payments, POST /loans/{id}/payoff, POST /lease-end-settlements"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enum members valid; fico_score in 300..850; integer cents non-negative"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 6
    category: business_constraint
    check: "Customer.email unique across customers; Vehicle.vin unique across vehicles"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /customers, POST /vehicles"

  - priority: 7
    category: business_constraint
    check: "An active RateCard exists at Loan/Lease origination"
    error_id: ERR_NO_ACTIVE_RATE_CARD
    http_status: 409
    applies_to: "POST /loans, POST /leases"

  - priority: 8
    category: business_referential
    check: "Vehicle.status == AVAILABLE at origination (cannot finance a vehicle already financed)"
    error_id: ERR_VEHICLE_UNAVAILABLE
    http_status: 409
    applies_to: "POST /loans, POST /leases"

  - priority: 9
    category: state
    check: "Target Loan/Lease is in a state that permits the requested transition"
    error_id: ERR_LOAN_NOT_PAYABLE
    http_status: 409
    applies_to: "POST /loans/{id}/payments, POST /loans/{id}/miss-payment, POST /loans/{id}/default, POST /loans/{id}/payoff"

  - priority: 10
    category: state
    check: "Lease is in a state that permits the requested transition (mature requires ACTIVE; election requires MATURING)"
    error_id: ERR_LEASE_NOT_ELECTABLE
    http_status: 409
    applies_to: "POST /leases/{id}/mature, POST /lease-end-settlements"

  - priority: 11
    category: business_temporal
    check: "OCC: expected_loan_version / expected_lease_version equals the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /loans/{id}/payoff, POST /lease-end-settlements"

  - priority: 12
    category: business_safety
    check: "declare-default requires missed_payment_count >= DEFAULT_THRESHOLD"
    error_id: ERR_DEFAULT_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /loans/{id}/default"

  - priority: 13
    category: business_fiscal
    check: "Scheduled/cure payment amount_cents must equal monthly_payment_cents"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /loans/{id}/payments"

  - priority: 14
    category: business_fiscal
    check: "Early-payoff amount_cents must equal the ACTUARIAL payoff quote"
    error_id: ERR_PAYOFF_AMOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /loans/{id}/payoff"

  - priority: 15
    category: business_constraint
    check: "RETURN election requires per_year_excess_miles of length term_months/12; RENEW requires renew_term_months > 0"
    error_id: ERR_MILEAGE_SCHEDULE_INVALID
    http_status: 422
    applies_to: "POST /lease-end-settlements"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Customer ----
  - method: POST
    path: "/customers"
    description: "Register a borrower"
    roles: [FinanceManager]
    code: 201
    input: [full_name, email, fico_score]
    output: Customer
    side_effects: ["fico_tier computed against the active RateCard"]

  - method: GET
    path: "/customers/{id}"
    description: "Fetch a customer"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/customers"
    description: "List customers (paginated)"
    roles: [FinanceManager, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/customers/{id}/loans"
    description: "List a customer's loans (FK reverse-reachability for Loan.customer_id)"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: GET
    path: "/customers/{id}/leases"
    description: "List a customer's leases (FK reverse-reachability for Lease.customer_id)"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Lease[]
    side_effects: []

  # ---- Vehicle ----
  - method: POST
    path: "/vehicles"
    description: "Add a vehicle to the fleet"
    roles: [FinanceManager]
    code: 201
    input: [vin, make_model, msrp_cents, sale_price_cents, residual_value_cents]
    output: Vehicle
    side_effects: ["status defaults to AVAILABLE"]

  - method: GET
    path: "/vehicles/{id}"
    description: "Fetch a vehicle (status reflects FINANCED/AVAILABLE)"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles (paginated; filter by status)"
    roles: [FinanceManager, Auditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # ---- RateCard ----
  - method: POST
    path: "/rate-cards"
    description: "Create a rate card"
    roles: [FinanceManager]
    code: 201
    input: [name, tier_1_min_fico, tier_2_min_fico, tier_3_min_fico, tier_1_apr, tier_2_apr, tier_3_apr, tier_4_apr, lease_money_factor, default_rate_apr, lease_tax_rate]
    output: RateCard
    side_effects: ["active defaults to false"]

  - method: POST
    path: "/rate-cards/{id}/activate"
    description: "Make this the active rate card (deactivates any previously active one)"
    roles: [FinanceManager]
    code: 200
    input: []
    output: RateCard
    side_effects: ["sets active=true on this card; sets active=false on the previously active card (CASCADE)"]

  - method: GET
    path: "/rate-cards/{id}"
    description: "Fetch a rate card"
    roles: [FinanceManager, Auditor]
    code: 200
    input: []
    output: RateCard
    side_effects: []

  - method: GET
    path: "/rate-cards"
    description: "List rate cards (paginated; filter by active)"
    roles: [FinanceManager, Auditor]
    code: 200
    input: ["active?", "limit?", "offset?"]
    output: RateCard[]
    side_effects: []

  # ---- Loan ----
  - method: POST
    path: "/loans"
    description: "Originate an auto loan"
    roles: [FinanceManager]
    code: 201
    input: [customer_id, vehicle_id, down_payment_cents, term_months, "gap_insurance?"]
    output: Loan
    side_effects:
      - "rate_card_id pinned to the active card; apr selected by customer_fico_tier"
      - "financed_principal_cents, monthly_payment_cents computed (calc loan_monthly_payment)"
      - "principal_balance_cents initialized to financed_principal_cents; status=CURRENT"
      - "associated Vehicle.status set to FINANCED (CASCADE)"

  - method: GET
    path: "/loans"
    description: "List loans (paginated); filterable by customer_id, vehicle_id, rate_card_id — FK reverse-reachability for Loan's FKs"
    roles: [FinanceManager, Auditor]
    code: 200
    input: ["customer_id?", "vehicle_id?", "rate_card_id?", "limit?", "offset?"]
    output: Loan[]
    side_effects: []

  - method: GET
    path: "/loans/{id}"
    description: "Fetch a loan with computed balances"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: []
    output: Loan
    side_effects: []

  - method: GET
    path: "/loans/{id}/payoff-quote"
    description: "Computed read: actuarial and gross payoff quotes for the loan"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: []
    output: "{ actuarial_payoff_cents: integer, gross_payoff_cents: integer, unearned_interest_cents: integer, loan_version: integer }"
    side_effects: []

  - method: GET
    path: "/loans/{id}/payments"
    description: "List payments for a loan (FK reverse-reachability for Payment.loan_id)"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/loans/{id}/payments"
    description: "Record a scheduled payment (also cures a delinquent loan)"
    roles: [Borrower]
    code: 201
    input: [amount_cents, kind]
    output: Payment
    side_effects:
      - "create Payment; payments_made_count++; principal_balance_cents recomputed"
      - "if loan was DELINQUENT: status->CURRENT, missed_payment_count reset to 0, late_fee assessed (calc loan_late_fee)"

  - method: POST
    path: "/loans/{id}/miss-payment"
    description: "Mark a scheduled payment missed (CURRENT->DELINQUENT or DELINQUENT->DELINQUENT)"
    roles: [FinanceManager]
    code: 201
    input: []
    output: Payment
    side_effects: ["create Payment(status=MISSED); missed_payment_count++; status->DELINQUENT"]

  - method: POST
    path: "/loans/{id}/default"
    description: "Declare default on a delinquent loan"
    roles: [FinanceManager]
    code: 200
    input: [insurance_settlement_cents]
    output: Loan
    side_effects:
      - "status->DEFAULT; associated Vehicle.status->AVAILABLE (CASCADE)"
      - "gap deficiency waiver invariant applied if gap_insurance (calc gap_deficiency_waiver)"

  - method: POST
    path: "/loans/{id}/payoff"
    description: "Early-payoff a current loan (OCC-guarded)"
    roles: [Borrower]
    code: 200
    input: [amount_cents, expected_loan_version]
    output: Loan
    side_effects:
      - "validates amount_cents == actuarial payoff quote; create Payment(kind=PAYOFF)"
      - "principal_balance_cents->0; status->PAID_OFF; Vehicle.status->AVAILABLE (CASCADE)"
      - "increments Loan.version by 1"

  # ---- Lease ----
  - method: POST
    path: "/leases"
    description: "Originate a lease"
    roles: [FinanceManager]
    code: 201
    input: [customer_id, vehicle_id, down_payment_cents, term_months, annual_mileage_allowance, per_mile_overage_rate_cents, disposition_fee_cents, purchase_option_fee_cents, "gap_insurance?"]
    output: Lease
    side_effects:
      - "rate_card_id pinned to active card; adjusted_cap_cost_cents, base_monthly_cents, monthly_payment_cents computed (calc lease_monthly_payment)"
      - "status=ACTIVE; associated Vehicle.status set to FINANCED (CASCADE)"

  - method: GET
    path: "/leases"
    description: "List leases (paginated); filterable by customer_id, vehicle_id, rate_card_id — FK reverse-reachability for Lease's FKs"
    roles: [FinanceManager, Auditor]
    code: 200
    input: ["customer_id?", "vehicle_id?", "rate_card_id?", "limit?", "offset?"]
    output: Lease[]
    side_effects: []

  - method: GET
    path: "/leases/{id}"
    description: "Fetch a lease"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: []
    output: Lease
    side_effects: []

  - method: POST
    path: "/leases/{id}/mature"
    description: "Move an active lease to MATURING (eligible for lease-end election)"
    roles: [FinanceManager]
    code: 200
    input: []
    output: Lease
    side_effects: ["status ACTIVE->MATURING"]

  - method: GET
    path: "/leases/{id}/settlements"
    description: "List settlements for a lease (FK reverse-reachability for LeaseEndSettlement.lease_id)"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: LeaseEndSettlement[]
    side_effects: []

  # ---- LeaseEndSettlement ----
  - method: POST
    path: "/lease-end-settlements"
    description: "Elect lease end (RETURN/PURCHASE/RENEW); computes and finalizes the settlement (OCC-guarded)"
    roles: [Borrower]
    code: 201
    input: [lease_id, election, odometer_miles, expected_lease_version, "per_year_excess_miles?", "renew_term_months?"]
    output: LeaseEndSettlement
    side_effects:
      - "branch RETURN: mileage_overage_cents (calc lease_mileage_overage), disposition_charge_cents, total_due_cents; Lease->RETURNED->SETTLED; Vehicle.status->AVAILABLE (CASCADE)"
      - "branch PURCHASE: purchase_amount_cents=residual+purchase fee; Lease->PURCHASED->SETTLED"
      - "branch RENEW: mint new ACTIVE Lease on same Vehicle (renewed_lease_id), total_due_cents=0; Lease->RENEWED->SETTLED"
      - "increments Lease.version by 1"

  - method: GET
    path: "/lease-end-settlements/{id}"
    description: "Fetch a finalized settlement"
    roles: [FinanceManager, Borrower, Auditor]
    code: 200
    input: []
    output: LeaseEndSettlement
    side_effects: []

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid auth headers or unknown role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or Borrower acting on a contract they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced Customer/Vehicle/RateCard/Loan/Lease/Settlement does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/ill-typed field, bad enum, fico out of 300..850, negative cents" }
  - { id: ERR_DUPLICATE_RESOURCE, http: 409, condition: "Customer.email or Vehicle.vin already exists" }
  - { id: ERR_NO_ACTIVE_RATE_CARD, http: 409, condition: "Loan/Lease origination with no active RateCard" }
  - { id: ERR_VEHICLE_UNAVAILABLE, http: 409, condition: "Origination against a vehicle whose status != AVAILABLE" }
  - { id: ERR_LOAN_NOT_PAYABLE, http: 409, condition: "Loan transition attempted from a state that disallows it" }
  - { id: ERR_LOAN_TERM_COMPLETE, http: 409, condition: "Scheduled payment when payments_made_count == term_months" }
  - { id: ERR_LEASE_NOT_MATURABLE, http: 409, condition: "Mature attempted on a lease not in ACTIVE" }
  - { id: ERR_LEASE_NOT_ELECTABLE, http: 409, condition: "Lease-end election attempted on a lease not in MATURING" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match current parent version" }
  - { id: ERR_DEFAULT_THRESHOLD_NOT_MET, http: 409, condition: "declare-default when missed_payment_count < DEFAULT_THRESHOLD" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 409, condition: "Scheduled/cure payment amount_cents != monthly_payment_cents" }
  - { id: ERR_PAYOFF_AMOUNT_MISMATCH, http: 409, condition: "Early-payoff amount_cents != actuarial payoff quote" }
  - { id: ERR_MILEAGE_SCHEDULE_INVALID, http: 422, condition: "RETURN missing/wrong-length per_year_excess_miles, or RENEW missing renew_term_months>0" }
  - { id: ERR_RENEW_TERM_INVALID, http: 422, condition: "RENEW election with renew_term_months absent or <= 0" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: FinanceManager
    description: "Dealer finance operator: manages rate cards, vehicles, customers, originates contracts, services delinquency"
    identity: opaque
    exclusive_operations:
      - "POST /customers"
      - "POST /vehicles"
      - "POST /rate-cards"
      - "POST /rate-cards/{id}/activate"
      - "POST /loans"
      - "POST /leases"
      - "POST /loans/{id}/miss-payment"
      - "POST /loans/{id}/default"
      - "POST /leases/{id}/mature"
    shared_operations:
      - "GET (all read endpoints)"

  - name: Borrower
    description: "The customer/lessee; makes payments, pays off, and elects lease-end options on their own contracts only"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /loans/{id}/payments"
      - "POST /loans/{id}/payoff"
      - "POST /lease-end-settlements"
    shared_operations:
      - "GET own /customers/{id}, /loans/{id}, /leases/{id}, sub-resource lists"

  - name: Auditor
    description: "Read-only compliance reviewer with full read access, no write power"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET (all read endpoints)"

constants_global:
  DEFAULT_THRESHOLD: 3   # missed_payment_count required to permit declare-default
