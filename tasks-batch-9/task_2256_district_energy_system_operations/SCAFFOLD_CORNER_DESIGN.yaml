  - section: Cross-Cutting Complexity Layers
    instances:
      - name: a_loop_version_read_before_an_activation_is_stale_for_plan_creation
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[dispatch-plan-create-stale-loop]
          - validations[priority 7 ERR_STALE_LOOP_VERSION]
          - endpoints[POST /district-energy/dispatch-plans]
        distinguishing_aspect: "The loop version is bumped by writes the plan author never issued — activating an agreement moves committed_reserved_kw and the version with it — so a client that read the loop before the activation is refused with 412 and must re-read; the refusal creates no plan at all, and the accepted retry with the refreshed version then advances the plan's own version once per optimize."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-K registered, its version read once before any dependent write."
            - "Agreement CK1 (UNIVERSITY, reserved 1000.0) activated after that read, which bumps NetworkLoop.version."
            - "A PUBLISHED forecast on the loop with coincident_demand_kw 756.00 and two eligible assets."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-K", name: "Kingsway Loop K", service_mode: "HEATING", design_supply_temp_c: 90.0, max_pressure_kpa: 1400.0, rated_capacity_kw: 6000.0 }
              as: SystemController
              captures: { loop_k_id: $.data.id, loop_k_v_create: $.data.version, loop_k_reserved_0: $.data.committed_reserved_kw }
            - call: "GET /district-energy/network-loops/${loop_k_id}"
