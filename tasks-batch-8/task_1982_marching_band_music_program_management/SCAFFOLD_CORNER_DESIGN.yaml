            - { call: "POST /band/arrangements/${arr_c}/approve", payload: {}, as: BandDirector, as_user_id: "dir-2" }
          trigger:
            - { call: "POST /band/arrangements/${arr_b}/purchase", payload: {}, as: BoosterTreasurer }
