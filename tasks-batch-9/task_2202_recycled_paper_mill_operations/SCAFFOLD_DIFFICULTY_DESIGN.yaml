            - { call: "POST /pulp-batches/${pb_id}/deink", payload: { caustic_kg: 40.0, peroxide_kg: 25.0, surfactant_kg: 6.0 }, as: MachineOperator, as_user_id: "mo_2" }
            - { call: "POST /pulp-batches/${pb_id}/brightness", payload: { brightness_iso: 70.0 }, as: QualityLab, as_user_id: "ql_cert" }
