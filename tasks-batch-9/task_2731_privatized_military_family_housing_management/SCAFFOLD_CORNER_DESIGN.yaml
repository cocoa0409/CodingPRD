            - "${h5_sev} == SEVERITY_3 - 15 ppm has reached the LEAD_WATER top band, proving the water ladder is not the paint ladder"
            - "${h5_disp} == true and ${h5_status} == DISPLACEMENT_ACTIVE, and ${h5_child} == false - severity alone triggered the displacement branch"

      - name: provisional_and_final_gross_rent_disagree_on_the_same_application
        claim_type: variant_divergence
        grounds:
          - calculations.gross_rent_determination
          - entities.Lease.fields.gross_rent_cents
        excluded_because:
          difficulty_instance: lease_gross_rent_provisional_vs_final_divergence
          rationale: "The two variants of the rent rule differ only when the BahRate effective_year changes between the offer instant and the move-in instant, which is a depth-probe fixture: the difficulty instance already builds the two rate rows and pins both the OFFER_PROVISIONAL and MOVE_IN_FINAL figures on one application."

      - name: occupancy_basis_selects_which_variant_the_metrics_run_uses
        claim_type: variant_selection
        grounds:
          - calculations.occupancy_rate_determination
          - entities.ReinvestmentAccount.fields.occupancy_basis
        excluded_because:
          difficulty_instance: occupancy_rate_unit_day_vs_month_end_divergence
          rationale: "Selection is only observable against a divergent fixture - two accounts on the same installation, one UNIT_DAY_WEIGHTED and one MONTH_END_SNAPSHOT, over a month containing a mid-month move-in - which the difficulty instance builds in full."

      - name: the_stored_rent_reconciles_with_the_variant_that_produced_it
        claim_type: reconciliation
        grounds:
          - calculations.gross_rent_determination
          - entities.Lease.fields.rent_basis
        excluded_because:
          difficulty_instance: lease_gross_rent_provisional_vs_final_divergence
          rationale: "Reconciling the stored rent against its declared basis variant requires the same two-rate-row fixture and the same move-in re-derivation as the divergence probe, so it is folded into the depth instance rather than duplicated here."

      - name: early_termination_fee_picks_its_rate_from_the_tier_break
        claim_type: tiered_pricing
        grounds:
          - calculations.early_termination_settlement
          - errors[ERR_NOTICE_PERIOD_TOO_SHORT]
        excluded_because:
          difficulty_instance: early_termination_fee_tier_keyed_on_credit_reduced_base
          rationale: "The tier break at 100000 cents is only interesting when a dispute credit moves the fee base across it, which needs a resolved dispute plus a five-step ordering assertion; the difficulty instance pins both sides of the break on one lease."

      - name: lodging_intervals_merge_as_half_open_ranges
        claim_type: interval_merge
        grounds:
          - calculations.displacement_lodging_authorization
          - errors[ERR_LODGING_INTERVAL_OVERLAP]
        excluded_because:
          difficulty_instance: lodging_half_open_intervals_allow_adjacency_reject_containment
          rationale: "Half-open interval semantics need the adjacency, containment and straddle cases side by side on one lease to be distinguishable from closed-interval arithmetic, and the difficulty instance already enumerates them."

      - name: the_ledger_balance_equals_the_sum_of_its_rows
        claim_type: aggregation
        grounds:
          - calculations.allotment_ledger_conservation
          - entities.Lease.fields.allotment_balance_cents
        excluded_because:
          difficulty_instance: hazard_void_restores_allotment_ledger_without_drift
          rationale: "The conservation invariant only bites after a compensating reversal has posted equal and opposite rows, so it is probed by the void instance in the difficulty design rather than by a flat sum here."


  # =========================================================================
  # VALIDATIONS - the §1.4 ladder. Each instance drives one rung to its
  # error and, where the same request can be repaired, immediately past it
  # to the success path. The two depth-probe orderings (a priority conflict
  # between two live rungs, and a cascade of dependent checks) are stubs.
  # =========================================================================
  - section: validations
    instances:

      - name: the_ladder_reports_the_highest_broken_rung_not_the_worst_problem
        claim_type: priority_ordering
        grounds:
          - validations[priority=1]
          - validations[priority=2]
          - validations[priority=3]
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED_ROLE]
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_INSTALLATION_NOT_FOUND]
        distinguishing_aspect: "One request body breaks three rungs at once - it is unauthenticated, it names a bedroom_count of 9 outside the declared 1..5 range, and it points at an installation that does not exist - and the ladder is walked from the top: the same body returns 401, then 403 once a role is supplied, then 400 once the role is permitted, then 404 once the shape is legal, and only then 201."
        test_recipe:
          setup:
            - "One installation with the declared defaults."
            - "The logical clock stands at 2026-08-01T00:00:00Z, which is the mandatory startup default."
            - "No housing unit exists, and the literal id inst_00000000 belongs to no installation."
          setup_api_calls:
            - call: "POST /installations"
              payload: { name: "Fort Cavazos Family Housing", branch: "ARMY", mha_code: "TX-FTC", bill_of_rights_version: "2026.1" }
              as: PlatformAdmin
              captures: { inst_id: "$.data.id" }
          trigger:
            - call: "POST /housing-units"
              payload: { installation_id: "inst_00000000", unit_code: "Z-999", bedroom_count: 9, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED" }
              as: Anonymous
              captures: { v1_e1: "$.data.error_id" }
            - call: "POST /housing-units"
              payload: { installation_id: "inst_00000000", unit_code: "Z-999", bedroom_count: 9, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED" }
              as: MaintenanceTech
              captures: { v1_e2: "$.data.error_id" }
            - call: "POST /housing-units"
              payload: { installation_id: "inst_00000000", unit_code: "Z-999", bedroom_count: 9, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED" }
              as: PlatformAdmin
              captures: { v1_e3: "$.data.error_id" }
            - call: "POST /housing-units"
              payload: { installation_id: "inst_00000000", unit_code: "Z-999", bedroom_count: 3, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED" }
              as: PlatformAdmin
              captures: { v1_e4: "$.data.error_id" }
            - call: "POST /housing-units"
              payload: { installation_id: "${inst_id}", unit_code: "Z-999", bedroom_count: 3, unit_type: "TOWNHOME", designated_rank_category: "JUNIOR_ENLISTED" }
              as: PlatformAdmin
              captures: { v1_unit: "$.data.id", v1_status: "$.data.status" }
          assert:
            - "the first call returns HTTP 401 with ${v1_e1} == ERR_UNAUTHENTICATED - priority 1 outranks both the shape rung and the existence rung"
            - "the second call returns HTTP 403 with ${v1_e2} == ERR_UNAUTHORIZED_ROLE - MaintenanceTech is not in the endpoint roles, and this is reported before the malformed body"
            - "the third call returns HTTP 400 with ${v1_e3} == ERR_INVALID_REQUEST - bedroom_count 9 violates the 1..5 constraint, and this is reported before the missing installation"
            - "the fourth call returns HTTP 404 with ${v1_e4} == ERR_INSTALLATION_NOT_FOUND - only once the shape is legal does the ladder reach the body reference"
            - "the fifth call returns HTTP 201 with ${v1_status} == AVAILABLE and a non-null ${v1_unit}"

