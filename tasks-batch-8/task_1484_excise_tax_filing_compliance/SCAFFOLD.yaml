# =============================================================================
# Excise Tax Filing & Compliance — benchmark seed tables (v1)
# Generated per prd-bench-scaffold-generator SKILL.md
# =============================================================================

scenario: |
  Excise Tax Filing & Compliance (excise tax compliance team): taxable activity & product identification, rate determination by jurisdiction & product class, exemption certificate & bonded movement documentation, return preparation & deposit schedule, credit/refund claim (bad debt/export), registration & bond requirement maintenance, audit support & records retention, rate change monitoring & system update

domain_name: excise-tax-filing-compliance
api_prefix: ""   # flat topology: peer collections at root (/registrants, /taxable-events, ...), FK-linked; no global root resource

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - dual_variant_calculation
    - optimistic_concurrency
    - version_pinning_on_approval
    - cascading_side_effects
  entity_topology: flat          # peer entities with FK references; no URL nesting
  state_machine_shape: cyclic    # re-rate loops, amendment loops, claim resubmission loops; TaxReturn additionally carries parallel dimensions
  relationship_patterns:
    - one_to_many
    - self_referential           # TaxReturn.amendment_of_id; TaxRate.supersedes_rate_id
    - cross_aggregate            # events reference certificates/movements; claims reference returns+events
  role_model: segregation_of_duties   # preparer != filer, claimant != approver; ComplianceAdmin override still bound by SoD
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat; FK annotations on children)
# =============================================================================
entities:
  - name: Registrant
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Taxpayer legal name" }
      - { name: fein, type: string, source: input, description: "Federal employer identification number; unique across registrants" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | CANCELLED", default: ACTIVE }
      - { name: aggregate_open_liability_cents, type: integer, source: computed, default: 0, description: "Sum of taxable_tax_cents over returns with filing_status IN {DRAFT, SUBMITTED} plus net_due_cents over returns with filing_status == FILED and settlement_status == AWAITING_PAYMENT" }
      - { name: overpayment_balance_cents, type: integer, source: computed, default: 0, description: "Unrefunded excess cash from deposit over-application and applied credits beyond net due" }

  - name: Jurisdiction
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Authority code, unique (e.g. US-TTB, CA-BOE)" }
      - { name: name, type: string, source: input, description: "Display name" }
      - { name: level, type: enum, source: input, description: "FEDERAL | STATE | LOCAL" }
      - { name: return_frequency, type: enum, source: input, description: "MONTHLY (period key YYYY-MM) | QUARTERLY (period key YYYY-Qn)" }
      - { name: deposit_frequency, type: enum, source: input, description: "SEMI_MONTHLY (windows A=days1-15, B=days16-end) | MONTHLY (single window M)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: ProductClass
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Product class code, unique (e.g. DIESEL, GASOLINE, SPIRITS)" }
      - { name: description, type: string, source: input, description: "What belongs to the class" }
      - { name: base_unit, type: enum, source: input, description: "GALLON | PROOF_GALLON | PACK | UNIT" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED", default: ACTIVE }

  - name: TaxRate
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: product_class_id, type: string, source: input, description: "FK -> ProductClass.id" }
      - { name: rate_millicents_per_unit, type: integer, source: input, description: "Rate in milli-cents (1/1000 cent) per base unit; e.g. 24.3 cents/gal = 24300" }
      - { name: effective_from, type: datetime, source: input, description: "Window start, inclusive (half-open window)" }
      - { name: effective_to, type: datetime, source: input, description: "Window end, exclusive; null = open-ended", default: null }
      - { name: source_notice_id, type: string, source: system, description: "FK -> RateChangeNotice.id; null for directly-created initial rates", default: null }
      - { name: supersedes_rate_id, type: string, source: system, description: "FK -> TaxRate.id; the rate this one replaced at application time", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED (effective_from > now) | ACTIVE (window contains now) | SUPERSEDED (clamped by a newer rate) | RETIRED (effective_to <= now)", default: SCHEDULED }

  - name: RateChangeNotice
    parent: null
    common_fields: true
    fields:
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: product_class_id, type: string, source: input, description: "FK -> ProductClass.id" }
      - { name: new_rate_millicents_per_unit, type: integer, source: input, description: "Announced new rate in milli-cents per unit" }
      - { name: announced_effective_from, type: datetime, source: input, description: "Announced start date; may be in the past (retroactive) or future" }
      - { name: source_reference, type: string, source: input, description: "Bulletin / statute reference" }
      - { name: detected_at, type: datetime, source: system, description: "Logical clock time when the notice was recorded" }
      - { name: applied_rate_id, type: string, source: system, description: "FK -> TaxRate.id created by apply; null until applied", default: null }
      - { name: status, type: enum, source: system, description: "DETECTED | VALIDATED | REJECTED | APPLIED", default: DETECTED }

  - name: Registration
    parent: null
    common_fields: true
    fields:
      - { name: registrant_id, type: string, source: input, description: "FK -> Registrant.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: registration_number, type: string, source: system, description: "Minted at activation: REG-<jurisdiction_code>-<seq>", default: null }
      - { name: deposit_method, type: enum, source: input, description: "SAFE_HARBOR | ACTUAL; elected deposit computation method" }
      - { name: status, type: enum, source: system, description: "PENDING | ACTIVE | BOND_DEFICIENT | SUSPENDED | REVOKED", default: PENDING }
      - { name: bond_required_cents, type: integer, source: computed, default: 1000000, description: "Current bond requirement per bond_requirement calculation" }
      - { name: bond_coverage_cents, type: integer, source: computed, default: 0, description: "Sum of principal_amount_cents over bonds with status == ACTIVE for this registration" }
      - { name: requirement_variant, type: enum, source: computed, description: "STANDARD | AGGRAVATED — which bond_requirement variant currently applies", default: STANDARD }

  - name: Bond
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id" }
      - { name: surety_name, type: string, source: input, description: "Surety company name" }
      - { name: principal_amount_cents, type: integer, source: input, description: "Bond face amount" }
      - { name: effective_from, type: datetime, source: input, description: "Coverage window start (inclusive)" }
      - { name: effective_to, type: datetime, source: input, description: "Coverage window end (inclusive date)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CANCELLED | EXPIRED", default: DRAFT }

  - name: ExemptionCertificate
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id (jurisdiction implied by registration)" }
      - { name: product_class_id, type: string, source: input, description: "FK -> ProductClass.id; null = covers all product classes", default: null }
      - { name: customer_reference, type: string, source: input, description: "Buyer reference the certificate covers" }
      - { name: certificate_type, type: enum, source: input, description: "RESALE | GOVERNMENT | EXPORT" }
      - { name: valid_from, type: datetime, source: input, description: "Validity window start, INCLUSIVE (closed interval)" }
      - { name: valid_to, type: datetime, source: input, description: "Validity window end, INCLUSIVE (closed interval)" }
      - { name: status, type: enum, source: system, description: "PENDING_VERIFICATION | ACTIVE | REJECTED | REVOKED | EXPIRED", default: PENDING_VERIFICATION }

  - name: BondedMovement
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id" }
      - { name: bond_id, type: string, source: input, description: "FK -> Bond.id; bond must belong to the same registration" }
      - { name: product_class_id, type: string, source: input, description: "FK -> ProductClass.id" }
      - { name: quantity_units, type: integer, source: input, description: "Units placed under bond" }
      - { name: origin_facility, type: string, source: input, description: "Origin bonded facility" }
      - { name: destination_facility, type: string, source: input, description: "Destination bonded facility" }
      - { name: transit_deadline_days, type: integer, source: input, default: 30, description: "Max days between dispatch and receipt before default" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical clock time at dispatch", default: null }
      - { name: received_at, type: datetime, source: system, description: "Logical clock time at receipt", default: null }
      - { name: quantity_received_units, type: integer, source: system, description: "Units confirmed received; null until receipt", default: null }
      - { name: defaulted_quantity_units, type: integer, source: system, default: 0, description: "Units whose tax suspension was lost (full or shortfall default)" }
      - { name: status, type: enum, source: system, description: "INITIATED | IN_TRANSIT | RECEIVED | DISCHARGED | PARTIAL_DEFAULT | DEFAULTED", default: INITIATED }

  - name: TaxableEvent
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id; must equal registration.jurisdiction_id" }
      - { name: product_class_id, type: string, source: input, description: "FK -> ProductClass.id" }
      - { name: event_date, type: datetime, source: input, description: "Date of the taxable removal/sale/use; determines rate window and period" }
      - { name: quantity_units, type: integer, source: input, description: "Quantity in the product class base unit; must be >= 1" }
      - { name: customer_reference, type: string, source: input, description: "Buyer reference; required for exemption certificate application", default: null }
      - { name: is_export, type: boolean, source: input, default: false, description: "Whether the goods were exported (export credit eligibility)" }
      - { name: period, type: string, source: computed, description: "Period key derived from event_date and the jurisdiction return_frequency (YYYY-MM or YYYY-Qn)" }
      - { name: determination, type: enum, source: system, description: "STANDARD | DEFAULT_ASSESSMENT", default: STANDARD }
      - { name: exemption_certificate_id, type: string, source: system, description: "FK -> ExemptionCertificate.id applied at rating; null if none", default: null }
      - { name: bonded_movement_id, type: string, source: system, description: "FK -> BondedMovement.id applied at rating (tax suspension); null if none", default: null }
      - { name: gross_tax_cents, type: integer, source: computed, default: 0, description: "Pre-exemption tax: round_half_up(quantity_units x rate_millicents_per_unit / 1000) with the STANDARD (non-punitive) rate" }
      - { name: tax_cents, type: integer, source: computed, default: 0, description: "Post-exemption / post-suspension tax actually due for this event (0 when exempt or in-bond)" }
      - { name: return_id, type: string, source: system, description: "FK -> TaxReturn.id of the return currently containing this event; null until rated", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | CLASSIFIED | RATED | RETURNED | ADJUSTED | VOIDED", default: DRAFT }

  - name: TaxReturn
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: period, type: string, source: input, description: "Period key matching jurisdiction frequency (YYYY-MM or YYYY-Qn)" }
      - { name: amendment_of_id, type: string, source: system, description: "FK -> TaxReturn.id; null for the original return, parent id for an amendment", default: null }
      - { name: amendment_sequence, type: integer, source: system, default: 0, description: "0 = original; 1..n = amendment depth" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID recorded at submit; segregation-of-duties anchor", default: null }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID recorded at filing", default: null }
      - { name: due_date, type: datetime, source: computed, description: "First day of the month after period end + 24 days (25th of the following month for MONTHLY)" }
      - { name: filed_at, type: datetime, source: system, description: "Logical clock time of filing", default: null }
      - { name: event_count, type: integer, source: computed, default: 0, description: "Number of included events with status IN {RATED, RETURNED, ADJUSTED}" }
      - { name: gross_tax_cents, type: integer, source: computed, default: 0, description: "Sum of event.gross_tax_cents over included events" }
      - { name: exempted_cents, type: integer, source: computed, default: 0, description: "Sum of (gross_tax_cents - tax_cents) over included events (exemptions + bonded suspensions)" }
      - { name: taxable_tax_cents, type: integer, source: computed, default: 0, description: "Sum of event.tax_cents over included events" }
      - { name: credits_cents, type: integer, source: computed, default: 0, description: "Sum of (applied_cents - reversed_cents) over claims on this return chain with status IN {APPLIED, REVERSED}" }
      - { name: deposits_applied_cents, type: integer, source: computed, default: 0, description: "Cash from PAID deposits applied at filing (waterfall); carried forward to amendments" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Late-filing + deposit-underpayment penalties computed at filing (pinned order, see return_settlement)" }
      - { name: net_due_cents, type: integer, source: computed, default: 0, description: "taxable_tax_cents - credits_cents - deposits_applied_cents + penalty_cents (may be negative = overpaid)" }
      - { name: pinned_rate_snapshot, type: array, source: system, default: [], description: "At filing: list of {product_class_id, tax_rate_id, rate_millicents_per_unit} actually used; immutable once filed" }
      - { name: filing_status, type: enum, source: system, description: "DRAFT | SUBMITTED | FILED | SUPERSEDED", default: DRAFT }
      - { name: settlement_status, type: enum, source: system, description: "UNFILED | AWAITING_PAYMENT | SETTLED | OVERPAID", default: UNFILED }

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: system, description: "FK -> Registration.id" }
      - { name: jurisdiction_id, type: string, source: system, description: "FK -> Jurisdiction.id" }
      - { name: period, type: string, source: system, description: "Return period key this deposit funds" }
      - { name: window, type: enum, source: system, description: "A (days 1-15) | B (days 16-end) for SEMI_MONTHLY; M for MONTHLY" }
      - { name: scheduled_amount_cents, type: integer, source: computed, description: "Required amount per deposit_schedule calculation (SAFE_HARBOR known at creation; ACTUAL filled by window-close sweep)" }
      - { name: due_date, type: datetime, source: computed, description: "Window A -> 25th of same month; window B -> 10th of next month; window M -> 25th of same month" }
      - { name: paid_amount_cents, type: integer, source: system, default: null, description: "Amount actually paid; null until paid" }
      - { name: paid_at, type: datetime, source: system, default: null, description: "Logical clock time of payment" }
      - { name: penalty_cents, type: integer, source: computed, default: 0, description: "Late-payment penalty computed at pay time per late_deposit_penalty" }
      - { name: applied_amount_cents, type: integer, source: system, default: 0, description: "Portion of paid_amount_cents applied to the filed return" }
      - { name: applied_return_id, type: string, source: system, description: "FK -> TaxReturn.id the deposit was applied to; null until filing", default: null }
      - { name: status, type: enum, source: system, description: "SCHEDULED | LATE | PAID | APPLIED | WAIVED", default: SCHEDULED }

  - name: CreditClaim
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id" }
      - { name: return_id, type: string, source: input, description: "FK -> TaxReturn.id of the FILED return whose tax the claim refunds" }
      - { name: claim_type, type: enum, source: input, description: "BAD_DEBT | EXPORT" }
      - { name: claimed_cents, type: integer, source: input, description: "Amount requested" }
      - { name: event_ids, type: array, source: input, description: "Supporting TaxableEvent ids (all must belong to the same registration/jurisdiction/period chain)" }
      - { name: justification, type: string, source: input, description: "Free-text justification / document references" }
      - { name: submitted_by_user_id, type: string, source: system, description: "X-User-ID at submit; SoD anchor", default: null }
      - { name: reviewed_by_user_id, type: string, source: system, description: "X-User-ID at approve/deny", default: null }
      - { name: eligible_cents, type: integer, source: computed, default: 0, description: "Per export_credit_calculation / bad_debt_credit_calculation at submit time" }
      - { name: approved_cents, type: integer, source: system, default: null, description: "Amount approved (<= min(claimed, eligible, CLAIM_CAP))" }
      - { name: applied_cents, type: integer, source: system, default: 0, description: "Amount actually applied to the return" }
      - { name: reversed_cents, type: integer, source: system, default: 0, description: "Amount clawed back via reverse (e.g. bad-debt recovery)" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | DENIED | APPROVED | APPLIED | REVERSED | WITHDRAWN", default: DRAFT }

  - name: AuditCase
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> Registration.id" }
      - { name: jurisdiction_id, type: string, source: input, description: "FK -> Jurisdiction.id" }
      - { name: period_start, type: string, source: input, description: "First covered period key (month bucket YYYY-MM), inclusive" }
      - { name: period_end, type: string, source: input, description: "Last covered period key (month bucket YYYY-MM), inclusive" }
      - { name: records_hold, type: boolean, source: computed, default: true, description: "True while status IN {OPENED, DOCUMENTS_REQUESTED, UNDER_REVIEW}; blocks amendment, returned-event reclassify, claim apply, and purge for covered periods" }
      - { name: assessment_cents, type: integer, source: input, default: null, description: "Additional assessment recorded when closing with outcome ASSESSMENT" }
      - { name: opened_by_user_id, type: string, source: system, description: "X-User-ID of the auditor who opened the case" }
      - { name: status, type: enum, source: system, description: "OPENED | DOCUMENTS_REQUESTED | UNDER_REVIEW | CLOSED_NO_CHANGE | CLOSED_ASSESSMENT", default: OPENED }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Registrant
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when any registration stays BOND_DEFICIENT for more than 30 consecutive days, evaluated by clock sweep)"
        actor: system
        preconditions: []
        side_effects:
          - "All registrations of the registrant with status ACTIVE transition to SUSPENDED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (automatic when no registration remains BOND_DEFICIENT, evaluated by clock sweep or bond/registration mutation)"
        actor: system
        preconditions: []
        side_effects:
          - "Registrations in SUSPENDED with sufficient bond coverage transition to ACTIVE"
      - from: ACTIVE
        to: CANCELLED
        trigger: "system (only reachable when every registration is REVOKED and aggregate_open_liability_cents == 0); no direct endpoint"
        actor: system
        preconditions:
          - "Every Registration of the registrant has status == REVOKED"
          - "aggregate_open_liability_cents == 0"
        side_effects: []

  - entity: Registration
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /registrations/{id}/activate"
        actor: ComplianceAdmin
        preconditions:
          - "bond_coverage_cents >= bond_required_cents (ERR_BOND_INSUFFICIENT)"
        side_effects:
          - "registration_number minted"
      - from: ACTIVE
        to: BOND_DEFICIENT
        trigger: "system (automatic when bond_coverage_cents drops below bond_required_cents: bond cancel/expire or requirement recompute)"
        actor: system
        preconditions: []
        side_effects:
          - "If deficiency persists > 30 days (clock sweep): registrant -> SUSPENDED"
      - from: BOND_DEFICIENT
        to: ACTIVE
        trigger: "POST /registrations/{id}/reinstate OR system (automatic when coverage again >= requirement)"
        actor: ComplianceAdmin | system
        preconditions:
          - "bond_coverage_cents >= bond_required_cents (ERR_BOND_INSUFFICIENT)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /registrations/{id}/suspend OR system (registrant suspension cascades)"
        actor: ComplianceAdmin | system
        preconditions: []
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /registrations/{id}/reinstate"
        actor: ComplianceAdmin
        preconditions:
          - "bond_coverage_cents >= bond_required_cents (ERR_BOND_INSUFFICIENT)"
          - "Registrant status == ACTIVE (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /registrations/{id}/revoke"
        actor: ComplianceAdmin
        preconditions:
          - "No return with filing_status IN {DRAFT, SUBMITTED} and no FILED return with settlement_status == AWAITING_PAYMENT (ERR_REGISTRATION_HAS_OPEN_LIABILITY)"
          - "No AuditCase with records_hold == true (ERR_AUDIT_RECORDS_HOLD)"
        side_effects:
          - "PENDING_VERIFICATION / ACTIVE certificates of this registration -> REVOKED"
          - "INITIATED / IN_TRANSIT movements of this registration -> DEFAULTED (full quantity), with default-assessment cascade suppressed (registration closed)"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /registrations/{id}/revoke"
        actor: ComplianceAdmin
        preconditions:
          - "No return with filing_status IN {DRAFT, SUBMITTED} and no FILED return with settlement_status == AWAITING_PAYMENT (ERR_REGISTRATION_HAS_OPEN_LIABILITY)"
        side_effects: []

  - entity: Bond
    initial_state: DRAFT
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /bonds/{id}/activate"
        actor: ComplianceAdmin
        preconditions:
          - "effective window not fully elapsed: effective_to >= current logical date (ERR_BOND_WINDOW_ELAPSED)"
          - "Registration status IN {PENDING, ACTIVE, BOND_DEFICIENT, SUSPENDED} (ERR_INVALID_STATE)"
        side_effects:
          - "registration.bond_coverage_cents recomputed; registration may flip BOND_DEFICIENT -> ACTIVE"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /bonds/{id}/cancel"
        actor: ComplianceAdmin
        preconditions: []
        side_effects:
          - "registration.bond_coverage_cents recomputed; if coverage < requirement registration -> BOND_DEFICIENT"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep when current date > effective_to)"
        actor: system
        preconditions: []
        side_effects:
          - "registration.bond_coverage_cents recomputed; if coverage < requirement registration -> BOND_DEFICIENT"

  - entity: ExemptionCertificate
    initial_state: PENDING_VERIFICATION
    terminal_states: [REJECTED, REVOKED, EXPIRED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ACTIVE
        trigger: "POST /exemption-certificates/{id}/verify"
        actor: TaxReviewer | ComplianceAdmin
        preconditions: []
        side_effects: []
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /exemption-certificates/{id}/revoke with reject semantics while unverified"
        actor: TaxReviewer | ComplianceAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /exemption-certificates/{id}/revoke"
        actor: TaxReviewer | ComplianceAdmin
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (clock sweep when current date > valid_to)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: BondedMovement
    initial_state: INITIATED
    terminal_states: [DISCHARGED, PARTIAL_DEFAULT, DEFAULTED]
    transitions:
      - from: INITIATED
        to: IN_TRANSIT
        trigger: "POST /bonded-movements/{id}/dispatch"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "Registration status == ACTIVE (ERR_REGISTRATION_NOT_ACTIVE)"
          - "Bond status == ACTIVE (ERR_MOVEMENT_NOT_LINKABLE)"
        side_effects:
          - "dispatched_at = current logical clock"
      - from: IN_TRANSIT
        to: RECEIVED
        trigger: "POST /bonded-movements/{id}/receive"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "0 <= quantity_received_units <= quantity_units (ERR_MOVEMENT_QUANTITY_EXCEEDS)"
        side_effects:
          - "received_at = current logical clock; quantity_received_units recorded"
      - from: RECEIVED
        to: DISCHARGED
        trigger: "POST /bonded-movements/{id}/discharge"
        actor: TaxReviewer | ComplianceAdmin
        preconditions:
          - "quantity_received_units == quantity_units (exact reconciliation; shortfall must be defaulted first)"
        side_effects:
          - "Bond relieved for this movement (no tax assessed; suspension confirmed)"
      - from: IN_TRANSIT
        to: DEFAULTED
        trigger: "POST /bonded-movements/{id}/default OR system (clock sweep: now > dispatched_at + transit_deadline_days)"
        actor: ComplianceAdmin | system
        preconditions: []
        side_effects:
          - "defaulted_quantity_units = quantity_units (full)"
          - "CASCADE link 1: system creates a TaxableEvent (determination=DEFAULT_ASSESSMENT, quantity=quantity_units, event_date=default date, status=RATED) — see event_tax_determination DEFAULT_ASSESSMENT variant"
          - "CASCADE link 2: that event is auto-included into the DRAFT/SUBMITTED return of its period (created if missing) and the return totals recomputed; if the period is locked (latest return FILED, no open amendment) the event stays RATED with return_id null until an amendment pulls it in via add_event_ids"
          - "CASCADE link 3: ACTUAL-method deposits of that period are recomputed; registration bond_requirement recomputed (variant may flip to AGGRAVATED)"
      - from: RECEIVED
        to: PARTIAL_DEFAULT
        trigger: "POST /bonded-movements/{id}/default"
        actor: ComplianceAdmin
        preconditions:
          - "quantity_received_units < quantity_units"
        side_effects:
          - "defaulted_quantity_units = quantity_units - quantity_received_units (shortfall only)"
          - "Same 3-link default-assessment cascade as IN_TRANSIT -> DEFAULTED, over the shortfall quantity"
      - from: INITIATED
        to: DEFAULTED
        trigger: "system (registration revocation cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "defaulted_quantity_units = quantity_units; default-assessment cascade suppressed because registration is REVOKED"

  - entity: TaxableEvent
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: CLASSIFIED
        trigger: "POST /taxable-events/{id}/classify"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "Registration status == ACTIVE (ERR_REGISTRATION_NOT_ACTIVE)"
          - "Product class and jurisdiction pairing is taxable-identified (a rate exists now or historically for the pair, or class is exempt-eligible) (ERR_NO_APPLICABLE_RATE)"
        side_effects: []
      - from: CLASSIFIED
        to: RATED
        trigger: "POST /taxable-events/{id}/rate"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "Registration status == ACTIVE (ERR_REGISTRATION_NOT_ACTIVE)"
          - "Period of event_date not locked: the latest non-superseded return for (registration, jurisdiction, period) has filing_status IN {DRAFT, SUBMITTED}, or an amendment of it is DRAFT/SUBMITTED (ERR_PERIOD_LOCKED)"
          - "Rate window resolution finds exactly one TaxRate whose half-open window contains event_date (ERR_NO_APPLICABLE_RATE)"
          - "If exemption_certificate_id given: certificate status == ACTIVE (ERR_CERTIFICATE_NOT_ACTIVE) and covers event_date/jurisdiction/class/customer (ERR_CERTIFICATE_NOT_APPLICABLE)"
          - "If bonded_movement_id given: movement same registration+class, status IN {IN_TRANSIT, RECEIVED} (ERR_MOVEMENT_NOT_LINKABLE)"
        side_effects:
          - "event_tax_determination computes gross_tax_cents and tax_cents (0 when exempt/suspended)"
          - "Auto-include into the period return: create DRAFT TaxReturn (+ deposit schedule) if none exists; recompute return totals; bumps return.version"
          - "registrant.aggregate_open_liability_cents recomputed"
      - from: RATED
        to: CLASSIFIED
        trigger: "POST /taxable-events/{id}/reclassify (correction loop)"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "Containing return filing_status == DRAFT (ERR_INVALID_STATE when SUBMITTED — withdraw first)"
        side_effects:
          - "tax_cents/gross_tax_cents reset to 0; exemption/movement links cleared; return totals recomputed; return.version bumped"
      - from: RETURNED
        to: ADJUSTED
        trigger: "POST /taxable-events/{id}/reclassify while the event sits in an open amendment (filing_status IN {DRAFT, SUBMITTED})"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "An amendment of the event's return exists with filing_status IN {DRAFT, SUBMITTED} and includes the event (ERR_INVALID_STATE otherwise)"
          - "No AuditCase records_hold covers the period (ERR_AUDIT_RECORDS_HOLD)"
        side_effects:
          - "tax_cents/gross_tax_cents reset to 0; amendment totals recomputed"
      - from: ADJUSTED
        to: RATED
        trigger: "POST /taxable-events/{id}/rate (inside the amendment)"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "Same rate-time preconditions as CLASSIFIED -> RATED except period lock is satisfied by the open amendment"
        side_effects:
          - "Recomputed values land on the amendment return"
      - from: ADJUSTED
        to: RETURNED
        trigger: "system (when the containing amendment is FILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: RATED
        to: RETURNED
        trigger: "system (when the containing return is FILED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: DRAFT
        to: VOIDED
        trigger: "POST /taxable-events/{id}/void"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions: []
        side_effects: []
      - from: CLASSIFIED
        to: VOIDED
        trigger: "POST /taxable-events/{id}/void"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions: []
        side_effects: []

  - entity: TaxReturn
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    note: "Two independent state dimensions evolve independently of each other: filing_status (DRAFT | SUBMITTED | FILED | SUPERSEDED) and settlement_status (UNFILED | AWAITING_PAYMENT | SETTLED | OVERPAID). settlement transitions never change filing_status and vice versa."
    transitions:
      - from: "filing DRAFT"
        to: "filing SUBMITTED"
        trigger: "POST /returns/{id}/submit"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions: []
        side_effects:
          - "prepared_by_user_id = X-User-ID; return.version bumped"
      - from: "filing SUBMITTED"
        to: "filing DRAFT"
        trigger: "POST /returns/{id}/withdraw"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions: []
        side_effects:
          - "prepared_by_user_id cleared; return.version bumped"
      - from: "filing SUBMITTED"
        to: "filing FILED"
        trigger: "POST /returns/{id}/file (OCC: expected_return_version required)"
        actor: TaxReviewer | ComplianceAdmin
        preconditions:
          - "expected_return_version == return.version (ERR_STALE_VERSION 412)"
          - "Segregation of duties: X-User-ID != prepared_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "filed_at = current logical clock; filed_by_user_id = X-User-ID"
          - "return_settlement computed in pinned order: (1) taxable_tax, (2) credits (carried on amendments), (3) deposit waterfall, (4) penalties, (5) net_due"
          - "pinned_rate_snapshot recorded; events RATED -> RETURNED"
          - "PAID deposits for this period -> APPLIED (waterfall: due_date ASC, created_at ASC); excess paid cash -> registrant.overpayment_balance_cents"
          - "settlement_status: UNFILED -> AWAITING_PAYMENT (net_due > 0) | SETTLED (== 0) | OVERPAID (< 0)"
          - "If this return is an amendment: parent return filing_status -> SUPERSEDED; parent's deposits_applied_cents carried forward"
          - "registrant.aggregate_open_liability_cents recomputed; registration bond requirement recomputed"
      - from: "settlement AWAITING_PAYMENT"
        to: "settlement SETTLED or OVERPAID"
        trigger: "system (credit claim apply reduces net_due to <= 0)"
        actor: system
        preconditions: []
        side_effects:
          - "If net_due < 0: registrant.overpayment_balance_cents += -net_due"
      - from: "settlement SETTLED or OVERPAID"
        to: "settlement AWAITING_PAYMENT"
        trigger: "system (credit claim reverse increases net_due above 0)"
        actor: system
        preconditions: []
        side_effects:
          - "If reverting from OVERPAID: registrant.overpayment_balance_cents reduced by the previously credited excess"

  - entity: Deposit
    initial_state: SCHEDULED
    terminal_states: [APPLIED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: LATE
        trigger: "system (clock sweep: current date > due_date and unpaid)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: PAID
        trigger: "POST /deposits/{id}/pay"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "amount_cents >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "paid_at = current logical clock; paid_amount_cents recorded"
          - "late_deposit_penalty computed from days_late = paid date - due date"
      - from: LATE
        to: PAID
        trigger: "POST /deposits/{id}/pay"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "amount_cents >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "paid_at = current logical clock; late_deposit_penalty computed"
      - from: PAID
        to: APPLIED
        trigger: "system (return filing waterfall)"
        actor: system
        preconditions: []
        side_effects:
          - "applied_return_id set; applied_amount_cents = min(paid_amount_cents, remaining need); excess -> registrant.overpayment_balance_cents"
      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /deposits/{id}/waive"
        actor: ComplianceAdmin
        preconditions: []
        side_effects: []
      - from: LATE
        to: WAIVED
        trigger: "POST /deposits/{id}/waive"
        actor: ComplianceAdmin
        preconditions: []
        side_effects: []

  - entity: CreditClaim
    initial_state: DRAFT
    terminal_states: [APPLIED, REVERSED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /credit-claims/{id}/submit"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "Claim return filing_status == FILED (ERR_INVALID_STATE)"
          - "BAD_DEBT: today >= return.filed_at + 183 days (ERR_BAD_DEBT_TOO_EARLY) and <= filed_at + 731 days (ERR_CLAIM_WINDOW_EXPIRED); EXPORT: today <= return.filed_at + 731 days (ERR_CLAIM_WINDOW_EXPIRED)"
          - "EXPORT: every listed event has is_export == true (ERR_EXPORT_DOCUMENTATION_MISSING)"
          - "No listed event appears in another claim with status IN {SUBMITTED, APPROVED, APPLIED} (ERR_EVENT_ALREADY_CLAIMED)"
        side_effects:
          - "submitted_by_user_id = X-User-ID; eligible_cents computed per claim eligibility calculation"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /credit-claims/{id}/approve"
        actor: TaxReviewer | ComplianceAdmin
        preconditions:
          - "Segregation of duties: X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
          - "approved_cents <= min(claimed_cents, eligible_cents, CLAIM_CAP_CENTS) (ERR_CLAIM_EXCEEDS_ELIGIBLE)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /credit-claims/{id}/deny"
        actor: TaxReviewer | ComplianceAdmin
        preconditions:
          - "Segregation of duties: X-User-ID != submitted_by_user_id (ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "reviewed_by_user_id = X-User-ID"
      - from: DENIED
        to: DRAFT
        trigger: "POST /credit-claims/{id}/resubmit (revision loop)"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions: []
        side_effects:
          - "submitted_by_user_id / reviewed_by_user_id / eligible_cents cleared"
      - from: APPROVED
        to: APPLIED
        trigger: "POST /credit-claims/{id}/apply"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions:
          - "No AuditCase records_hold covers the claim return's period (ERR_AUDIT_RECORDS_HOLD)"
        side_effects:
          - "applied_cents = approved_cents"
          - "CASCADE link 1: return.credits_cents += applied_cents; net_due_cents recomputed"
          - "CASCADE link 2: settlement_status flips per net_due sign; OVERPAID excess -> registrant.overpayment_balance_cents"
      - from: APPLIED
        to: REVERSED
        trigger: "POST /credit-claims/{id}/reverse when reversed total reaches applied_cents"
        actor: TaxReviewer | ComplianceAdmin
        preconditions:
          - "amount_cents <= applied_cents - reversed_cents (ERR_REVERSE_EXCEEDS_APPLIED)"
        side_effects:
          - "return.credits_cents -= amount_cents; net_due recomputed; settlement flips back if net_due > 0; registrant.overpayment_balance_cents reduced accordingly"
          - "registration bond_requirement recomputed (variant may flip AGGRAVATED)"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /credit-claims/{id}/withdraw"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /credit-claims/{id}/withdraw"
        actor: TaxAnalyst | ComplianceAdmin
        preconditions: []
        side_effects: []

  - entity: AuditCase
    initial_state: OPENED
    terminal_states: [CLOSED_NO_CHANGE, CLOSED_ASSESSMENT]
    transitions:
      - from: OPENED
        to: DOCUMENTS_REQUESTED
        trigger: "POST /audit-cases/{id}/request-documents"
        actor: JurisdictionAuditor
        preconditions: []
        side_effects: []
      - from: DOCUMENTS_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /audit-cases/{id}/begin-review"
        actor: JurisdictionAuditor
        preconditions: []
        side_effects: []
      - from: OPENED
        to: UNDER_REVIEW
        trigger: "POST /audit-cases/{id}/begin-review (fast path)"
        actor: JurisdictionAuditor
        preconditions: []
        side_effects: []
      - from: UNDER_REVIEW
        to: CLOSED_NO_CHANGE
        trigger: "POST /audit-cases/{id}/close with outcome=NO_CHANGE"
        actor: JurisdictionAuditor
        preconditions: []
        side_effects:
          - "records_hold released"
      - from: UNDER_REVIEW
        to: CLOSED_ASSESSMENT
        trigger: "POST /audit-cases/{id}/close with outcome=ASSESSMENT"
        actor: JurisdictionAuditor
        preconditions:
          - "assessment_cents required and >= 1 (ERR_INVALID_REQUEST)"
        side_effects:
          - "records_hold released; assessment_cents recorded on the case"

  - entity: RateChangeNotice
    initial_state: DETECTED
    terminal_states: [APPLIED, REJECTED]
    transitions:
      - from: DETECTED
        to: VALIDATED
        trigger: "POST /rate-change-notices/{id}/validate"
        actor: TaxReviewer | ComplianceAdmin
        preconditions: []
        side_effects: []
      - from: DETECTED
        to: REJECTED
        trigger: "POST /rate-change-notices/{id}/reject"
        actor: TaxReviewer | ComplianceAdmin
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: REJECTED
        trigger: "POST /rate-change-notices/{id}/reject"
        actor: TaxReviewer | ComplianceAdmin
        preconditions: []
        side_effects: []
      - from: VALIDATED
        to: APPLIED
        trigger: "POST /rate-change-notices/{id}/apply (OCC: expected_jurisdiction_version required)"
        actor: ComplianceAdmin
        preconditions:
          - "expected_jurisdiction_version == jurisdiction.version (ERR_STALE_VERSION 412)"
        side_effects:
          - "CASCADE link 1: new TaxRate created with effective_from = announced_effective_from, effective_to = clamped prior window end, source_notice_id = this notice, supersedes_rate_id = clamped prior rate; prior rate effective_to := announced_effective_from and status -> SUPERSEDED; jurisdiction.version bumped"
          - "CASCADE link 2: every TaxableEvent with event_date inside the new window and status RATED whose containing return has filing_status IN {DRAFT, SUBMITTED} is re-rated (gross_tax_cents / tax_cents recomputed); events in FILED returns are NOT touched (pinned_rate_snapshot governs)"
          - "CASCADE link 3: each affected DRAFT/SUBMITTED return's totals recomputed (gross/exempted/taxable); return.version bumped"
          - "CASCADE link 4: registrant.aggregate_open_liability_cents and registration.bond_required_cents recomputed; registration may flip ACTIVE <-> BOND_DEFICIENT"
          - "applied_rate_id set"

  - entity: TaxRate
    initial_state: SCHEDULED
    terminal_states: [SUPERSEDED, RETIRED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (clock sweep: effective_from <= now < effective_to or effective_to null)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: RETIRED
        trigger: "system (clock sweep: effective_to != null and now >= effective_to)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SCHEDULED
        to: SUPERSEDED
        trigger: "system (rate-change notice application clamps this rate before it activated)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (rate-change notice application: effective_to clamped to the new rate's effective_from)"
        actor: system
        preconditions: []
        side_effects:
          - "Re-rate cascade per RateChangeNotice APPLIED transition"
    note: "Rate selection at event-rating time uses window containment only (effective_from <= event_date < effective_to), independent of this informational status."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: return-file-stale-content
    parent_entity: TaxReturn
    write_endpoint: "POST /returns/{id}/file"
    occ_field: expected_return_version
    description: |
      Filing a return whose version has advanced since the filer last observed it
      (e.g. a late TaxableEvent was rated into the return between submit and file,
      which legitimately mutates the DRAFT/SUBMITTED return) is rejected, because the
      filer's reviewed content is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: notice-apply-stale-jurisdiction
    parent_entity: Jurisdiction
    write_endpoint: "POST /rate-change-notices/{id}/apply"
    occ_field: expected_jurisdiction_version
    description: |
      Applying a rate-change notice against a Jurisdiction whose version has advanced
      since the caller last observed it (e.g. another notice was just applied, which
      legitimately supersedes rates and bumps the jurisdiction version) is rejected,
      because the caller's view of the rate schedule is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: event_tax_determination
    trigger: "POST /taxable-events/{id}/rate; also system re-rate during rate-change-notice apply cascade"
    algorithm: tiered_pricing
    formula: |
      # Step 1 — rate window resolution (see rate_window_resolution): exactly one TaxRate R.
      # Step 2 — exemption / suspension branches:
      if bonded_movement_id is set:        # in-bond suspension
          gross = round_half_up(quantity_units * R.rate_millicents_per_unit / 1000)
          tax_cents = 0
      elif exemption_certificate_id is set: # cert already validated ACTIVE + applicable
          gross = round_half_up(quantity_units * R.rate_millicents_per_unit / 1000)
          tax_cents = 0
      else:                                 # standard determination
          gross = round_half_up(quantity_units * R.rate_millicents_per_unit / 1000)
          tax_cents = gross
      # ROUNDING IS PINNED PER EVENT: each event rounds half-up to whole cents
      # individually; return totals are plain sums of event-level cents and are
      # NEVER re-rounded. (sum-then-round is the forbidden alternative.)
    input_set: "The single event being rated; rate windows for (jurisdiction, product_class); the referenced certificate or movement if any"
    constants:
      MILLICENTS_PER_CENT: 1000
      PUNITIVE_RATE_MULTIPLIER: 1.5
    precision: "whole cents per event, round_half_up"
    variants:
      - name: STANDARD
        when: "User-rated events (any linkage) and system re-rates"
        difference: "Uses the rate whose window contains event_date for the event's own product class."
      - name: DEFAULT_ASSESSMENT
        when: "System-created events from a bonded-movement default (full or shortfall)"
        difference: "Ignores the event's own class rate: punitive_rate = round_half_up(1.5 * max(rate_millicents_per_unit)) over ALL TaxRates of the registration's jurisdiction whose window contains the default date (any product class; if none contain it, max over all rates of that jurisdiction); tax_cents = gross = round_half_up(defaulted_quantity * punitive_rate / 1000)."

  - name: rate_window_resolution
    trigger: "event rating and re-rating"
    algorithm: interval_merge
    formula: |
      Candidates = TaxRates with matching (jurisdiction_id, product_class_id)
      and effective_from <= event_date AND (effective_to IS NULL OR event_date < effective_to).
      Half-open [from, to): an event dated exactly effective_from uses the NEW rate;
      exactly effective_to uses the NEXT window (or fails if none).
      Windows are validated non-overlapping per (jurisdiction, product_class) at
      creation/supersession, so |candidates| <= 1; 0 -> ERR_NO_APPLICABLE_RATE.
      Status is NOT consulted (a RETIRED or SUPERSEDED rate still governs its window).
    input_set: "All TaxRates of the event's (jurisdiction, product_class)"
    precision: "date-time comparison, half-open"

  - name: return_liability_aggregation
    trigger: "event rate/reclassify/void, amendment inclusion, rate-apply cascade, claim apply/reverse"
    algorithm: aggregation
    formula: |
      Included events = TaxableEvents with return_id == this return
      and status IN {RATED, RETURNED, ADJUSTED}.  # DRAFT/CLASSIFIED/VOIDED excluded
      event_count        = count(included)
      gross_tax_cents    = sum(included.gross_tax_cents)
      taxable_tax_cents  = sum(included.tax_cents)
      exempted_cents     = gross_tax_cents - taxable_tax_cents
      Recomputed on every membership or event-value change; ordering of events is
      irrelevant because summation is over pre-rounded per-event cents.
    input_set: "Events with return_id == return.id and status IN {RATED, RETURNED, ADJUSTED}"
    precision: "integer cents (no further rounding — per-event rounding already applied)"

  - name: deposit_schedule
    trigger: "system, at TaxReturn creation (auto or manual) — creates the period's deposit rows; ACTUAL amounts are filled by the clock sweep at each window close"
    algorithm: forward_looking
    formula: |
      Constraint: a QUARTERLY jurisdiction must use MONTHLY deposit_frequency
      (enforced at jurisdiction creation with ERR_INVALID_REQUEST).
      Windows per jurisdiction.deposit_frequency:
        SEMI_MONTHLY (MONTHLY returns): A = days 1-15 (due 25th same month), B = days 16-end (due 10th next month)
        MONTHLY: M = the whole return period (month or quarter), due the 25th of the month following period end
      SAFE_HARBOR variant:
        scheduled = round_half_up(0.5 * prior_period_final_taxable_tax_cents)
        prior = the return for the immediately preceding period with filing_status == FILED
                (amendments supersede: use the latest non-superseded one's taxable_tax_cents)
        if no such prior filed return exists: scheduled = MIN_DEPOSIT_FLOOR_CENTS
      ACTUAL variant:
        scheduled starts at 0; the clock sweep at each window close sets
        scheduled = sum(tax_cents of events of that registration+jurisdiction
                        whose event_date falls inside the window
                        and status IN {RATED, RETURNED, ADJUSTED})
    input_set: "Prior filed return (SAFE_HARBOR) or window events (ACTUAL)"
    constants:
      MIN_DEPOSIT_FLOOR_CENTS: 10000
      SAFE_HARBOR_FRACTION: 0.5
    precision: "whole cents, round_half_up"
    variants:
      - name: SAFE_HARBOR
        when: "registration.deposit_method == SAFE_HARBOR"
        difference: "Forward-looking estimate from prior-period liability; known immediately at return creation; identical activity in the current period does NOT change it."
      - name: ACTUAL
        when: "registration.deposit_method == ACTUAL"
        difference: "Chronological accumulation of the current period's own rated events; 0 until the window-close sweep runs."

  - name: late_deposit_penalty
    trigger: "POST /deposits/{id}/pay"
    algorithm: threshold
    formula: |
      days_late = calendar_days_between(date(paid_at), date(due_date))   # <= 0 means on time
      base = scheduled_amount_cents
      if days_late <= 0:   penalty = 0
      elif days_late <= 5:  penalty = round_half_up(0.02 * base)   # boundary: 5 days is IN the 2% tier
      elif days_late <= 15: penalty = round_half_up(0.05 * base)   # 6 days enters the 5% tier
      else:                 penalty = round_half_up(0.10 * base) + round_half_up(base * DAILY_INTEREST * days_late)
      # Single final rounding per component; tiers are NON-linear in (base, days_late, tier table).
    input_set: "The deposit being paid"
    constants:
      TIER1_MAX_DAYS: 5
      TIER2_MAX_DAYS: 15
      TIER1_RATE: 0.02
      TIER2_RATE: 0.05
      TIER3_RATE: 0.10
      DAILY_INTEREST: 0.0005
    precision: "whole cents per component, round_half_up"

  - name: return_settlement
    trigger: "POST /returns/{id}/file"
    algorithm: waterfall_allocation
    formula: |
      # PINNED EVALUATION ORDER (breaks the circular-looking dependency between
      # deposits_applied, penalty, and net_due — penalty depends on deposits_applied,
      # deposits_applied is capped WITHOUT reference to penalty):
      (1) taxable_tax_cents := current aggregate (per return_liability_aggregation)
      (2) credits_cents     := sum over claims (applied_cents - reversed_cents) with status IN {APPLIED, REVERSED}
                               # original returns: always 0 at filing (claims require a FILED return);
                               # amendments: credits attached to the chain carry forward
      (3) deposit waterfall: eligible = PAID deposits for (registration, jurisdiction, period),
          ordered due_date ASC then created_at ASC;
          remaining_need = taxable_tax_cents - credits_cents
          for each deposit: take = min(paid_amount_cents, remaining_need); applied_amount_cents = take;
                            remaining_need -= take; excess (paid - take) -> registrant.overpayment_balance_cents
          deposits_applied_cents = sum(take)
      (4) penalties:
          underpayment: if taxable_tax_cents > 0 and deposits_applied_cents < ceil(0.9 * taxable_tax_cents):
              underpayment_penalty = round_half_up(0.10 * (taxable_tax_cents - deposits_applied_cents))
          late filing: if date(filed_at) > date(due_date):
              late_penalty = round_half_up(0.05 * taxable_tax_cents) per started 30-day month late, capped at 25%
          penalty_cents = underpayment_penalty + late_penalty
      (5) net_due_cents = taxable_tax_cents - credits_cents - deposits_applied_cents + penalty_cents
    input_set: "The return being filed; its included events; PAID deposits of the same (registration, jurisdiction, period); applied claims on the chain"
    constants:
      UNDERPAYMENT_SAFE_HARBOR_RATIO: 0.9
      UNDERPAYMENT_PENALTY_RATE: 0.10
      LATE_FILING_MONTHLY_RATE: 0.05
      LATE_FILING_CAP_RATE: 0.25
    precision: "whole cents, round_half_up per component"

  - name: export_credit_calculation
    trigger: "POST /credit-claims/{id}/submit (claim_type == EXPORT)"
    algorithm: waterfall_allocation
    formula: |
      eligible events = the claim's event_ids where is_export == true,
        status IN {RETURNED, ADJUSTED}, same registration & jurisdiction as the claim return,
        and not listed by any other claim with status IN {SUBMITTED, APPROVED, APPLIED}
      eligible_cents = sum(eligible.tax_cents)   # only tax actually paid is refundable
      approved ceiling = min(claimed_cents, eligible_cents, CLAIM_CAP_CENTS)
      Allocation to events (for record-keeping) is waterfall: event_date ASC, created_at ASC.
    input_set: "Claim's event_ids"
    constants:
      CLAIM_CAP_CENTS: 5000000
    precision: "whole cents"

  - name: bad_debt_credit_calculation
    trigger: "POST /credit-claims/{id}/submit (claim_type == BAD_DEBT)"
    algorithm: threshold
    formula: |
      Window: return.filed_at + MIN_AGE_DAYS <= today <= return.filed_at + MAX_AGE_DAYS
      eligible events = the claim's event_ids with status IN {RETURNED, ADJUSTED},
        same registration/jurisdiction, not already claimed (same rule as export)
      eligible_cents = sum(eligible.tax_cents)
      approved ceiling = min(claimed_cents, eligible_cents, CLAIM_CAP_CENTS)
      Recovery clawback: POST /credit-claims/{id}/reverse reduces credits_cents by the
      recovered amount (see CreditClaim APPLIED -> REVERSED transition).
    input_set: "Claim's event_ids; the claim return's filed_at; current logical date"
    constants:
      MIN_AGE_DAYS: 183
      MAX_AGE_DAYS: 731
      CLAIM_CAP_CENTS: 5000000
    precision: "whole cents; day comparison on calendar dates"

  - name: bond_requirement
    trigger: "registration activate/reinstate; return filed; movement default; claim reversal; bond activate/cancel/expire"
    algorithm: weighted_scoring
    formula: |
      filed_periods = original returns (amendment_of_id IS NULL) of this registration
                      with filing_status == FILED, newest period first
      STANDARD variant:
        window W = first 6 of filed_periods; n = count(W)
        if n == 0: required = FLOOR_STANDARD
        else: avg = round_half_up(sum(W.taxable_tax_cents) / n); required = max(3 * avg, FLOOR_STANDARD)
      AGGRAVATED variant (applies when any BondedMovement of the registration reached
      DEFAULTED/PARTIAL_DEFAULT, or any claim reached REVERSED, within the trailing 12 months):
        window W = first 12 of filed_periods; n = count(W)
        if n == 0: required = FLOOR_AGGRAVATED
        else: avg = round_half_up(sum(W.taxable_tax_cents) / n); required = max(5 * avg, FLOOR_AGGRAVATED)
      registration.requirement_variant reflects the variant in force; bond_required_cents = required.
    input_set: "Filed original returns of the registration; movement/claim history"
    constants:
      STANDARD_WINDOW_MONTHS: 6
      STANDARD_MULTIPLIER: 3
      FLOOR_STANDARD_CENTS: 1000000
      AGGRAVATED_WINDOW_MONTHS: 12
      AGGRAVATED_MULTIPLIER: 5
      FLOOR_AGGRAVATED_CENTS: 2500000
    precision: "whole cents, round_half_up on the average"
    variants:
      - name: STANDARD
        when: "No default/reversal blemish in the trailing 12 months"
        difference: "3x multiplier over a 6-month lookback with a $10,000 floor."
      - name: AGGRAVATED
        when: "Any movement default or claim reversal in the trailing 12 months"
        difference: "5x multiplier over a 12-month lookback with a $25,000 floor — identical liability history yields a strictly larger requirement whenever the 6-month average is positive."

  - name: registrant_liability_rollup
    trigger: "any return total change, filing, claim apply/reverse"
    algorithm: aggregation
    formula: |
      aggregate_open_liability_cents =
          sum(taxable_tax_cents) over returns with filing_status IN {DRAFT, SUBMITTED}
        + sum(net_due_cents)       over returns with filing_status == FILED
                                   and settlement_status == AWAITING_PAYMENT
      overpayment_balance_cents accumulates: + (deposit paid excess at filing)
        + (-net_due) when settlement flips to OVERPAID; - reversed when a reverse
        flips settlement back out of OVERPAID.
    input_set: "All returns of the registrant (any jurisdiction)"
    precision: "integer cents"

  - name: retention_eligibility
    trigger: "POST /registrations/{id}/purge-expired-records"
    algorithm: threshold
    formula: |
      retention anchor for a period = filed_at of its latest non-superseded FILED return,
        else period end.
      eligible iff anchor + RETENTION_YEARS years <= current logical date
      and no AuditCase with records_hold covers the period.
      Purge removes VOIDED events and SUPERSEDED returns of that period.
      If the period's retention has not elapsed -> ERR_RETENTION_NOT_ELAPSED.
    input_set: "One period of one registration"
    constants:
      RETENTION_YEARS: 7
    precision: "calendar-year arithmetic on dates"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-ID and X-User-Role headers present and role is a declared role", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "Caller role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN_FOR_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,            check: "Request body is well-formed: required fields present, enum members valid, integer fields >= their minimums (quantity_units >= 1, amounts >= 1)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4,  category: existence,            check: "Path ids exist (left-to-right), then body FK ids exist", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5,  category: state,                check: "Target resource's current state permits the requested transition (including terminal-state lockdown)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 6,  category: state,                check: "OCC: expected_<parent>_version == current parent version on endpoints declared in concurrency_rules", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /returns/{id}/file; POST /rate-change-notices/{id}/apply" }
  - { priority: 7,  category: business_safety,      check: "Segregation of duties: filer != preparer on return filing; approver != submitter on claim approve/deny", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 403, applies_to: "POST /returns/{id}/file; POST /credit-claims/{id}/approve; POST /credit-claims/{id}/deny" }
  - { priority: 8,  category: business_safety,      check: "Audit records hold: no AuditCase with records_hold covering the period blocks amendment, RETURNED-event reclassify, claim apply, purge, and registration revoke", error_id: ERR_AUDIT_RECORDS_HOLD, http_status: 409, applies_to: "POST /returns/{id}/amend; POST /taxable-events/{id}/reclassify; POST /credit-claims/{id}/apply; POST /registrations/{id}/purge-expired-records; POST /registrations/{id}/revoke" }
  - { priority: 9,  category: business_safety,      check: "Registration must be ACTIVE for taxable-activity and bonded-movement operations", error_id: ERR_REGISTRATION_NOT_ACTIVE, http_status: 409, applies_to: "POST /taxable-events; POST /taxable-events/{id}/classify; POST /taxable-events/{id}/rate; POST /bonded-movements; POST /bonded-movements/{id}/dispatch; POST /returns" }
  - { priority: 10, category: business_temporal,    check: "Period not locked: latest non-superseded return for (registration, jurisdiction, period) is DRAFT/SUBMITTED or has an open amendment", error_id: ERR_PERIOD_LOCKED, http_status: 409, applies_to: "POST /taxable-events/{id}/rate" }
  - { priority: 11, category: business_temporal,    check: "BAD_DEBT claim earliest date: today >= return.filed_at + 183 days", error_id: ERR_BAD_DEBT_TOO_EARLY, http_status: 409, applies_to: "POST /credit-claims/{id}/submit" }
  - { priority: 12, category: business_temporal,    check: "Claim latest date: today <= return.filed_at + 731 days", error_id: ERR_CLAIM_WINDOW_EXPIRED, http_status: 409, applies_to: "POST /credit-claims/{id}/submit" }
  - { priority: 13, category: business_temporal,    check: "Bond coverage window not fully elapsed at activation (effective_to >= current date)", error_id: ERR_BOND_WINDOW_ELAPSED, http_status: 409, applies_to: "POST /bonds/{id}/activate" }
  - { priority: 14, category: business_temporal,    check: "Purge only after retention anchor + 7 years", error_id: ERR_RETENTION_NOT_ELAPSED, http_status: 409, applies_to: "POST /registrations/{id}/purge-expired-records" }
  - { priority: 15, category: business_constraint,  check: "fein unique across registrants", error_id: ERR_DUPLICATE_FEIN, http_status: 409, applies_to: "POST /registrants" }
  - { priority: 16, category: business_constraint,  check: "code unique across jurisdictions / product classes", error_id: ERR_DUPLICATE_CODE, http_status: 409, applies_to: "POST /jurisdictions; POST /product-classes" }
  - { priority: 17, category: business_constraint,  check: "At most one non-REVOKED registration per (registrant, jurisdiction)", error_id: ERR_DUPLICATE_REGISTRATION, http_status: 409, applies_to: "POST /registrations" }
  - { priority: 18, category: business_constraint,  check: "At most one non-SUPERSEDED original return per (registration, jurisdiction, period)", error_id: ERR_DUPLICATE_RETURN, http_status: 409, applies_to: "POST /returns" }
  - { priority: 19, category: business_constraint,  check: "At most one open amendment (filing_status IN {DRAFT, SUBMITTED}) per parent return", error_id: ERR_AMENDMENT_ALREADY_OPEN, http_status: 409, applies_to: "POST /returns/{id}/amend" }
  - { priority: 20, category: business_constraint,  check: "TaxRate half-open windows per (jurisdiction, product_class) never overlap; adjacency (from == prior.to) allowed", error_id: ERR_RATE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /tax-rates" }
  - { priority: 21, category: business_constraint,  check: "ExemptionCertificate closed windows per (registration, customer_reference, product_class_id-or-null) must keep >= 1-day gap; touching windows rejected", error_id: ERR_CERTIFICATE_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /exemption-certificates" }
  - { priority: 22, category: business_constraint,  check: "AuditCase month-bucket ranges per (registration, jurisdiction) must not share any bucket while the existing case is non-terminal", error_id: ERR_AUDIT_RANGE_OVERLAP, http_status: 409, applies_to: "POST /audit-cases" }
  - { priority: 23, category: business_constraint,  check: "Movement receipt quantity within [0, quantity_units]", error_id: ERR_MOVEMENT_QUANTITY_EXCEEDS, http_status: 422, applies_to: "POST /bonded-movements/{id}/receive" }
  - { priority: 24, category: business_referential, check: "All referenced entities must belong to the same registrant chain (registration -> registrant); amendment add_event_ids must reference events of the same registration", error_id: ERR_CROSS_REGISTRANT_REFERENCE, http_status: 422, applies_to: "POST /registrations; POST /bonds; POST /exemption-certificates; POST /bonded-movements; POST /taxable-events; POST /returns; POST /credit-claims; POST /audit-cases; POST /returns/{id}/amend" }
  - { priority: 25, category: business_referential, check: "event.jurisdiction_id must equal registration.jurisdiction_id; claim.return_id must match claim registration and jurisdiction", error_id: ERR_REGISTRATION_JURISDICTION_MISMATCH, http_status: 422, applies_to: "POST /taxable-events; POST /credit-claims" }
  - { priority: 26, category: business_referential, check: "Exemption certificate status == ACTIVE at rating time", error_id: ERR_CERTIFICATE_NOT_ACTIVE, http_status: 409, applies_to: "POST /taxable-events/{id}/rate" }
  - { priority: 27, category: business_referential, check: "Certificate covers the event: valid_from <= event_date <= valid_to, product_class_id null or matching, customer_reference equal, certificate_type consistent (EXPORT cert only for is_export events)", error_id: ERR_CERTIFICATE_NOT_APPLICABLE, http_status: 422, applies_to: "POST /taxable-events/{id}/rate" }
  - { priority: 28, category: business_referential, check: "Bonded movement linkable: same registration, same product class, status IN {IN_TRANSIT, RECEIVED}", error_id: ERR_MOVEMENT_NOT_LINKABLE, http_status: 422, applies_to: "POST /taxable-events/{id}/rate" }
  - { priority: 29, category: business_referential, check: "Claim events not already listed by another claim with status IN {SUBMITTED, APPROVED, APPLIED}", error_id: ERR_EVENT_ALREADY_CLAIMED, http_status: 409, applies_to: "POST /credit-claims/{id}/submit" }
  - { priority: 30, category: business_referential, check: "EXPORT claim: every listed event has is_export == true", error_id: ERR_EXPORT_DOCUMENTATION_MISSING, http_status: 422, applies_to: "POST /credit-claims/{id}/submit" }
  - { priority: 31, category: business_referential, check: "Exactly one rate window contains event_date", error_id: ERR_NO_APPLICABLE_RATE, http_status: 422, applies_to: "POST /taxable-events/{id}/classify; POST /taxable-events/{id}/rate" }
  - { priority: 32, category: business_fiscal,      check: "Bond coverage >= requirement at registration activation/reinstatement", error_id: ERR_BOND_INSUFFICIENT, http_status: 409, applies_to: "POST /registrations/{id}/activate; POST /registrations/{id}/reinstate" }
  - { priority: 33, category: business_fiscal,      check: "approved_cents <= min(claimed_cents, eligible_cents, CLAIM_CAP_CENTS)", error_id: ERR_CLAIM_EXCEEDS_ELIGIBLE, http_status: 422, applies_to: "POST /credit-claims/{id}/approve" }
  - { priority: 34, category: business_fiscal,      check: "reverse amount_cents <= applied_cents - reversed_cents", error_id: ERR_REVERSE_EXCEEDS_APPLIED, http_status: 422, applies_to: "POST /credit-claims/{id}/reverse" }
  - { priority: 35, category: business_fiscal,      check: "Registration revocable only with no open returns and no unsettled filed liability", error_id: ERR_REGISTRATION_HAS_OPEN_LIABILITY, http_status: 409, applies_to: "POST /registrations/{id}/revoke" }

# =============================================================================
# §1.5 API Endpoint Table
# All list endpoints: pagination per response_envelope; default sort created_at ASC
# unless stated otherwise. "GET roles: ALL" = [ComplianceAdmin, TaxAnalyst,
# TaxReviewer, JurisdictionAuditor].
# =============================================================================
endpoints:
  # --- Logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Advance the logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z (never wall-clock). Advancing runs the daily sweep: certificate/bond expiry, movement timeout default, deposit LATE marking, rate SCHEDULED->ACTIVE->RETIRED, registrant suspension on prolonged bond deficiency, ACTUAL deposit window-close computation."
    roles: [ComplianceAdmin]
    code: 200
    input: [to_iso8601]
    output: { "current_utc": "string" }
    side_effects: ["Runs the time-based sweep for every auto transition listed in §1.2"]

  # --- Jurisdiction ---
  - method: POST
    path: "/jurisdictions"
    description: "Create a taxing jurisdiction"
    roles: [ComplianceAdmin]
    code: 201
    input: [code, name, level, return_frequency, deposit_frequency]
    output: Jurisdiction
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/jurisdictions/{id}"
    description: "Get a jurisdiction"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  # --- Product class ---
  - method: POST
    path: "/product-classes"
    description: "Create a taxable product class"
    roles: [ComplianceAdmin]
    code: 201
    input: [code, description, base_unit]
    output: ProductClass
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/product-classes/{id}"
    description: "Get a product class"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: ProductClass
    side_effects: []

  # --- Tax rates ---
  - method: POST
    path: "/tax-rates"
    description: "Directly create a rate (initial schedules and non-overlapping future/gap windows). Supersession of an existing window MUST go through a rate-change notice; overlapping windows are rejected."
    roles: [ComplianceAdmin]
    code: 201
    input: [jurisdiction_id, product_class_id, rate_millicents_per_unit, effective_from, "effective_to?"]
    output: TaxRate
    side_effects: ["status derived from window vs current clock; bumps Jurisdiction.version by 1"]
  - method: GET
    path: "/tax-rates/{id}"
    description: "Get a tax rate"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: TaxRate
    side_effects: []
  - method: GET
    path: "/tax-rates"
    description: "List tax rates with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["jurisdiction_id?", "product_class_id?", "status?", "source_notice_id?", "supersedes_rate_id?", "limit?", "offset?"]
    output: "TaxRate[]"
    side_effects: []

  # --- Rate change notices (monitoring & system update) ---
  - method: POST
    path: "/rate-change-notices"
    description: "Record a detected rate change announcement"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 201
    input: [jurisdiction_id, product_class_id, new_rate_millicents_per_unit, announced_effective_from, source_reference]
    output: RateChangeNotice
    side_effects: ["status=DETECTED; detected_at = logical clock"]
  - method: GET
    path: "/rate-change-notices/{id}"
    description: "Get a rate change notice"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: RateChangeNotice
    side_effects: []
  - method: GET
    path: "/rate-change-notices"
    description: "List rate change notices with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["jurisdiction_id?", "product_class_id?", "status?", "applied_rate_id?", "limit?", "offset?"]
    output: "RateChangeNotice[]"
    side_effects: []
  - method: POST
    path: "/rate-change-notices/{id}/validate"
    description: "Mark a detected notice verified against the official bulletin"
    roles: [TaxReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: RateChangeNotice
    side_effects: ["status DETECTED -> VALIDATED"]
  - method: POST
    path: "/rate-change-notices/{id}/reject"
    description: "Reject a spurious notice"
    roles: [TaxReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: RateChangeNotice
    side_effects: ["status -> REJECTED"]
  - method: POST
    path: "/rate-change-notices/{id}/apply"
    description: "Apply a validated notice: creates the new TaxRate, clamps/supersedes the prior window, and runs the retroactive re-rate cascade. OCC-guarded on the jurisdiction version."
    roles: [ComplianceAdmin]
    code: 200
    input: [expected_jurisdiction_version]
    output: RateChangeNotice
    side_effects:
      - "status VALIDATED -> APPLIED; applied_rate_id set"
      - "Creates TaxRate(effective_from=announced_effective_from, effective_to=clamped prior window end); prior rate effective_to := announced_effective_from, status -> SUPERSEDED"
      - "Re-rates RATED events inside the new window whose return is DRAFT/SUBMITTED; recomputes return totals; recomputes registrant liability and registration bond requirement"
      - "increments Jurisdiction.version by 1"

  # --- Registrant ---
  - method: POST
    path: "/registrants"
    description: "Create a taxpayer registrant"
    roles: [ComplianceAdmin]
    code: 201
    input: [legal_name, fein]
    output: Registrant
    side_effects: ["status=ACTIVE; balances 0"]
  - method: GET
    path: "/registrants/{id}"
    description: "Get a registrant"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: Registrant
    side_effects: []

  # --- Registration (per jurisdiction) ---
  - method: POST
    path: "/registrations"
    description: "Register a registrant with a jurisdiction"
    roles: [ComplianceAdmin]
    code: 201
    input: [registrant_id, jurisdiction_id, deposit_method]
    output: Registration
    side_effects: ["status=PENDING; bond_required_cents computed (floor with no filing history)"]
  - method: GET
    path: "/registrations/{id}"
    description: "Get a registration"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: Registration
    side_effects: []
  - method: GET
    path: "/registrations"
    description: "List registrations with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["registrant_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: "Registration[]"
    side_effects: []
  - method: POST
    path: "/registrations/{id}/activate"
    description: "Activate a PENDING registration (requires sufficient ACTIVE bond coverage)"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> ACTIVE; registration_number minted"]
  - method: POST
    path: "/registrations/{id}/suspend"
    description: "Suspend an ACTIVE registration"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> SUSPENDED"]
  - method: POST
    path: "/registrations/{id}/reinstate"
    description: "Reinstate a SUSPENDED or BOND_DEFICIENT registration"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> ACTIVE (requires coverage >= requirement)"]
  - method: POST
    path: "/registrations/{id}/revoke"
    description: "Revoke a registration (terminal; requires no open liability, no audit hold)"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Registration
    side_effects: ["status -> REVOKED; certificates revoked; open movements defaulted (cascade suppressed)"]
  - method: GET
    path: "/registrations/{id}/bond-status"
    description: "Computed read: current bond requirement vs coverage"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: { "registration_id": "string", "bond_required_cents": "integer", "bond_coverage_cents": "integer", "requirement_variant": "string", "deficient": "boolean" }
    side_effects: []
  - method: POST
    path: "/registrations/{id}/purge-expired-records"
    description: "Records retention: purge VOIDED events and SUPERSEDED returns of one period whose retention anchor + 7 years has elapsed; blocked by audit records hold"
    roles: [ComplianceAdmin]
    code: 200
    input: [period]
    output: { "purged_event_count": "integer", "purged_return_count": "integer" }
    side_effects: ["Deletes eligible VOIDED events and SUPERSEDED returns of the period"]

  # --- Bonds ---
  - method: POST
    path: "/bonds"
    description: "Create a surety bond (DRAFT) for a registration"
    roles: [ComplianceAdmin]
    code: 201
    input: [registration_id, surety_name, principal_amount_cents, effective_from, effective_to]
    output: Bond
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/bonds/{id}"
    description: "Get a bond"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: Bond
    side_effects: []
  - method: GET
    path: "/bonds"
    description: "List bonds with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["registration_id?", "status?", "limit?", "offset?"]
    output: "Bond[]"
    side_effects: []
  - method: POST
    path: "/bonds/{id}/activate"
    description: "Activate a DRAFT bond"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Bond
    side_effects: ["status -> ACTIVE; registration.bond_coverage_cents recomputed"]
  - method: POST
    path: "/bonds/{id}/cancel"
    description: "Cancel an ACTIVE bond"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Bond
    side_effects: ["status -> CANCELLED; registration.bond_coverage_cents recomputed; possible BOND_DEFICIENT flip"]

  # --- Exemption certificates ---
  - method: POST
    path: "/exemption-certificates"
    description: "Create an exemption certificate (PENDING_VERIFICATION). Closed validity windows per (registration, customer_reference, product_class) must keep a >= 1-day gap."
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 201
    input: [registration_id, "product_class_id?", customer_reference, certificate_type, valid_from, valid_to]
    output: ExemptionCertificate
    side_effects: ["status=PENDING_VERIFICATION"]
  - method: GET
    path: "/exemption-certificates/{id}"
    description: "Get an exemption certificate"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: []
  - method: GET
    path: "/exemption-certificates"
    description: "List exemption certificates with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["registration_id?", "product_class_id?", "status?", "certificate_type?", "limit?", "offset?"]
    output: "ExemptionCertificate[]"
    side_effects: []
  - method: POST
    path: "/exemption-certificates/{id}/verify"
    description: "Verify a certificate (PENDING_VERIFICATION -> ACTIVE)"
    roles: [TaxReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status -> ACTIVE"]
  - method: POST
    path: "/exemption-certificates/{id}/revoke"
    description: "Revoke (ACTIVE -> REVOKED) or reject (PENDING_VERIFICATION -> REJECTED)"
    roles: [TaxReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status -> REVOKED | REJECTED"]

  # --- Bonded movements ---
  - method: POST
    path: "/bonded-movements"
    description: "Document an in-bond movement of taxable product"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 201
    input: [registration_id, bond_id, product_class_id, quantity_units, origin_facility, destination_facility, "transit_deadline_days?"]
    output: BondedMovement
    side_effects: ["status=INITIATED"]
  - method: GET
    path: "/bonded-movements/{id}"
    description: "Get a bonded movement"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: BondedMovement
    side_effects: []
  - method: GET
    path: "/bonded-movements"
    description: "List bonded movements with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["registration_id?", "bond_id?", "product_class_id?", "status?", "limit?", "offset?"]
    output: "BondedMovement[]"
    side_effects: []
  - method: POST
    path: "/bonded-movements/{id}/dispatch"
    description: "Mark the movement dispatched (INITIATED -> IN_TRANSIT)"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: BondedMovement
    side_effects: ["dispatched_at = logical clock"]
  - method: POST
    path: "/bonded-movements/{id}/receive"
    description: "Confirm receipt quantity (IN_TRANSIT -> RECEIVED)"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: [quantity_received_units]
    output: BondedMovement
    side_effects: ["received_at = logical clock; quantity_received_units recorded"]
  - method: POST
    path: "/bonded-movements/{id}/discharge"
    description: "Discharge the bond (RECEIVED -> DISCHARGED) — requires exact quantity reconciliation"
    roles: [TaxReviewer, ComplianceAdmin]
    code: 200
    input: []
    output: BondedMovement
    side_effects: ["status -> DISCHARGED; suspension confirmed, no tax assessed"]
  - method: POST
    path: "/bonded-movements/{id}/default"
    description: "Declare default: full (from IN_TRANSIT) or shortfall (from RECEIVED); triggers the default-assessment cascade"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: BondedMovement
    side_effects: ["status -> DEFAULTED | PARTIAL_DEFAULT; creates DEFAULT_ASSESSMENT TaxableEvent (RATED) and auto-includes it in the period return (stays unattached if the period is locked); ACTUAL deposits recomputed; bond requirement recomputed"]

  # --- Taxable events ---
  - method: POST
    path: "/taxable-events"
    description: "Record a taxable activity (removal/sale/use)"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 201
    input: [registration_id, jurisdiction_id, product_class_id, event_date, quantity_units, "customer_reference?", "is_export?"]
    output: TaxableEvent
    side_effects: ["status=DRAFT; period derived from event_date + jurisdiction frequency"]
  - method: GET
    path: "/taxable-events/{id}"
    description: "Get a taxable event"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: TaxableEvent
    side_effects: []
  - method: GET
    path: "/taxable-events"
    description: "List taxable events with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["registration_id?", "jurisdiction_id?", "product_class_id?", "return_id?", "exemption_certificate_id?", "bonded_movement_id?", "status?", "period?", "limit?", "offset?"]
    output: "TaxableEvent[]"
    side_effects: []
  - method: POST
    path: "/taxable-events/{id}/classify"
    description: "Confirm product identification (DRAFT -> CLASSIFIED)"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: TaxableEvent
    side_effects: ["status -> CLASSIFIED"]
  - method: POST
    path: "/taxable-events/{id}/rate"
    description: "Determine the tax (CLASSIFIED -> RATED; ADJUSTED -> RATED inside an amendment): rate window resolution, optional exemption certificate or bonded movement, per-event rounding, auto-inclusion into the period return"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: ["exemption_certificate_id?", "bonded_movement_id?"]
    output: TaxableEvent
    side_effects: ["status -> RATED; tax_cents/gross_tax_cents computed; return auto-created (with deposit schedule) or updated; return.version bumped; registrant liability recomputed"]
  - method: POST
    path: "/taxable-events/{id}/reclassify"
    description: "Send a rated event back for correction (RATED -> CLASSIFIED; RETURNED -> ADJUSTED inside an open amendment)"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: TaxableEvent
    side_effects: ["status -> CLASSIFIED | ADJUSTED; tax fields zeroed; containing return/amendment totals recomputed"]
  - method: POST
    path: "/taxable-events/{id}/void"
    description: "Void a DRAFT or CLASSIFIED event"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: TaxableEvent
    side_effects: ["status -> VOIDED"]

  # --- Returns ---
  - method: POST
    path: "/returns"
    description: "Manually create an original DRAFT return (incl. zero-activity returns) with its deposit schedule"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 201
    input: [registration_id, jurisdiction_id, period]
    output: TaxReturn
    side_effects: ["filing_status=DRAFT, settlement_status=UNFILED; deposit schedule created per registration.deposit_method"]
  - method: GET
    path: "/returns/{id}"
    description: "Get a tax return"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: TaxReturn
    side_effects: []
  - method: GET
    path: "/returns"
    description: "List returns with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["registration_id?", "jurisdiction_id?", "period?", "filing_status?", "settlement_status?", "amendment_of_id?", "limit?", "offset?"]
    output: "TaxReturn[]"
    side_effects: []
  - method: GET
    path: "/returns/{id}/summary"
    description: "Computed read: full liability breakdown of a return"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: { "return_id": "string", "period": "string", "event_count": "integer", "gross_tax_cents": "integer", "exempted_cents": "integer", "taxable_tax_cents": "integer", "credits_cents": "integer", "deposits_applied_cents": "integer", "penalty_cents": "integer", "net_due_cents": "integer", "filing_status": "string", "settlement_status": "string" }
    side_effects: []
  - method: POST
    path: "/returns/{id}/submit"
    description: "Preparer submits a DRAFT return for review (DRAFT -> SUBMITTED)"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["prepared_by_user_id = X-User-ID; increments TaxReturn.version by 1"]
  - method: POST
    path: "/returns/{id}/withdraw"
    description: "Withdraw a submission (SUBMITTED -> DRAFT)"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["prepared_by_user_id cleared; increments TaxReturn.version by 1"]
  - method: POST
    path: "/returns/{id}/file"
    description: "Reviewer files a SUBMITTED return. OCC on expected_return_version; segregation of duties enforced; computes settlement in pinned order; pins the rate snapshot; deposit waterfall; amendment filing supersedes the parent."
    roles: [TaxReviewer, ComplianceAdmin]
    code: 200
    input: [expected_return_version]
    output: TaxReturn
    side_effects:
      - "filing_status -> FILED; filed_at/filed_by_user_id set; increments TaxReturn.version by 1"
      - "return_settlement computed; pinned_rate_snapshot recorded; included events RATED/ADJUSTED -> RETURNED"
      - "PAID deposits -> APPLIED with applied_amount_cents; excess -> registrant.overpayment_balance_cents"
      - "settlement_status set from net_due sign; amendment filing sets parent SUPERSEDED and carries deposits_applied forward"
      - "registrant liability and registration bond requirement recomputed"
  - method: POST
    path: "/returns/{id}/amend"
    description: "Open an amendment of a FILED return. OCC on expected_return_version; blocked by audit records hold; creates a DRAFT amendment return inheriting the parent's events."
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 201
    input: [expected_return_version, "add_event_ids?"]
    output: TaxReturn
    side_effects: ["Creates amendment TaxReturn (amendment_of_id=parent, amendment_sequence+1, DRAFT/UNFILED) containing the parent's RETURNED events plus any add_event_ids; increments parent TaxReturn.version by 1"]

  # --- Deposits ---
  - method: GET
    path: "/deposits/{id}"
    description: "Get a deposit"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: Deposit
    side_effects: []
  - method: GET
    path: "/deposits"
    description: "List deposits with filters; sorted due_date ASC, created_at ASC"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["registration_id?", "jurisdiction_id?", "period?", "status?", "applied_return_id?", "limit?", "offset?"]
    output: "Deposit[]"
    side_effects: []
  - method: POST
    path: "/deposits/{id}/pay"
    description: "Pay a SCHEDULED or LATE deposit; computes the late-payment penalty from the logical clock"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: [amount_cents]
    output: Deposit
    side_effects: ["status -> PAID; paid_at = logical clock; paid_amount_cents = amount_cents; penalty_cents computed"]
  - method: POST
    path: "/deposits/{id}/waive"
    description: "Waive an unpaid deposit"
    roles: [ComplianceAdmin]
    code: 200
    input: []
    output: Deposit
    side_effects: ["status SCHEDULED|LATE -> WAIVED"]

  # --- Credit claims ---
  - method: POST
    path: "/credit-claims"
    description: "Create a credit/refund claim (BAD_DEBT or EXPORT) against a FILED return"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 201
    input: [registration_id, return_id, claim_type, claimed_cents, event_ids, justification]
    output: CreditClaim
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/credit-claims/{id}"
    description: "Get a credit claim"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: CreditClaim
    side_effects: []
  - method: GET
    path: "/credit-claims"
    description: "List credit claims with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["registration_id?", "return_id?", "status?", "claim_type?", "limit?", "offset?"]
    output: "CreditClaim[]"
    side_effects: []
  - method: POST
    path: "/credit-claims/{id}/submit"
    description: "Submit a claim for review; computes eligible_cents and enforces claim windows"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: CreditClaim
    side_effects: ["status DRAFT -> SUBMITTED; submitted_by_user_id set; eligible_cents computed"]
  - method: POST
    path: "/credit-claims/{id}/approve"
    description: "Approve a SUBMITTED claim (SoD vs submitter); approved_cents capped by min(claimed, eligible, CLAIM_CAP)"
    roles: [TaxReviewer, ComplianceAdmin]
    code: 200
    input: [approved_cents]
    output: CreditClaim
    side_effects: ["status -> APPROVED; reviewed_by_user_id set"]
  - method: POST
    path: "/credit-claims/{id}/deny"
    description: "Deny a SUBMITTED claim (SoD vs submitter)"
    roles: [TaxReviewer, ComplianceAdmin]
    code: 200
    input: [reason]
    output: CreditClaim
    side_effects: ["status -> DENIED; reviewed_by_user_id set"]
  - method: POST
    path: "/credit-claims/{id}/apply"
    description: "Apply an APPROVED claim to its return (blocked by audit records hold)"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: CreditClaim
    side_effects: ["status -> APPLIED; applied_cents = approved_cents; return.credits_cents/net_due_cents recomputed; settlement may flip; OVERPAID excess -> registrant.overpayment_balance_cents"]
  - method: POST
    path: "/credit-claims/{id}/reverse"
    description: "Claw back an applied credit (e.g. bad-debt recovery); partial reversals keep APPLIED, full reversal -> REVERSED"
    roles: [TaxReviewer, ComplianceAdmin]
    code: 200
    input: [amount_cents]
    output: CreditClaim
    side_effects: ["reversed_cents += amount_cents; return.credits_cents -= amount_cents; net_due/settlement recomputed; bond requirement recomputed"]
  - method: POST
    path: "/credit-claims/{id}/withdraw"
    description: "Withdraw a DRAFT or SUBMITTED claim"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: CreditClaim
    side_effects: ["status -> WITHDRAWN"]
  - method: POST
    path: "/credit-claims/{id}/resubmit"
    description: "Send a DENIED claim back to DRAFT for correction (revision loop)"
    roles: [TaxAnalyst, ComplianceAdmin]
    code: 200
    input: []
    output: CreditClaim
    side_effects: ["status DENIED -> DRAFT; submitter/reviewer/eligible cleared"]

  # --- Audit cases ---
  - method: POST
    path: "/audit-cases"
    description: "Open an audit case over a month-bucket period range; overlapping ranges for the same (registration, jurisdiction) rejected while non-terminal; records_hold engages immediately"
    roles: [JurisdictionAuditor]
    code: 201
    input: [registration_id, jurisdiction_id, period_start, period_end]
    output: AuditCase
    side_effects: ["status=OPENED; records_hold=true"]
  - method: GET
    path: "/audit-cases/{id}"
    description: "Get an audit case"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: []
  - method: GET
    path: "/audit-cases"
    description: "List audit cases with filters"
    roles: [ComplianceAdmin, TaxAnalyst, TaxReviewer, JurisdictionAuditor]
    code: 200
    input: ["registration_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: "AuditCase[]"
    side_effects: []
  - method: POST
    path: "/audit-cases/{id}/request-documents"
    description: "OPENED -> DOCUMENTS_REQUESTED"
    roles: [JurisdictionAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["status -> DOCUMENTS_REQUESTED"]
  - method: POST
    path: "/audit-cases/{id}/begin-review"
    description: "OPENED|DOCUMENTS_REQUESTED -> UNDER_REVIEW"
    roles: [JurisdictionAuditor]
    code: 200
    input: []
    output: AuditCase
    side_effects: ["status -> UNDER_REVIEW"]
  - method: POST
    path: "/audit-cases/{id}/close"
    description: "UNDER_REVIEW -> CLOSED_NO_CHANGE | CLOSED_ASSESSMENT; releases the records hold"
    roles: [JurisdictionAuditor]
    code: 200
    input: [outcome, "assessment_cents?"]
    output: AuditCase
    side_effects: ["status -> terminal per outcome; records_hold released; assessment_cents recorded when outcome=ASSESSMENT"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, malformed, or names an undeclared role" }
  - { id: ERR_FORBIDDEN_FOR_ROLE, http: 403, condition: "Caller role is declared but not in the endpoint's roles" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum member, quantity_units < 1, amount_cents < 1, bad period-key format, QUARTERLY jurisdiction with SEMI_MONTHLY deposit_frequency, effective_to <= effective_from, valid_to < valid_from, period_end < period_start" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id (left-to-right) or body FK id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Current state of the target resource does not permit the transition (incl. terminal-state lockdown)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_<parent>_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Filer equals prepared_by_user_id on filing, or approver equals submitted_by_user_id on claim approve/deny" }
  - { id: ERR_AUDIT_RECORDS_HOLD, http: 409, condition: "An AuditCase with records_hold covers the period: amendment, RETURNED-event reclassify, claim apply, purge, or revoke blocked" }
  - { id: ERR_REGISTRATION_NOT_ACTIVE, http: 409, condition: "Registration not ACTIVE for a taxable-activity, movement, or return-creation operation" }
  - { id: ERR_PERIOD_LOCKED, http: 409, condition: "The period's latest non-superseded return is FILED and no open amendment exists; new ratings must go through an amendment" }
  - { id: ERR_BAD_DEBT_TOO_EARLY, http: 409, condition: "BAD_DEBT claim submitted before return.filed_at + 183 days" }
  - { id: ERR_CLAIM_WINDOW_EXPIRED, http: 409, condition: "Claim submitted after return.filed_at + 731 days" }
  - { id: ERR_BOND_WINDOW_ELAPSED, http: 409, condition: "Bond activation attempted when effective_to < current logical date" }
  - { id: ERR_RETENTION_NOT_ELAPSED, http: 409, condition: "Purge attempted before the period's retention anchor + 7 years" }
  - { id: ERR_DUPLICATE_FEIN, http: 409, condition: "fein already used by another registrant" }
  - { id: ERR_DUPLICATE_CODE, http: 409, condition: "code already used by another jurisdiction / product class" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "A non-REVOKED registration already exists for (registrant, jurisdiction)" }
  - { id: ERR_DUPLICATE_RETURN, http: 409, condition: "A non-SUPERSEDED original return already exists for (registration, jurisdiction, period)" }
  - { id: ERR_AMENDMENT_ALREADY_OPEN, http: 409, condition: "An amendment with filing_status IN {DRAFT, SUBMITTED} already exists for the parent return" }
  - { id: ERR_RATE_WINDOW_OVERLAP, http: 409, condition: "TaxRate half-open window overlaps another non-superseded rate for the same (jurisdiction, product_class)" }
  - { id: ERR_CERTIFICATE_WINDOW_OVERLAP, http: 409, condition: "Certificate closed window touches or overlaps another PENDING_VERIFICATION/ACTIVE certificate for the same (registration, customer_reference, product_class)" }
  - { id: ERR_AUDIT_RANGE_OVERLAP, http: 409, condition: "Audit period range shares a month bucket with another non-terminal audit case for the same (registration, jurisdiction)" }
  - { id: ERR_MOVEMENT_QUANTITY_EXCEEDS, http: 422, condition: "quantity_received_units < 0 or > quantity_units" }
  - { id: ERR_CROSS_REGISTRANT_REFERENCE, http: 422, condition: "Referenced entity belongs to a different registrant chain" }
  - { id: ERR_REGISTRATION_JURISDICTION_MISMATCH, http: 422, condition: "event.jurisdiction_id != registration.jurisdiction_id, or claim.return_id disagrees with claim registration/jurisdiction" }
  - { id: ERR_CERTIFICATE_NOT_ACTIVE, http: 409, condition: "Referenced exemption certificate is not ACTIVE at rating time" }
  - { id: ERR_CERTIFICATE_NOT_APPLICABLE, http: 422, condition: "Certificate does not cover the event's date, product class, customer, or type" }
  - { id: ERR_MOVEMENT_NOT_LINKABLE, http: 422, condition: "Referenced movement is wrong registration/class or not IN_TRANSIT/RECEIVED" }
  - { id: ERR_EVENT_ALREADY_CLAIMED, http: 409, condition: "An event is already listed on another claim with status IN {SUBMITTED, APPROVED, APPLIED}" }
  - { id: ERR_EXPORT_DOCUMENTATION_MISSING, http: 422, condition: "EXPORT claim lists an event with is_export == false" }
  - { id: ERR_NO_APPLICABLE_RATE, http: 422, condition: "No TaxRate window contains the event_date for the (jurisdiction, product_class)" }
  - { id: ERR_BOND_INSUFFICIENT, http: 409, condition: "bond_coverage_cents < bond_required_cents at registration activation/reinstatement" }
  - { id: ERR_CLAIM_EXCEEDS_ELIGIBLE, http: 422, condition: "approved_cents > min(claimed_cents, eligible_cents, CLAIM_CAP_CENTS)" }
  - { id: ERR_REVERSE_EXCEEDS_APPLIED, http: 422, condition: "reverse amount_cents > applied_cents - reversed_cents" }
  - { id: ERR_REGISTRATION_HAS_OPEN_LIABILITY, http: 409, condition: "Revoke attempted with open (DRAFT/SUBMITTED) returns or FILED returns still AWAITING_PAYMENT" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ComplianceAdmin
    description: "Compliance team administrator: owns configuration (jurisdictions, product classes, rates), registrations, bonds, notice application, deposit waivers, record purges, and the logical clock. May perform preparer and reviewer operations, but segregation-of-duties still binds the same X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /jurisdictions, POST /product-classes, POST /tax-rates"
      - "POST /registrants"
      - "POST /registrations and registration lifecycle (activate/suspend/reinstate/revoke)"
      - "POST /bonds and bond lifecycle (activate/cancel)"
      - "POST /rate-change-notices/{id}/apply"
      - "POST /deposits/{id}/waive"
      - "POST /registrations/{id}/purge-expired-records"
      - "POST /bonded-movements/{id}/default"
    shared_operations:
      - "Taxable event preparation, movement dispatch/receipt, return preparation, claim preparation (shared with TaxAnalyst)"
      - "Return filing, claim approval/denial/reversal, certificate verify/revoke, notice validate/reject, movement discharge (shared with TaxReviewer)"
      - "All GET endpoints (shared with all roles)"
  - name: TaxAnalyst
    description: "Compliance preparer: records taxable activity, classifies and rates events, prepares returns and deposits, drafts and submits credit claims, documents bonded movements and certificates. Cannot file returns or approve claims."
    identity: opaque
    exclusive_operations:
      - "POST /taxable-events and classify/rate/reclassify/void"
      - "POST /returns, POST /returns/{id}/submit, POST /returns/{id}/withdraw, POST /returns/{id}/amend"
      - "POST /deposits/{id}/pay"
      - "POST /credit-claims and submit/resubmit/withdraw"
      - "POST /bonded-movements and dispatch/receive"
      - "POST /exemption-certificates"
      - "POST /rate-change-notices"
    shared_operations:
      - "All GET endpoints (shared with all roles)"
      - "Preparation operations are shared with ComplianceAdmin, who can do them but then cannot also file/approve the same object (SoD)"
  - name: TaxReviewer
    description: "Compliance reviewer/approver: files submitted returns, approves or denies credit claims, verifies/revokes exemption certificates, validates/rejects rate notices, discharges bonded movements. Cannot prepare the objects it approves (SoD by X-User-ID)."
    identity: opaque
    exclusive_operations:
      - "POST /returns/{id}/file"
      - "POST /credit-claims/{id}/approve, /deny, /reverse"
      - "POST /exemption-certificates/{id}/verify, /revoke"
      - "POST /rate-change-notices/{id}/validate, /reject"
      - "POST /bonded-movements/{id}/discharge"
    shared_operations:
      - "All GET endpoints (shared with all roles)"
      - "Approval operations shared with ComplianceAdmin under the same SoD constraint"
  - name: JurisdictionAuditor
    description: "External jurisdiction auditor: opens and works audit cases, requests documents, closes with or without assessment. Read access to everything; write access only to audit cases."
    identity: opaque
    exclusive_operations:
      - "POST /audit-cases and request-documents/begin-review/close"
    shared_operations:
      - "All GET endpoints (shared with all roles)"
  - name: System
    description: "Internal automation (clock sweep and cascades): expiry/default transitions, deposit LATE marking, rate window activation, auto return/deposit creation, settlement flips. Not callable via the API except through POST /_clock/set_current_utc and cascade side effects."
    identity: opaque
    exclusive_operations:
      - "Clock sweep transitions (certificate/bond/rate expiry, movement timeout default, deposit LATE, registrant suspension)"
      - "Cascade-maintained transitions (event RATED->RETURNED at filing, deposit PAID->APPLIED at filing, settlement flips)"
    shared_operations: []
