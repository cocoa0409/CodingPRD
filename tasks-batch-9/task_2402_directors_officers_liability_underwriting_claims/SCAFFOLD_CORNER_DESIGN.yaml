      - name: defense_invoice_guards_on_amounts_reference_and_state
        claim_type: error_triggerable
        grounds:
          - validations[priority=78]
          - validations[priority=77]
          - validations[priority=47]
          - errors[ERR_DEFENSE_INVOICE_NOT_FOUND]
          - calculations.defense_advancement_waterfall
        distinguishing_aspect: |
          Three guards protect the invoice ledger — the three matter buckets must reconcile to the
          billed amount (78), invoice_reference is unique per claim (77), and an invoice may be
          allocated only once (47) — plus the invoice's own 404. The successful allocation is the
          degenerate waterfall case: an invoice smaller than the outstanding retention advances
          NOTHING, erodes no coverage part, and yet still moves the claim to DEFENSE_ADVANCING and
          burns down the retention. The second allocate must be answered by the invoice-state guard,
          not by the stale-version guard, so it is re-issued with the claim's current version.
        test_recipe:
          setup:
            - "One bound 10,000,000 / 250,000 policy on Vantiq Bio Inc with one accepted claim under RELATIVE_EXPOSURE allocation; clock at 2026-09-02, premium INVOICED and not yet delinquent (premium_due_date 2026-08-31 with no ops run)."
