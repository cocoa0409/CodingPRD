  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: pay_period_half_open_overlap_rejected
        grounds:
          - validations[priority=14.7]
          - entities.PayPeriod.fields.start_at
          - entities.PayPeriod.fields.end_at
          - errors[ERR_PERIOD_OVERLAP]
        distinguishing_aspect: |
          Half-open interval semantics on PayPeriod: a new period [06-07,06-14)
          overlapping an existing [06-01,06-08) is rejected, but an abutting period
          [06-08,06-15) (start == prior end) is allowed — adjacency permitted,
          interior overlap forbidden.
        test_recipe:
          setup:
            - "Employer with an existing OPEN period 2026-06-01..2026-06-08."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp1_id: $.data.id }
          trigger:
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-07T00:00:00Z", end_at: "2026-06-14T00:00:00Z" }
              as: PayrollOfficer
              captures: { error_id: $.data.error_id }
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-08T00:00:00Z", end_at: "2026-06-15T00:00:00Z" }
              as: PayrollOfficer
              captures: { abut_status: $.data.status }
          assert:
            - "Overlapping period [06-07,06-14) returns 409 ERR_PERIOD_OVERLAP"
            - "Abutting period [06-08,06-15) succeeds with status OPEN (adjacency allowed)"

      - name: time_entry_shift_closed_plus_rest_buffer_overlap_rejected
        grounds:
          - validations[priority=14.5]
          - entities.TimeEntry.fields.shift_start_at
          - entities.TimeEntry.fields.shift_end_at
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          Closed-interval-plus-30min-rest-buffer semantics on TimeEntry (different
          resource and different interval geometry than PayPeriod's half-open): a new
          shift 15min after an existing one (12:15) violates the buffer and is
          rejected; a shift exactly 30min after (12:30) is allowed.
        test_recipe:
          setup:
            - "Worker with one POSTED shift 2026-06-02T08:00..12:00 in an OPEN period."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /employers"
              payload: { legal_name: "Acme", state_code: "CA", pay_frequency: "WEEKLY", funding_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /pay-periods"
              payload: { employer_id: "${emp_id}", start_at: "2026-06-01T00:00:00Z", end_at: "2026-06-08T00:00:00Z" }
              as: PayrollOfficer
              captures: { pp_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_id: "${emp_id}", external_payroll_ref: "EMP-1", full_name: "Wanda", hourly_rate_cents: 2000, hire_date: "2025-06-01T00:00:00Z" }
              as: PayrollOfficer
              captures: { w_id: $.data.id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T08:00:00Z", shift_end_at: "2026-06-02T12:00:00Z", hours_worked: 4.0 }
              as: PayrollOfficer
          trigger:
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T12:15:00Z", shift_end_at: "2026-06-02T14:15:00Z", hours_worked: 2.0 }
              as: PayrollOfficer
              captures: { error_id: $.data.error_id }
            - call: "POST /time-entries"
              payload: { pay_period_id: "${pp_id}", worker_id: "${w_id}", shift_start_at: "2026-06-02T12:30:00Z", shift_end_at: "2026-06-02T14:30:00Z", hours_worked: 2.0 }
              as: PayrollOfficer
              captures: { ok_status: $.data.status }
          assert:
            - "Shift 12:15-14:15 (15min gap) returns 409 ERR_SHIFT_OVERLAP"
