              as: PlatformAdmin
            - &d_tier2
              call: "POST /portal/pricing-tiers"
              payload: { agency_id: "${ag2_id}", volume_min_cents: 500001, volume_max_cents: 2000000, rate_bp: 190, per_txn_cents: 15, effective_month: "2026-09" }
              as: PlatformAdmin
            - &d_tier3
              call: "POST /portal/pricing-tiers"
