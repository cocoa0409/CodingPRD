  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: fee_single_rounding_of_the_full_factor_product_beats_per_factor_rounding
        grounds:
          - calculations.escalating_false_alarm_fee
          - calculations.invoice_assembly
          - calculations.ecv_verification_sufficiency
          - entities.FalseAlarmIncident.fields.fee_basis
          - entities.FeeSchedule.fields.non_ecv_surcharge_pct
        distinguishing_aspect: >-
          A SCHOOL occupancy (1.25) DURESS alarm reported with verification_method NONE (surcharge
          factor 1.20) on tier base 3333 must be assessed round_half_up(3333 * 1.25 * 1.20) = 5000,
          which is one cent-group above the 4999 that any per-factor rounding order produces, and
          the invoice's single line must carry the combined 1.50 multiplier rather than two
          successive roundings.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule whose tier 3 base_fee_cents is 3333, occupancy_multipliers.SCHOOL = 1.25, non_ecv_surcharge_pct = 0.20, per_incident_fee_cap_cents = 100000, free_alarm_allowance = 2."
            - "One SCHOOL AlarmSite with two ACTIVE ECV-callable contacts and three PERMITTED systems (one per incident)."
            - "Two prior COUNTED incidents (occurrence_index 1 and 2, tier base 0, no invoice)."
            - "The third DispatchRequest is alarm_type DURESS with verification_method NONE and an empty call_attempts array: DURESS bypasses ECV so the request is still validatable, yet NONE keeps the non-ECV surcharge alive."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-01-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
              payload:
                <<: *fs_base
                schedule_code: "FS-2507-ROUND"
                effective_from: "2026-01-01T00:00:00Z"
                fee_tiers:
                  - {from_index: 1, to_index: 2, base_fee_cents: 0}
                  - {from_index: 3, to_index: 3, base_fee_cents: 3333}
                  - {from_index: 4, to_index: 4, base_fee_cents: 25000}
                  - {from_index: 5, to_index: 5, base_fee_cents: 40000}
                  - {from_index: 6, to_index: null, base_fee_cents: 75000}
              as: ProgramAdministrator
              captures: {sched_id: $.data.id}
            - {call: "POST /false-alarm-program/fee-schedules/${sched_id}/activate", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Campus Alarm Co", license_number: "AC-2507-RN", contact_email: "ops@campusalarm2507.example", contact_phone: "+15550100501", score_mode: "PERIOD_EQUAL"}, as: ProgramAdministrator, captures: {company_id: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-RN-9-SCHOOLHOUSE-RD", street_address: "9 Schoolhouse Rd", city: "Fairview", zip_code: "44011", occupancy_class: "SCHOOL", police_beat: "B07"}, as: PermitClerk, captures: {site_id: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Principal Ada Voss", phone_number: "+15550100502", relationship: "MANAGER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {c1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Custodian Ben Ruiz", phone_number: "+15550100503", relationship: "KEYHOLDER", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {c2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 20, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-11-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys1: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 14, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2025-11-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "PANIC", zone_count: 4, ecv_enabled: false, verified_response_mode: "NONE", installed_at: "2025-11-01T00:00:00Z"}, as: ProgramAdministrator, captures: {sys3: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys1}/approve-registration", payload: {}, as: PermitClerk, captures: {permit1: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys2}/approve-registration", payload: {}, as: PermitClerk, captures: {permit2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems/${sys3}/approve-registration", payload: {}, as: PermitClerk, captures: {permit3: $.data.id}}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-05T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys1}", alarm_type: "DURESS", verification_method: "NONE", call_attempts: [], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-02-05T09:00:00Z", idempotency_key: "rn-2507-1"}, as: AlarmCompanyOperator, as_user_id: "${company_id}", captures: {dr1: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr1}/validate", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr1}/record-dispatch", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/false-alarm-incidents", payload: {dispatch_request_id: "${dr1}", cause_code: "OPERATOR_ERROR"}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507", captures: {inc1: $.data.id}}
            - {call: "POST /false-alarm-program/false-alarm-incidents/${inc1}/determination", payload: {determination: "COUNTED"}, as: FalseAlarmReviewOfficer, as_user_id: "rev-2507"}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-12T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys2}", alarm_type: "DURESS", verification_method: "NONE", call_attempts: [], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-02-12T09:00:00Z", idempotency_key: "rn-2507-2"}, as: AlarmCompanyOperator, as_user_id: "${company_id}", captures: {dr2: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr2}/validate", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr2}/record-dispatch", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/false-alarm-incidents", payload: {dispatch_request_id: "${dr2}", cause_code: "OPERATOR_ERROR"}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507", captures: {inc2: $.data.id}}
            - {call: "POST /false-alarm-program/false-alarm-incidents/${inc2}/determination", payload: {determination: "COUNTED"}, as: FalseAlarmReviewOfficer, as_user_id: "rev-2507"}
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-02-20T00:00:00Z"}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/dispatch-requests", payload: {alarm_system_id: "${sys3}", alarm_type: "DURESS", verification_method: "NONE", call_attempts: [], audio_video_evidence: false, guard_on_scene: false, occurred_at: "2026-02-20T09:00:00Z", idempotency_key: "rn-2507-3"}, as: AlarmCompanyOperator, as_user_id: "${company_id}", captures: {dr3: $.data.id}}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr3}/validate", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/dispatch-requests/${dr3}/record-dispatch", payload: {}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507"}
            - {call: "POST /false-alarm-program/false-alarm-incidents", payload: {dispatch_request_id: "${dr3}", cause_code: "OPERATOR_ERROR", narrative: "Duress button pressed during a fire drill."}, as: PoliceDispatchSupervisor, as_user_id: "sup-2507", captures: {inc3: $.data.id}}
          trigger:
            - {call: "POST /false-alarm-program/false-alarm-incidents/${inc3}/determination", payload: {determination: "COUNTED", review_notes: "Third chargeable occurrence, non-ECV verified."}, as: FalseAlarmReviewOfficer, as_user_id: "rev-2507", captures: {inc3_fee: $.data.assessed_fee_cents}}
            - {call: "GET /false-alarm-program/penalty-invoices?false_alarm_incident_id=${inc3}", payload: {}, as: BillingClerk}
          assert:
            - "FalseAlarmIncident.${inc3}.occurrence_index == 3"
            - "FalseAlarmIncident.${inc3}.assessed_fee_cents == 5000 (NOT 4999, which is what rounding 3333*1.25 to 4166 first would give)"
            - "FalseAlarmIncident.${inc3}.fee_basis.tier_base_cents == 3333"
            - "FalseAlarmIncident.${inc3}.fee_basis.occupancy_multiplier == 1.25"
            - "FalseAlarmIncident.${inc3}.fee_basis.non_ecv_surcharge_applied == true"
            - "FalseAlarmIncident.${inc3}.fee_basis.unpermitted_multiplier_applied == false"
            - "FalseAlarmIncident.${inc3}.fee_basis.cap_applied == false and aggravation_cents == 0"
            - "DispatchRequest.${dr3}.ecv_sufficient == true and distinct_ecv_contact_count == 0 (DURESS bypass)"
            - "the FALSE_ALARM_FEE invoice has exactly 1 line_item with code FALSE_ALARM_BASE, unit_amount_cents 3333, multiplier 1.50, extended_cents 5000"
            - "that invoice.subtotal_cents == 5000, admin_fee_cents == 500 (the 250-cent raw fee is lifted to the 500-cent floor), assessed_cents == 5500"
            - "AlarmSite.${site_id}.lifetime_assessed_cents == 22000 (three 5500-cent permit-issue invoices plus this 5500)"

      - name: admin_fee_ceiling_clamps_before_it_joins_assessed_cents
        grounds:
          - calculations.invoice_assembly
          - entities.FeeSchedule.fields.admin_fee_max_cents
          - entities.PenaltyInvoice.fields.admin_fee_cents
          - state_machines.AlarmSystem.SUBMITTED_to_PERMITTED
        distinguishing_aspect: >-
          On a 200000-cent permit-issue subtotal the raw 5 percent administrative fee is 10000, but
          admin_fee_max_cents 5000 clamps it before summation, so assessed_cents is exactly 205000
          rather than the 210000 an unclamped fee would produce.
        test_recipe:
          setup:
            - "One ACTIVE FeeSchedule with permit_issue_fee_cents = 200000, admin_fee_pct = 0.05, admin_fee_min_cents = 500, admin_fee_max_cents = 5000, delinquent_balance_block_cents = 50000."
            - "One GOVERNMENT AlarmSite (multiplier 1.00) with two ACTIVE ECV-callable contacts, zero outstanding balance, and one AlarmSystem in SUBMITTED."
            - "No suspension order and no prior invoice, so the pre-issuance balance check at SUBMITTED -> PERMITTED sees 0 and passes even though the invoice it creates exceeds the 50000-cent block."
          setup_api_calls:
            - {call: "POST /false-alarm-program/_clock/set_current_utc", payload: {current_utc: "2026-06-01T00:00:00Z"}, as: ProgramAdministrator}
            - call: "POST /false-alarm-program/fee-schedules"
              payload: {<<: *fs_base, schedule_code: "FS-2507-CLAMP", effective_from: "2026-06-01T00:00:00Z", permit_issue_fee_cents: 200000}
              as: ProgramAdministrator
              captures: {sched_id: $.data.id}
            - {call: "POST /false-alarm-program/fee-schedules/${sched_id}/activate", payload: {}, as: ProgramAdministrator}
            - {call: "POST /false-alarm-program/alarm-companies", payload: {legal_name: "Civic Guard Systems", license_number: "AC-2507-CL", contact_email: "ops@civicguard2507.example", contact_phone: "+15550100601", score_mode: "PERIOD_EQUAL"}, as: ProgramAdministrator, captures: {company_id: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-sites", payload: {address_key: "2507-CL-1-CIVIC-PLAZA", street_address: "1 Civic Plaza", city: "Fairview", zip_code: "44011", occupancy_class: "GOVERNMENT", police_beat: "B01"}, as: PermitClerk, captures: {site_id: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Facilities Desk", phone_number: "+15550100602", relationship: "MANAGER", contact_priority: 1, is_ecv_callable: true}, as: PermitClerk, captures: {c1: $.data.id}}
            - {call: "POST /false-alarm-program/site-contacts", payload: {alarm_site_id: "${site_id}", full_name: "Night Custodian", phone_number: "+15550100603", relationship: "KEYHOLDER", contact_priority: 2, is_ecv_callable: true}, as: PermitClerk, captures: {c2: $.data.id}}
            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_id}", monitoring_company_id: "${company_id}", system_type: "BURGLARY", zone_count: 30, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-05-20T00:00:00Z"}, as: ProgramAdministrator, captures: {sys1: $.data.id}}
          trigger:
            - {call: "POST /false-alarm-program/alarm-systems/${sys1}/approve-registration", payload: {}, as: PermitClerk, captures: {permit1: $.data.id}}
            - {call: "GET /false-alarm-program/penalty-invoices?alarm_site_id=${site_id}&kind=PERMIT_ISSUE_FEE", payload: {}, as: BillingClerk}
            - {call: "GET /false-alarm-program/alarm-sites/${site_id}", payload: {}, as: PermitClerk}
          assert:
            - "the PERMIT_ISSUE_FEE invoice has 1 line_item with code PERMIT_ISSUE, unit_amount_cents 200000, multiplier 1.00, extended_cents 200000"
            - "that invoice.subtotal_cents == 200000"
            - "that invoice.admin_fee_cents == 5000 (raw 10000 clamped down by admin_fee_max_cents)"
            - "that invoice.assessed_cents == 205000 (NOT 210000)"
            - "that invoice.late_penalty_cents == 0 and outstanding_cents == 205000"
            - "AlarmSystem.${sys1}.status == 'PERMITTED' and AlarmPermit.${permit1}.status == 'ACTIVE'"
            - "AlarmSite.${site_id}.outstanding_balance_cents == 205000 and renewal_block_active == true (the block appears only after issuance)"
            - "AlarmSite.${site_id}.governing_fee_schedule_id == ${sched_id}"

      - name: delinquency_late_penalty_precedes_the_collections_tier_lookup
        grounds:
          - calculations.delinquency_escalation
          - calculations.invoice_assembly
          - state_machines.PenaltyInvoice.CURRENT_to_NOTICE
          - state_machines.PenaltyInvoice.FINAL_NOTICE_to_REFERRED
          - entities.PenaltyInvoice.fields.referral_total_cents
