        claim_type: input_set_filtering
        grounds: [calculations.calc_participation_window]
        distinguishing_aspect: "The 24-month half-open window includes occurred_on == window_start, excludes occurred_on == clock.now, and excludes PENDING_VERIFICATION rows; frozen snapshot at submit reflects exactly the VERIFIED subset."
        test_recipe:
          setup: ["Clock 2026-08-01; nurse PW with: VERIFIED 5 pts at 2024-08-01 (exactly window_start, included), VERIFIED 5 pts at 2026-08-01 (exactly clock.now, excluded), PENDING 5 pts at 2026-01-01 (excluded by status)"]
          setup_api_calls:
            - call: "POST /clinical-ladder/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /clinical-ladder/ladder-criteria"
              payload: { target_level: "CN_II", min_portfolio_score: 75, min_participation_points: 5, required_certification_track: "NONE", differential_monthly_cents: 30000, effective_from: "2026-01-01T00:00:00Z", effective_until: null }
