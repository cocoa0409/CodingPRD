            - call: "POST /api/v1/background-checks/${bg11_id}/clear"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/v1/pets"
              payload: { owner_id: "${o11_id}", name: "PetA", species: "DOG", weight_kg: 10 }
              as: Owner
              as_user_id: "${o11_id}"
              captures: { p11a_id: $.data.id }
            - call: "POST /api/v1/pets"
