            - "${e_listing_create}, ${e_relist}, ${e_ack}, ${e_poa}, ${e_appeal}, ${e_escalate} are all ERR_UNAUTHORIZED"
            - "${e_escalate} is ERR_UNAUTHORIZED and not ERR_APPEAL_NOT_FOUND — priority 20 beats priority 30"
            - "no Listing, PlanOfAction or Appeal row was created; EnforcementAction.${a1}.state is still ISSUED and version is ${a1_ver}"

      - name: rbac_investigator_only_writes_cannot_be_performed_by_officers_or_reviewers
        claim_type: exclusive_operations
        grounds:
          - "roles.PolicyInvestigator.exclusive_operations"
          - "roles.ComplianceOfficer.shared_operations"
        distinguishing_aspect: |
          The officer is the strongest role in the domain — it owns the catalogue, the metric feed and
          the funds — yet the four investigation writes are closed to it, which is what keeps the case
          file and its review separate. The contrast is sharp because POST /violations IS shared with
          the officer: filing a report is open, while opening the investigation, adjudicating it,
          issuing the action and opening the reserve are investigator-exclusive.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00.000Z."
            - "PolicyRule LA-RB2-1 (LISTING_ACCURACY, base 2.00, ACCOUNT, requires_poa false)."
            - "The officer files the violation itself (a shared operation) to prove the boundary is per-endpoint."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: ComplianceOfficer
