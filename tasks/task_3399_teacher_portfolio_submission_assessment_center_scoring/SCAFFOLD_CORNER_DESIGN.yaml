            - "ScoringAssignment.${z2}.is_within_tolerance == true (|3.25 - 3.00| == 0.25 <= 0.25, inclusive boundary)"
            - "Assessor.${asz}.calibration_failures == 1 and calibration_passes == 2 after the third read (2.75 also within tolerance)"
            - "Assessor.${asz}.status == CALIBRATED (auto-transition at exactly 2 passes)"

