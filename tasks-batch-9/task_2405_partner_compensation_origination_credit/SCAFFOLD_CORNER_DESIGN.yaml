              captures: { r2: "$.data.id" }
            - call: "POST /comp/peer-reviews/${r1}/decide"
              payload: { outcome: "SCORE", technical_score: 4, collaboration_score: 4, client_service_score: 4, comment: "Reliable." }
              as: Partner
