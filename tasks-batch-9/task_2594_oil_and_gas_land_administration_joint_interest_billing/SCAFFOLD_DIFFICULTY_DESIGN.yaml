        grounds:
          - validations[priority=55, error_id=ERR_OWNER_NOT_COMPLIANT]
          - validations[priority=75, error_id=ERR_INSUFFICIENT_BOND]
          - calculations.bond_coverage_requirement
          - state_machines.AssignmentTransfer.PPR_WAIVED_to_CLOSED
          - endpoints.POST_/land-admin/assignment-transfers/{transfer_id}/closing
        conflicting_pair:
          higher: { priority: 55, category: state, error_id: ERR_OWNER_NOT_COMPLIANT, http: 409 }
          lower: { priority: 75, category: business_fiscal, error_id: ERR_INSUFFICIENT_BOND, http: 402 }
        distinguishing_aspect: |
          A different pair of categories: cross-entity compliance state versus a fiscal capacity check.
          The grantee OB has had its tax id withdrawn AND posts no bond at all, while the conveyance
