# =============================================================================
# SCAFFOLD.yaml — task_3004_store_rebate_certificate_program_store_credit_liability
# In-Store Rebate Certificate Program & Store-Credit Liability (Menards-style)
# §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  In-Store Rebate Certificate Program & Store-Credit Liability (Menards): rebate-eligible
  item flagging by advertised week with per-item percentage and exclusion rules,
  receipt-based rebate submission windows with adjudication of mixed-tender and
  returned-item lines, rebate certificate issuance, expiration and reissue policy,
  store-credit liability accrual and breakage recognition, redemption restrictions
  barring rebate certificates from paying for further rebate-eligible purchases,
  contractor account aggregation of rebates across job purchases, fraud detection
  on split transactions and duplicate receipt submission, guest service reversal
  when rebated merchandise is returned.

domain_name: store-rebate-certificates
api_prefix: ""

complexity_profile:
  primary_archetype: ledger_reconciliation        # store-credit liability ledger vs certificate balances, two algorithms
  secondary_archetype: temporal_windowing         # advertised weeks, submission windows, certificate expiry, split-transaction windows
  complexity_layers:
    - dual_variant_calculation                    # provisional vs adjudicated award; gross vs net-of-breakage liability
    - cascading_side_effects                      # return → submission reversal → certificate void → ledger reversal → liability recompute
    - derived_field_reconciliation                # CreditAccount balances, Store liability fields derived from ledger
    - optimistic_concurrency                      # OCC on Store.version for config + breakage-run epoch, OCC on CreditAccount.version for adjustments
  entity_topology: hybrid                         # Store tree + flat cross-references (Receipt↔RebateProgram, Submission↔Certificate)
  state_machine_shape: cyclic                     # RebateCertificate EXPIRED→REISSUED→ACTIVE loop; RebateSubmission REJECTED→SUBMITTED resubmission loop
  relationship_patterns:
    - one_to_many                                 # Store→Receipt, Submission→SubmissionLine
    - many_to_many                                # Receipt↔RebateProgram via ReceiptLine.program_item_id claims
    - cross_aggregate                             # Certificate→Submission crosses the submission aggregate into the credit aggregate
  role_model: peer_roles                          # GuestService / FraudAnalyst / FinanceAdmin / StoreAdmin own disjoint operations; Customer/Contractor entity-backed
  consistency_model: immediate                    # every cascade settles inside the request

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (14 entities)
# =============================================================================
entities:
  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Human-facing store code; unique across the platform" }
      - { name: submission_window_days, type: integer, source: input, description: "Days after the purchase DATE during which a receipt may be submitted; submission deadline is (purchase_at date at 00:00:00Z) + submission_window_days days, deadline instant INCLUDED" }
      - { name: certificate_validity_months, type: integer, source: input, description: "Whole calendar months a certificate stays ACTIVE from its issue date; expires at 00:00:00Z on the same day-of-month that many months later" }
      - { name: expected_breakage_rate, type: number, source: input, description: "Fraction in [0,1] of issued certificate value expected never to be redeemed; drives the net liability variant" }
      - { name: split_txn_window_hours, type: integer, source: input, description: "Half-open lookback window in hours used by split-transaction fraud detection" }
      - { name: split_txn_min_receipts, type: integer, source: input, description: "Minimum distinct same-account receipts inside the split window that triggers a SPLIT_TRANSACTION flag" }
      - { name: outstanding_liability_cents, type: integer, source: computed, description: "Gross store-credit liability per calculation store_credit_liability (gross variant)" }
      - { name: net_liability_cents, type: integer, source: computed, description: "Net-of-expected-breakage liability per calculation store_credit_liability (net variant)" }
      - { name: accrued_breakage_income_cents, type: integer, source: computed, description: "Cumulative breakage income recognized by BreakageRuns" }
      - { name: liability_epoch, type: integer, source: computed, description: "Monotonically increasing epoch stamped by each BreakageRun on this store", default: 0 }

  - name: RebateProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program label, e.g. '11% Everything Week 36'" }
      - { name: week_start_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) on which the advertised week opens at 00:00:00Z" }
      - { name: week_end_date, type: string, source: input, description: "ISO date on which the advertised week closes; the week is the half-open interval [week_start_date 00:00:00Z, week_end_date 00:00:00Z)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | CLOSED", constraints: "DRAFT on creation; ACTIVE only via activate; CLOSED only via close or auto-close" }

  - name: ProgramItem
    parent: RebateProgram
    common_fields: true
    fields:
      - { name: program_id, type: string, source: system, description: "FK -> RebateProgram.id; owning program" }
      - { name: sku, type: string, source: input, description: "Item SKU flagged rebate-eligible for this program's advertised week" }
      - { name: rebate_pct, type: number, source: input, description: "Rebate percentage as a fraction in (0,1], e.g. 0.11" }
      - { name: excluded_categories, type: array, source: input, description: "Category codes that override eligibility: a receipt line whose category is listed here earns zero rebate even though its SKU matches", default: [] }
      - { name: min_quantity, type: integer, source: input, description: "Minimum purchased (net-of-return) quantity on the receipt line for any rebate to apply; default 1", default: 1 }
      - { name: per_receipt_cap_cents, type: integer, source: input, description: "Optional per-receipt-line rebate cap in cents; null means uncapped; the cap compares against the line's rebate BEFORE rounding", constraints: "null or positive integer", default: null }

  - name: CreditAccount
    parent: null
    common_fields: true
    fields:
      - { name: owner_name, type: string, source: input, description: "Account holder display name" }
      - { name: account_type, type: enum, source: input, description: "RETAIL | CONTRACTOR", constraints: "CONTRACTOR accounts additionally carry contractor aggregation fields" }
      - { name: status, type: enum, source: system, description: "ACTIVE | FROZEN | CLOSED", constraints: "FROZEN blocks submissions, issuance and redemption but not accrual reversals" }
      - { name: credit_balance_cents, type: integer, source: computed, description: "Sum over non-terminal certificates issued to this account of remaining_balance_cents (per credit_account_balance calculation)" }
      - { name: pending_award_cents, type: integer, source: computed, description: "Sum of award_cents over this account's RebateSubmissions in status APPROVED (certificate not yet issued)" }
      - { name: lifetime_rebate_cents, type: integer, source: computed, description: "Cumulative adjudicated rebate cents ever awarded to this account (never decremented by reversals)" }

  - name: JobPurchase
    parent: CreditAccount
    common_fields: true
    fields:
      - { name: contractor_account_id, type: string, source: system, description: "FK -> CreditAccount.id; the CONTRACTOR account that owns this job" }
      - { name: job_reference, type: string, source: input, description: "Contractor's own job identifier; unique within the contractor account" }
      - { name: status, type: enum, source: system, description: "OPEN | SETTLED", constraints: "Only OPEN jobs accept receipt links" }

  - name: Receipt
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; issuing store" }
      - { name: receipt_number, type: string, source: input, description: "Register-assigned receipt number; unique per store — the natural key used by duplicate-submission fraud detection" }
      - { name: account_id, type: string, source: input, description: "FK -> CreditAccount.id; the purchasing account (retail or contractor)", constraints: "required" }
      - { name: job_purchase_id, type: string, source: input, description: "FK -> JobPurchase.id; optional contractor job this receipt is charged to", constraints: "null unless account is CONTRACTOR; when set the job must be OPEN and belong to account_id", default: null }
      - { name: purchase_at, type: datetime, source: input, description: "Timestamp of purchase; determines advertised-week eligibility and the submission deadline" }
      - { name: status, type: enum, source: system, description: "OPEN | PARTIALLY_RETURNED | FULLY_RETURNED", constraints: "derived from ReceiptLine returned quantities" }
      - { name: total_cents, type: integer, source: computed, description: "Sum of line total_cents over all lines (gross, pre-return)" }

  - name: ReceiptLine
    parent: Receipt
    common_fields: false
    fields:
      - { name: receipt_id, type: string, source: system, description: "FK -> Receipt.id; owning receipt" }
      - { name: line_number, type: integer, source: input, description: "1-based position on the receipt; unique within the receipt" }
      - { name: sku, type: string, source: input, description: "Purchased item SKU" }
      - { name: category, type: string, source: input, description: "Category code matched against ProgramItem.excluded_categories" }
      - { name: quantity, type: integer, source: input, description: "Units sold", constraints: ">= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Per-unit price in cents", constraints: ">= 0" }
      - { name: returned_quantity, type: integer, source: computed, description: "Cumulative units returned via Returns; 0 <= returned_quantity <= quantity", default: 0 }
      - { name: tender_splits, type: array, source: input, description: "How this line was paid: array of {tender_type, amount_cents}; tender_type in {CASH, CARD, GIFT_CARD, STORE_CREDIT_CERTIFICATE}; amounts sum exactly to quantity*unit_price_cents" }
      - { name: certificate_tendered_cents, type: integer, source: computed, description: "Sum of tender_splits entries with tender_type STORE_CREDIT_CERTIFICATE; the portion of the line funded by rebate certificates, which is ineligible as a rebate base" }

  - name: Return
    parent: Receipt
    common_fields: true
    fields:
      - { name: receipt_id, type: string, source: system, description: "FK -> Receipt.id; the receipt being returned against" }
      - { name: lines, type: array, source: input, description: "Array of {line_number, quantity}; each quantity >= 1 and cumulative returns per line must not exceed sold quantity" }
      - { name: processed_at, type: datetime, source: system, description: "Logical-clock timestamp when guest service processed the return" }
      - { name: reversal_entry_ids, type: array, source: system, description: "CreditLedgerEntry ids minted by the guest-service reversal cascade, empty when nothing had been awarded yet" }

  - name: RebateSubmission
    parent: CreditAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CreditAccount.id; submitting account; must equal the receipt's account" }
      - { name: receipt_id, type: string, source: input, description: "FK -> Receipt.id; the receipt being claimed" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | REVERSED", constraints: "REJECTED may cycle back to SUBMITTED via resubmit; APPROVED may move to REVERSED via guest-service return" }
      - { name: provisional_award_cents, type: integer, source: computed, description: "Award computed at submission time per rebate_award provisional variant" }
      - { name: award_cents, type: integer, source: computed, description: "Final adjudicated award per rebate_award adjudicated variant; set on APPROVED, null before adjudication" }
      - { name: rejection_reason, type: string, source: system, description: "Set on REJECTED; null otherwise" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of the current SUBMITTED entry; refreshed on resubmit" }
      - { name: resubmit_count, type: integer, source: computed, description: "Number of REJECTED→SUBMITTED cycles; starts at 0; hard-capped at MAX_RESUBMITS", default: 0 }

  - name: SubmissionLine
    parent: RebateSubmission
    common_fields: false
    fields:
      - { name: submission_id, type: string, source: system, description: "FK -> RebateSubmission.id; owning submission" }
      - { name: receipt_line_id, type: string, source: system, description: "FK -> ReceiptLine.id; the receipt line claimed" }
      - { name: program_item_id, type: string, source: system, description: "FK -> ProgramItem.id; the program item the line matched, null when the line matched no program item" }
      - { name: eligible_base_cents, type: integer, source: computed, description: "Certificate-tender-adjusted, return-adjusted rebate base per rebate_award calculation" }
      - { name: awarded_cents, type: integer, source: computed, description: "Per-line rounded rebate (adjudicated variant); 0 for ineligible lines" }
      - { name: exclusion_reason, type: enum, source: computed, description: "null | NO_PROGRAM_ITEM | EXCLUDED_CATEGORY | BELOW_MIN_QUANTITY | FULLY_CERTIFICATE_TENDERED | FULLY_RETURNED" }

  - name: RebateCertificate
    parent: CreditAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CreditAccount.id; holder" }
      - { name: submission_id, type: string, source: system, description: "FK -> RebateSubmission.id; the approved submission this certificate settles (null for reissued certificates, which carry reissued_from_id instead)" }
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; certificates are redeemable only at their issuing store" }
      - { name: issued_amount_cents, type: integer, source: system, description: "Face value at issuance; equals the settling submission's award_cents (or the source certificate's remaining balance on reissue)" }
      - { name: remaining_balance_cents, type: integer, source: computed, description: "Face value minus cumulative redemptions applied to this certificate" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PARTIALLY_REDEEMED | FULLY_REDEEMED | EXPIRED | REISSUED | VOIDED", constraints: "ACTIVE and PARTIALLY_REDEEMED are the only redeemable states; EXPIRED→REISSUED requires reissue flow; VOIDED is terminal by guest-service reversal" }
      - { name: fraud_hold, type: enum, source: system, description: "NONE | HELD | RELEASED", constraints: "Parallel state dimension: HELD blocks redemption and reissue without changing status" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock timestamp of issuance (or reissue)" }
      - { name: expires_at, type: datetime, source: computed, description: "issued_at advanced by Store.certificate_validity_months whole calendar months, evaluated at 00:00:00Z on the resulting day" }
      - { name: reissued_from_id, type: string, source: system, description: "FK -> RebateCertificate.id; source certificate when this one is a reissue; null for original issuances", default: null }

  - name: CreditLedgerEntry
    parent: CreditAccount
    common_fields: false
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CreditAccount.id; account whose ledger this entry posts to" }
      - { name: certificate_id, type: string, source: system, description: "FK -> RebateCertificate.id; the certificate this entry moves value against" }
      - { name: entry_type, type: enum, source: system, description: "ISSUANCE_ACCRUAL | REDEMPTION | REVERSAL_DEBIT | BREAKAGE_EXPIRY | REISSUE_CREDIT" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: accruals and reissue credits positive, redemptions and reversals negative, breakage negative (liability relief)" }
      - { name: liability_epoch, type: integer, source: system, description: "Store.liability_epoch at the time of posting; breakage entries carry the epoch of their BreakageRun" }
      - { name: created_note, type: string, source: system, description: "Free-text provenance (e.g. 'breakage run <id>', 'return <id>')" }

  - name: FraudFlag
    parent: CreditAccount
    common_fields: true
    fields:
      - { name: account_id, type: string, source: system, description: "FK -> CreditAccount.id; flagged account" }
      - { name: flag_type, type: enum, source: system, description: "SPLIT_TRANSACTION | DUPLICATE_RECEIPT" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | CLEARED", constraints: "CLEARED may cycle back to OPEN via reopen; CONFIRMED is terminal" }
      - { name: receipt_ids, type: array, source: system, description: "Receipts implicated: the split-transaction cluster, or the duplicate pair" }
      - { name: detail, type: string, source: system, description: "Machine-generated explanation (window edges, receipt numbers)" }

  - name: BreakageRun
    parent: Store
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; the store whose expired certificates are swept" }
      - { name: status, type: enum, source: system, description: "RUNNING | COMPLETED", constraints: "RUNNING while executing; COMPLETED once all side effects are posted — the request is atomic so only COMPLETED is ever observable" }
      - { name: run_at, type: datetime, source: system, description: "Logical-clock timestamp of the run" }
      - { name: expected_store_version, type: integer, source: input, description: "OCC: the Store.version the caller last observed" }
      - { name: expired_count, type: integer, source: computed, description: "Certificates transitioned ACTIVE|PARTIALLY_REDEEMED→EXPIRED by this run" }
      - { name: breakage_recognized_cents, type: integer, source: computed, description: "Total remaining_balance_cents swept to breakage income by this run" }
      - { name: epoch, type: integer, source: computed, description: "The new Store.liability_epoch stamped by this run (old epoch + 1)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: RebateProgram
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /stores/{store_id}/rebate-programs/{program_id}/activate"
        actor: StoreAdmin
        preconditions:
          - "program has at least one ProgramItem (ERR_PROGRAM_EMPTY)"
          - "no other RebateProgram for the same store is ACTIVE with an overlapping advertised week [week_start_date, week_end_date) — adjacency (end == other's start) is NOT an overlap (ERR_PROGRAM_WEEK_OVERLAP)"
          - "logical clock < week_end_date 00:00:00Z (ERR_PROGRAM_WEEK_PAST)"
        side_effects:
          - "status → ACTIVE; receipts purchased in [week_start_date 00:00:00Z, week_end_date 00:00:00Z) become matchable against this program's items"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /stores/{store_id}/rebate-programs/{program_id}/close"
        actor: StoreAdmin
        preconditions: []
        side_effects:
          - "status → CLOSED"
          - "new submissions may still be adjudicated against the program (eligibility is keyed on purchase_at, not submission time)"
      - from: ACTIVE
        to: CLOSED
        trigger: "system auto-close: first read or write against the program observed at logical clock >= week_end_date 00:00:00Z + store.submission_window_days days"
        actor: system
        preconditions:
          - "logical clock >= week_end_date 00:00:00Z + store.submission_window_days days"
        side_effects:
          - "status → CLOSED"

  - entity: RebateSubmission
    initial_state: SUBMITTED
    terminal_states: [REVERSED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "system automatic: every submission enters UNDER_REVIEW inside the same request that creates or resubmits it, after fraud screening"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_award_cents computed (rebate_award provisional variant)"
          - "fraud screening runs (fraud_screening); an OPEN FraudFlag on the account does NOT block adjudication but is recorded"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /stores/{store_id}/rebate-submissions/{submission_id}/adjudicate with decision=APPROVE"
        actor: GuestService
        preconditions:
          - "logical clock <= receipt.purchase_at 00:00:00Z + store.submission_window_days days (deadline instant INCLUDED; ERR_SUBMISSION_WINDOW_CLOSED past it)"
          - "account.status != FROZEN (ERR_ACCOUNT_FROZEN)"
        side_effects:
          - "award_cents computed (rebate_award adjudicated variant) and frozen"
          - "account.pending_award_cents += award_cents"
          - "account.lifetime_rebate_cents += award_cents"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /stores/{store_id}/rebate-submissions/{submission_id}/adjudicate with decision=REJECT"
        actor: GuestService
        preconditions: []
        side_effects:
          - "rejection_reason set from request"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /stores/{store_id}/rebate-submissions/{submission_id}/resubmit"
        actor: Customer
        preconditions:
          - "resubmit_count < MAX_RESUBMITS (3) (ERR_RESUBMIT_LIMIT_REACHED)"
          - "logical clock <= receipt.purchase_at 00:00:00Z + store.submission_window_days days (ERR_SUBMISSION_WINDOW_CLOSED)"
        side_effects:
          - "resubmit_count += 1; submitted_at refreshed; provisional award recomputed"
      - from: APPROVED
        to: REVERSED
        trigger: "system cascade: POST /stores/{store_id}/receipts/{receipt_id}/returns returns any rebate-awarded line"
        actor: system
        preconditions:
          - "the return touches at least one receipt line that contributed eligible_base_cents > 0 to an APPROVED submission on this receipt"
        side_effects:
          - "submission.status → REVERSED"
          - "the issued RebateCertificate (status ACTIVE or PARTIALLY_REDEEMED) → VOIDED"
          - "CreditLedgerEntry REVERSAL_DEBIT posted for certificate.remaining_balance_cents (already-redeemed value is NOT clawed back from the account)"
          - "account.pending_award_cents -= award_cents; account.credit_balance_cents recomputed (credit_account_balance)"
          - "store.outstanding_liability_cents and net_liability_cents recomputed (store_credit_liability)"

  - entity: RebateCertificate
    initial_state: ACTIVE
    terminal_states: [FULLY_REDEEMED, VOIDED]
    transitions:
      - from: ACTIVE
        to: PARTIALLY_REDEEMED
        trigger: "POST /stores/{store_id}/certificates/{certificate_id}/redeem with amount_cents < remaining_balance_cents"
        actor: GuestService
        preconditions:
          - "fraud_hold != HELD (ERR_CERTIFICATE_HELD)"
          - "logical clock < expires_at (ERR_CERTIFICATE_EXPIRED)"
          - "redeeming receipt's store_id == certificate.store_id (ERR_CERTIFICATE_WRONG_STORE)"
          - "no line of the redeeming receipt matches any ProgramItem of a RebateProgram whose advertised week contains that receipt's purchase_at (ERR_CERTIFICATE_REBATE_PURCHASE_BARRED)"
          - "amount_cents >= 1 and amount_cents <= remaining_balance_cents (boundary: amount == remaining_balance_cents takes the FULLY_REDEEMED transition instead)"
        side_effects:
          - "remaining_balance_cents -= amount_cents"
          - "CreditLedgerEntry REDEMPTION posted (−amount_cents)"
          - "account.credit_balance_cents recomputed; store liability fields recomputed"
      - from: PARTIALLY_REDEEMED
        to: PARTIALLY_REDEEMED
        trigger: "POST /stores/{store_id}/certificates/{certificate_id}/redeem with amount_cents < remaining_balance_cents"
        actor: GuestService
        preconditions: ["same as ACTIVE → PARTIALLY_REDEEMED"]
        side_effects: ["same as ACTIVE → PARTIALLY_REDEEMED"]
      - from: ACTIVE
        to: FULLY_REDEEMED
        trigger: "POST /stores/{store_id}/certificates/{certificate_id}/redeem with amount_cents == remaining_balance_cents"
        actor: GuestService
        preconditions: ["same as ACTIVE → PARTIALLY_REDEEMED"]
        side_effects:
          - "remaining_balance_cents → 0"
          - "CreditLedgerEntry REDEMPTION posted"
          - "account.credit_balance_cents recomputed; store liability fields recomputed"
      - from: PARTIALLY_REDEEMED
        to: FULLY_REDEEMED
        trigger: "POST /stores/{store_id}/certificates/{certificate_id}/redeem with amount_cents == remaining_balance_cents"
        actor: GuestService
        preconditions: ["same as ACTIVE → PARTIALLY_REDEEMED"]
        side_effects: ["same as ACTIVE → FULLY_REDEEMED"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system cascade: POST /stores/{store_id}/breakage-runs sweeps certificates with logical clock >= expires_at"
        actor: system
        preconditions: ["logical clock >= expires_at"]
        side_effects:
          - "CreditLedgerEntry BREAKAGE_EXPIRY posted (−remaining_balance_cents, tagged with the run's epoch)"
          - "store.accrued_breakage_income_cents += remaining_balance_cents"
          - "account.credit_balance_cents recomputed; store liability fields recomputed"
      - from: PARTIALLY_REDEEMED
        to: EXPIRED
        trigger: "system cascade: POST /stores/{store_id}/breakage-runs"
        actor: system
        preconditions: ["logical clock >= expires_at"]
        side_effects: ["same as ACTIVE → EXPIRED"]
      - from: EXPIRED
        to: REISSUED
        trigger: "POST /stores/{store_id}/certificates/{certificate_id}/reissue"
        actor: GuestService
        preconditions:
          - "logical clock < expires_at + REISSUE_GRACE_DAYS (30) days (ERR_REISSUE_WINDOW_CLOSED)"
          - "no CONFIRMED FraudFlag on the account (ERR_ACCOUNT_FRAUD_CONFIRMED)"
          - "fraud_hold != HELD (ERR_CERTIFICATE_HELD)"
        side_effects:
          - "a NEW RebateCertificate is minted: status ACTIVE, issued_amount_cents = source.remaining_balance_cents, reissued_from_id = source.id, fresh issued_at/expires_at"
          - "CreditLedgerEntry REISSUE_CREDIT posted on the new certificate (+remaining_balance_cents of source)"
          - "source.remaining_balance_cents → 0; source status → REISSUED"
          - "account.credit_balance_cents recomputed; store liability fields recomputed"
      - from: ACTIVE
        to: VOIDED
        trigger: "system cascade: guest-service return reverses the settling submission"
        actor: system
        preconditions: ["settling submission transitions APPROVED → REVERSED"]
        side_effects:
          - "remaining_balance_cents stays at its pre-void value on the row but is excluded from credit_account_balance and store_credit_liability because status = VOIDED"
      - from: PARTIALLY_REDEEMED
        to: VOIDED
        trigger: "system cascade: guest-service return reverses the settling submission"
        actor: system
        preconditions: ["settling submission transitions APPROVED → REVERSED"]
        side_effects: ["same as ACTIVE → VOIDED"]
      - from: EXPIRED
        to: EXPIRED
        trigger: "POST /stores/{store_id}/certificates/{certificate_id}/hold or /release (parallel dimension)"
        actor: FraudAnalyst
        preconditions: []
        side_effects: ["fraud_hold toggles HELD ↔ RELEASED; status unchanged (parallel state dimension)"]
        note: "hold/release applies from ANY non-terminal status; only the fraud_hold dimension moves"

  - entity: FraudFlag
    initial_state: OPEN
    terminal_states: [CONFIRMED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /stores/{store_id}/fraud-flags/{flag_id}/resolve with resolution=CONFIRM"
        actor: FraudAnalyst
        preconditions: []
        side_effects:
          - "every certificate of the account with fraud_hold = NONE → HELD"
          - "confirmed DUPLICATE_RECEIPT flags keep the rejected submission rejected; confirmed SPLIT_TRANSACTION flags do not void certificates by themselves"
      - from: OPEN
        to: CLEARED
        trigger: "POST /stores/{store_id}/fraud-flags/{flag_id}/resolve with resolution=CLEAR"
        actor: FraudAnalyst
        preconditions: []
        side_effects: ["no certificate holds are released automatically; holds require explicit release"]
      - from: CLEARED
        to: OPEN
        trigger: "POST /stores/{store_id}/fraud-flags/{flag_id}/reopen"
        actor: FraudAnalyst
        preconditions: []
        side_effects: ["flag returns to OPEN for re-investigation"]

  - entity: CreditAccount
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: FROZEN
        trigger: "POST /stores/{store_id}/credit-accounts/{account_id}/freeze"
        actor: FraudAnalyst
        preconditions: []
        side_effects: ["submissions, certificate issuance and redemption are rejected while FROZEN"]
      - from: FROZEN
        to: ACTIVE
        trigger: "POST /stores/{store_id}/credit-accounts/{account_id}/unfreeze"
        actor: FraudAnalyst
        preconditions: ["no OPEN FraudFlag of type DUPLICATE_RECEIPT on the account (ERR_FRAUD_FLAG_OPEN)"]
        side_effects: []
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /stores/{store_id}/credit-accounts/{account_id}/close"
        actor: StoreAdmin
        preconditions:
          - "credit_balance_cents == 0 (ERR_ACCOUNT_BALANCE_NONZERO)"
          - "pending_award_cents == 0 (ERR_ACCOUNT_BALANCE_NONZERO)"
        side_effects: []

  - entity: Receipt
    initial_state: OPEN
    terminal_states: [FULLY_RETURNED]
    transitions:
      - from: OPEN
        to: PARTIALLY_RETURNED
        trigger: "POST /stores/{store_id}/receipts/{receipt_id}/returns returning fewer units than sold on at least one line"
        actor: GuestService
        preconditions:
          - "per-line cumulative returned_quantity + return quantity <= line quantity (ERR_RETURN_QUANTITY_EXCEEDS_SOLD)"
        side_effects:
          - "ReceiptLine.returned_quantity += returned units per line"
          - "guest-service reversal cascade fires when any touched line fed an APPROVED submission (see RebateSubmission APPROVED → REVERSED)"
      - from: PARTIALLY_RETURNED
        to: PARTIALLY_RETURNED
        trigger: "POST /stores/{store_id}/receipts/{receipt_id}/returns (further partial returns)"
        actor: GuestService
        preconditions: ["same as OPEN → PARTIALLY_RETURNED"]
        side_effects: ["same as OPEN → PARTIALLY_RETURNED"]
      - from: OPEN
        to: FULLY_RETURNED
        trigger: "POST /stores/{store_id}/receipts/{receipt_id}/returns returning all remaining units on all lines"
        actor: GuestService
        preconditions: ["same as OPEN → PARTIALLY_RETURNED"]
        side_effects: ["same as OPEN → PARTIALLY_RETURNED"]
      - from: PARTIALLY_RETURNED
        to: FULLY_RETURNED
        trigger: "POST /stores/{store_id}/receipts/{receipt_id}/returns returning all remaining units on all lines"
        actor: GuestService
        preconditions: ["same as OPEN → PARTIALLY_RETURNED"]
        side_effects: ["same as OPEN → PARTIALLY_RETURNED"]

  - entity: BreakageRun
    initial_state: RUNNING
    terminal_states: [COMPLETED]
    transitions:
      - from: RUNNING
        to: COMPLETED
        trigger: "system automatic within POST /stores/{store_id}/breakage-runs (atomic request)"
        actor: system
        preconditions: ["expected_store_version == Store.version (ERR_STALE_VERSION)"]
        side_effects:
          - "every certificate of the store in ACTIVE or PARTIALLY_REDEEMED with expires_at <= run_at → EXPIRED (per-certificate cascade per RebateCertificate EXPIRED transition)"
          - "Store.liability_epoch += 1; run.epoch = new epoch"
          - "Store.accrued_breakage_income_cents += sum of swept remaining balances"
          - "Store.version += 1; liability fields recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: breakage-run-stale-store
    parent_entity: Store
    write_endpoint: "POST /stores/{store_id}/breakage-runs"
    occ_field: "expected_store_version"
    description: |
      Starting a BreakageRun against a Store whose version has advanced since the
      caller last observed it is rejected with 412. A store mutation between the
      caller's read and the run (config change, another completed run, any cascade
      touching the store) means the caller's breakage projection was computed on a
      stale liability epoch and must be refreshed before sweeping expirations.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: store-config-stale-store
    parent_entity: Store
    write_endpoint: "PATCH /stores/{store_id}"
    occ_field: "expected_store_version"
    description: |
      Updating store policy configuration (submission window, validity months,
      breakage rate, split-window parameters) against a Store whose version has
      advanced since the caller last observed it is rejected with 412; the caller
      must re-read the current policy before overwriting it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: rebate_award
    trigger: "submission creation/resubmission (provisional variant); adjudication APPROVE (adjudicated variant)"
    algorithm: tiered_pricing
    formula: |
      For each ReceiptLine of the receipt, in line_number ASC order:
        1. program_item = the ProgramItem whose sku == line.sku AND whose program's
           advertised week contains receipt.purchase_at, i.e.
           week_start_date 00:00:00Z <= purchase_at < week_end_date 00:00:00Z.
           If several match (programs of OTHER stores are never visible — match is
           store-scoped), pick the one with greatest rebate_pct; tie-break by
           ProgramItem.created_at ASC. None → exclusion_reason NO_PROGRAM_ITEM, base 0.
        2. If line.category ∈ program_item.excluded_categories → EXCLUDED_CATEGORY, base 0.
        3. net_qty = line.quantity − line.returned_quantity.
           ADJUDICATED variant only: if net_qty < program_item.min_quantity → BELOW_MIN_QUANTITY, base 0.
        4. If line.certificate_tendered_cents >= line.quantity * line.unit_price_cents
           → FULLY_CERTIFICATE_TENDERED, base 0.
        5. gross_base_cents = net_qty * line.unit_price_cents (PROVISIONAL uses net_qty
           computed with returned_quantity = 0 — returns are invisible at submission time).
        6. eligible_base_cents = gross_base_cents − line.certificate_tendered_cents,
           floored at 0.
        7. raw_award = eligible_base_cents * program_item.rebate_pct.
        8. If program_item.per_receipt_cap_cents is not null:
           raw_award = min(raw_award, per_receipt_cap_cents).
        9. awarded_cents = round_half_up(raw_award) to whole cents — PER LINE, THEN SUMMED.
      Submission award = Σ line awarded_cents over lines in line_number ASC order.
      Rounding order is pinned: round each line first, then sum; never sum raw then round.
    input_set: "All ReceiptLines of the claimed receipt, including lines that match no program item (they contribute 0 and an exclusion_reason)"
    constants:
      ROUNDING: "round_half_up per line to integer cents, then sum"
    precision: "integer cents; per-line round_half_up before summation"
    variants:
      - name: provisional
        when: "on submission creation and on each resubmit"
        difference: "net_qty ignores returned_quantity (treated as 0); min_quantity check is skipped; result stored in provisional_award_cents"
      - name: adjudicated
        when: "on adjudicate with decision=APPROVE"
        difference: "net_qty subtracts current returned_quantity; min_quantity enforced; result frozen into award_cents"

  - name: certificate_tender_attribution
    trigger: "receipt creation (validates tender_splits); redemption (mutates certificate balance)"
    algorithm: waterfall_allocation
    formula: |
      Certificate tender applied to a receipt is allocated across lines in
      line_number ASC order. For each line, certificate_share_cents =
      min(remaining_certificate_tender, line_total_cents − line_already_tendered).
      Each tender_splits entry with tender_type STORE_CREDIT_CERTIFICATE sums into
      line.certificate_tendered_cents. A line paid partially by certificate carries
      a certificate_tendered_cents that reduces its rebate base (see rebate_award
      step 6) — a line may NOT be claimed for rebate on its certificate-funded
      portion. Validation: Σ tender_splits.amount_cents over all tenders of a line
      MUST equal quantity * unit_price_cents exactly (ERR_TENDER_SPLIT_MISMATCH).
    input_set: "All lines of the receipt being created or redeemed against"
    precision: "integer cents, exact match required"

  - name: store_credit_liability
    trigger: "certificate issuance, redemption, expiry sweep, reissue, void (every mutation that touches a certificate's redeemable value)"
    algorithm: aggregation
    formula: |
      outstanding_liability_cents (GROSS variant) =
        Σ remaining_balance_cents over RebateCertificates of this store with
        status ∈ {ACTIVE, PARTIALLY_REDEEMED, EXPIRED}
        (EXPIRED stays on the books until reissued or aged out of the reissue
        grace window; VOIDED and FULLY_REDEEMED and REISSUED contribute 0)
        + Σ award_cents over RebateSubmissions of this store in status APPROVED
        (issued-but-not-yet-settled awards).
      net_liability_cents (NET variant) =
        round_half_up( outstanding_liability_cents * (1 − expected_breakage_rate) ).
      The two variants are BOTH maintained on every mutation; they diverge for any
      expected_breakage_rate > 0 and identical inputs.
    input_set: "Certificates of the store filtered by status set above; APPROVED submissions of the store"
    precision: "integer cents; net variant rounds once at the end, round_half_up"
    variants:
      - name: gross
        when: "always computed; the regulatory face-value liability"
        difference: "no breakage offset"
      - name: net
        when: "always computed alongside gross; the financial-reporting liability"
        difference: "multiplies by (1 − expected_breakage_rate) with a single final round_half_up"

  - name: credit_account_balance
    trigger: "certificate issuance, redemption, expiry, reissue, void, submission approval/reversal"
    algorithm: aggregation
    formula: |
      credit_balance_cents = Σ remaining_balance_cents over the account's
        certificates with status ∈ {ACTIVE, PARTIALLY_REDEEMED}
        (EXPIRED, REISSUED, VOIDED, FULLY_REDEEMED contribute 0).
      pending_award_cents = Σ award_cents over the account's submissions in
        status APPROVED (moves to credit_balance on issuance; REVERSED drops it).
      Evaluation order is pinned: pending_award_cents is decremented BEFORE
      credit_balance_cents is incremented on issuance, so a certificate never
      double-counts in the same request.
    input_set: "Certificates and submissions belonging to the account"
    precision: "integer cents"

  - name: breakage_recognition
    trigger: "POST /stores/{store_id}/breakage-runs"
    algorithm: threshold
    formula: |
      sweep_set = certificates of the store with status ∈ {ACTIVE, PARTIALLY_REDEEMED}
        and expires_at <= run_at, processed in expires_at ASC order, tie-break
        created_at ASC (never id).
      For each swept certificate:
        BREAKAGE_EXPIRY ledger entry of −remaining_balance_cents at the run's epoch.
      breakage_recognized_cents = Σ swept remaining_balance_cents.
      Store.accrued_breakage_income_cents += breakage_recognized_cents.
      Boundary: expires_at == run_at exactly IS swept (inclusive <=).
      A run that sweeps zero certificates is legal: expired_count = 0,
      breakage_recognized_cents = 0, and liability_epoch still advances by 1.
    input_set: "Store certificates in redeemable states past expiry"
    precision: "integer cents"

  - name: fraud_screening
    trigger: "receipt creation (split scan); submission creation (duplicate scan)"
    algorithm: interval_merge
    formula: |
      SPLIT_TRANSACTION scan (on receipt creation):
        candidate receipts = the account's other receipts at the same store with
        purchase_at in the HALF-OPEN window (new.purchase_at − split_txn_window_hours,
        new.purchase_at] — the left edge excluded, the new receipt included.
        If count(candidate receipts) + 1 (the new one) >= split_txn_min_receipts
        AND at least two receipts in the cluster share at least one SKU → create a
        SPLIT_TRANSACTION FraudFlag (status OPEN) listing the cluster's receipt ids.
      DUPLICATE_RECEIPT scan (on submission creation):
        if any non-REVERSED RebateSubmission exists with the same receipt_id →
        create a DUPLICATE_RECEIPT FraudFlag (status OPEN) listing both receipt
        and prior submission; the new submission is NOT created
        (ERR_DUPLICATE_RECEIPT_SUBMISSION).
      A receipt whose submission was REVERSED may be submitted again without
      tripping the duplicate scan.
    input_set: "Account receipts at the same store; submissions keyed on receipt_id"
    precision: "timestamps compared at second granularity"

  - name: contractor_aggregation
    trigger: "computed read: GET /stores/{store_id}/credit-accounts/{account_id}/contractor-summary"
    algorithm: aggregation
    formula: |
      For a CONTRACTOR account, per OPEN or SETTLED JobPurchase:
        job_awarded_cents = Σ award_cents over APPROVED submissions whose receipt's
          job_purchase_id == job.id, MINUS Σ award_cents of REVERSED submissions
          on those same receipts (net-of-reversal).
      account_job_total_cents = Σ job_awarded_cents over all jobs of the account.
      Volume bonus tiers on account_job_total_cents:
        tier NONE:      total <  TIER1_THRESHOLD_CENTS (500_000)        → bonus 0
        tier PRO:       TIER1 <= total <  TIER2_THRESHOLD_CENTS (2_000_000) → bonus_cents = round_half_up(total * 0.02)
        tier PRO_PLUS:  total >= TIER2_THRESHOLD_CENTS                  → bonus_cents = round_half_up(total * 0.05)
      bonus applies to the WHOLE total (average-rate, not marginal).
      Boundary: total == TIER1_THRESHOLD_CENTS exactly lands in PRO (>= semantics).
    input_set: "APPROVED and REVERSED submissions linked through receipts tagged with the account's job purchases"
    constants:
      TIER1_THRESHOLD_CENTS: 500000
      TIER2_THRESHOLD_CENTS: 2000000
      PRO_RATE: 0.02
      PRO_PLUS_RATE: 0.05
    precision: "integer cents; bonus rounds once, round_half_up"

  - name: certificate_expiry_timestamp
    trigger: "certificate issuance and reissue"
    algorithm: projection
    formula: |
      expires_at = issued_at advanced by Store.certificate_validity_months whole
      calendar months, snapped to 00:00:00Z of the resulting calendar day.
      Day-overflow rule: issued 2026-01-31 with 1 month → 2026-02-28T00:00:00Z
      (clamp to last day of the target month). The expiry instant itself is
      EXPIRED: redemption requires logical clock < expires_at; breakage sweeps
      expires_at <= run_at. A certificate redeemable 'through' its final day is
      therefore modelled with expires_at at the FOLLOWING midnight.
    input_set: "Store.certificate_validity_months, issued_at"
    precision: "second granularity, UTC"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.5 roles; entity-backed roles (Customer, Contractor) must also act on their OWN account: X-User-ID must equal the account id addressed by the request"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: existence
    check: "Path resources exist and nest correctly (store → receipt/submission/certificate/account/program/flag; submission → lines), validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints"
  - priority: 4
    category: business_constraint
    check: "Request payload structurally well-formed: required fields present, enum values valid, quantities >= 1, amounts >= 1 where required"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints"
  - priority: 5
    category: business_constraint
    check: "Every receipt line's tender_splits amounts sum exactly to quantity * unit_price_cents"
    error_id: ERR_TENDER_SPLIT_MISMATCH
    http_status: 422
    applies_to: "POST /stores/{store_id}/receipts"
  - priority: 6
    category: business_temporal
    check: "Receipt purchase_at must not be in the future relative to the logical clock"
    error_id: ERR_RECEIPT_IN_FUTURE
    http_status: 422
    applies_to: "POST /stores/{store_id}/receipts"
  - priority: 7
    category: business_referential
    check: "receipt.account_id exists, and job_purchase_id (when present) belongs to that account, is a CONTRACTOR account job, and is OPEN"
    error_id: ERR_INVALID_JOB_PURCHASE
    http_status: 422
    applies_to: "POST /stores/{store_id}/receipts"
  - priority: 8
    category: business_temporal
    check: "Submission window: logical clock <= receipt.purchase_at 00:00:00Z + store.submission_window_days days (deadline INCLUDED). Applies to submission creation, adjudicate-APPROVE, and resubmit"
    error_id: ERR_SUBMISSION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /stores/{store_id}/rebate-submissions, POST .../adjudicate, POST .../resubmit"
  - priority: 9
    category: state
    check: "State precondition of the addressed resource (submission UNDER_REVIEW for adjudicate, REJECTED for resubmit, certificate ACTIVE/PARTIALLY_REDEEMED for redeem, EXPIRED for reissue, program DRAFT for item adds, job OPEN for settle, flag OPEN/CLEARED for resolve/reopen, account ACTIVE/FROZEN for freeze/unfreeze transitions, etc.)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 10
    category: business_safety
    check: "Duplicate-receipt screening: no non-REVERSED submission exists for the same receipt_id"
    error_id: ERR_DUPLICATE_RECEIPT_SUBMISSION
    http_status: 409
    applies_to: "POST /stores/{store_id}/rebate-submissions"
  - priority: 11
    category: business_safety
    check: "Fraud holds: account not FROZEN for submissions/issuance; certificate fraud_hold != HELD for redeem/reissue; no CONFIRMED FraudFlag for reissue"
    error_id: ERR_ACCOUNT_FROZEN
    http_status: 409
    applies_to: "submission create, adjudicate, redeem, reissue (specific ids ERR_ACCOUNT_FROZEN / ERR_CERTIFICATE_HELD / ERR_ACCOUNT_FRAUD_CONFIRMED per endpoint)"
  - priority: 12
    category: business_temporal
    check: "Certificate temporal rules: redeem requires logical clock < expires_at; reissue requires logical clock < expires_at + 30 days"
    error_id: ERR_CERTIFICATE_EXPIRED
    http_status: 422
    applies_to: "POST .../certificates/{id}/redeem (ERR_CERTIFICATE_EXPIRED), POST .../certificates/{id}/reissue (ERR_REISSUE_WINDOW_CLOSED)"
  - priority: 13
    category: business_constraint
    check: "Redemption bar: no line of the redeeming receipt is rebate-eligible (matches any ProgramItem of a program whose advertised week contains that receipt's purchase_at) at the redeeming store"
    error_id: ERR_CERTIFICATE_REBATE_PURCHASE_BARRED
    http_status: 422
    applies_to: "POST /stores/{store_id}/certificates/{certificate_id}/redeem"
  - priority: 14
    category: business_referential
    check: "Certificate redeemable only at its issuing store; certificate belongs to the redeeming receipt's account"
    error_id: ERR_CERTIFICATE_WRONG_STORE
    http_status: 422
    applies_to: "POST /stores/{store_id}/certificates/{certificate_id}/redeem"
  - priority: 15
    category: business_fiscal
    check: "Redemption amount within remaining balance (amount_cents <= remaining_balance_cents); return quantities within sold quantities; account close requires zero balances"
    error_id: ERR_REDEMPTION_EXCEEDS_BALANCE
    http_status: 422
    applies_to: "redeem (ERR_REDEMPTION_EXCEEDS_BALANCE), returns (ERR_RETURN_QUANTITY_EXCEEDS_SOLD), account close (ERR_ACCOUNT_BALANCE_NONZERO)"
  - priority: 16
    category: business_constraint
    check: "Program activation rules: at least one item; no overlapping ACTIVE program week at the same store; week not entirely past"
    error_id: ERR_PROGRAM_WEEK_OVERLAP
    http_status: 409
    applies_to: "POST .../rebate-programs/{id}/activate (ERR_PROGRAM_EMPTY / ERR_PROGRAM_WEEK_OVERLAP / ERR_PROGRAM_WEEK_PAST)"
  - priority: 17
    category: state
    check: "OCC: expected_store_version equals current Store.version on PATCH /stores/{id} and POST .../breakage-runs"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /stores/{store_id}, POST /stores/{store_id}/breakage-runs"

# =============================================================================
# §1.5 API Endpoint Table (32 endpoints)
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Before any call the logical clock reads exactly 2026-09-01T00:00:00Z (fixed startup default; never falls back to wall-clock)."
    roles: [StoreAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advances; auto-close of stale ACTIVE programs is evaluated lazily on next program access"]

  # --- Store ---
  - method: POST
    path: "/stores"
    description: "Create a store with its rebate policy configuration"
    roles: [StoreAdmin]
    code: 201
    input: [store_code, submission_window_days, certificate_validity_months, expected_breakage_rate, split_txn_window_hours, split_txn_min_receipts]
    output: Store
    side_effects: ["liability fields initialized to 0, liability_epoch = 0"]
  - method: GET
    path: "/stores/{store_id}"
    description: "Read a store including computed liability fields"
    roles: [StoreAdmin, GuestService, FraudAnalyst, FinanceAdmin]
    code: 200
    input: []
    output: Store
    side_effects: []
  - method: PATCH
    path: "/stores/{store_id}"
    description: "Update store policy configuration (OCC-guarded)"
    roles: [StoreAdmin]
    code: 200
    input: [expected_store_version, "submission_window_days?", "certificate_validity_months?", "expected_breakage_rate?", "split_txn_window_hours?", "split_txn_min_receipts?"]
    output: Store
    side_effects: ["increments Store.version by 1", "net_liability_cents recomputed when expected_breakage_rate changes"]

  # --- RebateProgram / ProgramItem ---
  - method: POST
    path: "/stores/{store_id}/rebate-programs"
    description: "Create a rebate program for an advertised week (DRAFT)"
    roles: [StoreAdmin]
    code: 201
    input: [name, week_start_date, week_end_date]
    output: RebateProgram
    side_effects: ["status=DRAFT"]
  - method: GET
    path: "/stores/{store_id}/rebate-programs"
    description: "List programs of a store (paginated; optional status filter)"
    roles: [StoreAdmin, GuestService, FraudAnalyst, FinanceAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: RebateProgram[]
    side_effects: []
  - method: GET
    path: "/stores/{store_id}/rebate-programs/{program_id}"
    description: "Read one program"
    roles: [StoreAdmin, GuestService, FraudAnalyst, FinanceAdmin]
    code: 200
    input: []
    output: RebateProgram
    side_effects: []
  - method: POST
    path: "/stores/{store_id}/rebate-programs/{program_id}/items"
    description: "Flag an item rebate-eligible for the program's week"
    roles: [StoreAdmin]
    code: 201
    input: [sku, rebate_pct, "excluded_categories?", "min_quantity?", "per_receipt_cap_cents?"]
    output: ProgramItem
    side_effects: ["program must be DRAFT (ERR_INVALID_STATE otherwise)"]
  - method: GET
    path: "/stores/{store_id}/rebate-programs/{program_id}/items"
    description: "List program items"
    roles: [StoreAdmin, GuestService, FraudAnalyst, FinanceAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ProgramItem[]
