  # ===========================================================================
  # Instances already covered by §1.8 — excluded stubs
  # ===========================================================================
  - section: state_machines
    instances:
      - name: error_vendor_lead_time_not_elapsed
        claim_type: violation_to_error
        grounds: ["errors[ERR_VENDOR_LEAD_TIME_NOT_ELAPSED]"]
        excluded_because:
          difficulty_instance: outside_vendor_step_gates_receive_and_order_advance
          rationale: "Asserted as the early-receive failure path of the named §1.8 instance."
      - name: error_quote_expired_on_accept
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUOTE_EXPIRED]"]
        excluded_because:
          difficulty_instance: state_vs_business_temporal_on_expired_accept
          rationale: "The temporal accept path is exercised by the named §1.8 instance (which additionally pins priority over the state error)."
      - name: error_flatness_exceeded_override_impossible
        claim_type: violation_to_error
        grounds: ["errors[ERR_FLATNESS_EXCEEDED]"]
        excluded_because:
          difficulty_instance: order_inspection_fail_rework_loop
          rationale: "FAIL path and its rework side effects are asserted by the named §1.8 instance; the 422 override-claim variant is the same computed check."
      - name: error_scrap_source_invalid
        claim_type: violation_to_error
        grounds: ["errors[ERR_SCRAP_SOURCE_INVALID]"]
        excluded_because:
          difficulty_instance: business_safety_vs_business_referential_on_scrap_credit
          rationale: "Asserted as the failure path of the named §1.8 priority-conflict instance."
      - name: error_customer_suspended_on_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: submit_requires_customer_active
          rationale: "Asserted as the failure path of the named §1.8 cross-entity instance."
      - name: error_no_machine_capacity_on_accept
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_MACHINE_CAPACITY]"]
        excluded_because:
          difficulty_instance: machine_capacity_utilization_cap_window
          rationale: "Asserted as the over-capacity failure path of the named §1.8 instance."
      - name: error_credit_limit_exceeded_boundary
        claim_type: boundary_edge
        grounds: ["errors[ERR_CREDIT_LIMIT_EXCEEDED]", "validations[priority=14]"]
        excluded_because:
          difficulty_instance: qty_discount_tier_boundary_9_vs_10
          rationale: "Boundary-precision slot is occupied by the named §1.8 instance; the aggregate credit check is exercised by credit_limit_aggregate_validation in §1.9 validations."
