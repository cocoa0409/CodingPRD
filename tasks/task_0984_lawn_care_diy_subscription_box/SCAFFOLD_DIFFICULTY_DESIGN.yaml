  # ---------------------------------------------------------------- Rule 7 ---
  - rule_id: cross_entity_state_dependency
    instances:
      - name: shipment_advance_blocked_when_subscription_past_due
        grounds:
          - state_machines.ShipmentBox.SCHEDULED_to_PICKING
          - state_machines.Subscription.ACTIVE_to_PAST_DUE
          - errors[ERR_SUBSCRIPTION_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair ShipmentBox -> Subscription: fulfillment advance is gated on
          the parent subscription being ACTIVE; a FAILED invoice payment flips the
          subscription to PAST_DUE and the box advance is then rejected, while the
          box itself stays SCHEDULED (PAST_DUE does not HELD boxes — that is the
          pause cascade's job).
        test_recipe:
          setup:
            - "ACTIVE subscription; box1 SHIPPED with invoice ISSUED; box2 SCHEDULED"
          setup_api_calls:
