  - section: cross_cutting_layers
    instances:

      - name: occ_stale_amendment_rejected_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[amendment-create-stale-agreement]", "errors[ERR_STALE_AGREEMENT_VERSION]", endpoints.POST_/api/pricing-amendments]
        distinguishing_aspect: "Client reads agreement version v, a suspend advances it to v+1, then the amendment carrying expected_agreement_version v is rejected 412 ERR_STALE_AGREEMENT_VERSION; retrying with the fresh version succeeds."
        test_recipe:
          setup:
            - "Clock at default. Org; agreement ACTIVE with COMPUTE tier; client observed version v after activate."
          setup_api_calls:
            - call: "POST /api/billing-orgs"
              payload: { name: "Oc Org", max_hourly_commitment_cents: 1000, capacity_quota_units: 100 }
              as: PlatformBillingOperator
              captures: { oc_org: $.data.id }
            - call: "POST /api/enterprise-agreements"
              payload: { org_id: "${oc_org}", name: "A", committed_spend_cents: 1000000, term_start: "2026-09-01T00:00:00Z", term_end: "2027-09-01T00:00:00Z" }
              as: OrgAdmin
              captures: { oc_agr: $.data.id }
            - call: "POST /api/discount-tiers"
              payload: { agreement_id: "${oc_agr}", service_family: "COMPUTE", threshold_cents: 0, rate: 0.10 }
              as: OrgAdmin
            - call: "POST /api/enterprise-agreements/${oc_agr}/activate"
              payload: {}
              as: OrgAdmin
              captures: { oc_v: $.data.version }
            - call: "POST /api/enterprise-agreements/${oc_agr}/suspend"
              payload: {}
              as: OrgAdmin
          trigger:
            - call: "POST /api/pricing-amendments"
              payload: { agreement_id: "${oc_agr}", service_family: "COMPUTE", discount_rate: 0.20, effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_agreement_version: "${oc_v}" }
              as: FinanceAnalyst
              captures: { oc_err: $.data.error_id }
            - call: "GET /api/enterprise-agreements/${oc_agr}"
              payload: {}
              as: FinanceAnalyst
              captures: { oc_v2: $.data.version }
            - call: "POST /api/pricing-amendments"
              payload: { agreement_id: "${oc_agr}", service_family: "COMPUTE", discount_rate: 0.20, effective_from: "2026-10-01T00:00:00Z", effective_to: "2026-11-01T00:00:00Z", expected_agreement_version: "${oc_v2}" }
              as: FinanceAnalyst
              captures: { oc_am: $.data.id }
          assert:
            - "first attempt with stale version -> 412 ERR_STALE_AGREEMENT_VERSION (suspend bumped version after the client observed it)"
            - "retry with the fresh version -> 201, amendment created"
            - "amendment creation itself increments the agreement version by 1"

