              as: RevenueManager
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /pms/rooms/${room_id}/housekeeping"
              payload: { target: "INSPECTED", expected_room_version: "${room_v0}" }
              as: RevenueManager
              captures: { room_v1: $.data.version }
            - call: "POST /pms/guests"
              payload: { hotel_id: "${hotel_id}", full_name: "Gi G", email: "gi@x.com" }
