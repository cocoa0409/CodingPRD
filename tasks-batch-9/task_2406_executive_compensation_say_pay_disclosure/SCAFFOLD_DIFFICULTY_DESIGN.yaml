  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: program_immutability_outranks_mix_component_bounds
        grounds:
          - validations.priority_11_ERR_PROGRAM_NOT_MUTABLE
          - validations.priority_39_ERR_MIX_COMPONENT_OUT_OF_BOUNDS
          - calculations.pay_mix_reallocation
        distinguishing_aspect: |
          The request violates a priority-11 `state` rule (the program is COMMITTEE_APPROVED, not DRAFT) AND a
          priority-39 `business_constraint` rule (salary would fall to 3.00, below MIX_COMPONENT_MIN 5.00). The
          state gate wins, so the response is ERR_PROGRAM_NOT_MUTABLE / 409 — NOT the 422 bounds error. An
          implementation that validates the body before loading the program's state returns the wrong error and
          the wrong HTTP status.
        test_recipe:
          setup:
            - "MINI fixture: ACME issuer, BRVO peer, CEO Dana Reyes, one-peer RAW_MEDIAN group APPROVED (benchmark_target_tdc_usd 12,000,000.00)."
            - "PayProgram P1 created with mix 15/25/60 and then COMMITTEE_APPROVED, so its design_status is no longer DRAFT."
            - "The program version is re-read after approval so the OCC token is fresh and cannot itself be the reason for rejection."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: CompConsultant
            - call: "POST /exec-comp/companies"
              payload: { legal_name: "Acme Industries Inc", ticker: "ACME", is_issuer: true, gics_sector: "TECH", revenue_usd: 10000000000, market_cap_usd: 20000000000, share_price_usd: 50.00, ceo_tdc_usd: 15000000 }
              as: CompConsultant
              captures: { acme_id: $.data.id }
