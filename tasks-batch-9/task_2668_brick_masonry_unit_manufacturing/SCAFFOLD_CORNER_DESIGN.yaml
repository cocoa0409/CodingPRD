        claim_type: error_triggerable
        grounds:
          - errors[ERR_PANEL_TOLERANCE_EXCEEDED]
          - validations[priority=25]
          - calculations.panel_dye_lot_equivalence
        distinguishing_aspect: "The panel is laid up deliberately pale against the lot it names, so the dye-lot closure check at priority 24 passes on the same formulation and the failure is purely the delta-E comparison that runs after it."
        test_recipe:
          setup:
            - "Order O1 requires panel approval and its blend is COMPOSED at weighted_color_index 52.18"
            - "Panel PN1 names formulation F1 and dye lot L1 but records panel_color_index 40.00 with tolerance_delta_e 1.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
