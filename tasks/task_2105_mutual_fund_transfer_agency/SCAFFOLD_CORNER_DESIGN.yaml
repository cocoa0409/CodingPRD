            - call: "POST /share-classes"
              payload: { fund_id: "${fund_id}", class_code: "A", seed_nav_per_share: 10.0000, breakpoint_tiers: [{min_qualifying_amount: 0, load_pct: 0.0575}] }
              as: FundAccountant
