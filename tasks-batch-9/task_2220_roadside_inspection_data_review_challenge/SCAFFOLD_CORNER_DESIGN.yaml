              captures: { r1_id: $.data.id }
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070423", inspection_state: "OH", inspection_level: 2, inspection_start: "2026-07-02T08:00:00Z", inspection_end: "2026-07-02T09:00:00Z", vehicle_vin: "1FUJA6CK21LK00427", attributed_carrier_id: "${c1_id}", selection_source: "RANDOM" }
              as: StateInspectionOfficer
              as_user_id: "officer_ohio_1"
              captures: { r2_id: $.data.id }
            - call: "POST /inspection-reports"
              payload: { report_number: "OH2026070424", inspection_state: "OH", inspection_level: 1, inspection_start: "2026-07-03T08:00:00Z", inspection_end: "2026-07-03T09:30:00Z", vehicle_vin: "1FUJA6CK21LK00428", attributed_carrier_id: "${c1_id}", selection_source: "ISS_SCREENING" }
              as: StateInspectionOfficer
