          assert:
            - "PROBE 1 (touching, gap 0): HTTP 409 with error.code == ERR_STAFF_REST_BUFFER_VIOLATION — [16:00, 00:00) does NOT overlap [08:00, 16:00) under half-open semantics, so the overlap rule stays silent and the buffer rule fires"
            - "PROBE 2 (one minute earlier): HTTP 409 with error.code == ERR_STAFF_SHIFT_OVERLAP — 15:59 < 16:00 and 08:00 < 23:59, and priority 17 beats the buffer rule at priority 18 even though both are violated"
            - "PROBE 3 (gap exactly 480 minutes): HTTP 201 — 2026-08-01T16:00Z to 2026-08-02T00:00Z is exactly MIN_REST_BUFFER_MINUTES, and the comparison is >= so equality is accepted"
            - "ObservationOrder.${o19}.version == ${o19_v1} + 1 in total: only the accepted probe bumped it, which is why the same expected_order_version literal was valid for all three attempts"
            - "GET /observation/orders/${o19}/sitter-assignments returns exactly 1 row, ${a_ok}, watch_status SCHEDULED, scheduled_minutes 480"
            - "SitterAssignment.${a_ok}.provisional_cost_cents == 16000 — 2000 * (480/60) * 1.00; the window opens at 00:00Z but the `provisional` variant applies NO night differential, so the overnight window costs exactly the same as the day peer"
            - "Unit.${unit_p}.observed_cost_to_date_cents == 32000 (two PROVISIONAL rows of 16000) and status == OPEN"
            - "Staff.${s_p}.last_shift_end_at == 2026-08-02T08:00:00Z"

      - name: station_aggregate_capacity_with_limit_shrinking_under_acuity_weight
        resource_entity: MonitoringStation
        interval_semantics: "aggregate capacity: the count of ACTIVE feeds whose half-open windows overlap the candidate window, compared against a span limit that is itself a function of the station's total acuity weight"
        grounds:
          - calculations.feed_admission_overlap_capacity
          - calculations.station_effective_span_limit
          - validations.priority_22
        distinguishing_aspect: |
          Aggregate rather than pairwise semantics, on a machine resource rather than a person: an
          arriving feed is measured against the NUMBER of overlapping ACTIVE feeds, not against any one
          of them, and the ceiling it is measured against shrinks as acuity accumulates. Admitting the
          third feed at exactly the limit pushes the station weight to 6.0, which drops the limit from
          3 to 1, so a fourth overlapping feed is refused while a fifth NON-overlapping feed is still
          admitted — leaving active_feed_count 4 above declared_max_span 3 entirely legitimately,
          because the span rule constrains simultaneity and not the daily total.
        test_recipe:
          setup:
            - "Video-enabled unit UNIT-Q budget 500000; five admitted patients age 60, each with its own VIDEO_MONITORING order (rule 24 forbids two ACTIVE feeds per order)."
            - "Orders: R1 [FALL] weight 1.0, R2 [ELOPEMENT] weight 2.0, R3 [FALL, ELOPEMENT] weight 3.0, R4 [FALL] weight 1.0, R5 [FALL] weight 1.0. Every baseline score (1.5, 2.5, 4.0) is under the 6.0 video gate."
            - "Console CONSOLE-Q1 declared_max_span 3, observer S_Q (ADVANCED, unexpired certification)."
            - "Feeds admitted in order: F1 [08:00, 12:00) w1.0 (limit 3, occupancy 0+1); F2 [09:00, 13:00) w2.0 (limit 3, occupancy 1+1); F3 [10:00, 11:00) w3.0 (limit 3, occupancy 2+1 == 3, accepted at equality). Station is then count 3, weight 6.0, effective_span_limit max(1, 3-2) == 1."
            - "The clock is left at the startup default 2026-08-01T00:00:00Z."
