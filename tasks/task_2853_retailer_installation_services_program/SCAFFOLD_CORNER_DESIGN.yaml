        claim_type: error_triggerable
        grounds:
          - errors.ERR_BALANCE_AMOUNT_MISMATCH
          - errors.ERR_INSPECTION_NOT_PASSED
          - errors.ERR_WARRANTY_EXPIRED
          - validations[priority=36]
          - validations[priority=22]
