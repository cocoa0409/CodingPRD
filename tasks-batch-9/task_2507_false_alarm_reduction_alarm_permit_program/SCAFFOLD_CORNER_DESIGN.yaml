        distinguishing_aspect: "The threshold counts DISTINCT site_contact_id values, not attempts: two legal call attempts against the same contact freeze distinct_ecv_contact_count 1 and ecv_sufficient false on a TWO_CALL_ECV request, whereas the same two attempts spread over two contacts freeze 2 and true."
