              as_user_id: "${ath1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T08:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev_id}/start"
              as: RaceDirector
            - call: "POST /registrations/${reg1}/penalties"
              payload: { kind: "DRAFTING" }
              as: Referee
              as_user_id: "ref-1"
              captures: { pen_id: $.data.id }
            - call: "POST /penalties/${pen_id}/appeals"
              payload: { grounds: "no draft occurred" }
              as: Athlete
              as_user_id: "${ath1}"
          trigger:
            - call: "POST /registrations/${reg1}/withdraw"
              payload: {}
              as: Athlete
              as_user_id: "${ath1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_APPEAL_PENDING (integrity check wins over the missing refund destination)"
            - "error_id != ERR_REFUND_DESTINATION_REQUIRED"
            - "Registration.status remains RACING (no withdrawal side effects fired)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: swim_temp_inclusive_boundary_12_0
        grounds:
          - calculations.swim_cancel_decision
          - entities.SafetyAssessment.fields.outcome
        distinguishing_aspect: |
          Metric: water temperature. Inclusive proceed boundary: exactly 12.0C
          yields SWIM_OK while 11.9C yields SWIM_CANCEL — the >= comparison at
          the boundary decides the swim leg's fate via POST
          /events/{id}/safety-assessments.
        test_recipe:
          setup:
            - "Event E (has_swim) created; no assessment yet"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Lambda", start_date: "2026-10-15T08:00:00Z", has_swim: true, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/safety-assessments"
              payload: { water_temp_celsius: 12.0, lightning_within_10km: false }
              as: RaceDirector
              captures: { out_ok: $.data.outcome }
            - call: "POST /events/${ev_id}/safety-assessments"
              payload: { water_temp_celsius: 11.9, lightning_within_10km: false }
              as: RaceDirector
              captures: { out_cancel: $.data.outcome }
            - call: "GET /events/${ev_id}"
              as: RaceDirector
              captures: { swim_now: $.data.swim_status }
          assert:
            - "12.0C assessment outcome == SWIM_OK (inclusive boundary)"
            - "11.9C assessment outcome == SWIM_CANCEL"
            - "Event.swim_status == SWIM_CANCELLED after the second (superseding) assessment"

      - name: volunteer_count_threshold_equals_required
        grounds:
          - calculations.aid_station_readiness
          - entities.AidStation.fields.readiness_status
        distinguishing_aspect: |
          Metric: confirmed volunteer count (integer threshold, not a physical
          reading); endpoint: volunteer-assignment confirm + aid-station read.
          confirmed == required (2) gives READY; required - 1 (1) gives
          UNDERSTAFFED — the >= comparison is satisfied exactly at the count.
        test_recipe:
          setup:
            - "Event with aid station AS requiring 2 volunteers and 100 water units (water allocated)"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Mu", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 500 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 2, required_water_units: 100 }
              as: RaceDirector
              captures: { as_id: $.data.id }
            - call: "POST /events/${ev_id}/allocate-water"
              as: RaceDirector
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va1: $.data.id }
            - call: "POST /volunteer-assignments/${va1}/confirm"
              as: VolunteerCoordinator
          trigger:
            - call: "GET /aid-stations/${as_id}"
              as: VolunteerCoordinator
              captures: { ready_1: $.data.readiness_status, cnt_1: $.data.confirmed_volunteer_count }
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-2", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va2: $.data.id }
            - call: "POST /volunteer-assignments/${va2}/confirm"
              as: VolunteerCoordinator
            - call: "GET /aid-stations/${as_id}"
              as: VolunteerCoordinator
              captures: { ready_2: $.data.readiness_status, cnt_2: $.data.confirmed_volunteer_count }
          assert:
            - "At count 1 (required - 1): readiness_status == UNDERSTAFFED"
            - "At count 2 (== required): readiness_status == READY (boundary satisfied, not exceeded)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: confirm_requires_event_published
        grounds:
          - state_machines.Registration.PAID_to_CONFIRMED
          - validations[priority=9]
        distinguishing_aspect: |
          Pair Registration -> Event: confirm is legal only while the parent
          Event's posture == PUBLISHED; confirming while PERMITTED fails with
          ERR_EVENT_POSTURE even though the registration itself is validly PAID.
        test_recipe:
          setup:
            - "Event advanced DRAFT->PERMITTED only (no wave/station yet); athlete registered and PAID"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Nu", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/road-segments"
              payload: { name: "Main St", length_km: 10.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /permits/${per_id}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per_id}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath1: $.data.id }
            - call: "POST /events/${ev_id}/registrations"
              payload: { athlete_id: "${ath1}", division: "AGE_GROUP", entry_fee_cents: 20000 }
              as: Athlete
              as_user_id: "${ath1}"
              captures: { reg1: $.data.id }
            - call: "POST /registrations/${reg1}/pay"
              as: Athlete
              as_user_id: "${ath1}"
          trigger:
            - call: "POST /registrations/${reg1}/confirm"
              as: RaceDirector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_EVENT_POSTURE (event is PERMITTED, not PUBLISHED)"
            - "Registration.status remains PAID"

      - name: appeal_decide_requires_penalty_assessed
        grounds:
          - state_machines.Appeal.UNDER_REVIEW_to_DECIDED
          - validations[priority=8]
        distinguishing_aspect: |
          Pair Appeal -> Penalty (different pair from Registration -> Event):
          deciding an appeal whose penalty has already left ASSESSED (confirmed
          by run-ops after window expiry... appeal open blocks auto-confirm, so
          this is exercised by overturning via a second appeal path) — here the
          penalty was already OVERTURNED through a first decided appeal, and a
          second appeal's decide must fail with ERR_PENALTY_NOT_ASSESSED.
        test_recipe:
          setup:
            - "R1 RACING with penalty P (ASSESSED); appeal A1 OVERTURNED by ref-2 (P now OVERTURNED); second appeal A2 filed is impossible post-decision (window), so A2 was filed before A1's decision and is UNDER_REVIEW when P leaves ASSESSED"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Xi", start_date: "2026-10-15T08:00:00Z", has_swim: true, water_pool_units: 1000, appeal_window_minutes: 120 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/road-segments"
              payload: { name: "Main St", length_km: 10.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /permits/${per_id}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per_id}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/waves"
              payload: { label: "M18-39", division: "AGE_GROUP", scheduled_start_time: "2026-10-15T08:00:00Z", capacity: 2, draft_legal: false, age_band_min: 18, age_band_max: 39 }
              as: RaceDirector
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 100 }
              as: RaceDirector
              captures: { as_id: $.data.id }
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va_id: $.data.id }
            - call: "POST /volunteer-assignments/${va_id}/confirm"
              as: VolunteerCoordinator
            - call: "POST /events/${ev_id}/allocate-water"
              as: RaceDirector
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath1: $.data.id }
            - call: "POST /events/${ev_id}/registrations"
              payload: { athlete_id: "${ath1}", division: "AGE_GROUP", entry_fee_cents: 20000 }
              as: Athlete
              as_user_id: "${ath1}"
              captures: { reg1: $.data.id }
            - call: "POST /registrations/${reg1}/pay"
              as: Athlete
              as_user_id: "${ath1}"
            - call: "POST /registrations/${reg1}/confirm"
              as: RaceDirector
            - call: "POST /events/${ev_id}/safety-assessments"
              payload: { water_temp_celsius: 20.0, lightning_within_10km: false }
              as: RaceDirector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-14T10:00:00Z" }
              as: RaceDirector
            - call: "POST /registrations/${reg1}/check-in-bike"
              payload: { bib_code: "BIB-100" }
              as: Athlete
              as_user_id: "${ath1}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T08:00:00Z" }
              as: RaceDirector
            - call: "POST /events/${ev_id}/start"
              as: RaceDirector
            - call: "POST /registrations/${reg1}/penalties"
              payload: { kind: "EQUIPMENT" }
              as: Referee
              as_user_id: "ref-1"
              captures: { pen_id: $.data.id }
            - call: "POST /penalties/${pen_id}/appeals"
              payload: { grounds: "first appeal" }
              as: Athlete
              as_user_id: "${ath1}"
              captures: { ap1: $.data.id }
            - call: "POST /penalties/${pen_id}/appeals"
              payload: { grounds: "second appeal" }
              as: Athlete
              as_user_id: "${ath1}"
              captures: { ap2: $.data.id }
            - call: "POST /appeals/${ap1}/begin-review"
              as: Referee
              as_user_id: "ref-2"
            - call: "POST /appeals/${ap1}/decide"
              payload: { decision: "OVERTURNED" }
              as: Referee
              as_user_id: "ref-2"
            - call: "POST /appeals/${ap2}/begin-review"
              as: Referee
              as_user_id: "ref-2"
          trigger:
            - call: "POST /appeals/${ap2}/decide"
              payload: { decision: "UPHELD" }
              as: Referee
              as_user_id: "ref-2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PENALTY_NOT_ASSESSED (penalty already OVERTURNED by the first appeal)"
            - "A2.status remains UNDER_REVIEW; penalty remains OVERTURNED"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: permit_buffered_window_conflict
        grounds:
          - calculations.permit_window_conflict
          - validations[priority=14]
        distinguishing_aspect: |
          Resource RoadSegment with BUFFERED interval semantics: two APPROVED
          permits must be separated by >= 30 minutes; a 20-minute gap (touching
          inside the buffer) is rejected while exactly 30 minutes is allowed —
          adjacency alone is not enough, the buffer makes near-adjacent windows
          conflict.
        test_recipe:
          setup:
            - "Event + segment; permit P1 APPROVED with window 06:00-10:00 on the segment"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Omicron", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/road-segments"
              payload: { name: "Main St", length_km: 10.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T16:00:00Z" }
              as: PermitCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T10:00:00Z" }
              as: PermitCoordinator
              captures: { p1: $.data.id }
            - call: "POST /permits/${p1}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${p1}/approve"
              as: PermitCoordinator
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "County SO", requested_start: "2026-10-15T10:20:00Z", requested_end: "2026-10-15T14:00:00Z" }
              as: PermitCoordinator
              captures: { p2: $.data.id }
            - call: "POST /permits/${p2}/submit"
              as: PermitCoordinator
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "State Patrol", requested_start: "2026-10-15T10:30:00Z", requested_end: "2026-10-15T14:00:00Z" }
              as: PermitCoordinator
              captures: { p3: $.data.id }
            - call: "POST /permits/${p3}/submit"
              as: PermitCoordinator
          trigger:
            - call: "POST /permits/${p2}/approve"
              as: PermitCoordinator
              captures: { err2: $.data.error_id }
            - call: "POST /permits/${p3}/approve"
              as: PermitCoordinator
              captures: { st3: $.data.status }
          assert:
            - "P2 (gap 20 min < 30 buffer) approve fails with ERR_PERMIT_WINDOW_CONFLICT"
            - "P3 (gap exactly 30 min == buffer) approve succeeds: status == APPROVED (strict inequality allows the boundary)"

      - name: volunteer_shift_half_open_touching_allowed
        grounds:
          - calculations.volunteer_shift_conflict
          - validations[priority=15]
        distinguishing_aspect: |
          Resource volunteer_id with HALF-OPEN zero-buffer semantics (different
          from the permit buffer rule): a shift starting exactly when another
          CONFIRMED shift ends is allowed, while a one-minute-earlier start
          overlaps and is rejected.
        test_recipe:
          setup:
            - "Aid station; vol-1 CONFIRMED 06:00-10:00; two more OFFERED assignments for vol-1: 10:00-14:00 (touching) and 09:59-12:00 (overlapping)"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Pi", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 500 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 100 }
              as: RaceDirector
              captures: { as_id: $.data.id }
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va1: $.data.id }
            - call: "POST /volunteer-assignments/${va1}/confirm"
              as: VolunteerCoordinator
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T10:00:00Z", shift_end: "2026-10-15T14:00:00Z" }
              as: VolunteerCoordinator
              captures: { va2: $.data.id }
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T09:59:00Z", shift_end: "2026-10-15T12:00:00Z" }
              as: VolunteerCoordinator
              captures: { va3: $.data.id }
          trigger:
            - call: "POST /volunteer-assignments/${va2}/confirm"
              as: VolunteerCoordinator
              captures: { st2: $.data.status }
            - call: "POST /volunteer-assignments/${va3}/confirm"
              as: VolunteerCoordinator
              captures: { err3: $.data.error_id }
          assert:
            - "Touching shift (10:00 == prior end 10:00) confirms: status == CONFIRMED"
            - "Overlapping shift (09:59 < 10:00) fails with ERR_SHIFT_OVERLAP"
            - "va3.status remains OFFERED"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: wave_roster_count_invariant
        grounds:
          - entities.Wave.fields.assigned_count
          - state_machines.Registration.PAID_to_CONFIRMED
          - state_machines.Registration.CONFIRMED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: wave roster count. Confirm (+1) paired with its
          compensating withdraw (-1) leaves Wave.assigned_count identical, and
          assigned_count always equals the count of slot-holding registrations
          {CONFIRMED, RACKED, RACING, FINISHED, DSQ}.
        test_recipe:
          setup:
            - "Event PUBLISHED; wave W capacity 3; R1 CONFIRMED into W (assigned_count 1); clock default 2026-08-01 (75 days -> 75% tier, refund 13500)"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Rho", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 100 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/road-segments"
              payload: { name: "Main St", length_km: 10.0, closure_start: "2026-10-15T06:00:00Z", closure_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { seg_id: $.data.id }
            - call: "POST /road-segments/${seg_id}/permits"
              payload: { authority_name: "City PD", requested_start: "2026-10-15T06:00:00Z", requested_end: "2026-10-15T12:00:00Z" }
              as: PermitCoordinator
              captures: { per_id: $.data.id }
            - call: "POST /permits/${per_id}/submit"
              as: PermitCoordinator
            - call: "POST /permits/${per_id}/approve"
              as: PermitCoordinator
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/waves"
              payload: { label: "M18-39", division: "AGE_GROUP", scheduled_start_time: "2026-10-15T08:00:00Z", capacity: 3, draft_legal: false, age_band_min: 18, age_band_max: 39 }
              as: RaceDirector
              captures: { wave_id: $.data.id }
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 50 }
              as: RaceDirector
              captures: { as_id: $.data.id }
            - call: "POST /aid-stations/${as_id}/assignments"
              payload: { volunteer_id: "vol-1", shift_start: "2026-10-15T06:00:00Z", shift_end: "2026-10-15T10:00:00Z" }
              as: VolunteerCoordinator
              captures: { va_id: $.data.id }
            - call: "POST /volunteer-assignments/${va_id}/confirm"
              as: VolunteerCoordinator
            - call: "POST /events/${ev_id}/allocate-water"
              as: RaceDirector
            - call: "POST /events/${ev_id}/advance"
              as: RaceDirector
            - call: "POST /events/${ev_id}/athletes"
              payload: { full_name: "Ann A", birth_date: "1990-01-01", license_number: "USAT-1" }
              as: RaceDirector
              captures: { ath1: $.data.id }
            - call: "POST /events/${ev_id}/registrations"
              payload: { athlete_id: "${ath1}", division: "AGE_GROUP", entry_fee_cents: 20000 }
              as: Athlete
              as_user_id: "${ath1}"
              captures: { reg1: $.data.id }
            - call: "POST /registrations/${reg1}/pay"
              as: Athlete
              as_user_id: "${ath1}"
            - call: "GET /waves/${wave_id}"
              as: RaceDirector
              captures: { cnt0: $.data.assigned_count }
          trigger:
            - call: "POST /registrations/${reg1}/confirm"
              as: RaceDirector
            - call: "GET /waves/${wave_id}"
              as: RaceDirector
              captures: { cnt1: $.data.assigned_count }
            - call: "POST /registrations/${reg1}/withdraw"
              payload: { refund_destination: "card-1" }
              as: Athlete
              as_user_id: "${ath1}"
            - call: "GET /waves/${wave_id}"
              as: RaceDirector
              captures: { cnt2: $.data.assigned_count }
          assert:
            - "assigned_count sequence == 0 -> 1 -> 0 (forward action fully compensated)"
            - "Final assigned_count == count(Registrations on W with status in {CONFIRMED, RACKED, RACING, FINISHED, DSQ}) == 0"
            - "No WAITLISTED registrations existed, so no promotion disturbs the invariant"

      - name: water_pool_conservation_invariant
        grounds:
          - entities.Event.fields.water_pool_remaining
          - entities.AidStation.fields.allocated_water_units
          - calculations.water_allocation
        distinguishing_aspect: |
          Conserved quantity: event water pool units (different quantity from
          roster counts). Allocate-then-deallocate round trip satisfies
          sum(allocated) + water_pool_remaining == water_pool_units at every
          step, with zero drift.
        test_recipe:
          setup:
            - "Event water_pool_units 1000; three stations AS1/AS2/AS3 at km 10/20/30 each requiring 400 units"
          setup_api_calls:
            - call: "POST /events"
              payload: { name: "Tri Sigma", start_date: "2026-10-15T08:00:00Z", has_swim: false, water_pool_units: 1000 }
              as: RaceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-1", location_km: 10.0, required_volunteers: 1, required_water_units: 400 }
              as: RaceDirector
              captures: { as1: $.data.id }
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-2", location_km: 20.0, required_volunteers: 1, required_water_units: 400 }
              as: RaceDirector
              captures: { as2: $.data.id }
            - call: "POST /events/${ev_id}/aid-stations"
              payload: { name: "AS-3", location_km: 30.0, required_volunteers: 1, required_water_units: 400 }
              as: RaceDirector
              captures: { as3: $.data.id }
          trigger:
            - call: "POST /events/${ev_id}/allocate-water"
              as: RaceDirector
              captures: { rem1: $.data.water_pool_remaining }
            - call: "POST /aid-stations/${as1}/deallocate-water"
              as: RaceDirector
            - call: "GET /events/${ev_id}"
              as: RaceDirector
              captures: { rem2: $.data.water_pool_remaining }
            - call: "GET /aid-stations/${as3}"
              as: RaceDirector
              captures: { as3_alloc: $.data.allocated_water_units, as3_ready: $.data.readiness_status }
          assert:
            - "After allocate: waterfall grants 400/400/200 by location_km ASC; water_pool_remaining == 0"
            - "AS-3.allocated_water_units == 200 AND readiness_status == WATER_SHORT (200 < 400)"
            - "After deallocate AS-1: allocated sum 600 + remaining 400 == 1000 (invariant holds; zero drift)"
