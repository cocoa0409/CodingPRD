      - name: speeds_feeds_envelope_nested_min_max
        grounds:
          - calculations.speeds_feeds_envelope
          - entities.ToolProduct.fields.qualified_workpiece_groups
          - entities.CoatingRecipe.fields.total_thickness_um
          - entities.CarbideGrade.fields.co_binder_pct
        distinguishing_aspect: |
          Mode (a) — nested conditional/clamp structure: the recommended speed is a product of four
          independently-branched factors (grade clamp, coating ceiling, rigidity, coolant with a
          coated/uncoated split for DRY) capped by an application-class ceiling, so the same product
          returns 340 (clamped by the MEDIUM ceiling) for N/THROUGH_TOOL, 276 (uncapped) for
