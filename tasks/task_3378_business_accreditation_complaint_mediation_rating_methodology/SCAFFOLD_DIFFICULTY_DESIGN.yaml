# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3378_business_accreditation_complaint_mediation_rating_methodology
# 9 rules x 2 instances = 18 instances. Every numeric assert is pre-computed
# from the pinned constants in SCAFFOLD.yaml §1.3.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rating_provisional_counts_pending_published_ignores_it
        grounds:
          - calculations.rating_score
          - endpoints.POST_/businesses/{id}/rating-snapshots
        distinguishing_aspect: "Dual-variant logic on the RATING domain: with one UNANSWERED (12), one UNRESOLVED (8) and one still-open RESPONSE_RECEIVED complaint on a LARGE business, PUBLISHED scores 80 (grade B) while PROVISIONAL scores 76 (grade B_MINUS) — identical underlying data, different input sets and deductions."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau over IA/NE with fee 0; consumer; LARGE business (250 employees, founded 2018-01-01 => age 8 years, age deduction 0, volume threshold 24), advertising CLEAR, no scam reports."
            - "c1 UNANSWERED (expired by sweep), c2 UNRESOLVED (consumer rejected), c3 RESPONSE_RECEIVED (business answered, consumer has not)."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BureauAdmin
            - &d_bureau
              call: "POST /bureaus"
              payload: { name: "Heartland Bureau", territory_state_codes: ["IA", "NE"], local_dues_fee_cents: 0 }
              as: BureauAdmin
              captures: { bureau_id: $.data.id }
            - &d_consumer
              call: "POST /consumers"
              payload: { full_name: "Pat Consumer", email: "pat@example.com", home_state_code: "IA" }
              as: BureauAdmin
              captures: { consumer_id: $.data.id }
            - &d_biz_large
              call: "POST /businesses"
              payload: { legal_name: "BigBox Services Inc", home_state_code: "IA", employee_count: 250, founded_on: "2018-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id, biz_v: $.data.version }
            - &d_c1_file
              call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "SERVICE", description: "c1 never answered" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { c1_id: $.data.id }
            - &d_c1_forward
              call: "POST /complaints/${c1_id}/forward"
              payload: {}
              as: BureauAdmin
            - &d_clock_916
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-16T00:00:00Z" }
              as: BureauAdmin
            - &d_sweep
              call: "POST /bureaus/${bureau_id}/run_daily_close"
              payload: {}
              as: BureauAdmin
            - &d_c2_file
              call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "BILLING", description: "c2 rejected answer" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { c2_id: $.data.id }
            - &d_c2_forward
              call: "POST /complaints/${c2_id}/forward"
              payload: {}
              as: BureauAdmin
            - &d_c2_respond
              call: "POST /complaints/${c2_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "we offered a refund" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - &d_c2_reject
              call: "POST /complaints/${c2_id}/responses"
              payload: { kind: "CONSUMER_REJECT", body: "not good enough" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - &d_c3_file
              call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "DELIVERY", description: "c3 open" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { c3_id: $.data.id }
            - &d_c3_forward
              call: "POST /complaints/${c3_id}/forward"
              payload: {}
              as: BureauAdmin
            - &d_c3_respond
              call: "POST /complaints/${c3_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "package resent" }
              as: BusinessRep
              as_user_id: "${biz_id}"
          trigger:
            - call: "POST /businesses/${biz_id}/rating-snapshots"
              payload: { variant: "PUBLISHED" }
              as: BureauAdmin
              captures: { pub_score: $.data.score, pub_grade: $.data.grade }
            - call: "POST /businesses/${biz_id}/rating-snapshots"
              payload: { variant: "PROVISIONAL" }
              as: BureauAdmin
              captures: { prov_score: $.data.score, prov_grade: $.data.grade }
          assert:
            - "PUBLISHED snapshot: volume_deduction == 0 (2 outcomes < threshold 24), unanswered_deduction == 12, unresolved_deduction == 8, pending_deduction == 0, score == 80, grade == B"
            - "PROVISIONAL snapshot: pending_deduction == 4 (one open complaint), score == 76, grade == B_MINUS"
            - "Business.${biz_id}.current_published_score == 80 and current_provisional_score == 76"
            - "the two variants disagree on identical underlying data: 80 != 76"

      - name: dues_prepaid_vs_quarterly_diverge_on_same_tier_and_fee
        grounds:
          - calculations.dues_amount
          - endpoints.POST_/accreditation-applications/{id}/decision
        distinguishing_aspect: "Dual-variant logic on the MONEY domain (different domain from the rating instance): a MEDIUM business in a bureau with local fee 333 pays 109566 under ANNUAL_PREPAID but 119946 under QUARTERLY for identical base and fee."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau with local_dues_fee_cents 333; two MEDIUM businesses (50 employees, founded 2020-01-01 => older than 183 days), no complaints, no ad reviews."
            - "Business A applies with ANNUAL_PREPAID, business B with QUARTERLY; both approved."
          setup_api_calls:
            - *d_clock
            - &d_bureau_333
              call: "POST /bureaus"
              payload: { name: "Prairie Bureau", territory_state_codes: ["KS", "MO"], local_dues_fee_cents: 333 }
              as: BureauAdmin
              captures: { bureau2_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Alpha Medium LLC", home_state_code: "KS", employee_count: 50, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_a_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "Beta Medium LLC", home_state_code: "KS", employee_count: 50, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_b_id: $.data.id }
            - call: "POST /businesses/${biz_a_id}/accreditation-applications"
              payload: { billing_plan: "ANNUAL_PREPAID", license_number: "LIC-A-1" }
              as: BusinessRep
              as_user_id: "${biz_a_id}"
              captures: { app_a_id: $.data.id }
            - call: "POST /accreditation-applications/${app_a_id}/submit"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_a_id}"
            - call: "POST /accreditation-applications/${app_a_id}/decision"
              payload: { decision: "APPROVE", advertising_practices_result: "PASS", complaint_history_result: "PASS", licensing_result: "PASS" }
              as: StandardsReviewer
              captures: { inv_a_id: $.data.dues_invoice_id }
            - call: "POST /businesses/${biz_b_id}/accreditation-applications"
              payload: { billing_plan: "QUARTERLY", license_number: "LIC-B-1" }
              as: BusinessRep
              as_user_id: "${biz_b_id}"
              captures: { app_b_id: $.data.id }
            - call: "POST /accreditation-applications/${app_b_id}/submit"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_b_id}"
            - call: "POST /accreditation-applications/${app_b_id}/decision"
              payload: { decision: "APPROVE", advertising_practices_result: "PASS", complaint_history_result: "PASS", licensing_result: "PASS" }
              as: StandardsReviewer
              captures: { inv_b_id: $.data.dues_invoice_id }
          trigger:
            - call: "GET /businesses/${biz_a_id}/dues-invoices"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_a_id}"
              captures: { inv_a_due: "$.data[0].amount_due_cents" }
            - call: "GET /businesses/${biz_b_id}/dues-invoices"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_b_id}"
              captures: { inv_b_due: "$.data[0].amount_due_cents", inv_b_installments: "$.data[0].installments" }
          assert:
            - "invoice A: base 115000 + 333 fee = 115333; ANNUAL_PREPAID amount_due_cents == 109566 (round_half_up(115333 * 0.95))"
            - "invoice A installments == [{installment: 1, amount_cents: 109566}]"
            - "invoice B: QUARTERLY amount_due_cents == 119946 (round_half_up(115333 * 1.04))"
            - "invoice B installments amount_cents == [29987, 29987, 29987, 29985]"
            - "109566 != 119946 for identical tier and fee — the billing-plan variants diverge"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: rating_multifactor_tier_threshold_cap_and_age_interaction
        grounds:
          - calculations.rating_score
          - endpoints.POST_/businesses/{id}/rating-snapshots
        distinguishing_aspect: "Mode (a) — a formula with >= 3 inputs and non-linear interaction: 5 UNANSWERED complaints on a MICRO business hit the per-tier volume threshold (3) AND the unanswered cap (36, not 60) AND a 1-year age deduction (4) in combination, yielding score 48 / grade F."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau fee 0 over IA/NE; consumer; MICRO business (4 employees, founded 2025-06-15 => 1 full year old at 2026-09-16, volume threshold 3)."
            - "Five complaints filed and forwarded on 2026-09-01; none answered; sweep on 2026-09-16 expires all five to UNANSWERED."
          setup_api_calls:
            - *d_clock
            - *d_bureau
            - *d_consumer
            - call: "POST /businesses"
              payload: { legal_name: "Tiny Tools Co", home_state_code: "IA", employee_count: 4, founded_on: "2025-06-15T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "PRODUCT", description: "k1" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { k1_id: $.data.id }
            - call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "PRODUCT", description: "k2" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { k2_id: $.data.id }
            - call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "PRODUCT", description: "k3" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { k3_id: $.data.id }
            - call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "PRODUCT", description: "k4" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { k4_id: $.data.id }
            - call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "PRODUCT", description: "k5" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { k5_id: $.data.id }
            - call: "POST /complaints/${k1_id}/forward"
              payload: {}
              as: BureauAdmin
            - call: "POST /complaints/${k2_id}/forward"
              payload: {}
              as: BureauAdmin
            - call: "POST /complaints/${k3_id}/forward"
              payload: {}
              as: BureauAdmin
            - call: "POST /complaints/${k4_id}/forward"
              payload: {}
              as: BureauAdmin
            - call: "POST /complaints/${k5_id}/forward"
              payload: {}
              as: BureauAdmin
            - *d_clock_916
            - *d_sweep
          trigger:
            - call: "POST /businesses/${biz_id}/rating-snapshots"
              payload: { variant: "PUBLISHED" }
              as: BureauAdmin
              captures: { snap_id: $.data.id }
          assert:
            - "snapshot.volume_deduction == 12 (6 * (5 - 3), under the cap of 30)"
            - "snapshot.unanswered_deduction == 36 (cap binds: 12 * 5 = 60 would exceed it)"
            - "snapshot.age_deduction == 4 (2 * (3 - 1))"
            - "snapshot.total_deductions == 52 and score == 48 and grade == F"
            - "Business.${biz_id}.complaints_unanswered_36m == 5"

      - name: dues_quarterly_rounding_remainder_lands_on_last_installment
        grounds:
          - calculations.dues_amount
          - entities.DuesInvoice.fields.installments
        distinguishing_aspect: "Mode (b) — nested rounding where order matters (different mode from the multifactor instance): the 4% surcharge is rounded at the total (119715), each installment is round_half_up(total/4) = 29929, and the final installment absorbs the remainder (29928); a naive equal split of 29928.75 would distribute the cents differently."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau with local_dues_fee_cents 111; MEDIUM business (50 employees, founded 2020-01-01) applying with QUARTERLY and approved."
          setup_api_calls:
            - *d_clock
            - call: "POST /bureaus"
              payload: { name: "Gateway Bureau", territory_state_codes: ["IL"], local_dues_fee_cents: 111 }
              as: BureauAdmin
              captures: { bureau3_id: $.data.id }
            - call: "POST /businesses"
              payload: { legal_name: "River Medium LLC", home_state_code: "IL", employee_count: 50, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id }
            - call: "POST /businesses/${biz_id}/accreditation-applications"
              payload: { billing_plan: "QUARTERLY", license_number: "LIC-R-1" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /accreditation-applications/${app_id}/submit"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /accreditation-applications/${app_id}/decision"
              payload: { decision: "APPROVE", advertising_practices_result: "PASS", complaint_history_result: "PASS", licensing_result: "PASS" }
              as: StandardsReviewer
          trigger:
            - call: "GET /businesses/${biz_id}/dues-invoices"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { inv_due: "$.data[0].amount_due_cents" }
          assert:
            - "subtotal == 115000 + 111 == 115111; S == round_half_up(115111 * 1.04) == 119715"
            - "P == round_half_up(119715 / 4) == round_half_up(29928.75) == 29929"
            - "invoice.installments amount_cents == [29929, 29929, 29929, 29928] (remainder -1 cent on the 4th)"
            - "invoice.amount_due_cents == 119715 and sum(installments) == 119715"
            - "invoice.status == ISSUED and invoice.due_date == issued_at + 30 days"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: complaint_rebuttal_cycle_loops_until_cap_three
        grounds:
          - state_machines.Complaint.RESPONSE_RECEIVED_to_CONSUMER_REBUTTED
          - state_machines.Complaint.CONSUMER_REBUTTED_to_RESPONSE_RECEIVED
          - errors.ERR_REBUTTAL_LIMIT_REACHED
        distinguishing_aspect: "CYCLIC machine on Complaint (different entity from the Business parallel-dimension instance): RESPONSE_RECEIVED -> CONSUMER_REBUTTED -> RESPONSE_RECEIVED repeats exactly 3 times; the 4th rebuttal is rejected with ERR_REBUTTAL_LIMIT_REACHED while the complaint stays RESPONSE_RECEIVED."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau fee 0 over IA/NE; consumer; LARGE business founded 2018-01-01."
            - "One complaint FORWARDED with deadline 2026-09-15T00:00:00Z; three full response/rebuttal rounds completed; rebuttal_count == 3; a final business response leaves the complaint RESPONSE_RECEIVED."
          setup_api_calls:
            - *d_clock
            - *d_bureau
            - *d_consumer
            - *d_biz_large
            - *d_c1_file
            - *d_c1_forward
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "round 1 answer" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_REBUTTAL", body: "rebuttal 1" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "round 2 answer" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_REBUTTAL", body: "rebuttal 2" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "round 3 answer" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_REBUTTAL", body: "rebuttal 3" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { rebuttal_count_3: $.data.rebuttal_count }
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "final answer" }
              as: BusinessRep
              as_user_id: "${biz_id}"
          trigger:
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_REBUTTAL", body: "rebuttal 4" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "Complaint.${c1_id}.rebuttal_count == 3 after three full cycles"
            - "the 4th CONSUMER_REBUTTAL returns 409 with error_id == ERR_REBUTTAL_LIMIT_REACHED"
            - "Complaint.${c1_id}.status remains RESPONSE_RECEIVED (no state drift on rejection)"
            - "len(Complaint.${c1_id}.responses) == 7 (4 BUSINESS_RESPONSE + 3 CONSUMER_REBUTTAL)"

      - name: business_parallel_dimensions_move_independently
        grounds:
          - state_machines.Business (dimension accreditation_status)
          - state_machines.Business (dimension advertising_compliance_status)
          - calculations.suspension_scan
        distinguishing_aspect: "PARALLEL state dimensions on Business (different entity and different non-linear shape from the Complaint cycle): advertising_compliance_status flips UNDER_AD_REVIEW -> CLEAR while accreditation_status stays SUSPENDED, and accreditation later reinstates SUSPENDED -> ACCREDITED without touching advertising state."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Bureau fee 0 over IA/NE; consumer; MEDIUM business (50 employees, founded 2020-01-01 => age 6 years)."
            - "Business ACCREDITED via full ANNUAL_PREPAID payment (invoice 109250 = round_half_up(115000 * 0.95))."
            - "One AdvertisingReview open (advertising UNDER_AD_REVIEW)."
            - "c3 UNANSWERED via sweep at 2026-09-16; c1 and c2 UNRESOLVED (rejected 2026-09-16); a PUBLISHED snapshot scores 67 (12 + 16 + 5) and the following sweep suspends the business (67 < 75, first suspension)."
          setup_api_calls:
            - *d_clock
            - *d_bureau
            - *d_consumer
            - &d_biz_medium
              call: "POST /businesses"
              payload: { legal_name: "MidSize Manufacturing LLC", home_state_code: "IA", employee_count: 50, founded_on: "2020-01-01T00:00:00Z" }
              as: BureauAdmin
              captures: { biz_id: $.data.id, biz_v: $.data.version }
            - call: "POST /businesses/${biz_id}/accreditation-applications"
              payload: { billing_plan: "ANNUAL_PREPAID", license_number: "LIC-M-1" }
              as: BusinessRep
              as_user_id: "${biz_id}"
              captures: { app_id: $.data.id }
            - call: "POST /accreditation-applications/${app_id}/submit"
              payload: {}
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /accreditation-applications/${app_id}/decision"
              payload: { decision: "APPROVE", advertising_practices_result: "PASS", complaint_history_result: "PASS", licensing_result: "PASS" }
              as: StandardsReviewer
              captures: { inv_id: $.data.dues_invoice_id }
            - call: "POST /dues-invoices/${inv_id}/ledger-entries"
              payload: { kind: "PAYMENT", amount_cents: 109250 }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - &d_ad_review_open
              call: "POST /businesses/${biz_id}/advertising-reviews"
              payload: { claim_description: "claims #1 in USA without substantiation" }
              as: StandardsReviewer
              captures: { review_id: $.data.id }
            - *d_c3_file
            - *d_c3_forward
            - *d_clock_916
            - *d_sweep
            - *d_c2_file
            - *d_c2_forward
            - *d_c2_respond
            - *d_c2_reject
            - call: "POST /complaints"
              payload: { consumer_id: "${consumer_id}", business_id: "${biz_id}", category: "WARRANTY", description: "c1 parallel-dims" }
              as: Consumer
              as_user_id: "${consumer_id}"
              captures: { c1_id: $.data.id }
            - call: "POST /complaints/${c1_id}/forward"
              payload: {}
              as: BureauAdmin
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "offer made" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /complaints/${c1_id}/responses"
              payload: { kind: "CONSUMER_REJECT", body: "rejected" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - &d_publish_low
              call: "POST /businesses/${biz_id}/rating-snapshots"
              payload: { variant: "PUBLISHED" }
              as: BureauAdmin
              captures: { low_score: $.data.score }
            - *d_sweep
            - &d_ad_conclude_clear
              call: "POST /advertising-reviews/${review_id}/conclude"
              payload: { outcome: "CLEARED" }
              as: StandardsReviewer
            - call: "POST /complaints/${c3_id}/reopen"
              payload: {}
              as: BureauAdmin
            - call: "POST /complaints/${c3_id}/responses"
              payload: { kind: "BUSINESS_RESPONSE", body: "now we answer" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /complaints/${c3_id}/responses"
              payload: { kind: "CONSUMER_ACCEPT", body: "resolved" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "POST /complaints/${c1_id}/mediation-cases"
              payload: {}
              as: BureauAdmin
              captures: { mc1_id: $.data.id }
            - call: "POST /mediation-cases/${mc1_id}/party-response"
              payload: { party: "BUSINESS", response: "ACCEPT" }
              as: BusinessRep
              as_user_id: "${biz_id}"
            - call: "POST /mediation-cases/${mc1_id}/party-response"
              payload: { party: "CONSUMER", response: "ACCEPT" }
              as: Consumer
              as_user_id: "${consumer_id}"
            - call: "POST /mediation-cases/${mc1_id}/schedule"
              payload: { mediator_id: "med-1", session_start_at: "2026-09-21T10:00:00Z", session_end_at: "2026-09-21T11:00:00Z" }
              as: BureauAdmin
            - call: "POST /mediation-cases/${mc1_id}/conclude"
              payload: { outcome: "AGREEMENT" }
              as: BureauAdmin
            - call: "POST /complaints/${c2_id}/mediation-cases"
              payload: {}
