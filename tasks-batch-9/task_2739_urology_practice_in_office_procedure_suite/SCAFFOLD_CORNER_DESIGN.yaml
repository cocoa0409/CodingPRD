# ============================================================================
# §1.9 Scaffold Corner Design — urology-procedure-suite
#
# Breadth probe. Walks references/claim-extraction-guide.md row by row against
# this scaffold's §1.1-§1.7 surface and emits one instance per applicable row.
# The nine `section:` values and their `claim_type:` vocabularies come from that
# guide and nothing else.
#
# Every corner already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml is emitted as
# an `excluded_because:` stub naming the covering §1.8 instance, never silently
# dropped. Rows that this scaffold cannot express are skipped without ceremony
# (there is no `common_fields: false` entity, so the Immutability row of the
# entity table has no subject; there is no bulk endpoint, no soft delete, no
# idempotency-key surface, no multi-tenancy and no eventual consistency, so
# those complexity-layer rows have no subject either).
#
# Names are unique across the union of this file and
# SCAFFOLD_DIFFICULTY_DESIGN.yaml. Every negative trigger captures the error
# envelope so its polarity is explicit.
# ============================================================================
scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: entity_creation_provider_full_payload
        claim_type: creation
        grounds:
          - entities.Provider
          - endpoints[POST /urology/providers]
        distinguishing_aspect: "A create with every declared input present returns 201 and echoes all of them, with the three system enum/flag fields at their declared defaults."
        test_recipe:
          setup:
            - "empty database; PracticeAdmin needs no persisted identity because its role identity is opaque"
          setup_api_calls: []
          trigger:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST", hld_certified: false, ultrasound_accreditation_expires_on: "2027-03-31" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id, uro_v: $.data.version }
          assert:
            - "HTTP 201 with response_type == \"object\""
            - "data.full_name == \"Dr Ada Nour\", data.npi == \"1000000001\", data.role_type == \"UROLOGIST\", data.hld_certified == false, data.ultrasound_accreditation_expires_on == \"2027-03-31\""
            - "data.credential_status == \"ACTIVE\" (the declared default)"
            - "data.id is a UUID with no type prefix, data.version == 1, data.created_at and data.updated_at are ISO 8601 UTC with three fractional digits"

      - name: entity_retrieval_patient_round_trip
        claim_type: retrieval
        grounds:
          - entities.Patient
          - endpoints[GET /urology/patients/{id}]
        distinguishing_aspect: "GET by id returns the stored row byte-for-byte, including the two system counters at zero, and does not mutate version."
        test_recipe:
          setup:
            - "one urologist to own the patient"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5001", full_name: "Jonas Peil", date_of_birth: "1964-04-14", primary_urologist_id: "${uro_id}", egfr: 72, anticoagulant_flag: true, antibiotic_allergy_class: "SULFA" }
              as: Scheduler
              as_user_id: "${uro_id}"
              captures: { pat_id: $.data.id, pat_v: $.data.version }
          trigger:
            - call: "GET /urology/patients/${pat_id}"
              payload: {}
              as: PracticeAdmin
          assert:
            - "HTTP 200 with data.id == the ${pat_id} value"
            - "data.mrn == \"MRN-5001\", data.egfr == 72, data.anticoagulant_flag == true, data.antibiotic_allergy_class == \"SULFA\", data.primary_urologist_id == the ${uro_id} value"
            - "data.outstanding_recall_count == 0 and data.open_notification_count == 0"
            - "data.version == ${pat_v} (a read is not a mutation)"

      - name: entity_listing_procedure_cases_filter_pagination
        claim_type: listing
        grounds:
          - endpoints[GET /urology/procedure-cases]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "The list endpoint combines an FK filter with limit/offset: three cases for patient A and one for patient B, asked for with patient_id plus limit 2, must report total_count 3 and has_more true while returning 2 rows."
        test_recipe:
          setup:
            - "one urologist, one scheduler"
            - "patients A (three DRAFT cases) and B (one DRAFT case)"
            - "no case is scheduled, so nothing can collide on the room"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5002", full_name: "Alma Reid", date_of_birth: "1969-06-01", primary_urologist_id: "${uro_id}", egfr: 60 }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_a_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5003", full_name: "Bram Ito", date_of_birth: "1972-02-11", primary_urologist_id: "${uro_id}", egfr: 60 }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_b_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /urology/procedure-types"
              payload: { code: "CYSTOSCOPY", base_minutes: 20, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", requires_scope: false, requires_antibiotic: false, required_prep_codes: [] }
              as: PracticeAdmin
              captures: { type_id: $.data.id }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T07:00:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_a_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T09:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_a_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T11:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_a_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T13:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_b_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T15:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
          trigger:
            - call: "GET /urology/procedure-cases?patient_id=${pat_a_id}&limit=2&offset=0"
              payload: { patient_id: "${pat_a_id}", limit: 2, offset: 0 }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "GET /urology/procedure-cases?patient_id=${pat_a_id}&limit=2&offset=2"
              payload: { patient_id: "${pat_a_id}", limit: 2, offset: 2 }
              as: Scheduler
              as_user_id: "${sch_id}"
            - call: "GET /urology/procedure-cases"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
          assert:
            - "trigger call 1: response_type == \"array\", 2 rows returned, total_count == 3, has_more == true, limit == 2, offset == 0, and every row has patient_id == the ${pat_a_id} value"
            - "trigger call 2: 1 row returned, total_count == 3, has_more == false"
            - "trigger call 3 with no parameters: 4 rows returned, total_count == 4, has_more == false, limit == 10 and offset == 0 (the declared pagination defaults)"

      - name: entity_not_found_scope_asset_unknown_id
        claim_type: not_found
        grounds:
          - errors[ERR_SCOPE_NOT_FOUND]
          - endpoints[GET /urology/scope-assets/{id}]
        distinguishing_aspect: "A well-formed UUID that names no ScopeAsset returns 404 ERR_SCOPE_NOT_FOUND in the error envelope, not an empty 200 and not a 400."
        test_recipe:
          setup:
            - "one sterile processing tech so the read has a valid identity; no scope is ever created"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Omar Diaz", npi: "1000000004", role_type: "TECH" }
              as: PracticeAdmin
              captures: { tech_id: $.data.id }
          trigger:
            - call: "GET /urology/scope-assets/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: SterileProcessingTech
              as_user_id: "${tech_id}"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == \"error\" and data.error_id == \"ERR_SCOPE_NOT_FOUND\""
            - "data.message is a non-empty string and data carries no entity fields"

      - name: entity_required_fields_patient_missing_required_egfr
        claim_type: required_fields
        grounds:
          - entities.Patient.fields.egfr
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /urology/patients]
        distinguishing_aspect: "egfr is a required input with no default and it drives two calculations, so omitting it must be rejected outright rather than defaulted to 0 or null."
        test_recipe:
          setup:
            - "one urologist to be the primary_urologist_id"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
          trigger:
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5004", full_name: "Nadia Ruhl", date_of_birth: "1977-03-03", primary_urologist_id: "${uro_id}" }
              as: PracticeAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /urology/patients returns total_count == 0: the rejected create persisted nothing"

      - name: entity_defaults_room_and_case_defaults
        claim_type: defaults
        grounds:
          - entities.ProcedureRoom.fields.room_status
          - entities.ProcedureRoom.fields.turnover_minutes
          - entities.ProcedureCase.fields.device_state
          - entities.ProcedureCase.fields.acknowledged_prep_codes
        distinguishing_aspect: "Omitting every optional input on a room and creating a bare case exercises four different default kinds in one pass: an enum default, a numeric default, a null default and an empty-array default."
        test_recipe:
          setup:
            - "one urologist, one scheduler, a room created with name and room_type only"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5005", full_name: "Owen Vale", date_of_birth: "1965-05-05", primary_urologist_id: "${uro_id}", egfr: 60 }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /urology/procedure-types"
              payload: { code: "CYSTOSCOPY", base_minutes: 20, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", required_prep_codes: [] }
              as: PracticeAdmin
              captures: { type_id: $.data.id }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T07:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto Default", room_type: "CYSTO_SUITE" }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T14:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_id: $.data.id }
            - call: "GET /urology/procedure-types/${type_id}"
              payload: {}
              as: PracticeAdmin
          assert:
            - "trigger call 1: room_status == \"OPEN\", turnover_minutes == 15, accreditation_body null, accreditation_expires_on null, occupied_block_count == 0"
            - "trigger call 2: schedule_status == \"DRAFT\", clearance_status == \"PENDING_PREP\", device_state == \"NONE\", device_quantity == 0, acknowledged_prep_codes == [], scope_asset_id null, checked_in_at null, completed_at null, clearance_block_reason null, cancel_reason_code null"
            - "trigger call 3: requires_scope == false, requires_specimen == false, requires_antibiotic == false, consignment_required == false, single_use_device_sku null (every boolean flag defaults false)"
            - "an implementation defaulting turnover_minutes to 0 puts trigger call 2's block_end_at at 14:20 instead of 14:50 and fails"

      - name: entity_computed_fields_lot_counters_at_creation
        claim_type: computed_fields
        grounds:
          - entities.ConsignmentLot.fields.quantity_available
          - entities.ConsignmentLot.fields.billed_amount_cents
          - entities.ConsignmentLot.fields.billing_status
        distinguishing_aspect: "A freshly received lot has five unit counters and two billing fields that are all computed, never supplied: quantity_available mirrors quantity_received while the other four sit at zero and the money field at 0 with basis PROVISIONAL, even though nothing has been billed."
        test_recipe:
          setup:
            - "no prerequisites beyond the PracticeAdmin role"
          setup_api_calls: []
          trigger:
            - call: "POST /urology/consignment-lots"
              payload: { supplier_name: "Meridian Devices", sku: "BX-NEEDLE-18G", device_class: "BIOPSY_NEEDLE", quantity_received: 10, unit_price_cents: 1999, lot_expires_on: "2027-06-30" }
              as: PracticeAdmin
              captures: { lot_id: $.data.id }
          assert:
            - "HTTP 201 with quantity_received == 10 and quantity_available == 10"
            - "quantity_reserved == 0, quantity_consumed == 0, quantity_wasted == 0, quantity_returned == 0"
            - "billed_amount_cents == 0, billing_basis == \"PROVISIONAL\", billing_status == \"CONSIGNED\", version == 1"
            - "the ledger identity holds at creation: 10 == 10 + 0 + 0 + 0 + 0"

      - name: entity_system_fields_envelope_and_version
        claim_type: system_fields
        grounds:
          - response_envelope.success
          - entities.ProcedureRoom
          - endpoints[PATCH /urology/procedure-rooms/{id}]
        distinguishing_aspect: "The four common fields are server-minted and version increments by exactly one per mutation while created_at is frozen and updated_at moves — asserted across two successive PATCHes so a one-shot implementation that stamps version 1 forever is caught."
        test_recipe:
          setup:
            - "one room created with defaults"
          setup_api_calls:
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Imaging Bay 1", room_type: "IMAGING_BAY" }
              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v1: $.data.version, room_created: $.data.created_at }
          trigger:
            - call: "PATCH /urology/procedure-rooms/${room_id}"
              payload: { turnover_minutes: 12 }
              as: PracticeAdmin
              captures: { room_v2: $.data.version }
            - call: "PATCH /urology/procedure-rooms/${room_id}"
              payload: { accreditation_body: "ACR", accreditation_expires_on: "2027-05-31" }
              as: PracticeAdmin
              captures: { room_v3: $.data.version }
            - call: "GET /urology/procedure-rooms/${room_id}"
              payload: {}
              as: PracticeAdmin
          assert:
            - "${room_v1} == 1, ${room_v2} == 2, ${room_v3} == 3"
            - "trigger call 3: created_at == ${room_created} and updated_at > created_at"
            - "trigger call 3: turnover_minutes == 12, accreditation_body == \"ACR\", accreditation_expires_on == \"2027-05-31\", name still \"Imaging Bay 1\""
            - "every response carries meta.api_request_id and meta.api_request_timestamp with response_type \"object\""

      - name: entity_type_constraints_room_type_invalid_enum
        claim_type: type_constraints
        grounds:
          - entities.ProcedureRoom.fields.room_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "room_type is a closed enum of three members; an undeclared member is a 400 ERR_INVALID_REQUEST at the envelope level, not a 422 business error, because no business rule has been reached yet."
        test_recipe:
          setup:
            - "no prerequisites"
          setup_api_calls: []
          trigger:
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Endoscopy Annex", room_type: "ENDOSCOPY_ANNEX" }
              as: PracticeAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /urology/procedure-rooms returns total_count == 0"

      - name: entity_creation_duplicate_mrn_rejected
        claim_type: creation
        grounds:
          - errors[ERR_DUPLICATE_MRN]
          - entities.Patient.fields.mrn
        distinguishing_aspect: "mrn is unique practice-wide, so the second create with the same mrn is a 409 even though every other field differs — a uniqueness conflict, not a malformed request."
        test_recipe:
          setup:
            - "one urologist and one patient already holding MRN-5006"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5006", full_name: "First Holder", date_of_birth: "1960-01-01", primary_urologist_id: "${uro_id}", egfr: 60 }
              as: PracticeAdmin
              captures: { pat_first_id: $.data.id }
          trigger:
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5006", full_name: "Second Claimant", date_of_birth: "1988-08-08", primary_urologist_id: "${uro_id}", egfr: 90 }
              as: PracticeAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == \"ERR_DUPLICATE_MRN\""
            - "GET /urology/patients?mrn=MRN-5006 returns total_count == 1 with full_name == \"First Holder\""

      - name: entity_parent_relationships_case_unknown_patient_not_found
        claim_type: parent_relationships
        grounds:
          - entities.ProcedureCase.fields.patient_id
          - errors[ERR_PATIENT_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The flat topology means every FK is validated against its own parent table by its own error id: a case naming an unknown patient answers ERR_PATIENT_NOT_FOUND, not a generic not-found, while the three sibling FKs in the same body all resolve."
        test_recipe:
          setup:
            - "one urologist, one scheduler, one room and one type — every FK except patient_id resolves"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id }
            - call: "POST /urology/procedure-types"
              payload: { code: "CYSTOSCOPY", base_minutes: 20, cleanup_class: "HIGH", allowed_room_type: "CYSTO_SUITE", required_prep_codes: [] }
              as: PracticeAdmin
              captures: { type_id: $.data.id }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T07:00:00Z" }
              as: PracticeAdmin
          trigger:
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "00000000-0000-4000-8000-0000000000aa", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-14T14:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { err_id: $.data.error_id }
            - call: "GET /urology/procedure-cases"
              payload: {}
              as: Scheduler
              as_user_id: "${sch_id}"
          assert:
            - "trigger call 1: HTTP 404 with data.error_id == \"ERR_PATIENT_NOT_FOUND\""
            - "trigger call 2: total_count == 0"
            - "an implementation collapsing all FK misses into one error id returns ERR_CASE_NOT_FOUND or a generic 404 and fails"

      - name: entity_parent_relationships_specimen_reachable_from_case
        claim_type: parent_relationships
        grounds:
          - entities.Specimen.fields.case_id
          - endpoints[GET /urology/specimens]
          - state_machines[Specimen.chain_status].initial_state
        distinguishing_aspect: "The positive half of FK integrity: a specimen created against an IN_ROOM case is retrievable by filtering the specimen list on case_id, which is the reverse-reachability path the flat topology promises for every child row."
        test_recipe:
          setup:
            - "one urologist, one scheduler, one nurse"
            - "patient Iris Vondel, egfr 60"
            - "room Cysto A: CYSTO_SUITE, turnover_minutes 10"
            - "type PROSTATE_BIOPSY with requires_specimen true, no scope, no antibiotic, no consignment"
            - "clock 2026-09-15T09:00:00Z; the case is scheduled, cleared and checked in so specimen collection is legal"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Dr Ada Nour", npi: "1000000001", role_type: "UROLOGIST" }
              as: PracticeAdmin
              captures: { uro_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Sam Reyes", npi: "1000000002", role_type: "SCHEDULER" }
              as: PracticeAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Nina Park", npi: "1000000003", role_type: "RN" }
              as: PracticeAdmin
              captures: { rn_id: $.data.id }
            - call: "POST /urology/patients"
              payload: { mrn: "MRN-5007", full_name: "Iris Vondel", date_of_birth: "1958-09-09", primary_urologist_id: "${uro_id}", egfr: 60 }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { pat_id: $.data.id }
            - call: "POST /urology/procedure-rooms"
              payload: { name: "Cysto A", room_type: "CYSTO_SUITE", turnover_minutes: 10 }
              as: PracticeAdmin
              captures: { room_id: $.data.id, room_v1: $.data.version }
            - call: "POST /urology/procedure-types"
              payload: { code: "PROSTATE_BIOPSY", base_minutes: 30, cleanup_class: "LOW", allowed_room_type: "CYSTO_SUITE", requires_specimen: true, required_prep_codes: [] }
              as: PracticeAdmin
              captures: { type_id: $.data.id }
            - call: "POST /urology/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T09:00:00Z" }
              as: PracticeAdmin
            - call: "POST /urology/procedure-cases"
              payload: { patient_id: "${pat_id}", procedure_type_id: "${type_id}", room_id: "${room_id}", primary_provider_id: "${uro_id}", scheduled_start_at: "2026-09-15T09:00:00Z" }
              as: Scheduler
              as_user_id: "${sch_id}"
              captures: { case_id: $.data.id }
            - call: "POST /urology/procedure-cases/${case_id}/schedule"
