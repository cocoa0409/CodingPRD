              as: CalibrationEngineer
              as_user_id: "eng-02"
            - call: "POST /installations/${i_a}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
            - call: "POST /clubs"
              payload: { name: "Harbor FC", market_code: "HBR" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_home: $.data.id }
            - call: "POST /clubs"
              payload: { name: "Summit SC", market_code: "SMT" }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { c_away: $.data.id }
            - call: "POST /games"
              payload: { venue_id: "${v_id}", home_club_id: "${c_home}", away_club_id: "${c_away}", scheduled_start_utc: "2026-08-01T18:00:00Z", tracking_generation: "G1", licensable_minutes: 240 }
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /games/${g_id}/open-collection"
              as: LeagueDataOps
              as_user_id: "ops-01"
              captures: { err_posture: $.data.error_id }
            - call: "POST /installations/${i_b}/certify"
              as: LeagueDataOps
              as_user_id: "ops-01"
