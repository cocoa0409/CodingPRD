  - section: endpoints
    instances:
      - name: ops_sweep_reverts_lapsed_vacation_and_expires_transfer_in_one_call
        claim_type: Bulk action
        grounds:
          - endpoints.POST_/ops-sweeps
          - state_machines.Device.monitor_mode.VACATION_to_NORMAL
          - state_machines.DeviceTransfer.status.INITIATED_to_EXPIRED
          - entities.DeviceTransfer.fields.expires_at
          - calculations.operational_window_bounds
        distinguishing_aspect: "One POST /ops-sweeps applies two independent lapses in its declared fixed order and reports both counters: modes_reverted == 1 (clock >= vacation_ends_at) and transfers_expired == 1 (clock > expires_at == initiated_at + TRANSFER_ACCEPT_WINDOW_HOURS 168), restoring the device from TRANSFER_PENDING to ARMED because the baseline is COMPLETE."
        test_recipe:
