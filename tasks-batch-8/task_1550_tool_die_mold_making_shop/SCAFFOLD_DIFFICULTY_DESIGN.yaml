  # ---------------------------------------------------------------- rule 8 ---
  - rule_id: resource_temporal_overlap
    instances:
      - name: press_half_open_adjacency_vs_overlap
        grounds:
          - calculations.press_window_conflict_check
          - entities.PressReservation.fields.press_id
          - errors[ERR_PRESS_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Resource PressReservation, half-open [start,end) semantics: a window
          starting exactly at another's end (12:00 == 12:00) does NOT conflict,
          while [11:00,13:00) overlapping [08:00,12:00) does — adjacency is free,
          true overlap is rejected.
        test_recipe:
          setup:
            - "Customer + RELEASED design + ACCEPTED FIRM quote + job BOOKED (default clock 2026-08-01)"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Press Co", contact_email: "ps@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-1101", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /build-jobs"
              payload: {quote_id: "${q1}"}
              as: ProjectManager
              captures: {j1: $.data.id}
            - call: "POST /press-reservations"
              payload: {build_job_id: "${j1}", press_id: "PRESS_500T", start_time: "2026-08-10T08:00:00Z", end_time: "2026-08-10T12:00:00Z"}
              as: ProjectManager
              captures: {pr1: $.data.id}
          trigger:
            - call: "POST /press-reservations"
              payload: {build_job_id: "${j1}", press_id: "PRESS_500T", start_time: "2026-08-10T12:00:00Z", end_time: "2026-08-10T16:00:00Z"}
              as: ProjectManager
              captures: {pr2: $.data.id}
            - call: "POST /press-reservations"
              payload: {build_job_id: "${j1}", press_id: "PRESS_500T", start_time: "2026-08-10T11:00:00Z", end_time: "2026-08-10T13:00:00Z"}
              as: ProjectManager
              captures: {err1: $.data.error_id}
          assert:
            - "adjacent reservation succeeds (http 201): PressReservation.${pr2}.status == RESERVED  # start == existing end is free under half-open semantics"
            - "overlapping reservation rejected http 409 with error_id == ERR_PRESS_DOUBLE_BOOKED"
            - "captured err1 == ERR_PRESS_DOUBLE_BOOKED"

      - name: machine_cooldown_buffer_blocks_back_to_back
        grounds:
          - calculations.machine_window_and_capacity_check
          - entities.MachineReservation.fields.machine_id
          - errors[ERR_MACHINE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Resource MachineReservation with DIFFERENT interval semantics than the
          press rule: each block occupies [start, end + 4h cool-down), so a
          back-to-back booking at exactly the previous end (12:00) CONFLICTS —
          illegal here though legal for presses — while a start exactly at
          end + 4h (16:00) is allowed (inclusive buffer-end boundary).
        test_recipe:
          setup:
            - "Customer + RELEASED design + ACCEPTED FIRM quote + job BOOKED"
            - "CNC_1 block 2026-08-03 08:00-12:00 RESERVED (blocks until 16:00 with buffer)"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Mach Co", contact_email: "mc@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-1102", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /build-jobs"
              payload: {quote_id: "${q1}"}
              as: ProjectManager
              captures: {j1: $.data.id}
            - call: "POST /machine-reservations"
              payload: {build_job_id: "${j1}", machine_id: "CNC_1", start_time: "2026-08-03T08:00:00Z", end_time: "2026-08-03T12:00:00Z"}
              as: ProjectManager
              captures: {mr1: $.data.id}
          trigger:
            - call: "POST /machine-reservations"
              payload: {build_job_id: "${j1}", machine_id: "CNC_1", start_time: "2026-08-03T12:00:00Z", end_time: "2026-08-03T16:00:00Z"}
              as: ProjectManager
              captures: {err1: $.data.error_id}
            - call: "POST /machine-reservations"
              payload: {build_job_id: "${j1}", machine_id: "CNC_1", start_time: "2026-08-03T16:00:00Z", end_time: "2026-08-03T20:00:00Z"}
              as: ProjectManager
              captures: {mr3: $.data.id}
          assert:
            - "back-to-back booking rejected http 409 error_id == ERR_MACHINE_WINDOW_CONFLICT (12:00 is inside the 4h cool-down)"
            - "captured err1 == ERR_MACHINE_WINDOW_CONFLICT"
            - "booking at exactly end+buffer succeeds (http 201): MachineReservation.${mr3}.status == RESERVED"
            - "MachineReservation.${mr3}.duration_hours == 4.0"
            - "MachineReservation.${mr1}.status == RESERVED  # untouched"

  # ---------------------------------------------------------------- rule 9 ---
  - rule_id: compensating_invariant
    instances:
      - name: invoice_void_restores_billed_conservation
        grounds:
          - calculations.milestone_billing_schedule
          - state_machines.ProgressInvoice.ISSUED_to_VOID
          - entities.BuildJob.fields.billed_cents
        distinguishing_aspect: |
          Conserved quantity: billed cents. Forward action POST
          /build-milestones/{m1}/invoice raises billed_cents to 2100000; the
          compensating ECO approval (affects_from 1) voids that invoice and the
          invariant billed_cents == SUM(amount_cents over non-VOID invoices) == 0
          holds again, while the contract re-baselines to 10715000 and the six
          replanned milestones still sum exactly to it.
        test_recipe:
          setup:
            - "CLASS_103 job IN_BUILD; milestone 1 EARNED then INVOICED (invoice 2100000, billed_cents == 2100000)"
            - "ECO (SHOP, affects_from_milestone_seq 1) assessed: 8.0 h rework, 100000 scrapped, 0-week extension => total_charge 215000"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Conserve Co", contact_email: "cv@x.com", credit_limit_cents: 0}
              as: ShopAdmin
              captures: {c1: $.data.id}
            - call: "POST /tool-designs"
              payload: {customer_id: "${c1}", part_number: "PN-1201", tool_type: "INJECTION_MOLD", die_class: "CLASS_103", cavity_count: 4, design_complexity_score: 10}
              as: Customer
              as_user_id: "${c1}"
              captures: {d1: $.data.id}
            - call: "POST /tool-designs/${d1}/submit"
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /tool-designs/${d1}/review"
              payload: {decision: "RELEASED"}
              as: ToolingEngineer
              captures: {d1_ver: $.data.version}
            - call: "POST /quotes"
              payload: {customer_id: "${c1}", tool_design_id: "${d1}", quote_kind: "FIRM", requested_lead_weeks: 12, expected_tool_design_version: "${d1_ver}"}
              as: Estimator
              captures: {q1: $.data.id}
            - call: "POST /quotes/${q1}/issue"
              as: Estimator
            - call: "POST /quotes/${q1}/respond"
              payload: {decision: "ACCEPTED"}
              as: Customer
              as_user_id: "${c1}"
            - call: "POST /build-jobs"
              payload: {quote_id: "${q1}"}
              as: ProjectManager
              captures: {j1: $.data.id}
            - call: "GET /build-milestones"
              payload: {build_job_id: "${j1}"}
              as: Any
              captures: {m1: "$.data[0].id", m6: "$.data[5].id"}
            - call: "POST /machine-reservations"
              payload: {build_job_id: "${j1}", machine_id: "CNC_1", start_time: "2026-08-03T08:00:00Z", end_time: "2026-08-03T16:00:00Z"}
              as: ProjectManager
            - call: "POST /build-jobs/${j1}/advance"
              payload: {target_state: "IN_BUILD"}
              as: ProjectManager
            - call: "POST /build-milestones/${m1}/complete"
              as: ProjectManager
            - call: "POST /build-milestones/${m1}/invoice"
              as: FinanceAdmin
              as_user_id: "fin-a"
              captures: {inv1: $.data.id}
            - call: "GET /build-jobs/${j1}"
              as: Any
              captures: {j1_ver: $.data.version}
            - call: "POST /engineering-changes"
              payload: {build_job_id: "${j1}", requested_by: "SHOP", description: "resize core", affects_from_milestone_seq: 1, expected_build_job_version: "${j1_ver}"}
              as: ToolingEngineer
              captures: {eco: $.data.id}
            - call: "POST /engineering-changes/${eco}/assess"
              payload: {rework_hours: 8.0, scrapped_material_cost_cents: 100000, lead_extension_weeks: 0}
              as: ToolingEngineer
          trigger:
            - call: "POST /engineering-changes/${eco}/customer-decision"
              payload: {decision: "APPROVED"}
              as: Customer
              as_user_id: "${c1}"
          assert:
            - "before trigger invariant: billed_cents was 2100000 == SUM(non-VOID invoice amounts)"
            - "ProgressInvoice.${inv1}.status == VOID"
            - "BuildJob.${j1}.billed_cents == 0  # compensating action restores the conserved quantity"
            - "BuildJob.${j1}.contract_value_cents == 10715000"
            - "BuildMilestone.${m1}.status == REOPENED"
            - "BuildMilestone.${m1}.planned_amount_cents == 2143000  # replanned on 10715000"
            - "BuildMilestone.${m6}.planned_amount_cents == 535750  # remainder absorber"
            - "SUM of all six planned_amount_cents == 10715000 == BuildJob.${j1}.contract_value_cents"

      - name: shot_report_reversal_conserves_lifetime_shots
        grounds:
          - calculations.tool_life_shot_accounting
          - entities.ShotReport.fields.status
          - errors[ERR_SHOT_REVERSAL_BLOCKED]
        distinguishing_aspect: |
          Conserved quantity: tool lifetime shots (a different quantity than
          billed cents). Forward report (+50000) followed by its reversal returns
          lifetime_shots to the pre-report value 500 exactly; and reversal is
          BLOCKED (ERR_SHOT_REVERSAL_BLOCKED) once a warranty claim has snapshotted
          claimed_at_shot_count above the post-reversal level — the invariant
          lifetime == tryout_shots + SUM(ACTIVE reports) is never violated.
        test_recipe:
          setup:
            - "CLASS_103 tool IN_PRODUCTION (delivered after buyoff with 500 tryout shots); clock 2026-08-25"
          setup_api_calls:
            - call: "POST /customers"
              payload: {company_name: "Shots Co", contact_email: "sh@x.com", credit_limit_cents: 0}
              as: ShopAdmin
