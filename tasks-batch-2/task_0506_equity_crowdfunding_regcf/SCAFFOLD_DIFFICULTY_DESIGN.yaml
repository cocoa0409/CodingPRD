scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: annual_limit_branch_variants_on_investor
        grounds:
          - calculations.investor_annual_limit
          - entities.Investor.fields.annual_limit_cents
          - entities.Investor.fields.annual_income_cents
        distinguishing_aspect: |
          On the INVESTOR domain: identical income/net-worth magnitudes produce different limits depending
          on whether BOTH figures cross the $124,000 cap (10%-of-lesser) or not (5%-of-greater); the two
          variants compute different ceilings for inputs of the same nominal size.
        test_recipe:
          setup:
            - "Two investors registered. Investor X: income $50,000 (5,000,000c), net worth $30,000 (3,000,000c) — at_least_one_below_cap variant -> 5% of greater(5,000,000c)=250,000c, floored at $2,500 -> 250,000c."
            - "Investor Y: income $200,000 (20,000,000c), net worth $500,000 (50,000,000c) — both_above_cap variant -> 10% of lesser(20,000,000c)=2,000,000c."
          setup_api_calls:
            - call: "POST /investors"
              payload: { email: "x@inv.com", legal_name: "Investor X", annual_income_cents: 5000000, net_worth_cents: 3000000 }
              as: Anonymous
              captures: { x_id: $.data.id, x_limit: $.data.annual_limit_cents }
            - call: "POST /investors"
              payload: { email: "y@inv.com", legal_name: "Investor Y", annual_income_cents: 20000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { y_id: $.data.id, y_limit: $.data.annual_limit_cents }
          trigger:
            - call: "GET /investors/${x_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "GET /investors/${y_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Investor.${x_id}.annual_limit_cents == 250000"
            - "Investor.${y_id}.annual_limit_cents == 2000000"

      - name: issuance_equity_vs_safe_variants_on_investment
        grounds:
          - calculations.equity_issuance
          - entities.Investment.fields.securities_issued
          - entities.Investment.fields.refund_amount_cents
          - entities.CapTableEntry.fields.instrument
        distinguishing_aspect: |
          On the INVESTMENT domain (different entity than annual_limit's Investor): the SAME 250,000c
          commitment yields floor(250000/1075)=232 shares + a 600c sub-share refund under the EQUITY
          variant, but yields 0 shares + 250,000c SAFE principal + 0 refund under the SAFE variant.
        test_recipe:
          setup:
            - "Issuer verified. One EQUITY offering (price 1075c/share, min 200,000c, max 1,000,000c, deadline 2026-09-01) LIVE; one SAFE offering (min 200,000c, max 1,000,000c, deadline 2026-09-01) LIVE."
            - "Each receives a single 250,000c accredited commitment; each is final-closed (250,000c >= 200,000c min)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Acme Co", ein: "111111111", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "acc@inv.com", legal_name: "Acc Inv", annual_income_cents: 100000000, net_worth_cents: 100000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${inv_id}", method: "INCOME" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { areq_id: $.data.id }
            - call: "POST /accreditation-requests/${areq_id}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "EQUITY", price_per_security_cents: 1075, min_target_cents: 200000, max_target_cents: 1000000, deadline_at: "2026-09-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { eq_off_id: $.data.id }
            - call: "POST /offerings/${eq_off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${eq_off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${eq_off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { eq_v: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${eq_off_id}", investor_id: "${inv_id}", amount_cents: 250000, expected_offering_version: "${eq_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { eq_inv_id: $.data.id }
            - call: "POST /offerings/${eq_off_id}/close"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 200000, max_target_cents: 1000000, deadline_at: "2026-09-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { safe_off_id: $.data.id }
            - call: "POST /offerings/${safe_off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${safe_off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${safe_off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { safe_v: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${safe_off_id}", investor_id: "${inv_id}", amount_cents: 250000, expected_offering_version: "${safe_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { safe_inv_id: $.data.id }
            - call: "POST /offerings/${safe_off_id}/close"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
          trigger:
            - call: "GET /investments/${eq_inv_id}"
              payload: {}
              as: Investor
              as_user_id: "${inv_id}"
            - call: "GET /investments/${safe_inv_id}"
              payload: {}
              as: Investor
              as_user_id: "${inv_id}"
          assert:
            - "Investment.${eq_inv_id}.securities_issued == 232"
            - "Investment.${eq_inv_id}.refund_amount_cents == 600"
            - "Investment.${safe_inv_id}.securities_issued == 0"
            - "Investment.${safe_inv_id}.refund_amount_cents == 0"

  # =================================================================
  # Rule 2 — Combinatorial formulas across different modes
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: annual_limit_mode_a_nested_minmax_branch
        grounds:
          - calculations.investor_annual_limit
          - entities.Investor.fields.annual_income_cents
          - entities.Investor.fields.net_worth_cents
        distinguishing_aspect: |
          MODE (a): the limit formula has >=3 inputs (income, net worth, the cap constant) with non-linear
          interaction — a conditional branch selects 10%-of-lesser vs 5%-of-greater, then nests
          min(cap, max(floor, pct)); income/net-worth of $200k/$500k yields 2,000,000c via the 10%-of-LESSER branch.
        test_recipe:
          setup:
            - "Investor registered with income $200,000 (20,000,000c) and net worth $500,000 (50,000,000c) — both above the $124,000 cap."
          setup_api_calls:
            - call: "POST /investors"
              payload: { email: "modea@inv.com", legal_name: "Mode A", annual_income_cents: 20000000, net_worth_cents: 50000000 }
              as: Anonymous
              captures: { ma_id: $.data.id }
          trigger:
            - call: "GET /investors/${ma_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "Investor.${ma_id}.annual_limit_cents == 2000000"

      - name: close_disbursement_mode_b_fee_round_order
        grounds:
          - calculations.close_disbursement
          - entities.EscrowAccount.fields.disbursed_amount_cents
          - entities.EscrowAccount.fields.refunded_amount_cents
        distinguishing_aspect: |
          MODE (b): rounding-order divergence. With a SAFE batch of 100,001c + 100,006c, the platform fee
          computed on the SUM (round_half_up(200,007 * 7.5%) = 15,001c) differs by 1c from summing per-line
          fees (15,000c); the scaffold pins fee-on-sum, so disbursed = 200,007 - 15,001 = 185,006c.
        test_recipe:
          setup:
            - "Verified issuer; SAFE REG_CF offering LIVE (min 200,000c, max 1,000,000c, deadline 2026-09-01)."
            - "Two accredited investors each commit: 100,001c and 100,006c; offering final-closed (sum 200,007c >= 200,000c min)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Safe Co", ein: "222222222", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "a@inv.com", legal_name: "Inv A", annual_income_cents: 100000000, net_worth_cents: 100000000 }
              as: Anonymous
              captures: { a_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${a_id}", method: "INCOME" }
              as: Investor
              as_user_id: "${a_id}"
              captures: { a_req: $.data.id }
            - call: "POST /accreditation-requests/${a_req}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "b@inv.com", legal_name: "Inv B", annual_income_cents: 100000000, net_worth_cents: 100000000 }
              as: Anonymous
              captures: { b_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${b_id}", method: "INCOME" }
              as: Investor
              as_user_id: "${b_id}"
              captures: { b_req: $.data.id }
            - call: "POST /accreditation-requests/${b_req}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 200000, max_target_cents: 1000000, deadline_at: "2026-09-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { v0: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${off_id}", investor_id: "${a_id}", amount_cents: 100001, expected_offering_version: "${v0}" }
              as: Investor
              as_user_id: "${a_id}"
              captures: { v1: $.data.version }
            - call: "GET /offerings/${off_id}"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { v_after_a: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${off_id}", investor_id: "${b_id}", amount_cents: 100006, expected_offering_version: "${v_after_a}" }
              as: Investor
              as_user_id: "${b_id}"
            - call: "POST /offerings/${off_id}/close"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
          trigger:
            - call: "GET /offerings/${off_id}/escrow"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
          assert:
            - "EscrowAccount[0].disbursed_amount_cents == 185006"
            - "EscrowAccount[0].refunded_amount_cents == 15001"
            - "EscrowAccount[0].held_amount_cents == 0"

  # =================================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # =================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: form_c_cyclic_reject_resubmit_loop_on_offering
        grounds:
          - state_machines.Offering.form_c.SUBMITTED_to_REJECTED
          - state_machines.Offering.form_c.REJECTED_to_SUBMITTED
          - state_machines.Offering.form_c.SUBMITTED_to_QUALIFIED
        distinguishing_aspect: |
          CYCLE on the Offering.form_c dimension: SUBMITTED -> REJECTED -> SUBMITTED -> QUALIFIED, the same
          offering looping back through SUBMITTED twice before qualification — a non-linear revision loop.
        test_recipe:
          setup:
            - "Verified issuer with a DRAFT offering; Form C submitted, rejected once, resubmitted, then qualified."
          setup_api_calls:
            - call: "POST /issuers"
              payload: { legal_name: "Loop Co", ein: "333333333", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 100000, max_target_cents: 1000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/reject"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
          trigger:
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { fc: $.data.form_c_status }
          assert:
            - "Offering.${off_id}.form_c_status == QUALIFIED"

      - name: offering_branching_live_to_funded_vs_failed
        grounds:
          - state_machines.Offering.LIVE_to_FUNDED
          - state_machines.Offering.LIVE_to_FAILED
          - entities.Offering.fields.status
        distinguishing_aspect: |
          BRANCHING fork on a DIFFERENT entity (Offering primary status): the same LIVE state forks via
          POST /close to FUNDED (minimum met -> cap-table minted) or FAILED (minimum not met -> all refunded),
          with divergent side-effect sets per branch.
        test_recipe:
          setup:
            - "Two SAFE REG_CF offerings of one verified issuer, both LIVE, both min 500,000c."
            - "Offering P collects 600,000c accredited (>= min) then closes -> FUNDED with a cap-table entry."
            - "Offering Q collects 100,000c accredited (< min) then closes -> FAILED with full refund."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Fork Co", ein: "444444444", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "f@inv.com", legal_name: "Fork Inv", annual_income_cents: 100000000, net_worth_cents: 100000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${inv_id}", method: "INCOME" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { req: $.data.id }
            - call: "POST /accreditation-requests/${req}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 500000, max_target_cents: 2000000, deadline_at: "2026-08-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { p_id: $.data.id }
            - call: "POST /offerings/${p_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${p_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${p_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { p_v: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${p_id}", investor_id: "${inv_id}", amount_cents: 600000, expected_offering_version: "${p_v}" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /offerings/${p_id}/close"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { p_status: $.data.status }
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "SAFE", min_target_cents: 500000, max_target_cents: 2000000, deadline_at: "2026-09-15T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { q_id: $.data.id }
            - call: "POST /offerings/${q_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${q_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${q_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { q_v: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${q_id}", investor_id: "${inv_id}", amount_cents: 100000, expected_offering_version: "${q_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { q_inv_id: $.data.id }
          trigger:
            - call: "POST /offerings/${q_id}/close"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { q_status: $.data.status }
          assert:
            - "Offering.${p_id}.status == FUNDED"
            - "Offering.${q_id}.status == FAILED"
            - "Investment.${q_inv_id}.status == REFUNDED"
            - "Investment.${q_inv_id}.refund_amount_cents == 100000"

  # =================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =================================================================
  - rule_id: transitive_cascade
    instances:
      - name: rolling_close_cascade_depth3
        grounds:
          - state_machines.Offering.LIVE_to_LIVE
          - state_machines.Investment.COMMITTED_to_ISSUED
          - calculations.equity_issuance
          - calculations.close_disbursement
          - entities.CapTableEntry.fields.quantity
          - entities.EscrowAccount.fields.disbursed_amount_cents
        distinguishing_aspect: |
          DEPTH-3 chain triggered by POST /rolling-close: the rolling close mutates each Investment
          (COMMITTED -> ISSUED); that ISSUED transition itself mints a CapTableEntry AND debits the
          EscrowAccount (held -> disbursed); the escrow debit then drives Offering.swept_amount_cents up.
          Each hop is caused by the previous, not the original action.
        test_recipe:
          setup:
            - "Verified issuer; EQUITY REG_CF offering LIVE (price 1000c, min 2,000,000c, max 10,000,000c, deadline 2026-12-01)."
            - "One accredited investor commits 2,500,000c; a rolling close sweeps it (2,500,000 >= 2,000,000 min) while keeping the offering LIVE."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /issuers"
              payload: { legal_name: "Roll Co", ein: "555555555", home_state_code: "DE", entity_type: "C_CORP" }
              as: Anonymous
              captures: { iss_id: $.data.id }
            - call: "POST /issuers/${iss_id}/verify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /investors"
              payload: { email: "roll@inv.com", legal_name: "Roll Inv", annual_income_cents: 100000000, net_worth_cents: 100000000 }
              as: Anonymous
              captures: { inv_id: $.data.id }
            - call: "POST /accreditation-requests"
              payload: { investor_id: "${inv_id}", method: "INCOME" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { req: $.data.id }
            - call: "POST /accreditation-requests/${req}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "EQUITY", price_per_security_cents: 1000, min_target_cents: 2000000, max_target_cents: 10000000, deadline_at: "2026-12-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { v0: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${off_id}", investor_id: "${inv_id}", amount_cents: 2500000, expected_offering_version: "${v0}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { inv_inv_id: $.data.id }
          trigger:
            - call: "POST /offerings/${off_id}/rolling-close"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { swept: $.data.swept_amount_cents, status: $.data.status }
          assert:
            - "Investment.${inv_inv_id}.status == ISSUED"
