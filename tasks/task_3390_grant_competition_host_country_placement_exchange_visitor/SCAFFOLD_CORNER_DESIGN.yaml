            - "Grant.${gr}.status remains CONFIRMED and GET /exchange/grants/${gr}/incidents is empty"

      - name: second_open_incident_rejected
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=9 business_constraint ERR_ACTIVE_INCIDENT_EXISTS]
        distinguishing_aspect: "At most one OPEN incident per grant: with an incident already OPEN (grant SUSPENDED), a second declaration hits ERR_ACTIVE_INCIDENT_EXISTS — and note the grant is no longer ACTIVE either, yet the single-open-incident constraint is what fires."
        test_recipe:
          setup:
            - "Base pipeline to ACTIVE; clock 2027-11-01; incident 1 declared (grant now SUSPENDED)."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - *c_round_std
            - *c_accept
            - *c_confirm
            - *c_clock_orient
            - *c_visa_true
            - *c_clock_start
            - *c_activate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-11-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exchange/grants/${gr}/incidents"
              payload: { category: "NATURAL_DISASTER", description: "Flooding of host facility" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { inc1: $.data.id }
          trigger:
            - call: "POST /exchange/grants/${gr}/incidents"
              payload: { category: "MEDICAL", description: "Grantee hospitalized" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ACTIVE_INCIDENT_EXISTS"
            - "only one incident exists for the grant (GET /exchange/grants/${gr}/incidents returns 1 row)"
            - "Grant.${gr}.status remains SUSPENDED"

      - name: confirm_duration_outside_country_range_returns_422
        claim_type: Violation to Error
        grounds:
          - validations[priority=9 business_constraint ERR_DURATION_OUT_OF_RANGE]
        distinguishing_aspect: "Confirmed duration is recomputed from the actual dates, not the proposal: proposing 10 months but confirming 2027-09-01 to 2028-04-01 (7 months, below the DE minimum... no — within range) is fine, while 2027-09-01 to 2028-10-01 (13 months > max 12) fails with 422 ERR_DURATION_OUT_OF_RANGE."
        test_recipe:
          setup:
            - "Base pipeline to GRANT_PENDING (application proposed 10 months within the program's 6-12 range)."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - *c_round_std
            - *c_accept
          trigger:
            - call: "POST /exchange/applications/${app}/grant-confirmation"
              payload: { start_date: "2027-09-01T00:00:00Z", end_date: "2028-10-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_DURATION_OUT_OF_RANGE (13 months exceeds max_duration_months 12)"
            - "Grant.${gr}.status remains PROVISIONAL and Application.${app}.status remains GRANT_PENDING"

      - name: patch_country_program_after_cycle_open_rejected
        claim_type: Cross-Entity Validation
        grounds:
          - validations[priority=10 business_referential ERR_CYCLE_PHASE_FORBIDS]
          - endpoints.PATCH_/exchange/country-programs/{program_id}
        distinguishing_aspect: "Country program configuration freezes once its cycle opens: a PATCH after OPEN fails with ERR_CYCLE_PHASE_FORBIDS and no field (including slot_quota) changes."
        test_recipe:
          setup:
            - "Cycle with DE program; cycle OPEN."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
          trigger:
            - call: "PATCH /exchange/country-programs/${cp}"
              payload: { slot_quota: 5 }
              as: PlatformAdmin
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_CYCLE_PHASE_FORBIDS"
            - "GET /exchange/country-programs/${cp} still shows slot_quota == 1 and version == 1"

  # ===========================================================================
  - section: calculations
    instances:

      - name: weighted_score_literal_computation_74_25
        claim_type: Correct Result
        grounds:
          - calculations.weighted_screening_score
          - entities.Application.fields.national_weighted_score
        distinguishing_aspect: "Non-boundary correctness of the weighted formula with mixed inputs: scores (80,70,90) and (60,80,70) give avgs (70.00, 75.00, 80.00) and national_weighted_score == 74.25 exactly, stored when the second national score lands."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; independent application in NATIONAL_SCREENING."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 80, country_fit_score: 70, language_score: 90 }
              as: NationalReviewer
              as_user_id: "nr-1"
            - call: "GET /exchange/applications/${app}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { w_pre: $.data.national_weighted_score }
          trigger:
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 60, country_fit_score: 80, language_score: 70 }
              as: NationalReviewer
              as_user_id: "nr-2"
            - call: "GET /exchange/applications/${app}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { w: $.data.national_weighted_score }
          assert:
            - "Application.${app}.national_weighted_score == 74.25 (0.40*70.00 + 0.35*75.00 + 0.25*80.00 = 28.00 + 26.25 + 20.00)"
            - "the score is stored when the NATIONAL_QUORUM-th (2nd) score is posted, before any DECIDE call"
            - "after only the first score, national_weighted_score is null (quorum not yet met)"

      - name: language_gate_proficient_blocks_recommend
        claim_type: Constants Applied
        grounds:
          - calculations.weighted_screening_score
          - errors.ERR_LANGUAGE_CRITERION_UNMET
        distinguishing_aspect: "The country-specific language gate is independent of the weighted threshold: a PROFICIENT country rejects RECOMMEND at avg language 75 (< 80) even though the weighted score 78.75 clears 70.00."
        test_recipe:
          setup:
            - "Cycle with DE-variant program whose language_requirement is PROFICIENT; independent application scored (80,80,75) by two national reviewers (avg language 75, weighted 78.75). Cycle CLOSED."
          setup_api_calls:
            - *c_cycle
            - call: "POST /exchange/cycles/${cyc}/country-programs"
              payload: { country_code: "CN", slot_quota: 1, min_duration_months: 6, max_duration_months: 12, monthly_stipend_standard_cents: 300000, monthly_stipend_high_cents: 360000, dependent_allowance_monthly_cents: 50000, travel_allowance_cents: 150000, health_benefit_monthly_cents: 20000, language_requirement: "PROFICIENT" }
              as: PlatformAdmin
              captures: { cp: $.data.id }
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 80, country_fit_score: 80, language_score: 75 }
              as: NationalReviewer
              as_user_id: "nr-1"
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 80, country_fit_score: 80, language_score: 75 }
              as: NationalReviewer
              as_user_id: "nr-2"
            - *c_close
          trigger:
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "RECOMMEND" }
              as: NationalReviewer
              as_user_id: "nr-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_LANGUAGE_CRITERION_UNMET (avg language 75 < LANGUAGE_GATE_PROFICIENT 80)"
            - "the weighted score 78.75 >= 70.00 does NOT rescue the recommendation — the gate is conjunctive"
            - "Application.${app}.status remains NATIONAL_SCREENING"

  # ===========================================================================
  - section: validations
    instances:

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: Violation to Error
        grounds:
          - validations[priority=1 auth ERR_UNAUTHENTICATED]
        distinguishing_aspect: "Authentication precedes everything: a request without X-User-Role/X-User-ID to a perfectly valid resource id is a 401 ERR_UNAUTHENTICATED, outranking even role and existence checks."
        test_recipe:
          setup:
            - "One cycle exists."
          setup_api_calls:
            - *c_cycle
          trigger:
            - call: "GET /exchange/cycles/${cyc}"
              payload: {}
          assert:
            - "the request is sent with NO X-User-Role and NO X-User-ID headers"
            - "the response status is 401 and error_id == ERR_UNAUTHENTICATED"

      - name: applicant_cannot_decide_in_campus_review
        claim_type: Violation to Error
        grounds:
          - validations[priority=2 auth ERR_UNAUTHORIZED]
          - roles.CampusReviewer
        distinguishing_aspect: "Stage-role segregation: the DECIDE action in CAMPUS_REVIEW belongs to CampusReviewer only; an Applicant (even the application's owner) attempting ENDORSE gets 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; enrolled application in CAMPUS_REVIEW with quorum met."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - call: "POST /exchange/applicants"
              payload: { full_name: "Self Approver", email: "self.approver@example.com", applicant_type: "ENROLLED_STUDENT", home_institution_name: "State University", citizenship_country_code: "US" }
              as: Anonymous
              captures: { apl: $.data.id }
            - *c_app
            - *c_submit
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 75, country_fit_score: 75, language_score: 75 }
              as: CampusReviewer
              as_user_id: "cr-1"
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 75, country_fit_score: 75, language_score: 75 }
              as: CampusReviewer
              as_user_id: "cr-2"
          trigger:
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "DECIDE", outcome: "ENDORSE" }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED (Applicant may SUBMIT/WITHDRAW/DECLINE, never DECIDE)"
            - "Application.${app}.status remains CAMPUS_REVIEW"

      - name: campus_reviewer_cannot_score_during_national_stage
        claim_type: Violation to Error
        grounds:
          - validations[priority=2 auth ERR_UNAUTHORIZED]
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation of duties across review stages: a CampusReviewer posting to an application already in NATIONAL_SCREENING is 403 ERR_UNAUTHORIZED, and symmetrically a NationalReviewer cannot score a CAMPUS_REVIEW application."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; independent application in NATIONAL_SCREENING (independent applicants skip campus review)."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
          trigger:
            - call: "POST /exchange/applications/${app}/scores"
              payload: { feasibility_score: 70, country_fit_score: 70, language_score: 70 }
              as: CampusReviewer
              as_user_id: "cr-1"
              captures: { error_id: $.data.error_id }
            - call: "GET /exchange/applications/${app}/scores"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
          assert:
            - "the response status is 403 and error_id == ERR_UNAUTHORIZED (CampusReviewer's scoring window is CAMPUS_REVIEW only)"
            - "the score list remains empty — no partial write"

      - name: applicant_cannot_patch_anothers_application
        claim_type: Violation to Error
        grounds:
          - validations[priority=5 ownership ERR_NOT_RESOURCE_OWNER]
          - roles.Applicant
        distinguishing_aspect: "Ownership is checked against the FK chain: applicant B presenting a fresh correct version of applicant A's DRAFT application still gets 403 ERR_NOT_RESOURCE_OWNER — OCC freshness never substitutes for ownership."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; applicant A's DRAFT application (version 1); applicant B registered."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - call: "POST /exchange/applicants"
              payload: { full_name: "Burt Intruder", email: "burt.intruder@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "US" }
              as: Anonymous
              captures: { apl_b: $.data.id }
            - call: "GET /exchange/applications/${app}"
              payload: {}
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { app_v_now: $.data.version }
          trigger:
            - call: "PATCH /exchange/applications/${app}"
              payload: { project_title: "Hijacked Title", expected_application_version: "${app_v_now}" }
              as: Applicant
              as_user_id: "${apl_b}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_NOT_RESOURCE_OWNER"
            - "Application.${app}.project_title remains Harbor Sediments and version remains 1"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: applications_list_paginates_and_filters
        claim_type: Listing
        grounds:
          - endpoints.GET_/exchange/applications
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Filter+paginate interaction: three DRAFT applications in one cycle return total_count 3 with has_more true at limit 2 / offset 0, the tail page returns 1 row with has_more false, and the status filter narrows both rows and total_count."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; three independent applicants each holding one DRAFT application."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - call: "POST /exchange/applicants"
              payload: { full_name: "List One", email: "list.one@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "US" }
              as: Anonymous
              captures: { a1: $.data.id }
            - call: "POST /exchange/applicants"
              payload: { full_name: "List Two", email: "list.two@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "US" }
              as: Anonymous
              captures: { a2: $.data.id }
            - call: "POST /exchange/applicants"
              payload: { full_name: "List Three", email: "list.three@example.com", applicant_type: "INDEPENDENT", citizenship_country_code: "US" }
              as: Anonymous
              captures: { a3: $.data.id }
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${a1}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Alpha", project_summary: "a", proposed_duration_months: 10 }
              as: Applicant
              as_user_id: "${a1}"
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${a2}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Beta", project_summary: "b", proposed_duration_months: 10 }
              as: Applicant
              as_user_id: "${a2}"
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${a3}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Gamma", project_summary: "g", proposed_duration_months: 10 }
              as: Applicant
              as_user_id: "${a3}"
          trigger:
            - call: "GET /exchange/applications"
              payload: { cycle_id: "${cyc}", limit: 2, offset: 0 }
              as: ProgramOfficer
              as_user_id: "po-1"
          assert:
            - "page 1 returns exactly 2 rows with total_count == 3 and has_more == true; response_type == array"
            - "GET /exchange/applications?cycle_id=${cyc}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /exchange/applications?status=DRAFT returns 3 rows; GET /exchange/applications?status=AWARDED returns 0 rows with total_count == 0"
            - "GET /exchange/applications with no parameters uses defaults limit 10 offset 0"

      - name: round_respond_twice_returns_round_not_offered
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlacementRound
          - errors.ERR_ROUND_NOT_OFFERED
        distinguishing_aspect: "A terminal round is locked: after ACCEPT, a second response (DECLINE) on the same round fails with ERR_ROUND_NOT_OFFERED and the already-secured GRANT_PENDING application is untouched."
        test_recipe:
          setup:
            - "Base pipeline to GRANT_PENDING (round 1 ACCEPTED)."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - *c_round_std
            - *c_accept
          trigger:
            - call: "POST /exchange/placement-rounds/${rnd}/transition"
              payload: { action: "DECLINE" }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_ROUND_NOT_OFFERED"
            - "PlacementRound.${rnd}.status remains ACCEPTED and Application.${app}.status remains GRANT_PENDING"

      - name: duplicate_visa_sponsorship_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=9 business_constraint ERR_DUPLICATE_VISA]
          - state_machines.VisaSponsorship
        distinguishing_aspect: "Exactly one sponsorship per grant: the second issuance fails with ERR_DUPLICATE_VISA even with a different subject determination."
        test_recipe:
          setup:
            - "Base pipeline to CONFIRMED; visa sponsorship already issued (subject=true)."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - *c_round_std
            - *c_accept
            - *c_confirm
            - *c_clock_orient
            - *c_visa_true
          trigger:
            - call: "POST /exchange/grants/${gr}/visa-sponsorships"
              payload: { subject_to_home_residency: false, orientation_completed_at: "2027-06-10T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DUPLICATE_VISA"
            - "GET /exchange/grants/${gr}/visa-sponsorships returns exactly 1 row, the original subject_to_home_residency == true sponsorship"

      - name: activate_before_start_date_with_visa_returns_start_not_reached
        claim_type: Temporal Validation
        grounds:
          - state_machines.Grant.CONFIRMED_to_ACTIVE
          - errors.ERR_START_DATE_NOT_REACHED
        distinguishing_aspect: "With orientation properly recorded (visa issued), the pure temporal arm fires alone: ACTIVATE at clock 2027-08-15 before start_date 2027-09-01 fails with ERR_START_DATE_NOT_REACHED."
        test_recipe:
          setup:
            - "Base pipeline to CONFIRMED with visa issued (orientation 2027-06-01); clock 2027-08-15."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - *c_round_std
            - *c_accept
            - *c_confirm
            - *c_clock_orient
            - *c_visa_true
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange/grants/${gr}/transition"
              payload: { action: "ACTIVATE" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_START_DATE_NOT_REACHED (safety check passes, so the temporal check is the one that fires)"
            - "Grant.${gr}.status remains CONFIRMED and interim/final due dates remain unset"

      - name: confirm_start_in_past_returns_start_date_in_past
        claim_type: Temporal Validation
        grounds:
          - validations[priority=8 business_temporal ERR_START_DATE_IN_PAST]
        distinguishing_aspect: "Confirmation cannot backdate a program: with the clock at 2027-08-01 a start_date of 2027-07-01 (10-month window, in range) fails with ERR_START_DATE_IN_PAST."
        test_recipe:
          setup:
            - "Base pipeline to GRANT_PENDING; offer accepted before its deadline at the default clock; clock then advanced to 2027-08-01."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - *c_score80a
            - *c_score80b
            - *c_close
            - *c_recommend
            - *c_select
            - *c_getgrants
            - *c_round_std
            - *c_accept
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange/applications/${app}/grant-confirmation"
              payload: { start_date: "2027-07-01T00:00:00Z", end_date: "2028-05-01T00:00:00Z" }
              as: ProgramOfficer
              as_user_id: "po-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_START_DATE_IN_PAST (duration 10 months is in range; only the temporal check fails)"
            - "Grant.${gr}.status remains PROVISIONAL"

      - name: submit_after_deadline_returns_deadline_passed
        claim_type: Temporal Validation
        grounds:
          - validations[priority=8 business_temporal ERR_DEADLINE_PASSED]
        distinguishing_aspect: "The deadline is inclusive then closed: at clock 2026-10-16T00:00:00Z (past deadline 2026-10-15T23:59:59Z) with the cycle still OPEN, SUBMIT fails with ERR_DEADLINE_PASSED."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; independent applicant's DRAFT application; clock moved past the deadline."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-16T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /exchange/applications/${app}/transition"
              payload: { action: "SUBMIT" }
              as: Applicant
              as_user_id: "${apl}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_DEADLINE_PASSED (the cycle is still OPEN; only the temporal check fails)"
            - "Application.${app}.status remains DRAFT"

      - name: duplicate_application_on_second_submit
        claim_type: Violation to Error
        grounds:
          - validations[priority=9 business_constraint ERR_DUPLICATE_APPLICATION]
        distinguishing_aspect: "The duplicate guard fires at SUBMIT, not at create: an applicant may hold two DRAFTs in one cycle, but submitting the second while the first is NATIONAL_SCREENING fails with ERR_DUPLICATE_APPLICATION."
        test_recipe:
          setup:
            - "Cycle OPEN with DE program; one independent applicant with application A submitted (NATIONAL_SCREENING) and application B still DRAFT in the same cycle."
          setup_api_calls:
            - *c_cycle
            - *c_prog_de_q1
            - *c_open
            - *c_apl_ind
            - *c_app
            - *c_submit
            - call: "POST /exchange/applications"
              payload: { applicant_id: "${apl}", cycle_id: "${cyc}", country_program_id: "${cp}", project_title: "Second Draft", project_summary: "Another project", proposed_duration_months: 8, dependents_count: 0 }
              as: Applicant
              as_user_id: "${apl}"
              captures: { app_b: $.data.id }
          trigger:
            - call: "POST /exchange/applications/${app_b}/transition"
              payload: { action: "SUBMIT" }
