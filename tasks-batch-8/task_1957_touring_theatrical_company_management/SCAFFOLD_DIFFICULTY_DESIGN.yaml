            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { check_id: "$.data.id "}
            - call: "PUT /tech-checks/${check_id}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
              captures: { bk_ready: "$.data.booking_status "}
          trigger:
            - call: "PUT /tech-checks/${check_id}"
              payload: { actual_value: 38 }
              as: TourManager
              captures: { chk_status: "$.data.status "}
            - call: "GET /stops/${stop_id}"
              as: Producer
              captures: { bk_after: "$.data.booking_status", cp_after: "$.data.compliance_status "}
          assert:
            - "TechRiderCheck.${check_id}.status == FAIL (38 < 40)"
            - "Stop.${stop_id}.compliance_status == NON_COMPLIANT (link 1)"
            - "Stop.${stop_id}.booking_status == ADVANCED (link 2: READY certification revoked by the compliance flip)"

  # ---------------------------------------------------------------------------
