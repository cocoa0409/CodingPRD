          - validations[priority=7]
          - entities.Donor.fields.eligibility_status
          - errors[ERR_DONOR_NOT_ELIGIBLE]
        distinguishing_aspect: >
          Appointment's SCHEDULED->CHECKED_IN transition depends on the Donor's
