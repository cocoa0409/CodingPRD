    side_effects: []
  - method: GET
    path: "/api/sign-up-periods"
    description: "List sign-up periods with pagination"
    roles: [SchedulingOfficer, Operator, UnionRep, PayrollClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: SignUpPeriod[]
    side_effects: []
  - method: GET
    path: "/api/sign-up-periods/{id}"
    description: "Fetch one sign-up period"
