  - section: cross_cutting_complexity_layers
    instances:
      - name: a_rent_schedule_publication_carrying_a_stale_community_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.rent-schedule-publish-stale-community
          - endpoints.POST_/market-rent-schedules
          - errors.ERR_STALE_COMMUNITY_VERSION
        distinguishing_aspect: |
          This is the second of the two §1.2.1 concurrency rules — the first, on POST
          /concession-programs, is already exercised by the §1.8 priority instance
          stale_community_version_rejected_before_the_restricted_posture_check. What makes this one its
          own claim is that the version the client is holding was invalidated by a publication on the
          *other* product type: pricing writes bump the shared Community row, so two asset managers
          repricing different product types collide even though their schedules never touch. The retry
          with the refreshed version then supersedes the prior DETACHED schedule as normal.
        test_recipe:
          setup:
            - "Community 'Rushmere' (3 DETACHED + 1 COTTAGE) with plat APPROVED and one PUBLISHED DETACHED schedule."
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "Rushmere", market_code: "CO-COS", total_planned_units: 4, product_mix: { DETACHED: 3, COTTAGE: 1, TOWNHOME: 0 }, single_ownership_covenant: true, concession_budget_cents: 1000000, facility_commitment_cents: 25000000, maintenance_tech_headcount: 2 }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
              captures: { c: $.data.id }
            - call: "POST /communities/${c}/plat-submissions"
              payload: { plat_package_reference: "PLAT-RM-1" }
              as: DeveloperPrincipal
              as_user_id: "u_dev_1"
            - call: "POST /communities/${c}/plat-decisions"
              payload: { decision: "APPROVE" }
              as: EntitlementOfficer
              as_user_id: "u_ent_1"
            - call: "GET /communities/${c}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { v1: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 285000, expected_community_version: "${v1}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { s1: $.data.id }
            - call: "GET /communities/${c}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { v2: $.data.version }
          trigger:
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "COTTAGE", effective_from: "2026-08-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 219000, expected_community_version: "${v2}" }
              as: AssetManager
              as_user_id: "u_am_2"
              captures: { s2: $.data.id }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-09-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 292000, expected_community_version: "${v2}" }
              as: AssetManager
              as_user_id: "u_am_1"
            - call: "GET /communities/${c}"
              payload: {}
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { v3: $.data.version }
            - call: "POST /market-rent-schedules"
              payload: { community_id: "${c}", product_type: "DETACHED", effective_from: "2026-09-01T00:00:00Z", repricing_mode: "MANUAL", asking_rent_cents: 292000, expected_community_version: "${v3}" }
              as: AssetManager
              as_user_id: "u_am_1"
              captures: { s3: $.data.id }
          assert:
            - "The COTTAGE publication returns HTTP 201 and Community.${c}.version becomes ${v2} + 1"
            - "The DETACHED publication carrying ${v2} returns HTTP 412 with data.error_id == ERR_STALE_COMMUNITY_VERSION even though no COTTAGE data is involved"
            - "The rejected publication creates no MarketRentSchedule row and leaves MarketRentSchedule.${s1}.status == PUBLISHED with superseded_at null"
            - "${v3} == ${v2} + 1 — the failed write did not bump the version"
            - "The retry with ${v3} returns HTTP 201 with MarketRentSchedule.${s3}.status == PUBLISHED, and MarketRentSchedule.${s1}.status is now SUPERSEDED with superseded_at set"
            - "MarketRentSchedule.${s2}.status is still PUBLISHED — superseding is scoped to the (community, product_type) pair"
            - "Community.${c}.version is now ${v3} + 1"

      - name: cascading_side_effects_layer_is_covered_by_the_signature_cascade_instance
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: signature_cascade_propagates_four_hops_to_facility_conversion_pending
          rationale: |
            The §1.8 instance already walks the layer end to end: one POST /leases/{id}/signature is
            asserted through all four declared hops (homesite AVAILABLE -> LEASED, phase and community
            counters plus occupancy_ratio recomputed, lifecycle_status LEASE_UP -> STABILIZED at the
            0.7500 boundary, facility_status ADVANCE_ELIGIBLE -> CONVERSION_PENDING) and its companion
            instance lease_cancellation_reverses_the_whole_signature_cascade_and_the_concession_ledger
            covers the partial-failure/compensation half of the layer. Re-testing the chain here would
            duplicate the same call sequence with the same assertions.

      - name: dual_variant_calculation_layer_is_covered_by_the_two_variant_instances
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: concession_straight_line_versus_upfront_from_identical_lease_inputs
          rationale: |
            Both declared dual-variant calculations already have dedicated §1.8 instances that hold the
            inputs fixed and assert the divergence numerically — concession_amortization across
            STRAIGHT_LINE_NET_EFFECTIVE vs UPFRONT_FREE_RENT, and
            stabilized_valuation_trailing_actual_versus_forward_stabilized_same_state across the two
            valuation bases from one identical state. The layer has no third variant pair left to probe.

      - name: rate_threshold_triggers_layer_is_covered_by_the_boundary_instances
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: rent_growth_step_clamp_binds_at_exactly_20000_cents
          rationale: |
            Every threshold in the scaffold is already pinned at its boundary by a dedicated instance:
            the rent-growth step clamp at exactly 20000 cents and the services-fee tier at exactly
            200000 cents in §1.8, the 3x income multiple at exactly 894150 cents, the LTV covenant at
            exactly 6500 bps, the PM-transition occupancy gate at exactly half and the concession budget
            at exact exhaustion in §1.9. A further layer-level instance would only re-assert one of
            those same boundaries.

  - section: consistency_model
    instances:
      - name: the_signature_cascade_is_readable_immediately_after_the_write_returns
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/leases/{id}/signature
        distinguishing_aspect: |
          The declared consistency model is immediate, and the signature write is the deepest fan-out in
          the domain: it touches the Lease, the Household counter, the Homesite, the Phase and five
          denormalised Community fields. Immediacy means the very next read of any of those five rows —
          with no retry, no sleep and no intervening write — already reflects the cascade, and that the
          write's own response body is self-consistent with those reads rather than reporting a
          pre-cascade snapshot.
