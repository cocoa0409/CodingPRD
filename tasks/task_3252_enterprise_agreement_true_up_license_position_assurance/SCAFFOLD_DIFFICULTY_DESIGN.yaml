scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: server_core_per_host_vs_per_vm_divergence
        grounds:
          - calculations.license_position_computation
          - calculations.core_count_normalization
          - entities.Deployment.fields.licensing_mode
        distinguishing_aspect: |
          Dual-variant divergence on the LicensePositionSnapshot domain: the same
          physical host (64 cores, factor 1.0, 2 VMs of 4 vcores) requires 16
          core-licenses under PER_VM but 64 under PER_HOST — different results for
          identical hardware inputs on the Deployment/Snapshot entity domain.
        test_recipe:
          setup:
            - "Organization 'Core Org' with qualified_device_count 100 (level A) exists"
            - "Agreement AGR in ACTIVE status for that organization, start 2026-09-01 end 2029-08-31"
            - "Anniversary year 1 (2026-09-01..2027-08-31) exists"
            - "Server product SVR1 (PER_SERVER_CORE, SUBSCRIPTION, STANDARD) exists"
            - "Two SERVER deployments on identical hosts: 64 physical cores, core_factor 1.0, vm_count 2, vcores_per_vm 4 — D_HOST with licensing_mode PER_HOST, D_VM with licensing_mode PER_VM"
            - "No entitlements for SVR1"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Core Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-CORE-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "SVR1", name: "Server Std", license_model: "PER_SERVER_CORE", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "SRV", annual_unit_price_cents: 50000, license_mobility: true }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "SERVER", deployment_date: "2026-09-02", physical_cores_per_server: 64, core_factor: 1.0, vm_count: 2, vcores_per_vm: 4, licensing_mode: "PER_HOST", hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "SERVER", deployment_date: "2026-09-02", physical_cores_per_server: 64, core_factor: 1.0, vm_count: 2, vcores_per_vm: 4, licensing_mode: "PER_VM", hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/position-snapshots"
              payload: { anniversary_id: "${ann_id}" }
              as: LicensingSpecialist
              captures: { snap_id: $.data.id }
          assert:
            - "snapshot ${snap_id} lines[0].required_licenses == 80 (PER_HOST host contributes 64, PER_VM host contributes min(64, 2*8)=16, summed 64+16=80)"
            - "snapshot ${snap_id} lines[0].entitled_quantity == 0"
            - "snapshot ${snap_id} lines[0].net_position == -80"
      - name: true_up_anniversary_proration_vs_full_year_retroactive
        grounds:
          - calculations.true_up_retroactive_pricing
          - entities.TrueUpLine.fields.pricing_variant
        distinguishing_aspect: |
          Dual-variant divergence on the TrueUpLine monetary domain: identical
          growth (10 units at 100000 cents, 3 months of growth) is priced at
          833333 cents under ANNIVERSARY_PRORATION versus 1000000 cents under
          FULL_YEAR_RETROACTIVE — different money for identical inputs on the
          TrueUpReport/TrueUpLine domain (distinct from the license-position
          domain of the sibling instance).
        test_recipe:
          setup:
            - "Organization 'TU Org' with qualified_device_count 100 (level A) exists"
            - "Agreement in ACTIVE with anniversary year 1 open"
            - "PER_USER product U1 (annual_unit_price_cents 100000) exists"
            - "Entitlement for U1 quantity 10 exists"
            - "Deployment reporting 20 users exists (growth = 10)"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "TU Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-TU-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "U1", name: "User Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_id}", quantity: 10 }
              as: LicensingSpecialist
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 20, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /licensing/true-up-reports/${rep_id}/lines"
              payload: { product_id: "${prod_id}", months_growth: 3, pricing_variant: "ANNIVERSARY_PRORATION" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { line_a: $.data.total_amount_cents }
            - call: "POST /licensing/true-up-reports/${rep_id}/lines"
              payload: { product_id: "${prod_id}", months_growth: 3, pricing_variant: "FULL_YEAR_RETROACTIVE" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { line_b: $.data.total_amount_cents }
          assert:
            - "ANNIVERSARY_PRORATION line total_amount_cents == 833333 (10 * 100000 * 10/12, round_half_up)"
            - "FULL_YEAR_RETROACTIVE line total_amount_cents == 1000000 (10 * 100000, no proration)"
            - "TrueUpReport.${rep_id}.total_amount_cents == 1833333 (sum of per-line rounded totals)"
            - "the two variants diverge by exactly 166667 cents for identical growth inputs"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: per_vm_cap_minimum_three_way_interaction
        grounds:
          - calculations.core_count_normalization
          - calculations.license_position_computation
        distinguishing_aspect: |
          Mode (a): core_count_normalization is a >=3-input non-linear formula —
          nested max(16, ceil(cores*factor)) interacts with max(8, vcores) per VM
          and an outer min(host_demand, vm_count * per_vm_demand); a small host
          (20 cores, factor 0.75) with 4 VMs of 4 vcores yields 16 from the host
          minimum capping 32 VM demand, not from the VM minimum.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement, open anniversary 1 exist"
            - "PER_SERVER_CORE product SVR2 exists"
            - "One SERVER deployment: 20 physical cores, core_factor 0.75, vm_count 4, vcores_per_vm 4, licensing_mode PER_VM"
            - "No entitlements for SVR2"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Combo Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-CBO-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "SVR2", name: "Server Ent", license_model: "PER_SERVER_CORE", license_kind: "PERPETUAL", edition: "ENTERPRISE", family: "SRV", annual_unit_price_cents: 80000, license_mobility: true }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "SERVER", deployment_date: "2026-09-02", physical_cores_per_server: 20, core_factor: 0.75, vm_count: 4, vcores_per_vm: 4, licensing_mode: "PER_VM", hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/position-snapshots"
              payload: { anniversary_id: "${ann_id}" }
              as: LicensingSpecialist
              captures: { snap_id: $.data.id }
          assert:
            - "snapshot ${snap_id} lines[0].required_licenses == 16 (normalized host max(16, ceil(20*0.75))=16 caps VM demand 4*max(8,4)=32; min(16,32)=16)"
            - "snapshot ${snap_id} lines[0].net_position == -16"
      - name: true_up_per_line_rounding_order
        grounds:
          - calculations.true_up_retroactive_pricing
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — two lines of growth 1 at
          unit price 100001 cents with months_growth 7 each prorate to
          round_half_up(100001*6/12)=50001 per line; the pinned order (round per
          line, then sum) yields report total 100002, whereas sum-then-round would
          yield 100001. The scaffold pins per-line-then-sum.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement, open anniversary 1 exist"
            - "Two PER_USER products R1 and R2, each annual_unit_price_cents 100001"
            - "No entitlements for R1/R2; one deployment of 1 user per product (growth 1 each)"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Round Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-RND-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "R1", name: "Round One", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "RND", annual_unit_price_cents: 100001, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod1_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "R2", name: "Round Two", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "RND", annual_unit_price_cents: 100001, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod2_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod1_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 1, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod2_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 1, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /licensing/true-up-reports/${rep_id}/lines"
              payload: { product_id: "${prod1_id}", months_growth: 7, pricing_variant: "ANNIVERSARY_PRORATION" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { line1_total: $.data.total_amount_cents }
            - call: "POST /licensing/true-up-reports/${rep_id}/lines"
              payload: { product_id: "${prod2_id}", months_growth: 7, pricing_variant: "ANNIVERSARY_PRORATION" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { line2_total: $.data.total_amount_cents }
          assert:
            - "each line total_amount_cents == 50001 (round_half_up(100001*6/12) = round_half_up(50000.5))"
            - "TrueUpReport.${rep_id}.total_amount_cents == 100002 (per-line rounding summed), NOT 100001 (sum-then-round)"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: true_up_report_rejection_revision_cycle
        grounds:
          - state_machines.TrueUpReport.REJECTED_to_DRAFT
          - state_machines.TrueUpReport.DRAFT_to_SUBMITTED
          - state_machines.TrueUpReport.SUBMITTED_to_REJECTED
        distinguishing_aspect: |
          TrueUpReport has a revision cycle DRAFT -> SUBMITTED -> REJECTED ->
          DRAFT: after one full cycle revision_count == 1, the report is
          submittable again, and the cycle is non-linear (a rejected report is
          not terminal).
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement, open anniversary 1 exist"
            - "PER_USER product C1 with entitlement 5 and deployment of 8 users (growth 3)"
            - "TrueUpReport for anniversary 1 exists in DRAFT with one line"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Cyc Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-CYC-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "C1", name: "Cycle Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_id}", quantity: 5 }
              as: LicensingSpecialist
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 8, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /licensing/true-up-reports/${rep_id}/lines"
              payload: { product_id: "${prod_id}", months_growth: 6, pricing_variant: "ANNIVERSARY_PRORATION" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/true-up-reports/${rep_id}/submit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/true-up-reports/${rep_id}/reject"
              payload: {}
              as: LicensingSpecialist
          trigger:
            - call: "POST /licensing/true-up-reports/${rep_id}/revise"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/true-up-reports/${rep_id}/submit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${org_id}"
          assert:
            - "after revise: TrueUpReport.${rep_id}.status == DRAFT and revision_count == 1"
            - "after second submit: TrueUpReport.${rep_id}.status == SUBMITTED (cycle completed; REJECTED is not terminal)"
      - name: hosting_authorization_suspend_reinstate_cycle
        grounds:
          - state_machines.HostingAuthorization.APPROVED_to_SUSPENDED
          - state_machines.HostingAuthorization.SUSPENDED_to_APPROVED
        distinguishing_aspect: |
          HostingAuthorization has an APPROVED <-> SUSPENDED cycle on a different
          entity than TrueUpReport: after approve -> suspend -> reinstate the
          authorization returns to APPROVED, and a suspended authorization does
          not gate new THIRD_PARTY_DATACENTER deployments.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement, open anniversary 1 exist"
            - "PER_SERVER_CORE product H1 with license_mobility true exists"
            - "HostingAuthorization for (agreement, H1) exists, APPROVED"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Host Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-HST-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "H1", name: "Host Srv", license_model: "PER_SERVER_CORE", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "SRV", annual_unit_price_cents: 50000, license_mobility: true }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/hosting-authorizations"
              payload: { product_id: "${prod_id}", provider_name: "HosterCo", effective_on: "2026-09-01" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { auth_id: $.data.id }
            - call: "POST /licensing/hosting-authorizations/${auth_id}/review"
              payload: { decision: "APPROVE" }
              as: LicensingSpecialist
          trigger:
            - call: "POST /licensing/hosting-authorizations/${auth_id}/suspend"
              payload: {}
              as: LicensingSpecialist
            - call: "POST /licensing/hosting-authorizations/${auth_id}/reinstate"
              payload: {}
              as: LicensingSpecialist
              captures: { auth_status: $.data.status }
          assert:
            - "after suspend: HostingAuthorization.${auth_id}.status == SUSPENDED"
            - "after reinstate: HostingAuthorization.${auth_id}.status == APPROVED (cycle returned to the pre-suspension state)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers, depths 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: settle_cascade_entitlement_baseline_anniversary_closure_benefit_accrual
        grounds:
          - state_machines.TrueUpReport.INVOICED_to_SETTLED
          - calculations.benefit_accrual
          - entities.LicenseEntitlement.fields.locked_baseline_quantity
          - entities.EnrollmentAnniversary.fields.true_up_closed
        distinguishing_aspect: |
          Depth-3 cascade originating at the SETTLE transition: settle mutates
          the TrueUpReport (hop 1); each line's growth ratifies the matching
          LicenseEntitlement quantity and locked_baseline_quantity (hop 2); the
          anniversary referenced by the report closes true_up_closed (hop 3) and
          the settled total accrues new ACTIVE AssuranceBenefitGrant rows (also
          hop 3) — each hop is caused by the previous one, not by the endpoint
          directly.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement, anniversary 1 open"
            - "PER_USER product S1 (unit 100000): entitlement 5, deployment 11 users (growth 6)"
            - "TrueUpReport with one FULL_YEAR_RETROACTIVE line (months_growth 2), submitted, accepted, invoiced (total 600000)"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Settle Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-SET-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "S1", name: "Settle Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_id}", quantity: 5 }
              as: LicensingSpecialist
              captures: { ent_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 11, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /licensing/true-up-reports/${rep_id}/lines"
              payload: { product_id: "${prod_id}", months_growth: 2, pricing_variant: "FULL_YEAR_RETROACTIVE" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/true-up-reports/${rep_id}/submit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/true-up-reports/${rep_id}/accept"
              payload: {}
              as: LicensingSpecialist
            - call: "POST /licensing/true-up-reports/${rep_id}/invoice"
              payload: {}
              as: LicensingSpecialist
          trigger:
            - call: "POST /licensing/true-up-reports/${rep_id}/settle"
              payload: {}
              as: LicensingSpecialist
            - call: "GET /licensing/entitlements/${ent_id}"
              as: LicensingSpecialist
              captures: { ent_qty: $.data.quantity, ent_base: $.data.locked_baseline_quantity }
            - call: "GET /licensing/anniversaries/${ann_id}"
              as: LicensingSpecialist
              captures: { ann_closed: $.data.true_up_closed }
            - call: "GET /licensing/agreements/${agr_id}/benefit-grants"
              as: LicensingSpecialist
          assert:
            - "TrueUpReport.${rep_id}.status == SETTLED and total_amount_cents == 600000 (6 * 100000 full-year)"
            - "LicenseEntitlement.${ent_id}.quantity == 11 (5 + growth 6) and locked_baseline_quantity == 11"
            - "EnrollmentAnniversary.${ann_id}.true_up_closed == true"
            - "one AssuranceBenefitGrant with benefit_type == TRAINING_VOUCHER and quantity_granted == 5 exists (settled total 600000 >= 50000000 tier-1 threshold)"
            - "one AssuranceBenefitGrant with benefit_type == SUPPORT_INCIDENT and quantity_granted == 1 exists"
      - name: non_renewal_cascade_grants_forfeited_commitments_expired
        grounds:
          - state_machines.Agreement.RENEWAL_PENDING_to_NON_RENEWED
          - state_machines.AssuranceBenefitGrant.ACTIVE_to_FORFEITED
          - state_machines.CloudCommitment.ACTIVE_to_EXPIRED
        distinguishing_aspect: |
          Depth-2 cascade originating at the DECLINE-RENEWAL (NON_RENEW)
          transition — a different trigger than settle: decline-renewal mutates
          the Agreement to NON_RENEWED (hop 1); that terminal state itself
          forfeits every ACTIVE AssuranceBenefitGrant and expires every ACTIVE
          CloudCommitment on the agreement (hop 2).
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement ending 2029-08-31 with clock at 2029-07-01 (inside renewal window)"
            - "One ACTIVE benefit grant (expires 2029-12-31) and one ACTIVE cloud commitment (100000 cents, expires 2029-12-31) under the agreement"
            - "Agreement moved to RENEWAL_PENDING"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "NonRen Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-NRN-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/benefit-grants"
              payload: { benefit_type: "TRAINING_VOUCHER", quantity_granted: 4, expires_on: "2029-12-31" }
              as: LicensingSpecialist
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/cloud-commitments"
              payload: { committed_amount_cents: 100000, expires_on: "2029-12-31" }
              as: LicensingSpecialist
              captures: { com_id: $.data.id }
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2029-07-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/renewal-review"
              payload: {}
              as: LicensingSpecialist
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/decline-renewal"
              payload: { decision: "NON_RENEW" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "GET /licensing/benefit-grants/${grant_id}"
              as: LicensingSpecialist
              captures: { grant_status: $.data.status }
            - call: "GET /licensing/cloud-commitments/${com_id}"
              as: LicensingSpecialist
              captures: { com_status: $.data.status }
          assert:
            - "Agreement.${agr_id}.status == NON_RENEWED"
            - "AssuranceBenefitGrant.${grant_id}.status == FORFEITED (hop 2 caused by the agreement transition)"
            - "CloudCommitment.${com_id}.status == EXPIRED (hop 2 caused by the agreement transition)"
            - "CloudCommitment.${com_id}.consumed_amount_cents == 0 (forfeited remainder, no refund)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_before_business_temporal_benefit_redemption
        grounds:
          - validations[priority=8]
          - validations[priority=17]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BENEFIT_EXPIRED]
        distinguishing_aspect: |
          Category pair state (priority 8) vs business_temporal (priority 17):
          a redemption against a DEPLETED grant that is also past its expires_on
          fails both the state precondition and the temporal check; the
          higher-priority ERR_INVALID_STATE (409) wins.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement"
            - "Grant with quantity_granted 2, expires_on 2027-01-01, fully redeemed (status DEPLETED)"
            - "Logical clock advanced to 2027-06-01 (past expiry)"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Pri1 Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-PR1-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/benefit-grants"
              payload: { benefit_type: "SUPPORT_INCIDENT", quantity_granted: 2, expires_on: "2027-01-01" }
              as: LicensingSpecialist
              captures: { grant_id: $.data.id }
            - call: "POST /licensing/benefit-grants/${grant_id}/redemptions"
              payload: { quantity: 2 }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2027-06-01T00:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /licensing/benefit-grants/${grant_id}/redemptions"
              payload: { quantity: 1 }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 — state (priority 8) beats business_temporal (priority 17) even though the grant is also past expiry"
      - name: business_constraint_before_business_fiscal_step_up
        grounds:
          - validations[priority=21]
          - validations[priority=24]
          - errors[ERR_STEP_UP_INVALID]
          - errors[ERR_QUANTITY_BELOW_BASELINE]
        distinguishing_aspect: |
          Category pair business_constraint (priority 21) vs business_fiscal
          (priority 24): a step-up whose target product is in the WRONG family
          and whose quantity would drive the source below its ratified baseline
          fails both rules; ERR_STEP_UP_INVALID (422) wins because constraint
          checks precede fiscal checks.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement, anniversary 1"
            - "PER_USER product X1 family OFFICE edition STANDARD; entitlement quantity 10 with locked_baseline_quantity 10 (settled true-up ratified it)"
            - "PER_USER product Y1 family DATABASE edition ENTERPRISE exists (wrong family for step-up)"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Pri2 Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-PR2-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "X1", name: "Office Std", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "OFFICE", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_x: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "Y1", name: "Db Ent", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "ENTERPRISE", family: "DATABASE", annual_unit_price_cents: 300000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_y: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_x}", quantity: 10 }
              as: LicensingSpecialist
              captures: { ent_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_x}", scope: "USER", deployment_date: "2026-09-02", user_count: 10, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /licensing/true-up-reports/${rep_id}/lines"
              payload: { product_id: "${prod_x}", months_growth: 1, pricing_variant: "FULL_YEAR_RETROACTIVE" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/true-up-reports/${rep_id}/submit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/true-up-reports/${rep_id}/accept"
              payload: {}
              as: LicensingSpecialist
            - call: "POST /licensing/true-up-reports/${rep_id}/invoice"
              payload: {}
              as: LicensingSpecialist
            - call: "POST /licensing/true-up-reports/${rep_id}/settle"
              payload: {}
              as: LicensingSpecialist
          trigger:
            - call: "POST /licensing/entitlements/${ent_id}/step-up"
              payload: { target_product_id: "${prod_y}", quantity: 10 }
              as: LicensingSpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_STEP_UP_INVALID (422) — wrong-family constraint (priority 21) beats the below-baseline fiscal check (priority 24); settling left quantity == locked_baseline_quantity == 10 so stepping 10 would breach the baseline too"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: price_level_tier_boundary_249_vs_250
        grounds:
          - calculations.price_level_tiering
          - validations[priority=28]
          - entities.Organization.fields.price_level
        distinguishing_aspect: |
          Numeric threshold boundary: qualified_device_count 249 yields
          price_level A while exactly 250 crosses into B (>= lower-inclusive).
          Verified through PATCH /organizations/{id} — a different metric
          (device count) and endpoint than the sibling boundary.
        test_recipe:
          setup:
            - "Organization with qualified_device_count 249 (level A) exists"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Tier Org", qualified_device_count: 249 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id, lvl_a: $.data.price_level }
          trigger:
            - call: "PATCH /licensing/organizations/${org_id}"
              payload: { qualified_device_count: 250 }
              as: ProgramAdministrator
              captures: { lvl_b: $.data.price_level }
          assert:
            - "price_level at 249 == A"
            - "price_level at exactly 250 == B (lower-inclusive boundary; 249 remains A)"
      - name: benefit_depletion_zero_remaining_boundary
        grounds:
          - state_machines.AssuranceBenefitGrant.ACTIVE_to_DEPLETED
          - entities.AssuranceBenefitGrant.fields.quantity_remaining
        distinguishing_aspect: |
          Zero-count boundary on a different metric (grant quantity_remaining)
          reached via a different endpoint (POST /benefit-grants/{id}/redemptions):
          redeeming exactly the remaining 2 units transitions the grant to
          DEPLETED at the exact zero boundary, and one further redemption is
          rejected — the empty-quantity edge.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement"
            - "ACTIVE grant, quantity_granted 2, expires_on 2028-01-01"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Bnd Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-BND-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/benefit-grants"
              payload: { benefit_type: "TRAINING_VOUCHER", quantity_granted: 2, expires_on: "2028-01-01" }
              as: LicensingSpecialist
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /licensing/benefit-grants/${grant_id}/redemptions"
              payload: { quantity: 2 }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "GET /licensing/benefit-grants/${grant_id}"
              as: LicensingSpecialist
              captures: { g_status: $.data.status, g_rem: $.data.quantity_remaining }
            - call: "POST /licensing/benefit-grants/${grant_id}/redemptions"
              payload: { quantity: 1 }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "after redeeming exactly 2 of 2: grant.status == DEPLETED and quantity_remaining == 0"
            - "further redemption of 1 fails with ERR_INVALID_STATE (grant DEPLETED — state check at priority 8 fires before the remaining-quantity fiscal check)"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_requires_agreement_active
        grounds:
          - state_machines.TrueUpReport.DRAFT_to_SUBMITTED
          - validations[priority=9]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair TrueUpReport -> Agreement: submit is valid only while the
          report's agreement is ACTIVE; after the agreement is expired the same
          submit on the still-DRAFT report fails with ERR_AGREEMENT_NOT_ACTIVE.
        test_recipe:
          setup:
            - "Organization (level A); agreement start 2026-09-01 end 2026-09-30, ACTIVE; anniversary 1 open"
            - "Product W1, entitlement 1, deployment of 2 users; DRAFT report with one line"
            - "Clock advanced to 2026-10-01 and agreement expired via POST /agreements/{id}/expire"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "XOrg1", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-XD1-1", start_date: "2026-09-01", end_date: "2026-09-30" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2026-09-30" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "W1", name: "W Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${prod_id}", quantity: 1 }
              as: LicensingSpecialist
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 2, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /licensing/true-up-reports/${rep_id}/lines"
              payload: { product_id: "${prod_id}", months_growth: 1, pricing_variant: "ANNIVERSARY_PRORATION" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/expire"
              payload: {}
              as: ProgramAdministrator
          trigger:
            - call: "POST /licensing/true-up-reports/${rep_id}/submit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_ACTIVE (409): the DRAFT report's submit is gated on the parent Agreement state, a cross-entity dependency"
      - name: third_party_hosting_requires_approved_authorization
        grounds:
          - validations[priority=20]
          - state_machines.HostingAuthorization.PENDING_REVIEW_to_APPROVED
          - errors[ERR_HOSTING_NOT_AUTHORIZED]
        distinguishing_aspect: |
          Entity pair Deployment -> HostingAuthorization (a different pair than
          TrueUpReport -> Agreement): a SERVER deployment to
          THIRD_PARTY_DATACENTER is rejected while the authorization is only
          PENDING_REVIEW, and succeeds after the authorization transitions to
          APPROVED with effective_on <= deployment_date.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement, anniversary 1"
            - "PER_SERVER_CORE product HP with license_mobility true"
            - "HostingAuthorization for HP in PENDING_REVIEW (effective_on 2026-09-01)"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "XOrg2", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-XD2-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "HP", name: "Host Prod", license_model: "PER_SERVER_CORE", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "SRV", annual_unit_price_cents: 50000, license_mobility: true }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/hosting-authorizations"
              payload: { product_id: "${prod_id}", provider_name: "HosterCo", effective_on: "2026-09-01" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { auth_id: $.data.id }
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "SERVER", deployment_date: "2026-09-02", physical_cores_per_server: 32, core_factor: 1.0, vm_count: 0, licensing_mode: "PER_HOST", hosting: "THIRD_PARTY_DATACENTER" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
            - call: "POST /licensing/hosting-authorizations/${auth_id}/review"
              payload: { decision: "APPROVE" }
              as: LicensingSpecialist
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "SERVER", deployment_date: "2026-09-02", physical_cores_per_server: 32, core_factor: 1.0, vm_count: 0, licensing_mode: "PER_HOST", hosting: "THIRD_PARTY_DATACENTER" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { dep_id: $.data.id }
          assert:
            - "first deployment attempt fails with ERR_HOSTING_NOT_AUTHORIZED (422) while authorization is PENDING_REVIEW"
            - "after review APPROVE, the identical deployment succeeds (201) — the Deployment's validity depends on HostingAuthorization.status"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: anniversary_period_strictly_increasing_sequence
        grounds:
          - validations[priority=15]
          - errors[ERR_INVALID_ANNIVERSARY_SEQUENCE]
          - entities.EnrollmentAnniversary.fields.period_start
        distinguishing_aspect: |
          Interval semantics: half-open strict ordering on the EnrollmentAnniversary
          resource — a second anniversary whose period_start equals the previous
          period_start (adjacency with gap=0 but equal start) is rejected; only a
          strictly later period_start with year_index incremented is accepted.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement with anniversary year 1 (2026-09-01..2027-08-31) already registered"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Ovl1 Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-OV1-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 2, period_start: "2026-09-01", period_end: "2028-08-31" }
              as: ProgramAdministrator
              captures: { err: $.data.error_id }
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 2, period_start: "2027-09-01", period_end: "2028-08-31" }
              as: ProgramAdministrator
              captures: { ann2_id: $.data.id }
          assert:
            - "anniversary 2 with period_start == 2026-09-01 (equal to year 1 start) fails with ERR_INVALID_ANNIVERSARY_SEQUENCE"
            - "anniversary 2 with period_start == 2027-09-01 (strictly later) succeeds (201)"
      - name: true_up_duplicate_window_per_anniversary
        grounds:
          - validations[priority=23]
          - errors[ERR_DUPLICATE_TRUE_UP]
        distinguishing_aspect: |
          Interval semantics: aggregate occupancy on the anniversary resource —
          an anniversary period admits AT MOST ONE non-REJECTED true-up report
          (capacity = 1 over the whole period, regardless of dates); only after
          the first report is REJECTED does the slot free. Different semantics
          than the sibling's strict ordering: capacity-based, not adjacency-based.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement, anniversary 1 open"
            - "Product D1 with deployment (no entitlement needed); first DRAFT report exists for anniversary 1"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Ovl2 Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-OV2-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/anniversaries"
              payload: { year_index: 1, period_start: "2026-09-01", period_end: "2027-08-31" }
              as: ProgramAdministrator
              captures: { ann_id: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "D1", name: "Dup Cal", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "CAL", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { prod_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/deployments"
              payload: { product_id: "${prod_id}", scope: "USER", deployment_date: "2026-09-02", user_count: 3, hosting: "ON_PREMISES" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { rep1_id: $.data.id }
          trigger:
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
            - call: "POST /licensing/true-up-reports/${rep1_id}/lines"
              payload: { product_id: "${prod_id}", months_growth: 1, pricing_variant: "FULL_YEAR_RETROACTIVE" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/true-up-reports/${rep1_id}/submit"
              payload: {}
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/true-up-reports/${rep1_id}/reject"
              payload: {}
              as: LicensingSpecialist
            - call: "POST /licensing/agreements/${agr_id}/true-up-reports"
              payload: { anniversary_id: "${ann_id}" }
              as: CustomerAdmin
              as_user_id: "${org_id}"
              captures: { rep2_id: $.data.id }
          assert:
            - "second report creation while report 1 is DRAFT fails with ERR_DUPLICATE_TRUE_UP (409)"
            - "after report 1 is SUBMITTED then REJECTED, a new report for the same anniversary succeeds (201) — REJECTED frees the anniversary slot"

  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: benefit_redemption_conserves_granted_quantity
        grounds:
          - entities.AssuranceBenefitGrant.fields.quantity_granted
          - entities.AssuranceBenefitGrant.fields.quantity_remaining
          - entities.BenefitRedemption.fields.quantity
          - state_machines.AssuranceBenefitGrant.ACTIVE_to_DEPLETED
        distinguishing_aspect: |
          Conserved quantity: grant.quantity_granted == grant.quantity_remaining
          + sum(redemption.quantity) at all times. A redemption (forward) paired
          with the grant's remaining-balance decrement (compensation) leaves the
          granted total unchanged — verified across two partial redemptions and
          the DEPLETED transition.
        test_recipe:
          setup:
            - "Organization (level A), ACTIVE agreement"
            - "ACTIVE grant quantity_granted 5, expires_on 2028-01-01"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Inv1 Org", qualified_device_count: 100 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-IV1-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/agreements/${agr_id}/benefit-grants"
              payload: { benefit_type: "TRAINING_VOUCHER", quantity_granted: 5, expires_on: "2028-01-01" }
              as: LicensingSpecialist
              captures: { grant_id: $.data.id }
          trigger:
            - call: "POST /licensing/benefit-grants/${grant_id}/redemptions"
              payload: { quantity: 2 }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "POST /licensing/benefit-grants/${grant_id}/redemptions"
              payload: { quantity: 3 }
              as: CustomerAdmin
              as_user_id: "${org_id}"
            - call: "GET /licensing/benefit-grants/${grant_id}"
              as: LicensingSpecialist
              captures: { g_rem: $.data.quantity_remaining, g_status: $.data.status }
          assert:
            - "invariant after redemptions of 2 and 3: quantity_granted (5) == quantity_remaining (0) + sum(redemptions) (5)"
            - "grant.status == DEPLETED exactly when the conserved balance reaches remaining == 0"
      - name: step_up_conserves_total_license_quantity
        grounds:
          - calculations.step_up_conversion
          - entities.StepUpConversion.fields.quantity
          - state_machines.StepUpConversion.REQUESTED_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity of a different type — total licensed units per
          agreement per family: source entitlement loses exactly q units and the
          target entitlement gains exactly q units, so
          source.quantity + target.quantity is unchanged by the execute; only
          the edition mix (and charge_cents = q * edition price delta) changes.
        test_recipe:
          setup:
            - "Organization level C (3000 devices), ACTIVE agreement, anniversary 1"
            - "Family OFFICE products: O-STD (STANDARD, 100000) and O-ENT (ENTERPRISE, 200000), both SUBSCRIPTION PER_USER"
            - "Entitlement for O-STD quantity 10 (unit price 100000 at level... created while org at level A — created BEFORE tier change: see calls)"
          setup_api_calls:
            - call: "POST /licensing/organizations"
              payload: { legal_name: "Inv2 Org", qualified_device_count: 3000 }
              as: ProgramAdministrator
              captures: { org_id: $.data.id }
            - call: "POST /licensing/agreements"
              payload: { organization_id: "${org_id}", enrollment_number: "E-IV2-1", start_date: "2026-09-01", end_date: "2029-08-31" }
              as: ProgramAdministrator
              captures: { agr_id: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /licensing/products"
              payload: { sku: "O-STD", name: "Office Std", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "STANDARD", family: "OFFICE", annual_unit_price_cents: 100000, license_mobility: false }
              as: ProgramAdministrator
              captures: { p_std: $.data.id }
            - call: "POST /licensing/products"
              payload: { sku: "O-ENT", name: "Office Ent", license_model: "PER_USER", license_kind: "SUBSCRIPTION", edition: "ENTERPRISE", family: "OFFICE", annual_unit_price_cents: 200000, license_mobility: false }
              as: ProgramAdministrator
              captures: { p_ent: $.data.id }
            - call: "POST /licensing/agreements/${agr_id}/entitlements"
              payload: { product_id: "${p_std}", quantity: 10 }
              as: LicensingSpecialist
              captures: { ent_id: $.data.id }
            - call: "POST /licensing/entitlements/${ent_id}/step-up"
              payload: { target_product_id: "${p_ent}", quantity: 7 }
              as: LicensingSpecialist
              captures: { conv_id: $.data.id }
          trigger:
            - call: "POST /licensing/step-up-conversions/${conv_id}/execute"
              payload: {}
              as: LicensingSpecialist
              captures: { charge: $.data.charge_cents }
            - call: "GET /licensing/entitlements/${ent_id}"
              as: LicensingSpecialist
              captures: { src_qty: $.data.quantity }
            - call: "GET /licensing/agreements/${agr_id}/entitlements"
              payload: {}
              as: LicensingSpecialist
          assert:
            - "source entitlement quantity == 3 (10 - 7) and target O-ENT entitlement quantity == 7; total 3 + 7 == 10 conserved"
            - "charge_cents == 560000 (7 * (round_half_up(200000*0.90) - 100000) = 7 * 80000)"
            - "target entitlement unit_price_cents == 180000 (level C multiplier 0.90 on 200000)"



