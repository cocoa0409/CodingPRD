    path: "/committee-members/{id}/votes"
    description: "List the ballots one member has cast."
    roles: [SlateAdmin, DevelopmentExec, CommitteeMember]
    code: 200
    input: ["limit?", "offset?"]
    output: CommitteeVote[]
    side_effects: []
  - method: POST
    path: "/greenlight-reviews"
    description: "Convene a greenlight review. Supersedes any OPEN/VOTING review on the project, so the caller must supply the project version it last observed."
    roles: [SlateAdmin]
    code: 201
    input: [project_id, session_date, expected_project_version]
    output: GreenlightReview
    side_effects:
      - "status := OPEN"
      - "other OPEN/VOTING reviews on the project := WITHDRAWN with withdrawal_reason SUPERSEDED_BY_NEW_REVIEW"
      - "increments DevelopmentProject.version by 1"
  - method: GET
    path: "/greenlight-reviews/{id}"
    description: "Read one review, including the frozen eligible weight and the running tallies."
    roles: [SlateAdmin, DevelopmentExec, CommitteeMember, BusinessAffairs]
    code: 200
    input: []
    output: GreenlightReview
    side_effects: []
  - method: GET
    path: "/greenlight-reviews"
    description: "List greenlight reviews filtered by project or status."
    roles: [SlateAdmin, DevelopmentExec, CommitteeMember, BusinessAffairs]
    code: 200
    input: ["project_id?", "status?", "limit?", "offset?"]
    output: GreenlightReview[]
    side_effects: []
  - method: POST
    path: "/greenlight-reviews/{id}/open-voting"
    description: "Open the ballot. Freezes eligible_weight_bps from the ACTIVE membership; requires the project's rights axis to be OWNED."
    roles: [SlateAdmin]
    code: 200
    input: []
    output: GreenlightReview
    side_effects: ["status := VOTING; eligible_weight_bps frozen"]
  - method: POST
    path: "/greenlight-reviews/{id}/votes"
    description: "Cast one weighted ballot. Segregation of duties bars a member who is also the project's owning exec."
    roles: [CommitteeMember]
    code: 201
    input: [vote_value, "comment?"]
    output: CommitteeVote
    side_effects:
      - "creates CommitteeVote with member_id := X-User-ID and weight_bps_snapshot := the member's current vote_weight_bps"
      - "review cast/decisive/approve weights and veto_cast recomputed"
  - method: GET
    path: "/greenlight-reviews/{id}/votes"
    description: "List the ballots cast on one review."
    roles: [SlateAdmin, DevelopmentExec, CommitteeMember, BusinessAffairs]
    code: 200
    input: ["limit?", "offset?"]
    output: CommitteeVote[]
    side_effects: []
  - method: POST
    path: "/greenlight-reviews/{id}/close"
    description: "Close the ballot and resolve the outcome through the `greenlight_weighted_tally` ladder."
    roles: [SlateAdmin]
    code: 200
    input: ["decision_note?"]
    output: GreenlightReview
    side_effects:
      - "quorum_pct and approval_pct computed"
      - "status := PASSED | DECLINED | DEFERRED"
      - "on PASSED: DevelopmentProject.development_status := GREENLIT, LiteraryProperty.tracking_tier := PRIORITY, LIVE board entries := ARCHIVED"
  - method: POST
    path: "/greenlight-reviews/{id}/withdraw"
    description: "Pull a review off the agenda."
    roles: [SlateAdmin]
    code: 200
    input: [reason]
    output: GreenlightReview
    side_effects: ["status := WITHDRAWN, withdrawal_reason := reason"]

  # ---- Test-driving surface -------------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [SlateAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["all subsequent current_utc reads return the supplied instant"]
  - method: GET
    path: "/_clock"
    description: "Read the logical clock. Returns 2026-08-01T00:00:00Z until set_current_utc is called."
    roles: [SlateAdmin, StoryEditor, BusinessAffairs, DevelopmentExec]
    code: 200
    input: []
    output: { current_utc: string }
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing/empty, or X-User-Role is not one of the eight declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity-backed role acts on a resource it does not own (Reader on another reader's assignment/report, Writer on another writer's engagement)"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the approver of coverage is the editor who assigned it, the payer of a milestone is its approver, or a committee member votes on a project they own as exec"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "no LiteraryProperty with the given id"
  - id: ERR_SUBMISSION_NOT_FOUND
    http: 404
    condition: "no Submission with the given id"
  - id: ERR_RELEASE_FORM_NOT_FOUND
    http: 404
    condition: "no ReleaseForm with the given id"
  - id: ERR_DOCUMENT_NOT_FOUND
    http: 404
    condition: "no RightsChainDocument with the given id, including an unresolvable supersedes_document_id"
  - id: ERR_READER_NOT_FOUND
    http: 404
    condition: "no Reader with the given id"
  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "no CoverageAssignment with the given id"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "no CoverageReport with the given id"
  - id: ERR_BOARD_ENTRY_NOT_FOUND
    http: 404
    condition: "no TrackingBoardEntry with the given id"
  - id: ERR_OPTION_NOT_FOUND
    http: 404
    condition: "no OptionAgreement with the given id"
  - id: ERR_PROJECT_NOT_FOUND
    http: 404
    condition: "no DevelopmentProject with the given id"
  - id: ERR_WRITER_NOT_FOUND
    http: 404
    condition: "no Writer with the given id"
  - id: ERR_ENGAGEMENT_NOT_FOUND
    http: 404
    condition: "no WriterEngagement with the given id"
  - id: ERR_MILESTONE_NOT_FOUND
    http: 404
    condition: "no MilestonePayment with the given id"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "no GreenlightReview with the given id"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "no CommitteeMember with the given id"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required input field is missing or carries the wrong JSON type"
  - id: ERR_INVALID_ENUM_VALUE
    http: 422
    condition: "an enum-typed input carries a value outside its declared member set"
  - id: ERR_VALUE_OUT_OF_RANGE
    http: 422
    condition: "a numeric input falls outside its declared range (craft score outside 1..10, weekly_capacity outside 1..20, vote_weight_bps outside 1..10000, non-positive money, limit outside 1..100)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_property_version / expected_project_version does not match the parent's current version"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the requested transition is not declared from the resource's current state, or a creation endpoint's parent is in an inadmissible state"
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "the target resource already sits in one of its terminal states"
  - id: ERR_RELEASE_FORM_REQUIRED
    http: 409
    condition: "clear-intake or assign-reader on a submission that requires a release form with no EXECUTED or WAIVED form on file"
  - id: ERR_RELEASE_FORM_EXPIRED
    http: 409
    condition: "assign-reader after lazy expiry has moved the submission's release form to EXPIRED"
  - id: ERR_RIGHTS_CHAIN_INCOMPLETE
    http: 409
    condition: "executing an option against a property whose rights_chain_status is not CLEAR"
  - id: ERR_PROPERTY_RIGHTS_DISPUTED
    http: 409
    condition: "assign-reader on a submission whose property has rights_chain_status == DISPUTED"
  - id: ERR_OPTION_NOT_ACTIVE
    http: 409
    condition: "attaching a writer against an option whose status is not in {ACTIVE, EXTENDED, EXERCISED}. A project may be set up against a DRAFTED option, but no writer may be attached until that option is executed."
  - id: ERR_OPTION_MISMATCH
    http: 409
    condition: "the supplied option_agreement_id belongs to a different property than the supplied property_id"
  - id: ERR_OPTION_EXPIRED
    http: 409
    condition: "exercising or extending an option at or after option_end_at"
  - id: ERR_OPTION_PERIOD_OVERLAP
    http: 409
    condition: "executing an option whose half-open window intersects an ACTIVE/EXTENDED/EXERCISED option on the same property"
  - id: ERR_RIGHTS_NOT_OWNED
    http: 409
    condition: "opening greenlight voting on a project whose rights_status is not OWNED"
  - id: ERR_READER_WINDOW_CONFLICT
    http: 409
    condition: "the requested coverage window collides with an open assignment of the resolved reader under the closed-interval-plus-12-hour-buffer rule"
  - id: ERR_READER_AT_CAPACITY
    http: 409
    condition: "an explicitly named reader is not ACTIVE or already holds weekly_capacity open assignments"
  - id: ERR_NO_ELIGIBLE_READER
    http: 409
    condition: "auto-selection finds an empty candidate pool"
  - id: ERR_WRITER_OVERCOMMITTED
    http: 409
    condition: "attaching would give the writer more than WRITER_MAX_CONCURRENT_ENGAGEMENTS overlapping ATTACHED/ACTIVE engagements"
  - id: ERR_COVERAGE_INCOMPLETE
    http: 422
    condition: "submitting coverage with a missing craft score, missing recommendation, or fewer than 250 synopsis words"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "requesting a third revision round on the same coverage report"
  - id: ERR_DUPLICATE_VOTE
    http: 409
    condition: "a committee member casts a second ballot on the same review"
  - id: ERR_COMMITTEE_TOO_SMALL
    http: 409
    condition: "opening voting with fewer than three ACTIVE committee members"
  - id: ERR_QUORUM_NOT_MET
    http: 409
    condition: "closing a review whose quorum_pct is below 60.00; the review stays in VOTING"
  - id: ERR_MILESTONE_SEQUENCE_VIOLATION
    http: 409
    condition: "approving a milestone while a lower sequence_index milestone on the same engagement is neither PAID nor VOIDED"
  - id: ERR_BUDGET_EXCEEDED
    http: 409
    condition: "the engagement's total_fee_cents would push committed_writer_fee_cents past the project's writer_budget_cap_cents"
  - id: ERR_GUILD_MINIMUM_VIOLATION
    http: 422
    condition: "a guild writer's total_fee_cents is below the guild minimum for the engagement_type"
  - id: ERR_TURNAROUND_NOT_MATURE
    http: 409
    condition: "serving a reversion notice before turnaround_eligible_at"

roles:
  - name: SlateAdmin
    description: "Slate operations: seats readers, writers and committee members, convenes and chairs greenlight reviews, and drives the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /readers, PATCH /readers/{id}"
      - "POST /writers"
      - "POST /committee-members, PATCH /committee-members/{id}"
      - "POST /greenlight-reviews, .../open-voting, .../close, .../withdraw"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /literary-properties (with StoryEditor)"
      - "all GET reads except reader-private and submitter-private surfaces"

  - name: StoryEditor
    description: "Story department: logs and clears submissions, opens and waives release forms, assigns readers, and approves or rejects coverage. Cannot approve coverage on an assignment it made."
    identity: "opaque"
    exclusive_operations:
      - "POST /submissions/{id}/release-forms, POST /release-forms/{id}/send, POST /release-forms/{id}/waive"
      - "POST /submissions/{id}/clear-intake"
      - "POST /submissions/{id}/assign-reader"
      - "POST /coverage-assignments/{id}/recall"
      - "POST /coverage-reports/{id}/request-revision, .../approve, .../reject"
    shared_operations:
      - "POST /literary-properties (with SlateAdmin)"
      - "POST /submissions, POST /submissions/{id}/withdraw (with Submitter)"

  - name: Submitter
    description: "External submitting party (agency, manager, attorney or unsolicited writer). Logs submissions, executes release forms, withdraws."
    identity: "opaque"
    exclusive_operations:
      - "POST /release-forms/{id}/execute"
    shared_operations:
      - "POST /submissions, POST /submissions/{id}/withdraw (with StoryEditor)"
      - "GET /submissions/{id}, GET /release-forms/{id}, GET /submissions/{id}/release-forms"

  - name: Reader
    description: "Story analyst. Starts assignments, fills in and submits coverage reports. Acts only on its own assignments."
    identity: "entity_backed:Reader"
    exclusive_operations:
      - "POST /coverage-assignments/{id}/start"
      - "PATCH /coverage-reports/{id}"
      - "POST /coverage-reports/{id}/submit"
    shared_operations:
      - "GET /coverage-assignments, GET /coverage-reports, GET /submissions, GET /literary-properties"

  - name: BusinessAffairs
    description: "Business & legal affairs: files chain-of-title documents, papers and administers option agreements, serves reversion notices, and approves and pays writer milestones. Cannot pay a milestone it approved."
    identity: "opaque"
    exclusive_operations:
      - "POST /literary-properties/{id}/rights-documents"
      - "POST /option-agreements and every option action endpoint"
      - "POST /development-projects/{id}/reversion-notice"
      - "POST /milestone-payments/{id}/approve, POST /milestone-payments/{id}/pay"
    shared_operations:
      - "GET reads across properties, options, projects, engagements and milestones"

  - name: DevelopmentExec
    description: "Creative executive owning slate projects: sets up projects, proposes and attaches writers, terminates engagements, places projects in turnaround."
    identity: "opaque"
    exclusive_operations:
      - "POST /development-projects, POST /development-projects/{id}/place-in-turnaround"
      - "POST /writer-engagements, .../attach, .../complete, .../terminate"
    shared_operations:
      - "GET reads across projects, engagements, milestones, reviews and the tracking board"

  - name: Writer
    description: "Engaged screenwriter. Delivers drafts and polishes against their own engagements."
    identity: "entity_backed:Writer"
    exclusive_operations:
      - "POST /writer-engagements/{id}/deliver"
    shared_operations:
      - "GET /writers/{id}, GET /writer-engagements, GET /milestone-payments"

  - name: CommitteeMember
    description: "Greenlight committee seat carrying a weighted ballot and possibly veto power. Barred from voting on a project it owns as development exec."
    identity: "entity_backed:CommitteeMember"
    exclusive_operations:
      - "POST /greenlight-reviews/{id}/votes"
    shared_operations:
      - "GET /greenlight-reviews, GET /greenlight-reviews/{id}/votes, GET /committee-members, GET /development-projects, GET /tracking-board-entries"
