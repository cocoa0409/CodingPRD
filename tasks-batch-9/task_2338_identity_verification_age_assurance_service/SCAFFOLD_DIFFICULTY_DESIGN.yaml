            - call: "POST /idv/clients"
              payload: { name: "Acme Incl", home_jurisdiction_code: "US", biometric_retention_mode: "DELETE_ON_COMPLETE", daily_session_quota: 50, granted_review_credits: 2 }
              as: PlatformAdmin
              as_user_id: "admin-1"
