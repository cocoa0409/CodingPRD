# =============================================================================
# Task 1976 — Copyright Licensing & Rights Clearance (media rights & clearances desk)
# Scaffold seed tables (§1.0–§1.7)
# Difficulty directive: beyond-expert — deep state machines, precedence chains,
# tight OCC races, boundary precision, cross-entity cascades.
# =============================================================================

scenario: |
  1976. Copyright Licensing & Rights Clearance (media rights & clearances desk): asset rights metadata & permitted-use scope, clearance request workflow by media & territory/term, rights holder identification & orphan work handling, license fee negotiation & payment, usage tracking against license limits & renewal alerts, takedown/DMCA notice handling, fair use assessment documentation, expiration & content retirement

domain_name: copyright-rights-clearance
api_prefix: /rights

complexity_profile:
  primary_archetype: quota_allocation        # usage units reserved/consumed against License limits
  secondary_archetype: temporal_windowing    # territory/term windows, embargo windows, DMCA clocks
  complexity_layers:
    - optimistic_concurrency                 # OCC on ClearanceRequest.version and License.version
    - cascading_side_effects                 # takedown → asset posture → license → reservations → alerts
    - dual_variant_calculation               # provisional vs final fee; gross vs net usage consumption
    - scheduled_deferred_actions             # DMCA counter-notice clock, renewal alerts, auto-expiry
  entity_topology: hybrid                    # tree (Asset→ClearanceRequest→License→Usage) + cross-cutting TakedownNotice / RightsHolder
  state_machine_shape: cyclic                # negotiation rounds cycle; License has parallel dims; Asset posture is posture_driven
  relationship_patterns:
    - one_to_many
    - cross_aggregate                        # TakedownNotice → License suppression; FairUseAssessment ↔ ClearanceRequest
    - polymorphic                            # UsageEvent.source_kind references UsageReservation or direct-grant
  role_model: segregation_of_duties          # requester ≠ approver; negotiator ≠ payer; clearance approver ≠ fair-use certifier
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Asset
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Work title" }
      - { name: work_kind, type: enum, source: input, description: "MUSICAL_COMPOSITION | SOUND_RECORDING | FILM_CLIP | STILL_IMAGE | LITERARY_EXCERPT" }
      - { name: permitted_media, type: array, source: input, description: "Enum list subset of {BROADCAST_TV, STREAMING, THEATRICAL, RADIO, SOCIAL, PRINT}; uses outside this set are never clearable" }
      - { name: embargo_until, type: datetime, source: input, description: "Optional; asset cannot be licensed for use_start_at earlier than embargo_until + EMBARGO_BUFFER_DAYS", default: null }
      - { name: rights_holder_id, type: string, source: input, description: "FK -> RightsHolder.id; nullable while holder unidentified" , default: null }
      - { name: orphan_status, type: enum, source: system, description: "NOT_ORPHAN | DILIGENCE_PENDING | ORPHAN_CERTIFIED; derived from rights_holder_id + RightsDiligenceLog", default: NOT_ORPHAN }
      - { name: posture, type: enum, source: computed, description: "CLEAR | ENCUMBERED | SUSPENDED | RETIRED — derived from active TakedownNotice, License overlap, orphan_status" }
      - { name: retired_at, type: datetime, source: system, description: "Set when posture enters RETIRED; immutable thereafter", default: null }

  - name: RightsHolder
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Rights holder legal name" }
      - { name: holder_kind, type: enum, source: input, description: "PUBLISHER | LABEL | ESTATE | COLLECTIVE | INDIVIDUAL" }
      - { name: mfn_floor_cents, type: integer, source: input, description: "Most-favored-nation floor: no license to this holder may price below this per-unit floor unless holder_kind=ESTATE" }
      - { name: contact_verified, type: boolean, source: input, description: "Whether the desk has verified a contact channel", default: false }

  - name: RightsDiligenceLog
    parent: Asset
    common_fields: false          # append-only event: id + created_at only
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; set from path" }
      - { name: search_channel, type: enum, source: input, description: "COPYRIGHT_OFFICE | PERFORMING_RIGHTS_ORG | UNION_GUILD | COMMERCIAL_DATABASE | DIRECT_OUTREACH" }
      - { name: outcome, type: enum, source: input, description: "HOLDER_FOUND | NO_RESULT | CONFLICTING_CLAIM" }
      - { name: notes, type: string, source: input, description: "Free-text diligence notes" }

  - name: ClearanceRequest
    parent: Asset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; set from path" }
      - { name: requester_id, type: string, source: system, description: "X-User-ID of creating Requester (segregation-of-duties anchor)" }
      - { name: media, type: enum, source: input, description: "BROADCAST_TV | STREAMING | THEATRICAL | RADIO | SOCIAL | PRINT" }
      - { name: territory, type: enum, source: input, description: "NA | EMEA | LATAM | APAC | WORLD" }
      - { name: use_start_at, type: datetime, source: input, description: "Half-open window start (inclusive)" }
      - { name: use_end_at, type: datetime, source: input, description: "Half-open window end (exclusive); must be > use_start_at" }
      - { name: requested_units, type: integer, source: input, description: "Units of use (exhibitions / streams / impressions in thousands) requested" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | HOLDER_REVIEW | NEGOTIATING | APPROVED | DENIED | WITHDRAWN | FAIR_USE_ROUTE | LICENSED | EXPIRED" }
      - { name: negotiation_round, type: integer, source: system, description: "Count of completed fee rounds; 0 at SUBMITTED", default: 0 }
      - { name: agreed_fee_cents, type: integer, source: computed, description: "Set at APPROVED from latest NegotiationRound accepted offer" }
      - { name: fair_use_assessment_id, type: string, source: system, description: "FK -> FairUseAssessment.id; set when status enters FAIR_USE_ROUTE", default: null }

  - name: NegotiationRound
    parent: ClearanceRequest
    common_fields: false          # append-only
    fields:
      - { name: clearance_request_id, type: string, source: system, description: "FK -> ClearanceRequest.id; set from path" }
      - { name: round_index, type: integer, source: system, description: "Monotonic per request, starts at 1" }
      - { name: offered_fee_cents, type: integer, source: input, description: "Fee offered by the acting party" }
      - { name: offered_by_role, type: enum, source: system, description: "NEGOTIATOR | RIGHTS_HOLDER_REP — derived from X-User-Role (Negotiator→NEGOTIATOR, RightsHolderRep→RIGHTS_HOLDER_REP); consecutive rounds by the same offered_by_role are rejected (ERR_ROUND_ROLE_ALTERNATION). A round POST that fails validation persists NO row." }
      - { name: outcome, type: enum, source: system, description: "OPEN | ACCEPTED | REJECTED | SUPERSEDED" }

  - name: License
    parent: ClearanceRequest
    common_fields: true
    fields:
      - { name: clearance_request_id, type: string, source: system, description: "FK -> ClearanceRequest.id; one License max per request" }
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; denormalized at grant for posture cascade" }
      - { name: territory, type: enum, source: system, description: "Copied from ClearanceRequest at grant" }
      - { name: media, type: enum, source: system, description: "Copied from ClearanceRequest at grant" }
      - { name: term_start_at, type: datetime, source: system, description: "= ClearanceRequest.use_start_at (inclusive)" }
      - { name: term_end_at, type: datetime, source: system, description: "= ClearanceRequest.use_end_at (exclusive)" }
      - { name: unit_limit, type: integer, source: system, description: "= ClearanceRequest.requested_units at grant" }
      - { name: fee_agreed_cents, type: integer, source: system, description: "= ClearanceRequest.agreed_fee_cents at grant" }
      - { name: fee_status, type: enum, source: system, description: "Parallel dim 1: UNPAID | PARTIALLY_PAID | PAID | REFUNDED" }
      - { name: lifecycle, type: enum, source: system, description: "Parallel dim 2: ACTIVE | SUSPENDED | EXPIRED | REVOKED" }
      - { name: units_reserved, type: integer, source: computed, description: "Sum of UsageReservation.units for reservations in HELD" }
      - { name: units_consumed_net, type: integer, source: computed, description: "Net-consumption variant: consumed minus takedown-struck UsageEvents" }
      - { name: units_consumed_gross, type: integer, source: computed, description: "Gross-consumption variant: all POSTED UsageEvents" }
      - { name: renewal_alert_id, type: string, source: system, description: "FK -> RenewalAlert.id created at grant", default: null }

  - name: UsageReservation
    parent: License
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id; set from path" }
      - { name: units, type: integer, source: input, description: "Units to reserve; >= 1" }
      - { name: status, type: enum, source: system, description: "HELD | CONSUMED | RELEASED | FORFEITED" }
      - { name: hold_expires_at, type: datetime, source: system, description: "= created_at + HOLD_TTL_HOURS; system forfeits on expiry" }

  - name: UsageEvent
    parent: License
    common_fields: false          # append-only ledger
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id; set from path" }
      - { name: reservation_id, type: string, source: input, description: "FK -> UsageReservation.id; nullable for direct-grant usage", default: null }
      - { name: units, type: integer, source: input, description: "Units consumed; >= 1" }
      - { name: used_at, type: datetime, source: input, description: "When the use occurred; must fall inside license term [term_start_at, term_end_at)" }
      - { name: posting_kind, type: enum, source: system, description: "POSTED | STRUCK — STRUCK when consumed by takedown remedy" }

  - name: LicensePayment
    parent: License
    common_fields: false          # append-only ledger
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id; set from path" }
      - { name: amount_cents, type: integer, source: input, description: "Positive = payment; negative = refund" }
      - { name: payer_id, type: string, source: system, description: "X-User-ID of FinancePayer (segregation anchor)" }
      - { name: posted_at, type: datetime, source: system, description: "Server timestamp" }

  - name: FairUseAssessment
    parent: Asset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; set from path" }
      - { name: clearance_request_id, type: string, source: input, description: "FK -> ClearanceRequest.id this assessment substitutes for" }
      - { name: factor_scores, type: object, source: input, description: "{purpose:1..4, nature:1..4, amount:1..4, market:1..4} — four-factor test scores" }
      - { name: composite_score, type: integer, source: computed, description: "purpose+nature+amount+market weighted per fair_use_score rule" }
      - { name: certified, type: boolean, source: system, description: "Set true by LegalCertifier when composite >= FAIR_USE_CERTIFY_MIN" }
      - { name: status, type: enum, source: system, description: "DRAFT | CERTIFIED | REJECTED | SUPERSEDED" }

  - name: TakedownNotice
    parent: Asset
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: system, description: "FK -> Asset.id; set from path" }
      - { name: claimant_name, type: string, source: input, description: "DMCA claimant" }
      - { name: received_at, type: datetime, source: system, description: "Server timestamp at creation" }
      - { name: counter_notice_due_at, type: datetime, source: system, description: "= received_at + DMCA_COUNTER_WINDOW_DAYS" }
      - { name: status, type: enum, source: system, description: "PENDING | COUNTERED | UPHELD | RETRACTED" }

  - name: RenewalAlert
    parent: License
    common_fields: true
    fields:
      - { name: license_id, type: string, source: system, description: "FK -> License.id; set at License grant" }
      - { name: fires_at, type: datetime, source: system, description: "= License.term_end_at - RENEWAL_ALERT_LEAD_DAYS" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | FIRED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Asset
    initial_state: CLEAR
    terminal_states: [RETIRED]
    note: "Asset.status is the `posture` computed field; transitions below are the *recompute triggers* plus the manual retire action. posture is derived per asset_posture calculation, never set directly."
    transitions:
      - from: ANY
        to: RECOMPUTE
        trigger: "system: any TakedownNotice / License / orphan_status change touching this asset"
        actor: system
        preconditions: []
        side_effects:
          - "Recompute asset_posture per calculation asset_posture"
          - "If posture transitions to SUSPENDED: cascade — every License on asset with lifecycle=ACTIVE becomes SUSPENDED"
          - "If posture transitions away from SUSPENDED: licenses SUSPENDED by the cascade become ACTIVE (only those with suspension_cause=TAKEDOWN)"
          - "Posture transition refreshes updated_at and bumps version"

      - from: ANY
        to: RETIRED
        trigger: "POST /rights/assets/{assetId}/retire"
        actor: AssetCurator
        preconditions:
          - "posture != RETIRED (ERR_ALREADY_TERMINAL)"
          - "No License on asset with lifecycle = ACTIVE or SUSPENDED (ERR_ASSET_HAS_LIVE_LICENSES)"
          - "No ClearanceRequest on asset in SUBMITTED, HOLDER_REVIEW, NEGOTIATING, or APPROVED (ERR_ASSET_HAS_OPEN_REQUESTS)"
        side_effects:
          - "retired_at = current clock; posture = RETIRED"
          - "ClearanceRequests in DENIED/WITHDRAWN/EXPIRED untouched"
          - "Any RenewalAlert under any License of this asset still SCHEDULED → CANCELLED"

  - entity: ClearanceRequest
    initial_state: SUBMITTED
    terminal_states: [DENIED, WITHDRAWN, LICENSED, EXPIRED, FAIR_USE_ROUTE]
    transitions:
      - from: SUBMITTED
        to: HOLDER_REVIEW
        trigger: "POST /rights/clearance-requests/{id}/advance"
        actor: ClearanceOfficer
        preconditions:
          - "Orphan-diligence gate first: asset.orphan_status == DILIGENCE_PENDING → ERR_ORPHAN_DILIGENCE_INCOMPLETE; ORPHAN_CERTIFIED passes only when asset.rights_holder_id is null"
          - "request.media ∈ asset.permitted_media (ERR_MEDIA_NOT_PERMITTED)"
          - "asset.posture == CLEAR (ERR_ASSET_POSTURE_BLOCKED) — evaluated after the orphan gate so the more specific diligence diagnosis wins"
        side_effects: []

      - from: HOLDER_REVIEW
        to: NEGOTIATING
        trigger: "POST /rights/clearance-requests/{id}/advance"
        actor: ClearanceOfficer
        preconditions:
          - "asset.rights_holder_id is not null OR asset.orphan_status == ORPHAN_CERTIFIED (ERR_RIGHTS_HOLDER_UNIDENTIFIED)"
        side_effects:
          - "negotiation_round stays 0; first NegotiationRound may now be posted"

      - from: NEGOTIATING
        to: NEGOTIATING
        trigger: "POST /rights/clearance-requests/{id}/rounds (accept omitted/false)"
        actor: Negotiator | RightsHolderRep
        preconditions:
          - "negotiation_round < MAX_NEGOTIATION_ROUNDS (ERR_NEGOTIATION_EXHAUSTED)"
          - "offered_by_role alternates: the new round's offered_by_role must differ from the latest persisted round's offered_by_role (ERR_ROUND_ROLE_ALTERNATION); first round may be offered by either role"
        side_effects:
          - "Previous OPEN NegotiationRound → SUPERSEDED"
          - "negotiation_round increments by 1"

      - from: NEGOTIATING
        to: APPROVED
        trigger: "POST /rights/clearance-requests/{id}/rounds with accept=true"
        actor: Negotiator | RightsHolderRep
        preconditions:
          - "Alternation rule as above (checked before MFN)"
          - "The accepted round's offered_fee_cents >= mfn floor per mfn_floor calculation (ERR_MFN_FLOOR_VIOLATION) unless holder is ESTATE"
          - "Actor's X-User-ID != request.requester_id (segregation of duties, ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Round outcome = ACCEPTED; request.agreed_fee_cents = offered_fee_cents"
          - "Asset bumps version (cascade touch)"

      - from: APPROVED
        to: LICENSED
        trigger: "POST /rights/clearance-requests/{id}/grant"
        actor: ClearanceOfficer
        preconditions:
          - "grant_fee == agreed_fee_cents (ERR_FEE_MISMATCH)"
          - "No overlapping ACTIVE License on same asset with same media and intersecting territory/term per license_overlap calculation (ERR_LICENSE_WINDOW_OVERLAP)"
          - "asset.posture == CLEAR (ERR_ASSET_POSTURE_BLOCKED)"
        side_effects:
          - "Create License (lifecycle=ACTIVE, fee_status=UNPAID, copying territory/media/term/units/fee)"
          - "Create RenewalAlert for the new License (SCHEDULED, fires_at = term_end_at - RENEWAL_ALERT_LEAD_DAYS)"
          - "asset.updated_at refreshes (version bump)"

      - from: SUBMITTED
        to: DENIED
        trigger: "POST /rights/clearance-requests/{id}/deny"
        actor: ClearanceOfficer
        preconditions: []
        side_effects: []

      - from: HOLDER_REVIEW
        to: DENIED
        trigger: "POST /rights/clearance-requests/{id}/deny"
        actor: ClearanceOfficer
        preconditions: []
        side_effects: []

      - from: NEGOTIATING
        to: DENIED
        trigger: "POST /rights/clearance-requests/{id}/deny"
        actor: ClearanceOfficer
        preconditions:
          - "All NegotiationRounds on the request must be non-OPEN (any OPEN round auto-REJECTED as side effect)"
        side_effects:
          - "OPEN rounds → REJECTED"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /rights/clearance-requests/{id}/withdraw"
        actor: Requester
        preconditions:
          - "Actor's X-User-ID == request.requester_id (ERR_FORBIDDEN_OWNER_ONLY)"
        side_effects: []

      - from: HOLDER_REVIEW
        to: WITHDRAWN
        trigger: "POST /rights/clearance-requests/{id}/withdraw"
        actor: Requester
        preconditions:
          - "Actor's X-User-ID == request.requester_id"
        side_effects: []

      - from: NEGOTIATING
        to: WITHDRAWN
        trigger: "POST /rights/clearance-requests/{id}/withdraw"
        actor: Requester
        preconditions:
          - "Actor's X-User-ID == request.requester_id"
        side_effects:
          - "OPEN rounds → REJECTED"

      - from: SUBMITTED
        to: FAIR_USE_ROUTE
        trigger: "POST /rights/assets/{assetId}/fair-use-assessments (creates assessment and reroutes)"
        actor: Requester
        preconditions:
          - "Target request in SUBMITTED; media is SOCIAL or PRINT only (ERR_FAIR_USE_MEDIA_INELIGIBLE)"
        side_effects:
          - "ClearanceRequest.fair_use_assessment_id set; commercial path closed permanently"
          - "Asset bumps version"

      - from: APPROVED
        to: EXPIRED
        trigger: "system clock: current_utc >= use_end_at and grant never executed"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system clock: current_utc >= use_end_at"
        actor: system
        preconditions: []
        side_effects: []

  - entity: License
    initial_state: "lifecycle=ACTIVE, fee_status=UNPAID"
    terminal_states: ["lifecycle ∈ {EXPIRED, REVOKED} (fee_status may still mutate to REFUNDED via compensation)"]
    note: "Two parallel dimensions. lifecycle: ACTIVE | SUSPENDED | EXPIRED | REVOKED. fee_status: UNPAID | PARTIALLY_PAID | PAID | REFUNDED. Transitions on one dimension do not change the other except where noted."
    transitions:
      # --- lifecycle dimension ---
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system cascade: asset posture → SUSPENDED (takedown upheld or counter window lapsed)"
        actor: system
        preconditions: []
        side_effects:
          - "Every UsageReservation HELD on this license → FORFEITED (units_reserved decremented)"
          - "RenewalAlert SCHEDULED → CANCELLED"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system cascade: takedown RETRACTED or COUNTERED → asset posture recomputed CLEAR"
        actor: system
        preconditions: []
        side_effects:
          - "RenewalAlert re-created as SCHEDULED if fires_at still in future (units_reserved NOT restored — forfeits are permanent)"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system clock: current_utc >= term_end_at"
        actor: system
        preconditions: []
        side_effects:
          - "HELD reservations → FORFEITED"
          - "RenewalAlert SCHEDULED → FIRED if fires_at <= current_utc else CANCELLED"

      - from: ACTIVE
        to: REVOKED
        trigger: "POST /rights/licenses/{id}/revoke"
        actor: LegalCertifier
        preconditions:
          - "A TakedownNotice on the asset is UPHELD (ERR_NO_UPHELD_TAKEDOWN)"
        side_effects:
          - "HELD reservations → FORFEITED"
          - "RenewalAlert SCHEDULED → CANCELLED"
          - "All POSTED UsageEvents with used_at >= takedown.received_at → STRUCK (units_consumed_net recomputed; gross unchanged)"

      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /rights/licenses/{id}/revoke"
        actor: LegalCertifier
        preconditions:
          - "A TakedownNotice on the asset is UPHELD"
        side_effects:
          - "Same as ACTIVE→REVOKED (reservations already FORFEITED by suspension)"

      # --- fee dimension ---
      - from: UNPAID
        to: PARTIALLY_PAID
        trigger: "POST /rights/licenses/{id}/payments (positive amount < remaining)"
        actor: FinancePayer
        preconditions:
          - "lifecycle == ACTIVE (ERR_LICENSE_NOT_PAYABLE)"
          - "Actor's X-User-ID != request.requester_id of the originating ClearanceRequest (ERR_SEGREGATION_OF_DUTIES)"
        side_effects: ["units_* unchanged; fee_status recomputed by fee_status_rule"]

      - from: UNPAID
        to: PAID
        trigger: "POST /rights/licenses/{id}/payments (amount == fee_agreed_cents)"
        actor: FinancePayer
        preconditions: ["lifecycle == ACTIVE", "segregation of duties"]
        side_effects: []

      - from: PARTIALLY_PAID
        to: PAID
        trigger: "POST /rights/licenses/{id}/payments (cumulative == fee_agreed_cents)"
        actor: FinancePayer
        preconditions: ["lifecycle == ACTIVE", "segregation of duties"]
        side_effects: []

      - from: PAID
        to: REFUNDED
        trigger: "POST /rights/licenses/{id}/payments (negative amount == -fee_agreed_cents; full refund only)"
        actor: FinancePayer
        preconditions:
          - "lifecycle ∈ {EXPIRED, REVOKED} (ERR_REFUND_REQUIRES_TERMINAL)"
          - "units_consumed_gross == 0 (ERR_REFUND_AFTER_USE)"
        side_effects: []

      - from: PARTIALLY_PAID
        to: REFUNDED
        trigger: "POST /rights/licenses/{id}/payments (negative amount == -(cumulative paid))"
        actor: FinancePayer
        preconditions:
          - "lifecycle ∈ {EXPIRED, REVOKED}"
          - "units_consumed_gross == 0"
        side_effects: []

  - entity: UsageReservation
    initial_state: HELD
    terminal_states: [CONSUMED, RELEASED, FORFEITED]
    transitions:
      - from: HELD
        to: CONSUMED
        trigger: "POST /rights/licenses/{id}/usage-events referencing reservation_id"
        actor: IngestionAgent
        preconditions:
          - "License.lifecycle == ACTIVE (ERR_LICENSE_NOT_ACTIVE)"
          - "reservation.hold_expires_at > current clock (ERR_HOLD_EXPIRED)"
          - "event.units <= reservation.units (ERR_USAGE_OVERDRAW)"
          - "event.used_at ∈ [license.term_start_at, license.term_end_at) (ERR_USAGE_OUTSIDE_TERM)"
        side_effects:
          - "license.units_reserved -= event.units; license.units_consumed_gross += event.units; license.units_consumed_net += event.units"
          - "If event.units < reservation.units: reservation stays HELD with units -= event.units (partial consumption); else CONSUMED"

      - from: HELD
        to: RELEASED
        trigger: "POST /rights/usage-reservations/{id}/release"
        actor: IngestionAgent
        preconditions: []
        side_effects: ["license.units_reserved -= reservation.units"]

      - from: HELD
        to: FORFEITED
        trigger: "system clock: current clock >= hold_expires_at"
        actor: system
        preconditions: []
        side_effects: ["license.units_reserved -= reservation.units"]

  - entity: TakedownNotice
    initial_state: PENDING
    terminal_states: [RETRACTED]
    note: "UPHELD is NOT terminal: a claimant retraction (UPHELD→RETRACTED) is always allowed and is the only path that restores cascade-suspended licenses."
    transitions:
      - from: PENDING
        to: COUNTERED
        trigger: "POST /rights/takedown-notices/{id}/counter"
        actor: AssetCurator
        preconditions:
          - "current clock < counter_notice_due_at (ERR_COUNTER_WINDOW_LAPSED)"
        side_effects:
          - "Asset posture recompute triggered"

      - from: PENDING
        to: UPHELD
        trigger: "system clock: current clock > counter_notice_due_at with no counter filed (strictly-greater: at clock == due_at exactly, the notice remains PENDING and a counter attempt fails ERR_COUNTER_WINDOW_LAPSED)"
        actor: system
        preconditions: []
        side_effects:
          - "Asset posture → SUSPENDED (via asset_posture calc)"
          - "Cascade: licenses ACTIVE→SUSPENDED; their HELD reservations FORFEITED; their SCHEDULED alerts CANCELLED"

      - from: PENDING
        to: RETRACTED
        trigger: "POST /rights/takedown-notices/{id}/retract"
        actor: AssetCurator
        preconditions: []
        side_effects: ["Asset posture recompute"]

      - from: COUNTERED
        to: RETRACTED
        trigger: "POST /rights/takedown-notices/{id}/retract"
        actor: AssetCurator
        preconditions: []
        side_effects: ["Asset posture recompute"]

      - from: UPHELD
        to: RETRACTED
        trigger: "POST /rights/takedown-notices/{id}/retract"
        actor: AssetCurator
        preconditions: []
        side_effects:
          - "Asset posture recompute (SUSPENDED → CLEAR when no other UPHELD/lapsed notice)"
          - "Licenses SUSPENDED by the takedown cascade return to ACTIVE (forfeits NOT restored)"
        note: "A claimant may retract at any point, including after the counter window lapsed; this is the only path that restores suspended licenses."

  - entity: FairUseAssessment
    initial_state: DRAFT
    terminal_states: [CERTIFIED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: CERTIFIED
        trigger: "POST /rights/fair-use-assessments/{id}/certify"
        actor: LegalCertifier
        preconditions:
          - "composite_score >= FAIR_USE_CERTIFY_MIN (ERR_FAIR_USE_SCORE_LOW)"
          - "Actor's X-User-ID != the creating Requester's id (ERR_SEGREGATION_OF_DUTIES)"
          - "Asset posture != RETIRED"
        side_effects:
          - "certified = true; linked ClearanceRequest stays FAIR_USE_ROUTE (terminal)"

      - from: DRAFT
        to: REJECTED
        trigger: "POST /rights/fair-use-assessments/{id}/reject"
        actor: LegalCertifier
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /rights/assets/{assetId}/fair-use-assessments (a second assessment for the same clearance_request_id supersedes the prior DRAFT)"
        actor: Requester
        preconditions: []
        side_effects: ["Prior DRAFT assessment for same request → SUPERSEDED"]

  - entity: RenewalAlert
    initial_state: SCHEDULED
    terminal_states: [FIRED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: FIRED
        trigger: "system clock: current clock >= fires_at while license.lifecycle == ACTIVE"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system cascade: license SUSPENDED/REVOKED/EXPIRED-before-fires_at, or asset RETIRED"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC-resolved)
# =============================================================================
concurrency_rules:
  - rule_id: clearance-advance-stale-request
    parent_entity: ClearanceRequest
    write_endpoint: "POST /rights/clearance-requests/{id}/advance"
    occ_field: "expected_clearance_version"
    description: |
      Advancing a ClearanceRequest whose version has advanced since the
      client last observed it is rejected with ERR_STALE_VERSION. This
      captures the case where another officer has just advanced or
      re-routed the request (e.g., a fair-use reroute created by the
      requester) and the current writer's view is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: license-payment-stale-license
    parent_entity: License
    write_endpoint: "POST /rights/licenses/{id}/payments"
    occ_field: "expected_license_version"
    description: |
      Posting a LicensePayment against a License whose version has advanced
      since the payer last read it is rejected with ERR_STALE_VERSION. This
      captures the case where a prior payment has just moved fee_status and
      the current payer's remaining-balance view is stale; the second payer
      MUST re-read before re-posting.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: reservation-create-stale-license
    parent_entity: License
    write_endpoint: "POST /rights/licenses/{id}/usage-reservations"
    occ_field: "expected_license_version"
    description: |
      Creating a UsageReservation against a License whose version has
      advanced since the client last observed it is rejected with
      ERR_STALE_VERSION. Units are a finite pool; a just-posted reservation
      or consumption legitimately shrinks availability, and the stale
      writer MUST re-read the license before reserving.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: asset_posture
    trigger: "any TakedownNotice, License, RightsDiligenceLog, or orphan_status change on the asset"
    algorithm: constraint_propagation
    formula: |
      # precedence chain: RETIRED > SUSPENDED > ENCUMBERED > CLEAR
      if asset.retired_at is not null: posture = RETIRED
      elif exists TakedownNotice on asset with status == UPHELD: posture = SUSPENDED
      elif exists TakedownNotice on asset with status == PENDING and clock > counter_notice_due_at: posture = SUSPENDED
      elif asset.orphan_status == DILIGENCE_PENDING: posture = ENCUMBERED
      elif exists TakedownNotice on asset with status == PENDING (clock <= counter_notice_due_at): posture = ENCUMBERED
      elif exists License on asset with lifecycle == ACTIVE and territory == WORLD: posture = ENCUMBERED
      else: posture = CLEAR
      # Evaluation order is fixed top-to-bottom; first match wins.
    input_set: "All TakedownNotices on the asset regardless of status; Licenses with lifecycle ACTIVE; asset.orphan_status"
    constants:
      DMCA_COUNTER_WINDOW_DAYS: 10
    precision: "n/a (enum derivation)"

  - name: territory_weight
    trigger: "referenced by license_fee_estimate and license_overlap"
    algorithm: threshold
    formula: |
      TERRITORY_WEIGHT = { NA: 1.0, EMEA: 1.4, LATAM: 0.8, APAC: 1.2, WORLD: 3.0 }
      territory_contains(a, b): a == WORLD or a == b   # WORLD is a superset of every territory
      territories_overlap(a, b): territory_contains(a, b) or territory_contains(b, a)
    input_set: "enum territories"
    constants: {}
    precision: "weights exact to 1 decimal"

  - name: license_fee_estimate
    trigger: "ClearanceRequest enters NEGOTIATING (provisional) and round acceptance (final)"
    algorithm: tiered_pricing
    formula: |
      # --- evaluation order pinned (circular-looking dependency resolved) ---
      # 1) base = per-media unit rate * requested_units
      # 2) territory_mult = TERRITORY_WEIGHT[territory]
      # 3) term_mult = 1.0 if term_days <= 90 else (1.25 if term_days <= 365 else 1.6)
      # 4) raw = base * territory_mult * term_mult
      # 5) discount applies ONLY when requested_units >= BULK_UNITS_MIN: raw *= (1 - BULK_DISCOUNT)
      # 6) fee = max(round_half_up(raw), MFN floor when applicable)  -- floor applied LAST, after rounding
      #
      # --- nested rounding order pinned (mode b) ---
      # per-line rounding is NOT used; the single fee line is computed in float,
      # rounded ONCE with round_half_up to integer cents at step 6.
      # (The alternative "round per territory component then sum" is explicitly REJECTED —
      # there is exactly one fee line per license, so any per-component rounding would
      # diverge by whole cents and is forbidden.)
      MEDIA_UNIT_RATE_CENTS = { BROADCAST_TV: 50000, STREAMING: 12000, THEATRICAL: 80000,
                                RADIO: 8000, SOCIAL: 3000, PRINT: 5000 }
      term_days = (use_end_at - use_start_at) in whole days
    input_set: "ClearanceRequest fields: media, territory, use_start_at, use_end_at, requested_units; Asset.rights_holder_id -> RightsHolder"
    constants:
      BULK_UNITS_MIN: 100
      BULK_DISCOUNT: 0.10
    precision: "integer cents, round_half_up applied exactly once at final step"
    variants:
      - name: provisional_estimate
        when: "On entry to NEGOTIATING before any round exists"
        difference: "MFN floor is NOT applied (holder may counter below floor display); estimate shown to negotiator only"
      - name: final_fee
        when: "On round acceptance (transition NEGOTIATING→APPROVED)"
        difference: "MFN floor IS applied as a hard validation — acceptance below floor fails with ERR_MFN_FLOOR_VIOLATION unless holder_kind == ESTATE"

  - name: mfn_floor
    trigger: "round acceptance (NEGOTIATING→APPROVED)"
    algorithm: threshold
    formula: |
      if RightsHolder.holder_kind == ESTATE: floor = 0  # estates are exempt
      else: floor = RightsHolder.mfn_floor_cents * requested_units
      accept requires offered_fee_cents >= floor
    input_set: "RightsHolder of the asset; ClearanceRequest.requested_units"
    constants: {}
    precision: "integer cents"

  - name: license_overlap
    trigger: "ClearanceRequest APPROVED→LICENSED (grant)"
    algorithm: interval_merge
    formula: |
      # A new License on asset A with (media M, territory T, [s,e)) conflicts with an
      # existing License on A when ALL of:
      #   existing.lifecycle == ACTIVE
      #   existing.media == M
      #   territories_overlap(existing.territory, T)
      #   term windows intersect as HALF-OPEN intervals: existing.term_start_at < e AND s < existing.term_end_at
      # Adjacent windows (existing.term_end_at == s) do NOT conflict (half-open: end exclusive).
      # WORLD overlaps every territory (superset semantics from territory_weight).
      reject grant with ERR_LICENSE_WINDOW_OVERLAP when any conflict found
    input_set: "Licenses on the same asset with lifecycle == ACTIVE"
    constants: {}
    precision: "datetime comparison at second precision"

  - name: embargo_gate
    trigger: "ClearanceRequest creation and SUBMITTED→HOLDER_REVIEW"
    algorithm: threshold
    formula: |
      if asset.embargo_until is null: pass
      else: require use_start_at >= asset.embargo_until + EMBARGO_BUFFER_DAYS
      # boundary: use_start_at EXACTLY == embargo_until + buffer passes (>=, not >)
    input_set: "Asset.embargo_until; ClearanceRequest.use_start_at"
    constants:
      EMBARGO_BUFFER_DAYS: 30
    precision: "datetime comparison at second precision"

  - name: usage_consumption
    trigger: "UsageEvent posting; takedown-driven STRIKE; license reads"
    algorithm: aggregation
    formula: |
      units_consumed_gross = sum(units of UsageEvents on license with posting_kind == POSTED)
      units_consumed_net   = sum(units of UsageEvents with posting_kind == POSTED)
                             - sum(units of UsageEvents with posting_kind == STRUCK)
      units_reserved       = sum(units of UsageReservations in HELD)
      units_available      = unit_limit - units_reserved - units_consumed_net
      # reservation admission rule: new reservation allowed iff units <= units_available
      # boundary: units == units_available passes (>= semantics on the limit:
      # consumption may reach exactly unit_limit; exceeding it is rejected)
    input_set: "UsageEvents (all), UsageReservations in HELD"
    constants: {}
    precision: "integer units"
    variants:
      - name: gross_consumption
        when: "Refund eligibility check and royalty reporting"
        difference: "Ignores STRUCK events; consumed units count even if later struck by takedown"
      - name: net_consumption
        when: "Reservation admission and renewal-utilization alerts"
        difference: "STRUCK events subtract; net may decrease after a revoke cascade, freeing availability"

  - name: fair_use_score
    trigger: "FairUseAssessment create/update"
    algorithm: weighted_scoring
    formula: |
      # four-factor composite: market harm counts double; each factor in 1..4
      composite = purpose + nature + amount + 2 * market     # range 5..20
      # certification threshold: composite >= FAIR_USE_CERTIFY_MIN
    input_set: "FairUseAssessment.factor_scores {purpose,nature,amount,market}"
    constants:
      FAIR_USE_CERTIFY_MIN: 13
    precision: "integer"

  - name: fee_status_rule
    trigger: "every LicensePayment posted"
    algorithm: aggregation
    formula: |
      paid = sum(amount_cents of LicensePayments on license)   # refunds are negative
      if paid <= 0 and exists any payment row: fee_status = REFUNDED
      elif paid == 0: fee_status = UNPAID
      elif paid < fee_agreed_cents: fee_status = PARTIALLY_PAID
      elif paid == fee_agreed_cents: fee_status = PAID
      else: overpaid — the posting endpoint MUST reject overpayment with ERR_OVERPAYMENT before this rule runs
    input_set: "All LicensePayments on the license"
    constants: {}
    precision: "integer cents"

  - name: desk_constants
    trigger: "referenced by state machines and validations"
    algorithm: threshold
    formula: |
      MAX_NEGOTIATION_ROUNDS = 5          # hard cap; 6th round attempt -> ERR_NEGOTIATION_EXHAUSTED
      HOLD_TTL_HOURS = 720                # reservation hold lifetime: 30 days from creation
      RENEWAL_ALERT_LEAD_DAYS = 30        # alert fires_at = term_end_at - 30 days
      ORPHAN_MIN_CHANNELS = 3             # distinct search_channel values required
      ORPHAN_MIN_SPAN_DAYS = 30           # created_at span between first and last qualifying log
      ORPHAN_CERTIFY_RULE: orphan_status becomes ORPHAN_CERTIFIED when
        rights_holder_id is null AND >= 3 logs with distinct search_channel
        AND every log outcome == NO_RESULT AND (last.created_at - first.created_at) >= 30 days
    input_set: "system-wide"
    constants:
      MAX_NEGOTIATION_ROUNDS: 5
      HOLD_TTL_HOURS: 720
      RENEWAL_ALERT_LEAD_DAYS: 30
      ORPHAN_MIN_CHANNELS: 3
      ORPHAN_MIN_SPAN_DAYS: 30
    precision: "integers"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a declared role; X-User-ID present for entity-backed roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint per §1.5 roles / §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 2.5
    category: existence
    check: "Request body schema: required fields present, enums in range, datetimes well-formed, integer fields >= their minimums"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 3
    category: existence
    check: "Path resources exist, validated left-to-right (asset before clearance-request before rounds; license before reservations/payments/usage)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all parameterized endpoints"

  - priority: 4
    category: state
    check: "OCC: expected_*_version matches the parent entity's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "endpoints declared in §1.2.1 concurrency_rules"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition exists per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 6
    category: business_safety
    check: "DMCA / takedown gates: counter before counter_notice_due_at; revoke requires UPHELD notice; asset posture not SUSPENDED/RETIRED for new clearance work"
    error_id: "ERR_COUNTER_WINDOW_LAPSED | ERR_NO_UPHELD_TAKEDOWN | ERR_ASSET_POSTURE_BLOCKED"
    http_status: 409
    applies_to: "takedown counter, license revoke, clearance advance/grant"

  - priority: 7
    category: business_referential
    check: "Referential integrity: rights_holder resolvable or ORPHAN_CERTIFIED for NEGOTIATING; media ∈ asset.permitted_media; clearance_request_id on fair-use assessment must reference a SUBMITTED request on the same asset"
    error_id: "ERR_RIGHTS_HOLDER_UNIDENTIFIED | ERR_MEDIA_NOT_PERMITTED | ERR_FAIR_USE_MEDIA_INELIGIBLE | ERR_ORPHAN_DILIGENCE_INCOMPLETE"
    http_status: 409
    applies_to: "clearance advance, fair-use create"

  - priority: 8
    category: business_temporal
    check: "Temporal rules: use_end_at > use_start_at; embargo gate; usage-event used_at inside license term; hold not expired at consumption; license grant window non-overlapping"
    error_id: "ERR_INVALID_WINDOW | ERR_EMBARGO_ACTIVE | ERR_USAGE_OUTSIDE_TERM | ERR_HOLD_EXPIRED | ERR_LICENSE_WINDOW_OVERLAP"
    http_status: 422
    applies_to: "clearance create/advance, usage-events, grant"

  - priority: 9
    category: business_constraint
    check: "Constraint rules: negotiation round cap and role alternation; reservation units <= units_available; event units <= reservation units; no second License per request"
    error_id: "ERR_NEGOTIATION_EXHAUSTED | ERR_ROUND_ROLE_ALTERNATION | ERR_USAGE_OVERDRAW | ERR_QUOTA_EXCEEDED | ERR_LICENSE_ALREADY_EXISTS"
    http_status: 409
    applies_to: "rounds, reservations, usage-events, grant"

  - priority: 10
    category: business_fiscal
    check: "Fiscal rules: MFN floor at acceptance; payment non-negative remaining; refund only from terminal lifecycle with zero gross consumption; segregation of duties on approve/pay/certify"
    error_id: "ERR_MFN_FLOOR_VIOLATION | ERR_OVERPAYMENT | ERR_REFUND_REQUIRES_TERMINAL | ERR_REFUND_AFTER_USE | ERR_SEGREGATION_OF_DUTIES | ERR_LICENSE_NOT_PAYABLE"
    http_status: 422
    applies_to: "rounds accept, payments, certify"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default 2026-08-01T00:00:00Z) ---
  - method: POST
    path: "/rights/_clock/set_current_utc"
    description: "Set the server logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [AssetCurator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects:
      - "Evaluate all clock-driven system transitions: request EXPIRED sweep, reservation FORFEIT sweep, takedown PENDING→UPHELD lapse sweep, license EXPIRED sweep, RenewalAlert FIRE sweep, asset posture recompute"

  # --- RightsHolder ---
  - method: POST
    path: "/rights/rights-holders"
    description: "Register a rights holder"
    roles: [AssetCurator]
    code: 201
    input: [legal_name, holder_kind, mfn_floor_cents, "contact_verified?"]
    output: RightsHolder
    side_effects: []

  - method: GET
    path: "/rights/rights-holders/{id}"
    description: "Get a rights holder"
    roles: [AssetCurator, ClearanceOfficer, Negotiator, Requester, LegalCertifier, FinancePayer, IngestionAgent]
    code: 200
    input: []
    output: RightsHolder
    side_effects: []

  - method: GET
    path: "/rights/rights-holders"
    description: "List rights holders"
    roles: [AssetCurator, ClearanceOfficer, Negotiator, Requester, LegalCertifier, FinancePayer, IngestionAgent]
    code: 200
    input: ["limit?", "offset?"]
    output: "RightsHolder[]"
    side_effects: []

  # --- Asset ---
  - method: POST
    path: "/rights/assets"
    description: "Register an asset with rights metadata"
    roles: [AssetCurator]
    code: 201
    input: [title, work_kind, permitted_media, "embargo_until?", "rights_holder_id?"]
    output: Asset
    side_effects: ["posture=CLEAR; orphan_status = NOT_ORPHAN if rights_holder_id given else DILIGENCE_PENDING"]

  - method: GET
    path: "/rights/assets/{id}"
    description: "Get an asset (computed posture visible)"
    roles: [AssetCurator, ClearanceOfficer, Negotiator, Requester, LegalCertifier, FinancePayer, IngestionAgent]
    code: 200
    input: []
    output: Asset
    side_effects: []

  - method: GET
    path: "/rights/assets"
    description: "List assets with optional posture / rights-holder filters"
    roles: [AssetCurator, ClearanceOfficer, Negotiator, Requester, LegalCertifier, FinancePayer, IngestionAgent]
    code: 200
    input: ["posture?", "rights_holder_id?", "limit?", "offset?"]
    output: "Asset[]"
    side_effects: []

  - method: POST
    path: "/rights/assets/{id}/retire"
    description: "Retire an asset (content retirement)"
    roles: [AssetCurator]
    code: 200
    input: []
    output: Asset
    side_effects: ["posture=RETIRED; cancels SCHEDULED alerts under its licenses"]

  - method: POST
    path: "/rights/assets/{id}/diligence-logs"
    description: "Append an orphan-work diligence record; ORPHAN_CERTIFIED requires >= 3 logs with distinct search_channel values, all NO_RESULT, spanning >= 30 days (first to last created_at)"
    roles: [AssetCurator]
    code: 201
    input: [search_channel, outcome, notes]
    output: RightsDiligenceLog
    side_effects: ["May set asset.orphan_status = ORPHAN_CERTIFIED (if rights_holder_id is null and certification rule met) → posture recompute"]

  - method: GET
    path: "/rights/assets/{id}/diligence-logs"
    description: "List diligence logs for an asset"
    roles: [AssetCurator, ClearanceOfficer, LegalCertifier]
    code: 200
    input: ["limit?", "offset?"]
    output: "RightsDiligenceLog[]"
    side_effects: []

  # --- ClearanceRequest ---
  - method: POST
    path: "/rights/assets/{id}/clearance-requests"
    description: "Create a clearance request (SUBMITTED)"
    roles: [Requester]
    code: 201
    input: [media, territory, use_start_at, use_end_at, requested_units]
    output: ClearanceRequest
    side_effects: ["requester_id = X-User-ID"]

  - method: GET
    path: "/rights/clearance-requests/{id}"
    description: "Get a clearance request"
    roles: [AssetCurator, ClearanceOfficer, Negotiator, Requester, LegalCertifier, FinancePayer]
    code: 200
    input: []
    output: ClearanceRequest
    side_effects: []

  - method: GET
    path: "/rights/clearance-requests"
    description: "List clearance requests across assets (desk worklist); filterable by status and fair_use_assessment_id"
    roles: [AssetCurator, ClearanceOfficer, Negotiator, Requester, LegalCertifier, FinancePayer]
    code: 200
    input: ["status?", "fair_use_assessment_id?", "limit?", "offset?"]
    output: "ClearanceRequest[]"
    side_effects: []

  - method: GET
    path: "/rights/assets/{id}/clearance-requests"
    description: "List clearance requests for an asset"
    roles: [AssetCurator, ClearanceOfficer, Negotiator, Requester, LegalCertifier, FinancePayer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ClearanceRequest[]"
    side_effects: []

  - method: POST
    path: "/rights/clearance-requests/{id}/advance"
    description: "Advance SUBMITTED→HOLDER_REVIEW→NEGOTIATING (OCC-guarded)"
    roles: [ClearanceOfficer]
    code: 200
    input: [expected_clearance_version]
    output: ClearanceRequest
    side_effects: ["Increments ClearanceRequest.version by 1"]

  - method: POST
    path: "/rights/clearance-requests/{id}/deny"
    description: "Deny a request from SUBMITTED/HOLDER_REVIEW/NEGOTIATING"
    roles: [ClearanceOfficer]
    code: 200
    input: []
    output: ClearanceRequest
    side_effects: ["OPEN rounds → REJECTED"]

  - method: POST
    path: "/rights/clearance-requests/{id}/withdraw"
    description: "Requester withdraws own request"
    roles: [Requester]
    code: 200
    input: []
    output: ClearanceRequest
    side_effects: ["OPEN rounds → REJECTED"]

  - method: POST
    path: "/rights/clearance-requests/{id}/grant"
    description: "Grant license from APPROVED request"
    roles: [ClearanceOfficer]
    code: 201
    input: [grant_fee_cents]
    output: License
    side_effects:
      - "Creates License (ACTIVE/UNPAID)"
      - "Creates RenewalAlert SCHEDULED"
      - "Request → LICENSED; Asset version bump"

  # --- NegotiationRound ---
  - method: POST
    path: "/rights/clearance-requests/{id}/rounds"
    description: "Post a negotiation round; accept=true accepts this round's offer and approves the request. A request failing any validation persists no round row."
    roles: [Negotiator, RightsHolderRep]
    code: 201
    input: [offered_fee_cents, "accept?"]
    output: NegotiationRound
    side_effects:
      - "Prior OPEN round → SUPERSEDED"
      - "negotiation_round += 1"
      - "If accept: request → APPROVED, agreed_fee_cents = offered_fee_cents, MFN floor validated; Asset version bump"

  - method: GET
    path: "/rights/clearance-requests/{id}/rounds"
    description: "List negotiation rounds"
    roles: [ClearanceOfficer, Negotiator, RightsHolderRep, Requester, LegalCertifier, FinancePayer]
    code: 200
    input: ["limit?", "offset?"]
    output: "NegotiationRound[]"
    side_effects: []

  # --- License ---
  - method: GET
    path: "/rights/licenses/{id}"
    description: "Get a license with computed usage fields"
    roles: [AssetCurator, ClearanceOfficer, Negotiator, LegalCertifier, FinancePayer, IngestionAgent]
    code: 200
    input: []
    output: License
    side_effects: []

  - method: GET
    path: "/rights/licenses"
    description: "List licenses; filterable by asset_id, clearance_request_id, renewal_alert_id, lifecycle, fee_status"
    roles: [AssetCurator, ClearanceOfficer, Negotiator, LegalCertifier, FinancePayer, IngestionAgent]
    code: 200
    input: ["asset_id?", "clearance_request_id?", "renewal_alert_id?", "lifecycle?", "fee_status?", "limit?", "offset?"]
    output: "License[]"
    side_effects: []

  - method: POST
    path: "/rights/licenses/{id}/revoke"
    description: "Revoke a license when a takedown is UPHELD"
    roles: [LegalCertifier]
    code: 200
    input: []
    output: License
    side_effects: ["Reservations FORFEITED; alert CANCELLED; later POSTED events STRUCK"]

  # --- UsageReservation ---
  - method: POST
    path: "/rights/licenses/{id}/usage-reservations"
    description: "Reserve usage units against a license (OCC-guarded)"
    roles: [IngestionAgent]
    code: 201
    input: [units, expected_license_version]
    output: UsageReservation
    side_effects: ["license.units_reserved += units; increments License.version by 1"]

  - method: GET
    path: "/rights/licenses/{id}/usage-reservations"
    description: "List reservations for a license"
    roles: [ClearanceOfficer, IngestionAgent, FinancePayer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "UsageReservation[]"
    side_effects: []

  - method: GET
    path: "/rights/usage-reservations/{id}"
    description: "Get a single usage reservation"
    roles: [ClearanceOfficer, IngestionAgent, FinancePayer]
    code: 200
    input: []
    output: UsageReservation
    side_effects: []

  - method: GET
    path: "/rights/usage-reservations/{id}/usage-events"
    description: "List usage events that drew down a given reservation"
    roles: [ClearanceOfficer, IngestionAgent, FinancePayer]
    code: 200
    input: ["limit?", "offset?"]
    output: "UsageEvent[]"
    side_effects: []

  - method: POST
    path: "/rights/usage-reservations/{id}/release"
    description: "Release a held reservation"
    roles: [IngestionAgent]
    code: 200
    input: []
    output: UsageReservation
    side_effects: ["license.units_reserved -= units"]

  # --- UsageEvent ---
  - method: POST
    path: "/rights/licenses/{id}/usage-events"
    description: "Post actual usage (with or without a reservation)"
    roles: [IngestionAgent]
    code: 201
    input: [units, used_at, "reservation_id?"]
    output: UsageEvent
    side_effects: ["units_consumed_gross/net += units; reservation partial/consume bookkeeping; License.version bump"]

  - method: GET
    path: "/rights/licenses/{id}/usage-events"
    description: "List usage events for a license"
    roles: [ClearanceOfficer, IngestionAgent, FinancePayer, LegalCertifier]
    code: 200
    input: ["limit?", "offset?"]
    output: "UsageEvent[]"
    side_effects: []

  # --- LicensePayment ---
  - method: POST
    path: "/rights/licenses/{id}/payments"
    description: "Post a payment (positive) or refund (negative) against a license fee (OCC-guarded)"
    roles: [FinancePayer]
    code: 201
    input: [amount_cents, expected_license_version]
    output: LicensePayment
    side_effects: ["fee_status recomputed; increments License.version by 1"]

  - method: GET
    path: "/rights/licenses/{id}/payments"
    description: "List payments for a license"
    roles: [ClearanceOfficer, FinancePayer, LegalCertifier]
    code: 200
    input: ["limit?", "offset?"]
    output: "LicensePayment[]"
    side_effects: []

  # --- FairUseAssessment ---
  - method: POST
    path: "/rights/assets/{id}/fair-use-assessments"
    description: "Create a fair-use assessment and reroute the linked SUBMITTED clearance request to FAIR_USE_ROUTE"
    roles: [Requester]
    code: 201
    input: [clearance_request_id, factor_scores]
    output: FairUseAssessment
    side_effects: ["Linked request → FAIR_USE_ROUTE; prior DRAFT for same request → SUPERSEDED; Asset version bump"]

  - method: GET
    path: "/rights/fair-use-assessments/{id}"
    description: "Get a fair-use assessment"
    roles: [AssetCurator, ClearanceOfficer, Requester, LegalCertifier]
    code: 200
    input: []
    output: FairUseAssessment
    side_effects: []

  - method: GET
    path: "/rights/assets/{id}/fair-use-assessments"
    description: "List fair-use assessments for an asset"
    roles: [AssetCurator, ClearanceOfficer, Requester, LegalCertifier]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "FairUseAssessment[]"
    side_effects: []

  - method: GET
    path: "/rights/fair-use-assessments"
    description: "List fair-use assessments across assets; filterable by clearance_request_id and status"
    roles: [AssetCurator, ClearanceOfficer, Requester, LegalCertifier]
    code: 200
    input: ["clearance_request_id?", "status?", "limit?", "offset?"]
    output: "FairUseAssessment[]"
    side_effects: []

  - method: POST
    path: "/rights/fair-use-assessments/{id}/certify"
    description: "Certify a fair-use assessment (composite >= 13)"
    roles: [LegalCertifier]
    code: 200
    input: []
    output: FairUseAssessment
    side_effects: ["certified = true"]

  - method: POST
    path: "/rights/fair-use-assessments/{id}/reject"
    description: "Reject a fair-use assessment"
    roles: [LegalCertifier]
    code: 200
    input: []
    output: FairUseAssessment
    side_effects: []

  # --- TakedownNotice ---
  - method: POST
    path: "/rights/assets/{id}/takedown-notices"
    description: "File a DMCA takedown notice (PENDING; counter window opens)"
    roles: [AssetCurator]
    code: 201
    input: [claimant_name]
    output: TakedownNotice
    side_effects: ["received_at = clock; counter_notice_due_at = received_at + 10 days; asset posture recompute"]

  - method: GET
    path: "/rights/assets/{id}/takedown-notices"
    description: "List takedown notices for an asset"
    roles: [AssetCurator, ClearanceOfficer, LegalCertifier, FinancePayer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "TakedownNotice[]"
    side_effects: []

  - method: GET
    path: "/rights/takedown-notices/{id}"
    description: "Get a takedown notice"
    roles: [AssetCurator, ClearanceOfficer, LegalCertifier, FinancePayer]
    code: 200
    input: []
    output: TakedownNotice
    side_effects: []

  - method: POST
    path: "/rights/takedown-notices/{id}/counter"
    description: "File a counter-notice before the window lapses"
    roles: [AssetCurator]
    code: 200
    input: []
    output: TakedownNotice
    side_effects: ["asset posture recompute"]

  - method: POST
    path: "/rights/takedown-notices/{id}/retract"
    description: "Retract a PENDING or COUNTERED notice"
    roles: [AssetCurator]
    code: 200
    input: []
    output: TakedownNotice
    side_effects: ["asset posture recompute; suspended-by-takedown licenses return to ACTIVE"]

  # --- RenewalAlert ---
  - method: GET
    path: "/rights/licenses/{id}/renewal-alerts"
    description: "List renewal alerts for a license"
    roles: [ClearanceOfficer, FinancePayer, AssetCurator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RenewalAlert[]"
    side_effects: []

  - method: GET
    path: "/rights/renewal-alerts"
    description: "List all renewal alerts (desk worklist), filterable by status"
    roles: [ClearanceOfficer, AssetCurator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "RenewalAlert[]"
    side_effects: []

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role, or X-User-ID missing for entity-backed role" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_FORBIDDEN_OWNER_ONLY, http: 403, condition: "Requester attempted to withdraw a request they do not own" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist (left-to-right scope check)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, or malformed datetime" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not defined from the entity's current state" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Action on an entity already in a terminal state (e.g., retire a RETIRED asset)" }
  - { id: ERR_ASSET_POSTURE_BLOCKED, http: 409, condition: "Asset posture is ENCUMBERED/SUSPENDED/RETIRED where CLEAR is required" }
  - { id: ERR_ASSET_HAS_LIVE_LICENSES, http: 409, condition: "Retire blocked by licenses in ACTIVE/SUSPENDED lifecycle" }
  - { id: ERR_ASSET_HAS_OPEN_REQUESTS, http: 409, condition: "Retire blocked by clearance requests in non-terminal states" }
  - { id: ERR_MEDIA_NOT_PERMITTED, http: 409, condition: "Requested media not in asset.permitted_media" }
  - { id: ERR_RIGHTS_HOLDER_UNIDENTIFIED, http: 409, condition: "Cannot enter NEGOTIATING: no rights holder and asset not ORPHAN_CERTIFIED" }
  - { id: ERR_ORPHAN_DILIGENCE_INCOMPLETE, http: 409, condition: "Advance blocked while orphan_status == DILIGENCE_PENDING" }
  - { id: ERR_NEGOTIATION_EXHAUSTED, http: 409, condition: "negotiation_round would exceed MAX_NEGOTIATION_ROUNDS (5)" }
  - { id: ERR_ROUND_ROLE_ALTERNATION, http: 409, condition: "Two consecutive rounds offered by the same role" }
  - { id: ERR_MFN_FLOOR_VIOLATION, http: 422, condition: "Accepted offer below mfn_floor_cents * requested_units for non-ESTATE holder" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same user cannot request and approve/pay/certify the same item" }
  - { id: ERR_FEE_MISMATCH, http: 422, condition: "grant_fee_cents != agreed_fee_cents at grant time" }
  - { id: ERR_LICENSE_WINDOW_OVERLAP, http: 422, condition: "Overlapping ACTIVE license on same asset+media with intersecting territory/term (half-open)" }
  - { id: ERR_LICENSE_ALREADY_EXISTS, http: 409, condition: "A License already exists for this ClearanceRequest" }
  - { id: ERR_INVALID_WINDOW, http: 422, condition: "use_end_at <= use_start_at or negative/zero-length window" }
  - { id: ERR_EMBARGO_ACTIVE, http: 422, condition: "use_start_at earlier than embargo_until + 30 days" }
  - { id: ERR_USAGE_OUTSIDE_TERM, http: 422, condition: "used_at outside [term_start_at, term_end_at)" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "Usage/reservation attempted on non-ACTIVE license" }
  - { id: ERR_HOLD_EXPIRED, http: 409, condition: "Consumption attempted after hold_expires_at" }
  - { id: ERR_USAGE_OVERDRAW, http: 409, condition: "Event units exceed reservation remaining units" }
  - { id: ERR_QUOTA_EXCEEDED, http: 409, condition: "Reservation units exceed license units_available" }
  - { id: ERR_COUNTER_WINDOW_LAPSED, http: 409, condition: "Counter filed at or after counter_notice_due_at" }
  - { id: ERR_NO_UPHELD_TAKEDOWN, http: 409, condition: "Revoke requires an UPHELD takedown notice on the asset" }
  - { id: ERR_LICENSE_NOT_PAYABLE, http: 422, condition: "Payment posted against license whose lifecycle != ACTIVE" }
  - { id: ERR_OVERPAYMENT, http: 422, condition: "Payment would push cumulative paid above fee_agreed_cents" }
  - { id: ERR_REFUND_REQUIRES_TERMINAL, http: 422, condition: "Refund requires lifecycle EXPIRED or REVOKED" }
  - { id: ERR_REFUND_AFTER_USE, http: 422, condition: "Refund blocked: units_consumed_gross > 0" }
  - { id: ERR_FAIR_USE_MEDIA_INELIGIBLE, http: 409, condition: "Fair-use route allowed only for SOCIAL or PRINT media" }
  - { id: ERR_FAIR_USE_SCORE_LOW, http: 422, condition: "Certification attempted with composite_score < 13" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Requester
    description: "Producer/editor requesting clearance for an asset"
    identity: opaque
    exclusive_operations:
      - "POST /rights/assets/{id}/clearance-requests"
      - "POST /rights/clearance-requests/{id}/withdraw"
      - "POST /rights/assets/{id}/fair-use-assessments"
    shared_operations:
      - "GET reads on assets, requests, rounds, holders, assessments"

  - name: ClearanceOfficer
    description: "Desk officer advancing/denying requests and granting licenses"
    identity: opaque
    exclusive_operations:
      - "POST /rights/clearance-requests/{id}/advance"
      - "POST /rights/clearance-requests/{id}/deny"
      - "POST /rights/clearance-requests/{id}/grant"
    shared_operations: ["GET reads across the surface"]

  - name: Negotiator
    description: "Fee negotiator posting/accepting negotiation rounds"
    identity: opaque
    exclusive_operations:
      - "POST /rights/clearance-requests/{id}/rounds"
    shared_operations: ["GET reads"]

  - name: FinancePayer
    description: "Finance operator posting license payments and refunds"
    identity: opaque
    exclusive_operations:
      - "POST /rights/licenses/{id}/payments"
    shared_operations: ["GET reads on licenses, payments, reservations, alerts"]

  - name: IngestionAgent
    description: "Systems agent reserving units and posting usage events"
    identity: opaque
    exclusive_operations:
      - "POST /rights/licenses/{id}/usage-reservations"
      - "POST /rights/usage-reservations/{id}/release"
      - "POST /rights/licenses/{id}/usage-events"
    shared_operations: ["GET reads on licenses"]

  - name: LegalCertifier
    description: "Attorney certifying fair use and revoking licenses"
    identity: opaque
    exclusive_operations:
      - "POST /rights/fair-use-assessments/{id}/certify"
      - "POST /rights/fair-use-assessments/{id}/reject"
      - "POST /rights/licenses/{id}/revoke"
    shared_operations: ["GET reads"]

  - name: AssetCurator
    description: "Rights desk curator managing assets, holders, diligence, takedowns, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /rights/rights-holders"
      - "POST /rights/assets"
      - "POST /rights/assets/{id}/retire"
      - "POST /rights/assets/{id}/diligence-logs"
      - "POST /rights/assets/{id}/takedown-notices"
      - "POST /rights/takedown-notices/{id}/counter"
      - "POST /rights/takedown-notices/{id}/retract"
      - "POST /rights/_clock/set_current_utc"
    shared_operations: ["GET reads"]

  - name: RightsHolderRep
    description: "External rights-holder representative participating in fee negotiation; X-User-ID equals the RightsHolder id they represent"
    identity: "entity_backed:RightsHolder"
    exclusive_operations: []
    shared_operations:
      - "POST /rights/clearance-requests/{id}/rounds (counter-offers; alternation with Negotiator enforced)"
      - "GET reads on holders, requests, rounds"
