          Aggregate-capacity interval semantics on the QuickTurnLane resource:
          occupation is summed per calendar ship-date with no adjacency concept —
          filling 2026-08-10 to 500 boards leaves 2026-08-11 fully available, while
          one more board on the saturated day is rejected.
