            - call: POST /race-editions/${ed_id}/open-field
              as: ElitesDirector
            - call: POST /rep-agents
              payload: { agency_name: "FK Sports", license_code: "AGT-FK-1" }
              as: ElitesDirector
              captures: { agt_id: "$.data.id" }
            - call: POST /athletes
