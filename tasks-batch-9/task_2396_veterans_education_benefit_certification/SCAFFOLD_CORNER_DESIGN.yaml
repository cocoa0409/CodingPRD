              as: SupervisorySCO
              as_user_id: "${sup1}"
              captures: { award2: $.data.id }
          assert:
            - "Trigger step 1 returns HTTP 412 with error_id == ERR_STALE_AGREEMENT_VERSION"
            - "${pool_after_refusal} == 920000 and YellowRibbonAgreement.${yr1}.participant_count == 1 — the refused award debited nothing"
            - "after trigger step 1 exactly 1 YellowRibbonAward row exists, ${award1}"
            - "${yr1_v2} == ${yr1_v} + 1 — only the accepted award moved the agreement version"
            - "Trigger step 3 returns HTTP 201 with school_share_cents == 80000, va_match_cents == 80000 and pool_remaining_before_cents == 920000"
            - "YellowRibbonAgreement.${yr1}.pool_remaining_cents == 840000 and participant_count == 2"
            - "YellowRibbonAward.${award2}.status == PROVISIONAL"

      - name: cascading_side_effects_are_verified_end_to_end_through_five_levels
        claim_type: cascading_side_effects
        grounds:
          - endpoints[POST /enrollment-change-reports/{id}/reconcile]
          - state_machines.EnrollmentCertification.AMENDMENT_PENDING_to_TERMINATED
          - state_machines.YellowRibbonAward.PROVISIONAL_to_REVERSED
        excluded_because:
          difficulty_instance: reconcile_cascade_depth_five_debt_and_award_reversal
          rationale: "That transitive-cascade instance walks CASCADE-A L1 through L5 in one reconcile — change report RECONCILED, certification recomputed and TERMINATED, entitlement credited, debt created with its notification deadline, student open-debt ledger grown and the PROVISIONAL award reversed — and asserts every level's observable, which is precisely this layer's claim."

      - name: both_variants_of_the_covered_tuition_calculation_are_exercised
        claim_type: dual_variant_calculation
        grounds:
          - calculations.covered_tuition_and_yellow_ribbon
          - entities.EnrollmentCertification.fields.amount_basis
        excluded_because:
          difficulty_instance: covered_tuition_as_certified_vs_as_reconciled_money_divergence
          rationale: "That dual-variant instance runs AS_CERTIFIED and AS_RECONCILED over the same fixture and pins both results plus the delta that becomes the debt, so a separate layer test would re-derive the same numbers."

      - name: the_lateness_threshold_is_exercised_at_its_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.change_report_lateness_and_liability
          - entities.EnrollmentChangeReport.fields.days_late
          - entities.EnrollmentChangeReport.fields.reporting_status
        excluded_because:
          difficulty_instance: change_report_thirtieth_day_is_timely_thirty_first_is_late
          rationale: "That boundary-precision instance reports the identical change on day 30 and day 31 after the effective date and pins TIMELY/STUDENT against LATE/SCHOOL, which is the whole of this layer's threshold claim."

