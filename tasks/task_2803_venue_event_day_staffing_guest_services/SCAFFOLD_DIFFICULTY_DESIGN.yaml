            - call: "POST /events"
              payload: { name: "Surcharge Order Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T16:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 40000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id }
            - call: "POST /position-types"
              payload: { code: "USHER", display_name: "Usher", base_hourly_rate_cents: 2200, attendance_ratio_per_1000: 1.5, min_headcount: 4, required_certifications: ["EVACUATION_PROCEDURES"] }
              as: StaffingCoordinator
              captures: { pt_usher_id: $.data.id }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /position-types"
              payload: { code: "ELEVATOR_OPERATOR", display_name: "Elevator Operator", base_hourly_rate_cents: 2600, attendance_ratio_per_1000: 0.2, min_headcount: 2, required_certifications: ["ELEVATOR_OPERATION", "EVACUATION_PROCEDURES"] }
              as: StaffingCoordinator
              captures: { pt_elev_id: $.data.id }
            - call: "POST /position-types"
              payload: { code: "GUEST_SERVICES_REP", display_name: "Guest Services Rep", base_hourly_rate_cents: 2400, attendance_ratio_per_1000: 0.35, min_headcount: 2, required_certifications: ["CODE_OF_CONDUCT"], is_tip_eligible: true, is_contracted_position: true }
              as: StaffingCoordinator
              captures: { pt_gsr_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_usher_id}", zone_code: "Z130", shift_start: "2026-09-12T16:00:00Z", shift_end: "2026-09-12T22:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_u: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z131", shift_start: "2026-09-12T16:05:00Z", shift_end: "2026-09-12T22:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_t: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_elev_id}", zone_code: "Z132", shift_start: "2026-09-12T17:00:00Z", shift_end: "2026-09-12T22:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_e: $.data.id }
          trigger:
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_gsr_id}", zone_code: "Z133", shift_start: "2026-09-12T16:00:00Z", shift_end: "2026-09-12T22:00:00Z" }
              as: StaffingCoordinator
              captures: { slot_g: $.data.id }
          assert:
            - "before the trigger: StaffingPlan.${plan_id}.total_required_headcount == 146, base_labor_cost_cents == 1860567, accessibility_surcharge_cents == 65120 (350 bp), projected_labor_cost_cents == 1925687"
            - "PositionSlot.${slot_u}.required_headcount == 87 and slot_labor_cost_cents == 1148400"
            - "PositionSlot.${slot_t}.required_headcount == 47 and slot_labor_cost_cents == 556167 (exact 556166.6667 rounded HALF_UP)"
            - "PositionSlot.${slot_e}.required_headcount == 12 and slot_labor_cost_cents == 156000"
            - "PositionSlot.${slot_g}.required_headcount == 21 and slot_labor_cost_cents == 302400"
            - "after the trigger: StaffingPlan.${plan_id}.total_required_headcount == 167 and base_labor_cost_cents == 2162967"
            - "after the trigger: StaffingPlan.${plan_id}.accessibility_surcharge_cents == 129778 (600 bp on the plan-level headcount total), NOT 40194 (which per-slot tier selection would give)"
            - "after the trigger: StaffingPlan.${plan_id}.projected_labor_cost_cents == 2292745 == 2162967 + 129778"
            - "StaffingPlan.${plan_id}.base_labor_cost_cents == 2162967 is unchanged by the surcharge: the surcharge is never folded back into the base or into total_required_headcount"

  # =====================================================================================
  # Rule 3 - non-linear state-machine shapes on DIFFERENT entities
  # =====================================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: position_slot_fill_release_cycle
        grounds:
          - state_machines.PositionSlot.OPEN_to_PARTIALLY_FILLED
          - state_machines.PositionSlot.PARTIALLY_FILLED_to_FILLED
          - state_machines.PositionSlot.FILLED_to_PARTIALLY_FILLED
          - state_machines.PositionSlot.PARTIALLY_FILLED_to_OPEN
          - state_machines.StaffAssignment.SCHEDULED_to_RELEASED
          - entities.PositionSlot.fields.filled_headcount
        distinguishing_aspect: |
          Cycle on PositionSlot: the slot walks OPEN -> PARTIALLY_FILLED -> FILLED ->
          PARTIALLY_FILLED -> OPEN -> PARTIALLY_FILLED within one test, re-entering PARTIALLY_FILLED
          three times, because status is re-derived from filled_headcount versus required_headcount
          rather than being latched. No forward-only pipeline can reproduce the FILLED ->
          PARTIALLY_FILLED -> OPEN backward arcs.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T17:30:00Z; Event IN_PROGRESS with a LOCKED plan."
            - "One TICKET_TAKER slot with required_headcount_override 2 (no certification required)."
            - "Three ACTIVE PART_TIME_EMPLOYEE StaffMembers, none holding any other assignment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T17:30:00Z" }
              as: StaffingCoordinator
            - call: "POST /events"
              payload: { name: "Slot Cycle Fixture", event_date: "2026-09-12T00:00:00Z", doors_open_at: "2026-09-12T17:00:00Z", doors_close_at: "2026-09-12T23:00:00Z", expected_attendance: 20000 }
              as: GuestExperienceDirector
              captures: { ev_id: $.data.id, ev_v0: $.data.version }
            - call: "POST /position-types"
              payload: { code: "TICKET_TAKER", display_name: "Ticket Taker", base_hourly_rate_cents: 2000, attendance_ratio_per_1000: 0.8, min_headcount: 3, required_certifications: [] }
              as: StaffingCoordinator
              captures: { pt_tt_id: $.data.id }
            - call: "POST /staffing-plans"
              payload: { event_id: "${ev_id}", plan_variant: "FORECAST_BASED" }
              as: StaffingCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /position-slots"
              payload: { plan_id: "${plan_id}", position_type_id: "${pt_tt_id}", zone_code: "Z140", shift_start: "2026-09-12T18:00:00Z", shift_end: "2026-09-12T22:00:00Z", required_headcount_override: 2 }
              as: StaffingCoordinator
              captures: { slot_id: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Ana One", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-01-10T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { sm_1: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Bo Two", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-02-10T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { sm_2: $.data.id }
            - call: "POST /staff-members"
              payload: { full_name: "Cy Three", employment_type: "PART_TIME_EMPLOYEE", seniority_date: "2024-03-10T00:00:00Z", hourly_rate_cents: 2000 }
              as: StaffingCoordinator
              captures: { sm_3: $.data.id }
            - call: "POST /staffing-plans/${plan_id}/activate"
              payload: { expected_event_version: "${ev_v0}" }
              as: StaffingCoordinator
            - call: "POST /events/${ev_id}/lifecycle"
              payload: { target_status: "IN_PROGRESS" }
              as: GuestExperienceDirector
          trigger:
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${sm_1}" }
              as: StaffingCoordinator
              captures: { asg_1: $.data.id }
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${sm_2}" }
              as: StaffingCoordinator
              captures: { asg_2: $.data.id }
            - call: "POST /staff-assignments/${asg_2}/attendance"
              payload: { action: "RELEASE" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments/${asg_1}/attendance"
              payload: { action: "RELEASE" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments"
              payload: { position_slot_id: "${slot_id}", staff_member_id: "${sm_3}" }
              as: StaffingCoordinator
              captures: { asg_3: $.data.id }
          assert:
            - "PositionSlot.${slot_id}.status == OPEN and filled_headcount == 0 before the first assignment"
            - "after assigning ${sm_1}: PositionSlot.${slot_id}.status == PARTIALLY_FILLED and filled_headcount == 1"
            - "after assigning ${sm_2}: PositionSlot.${slot_id}.status == FILLED and filled_headcount == 2"
            - "after releasing ${asg_2}: PositionSlot.${slot_id}.status == PARTIALLY_FILLED and filled_headcount == 1 (backward arc)"
            - "after releasing ${asg_1}: PositionSlot.${slot_id}.status == OPEN and filled_headcount == 0 (second backward arc)"
            - "after assigning ${sm_3}: PositionSlot.${slot_id}.status == PARTIALLY_FILLED and filled_headcount == 1 (PARTIALLY_FILLED entered for the third time)"
            - "StaffAssignment.${asg_1}.attendance_status == RELEASED, payout_status == VOIDED, total_payout_cents == 0"
            - "StaffMember.${sm_1}.reliability_score == 100, season_reliability_score == 100, no_show_strikes == 0 (RELEASED rows are outside the reliability input set)"
            - "PositionSlot.${slot_id}.required_headcount == 2 throughout (the override is never recomputed by fill activity)"

      - name: assignment_attendance_and_payout_dimensions_independent
        grounds:
          - state_machines.StaffAssignment.SCHEDULED_to_CHECKED_IN
          - state_machines.StaffAssignment.CHECKED_IN_to_COMPLETED
          - state_machines.StaffAssignment.PENDING_to_ACCRUED
          - state_machines.StaffAssignment.ACCRUED_to_GRATUITY_ALLOCATED
          - state_machines.StaffAssignment.GRATUITY_ALLOCATED_to_PAID
          - calculations.assignment_worked_pay
          - calculations.gratuity_pool_allocation
        distinguishing_aspect: |
          Parallel state dimensions on ONE StaffAssignment row - a different entity from the
          PositionSlot cycle above. attendance_status and payout_status advance on different triggers:
          CHECK_IN moves attendance only (payout stays PENDING), CHECK_OUT moves both, and the two
          payout-run phases move payout_status ACCRUED -> GRATUITY_ALLOCATED -> PAID while
          attendance_status stays pinned at COMPLETED.
        test_recipe:
          setup:
            - "Clock at 2026-09-12T17:00:00Z; Event IN_PROGRESS with gratuity_pool_cents 50000."
