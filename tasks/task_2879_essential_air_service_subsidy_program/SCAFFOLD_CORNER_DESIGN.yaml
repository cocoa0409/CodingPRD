            - "GET /eas/solicitations/${sol_id}/preferences returns 4 rows ordered filing_sequence ASC then rank ASC with total_count == 4, so the superseded generation is still stored"
            - "GET /eas/solicitations/${sol_id}/preferences with filing_sequence 1 returns exactly the 2 superseded rows, both carrying rationale 'incumbent crew base preferred'"
            - "Under filing 2 the ranking read returns top_proposal_id == ${pb_id} with top_composite_score == 100.0000 and ${pa_id} at 79.3270 — only the maximum filing_sequence contributes"
            - "The selection order persists Proposal.${pb_id}.composite_score == 100.0000 and Proposal.${pa_id}.composite_score == 79.3270 with ServiceAgreement.${agr_id}.proposal_id == ${pb_id}"
            - "Solicitation.${sol_id}.version == ${sol_v1} + 2 after the two filings, one increment each"

      - name: preference_rankings_must_name_this_solicitations_submitted_proposals
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/eas/solicitations/{id}/preferences
          - validations.priority_13
          - validations.priority_4
          - errors.ERR_PROPOSAL_NOT_IN_SOLICITATION
          - errors.ERR_PROPOSAL_NOT_FOUND
        distinguishing_aspect: "The link target is checked on two axes at once — the proposal must belong to the addressed solicitation and must be SUBMITTED — and an entirely unknown proposal id is answered by the priority-4 existence rule (404) rather than by the priority-13 membership rule (409)."
        test_recipe:
          setup:
            - "Two communities each with an OPEN solicitation; solicitation 1 holds one SUBMITTED proposal and one DRAFT proposal, solicitation 2 holds one SUBMITTED proposal from the same carrier."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
