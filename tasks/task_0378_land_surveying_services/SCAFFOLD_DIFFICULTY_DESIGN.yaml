            - call: "POST /data-sets"
              payload: { order_id: "${order_id}", assignment_id: "${fa_id}", recorded_by_id: "${tech_id}", point_count: 80, closure_error_ppm: 15 }
              as: FieldTech
              as_user_id: "${tech_id}"
              captures: { ds_id: $.data.id }
            - call: "POST /data-sets/${ds_id}/reduce"
              payload: {}
              as: Drafter
              as_user_id: "${draft_id}"
            - call: "POST /data-sets/${ds_id}/accept"
              payload: {}
              as: Surveyor
