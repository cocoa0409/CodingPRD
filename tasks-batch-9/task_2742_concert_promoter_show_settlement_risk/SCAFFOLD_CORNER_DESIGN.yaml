              captures: { cd_vn_id: $.data.id }
            - call: "POST /artists"
              payload: { name: "Cond Act One", agency: "Cnd Talent", tier: "THEATER", historical_sellthrough_pct: 70.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { cd_ar_1: $.data.id }
            - call: "POST /artists"
              payload: { name: "Cond Act Two", agency: "Cnd Talent", tier: "THEATER", historical_sellthrough_pct: 70.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { cd_ar_2: $.data.id }
            - call: "POST /artists"
              payload: { name: "Cond Act Three", agency: "Cnd Talent", tier: "THEATER", historical_sellthrough_pct: 70.00, withholding_pct: 0 }
              as: TalentBuyer
              captures: { cd_ar_3: $.data.id }
            # ---- show C1, payment_due 1000001
            - call: "POST /shows"
              payload: { artist_id: "${cd_ar_1}", venue_id: "${cd_vn_id}", event_at: "2026-12-02T02:00:00.000Z", load_in_at: "2026-12-01T14:00:00.000Z", load_out_at: "2026-12-02T08:00:00.000Z", announce_at: "2026-08-01T00:00:00.000Z", venue_arrangement: "RENTAL", rental_fee_cents: 0 }
