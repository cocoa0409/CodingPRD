            - "The first trigger call is sent with NO X-User-Role and NO X-User-ID header (hence no as: key); the second carries X-User-Role: Auditor, which is not one of the seven §1.7 roles; the third carries X-User-Role: PackagingCoordinator with no X-User-ID (hence no as_user_id: key)."
