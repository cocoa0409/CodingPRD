              payload: {}
              as: Judge
              as_user_id: "judge-1"
            - call: "POST /gc/evaluations"
              payload: { petition_id: "${pet_id}", finding: "PARTIALLY_INCAPACITATED", recommended_scope: "PERSON" }
              as: CourtExaminer
              as_user_id: "exam-1"
              captures: { eval_id: $.data.id }
          trigger:
            - call: "POST /gc/evaluations/${eval_id}/file"
              payload: {}
