          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: the certify response itself, and a same-instant GET, both expose recomputed segment grades without any delay or reprocessing."
        test_recipe:
          setup: ["inspection in QA_REVIEW with one grade-4 structural defect"]
          setup_api_calls:
            - call: "POST /sewer/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: DistrictEngineer
            - call: "POST /sewer/districts"
              payload: { name: "D-K1", ii_reduction_target_pct: 20, budget_cents: 1000000 }
              as: DistrictEngineer
              captures: { d_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "C K1", nassco_cert_number: "PACP-CK1X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["CODER"] }
              as: DistrictEngineer
              captures: { tc_id: $.data.id }
            - call: "POST /sewer/technicians"
              payload: { full_name: "Q K1", nassco_cert_number: "PACP-QK1X", nassco_cert_expires_at: "2027-01-01T00:00:00Z", capabilities: ["QA_REVIEWER"] }
              as: DistrictEngineer
              captures: { tq_id: $.data.id }
            - call: "POST /sewer/districts/${d_id}/inspection-cycles"
              payload: { label: "CY-K1", window_start: "2026-08-01T00:00:00Z", window_end: "2026-09-01T00:00:00Z" }
              as: DistrictEngineer
              captures: { cy_id: $.data.id }
            - call: "POST /sewer/inspection-cycles/${cy_id}/open"
              payload: {}
              as: DistrictEngineer
            - call: "POST /sewer/districts/${d_id}/segments"
              payload: { segment_ref: "MH-1->MH-2", diameter_mm: 200, material: "VCP", length_m: 100, install_year: 1980 }
              as: DistrictEngineer
              captures: { s_id: $.data.id }
            - call: "POST /sewer/segments/${s_id}/cctv-inspections"
              payload: { cycle_id: "${cy_id}", scheduled_at: "2026-08-10T06:00:00Z", coder_id: "${tc_id}", purpose: "BASELINE" }
              as: DistrictEngineer
              captures: { i_id: $.data.id }
            - call: "POST /sewer/cctv-inspections/${i_id}/start"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/begin-coding"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/defects"
              payload: { pacp_code: "B", family: "STRUCTURAL", grade: 4, distance_m: 10, clock_position: 12 }
              as: Coder
              as_user_id: "${tc_id}"
            - call: "POST /sewer/cctv-inspections/${i_id}/submit-qa"
              payload: {}
              as: Coder
              as_user_id: "${tc_id}"
          trigger:
            - call: "POST /sewer/cctv-inspections/${i_id}/certify"
              payload: {}
              as: QaReviewer
              as_user_id: "${tq_id}"
              captures: { st: $.data.status }
            - call: "GET /sewer/segments/${s_id}"
              payload: {}
              as: DistrictEngineer
              captures: { sg: $.data.structural_grade, qr: $.data.quick_rating }
          assert:
            - "certify response status == 'CERTIFIED' and the immediately following GET shows structural_grade == 4 and quick_rating == '4100' (no async lag)"
