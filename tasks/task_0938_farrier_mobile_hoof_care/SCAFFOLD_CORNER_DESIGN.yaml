  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:

      - name: corner_dispatcher_cannot_complete_an_appointment
        claim_type: Role denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]", "validations[priority=2]"]
        distinguishing_aspect: "complete is an exclusive Farrier operation, so a Dispatcher calling it gets 403 ERR_FORBIDDEN_ROLE before any state precondition is evaluated."
        test_recipe:
          setup: ["An appointment sitting IN_PROGRESS at an ARRIVED stop."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 6, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
            - call: "GET /horses/${h1}/limb-states"
              payload: {}
              as: PlatformAdmin
              captures: { lf: "$.data[0].id" }
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
            - call: "POST /rate-cards"
              payload: { label: "2026 base", effective_from: "2026-01-01", price_trim_cents: 2200, price_reset_cents: 3800, price_new_shoes_cents: 6500, price_corrective_cents: 9800, price_glue_on_cents: 8400, pad_price_cents: 1600, trip_fee_zone_a_cents: 4500, trip_fee_zone_b_cents: 7000, trip_fee_zone_c_cents: 11000 }
              as: PlatformAdmin
              captures: { rc1: "$.data.id" }
            - call: "POST /rate-cards/${rc1}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /routes"
              payload: { farrier_id: "${fr1}", route_date: "2026-05-06" }
              as: Dispatcher
              captures: { rt1: "$.data.id" }
            - call: "POST /routes/${rt1}/stops"
              payload: { barn_id: "${barn_a}", sequence_index: 1, planned_start_minute: 480 }
              as: Dispatcher
              captures: { st1: "$.data.id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h1}", scheduled_date: "2026-05-06" }
              as: Dispatcher
              captures: { ap1: "$.data.id", ap1_v: "$.data.version" }
            - call: "POST /appointments/${ap1}/service-lines"
              payload: { lines: [{ limb_state_id: "${lf}", service_type: "TRIM" }], expected_appointment_version: "${ap1_v}" }
              as: Dispatcher
              captures: { sl1: "$.data[0].id" }
            - call: "GET /routes/${rt1}"
              payload: {}
              as: Dispatcher
              captures: { rt1_v: "$.data.version" }
            - call: "POST /route-stops/${st1}/appointments"
              payload: { appointment_id: "${ap1}", expected_route_version: "${rt1_v}" }
              as: Dispatcher
            - call: "POST /routes/${rt1}/plan"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${rt1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /route-stops/${st1}/arrive"
              payload: {}
              as: Farrier
              as_user_id: "${fr1}"
            - call: "POST /appointments/${ap1}/start"
              payload: {}
              as: Farrier
              as_user_id: "${fr1}"
          trigger:
            - call: "POST /appointments/${ap1}/complete"
              payload: { performed_service_line_ids: ["${sl1}"] }
              as: Dispatcher
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 403"
            - "error_id == ERR_FORBIDDEN_ROLE"
            - "Appointment.${ap1}.status is still IN_PROGRESS"

      - name: corner_client_user_cannot_cancel_another_clients_appointment
        claim_type: Ownership denial
        grounds: [roles, "errors[ERR_NOT_RESOURCE_OWNER]", "validations[priority=3]"]
        distinguishing_aspect: "ClientUser is entity_backed:Client, so X-User-ID must equal the owning client's id; a second client cancelling the first client's appointment gets 403 ERR_NOT_RESOURCE_OWNER, not ERR_FORBIDDEN_ROLE."
        test_recipe:
          setup: ["Two clients; the first owns a horse with one UNROUTED appointment."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Aoi Tanaka", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl1: "$.data.id" }
            - call: "POST /clients"
              payload: { display_name: "Ben Ito", home_barn_id: "${barn_a}" }
              as: PlatformAdmin
              captures: { cl2: "$.data.id" }
            - call: "POST /horses"
              payload: { client_id: "${cl1}", barn_id: "${barn_a}", name: "Comet", routine_cycle_weeks: 6, shoe_size_code: "1" }
              as: PlatformAdmin
              captures: { h1: "$.data.id" }
            - call: "POST /appointments"
              payload: { horse_id: "${h1}", scheduled_date: "2026-05-13" }
              as: Dispatcher
              captures: { ap1: "$.data.id" }
          trigger:
            - call: "POST /appointments/${ap1}/cancel"
              payload: {}
              as: ClientUser
              as_user_id: "${cl2}"
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 403"
            - "error_id == ERR_NOT_RESOURCE_OWNER"
            - "Appointment.${ap1}.status is still UNROUTED"

      - name: corner_missing_auth_headers_returns_unauthenticated
        claim_type: Role denial
        grounds: ["errors[ERR_UNAUTHENTICATED]", "validations[priority=1]"]
        distinguishing_aspect: "Priority 1 outranks everything: a request carrying neither X-User-Role nor X-User-ID returns 401 ERR_UNAUTHENTICATED even when the path resource does not exist."
        test_recipe:
          setup: ["Empty database. The trigger call is issued with NO X-User-Role and NO X-User-ID header at all."]
          setup_api_calls: []
          trigger:
            - call: "GET /barns/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: NONE
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 401"
            - "error_id == ERR_UNAUTHENTICATED, not ERR_BARN_NOT_FOUND"

      - name: corner_veterinarian_cannot_open_a_route
        claim_type: Role denial
        grounds: [roles, "errors[ERR_FORBIDDEN_ROLE]"]
        distinguishing_aspect: "POST /routes is a Dispatcher-exclusive operation; a Veterinarian receives 403 ERR_FORBIDDEN_ROLE and no Route row is created."
        test_recipe:
          setup: ["One ACTIVE farrier."]
          setup_api_calls:
            - call: "POST /farriers"
              payload: { display_name: "Kenji Mori", certification_level: "JOURNEYMAN", cert_expires_on: "2027-01-01" }
              as: PlatformAdmin
              captures: { fr1: "$.data.id" }
          trigger:
            - call: "POST /routes"
              payload: { farrier_id: "${fr1}", route_date: "2026-05-06" }
              as: Veterinarian
              captures: { err: "$.data.error_id" }
          assert:
            - "response status is 403"
            - "error_id == ERR_FORBIDDEN_ROLE"
            - "GET /routes?farrier_id=${fr1} returns 0 rows"

