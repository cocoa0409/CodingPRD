  - rule_id: cross_entity_state_dependency
    instances:
      - name: consolidation_requires_mawb_open
        grounds:
          - state_machines.HouseWaybill.CLEARED_to_CONSOLIDATED
          - state_machines.MasterWaybill.DRAFT_to_OPEN_FOR_CONSOLIDATION
        distinguishing_aspect: |
          Entity pair HouseWaybill x MasterWaybill: the waybill's
          CLEARED -> CONSOLIDATED transition is gated on the master waybill's
          state — rejected with ERR_MAWB_NOT_OPEN_FOR_CONSOLIDATION while the
          MAWB is DRAFT, succeeding after POST .../open with no change to the
          waybill itself.
        test_recipe:
          setup:
            - "Base SFO->NRT fixture; booking OPEN; MAWB 180-12345675 created but NOT opened (DRAFT)"
            - "HWB-A gross 80.0 / 0.60 m3 CLEARED"
