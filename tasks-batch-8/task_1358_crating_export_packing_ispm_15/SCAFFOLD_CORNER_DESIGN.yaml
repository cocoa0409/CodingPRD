      - name: batch_expired_blocks_approve
        claim_type: violation_to_error
        grounds: ["validations[priority=20]", "errors[ERR_BATCH_NOT_ACTIVE]"]
        distinguishing_aspect: "Batch expires_at 2026-06-01 is before the default logical clock 2026-08-01, so the batch lazily reads EXPIRED and design approve -> ERR_BATCH_NOT_ACTIVE without any clock manipulation."
        test_recipe:
          setup: ["QUOTED job, item, design IN_REVIEW; batch HT-OLD-01 expired 2026-06-01"]
          setup_api_calls:
