            - call: "GET /qa/changeovers/${co}"
              as: QaSupervisor
              captures: { score: $.data.validation_score, st: $.data.status }
          assert:
            - "validation_score == clamp(0,100, 100 + 5 (on-time) + 3 (margins) - 0) == 100"
            - "status == VALIDATED"

      - name: label_reconciliation_verdict_precedence_undeclared_over_revision
        claim_type: correct_result
        grounds: ["calculations.label_reconciliation_verdict"]
        distinguishing_aspect: |
          When missing_allergens non-empty AND printed_label_revision also
          mismatches, verdict precedence pins UNDECLARED_ALLERGEN (highest),
          suppressing REVISION_MISMATCH.
        test_recipe:
          setup: ["Product P allergen_set=[PEANUT] label_revision=3; run snapshots revision 3; reconciliation printed revision 2 and declared []"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-C2", description: "t", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-C2", product_name: "t", allergen_set: ["PEANUT"], rework_class: "NO_REWORK", label_revision: 3 }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
          trigger:
            - call: "POST /qa/label-reconciliations"
              payload: { run_id: "${run}", printed_label_revision: 2, declared_allergens_on_label: [] }
              as: QaSupervisor
              captures: { verdict: $.data.verdict, missing: $.data.missing_allergens }
          assert:
            - "verdict == UNDECLARED_ALLERGEN (precedence over REVISION_MISMATCH)"
            - "missing_allergens == [PEANUT]"

      - name: audit_finding_points_deduction_constants
        claim_type: constants_applied
        grounds: ["calculations.training_score"]
        distinguishing_aspect: "MAJOR finding deducts exactly 5 points; OVERDUE adds +3 when the clock passes corrective_action_due_utc (verified via _clock)."
        test_recipe:
          setup: ["Tech T1 score=100; MAJOR finding due 2026-06-15; clock advanced past due"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-C3A", full_name: "a", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { t1: $.data.id }
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-C3B", full_name: "b", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2027-01-01T00:00:00Z" }
              as: QaManager
              captures: { t2: $.data.id }
            - call: "POST /qa/audit-findings"
              payload: { technician_id: "${t1}", auditor_id: "${t2}", finding_type: "PROCEDURE_DEVIATION", severity: "MAJOR", corrective_action_due_utc: "2026-06-15T00:00:00Z" }
              as: Auditor
              as_user_id: "${t2}"
              captures: { f: $.data.id }
            - call: "GET /qa/technicians/${t1}"
              as: QaManager
              captures: { score_after_major: $.data.training_score }
          trigger:
            - call: "POST /qa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-16T00:00:00Z" }
              as: QaManager
            - call: "GET /qa/audit-findings/${f}"
              as: QaManager
              captures: { f_status: $.data.status }
            - call: "GET /qa/technicians/${t1}"
              as: QaManager
              captures: { score_after_overdue: $.data.training_score }
          assert:
            - "After MAJOR finding: training_score == 95"
            - "After clock sweep past due: finding status == OVERDUE and training_score == 92 (95 - 3)"

      - name: introduced_allergens_excludes_draft_and_cancelled_runs
        claim_type: input_set_filtering
        grounds: ["calculations.introduced_allergens"]
        distinguishing_aspect: |
          strict_actual baseline excludes DRAFT, SCHEDULED (optimistic-only),
          REJECTED, and CANCELLED runs — only COMPLETED/IN_PROGRESS count. A
          CANCELLED predecessor that contained PEANUT does not mask PEANUT
          introduction for the next run.
        test_recipe:
          setup: ["Line with PEANUT matrix REQUIRES_CHANGEOVER; R1 (PEANUT product) created then CANCELLED from DRAFT; R2 (PEANUT product) created"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-C4", description: "t", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line: $.data.id }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line}", allergen_id: "${al}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 30 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-C4", product_name: "t", allergen_set: ["PEANUT"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { r1: $.data.id }
            - call: "POST /qa/production-runs/${r1}/cancel"
              as: QaSupervisor
          trigger:
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T12:00:00Z", planned_end_utc: "2026-06-01T14:00:00Z" }
              as: QaSupervisor
              captures: { r2: $.data.id, r2_introduced: $.data.introduced_allergens }
          assert:
            - "R2.introduced_allergens == [PEANUT] (CANCELLED R1 excluded from baseline)"
            - "R2.changeover_required == true"

  # ===========================================================================
  # Section: validations — violation->error beyond §1.8 pairs; priority order.
  # ===========================================================================
  - section: validations
    instances:
      - name: auth_missing_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1\"]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "Any endpoint called without X-User-Role yields ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /qa/allergens"
              as: QaManager
              captures: { ok: $.data }
          assert:
            - "Positive control: with role header, GET /qa/allergens returns 200 (proves the endpoint exists); missing-header case asserted by test harness via raw HTTP without headers -> ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

      - name: state_priority_beats_business_safety_on_run_schedule
        claim_type: priority_ordering
        grounds: ["validations[priority=5\"]", "validations[priority=7]", "errors[ERR_RUN_NOT_DRAFT]", "errors[ERR_ALLERGEN_PROHIBITED_ON_LINE]"]
        distinguishing_aspect: |
          A run already SCHEDULED whose product would introduce a PROHIBITED
          allergen is re-scheduled: priority 5 (state: not DRAFT) wins over
          priority 7 (business_safety: PROHIBITED) -> ERR_RUN_NOT_DRAFT.
        test_recipe:
          setup: ["Line with PEANUT PROHIBITED; product contains PEANUT; run created (create-time also checks PROHIBITED, so we craft run for a different product then rely on schedule-time re-check via a second run that is already SCHEDULED)"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-V2", description: "t", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line: $.data.id, line_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line}", allergen_id: "${al}", handling: "PROHIBITED", changeover_minutes: 0 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-V2A", product_name: "plain", allergen_set: [], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_plain: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod_plain}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
            - call: "POST /qa/production-runs/${run}/schedule"
              payload: { expected_line_version: "${line_v}" }
              as: QaSupervisor
          trigger:
            - call: "POST /qa/production-runs/${run}/schedule"
              payload: { expected_line_version: "${line_v}" }
              as: QaSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "Re-scheduling a SCHEDULED run yields error_id == ERR_RUN_NOT_DRAFT (state priority 5 precedes business checks)"

      - name: prohibited_allergen_rejected_at_schedule
        claim_type: violation_to_error
        grounds: ["validations[priority=7\"]", "errors[ERR_ALLERGEN_PROHIBITED_ON_LINE]"]
        distinguishing_aspect: "A DRAFT run whose product introduces an allergen mapped PROHIBITED on the line is rejected at schedule with ERR_ALLERGEN_PROHIBITED_ON_LINE."
        test_recipe:
          setup: ["Line with PEANUT PROHIBITED; product allergen_set=[PEANUT]; run DRAFT"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "PEANUT", display_name: "Peanut", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-V3", description: "t", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line: $.data.id, line_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line}", allergen_id: "${al}", handling: "PROHIBITED" }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-V3", product_name: "t", allergen_set: ["PEANUT"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
          trigger:
            - call: "POST /qa/production-runs/${run}/schedule"
              payload: { expected_line_version: "${line_v}" }
              as: QaSupervisor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ALLERGEN_PROHIBITED_ON_LINE"

      - name: rework_class_no_rework_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13\"]", "errors[ERR_REWORK_CLASS_VIOLATION]"]
        distinguishing_aspect: "Committing rework into a target run whose product.rework_class == NO_REWORK yields ERR_REWORK_CLASS_VIOLATION (class gate evaluated before allergen-subset check)."
        test_recipe:
          setup: ["Source product rework_class=SAME_ALLERGEN_PROFILE allergen_set=[MILK]; target product rework_class=NO_REWORK allergen_set=[MILK]; batch available"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "MILK", display_name: "Milk", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-V4", description: "t", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-V4A", product_name: "a", allergen_set: ["MILK"], rework_class: "SAME_ALLERGEN_PROFILE" }
              as: QaManager
              captures: { prod_a: $.data.id }
            - call: "POST /qa/products"
              payload: { sku: "P-V4B", product_name: "b", allergen_set: ["MILK"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod_b: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod_a}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run_src: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod_b}", planned_start_utc: "2026-06-01T12:00:00Z", planned_end_utc: "2026-06-01T14:00:00Z" }
              as: QaSupervisor
              captures: { run_tgt: $.data.id }
            - call: "POST /qa/rework-batches"
              payload: { source_run_id: "${run_src}", source_product_id: "${prod_a}", quantity_kg: 10 }
              as: QaSupervisor
              captures: { batch: $.data.id }
          trigger:
            - call: "POST /qa/rework-batches/${batch}/commit"
              payload: { target_run_id: "${run_tgt}", quantity_kg: 5 }
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_REWORK_CLASS_VIOLATION"

      - name: tech_certification_expired_swab_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=11\"]", "errors[ERR_TECH_NOT_CERTIFIED]"]
        distinguishing_aspect: "Swab recorded after the technician's certification_expiry_utc (per logical clock) is rejected with ERR_TECH_NOT_CERTIFIED."
        test_recipe:
          setup: ["Tech certified for SOY with expiry 2026-06-01; clock set to 2026-07-01; changeover SWAB_PENDING"]
          setup_api_calls:
            - call: "POST /qa/allergens"
              payload: { code: "SOY", display_name: "Soy", regulatory_class: "MAJOR_9" }
              as: QaManager
              captures: { al: $.data.id }
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-V5", description: "t", sanitation_class: "WET_WASH" }
              as: QaManager
              captures: { line: $.data.id, line_v: $.data.version }
            - call: "POST /qa/line-allergen-matrix-entries"
              payload: { line_id: "${line}", allergen_id: "${al}", handling: "REQUIRES_CHANGEOVER", changeover_minutes: 10 }
              as: QaManager
            - call: "POST /qa/products"
              payload: { sku: "P-V5", product_name: "t", allergen_set: ["SOY"], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/changeover-procedures"
              payload: { procedure_code: "COP-V5", target_allergen_id: "${al}", method: "FULL_WET_WASH", min_swab_zones: 1, atp_action_level_rlu: 150, allergen_action_level_ppm: 2.0 }
              as: QaManager
              captures: { proc: $.data.id, proc_v: $.data.version }
            - call: "POST /qa/changeover-procedures/${proc}/approve"
              payload: { expected_procedure_version: "${proc_v}" }
              as: QaManager
            - call: "POST /qa/technicians"
              payload: { tech_code: "TECH-V5", full_name: "t", certified_allergen_ids: ["${al}"], certification_expiry_utc: "2026-06-01T00:00:00Z" }
              as: QaManager
              captures: { tech: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
            - call: "POST /qa/changeovers"
              payload: { line_id: "${line}", from_run_id: null, to_run_id: "${run}", procedure_id: "${proc}", scheduled_minutes: 10 }
              as: QaSupervisor
              captures: { co: $.data.id }
            - call: "POST /qa/production-runs/${run}/schedule"
              payload: { expected_line_version: "${line_v}" }
              as: QaSupervisor
            - call: "POST /qa/changeovers/${co}/begin"
              as: LineOperator
            - call: "POST /qa/changeovers/${co}/finish-execution"
              payload: { actual_minutes: 10 }
              as: LineOperator
            - call: "POST /qa/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: QaManager
          trigger:
            - call: "POST /qa/changeovers/${co}/swab-results"
              payload: { zone_code: "Z1", swab_type: "ATP", measured_value: 50, recorded_by_id: "${tech}" }
              as: QaTechnician
              as_user_id: "${tech}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TECH_NOT_CERTIFIED (certification expired at clock time)"

      - name: run_not_due_start_rejected
        claim_type: temporal_validation
        grounds: ["validations[priority=16\"]", "errors[ERR_RUN_NOT_DUE]"]
        distinguishing_aspect: "Starting a SCHEDULED run before planned_start_utc per the logical clock yields ERR_RUN_NOT_DUE."
        test_recipe:
          setup: ["Run SCHEDULED for 2026-06-01T08:00, changeover not required (ALLERGEN_DEDICATED line, no introduced allergens), clock at default 2026-05-01"]
          setup_api_calls:
            - call: "POST /qa/production-lines"
              payload: { line_code: "LINE-V6", description: "t", sanitation_class: "ALLERGEN_DEDICATED" }
              as: QaManager
              captures: { line: $.data.id, line_v: $.data.version }
            - call: "POST /qa/products"
              payload: { sku: "P-V6", product_name: "t", allergen_set: [], rework_class: "NO_REWORK" }
              as: QaManager
              captures: { prod: $.data.id }
            - call: "POST /qa/production-runs"
              payload: { line_id: "${line}", product_id: "${prod}", planned_start_utc: "2026-06-01T08:00:00Z", planned_end_utc: "2026-06-01T10:00:00Z" }
              as: QaSupervisor
              captures: { run: $.data.id }
            - call: "POST /qa/production-runs/${run}/schedule"
              payload: { expected_line_version: "${line_v}" }
              as: QaSupervisor
          trigger:
            - call: "POST /qa/production-runs/${run}/start"
              as: LineOperator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_RUN_NOT_DUE (default clock 2026-05-01 < planned_start 2026-06-01)"

