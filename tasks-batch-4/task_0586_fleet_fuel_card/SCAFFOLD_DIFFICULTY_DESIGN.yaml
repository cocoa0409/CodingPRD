              payload: { card_id: "${card1_id}", vehicle_id: "${veh1_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-06-10T00:00:00Z", expected_card_version: "${card1_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
          trigger:
            - call: "POST /card-assignments"
              payload: { card_id: "${card2_id}", vehicle_id: "${veh2_id}", driver_id: "${drv_id}", effective_from: "2026-06-05T00:00:00Z", effective_to: "2026-06-15T00:00:00Z", expected_card_version: "${card2_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { err: $.data.error_id }
            - call: "POST /card-assignments"
              payload: { card_id: "${card2_id}", vehicle_id: "${veh2_id}", driver_id: "${drv_id}", effective_from: "2026-06-10T00:00:00Z", effective_to: "2026-06-20T00:00:00Z", expected_card_version: "${card2_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { asg_ok_id: $.data.id }
          assert:
            - "first trigger response.status == 409"
            - "first trigger response.data.error_id == ERR_DRIVER_DOUBLE_BOOKED"
            - "CardAssignment.${asg_ok_id}.status == ACTIVE"

      - name: maintenance_window_buffered_overlap
        grounds:
          - validations[priority=13]
          - errors[ERR_MAINTENANCE_OVERLAP]
          - entities.TelematicsFault.fields.maintenance_window_start
          - entities.TelematicsFault.fields.maintenance_window_end
        distinguishing_aspect: >
          Buffered/closed semantics on the Vehicle resource: a CRITICAL fault window
          [11:00,13:00) starting one hour after another's [08:00,10:00) end is still rejected
          (ERR_MAINTENANCE_OVERLAP) because each window is padded by the 2-hour buffer — a stricter
          interval treatment than the adjacency-allowed driver-assignment overlap.
        test_recipe:
          setup:
            - "Fleet, one vehicle; a CRITICAL fault already scheduled with window [2026-06-02T08:00,10:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Maint Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VC", tank_capacity_gallons: 5000, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /telematics-faults"
              payload: { vehicle_id: "${veh_id}", fault_code: "P0420", severity: "CRITICAL", maintenance_window_start: "2026-06-02T08:00:00Z", maintenance_window_end: "2026-06-02T10:00:00Z" }
              as: TelematicsGateway
              captures: { fault1_id: $.data.id }
          trigger:
            - call: "POST /telematics-faults"
              payload: { vehicle_id: "${veh_id}", fault_code: "P0300", severity: "CRITICAL", maintenance_window_start: "2026-06-02T11:00:00Z", maintenance_window_end: "2026-06-02T13:00:00Z" }
              as: TelematicsGateway
              captures: { err: $.data.error_id }
          assert:
            - "trigger response.status == 409"
            - "trigger response.data.error_id == ERR_MAINTENANCE_OVERLAP"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: rebate_accrual_conserved_across_capture_void
        grounds:
          - state_machines.Transaction.AUTHORIZED_to_CAPTURED
          - state_machines.Transaction.CAPTURED_to_VOIDED
          - entities.FleetAccount.fields.rebate_accrual_cents
          - calculations.provisional_final_rebate
        distinguishing_aspect: >
          Conserved quantity = rebate_accrual_cents (accrued-rebate liability): capture adds
          provisional 500, void subtracts exactly 500, returning accrual to its pre-capture value 0.
        test_recipe:
          setup:
            - "Fleet, vehicle, active card+assignment; one 100-gal transaction authorized then captured (accrues 500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Inv1 Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "VD", tank_capacity_gallons: 5000, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Ray", pin: "1616" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "0301", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 100, unit_price_cents: 400, odometer: 100, jurisdiction: "CA" }
              as: Merchant
              captures: { tx_id: $.data.id }
            - call: "POST /transactions/${tx_id}/capture"
              payload: {}
              as: Merchant
          trigger:
            - call: "POST /transactions/${tx_id}/void"
              payload: {}
              as: Merchant
          assert:
            - "Transaction.${tx_id}.provisional_rebate_cents == 500"
            - "FleetAccount.${fa_id}.rebate_accrual_cents == 0"

      - name: available_credit_conserved_across_authorize_void
        grounds:
          - state_machines.Transaction.AUTHORIZED_to_VOIDED
          - entities.FleetAccount.fields.available_credit_cents
          - entities.Transaction.fields.hold_amount_cents
          - calculations.credit_ledger
        distinguishing_aspect: >
          Conserved quantity = available_credit_cents (spendable credit pool, distinct from the
          rebate liability): authorize places a 40000 hold (available 1000000->960000), void
          releases exactly 40000, restoring available to the 1000000 credit_limit.
        test_recipe:
          setup:
            - "Fleet credit_limit 1000000, vehicle, active card+assignment; one 100-gal @ 400cpg authorization placing a 40000 hold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
