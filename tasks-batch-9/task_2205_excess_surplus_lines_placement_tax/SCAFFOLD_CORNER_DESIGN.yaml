  # ===========================================================================
  - section: calculations
    instances:

      - name: unrated_carrier_scores_forty_five_and_only_decline_is_accepted
        claim_type: Correct Result
        grounds:
          - calculations.market_security_score
          - errors.ERR_DECISION_SCORE_MISMATCH
        distinguishing_aspect: "An NR carrier with 1,600,000,000 cents of capital, US_STATE domicile and no NAIC quarterly listing scores exactly 0 + 30 + 15 + 0 = 45 on its INITIAL_REVIEW — below the 50 CONDITION floor — so DECLINE is the only decision the server accepts; APPROVE and CONDITION both return 422 ERR_DECISION_SCORE_MISMATCH."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. One carrier, Meridian, with am_best_rating NR, capital_surplus_cents 1600000000, domicile_type US_STATE, trust_fund_cents 0 and naic_quarterly_listing false. One MarketSecurityReview on it, started so the score is computed."
          setup_api_calls:
            - *k_clock
            - call: "POST /carriers"
              payload: { naic_number: "22222", legal_name: "Meridian Indemnity Company", domicile_type: "US_STATE", capital_surplus_cents: 1600000000, am_best_rating: "NR", trust_fund_cents: 0, naic_quarterly_listing: false }
              as: PlatformAdmin
              captures: { meridian_id: $.data.id, meridian_v0: $.data.version }
            - call: "POST /carriers/${meridian_id}/security-reviews"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { meridian_review_id: $.data.id }
            - call: "POST /market-security-reviews/${meridian_review_id}/start"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-anders"
          trigger:
            - call: "POST /market-security-reviews/${meridian_review_id}/decide"
              payload: { decision: "CONDITION", conditions_note: "Watch list", expected_carrier_version: "${meridian_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-anders"
              captures: { error_id: $.data.error_id }
            - call: "POST /market-security-reviews/${meridian_review_id}/decide"
              payload: { decision: "DECLINE", expected_carrier_version: "${meridian_v0}" }
              as: ComplianceOfficer
              as_user_id: "co-anders"
          assert:
            - "MarketSecurityReview.${meridian_review_id}.score == 45 and variant_applied == INITIAL_REVIEW"
            - "the CONDITION attempt returns 422 with error_id == ERR_DECISION_SCORE_MISMATCH"
            - "the DECLINE attempt returns 200 and MarketSecurityReview.${meridian_review_id}.status == DECLINED"
            - "Carrier.${meridian_id}.security_status == DECLINED"
            - "MarketSecurityReview.${meridian_review_id}.rating_at_review == NR and capital_surplus_at_review_cents == 1600000000"

