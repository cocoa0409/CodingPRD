            - "RENTAL_ADJUSTMENT charge of amount_cents == -47000 (status REFUNDED) posted; refund_issued_cents == 47000"
            - "Second modify with the stale pre-modify version fails 412 ERR_STALE_VERSION; dates stay 2026-09-01 -> 2026-09-04"

