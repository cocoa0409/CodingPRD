              as: Welder
              as_user_id: "${welder_id}"
          trigger:
            - call: "GET /weld-shop/shops/${shop_id}/weldments/${weldment_id}"
              as: Any
              captures: { wm_rate: $.data.repair_rate_pct, wm_posture: $.data.posture }
          assert:
            - "Weldment.repair_rate_pct == 33.33 (weldment aggregate rounding order: divide-then-round)"
            - "Weldment.posture == 'REPAIR_REVIEW' (33.33 >= 30 limit)"
            - "If joint-scoped averaging had been used, the value would have been 25.00 and posture would have remained OPEN — the two rounding orders diverge"

  # -------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (different entities)
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: wps_revision_cycle
        grounds:
          - state_machines.WPS
          - entities.WPS.fields.superseded_by_id
        distinguishing_aspect: |
          Cyclic shape on WPS: DRAFT(rev N) → APPROVED → SUPERSEDED when
          rev N+1 is approved; rev N+1 itself begins a new DRAFT, continuing
          the loop. Approving rev 2 supersedes rev 1; approving rev 3
          supersedes rev 2; the chain is unbounded.
        test_recipe:
          setup:
            - "Shop + APPROVED PQR"
            - "WPS-5 rev 1 APPROVED"
            - "WPS-5 rev 2 DRAFT, rev 3 DRAFT"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S5", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
              as: ShopAdmin
              captures: { shop_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs"
              payload: { pqr_number: "PQR-5", process: "SMAW", base_metal_spec: "A36", thickness_range_min_mm: 3, thickness_range_max_mm: 25, test_report_id: "TR-5" }
              as: QCManager
              captures: { pqr_id: $.data.id }
            - call: "POST /weld-shop/shops/${shop_id}/pqrs/${pqr_id}/approve"
              payload: {}
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-5", revision: 1, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_r1_id: $.data.id, wps_r1_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_r1_id}/approve"
              payload: { expected_wps_version: "${wps_r1_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-5", revision: 2, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_r2_id: $.data.id, wps_r2_v: $.data.version }
            - call: "POST /weld-shop/shops/${shop_id}/wps"
              payload: { wps_number: "WPS-5", revision: 3, pqr_id: "${pqr_id}", process: "SMAW", base_metal_spec: "A36", thickness_min_mm: 5, thickness_max_mm: 20 }
              as: QCManager
              captures: { wps_r3_id: $.data.id, wps_r3_v: $.data.version }
          trigger:
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_r2_id}/approve"
              payload: { expected_wps_version: "${wps_r2_v}" }
              as: QCManager
            - call: "POST /weld-shop/shops/${shop_id}/wps/${wps_r3_id}/approve"
              payload: { expected_wps_version: "${wps_r3_v}" }
              as: QCManager
            - call: "GET /weld-shop/shops/${shop_id}/wps/${wps_r1_id}"
              as: Any
              captures: { r1_status: $.data.status, r1_superseded_by: $.data.superseded_by_id }
            - call: "GET /weld-shop/shops/${shop_id}/wps/${wps_r2_id}"
              as: Any
              captures: { r2_status: $.data.status, r2_superseded_by: $.data.superseded_by_id }
          assert:
            - "WPS rev 1 status == 'SUPERSEDED' and superseded_by_id == wps_r2_id"
            - "WPS rev 2 status == 'SUPERSEDED' and superseded_by_id == wps_r3_id"
            - "WPS rev 3 status == 'APPROVED'"

      - name: joint_parallel_dimensions
        grounds:
          - state_machines.Joint
          - entities.Joint.fields.fabrication_status
          - entities.Joint.fields.inspection_status
        distinguishing_aspect: |
          Parallel state dimensions on Joint: fabrication_status and
          inspection_status evolve independently but interlock at gates.
          weld-out advances fabrication to WELDED_OUT AND flips inspection to
          READY_FOR_VT; NDT_FAILED cascades inspection back while fabrication
          remains WELDED_OUT; declare-repair flips fabrication back to
          IN_PROGRESS while inspection transitions to REPAIR_REQUIRED. Two
          axes, five fabrication × eight inspection states.
        test_recipe:
          setup:
            - "Shop + approved WPS + issued lot + qualified welder + joint J in fabrication"
          setup_api_calls:
            - call: "POST /weld-shop/shops"
              payload: { shop_name: "S6", aws_d1_1_revision: "D1.1:2025", repair_rate_limit_pct: 5 }
