          assert:
            - "CYC-A and CYC-B both exist in status 'SCHEDULED' with oven_station_id ${station}, identical oven_start_at '2026-08-01T09:00:00Z' and arm_index 1 and 2 respectively — the DIFFERENT_ARM_SAME_STATION variant permits a fully coincident window with no buffer at all"
            - "CYC-A holds mold_id ${mold} and CYC-B holds mold_id ${mold2}: the two cycles are separated by tool as well as by arm"
            - "the third create on arm 1 returns status 409 with data.error_id 'ERR_OVEN_WINDOW_CONFLICT', NOT 'ERR_NO_ELIGIBLE_MOLD' and NOT 'ERR_ORDER_OVERBUILD', even though both moulds are occupied over that span and the 4-unit quota is already filled by two 2-cavity cycles"
            - "ProductionOrder.${po}.version == ${po_v20} after that refusal and GET /molding-cycles?production_order_id=${po} still returns total_count 2"
            - "the arm_index 3 create returns status 422 with data.error_id 'ERR_INVALID_QUANTITY' because OvenStation.${station}.arm_count is 2 — the range check at priority 22 fires before the overlap check at priority 62, so a nonexistent arm is never treated as a free arm"

      # ---- layers already asserted by §1.8 (difficulty design) ----
      - name: layer_dual_variant_calculation_freight_quoted_nested_versus_billed_gross
