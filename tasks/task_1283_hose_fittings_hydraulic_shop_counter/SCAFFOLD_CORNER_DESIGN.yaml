        grounds: ["validations[priority=14]", "errors[ERR_TAG_SERIAL_TAKEN]"]
        distinguishing_aspect: "Two non-CANCELLED orders cannot share a tag_serial; the second tag attempt fails with ERR_TAG_SERIAL_TAKEN (409)."
        test_recipe:
          setup: ["Customer; reel; orders O1 and O2 both at TEST_PASSED; O1 already tagged DUP-1"]
          setup_api_calls:
            - call: "POST /api/customers"
              payload: { name: "DupCo" }
