      - name: order_total_input_set_excludes_backordered_lines
        claim_type: input_set_filtering
        grounds: [calculations.order_total]
        excluded_because:
          difficulty_instance: transitive_cascade / recall_cascade_lot_to_line_to_order_to_route_four_hops
          rationale: "The cascade drops the single line to BACKORDERED and asserts order_total_cents falls to 0, which is exactly the exclusion claim."
      - name: par_suggestion_variant_selection_by_query_parameter
        claim_type: variant_selection
