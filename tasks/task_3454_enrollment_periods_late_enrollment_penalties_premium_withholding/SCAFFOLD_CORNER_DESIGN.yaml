            - "2027 determination: lep_cents == 1900 (10% of 19000), total_premium_cents == 20900"
            - "same penalty_pct 10 attached for life; the cent amount reprices with each year's standard"
      - name: corner_iep_branching_covered
        claim_type: correct_result
        grounds: [calculations.calc_coverage_effective_month]
        excluded_because:
          difficulty_instance: iep_coverage_start_four_way_branch
