# =============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Coverage Index for Non-Difficulty Tests
# Public Library Management (task_0251) — EXPERT band
# Breadth probe: enumerates testable claims of §1.1-§1.7 not already covered by
# §1.8. section:/claim_type: values come from references/claim-extraction-guide.md.
# Every active recipe lints clean against §1.5. excluded_because stubs cite a §1.8
# instance by name and carry NO test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_branch_returns_201_with_policy_defaults
        claim_type: Creation
        grounds: [entities.Branch, 'endpoints["POST /library/branches"]']
        distinguishing_aspect: "POST /library/branches with only name applies defaults: fine_free=false, daily_fine_cents=25, grace_days=1, loan_period_days=21, block_threshold_cents=1000, reservation_buffer_minutes=15."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /library/branches"
              payload: { name: "Default Branch" }
              as: BranchManager
              captures: { br_id: $.data.id, ff: $.data.fine_free, dfc: $.data.daily_fine_cents, lpd: $.data.loan_period_days }
          assert:
            - "Response 201; Branch.fine_free == false; daily_fine_cents == 25; grace_days == 1; loan_period_days == 21; block_threshold_cents == 1000; reservation_buffer_minutes == 15"

      - name: create_patron_missing_required_branch_id_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Patron.fields.branch_id, 'endpoints["POST /library/patrons"]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "POST /library/patrons without branch_id (a required input field) returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /library/patrons"
              payload: { full_name: "No Branch" }
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Response 400 ERR_INVALID_REQUEST (branch_id required)"

      - name: get_patron_nonexistent_returns_not_found
        claim_type: Not Found
        grounds: [entities.Patron, 'endpoints["GET /library/patrons/{id}"]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "GET /library/patrons/{uuid} for an id that was never created returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /library/patrons/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Response 404 ERR_NOT_FOUND"

      - name: patron_system_fields_generated_and_input_ignored
        claim_type: System Fields
        grounds: [entities.Patron.fields.card_status, entities.Patron.fields.borrowing_status, 'endpoints["POST /library/patrons"]']
        distinguishing_aspect: "card_status and borrowing_status are source:system/computed; on create they are ACTIVE/CLEAR regardless of client input, and id/version are server-minted (version=1)."
        test_recipe:
          setup: ["Branch exists."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "SysBr" }
              as: BranchManager
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Sys Pat" }
              as: Librarian
              captures: { cs: $.data.card_status, bs: $.data.borrowing_status, v: $.data.version }
          assert:
            - "Patron.card_status == ACTIVE; borrowing_status == CLEAR; version == 1 (server-minted)"

      - name: create_copy_invalid_title_fk_returns_not_found
        claim_type: Parent Relationships
        grounds: [entities.Copy.fields.title_id, 'endpoints["POST /library/copies"]', 'errors[ERR_NOT_FOUND]']
        distinguishing_aspect: "POST /library/copies with a title_id FK that resolves to no Title returns 404 ERR_NOT_FOUND (FK integrity, flat topology)."
        test_recipe:
          setup: ["Branch exists; no titles."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "FKBr" }
              as: BranchManager
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /library/copies"
              payload: { title_id: "00000000-0000-0000-0000-000000000000", branch_id: "${br_id}", barcode: "BC-NF", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Response 404 ERR_NOT_FOUND (title_id FK does not resolve)"

      - name: patron_type_invalid_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.Patron.fields.patron_type, 'endpoints["POST /library/patrons"]', 'errors[ERR_INVALID_REQUEST]']
        distinguishing_aspect: "patron_type outside {ADULT, JUVENILE, STAFF} returns 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Branch exists."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "EnumBr" }
              as: BranchManager
              captures: { br_id: $.data.id }
          trigger:
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Bad Type", patron_type: "ROBOT" }
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Response 400 ERR_INVALID_REQUEST (invalid patron_type enum)"

      - name: title_available_copy_count_computed_after_two_copies
        claim_type: Computed Fields
        grounds: [entities.Title.fields.available_copy_count, entities.Title.fields.total_copy_count, 'endpoints["GET /library/titles/{id}"]']
        distinguishing_aspect: "After adding two AVAILABLE copies, Title.available_copy_count == 2 and total_copy_count == 2 (computed, reconciled on read)."
        test_recipe:
          setup: ["Title with two AVAILABLE copies."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "CompBr" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9781111111111", title_text: "Count Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-K1", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-K2", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
          trigger:
            - call: "GET /library/titles/${t_id}"
              payload: {}
              as: Librarian
              captures: { acc: $.data.available_copy_count, tcc: $.data.total_copy_count }
          assert:
            - "Title.${t_id}.available_copy_count == 2 and total_copy_count == 2"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: renew_returned_loan_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Loan, 'endpoints["POST /library/loans/{id}/renew"]', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Renew on a RETURNED (terminal) loan is not a defined transition and returns 409 ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["A loan already RETURNED."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "TLBr", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "TL Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9782222222222", title_text: "TL Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-TL", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
            - call: "POST /library/loans/${ln_id}/checkin"
              payload: {}
              as: Librarian
          trigger:
            - call: "POST /library/loans/${ln_id}/renew"
              payload: {}
              as: Patron
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 ERR_INVALID_STATE; Loan stays RETURNED"

      - name: confirm_already_confirmed_reservation_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Reservation.REQUESTED_to_CONFIRMED, 'endpoints["POST /library/reservations/{id}/confirm"]', 'errors[ERR_INVALID_STATE]']
        distinguishing_aspect: "Confirming a reservation already in CONFIRMED returns 409 ERR_INVALID_STATE (second identical trigger rejected)."
        test_recipe:
          setup: ["A CONFIRMED reservation."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "IdemBr", reservation_buffer_minutes: 0 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Idem Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/resources"
              payload: { branch_id: "${br_id}", resource_kind: "ROOM", label: "Idem Room" }
              as: BranchManager
              captures: { rs_id: $.data.id, rs_v: $.data.version }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: Librarian
            - call: "POST /library/reservations"
              payload: { resource_id: "${rs_id}", patron_id: "${p_id}", start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z", expected_resource_version: "${rs_v}" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { rv_id: $.data.id }
            - call: "POST /library/reservations/${rv_id}/confirm"
              payload: {}
              as: Librarian
          trigger:
            - call: "POST /library/reservations/${rv_id}/confirm"
              payload: {}
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Second confirm returns 409 ERR_INVALID_STATE; reservation stays CONFIRMED"

      - name: refresh_overdue_before_due_returns_not_yet_due
        claim_type: Precondition Enforcement
        grounds: [state_machines.Loan.ACTIVE_to_OVERDUE, 'endpoints["POST /library/loans/{id}/refresh-overdue"]', 'errors[ERR_NOT_YET_DUE]']
        distinguishing_aspect: "refresh-overdue invoked while clock now <= due_date violates the precondition and returns 409 ERR_NOT_YET_DUE; loan stays ACTIVE."
        test_recipe:
          setup: ["ACTIVE loan due 2026-06-08; clock at 2026-06-02 (before due)."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "NYDBr", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "NYD Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9783333333333", title_text: "NYD Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-NY", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
          trigger:
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: Librarian
            - call: "POST /library/loans/${ln_id}/refresh-overdue"
              payload: {}
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 ERR_NOT_YET_DUE; Loan.${ln_id}.status stays ACTIVE"

      - name: hold_checkout_while_waiting_returns_hold_not_ready
        claim_type: Precondition Enforcement
        grounds: [state_machines.Hold.READY_to_FULFILLED, 'endpoints["POST /library/holds/{id}/checkout"]', 'errors[ERR_HOLD_NOT_READY]']
        distinguishing_aspect: "Hold checkout while the hold is still WAITING (no copy reserved) returns 409 ERR_HOLD_NOT_READY."
        test_recipe:
          setup: ["A WAITING hold (no copy available to promote it) — title has its only copy ON_LOAN."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "HNRBr", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "HNR Pat A" }
              as: Librarian
              captures: { pa_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "HNR Pat B" }
              as: Librarian
              captures: { pb_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9784444444444", title_text: "HNR Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-HN", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${pa_id}" }
              as: Librarian
            - call: "POST /library/holds"
              payload: { title_id: "${t_id}", patron_id: "${pb_id}" }
              as: Patron
              as_user_id: "${pb_id}"
              captures: { h_id: $.data.id }
          trigger:
            - call: "POST /library/holds/${h_id}/checkout"
              payload: {}
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Response 409 ERR_HOLD_NOT_READY (hold is WAITING, no reserved copy)"

      - name: ill_transition_unknown_action_returns_invalid_action
        claim_type: Invalid Transitions
        grounds: [state_machines.IllRequest, 'endpoints["POST /library/ill-requests/{id}/transition"]', 'errors[ERR_INVALID_ACTION]']
        distinguishing_aspect: "An ILL transition with an action verb not in {approve,deny,ship,receive,return} returns 400 ERR_INVALID_ACTION."
        test_recipe:
          setup: ["A REQUESTED ILL request."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "ILLBr" }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "ILL Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/ill-requests"
              payload: { patron_id: "${p_id}", branch_id: "${br_id}", isbn: "9785555555555" }
              as: Patron
              as_user_id: "${p_id}"
              captures: { ill_id: $.data.id }
          trigger:
            - call: "POST /library/ill-requests/${ill_id}/transition"
              payload: { action: "teleport" }
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Response 400 ERR_INVALID_ACTION; ILL stays REQUESTED"

      - name: ill_approve_blocked_when_patron_blocked
        claim_type: guarded transitions
        grounds: [state_machines.IllRequest.REQUESTED_to_APPROVED, entities.Patron.fields.borrowing_status, 'errors[ERR_PATRON_BLOCKED]']
        distinguishing_aspect: "ILL approve requires the requesting Patron.borrowing_status == CLEAR; a BLOCKED patron's ILL approval returns 409 ERR_PATRON_BLOCKED (cross-entity guard)."
        test_recipe:
          setup: ["Patron BLOCKED by a 2200c unpaid lost fine (threshold 1000), with a REQUESTED ILL."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "ILLBlkBr", loan_period_days: 7, block_threshold_cents: 1000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "ILL Blk Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9786666666666", title_text: "ILL Blk Book", default_replacement_cents: 2000 }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-IB", acquired_on: "2026-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
            - call: "POST /library/loans/${ln_id}/declare-lost"
              payload: { flat_replacement: true }
              as: Librarian
            - call: "POST /library/ill-requests"
              payload: { patron_id: "${p_id}", branch_id: "${br_id}", isbn: "9786666666666" }
              as: Librarian
              captures: { ill_id: $.data.id }
          trigger:
            - call: "POST /library/ill-requests/${ill_id}/transition"
              payload: { action: "approve" }
              as: Librarian
              captures: { err: $.data.error_id }
          assert:
            - "Patron ${p_id} borrowing_status BLOCKED (total_owed 2200 >= 1000); ILL approve returns 409 ERR_PATRON_BLOCKED"

      - name: ill_receive_creates_ill_fee_fine
        claim_type: Side Effect Execution
        grounds: [state_machines.IllRequest.SHIPPED_to_RECEIVED, entities.Fine.fields.fine_type, calculations.patron_balance_and_block]
        distinguishing_aspect: "ILL receive (SHIPPED->RECEIVED) creates a Fine of fine_type ILL_FEE with amount_cents == lending_fee_cents, raising the patron's total_owed_cents."
        test_recipe:
          setup: ["A SHIPPED ILL request with lending_fee_cents=500."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "ILLFeeBr", block_threshold_cents: 100000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "ILL Fee Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/ill-requests"
              payload: { patron_id: "${p_id}", branch_id: "${br_id}", isbn: "9787777777777", lending_fee_cents: 500 }
              as: Patron
              as_user_id: "${p_id}"
              captures: { ill_id: $.data.id }
            - call: "POST /library/ill-requests/${ill_id}/transition"
              payload: { action: "approve" }
              as: Librarian
            - call: "POST /library/ill-requests/${ill_id}/transition"
              payload: { action: "ship" }
              as: Librarian
          trigger:
            - call: "POST /library/ill-requests/${ill_id}/transition"
              payload: { action: "receive" }
              as: Librarian
              captures: { st: $.data.status }
            - call: "GET /library/fines?patron_id=${p_id}&settlement_status=UNPAID"
              payload: {}
              as: Librarian
            - call: "GET /library/patrons/${p_id}"
              payload: {}
              as: Librarian
              captures: { owed: $.data.total_owed_cents }
          assert:
            - "ILL ${ill_id} status == RECEIVED; a Fine fine_type ILL_FEE amount_cents == 500 exists for ${p_id}"
            - "Patron.${p_id}.total_owed_cents == 500"

      - name: fine_pay_unblocks_patron_when_below_threshold
        claim_type: Compensation
        grounds: [state_machines.Fine.UNPAID_to_PAID, calculations.patron_balance_and_block, entities.Patron.fields.borrowing_status]
        distinguishing_aspect: "Paying the only unpaid fine drops total_owed_cents below block_threshold and flips borrowing_status BLOCKED->CLEAR (compensating side effect)."
        test_recipe:
          setup: ["Patron BLOCKED by a single 2200c unpaid lost fine (threshold 1000)."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "PayBr", loan_period_days: 7, block_threshold_cents: 1000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Pay Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9788888888888", title_text: "Pay Book", default_replacement_cents: 2000 }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-PY", acquired_on: "2026-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
            - call: "POST /library/loans/${ln_id}/declare-lost"
              payload: { flat_replacement: true }
              as: Librarian
            - call: "GET /library/fines?patron_id=${p_id}&settlement_status=UNPAID"
              payload: {}
              as: Librarian
              captures: { fine_id: "$.data[0].id" }
          trigger:
            - call: "POST /library/fines/${fine_id}/pay"
              payload: {}
              as: Librarian
            - call: "GET /library/patrons/${p_id}"
              payload: {}
              as: Librarian
              captures: { owed: $.data.total_owed_cents, bs: $.data.borrowing_status }
          assert:
            - "After pay: Patron.${p_id}.total_owed_cents == 0 and borrowing_status == CLEAR"

      - name: declare_lost_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Loan.ACTIVE_to_LOST, 'endpoints["POST /library/loans/{id}/declare-lost"]', 'errors[ERR_INVALID_STATE]']
        excluded_because:
          difficulty_instance: declare_lost_cascade_to_patron_block_depth4
          rationale: "The declare-lost LOST transition and its terminal lockdown are exercised by the named §1.8 cascade instance; the invalid-from-LOST rejection is the trivial complement of that covered transition."

  # ===========================================================================
  - section: calculations
    instances:
      - name: fine_free_branch_assesses_zero_overdue_fine
        claim_type: Constants Applied
        grounds: [calculations.overdue_fine_final, entities.Branch.fields.fine_free, 'endpoints["POST /library/loans/{id}/checkin"]']
        distinguishing_aspect: "A fine_free=true branch returns accrued_fine_cents == 0 at checkin even for a loan 30 days overdue (fine-free policy short-circuits the formula)."
        test_recipe:
          setup: ["fine_free=true branch; loan due 2026-06-08, returned 2026-07-08 (30 days late)."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "FreeBr", fine_free: true, loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Free Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9789999999999", title_text: "Free Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-FR", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln_id: $.data.id }
          trigger:
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-07-08T00:00:00Z" }
              as: Librarian
            - call: "POST /library/loans/${ln_id}/checkin"
              payload: {}
              as: Librarian
              captures: { f: $.data.accrued_fine_cents }
          assert:
            - "Loan.${ln_id}.accrued_fine_cents == 0 (fine_free branch); no OVERDUE Fine created"

      - name: account_summary_excludes_settled_fines
        claim_type: Input Set Filtering
        grounds: [calculations.capped_account_balance, calculations.capped_account_balance.variants.account_summary_excludes_settled, 'endpoints["GET /library/patrons/{id}/account-summary"]']
        distinguishing_aspect: "After paying one of two fines, account-summary raw_total_cents counts only the remaining UNPAID fine (PAID/WAIVED excluded from the input set)."
        test_recipe:
          setup: ["Patron with two LOST flat fines (default 1500 -> 1650c each); one is then PAID, leaving one UNPAID below the goodwill tier."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "ExclBr", loan_period_days: 7, block_threshold_cents: 100000 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Excl Pat" }
              as: Librarian
              captures: { p_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000020", title_text: "Excl Book", default_replacement_cents: 1500 }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-E1", acquired_on: "2026-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c1_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-E2", acquired_on: "2026-06-01T00:00:00Z", condition_factor: 1.0 }
              as: Librarian
              captures: { c2_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c1_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln1_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c2_id}", patron_id: "${p_id}" }
              as: Librarian
              captures: { ln2_id: $.data.id }
            - call: "POST /library/loans/${ln1_id}/declare-lost"
              payload: { flat_replacement: true }
              as: Librarian
            - call: "POST /library/loans/${ln2_id}/declare-lost"
              payload: { flat_replacement: true }
              as: Librarian
            - call: "GET /library/fines?patron_id=${p_id}&settlement_status=UNPAID"
              payload: {}
              as: Librarian
              captures: { f1_id: "$.data[0].id" }
          trigger:
            - call: "POST /library/fines/${f1_id}/pay"
              payload: {}
              as: Librarian
            - call: "GET /library/patrons/${p_id}/account-summary"
              payload: {}
              as: Librarian
              captures: { raw: $.data.raw_total_cents, waiver: $.data.waiver_cents, net: $.data.net_owed_cents }
          assert:
            - "After paying one fine: account-summary raw_total_cents == 1650 (one remaining UNPAID LOST fine: item 1500 + processing 150)"
            - "waiver_cents == 0 (1650 < goodwill tier 2000); net_owed_cents == 1650"

      - name: hold_queue_position_ordered_by_created_at
        claim_type: Correct Result
        grounds: [calculations.hold_queue_position, entities.Hold.fields.queue_position, 'endpoints["GET /library/holds/{id}"]']
        distinguishing_aspect: "Two WAITING holds placed in sequence get queue_position 1 and 2 respectively, ordered by Hold.created_at ASC (never by id)."
        test_recipe:
          setup: ["Title whose only copy is ON_LOAN; two patrons place WAITING holds in order."]
          setup_api_calls:
            - call: "POST /library/branches"
              payload: { name: "QBr", loan_period_days: 7 }
              as: BranchManager
              captures: { br_id: $.data.id }
            - call: "POST /library/_clock/set"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: Librarian
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Q Pat A" }
              as: Librarian
              captures: { pa_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Q Pat B" }
              as: Librarian
              captures: { pb_id: $.data.id }
            - call: "POST /library/patrons"
              payload: { branch_id: "${br_id}", full_name: "Q Pat C" }
              as: Librarian
              captures: { pc_id: $.data.id }
            - call: "POST /library/titles"
              payload: { branch_id: "${br_id}", isbn: "9780000000021", title_text: "Q Book" }
              as: Librarian
              captures: { t_id: $.data.id }
            - call: "POST /library/copies"
              payload: { title_id: "${t_id}", branch_id: "${br_id}", barcode: "BC-Q", acquired_on: "2025-06-01T00:00:00Z" }
              as: Librarian
              captures: { c_id: $.data.id }
            - call: "POST /library/loans"
              payload: { copy_id: "${c_id}", patron_id: "${pa_id}" }
              as: Librarian
            - call: "POST /library/holds"
              payload: { title_id: "${t_id}", patron_id: "${pb_id}" }
              as: Patron
              as_user_id: "${pb_id}"
              captures: { hb_id: $.data.id }
            - call: "POST /library/holds"
              payload: { title_id: "${t_id}", patron_id: "${pc_id}" }
              as: Patron
              as_user_id: "${pc_id}"
              captures: { hc_id: $.data.id }
          trigger:
            - call: "GET /library/holds/${hb_id}"
              payload: {}
              as: Librarian
              captures: { qb: $.data.queue_position }
            - call: "GET /library/holds/${hc_id}"
              payload: {}
              as: Librarian
              captures: { qc: $.data.queue_position }
          assert:
            - "Hold ${hb_id}.queue_position == 1 (earlier created_at); Hold ${hc_id}.queue_position == 2"

