scenario: "Rental Registration & Habitability Inspection: property registration & license, periodic/complaint inspection scheduling, life-safety/habitability checklist, violation & re-inspection cycle, lead-paint & tenant-notice compliance, license renewal & fee, escalation/condemnation, landlord portal"
domain_name: "rental-registration-inspection"
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - scheduled_deferred_actions
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Landlord
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Legal name of the landlord / owning entity"
      - name: email
        type: string
        source: input
        description: "Contact email; login/portal identity"
      - name: phone
        type: string
        source: input
        description: "Contact phone number"
      - name: mailing_address
        type: string
        source: input
        description: "Address of record for official notices"

  - name: Inspector
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Inspector name"
      - name: badge_number
        type: string
        source: input
        description: "Municipal inspector badge id"
      - name: email
        type: string
        source: input
        description: "Inspector contact email"
      - name: certification_level
        type: enum
        source: input
        description: "Inspector certification tier"
        default: "STANDARD"
        constraints: "one of {STANDARD, SENIOR, LEAD_CERTIFIED}"
      - name: active
        type: boolean
        source: input
        description: "Whether the inspector is currently on active duty"
        default: true

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: landlord_id
        type: string
        source: input
        description: "FK -> Landlord.id; the owner responsible for this rental property"
      - name: street_address
        type: string
        source: input
        description: "Full street address of the rental property"
      - name: unit_count
        type: integer
        source: input
        description: "Number of dwelling units; drives the license fee tier"
        constraints: "integer >= 1"
      - name: year_built
        type: integer
        source: input
        description: "Year of original construction; year_built < 1978 triggers lead-paint rules and surcharge"
      - name: registration_status
        type: enum
        source: system
        description: "Lifecycle state of the property registration"
        default: "REGISTERED"
        constraints: "one of {REGISTERED, SUSPENDED, CONDEMNED}"
      - name: current_license_id
        type: string
        source: system
        description: "Denormalized pointer to the most recent RentalLicense.id issued for this property (back-reference, not an FK constraint); null until first license issued"
        default: null
      - name: has_lead_risk
        type: boolean
        source: computed
        description: "Computed: true when year_built < 1978"
      - name: open_violation_count
        type: integer
        source: computed
        description: "Computed count of this property's Violations whose status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}"
      - name: open_critical_violation_count
        type: integer
        source: computed
        description: "Computed count of this property's Violations with severity==CRITICAL and status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}"
      - name: total_penalty_cents
        type: integer
        source: computed
        description: "Computed aggregate penalty; see calculations.property_penalty_total"
      - name: total_fees_paid_cents
        type: integer
        source: system
        description: "Running money ledger of registration/renewal fees paid; incremented on license pay/renew, decremented on refund; starts at 0"
        default: 0

  - name: RentalLicense
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property this license governs"
      - name: license_number
        type: string
        source: system
        description: "System-minted human-readable license number"
      - name: term_years
        type: integer
        source: input
        description: "License term length in years"
        default: 1
        constraints: "integer in {1, 2, 3}"
      - name: status
        type: enum
        source: system
        description: "License lifecycle state"
        default: "PENDING_PAYMENT"
        constraints: "one of {PENDING_PAYMENT, ACTIVE, EXPIRED, SUSPENDED, REVOKED}"
      - name: fee_cents
        type: integer
        source: computed
        description: "Computed license fee; see calculations.license_fee (variant depends on on-time vs late)"
      - name: lead_surcharge_applied
        type: boolean
        source: computed
        description: "Computed: true when the property's year_built < 1978 so the lead surcharge is in fee_cents"
      - name: issued_at
        type: datetime
        source: system
        description: "Timestamp the license became ACTIVE (set on pay/renew); null while PENDING_PAYMENT"
        default: null
      - name: expires_at
        type: datetime
        source: system
        description: "Computed expiry = issued_at + term_years years; set on activation/renewal; null while PENDING_PAYMENT"
        default: null
      - name: renewal_count
        type: integer
        source: system
        description: "Number of times this license has been renewed"
        default: 0

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property the complaint is about"
      - name: tenant_email
        type: string
        source: input
        description: "Contact email of the complaining tenant"
      - name: tenant_unit
        type: string
        source: input
        description: "Unit label within the property"
      - name: category
        type: enum
        source: input
        description: "Nature of the complaint"
        constraints: "one of {LIFE_SAFETY, HABITABILITY, LEAD_PAINT, STRUCTURAL}"
      - name: description
        type: string
        source: input
        description: "Free-text description of the alleged condition"
      - name: severity_alleged
        type: enum
        source: input
        description: "Tenant-alleged severity"
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: status
        type: enum
        source: system
        description: "Complaint lifecycle state"
        default: "FILED"
        constraints: "one of {FILED, INSPECTION_SCHEDULED, RESOLVED}"
      - name: filed_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the complaint was filed"

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property under inspection"
      - name: inspector_id
        type: string
        source: input
        description: "FK -> Inspector.id; the assigned inspector"
      - name: inspection_type
        type: enum
        source: input
        description: "Kind of inspection"
        constraints: "one of {PERIODIC, COMPLAINT, REINSPECTION}"
      - name: complaint_id
        type: string
        source: input
        description: "FK -> Complaint.id; set only for COMPLAINT inspections; null otherwise"
        default: null
      - name: prior_inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the failed inspection this REINSPECTION re-checks; null otherwise (self-referential)"
        default: null
      - name: scheduled_date
        type: datetime
        source: input
        description: "Planned start time of the on-site inspection"
      - name: duration_minutes
        type: integer
        source: input
        description: "Planned duration; used for inspector overlap detection"
        default: 60
      - name: status
        type: enum
        source: system
        description: "Inspection lifecycle state"
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, IN_PROGRESS, PASSED, FAILED}"
      - name: conducted_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the inspection was completed; anchors violation cure deadlines; null until completion"
        default: null
      - name: result_score
        type: number
        source: computed
        description: "Habitability score; see calculations.inspection_result_score (provisional while IN_PROGRESS, final at completion)"
      - name: overdue
        type: boolean
        source: computed
        description: "Computed: true when status==SCHEDULED and the logical clock is past scheduled_date"

  - name: ChecklistItem
    parent: null
    common_fields: false
    fields:
      - name: inspection_id
        type: string
        source: input
        description: "FK -> Inspection.id; the inspection this recorded item belongs to"
      - name: category
        type: enum
        source: input
        description: "Checklist category"
        constraints: "one of {LIFE_SAFETY, HABITABILITY, LEAD_PAINT, STRUCTURAL}"
      - name: code
        type: string
        source: input
        description: "Item code, e.g. SMOKE_DETECTOR, HEAT, PLUMBING, LEAD_HAZARD"
      - name: result
        type: enum
        source: input
        description: "Recorded result"
        constraints: "one of {PASS, FAIL, NOT_APPLICABLE}"
      - name: severity
        type: enum
        source: input
        description: "Severity assigned when result==FAIL"
        default: "MINOR"
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: notes
        type: string
        source: input
        description: "Free-text observations"
        default: null

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - name: inspection_id
        type: string
        source: system
        description: "FK -> Inspection.id; the failed inspection that produced this violation"
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; denormalized owning property"
      - name: checklist_item_id
        type: string
        source: system
        description: "FK -> ChecklistItem.id; the failing checklist item that produced this violation; null for synthetic violations"
        default: null
      - name: code
        type: string
        source: system
        description: "Copied from the originating ChecklistItem.code"
      - name: category
        type: enum
        source: system
        description: "Copied from the originating ChecklistItem.category"
        constraints: "one of {LIFE_SAFETY, HABITABILITY, LEAD_PAINT, STRUCTURAL}"
      - name: severity
        type: enum
        source: system
        description: "Copied from the originating ChecklistItem.severity"
        constraints: "one of {MINOR, MAJOR, CRITICAL}"
      - name: status
        type: enum
        source: system
        description: "Violation lifecycle state"
        default: "OPEN"
        constraints: "one of {OPEN, REMEDIATION_SUBMITTED, ESCALATED, VERIFIED_RESOLVED, CONDEMNED_BASIS}"
      - name: cure_deadline
        type: datetime
        source: computed
        description: "Computed = inspection.conducted_at + CURE_DAYS[severity]; deadline to remediate before penalties accrue"
      - name: penalty_cents
        type: integer
        source: computed
        description: "Computed per-violation penalty; see calculations.violation_penalty"
      - name: remediation_notes
        type: string
        source: input
        description: "Landlord-supplied notes when submitting remediation"
        default: null

  - name: TenantNotice
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property the notice concerns"
      - name: recipient_email
        type: string
        source: input
        description: "Email of the tenant recipient"
      - name: recipient_unit
        type: string
        source: input
        description: "Unit label of the recipient"
      - name: notice_type
        type: enum
        source: input
        description: "Kind of official notice"
        constraints: "one of {LEAD_PAINT_DISCLOSURE, INSPECTION_NOTICE, VIOLATION_NOTICE, CONDEMNATION_NOTICE}"
      - name: status
        type: enum
        source: system
        description: "Notice lifecycle state"
        default: "SENT"
        constraints: "one of {SENT, ACKNOWLEDGED, EXPIRED}"
      - name: sent_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the notice was sent"
      - name: ack_deadline
        type: datetime
        source: computed
        description: "Computed = sent_at + NOTICE_ACK_DAYS (30 days); after this the notice auto-expires"
      - name: acknowledged_at
        type: datetime
        source: system
        description: "Logical-clock timestamp of tenant acknowledgement; null until acknowledged"
        default: null

  - name: CondemnationOrder
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property proposed for condemnation"
      - name: triggering_violation_id
        type: string
        source: input
        description: "FK -> Violation.id; the escalated violation cited as the condemnation basis; null if drafted on aggregate grounds"
        default: null
      - name: basis
        type: string
        source: input
        description: "Written justification for condemnation"
      - name: status
        type: enum
        source: system
        description: "Condemnation order lifecycle state"
        default: "DRAFT"
        constraints: "one of {DRAFT, ISSUED}"
      - name: issued_at
        type: datetime
        source: system
        description: "Logical-clock timestamp the order was issued; null while DRAFT"
        default: null

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Property
    initial_state: REGISTERED
    terminal_states: [CONDEMNED]
    transitions:
      - from: REGISTERED
        to: SUSPENDED
        trigger: "system: a Violation with severity==CRITICAL is opened on this property (fired during Inspection completion cascade)"
        actor: system
        preconditions: ["property.registration_status == REGISTERED"]
        side_effects:
          - "transition the property's non-terminal RentalLicense (status IN {ACTIVE, EXPIRED}) to SUSPENDED"
        note: "Second hop of the inspection-fail cascade; see Inspection IN_PROGRESS->FAILED."
      - from: SUSPENDED
        to: REGISTERED
        trigger: "system: the property's open_critical_violation_count returns to 0 after a Violation resolves (fired during reinspection resolution)"
        actor: system
        preconditions: ["property.registration_status == SUSPENDED", "property.open_critical_violation_count == 0"]
        side_effects:
          - "transition the property's SUSPENDED RentalLicense back to ACTIVE (bubble-up reinstatement)"
      - from: REGISTERED
        to: CONDEMNED
        trigger: "system: a CondemnationOrder for this property transitions DRAFT->ISSUED"
        actor: system
        preconditions: ["property.registration_status IN {REGISTERED, SUSPENDED}"]
        side_effects:
          - "revoke the property's non-terminal RentalLicense (status IN {ACTIVE, EXPIRED, SUSPENDED}) -> REVOKED"
          - "generate one CONDEMNATION_NOTICE TenantNotice (SENT) for the property"
        note: "First hop of the condemnation cascade; the license REVOKED transition then fires the third hop."
      - from: SUSPENDED
        to: CONDEMNED
        trigger: "system: a CondemnationOrder for this property transitions DRAFT->ISSUED"
        actor: system
        preconditions: ["property.registration_status IN {REGISTERED, SUSPENDED}"]
        side_effects:
          - "revoke the property's non-terminal RentalLicense (status IN {ACTIVE, EXPIRED, SUSPENDED}) -> REVOKED"
          - "generate one CONDEMNATION_NOTICE TenantNotice (SENT) for the property"

  - entity: RentalLicense
    initial_state: PENDING_PAYMENT
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_PAYMENT
        to: ACTIVE
        trigger: "POST /rental-licenses/{id}/pay"
        actor: Landlord
        preconditions:
          - "license.status == PENDING_PAYMENT"
          - "property.open_critical_violation_count == 0 (business_safety)"
          - "the property has at least one Inspection with inspection_type==PERIODIC and status==PASSED (cross-entity)"
          - "payload.amount_cents == license.fee_cents (business_fiscal)"
        side_effects:
          - "set issued_at = clock now"
          - "set expires_at = issued_at + term_years years"
          - "increment Property.total_fees_paid_cents by fee_cents"
          - "set Property.current_license_id = this license id"
          - "increment Property.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: the logical clock reaches expires_at (evaluated lazily on next read or write touching this license)"
        actor: system
        preconditions: ["clock now >= expires_at"]
        side_effects: []
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /rental-licenses/{id}/renew"
        actor: Landlord
        preconditions:
          - "license.status IN {ACTIVE, EXPIRED}"
          - "payload.expected_license_version matches current license.version (OCC)"
          - "property.open_critical_violation_count == 0 (business_safety)"
        side_effects:
          - "recompute fee_cents using the late variant (see calculations.license_fee)"
          - "set issued_at = clock now; set expires_at = issued_at + term_years years"
          - "increment renewal_count by 1"
          - "increment Property.total_fees_paid_cents by the new fee_cents"
          - "increment RentalLicense.version by 1"
        note: "Cycle A: ACTIVE->EXPIRED->ACTIVE. Renewal from EXPIRED uses the late fee variant."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /rental-licenses/{id}/renew"
        actor: Landlord
        preconditions:
          - "license.status IN {ACTIVE, EXPIRED}"
          - "payload.expected_license_version matches current license.version (OCC)"
          - "property.open_critical_violation_count == 0 (business_safety)"
        side_effects:
          - "recompute fee_cents using the on_time variant (see calculations.license_fee)"
          - "set issued_at = clock now; set expires_at = issued_at + term_years years"
          - "increment renewal_count by 1"
          - "increment Property.total_fees_paid_cents by the new fee_cents"
          - "increment RentalLicense.version by 1"
        note: "On-time renewal self-loop; a strictly-sequential second renew with a stale expected_license_version fails OCC."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system: the owning Property transitions REGISTERED->SUSPENDED"
        actor: system
        preconditions: ["license.status == ACTIVE"]
        side_effects: []
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system: the owning Property transitions SUSPENDED->REGISTERED"
        actor: system
        preconditions: ["license.status == SUSPENDED"]
        side_effects: []
      - from: ACTIVE
        to: PENDING_PAYMENT
        trigger: "POST /rental-licenses/{id}/refund"
        actor: Registrar
        preconditions: ["license.status == ACTIVE"]
        side_effects:
          - "decrement Property.total_fees_paid_cents by the most recently paid fee_cents (compensation)"
          - "clear issued_at and expires_at"
          - "clear Property.current_license_id if it equals this license id"
        note: "Compensating action for pay; restores the money ledger to its pre-pay value."
      - from: ACTIVE
        to: REVOKED
        trigger: "system: a CondemnationOrder for the property transitions DRAFT->ISSUED (fired via Property->CONDEMNED)"
        actor: system
        preconditions: ["license.status IN {ACTIVE, EXPIRED, SUSPENDED}"]
        side_effects:
          - "transition every non-terminal Violation of the property (status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}) to CONDEMNED_BASIS"
        note: "Third hop of the condemnation cascade; caused by the license revocation itself."
      - from: EXPIRED
        to: REVOKED
        trigger: "system: a CondemnationOrder for the property transitions DRAFT->ISSUED (fired via Property->CONDEMNED)"
        actor: system
        preconditions: ["license.status IN {ACTIVE, EXPIRED, SUSPENDED}"]
        side_effects:
          - "transition every non-terminal Violation of the property (status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}) to CONDEMNED_BASIS"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system: a CondemnationOrder for the property transitions DRAFT->ISSUED (fired via Property->CONDEMNED)"
        actor: system
        preconditions: ["license.status IN {ACTIVE, EXPIRED, SUSPENDED}"]
        side_effects:
          - "transition every non-terminal Violation of the property (status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}) to CONDEMNED_BASIS"

  - entity: Inspection
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /inspections/{id}/begin"
        actor: Inspector
        preconditions:
          - "inspection.status == SCHEDULED"
          - "property.registration_status == REGISTERED (cross-entity)"
          - "X-User-ID equals inspection.inspector_id (ownership)"
        side_effects: []
      - from: IN_PROGRESS
        to: PASSED
        trigger: "POST /inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "inspection.status == IN_PROGRESS"
          - "the final inspection_result_score PASS condition holds: final score < PASS_THRESHOLD AND no CRITICAL FAIL item AND every mandatory category (LIFE_SAFETY, HABITABILITY) has >= 1 recorded ChecklistItem"
        side_effects:
          - "set conducted_at = clock now"
          - "finalize result_score using the final variant"
          - "if inspection_type==COMPLAINT: transition the linked Complaint INSPECTION_SCHEDULED->RESOLVED"
          - "if inspection_type==REINSPECTION: run reinspection reconciliation (see note) against the prior inspection's Violations"
        note: "Reinspection reconciliation (fires on completion regardless of PASS/FAIL): for each Violation of prior_inspection_id currently in {OPEN, REMEDIATION_SUBMITTED, ESCALATED}, look up this reinspection's ChecklistItem with the same code: if that item.result==PASS transition the violation ->VERIFIED_RESOLVED (decrement open_violation_count, bubble Property back if it was the last CRITICAL); if item.result==FAIL and the violation is REMEDIATION_SUBMITTED transition it ->OPEN (revert); if the code is not recorded, leave unchanged. A REINSPECTION never mints new Violations."
      - from: IN_PROGRESS
        to: FAILED
        trigger: "POST /inspections/{id}/complete"
        actor: Inspector
        preconditions:
          - "inspection.status == IN_PROGRESS"
          - "the final inspection_result_score PASS condition does NOT hold"
        side_effects:
          - "set conducted_at = clock now"
          - "finalize result_score using the final variant"
          - "if inspection_type IN {PERIODIC, COMPLAINT}: for each ChecklistItem with result==FAIL create a Violation(status=OPEN) copying code/category/severity, setting cure_deadline = conducted_at + CURE_DAYS[severity]"
          - "increment Property.open_violation_count by the number of created Violations"
          - "each newly OPEN Violation with severity==CRITICAL triggers Property REGISTERED->SUSPENDED"
          - "if inspection_type==REINSPECTION: run the same reinspection reconciliation as the PASSED branch (no new Violations are minted)"
        note: "Cascade root (depth 2): a PERIODIC/COMPLAINT failure creates Violations, then each CRITICAL Violation drives Property suspension. A REINSPECTION failure only reconciles prior Violations."

  - entity: Violation
    initial_state: OPEN
    terminal_states: [VERIFIED_RESOLVED, CONDEMNED_BASIS]
    transitions:
      - from: OPEN
        to: REMEDIATION_SUBMITTED
        trigger: "POST /violations/{id}/submit-remediation"
        actor: Landlord
        preconditions:
          - "violation.status == OPEN"
          - "X-User-ID equals the property's landlord_id (ownership)"
        side_effects:
          - "set remediation_notes from payload"
      - from: REMEDIATION_SUBMITTED
        to: VERIFIED_RESOLVED
        trigger: "system: a REINSPECTION Inspection completes and this violation's checklist code now PASSES"
        actor: system
        preconditions: ["violation.status == REMEDIATION_SUBMITTED"]
        side_effects:
          - "decrement Property.open_violation_count by 1"
          - "if this was the last CRITICAL open violation, bubble Property SUSPENDED->REGISTERED"
        note: "Compensating resolution: restores open_violation_count to its pre-issue value."
      - from: REMEDIATION_SUBMITTED
        to: OPEN
        trigger: "system: a REINSPECTION Inspection completes and this violation's checklist code still FAILS"
        actor: system
        preconditions: ["violation.status == REMEDIATION_SUBMITTED"]
        side_effects: []
        note: "Cycle B: OPEN->REMEDIATION_SUBMITTED->OPEN revision loop."
      - from: OPEN
        to: ESCALATED
        trigger: "POST /violations/{id}/escalate"
        actor: Registrar
        preconditions:
          - "violation.status == OPEN"
          - "violation.severity == CRITICAL"
          - "property.open_critical_violation_count >= ESCALATION_CRITICAL_COUNT (boundary)"
        side_effects:
          - "generate one VIOLATION_NOTICE TenantNotice (SENT) for the property"
      - from: ESCALATED
        to: VERIFIED_RESOLVED
        trigger: "system: a REINSPECTION Inspection completes and this violation's checklist code now PASSES"
        actor: system
        preconditions: ["violation.status == ESCALATED"]
        side_effects:
          - "decrement Property.open_violation_count by 1"
          - "if this was the last CRITICAL open violation, bubble Property SUSPENDED->REGISTERED"
      - from: OPEN
        to: CONDEMNED_BASIS
        trigger: "system: the property's RentalLicense transitions to REVOKED during condemnation"
        actor: system
        preconditions: ["violation.status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}"]
        side_effects: []
      - from: REMEDIATION_SUBMITTED
        to: CONDEMNED_BASIS
        trigger: "system: the property's RentalLicense transitions to REVOKED during condemnation"
        actor: system
        preconditions: ["violation.status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}"]
        side_effects: []
      - from: ESCALATED
        to: CONDEMNED_BASIS
        trigger: "system: the property's RentalLicense transitions to REVOKED during condemnation"
        actor: system
        preconditions: ["violation.status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}"]
        side_effects: []

  - entity: Complaint
    initial_state: FILED
    terminal_states: [RESOLVED]
    transitions:
      - from: FILED
        to: INSPECTION_SCHEDULED
        trigger: "POST /inspections with inspection_type==COMPLAINT and complaint_id set"
        actor: Inspector
        preconditions: ["complaint.status == FILED"]
        side_effects:
          - "the created Inspection carries complaint_id = this complaint id"
      - from: INSPECTION_SCHEDULED
        to: RESOLVED
        trigger: "system: the linked COMPLAINT Inspection completes PASSED"
        actor: system
        preconditions: ["complaint.status == INSPECTION_SCHEDULED"]
        side_effects: []

  - entity: TenantNotice
    initial_state: SENT
    terminal_states: [ACKNOWLEDGED, EXPIRED]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /tenant-notices/{id}/acknowledge"
        actor: Tenant
        preconditions:
          - "notice.status == SENT"
          - "clock now <= ack_deadline (business_temporal)"
        side_effects:
          - "set acknowledged_at = clock now"
      - from: SENT
        to: EXPIRED
        trigger: "system: the logical clock passes ack_deadline (evaluated lazily on next read or acknowledge attempt)"
        actor: system
        preconditions: ["clock now > ack_deadline"]
        side_effects: []

  - entity: CondemnationOrder
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /condemnation-orders/{id}/issue"
        actor: Registrar
        preconditions:
          - "order.status == DRAFT"
          - "the property has >= 1 Violation with status==ESCALATED (business_referential)"
        side_effects:
          - "set issued_at = clock now"
          - "transition Property (REGISTERED or SUSPENDED)->CONDEMNED"
        note: "Cascade root (depth 3): Order->Property->License->Violations."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC-resolved true races)
# =============================================================================
concurrency_rules:
  - rule_id: license-create-stale-property
    parent_entity: Property
    write_endpoint: "POST /rental-licenses"
    occ_field: "expected_property_version"
    description: |
      Issuing a RentalLicense against a Property whose version has advanced
      since the client last observed it is rejected. A newly issued license
      legitimately supersedes the property's prior current_license_id and
      bumps Property.version; a create still carrying the pre-supersede
      property version is therefore working from a stale view and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: license-renew-stale-license
    parent_entity: RentalLicense
    write_endpoint: "POST /rental-licenses/{id}/renew"
    occ_field: "expected_license_version"
    description: |
      Renewing a RentalLicense whose version has advanced since the client
      last observed it is rejected. A prior renewal (or a cascaded suspension)
      advances RentalLicense.version; a renew still carrying the earlier
      version is stale and refused with 412.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: inspection_result_score
    trigger: "Read on GET /inspections/{id} while IN_PROGRESS (provisional); finalized on POST /inspections/{id}/complete (final)"
    algorithm: weighted_scoring
    formula: |
      SEVERITY_WEIGHT = {MINOR:1, MAJOR:3, CRITICAL:10}
      CATEGORY_MULT   = {LIFE_SAFETY:2.0, HABITABILITY:1.0, LEAD_PAINT:1.5, STRUCTURAL:1.5}
      base = sum over ChecklistItems of this inspection where result==FAIL of
             ( SEVERITY_WEIGHT[item.severity] * CATEGORY_MULT[item.category] )
      # final variant only: charge a synthetic CRITICAL FAIL for each mandatory
      # category that has zero recorded items
      synthetic = 0
      for cat in MANDATORY_CATEGORIES:
          if count(items in this inspection with category==cat) == 0:
              synthetic += SEVERITY_WEIGHT[CRITICAL] * CATEGORY_MULT[cat]
      score = base (+ synthetic in the final variant)
      PASS iff score < PASS_THRESHOLD AND no recorded CRITICAL FAIL item AND
      (final only) every mandatory category has >= 1 recorded item
    input_set: "ChecklistItems belonging to this inspection; only result==FAIL items contribute to base"
    constants:
      PASS_THRESHOLD: 5.0
      MANDATORY_CATEGORIES: [LIFE_SAFETY, HABITABILITY]
    precision: "1 decimal place, round_half_up"
    variants:
      - name: provisional
        when: "inspection.status == IN_PROGRESS (read before completion)"
        difference: "counts only items recorded so far; ignores mandatory-category completeness; no synthetic penalty"
      - name: final
        when: "computed at POST /inspections/{id}/complete"
        difference: "adds a synthetic CRITICAL FAIL for each mandatory category with zero recorded items, which can flip a provisional PASS into a final FAIL"

  - name: license_fee
    trigger: "Computed on POST /rental-licenses (registration) and POST /rental-licenses/{id}/renew"
    algorithm: tiered_pricing
    formula: |
      # tier base per year selected by property.unit_count
      if unit_count == 1:          tier_base = TIER_1_CENTS
      elif 2 <= unit_count <= 4:   tier_base = TIER_2_CENTS
      elif 5 <= unit_count <= 20:  tier_base = TIER_3_CENTS
      else:                        tier_base = TIER_4_CENTS
      lead = LEAD_SURCHARGE_CENTS if property.year_built < LEAD_YEAR else 0
      annual = tier_base + lead
      base_fee = annual * term_years
      # variant selection:
      #   on_time  -> fee = base_fee
      #   late     -> fee = round_half_up(base_fee * LATE_MULTIPLIER) + REINSTATEMENT_FEE_CENTS
    input_set: "property.unit_count, property.year_built, license.term_years, and renewal timing relative to expires_at"
    constants:
      TIER_1_CENTS: 15000
      TIER_2_CENTS: 30000
      TIER_3_CENTS: 60000
      TIER_4_CENTS: 120000
      LEAD_SURCHARGE_CENTS: 5000
      LEAD_YEAR: 1978
      LATE_MULTIPLIER: 1.5
      REINSTATEMENT_FEE_CENTS: 10000
    precision: "integer cents, round_half_up"
    variants:
      - name: on_time
        when: "registration, or renewal where clock now <= expires_at"
        difference: "fee = base_fee with no late multiplier or reinstatement fee"
      - name: late
        when: "renewal where clock now > expires_at"
        difference: "fee = round_half_up(base_fee * 1.5) + 10000; same inputs yield a strictly larger fee than on_time"

  - name: violation_penalty
    trigger: "Computed on read of a Violation (GET /violations/{id}, GET /violations, GET /properties/{id})"
    algorithm: threshold
    formula: |
      CURE_DAYS      = {MINOR:30, MAJOR:14, CRITICAL:3}
      DAILY_CENTS    = {MINOR:1000, MAJOR:2500, CRITICAL:10000}
      MAX_RAW_CENTS  = {MINOR:30000, MAJOR:75000, CRITICAL:300000}
      cure_deadline = inspection.conducted_at + CURE_DAYS[severity] days
      if clock now <= cure_deadline:
          penalty_cents = 0
      else:
          days_overdue = ceil( (clock now - cure_deadline) / 1 day )   # partial day rounds up
          raw = min( DAILY_CENTS[severity] * days_overdue, MAX_RAW_CENTS[severity] )
          penalty_cents = round_half_up( raw * (1 + ADMIN_FEE_RATE) )   # per-violation rounding
    input_set: "single Violation; only accrues while status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}; VERIFIED_RESOLVED and CONDEMNED_BASIS accrue 0"
    constants:
      ADMIN_FEE_RATE: 0.075
    precision: "integer cents, round_half_up per violation"
    variants:
      - name: within_cure
        when: "clock now <= cure_deadline"
        difference: "penalty is exactly 0 (boundary: 0 at cure_deadline, positive strictly after)"
      - name: overdue
        when: "clock now > cure_deadline"
        difference: "accrues DAILY_CENTS per whole overdue day (ceiling), capped, then a 7.5% admin fee is applied and rounded"

  - name: property_penalty_total
    trigger: "Computed on GET /properties/{id} as Property.total_penalty_cents"
    algorithm: aggregation
    formula: |
      # each violation_penalty is already rounded to whole cents PER VIOLATION;
      # the property total sums those pre-rounded integers.
      total_penalty_cents = sum over Violations v of this property
          where v.status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}
          of violation_penalty(v)      # pinned order: round per-violation, THEN sum
    input_set: "Violations of the property whose status IN {OPEN, REMEDIATION_SUBMITTED, ESCALATED}, ordered by created_at ASC for deterministic accumulation"
    constants: {}
    precision: "integer cents; rounding happens per violation before summation (NOT sum-then-round)"
    variants:
      - name: per_violation_then_sum
        when: "always (pinned)"
        difference: "round each violation_penalty to whole cents first, then sum; e.g. two MAJOR violations each raw 2687.5 give 2688+2688=5376, not round(5375.0)=5375"

  - name: property_escalation_index
    trigger: "Evaluated as a precondition on POST /violations/{id}/escalate"
    algorithm: aggregation
    formula: |
      escalation_index = count over Violations v of this property
          where v.severity == CRITICAL AND v.status IN {OPEN, REMEDIATION_SUBMITTED}
      eligible_to_escalate iff escalation_index >= ESCALATION_CRITICAL_COUNT
    input_set: "Violations of the property with severity==CRITICAL and status IN {OPEN, REMEDIATION_SUBMITTED}"
    constants:
      ESCALATION_CRITICAL_COUNT: 2
    precision: "integer count"
    variants:
      - name: threshold_gate
        when: "always"
        difference: "boundary at >= 2: exactly 1 critical open violation is NOT eligible; 2 is eligible"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per the §1.7 RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "for entity_backed ownership-scoped operations, X-User-ID equals the owning entity id (Landlord owns Property; Inspector assigned to Inspection)"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: "POST /properties, POST /rental-licenses/{id}/pay, POST /rental-licenses/{id}/renew, POST /violations/{id}/submit-remediation, POST /inspections/{id}/begin, POST /inspections/{id}/complete, POST /inspections/{id}/checklist-items"
  - priority: 4
    category: existence
    check: "the path resource exists (validated left-to-right)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path id"
  - priority: 5
    category: existence
    check: "referenced foreign keys in the request body exist (property_id, inspector_id, complaint_id, prior_inspection_id, triggering_violation_id)"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "POST /properties, POST /rental-licenses, POST /inspections, POST /complaints, POST /tenant-notices, POST /condemnation-orders"
  - priority: 6
    category: business_constraint
    check: "required fields present, enums valid, unit_count>=1, term_years in {1,2,3}, duration_minutes>0"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST create endpoints"
  - priority: 7
    category: state
    check: "the target resource is in a state from which this transition is allowed (e.g. reinspection prior_inspection must be FAILED; violation OPEN to escalate; license PENDING_PAYMENT to pay)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 8
    category: business_referential
    check: "begin inspection requires the property.registration_status == REGISTERED"
    error_id: ERR_PROPERTY_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /inspections/{id}/begin"
  - priority: 9
    category: business_referential
    check: "pay (activate) requires the property to have >= 1 PERIODIC Inspection with status==PASSED"
    error_id: ERR_NO_PASSED_INSPECTION
    http_status: 409
    applies_to: "POST /rental-licenses/{id}/pay"
  - priority: 10
    category: business_safety
    check: "license pay/renew is blocked while property.open_critical_violation_count > 0"
    error_id: ERR_UNSAFE_HABITABILITY
    http_status: 409
    applies_to: "POST /rental-licenses/{id}/pay, POST /rental-licenses/{id}/renew"
  - priority: 11
    category: business_constraint
    check: "escalate requires the violation.severity==CRITICAL and property.open_critical_violation_count >= 2 (escalation threshold)"
    error_id: ERR_ESCALATION_THRESHOLD_NOT_MET
    http_status: 409
    applies_to: "POST /violations/{id}/escalate"
  - priority: 12
    category: business_referential
    check: "issue condemnation requires the property to have >= 1 Violation with status==ESCALATED"
    error_id: ERR_NO_CONDEMNATION_BASIS
    http_status: 409
    applies_to: "POST /condemnation-orders/{id}/issue"
  - priority: 13
    category: business_constraint
    check: "scheduling an inspection is rejected if the assigned inspector already has an inspection whose [scheduled_date, scheduled_date+duration) half-open interval overlaps this one (adjacency allowed)"
    error_id: ERR_INSPECTOR_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /inspections"
  - priority: 14
    category: business_constraint
    check: "scheduling an inspection is rejected if the same property has another non-terminal inspection whose scheduled_date is within COOLDOWN_HOURS (24h) of this one (closed buffer window)"
    error_id: ERR_INSPECTION_COOLDOWN
    http_status: 409
    applies_to: "POST /inspections"
  - priority: 15
    category: business_temporal
    check: "a REINSPECTION scheduled_date must be at or after the prior inspection's conducted_at + REINSPECTION_MIN_HOURS (48h)"
    error_id: ERR_REINSPECTION_TOO_EARLY
    http_status: 422
    applies_to: "POST /inspections"
  - priority: 16
    category: business_temporal
    check: "acknowledging a TenantNotice requires clock now <= ack_deadline (else it is EXPIRED)"
    error_id: ERR_NOTICE_EXPIRED
    http_status: 409
    applies_to: "POST /tenant-notices/{id}/acknowledge"
  - priority: 17
    category: business_fiscal
    check: "license pay requires payload.amount_cents == license.fee_cents"
    error_id: ERR_FEE_MISMATCH
    http_status: 402
    applies_to: "POST /rental-licenses/{id}/pay"
  - priority: 18
    category: business_constraint
    check: "OCC: expected_property_version / expected_license_version must match the current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /rental-licenses, POST /rental-licenses/{id}/renew"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/landlords"
    description: "Register a landlord"
    roles: [Registrar]
    code: 201
    input: [full_name, email, phone, mailing_address]
    output: Landlord
    side_effects: []
  - method: POST
    path: "/inspectors"
    description: "Register an inspector"
    roles: [Registrar]
    code: 201
    input: [full_name, badge_number, email, "certification_level?", "active?"]
    output: Inspector
    side_effects: []

  - method: POST
    path: "/properties"
    description: "Register a rental property; created REGISTERED"
    roles: [Landlord, Registrar]
    code: 201
    input: [landlord_id, street_address, unit_count, year_built]
    output: Property
    side_effects: ["compute has_lead_risk from year_built", "initialize total_fees_paid_cents=0"]
  - method: GET
    path: "/properties/{id}"
    description: "Fetch a property including computed compliance fields (open_violation_count, open_critical_violation_count, total_penalty_cents, has_lead_risk)"
    roles: [Landlord, Registrar, Inspector]
    code: 200
    output: Property
    side_effects: ["lazily expire any due licenses touched"]
  - method: GET
    path: "/properties"
    description: "List properties; landlord portal filters by landlord_id"
    roles: [Landlord, Registrar]
    code: 200
    input: ["landlord_id?", "registration_status?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: GET
    path: "/properties/{id}/rental-licenses"
    description: "List the licenses issued for a property (reverse-reachability for RentalLicense.property_id)"
    roles: [Landlord, Registrar]
    code: 200
    input: ["limit?", "offset?"]
    output: RentalLicense[]
    side_effects: []
  - method: GET
    path: "/properties/{id}/complaints"
    description: "List complaints filed against a property (reverse-reachability for Complaint.property_id)"
    roles: [Registrar, Landlord]
    code: 200
    input: ["limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: GET
    path: "/properties/{id}/tenant-notices"
    description: "List tenant notices for a property (reverse-reachability for TenantNotice.property_id)"
    roles: [Registrar, Landlord]
    code: 200
    input: ["limit?", "offset?"]
    output: TenantNotice[]
    side_effects: []

  - method: POST
    path: "/rental-licenses"
    description: "Issue a license for a property (PENDING_PAYMENT). OCC-guarded on the property version; a new license supersedes the prior current_license_id."
    roles: [Registrar]
    code: 201
    input: [property_id, "term_years?", expected_property_version]
    output: RentalLicense
    side_effects: ["compute fee_cents (on_time variant)", "set license_number", "increments Property.version by 1", "set Property.current_license_id = new license id"]
  - method: POST
    path: "/rental-licenses/{id}/pay"
    description: "Pay the license fee to activate (PENDING_PAYMENT->ACTIVE)"
    roles: [Landlord]
    code: 200
    input: [amount_cents]
    output: RentalLicense
    side_effects: ["set issued_at/expires_at", "increment Property.total_fees_paid_cents by fee_cents", "increment Property.version by 1"]
  - method: POST
    path: "/rental-licenses/{id}/renew"
    description: "Renew a license (ACTIVE or EXPIRED -> ACTIVE). OCC-guarded on the license version. Late renewals use the late fee variant."
    roles: [Landlord, Registrar]
    code: 200
    input: [expected_license_version]
    output: RentalLicense
    side_effects: ["recompute fee_cents (on_time or late variant)", "set issued_at/expires_at", "increment renewal_count", "increment Property.total_fees_paid_cents", "increments RentalLicense.version by 1"]
  - method: POST
    path: "/rental-licenses/{id}/refund"
    description: "Refund the most recent paid fee and revert to PENDING_PAYMENT (compensation)"
    roles: [Registrar]
    code: 200
    input: []
    output: RentalLicense
    side_effects: ["decrement Property.total_fees_paid_cents by the refunded fee_cents", "clear issued_at/expires_at", "clear Property.current_license_id"]

  - method: POST
    path: "/complaints"
    description: "A tenant files a habitability complaint"
    roles: [Tenant]
    code: 201
    input: [property_id, tenant_email, tenant_unit, category, description, severity_alleged]
    output: Complaint
    side_effects: ["set filed_at = clock now"]

  - method: POST
    path: "/inspections"
    description: "Schedule an inspection (PERIODIC, COMPLAINT with complaint_id, or REINSPECTION with prior_inspection_id)"
    roles: [Inspector, Registrar]
    code: 201
    input: [property_id, inspector_id, inspection_type, scheduled_date, "duration_minutes?", "complaint_id?", "prior_inspection_id?"]
    output: Inspection
    side_effects: ["for COMPLAINT: transition linked Complaint FILED->INSPECTION_SCHEDULED"]
  - method: GET
    path: "/inspections/{id}"
    description: "Fetch an inspection; result_score is provisional while IN_PROGRESS"
    roles: [Inspector, Registrar, Landlord]
    code: 200
    output: Inspection
    side_effects: []
  - method: GET
    path: "/inspections"
    description: "List inspections filtered by property/inspector/complaint/prior inspection (reverse-reachability for those FKs)"
    roles: [Inspector, Registrar, Landlord]
    code: 200
    input: ["property_id?", "inspector_id?", "complaint_id?", "prior_inspection_id?", "status?", "limit?", "offset?"]
    output: Inspection[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/begin"
    description: "Inspector begins the on-site inspection (SCHEDULED->IN_PROGRESS)"
    roles: [Inspector]
    code: 200
    output: Inspection
    side_effects: []
  - method: POST
    path: "/inspections/{id}/checklist-items"
    description: "Record a life-safety/habitability checklist item (only while IN_PROGRESS)"
    roles: [Inspector]
    code: 201
    input: [category, code, result, "severity?", "notes?"]
    output: ChecklistItem
    side_effects: ["update provisional result_score"]
  - method: GET
    path: "/inspections/{id}/checklist-items"
    description: "List the recorded checklist items of an inspection (reverse-reachability for ChecklistItem.inspection_id)"
    roles: [Inspector, Registrar, Landlord]
    code: 200
    input: ["limit?", "offset?"]
    output: ChecklistItem[]
    side_effects: []
  - method: POST
    path: "/inspections/{id}/complete"
    description: "Complete the inspection (IN_PROGRESS->PASSED/FAILED); FAILED spawns Violations and cascades"
    roles: [Inspector]
    code: 200
    output: Inspection
    side_effects: ["finalize result_score", "set conducted_at", "on FAIL create Violations and cascade Property suspension", "on PASS resolve complaint / reinspection violations"]

  - method: GET
    path: "/violations/{id}"
    description: "Fetch a violation including computed cure_deadline and penalty_cents"
    roles: [Registrar, Landlord, Inspector]
    code: 200
    output: Violation
    side_effects: []
  - method: GET
    path: "/violations"
    description: "List violations filtered by property/inspection/checklist item (reverse-reachability for those FKs)"
    roles: [Registrar, Landlord, Inspector]
    code: 200
    input: ["property_id?", "inspection_id?", "checklist_item_id?", "status?", "limit?", "offset?"]
    output: Violation[]
    side_effects: []
  - method: POST
    path: "/violations/{id}/submit-remediation"
    description: "Landlord submits remediation for an OPEN violation (OPEN->REMEDIATION_SUBMITTED)"
    roles: [Landlord]
    code: 200
    input: ["remediation_notes?"]
    output: Violation
    side_effects: []
  - method: POST
    path: "/violations/{id}/escalate"
    description: "Registrar escalates a CRITICAL violation once the property crosses the escalation threshold (OPEN->ESCALATED)"
    roles: [Registrar]
    code: 200
    output: Violation
    side_effects: ["generate a VIOLATION_NOTICE TenantNotice"]

  - method: POST
    path: "/tenant-notices"
    description: "Issue a tenant notice (lead-paint disclosure, inspection notice, etc.); created SENT"
    roles: [Registrar]
    code: 201
    input: [property_id, recipient_email, recipient_unit, notice_type]
    output: TenantNotice
    side_effects: ["set sent_at = clock now", "compute ack_deadline = sent_at + NOTICE_ACK_DAYS"]
  - method: POST
    path: "/tenant-notices/{id}/acknowledge"
    description: "Tenant acknowledges a notice before its ack_deadline (SENT->ACKNOWLEDGED)"
    roles: [Tenant]
    code: 200
    output: TenantNotice
    side_effects: ["set acknowledged_at = clock now"]

  - method: POST
    path: "/condemnation-orders"
    description: "Registrar drafts a condemnation order (DRAFT)"
    roles: [Registrar]
    code: 201
    input: [property_id, basis, "triggering_violation_id?"]
    output: CondemnationOrder
    side_effects: []
  - method: GET
    path: "/condemnation-orders/{id}"
    description: "Fetch a condemnation order"
    roles: [Registrar, Landlord]
    code: 200
    output: CondemnationOrder
    side_effects: []
  - method: GET
    path: "/condemnation-orders"
    description: "List condemnation orders filtered by property / triggering violation (reverse-reachability for those FKs)"
    roles: [Registrar, Landlord]
    code: 200
    input: ["property_id?", "triggering_violation_id?", "status?", "limit?", "offset?"]
    output: CondemnationOrder[]
    side_effects: []
  - method: POST
    path: "/condemnation-orders/{id}/issue"
    description: "Registrar issues the condemnation order (DRAFT->ISSUED); triggers the depth-3 condemnation cascade"
    roles: [Registrar]
    code: 200
    output: CondemnationOrder
    side_effects: ["Property->CONDEMNED", "License->REVOKED", "non-terminal Violations->CONDEMNED_BASIS", "generate CONDEMNATION_NOTICE TenantNotice"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [Registrar]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["advance the logical clock; lazily expire licenses/notices whose deadlines have passed on next access"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing/invalid X-User-Role or X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role may not perform this operation"
  - id: ERR_FORBIDDEN_OWNERSHIP
    http: 403
    condition: "an entity_backed actor is not the owner of the target resource"
  - id: ERR_VALIDATION
    http: 422
    condition: "missing required field, bad enum, or out-of-range numeric input"
  - id: ERR_LANDLORD_NOT_FOUND
    http: 404
    condition: "referenced landlord id does not exist"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "referenced property id does not exist"
  - id: ERR_LICENSE_NOT_FOUND
    http: 404
    condition: "referenced license id does not exist"
  - id: ERR_INSPECTOR_NOT_FOUND
    http: 404
    condition: "referenced inspector id does not exist"
  - id: ERR_INSPECTION_NOT_FOUND
    http: 404
    condition: "referenced inspection id (path or prior_inspection_id) does not exist"
  - id: ERR_VIOLATION_NOT_FOUND
    http: 404
    condition: "referenced violation id (path or triggering_violation_id) does not exist"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "referenced complaint id does not exist"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "referenced tenant notice id does not exist"
  - id: ERR_CONDEMNATION_NOT_FOUND
    http: 404
    condition: "referenced condemnation order id does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state from which this transition is allowed"
  - id: ERR_PROPERTY_NOT_REGISTERED
    http: 409
    condition: "beginning an inspection requires the property to be REGISTERED"
  - id: ERR_NO_PASSED_INSPECTION
    http: 409
    condition: "activating a license requires >= 1 PASSED PERIODIC inspection on the property"
  - id: ERR_UNSAFE_HABITABILITY
    http: 409
    condition: "license pay/renew blocked while the property has open CRITICAL violations"
  - id: ERR_ESCALATION_THRESHOLD_NOT_MET
    http: 409
    condition: "escalate requires a CRITICAL violation and open_critical_violation_count >= 2"
  - id: ERR_NO_CONDEMNATION_BASIS
    http: 409
    condition: "issuing condemnation requires >= 1 ESCALATED violation on the property"
  - id: ERR_INSPECTOR_DOUBLE_BOOKED
    http: 409
    condition: "the assigned inspector has an overlapping inspection interval"
  - id: ERR_INSPECTION_COOLDOWN
    http: 409
    condition: "another non-terminal inspection on the property falls within the 24h cooldown buffer"
  - id: ERR_REINSPECTION_TOO_EARLY
    http: 422
    condition: "a reinspection is scheduled before prior.conducted_at + 48h"
  - id: ERR_NOTICE_EXPIRED
    http: 409
    condition: "acknowledging a tenant notice after its ack_deadline"
  - id: ERR_FEE_MISMATCH
    http: 402
    condition: "license pay amount_cents does not equal fee_cents"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "OCC expected_property_version / expected_license_version does not match the current parent version"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Landlord
    description: "Property owner; registers properties, pays/renews licenses, submits remediation, uses the landlord portal"
    identity: "entity_backed:Landlord"
    exclusive_operations:
      - "POST /properties"
      - "POST /rental-licenses/{id}/pay"
      - "POST /violations/{id}/submit-remediation"
    shared_operations:
      - "POST /rental-licenses/{id}/renew (with Registrar)"
      - "GET /properties, GET /properties/{id} and its sub-resources (own properties)"
      - "GET /inspections, GET /violations"
  - name: Inspector
    description: "Municipal inspector; conducts inspections and records checklist results"
    identity: "entity_backed:Inspector"
    exclusive_operations:
      - "POST /inspections/{id}/begin"
      - "POST /inspections/{id}/checklist-items"
      - "POST /inspections/{id}/complete"
    shared_operations:
      - "POST /inspections (schedule, with Registrar)"
      - "GET /inspections, GET /violations, GET /properties/{id}"
  - name: Registrar
    description: "Housing registrar/official; issues licenses, escalates violations, issues condemnation, sends notices, manages the clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /landlords"
      - "POST /inspectors"
      - "POST /rental-licenses"
      - "POST /rental-licenses/{id}/refund"
      - "POST /violations/{id}/escalate"
      - "POST /tenant-notices"
      - "POST /condemnation-orders"
      - "POST /condemnation-orders/{id}/issue"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /inspections (schedule, with Inspector)"
      - "POST /rental-licenses/{id}/renew (with Landlord)"
      - "GET endpoints"
  - name: Tenant
    description: "Rental tenant; files complaints and acknowledges official notices"
    identity: "opaque"
    exclusive_operations:
      - "POST /complaints"
      - "POST /tenant-notices/{id}/acknowledge"
    shared_operations: []


