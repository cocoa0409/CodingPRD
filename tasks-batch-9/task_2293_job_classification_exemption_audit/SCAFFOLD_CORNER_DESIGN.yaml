  # ===========================================================================
  - section: validations
    instances:

      - name: duplicate_family_code_inside_one_project_is_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors[ERR_DUPLICATE_CODE]"]
        distinguishing_aspect: "The uniqueness rule is scoped to audit_project_id, and its violation must surface as ERR_DUPLICATE_CODE at 409 - not as a generic 400 - and must leave the first family untouched."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; one AuditProject in PLANNING holding one JobFamily with code OPS-LEAD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { fam_id: $.data.id }
          trigger:
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Leadership Duplicate", code: "OPS-LEAD" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          assert:
            - "response status is 409 with error_id ERR_DUPLICATE_CODE"
            - "JobFamily.${fam_id}.name == Operations Leadership (the original is not overwritten)"
            - "GET /audit-projects/${proj_id}/job-families returns exactly 1 row"

      - name: the_same_family_code_under_a_different_project_is_accepted
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=13]", "entities.JobFamily.fields.code"]
        distinguishing_aspect: "The mirror image of the uniqueness rule: the identical code OPS-LEAD in a second engagement must be accepted, proving the constraint is per-project and not global. An over-broad unique index fails here."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; two AuditProjects, FY26 and FY27; FY26 already holds a JobFamily with code OPS-LEAD."
          setup_api_calls:
