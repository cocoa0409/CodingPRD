              captures: { p1: "$.data.id" }
            - call: "POST /hazmat/shipping-papers/${p1}/certify"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /hazmat/shipments/${sh1}/verify-packaging"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/shipments/${sh1}/document"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 200.0, declared_value_cents: 333 }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { sh2: "$.data.id" }
            - call: "POST /hazmat/shipments/${sh2}/classify"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/shipments/${sh2}/shipping-papers"
              payload: { emergency_contact_phone: "+1-800-555-0100", emergency_response_summary: "Isolate 25m", shipper_certification_signed: true }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { p2: "$.data.id" }
            - call: "POST /hazmat/shipping-papers/${p2}/certify"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /hazmat/shipments/${sh2}/verify-packaging"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/shipments/${sh2}/document"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/carriers/${c_id}/shipments"
              payload: { material_id: "${m_id}", packaging_spec_id: "${s_id}", declared_shipping_name: "FLAMMABLE LIQUID, N.O.S.", quantity_kg: 200.0, declared_value_cents: 333 }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { sh3: "$.data.id" }
            - call: "POST /hazmat/shipments/${sh3}/classify"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/shipments/${sh3}/shipping-papers"
              payload: { emergency_contact_phone: "+1-800-555-0100", emergency_response_summary: "Isolate 25m", shipper_certification_signed: true }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { p3: "$.data.id" }
            - call: "POST /hazmat/shipping-papers/${p3}/certify"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-b"
            - call: "POST /hazmat/shipments/${sh3}/verify-packaging"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/shipments/${sh3}/document"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/vehicles/${v_id}/loads"
              payload: { route_id: "${r_id}", planned_departure_at: "2026-05-10T08:00:00Z", planned_arrival_at: "2026-05-10T12:00:00Z" }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { l_id: "$.data.id" }
            - call: "POST /hazmat/vehicle-loads/${l_id}/items"
              payload: { shipment_id: "${sh1}", position_code: "A1" }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/vehicle-loads/${l_id}/items"
              payload: { shipment_id: "${sh2}", position_code: "A2" }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
            - call: "POST /hazmat/vehicle-loads/${l_id}/items"
              payload: { shipment_id: "${sh3}", position_code: "A3" }
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
          trigger:
            - call: "POST /hazmat/vehicle-loads/${l_id}/seal"
              payload: {}
              as: ShipperComplianceOfficer
              as_user_id: "officer-a"
              captures: { l_fee: "$.data.handling_fee_cents", l_placards: "$.data.required_placards", l_w2: "$.data.total_table2_weight_kg" }
          assert:
            - "captured l_w2 == 600.0"
            - "captured l_placards == ['CLASS_3'] (600.0 >= 454.0; single Table-2 class so no DANGEROUS substitution)"
            - "captured l_fee == 788 (21+21+21 per-line rounding + 725*1; the sum-then-round reading 787 is wrong)"

      - name: renewal_processing_fee_subtotal_bracket
        grounds:
          - calculations.registration_fee
        distinguishing_aspect: |
          Mode (c): circular-looking evaluation order pinned — the processing-fee
          bracket is keyed on subtotal BEFORE the fee is added. An on-time early
          renewal at fleet 25 with safety_rating 90 yields subtotal 97500
          (< 100000 => flat 2500) and final total exactly 100000; keying the
          bracket on subtotal+fee would wrongly select the 3% bracket.
        test_recipe:
          setup:
            - "Carrier MEDIUM fleet 25, FLAMMABLE_LIQUID; INITIAL invoice: provisional 103000 (subtotal 100000 >= 100000 => 3% = 3000), final 97500 at rating 100 (discount 5000 => subtotal 95000 => flat 2500); paid 97500"
            - "One on-time MAJOR incident closed with confirmed MAJOR drops safety_rating to 90"
            - "Clock advanced to 2027-04-15 (inside the early-renewal window [2027-04-01, 2027-05-01])"
          setup_api_calls:
            - call: "POST /hazmat/carriers"
              payload: { legal_name: "Meridian Bulk", usdot_number: "USDOT-2005", fleet_size_declared: 25, hazmat_categories: ["FLAMMABLE_LIQUID"] }
