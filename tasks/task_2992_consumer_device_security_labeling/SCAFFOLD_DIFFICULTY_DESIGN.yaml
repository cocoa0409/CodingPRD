              payload: { retailer_id: "${retailer_id}", label_grant_id: "${grant_pub_id}", channel: "ONLINE", display_from: "2026-08-10T00:00:00Z", display_until: "2026-09-10T00:00:00Z" }
              as: Retailer
              as_user_id: "${retailer_id}"
            - call: "POST /labeling/label-grants/${grant_pub_id}/registry-publication"
              payload: { publication_decision: "PUBLISHED", publication_note: "Registry disclosure complete." }
              as: ConformityReviewer
              as_user_id: "reviewer-2"
            - call: "POST /labeling/label-grants/${grant_pub_id}/registry-publication"
              payload: { publication_decision: "WITHHELD", publication_note: "Disclosure page under review." }
              as: ConformityReviewer
              as_user_id: "reviewer-2"
            - call: "POST /labeling/display-authorizations"
              payload: { retailer_id: "${retailer_id}", label_grant_id: "${grant_pub_id}", channel: "ONLINE", display_from: "2026-08-10T00:00:00Z", display_until: "2026-09-10T00:00:00Z" }
              as: Retailer
