            - "after the second submit AgronomicPlan.${plan_id}.submitted_by_user_id was agro-2"
            - "HTTP 409 and ${err_id} == ERR_REVISION_LIMIT_REACHED"
            - "AgronomicPlan.${plan_id}.status == SUBMITTED"
            - "AgronomicPlan.${plan_id}.return_count == 2"
            - "AgronomicPlan.${plan_id}.submitted_by_user_id == agro-1"
            - "${plan_v_third_submit} == 6 and AgronomicPlan.${plan_id}.version == 6: the rejected return did not write"

      - name: aeration_window_flips_the_turf_area_into_renovation_and_back
        claim_type: side_effect_execution
        grounds:
          - state_machines.MaintenanceWindow.SCHEDULED_to_IN_PROGRESS
          - state_machines.MaintenanceWindow.IN_PROGRESS_to_COMPLETED
          - entities.TurfArea.fields.agronomic_status
          - entities.MaintenanceWindow.fields.crew_hours
        distinguishing_aspect: "The renovation side effect is conditional on task_type == AERATION: starting the AERATION window sets its green to UNDER_RENOVATION and completing it restores ACTIVE, while a MOWING window started on a different green in the same interval leaves that green ACTIVE at version 1 throughout."
        test_recipe:
          setup:
            - "One course, a 5500 sq ft GREEN on hole 7 and a 5000 sq ft GREEN on hole 12."
            - "One SCHEDULED AERATION window on hole 7's green, 06:00-08:00 with a crew of 3."
            - "One SCHEDULED MOWING window on hole 12's green, 06:00-08:00 with a crew of 2."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 5000, mowing_height_mm: 3.2, distance_to_water_ft: 60, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "AERATION", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T08:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_aer_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "MOWING", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T08:00:00Z", crew_size: 2 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_mow_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows/${w_aer_id}/start"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /maintenance-windows/${w_mow_id}/start"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /maintenance-windows/${w_aer_id}/complete"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /maintenance-windows/${w_mow_id}/complete"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
          assert:
            - "MaintenanceWindow.${w_aer_id}.crew_hours == 6.00 and MaintenanceWindow.${w_mow_id}.crew_hours == 4.00"
            - "after the AERATION start TurfArea.${green7_id}.agronomic_status == UNDER_RENOVATION and TurfArea.${green7_id}.version == 2"
            - "after the MOWING start TurfArea.${green12_id}.agronomic_status == ACTIVE and TurfArea.${green12_id}.version == 1"
            - "after the AERATION complete TurfArea.${green7_id}.agronomic_status == ACTIVE and TurfArea.${green7_id}.version == 3"
            - "MaintenanceWindow.${w_aer_id}.status == COMPLETED and MaintenanceWindow.${w_mow_id}.status == COMPLETED"
            - "TurfArea.${green12_id}.version == 1 after all four calls"

      - name: storm_damage_cancels_windows_task_and_play_then_clear_restores_the_green
        claim_type: cascade_down
        grounds:
          - state_machines.WeatherEvent.null_to_ACTIVE
          - state_machines.MaintenanceWindow.SCHEDULED_to_CANCELLED
          - state_machines.PlanTask.SCHEDULED_to_CANCELLED
          - state_machines.PlayEvent.SCHEDULED_to_CANCELLED
          - state_machines.AgronomicPlan.ACTIVE_to_CLOSED
          - entities.WeatherEvent.fields.deferred_window_count
        distinguishing_aspect: "STORM_DAMAGE cancels rather than defers: the AERATION window on the affected green goes CANCELLED with plan_task_id nulled and its task CANCELLED (which closes the plan by bubble-up), while the STORM_CLEANUP window on the same green and the MOWING window on an unaffected green both stay SCHEDULED and deferred_window_count stays 0."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course, a 5500 sq ft GREEN on hole 7 and a 5000 sq ft GREEN on hole 12."
            - "One ACTIVE 2026 plan whose single AERATION task on hole 7's green is SCHEDULED onto an 08:00-10:00 AERATION window."
            - "A STORM_CLEANUP window 11:00-13:00 on hole 7's green and a MOWING window 08:00-10:00 on hole 12's green."
            - "One STANDARD_TEE_TIMES event 14:00-18:00 over 18 holes with a field of 80."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id, course_v1: $.data.version }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 12, area_sq_ft: 5000, mowing_height_mm: 3.2, distance_to_water_ft: 60, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green12_id: $.data.id }
            - call: "POST /agronomic-plans"
              payload: { course_id: "${course_id}", plan_year: 2026, nitrogen_budget_lb: 40.00 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_id: $.data.id }
            - call: "POST /plan-tasks"
              payload: { plan_id: "${plan_id}", turf_area_id: "${green7_id}", task_type: "AERATION", planned_window_start: "2026-08-01T00:00:00Z", planned_window_end: "2026-08-02T00:00:00Z" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { task1_id: $.data.id }
            - call: "POST /agronomic-plans/${plan_id}/submit"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
              captures: { plan_v_submitted: $.data.version }
            - call: "POST /agronomic-plans/${plan_id}/approve"
              payload: { expected_plan_version: "${plan_v_submitted}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { plan_v_active: $.data.version }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "AERATION", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T10:00:00Z", crew_size: 3 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_aer_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green7_id}", task_type: "STORM_CLEANUP", window_start: "2026-08-01T11:00:00Z", window_end: "2026-08-01T13:00:00Z", crew_size: 4 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_clean_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { course_id: "${course_id}", turf_area_id: "${green12_id}", task_type: "MOWING", window_start: "2026-08-01T08:00:00Z", window_end: "2026-08-01T10:00:00Z", crew_size: 2 }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { w_mow_id: $.data.id }
            - call: "POST /plan-tasks/${task1_id}/schedule"
              payload: { maintenance_window_id: "${w_aer_id}", expected_plan_version: "${plan_v_active}" }
              as: Agronomist
              as_user_id: "agro-1"
            - call: "POST /play-events"
              payload: { course_id: "${course_id}", event_type: "STANDARD_TEE_TIMES", start_at: "2026-08-01T14:00:00Z", end_at: "2026-08-01T18:00:00Z", holes_in_play: 18, field_size: 80 }
              as: TournamentOfficial
              as_user_id: "tourn-1"
              captures: { pe1_id: $.data.id }
          trigger:
            - call: "POST /weather-events"
              payload: { course_id: "${course_id}", event_type: "STORM_DAMAGE", expected_clear_at: "2026-08-01T18:00:00Z", affected_turf_area_ids: ["${green7_id}"], expected_course_version: "${course_v1}" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { wx1_id: $.data.id }
            - call: "POST /weather-events/${wx1_id}/clear"
              payload: {}
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "WeatherEvent.${wx1_id}.declared_at == 2026-08-01T06:00:00Z"
            - "WeatherEvent.${wx1_id}.deferred_window_count == 0: STORM_DAMAGE cancels, it never defers"
            - "immediately after the declaration Course.${course_id}.play_posture == CLOSED"
            - "immediately after the declaration TurfArea.${green7_id}.agronomic_status == OUT_OF_PLAY and TurfArea.${green12_id}.agronomic_status == ACTIVE"
            - "MaintenanceWindow.${w_aer_id}.status == CANCELLED and MaintenanceWindow.${w_aer_id}.plan_task_id == null"
            - "MaintenanceWindow.${w_clean_id}.status == SCHEDULED: STORM_CLEANUP is exempt on its own affected green"
            - "MaintenanceWindow.${w_mow_id}.status == SCHEDULED: hole 12's green was never named in affected_turf_area_ids"
            - "PlanTask.${task1_id}.status == CANCELLED"
            - "AgronomicPlan.${plan_id}.status == CLOSED and AgronomicPlan.${plan_id}.committed_nitrogen_lb == 0.00"
            - "PlayEvent.${pe1_id}.status == CANCELLED"
            - "after the clear TurfArea.${green7_id}.agronomic_status == ACTIVE and Course.${course_id}.play_posture == OPEN"
            - "after the clear MaintenanceWindow.${w_aer_id}.status == CANCELLED, PlanTask.${task1_id}.status == CANCELLED and PlayEvent.${pe1_id}.status == CANCELLED: terminal rows are not restored"

      - name: plan_reopens_from_closed_when_a_voided_application_frees_its_task
        claim_type: bubble_up
        grounds:
          - state_machines.AgronomicPlan.CLOSED_to_ACTIVE
          - state_machines.PlanTask.COMPLETED_to_SCHEDULED
        excluded_because:
          difficulty_instance: transitive_cascade / application_void_reverts_task_and_reopens_closed_plan
          rationale: "That §1.8 instance drives exactly this bubble-up in reverse: it asserts CLOSED -> ACTIVE on the plan as the second hop of the application-void cascade."

      - name: nitrogen_commitment_is_restored_by_the_reschedule_compensation
        claim_type: compensation
        grounds:
          - state_machines.MaintenanceWindow.DEFERRED_to_SCHEDULED
          - state_machines.PlanTask.SCHEDULED_to_PLANNED
        excluded_because:
          difficulty_instance: compensating_invariant / nitrogen_ledger_returns_to_its_exact_value_after_defer_and_reschedule
          rationale: "That §1.8 instance asserts the ledger returns to its exact pre-deferral value with no drift, which is the compensation claim."

      - name: window_deferral_syncs_the_plan_ledger_and_the_turf_projection
        claim_type: ledger_sync
        grounds:
          - state_machines.MaintenanceWindow.SCHEDULED_to_DEFERRED
          - calculations.plan_nitrogen_commitment_lb
        excluded_because:
          difficulty_instance: transitive_cascade / frost_declaration_defers_window_reverts_task_and_debits_ledger
          rationale: "That §1.8 instance asserts both ancestor ledgers (plan committed_nitrogen_lb and TurfArea nitrogen_projected_lb_per_1000) after the deferral hop."

      - name: application_record_and_posting_dimensions_are_independent
        claim_type: parallel
        grounds:
          - state_machines.Application
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / application_record_and_posting_dimensions_advance_independently
          rationale: "That §1.8 instance releases the posting of a still-RECORDED row and then verifies it, asserting each dimension moved without gating the other."

      - name: window_defer_reschedule_loop_terminates_at_its_declared_cap
        claim_type: cyclic
        grounds:
          - state_machines.MaintenanceWindow
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / maintenance_window_defer_reschedule_cycle_caps_at_two
          rationale: "That §1.8 instance walks the loop twice and asserts the third pass is refused with ERR_DEFERRAL_LIMIT_REACHED."

      - name: window_start_is_guarded_by_the_course_play_posture
        claim_type: guarded_transitions
        grounds:
          - state_machines.MaintenanceWindow.SCHEDULED_to_IN_PROGRESS
          - validations[priority=33]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / window_start_depends_on_course_play_posture
          rationale: "That §1.8 instance asserts the same trigger on two windows of one closed course: refused for MOWING, admitted for STORM_CLEANUP."

      - name: equipment_retirement_is_a_cross_entity_side_effect_on_windows
        claim_type: cross_entity
        grounds:
          - state_machines.EquipmentUnit.IN_SERVICE_to_RETIRED
          - state_machines.MaintenanceWindow.SCHEDULED_to_DEFERRED
        excluded_because:
          difficulty_instance: transitive_cascade / equipment_retirement_defers_dependent_window_and_releases_commitment
          rationale: "That §1.8 instance asserts the retired sprayer's dependent window and its carried task, plus an untouched decoy window of another unit type."

      - name: second_service_on_an_in_service_unit_is_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.EquipmentUnit.DOWN_FOR_SERVICE_to_IN_SERVICE
          - errors[ERR_EQUIPMENT_STATE_INVALID]
        excluded_because:
          difficulty_instance: compensating_invariant / engine_hour_meter_is_conserved_across_a_service
          rationale: "That §1.8 instance ends by calling service a second time on the now IN_SERVICE unit and asserts ERR_EQUIPMENT_STATE_INVALID with the meter unchanged."

  # =========================================================================
  - section: calculations
    instances:
      - name: application_precision_uses_nested_rounding_and_half_up_at_the_third_decimal
        claim_type: precision
        grounds:
          - calculations.application_mass_and_nitrogen
          - calculations.turf_nitrogen_load
          - entities.Application.fields.total_lb
        distinguishing_aspect: "One application on a 4000 sq ft green at 150 lb per acre of a 46 percent product pins two rounding decisions at once: total_lb must be rounded to 13.77 BEFORE the nitrogen multiply (13.77 * 0.46 -> 6.33, whereas multiplying the unrounded 13.774104 gives 6.34), and the ledger's 6.33 / 4 == 1.5825 must round half-up to 1.583 rather than half-even's 1.582."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course, one 4000 sq ft GREEN on hole 7 whose distance to water is 40 ft."
            - "One CAT_3_TURF applicator and one urea product at 46 percent nitrogen, 0 REI hours, 0 ft buffer, 15 mph wind ceiling, no posting."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 4000, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-12001", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Urea 46-0-0", epa_reg_no: "NA-FERT-0001", requires_license_category: "CAT_3_TURF", rei_hours: 0, min_buffer_ft: 0, max_wind_speed_mph: 15, posting_required: false, nitrogen_pct: 46 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { urea_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { turf_area_id: "${green7_id}", product_id: "${urea_id}", applicator_id: "${appl_a_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 150, wind_speed_mph: 4, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { app1_id: $.data.id }
          assert:
            - "HTTP 201"
            - "Application.${app1_id}.total_lb == 13.77 (4000 / 43560 == 0.09182736 acres; 150 * 0.09182736 == 13.774104 -> 13.77)"
            - "Application.${app1_id}.nitrogen_lb == 6.33 (13.77 * 46 / 100 == 6.3342 -> 6.33; the unrounded 13.774104 route would have produced 6.34)"
            - "Application.${app1_id}.rei_expires_at == 2026-08-01T06:00:00Z (rei_hours 0)"
            - "Application.${app1_id}.posting_status == NOT_REQUIRED"
            - "TurfArea.${green7_id}.nitrogen_applied_lb_per_1000_ytd == 1.583 (6.33 / 4.0 == 1.5825, round_half_up at 3 decimals; half-even would give 1.582)"
            - "TurfArea.${green7_id}.nitrogen_projected_lb_per_1000 == 1.583 (no PLANNED or SCHEDULED fertility task adds anything)"

      - name: nitrogen_ceiling_is_keyed_to_the_area_type_constant
        claim_type: constants_applied
        grounds:
          - calculations.turf_nitrogen_load
          - validations[priority=31]
          - errors[ERR_NITROGEN_LOAD_LIMIT]
        distinguishing_aspect: "Two identical 350 lb-per-acre applications, one on a 5000 sq ft GREEN and one on a 5000 sq ft ROUGH, produce the same 3.696 lb per 1000 load, but MAX_N_LB_PER_1000_BY_AREA_TYPE admits it on the GREEN (ceiling 4.0) and refuses it on the ROUGH (ceiling 3.0) with ERR_NITROGEN_LOAD_LIMIT (422)."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T06:00:00Z."
            - "One course, a 5000 sq ft GREEN on hole 3 and a 5000 sq ft ROUGH on hole 11, both 40 ft from water."
            - "One CAT_3_TURF applicator and one urea product at 46 percent nitrogen with no REI, buffer or posting."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: Superintendent
              as_user_id: "super-1"
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 500000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 3, area_sq_ft: 5000, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green3_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "ROUGH", hole_number: 11, area_sq_ft: 5000, mowing_height_mm: 50, distance_to_water_ft: 40, soil_type: "NATIVE_LOAM" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { rough11_id: $.data.id }
            - call: "POST /applicators"
              payload: { full_name: "Dana Reyes", license_number: "OR-CAT3-12002", license_category: "CAT_3_TURF", license_expires_on: "2027-06-30" }
              as: Superintendent
              as_user_id: "super-1"
              captures: { appl_a_id: $.data.id }
            - call: "POST /pesticide-products"
              payload: { trade_name: "Urea 46-0-0", epa_reg_no: "NA-FERT-0002", requires_license_category: "CAT_3_TURF", rei_hours: 0, min_buffer_ft: 0, max_wind_speed_mph: 15, posting_required: false, nitrogen_pct: 46 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { urea_id: $.data.id }
          trigger:
            - call: "POST /applications"
              payload: { turf_area_id: "${green3_id}", product_id: "${urea_id}", applicator_id: "${appl_a_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 350, wind_speed_mph: 4, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { app_green_id: $.data.id }
            - call: "POST /applications"
              payload: { turf_area_id: "${rough11_id}", product_id: "${urea_id}", applicator_id: "${appl_a_id}", applied_at: "2026-08-01T06:00:00Z", rate_lb_per_acre: 350, wind_speed_mph: 4, distance_to_water_ft: 40 }
              as: Applicator
              as_user_id: "${appl_a_id}"
              captures: { err_rough: $.data.error_id }
          assert:
            - "the GREEN call returns HTTP 201 with Application.${app_green_id}.total_lb == 40.17 and nitrogen_lb == 18.48 (5000 / 43560 == 0.11478421 acres; 350 * 0.11478421 == 40.174472 -> 40.17; 40.17 * 0.46 == 18.4782 -> 18.48)"
            - "TurfArea.${green3_id}.nitrogen_applied_lb_per_1000_ytd == 3.696 (18.48 / 5.0), which is at or below the GREEN ceiling of 4.0"
            - "the ROUGH call returns HTTP 422 and ${err_rough} == ERR_NITROGEN_LOAD_LIMIT (the same 3.696 exceeds the ROUGH ceiling of 3.0)"
            - "TurfArea.${rough11_id}.nitrogen_applied_lb_per_1000_ytd == 0.000 and no Application row exists with turf_area_id == ${rough11_id}"

      - name: water_assessment_tier_floors_are_hit_exactly_at_t2_and_t3
        claim_type: tiered_pricing
        grounds:
          - calculations.water_overage_assessment
          - endpoints[GET /courses/{id}/water-assessment]
        distinguishing_aspect: "Three completed runs walk water_used_gal to 7690, 7693 and 30770 gallons, whose base charges are 24.99, exactly 25.00 and exactly 100.00 — so the tier steps T1 -> T2 -> T3 on the inclusive floors — and only after two allocation cuts does billable_gal turn positive, proving the tier was keyed on base_charge and not on total_charge."
        test_recipe:
          setup:
            - "One course with a 100000 gal annual allocation and default 80 / 100 posture thresholds."
            - "A 130000 sq ft FAIRWAY on hole 7, a 5500 sq ft GREEN on hole 3 and a 500000 sq ft ROUGH on hole 11."
