      - name: submitting_an_already_submitted_dataset_is_rejected_as_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.TrainingDataset.DRAFT_to_SUBMITTED
          - validations.priority_15
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          The submit trigger is not idempotent: replaying it from SUBMITTED is a priority-15 409
          ERR_INVALID_STATE, and the row's decided_* fields and version are unchanged by the
          rejection — the second call is a no-op, not a silent success.
        test_recipe:
          setup:
            - "one TrainingDataset already in SUBMITTED"
          setup_api_calls:
            - call: "POST /training-datasets"
              payload: { name: "snap-2026-07", snapshot_uri: "s3://snaps/2026-07", row_count: 1000000, feature_hash: "fs-v1", baseline_bin_proportions: [0.20, 0.20, 0.20, 0.20, 0.20], baseline_positive_rate: 0.30, license_class: "INTERNAL", pii_review_passed: true }
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { ds_id: $.data.id }
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { first_state: $.data.approval_state, first_version: $.data.version }
          trigger:
            - call: "POST /training-datasets/${ds_id}/submit"
              payload: {}
              as: MLEngineer
              as_user_id: "u_mle_1"
              captures: { err: $.data.error_id }
            - call: "GET /training-datasets/${ds_id}"
              payload: {}
              as: DataSteward
              as_user_id: "u_stew_1"
              captures: { after_state: $.data.approval_state, after_version: $.data.version }
          assert:
            - "first submit: approval_state 'SUBMITTED' with version 2"
            - "second submit: HTTP 409 with error_id 'ERR_INVALID_STATE' (priority 15)"
            - "the rejection had no side effects: approval_state is still 'SUBMITTED' and version is still 2, decided_by_user_id and decided_at are still null"

