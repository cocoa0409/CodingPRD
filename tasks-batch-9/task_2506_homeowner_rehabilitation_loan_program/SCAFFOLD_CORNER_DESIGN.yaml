# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
#
# Task: 2506 Homeowner Rehabilitation Loan Program
# Breadth probe over SCAFFOLD.yaml §1.1–§1.7, organised by the nine sections of
# references/claim-extraction-guide.md. Instances whose corner is already the
# asserted point of a §1.8 instance are emitted as excluded_because stubs.
#
# Shared conventions (identical to SCAFFOLD_DIFFICULTY_DESIGN.yaml):
#   * logical clock starts at its mandatory default 2026-08-01T00:00:00Z
#   * ProgramYear 2026: ami 9,000,000 / max loan 7,500,000 / allocation 50,000,000
#   * opaque operator ids: is-1, rs-1, rs-2, insp-1, insp-2, lo-1, lo-2, pm-1
# =============================================================================
scaffold_corner_design:

  - section: entities
    instances:
      - name: program_year_creation_returns_201_with_the_derived_budget_triad
        claim_type: creation
        grounds:
          - entities.ProgramYear
          - endpoints.POST_/rehab/program-years
          - response_envelope.success
        distinguishing_aspect: "A ProgramYear created with the four required inputs comes back 201 with committed 0, disbursed 0, program_income 0 and uncommitted equal to the allocation — the derived triad is materialised at creation, not left null."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "meta.api_request_id and meta.api_request_timestamp are present"
            - "ProgramYear.${py_id}.fiscal_year == 2026 and ami_median_income_cents == 9000000"
            - "ProgramYear.${py_id}.allocation_budget_cents == 50000000 and uncommitted_amount_cents == 50000000"
            - "ProgramYear.${py_id}.committed_amount_cents == 0 and disbursed_amount_cents == 0 and program_income_balance_cents == 0"
            - "ProgramYear.${py_id}.version == 1 and created_at is an ISO 8601 UTC timestamp with three fractional digits"

      - name: applicant_get_by_id_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.Applicant
          - endpoints.GET_/rehab/applicants/{applicant_id}
        distinguishing_aspect: "The single-row GET returns exactly what POST stored, including the pre-verification defaults (eligibility_status APPLIED, ami_percent null), so no calculation leaks into read time."
        test_recipe:
          setup:
            - "one ProgramYear 2026 and one Applicant created with wage_income_cents 7,000,000 and household_size 4, not yet income-verified"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, benefit_income_cents: 0, actual_asset_income_cents: 0, household_assets_cents: 5000000, dependents_count: 2, elderly_household: false }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "GET /rehab/applicants/${hh_id}"
              payload: {}
              as: RehabSpecialist
              as_user_id: "rs-1"
          assert:
            - "HTTP 200 with data.id == ${hh_id}"
            - "Applicant.${hh_id}.program_year_id == ${py_id} and full_name == Odell Marsh"
            - "Applicant.${hh_id}.eligibility_status == APPLIED"
            - "Applicant.${hh_id}.annual_income_cents == null and ami_percent == null and income_category == null"
            - "Applicant.${hh_id}.version == 1"

      - name: applicant_list_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints.GET_/rehab/applicants
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Three applicants under one program year, read with limit 2: the first page reports total_count 3 and has_more true with 2 rows, the second page (offset 2) reports has_more false with 1 row — the count is the filtered total, not the page size."
        test_recipe:
          setup:
            - "one ProgramYear 2026 with exactly three Applicant rows, all created by is-1"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Applicant One", email: "one@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { a1_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Applicant Two", email: "two@example.org", household_size: 3, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 6000000 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { a2_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Applicant Three", email: "three@example.org", household_size: 2, income_calc_method: "IRS_1040_ADJUSTED", wage_income_cents: 5000000 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { a3_id: $.data.id }
          trigger:
            - call: "GET /rehab/applicants"
              payload: { program_year_id: "${py_id}", limit: 2, offset: 0 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { first_page_head: "$.data[0].id" }
            - call: "GET /rehab/applicants"
              payload: { program_year_id: "${py_id}", limit: 2, offset: 2 }
              as: IntakeSpecialist
              as_user_id: "is-1"
          assert:
            - "first page: HTTP 200, response_type == array, 2 rows, total_count == 3, has_more == true"
            - "second page: 1 row, total_count == 3, has_more == false"
            - "the union of both pages is exactly {${a1_id}, ${a2_id}, ${a3_id}} with no repeats"
            - "an unfiltered GET /rehab/applicants with no limit returns all 3 rows (default limit is 10)"

      - name: get_application_by_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations.priority_4
          - errors.ERR_APPLICATION_NOT_FOUND
          - endpoints.GET_/rehab/applications/{application_id}
        distinguishing_aspect: "A well-formed UUID that matches no RehabApplication row answers 404 ERR_APPLICATION_NOT_FOUND — the path-existence check at priority 4, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "one ProgramYear 2026 exists; no RehabApplication rows exist at all"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          trigger:
            - call: "GET /rehab/applications/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { seen_error: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error"
            - "data.error_id == ERR_APPLICATION_NOT_FOUND and data.message is a non-empty string"
            - "no row is created as a side effect"

      - name: create_applicant_missing_required_household_size_returns_invalid_request
        claim_type: required_fields
        grounds:
          - entities.Applicant.fields.household_size
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "household_size is source input with no default, so omitting it answers 400 ERR_INVALID_REQUEST; the request is rejected wholesale and no partial Applicant row survives."
        test_recipe:
          setup:
            - "one ProgramYear 2026 exists"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "No Household Size", email: "nohh@example.org", income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { seen_error: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /rehab/applicants?program_year_id=${py_id} returns 0 rows"

      - name: applicant_optional_money_and_flag_fields_default_to_zero_and_false
        claim_type: defaults
        grounds:
          - entities.Applicant.fields.benefit_income_cents
          - entities.Applicant.fields.actual_asset_income_cents
          - entities.Applicant.fields.household_assets_cents
          - entities.Applicant.fields.dependents_count
          - entities.Applicant.fields.elderly_household
          - calculations.applicant_annual_income_and_category
        distinguishing_aspect: "Creating an applicant with only the required fields defaults all four optional money/count fields to 0 and elderly_household to false, so PART_5_ANNUAL verification returns annual_income_cents exactly equal to the wage (no asset imputation, because household_assets_cents 0 is below the 500,000 imputation floor)."
        test_recipe:
          setup:
            - "one ProgramYear 2026 with ami_median_income_cents 9,000,000"
            - "one Applicant created with only program_year_id, full_name, email, household_size 4, income_calc_method PART_5_ANNUAL and wage_income_cents 4,500,000"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Defaults Only", email: "defaults@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 4500000 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
          trigger:
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
          assert:
            - "Applicant.${hh_id}.benefit_income_cents == 0 and actual_asset_income_cents == 0 and household_assets_cents == 0"
            - "Applicant.${hh_id}.dependents_count == 0 and elderly_household == false"
            - "Applicant.${hh_id}.annual_income_cents == 4500000 (no imputation: 0 assets is below ASSET_IMPUTATION_FLOOR_CENTS 500000)"
            - "Applicant.${hh_id}.ami_percent == 50.0 and income_category == VERY_LOW"
            - "Applicant.${hh_id}.eligibility_status == INCOME_VERIFIED"

      - name: work_item_line_total_is_computed_and_extra_field_line_total_cents_is_ignored
        claim_type: computed_fields
        grounds:
          - entities.WorkItem.fields.line_total_cents
          - entities.WorkItem.fields.protocol_multiplier
          - calculations.work_write_up_estimate
        distinguishing_aspect: "line_total_cents and protocol_multiplier are source computed: a client that posts line_total_cents 1 alongside estimated_cost_cents 1,000,000 with is_lead_hazard_reduction true still gets multiplier 1.15 and line_total_cents 1,150,000 — the supplied value is discarded, not blended."
        test_recipe:
          setup:
            - "one ownership-verified, inspected RehabApplication built 1962 in a historic district with a DRAFT WorkWriteUp prepared by rs-1"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Junie Abbott", email: "junie@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, household_assets_cents: 5000000, dependents_count: 2 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applications"
              payload: { applicant_id: "${hh_id}", address_line1: "9 Canal Row", city: "Fairview", state_code: "OH", year_built: 1962, assessed_value_cents: 14000000, senior_lien_balance_cents: 9000000, historic_district: true, occupancy_type: "OWNER_OCCUPIED_SINGLE", ownership_doc_type: "WARRANTY_DEED" }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_id: $.data.id }
            - call: "POST /rehab/applications/${app_id}/verify-ownership"
              payload: { deed_recorded_date: "2009-07-01", title_report_clear: true }
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_id}", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-03T13:00:00Z", scheduled_end_at: "2026-08-03T15:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp1_id: $.data.id }
            - call: "POST /rehab/inspections/${insp1_id}/record-result"
              payload: { result: "FAIL", deficiency_count: 4, xrf_reading_mg_cm2: 1.30 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "GET /rehab/applications/${app_id}"
              payload: {}
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { app_v: $.data.version }
            - call: "POST /rehab/write-ups"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v}" }
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { wu_id: $.data.id }
          trigger:
            - call: "POST /rehab/work-items"
              payload: { write_up_id: "${wu_id}", description: "Soffit lead paint stabilisation", category: "LEAD_HAZARD_CONTROL", priority_class: "HEALTH_SAFETY", estimated_cost_cents: 1000000, is_lead_hazard_reduction: true, is_historic_sensitive: false, line_total_cents: 1 }
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { wi_id: $.data.id }
          assert:
            - "HTTP 201 with WorkItem.${wi_id}.protocol_multiplier == 1.15"
            - "WorkItem.${wi_id}.line_total_cents == 1150000, not 1"
            - "WorkItem.${wi_id}.estimated_cost_cents == 1000000"
            - "WorkWriteUp.${wu_id}.work_item_count == 1, base_estimate_cents == 1150000, contingency_cents == 115000, total_estimate_cents == 1265000"

      - name: program_year_creation_with_extra_field_id_is_ignored_and_system_fields_are_server_minted
        claim_type: system_fields
        grounds:
          - entities.ProgramYear
          - endpoints.POST_/rehab/program-years
        distinguishing_aspect: "id, created_at, updated_at and version are source system: a POST that supplies id and version is answered with a server-minted UUID (no type prefix) and version 1, never the client's values."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2027, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000, id: "py_client_chosen", version: 99 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          assert:
            - "HTTP 201 and ${py_id} != py_client_chosen"
            - "${py_id} is a bare UUID with no type prefix"
            - "ProgramYear.${py_id}.version == 1, not 99"
            - "ProgramYear.${py_id}.created_at and updated_at are server timestamps and are equal on creation"

      - name: create_applicant_with_invalid_income_calc_method_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.Applicant.fields.income_calc_method
          - validations.priority_6
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "income_calc_method is constrained to PART_5_ANNUAL or IRS_1040_ADJUSTED; the near-miss value PART_5 is a 400 ERR_INVALID_REQUEST rather than being coerced to the closest member."
        test_recipe:
          setup:
            - "one ProgramYear 2026 exists"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Bad Enum", email: "bad@example.org", household_size: 4, income_calc_method: "PART_5", wage_income_cents: 7000000 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { seen_error: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /rehab/applicants?program_year_id=${py_id} returns 0 rows"
            - "a negative wage_income_cents is rejected by the same rule (money fields are non-negative)"

      - name: work_item_is_immutable_carrying_only_id_and_created_at
        claim_type: immutability
        grounds:
          - entities.WorkItem
          - endpoints.GET_/rehab/work-items/{work_item_id}
          - endpoints.DELETE_/rehab/work-items/{work_item_id}
        distinguishing_aspect: "WorkItem declares common_fields false, so its rows carry id and created_at but no updated_at and no version, and §1.5 offers no PATCH — a line item is replaced by delete-and-recreate, and the write-up totals must follow the delete."
        test_recipe:
          setup:
            - "one DRAFT WorkWriteUp on an inspected application with two work items: 2,000,000 HEALTH_SAFETY and 400,000 GENERAL_PROPERTY_IMPROVEMENT, so base 2,400,000 and total 2,640,000"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
            - call: "POST /rehab/applicants"
              payload: { program_year_id: "${py_id}", full_name: "Odell Marsh", email: "odell@example.org", household_size: 4, income_calc_method: "PART_5_ANNUAL", wage_income_cents: 7000000, household_assets_cents: 5000000, dependents_count: 2 }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { hh_id: $.data.id }
            - call: "POST /rehab/applicants/${hh_id}/verify-income"
              payload: {}
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/applications"
              payload: { applicant_id: "${hh_id}", address_line1: "18 Larkspur Ave", city: "Fairview", state_code: "OH", year_built: 1995, assessed_value_cents: 15000000, senior_lien_balance_cents: 12000000, historic_district: false, occupancy_type: "OWNER_OCCUPIED_SINGLE", ownership_doc_type: "WARRANTY_DEED" }
              as: IntakeSpecialist
              as_user_id: "is-1"
              captures: { app_id: $.data.id }
            - call: "POST /rehab/applications/${app_id}/verify-ownership"
              payload: { deed_recorded_date: "2015-04-12", title_report_clear: true }
              as: IntakeSpecialist
              as_user_id: "is-1"
            - call: "POST /rehab/inspections"
              payload: { application_id: "${app_id}", inspection_type: "INITIAL_STANDARDS", scheduled_start_at: "2026-08-03T13:00:00Z", scheduled_end_at: "2026-08-03T15:00:00Z" }
              as: Inspector
              as_user_id: "insp-1"
              captures: { insp1_id: $.data.id }
            - call: "POST /rehab/inspections/${insp1_id}/record-result"
              payload: { result: "FAIL", deficiency_count: 3, xrf_reading_mg_cm2: 0.2 }
              as: Inspector
              as_user_id: "insp-1"
            - call: "GET /rehab/applications/${app_id}"
              payload: {}
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { app_v: $.data.version }
            - call: "POST /rehab/write-ups"
              payload: { application_id: "${app_id}", expected_application_version: "${app_v}" }
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { wu_id: $.data.id }
            - call: "POST /rehab/work-items"
              payload: { write_up_id: "${wu_id}", description: "Full roof replacement", category: "ROOF", priority_class: "HEALTH_SAFETY", estimated_cost_cents: 2000000 }
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { wi_keep_id: $.data.id }
            - call: "POST /rehab/work-items"
              payload: { write_up_id: "${wu_id}", description: "Kitchen cabinet replacement", category: "ACCESSIBILITY", priority_class: "GENERAL_PROPERTY_IMPROVEMENT", estimated_cost_cents: 400000 }
              as: RehabSpecialist
              as_user_id: "rs-1"
              captures: { wi_drop_id: $.data.id }
          trigger:
            - call: "GET /rehab/work-items/${wi_keep_id}"
              payload: {}
              as: RehabSpecialist
              as_user_id: "rs-1"
            - call: "DELETE /rehab/work-items/${wi_drop_id}"
              payload: {}
              as: RehabSpecialist
              as_user_id: "rs-1"
          assert:
            - "the GET returns 200 with id and created_at present and no version or updated_at key in data"
            - "the DELETE returns 204 with an empty body"
            - "after the delete: WorkWriteUp.${wu_id}.work_item_count == 1, base_estimate_cents == 2000000, contingency_cents == 200000, total_estimate_cents == 2200000"
            - "after the delete: GET /rehab/work-items?write_up_id=${wu_id} returns 1 row, ${wi_keep_id}"
            - "GET /rehab/work-items/${wi_drop_id} returns 404 ERR_WORK_ITEM_NOT_FOUND"

      - name: create_work_item_with_unknown_write_up_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.WorkItem.fields.write_up_id
          - validations.priority_5
          - errors.ERR_WRITE_UP_NOT_FOUND
        distinguishing_aspect: "write_up_id is a body foreign key, so an unresolvable value answers 404 ERR_WRITE_UP_NOT_FOUND at priority 5 — ahead of the priority 6 shape check, which the rest of the payload satisfies anyway."
        test_recipe:
          setup:
            - "one ProgramYear 2026 exists and no WorkWriteUp rows exist"
          setup_api_calls:
            - call: "POST /rehab/program-years"
              payload: { fiscal_year: 2026, ami_median_income_cents: 9000000, max_loan_amount_cents: 7500000, allocation_budget_cents: 50000000 }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /rehab/work-items"
