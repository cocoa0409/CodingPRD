  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: consignment_net_proceeds_per_line_rounding_before_summation
        grounds:
          - calculations.consignment_net_proceeds
          - entities.Consignment.fields.channel_fee_cents
          - entities.Consignment.fields.transport_to_channel_cents
          - entities.Consignment.fields.recondition_loaded_cents
          - endpoints[POST /fleet/consignments/{consignment_id}/record-sale]
        distinguishing_aspect: |
          The combinatorial trap here is ROUNDING ORDER inside one aggregation: rounding the
          channel-fee, transport and loaded-recondition lines independently and then summing
          gives 225235 cents of cost, while summing the three unrounded lines and rounding
          once gives 225234 — a one-cent difference that only the pinned per-line order produces.
        test_recipe:
          setup:
            - "One ATL market with transport_hub_distance_km 23 and transfer_cost_per_km_cents 250, so the channel haul line is round_half_up(23 * 250 * 1.15) = 6613."
            - "One AUCTION channel with fee_pct 0.06 and fixed_fee_cents 25000."
            - "Vehicle VA IN_SERVICE under the PROGRAM allocation with in_service_at 2026-01-15T00:00:00Z and odometer_km 47000."
            - "Clock at 2026-09-15T00:00:00Z when the consignment is created, so net_book_value_at_hold_cents freezes at 2236000 and floor_price_cents at 1677000."
            - "Reconditioning authorized at 50000 and actually spent at 45555, giving recondition_loaded_cents round_half_up(45555 * 1.075) = 48972."
            - "Consignment LISTED, hammer price 2410833 which clears the 1677000 floor."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
              payload: { current_utc: "2026-01-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "u-admin-1"
            - call: "POST /fleet/markets"
