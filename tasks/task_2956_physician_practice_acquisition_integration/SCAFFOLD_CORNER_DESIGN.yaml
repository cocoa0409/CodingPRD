            - "target_status NOTICES_ISSUED from NOT_STARTED also returns ERR_INVALID_STATE_TRANSITION (409) — ATTESTED cannot be skipped"
            - "target_status WITHDRAWN from NOT_STARTED succeeds, which is the only declared exit before attestation"

      - name: liability_item_escrowed_to_assumed_is_not_declared_rejected
        claim_type: Invalid Transitions
        grounds:
          - state_machines.LiabilityItem.disposition.ESCROWED_to_EXCLUDED
          - state_machines.LiabilityItem.disposition
          - validations[priority=14]
        distinguishing_aspect: |
          From ESCROWED the only declared target is EXCLUDED, so ASSUMED and
          INDEMNIFIED are refused and the escrow ledger is left intact — money already
          committed can only be released by the one declared unwind path.
        test_recipe:
          setup:
            - "One ASSET Acquisition with escrow_total_cents 10000000."
            - "One EQUIPMENT_LEASE LiabilityItem of 2500000 in disposition ESCROWED."
