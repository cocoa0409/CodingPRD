                  - { sequence_number: 2, element_kind: "PROGRAM", asset_id: "${asset_b_id}", scheduled_start_utc: "2026-08-01T12:15:00Z", scheduled_duration_seconds: 900, max_trim_seconds: 0 }
              as: TrafficCoordinator
