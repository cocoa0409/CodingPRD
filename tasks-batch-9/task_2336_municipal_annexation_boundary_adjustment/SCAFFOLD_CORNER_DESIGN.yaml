          assert:
            - "${c2_plan_ver_stale} == 1"
            - "${c2_e_stale} == ERR_STALE_PLAN_VERSION with status 412"
            - "${c2_plan_ver_fresh} == 2 — the refused write did not advance the plan version"
            - "the second commitment create returns status 201"
            - "${c2_days_b} == 41"
            - "${c2_plan_ver_final} == 3"
            - "ServiceCommitment.${cm_c2a}.commitment_status == VOIDED"
            - "ServiceCommitment.${cm_c2b}.commitment_status == DRAFT"
            - "ServiceProvider.${prov_c2}.encumbered_capacity_days == 0"
            - "GET /service-commitments?plan_of_services_id=${plan_c2}&commitment_status=DRAFT returns total_count == 1"

      - name: the_commission_flag_locks_effectuation_until_the_commission_approves
        claim_type: conditional_feature_flags
        grounds:
          - validations[priority=78]
          - statute_profiles.boundary_commission_required
          - endpoints[POST /annexation-cases/{caseId}/submit-to-commission]
        distinguishing_aspect: |
          One statute flag rewrites the tail of the workflow: with boundary_commission_required true
          the ordinance adoption stamps commission_review_status PENDING and effectuation is refused
          with ERR_COMMISSION_APPROVAL_REQUIRED, and only after submission and an APPROVED decision
          does the identical effectuate call succeed. Under the default false the same call
          succeeds straight from ORDINANCE_ADOPTED, as the tax-roll instance asserts.
        test_recipe:
          setup:
            - "The house chain under a statute with boundary_commission_required true, carried to ORDINANCE_ADOPTED at clock 2026-10-11T09:00:00Z."
          setup_api_calls:
            - call: "POST /statute-profiles"
              payload: { state_code: "NC", authorized_methods: ["INVOLUNTARY_ORDINANCE"], required_service_types: ["POLICE"], boundary_commission_required: true }
              as: StateLawAdmin
              as_user_id: "sla-01"
              captures: { st_c3: $.data.id }
            - call: "POST /municipalities"
              payload: { statute_profile_id: "${st_c3}", name: "Cedar Grove", state_code: "NC", population: 40000, citywide_annual_service_cost_cents: 800000000, citywide_population: 40000, general_fund_millage_rate: 10.0, corporate_boundary_perimeter_feet: 80000 }
              as: StateLawAdmin
              as_user_id: "sla-01"
