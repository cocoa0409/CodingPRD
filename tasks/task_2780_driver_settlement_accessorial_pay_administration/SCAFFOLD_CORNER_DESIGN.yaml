      - name: the_third_reopen_of_a_denied_dispute_hits_the_reopen_limit
        claim_type: error_triggerable
        grounds:
          - validations[priority=44]
          - errors[ERR_DISPUTE_REOPEN_LIMIT]
          - entities.Dispute.fields.reopen_count
          - domain_constants.DISPUTE_REOPEN_LIMIT
        distinguishing_aspect: |
          The guard is reopen_count < DISPUTE_REOPEN_LIMIT evaluated before the increment, so the boundary sits
          between the second and third reopen: with the limit at 2 the reopens at count 0 and count 1 succeed and
          the one at count 2 fails with ERR_DISPUTE_REOPEN_LIMIT at 409. An off-by-one implementation either
          stops after the first reopen or allows a third. The refused dispute must stay DENIED with reopen_count
          frozen at 2 rather than flipping to OPEN.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "driver DRV_ROP ACTIVE with load LOAD_ROP DELIVERED 2026-08-04T18:00Z, ACCRUED and unsettled"
            - "clock at 2026-08-06T09:00:00Z"
            - "a MILEAGE dispute claiming (HHG, 742) is OPEN, reviewed by clerk-01 and DENIED by approver-01"
            - "DISPUTE_REOPEN_LIMIT is 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PayrollAdmin
            - call: "POST /driver-pay/pay-packages"
              payload: { name: "Leased Reopen Limit", driver_type: "LEASED_OPERATOR", mileage_guide: "PRACTICAL", per_diem_method: "NONE", escrow_required: false }
