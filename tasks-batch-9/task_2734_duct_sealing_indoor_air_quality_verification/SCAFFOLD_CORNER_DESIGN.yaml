            - "${job_status} == ABORTED_SAFETY with ${job_why} == 'combustion spillage failure'; ${job_cur} is still 150.0 on the job row itself"
            - "${ds_seal} == SEAL_PENDING, ${ds_work} == 300.00 == ${ds_base}, ${ds_red} == 0.00 and ${ds_active} == null: the DuctSystem compensation rolled the ledger back to baseline"
            - "${p_status} == SAFETY_HOLD, ${p_hold} == true and ${p_why} == 'combustion spillage failure on WH-1' — the reason names the appliance, so the hop ran off this test and not off a generic flag"
            - "${e_complete} == ERR_SEAL_JOB_INVALID_STATE with HTTP 409: the aborted run is terminal, and this is not the resume carve-out"
            - "GET /duct-sealing/projects/${proj_id}/combustion-tests?verdict=FAIL returns total_count == 1 with id == ${fail_id}"

      - name: target_reached_latches_at_exact_equality_and_the_stall_flag_resets
        claim_type: rate_threshold_triggers
        grounds:
