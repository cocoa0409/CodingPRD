            - "No Review is created: GET /platform/business-pages/${pp_id}/reviews returns empty list"

      - name: fiscal_checked_last_after_temporal_and_referential
        grounds:
          - validations[priority=17]
          - validations[priority=19]
          - validations[priority=20]
        distinguishing_aspect: |
