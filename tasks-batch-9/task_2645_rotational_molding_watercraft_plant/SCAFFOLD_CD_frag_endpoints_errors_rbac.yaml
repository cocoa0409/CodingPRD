            - call: "POST /resin-charges/${chg2}/release"
              payload: { release_reason: "releasing it twice" }
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "the quarantine returns status 200 with ResinLot.${lot}.status 'QUARANTINED' and version 2, and ProductionOrder.${po}.blocked_reason == 'NO_QUALIFIED_RESIN_LOT'"
            - "the charge create against the QUARANTINED lot returns status 409 with data.error_id 'ERR_RESIN_LOT_NOT_AVAILABLE', although expected_resin_lot_version ${lot_v} is ALSO stale"
            - "the release-quarantine returns status 200 with status 'AVAILABLE', version 3 and ProductionOrder.${po}.blocked_reason null"
            - "the second charge create, byte-identical to the first, now returns status 412 with data.error_id 'ERR_STALE_RESIN_LOT_VERSION'"
            - "ResinLot.${lot}.version == ${lot_v3} == 3 and reserved_kg == 0.000 after that 412 — a refused create books no mass"
            - "the charge create with the fresh version returns status 201 with status 'RESERVED', and ResinLot.${lot} then reports available_kg 476.000, reserved_kg 24.000 and consumed_kg 0.000"
            - "the first release returns status 200 with ResinCharge.${chg2}.status 'RELEASED' and ResinLot.${lot} back to available_kg 500.000, reserved_kg 0.000"
            - "the second release returns status 409 with data.error_id 'ERR_CHARGE_NOT_RELEASABLE' and available_kg is still 500.000, never 524.000"

      - name: err_capacity_family_trailer_cube_payload_site_mismatch_and_order_overbuild
        claim_type: violation_to_error
        grounds:
          - errors.ERR_TRAILER_CUBE_EXCEEDED
          - errors.ERR_TRAILER_PAYLOAD_EXCEEDED
          - errors.ERR_WAREHOUSE_MISMATCH
          - errors.ERR_ORDER_OVERBUILD
          - errors.ERR_ORDER_NOT_SCHEDULABLE
          - validations.priority_34
          - validations.priority_65
          - validations.priority_77
          - validations.priority_78
          - validations.priority_79
        distinguishing_aspect: |
          The four capacity refusals are separated by which capacity actually
          binds: on a 2.5000 m3 trailer the second hull breaks the CUBE while the
          payload is fine, on a 10.0000 m3 / 30.000 kg trailer the second hull
          breaks the PAYLOAD while the cube is fine, a hull from another site is
          422 ERR_WAREHOUSE_MISMATCH before either capacity is consulted, and the
          build-quota ceiling is separated from the order-state gate: a new cycle
          on the COMPLETE two-unit order is 409 ERR_ORDER_NOT_SCHEDULABLE
          (priority 34) while a second single-cavity cycle on a still
          READY_TO_SCHEDULE one-unit order is 409 ERR_ORDER_OVERBUILD
          (priority 79) because floor(1 * 1.20) is 1.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with both hulls SELLABLE and STORED in WH-CD; each hull weighs 24.000 kg with gross_cube_m3 2.0000 and nest_factor 0.5000, and the logical clock stands at 2026-08-01T10:35:00Z."
