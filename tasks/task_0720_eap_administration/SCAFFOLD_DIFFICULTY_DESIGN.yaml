              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl P", external_ref: "EP1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr P", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z", duration_minutes: 50 }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T14:00:00Z", duration_minutes: 50 }
              as: CareCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "trigger[0] response status 409"
            - "trigger[0] data.error_id == ERR_CASE_SAME_DAY_SESSION"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: schedule_then_cancel_session_preserves_committed
        grounds:
          - state_machines.CounselingSession (SCHEDULED then CANCELLED)
          - entities.EmployerContract.fields.sessions_committed
          - calculations.contract_utilization
        distinguishing_aspect: "Conserved quantity sessions_committed: contract.sessions_committed == count(sessions in {SCHEDULED,COMPLETED}); scheduling one session (+1) then cancelling it (-1) returns sessions_committed to its pre-schedule value 0."
        test_recipe:
          setup:
            - "Authorized case, no sessions yet (sessions_committed=0). Schedule one session then cancel it."
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Rho", sessions_per_issue: 3, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std" }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl R", external_ref: "ER1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr R", specialties: ["STRESS"] }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/cases"
              payload: { contract_id: "${c_id}", employee_id: "${e_id}", presenting_issue: "STRESS" }
              as: CareCoordinator
              captures: { case_id: $.data.id }
            - call: "POST /eap/cases/${case_id}/authorize"
              payload: { expected_contract_version: "${c_v}" }
              as: CareCoordinator
            - call: "POST /eap/_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /eap/cases/${case_id}/sessions"
              payload: { provider_id: "${prov_id}", scheduled_for: "2026-03-02T10:00:00Z" }
              as: CareCoordinator
              captures: { s1_id: $.data.id }
          trigger:
            - call: "POST /eap/sessions/${s1_id}/status"
              payload: { to_status: "CANCELLED" }
              as: CareCoordinator
              captures: { st: $.data.status }
          assert:
            - "CounselingSession.${s1_id}.status == CANCELLED"
            - "EmployerContract.${c_id}.sessions_committed == 0"
            - "Case.${case_id}.sessions_used == 0"

      - name: request_then_decline_referral_preserves_provider_count
        grounds:
          - state_machines.Referral.REQUESTED_to_DECLINED
          - entities.Provider.fields.active_referral_count
          - calculations.provider_selection
        distinguishing_aspect: "Conserved quantity active_referral_count: provider.active_referral_count == count(referrals to provider in {REQUESTED,ACCEPTED}); creating a referral (+1) then the provider declining it (-1) returns the count to 0 — a different conserved quantity from sessions_committed."
        test_recipe:
          setup:
            - "One eligible provider P (active_referral_count 0). A WORKLIFE referral is created (auto-assigns P), then P declines."
          setup_api_calls:
            - call: "POST /eap/contracts"
              payload: { employer_name: "Sig", sessions_per_issue: 2, annual_session_cap: 10, session_rate_cents: 12000, annual_reimbursement_budget_cents: 1000000 }
              as: ProgramAdmin
              captures: { c_id: $.data.id }
            - call: "POST /eap/plans"
              payload: { contract_id: "${c_id}", name: "Std", worklife_referrals_per_year: 3 }
              as: ProgramAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /eap/plans/${plan_id}/publish"
              payload: {}
              as: ProgramAdmin
            - call: "POST /eap/employees"
              payload: { contract_id: "${c_id}", plan_id: "${plan_id}", full_name: "Empl S", external_ref: "ES1" }
              as: ProgramAdmin
              captures: { e_id: $.data.id }
            - call: "POST /eap/providers"
              payload: { full_name: "Dr S", network_status: "IN_NETWORK", specialties: ["STRESS"], accepting: true }
              as: ProgramAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /eap/referrals"
              payload: { employee_id: "${e_id}", referral_type: "WORKLIFE", required_specialty: "STRESS" }
              as: CareCoordinator
              captures: { ref_id: $.data.id }
          trigger:
            - call: "POST /eap/referrals/${ref_id}/decline"
              payload: {}
              as: Provider
              as_user_id: "${prov_id}"
              captures: { st: $.data.status }
          assert:
            - "Referral.${ref_id}.status == DECLINED"
            - "Referral.${ref_id}.provider_id == null"
            - "Provider.${prov_id}.active_referral_count == 0"
