        grounds:
          - validations[priority=11]
          - errors[ERR_FIXTURE_LEAD_TIME]
        distinguishing_aspect: |
          Interval semantics: buffer-window collision on the Store resource —
          lock requires committed_delivery_date <= fixture_kit_ship_date
          (opening_date - 21 days). A delivery commitment 10 days before
          opening collides with the 21-day fixture buffer (lock rejected),
          while a commitment exactly on the ship date clears it — adjacency
          inside the buffer is a collision, at the buffer edge is not.
        test_recipe:
          setup:
            - "ACTIVE program; store S SITE_CONTROL with agreement AG EXECUTED (committed_delivery_date 2026-11-25); opening plan OP PLANNED with opening_date 2026-12-05 (fixture_kit_ship_date 2026-11-14 — delivery 11 days inside the buffer)"
