            - call: "POST /store-ops/complaints"
              payload: { order_id: "${ord_id}", category: "LATE", description: "Pizza arrived cold and late" }
              as: CustomerCareAgent
              as_user_id: "cca-1"
              captures: { cmp_id: $.data.id, cmp_status0: $.data.status, cmp_remedy0: $.data.proposed_remedy_cents }
          trigger:
            - call: "POST /store-ops/complaints/${cmp_id}/propose-remedy"
              payload: {}
              as: CustomerCareAgent
              as_user_id: "cca-1"
              captures: { remedy: $.data.proposed_remedy_cents, basis: $.data.remedy_basis, cmp_status: $.data.status }
          assert:
            - "${ord_fee} == 200 and ${ord_total} == 2900"
            - "${cmp_status0} == 'OPEN' and ${cmp_remedy0} == null at creation, the remedy being sized only at propose time"
            - "Order.${ord_id}.order_to_door_gross_minutes == 36 against promise_minutes_snapshot 30, i.e. 6 minutes over"
            - "${remedy} == 440, i.e. round_half_up(2200 * 20 / 100) with NO fee refund — 20% of the food subtotal only"
            - "${basis} == 'LATE_TIER' and ${cmp_status} == 'REMEDY_PROPOSED'"
            - "Order.${ord_id}.remedy_issued_cents is still 0, because nothing is paid until the manager approves"

  - section: validations
    instances:
    - name: polygon_and_window_schema_violations_are_rejected
      claim_type: violation_to_error
      grounds: [validations.priority_9, errors.ERR_INVALID_POLYGON, errors.ERR_INVALID_ZONE_WINDOW, errors.ERR_INVALID_COVERAGE_WINDOW]
      distinguishing_aspect: 'Priority 9 owns the three domain-shape rules and each maps to its OWN error rather than to the generic ERR_INVALID_REQUEST of priority 8: a 2-vertex ring is ERR_INVALID_POLYGON, a zero-length zone window is ERR_INVALID_ZONE_WINDOW, and a backwards coverage window is ERR_INVALID_COVERAGE_WINDOW — all 422, all leaving nothing behind.'
      test_recipe:
        setup: [A store with no zone version yet and one APPLICANT driver whose current version has been captured.]
        setup_api_calls:
        - call: POST /store-ops/_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00Z'}
          as: StoreManager
          as_user_id: boot
        - call: POST /store-ops/stores
          payload: {store_number: '7421', name: Riverside, latitude_micro: 39000000, longitude_micro: -84000000}
          as: StoreManager
          as_user_id: boot
          captures: {store_id: $.data.id, store_v1: $.data.version}
        - call: POST /store-ops/drivers
          payload: {store_id: '${store_id}', full_name: Dana Ortiz, license_number: DL-1001, vehicle_class: CAR}
          as: StoreManager
          as_user_id: ${store_id}
          captures: {drv_id: $.data.id, drv_v1: $.data.version}
        trigger:
        - call: POST /store-ops/zone-versions
          payload:
            store_id: ${store_id}
            polygon:
            - {latitude_micro: 38900000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -84200000}
            effective_from: '2026-07-01T00:00:00Z'
            effective_to: '2026-09-01T00:00:00Z'
            expected_store_version: ${store_v1}
          as: StoreManager
          as_user_id: ${store_id}
          captures: {err_polygon: $.data.error_id}
        - call: POST /store-ops/zone-versions
          payload:
            store_id: ${store_id}
            polygon:
            - {latitude_micro: 38900000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -84200000}
            - {latitude_micro: 39200000, longitude_micro: -83800000}
            - {latitude_micro: 38900000, longitude_micro: -83800000}
            effective_from: '2026-07-01T00:00:00Z'
            effective_to: '2026-07-01T00:00:00Z'
            expected_store_version: ${store_v1}
          as: StoreManager
          as_user_id: ${store_id}
          captures: {err_window: $.data.error_id}
        - call: POST /store-ops/drivers/${drv_id}/insurance-verifications
          payload: {policy_number: POL-9001, coverage_from: '2026-08-01T00:00:00Z', coverage_to: '2026-07-01T00:00:00Z', liability_limit_cents: 10000000, expected_driver_version: '${drv_v1}'}
          as: ComplianceOfficer
          as_user_id: co-1
          captures: {err_coverage: $.data.error_id}
        assert: ['HTTP 422 with ${err_polygon} == ''ERR_INVALID_POLYGON'' for the 2-vertex ring', 'HTTP 422 with ${err_window} == ''ERR_INVALID_ZONE_WINDOW'', effective_to == effective_from failing the strict > test', 'HTTP 422 with ${err_coverage} == ''ERR_INVALID_COVERAGE_WINDOW''', 'GET /store-ops/zone-versions?store_id=${store_id} reports total_count 0', 'Driver.${drv_id}.insurance_status is still ''NONE'' and version == ${drv_v1}']
    - name: duplicate_store_number_and_license_number_are_rejected
      claim_type: violation_to_error
      grounds: [validations.priority_10, errors.ERR_STORE_NUMBER_TAKEN, errors.ERR_LICENSE_NUMBER_TAKEN]
      distinguishing_aspect: Store.store_number is unique GLOBALLY while Driver.license_number is unique only WITHIN its store, and both collisions return 409 with their own error id rather than the generic schema error.
      test_recipe:
        setup: [One store numbered 7421 with one driver holding licence DL-1001.]
        setup_api_calls:
        - call: POST /store-ops/_clock/set_current_utc
          payload: {current_utc: '2026-08-05T09:00:00Z'}
          as: StoreManager
          as_user_id: boot
        - call: POST /store-ops/stores
          payload: {store_number: '7421', name: Riverside, latitude_micro: 39000000, longitude_micro: -84000000}
          as: StoreManager
          as_user_id: boot
          captures: {store_id: $.data.id, store_v1: $.data.version}
        - call: POST /store-ops/drivers
          payload: {store_id: '${store_id}', full_name: Dana Ortiz, license_number: DL-1001, vehicle_class: CAR}
