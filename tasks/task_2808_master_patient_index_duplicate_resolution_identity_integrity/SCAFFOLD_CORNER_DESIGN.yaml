              as: IdentityAnalyst
              captures: { rec_vea_id: $.data.id }
            - call: "POST /mpi/patient-records"
              payload: { site_id: "${site_ve_id}", mrn: "VE-2000", last_name: "Duguay", first_name: "Camille", dob: "1975-09-27", sex: "F", clinical_element_count: 2 }
