            - "Batch BW1 window 08:00-11:00 holds OW1; Batch BW2 window 11:10-13:00 holds OW2."
            - "Both batches are dispatched to SW BEFORE any claim, because the selector applies the same overlap predicate and would otherwise refuse to offer BW2 at all."
