        grounds:
          - calculations.labor_budget_balance
          - entities.ProductionShift.fields.labor_hours_remaining
          - state_machines.DeboningBatch.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: deboning labor hours. Forward action (batch create
          debits the round_half_up(2000/500,2) = 4.0 estimate) paired with its
          compensating action (cancel the same SCHEDULED batch) leaves
          labor_hours_remaining exactly at its initial 10.0 — no drift.
        test_recipe:
          setup:
            - "DB-1; shift budget 10.0 (SCHEDULED is fine for create); lot FL-100 received; order due 2026-08-03; batch B1 input 2000 lb created (est 4.0 debited)"
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "DB-1", line_type: "DEBONING", rated_speed_bpm: 50 }, as: PlantManager, captures: { l2: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 10.0 }, as: PlantManager, captures: { s1: $.data.id } }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/orders", payload: { customer_name: "CustL", product_code: "THIGH_MEAT", pounds_ordered: 1500.0, temperature_requirement: "FROZEN", due_at: "2026-08-03T00:00:00Z" }, as: OrderPlanner, captures: { o1: $.data.id } }
            - { call: "POST /poultry/deboning-batches", payload: { order_id: "${o1}", flock_lot_id: "${f1}", shift_id: "${s1}", line_id: "${l2}", crew_count: 8, input_weight_lb: 2000.0 }, as: ShiftSupervisor, captures: { b1: $.data.id, est: $.data.estimated_labor_hours } }
            - { call: "GET /poultry/shifts/${s1}", as: ShiftSupervisor, captures: { rem_after_create: $.data.labor_hours_remaining } }
          trigger:
            - { call: "POST /poultry/deboning-batches/${b1}/advance", payload: { to_status: "CANCELLED" }, as: LineOperator }
            - { call: "GET /poultry/shifts/${s1}", as: ShiftSupervisor, captures: { rem_after_cancel: $.data.labor_hours_remaining } }
          assert:
            - "estimate debited at create: ${est} == 4.0 and ${rem_after_create} == 6.0 (10.0 - 4.0)"
            - "compensating cancel restores the invariant: ${rem_after_cancel} == 10.0 exactly"
            - "budget == consumed + remaining holds: 10.0 == 0.0 + 10.0 after cancel"

      - name: bird_accountability_conserved_on_certify_dispute
        grounds:
          - calculations.bird_accountability
          - entities.FlockLot.fields.carcasses_to_chill
          - entities.FlockLot.fields.condemned_accounted
          - state_machines.CondemnationRecord.CERTIFIED_to_DISPUTED
        distinguishing_aspect: |
          Conserved quantity: bird count (a different quantity than labor hours).
          Certify (+100 condemned) then dispute (-100) leaves
          carcasses_to_chill == 9950 == birds_hung_total - condemned_accounted at
          every step; the pair conserves the lot's bird accountability.
        test_recipe:
          setup:
            - "EV-1; shift RUNNING; lot received 10000/50/50000; run completed birds_hung 9950; condemnation record 100 recorded by qa-1"
          setup_api_calls:
            - { call: "POST /poultry/lines", payload: { line_code: "EV-1", line_type: "EVISCERATION", rated_speed_bpm: 200 }, as: PlantManager, captures: { l1: $.data.id } }
            - { call: "POST /poultry/shifts", payload: { shift_date: "2026-08-01", shift_code: "DAY_A", shackle_capacity_birds: 20000, labor_hours_budget: 100.0 }, as: PlantManager, captures: { s1: $.data.id, s1_v: $.data.version } }
            - { call: "POST /poultry/shifts/${s1}/staffing", payload: { shacklers_present: 10, eviscerators_present: 20, deboners_present: 12, qa_techs_present: 2, expected_shift_version: "${s1_v}" }, as: ShiftSupervisor }
            - { call: "POST /poultry/sanitation-runs", payload: { shift_id: "${s1}", line_id: "${l1}", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T02:00:00Z" }, as: SanitationLead, captures: { sr1: $.data.id } }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "IN_PROGRESS" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "COMPLETED" }, as: SanitationLead, as_user_id: "san-1" }
            - { call: "POST /poultry/sanitation-runs/${sr1}/advance", payload: { to_status: "VERIFIED" }, as: QATechnician, as_user_id: "qa-1" }
            - { call: "POST /poultry/pre-op-inspections", payload: { shift_id: "${s1}", line_id: "${l1}" }, as: QATechnician, captures: { po1: $.data.id } }
            - { call: "POST /poultry/pre-op-inspections/${po1}/advance", payload: { to_status: "PASSED" }, as: QATechnician, as_user_id: "qa-2" }
            - { call: "POST /poultry/flock-lots", payload: { lot_code: "FL-100", grower_name: "GrowerA", booked_head_count: 10000, expected_avg_live_weight_lb: 5.0, receiving_shift_id: "${s1}" }, as: ReceivingClerk, captures: { f1: $.data.id } }
            - { call: "POST /poultry/flock-lots/${f1}/receive", payload: { head_count_received: 10000, doa_count: 50, total_live_weight_lb: 50000.0 }, as: ReceivingClerk }
            - { call: "POST /poultry/line-runs", payload: { shift_id: "${s1}", line_id: "${l1}", flock_lot_id: "${f1}", planned_speed_bpm: 175 }, as: ShiftSupervisor, captures: { r1: $.data.id } }
            - { call: "POST /poultry/shifts/${s1}/transition", payload: { to_status: "RUNNING" }, as: ShiftSupervisor }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "RUNNING" }, as: LineOperator }
            - { call: "POST /poultry/line-runs/${r1}/advance", payload: { to_status: "COMPLETED", birds_hung: 9950, carcass_weight_lb: 36000.0 }, as: LineOperator }
            - { call: "POST /poultry/condemnation-records", payload: { line_run_id: "${r1}", condemnation_code: "CONTAMINATION", carcass_count: 100 }, as: QATechnician, as_user_id: "qa-1", captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /poultry/condemnation-records/${c1}/advance", payload: { to_status: "CERTIFIED" }, as: USDAInspector, as_user_id: "usda-1" }
            - { call: "GET /poultry/flock-lots/${f1}", as: PlantManager, captures: { acc1: $.data.condemned_accounted, ctc1: $.data.carcasses_to_chill, hung: $.data.birds_hung_total } }
            - { call: "POST /poultry/condemnation-records/${c1}/advance", payload: { to_status: "DISPUTED", reason: "retain for regrade" }, as: PlantManager }
            - { call: "GET /poultry/flock-lots/${f1}", as: PlantManager, captures: { acc2: $.data.condemned_accounted, ctc2: $.data.carcasses_to_chill } }
          assert:
            - "after certify: condemned_accounted ${acc1} == 100 and carcasses_to_chill ${ctc1} == 9850 (9950 - 100)"
            - "after compensating dispute: condemned_accounted ${acc2} == 0 and carcasses_to_chill ${ctc2} == 9950 (restored)"
            - "invariant holds throughout: birds_hung_total ${hung} == 9950 == condemned_accounted + carcasses_to_chill at both observations"
