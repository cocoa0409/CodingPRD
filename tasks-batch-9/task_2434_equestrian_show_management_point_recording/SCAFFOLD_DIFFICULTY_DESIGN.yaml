          - entities.Show.fields.reserved_stall_count
          - entities.Show.fields.available_stall_count
          - entities.Entry.fields.refunded_cents
        distinguishing_aspect: |
          Withdrawal is the declared compensating action for accept, and the invariant
          reserved_stall_count + available_stall_count == stall_capacity must hold identically
          before and after. The compensation is multi-part — stall release, ClassEntry
          scratching with the class counters recomputed, and a refund on the independent
          settlement dimension — so an implementation that reverses only the stall count
          leaves detectable drift in confirmed_entry_count or refunded_cents.
        test_recipe:
          setup:
            - "One APPROVED show with stall_capacity 10 and stall_fee_cents 7500."
            - "One JUMPER division and class 101 OPEN with entry_fee_cents 25000."
            - "One rider, one horse, one Entry requesting 4 stalls, one ClassEntry on class 101."
