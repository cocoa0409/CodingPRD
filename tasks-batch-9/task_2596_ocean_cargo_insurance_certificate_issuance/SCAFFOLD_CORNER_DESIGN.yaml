      - name: unknown_enums_bad_pagination_and_negative_money_are_rejected_as_invalid_request
        claim_type: error_triggerable
        grounds:
          - errors.ERR_INVALID_REQUEST
          - validations.priority_3
          - entities.Port.fields.war_risk_tier
          - entities.CommodityClass.fields.susceptibility_rating
        distinguishing_aspect: |
          Four different shapes of malformed request all collapse onto the same
          400: an enum outside the declared set, a pagination limit outside
          1..100 (both 0 and 101 are out), a negative money amount and an
          unparseable datetime. The control is that limit=100 is accepted, which
          proves the bound is inclusive rather than exclusive.
        test_recipe:
          setup:
            - "one valid Port row exists so that the list endpoints have something to page over"
          setup_api_calls:
            - call: "POST /ports"
              payload: { unlocode: "SGSIN", name: "Singapore", country_code: "SG", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { port_id: $.data.id }
          trigger:
            - call: "POST /ports"
              payload: { unlocode: "NLRTM", name: "Rotterdam", country_code: "NL", port_accumulation_limit_amount: 8000000, storage_free_days: 30, war_risk_tier: "RED" }
              as: Underwriter
              captures: { err_enum_tier: $.data.error_id }
            - call: "POST /commodity-classes"
              payload: { code: "CC-BAD", description: "Unknown susceptibility", susceptibility_rating: "S5", required_packaging_code: "EXPORT_CRATE", rate_loading_pct: 0.35, max_conveyance_share_pct: 0.80, survey_required_above_amount: 500000 }
              as: Underwriter
              captures: { err_enum_rating: $.data.error_id }
            - call: "POST /ports"
              payload: { unlocode: "USNYC", name: "New York", country_code: "US", port_accumulation_limit_amount: -1, storage_free_days: 30, war_risk_tier: "GREEN" }
              as: Underwriter
              captures: { err_negative: $.data.error_id }
            - call: "POST /open-policies"
              payload: { policy_number: "OP-BADDATE", assured_name: "Kite Trading Pte", inception_at: "2026-13-45T00:00:00Z", expiry_at: "2027-01-01T00:00:00Z", freight_basis: "PREPAID", per_certificate_limit_amount: 2000000, conveyance_limit_amount: 3000000, annual_aggregate_limit_amount: 10000000, premium_rate_per_mille: 3.500, war_rate_per_mille: 0.600, strikes_rate_per_mille: 0.255 }
              as: Underwriter
              captures: { err_datetime: $.data.error_id }
            - call: "GET /ports?limit=101"
              payload: {}
              as: Underwriter
              captures: { err_limit_high: $.data.error_id }
            - call: "GET /ports?limit=0"
              payload: {}
              as: Underwriter
              captures: { err_limit_low: $.data.error_id }
            - call: "GET /ports?limit=100"
              payload: {}
              as: Underwriter
              captures: { ok_count: $.meta.total_count }
          assert:
            - "${err_enum_tier} == \"ERR_INVALID_REQUEST\" with HTTP 400 (war_risk_tier must be GREEN, AMBER or LISTED_AREA)"
            - "${err_enum_rating} == \"ERR_INVALID_REQUEST\" with HTTP 400 (susceptibility_rating must be S1..S4)"
            - "${err_negative} == \"ERR_INVALID_REQUEST\" with HTTP 400 (negative money)"
            - "${err_datetime} == \"ERR_INVALID_REQUEST\" with HTTP 400 (month 13, day 45)"
            - "${err_limit_high} == \"ERR_INVALID_REQUEST\" and ${err_limit_low} == \"ERR_INVALID_REQUEST\", both HTTP 400"
            - "${ok_count} == 1 with limit=100 accepted — the bound is inclusive"
            - "no Port, CommodityClass or OpenPolicy row was created by any of the four rejected writes: GET /ports -> total_count == 1"

