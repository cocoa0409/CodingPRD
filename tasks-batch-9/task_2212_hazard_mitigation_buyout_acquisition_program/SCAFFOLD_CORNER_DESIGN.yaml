              as_user_id: "${proj}"
              captures: { ud2: "$.data.id" }
          assert:
            - "trigger call 1 returns 409 with data.error_id == ERR_DUPLICATE_UTILITY_TYPE"
            - "trigger call 2 returns 201; UtilityDisconnection.${ud2}.status == PENDING"
            - "GET /utility-disconnections?work_order_id=${wo1} returns total_count == 1"
            - "DemolitionWorkOrder.${wo1}.status == UTILITY_HOLD and DemolitionWorkOrder.${wo2}.status == UTILITY_HOLD"

