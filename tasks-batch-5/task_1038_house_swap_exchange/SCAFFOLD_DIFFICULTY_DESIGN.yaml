scaffold_difficulty_design:
  # =========================================================================
  # Rule 1 — dual-variant calculations across different entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: member_balance_settled_vs_available_diverge_on_open_hold
        grounds:
          - calculations.member_points_balance
          - entities.Member.fields.settled_points_balance
          - entities.Member.fields.available_points_balance
          - state_machines.ExchangeRequest.PROPOSED
        distinguishing_aspect: "On Member: settled_points_balance counts only POSTED entries (1000) while available_points_balance counts POSTED+HELD (730); the outstanding 270 HELD hold makes the two variants diverge by exactly the hold."
        test_recipe:
          setup:
            - "Guest registered, PLUS membership ACTIVE (welcome 1000 posted), host+ACTIVE listing published; guest opens a POINTS request costing 270 which places a HELD hold."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { email: "g1@x.com", full_name: "Guest One", home_city: "Boston" }
              as: Anonymous
              captures: { g: $.data.id }
            - call: "POST /members/register"
              payload: { email: "h1@x.com", full_name: "Host One", home_city: "Denver" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${g}", tier: "PLUS" }
              as: Member
              as_user_id: "${g}"
              captures: { gm: $.data.id }
            - call: "POST /memberships/${gm}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /verifications"
              payload: { member_id: "${h}", verification_type: "IDENTITY", document_ref: "doc-h" }
              as: Member
              as_user_id: "${h}"
              captures: { hv: $.data.id }
            - call: "POST /verifications/${hv}/decide"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /home-listings"
              payload: { owner_member_id: "${h}", title: "Cabin", address_city: "Denver", address_country: "US", points_per_night: 100, max_points_per_exchange: 10000, capacity: 4 }
              as: Member
              as_user_id: "${h}"
              captures: { lst: $.data.id }
            - call: "POST /home-listings/${lst}/activate"
              payload: {}
              as: Member
              as_user_id: "${h}"
              captures: { lst_v: $.data.version }
            - call: "POST /home-listings/${lst}/availability-windows"
              payload: { start_date: "2026-07-10", end_date: "2026-07-12" }
              as: Member
              as_user_id: "${h}"
              captures: { win: $.data.id }
          trigger:
            - call: "POST /exchange-requests"
              payload: { requester_member_id: "${g}", target_listing_id: "${lst}", exchange_type: "POINTS", requested_start_date: "2026-07-10", requested_end_date: "2026-07-12" }
              as: Member
              as_user_id: "${g}"
              captures: { req: $.data.id, req_cost: $.data.points_cost }
          assert:
            - "ExchangeRequest.${req}.points_cost == 270"
            - "Member.${g}.settled_points_balance == 1000"
            - "Member.${g}.available_points_balance == 730"
            - "Member.${g}.settled_points_balance != Member.${g}.available_points_balance"

      - name: damage_payout_provisional_vs_final_diverge
        grounds:
          - calculations.damage_claim_payout
          - entities.DamageClaim.fields.provisional_payout
          - entities.DamageClaim.fields.final_payout
          - state_machines.DamageClaim.FILED_to_SETTLED
        distinguishing_aspect: "On DamageClaim (a different entity domain than Member points): provisional_payout from claimed_amount=1200 is 1080, while final_payout from assessed_amount=1000 is 900 — same coverage cap, divergent variants."
        test_recipe:
          setup:
            - "A COMPLETED POINTS agreement (coverage_limit_points 5000 from host PLUS); host files a damage claim claimed_amount=1200 (provisional 1080); admin adjudicates assessed_amount=1000."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { email: "g2@x.com", full_name: "Guest Two", home_city: "Boston" }
              as: Anonymous
              captures: { g: $.data.id }
            - call: "POST /members/register"
              payload: { email: "h2@x.com", full_name: "Host Two", home_city: "Denver" }
              as: Anonymous
              captures: { h: $.data.id }
            - call: "POST /memberships"
              payload: { member_id: "${g}", tier: "PLUS" }
              as: Member
              as_user_id: "${g}"
              captures: { gm: $.data.id }
            - call: "POST /memberships/${gm}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /memberships"
              payload: { member_id: "${h}", tier: "PLUS" }
              as: Member
              as_user_id: "${h}"
              captures: { hm: $.data.id }
            - call: "POST /memberships/${hm}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /verifications"
              payload: { member_id: "${g}", verification_type: "IDENTITY", document_ref: "doc-g" }
              as: Member
              as_user_id: "${g}"
              captures: { gv: $.data.id }
            - call: "POST /verifications/${gv}/decide"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /verifications"
              payload: { member_id: "${h}", verification_type: "IDENTITY", document_ref: "doc-h" }
              as: Member
              as_user_id: "${h}"
              captures: { hv: $.data.id }
            - call: "POST /verifications/${hv}/decide"
              payload: { decision: "APPROVE" }
              as: PlatformAdmin
            - call: "POST /home-listings"
              payload: { owner_member_id: "${h}", title: "Cabin", address_city: "Denver", address_country: "US", points_per_night: 100, max_points_per_exchange: 10000, capacity: 4 }
              as: Member
              as_user_id: "${h}"
              captures: { lst: $.data.id }
            - call: "POST /home-listings/${lst}/activate"
              payload: {}
              as: Member
              as_user_id: "${h}"
              captures: { lst_v: $.data.version }
            - call: "POST /home-listings/${lst}/availability-windows"
              payload: { start_date: "2026-07-10", end_date: "2026-07-12" }
              as: Member
              as_user_id: "${h}"
              captures: { win: $.data.id }
            - call: "POST /exchange-requests"
              payload: { requester_member_id: "${g}", target_listing_id: "${lst}", exchange_type: "POINTS", requested_start_date: "2026-07-10", requested_end_date: "2026-07-12" }
              as: Member
              as_user_id: "${g}"
              captures: { req: $.data.id }
            - call: "POST /exchange-requests/${req}/accept"
              payload: { availability_window_id: "${win}", expected_listing_version: "${lst_v}" }
              as: Member
              as_user_id: "${h}"
              captures: { agr: $.data.id }
            - call: "POST /exchange-agreements/${agr}/confirm"
              payload: {}
              as: Member
              as_user_id: "${g}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exchange-agreements/${agr}/start"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-12T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exchange-agreements/${agr}/complete"
              payload: {}
              as: Member
              as_user_id: "${g}"
            - call: "POST /exchange-agreements/${agr}/damage-claims"
              payload: { claimant_member_id: "${h}", claimed_amount: 1200 }
              as: Member
              as_user_id: "${h}"
              captures: { claim: $.data.id, prov: $.data.provisional_payout }
          trigger:
            - call: "POST /damage-claims/${claim}/adjudicate"
              payload: { decision: "APPROVE", assessed_amount: 1000 }
              as: PlatformAdmin
              captures: { fin: $.data.final_payout }
          assert:
            - "DamageClaim.${claim}.provisional_payout == 1080"
            - "DamageClaim.${claim}.final_payout == 900"
            - "DamageClaim.${claim}.deductible_points == 100"
            - "DamageClaim.${claim}.provisional_payout != DamageClaim.${claim}.final_payout"

  # =========================================================================
  # Rule 2 — combinatorial formulas across different modes
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: points_cost_per_night_round_then_sum_mode_b
        grounds:
          - calculations.exchange_points_cost
          - entities.ExchangeRequest.fields.points_cost
          - entities.HomeListing.fields.points_per_night
        distinguishing_aspect: "Mode (b) rounding-order: points_per_night=75, PLUS discount 0.10, two PEAK nights → round(101.25)=101 per night then sum = 202; sum-then-round would give round(202.5)=203. The scaffold pins round-per-night-then-sum, so 202."
        test_recipe:
          setup:
            - "Guest PLUS active; listing with points_per_night=75 ACTIVE; guest opens a 2-night July (PEAK) POINTS request."
