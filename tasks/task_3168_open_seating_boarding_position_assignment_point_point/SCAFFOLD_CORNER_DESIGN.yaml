# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index (Non-Difficulty Tests)
# task_3168_open_seating_boarding_position_assignment_point_point
# Breadth probe: every §1.1–§1.7 claim not already covered by §1.8.
# Sections follow references/claim-extraction-guide.md.
# =============================================================================

scaffold_corner_design:

  # =============================================================
  # Section: entities
  # =============================================================
  - section: entities
    instances:
      - name: station_creation_defaults_applied
        claim_type: creation_with_defaults
        grounds: [ entities.Station.fields.bag_weight_limit_lbs, entities.Station.fields.min_connection_minutes ]
        distinguishing_aspect: "Creating a station with only iata_code applies documented defaults (bag_weight_limit_lbs=50, min_connection_minutes=40, station_status=ACTIVE)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st: $.data.id }
          trigger:
            - call: "GET /ops/stations/${st}"
              payload: {}
              as: OpsController
          assert:
            - "Station.bag_weight_limit_lbs == 50"
            - "Station.min_connection_minutes == 40"
            - "Station.station_status == ACTIVE"
            - "HTTP 201 on create; id/created_at/updated_at/version present"

      - name: station_not_found_returns_404
        claim_type: not_found
        grounds: [ "errors[ERR_NOT_FOUND]" ]
        distinguishing_aspect: "GET with a well-formed but non-existent UUID returns ERR_NOT_FOUND/404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /ops/stations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: OpsController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND with HTTP 404"

      - name: journey_required_field_missing_rejected
        claim_type: required_field_violation
        grounds: [ entities.PassengerJourney.fields.base_fare_cents, "errors[ERR_VALIDATION]" ]
        distinguishing_aspect: "A booking whose journey omits base_fare_cents fails with ERR_VALIDATION/400 before any state change."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, aircraft, leg L1, passenger PA all exist"]
          setup_api_calls:
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX" }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
          trigger:
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKX", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}" } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION with HTTP 400"
            - "no Booking row persisted"

      - name: leg_invalid_enum_rejected
        claim_type: type_constraint_violation
        grounds: [ entities.FlightLeg.fields.leg_status, "errors[ERR_VALIDATION]" ]
        distinguishing_aspect: "Posting a disruption with disruption_type not in {DELAY, CANCELLATION} fails with ERR_VALIDATION/400."
        test_recipe:
          setup: ["station DAL/HOU and leg L1 exist"]
          setup_api_calls:
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg: $.data.id }
          trigger:
            - call: "POST /ops/flight-legs/${leg}/disruptions"
              payload: { disruption_type: "DIVERSION", cause: "WEATHER", delay_minutes: 30 }
              as: OpsController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION with HTTP 400"

      - name: booking_computed_journey_count_ignores_input
        claim_type: computed_field
        grounds: [ entities.Booking.fields.journey_count ]
        distinguishing_aspect: "journey_count is computed from created journeys (2), not from any client-supplied value."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, leg L1, passenger PA exist"]
          setup_api_calls:
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX" }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
          trigger:
            - call: "POST /ops/bookings"
              payload: { record_locator: "BK2J", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 }, { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { bk: $.data.id }
          assert:
            - "Booking.journey_count == 2"
            - "Booking.journey_ids has length 2"

      - name: list_pagination_defaults_envelope
        claim_type: listing_pagination
        grounds: [ response_envelope ]
        distinguishing_aspect: "GET list with no params returns at most 10 items plus total_count and has_more per the fixed envelope."
        test_recipe:
          setup: ["12 stations created"]
          setup_api_calls:
            - call: "POST /ops/stations"
              payload: { iata_code: "S01" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S02" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S03" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S04" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S05" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S06" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S07" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S08" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S09" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S10" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S11" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "S12" }
              as: OpsController
          trigger:
            - call: "GET /ops/stations"
              payload: {}
              as: OpsController
          assert:
            - "response data array length == 10 (default limit)"
            - "total_count == 12 and has_more == true"
            - "second page with offset=10 returns 2 items and has_more == false"

  # =============================================================
  # Section: state_machines
  # =============================================================
  - section: state_machines
    instances:
      - name: flight_leg_arrived_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [ state_machines.FlightLeg, "errors[ERR_INVALID_STATE]" ]
        distinguishing_aspect: "An ARRIVED leg rejects a further disruption post with ERR_INVALID_STATE; terminal states accept no transitions."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, aircraft+routing on tail, captain+pairing, leg L1; boarding opened; no unboarded CHECKED_IN journeys; departed and arrived"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
              captures: { ac: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg: $.data.id }
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac}", leg_ids: ["${leg}"] }
              as: OpsController
            - call: "POST /ops/crew-members"
              payload: { employee_ref: "C1", crew_role: "CAPTAIN", qualified_fleet: "SINGLE_FLEET", base_station_code: "DAL" }
              as: OpsController
              captures: { cm: $.data.id }
            - call: "POST /ops/crew-pairings"
              payload: { pairing_date: "2026-10-01", crew_member_id: "${cm}", leg_ids: ["${leg}"] }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg}/boarding/open"
              payload: {}
              as: GateAgent
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T12:00:00Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg}/depart"
              payload: {}
              as: GateAgent
            - call: "POST /ops/flight-legs/${leg}/arrive"
              payload: {}
              as: GateAgent
          trigger:
            - call: "POST /ops/flight-legs/${leg}/disruptions"
              payload: { disruption_type: "DELAY", cause: "WEATHER", delay_minutes: 30 }
              as: OpsController
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "FlightLeg.leg_status remains ARRIVED"

      - name: bag_load_only_from_accepted
        claim_type: invalid_transition
        grounds: [ state_machines.Bag, "errors[ERR_INVALID_STATE]" ]
        distinguishing_aspect: "Offloading a bag whose leg already DEPARTED (bag is LOADED) is rejected: OFFLOADED is reachable only from ACCEPTED."
        test_recipe:
          setup: ["full flyable leg L1 with routing+pairing; passenger journey J1 CHECKED_IN with one ACCEPTED bag; boarding open; J1 scanned BOARDED; clock advanced; leg departed"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX" }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
              captures: { ac: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg: $.data.id }
            - call: "POST /ops/aircraft-routings"
              payload: { routing_date: "2026-10-01", aircraft_id: "${ac}", leg_ids: ["${leg}"] }
              as: OpsController
            - call: "POST /ops/crew-members"
              payload: { employee_ref: "C1", crew_role: "CAPTAIN", qualified_fleet: "SINGLE_FLEET", base_station_code: "DAL" }
              as: OpsController
              captures: { cm: $.data.id }
            - call: "POST /ops/crew-pairings"
              payload: { pairing_date: "2026-10-01", crew_member_id: "${cm}", leg_ids: ["${leg}"] }
              as: OpsController
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKB", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j1: "$.data.journey_ids[0]" }
            - call: "POST /ops/journeys/${j1}/check-in"
              payload: {}
              as: Passenger
              as_user_id: "${pa}"
            - call: "POST /ops/journeys/${j1}/bags"
              payload: { weight_lbs: 30 }
              as: GateAgent
              captures: { bag: $.data.id }
            - call: "POST /ops/flight-legs/${leg}/boarding/open"
              payload: {}
              as: GateAgent
            - call: "POST /ops/boarding/scan"
              payload: { journey_id: "${j1}" }
              as: GateAgent
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T12:00:00Z" }
              as: OpsController
            - call: "POST /ops/flight-legs/${leg}/depart"
              payload: {}
              as: GateAgent
          trigger:
            - call: "POST /ops/bags/${bag}/offload"
              payload: {}
              as: GateAgent
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409 (bag is LOADED; OFFLOAD only valid from ACCEPTED)"
            - "Bag.bag_status remains LOADED"

      - name: journey_initial_state_is_booked
        claim_type: initial_state
        grounds: [ state_machines.PassengerJourney ]
        distinguishing_aspect: "A newly created journey is BOOKED with no assignment rows."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, leg L1, passenger PA"]
          setup_api_calls:
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX" }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143 }
              as: OpsController
              captures: { leg: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "P A", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { pa: $.data.id }
          trigger:
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKI", journeys: [ { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${pa}"
              captures: { j1: "$.data.journey_ids[0]" }
          assert:
            - "PassengerJourney.journey_status == BOOKED"
            - "GET /ops/journeys/${j1}/boarding-assignments returns empty array"
            - "PassengerJourney.accommodation == NONE when not requested"

      - name: upgrade_refund_from_refunded_rejected
        claim_type: invalid_transition
        grounds: [ state_machines.BoardingUpgrade, "errors[ERR_INVALID_STATE]" ]
        distinguishing_aspect: "Double refund: second refund of an already-REFUNDED upgrade fails with ERR_INVALID_STATE (idempotency-by-rejection)."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, aircraft, leg L1, passenger P1 with CHECKED_IN journey J1 and one ACTIVE UPGRADED_BOARDING (position 1)"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX" }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg: $.data.id, leg_v: $.data.version }
            - call: "POST /ops/passengers"
              payload: { full_name: "P 1", date_of_birth: "1990-01-01" }
              as: Passenger
              captures: { p1: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKU", journeys: [ { passenger_id: "${p1}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 10000 } ] }
              as: Passenger
              as_user_id: "${p1}"
              captures: { j1: "$.data.journey_ids[0]" }
            - call: "POST /ops/flight-legs/${leg}/check-ins"
              payload: { journey_id: "${j1}", expected_leg_version: "${leg_v}" }
              as: Passenger
              as_user_id: "${p1}"
              captures: { leg_v2: $.data.version }
            - call: "POST /ops/flight-legs/${leg}/upgrades"
              payload: { journey_id: "${j1}", upgrade_type: "UPGRADED_BOARDING", expected_leg_version: "${leg_v2}" }
              as: Passenger
              as_user_id: "${p1}"
              captures: { upg: $.data.id }
            - call: "POST /ops/boarding-upgrades/${upg}/refund"
              payload: {}
              as: Passenger
              as_user_id: "${p1}"
          trigger:
            - call: "POST /ops/boarding-upgrades/${upg}/refund"
              payload: {}
              as: Passenger
              as_user_id: "${p1}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with HTTP 409"
            - "BoardingUpgrade.upgrade_status remains REFUNDED"

      - name: family_min_pair_consecutive_positions
        claim_type: side_effect_execution
        grounds: [ calculations.boarding_position_assignment, entities.PassengerJourney.fields.family_anchor_journey_id ]
        distinguishing_aspect: "MIN accommodation: adult and child journeys receive CONSECUTIVE FAMILY positions anchored at the earlier member's sort position even though they checked in minutes apart."
        test_recipe:
          setup: ["station DAL/HOU, fare FLEX, aircraft, leg L1; child PC (born 2022-06-01 → under 6 on 2026-10-01) journey J_KID; adult PA (is_min_eligible) journey J_ADULT anchored to J_KID; both CHECKED_IN (adult 10 min after child); one NONE-tier passenger PN checked in between them"]
          setup_api_calls:
            - call: "POST /ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-30T11:00:00Z" }
              as: OpsController
            - call: "POST /ops/stations"
              payload: { iata_code: "DAL" }
              as: OpsController
              captures: { st_dal: $.data.id }
            - call: "POST /ops/stations"
              payload: { iata_code: "HOU" }
              as: OpsController
              captures: { st_hou: $.data.id }
            - call: "POST /ops/fare-classes"
              payload: { code: "FLEX" }
              as: OpsController
              captures: { fc: $.data.id }
            - call: "POST /ops/aircraft"
              payload: { tail_number: "N100", seat_count: 143, fleet_type: "SINGLE_FLEET", home_station_code: "DAL" }
              as: OpsController
            - call: "POST /ops/flight-legs"
              payload: { flight_number: "WN1", origin_station_id: "${st_dal}", destination_station_id: "${st_hou}", scheduled_departure_utc: "2026-10-01T12:00:00Z", scheduled_arrival_utc: "2026-10-01T13:00:00Z", capacity_seats: 143, turn_target_minutes: 35 }
              as: OpsController
              captures: { leg: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "Kid C", date_of_birth: "2022-06-01" }
              as: Passenger
              captures: { pk: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "Adult A", date_of_birth: "1990-01-01", is_min_eligible: true }
              as: Passenger
              captures: { pa: $.data.id }
            - call: "POST /ops/passengers"
              payload: { full_name: "Norm N", date_of_birth: "1985-01-01" }
              as: Passenger
              captures: { pn: $.data.id }
            - call: "POST /ops/bookings"
              payload: { record_locator: "BKFAM", journeys: [ { passenger_id: "${pk}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 8000, accommodation: "FAMILY" }, { passenger_id: "${pa}", flight_leg_id: "${leg}", fare_class_id: "${fc}", base_fare_cents: 12000, accommodation: "MIN", family_anchor_journey_id: null } ] }
              as: Passenger
              as_user_id: "${pa}"
