  # =====================================================================
  # From Table 7 (RBAC)
  # =====================================================================
  - section: rbac
    instances:
      - name: clerk_cannot_approve_exemption_returns_forbidden
        claim_type: rbac_denial
        grounds:
          - roles[HealthClerk]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "HealthClerk lacks the exemption-approval operation: 403 ERR_FORBIDDEN even when the request exists."
        test_recipe:
          setup: ["student with a SUBMITTED exemption request"]
          setup_api_calls:
            - call: "POST /api/students"
              payload: { legal_name: "Rbac One", date_of_birth: "2020-06-15T00:00:00Z", grade: "K", school_code: "SCH-RB", enrollment_date: "2026-08-01T00:00:00Z" }
              as: HealthClerk
              captures: { stu_id: $.data.id }
            - call: "POST /api/students/${stu_id}/exemption-requests"
              payload: { vaccine_code: "MMR", exemption_type: "MEDICAL", document_ref: "doc://rb-1" }
              as: SchoolNurse
              as_user_id: "nurse-1"
              captures: { exm_id: $.data.id }
          trigger:
            - call: "POST /api/exemption-requests/${exm_id}/approve"
              payload: {}
              as: HealthClerk
              captures: { err: $.data.error_id }
          assert:
            - "response 403 with error_id == ERR_FORBIDDEN"

      - name: nurse_cannot_declare_outbreak_returns_forbidden
        claim_type: rbac_denial
        grounds:
