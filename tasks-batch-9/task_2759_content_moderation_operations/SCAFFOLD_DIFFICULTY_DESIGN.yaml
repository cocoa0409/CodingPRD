  - rule_id: cross_entity_state_dependency
    instances:
      - name: decide_blocked_when_reviewer_certification_voided_by_activation
        grounds:
          - validations[priority=50]
          - state_machines.PolicyVersion.ACTIVE_to_SUPERSEDED
          - entities.ModerationCase.fields.requires_recertified_review
          - endpoints.POST_/moderation/reviewers/{id}/certifications
        distinguishing_aspect: |
          Entity pair ModerationCase x Reviewer, mediated by PolicyVersion state: whether a case may
          be decided depends on a certification set that a THIRD entity's activation silently
          emptied. The same reviewer, same case and same payload fail with 422 before the
          recertification and succeed after it, with no change to the case itself.
