scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: rebate_provisional_vs_final_diverges_on_transaction
        grounds:
          - calculations.provisional_final_rebate
          - state_machines.Transaction.AUTHORIZED_to_CAPTURED
          - state_machines.Transaction.CAPTURED_to_SETTLED
          - entities.Transaction.fields.provisional_rebate_cents
          - entities.Transaction.fields.final_rebate_cents
        distinguishing_aspect: >
          On the Transaction/FleetAccount cost-accounting domain: provisional rebate uses the
          tier for month-to-date gallons INCLUDING only this transaction (tier0, cpg 5 -> 4000),
          while final rebate uses the whole-month tier (tier1, cpg 8 -> 6400); same 800 gallons,
          two variants, different cents.
        test_recipe:
          setup:
            - "Fleet with default tiers [{0,5},{1000,8},{5000,12}], clock 2026-06-01, active card+assignment on a vehicle."
            - "Tx1 800 gal captured; Tx2 400 gal captured (month total 1200 gal reaches tier1); Tx1 then settled."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Acme Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "V1", tank_capacity_gallons: 5000, expected_mpg_min: 3, expected_mpg_max: 12, home_jurisdiction: "CA", starting_odometer: 10000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Dana", pin: "1234" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "1111", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000, allowed_start_hour: 0, allowed_end_hour: 24 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { asg_id: $.data.id }
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 800, unit_price_cents: 400, odometer: 10600, jurisdiction: "CA" }
              as: Merchant
              captures: { tx1_id: $.data.id }
            - call: "POST /transactions/${tx1_id}/capture"
              payload: {}
              as: Merchant
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 400, unit_price_cents: 400, odometer: 11000, jurisdiction: "CA" }
              as: Merchant
              captures: { tx2_id: $.data.id }
            - call: "POST /transactions/${tx2_id}/capture"
              payload: {}
              as: Merchant
          trigger:
            - call: "POST /transactions/${tx1_id}/settle"
              payload: {}
              as: Merchant
          assert:
            - "Transaction.${tx1_id}.provisional_rebate_cents == 4000"
            - "Transaction.${tx1_id}.final_rebate_cents == 6400"
            - "Transaction.${tx1_id}.final_rebate_cents != Transaction.${tx1_id}.provisional_rebate_cents"

      - name: vehicle_mpg_segment_vs_rolling_diverges
        grounds:
          - calculations.vehicle_mpg
          - entities.Vehicle.fields.current_odometer
          - endpoints.GET./vehicles/{id}/mpg
        distinguishing_aspect: >
          On the Vehicle fuel-economy domain (a different entity than the rebate calc): SEGMENT
          uses only the latest fill (600 mi / 80 gal = 7.5) while ROLLING uses cumulative
          (1200 mi / 180 gal = 6.7); same odometer/gallon history, two variants, different mpg.
        test_recipe:
          setup:
            - "Vehicle starting_odometer 10000, expected band 3..12; two authorized fills on it."
            - "Fill A odo 10600 / 100 gal (segment 6.0); Fill B odo 11200 / 80 gal (segment 7.5)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Mpg Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "V2", tank_capacity_gallons: 5000, expected_mpg_min: 3, expected_mpg_max: 12, home_jurisdiction: "CA", starting_odometer: 10000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Erin", pin: "2222" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "2222", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 100, unit_price_cents: 400, odometer: 10600, jurisdiction: "CA" }
              as: Merchant
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 80, unit_price_cents: 400, odometer: 11200, jurisdiction: "CA" }
              as: Merchant
          trigger:
            - call: "GET /vehicles/${veh_id}/mpg"
              payload: { method: "SEGMENT" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "GET /vehicles/${veh_id}/mpg"
              payload: { method: "ROLLING" }
              as: FleetManager
              as_user_id: "${fa_id}"
          assert:
            - "GET /vehicles/${veh_id}/mpg?method=SEGMENT -> data.mpg == 7.5"
            - "GET /vehicles/${veh_id}/mpg?method=ROLLING -> data.mpg == 6.7"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: ifta_net_tax_multi_input_with_pump_credit
        grounds:
          - calculations.ifta_tax_owed
          - entities.IftaReport.fields.jurisdiction_lines
          - entities.IftaReport.fields.total_tax_cents
          - entities.Transaction.fields.segment_miles
        distinguishing_aspect: >
          Mode (a) — nonlinear formula over >=3 inputs (miles_j, fleet_mpg, tax_rate_j,
          gallons_purchased_j) with a conditional credit branch: CA yields -680 (net credit),
          AZ yields 260, total -420; the pump-tax credit makes a jurisdiction line go negative.
        test_recipe:
          setup:
            - "Clock in 2026-Q1; fleet base CA; one vehicle start odo 5000; card active + assignment."
            - "Tx1 CA odo 5400 (400 mi) 50 gal, Tx2 AZ odo 5900 (500 mi) 40 gal; both settled. fleet_mpg = 900/90 = 10.0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Ifta Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "V3", tank_capacity_gallons: 5000, expected_mpg_min: 3, expected_mpg_max: 20, home_jurisdiction: "CA", starting_odometer: 5000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Fran", pin: "3333" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "3333", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-01-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 50, unit_price_cents: 400, odometer: 5400, jurisdiction: "CA" }
              as: Merchant
              captures: { tx1_id: $.data.id }
            - call: "POST /transactions/${tx1_id}/capture"
              payload: {}
              as: Merchant
            - call: "POST /transactions/${tx1_id}/settle"
              payload: {}
              as: Merchant
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 40, unit_price_cents: 400, odometer: 5900, jurisdiction: "AZ" }
              as: Merchant
              captures: { tx2_id: $.data.id }
            - call: "POST /transactions/${tx2_id}/capture"
              payload: {}
              as: Merchant
            - call: "POST /transactions/${tx2_id}/settle"
              payload: {}
              as: Merchant
          trigger:
            - call: "POST /ifta-reports"
              payload: { fleet_account_id: "${fa_id}", quarter: "2026-Q1" }
              as: ProgramAdmin
              captures: { report_id: $.data.id }
          assert:
            - "IftaReport.${report_id}.total_tax_cents == -420"
            - "IftaReport.${report_id}.jurisdiction_lines[jurisdiction=CA].net_tax_cents == -680"
            - "IftaReport.${report_id}.jurisdiction_lines[jurisdiction=AZ].net_tax_cents == 260"

      - name: rebate_accrual_round_per_transaction_then_sum
        grounds:
          - calculations.provisional_final_rebate
          - entities.FleetAccount.fields.rebate_accrual_cents
          - state_machines.Transaction.AUTHORIZED_to_CAPTURED
        distinguishing_aspect: >
          Mode (b) — rounding order: two 12.5-gal fills at cpg 5 each round_half_up(62.5)=63,
          summing to 126; the sum-then-round path round(25.0*5)=125 differs by 1 cent. Scaffold
          pins round-per-transaction-THEN-sum, so rebate_accrual_cents == 126.
        test_recipe:
          setup:
            - "Fleet default tiers, clock 2026-06-01, active card+assignment; two 12.5-gal captured fills (month total 25 gal stays in tier0 cpg 5)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Round Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "V4", tank_capacity_gallons: 5000, expected_mpg_min: 3, expected_mpg_max: 30, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Gus", pin: "4444" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "4444", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 12.5, unit_price_cents: 400, odometer: 10, jurisdiction: "CA" }
              as: Merchant
              captures: { txa_id: $.data.id }
            - call: "POST /transactions/${txa_id}/capture"
              payload: {}
              as: Merchant
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 12.5, unit_price_cents: 400, odometer: 20, jurisdiction: "CA" }
              as: Merchant
              captures: { txb_id: $.data.id }
          trigger:
            - call: "POST /transactions/${txb_id}/capture"
              payload: {}
              as: Merchant
          assert:
            - "Transaction.${txa_id}.provisional_rebate_cents == 63"
            - "Transaction.${txb_id}.provisional_rebate_cents == 63"
            - "FleetAccount.${fa_id}.rebate_accrual_cents == 126"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: fraud_alert_reopen_cycle_confirmed_to_investigating
        grounds:
          - state_machines.FraudAlert.CONFIRMED_to_INVESTIGATING
          - state_machines.FraudAlert.INVESTIGATING_to_CONFIRMED
          - endpoints.POST./fraud-alerts/{id}/reopen
        distinguishing_aspect: >
          FraudAlert has a back-edge CONFIRMED->INVESTIGATING (reopen), forming the cycle
          CONFIRMED->INVESTIGATING->CONFIRMED that no linear pipeline permits — on the FraudAlert
          entity (distinct from the Transaction parallel-axis instance).
        test_recipe:
          setup:
            - "Fleet, vehicle tank 100, active card+assignment; an over-tank authorize (200 gal) creates a FraudAlert."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Fraud Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "V5", tank_capacity_gallons: 100, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Hana", pin: "5555" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "5555", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 200, unit_price_cents: 400, odometer: 100, jurisdiction: "CA" }
              as: Merchant
              captures: { tx_id: $.data.id }
            - call: "GET /fraud-alerts"
              payload: { transaction_id: "${tx_id}" }
              as: FraudAnalyst
              captures: { alert_id: "$.data[0].id" }
            - call: "POST /fraud-alerts/${alert_id}/investigate"
              payload: {}
              as: FraudAnalyst
            - call: "POST /fraud-alerts/${alert_id}/confirm"
              payload: { resolution_note: "confirmed" }
              as: FraudAnalyst
          trigger:
            - call: "POST /fraud-alerts/${alert_id}/reopen"
              payload: { resolution_note: "need another look" }
              as: FraudAnalyst
          assert:
            - "FraudAlert.${alert_id}.status == INVESTIGATING"

      - name: transaction_posting_and_review_axes_independent
        grounds:
          - state_machines.Transaction.FLAGGED_to_CLEARED
          - state_machines.Transaction.AUTHORIZED_to_CAPTURED
          - entities.Transaction.fields.posting_status
          - entities.Transaction.fields.review_status
        distinguishing_aspect: >
          On the Transaction entity, review_status (FLAGGED->CLEARED via dismiss) evolves without
          touching posting_status: a CAPTURED transaction stays CAPTURED while its review flips to
          CLEARED — two independent axes on one row (distinct from the FraudAlert cycle instance).
        test_recipe:
          setup:
            - "Fleet, vehicle tank 100, active card+assignment; over-tank authorize (200 gal) -> FLAGGED + alert; capture it (CAPTURED, still FLAGGED)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Parallel Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "V6", tank_capacity_gallons: 100, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 0 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Ivy", pin: "6666" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "6666", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
              payload: { card_id: "${card_id}", vehicle_id: "${veh_id}", driver_id: "${drv_id}", effective_from: "2026-06-01T00:00:00Z", expected_card_version: "${card_v}" }
              as: FleetManager
              as_user_id: "${fa_id}"
            - call: "POST /transactions/authorize"
              payload: { card_id: "${card_id}", product: "DIESEL", gallons: 200, unit_price_cents: 400, odometer: 100, jurisdiction: "CA" }
              as: Merchant
              captures: { tx_id: $.data.id }
            - call: "POST /transactions/${tx_id}/capture"
              payload: {}
              as: Merchant
            - call: "GET /fraud-alerts"
              payload: { transaction_id: "${tx_id}" }
              as: FraudAnalyst
              captures: { alert_id: "$.data[0].id" }
            - call: "POST /fraud-alerts/${alert_id}/investigate"
              payload: {}
              as: FraudAnalyst
          trigger:
            - call: "POST /fraud-alerts/${alert_id}/dismiss"
              payload: { resolution_note: "false positive" }
              as: FraudAnalyst
          assert:
            - "Transaction.${tx_id}.review_status == CLEARED"
            - "Transaction.${tx_id}.posting_status == CAPTURED"

  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: fraud_confirm_cascades_card_txn_ledger_depth3
        grounds:
          - state_machines.FraudAlert.INVESTIGATING_to_CONFIRMED
          - state_machines.FuelCard.ACTIVE_to_SUSPENDED
          - state_machines.Transaction.CAPTURED_to_VOIDED
          - entities.FleetAccount.fields.rebate_accrual_cents
          - entities.FleetAccount.fields.available_credit_cents
        distinguishing_aspect: >
          Confirming the alert chains FraudAlert->FuelCard(SUSPENDED)->Transaction(VOIDED)->
          FleetAccount(rebate_accrual & holds reversed) — 3 causal links each triggered by the
          prior, driving rebate_accrual_cents to 0 and available_credit back to the limit.
        test_recipe:
          setup:
            - "Fleet credit 100000000, vehicle tank 100, active card+assignment."
            - "Tx_norm 100 gal captured (accrues 500 rebate); Tx_fraud 200 gal authorized -> FLAGGED + alert."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ProgramAdmin
            - call: "POST /fleet-accounts"
              payload: { company_name: "Cascade Fleet", base_jurisdiction: "CA", credit_limit_cents: 100000000 }
              as: ProgramAdmin
              captures: { fa_id: $.data.id }
            - call: "POST /vehicles"
              payload: { fleet_account_id: "${fa_id}", plate: "V7", tank_capacity_gallons: 100, expected_mpg_min: 1, expected_mpg_max: 50, home_jurisdiction: "CA", starting_odometer: 10000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { veh_id: $.data.id }
            - call: "POST /drivers"
              payload: { fleet_account_id: "${fa_id}", full_name: "Jo", pin: "7777" }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { drv_id: $.data.id }
            - call: "POST /fuel-cards"
              payload: { fleet_account_id: "${fa_id}", last4: "7777", allowed_products: ["DIESEL"], daily_dollar_limit_cents: 100000000, per_txn_gallon_limit: 2000 }
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_id: $.data.id }
            - call: "POST /fuel-cards/${card_id}/activate"
              payload: {}
              as: FleetManager
              as_user_id: "${fa_id}"
              captures: { card_v: $.data.version }
            - call: "POST /card-assignments"
