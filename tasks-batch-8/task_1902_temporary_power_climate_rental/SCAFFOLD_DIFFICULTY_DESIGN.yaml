              as: DepotManager
              captures: { unit_id: $.data.id }
            - call: "POST /power-rental/rental-contracts"
              payload: { customer_id: "${cust_id}", site_id: "${site_id}", load_profile: [ { load_type: "CONTINUOUS", nameplate_kw: 160 } ], start_date: "2026-09-01T00:00:00Z", expected_offhire_date: "2026-09-15T00:00:00Z" }
              as: SalesEngineer
              captures: { con_id: $.data.id }
            - call: "POST /power-rental/rental-contracts/${con_id}/size-load"
              payload: { sizing_method: "NAMEPLATE_SUM" }
              as: SalesEngineer
              captures: { con_v: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/lines"
              payload: { line_type: "EQUIPMENT", equipment_unit_id: "${unit_id}", expected_rental_contract_version: "${con_v}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/quote"
              payload: {}
              as: SalesEngineer
              captures: { con_v4: $.data.version }
            - call: "POST /power-rental/rental-contracts/${con_id}/confirm"
              payload: { expected_rental_contract_version: "${con_v4}" }
              as: SalesEngineer
            - call: "POST /power-rental/rental-contracts/${con_id}/mobilize"
              payload: {}
              as: DepotManager
            - call: "POST /power-rental/rental-contracts/${con_id}/start-rental"
              payload: {}
              as: DepotManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /power-rental/service-visits"
              payload: { visit_type: "TECHNICIAN", contract_id: "${con_id}", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z", assigned_technician_id: "tech-1" }
              as: FleetDispatcher
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /power-rental/incidents"
              payload: { contract_id: "${con_id}", equipment_unit_id: "${unit_id}", incident_type: "SPILL", spill_volume_liters: 25 }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { inc_id: $.data.id }
            - call: "GET /power-rental/equipment-units/${unit_id}"
              payload: {}
              as: DepotManager
              captures: { u_status: $.data.status }
            - call: "GET /power-rental/rental-contracts/${con_id}"
              payload: {}
              as: SalesEngineer
              captures: { k_status: $.data.status }
            - call: "GET /power-rental/service-visits/${visit_id}"
              payload: {}
              as: FleetDispatcher
              captures: { v_status: $.data.status }
          assert:
            - "Incident.${inc_id}.status == REPORTED"
            - "EquipmentUnit.${unit_id}.status == QUARANTINED (link 1)"
            - "RentalContract.${con_id}.status == SUSPENDED (link 2, caused by unit quarantine)"
            - "ServiceVisit.${visit_id}.status == CANCELLED (link 3, caused by contract suspension)"

      - name: offhire_cascades_line_finalize_unit_release
        grounds:
          - state_machines.RentalContract.ON_RENT_to_OFF_HIRE
          - state_machines.RentalLine.ON_RENT_to_OFF_HIRED
