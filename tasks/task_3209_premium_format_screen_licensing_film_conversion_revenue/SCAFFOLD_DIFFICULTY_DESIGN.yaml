            - { call: "POST /v1/screen-slots", payload: { window_id: "${win_id}", auditorium_id: "${aud_a_id}", studio_film_id: "${film_x_id}", conversion_order_id: "${conv_x_id}", slot_start_date: "2026-09-07T00:00:00Z", slot_end_date: "2026-09-14T00:00:00Z", showings_per_day: 2, expected_window_version: "${win_v0}" }, as: ReleaseScheduler, captures: { slot_a_id: $.data.id } }
            - { call: "POST /v1/screen-slots/${slot_a_id}/confirm", payload: {}, as: ReleaseScheduler }
            - { call: "GET /v1/release-windows/${win_id}", payload: {}, as: ReleaseScheduler, captures: { win_v1: $.data.version } }
            - { call: "POST /v1/screen-slots", payload: { window_id: "${win_id}", auditorium_id: "${aud_b_id}", studio_film_id: "${film_y_id}", conversion_order_id: "${conv_y_id}", slot_start_date: "2026-09-07T00:00:00Z", slot_end_date: "2026-09-14T00:00:00Z", showings_per_day: 2, expected_window_version: "${win_v1}" }, as: ReleaseScheduler, captures: { slot_b_id: $.data.id } }
            - "Slot B is PROPOSED; a direct confirm would return ERR_WINDOW_CAPACITY_EXCEEDED (committed 84000 + 84000 > 90000)"
          trigger:
            - { call: "POST /v1/screen-slots/${slot_a_id}/pull", payload: {}, as: ReleaseScheduler }
          assert:
            - "ScreenSlot.${slot_a_id}.status == PULLED"
            - "ReleaseWindow.${win_id}.committed_premium_screen_seconds == 84000 (slot A removed, slot B auto-confirmed)"
            - "ScreenSlot.${slot_b_id}.status == CONFIRMED (auto-promoted)"
            - "ConversionOrder.${conv_y_id}.status == DELIVERED (cascade: it was APPROVED_FOR_RELEASE and master URL was already set; auto-confirmed slot triggers delivery transition)"

  # ===========================================================================
  # Rule 5: priority_pair_validation_conflict — different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_referential_on_slot_confirm
        grounds:
          - validations.priority_5_state
          - validations.priority_6_referential
          - errors.ERR_WINDOW_NOT_OPEN
          - errors.ERR_CONVERSION_NOT_APPROVED
        distinguishing_aspect: |
          Pair: state (priority 5) vs business_referential (priority 6). When a
          slot confirm hits both a closed window (state) AND an unapproved
          conversion (referential), the state error wins.
        test_recipe:
          setup:
            - "Standard setup. Window created but left in DRAFT (never opened). Conversion order is in SUBMITTED (not APPROVED_FOR_RELEASE)."
            - "Slot PROPOSED against this window."
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformContractManager }
            - { call: "POST /v1/markets", payload: { market_name: "Metro", country_code: "US", screen_capacity_cap: 5, target_format_mix: ["PREMIUM_2D"] }, as: NetworkPlanner, captures: { mkt_id: $.data.id } }
            - { call: "POST /v1/markets/${mkt_id}/begin-evaluation", payload: {}, as: NetworkPlanner }
            - { call: "POST /v1/markets/${mkt_id}/approve", payload: {}, as: NetworkPlanner }
