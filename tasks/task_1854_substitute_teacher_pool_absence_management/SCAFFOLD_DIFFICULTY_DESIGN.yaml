      - name: fill_rate_zero_denominator_returns_null
        grounds:
          - calculations.fill_rate_analytics
          - endpoints[GET /analytics/fill-rate]
        distinguishing_aspect: |
          Empty-set metric on a different endpoint than the day-count threshold: a school x
          day-of-week group whose only absence was cancelled has denominator 0, and the
          analytics endpoint must return fill_rate null (not 0.0, not an error) for both
          variants.
        test_recipe:
          setup:
            - "District defaults; school S3 NONE budget 1000000; teacher MATH/HIGH"
            - "Single absence Mon 2026-08-03 created and immediately cancelled"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S3", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-03", end_date: "2026-08-03", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /absences/${abs1}/cancel", payload: {}, as: Teacher, as_user_id: "${t1}" }
          trigger:
            - { call: "GET /analytics/fill-rate", payload: { from_date: "2026-08-03", to_date: "2026-08-09", school_id: "${sch}" }, as: DistrictAdmin }
          assert:
            - "Response rows contains exactly one row for (school ${sch}, day_of_week 1)"
            - "Row reported_count == 0 (the cancelled absence is excluded from the denominator)"
            - "Row sub_only_fill_rate == null and any_coverage_fill_rate == null (0/0 -> null, not 0.0)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: accept_gated_by_clearance_entity_state
        grounds:
          - state_machines.Assignment.OFFERED_to_ACCEPTED
          - state_machines.Clearance.PENDING_to_VERIFIED
          - validations[priority=10]
        distinguishing_aspect: |
          Entity pair Assignment x Clearance: the OFFERED -> ACCEPTED transition is gated by
          the state of a different entity — the substitute's clearances. Flipping the
          background check to EXPIRED (via clock advance) while the offer is still live turns
          a previously-acceptable offer into ERR_CLEARANCE_INVALID.
        test_recipe:
          setup:
            - "District with offer_response_window_minutes 10080 (7-day window); school NONE budget 1000000; teacher MATH/HIGH"
            - "Sub A qualified; BACKGROUND_CHECK expires 2026-08-05 (VERIFIED), TEACHING_CREDENTIAL expires 2027-12-31; ACTIVE"
            - "Absence Tue 2026-08-04..Wed 2026-08-05 (end exactly on the clearance expiry); offer created 2026-08-03T09:00:00Z (live until 2026-08-10T09:00)"
            - "Clock advanced to 2026-08-06T00:00:00Z — background check now expired, offer still live"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1", offer_response_window_minutes: 10080 }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Coord One", subject: "ADMIN", grade_band: "HIGH", is_coordinator: true }, as: DistrictAdmin, captures: { coord: $.data.id } }
            - { call: "POST /substitutes", payload: { full_name: "Sub A", base_daily_rate_cents: 20000 }, as: DistrictAdmin, captures: { subA: $.data.id } }
            - { call: "POST /qualifications", payload: { substitute_id: "${subA}", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-07-29T00:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "BACKGROUND_CHECK", expires_on: "2026-08-05" }, as: DistrictAdmin, captures: { clr1: $.data.id } }
            - { call: "POST /clearances/${clr1}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /clearances", payload: { substitute_id: "${subA}", clearance_type: "TEACHING_CREDENTIAL", expires_on: "2027-12-31" }, as: DistrictAdmin, captures: { clr2: $.data.id } }
            - { call: "POST /clearances/${clr2}/verify", payload: {}, as: DistrictAdmin }
            - { call: "POST /substitutes/${subA}/activate", payload: {}, as: DistrictAdmin }
            - { call: "POST /absences", payload: { staff_member_id: "${t1}", start_date: "2026-08-04", end_date: "2026-08-05", absence_type: "SICK", required_subject: "MATH", required_grade_band: "HIGH" }, as: Teacher, as_user_id: "${t1}", captures: { abs1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T09:00:00Z" }, as: DistrictAdmin }
            - { call: "POST /assignments", payload: { absence_id: "${abs1}", substitute_id: "${subA}" }, as: SchoolCoordinator, as_user_id: "${coord}", captures: { asg1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-06T00:00:00Z" }, as: DistrictAdmin }
          trigger:
            - { call: "POST /assignments/${asg1}/respond", payload: { decision: "ACCEPT" }, as: Substitute, as_user_id: "${subA}", captures: { err: $.data.error_id } }
            - { call: "GET /assignments/${asg1}", payload: {}, as: DistrictAdmin, captures: { asg_status: $.data.status } }
          assert:
            - "error_id == ERR_CLEARANCE_INVALID (the required clearance is EXPIRED at accept time although it was VERIFIED at offer time)"
            - "Assignment.${asg1}.status == OFFERED still (failed accept does not consume the offer)"
            - "The same accept would have succeeded before the clock crossed 2026-08-05 — only the Clearance entity's state changed"

      - name: payroll_export_gated_by_timesheet_states
        grounds:
          - state_machines.PayrollPeriod.OPEN_to_EXPORTED
          - state_machines.Timesheet.SUBMITTED_to_APPROVED
          - errors[ERR_PAYROLL_PERIOD_INVALID_STATE]
        distinguishing_aspect: |
          Entity pair PayrollPeriod x Timesheet: the export transition reads the states of a
          different aggregate — a single SUBMITTED timesheet anywhere in the district blocks
          export of an otherwise-valid period with ERR_PAYROLL_PERIOD_INVALID_STATE.
        test_recipe:
          setup:
            - "District defaults; school NONE budget 1000000; 1-day absence Mon 2026-08-03 filled and reported WORKED"
            - "One timesheet for 2026-08-03 left SUBMITTED (not reviewed)"
            - "PayrollPeriod 2026-08-03..2026-08-07 OPEN"
          setup_api_calls:
            - { call: "POST /districts", payload: { name: "D1" }, as: DistrictAdmin, captures: { dist: $.data.id } }
            - { call: "POST /schools", payload: { district_id: "${dist}", name: "S1", coverage_budget_total_cents: 1000000 }, as: DistrictAdmin, captures: { sch: $.data.id } }
            - { call: "POST /staff-members", payload: { school_id: "${sch}", full_name: "Teach One", subject: "MATH", grade_band: "HIGH" }, as: DistrictAdmin, captures: { t1: $.data.id } }
