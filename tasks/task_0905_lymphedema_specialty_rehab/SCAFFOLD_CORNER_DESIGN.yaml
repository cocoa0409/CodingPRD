      - name: error_open_sessions_block_plan_completion
        claim_type: Cascading validation
        grounds: ["state_machines.TreatmentPlan.ACTIVE_to_COMPLETED", "validations[priority=6]"]
        distinguishing_aspect: "Completing an ACTIVE plan that still has a SCHEDULED session returns 409 ERR_OPEN_SESSIONS_EXIST."
        test_recipe:
