      - name: duplicate_parcel_id_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=34]
          - errors.ERR_PARCEL_ID_DUPLICATE
        distinguishing_aspect: "parcel_id is the county's assessor key and is globally unique: re-registering it with a completely different address, ward and area is a 409 ERR_PARCEL_ID_DUPLICATE, not a second row and not an update of the first."
        test_recipe:
          setup:
            - "One registered parcel with parcel_id APN-203020."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203020", address: "3020 Birch Ct", situs_ward: 3, lot_area_sqft: 6000, assessed_value_cents: 300000, structure_present: true, structure_condition_grade: "C", vacancy_months: 4 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203020", address: "9999 Elsewhere Rd", situs_ward: 11, lot_area_sqft: 22000, assessed_value_cents: 10, structure_present: false, structure_condition_grade: "A", vacancy_months: 0 }
              as: IntakeOfficer
              as_user_id: "intake-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP 409 and ${err_id} == ERR_PARCEL_ID_DUPLICATE"
            - "Property.${p_id}.address == '3020 Birch Ct' and lot_area_sqft == 6000 (untouched)"
            - "exactly one Property row carries parcel_id APN-203020"

      - name: self_and_duplicate_adjacency_edges_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=36]
          - validations[priority=38]
          - errors.ERR_SELF_ADJACENCY
          - errors.ERR_ADJACENCY_DUPLICATE
        distinguishing_aspect: "The adjacency graph rejects both degenerate shapes: a self-loop is 422 ERR_SELF_ADJACENCY (priority 36) and a repeat of an existing edge is 409 ERR_ADJACENCY_DUPLICATE (priority 38) - and the duplicate check is on the UNORDERED pair, so swapping the two ids still collides."
        test_recipe:
          setup:
            - "Two registered parcels A and B with one recorded edge A-B."
          setup_api_calls:
            - call: "POST /land-bank/properties"
              payload: { parcel_id: "APN-203030", address: "3030 Cedar Ln", situs_ward: 3, lot_area_sqft: 5000, assessed_value_cents: 200000, structure_present: false, structure_condition_grade: "C", vacancy_months: 1 }
              as: IntakeOfficer
              as_user_id: "intake-1"
