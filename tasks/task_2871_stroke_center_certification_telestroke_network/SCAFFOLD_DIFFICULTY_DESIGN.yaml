      - CertificationReport.${rep4}.mean_dtn_excess_pct == 8.50 after submission as well — the CERTIFIED recomputation reruns the same pinned step order over the same FINALIZED population
      - ${draft_dtn} == 50.00 and CertificationReport.${rep4}.dtn_60_compliance_pct == 50.00 (numerator 1 of 2; both abstractions were already FINALIZED, so the variant switch changes nothing here)
      - CertificationReport.${rep4}.included_abstraction_count == 2 and closed_case_count_in_period == 2
      - CertificationReport.${rep4}.substantiated_major_count == 0 — the SYSTEM_DETECTED DTN_EXCEEDED deviation is only OPEN, so it never enters the composite penalty
      - CodeStrokeCase.${ra_id}.deviation_count == 1 and CodeStrokeCase.${rb_id}.deviation_count == 0
- rule_id: non_linear_state_machine
  instances:
  - name: consult_decline_loops_assigned_back_to_requested_then_escalates
    grounds:
    - 'state_machines.TelestrokeConsult: ASSIGNED -> REQUESTED (decline while decline_count + 1 < CONSULT_DECLINE_LIMIT)'
    - 'state_machines.TelestrokeConsult: REQUESTED -> ASSIGNED (re-routing pass)'
    - 'state_machines.TelestrokeConsult: ASSIGNED -> ESCALATED_UNFILLED (decline_count + 1 == CONSULT_DECLINE_LIMIT)'
    - calculations.consult_routing_selection (STEP 1 clause 6, excluded_neurologist_ids)
    - entities.TelestrokeConsult.fields.routing_attempt_count
    - endpoints.POST /stroke-network/consults/{id}/decline
    distinguishing_aspect: 'The non-linearity is a BACKWARD LOOP on TelestrokeConsult: ASSIGNED -> REQUESTED -> ASSIGNED inside a single decline request, with the loop-exit guard (decline_count + 1 == CONSULT_DECLINE_LIMIT) turning the second traversal of the very same trigger into a jump to the terminal ESCALATED_UNFILLED instead of another lap. The same endpoint therefore produces two different target states depending on accumulated history, and routing_attempt_count (2) diverges from decline_count (2) only because the escalating decline does not re-route.'
    test_recipe:
      setup:
      - Clock at 2026-09-01T08:00:00Z; HUB_PRIMARY + SPOKE centres and an ACTIVE TIER_1_FULL agreement with max_concurrent_consults 3.
      - 'TWO board-certified Neurologists at the hub, both ON_CALL, both licensed in CA, both holding GRANTED CONSULT_AND_THROMBOLYSIS proxy credentials: Dr Nora Ainsley with roster_rank 10 and Dr Owen Bracknell with roster_rank 20.'
      - A CodeStrokeCase at the spoke with imaging complete and one TelestrokeConsult, which the selector assigned to the rank-10 neurologist on its first pass (routing_attempt_count 1, decline_count 0).
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-09-01T08:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Metro Hub Primary Stroke Center
          facility_type: HUB_PRIMARY
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          hub_id: $.data.id
      - call: POST /stroke-network/stroke-centers
        payload:
          name: Riverside Community Spoke
          facility_type: SPOKE
          state_code: CA
          ems_region_code: CA-R1
        as: ProgramCoordinator
        captures:
          spoke_id: $.data.id
      - call: POST /stroke-network/spoke-agreements
        payload:
          hub_center_id: ${hub_id}
          spoke_center_id: ${spoke_id}
          coverage_tier: TIER_1_FULL
          max_concurrent_consults: 3
          effective_from: '2026-08-01T00:00:00Z'
          effective_until: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
        captures:
          agr_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/activate
        payload: {}
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists
        payload:
          full_name: Dr Nora Ainsley
          home_center_id: ${hub_id}
          licensed_state_codes:
          - CA
          board_certified: true
          roster_rank: 10
          concurrent_consult_limit: 2
        as: ProgramCoordinator
        captures:
          n1_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/proxy-credentials
        payload:
          neurologist_id: ${n1_id}
          privilege_scope: CONSULT_AND_THROMBOLYSIS
          expires_at: '2027-08-01T00:00:00Z'
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists/${n1_id}/on-call-state
        payload:
          on_call_state: ON_CALL
        as: ProgramCoordinator
      - call: POST /stroke-network/neurologists
        payload:
          full_name: Dr Owen Bracknell
          home_center_id: ${hub_id}
          licensed_state_codes:
          - CA
          board_certified: true
          roster_rank: 20
          concurrent_consult_limit: 2
        as: ProgramCoordinator
        captures:
          n2_id: $.data.id
      - call: POST /stroke-network/spoke-agreements/${agr_id}/proxy-credentials
