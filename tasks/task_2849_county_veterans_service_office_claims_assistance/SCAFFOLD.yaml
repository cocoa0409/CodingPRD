scenario: "2849. County Veterans Service Office & Claims Assistance (county veterans service office): veteran intake with discharge document verification and eligibility screening across benefit categories, claim preparation for disability compensation, pension and dependency benefits with evidence development, accreditation requirements for representatives and power of attorney designation, medical evidence gathering, nexus letter coordination and examination preparation, decision review and appeal option counseling with deadline tracking, state benefit programs including property tax exemptions, tuition waivers and burial benefits, outreach to underserved veterans and homeless veteran coordination, caseload management and outcome reporting to the state department"
domain_name: "county-veterans-service-office"
api_prefix: "/cvso"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - rate_threshold_triggers
    - selector_policy

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Only three read paths are
  # nested (eligibility-screens under a veteran, evidence-items under a claim,
  # outreach-events under a representative); every write endpoint addresses its
  # own top-level collection and carries FKs in the body.

  state_machine_shape: cyclic
  # Claim carries two cycles (PEER_REVIEW -> EVIDENCE_DEVELOPMENT rework and
  # DECIDED -> FILED reopen driven by a filed DecisionReview) plus a branching
  # decision fan-out; DischargeDocument cycles DISCREPANCY_HELD -> PENDING;
  # Representative cycles LAPSED -> ACTIVE; OutcomeReport cycles RETURNED ->
  # OPEN; StateBenefitApplication runs two independent state dimensions.

  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic

  role_model: segregation_of_duties
  # The accredited representative who prepares a claim can never be the
  # representative who peer-reviews it or marks it ready to file; determination
  # on a state benefit application belongs to a different role entirely.

  consistency_model: immediate

  # 14 entities / 11 state machines / 16 calculation rules of which 3 carry
  # divergent variants / two independent conserved-quantity ledgers.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
    A list endpoint sets response_type "array", puts the rows in data as a JSON
    array and carries the four pagination fields in a sibling pagination object:
    { "meta": { ... }, "response_type": "array", "data": [ ... ],
      "pagination": { "limit": 10, "offset": 0, "total_count": 0, "has_more": false } }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Representative
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: legal name of the accredited representative
        constraints: "1..120 chars"
      - name: accreditation_number
        type: string
        source: input
        description: state accreditation registry number
        constraints: "unique across all Representative rows; 1..40 chars"
      - name: accreditation_type
        type: enum
        source: input
        description: accreditation channel under which this person may represent claimants
        constraints: "COUNTY_CVSO | VSO_ORG | ATTORNEY | CLAIMS_AGENT"
      - name: accreditation_status
        type: enum
        source: system
        description: lifecycle state of the accreditation
        default: PENDING
        constraints: "PENDING | ACTIVE | LAPSED | REVOKED"
      - name: accreditation_expires_on
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) on which the accreditation lapses
      - name: ce_credits_earned
        type: integer
        source: system
        description: continuing-education credits recorded by the most recent RENEW action
        default: 0
        constraints: ">= 0"
      - name: revocation_reason
        type: string
        source: system
        description: reason text captured by the REVOKE action; null until revoked
      - name: active_poa_count
        type: integer
        source: computed
        description: count of PowerOfAttorney rows with representative_id equal to this row and status equal to ACTIVE
        default: 0
        constraints: "conserved quantity; see calculations.active_poa_count_ledger"
      - name: caseload_weight
        type: number
        source: computed
        description: weighted open-workload score used as the assignment selector ranking key
        default: 0.0
        constraints: "always an exact integer value carried in a numeric field; see calculations.representative_caseload_weight"

  - name: Veteran
    parent: null
    common_fields: true
    fields:
      - name: county_case_number
        type: string
        source: system
        description: office case number minted as CVSO-<YYYY>-<NNNNNN> where NNNNNN is the 1-based creation rank of this row among all Veteran rows ordered by created_at ASC and YYYY is the logical-clock year at creation
        constraints: "unique; never reused"
      - name: full_name
        type: string
        source: input
        description: legal name of the veteran
      - name: date_of_birth
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD)
      - name: service_start_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the veteran entered active duty as stated at intake
      - name: service_end_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the veteran separated as stated at intake
        constraints: "must be >= service_start_date"
      - name: character_of_service
        type: enum
        source: computed
        description: copied from the DischargeDocument that most recently transitioned to VERIFIED; null while no document is VERIFIED
        constraints: "HONORABLE | GENERAL | OTHER_THAN_HONORABLE | BAD_CONDUCT | DISHONORABLE | UNCHARACTERIZED"
      - name: discharge_doc_status
        type: enum
        source: computed
        description: mirrors verification_status of the DischargeDocument for this veteran with the greatest created_at; NOT_SUBMITTED while the veteran has no document
        default: NOT_SUBMITTED
        constraints: "NOT_SUBMITTED | PENDING_VERIFICATION | VERIFIED | DISCREPANCY_HELD | REJECTED"
      - name: intake_status
        type: enum
        source: system
        description: case lifecycle state of the veteran record
        default: INTAKE_STARTED
        constraints: "INTAKE_STARTED | SCREENED | ACTIVE | INACTIVE | DECEASED"
      - name: household_income_cents
        type: integer
        source: input
        description: countable annual household income in integer cents
        constraints: ">= 0"
      - name: net_worth_cents
        type: integer
        source: input
        description: countable net worth in integer cents
        constraints: ">= 0"
      - name: dependent_count
        type: integer
        source: input
        description: number of dependents claimed for compensation and income-limit purposes
        default: 0
        constraints: "0..12"
      - name: homeless_status
        type: enum
        source: input
        description: housing posture recorded at intake or by a later PATCH
        default: NOT_HOMELESS
        constraints: "NOT_HOMELESS | AT_RISK | SHELTERED | UNSHELTERED"
      - name: referral_source
        type: enum
        source: input
        description: how the veteran reached the office
        default: WALK_IN
        constraints: "WALK_IN | OUTREACH_EVENT | JAIL_INREACH | SHELTER_REFERRAL | STATE_HOTLINE"
      - name: wartime_service_days
        type: integer
        source: computed
        description: inclusive-day overlap between the VERIFIED discharge document's claimed service interval and the WARTIME_PERIODS table; see calculations.wartime_service_days
        default: 0
      - name: combined_rating_pct
        type: integer
        source: computed
        description: VA-style combined disability rating derived from this veteran's DECIDED claims; see calculations.veteran_combined_rating_pct
        default: 0
        constraints: "multiple of 10 in 0..100"
      - name: priority_group
        type: enum
        source: computed
        description: service-priority band recomputed on every screen, PATCH and rating change; see calculations.veteran_priority_group
        default: P4
        constraints: "P1 | P2 | P3 | P4"
      - name: assigned_representative_id
        type: string
        source: computed
        description: "FK -> Representative.id; nullable; set by the assignment selector and cleared when that representative is revoked"
      - name: date_of_death
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) captured by the RECORD_DEATH action; null otherwise

  - name: DischargeDocument
    parent: null
    common_fields: true
    fields:
      - name: veteran_id
        type: string
        source: input
        description: "FK -> Veteran.id; taken from the path segment of the creating endpoint"
      - name: document_type
        type: enum
        source: input
        description: kind of separation document submitted
        constraints: "DD214 | NGB22 | DD215 | STATEMENT_OF_SERVICE"
      - name: source
        type: enum
        source: input
        description: provenance of the document copy
        constraints: "VETERAN_PROVIDED | NPRC_RESPONSE | STATE_ARCHIVE"
      - name: verification_status
        type: enum
        source: system
        description: verification lifecycle state of this document
        default: PENDING_VERIFICATION
        constraints: "PENDING_VERIFICATION | VERIFIED | DISCREPANCY_HELD | REJECTED"
      - name: claimed_service_start
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) of entry on active duty as printed on the document
      - name: claimed_service_end
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) of separation as printed on the document
        constraints: "must be >= claimed_service_start"
      - name: claimed_character_of_service
        type: enum
        source: input
        description: character of service as printed on the document
        constraints: "HONORABLE | GENERAL | OTHER_THAN_HONORABLE | BAD_CONDUCT | DISHONORABLE | UNCHARACTERIZED"
      - name: discrepancy_reason
        type: string
        source: system
        description: text captured by the HOLD_DISCREPANCY or REJECT action; null otherwise
      - name: resubmission_count
        type: integer
        source: system
        description: number of times this document has cycled DISCREPANCY_HELD -> PENDING_VERIFICATION
        default: 0
      - name: verified_at
        type: datetime
        source: system
        description: logical-clock instant of the VERIFY action, ISO 8601 UTC with three fractional digits; null otherwise
      - name: verified_by_representative_id
        type: string
        source: system
        description: "FK -> Representative.id; X-User-ID of the CountyOfficer who ran the VERIFY action; null otherwise"

  - name: EligibilityScreen
    parent: null
    common_fields: false
    fields:
      - name: veteran_id
        type: string
        source: input
        description: "FK -> Veteran.id; taken from the path segment of the creating endpoint"
      - name: screen_sequence
        type: integer
        source: system
        description: 1-based ordinal of this screen among the veteran's screens ordered by created_at ASC
        constraints: ">= 1"
      - name: basic_eligibility
        type: boolean
        source: computed
        description: true when the veteran's character_of_service is in {HONORABLE, GENERAL}; false otherwise
      - name: income_limit_applied_cents
        type: integer
        source: computed
        description: INCOME_LIMIT_BASE_CENTS plus INCOME_LIMIT_PER_DEPENDENT_CENTS times dependent_count, frozen at screen time
      - name: wartime_service_days_at_screen
        type: integer
        source: computed
        description: the veteran's wartime_service_days frozen at screen time
      - name: priority_group_assigned
        type: enum
        source: computed
        description: priority band this screen assigned to the veteran
        constraints: "P1 | P2 | P3 | P4"
      - name: category_results
        type: object
        source: computed
        description: map from benefit category to an object with keys eligible (boolean) and reason (string); keys are exactly DISABILITY_COMPENSATION, PENSION, DEPENDENCY_INDEMNITY, STATE_PROPERTY_TAX_EXEMPTION, STATE_TUITION_WAIVER, BURIAL_BENEFIT; see calculations.eligibility_category_results
      - name: eligible_category_count
        type: integer
        source: computed
        description: number of keys in category_results whose eligible value is true
        constraints: "0..6"

  - name: PowerOfAttorney
    parent: null
    common_fields: true
    fields:
      - name: veteran_id
        type: string
        source: input
        description: "FK -> Veteran.id"
      - name: representative_id
        type: string
        source: input
        description: "FK -> Representative.id"
      - name: form_type
        type: enum
        source: input
        description: designation form executed by the veteran
        constraints: "VA_21_22 | VA_21_22A"
      - name: scope
        type: enum
        source: input
        description: breadth of the designation
        constraints: "ALL_BENEFITS | SPECIFIC_CLAIM"
      - name: executed_on
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the veteran signed the form
      - name: status
        type: enum
        source: system
        description: designation lifecycle state
        default: OFFERED
        constraints: "OFFERED | ACTIVE | REVOKED | SUPERSEDED"
      - name: accepted_at
        type: datetime
        source: system
        description: logical-clock instant of the veteran's acceptance, ISO 8601 UTC with three fractional digits; null otherwise
      - name: revoked_reason
        type: string
        source: system
        description: text captured by the revoke endpoint or the literal REPRESENTATIVE_ACCREDITATION_REVOKED when revoked by cascade; null otherwise

  - name: Claim
    parent: null
    common_fields: true
    fields:
      - name: veteran_id
        type: string
        source: input
        description: "FK -> Veteran.id"
      - name: poa_id
        type: string
        source: input
        description: "FK -> PowerOfAttorney.id; nullable after a representation cascade clears it"
      - name: prepared_by_representative_id
        type: string
        source: system
        description: "FK -> Representative.id; X-User-ID of the CountyOfficer who created the claim"
      - name: peer_reviewed_by_representative_id
        type: string
        source: system
        description: "FK -> Representative.id; nullable; set by SUBMIT_FOR_REVIEW from reviewer_representative_id"
      - name: claim_type
        type: enum
        source: input
        description: benefit line the claim is filed under
        constraints: "DISABILITY_COMPENSATION | PENSION | DEPENDENCY_INDEMNITY | SURVIVOR_PENSION"
      - name: claimed_conditions
        type: array
        source: input
        description: array of objects each with keys condition_code (string) and claimed_rating_pct (integer multiple of 10 in 0..100)
        constraints: "1..8 elements"
      - name: status
        type: enum
        source: system
        description: preparation and filing lifecycle state
        default: DRAFT
        constraints: "DRAFT | EVIDENCE_DEVELOPMENT | PEER_REVIEW | READY_TO_FILE | FILED | DECIDED | WITHDRAWN"
      - name: intent_to_file_date
        type: string
        source: input
        description: ISO 8601 date (YYYY-MM-DD) the veteran filed an intent to file; nullable
      - name: evidence_completeness_pct
        type: number
        source: computed
        description: weighted evidence coverage of this claim; see calculations.evidence_completeness_pct
        default: 0.00
        constraints: "2 decimal places, ROUND_HALF_UP, 0.00..100.00"
      - name: rework_count
        type: integer
        source: system
        description: number of times this claim has cycled PEER_REVIEW -> EVIDENCE_DEVELOPMENT
        default: 0
      - name: reopen_count
        type: integer
        source: system
        description: number of times this claim has cycled DECIDED -> FILED because a DecisionReview was filed
        default: 0
      - name: filed_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) supplied by the FILE action; null before filing
      - name: effective_date
        type: string
        source: computed
        description: ISO 8601 date (YYYY-MM-DD) the award runs from; see calculations.claim_retro_award_cents
      - name: effective_date_basis
        type: enum
        source: computed
        description: which variant of calculations.claim_retro_award_cents selected effective_date
        constraints: "INTENT_TO_FILE_ANCHORED | FILED_DATE_ANCHORED"
      - name: decided_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) supplied by the most recent record-decision call; null before decision
      - name: decision_outcome
        type: enum
        source: system
        description: outcome recorded from the decision letter; null before decision
        constraints: "GRANTED | PARTIAL_GRANT | DENIED"
      - name: awarded_rating_pct
        type: integer
        source: system
        description: rating granted by the decision letter
        default: 0
        constraints: "multiple of 10 in 0..100"
      - name: retro_award_cents
        type: integer
        source: computed
        description: retroactive award in integer cents; see calculations.claim_retro_award_cents
        default: 0
      - name: withdrawal_reason
        type: string
        source: system
        description: text captured by the WITHDRAW action; null otherwise

  - name: EvidenceItem
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id; taken from the path segment of the creating endpoint"
      - name: evidence_type
        type: enum
        source: input
        description: category of evidence being developed
        constraints: "SERVICE_TREATMENT_RECORD | PRIVATE_MEDICAL | VA_MEDICAL | LAY_STATEMENT | NEXUS_LETTER | DBQ"
      - name: status
        type: enum
        source: system
        description: development lifecycle state of this item
        default: REQUESTED
        constraints: "REQUESTED | RECEIVED | INSUFFICIENT | WAIVED"
      - name: provider_name
        type: string
        source: input
        description: custodian or author the item was requested from; nullable
      - name: nexus_opinion_strength
        type: enum
        source: input
        description: medical-opinion strength; only read by the scoring formula when evidence_type is NEXUS_LETTER
        default: NONE
        constraints: "NONE | POSSIBLE | AT_LEAST_AS_LIKELY_AS_NOT | HIGHLY_PROBABLE"
      - name: requested_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) equal to the logical-clock date at creation
      - name: received_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) supplied by the RECEIVE action; null otherwise
      - name: weight_points
        type: number
        source: computed
        description: this item's contribution to the claim's evidence score; see calculations.evidence_completeness_pct
        default: 0.00
        constraints: "2 decimal places, ROUND_HALF_UP"
      - name: status_reason
        type: string
        source: system
        description: text captured by MARK_INSUFFICIENT or WAIVE; null otherwise
      - name: auto_generated
        type: boolean
        source: system
        description: true when this item was synthesized by an ExamAppointment COMPLETE cascade
        default: false

  - name: ExamSite
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: contract examination facility name
      - name: county_code
        type: string
        source: input
        description: two-to-five character county code the site serves
      - name: concurrent_capacity
        type: integer
        source: input
        description: maximum number of SCHEDULED appointments whose occupied intervals may intersect
        constraints: ">= 1"
      - name: buffer_minutes
        type: integer
        source: input
        description: turnaround minutes appended to the END of every existing appointment when testing intersection; not applied before the start
        default: 0
        constraints: "0..120"
      - name: booked_slot_count
        type: integer
        source: computed
        description: count of ExamAppointment rows with exam_site_id equal to this row and status equal to SCHEDULED; see calculations.exam_slot_ledger
        default: 0

  - name: ExamAppointment
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id"
      - name: exam_site_id
        type: string
        source: input
        description: "FK -> ExamSite.id"
      - name: starts_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant with three fractional digits at which the examination begins
      - name: ends_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant with three fractional digits at which the examination ends
        constraints: "must be strictly greater than starts_at"
      - name: status
        type: enum
        source: system
        description: appointment lifecycle state
        default: SCHEDULED
        constraints: "SCHEDULED | COMPLETED | NO_SHOW | CANCELLED"
      - name: prep_session_completed
        type: boolean
        source: system
        description: true once the office has run the examination-preparation session with the veteran
        default: false
      - name: completed_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) supplied by the COMPLETE action; null otherwise
      - name: cancellation_reason
        type: string
        source: system
        description: text captured by CANCEL, or the literal REPRESENTATION_CASCADE when cancelled by a representation cascade; null otherwise

  - name: DecisionReview
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: input
        description: "FK -> Claim.id"
      - name: counseled_by_representative_id
        type: string
        source: system
        description: "FK -> Representative.id; X-User-ID of the CountyOfficer who created the counseling record"
      - name: review_lane
        type: enum
        source: input
        description: review or appeal lane counseled and then elected
        constraints: "HIGHER_LEVEL_REVIEW | SUPPLEMENTAL_CLAIM | BOARD_APPEAL_DIRECT | BOARD_APPEAL_EVIDENCE | BOARD_APPEAL_HEARING"
      - name: status
        type: enum
        source: system
        description: counseling and election lifecycle state
        default: COUNSELED
        constraints: "COUNSELED | ELECTED | FILED | WITHDRAWN | EXPIRED"
      - name: decision_notice_date
        type: string
        source: computed
        description: ISO 8601 date (YYYY-MM-DD) copied from the linked Claim.decided_on at creation
      - name: deadline_on
        type: string
        source: computed
        description: ISO 8601 date (YYYY-MM-DD) equal to decision_notice_date plus APPEAL_WINDOW_DAYS; see calculations.decision_review_deadline
      - name: days_remaining
        type: integer
        source: computed
        description: deadline_on minus the logical-clock date in whole days; negative once the window has closed; recomputed on every read
      - name: elected_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) supplied by the ELECT action; null otherwise
      - name: filed_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) supplied by the FILE action; null otherwise
      - name: closure_reason
        type: string
        source: system
        description: text captured by WITHDRAW, or the literal DEADLINE_SWEEP when the sweep expired the row; null otherwise

  - name: StateProgram
    parent: null
    common_fields: true
    fields:
      - name: program_code
        type: string
        source: input
        description: state program code
        constraints: "unique across all StateProgram rows"
      - name: program_name
        type: string
        source: input
        description: human-readable program name
      - name: program_type
        type: enum
        source: input
        description: which state benefit this program administers
        constraints: "PROPERTY_TAX_EXEMPTION | TUITION_WAIVER | BURIAL_BENEFIT"
      - name: fiscal_year
        type: integer
        source: input
        description: state fiscal year the annual pool belongs to
        constraints: "2020..2100"
      - name: annual_pool_cents
        type: integer
        source: input
        description: total cents the program may allocate in this fiscal year
        constraints: ">= 0"
      - name: allocated_cents
        type: integer
        source: computed
        description: sum of benefit_amount_cents over StateBenefitApplication rows with this program_id whose disbursement_status is in {PENDING, ISSUED}; see calculations.program_pool_ledger
        default: 0
      - name: min_rating_pct
        type: integer
        source: input
        description: minimum Veteran.combined_rating_pct required to apply and to retain an approval
        constraints: "multiple of 10 in 0..100"
      - name: requires_wartime
        type: boolean
        source: input
        description: when true the veteran needs wartime_service_days >= WARTIME_MIN_DAYS to apply
        default: false
      - name: max_award_cents
        type: integer
        source: input
        description: per-application ceiling on the gross award in integer cents
        constraints: ">= 0"

  - name: StateBenefitApplication
    parent: null
    common_fields: true
    fields:
      - name: veteran_id
        type: string
        source: input
        description: "FK -> Veteran.id"
      - name: program_id
        type: string
        source: input
        description: "FK -> StateProgram.id"
      - name: fiscal_year
        type: integer
        source: input
        description: state fiscal year this application draws from
      - name: assessed_property_value_cents
        type: integer
        source: input
        description: assessor value used by PROPERTY_TAX_EXEMPTION math; nullable for other program types
        constraints: ">= 0"
      - name: tuition_credits_requested
        type: integer
        source: input
        description: semester credits used by TUITION_WAIVER math; nullable for other program types
        constraints: "0..30"
      - name: determination_status
        type: enum
        source: system
        description: first independent state dimension - the determination made on the application
        default: SUBMITTED
        constraints: "SUBMITTED | APPROVED | DENIED"
      - name: disbursement_status
        type: enum
        source: system
        description: second independent state dimension - money movement, evolving independently of determination_status
        default: NOT_APPLICABLE
        constraints: "NOT_APPLICABLE | PENDING | ISSUED | CLAWED_BACK"
      - name: gross_award_cents
        type: integer
        source: computed
        description: pre-fee award; see calculations.state_benefit_award_cents
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: program administration fee withheld; see calculations.state_benefit_award_cents
        default: 0
      - name: benefit_amount_cents
        type: integer
        source: computed
        description: net award charged against the program pool; equals gross_award_cents minus admin_fee_cents
        default: 0
      - name: rating_at_approval_pct
        type: integer
        source: system
        description: Veteran.combined_rating_pct frozen at the moment of APPROVE
        default: 0
      - name: determination_reason
        type: string
        source: system
        description: text captured by DENY, or the literal RATING_REDUCED_BELOW_PROGRAM_MINIMUM when a rating cascade denied it; null otherwise
      - name: issued_on
        type: string
        source: system
        description: ISO 8601 date (YYYY-MM-DD) supplied by the ISSUE action; null otherwise

  - name: OutreachEvent
    parent: null
    common_fields: true
    fields:
      - name: assigned_representative_id
        type: string
        source: input
        description: "FK -> Representative.id; the single representative whose travel calendar this event occupies"
      - name: event_type
        type: enum
        source: input
        description: outreach modality
        constraints: "HOMELESS_STANDDOWN | RURAL_CLINIC | TRIBAL_OUTREACH | JAIL_INREACH"
      - name: location_name
        type: string
        source: input
        description: venue name
      - name: starts_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant with three fractional digits at which the event begins
      - name: ends_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant with three fractional digits at which the event ends
        constraints: "must be strictly greater than starts_at"
      - name: underserved_flag
        type: boolean
        source: input
        description: true when the venue is on the state underserved-area list
        default: false
      - name: status
        type: enum
        source: system
        description: event lifecycle state
        default: PLANNED
        constraints: "PLANNED | HELD | CANCELLED"
      - name: veterans_contacted
        type: integer
        source: system
        description: headcount supplied by the HOLD action
        default: 0
      - name: veterans_enrolled
        type: integer
        source: system
        description: number of contacts converted into intakes, supplied by the HOLD action
        default: 0
        constraints: "<= veterans_contacted"
      - name: cancellation_reason
        type: string
        source: system
        description: text captured by the CANCEL action; null otherwise

  - name: OutcomeReport
    parent: null
    common_fields: true
    fields:
      - name: fiscal_quarter
        type: string
        source: input
        description: calendar quarter label of the form YYYYQn covering the closed date interval described in calculations.outcome_report_performance_score
        constraints: "unique across all OutcomeReport rows; matches ^[0-9]{4}Q[1-4]$"
      - name: status
        type: enum
        source: system
        description: reporting lifecycle state
        default: OPEN
        constraints: "OPEN | SUBMITTED | ACCEPTED | RETURNED"
      - name: weighting_basis
        type: enum
        source: system
        description: which variant of calculations.outcome_report_performance_score produced the current numbers; null before the first compute
        constraints: "CLAIM_WEIGHTED | VETERAN_WEIGHTED"
      - name: filed_claim_count
        type: integer
        source: computed
        description: claims counted in the quarter denominator; see calculations.outcome_report_performance_score
        default: 0
      - name: favorable_claim_count
        type: integer
        source: computed
        description: claims counted in the quarter numerator; see calculations.outcome_report_performance_score
        default: 0
      - name: performance_score
        type: number
        source: computed
        description: office favorable-outcome percentage under the selected weighting basis
        default: 0.0
        constraints: "1 decimal place, ROUND_HALF_UP, 0.0..100.0"
      - name: retro_dollars_cents
        type: integer
        source: computed
        description: sum of retro_award_cents over the quarter's favorable decisions
        default: 0
      - name: veterans_contacted_total
        type: integer
        source: computed
        description: sum of veterans_contacted over OutreachEvent rows with status HELD whose starts_at date falls inside the quarter interval
        default: 0
      - name: certified_by_representative_id
        type: string
        source: system
        description: "FK -> Representative.id; X-User-ID of the CountyOfficer who submitted the report; null while OPEN"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of submission, ISO 8601 UTC with three fractional digits; null otherwise
      - name: return_reason
        type: string
        source: system
        description: text captured by the RETURN action; null otherwise

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Representative
    initial_state: PENDING
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /cvso/representatives/{id}/accreditation with action=ACTIVATE"
        actor: SystemAdmin
        preconditions:
          - "accreditation_status == PENDING"
        side_effects:
          - "sets accreditation_status = ACTIVE"
          - "recomputes caseload_weight per calculations.representative_caseload_weight (0.0 for a fresh row)"
          - "increments Representative.version by 1"
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /cvso/representatives/{id}/accreditation with action=LAPSE"
        actor: SystemAdmin
        preconditions:
          - "accreditation_status == ACTIVE"
        side_effects:
          - "sets accreditation_status = LAPSED"
          - "does NOT touch PowerOfAttorney rows; a lapsed representative keeps existing designations but is refused every write listed under validations[priority=50]"
          - "increments Representative.version by 1"
        note: "LAPSE is deliberately cascade-free so that validations[priority=50] can be observed in isolation."
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /cvso/representatives/{id}/accreditation with action=RENEW"
        actor: SystemAdmin
        preconditions:
          - "accreditation_status == LAPSED"
          - "ce_credits supplied in the request body >= 12 (the biennial continuing-education requirement)"
          - "accreditation_expires_on supplied in the request body is strictly after the logical-clock date"
        side_effects:
          - "sets accreditation_status = ACTIVE"
          - "overwrites accreditation_expires_on and ce_credits_earned with the supplied values"
          - "increments Representative.version by 1"
        note: "Closes the LAPSED -> ACTIVE cycle; a representative may cycle any number of times."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /cvso/representatives/{id}/accreditation with action=REVOKE"
        actor: SystemAdmin
        preconditions:
          - "accreditation_status IN {ACTIVE, LAPSED}"
        side_effects:
          - "hop 1 - sets accreditation_status = REVOKED and revocation_reason = the supplied reason"
          - "hop 1 - clears Veteran.assigned_representative_id on every Veteran whose assigned_representative_id equals this row (direct fan-out, not part of the transitive chain)"
          - "hop 2 - because the accreditation is now REVOKED, every PowerOfAttorney with representative_id equal to this row and status == ACTIVE transitions to REVOKED with revoked_reason = REPRESENTATIVE_ACCREDITATION_REVOKED, and this row's active_poa_count drops to 0"
          - "hop 3 - because those designations were revoked, every Claim whose poa_id is one of the revoked designations and whose status IN {EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE} transitions to DRAFT, has poa_id set to null and peer_reviewed_by_representative_id set to null; Claims already in DRAFT only have poa_id cleared"
          - "hop 4 - because those claims fell back to DRAFT, every ExamAppointment whose claim_id is one of them and whose status == SCHEDULED transitions to CANCELLED with cancellation_reason = REPRESENTATION_CASCADE"
          - "hop 5 - because those appointments were cancelled, each affected ExamSite.booked_slot_count is decremented by the number of appointments cancelled at that site, restoring calculations.exam_slot_ledger"
          - "recomputes caseload_weight for this row and for every Representative whose claim set changed"
          - "increments version by 1 on this Representative and on every Veteran, PowerOfAttorney, Claim, ExamAppointment and ExamSite touched above"
        note: "Transitive cascade of depth 5 originating from an accreditation revocation."
      - from: LAPSED
        to: REVOKED
        trigger: "POST /cvso/representatives/{id}/accreditation with action=REVOKE"
        actor: SystemAdmin
        preconditions:
          - "accreditation_status == LAPSED"
        side_effects:
          - "identical cascade to the ACTIVE -> REVOKED transition above"

  - entity: Veteran
    initial_state: INTAKE_STARTED
    terminal_states: [DECEASED]
    transitions:
      - from: INTAKE_STARTED
        to: SCREENED
        trigger: "POST /cvso/veterans/{id}/screen"
        actor: CountyOfficer
        preconditions:
          - "intake_status == INTAKE_STARTED"
          - "discharge_doc_status == VERIFIED"
        side_effects:
          - "creates an immutable EligibilityScreen row with screen_sequence = 1"
          - "recomputes wartime_service_days, priority_group and EligibilityScreen.category_results"
          - "sets intake_status = SCREENED"
          - "increments Veteran.version by 1"
      - from: SCREENED
        to: SCREENED
        trigger: "POST /cvso/veterans/{id}/screen (re-screen after a PATCH changed income, net worth, dependents or housing posture)"
        actor: CountyOfficer
        preconditions:
          - "intake_status IN {SCREENED, ACTIVE}"
          - "discharge_doc_status == VERIFIED"
        side_effects:
          - "creates an additional immutable EligibilityScreen row with screen_sequence = count of prior screens + 1"
          - "recomputes priority_group from the fresh inputs; intake_status is left unchanged"
          - "increments Veteran.version by 1"
        note: "Self-loop; EligibilityScreen rows are append-only and never mutated."
      - from: SCREENED
        to: ACTIVE
        trigger: "POST /cvso/veterans/{id}/assign-representative"
        actor: IntakeClerk
        preconditions:
          - "intake_status == SCREENED"
          - "either representative_id is supplied and that Representative satisfies the eligibility filter in calculations.representative_assignment_selector, or the selector's candidate set is non-empty"
        side_effects:
          - "sets assigned_representative_id to the supplied or selected Representative.id"
          - "sets intake_status = ACTIVE"
          - "recomputes caseload_weight on the assigned Representative"
          - "increments Veteran.version and Representative.version by 1"
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /cvso/veterans/{id}/status with action=DEACTIVATE"
        actor: CountyOfficer
        preconditions:
          - "intake_status == ACTIVE"
        side_effects:
          - "sets intake_status = INACTIVE"
          - "increments Veteran.version by 1"
      - from: INACTIVE
        to: ACTIVE
        trigger: "POST /cvso/veterans/{id}/status with action=REACTIVATE"
        actor: CountyOfficer
        preconditions:
          - "intake_status == INACTIVE"
        side_effects:
          - "sets intake_status = ACTIVE"
          - "increments Veteran.version by 1"
        note: "Closes the ACTIVE <-> INACTIVE cycle."
      - from: ACTIVE
        to: DECEASED
        trigger: "POST /cvso/veterans/{id}/status with action=RECORD_DEATH"
        actor: IntakeClerk
        preconditions:
          - "intake_status IN {ACTIVE, INACTIVE}"
          - "date_of_death supplied and not after the logical-clock date"
        side_effects:
          - "sets intake_status = DECEASED and date_of_death"
          - "every Claim of this veteran with status IN {DRAFT, EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE} transitions to WITHDRAWN with withdrawal_reason = CLAIMANT_DECEASED"
          - "appends a new immutable EligibilityScreen row for this veteran with screen_sequence = previous maximum + 1, recomputed per calculations.eligibility_category_results, which is where BURIAL_BENEFIT and DEPENDENCY_INDEMNITY first become true; the row is discoverable only through GET /cvso/veterans/{id}/eligibility-screens"
          - "increments Veteran.version by 1 and the version of every withdrawn Claim"
      - from: INACTIVE
        to: DECEASED
        trigger: "POST /cvso/veterans/{id}/status with action=RECORD_DEATH"
        actor: IntakeClerk
        preconditions:
          - "intake_status == INACTIVE"
        side_effects:
          - "identical to the ACTIVE -> DECEASED transition above"

  - entity: DischargeDocument
    initial_state: PENDING_VERIFICATION
    terminal_states: [VERIFIED, REJECTED]
    transitions:
      - from: PENDING_VERIFICATION
        to: VERIFIED
        trigger: "POST /cvso/discharge-documents/{id}/review with action=VERIFY"
        actor: CountyOfficer
        preconditions:
          - "verification_status == PENDING_VERIFICATION"
          - "acting Representative.accreditation_status == ACTIVE"
        side_effects:
          - "sets verification_status = VERIFIED, verified_at and verified_by_representative_id"
          - "copies claimed_character_of_service onto Veteran.character_of_service"
          - "sets Veteran.discharge_doc_status = VERIFIED"
          - "recomputes Veteran.wartime_service_days from claimed_service_start and claimed_service_end per calculations.wartime_service_days"
          - "increments DischargeDocument.version and Veteran.version by 1"
      - from: PENDING_VERIFICATION
        to: DISCREPANCY_HELD
        trigger: "POST /cvso/discharge-documents/{id}/review with action=HOLD_DISCREPANCY"
        actor: CountyOfficer
        preconditions:
          - "verification_status == PENDING_VERIFICATION"
          - "reason supplied in the request body, stored as discrepancy_reason"
        side_effects:
          - "sets verification_status = DISCREPANCY_HELD and discrepancy_reason"
          - "sets Veteran.discharge_doc_status = DISCREPANCY_HELD"
          - "increments DischargeDocument.version and Veteran.version by 1"
      - from: DISCREPANCY_HELD
        to: PENDING_VERIFICATION
        trigger: "POST /cvso/discharge-documents/{id}/resubmit"
        actor: IntakeClerk
        preconditions:
          - "verification_status == DISCREPANCY_HELD"
        side_effects:
          - "overwrites claimed_service_start, claimed_service_end and claimed_character_of_service with the corrected values"
          - "sets verification_status = PENDING_VERIFICATION, clears discrepancy_reason and increments resubmission_count by 1"
          - "sets Veteran.discharge_doc_status = PENDING_VERIFICATION"
          - "increments DischargeDocument.version and Veteran.version by 1"
        note: "Closes the DISCREPANCY_HELD -> PENDING_VERIFICATION -> DISCREPANCY_HELD cycle; the loop may run any number of times."
      - from: PENDING_VERIFICATION
        to: REJECTED
        trigger: "POST /cvso/discharge-documents/{id}/review with action=REJECT"
        actor: CountyOfficer
        preconditions:
          - "verification_status == PENDING_VERIFICATION"
          - "reason supplied in the request body, stored as discrepancy_reason"
        side_effects:
          - "sets verification_status = REJECTED and discrepancy_reason"
          - "sets Veteran.discharge_doc_status = REJECTED and leaves character_of_service null"
          - "increments DischargeDocument.version and Veteran.version by 1"
      - from: DISCREPANCY_HELD
        to: REJECTED
        trigger: "POST /cvso/discharge-documents/{id}/review with action=REJECT"
        actor: CountyOfficer
        preconditions:
          - "verification_status == DISCREPANCY_HELD"
          - "reason supplied in the request body, stored as discrepancy_reason"
        side_effects:
          - "identical to the PENDING_VERIFICATION -> REJECTED transition above"

  - entity: PowerOfAttorney
    initial_state: OFFERED
    terminal_states: [REVOKED, SUPERSEDED]
    transitions:
      - from: OFFERED
        to: ACTIVE
        trigger: "POST /cvso/powers-of-attorney/{id}/accept"
        actor: VeteranClient
        preconditions:
          - "status == OFFERED"
          - "X-User-ID equals this row's veteran_id"
          - "expected_veteran_version in the request body equals the current Veteran.version (see concurrency_rules[poa-accept-stale-veteran])"
          - "the designated Representative.accreditation_status == ACTIVE"
        side_effects:
          - "sets status = ACTIVE and accepted_at"
          - "every other PowerOfAttorney of the same veteran with status == ACTIVE transitions to SUPERSEDED, and the superseded designations' Representative.active_poa_count is each decremented by 1"
          - "increments the designated Representative.active_poa_count by 1, keeping calculations.active_poa_count_ledger balanced"
          - "increments Veteran.version by 1"
        note: "CREATE-with-supersede shape: the new designation legitimately displaces the prior one, so the stale-version check is the only deterministic guard."
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /cvso/powers-of-attorney/{id}/revoke"
        actor: VeteranClient
        preconditions:
          - "status == ACTIVE"
        side_effects:
          - "sets status = REVOKED and revoked_reason"
          - "decrements the designated Representative.active_poa_count by 1"
          - "every Claim whose poa_id equals this row and whose status IN {EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE} transitions to DRAFT with poa_id and peer_reviewed_by_representative_id set to null"
          - "every ExamAppointment of those claims with status == SCHEDULED transitions to CANCELLED with cancellation_reason = REPRESENTATION_CASCADE and its ExamSite.booked_slot_count is decremented by 1"
          - "increments PowerOfAttorney.version and the version of every touched Representative, Claim, ExamAppointment and ExamSite by 1"
      - from: OFFERED
        to: REVOKED
        trigger: "POST /cvso/powers-of-attorney/{id}/revoke"
        actor: CountyOfficer
        preconditions:
          - "status == OFFERED"
        side_effects:
          - "sets status = REVOKED and revoked_reason; active_poa_count is untouched because an OFFERED designation was never counted"
          - "increments PowerOfAttorney.version by 1"
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event - another PowerOfAttorney of the same veteran is accepted"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "a sibling designation for the same veteran_id transitions OFFERED -> ACTIVE"
        side_effects:
          - "sets status = SUPERSEDED"
          - "decrements the designated Representative.active_poa_count by 1"
          - "increments PowerOfAttorney.version and Representative.version by 1"

  - entity: Claim
    initial_state: DRAFT
    terminal_states: [WITHDRAWN]
    transitions:
      - from: DRAFT
        to: EVIDENCE_DEVELOPMENT
        trigger: "POST /cvso/claims/{id}/transitions with action=OPEN_EVIDENCE_DEVELOPMENT"
        actor: CountyOfficer
        preconditions:
          - "status == DRAFT"
          - "X-User-ID equals prepared_by_representative_id"
          - "acting Representative.accreditation_status == ACTIVE"
          - "the linked Veteran.discharge_doc_status == VERIFIED"
          - "the linked Veteran.intake_status IN {SCREENED, ACTIVE}"
          - "poa_id is not null and that PowerOfAttorney.status == ACTIVE"
        side_effects:
          - "sets status = EVIDENCE_DEVELOPMENT"
          - "recomputes evidence_completeness_pct (0.00 while no item has been received)"
          - "recomputes the preparer's caseload_weight"
          - "increments Claim.version and Representative.version by 1"
      - from: EVIDENCE_DEVELOPMENT
        to: PEER_REVIEW
        trigger: "POST /cvso/claims/{id}/transitions with action=SUBMIT_FOR_REVIEW"
        actor: CountyOfficer
        preconditions:
          - "status == EVIDENCE_DEVELOPMENT"
          - "X-User-ID equals prepared_by_representative_id"
          - "acting Representative.accreditation_status == ACTIVE"
          - "reviewer_representative_id supplied, exists, has accreditation_status == ACTIVE, and is different from prepared_by_representative_id (segregation of duties)"
          - "no EvidenceItem of this claim has status == REQUESTED"
        side_effects:
          - "sets status = PEER_REVIEW and peer_reviewed_by_representative_id = reviewer_representative_id"
          - "recomputes evidence_completeness_pct"
          - "recomputes caseload_weight for the preparer"
          - "increments Claim.version by 1"
      - from: PEER_REVIEW
        to: EVIDENCE_DEVELOPMENT
        trigger: "POST /cvso/claims/{id}/transitions with action=RETURN_FOR_REWORK"
        actor: CountyOfficer
        preconditions:
          - "status == PEER_REVIEW"
          - "X-User-ID equals peer_reviewed_by_representative_id"
          - "rework_note supplied in the request body"
        side_effects:
          - "sets status = EVIDENCE_DEVELOPMENT and increments rework_count by 1"
          - "leaves peer_reviewed_by_representative_id in place so the same reviewer is re-used on the next submission unless a different reviewer_representative_id is supplied"
          - "increments Claim.version by 1"
        note: "Closes the EVIDENCE_DEVELOPMENT <-> PEER_REVIEW rework cycle; the loop may run any number of times."
      - from: PEER_REVIEW
        to: READY_TO_FILE
        trigger: "POST /cvso/claims/{id}/transitions with action=MARK_READY"
        actor: CountyOfficer
        preconditions:
          - "status == PEER_REVIEW"
          - "X-User-ID equals peer_reviewed_by_representative_id"
          - "acting Representative.accreditation_status == ACTIVE"
          - "evidence_completeness_pct >= EVIDENCE_READY_THRESHOLD_PCT (comparison is >=, so an exact 80.00 passes)"
        side_effects:
          - "sets status = READY_TO_FILE"
          - "increments Claim.version by 1"
      - from: READY_TO_FILE
        to: FILED
        trigger: "POST /cvso/claims/{id}/transitions with action=FILE"
        actor: CountyOfficer
        preconditions:
          - "status == READY_TO_FILE"
          - "X-User-ID equals prepared_by_representative_id"
          - "acting Representative.accreditation_status == ACTIVE"
          - "filed_on supplied and not after the logical-clock date"
        side_effects:
          - "sets status = FILED and filed_on"
          - "selects effective_date_basis and effective_date per calculations.claim_retro_award_cents variant selection"
          - "recomputes the preparer's caseload_weight"
          - "increments Claim.version by 1"
      - from: FILED
        to: DECIDED
        trigger: "POST /cvso/claims/{id}/record-decision"
        actor: CountyOfficer
        preconditions:
          - "status == FILED"
          - "decided_on supplied, not after the logical-clock date, and not before filed_on"
          - "awarded_rating_pct is 0 when decision_outcome == DENIED and a multiple of 10 in 10..100 otherwise"
        side_effects:
          - "hop 1 - sets status = DECIDED, decision_outcome, awarded_rating_pct, decided_on and retro_award_cents per calculations.claim_retro_award_cents"
          - "hop 2 - because this claim is now DECIDED, the linked Veteran.combined_rating_pct is recomputed per calculations.veteran_combined_rating_pct and priority_group is re-derived"
          - "hop 3 - because combined_rating_pct changed, every StateBenefitApplication of that veteran with determination_status == APPROVED whose StateProgram.min_rating_pct now exceeds the new combined_rating_pct transitions to determination_status = DENIED with determination_reason = RATING_REDUCED_BELOW_PROGRAM_MINIMUM and disbursement_status = CLAWED_BACK"
          - "hop 4 - because those applications were clawed back, each affected StateProgram.allocated_cents is decremented by that application's benefit_amount_cents, restoring calculations.program_pool_ledger"
          - "recomputes the preparer's caseload_weight (a DECIDED claim leaves the open-workload set)"
          - "increments version by 1 on the Claim, the Veteran and every touched StateBenefitApplication and StateProgram"
        note: "Transitive cascade of depth 4 originating from a recorded decision; reachable a second time through the DECIDED -> FILED reopen, which is how a rating reduction becomes observable."
      - from: DECIDED
        to: FILED
        trigger: "system event - POST /cvso/decision-reviews/{id}/status with action=FILE on a DecisionReview whose claim_id is this claim"
        actor: system
        preconditions:
          - "status == DECIDED"
          - "the DecisionReview transitions ELECTED -> FILED"
        side_effects:
          - "sets status = FILED and increments reopen_count by 1"
          - "retains decision_outcome, awarded_rating_pct, decided_on and retro_award_cents until the next record-decision overwrites them"
          - "recomputes the preparer's caseload_weight (the claim re-enters the open-workload set)"
          - "increments Claim.version by 1"
        note: "Closes the DECIDED -> FILED -> DECIDED cycle; a revised decision may lower awarded_rating_pct, which is what drives the rating-reduction cascade."
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /cvso/claims/{id}/transitions with action=WITHDRAW"
        actor: CountyOfficer
        preconditions:
          - "status IN {DRAFT, EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE}"
          - "X-User-ID equals prepared_by_representative_id"
          - "reason supplied in the request body"
        side_effects:
          - "sets status = WITHDRAWN and withdrawal_reason"
          - "every ExamAppointment of this claim with status == SCHEDULED transitions to CANCELLED with cancellation_reason = CLAIM_WITHDRAWN and its ExamSite.booked_slot_count is decremented by 1"
          - "every EvidenceItem of this claim with status == REQUESTED transitions to WAIVED with status_reason = CLAIM_WITHDRAWN"
          - "recomputes the preparer's caseload_weight"
          - "increments Claim.version and the version of every touched EvidenceItem, ExamAppointment and ExamSite by 1"
      - from: EVIDENCE_DEVELOPMENT
        to: DRAFT
        trigger: "system event - the claim's PowerOfAttorney is revoked directly or by an accreditation-revocation cascade"
        actor: system
        preconditions:
          - "status IN {EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE}"
          - "the PowerOfAttorney referenced by poa_id transitions to REVOKED"
        side_effects:
          - "sets status = DRAFT, poa_id = null and peer_reviewed_by_representative_id = null"
          - "cancels this claim's SCHEDULED ExamAppointment rows and decrements each ExamSite.booked_slot_count by 1"
          - "increments Claim.version by 1"

  - entity: EvidenceItem
    initial_state: REQUESTED
    terminal_states: [WAIVED]
    transitions:
      - from: REQUESTED
        to: RECEIVED
        trigger: "POST /cvso/evidence-items/{id}/status with action=RECEIVE"
        actor: CountyOfficer
        preconditions:
          - "status IN {REQUESTED, INSUFFICIENT}"
          - "the linked Claim.status IN {EVIDENCE_DEVELOPMENT, PEER_REVIEW}"
          - "the logical-clock date, which is what received_on is set to, is not before requested_on"
        side_effects:
          - "sets status = RECEIVED and received_on = the logical-clock date"
          - "recomputes this row's weight_points and the linked Claim.evidence_completeness_pct per calculations.evidence_completeness_pct"
          - "increments EvidenceItem.version and Claim.version by 1"
      - from: RECEIVED
        to: INSUFFICIENT
        trigger: "POST /cvso/evidence-items/{id}/status with action=MARK_INSUFFICIENT"
        actor: CountyOfficer
        preconditions:
          - "status == RECEIVED"
          - "the linked Claim.status IN {EVIDENCE_DEVELOPMENT, PEER_REVIEW}"
          - "reason supplied in the request body"
        side_effects:
          - "sets status = INSUFFICIENT, status_reason and clears received_on"
          - "recomputes weight_points to 0.00 and the linked Claim.evidence_completeness_pct"
          - "increments EvidenceItem.version and Claim.version by 1"
      - from: INSUFFICIENT
        to: REQUESTED
        trigger: "POST /cvso/evidence-items/{id}/status with action=RE_REQUEST"
        actor: CountyOfficer
        preconditions:
          - "status == INSUFFICIENT"
          - "the linked Claim.status IN {EVIDENCE_DEVELOPMENT, PEER_REVIEW}"
        side_effects:
          - "sets status = REQUESTED and overwrites requested_on with the logical-clock date, restarting the timeliness window"
          - "recomputes the linked Claim.evidence_completeness_pct"
          - "increments EvidenceItem.version and Claim.version by 1"
        note: "Closes the RECEIVED -> INSUFFICIENT -> REQUESTED -> RECEIVED cycle; each pass through RE_REQUEST resets the timeliness multiplier baseline."
      - from: REQUESTED
        to: WAIVED
        trigger: "POST /cvso/evidence-items/{id}/status with action=WAIVE"
        actor: CountyOfficer
        preconditions:
          - "status IN {REQUESTED, INSUFFICIENT}"
          - "the linked Claim.status IN {EVIDENCE_DEVELOPMENT, PEER_REVIEW}"
          - "reason supplied in the request body"
        side_effects:
          - "sets status = WAIVED and status_reason"
          - "recomputes weight_points at WAIVE_FACTOR of the type weight and the linked Claim.evidence_completeness_pct"
          - "increments EvidenceItem.version and Claim.version by 1"
      - from: INSUFFICIENT
        to: WAIVED
        trigger: "POST /cvso/evidence-items/{id}/status with action=WAIVE"
        actor: CountyOfficer
        preconditions:
          - "status == INSUFFICIENT"
        side_effects:
          - "identical to the REQUESTED -> WAIVED transition above"

  - entity: ExamAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /cvso/exam-appointments/{id}/status with action=COMPLETE"
        actor: CountyOfficer
        preconditions:
          - "status == SCHEDULED"
          - "prep_session_completed == true"
          - "completed_on supplied and not after the logical-clock date"
        side_effects:
          - "sets status = COMPLETED and completed_on"
          - "decrements the ExamSite.booked_slot_count by 1, restoring calculations.exam_slot_ledger"
          - "creates an EvidenceItem on the linked claim with evidence_type = DBQ, status = RECEIVED, received_on = completed_on, nexus_opinion_strength = NONE and auto_generated = true"
          - "because that item is RECEIVED, the linked Claim.evidence_completeness_pct is recomputed"
          - "increments ExamAppointment.version, ExamSite.version and Claim.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /cvso/exam-appointments/{id}/status with action=NO_SHOW"
        actor: CountyOfficer
        preconditions:
          - "status == SCHEDULED"
          - "the logical-clock instant is at or after ends_at"
        side_effects:
          - "sets status = NO_SHOW"
          - "decrements the ExamSite.booked_slot_count by 1"
          - "increments ExamAppointment.version and ExamSite.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /cvso/exam-appointments/{id}/status with action=CANCEL"
        actor: CountyOfficer
        preconditions:
          - "status == SCHEDULED"
          - "reason supplied in the request body"
        side_effects:
          - "sets status = CANCELLED and cancellation_reason"
          - "decrements the ExamSite.booked_slot_count by 1, restoring calculations.exam_slot_ledger to its pre-schedule value"
          - "increments ExamAppointment.version and ExamSite.version by 1"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /cvso/exam-appointments/{id}/status with action=COMPLETE_PREP"
        actor: CountyOfficer
        preconditions:
          - "status == SCHEDULED"
          - "prep_session_completed == false"
        side_effects:
          - "sets prep_session_completed = true"
          - "increments ExamAppointment.version by 1"
        note: "Self-loop that gates COMPLETE; examination-preparation coaching must be logged before an exam can be closed out."

  - entity: DecisionReview
    initial_state: COUNSELED
    terminal_states: [FILED, WITHDRAWN, EXPIRED]
    transitions:
      - from: COUNSELED
        to: ELECTED
        trigger: "POST /cvso/decision-reviews/{id}/status with action=ELECT"
        actor: CountyOfficer
        preconditions:
          - "status == COUNSELED"
          - "days_remaining >= 0 (comparison is >=, so the deadline date itself is still electable)"
          - "elected_on supplied and not after the logical-clock date"
        side_effects:
          - "sets status = ELECTED, elected_on and, when review_lane is supplied, overwrites review_lane with the elected lane"
          - "increments DecisionReview.version by 1"
      - from: ELECTED
        to: FILED
        trigger: "POST /cvso/decision-reviews/{id}/status with action=FILE"
        actor: CountyOfficer
        preconditions:
          - "status == ELECTED"
          - "days_remaining >= 0"
          - "filed_on supplied and not after the logical-clock date"
        side_effects:
          - "sets status = FILED and filed_on"
          - "the linked Claim transitions DECIDED -> FILED and its reopen_count is incremented by 1"
          - "increments DecisionReview.version and Claim.version by 1"
      - from: COUNSELED
        to: WITHDRAWN
        trigger: "POST /cvso/decision-reviews/{id}/status with action=WITHDRAW"
        actor: VeteranClient
        preconditions:
          - "status IN {COUNSELED, ELECTED}"
          - "reason supplied in the request body"
        side_effects:
          - "sets status = WITHDRAWN and closure_reason"
          - "increments DecisionReview.version by 1"
      - from: ELECTED
        to: WITHDRAWN
        trigger: "POST /cvso/decision-reviews/{id}/status with action=WITHDRAW"
        actor: VeteranClient
        preconditions:
          - "status == ELECTED"
        side_effects:
          - "identical to the COUNSELED -> WITHDRAWN transition above"
      - from: COUNSELED
        to: EXPIRED
        trigger: "POST /cvso/decision-reviews/sweep-expirations"
        actor: SystemAdmin
        preconditions:
          - "status IN {COUNSELED, ELECTED}"
          - "days_remaining < 0 at the current logical-clock position"
        side_effects:
          - "sets status = EXPIRED and closure_reason = DEADLINE_SWEEP"
          - "increments DecisionReview.version by 1"
        note: "Ops-run checkpoint; the sweep is idempotent because EXPIRED rows are no longer in the candidate set."
      - from: ELECTED
        to: EXPIRED
        trigger: "POST /cvso/decision-reviews/sweep-expirations"
        actor: SystemAdmin
        preconditions:
          - "status == ELECTED"
          - "days_remaining < 0"
        side_effects:
          - "identical to the COUNSELED -> EXPIRED transition above"

  - entity: StateBenefitApplication
    initial_state: SUBMITTED
    terminal_states: [DENIED, CLAWED_BACK]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /cvso/state-benefit-applications/{id}/determination with action=APPROVE"
        actor: StateAuditor
        preconditions:
          - "determination_status == SUBMITTED"
          - "the linked Veteran.combined_rating_pct >= StateProgram.min_rating_pct"
          - "when StateProgram.requires_wartime is true, the linked Veteran.wartime_service_days >= WARTIME_MIN_DAYS (90)"
          - "StateProgram.allocated_cents plus the newly computed benefit_amount_cents <= StateProgram.annual_pool_cents (comparison is <=, so an allocation that exactly fills the pool is accepted)"
        side_effects:
          - "computes gross_award_cents, admin_fee_cents and benefit_amount_cents per calculations.state_benefit_award_cents"
          - "sets determination_status = APPROVED and rating_at_approval_pct = the veteran's current combined_rating_pct"
          - "moves the independent disbursement dimension NOT_APPLICABLE -> PENDING"
          - "increases StateProgram.allocated_cents by benefit_amount_cents, keeping calculations.program_pool_ledger balanced"
          - "increments StateBenefitApplication.version and StateProgram.version by 1"
        note: "Determination dimension; the disbursement dimension is advanced as a coupled initialization here and then evolves on its own."
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /cvso/state-benefit-applications/{id}/determination with action=DENY"
        actor: StateAuditor
        preconditions:
          - "determination_status == SUBMITTED"
          - "reason supplied in the request body"
        side_effects:
          - "sets determination_status = DENIED and determination_reason"
          - "leaves disbursement_status at NOT_APPLICABLE and StateProgram.allocated_cents unchanged"
          - "increments StateBenefitApplication.version by 1"
      - from: PENDING
        to: ISSUED
        trigger: "POST /cvso/state-benefit-applications/{id}/disbursement with action=ISSUE"
        actor: SystemAdmin
        preconditions:
          - "disbursement_status == PENDING"
          - "determination_status == APPROVED"
          - "issued_on supplied and not after the logical-clock date"
        side_effects:
          - "sets disbursement_status = ISSUED and issued_on; determination_status is untouched"
          - "StateProgram.allocated_cents is unchanged because both PENDING and ISSUED are inside the ledger's inclusion set"
          - "increments StateBenefitApplication.version by 1"
        note: "Disbursement dimension moves without any determination-dimension transition, which is what makes the two dimensions independent."
      - from: PENDING
        to: CLAWED_BACK
        trigger: "system event - a recorded decision lowers the veteran's combined_rating_pct below StateProgram.min_rating_pct"
        actor: system
        preconditions:
          - "determination_status == APPROVED"
          - "disbursement_status IN {PENDING, ISSUED}"
          - "the linked Veteran.combined_rating_pct < StateProgram.min_rating_pct after a rating recomputation"
        side_effects:
          - "sets disbursement_status = CLAWED_BACK and, on the determination dimension, determination_status = DENIED with determination_reason = RATING_REDUCED_BELOW_PROGRAM_MINIMUM"
          - "decreases StateProgram.allocated_cents by benefit_amount_cents, exactly reversing the APPROVE allocation"
          - "increments StateBenefitApplication.version and StateProgram.version by 1"
      - from: ISSUED
        to: CLAWED_BACK
        trigger: "system event - a recorded decision lowers the veteran's combined_rating_pct below StateProgram.min_rating_pct"
        actor: system
        preconditions:
          - "disbursement_status == ISSUED"
        side_effects:
          - "identical to the PENDING -> CLAWED_BACK transition above"
      - from: PENDING
        to: CLAWED_BACK
        trigger: "POST /cvso/state-benefit-applications/{id}/disbursement with action=CLAW_BACK"
        actor: SystemAdmin
        preconditions:
          - "disbursement_status IN {PENDING, ISSUED}"
          - "reason supplied in the request body"
        side_effects:
          - "sets disbursement_status = CLAWED_BACK; determination_status is left as APPROVED because an operator recovery is not a re-adjudication"
          - "decreases StateProgram.allocated_cents by benefit_amount_cents, exactly reversing the APPROVE allocation"
          - "increments StateBenefitApplication.version and StateProgram.version by 1"
        note: "Operator-driven compensating transition; distinct from the system-event claw-back above in that it leaves the determination dimension untouched, so the two dimensions are observably independent."
      - from: ISSUED
        to: CLAWED_BACK
        trigger: "POST /cvso/state-benefit-applications/{id}/disbursement with action=CLAW_BACK"
        actor: SystemAdmin
        preconditions:
          - "disbursement_status == ISSUED"
          - "reason supplied in the request body"
        side_effects:
          - "identical to the operator-driven PENDING -> CLAWED_BACK transition above"

  - entity: OutreachEvent
    initial_state: PLANNED
    terminal_states: [HELD, CANCELLED]
    transitions:
      - from: PLANNED
        to: HELD
        trigger: "POST /cvso/outreach-events/{id}/status with action=HOLD"
        actor: CountyOfficer
        preconditions:
          - "status == PLANNED"
          - "the logical-clock instant is at or after starts_at"
          - "veterans_contacted and veterans_enrolled supplied with veterans_enrolled <= veterans_contacted"
        side_effects:
          - "sets status = HELD, veterans_contacted and veterans_enrolled"
          - "recomputes the assigned Representative.caseload_weight (a HELD event leaves the planned-outreach set)"
          - "increments OutreachEvent.version and Representative.version by 1"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /cvso/outreach-events/{id}/status with action=CANCEL"
        actor: CountyOfficer
        preconditions:
          - "status == PLANNED"
          - "reason supplied in the request body"
        side_effects:
          - "sets status = CANCELLED and cancellation_reason"
          - "recomputes the assigned Representative.caseload_weight"
          - "frees the representative's travel window so a later event may occupy it"
          - "increments OutreachEvent.version and Representative.version by 1"

  - entity: OutcomeReport
    initial_state: OPEN
    terminal_states: [ACCEPTED]
    transitions:
      - from: OPEN
        to: SUBMITTED
        trigger: "POST /cvso/outcome-reports/{id}/submit"
        actor: CountyOfficer
        preconditions:
          - "status == OPEN"
          - "weighting_basis is not null, i.e. the report has been computed at least once"
          - "acting Representative.accreditation_status == ACTIVE"
        side_effects:
          - "sets status = SUBMITTED, certified_by_representative_id = X-User-ID and submitted_at"
          - "increments OutcomeReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /cvso/outcome-reports/{id}/review with action=ACCEPT"
        actor: StateAuditor
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "sets status = ACCEPTED"
          - "increments OutcomeReport.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /cvso/outcome-reports/{id}/review with action=RETURN"
        actor: StateAuditor
        preconditions:
          - "status == SUBMITTED"
          - "reason supplied in the request body, stored as return_reason"
        side_effects:
          - "sets status = RETURNED and return_reason"
          - "increments OutcomeReport.version by 1"
      - from: RETURNED
        to: OPEN
        trigger: "POST /cvso/outcome-reports/{id}/reopen"
        actor: SystemAdmin
        preconditions:
          - "status == RETURNED"
        side_effects:
          - "sets status = OPEN, clears certified_by_representative_id and submitted_at, and leaves the previously computed figures in place until the next compute overwrites them"
          - "increments OutcomeReport.version by 1"
        note: "Closes the OPEN -> SUBMITTED -> RETURNED -> OPEN cycle; the loop may run any number of times."

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: poa-accept-stale-veteran
    parent_entity: Veteran
    write_endpoint: "POST /cvso/powers-of-attorney/{id}/accept"
    occ_field: "expected_veteran_version"
    description: |
      Accepting a power-of-attorney designation against a Veteran whose version
      has advanced since the client last read it is rejected. This captures the
      case where a different designation for the same veteran has already been
      accepted and legitimately supersedes any prior one under the
      PowerOfAttorney OFFERED -> ACTIVE transition, so the accepting client's
      view of the veteran record is stale.
    error_id: ERR_STALE_VETERAN_VERSION
    http_status: 412
  - rule_id: benefit-application-stale-program
    parent_entity: StateProgram
    write_endpoint: "POST /cvso/state-benefit-applications"
    occ_field: "expected_program_version"
    description: |
      Creating a state benefit application against a StateProgram whose version
      has advanced since the client last read it is rejected. A program may
      legitimately accept many applications against the same annual pool, so a
      second sequential create would otherwise succeed while reasoning from an
      allocated_cents figure that an intervening determination has already moved.
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: wartime_service_days
    trigger: "on the DischargeDocument PENDING_VERIFICATION -> VERIFIED transition, and re-read by every POST /cvso/veterans/{id}/screen"
    algorithm: interval_merge
    formula: |
      # Closed, inclusive-on-both-ends day counting against a fixed, disjoint
      # period table. Because WARTIME_PERIODS never overlap each other, no
      # day is ever counted twice.
      total = 0
      for (p_start, p_end) in WARTIME_PERIODS:          # evaluated in table order
          lo = max(document.claimed_service_start, p_start)
          hi = min(document.claimed_service_end,   p_end)
          if hi >= lo:
              total = total + (hi - lo).days + 1        # +1 makes both ends inclusive
      Veteran.wartime_service_days = total
    input_set: "exactly one document - the DischargeDocument for this veteran with verification_status == VERIFIED and the greatest created_at; documents in PENDING_VERIFICATION, DISCREPANCY_HELD or REJECTED contribute nothing and leave wartime_service_days at 0"
    constants:
      WARTIME_PERIODS: [["1961-02-28", "1975-05-07"], ["1990-08-02", "1991-04-11"], ["2001-09-11", "2021-08-30"]]
      WARTIME_MIN_DAYS: 90
    precision: "whole days, no rounding"

  - name: veteran_priority_group
    trigger: "on every POST /cvso/veterans/{id}/screen, every PATCH /cvso/veterans/{id} that changes household_income_cents, net_worth_cents, dependent_count or homeless_status, and on every recomputation of combined_rating_pct"
    algorithm: threshold
    formula: |
      income_limit_cents = INCOME_LIMIT_BASE_CENTS
                         + INCOME_LIMIT_PER_DEPENDENT_CENTS * dependent_count
      if homeless_status IN {UNSHELTERED, SHELTERED} or combined_rating_pct >= 50:
          priority_group = "P1"
      elif combined_rating_pct >= 30 or homeless_status == "AT_RISK":
          priority_group = "P2"
      elif household_income_cents <= income_limit_cents:
          priority_group = "P3"
      else:
          priority_group = "P4"
    input_set: "fields of the single Veteran row only; the branches are evaluated strictly top to bottom and the first match wins"
    constants:
      INCOME_LIMIT_BASE_CENTS: 1884000
      INCOME_LIMIT_PER_DEPENDENT_CENTS: 483000
      P1_RATING_FLOOR_PCT: 50
      P2_RATING_FLOOR_PCT: 30
    precision: "exact integer comparisons; both rating comparisons are >= so a combined rating of exactly 50 yields P1 and exactly 30 yields P2"

  - name: eligibility_category_results
    trigger: "on POST /cvso/veterans/{id}/screen, and on the Veteran ACTIVE/INACTIVE -> DECEASED transition which appends a survivor screen; the result is frozen into the new immutable EligibilityScreen row"
    algorithm: constraint_propagation
    formula: |
      basic = character_of_service IN {HONORABLE, GENERAL}
      income_limit_cents = INCOME_LIMIT_BASE_CENTS
                         + INCOME_LIMIT_PER_DEPENDENT_CENTS * dependent_count
      # Every category is false when basic is false; the screen short-circuits.
      DISABILITY_COMPENSATION        = basic
      PENSION                        = basic and wartime_service_days >= WARTIME_MIN_DAYS
                                             and household_income_cents <= income_limit_cents
                                             and net_worth_cents <= NET_WORTH_LIMIT_CENTS
      DEPENDENCY_INDEMNITY           = basic and intake_status == "DECEASED"
      STATE_PROPERTY_TAX_EXEMPTION   = basic and combined_rating_pct >= 30
      STATE_TUITION_WAIVER           = basic and dependent_count >= 1
      BURIAL_BENEFIT                 = basic and intake_status == "DECEASED"
      eligible_category_count = number of the six keys whose value is true
      reason for each false key = the leftmost failing conjunct's name
    input_set: "the Veteran row's computed and input fields as of the screen instant; no other entity is read"
    constants:
      NET_WORTH_LIMIT_CENTS: 15506000
      WARTIME_MIN_DAYS: 90
      INCOME_LIMIT_BASE_CENTS: 1884000
      INCOME_LIMIT_PER_DEPENDENT_CENTS: 483000
    precision: "boolean; all comparisons are >= or <= as written"

  - name: veteran_combined_rating_pct
    trigger: "on every Claim FILED -> DECIDED transition (POST /cvso/claims/{id}/record-decision), including a revised decision after a DECIDED -> FILED reopen"
    algorithm: chronological
    formula: |
      # VA-style successive-residual combination, then a single rounding step.
      ratings = awarded_rating_pct of every Claim of this veteran where
                status == "DECIDED" and decision_outcome IN {GRANTED, PARTIAL_GRANT}
                and awarded_rating_pct > 0
      order ratings by awarded_rating_pct DESC, then created_at ASC   # pinned order
      residual = 100
      combined = 0
      for r in ratings:
          combined = combined + residual * r / 100
          residual = 100 - combined
      # single final rounding to the nearest multiple of 10, half up
      Veteran.combined_rating_pct = ROUND_HALF_UP(combined / 10) * 10
    input_set: "Claim rows of this veteran with status == DECIDED and decision_outcome IN {GRANTED, PARTIAL_GRANT}; DENIED decisions, FILED, WITHDRAWN and in-preparation claims are excluded, and a reopened claim (status FILED again) leaves the inclusion set until it is re-decided"
    constants:
      RATING_ROUNDING_STEP: 10
    precision: "combination is carried at full precision; exactly one rounding step at the end, ROUND_HALF_UP to the nearest multiple of 10 (a combined 75 becomes 80, a combined 74 becomes 70)"

  - name: evidence_completeness_pct
    trigger: "on EvidenceItem RECEIVE, MARK_INSUFFICIENT, RE_REQUEST and WAIVE, on EvidenceItem creation, on the DBQ item synthesized by an ExamAppointment COMPLETE, and on the Claim DRAFT -> EVIDENCE_DEVELOPMENT and EVIDENCE_DEVELOPMENT -> PEER_REVIEW transitions"
    algorithm: weighted_scoring
    formula: |
      # ---- ROUNDING ORDER IS PINNED: round EACH item to 2 decimals first,
      # ---- then sum the rounded item values, then round the percentage.
      # ---- Summing raw products and rounding once at the end is WRONG and
      # ---- produces a different number (see the worked divergence below).
      for each EvidenceItem e of this claim with status IN {RECEIVED, WAIVED}:
          base       = TYPE_WEIGHT[e.evidence_type]
          nexus_mult = NEXUS_MULT[e.nexus_opinion_strength] if e.evidence_type == "NEXUS_LETTER" else 1.00
          if e.status == "WAIVED":
              status_mult = WAIVE_FACTOR
              time_mult   = 1.00
          else:
              status_mult = 1.00
              time_mult   = 1.00 if (e.received_on - e.requested_on).days <= TIMELINESS_WINDOW_DAYS
                                 else LATE_MULT
          e.weight_points = ROUND_HALF_UP(base * nexus_mult * status_mult * time_mult, 2)   # step 1
      points_earned   = sum of e.weight_points over that same item set                      # step 2
      required_points = REQUIRED_BASE_POINTS
                      + REQUIRED_POINTS_PER_CONDITION * length(Claim.claimed_conditions)
      Claim.evidence_completeness_pct = min(100.00,
          ROUND_HALF_UP(points_earned / required_points * 100, 2))                          # step 3
      # Worked divergence: a 2-condition claim (required_points = 70) holding a
      # NEXUS_LETTER at AT_LEAST_AS_LIKELY_AS_NOT received on time, plus a DBQ,
      # a PRIVATE_MEDICAL and a LAY_STATEMENT all received late, scores
      # 25.88 + 14.88 + 10.63 + 5.10 = 56.49 -> 80.70 under the pinned order.
      # Summing the raw products (56.475) and rounding once yields 80.68.
    input_set: "EvidenceItem rows of this claim whose status is RECEIVED or WAIVED; items in REQUESTED or INSUFFICIENT contribute nothing and their weight_points is 0.00"
    constants:
      TYPE_WEIGHT: { SERVICE_TREATMENT_RECORD: 20.0, PRIVATE_MEDICAL: 12.5, VA_MEDICAL: 12.5, LAY_STATEMENT: 6.0, NEXUS_LETTER: 22.5, DBQ: 17.5 }
      NEXUS_MULT: { NONE: 1.00, POSSIBLE: 1.00, AT_LEAST_AS_LIKELY_AS_NOT: 1.15, HIGHLY_PROBABLE: 1.30 }
      WAIVE_FACTOR: 0.5
      TIMELINESS_WINDOW_DAYS: 30
      LATE_MULT: 0.85
      REQUIRED_BASE_POINTS: 40
      REQUIRED_POINTS_PER_CONDITION: 15
      EVIDENCE_READY_THRESHOLD_PCT: 80.00
    precision: "2 decimal places, ROUND_HALF_UP, applied twice - once per item and once to the final percentage"

  - name: claim_retro_award_cents
    trigger: "effective_date and effective_date_basis are pinned on the Claim READY_TO_FILE -> FILED transition; retro_award_cents is computed on every FILED -> DECIDED transition"
    algorithm: tiered_pricing
    formula: |
      # ---- variant selection (see variants: below) fixes effective_date first
      if intent_to_file_date is not null and (filed_on - intent_to_file_date).days <= ITF_WINDOW_DAYS:
          effective_date_basis = "INTENT_TO_FILE_ANCHORED"
          effective_date       = intent_to_file_date
      else:
          effective_date_basis = "FILED_DATE_ANCHORED"
          effective_date       = filed_on
      # whole calendar months from effective_date up to decided_on
      months_retro = (decided_on.year - effective_date.year) * 12
                   + (decided_on.month - effective_date.month)
                   - (1 if decided_on.day < effective_date.day else 0)
      months_retro = max(0, months_retro)
      # dependent add-on is gated on the rating, capped on the head count
      if awarded_rating_pct >= DEPENDENT_ADD_RATING_FLOOR_PCT:
          dependent_add_cents = DEPENDENT_ADD_CENTS * min(Veteran.dependent_count, MAX_DEPENDENTS_COUNTED)
      else:
          dependent_add_cents = 0
      monthly_rate_cents = MONTHLY_RATE_CENTS[awarded_rating_pct] + dependent_add_cents
      retro_award_cents  = months_retro * monthly_rate_cents
    input_set: "the single Claim row plus Veteran.dependent_count as of the decision instant; DENIED decisions carry awarded_rating_pct 0, so monthly_rate_cents is 0 and retro_award_cents is 0"
    constants:
      ITF_WINDOW_DAYS: 365
      MONTHLY_RATE_CENTS: { 0: 0, 10: 17500, 20: 34600, 30: 53700, 40: 77400, 50: 110200, 60: 139500, 70: 175900, 80: 204400, 90: 229800, 100: 383100 }
      DEPENDENT_ADD_CENTS: 8200
      MAX_DEPENDENTS_COUNTED: 3
      DEPENDENT_ADD_RATING_FLOOR_PCT: 30
    precision: "integer cents throughout; no rounding is ever required because every constant is an integer number of cents"
    variants:
      - name: INTENT_TO_FILE_ANCHORED
        when: "intent_to_file_date is present AND filed_on is at most ITF_WINDOW_DAYS (365) days after it; the comparison is <=, so a gap of exactly 365 days still anchors on the intent to file"
        difference: "effective_date is the intent-to-file date, so months_retro spans the whole intent-to-file window and the award is materially larger"
      - name: FILED_DATE_ANCHORED
        when: "intent_to_file_date is null OR filed_on is more than 365 days after it"
        difference: "effective_date is the filing date, so months_retro only spans decision-processing time; identical rating, dependents and decision date therefore yield a strictly smaller award"

  - name: state_benefit_award_cents
    trigger: "on the StateBenefitApplication SUBMITTED -> APPROVED determination transition"
    algorithm: waterfall_allocation
    formula: |
      # ---- EVALUATION ORDER IS PINNED. The administration fee band is selected
      # ---- on the GROSS award, never on the net. Selecting on the net is a
      # ---- circular definition (net depends on the fee, the fee band would
      # ---- depend on the net) and does not converge - see the worked example.
      step 1: rate = EXEMPTION_RATE_BY_RATING band for Veteran.combined_rating_pct
                     (>= 100 -> 1.00, >= 70 -> 0.60, >= 50 -> 0.40, >= 30 -> 0.25, else 0.00)
      step 2: if StateProgram.program_type == "PROPERTY_TAX_EXEMPTION":
                  gross_award_cents = min(StateProgram.max_award_cents,
                                          ROUND_HALF_UP(assessed_property_value_cents * rate, 0))
              elif StateProgram.program_type == "TUITION_WAIVER":
                  gross_award_cents = min(StateProgram.max_award_cents,
                                          tuition_credits_requested * CREDIT_UNIT_COST_CENTS)
              else:  # BURIAL_BENEFIT
                  gross_award_cents = min(StateProgram.max_award_cents, BURIAL_FLAT_CENTS)
      step 3: fee_rate = ADMIN_FEE_RATE band for gross_award_cents
                         (>= 5000000 -> 0.02, >= 2000000 -> 0.01, else 0.00)   # keyed on GROSS
      step 4: admin_fee_cents = CEIL(gross_award_cents * fee_rate)
      step 5: benefit_amount_cents = gross_award_cents - admin_fee_cents
      step 6: pool guard - StateProgram.allocated_cents + benefit_amount_cents
                           <= StateProgram.annual_pool_cents, else ERR_PROGRAM_POOL_EXHAUSTED
      # Worked example of the circularity trap: assessed 8500000 at a combined
      # rating of 70 gives gross 5100000 (below the 6000000 ceiling); the GROSS
      # band is 0.02 so the fee is 102000 and the net is 4998000. A net-keyed
      # implementation sees 4998000 < 5000000, drops to the 0.01 band, gets a
      # net of 5049000, which is back above 5000000 - it oscillates forever.
    input_set: "the single StateBenefitApplication row, its StateProgram row's configuration and current allocated_cents, and the linked Veteran.combined_rating_pct as of the approval instant"
    constants:
      EXEMPTION_RATE_BY_RATING: { 100: 1.00, 70: 0.60, 50: 0.40, 30: 0.25, 0: 0.00 }
      ADMIN_FEE_RATE: { 5000000: 0.02, 2000000: 0.01, 0: 0.00 }
      CREDIT_UNIT_COST_CENTS: 45000
      BURIAL_FLAT_CENTS: 90000
    precision: "integer cents; the exemption product uses ROUND_HALF_UP to whole cents and the administration fee uses CEIL to whole cents - the two rounding modes are deliberately different and must not be unified"

  - name: program_pool_ledger
    trigger: "invariant re-asserted after every SUBMITTED -> APPROVED determination and after every PENDING/ISSUED -> CLAWED_BACK cascade"
    algorithm: aggregation
    formula: |
      StateProgram.allocated_cents ==
          sum of StateBenefitApplication.benefit_amount_cents
          over rows where program_id == StateProgram.id
            and disbursement_status IN {PENDING, ISSUED}
      # Conserved quantity: approving an application raises allocated_cents by
      # exactly benefit_amount_cents; the clawback cascade lowers it by exactly
      # the same figure, so a forward-plus-compensating pair leaves
      # allocated_cents at its pre-approval value with zero drift.
    input_set: "StateBenefitApplication rows of this program whose disbursement_status is PENDING or ISSUED; NOT_APPLICABLE (never approved, or denied) and CLAWED_BACK rows are excluded"
    constants: {}
    precision: "integer cents; exact equality, no tolerance"

  - name: exam_slot_ledger
    trigger: "invariant re-asserted after every ExamAppointment creation and after every SCHEDULED -> COMPLETED / NO_SHOW / CANCELLED transition, including cascade-driven cancellations"
    algorithm: aggregation
    formula: |
      ExamSite.booked_slot_count ==
          count of ExamAppointment rows where exam_site_id == ExamSite.id
                                          and status == "SCHEDULED"
      # Conserved quantity of a different kind from program_pool_ledger: a
      # discrete slot count rather than money. Scheduling adds exactly one slot
      # and every terminal transition releases exactly one, so a schedule plus
      # its compensating cancel - whether the cancel is operator-driven or
      # arrives through the representation cascade - returns the count to its
      # pre-schedule value.
    input_set: "ExamAppointment rows at this site with status == SCHEDULED; COMPLETED, NO_SHOW and CANCELLED rows are excluded"
    constants: {}
    precision: "whole slots; exact equality, no tolerance"

  - name: active_poa_count_ledger
    trigger: "invariant re-asserted after every PowerOfAttorney OFFERED -> ACTIVE, ACTIVE -> SUPERSEDED and ACTIVE -> REVOKED transition"
    algorithm: aggregation
    formula: |
      Representative.active_poa_count ==
          count of PowerOfAttorney rows where representative_id == Representative.id
                                          and status == "ACTIVE"
      and, office-wide,
      sum of Representative.active_poa_count over all Representative rows ==
          count of PowerOfAttorney rows with status == "ACTIVE"
    input_set: "PowerOfAttorney rows with status == ACTIVE; OFFERED, REVOKED and SUPERSEDED rows are excluded"
    constants:
      MAX_POA_PER_REPRESENTATIVE: 40
    precision: "whole designations; exact equality, no tolerance"

  - name: representative_caseload_weight
    trigger: "on every PowerOfAttorney OFFERED -> ACTIVE / ACTIVE -> SUPERSEDED / ACTIVE -> REVOKED transition, on every Claim status change that enters or leaves the set {EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE, FILED}, and on every OutreachEvent creation or PLANNED -> HELD / PLANNED -> CANCELLED transition"
    algorithm: weighted_scoring
    formula: |
      open_claim_stages = {EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE, FILED}
      weight = 0
      for each PowerOfAttorney p with representative_id == rep.id and p.status == "ACTIVE":
          weight = weight + POA_WEIGHT
          for each Claim c with c.poa_id == p.id and c.status IN open_claim_stages:
              weight = weight + CLAIM_STAGE_WEIGHT[c.status]
      for each OutreachEvent o with assigned_representative_id == rep.id and o.status == "PLANNED":
          weight = weight + PLANNED_OUTREACH_WEIGHT
      Representative.caseload_weight = weight
    input_set: "ACTIVE PowerOfAttorney rows of this representative and, through them, only claims in EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE or FILED, plus OutreachEvent rows still in PLANNED; DRAFT, DECIDED and WITHDRAWN claims, claims whose poa_id is null, and HELD or CANCELLED outreach events all contribute nothing"
    constants:
      POA_WEIGHT: 1
      CLAIM_STAGE_WEIGHT: { EVIDENCE_DEVELOPMENT: 3, PEER_REVIEW: 5, READY_TO_FILE: 2, FILED: 4 }
      PLANNED_OUTREACH_WEIGHT: 2
    precision: "whole points, exact integer arithmetic"

  - name: representative_assignment_selector
    trigger: "on POST /cvso/veterans/{id}/assign-representative when representative_id is omitted from the payload"
    algorithm: threshold
    formula: |
      candidates = Representative rows where
            accreditation_status == "ACTIVE"
        and accreditation_type IN {COUNTY_CVSO, VSO_ORG}
        and active_poa_count < MAX_POA_PER_REPRESENTATIVE
      # deterministic total order - no random pick, no id-based pick
      order candidates by caseload_weight ASC, then created_at ASC
      if candidates is empty: raise ERR_NO_ELIGIBLE_REPRESENTATIVE (409)
      selected = first row of the ordered candidates
    input_set: "all Representative rows; PENDING, LAPSED and REVOKED representatives are excluded, ATTORNEY and CLAIMS_AGENT accreditation types are excluded from automatic assignment even when ACTIVE, and any representative already holding MAX_POA_PER_REPRESENTATIVE active designations is excluded"
    constants:
      MAX_POA_PER_REPRESENTATIVE: 40
      ELIGIBLE_ACCREDITATION_TYPES: ["COUNTY_CVSO", "VSO_ORG"]
    precision: "exact integer comparison on caseload_weight; created_at ASC is the sole tie-break and no other ordering input is consulted"

  - name: decision_review_deadline
    trigger: "on POST /cvso/decision-reviews (creation, at counselling time) and re-derived on every GET of the row"
    algorithm: chronological
    formula: |
      decision_notice_date = Claim.decided_on          # copied once, at creation
      deadline_on          = decision_notice_date + APPEAL_WINDOW_DAYS days
      days_remaining       = (deadline_on - current_utc_date).days     # may go negative
      is_expired           = days_remaining < 0
    input_set: "the parent Claim's decided_on (the claim must be in DECIDED status) plus the logical clock's current date; a claim that has been reopened to FILED has no decided_on for the reopen and cannot anchor a new review until it is decided again"
    constants:
      APPEAL_WINDOW_DAYS: 365
      EXPIRY_SWEEP_GRACE_DAYS: 0
    precision: "whole days; days_remaining of exactly 0 means the deadline is today and an election is still accepted, -1 is the first expired day"

  - name: outcome_report_performance_score
    trigger: "on POST /cvso/outcome-reports/{id}/compute and re-computed on every OPEN -> SUBMITTED transition"
    algorithm: weighted_scoring
    formula: |
      # ---- variant selection: see variants: below
      # fiscal_quarter "YYYYQn" expands to a closed calendar-date interval:
      #   Q1 -> [YYYY-01-01, YYYY-03-31]   Q2 -> [YYYY-04-01, YYYY-06-30]
      #   Q3 -> [YYYY-07-01, YYYY-09-30]   Q4 -> [YYYY-10-01, YYYY-12-31]
      claims_in_window = Claim rows where filed_on falls inside that closed interval
      favorable = subset with status == "DECIDED" and decision_outcome IN {GRANTED, PARTIAL_GRANT}
      filed_claim_count     = count(claims_in_window)
      favorable_claim_count = count(favorable)
      retro_dollars_cents   = sum of retro_award_cents over favorable
      veterans_contacted_total = sum of veterans_contacted over OutreachEvent rows with
                                 status == "HELD" whose starts_at date falls in the interval
      if filed_claim_count == 0:
          performance_score = EMPTY_SET_SCORE          # empty input set is scored, not an error
      else:
          # variant CLAIM_WEIGHTED
          performance_score = ROUND_HALF_UP(favorable_claim_count / filed_claim_count * 100, 1)
          # variant VETERAN_WEIGHTED
          # d = number of distinct veteran_id values in claims_in_window
          # n = number of distinct veteran_id values in favorable
          # performance_score = ROUND_HALF_UP(n / d * 100, 1)
    input_set: "Claim rows whose filed_on falls in the closed reporting window; DRAFT, EVIDENCE_DEVELOPMENT, PEER_REVIEW and READY_TO_FILE claims have no filed_on and are excluded, WITHDRAWN claims that were never filed are excluded, and a claim filed inside the window but still undecided counts in the denominator only"
    constants:
      EMPTY_SET_SCORE: 0.0
    precision: "1 decimal place, ROUND_HALF_UP, applied exactly once to the final percentage"
    variants:
      - name: CLAIM_WEIGHTED
        when: "the compute call carries weighting_basis == \"CLAIM_WEIGHTED\", which is also the value assumed by the OPEN -> SUBMITTED recompute when the row has never been computed"
        difference: "every claim counts once, so a veteran with several claims in the window moves the score several times"
      - name: VETERAN_WEIGHTED
        when: "the compute call carries weighting_basis == \"VETERAN_WEIGHTED\""
        difference: "each veteran counts once no matter how many claims they filed; a veteran with one granted and one denied claim scores 50.0 under CLAIM_WEIGHTED but 100.0 under VETERAN_WEIGHTED on the same rows"

  - name: exam_site_interval_conflict
    trigger: "on POST /cvso/exam-appointments, evaluated against the target ExamSite"
    algorithm: interval_merge
    formula: |
      # ---- HALF-OPEN interval semantics: [scheduled_start_at, scheduled_end_at)
      # ---- plus an ASYMMETRIC trailing turnaround buffer, and an aggregate
      # ---- capacity greater than one.
      new_block   = [new.starts_at, new.ends_at + site.buffer_minutes)
      for each existing ExamAppointment e at this site with status == "SCHEDULED":
          e_block = [e.starts_at, e.ends_at + site.buffer_minutes)
          overlaps = new_block.start < e_block.end and e_block.start < new_block.end
      concurrent = count of overlapping existing appointments
      if concurrent >= site.concurrent_capacity: raise ERR_EXAM_SITE_CAPACITY_EXCEEDED (409)
      # Because both ends use a strict <, an appointment starting exactly when the
      # previous block ends (ends_at + buffer) does NOT overlap. The buffer is
      # trailing only: nothing is reserved before starts_at.
    input_set: "ExamAppointment rows at the same exam_site_id with status == SCHEDULED; COMPLETED, NO_SHOW and CANCELLED rows free their block immediately"
    constants:
      DEFAULT_BUFFER_MINUTES: 15
      DEFAULT_CONCURRENT_CAPACITY: 2
    precision: "whole minutes; interval comparison is half-open [start, end) so touching endpoints are permitted, and capacity is breached only when the overlapping count reaches concurrent_capacity"

  - name: outreach_travel_conflict
    trigger: "on POST /cvso/outreach-events and on the PLANNED -> HELD transition, evaluated against the assigned Representative"
    algorithm: interval_merge
    formula: |
      # ---- CLOSED interval semantics [starts_at, ends_at] plus a SYMMETRIC
      # ---- travel buffer on BOTH sides, and a capacity of exactly one - a
      # ---- deliberately different overlap semantics from exam_site_interval_conflict.
      new_block = [new.starts_at - TRAVEL_BUFFER_MINUTES, new.ends_at + TRAVEL_BUFFER_MINUTES]
      for each existing OutreachEvent o of the same representative_id with status == "PLANNED" or "HELD":
          o_block = [o.starts_at - TRAVEL_BUFFER_MINUTES, o.ends_at + TRAVEL_BUFFER_MINUTES]
          overlaps = new_block.start < o_block.end and o_block.start < new_block.end
      if any overlaps: raise ERR_REPRESENTATIVE_TRAVEL_CONFLICT (409)
      # The two buffers meet but do not cross when the gap between the events is
      # exactly 2 * TRAVEL_BUFFER_MINUTES / 2 = 60 minutes, so a 60-minute gap is
      # accepted and a 59-minute gap is rejected.
    input_set: "OutreachEvent rows of the same representative whose status is PLANNED or HELD; CANCELLED events release their block"
    constants:
      TRAVEL_BUFFER_MINUTES: 30
      REPRESENTATIVE_EVENT_CAPACITY: 1
    precision: "whole minutes; the base interval is closed on both ends but the buffered-block comparison uses strict <, which is what makes an exactly-60-minute gap legal"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =====================================================================
# Band layout for this domain:
#   1-5    authentication and authorization
#   10-22  request shape and read-only-field discipline
#   30-37  existence of path ids and body foreign keys, left to right
#   40-49  state preconditions, including the two optimistic-concurrency checks
#   50-54  safety, compliance and segregation of duties
#   55-59  temporal rules (deadlines, past-dating, closed periods)
#   60-64  referential agreement between two rows that already exist
#   65-73  constraint satisfaction (thresholds, overlap, uniqueness, capacity)
#   74-76  fiscal capacity - pool and eligibility-floor money checks last
validations:
  - priority: 1
    category: auth
    check: "both X-User-Role and X-User-ID request headers are present and non-empty"
    error_id: ERR_MISSING_AUTH_HEADERS
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is exactly one of SystemAdmin, IntakeClerk, CountyOfficer, StateAuditor, VeteranClient"
    error_id: ERR_INVALID_ROLE
    http_status: 401
    applies_to: "all"

  - priority: 3
    category: auth
    check: "the supplied role appears in the addressed endpoint's roles list in §1.5"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 4
    category: auth
    check: "for an entity_backed role the X-User-ID resolves to an existing row of its backing entity - a CountyOfficer id must be a Representative.id and a VeteranClient id must be a Veteran.id"
    error_id: ERR_UNKNOWN_ACTOR
    http_status: 403
    applies_to: "every endpoint whose roles list includes CountyOfficer or VeteranClient"

  - priority: 5
    category: auth
    check: "a VeteranClient may only act on rows that belong to the veteran the X-User-ID identifies - the addressed PowerOfAttorney.veteran_id, or the veteran_id of the DecisionReview's claim, must equal X-User-ID"
    error_id: ERR_ACTOR_NOT_OWNER
    http_status: 403
    applies_to: "POST /cvso/powers-of-attorney/{id}/accept, POST /cvso/powers-of-attorney/{id}/revoke, POST /cvso/decision-reviews/{id}/status"

  - priority: 10
    category: business_constraint
    check: "every field declared without a default in the endpoint's input list is present and non-null"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 11
    category: business_constraint
    check: "every enum-typed field carries a value from the set §1.1 declares for it"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 12
    category: business_constraint
    check: "the action field carries one of the values the addressed dispatch endpoint declares in §1.5"
    error_id: ERR_UNKNOWN_ACTION
    http_status: 422
    applies_to: "POST /cvso/representatives/{id}/accreditation, POST /cvso/veterans/{id}/status, POST /cvso/discharge-documents/{id}/review, POST /cvso/claims/{id}/transitions, POST /cvso/evidence-items/{id}/status, POST /cvso/exam-appointments/{id}/status, POST /cvso/decision-reviews/{id}/status, POST /cvso/state-benefit-applications/{id}/determination, POST /cvso/state-benefit-applications/{id}/disbursement, POST /cvso/outreach-events/{id}/status, POST /cvso/outcome-reports/{id}/review"

  - priority: 13
    category: business_constraint
    check: "date-typed fields match YYYY-MM-DD and datetime-typed fields are ISO 8601 UTC instants ending in Z"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 14
    category: business_constraint
    check: "integer fields respect their declared range - household_income_cents, net_worth_cents, annual_pool_cents, max_award_cents and assessed_property_value_cents are >= 0, dependent_count is 0..12, tuition_credits_requested is 0..30, concurrent_capacity is >= 1, buffer_minutes is 0..120, fiscal_year is 2020..2100, min_rating_pct and awarded_rating_pct are multiples of 10 in 0..100"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 15
    category: business_constraint
    check: "limit is an integer in 1..100 and offset is an integer >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 422
    applies_to: "every collection GET endpoint"

  - priority: 16
    category: business_constraint
    check: "claimed_conditions is an array of 1..8 non-blank strings"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /cvso/claims, PATCH /cvso/claims/{id}"

  - priority: 17
    category: business_constraint
    check: "ends_at is strictly greater than starts_at"
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /cvso/exam-appointments, POST /cvso/outreach-events"

  - priority: 18
    category: business_constraint
    check: "the end of a service span is not earlier than its start - service_end_date >= service_start_date on a veteran, claimed_service_end >= claimed_service_start on a discharge document"
    error_id: ERR_INVALID_SERVICE_DATES
    http_status: 422
    applies_to: "POST /cvso/veterans, PATCH /cvso/veterans/{id}, POST /cvso/veterans/{id}/discharge-documents, POST /cvso/discharge-documents/{id}/resubmit"

  - priority: 19
    category: business_constraint
    check: "fiscal_quarter matches ^[0-9]{4}Q[1-4]$"
    error_id: ERR_INVALID_FISCAL_QUARTER
    http_status: 422
    applies_to: "POST /cvso/outcome-reports"

  - priority: 20
    category: business_constraint
    check: "veterans_enrolled is less than or equal to veterans_contacted"
    error_id: ERR_ENROLLED_EXCEEDS_CONTACTED
    http_status: 422
    applies_to: "POST /cvso/outreach-events/{id}/status with action=HOLD"

  - priority: 21
    category: business_constraint
    check: "no field whose §1.1 source is system or computed appears in a write body; the server assigns those values"
    error_id: ERR_READONLY_FIELD
    http_status: 422
    applies_to: "all POST and PATCH endpoints"

  - priority: 22
    category: business_constraint
    check: "on an endpoint that §1.2.1 declares as an optimistic-concurrency write, the expected_<parent>_version field is present and is an integer >= 1"
    error_id: ERR_VALIDATION
    http_status: 422
    applies_to: "POST /cvso/powers-of-attorney/{id}/accept, POST /cvso/state-benefit-applications"

  - priority: 30
    category: existence
    check: "every {id} path segment resolves to an existing row, checked left to right, and every request-body identifier reference that no more specific existence rule below covers resolves to an existing row - notably reviewer_representative_id on POST /cvso/claims/{id}/transitions, which the representative rule at priority 32 does not list"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "every endpoint carrying an {id} path segment, plus request-body identifier references outside the applies_to lists of priorities 31 to 36; the concrete code is the entity-specific one below whenever a rule at priority 31 to 36 lists the endpoint"

  - priority: 31
    category: existence
    check: "veteran_id in the path or the request body resolves to an existing Veteran"
    error_id: ERR_VETERAN_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /cvso/veterans/{id}, POST /cvso/veterans/{id}/screen, POST /cvso/veterans/{id}/discharge-documents, POST /cvso/veterans/{id}/assign-representative, POST /cvso/veterans/{id}/status, GET /cvso/veterans/{id}/eligibility-screens, POST /cvso/powers-of-attorney, POST /cvso/claims, POST /cvso/state-benefit-applications"

  - priority: 32
    category: existence
    check: "representative_id in the path or the request body resolves to an existing Representative"
    error_id: ERR_REPRESENTATIVE_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /cvso/representatives/{id}, POST /cvso/representatives/{id}/accreditation, GET /cvso/representatives/{id}/outreach-events, GET /cvso/representatives/{id}/caseload, POST /cvso/powers-of-attorney, POST /cvso/veterans/{id}/assign-representative, POST /cvso/outreach-events"

  - priority: 33
    category: existence
    check: "claim_id in the path or the request body resolves to an existing Claim"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "GET|PATCH /cvso/claims/{id}, POST /cvso/claims/{id}/transitions, POST /cvso/claims/{id}/record-decision, GET|POST /cvso/claims/{id}/evidence-items, POST /cvso/exam-appointments, POST /cvso/decision-reviews"

  - priority: 34
    category: existence
    check: "poa_id in the request body resolves to an existing PowerOfAttorney"
    error_id: ERR_POA_NOT_FOUND
    http_status: 404
    applies_to: "POST /cvso/claims, GET|POST /cvso/powers-of-attorney/{id} and its accept and revoke actions"

  - priority: 35
    category: existence
    check: "exam_site_id in the request body resolves to an existing ExamSite"
    error_id: ERR_EXAM_SITE_NOT_FOUND
    http_status: 404
    applies_to: "POST /cvso/exam-appointments, GET|PATCH /cvso/exam-sites/{id}"

  - priority: 36
    category: existence
    check: "program_id in the request body resolves to an existing StateProgram"
    error_id: ERR_STATE_PROGRAM_NOT_FOUND
    http_status: 404
    applies_to: "POST /cvso/state-benefit-applications, GET|PATCH /cvso/state-programs/{id}"

  - priority: 40
    category: state
    check: "the addressed row is in a state from which §1.2 declares the requested trigger; any other from-state, and any trigger applied to a terminal state, is refused"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every action endpoint that drives a §1.2 transition"

  - priority: 41
    category: state
    check: "the Veteran the write hangs off is not in intake_status DECEASED"
    error_id: ERR_VETERAN_DECEASED
    http_status: 409
    applies_to: "POST /cvso/veterans/{id}/discharge-documents, POST /cvso/powers-of-attorney, POST /cvso/powers-of-attorney/{id}/accept, POST /cvso/claims, POST /cvso/claims/{id}/transitions, POST /cvso/veterans/{id}/assign-representative"

  - priority: 42
    category: state
    check: "the acting Representative identified by X-User-ID has accreditation_status ACTIVE; PENDING, LAPSED and REVOKED accreditations cannot act"
    error_id: ERR_REPRESENTATIVE_NOT_ACCREDITED
    http_status: 403
    applies_to: "every endpoint whose roles list includes CountyOfficer"

  - priority: 43
    category: state
    check: "the Veteran's discharge_doc_status is VERIFIED before an eligibility screen may be taken or a claim created"
    error_id: ERR_DISCHARGE_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /cvso/veterans/{id}/screen, POST /cvso/claims"

  - priority: 44
    category: state
    check: "the PowerOfAttorney named by poa_id has status ACTIVE"
    error_id: ERR_POA_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /cvso/claims, POST /cvso/claims/{id}/transitions"

  - priority: 45
    category: state
    check: "expected_veteran_version equals the addressed PowerOfAttorney's Veteran.version at the moment of the write; see §1.2.1 poa-accept-stale-veteran"
    error_id: ERR_STALE_VETERAN_VERSION
    http_status: 412
    applies_to: "POST /cvso/powers-of-attorney/{id}/accept"

  - priority: 46
    category: state
    check: "expected_program_version equals the referenced StateProgram.version at the moment of the write; see §1.2.1 benefit-application-stale-program"
    error_id: ERR_STALE_PROGRAM_VERSION
    http_status: 412
    applies_to: "POST /cvso/state-benefit-applications"

  - priority: 47
    category: state
    check: "the Veteran has at least one EligibilityScreen whose basic_eligibility is true before a representative may be assigned"
    error_id: ERR_NOT_SCREENED
    http_status: 409
    applies_to: "POST /cvso/veterans/{id}/assign-representative"

  - priority: 48
    category: state
    check: "the OutcomeReport has been computed at least once, i.e. weighting_basis is not null, before it may be submitted"
    error_id: ERR_REPORT_NOT_COMPUTED
    http_status: 409
    applies_to: "POST /cvso/outcome-reports/{id}/submit"

  - priority: 49
    category: state
    check: "the Veteran's intake_status has reached the screened stage, i.e. IN {SCREENED, ACTIVE}, for a PROPERTY_TAX_EXEMPTION or TUITION_WAIVER application, and is DECEASED for a BURIAL_BENEFIT application"
    error_id: ERR_VETERAN_STATUS_INELIGIBLE
    http_status: 409
    applies_to: "POST /cvso/state-benefit-applications"

  - priority: 50
    category: business_safety
    check: "reviewer_representative_id differs from Claim.prepared_by_representative_id - a preparer may never be nominated as the peer reviewer of their own claim"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /cvso/claims/{id}/transitions with action=SUBMIT_FOR_REVIEW"

  - priority: 51
    category: business_safety
    check: "no EvidenceItem of the claim is left in an open status - none in REQUESTED when the claim is submitted for peer review, and none in INSUFFICIENT when the claim is filed; an outstanding item must be received, re-requested or waived first"
    error_id: ERR_EVIDENCE_ITEM_OUTSTANDING
    http_status: 409
    applies_to: "POST /cvso/claims/{id}/transitions with action=SUBMIT_FOR_REVIEW or action=FILE"

  - priority: 52
    category: business_safety
    check: "prep_session_completed is true before an examination appointment may be completed"
    error_id: ERR_EXAM_PREP_INCOMPLETE
    http_status: 409
    applies_to: "POST /cvso/exam-appointments/{id}/status with action=COMPLETE"

  - priority: 53
    category: business_safety
    check: "a veteran whose homeless_status is SHELTERED or UNSHELTERED may not be deactivated; the office must keep the case open while housing is unresolved"
    error_id: ERR_HOMELESS_VETERAN_PROTECTED
    http_status: 409
    applies_to: "POST /cvso/veterans/{id}/status with action=DEACTIVATE"

  - priority: 54
    category: business_safety
    check: "the acting Representative's accreditation_expires_on is not earlier than the logical-clock date, even when accreditation_status still reads ACTIVE"
    error_id: ERR_ACCREDITATION_EXPIRED
    http_status: 403
    applies_to: "every endpoint whose roles list includes CountyOfficer"

  - priority: 55
    category: business_temporal
    check: "the DecisionReview's days_remaining is not negative - once the appeal window has closed the lane may no longer be elected or filed"
    error_id: ERR_APPEAL_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /cvso/decision-reviews/{id}/status with action=ELECT or action=FILE"

  - priority: 56
    category: business_temporal
    check: "starts_at is at or after the logical-clock instant - an examination may not be booked into the past"
    error_id: ERR_APPOINTMENT_IN_PAST
    http_status: 409
    applies_to: "POST /cvso/exam-appointments"

  - priority: 57
    category: business_temporal
    check: "decided_on is not earlier than Claim.filed_on and not later than the logical-clock date"
    error_id: ERR_DECISION_DATE_INVALID
    http_status: 409
    applies_to: "POST /cvso/claims/{id}/record-decision"

  - priority: 58
    category: business_temporal
    check: "intent_to_file_date is not later than the logical-clock date and not earlier than Veteran.service_end_date"
    error_id: ERR_INTENT_TO_FILE_DATE_INVALID
    http_status: 409
    applies_to: "POST /cvso/claims, PATCH /cvso/claims/{id}"

  - priority: 59
    category: business_temporal
    check: "the logical-clock date is later than the last calendar day of the report's fiscal_quarter before the quarter's numbers may be computed"
    error_id: ERR_QUARTER_NOT_CLOSED
    http_status: 409
    applies_to: "POST /cvso/outcome-reports/{id}/compute"

  - priority: 60
    category: business_referential
    check: "the PowerOfAttorney named by poa_id belongs to the same veteran as the claim - poa.veteran_id equals the claim's veteran_id"
    error_id: ERR_POA_VETERAN_MISMATCH
    http_status: 409
    applies_to: "POST /cvso/claims"

  - priority: 61
    category: business_referential
    check: "the application's fiscal_year equals the referenced StateProgram.fiscal_year"
    error_id: ERR_FISCAL_YEAR_MISMATCH
    http_status: 409
    applies_to: "POST /cvso/state-benefit-applications"

  - priority: 62
    category: business_referential
    check: "reviewer_representative_id is not the representative designated on the claim's PowerOfAttorney - the designee holds a representational interest and cannot supply the independent peer review"
    error_id: ERR_REVIEWER_IS_DESIGNATED_REPRESENTATIVE
    http_status: 409
    applies_to: "POST /cvso/claims/{id}/transitions with action=SUBMIT_FOR_REVIEW"

  - priority: 63
    category: business_referential
    check: "the money-bearing input matches the program type - a PROPERTY_TAX_EXEMPTION application carries assessed_property_value_cents > 0, a TUITION_WAIVER application carries tuition_credits_requested > 0, and a BURIAL_BENEFIT application carries neither"
    error_id: ERR_PROGRAM_INPUT_MISMATCH
    http_status: 422
    applies_to: "POST /cvso/state-benefit-applications"

  - priority: 64
    category: business_referential
    check: "nexus_opinion_strength agrees with evidence_type - a NEXUS_LETTER item carries a strength other than NONE, and every other evidence type carries NONE or omits the field"
    error_id: ERR_NEXUS_STRENGTH_MISMATCH
    http_status: 422
    applies_to: "POST /cvso/claims/{id}/evidence-items"

  - priority: 65
    category: business_constraint
    check: "Claim.evidence_completeness_pct is at least EVIDENCE_READY_THRESHOLD_PCT (80.00) before the claim may be marked ready to file; the comparison is >= so exactly 80.00 passes"
    error_id: ERR_EVIDENCE_INCOMPLETE
    http_status: 409
    applies_to: "POST /cvso/claims/{id}/transitions with action=MARK_READY"

  - priority: 66
    category: business_constraint
    check: "the number of SCHEDULED appointments at the site whose half-open buffered block overlaps the requested block is strictly less than ExamSite.concurrent_capacity; see calculations.exam_site_interval_conflict"
    error_id: ERR_EXAM_SITE_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /cvso/exam-appointments"

  - priority: 67
    category: business_constraint
    check: "no PLANNED or HELD outreach event of the same representative has a travel-buffered block overlapping the requested one; see calculations.outreach_travel_conflict"
    error_id: ERR_REPRESENTATIVE_TRAVEL_CONFLICT
    http_status: 409
    applies_to: "POST /cvso/outreach-events"

  - priority: 68
    category: business_constraint
    check: "when representative_id is omitted, the automatic selector finds at least one candidate; see calculations.representative_assignment_selector"
    error_id: ERR_NO_ELIGIBLE_REPRESENTATIVE
    http_status: 409
    applies_to: "POST /cvso/veterans/{id}/assign-representative"

  - priority: 69
    category: business_constraint
    check: "the representative's active_poa_count is strictly less than MAX_POA_PER_REPRESENTATIVE (40) before another designation becomes active"
    error_id: ERR_REPRESENTATIVE_CASELOAD_FULL
    http_status: 409
    applies_to: "POST /cvso/powers-of-attorney/{id}/accept, POST /cvso/veterans/{id}/assign-representative"

  - priority: 70
    category: business_constraint
    check: "accreditation_number is not already held by another Representative"
    error_id: ERR_DUPLICATE_ACCREDITATION_NUMBER
    http_status: 409
    applies_to: "POST /cvso/representatives, PATCH /cvso/representatives/{id}"

  - priority: 71
    category: business_constraint
    check: "program_code is not already held by another StateProgram"
    error_id: ERR_DUPLICATE_PROGRAM_CODE
    http_status: 409
    applies_to: "POST /cvso/state-programs, PATCH /cvso/state-programs/{id}"

  - priority: 72
    category: business_constraint
    check: "fiscal_quarter is not already held by another OutcomeReport"
    error_id: ERR_DUPLICATE_FISCAL_QUARTER
    http_status: 409
    applies_to: "POST /cvso/outcome-reports"

  - priority: 73
    category: business_constraint
    check: "no other StateBenefitApplication exists with the same veteran_id, program_id and fiscal_year whose determination_status is SUBMITTED or APPROVED"
    error_id: ERR_DUPLICATE_BENEFIT_APPLICATION
    http_status: 409
    applies_to: "POST /cvso/state-benefit-applications"

  - priority: 74
    category: business_fiscal
    check: "the veteran's combined_rating_pct is at least StateProgram.min_rating_pct at the moment of approval"
    error_id: ERR_PROGRAM_MIN_RATING_NOT_MET
    http_status: 409
    applies_to: "POST /cvso/state-benefit-applications/{id}/determination with action=APPROVE"

  - priority: 75
    category: business_fiscal
    check: "when StateProgram.requires_wartime is true the veteran's wartime_service_days is at least WARTIME_MIN_DAYS (90)"
    error_id: ERR_PROGRAM_WARTIME_REQUIRED
    http_status: 409
    applies_to: "POST /cvso/state-benefit-applications/{id}/determination with action=APPROVE"

  - priority: 76
    category: business_fiscal
    check: "StateProgram.allocated_cents plus the computed benefit_amount_cents is at most StateProgram.annual_pool_cents; the comparison is <= so an approval that fills the pool to the cent succeeds and the next one fails"
    error_id: ERR_PROGRAM_POOL_EXHAUSTED
    http_status: 409
    applies_to: "POST /cvso/state-benefit-applications/{id}/determination with action=APPROVE"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- system / logical clock -------------------------------------------
  - method: POST
    path: "/cvso/_clock/set_current_utc"
    description: "Test-driving endpoint that moves the server's logical clock to any instant. The server's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that default and never falls back to real wall-clock time. Every deadline, buffer, timeliness window and quarter-close rule in this scaffold is evaluated against this clock."
    roles: [SystemAdmin]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects:
      - "sets the logical clock to current_utc; it does not advance on its own between requests"
      - "recomputes DecisionReview.days_remaining on every subsequent read"

  # ---- Representative ---------------------------------------------------
  - method: POST
    path: "/cvso/representatives"
    description: "Register an accredited-representative record in PENDING accreditation status."
    roles: [SystemAdmin]
    code: 201
    input: [full_name, accreditation_number, accreditation_type, accreditation_expires_on]
    output: Representative
    side_effects:
      - "sets accreditation_status = PENDING, ce_credits_earned = 0, active_poa_count = 0, caseload_weight = 0"
      - "rejects a duplicate accreditation_number with ERR_DUPLICATE_ACCREDITATION_NUMBER"

  - method: GET
    path: "/cvso/representatives"
    description: "List representatives, filterable by accreditation status and channel."
    roles: [SystemAdmin, IntakeClerk, CountyOfficer, StateAuditor]
    code: 200
    input: ["accreditation_status?", "accreditation_type?", "limit?", "offset?"]
    output: Representative[]
    side_effects: []

  - method: GET
    path: "/cvso/representatives/{id}"
    description: "Read one representative including the computed active_poa_count and caseload_weight."
    roles: [SystemAdmin, IntakeClerk, CountyOfficer, StateAuditor]
    code: 200
    input: []
    output: Representative
    side_effects: []

  - method: PATCH
    path: "/cvso/representatives/{id}"
    description: "Correct a representative's registry details. Lifecycle fields are moved only through the accreditation action."
    roles: [SystemAdmin]
    code: 200
    input: ["full_name?", "accreditation_number?", "accreditation_type?", "accreditation_expires_on?"]
    output: Representative
    side_effects:
      - "increments version by 1"
      - "rejects a duplicate accreditation_number with ERR_DUPLICATE_ACCREDITATION_NUMBER"

  - method: POST
    path: "/cvso/representatives/{id}/accreditation"
    description: "Drive the accreditation lifecycle. action is one of ACTIVATE, LAPSE, RENEW, REVOKE. RENEW requires ce_credits and a new accreditation_expires_on; REVOKE requires reason and fires the depth-5 representation cascade."
    roles: [SystemAdmin]
    code: 200
    input: ["action", "ce_credits?", "accreditation_expires_on?", "reason?"]
    output: Representative
    side_effects:
      - "applies the §1.2 Representative transition selected by action"
      - "on REVOKE: revokes every ACTIVE PowerOfAttorney of this representative, which reverts each affected claim to DRAFT with poa_id cleared, cancels those claims' SCHEDULED exam appointments and decrements each ExamSite.booked_slot_count"
      - "recomputes active_poa_count and caseload_weight"
      - "increments version by 1 on this row and on every row the cascade touched"

  - method: GET
    path: "/cvso/representatives/{id}/outreach-events"
    description: "Reverse lookup of the outreach calendar a representative occupies (FK OutreachEvent.assigned_representative_id)."
    roles: [SystemAdmin, CountyOfficer, StateAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OutreachEvent[]
    side_effects: []

  - method: GET
    path: "/cvso/representatives/{id}/caseload"
    description: "Computed read of the representative's workload decomposition, exposing exactly the terms calculations.representative_caseload_weight sums."
    roles: [SystemAdmin, CountyOfficer, StateAuditor]
    code: 200
    input: []
    output: "{ representative_id: string, active_poa_count: integer, open_claim_count: integer, planned_outreach_count: integer, caseload_weight: number, assignment_eligible: boolean }"
    side_effects: []

  # ---- Veteran ----------------------------------------------------------
  - method: POST
    path: "/cvso/veterans"
    description: "Open an intake record. county_case_number is minted by the server; character_of_service, discharge_doc_status, wartime_service_days, combined_rating_pct and priority_group are all computed and start at their empty values."
    roles: [IntakeClerk, CountyOfficer]
    code: 201
    input: [full_name, date_of_birth, service_start_date, service_end_date, household_income_cents, net_worth_cents, dependent_count, homeless_status, referral_source]
    output: Veteran
    side_effects:
      - "mints county_case_number as CVSO-<clock year>-<zero-padded creation rank>"
      - "sets intake_status = INTAKE_STARTED, discharge_doc_status = NOT_SUBMITTED, character_of_service = UNCHARACTERIZED, wartime_service_days = 0, combined_rating_pct = 0, priority_group = P4, assigned_representative_id = null"

  - method: GET
    path: "/cvso/veterans"
    description: "List veterans. Reverse lookup for FK Veteran.assigned_representative_id."
    roles: [IntakeClerk, CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: ["intake_status?", "priority_group?", "homeless_status?", "assigned_representative_id?", "discharge_doc_status?", "limit?", "offset?"]
    output: Veteran[]
    side_effects: []

  - method: GET
    path: "/cvso/veterans/{id}"
    description: "Read one veteran, including version for the optimistic-concurrency check on power-of-attorney acceptance."
    roles: [IntakeClerk, CountyOfficer, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: []
    output: Veteran
    side_effects: []

  - method: PATCH
    path: "/cvso/veterans/{id}"
    description: "Correct means-test and housing inputs. Changing any of them re-derives priority_group immediately and makes a fresh screen meaningful."
    roles: [IntakeClerk, CountyOfficer]
    code: 200
    input: ["full_name?", "date_of_birth?", "service_start_date?", "service_end_date?", "household_income_cents?", "net_worth_cents?", "dependent_count?", "homeless_status?", "referral_source?"]
    output: Veteran
    side_effects:
      - "re-derives priority_group per calculations.veteran_priority_group"
      - "increments version by 1"

  - method: POST
    path: "/cvso/veterans/{id}/discharge-documents"
    description: "Submit a discharge document for verification. veteran_id is taken from the path. The row starts in PENDING_VERIFICATION."
    roles: [IntakeClerk, CountyOfficer]
    code: 201
    input: [document_type, source, claimed_service_start, claimed_service_end, claimed_character_of_service]
    output: DischargeDocument
    side_effects:
      - "sets verification_status = PENDING_VERIFICATION and resubmission_count = 0"
      - "sets Veteran.discharge_doc_status = PENDING_VERIFICATION and increments Veteran.version by 1"

  - method: POST
    path: "/cvso/veterans/{id}/screen"
    description: "Take an eligibility screen. Appends a new immutable EligibilityScreen row and drives the Veteran INTAKE_STARTED -> SCREENED transition (or the SCREENED -> SCREENED re-screen)."
    roles: [CountyOfficer]
    code: 201
    input: []
    output: EligibilityScreen
    side_effects:
      - "computes basic_eligibility, income_limit_applied_cents, wartime_service_days_at_screen, priority_group_assigned, category_results and eligible_category_count per calculations.eligibility_category_results"
      - "sets screen_sequence to the previous maximum for this veteran plus 1"
      - "sets Veteran.intake_status = SCREENED, re-derives Veteran.priority_group and increments Veteran.version by 1"

  - method: GET
    path: "/cvso/veterans/{id}/eligibility-screens"
    description: "Reverse lookup of the append-only screen history (FK EligibilityScreen.veteran_id). This is the only discovery channel for the survivor screen the RECORD_DEATH cascade appends."
    roles: [IntakeClerk, CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: EligibilityScreen[]
    side_effects: []

  - method: POST
    path: "/cvso/veterans/{id}/assign-representative"
    description: "Assign a county representative. Supplying representative_id assigns that person; omitting it runs calculations.representative_assignment_selector. Drives the Veteran SCREENED -> ACTIVE transition."
    roles: [IntakeClerk]
    code: 200
    input: ["representative_id?"]
    output: Veteran
    side_effects:
      - "sets assigned_representative_id and intake_status = ACTIVE"
      - "raises ERR_NO_ELIGIBLE_REPRESENTATIVE when representative_id is omitted and the candidate set is empty"
      - "increments Veteran.version by 1"

  - method: POST
    path: "/cvso/veterans/{id}/status"
    description: "Drive the intake lifecycle. action is one of DEACTIVATE, REACTIVATE, RECORD_DEATH. RECORD_DEATH requires date_of_death and appends a survivor eligibility screen."
    roles: [IntakeClerk, CountyOfficer]
    code: 200
    input: ["action", "reason?", "date_of_death?"]
    output: Veteran
    side_effects:
      - "applies the §1.2 Veteran transition selected by action"
      - "on RECORD_DEATH: withdraws every in-preparation claim of this veteran and appends a new EligibilityScreen row in which BURIAL_BENEFIT and DEPENDENCY_INDEMNITY are true"
      - "increments Veteran.version by 1 and the version of every touched Claim"

  # ---- DischargeDocument ------------------------------------------------
  - method: GET
    path: "/cvso/discharge-documents"
    description: "List discharge documents. Reverse lookup for FKs DischargeDocument.veteran_id and DischargeDocument.verified_by_representative_id."
    roles: [IntakeClerk, CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: ["veteran_id?", "verified_by_representative_id?", "verification_status?", "document_type?", "limit?", "offset?"]
    output: DischargeDocument[]
    side_effects: []

  - method: GET
    path: "/cvso/discharge-documents/{id}"
    description: "Read one discharge document."
    roles: [IntakeClerk, CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: []
    output: DischargeDocument
    side_effects: []

  - method: POST
    path: "/cvso/discharge-documents/{id}/review"
    description: "Adjudicate a submitted document. action is one of VERIFY, HOLD_DISCREPANCY, REJECT. VERIFY copies the character of service onto the veteran and recomputes wartime service days."
    roles: [CountyOfficer]
    code: 200
    input: ["action", "reason?"]
    output: DischargeDocument
    side_effects:
      - "applies the §1.2 DischargeDocument transition selected by action"
      - "on VERIFY: sets verified_at and verified_by_representative_id from X-User-ID, copies claimed_character_of_service onto Veteran.character_of_service, sets Veteran.discharge_doc_status = VERIFIED and recomputes Veteran.wartime_service_days per calculations.wartime_service_days"
      - "increments DischargeDocument.version and Veteran.version by 1"

  - method: POST
    path: "/cvso/discharge-documents/{id}/resubmit"
    description: "Correct a document held for discrepancy and put it back in the verification queue. Drives DISCREPANCY_HELD -> PENDING_VERIFICATION."
    roles: [IntakeClerk, CountyOfficer]
    code: 200
    input: ["claimed_service_start?", "claimed_service_end?", "claimed_character_of_service?"]
    output: DischargeDocument
    side_effects:
      - "overwrites any supplied claimed_* field, clears discrepancy_reason, increments resubmission_count by 1 and sets verification_status = PENDING_VERIFICATION"
      - "sets Veteran.discharge_doc_status = PENDING_VERIFICATION"
      - "increments DischargeDocument.version and Veteran.version by 1"

  # ---- PowerOfAttorney --------------------------------------------------
  - method: POST
    path: "/cvso/powers-of-attorney"
    description: "Offer a power-of-attorney designation to a veteran. The row starts in OFFERED; only the veteran can accept it."
    roles: [CountyOfficer, IntakeClerk]
    code: 201
    input: [veteran_id, representative_id, form_type, scope, executed_on]
    output: PowerOfAttorney
    side_effects:
      - "sets status = OFFERED"

  - method: GET
    path: "/cvso/powers-of-attorney"
    description: "List designations. Reverse lookup for FKs PowerOfAttorney.veteran_id and PowerOfAttorney.representative_id."
    roles: [IntakeClerk, CountyOfficer, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: ["veteran_id?", "representative_id?", "status?", "form_type?", "limit?", "offset?"]
    output: PowerOfAttorney[]
    side_effects: []

  - method: GET
    path: "/cvso/powers-of-attorney/{id}"
    description: "Read one designation."
    roles: [IntakeClerk, CountyOfficer, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: []
    output: PowerOfAttorney
    side_effects: []

  - method: POST
    path: "/cvso/powers-of-attorney/{id}/accept"
    description: "The veteran accepts the designation. Optimistic-concurrency write against the Veteran row: expected_veteran_version must equal the veteran's current version (see §1.2.1 poa-accept-stale-veteran)."
    roles: [VeteranClient]
    code: 200
    input: [expected_veteran_version]
    output: PowerOfAttorney
    side_effects:
      - "rejects a mismatched expected_veteran_version with ERR_STALE_VETERAN_VERSION (412) and changes nothing"
      - "sets status = ACTIVE and accepted_at"
      - "supersedes any other ACTIVE designation of the same veteran, setting it to SUPERSEDED"
      - "increments Representative.active_poa_count and recomputes caseload_weight for both the new and any superseded representative"
      - "increments PowerOfAttorney.version, Veteran.version and every touched Representative.version by 1"

  - method: POST
    path: "/cvso/powers-of-attorney/{id}/revoke"
    description: "Revoke a designation. A VeteranClient may revoke their own ACTIVE designation; a CountyOfficer may withdraw one still in OFFERED. Revoking an ACTIVE designation reverts the veteran's in-preparation claims to DRAFT."
    roles: [VeteranClient, CountyOfficer]
    code: 200
    input: [reason]
    output: PowerOfAttorney
    side_effects:
      - "sets status = REVOKED and revoked_reason"
      - "every Claim citing this poa_id whose status IN {EVIDENCE_DEVELOPMENT, PEER_REVIEW, READY_TO_FILE} reverts to DRAFT with poa_id and peer_reviewed_by_representative_id cleared"
      - "every SCHEDULED ExamAppointment of those claims transitions to CANCELLED and each ExamSite.booked_slot_count is decremented by 1"
      - "decrements Representative.active_poa_count and recomputes caseload_weight"
      - "increments version by 1 on this row and on every row the cascade touched"

  # ---- Claim ------------------------------------------------------------
  - method: POST
    path: "/cvso/claims"
    description: "Open a claim in DRAFT against an ACTIVE power of attorney. prepared_by_representative_id is taken from X-User-ID."
    roles: [CountyOfficer]
    code: 201
    input: ["veteran_id", "poa_id", "claim_type", "claimed_conditions", "intent_to_file_date?"]
    output: Claim
    side_effects:
      - "sets status = DRAFT, prepared_by_representative_id = X-User-ID, rework_count = 0, reopen_count = 0, evidence_completeness_pct = 0.00"
      - "requires Veteran.discharge_doc_status == VERIFIED and the cited PowerOfAttorney to be ACTIVE and to belong to the same veteran"

  - method: GET
    path: "/cvso/claims"
    description: "List claims. Reverse lookup for FKs Claim.veteran_id, Claim.poa_id, Claim.prepared_by_representative_id and Claim.peer_reviewed_by_representative_id."
    roles: [CountyOfficer, IntakeClerk, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: ["veteran_id?", "poa_id?", "prepared_by_representative_id?", "peer_reviewed_by_representative_id?", "status?", "claim_type?", "limit?", "offset?"]
    output: Claim[]
    side_effects: []

  - method: GET
    path: "/cvso/claims/{id}"
    description: "Read one claim including evidence_completeness_pct, effective_date_basis and retro_award_cents."
    roles: [CountyOfficer, IntakeClerk, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: []
    output: Claim
    side_effects: []

  - method: PATCH
    path: "/cvso/claims/{id}"
    description: "Amend a claim while it is still in DRAFT or EVIDENCE_DEVELOPMENT. Amending claimed_conditions changes the required-points denominator and therefore re-scores completeness."
    roles: [CountyOfficer]
    code: 200
    input: ["claimed_conditions?", "intent_to_file_date?"]
    output: Claim
    side_effects:
      - "recomputes evidence_completeness_pct per calculations.evidence_completeness_pct"
      - "increments version by 1"

  - method: POST
    path: "/cvso/claims/{id}/transitions"
    description: "Drive the claim workflow. action is one of OPEN_EVIDENCE_DEVELOPMENT, SUBMIT_FOR_REVIEW, RETURN_FOR_REWORK, MARK_READY, FILE, WITHDRAW. SUBMIT_FOR_REVIEW requires reviewer_representative_id; RETURN_FOR_REWORK requires rework_note; FILE requires filed_on; WITHDRAW requires reason."
    roles: [CountyOfficer]
    code: 200
    input: ["action", "reviewer_representative_id?", "rework_note?", "filed_on?", "reason?"]
    output: Claim
    side_effects:
      - "applies the §1.2 Claim transition selected by action, enforcing that transition's preconditions"
      - "on SUBMIT_FOR_REVIEW: sets peer_reviewed_by_representative_id, refusing the preparer with ERR_SEGREGATION_OF_DUTIES and the power-of-attorney designee with ERR_REVIEWER_IS_DESIGNATED_REPRESENTATIVE"
      - "on MARK_READY: refuses evidence_completeness_pct below 80.00 with ERR_EVIDENCE_INCOMPLETE"
      - "on FILE: selects effective_date_basis and effective_date per calculations.claim_retro_award_cents"
      - "on WITHDRAW: cancels SCHEDULED exam appointments, waives REQUESTED evidence items and decrements each ExamSite.booked_slot_count"
      - "recomputes evidence_completeness_pct and the preparer's caseload_weight"
      - "increments Claim.version by 1 plus the version of every row the action touched"

  - method: POST
    path: "/cvso/claims/{id}/record-decision"
    description: "Record the adjudicated decision on a filed claim. Origin of the depth-4 rating cascade: retro award, then the veteran's combined rating and priority group, then any state benefit application whose program floor is no longer met, then that program's allocated pool."
    roles: [CountyOfficer]
    code: 200
    input: [decision_outcome, awarded_rating_pct, decided_on]
    output: Claim
    side_effects:
      - "sets status = DECIDED, decision_outcome, awarded_rating_pct, decided_on and retro_award_cents per calculations.claim_retro_award_cents"
      - "recomputes Veteran.combined_rating_pct per calculations.veteran_combined_rating_pct and re-derives Veteran.priority_group"
      - "denies and claws back every APPROVED StateBenefitApplication of that veteran whose StateProgram.min_rating_pct now exceeds the new combined rating"
      - "decrements each affected StateProgram.allocated_cents by that application's benefit_amount_cents, restoring calculations.program_pool_ledger"
      - "increments version by 1 on the Claim, the Veteran and every touched StateBenefitApplication and StateProgram"

  - method: POST
    path: "/cvso/claims/{id}/evidence-items"
    description: "Request a piece of evidence for the claim. claim_id is taken from the path; the row starts in REQUESTED with requested_on set to the logical-clock date."
    roles: [CountyOfficer]
    code: 201
    input: ["evidence_type", "provider_name", "nexus_opinion_strength?"]
    output: EvidenceItem
    side_effects:
      - "sets status = REQUESTED, requested_on = the logical-clock date, weight_points = 0.00 and auto_generated = false"
      - "recomputes Claim.evidence_completeness_pct and increments Claim.version by 1"

  - method: GET
    path: "/cvso/claims/{id}/evidence-items"
    description: "Reverse lookup of the claim's evidence file (FK EvidenceItem.claim_id). This is the only discovery channel for the DBQ item the exam-completion cascade synthesizes."
    roles: [CountyOfficer, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: ["status?", "evidence_type?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []

  # ---- EvidenceItem -----------------------------------------------------
  - method: GET
    path: "/cvso/evidence-items"
    description: "List evidence items across claims, filterable by parent claim."
    roles: [CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: ["claim_id?", "status?", "evidence_type?", "auto_generated?", "limit?", "offset?"]
    output: EvidenceItem[]
    side_effects: []

  - method: GET
    path: "/cvso/evidence-items/{id}"
    description: "Read one evidence item including its computed weight_points."
    roles: [CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: []
    output: EvidenceItem
    side_effects: []

  - method: POST
    path: "/cvso/evidence-items/{id}/status"
    description: "Drive the evidence lifecycle. action is one of RECEIVE, MARK_INSUFFICIENT, RE_REQUEST, WAIVE. RECEIVE sets received_on to the logical-clock date, which is what decides the timeliness multiplier."
    roles: [CountyOfficer]
    code: 200
    input: ["action", "reason?"]
    output: EvidenceItem
    side_effects:
      - "applies the §1.2 EvidenceItem transition selected by action"
      - "on RECEIVE: sets received_on = the logical-clock date and recomputes weight_points, applying LATE_MULT when received_on is more than 30 days after requested_on"
      - "on RE_REQUEST: resets requested_on to the logical-clock date, clears received_on and sets weight_points = 0.00"
      - "on WAIVE: sets weight_points to the type weight times WAIVE_FACTOR"
      - "recomputes Claim.evidence_completeness_pct per calculations.evidence_completeness_pct"
      - "increments EvidenceItem.version and Claim.version by 1"

  # ---- ExamSite ---------------------------------------------------------
  - method: POST
    path: "/cvso/exam-sites"
    description: "Register a contract examination site with its concurrency capacity and trailing turnaround buffer."
    roles: [SystemAdmin]
    code: 201
    input: [name, county_code, concurrent_capacity, "buffer_minutes?"]
    output: ExamSite
    side_effects:
      - "sets booked_slot_count = 0"

  - method: GET
    path: "/cvso/exam-sites"
    description: "List examination sites."
    roles: [SystemAdmin, CountyOfficer, StateAuditor]
    code: 200
    input: ["county_code?", "limit?", "offset?"]
    output: ExamSite[]
    side_effects: []

  - method: GET
    path: "/cvso/exam-sites/{id}"
    description: "Read one examination site including the conserved booked_slot_count."
    roles: [SystemAdmin, CountyOfficer, StateAuditor]
    code: 200
    input: []
    output: ExamSite
    side_effects: []

  - method: PATCH
    path: "/cvso/exam-sites/{id}"
    description: "Retune a site's capacity or turnaround buffer. Existing appointments are left in place; the new values apply to subsequent overlap evaluations."
    roles: [SystemAdmin]
    code: 200
    input: ["name?", "county_code?", "concurrent_capacity?", "buffer_minutes?"]
    output: ExamSite
    side_effects:
      - "increments version by 1"

  # ---- ExamAppointment --------------------------------------------------
  - method: POST
    path: "/cvso/exam-appointments"
    description: "Book a compensation-and-pension examination. Evaluated against calculations.exam_site_interval_conflict using half-open blocks plus the site's trailing buffer."
    roles: [CountyOfficer]
    code: 201
    input: [claim_id, exam_site_id, starts_at, ends_at]
    output: ExamAppointment
    side_effects:
      - "sets status = SCHEDULED and prep_session_completed = false"
      - "increments ExamSite.booked_slot_count by 1, maintaining calculations.exam_slot_ledger"
      - "increments ExamSite.version by 1"

  - method: GET
    path: "/cvso/exam-appointments"
    description: "List appointments. Reverse lookup for FKs ExamAppointment.claim_id and ExamAppointment.exam_site_id."
    roles: [CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: ["claim_id?", "exam_site_id?", "status?", "prep_session_completed?", "limit?", "offset?"]
    output: ExamAppointment[]
    side_effects: []

  - method: GET
    path: "/cvso/exam-appointments/{id}"
    description: "Read one appointment."
    roles: [CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: []
    output: ExamAppointment
    side_effects: []

  - method: POST
    path: "/cvso/exam-appointments/{id}/status"
    description: "Drive the appointment lifecycle. action is one of COMPLETE_PREP (a SCHEDULED -> SCHEDULED self-loop), COMPLETE, NO_SHOW, CANCEL. COMPLETE requires prep_session_completed to be true and synthesizes the DBQ evidence item."
    roles: [CountyOfficer]
    code: 200
    input: ["action", "reason?", "completed_on?"]
    output: ExamAppointment
    side_effects:
      - "applies the §1.2 ExamAppointment transition selected by action"
      - "on COMPLETE_PREP: sets prep_session_completed = true and leaves status at SCHEDULED"
      - "on COMPLETE: sets completed_on, appends an auto_generated DBQ EvidenceItem to the claim in RECEIVED status and recomputes Claim.evidence_completeness_pct"
      - "on COMPLETE, NO_SHOW and CANCEL: decrements ExamSite.booked_slot_count by 1, maintaining calculations.exam_slot_ledger"
      - "increments ExamAppointment.version, and where touched ExamSite.version, EvidenceItem.version and Claim.version, by 1"

  # ---- DecisionReview ---------------------------------------------------
  - method: POST
    path: "/cvso/decision-reviews"
    description: "Record the appeal-option counselling session for a decided claim. decision_notice_date is copied from the claim's decided_on and deadline_on is derived per calculations.decision_review_deadline."
    roles: [CountyOfficer]
    code: 201
    input: [claim_id, review_lane]
    output: DecisionReview
    side_effects:
      - "sets status = COUNSELED and counseled_by_representative_id = X-User-ID"
      - "copies decision_notice_date from Claim.decided_on and computes deadline_on and days_remaining"

  - method: GET
    path: "/cvso/decision-reviews"
    description: "List counselling records. Reverse lookup for FKs DecisionReview.claim_id and DecisionReview.counseled_by_representative_id."
    roles: [CountyOfficer, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: ["claim_id?", "counseled_by_representative_id?", "status?", "review_lane?", "limit?", "offset?"]
    output: DecisionReview[]
    side_effects: []

  - method: GET
    path: "/cvso/decision-reviews/{id}"
    description: "Read one counselling record. days_remaining is re-derived against the logical clock on every read."
    roles: [CountyOfficer, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: []
    output: DecisionReview
    side_effects: []

  - method: POST
    path: "/cvso/decision-reviews/{id}/status"
    description: "Drive the review lifecycle. action is one of ELECT, FILE, WITHDRAW. FILE reopens the underlying claim from DECIDED back to FILED so a revised decision can be recorded."
    roles: [CountyOfficer, VeteranClient]
    code: 200
    input: ["action", "review_lane?", "elected_on?", "filed_on?", "reason?"]
    output: DecisionReview
    side_effects:
      - "applies the §1.2 DecisionReview transition selected by action, refusing ELECT and FILE once days_remaining is negative"
      - "on ELECT: sets elected_on and, when review_lane is supplied, overwrites review_lane"
      - "on FILE: sets filed_on and drives the linked Claim DECIDED -> FILED reopen, incrementing Claim.reopen_count by 1"
      - "increments DecisionReview.version and, where touched, Claim.version by 1"

  - method: POST
    path: "/cvso/decision-reviews/sweep-expirations"
    description: "Expire every COUNSELED or ELECTED review whose deadline_on is earlier than the logical-clock date. Idempotent: a second call with an unchanged clock expires nothing."
    roles: [SystemAdmin]
    code: 200
    input: []
    output: "{ expired_count: integer, expired_review_ids: array }"
    side_effects:
      - "sets status = EXPIRED and closure_reason = DEADLINE_SWEEP on every swept row"
      - "increments the version of every swept DecisionReview by 1"

  # ---- StateProgram -----------------------------------------------------
  - method: POST
    path: "/cvso/state-programs"
    description: "Configure a state benefit program for one fiscal year with its annual pool, per-award ceiling and eligibility floors."
    roles: [SystemAdmin]
    code: 201
    input: [program_code, program_name, program_type, fiscal_year, annual_pool_cents, min_rating_pct, requires_wartime, max_award_cents]
    output: StateProgram
    side_effects:
      - "sets allocated_cents = 0"
      - "rejects a duplicate program_code with ERR_DUPLICATE_PROGRAM_CODE"

  - method: GET
    path: "/cvso/state-programs"
    description: "List programs with their current allocated_cents."
    roles: [SystemAdmin, CountyOfficer, StateAuditor, IntakeClerk]
    code: 200
    input: ["program_type?", "fiscal_year?", "limit?", "offset?"]
    output: StateProgram[]
    side_effects: []

  - method: GET
    path: "/cvso/state-programs/{id}"
    description: "Read one program, including version for the optimistic-concurrency check on application creation."
    roles: [SystemAdmin, CountyOfficer, StateAuditor, IntakeClerk]
    code: 200
    input: []
    output: StateProgram
    side_effects: []

  - method: PATCH
    path: "/cvso/state-programs/{id}"
    description: "Retune a program's pool, ceiling or eligibility floors. Already-approved applications are not re-adjudicated."
    roles: [SystemAdmin]
    code: 200
    input: ["program_name?", "annual_pool_cents?", "min_rating_pct?", "requires_wartime?", "max_award_cents?"]
    output: StateProgram
    side_effects:
      - "increments version by 1, which invalidates any expected_program_version a client captured earlier"

  # ---- StateBenefitApplication ------------------------------------------
  - method: POST
    path: "/cvso/state-benefit-applications"
    description: "File a state benefit application. Optimistic-concurrency write against the StateProgram row: expected_program_version must equal the program's current version (see §1.2.1 benefit-application-stale-program)."
    roles: [IntakeClerk, CountyOfficer]
    code: 201
    input: ["veteran_id", "program_id", "fiscal_year", "expected_program_version", "assessed_property_value_cents?", "tuition_credits_requested?"]
    output: StateBenefitApplication
    side_effects:
      - "rejects a mismatched expected_program_version with ERR_STALE_PROGRAM_VERSION (412) and changes nothing"
      - "sets determination_status = SUBMITTED, disbursement_status = NOT_APPLICABLE, gross_award_cents = 0, admin_fee_cents = 0, benefit_amount_cents = 0"
      - "does not move StateProgram.allocated_cents - money is only committed at approval"

  - method: GET
    path: "/cvso/state-benefit-applications"
    description: "List applications. Reverse lookup for FKs StateBenefitApplication.veteran_id and StateBenefitApplication.program_id."
    roles: [IntakeClerk, CountyOfficer, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: ["veteran_id?", "program_id?", "fiscal_year?", "determination_status?", "disbursement_status?", "limit?", "offset?"]
    output: StateBenefitApplication[]
    side_effects: []

  - method: GET
    path: "/cvso/state-benefit-applications/{id}"
    description: "Read one application including the gross award, administration fee and net benefit amount."
    roles: [IntakeClerk, CountyOfficer, StateAuditor, SystemAdmin, VeteranClient]
    code: 200
    input: []
    output: StateBenefitApplication
    side_effects: []

  - method: POST
    path: "/cvso/state-benefit-applications/{id}/determination"
    description: "Adjudicate the application. action is one of APPROVE, DENY. APPROVE runs calculations.state_benefit_award_cents and commits the net amount against the program pool."
    roles: [StateAuditor]
    code: 200
    input: ["action", "reason?"]
    output: StateBenefitApplication
    side_effects:
      - "on APPROVE: computes gross_award_cents, admin_fee_cents and benefit_amount_cents, records rating_at_approval_pct, sets determination_status = APPROVED and disbursement_status = PENDING, and increments StateProgram.allocated_cents by benefit_amount_cents"
      - "on APPROVE: refuses the rating floor with ERR_PROGRAM_MIN_RATING_NOT_MET, the wartime requirement with ERR_PROGRAM_WARTIME_REQUIRED and an over-commitment with ERR_PROGRAM_POOL_EXHAUSTED"
      - "on DENY: sets determination_status = DENIED, determination_reason and leaves disbursement_status at NOT_APPLICABLE"
      - "increments StateBenefitApplication.version and, on approval, StateProgram.version by 1"

  - method: POST
    path: "/cvso/state-benefit-applications/{id}/disbursement"
    description: "Move the independent disbursement dimension. action is one of ISSUE, CLAW_BACK. The determination dimension is untouched."
    roles: [SystemAdmin]
    code: 200
    input: ["action", "issued_on?", "reason?"]
    output: StateBenefitApplication
    side_effects:
      - "on ISSUE: sets disbursement_status = ISSUED and issued_on, leaving StateProgram.allocated_cents unchanged because the money was already committed at approval"
      - "on CLAW_BACK: sets disbursement_status = CLAWED_BACK and decrements StateProgram.allocated_cents by benefit_amount_cents, restoring calculations.program_pool_ledger; determination_status stays APPROVED"
      - "increments StateBenefitApplication.version and, on claw-back, StateProgram.version by 1"

  # ---- OutreachEvent ----------------------------------------------------
  - method: POST
    path: "/cvso/outreach-events"
    description: "Plan an outreach event on a representative's calendar. Evaluated against calculations.outreach_travel_conflict using closed intervals plus a symmetric 30-minute travel buffer on each side."
    roles: [CountyOfficer, SystemAdmin]
    code: 201
    input: [assigned_representative_id, event_type, location_name, starts_at, ends_at, underserved_flag]
    output: OutreachEvent
    side_effects:
      - "sets status = PLANNED, veterans_contacted = 0 and veterans_enrolled = 0"
      - "recomputes the assigned Representative.caseload_weight and increments Representative.version by 1"

  - method: GET
    path: "/cvso/outreach-events"
    description: "List outreach events. Reverse lookup for FK OutreachEvent.assigned_representative_id."
    roles: [CountyOfficer, StateAuditor, SystemAdmin, IntakeClerk]
    code: 200
    input: ["assigned_representative_id?", "status?", "event_type?", "underserved_flag?", "limit?", "offset?"]
    output: OutreachEvent[]
    side_effects: []

  - method: GET
    path: "/cvso/outreach-events/{id}"
    description: "Read one outreach event."
    roles: [CountyOfficer, StateAuditor, SystemAdmin, IntakeClerk]
    code: 200
    input: []
    output: OutreachEvent
    side_effects: []

  - method: POST
    path: "/cvso/outreach-events/{id}/status"
    description: "Drive the outreach lifecycle. action is one of HOLD, CANCEL. HOLD requires veterans_contacted and veterans_enrolled and may only run once the logical clock has reached starts_at."
    roles: [CountyOfficer]
    code: 200
    input: ["action", "veterans_contacted?", "veterans_enrolled?", "reason?"]
    output: OutreachEvent
    side_effects:
      - "applies the §1.2 OutreachEvent transition selected by action"
      - "on HOLD: records veterans_contacted and veterans_enrolled, which then feed OutcomeReport.veterans_contacted_total"
      - "on CANCEL: frees the representative's travel window so a later event may occupy it"
      - "recomputes the assigned Representative.caseload_weight and increments both versions by 1"

  # ---- OutcomeReport ----------------------------------------------------
  - method: POST
    path: "/cvso/outcome-reports"
    description: "Open the quarterly outcome report the office owes the state department. fiscal_quarter is the YYYYQn label whose closed calendar interval defines the reporting window."
    roles: [CountyOfficer]
    code: 201
    input: [fiscal_quarter]
    output: OutcomeReport
    side_effects:
      - "sets status = OPEN, weighting_basis = null and every computed count to 0"
      - "rejects a duplicate fiscal_quarter with ERR_DUPLICATE_FISCAL_QUARTER"

  - method: GET
    path: "/cvso/outcome-reports"
    description: "List outcome reports. Reverse lookup for FK OutcomeReport.certified_by_representative_id."
    roles: [CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: ["status?", "fiscal_quarter?", "weighting_basis?", "certified_by_representative_id?", "limit?", "offset?"]
    output: OutcomeReport[]
    side_effects: []

  - method: GET
    path: "/cvso/outcome-reports/{id}"
    description: "Read one outcome report with its performance score."
    roles: [CountyOfficer, StateAuditor, SystemAdmin]
    code: 200
    input: []
    output: OutcomeReport
    side_effects: []

  - method: POST
    path: "/cvso/outcome-reports/{id}/compute"
    description: "Compute the quarter's numbers under the requested weighting basis. Re-runnable while the report is OPEN or RETURNED, so the same rows can be scored both ways."
    roles: [CountyOfficer]
    code: 200
    input: [weighting_basis]
    output: OutcomeReport
    side_effects:
      - "requires the logical-clock date to be later than the last calendar day of fiscal_quarter, else ERR_QUARTER_NOT_CLOSED"
      - "sets weighting_basis, filed_claim_count, favorable_claim_count, performance_score, retro_dollars_cents and veterans_contacted_total per calculations.outcome_report_performance_score"
      - "scores an empty window as performance_score 0.0 rather than raising an error"
      - "increments version by 1"

  - method: POST
    path: "/cvso/outcome-reports/{id}/submit"
    description: "Submit the report to the state department. Drives OPEN -> SUBMITTED and requires the report to have been computed at least once."
    roles: [CountyOfficer]
    code: 200
    input: []
    output: OutcomeReport
    side_effects:
      - "recomputes the quarter's numbers under the stored weighting_basis"
      - "sets status = SUBMITTED, submitted_at and certified_by_representative_id = X-User-ID"
      - "increments version by 1"

  - method: POST
    path: "/cvso/outcome-reports/{id}/review"
    description: "State-department adjudication of a submitted report. action is one of ACCEPT, RETURN. RETURN requires reason and sends the report back for correction."
    roles: [StateAuditor]
    code: 200
    input: ["action", "reason?"]
    output: OutcomeReport
    side_effects:
      - "applies the §1.2 OutcomeReport transition selected by action"
      - "on RETURN: sets return_reason and status = RETURNED"
      - "increments version by 1"

  - method: POST
    path: "/cvso/outcome-reports/{id}/reopen"
    description: "Reopen a returned report for correction, closing the RETURNED -> OPEN cycle."
    roles: [SystemAdmin]
    code: 200
    input: []
    output: OutcomeReport
    side_effects:
      - "sets status = OPEN, clears submitted_at and certified_by_representative_id and retains return_reason as the audit trail"
      - "increments version by 1"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  # ---- authentication and authorization ---------------------------------
  - id: ERR_MISSING_AUTH_HEADERS
    http: 401
    condition: "X-User-Role or X-User-ID absent or empty"
  - id: ERR_INVALID_ROLE
    http: 401
    condition: "X-User-Role is not one of the five roles declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the supplied role is not listed on the addressed endpoint"
  - id: ERR_UNKNOWN_ACTOR
    http: 403
    condition: "an entity_backed role's X-User-ID does not resolve to a row of its backing entity"
  - id: ERR_ACTOR_NOT_OWNER
    http: 403
    condition: "a VeteranClient addresses a row belonging to a different veteran"
  - id: ERR_REPRESENTATIVE_NOT_ACCREDITED
    http: 403
    condition: "the acting Representative's accreditation_status is not ACTIVE"
  - id: ERR_ACCREDITATION_EXPIRED
    http: 403
    condition: "the acting Representative's accreditation_expires_on is earlier than the logical-clock date"

  # ---- request shape ----------------------------------------------------
  - id: ERR_VALIDATION
    http: 422
    condition: "a required field is missing, an enum value is unrecognised, a date or datetime is malformed, or a numeric field falls outside its declared range"
  - id: ERR_UNKNOWN_ACTION
    http: 422
    condition: "the action field carries a value the addressed dispatch endpoint does not declare"
  - id: ERR_INVALID_PAGINATION
    http: 422
    condition: "limit outside 1..100 or offset negative"
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "ends_at is not strictly greater than starts_at"
  - id: ERR_INVALID_SERVICE_DATES
    http: 422
    condition: "a service span ends before it starts"
  - id: ERR_INVALID_FISCAL_QUARTER
    http: 422
    condition: "fiscal_quarter does not match ^[0-9]{4}Q[1-4]$"
  - id: ERR_ENROLLED_EXCEEDS_CONTACTED
    http: 422
    condition: "veterans_enrolled exceeds veterans_contacted on an outreach HOLD"
  - id: ERR_READONLY_FIELD
    http: 422
    condition: "a write body carries a field whose §1.1 source is system or computed"
  - id: ERR_PROGRAM_INPUT_MISMATCH
    http: 422
    condition: "the application's money-bearing input does not match the program type it is filed against"
  - id: ERR_NEXUS_STRENGTH_MISMATCH
    http: 422
    condition: "nexus_opinion_strength disagrees with evidence_type"

  # ---- existence --------------------------------------------------------
  - id: ERR_NOT_FOUND
    http: 404
    condition: "generic fallback for an unresolvable path id on an endpoint whose entity has no more specific code"
  - id: ERR_REPRESENTATIVE_NOT_FOUND
    http: 404
    condition: "a representative id in the path or body does not resolve"
  - id: ERR_VETERAN_NOT_FOUND
    http: 404
    condition: "a veteran id in the path or body does not resolve"
  - id: ERR_DISCHARGE_DOCUMENT_NOT_FOUND
    http: 404
    condition: "a discharge document id in the path does not resolve"
  - id: ERR_POA_NOT_FOUND
    http: 404
    condition: "a power-of-attorney id in the path or body does not resolve"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "a claim id in the path or body does not resolve"
  - id: ERR_EVIDENCE_ITEM_NOT_FOUND
    http: 404
    condition: "an evidence item id in the path does not resolve"
  - id: ERR_EXAM_SITE_NOT_FOUND
    http: 404
    condition: "an exam site id in the path or body does not resolve"
  - id: ERR_EXAM_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "an exam appointment id in the path does not resolve"
  - id: ERR_DECISION_REVIEW_NOT_FOUND
    http: 404
    condition: "a decision review id in the path does not resolve"
  - id: ERR_STATE_PROGRAM_NOT_FOUND
    http: 404
    condition: "a state program id in the path or body does not resolve"
  - id: ERR_BENEFIT_APPLICATION_NOT_FOUND
    http: 404
    condition: "a state benefit application id in the path does not resolve"
  - id: ERR_OUTREACH_EVENT_NOT_FOUND
    http: 404
    condition: "an outreach event id in the path does not resolve"
  - id: ERR_OUTCOME_REPORT_NOT_FOUND
    http: 404
    condition: "an outcome report id in the path does not resolve"

  # ---- state and optimistic concurrency ---------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not declared from the row's current state, including any attempt from a terminal state"
  - id: ERR_VETERAN_DECEASED
    http: 409
    condition: "a claim-preparation, designation or evidence write targets a veteran in intake_status DECEASED"
  - id: ERR_DISCHARGE_NOT_VERIFIED
    http: 409
    condition: "an eligibility screen or a claim is attempted before the veteran's discharge document is VERIFIED"
  - id: ERR_POA_NOT_ACTIVE
    http: 409
    condition: "the cited power of attorney is not in ACTIVE status"
  - id: ERR_NOT_SCREENED
    http: 409
    condition: "a representative assignment is attempted before any screen with basic_eligibility true exists"
  - id: ERR_REPORT_NOT_COMPUTED
    http: 409
    condition: "an outcome report is submitted while weighting_basis is still null"
  - id: ERR_VETERAN_STATUS_INELIGIBLE
    http: 409
    condition: "the veteran's intake_status does not match the program type being applied for"
  - id: ERR_STALE_VETERAN_VERSION
    http: 412
    condition: "expected_veteran_version does not equal the veteran's current version on a power-of-attorney acceptance"
  - id: ERR_STALE_PROGRAM_VERSION
    http: 412
    condition: "expected_program_version does not equal the program's current version on an application creation"

  # ---- safety, compliance and segregation of duties ---------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the nominated peer reviewer is the claim's preparer"
  - id: ERR_EVIDENCE_ITEM_OUTSTANDING
    http: 409
    condition: "an evidence item is still REQUESTED at peer-review submission, or still INSUFFICIENT at filing"
  - id: ERR_EXAM_PREP_INCOMPLETE
    http: 409
    condition: "an examination is completed while prep_session_completed is false"
  - id: ERR_HOMELESS_VETERAN_PROTECTED
    http: 409
    condition: "a veteran whose homeless_status is SHELTERED or UNSHELTERED is deactivated"

  # ---- temporal ---------------------------------------------------------
  - id: ERR_APPEAL_DEADLINE_PASSED
    http: 409
    condition: "a review lane is elected or filed after days_remaining has gone negative"
  - id: ERR_APPOINTMENT_IN_PAST
    http: 409
    condition: "starts_at is earlier than the logical-clock instant"
  - id: ERR_DECISION_DATE_INVALID
    http: 409
    condition: "decided_on precedes filed_on or postdates the logical clock"
  - id: ERR_INTENT_TO_FILE_DATE_INVALID
    http: 409
    condition: "intent_to_file_date postdates the logical clock or precedes the veteran's service_end_date"
  - id: ERR_QUARTER_NOT_CLOSED
    http: 409
    condition: "an outcome report is computed before its fiscal quarter has ended"

  # ---- referential agreement -------------------------------------------
  - id: ERR_POA_VETERAN_MISMATCH
    http: 409
    condition: "the cited power of attorney belongs to a different veteran than the claim"
  - id: ERR_FISCAL_YEAR_MISMATCH
    http: 409
    condition: "the application's fiscal_year differs from the program's fiscal_year"
  - id: ERR_REVIEWER_IS_DESIGNATED_REPRESENTATIVE
    http: 409
    condition: "the nominated peer reviewer is the representative designated on the claim's power of attorney"

  # ---- constraint satisfaction -----------------------------------------
  - id: ERR_EVIDENCE_INCOMPLETE
    http: 409
    condition: "evidence_completeness_pct is below 80.00 when the claim is marked ready to file"
  - id: ERR_EXAM_SITE_CAPACITY_EXCEEDED
    http: 409
    condition: "the requested examination block collides with concurrent_capacity scheduled buffered blocks at the site"
  - id: ERR_REPRESENTATIVE_TRAVEL_CONFLICT
    http: 409
    condition: "the requested outreach block collides with the representative's travel-buffered calendar"
  - id: ERR_NO_ELIGIBLE_REPRESENTATIVE
    http: 409
    condition: "automatic assignment found no candidate representative"
  - id: ERR_REPRESENTATIVE_CASELOAD_FULL
    http: 409
    condition: "the representative already holds MAX_POA_PER_REPRESENTATIVE active designations"
  - id: ERR_DUPLICATE_ACCREDITATION_NUMBER
    http: 409
    condition: "accreditation_number is already held by another representative"
  - id: ERR_DUPLICATE_PROGRAM_CODE
    http: 409
    condition: "program_code is already held by another program"
  - id: ERR_DUPLICATE_FISCAL_QUARTER
    http: 409
    condition: "fiscal_quarter is already held by another outcome report"
  - id: ERR_DUPLICATE_BENEFIT_APPLICATION
    http: 409
    condition: "a live application already exists for the same veteran, program and fiscal year"

  # ---- fiscal -----------------------------------------------------------
  - id: ERR_PROGRAM_MIN_RATING_NOT_MET
    http: 409
    condition: "the veteran's combined_rating_pct is below the program's min_rating_pct at approval"
  - id: ERR_PROGRAM_WARTIME_REQUIRED
    http: 409
    condition: "the program requires wartime service and the veteran has fewer than 90 wartime days"
  - id: ERR_PROGRAM_POOL_EXHAUSTED
    http: 409
    condition: "allocated_cents plus the computed benefit_amount_cents would exceed annual_pool_cents"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: SystemAdmin
    description: "Office system administrator. Owns the accreditation registry, the examination-site and state-program configuration, the disbursement ledger, the expiry sweep, report reopening and the logical clock. Never prepares or reviews a claim."
    identity: "opaque"
    exclusive_operations:
      - "POST /cvso/_clock/set_current_utc"
      - "POST /cvso/representatives"
      - "PATCH /cvso/representatives/{id}"
      - "POST /cvso/representatives/{id}/accreditation"
      - "POST /cvso/exam-sites"
      - "PATCH /cvso/exam-sites/{id}"
      - "POST /cvso/state-programs"
      - "PATCH /cvso/state-programs/{id}"
      - "POST /cvso/state-benefit-applications/{id}/disbursement"
      - "POST /cvso/decision-reviews/sweep-expirations"
      - "POST /cvso/outcome-reports/{id}/reopen"
    shared_operations:
      - "every collection and single-row GET endpoint"
      - "POST /cvso/outreach-events"

  - name: IntakeClerk
    description: "Front-desk intake worker. Opens veteran records, uploads and resubmits discharge documents, offers designations, assigns representatives and files state benefit applications. Cannot verify a document, prepare a claim or adjudicate anything."
    identity: "opaque"
    exclusive_operations:
      - "POST /cvso/veterans/{id}/assign-representative"
    shared_operations:
      - "POST /cvso/veterans"
      - "PATCH /cvso/veterans/{id}"
      - "POST /cvso/veterans/{id}/discharge-documents"
      - "POST /cvso/veterans/{id}/status"
      - "POST /cvso/discharge-documents/{id}/resubmit"
      - "POST /cvso/powers-of-attorney"
      - "POST /cvso/state-benefit-applications"
      - "veteran, representative, document, designation, claim, program, application and outreach GET endpoints"

  - name: CountyOfficer
    description: "Accredited county veterans service officer. X-User-ID is the acting Representative's id, so every claim records who prepared it and who peer-reviewed it. Verifies documents, screens veterans, prepares and files claims, develops evidence, books examinations, counsels appeal options and prepares the quarterly report. Segregation of duties forbids being the peer reviewer of a claim one prepared."
    identity: "entity_backed:Representative"
    exclusive_operations:
      - "POST /cvso/veterans/{id}/screen"
      - "POST /cvso/discharge-documents/{id}/review"
      - "POST /cvso/claims"
      - "PATCH /cvso/claims/{id}"
      - "POST /cvso/claims/{id}/transitions"
      - "POST /cvso/claims/{id}/record-decision"
      - "POST /cvso/claims/{id}/evidence-items"
      - "POST /cvso/evidence-items/{id}/status"
      - "POST /cvso/exam-appointments"
      - "POST /cvso/exam-appointments/{id}/status"
      - "POST /cvso/decision-reviews"
      - "POST /cvso/outreach-events/{id}/status"
      - "POST /cvso/outcome-reports"
      - "POST /cvso/outcome-reports/{id}/compute"
      - "POST /cvso/outcome-reports/{id}/submit"
    shared_operations:
      - "POST /cvso/veterans"
      - "PATCH /cvso/veterans/{id}"
      - "POST /cvso/veterans/{id}/discharge-documents"
      - "POST /cvso/veterans/{id}/status"
      - "POST /cvso/discharge-documents/{id}/resubmit"
      - "POST /cvso/powers-of-attorney"
      - "POST /cvso/powers-of-attorney/{id}/revoke"
      - "POST /cvso/decision-reviews/{id}/status"
      - "POST /cvso/state-benefit-applications"
      - "POST /cvso/outreach-events"
      - "every GET endpoint except the disbursement-only reads"

  - name: StateAuditor
    description: "State department reviewer. Adjudicates state benefit applications against program pools and accepts or returns the county's quarterly outcome report. Has read access everywhere and writes nothing in the claim workflow."
    identity: "opaque"
    exclusive_operations:
      - "POST /cvso/state-benefit-applications/{id}/determination"
      - "POST /cvso/outcome-reports/{id}/review"
    shared_operations:
      - "every collection and single-row GET endpoint"

  - name: VeteranClient
    description: "The veteran themselves. X-User-ID is the acting Veteran's id. May accept or revoke their own power-of-attorney designation and withdraw their own decision review, and may read their own veteran, designation, claim, application and review rows."
    identity: "entity_backed:Veteran"
    exclusive_operations:
      - "POST /cvso/powers-of-attorney/{id}/accept"
    shared_operations:
      - "POST /cvso/powers-of-attorney/{id}/revoke"
      - "POST /cvso/decision-reviews/{id}/status"
      - "GET /cvso/veterans/{id}"
      - "GET /cvso/powers-of-attorney"
      - "GET /cvso/powers-of-attorney/{id}"
      - "GET /cvso/claims"
      - "GET /cvso/claims/{id}"
      - "GET /cvso/claims/{id}/evidence-items"
      - "GET /cvso/decision-reviews"
      - "GET /cvso/decision-reviews/{id}"
      - "GET /cvso/state-benefit-applications"
      - "GET /cvso/state-benefit-applications/{id}"
