        grounds:
          - validations[priority=11]
          - state_machines.Bid.ACTIVE_to_WITHDRAWN
          - errors[ERR_BID_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair (PurchaseContract, Bid): the contract's own creation is blocked by a state
          field on a different row — Bid.status == WITHDRAWN — even though every field of the
          contract request is individually valid and the hedge position has free lots.
        test_recipe:
          setup:
            - "Desk, elevator and a SHORT 2026-12 hedge with 10 free lots at 448."
            - "One CORN bid activated and then withdrawn."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD17", name: "Withdrawn Bid Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/hedge-positions"
