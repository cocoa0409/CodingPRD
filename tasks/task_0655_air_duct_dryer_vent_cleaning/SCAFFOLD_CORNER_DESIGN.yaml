# =============================================================================
# §1.9 Scaffold Corner Design — breadth coverage of testable claims in §1.1–§1.7
# not already covered by §1.8. Walks claim-extraction-guide.md section by section.
# Shared PricingConfig (cents): duct_base=12000, duct_per_system=4000,
# dryer_vent_flat=9000, sanitize_per_system=5000, addon_sanitizer=3000,
# addon_uv=7000, addon_coil=2500, multi_system_discount=0.10,
# plan_member_discount=0.15, tax=0.08.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: entity_create_home_returns_201_with_defaults
        claim_type: Creation
        grounds: ["entities.Home", "endpoints"]
        distinguishing_aspect: "POST /homes with required fields -> 201; active_system_count==0, has_active_plan==false, version==1."
        test_recipe:
          setup: ["A registered Homeowner exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Ann C", email: "annc@x.com", phone: "555-0200" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
          trigger:
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "20 Vent Rd", zone_code: "Z1", square_footage: 1900 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
          assert:
            - "Response status == 201"
            - "Home.${home_id}.active_system_count == 0 and has_active_plan == false and version == 1"

      - name: entity_get_home_not_found_returns_404
        claim_type: Not Found
        grounds: ["entities.Home", "errors[ERR_HOME_NOT_FOUND]"]
        distinguishing_aspect: "GET /homes/{nonexistent} -> ERR_HOME_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB (no such home)."]
          setup_api_calls: []
          trigger:
            - call: "GET /homes/00000000-0000-4000-8000-000000000abc"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404 and data.error_id == ERR_HOME_NOT_FOUND"

      - name: entity_missing_required_field_work_order_returns_invalid_request
        claim_type: Required Fields
        grounds: ["entities.WorkOrder", "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "POST /work-orders omitting service_lines -> ERR_INVALID_REQUEST 400 (required field missing)."
        test_recipe:
          setup: ["A Home exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Bea C", email: "beac@x.com", phone: "555-0201" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "21 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", requested_start_minute: 540 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: entity_addons_default_empty_array_applied
        claim_type: Defaults
        grounds: ["entities.WorkOrder.fields.addons"]
        distinguishing_aspect: "Omitting addons on work-order create -> addons defaults to []."
        test_recipe:
          setup: ["A Home with 1 ACTIVE system exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Cy C", email: "cyc@x.com", phone: "555-0202" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "22 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id, addons_val: $.data.addons }
          assert:
            - "WorkOrder.${wo_id}.addons == []"

      - name: entity_active_system_count_computed_input_ignored
        claim_type: Computed Fields
        grounds: ["entities.Home.fields.active_system_count", "calculations.estimate_total"]
        distinguishing_aspect: "active_system_count is computed from ACTIVE child systems; adding 2 systems makes it 2 regardless of any client-supplied value."
        test_recipe:
          setup: ["A Home with no systems exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Dot C", email: "dotc@x.com", phone: "555-0203" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "23 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys B", register_count: 5 }
              as: PlanAdmin
          trigger:
            - call: "GET /homes/${home_id}"
              payload: {}
              as: Dispatcher
              captures: { count: $.data.active_system_count }
          assert:
            - "Home.${home_id}.active_system_count == 2"

      - name: entity_invalid_enum_service_type_rejected
        claim_type: Type Constraints
        grounds: ["entities.WorkOrder.fields.service_lines", "errors[ERR_INVALID_REQUEST]", "validations[priority=5]"]
        distinguishing_aspect: "service_line with service_type not in {DUCT,DRYER_VENT,SANITIZE} -> ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["A Home with 1 ACTIVE system exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Eli C", email: "elic@x.com", phone: "555-0204" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "24 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "CHIMNEY", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 400 and data.error_id == ERR_INVALID_REQUEST"

      - name: entity_system_create_requires_existing_home_parent
        claim_type: Parent Relationships
        grounds: ["entities.HvacSystem", "errors[ERR_HOME_NOT_FOUND]", "validations[priority=3]"]
        distinguishing_aspect: "POST /homes/{badId}/systems -> ERR_HOME_NOT_FOUND 404."
        test_recipe:
          setup: ["No such home id."]
          setup_api_calls: []
          trigger:
            - call: "POST /homes/00000000-0000-4000-8000-0000000000ff/systems"
              payload: { label: "Orphan", register_count: 4 }
              as: PlanAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 404 and data.error_id == ERR_HOME_NOT_FOUND"

      - name: entity_list_homes_pagination_envelope
        claim_type: Listing
        grounds: ["entities.Home", "response_envelope"]
        distinguishing_aspect: "GET /homes returns array envelope with total_count and has_more pagination fields."
        test_recipe:
          setup: ["One Home exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Fox C", email: "foxc@x.com", phone: "555-0205" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "25 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
          trigger:
            - call: "GET /homes"
              payload: {}
              as: Dispatcher
          assert:
            - "Response response_type == array; meta has api_request_id; total_count >= 1; has_more present"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: sm_inspect_from_completed_returns_bad_state
        claim_type: Invalid Transitions
        grounds: ["state_machines.WorkOrder.DRAFT_to_INSPECTED", "errors[ERR_WORK_ORDER_BAD_STATE]"]
        distinguishing_aspect: "Inspecting a COMPLETED WorkOrder -> ERR_WORK_ORDER_BAD_STATE 409; no Inspection created."
        test_recipe:
          setup: ["A COMPLETED WorkOrder (DUCT, 1 system) exists."]
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Gil C", email: "gilc@x.com", phone: "555-0206" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "26 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech C1", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 1, dust_severity: 2 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-04-22", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-plans/${route_id}/commit"
              payload: { work_order_id: "${wo_id}", scheduled_start_minute: 540, expected_route_plan_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /route-plans/${route_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { after_photo_count: 2, dust_severity: 2, performed_service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ] }
              as: Technician
              as_user_id: "${crew_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 9, dust_severity: 9 }
              as: Technician
              as_user_id: "${crew_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_WORK_ORDER_BAD_STATE"

      - name: sm_work_order_initial_state_is_draft
        claim_type: Initial State
        grounds: ["state_machines.WorkOrder", "entities.WorkOrder.fields.status"]
        distinguishing_aspect: "Newly created WorkOrder starts in status DRAFT."
        test_recipe:
          setup: ["A Home with 1 ACTIVE system exists."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Hex C", email: "hexc@x.com", phone: "555-0207" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "27 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id, st: $.data.status }
          assert:
            - "WorkOrder.${wo_id}.status == DRAFT"

      - name: sm_route_close_blocked_by_open_work
        claim_type: guarded transitions
        grounds: ["state_machines.RoutePlan.LOCKED_to_CLOSED", "errors[ERR_ROUTE_HAS_OPEN_WORK]"]
        distinguishing_aspect: "Closing a LOCKED route with a SCHEDULED committed WorkOrder -> ERR_ROUTE_HAS_OPEN_WORK 409 (cross-entity guard)."
        test_recipe:
          setup: ["Route Z1 LOCKED with one committed SCHEDULED WorkOrder (never started)."]
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ida C", email: "idac@x.com", phone: "555-0208" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "28 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech C2", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 1, dust_severity: 2 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-04-23", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-plans/${route_id}/commit"
              payload: { work_order_id: "${wo_id}", scheduled_start_minute: 540, expected_route_plan_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /route-plans/${route_id}/lock"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /route-plans/${route_id}/close"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Response status == 409 and data.error_id == ERR_ROUTE_HAS_OPEN_WORK"

      - name: sm_clock_advance_marks_reminder_due
        claim_type: Side Effect Execution
        grounds: ["state_machines.RecurringPlan.reminder_WAITING_to_DUE", "entities.RecurringPlan.fields.reminder_status", "endpoints"]
        distinguishing_aspect: "Setting the logical clock past next_reminder_at on an ACTIVE plan flips reminder_status WAITING->DUE."
        test_recipe:
          setup: ["Home with 1 system and one ACTIVE 6-month plan; enrolled_at default clock 2026-04-01; next_reminder_at 2026-10-01."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Jay C", email: "jayc@x.com", phone: "555-0209" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "29 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
            - call: "GET /homes/${home_id}"
              payload: {}
              as: PlanAdmin
              captures: { home_v: $.data.version }
            - call: "POST /homes/${home_id}/recurring-plans"
              payload: { cadence_months: 6, expected_home_version: "${home_v}" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-02T00:00:00Z" }
              as: PlanAdmin
          trigger:
            - call: "POST /recurring-plans/${plan_id}/refresh-reminder"
              payload: {}
              as: PlanAdmin
              captures: { rs: $.data.reminder_status }
          assert:
            - "RecurringPlan.${plan_id}.reminder_status == DUE"

      - name: sm_referral_decline_branch
        claim_type: Valid Transition
        grounds: ["state_machines.UpsellReferral.PENDING_to_DECLINED", "entities.UpsellReferral.fields.status"]
        distinguishing_aspect: "Declining a PENDING UpsellReferral -> status DECLINED (branch B, divergent from accept)."
        test_recipe:
          setup: ["A PENDING UpsellReferral exists (from a completed work order with recommend_hvac_repair)."]
          setup_api_calls:
            - call: "POST /pricing-configs"
              payload: { duct_base_cents: 12000, duct_per_system_cents: 4000, dryer_vent_flat_cents: 9000, sanitize_per_system_cents: 5000, addon_sanitizer_cents: 3000, addon_uv_cents: 7000, addon_coil_cents: 2500, multi_system_discount_pct: 0.10, plan_member_discount_pct: 0.15, tax_pct: 0.08 }
              as: PlanAdmin
              captures: { cfg_id: $.data.id }
            - call: "POST /pricing-configs/${cfg_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Kay C", email: "kayc@x.com", phone: "555-0210" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "30 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
              captures: { sys_a: $.data.id }
            - call: "POST /crew-members"
              payload: { full_name: "Tech C3", home_zone_code: "Z1" }
              as: Dispatcher
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { home_id: "${home_id}", service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ], requested_start_minute: 540 }
              as: Dispatcher
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/inspect"
              payload: { before_photo_count: 1, dust_severity: 5 }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/quote"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /route-plans"
              payload: { crew_member_id: "${crew_id}", zone_code: "Z1", service_date: "2026-04-24", shift_start_minute: 480, shift_end_minute: 1020 }
              as: Dispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /route-plans/${route_id}/commit"
              payload: { work_order_id: "${wo_id}", scheduled_start_minute: 540, expected_route_plan_version: "${route_v}" }
              as: Dispatcher
            - call: "POST /route-plans/${route_id}/lock"
              payload: {}
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: {}
              as: Technician
              as_user_id: "${crew_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { after_photo_count: 2, dust_severity: 5, recommend_hvac_repair: true, performed_service_lines: [ { service_type: "DUCT", system_id: "${sys_a}" } ] }
              as: Technician
              as_user_id: "${crew_id}"
            - call: "GET /upsell-referrals"
              payload: { work_order_id: "${wo_id}" }
              as: PlanAdmin
              captures: { ref_id: "$.data[0].id" }
          trigger:
            - call: "POST /upsell-referrals/${ref_id}/decline"
              payload: {}
              as: PlanAdmin
              captures: { st: $.data.status }
          assert:
            - "UpsellReferral.${ref_id}.status == DECLINED"

      - name: sm_acknowledge_advances_next_reminder_by_cadence
        claim_type: Side Effect Execution
        grounds: ["state_machines.RecurringPlan.reminder_DUE_to_ACKNOWLEDGED", "calculations.next_reminder_advance", "entities.RecurringPlan.fields.next_reminder_at"]
        distinguishing_aspect: "Acknowledging a DUE 6-month plan whose next_reminder_at was 2026-10-01 advances it to 2027-04-01 and re-arms reminder_status to WAITING."
        test_recipe:
          setup: ["ACTIVE 6-month plan enrolled at default clock 2026-04-01 (next_reminder_at 2026-10-01); clock advanced past it and reminder refreshed to DUE."]
          setup_api_calls:
            - call: "POST /homeowners"
              payload: { full_name: "Lex C", email: "lexc@x.com", phone: "555-0211" }
              as: PlanAdmin
              captures: { owner_id: $.data.id }
            - call: "POST /homes"
              payload: { homeowner_id: "${owner_id}", address_line: "31 Vent Rd", zone_code: "Z1", square_footage: 1500 }
              as: PlanAdmin
              captures: { home_id: $.data.id }
            - call: "POST /homes/${home_id}/systems"
              payload: { label: "Sys A", register_count: 5 }
              as: PlanAdmin
            - call: "GET /homes/${home_id}"
              payload: {}
              as: PlanAdmin
              captures: { home_v: $.data.version }
            - call: "POST /homes/${home_id}/recurring-plans"
              payload: { cadence_months: 6, expected_home_version: "${home_v}" }
              as: PlanAdmin
