        as: CertInspector
        captures:
          err: $.data.error_id
      - call: POST /sugarhouse/_clock/set_current_utc
        payload:
          to_iso8601: '2027-03-01T00:00:00Z'
        as: SugarhouseManager
      - call: POST /sugarhouse/cert-audits/${audit_id}/record-result
        payload:
          result: PASS
        as: CertInspector
        captures:
          st: $.data.status
      assert:
