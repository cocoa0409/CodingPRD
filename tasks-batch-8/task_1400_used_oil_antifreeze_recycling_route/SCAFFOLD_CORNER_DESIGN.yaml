          setup: ["Stop in READY_TO_PUMP"]
          setup_api_calls:
            - { call: "POST /recycle-routes/customers", payload: { legal_name: "Cons", epa_generator_id: "EPAGEN000190", market_zone: "NORTH", credit_terms: "NET30" }, as: RoutePlanner, captures: { cid: "$.data.id" } }
