              payload: { email: "lc10@x.com", display_name: "LC", primary_role: "LEGAL_COUNSEL" }
              as: OpsAdmin
              captures: { lc_id: $.data.id }
            - call: "POST /users"
              payload: { email: "ca10@x.com", display_name: "CA", primary_role: "CONTRACT_ANALYST" }
              as: OpsAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /users"
              payload: { email: "cc10@x.com", display_name: "CC", primary_role: "CHIEF_COUNSEL" }
              as: OpsAdmin
              captures: { cc_id: $.data.id }
            - call: "POST /contract-types"
              payload: { code: "MSA10", display_name: "MSA", low_value_threshold_cents: 100000, mid_value_threshold_cents: 500000, high_value_threshold_cents: 2000000, auto_approve_below_cents: 50000, requires_chief_counsel_above_cents: 10000000, default_business_owner_id: "${bo_id}", default_legal_counsel_id: "${lc_id}" }
              as: OpsAdmin
              captures: { ct_id: $.data.id }
            - call: "POST /counterparties"
              payload: { legal_name: "Iota", jurisdiction: "US-IL", risk_tier: "STANDARD" }
              as: OpsAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /playbooks"
              payload: { name: "Pri2Playbook" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { pb_id: $.data.id }
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "A", category: "OPERATIONAL", standard_text: "a", fallback_positions: ["a_fb"], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "MEDIUM" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
              captures: { clause_a: $.data.id }
            - call: "POST /playbooks/${pb_id}/publish"
              payload: {}
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "POST /intake-requests"
              payload: { submitted_by_user_id: "${ca_id}", contract_type_id: "${ct_id}", counterparty_id: "${cp_id}", contract_value_cents: 75000, effective_date: "2026-09-01T00:00:00Z" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_id: $.data.id }
            - call: "POST /intake-requests/${ir_id}/triage"
              payload: {}
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { ir_v: $.data.version }
            # Drafter is the legal counsel (lc_id) — sets up SoD violation
            - call: "POST /intake-requests/${ir_id}/open-negotiation"
              payload: { playbook_id: "${pb_id}", drafter_user_id: "${lc_id}", expected_intake_request_version: "${ir_v}" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
              captures: { neg_id: $.data.id }
            - call: "POST /negotiations/${neg_id}/rounds"
              payload: { change_summary: "r1" }
              as: ContractAnalyst
              as_user_id: "${ca_id}"
            - call: "POST /negotiations/${neg_id}/deviations"
              payload: { clause_template_id: "${clause_a}", proposed_text: "altA", fallback_index: 0 }
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { dev_a: $.data.id }
            - call: "POST /negotiations/${neg_id}/deviations/${dev_a}/begin-review"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
            # Now bump Playbook.version by adding another clause (this makes Negotiation stale)
            - call: "POST /playbooks/${pb_id}/clauses"
              payload: { clause_key: "B", category: "OPERATIONAL", standard_text: "b", fallback_positions: [], approver_role_required: "LEGAL_COUNSEL", deviation_severity_cap: "LOW" }
              as: ChiefCounsel
              as_user_id: "${cc_id}"
            - call: "GET /negotiations/${neg_id}"
              payload: {}
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { neg_v: $.data.version }
          trigger:
            # lc_id is both drafter and assigned approver -> SoD violation (priority 14)
            # Negotiation.playbook_version_at_pin < Playbook.version -> would be playbook_stale on finalize,
            # but /decide does not check playbook_stale; the only live priority conflict is auth vs state vs safety.
            # We instead demonstrate SoD by hitting /decide as lc_id (the drafter).
            - call: "POST /negotiations/${neg_id}/deviations/${dev_a}/decide"
              payload: { decision: "APPROVE", expected_negotiation_version: "${neg_v}" }
              as: LegalCounsel
              as_user_id: "${lc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error == ERR_SEGREGATION_OF_DUTIES_VIOLATION"
            - "HTTP status == 403"
            - "Deviation.${dev_a}.status remains IN_REVIEW"
            # Now demonstrate the referential error fires on finalize-redlining
            - "POST /negotiations/${neg_id}/finalize-redlining without override would return ERR_PLAYBOOK_STALE"

