              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { pd_err: $.data.error_id }
            - call: "POST /outside-activities/${pd_oba}/decide"
              payload: { decision: "APPROVE" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { pd_ok: $.data.status }
          assert:
            - "pd_err == \"ERR_PST_COMP_DETAILS_REQUIRED\""
            - "pd_ok == \"APPROVED\" (rule is conditional on compensated PST only)"

      - name: meeting_hold_before_date_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_MEETING_DATE_NOT_REACHED]"]
        distinguishing_aspect: "Temporal gate: hold before meeting_date is rejected; on the date it succeeds."
        test_recipe:
          setup: ["Meeting dated 2026-12-20; clock at 2026-12-01"]
          setup_api_calls:
            - call: "POST /meetings"
              payload: { year: 2026, meeting_date: "2026-12-20" }
              as: CompliancePrincipal
              as_user_id: "principal-a"
              captures: { mh2_mt: $.data.id }
