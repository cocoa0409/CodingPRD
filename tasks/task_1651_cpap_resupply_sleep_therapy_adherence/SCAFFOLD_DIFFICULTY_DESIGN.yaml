          - validations[priority=11]
        distinguishing_aspect: |
          Metric = adherence_pct_final vs payer.compliance_threshold_pct.
          Endpoint = POST /sleep-therapy/adherence-reports/{id}/finalize.
          Boundary semantics INCLUSIVE (>=): compliant_nights=21, window=30
          yields final=70.0 which equals threshold 70 -> is_compliance_current
          MUST be true (NOT false). One night fewer (compliant_nights=20,
          final=66.7) MUST flip to false.
        test_recipe:
          setup:
            - "PayerPolicy p1 (threshold 70, window 30); Patient pat11 PURCHASE setup complete"
            - "AdherenceReport with compliant_nights=21, nights_reported=30, window_end_on=2026-08-30"
