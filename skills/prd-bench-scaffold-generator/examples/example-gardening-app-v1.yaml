# =============================================================================
# Example: gardening-app benchmark seed tables (v1)
# =============================================================================

scenario: |
  Gardenia Community Garden API. Orchestrates seasonal garden plans, planting
  seasons, planting tasks, garden plot assignments, and harvest reporting.
  Manages water credit budgets, pest risk scoring, crop rotation enforcement,
  plot incompatibility rules, drought surcharges, and final harvest billing
  with chronological cost calculation.

domain_name: gardening-app
api_prefix: /garden-plans

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: GardenPlan
    parent: null
    common_fields: true  # id, created_at, updated_at
    fields:
      - { name: plan_name, type: string, source: input, description: "Plan name" }
      - { name: total_water_credits, type: number, source: input, description: "Total water credit allocation" }
      - { name: water_credits_balance, type: number, source: computed, description: "Read-only: remaining water credits, derived from WaterCreditLedger" }
      - { name: pest_risk_score, type: number, source: computed, description: "Read-only: ecological risk metric, starts at 0, lower is better" }
      - { name: status, type: enum, source: system, description: "PLANNING → ACTIVE → HARVESTING_PENDING → CLOSED" }

  - name: PlantingSeason
    parent: GardenPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent Garden Plan ID" }
      - { name: name, type: string, source: input, description: "Season name (e.g., Spring Planting)" }
      - { name: start_date, type: integer, source: input, description: "Start date as day of year (1-366)" }
      - { name: end_date, type: integer, source: input, description: "End date as day of year (must be > start_date)" }
      - { name: status, type: enum, source: system, description: "PLANNING → READY_FOR_PLANTING / CANCELLED" }

  - name: PlantingTask
    parent: PlantingSeason
    common_fields: true
    fields:
      - { name: season_id, type: string, source: system, description: "Parent Planting Season ID" }
      - { name: plan_id, type: string, source: system, description: "Parent Garden Plan ID" }
      - { name: plant_type, type: string, source: input, description: "Type of plant (e.g., Roma Tomato)" }
      - { name: plant_family, type: string, source: input, description: "Botanical family for crop rotation" }
      - { name: start_date, type: integer, source: input, description: "Task start date (day of year)" }
      - { name: end_date, type: integer, source: input, description: "Task end date (must be > start_date)" }
      - { name: water_requirement_liters, type: number, source: input, description: "Total water consumption for this task" }
      - { name: required_amendment, type: enum, source: input, default: "NONE", description: "ACIDIC_SOIL | FUNGICIDE_TREATED | NONE" }
      - { name: status, type: enum, source: system, description: "PENDING → APPROVED → SCHEDULED / CANCELLED" }

  - name: GardenPlot
    parent: GardenPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent Garden Plan ID" }
      - { name: plot_name, type: string, source: input, description: "Plot name" }
      - { name: plot_size_sqm, type: number, source: input, description: "Plot size in square meters" }
      - { name: water_credits_per_liter, type: number, source: input, description: "Water cost rate per liter" }
      - { name: applied_amendments, type: array, source: system, description: "List of amendments, each with id, name, applied_date" }
      - { name: last_task_family, type: string, source: computed, description: "Botanical family of most recently billed task on this plot" }
      - { name: incompatible_plot_ids, type: array, source: system, description: "List of incompatible plot IDs managed by GardenManager" }

  - name: TaskAssignment
    parent: GardenPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "Parent Garden Plan ID" }
      - { name: task_id, type: string, source: input, description: "Associated Planting Task ID" }
      - { name: plot_id, type: string, source: input, description: "Associated Garden Plot ID" }
      - { name: override_pest_check, type: boolean, source: input, default: false, description: "Whether to bypass pest risk threshold check" }
      - { name: pest_check_override_penalty_applied, type: boolean, source: computed, description: "True if override penalty (+100 points) was applied" }
      - { name: is_water_stressed, type: boolean, source: computed, description: "True if cumulative water usage exceeds base allocation" }
      - { name: provisional_credits, type: number, source: computed, description: "Provisional water credit cost (includes drought surcharge if stressed)" }
      - { name: final_credits, type: number, source: computed, description: "Final cost calculated during harvest (null until finalized)" }
      - { name: status, type: enum, source: system, description: "PENDING → APPROVED → SCHEDULED → BILLED / REJECTED / CANCELLED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: GardenPlan
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: ACTIVE
        trigger: POST /garden-plans/{planId}/activate
        actor: GardenManager
        preconditions:
          - "Plan must be in PLANNING state (ERR_PLAN_NOT_IN_PLANNING)"
        side_effects: []

      - from: ACTIVE
        to: HARVESTING_PENDING
        trigger: POST /garden-plans/{planId}/initiate-harvest
        actor: GardenManager
        preconditions:
          - "All assignments must be in terminal or committed state (ERR_UNRESOLVED_ASSIGNMENTS_EXIST)"
        side_effects: []

      - from: HARVESTING_PENDING
        to: CLOSED
        trigger: POST /garden-plans/{planId}/generate-harvest-report
        actor: BillingAdmin
        preconditions:
          - "Plan must be HARVESTING_PENDING (ERR_PLAN_NOT_READY_FOR_HARVEST)"
          - "Total final_credits must not exceed total_water_credits (ERR_HARVEST_EXCEEDS_CREDITS)"
        side_effects:
          - "All SCHEDULED assignments: compute final_credits → BILLED"
          - "Each plot's last_task_family updated"
          - "pest_risk_score reconciled"
          - "water_credits_balance finalized"
          - "Provisional ledger cleared to 0.0"

  - entity: PlantingSeason
    initial_state: PLANNING
    terminal_states: [CANCELLED]
    transitions:
      - from: PLANNING
        to: READY_FOR_PLANTING
        trigger: PUT /garden-plans/{planId}/planting-seasons/{seasonId}
        actor: GardenManager
        preconditions:
          - "Plan must be ACTIVE"
          - "All child Planting Tasks must be in SCHEDULED state (ERR_TASKS_NOT_SCHEDULED)"
          - "Season must have at least one task"
        side_effects: []

      - from: READY_FOR_PLANTING
        to: PLANNING
        trigger: "system (automatic when assignment cancellation causes a task to leave SCHEDULED state)"
        actor: system
        preconditions:
          - "A child task is no longer SCHEDULED"
        side_effects: []

      - from: PLANNING
        to: CANCELLED
        trigger: PUT /garden-plans/{planId}/planting-seasons/{seasonId}
        actor: GardenManager
        preconditions: []
        side_effects:
          - "All child PENDING tasks → CANCELLED"
          - "All associated non-terminal assignments → CANCELLED with ledger reversals"

      - from: READY_FOR_PLANTING
        to: CANCELLED
        trigger: PUT /garden-plans/{planId}/planting-seasons/{seasonId}
        actor: GardenManager
        preconditions: []
        side_effects:
          - "Same cascade as PLANNING → CANCELLED"

  - entity: PlantingTask
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "system (automatic when assignment proposed)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: SCHEDULED
        trigger: "system (automatic when assignment scheduled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: PENDING
        trigger: "system (automatic when assignment rejected/cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: PENDING
        trigger: "system (automatic when SCHEDULED assignment cancelled)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PENDING
        to: CANCELLED
        trigger: POST /garden-plans/{planId}/planting-seasons/{seasonId}/planting-tasks/{taskId}/cancel
        actor: Gardener
        preconditions:
          - "Task must be in PENDING state (ERR_TASK_NOT_PENDING_FOR_CANCEL)"
        side_effects:
          - "If all tasks in season are terminal, season may auto-transition"

  - entity: TaskAssignment
    initial_state: PENDING
    terminal_states: [BILLED, REJECTED, CANCELLED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: POST /garden-plans/{planId}/task-assignments/{assignmentId}/approve
        actor: GardenManager
        preconditions:
          - "Assignment must be PENDING (ERR_ASSIGNMENT_NOT_PENDING)"
        side_effects: []

      - from: PENDING
        to: REJECTED
        trigger: POST /garden-plans/{planId}/task-assignments/{assignmentId}/reject
        actor: GardenManager
        preconditions:
          - "Assignment must be PENDING (ERR_ASSIGNMENT_NOT_PENDING)"
        side_effects:
          - "Task reverts to PENDING"
          - "Provisional credits refunded"
          - "Pest risk penalties reversed"

      - from: APPROVED
        to: SCHEDULED
        trigger: POST /garden-plans/{planId}/task-assignments/{assignmentId}/schedule
        actor: GardenManager
        preconditions:
          - "Assignment must be APPROVED (ERR_ASSIGNMENT_NOT_APPROVED)"
          - "Task must be APPROVED (ERR_TASK_NOT_APPROVED)"
          - "Crop rotation re-validated"
          - "Recalculated provisional_credits must pass budget check"
        side_effects:
          - "Task → SCHEDULED"
          - "provisional_credits recalculated (based on APPROVED + SCHEDULED assignments)"
          - "is_water_stressed may change; pest risk adjusted accordingly"
          - "Water credit balance adjusted"

      - from: PENDING
        to: CANCELLED
        trigger: POST /garden-plans/{planId}/task-assignments/{assignmentId}/cancel
        actor: GardenManager
        preconditions:
          - "Assignment must not be in terminal state (ERR_ASSIGNMENT_NOT_CANCELLABLE)"
        side_effects:
          - "Task reverts to PENDING"
          - "Provisional credits refunded"
          - "All pest risk penalties reversed (water stress + override)"
          - "If parent season was READY_FOR_PLANTING, demote to PLANNING"

      - from: APPROVED
        to: CANCELLED
        trigger: POST /garden-plans/{planId}/task-assignments/{assignmentId}/cancel
        actor: GardenManager
        preconditions:
          - "Same as PENDING → CANCELLED"
        side_effects:
          - "Same as PENDING → CANCELLED"

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST /garden-plans/{planId}/task-assignments/{assignmentId}/cancel
        actor: GardenManager
        preconditions:
          - "Same as PENDING → CANCELLED"
        side_effects:
          - "Task reverts to PENDING"
          - "Provisional credits refunded"
          - "All pest risk penalties reversed"
          - "If parent season was READY_FOR_PLANTING, demote to PLANNING"

      - from: SCHEDULED
        to: BILLED
        trigger: "system (automatic during generate-harvest-report)"
        actor: system
        preconditions: []
        side_effects:
          - "final_credits calculated (chronological)"
          - "Plot's last_task_family updated"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: provisional_credits
    trigger: "assignment proposal and scheduling"
    algorithm: forward_looking
    formula: |
      1. Determine cumulative water usage for the target plot:
         - At proposal: from assignments in PENDING, APPROVED, SCHEDULED state
         - At scheduling: from assignments in APPROVED, SCHEDULED state
      2. cumulative_usage = sum(water_requirement_liters of relevant assignments) + current task's water_requirement
      3. BASE_ALLOCATION = 100 liters per plot
      4. If cumulative_usage > BASE_ALLOCATION:
           excess = cumulative_usage - BASE_ALLOCATION
           if excess >= current task's water_requirement:
             cost = water_requirement * water_credits_per_liter * DROUGHT_SURCHARGE_FACTOR
           else:
             normal_part = water_requirement - excess
             cost = normal_part * water_credits_per_liter + excess * water_credits_per_liter * DROUGHT_SURCHARGE_FACTOR
         else:
           cost = water_requirement * water_credits_per_liter
    constants:
      BASE_ALLOCATION: 100  # liters per plot
      DROUGHT_SURCHARGE_FACTOR: 1.5
    precision: "2 decimal places"

  - name: is_water_stressed
    trigger: "Calculated in sync with provisional_credits"
    algorithm: threshold
    formula: |
      Uses the same cumulative water usage calculation.
      if cumulative_usage > BASE_ALLOCATION:
        is_water_stressed = true
      else:
        is_water_stressed = false
    constants:
      BASE_ALLOCATION: 100

  - name: final_credits
    trigger: "harvest report generation"
    algorithm: chronological
    formula: |
      1. Collect all SCHEDULED assignments for the plot
      2. Sort by task.start_date ascending, then assignment ID for determinism
      3. running_usage = 0
      4. For each assignment in sorted order:
           running_usage += water_requirement_liters
           if running_usage > BASE_ALLOCATION:
             excess = running_usage - BASE_ALLOCATION
             if excess >= water_requirement:
               final_credits = water_requirement * rate * DROUGHT_SURCHARGE_FACTOR
             else:
               normal_part = water_requirement - excess
               final_credits = normal_part * rate + excess * rate * DROUGHT_SURCHARGE_FACTOR
           else:
             final_credits = water_requirement * rate
    constants:
      BASE_ALLOCATION: 100
      DROUGHT_SURCHARGE_FACTOR: 1.5
    precision: "2 decimal places"

  - name: water_credits_balance_update
    trigger: "assignment create, schedule, reject, cancel, harvest"
    algorithm: aggregation
    formula: |
      Create assignment: provisional_debits += provisional_credits
      Schedule: adjust provisional_debits (refund old, debit new)
      Reject/Cancel: provisional_debits -= provisional_credits
      Harvest: finalized_debits += final_credits, provisional cleared to 0.0
      water_credits_balance = total_water_credits - provisional_debits - finalized_debits

  - name: pest_risk_score
    trigger: "assignment create, schedule, reject, cancel"
    algorithm: aggregation
    formula: |
      Create assignment:
        if is_water_stressed: pest_risk_score += WATER_STRESS_PENALTY
        if is_water_stressed AND pest_risk_score (after penalty) >= THRESHOLD:
          if NOT override_pest_check: reject ERR_PEST_RISK_THRESHOLD_BREACHED
          if override_pest_check: pest_risk_score += OVERRIDE_PENALTY
      Schedule: if water_stressed status changed, adjust ±WATER_STRESS_PENALTY
      Reject/Cancel: reverse all assessed penalties (water stress + override)
      Harvest: reconcile based on final water stress calculations
      Floor: score never goes below 0
    constants:
      WATER_STRESS_PENALTY: 50
      OVERRIDE_PENALTY: 100
      THRESHOLD: 500

  - name: crop_rotation_check
    trigger: "assignment proposal and scheduling"
    algorithm: matching
    formula: |
      If task.plant_family == plot.last_task_family:
        reject ERR_CROP_ROTATION_VIOLATION

  - name: plot_incompatibility_check
    trigger: "assignment proposal"
    algorithm: pairing
    formula: |
      If the target plot has incompatible_plot_ids:
        check if any incompatible plot has a non-terminal assignment
        (PENDING, APPROVED, SCHEDULED, BILLED) in the same Planting Season:
        if so, reject ERR_PLOT_INCOMPATIBILITY

  - name: amendment_compatibility_check
    trigger: "assignment proposal"
    algorithm: matching
    formula: |
      If task.required_amendment != NONE:
        plot must have a matching amendment in applied_amendments
        if not: reject ERR_AMENDMENT_MISMATCH

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and valid"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all endpoints

  - priority: 2
    category: auth
    check: "Role must have permission for the operation"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all endpoints

  - priority: 3
    category: existence
    check: "Resource IDs in path must exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (ERR_PLAN_NOT_FOUND, ERR_SEASON_NOT_FOUND, ERR_TASK_NOT_FOUND, ERR_PLOT_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND)"
    http_status: 404
    applies_to: all nested resource endpoints

  - priority: 4
    category: state
    check: "Parent Garden Plan must be in ACTIVE state"
    error_id: ERR_PLAN_NOT_ACTIVE
    http_status: 409
    applies_to: "Create seasons, tasks, assignments"

  - priority: 5
    category: state
    check: "Target resource must be in correct state for the operation"
    error_id: "varies (ERR_TASK_NOT_PENDING, ERR_ASSIGNMENT_NOT_PENDING, ERR_ASSIGNMENT_NOT_APPROVED, etc.)"
    http_status: 409
    applies_to: state transition endpoints

  - priority: 6
    category: business_agricultural
    check: "Amendment compatibility: plot must have correct soil amendment for the task"
    error_id: ERR_AMENDMENT_MISMATCH
    http_status: 400
    applies_to: "POST /task-assignments (proposal)"

  - priority: 7
    category: business_agricultural
    check: "Crop rotation: task plant_family must not match plot's last_task_family"
    error_id: ERR_CROP_ROTATION_VIOLATION
    http_status: 409
    applies_to: "POST /task-assignments (proposal), POST /task-assignments/{id}/schedule"

  - priority: 8
    category: business_ecological
    check: "Plot incompatibility: incompatible plots cannot host concurrent plantings in same season"
    error_id: ERR_PLOT_INCOMPATIBILITY
    http_status: 409
    applies_to: "POST /task-assignments (proposal)"

  - priority: 9
    category: business_ecological
    check: "Pest risk threshold: water stress penalty must not push score >= 500 (unless override)"
    error_id: ERR_PEST_RISK_THRESHOLD_BREACHED
    http_status: 403
    applies_to: "POST /task-assignments (proposal)"

  - priority: 10
    category: business_fiscal
    check: "Water credit budget must be sufficient"
    error_id: ERR_INSUFFICIENT_WATER_CREDITS
    http_status: 402
    applies_to: "POST /task-assignments (proposal)"

# =============================================================================
# Table 5: API Endpoint Table (26 endpoints)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- GardenPlan ---
  - method: POST
    path: "/garden-plans"
    description: "Create a new Garden Plan"
    roles: [GardenManager]
    code: 201
    input: [plan_name, total_water_credits]
    output: GardenPlan
    side_effects: ["water_credits_balance initialized to total_water_credits, pest_risk_score to 0, provisional/finalized debits to 0.0"]

  - method: GET
    path: "/garden-plans"
    description: "List all Garden Plans"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "GardenPlan[]"
    side_effects: []

  - method: GET
    path: "/garden-plans/{planId}"
    description: "Get a specific Garden Plan"
    roles: [Any]
    code: 200
    input: []
    output: GardenPlan
    side_effects: []

  - method: POST
    path: "/garden-plans/{planId}/activate"
    description: "Activate a plan"
    roles: [GardenManager]
    code: 200
    input: []
    output: GardenPlan
    side_effects: ["status → ACTIVE"]

  - method: POST
    path: "/garden-plans/{planId}/initiate-harvest"
    description: "Move plan to HARVESTING_PENDING state"
    roles: [GardenManager]
    code: 200
    input: []
    output: GardenPlan
    side_effects:
      - "status → HARVESTING_PENDING"
      - "Precondition: no unresolved assignments"

  - method: POST
    path: "/garden-plans/{planId}/generate-harvest-report"
    description: "Finalize credits, bill assignments, and close the plan"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: GardenPlan
    side_effects:
      - "status → CLOSED"
      - "All SCHEDULED assignments: compute final_credits → BILLED"
      - "Plot last_task_family updated"
      - "pest_risk_score reconciled"
      - "water_credits_balance finalized"
      - "Provisional debits cleared to 0.0"

  # --- PlantingSeason ---
  - method: POST
    path: "/garden-plans/{planId}/planting-seasons"
    description: "Create a new Planting Season"
    roles: [Gardener]
    code: 201
    input: [name, start_date, end_date]
    output: PlantingSeason
    side_effects: []

  - method: GET
    path: "/garden-plans/{planId}/planting-seasons"
    description: "List Planting Seasons for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "PlantingSeason[]"
    side_effects: []

  - method: GET
    path: "/garden-plans/{planId}/planting-seasons/{seasonId}"
    description: "Get a specific Planting Season"
    roles: [Any]
    code: 200
    input: []
    output: PlantingSeason
    side_effects: []

  - method: PUT
    path: "/garden-plans/{planId}/planting-seasons/{seasonId}"
    description: "Update a Planting Season's status"
    roles: [GardenManager]
    code: 200
    input: [status]
    output: PlantingSeason
    side_effects:
      - "PLANNING → READY_FOR_PLANTING (requires all tasks SCHEDULED)"
      - "PLANNING/READY_FOR_PLANTING → CANCELLED (cascade cancellation)"

  # --- PlantingTask ---
  - method: POST
    path: "/garden-plans/{planId}/planting-seasons/{seasonId}/planting-tasks"
    description: "Create a new Planting Task"
    roles: [Gardener]
    code: 201
    input: [plant_type, plant_family, start_date, end_date, water_requirement_liters, "required_amendment?"]
    output: PlantingTask
    side_effects: []

  - method: GET
    path: "/garden-plans/{planId}/planting-seasons/{seasonId}/planting-tasks"
    description: "List Planting Tasks for a Season"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "PlantingTask[]"
    side_effects: []

  - method: GET
    path: "/garden-plans/{planId}/planting-seasons/{seasonId}/planting-tasks/{taskId}"
    description: "Get a specific Planting Task"
    roles: [Any]
    code: 200
    input: []
    output: PlantingTask
    side_effects: []

  - method: POST
    path: "/garden-plans/{planId}/planting-seasons/{seasonId}/planting-tasks/{taskId}/cancel"
    description: "Cancel a Planting Task"
    roles: [Gardener]
    code: 200
    input: []
    output: PlantingTask
    side_effects:
      - "status → CANCELLED (only from PENDING)"

  # --- GardenPlot ---
  - method: POST
    path: "/garden-plans/{planId}/garden-plots"
    description: "Create a new Garden Plot"
    roles: [Gardener]
    code: 201
    input: [plot_name, plot_size_sqm, water_credits_per_liter]
    output: GardenPlot
    side_effects: ["applied_amendments initialized to empty array, last_task_family to null"]

  - method: GET
    path: "/garden-plans/{planId}/garden-plots"
    description: "List Garden Plots for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "GardenPlot[]"
    side_effects: []

  - method: GET
    path: "/garden-plans/{planId}/garden-plots/{plotId}"
    description: "Get a specific Garden Plot"
    roles: [Any]
    code: 200
    input: []
    output: GardenPlot
    side_effects: []

  - method: POST
    path: "/garden-plans/{planId}/garden-plots/{plotId}/amendments"
    description: "Add a soil amendment to a garden plot"
    roles: [Gardener]
    code: 201
    input: ["name (ACIDIC_SOIL | FUNGICIDE_TREATED), applied_date"]
    output: GardenPlot
    side_effects: ["Amendment added to applied_amendments array"]

  - method: POST
    path: "/garden-plans/{planId}/garden-plots/{plotId}/incompatibilities"
    description: "Set incompatible plots for a given plot"
    roles: [GardenManager]
    code: 200
    input: [incompatible_plot_ids]
    output: GardenPlot
    side_effects:
      - "Plot cannot be incompatible with itself (ERR_SELF_INCOMPATIBILITY)"
      - "All referenced plots must exist (ERR_INCOMPATIBLE_PLOT_NOT_FOUND)"

  # --- TaskAssignment ---
  - method: POST
    path: "/garden-plans/{planId}/task-assignments"
    description: "Propose a new task assignment for a planting task"
    roles: [Gardener]
    code: 201
    input: [task_id, plot_id, "override_pest_check?"]
    output: TaskAssignment
    side_effects:
      - "Calculate provisional_credits and is_water_stressed"
      - "Debit provisional_credits to WaterCreditLedger"
      - "Update pest_risk_score"
      - "Task → APPROVED"
      - "Validation chain: amendment, crop rotation, incompatibility, pest risk, budget"

  - method: GET
    path: "/garden-plans/{planId}/task-assignments"
    description: "List all Task Assignments for a Plan"
    roles: [Any]
    code: 200
    input: ["limit?, offset?"]
    output: "TaskAssignment[]"
    side_effects: []

  - method: GET
    path: "/garden-plans/{planId}/task-assignments/{assignmentId}"
    description: "Get a specific Task Assignment"
    roles: [Any]
    code: 200
    input: []
    output: TaskAssignment
    side_effects: []

  - method: POST
    path: "/garden-plans/{planId}/task-assignments/{assignmentId}/approve"
    description: "Approve a proposed assignment"
    roles: [GardenManager]
    code: 200
    input: []
    output: TaskAssignment
    side_effects: ["status → APPROVED"]

  - method: POST
    path: "/garden-plans/{planId}/task-assignments/{assignmentId}/schedule"
    description: "Schedule an approved assignment"
    roles: [GardenManager]
    code: 200
    input: []
    output: TaskAssignment
    side_effects:
      - "status → SCHEDULED, Task → SCHEDULED"
      - "Crop rotation re-validated"
      - "provisional_credits recalculated (APPROVED + SCHEDULED only)"
      - "is_water_stressed may change; pest risk adjusted"
      - "Water credit balance adjusted"

  - method: POST
    path: "/garden-plans/{planId}/task-assignments/{assignmentId}/reject"
    description: "Reject a proposed assignment"
    roles: [GardenManager]
    code: 200
    input: []
    output: TaskAssignment
    side_effects:
      - "status → REJECTED"
      - "Task reverts to PENDING"
      - "Provisional credits refunded"
      - "Pest risk penalties reversed"

  - method: POST
    path: "/garden-plans/{planId}/task-assignments/{assignmentId}/cancel"
    description: "Cancel a task assignment"
    roles: [GardenManager]
    code: 200
    input: []
    output: TaskAssignment
    side_effects:
      - "status → CANCELLED"
      - "Task reverts to PENDING"
      - "Provisional credits refunded"
      - "All pest risk penalties reversed (water stress + override)"
      - "If parent season was READY_FOR_PLANTING, demote to PLANNING"

# =============================================================================
# Table 6: Error Code Catalogue (30 error codes)
# =============================================================================
errors:
  # --- Authentication & Authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header is missing or invalid"

  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Current role does not have permission for this operation"

  # --- Resource Not Found ---
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "Garden plan with given planId does not exist"

  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "Planting season with given seasonId does not exist"

  - id: ERR_TASK_NOT_FOUND
    http: 404
    condition: "Planting task with given taskId does not exist"

  - id: ERR_PLOT_NOT_FOUND
    http: 404
    condition: "Garden plot with given plotId does not exist"

  - id: ERR_INCOMPATIBLE_PLOT_NOT_FOUND
    http: 404
    condition: "Referenced incompatible plot does not exist"

  - id: ERR_ASSIGNMENT_NOT_FOUND
    http: 404
    condition: "Task assignment with given assignmentId does not exist"

  # --- State Constraints ---
  - id: ERR_PLAN_NOT_ACTIVE
    http: 409
    condition: "Operation requires plan to be in ACTIVE state"

  - id: ERR_PLAN_NOT_IN_PLANNING
    http: 409
    condition: "Activate requires plan to be in PLANNING state"

  - id: ERR_PLAN_NOT_READY_FOR_HARVEST
    http: 409
    condition: "generate-harvest-report requires plan to be in HARVESTING_PENDING state"

  - id: ERR_TASK_NOT_PENDING
    http: 409
    condition: "Task must be in PENDING state to create an assignment"

  - id: ERR_TASK_NOT_PENDING_FOR_CANCEL
    http: 409
    condition: "Task must be in PENDING state to cancel directly"

  - id: ERR_TASK_NOT_APPROVED
    http: 409
    condition: "Task must be in APPROVED state for assignment scheduling"

  - id: ERR_ASSIGNMENT_NOT_PENDING
    http: 409
    condition: "approve/reject requires assignment to be in PENDING state"

  - id: ERR_ASSIGNMENT_NOT_APPROVED
    http: 409
    condition: "schedule requires assignment to be in APPROVED state"

  - id: ERR_ASSIGNMENT_NOT_CANCELLABLE
    http: 409
    condition: "cancel requires assignment to not be in a terminal state"

  - id: ERR_ILLEGAL_SEASON_STATE_TRANSITION
    http: 409
    condition: "Season state transition is invalid"

  - id: ERR_TASKS_NOT_SCHEDULED
    http: 409
    condition: "Not all tasks are SCHEDULED when transitioning season to READY_FOR_PLANTING"

  - id: ERR_UNRESOLVED_ASSIGNMENTS_EXIST
    http: 409
    condition: "Unresolved assignments exist when initiating harvest"

  # --- Business Validation ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "General request format error (missing required fields, type mismatch)"

  - id: ERR_INVALID_SEASON_DATES
    http: 400
    condition: "Season end_date not strictly after start_date"

  - id: ERR_INVALID_TASK_DATES
    http: 400
    condition: "Task end_date not strictly after start_date"

  - id: ERR_SELF_INCOMPATIBILITY
    http: 400
    condition: "Plot cannot be marked incompatible with itself"

  - id: ERR_AMENDMENT_MISMATCH
    http: 400
    condition: "Plot does not have the soil amendment required by the task"

  - id: ERR_CROP_ROTATION_VIOLATION
    http: 409
    condition: "Task plant_family matches plot's last_task_family (consecutive same-family planting)"

  - id: ERR_PLOT_INCOMPATIBILITY
    http: 409
    condition: "Incompatible plots cannot host concurrent plantings in the same season"

  # --- Ecological & Financial ---
  - id: ERR_PEST_RISK_THRESHOLD_BREACHED
    http: 403
    condition: "Water stress penalty would cause pest_risk_score >= 500 and override not set"

  - id: ERR_INSUFFICIENT_WATER_CREDITS
    http: 402
    condition: "provisional_credits exceeds available water credit balance"

  - id: ERR_HARVEST_EXCEEDS_CREDITS
    http: 402
    condition: "Total final_credits exceed total_water_credits at harvest finalization"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: GardenManager
    description: "Manages garden plans, seasons, plot incompatibilities, and assignment workflow"
    exclusive_operations:
      - "POST /garden-plans — Create garden plan"
      - "POST .../activate — Activate plan"
      - "POST .../initiate-harvest — Initiate harvest"
      - "PUT .../planting-seasons/{id} — Update season status"
      - "POST .../task-assignments/{id}/approve — Approve assignment"
      - "POST .../task-assignments/{id}/schedule — Schedule assignment"
      - "POST .../task-assignments/{id}/reject — Reject assignment"
      - "POST .../task-assignments/{id}/cancel — Cancel assignment"
      - "POST .../garden-plots/{id}/incompatibilities — Set plot incompatibilities"

  - name: Gardener
    description: "Defines planting work and proposes assignments"
    exclusive_operations:
      - "POST .../planting-seasons — Create planting season"
      - "POST .../planting-tasks — Create planting task"
      - "POST .../planting-tasks/{id}/cancel — Cancel planting task"
      - "POST .../garden-plots — Create garden plot"
      - "POST .../garden-plots/{id}/amendments — Add amendment"
      - "POST .../task-assignments — Propose assignment"

  - name: BillingAdmin
    description: "Responsible for final harvest billing"
    exclusive_operations:
      - "POST .../generate-harvest-report — Generate harvest report and close plan"

  - name: Any
    description: "Shared across all roles"
    shared_operations:
      - "GET /garden-plans — List plans"
      - "GET /garden-plans/{planId} — Get plan"
      - "GET .../planting-seasons — List seasons"
      - "GET .../planting-seasons/{id} — Get season"
      - "GET .../planting-tasks — List tasks"
      - "GET .../planting-tasks/{id} — Get task"
      - "GET .../garden-plots — List plots"
      - "GET .../garden-plots/{id} — Get plot"
      - "GET .../task-assignments — List assignments"
      - "GET .../task-assignments/{id} — Get assignment"
