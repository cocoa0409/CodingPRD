  - section: cross_cutting_layers
    instances:
      - name: stale_settlement_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[settlement-mark-paid-stale-settlement]"
          - "errors.ERR_STALE_SETTLEMENT_VERSION"
        distinguishing_aspect: "OCC on Settlement.version at mark-paid: client reads v1, a dispute+resolve cascade bumps to v3, the mark-paid carrying expected_settlement_version=v1 returns 412."
        test_recipe:
          setup: ["Settlement S1 RECONCILED, version captured before dispute/resolve."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours"
              payload: { name: "T", home_base_city: "Tampa", season_start_on: "2026-09-01T00:00:00Z", season_end_on: "2027-06-30T00:00:00Z", market_cooldown_days: 30, royalty_reserve_pct: 0 }
              as: TourManager
              captures: { tour_id: $.data.id }
            - call: "POST /tours/${tour_id}/open-routing"
              payload: {}
              as: TourManager
            - call: "POST /venues"
              payload: { name: "V", market_code: "DAL", capacity_seats: 10000, load_in_dock_doors: 4, union_rule_set: "NON_UNION", default_rent_cents: 4000000, percentage_share_pct: 0.30 }
              as: VenueBooker
              captures: { venue_id: $.data.id }
            - call: "POST /venues/${venue_id}/date-avails"
              payload: { opens_at: "2026-09-10T00:00:00Z", closes_at: "2026-09-15T00:00:00Z", priority_rank: 10 }
              as: VenueBooker
              captures: { avail_id: $.data.id, avail_v: $.data.version }
            - call: "POST /tours/${tour_id}/engagements"
              payload: { venue_id: "${venue_id}", date_avail_id: "${avail_id}", load_in_at: "2026-09-10T08:00:00Z", first_show_at: "2026-09-11T19:00:00Z", load_out_at: "2026-09-13T23:00:00Z", deal_type: "FLAT_RENT", agreed_rent_cents: 4000000, expected_avail_version: "${avail_v}" }
              as: TourManager
              captures: { eng_id: $.data.id }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/confirm"
              payload: {}
              as: TourManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/reconcile"
              payload: {}
              as: TourManager
              captures: { settle_id: $.data.id, settle_v1: $.data.version }
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/dispute"
              payload: {}
              as: VenueBooker
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/resolve-dispute"
              payload: {}
              as: TourManager
          trigger:
            - call: "POST /tours/${tour_id}/engagements/${eng_id}/settlement/mark-paid"
              payload: { expected_settlement_version: "${settle_v1}" }
              as: TourManager
              captures: { err: $.data.error_id }
          assert:
            - "status == 412 and err == ERR_STALE_SETTLEMENT_VERSION (settle_v1 is stale after dispute+resolve bumped the version twice)"
            - "Settlement.${settle_id}.status == RECONCILED (still — mark-paid rejected)"

