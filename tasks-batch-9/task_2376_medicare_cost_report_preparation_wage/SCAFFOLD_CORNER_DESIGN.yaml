  - section: cross-cutting complexity layers
    # §1.0 complexity_profile.complexity_layers declares exactly five layers:
    # optimistic_concurrency, cascading_side_effects, dual_variant_calculation,
    # rate_threshold_triggers and derived_field_reconciliation. The remaining
    # rows of the guide's layer table (soft_delete, idempotency,
    # pagination_with_filtering, bulk_operations, scheduled_actions,
    # multi_tenancy, conditional_feature_flags) are non-applicable - this
    # scaffold declares no soft delete, no idempotency key, no cursor
    # pagination beyond limit/offset, no bulk endpoint, no scheduled job, no
    # tenant dimension and no feature flag.
    instances:

      - name: stale_expected_cost_report_version_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[stepdown-run-create-stale-report]
          - errors[ERR_STALE_COST_REPORT_VERSION]
          - validations[priority=8]
          - endpoints[POST /cost-reports/{id}/stepdown-runs]
        distinguishing_aspect: "The client reads CostReport.version, another writer revises cost center 03000's SQUARE_FEET (bumping the version), and the stepdown run then carries the pre-revision version, so the declared occ_field expected_cost_report_version yields ERR_STALE_COST_REPORT_VERSION (412) and no StepdownRun row is created at all."
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "a DRAFT CostReport with cost centers 00100 (GENERAL_SERVICE, SQUARE_FEET, order 1) and 03000 (ROUTINE, 3000 sq ft)"
            - "both ledger lines mapped, so unmapped_tb_total_cents is 0"
            - "the client observed CostReport.version before the statistics revision"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
