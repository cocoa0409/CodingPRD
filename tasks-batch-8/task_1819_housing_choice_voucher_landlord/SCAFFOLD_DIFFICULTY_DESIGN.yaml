              captures: { property8_id: $.data.id }
            - call: "POST /hcv/properties/${property8_id}/units"
              payload: { unit_label: "U8", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { unit8_id: $.data.id, unit8_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "F8", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { family8_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${unit8_id}", family_id: "${family8_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${unit8_v}" }
              as: Landlord
              as_user_id: "${landlord8_id}"
              captures: { contract8_id: $.data.id }
            - call: "POST /hcv/contracts/${contract8_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${landlord8_id}"
            - call: "POST /hcv/contracts/${contract8_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
          trigger:
            - call: "POST /hcv/contracts/${contract8_id}/terminate"
              payload: {}
              as: HousingAuthorityAdmin
          assert:
            - "HAPContract.${contract8_id}.status == TERMINATED"
            - "VoucherFamily.${family8_id}.status == SEARCHING"
            - "Unit.${unit8_id}.status == LISTED"
            - "All SCHEDULED HAPPayments for the contract are VOID"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_contract_submit
        grounds:
          - validations[priority=4]
          - validations[priority=12]
        distinguishing_aspect: |
          Error-category pair state (ERR_INVALID_STATE, priority 4) vs business_fiscal
          (ERR_INVALID_AMOUNT, priority 12): submitting a contract that is already
          PENDING_INSPECTION (state violation) AND has a non-positive rent would fail
          both checks; the state error must win because priority 4 < 12.
        test_recipe:
          setup:
            - "Contract in PENDING_INSPECTION (already submitted once)"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "L Nine", tax_id: "T9" }
              as: HousingAuthorityAdmin
