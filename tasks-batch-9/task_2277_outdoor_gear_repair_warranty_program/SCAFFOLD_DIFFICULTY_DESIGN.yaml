      - name: repair_order_creation_requires_decided_claim
        grounds:
          - validations[priority=11]
          - validations[priority=39]
          - state_machines.WarrantyClaim.UNDER_ASSESSMENT_to_WARRANTY_APPROVED
          - entities.RepairOrder.fields.warranty_claim_id
        distinguishing_aspect: |
          Entity pair RepairOrder <- WarrantyClaim: the order may only be opened while
          its claim sits in a decided state. The identical POST body is refused with
