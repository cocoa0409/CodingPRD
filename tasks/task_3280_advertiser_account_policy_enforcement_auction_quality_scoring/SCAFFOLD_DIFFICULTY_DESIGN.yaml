  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: campaign_activation_blocked_by_account_posture
        grounds:
          - state_machines.Campaign.DRAFT_to_ACTIVE
          - validations[priority=10]
          - errors[ERR_VERIFICATION_REQUIRED]
          - errors[ERR_ACCOUNT_SUSPENDED]
        distinguishing_aspect: |
          Entity pair Campaign -> AdvertiserAccount: the same activate call is
          gated by the parent's posture — PENDING_VERIFICATION yields
          ERR_VERIFICATION_REQUIRED while SUSPENDED yields ERR_ACCOUNT_SUSPENDED,
          and only ACTIVE lets it through.
        test_recipe:
          setup:
            - "Clock 2026-09-01. Account U never verified (PENDING_VERIFICATION) with campaign CU. Account V verified ACTIVE then suspended, with campaign CV."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Unver", country_code: "US" }
              as: Anonymous
              captures: { au: $.data.id }
            - call: "POST /advertiser-accounts"
              payload: { business_name: "Susp", country_code: "US" }
              as: Anonymous
              captures: { av: $.data.id, av_v: $.data.version }
            - call: "POST /advertiser-accounts/${av}/identity-verifications"
              payload: { legal_business_name: "Susp LLC", registration_number: "RN-12", document_type: "BUSINESS_LICENSE", disclosure_consent: true, expected_account_version: "${av_v}" }
              as: Advertiser
              as_user_id: "${av}"
              captures: { vv: $.data.id }
            - call: "POST /identity-verifications/${vv}/decide"
              payload: { outcome: "APPROVED" }
              as: PlatformAdmin
            - call: "POST /campaigns"
              payload: { account_id: "${au}", name: "CU", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${au}"
              captures: { cu: $.data.id }
            - call: "POST /campaigns"
              payload: { account_id: "${av}", name: "CV", daily_budget_cents: 1000, start_date: "2026-09-01", end_date: "2026-12-31" }
              as: Advertiser
              as_user_id: "${av}"
              captures: { cv: $.data.id }
            - call: "POST /advertiser-accounts/${av}/suspend"
              payload: { reason_code: "CIRCUMVENTION" }
              as: PlatformAdmin
          trigger:
            - call: "POST /campaigns/${cu}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${au}"
              captures: { err_u: $.data.error_id }
            - call: "POST /campaigns/${cv}/activate"
              payload: {}
              as: Advertiser
              as_user_id: "${av}"
              captures: { err_v: $.data.error_id }
          assert:
            - "err_u == ERR_VERIFICATION_REQUIRED (account PENDING_VERIFICATION)"
            - "err_v == ERR_ACCOUNT_SUSPENDED (account SUSPENDED)"

      - name: ad_eligibility_blocked_by_open_human_review
        grounds:
          - state_machines.Ad.UNDER_REVIEW_to_ELIGIBLE
          - state_machines.PolicyReview.PENDING_AUTO_to_NEEDS_HUMAN
          - errors[ERR_NO_ELIGIBLE_AD]
        distinguishing_aspect: |
          Different entity pair (Ad -> PolicyReview, not Campaign ->
          AdvertiserAccount): an ad stuck in a NEEDS_HUMAN review is invisible to
          the auction (ERR_NO_ELIGIBLE_AD despite a matching keyword), and only
          the reviewer's HUMAN_APPROVED — a transition on a different entity —
          makes it servable.
