  - section: cross_cutting_complexity_layers
    instances:

      - name: reissue_from_a_pre_regimen_change_cycle_view_is_rejected_as_stale
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.reissue-create-stale-cycle
          - validations.priority_7
          - errors.ERR_STALE_CYCLE_VERSION
          - endpoints.POST_/pharmacy/fill-cycles/{id}/reissue
        distinguishing_aspect: "The declared OCC parent for the reissue route is the FillCycle, and the regimen change that CREATES the work also bumps that version — so a client that read the cycle before requesting the change is always stale and must re-read."
        test_recipe:
          setup:
            - "logical clock at 2026-08-10T00:00:00Z; plan Northwind PBM, coinsurance 20, threshold 75"
            - "patient Rosa Klein synchronized on anchor day 15 in BRIDGE_TO_START with two pouchable tablets: Sitagliptin SPECIALTY and Rivaroxaban PREFERRED_BRAND"
            - "cycle C1 [2026-08-15, 2026-09-12) adjudicated CLEARED at total_copay_cents 2644 (986 + 1658) and rolled, so packaging_status is ROLL_GENERATED"
          setup_api_calls:
            - call: "POST /pharmacy/_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /pharmacy/insurance-plans"
              payload: { payer_name: "Northwind PBM", bin_number: "610502", generic_copay_cents_per_day: 34, brand_copay_cents_per_day: 74, specialty_copay_cents_per_day: 44, refill_too_soon_threshold_pct: 75, coinsurance_pct: 20 }
              as: PlatformAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /pharmacy/patients"
              payload: { full_name: "Rosa Klein", date_of_birth: "1954-09-09", email: "rosa.klein@example.com", state_code: "WA", insurance_plan_id: "${plan_id}" }
              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Sitagliptin", ndc: "00006-0277-31", strength: "100mg", form: "TABLET", copay_tier: "SPECIALTY", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-18", last_dispensed_days_supply: 30 }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Rivaroxaban", ndc: "50458-0578-30", strength: "20mg", form: "TABLET", copay_tier: "PREFERRED_BRAND", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01", last_dispensed_date: "2026-07-20", last_dispensed_days_supply: 30 }
              as: Prescriber
              captures: { rx2: $.data.id }
            - call: "POST /pharmacy/patients/${pt_id}/synchronize"
              payload: { anchor_fill_day: 15, sync_mode: "BRIDGE_TO_START" }
              as: PharmacyOperations
            - call: "POST /pharmacy/fill-cycles"
              payload: { patient_id: "${pt_id}", cycle_start_date: "2026-08-15", day_supply_days: 28 }
              as: PharmacyOperations
              captures: { c1: $.data.id }
            - call: "POST /pharmacy/fill-cycles/${c1}/adjudicate"
              payload: {}
              as: VerifyingPharmacist
              captures: { total: $.data.total_copay_cents, v_pre: $.data.version }
            - call: "POST /pharmacy/fill-cycles/${c1}/generate-roll"
              payload: {}
              as: PackagingTechnician
              as_user_id: "tech-01"
              captures: { roll: $.data.id }
            - call: "GET /pharmacy/prescriptions/${rx1}"
              payload: {}
              as: Prescriber
              captures: { pv: $.data.version }
            - call: "POST /pharmacy/prescriptions/${rx1}/regimen-change"
              payload: { new_drug_name: "Linagliptin", new_form: "TABLET", new_copay_tier: "SPECIALTY", new_dose_times: ["MORNING"], new_quantity_per_dose: 1, expected_prescription_version: "${pv}" }
              as: Prescriber
              captures: { rx1_next: $.data.id }
          trigger:
            - call: "POST /pharmacy/fill-cycles/${c1}/reissue"
              payload: { effective_date: "2026-08-25", replacement_prescription_ids: ["${rx1_next}"], expected_cycle_version: "${v_pre}" }
              as: PharmacyOperations
              captures: { err: $.data.error_id }
            - call: "GET /pharmacy/fill-cycles/${c1}"
              payload: {}
              as: PharmacyOperations
              captures: { v_now: $.data.version, reissue_flag: $.data.reissue_required }
            - call: "POST /pharmacy/fill-cycles/${c1}/reissue"
              payload: { effective_date: "2026-08-25", replacement_prescription_ids: ["${rx1_next}"], expected_cycle_version: "${v_now}" }
              as: PharmacyOperations
              captures: { c2: $.data.id, c2_days: $.data.day_supply_days, c2_start: $.data.cycle_start_date }
          assert:
            - "${total} == 2644 and the generate-roll plus regimen-change writes each raised FillCycle.version, so ${v_now} == ${v_pre} + 2"
            - "the stale attempt returns HTTP 412 with ${err} == ERR_STALE_CYCLE_VERSION, and NOTHING is written: no CreditMemo exists, Patient.${pt_id}.credit_balance_cents is 0 and FillCycle.${c1}.version is still ${v_now}"
            - "${reissue_flag} == true — the work item survived the rejected attempt"
            - "the retry with the re-read version succeeds: ${c2_start} == 2026-08-25, ${c2_days} == 18 (2026-09-12 - 2026-08-25), is_partial_reissue true and reissue_of_cycle_id == ${c1}"
            - "the credit lands exactly once: gross 634 (round_half_up(986 x 18 / 28) = 633.86), tier_basis 2010 (2644 - 634), fee 250 (reduced tier) and CreditMemo.amount_cents 384"
            - "replaying the successful reissue with ${v_now} a second time returns ERR_STALE_CYCLE_VERSION again, so the credit cannot be double-issued"

