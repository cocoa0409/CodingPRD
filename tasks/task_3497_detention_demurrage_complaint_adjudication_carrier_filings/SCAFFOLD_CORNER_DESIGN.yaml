      - name: ombuds_settle_resolves_informally_and_credits_shipper
        claim_type: Valid Transition
        grounds:
          - state_machines.Complaint.OMBUDS_to_RESOLVED_INFORMAL
          - entities.ShipperAccount.fields.total_recovery_cents
        distinguishing_aspect: "Closing an ombuds round SETTLED with settlement_amount_cents 40000 moves the complaint to RESOLVED_INFORMAL and credits the shipper ledger by exactly the settlement — informal resolution has reparations-like effect without adjudication."
        test_recipe:
          setup:
            - "Complaint in OMBUDS under officer om-1 (standard invoice setup, referral by docket)."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
            - *c_invoice
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 50000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /fmc/complaints/${comp_id}/refer-ombuds"
              payload: { ombuds_officer_id: "om-1" }
              as: CommissionDocket
          trigger:
            - call: "POST /fmc/complaints/${comp_id}/close-ombuds"
              payload: { outcome: "SETTLED", settlement_amount_cents: 40000 }
              as: OmbudsOfficer
              as_user_id: "om-1"
          assert:
            - "Complaint.${comp_id}.complaint_status == RESOLVED_INFORMAL and informal_settlement_cents == 40000"
            - "GET /fmc/shippers/${shipper_id} shows total_recovery_cents == 40000"
            - "Complaint.${comp_id}.ombuds_rounds == 0 (a settled round is not a failed round)"

      - name: terminal_resolved_complaint_rejects_further_actions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Complaint
          - errors.ERR_COMPLAINT_NOT_DOCKETED
        distinguishing_aspect: "From terminal RESOLVED_INFORMAL, both remaining lifecycle triggers (refer-ombuds, open-adjudication) are rejected with 409 ERR_COMPLAINT_NOT_DOCKETED."
        test_recipe:
          setup:
            - "Complaint already RESOLVED_INFORMAL via a settled ombuds round."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
            - *c_invoice
            - call: "POST /fmc/complaints"
              payload: { respondent_carrier_id: "${carrier_id}", subject_invoice_ids: ["${inv_id}"], reparations_claimed_cents: 50000 }
              as: ShipperRep
              as_user_id: "${shipper_id}"
              captures: { comp_id: $.data.id }
            - call: "POST /fmc/complaints/${comp_id}/refer-ombuds"
              payload: { ombuds_officer_id: "om-1" }
              as: CommissionDocket
            - call: "POST /fmc/complaints/${comp_id}/close-ombuds"
              payload: { outcome: "SETTLED", settlement_amount_cents: 40000 }
              as: OmbudsOfficer
              as_user_id: "om-1"
          trigger:
            - call: "POST /fmc/complaints/${comp_id}/refer-ombuds"
              payload: { ombuds_officer_id: "om-2" }
              as: CommissionDocket
              captures: { err_refer: $.data.error_id }
            - call: "POST /fmc/complaints/${comp_id}/open-adjudication"
              payload: {}
              as: AdministrativeLawJudge
              as_user_id: "alj-1"
              captures: { err_open: $.data.error_id }
          assert:
            - "both responses are 409 with error_id == ERR_COMPLAINT_NOT_DOCKETED"
            - "the complaint remains RESOLVED_INFORMAL and informal_settlement_cents stays 40000"

      - name: voided_and_paid_invoices_reject_further_billing_actions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.DemurrageDetentionInvoice
          - errors.ERR_INVOICE_NOT_DISPUTABLE
          - errors.ERR_INVOICE_NOT_PAYABLE
        distinguishing_aspect: "Both terminal invoice states lock down: a PAID invoice rejects dispute filing (ERR_INVOICE_NOT_DISPUTABLE); a VOIDED invoice rejects mark-paid (ERR_INVOICE_NOT_PAYABLE)."
        test_recipe:
          setup:
            - "Two invoices on the standard setup: invoice A marked PAID; invoice B DISPUTED then timely WAIVE-responded so it is VOIDED."
          setup_api_calls:
            - *c_clock
            - *c_carrier
            - *c_shipper
            - *c_tariff
            - *c_clock3
            - *c_publish
            - *c_clock10
