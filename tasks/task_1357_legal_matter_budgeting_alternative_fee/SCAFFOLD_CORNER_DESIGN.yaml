  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_version_on_arrangement_activate
        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[arrangement-activate-stale-matter]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "FeeArrangement activate with stale expected_matter_version → ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Matter M1 with arrangement A1 PENDING_APPROVAL; client reads version N; another writer activates arrangement A2 first (superseding), bumping version"]
          setup_api_calls:
            - call: "POST /firms"
              payload: { name: "F1", fiscal_year_start_month: 1 }
              as: FirmAdmin
              captures: { firm_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FirmAdmin
            - call: "POST /firms/${firm_id}/timekeepers"
              payload: { full_name: "P1", bar_number: "B001", role_title: "PARTNER", standard_rate_cents: 50000 }
              as: FirmAdmin
              captures: { tk_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients"
              payload: { display_name: "C1", client_number: "C1" }
              as: FirmAdmin
              captures: { client_id: $.data.id }
            - call: "POST /firms/${firm_id}/clients/${client_id}/matters"
              payload: { matter_number: "M1", title: "M1", litigation_stage: "DISCOVERY", responsible_partner_id: "${tk_id}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { m_id: $.data.id, m_v0: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${m_id}/fee_arrangements"
              payload: { arrangement_type: "FLAT_FEE", flat_fee_cents: 100000, fiscal_year_index: 2026 }
              as: PricingAnalyst
              captures: { arr1_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr1_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr1_id}/activate"
              payload: { expected_matter_version: "${m_v0}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
            # Now create a competing arrangement and submit
            - call: "POST /firms/${firm_id}/matters/${m_id}/fee_arrangements"
              payload: { arrangement_type: "CAPPED_FEE", capped_fee_cents: 90000, fiscal_year_index: 2026, supersedes_arrangement_id: "${arr1_id}" }
              as: PricingAnalyst
              captures: { arr2_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr2_id}/submit"
              payload: {}
              as: PricingAnalyst
            - call: "GET /firms/matters/${m_id}"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { m_v1: $.data.version }
            # Activate arr2 — bumps version
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr2_id}/activate"
              payload: { expected_matter_version: "${m_v1}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
          trigger:
            # Try to activate arr1 again with stale version m_v0 — but arr1 is already ACTIVE, so this is INVALID_STATE.
            # Instead, test stale OCC by trying to activate arr2 again with m_v1 (already ACTIVE).
            # Simpler: use a fresh second arrangement submission flow with stale version.
            # Re-do: read current version, but pass m_v1 (stale by 1).
            - call: "GET /firms/matters/${m_id}"
              payload: {}
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { m_v2: $.data.version }
            - call: "POST /firms/${firm_id}/matters/${m_id}/fee_arrangements"
              payload: { arrangement_type: "SUCCESS_FEE", success_fee_uplift_pct_bp: 2000, fiscal_year_index: 2026, supersedes_arrangement_id: "${arr2_id}" }
              as: PricingAnalyst
              captures: { arr3_id: $.data.id }
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr3_id}/submit"
              payload: {}
              as: PricingAnalyst
            # Deliberately stale: use m_v1 (not m_v2)
            - call: "POST /firms/${firm_id}/fee_arrangements/${arr3_id}/activate"
              payload: { expected_matter_version: "${m_v1}" }
              as: BillingPartner
              as_user_id: "${tk_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"

