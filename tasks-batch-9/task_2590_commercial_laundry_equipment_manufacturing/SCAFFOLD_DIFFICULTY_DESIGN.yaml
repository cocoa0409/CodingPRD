            - "StationLog.${logA}.occupation_to == 2026-08-01T12:15:00Z"
            - "StationLog.${logA}.labor_minutes == 60"
            - "BuildOrder.${b1}.build_state == BEARINGS_DONE"
            - "BuildOrder.${b1}.station_pass_count == 2 and labor_minutes_total == 120"
            - "the second trigger call returns HTTP 422"
            - "${err} == ERR_PRELOAD_OUT_OF_SPEC"
            - "BuildOrder.${b2}.build_state == DRUM_DONE"
            - "BuildOrder.${b2}.station_pass_count == 1 and labor_minutes_total == 60"
            - "GET /clm/station-logs?build_order_id=${b2} returns 1 item"

      - name: submit_quote_with_zero_lines_empty_set
        grounds:
          - validations[priority=53]
          - calculations.quote_money_rollup
          - errors[ERR_QUOTE_HAS_NO_LINES]
          - entities.PackageQuote.fields.total_cents
        distinguishing_aspect: |
          A different boundary metric (a cardinality floor rather than a decimal edge) on a different endpoint:
          line_count == 0 is the empty set. The rollup over zero lines must still evaluate — subtotal 0,
          discount 0, total equal to freight_cents 250000 — while submission is refused with 422
          ERR_QUOTE_HAS_NO_LINES, so an implementation that treats the empty sum as null, or that lets an empty
          quote through to financing, is caught.
        test_recipe:
          setup:
            - "Distributor D-01 AUTHORIZED (two trained technicians), so priority 54 cannot mask the cardinality rule"
            - "PackageQuote in DRAFT with package_discount_pct 5.00 and freight_cents 250000 and no lines at all"
          setup_api_calls:
            - call: "POST /clm/distributors"
              payload: { distributor_code: "D-01", legal_name: "Bay Laundry Supply", territory_code: "TX-CENTRAL", territory_exclusive: true }
              as: ChannelManager
              as_user_id: "u-cm-01"
              captures: { dist: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-201", full_name: "Rosa Diaz", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t201: $.data.id }
            - call: "POST /clm/technicians"
              payload: { employee_code: "T-202", full_name: "Sam Poe", employer: "DISTRIBUTOR", distributor_id: "${dist}" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
              captures: { t202: $.data.id }
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t201}", training_module: "INSTALLATION", completed_on: "2026-07-20" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/distributors/${dist}/training-completions"
              payload: { technician_id: "${t202}", training_module: "PAYMENT_SYSTEMS", completed_on: "2026-07-21" }
              as: TrainingAdministrator
              as_user_id: "u-ta-01"
            - call: "POST /clm/quotes"
              payload: { distributor_id: "${dist}", customer_name: "Sudz Express", laundromat_site_code: "SITE-77", stated_credit_score: 715, financing_program: "TERM_60", down_payment_cents: 0, package_discount_pct: 5.00, freight_cents: 250000 }
              as: Distributor
              as_user_id: "${dist}"
              captures: { q1: $.data.id }
          trigger:
            - call: "POST /clm/quotes/${q1}/submit"
              as: Distributor
              as_user_id: "${dist}"
              captures: { err: $.data.error_id }
          assert:
            - "the trigger returns HTTP 422"
            - "${err} == ERR_QUOTE_HAS_NO_LINES"
            - "PackageQuote.${q1}.quote_state == DRAFT"
            - "PackageQuote.${q1}.line_count == 0"
            - "PackageQuote.${q1}.line_subtotal_cents == 0"
            - "PackageQuote.${q1}.discount_cents == 0"
            - "PackageQuote.${q1}.total_cents == 250000"
            - "PackageQuote.${q1}.origination_fee_cents == 0"
            - "PackageQuote.${q1}.provisional_apr_bp == null and provisional_monthly_payment_cents == null"
            - "GET /clm/quote-lines?quote_id=${q1} returns 0 items"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_to_floor_requires_model_certified
        grounds:
          - validations[priority=27]
          - state_machines.BuildOrder.PLANNED_to_ON_FLOOR
          - state_machines.MachineModel.DRAFT_to_CERTIFIED
          - errors[ERR_MODEL_NOT_CERTIFIED]
        distinguishing_aspect: |
          The BuildOrder transition PLANNED -> ON_FLOOR is legal on the child's own machine yet must be refused
          because a different entity, its MachineModel, is still in DRAFT: the gate reads MachineModel
          certification_state, not anything on the BuildOrder. Once the dossier's two review dimensions are
          approved and the model reaches CERTIFIED, the byte-identical request succeeds.
        test_recipe:
          setup:
            - "MachineModel OPL-60-A in DRAFT with no dossier at all"
            - "BuildOrder SN-0001 in PLANNED"
          setup_api_calls:
            - call: "POST /clm/machine-models"
              payload: { model_code: "OPL-60-A", product_line: "ON_PREMISES", capacity_rating_lb: 60, rated_water_gal_per_cwt: 1.10, rated_kwh_per_cwt: 0.42, drum_alloy_grade: "AISI_304", payment_module_options: [], list_price_cents: 1250000 }
              as: ProductEngineer
