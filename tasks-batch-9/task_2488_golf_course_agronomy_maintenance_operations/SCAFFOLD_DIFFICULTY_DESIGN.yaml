      - name: water_posture_flips_at_exactly_eighty_percent_of_allocation
        grounds:
          - calculations.course_water_posture
          - state_machines.Course.OPEN_to_RESTRICTED
          - state_machines.Course.RESTRICTED_to_SUSPENDED
          - entities.Course.fields.water_restricted_threshold_pct
        distinguishing_aspect: |
          Metric: used water as a PERCENTAGE of allocation, driven by PATCH
          /courses/{id}/water-allocation, which moves the denominator instead of
          the numerator. Both inclusive endpoints are pinned in one chain:
          79.953 percent is still OPEN, exactly 80.0 percent is RESTRICTED and
          exactly 100.0 percent is SUSPENDED.
        test_recipe:
          setup:
            - "One course with an 853.0 gal allocation and the default 80 and 100 percent thresholds."
            - "One 5500 sq ft hole 7 green and one WELL station with a 10000 gal daily cap, a 300 gpm ceiling and 2 zones."
            - "One run over 60 minutes at a 20 point deficit, completed for its full duration, which withdraws exactly 682.0 gal."
          setup_api_calls:
            - call: "POST /courses"
              payload: { name: "Cedar Ridge GC", region_code: "OR", annual_water_allocation_gal: 853.0, water_restricted_threshold_pct: 80, water_suspended_threshold_pct: 100 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { course_id: $.data.id }
            - call: "POST /turf-areas"
              payload: { course_id: "${course_id}", area_type: "GREEN", hole_number: 7, area_sq_ft: 5500, mowing_height_mm: 3.2, distance_to_water_ft: 40, soil_type: "SAND_USGA" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { green7_id: $.data.id }
            - call: "POST /pump-stations"
              payload: { course_id: "${course_id}", source_type: "WELL", max_flow_gpm: 300, max_concurrent_zones: 2, daily_withdrawal_cap_gal: 10000 }
              as: Superintendent
              as_user_id: "super-1"
              captures: { pump_id: $.data.id, pump_v1: $.data.version }
            - call: "POST /irrigation-runs"
              payload: { pump_station_id: "${pump_id}", turf_area_id: "${green7_id}", window_start: "2026-08-05T04:00:00Z", window_end: "2026-08-05T05:00:00Z", target_moisture_deficit_pct: 20, expected_pump_station_version: "${pump_v1}" }
              as: Agronomist
              as_user_id: "agro-1"
              captures: { run_a_id: $.data.id }
            - call: "POST /irrigation-runs/${run_a_id}/complete"
              payload: {}
              as: Agronomist
              as_user_id: "agro-1"
          trigger:
            - call: "PATCH /courses/${course_id}/water-allocation"
              payload: { annual_water_allocation_gal: 852.5 }
              as: Superintendent
              as_user_id: "super-1"
            - call: "PATCH /courses/${course_id}/water-allocation"
              payload: { annual_water_allocation_gal: 682.0 }
              as: Superintendent
              as_user_id: "super-1"
          assert:
            - "IrrigationRun.${run_a_id}.allotted_gal == 682.0, flow_gpm == 11.37 and volume_gal == 682.0"
            - "before the trigger Course.${course_id}.water_used_gal == 682.0 and 682.0 / 853.0 * 100 == 79.953 percent, so water_posture == OPEN and PumpStation.${pump_id}.status == ONLINE"
            - "after the first PATCH 682.0 / 852.5 * 100 == 80.0 percent exactly, so Course.${course_id}.water_posture == RESTRICTED"
            - "after the first PATCH PumpStation.${pump_id}.status == RESTRICTED (the ONLINE mirror cascade fired)"
            - "after the second PATCH 682.0 / 682.0 * 100 == 100.0 percent exactly, so Course.${course_id}.water_posture == SUSPENDED"
            - "Course.${course_id}.water_used_gal is still 682.0 across both patches — only the denominator moved"

