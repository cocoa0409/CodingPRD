            - call: "POST /residents/${r_b_id}/intake-observations"
              payload: { observation_date: "2026-08-02", meal_period: "LUNCH", intake_pct: 80, weight_kg: 80.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T08:00:00Z" }
              as: ProgramAdministrator
          trigger:
            - call: "POST /residents/${r_a_id}/intake-observations"
              payload: { observation_date: "2026-08-20", meal_period: "LUNCH", intake_pct: 80, weight_kg: 76.0 }
              as: ClinicalStaff
              as_user_id: "cs-1"
            - call: "POST /residents/${r_b_id}/intake-observations"
              payload: { observation_date: "2026-08-20", meal_period: "LUNCH", intake_pct: 80, weight_kg: 76.2 }
              as: ClinicalStaff
              as_user_id: "cs-1"
            - call: "GET /residents/${r_a_id}"
              payload: {}
              as: ClinicalStaff
              captures: { roll_a: $.data.rolling_30d_weight_change_pct, base_a: $.data.baseline_weight_change_pct }
            - call: "GET /residents/${r_b_id}"
              payload: {}
              as: ClinicalStaff
              captures: { roll_b: $.data.rolling_30d_weight_change_pct, base_b: $.data.baseline_weight_change_pct }
            - call: "GET /plan-of-care-reviews"
