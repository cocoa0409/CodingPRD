            - { call: "POST /reimbursement-claims/${rc_v14}/supply-info", payload: { document_codes: ["INVOICE", "AUDIOGRAM_OR_WAIVER", "PROOF_OF_PAYMENT", "LMN"] }, as: Patient, as_user_id: "${pat_v14}" }
            - { call: "POST /reimbursement-claims/${rc_v14}/start-review", payload: {}, as: ReimbursementSpecialist, as_user_id: "spec-1" }
