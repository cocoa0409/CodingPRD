        grounds:
          - endpoints.GET /api-products/{id}/roadmap
          - calculations.feedback_roadmap_prioritisation
          - state_machines.FeedbackItem TRIAGED -> DECLINED
        distinguishing_aspect: >-
          The read is pure derivation over a mutating denominator: every counted item is scored
          against the product's current demand_index, so the ranking must be recomputed rather
          than cached, and the DECLINE compensation removes its contribution from the divisor
          for everybody else. Two items with identical raw_impact tie on both score keys and are
          separated only by created_at ASC, while SUBMITTED and DECLINED rows never appear.
