            - call: "GET /staff-members/${m1}"
              as: StaffingCoordinator
              captures: { rel_after_2: $.data.reliability_score, status_2: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-12T16:06:00Z" }
              as: StaffingCoordinator
            - call: "POST /staff-assignments/${a3}/attendance"
              payload: { action: "CHECK_IN" }
              as: StaffingCoordinator
            - call: "POST /_clock/set_current_utc"
