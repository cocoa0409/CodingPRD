            - { call: "POST /parcels", payload: { parcel_number: "P-R8A", owner_id: "${owner_id}", street_address: "92 Neem St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_a: "$.data.id" } }
            - { call: "POST /parcels", payload: { parcel_number: "P-R8B", owner_id: "${owner_id}", street_address: "93 Neem St", street_class: "LOCAL" }, as: ProgramCoordinator, captures: { parcel_b: "$.data.id" } }
            - { call: "POST /segments", payload: { parcel_id: "${parcel_a}", segment_code: "S-R8A-1", length_ft: 20, width_ft: 5 }, as: Inspector, as_user_id: "insp-1", captures: { segment_id: "$.data.id" } }
            - { call: "POST /defects", payload: { segment_id: "${segment_id}", defect_type: "SPALLING", area_sqft: 20 }, as: Inspector, as_user_id: "insp-1", captures: { defect_id: "$.data.id" } }
            - { call: "POST /repair-notices", payload: { parcel_id: "${parcel_a}", defect_ids: ["${defect_id}"] }, as: ProgramCoordinator, as_user_id: "coord-1", captures: { notice_id: "$.data.id" } }
            - { call: "POST /repair-notices/${notice_id}/issue", as: ProgramCoordinator, as_user_id: "coord-1" }
          trigger:
            - { call: "POST /cost-share-applications", payload: { notice_id: "${notice_id}", parcel_id: "${parcel_b}", cycle_id: "${cycle_id}", estimated_qty_sqft: 50 }, as: PropertyOwner, as_user_id: "${owner_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_PARCEL_NOTICE_MISMATCH (application parcel_id != notice.parcel_id)"

      - name: duplicate_registration_keys_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_DUPLICATE_PARCEL_NUMBER]
          - errors[ERR_DUPLICATE_SEGMENT_CODE]
          - errors[ERR_DUPLICATE_LICENSE_NUMBER]
        distinguishing_aspect: |
          The three global uniqueness constraints each return their own 409:
