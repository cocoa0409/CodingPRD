  - rule_id: boundary_precision_check
    instances:
      - name: rolling_weight_loss_inclusive_minus_five_boundary
        endpoint: "POST /residents/{id}/intake-observations"
        metric: "Resident.rolling_30d_weight_change_pct against WEIGHT_LOSS_TRIGGER_PCT (-5.00, inclusive)"
        grounds:
          - calculations.resident_weight_trend
          - calculations.plan_of_care_trigger
          - state_machines.PlanOfCareReview.none_to_OPEN
        distinguishing_aspect: |
          Exercises the inclusive weight-loss threshold on the observation-intake endpoint: resident A
          lands exactly on -5.00 and must open a plan-of-care review, resident B lands on -4.75 (a
          0.2 kg difference) and must not. A different metric on a different endpoint from the other
          boundary instance.
