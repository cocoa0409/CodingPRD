              payload: { name: "Gorse", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_a: $.data.id }
            - call: "POST /staffing/facilities"
              payload: { name: "Heather", unit_name: "ICU", unit_capacity: 2, required_credential_types: ["RN_LICENSE"] }
              as: PlatformAdmin
              captures: { fac_b: $.data.id }
            - call: "POST /staffing/orders"
