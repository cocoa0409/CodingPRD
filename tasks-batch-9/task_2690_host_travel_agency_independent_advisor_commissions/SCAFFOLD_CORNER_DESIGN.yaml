        grounds:
          - state_machines.Booking.RECEIVED_to_CHARGED_BACK
          - endpoints["POST /host-agency/bookings/{id}/cancel"]
        excluded_because:
          difficulty_instance: transitive_cascade / chargeback_demotes_supplier_reprices_pending_and_moves_tier_basis
          rationale: "CASCADE-A is asserted end-to-end there (chargeback -> supplier demotion -> repricing of PENDING bookings -> advisor production and tier), including the ordering sensitivity this corner would test."

      - name: corner_booking_two_state_axes_advance_independently
        claim_type: parallel
        grounds:
          - complexity_profile.state_machine_shape
          - state_machines.Booking.booking_status
          - state_machines.Booking.commission_status
        excluded_because:
          difficulty_instance: transitive_cascade / chargeback_demotes_supplier_reprices_pending_and_moves_tier_basis
          rationale: "The same instance drives booking_status to CANCELLED while commission_status moves RECEIVED -> CHARGED_BACK on separate triggers, asserting both axes of the parallel shape on one row."

