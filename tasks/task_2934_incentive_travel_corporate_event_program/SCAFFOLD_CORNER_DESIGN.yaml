  - name: rollup_and_measurement_exclude_disqualified_uninvited_and_cancelled_rows
    claim_type: input_set_filtering
    grounds:
    - §1.3 program_budget_rollup (input_set)
    - §1.3 program_measurement (input_set)
    - §1.3 activity_seat_allocation (input_set)
    - §1.3 taxable_award_base (input_set)
    - §1.2 Program REGISTRATION_OPEN -> ONSITE side effects
    distinguishing_aspect: |
      Every calculation in §1.3 declares an input_set that names states to include; this instance
      plants one row in each EXCLUDED state inside a single fixture — a DISQUALIFIED qualifier, an
      INVITED registration that carries real air spend and is then auto-cancelled, and a
      CANCELLED activity signup — and shows the derived numbers are identical to what a database
      without those rows would produce. It is the only §1.9 instance that attacks the input_set
      clause itself rather than the arithmetic; the correct_result instance uses a database with
      no excluded rows at all.
