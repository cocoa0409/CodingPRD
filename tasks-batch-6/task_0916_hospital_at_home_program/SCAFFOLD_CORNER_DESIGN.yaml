          - entities.Patient.fields.diet_restriction
        distinguishing_aspect: "A RENAL patient rejects a LOW_SODIUM plan with ERR_DIET_INCOMPATIBLE at priority 23 and accepts a RENAL plan, proving the check compares against the patient row rather than accepting any declared enum value."
        test_recipe:
          setup:
