  - section: consistency_model
    instances:
      - name: immediate_visibility_of_member_creation
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Member created via POST is immediately visible in subsequent GET (no eventual consistency lag)"
        test_recipe:
          setup: ["Chapter ACTIVE"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ActivitiesDirector
            - call: "POST /chapters"
              payload: { school_name: "Immed High", charter_number: "NHS-130", advisor_user_id: "adv_130", gpa_threshold_weighted: 3.50, gpa_threshold_unweighted: 3.25, service_hours_annual_required: 15, service_hours_per_semester_required: 6, national_dues_cents_per_member: 2000 }
              as: ActivitiesDirector
              captures: { ch_id: $.data.id }
            - call: "POST /chapters/${ch_id}/activate"
              payload: {}
              as: ActivitiesDirector
          trigger:
            - call: "POST /chapters/${ch_id}/members"
              payload: { student_id: "S3401", full_name: "I", email: "i@x.com", grade_level: 11, weighted_gpa: 4.0, unweighted_gpa: 3.7 }
              as: Advisor
