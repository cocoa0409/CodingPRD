            - "AdminFeeDistribution.${dacc}.gross_pool_cents == 142500"
            - "AdminFeeDistribution.${dacc}.holdback_bps_applied == 250"
            - "AdminFeeDistribution.${dacc}.holdback_cents == 3563"
            - "AdminFeeDistribution.${dacc}.net_pool_cents == 138937"
