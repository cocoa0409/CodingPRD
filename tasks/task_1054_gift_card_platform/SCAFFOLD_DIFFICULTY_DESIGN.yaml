            - { call: "POST /card-programs/${p_id}/activate", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "POST /card-batches", payload: { card_program_id: "${p_id}", channel: "DIGITAL", card_count: 1, unit_load_cents: 90000 }, as: MerchantAdmin, as_user_id: "${m_id}", captures: { b_id: "$.data.id" } }
            - { call: "POST /card-batches/${b_id}/commit", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
            - { call: "GET /gift-cards", payload: { card_batch_id: "${b_id}" }, as: Any, captures: { c_id: "$.data[0].id" } }
            - { call: "POST /gift-cards/${c_id}/activate", payload: {}, as: POSTerminal }
            - { call: "POST /card-programs/${p_id}/retire", payload: {}, as: MerchantAdmin, as_user_id: "${m_id}" }
          trigger:
            - { call: "POST /gift-cards/${c_id}/reload", payload: { amount_cents: 50000 }, as: POSTerminal, captures: { err: "$.data.error_id" } }
          assert:
            - "response.data.error_id == ERR_PROGRAM_NOT_ACTIVE"
            - "GiftCard.${c_id}.balance_cents == 90000"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: velocity_count_boundary_on_redeem
        grounds:
          - calculations.velocity_check
          - "validations[priority=9]"
          - entities.VelocityRule.fields.max_count
        distinguishing_aspect: "With max_count 5, the 5th redemption in-window (count 5, not > 5) succeeds while the 6th (count 6 > 5) is rejected ERR_VELOCITY_EXCEEDED — strict '>' boundary on the in-window redemption COUNT, reached through POST /gift-cards/{id}/redeem."
        test_recipe:
          setup:
            - "Merchant ACTIVE; program ACTIVE with a VelocityRule (max_count 5, window 24h, max_amount 50000); one card ACTIVE loaded 10000; five redemptions of 1000 already posted (balance 5000)."
          setup_api_calls:
            - { call: "POST /merchants", payload: { legal_name: "Acme" }, as: PlatformAdmin, captures: { m_id: "$.data.id" } }
