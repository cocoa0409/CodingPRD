            - { call: "POST /infusion/authorization-requests", payload: { patient_id: "${pat_xa}", policy_id: "${pol_xa}", requested_site_type: "OFFICE", requested_dose_mg: 500, patient_weight_kg: 70 }, as: AuthCoordinator, as_user_id: "coord-1", captures: { auth_xa: $.data.id, auth_xa_st: $.data.status } }
          trigger:
