          assert:
            - "after create: ProductLot.${lot_id}.quantity_committed transitioned 10 -> 0 (line is PICKED)"
            - "after cancel: Shipment.${sh_id}.status == CANCELLED"
            - "after cancel: ProductLot.${lot_id}.quantity_committed == 10 (restored)"
            - "after cancel: ProductLot.${lot_id}.quantity_available == 90 (matches initial post-finalize state)"
            - "conservation: quantity_received == quantity_quarantined + quantity_committed + quantity_shipped + quantity_expired + quantity_available (100 == 0 + 10 + 0 + 0 + 90)"

      - name: decision_supersede_conserves_request_quantity_approved
        grounds:
          - state_machines.AllocationDecision.FINALIZED_to_SUPERSEDED
          - state_machines.AllocationLine.RESERVED_to_RELEASED
          - entities.AllocationRequest.fields.quantity_approved
        distinguishing_aspect: |
          Conserved quantity = total reserved units across all
          AllocationLines for a request. Forward: finalize D1 reserves Q units
          (request.quantity_approved = Q). Compensating: supersede D1 by
          finalizing D2 (only allowed while D1's lines are all RESERVED);
          D1's lines RELEASE and D2's lines RESERVE, keeping the request's
          coverage invariant but redistributing it across lots. Distinct
          conserved quantity from instance 1 (per-request approval vs per-lot
          inventory).
