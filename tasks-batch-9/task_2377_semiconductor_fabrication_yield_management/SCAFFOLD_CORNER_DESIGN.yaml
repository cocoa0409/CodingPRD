              as_user_id: "u_pe_1"
              captures: { flow_a: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/steps"
              payload: { recipe_id: "${r_litho}", step_seq: 10, step_name: "LITHO-1", standard_hours: 2.0, metrology_required: true }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { s10: $.data.id }
            - call: "POST /fab/process-flows/${flow_a}/release"
              payload: {}
              as: ProcessEngineer
              as_user_id: "u_pe_1"
            - call: "POST /fab/spc-charts"
              payload: { step_id: "${s10}", param_name: "CD", target: 100.00, sigma: 2.00, usl: 110.00, lsl: 90.00, ucl: 106.00, lcl: 94.00 }
              as: ProcessEngineer
              as_user_id: "u_pe_1"
              captures: { chart: $.data.id }
            - call: "POST /fab/equipment"
              payload: { equipment_code: "LITHO-1", tool_type: "LITHO", pm_interval_hours: 168.0, purge_buffer_hours: 24.0, hours_since_pm: 0.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { eq_litho: $.data.id }
            - call: "POST /fab/chambers"
              payload: { equipment_id: "${eq_litho}", chamber_code: "CH_L1", qualified_recipe_id: "${r_litho}", particle_limit: 50.0 }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
              captures: { ch_l1: $.data.id }
            - call: "POST /fab/chambers/${ch_l1}/qualification-runs"
              payload: { qual_result: "PASS" }
              as: EquipmentEngineer
              as_user_id: "u_ee_1"
            - call: "POST /fab/operators"
              payload: { badge_id: "OP-001", full_name: "Op One", certified_tool_types: ["LITHO", "ETCH", "CMP"] }
              as: QualityManager
              as_user_id: "u_qm_1"
              captures: { op1: $.data.id }
            - call: "PATCH /fab/operators/${op1}"
              payload: { gown_state: "GOWNED" }
              as: Operator
              as_user_id: "${op1}"
            - call: "POST /fab/wafer-start-plans"
