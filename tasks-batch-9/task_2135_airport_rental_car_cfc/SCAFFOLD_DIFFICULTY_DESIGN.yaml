  - rule_id: cross_entity_state_dependency
    instances:

      - name: counter_activation_blocked_by_suspended_agreement
        grounds:
          - state_machines.CounterAssignment.ALLOCATED_to_ACTIVE
          - state_machines.ConcessionAgreement.ACTIVE_to_SUSPENDED
          - validations[priority=11]
          - errors[ERR_AGREEMENT_NOT_ACTIVE]
        distinguishing_aspect: |
          Entity pair CounterAssignment -> ConcessionAgreement: the assignment is
          in a perfectly legal ALLOCATED from-state, yet the activation is
          rejected with ERR_AGREEMENT_NOT_ACTIVE purely because the referenced
          agreement's contract_status is SUSPENDED rather than ACTIVE.
        test_recipe:
          setup:
            - "One facility with counter space T1-A02 and one agreement executed to ACTIVE."
            - "A CounterAssignment on that space for 2026-02-01 to 2026-05-01 sits in ALLOCATED."
            - "The agreement has since been suspended."
