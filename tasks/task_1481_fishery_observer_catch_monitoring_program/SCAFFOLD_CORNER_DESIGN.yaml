  # ===========================================================================
  # Section 9 — Consistency Model: immediate — every mutation is visible in
  # the same request's response and in immediately-following reads.
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_mutation_visible_in_same_response
        claim_type: immediate_consistency
        grounds:
          - complexity_profile
          - entities.CoveragePlan.fields.actual_observer_sea_days
          - entities.Observer.fields.sea_days_used_ytd
        distinguishing_aspect: |
          consistency_model immediate: the deployment close call's response and
          an immediately-following GET show the credited aggregates (Observer.
          sea_days_used_ytd, Vessel.sea_days_observed_ytd, CoveragePlan.
          actual_observer_sea_days) with NO delay or reconciliation lag.
        test_recipe:
          setup:
            - "Deployment D (10 days, 2026-09-10..2026-09-19) in DATA_VALIDATED under plan P for vessel V / observer OBS"
          setup_api_calls:
            - call: "POST /observer-program/fisheries"
              payload: { code: "BSAI-CON", name: "CON Fishery", region: "Bering Sea", coverage_target_pct: 0.30, priority_gear: "TRAWL" }
              as: ProgramAdmin
              captures: { fish_id: $.data.id }
            - call: "POST /observer-program/vessel-operators"
              payload: { legal_name: "Con Ops LLC", license_number: "LIC-CON-1", contact_person_ref: "person-con-op" }
              as: ProgramAdmin
              captures: { op_id: $.data.id }
            - call: "POST /observer-program/observers"
              payload: { person_ref: "person-con-obs", full_name: "Coy Observer", home_port: "Kodiak", certification_level: "LEAD" }
              as: ProgramAdmin
              captures: { obs_id: $.data.id }
            - call: "POST /observer-program/debriefers"
              payload: { person_ref: "person-con-deb", full_name: "Cia Debriefer" }
              as: ProgramAdmin
              captures: { deb_id: $.data.id }
            - call: "POST /observer-program/vessels"
              payload: { operator_id: "${op_id}", fishery_id: "${fish_id}", vessel_name: "FV Con", permit_number: "PERMIT-CON", home_port: "Kodiak", length_ft: 50, gear_type: "TRAWL" }
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { v_id: $.data.id }
            - call: "PATCH /observer-program/vessels/${v_id}"
              payload: { status: "ACTIVE" }
              as: ProgramAdmin
            - call: "POST /observer-program/coverage-plans"
              payload: { fishery_id: "${fish_id}", period_start: "2026-09-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z", projected_fleet_effort_days: 100, projected_em_effort_days: 0 }
              as: ProgramCoordinator
              captures: { plan_id: $.data.id }
            - call: "POST /observer-program/coverage-plans/${plan_id}/publish"
              payload: {}
              as: ProgramCoordinator
              captures: { plan_v: $.data.version }
            - call: "POST /observer-program/coverage-plans/${plan_id}/selection-runs"
              payload: { notice_response_deadline: "2026-09-05T00:00:00Z", expected_coverage_plan_version: "${plan_v}" }
              as: ProgramCoordinator
            - call: "GET /observer-program/selection-notices"
              payload: { coverage_plan_id: "${plan_id}", vessel_id: "${v_id}" }
              as: ProgramCoordinator
              captures: { n_id: "$.data[0].id" }
            - call: "POST /observer-program/selection-notices/${n_id}/accept"
              payload: {}
              as: VesselOperator
              as_user_id: "${op_id}"
              captures: { n_v: $.data.version }
            - call: "POST /observer-program/deployments"
              payload: { selection_notice_id: "${n_id}", observer_id: "${obs_id}", scheduled_departure_date: "2026-09-10T00:00:00Z", scheduled_return_date: "2026-09-19T00:00:00Z", expected_selection_notice_version: "${n_v}" }
              as: ProgramCoordinator
              captures: { d_id: $.data.id }
            - call: "POST /observer-program/deployments/${d_id}/safety-inspections"
              payload: { life_raft_certified: true, epirb_registered: true, immersion_suits_adequate: true, fire_suppression_ok: true, comms_equipment_ok: true }
              as: Observer
              as_user_id: "${obs_id}"
            - call: "POST /observer-program/deployments/${d_id}/board"
              payload: {}
              as: Observer
              as_user_id: "${obs_id}"
            - call: "POST /observer-program/deployments/${d_id}/haul-samples"
              payload: { haul_date: "2026-09-12T00:00:00Z", haul_number: 1, species_code: "PLCK", sampled_weight_kg: 100, total_haul_weight_kg: 500 }
              as: Observer
              as_user_id: "${obs_id}"
              captures: { h_id: $.data.id }
            - call: "POST /observer-program/deployments/${d_id}/return"
              payload: { actual_return_date: "2026-09-19T00:00:00Z" }
              as: Observer
              as_user_id: "${obs_id}"
            - call: "POST /observer-program/deployments/${d_id}/submit-data"
              payload: {}
              as: Observer
              as_user_id: "${obs_id}"
            - call: "POST /observer-program/deployments/${d_id}/assign-debriefer"
              payload: { debriefer_id: "${deb_id}" }
              as: ProgramCoordinator
            - call: "POST /observer-program/haul-samples/${h_id}/verify"
              payload: {}
              as: Debriefer
              as_user_id: "${deb_id}"
            - call: "POST /observer-program/deployments/${d_id}/validate-data"
              payload: {}
              as: Debriefer
              as_user_id: "${deb_id}"
          trigger:
            - call: "POST /observer-program/deployments/${d_id}/close"
              payload: {}
              as: ProgramCoordinator
              captures: { d_st: $.data.status }
            - call: "GET /observer-program/observers/${obs_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { obs_days: $.data.sea_days_used_ytd }
            - call: "GET /observer-program/vessels/${v_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { v_days: $.data.sea_days_observed_ytd, v_loed: $.data.last_observed_end_date }
            - call: "GET /observer-program/coverage-plans/${plan_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { p_days: $.data.actual_observer_sea_days }
            - call: "GET /observer-program/selection-notices/${n_id}"
              payload: {}
              as: ProgramCoordinator
              captures: { n_st: $.data.status }
          assert:
            - "Deployment.${d_id}.status == CLOSED in the close response itself"
            - "Immediately after close: Observer.sea_days_used_ytd == 10, Vessel.sea_days_observed_ytd == 10, CoveragePlan.actual_observer_sea_days == 10 (no lag)"
            - "Vessel.last_observed_end_date == 2026-09-19T00:00:00Z"
            - "SelectionNotice.${n_id}.status == ACCEPTED with remaining_sea_days == 20 (auto-FULFILLED fires only when remaining == 0; consumed 10 of 30)"
