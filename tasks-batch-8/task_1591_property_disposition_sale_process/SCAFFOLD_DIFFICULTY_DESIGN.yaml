      - name: access_window_half_open_adjacency
        grounds:
          - validations[priority=13]
          - state_machines.Bidder
          - errors[ERR_ACCESS_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Interval semantics 2 (HALF-OPEN [start, end) intervals on the Bidder's access calendar
          — a different resource entity than the Asset engagement calendar): a grant starting
          exactly when the prior grant ends is ALLOWED; a grant overlapping the interior is
          rejected. The two rules disagree on adjacency treatment by design.
