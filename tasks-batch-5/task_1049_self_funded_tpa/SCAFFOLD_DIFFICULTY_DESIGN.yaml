              payload: { plan_id: "${plan_id}", carrier_name: "ReCarrier", contract_basis: "PAID", effective_date: "2026-01-01", expiry_date: "2026-12-31", specific_deductible_cents: 5000000, aggregate_attachment_cents: 100000000 }
              as: TPAAdmin
              captures: { pol_a: $.data.id }
            - call: "POST /stop-loss-policies/${pol_a}/activate"
              payload: {}
              as: TPAAdmin
            - call: "POST /stop-loss-policies"
              payload: { plan_id: "${plan_id}", carrier_name: "ReCarrier", contract_basis: "PAID", effective_date: "2026-06-01", expiry_date: "2027-01-01", specific_deductible_cents: 5000000, aggregate_attachment_cents: 100000000 }
              as: TPAAdmin
              captures: { pol_b: $.data.id }
            - call: "POST /stop-loss-policies"
              payload: { plan_id: "${plan_id}", carrier_name: "ReCarrier", contract_basis: "PAID", effective_date: "2026-12-31", expiry_date: "2027-06-30", specific_deductible_cents: 5000000, aggregate_attachment_cents: 100000000 }
              as: TPAAdmin
              captures: { pol_c: $.data.id }
          trigger:
            - call: "POST /stop-loss-policies/${pol_b}/activate"
              payload: {}
              as: TPAAdmin
              captures: { err: $.data.error_id }
            - call: "POST /stop-loss-policies/${pol_c}/activate"
              payload: {}
              as: TPAAdmin
          assert:
            - "activate ${pol_b} returns 409 ERR_POLICY_PERIOD_OVERLAP"
            - "activate ${pol_c} returns 200 with StopLossPolicy.${pol_c}.status == ACTIVE (adjacency allowed)"

      - name: laser_window_overlap_closed_touching_rejected
        grounds:
          - validations[priority=8]
          - entities.Laser.fields.effective_date
          - entities.Laser.fields.expiry_date
        distinguishing_aspect: |
          Laser windows for one (policy, member) use CLOSED intervals with no adjacency: a first laser
          [2026-01-01,2026-06-30] and a second [2026-06-30,2026-12-31] that merely touch on 2026-06-30
          -> ERR_LASER_WINDOW_OVERLAP (touching endpoints rejected), a different interval semantic than the
          half-open, adjacency-allowed stop-loss periods.
        test_recipe:
          setup:
            - "Plan; member; ACTIVE stop-loss policy; one laser [2026-01-01,2026-06-30] for the member."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Sam", last_name: "H", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /stop-loss-policies"
              payload: { plan_id: "${plan_id}", carrier_name: "ReCarrier", contract_basis: "PAID", effective_date: "2026-01-01", expiry_date: "2027-01-01", specific_deductible_cents: 5000000, aggregate_attachment_cents: 100000000 }
              as: TPAAdmin
              captures: { pol: $.data.id }
            - call: "POST /stop-loss-policies/${pol}/activate"
              payload: {}
              as: TPAAdmin
            - call: "POST /lasers"
              payload: { stop_loss_policy_id: "${pol}", member_id: "${member_id}", laser_deductible_cents: 10000000, effective_date: "2026-01-01", expiry_date: "2026-06-30" }
              as: TPAAdmin
              captures: { laser1: $.data.id }
          trigger:
            - call: "POST /lasers"
              payload: { stop_loss_policy_id: "${pol}", member_id: "${member_id}", laser_deductible_cents: 12000000, effective_date: "2026-06-30", expiry_date: "2026-12-31" }
              as: TPAAdmin
              captures: { err: $.data.error_id }
          assert:
            - "second POST /lasers returns 409 ERR_LASER_WINDOW_OVERLAP"

  - rule_id: compensating_invariant
    instances:
      - name: fund_cash_conservation_on_release_then_void
        grounds:
          - state_machines.CheckRun.DRAFT_to_RELEASED
          - state_machines.CheckRun.RELEASED_to_VOIDED
          - entities.FundAccount.fields.balance_cents
          - entities.FundAccount.fields.total_deposited_cents
          - entities.FundAccount.fields.total_disbursed_cents
        distinguishing_aspect: |
          Conserved quantity = fund cash identity total_deposited_cents - total_disbursed_cents ==
          balance_cents. After release (debit 48000) then void (credit 48000 back), balance returns to
          100000, total_disbursed returns to 0, and the identity holds with zero drift.
        test_recipe:
          setup:
            - "Plan (ded 0); provider; member; adjudicated claim (plan_paid 48000); fund with 100000 deposited; a check-run over the claim RELEASED (balance 52000, disbursed 48000)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 0, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
            - call: "POST /fund-accounts"
              payload: { plan_id: "${plan_id}" }
              as: FundManager
              captures: { fa: $.data.id }
            - call: "POST /fund-accounts/${fa}/deposit"
              payload: { amount_cents: 100000 }
              as: FundManager
              captures: { fa_v: $.data.version }
            - call: "POST /check-runs"
              payload: { fund_account_id: "${fa}", claim_ids: ["${c}"] }
              as: FundManager
              captures: { cr: $.data.id }
            - call: "POST /check-runs/${cr}/release"
              payload: { expected_fund_account_version: "${fa_v}" }
              as: FundManager
          trigger:
            - call: "POST /check-runs/${cr}/void"
              payload: {}
              as: FundManager
          assert:
            - "FundAccount.${fa}.balance_cents == 100000"
            - "FundAccount.${fa}.total_disbursed_cents == 0"
            - "FundAccount.${fa}.total_deposited_cents == 100000"
            - "Claim.${c}.status == ADJUDICATED"

      - name: accumulator_conservation_on_adjudicate_then_reverse
        grounds:
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - state_machines.Claim.ADJUDICATED_to_REVERSED
          - entities.Member.fields.deductible_met_cents
          - entities.Member.fields.oop_met_cents
          - entities.Member.fields.member_plan_paid_ytd_cents
        distinguishing_aspect: |
          Conserved quantity = member accumulators. A single claim adjudicated (deductible_met 60000,
          oop_met 60000, plan_paid_ytd 0) then reversed leaves all three accumulators back at 0 — a
          different conserved quantity than fund cash, with no residual drift.
        test_recipe:
          setup:
            - "Plan (ded 100000, oop 500000, coins 0.80); provider (40%); member; one claim (billed 100000) adjudicated (deductible_met 60000)."
          setup_api_calls:
            - call: "POST /plans"
              payload: { sponsor_name: "Acme", sponsor_tax_id: "11-1111111", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", individual_deductible_cents: 100000, oop_max_cents: 500000, plan_coinsurance_pct: 0.80, run_out_days: 90 }
              as: TPAAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /providers"
              payload: { name: "InNet", tax_id: "22-2222222", npi: "1111111111", in_network: true, ppo_discount_pct: 0.40 }
              as: TPAAdmin
              captures: { prov: $.data.id }
            - call: "POST /members"
              payload: { plan_id: "${plan_id}", first_name: "Mia", last_name: "N", coverage_effective_date: "2026-01-01" }
              as: TPAAdmin
              captures: { member_id: $.data.id }
            - call: "POST /claims"
              payload: { member_id: "${member_id}", provider_id: "${prov}", service_date: "2026-03-01", billed_lines: [{ billed_cents: 100000 }] }
              as: ClaimsExaminer
              as_user_id: "ex-1"
              captures: { c: $.data.id }
            - call: "POST /claims/${c}/adjudicate"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          trigger:
            - call: "POST /claims/${c}/reverse"
              payload: {}
              as: ClaimsExaminer
              as_user_id: "ex-1"
          assert:
            - "Member.${member_id}.deductible_met_cents == 0"
            - "Member.${member_id}.oop_met_cents == 0"
            - "Member.${member_id}.member_plan_paid_ytd_cents == 0"
            - "Claim.${c}.status == REVERSED"
