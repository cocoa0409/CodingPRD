scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: dma_create_success_and_defaults
        claim_type: creation_defaults
        grounds: [entities.DistrictMeteredArea, "endpoints[POST /nrw/dmas]"]
        distinguishing_aspect: "POST /nrw/dmas with all required fields returns 201; posture defaults OPEN; open_leak_count defaults 0; latest_nrw_pct null; version == 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-EN1", name: "Entity One", connection_count: 100, mains_length_km: 5.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { dma_en1: $.data.id }
          assert:
            - "response 201; DistrictMeteredArea.${dma_en1}.posture == OPEN"
            - "DistrictMeteredArea.${dma_en1}.open_leak_count == 0"
            - "DistrictMeteredArea.${dma_en1}.latest_nrw_pct is null"
            - "DistrictMeteredArea.${dma_en1}.version == 1"

      - name: dma_duplicate_code_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Second POST /nrw/dmas with an existing code returns ERR_DUPLICATE (409)."
        test_recipe:
          setup: ["one DMA with code DMA-DUP exists"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-DUP", name: "First", connection_count: 100, mains_length_km: 5.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
          trigger:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-DUP", name: "Second", connection_count: 200, mains_length_km: 6.0, target_nrw_pct: 12.0 }
              as: ProgramDirector
              captures: { err_dup: $.data.error_id }
          assert:
            - "captured error_id == ERR_DUPLICATE"

      - name: meter_create_default_policy_applied
        claim_type: defaults
        grounds: [entities.CustomerMeter.fields.replacement_policy]
        distinguishing_aspect: "Omitting replacement_policy on meter create applies default ACCURACY_BASED."
        test_recipe:
          setup: ["DMA exists"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-EN2", name: "Entity Two", connection_count: 100, mains_length_km: 5.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { dma_en2: $.data.id }
          trigger:
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_en2}", serial_number: "SN-EN2", size_mm: 15, installed_at: "2022-01-01T00:00:00Z" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_en2: $.data.id }
          assert:
            - "CustomerMeter.${m_en2}.replacement_policy == ACCURACY_BASED"
            - "CustomerMeter.${m_en2}.status == IN_SERVICE"
            - "CustomerMeter.${m_en2}.last_test_accuracy_pct is null"

      - name: entity_not_found_returns_404
        claim_type: not_found
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a random UUID that resolves to nothing returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /nrw/dmas/11111111-2222-4333-8444-555555555555"
              as: ProgramDirector
              captures: { err_nf: $.data.error_id }
          assert:
            - "captured error_id == ERR_NOT_FOUND"

      - name: missing_required_field_returns_validation_error
        claim_type: required_fields
        grounds: ["validations[priority=9]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /nrw/dmas missing required connection_count returns ERR_VALIDATION (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-MISS", name: "Missing Field", mains_length_km: 5.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { err_miss: $.data.error_id }
          assert:
            - "captured error_id == ERR_VALIDATION"

      - name: dma_list_pagination_envelope
        claim_type: listing
        grounds: ["endpoints[GET /nrw/dmas]", response_envelope]
        distinguishing_aspect: "GET /nrw/dmas with 3 DMAs and limit=2 returns envelope with total_count 3, has_more true, exactly 2 rows; offset=2 page returns 1 row, has_more false."
        test_recipe:
          setup: ["three DMAs created"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-PG1", name: "Page One", connection_count: 100, mains_length_km: 5.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-PG2", name: "Page Two", connection_count: 100, mains_length_km: 5.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-PG3", name: "Page Three", connection_count: 100, mains_length_km: 5.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
          trigger:
            - call: "GET /nrw/dmas?limit=2&offset=0"
              as: ProgramDirector
            - call: "GET /nrw/dmas?limit=2&offset=2"
              as: ProgramDirector
          assert:
            - "first page: data length == 2, total_count == 3, has_more == true"
            - "second page: data length == 1, total_count == 3, has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: water_balance_terminal_finalize_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.WaterBalancePeriod, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A FINALIZED WaterBalancePeriod rejects a second finalize and a submit with ERR_INVALID_STATE."
        test_recipe:
          setup: ["DMA with a FINALIZED balance"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-SM1", name: "SM One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_sm1: $.data.id, dma_sm1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_sm1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_sm1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_sm1: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_sm1}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/water-balance-periods/${wbp_sm1}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
          trigger:
            - call: "POST /nrw/water-balance-periods/${wbp_sm1}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
              captures: { err_sm1: $.data.error_id }
          assert:
            - "captured error_id == ERR_INVALID_STATE"
            - "WaterBalancePeriod.${wbp_sm1}.status remains FINALIZED"

      - name: leak_withdraw_from_verified
        claim_type: valid_transition
        grounds: [state_machines.Leak.VERIFIED_to_WITHDRAWN]
        distinguishing_aspect: "A VERIFIED leak can be withdrawn; withdraw recomputes DMA open_leak_count down."
        test_recipe:
          setup: ["IN_FIELD survey with one VERIFIED leak; DMA open_leak_count == 1"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-SM2", name: "SM Two", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_sm2: $.data.id }
            - call: "POST /nrw/leak-surveys"
              payload: { dma_id: "${dma_sm2}", planned_start: "2026-08-02T00:00:00Z", planned_end: "2026-08-10T00:00:00Z", method: "ACOUSTIC", crew_lead_user_id: "fs-1" }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { sv_sm2: $.data.id }
            - call: "POST /nrw/leak-surveys/${sv_sm2}/start"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks"
              payload: { survey_id: "${sv_sm2}", location_description: "Main & 5th", estimated_loss_lps: 1.0, detected_at: "2026-08-02T04:00:00Z", repair_cost_estimate: 4000 }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { leak_sm2: $.data.id }
            - call: "POST /nrw/leaks/${leak_sm2}/verify"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
          trigger:
            - call: "POST /nrw/leaks/${leak_sm2}/withdraw"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
          assert:
            - "Leak.${leak_sm2}.status == WITHDRAWN"
            - "DistrictMeteredArea.${dma_sm2}.open_leak_count == 0"

      - name: leak_invalid_transition_from_reported_to_complete_repair
        claim_type: invalid_transition
        grounds: [state_machines.Leak, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "complete-repair directly from REPORTED (skipping verify/schedule) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["IN_FIELD survey with one REPORTED leak"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-SM3", name: "SM Three", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_sm3: $.data.id }
            - call: "POST /nrw/leak-surveys"
              payload: { dma_id: "${dma_sm3}", planned_start: "2026-08-02T00:00:00Z", planned_end: "2026-08-10T00:00:00Z", method: "ACOUSTIC", crew_lead_user_id: "fs-1" }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { sv_sm3: $.data.id }
            - call: "POST /nrw/leak-surveys/${sv_sm3}/start"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks"
              payload: { survey_id: "${sv_sm3}", location_description: "Main & 6th", estimated_loss_lps: 1.0, detected_at: "2026-08-02T04:00:00Z", repair_cost_estimate: 4000 }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { leak_sm3: $.data.id }
          trigger:
            - call: "POST /nrw/leaks/${leak_sm3}/complete-repair"
              payload: { actual_repair_cost: 3000 }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { err_sm3: $.data.error_id }
          assert:
            - "captured error_id == ERR_INVALID_STATE"
            - "Leak.${leak_sm3}.status remains REPORTED"

      - name: leak_survey_cancel_blocked_by_open_children
        claim_type: precondition_enforcement
        grounds: ["validations[priority=14]", "errors[ERR_CHILDREN_OPEN]", state_machines.LeakSurvey.IN_FIELD_to_CANCELLED]
        distinguishing_aspect: "Cancel of an IN_FIELD survey with a non-terminal leak fails with ERR_CHILDREN_OPEN; with all children withdrawn it succeeds."
        test_recipe:
          setup: ["IN_FIELD survey with one REPORTED leak"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-SM4", name: "SM Four", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_sm4: $.data.id }
            - call: "POST /nrw/leak-surveys"
              payload: { dma_id: "${dma_sm4}", planned_start: "2026-08-02T00:00:00Z", planned_end: "2026-08-10T00:00:00Z", method: "ACOUSTIC", crew_lead_user_id: "fs-1" }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { sv_sm4: $.data.id }
            - call: "POST /nrw/leak-surveys/${sv_sm4}/start"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leaks"
              payload: { survey_id: "${sv_sm4}", location_description: "Main & 7th", estimated_loss_lps: 1.0, detected_at: "2026-08-02T04:00:00Z", repair_cost_estimate: 4000 }
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { leak_sm4: $.data.id }
          trigger:
            - call: "POST /nrw/leak-surveys/${sv_sm4}/cancel"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
              captures: { err_sm4: $.data.error_id }
            - call: "POST /nrw/leaks/${leak_sm4}/withdraw"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
            - call: "POST /nrw/leak-surveys/${sv_sm4}/cancel"
              payload: {}
              as: FieldSupervisor
              as_user_id: "fs-1"
          assert:
            - "first cancel rejected with ERR_CHILDREN_OPEN"
            - "after withdraw, second cancel succeeds; LeakSurvey.${sv_sm4}.status == CANCELLED"

      - name: pressure_project_activate_before_planned_start_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.PressureProject.APPROVED_to_ACTIVE]
        distinguishing_aspect: "Activate with logical clock earlier than planned_start fails (clock default 2026-08-01 vs planned_start 2026-09-01); after clock advance it succeeds."
        test_recipe:
          setup: ["DMA with APPROVED pressure project planned_start 2026-09-01; logical clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-SM5", name: "SM Five", connection_count: 1000, mains_length_km: 30.0, target_nrw_pct: 15.0 }
              as: ProgramDirector
              captures: { dma_sm5: $.data.id }
            - call: "POST /nrw/pressure-projects"
              payload: { dma_id: "${dma_sm5}", name: "PRV SM5", planned_start: "2026-09-01T00:00:00Z", planned_end: "2026-10-01T00:00:00Z", baseline_pressure_m: 60.0, target_pressure_m: 42.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { pp_sm5: $.data.id }
            - call: "POST /nrw/pressure-projects/${pp_sm5}/approve"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /nrw/pressure-projects/${pp_sm5}/activate"
              payload: {}
              as: ProgramDirector
              captures: { err_sm5: $.data.error_id }
            - call: "POST /nrw/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - call: "POST /nrw/pressure-projects/${pp_sm5}/activate"
              payload: {}
              as: ProgramDirector
          assert:
            - "first activate rejected (ERR_INVALID_STATE or ERR_VALIDATION per precondition ordering; captured error is non-null and status stays APPROVED)"
            - "PressureProject.${pp_sm5}.status == APPROVED after first attempt"
            - "after clock set to planned_start, activate succeeds; status == ACTIVE"
            - "DistrictMeteredArea.${dma_sm5}.posture == RESTRICTED"

      - name: meter_retire_blocked_by_scheduled_test
        claim_type: precondition_enforcement
        grounds: [state_machines.CustomerMeter.IN_SERVICE_to_RETIRED]
        distinguishing_aspect: "Retire is rejected while a SCHEDULED accuracy test exists for the meter; after cancelling the test, retire succeeds."
        test_recipe:
          setup: ["meter IN_SERVICE with one SCHEDULED test"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-SM6", name: "SM Six", connection_count: 600, mains_length_km: 15.0, target_nrw_pct: 10.0 }
              as: ProgramDirector
              captures: { dma_sm6: $.data.id }
            - call: "POST /nrw/customer-meters"
              payload: { dma_id: "${dma_sm6}", serial_number: "SN-SM6", size_mm: 15, installed_at: "2022-01-01T00:00:00Z" }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { m_sm6: $.data.id }
            - call: "POST /nrw/meter-accuracy-tests"
              payload: { meter_id: "${m_sm6}", tested_at: "2026-08-01T10:00:00Z", flow_rate_lps: 0.5 }
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { t_sm6: $.data.id }
          trigger:
            - call: "POST /nrw/customer-meters/${m_sm6}/retire"
              payload: {}
              as: MeterTechnician
              as_user_id: "mt-1"
              captures: { err_sm6: $.data.error_id }
            - call: "POST /nrw/meter-accuracy-tests/${t_sm6}/cancel"
              payload: {}
              as: MeterTechnician
              as_user_id: "mt-1"
            - call: "POST /nrw/customer-meters/${m_sm6}/retire"
              payload: {}
              as: MeterTechnician
              as_user_id: "mt-1"
          assert:
            - "first retire rejected (error captured, status stays IN_SERVICE)"
            - "after test cancel, retire succeeds; CustomerMeter.${m_sm6}.status == RETIRED"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: ili_floor_and_constants
        claim_type: correct_result
        grounds: [calculations.infrastructure_leakage_index]
        distinguishing_aspect: "ILI uses UARL constants 18/0.8/25 with AVG_PRESSURE_M_DEFAULT 40 and is floored at 0.01; the pinned fixture yields exactly 24.39."
        test_recipe:
          setup: ["DMA (5000 conn, 120 km) with a submitted balance (SIV 1e6, billed 720k, unbilled 40k, unauth 15k, inacc 25k) over 90 days"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-CALC1", name: "Calc One", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_c1: $.data.id, dma_c1_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_c1}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_c1_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_c1: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_c1}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
          trigger:
            - call: "POST /nrw/water-balance-periods/${wbp_c1}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
          assert:
            - "WaterBalancePeriod.${wbp_c1}.ili == 24.39"
            - "WaterBalancePeriod.${wbp_c1}.real_loss_m3 == 200000"
            - "WaterBalancePeriod.${wbp_c1}.apparent_loss_m3 == 40000"
            - "WaterBalancePeriod.${wbp_c1}.nrw_volume_m3 == 280000"

      - name: pressure_leak_reduction_uses_favad_exponent
        claim_type: correct_result
        grounds: [calculations.pressure_leak_reduction]
        distinguishing_aspect: "Commissioning a project from 60m to 42m with a finalized real loss of 200000 m3/90d yields pressure_reduction_pct 30.0 and estimated_leak_reduction 272912 m3/yr via the FAVAD N1=1.15 exponent."
        test_recipe:
          setup: ["DMA with FINALIZED balance (real_loss 200000 over 90 days) and ACTIVE pressure project baseline 60 target 42"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-CALC2", name: "Calc Two", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_c2: $.data.id, dma_c2_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
              payload: { dma_id: "${dma_c2}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-04-01T00:00:00Z", system_input_volume_m3: 1000000, billed_authorized_m3: 720000, unbilled_authorized_m3: 40000, unauthorized_consumption_m3: 15000, metering_inaccuracy_m3: 25000, expected_dma_version: "${dma_c2_v}" }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { wbp_c2: $.data.id }
            - call: "POST /nrw/water-balance-periods/${wbp_c2}/submit"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-1"
            - call: "POST /nrw/water-balance-periods/${wbp_c2}/finalize"
              payload: {}
              as: UtilityAnalyst
              as_user_id: "ua-2"
            - call: "POST /nrw/pressure-projects"
              payload: { dma_id: "${dma_c2}", name: "PRV CALC2", planned_start: "2026-08-01T00:00:00Z", planned_end: "2026-09-01T00:00:00Z", baseline_pressure_m: 60.0, target_pressure_m: 42.0 }
              as: UtilityAnalyst
              as_user_id: "ua-1"
              captures: { pp_c2: $.data.id }
            - call: "POST /nrw/pressure-projects/${pp_c2}/approve"
              payload: {}
              as: ProgramDirector
            - call: "POST /nrw/pressure-projects/${pp_c2}/activate"
              payload: {}
              as: ProgramDirector
          trigger:
            - call: "POST /nrw/pressure-projects/${pp_c2}/commission"
              payload: { measured_pressure_m: 42.0 }
              as: ProgramDirector
          assert:
            - "PressureProject.${pp_c2}.pressure_reduction_pct == 30.0"
            - "PressureProject.${pp_c2}.estimated_leak_reduction_m3_per_year == 272912"
            - "PressureProject.${pp_c2}.status == COMMISSIONED"

      - name: benchmark_volume_weighted_aggregation
        claim_type: correct_result
        grounds: [calculations.benchmark_nrw_aggregation]
        distinguishing_aspect: "utility_nrw_pct is volume-weighted (26.67), not an arithmetic mean of DMA percentages (25.5); per_dma_breakdown rows are frozen in dma.code ASC order."
        test_recipe:
          setup: ["DMA-A (SIV 1e6, nrw 280k, audited 27.5) and DMA-B (SIV 500k, nrw 120k, audited 23.5) each with a FINALIZED balance; report lists both"]
          setup_api_calls:
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-BW-A", name: "Bench A", connection_count: 5000, mains_length_km: 120.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_bwa: $.data.id, dma_bwa_v: $.data.version }
            - call: "POST /nrw/dmas"
              payload: { code: "DMA-BW-B", name: "Bench B", connection_count: 2000, mains_length_km: 60.0, target_nrw_pct: 20.0 }
              as: ProgramDirector
              captures: { dma_bwb: $.data.id, dma_bwb_v: $.data.version }
            - call: "POST /nrw/water-balance-periods"
