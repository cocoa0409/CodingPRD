      - name: segregation_of_duties_outranks_the_incident_state_check
        grounds:
          - validations[priority=45 v_segregation_of_duties]
          - validations[priority=50 v_invalid_state_transition]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_INVALID_STATE]
          - endpoints[POST /compliance-incidents/{incidentId}/adjudicate]
        distinguishing_aspect: |
          The colliding pair is business_safety (v_segregation_of_duties, priority 45, ERR_SEGREGATION_OF_DUTIES, 403) against state (v_invalid_state_transition, priority 50, ERR_INVALID_STATE, 409) on POST /compliance-incidents/{incidentId}/adjudicate, so the winner and the loser differ in HTTP status as well as error_id and an implementation that guards the transition first leaks 409; the other priority_pair_validation_conflict instance pairs state against business_temporal on the slot-assignment endpoint where both candidates are 409.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z."
            - "Certified host, three seated committee members and an approved MUSIC program."
            - "An UNDERWRITING spot on that program is cleared by officer-copy-desk, so UnderwritingSpot.reviewed_by_user_id is officer-copy-desk."
            - "A MINOR SPONSOR_ID incident names that program and that spot."
            - "officer-adjudicator - a different officer - has already adjudicated the incident SUBSTANTIATED, so it is out of OPEN and the spot is SUSPENDED."
            - "officer-copy-desk then tries to adjudicate the same incident again, breaking segregation of duties AND the state guard in one request."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00Z" }, as: ProgramDirector }
            - { call: "POST /volunteers", payload: { legal_name: "Ada Reyes", email: "ada@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2024-08-01" }, as: TrainingCoordinator, captures: { host_id: "$.data.id" } }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BOARD_OPERATION", exam_score: 88 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "STATION_POLICY", exam_score: 90 }, as: TrainingCoordinator }
            - { call: "POST /volunteers/${host_id}/certifications", payload: { cert_type: "BROADCAST_REGULATION", exam_score: 91 }, as: TrainingCoordinator }
            - { call: "POST /volunteers", payload: { legal_name: "Bo Lin", email: "bo@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m1_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Cy Nakamura", email: "cy@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m2_id: "$.data.id" } }
            - { call: "POST /volunteers", payload: { legal_name: "Dee Okafor", email: "dee@krcr.example", role_track: "PROGRAMMER", seniority_start_date: "2023-01-01", committee_seat: true }, as: TrainingCoordinator, captures: { m3_id: "$.data.id" } }
            - { call: "POST /program-proposals", payload: { proposer_volunteer_id: "${host_id}", title: "Delta Sessions", format_code: "MUSIC", language_code: "EN", requested_daypart: "EVENING", requested_duration_minutes: 120 }, as: Volunteer, as_user_id: "${host_id}", captures: { proposal_id: "$.data.id" } }
            - { call: "POST /program-proposals/${proposal_id}/submit", as: Volunteer, as_user_id: "${host_id}" }
            - { call: "POST /program-proposals/${proposal_id}/open-review", as: ProgramDirector }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m1_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m1_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m2_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m2_id}" }
            - { call: "POST /program-proposals/${proposal_id}/votes", payload: { member_volunteer_id: "${m3_id}", format_fit_score: 4, diversity_score: 4, quality_score: 4, recommendation: "APPROVE", rationale: "Approve." }, as: CommitteeMember, as_user_id: "${m3_id}" }
            - { call: "GET /program-proposals/${proposal_id}", as: ProgramDirector, captures: { proposal_version: "$.data.version" } }
            - { call: "POST /program-proposals/${proposal_id}/decide", payload: { expected_proposal_version: "${proposal_version}" }, as: ProgramDirector }
            - { call: "GET /programs?proposal_id=${proposal_id}", as: ProgramDirector, captures: { program_id: "$.data[0].id" } }
            - { call: "POST /underwriting-spots", payload: { underwriter_name: "Fernwood Books", spot_class: "UNDERWRITING", copy_text: "Support for this hour comes from Fernwood Books on Third Street.", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", assigned_program_id: "${program_id}" }, as: DevelopmentCoordinator, captures: { spot_id: "$.data.id" } }
            - { call: "POST /underwriting-spots/${spot_id}/submit-for-review", as: DevelopmentCoordinator }
            - { call: "POST /underwriting-spots/${spot_id}/review", as: ComplianceOfficer, as_user_id: "officer-copy-desk", captures: { reviewer: "$.data.reviewed_by_user_id" } }
            - { call: "POST /compliance-incidents", payload: { category: "SPONSOR_ID", severity: "MINOR", occurred_at: "2026-08-03T20:05:00Z", complainant_note: "Sponsor identification clipped.", program_id: "${program_id}", underwriting_spot_id: "${spot_id}" }, as: ComplianceOfficer, as_user_id: "officer-adjudicator", captures: { incident_id: "$.data.id" } }
            - { call: "POST /compliance-incidents/${incident_id}/adjudicate", payload: { finding: "SUBSTANTIATED" }, as: ComplianceOfficer, as_user_id: "officer-adjudicator", captures: { first_adjudicator: "$.data.adjudicated_by_user_id" } }
          trigger:
            - { call: "POST /compliance-incidents/${incident_id}/adjudicate", payload: { finding: "UNFOUNDED" }, as: ComplianceOfficer, as_user_id: "officer-copy-desk", captures: { error_id: "$.data.error_id" } }
          assert:
            - "403 with data.error_id == ERR_SEGREGATION_OF_DUTIES, the priority-45 business_safety answer"
            - "data.error_id != ERR_INVALID_STATE and the status is not 409, the priority-50 state answer the same request also earns because the incident is already SUBSTANTIATED"
            - "GET /compliance-incidents/${incident_id} shows status == SUBSTANTIATED and adjudicated_by_user_id == officer-adjudicator, unchanged by the rejected call"
            - "GET /programs/${program_id} shows compliance_penalty_points == 1 and compliance_standing == WATCH - no second charge landed"
            - "GET /underwriting-spots/${spot_id} shows status == SUSPENDED and reviewed_by_user_id == officer-copy-desk"

  - rule_id: boundary_precision_check
    instances:
      - name: seniority_preempt_margin_of_exactly_five_points_takes_the_window
        grounds:
          - validations[priority=77 v_seniority_preempt_margin]
          - calculations.volunteer_seniority_score
          - state_machines.SlotAssignment.CONFIRMED_to_PREEMPTED
          - errors[ERR_SENIORITY_MARGIN_UNMET]
          - endpoints[POST /schedule-grids/{gridId}/slot-assignments]
        distinguishing_aspect: |
          The metric is Volunteer.seniority_score expressed as a DIFFERENCE between two hosts and the boundary is the inclusive 5.00-point preemption margin on POST /schedule-grids/{gridId}/slot-assignments, walked with one service month of separation so the pair reads 59.00 - 54.00 == 5.00 (passes) against 58.00 - 54.00 == 4.00 (fails); the other boundary_precision_check instance measures a single grid-level percentage against an absolute 8.00 threshold on POST /schedule-grids/{gridId}/publish.
        test_recipe:
          setup:
            - "Default logical clock 2026-08-01T00:00:00Z, so a seniority_start_date of 2024-08-01 is 24 continuous service months, 2024-04-01 is 28 and 2024-03-01 is 29."
            - "Three certified programmers, each holding all three core certifications (10 points each, so 30 certification points apiece) with no strikes and no scored programs: incumbent Ada (54.00), near-miss challenger Fay (58.00) and challenger Eve (59.00)."
            - "Three seated committee members approve one MUSIC program per host."
            - "An IN_REVIEW 2026-FALL grid carries Ada's show CONFIRMED on Monday 20:00 for 120 minutes; the grid is never published, so the mutability rule at priority 50 cannot mask the margin rule at 77."
            - "Both challengers then ask for exactly that window with conflict_policy SENIORITY_PREEMPT."
