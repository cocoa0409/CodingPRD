            - "RxOrder.${order_id}.gross_charge_cents == 81977 and lab_writeoff_cents == 0, so 81977 == 0 + 81977 + 0"

      - name: order_cancel_returns_the_allocated_blank_and_conserves_the_lot_quantity_ledger
        grounds:
          - state_machines.RxOrder.fulfillment_status.IN_LAB_to_CANCELLED
          - entities.LensBlankLot.fields.allocated_qty
          - entities.LensBlankLot.fields.on_hand_qty
          - endpoints.POST_/rx-orders/{id}/cancel
        distinguishing_aspect: |
          A different conserved quantity: physical blank units, not cents. Across the whole
          allocate-then-cancel round trip the identity
          on_hand_qty + allocated_qty + consumed_qty + scrapped_qty == received_qty holds at every
          step, and cancellation moves the unit back from allocated to on_hand rather than writing it
          off, flipping the lot DEPLETED -> AVAILABLE.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; plan, patient, PRG-HI167 and GEN-1 configured."
            - "A single lot of two 80.0 mm blanks: received_qty 2, on_hand 2, allocated 0, consumed 0, scrapped 0."
            - "Verified prescription, order, COMPUTED 77.0 mm layout and a SURFACE_AND_EDGE job that has allocated one blank, leaving on_hand 1 and allocated 1."
            - "One SCHEDULED surfacing operation is booked on GEN-1 but has never been started, so no operation is RUNNING and billing_status is still PROVISIONAL_QUOTED."
