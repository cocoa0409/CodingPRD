              as: PlatformAdmin
              captures: { venue_p2a: $.data.id }
            - call: "POST /venues"
              payload: { jurisdiction_id: "${jur_p2}", name: "Union County Fairgrounds", city: "Marysville", lot_area_sqft: 200000, power_amps_available: 1000, expected_attendance: 10001, lot_surface: "PAVED", housing_pads_available: 2 }
              as: PlatformAdmin
              captures: { venue_p2b: $.data.id }
            - call: "POST /rides"
              payload: { name: "Giant Wheel", ride_class: "MAJOR", footprint_sqft: 4010, power_amps: 300, crew_size_setup: 6, setup_hours: 8, axle_count: 4, requires_state_inspection: true }
              as: PlatformAdmin
              captures: { ride_p2: $.data.id }
            - call: "POST /routes"
              payload: { name: "2026 Midwest Swing", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_p2a: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_p2a}", venue_id: "${venue_p2a}", load_in_start: "2026-09-01T06:00:00Z", open_date: "2026-09-04T12:00:00Z", close_date: "2026-09-07T12:00:00Z", teardown_deadline: "2026-09-08T12:00:00Z" }
              as: RouteManager
              captures: { stop_p2a: $.data.id, sv_p2a: $.data.version }
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_p2}", route_stop_id: "${stop_p2a}", expected_route_stop_version: "${sv_p2a}" }
              as: LotBoss
              captures: { alloc_p2: $.data.id }
            - call: "POST /routes/${route_p2a}/sequence"
              payload: {}
              as: RouteManager
            - call: "POST /contracts"
              payload: { route_stop_id: "${stop_p2a}", counterparty_name: "Franklin County Agricultural Society", revenue_split_pct_operator: 65, guarantee_cents: 0, ride_minimum_count: 0, exclusivity: "NONE", settlement_basis: "SPLIT_ONLY" }
              as: ContractNegotiator
              captures: { contract_p2: $.data.id }
            - call: "POST /contracts/${contract_p2}/send"
              payload: {}
              as: ContractNegotiator
              as_user_id: "user-negotiator-1"
            - call: "POST /routes/${route_p2a}/commit"
              payload: {}
              as: RouteManager
            - call: "POST /contracts/${contract_p2}/execute"
              payload: {}
              as: GeneralManager
              as_user_id: "user-gm-1"
            - call: "GET /ride-allocations/${alloc_p2}/inspections"
              payload: {}
              as: SafetyOfficer
              captures: { insp_p2: "$.data[0].id" }
            - call: "POST /inspection-orders/${insp_p2}/result"
              payload: { result: "FAIL", defect_count: 3 }
              as: JurisdictionOfficer
            - call: "POST /routes"
              payload: { name: "2026 Late Fall Spur", season_year: 2026, home_base_state: "OH" }
              as: RouteManager
              captures: { route_p2b: $.data.id }
            - call: "POST /route-stops"
              payload: { route_id: "${route_p2b}", venue_id: "${venue_p2b}", load_in_start: "2026-09-08T14:00:00Z", open_date: "2026-09-11T12:00:00Z", close_date: "2026-09-14T12:00:00Z", teardown_deadline: "2026-09-15T12:00:00Z" }
              as: RouteManager
              captures: { stop_p2b: $.data.id, sv_p2b: $.data.version }
          trigger:
            - call: "POST /ride-allocations"
              payload: { ride_id: "${ride_p2}", route_stop_id: "${stop_p2b}", expected_route_stop_version: "${sv_p2b}" }
