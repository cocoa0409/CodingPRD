              payload: { qty: 200 }
              as: VenueOperator
              as_user_id: "${vt_vn_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T03:00:00.000Z" }
              as: TourAccountant
            - call: "POST /shows/${vt_sh_id}/perform"
              payload: {}
              as: TourAccountant
