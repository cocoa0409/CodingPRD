            - {call: "POST /water-rights/${wr4}/beneficial-use-records", payload: {use_year: 2023, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: AERIAL_IMAGERY}, as: WaterRightsAnalyst}
            - {call: "POST /water-rights/${wr4}/beneficial-use-records", payload: {use_year: 2024, reported_diversion_af: 300.000, irrigated_acres: 100.00, verification_source: AFFIDAVIT}, as: WaterRightsAnalyst}
