            - call: "POST /blue-sky-registrations"
              payload: { share_class_id: "${sc_a}", state_code: "CA", registered_amount: 1000000.00, effective_date: "2026-01-01", expiration_date: "2027-01-01" }
              as: ComplianceOfficer
              captures: { bs_ca: $.data.id }
            - call: "POST /shareholder-accounts"
              payload: { registration_type: "INDIVIDUAL", account_channel: "DIRECT", state_code: "CA", tax_id: "464-64-6464", primary_owner_name: "Sam Shortfall" }
              as: TransferAgentOperator
              captures: { acc_sh: $.data.id }
            - call: "POST /shareholder-accounts/${acc_sh}/activate"
              payload: { tin_certified: true }
              as: TransferAgentOperator
            - call: "POST /nav-records"
              payload: { share_class_id: "${sc_a}", valuation_date: "2026-08-03", total_net_assets: 0.00 }
              as: FundAccountant
              captures: { nav1: $.data.id }
            - call: "POST /nav-records/${nav1}/finalize"
              payload: {}
              as: FundAccountant
            - call: "POST /trades"
              payload: { account_id: "${acc_sh}", share_class_id: "${sc_a}", trade_type: "PURCHASE", gross_amount: 30000.00 }
              as: TransferAgentOperator
              captures: { t_sh: $.data.id }
            - call: "POST /trades/${t_sh}/price"
              payload: {}
              as: TransferAgentOperator
            - call: "POST /trades/${t_sh}/settle"
              payload: {}
              as: TransferAgentOperator
          trigger:
            - call: "POST /trades"
              payload: { account_id: "${acc_sh}", share_class_id: "${sc_a}", trade_type: "REDEMPTION", shares_requested: 3000.000 }
