              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visitor_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/written-plans"
              payload: { camp_id: "${camp_id}", plan_type: "HEALTH_CARE", body_ref: "HC-PLAN-A", effective_date: "2026-06-01", expires_at: "2027-05-31", physician_reviewed: true, expected_camp_version: "${camp_v1}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { plan_a_id: "$.data.id" }
            - call: "POST /accreditation/written-plans"
              payload: { camp_id: "${camp_id}", plan_type: "HEALTH_CARE", body_ref: "HC-PLAN-B", effective_date: "2026-06-15", expires_at: "2027-06-14", physician_reviewed: true, expected_camp_version: "${camp_v1}" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_v2: "$.data.version" }
            - call: "POST /accreditation/written-plans"
              payload: { camp_id: "${camp_id}", plan_type: "HEALTH_CARE", body_ref: "HC-PLAN-B", effective_date: "2026-06-15", expires_at: "2027-06-14", physician_reviewed: true, expected_camp_version: "${camp_v2}" }
              as: CampDirector
              as_user_id: "${camp_id}"
              captures: { plan_b_id: "$.data.id" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp_v2}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_v3: "$.data.version" }
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${camp_v3}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_id: "$.data.id", cycle_v1: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cycle_id}", window_start_date: "2026-08-10", window_end_date: "2026-08-16", expected_cycle_version: "${cycle_v1}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_1_id: "$.data.id" }
            - call: "POST /accreditation/visit-assignments"
              payload: { visit_id: "${visit_1_id}", visitor_id: "${visitor_id}", team_role: "LEAD", travel_block_start_date: "2026-08-10", travel_block_end_date: "2026-08-12" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { assignment_1_id: "$.data.id" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cycle_id}", window_start_date: "2026-08-18", window_end_date: "2026-08-24", expected_cycle_version: "${cycle_v1}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/visitors/${visitor_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/cycles/${cycle_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_v2: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cycle_id}", window_start_date: "2026-08-18", window_end_date: "2026-08-24", expected_cycle_version: "${cycle_v2}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visit_2_id: "$.data.id" }
            - call: "GET /accreditation/visit-assignments/${assignment_1_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "call 1: 201 - the plan is filed and Camp.version advances from ${camp_v1} to ${camp_v1} + 1"
            - "call 2: 412 ERR_STALE_CAMP_VERSION - the same version that was valid one call earlier is now one behind, and WrittenPlan.${plan_a_id}.status is still SUBMITTED with no SUPERSEDED flip"
            - "call 4: 201 - with the refreshed version the supersede executes: WrittenPlan.${plan_a_id}.status == SUPERSEDED and WrittenPlan.${plan_b_id}.supersedes_plan_id == ${plan_a_id}"
            - "call 5: 412 ERR_STALE_CAMP_VERSION on a different endpoint - the successful plan filing at call 4 spent ${camp_v2}, so the cycle create inherits the staleness through the shared Camp counter"
            - "call 5 creates nothing: zero AccreditationCycle rows and zero StandardEvaluation rows exist immediately afterwards"
            - "call 7: 201 - Camp.version is ${camp_v3} at the moment of the write and the cycle is created in SELF_ASSESSMENT with applicable_standard_count 1 and applicable_mandatory_count 1"
            - "call 8: 201 - AccreditationCycle.version advances from ${cycle_v1} to ${cycle_v1} + 1 because visit creation bumps the parent cycle"
            - "call 10: 412 ERR_STALE_CYCLE_VERSION - and the guarded cascade did not run: AccreditationVisit.${visit_1_id}.status is still DRAFT, VisitAssignment.${assignment_1_id}.status is still ASSIGNED and call 11 shows Visitor.${visitor_id}.committed_travel_days == 3"
            - "call 13: 201 - with ${cycle_v2} the supersede runs: AccreditationVisit.${visit_1_id}.status == RESCINDED, call 14 shows VisitAssignment.${assignment_1_id}.status == WITHDRAWN, and Visitor.${visitor_id}.committed_travel_days is back to 0"
            - "every 412 response carries response_type error with data.error_id and never a Camp, AccreditationCycle or AccreditationVisit body"

      - name: cascading_side_effects_layer_reachability
        claim_type: Cascading Side Effects
        grounds:
          - complexity_profile.complexity_layers[cascading_side_effects]
        excluded_because:
          difficulty_instance: finalize_scoring_cascade_freezes_camp_and_rejects_verified_self_assessment
          rationale: "The five-hop finalize cascade and the visitor_deactivation_cascade_reverts_visit_and_cycle instance already walk this layer end to end, asserting every intermediate row rather than only the final posture."

      - name: dual_variant_calculation_layer_reachability
        claim_type: Variant Divergence
        grounds:
          - complexity_profile.complexity_layers[dual_variant_calculation]
        excluded_because:
          difficulty_instance: mandatory_compliance_score_provisional_versus_office_final_diverge
          rationale: "Both declared variant pairs are covered there and in camp_risk_index_pre_visit_versus_post_visit_diverge, each pinning the two numbers that the same stored rows must produce under the two variants."

      - name: rate_threshold_triggers_layer_reachability
        claim_type: Threshold Trigger
        grounds:
          - complexity_profile.complexity_layers[rate_threshold_triggers]
        excluded_because:
          difficulty_instance: controlled_dose_window_half_open_boundary_at_exactly_24_hours
          rationale: "The dosing-rate window and the penalty-point posture thresholds are already pinned at their exact inclusive and exclusive boundaries by that instance and by deficiency_penalty_and_deadline_tier_from_base_total_not_post_surcharge."

  - section: consistency_model
    instances:
      - name: every_derived_field_is_readable_in_the_same_response_that_changed_it
        claim_type: Immediate Consistency
        grounds:
          - complexity_profile.consistency_model
          - calculations.required_health_staffing_level
          - calculations.camp_compliance_posture
          - calculations.camp_risk_index
          - endpoints[GET /accreditation/camps/{campId}/risk-index]
        distinguishing_aspect: "No write returns a stale or deferred view: the creation response already carries the staffing requirement, posture and risk index that the recomputation produced, and a later GET plus the computed read must agree digit for digit with the body that was returned at write time."
        test_recipe:
          setup:
            - "clock 2026-08-01; a resident camp with an open-water aquatics and transportation program, 200 resident campers, 45 km from hospital and only a first aider on staff"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "POST /accreditation/camps"
              payload: { name: "Immediate Camp", camp_type: "RESIDENT", state_code: "OH", population_served: "YOUTH_ONLY", program_elements: ["AQUATICS_OPEN_WATER", "TRANSPORTATION"], resident_census: 200, distance_to_hospital_km: 45, health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/${camp_id}/risk-index"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "ACTIVE", state_license_number: "OH-CAMP-77001" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "SUSPENDED" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "GET /accreditation/camps/${camp_id}/risk-index"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "PATCH /accreditation/camps/${camp_id}/health-center"
              payload: { health_staffing_level: "PHYSICIAN_ONSITE" }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
          assert:
            - "call 1 response body already carries required_health_staffing_level == PHYSICIAN_ONSITE (type 3, census 3, distance 3, open-water program 3 with the combination bump), compliance_posture == RESTRICTED, health_intake_status == OPEN, risk_index_variant == PRE_VISIT, risk_index == 43.00 and version == 1"
            - "call 2 returns exactly those values - the read adds nothing and changes nothing"
            - "call 3: incident_component 0, program_component 12, staffing_gap_penalty 15, license_penalty 6, compliance_component 0, population_multiplier 1.0, risk_index 43.00 - the computed read decomposes the same number the write already returned"
            - "call 4 response body carries state_license_status ACTIVE, risk_index == 37.00 and version == 2, with compliance_posture still RESTRICTED because the staffing gap alone holds it there"
            - "call 5 response body carries state_license_status SUSPENDED, compliance_posture == FROZEN, health_intake_status == SUSPENDED, risk_index == 57.00 and version == 3 - the posture cascade is visible without any follow-up read"
            - "call 6: license_penalty 20 and risk_index 57.00, agreeing with the body returned by call 5"
            - "call 7 response body carries health_staffing_level PHYSICIAN_ONSITE, required_health_staffing_level still PHYSICIAN_ONSITE, staffing gap closed so risk_index == 42.00, version == 4, and compliance_posture still FROZEN because the suspended licence outranks the closed gap"
            - "no derived field anywhere requires a second request to settle: every value asserted above was present in the response that produced it"
