  # ==========================================================================
  # Rule 5: priority_pair_validation_conflict — Two conflicts with different error-category pairs
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_assign
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_HOS_VIOLATION]
        distinguishing_aspect: |
          Error-category pair: state vs business_safety. When an order is in PENDING_DEPOSIT
          (wrong state for assign) AND the driver would violate HOS limits, ERR_INVALID_STATE
          (priority 4) must win over ERR_HOS_VIOLATION (priority 5).
        test_recipe:
          setup:
            - "Order in PENDING_DEPOSIT (not yet paid)"
            - "Driver with high current driving hours that would trigger HOS violation"
          setup_api_calls:
            - call: "POST /api/v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
