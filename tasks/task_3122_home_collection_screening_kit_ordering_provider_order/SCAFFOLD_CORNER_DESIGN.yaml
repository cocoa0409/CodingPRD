  # ===========================================================================
  # Endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: list_orders_pagination_envelope
        claim_type: listing
        grounds:
          - "response_envelope"
        distinguishing_aspect: "GET /screening/orders with limit/offset returns the fixed envelope: meta.api_request_id present, response_type array, and pagination fields total_count/has_more."
        test_recipe:
          setup: ["two patients each with one order"]
          setup_api_calls:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-ls1", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /screening/patients"
              payload: { external_ref: "p-ls2", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567825", display_name: "Dr AE", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p1_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
            - call: "POST /screening/orders"
              payload: { patient_id: "${p2_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
          trigger:
            - call: "GET /screening/orders?limit=1&offset=0"
              as: ProgramAdmin
          assert:
            - "response envelope contains meta.api_request_id and response_type == array"
            - "data page contains exactly 1 order; total_count == 2; has_more == true"

      - name: clock_default_before_any_set
        claim_type: defaults
        grounds:
          - "\"endpoints POST /screening/_clock/set_current_utc\""
        distinguishing_aspect: "Before any clock-set call, an SLA read on an order shipped immediately after server start uses the fixed default 2026-09-01T00:00:00Z — provisional_days == 0 on the ship day."
        test_recipe:
          setup: ["no clock-set call has been made in this server run; order created, confirmed, kitted, shipped (all at default time)"]
          setup_api_calls:
            - call: "POST /screening/patients"
              payload: { external_ref: "p-clk", date_of_birth: "1970-01-01", risk_category: "AVERAGE" }
              as: ProgramAdmin
              captures: { p_id: $.data.id }
            - call: "POST /screening/providers"
              payload: { npi: "1234567826", display_name: "Dr AF", channel: "ORDERING" }
              as: ProgramAdmin
              captures: { v_id: $.data.id }
            - call: "POST /screening/orders"
              payload: { patient_id: "${p_id}", provider_id: "${v_id}" }
              as: Provider
              as_user_id: "${v_id}"
              captures: { o_id: $.data.id, o_v: $.data.version }
            - call: "POST /screening/orders/${o_id}/eligibility/confirm"
              payload: {}
              as: ProgramAdmin
            - call: "POST /screening/orders/${o_id}/kit"
              payload: { expected_order_version: "${o_v} + 1" }
              as: FulfillmentAgent
              captures: { k_id: $.data.id }
            - call: "POST /screening/kits/${k_id}/ship"
              payload: {}
              as: FulfillmentAgent
          trigger:
            - call: "GET /screening/orders/${o_id}/sla"
              as: ProgramAdmin
          assert:
            - "response.data.provisional_days == 0 (default clock 2026-09-01 == ship date)"

      - name: error_envelope_shape_on_failure
        claim_type: violation_to_error
        grounds:
          - "response_envelope"
        distinguishing_aspect: "A failing call returns response_type == error and data.error_id / data.message keys."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /screening/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProgramAdmin
          assert:
            - "response.response_type == error"
            - "response.data contains error_id == ERR_NOT_FOUND and a non-empty message"

