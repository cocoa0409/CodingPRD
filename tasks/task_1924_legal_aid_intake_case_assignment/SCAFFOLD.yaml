# =============================================================================
# Task 1924: Legal Aid Intake & Case Assignment — Scaffold Seed Tables
# =============================================================================

scenario: |
  1924. Legal Aid Intake & Case Assignment (legal aid society): intake screening by income eligibility & case type priority, conflict check & jurisdiction/venue determination, advice-only vs extended representation decision, attorney/paralegal assignment & caseload capacity, pro bono referral panel & placement tracking, case outcome & closure coding, grant-funded case restrictions & reporting, client satisfaction & unmet need data

domain_name: legal-aid-intake
api_prefix: /

complexity_profile:
  primary_archetype: quota / allocation        # finite attorney/paralegal caseload units + grant budget cents competed for, reserved, released
  secondary_archetype: compliance / audit      # grant restrictions, ethics SoD, closure coding, report trail
  complexity_layers:
    - selector_policy                          # waitlist promotion ranking; assignment eligibility pools
    - rate_threshold_triggers                  # 125% FPL cap; extended-rep priority threshold; capacity breakpoints
    - dual_variant_calculation                 # standard vs grant income screen; raw-count vs weighted caseload
    - optimistic_concurrency                   # OCC on Case.version (assign) and IntakeApplication.version (rescreen)
  entity_topology: flat                        # peer collections joined by FK references; no nested ownership tree except sub-resource reads
  state_machine_shape: parallel                # Case carries status x funding_status as independent axes; other machines cyclic/branching
  relationship_patterns:
    - one_to_many
    - many_to_many                             # StaffMember.practice_areas x case_type; ReferralPanelMember.counties coverage
    - self_referential                         # StaffMember.supervising_attorney_id -> StaffMember.id
    - cross_aggregate                          # Case -> GrantProgram; Referral -> Case + ReferralPanelMember
  role_model: segregation_of_duties            # screener != case-opener; conflict checker != ethics waiver; ownership-scoped time/closure
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Client
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Client full legal name" }
      - { name: residence_county, type: string, source: input, description: "County of residence, e.g. 'CountyA'" }
      - { name: household_size, type: integer, source: input, description: "Number of people in household; must be >= 1" }
      - { name: annual_gross_income_cents, type: integer, source: input, description: "Gross annual household income in cents; >= 0" }
      - { name: annual_countable_income_cents, type: integer, source: input, description: "Countable annual income in cents (grant screen basis; excludes means-tested benefits); >= 0" }
      - { name: receives_means_tested_benefits, type: boolean, source: input, description: "True if household receives means-tested benefits (income auto-pass under standard screen)" }
      - { name: vulnerability_factors, type: array, source: input, default: [], description: "Zero or more of ELDERLY | DISABLED | DV_SURVIVOR | LIMITED_ENGLISH | HOMELESS | VETERAN" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ARCHIVED" }

  - name: IntakeApplication
    parent: null
    common_fields: true
    fields:
      - { name: client_id, type: string, source: input, description: "FK -> Client.id; applicant" }
      - { name: case_type, type: enum, source: input, description: "EVICTION_DEFENSE | FAMILY_DV | BENEFITS_APPEAL | CONSUMER_DEBT | IMMIGRATION_RELIEF | EXPUNGEMENT" }
      - { name: opposing_party_name, type: string, source: input, description: "Name of adverse party (conflict-check subject)" }
      - { name: incident_county, type: string, source: input, description: "County where the legal matter arises; drives venue determination" }
      - { name: incident_description, type: string, source: input, default: "", description: "Free-text problem summary" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | DOCS_REQUESTED | SCREENED | ELIGIBLE | INELIGIBLE | WAITLISTED | OPENED | WITHDRAWN" }
      - { name: venue, type: enum, source: computed, description: "SUPERIOR_COURT | HOUSING_COURT | FAMILY_COURT | MUNICIPAL_COURT | ADMIN_TRIBUNAL | FEDERAL_TRIBUNAL; copied from matching VenueRule at screen" }
      - { name: gross_poverty_percentage, type: number, source: computed, description: "Standard-screen poverty percentage (gross income), 2dp round_half_up" }
      - { name: countable_poverty_percentage, type: number, source: computed, description: "Grant-screen poverty percentage (countable income), 2dp round_half_up" }
      - { name: priority_score, type: number, source: computed, description: "0.00-100.00 case-type priority score; drives service-level gate and waitlist ranking" }
      - { name: eligibility_determination, type: enum, source: computed, description: "ELIGIBLE | INELIGIBLE; system-computed at screen from standard variant" }
      - { name: screened_by_staff_id, type: string, source: system, description: "StaffMember id (X-User-ID) that ran the most recent screen; SoD anchor" }
      - { name: screened_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent screen" }
      - { name: promoted_from_waitlist, type: boolean, source: system, default: false, description: "True after a sweep promotion moved this application WAITLISTED -> ELIGIBLE" }

  - name: ConflictCheck
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> IntakeApplication.id; check subject" }
      - { name: result, type: enum, source: system, description: "CLEAR | POTENTIAL_CONFLICT | CONFIRMED_CONFLICT | WAIVED | EXPIRED; doubles as state" }
      - { name: checked_by_staff_id, type: string, source: system, description: "StaffMember id (X-User-ID) that ran the check; SoD anchor for ERR_ETHICS_RECUSAL" }
      - { name: checked_at, type: datetime, source: system, description: "Logical-clock creation timestamp" }
      - { name: valid_until, type: datetime, source: computed, description: "= checked_at + 45 days; open-case gate compares against logical clock" }
      - { name: notes, type: string, source: input, default: "", description: "Checker notes" }
      - { name: waiver_reason, type: string, source: input, default: null, description: "Required when resolving POTENTIAL_CONFLICT -> WAIVED" }
      - { name: resolved_by_staff_id, type: string, source: system, default: null, description: "StaffMember id of EthicsOfficer who resolved a POTENTIAL_CONFLICT" }
      - { name: resolved_at, type: datetime, source: system, default: null, description: "Logical-clock timestamp of resolution" }

  - name: Case
    parent: null
    common_fields: true
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> IntakeApplication.id; originating application" }
      - { name: grant_program_id, type: string, source: input, default: null, description: "FK -> GrantProgram.id; funding source, null for unfunded cases" }
      - { name: assigned_attorney_id, type: string, source: system, default: null, description: "FK -> StaffMember.id; null while PENDING_ASSIGNMENT or PRO_BONO-placed" }
      - { name: assigned_paralegal_id, type: string, source: system, default: null, description: "FK -> StaffMember.id; optional" }
      - { name: service_level, type: enum, source: input, description: "ADVICE_ONLY | EXTENDED" }
      - { name: venue, type: enum, source: system, description: "Copied from IntakeApplication.venue at open-case" }
      - { name: placement, type: enum, source: system, default: INTERNAL, description: "INTERNAL | PRO_BONO" }
      - { name: status, type: enum, source: system, description: "PENDING_ASSIGNMENT | OPEN | ON_HOLD | CLOSED (axis 1)" }
      - { name: funding_status, type: enum, source: system, description: "UNFUNDED | GRANT_RESERVED | GRANT_FROZEN | GRANT_SPENT | GRANT_RELEASED (axis 2, parallel to status)" }
      - { name: case_weight, type: integer, source: computed, description: "5 if service_level == EXTENDED else 2" }
      - { name: reserved_cents, type: integer, source: computed, default: 0, description: "Grant amount reserved for this case at open (per-case rounded); 0 when unfunded" }
      - { name: outcome_code, type: enum, source: input, default: null, description: "FULL_WIN | PARTIAL_WIN | SETTLEMENT | ADVICE_GIVEN | REFERRED_OUT | WITHDRAWN_BY_CLIENT | ADMINISTRATIVE" }
      - { name: closure_reason, type: string, source: input, default: null, description: "Free-text closure coding note; sweep auto-close uses 'ADVICE_WINDOW_EXPIRED'" }
      - { name: advice_deadline, type: datetime, source: computed, default: null, description: "ADVICE_ONLY only: = opened_at + 30 days; sweep auto-closes after it" }
      - { name: opened_at, type: datetime, source: system, default: null, description: "Logical-clock time the case first reached OPEN" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Logical-clock time of CLOSED transition" }

  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff full name" }
      - { name: staff_type, type: enum, source: input, description: "ATTORNEY | PARALEGAL | INTAKE_SPECIALIST" }
      - { name: admitted_counties, type: array, source: input, description: "Counties the member may serve; assignment coverage check" }
      - { name: practice_areas, type: array, source: input, description: "case_type values the member handles; assignment coverage check" }
      - { name: max_units, type: integer, source: input, default: 40, description: "Caseload capacity ceiling in weight units; >= 1" }
      - { name: supervising_attorney_id, type: string, source: input, default: null, description: "FK -> StaffMember.id; required when staff_type == PARALEGAL, must reference an ATTORNEY, no cycles" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ON_LEAVE | SEPARATED" }
      - { name: weighted_open_units, type: integer, source: computed, default: 0, description: "Sum of case_weight over cases assigned to this member with status == OPEN" }
      - { name: open_case_count, type: integer, source: computed, default: 0, description: "Count of cases assigned to this member with status == OPEN" }

  - name: ReferralPanelMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Pro bono attorney name" }
      - { name: firm_name, type: string, source: input, default: "", description: "Law firm" }
      - { name: practice_areas, type: array, source: input, description: "case_type values the member accepts" }
      - { name: counties, type: array, source: input, description: "Counties the member serves" }
      - { name: max_active_referrals, type: integer, source: input, description: "Cap on ACCEPTED referrals not yet completed/withdrawn; >= 1" }
      - { name: active_referral_count, type: integer, source: computed, default: 0, description: "Count of referrals for this member in status ACCEPTED" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | INACTIVE" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; referred case" }
      - { name: panel_member_id, type: string, source: input, description: "FK -> ReferralPanelMember.id; offer target" }
      - { name: status, type: enum, source: system, description: "OFFERED | ACCEPTED | DECLINED | EXPIRED | WITHDRAWN | COMPLETED" }
      - { name: notes, type: string, source: input, default: "", description: "Offer notes" }
      - { name: offered_at, type: datetime, source: system, description: "Logical-clock creation timestamp" }
      - { name: response_deadline, type: datetime, source: computed, description: "= offered_at + 10 days; sweep expires OFFERED referrals past it" }
      - { name: responded_at, type: datetime, source: system, default: null, description: "Logical-clock time of respond" }
      - { name: service_start_date, type: string, source: input, default: null, description: "ISO date; required on accept; half-open window start" }
      - { name: service_end_date, type: string, source: input, default: null, description: "ISO date; required on accept; must be > service_start_date; half-open window end" }
      - { name: decline_reason, type: string, source: input, default: null, description: "Optional on decline" }

  - name: GrantProgram
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Program name" }
      - { name: funder, type: string, source: input, description: "Funder name; closed-interval period uniqueness is scoped per funder" }
      - { name: period_start, type: string, source: input, description: "ISO date, closed interval start" }
      - { name: period_end, type: string, source: input, description: "ISO date, closed interval end; must be >= period_start" }
      - { name: allowed_case_types, type: array, source: input, description: "case_type values this grant may fund" }
      - { name: allowed_counties, type: array, source: input, description: "Incident counties this grant may fund" }
      - { name: income_cap_percentage, type: number, source: input, description: "Grant-screen cap on countable_poverty_percentage; eligible when <= cap" }
      - { name: per_case_rate_cents, type: integer, source: input, description: "Base drawdown rate in cents for a weight-5 case; advice cases draw rate x 2/5" }
      - { name: total_budget_cents, type: integer, source: input, description: "Total grant budget in cents; >= 0" }
      - { name: reserved_cents, type: integer, source: computed, default: 0, description: "Sum of Case.reserved_cents for this program's cases with funding_status in {GRANT_RESERVED, GRANT_FROZEN}" }
      - { name: spent_cents, type: integer, source: computed, default: 0, description: "Cumulative cents converted to spent at case closure (billable outcomes)" }
      - { name: available_cents, type: integer, source: computed, description: "= total_budget_cents - reserved_cents - spent_cents; invariant conserved quantity" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED | CLOSED" }

  - name: GrantReport
    parent: null
    common_fields: true
    fields:
      - { name: grant_program_id, type: string, source: system, description: "FK -> GrantProgram.id" }
      - { name: period_label, type: string, source: input, description: "Reporting period label, e.g. '2026-Q3'" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | RETURNED | ACCEPTED" }
      - { name: cases_opened_count, type: integer, source: computed, description: "Cases of this program with opened_at != null at generation time" }
      - { name: cases_closed_count, type: integer, source: computed, description: "Cases of this program with status == CLOSED at generation time" }
      - { name: total_hours, type: number, source: computed, description: "Sum of TimeEntry.hours over this program's cases; 2dp round_half_up" }
      - { name: reserved_cents_snapshot, type: integer, source: computed, description: "GrantProgram.reserved_cents at generation" }
      - { name: spent_cents_snapshot, type: integer, source: computed, description: "GrantProgram.spent_cents at generation" }
      - { name: generated_by_user_id, type: string, source: system, description: "X-User-ID of the GrantsManager who generated the DRAFT" }
      - { name: return_reason, type: string, source: input, default: null, description: "Required on SUBMITTED -> RETURNED" }

  - name: VenueRule
    parent: null
    common_fields: false
    fields:
      - { name: county, type: string, source: input, description: "Incident county this rule covers" }
      - { name: case_type, type: enum, source: input, description: "case_type this rule covers" }
      - { name: venue, type: enum, source: input, description: "SUPERIOR_COURT | HOUSING_COURT | FAMILY_COURT | MUNICIPAL_COURT | ADMIN_TRIBUNAL | FEDERAL_TRIBUNAL" }
      - { name: priority_base_weight, type: integer, source: input, description: "Base weight 1-100 fed into priority_score" }
      - { name: extended_eligible, type: boolean, source: input, description: "Whether this county+case_type may receive EXTENDED representation" }
      # uniqueness: (county, case_type)

  - name: TimeEntry
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id" }
      - { name: staff_id, type: string, source: system, description: "FK -> StaffMember.id; set from X-User-ID of the logging attorney/paralegal" }
      - { name: hours, type: number, source: input, description: "Hours worked; 0.25-24.00, 2dp" }
      - { name: activity_code, type: enum, source: input, description: "RESEARCH | CLIENT_MEETING | COURT_APPEARANCE | DRAFTING | ADMIN" }
      - { name: work_date, type: string, source: input, description: "ISO date the work occurred" }

  - name: SatisfactionSurvey
    parent: null
    common_fields: false
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> Case.id; at most one survey per case" }
      - { name: score, type: integer, source: input, description: "Satisfaction score, integer 1-5 inclusive" }
      - { name: would_recommend, type: boolean, source: input, description: "Whether client would recommend the society" }
      - { name: comments, type: string, source: input, default: "", description: "Free-text comments" }

  - name: UnmetNeedRecord
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> IntakeApplication.id" }
      - { name: reason_code, type: enum, source: system, description: "OVER_INCOME | NO_EXTENDED_CAPACITY | CONFLICT_CONFIRMED | CLIENT_WITHDRAWN" }
      - { name: case_type, type: enum, source: system, description: "Echo of application.case_type for aggregate reporting" }
      - { name: incident_county, type: string, source: system, description: "Echo of application.incident_county for aggregate reporting" }

  - name: WaitlistEntry
    parent: null
    common_fields: false
    fields:
      - { name: application_id, type: string, source: system, description: "FK -> IntakeApplication.id; at most one entry per application" }
      - { name: priority_score_snapshot, type: number, source: system, description: "Application.priority_score frozen at enqueue; ranking key" }
      - { name: required_weight, type: integer, source: system, description: "5 if priority_score_snapshot >= 60.00 else 2; waterfall consumption" }
      # created_at doubles as queued_at (ranking tie-break: created_at ASC)

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: IntakeApplication
    initial_state: SUBMITTED
    terminal_states: [OPENED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: SCREENED
        trigger: "POST /intake-applications/{id}/screen"
        actor: IntakeSpecialist
        preconditions:
          - "VenueRule exists for (incident_county, case_type) else ERR_VENUE_UNDETERMINED"
        side_effects:
          - "Recompute venue, gross_poverty_percentage, countable_poverty_percentage, priority_score, eligibility_determination per calculations"
          - "screened_by_staff_id := X-User-ID; screened_at := logical clock"

      - from: SUBMITTED
        to: DOCS_REQUESTED
        trigger: "POST /intake-applications/{id}/request-documents"
        actor: IntakeSpecialist
        preconditions: []
        side_effects: []

      - from: DOCS_REQUESTED
        to: SUBMITTED
        trigger: "POST /intake-applications/{id}/submit-documents"
        actor: IntakeSpecialist
        preconditions: []
        side_effects:
          - "Documentation cycle loop: application returns to SUBMITTED for a fresh screen"

      - from: SCREENED
        to: ELIGIBLE
        trigger: "POST /intake-applications/{id}/decide-eligibility"
        actor: IntakeSpecialist
        preconditions:
          - "determination input must equal computed eligibility_determination (ELIGIBLE) else ERR_DETERMINATION_MISMATCH"
        side_effects: []

      - from: SCREENED
        to: INELIGIBLE
        trigger: "POST /intake-applications/{id}/decide-eligibility"
        actor: IntakeSpecialist
        preconditions:
          - "determination input must equal computed eligibility_determination (INELIGIBLE) else ERR_DETERMINATION_MISMATCH"
        side_effects:
          - "Create UnmetNeedRecord(reason_code=OVER_INCOME) for this application"

      - from: ELIGIBLE
        to: SUBMITTED
        trigger: "POST /intake-applications/{id}/rescreen"
        actor: IntakeSpecialist
        preconditions:
          - "expected_application_version must match current version else ERR_STALE_VERSION (OCC)"
        side_effects:
          - "Increments IntakeApplication.version by 1; computed screen fields retained until next screen overwrites them"

      - from: INELIGIBLE
        to: SUBMITTED
        trigger: "POST /intake-applications/{id}/rescreen"
        actor: IntakeSpecialist
        preconditions:
          - "expected_application_version must match current version else ERR_STALE_VERSION (OCC)"
        side_effects:
          - "Increments IntakeApplication.version by 1"

      - from: ELIGIBLE
        to: WAITLISTED
        trigger: "POST /intake-applications/{id}/enqueue-waitlist"
        actor: IntakeSpecialist
        preconditions: []
        side_effects:
          - "Create WaitlistEntry(application_id, priority_score_snapshot := priority_score, required_weight := 5 if priority_score >= 60.00 else 2)"
          - "Create UnmetNeedRecord(reason_code=NO_EXTENDED_CAPACITY)"

      - from: WAITLISTED
        to: ELIGIBLE
        trigger: "POST /ops/run-daily-sweep (system promotion step)"
        actor: system
        preconditions:
          - "Waterfall promotion selects this entry (see calculations.waitlist_promotion_waterfall)"
        side_effects:
          - "Delete the WaitlistEntry for this application"
          - "promoted_from_waitlist := true"

      - from: WAITLISTED
        to: SUBMITTED
        trigger: "PATCH /clients/{id} (system cascade on financial-field change)"
        actor: system
        preconditions:
          - "Any of household_size, annual_gross_income_cents, annual_countable_income_cents, receives_means_tested_benefits, residence_county changed"
        side_effects:
          - "Delete the WaitlistEntry for this application (entry requires WAITLISTED status)"

      - from: ELIGIBLE
        to: OPENED
        trigger: "POST /intake-applications/{id}/open-case"
        actor: SupervisingAttorney
        preconditions:
          - "Full open-case validation gauntlet (§1.4 priorities 8-13)"
        side_effects:
          - "Create Case(service_level, grant_program_id?, venue := application.venue, placement=INTERNAL, status=PENDING_ASSIGNMENT)"
          - "Case.funding_status := GRANT_RESERVED when grant_program_id given else UNFUNDED; Case.reserved_cents per calculations.grant_reservation_drawdown"
          - "GrantProgram.reserved_cents += Case.reserved_cents (ledger sync)"

      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /intake-applications/{id}/withdraw"
        actor: IntakeSpecialist
        preconditions: []
        side_effects: ["Create UnmetNeedRecord(reason_code=CLIENT_WITHDRAWN)"]

      - from: DOCS_REQUESTED
        to: WITHDRAWN
        trigger: "POST /intake-applications/{id}/withdraw"
        actor: IntakeSpecialist
        preconditions: []
        side_effects: ["Create UnmetNeedRecord(reason_code=CLIENT_WITHDRAWN)"]

      - from: SCREENED
        to: WITHDRAWN
        trigger: "POST /intake-applications/{id}/withdraw"
        actor: IntakeSpecialist
        preconditions: []
        side_effects: ["Create UnmetNeedRecord(reason_code=CLIENT_WITHDRAWN)"]

      - from: ELIGIBLE
        to: WITHDRAWN
        trigger: "POST /intake-applications/{id}/withdraw"
        actor: IntakeSpecialist
        preconditions: []
        side_effects: ["Create UnmetNeedRecord(reason_code=CLIENT_WITHDRAWN)"]

      - from: INELIGIBLE
        to: WITHDRAWN
        trigger: "POST /intake-applications/{id}/withdraw"
        actor: IntakeSpecialist
        preconditions: []
        side_effects: []

      - from: WAITLISTED
        to: WITHDRAWN
        trigger: "POST /intake-applications/{id}/withdraw"
        actor: IntakeSpecialist
        preconditions: []
        side_effects:
          - "Delete the WaitlistEntry for this application"
          - "Create UnmetNeedRecord(reason_code=CLIENT_WITHDRAWN)"

  - entity: ConflictCheck
    initial_state: null   # created directly into CLEAR or POTENTIAL_CONFLICT
    terminal_states: [CONFIRMED_CONFLICT, EXPIRED]
    transitions:
      - from: POTENTIAL_CONFLICT
        to: CONFIRMED_CONFLICT
        trigger: "POST /conflict-checks/{id}/resolve"
        actor: EthicsOfficer
        preconditions:
          - "X-User-ID != checked_by_staff_id else ERR_ETHICS_RECUSAL (segregation of duties)"
        side_effects:
          - "resolved_by_staff_id := X-User-ID; resolved_at := logical clock"
          - "Create UnmetNeedRecord(reason_code=CONFLICT_CONFIRMED) for the linked application"

      - from: POTENTIAL_CONFLICT
        to: WAIVED
        trigger: "POST /conflict-checks/{id}/resolve"
        actor: EthicsOfficer
        preconditions:
          - "X-User-ID != checked_by_staff_id else ERR_ETHICS_RECUSAL"
          - "waiver_reason required (non-empty) else ERR_INVALID_REQUEST"
        side_effects:
          - "resolved_by_staff_id := X-User-ID; resolved_at := logical clock"

      - from: CLEAR
        to: EXPIRED
        trigger: "POST /ops/run-daily-sweep (system expiry step)"
        actor: system
        preconditions:
          - "logical clock > valid_until"
        side_effects: []

      - from: WAIVED
        to: EXPIRED
        trigger: "POST /ops/run-daily-sweep (system expiry step)"
        actor: system
        preconditions:
          - "logical clock > valid_until"
        side_effects: []

  - entity: Case
    initial_state: PENDING_ASSIGNMENT   # status axis; funding_status axis initialized alongside it
    terminal_states: [CLOSED]
    transitions:
      # ---- status axis ----
      - from: PENDING_ASSIGNMENT
        to: OPEN
        trigger: "POST /cases/{id}/assign"
        actor: SupervisingAttorney
        preconditions:
          - "expected_case_version matches current version else ERR_STALE_VERSION (OCC)"
          - "attorney exists, staff_type ATTORNEY, status ACTIVE else ERR_STAFF_NOT_ACTIVE"
          - "attorney practice_areas contains application.case_type and admitted_counties contains application.incident_county else ERR_STAFF_COVERAGE_MISMATCH"
          - "if paralegal_id given: paralegal staff_type PARALEGAL, status ACTIVE, and supervising_attorney_id == attorney_id else ERR_PARALEGAL_SUPERVISION_MISMATCH"
          - "attorney weighted_open_units + case_weight <= max_units else ERR_CASELOAD_CAPACITY_EXCEEDED (equality permitted)"
        side_effects:
          - "assigned_attorney_id := attorney_id; assigned_paralegal_id := paralegal_id?"
          - "attorney.weighted_open_units += case_weight; attorney.open_case_count += 1 (paralegal load unchanged)"
          - "opened_at := logical clock; if service_level == ADVICE_ONLY: advice_deadline := opened_at + 30 days"
          - "Increments Case.version by 1"

      - from: OPEN
        to: OPEN
        trigger: "POST /cases/{id}/assign (reassignment supersedes current assignment)"
        actor: SupervisingAttorney
        preconditions:
          - "expected_case_version matches current version else ERR_STALE_VERSION (OCC)"
          - "placement == INTERNAL else ERR_CASE_PLACEMENT_CONFLICT"
          - "Same attorney/paralegal checks as PENDING_ASSIGNMENT -> OPEN"
        side_effects:
          - "Old attorney (if any and different): weighted_open_units -= case_weight, open_case_count -= 1"
          - "New attorney: weighted_open_units += case_weight, open_case_count += 1"
          - "Increments Case.version by 1"

      - from: OPEN
        to: ON_HOLD
        trigger: "POST /cases/{id}/place-hold"
        actor: SupervisingAttorney
        preconditions: []
        side_effects:
          - "Assigned attorney (if any): weighted_open_units -= case_weight (OPEN cases only count toward load)"

      - from: ON_HOLD
        to: OPEN
        trigger: "POST /cases/{id}/resume"
        actor: SupervisingAttorney
        preconditions:
          - "Assigned attorney (if any) must satisfy weighted_open_units + case_weight <= max_units else ERR_CASELOAD_CAPACITY_EXCEEDED"
          - "Assigned attorney (if any) must be status ACTIVE else ERR_STAFF_NOT_ACTIVE"
        side_effects:
          - "Assigned attorney (if any): weighted_open_units += case_weight"

      - from: OPEN
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: "StaffAttorney (own case) | SupervisingAttorney"
        preconditions:
          - "If actor role is StaffAttorney: assigned_attorney_id == X-User-ID else ERR_CASE_NOT_ASSIGNED_TO_YOU"
          - "outcome_code required and valid enum else ERR_INVALID_REQUEST"
        side_effects:
          - "closed_at := logical clock"
          - "Assigned attorney (if any): weighted_open_units -= case_weight, open_case_count -= 1"
          - "Funding ledger: if funding_status == GRANT_RESERVED|GRANT_FROZEN and outcome_code in {FULL_WIN, PARTIAL_WIN, SETTLEMENT, ADVICE_GIVEN}: program.reserved_cents -= reserved_cents(case), program.spent_cents += reserved_cents(case), funding_status := GRANT_SPENT"
          - "Funding ledger: if funding_status == GRANT_RESERVED|GRANT_FROZEN and outcome_code in {REFERRED_OUT, WITHDRAWN_BY_CLIENT, ADMINISTRATIVE}: program.reserved_cents -= reserved_cents(case), funding_status := GRANT_RELEASED (available_cents restored)"
          - "Any Referral for this case in status ACCEPTED -> COMPLETED; panel member active_referral_count -= 1"

      - from: ON_HOLD
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: "StaffAttorney (own case) | SupervisingAttorney"
        preconditions:
          - "Same ownership and outcome_code rules as OPEN -> CLOSED"
        side_effects:
          - "Same funding-ledger and referral-completion effects as OPEN -> CLOSED (no load change; ON_HOLD cases already excluded from load)"

      - from: PENDING_ASSIGNMENT
        to: CLOSED
        trigger: "POST /cases/{id}/close"
        actor: "SupervisingAttorney"
        preconditions:
          - "outcome_code required and valid enum else ERR_INVALID_REQUEST"
        side_effects:
          - "Same funding-ledger effects as OPEN -> CLOSED; no attorney load change (never assigned)"

      # ---- funding_status axis (parallel) ----
      - from: GRANT_RESERVED
        to: GRANT_FROZEN
        trigger: "POST /grant-programs/{id}/suspend (system cascade link 1)"
        actor: system
        preconditions:
          - "Case.grant_program_id == suspended program"
        side_effects:
          - "Cascade link 2: this funding freeze itself forces Case.status OPEN -> ON_HOLD (funding freeze propagates to case posture)"
          - "Cascade link 3: each forced OPEN -> ON_HOLD reduces assigned attorney.weighted_open_units by case_weight (capacity released by the freeze, not by the original suspend call)"

      - from: GRANT_FROZEN
        to: GRANT_RESERVED
        trigger: "POST /grant-programs/{id}/resume (system cascade)"
        actor: system
        preconditions:
          - "Case.grant_program_id == resumed program"
        side_effects:
          - "funding_status restored; Case.status stays ON_HOLD (manual POST /cases/{id}/resume with capacity re-check is required)"

  - entity: Referral
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED, WITHDRAWN, COMPLETED]
    transitions:
      - from: OFFERED
        to: ACCEPTED
        trigger: "POST /referrals/{id}/respond"
        actor: "SupervisingAttorney | ProgramDirector"
        preconditions:
          - "decision == ACCEPT; service_start_date and service_end_date required, end > start else ERR_INVALID_REQUEST"
          - "panel_member.status == ACTIVE else ERR_PANEL_MEMBER_NOT_ACTIVE"
          - "panel_member.active_referral_count < max_active_referrals else ERR_PANEL_CAPACITY_REACHED"
          - "No other ACCEPTED referral for same panel_member whose half-open [service_start_date, service_end_date) overlaps the request window; adjacency (end == start) is NOT overlap else ERR_PANEL_WINDOW_OVERLAP"
        side_effects:
          - "responded_at := logical clock"
          - "Case.placement := PRO_BONO; if Case.status == PENDING_ASSIGNMENT: status := OPEN, opened_at := now (no attorney load; pro bono placement satisfies assignment)"
          - "If Case.service_level == ADVICE_ONLY and advice_deadline null: advice_deadline := opened_at + 30 days"
          - "panel_member.active_referral_count += 1"

      - from: OFFERED
        to: DECLINED
        trigger: "POST /referrals/{id}/respond"
        actor: "SupervisingAttorney | ProgramDirector"
        preconditions:
          - "decision == DECLINE"
        side_effects:
          - "responded_at := logical clock"

      - from: OFFERED
        to: EXPIRED
        trigger: "POST /ops/run-daily-sweep (system expiry step)"
        actor: system
        preconditions:
          - "logical clock > response_deadline"
        side_effects: []

      - from: OFFERED
        to: WITHDRAWN
        trigger: "POST /referrals/{id}/withdraw"
        actor: SupervisingAttorney
        preconditions: []
        side_effects: []

      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /referrals/{id}/withdraw"
        actor: SupervisingAttorney
        preconditions:
          - "Case.status != CLOSED else ERR_INVALID_CASE_STATE"
        side_effects:
          - "Cascade: Case.placement := INTERNAL; if the case has no assigned_attorney_id, Case.status OPEN -> PENDING_ASSIGNMENT (placement pulled back)"
          - "panel_member.active_referral_count -= 1"

      - from: ACCEPTED
        to: COMPLETED
        trigger: "POST /cases/{id}/close (system cascade)"
        actor: system
        preconditions:
          - "Referral.case_id == closed case"
        side_effects:
          - "panel_member.active_referral_count -= 1"

  - entity: GrantProgram
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /grant-programs/{id}/suspend"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "Cascade link 1: every Case with grant_program_id == id and funding_status == GRANT_RESERVED -> GRANT_FROZEN (then links 2-3 fire per Case machine)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /grant-programs/{id}/resume"
        actor: ProgramDirector
        preconditions: []
        side_effects:
          - "Cascade: every Case with funding_status == GRANT_FROZEN -> GRANT_RESERVED (status stays ON_HOLD; manual resume required)"

      - from: ACTIVE
        to: CLOSED
        trigger: "POST /grant-programs/{id}/close"
        actor: ProgramDirector
        preconditions:
          - "reserved_cents == 0 else ERR_GRANT_HAS_RESERVED_FUNDS"
        side_effects: []

      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /grant-programs/{id}/close"
        actor: ProgramDirector
        preconditions:
          - "reserved_cents == 0 else ERR_GRANT_HAS_RESERVED_FUNDS (GRANT_FROZEN cases still reserve)"
        side_effects: []

  - entity: GrantReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /grant-reports/{id}/submit"
        actor: GrantsManager
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /grant-reports/{id}/accept"
        actor: ProgramDirector
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /grant-reports/{id}/return"
        actor: ProgramDirector
        preconditions:
          - "return_reason required (non-empty) else ERR_INVALID_REQUEST"
        side_effects: []

      - from: RETURNED
        to: DRAFT
        trigger: "POST /grant-reports/{id}/revise"
        actor: GrantsManager
        preconditions: []
        side_effects:
          - "Aggregates (cases_opened_count, cases_closed_count, total_hours, snapshots) recomputed at revise time"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: case-assign-stale-version
    parent_entity: Case
    write_endpoint: "POST /cases/{id}/assign"
    occ_field: expected_case_version
    description: |
      Assigning (or reassigning) an attorney against a Case whose version has
      advanced since the client last observed it is rejected. Assignment from
      OPEN legitimately supersedes the prior assignment, so a second sequential
      request carrying the pre-supersede version observes an otherwise-valid
      state and would succeed without this check; the stale expected_case_version
      is what condemns it.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: application-rescreen-stale-version
    parent_entity: IntakeApplication
    write_endpoint: "POST /intake-applications/{id}/rescreen"
    occ_field: expected_application_version
    description: |
      Rescreening an IntakeApplication whose version has advanced since the
      client last observed it is rejected. Rescreen legitimately supersedes the
      prior screening result, so a second sequential request carrying the
      pre-supersede version observes an otherwise-valid state and would succeed
      without this check; the stale expected_application_version condemns it.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: poverty_percentage_screen
    trigger: "POST /intake-applications/{id}/screen"
    algorithm: threshold
    formula: |
      fpl_cents(household_size) = POVERTY_BASE_CENTS + POVERTY_PER_ADDITIONAL_CENTS * (household_size - 1)
      pct(income_cents) = round_half_up(income_cents / fpl_cents(household_size) * 100, 2)
      variant standard_screen:
        income = client.annual_gross_income_cents
        application.gross_poverty_percentage = pct(income)
        pass = (client.receives_means_tested_benefits == true) OR (gross_poverty_percentage <= STANDARD_CAP_PCT)
        eligibility_determination = ELIGIBLE if pass else INELIGIBLE   # boundary: <= 125.00 inclusive passes
      variant grant_screen:
        income = client.annual_countable_income_cents
        application.countable_poverty_percentage = pct(income)
        (no benefits auto-pass; verdict deferred to open-case: countable_poverty_percentage <= grant.income_cap_percentage)
      Both percentages are computed and STORED on every screen; only the standard variant drives eligibility_determination.
    input_set: "The IntakeApplication being screened + its Client; Client fields as of the screen call"
    constants:
      POVERTY_BASE_CENTS: 1506000        # $15,060.00 one-person FPL
      POVERTY_PER_ADDITIONAL_CENTS: 538000   # +$5,380.00 per additional household member
      STANDARD_CAP_PCT: 125.00
    precision: "2 decimal places, round_half_up"
    variants:
      - name: standard_screen
        when: "Always at screen time; drives eligibility_determination"
        difference: "Uses annual_gross_income_cents, cap 125.00, and a means-tested-benefits auto-pass"
      - name: grant_screen
        when: "Computed and stored at screen time; adjudicated at open-case against the chosen GrantProgram"
        difference: "Uses annual_countable_income_cents, cap = grant.income_cap_percentage, NO benefits auto-pass — identical client data yields a different percentage and a different pass/fail"

  - name: priority_score
    trigger: "POST /intake-applications/{id}/screen"
    algorithm: weighted_scoring
    formula: |
      rule = VenueRule for (application.incident_county, application.case_type)   # screen fails ERR_VENUE_UNDETERMINED if absent
      base = rule.priority_base_weight                                             # 1..100
      n = len(client.vulnerability_factors)
      vuln_mult = min(1 + VULN_STEP * n, VULN_MULT_CAP)                            # 1.00 .. 1.75
      urgency = URGENCY_HIGH if case_type in {EVICTION_DEFENSE, FAMILY_DV}
                else URGENCY_MED if case_type == BENEFITS_APPEAL
                else 0
      priority_score = min(SCORE_CAP, round_half_up(base * vuln_mult + urgency, 2))
    input_set: "Application being screened, its Client.vulnerability_factors, and the matching VenueRule"
    constants:
      VULN_STEP: 0.15
      VULN_MULT_CAP: 1.75
      URGENCY_HIGH: 20
      URGENCY_MED: 10
      SCORE_CAP: 100.00
    precision: "2 decimal places, round_half_up"

  - name: caseload_load
    trigger: "case assign / reassign / place-hold / resume / close; grant-suspend cascade link 3; staff create"
    algorithm: aggregation
    formula: |
      weight(case) = 5 if case.service_level == EXTENDED else 2
      weighted_load(member) = sum(weight(c) for c in cases where c.assigned_attorney_id == member.id and c.status == OPEN)
      raw_count(member)    = count(c for c in cases where c.assigned_attorney_id == member.id and c.status == OPEN)
      StaffMember.weighted_open_units := weighted_load; StaffMember.open_case_count := raw_count
      available_units(member) = member.max_units - member.weighted_open_units
      Paralegal assignments never add load. ON_HOLD and PENDING_ASSIGNMENT cases contribute nothing.
    input_set: "Cases whose assigned_attorney_id == member.id AND status == OPEN; all other statuses excluded"
    constants:
      EXTENDED_WEIGHT: 5
      ADVICE_WEIGHT: 2
    precision: "integer units; no rounding"
    variants:
      - name: raw_count
        when: "open_case_count surface (listings, caseload read)"
        difference: "Counts heads, not weights: 1 EXTENDED + 3 ADVICE_ONLY gives 4"
      - name: weighted_load
        when: "capacity gating at assign/resume and the waitlist waterfall pool"
        difference: "Same case set gives 5 + 3*2 = 11 — a different number from raw_count for identical data"

  - name: grant_reservation_drawdown
    trigger: "open-case (reserve), case close (convert to spent or release), grant suspend/resume (freeze preserves reservation)"
    algorithm: waterfall_allocation
    formula: |
      Per-case reservation, computed AT OPEN TIME and stored on Case.reserved_cents:
        reserved_cents(case) = round_half_up(grant.per_case_rate_cents * case_weight(case) / EXTENDED_WEIGHT, 0)
      Rounding order is PINNED: round each case's reservation to whole cents individually, then sum the
      integers into GrantProgram.reserved_cents. Summing unrounded values and rounding once is FORBIDDEN
      (e.g. rate 33,333: three advice cases reserve 3 x 13,333 = 39,999, not round(39,999.6) = 40,000).
      Ledger transitions on close:
        billable outcomes {FULL_WIN, PARTIAL_WIN, SETTLEMENT, ADVICE_GIVEN}:  reserved -= r; spent += r
        non-billable {REFERRED_OUT, WITHDRAWN_BY_CLIENT, ADMINISTRATIVE}:      reserved -= r  (release)
      Conservation invariant: reserved_cents + spent_cents + available_cents == total_budget_cents at all times.
    input_set: "Cases with grant_program_id == program.id; reservations counted while funding_status in {GRANT_RESERVED, GRANT_FROZEN}"
    constants:
      EXTENDED_WEIGHT: 5
      ADVICE_WEIGHT: 2
    precision: "whole cents, round_half_up applied per case before summation"

  - name: service_level_gate
    trigger: "POST /intake-applications/{id}/open-case"
    algorithm: constraint_propagation
    formula: |
      Evaluation order is PINNED (the terms look circular; they are not when evaluated in this order):
        (1) priority_score — already stored on the application by screen; read it, do not recompute.
        (2) Extended-eligibility gates: priority_score >= EXTENDED_MIN_PRIORITY AND venue_rule.extended_eligible == true,
            else ERR_EXTENDED_REP_NOT_PERMITTED.
        (3) Capacity pool — computed from PRE-OPENING state (this case contributes nothing yet):
            pool = sum(available_units(m)) over StaffMember m where m.staff_type == ATTORNEY and m.status == ACTIVE
            EXTENDED requires exists m in pool-set with available_units(m) >= EXTENDED_WEIGHT, else ERR_NO_EXTENDED_CAPACITY.
            ADVICE_ONLY imposes no pool check at open time (assignment-time check still applies).
        (4) Grant gates (when grant_program_id given) run after (1)-(3) per §1.4 ordering.
      The gate never mutates load; load moves only at assign.
    input_set: "Application (priority_score), matching VenueRule, all StaffMember with staff_type == ATTORNEY and status == ACTIVE"
    constants:
      EXTENDED_MIN_PRIORITY: 60.00
      EXTENDED_WEIGHT: 5
    precision: "exact comparisons; threshold is >= 60.00 inclusive"

  - name: waitlist_promotion_waterfall
    trigger: "POST /ops/run-daily-sweep (promotion step, runs AFTER expiry and auto-close steps)"
    algorithm: waterfall_allocation
    formula: |
      pool = sum(available_units(m)) over StaffMember m where m.staff_type == ATTORNEY and m.status == ACTIVE
           (uses post-auto-close loads, so closures in the same sweep free capacity for promotion)
      candidates = all WaitlistEntry, ordered by priority_score_snapshot DESC, then created_at ASC (no id tie-breaks)
      for each entry in order:
        if entry.required_weight <= pool:
          promote: application WAITLISTED -> ELIGIBLE, promoted_from_waitlist := true, delete entry, pool -= required_weight
        else:
          SKIP the entry (no head-of-line blocking) and continue to the next entry
      Entries surviving the sweep remain waitlisted with original snapshots.
    input_set: "All WaitlistEntry rows; ACTIVE attorneys only (ON_LEAVE/SEPARATED contribute 0 to pool)"
    constants:
      EXTENDED_WEIGHT: 5
      ADVICE_WEIGHT: 2
      EXTENDED_MIN_PRIORITY: 60.00
    precision: "integer units"

  - name: grant_report_aggregation
    trigger: "POST /grant-programs/{id}/reports (generate DRAFT); POST /grant-reports/{id}/revise (recompute)"
    algorithm: aggregation
    formula: |
      cases_opened_count = count(cases where grant_program_id == program.id and opened_at != null)
      cases_closed_count = count(cases where grant_program_id == program.id and status == CLOSED)
      total_hours = round_half_up(sum(te.hours for te in TimeEntry where te.case_id in program's cases), 2)
      reserved_cents_snapshot = program.reserved_cents; spent_cents_snapshot = program.spent_cents
      Snapshots freeze at generation; later case activity does NOT mutate an existing DRAFT (only revise recomputes).
    input_set: "Cases with grant_program_id == program.id (any status); TimeEntry rows on those cases"
    constants: {}
    precision: "hours 2dp round_half_up; counts and cents exact integers"

  - name: daily_sweep_effects
    trigger: "POST /ops/run-daily-sweep"
    algorithm: chronological
    formula: |
      Steps execute in this PINNED order (order is observable: auto-closes before promotion free capacity
      that the same sweep's waterfall then consumes):
        1. Conflict-check expiry: every ConflictCheck in {CLEAR, WAIVED} with valid_until < now -> EXPIRED.
        2. Referral expiry: every Referral OFFERED with response_deadline < now -> EXPIRED.
        3. Advice auto-close: every Case with service_level == ADVICE_ONLY, status == OPEN, advice_deadline < now
           -> CLOSED with outcome_code = ADMINISTRATIVE, closure_reason = 'ADVICE_WINDOW_EXPIRED';
           full close side effects fire (attorney load release, grant release, referral completion).
        4. Waitlist promotion: run calculations.waitlist_promotion_waterfall against post-step-3 capacity.
      Returns counts per step.
    input_set: "All ConflictCheck, Referral, ADVICE_ONLY OPEN Case, and WaitlistEntry rows"
    constants:
      CONFLICT_VALID_DAYS: 45
      REFERRAL_RESPONSE_DAYS: 10
      ADVICE_ONLY_WINDOW_DAYS: 30
    precision: "datetime comparisons strict: deadline < now means a deadline exactly equal to now does NOT trigger"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Path-template ids resolve, validated left-to-right (application before nested conflict-checks, etc.)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all endpoints with path ids" }
  - { priority: 4, category: existence, check: "Ownership scope: StaffAttorney closing a case must be its assigned_attorney_id; time-entry actor must be the case's assigned attorney or paralegal", error_id: "ERR_CASE_NOT_ASSIGNED_TO_YOU | ERR_TIME_ENTRY_FORBIDDEN", http_status: 403, applies_to: "POST /cases/{id}/close, POST /cases/{id}/time-entries" }
  - { priority: 5, category: existence, check: "Request shape: required fields present, enum membership, ranges (score 1-5, hours 0.25-24, end>start, household_size>=1, non-negative cents), no unknown fields", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutating endpoints" }
  - { priority: 6, category: existence, check: "Body FK references exist (client_id, attorney_id, paralegal_id, panel_member_id, grant_program_id, supervising_attorney_id)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "create/action endpoints carrying body FKs" }
  - { priority: 7, category: state, check: "Target entity is in a from-state of the requested transition", error_id: "ERR_INVALID_APPLICATION_STATE | ERR_INVALID_CASE_STATE | ERR_INVALID_REFERRAL_STATE | ERR_INVALID_GRANT_STATE | ERR_INVALID_REPORT_STATE", http_status: 409, applies_to: "all state-transition endpoints" }
  - { priority: 8, category: state, check: "OCC: expected_case_version / expected_application_version equals current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /cases/{id}/assign, POST /intake-applications/{id}/rescreen" }
  - { priority: 9, category: business_safety, check: "SoD: conflict resolver must differ from checked_by_staff_id", error_id: ERR_ETHICS_RECUSAL, http_status: 403, applies_to: "POST /conflict-checks/{id}/resolve" }
  - { priority: 10, category: business_safety, check: "SoD: open-case actor must differ from application.screened_by_staff_id", error_id: ERR_SELF_SCREENING_APPROVAL, http_status: 403, applies_to: "POST /intake-applications/{id}/open-case" }
  - { priority: 11, category: business_safety, check: "Latest ConflictCheck (by created_at) for the application must exist with result in {CLEAR, WAIVED}", error_id: ERR_CONFLICT_UNRESOLVED, http_status: 409, applies_to: "POST /intake-applications/{id}/open-case" }
  - { priority: 12, category: business_safety, check: "Latest ConflictCheck.valid_until >= logical clock (not expired)", error_id: ERR_CONFLICT_CHECK_STALE, http_status: 409, applies_to: "POST /intake-applications/{id}/open-case" }
  - { priority: 13, category: business_constraint, check: "decide-eligibility input determination equals computed eligibility_determination", error_id: ERR_DETERMINATION_MISMATCH, http_status: 409, applies_to: "POST /intake-applications/{id}/decide-eligibility" }
  - { priority: 14, category: business_constraint, check: "VenueRule exists for (incident_county, case_type) at screen", error_id: ERR_VENUE_UNDETERMINED, http_status: 422, applies_to: "POST /intake-applications/{id}/screen" }
  - { priority: 15, category: business_constraint, check: "No other Case for the same client + case_type in {PENDING_ASSIGNMENT, OPEN, ON_HOLD}", error_id: ERR_DUPLICATE_OPEN_CASE, http_status: 409, applies_to: "POST /intake-applications/{id}/open-case" }
  - { priority: 16, category: business_constraint, check: "EXTENDED gate: priority_score >= 60.00 AND venue_rule.extended_eligible", error_id: ERR_EXTENDED_REP_NOT_PERMITTED, http_status: 422, applies_to: "POST /intake-applications/{id}/open-case with service_level=EXTENDED" }
  - { priority: 17, category: business_constraint, check: "VenueRule (county, case_type) uniqueness on create", error_id: ERR_VENUE_RULE_CONFLICT, http_status: 409, applies_to: "POST /venue-rules" }
  - { priority: 18, category: business_constraint, check: "PARALEGAL staff require supervising_attorney_id referencing an ATTORNEY; supervision chain must be acyclic", error_id: ERR_INVALID_SUPERVISOR, http_status: 422, applies_to: "POST /staff-members, PATCH /staff-members/{id}" }
  - { priority: 19, category: business_constraint, check: "Referral target case: placement == INTERNAL and status in {PENDING_ASSIGNMENT, OPEN}", error_id: ERR_CASE_PLACEMENT_CONFLICT, http_status: 409, applies_to: "POST /cases/{id}/referrals" }
  - { priority: 19.5, category: business_constraint, check: "Panel member status == ACTIVE at offer time (OFFERED creation) and at accept time", error_id: ERR_PANEL_MEMBER_NOT_ACTIVE, http_status: 409, applies_to: "POST /cases/{id}/referrals, POST /referrals/{id}/respond" }
  - { priority: 20, category: business_constraint, check: "Coverage: assignee practice_areas contains case_type AND admitted_counties contains incident_county (staff); panel member practice_areas/counties cover the case (referral offer)", error_id: "ERR_STAFF_COVERAGE_MISMATCH | ERR_PANEL_COVERAGE_MISMATCH", http_status: 422, applies_to: "POST /cases/{id}/assign, POST /cases/{id}/referrals" }
  - { priority: 21, category: business_constraint, check: "Paralegal (when provided) is PARALEGAL, ACTIVE, and supervised by the assigned attorney", error_id: ERR_PARALEGAL_SUPERVISION_MISMATCH, http_status: 422, applies_to: "POST /cases/{id}/assign" }
  - { priority: 22, category: business_constraint, check: "Survey target case is CLOSED (else ERR_CASE_NOT_CLOSED); at most one survey per case (else ERR_DUPLICATE_SURVEY)", error_id: "ERR_CASE_NOT_CLOSED | ERR_DUPLICATE_SURVEY", http_status: 409, applies_to: "POST /cases/{id}/satisfaction-surveys" }
  - { priority: 23, category: business_constraint, check: "Staff SEPARATED transition requires zero cases in {OPEN, ON_HOLD} assigned to the member", error_id: ERR_STAFF_HAS_OPEN_CASES, http_status: 409, applies_to: "PATCH /staff-members/{id}" }
  - { priority: 24, category: business_constraint, check: "Panel member INACTIVE transition requires active_referral_count == 0", error_id: ERR_PANEL_HAS_ACTIVE_PLACEMENTS, http_status: 409, applies_to: "PATCH /referral-panel-members/{id}" }
  - { priority: 25, category: business_temporal, check: "Logical clock within grant [period_start, period_end] inclusive at open-case", error_id: ERR_GRANT_PERIOD_INACTIVE, http_status: 409, applies_to: "POST /intake-applications/{id}/open-case with grant_program_id" }
  - { priority: 26, category: business_temporal, check: "Grant create: no other program with same funder whose CLOSED-interval [period_start, period_end] overlaps; boundary-touching (end == start) IS overlap", error_id: ERR_GRANT_PERIOD_OVERLAP, http_status: 409, applies_to: "POST /grant-programs" }
  - { priority: 27, category: business_temporal, check: "Referral accept: half-open [service_start_date, service_end_date) must not overlap another ACCEPTED referral window for the same panel member; adjacency (end == start) is NOT overlap", error_id: ERR_PANEL_WINDOW_OVERLAP, http_status: 409, applies_to: "POST /referrals/{id}/respond with decision=ACCEPT" }
  - { priority: 28, category: business_referential, check: "Grant coverage: application.case_type in grant.allowed_case_types AND application.incident_county in grant.allowed_counties", error_id: "ERR_GRANT_CASE_TYPE_EXCLUDED | ERR_GRANT_COUNTY_EXCLUDED", http_status: 422, applies_to: "POST /intake-applications/{id}/open-case with grant_program_id" }
  - { priority: 29, category: business_referential, check: "Grant income test: application.countable_poverty_percentage <= grant.income_cap_percentage (grant_screen variant, no benefits auto-pass)", error_id: ERR_GRANT_INCOME_OVER_CAP, http_status: 422, applies_to: "POST /intake-applications/{id}/open-case with grant_program_id" }
  - { priority: 30, category: business_fiscal, check: "EXTENDED capacity pool: some ACTIVE attorney has available_units >= 5", error_id: ERR_NO_EXTENDED_CAPACITY, http_status: 409, applies_to: "POST /intake-applications/{id}/open-case with service_level=EXTENDED" }
  - { priority: 31, category: business_fiscal, check: "Assignee capacity: weighted_open_units + case_weight <= max_units (equality permitted); also enforced on resume", error_id: ERR_CASELOAD_CAPACITY_EXCEEDED, http_status: 409, applies_to: "POST /cases/{id}/assign, POST /cases/{id}/resume" }
  - { priority: 32, category: business_fiscal, check: "Grant budget: grant.available_cents >= per-case reservation for this case", error_id: ERR_GRANT_BUDGET_EXHAUSTED, http_status: 409, applies_to: "POST /intake-applications/{id}/open-case with grant_program_id" }
  - { priority: 33, category: business_fiscal, check: "Panel capacity: active_referral_count < max_active_referrals at offer and at accept", error_id: ERR_PANEL_CAPACITY_REACHED, http_status: 409, applies_to: "POST /cases/{id}/referrals, POST /referrals/{id}/respond" }
  - { priority: 34, category: business_fiscal, check: "Grant close requires reserved_cents == 0", error_id: ERR_GRANT_HAS_RESERVED_FUNDS, http_status: 409, applies_to: "POST /grant-programs/{id}/close" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Server startup default (before any set) is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock.", roles: [ProgramDirector], code: 200, input: [to_iso8601], output: null, side_effects: ["All datetime comparisons (valid_until, response_deadline, advice_deadline, grant periods) read this clock"] }

  # --- ops sweep ---
  - method: POST
    path: "/ops/run-daily-sweep"
    description: "Run the pinned 4-step daily batch: conflict expiry, referral expiry, advice auto-close, waitlist promotion waterfall"
    roles: [ProgramDirector]
    code: 200
    input: []
    output: { expired_conflict_checks: integer, expired_referrals: integer, auto_closed_cases: integer, promoted_applications: integer }
    side_effects: ["Per calculations.daily_sweep_effects; every mutated entity bumps updated_at (and version where common_fields)"]

  # --- Client ---
  - { method: POST, path: "/clients", description: "Register a client", roles: [IntakeSpecialist], code: 201, input: [full_name, residence_county, household_size, annual_gross_income_cents, annual_countable_income_cents, receives_means_tested_benefits, "vulnerability_factors?"], output: Client, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/clients/{id}", description: "Get a client", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: [], output: Client, side_effects: [] }
  - { method: GET, path: "/clients", description: "List clients with optional filters and pagination", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: ["residence_county?", "status?", "limit?", "offset?"], output: "Client[]", side_effects: [] }
  - method: PATCH
    path: "/clients/{id}"
    description: "Update client financial/household fields; financial changes cascade: applications in {SCREENED, ELIGIBLE, INELIGIBLE} -> SUBMITTED, applications in WAITLISTED -> SUBMITTED with WaitlistEntry deleted"
    roles: [IntakeSpecialist]
    code: 200
    input: ["full_name?", "residence_county?", "household_size?", "annual_gross_income_cents?", "annual_countable_income_cents?", "receives_means_tested_benefits?", "vulnerability_factors?", "status?"]
    output: Client
    side_effects: ["status may be set to ARCHIVED (no cascade); financial-field changes cascade per IntakeApplication machine (WAITLISTED -> SUBMITTED + entry deletion); bumps Client.version"]

  # --- IntakeApplication ---
  - { method: POST, path: "/intake-applications", description: "Create an intake application for a client", roles: [IntakeSpecialist], code: 201, input: [client_id, case_type, opposing_party_name, incident_county, "incident_description?"], output: IntakeApplication, side_effects: ["status=SUBMITTED, version=1"] }
  - { method: GET, path: "/intake-applications/{id}", description: "Get an application", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: [], output: IntakeApplication, side_effects: [] }
  - { method: GET, path: "/intake-applications", description: "List applications", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: ["client_id?", "status?", "case_type?", "incident_county?", "limit?", "offset?"], output: "IntakeApplication[]", side_effects: [] }
  - { method: POST, path: "/intake-applications/{id}/screen", description: "Run income+priority screening; SUBMITTED -> SCREENED", roles: [IntakeSpecialist], code: 200, input: [], output: IntakeApplication, side_effects: ["Computes venue, both poverty percentages, priority_score, eligibility_determination; stamps screened_by_staff_id/screened_at"] }
  - { method: POST, path: "/intake-applications/{id}/request-documents", description: "SUBMITTED -> DOCS_REQUESTED", roles: [IntakeSpecialist], code: 200, input: ["request_note?"], output: IntakeApplication, side_effects: [] }
  - { method: POST, path: "/intake-applications/{id}/submit-documents", description: "DOCS_REQUESTED -> SUBMITTED (documentation loop)", roles: [IntakeSpecialist], code: 200, input: [], output: IntakeApplication, side_effects: [] }
  - { method: POST, path: "/intake-applications/{id}/decide-eligibility", description: "SCREENED -> ELIGIBLE | INELIGIBLE; input determination must match computed", roles: [IntakeSpecialist], code: 200, input: [determination], output: IntakeApplication, side_effects: ["INELIGIBLE creates UnmetNeedRecord(OVER_INCOME)"] }
  - { method: POST, path: "/intake-applications/{id}/rescreen", description: "ELIGIBLE | INELIGIBLE -> SUBMITTED (OCC)", roles: [IntakeSpecialist], code: 200, input: [expected_application_version], output: IntakeApplication, side_effects: ["Increments IntakeApplication.version by 1"] }
  - { method: POST, path: "/intake-applications/{id}/enqueue-waitlist", description: "ELIGIBLE -> WAITLISTED; snapshots priority and required weight", roles: [IntakeSpecialist], code: 200, input: [], output: IntakeApplication, side_effects: ["Creates WaitlistEntry; creates UnmetNeedRecord(NO_EXTENDED_CAPACITY)"] }
  - { method: POST, path: "/intake-applications/{id}/withdraw", description: "Any non-terminal state -> WITHDRAWN", roles: [IntakeSpecialist], code: 200, input: ["withdrawal_reason?"], output: IntakeApplication, side_effects: ["Deletes WaitlistEntry if present; creates UnmetNeedRecord(CLIENT_WITHDRAWN) except from INELIGIBLE"] }
  - { method: POST, path: "/intake-applications/{id}/open-case", description: "ELIGIBLE -> OPENED; creates Case after full validation gauntlet", roles: [SupervisingAttorney], code: 201, input: [service_level, "grant_program_id?"], output: Case, side_effects: ["Creates Case(PENDING_ASSIGNMENT); grant reservation ledger per calculations.grant_reservation_drawdown"] }

  # --- ConflictCheck ---
  - { method: POST, path: "/intake-applications/{id}/conflict-checks", description: "Run a conflict check; created directly into CLEAR or POTENTIAL_CONFLICT", roles: [IntakeSpecialist], code: 201, input: [result, "notes?"], output: ConflictCheck, side_effects: ["checked_by_staff_id := X-User-ID; checked_at := clock; valid_until := clock + 45 days"] }
  - { method: GET, path: "/intake-applications/{id}/conflict-checks", description: "List conflict checks for an application (FK reverse)", roles: [IntakeSpecialist, SupervisingAttorney, EthicsOfficer, ProgramDirector], code: 200, input: ["limit?", "offset?"], output: "ConflictCheck[]", side_effects: [] }
  - { method: GET, path: "/conflict-checks/{id}", description: "Get a conflict check", roles: [IntakeSpecialist, SupervisingAttorney, EthicsOfficer, ProgramDirector], code: 200, input: [], output: ConflictCheck, side_effects: [] }
  - { method: POST, path: "/conflict-checks/{id}/resolve", description: "POTENTIAL_CONFLICT -> CONFIRMED_CONFLICT | WAIVED (EthicsOfficer, SoD)", roles: [EthicsOfficer], code: 200, input: [resolution, "waiver_reason?"], output: ConflictCheck, side_effects: ["CONFIRMED_CONFLICT creates UnmetNeedRecord(CONFLICT_CONFIRMED)"] }

  # --- Case ---
  - { method: GET, path: "/cases/{id}", description: "Get a case", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: [], output: Case, side_effects: [] }
  - { method: GET, path: "/cases", description: "List cases", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: ["application_id?", "grant_program_id?", "assigned_attorney_id?", "assigned_paralegal_id?", "status?", "funding_status?", "placement?", "limit?", "offset?"], output: "Case[]", side_effects: [] }
  - { method: POST, path: "/cases/{id}/assign", description: "Assign or reassign attorney (+optional paralegal); PENDING_ASSIGNMENT -> OPEN or OPEN -> OPEN (OCC)", roles: [SupervisingAttorney], code: 200, input: [attorney_id, "paralegal_id?", expected_case_version], output: Case, side_effects: ["Caseload ledger per calculations.caseload_load; sets opened_at/advice_deadline on first OPEN; increments Case.version by 1"] }
  - { method: POST, path: "/cases/{id}/place-hold", description: "OPEN -> ON_HOLD; releases attorney load", roles: [SupervisingAttorney], code: 200, input: ["hold_reason?"], output: Case, side_effects: ["attorney.weighted_open_units -= case_weight"] }
  - { method: POST, path: "/cases/{id}/resume", description: "ON_HOLD -> OPEN with capacity and ACTIVE re-check", roles: [SupervisingAttorney], code: 200, input: [], output: Case, side_effects: ["attorney.weighted_open_units += case_weight"] }
  - { method: POST, path: "/cases/{id}/close", description: "OPEN | ON_HOLD | PENDING_ASSIGNMENT -> CLOSED with outcome coding", roles: [StaffAttorney, SupervisingAttorney], code: 200, input: [outcome_code, "closure_reason?"], output: Case, side_effects: ["Load release, grant ledger convert/release, ACCEPTED referral -> COMPLETED per Case machine"] }

  # --- TimeEntry ---
  - { method: POST, path: "/cases/{id}/time-entries", description: "Log time on an OPEN case; actor must be assigned attorney or paralegal", roles: [StaffAttorney, Paralegal, SupervisingAttorney], code: 201, input: [hours, activity_code, work_date], output: TimeEntry, side_effects: ["staff_id := X-User-ID"] }
  - { method: GET, path: "/time-entries/{id}", description: "Get a time entry", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: [], output: TimeEntry, side_effects: [] }
  - { method: GET, path: "/time-entries", description: "List time entries (multi-FK filtered list)", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: ["case_id?", "staff_id?", "limit?", "offset?"], output: "TimeEntry[]", side_effects: [] }

  # --- StaffMember ---
  - { method: POST, path: "/staff-members", description: "Create staff; PARALEGAL requires supervising_attorney_id", roles: [ProgramDirector], code: 201, input: [full_name, staff_type, admitted_counties, practice_areas, "max_units?", "supervising_attorney_id?"], output: StaffMember, side_effects: ["status=ACTIVE; load fields 0"] }
  - { method: GET, path: "/staff-members/{id}", description: "Get a staff member", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: [], output: StaffMember, side_effects: [] }
  - { method: GET, path: "/staff-members", description: "List staff", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: ["supervising_attorney_id?", "staff_type?", "status?", "practice_area?", "county?", "limit?", "offset?"], output: "StaffMember[]", side_effects: [] }
  - { method: PATCH, path: "/staff-members/{id}", description: "Update capacity/status/coverage/supervision; SEPARATED requires zero open/hold cases", roles: [ProgramDirector], code: 200, input: ["full_name?", "max_units?", "status?", "admitted_counties?", "practice_areas?", "supervising_attorney_id?"], output: StaffMember, side_effects: ["Supervision cycle check; bumps version"] }
  - method: GET
    path: "/staff-members/{id}/caseload"
    description: "Computed caseload read"
    roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector]
    code: 200
    input: []
    output: { weighted_open_units: integer, open_case_count: integer, max_units: integer, available_units: integer, utilization_pct: number }
    side_effects: []

  # --- ReferralPanelMember ---
  - { method: POST, path: "/referral-panel-members", description: "Add a pro bono panel member", roles: [ProgramDirector], code: 201, input: [full_name, "firm_name?", practice_areas, counties, max_active_referrals], output: ReferralPanelMember, side_effects: ["status=ACTIVE; active_referral_count=0"] }
  - { method: GET, path: "/referral-panel-members/{id}", description: "Get a panel member", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: [], output: ReferralPanelMember, side_effects: [] }
  - { method: GET, path: "/referral-panel-members", description: "List panel members", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: ["status?", "practice_area?", "county?", "limit?", "offset?"], output: "ReferralPanelMember[]", side_effects: [] }
  - { method: PATCH, path: "/referral-panel-members/{id}", description: "Update panel member; INACTIVE requires zero ACCEPTED referrals", roles: [ProgramDirector], code: 200, input: ["status?", "max_active_referrals?", "practice_areas?", "counties?"], output: ReferralPanelMember, side_effects: ["ERR_PANEL_HAS_ACTIVE_PLACEMENTS guard"] }

  # --- Referral ---
  - { method: POST, path: "/cases/{id}/referrals", description: "Offer a case to a panel member; creates OFFERED referral with 10-day response deadline", roles: [SupervisingAttorney], code: 201, input: [panel_member_id, "notes?"], output: Referral, side_effects: ["response_deadline := clock + 10 days"] }
  - { method: GET, path: "/referrals/{id}", description: "Get a referral", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: [], output: Referral, side_effects: [] }
  - { method: GET, path: "/referrals", description: "List referrals (multi-FK filtered list)", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: ["case_id?", "panel_member_id?", "status?", "limit?", "offset?"], output: "Referral[]", side_effects: [] }
  - { method: POST, path: "/referrals/{id}/respond", description: "OFFERED -> ACCEPTED (with service window) | DECLINED", roles: [SupervisingAttorney, ProgramDirector], code: 200, input: [decision, "service_start_date?", "service_end_date?", "decline_reason?"], output: Referral, side_effects: ["ACCEPT: placement PRO_BONO, count += 1, half-open overlap check"] }
  - { method: POST, path: "/referrals/{id}/withdraw", description: "OFFERED | ACCEPTED -> WITHDRAWN; ACCEPTED withdrawal pulls case back to INTERNAL", roles: [SupervisingAttorney], code: 200, input: ["withdrawal_reason?"], output: Referral, side_effects: ["ACCEPTED: case placement INTERNAL, may revert to PENDING_ASSIGNMENT, count -= 1"] }

  # --- GrantProgram ---
  - { method: POST, path: "/grant-programs", description: "Create a grant program; same-funder closed-interval periods must not overlap", roles: [ProgramDirector], code: 201, input: [name, funder, period_start, period_end, allowed_case_types, allowed_counties, income_cap_percentage, per_case_rate_cents, total_budget_cents], output: GrantProgram, side_effects: ["status=ACTIVE; reserved=spent=0; available=total_budget_cents"] }
  - { method: GET, path: "/grant-programs/{id}", description: "Get a grant program", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: [], output: GrantProgram, side_effects: [] }
  - { method: GET, path: "/grant-programs", description: "List grant programs", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: ["funder?", "status?", "limit?", "offset?"], output: "GrantProgram[]", side_effects: [] }
  - { method: POST, path: "/grant-programs/{id}/suspend", description: "ACTIVE -> SUSPENDED; freezes funded cases (cascade links 1-3)", roles: [ProgramDirector], code: 200, input: [], output: GrantProgram, side_effects: ["Cases GRANT_RESERVED -> GRANT_FROZEN -> status ON_HOLD -> attorney load released"] }
  - { method: POST, path: "/grant-programs/{id}/resume", description: "SUSPENDED -> ACTIVE; unfreezes funding (cases stay ON_HOLD for manual resume)", roles: [ProgramDirector], code: 200, input: [], output: GrantProgram, side_effects: ["Cases GRANT_FROZEN -> GRANT_RESERVED"] }
  - { method: POST, path: "/grant-programs/{id}/close", description: "ACTIVE | SUSPENDED -> CLOSED; requires reserved_cents == 0", roles: [ProgramDirector], code: 200, input: [], output: GrantProgram, side_effects: [] }
  - method: GET
    path: "/grant-programs/{id}/utilization"
    description: "Computed grant ledger read"
    roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector]
    code: 200
    input: []
    output: { total_budget_cents: integer, reserved_cents: integer, spent_cents: integer, available_cents: integer, utilization_pct: number }
    side_effects: []

  # --- GrantReport ---
  - { method: POST, path: "/grant-programs/{id}/reports", description: "Generate a DRAFT report with aggregate snapshots; only one DRAFT/SUBMITTED per program", roles: [GrantsManager], code: 201, input: [period_label], output: GrantReport, side_effects: ["Aggregates per calculations.grant_report_aggregation; generated_by_user_id := X-User-ID"] }
  - { method: GET, path: "/grant-reports/{id}", description: "Get a report", roles: [SupervisingAttorney, GrantsManager, ProgramDirector], code: 200, input: [], output: GrantReport, side_effects: [] }
  - { method: GET, path: "/grant-programs/{id}/reports", description: "List reports for a program (FK reverse)", roles: [SupervisingAttorney, GrantsManager, ProgramDirector], code: 200, input: ["limit?", "offset?"], output: "GrantReport[]", side_effects: [] }
  - { method: POST, path: "/grant-reports/{id}/submit", description: "DRAFT -> SUBMITTED", roles: [GrantsManager], code: 200, input: [], output: GrantReport, side_effects: [] }
  - { method: POST, path: "/grant-reports/{id}/accept", description: "SUBMITTED -> ACCEPTED (terminal)", roles: [ProgramDirector], code: 200, input: [], output: GrantReport, side_effects: [] }
  - { method: POST, path: "/grant-reports/{id}/return", description: "SUBMITTED -> RETURNED with reason", roles: [ProgramDirector], code: 200, input: [return_reason], output: GrantReport, side_effects: [] }
  - { method: POST, path: "/grant-reports/{id}/revise", description: "RETURNED -> DRAFT; recomputes aggregates", roles: [GrantsManager], code: 200, input: [], output: GrantReport, side_effects: ["Recompute per calculations.grant_report_aggregation"] }

  # --- VenueRule ---
  - { method: POST, path: "/venue-rules", description: "Create a venue rule; (county, case_type) unique", roles: [ProgramDirector], code: 201, input: [county, case_type, venue, priority_base_weight, extended_eligible], output: VenueRule, side_effects: [] }
  - { method: GET, path: "/venue-rules/{id}", description: "Get a venue rule", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: [], output: VenueRule, side_effects: [] }
  - { method: GET, path: "/venue-rules", description: "List venue rules", roles: [IntakeSpecialist, SupervisingAttorney, StaffAttorney, Paralegal, EthicsOfficer, GrantsManager, ProgramDirector], code: 200, input: ["county?", "case_type?", "limit?", "offset?"], output: "VenueRule[]", side_effects: [] }

  # --- SatisfactionSurvey ---
  - { method: POST, path: "/cases/{id}/satisfaction-surveys", description: "Record a satisfaction survey for a CLOSED case; one per case; immutable", roles: [IntakeSpecialist], code: 201, input: [score, would_recommend, "comments?"], output: SatisfactionSurvey, side_effects: [] }
  - { method: GET, path: "/cases/{id}/satisfaction-surveys", description: "List surveys for a case (0 or 1)", roles: [IntakeSpecialist, SupervisingAttorney, GrantsManager, ProgramDirector], code: 200, input: ["limit?", "offset?"], output: "SatisfactionSurvey[]", side_effects: [] }

  # --- UnmetNeedRecord ---
  - { method: GET, path: "/unmet-need-records/{id}", description: "Get an unmet-need record", roles: [IntakeSpecialist, SupervisingAttorney, GrantsManager, ProgramDirector], code: 200, input: [], output: UnmetNeedRecord, side_effects: [] }
  - { method: GET, path: "/unmet-need-records", description: "List unmet-need records", roles: [IntakeSpecialist, SupervisingAttorney, GrantsManager, ProgramDirector], code: 200, input: ["application_id?", "reason_code?", "limit?", "offset?"], output: "UnmetNeedRecord[]", side_effects: [] }

  # --- WaitlistEntry ---
  - { method: GET, path: "/waitlist-entries/{id}", description: "Get a waitlist entry", roles: [IntakeSpecialist, SupervisingAttorney, ProgramDirector], code: 200, input: [], output: WaitlistEntry, side_effects: [] }
  - { method: GET, path: "/waitlist-entries", description: "List waitlist entries ranked priority_score_snapshot DESC, created_at ASC", roles: [IntakeSpecialist, SupervisingAttorney, ProgramDirector], code: 200, input: ["application_id?", "limit?", "offset?"], output: "WaitlistEntry[]", side_effects: [] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED_ROLE, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body-FK reference does not resolve" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, unknown field, bad enum, or range violation (score 1-5, hours 0.25-24, end>start, etc.)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match current entity version (OCC)" }
  - { id: ERR_INVALID_APPLICATION_STATE, http: 409, condition: "Application not in a from-state for the requested transition" }
  - { id: ERR_DETERMINATION_MISMATCH, http: 409, condition: "decide-eligibility input contradicts computed eligibility_determination" }
  - { id: ERR_VENUE_UNDETERMINED, http: 422, condition: "No VenueRule for (incident_county, case_type) at screen" }
  - { id: ERR_CONFLICT_UNRESOLVED, http: 409, condition: "open-case while latest conflict check missing, POTENTIAL_CONFLICT, or CONFIRMED_CONFLICT" }
  - { id: ERR_CONFLICT_CHECK_STALE, http: 409, condition: "open-case while latest CLEAR/WAIVED check is past valid_until" }
  - { id: ERR_ETHICS_RECUSAL, http: 403, condition: "EthicsOfficer resolving a check they personally ran (SoD)" }
  - { id: ERR_SELF_SCREENING_APPROVAL, http: 403, condition: "SupervisingAttorney opening a case they personally screened (SoD)" }
  - { id: ERR_DUPLICATE_OPEN_CASE, http: 409, condition: "Another case for same client + case_type in PENDING_ASSIGNMENT/OPEN/ON_HOLD" }
  - { id: ERR_EXTENDED_REP_NOT_PERMITTED, http: 422, condition: "EXTENDED requested but priority_score < 60.00 or venue_rule.extended_eligible false" }
  - { id: ERR_NO_EXTENDED_CAPACITY, http: 409, condition: "No ACTIVE attorney has available_units >= 5 at open-case" }
  - { id: ERR_CASELOAD_CAPACITY_EXCEEDED, http: 409, condition: "Assign/resume would push attorney weighted_open_units above max_units" }
  - { id: ERR_STAFF_NOT_ACTIVE, http: 409, condition: "Assign/resume targeting ON_LEAVE or SEPARATED staff" }
  - { id: ERR_INVALID_SUPERVISOR, http: 422, condition: "Paralegal supervisor missing/not ATTORNEY, or supervision cycle" }
  - { id: ERR_INVALID_CASE_STATE, http: 409, condition: "Case not in a from-state for the requested transition" }
  - { id: ERR_GRANT_CASE_TYPE_EXCLUDED, http: 422, condition: "case_type not in grant.allowed_case_types" }
  - { id: ERR_GRANT_COUNTY_EXCLUDED, http: 422, condition: "incident_county not in grant.allowed_counties" }
  - { id: ERR_GRANT_PERIOD_INACTIVE, http: 409, condition: "Logical clock outside grant [period_start, period_end] at open-case" }
  - { id: ERR_GRANT_BUDGET_EXHAUSTED, http: 409, condition: "grant.available_cents below this case's reservation" }
  - { id: ERR_GRANT_PERIOD_OVERLAP, http: 409, condition: "Same-funder grant with overlapping CLOSED period interval (boundary touch counts)" }
  - { id: ERR_GRANT_HAS_RESERVED_FUNDS, http: 409, condition: "Grant close while reserved_cents > 0" }
  - { id: ERR_INVALID_GRANT_STATE, http: 409, condition: "Grant program not in a from-state for the requested transition" }
  - { id: ERR_PANEL_MEMBER_NOT_ACTIVE, http: 409, condition: "Offer or accept while panel member SUSPENDED/INACTIVE" }
  - { id: ERR_PANEL_WINDOW_OVERLAP, http: 409, condition: "Accept would overlap another ACCEPTED half-open service window for the member" }
  - { id: ERR_PANEL_CAPACITY_REACHED, http: 409, condition: "active_referral_count == max_active_referrals at offer or accept" }
  - { id: ERR_CASE_PLACEMENT_CONFLICT, http: 409, condition: "Referral/assign attempted on a case whose placement forbids it" }
  - { id: ERR_INVALID_REFERRAL_STATE, http: 409, condition: "Referral not in a from-state for the requested transition" }
  - { id: ERR_CASE_NOT_CLOSED, http: 409, condition: "Satisfaction survey attempted on a non-CLOSED case" }
  - { id: ERR_DUPLICATE_SURVEY, http: 409, condition: "Case already has a satisfaction survey" }
  - { id: ERR_INVALID_REPORT_STATE, http: 409, condition: "Report not in a from-state, or a DRAFT/SUBMITTED report already exists for the program" }
  - { id: ERR_TIME_ENTRY_FORBIDDEN, http: 403, condition: "Time log by a user who is not the case's assigned attorney/paralegal" }
  - { id: ERR_CASE_NOT_ASSIGNED_TO_YOU, http: 403, condition: "StaffAttorney closing a case assigned to another attorney" }
  - { id: ERR_STAFF_COVERAGE_MISMATCH, http: 422, condition: "Attorney lacks the case_type practice area or incident county admission" }
  - { id: ERR_PARALEGAL_SUPERVISION_MISMATCH, http: 422, condition: "Paralegal not supervised by the assigned attorney (or wrong type/status)" }
  - { id: ERR_STAFF_HAS_OPEN_CASES, http: 409, condition: "SEPARATED transition with OPEN/ON_HOLD cases still assigned" }
  - { id: ERR_PANEL_COVERAGE_MISMATCH, http: 422, condition: "Panel member practice_areas/counties do not cover the case" }
  - { id: ERR_PANEL_HAS_ACTIVE_PLACEMENTS, http: 409, condition: "INACTIVE transition while active_referral_count > 0" }
  - { id: ERR_GRANT_INCOME_OVER_CAP, http: 422, condition: "countable_poverty_percentage above grant.income_cap_percentage" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: IntakeSpecialist
    description: "Front-desk intake worker; registers clients, runs screening and conflict checks, records surveys. Entity-backed so screened_by/checked_by SoD anchors resolve."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /clients, PATCH /clients/{id}"
      - "POST /intake-applications and all /intake-applications/{id}/* actions except open-case"
      - "POST /intake-applications/{id}/conflict-checks"
      - "POST /cases/{id}/satisfaction-surveys"
    shared_operations: ["All GET list/detail endpoints"]

  - name: SupervisingAttorney
    description: "Senior attorney; makes service-level decisions, assigns staff, manages referrals and case posture. May not open a case they personally screened (SoD)."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /intake-applications/{id}/open-case"
      - "POST /cases/{id}/assign, place-hold, resume"
      - "POST /cases/{id}/referrals, POST /referrals/{id}/withdraw"
    shared_operations:
      - "POST /cases/{id}/close (any case), POST /cases/{id}/time-entries, POST /referrals/{id}/respond"
      - "All GET list/detail endpoints"

  - name: StaffAttorney
    description: "Line attorney; works only own assigned cases (ownership-scoped close/time)."
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "POST /cases/{id}/close (only when assigned_attorney_id == X-User-ID)"
      - "POST /cases/{id}/time-entries (only when assigned attorney/paralegal)"
      - "All GET list/detail endpoints"

  - name: Paralegal
    description: "Paralegal; logs time only on cases where assigned_paralegal_id == X-User-ID."
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations:
      - "POST /cases/{id}/time-entries (only when assigned paralegal)"
      - "All GET list/detail endpoints"

  - name: EthicsOfficer
    description: "Conflicts arbiter; resolves POTENTIAL_CONFLICT checks. May not resolve a check they personally ran (SoD)."
    identity: "entity_backed:StaffMember"
    exclusive_operations:
      - "POST /conflict-checks/{id}/resolve"
    shared_operations: ["All GET list/detail endpoints"]

  - name: GrantsManager
    description: "Grant reporting operator; generates, submits, revises grant reports. No grant-program administration (segregated from ProgramDirector)."
    identity: "opaque"
    exclusive_operations:
      - "POST /grant-programs/{id}/reports"
      - "POST /grant-reports/{id}/submit, POST /grant-reports/{id}/revise"
    shared_operations: ["All GET list/detail endpoints except conflict-check and waitlist views"]

  - name: ProgramDirector
    description: "Operations administrator; manages staff, panel, venue rules, grant programs; runs sweep and logical clock; accepts/returns reports."
    identity: "opaque"
    exclusive_operations:
      - "POST /staff-members, PATCH /staff-members/{id}"
      - "POST /referral-panel-members, PATCH /referral-panel-members/{id}"
      - "POST /venue-rules"
      - "POST /grant-programs and /grant-programs/{id}/suspend|resume|close"
      - "POST /grant-reports/{id}/accept, POST /grant-reports/{id}/return"
      - "POST /ops/run-daily-sweep, POST /_clock/set_current_utc"
    shared_operations:
      - "POST /referrals/{id}/respond"
      - "All GET list/detail endpoints"
