            - "Title.${ttl_id}.on_hand_units == 300"
            - "Title.${ttl_id}.written_off_units == 0"

      - name: escalated_comment_response_clears_critical_count_but_keeps_overdue
        claim_type: valid_transition
        grounds:
          - state_machines.PublicComment.ESCALATED_to_RESPONDED
          - calculations.comment_response_obligation
          - calculations.compliance_score
        distinguishing_aspect: |
          Answering an ESCALATED comment must move it to RESPONDED and drop
          unresolved_critical_count to 0 while overdue_response_count stays 1 and
          was_overdue_at_response stays true, lifting compliance_score from 80 to 95.
        test_recipe:
          setup:
            - "State NC is OPEN_TERRITORY with comment_response_days 10, sampling_copies_required 0 and min_verified_coverage_pct 50.00"
            - "The submission was FILED at clock 2026-09-15 and one CRITICAL comment was filed the same instant, due 2026-09-25"
            - "At clock 2026-10-01 the officer advanced the cycle, so sweep S1 escalated the comment and compliance_score fell to 80"
          setup_api_calls:
            - call: "POST /state-profiles"
              payload: { state_code: "NC", adoption_model: "OPEN_TERRITORY", sampling_copies_required: 0, comment_response_days: 10, min_verified_coverage_pct: 50.00 }
