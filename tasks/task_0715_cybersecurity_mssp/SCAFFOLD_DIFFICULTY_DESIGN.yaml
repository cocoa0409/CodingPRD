              as: PlatformAdmin
              captures: { asset_id: $.data.id }
            - call: "POST /engagements"
              payload: { client_id: "${client_id}", kind: "VULN_SCAN", authorized_window_start: "2026-03-01T00:00:00Z", authorized_window_end: "2026-04-01T00:00:00Z", estimated_hours: 10, scope_asset_ids: ["${asset_id}"] }
              as: EngagementLead
              captures: { eng_id: $.data.id }
            - call: "POST /engagements/${eng_id}/authorize"
              payload: {}
              as: ClientContact
            - call: "POST /engagements/${eng_id}/start"
              payload: {}
              as: EngagementLead
              captures: { eng_v2: $.data.version }
            - call: "POST /scans"
              payload: { engagement_id: "${eng_id}", expected_engagement_version: "${eng_v2}" }
              as: EngagementLead
              captures: { scan_id: $.data.id }
            - call: "POST /scans/${scan_id}/start"
              payload: {}
              as: EngagementLead
            - call: "POST /scans/${scan_id}/complete"
              payload: { actual_hours: 5, raw_finding_count: 1 }
              as: EngagementLead
            - call: "POST /findings"
              payload: { scan_id: "${scan_id}", asset_id: "${asset_id}", title: "Both", cvss_base: 5.0 }
              as: EngagementLead
              as_user_id: "lead-x"
              captures: { finding_id: $.data.id }
          trigger:
            - call: "POST /findings/${finding_id}/retest"
              payload: { retest_passed: true }
              as: EngagementLead
              as_user_id: "lead-x"
              captures: { err: $.data.error_id }
          assert:
            - "retest returns error_id == ERR_INVALID_STATE (finding is OPEN; priority 7 state beats priority 9 segregation even though submitter == actor)"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_triage_p1_floor_inclusive_80
        grounds:
          - calculations.alert_triage_priority
          - entities.Alert.fields.triage_priority
        distinguishing_aspect: |
          Numeric-threshold boundary on POST /alerts: a score of exactly 80.00
          (raw_score=100 * 0.6 + HIGH weight 20 + 0 = 80.00) lands P1 because P1_FLOOR
          is inclusive (>=), whereas raw_score=99 gives 79.40 -> P2; the band crosses
          AT the floor, not above it.
        test_recipe:
          setup:
            - "Client; HIGH/INTERNAL asset; two alerts raw_score 100 and 99."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "B1 Co", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /assets"
              payload: { client_id: "${client_id}", hostname: "b1-01", ip_address: "10.0.1.3", criticality: "HIGH", exposure: "INTERNAL" }
              as: PlatformAdmin
              captures: { asset_id: $.data.id }
          trigger:
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "SIEM", raw_score: 100 }
              as: SocAnalyst
              captures: { a_at: $.data.triage_priority }
            - call: "POST /alerts"
              payload: { client_id: "${client_id}", asset_id: "${asset_id}", source: "SIEM", raw_score: 99 }
              as: SocAnalyst
              captures: { a_below: $.data.triage_priority }
          assert:
            - "alert(raw_score=100).triage_priority == P1 (score 80.00 >= 80, inclusive floor)"
            - "alert(raw_score=99).triage_priority == P2 (score 79.40 < 80)"

      - name: boundary_audit_readiness_empty_evidence_zero_distinct
        grounds:
          - calculations.compliance_readiness_pct
          - entities.ComplianceAudit.fields.readiness_pct
          - validations[priority=16]
          - errors[ERR_AUDIT_NOT_READY]
        distinguishing_aspect: |
          Empty/zero-count boundary on a different metric and endpoint
          (POST /audits/{id}/mark-ready): with zero APPROVED evidence rows
          readiness_pct == 0.00, so mark-ready returns ERR_AUDIT_NOT_READY; this is an
          empty-collection edge (count of DISTINCT APPROVED control_ref == 0), not a
          numeric-threshold crossing.
        test_recipe:
          setup:
            - "Client with no open CRITICAL findings; ComplianceAudit required_control_count=3 moved to FIELDWORK with zero approved evidence."
          setup_api_calls:
            - call: "POST /clients"
              payload: { name: "B2 Co", tier: "ESSENTIAL", retainer_hours_per_period: 50 }
              as: PlatformAdmin
              captures: { client_id: $.data.id }
            - call: "POST /audits"
              payload: { client_id: "${client_id}", framework: "SOC2", required_control_count: 3 }
              as: Auditor
              captures: { audit_id: $.data.id, readiness0: $.data.readiness_pct }
            - call: "POST /audits/${audit_id}/begin-fieldwork"
              payload: {}
              as: Auditor
          trigger:
            - call: "POST /audits/${audit_id}/mark-ready"
              payload: {}
              as: Auditor
              captures: { err: $.data.error_id }
          assert:
            - "ComplianceAudit.${audit_id}.readiness_pct == 0.00 with zero APPROVED evidence"
            - "mark-ready returns ERR_AUDIT_NOT_READY (409)"

