  # ------------------------------------------------------------------
  # Rule 4: transitive_cascade — different triggers, depth >= 3 and >= 2
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: project_wrap_cascade_depth3
        grounds:
          - state_machines.Project.ACTIVE_to_WRAPPING
          - state_machines.DailiesPackage.PUBLISHED_to_REVOKED
          - state_machines.ReviewRound.OPEN_to_VOID
          - state_machines.ReviewNote.OPEN_to_VOID
        distinguishing_aspect: |
          Depth-3 cascade originating at Project wrap: Project -> DailiesPackage
          (PUBLISHED -> REVOKED) -> ReviewRound (OPEN targeting the package ->
          VOID) -> ReviewNote (OPEN within that round -> VOID). Each link is
          caused by the previous link, not directly by the wrap action.
        test_recipe:
          setup:
            - "Project P ACTIVE; one DailiesPackage DP PUBLISHED; one ReviewRound RR OPEN with target_ref_id == DP; one OPEN ReviewNote inside RR"
            - "All deliverables terminal, all review rounds except RR terminal, no open change lists"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /post-production/projects"
              payload: { title: "PW", client_code: "CL007", fps: 24, resolution_width: 1920, resolution_height: 1080, storage_quota_gb: 100, security_tier: "STANDARD" }
