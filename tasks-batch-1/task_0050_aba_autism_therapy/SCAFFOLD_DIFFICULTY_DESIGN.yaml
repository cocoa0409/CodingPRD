  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_authorization_cascades_cancel_session_then_frees_pool_depth3
        grounds:
          - state_machines.Authorization.ACTIVE_to_EXPIRED
          - state_machines.TherapySession.SCHEDULED_to_CANCELLED
          - calculations.authorization_pool_ledger
          - entities.Authorization.fields.reserved_direct_units
        distinguishing_aspect: |
          Depth-3 from the close trigger: (1) Authorization ACTIVE->EXPIRED;
          (2) that expiry cascade flips its SCHEDULED session to CANCELLED;
          (3) the CANCELLED transition's own side-effect releases the reservation,
          dropping Authorization.reserved_direct_units from 8 to 0 — each link caused
          by the prior, not by the original close call.
