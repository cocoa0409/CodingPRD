          assert:
            - "HTTP 403 with error_id ERR_UNAUTHORIZED"
            - "the response is NOT HTTP 409 and the error_id is NOT ERR_INVALID_DISPATCH_STATE, even though Dispatch.${dsp_id}.status == DRAFT is an illegal source state for settle"
            - "Dispatch.${dsp_id}.status == DRAFT and actual_reimbursement_cents == null, so nothing was settled"
            - "isolation control: the same settle call issued by the StoreManager whose X-User-ID is ${store_id} returns HTTP 409 ERR_INVALID_DISPATCH_STATE, proving priority 12 is implemented and was merely outranked here"

  - rule_id: boundary_precision_check
    instances:

      - name: drive_time_ceiling_is_inclusive_at_forty_and_edge_at_forty_one
        grounds:
          - calculations.grid_distance_miles
          - calculations.drive_time_estimate
          - calculations.zone_state_classification
          - entities.ZoneVersion.fields.max_drive_time_minutes
          - entities.ServiceAddress.fields.zone_state
        distinguishing_aspect: |
          max_drive_time_minutes is an INCLUSIVE ceiling and the drive-time model
          uses ceil() on the mileage term, so the boundary sits between two
          addresses 150 micro-degrees (0.01 mile) apart: 11.33 miles yields
          6 + ceil(33.99) = 40 which is IN_ZONE, and 11.34 miles yields
          6 + ceil(34.02) = 41 which is EDGE. A third address at 11.00 miles
          yields 39, one minute under. An implementation that treats the ceiling
          as exclusive, that rounds instead of taking the ceiling, or that uses
          floating-point degrees rather than integer micro-degrees, misclassifies
          exactly one of the three.
        test_recipe:
          setup:
            - "A store at (39000000, -84000000) with an ACTIVE ZoneVersion whose ring spans 38.90..39.20 N and 84.20..83.80 W, base_drive_minutes 6, minutes_per_mile 3, max_drive_time_minutes 40."
            - "Two addresses due north of the store already created: one at 11.00 grid miles (drive 39) and one at 11.34 grid miles (drive 41)."
            - "All three addresses are strictly inside the polygon, so only the drive-time term can move the classification."
          setup_api_calls:
            - call: "POST /store-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T09:00:00Z" }
              as: StoreManager
              as_user_id: "boot"
            - call: "POST /store-ops/stores"
              payload: { store_number: "7421", name: "Riverside", latitude_micro: 39000000, longitude_micro: -84000000, promise_minutes: 30, delivery_fee_cents: 399, cash_limit_cents: 5000, hot_bag_count: 4, max_stacked_stops: 3, handoff_minutes_per_stop: 6, dispatch_reset_buffer_minutes: 10, service_posture: "OPEN" }
              as: StoreManager
              as_user_id: "boot"
              captures: { store_id: $.data.id, store_v1: $.data.version }
            - call: "POST /store-ops/zone-versions"
              payload: { store_id: "${store_id}", polygon: [{ latitude_micro: 38900000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -84200000 }, { latitude_micro: 39200000, longitude_micro: -83800000 }, { latitude_micro: 38900000, longitude_micro: -83800000 }], effective_from: "2026-07-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", expected_store_version: "${store_v1}", max_drive_time_minutes: 40, base_drive_minutes: 6, minutes_per_mile: 3, peak_surcharge_minutes: 7, barrier_surcharge_minutes: 4 }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { zv1_id: $.data.id }
            - call: "POST /store-ops/zone-versions/${zv1_id}/activate"
              payload: {}
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "60 Under Ridge", latitude_micro: 39165000, longitude_micro: -84000000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_under_id: $.data.id }
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "77 Far Ridge", latitude_micro: 39170100, longitude_micro: -84000000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_over_id: $.data.id }
          trigger:
            - call: "POST /store-ops/service-addresses"
              payload: { store_id: "${store_id}", line1: "70 Ceiling Ridge", latitude_micro: 39169950, longitude_micro: -84000000, crosses_barrier: false }
              as: Dispatcher
              as_user_id: "disp-1"
              captures: { addr_at_id: $.data.id }
          assert:
            - "ServiceAddress.${addr_at_id}.grid_miles == 11.33"
            - "ServiceAddress.${addr_at_id}.drive_time_estimate_minutes == 40"
            - "ServiceAddress.${addr_at_id}.zone_state == IN_ZONE, the ceiling being inclusive"
            - "ServiceAddress.${addr_under_id}.grid_miles == 11.00 and drive_time_estimate_minutes == 39 and zone_state == IN_ZONE"
            - "ServiceAddress.${addr_over_id}.grid_miles == 11.34 and drive_time_estimate_minutes == 41 and zone_state == EDGE"
            - "all three carry evaluated_zone_version_number == 1 and effective_zone_state equal to their zone_state, no override being present"
            - "an order created on ${addr_at_id} may be zone-decision CLEARed, while an order on ${addr_over_id} CLEARed directly returns HTTP 422 ERR_ADDRESS_OUT_OF_AREA"

      - name: lock_requires_at_least_one_stop_at_the_zero_to_one_boundary
        grounds:
          - validations.priority_25
          - errors.ERR_DISPATCH_HAS_NO_STOPS
          - entities.Dispatch.fields.stop_count
          - state_machines.Dispatch.DRAFT_to_STACKED
          - state_machines.Dispatch.STACKED_to_LOCKED
        distinguishing_aspect: |
          The stop-count guard is a >= 1 boundary evaluated against a DERIVED
          aggregate, not against a stored counter: stop_count counts only stops
          in {PENDING, DELIVERED, REMADE}. The driver here is fully QUALIFIED and
          insured so no higher rung can mask the result, and the only difference
          between the rejected call and the accepted control is one stop. An
          implementation that permits an empty route, or that counts RELEASED
