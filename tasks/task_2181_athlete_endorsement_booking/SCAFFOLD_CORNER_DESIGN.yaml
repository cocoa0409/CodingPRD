          rationale: "Triggered there as the empty-billable-set boundary."
      - name: error_booking_overlap_on_create
        claim_type: violation_to_error
        grounds: ["errors[ERR_BOOKING_OVERLAP]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / athlete_booking_travel_buffer_closed_interval_conflict
          rationale: "Triggered there at the closed-interval touching boundary."
      - name: error_slot_capacity_exceeded_on_shoot
