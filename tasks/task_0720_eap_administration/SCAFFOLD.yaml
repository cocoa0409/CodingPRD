# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving clock ----
  - method: POST
    path: "/eap/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-03-01T00:00:00Z; before any call here the clock reads exactly that default and never falls back to wall-clock time."
    roles: [ProgramAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601"]

  # ---- EmployerContract ----
  - method: POST
    path: "/eap/contracts"
    description: "Create an employer contract"
    roles: [ProgramAdmin]
    code: 201
    input: [employer_name, sessions_per_issue, annual_session_cap, "crisis_sla_minutes?", session_rate_cents, annual_reimbursement_budget_cents, "reporting_min_cohort?"]
    output: EmployerContract
    side_effects: ["status=ACTIVE, sessions_committed=0, utilization_rate=0, version=1"]

  - method: GET
    path: "/eap/contracts"
    description: "List employer contracts (paginated)"
    roles: [ProgramAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EmployerContract[]
    side_effects: []

  - method: GET
    path: "/eap/contracts/{id}"
    description: "Get a contract (includes committed utilization_rate)"
    roles: [ProgramAdmin, Employer]
    code: 200
    input: []
    output: EmployerContract
    side_effects: []

  - method: GET
    path: "/eap/contracts/{id}/utilization"
    description: "Get contract utilization; basis=committed (default) or verified"
    roles: [ProgramAdmin, Employer]
    code: 200
    input: ["basis?"]
    output: EmployerContract
    side_effects: ["recomputes contract_utilization per basis"]

  - method: POST
    path: "/eap/contracts/{id}/suspend"
    description: "Suspend a contract (OCC-guarded); cascades revoke to authorized cases"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_contract_version]
    output: EmployerContract
    side_effects: ["status=SUSPENDED", "increments EmployerContract.version by 1", "revoke cascade to AUTHORIZED cases"]

  - method: POST
    path: "/eap/contracts/{id}/reinstate"
    description: "Reinstate a suspended contract (OCC-guarded)"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_contract_version]
    output: EmployerContract
    side_effects: ["status=ACTIVE", "increments EmployerContract.version by 1"]

  - method: POST
    path: "/eap/contracts/{id}/terminate"
    description: "Terminate a contract (OCC-guarded); same revoke cascade as suspend"
    roles: [ProgramAdmin]
    code: 200
    input: [expected_contract_version]
    output: EmployerContract
    side_effects: ["status=TERMINATED", "increments EmployerContract.version by 1", "revoke cascade"]

  - method: POST
    path: "/eap/contracts/{id}/reports"
    description: "Build an aggregate/anonymized UtilizationReport for a window"
    roles: [ProgramAdmin, Employer]
    code: 201
    input: [period_start, period_end]
    output: UtilizationReport
    side_effects: ["computes report_issue_breakdown with k-anonymity suppression"]

  - method: GET
    path: "/eap/reports"
    description: "List utilization reports; filter by contract_id"
    roles: [ProgramAdmin, Employer]
    code: 200
    input: ["contract_id?", "limit?", "offset?"]
    output: UtilizationReport[]
    side_effects: []

  - method: GET
    path: "/eap/reports/{id}"
    description: "Get a previously built utilization report"
    roles: [ProgramAdmin, Employer]
    code: 200
    input: []
    output: UtilizationReport
    side_effects: []

  # ---- BenefitPlan (child of contract; filtered-list reverse-reachability) ----
