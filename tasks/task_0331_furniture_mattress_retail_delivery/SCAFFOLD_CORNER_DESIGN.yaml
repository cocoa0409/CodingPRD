        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[stop-book-stale-route]"
          - "errors[ERR_STALE_VERSION]"
          - entities.DeliveryRoute.fields.version
        distinguishing_aspect: "Booking a second stop with a stale expected_route_version (the value observed before the first booking bumped route.version) returns ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["An OPEN route capacity 5; two confirmed orders. The first booking advances route.version; the second booking reuses the pre-first version."]
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
