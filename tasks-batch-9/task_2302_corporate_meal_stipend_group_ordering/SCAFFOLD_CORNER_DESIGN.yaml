      - name: employer_share_is_clamped_by_remaining_period_budget_and_then_refused
        claim_type: constraint_propagation
        grounds:
          - calculations.employer_employee_split
          - validations[priority=38]
          - errors.ERR_PERIOD_BUDGET_EXCEEDED
        distinguishing_aspect: "The nested min propagates the period constraint into the split: with only 1213 available the employer share would fall to 1213, strictly below min(covered_base 1787, cap 2500), so place is refused with 409 ERR_PERIOD_BUDGET_EXCEEDED instead of silently part-funding the meal."
