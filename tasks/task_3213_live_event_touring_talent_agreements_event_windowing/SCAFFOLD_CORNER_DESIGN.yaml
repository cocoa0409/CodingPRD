            - call: "POST /touring/streaming-partners"
              payload: { name: "RevCo", partner_code: "RV" }
              as: DistributionManager
              captures: { sp_id: $.data.id }
            - call: "POST /touring/territory-rights"
              payload: { partner_id: "${sp_id}", territory_code: "US", window_start_date: "2026-09-01", window_end_date: "2026-10-01", exclusive: false }
              as: DistributionManager
            - call: "POST /touring/distribution-windows"
              payload: { event_id: "${pe_id}", partner_id: "${sp_id}", territory_code: "US", window_type: "LIVE", opens_at: "2026-09-20T23:30:00Z", closes_at: "2026-09-21T04:00:00Z" }
              as: DistributionManager
              captures: { dw_id: $.data.id }
          trigger:
            - call: "POST /touring/distribution-windows/${dw_id}/revoke"
              payload: {}
              as: DistributionManager
            - call: "POST /touring/distribution-windows/${dw_id}/publish"
              payload: {}
              as: DistributionManager
              captures: { err: $.data.error_id }
          assert:
            - "revoke succeeds: DistributionWindow.${dw_id}.status == REVOKED"
            - "publish on REVOKED returns $.data.error_id == ERR_INVALID_STATE"

  # ==============================================================
  - section: errors
    instances:
      - name: error_unauthenticated_on_missing_headers
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role header fails at priority 1 before any routing or role check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /touring/talents"
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_UNAUTHENTICATED with HTTP 401"

      - name: error_reference_not_found_on_body_fk
        claim_type: violation_to_error
        grounds: ["errors[ERR_REFERENCE_NOT_FOUND]"]
        distinguishing_aspect: "A booking referencing a nonexistent talent_id fails existence-in-body (404 ERR_REFERENCE_NOT_FOUND), distinct from path-level ERR_NOT_FOUND."
        test_recipe:
          setup: ["one SCHEDULED event exists"]
          setup_api_calls:
            - call: "POST /touring/arenas"
              payload: { name: "Ref Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "RE", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { ev_id: $.data.id }
          trigger:
            - call: "POST /touring/bookings"
              payload: { event_id: "${ev_id}", talent_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", segment_label: "MATCH_1" }
              as: TourPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_REFERENCE_NOT_FOUND with HTTP 404"

      - name: error_stale_version_on_agreement_activate
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[agreement-activate-stale-agreement]"]
        distinguishing_aspect: "OCC: activating with a version one behind the agreement's current version returns 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["talent T; DRAFT agreement A1 (version 1)"]
          setup_api_calls:
            - call: "POST /touring/talents"
              payload: { ring_name: "Stale Stan", legal_name: "Stan Legal", contractor_status: "INDEPENDENT_CONTRACTOR" }
              as: TalentRelations
              captures: { t_id: $.data.id }
            - call: "POST /touring/agreements"
              payload: { talent_id: "${t_id}", start_date: "2026-01-01", end_date: "2027-01-01", downside_guarantee_cents: 100000, royalty_rate_bp: 2000, likeness_rights_granted: false, min_appearances_per_quarter: 0 }
              as: ContractAdmin
              captures: { ag_id: $.data.id, ag_v: $.data.version }
            - call: "PATCH /touring/agreements/${ag_id}"
              payload: {}
              as: ContractAdmin
              captures: { ag_v2: $.data.version }
          trigger:
            - call: "POST /touring/agreements/${ag_id}/activate"
              payload: { expected_agreement_version: "${ag_v2} - 1" }
              as: ContractAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_STALE_VERSION with HTTP 412 (the no-op PATCH bumped the version, making the pre-PATCH view stale)"

      - name: error_stale_version_on_event_lock
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[event-lock-stale-event]"]
        distinguishing_aspect: "OCC on Event: locking with the pre-booking version (a booking side effect has advanced Event.version... pinned: a GET between capture and lock returns the current version; using version-1 triggers 412)."
        test_recipe:
          setup: ["SCHEDULED event EV (mins 0)"]
          setup_api_calls:
            - call: "POST /touring/arenas"
              payload: { name: "OCC Arena", city: "Orlando", country_code: "US", capacity: 1000, merch_booths: 0, timezone: "America/New_York" }
              as: TourPlanner
              captures: { ar_id: $.data.id }
            - call: "POST /touring/events"
              payload: { name: "OCCE", event_type: "HOUSE_SHOW", arena_id: "${ar_id}", event_date: "2026-09-05", start_time: "19:00", end_time: "21:00", tour_country_code: "US", roster_min_main: 0, roster_min_total: 0 }
              as: TourPlanner
              captures: { ev_id: $.data.id, ev_v: $.data.version }
          trigger:
            - call: "POST /touring/events/${ev_id}/lock"
              payload: { expected_event_version: "${ev_v} - 1" }
              as: TourPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response $.data.error_id == ERR_STALE_VERSION with HTTP 412 (deliberately stale expression ${ev_v} - 1)"

