scenario: |
  Government Contracting & Federal Acquisition (SAM.gov / FAR): solicitation (RFP/RFQ/IFB) & opportunity,
  registration (UEI/SAM) & set-aside (8(a)/SDVOSB), proposal & evaluation factors, award & contract type
  (FFP/CPFF), modification & option year, CLIN/invoice (WAWF), CPARS performance, protest/closeout

domain_name: federal-acquisition
api_prefix: /

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions          # logical clock gates submission deadlines & option-exercise windows

  entity_topology: hybrid
  # Solicitation -> Proposal is a parent/child tree; Award/Contract/CLIN/Invoice/Modification/Protest/
  # CPARSReport form a second tree rooted at Award; VendorRegistration & EvaluationFactor are flat peers
  # referenced by FK across aggregate boundaries.

  state_machine_shape: branching
  # Solicitation: linear-with-revert + branching close. Proposal: branching fork-join (evaluation
  # accept/reject) + revision cycle. Award: branching (award OR cancel-after-protest). Protest: cyclic
  # revision-style sustain/deny/withdraw. Contract has parallel dimensions (lifecycle x funding posture).

  relationship_patterns:
    - one_to_many        # Solicitation 1..* Proposal ; Award 1..* CLIN ; CLIN 1..* Invoice
    - cross_aggregate    # Proposal.vendor_id -> VendorRegistration ; FactorScore -> EvaluationFactor
    - many_to_many       # FactorScore is the junction of Proposal x EvaluationFactor

  role_model: segregation_of_duties
  # The Contracting Officer who awards a contract MUST NOT be the same operator who chairs the
  # evaluation that produced the winning proposal (FAR-style separation). Vendor self-serves its
  # own registration & proposals; Auditor is read-only.

  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: VendorRegistration
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Vendor legal business name.
      - name: uei
        type: string
        source: input
        description: 12-character Unique Entity Identifier; unique across all VendorRegistration rows with sam_status in {ACTIVE, EXPIRED}.
        constraints: exactly 12 alphanumeric chars; case-insensitive uniqueness over non-DRAFT registrations
      - name: employee_count
        type: integer
        source: input
        description: Total employees, used for small-business size determination.
        constraints: ">= 0"
      - name: set_aside_certifications
        type: array
        source: input
        description: "Subset of {EIGHT_A, SDVOSB, WOSB, HUBZONE}; certifications the vendor holds."
        default: []
      - name: sam_status
        type: enum
        source: computed
        description: "Registration lifecycle status. One of {DRAFT, ACTIVE, EXPIRED, EXCLUDED}."
        default: DRAFT
        constraints: set only by state machine
      - name: registration_expires_at
        type: datetime
        source: input
        description: SAM registration expiry instant (ISO 8601 UTC); compared to logical clock to gate eligibility.
      - name: performance_index
        type: number
        source: computed
        description: Mean CPARS numeric rating across this vendor's contracts whose status in {ACTIVE, CLOSED}; null when none. See calc vendor_performance_index.
        default: null
        constraints: 2 decimal places, round_half_up

  - name: EvaluationFactor
    parent: null
    common_fields: false
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: FK -> Solicitation.id; the solicitation this factor scores.
      - name: name
        type: string
        source: input
        description: Factor label, e.g. "Technical Approach".
      - name: kind
        type: enum
        source: input
        description: "One of {TECHNICAL, PAST_PERFORMANCE, PRICE}. Exactly one PRICE factor per solicitation."
      - name: weight
        type: number
        source: input
        description: Relative weight in [0,1] used by tradeoff scoring; PRICE factor weight is ignored by merit scoring.
        constraints: 0 <= weight <= 1; sum of non-PRICE weights per solicitation must equal 1.0 at solicitation OPEN

  - name: Solicitation
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: Solicitation title.
      - name: vehicle_type
        type: enum
        source: input
        description: "One of {RFP, RFQ, IFB}. RFP uses tradeoff; RFQ/IFB use LPTA evaluation method."
      - name: set_aside_type
        type: enum
        source: input
        description: "One of {NONE, SMALL_BUSINESS, EIGHT_A, SDVOSB, WOSB, HUBZONE}."
        default: NONE
      - name: naics_size_threshold
        type: integer
        source: input
        description: Employee size standard; a vendor is small-business-eligible when employee_count <= this value (inclusive).
        constraints: ">= 1"
      - name: evaluation_method
        type: enum
        source: computed
        description: "Derived from vehicle_type: RFP -> TRADEOFF, RFQ/IFB -> LPTA. One of {TRADEOFF, LPTA}."
      - name: open_at
        type: datetime
        source: input
        description: Instant the solicitation opens for proposals (ISO 8601 UTC).
      - name: close_at
        type: datetime
        source: input
        description: Proposal submission deadline (ISO 8601 UTC); submissions accepted when submitted clock <= close_at (inclusive).
        constraints: close_at > open_at
      - name: status
        type: enum
        source: computed
        description: "Lifecycle. One of {DRAFT, OPEN, AMENDED, CLOSED, EVALUATED, AWARDED, CANCELLED}."
        default: DRAFT
      - name: amendment_count
        type: integer
        source: computed
        description: Number of amendments issued; incremented on each AMEND transition.
        default: 0
      - name: winning_proposal_id
        type: string
        source: computed
        description: FK -> Proposal.id; set when an award is made from this solicitation; null until then.
        default: null

  - name: Proposal
    parent: Solicitation
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: FK -> Solicitation.id; the solicitation being responded to.
      - name: vendor_id
        type: string
        source: input
        description: FK -> VendorRegistration.id; the vendor submitting this proposal.
      - name: total_price_cents
        type: integer
        source: input
        description: Total proposed price in cents.
        constraints: ">= 0"
      - name: pinned_vendor_version
        type: integer
        source: computed
        description: VendorRegistration.version captured at SUBMIT time; used to detect stale registration at award.
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lifecycle. One of {DRAFT, SUBMITTED, UNDER_EVALUATION, ACCEPTABLE, UNACCEPTABLE, AWARDED, REJECTED, WITHDRAWN}."
        default: DRAFT
      - name: merit_score
        type: number
        source: computed
        description: Weighted technical-merit score over non-PRICE FactorScores; null until evaluated. See calc proposal_merit_score.
        default: null
        constraints: 2 decimal places, round_half_up
      - name: value_score
        type: number
        source: computed
        description: Combined tradeoff value score (merit + normalized price); null for LPTA or until evaluated. See calc proposal_value_score.
        default: null
        constraints: 2 decimal places, round_half_up

  - name: FactorScore
    parent: Proposal
    common_fields: true
    fields:
      - name: proposal_id
        type: string
        source: input
        description: FK -> Proposal.id; the proposal being scored.
      - name: factor_id
        type: string
        source: input
        description: FK -> EvaluationFactor.id; the factor this raw score applies to.
      - name: raw_score
        type: integer
        source: input
        description: Evaluator raw score in [0,100] for this factor.
        constraints: 0 <= raw_score <= 100

  - name: Award
    parent: Solicitation
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: FK -> Solicitation.id; the solicitation awarded.
      - name: proposal_id
        type: string
        source: input
        description: FK -> Proposal.id; the winning proposal.
      - name: awarded_by_user_id
        type: string
        source: system
        description: Operator id (X-User-ID) of the ContractingOfficer who made the award; recorded for segregation-of-duties checks.
      - name: status
        type: enum
        source: computed
        description: "Lifecycle. One of {AWARDED, PROTESTED, VACATED}."
        default: AWARDED

  - name: Contract
    parent: Award
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: FK -> Award.id; the award this contract realizes.
      - name: vendor_id
        type: string
        source: input
        description: FK -> VendorRegistration.id; the awardee vendor (copied from the winning proposal).
      - name: contract_type
        type: enum
        source: input
        description: "One of {FFP, CPFF}. FFP invoices per delivered CLIN units; CPFF invoices allowable cost plus a proportional share of fixed_fee_cents."
      - name: total_estimated_cost_cents
        type: integer
        source: input
        description: CPFF Total Estimated Cost (TEC) used as the fee-proration denominator; required for CPFF, ignored for FFP.
        default: null
        constraints: "> 0 when contract_type == CPFF"
      - name: fixed_fee_cents
        type: integer
        source: input
        description: CPFF fixed fee billed proportionally across invoices; required for CPFF, ignored for FFP.
        default: null
        constraints: ">= 0 when contract_type == CPFF"
      - name: base_value_cents
        type: integer
        source: input
        description: Funded base-period contract ceiling in cents.
        constraints: ">= 0"
      - name: obligated_amount_cents
        type: integer
        source: computed
        description: Current obligated ceiling = base_value_cents + sum of exercised option_value_cents + sum of approved modification delta_cents. See calc obligated_amount.
        default: 0
      - name: lifecycle_status
        type: enum
        source: computed
        description: "Lifecycle dimension. One of {ACTIVE, COMPLETE, CLOSED, TERMINATED}."
        default: ACTIVE
      - name: funding_posture
        type: enum
        source: computed
        description: "Independent funding dimension. One of {WITHIN_CEILING, CEILING_REACHED}. CEILING_REACHED when cumulative approved invoice amount == obligated_amount_cents; blocks new option exercise."
        default: WITHIN_CEILING
      - name: cumulative_invoiced_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this contract's invoices whose status == APPROVED. See calc cumulative_invoiced.
        default: 0

  - name: ContractLineItem
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the parent contract (CLIN).
      - name: clin_number
        type: string
        source: input
        description: CLIN identifier, e.g. "0001"; unique within a contract.
        constraints: unique per contract_id
      - name: unit_price_cents
        type: integer
        source: input
        description: Firm unit price in cents (FFP only; required when contract_type == FFP).
        default: null
        constraints: ">= 0"
      - name: funded_qty
        type: integer
        source: input
        description: Funded quantity of units for this CLIN (FFP).
        constraints: ">= 0"
      - name: delivered_qty
        type: integer
        source: computed
        description: Cumulative delivered units across this CLIN's APPROVED invoices.
        default: 0

  - name: Invoice
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract being invoiced (WAWF submission).
      - name: clin_id
        type: string
        source: input
        description: FK -> ContractLineItem.id; the CLIN billed (required for FFP invoices, null for CPFF).
        default: null
      - name: invoiced_qty
        type: integer
        source: input
        description: Units delivered on this invoice (FFP only).
        default: null
        constraints: ">= 0"
      - name: allowable_cost_cents
        type: integer
        source: input
        description: Total allowable cost claimed on this invoice (CPFF only; the sum the vendor already netted across cost line items).
        default: null
        constraints: ">= 0"
      - name: amount_cents
        type: integer
        source: computed
        description: Computed payable amount; FFP = unit_price * invoiced_qty; CPFF = allowable_cost + proportional fee. See calc invoice_amount.
        default: 0
      - name: fee_portion_cents
        type: integer
        source: computed
        description: CPFF proportional fee component of amount_cents; 0 for FFP. See calc invoice_amount.
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Lifecycle. One of {SUBMITTED, APPROVED, REJECTED}."
        default: SUBMITTED

  - name: Modification
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract being modified.
      - name: mod_type
        type: enum
        source: input
        description: "One of {FUNDING, OPTION_EXERCISE, ADMINISTRATIVE}."
      - name: delta_cents
        type: integer
        source: input
        description: Funding change for FUNDING/OPTION_EXERCISE mods (positive adds obligation); 0 for ADMINISTRATIVE.
        default: 0
      - name: option_value_cents
        type: integer
        source: input
        description: Option-period value added when mod_type == OPTION_EXERCISE; ignored otherwise.
        default: 0
      - name: option_window_close_at
        type: datetime
        source: input
        description: Latest instant an OPTION_EXERCISE may be approved (ISO 8601 UTC); approval after this is rejected.
        default: null
      - name: status
        type: enum
        source: computed
        description: "Lifecycle. One of {PROPOSED, APPROVED, REJECTED}."
        default: PROPOSED

  - name: Protest
    parent: Award
    common_fields: true
    fields:
      - name: award_id
        type: string
        source: input
        description: FK -> Award.id; the award being protested.
      - name: protester_vendor_id
        type: string
        source: input
        description: FK -> VendorRegistration.id; the vendor filing the protest (a non-winning offeror).
      - name: grounds
        type: string
        source: input
        description: Narrative grounds for the protest.
      - name: status
        type: enum
        source: computed
        description: "Lifecycle. One of {FILED, UNDER_REVIEW, SUSTAINED, DENIED, WITHDRAWN}."
        default: FILED

  - name: CparsReport
    parent: Contract
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: FK -> Contract.id; the contract being rated.
      - name: rating
        type: enum
        source: input
        description: "One of {EXCEPTIONAL, VERY_GOOD, SATISFACTORY, MARGINAL, UNSATISFACTORY}."
      - name: rating_value
        type: integer
        source: computed
        description: "Numeric mapping of rating: EXCEPTIONAL=100, VERY_GOOD=85, SATISFACTORY=70, MARGINAL=50, UNSATISFACTORY=0. Feeds vendor_performance_index."

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: VendorRegistration
    initial_state: DRAFT
    terminal_states: [EXCLUDED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /vendors/{id}/activate"
        actor: Vendor
        preconditions:
          - "uei is exactly 12 alphanumeric chars"
          - "no other VendorRegistration with the same uei (case-insensitive) has sam_status in {ACTIVE, EXPIRED}"
          - "registration_expires_at > current logical clock"
        side_effects:
          - "set sam_status = ACTIVE"
          - "increments VendorRegistration.version by 1"
      - from: ACTIVE
        to: EXPIRED
        trigger: "POST /vendors/{id}/expire"
        actor: ContractingOfficer
        preconditions: []
        side_effects:
          - "set sam_status = EXPIRED"
          - "increments VendorRegistration.version by 1"
      - from: EXPIRED
        to: ACTIVE
        trigger: "POST /vendors/{id}/activate"
        actor: Vendor
        preconditions:
          - "registration_expires_at > current logical clock (vendor supplied a renewed expiry via the activate body)"
          - "no OTHER VendorRegistration with same uei has sam_status in {ACTIVE, EXPIRED}"
        side_effects:
          - "set sam_status = ACTIVE"
          - "increments VendorRegistration.version by 1"
        note: "Revival cycle EXPIRED->ACTIVE makes this a non-linear (cyclic) machine."
      - from: ACTIVE
        to: EXCLUDED
        trigger: "POST /vendors/{id}/exclude"
        actor: ContractingOfficer
        preconditions: []
        side_effects:
          - "set sam_status = EXCLUDED"
          - "increments VendorRegistration.version by 1"
      - from: EXPIRED
        to: EXCLUDED
        trigger: "POST /vendors/{id}/exclude"
        actor: ContractingOfficer
        preconditions: []
        side_effects:
          - "set sam_status = EXCLUDED"
          - "increments VendorRegistration.version by 1"

  - entity: Solicitation
    initial_state: DRAFT
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /solicitations/{id}/open"
        actor: ContractingOfficer
        preconditions:
          - "at least one EvaluationFactor exists for this solicitation"
          - "exactly one EvaluationFactor with kind == PRICE exists"
          - "sum of weight over non-PRICE EvaluationFactors == 1.0"
          - "open_at <= current logical clock"
        side_effects:
          - "set status = OPEN"
          - "set evaluation_method = TRADEOFF if vehicle_type == RFP else LPTA"
          - "increments Solicitation.version by 1"
      - from: OPEN
        to: AMENDED
        trigger: "POST /solicitations/{id}/amend"
        actor: ContractingOfficer
        preconditions:
          - "current logical clock <= close_at"
        side_effects:
          - "set status = AMENDED"
          - "increment amendment_count by 1"
          - "increments Solicitation.version by 1"
      - from: AMENDED
        to: OPEN
        trigger: "POST /solicitations/{id}/open"
        actor: ContractingOfficer
        preconditions:
          - "current logical clock <= close_at"
        side_effects:
          - "set status = OPEN"
          - "increments Solicitation.version by 1"
        note: "OPEN<->AMENDED revision loop makes this a cyclic, non-linear machine."
      - from: OPEN
        to: CLOSED
        trigger: "POST /solicitations/{id}/close"
        actor: ContractingOfficer
        preconditions:
          - "current logical clock >= close_at"
        side_effects:
          - "set status = CLOSED"
          - "every Proposal of this solicitation in status SUBMITTED stays SUBMITTED (eligible for evaluation)"
          - "increments Solicitation.version by 1"
      - from: AMENDED
        to: CLOSED
        trigger: "POST /solicitations/{id}/close"
        actor: ContractingOfficer
        preconditions:
          - "current logical clock >= close_at"
        side_effects:
          - "set status = CLOSED"
          - "increments Solicitation.version by 1"
      - from: CLOSED
        to: EVALUATED
        trigger: "POST /solicitations/{id}/finalize-evaluation"
        actor: ContractingOfficer
        preconditions:
          - "every Proposal in status SUBMITTED has been evaluated (moved to ACCEPTABLE or UNACCEPTABLE)"
          - "at least one Proposal in status ACCEPTABLE exists"
        side_effects:
          - "set status = EVALUATED"
          - "record the chairing operator id as the evaluation chair (used by segregation-of-duties at award)"
          - "increments Solicitation.version by 1"
      - from: EVALUATED
        to: AWARDED
        trigger: "POST /awards (system, on award creation)"
        actor: system
        preconditions:
          - "an Award referencing this solicitation has been created"
        side_effects:
          - "set status = AWARDED"
          - "set winning_proposal_id = the awarded Proposal.id"
          - "increments Solicitation.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /solicitations/{id}/cancel"
        actor: ContractingOfficer
        preconditions: []
        side_effects:
          - "set status = CANCELLED"
          - "increments Solicitation.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /solicitations/{id}/cancel"
        actor: ContractingOfficer
        preconditions: []
        side_effects:
          - "set status = CANCELLED"
          - "every Proposal in status {SUBMITTED, UNDER_EVALUATION, ACCEPTABLE, UNACCEPTABLE} cascades to WITHDRAWN"
          - "increments Solicitation.version by 1"

  - entity: Proposal
    initial_state: DRAFT
    terminal_states: [AWARDED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /proposals/{id}/submit"
        actor: Vendor
        preconditions:
          - "parent Solicitation.status in {OPEN, AMENDED}"
          - "current logical clock <= parent Solicitation.close_at"
          - "the vendor's VendorRegistration.sam_status == ACTIVE and registration_expires_at > current logical clock"
          - "if Solicitation.set_aside_type == SMALL_BUSINESS: vendor.employee_count <= Solicitation.naics_size_threshold"
          - "if Solicitation.set_aside_type in {EIGHT_A, SDVOSB, WOSB, HUBZONE}: that certification is present in vendor.set_aside_certifications"
          - "a FactorScore exists for every EvaluationFactor of the solicitation"
        side_effects:
          - "set status = SUBMITTED"
          - "set pinned_vendor_version = the vendor's current VendorRegistration.version"
          - "increments Proposal.version by 1"
      - from: SUBMITTED
        to: UNDER_EVALUATION
        trigger: "POST /proposals/{id}/begin-evaluation"
        actor: ContractingOfficer
        preconditions:
          - "parent Solicitation.status == CLOSED"
        side_effects:
          - "set status = UNDER_EVALUATION"
          - "increments Proposal.version by 1"
      - from: UNDER_EVALUATION
        to: ACCEPTABLE
        trigger: "POST /proposals/{id}/score"
        actor: ContractingOfficer
        preconditions:
          - "every non-PRICE FactorScore.raw_score >= 70"
        side_effects:
          - "set status = ACCEPTABLE"
          - "recompute merit_score (calc proposal_merit_score)"
          - "recompute value_score when evaluation_method == TRADEOFF (calc proposal_value_score)"
          - "increments Proposal.version by 1"
      - from: UNDER_EVALUATION
        to: UNACCEPTABLE
        trigger: "POST /proposals/{id}/score"
        actor: ContractingOfficer
        preconditions:
          - "at least one non-PRICE FactorScore.raw_score < 70"
        side_effects:
          - "set status = UNACCEPTABLE"
          - "set merit_score = null, value_score = null"
          - "increments Proposal.version by 1"
        note: "UNDER_EVALUATION forks to ACCEPTABLE or UNACCEPTABLE with divergent side-effect sets (fork-join)."
      - from: UNACCEPTABLE
        to: UNDER_EVALUATION
        trigger: "POST /proposals/{id}/begin-evaluation"
        actor: ContractingOfficer
        preconditions:
          - "parent Solicitation.status == CLOSED"
          - "FactorScores have been revised since the prior scoring (revision loop)"
        side_effects:
          - "set status = UNDER_EVALUATION"
          - "increments Proposal.version by 1"
        note: "Re-evaluation loop UNACCEPTABLE->UNDER_EVALUATION confirms a cyclic (non-linear) shape."
      - from: ACCEPTABLE
        to: AWARDED
        trigger: "POST /awards (system, on award creation)"
        actor: system
        preconditions:
          - "this Proposal is the one named in the Award"
          - "Solicitation.status == EVALUATED"
        side_effects:
          - "set status = AWARDED"
          - "every OTHER Proposal of the solicitation in status {ACCEPTABLE, UNACCEPTABLE, SUBMITTED} cascades to REJECTED"
          - "increments Proposal.version by 1"

  - entity: Award
    initial_state: AWARDED
    terminal_states: [VACATED]
    transitions:
      - from: AWARDED
        to: PROTESTED
        trigger: "POST /protests (system, on protest filing)"
        actor: system
        preconditions:
          - "a Protest in status FILED references this Award"
          - "this Award's Contract (if any) lifecycle_status == ACTIVE"
        side_effects:
          - "set status = PROTESTED"
          - "increments Award.version by 1"
      - from: PROTESTED
        to: AWARDED
        trigger: "POST /protests/{id}/resolve (outcome DENIED or WITHDRAWN)"
        actor: ContractingOfficer
        preconditions:
          - "the only open Protest on this Award is resolving to DENIED or WITHDRAWN"
        side_effects:
          - "set status = AWARDED"
          - "increments Award.version by 1"
      - from: PROTESTED
        to: VACATED
        trigger: "POST /protests/{id}/resolve (outcome SUSTAINED)"
        actor: ContractingOfficer
        preconditions:
          - "a Protest on this Award is resolving to SUSTAINED"
        side_effects:
          - "set status = VACATED"
          - "the awarded Proposal reverts ACCEPTABLE; previously REJECTED siblings revert to ACCEPTABLE/UNACCEPTABLE per their merit; Solicitation.winning_proposal_id cleared; Solicitation.status reverts EVALUATED"
          - "the Award's Contract (if created) lifecycle_status -> TERMINATED and its CLINs/invoices freeze"
          - "increments Award.version by 1"
        note: "AWARDED<->PROTESTED is a cyclic dimension; SUSTAINED forks to VACATED with a deep compensation cascade."

  - entity: Contract
    initial_state: ACTIVE
    terminal_states: [CLOSED, TERMINATED]
    transitions:
      - from: ACTIVE
        to: COMPLETE
        trigger: "POST /contracts/{id}/complete"
        actor: ContractingOfficer
        preconditions:
          - "no Invoice in status SUBMITTED remains"
          - "parent Award.status == AWARDED (not PROTESTED/VACATED)"
        side_effects:
          - "set lifecycle_status = COMPLETE"
          - "increments Contract.version by 1"
      - from: COMPLETE
        to: CLOSED
        trigger: "POST /contracts/{id}/closeout"
        actor: ContractingOfficer
        preconditions:
          - "at least one CparsReport exists for this contract"
          - "parent Award.status == AWARDED"
        side_effects:
          - "set lifecycle_status = CLOSED"
          - "recompute awardee VendorRegistration.performance_index (calc vendor_performance_index)"
          - "increments Contract.version by 1"
      - from: ACTIVE
        to: TERMINATED
        trigger: "system, on Protest SUSTAINED on the parent Award"
        actor: system
        preconditions:
          - "parent Award transitioned to VACATED"
        side_effects:
          - "set lifecycle_status = TERMINATED"
          - "increments Contract.version by 1"
    note: "Contract carries two parallel dimensions: lifecycle_status (above) and funding_posture (WITHIN_CEILING/CEILING_REACHED), evolving independently."

  - entity: Invoice
    initial_state: SUBMITTED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /invoices/{id}/approve"
        actor: ContractingOfficer
        preconditions:
          - "parent Contract.lifecycle_status == ACTIVE"
          - "parent Award.status == AWARDED (not PROTESTED)"
          - "for FFP: ContractLineItem.delivered_qty + invoice.invoiced_qty <= ContractLineItem.funded_qty"
          - "Contract.cumulative_invoiced_cents + this invoice.amount_cents <= Contract.obligated_amount_cents"
        side_effects:
          - "set status = APPROVED"
          - "recompute Contract.cumulative_invoiced_cents (calc cumulative_invoiced)"
          - "for FFP: ContractLineItem.delivered_qty += invoice.invoiced_qty"
          - "if Contract.cumulative_invoiced_cents == Contract.obligated_amount_cents: set Contract.funding_posture = CEILING_REACHED"
          - "increments Invoice.version by 1; increments Contract.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /invoices/{id}/reject"
        actor: ContractingOfficer
        preconditions: []
        side_effects:
          - "set status = REJECTED"
          - "increments Invoice.version by 1"

  - entity: Modification
    initial_state: PROPOSED
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: PROPOSED
        to: APPROVED
        trigger: "POST /modifications/{id}/approve"
        actor: ContractingOfficer
        preconditions:
          - "parent Contract.lifecycle_status == ACTIVE"
          - "parent Award.status == AWARDED"
          - "if mod_type == OPTION_EXERCISE: Contract.funding_posture == WITHIN_CEILING"
          - "if mod_type == OPTION_EXERCISE: current logical clock <= option_window_close_at"
        side_effects:
          - "set status = APPROVED"
          - "recompute Contract.obligated_amount_cents (calc obligated_amount)"
          - "increments Modification.version by 1; increments Contract.version by 1"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /modifications/{id}/reject"
        actor: ContractingOfficer
        preconditions: []
        side_effects:
          - "set status = REJECTED"
          - "increments Modification.version by 1"

  - entity: Protest
    initial_state: FILED
    terminal_states: [SUSTAINED, DENIED, WITHDRAWN]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /protests/{id}/begin-review"
        actor: ContractingOfficer
        preconditions:
          - "parent Award.status == PROTESTED"
        side_effects:
          - "set status = UNDER_REVIEW"
          - "increments Protest.version by 1"
      - from: UNDER_REVIEW
        to: SUSTAINED
        trigger: "POST /protests/{id}/resolve (outcome SUSTAINED)"
        actor: ContractingOfficer
        preconditions: []
        side_effects:
          - "set status = SUSTAINED"
          - "parent Award -> VACATED (triggers award compensation cascade)"
          - "increments Protest.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /protests/{id}/resolve (outcome DENIED)"
        actor: ContractingOfficer
        preconditions: []
        side_effects:
          - "set status = DENIED"
          - "parent Award -> AWARDED (restored)"
          - "increments Protest.version by 1"
      - from: FILED
        to: WITHDRAWN
        trigger: "POST /protests/{id}/withdraw"
        actor: Vendor
        preconditions:
          - "acting vendor == protester_vendor_id"
        side_effects:
          - "set status = WITHDRAWN"
          - "parent Award -> AWARDED (restored)"
          - "increments Protest.version by 1"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: award-create-stale-solicitation
    parent_entity: Solicitation
    write_endpoint: "POST /awards"
    occ_field: "expected_solicitation_version"
    description: |
      Creating an Award against a Solicitation whose version has advanced since the
      client last observed it is rejected. A second award attempt that still carries
      the pre-finalize-evaluation version is operating on a stale view (the solicitation
      may have just been amended, re-finalized, or already awarded), so the create is
      rejected on the stale version rather than on a state read.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: invoice-create-stale-contract
    parent_entity: Contract
    write_endpoint: "POST /invoices"
    occ_field: "expected_contract_version"
    description: |
      Creating an Invoice against a Contract whose version has advanced since the client
      last read it is rejected. Because invoice approvals and modification approvals each
      bump Contract.version (cumulative_invoiced and obligated_amount recomputes), a creator
      working from a superseded contract view is rejected on the stale version.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: proposal_merit_score
    trigger: "Proposal UNDER_EVALUATION -> ACCEPTABLE (POST /proposals/{id}/score)"
    algorithm: weighted_scoring
    formula: |
      non_price = [fs for fs in FactorScores(proposal)
                   if EvaluationFactor(fs.factor_id).kind != PRICE]
      # weights of non-PRICE factors sum to 1.0 (enforced at solicitation OPEN)
      raw = sum( fs.raw_score * EvaluationFactor(fs.factor_id).weight for fs in non_price )
      merit_score = clamp(round_half_up(raw, 2), 0, 100)
    input_set: "FactorScores of the proposal whose factor.kind != PRICE; PRICE factor excluded."
    constants:
      ACCEPTABILITY_MIN: 70
    precision: "2 decimal places, round_half_up"
    variants:
      - name: tradeoff_merit
        when: "Solicitation.evaluation_method == TRADEOFF (RFP)"
        difference: "merit_score feeds proposal_value_score; full weighted sum retained."
      - name: lpta_merit
        when: "Solicitation.evaluation_method == LPTA (RFQ/IFB)"
        difference: "merit_score is computed but the award selector ignores it: LPTA picks the lowest total_price_cents among ACCEPTABLE proposals, not the highest merit."

  - name: proposal_value_score
    trigger: "Proposal UNDER_EVALUATION -> ACCEPTABLE on a TRADEOFF solicitation"
    algorithm: weighted_scoring
    formula: |
      # Only for evaluation_method == TRADEOFF.
      min_price = min(p.total_price_cents for p in ACCEPTABLE_or_being_scored proposals of solicitation)
      price_norm = round_half_up( (min_price / this.total_price_cents) * 100, 2 )
      value_score = round_half_up( merit_score * MERIT_WEIGHT + price_norm * PRICE_WEIGHT, 2 )
    input_set: "ACCEPTABLE proposals of the solicitation supply min_price; the scored proposal supplies merit_score and its own total_price_cents."
    constants:
      MERIT_WEIGHT: 0.80
      PRICE_WEIGHT: 0.20
    precision: "2 decimal places, round_half_up. Evaluation order pinned: compute merit_score (round to 2dp) FIRST, then price_norm (round to 2dp), THEN combine and round once. This is a circular-looking dependency made well-defined by the pinned order."
    variants:
      - name: value_score_present
        when: "evaluation_method == TRADEOFF"
        difference: "value_score is the award ranking key (highest wins)."
      - name: value_score_absent
        when: "evaluation_method == LPTA"
        difference: "value_score stays null; ranking uses total_price_cents ascending instead."

  - name: invoice_amount
    trigger: "Invoice creation (POST /invoices) and recomputed on approve"
    algorithm: tiered_pricing
    formula: |
      if Contract.contract_type == FFP:
          amount_cents = ContractLineItem(clin_id).unit_price_cents * invoice.invoiced_qty
          fee_portion_cents = 0
      else:  # CPFF — fee is computed on the SUMMED allowable_cost (sum-then-fee), rounded ONCE.
          ratio = Contract.fixed_fee_cents / Contract.total_estimated_cost_cents
          fee_portion_cents = round_half_up( Contract.fixed_fee_cents
                                             * (invoice.allowable_cost_cents / Contract.total_estimated_cost_cents) )
          amount_cents = invoice.allowable_cost_cents + fee_portion_cents
    input_set: "Single invoice. CPFF uses contract-level fixed_fee_cents and total_estimated_cost_cents."
    constants: {}
    precision: "Integer cents, round_half_up. CPFF rounding order is PINNED: compute the fee on the already-summed allowable_cost_cents and round once — do NOT round a per-cost-line fee and sum. 'round(sum)/sum-then-fee' vs 'sum of per-line rounded fees' diverge (e.g. ratio 1/15 over three $1.00 lines yields 20 vs 21 cents)."
    variants:
      - name: ffp_amount
        when: "contract_type == FFP"
        difference: "amount = unit_price * invoiced_qty; CLIN funded_qty caps cumulative delivery; fee_portion = 0."
      - name: cpff_amount
        when: "contract_type == CPFF"
        difference: "amount = allowable_cost + proportional fixed fee; no per-CLIN qty cap; obligation ceiling caps cumulative amount."

  - name: vendor_performance_index
    trigger: "Contract COMPLETE -> CLOSED (closeout); recomputed on each closeout"
    algorithm: aggregation
    formula: |
      contracts = [c for c in Contracts where c.vendor_id == vendor.id
                   and c.lifecycle_status in {ACTIVE, CLOSED}]   # excludes TERMINATED, COMPLETE-only
      reports = [r for c in contracts for r in CparsReports(c)]
      if reports == []: performance_index = null
      else: performance_index = round_half_up( mean(r.rating_value for r in reports), 2 )
    input_set: "CparsReports of contracts owned by the vendor whose lifecycle_status in {ACTIVE, CLOSED}; TERMINATED contracts excluded so a vacated award does not pollute the index."
    constants:
      EXCEPTIONAL: 100
      VERY_GOOD: 85
      SATISFACTORY: 70
      MARGINAL: 50
      UNSATISFACTORY: 0
    precision: "2 decimal places, round_half_up"
    variants:
      - name: index_with_reports
        when: "vendor has >=1 CparsReport on a non-TERMINATED contract"
        difference: "mean of rating_values."
      - name: index_empty
        when: "vendor has no qualifying reports"
        difference: "performance_index = null (empty-set boundary)."

  - name: obligated_amount
    trigger: "Modification PROPOSED -> APPROVED (recompute); also set at contract creation"
    algorithm: aggregation
    formula: |
      obligated_amount_cents = Contract.base_value_cents
        + sum(m.option_value_cents for m in Modifications(contract)
              if m.status == APPROVED and m.mod_type == OPTION_EXERCISE)
        + sum(m.delta_cents for m in Modifications(contract)
              if m.status == APPROVED and m.mod_type == FUNDING)
    input_set: "APPROVED Modifications of the contract; FUNDING and OPTION_EXERCISE contribute, ADMINISTRATIVE contributes 0."
    constants: {}
    precision: "Integer cents"
    variants:
      - name: base_only
        when: "no approved modifications"
        difference: "obligated == base_value_cents."
      - name: with_options
        when: ">=1 approved OPTION_EXERCISE/FUNDING mod"
        difference: "obligation grows; new ceiling caps subsequent invoice approvals."

  - name: cumulative_invoiced
    trigger: "Invoice SUBMITTED -> APPROVED (recompute)"
    algorithm: aggregation
    formula: |
      cumulative_invoiced_cents = sum(i.amount_cents for i in Invoices(contract) if i.status == APPROVED)
    input_set: "APPROVED invoices of the contract only; SUBMITTED/REJECTED excluded."
    constants: {}
    precision: "Integer cents"
    variants:
      - name: under_ceiling
        when: "cumulative < obligated"
        difference: "funding_posture stays WITHIN_CEILING."
      - name: at_ceiling
        when: "cumulative == obligated"
        difference: "funding_posture -> CEILING_REACHED; further OPTION_EXERCISE approval blocked."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Segregation of duties: the ContractingOfficer making an award (X-User-ID) must NOT equal the operator who finalized the evaluation (the recorded evaluation chair) for that solicitation"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /awards"

  - priority: 4
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "On Award create: the named Proposal belongs to the named Solicitation and is in status ACCEPTABLE"
    error_id: ERR_PROPOSAL_NOT_ELIGIBLE
    http_status: 409
    applies_to: "POST /awards"

  - priority: 7
    category: business_safety
    check: "Set-aside eligibility on proposal submit: SMALL_BUSINESS requires employee_count <= naics_size_threshold; named-program set-aside requires the matching certification in set_aside_certifications"
    error_id: ERR_SET_ASIDE_INELIGIBLE
    http_status: 422
    applies_to: "POST /proposals/{id}/submit"

  - priority: 8
    category: business_safety
    check: "Vendor SAM registration must be ACTIVE and not expired (registration_expires_at > clock) to submit a proposal"
    error_id: ERR_REGISTRATION_NOT_ACTIVE
    http_status: 422
    applies_to: "POST /proposals/{id}/submit"

  - priority: 9
    category: business_temporal
    check: "Proposal submitted at clock <= Solicitation.close_at (inclusive); past deadline rejected"
    error_id: ERR_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /proposals/{id}/submit"

  - priority: 10
    category: business_temporal
    check: "OPTION_EXERCISE modification approved at clock <= option_window_close_at (inclusive)"
    error_id: ERR_OPTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /modifications/{id}/approve"

  - priority: 11
    category: business_constraint
    check: "EvaluationFactor weights: exactly one PRICE factor and sum of non-PRICE weights == 1.0 before a solicitation can OPEN"
    error_id: ERR_FACTOR_WEIGHTS_INVALID
    http_status: 422
    applies_to: "POST /solicitations/{id}/open"

  - priority: 12
    category: business_constraint
    check: "UEI uniqueness: no other VendorRegistration with the same UEI (case-insensitive) has sam_status in {ACTIVE, EXPIRED} on activate"
    error_id: ERR_DUPLICATE_UEI
    http_status: 409
    applies_to: "POST /vendors/{id}/activate"

  - priority: 13
    category: business_constraint
    check: "CLIN clin_number unique within its contract"
    error_id: ERR_DUPLICATE_CLIN
    http_status: 409
    applies_to: "POST /contracts/{id}/clins"

  - priority: 14
    category: business_constraint
    check: "FFP invoice must reference a clin_id and invoiced_qty; CPFF invoice must reference allowable_cost_cents and no clin_id; mismatched payload rejected"
    error_id: ERR_INVOICE_SHAPE_MISMATCH
    http_status: 422
    applies_to: "POST /invoices"

  - priority: 15
    category: business_constraint
    check: "FFP CLIN over-delivery: ContractLineItem.delivered_qty + invoice.invoiced_qty <= funded_qty"
    error_id: ERR_CLIN_OVERDELIVERY
    http_status: 422
    applies_to: "POST /invoices/{id}/approve"

  - priority: 16
    category: business_fiscal
    check: "Obligation ceiling: Contract.cumulative_invoiced_cents + invoice.amount_cents <= Contract.obligated_amount_cents"
    error_id: ERR_CEILING_EXCEEDED
    http_status: 422
    applies_to: "POST /invoices/{id}/approve"

  - priority: 17
    category: business_fiscal
    check: "OPTION_EXERCISE blocked when Contract.funding_posture == CEILING_REACHED"
    error_id: ERR_CEILING_REACHED_NO_OPTION
    http_status: 422
    applies_to: "POST /modifications/{id}/approve"

  - priority: 18
    category: business_referential
    check: "Protester must be a non-winning offeror of the protested award's solicitation (a Proposal with that vendor_id exists and is not the winning_proposal_id)"
    error_id: ERR_PROTESTER_NOT_OFFEROR
    http_status: 422
    applies_to: "POST /protests"

  - priority: 19
    category: business_constraint
    check: "Request body field types/enums/required fields valid (e.g. raw_score in [0,100], rating in enum, uei 12 chars)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is 2026-01-01T00:00:00Z; before any call here the clock reads exactly this default and never falls back to wall-clock time. All deadline/expiry/window comparisons read this clock."
    roles: [ContractingOfficer]
    code: 200
    input: [to_iso8601]
    output: "{ now_utc: datetime }"
    side_effects: ["advances the logical clock to to_iso8601"]

  # ---- VendorRegistration ----
  - method: POST
    path: "/vendors"
    description: "Create a vendor registration (DRAFT)."
    roles: [Vendor]
    code: 201
    input: ["legal_name", "uei", "employee_count", "set_aside_certifications?", "registration_expires_at"]
    output: VendorRegistration
    side_effects: ["create VendorRegistration in DRAFT"]
  - method: GET
    path: "/vendors/{id}"
    description: "Fetch one vendor registration."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: VendorRegistration
    side_effects: []
  - method: GET
    path: "/vendors"
    description: "List vendor registrations; filterable."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: ["uei?", "sam_status?", "limit?", "offset?"]
    output: VendorRegistration[]
    side_effects: []
  - method: POST
    path: "/vendors/{id}/activate"
    description: "Activate (DRAFT->ACTIVE) or revive (EXPIRED->ACTIVE) a registration; may supply a renewed expiry."
    roles: [Vendor]
    code: 200
    input: ["registration_expires_at?"]
    output: VendorRegistration
    side_effects: ["sam_status -> ACTIVE", "version +1"]
  - method: POST
    path: "/vendors/{id}/expire"
    description: "Expire an active registration (ACTIVE->EXPIRED)."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: VendorRegistration
    side_effects: ["sam_status -> EXPIRED", "version +1"]
  - method: POST
    path: "/vendors/{id}/exclude"
    description: "Debar/exclude a registration (terminal)."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: VendorRegistration
    side_effects: ["sam_status -> EXCLUDED", "version +1"]

  # ---- Solicitation ----
  - method: POST
    path: "/solicitations"
    description: "Create a solicitation (DRAFT)."
    roles: [ContractingOfficer]
    code: 201
    input: ["title", "vehicle_type", "set_aside_type?", "naics_size_threshold", "open_at", "close_at"]
    output: Solicitation
    side_effects: ["create Solicitation in DRAFT"]
  - method: GET
    path: "/solicitations/{id}"
    description: "Fetch a solicitation."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: Solicitation
    side_effects: []
  - method: GET
    path: "/solicitations"
    description: "List solicitations; filterable by status, vehicle_type, or winning_proposal_id (reverse lookup for Solicitation.winning_proposal_id)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: ["status?", "vehicle_type?", "winning_proposal_id?", "limit?", "offset?"]
    output: Solicitation[]
    side_effects: []
  - method: POST
    path: "/solicitations/{id}/factors"
    description: "Add an EvaluationFactor to a DRAFT solicitation."
    roles: [ContractingOfficer]
    code: 201
    input: [name, kind, weight]
    output: EvaluationFactor
    side_effects: ["create EvaluationFactor under solicitation"]
  - method: GET
    path: "/solicitations/{id}/factors"
    description: "List evaluation factors of a solicitation (reverse lookup for EvaluationFactor.solicitation_id)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: EvaluationFactor[]
    side_effects: []
  - method: POST
    path: "/solicitations/{id}/open"
    description: "Open a DRAFT/AMENDED solicitation."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Solicitation
    side_effects: ["status -> OPEN", "set evaluation_method", "version +1"]
  - method: POST
    path: "/solicitations/{id}/amend"
    description: "Amend an OPEN solicitation."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Solicitation
    side_effects: ["status -> AMENDED", "amendment_count +1", "version +1"]
  - method: POST
    path: "/solicitations/{id}/close"
    description: "Close an OPEN/AMENDED solicitation after the deadline."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Solicitation
    side_effects: ["status -> CLOSED", "version +1"]
  - method: POST
    path: "/solicitations/{id}/finalize-evaluation"
    description: "Finalize evaluation (CLOSED->EVALUATED); records the evaluation chair operator id."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Solicitation
    side_effects: ["status -> EVALUATED", "record evaluation chair = X-User-ID", "version +1"]
  - method: POST
    path: "/solicitations/{id}/cancel"
    description: "Cancel a DRAFT/OPEN solicitation; cascades proposals to WITHDRAWN."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Solicitation
    side_effects: ["status -> CANCELLED", "cascade non-terminal Proposals -> WITHDRAWN", "version +1"]

  # ---- Proposal ----
  - method: POST
    path: "/proposals"
    description: "Create a DRAFT proposal for a solicitation."
    roles: [Vendor]
    code: 201
    input: [solicitation_id, vendor_id, total_price_cents]
    output: Proposal
    side_effects: ["create Proposal in DRAFT"]
  - method: GET
    path: "/proposals/{id}"
    description: "Fetch a proposal."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: Proposal
    side_effects: []
  - method: GET
    path: "/proposals"
    description: "List proposals; filter by solicitation_id or vendor_id (reverse lookup for both FKs)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: ["solicitation_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: Proposal[]
    side_effects: []
  - method: POST
    path: "/proposals/{id}/scores"
    description: "Attach a FactorScore (raw_score per factor) to a DRAFT proposal."
    roles: [Vendor, ContractingOfficer]
    code: 201
    input: [factor_id, raw_score]
    output: FactorScore
    side_effects: ["create FactorScore under proposal"]
  - method: GET
    path: "/proposals/{id}/scores"
    description: "List factor scores of a proposal (reverse lookup for FactorScore.proposal_id)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: FactorScore[]
    side_effects: []
  - method: GET
    path: "/factor-scores/{id}"
    description: "Fetch one factor score."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: FactorScore
    side_effects: []
  - method: GET
    path: "/factor-scores"
    description: "List factor scores; filter by proposal_id or factor_id (reverse lookup for FactorScore.proposal_id and FactorScore.factor_id)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: ["proposal_id?", "factor_id?", "limit?", "offset?"]
    output: FactorScore[]
    side_effects: []
  - method: POST
    path: "/proposals/{id}/submit"
    description: "Submit a proposal (DRAFT->SUBMITTED); pins vendor registration version."
    roles: [Vendor]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status -> SUBMITTED", "set pinned_vendor_version", "version +1"]
  - method: POST
    path: "/proposals/{id}/begin-evaluation"
    description: "Begin/resume evaluation (SUBMITTED or UNACCEPTABLE -> UNDER_EVALUATION)."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status -> UNDER_EVALUATION", "version +1"]
  - method: POST
    path: "/proposals/{id}/score"
    description: "Score a proposal under evaluation; forks to ACCEPTABLE or UNACCEPTABLE and computes merit/value scores."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Proposal
    side_effects: ["status -> ACCEPTABLE|UNACCEPTABLE", "recompute merit_score/value_score", "version +1"]

  # ---- Award ----
  - method: POST
    path: "/awards"
    description: "Make an award from an EVALUATED solicitation to an ACCEPTABLE proposal (segregation-of-duties + OCC on Solicitation.version)."
    roles: [ContractingOfficer]
    code: 201
    input: [solicitation_id, proposal_id, expected_solicitation_version]
    output: Award
    side_effects: ["create Award AWARDED", "Solicitation -> AWARDED + set winning_proposal_id", "winning Proposal -> AWARDED", "cascade losing Proposals -> REJECTED", "Solicitation.version +1"]
  - method: GET
    path: "/awards/{id}"
    description: "Fetch an award."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: Award
    side_effects: []
  - method: GET
    path: "/awards"
    description: "List awards; filter by solicitation_id or proposal_id (reverse lookup for both FKs)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: ["solicitation_id?", "proposal_id?", "limit?", "offset?"]
    output: Award[]
    side_effects: []

  # ---- Contract / CLIN ----
  - method: POST
    path: "/contracts"
    description: "Create a contract realizing an award (ACTIVE)."
    roles: [ContractingOfficer]
    code: 201
    input: ["award_id", "contract_type", "base_value_cents", "total_estimated_cost_cents?", "fixed_fee_cents?"]
    output: Contract
    side_effects: ["create Contract ACTIVE", "set obligated_amount_cents = base_value_cents", "copy vendor_id from winning proposal"]
  - method: GET
    path: "/contracts/{id}"
    description: "Fetch a contract."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: Contract
    side_effects: []
  - method: GET
    path: "/contracts"
    description: "List contracts; filter by award_id or vendor_id (reverse lookup for both FKs)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: ["award_id?", "vendor_id?", "lifecycle_status?", "limit?", "offset?"]
    output: Contract[]
    side_effects: []
  - method: POST
    path: "/contracts/{id}/clins"
    description: "Add a CLIN (ContractLineItem) to an ACTIVE contract."
    roles: [ContractingOfficer]
    code: 201
    input: ["clin_number", "unit_price_cents?", "funded_qty"]
    output: ContractLineItem
    side_effects: ["create ContractLineItem"]
  - method: GET
    path: "/contracts/{id}/clins"
    description: "List CLINs of a contract (reverse lookup for ContractLineItem.contract_id)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: ContractLineItem[]
    side_effects: []
  - method: POST
    path: "/contracts/{id}/complete"
    description: "Mark a contract COMPLETE (ACTIVE->COMPLETE)."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: ["lifecycle_status -> COMPLETE", "version +1"]
  - method: POST
    path: "/contracts/{id}/closeout"
    description: "Close out a COMPLETE contract (COMPLETE->CLOSED); recomputes vendor performance_index."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Contract
    side_effects: ["lifecycle_status -> CLOSED", "recompute vendor performance_index", "version +1"]

  # ---- Invoice (WAWF) ----
  - method: POST
    path: "/invoices"
    description: "Submit an invoice against a contract (WAWF); OCC on Contract.version. Computes amount_cents."
    roles: [Vendor]
    code: 201
    input: ["contract_id", "clin_id?", "invoiced_qty?", "allowable_cost_cents?", "expected_contract_version"]
    output: Invoice
    side_effects: ["create Invoice SUBMITTED", "compute amount_cents + fee_portion_cents", "increments Contract.version by 1"]
  - method: GET
    path: "/invoices/{id}"
    description: "Fetch an invoice."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/invoices"
    description: "List invoices; filter by contract_id or clin_id (reverse lookup for both FKs)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: ["contract_id?", "clin_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/invoices/{id}/approve"
    description: "Approve an invoice (SUBMITTED->APPROVED); checks CLIN delivery + obligation ceiling, updates cumulative_invoiced and funding_posture."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> APPROVED", "recompute cumulative_invoiced", "FFP: delivered_qty += invoiced_qty", "maybe funding_posture -> CEILING_REACHED", "Invoice.version +1, Contract.version +1"]
  - method: POST
    path: "/invoices/{id}/reject"
    description: "Reject an invoice (SUBMITTED->REJECTED)."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: ["status -> REJECTED", "version +1"]

  # ---- Modification ----
  - method: POST
    path: "/contracts/{id}/modifications"
    description: "Propose a modification on a contract (PROPOSED)."
    roles: [ContractingOfficer]
    code: 201
    input: ["mod_type", "delta_cents?", "option_value_cents?", "option_window_close_at?"]
    output: Modification
    side_effects: ["create Modification PROPOSED"]
  - method: GET
    path: "/contracts/{id}/modifications"
    description: "List modifications of a contract (reverse lookup for Modification.contract_id)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: Modification[]
    side_effects: []
  - method: GET
    path: "/modifications/{id}"
    description: "Fetch a modification."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: Modification
    side_effects: []
  - method: POST
    path: "/modifications/{id}/approve"
    description: "Approve a modification (PROPOSED->APPROVED); recomputes obligated_amount; OPTION_EXERCISE gated on window + funding_posture."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Modification
    side_effects: ["status -> APPROVED", "recompute Contract.obligated_amount_cents", "Modification.version +1, Contract.version +1"]
  - method: POST
    path: "/modifications/{id}/reject"
    description: "Reject a modification (PROPOSED->REJECTED)."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Modification
    side_effects: ["status -> REJECTED", "version +1"]

  # ---- Protest ----
  - method: POST
    path: "/protests"
    description: "File a protest against an award (FILED); Award -> PROTESTED."
    roles: [Vendor]
    code: 201
    input: [award_id, protester_vendor_id, grounds]
    output: Protest
    side_effects: ["create Protest FILED", "Award -> PROTESTED"]
  - method: GET
    path: "/protests/{id}"
    description: "Fetch a protest."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: Protest
    side_effects: []
  - method: GET
    path: "/protests"
    description: "List protests; filter by award_id or protester_vendor_id (reverse lookup for both FKs)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: ["award_id?", "protester_vendor_id?", "status?", "limit?", "offset?"]
    output: Protest[]
    side_effects: []
  - method: POST
    path: "/protests/{id}/begin-review"
    description: "Begin review of a protest (FILED->UNDER_REVIEW)."
    roles: [ContractingOfficer]
    code: 200
    input: []
    output: Protest
    side_effects: ["status -> UNDER_REVIEW", "version +1"]
  - method: POST
    path: "/protests/{id}/resolve"
    description: "Resolve a protest (UNDER_REVIEW -> SUSTAINED|DENIED); SUSTAINED vacates the award."
    roles: [ContractingOfficer]
    code: 200
    input: [outcome]
    output: Protest
    side_effects: ["status -> SUSTAINED|DENIED", "Award -> VACATED|AWARDED", "SUSTAINED triggers compensation cascade", "version +1"]
  - method: POST
    path: "/protests/{id}/withdraw"
    description: "Withdraw a FILED protest (Vendor); Award restored to AWARDED."
    roles: [Vendor]
    code: 200
    input: []
    output: Protest
    side_effects: ["status -> WITHDRAWN", "Award -> AWARDED", "version +1"]

  # ---- CPARS ----
  - method: POST
    path: "/contracts/{id}/cpars"
    description: "File a CPARS performance report on a contract."
    roles: [ContractingOfficer]
    code: 201
    input: [rating]
    output: CparsReport
    side_effects: ["create CparsReport", "set rating_value from rating"]
  - method: GET
    path: "/contracts/{id}/cpars"
    description: "List CPARS reports of a contract (reverse lookup for CparsReport.contract_id)."
    roles: [Vendor, ContractingOfficer, Auditor]
    code: 200
    input: []
    output: CparsReport[]
    side_effects: []

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Role not permitted for this operation."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Award maker is the same operator who finalized the evaluation."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)."
  - id: ERR_PROPOSAL_NOT_ELIGIBLE
    http: 409
    condition: "Award names a proposal not belonging to the solicitation or not in ACCEPTABLE."
  - id: ERR_SET_ASIDE_INELIGIBLE
    http: 422
    condition: "Vendor fails the solicitation's set-aside / size eligibility on submit."
  - id: ERR_REGISTRATION_NOT_ACTIVE
    http: 422
    condition: "Vendor SAM registration not ACTIVE or expired at submit."
  - id: ERR_DEADLINE_PASSED
    http: 422
    condition: "Proposal submitted after Solicitation.close_at."
  - id: ERR_OPTION_WINDOW_CLOSED
    http: 422
    condition: "OPTION_EXERCISE approved after option_window_close_at."
  - id: ERR_FACTOR_WEIGHTS_INVALID
    http: 422
    condition: "Solicitation lacks exactly one PRICE factor or non-PRICE weights do not sum to 1.0 at open."
  - id: ERR_DUPLICATE_UEI
    http: 409
    condition: "Another non-DRAFT registration already holds this UEI at activate."
  - id: ERR_DUPLICATE_CLIN
    http: 409
    condition: "clin_number already exists on this contract."
  - id: ERR_INVOICE_SHAPE_MISMATCH
    http: 422
    condition: "Invoice payload does not match the contract type (FFP needs clin_id+invoiced_qty; CPFF needs allowable_cost_cents)."
  - id: ERR_CLIN_OVERDELIVERY
    http: 422
    condition: "Approving the invoice would push CLIN delivered_qty past funded_qty."
  - id: ERR_CEILING_EXCEEDED
    http: 422
    condition: "Approving the invoice would push cumulative_invoiced past obligated_amount."
  - id: ERR_CEILING_REACHED_NO_OPTION
    http: 422
    condition: "OPTION_EXERCISE approval attempted while funding_posture == CEILING_REACHED."
  - id: ERR_PROTESTER_NOT_OFFEROR
    http: 422
    condition: "Protester is not a non-winning offeror of the protested solicitation."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body: missing required field, bad enum, out-of-range value."
  - id: ERR_VALIDATION
    http: 422
    condition: "Generic semantic validation failure not covered by a more specific code (e.g. CPFF contract missing total_estimated_cost_cents/fixed_fee_cents on creation)."

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ContractingOfficer
    description: "Government contracting officer / evaluation chair / approving official; drives solicitation, evaluation, award, contract administration, modifications, protest resolution, CPARS."
    identity: opaque
    exclusive_operations:
      - "POST /solicitations and lifecycle (open/amend/close/finalize-evaluation/cancel)"
      - "POST /solicitations/{id}/factors"
      - "POST /proposals/{id}/begin-evaluation, /score"
      - "POST /awards (subject to segregation of duties)"
      - "POST /contracts and lifecycle (clins/complete/closeout)"
      - "POST /invoices/{id}/approve, /reject"
      - "POST /contracts/{id}/modifications, /modifications/{id}/approve|reject"
      - "POST /protests/{id}/begin-review, /resolve"
      - "POST /contracts/{id}/cpars"
      - "POST /vendors/{id}/expire, /exclude"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads"
      - "POST /proposals/{id}/scores (also Vendor)"

  - name: Vendor
    description: "Offeror / awardee acting on its own VendorRegistration, proposals, invoices, and protests."
    identity: "entity_backed:VendorRegistration"
    exclusive_operations:
      - "POST /vendors, /vendors/{id}/activate"
      - "POST /proposals, /proposals/{id}/submit"
      - "POST /invoices"
      - "POST /protests, /protests/{id}/withdraw"
    shared_operations:
      - "All GET reads"
      - "POST /proposals/{id}/scores (also ContractingOfficer)"

  - name: Auditor
    description: "Read-only oversight role (e.g. GAO/IG); can read every resource, mutate nothing."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET reads"
