          setup:
            - "Vendor ACME, rep r1 credentialed until 2026-08-04T00:00:00Z; two APPROVED requests rq1 (tray t1) and rq2 (tray t2), same vendor and case; clock advanced past expiry so r1 is EXPIRED"
