              as: Registrar
            - call: "POST /montessori/conference-slots"
              payload: { guide_user_id: "guide-1", classroom_id: "${room_id}", start_at: "2026-10-01T15:00:00Z", end_at: "2026-10-01T15:30:00Z" }
              as: Guide
              as_user_id: "guide-1"
              captures: { slot_id: $.data.id }
          trigger:
            - call: "POST /montessori/conference-slots/${slot_id}/book"
              payload: { booked_student_id: "${stu_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_INVALID_STATE (booked student has no PLACED enrollment in the slot's classroom)"

  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: guide_double_book_half_open_overlap
        grounds:
          - validations[priority=10]
          - state_machines.ConferenceSlot.OPEN_to_BOOKED
          - errors[ERR_GUIDE_DOUBLE_BOOKED]
        distinguishing_aspect: "ConferenceSlot uses HALF-OPEN [start_at, end_at) semantics: booking a slot 15:30-16:00 while the same guide already has a BOOKED 15:00-15:30 slot SUCCEEDS (adjacent endpoints do not overlap), but a 15:15-15:45 slot is rejected ERR_GUIDE_DOUBLE_BOOKED."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Two compliant PRIMARY rooms each with a PLACED child of parent-1; guide guide-1 has a BOOKED slot 15:00-15:30 and two OPEN slots: 15:30-16:00 (adjacent) and 15:15-15:45 (overlapping)."
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary O", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid One", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
            - call: "POST /montessori/conference-slots"
              payload: { guide_user_id: "guide-1", classroom_id: "${room_id}", start_at: "2026-10-01T15:00:00Z", end_at: "2026-10-01T15:30:00Z" }
              as: Guide
              as_user_id: "guide-1"
              captures: { slot_a: $.data.id }
            - call: "POST /montessori/conference-slots/${slot_a}/book"
              payload: { booked_student_id: "${stu_id}" }
              as: Parent
              as_user_id: "parent-1"
            - call: "POST /montessori/conference-slots"
              payload: { guide_user_id: "guide-1", classroom_id: "${room_id}", start_at: "2026-10-01T15:30:00Z", end_at: "2026-10-01T16:00:00Z" }
              as: Guide
              as_user_id: "guide-1"
              captures: { slot_adj: $.data.id }
            - call: "POST /montessori/conference-slots/${slot_adj}/book"
              payload: { booked_student_id: "${stu_id}" }
              as: Parent
              as_user_id: "parent-1"
            - call: "POST /montessori/conference-slots"
              payload: { guide_user_id: "guide-1", classroom_id: "${room_id}", start_at: "2026-10-01T15:15:00Z", end_at: "2026-10-01T15:45:00Z" }
              as: Guide
              as_user_id: "guide-1"
              captures: { slot_ovl: $.data.id }
          trigger:
            - call: "POST /montessori/conference-slots/${slot_ovl}/book"
              payload: { booked_student_id: "${stu_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { err: $.data.error_id }
          assert:
            - "The adjacent 15:30-16:00 booking SUCCEEDED (status BOOKED) — half-open boundary, no overlap"
            - "The overlapping 15:15-15:45 booking returns status 409 with data.error_id == ERR_GUIDE_DOUBLE_BOOKED"

      - name: observation_closed_interval_shared_endpoint_conflicts
        grounds:
          - validations[priority=11]
          - errors[ERR_OBSERVATION_OVERLAP]
        distinguishing_aspect: "Observation uses CLOSED-interval semantics on a different resource (Classroom observation windows): a window 15:30-16:00 that shares only the endpoint 15:30 with an existing 15:00-15:30 window IS rejected ERR_OBSERVATION_OVERLAP — opposite adjacency treatment from the half-open ConferenceSlot rule."
        test_recipe:
          setup:
            - "A PRIMARY classroom with an existing Observation window 15:00-15:30."
          setup_api_calls:
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary P", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id }
            - call: "POST /montessori/observations"
              payload: { classroom_id: "${room_id}", observer_name: "Visitor A", window_start_at: "2026-10-01T15:00:00Z", window_end_at: "2026-10-01T15:30:00Z" }
              as: ComplianceOfficer
              captures: { obs_a: $.data.id }
          trigger:
            - call: "POST /montessori/observations"
              payload: { classroom_id: "${room_id}", observer_name: "Visitor B", window_start_at: "2026-10-01T15:30:00Z", window_end_at: "2026-10-01T16:00:00Z" }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_OBSERVATION_OVERLAP (closed-interval: shared 15:30 endpoint conflicts)"

  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: refund_pay_conserves_money_paid_minus_refunded
        grounds:
          - state_machines.RefundRequest.APPROVED_to_PAID
          - calculations.paid_to_date
          - calculations.refund_amount
          - entities.Payment.fields.status
        distinguishing_aspect: "Conserved quantity = money. Across the forward action (payments captured, paid_to_date=700000) and its compensation (refund pay marks payments REFUNDED), the invariant paid_to_date_cents_after == paid_to_date_cents_before - refund_cents holds exactly: 700000 - 300000 == 400000, with no cents drift."
        test_recipe:
          setup:
            - "Clock 2026-09-01. STANDARD tier (deposit 100000). PRIMARY room compliant capacity 5."
            - "Child ENROLLED; deposit 100000 + 6 installments captured (paid_to_date=700000); WITHDRAWN; FORWARD refund (refund_cents=300000) APPROVED."
          setup_api_calls:
            - call: "POST /montessori/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: Registrar
            - call: "POST /montessori/tiers"
              payload: { code: "STD", level: "PRIMARY", base_annual_cents: 1000000, deposit_pct: 0.10, installments: 10 }
              as: Registrar
              captures: { tier_id: $.data.id }
            - call: "POST /montessori/classrooms"
              payload: { name: "Primary Q", level: "PRIMARY", capacity: 5, min_age_months: 36, max_age_months: 72 }
              as: ComplianceOfficer
              captures: { room_id: $.data.id, room_v0: $.data.version }
            - call: "POST /montessori/staff-assignments"
              payload: { classroom_id: "${room_id}", staff_name: "Maria", expected_classroom_version: "${room_v0}" }
              as: ComplianceOfficer
            - call: "POST /montessori/students"
              payload: { parent_user_id: "parent-1", full_name: "Kid One", date_of_birth: "2022-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { stu_id: $.data.id }
            - call: "POST /montessori/applications"
              payload: { student_id: "${stu_id}", classroom_id: "${room_id}", tier_id: "${tier_id}" }
              as: Parent
              as_user_id: "parent-1"
              captures: { app_id: $.data.id }
            - call: "POST /montessori/applications/${app_id}/start-review"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/offer"
              payload: {}
              as: Registrar
            - call: "POST /montessori/applications/${app_id}/accept-offer"
              payload: { program_start_date: "2026-09-01T00:00:00Z" }
              as: Parent
              as_user_id: "parent-1"
              captures: { enr_id: $.data.id }
            - call: "POST /montessori/payments"
              payload: { enrollment_id: "${enr_id}", kind: "DEPOSIT", amount_cents: 100000 }
              as: Registrar
            - call: "POST /montessori/payments"
              payload: { enrollment_id: "${enr_id}", kind: "INSTALLMENT", amount_cents: 600000 }
              as: Registrar
            - call: "POST /montessori/enrollments/${enr_id}/withdraw"
              payload: {}
              as: Registrar
            - call: "POST /montessori/refund-requests"
              payload: { enrollment_id: "${enr_id}", effective_date: "2026-11-20T00:00:00Z", method: "FORWARD" }
              as: Registrar
              captures: { rr_id: $.data.id }
            - call: "POST /montessori/refund-requests/${rr_id}/approve"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /montessori/refund-requests/${rr_id}/pay"
              payload: {}
              as: Registrar
          assert:
            - "Enrollment.${enr_id}.paid_to_date_cents == 400000 (700000 - refund_cents 300000; money conserved, no drift)"
            - "RefundRequest.${rr_id}.refund_cents == 300000"

      - name: leave_then_return_conserves_classroom_placed_count
        grounds:
          - state_machines.Enrollment.placement:PLACED_to_placement:ON_LEAVE
          - state_machines.Enrollment.placement:ON_LEAVE_to_placement:PLACED
          - calculations.ratio_compliance
          - entities.Classroom.fields.placed_count
        distinguishing_aspect: "Conserved quantity = classroom seat count (a different conserved quantity than money). Forward action leave (placed_count 1->0) paired with its compensation return (placed_count 0->1) leaves Classroom.placed_count == 1, identical to before the pair, with compliance_status back to COMPLIANT."
        test_recipe:
          setup:
