      - name: warranty_settlement_variant_divergence
        claim_type: variant_divergence
        grounds: [calculations.calc_warranty_settlement]
        excluded_because:
          difficulty_instance: warranty_settlement_provisional_diverges_from_final
          rationale: "Variant divergence (provisional 12300 vs final 13800) is the assert core of the named §1.8 instance."

