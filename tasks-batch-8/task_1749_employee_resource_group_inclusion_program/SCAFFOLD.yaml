# =============================================================================
# Task 1749: Employee Resource Group & Inclusion Program — seed tables
# =============================================================================

scenario: |
  Employee Resource Group & Inclusion Program (corporate DEI office): group chartering & executive sponsor assignment, membership & event budget allocation, event calendar & participation tracking, leadership term & succession within groups, program goal alignment & impact reporting, inclusive-hiring partnership & mentoring program, employee feedback & climate measurement, funding request approval

domain_name: employee-resource-group-inclusion
api_prefix: /v1

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi-party negotiation        # charter & funding approval chains with sponsor endorsement, counter-offers, veto
  secondary_archetype: quota / allocation           # fiscal-year pool competed for via largest-remainder waterfall; reserve/disburse/reconcile ledger
  complexity_layers:
    - optimistic_concurrency                        # OCC on ErgGroup.version (assign-sponsor) and ErgEvent.version (reschedule)
    - cascading_side_effects                        # suspend cascade (group->events->rsvps), term-expiry gap cascade (clock->term->group->funding)
    - rate_threshold_triggers                       # utilization tiers, climate index threshold, min-responses gate, capacity boundary
    - scheduled_actions                             # logical clock sweep expires leadership terms; survey windows; deferred event completion
  entity_topology: flat                             # peer resources joined by FK references in request bodies
  state_machine_shape: cyclic                       # charter CHANGES_REQUESTED loop, funding COUNTERED loop, SUSPENDED<->ACTIVE
  relationship_patterns:
    - one_to_many
    - self_referential                              # LeadershipTerm.predecessor_term_id
    - cross_aggregate                               # ErgEvent.funding_request_id, MentoringEngagement.program_id
  role_model: approval_chain                        # leader -> sponsor -> DeiAdmin, with segregation-of-duties rule
  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# Employee ids are opaque (upstream HRIS owns the employee registry); only
# ExecutiveSponsor is a persisted, entity-backed actor identity.
# =============================================================================
entities:
  - name: InclusionProgram
    parent: null
    common_fields: true
    fields:
      - { name: fiscal_year, type: integer, source: input, description: "Fiscal year label (e.g. 2027)" }
      - { name: pool_total_cents, type: integer, source: input, description: "Total annual ERG budget pool in cents", constraints: ">= 0" }
      - { name: goals, type: array, source: input, default: "[]", description: "Program goals: list of {metric, target_value}; metric in {TOTAL_ACTIVE_MEMBERS, EVENTS_COMPLETED, AVG_CAPACITY_UTILIZATION, LATEST_CLIMATE_INDEX, MENTORING_COMPLETED_COUNT}" }
      - { name: status, type: enum, source: system, default: SETUP, description: "SETUP | OPEN | ALLOCATION_LOCKED" }
      - { name: posture, type: enum, source: system, default: NORMAL, description: "NORMAL | CLIMATE_REVIEW (parallel dimension to status; gates new group creation)" }
      - { name: unallocated_pool_cents, type: integer, source: computed, description: "= pool_total_cents - sum(allocated_cents over all ErgGroups of this program); rises on reconcile refunds" }

  - name: ExecutiveSponsor
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: input, description: "Opaque employee id of the sponsor (unique across sponsors)" }
      - { name: max_groups, type: integer, source: input, description: "Maximum count of sponsored groups in non-terminal statuses", constraints: ">= 1" }
      - { name: max_mentees, type: integer, source: input, description: "Maximum count of mentoring engagements in {PROPOSED, ACTIVE} status", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ON_LEAVE | INACTIVE" }

  - name: ErgGroup
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> InclusionProgram.id; owning program" }
      - { name: sponsor_id, type: string, source: system, description: "FK -> ExecutiveSponsor.id; assigned sponsor, null until assign-sponsor" }
      - { name: created_by_employee_id, type: string, source: system, description: "Charter owner: X-User-ID of GroupLeader creator, or owner_employee_id when DeiAdmin creates" }
      - { name: name, type: string, source: input, description: "Group name; unique within program (case-sensitive)" }
      - { name: mission_statement, type: string, source: input, description: "Charter mission text" }
      - { name: category, type: enum, source: input, description: "AFFINITY | PROFESSIONAL | COMMUNITY_OUTREACH (allocation weight multiplier)" }
      - { name: status, type: enum, source: system, default: CHARTER_DRAFT, description: "CHARTER_DRAFT | SUBMITTED | SPONSOR_ENDORSED | CHANGES_REQUESTED | ACTIVE | SUSPENDED | CHARTER_REJECTED | DISSOLVED" }
      - { name: founding_member_count, type: integer, source: system, description: "Snapshot of active_member_count at charter approval; null until ACTIVE" }
      - { name: active_member_count, type: integer, source: computed, description: "= count of GroupMembership rows with this group_id and status ACTIVE" }
      - { name: has_active_leader, type: boolean, source: computed, description: "= exists LeadershipTerm with this group_id and status ACTIVE" }
      - { name: allocated_cents, type: integer, source: system, default: 0, description: "Budget allocated at lock-allocation (reduced by reconcile refunds)" }
      - { name: reserved_cents, type: integer, source: system, default: 0, description: "Sum of approved_cents over funding requests in APPROVED status" }
      - { name: spent_cents, type: integer, source: system, default: 0, description: "Sum of disbursed amounts not yet refunded at reconcile" }
      - { name: available_cents, type: integer, source: computed, description: "= allocated_cents - reserved_cents - spent_cents" }
      - { name: certified_standing_score, type: number, source: system, description: "Standing score frozen at lock-allocation; null until then; used by allocation weights" }
      - { name: provisional_standing_score, type: number, source: computed, description: "Standing score recomputed live from current aggregates (see calculation group_standing_score)" }

  - name: GroupMembership
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> ErgGroup.id" }
      - { name: employee_id, type: string, source: system, description: "Opaque employee id; from X-User-ID (Employee) or employee_id input (DeiAdmin)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | INACTIVE" }
      - { name: joined_at, type: datetime, source: system, description: "Logical-clock timestamp of most recent (re)activation" }
      - { name: left_at, type: datetime, source: system, description: "Logical-clock timestamp of leave; null while ACTIVE" }

  - name: LeadershipTerm
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> ErgGroup.id" }
      - { name: leader_employee_id, type: string, source: input, description: "Opaque employee id of the leader" }
      - { name: predecessor_term_id, type: string, source: input, description: "FK -> LeadershipTerm.id; self-referential succession chain; required once any prior term exists for the group, null for the first term" }
      - { name: starts_at, type: datetime, source: system, description: "= logical clock at creation (term is effective immediately)" }
      - { name: ends_at, type: datetime, source: input, description: "Term expiry; must be strictly after current logical time" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | EXPIRED (clock sweep) | RESIGNED" }

  - name: FundingRequest
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> ErgGroup.id" }
      - { name: created_by_employee_id, type: string, source: system, description: "X-User-ID of the submitting GroupLeader" }
      - { name: category, type: enum, source: input, description: "EVENT | TRAINING | COMMUNITY_OUTREACH | RECRUITING | OTHER" }
      - { name: purpose, type: string, source: input, description: "Free-text purpose" }
      - { name: requested_cents, type: integer, source: input, description: "Amount requested in cents", constraints: "> 0" }
      - { name: external_matching_cents, type: integer, source: input, default: 0, description: "External funds raised, eligible for matching top-up", constraints: ">= 0" }
      - { name: counter_amount_cents, type: integer, source: system, description: "Sponsor's counter-offer; set on COUNTER, null otherwise" }
      - { name: approved_cents, type: integer, source: system, description: "Computed at APPROVE via matching_topup_award; null until APPROVED" }
      - { name: disbursed_cents, type: integer, source: system, description: "= approved_cents once disbursed; null until DISBURSED" }
      - { name: actual_spend_cents, type: integer, source: system, description: "Reported at reconcile; null until RECONCILED" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | ENDORSED | COUNTERED | APPROVED | DECLINED | DISBURSED | RECONCILED | WITHDRAWN" }

  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Venue name (unique)" }
      - { name: capacity, type: integer, source: input, description: "Maximum attendees", constraints: "> 0" }

  - name: ErgEvent
    parent: null
    common_fields: true
    fields:
      - { name: group_id, type: string, source: input, description: "FK -> ErgGroup.id" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: funding_request_id, type: string, source: input, description: "FK -> FundingRequest.id; optional; must be APPROVED and belong to same group" }
      - { name: title, type: string, source: input, description: "Event title" }
      - { name: category, type: enum, source: input, description: "WORKSHOP | SOCIAL | RECRUITING | COMMUNITY (impact base points)" }
      - { name: starts_at, type: datetime, source: input, description: "Start (must be > current logical time at creation)" }
      - { name: ends_at, type: datetime, source: input, description: "End (must be strictly after starts_at)" }
      - { name: capacity, type: integer, source: input, description: "Max registered attendees", constraints: "> 0 and <= venue.capacity" }
      - { name: status, type: enum, source: system, default: PLANNED, description: "PLANNED | PUBLISHED | COMPLETED | CANCELLED" }
      - { name: funding_status, type: enum, source: system, default: UNFUNDED, description: "UNFUNDED | RESERVED | RELEASED | SPENT (parallel dimension to status)" }
      - { name: registered_count, type: integer, source: computed, default: 0, description: "= count of RSVPs with status REGISTERED or CHECKED_IN" }
      - { name: checked_in_count, type: integer, source: computed, default: 0, description: "= count of RSVPs with status CHECKED_IN" }
      - { name: capacity_utilization_pct, type: number, source: computed, description: "= round_half_up(100 * checked_in_count / capacity, 2); null until COMPLETED" }
      - { name: member_engagement_pct, type: number, source: computed, description: "= round_half_up(100 * checked_in_count / group.active_member_count, 2) using membership at completion; null until COMPLETED" }
      - { name: impact_points, type: integer, source: system, description: "Computed at completion via event_impact_points; null until COMPLETED" }
      - { name: low_attendance_flag, type: boolean, source: system, description: "true when capacity_utilization_pct < 25.00 at completion" }

  - name: EventRsvp
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: input, description: "FK -> ErgEvent.id" }
      - { name: employee_id, type: string, source: system, description: "Opaque employee id from X-User-ID" }
      - { name: status, type: enum, source: system, description: "REGISTERED | WAITLISTED | CHECKED_IN | CANCELLED (initial: REGISTERED if seat free, else WAITLISTED)" }
      - { name: waitlist_position, type: integer, source: system, description: "Per-event monotonic sequence assigned at creation when WAITLISTED; null for REGISTERED" }

  - name: ClimateSurvey
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> InclusionProgram.id" }
      - { name: title, type: string, source: input, description: "Survey title" }
      - { name: opens_at, type: datetime, source: input, description: "Response window open (inclusive)" }
      - { name: closes_at, type: datetime, source: input, description: "Response window close (exclusive); must be > opens_at" }
      - { name: min_responses, type: integer, source: input, description: "Minimum responses required to close", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | OPEN | CLOSED" }
      - { name: response_count, type: integer, source: computed, default: 0, description: "= count of SurveyResponse rows for this survey" }
      - { name: provisional_index, type: number, source: computed, description: "While OPEN: round_half_up(mean of response_score over responses so far, 2); null when no responses or after CLOSED" }
      - { name: final_index, type: number, source: system, description: "Set at close: round_half_up(mean of response_score over all responses, 2); null until CLOSED" }

  - name: SurveyResponse
    parent: null
    common_fields: false
    fields:
      - { name: survey_id, type: string, source: input, description: "FK -> ClimateSurvey.id" }
      - { name: respondent_employee_id, type: string, source: system, description: "Opaque employee id from X-User-ID; one response per (survey, respondent)" }
      - { name: belonging_score, type: integer, source: input, description: "1..5", constraints: "1 <= x <= 5" }
      - { name: growth_score, type: integer, source: input, description: "1..5", constraints: "1 <= x <= 5" }
      - { name: fairness_score, type: integer, source: input, description: "1..5", constraints: "1 <= x <= 5" }
      - { name: safety_score, type: integer, source: input, description: "1..5", constraints: "1 <= x <= 5" }
      - { name: response_score, type: number, source: computed, description: "= round_half_up(0.3*belonging + 0.3*growth + 0.2*fairness + 0.2*safety, 2)" }

  - name: MentoringEngagement
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> InclusionProgram.id" }
      - { name: sponsor_id, type: string, source: input, description: "FK -> ExecutiveSponsor.id (mentor)" }
      - { name: mentee_employee_id, type: string, source: system, description: "Opaque employee id; from X-User-ID (Employee) or input (DeiAdmin)" }
      - { name: starts_at, type: datetime, source: input, description: "Engagement window start" }
      - { name: ends_at, type: datetime, source: input, description: "Engagement window end; must be > starts_at" }
      - { name: status, type: enum, source: system, default: PROPOSED, description: "PROPOSED | ACTIVE | DECLINED | COMPLETED | EARLY_TERMINATED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: InclusionProgram
    initial_state: "status=SETUP, posture=NORMAL (two parallel dimensions)"
    terminal_states: []  # ALLOCATION_LOCKED is the last status; posture cycles freely
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /v1/programs/{id}/open"
        actor: DeiAdmin
        preconditions: ["program.status == SETUP (ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["increments InclusionProgram.version by 1"]
      - from: OPEN
        to: ALLOCATION_LOCKED
        trigger: "POST /v1/programs/{id}/lock-allocation"
        actor: DeiAdmin
        preconditions: ["program.status == OPEN (ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "runs calculation group_allocation_waterfall: writes allocated_cents on every ACTIVE ErgGroup of the program, sets their certified_standing_score snapshot, sets unallocated_pool_cents = pool_total_cents - sum(allocated)"
          - "increments InclusionProgram.version by 1"
      - from: "posture NORMAL"
        to: "posture CLIMATE_REVIEW"
        trigger: "system (automatic when a ClimateSurvey closes with final_index < CLIMATE_THRESHOLD 3.00)"
        actor: system
        preconditions: ["survey.program_id == this program"]
        side_effects: ["new ErgGroup creation blocked while CLIMATE_REVIEW (ERR_PROGRAM_IN_CLIMATE_REVIEW)"]
      - from: "posture CLIMATE_REVIEW"
        to: "posture NORMAL"
        trigger: "POST /v1/programs/{id}/clear-climate-review"
        actor: DeiAdmin
        preconditions: ["program.posture == CLIMATE_REVIEW (ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["increments InclusionProgram.version by 1"]

  - entity: ErgGroup
    initial_state: CHARTER_DRAFT
    terminal_states: [CHARTER_REJECTED, DISSOLVED]
    transitions:
      - from: CHARTER_DRAFT
        to: SUBMITTED
        trigger: "POST /v1/groups/{id}/submit-charter"
        actor: GroupLeader
        preconditions:
          - "caller X-User-ID == group.created_by_employee_id (ERR_NOT_GROUP_LEADER)"
          - "group.sponsor_id is not null (ERR_CHARTER_NO_SPONSOR)"
          - "active_member_count >= 10 (ERR_CHARTER_INSUFFICIENT_FOUNDING_MEMBERS)"
        side_effects: ["increments ErgGroup.version by 1"]
      - from: CHANGES_REQUESTED
        to: SUBMITTED
        trigger: "POST /v1/groups/{id}/submit-charter"
        actor: GroupLeader
        preconditions:
          - "caller X-User-ID == group.created_by_employee_id (ERR_NOT_GROUP_LEADER)"
          - "group.sponsor_id is not null (ERR_CHARTER_NO_SPONSOR)"
          - "active_member_count >= 10 (ERR_CHARTER_INSUFFICIENT_FOUNDING_MEMBERS)"
        side_effects: ["increments ErgGroup.version by 1"]
        note: "revision loop: SUBMITTED -> CHANGES_REQUESTED -> SUBMITTED is allowed repeatedly"
      - from: SUBMITTED
        to: SPONSOR_ENDORSED
        trigger: "POST /v1/groups/{id}/sponsor-decision with decision=ENDORSE"
        actor: ExecutiveSponsor
        preconditions:
          - "sponsor (X-User-ID) == group.sponsor_id (ERR_SPONSOR_NOT_ASSIGNED)"
          - "sponsor.status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
        side_effects: ["increments ErgGroup.version by 1"]
      - from: SUBMITTED
        to: CHANGES_REQUESTED
        trigger: "POST /v1/groups/{id}/sponsor-decision with decision=REQUEST_CHANGES"
        actor: ExecutiveSponsor
        preconditions:
          - "sponsor (X-User-ID) == group.sponsor_id (ERR_SPONSOR_NOT_ASSIGNED)"
          - "sponsor.status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
        side_effects: ["increments ErgGroup.version by 1"]
      - from: SPONSOR_ENDORSED
        to: ACTIVE
        trigger: "POST /v1/groups/{id}/dei-decision with decision=APPROVE"
        actor: DeiAdmin
        preconditions: []
        side_effects:
          - "founding_member_count := active_member_count (snapshot)"
          - "increments ErgGroup.version by 1"
      - from: SPONSOR_ENDORSED
        to: CHARTER_REJECTED
        trigger: "POST /v1/groups/{id}/dei-decision with decision=REJECT"
        actor: DeiAdmin
        preconditions: []
        side_effects: ["increments ErgGroup.version by 1"]
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /v1/groups/{id}/set-status with to_status=SUSPENDED"
        actor: DeiAdmin
        preconditions: []
        side_effects:
          - "CASCADE A link 1: every ErgEvent with group_id == this group and status in {PLANNED, PUBLISHED} -> CANCELLED (each cancelled event then fires its own cancel side effects: link 2 cancels its REGISTERED/WAITLISTED RSVPs and flips funding_status RESERVED -> RELEASED)"
          - "increments ErgGroup.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /v1/groups/{id}/set-status with to_status=ACTIVE"
        actor: DeiAdmin
        preconditions: []
        side_effects: ["increments ErgGroup.version by 1"]
      - from: ACTIVE
        to: DISSOLVED
        trigger: "POST /v1/groups/{id}/set-status with to_status=DISSOLVED"
        actor: DeiAdmin
        preconditions: []
        side_effects:
          - "events cascade as in suspend (PLANNED/PUBLISHED -> CANCELLED -> RSVP cancellations, funding RELEASED)"
          - "all GroupMemberships with status ACTIVE -> INACTIVE (left_at set)"
          - "all FundingRequests in {SUBMITTED, COUNTERED, ENDORSED} -> WITHDRAWN; requests in APPROVED -> WITHDRAWN and their reserved_cents released (reserved_cents -= approved_cents)"
          - "increments ErgGroup.version by 1"
      - from: SUSPENDED
        to: DISSOLVED
        trigger: "POST /v1/groups/{id}/set-status with to_status=DISSOLVED"
        actor: DeiAdmin
        preconditions: []
        side_effects: ["same cascades as ACTIVE -> DISSOLVED"]
      - from: CHARTER_DRAFT
        to: CHARTER_DRAFT
        trigger: "POST /v1/groups/{id}/assign-sponsor (no status change)"
        actor: DeiAdmin
        preconditions:
          - "expected_group_version == group.version (ERR_STALE_GROUP_VERSION, 412)"
          - "sponsor exists and sponsor.status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
          - "count of groups with sponsor_id == sponsor and status in {CHARTER_DRAFT, SUBMITTED, SPONSOR_ENDORSED, CHANGES_REQUESTED, ACTIVE, SUSPENDED} < sponsor.max_groups (ERR_SPONSOR_CAPACITY_EXCEEDED)"
        side_effects: ["group.sponsor_id := sponsor_id (supersedes any prior assignment)", "increments ErgGroup.version by 1"]
        note: "also allowed from CHANGES_REQUESTED and ACTIVE (reassignment supersedes); rejected from all other states (ERR_INVALID_STATE_TRANSITION)"
      - from: CHANGES_REQUESTED
        to: CHANGES_REQUESTED
        trigger: "POST /v1/groups/{id}/assign-sponsor (no status change)"
        actor: DeiAdmin
        preconditions: ["same as CHARTER_DRAFT assign-sponsor"]
        side_effects: ["group.sponsor_id := sponsor_id", "increments ErgGroup.version by 1"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /v1/groups/{id}/assign-sponsor (no status change)"
        actor: DeiAdmin
        preconditions: ["same as CHARTER_DRAFT assign-sponsor"]
        side_effects: ["group.sponsor_id := sponsor_id", "increments ErgGroup.version by 1"]

  - entity: GroupMembership
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: "(none, or existing INACTIVE row for the same (group_id, employee_id))"
        to: ACTIVE
        trigger: "POST /v1/memberships"
        actor: "Employee (self: employee_id == X-User-ID) | DeiAdmin (any employee_id)"
        preconditions:
          - "group.status in {CHARTER_DRAFT, SUBMITTED, SPONSOR_ENDORSED, CHANGES_REQUESTED, ACTIVE} (ERR_GROUP_NOT_ACCEPTING_MEMBERS)"
          - "no existing membership row for (group_id, employee_id) with status ACTIVE (ERR_ALREADY_MEMBER)"
        side_effects:
          - "if an INACTIVE row exists for the pair it is reactivated in place (status ACTIVE, joined_at := now, left_at := null); otherwise a new row is created"
          - "group.active_member_count recomputed (+1)"
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /v1/memberships/{id}/leave"
        actor: "Employee (own row), GroupLeader (any row of a group they currently lead), DeiAdmin (any row)"
        preconditions: ["membership.status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"]
        side_effects: ["left_at := now", "group.active_member_count recomputed (-1)"]

  - entity: LeadershipTerm
    initial_state: ACTIVE
    terminal_states: [EXPIRED, RESIGNED]
    transitions:
      - from: "(creation)"
        to: ACTIVE
        trigger: "POST /v1/leadership-terms"
        actor: DeiAdmin
        preconditions:
          - "group.status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"
          - "no other LeadershipTerm with same group_id and status ACTIVE (ERR_ACTIVE_TERM_EXISTS)"
          - "leader has an ACTIVE membership in the group with joined_at <= now - 90 days (ERR_TERM_TENURE_NOT_MET)"
          - "count of LeadershipTerms with same (group_id, leader_employee_id) in any status < 2 (ERR_TERM_LIMIT_EXCEEDED)"
          - "if any prior term exists for the group: predecessor_term_id is required and must equal the prior term with max(ends_at), tie-break max(created_at) (ERR_PREDECESSOR_MISMATCH); if no prior term exists, predecessor_term_id must be null"
          - "ends_at > now (ERR_INVALID_REQUEST otherwise)"
        side_effects:
          - "starts_at := current logical time"
          - "group.has_active_leader recomputed (true)"
      - from: ACTIVE
        to: RESIGNED
        trigger: "POST /v1/leadership-terms/{id}/resign"
        actor: "GroupLeader (own term: X-User-ID == leader_employee_id) | DeiAdmin"
        preconditions: ["term.status == ACTIVE (ERR_INVALID_STATE_TRANSITION)"]
        side_effects:
          - "if no other ACTIVE term remains for the group: group.has_active_leader := false, then CASCADE B link 2: every FundingRequest of the group in {SUBMITTED, COUNTERED} -> WITHDRAWN"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system sweep inside POST /v1/_clock/set_current_utc (any term with ends_at <= new clock value)"
        actor: system
        preconditions: []
        side_effects:
          - "if no other ACTIVE term remains for the group: group.has_active_leader := false, then CASCADE B link 2: every FundingRequest of the group in {SUBMITTED, COUNTERED} -> WITHDRAWN"

  - entity: FundingRequest
    initial_state: SUBMITTED
    terminal_states: [DECLINED, RECONCILED, WITHDRAWN]
    transitions:
      - from: "(creation)"
        to: SUBMITTED
        trigger: "POST /v1/funding-requests"
        actor: GroupLeader
        preconditions:
          - "group.status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"
          - "group.has_active_leader == true and caller X-User-ID == the ACTIVE term's leader_employee_id (ERR_NOT_GROUP_LEADER / ERR_LEADERSHIP_GAP)"
          - "program.status in {OPEN, ALLOCATION_LOCKED} (ERR_PROGRAM_NOT_OPEN)"
        side_effects: ["created_by_employee_id := X-User-ID"]
      - from: SUBMITTED
        to: ENDORSED
        trigger: "POST /v1/funding-requests/{id}/sponsor-decision with decision=ENDORSE"
        actor: ExecutiveSponsor
        preconditions:
          - "sponsor (X-User-ID) == group.sponsor_id (ERR_SPONSOR_NOT_ASSIGNED)"
          - "sponsor.status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
          - "sponsor.employee_id != request.created_by_employee_id (ERR_SPONSOR_SELF_ENDORSEMENT — segregation of duties)"
        side_effects: []
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /v1/funding-requests/{id}/sponsor-decision with decision=COUNTER"
        actor: ExecutiveSponsor
        preconditions: ["same as ENDORSE", "counter_amount_cents present and > 0 (ERR_INVALID_REQUEST)"]
        side_effects: ["counter_amount_cents := input"]
      - from: COUNTERED
        to: SUBMITTED
        trigger: "POST /v1/funding-requests/{id}/revise"
        actor: GroupLeader
        preconditions: ["caller X-User-ID == request.created_by_employee_id (ERR_NOT_GROUP_LEADER)", "requested_cents > 0"]
        side_effects: ["requested_cents := input (negotiation cycle; may repeat)"]
        note: "COUNTERED -> SUBMITTED cycle is unbounded"
      - from: ENDORSED
        to: APPROVED
        trigger: "POST /v1/funding-requests/{id}/dei-decision with decision=APPROVE"
        actor: DeiAdmin
        preconditions:
          - "program.status == ALLOCATION_LOCKED (ERR_ALLOCATION_NOT_LOCKED)"
          - "approved_cents computed via matching_topup_award <= group.available_cents (ERR_INSUFFICIENT_GROUP_BUDGET); equality is allowed"
        side_effects:
          - "approved_cents := computed award"
          - "group.reserved_cents += approved_cents (reserve; available_cents drops correspondingly)"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /v1/funding-requests/{id}/dei-decision with decision=DECLINE"
        actor: DeiAdmin
        preconditions: []
        side_effects: []
      - from: ENDORSED
        to: DECLINED
        trigger: "POST /v1/funding-requests/{id}/dei-decision with decision=DECLINE"
        actor: DeiAdmin
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /v1/funding-requests/{id}/disburse"
        actor: DeiAdmin
        preconditions: []
        side_effects:
          - "disbursed_cents := approved_cents"
          - "group.reserved_cents -= approved_cents; group.spent_cents += approved_cents"
      - from: DISBURSED
        to: RECONCILED
        trigger: "POST /v1/funding-requests/{id}/reconcile"
        actor: GroupLeader
        preconditions:
          - "caller X-User-ID == request.created_by_employee_id (ERR_NOT_GROUP_LEADER)"
          - "actual_spend_cents >= 0 and <= disbursed_cents (ERR_INVALID_REQUEST)"
        side_effects:
          - "refund = disbursed_cents - actual_spend_cents"
          - "group.spent_cents -= refund; group.allocated_cents -= refund; program.unallocated_pool_cents += refund"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system cascade (leadership gap or group dissolution)"
        actor: system
        preconditions: []
        side_effects: []
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "system cascade (leadership gap or group dissolution)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ENDORSED
        to: WITHDRAWN
        trigger: "system cascade (group dissolution only)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: WITHDRAWN
        trigger: "system cascade (group dissolution only)"
        actor: system
        preconditions: []
        side_effects: ["group.reserved_cents -= approved_cents (reserve released)"]

  - entity: ErgEvent
    initial_state: "status=PLANNED, funding_status=UNFUNDED or RESERVED (two parallel dimensions)"
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: "(creation)"
        to: PLANNED
        trigger: "POST /v1/events"
        actor: "GroupLeader | DeiAdmin"
        preconditions:
          - "group.status == ACTIVE (ERR_GROUP_NOT_ACTIVE)"
          - "caller is DeiAdmin or the group's ACTIVE-term leader (ERR_NOT_GROUP_LEADER)"
          - "capacity <= venue.capacity (ERR_VENUE_CAPACITY_EXCEEDED)"
          - "starts_at > now and ends_at > starts_at (ERR_INVALID_REQUEST)"
          - "if funding_request_id given: it exists, its group_id == this group (ERR_FUNDING_REQUEST_WRONG_GROUP), and its status == APPROVED (ERR_FUNDING_REQUEST_NOT_APPROVED)"
          - "no other event with same venue_id and status in {PLANNED, PUBLISHED} overlapping [starts_at, ends_at) with half-open semantics: conflict iff new.starts_at < existing.ends_at AND existing.starts_at < new.ends_at; touching endpoints (existing.ends_at == new.starts_at or new.ends_at == existing.starts_at) do NOT conflict (ERR_VENUE_DOUBLE_BOOKED)"
        side_effects:
          - "funding_status := RESERVED if funding_request_id given, else UNFUNDED"
      - from: PLANNED
        to: PUBLISHED
        trigger: "POST /v1/events/{id}/publish"
        actor: "GroupLeader (ACTIVE-term leader of group) | DeiAdmin"
        preconditions: ["group.status == ACTIVE (ERR_GROUP_NOT_ACTIVE — re-checked)"]
        side_effects: ["increments ErgEvent.version by 1"]
      - from: PLANNED
        to: PLANNED
        trigger: "POST /v1/events/{id}/reschedule"
        actor: "GroupLeader (ACTIVE-term leader) | DeiAdmin"
        preconditions:
          - "expected_event_version == event.version (ERR_STALE_EVENT_VERSION, 412)"
          - "venue overlap re-evaluated excluding self (ERR_VENUE_DOUBLE_BOOKED)"
          - "if venue_id changes: new venue capacity check (ERR_VENUE_CAPACITY_EXCEEDED)"
          - "starts_at > now, ends_at > starts_at (ERR_INVALID_REQUEST)"
        side_effects: ["schedule updated (supersedes prior schedule)", "increments ErgEvent.version by 1"]
        note: "also allowed from PUBLISHED (PUBLISHED -> PUBLISHED)"
      - from: PUBLISHED
        to: PUBLISHED
        trigger: "POST /v1/events/{id}/reschedule"
        actor: "GroupLeader (ACTIVE-term leader) | DeiAdmin"
        preconditions: ["same as PLANNED reschedule"]
        side_effects: ["schedule updated", "increments ErgEvent.version by 1"]
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /v1/events/{id}/cancel OR system cascade (group suspended/dissolved)"
        actor: "GroupLeader (ACTIVE-term leader) | DeiAdmin | system"
        preconditions: []
        side_effects:
          - "CASCADE: every EventRsvp of this event in {REGISTERED, WAITLISTED, CHECKED_IN} -> CANCELLED (no waitlist promotion on cancel)"
          - "funding_status RESERVED -> RELEASED (UNFUNDED unchanged)"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /v1/events/{id}/cancel OR system cascade"
        actor: "GroupLeader (ACTIVE-term leader) | DeiAdmin | system"
        preconditions: []
        side_effects: ["same as PLANNED -> CANCELLED"]
      - from: PUBLISHED
        to: COMPLETED
        trigger: "POST /v1/events/{id}/complete"
        actor: "GroupLeader (ACTIVE-term leader) | DeiAdmin"
        preconditions: ["now >= event.ends_at (ERR_EVENT_NOT_ENDED)"]
        side_effects:
          - "capacity_utilization_pct and member_engagement_pct computed and frozen"
          - "impact_points := event_impact_points; low_attendance_flag := (capacity_utilization_pct < 25.00)"
          - "funding_status RESERVED -> SPENT"

  - entity: EventRsvp
    initial_state: "REGISTERED or WAITLISTED (depends on seat availability at creation)"
    terminal_states: [CANCELLED]  # CHECKED_IN is non-terminal until event completes; no further RSVP transitions after
    transitions:
      - from: "(creation)"
        to: REGISTERED
        trigger: "POST /v1/rsvps"
        actor: Employee
        preconditions:
          - "event.status == PUBLISHED (ERR_EVENT_NOT_PUBLISHED)"
          - "no existing RSVP for (event_id, X-User-ID) with status in {REGISTERED, WAITLISTED, CHECKED_IN} (ERR_ALREADY_RSVPED)"
          - "event.registered_count < event.capacity (else lands in WAITLISTED instead — boundary: registered_count == capacity is waitlisted)"
        side_effects: ["event.registered_count += 1"]
      - from: "(creation)"
        to: WAITLISTED
        trigger: "POST /v1/rsvps"
        actor: Employee
        preconditions: ["event PUBLISHED, not already RSVPed", "event.registered_count >= event.capacity"]
        side_effects: ["waitlist_position := 1 + max(waitlist_position over all RSVPs of this event, default 0)"]
      - from: REGISTERED
        to: CANCELLED
        trigger: "POST /v1/rsvps/{id}/cancel OR system cascade (event cancelled)"
        actor: "Employee (own row) | GroupLeader (leader of event's group) | DeiAdmin | system"
        preconditions: ["rsvp.status in {REGISTERED, WAITLISTED} for manual cancel (ERR_INVALID_STATE_TRANSITION); system cascade may also cancel CHECKED_IN"]
        side_effects:
          - "manual cancel only: event.registered_count -= 1, then SELECTOR waitlist_promotion runs (promote lowest waitlist_position WAITLISTED rsvp -> REGISTERED, event.registered_count += 1); system cascade cancel: no promotion, registered_count recomputed"
      - from: WAITLISTED
        to: REGISTERED
        trigger: "system (waitlist promotion after a REGISTERED cancellation)"
        actor: system
        preconditions: ["selected by waitlist_promotion selector"]
        side_effects: ["waitlist_position retained for audit"]
      - from: WAITLISTED
        to: CANCELLED
        trigger: "POST /v1/rsvps/{id}/cancel OR system cascade"
        actor: "Employee (own) | GroupLeader | DeiAdmin | system"
        preconditions: []
        side_effects: ["no seat accounting change"]
      - from: REGISTERED
        to: CHECKED_IN
        trigger: "POST /v1/rsvps/{id}/check-in"
        actor: "GroupLeader (leader of event's group) | DeiAdmin"
        preconditions:
          - "event.status == PUBLISHED (ERR_INVALID_STATE_TRANSITION)"
          - "now >= event.starts_at (ERR_CHECKIN_TOO_EARLY)"
          - "rsvp.status == REGISTERED (ERR_INVALID_STATE_TRANSITION)"
        side_effects: ["event.checked_in_count += 1 (registered_count unchanged: CHECKED_IN still holds the seat)"]

  - entity: ClimateSurvey
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /v1/climate-surveys/{id}/open"
        actor: DeiAdmin
        preconditions:
          - "program.status in {OPEN, ALLOCATION_LOCKED} (ERR_PROGRAM_NOT_OPEN)"
          - "no other ClimateSurvey of the same program with status OPEN (ERR_SURVEY_ALREADY_OPEN)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: "POST /v1/climate-surveys/{id}/close"
        actor: DeiAdmin
        preconditions: ["response_count >= min_responses (ERR_MIN_RESPONSES_NOT_MET); equality allowed"]
        side_effects:
          - "final_index := round_half_up(mean(response_score over all responses), 2); provisional_index := null"
          - "if final_index < 3.00: program.posture -> CLIMATE_REVIEW"

  - entity: MentoringEngagement
    initial_state: PROPOSED
    terminal_states: [DECLINED, COMPLETED, EARLY_TERMINATED]
    transitions:
      - from: "(creation)"
        to: PROPOSED
        trigger: "POST /v1/mentoring-engagements"
        actor: "Employee (self as mentee: mentee = X-User-ID) | DeiAdmin (mentee_employee_id input)"
        preconditions:
          - "program.status in {OPEN, ALLOCATION_LOCKED} (ERR_PROGRAM_NOT_OPEN)"
          - "sponsor.status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"
          - "sponsor.employee_id != mentee_employee_id (ERR_MENTORING_SELF_PAIRING)"
          - "count of this sponsor's engagements with status in {PROPOSED, ACTIVE} < sponsor.max_mentees (ERR_SPONSOR_CAPACITY_EXCEEDED)"
          - "mentee has no engagement with status in {PROPOSED, ACTIVE} (ERR_MENTEE_ALREADY_ENGAGED)"
          - "buffered-window conflict per sponsor over engagements with status in {PROPOSED, ACTIVE}: conflict iff new.starts_at < existing.ends_at + 14 days AND existing.starts_at < new.ends_at + 14 days; a start exactly at existing.ends_at + 14 days is allowed (ERR_MENTORING_WINDOW_CONFLICT)"
        side_effects: []
      - from: PROPOSED
        to: ACTIVE
        trigger: "POST /v1/mentoring-engagements/{id}/sponsor-decision with decision=ACCEPT"
        actor: ExecutiveSponsor
        preconditions: ["X-User-ID == engagement.sponsor_id (ERR_SPONSOR_NOT_ASSIGNED)", "sponsor.status == ACTIVE (ERR_SPONSOR_NOT_ACTIVE)"]
        side_effects: []
      - from: PROPOSED
        to: DECLINED
        trigger: "POST /v1/mentoring-engagements/{id}/sponsor-decision with decision=DECLINE"
        actor: ExecutiveSponsor
        preconditions: ["X-User-ID == engagement.sponsor_id (ERR_SPONSOR_NOT_ASSIGNED)"]
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /v1/mentoring-engagements/{id}/complete with outcome=COMPLETED"
        actor: "ExecutiveSponsor (own engagement) | DeiAdmin"
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: EARLY_TERMINATED
        trigger: "POST /v1/mentoring-engagements/{id}/complete with outcome=EARLY_TERMINATED"
        actor: "ExecutiveSponsor (own engagement) | DeiAdmin"
        preconditions: []
        side_effects: []

# =============================================================================
# Table 1.2.1: Concurrency Rules (OCC on parent version; true races only)
# =============================================================================
concurrency_rules:
  - rule_id: group-sponsor-assignment-stale
    parent_entity: ErgGroup
    write_endpoint: "POST /v1/groups/{id}/assign-sponsor"
    occ_field: expected_group_version
    description: |
      Assigning a sponsor to a group whose version has advanced since the client
      last observed it is rejected. Reassignment legitimately supersedes the prior
      assignment (no state precondition blocks it while the group is in
      CHARTER_DRAFT, CHANGES_REQUESTED, or ACTIVE), so the stale-write guard is
      expressed purely as a version check: a second sequential assign-sponsor
      carrying the previously observed version must fail.
    error_id: ERR_STALE_GROUP_VERSION
    http_status: 412
  - rule_id: event-reschedule-stale
    parent_entity: ErgEvent
    write_endpoint: "POST /v1/events/{id}/reschedule"
    occ_field: expected_event_version
    description: |
      Rescheduling an event whose version has advanced since the client last
      observed it is rejected. A reschedule legitimately supersedes the prior
      schedule while the event is PLANNED or PUBLISHED, so the stale-write guard
      is expressed purely as a version check: a second sequential reschedule
      carrying the previously observed version must fail.
    error_id: ERR_STALE_EVENT_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: event_participation_metrics
    trigger: "event completion (POST /v1/events/{id}/complete)"
    algorithm: aggregation
    formula: |
      capacity_utilization_pct = round_half_up(100 * checked_in_count / capacity, 2)
      member_engagement_pct   = round_half_up(100 * checked_in_count / group.active_member_count, 2)
      Both are frozen on the event at completion.
    input_set: "EventRsvp rows of this event with status CHECKED_IN; group.active_member_count at completion time"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: capacity_utilization_pct
        when: "venue/capacity analytics, low_attendance_flag, impact tier, AVG_CAPACITY_UTILIZATION goal"
        difference: "denominator is event.capacity"
      - name: member_engagement_pct
        when: "group standing score input"
        difference: "denominator is the group's active_member_count at completion time — same checked_in_count yields a different percentage"
  - name: group_standing_score
    trigger: "provisional: computed live on every ErgGroup read; certified: computed and frozen by POST /v1/programs/{id}/lock-allocation for each ACTIVE group"
    algorithm: weighted_scoring
    formula: |
      avg_engagement = mean of member_engagement_pct over this group's events with status COMPLETED; 0 when none
      member_growth_pct = 100 * (active_member_count - founding_member_count) / founding_member_count
      standing = round_half_up(0.5 * avg_engagement + 0.5 * min(100, member_growth_pct), 2)
    input_set: "COMPLETED events of the group; founding_member_count snapshot; active_member_count"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional_standing_score
        when: "on-read recomputation"
        difference: "uses current active_member_count and current COMPLETED event set"
      - name: certified_standing_score
        when: "frozen at lock-allocation"
        difference: "uses the aggregates as of the lock; membership growth or event completions after the lock change provisional but NOT certified"
  - name: event_impact_points
    trigger: "event completion"
    algorithm: threshold
    formula: |
      tier_multiplier = 0.5 if capacity_utilization_pct < 25
                        1.0 if 25 <= capacity_utilization_pct < 75
                        1.5 if capacity_utilization_pct >= 75
      sponsor_bonus = 10 if any EventRsvp of this event has status CHECKED_IN and
                      employee_id == the assigned sponsor's employee_id, else 0
      impact_points = min(100, BASE_POINTS[category] * tier_multiplier + sponsor_bonus)
      Result is an integer (base points are integers; multipliers yield integers for integer bases).
    input_set: "completed event's capacity_utilization_pct, category, sponsor check-in presence"
    constants:
      BASE_POINTS_WORKSHOP: 20
      BASE_POINTS_SOCIAL: 10
      BASE_POINTS_RECRUITING: 80
      BASE_POINTS_COMMUNITY: 40
      SPONSOR_BONUS: 10
      POINTS_CAP: 100
    precision: "integer points; utilization input at 2 decimal places"
  - name: group_allocation_waterfall
    trigger: "POST /v1/programs/{id}/lock-allocation"
    algorithm: waterfall_allocation
    formula: |
      Eligible groups: ErgGroups of this program with status == ACTIVE at lock time.
      weight_g = active_member_count_g * CATEGORY_WEIGHT_TENTHS[category_g]
      raw_g = pool_total_cents * weight_g / sum(weight over eligible)
      allocated_g = floor(raw_g)   # round each share DOWN to whole cents first
      remainder = pool_total_cents - sum(allocated_g)
      Distribute remainder one cent at a time to groups in order of DESCENDING
      fractional part (raw_g - floor(raw_g)); tie-break: group.created_at ASC,
      then group.name ASC. When no eligible groups exist the entire pool remains
      unallocated (unallocated_pool_cents = pool_total_cents).
      Also freezes certified_standing_score on each eligible group.
      Rounding order is pinned: per-group floor FIRST, then remainder distribution.
    input_set: "ACTIVE groups of the program at lock time"
    constants:
      CATEGORY_WEIGHT_TENTHS_AFFINITY: 10
      CATEGORY_WEIGHT_TENTHS_PROFESSIONAL: 12
      CATEGORY_WEIGHT_TENTHS_COMMUNITY_OUTREACH: 15
    precision: "whole cents; floor per group, then largest-remainder distribution"
  - name: matching_topup_award
    trigger: "POST /v1/funding-requests/{id}/dei-decision with decision=APPROVE"
    algorithm: tiered_pricing
    formula: |
      Evaluation order is pinned (the tier depends on a provisional total that
      itself includes a scouting match):
      1. provisional_total = requested_cents + SCOUT_RATE * external_matching_cents
      2. match_rate = HIGH_MATCH_RATE if provisional_total <= TIER1_CAP_CENTS else LOW_MATCH_RATE
      3. match_cents = round_half_up(match_rate * external_matching_cents) to whole cents
      4. approved_cents = requested_cents + match_cents
      approved_cents must then satisfy approved_cents <= group.available_cents
      (ERR_INSUFFICIENT_GROUP_BUDGET otherwise; equality allowed).
    input_set: "the request's requested_cents and external_matching_cents; group budget ledger"
    constants:
      SCOUT_RATE: 0.10
      TIER1_CAP_CENTS: 1000000
      HIGH_MATCH_RATE: 0.20
      LOW_MATCH_RATE: 0.05
    precision: "whole cents, round_half_up on the match"
  - name: climate_response_score
    trigger: "survey response submission"
    algorithm: weighted_scoring
    formula: |
      response_score = round_half_up(0.3*belonging_score + 0.3*growth_score
                                     + 0.2*fairness_score + 0.2*safety_score, 2)
    input_set: "the four dimension scores of the single response (each 1..5)"
    constants:
      W_BELONGING: 0.3
      W_GROWTH: 0.3
      W_FAIRNESS: 0.2
      W_SAFETY: 0.2
    precision: "2 decimal places, round_half_up"
  - name: climate_index
    trigger: "provisional_index on every read while OPEN; final_index at close"
    algorithm: aggregation
    formula: |
      index = round_half_up(mean(response_score over all SurveyResponses of the survey), 2)
      posture gate: final_index < CLIMATE_THRESHOLD -> program.posture = CLIMATE_REVIEW
      (final_index == CLIMATE_THRESHOLD exactly leaves posture NORMAL)
    input_set: "all SurveyResponse rows of the survey"
    constants:
      CLIMATE_THRESHOLD: 3.00
    precision: "2 decimal places, round_half_up; mean computed over the stored 2dp response scores"
  - name: waitlist_promotion
    trigger: "manual cancel of a REGISTERED rsvp"
    algorithm: projection
    formula: |
      Eligibility: EventRsvp rows of this event with status == WAITLISTED.
      Ranking: waitlist_position ASC (per-event monotonic sequence assigned at creation).
      Tie-break: none required (waitlist_position is unique per event).
      Empty pool: no promotion; the seat stays free (registered_count decremented).
      Selected rsvp -> REGISTERED; event.registered_count unchanged overall
      (-1 cancel, +1 promote).
    input_set: "WAITLISTED RSVPs of the event"
    precision: "not numeric"
  - name: budget_ledger
    trigger: "funding request approve / disburse / reconcile / rescind-on-dissolve; allocation lock"
    algorithm: aggregation
    formula: |
      Per group (conserved partition): allocated_cents = available_cents + reserved_cents + spent_cents
        available_cents is always derived, never stored independently.
      Per program (conserved total): pool_total_cents = unallocated_pool_cents + sum(allocated_cents over all groups)
      approve:   reserved += approved
      disburse:  reserved -= approved; spent += approved
      reconcile: refund = disbursed - actual; spent -= refund; allocated -= refund; program.unallocated += refund
      dissolve rescind (APPROVED -> WITHDRAWN): reserved -= approved
    input_set: "ErgGroup budget fields; InclusionProgram pool fields"
    precision: "integer cents, exact"
  - name: goal_attainment
    trigger: "GET /v1/programs/{id}/impact-report"
    algorithm: threshold
    formula: |
      For each goal in program.goals:
        TOTAL_ACTIVE_MEMBERS       -> sum of active_member_count over groups with status in {ACTIVE, SUSPENDED}
        EVENTS_COMPLETED           -> count of events of program's groups with status COMPLETED
        AVG_CAPACITY_UTILIZATION   -> round_half_up(mean of capacity_utilization_pct over COMPLETED events, 2); 0 when none
        LATEST_CLIMATE_INDEX       -> final_index of the CLOSED survey with max(closes_at); null when none
        MENTORING_COMPLETED_COUNT  -> count of program's engagements with status COMPLETED
      attainment = ACHIEVED when actual >= target_value (equality achieves), else MISSED;
      null actual -> MISSED.
    input_set: "groups/events/surveys/engagements of the program as filtered above"
    precision: "per-metric; utilization mean at 2 decimal places round_half_up"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-ID and X-User-Role headers present and role is one of the declared roles", error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "Caller role is in the endpoint's roles list", error_id: ERR_FORBIDDEN_ROLE, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body schema: required fields present, types and enum values valid, numeric ranges valid (e.g. capacity > 0, ends_at > starts_at, scores in 1..5)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all mutation endpoints" }
  - { priority: 4, category: existence, check: "Path and body-referenced resource ids exist (validated left-to-right)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all resource endpoints" }
  - { priority: 4.5, category: state, check: "OCC: expected_group_version == ErgGroup.version / expected_event_version == ErgEvent.version", error_id: "ERR_STALE_GROUP_VERSION / ERR_STALE_EVENT_VERSION", http_status: 412, applies_to: "POST /v1/groups/{id}/assign-sponsor; POST /v1/events/{id}/reschedule" }
  - { priority: 5, category: state, check: "Target resource lifecycle state permits the transition (incl. ERR_INVALID_STATE_TRANSITION, ERR_GROUP_NOT_ACTIVE, ERR_PROGRAM_NOT_OPEN, ERR_PROGRAM_IN_CLIMATE_REVIEW, ERR_ALLOCATION_NOT_LOCKED, ERR_SURVEY_NOT_OPEN, ERR_EVENT_NOT_PUBLISHED, ERR_SPONSOR_NOT_ACTIVE, ERR_LEADERSHIP_GAP)", error_id: "state errors per endpoint", http_status: 409, applies_to: "state-gated endpoints" }
  - { priority: 6, category: business_referential, check: "Cross-referenced entity state/ownership: sponsor assigned to group (ERR_SPONSOR_NOT_ASSIGNED), charter has sponsor (ERR_CHARTER_NO_SPONSOR), event's funding request belongs to same group (ERR_FUNDING_REQUEST_WRONG_GROUP) and is APPROVED (ERR_FUNDING_REQUEST_NOT_APPROVED), predecessor term chain integrity (ERR_PREDECESSOR_MISMATCH)", error_id: "referential errors", http_status: 409, applies_to: "endpoints with cross-references" }
  - { priority: 7, category: business_temporal, check: "Temporal rules: venue half-open overlap (ERR_VENUE_DOUBLE_BOOKED), mentoring buffered-window conflict (ERR_MENTORING_WINDOW_CONFLICT), survey response window (ERR_SURVEY_WINDOW_CLOSED), check-in not before start (ERR_CHECKIN_TOO_EARLY), completion not before end (ERR_EVENT_NOT_ENDED), single ACTIVE term per group (ERR_ACTIVE_TERM_EXISTS)", error_id: "temporal errors", http_status: 409, applies_to: "scheduling/term/survey endpoints" }
  - { priority: 8, category: business_constraint, check: "Uniqueness and aggregate gates: group name unique per program (ERR_GROUP_NAME_NOT_UNIQUE), single active membership per pair (ERR_ALREADY_MEMBER), one rsvp per pair (ERR_ALREADY_RSVPED), one response per (survey, respondent) (ERR_DUPLICATE_RESPONSE), max 2 terms per employee per group (ERR_TERM_LIMIT_EXCEEDED), 90-day member tenure for leaders (ERR_TERM_TENURE_NOT_MET), >= 10 founding members (ERR_CHARTER_INSUFFICIENT_FOUNDING_MEMBERS), min responses to close (ERR_MIN_RESPONSES_NOT_MET), mentee single engagement (ERR_MENTEE_ALREADY_ENGAGED), no self-pairing (ERR_MENTORING_SELF_PAIRING), sponsor may not endorse own submission (ERR_SPONSOR_SELF_ENDORSEMENT, 403)", error_id: "constraint errors", http_status: 409, applies_to: "creation and decision endpoints" }
  - { priority: 9, category: business_fiscal, check: "Capacity and budget: approved_cents <= group.available_cents (ERR_INSUFFICIENT_GROUP_BUDGET, 402), sponsor group/mentee load < max (ERR_SPONSOR_CAPACITY_EXCEEDED), event capacity <= venue capacity (ERR_VENUE_CAPACITY_EXCEEDED)", error_id: "fiscal/capacity errors", http_status: "402 | 409", applies_to: "approval/assignment/creation endpoints" }

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Programs ---
  - { method: POST, path: "/v1/programs", description: "Create an inclusion program", roles: [DeiAdmin], code: 201, input: [fiscal_year, pool_total_cents, "goals?"], output: InclusionProgram, side_effects: ["status=SETUP, posture=NORMAL"] }
  - { method: GET, path: "/v1/programs/{id}", description: "Get program", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: InclusionProgram, side_effects: [] }
  - { method: POST, path: "/v1/programs/{id}/open", description: "Open program for chartering", roles: [DeiAdmin], code: 200, input: [], output: InclusionProgram, side_effects: ["status -> OPEN"] }
  - { method: POST, path: "/v1/programs/{id}/lock-allocation", description: "Lock allocation: runs group_allocation_waterfall over ACTIVE groups", roles: [DeiAdmin], code: 200, input: [], output: InclusionProgram, side_effects: ["status -> ALLOCATION_LOCKED", "allocated_cents + certified_standing_score written per ACTIVE group", "unallocated_pool_cents set"] }
  - { method: POST, path: "/v1/programs/{id}/clear-climate-review", description: "Clear CLIMATE_REVIEW posture", roles: [DeiAdmin], code: 200, input: [remediation_note], output: InclusionProgram, side_effects: ["posture -> NORMAL"] }
  - { method: GET, path: "/v1/programs/{id}/impact-report", description: "Computed goal-attainment report (calculation goal_attainment)", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: { program_id: string, program_posture: string, goal_results: array, generated_at: datetime }, side_effects: [] }

  # --- Sponsors ---
  - { method: POST, path: "/v1/sponsors", description: "Appoint an executive sponsor", roles: [DeiAdmin], code: 201, input: [employee_id, max_groups, max_mentees], output: ExecutiveSponsor, side_effects: ["status=ACTIVE"] }
  - { method: GET, path: "/v1/sponsors/{id}", description: "Get sponsor", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: ExecutiveSponsor, side_effects: [] }
  - { method: POST, path: "/v1/sponsors/{id}/set-status", description: "Set sponsor status", roles: [DeiAdmin], code: 200, input: [to_status], output: ExecutiveSponsor, side_effects: ["status := to_status in {ACTIVE, ON_LEAVE, INACTIVE}"] }

  # --- Groups ---
  - { method: POST, path: "/v1/groups", description: "Create ERG charter draft", roles: [GroupLeader, DeiAdmin], code: 201, input: [program_id, name, mission_statement, category, "owner_employee_id?"], output: ErgGroup, side_effects: ["status=CHARTER_DRAFT", "created_by_employee_id := X-User-ID or owner_employee_id"] }
  - { method: GET, path: "/v1/groups/{id}", description: "Get group (incl. computed budget + standing fields)", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: ErgGroup, side_effects: [] }
  - { method: GET, path: "/v1/groups", description: "List groups with filters + pagination", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: ["program_id?", "sponsor_id?", "status?", "limit?", "offset?"], output: "ErgGroup[]", side_effects: [] }
  - { method: POST, path: "/v1/groups/{id}/assign-sponsor", description: "Assign/supersede executive sponsor (OCC on group version)", roles: [DeiAdmin], code: 200, input: [sponsor_id, expected_group_version], output: ErgGroup, side_effects: ["sponsor_id := input", "increments ErgGroup.version by 1"] }
  - { method: POST, path: "/v1/groups/{id}/submit-charter", description: "Submit (or resubmit) charter for review", roles: [GroupLeader], code: 200, input: [], output: ErgGroup, side_effects: ["status -> SUBMITTED", "increments ErgGroup.version by 1"] }
  - { method: POST, path: "/v1/groups/{id}/sponsor-decision", description: "Sponsor endorses charter or requests changes", roles: [ExecutiveSponsor], code: 200, input: [decision, "change_note?"], output: ErgGroup, side_effects: ["status -> SPONSOR_ENDORSED (ENDORSE) or CHANGES_REQUESTED (REQUEST_CHANGES)", "increments ErgGroup.version by 1"] }
  - { method: POST, path: "/v1/groups/{id}/dei-decision", description: "DEI office approves or rejects an endorsed charter", roles: [DeiAdmin], code: 200, input: [decision], output: ErgGroup, side_effects: ["status -> ACTIVE (APPROVE, snapshots founding_member_count) or CHARTER_REJECTED (REJECT)", "increments ErgGroup.version by 1"] }
  - { method: POST, path: "/v1/groups/{id}/set-status", description: "Suspend / reinstate / dissolve a group", roles: [DeiAdmin], code: 200, input: [to_status, "reason?"], output: ErgGroup, side_effects: ["status := to_status per ErgGroup machine", "suspend/dissolve cascades (events, rsvps, memberships, funding requests)"] }

  # --- Memberships ---
  - { method: POST, path: "/v1/memberships", description: "Join a group (upsert: reactivates an INACTIVE row for the pair)", roles: [Employee, DeiAdmin], code: 201, input: [group_id, "employee_id?"], output: GroupMembership, side_effects: ["membership ACTIVE", "group.active_member_count recomputed"] }
  - { method: GET, path: "/v1/memberships/{id}", description: "Get membership", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: GroupMembership, side_effects: [] }
  - { method: GET, path: "/v1/memberships", description: "List memberships with filters + pagination", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: ["group_id?", "employee_id?", "status?", "limit?", "offset?"], output: "GroupMembership[]", side_effects: [] }
  - { method: POST, path: "/v1/memberships/{id}/leave", description: "Leave / remove a member", roles: [Employee, GroupLeader, DeiAdmin], code: 200, input: [], output: GroupMembership, side_effects: ["status -> INACTIVE", "group.active_member_count recomputed"] }

  # --- Leadership terms ---
  - { method: POST, path: "/v1/leadership-terms", description: "Appoint a group leader (succession chain)", roles: [DeiAdmin], code: 201, input: [group_id, leader_employee_id, ends_at, "predecessor_term_id?"], output: LeadershipTerm, side_effects: ["starts_at := now", "group.has_active_leader recomputed"] }
  - { method: GET, path: "/v1/leadership-terms/{id}", description: "Get leadership term", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: LeadershipTerm, side_effects: [] }
  - { method: GET, path: "/v1/leadership-terms", description: "List leadership terms with filters + pagination", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: ["group_id?", "employee_id?", "predecessor_term_id?", "status?", "limit?", "offset?"], output: "LeadershipTerm[]", side_effects: [] }
  - { method: POST, path: "/v1/leadership-terms/{id}/resign", description: "Leader resigns (or admin removes)", roles: [GroupLeader, DeiAdmin], code: 200, input: [], output: LeadershipTerm, side_effects: ["status -> RESIGNED", "gap cascade when no ACTIVE term remains"] }

  # --- Funding requests ---
  - { method: POST, path: "/v1/funding-requests", description: "Submit a funding request", roles: [GroupLeader], code: 201, input: [group_id, category, purpose, requested_cents, "external_matching_cents?"], output: FundingRequest, side_effects: ["status=SUBMITTED"] }
  - { method: GET, path: "/v1/funding-requests/{id}", description: "Get funding request", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: FundingRequest, side_effects: [] }
  - { method: GET, path: "/v1/funding-requests", description: "List funding requests with filters + pagination", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: ["group_id?", "status?", "limit?", "offset?"], output: "FundingRequest[]", side_effects: [] }
  - { method: POST, path: "/v1/funding-requests/{id}/sponsor-decision", description: "Sponsor endorses or counters", roles: [ExecutiveSponsor], code: 200, input: [decision, "counter_amount_cents?"], output: FundingRequest, side_effects: ["status -> ENDORSED or COUNTERED"] }
  - { method: POST, path: "/v1/funding-requests/{id}/revise", description: "Leader revises a countered request (negotiation cycle)", roles: [GroupLeader], code: 200, input: [requested_cents], output: FundingRequest, side_effects: ["status COUNTERED -> SUBMITTED", "requested_cents := input"] }
  - { method: POST, path: "/v1/funding-requests/{id}/dei-decision", description: "DEI office approves (computes matching_topup_award, reserves budget) or declines", roles: [DeiAdmin], code: 200, input: [decision], output: FundingRequest, side_effects: ["APPROVE: status -> APPROVED, approved_cents computed, group.reserved_cents += approved_cents", "DECLINE: status -> DECLINED"] }
  - { method: POST, path: "/v1/funding-requests/{id}/disburse", description: "Disburse an approved request", roles: [DeiAdmin], code: 200, input: [], output: FundingRequest, side_effects: ["status -> DISBURSED", "disbursed_cents := approved_cents", "group.reserved_cents -= approved; group.spent_cents += approved"] }
  - { method: POST, path: "/v1/funding-requests/{id}/reconcile", description: "Report actual spend; refund remainder to program pool", roles: [GroupLeader], code: 200, input: [actual_spend_cents], output: FundingRequest, side_effects: ["status -> RECONCILED", "refund flows group.spent/allocated -> program.unallocated"] }

  # --- Venues ---
  - { method: POST, path: "/v1/venues", description: "Register a venue", roles: [DeiAdmin], code: 201, input: [name, capacity], output: Venue, side_effects: [] }
  - { method: GET, path: "/v1/venues/{id}", description: "Get venue", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: Venue, side_effects: [] }

  # --- Events ---
  - { method: POST, path: "/v1/events", description: "Plan an event (venue overlap + funding linkage checks)", roles: [GroupLeader, DeiAdmin], code: 201, input: [group_id, venue_id, title, category, starts_at, ends_at, capacity, "funding_request_id?"], output: ErgEvent, side_effects: ["status=PLANNED", "funding_status=RESERVED if linked APPROVED request else UNFUNDED"] }
  - { method: GET, path: "/v1/events/{id}", description: "Get event (incl. computed participation fields)", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: ErgEvent, side_effects: [] }
  - { method: GET, path: "/v1/events", description: "List events with filters + pagination", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: ["group_id?", "venue_id?", "funding_request_id?", "status?", "limit?", "offset?"], output: "ErgEvent[]", side_effects: [] }
  - { method: POST, path: "/v1/events/{id}/publish", description: "Publish event (re-checks group ACTIVE)", roles: [GroupLeader, DeiAdmin], code: 200, input: [], output: ErgEvent, side_effects: ["status -> PUBLISHED"] }
  - { method: POST, path: "/v1/events/{id}/reschedule", description: "Reschedule / move venue (OCC on event version)", roles: [GroupLeader, DeiAdmin], code: 200, input: [starts_at, ends_at, "venue_id?", expected_event_version], output: ErgEvent, side_effects: ["schedule updated", "increments ErgEvent.version by 1"] }
  - { method: POST, path: "/v1/events/{id}/cancel", description: "Cancel event; cascades RSVPs, releases funding hold", roles: [GroupLeader, DeiAdmin], code: 200, input: [], output: ErgEvent, side_effects: ["status -> CANCELLED", "RSVPs -> CANCELLED", "funding_status RESERVED -> RELEASED"] }
  - { method: POST, path: "/v1/events/{id}/complete", description: "Complete event after ends_at; freezes participation metrics + impact points", roles: [GroupLeader, DeiAdmin], code: 200, input: [], output: ErgEvent, side_effects: ["status -> COMPLETED", "metrics + impact_points frozen", "funding_status RESERVED -> SPENT"] }

  # --- RSVPs ---
  - { method: POST, path: "/v1/rsvps", description: "RSVP to a published event (REGISTERED if seat free else WAITLISTED)", roles: [Employee], code: 201, input: [event_id], output: EventRsvp, side_effects: ["seat accounting / waitlist_position assignment"] }
  - { method: GET, path: "/v1/rsvps/{id}", description: "Get RSVP", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: EventRsvp, side_effects: [] }
  - { method: GET, path: "/v1/rsvps", description: "List RSVPs with filters + pagination", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: ["event_id?", "employee_id?", "status?", "limit?", "offset?"], output: "EventRsvp[]", side_effects: [] }
  - { method: POST, path: "/v1/rsvps/{id}/cancel", description: "Cancel RSVP; frees seat and promotes waitlist head (manual cancel only)", roles: [Employee, GroupLeader, DeiAdmin], code: 200, input: [], output: EventRsvp, side_effects: ["status -> CANCELLED", "waitlist_promotion when a REGISTERED seat frees"] }
  - { method: POST, path: "/v1/rsvps/{id}/check-in", description: "Check in an attendee at/after event start", roles: [GroupLeader, DeiAdmin], code: 200, input: [], output: EventRsvp, side_effects: ["status REGISTERED -> CHECKED_IN", "event.checked_in_count += 1"] }

  # --- Climate surveys ---
  - { method: POST, path: "/v1/climate-surveys", description: "Create a climate survey", roles: [DeiAdmin], code: 201, input: [program_id, title, opens_at, closes_at, min_responses], output: ClimateSurvey, side_effects: ["status=DRAFT"] }
  - { method: GET, path: "/v1/climate-surveys/{id}", description: "Get survey (incl. provisional/final index)", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: ClimateSurvey, side_effects: [] }
  - { method: GET, path: "/v1/climate-surveys", description: "List surveys with filters + pagination", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: ["program_id?", "status?", "limit?", "offset?"], output: "ClimateSurvey[]", side_effects: [] }
  - { method: POST, path: "/v1/climate-surveys/{id}/open", description: "Open survey for responses (one OPEN per program)", roles: [DeiAdmin], code: 200, input: [], output: ClimateSurvey, side_effects: ["status -> OPEN"] }
  - { method: POST, path: "/v1/climate-surveys/{id}/close", description: "Close survey (requires min_responses); computes final_index and posture cascade", roles: [DeiAdmin], code: 200, input: [], output: ClimateSurvey, side_effects: ["status -> CLOSED", "final_index computed", "posture -> CLIMATE_REVIEW when final_index < 3.00"] }
  - { method: POST, path: "/v1/survey-responses", description: "Submit a survey response (one per respondent per survey)", roles: [Employee], code: 201, input: [survey_id, belonging_score, growth_score, fairness_score, safety_score], output: SurveyResponse, side_effects: ["response_score computed", "survey.response_count += 1"] }
  - { method: GET, path: "/v1/survey-responses/{id}", description: "Get survey response", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: SurveyResponse, side_effects: [] }
  - { method: GET, path: "/v1/survey-responses", description: "List survey responses with filters + pagination", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: ["survey_id?", "employee_id?", "limit?", "offset?"], output: "SurveyResponse[]", side_effects: [] }

  # --- Mentoring ---
  - { method: POST, path: "/v1/mentoring-engagements", description: "Propose a mentoring engagement (buffered-window + capacity checks)", roles: [Employee, DeiAdmin], code: 201, input: [program_id, sponsor_id, "mentee_employee_id?", starts_at, ends_at], output: MentoringEngagement, side_effects: ["status=PROPOSED"] }
  - { method: GET, path: "/v1/mentoring-engagements/{id}", description: "Get mentoring engagement", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: [], output: MentoringEngagement, side_effects: [] }
  - { method: GET, path: "/v1/mentoring-engagements", description: "List mentoring engagements with filters + pagination", roles: [DeiAdmin, ExecutiveSponsor, GroupLeader, Employee], code: 200, input: ["program_id?", "sponsor_id?", "mentee_employee_id?", "status?", "limit?", "offset?"], output: "MentoringEngagement[]", side_effects: [] }
  - { method: POST, path: "/v1/mentoring-engagements/{id}/sponsor-decision", description: "Sponsor accepts or declines a proposed engagement", roles: [ExecutiveSponsor], code: 200, input: [decision], output: MentoringEngagement, side_effects: ["status -> ACTIVE or DECLINED"] }
  - { method: POST, path: "/v1/mentoring-engagements/{id}/complete", description: "Complete or early-terminate an engagement", roles: [ExecutiveSponsor, DeiAdmin], code: 200, input: [outcome], output: MentoringEngagement, side_effects: ["status -> COMPLETED or EARLY_TERMINATED"] }

  # --- Test-driving clock ---
  - { method: POST, path: "/v1/_clock/set_current_utc", description: "Set the logical clock. Server startup default is 2026-08-01T00:00:00Z (before any set call the clock reads exactly this value, never wall-clock). Setting the clock runs the term-expiry sweep: LeadershipTerms with status ACTIVE and ends_at <= new time become EXPIRED, firing the leadership-gap cascade.", roles: [DeiAdmin], code: 200, input: [to_iso8601], output: null, side_effects: ["logical clock := to_iso8601", "term expiry sweep + gap cascade"] }

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role not one of DeiAdmin/ExecutiveSponsor/GroupLeader/Employee" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Caller role is not in the endpoint's roles list" }
  # --- Request / existence ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, type/enum/range violation (capacity <= 0, ends_at <= starts_at, score outside 1..5, counter_amount_cents missing on COUNTER, actual_spend_cents outside [0, disbursed_cents], to_status invalid for current state machine entry point, etc.)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource id does not exist" }
  # --- OCC ---
  - { id: ERR_STALE_GROUP_VERSION, http: 412, condition: "expected_group_version != ErgGroup.version on assign-sponsor" }
  - { id: ERR_STALE_EVENT_VERSION, http: 412, condition: "expected_event_version != ErgEvent.version on reschedule" }
  # --- State ---
  - { id: ERR_INVALID_STATE_TRANSITION, http: 409, condition: "Trigger not valid from the resource's current state (incl. terminal-state lockdown)" }
  - { id: ERR_PROGRAM_NOT_OPEN, http: 409, condition: "Program status is not in the required set (OPEN / ALLOCATION_LOCKED) for this operation" }
  - { id: ERR_PROGRAM_IN_CLIMATE_REVIEW, http: 409, condition: "Program posture is CLIMATE_REVIEW; new group chartering blocked" }
  - { id: ERR_ALLOCATION_NOT_LOCKED, http: 409, condition: "Funding approval requires program.status == ALLOCATION_LOCKED" }
  - { id: ERR_GROUP_NOT_ACTIVE, http: 409, condition: "Operation requires ErgGroup.status == ACTIVE (event create/publish, leadership term creation, funding request creation)" }
  - { id: ERR_GROUP_NOT_ACCEPTING_MEMBERS, http: 409, condition: "Group status not in {CHARTER_DRAFT, SUBMITTED, SPONSOR_ENDORSED, CHANGES_REQUESTED, ACTIVE}" }
  - { id: ERR_EVENT_NOT_PUBLISHED, http: 409, condition: "RSVP requires event.status == PUBLISHED" }
  - { id: ERR_SURVEY_NOT_OPEN, http: 409, condition: "Response submission requires survey.status == OPEN" }
  - { id: ERR_SURVEY_ALREADY_OPEN, http: 409, condition: "Another survey of the same program is already OPEN" }
  - { id: ERR_SPONSOR_NOT_ACTIVE, http: 409, condition: "Sponsor status must be ACTIVE for assignment, endorsement, mentoring acceptance" }
  - { id: ERR_LEADERSHIP_GAP, http: 409, condition: "Group has no ACTIVE leadership term; funding requests cannot be submitted" }
  # --- Referential ---
  - { id: ERR_CHARTER_NO_SPONSOR, http: 409, condition: "Charter submission requires an assigned sponsor" }
  - { id: ERR_SPONSOR_NOT_ASSIGNED, http: 409, condition: "Acting sponsor is not the group's assigned sponsor (or not the engagement's sponsor)" }
  - { id: ERR_FUNDING_REQUEST_WRONG_GROUP, http: 409, condition: "Event's funding_request_id belongs to a different group" }
  - { id: ERR_FUNDING_REQUEST_NOT_APPROVED, http: 409, condition: "Linked funding request is not in APPROVED status" }
  - { id: ERR_PREDECESSOR_MISMATCH, http: 409, condition: "predecessor_term_id is not the latest prior term of the group (max ends_at, tie-break max created_at), or a predecessor was supplied for the first term" }
  # --- Temporal ---
  - { id: ERR_VENUE_DOUBLE_BOOKED, http: 409, condition: "Venue has an overlapping PLANNED/PUBLISHED event (half-open interval semantics; touching endpoints allowed)" }
  - { id: ERR_MENTORING_WINDOW_CONFLICT, http: 409, condition: "Sponsor has a PROPOSED/ACTIVE engagement within the 14-day buffered window" }
  - { id: ERR_SURVEY_WINDOW_CLOSED, http: 409, condition: "Response submitted outside [opens_at, closes_at)" }
  - { id: ERR_CHECKIN_TOO_EARLY, http: 409, condition: "Check-in before event.starts_at" }
  - { id: ERR_EVENT_NOT_ENDED, http: 409, condition: "Completion before event.ends_at" }
  - { id: ERR_ACTIVE_TERM_EXISTS, http: 409, condition: "Group already has an ACTIVE leadership term" }
  # --- Constraint / uniqueness / aggregate ---
  - { id: ERR_GROUP_NAME_NOT_UNIQUE, http: 409, condition: "Another group in the same program has this name (non-terminal statuses)" }
  - { id: ERR_ALREADY_MEMBER, http: 409, condition: "An ACTIVE membership already exists for (group_id, employee_id)" }
  - { id: ERR_ALREADY_RSVPED, http: 409, condition: "An RSVP in {REGISTERED, WAITLISTED, CHECKED_IN} already exists for (event_id, employee_id)" }
  - { id: ERR_DUPLICATE_RESPONSE, http: 409, condition: "Respondent already submitted a response to this survey" }
  - { id: ERR_TERM_LIMIT_EXCEEDED, http: 409, condition: "Employee already holds 2 leadership terms (any status) in this group" }
  - { id: ERR_TERM_TENURE_NOT_MET, http: 409, condition: "Leader's ACTIVE membership joined_at is not <= now - 90 days" }
  - { id: ERR_CHARTER_INSUFFICIENT_FOUNDING_MEMBERS, http: 409, condition: "active_member_count < 10 at charter submission" }
  - { id: ERR_MIN_RESPONSES_NOT_MET, http: 409, condition: "response_count < min_responses at survey close" }
  - { id: ERR_MENTEE_ALREADY_ENGAGED, http: 409, condition: "Mentee already has a PROPOSED or ACTIVE engagement" }
  - { id: ERR_MENTORING_SELF_PAIRING, http: 400, condition: "sponsor.employee_id == mentee_employee_id" }
  - { id: ERR_SPONSOR_SELF_ENDORSEMENT, http: 403, condition: "Segregation of duties: sponsor.employee_id == funding request's created_by_employee_id" }
  # --- Fiscal / capacity ---
  - { id: ERR_INSUFFICIENT_GROUP_BUDGET, http: 402, condition: "approved_cents would exceed group.available_cents" }
  - { id: ERR_SPONSOR_CAPACITY_EXCEEDED, http: 409, condition: "Sponsor's active group assignments or mentoring engagements already at max" }
  - { id: ERR_VENUE_CAPACITY_EXCEEDED, http: 409, condition: "event.capacity > venue.capacity" }
  # --- Ownership ---
  - { id: ERR_NOT_GROUP_LEADER, http: 403, condition: "Caller is not the charter owner / current ACTIVE-term leader (or request submitter) for this leader-gated operation" }

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: DeiAdmin
    description: "Corporate DEI office operator; runs the program, allocation, approvals, surveys, terms, venues"
    identity: opaque
    exclusive_operations:
      - "POST /v1/programs, /open, /lock-allocation, /clear-climate-review"
      - "POST /v1/sponsors, /v1/sponsors/{id}/set-status"
      - "POST /v1/groups/{id}/assign-sponsor, /dei-decision, /set-status"
      - "POST /v1/leadership-terms"
      - "POST /v1/funding-requests/{id}/dei-decision, /disburse"
      - "POST /v1/venues"
      - "POST /v1/climate-surveys, /open, /close"
      - "POST /v1/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints; POST /v1/groups; POST /v1/memberships; POST /v1/memberships/{id}/leave; POST /v1/leadership-terms/{id}/resign; POST /v1/events, /publish, /reschedule, /cancel, /complete; POST /v1/rsvps/{id}/cancel, /check-in; POST /v1/mentoring-engagements, /complete"
  - name: ExecutiveSponsor
    description: "Executive sponsor of one or more groups; endorses charters and funding requests, mentors employees"
    identity: "entity_backed:ExecutiveSponsor"
    exclusive_operations:
      - "POST /v1/groups/{id}/sponsor-decision"
      - "POST /v1/funding-requests/{id}/sponsor-decision"
      - "POST /v1/mentoring-engagements/{id}/sponsor-decision"
    shared_operations:
      - "All GET endpoints; POST /v1/mentoring-engagements/{id}/complete (own engagements)"
  - name: GroupLeader
    description: "Charter owner pre-activation (== group.created_by_employee_id); current ACTIVE-term leader post-activation"
    identity: opaque
    exclusive_operations:
      - "POST /v1/groups/{id}/submit-charter"
      - "POST /v1/funding-requests"
      - "POST /v1/funding-requests/{id}/revise, /reconcile"
    shared_operations:
      - "All GET endpoints; POST /v1/groups; POST /v1/events, /publish, /reschedule, /cancel, /complete; POST /v1/rsvps/{id}/cancel, /check-in; POST /v1/memberships/{id}/leave; POST /v1/leadership-terms/{id}/resign"
  - name: Employee
    description: "Any employee (opaque HRIS id); joins groups, RSVPs, answers surveys, requests mentoring"
    identity: opaque
    exclusive_operations:
      - "POST /v1/rsvps"
      - "POST /v1/survey-responses"
    shared_operations:
      - "All GET endpoints; POST /v1/memberships; POST /v1/memberships/{id}/leave (own); POST /v1/rsvps/{id}/cancel (own); POST /v1/mentoring-engagements (as mentee)"
