          assert:
            - "the first sweep produces exactly one RegulatorReport with report_status == \"FILED\" and region_code == \"R1\""
            - "the qualifying count for acct-x's window is 3, not 4: the incident created at exactly 2026-09-01T00:00:00Z (window_start) is counted under the closed start, and the incident created at exactly 2026-10-01T00:00:00Z (window_end) is excluded under the open end"
            - "after the threshold is raised to 4, the second sweep produces zero RegulatorReports because 3 < 4"
            - "under a closed-closed window reading the same four rows would count 4 and the second sweep would also file, so the zero-report result is the observable that pins the closed-open semantics"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: dependency_decision_blocked_by_sibling_in_flight_appeal
        grounds:
          - state_machines.SafetyIncident.transitions.PENDING_DECISION_to_DECIDED
          - state_machines.Account.transitions.RESTRICTED_to_DEACTIVATED
          - validations[priority=14]
          - errors[ERR_IN_FLIGHT_APPEAL]
        distinguishing_aspect: |
          A transition on the SafetyIncident whose legality is decided entirely by the
          EnforcementAction's status, and whose repaired counterpart is decided by the
          Account's status — the same endpoint flips from refusal to success purely on the
          sibling entity's state.
        test_recipe:
          setup:
            - "Logical clock at 2026-10-01T00:00:00Z. R1 policy with sd_floor_severity S4 and appeal_window_days 30."
            - "One ACTIVE driver account whose first S4 PHYSICAL_ASSAULT incident resolved to RESTRICTED, so the account is RESTRICTED and carries one ACTIVE enforcement action."
            - "The second S4 PHYSICAL_ASSAULT incident is held, fully evidenced and pending decision."
            - "The appeal on the first incident has already been filed, moving the enforcement action to APPEAL_PENDING."
