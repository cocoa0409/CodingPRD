              payload: {}
              as: PartnerManager
              as_user_id: "${id}"
            - call: "POST /routing-assignments/${id}/complete"
              payload: {}
              as: PartnerManager
              as_user_id: "${id}"
            - call: "POST /weight-tickets/${id}/diversion-credits"
              payload: {}
              as: ZoneOperator
              captures: { c_id: $.data.id }
            - call: "POST /diversion-credits/${id}/finalize"
              payload: {}
              as: ZoneOperator
            - call: "POST /weight-tickets/${id}/contamination-reports"
              payload: { severity: "SEVERE", notes: "oil-soaked bale" }
              as: Inspector
              as_user_id: "insp-1"
