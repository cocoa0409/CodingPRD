            - "After paying both invoices, Project.payment_status == PAID_IN_FULL"
            - "Before completion, Project.fulfillment_status == SHIPPED (not COMPLETE) — dimensions are independent"
            - "After POST /complete, Project.fulfillment_status == COMPLETE"
            - "Project.${proj_id}.payment_status == PAID_IN_FULL"
            - "Project.${proj_id}.fulfillment_status == COMPLETE"

