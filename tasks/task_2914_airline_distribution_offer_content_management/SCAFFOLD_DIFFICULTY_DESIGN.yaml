              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /distribution-partners"
              payload: { partner_name: "Delta Travel Ltd", partner_type: "TRAVEL_AGENCY", iata_code: "44444440", home_country: "GB" }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { partner_delta_id: $.data.id }
            - call: "POST /fare-filings"
              payload: { fare_basis_code: "YGDS01", origin: "LHR", destination: "CDG", cabin: "ECONOMY", base_amount_cents: 20000, sale_from: "2026-07-01T00:00:00.000Z", sale_to: "2026-10-01T00:00:00.000Z", travel_from: "2026-09-01T00:00:00.000Z", travel_to: "2026-12-31T00:00:00.000Z", min_content_tier_rank: 1, refundable: true, is_private: false }
              as: PricingAnalyst
              as_user_id: "pa-001"
              captures: { gds_filing_id: $.data.id }
            - call: "POST /fare-filings/${gds_filing_id}/state"
              payload: { to_state: "FILED" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /fare-filings/${gds_filing_id}/state"
              payload: { to_state: "ACTIVE" }
              as: PricingAnalyst
              as_user_id: "pa-001"
            - call: "POST /offers"
              payload: { channel_id: "${channel_gds_id}", partner_id: "${partner_delta_id}", fare_filing_id: "${gds_filing_id}", trip_origin: "LHR", trip_destination: "CDG", departure_date: "2026-09-25T00:00:00.000Z", cabin: "ECONOMY" }
              as: Agency
              as_user_id: "${partner_delta_id}"
              captures: { offer_gds_id: $.data.id }
          trigger:
