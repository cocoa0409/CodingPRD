              payload: { plan_year: 2026, plan_name: "FY26 Below Floor", plan_period_start: "2026-01-01", plan_period_end: "2027-01-01", payment_date: "2027-03-15", company_weight_pct: 50.00, business_unit_weight_pct: 30.00, individual_weight_pct: 20.00, discretionary_budget_pct: 10.00 }
