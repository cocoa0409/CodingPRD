          - entities.Estimate.fields.parts_subtotal_cents
          - state_machines.RepairTicket.AWAITING_APPROVAL_to_REVISION_REQUESTED
        distinguishing_aspect: |
          Conserved quantity = the freshly presented Estimate.parts_subtotal_cents. Adding a
          RETAIL part (1080) then cancelling it and presenting a revision returns
          parts_subtotal_cents to its pre-order value 0 (revision total back to 6500 labor-only).
          Different conserved quantity (estimate parts cost) than instance 1's cash amount_paid.
        test_recipe:
          setup:
            - "Ticket, two QUOTED lines (4000 + 2500 = 6500 labor). First estimate presented (parts_subtotal 0) then rejected."
            - "A part (800 x1 RETAIL = 1080) requested then cancelled; a revision estimate presented -> parts_subtotal back to 0."
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: ShopManager
            - call: "POST /customers"
              payload: { full_name: "Parts Inv", email: "pinv@x.com", phone: "555-0017" }
              as: FrontDeskClerk
              captures: { cust_id: $.data.id }
            - call: "POST /service-types"
              payload: { code: "SHOE_SOLE", name: "Sole Replacement", item_category: "SHOE", base_price_cents: 4000, standard_turnaround_days: 3, warranty_days: 90 }
              as: ShopManager
              captures: { st_shoe: $.data.id }
            - call: "POST /service-types"
              payload: { code: "LEATHER_DYE", name: "Leather Recolor", item_category: "LEATHER", base_price_cents: 2500, standard_turnaround_days: 2, warranty_days: 30 }
              as: ShopManager
              captures: { st_leather: $.data.id }
            - call: "POST /technicians"
              payload: { display_name: "Tess Tech", skills: ["SHOE", "LEATHER"] }
              as: ShopManager
              captures: { tech_id: $.data.id }
            - call: "POST /repair-tickets"
              payload: { customer_id: "${cust_id}", assigned_technician_id: "${tech_id}" }
              as: FrontDeskClerk
              captures: { tkt_id: $.data.id, tkt_v0: $.data.version }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "SHOE", description: "derby", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_shoe: $.data.id }
            - call: "POST /ticket-items"
              payload: { ticket_id: "${tkt_id}", item_category: "LEATHER", description: "wallet", condition_grade: "GOOD" }
              as: FrontDeskClerk
              captures: { item_leather: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_shoe}", service_type_id: "${st_shoe}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_a: $.data.id }
            - call: "POST /service-lines"
              payload: { ticket_id: "${tkt_id}", ticket_item_id: "${item_leather}", service_type_id: "${st_leather}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { line_b: $.data.id }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est1: $.data.id }
            - call: "POST /estimates/${est1}/present"
              payload: { expected_ticket_version: "${tkt_v0}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est1_parts: $.data.parts_subtotal_cents }
            - call: "POST /estimates/${est1}/reject"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /parts-orders"
              payload: { ticket_id: "${tkt_id}", service_line_id: "${line_a}", part_name: "shank", supplier_cost_cents: 800, quantity: 1, lead_time_days: 2 }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { part_id: $.data.id }
            - call: "POST /parts-orders/${part_id}/cancel"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
            - call: "GET /repair-tickets/${tkt_id}"
              payload: {}
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { tkt_v1: $.data.version }
            - call: "POST /estimates"
              payload: { ticket_id: "${tkt_id}", authored_by_technician_id: "${tech_id}", supersedes_estimate_id: "${est1}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est2: $.data.id }
          trigger:
            - call: "POST /estimates/${est2}/present"
              payload: { expected_ticket_version: "${tkt_v1}" }
              as: RepairTechnician
              as_user_id: "${tech_id}"
              captures: { est2_parts: $.data.parts_subtotal_cents, est2_total: $.data.estimate_total_cents }
          assert:
            - "Estimate.${est1}.parts_subtotal_cents == 0"
            - "Estimate.${est2}.parts_subtotal_cents == 0"
            - "Estimate.${est2}.estimate_total_cents == 6500"
