              captures: { lgv: $.data.version }
            - call: "POST /leagues/${lg}/boundary-waivers"
              payload: { player_id: "${p1}", waiver_type: "RESIDENCY_BOUNDARY", reason: "grandfathered address", valid_from: "2027-01-01", valid_until: "2027-06-01", expected_league_version: "${lgv}" }
              as: LeagueAdministrator
              captures: { w1: $.data.id }
            - call: "POST /leagues/${lg}/boundary-waivers/${w1}/decide"
              payload: { action: "APPROVE" }
              as: DistrictAdministrator
            - call: "GET /leagues/${lg}"
              payload: {}
              as: LeagueAdministrator
              captures: { lgv2: $.data.version }
            - call: "POST /leagues/${lg}/boundary-waivers"
              payload: { player_id: "${p1}", waiver_type: "RESIDENCY_BOUNDARY", reason: "adjacent continuation", valid_from: "2027-06-01", valid_until: "2027-12-01", expected_league_version: "${lgv2}" }
              as: LeagueAdministrator
