            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-B", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_b: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_a}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_a: $.data.id } }
            - { call: "POST /cases/${case_a}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2025-08-02T00:00:00Z" }, as: CarrierAdmin }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_b}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_b: $.data.id } }
            - { call: "POST /cases/${case_b}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: CarrierAdmin }
          trigger:
            - { call: "GET /producers/${p_id}", payload: {}, as: ComplianceOfficer }
          assert:
            - "submitted_case_count_12m == 1 (case B at 2025-08-02 is inside the window; case A at exactly now-365d is excluded)"
            - "completed_exchange_count_12m == 0 and rescinded_exchange_count_12m == 0"

      - name: break_even_never_sentinel
        claim_type: correct_result
        grounds:
          - "calculations.break_even_years"
        distinguishing_aspect: "When the new contract's net growth (100 - 115 = -15 bps) never catches the old (500 - 95 = 405 bps) within 30 years, the sentinel 99 is returned instead of a year."
        test_recipe:
          setup: ["Producer, client, K_STD contract; FULL case in review"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { cv: $.data.version } }
          trigger:
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${cv}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 100 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
          assert:
            - "break_even_years == 99 (sentinel: never breaks even within MAX_PROJECTION_YEARS)"

      - name: dual_variant_surrender_corner
        claim_type: variant_divergence
        grounds:
          - "calculations.surrender_charge_schedule"
        excluded_because:
          difficulty_instance: surrender_charge_today_vs_settlement
          rationale: "Both variants computed and asserted with literal divergence in the named §1.8 instance."

      - name: dual_variant_churn_corner
        claim_type: variant_divergence
        grounds:
          - "calculations.producer_churn_metrics"
        excluded_because:
          difficulty_instance: rescission_rate_completed_vs_submitted_basis
          rationale: "Both denominator variants asserted (10000 vs 5000 bps) in the named §1.8 instance."

      - name: partial_basis_rounding_corner
        claim_type: precision
        grounds:
          - "calculations.tax_basis_allocation"
        excluded_because:
          difficulty_instance: partial_basis_allocation_rounding_order
          rationale: "Pinned multiply-then-divide rounding asserted with literal 2,666,666 in the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: submit_case_missing_auth_headers
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Requests without X-User-ID / X-User-Role are rejected at priority 1 before any role, existence, or state logic runs."
        test_recipe:
          setup: ["Producer, client, contract; DRAFT case"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
          trigger:
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}", captures: { err: $.data.error_id } }
          assert:
            - "With X-User-ID / X-User-Role headers omitted: HTTP 400 with error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"
            - "Case remains DRAFT"

      - name: segregation_of_duties_violation
        claim_type: violation_to_error
        grounds:
          - "validations[priority=8]"
          - "errors[ERR_DUTY_SEGREGATION_VIOLATION]"
        distinguishing_aspect: "The principal who also performed the suitability recommendation (same X-User-ID) cannot approve: step A and step B must be different people."
        test_recipe:
          setup: ["FULL case recommended by reviewer rev-1 (PENDING_PRINCIPAL)"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 }, { contract_year: 2, pct_bps: 600 }, { contract_year: 3, pct_bps: 500 }, { contract_year: 4, pct_bps: 400 }, { contract_year: 5, pct_bps: 300 }, { contract_year: 6, pct_bps: 200 }, { contract_year: 7, pct_bps: 100 } ], living_benefit_rider: true, rider_benefit_base_cents: 12000000, rider_annual_fee_bps: 95 }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7, new_product_bonus_bps: 100, new_product_annual_fee_bps: 115 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { cv: $.data.version } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "SUITABILITY_FORM" }, as: Producer, as_user_id: "${p_id}", captures: { d_2: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "IN_FORCE_ILLUSTRATION" }, as: Producer, as_user_id: "${p_id}", captures: { d_3: $.data.id } }
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_2}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_3}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/comparison-analyses", payload: { expected_case_version: "${cv}", assumed_old_growth_bps: 500, assumed_new_growth_bps: 600 }, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/recommend", payload: { rationale: "suitable" }, as: SuitabilityReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /cases/${case_id}/approve", payload: { rationale: "self approval" }, as: Principal, as_user_id: "rev-1", captures: { err: $.data.error_id } }
            - { call: "POST /cases/${case_id}/approve", payload: { rationale: "proper approval" }, as: Principal, as_user_id: "prin-1" }
          assert:
            - "Approve by 'rev-1' (the recommending reviewer): HTTP 409 with error_id == ERR_DUTY_SEGREGATION_VIOLATION"
            - "Case remains PENDING_PRINCIPAL after the violation"
            - "Approve by 'prin-1': HTTP 200, status == APPROVED, approved_by_id == 'prin-1'"

      - name: docs_incomplete_blocks_recommend
        claim_type: violation_to_error
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_REQUIRED_DOCUMENTS_INCOMPLETE]"
        distinguishing_aspect: "Two of three required doc types VERIFIED is not enough; the missing IN_FORCE_ILLUSTRATION blocks recommend."
        test_recipe:
          setup: ["Case in SUITABILITY_REVIEW with REPLACEMENT_DISCLOSURE and SUITABILITY_FORM VERIFIED; IN_FORCE_ILLUSTRATION never submitted"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "SUITABILITY_FORM" }, as: Producer, as_user_id: "${p_id}", captures: { d_2: $.data.id } }
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_2}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /cases/${case_id}/recommend", payload: { rationale: "premature" }, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_REQUIRED_DOCUMENTS_INCOMPLETE"
            - "Case remains SUITABILITY_REVIEW"

      - name: analysis_missing_blocks_recommend
        claim_type: violation_to_error
        grounds:
          - "validations[priority=11]"
          - "errors[ERR_ANALYSIS_MISSING]"
        distinguishing_aspect: "Documents alone do not satisfy the desk: with all three VERIFIED but no FINAL analysis, recommend fails with the analysis error (documents pass first, proving the ordering inside business_safety)."
        test_recipe:
          setup: ["Case in SUITABILITY_REVIEW with all three doc types VERIFIED; no ComparisonAnalysis created"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}", captures: { k_id: $.data.id } }
            - { call: "POST /cases", payload: { producer_id: "${p_id}", client_id: "${c_id}", existing_contract_id: "${k_id}", exchange_type: "FULL", new_product_code: "NP-7", new_product_surrender_years: 7 }, as: Producer, as_user_id: "${p_id}", captures: { case_id: $.data.id } }
            - { call: "POST /cases/${case_id}/submit", payload: {}, as: Producer, as_user_id: "${p_id}" }
            - { call: "POST /cases/${case_id}/start_review", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "REPLACEMENT_DISCLOSURE" }, as: Producer, as_user_id: "${p_id}", captures: { d_1: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "SUITABILITY_FORM" }, as: Producer, as_user_id: "${p_id}", captures: { d_2: $.data.id } }
            - { call: "POST /cases/${case_id}/documents", payload: { doc_type: "IN_FORCE_ILLUSTRATION" }, as: Producer, as_user_id: "${p_id}", captures: { d_3: $.data.id } }
            - { call: "POST /documents/${d_1}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_2}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
            - { call: "POST /documents/${d_3}/verify", payload: {}, as: SuitabilityReviewer, as_user_id: "rev-1" }
          trigger:
            - { call: "POST /cases/${case_id}/recommend", payload: { rationale: "no analysis yet" }, as: SuitabilityReviewer, as_user_id: "rev-1", captures: { err: $.data.error_id } }
          assert:
            - "HTTP 409 with error_id == ERR_ANALYSIS_MISSING (documents complete, so the documents check passed first)"
            - "Case remains SUITABILITY_REVIEW"

      - name: duplicate_contract_number_case_insensitive
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_DUPLICATE_CONTRACT_NUMBER]"
        distinguishing_aspect: "The (carrier_name, contract_number) uniqueness is case-insensitive: 'CN-A' collides with 'cn-a' for the same carrier."
        test_recipe:
          setup: ["Producer, client; contract CN-A registered"]
          setup_api_calls:
            - { call: "POST /producers", payload: { license_number: "LIC-001", full_name: "Pat Producer", home_state_code: "CA" }, as: CarrierAdmin, captures: { p_id: $.data.id } }
            - { call: "POST /clients", payload: { full_name: "Sue Senior", date_of_birth: "1960-01-01", state_code: "CA" }, as: Producer, as_user_id: "${p_id}", captures: { c_id: $.data.id } }
            - { call: "POST /contracts", payload: { client_id: "${c_id}", carrier_name: "OldLine", contract_number: "CN-A", issue_date: "2021-09-01", account_value_cents: 10000000, tax_basis_cents: 8000000, surrender_schedule: [ { contract_year: 1, pct_bps: 700 } ], living_benefit_rider: false }, as: Producer, as_user_id: "${p_id}" }
