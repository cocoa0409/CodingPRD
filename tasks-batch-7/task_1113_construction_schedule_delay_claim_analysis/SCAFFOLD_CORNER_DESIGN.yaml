              payload: { project_name: "P1", contract_start_date: "2026-05-01T00:00:00Z", contract_completion_date: "2026-06-30T00:00:00Z", liquidated_damages_daily_rate_cents: 100000, ld_cap_cents: 1000000 }
              as: ProjectControlsEngineer
