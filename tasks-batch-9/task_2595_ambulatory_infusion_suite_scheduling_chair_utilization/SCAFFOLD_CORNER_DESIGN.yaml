            - "Appointment.${ap_r}.chair_id == ${ch2} and schedule_status == 'TENTATIVE' — the ROUTINE visit keeps the chair it took before the flag was set"
            - "Chair.${ch2}.committed_minutes == 480 and Nurse.${nr1}.assigned_acuity_points == 6"
            - "GET /appointments filtered by booking_class == 'URGENT' returns exactly 1 row"

