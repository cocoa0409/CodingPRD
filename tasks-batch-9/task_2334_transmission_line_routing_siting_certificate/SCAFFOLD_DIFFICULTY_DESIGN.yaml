  - rule_id: compensating_invariant
    instances:

      - name: escrow_conservation_restored_by_payment_rescission
        grounds:
          - endpoints[POST /siting/projects/{projectId}/escrow-deposits].side_effects
          - endpoints[POST /siting/easement-tracts/{tractId}/payment-rescission].side_effects
          - entities.Project.fields.escrow_balance_cents
          - state_machines.EasementTract.PAID_to_RESCINDED
        distinguishing_aspect: |
          Conserved quantity = project escrow money: escrow_funded_cents must always equal
          escrow_balance_cents + escrow_disbursed_cents. A payment of 4163406 moves cents from balance
          to disbursed and the rescission moves exactly the same cents back, so after the compensating
          action the triple returns to (600000000, 600000000, 0) with no drift, while
          easement_committed_cents (a different ledger) is untouched at 4163406.
