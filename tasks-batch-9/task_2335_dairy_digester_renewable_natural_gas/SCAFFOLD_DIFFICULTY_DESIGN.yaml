            - call: "POST /credit-batches/${batch_id}/claim"
              payload: { claim_note: "Claim after certification" }
              as: ProgramAdministrator
              as_user_id: "u-program"
              captures: { claimed_qty: "$.data.credit_quantity_provisional" }
          assert:
            - "err_parent_state == ERR_PATHWAY_NOT_CERTIFIED"
            - "first call HTTP status == 409"
            - "CreditBatch.${batch_id}.status == DRAFT after the first call"
            - "CreditPathway.${pathway_id}.status == CERTIFIED after the second call"
            - "CreditPathway.${pathway_id}.certified_ci_score == -236.67"
            - "third call HTTP status == 200"
            - "claimed_qty == 36.111"
            - "CreditBatch.${batch_id}.status == CLAIMED"
            - "CreditBatch.${batch_id}.delivered_mmbtu == 120.280"
            - "CreditBatch.${batch_id}.ci_score_used == -236.67"
            - "CreditBatch.${batch_id}.credit_value_cents == null"

