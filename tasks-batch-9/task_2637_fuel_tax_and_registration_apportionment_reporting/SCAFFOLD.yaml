scenario: |
  Generate task harder than expert level!

  2637. Fuel Tax and Registration Apportionment Reporting (motor carrier tax compliance): jurisdiction mileage capture from telematics with gap detection and manual trip reconstruction, fuel purchase record collection with tax-paid gallons by jurisdiction, quarterly fuel tax return preparation with net tax or refund by jurisdiction and surcharge jurisdictions, apportioned registration application with estimated versus actual distance schedules, fleet additions, deletions and vehicle transfers mid-year with credential issuance, audit selection risk, record retention requirements and reconstructed-mileage penalties, decal, cab card and credential distribution to drivers, weight group and jurisdiction fee calculation

domain_name: fuel-tax-registration-apportionment
api_prefix: "/apportionment"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency

  entity_topology: graph
  # graph: Vehicle references Vehicle (replaced_vehicle_id), FleetChangeRequest is a
  # junction across RegistrationApplication x Vehicle x Vehicle, Credential is a junction
  # across Vehicle x RegistrationApplication x Driver, and jurisdiction coupling is by
  # natural code rather than by nesting. URL shapes are flat collections plus four
  # sub-resource reads; there is no single ownership tree.

  state_machine_shape: cyclic
  # TripRecord loops RECONSTRUCTED -> GAP_FLAGGED -> RECONSTRUCTED on review rejection;
  # FuelTaxReturn loops PREPARED -> RETURNED_FOR_CORRECTION -> PREPARED;
  # RegistrationApplication loops SUBMITTED -> RETURNED_FOR_CORRECTION -> SUBMITTED;
  # Vehicle carries two independent state dimensions on one row
  # (vehicle_status x credential_status) that advance on different triggers.

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  # The opaque X-User-ID that prepared a return may not file it; the opaque X-User-ID
  # that reconstructed a trip may not accept it. Role alone is never sufficient.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 15 entities, 45 endpoints, 8 state machines, 8 calculations, 2 OCC rules,
  # 3 transitive cascades of depth >= 4.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# 1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Registrant legal name as it appears on the IFTA license.
      - name: usdot_number
        type: string
        source: input
        description: USDOT number of the motor carrier.
        constraints: "unique across all Carrier rows; ERR_DUPLICATE_USDOT_NUMBER on collision"
      - name: base_jurisdiction_code
        type: string
        source: input
        description: Two-letter code of the base jurisdiction; must equal the jurisdiction_code of an existing Jurisdiction row (natural key, not an id FK).
      - name: bond_ceiling_amount
        type: number
        source: input
        description: Maximum FuelTaxReturn.total_amount_due the carrier may file without a bond rider.
        default: 5000.00
        constraints: ">= 0.00, 2 decimal places"
      - name: ifta_license_status
        type: enum
        source: system
        description: IFTA license standing; set to SUSPENDED by the retention-review cascade and to REVOKED by a second suspension.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED, REVOKED}"
      - name: irp_account_status
        type: enum
        source: system
        description: Apportioned-registration account standing; set to SUSPENDED when the carrier's IFTA license is REVOKED.
        default: ACTIVE
        constraints: "one of {ACTIVE, SUSPENDED}"
      - name: tax_paid_gallons_ytd
        type: number
        source: computed
        description: Conserved quantity — sum of FuelPurchase.gallons over this carrier's purchases with purchase_status == 'ACCEPTED' AND tax_paid_flag == true, 3 decimal places.
        default: 0.000
      - name: unsubstantiated_mileage_ratio
        type: number
        source: computed
        description: Share of this carrier's fleet distance that is not telematics-substantiated; see calculations.carrier_unsubstantiated_mileage_ratio. 4 decimal places.
        default: 0.0000
      - name: audit_flag
        type: boolean
        source: computed
        description: True exactly when unsubstantiated_mileage_ratio > 0.2500; recomputed on every TripRecord status change.
        default: false
      - name: latest_prepared_fleet_mpg
        type: number
        source: computed
        description: fleet_mpg written by the most recent successful prepare on any FuelTaxReturn of this carrier; null until the first prepare. 2 decimal places.
        constraints: "nullable"
      - name: suspension_count
        type: integer
        source: computed
        description: Number of times ifta_license_status has been set to SUSPENDED.
        default: 0

  - name: Jurisdiction
    parent: null
    common_fields: false
    fields:
      - name: jurisdiction_code
        type: string
        source: input
        description: Two-letter IFTA/IRP member jurisdiction code, e.g. "IL".
        constraints: "unique across all Jurisdiction rows; exactly 2 uppercase letters"
      - name: name
        type: string
        source: input
        description: Display name of the jurisdiction.
      - name: fuel_tax_rate_per_gallon
        type: number
        source: input
        description: Fuel tax rate applied to net taxable gallons, 4 decimal places.
        constraints: ">= 0.0000"
      - name: surcharge_rate_per_gallon
        type: number
        source: input
        description: Surcharge rate applied to FULL taxable gallons and never offset by tax-paid gallons, 4 decimal places.
        default: 0.0000
        constraints: ">= 0.0000"
      - name: is_surcharge_jurisdiction
        type: boolean
        source: computed
        description: True exactly when surcharge_rate_per_gallon > 0.0000.

  - name: WeightGroupFee
    parent: null
    common_fields: false
    fields:
      - name: jurisdiction_code
        type: string
        source: input
        description: Jurisdiction natural key this fee row belongs to; must match an existing Jurisdiction.jurisdiction_code.
      - name: weight_group_code
        type: string
        source: input
        description: Weight group label, e.g. "W80".
      - name: declared_weight_lbs
        type: integer
        source: input
        description: Maximum declared combined gross weight of the group in pounds.
      - name: annual_fee_amount
        type: number
        source: input
        description: Full-year apportionable registration fee for one vehicle of this weight group in this jurisdiction, 2 decimal places.
        constraints: "> 0.00; unique on (jurisdiction_code, weight_group_code)"

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the registrant that operates this power unit.
      - name: unit_number
        type: string
        source: input
        description: Carrier-assigned fleet unit number.
        constraints: "unique per (carrier_id, unit_number); ERR_DUPLICATE_UNIT_NUMBER on collision"
      - name: vin
        type: string
        source: input
        description: Vehicle identification number.
      - name: weight_group_code
        type: string
        source: input
        description: Weight group label used to look up WeightGroupFee rows for this unit.
      - name: factory_price_amount
        type: number
        source: input
        description: Factory price used by jurisdictions that assess value-based fees, 2 decimal places.
      - name: registration_year
        type: integer
        source: input
        description: Registration year whose apportioned fleet this unit belongs to.
      - name: vehicle_status
        type: enum
        source: system
        description: "Fleet dimension of this row's parallel state pair. One of {PENDING, ACTIVE, DELETED, TRANSFERRED}."
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, DELETED, TRANSFERRED}"
      - name: credential_status
        type: enum
        source: system
        description: >-
          Credential dimension of this row's parallel state pair, derived from this vehicle's
          Credential rows and advancing only on credential triggers (never on fleet triggers):
          'NONE' when no Credential of this vehicle has credential_status IN {ISSUED, DISTRIBUTED};
          'DISTRIBUTED' when at least one such Credential exists and every one of them has
          credential_status == 'DISTRIBUTED'; 'ISSUED' otherwise.
        default: NONE
        constraints: "one of {NONE, ISSUED, DISTRIBUTED}"
      - name: replaced_vehicle_id
        type: string
        source: system
        description: FK -> Vehicle.id; self-referential — set on the incoming unit when an approved TRANSFER FleetChangeRequest replaces an outgoing unit. Null otherwise.
        constraints: "nullable"
      - name: activated_on_date
        type: datetime
        source: system
        description: Logical-clock date on which vehicle_status became ACTIVE; null while PENDING.
        constraints: "nullable"

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier that employs this driver.
      - name: full_name
        type: string
        source: input
        description: Driver full name printed on the distribution log.
      - name: cdl_number
        type: string
        source: input
        description: Commercial driver license number.
        constraints: "unique per (carrier_id, cdl_number)"
      - name: driver_status
        type: enum
        source: system
        description: "One of {ACTIVE, INACTIVE}; set to INACTIVE when the employing carrier's irp_account_status becomes SUSPENDED."
        default: ACTIVE
        constraints: "one of {ACTIVE, INACTIVE}"

  - name: TripRecord
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier whose fleet distance this trip contributes to.
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the power unit that ran the trip.
      - name: trip_start_utc
        type: datetime
        source: input
        description: Trip start instant, ISO 8601 UTC with three fractional digits; the left edge of the half-open occupation interval on the vehicle.
      - name: trip_end_utc
        type: datetime
        source: input
        description: Trip end instant; the right edge (exclusive) of the half-open occupation interval on the vehicle.
        constraints: "must be strictly greater than trip_start_utc"
      - name: start_odometer
        type: number
        source: input
        description: Odometer reading at trip start, 1 decimal place.
      - name: end_odometer
        type: number
        source: input
        description: Odometer reading at trip end, 1 decimal place.
        constraints: "must be strictly greater than start_odometer"
      - name: odometer_delta_miles
        type: number
        source: computed
        description: "round(end_odometer - start_odometer, 1)."
      - name: gap_miles_from_previous
        type: number
        source: computed
        description: Unaccounted distance between the previous trip of the same vehicle and this one; see calculations.mileage_gap_detection. 1 decimal place.
        default: 0.0
      - name: mileage_source
        type: enum
        source: system
        description: "'TELEMATICS' at capture; flipped to 'MANUAL_RECONSTRUCTION' by a successful reconstruct. One of {TELEMATICS, MANUAL_RECONSTRUCTION}."
        default: TELEMATICS
        constraints: "one of {TELEMATICS, MANUAL_RECONSTRUCTION}"
      - name: trip_status
        type: enum
        source: system
        description: "One of {CAPTURED, GAP_FLAGGED, RECONSTRUCTED, ACCEPTED, REJECTED}."
        default: CAPTURED
        constraints: "one of {CAPTURED, GAP_FLAGGED, RECONSTRUCTED, ACCEPTED, REJECTED}"
      - name: reconstructed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the MileageAnalyst whose reconstruct call last wrote this row's legs; the segregation-of-duties check on review compares against it.
        constraints: "nullable"
      - name: supporting_document_reference
        type: string
        source: system
        description: Reference to the retained document (fuel receipt, dispatch log, toll statement) that substantiates the reconstruction.
        constraints: "nullable"
      - name: accepted_leg_miles_total
        type: number
        source: computed
        description: "round(sum of JurisdictionMileageLeg.leg_miles over this trip's legs with leg_status == 'ACTIVE', 1)."
        default: 0.0

  - name: JurisdictionMileageLeg
    parent: TripRecord
    common_fields: false
    fields:
      - name: trip_record_id
        type: string
        source: input
        description: FK -> TripRecord.id; the trip this leg decomposes.
      - name: jurisdiction_code
        type: string
        source: input
        description: Jurisdiction natural key the leg distance is attributed to; must match an existing Jurisdiction.jurisdiction_code.
      - name: leg_miles
        type: number
        source: input
        description: Distance run inside the jurisdiction, 1 decimal place.
        constraints: "> 0.0"
      - name: leg_sequence
        type: integer
        source: system
        description: Order of the leg within the trip, assigned from the 1-based position of the element in the submitted legs (or reconstructed_legs) array; the sort key whenever legs are processed in order. Never supplied by the client.
        constraints: ">= 1, unique per (trip_record_id, leg_status == 'ACTIVE')"
      - name: leg_status
        type: enum
        source: system
        description: "'ACTIVE' legs are the trip's current decomposition; a reconstruct or a return-for-correction voids the prior set. One of {ACTIVE, VOIDED}."
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"

  - name: FuelPurchase
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the carrier claiming the tax-paid gallons.
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the power unit fuelled.
      - name: jurisdiction_code
        type: string
        source: input
        description: Jurisdiction natural key where the fuel was purchased and tax was paid at the pump.
      - name: purchase_date
        type: string
        source: input
        description: Purchase date as YYYY-MM-DD; compared against the return's quarter window.
      - name: gallons
        type: number
        source: input
        description: Gallons purchased, 3 decimal places.
        constraints: "> 0.000"
      - name: tax_paid_flag
        type: boolean
        source: input
        description: True when jurisdiction fuel tax was paid at the pump; bulk untaxed fuel is false.
        default: true
      - name: receipt_reference
        type: string
        source: input
        description: Retained receipt identifier; absence blocks the auto-acceptance transition.
        constraints: "nullable"
      - name: purchase_status
        type: enum
        source: system
        description: "One of {RECORDED, ACCEPTED, DISALLOWED}; only ACCEPTED rows feed tax-paid gallons."
        default: RECORDED
        constraints: "one of {RECORDED, ACCEPTED, DISALLOWED}"
      - name: disallow_reason_code
        type: enum
        source: system
        description: "Reason recorded by the disallow action. One of {MISSING_RECEIPT, BULK_UNTAXED, DUPLICATE, AUDIT_ADJUSTMENT}."
        constraints: "nullable"

  - name: FuelTaxReturn
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the licensee filing the quarterly return.
      - name: filing_year
        type: integer
        source: input
        description: Calendar year of the reporting quarter.
      - name: filing_quarter
        type: integer
        source: input
        description: Reporting quarter 1..4; quarter windows are pinned in calculations.quarterly_fuel_tax_settlement.
        constraints: "one of {1, 2, 3, 4}"
      - name: settlement_basis
        type: enum
        source: system
        description: "Which variant of quarterly_fuel_tax_settlement produced the current line set. One of {PREPARER_BASIS, AUDIT_BASIS}."
        default: PREPARER_BASIS
        constraints: "one of {PREPARER_BASIS, AUDIT_BASIS}"
      - name: return_status
        type: enum
        source: system
        description: "One of {DRAFT, PREPARED, RETURNED_FOR_CORRECTION, FILED, AUDIT_ADJUSTED}."
        default: DRAFT
        constraints: "one of {DRAFT, PREPARED, RETURNED_FOR_CORRECTION, FILED, AUDIT_ADJUSTED}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the TaxPreparer whose prepare call produced the current line set.
        constraints: "nullable"
      - name: filed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceOfficer who filed the return; must differ from prepared_by_user_id.
        constraints: "nullable"
      - name: total_fleet_miles
        type: number
        source: computed
        description: Total effective jurisdiction miles included in the current line set, 1 decimal place.
        default: 0.0
      - name: total_tax_paid_gallons
        type: number
        source: computed
        description: Total ACCEPTED tax-paid gallons inside the quarter window, 3 decimal places.
        default: 0.000
      - name: fleet_mpg
        type: number
        source: computed
        description: "round(total_fleet_miles / total_tax_paid_gallons, 2); the ROUNDED value is what per-jurisdiction taxable gallons divide by."
        constraints: "nullable"
      - name: reconstructed_mileage_ratio
        type: number
        source: computed
        description: Share of total_fleet_miles contributed by MANUAL_RECONSTRUCTION trips in this quarter, 4 decimal places; drives the penalty threshold.
        default: 0.0000
      - name: total_net_tax_due
        type: number
        source: computed
        description: Sum of the ACTIVE ReturnJurisdictionLine.net_tax_amount values, 2 decimal places; negative means a net refund.
        default: 0.00
      - name: reconstruction_penalty_amount
        type: number
        source: computed
        description: Reconstructed-mileage penalty, 2 decimal places; see calculations.reconstructed_mileage_penalty.
        default: 0.00
      - name: total_amount_due
        type: number
        source: computed
        description: "round(total_net_tax_due + reconstruction_penalty_amount, 2); compared against Carrier.bond_ceiling_amount at filing."
        default: 0.00
      - name: audit_assessment_delta
        type: number
        source: computed
        description: "round(AUDIT_BASIS total_amount_due - the PREPARER_BASIS total_amount_due that was filed, 2); 0.00 until a retention review adjusts the return."
        default: 0.00
      - name: filed_at
        type: datetime
        source: system
        description: Logical-clock instant at which return_status became FILED.
        constraints: "nullable"

  - name: ReturnJurisdictionLine
    parent: FuelTaxReturn
    common_fields: false
    fields:
      - name: fuel_tax_return_id
        type: string
        source: input
        description: FK -> FuelTaxReturn.id; the return this jurisdiction line belongs to.
      - name: jurisdiction_code
        type: string
        source: computed
        description: Jurisdiction natural key of the line; one ACTIVE line per jurisdiction appearing in the quarter's legs or ACCEPTED purchases.
      - name: taxable_miles
        type: number
        source: computed
        description: Effective miles attributed to the jurisdiction under the return's settlement_basis, 1 decimal place.
      - name: taxable_gallons
        type: number
        source: computed
        description: "round(taxable_miles / FuelTaxReturn.fleet_mpg, 3)."
      - name: tax_paid_gallons
        type: number
        source: computed
        description: ACCEPTED tax-paid gallons purchased in this jurisdiction inside the quarter window, 3 decimal places.
      - name: net_taxable_gallons
        type: number
        source: computed
        description: "round(taxable_gallons - tax_paid_gallons, 3); negative means a credit position."
      - name: base_tax_amount
        type: number
        source: computed
        description: "round(net_taxable_gallons * Jurisdiction.fuel_tax_rate_per_gallon, 2)."
      - name: surcharge_amount
        type: number
        source: computed
        description: "round(taxable_gallons * Jurisdiction.surcharge_rate_per_gallon, 2) — assessed on FULL taxable gallons, never netted against tax_paid_gallons."
      - name: net_tax_amount
        type: number
        source: computed
        description: "round(base_tax_amount + surcharge_amount, 2)."
      - name: line_status
        type: enum
        source: system
        description: "'ACTIVE' lines are the return's current computation; prepare, return-for-correction and audit adjustment void the prior set. One of {ACTIVE, VOIDED}."
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"

  - name: RegistrationApplication
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the registrant applying for apportioned plates.
      - name: registration_year
        type: integer
        source: input
        description: Registration year being applied for.
        constraints: "unique per (carrier_id, registration_year) across applications whose application_status != 'RETURNED_FOR_CORRECTION'; ERR_DUPLICATE_APPLICATION_YEAR on collision"
      - name: weight_group_code
        type: string
        source: input
        description: Weight group declared for the whole apportioned fleet on this application; drives the WeightGroupFee lookup.
      - name: distance_basis
        type: enum
        source: input
        description: "Which variant of apportioned_registration_fee applies. One of {ACTUAL_DISTANCE_BASIS, ESTIMATED_DISTANCE_BASIS}."
        constraints: "one of {ACTUAL_DISTANCE_BASIS, ESTIMATED_DISTANCE_BASIS}"
      - name: application_status
        type: enum
        source: system
        description: "One of {DRAFT, SUBMITTED, RETURNED_FOR_CORRECTION, INVOICED, ISSUED}."
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, RETURNED_FOR_CORRECTION, INVOICED, ISSUED}"
      - name: prepared_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the TaxPreparer who created the application.
      - name: reviewed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceOfficer who last decided the application; must differ from prepared_by_user_id.
        constraints: "nullable"
      - name: apportioned_vehicle_count
        type: integer
        source: computed
        description: Count of Vehicle rows with carrier_id == this application's carrier_id, registration_year == this application's registration_year and vehicle_status IN {PENDING, ACTIVE}, frozen into the fee computation at INVOICED.
        default: 0
      - name: fleet_total_distance_miles
        type: number
        source: computed
        description: Denominator of the apportionment percentages, 1 decimal place; see calculations.apportioned_registration_fee.
        default: 0.0
      - name: base_fee_total
        type: number
        source: computed
        description: Sum of the ACTIVE DistanceScheduleLine.jurisdiction_fee_amount values at invoicing, 2 decimal places.
        default: 0.00
      - name: total_apportioned_fee
        type: number
        source: computed
        description: "Conserved quantity — round(base_fee_total + sum of FleetChangeRequest.fee_delta over this application's requests with change_status == 'APPROVED', 2)."
        default: 0.00
      - name: apportion_frozen_at
        type: datetime
        source: system
        description: Logical-clock instant at which the apportionment percentages were frozen (the INVOICE decision); null before that.
        constraints: "nullable"

  - name: DistanceScheduleLine
    parent: RegistrationApplication
    common_fields: false
    fields:
      - name: registration_application_id
        type: string
        source: input
        description: FK -> RegistrationApplication.id; the application whose distance schedule this line belongs to.
      - name: jurisdiction_code
        type: string
        source: input
        description: Jurisdiction natural key the distance is reported for; must match an existing Jurisdiction.jurisdiction_code.
        constraints: "unique per (registration_application_id, jurisdiction_code) among lines with line_status == 'ACTIVE'"
      - name: reported_distance_miles
        type: number
        source: input
        description: Distance reported by the registrant for the jurisdiction, 1 decimal place.
        constraints: "> 0.0"
      - name: effective_distance_miles
        type: number
        source: computed
        description: Distance actually used in the apportionment after the basis rule is applied, 1 decimal place; equals reported_distance_miles under ACTUAL_DISTANCE_BASIS.
        default: 0.0
      - name: apportion_percent
        type: number
        source: computed
        description: "round(effective_distance_miles / RegistrationApplication.fleet_total_distance_miles, 6); frozen at INVOICED and never recomputed by fleet changes."
        default: 0.000000
      - name: jurisdiction_fee_amount
        type: number
        source: computed
        description: "round(apportion_percent * WeightGroupFee.annual_fee_amount * RegistrationApplication.apportioned_vehicle_count, 2)."
        default: 0.00
      - name: line_status
        type: enum
        source: system
        description: "'ACTIVE' lines form the current schedule; a RETURN_FOR_CORRECTION decision voids the frozen set. One of {ACTIVE, VOIDED}."
        default: ACTIVE
        constraints: "one of {ACTIVE, VOIDED}"

  - name: FleetChangeRequest
    parent: null
    common_fields: true
    fields:
      - name: registration_application_id
        type: string
        source: input
        description: FK -> RegistrationApplication.id; the invoiced or issued application being supplemented.
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the unit added, deleted, or brought in by a transfer.
      - name: replaced_vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the outgoing unit on a TRANSFER request. Null for ADDITION and DELETION.
        constraints: "nullable; required exactly when change_type == 'TRANSFER'"
      - name: change_type
        type: enum
        source: input
        description: "One of {ADDITION, DELETION, TRANSFER}."
        constraints: "one of {ADDITION, DELETION, TRANSFER}"
      - name: effective_date
        type: string
        source: input
        description: Date the change takes effect as YYYY-MM-DD; must fall inside the application's registration_year.
      - name: prorate_months
        type: integer
        source: computed
        description: Months the fee delta is prorated over; see calculations.fleet_change_fee_delta.
        default: 0
      - name: fee_delta
        type: number
        source: computed
        description: Signed change to RegistrationApplication.total_apportioned_fee, 2 decimal places; negative for DELETION.
        default: 0.00
      - name: change_status
        type: enum
        source: system
        description: "One of {REQUESTED, APPROVED, REJECTED, REVERSED}."
        default: REQUESTED
        constraints: "one of {REQUESTED, APPROVED, REJECTED, REVERSED}"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the CarrierAdmin that filed the supplement (equals the carrier's id under entity_backed identity).
      - name: decided_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceOfficer who approved, rejected or reversed the request.
        constraints: "nullable"
      - name: reversal_reason_code
        type: enum
        source: system
        description: "Reason recorded by the reverse action. One of {CLERICAL_ERROR, VEHICLE_NOT_DELIVERED, JURISDICTION_REJECTION}."
        constraints: "nullable"

  - name: Credential
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: FK -> Vehicle.id; the unit the credential is printed for.
      - name: registration_application_id
        type: string
        source: input
        description: FK -> RegistrationApplication.id; the application whose issuance produced this credential.
      - name: distributed_to_driver_id
        type: string
        source: input
        description: FK -> Driver.id; the driver the credential was handed to. Null until distribution.
        constraints: "nullable"
      - name: credential_type
        type: enum
        source: system
        description: "One of {DECAL_SET, CAB_CARD, IFTA_LICENSE_COPY}; issuance creates exactly one of each per fleet vehicle."
        constraints: "one of {DECAL_SET, CAB_CARD, IFTA_LICENSE_COPY}"
      - name: registration_year
        type: integer
        source: system
        description: Registration year copied from the issuing application.
      - name: valid_from_date
        type: string
        source: system
        description: First day of the closed validity interval as YYYY-MM-DD; the logical-clock date of issuance unless overridden on the issue call.
      - name: valid_to_date
        type: string
        source: system
        description: Last day of the closed validity interval as YYYY-MM-DD; always December 31 of registration_year.
      - name: credential_status
        type: enum
        source: system
        description: "One of {ISSUED, DISTRIBUTED, VOIDED, REPLACED}."
        default: ISSUED
        constraints: "one of {ISSUED, DISTRIBUTED, VOIDED, REPLACED}"
      - name: distributed_at
        type: datetime
        source: system
        description: Logical-clock instant of distribution to the driver; null while ISSUED.
        constraints: "nullable"
      - name: voided_reason_code
        type: enum
        source: system
        description: "Reason recorded when the credential left {ISSUED, DISTRIBUTED}. One of {FLEET_DELETION, LICENSE_SUSPENSION, TRANSFER_REPLACEMENT}."
        constraints: "nullable"

  - name: AuditSelection
    parent: null
    common_fields: true
    fields:
      - name: carrier_id
        type: string
        source: input
        description: FK -> Carrier.id; the licensee being scored for audit selection.
      - name: selection_year
        type: integer
        source: input
        description: Filing year the selection covers; also selects the target FuelTaxReturn.
      - name: selection_quarter
        type: integer
        source: input
        description: Filing quarter the selection covers; with selection_year it selects the target FuelTaxReturn.
        constraints: "one of {1, 2, 3, 4}; unique per (carrier_id, selection_year, selection_quarter)"
      - name: late_filing_count
        type: integer
        source: input
        description: Number of late filings the audit desk observed for the carrier in the selection year.
        default: 0
        constraints: ">= 0"
      - name: retention_deficiency_count
        type: integer
        source: input
        description: Number of record-retention deficiencies the audit desk observed in the records request.
        default: 0
        constraints: ">= 0"
      - name: risk_score
        type: integer
        source: computed
        description: Integer 0..100 produced by calculations.audit_risk_score at creation and recomputed by the re-selection cascade.
        default: 0
      - name: post_review_risk_score
        type: integer
        source: computed
        description: Integer 0..100 produced by the retention review; null until the review runs.
        constraints: "nullable"
      - name: expected_records_count
        type: integer
        source: system
        description: Number of source records the audit desk requested, copied from the retention-review call; null until the review runs.
        constraints: "nullable; > 0"
      - name: records_missing_count
        type: integer
        source: system
        description: Number of requested records the carrier could not produce, copied from the retention-review call; null until the review runs.
        constraints: "nullable; >= 0 and <= expected_records_count"
      - name: retention_deficiency_ratio
        type: number
        source: computed
        description: "round(records_missing_count / expected_records_count, 4); null until the retention review runs."
        constraints: "nullable"
      - name: selection_status
        type: enum
        source: system
        description: "One of {SCORED, SELECTED, NOT_SELECTED, RETENTION_REVIEWED}."
        default: SCORED
        constraints: "one of {SCORED, SELECTED, NOT_SELECTED, RETENTION_REVIEWED}"
      - name: reviewed_by_user_id
        type: string
        source: system
        description: Opaque X-User-ID of the ComplianceOfficer who ran the retention review.
        constraints: "nullable"

# ---------------------------------------------------------------------------
# 1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: TripRecord
    initial_state: CAPTURED
    terminal_states: [REJECTED]
    transitions:
      - from: CAPTURED
        to: GAP_FLAGGED
        trigger: "system, evaluated inside POST /apportionment/trip-records"
        actor: system
        preconditions:
          - "calculations.mileage_gap_detection yields gap_miles_from_previous > GAP_TOLERANCE_MILES (5.0)"
        side_effects:
          - "gap_miles_from_previous is written with the computed gap"
          - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed per calculations.carrier_unsubstantiated_mileage_ratio; Carrier.version increments by 1"
        note: "A trip whose gap is exactly 5.0 stays CAPTURED — the comparison is strictly greater-than."

      - from: CAPTURED
        to: ACCEPTED
        trigger: "POST /apportionment/trip-records/{id}/review with decision == 'ACCEPT'"
        actor: ComplianceOfficer
        preconditions:
          - "trip_status == 'CAPTURED'"
          - "gap_miles_from_previous <= GAP_TOLERANCE_MILES (5.0)"
          - "Vehicle.vehicle_status != 'TRANSFERRED' for the trip's vehicle_id"
        side_effects:
          - "accepted_leg_miles_total is recomputed from the ACTIVE legs"
          - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed; Carrier.version increments by 1"

      - from: GAP_FLAGGED
        to: RECONSTRUCTED
        trigger: "POST /apportionment/trip-records/{id}/reconstruct"
        actor: MileageAnalyst
        preconditions:
          - "trip_status == 'GAP_FLAGGED'"
          - "trip_end_utc >= logical_clock - RECORD_RETENTION_DAYS (1460 days)"
          - "trip_end_utc >= logical_clock - RECONSTRUCTION_WINDOW_DAYS (120 days)"
          - "the submitted reconstructed_legs sum to odometer_delta_miles + gap_miles_from_previous within LEG_MILEAGE_TOLERANCE_MILES (0.5)"
        side_effects:
          - "the trip's ACTIVE JurisdictionMileageLeg rows become VOIDED and the submitted legs are inserted with leg_status 'ACTIVE'"
          - "mileage_source becomes 'MANUAL_RECONSTRUCTION'; reconstructed_by_user_id and supporting_document_reference are stamped"
          - "accepted_leg_miles_total is recomputed from the new ACTIVE legs"
          - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed; Carrier.version increments by 1"

      - from: RECONSTRUCTED
        to: ACCEPTED
        trigger: "POST /apportionment/trip-records/{id}/review with decision == 'ACCEPT'"
        actor: ComplianceOfficer
        preconditions:
          - "trip_status == 'RECONSTRUCTED'"
          - "X-User-ID != reconstructed_by_user_id (segregation of duties)"
          - "supporting_document_reference is not null"
        side_effects:
          - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed; Carrier.version increments by 1"

      - from: RECONSTRUCTED
        to: GAP_FLAGGED
        trigger: "POST /apportionment/trip-records/{id}/review with decision == 'REJECT'"
        actor: ComplianceOfficer
        preconditions:
          - "trip_status == 'RECONSTRUCTED'"
          - "X-User-ID != reconstructed_by_user_id (segregation of duties)"
        side_effects:
          - "the trip's ACTIVE legs become VOIDED; accepted_leg_miles_total resets to 0.0"
          - "supporting_document_reference and reconstructed_by_user_id are cleared to null; mileage_source stays 'MANUAL_RECONSTRUCTION'"
          - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed; Carrier.version increments by 1"
        note: "Revision loop — the analyst may reconstruct the same trip again, and a rejected reconstruction returns to the same GAP_FLAGGED state it came from."

      - from: GAP_FLAGGED
        to: REJECTED
        trigger: "POST /apportionment/trip-records/{id}/review with decision == 'REJECT'"
        actor: ComplianceOfficer
        preconditions:
          - "trip_status == 'GAP_FLAGGED'"
        side_effects:
          - "the trip's ACTIVE legs become VOIDED; accepted_leg_miles_total resets to 0.0"
          - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed (REJECTED trips leave both numerator and denominator); Carrier.version increments by 1"

      - from: CAPTURED
        to: REJECTED
        trigger: "POST /apportionment/trip-records/{id}/review with decision == 'REJECT'"
        actor: ComplianceOfficer
        preconditions:
          - "trip_status == 'CAPTURED'"
        side_effects:
          - "the trip's ACTIVE legs become VOIDED; accepted_leg_miles_total resets to 0.0"
          - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed; Carrier.version increments by 1"

      - from: ACCEPTED
        to: GAP_FLAGGED
        trigger: "system, second hop of the return-for-correction cascade fired by POST /apportionment/fuel-tax-returns/{id}/review with decision == 'RETURN_FOR_CORRECTION'"
        actor: system
        preconditions:
          - "the voided ReturnJurisdictionLine set of the corrected return covered this trip, i.e. trip_status == 'ACCEPTED' AND mileage_source == 'MANUAL_RECONSTRUCTION' AND carrier_id == the return's carrier_id AND trip_start_utc is inside the return's quarter window"
        side_effects:
          - "the trip's ACTIVE legs become VOIDED; accepted_leg_miles_total resets to 0.0; supporting_document_reference is cleared"
          - "third hop: because these trips left ACCEPTED, Carrier.unsubstantiated_mileage_ratio is recomputed and Carrier.audit_flag is re-derived against UNSUBSTANTIATED_AUDIT_FLAG_RATIO (0.1500); Carrier.version increments by 1"

  - entity: FuelPurchase
    initial_state: RECORDED
    terminal_states: [DISALLOWED]
    transitions:
      - from: RECORDED
        to: ACCEPTED
        trigger: "system, evaluated inside POST /apportionment/fuel-purchases"
        actor: system
        preconditions:
          - "receipt_reference is not null"
          - "tax_paid_flag == true"
        side_effects:
          - "Carrier.tax_paid_gallons_ytd becomes round(Carrier.tax_paid_gallons_ytd + gallons, 3) per calculations.tax_paid_gallons_by_jurisdiction; Carrier.version increments by 1"
        note: "A purchase with tax_paid_flag == false or a null receipt_reference stays RECORDED and never enters tax-paid gallons."

      - from: ACCEPTED
        to: DISALLOWED
        trigger: "POST /apportionment/fuel-purchases/{id}/disallow"
        actor: MileageAnalyst
        preconditions:
          - "purchase_status == 'ACCEPTED'"
          - "no FuelTaxReturn of the same carrier with return_status IN {FILED, AUDIT_ADJUSTED} has a quarter window containing purchase_date"
        side_effects:
          - "disallow_reason_code is stamped"
          - "Carrier.tax_paid_gallons_ytd is recomputed and therefore returns to its pre-creation value when the disallowed purchase was the only change; Carrier.version increments by 1"

      - from: RECORDED
        to: DISALLOWED
        trigger: "POST /apportionment/fuel-purchases/{id}/disallow"
        actor: MileageAnalyst
        preconditions:
          - "purchase_status == 'RECORDED'"
          - "no FuelTaxReturn of the same carrier with return_status IN {FILED, AUDIT_ADJUSTED} has a quarter window containing purchase_date"
        side_effects:
          - "disallow_reason_code is stamped; Carrier.tax_paid_gallons_ytd is unchanged because RECORDED gallons were never counted"

  - entity: FuelTaxReturn
    initial_state: DRAFT
    terminal_states: [AUDIT_ADJUSTED]
    transitions:
      - from: DRAFT
        to: PREPARED
        trigger: "POST /apportionment/fuel-tax-returns/{id}/prepare"
        actor: TaxPreparer
        preconditions:
          - "return_status == 'DRAFT'"
          - "Carrier.ifta_license_status == 'ACTIVE' for carrier_id"
          - "expected_carrier_version == Carrier.version (OCC, see concurrency_rules.return-prepare-stale-carrier)"
          - "at least one TripRecord of the carrier with trip_status == 'ACCEPTED' has trip_start_utc inside the quarter window"
          - "total_tax_paid_gallons computed over the window is > 0.000"
        side_effects:
          - "all ReturnJurisdictionLine rows of this return with line_status == 'ACTIVE' become VOIDED and a fresh ACTIVE line set is inserted per calculations.quarterly_fuel_tax_settlement variant PREPARER_BASIS"
          - "settlement_basis is set to 'PREPARER_BASIS'; total_fleet_miles, total_tax_paid_gallons, fleet_mpg, reconstructed_mileage_ratio, total_net_tax_due, reconstruction_penalty_amount and total_amount_due are written"
          - "prepared_by_user_id is stamped with the caller's X-User-ID"
          - "Carrier.latest_prepared_fleet_mpg is set to the computed fleet_mpg; Carrier.version increments by 1"

      - from: PREPARED
        to: PREPARED
        trigger: "POST /apportionment/fuel-tax-returns/{id}/prepare"
        actor: TaxPreparer
        preconditions:
          - "return_status == 'PREPARED'"
          - "Carrier.ifta_license_status == 'ACTIVE' for carrier_id"
          - "expected_carrier_version == Carrier.version (OCC, see concurrency_rules.return-prepare-stale-carrier)"
          - "at least one TripRecord of the carrier with trip_status == 'ACCEPTED' has trip_start_utc inside the quarter window"
          - "total_tax_paid_gallons computed over the window is > 0.000"
        side_effects:
          - "identical to the DRAFT -> PREPARED side-effect set: the prior ACTIVE line set is voided and legitimately superseded by the recomputed one"
        note: "Re-preparation is a supported product operation (new mileage or fuel evidence arrives), which is why the stale-parent conflict here is resolved by OCC on Carrier.version rather than by a state precondition."

      - from: RETURNED_FOR_CORRECTION
        to: PREPARED
        trigger: "POST /apportionment/fuel-tax-returns/{id}/prepare"
        actor: TaxPreparer
        preconditions:
          - "return_status == 'RETURNED_FOR_CORRECTION'"
          - "Carrier.ifta_license_status == 'ACTIVE' for carrier_id"
          - "expected_carrier_version == Carrier.version (OCC)"
          - "at least one TripRecord of the carrier with trip_status == 'ACCEPTED' has trip_start_utc inside the quarter window"
          - "total_tax_paid_gallons computed over the window is > 0.000"
        side_effects:
          - "identical to the DRAFT -> PREPARED side-effect set"
        note: "Correction loop — the reopened reconstructions must be re-substantiated and re-accepted before this transition can find any ACCEPTED mileage."

      - from: PREPARED
        to: FILED
        trigger: "POST /apportionment/fuel-tax-returns/{id}/review with decision == 'FILE'"
        actor: ComplianceOfficer
        preconditions:
          - "return_status == 'PREPARED'"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
          - "Carrier.ifta_license_status == 'ACTIVE' for carrier_id"
          - "total_amount_due <= Carrier.bond_ceiling_amount"
        side_effects:
          - "filed_by_user_id is stamped with the caller's X-User-ID; filed_at is stamped with the logical clock"
          - "the return's ACCEPTED TripRecord set and ACCEPTED FuelPurchase set for the quarter become locked: a later disallow on any covered purchase is rejected with ERR_PURCHASE_LOCKED_BY_FILED_RETURN"

      - from: PREPARED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /apportionment/fuel-tax-returns/{id}/review with decision == 'RETURN_FOR_CORRECTION'"
        actor: ComplianceOfficer
        preconditions:
          - "return_status == 'PREPARED'"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
        side_effects:
          - "first hop: all ACTIVE ReturnJurisdictionLine rows of this return become VOIDED; total_net_tax_due, reconstruction_penalty_amount, total_amount_due reset to 0.00; total_fleet_miles resets to 0.0; fleet_mpg resets to null; reconstructed_mileage_ratio resets to 0.0000"
          - "second hop: because the mileage basis was voided, every TripRecord of the carrier with trip_status == 'ACCEPTED' AND mileage_source == 'MANUAL_RECONSTRUCTION' AND trip_start_utc inside the quarter window transitions ACCEPTED -> GAP_FLAGGED (see the TripRecord machine)"
          - "third hop: because those trips left ACCEPTED, Carrier.unsubstantiated_mileage_ratio is recomputed and Carrier.audit_flag is re-derived; Carrier.version increments by 1"
          - "fourth hop: because Carrier.audit_flag became true, every AuditSelection of the carrier with selection_year == filing_year AND selection_status == 'NOT_SELECTED' transitions NOT_SELECTED -> SELECTED and its risk_score is recomputed with the new ratio"

      - from: FILED
        to: AUDIT_ADJUSTED
        trigger: "system, first hop of the retention-review cascade fired by POST /apportionment/audit-selections/{id}/retention-review"
        actor: system
        preconditions:
          - "return_status == 'FILED'"
          - "this return is the unique FuelTaxReturn with carrier_id == the selection's carrier_id AND filing_year == selection_year AND filing_quarter == selection_quarter AND return_status == 'FILED'"
        side_effects:
          - "all ACTIVE ReturnJurisdictionLine rows become VOIDED and a fresh ACTIVE set is inserted per calculations.quarterly_fuel_tax_settlement variant AUDIT_BASIS"
          - "settlement_basis becomes 'AUDIT_BASIS'; total_fleet_miles, fleet_mpg, reconstructed_mileage_ratio, total_net_tax_due, reconstruction_penalty_amount and total_amount_due are rewritten"
          - "audit_assessment_delta is written as round(the AUDIT_BASIS total_amount_due - the total_amount_due that was filed, 2)"
          - "second hop: because the return was adjusted, AuditSelection.post_review_risk_score is computed and the Carrier license machine reacts to it (see the Carrier machine)"

  - entity: RegistrationApplication
    initial_state: DRAFT
    terminal_states: [ISSUED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /apportionment/registration-applications/{id}/submit"
        actor: TaxPreparer
        preconditions:
          - "application_status == 'DRAFT'"
          - "at least one DistanceScheduleLine with line_status == 'ACTIVE' exists"
          - "an ACTIVE line exists whose jurisdiction_code == Carrier.base_jurisdiction_code"
          - "apportioned_vehicle_count >= 1"
          - "Carrier.irp_account_status == 'ACTIVE'"
        side_effects:
          - "apportioned_vehicle_count is recomputed from the carrier's Vehicle rows for registration_year with vehicle_status IN {PENDING, ACTIVE}"

      - from: RETURNED_FOR_CORRECTION
        to: SUBMITTED
        trigger: "POST /apportionment/registration-applications/{id}/submit"
        actor: TaxPreparer
        preconditions:
          - "application_status == 'RETURNED_FOR_CORRECTION'"
          - "at least one DistanceScheduleLine with line_status == 'ACTIVE' exists (the prior set was voided, so new lines must have been added)"
          - "an ACTIVE line exists whose jurisdiction_code == Carrier.base_jurisdiction_code"
          - "apportioned_vehicle_count >= 1"
          - "Carrier.irp_account_status == 'ACTIVE'"
        side_effects:
          - "apportioned_vehicle_count is recomputed"
        note: "Correction loop — an application may bounce between SUBMITTED and RETURNED_FOR_CORRECTION any number of times."

      - from: SUBMITTED
        to: INVOICED
        trigger: "POST /apportionment/registration-applications/{id}/review with decision == 'INVOICE'"
        actor: ComplianceOfficer
        preconditions:
          - "application_status == 'SUBMITTED'"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
          - "a WeightGroupFee row exists for every ACTIVE line's jurisdiction_code paired with this application's weight_group_code"
        side_effects:
          - "calculations.apportioned_registration_fee runs under the application's distance_basis: effective_distance_miles, fleet_total_distance_miles, apportion_percent and jurisdiction_fee_amount are written on every ACTIVE line"
          - "base_fee_total and total_apportioned_fee are written; apportion_frozen_at is stamped with the logical clock, freezing the percentages against all later fleet changes"
          - "reviewed_by_user_id is stamped"
          - "cascade: every Vehicle of the carrier for registration_year with vehicle_status == 'PENDING' transitions PENDING -> ACTIVE and activated_on_date is stamped"

      - from: SUBMITTED
        to: RETURNED_FOR_CORRECTION
        trigger: "POST /apportionment/registration-applications/{id}/review with decision == 'RETURN_FOR_CORRECTION'"
        actor: ComplianceOfficer
        preconditions:
          - "application_status == 'SUBMITTED'"
          - "X-User-ID != prepared_by_user_id (segregation of duties)"
        side_effects:
          - "all DistanceScheduleLine rows with line_status == 'ACTIVE' become VOIDED"
          - "fleet_total_distance_miles resets to 0.0; base_fee_total and total_apportioned_fee reset to 0.00; apportion_frozen_at resets to null"
          - "reviewed_by_user_id is stamped"

      - from: INVOICED
        to: ISSUED
        trigger: "POST /apportionment/registration-applications/{id}/issue-credentials"
        actor: ComplianceOfficer
        preconditions:
          - "application_status == 'INVOICED'"
          - "Carrier.ifta_license_status == 'ACTIVE'"
          - "at least one Vehicle of the carrier for registration_year has vehicle_status == 'ACTIVE'"
        side_effects:
          - "for every Vehicle of the carrier for registration_year with vehicle_status == 'ACTIVE', three Credential rows are created with credential_status 'ISSUED' and credential_type DECAL_SET, CAB_CARD and IFTA_LICENSE_COPY; valid_from_date is the supplied valid_from_date or the logical-clock date, valid_to_date is December 31 of registration_year"
          - "cascade: each of those vehicles' credential_status is re-derived and becomes 'ISSUED'"

  - entity: Vehicle
    state_dimensions:
      - dimension: vehicle_status
        field: vehicle_status
        initial_state: PENDING
        terminal_states: [TRANSFERRED]
        transitions:
          - from: PENDING
            to: ACTIVE
            trigger: "system, cascade of POST /apportionment/registration-applications/{id}/review with decision == 'INVOICE'"
            actor: system
            preconditions:
              - "vehicle_status == 'PENDING'"
              - "the vehicle's registration_year == the invoiced application's registration_year and the vehicle's carrier_id == the application's carrier_id"
            side_effects:
              - "activated_on_date is stamped with the logical-clock date"
          - from: PENDING
            to: ACTIVE
            trigger: "system, cascade of POST /apportionment/fleet-change-requests/{id}/decide with decision == 'APPROVE' on change_type IN {ADDITION, TRANSFER}"
            actor: system
            preconditions:
              - "vehicle_status == 'PENDING'"
              - "this vehicle is the change request's vehicle_id"
            side_effects:
              - "activated_on_date is stamped with the change request's effective_date"
          - from: ACTIVE
            to: DELETED
            trigger: "system, cascade of POST /apportionment/fleet-change-requests/{id}/decide with decision == 'APPROVE' on change_type == 'DELETION'"
            actor: system
            preconditions:
              - "vehicle_status == 'ACTIVE'"
              - "this vehicle is the change request's vehicle_id"
            side_effects:
              - "next hop: every Credential of this vehicle with credential_status IN {ISSUED, DISTRIBUTED} becomes VOIDED with voided_reason_code 'FLEET_DELETION'"
          - from: ACTIVE
            to: TRANSFERRED
            trigger: "system, cascade of POST /apportionment/fleet-change-requests/{id}/decide with decision == 'APPROVE' on change_type == 'TRANSFER'"
            actor: system
            preconditions:
              - "vehicle_status == 'ACTIVE'"
              - "this vehicle is the change request's replaced_vehicle_id"
            side_effects:
              - "next hop: every Credential of this vehicle with credential_status IN {ISSUED, DISTRIBUTED} becomes REPLACED"
          - from: DELETED
            to: ACTIVE
            trigger: "system, cascade of POST /apportionment/fleet-change-requests/{id}/reverse on an APPROVED change_type == 'DELETION'"
            actor: system
            preconditions:
              - "vehicle_status == 'DELETED'"
              - "this vehicle is the reversed change request's vehicle_id"
            side_effects:
              - "credentials voided with voided_reason_code 'FLEET_DELETION' are NOT un-voided; the vehicle's derived credential_status therefore returns 'NONE' until new credentials are issued"
          - from: ACTIVE
            to: PENDING
            trigger: "system, cascade of POST /apportionment/fleet-change-requests/{id}/reverse on an APPROVED change_type == 'ADDITION'"
            actor: system
            preconditions:
              - "vehicle_status == 'ACTIVE'"
              - "this vehicle is the reversed change request's vehicle_id"
            side_effects:
              - "activated_on_date resets to null"
      - dimension: credential_status
        field: credential_status
        initial_state: NONE
        terminal_states: []
        derived: true
        derivation: "'NONE' when the vehicle has no Credential with credential_status IN {ISSUED, DISTRIBUTED}; 'DISTRIBUTED' when at least one such Credential exists and every one of them is DISTRIBUTED; otherwise 'ISSUED'"
        transitions:
          - from: NONE
            to: ISSUED
            trigger: "system, re-derivation after POST /apportionment/registration-applications/{id}/issue-credentials creates this vehicle's Credential rows"
            actor: system
            preconditions:
              - "at least one Credential of this vehicle is now ISSUED"
            side_effects: []
          - from: ISSUED
            to: DISTRIBUTED
            trigger: "system, re-derivation after POST /apportionment/credentials/{id}/distribute"
            actor: system
            preconditions:
              - "every Credential of this vehicle with credential_status IN {ISSUED, DISTRIBUTED} is now DISTRIBUTED"
            side_effects: []
          - from: DISTRIBUTED
            to: ISSUED
            trigger: "system, re-derivation after a new Credential is issued to a vehicle whose earlier credentials were all distributed"
            actor: system
            preconditions:
              - "at least one Credential of this vehicle is ISSUED and at least one is DISTRIBUTED"
            side_effects: []
          - from: DISTRIBUTED
            to: NONE
            trigger: "system, re-derivation after every Credential of this vehicle is VOIDED or REPLACED"
            actor: system
            preconditions:
              - "no Credential of this vehicle has credential_status IN {ISSUED, DISTRIBUTED}"
            side_effects: []
          - from: ISSUED
            to: NONE
            trigger: "system, re-derivation after every Credential of this vehicle is VOIDED or REPLACED"
            actor: system
            preconditions:
              - "no Credential of this vehicle has credential_status IN {ISSUED, DISTRIBUTED}"
            side_effects: []
    note: "The two dimensions move independently: a DELETION cascade drives vehicle_status ACTIVE -> DELETED and, through the credential void, credential_status DISTRIBUTED -> NONE, while POST /apportionment/credentials/{id}/distribute moves only credential_status."

  - entity: FleetChangeRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, REVERSED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /apportionment/fleet-change-requests/{id}/decide with decision == 'APPROVE'"
        actor: ComplianceOfficer
        preconditions:
          - "change_status == 'REQUESTED'"
          - "the parent RegistrationApplication.application_status IN {INVOICED, ISSUED} (a mid-year supplement can only be priced against frozen percentages)"
          - "Carrier.irp_account_status == 'ACTIVE' for the application's carrier_id"
          - "effective_date falls inside the application's registration_year"
          - "for change_type == 'ADDITION': the target Vehicle.vehicle_status == 'PENDING'"
          - "for change_type == 'DELETION': the target Vehicle.vehicle_status == 'ACTIVE'"
          - "for change_type == 'TRANSFER': the target Vehicle.vehicle_status == 'PENDING' AND the replaced Vehicle.vehicle_status == 'ACTIVE'"
        side_effects:
          - "fee_delta and prorate_months are written per calculations.fleet_change_fee_delta using the application's frozen apportion_percent set"
          - "decided_by_user_id is stamped"
          - "RegistrationApplication.total_apportioned_fee becomes round(base_fee_total + the sum of fee_delta over the application's APPROVED FleetChangeRequest rows, 2); apportioned_vehicle_count is adjusted by +1 for ADDITION, -1 for DELETION and 0 for TRANSFER; RegistrationApplication.version increments by 1"
          - "the Vehicle dimension cascade runs (see the Vehicle machine), which in turn cascades onto Credential rows"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /apportionment/fleet-change-requests/{id}/decide with decision == 'REJECT'"
        actor: ComplianceOfficer
        preconditions:
          - "change_status == 'REQUESTED'"
        side_effects:
          - "decided_by_user_id is stamped; fee_delta stays 0.00 and no Vehicle or Credential row is touched"
          - "RegistrationApplication.version increments by 1"
      - from: APPROVED
        to: REVERSED
        trigger: "POST /apportionment/fleet-change-requests/{id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "change_status == 'APPROVED'"
          - "change_type IN {ADDITION, DELETION} (an approved TRANSFER is not reversible)"
          - "the parent RegistrationApplication.application_status IN {INVOICED, ISSUED}"
        side_effects:
          - "reversal_reason_code is stored"
          - "the row stops counting as APPROVED, so RegistrationApplication.total_apportioned_fee is recomputed as round(base_fee_total + the sum of fee_delta over the remaining APPROVED rows, 2) and returns to exactly its pre-approval value; apportioned_vehicle_count is likewise restored; RegistrationApplication.version increments by 1"
          - "the Vehicle status cascade is undone (ACTIVE -> PENDING for a reversed ADDITION, DELETED -> ACTIVE for a reversed DELETION)"
          - "fee_delta is retained on the reversed row as an audit trail and is never re-added"

  - entity: Credential
    initial_state: ISSUED
    terminal_states: [VOIDED, REPLACED]
    transitions:
      - from: ISSUED
        to: DISTRIBUTED
        trigger: "POST /apportionment/credentials/{id}/distribute"
        actor: CarrierAdmin
        preconditions:
          - "credential_status == 'ISSUED'"
          - "the target Driver.carrier_id equals the credential's vehicle's carrier_id"
          - "Driver.driver_status == 'ACTIVE'"
          - "no other Credential of the same credential_type already DISTRIBUTED to this driver has a [valid_from_date, valid_to_date] window that overlaps this credential's window once BOTH windows are expanded by DRIVER_HANDOVER_BUFFER_DAYS (2) on each side — i.e. the two windows need more than 4 clear days between them"
        side_effects:
          - "distributed_to_driver_id and distributed_at are stamped"
          - "the owning Vehicle.credential_status is re-derived"
      - from: ISSUED
        to: VOIDED
        trigger: "system, cascade of a DELETION approval or of a license suspension"
        actor: system
        preconditions:
          - "credential_status == 'ISSUED'"
        side_effects:
          - "voided_reason_code is set to 'FLEET_DELETION' or 'LICENSE_SUSPENSION' depending on the originating cascade"
          - "the owning Vehicle.credential_status is re-derived"
      - from: DISTRIBUTED
        to: VOIDED
        trigger: "system, cascade of a DELETION approval or of a license suspension"
        actor: system
        preconditions:
          - "credential_status == 'DISTRIBUTED'"
        side_effects:
          - "voided_reason_code is set to 'FLEET_DELETION' or 'LICENSE_SUSPENSION' depending on the originating cascade"
          - "distributed_to_driver_id is retained so the driver handover trail survives the void"
          - "the owning Vehicle.credential_status is re-derived"
      - from: ISSUED
        to: REPLACED
        trigger: "system, cascade of a TRANSFER approval on the outgoing vehicle"
        actor: system
        preconditions:
          - "credential_status == 'ISSUED'"
          - "the owning Vehicle is the change request's replaced_vehicle_id"
        side_effects:
          - "voided_reason_code is set to 'TRANSFER_REPLACEMENT'"
          - "the outgoing Vehicle.credential_status is re-derived"
      - from: DISTRIBUTED
        to: REPLACED
        trigger: "system, cascade of a TRANSFER approval on the outgoing vehicle"
        actor: system
        preconditions:
          - "credential_status == 'DISTRIBUTED'"
          - "the owning Vehicle is the change request's replaced_vehicle_id"
        side_effects:
          - "voided_reason_code is set to 'TRANSFER_REPLACEMENT'"
          - "the outgoing Vehicle.credential_status is re-derived; the freed driver window becomes available again for a later distribution"

  - entity: AuditSelection
    initial_state: SCORED
    terminal_states: [RETENTION_REVIEWED]
    transitions:
      - from: SCORED
        to: SELECTED
        trigger: "system, evaluated inside POST /apportionment/audit-selections"
        actor: system
        preconditions:
          - "risk_score >= AUDIT_SELECTION_THRESHOLD (70)"
        side_effects:
          - "Carrier.audit_flag becomes true; Carrier.version increments by 1"
      - from: SCORED
        to: NOT_SELECTED
        trigger: "system, evaluated inside POST /apportionment/audit-selections"
        actor: system
        preconditions:
          - "risk_score < AUDIT_SELECTION_THRESHOLD (70)"
        side_effects: []
      - from: NOT_SELECTED
        to: SELECTED
        trigger: "system, fourth hop of the return-for-correction cascade"
        actor: system
        preconditions:
          - "selection_status == 'NOT_SELECTED'"
          - "selection_year == the corrected return's filing_year and the carrier matches"
          - "the recomputed risk_score is >= AUDIT_SELECTION_THRESHOLD (70)"
        side_effects:
          - "risk_score is rewritten from the carrier's recomputed unsubstantiated_mileage_ratio"
          - "Carrier.audit_flag becomes true"
      - from: SELECTED
        to: RETENTION_REVIEWED
        trigger: "POST /apportionment/audit-selections/{id}/retention-review"
        actor: ComplianceOfficer
        preconditions:
          - "selection_status == 'SELECTED'"
          - "records_missing_count <= expected_records_count and expected_records_count >= 1"
          - "exactly one FuelTaxReturn of the carrier with filing_year == selection_year AND filing_quarter == selection_quarter has return_status == 'FILED'"
        side_effects:
          - "expected_records_count, records_missing_count and retention_deficiency_ratio are written; reviewed_by_user_id is stamped"
          - "post_review_risk_score is written per calculations.audit_risk_score"
          - "cascade hop: the matching FILED FuelTaxReturn is re-settled on AUDIT_BASIS and becomes AUDIT_ADJUSTED"
          - "cascade hop: the Carrier license dimensions react to post_review_risk_score (see the Carrier machine)"

  - entity: Carrier
    state_dimensions:
      - dimension: ifta_license_status
        field: ifta_license_status
        initial_state: ACTIVE
        terminal_states: [REVOKED]
        transitions:
          - from: ACTIVE
            to: SUSPENDED
            trigger: "system, cascade of POST /apportionment/audit-selections/{id}/retention-review"
            actor: system
            preconditions:
              - "ifta_license_status == 'ACTIVE'"
              - "post_review_risk_score >= LICENSE_SUSPENSION_THRESHOLD (90)"
              - "the selection's retention_deficiency_ratio < 1.0000"
            side_effects:
              - "suspension_count increments by 1; Carrier.version increments by 1"
              - "next hop: every Credential of the carrier's vehicles with credential_type == 'IFTA_LICENSE_COPY' and credential_status IN {ISSUED, DISTRIBUTED} becomes VOIDED with voided_reason_code 'LICENSE_SUSPENSION'"
          - from: ACTIVE
            to: REVOKED
            trigger: "system, cascade of POST /apportionment/audit-selections/{id}/retention-review"
            actor: system
            preconditions:
              - "ifta_license_status == 'ACTIVE'"
              - "post_review_risk_score >= LICENSE_SUSPENSION_THRESHOLD (90)"
              - "the selection's retention_deficiency_ratio == 1.0000 (no record of the period survived retention)"
            side_effects:
              - "suspension_count increments by 1; Carrier.version increments by 1"
              - "next hop: every Credential of the carrier's vehicles with credential_type == 'IFTA_LICENSE_COPY' and credential_status IN {ISSUED, DISTRIBUTED} becomes VOIDED with voided_reason_code 'LICENSE_SUSPENSION'"
              - "next hop: irp_account_status moves ACTIVE -> SUSPENDED (see the other dimension)"
          - from: SUSPENDED
            to: REVOKED
            trigger: "system, cascade of a later POST /apportionment/audit-selections/{id}/retention-review"
            actor: system
            preconditions:
              - "ifta_license_status == 'SUSPENDED'"
              - "post_review_risk_score >= LICENSE_SUSPENSION_THRESHOLD (90)"
            side_effects:
              - "suspension_count increments by 1; Carrier.version increments by 1"
              - "next hop: irp_account_status moves ACTIVE -> SUSPENDED"
      - dimension: irp_account_status
        field: irp_account_status
        initial_state: ACTIVE
        terminal_states: [SUSPENDED]
        transitions:
          - from: ACTIVE
            to: SUSPENDED
            trigger: "system, cascade of the ifta_license_status transition into REVOKED"
            actor: system
            preconditions:
              - "irp_account_status == 'ACTIVE'"
              - "ifta_license_status has just become 'REVOKED'"
            side_effects:
              - "next hop: every Driver of the carrier with driver_status == 'ACTIVE' becomes INACTIVE"
    note: "The dimensions are independent in the ACTIVE -> SUSPENDED direction of the license: an IFTA suspension leaves irp_account_status ACTIVE, so apportioned registration work continues while quarterly filing is frozen. Only a revocation couples them."

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "system, final hop of the retention-review cascade once irp_account_status becomes SUSPENDED"
        actor: system
        preconditions:
          - "driver_status == 'ACTIVE'"
          - "the driver's Carrier.irp_account_status has just become 'SUSPENDED'"
        side_effects:
          - "credentials already distributed to the driver are left untouched; only future distributions are blocked"

# ---------------------------------------------------------------------------
# 1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: fleet-change-create-stale-application
    parent_entity: RegistrationApplication
    write_endpoint: "POST /apportionment/fleet-change-requests"
    occ_field: "expected_registration_application_version"
    description: |
      Creating a FleetChangeRequest against a RegistrationApplication whose
      version has advanced since the client last read it is rejected. A
      carrier may legitimately file any number of mid-year supplements
      against the same invoiced application, so the second create is not
      blocked by any state precondition — it would succeed on its own
      terms. It is rejected only because the application's fee basis
      (total_apportioned_fee, apportioned_vehicle_count) has moved on from
      the snapshot the requester priced its supplement against.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

  - rule_id: return-prepare-stale-carrier
    parent_entity: Carrier
    write_endpoint: "POST /apportionment/fuel-tax-returns/{id}/prepare"
    occ_field: "expected_carrier_version"
    description: |
      Preparing a FuelTaxReturn while carrying a stale Carrier version is
      rejected. Re-preparation is an ordinary product operation — a
      PREPARED return may be recomputed and legitimately supersede its
      prior jurisdiction line set — so the state machine permits
      PREPARED -> PREPARED and the second sequential prepare would
      otherwise succeed. It is rejected because the carrier record backing
      the settlement (ifta_license_status, latest_prepared_fleet_mpg,
      unsubstantiated_mileage_ratio, audit_flag) has advanced past the
      version the preparer observed.
    error_id: ERR_STALE_CARRIER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# 1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: mileage_gap_detection
    trigger: "on POST /apportionment/trip-records, before the trip's initial status is decided"
    algorithm: chronological
    formula: |
      # Predecessor selection is chronological, never id-based.
      prior = TripRecords of the same vehicle_id with trip_status != 'REJECTED'
              and trip_start_utc < new.trip_start_utc
      sort prior by (trip_start_utc ASC, created_at ASC)
      odometer_delta_miles = round(new.end_odometer - new.start_odometer, 1)
      if prior is empty:
          gap_miles_from_previous = 0.0
      else:
          predecessor = last element of prior
          gap_miles_from_previous = round(new.start_odometer - predecessor.end_odometer, 1)
      # negative gaps (odometer rollback) are a request-shape error, not a gap
      if gap_miles_from_previous > GAP_TOLERANCE_MILES:
          initial trip_status = 'GAP_FLAGGED'
      else:
          initial trip_status stays 'CAPTURED' and still requires an explicit
          ComplianceOfficer review with decision 'ACCEPT' before its miles settle
      accepted_leg_miles_total = round(sum(leg_miles of the trip's ACTIVE legs), 1)
    input_set: "TripRecord rows of the same vehicle whose trip_status != 'REJECTED'; rejected trips are invisible to gap detection, so rejecting a trip re-links the chain across it"
    constants:
      GAP_TOLERANCE_MILES: 5.0
      LEG_MILEAGE_TOLERANCE_MILES: 0.5
      RECONSTRUCTION_WINDOW_DAYS: 120
      RECORD_RETENTION_DAYS: 1460
    precision: "miles to 1 decimal place, round_half_up; comparison against GAP_TOLERANCE_MILES is strictly greater-than, so a gap of exactly 5.0 is tolerated and 5.1 is flagged. The reconstruction reconciliation tolerance is inclusive: a deviation of exactly 0.5 miles is accepted and 0.6 is rejected."

  - name: tax_paid_gallons_by_jurisdiction
    trigger: "inside quarterly_fuel_tax_settlement, and on every POST /apportionment/fuel-purchases or POST /apportionment/fuel-purchases/{id}/disallow for the carrier's running total"
    algorithm: aggregation
    formula: |
      # per jurisdiction, for a given quarter window
      tax_paid_gallons[j] = round(sum(p.gallons
          for p in FuelPurchase
          where p.carrier_id == carrier_id
            and p.jurisdiction_code == j
            and p.purchase_status == 'ACCEPTED'
            and quarter_start_date <= p.purchase_date < quarter_end_date), 3)
      total_tax_paid_gallons = round(sum(tax_paid_gallons[j] over all j), 3)
      # carrier running total, maintained incrementally and exactly reversible
      on POST /apportionment/fuel-purchases   (status becomes ACCEPTED):
          Carrier.tax_paid_gallons_ytd = round(Carrier.tax_paid_gallons_ytd + p.gallons, 3)
      on POST /apportionment/fuel-purchases/{id}/disallow (ACCEPTED -> DISALLOWED):
          Carrier.tax_paid_gallons_ytd = round(Carrier.tax_paid_gallons_ytd - p.gallons, 3)
      on POST /apportionment/fuel-purchases/{id}/disallow (RECORDED -> DISALLOWED):
          Carrier.tax_paid_gallons_ytd is unchanged (a RECORDED purchase never entered the total)
    input_set: "FuelPurchase rows with purchase_status == 'ACCEPTED' only; RECORDED (unsubstantiated receipt or untaxed bulk fuel) and DISALLOWED rows contribute zero tax-paid gallons"
    constants:
      GALLON_SCALE: 3
    precision: "gallons to 3 decimal places, round_half_up"

  - name: carrier_unsubstantiated_mileage_ratio
    trigger: "after any TripRecord status change and inside quarterly_fuel_tax_settlement"
    algorithm: aggregation
    formula: |
      numerator = sum(t.odometer_delta_miles for t in TripRecord
                      where t.carrier_id == carrier_id
                        and t.trip_status IN {'GAP_FLAGGED', 'RECONSTRUCTED'})
      denominator = sum(t.odometer_delta_miles for t in TripRecord
                        where t.carrier_id == carrier_id
                          and t.trip_status != 'REJECTED')
      if denominator == 0.0:
          Carrier.unsubstantiated_mileage_ratio = 0.0000
      else:
          Carrier.unsubstantiated_mileage_ratio = round(numerator / denominator, 4)
      Carrier.audit_flag = (Carrier.unsubstantiated_mileage_ratio > UNSUBSTANTIATED_AUDIT_FLAG_RATIO)
    input_set: "all of the carrier's TripRecord rows except REJECTED ones; an ACCEPTED reconstruction has already been substantiated and leaves the numerator, which is why the return-for-correction cascade (which pushes those trips back to GAP_FLAGGED) raises the ratio"
    constants:
      UNSUBSTANTIATED_AUDIT_FLAG_RATIO: 0.1500
    precision: "ratio to 4 decimal places, round_half_up; comparison against UNSUBSTANTIATED_AUDIT_FLAG_RATIO is strictly greater-than"

  - name: quarterly_fuel_tax_settlement
    trigger: "POST /apportionment/fuel-tax-returns/{id}/prepare (PREPARER_BASIS) and the retention-review cascade re-settlement (AUDIT_BASIS)"
    algorithm: threshold
    formula: |
      # --- quarter window (half-open, UTC) -------------------------------
      quarter_start = first day of month (3 * filing_quarter - 2) of filing_year at 00:00:00Z
      quarter_end   = first day of month (3 * filing_quarter + 1) of filing_year at 00:00:00Z
                      (January 1 of filing_year + 1 when filing_quarter == 4)
      # Q2-2026 => [2026-04-01T00:00:00Z, 2026-07-01T00:00:00Z)

      # --- mileage basis -------------------------------------------------
      trips = TripRecord rows where carrier_id matches,
              trip_status == 'ACCEPTED',
              quarter_start <= trip_start_utc < quarter_end
      for each trip, uplift = RECONSTRUCTION_UPLIFT_FACTOR if (basis == 'AUDIT_BASIS'
                              and trip.mileage_source == 'MANUAL_RECONSTRUCTION') else 1.000
      for each ACTIVE JurisdictionMileageLeg of each trip:
          effective_leg_miles = round(leg.leg_miles * uplift, 1)
      taxable_miles[j]   = round(sum(effective_leg_miles where leg.jurisdiction_code == j), 1)
      total_fleet_miles  = round(sum(taxable_miles[j] over all j), 1)

      # --- fuel basis ----------------------------------------------------
      tax_paid_gallons[j], total_tax_paid_gallons = calculations.tax_paid_gallons_by_jurisdiction
      if total_tax_paid_gallons <= 0.000: reject with ERR_NO_TAX_PAID_GALLONS
      if total_fleet_miles <= 0.0:        reject with ERR_NO_ACCEPTED_MILEAGE

      # --- fleet MPG: ROUNDED FIRST, then reused everywhere (pinned) -----
      fleet_mpg = round(total_fleet_miles / total_tax_paid_gallons, 2)

      # --- per-jurisdiction line ----------------------------------------
      for each jurisdiction j appearing in taxable_miles or tax_paid_gallons,
          iterated in jurisdiction_code ASC order:
          taxable_gallons[j]     = round(taxable_miles[j] / fleet_mpg, 3)
          net_taxable_gallons[j] = round(taxable_gallons[j] - tax_paid_gallons[j], 3)   # may be negative
          base_tax_amount[j]     = round(net_taxable_gallons[j] * Jurisdiction.fuel_tax_rate_per_gallon, 2)
          # surcharge jurisdictions bill the FULL taxable gallons and are never
          # netted against tax-paid gallons, because surcharge fuel tax is not
          # collected at the pump
          if Jurisdiction.is_surcharge_jurisdiction:
              surcharge_amount[j] = round(taxable_gallons[j] * Jurisdiction.surcharge_rate_per_gallon, 2)
          else:
              surcharge_amount[j] = 0.00
          net_tax_amount[j] = round(base_tax_amount[j] + surcharge_amount[j], 2)

      # --- totals: PER-LINE ROUND THEN SUM (pinned; differs from sum-then-round) ---
      total_net_tax_due = sum(net_tax_amount[j] over all lines)     # already 2dp each
      reconstructed_mileage_ratio = calculations.reconstructed_mileage_penalty step 1
      reconstruction_penalty_amount = calculations.reconstructed_mileage_penalty step 2
      total_amount_due = round(total_net_tax_due + reconstruction_penalty_amount, 2)
    input_set: "ACCEPTED TripRecord rows (with their ACTIVE legs) whose trip_start_utc falls in the half-open quarter window, plus ACCEPTED FuelPurchase rows whose purchase_date falls in the same window; GAP_FLAGGED, RECONSTRUCTED, CAPTURED and REJECTED trips and RECORDED/DISALLOWED purchases are excluded"
    constants:
      RECONSTRUCTION_UPLIFT_FACTOR: 1.100
      MILE_SCALE: 1
      GALLON_SCALE: 3
      MONEY_SCALE: 2
    precision: "miles 1dp, gallons 3dp, money 2dp, all round_half_up. Two orderings are pinned and observable: (i) fleet_mpg is rounded to 2dp BEFORE it divides any jurisdiction's taxable_miles, and (ii) totals sum the already-rounded per-line amounts rather than rounding a raw sum."
    variants:
      - name: PREPARER_BASIS
        when: "POST /apportionment/fuel-tax-returns/{id}/prepare — the carrier's own filing"
        difference: "every trip contributes its ACTIVE legs at face value (uplift 1.000); settlement_basis is stored as 'PREPARER_BASIS' and audit_assessment_delta stays null"
      - name: AUDIT_BASIS
        when: "the re-settlement hop of POST /apportionment/audit-selections/{id}/retention-review, applied to the period's FILED return"
        difference: "legs of trips whose mileage_source == 'MANUAL_RECONSTRUCTION' are uplifted by RECONSTRUCTION_UPLIFT_FACTOR (1.100) before aggregation, which raises total_fleet_miles, therefore raises fleet_mpg, therefore lowers every jurisdiction's taxable_gallons per taxable mile while raising the reconstructed jurisdictions' taxable_miles — the two effects do not cancel, so per-jurisdiction net_tax_amount, total_net_tax_due and total_amount_due all diverge from the PREPARER_BASIS result on identical data. settlement_basis becomes 'AUDIT_BASIS' and audit_assessment_delta records the difference against the filed total_amount_due."

  - name: reconstructed_mileage_penalty
    trigger: "inside quarterly_fuel_tax_settlement, after total_net_tax_due is known"
    algorithm: threshold
    formula: |
      reconstructed_miles = sum(taxable_miles contributed by trips in the window
                                whose mileage_source == 'MANUAL_RECONSTRUCTION')
      if total_fleet_miles == 0.0:
          reconstructed_mileage_ratio = 0.0000
      else:
          reconstructed_mileage_ratio = round(reconstructed_miles / total_fleet_miles, 4)
      if reconstructed_mileage_ratio > RECONSTRUCTED_MILEAGE_PENALTY_RATIO:
          reconstruction_penalty_amount = max(PENALTY_FLOOR_USD,
              round(PENALTY_RATE * max(total_net_tax_due, 0.00), 2))
      else:
          reconstruction_penalty_amount = 0.00
    input_set: "the same ACCEPTED trip set the settlement used, split by mileage_source; the ratio is computed on effective (uplifted, under AUDIT_BASIS) miles so the audit basis can cross the threshold on data the preparer basis kept below it"
    constants:
      RECONSTRUCTED_MILEAGE_PENALTY_RATIO: 0.1000
      PENALTY_RATE: 0.10
      PENALTY_FLOOR_USD: 100.00
    precision: "ratio 4dp, money 2dp, round_half_up; the threshold comparison is strictly greater-than, so a ratio of exactly 0.1000 attracts no penalty and 0.1001 attracts the full floor. max(total_net_tax_due, 0.00) keeps a refund quarter from generating a negative penalty."

  - name: apportioned_registration_fee
    trigger: "POST /apportionment/registration-applications/{id}/review with decision == 'INVOICE'"
    algorithm: weighted_scoring
    formula: |
      lines = DistanceScheduleLine rows of the application with line_status == 'ACTIVE',
              iterated in jurisdiction_code ASC order
      for each line:
          effective_distance_miles = per the application's distance_basis variant
      fleet_total_distance_miles = round(sum(effective_distance_miles over lines), 1)
      for each line:
          apportion_percent = round(effective_distance_miles / fleet_total_distance_miles, 6)
          full_fee = WeightGroupFee.annual_fee_amount
                     for (line.jurisdiction_code, application.weight_group_code)
          jurisdiction_fee_amount = round(apportion_percent * full_fee
                                          * apportioned_vehicle_count, 2)
      base_fee_total = sum(jurisdiction_fee_amount over lines)   # per-line round then sum
      total_apportioned_fee = base_fee_total                     # no supplements yet
    input_set: "ACTIVE DistanceScheduleLine rows only; VOIDED lines from an earlier correction round are excluded, and apportioned_vehicle_count counts the carrier's Vehicle rows for registration_year with vehicle_status IN {PENDING, ACTIVE}"
    constants:
      ESTIMATED_DISTANCE_FLOOR_MILES: 20000.0
      PERCENT_SCALE: 6
      MONEY_SCALE: 2
    precision: "distances 1dp, percentages 6dp, money 2dp, all round_half_up; percentages are NOT re-normalised to sum to exactly 1.000000 and base_fee_total sums already-rounded line fees"
    variants:
      - name: ACTUAL_DISTANCE_BASIS
        when: "distance_basis == 'ACTUAL_DISTANCE_BASIS' — the carrier operated in every listed jurisdiction during the reporting period"
        difference: "effective_distance_miles = reported_distance_miles verbatim; the percentage mix is the carrier's true operational mix"
      - name: ESTIMATED_DISTANCE_BASIS
        when: "distance_basis == 'ESTIMATED_DISTANCE_BASIS' — a new or newly-expanded fleet with no actual history for the jurisdiction"
        difference: "effective_distance_miles = max(reported_distance_miles, ESTIMATED_DISTANCE_FLOOR_MILES). The chart floor lifts only the below-floor jurisdictions, so it changes the denominator AND redistributes the percentage mix — every line's apportion_percent and jurisdiction_fee_amount differ from the ACTUAL result on identical reported distances, and base_fee_total differs too."

  - name: fleet_change_fee_delta
    trigger: "POST /apportionment/fleet-change-requests/{id}/decide with decision == 'APPROVE'"
    algorithm: tiered_pricing
    formula: |
      # Percentages are read from the application's FROZEN ACTIVE line set
      # (frozen at INVOICE time, stamped in apportion_frozen_at). They are
      # never recomputed for a supplement, so a mid-year addition is priced
      # on the same mix as the original credentials.
      per_vehicle_full_year = round(sum(line.apportion_percent
                                        * WeightGroupFee.annual_fee_amount
                                            for (line.jurisdiction_code,
                                                 application.weight_group_code)
                                        over the frozen ACTIVE lines), 2)
      m = month number of effective_date (1..12)
      if change_type == 'ADDITION':
          prorate_months = 13 - m                       # month of entry is charged
          fee_delta = round(per_vehicle_full_year * prorate_months / 12, 2)
      elif change_type == 'DELETION':
          prorate_months = 12 - m                       # month of exit is not credited
          fee_delta = -1 * round(per_vehicle_full_year * prorate_months / 12, 2)
      else:  # TRANSFER — an addition and a deletion settled on one credential swap
          add_months    = 13 - m
          credit_months = 12 - m
          prorate_months = add_months
          fee_delta = round(round(per_vehicle_full_year * add_months / 12, 2)
                            - round(per_vehicle_full_year * credit_months / 12, 2)
                            + TRANSFER_ADMIN_FEE, 2)
    input_set: "the frozen ACTIVE DistanceScheduleLine set of the parent RegistrationApplication plus the WeightGroupFee chart for the application's weight_group_code; APPROVED-then-REVERSED supplements contribute nothing"
    constants:
      TRANSFER_ADMIN_FEE: 15.00
      MONTHS_PER_YEAR: 12
      MONEY_SCALE: 2
    precision: "money 2dp, round_half_up; per_vehicle_full_year is rounded once before proration, and the ADDITION/DELETION legs of a TRANSFER are each rounded before being combined, so a transfer is not equal to a bare addition minus a bare deletion computed at full precision"

  - name: credential_validity_window
    trigger: "POST /apportionment/registration-applications/{id}/issue-credentials (window assignment) and POST /apportionment/credentials/{id}/distribute (driver conflict geometry)"
    algorithm: interval_merge
    formula: |
      # window assignment at issuance
      valid_from_date = supplied valid_from_date, else the logical-clock date
      valid_to_date   = supplied valid_to_date, else December 31 of the
                        application's registration_year
      # driver conflict geometry at distribution — CLOSED intervals, and BOTH
      # windows are expanded by the buffer before the overlap test
      conflict(new, other) =
             (new.valid_from_date - DRIVER_HANDOVER_BUFFER_DAYS
                  <= other.valid_to_date + DRIVER_HANDOVER_BUFFER_DAYS)
         AND (new.valid_to_date + DRIVER_HANDOVER_BUFFER_DAYS
                  >= other.valid_from_date - DRIVER_HANDOVER_BUFFER_DAYS)
      # => two windows handed to the same driver for the same credential_type
      #    need more than 2 * DRIVER_HANDOVER_BUFFER_DAYS = 4 clear days
      #    between them
    input_set: "the target driver's Credential rows with credential_status == 'DISTRIBUTED' and the same credential_type; VOIDED and REPLACED credentials free their window again, and a different credential_type never conflicts"
    constants:
      DRIVER_HANDOVER_BUFFER_DAYS: 2
    precision: "whole calendar days in UTC; both interval endpoints are inclusive, in deliberate contrast to the half-open, zero-buffer [trip_start_utc, trip_end_utc) geometry used for vehicle trip occupation"

  - name: audit_risk_score
    trigger: "POST /apportionment/audit-selections (risk_score), POST /apportionment/audit-selections/{id}/retention-review (post_review_risk_score), and the fourth hop of the return-for-correction cascade (risk_score recompute)"
    algorithm: weighted_scoring
    formula: |
      r = Carrier.unsubstantiated_mileage_ratio
      if Carrier.latest_prepared_fleet_mpg is null:
          v_component = 0
      else:
          v = abs(Carrier.latest_prepared_fleet_mpg - MPG_INDUSTRY_BASELINE) / MPG_INDUSTRY_BASELINE
          v_component = MPG_WEIGHT * min(1, v / MPG_VARIANCE_BAND)
      risk_score = min(100, round(
            RATIO_WEIGHT     * min(1, r / RATIO_SATURATION_RATIO)
          + v_component
          + LATE_FILING_WEIGHT * min(3, late_filing_count)
          + RETENTION_WEIGHT * min(1, retention_deficiency_count / RETENTION_SATURATION_COUNT)
          , 0))
      selection_status = 'SELECTED' if risk_score >= AUDIT_SELECTION_THRESHOLD else 'NOT_SELECTED'

      # retention review re-scores the same carrier with the measured deficiency
      retention_deficiency_ratio = round(records_missing_count / expected_records_count, 4)
      post_review_risk_score = min(100, risk_score
          + round(RETENTION_PENALTY_WEIGHT * retention_deficiency_ratio, 0))
      # license reaction, evaluated on post_review_risk_score
      if post_review_risk_score >= LICENSE_SUSPENSION_THRESHOLD:
          if retention_deficiency_ratio == 1.0000: ifta_license_status -> 'REVOKED'
          else:                                    ifta_license_status -> 'SUSPENDED'
    input_set: "the Carrier snapshot at scoring time (unsubstantiated_mileage_ratio, latest_prepared_fleet_mpg) plus the operator-supplied late_filing_count and retention_deficiency_count; a carrier that has never had a return prepared scores 0 on the MPG factor rather than saturating it"
    constants:
      RATIO_WEIGHT: 40
      RATIO_SATURATION_RATIO: 0.25
      MPG_WEIGHT: 25
      MPG_INDUSTRY_BASELINE: 6.50
      MPG_VARIANCE_BAND: 0.20
      LATE_FILING_WEIGHT: 5
      RETENTION_WEIGHT: 20
      RETENTION_SATURATION_COUNT: 4
      RETENTION_PENALTY_WEIGHT: 30
      AUDIT_SELECTION_THRESHOLD: 70
      LICENSE_SUSPENSION_THRESHOLD: 90
    precision: "scores are integers produced by a single round(..., 0) round_half_up over the weighted sum — the individual weighted components are NOT rounded, so component-wise rounding drifts from the specified result; ratios 4dp. Both thresholds are inclusive (>=), so exactly 70 is selected and exactly 90 suspends."

# ---------------------------------------------------------------------------
# 1.4 Validation Rules Table (evaluated in ascending priority order; the first
#     violated rule decides the response and no later rule is evaluated)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty; X-User-Role is one of the four declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "the caller's X-User-Role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "the carrier id in the path exists"
    error_id: ERR_CARRIER_NOT_FOUND
    http_status: 404
    applies_to: "GET /carriers/{id}, GET /carriers/{id}/drivers, GET /carriers/{id}/audit-selections"

  - priority: 4
    category: existence
    check: "the vehicle id in the path exists"
    error_id: ERR_VEHICLE_NOT_FOUND
    http_status: 404
    applies_to: "GET /vehicles/{id}"

  - priority: 5
    category: existence
    check: "the trip record id in the path exists"
    error_id: ERR_TRIP_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /trip-records/{id}, GET /trip-records/{id}/mileage-legs, POST /trip-records/{id}/reconstruct, POST /trip-records/{id}/review"

  - priority: 6
    category: existence
    check: "the fuel purchase id in the path exists"
    error_id: ERR_FUEL_PURCHASE_NOT_FOUND
    http_status: 404
    applies_to: "GET /fuel-purchases/{id}, POST /fuel-purchases/{id}/disallow"

  - priority: 7
    category: existence
    check: "the fuel tax return id in the path exists"
    error_id: ERR_FUEL_TAX_RETURN_NOT_FOUND
    http_status: 404
    applies_to: "GET /fuel-tax-returns/{id}, GET /fuel-tax-returns/{id}/jurisdiction-lines, POST /fuel-tax-returns/{id}/prepare, POST /fuel-tax-returns/{id}/review"

  - priority: 8
    category: existence
    check: "the registration application id in the path exists"
    error_id: ERR_REGISTRATION_APPLICATION_NOT_FOUND
    http_status: 404
    applies_to: "GET /registration-applications/{id}, GET|POST /registration-applications/{id}/distance-schedule, POST /registration-applications/{id}/submit, POST /registration-applications/{id}/review, POST /registration-applications/{id}/issue-credentials"

  - priority: 9
    category: existence
    check: "the fleet change request id in the path exists"
    error_id: ERR_FLEET_CHANGE_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "GET /fleet-change-requests/{id}, POST /fleet-change-requests/{id}/decide, POST /fleet-change-requests/{id}/reverse"

  - priority: 10
    category: existence
    check: "the credential id in the path exists"
    error_id: ERR_CREDENTIAL_NOT_FOUND
    http_status: 404
    applies_to: "GET /credentials/{id}, POST /credentials/{id}/distribute"

  - priority: 11
    category: existence
    check: "the audit selection id in the path exists"
    error_id: ERR_AUDIT_SELECTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /audit-selections/{id}/retention-review"

  - priority: 12
    category: business_referential
    check: "every foreign key supplied in the request body resolves to an existing row, evaluated in body-field declaration order: carrier_id, vehicle_id, replaced_vehicle_id, registration_application_id, distributed_to_driver_id"
    error_id: "ERR_CARRIER_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_REGISTRATION_APPLICATION_NOT_FOUND | ERR_DRIVER_NOT_FOUND"
    http_status: 404
    applies_to: "POST /drivers, POST /vehicles, POST /trip-records, POST /fuel-purchases, POST /fuel-tax-returns, POST /registration-applications, POST /fleet-change-requests, POST /credentials/{id}/distribute, POST /audit-selections"

  - priority: 13
    category: business_constraint
    check: "request shape: required fields present, types and enum members valid, gallons > 0.000, end_odometer > start_odometer, start_odometer >= previous end_odometer (no odometer rollback), trip_end_utc > trip_start_utc, reported_distance_miles >= 0.0, every leg_miles > 0.0, legs list non-empty, expected_records_count >= 1, 0 <= records_missing_count <= expected_records_count, filing_quarter in 1..4, declared_weight_lbs > 0, late_filing_count >= 0, retention_deficiency_count >= 0, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"

  - priority: 14
    category: business_referential
    check: "every jurisdiction_code referenced by the request — directly or through a legs / reconstructed_legs list — has a declared Jurisdiction row"
    error_id: ERR_JURISDICTION_NOT_DECLARED
    http_status: 422
    applies_to: "POST /weight-group-fees, POST /trip-records, POST /trip-records/{id}/reconstruct, POST /fuel-purchases, POST /registration-applications/{id}/distance-schedule"

  - priority: 15
    category: auth
    check: "when X-User-Role is CarrierAdmin, the resource the request touches must belong to the carrier whose id equals X-User-ID: the target vehicle's carrier_id, the parent application's carrier_id, or the credential's vehicle's carrier_id"
    error_id: ERR_CARRIER_SCOPE_VIOLATION
    http_status: 403
    applies_to: "POST /fleet-change-requests, POST /credentials/{id}/distribute, POST /drivers, POST /vehicles, POST /trip-records, POST /fuel-purchases"

  - priority: 16
    category: business_constraint
    check: "the supplied expected_<parent>_version equals the parent entity's current version (see concurrency_rules)"
    error_id: "ERR_STALE_APPLICATION_VERSION | ERR_STALE_CARRIER_VERSION"
    http_status: 412
    applies_to: "POST /fleet-change-requests, POST /fuel-tax-returns/{id}/prepare"

  - priority: 17
    category: state
    check: "the target resource is in a state from which the requested transition exists: trip_status for reconstruct/review, purchase_status for disallow, return_status for prepare/review, application_status for distance-schedule/submit/review/issue-credentials, change_status for decide/reverse, credential_status for distribute, selection_status for retention-review"
    error_id: "ERR_INVALID_TRIP_STATE | ERR_INVALID_PURCHASE_STATE | ERR_INVALID_RETURN_STATE | ERR_INVALID_APPLICATION_STATE | ERR_CHANGE_REQUEST_NOT_PENDING | ERR_CREDENTIAL_NOT_ISSUED | ERR_AUDIT_SELECTION_NOT_SELECTED"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 18
    category: state
    check: "the carrier's IFTA licence must be live for any quarterly-filing or credential-issuing operation: Carrier.ifta_license_status == 'ACTIVE'"
    error_id: ERR_CARRIER_LICENSE_INACTIVE
    http_status: 409
    applies_to: "POST /fuel-tax-returns/{id}/prepare, POST /fuel-tax-returns/{id}/review, POST /registration-applications/{id}/issue-credentials"

  - priority: 19
    category: state
    check: "the carrier's IRP account must be live for any apportioned-registration operation: Carrier.irp_account_status == 'ACTIVE'"
    error_id: ERR_CARRIER_IRP_INACTIVE
    http_status: 409
    applies_to: "POST /registration-applications/{id}/submit, POST /fleet-change-requests/{id}/decide"

  - priority: 20
    category: state
    check: "the vehicle referenced by a fleet change decision is in the state that change_type requires: PENDING for ADDITION and for a TRANSFER's incoming vehicle, ACTIVE for DELETION and for a TRANSFER's replaced_vehicle_id"
    error_id: ERR_VEHICLE_STATE_INCOMPATIBLE
    http_status: 409
    applies_to: "POST /fleet-change-requests/{id}/decide"

  - priority: 21
    category: state
    check: "an APPROVED FleetChangeRequest with change_type == 'TRANSFER' cannot be reversed, because the outgoing vehicle has reached the terminal TRANSFERRED state and its credentials were REPLACED"
    error_id: ERR_TRANSFER_NOT_REVERSIBLE
    http_status: 409
    applies_to: "POST /fleet-change-requests/{id}/reverse"

  - priority: 22
    category: state
    check: "a return may only be prepared while no review work is still in flight: no TripRecord of the carrier with trip_start_utc inside the quarter window may have trip_status IN {CAPTURED, RECONSTRUCTED}. A GAP_FLAGGED trip is a settled outcome — the carrier has chosen not to reconstruct it, so its miles stay out of the settlement and instead raise the carrier's unsubstantiated_mileage_ratio."
    error_id: ERR_TRIP_GAP_UNRESOLVED
    http_status: 409
    applies_to: "POST /fuel-tax-returns/{id}/prepare"

  - priority: 23
    category: business_referential
    check: "a reconstruction must cite its paper trail: supporting_document_reference is present and non-empty and reconstructed_legs is non-empty"
    error_id: ERR_RECONSTRUCTION_SUPPORT_MISSING
    http_status: 422
    applies_to: "POST /trip-records/{id}/reconstruct"

  - priority: 24
    category: business_safety
    check: "the trip being reconstructed is still inside the record retention period: logical_now - trip_end_utc <= RECORD_RETENTION_DAYS (1460). Records past retention cannot be reconstructed at all, because the source documents are no longer required to exist."
    error_id: ERR_RETENTION_PERIOD_EXPIRED
    http_status: 422
    applies_to: "POST /trip-records/{id}/reconstruct"

  - priority: 25
    category: business_temporal
    check: "the manual reconstruction window is still open: logical_now - trip_end_utc <= RECONSTRUCTION_WINDOW_DAYS (120)"
    error_id: ERR_RECONSTRUCTION_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /trip-records/{id}/reconstruct"

  - priority: 26
    category: business_constraint
    check: "segregation of duties: the caller's X-User-ID differs from the user who performed the upstream step — reconstructed_by_user_id on a trip review, prepared_by_user_id on a return review, prepared_by_user_id on an application review"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /trip-records/{id}/review, POST /fuel-tax-returns/{id}/review, POST /registration-applications/{id}/review"

  - priority: 27
    category: business_constraint
    check: "uniqueness of natural keys: Jurisdiction.jurisdiction_code; (jurisdiction_code, weight_group_code) on WeightGroupFee; Carrier.usdot_number; (carrier_id, unit_number, registration_year) on Vehicle; (carrier_id, filing_year, filing_quarter) on FuelTaxReturn; (carrier_id, registration_year) on RegistrationApplication among applications whose application_status != 'RETURNED_FOR_CORRECTION'; (carrier_id, selection_year, selection_quarter) on AuditSelection"
    error_id: "ERR_DUPLICATE_JURISDICTION | ERR_DUPLICATE_WEIGHT_GROUP_FEE | ERR_DUPLICATE_USDOT_NUMBER | ERR_DUPLICATE_UNIT_NUMBER | ERR_DUPLICATE_RETURN_PERIOD | ERR_DUPLICATE_APPLICATION_YEAR | ERR_DUPLICATE_AUDIT_PERIOD"
    http_status: 409
    applies_to: "POST /jurisdictions, POST /weight-group-fees, POST /carriers, POST /vehicles, POST /fuel-tax-returns, POST /registration-applications, POST /audit-selections"

  - priority: 28
    category: business_constraint
    check: "a registration application may hold at most one ACTIVE DistanceScheduleLine per jurisdiction_code"
    error_id: ERR_DUPLICATE_JURISDICTION_LINE
    http_status: 409
    applies_to: "POST /registration-applications/{id}/distance-schedule"

  - priority: 29
    category: business_referential
    check: "the driver a credential is distributed to belongs to the same carrier as the credential's vehicle and has driver_status == 'ACTIVE'"
    error_id: ERR_DRIVER_CARRIER_MISMATCH
    http_status: 422
    applies_to: "POST /credentials/{id}/distribute"

  - priority: 30
    category: business_safety
    check: "a fuel purchase whose purchase_date falls inside the quarter window of a FuelTaxReturn of the same carrier with return_status IN {FILED, AUDIT_ADJUSTED} may not be disallowed — the filed basis is frozen"
    error_id: ERR_PURCHASE_LOCKED_BY_FILED_RETURN
    http_status: 409
    applies_to: "POST /fuel-purchases/{id}/disallow"

  - priority: 31
    category: business_temporal
    check: "a fleet change's effective_date falls inside the parent application's registration_year (January 1 through December 31 inclusive)"
    error_id: ERR_EFFECTIVE_DATE_OUT_OF_YEAR
    http_status: 422
    applies_to: "POST /fleet-change-requests/{id}/decide"

  - priority: 32
    category: business_temporal
    check: "the new trip's [trip_start_utc, trip_end_utc) half-open interval must not overlap the interval of any existing TripRecord of the same vehicle_id whose trip_status != 'REJECTED'. Adjacency is allowed: a trip starting exactly when the previous one ended is accepted (zero buffer)."
    error_id: ERR_TRIP_INTERVAL_OVERLAP
    http_status: 409
    applies_to: "POST /trip-records"

  - priority: 33
    category: business_temporal
    check: "closed, symmetrically buffered interval arithmetic on the target driver, per credential_type: the distribution is rejected when new.valid_from_date - DRIVER_HANDOVER_BUFFER_DAYS (2) <= other.valid_to_date + DRIVER_HANDOVER_BUFFER_DAYS AND new.valid_to_date + DRIVER_HANDOVER_BUFFER_DAYS >= other.valid_from_date - DRIVER_HANDOVER_BUFFER_DAYS, for any other Credential of the same credential_type already DISTRIBUTED to that driver. Both endpoints are inclusive and both windows are expanded, so two windows need more than 2 * DRIVER_HANDOVER_BUFFER_DAYS = 4 clear days between them; a 2-clear-day handover gap still conflicts."
    error_id: ERR_DRIVER_CREDENTIAL_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /credentials/{id}/distribute"

  - priority: 34
    category: business_constraint
    check: "the sum of reconstructed_legs' leg_miles must reconcile to the trip's odometer evidence: abs(sum(leg_miles) - (odometer_delta_miles + gap_miles_from_previous)) <= LEG_MILEAGE_TOLERANCE_MILES (0.5)"
    error_id: ERR_LEG_MILEAGE_MISMATCH
    http_status: 422
    applies_to: "POST /trip-records/{id}/reconstruct"

  - priority: 35
    category: business_referential
    check: "a WeightGroupFee row exists for the application's weight_group_code paired with every ACTIVE line's jurisdiction_code"
    error_id: ERR_WEIGHT_GROUP_FEE_MISSING
    http_status: 422
    applies_to: "POST /registration-applications/{id}/review"

  - priority: 36
    category: business_referential
    check: "exactly one FuelTaxReturn of the carrier with filing_year == selection_year and filing_quarter == selection_quarter has return_status == 'FILED'"
    error_id: ERR_NO_FILED_RETURN_FOR_PERIOD
    http_status: 409
    applies_to: "POST /audit-selections/{id}/retention-review"

  - priority: 37
    category: business_fiscal
    check: "a return may only be filed while it is covered: total_amount_due <= Carrier.bond_ceiling_amount"
    error_id: ERR_BOND_CEILING_EXCEEDED
    http_status: 402
    applies_to: "POST /fuel-tax-returns/{id}/review with decision == 'FILE'"

  - priority: 38
    category: business_fiscal
    check: "the quarter has at least one ACCEPTED fuel purchase gallon: total_tax_paid_gallons > 0.000, otherwise fleet MPG is undefined"
    error_id: ERR_NO_TAX_PAID_GALLONS
    http_status: 422
    applies_to: "POST /fuel-tax-returns/{id}/prepare"

  - priority: 39
    category: business_fiscal
    check: "the quarter has at least one ACCEPTED trip mile: total_fleet_miles > 0.0"
    error_id: ERR_NO_ACCEPTED_MILEAGE
    http_status: 422
    applies_to: "POST /fuel-tax-returns/{id}/prepare"

# ---------------------------------------------------------------------------
# 1.5 API Endpoint Table  (all paths are relative to api_prefix /apportionment)
# ---------------------------------------------------------------------------

endpoints:
  # --- test-driving surface ------------------------------------------------
  - method: POST
    path: "/apportionment/_clock/set_current_utc"
    description: "Sets the server's logical clock, which every retention, reconstruction-window, quarter-window, proration and credential-validity rule reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to real wall-clock time."
    roles: [ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["the logical clock used by all date and window arithmetic is moved to to_iso8601"]

  # --- reference data -----------------------------------------------------
  - method: POST
    path: "/apportionment/jurisdictions"
    description: "Declares a member jurisdiction with its fuel tax rate and, when applicable, its surcharge rate."
    roles: [ComplianceOfficer]
    code: 201
    input: [jurisdiction_code, name, fuel_tax_rate_per_gallon, "surcharge_rate_per_gallon?", "is_surcharge_jurisdiction?"]
    output: Jurisdiction
    side_effects: ["jurisdiction_code becomes referenceable by mileage legs, fuel purchases, weight group fees and distance schedule lines"]

  - method: GET
    path: "/apportionment/jurisdictions/{id}"
    description: "Reads one declared jurisdiction."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: Jurisdiction
    side_effects: []

  - method: GET
    path: "/apportionment/jurisdictions"
    description: "Lists declared jurisdictions, ordered by jurisdiction_code ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["is_surcharge_jurisdiction?", "limit?", "offset?"]
    output: Jurisdiction[]
    side_effects: []

  - method: POST
    path: "/apportionment/weight-group-fees"
    description: "Publishes one cell of the apportioned-fee chart: the full annual fee a jurisdiction charges for a declared weight group."
    roles: [ComplianceOfficer]
    code: 201
    input: [jurisdiction_code, weight_group_code, declared_weight_lbs, annual_fee_amount]
    output: WeightGroupFee
    side_effects: ["the (jurisdiction_code, weight_group_code) cell becomes available to calculations.apportioned_registration_fee and calculations.fleet_change_fee_delta"]

  - method: GET
    path: "/apportionment/weight-group-fees/{id}"
    description: "Reads one fee chart cell."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: WeightGroupFee
    side_effects: []

  - method: GET
    path: "/apportionment/weight-group-fees"
    description: "Lists fee chart cells, ordered by jurisdiction_code ASC then weight_group_code ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["jurisdiction_code?", "weight_group_code?", "limit?", "offset?"]
    output: WeightGroupFee[]
    side_effects: []

  # --- carriers, vehicles, drivers ----------------------------------------
  - method: POST
    path: "/apportionment/carriers"
    description: "Registers a motor carrier as an IFTA licensee and IRP account holder in its base jurisdiction."
    roles: [ComplianceOfficer]
    code: 201
    input: [legal_name, usdot_number, base_jurisdiction_code, "bond_ceiling_amount?"]
    output: Carrier
    side_effects: ["ifta_license_status starts ACTIVE, irp_account_status starts ACTIVE, tax_paid_gallons_ytd starts 0.000, unsubstantiated_mileage_ratio starts 0.0000, audit_flag starts false, suspension_count starts 0, version starts 1"]

  - method: GET
    path: "/apportionment/carriers/{id}"
    description: "Reads one carrier, including the version used by the return-prepare OCC check and the derived compliance fields."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: GET
    path: "/apportionment/carriers"
    description: "Lists carriers, ordered by created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["base_jurisdiction_code?", "ifta_license_status?", "audit_flag?", "limit?", "offset?"]
    output: Carrier[]
    side_effects: []

  - method: GET
    path: "/apportionment/carriers/{id}/drivers"
    description: "Lists the carrier's drivers, ordered by created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["driver_status?", "limit?", "offset?"]
    output: Driver[]
    side_effects: []

  - method: GET
    path: "/apportionment/carriers/{id}/audit-selections"
    description: "Lists the carrier's audit selection records, ordered by selection_year ASC then selection_quarter ASC then created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["selection_year?", "selection_status?", "limit?", "offset?"]
    output: AuditSelection[]
    side_effects: []

  - method: POST
    path: "/apportionment/drivers"
    description: "Enrolls a CDL driver under a carrier; credentials are later handed to drivers by id."
    roles: [CarrierAdmin, ComplianceOfficer]
    code: 201
    input: [carrier_id, full_name, cdl_number]
    output: Driver
    side_effects: ["driver_status starts ACTIVE"]

  - method: POST
    path: "/apportionment/vehicles"
    description: "Adds a power unit to a carrier's fleet for a registration year. The unit starts PENDING and is activated when its application is invoiced or its addition supplement is approved."
    roles: [CarrierAdmin, ComplianceOfficer]
    code: 201
    input: [carrier_id, unit_number, vin, weight_group_code, factory_price_amount, registration_year]
    output: Vehicle
    side_effects: ["vehicle_status starts PENDING, credential_status is derived as NONE, replaced_vehicle_id starts null, activated_on_date starts null"]

  - method: GET
    path: "/apportionment/vehicles/{id}"
    description: "Reads one power unit, including both state dimensions."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/apportionment/vehicles"
    description: "Lists power units, ordered by created_at ASC. replaced_vehicle_id resolves the self-referential transfer chain."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["carrier_id?", "replaced_vehicle_id?", "vehicle_status?", "credential_status?", "registration_year?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  # --- mileage capture ----------------------------------------------------
  - method: POST
    path: "/apportionment/trip-records"
    description: "Captures one telematics trip with its jurisdiction mileage legs. Gap detection against the vehicle's chronologically previous non-rejected trip decides whether the trip starts CAPTURED or GAP_FLAGGED."
    roles: [CarrierAdmin, MileageAnalyst]
    code: 201
    input: [carrier_id, vehicle_id, trip_start_utc, trip_end_utc, start_odometer, end_odometer, legs]
    output: TripRecord
    side_effects:
      - "odometer_delta_miles and gap_miles_from_previous are computed per calculations.mileage_gap_detection"
      - "one JurisdictionMileageLeg row with leg_status ACTIVE is created per element of legs, with leg_sequence assigned by the submitted order starting at 1"
      - "trip_status starts CAPTURED, or GAP_FLAGGED when the gap exceeds GAP_TOLERANCE_MILES; mileage_source starts TELEMATICS"
      - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed; increments Carrier.version by 1"

  - method: GET
    path: "/apportionment/trip-records/{id}"
    description: "Reads one trip record."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: TripRecord
    side_effects: []

  - method: GET
    path: "/apportionment/trip-records"
    description: "Lists trip records, ordered by trip_start_utc ASC then created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["carrier_id?", "vehicle_id?", "trip_status?", "mileage_source?", "limit?", "offset?"]
    output: TripRecord[]
    side_effects: []

  - method: GET
    path: "/apportionment/trip-records/{id}/mileage-legs"
    description: "Lists the trip's jurisdiction mileage legs — the only channel through which cascade-created and reconstruction-replaced legs are observable. Ordered by leg_sequence ASC then created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["leg_status?", "limit?", "offset?"]
    output: JurisdictionMileageLeg[]
    side_effects: []

  - method: POST
    path: "/apportionment/trip-records/{id}/reconstruct"
    description: "Replaces a gap-flagged trip's mileage legs with an analyst's manual reconstruction, cited to a supporting document."
    roles: [MileageAnalyst]
    code: 200
    input: [reconstructed_legs, supporting_document_reference]
    output: TripRecord
    side_effects:
      - "trip_status GAP_FLAGGED -> RECONSTRUCTED; mileage_source becomes MANUAL_RECONSTRUCTION"
      - "prior ACTIVE legs become VOIDED; the submitted legs are inserted as ACTIVE"
      - "reconstructed_by_user_id and supporting_document_reference are stamped; accepted_leg_miles_total is recomputed"
      - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed; increments Carrier.version by 1"

  - method: POST
    path: "/apportionment/trip-records/{id}/review"
    description: "Accepts or rejects a captured or reconstructed trip. A rejected reconstruction returns to GAP_FLAGGED for another attempt; a rejected capture is terminal."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: TripRecord
    side_effects:
      - "trip_status moves per the TripRecord machine (ACCEPT -> ACCEPTED, REJECT -> REJECTED from CAPTURED or GAP_FLAGGED, REJECT -> GAP_FLAGGED from RECONSTRUCTED)"
      - "on REJECT the ACTIVE legs become VOIDED and accepted_leg_miles_total resets to 0.0"
      - "Carrier.unsubstantiated_mileage_ratio and Carrier.audit_flag are recomputed; increments Carrier.version by 1"

  # --- fuel purchases -----------------------------------------------------
  - method: POST
    path: "/apportionment/fuel-purchases"
    description: "Records a fuel purchase. A receipted, tax-paid purchase is auto-accepted into tax-paid gallons; an unreceipted or bulk untaxed purchase stays RECORDED and contributes nothing."
    roles: [CarrierAdmin, MileageAnalyst]
    code: 201
    input: [carrier_id, vehicle_id, jurisdiction_code, purchase_date, gallons, tax_paid_flag, "receipt_reference?"]
    output: FuelPurchase
    side_effects:
      - "purchase_status becomes ACCEPTED when receipt_reference is present and tax_paid_flag is true, otherwise stays RECORDED"
      - "on ACCEPTED, Carrier.tax_paid_gallons_ytd becomes round(prior + gallons, 3) and increments Carrier.version by 1"

  - method: GET
    path: "/apportionment/fuel-purchases/{id}"
    description: "Reads one fuel purchase."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: FuelPurchase
    side_effects: []

  - method: GET
    path: "/apportionment/fuel-purchases"
    description: "Lists fuel purchases, ordered by purchase_date ASC then created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["carrier_id?", "vehicle_id?", "jurisdiction_code?", "purchase_status?", "limit?", "offset?"]
    output: FuelPurchase[]
    side_effects: []

  - method: POST
    path: "/apportionment/fuel-purchases/{id}/disallow"
    description: "Disallows a fuel purchase found unsupported. Blocked once a return covering the purchase date has been filed."
    roles: [MileageAnalyst]
    code: 200
    input: [disallow_reason_code]
    output: FuelPurchase
    side_effects:
      - "purchase_status becomes DISALLOWED and disallow_reason_code is stored"
      - "when the purchase was ACCEPTED, Carrier.tax_paid_gallons_ytd becomes round(prior - gallons, 3) — restoring exactly the pre-purchase value — and increments Carrier.version by 1"
      - "when the purchase was RECORDED, Carrier.tax_paid_gallons_ytd is unchanged and Carrier.version is still incremented by 1"

  # --- quarterly fuel tax returns -----------------------------------------
  - method: POST
    path: "/apportionment/fuel-tax-returns"
    description: "Opens a DRAFT quarterly fuel tax return for a carrier and period."
    roles: [TaxPreparer]
    code: 201
    input: [carrier_id, filing_year, filing_quarter]
    output: FuelTaxReturn
    side_effects: ["return_status starts DRAFT; all money, mileage and gallon totals start at zero; settlement_basis starts PREPARER_BASIS; fleet_mpg starts null"]

  - method: GET
    path: "/apportionment/fuel-tax-returns/{id}"
    description: "Reads one quarterly return with its computed settlement totals."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: FuelTaxReturn
    side_effects: []

  - method: GET
    path: "/apportionment/fuel-tax-returns"
    description: "Lists quarterly returns, ordered by filing_year ASC then filing_quarter ASC then created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["carrier_id?", "filing_year?", "filing_quarter?", "return_status?", "settlement_basis?", "limit?", "offset?"]
    output: FuelTaxReturn[]
    side_effects: []

  - method: GET
    path: "/apportionment/fuel-tax-returns/{id}/jurisdiction-lines"
    description: "Lists the return's per-jurisdiction lines — the only channel through which the computed and re-settled line sets are observable. Ordered by jurisdiction_code ASC then created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["jurisdiction_code?", "line_status?", "limit?", "offset?"]
    output: ReturnJurisdictionLine[]
    side_effects: []

  - method: POST
    path: "/apportionment/fuel-tax-returns/{id}/prepare"
    description: "Computes (or recomputes) the quarter's settlement on the PREPARER basis. Requires the carrier version the preparer observed, because the prior ACTIVE line set is legitimately superseded."
    roles: [TaxPreparer]
    code: 200
    input: [expected_carrier_version]
    output: FuelTaxReturn
    side_effects:
      - "prior ACTIVE ReturnJurisdictionLine rows become VOIDED; a fresh ACTIVE set is written per calculations.quarterly_fuel_tax_settlement variant PREPARER_BASIS"
      - "total_fleet_miles, total_tax_paid_gallons, fleet_mpg, reconstructed_mileage_ratio, total_net_tax_due, reconstruction_penalty_amount, total_amount_due are written; prepared_by_user_id is stamped"
      - "return_status becomes PREPARED"
      - "Carrier.latest_prepared_fleet_mpg is set to the computed fleet_mpg; increments Carrier.version by 1"

  - method: POST
    path: "/apportionment/fuel-tax-returns/{id}/review"
    description: "Files a prepared return or returns it for correction. Filing is blocked when the amount due exceeds the carrier's bond ceiling; returning for correction reopens the quarter's manual reconstructions."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: FuelTaxReturn
    side_effects:
      - "on FILE: return_status becomes FILED; filed_by_user_id and filed_at are stamped; the quarter's ACCEPTED purchases become locked against disallowance"
      - "on RETURN_FOR_CORRECTION: return_status becomes RETURNED_FOR_CORRECTION; ACTIVE lines are VOIDED and totals reset; the quarter's ACCEPTED manual-reconstruction trips return to GAP_FLAGGED; Carrier.unsubstantiated_mileage_ratio and audit_flag are recomputed (increments Carrier.version by 1); the carrier's NOT_SELECTED AuditSelection rows for the filing year are re-scored and may become SELECTED"

  # --- apportioned registration -------------------------------------------
  - method: POST
    path: "/apportionment/registration-applications"
    description: "Opens a DRAFT apportioned registration application for a carrier, registration year and weight group, on either the actual or the estimated distance basis."
    roles: [TaxPreparer]
    code: 201
    input: [carrier_id, registration_year, weight_group_code, distance_basis]
    output: RegistrationApplication
    side_effects: ["application_status starts DRAFT; prepared_by_user_id is stamped; fee totals start at zero; apportion_frozen_at starts null; apportioned_vehicle_count is computed from the carrier's PENDING and ACTIVE vehicles for registration_year"]

  - method: GET
    path: "/apportionment/registration-applications/{id}"
    description: "Reads one application, including the version used by the fleet-change OCC check and the frozen-percentage timestamp."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: RegistrationApplication
    side_effects: []

  - method: GET
    path: "/apportionment/registration-applications"
    description: "Lists applications, ordered by registration_year ASC then created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["carrier_id?", "registration_year?", "application_status?", "distance_basis?", "limit?", "offset?"]
    output: RegistrationApplication[]
    side_effects: []

  - method: POST
    path: "/apportionment/registration-applications/{id}/distance-schedule"
    description: "Adds one jurisdiction line to the application's distance schedule. Allowed while the application is DRAFT or RETURNED_FOR_CORRECTION."
    roles: [TaxPreparer]
    code: 201
    input: [jurisdiction_code, reported_distance_miles]
    output: DistanceScheduleLine
    side_effects: ["a DistanceScheduleLine with line_status ACTIVE is created; effective_distance_miles, apportion_percent and jurisdiction_fee_amount stay zero until the application is invoiced"]

  - method: GET
    path: "/apportionment/registration-applications/{id}/distance-schedule"
    description: "Lists the application's distance schedule lines — the only channel through which computed percentages and per-jurisdiction fees are observable. Ordered by jurisdiction_code ASC then created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["jurisdiction_code?", "line_status?", "limit?", "offset?"]
    output: DistanceScheduleLine[]
    side_effects: []

  - method: POST
    path: "/apportionment/registration-applications/{id}/submit"
    description: "Submits a DRAFT or corrected application for review."
    roles: [TaxPreparer]
    code: 200
    input: []
    output: RegistrationApplication
    side_effects: ["application_status becomes SUBMITTED; apportioned_vehicle_count is recomputed; increments RegistrationApplication.version by 1"]

  - method: POST
    path: "/apportionment/registration-applications/{id}/review"
    description: "Invoices a submitted application — computing and freezing the apportionment percentages — or returns it for correction, voiding the schedule."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "review_note?"]
    output: RegistrationApplication
    side_effects:
      - "on INVOICE: calculations.apportioned_registration_fee writes effective_distance_miles, apportion_percent and jurisdiction_fee_amount on every ACTIVE line plus fleet_total_distance_miles, base_fee_total and total_apportioned_fee; apportion_frozen_at is stamped; application_status becomes INVOICED; every PENDING vehicle of the carrier for registration_year becomes ACTIVE with activated_on_date stamped"
      - "on RETURN_FOR_CORRECTION: ACTIVE lines become VOIDED; fee totals, fleet_total_distance_miles and apportion_frozen_at reset; application_status becomes RETURNED_FOR_CORRECTION"
      - "reviewed_by_user_id is stamped; increments RegistrationApplication.version by 1"

  - method: POST
    path: "/apportionment/registration-applications/{id}/issue-credentials"
    description: "Issues decals, cab cards and IFTA license copies for every active unit on an invoiced application. valid_from_date defaults to the logical-clock date and valid_to_date defaults to December 31 of registration_year."
    roles: [ComplianceOfficer]
    code: 200
    input: ["valid_from_date?", "valid_to_date?"]
    output: RegistrationApplication
    side_effects:
      - "three Credential rows (DECAL_SET, CAB_CARD, IFTA_LICENSE_COPY) with credential_status ISSUED are created per ACTIVE vehicle of the carrier for registration_year; valid_from_date defaults to the logical-clock date and valid_to_date defaults to December 31 of registration_year"
      - "each of those vehicles' derived credential_status becomes ISSUED"
      - "application_status becomes ISSUED; increments RegistrationApplication.version by 1"

  # --- mid-year fleet changes ---------------------------------------------
  - method: POST
    path: "/apportionment/fleet-change-requests"
    description: "Requests a mid-year fleet addition, deletion or transfer against an invoiced or issued application. Requires the application version the requester priced the supplement against."
    roles: [CarrierAdmin, TaxPreparer]
    code: 201
    input: [registration_application_id, vehicle_id, change_type, effective_date, "replaced_vehicle_id?", expected_registration_application_version]
    output: FleetChangeRequest
    side_effects: ["change_status starts REQUESTED; fee_delta starts 0.00 and prorate_months starts 0; requested_by_user_id is stamped; increments RegistrationApplication.version by 1"]

  - method: GET
    path: "/apportionment/fleet-change-requests/{id}"
    description: "Reads one fleet change request with its prorated fee delta."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: FleetChangeRequest
    side_effects: []

  - method: GET
    path: "/apportionment/fleet-change-requests"
    description: "Lists fleet change requests, ordered by effective_date ASC then created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["registration_application_id?", "vehicle_id?", "replaced_vehicle_id?", "change_type?", "change_status?", "limit?", "offset?"]
    output: FleetChangeRequest[]
    side_effects: []

  - method: POST
    path: "/apportionment/fleet-change-requests/{id}/decide"
    description: "Approves or rejects a fleet change. Approval prices the supplement on the application's frozen percentages and drives the vehicle and credential cascades."
    roles: [ComplianceOfficer]
    code: 200
    input: [decision, "decision_note?"]
    output: FleetChangeRequest
    side_effects:
      - "on APPROVE: prorate_months and fee_delta are written per calculations.fleet_change_fee_delta; RegistrationApplication.total_apportioned_fee and apportioned_vehicle_count are updated; the target vehicle transitions (ADDITION PENDING->ACTIVE, DELETION ACTIVE->DELETED, TRANSFER incoming PENDING->ACTIVE and replaced ACTIVE->TRANSFERRED); a deleted vehicle's live credentials become VOIDED with FLEET_DELETION and a replaced vehicle's become REPLACED with TRANSFER_REPLACEMENT; affected vehicles' credential_status is re-derived"
      - "on REJECT: change_status becomes REJECTED and no vehicle or credential is touched"
      - "decided_by_user_id is stamped; increments RegistrationApplication.version by 1"

  - method: POST
    path: "/apportionment/fleet-change-requests/{id}/reverse"
    description: "Reverses an approved addition or deletion, restoring the application's fee total and vehicle count exactly and undoing the vehicle status change. An approved transfer cannot be reversed."
    roles: [ComplianceOfficer]
    code: 200
    input: [reversal_reason_code]
    output: FleetChangeRequest
    side_effects:
      - "change_status becomes REVERSED and reversal_reason_code is stored; fee_delta is retained as an audit trail but stops counting"
      - "RegistrationApplication.total_apportioned_fee returns to round(base_fee_total + sum of the remaining APPROVED fee_delta, 2) and apportioned_vehicle_count is restored; increments RegistrationApplication.version by 1"
      - "the vehicle status change is undone (reversed ADDITION ACTIVE->PENDING with activated_on_date cleared, reversed DELETION DELETED->ACTIVE); credentials voided with FLEET_DELETION stay VOIDED"

  # --- credential distribution --------------------------------------------
  - method: GET
    path: "/apportionment/credentials/{id}"
    description: "Reads one credential."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: []
    output: Credential
    side_effects: []

  - method: GET
    path: "/apportionment/credentials"
    description: "Lists credentials — the only channel through which issuance-cascade and void-cascade results are observable. Ordered by created_at ASC."
    roles: [CarrierAdmin, MileageAnalyst, TaxPreparer, ComplianceOfficer]
    code: 200
    input: ["vehicle_id?", "registration_application_id?", "distributed_to_driver_id?", "credential_type?", "credential_status?", "registration_year?", "limit?", "offset?"]
    output: Credential[]
    side_effects: []

  - method: POST
    path: "/apportionment/credentials/{id}/distribute"
    description: "Hands an issued credential to one of the carrier's active drivers, subject to the driver's buffered validity-window conflict rule."
    roles: [CarrierAdmin, ComplianceOfficer]
    code: 200
    input: [distributed_to_driver_id]
    output: Credential
    side_effects:
      - "credential_status becomes DISTRIBUTED; distributed_to_driver_id and distributed_at are stamped"
      - "the owning Vehicle's derived credential_status is re-derived"

  # --- audit selection and retention review -------------------------------
  - method: POST
    path: "/apportionment/audit-selections"
    description: "Scores a carrier for audit selection for one filing period and records whether the period was selected."
    roles: [ComplianceOfficer]
    code: 201
    input: [carrier_id, selection_year, selection_quarter, "late_filing_count?", "retention_deficiency_count?"]
    output: AuditSelection
    side_effects:
      - "risk_score is computed per calculations.audit_risk_score from the carrier's current unsubstantiated_mileage_ratio and latest_prepared_fleet_mpg"
      - "selection_status becomes SELECTED when risk_score >= 70, otherwise NOT_SELECTED; on SELECTED, Carrier.audit_flag becomes true and increments Carrier.version by 1"
      - "expected_records_count, records_missing_count, retention_deficiency_ratio and post_review_risk_score start at zero"

  - method: POST
    path: "/apportionment/audit-selections/{id}/retention-review"
    description: "Records the outcome of a record retention review on a selected period, re-settling the filed return on the audit basis and reacting to the re-scored risk."
    roles: [ComplianceOfficer]
    code: 200
    input: [expected_records_count, records_missing_count]
    output: AuditSelection
    side_effects:
      - "selection_status becomes RETENTION_REVIEWED; retention_deficiency_ratio and post_review_risk_score are written; reviewed_by_user_id is stamped"
      - "the period's FILED FuelTaxReturn is re-settled on AUDIT_BASIS, becomes AUDIT_ADJUSTED and records audit_assessment_delta; its ACTIVE lines are replaced"
      - "when post_review_risk_score >= 90 the carrier's ifta_license_status moves to SUSPENDED (or REVOKED when retention_deficiency_ratio == 1.0000), suspension_count increments, IFTA_LICENSE_COPY credentials are VOIDED with LICENSE_SUSPENSION, and on revocation irp_account_status becomes SUSPENDED and the carrier's ACTIVE drivers become INACTIVE; increments Carrier.version by 1"

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or X-User-Role not one of the four declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the caller's role is not listed on the endpoint"
  - id: ERR_CARRIER_SCOPE_VIOLATION
    http: 403
    condition: "a CarrierAdmin acts on a resource that does not belong to the carrier whose id equals X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the reviewer is the same user who reconstructed the trip, prepared the return, or prepared the application"
  - id: ERR_CARRIER_NOT_FOUND
    http: 404
    condition: "the carrier id in the path or request body does not exist"
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "distributed_to_driver_id does not exist"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "a vehicle id in the path or request body (vehicle_id, replaced_vehicle_id) does not exist"
  - id: ERR_TRIP_RECORD_NOT_FOUND
    http: 404
    condition: "the trip record id in the path does not exist"
  - id: ERR_FUEL_PURCHASE_NOT_FOUND
    http: 404
    condition: "the fuel purchase id in the path does not exist"
  - id: ERR_FUEL_TAX_RETURN_NOT_FOUND
    http: 404
    condition: "the fuel tax return id in the path does not exist"
  - id: ERR_REGISTRATION_APPLICATION_NOT_FOUND
    http: 404
    condition: "the registration application id in the path or request body does not exist"
  - id: ERR_FLEET_CHANGE_REQUEST_NOT_FOUND
    http: 404
    condition: "the fleet change request id in the path does not exist"
  - id: ERR_CREDENTIAL_NOT_FOUND
    http: 404
    condition: "the credential id in the path does not exist"
  - id: ERR_AUDIT_SELECTION_NOT_FOUND
    http: 404
    condition: "the audit selection id in the path does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, wrong type, unknown field, invalid enum member, non-positive gallons or leg_miles, empty legs list, end_odometer <= start_odometer, odometer rollback against the previous trip, trip_end_utc <= trip_start_utc, filing_quarter outside 1..4, expected_records_count < 1, or records_missing_count outside 0..expected_records_count"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_registration_application_version does not equal the application's current version on POST /apportionment/fleet-change-requests"
  - id: ERR_STALE_CARRIER_VERSION
    http: 412
    condition: "expected_carrier_version does not equal the carrier's current version on POST /apportionment/fuel-tax-returns/{id}/prepare"
  - id: ERR_INVALID_TRIP_STATE
    http: 409
    condition: "the trip is not in a state from which the requested reconstruct or review transition exists"
  - id: ERR_INVALID_PURCHASE_STATE
    http: 409
    condition: "the fuel purchase is already DISALLOWED"
  - id: ERR_INVALID_RETURN_STATE
    http: 409
    condition: "the return is not in a state from which the requested prepare or review transition exists"
  - id: ERR_INVALID_APPLICATION_STATE
    http: 409
    condition: "the application is not in a state from which the requested schedule, submit, review or issue transition exists"
  - id: ERR_CHANGE_REQUEST_NOT_PENDING
    http: 409
    condition: "a decide call targets a request that is not REQUESTED, or a reverse call targets a request that is not APPROVED"
  - id: ERR_CREDENTIAL_NOT_ISSUED
    http: 409
    condition: "a distribute call targets a credential that is not ISSUED"
  - id: ERR_AUDIT_SELECTION_NOT_SELECTED
    http: 409
    condition: "a retention review targets a selection that is not SELECTED"
  - id: ERR_CARRIER_LICENSE_INACTIVE
    http: 409
    condition: "the carrier's ifta_license_status is SUSPENDED or REVOKED when a prepare, review or credential-issuance call is made"
  - id: ERR_CARRIER_IRP_INACTIVE
    http: 409
    condition: "the carrier's irp_account_status is SUSPENDED when an application submit or fleet-change decision is made"
  - id: ERR_VEHICLE_STATE_INCOMPATIBLE
    http: 409
    condition: "the vehicle's status does not match what the approved change_type requires"
  - id: ERR_TRANSFER_NOT_REVERSIBLE
    http: 409
    condition: "a reverse call targets an APPROVED request whose change_type is TRANSFER"
  - id: ERR_TRIP_GAP_UNRESOLVED
    http: 409
    condition: "a trip of the carrier inside the quarter window is still CAPTURED or RECONSTRUCTED when prepare is called"
  - id: ERR_TRIP_INTERVAL_OVERLAP
    http: 409
    condition: "the new trip's half-open [trip_start_utc, trip_end_utc) interval overlaps a non-rejected trip of the same vehicle"
  - id: ERR_DRIVER_CREDENTIAL_WINDOW_CONFLICT
    http: 409
    condition: "the credential's validity window, expanded by DRIVER_HANDOVER_BUFFER_DAYS on each side, overlaps the likewise-expanded window of another DISTRIBUTED credential of the same type held by the target driver"
  - id: ERR_PURCHASE_LOCKED_BY_FILED_RETURN
    http: 409
    condition: "the purchase date falls inside the window of a FILED or AUDIT_ADJUSTED return of the same carrier"
  - id: ERR_DUPLICATE_JURISDICTION
    http: 409
    condition: "jurisdiction_code already declared"
  - id: ERR_DUPLICATE_WEIGHT_GROUP_FEE
    http: 409
    condition: "(jurisdiction_code, weight_group_code) already published"
  - id: ERR_DUPLICATE_USDOT_NUMBER
    http: 409
    condition: "usdot_number already registered"
  - id: ERR_DUPLICATE_UNIT_NUMBER
    http: 409
    condition: "(carrier_id, unit_number, registration_year) already in the fleet"
  - id: ERR_DUPLICATE_RETURN_PERIOD
    http: 409
    condition: "(carrier_id, filing_year, filing_quarter) already has a return"
  - id: ERR_DUPLICATE_APPLICATION_YEAR
    http: 409
    condition: "the carrier already has an application for registration_year that is not RETURNED_FOR_CORRECTION"
  - id: ERR_DUPLICATE_AUDIT_PERIOD
    http: 409
    condition: "(carrier_id, selection_year, selection_quarter) already scored"
  - id: ERR_DUPLICATE_JURISDICTION_LINE
    http: 409
    condition: "the application already has an ACTIVE distance schedule line for that jurisdiction"
  - id: ERR_NO_FILED_RETURN_FOR_PERIOD
    http: 409
    condition: "no FILED return of the carrier matches the selection's year and quarter"
  - id: ERR_JURISDICTION_NOT_DECLARED
    http: 422
    condition: "a referenced jurisdiction_code has no declared Jurisdiction row"
  - id: ERR_RECONSTRUCTION_SUPPORT_MISSING
    http: 422
    condition: "supporting_document_reference is empty or reconstructed_legs is empty"
  - id: ERR_RETENTION_PERIOD_EXPIRED
    http: 422
    condition: "the trip is older than RECORD_RETENTION_DAYS (1460) and its source records need no longer exist"
  - id: ERR_RECONSTRUCTION_WINDOW_CLOSED
    http: 422
    condition: "the trip is older than RECONSTRUCTION_WINDOW_DAYS (120)"
  - id: ERR_LEG_MILEAGE_MISMATCH
    http: 422
    condition: "reconstructed leg miles deviate from the odometer plus gap evidence by more than LEG_MILEAGE_TOLERANCE_MILES (0.5)"
  - id: ERR_DRIVER_CARRIER_MISMATCH
    http: 422
    condition: "the target driver belongs to another carrier or is INACTIVE"
  - id: ERR_EFFECTIVE_DATE_OUT_OF_YEAR
    http: 422
    condition: "the fleet change's effective_date falls outside the application's registration_year"
  - id: ERR_WEIGHT_GROUP_FEE_MISSING
    http: 422
    condition: "no WeightGroupFee cell exists for the application's weight group in one of the scheduled jurisdictions"
  - id: ERR_NO_TAX_PAID_GALLONS
    http: 422
    condition: "the quarter has no ACCEPTED fuel purchase gallons, so fleet MPG is undefined"
  - id: ERR_NO_ACCEPTED_MILEAGE
    http: 422
    condition: "the quarter has no ACCEPTED trip miles"
  - id: ERR_BOND_CEILING_EXCEEDED
    http: 402
    condition: "total_amount_due exceeds the carrier's bond_ceiling_amount at FILE time"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: CarrierAdmin
    description: "The registrant's own back office: enrolls drivers and units, uploads telematics trips and fuel receipts, requests mid-year supplements, and hands credentials to drivers. Everything it touches must belong to its own carrier."
    identity: "entity_backed:Carrier"
    exclusive_operations:
      - "POST /apportionment/credentials/{id}/distribute (shared with ComplianceOfficer, but only a CarrierAdmin is scope-checked against its own fleet)"
    shared_operations:
      - "POST /apportionment/drivers"
      - "POST /apportionment/vehicles"
      - "POST /apportionment/trip-records"
      - "POST /apportionment/fuel-purchases"
      - "POST /apportionment/fleet-change-requests"
      - "all GET endpoints"

  - name: MileageAnalyst
    description: "Mileage and fuel evidence desk: reconstructs gap-flagged trips from supporting documents and disallows unsupported fuel purchases. Never reviews its own reconstruction and never files."
    identity: "opaque"
    exclusive_operations:
      - "POST /apportionment/trip-records/{id}/reconstruct"
      - "POST /apportionment/fuel-purchases/{id}/disallow"
    shared_operations:
      - "POST /apportionment/trip-records"
      - "POST /apportionment/fuel-purchases"
      - "all GET endpoints"

  - name: TaxPreparer
    description: "Prepares quarterly fuel tax returns and apportioned registration applications. Computes settlements and schedules but can neither file a return nor invoice an application."
    identity: "opaque"
    exclusive_operations:
      - "POST /apportionment/fuel-tax-returns"
      - "POST /apportionment/fuel-tax-returns/{id}/prepare"
      - "POST /apportionment/registration-applications"
      - "POST /apportionment/registration-applications/{id}/distance-schedule"
      - "POST /apportionment/registration-applications/{id}/submit"
    shared_operations:
      - "POST /apportionment/fleet-change-requests"
      - "all GET endpoints"

  - name: ComplianceOfficer
    description: "Jurisdiction-side authority: publishes reference data and carriers, reviews trips, files returns, invoices applications, issues credentials, decides fleet changes, and runs audit selection and retention review. Cannot perform the preparer's or analyst's step it is reviewing."
    identity: "opaque"
    exclusive_operations:
      - "POST /apportionment/_clock/set_current_utc"
      - "POST /apportionment/jurisdictions"
      - "POST /apportionment/weight-group-fees"
      - "POST /apportionment/carriers"
      - "POST /apportionment/trip-records/{id}/review"
      - "POST /apportionment/fuel-tax-returns/{id}/review"
      - "POST /apportionment/registration-applications/{id}/review"
      - "POST /apportionment/registration-applications/{id}/issue-credentials"
      - "POST /apportionment/fleet-change-requests/{id}/decide"
      - "POST /apportionment/fleet-change-requests/{id}/reverse"
      - "POST /apportionment/audit-selections"
      - "POST /apportionment/audit-selections/{id}/retention-review"
    shared_operations:
      - "POST /apportionment/drivers"
      - "POST /apportionment/vehicles"
      - "POST /apportionment/credentials/{id}/distribute"
      - "all GET endpoints"
