              payload: { expected_bank_version: "${bank_v_xd1}" }
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "CapitalPlan.${plan_xd1}.status == BOARD_REVIEW  # not APPROVED"
            - "error_id == ERR_INVALID_STATE_TRANSITION  # plan not in APPROVED blocks distribution approval"
            - "CapitalDistributionRequest.${dist_xd1}.status == PROPOSED  # unchanged"

      - name: icaap_submit_depends_on_plan_effective
        grounds:
          - state_machines.ICAAPDocument.transitions
          - state_machines.CapitalPlan.transitions
          - validations[priority=15]
        distinguishing_aspect: |
          Entity pair: ICAAPDocument → CapitalPlan. ICAAP submit_review requires
          governing CapitalPlan.status in {APPROVED, EFFECTIVE}; file requires
          EFFECTIVE. Different entity pair than distribution→plan (different
          parent, different state gate).
        test_recipe:
          setup:
            - "Bank with CapitalPlan in SUBMITTED state (not yet APPROVED)"
