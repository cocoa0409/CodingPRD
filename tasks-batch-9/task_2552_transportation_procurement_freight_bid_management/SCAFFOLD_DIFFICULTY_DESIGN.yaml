  - rule_id: non_linear_state_machine
    instances:
      - name: bid_event_negotiation_round_cycle
        shape: cyclic
        grounds:
          - state_machines.BidEvent.ROUND_OPEN_to_ROUND_CLOSED
          - state_machines.BidEvent.ROUND_CLOSED_to_ROUND_OPEN
          - entities.BidEvent.fields.current_round_no
          - entities.BidEvent.fields.rounds_allowed
          - validations.ERR_RATE_ABOVE_ROUND_TARGET
        distinguishing_aspect: |
          The cycle is on BidEvent: ROUND_OPEN -> ROUND_CLOSED -> ROUND_OPEN, re-entering a
          state it has already left, with current_round_no as the monotone loop counter and
          rounds_allowed as the termination condition. Multi-round negotiation is the point:
          the second pass through ROUND_OPEN carries a target_reduction_pct that did not
          exist on the first pass, and only the newest CLOSED round's bids stay eligible.
        test_recipe:
          setup:
            - "Carrier ALFL qualified. One-lane FORECAST bid event with rounds_allowed 2."
            - "Round 1 open with no target_reduction_pct; ALFL submitted 2.1152 on the 1147-mile lane."
