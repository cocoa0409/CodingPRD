      - name: dispute_aging_escalates_at_exactly_ninety_days
        claim_type: threshold
        grounds:
          - calculations.dispute_aging
          - calculations.dispute_aging.constants.AGING_ESCALATION_DAYS
          - state_machines.Dispute.OPEN_to_ESCALATED
        distinguishing_aspect: |
          A dispute opened at 2026-08-01T00:00:00Z reads aging_days 89 at
          2026-10-29T00:00:00Z and is left OPEN by the aging run; one clock day later
          aging_days is 90 and the same run escalates it and awards
          ESCALATED_DISPUTE_POINTS (5) — 5 points is below CREDIT_HOLD_POINTS, so trading
          status stays ACTIVE.
        test_recipe:
          setup:
            - "One OPEN dispute opened at the logical clock instant 2026-08-01T00:00:00Z on a customer with 0 penalty points."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
