      - name: inventory_item_repair_reentry_loop_returns_to_available
        grounds:
          - state_machines.InventoryItem.AVAILABLE_to_IN_REPAIR
          - state_machines.InventoryItem.IN_REPAIR_to_AVAILABLE
          - entities.InventoryItem.fields.status
        distinguishing_aspect: |
          A RE-ENTRY LOOP on a THIRD entity: the unit leaves AVAILABLE for IN_REPAIR and
          comes back to AVAILABLE with its version advanced by exactly 2 and its
          times_deployed still 0 — a loop that never touched the deployment path.
        test_recipe:
