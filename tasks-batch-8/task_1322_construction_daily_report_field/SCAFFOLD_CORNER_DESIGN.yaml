  - section: consistency_model
    instances:
      - name: immediate_consistency_same_request_response
        claim_type: immediate
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "All side effects are visible in the same response: crew-entry create response carries computed band hours; report GET immediately after reflects totals."
        test_recipe:
          setup: ["Report DRAFT + area"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P", contract_number: "C-CO1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "S", trade: "T", worker_count: 2, hours_per_worker: 10, work_performed: "w" }, as: Superintendent, captures: { reg: $.data.regular_hours, ot: $.data.ot_hours } }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: Superintendent, captures: { tw: $.data.total_workers, mr: $.data.manhours_regular, mo: $.data.manhours_ot, ver: $.data.version } }
          assert:
            - "create response already contains regular_hours == 16.00, ot_hours == 4.00"
            - "immediate GET: total_workers == 2, manhours_regular == 16.00, manhours_ot == 4.00, version advanced by the child write"

