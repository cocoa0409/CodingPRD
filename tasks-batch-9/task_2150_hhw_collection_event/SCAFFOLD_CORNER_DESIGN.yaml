          difficulty_instance: compensating_invariant / lane_release_restores_staffer_hour_ledger
          rationale: "The §1.8 compensating-invariant instance already asserts that a RELEASED assignment contributes 0 to both Staffer.assigned_hours and CollectionEvent.certified_staff_hours while the row itself keeps duration_hours 4.0."

      - name: container_and_manifest_cost_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.disposal_cost_valuation"]
        excluded_because:
          difficulty_instance: dual_variant_calc / container_estimate_versus_manifest_invoice_divergence
          rationale: "The §1.8 dual-variant instance already pins estimated_disposal_cost_cents 699 against invoiced_disposal_cost_cents 698 on identical inputs."

  - section: validations
    instances:

      - name: site_approval_at_exact_containment_thresholds_succeeds
        claim_type: satisfaction_to_pass
        grounds: ["validations[priority=16]", "state_machines.Site.CANDIDATE_to_APPROVED"]
        distinguishing_aspect: "A site sitting exactly on both numeric thresholds (2000 L containment, 15.0 m storm-drain distance) passes the safety screen because both comparisons are >=, and APPROVE stamps approved_by_user_id from X-User-ID."
        test_recipe:
          setup: ["One program and one CANDIDATE site with impervious_surface true, 2000 L and 15.0 m"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Edge Case Yard", address: "15 Threshold Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 2 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
              captures: { st: $.data.status, approver: $.data.approved_by_user_id, last: $.data.last_inspection_result }
          assert:
            - "HTTP status == 200"
            - "${st} == APPROVED"
            - "${approver} == insp-site-approver"
            - "${last} == PASS"

      - name: site_approval_below_storm_drain_threshold_returns_containment_error
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_CONTAINMENT_REQUIREMENTS_NOT_MET]"]
        distinguishing_aspect: "A storm-drain distance of 14.9 m is strictly below the 15.0 m floor, so APPROVE returns ERR_CONTAINMENT_REQUIREMENTS_NOT_MET (422), the site stays CANDIDATE and last_inspection_result is never written."
        test_recipe:
          setup: ["One program and one CANDIDATE site 0.1 m short of the storm-drain setback"]
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 500000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Too Close Yard", address: "14 Drain Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 14.9, lane_count: 2 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
          trigger:
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "DRAIN-SETBACK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_CONTAINMENT_REQUIREMENTS_NOT_MET"
            - "HTTP status == 422"
            - "Site.${site_id}.status == CANDIDATE"
            - "Site.${site_id}.last_inspection_result == null"
            - "Site.${site_id}.approved_by_user_id == null"

