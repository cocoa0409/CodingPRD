    input: []
    output: Shipment
    side_effects: ["increments Shipment.version"]
  - method: POST
    path: "/backline/shipment-lines/{id}/load"
    description: "BOOKED -> LOADED with capacity + flight-case checks"
    roles: [WarehouseTech]
    code: 200
    input: []
    output: ShipmentLine
