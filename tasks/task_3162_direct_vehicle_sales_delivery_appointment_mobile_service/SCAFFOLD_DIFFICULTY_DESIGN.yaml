            - "the 17:00 attempt succeeds with 201 and an appointment id in \"${appt_k2_id}\" because the gap equals the buffer exactly"
            - "DeliveryAppointment.${appt_k1_id}.buffer_minutes == 60 and DeliveryAppointment.${appt_k2_id}.buffer_minutes == 60"
            - "GET /v1/delivery-centers/${center_bay1_id} reports booked_slot_count == 2"

      - name: mobile_van_adjacent_intervals_rejected_without_buffer
        grounds:
          - validations[priority=11]
          - entities.MobileServiceVisit.fields.visit_start
          - errors[ERR_VAN_SCHEDULE_CONFLICT]
          - state_machines.MobileServiceVisit.DRAFT_to_RESCHEDULED
        distinguishing_aspect: "Mobile van windows use plain half-open intervals with no buffer: a second visit starting exactly when the first ends is rejected because the end instant is exclusive, while a visit starting 15 minutes later is accepted — the opposite adjacency treatment from the buffered bay rule."
