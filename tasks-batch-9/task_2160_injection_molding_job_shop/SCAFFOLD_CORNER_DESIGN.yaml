            - { call: "POST /quotes", payload: { customer_id: "${cust_id}", mold_id: "${mold2_id}", part_weight_grams: 32, cycle_time_sec: 38, cavitation: 4, resin_grade: "PP-H", resin_price_cents_per_kg: 210, annual_volume: 120000 }, as: SalesEngineer, captures: { qc_id: $.data.id } }
            - { call: "POST /quotes/${qa_id}/price", payload: { press_id: "${p150_id}" }, as: SalesEngineer }
