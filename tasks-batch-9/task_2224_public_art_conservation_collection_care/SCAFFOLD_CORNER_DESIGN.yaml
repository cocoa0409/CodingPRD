              as: CollectionsRegistrar
              as_user_id: "reg-1"
              captures: { artwork_id: $.data.id }
            - call: "POST /public-art/artist-consultations"
              payload: { artwork_id: "${artwork_id}", artist_id: "${artist_id}", subject: "RELOCATION" }
              as: ChiefConservator
              as_user_id: "chief-1"
              captures: { consult_id: $.data.id }
            - call: "POST /public-art/moral-rights-notices"
              payload: { artwork_id: "${artwork_id}", artist_id: "${artist_id}", action_type: "RELOCATION" }
              as: PublicArtManager
              as_user_id: "mgr-1"
              captures: { notice_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-30T23:59:59Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/ops/run-cycle"
              payload: { cycle_year: 2026 }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "GET /public-art/artist-consultations/${consult_id}"
              payload: {}
              as: ChiefConservator
              as_user_id: "chief-1"
            - call: "POST /public-art/ops/run-cycle"
              payload: { cycle_year: 2026 }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-30T00:00:00Z" }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/ops/run-cycle"
              payload: { cycle_year: 2026 }
              as: PublicArtManager
              as_user_id: "mgr-1"
            - call: "POST /public-art/ops/run-cycle"
              payload: { cycle_year: 2026 }
              as: PublicArtManager
              as_user_id: "mgr-1"
          assert:
            - "the second trigger returns all four counters == 0: one second before due_at nothing has matured, and no artwork carries a FINALIZED 2026 survey to rescore"
            - "the fourth trigger shows the consultation still PENDING even though the clock now equals due_at: maturity is realised by the checkpoint, not by the clock move"
            - "the fifth trigger returns consultations_lapsed == 1 and notices_elapsed == 0, and ArtistConsultation.${consult_id}.status == LAPSED with responded_at == null"
            - "the seventh trigger returns notices_elapsed == 1 and consultations_lapsed == 0, and MoralRightsNotice.${notice_id}.status == WAIT_ELAPSED with acknowledged_at == null"
            - "the eighth trigger returns every counter == 0: rows already LAPSED or WAIT_ELAPSED are outside the input set, so a repeated checkpoint is inert"
            - "Artwork.${artwork_id}.open_notice_count == 1 throughout: WAIT_ELAPSED still counts as an open notice, which is what later authorises the relocation"

