          assert:
            - "err == ERR_HOLDER_NOT_ELIGIBLE with http 422"

      - name: license_class_none_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_LICENSE_CLASS_INSUFFICIENT]", "validations[priority=6]"]
        distinguishing_aspect: "ERR_LICENSE_CLASS_INSUFFICIENT trigger: a holder of full age (born 2010-05-01) but driver_license_class NONE fails verification on the license prong of the safety gate."
