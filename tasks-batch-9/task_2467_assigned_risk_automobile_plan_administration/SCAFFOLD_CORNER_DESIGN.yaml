          - state_machines.Complaint.initial_state
          - state_machines.AssignmentCycle.initial_state
          - state_machines.PlanPeriod.initial_state
        distinguishing_aspect: |
          Nine state machines, and Policy carries two independent axes, so a freshly created row must
          open on BOTH: IN_FORCE on the coverage axis and PREMIUM_OUTSTANDING on the money axis,
          because the 38939-cent deposit credited at issuance is far short of the 155754-cent annual
          charge. No initial state is ever supplied by the client.
