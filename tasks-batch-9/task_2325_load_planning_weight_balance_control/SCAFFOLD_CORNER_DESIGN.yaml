# =============================================================================
# 1.9 Scaffold Corner Design — Task 2325
# Load Planning & Weight and Balance Control
#
# Breadth probe over the nine claim-extraction-guide sections. Every numeric
# literal was produced by executing the §1.3 formulas against the fixture
# inputs pinned in each `setup:`. Corners already asserted by §1.8 are emitted
# as `excluded_because:` stubs naming the covering difficulty instance.
#
# Fixture shorthand used in the prose below (each instance builds only the
# rows it needs, from an empty database):
#   AC1        Aircraft "HB-AAA" (B738): BEW 41400, basic_index 66.56,
#              MTOW 79000, MLW 66360, MZFW 62730, max taxi 79200,
#              ref_arm/lemac 17.000, MAC 4.200, index_c 1000, index_k 50,
#              fuel_arm 17.900, 162 seats, ZFW 6.0-30.0 %MAC,
#              TOW 5.0-28.0 %MAC, knee 60000 kg -> -1.5 %MAC
#   OC         CABIN_ZONE arm 22.900, max 8000, rl 2000, len 8.0, 60 seats
#   OA / OB    CABIN_ZONE arm 12.500 / 17.800, 42 / 60 seats
#   H1         HOLD arm 9.200,  max 4500, rl 900, len 5.0
#   H4         HOLD arm 24.600, max 5000, rl 900, len 6.0
#   H5         HOLD arm 28.400, max 1200, rl 500, len 2.4
#   H6         HOLD arm 24.600, max 5000, rl 900, len 2.0  (narrow bulk hold)
#   R1         Runway LSGG/04, elevation 1411 ft, 3900 m, slot capacity 2
#   Bands      B738 on R1: [-10,15) 79000, [15,30) 74500, [30,45) 69800
#   STD-2026   STANDARD program 88.0 / 70.0 / 35.0 / 10.0, bag 13.0,
#              documentation_ref "OM-A 8.1.3 rev 12"
#   FLT        Flight on AC1/R1/STD-2026, crew 1150 kg @ 13.500 m,
#              ramp 9800 / taxi 250 / trip 6900, 22 C, 6 kt, DRY,
#              off-block 2026-08-15T10:00:00Z, on-block 12:30:00Z
#              -> DOW 42550, DOI 62.53, PLTOW 73810, allowed payload 20180.00,
#                 limiting_factor MZFW
#   FX-A       FLT + plan with OC 25 male / 35 female (4650.00 kg) and
#              H1 bags 1450.00 kg -> base 6100.00, index_zfw 78.66,
#              ZFW 48650.00, mac_zfw 14.03, TOW 58200.00, index_tow 87.26,
#              mac_tow 15.24, taxi 58450.00, landing 51300.00,
#              underload 14080.00, envelope_ok true
# =============================================================================

scaffold_corner_design:

  # ==========================================================================
  - section: entities
    instances:

      - name: aircraft_creation_returns_airframe_with_in_service_status
        claim_type: creation
        grounds:
          - endpoints[POST /aircraft]
          - entities.Aircraft.fields.status
          - response_envelope.success
        distinguishing_aspect: |
          POST /aircraft with all 21 declared input fields returns 201, the
          success envelope shape of §1.0, and an airframe whose computed
          status is IN_SERVICE with version 1 — the airframe is usable for
          flight creation without any further activation call.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
          assert:
            - "HTTP 201"
            - "response body has response_type == \"object\" and meta.api_request_id present"
            - "Aircraft.${ac1}.status == \"IN_SERVICE\""
            - "Aircraft.${ac1}.version == 1"
            - "Aircraft.${ac1}.registration == \"HB-AAA\""
            - "Aircraft.${ac1}.index_c == 1000"
            - "Aircraft.${ac1}.tow_aft_knee_adjust_pct_mac == -1.5"
            - "Aircraft.${ac1}.tow_knee_weight_kg == 60000"

      - name: runway_retrieval_returns_stored_runway_with_default_slot_capacity
        claim_type: retrieval
        grounds:
          - endpoints[GET /runways/{id}]
          - entities.Runway.fields.slot_capacity_per_window
          - entities.Runway.fields.status
        distinguishing_aspect: |
          GET /runways/{id} returns exactly the stored row: LSGG/04 with
          elevation 1411 ft, length 3900 m, the declared default slot capacity
          2 and status OPEN.
        test_recipe:
          setup:
            - "One runway R1 created without slot_capacity_per_window."
          setup_api_calls:
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900 }
              as: LoadControlAdmin
              captures: { rw: $.data.id }
          trigger:
            - call: "GET /runways/${rw}"
              payload: {}
              as: LoadController
          assert:
            - "HTTP 200"
            - "Runway.${rw}.airport_code == \"LSGG\""
            - "Runway.${rw}.designator == \"04\""
            - "Runway.${rw}.elevation_ft == 1411"
            - "Runway.${rw}.length_m == 3900"
            - "Runway.${rw}.slot_capacity_per_window == 2"
            - "Runway.${rw}.status == \"OPEN\""

      - name: flights_listing_paginates_and_filters_by_status
        claim_type: listing
        grounds:
          - endpoints[GET /flights]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          Three PLANNING flights on the same airframe, spaced so that neither
          the closed occupancy interval nor the 10-minute runway slot window
          collides. limit 2 / offset 0 returns 2 rows with total_count 3 and
          has_more true; limit 2 / offset 2 returns the remaining 1 row with
          has_more false; status=PLANNING returns all 3.
        test_recipe:
          setup:
            - "AC1 with OC and H1, runway R1, the [15,30) band, STD-2026, logical clock at 2026-08-15T06:00:00Z."
            - "Three flights on AC1: 10:00-12:30 (occupies to 13:15), 13:20-15:00 (occupies to 15:45) and 15:50-17:30; the three off-block instants sit in three different 10-minute slot windows."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1602", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
            - call: "POST /flights"
              payload: { flight_number: "LX1604", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T13:20:00Z", scheduled_on_block_utc: "2026-08-15T15:00:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
            - call: "POST /flights"
              payload: { flight_number: "LX1606", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T15:50:00Z", scheduled_on_block_utc: "2026-08-15T17:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
          trigger:
            - call: "GET /flights"
              payload: { limit: 2, offset: 0 }
              as: AuditInspector
            - call: "GET /flights"
              payload: { limit: 2, offset: 2 }
              as: AuditInspector
            - call: "GET /flights"
              payload: { status: "PLANNING", aircraft_id: "${ac1}" }
              as: AuditInspector
          assert:
            - "first read: HTTP 200, response_type == \"array\", 2 elements, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "second read: 1 element, total_count == 3, has_more == false, offset == 2"
            - "third read: 3 elements, total_count == 3, has_more == false, every element has status == \"PLANNING\""

      - name: flights_listing_limit_above_maximum_rejected
        claim_type: listing
        grounds:
          - validations[priority=3]
          - response_envelope.pagination_defaults
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          The pagination contract caps limit at 100 and floors offset at 0.
          limit 101 and offset -1 are both refused with ERR_INVALID_REQUEST
          (400) rather than silently clamped.
        test_recipe:
          setup:
            - "Empty database; no flight rows are needed because the pagination bound is checked before the query runs."
          setup_api_calls: []
          trigger:
            - call: "GET /flights"
              payload: { limit: 101 }
              as: LoadController
            - call: "GET /flights"
              payload: { offset: -1 }
              as: LoadController
          assert:
            - "first trigger: HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "second trigger: HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""

      - name: path_id_not_found_returns_the_entity_specific_404_for_every_resource
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - errors[ERR_AIRCRAFT_NOT_FOUND]
          - errors[ERR_COMPARTMENT_NOT_FOUND]
          - errors[ERR_RUNWAY_NOT_FOUND]
          - errors[ERR_PERFORMANCE_BAND_NOT_FOUND]
          - errors[ERR_WEIGHT_PROGRAM_NOT_FOUND]
          - errors[ERR_FLIGHT_NOT_FOUND]
          - errors[ERR_LOAD_PLAN_NOT_FOUND]
          - errors[ERR_PAX_LINE_NOT_FOUND]
          - errors[ERR_BAG_ALLOCATION_NOT_FOUND]
          - errors[ERR_CARGO_ITEM_NOT_FOUND]
          - errors[ERR_DECLARATION_NOT_FOUND]
          - errors[ERR_LOAD_SHEET_NOT_FOUND]
          - errors[ERR_LAST_MINUTE_CHANGE_NOT_FOUND]
          - errors[ERR_AUDIT_NOT_FOUND]
        distinguishing_aspect: |
          Priority 4 is per-entity, not generic: fourteen single-resource GETs
          with a well-formed but unknown id each return the 404 named for
          their own entity, never a shared ERR_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database; the logical clock is positioned only so the run is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
          trigger:
            - call: "GET /aircraft/00000000-0000-0000-0000-0000000000a1"
              payload: {}
              as: AuditInspector
            - call: "GET /compartments/00000000-0000-0000-0000-0000000000a2"
              payload: {}
              as: AuditInspector
            - call: "GET /runways/00000000-0000-0000-0000-0000000000a3"
              payload: {}
              as: AuditInspector
            - call: "GET /performance-bands/00000000-0000-0000-0000-0000000000a4"
              payload: {}
              as: AuditInspector
            - call: "GET /weight-programs/00000000-0000-0000-0000-0000000000a5"
              payload: {}
              as: AuditInspector
            - call: "GET /flights/00000000-0000-0000-0000-0000000000a6"
              payload: {}
              as: AuditInspector
            - call: "GET /load-plans/00000000-0000-0000-0000-0000000000a7"
              payload: {}
              as: AuditInspector
            - call: "GET /pax-lines/00000000-0000-0000-0000-0000000000a8"
              payload: {}
              as: AuditInspector
            - call: "GET /bag-allocations/00000000-0000-0000-0000-0000000000a9"
              payload: {}
              as: AuditInspector
            - call: "GET /cargo-items/00000000-0000-0000-0000-0000000000b1"
              payload: {}
              as: AuditInspector
            - call: "GET /hazmat-declarations/00000000-0000-0000-0000-0000000000b2"
              payload: {}
              as: AuditInspector
            - call: "GET /load-sheets/00000000-0000-0000-0000-0000000000b3"
              payload: {}
              as: AuditInspector
            - call: "GET /last-minute-changes/00000000-0000-0000-0000-0000000000b4"
              payload: {}
              as: AuditInspector
            - call: "GET /load-audits/00000000-0000-0000-0000-0000000000b5"
              payload: {}
              as: AuditInspector
          assert:
            - "every trigger returns HTTP 404 with response_type == \"error\""
            - "error_id sequence is exactly ERR_AIRCRAFT_NOT_FOUND, ERR_COMPARTMENT_NOT_FOUND, ERR_RUNWAY_NOT_FOUND, ERR_PERFORMANCE_BAND_NOT_FOUND, ERR_WEIGHT_PROGRAM_NOT_FOUND, ERR_FLIGHT_NOT_FOUND, ERR_LOAD_PLAN_NOT_FOUND, ERR_PAX_LINE_NOT_FOUND, ERR_BAG_ALLOCATION_NOT_FOUND, ERR_CARGO_ITEM_NOT_FOUND, ERR_DECLARATION_NOT_FOUND, ERR_LOAD_SHEET_NOT_FOUND, ERR_LAST_MINUTE_CHANGE_NOT_FOUND, ERR_AUDIT_NOT_FOUND"

      - name: create_flight_missing_required_crew_weight_returns_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - endpoints[POST /flights]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          crew_weight_kg has source input with no default and feeds
          calculate_dry_operating_weight, so its absence is a 400 shape error
          detected before any existence, posture or performance lookup — the
          referenced aircraft, runway and program in the same body are all
          valid.
        test_recipe:
          setup:
            - "AC1, runway R1 with the [15,30) band and STD-2026 all exist; only the request body is defective."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp: $.data.id }
          trigger:
            - call: "POST /flights"
              payload: { flight_number: "LX1602", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
          assert:
            - "HTTP 400 with data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /flights returns total_count == 0"

      - name: creation_defaults_seat_capacity_gate_bag_policy_strategy_and_rounding_mode
        claim_type: defaults
        grounds:
          - entities.Compartment.fields.seat_capacity
          - entities.LoadPlan.fields.gate_bag_policy
          - entities.LoadPlan.fields.offload_strategy
          - entities.LoadPlan.fields.rounding_mode
          - entities.Runway.fields.slot_capacity_per_window
        distinguishing_aspect: |
          Four declared defaults are applied when their fields are omitted: a
          hold created without seat_capacity reads 0, and a plan created with
          only flight_id plus the OCC token reads gate_bag_policy
          ABSORB_INTO_UNDERLOAD, offload_strategy PRIORITY_FIRST and
          rounding_mode PER_LINE_THEN_SUM, revision_no 1, status DRAFT.
        test_recipe:
          setup:
            - "AC1 with OC; runway R1 with the [15,30) band; STD-2026; FLT."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
              payload: { airport_code: "LSGG", designator: "04", elevation_ft: 1411, length_m: 3900, slot_capacity_per_window: 2 }
              as: LoadControlAdmin
              captures: { rw: $.data.id }
            - call: "POST /performance-bands"
              payload: { runway_id: "${rw}", aircraft_type_code: "B738", temp_lo_c: 15, temp_hi_c: 30, base_limit_weight_kg: 74500 }
              as: LoadControlAdmin
            - call: "POST /weight-programs"
              payload: { code: "STD-2026", program_kind: "STANDARD", male_kg: 88.0, female_kg: 70.0, child_kg: 35.0, infant_kg: 10.0, checked_bag_kg: 13.0, documentation_ref: "OM-A 8.1.3 rev 12" }
              as: LoadControlAdmin
              captures: { wp: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T06:00:00Z" }
              as: LoadControlAdmin
            - call: "POST /flights"
              payload: { flight_number: "LX1602", aircraft_id: "${ac1}", departure_runway_id: "${rw}", weight_program_id: "${wp}", scheduled_off_block_utc: "2026-08-15T10:00:00Z", scheduled_on_block_utc: "2026-08-15T12:30:00Z", crew_weight_kg: 1150, crew_arm_m: 13.500, ramp_fuel_kg: 9800, taxi_fuel_kg: 250, trip_fuel_kg: 6900, outside_air_temp_c: 22, headwind_component_kt: 6, runway_condition: "DRY" }
              as: LoadController
              captures: { f1: $.data.id, f1_ver: $.data.version }
          trigger:
            - call: "POST /compartments"
              payload: { aircraft_id: "${ac1}", code: "H1", kind: "HOLD", arm_m: 9.200, max_weight_kg: 4500, running_load_limit_kg_per_m: 900, length_m: 5.0 }
              as: LoadControlAdmin
              captures: { h1: $.data.id }
            - call: "POST /load-plans"
              payload: { flight_id: "${f1}", expected_flight_version: "${f1_ver}" }
              as: LoadController
              captures: { lp1: $.data.id }
          assert:
            - "Compartment.${h1}.seat_capacity == 0"
            - "LoadPlan.${lp1}.gate_bag_policy == \"ABSORB_INTO_UNDERLOAD\""
            - "LoadPlan.${lp1}.offload_strategy == \"PRIORITY_FIRST\""
            - "LoadPlan.${lp1}.rounding_mode == \"PER_LINE_THEN_SUM\""
            - "LoadPlan.${lp1}.revision_no == 1"
            - "LoadPlan.${lp1}.status == \"DRAFT\""
            - "LoadPlan.${lp1}.base_payload_kg == 0"
            - "LoadPlan.${lp1}.envelope_ok == false"

      - name: flight_creation_computes_dry_operating_performance_and_allowed_payload
        claim_type: computed_fields
        grounds:
          - calculations.calculate_dry_operating_weight
          - calculations.calculate_performance_limited_takeoff_weight
          - calculations.calculate_allowed_payload
          - entities.Flight.fields.limiting_factor
        distinguishing_aspect: |
          One POST /flights runs three chained calculations: DOW 42550 and DOI
          62.53 (crew index delta round2(1150 * (13.500 - 17.000) / 1000) =
          -4.03 on basic_index 66.56); PLTOW 73810 from base 74500 minus
          altitude 310.42 minus temperature 910.00 plus wind 540.00, floored to
          the next lower 10; and allowed_payload_kg 20180.00 with
          limiting_factor MZFW, which is neither the performance candidate
          (21710) nor the smallest-looking structural one.
        test_recipe:
          setup:
            - "AC1, runway R1 with all three bands, STD-2026, clock at 2026-08-15T06:00:00Z."
          setup_api_calls:
            - call: "POST /aircraft"
              payload: { registration: "HB-AAA", type_code: "B738", basic_empty_weight_kg: 41400, basic_index: 66.56, max_takeoff_weight_kg: 79000, max_landing_weight_kg: 66360, max_zero_fuel_weight_kg: 62730, max_taxi_weight_kg: 79200, ref_arm_m: 17.000, lemac_m: 17.000, mac_length_m: 4.200, index_c: 1000, index_k: 50, fuel_arm_m: 17.900, seat_count: 162, zfw_fwd_limit_pct_mac: 6.0, zfw_aft_limit_pct_mac: 30.0, tow_fwd_limit_pct_mac: 5.0, tow_aft_limit_pct_mac: 28.0, tow_knee_weight_kg: 60000, tow_aft_knee_adjust_pct_mac: -1.5 }
              as: LoadControlAdmin
              captures: { ac1: $.data.id }
            - call: "POST /runways"
