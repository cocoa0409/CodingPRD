      - name: total_loss_voids_unordered_parts_and_releases_the_stall
        claim_type: side_effect_execution
        grounds:
          - state_machines.RepairOrder.BLUEPRINTED_to_TOTAL_LOSS
          - state_machines.PartsLine.PLANNED_to_VOID
          - calculations.stall_occupancy_rollup
          - calculations.authorization_posture_derivation
        distinguishing_aspect: >-
          Every declared side effect of the total-loss hop is observed in one response: DRAFT lines to
          VOID, the un-ordered PartsLine to VOID with extended_price_cents 0, the money rollups back to
          zero, the SCHEDULED assignment to CANCELLED, the stall's booked_minutes released from 240 to
          0, and the posture re-derived to OPEN. A partial implementation that voids lines but leaves
          the stall booked fails on the fourth assert.
        test_recipe:
          setup:
            - "A BLUEPRINTED RepairOrder with two DRAFT lines (BODY 4.5 and REFINISH 2.0), one PLANNED PartsLine, and one SCHEDULED REPAIR booking 08:00-12:00 on a BODY stall (booked_minutes 240)."
