      - name: approve_own_harvest_segregation_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_SEGREGATION_OF_DUTIES]", state_machines.Harvest.RECORDED_to_APPROVED]
        distinguishing_aspect: "The harvest approval path carries the same segregation rule as inspections: a manager whose id equals the recorder's (bk-1) is rejected."
