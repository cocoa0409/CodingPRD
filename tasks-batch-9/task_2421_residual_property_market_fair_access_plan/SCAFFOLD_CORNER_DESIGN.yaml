      - name: rate_filing_reviewed_by_its_own_filer_is_rejected
        claim_type: segregation_of_duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations[priority=23]
          - complexity_profile.role_model
        distinguishing_aspect: "Segregation is identity-based, not role-based: a Regulator whose X-User-ID equals the filing's filed_by_user_id (both dual-hatted-1) is refused with 409 ERR_SEGREGATION_OF_DUTIES while the filing stays FILED, and the identical APPROVE from a different Regulator id then succeeds."
        test_recipe:
          setup:
