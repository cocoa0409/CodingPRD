  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: remedy_claim_cross_entity_state_priority10_beats_units_fiscal_priority33
        grounds:
          - validations[10].ERR_RECALL_PLAN_STATE_INVALID
          - validations[33].ERR_UNITS_OUTSTANDING_EXCEEDED
          - endpoints["POST /product-safety/remedy-claims"]
          - entities.Recall.fields.plan_status
          - entities.Recall.fields.units_outstanding
        distinguishing_aspect: |
          Category pair (state, business_fiscal) — priority 10 against priority 33,
          the widest gap in the ladder. A single request violates BOTH: the parent
          Recall is still in plan_status DRAFT (claims require APPROVED or
          MONITORING) AND quantity 150 exceeds units_outstanding 100. The correct
          answer is the cross-entity state error at 409, because a workflow that
          has not been approved cannot be reasoned about fiscally at all; an
          implementation that checks the cheap arithmetic bound first leaks 422
          ERR_UNITS_OUTSTANDING_EXCEEDED and is detected here.
        test_recipe:
          setup:
            - "a Recall left in plan_status DRAFT with units_in_commerce 100, units_outstanding 100 and remedy_options [REFUND, REPAIR]"
            - "no plan submission or approval performed"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /product-safety/product-models"
              payload: { model_code: "TOAST-X1", brand: "Hearthline", category: "KITCHEN_APPLIANCE", units_distributed: 100, units_registered: 60 }
              as: ProgramAdmin
