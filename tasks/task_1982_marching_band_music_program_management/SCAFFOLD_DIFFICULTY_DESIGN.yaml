  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: instrument_cyclic_lifecycle_loop
        grounds:
          - state_machines.Instrument.AVAILABLE_to_CHECKED_OUT
          - state_machines.Instrument.RETURN_PENDING_INSPECTION_to_IN_MAINTENANCE
          - state_machines.Instrument.IN_MAINTENANCE_to_AVAILABLE
        distinguishing_aspect: |
          Cyclic shape on Instrument: AVAILABLE → CHECKED_OUT →
          RETURN_PENDING_INSPECTION → IN_MAINTENANCE → AVAILABLE → CHECKED_OUT
          (second checkout proves the loop closed).
        test_recipe:
          setup:
            - "Program, enrolled students S1/S2, instrument I (AVAILABLE)"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "CY", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "C1", grade: 9, section: "PERCUSSION" }, as: BandDirector, captures: { s1: $.data.id } }
            - { call: "POST /band/students/${s1}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "C2", grade: 10, section: "PERCUSSION" }, as: BandDirector, captures: { s2: $.data.id } }
            - { call: "POST /band/students/${s2}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-CY-1", instrument_type: "SNARE", replacement_value_cents: 30000 }, as: EquipmentManager, captures: { inst: $.data.id } }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${s1}", instrument_id: "${inst}", due_date: "2026-08-20T00:00:00Z" }, as: EquipmentManager, captures: { asg: $.data.id } }
          trigger:
            - { call: "POST /band/instrument-assignments/${asg}/return", payload: { inspection_result: "FAIL" }, as: EquipmentManager }
            - { call: "POST /band/instruments/${inst}/complete-maintenance", payload: { repair_cost_cents: 1500 }, as: EquipmentManager }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${s2}", instrument_id: "${inst}", due_date: "2026-08-25T00:00:00Z" }, as: EquipmentManager, captures: { asg2: $.data.id } }
            - { call: "GET /band/instruments/${inst}", payload: {}, as: Any }
            - { call: "GET /band/programs/${prog}", payload: {}, as: Any }
          assert:
            - "Instrument.${inst}.status == CHECKED_OUT after the full loop"
            - "Instrument.${inst}.condition_grade == GOOD (degraded by FAIL then restored at maintenance completion)"
            - "BandProgram.${prog}.repair_spent_cents == 1500"
            - "InstrumentAssignment.${asg}.status == RETURNED; InstrumentAssignment.${asg2}.status == ACTIVE"
      - name: trip_enrollment_parallel_state_dimensions
        grounds:
          - state_machines.TripEnrollment
          - entities.TripEnrollment.fields.payment_status
          - entities.TripEnrollment.fields.attendance_status
        distinguishing_aspect: |
          Parallel dimensions on one entity: payment_status (UNPAID → PARTIAL →
          PAID) evolves via Payment posts while attendance_status (REGISTERED →
          CONFIRMED) evolves via confirm — a partial payment leaves attendance
          untouched and confirm is gated on the payment dimension alone.
        test_recipe:
          setup:
            - "Program; event; trip est 10000 capacity 5 departure 2026-09-15 roster open; enrolled student; enrollment created (provisional share 10000)"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "PD", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY", starts_at: "2026-09-15T15:00:00Z", ends_at: "2026-09-15T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, evt_v: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${evt_v}", capacity: 5, estimated_cost_cents: 10000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { trip: $.data.id } }
            - { call: "POST /band/trips/${trip}/open-roster", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "PP", grade: 10, section: "GUARD" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/trip-enrollments", payload: { trip_id: "${trip}", student_id: "${stu}" }, as: BandDirector, captures: { enr: $.data.id } }
          trigger:
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 4000, trip_enrollment_id: "${enr}" }, as: BoosterTreasurer }
            - { call: "GET /band/trip-enrollments/${enr}", payload: {}, as: Any }
            - { call: "POST /band/trip-enrollments/${enr}/confirm", payload: {}, as: BandDirector, captures: { err1: $.data.error_id } }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 6000, trip_enrollment_id: "${enr}" }, as: BoosterTreasurer }
            - { call: "POST /band/trip-enrollments/${enr}/confirm", payload: {}, as: BandDirector }
            - { call: "GET /band/trip-enrollments/${enr}", payload: {}, as: Any }
          assert:
            - "After 4000 payment: payment_status == PARTIAL and attendance_status == REGISTERED (dimensions move independently)"
            - "First confirm rejected: err1 == ERR_ENROLLMENT_NOT_PAID"
            - "After second payment + confirm: payment_status == PAID and attendance_status == CONFIRMED"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: event_cancel_cascades_trip_enrollment_refund_balance
        grounds:
          - state_machines.Event.SCHEDULED_to_CANCELLED
          - state_machines.Trip.PLANNING_to_CANCELLED
          - state_machines.TripEnrollment.REGISTERED_to_EXCUSED
          - calculations.account_balance_aggregation
        distinguishing_aspect: |
          Depth-4 chain from trigger POST /band/events/{id}/cancel: Event →
          CANCELLED mutates Trip → CANCELLED, whose cancellation mutates
          TripEnrollment (→ EXCUSED, REFUNDED), whose refund posts a REFUND
          Payment, whose posting recomputes Student.account_balance_cents.
        test_recipe:
          setup:
            - "Program; outdoor event 2026-09-15; trip est 10000 capacity 5 departure 2026-09-15T06:00:00Z, roster open; enrolled student trip-enrolled, paid 10000, CONFIRMED; truck charter linked; roster locked; clock at default 2026-08-01 (45 days to departure → 100% refund tier)"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "CC", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY", starts_at: "2026-09-15T15:00:00Z", ends_at: "2026-09-15T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, evt_v: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${evt_v}", capacity: 5, estimated_cost_cents: 10000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { trip: $.data.id } }
            - { call: "POST /band/trips/${trip}/open-roster", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "CC", grade: 10, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/trip-enrollments", payload: { trip_id: "${trip}", student_id: "${stu}" }, as: BandDirector, captures: { enr: $.data.id } }
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 10000, trip_enrollment_id: "${enr}" }, as: BoosterTreasurer }
            - { call: "POST /band/trip-enrollments/${enr}/confirm", payload: {}, as: BandDirector }
            - { call: "POST /band/truck-charters", payload: { program_id: "${prog}", event_id: "${evt}", vehicle_label: "TRUCK-9", capacity_weight_lb: 4000, capacity_volume_cuft: 400, window_start: "2026-09-15T04:00:00Z", window_end: "2026-09-16T02:00:00Z" }, as: EquipmentManager }
            - { call: "POST /band/trips/${trip}/lock-roster", payload: {}, as: BandDirector }
          trigger:
            - { call: "POST /band/events/${evt}/cancel", payload: {}, as: BandDirector }
            - { call: "GET /band/trips/${trip}", payload: {}, as: Any }
            - { call: "GET /band/trip-enrollments/${enr}", payload: {}, as: Any }
            - { call: "GET /band/payments", payload: { student_id: "${stu}", kind: "REFUND" }, as: Any, captures: { refund_amt: "$.data[0].amount_cents" } }
            - { call: "GET /band/students/${stu}", payload: {}, as: Any }
          assert:
            - "Event.${evt}.status == CANCELLED"
            - "Trip.${trip}.status == CANCELLED (caused by event cancel, not by a direct trip call)"
            - "TripEnrollment.${enr}.attendance_status == EXCUSED and payment_status == REFUNDED"
            - "refund_amt == 10000 (full net_paid at >=14-day tier)"
            - "Student.${stu}.account_balance_cents == 0 (payment 10000 then refund 10000)"
      - name: student_withdraw_cascades_assets_and_enrollment
        grounds:
          - state_machines.Student.ENROLLED_to_WITHDRAWN
          - state_machines.InstrumentAssignment.ACTIVE_to_RETURNED
          - state_machines.Instrument.CHECKED_OUT_to_RETURN_PENDING_INSPECTION
          - state_machines.UniformAssignment.ISSUED_to_RETURNED
        distinguishing_aspect: |
          Depth-3 chain from a DIFFERENT trigger (POST /band/students/{id}/withdraw):
          Student → WITHDRAWN forces InstrumentAssignment → RETURNED, whose
          forced return drives Instrument → RETURN_PENDING_INSPECTION; in
          parallel UniformAssignment → RETURNED drives Uniform → RETURNED_DIRTY.
        test_recipe:
          setup:
            - "Program; student ENROLLED with an ACTIVE instrument assignment (SNARE) and an ISSUED JACKET; clock default"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "WD", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "WD", grade: 11, section: "PERCUSSION" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-WD-1", instrument_type: "SNARE", replacement_value_cents: 30000 }, as: EquipmentManager, captures: { inst: $.data.id } }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu}", instrument_id: "${inst}", due_date: "2026-08-20T00:00:00Z" }, as: EquipmentManager, captures: { asg: $.data.id } }
            - { call: "POST /band/uniforms", payload: { program_id: "${prog}", garment_type: "JACKET", size_label: "M" }, as: EquipmentManager, captures: { uni: $.data.id } }
            - { call: "POST /band/uniform-assignments", payload: { student_id: "${stu}", uniform_id: "${uni}" }, as: EquipmentManager, captures: { uas: $.data.id } }
          trigger:
            - { call: "POST /band/students/${stu}/withdraw", payload: {}, as: BandDirector }
            - { call: "GET /band/instrument-assignments/${asg}", payload: {}, as: Any }
            - { call: "GET /band/instruments/${inst}", payload: {}, as: Any }
            - { call: "GET /band/uniform-assignments/${uas}", payload: {}, as: Any }
            - { call: "GET /band/uniforms/${uni}", payload: {}, as: Any }
          assert:
            - "Student.${stu}.enrollment_status == WITHDRAWN"
            - "InstrumentAssignment.${asg}.status == RETURNED (forced by withdrawal)"
            - "Instrument.${inst}.status == RETURN_PENDING_INSPECTION (third hop)"
            - "UniformAssignment.${uas}.status == RETURNED and Uniform.${uni}.status == RETURNED_DIRTY"
            - "Student.${stu}.account_balance_cents == 15000 (FLAT default rental debit retained; no trip refunds involved)"

  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_error_beats_fiscal_error_on_assignment_create
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - errors[ERR_INSTRUMENT_NOT_AVAILABLE]
          - errors[ERR_STUDENT_DELINQUENT_FEES]
        distinguishing_aspect: |
          Category pair (state vs business_fiscal): one request that violates
          both — instrument IN_MAINTENANCE and student delinquent (balance 2501
          > grace 2500) — must surface ERR_INSTRUMENT_NOT_AVAILABLE (priority 7
          state) not ERR_STUDENT_DELINQUENT_FEES (priority 12 fiscal).
        test_recipe:
          setup:
            - "Program grace 2500; student A ENROLLED with MANUAL_DEBIT 2501 (delinquent); student B ENROLLED holding instrument I returned FAIL so I is IN_MAINTENANCE"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "PV1", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Delq", grade: 10, section: "BRASS" }, as: BandDirector, captures: { stu_a: $.data.id } }
            - { call: "POST /band/students/${stu_a}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/payments", payload: { student_id: "${stu_a}", kind: "MANUAL_DEBIT", amount_cents: 2501 }, as: BoosterTreasurer }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Holder", grade: 10, section: "BRASS" }, as: BandDirector, captures: { stu_b: $.data.id } }
            - { call: "POST /band/students/${stu_b}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-PV-1", instrument_type: "TROMBONE", replacement_value_cents: 60000 }, as: EquipmentManager, captures: { inst: $.data.id } }
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu_b}", instrument_id: "${inst}", due_date: "2026-08-20T00:00:00Z" }, as: EquipmentManager, captures: { asg_b: $.data.id } }
            - { call: "POST /band/instrument-assignments/${asg_b}/return", payload: { inspection_result: "FAIL" }, as: EquipmentManager }
          trigger:
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu_a}", instrument_id: "${inst}", due_date: "2026-08-25T00:00:00Z" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INSTRUMENT_NOT_AVAILABLE (state, priority 7, wins over business_fiscal priority 12)"
            - "Student.${stu_a} remains delinquent and Instrument.${inst}.status == IN_MAINTENANCE (no side effects fired)"
      - name: temporal_error_beats_constraint_error_on_event_create
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_EVENT_WINDOW_INVALID]
          - errors[ERR_FACILITY_CONFLICT]
        distinguishing_aspect: |
          Category pair (business_temporal vs business_constraint) — different
          pair from the instance above: an event whose window is both inverted
          (ends_at < starts_at) and overlapping an existing STADIUM booking must
          surface ERR_EVENT_WINDOW_INVALID, not ERR_FACILITY_CONFLICT.
        test_recipe:
          setup:
            - "Program; existing event STADIUM 2026-08-10T10:00:00Z–12:00:00Z SCHEDULED"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "PV2", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "REHEARSAL", facility: "STADIUM", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id } }
          trigger:
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "REHEARSAL", facility: "STADIUM", starts_at: "2026-08-10T11:00:00Z", ends_at: "2026-08-10T10:30:00Z", is_outdoor: true }, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_EVENT_WINDOW_INVALID (temporal priority 9 wins over constraint priority 10)"
            - "No second event created: GET /band/events?program_id&facility=STADIUM total_count == 1"

  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: truck_weight_inclusive_capacity_boundary
        grounds:
          - calculations.truck_capacity_check
          - entities.TruckCharter.fields.loaded_weight_lb
        distinguishing_aspect: |
          Metric: weight capacity. Inclusive boundary: loads summing to EXACTLY
          capacity_weight_lb (600 + 400 = 1000) are accepted; one more pound
          (1001 total) is rejected with ERR_TRUCK_OVERWEIGHT.
        test_recipe:
          setup:
            - "Program; charter TRUCK-2 capacity_weight_lb 1000, capacity_volume_cuft 1000"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "TW", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/truck-charters", payload: { program_id: "${prog}", vehicle_label: "TRUCK-2", capacity_weight_lb: 1000, capacity_volume_cuft: 1000, window_start: "2026-09-01T04:00:00Z", window_end: "2026-09-01T23:00:00Z" }, as: EquipmentManager, captures: { chart: $.data.id } }
          trigger:
            - { call: "POST /band/truck-charters/${chart}/loads", payload: { description: "trunks", weight_lb: 600, volume_cuft: 100 }, as: EquipmentManager }
            - { call: "POST /band/truck-charters/${chart}/loads", payload: { description: "drums", weight_lb: 400, volume_cuft: 100 }, as: EquipmentManager }
            - { call: "POST /band/truck-charters/${chart}/loads", payload: { description: "one pound", weight_lb: 1, volume_cuft: 1 }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "GET /band/truck-charters/${chart}", payload: {}, as: Any }
          assert:
            - "Second load accepted: TruckCharter.${chart}.loaded_weight_lb == 1000 (equality allowed)"
            - "err == ERR_TRUCK_OVERWEIGHT for the 1001st pound"
            - "TruckCharter.${chart}.loaded_weight_lb == 1000 after the rejected load (no partial application)"
      - name: delinquency_grace_strict_greater_boundary
        grounds:
          - calculations.account_balance_aggregation
          - entities.Student.fields.is_delinquent
        distinguishing_aspect: |
          Metric: money threshold on a DIFFERENT endpoint (POST
          /band/trip-enrollments). Balance exactly == grace (2500) is NOT
          delinquent (enrollment succeeds); balance 2501 is (402).
        test_recipe:
          setup:
            - "Program grace 2500; event; trip capacity 5 est 5000, roster open; student A balance exactly 2500 via MANUAL_DEBIT; student B balance 2501"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "DG", music_budget_cents: 100000, repair_budget_cents: 50000, delinquency_grace_cents: 2500 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY", starts_at: "2026-09-15T15:00:00Z", ends_at: "2026-09-15T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, evt_v: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${evt_v}", capacity: 5, estimated_cost_cents: 5000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { trip: $.data.id } }
            - { call: "POST /band/trips/${trip}/open-roster", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Edge", grade: 9, section: "GUARD" }, as: BandDirector, captures: { stu_a: $.data.id } }
            - { call: "POST /band/students/${stu_a}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/payments", payload: { student_id: "${stu_a}", kind: "MANUAL_DEBIT", amount_cents: 2500 }, as: BoosterTreasurer }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Over", grade: 9, section: "GUARD" }, as: BandDirector, captures: { stu_b: $.data.id } }
            - { call: "POST /band/students/${stu_b}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/payments", payload: { student_id: "${stu_b}", kind: "MANUAL_DEBIT", amount_cents: 2501 }, as: BoosterTreasurer }
          trigger:
            - { call: "POST /band/trip-enrollments", payload: { trip_id: "${trip}", student_id: "${stu_a}" }, as: BandDirector, captures: { enr_a: $.data.id } }
            - { call: "POST /band/trip-enrollments", payload: { trip_id: "${trip}", student_id: "${stu_b}" }, as: BandDirector, captures: { err: $.data.error_id } }
            - { call: "GET /band/students/${stu_a}", payload: {}, as: Any }
            - { call: "GET /band/students/${stu_b}", payload: {}, as: Any }
          assert:
            - "Student.${stu_a}.is_delinquent == false at balance == 2500 (equality)"
            - "TripEnrollment.${enr_a} created with attendance_status == REGISTERED"
            - "Student.${stu_b}.is_delinquent == true at balance == 2501"
            - "err == ERR_STUDENT_DELINQUENT_FEES for student B"
      - name: chair_capacity_exact_fit_then_alternate
        grounds:
          - calculations.chair_placement_assignment
          - entities.ChairPlacement.fields.is_alternate
        distinguishing_aspect: |
          Metric: seat count. With chair_capacity 2 and exactly 3 ranked
          entries, ranks 1-2 receive chair_number == rank and rank 3 receives
          chair_number null with is_alternate == true — the full/not-full edge.
        test_recipe:
          setup:
            - "Program RAW_WEIGHTED; audition BRASS capacity 2; three enrolled students with entries and one judge each (scores 90/90/90, 80/80/80, 70/70/70); scores finalized"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "CH", scoring_mode: "RAW_WEIGHTED", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "C1", grade: 9, section: "BRASS" }, as: BandDirector, captures: { s1: $.data.id } }
            - { call: "POST /band/students/${s1}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "C2", grade: 10, section: "BRASS" }, as: BandDirector, captures: { s2: $.data.id } }
            - { call: "POST /band/students/${s2}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "C3", grade: 11, section: "BRASS" }, as: BandDirector, captures: { s3: $.data.id } }
            - { call: "POST /band/students/${s3}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/auditions", payload: { program_id: "${prog}", section: "BRASS", chair_capacity: 2 }, as: BandDirector, captures: { aud: $.data.id } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud}", student_id: "${s1}" }, as: BandDirector, captures: { e1: $.data.id } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud}", student_id: "${s2}" }, as: BandDirector, captures: { e2: $.data.id } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud}", student_id: "${s3}" }, as: BandDirector, captures: { e3: $.data.id } }
            - { call: "POST /band/audition-entries/${e1}/scores", payload: { judge_id: "J1", musicianship: 90, marching: 90, leadership: 90 }, as: BandDirector }
            - { call: "POST /band/audition-entries/${e2}/scores", payload: { judge_id: "J1", musicianship: 80, marching: 80, leadership: 80 }, as: BandDirector }
            - { call: "POST /band/audition-entries/${e3}/scores", payload: { judge_id: "J1", musicianship: 70, marching: 70, leadership: 70 }, as: BandDirector }
            - { call: "POST /band/auditions/${aud}/finalize-scores", payload: {}, as: BandDirector, captures: { aud_v: $.data.version } }
          trigger:
            - { call: "POST /band/auditions/${aud}/placements", payload: { expected_audition_version: "${aud_v}" }, as: BandDirector }
            - { call: "GET /band/chair-placements", payload: { audition_id: "${aud}" }, as: Any }
          assert:
            - "Placement for entry ${e1}: chair_number == 1, is_alternate == false (single judge 90*0.95 = 85.5)"
            - "Placement for entry ${e2}: chair_number == 2, is_alternate == false (80*0.95 = 76.0)"
            - "Placement for entry ${e3}: chair_number == null, is_alternate == true (70*0.95 = 66.5 → rank 3 > capacity 2)"
            - "Audition.${aud}.status == PLACEMENTS_PUBLISHED"

  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: instrument_assignment_requires_enrolled_student
        grounds:
          - validations[priority=11]
          - state_machines.Student
          - errors[ERR_STUDENT_NOT_ENROLLED]
        distinguishing_aspect: |
          Entity pair InstrumentAssignment → Student: checkout to an APPLIED
          (never enrolled) student is rejected with ERR_STUDENT_NOT_ENROLLED
          even though the instrument is AVAILABLE.
        test_recipe:
          setup:
            - "Program ENROLLMENT_OPEN; student created but NOT enrolled (APPLIED); instrument AVAILABLE"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "XS", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Applicant", grade: 9, section: "WOODWIND" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-XS-1", instrument_type: "FLUTE", replacement_value_cents: 40000 }, as: EquipmentManager, captures: { inst: $.data.id } }
          trigger:
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu}", instrument_id: "${inst}", due_date: "2026-08-20T00:00:00Z" }, as: EquipmentManager, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STUDENT_NOT_ENROLLED"
            - "Instrument.${inst}.status == AVAILABLE (no side effects fired)"
      - name: trip_lock_requires_event_truck_charter
        grounds:
          - state_machines.Trip.ROSTER_OPEN_to_ROSTER_LOCKED
          - errors[ERR_CHARTER_REQUIRED]
        distinguishing_aspect: |
          Entity pair Trip → TruckCharter (different pair from above): locking a
          roster without any active TruckCharter for the trip's event is
          rejected; adding the charter unlocks the transition.
        test_recipe:
          setup:
            - "Program; event; trip roster open; no charter yet"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "XT", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY", starts_at: "2026-09-15T15:00:00Z", ends_at: "2026-09-15T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, evt_v: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${evt_v}", capacity: 5, estimated_cost_cents: 5000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { trip: $.data.id } }
            - { call: "POST /band/trips/${trip}/open-roster", payload: {}, as: BandDirector }
          trigger:
            - { call: "POST /band/trips/${trip}/lock-roster", payload: {}, as: BandDirector, captures: { err: $.data.error_id } }
            - { call: "POST /band/truck-charters", payload: { program_id: "${prog}", event_id: "${evt}", vehicle_label: "TRUCK-3", capacity_weight_lb: 2000, capacity_volume_cuft: 200, window_start: "2026-09-15T04:00:00Z", window_end: "2026-09-16T02:00:00Z" }, as: EquipmentManager }
            - { call: "POST /band/trips/${trip}/lock-roster", payload: {}, as: BandDirector }
          assert:
            - "err == ERR_CHARTER_REQUIRED on the first lock attempt"
            - "Second lock succeeds: Trip.${trip}.status == ROSTER_LOCKED"
      - name: placements_publish_requires_finalized_scores
        grounds:
          - state_machines.Audition.SCORES_FINALIZED_to_PLACEMENTS_PUBLISHED
          - errors[ERR_AUDITION_SCORES_NOT_FINAL]
        distinguishing_aspect: |
          Entity pair ChairPlacement → Audition (a third pair): publishing
          placements while the audition is still SCORING_OPEN is rejected with
          ERR_AUDITION_SCORES_NOT_FINAL.
        test_recipe:
          setup:
            - "Program; audition BRASS capacity 1 in SCORING_OPEN with one entry but no finalized scores"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "XA", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "AP", grade: 10, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/auditions", payload: { program_id: "${prog}", section: "BRASS", chair_capacity: 1 }, as: BandDirector, captures: { aud: $.data.id, aud_v: $.data.version } }
            - { call: "POST /band/audition-entries", payload: { audition_id: "${aud}", student_id: "${stu}" }, as: BandDirector }
          trigger:
            - { call: "POST /band/auditions/${aud}/placements", payload: { expected_audition_version: "${aud_v}" }, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_AUDITION_SCORES_NOT_FINAL"
            - "Audition.${aud}.status == SCORING_OPEN; GET /band/chair-placements?audition_id returns total_count == 0"

  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: facility_half_open_adjacency_allowed
        grounds:
          - calculations.facility_conflict_check
          - errors[ERR_FACILITY_CONFLICT]
        distinguishing_aspect: |
          Interval semantics: HALF-OPEN [start, end) on the Event/facility
          resource — an event starting exactly when another ends (12:00 after
          10:00-12:00 at STADIUM) is ACCEPTED, while a one-minute-early start
          (11:59) collides.
        test_recipe:
          setup:
            - "Program; event A at STADIUM 2026-08-10T10:00:00Z–12:00:00Z"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "FH", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "REHEARSAL", facility: "STADIUM", starts_at: "2026-08-10T10:00:00Z", ends_at: "2026-08-10T12:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt_a: $.data.id } }
          trigger:
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "SECTIONAL", facility: "STADIUM", starts_at: "2026-08-10T12:00:00Z", ends_at: "2026-08-10T14:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt_b: $.data.id } }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "SECTIONAL", facility: "STADIUM", starts_at: "2026-08-10T11:59:00Z", ends_at: "2026-08-10T13:00:00Z", is_outdoor: true }, as: BandDirector, captures: { err: $.data.error_id } }
          assert:
            - "Adjacent event created: Event.${evt_b}.status == SCHEDULED (back-to-back legal under half-open semantics)"
            - "err == ERR_FACILITY_CONFLICT for the 11:59 start"
      - name: vehicle_buffered_window_adjacency_rejected
        grounds:
          - calculations.vehicle_window_check
          - errors[ERR_VEHICLE_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Different interval semantics on a DIFFERENT resource (TruckCharter
          vehicle): a 2h loading buffer applies, so a charter starting exactly
          when another ends (12:00 after 08:00-12:00 on TRUCK-1) is REJECTED,
          while a start at 14:00 (exactly buffer end) is accepted.
        test_recipe:
          setup:
            - "Program; charter TRUCK-1 window 2026-09-01T08:00:00Z–12:00:00Z"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "VB", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/truck-charters", payload: { program_id: "${prog}", vehicle_label: "TRUCK-1", capacity_weight_lb: 4000, capacity_volume_cuft: 400, window_start: "2026-09-01T08:00:00Z", window_end: "2026-09-01T12:00:00Z" }, as: EquipmentManager, captures: { ch_a: $.data.id } }
          trigger:
            - { call: "POST /band/truck-charters", payload: { program_id: "${prog}", vehicle_label: "TRUCK-1", capacity_weight_lb: 4000, capacity_volume_cuft: 400, window_start: "2026-09-01T12:00:00Z", window_end: "2026-09-01T16:00:00Z" }, as: EquipmentManager, captures: { err: $.data.error_id } }
            - { call: "POST /band/truck-charters", payload: { program_id: "${prog}", vehicle_label: "TRUCK-1", capacity_weight_lb: 4000, capacity_volume_cuft: 400, window_start: "2026-09-01T14:00:00Z", window_end: "2026-09-01T16:00:00Z" }, as: EquipmentManager, captures: { ch_b: $.data.id } }
          assert:
            - "err == ERR_VEHICLE_WINDOW_CONFLICT for the adjacent 12:00 start (buffer forbids what half-open semantics allowed)"
            - "TruckCharter.${ch_b} created at exactly 14:00 (window_start == other.end + BUFFER is the inclusive acceptance edge)"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: trip_payment_then_cancel_refund_conserves_net_cash
        grounds:
          - calculations.account_balance_aggregation
          - calculations.refund_tier_of_withdrawal
          - state_machines.Trip.PLANNING_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: per-enrollment net cash. Invariant pinned:
          after (PAYMENT x) followed by trip cancel (REFUND x at >=14-day tier),
          TripEnrollment.net_paid_cents == 0 AND Student.account_balance_cents
          == 0 — the exact values before the forward action.
        test_recipe:
          setup:
            - "Program; event; trip est 8000 capacity 5 departure 2026-09-15 (>=14 days from clock 2026-08-01); enrolled student trip-enrolled; clock at default"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "CI", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/events", payload: { program_id: "${prog}", event_type: "COMPETITION", facility: "AWAY", starts_at: "2026-09-15T15:00:00Z", ends_at: "2026-09-15T21:00:00Z", is_outdoor: true }, as: BandDirector, captures: { evt: $.data.id, evt_v: $.data.version } }
            - { call: "POST /band/trips", payload: { event_id: "${evt}", expected_event_version: "${evt_v}", capacity: 5, estimated_cost_cents: 8000, departure_at: "2026-09-15T06:00:00Z" }, as: BandDirector, captures: { trip: $.data.id } }
            - { call: "POST /band/trips/${trip}/open-roster", payload: {}, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Inv", grade: 10, section: "BRASS" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/trip-enrollments", payload: { trip_id: "${trip}", student_id: "${stu}" }, as: BandDirector, captures: { enr: $.data.id } }
          trigger:
            - { call: "POST /band/payments", payload: { student_id: "${stu}", kind: "PAYMENT", amount_cents: 8000, trip_enrollment_id: "${enr}" }, as: BoosterTreasurer }
            - { call: "POST /band/trips/${trip}/cancel", payload: {}, as: BandDirector }
            - { call: "GET /band/trip-enrollments/${enr}", payload: {}, as: Any }
            - { call: "GET /band/students/${stu}", payload: {}, as: Any }
          assert:
            - "TripEnrollment.${enr}.net_paid_cents == 0 (8000 PAYMENT - 8000 REFUND)"
            - "TripEnrollment.${enr}.refunded_cents == 8000 and payment_status == REFUNDED"
            - "Student.${stu}.account_balance_cents == 0 — forward + compensating actions conserve net cash"
      - name: instrument_checkout_return_conserves_custody_count
        grounds:
          - state_machines.Instrument.AVAILABLE_to_CHECKED_OUT
          - state_machines.Instrument.RETURN_PENDING_INSPECTION_to_AVAILABLE
        distinguishing_aspect: |
          Conserved quantity: program-wide instrument custody count (different
          type from money above). Invariant: count(status == AVAILABLE) after a
          checkout + PASS return equals the count before; total instruments of
          the program is constant (2) throughout.
        test_recipe:
          setup:
            - "Program with 2 instruments; 1 enrolled student; clock default"
          setup_api_calls:
            - { call: "POST /band/programs", payload: { season_name: "CU", music_budget_cents: 100000, repair_budget_cents: 50000 }, as: BandDirector, captures: { prog: $.data.id } }
            - { call: "POST /band/programs/${prog}/advance", payload: { to_state: "ENROLLMENT_OPEN" }, as: BandDirector }
            - { call: "POST /band/students", payload: { program_id: "${prog}", full_name: "Cust", grade: 10, section: "WOODWIND" }, as: BandDirector, captures: { stu: $.data.id } }
            - { call: "POST /band/students/${stu}/enroll", payload: {}, as: BandDirector }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-CU-1", instrument_type: "FLUTE", replacement_value_cents: 40000 }, as: EquipmentManager, captures: { i1: $.data.id } }
            - { call: "POST /band/instruments", payload: { program_id: "${prog}", serial_number: "SN-CU-2", instrument_type: "CLARINET", replacement_value_cents: 35000 }, as: EquipmentManager, captures: { i2: $.data.id } }
          trigger:
            - { call: "POST /band/instrument-assignments", payload: { student_id: "${stu}", instrument_id: "${i1}", due_date: "2026-08-20T00:00:00Z" }, as: EquipmentManager, captures: { asg: $.data.id } }
            - { call: "POST /band/instrument-assignments/${asg}/return", payload: { inspection_result: "PASS" }, as: EquipmentManager }
            - { call: "GET /band/instruments", payload: { program_id: "${prog}", status: "AVAILABLE" }, as: Any }
            - { call: "GET /band/instruments", payload: { program_id: "${prog}" }, as: Any }
          assert:
            - "After checkout: AVAILABLE count == 1, CHECKED_OUT count == 1, total == 2"
            - "After PASS return: AVAILABLE count == 2 again (custody count conserved)"
            - "Instrument.${i1}.status == AVAILABLE and InstrumentAssignment.${asg}.status == RETURNED"
