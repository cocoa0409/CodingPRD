        claim_type: threshold
        grounds:
          - calculations.customer_structuring_aggregates.constants.REPORT_THRESHOLD_CENTS
          - entities.ComplianceReport.fields.report_type
        excluded_because:
          difficulty_instance: threshold_report_fires_at_exactly_one_million_cents_and_not_one_step_below
          rationale: "The threshold-boundary claim (a THRESHOLD_REPORT at settled_usd_gross_cents exactly 1000000 and none at 997230, the closest representable step below) is the entire subject of that §1.8 boundary_precision_check instance."

