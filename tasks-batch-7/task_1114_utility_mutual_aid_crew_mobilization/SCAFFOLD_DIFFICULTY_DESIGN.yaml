  # ==========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ==========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: mark_paid_state_beats_fiscal
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_PAYMENT_AMOUNT_MISMATCH]
        distinguishing_aspect: |
          Category pair (state, business_fiscal): invoice is SUBMITTED (state
          violation — mark_paid needs APPROVED) AND amount_cents 1 mismatches
          outstanding 201866 (fiscal violation); priority 5 beats priority 10, so
          the response is ERR_INVALID_STATE_TRANSITION, never the fiscal error.
        test_recipe:
          setup: ["Event DEMOBILIZING; invoice SUBMITTED with final_total_cents == outstanding_cents == 201866"]
