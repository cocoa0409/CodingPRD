              as: Dispatcher
            - call: "POST /api/dispatch/orders"
              payload: { appointment_id: "${ap_id}" }
              as: Dispatcher
          trigger:
            - call: "POST /api/appointments/${ap_id}/reprice"
              payload: { expected_pricebook_task_version: "${pt_v1}" }
              as: Dispatcher
              captures: { ok_quote: $.data.quoted_price_cents }
            - call: "POST /api/appointments/${ap_id}/reprice"
              payload: { expected_pricebook_task_version: "${pt_v1}" }
              as: Dispatcher
              captures: { err_id: $.data.error_id }
          assert:
            - "the first trigger call succeeds and its quoted_price_cents == 120000, the highest published revision's flat rate"
            - "the second trigger call, sent strictly after the first has completed, returns ERR_STALE_VERSION with http status 412"
            - "the two calls are sequential: the first reprice advanced the revision's version from ${pt_v1}, so the value the second call still carries is stale"
