  # =========================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and >= 2, different triggers)
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: class_cancel_cascade_depth3
        grounds:
          - state_machines.TrainingClass.OPEN_to_CANCELLED
          - state_machines.Enrollment.IN_PROGRESS_to_WITHDRAWN
          - entities.CostLedgerEntry.fields.entry_type
          - entities.Applicant.fields.ledger_balance_cents
        distinguishing_aspect: |
          Trigger: POST /training-classes/{id}/cancel. Depth-3 chain:
          class CANCELLED -> (link 1) enrollment WITHDRAWN -> (link 2, caused by
          the withdrawal) REVERSAL CostLedgerEntry inserted -> (link 3, caused by
          the ledger insert) Applicant.ledger_balance_cents recomputed. A
          completed 150000-cent ground session nets back to 0.
        test_recipe:
          setup:
            - "OPEN class with one enrollment IN_PROGRESS that has one COMPLETED GROUND_SCHOOL SESSION (charge 150000); applicant ledger balance 150000 before cancel"
          setup_api_calls:
            - { call: "POST /pilot-training/equipment", payload: { code: "A333", name: "Airbus A330", simulator_cost_per_hour_cents: 45000, ioe_hours_required: 10, landings_required_90d: 3 }, as: TrainingCoordinator, captures: { eq_id: $.data.id } }
            - { call: "POST /pilot-training/applicants", payload: { full_name: "Ivy Idd", email: "ivy@x.com", license_number: "L050", total_flight_hours: 2700 }, as: Recruiter, captures: { ap1: $.data.id } }
            - { call: "POST /pilot-training/applicants/${ap1}/advance-screening", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests", payload: { applicant_id: "${ap1}", request_type: "PRIA" }, as: Recruiter, captures: { rr1: $.data.id } }
            - { call: "POST /pilot-training/records-requests/${rr1}/send", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/receive", payload: { outcome: "RECEIVED" }, as: Recruiter }
            - { call: "POST /pilot-training/records-requests/${rr1}/verify", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/medical-certificates", payload: { applicant_id: "${ap1}", cert_class: "FIRST", issued_at: "2026-07-01T00:00:00Z", pilot_age_at_issue: 37 }, as: CrewScheduler }
            - { call: "POST /pilot-training/applicants/${ap1}/clear", payload: {}, as: Recruiter }
            - { call: "POST /pilot-training/training-classes", payload: { equipment_id: "${eq_id}", class_date: "2026-08-10T00:00:00Z", seat_capacity: 10, base_attrition_rate: 0.20 }, as: TrainingCoordinator, captures: { cls: $.data.id } }
            - { call: "POST /pilot-training/training-classes/${cls}/open", payload: {}, as: TrainingCoordinator }
            - { call: "GET /pilot-training/training-classes/${cls}", payload: {}, as: TrainingCoordinator, captures: { cv: $.data.version } }
            - { call: "POST /pilot-training/enrollments", payload: { applicant_id: "${ap1}", training_class_id: "${cls}", expected_training_class_version: "${cv}" }, as: TrainingCoordinator, captures: { en1: $.data.id } }
            - { call: "POST /pilot-training/enrollments/${en1}/confirm", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-classes/${cls}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/enrollments/${en1}/start", payload: {}, as: TrainingCoordinator }
            - { call: "POST /pilot-training/instructors", payload: { full_name: "Lee Gnd", instructor_type: "GROUND", daily_max_sessions: 6 }, as: TrainingCoordinator, captures: { ins_g: $.data.id } }
            - { call: "POST /pilot-training/training-events", payload: { enrollment_id: "${en1}", instructor_id: "${ins_g}", phase: "GROUND_SCHOOL", event_type: "SESSION", scheduled_start: "2026-08-10T10:00:00Z", scheduled_end: "2026-08-10T12:00:00Z" }, as: TrainingCoordinator, captures: { ev1: $.data.id } }
            - { call: "POST /pilot-training/_clock/set-current-utc", payload: { to_iso8601: "2026-08-10T10:00:00Z" }, as: SystemAdmin }
            - { call: "POST /pilot-training/training-events/${ev1}/complete", payload: { score: 92 }, as: TrainingCoordinator }
            - { call: "GET /pilot-training/applicants/${ap1}", payload: {}, as: Recruiter, captures: { bal_pre: $.data.ledger_balance_cents } }
          trigger:
            # Class cancel from IN_SESSION is legal per §1.2 (cancel preconditions
            # cover SCHEDULED/OPEN/IN_SESSION), so the depth-3 cascade carries money.
            - { call: "POST /pilot-training/training-classes/${cls}/cancel", payload: {}, as: TrainingCoordinator, captures: { cls_status: $.data.status } }
            - { call: "GET /pilot-training/enrollments/${en1}", payload: {}, as: TrainingCoordinator, captures: { en_status: $.data.status } }
            - { call: "GET /pilot-training/applicants/${ap1}", payload: {}, as: Recruiter, captures: { bal_post: $.data.ledger_balance_cents } }
          assert:
            - "TrainingClass.${cls}.status == CANCELLED"
            - "link 1: Enrollment.${en1}.status == WITHDRAWN"
            - "link 2: a CostLedgerEntry with enrollment_id == ${en1} and entry_type == REVERSAL and amount_cents == -150000 exists (GET /pilot-training/cost-ledger?enrollment_id=${en1}&entry_type=REVERSAL returns exactly 1 row)"
            - "link 3: Applicant.${ap1}.ledger_balance_cents == 0 (150000 charge + (-150000) reversal)"
      - name: medical_grounding_cascade_depth2
        grounds:
          - state_machines.MedicalCertificate.VALID_to_DOWNGRADED
          - state_machines.Qualification.QUALIFIED_to_GROUNDED
          - state_machines.TrainingEvent.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Trigger: POST /_ops/run-daily-scan (different trigger from the class
          cancel cascade). Depth-2 chain: MedicalCertificate VALID -> DOWNGRADED
          -> (link 1, caused by the medical transition) Qualification
          operating_state ACTIVE -> GROUNDED -> (link 2, caused by the grounding)
          all SCHEDULED TrainingEvents of the applicant -> CANCELLED.
        test_recipe:
          setup:
            - "Applicant cleared with medical issued 2026-02-10 at age 45 (first-class valid through 2026-08-31); qualification granted; enrollment IN_PROGRESS with one SCHEDULED GROUND_SCHOOL event; clock advanced to 2026-09-01 so the certificate leaves VALID"
          setup_api_calls:
