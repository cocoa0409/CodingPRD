            payload: { applicant_email: "ready@ex.test", applicant_full_name: "Ready Rita", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}", identity_document_reference: "DOC-RITA" }
            as: PlatformAdmin
            captures: { app_r_id: "$.data.id" }
          - call: "POST /direct-selling/enrollment-applications/${app_r_id}/accept-agreement"
            payload: { agreement_version: "AGR-2026-01" }
            as: Applicant
            as_user_id: "${app_r_id}"
          - call: "POST /direct-selling/enrollment-applications/${app_r_id}/identity-decision"
            payload: { decision: "VERIFY" }
            as: ComplianceOfficer
          - call: "POST /direct-selling/enrollment-applications/${app_r_id}/pay-starter-kit"
            payload: { amount_cents: 11129, payment_reference: "KIT-PAY-RITA" }
            as: PlatformAdmin
            captures: { r_status: "$.data.status" }
          - call: "POST /direct-selling/enrollment-applications"
            payload: { applicant_email: "pend@ex.test", applicant_full_name: "Pending Pat", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}", identity_document_reference: "DOC-PAT" }
            as: PlatformAdmin
            captures: { app_p_id: "$.data.id", p_ident: "$.data.identity_status", p_att: "$.data.identity_attempt_count" }
          - call: "POST /direct-selling/enrollment-applications"
            payload: { applicant_email: "bare@ex.test", applicant_full_name: "Bare Bert", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}" }
            as: PlatformAdmin
            captures: { app_b_id: "$.data.id" }
          trigger:
          - call: "POST /direct-selling/enrollment-applications/${app_p_id}/identity-submission"
            payload: { identity_document_reference: "DOC-PAT-2" }
            as: PlatformAdmin
            captures: { e_resub: "$.data.error_id" }
          - call: "POST /direct-selling/enrollment-applications/${app_b_id}/identity-decision"
            payload: { decision: "VERIFY" }
            as: ComplianceOfficer
            captures: { e_notpending: "$.data.error_id" }
          - call: "POST /direct-selling/enrollment-applications/${app_b_id}/approve"
            payload: {}
            as: ComplianceOfficer
            captures: { e_incomplete: "$.data.error_id" }
          - call: "POST /direct-selling/enrollment-applications/${app_b_id}/pay-starter-kit"
            payload: { amount_cents: 11129, payment_reference: "EARLY" }
            as: PlatformAdmin
            captures: { e_agreement: "$.data.error_id" }
          - call: "POST /direct-selling/enrollment-applications/${app_r_id}/identity-submission"
            payload: { identity_document_reference: "DOC-RITA-2" }
            as: PlatformAdmin
            captures: { e_notdraft: "$.data.error_id" }
          - call: "POST /direct-selling/enrollment-applications/${app_r_id}/withdraw"
            payload: { reason: "CHANGED_MIND" }
            as: PlatformAdmin
            captures: { e_paidkit: "$.data.error_id" }
          assert:
            - "r_status == READY_FOR_APPROVAL once all three dimensions are satisfied (the compound rollup, not a stored input)"
            - "p_ident == PENDING_REVIEW and p_att == 1: supplying the document at creation counts as the first attempt"
            - "e_resub == ERR_IDENTITY_NOT_RESUBMITTABLE with HTTP 409 (priority 20 requires UNVERIFIED or FAILED)"
            - "e_notpending == ERR_IDENTITY_NOT_PENDING with HTTP 409 (priority 22 requires PENDING_REVIEW)"
            - "e_incomplete == ERR_ENROLLMENT_INCOMPLETE with HTTP 409 (approve requires READY_FOR_APPROVAL)"
            - "e_agreement == ERR_AGREEMENT_REQUIRED with HTTP 409 (priority 23 precedes the amount check, so a correct 11129 still fails)"
            - "e_notdraft == ERR_APPLICATION_NOT_DRAFT with HTTP 409: dimension writes are refused once the rollup left DRAFT, and priority 15 wins over priority 20"
            - "e_paidkit == ERR_KIT_PAID_NOT_WITHDRAWABLE with HTTP 409 (a paid kit blocks withdrawal even from READY_FOR_APPROVAL)"
            - "application R is still READY_FOR_APPROVAL and application B is still DRAFT after all six rejections"

