            - { call: "GET /api/v1/amortization-entries", payload: { regulatory_asset_id: "${ra1}", status: "PENDING" }, as: UtilityFiler, captures: { am1: "$.data[0].id" } }
          trigger:
            - { call: "POST /api/v1/amortization-entries/${am1}/post", payload: {}, as: UtilityFiler, captures: { am1_st: $.data.status } }
            - { call: "GET /api/v1/regulatory-assets/${ra1}", payload: {}, as: UtilityFiler, captures: { amort_mid: $.data.amortized_to_date_cents } }
            - { call: "POST /api/v1/amortization-entries/${am1}/reverse", payload: {}, as: UtilityFiler, captures: { am1_st2: $.data.status } }
            - { call: "GET /api/v1/regulatory-assets/${ra1}", payload: {}, as: UtilityFiler, captures: { amort_end: $.data.amortized_to_date_cents } }
          assert:
            - "Captured entry ${am1} has period_index == 1 and amount_cents == 2500000 (earliest PENDING)"
            - "${am1_st} == POSTED; ${amort_mid} == 2500000; coverage invariant: 2500000 + (2500000+2500000+2500001) == 10000001 == principal"
            - "${am1_st2} == REVERSED; ${amort_end} == 0; invariant restored: 0 + 10000001 == 10000001 — post+reverse leaves zero drift"
            - "RegulatoryAsset.${ra1}.status == AMORTIZING throughout (single post of four never reaches FULLY_AMORTIZED)"
