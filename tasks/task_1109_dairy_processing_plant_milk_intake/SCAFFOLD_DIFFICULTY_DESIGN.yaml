# =============================================================================
# Task 1109 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# =============================================================================
scaffold_difficulty_design:

  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_divergence
        grounds:
          - calculations.producer_provisional_settlement_calc
          - entities.ProducerSettlement.fields.pricing_variant
          - state_machines.MarketingOrderPool.ANNOUNCED_to_FINALIZED
        distinguishing_aspect: |
          Same ProducerSettlement input set produces different net_payment_cents
          under PROVISIONAL vs FINAL variant: PROVISIONAL omits the PPD and
          uses TIER2_DISCOUNT_PCT=80; FINAL adds producer_price_differential_cents
          × pooled_cwt AND flips TIER2_DISCOUNT_PCT to 75. Domain: producer-settlement
          pricing on ProducerSettlement entity.
        test_recipe:
          setup:
            - "Producer P with base_hauling_rate_cents_per_cwt=200, quality_flag=STANDARD"
            - "Hauler H with license_expires_at in the future"
            - "GradeAPermit ACTIVE"
            - "MarketingOrderPool for 2026-05 with butterfat=300, protein=250, other_solids=40 cents/lb"
            - "One RELEASED_FOR_PROCESSING TankerReceipt of net_weight_lbs=200000 (2000 cwt) with ComponentAssay butterfat_pct=4.00, protein_pct=3.20, other_solids_pct=5.70"
            - "ProducerSettlement in DRAFT with pricing_variant=PROVISIONAL; then pool FINALIZED"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "P001", farm_name: "Farm One", base_hauling_rate_cents_per_cwt: 200 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "H001", company_name: "Haul Co", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-1", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/marketing-order-pools"
              payload: { pool_month: "2026-05", announced_class_i_price_cents: 2200, butterfat_price_cents_per_lb: 300, protein_price_cents_per_lb: 250, other_solids_price_cents_per_lb: 40 }
              as: PlantController
              captures: { pool_id: $.data.id }
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt_id: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lab_tech_1" }
              as: LabTechnician
              captures: { lt_ab: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lab_tech_1" }
              as: LabTechnician
              captures: { lt_scc: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests/${lt_ab}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests/${lt_scc}/complete"
              payload: {}
              as: LabTechnician
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_1: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/release"
              payload: { expected_producer_version: "${prod_v_1}" }
              as: QualityAssuranceManager
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/component-assays"
              payload: { butterfat_pct: 4.00, protein_pct: 3.20, other_solids_pct: 5.70 }
              as: LabTechnician
            - call: "POST /dairy/producers/${prod_id}/settlements"
              payload: { period_start_date: "2026-05-01T00:00:00Z", period_end_date: "2026-05-31T23:59:59Z" }
              as: PlantController
              captures: { stl_id: $.data.id, provisional_net: $.data.net_payment_cents, provisional_hauling: $.data.hauling_deduction_cents, provisional_gross: $.data.gross_pool_credit_cents }
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-23T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/marketing-order-pools/${pool_id}/announce"
              payload: {}
              as: PlantController
              captures: { pool_v_after_announce: $.data.version }
            - call: "POST /dairy/marketing-order-pools/${pool_id}/finalize"
              payload: { expected_pool_version: "${pool_v_after_announce}" }
              as: PlantController
          trigger:
            - call: "GET /dairy/producers/${prod_id}/settlements/${stl_id}"
              as: PlantController
              captures: { final_net: $.data.net_payment_cents, final_hauling: $.data.hauling_deduction_cents, final_variant: $.data.pricing_variant }
          assert:
            - "ProducerSettlement.${stl_id}.pricing_variant == FINAL"
            - "ProducerSettlement.${stl_id}.gross_pool_credit_cents != provisional_gross (FINAL variant adds PPD-based differential)"
            - "ProducerSettlement.${stl_id}.hauling_deduction_cents != provisional_hauling (FINAL variant flips TIER2_DISCOUNT_PCT from 80 to 75)"
            - "ProducerSettlement.${stl_id}.net_payment_cents != provisional_net"

      - name: pool_blend_price_tier_divergence
        grounds:
          - calculations.pool_blend_price_calc
          - entities.MarketingOrderPool.fields.producer_price_differential_cents
        distinguishing_aspect: |
          Same pool component prices produce different producer_price_differential_cents
          depending on utilization_pct tier (>=60, >=40, <40). Domain: FMMO pool
          pricing on MarketingOrderPool entity — distinct from producer-settlement
          domain (instance 1). Tier selection is a combinatorial branch on
          utilization, NOT a settlement-input change.
        test_recipe:
          setup:
            - "Two pools with identical component prices but different class_i_lbs/total_pooled_lbs ratios"
            - "Pool A: utilization 65% → CLASS_TIER_HIGH=2400"
            - "Pool B: utilization 30% → CLASS_TIER_LOW=1800"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-23T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/marketing-order-pools"
              payload: { pool_month: "2026-05", announced_class_i_price_cents: 2200, butterfat_price_cents_per_lb: 300, protein_price_cents_per_lb: 250, other_solids_price_cents_per_lb: 40 }
              as: PlantController
              captures: { pool_a: $.data.id }
            - call: "POST /dairy/marketing-order-pools"
              payload: { pool_month: "2026-06", announced_class_i_price_cents: 2200, butterfat_price_cents_per_lb: 300, protein_price_cents_per_lb: 250, other_solids_price_cents_per_lb: 40 }
              as: PlantController
              captures: { pool_b: $.data.id }
          trigger:
            - call: "POST /dairy/marketing-order-pools/${pool_a}/announce"
              payload: {}
              as: PlantController
              captures: { ppd_a: $.data.producer_price_differential_cents }
            - call: "POST /dairy/marketing-order-pools/${pool_b}/announce"
              payload: {}
              as: PlantController
              captures: { ppd_b: $.data.producer_price_differential_cents }
          assert:
            - "MarketingOrderPool.${pool_a}.status == ANNOUNCED"
            - "MarketingOrderPool.${pool_b}.status == ANNOUNCED"
            - "producer_price_differential_cents for pool A (high utilization tier) != pool B (low utilization tier) — tier selection on utilization is observable in announced PPD"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hauling_deduction_tiered_formula_mode_a
        grounds:
          - calculations.producer_provisional_settlement_calc
          - entities.Producer.fields.base_hauling_rate_cents_per_cwt
        distinguishing_aspect: |
          Mode (a) — formula with ≥3 inputs and non-linear interaction. hauling
          deduction branches on total_cwt <= TIER1_CWT vs > TIER1_CWT, multiplies
          overflow by base_rate × TIER2_DISCOUNT_PCT/100, and TIER2_DISCOUNT_PCT
          itself flips between PROVISIONAL (80) and FINAL (75) variants. Inputs:
          total_cwt, base_hauling_rate_cents_per_cwt, TIER1_CWT, TIER2_DISCOUNT_PCT,
          pricing_variant.
        test_recipe:
          setup:
            - "Producer with base_hauling_rate_cents_per_cwt=200"
            - "Exactly one RELEASED_FOR_PROCESSING receipt with net_weight_lbs=150000 (1500 cwt, crosses TIER1=1000 threshold)"
            - "Pool DRAFT (PROVISIONAL variant)"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "P100", farm_name: "Big Farm", base_hauling_rate_cents_per_cwt: 200 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "H100", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-100", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/marketing-order-pools"
              payload: { pool_month: "2026-05", announced_class_i_price_cents: 2200, butterfat_price_cents_per_lb: 300, protein_price_cents_per_lb: 250, other_solids_price_cents_per_lb: 40 }
              as: PlantController
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 180000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt_id: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_ab: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_scc: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests/${lt_ab}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests/${lt_scc}/complete"
              payload: {}
              as: LabTechnician
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_2: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/release"
              payload: { expected_producer_version: "${prod_v_2}" }
              as: QualityAssuranceManager
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/component-assays"
              payload: { butterfat_pct: 4.00, protein_pct: 3.20, other_solids_pct: 5.70 }
              as: LabTechnician
            - call: "POST /dairy/producers/${prod_id}/settlements"
              payload: { period_start_date: "2026-05-01T00:00:00Z", period_end_date: "2026-05-31T23:59:59Z" }
              as: PlantController
              captures: { stl_id: $.data.id }
          trigger:
            - call: "GET /dairy/producers/${prod_id}/settlements/${stl_id}"
              as: PlantController
              captures: { hauling_cents: $.data.hauling_deduction_cents }
          assert:
            - "total_cwt = 150000/100 = 1500; tier1 = 1000 cwt × 200 = 200000 cents; overflow = 500 × 200 × 80/100 = 80000 cents"
            - "ProducerSettlement.${stl_id}.hauling_deduction_cents == 280000"

      - name: component_pounds_per_component_then_sum_mode_b
        grounds:
          - calculations.component_pounds_calc
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold pins
          "round per component, then sum". If an implementation sums first
          and rounds once at the end, the cents will diverge. Verified by
          choosing inputs whose per-component roundings accumulate a different
          sum than one-shot rounding.
        test_recipe:
          setup:
            - "Released receipt with net_weight_lbs=33333 and assay percentages butterfat=3.33, protein=3.33, other_solids=3.33 — chosen so per-component rounding produces a different total than summing raw fractions and rounding once"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "P200", farm_name: "Farm Two", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "H200", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-200", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/marketing-order-pools"
              payload: { pool_month: "2026-05", announced_class_i_price_cents: 2200, butterfat_price_cents_per_lb: 300, protein_price_cents_per_lb: 250, other_solids_price_cents_per_lb: 40 }
              as: PlantController
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 63333, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt_id: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_ab: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_scc: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests/${lt_ab}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests/${lt_scc}/complete"
              payload: {}
              as: LabTechnician
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_3: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/release"
              payload: { expected_producer_version: "${prod_v_3}" }
              as: QualityAssuranceManager
          trigger:
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/component-assays"
              payload: { butterfat_pct: 3.33, protein_pct: 3.33, other_solids_pct: 3.33 }
              as: LabTechnician
              captures: { bf_lbs: $.data.butterfat_lbs, pr_lbs: $.data.protein_lbs, os_lbs: $.data.other_solids_lbs }
          assert:
            - "butterfat_lbs == round_half_up(33333*3.33/100, 2) == 1109.99"
            - "protein_lbs == 1109.99"
            - "other_solids_lbs == 1109.99"
            - "Each component rounded independently to 2 decimals — no summation-then-round collapse"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: grade_a_permit_review_loop
        grounds:
          - state_machines.GradeAPermit.ACTIVE_to_UNDER_REVIEW
          - state_machines.GradeAPermit.UNDER_REVIEW_to_REINSTATED
          - state_machines.GradeAPermit.UNDER_REVIEW_to_SUSPENDED
        distinguishing_aspect: |
          GradeAPermit has a branching fork-join: ACTIVE → UNDER_REVIEW →
          {REINSTATED, SUSPENDED, REVOKED}. The fork from UNDER_REVIEW has
          three divergent branches with disjoint side-effect sets — SUSPENDED
          cascades CANCELLED to SCHEDULED runs, REINSTATED does not, REVOKED
          diverts in-quarantine receipts. Entity: GradeAPermit.
        test_recipe:
          setup:
            - "ACTIVE permit; one SCHEDULED PasteurizerRun"
            - "Inspector records inspection with violations driving permit to UNDER_REVIEW"
            - "Inspector then suspends the permit"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-BR", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
              captures: { permit_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T08:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_id: $.data.id }
            - call: "POST /dairy/grade-a-permits/${permit_id}/record-inspection"
              payload: { inspection_score: 75, violations_found: 3 }
              as: StateInspector
              captures: { permit_after: $.data.status }
          trigger:
            - call: "POST /dairy/grade-a-permits/${permit_id}/suspend"
              payload: {}
              as: StateInspector
          assert:
            - "GradeAPermit.${permit_id}.status == SUSPENDED"
            - "PasteurizerRun.${run_id}.status == CANCELLED (cascade from SUSPENDED)"

      - name: tanker_receipt_release_divert_revert
        grounds:
          - state_machines.TankerReceipt.QUARANTINE_to_RELEASED_FOR_PROCESSING
          - state_machines.TankerReceipt.RELEASED_FOR_PROCESSING_to_DIVERTED
        distinguishing_aspect: |
          TankerReceipt has a revert loop QUARANTINE → RELEASED_FOR_PROCESSING →
          DIVERTED where DIVERTED walks back the pool contribution: total_pooled_lbs
          incremented on release, decremented on divert. Distinct entity from
          GradeAPermit (Rule-3 requires different entities). The MarketingOrderPool
          ledger sync must be exact — not just state flip.
        test_recipe:
          setup:
            - "Released receipt contributing net_weight_lbs=50000 to May 2026 pool"
            - "Pool total_pooled_lbs reflects the release"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "P300", farm_name: "F3", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "H300", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-300", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/marketing-order-pools"
              payload: { pool_month: "2026-05", announced_class_i_price_cents: 2200, butterfat_price_cents_per_lb: 300, protein_price_cents_per_lb: 250, other_solids_price_cents_per_lb: 40 }
              as: PlantController
              captures: { pool_id: $.data.id }
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 80000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt_id: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_ab: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt_scc: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests/${lt_ab}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests/${lt_scc}/complete"
              payload: {}
              as: LabTechnician
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_4: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/release"
              payload: { expected_producer_version: "${prod_v_4}" }
              as: QualityAssuranceManager
            - call: "GET /dairy/marketing-order-pools/${pool_id}"
              as: PlantController
              captures: { pool_after_release: $.data.total_pooled_lbs }
          trigger:
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/divert"
              payload: {}
              as: QualityAssuranceManager
            - call: "GET /dairy/marketing-order-pools/${pool_id}"
              as: PlantController
              captures: { pool_after_divert: $.data.total_pooled_lbs }
          assert:
            - "TankerReceipt.${rcpt_id}.disposition == DIVERTED"
            - "pool_after_release == 50000"
            - "pool_after_divert == 0 (release was fully walked back)"

  # -------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: reject_to_probation_to_premium_loss_cascade
        grounds:
          - state_machines.TankerReceipt.QUARANTINE_to_REJECTED
          - calculations.producer_quality_flag_calc
          - calculations.producer_provisional_settlement_calc
        distinguishing_aspect: |
          Cascade of depth 3 originating from POST /tanker-receipts/{id}/reject:
          (1) reject → Producer.rolling_rejection_count_30d increments; (2) that
          increment → Producer.quality_flag transitions to PROBATION; (3) that
          flag transition → over_order_premium_cents for any new settlement
          drops from OVER_ORDER_TIER_CENTS[STANDARD]=150 to [PROBATION]=0.
          Each link caused by previous, not by original reject action.
        test_recipe:
          setup:
            - "Producer with rolling_rejection_count_30d=1 already, quality_flag=STANDARD"
            - "New TankerReceipt in QUARANTINE for same producer, antibiotic POSITIVE"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "P400", farm_name: "F4", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "H400", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-400", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/marketing-order-pools"
              payload: { pool_month: "2026-05", announced_class_i_price_cents: 2200, butterfat_price_cents_per_lb: 300, protein_price_cents_per_lb: 250, other_solids_price_cents_per_lb: 40 }
              as: PlantController
            # First rejection
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt1: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt1}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 5, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt1: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt1}/lab-tests/${lt1}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt1}/reject"
              payload: {}
              as: QualityAssuranceManager
            # Second rejection — triggers PROBATION
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-06T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt2: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt2}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 5, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt2: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt2}/lab-tests/${lt2}/complete"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "POST /dairy/tanker-receipts/${rcpt2}/reject"
              payload: {}
              as: QualityAssuranceManager
            - call: "POST /dairy/producers/${prod_id}/settlements"
              payload: { period_start_date: "2026-05-01T00:00:00Z", period_end_date: "2026-05-31T23:59:59Z" }
              as: PlantController
              captures: { premium: $.data.over_order_premium_cents }
          assert:
            - "Producer.${prod_id}.rolling_rejection_count_30d == 2"
            - "Producer.${prod_id}.quality_flag == PROBATION"
            - "ProducerSettlement.over_order_premium_cents == 0 (PROBATION tier zeroes premium)"

      - name: permit_suspend_cancels_runs_scraps_batches
        grounds:
          - state_machines.GradeAPermit.UNDER_REVIEW_to_SUSPENDED
          - state_machines.PasteurizerRun.SCHEDULED_to_CANCELLED
          - state_machines.ProductBatch.transitions
        distinguishing_aspect: |
          Cascade of depth ≥2 originating from POST /grade-a-permits/{id}/suspend:
          (1) suspend → all SCHEDULED PasteurizerRuns transition to CANCELLED;
          (2) that cancellation → each run's SCHEDULED ProductBatches cascade to
          SCRAPPED. Distinct trigger from Rule-4 instance 1 (reject), different
          cascade shape.
        test_recipe:
          setup:
            - "ACTIVE permit; one SCHEDULED PasteurizerRun with two SCHEDULED batches"
            - "Permit moved to UNDER_REVIEW via inspection with 3 violations"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-C", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
              captures: { permit_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T08:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/batches"
              payload: { product_code: "WHOLE_MILK", quantity_gallons: 1000, shelf_life_days: 14 }
              as: PasteurizerOperator
              captures: { batch_a: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/batches"
              payload: { product_code: "HEAVY_CREAM", quantity_gallons: 200, shelf_life_days: 25 }
              as: PasteurizerOperator
              captures: { batch_b: $.data.id }
            - call: "POST /dairy/grade-a-permits/${permit_id}/record-inspection"
              payload: { inspection_score: 75, violations_found: 3 }
              as: StateInspector
          trigger:
            - call: "POST /dairy/grade-a-permits/${permit_id}/suspend"
              payload: {}
              as: StateInspector
          assert:
            - "GradeAPermit.${permit_id}.status == SUSPENDED"
            - "PasteurizerRun.${run_id}.status == CANCELLED"
            - "ProductBatch.${batch_a}.status == SCRAPPED"
            - "ProductBatch.${batch_b}.status == SCRAPPED"

  # -------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_release
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_ANTIBIOTIC_POSITIVE]
        distinguishing_aspect: |
          Pair: state vs business_safety. A release attempted against a receipt
          already in REJECTED state AND whose antibiotic_result would be POSITIVE
          must surface ERR_INVALID_STATE (priority 4 state), not
          ERR_ANTIBIOTIC_POSITIVE (priority 5 business_safety). State precedes
          business rules.
        test_recipe:
          setup:
            - "Receipt already REJECTED (state), with antibiotic POSITIVE lab result (business_safety)"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "P500", farm_name: "F5", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "H500", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-500", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt_id: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 5, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt1: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/lab-tests/${lt1}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/reject"
              payload: {}
              as: QualityAssuranceManager
          trigger:
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_5: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt_id}/release"
              payload: { expected_producer_version: "${prod_v_5}" }
              as: QualityAssuranceManager
          assert:
            - "HTTP 409 with error_id == ERR_INVALID_STATE (state check at priority 4 wins over business_safety at priority 5)"

      - name: business_safety_vs_business_referential_on_cip
        grounds:
          - validations[priority=15]
          - validations[priority=16]
          - errors[ERR_CIP_VALIDATION_FAILED]
          - errors[ERR_SOD_VIOLATION]
        distinguishing_aspect: |
          Pair: business_constraint vs business_referential. A CIP validate
          attempted with caustic_conductivity_ms < 80 AND by the same user who
          created the cycle must surface ERR_CIP_VALIDATION_FAILED (priority 15
          business_constraint), not ERR_SOD_VIOLATION (priority 16 business_referential).
          Distinct error-category pair from instance 1.
        test_recipe:
          setup:
            - "IN_PROGRESS CipCycle created by PasteurizerOperator user 'op1' with caustic_conductivity_ms=70 (failing)"
            - "Validator attempts with same user id 'op1'"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-501", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T08:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles"
              payload: { started_at: "2026-05-09T08:00:00Z", caustic_conductivity_ms: 70.0, rinse_ph: 7.0 }
              as: PasteurizerOperator
              captures: { cip_id: $.data.id }
          trigger:
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles/${cip_id}/validate"
              payload: {}
              as: QualityAssuranceManager
          assert:
            - "HTTP 422 with error_id == ERR_CIP_VALIDATION_FAILED (business_constraint at priority 15 wins over SOD at priority 16)"

  # -------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: scc_boundary_750000_exclusive
        grounds:
          - calculations.producer_quality_flag_calc
          - state_machines.TankerReceipt.QUARANTINE_to_RELEASED_FOR_PROCESSING
          - errors[ERR_SCC_EXCEEDED]
        distinguishing_aspect: |
          SCC threshold uses strict <. A receipt with scc_cells_per_ml == 750000
          exactly MUST be rejected (>= 750000 fails); 749999 MUST pass. Metric:
          somatic cell count. Endpoint: POST /dairy/tanker-receipts/{id}/release.
        test_recipe:
          setup:
            - "Two receipts: R1 with SCC = 750000, R2 with SCC = 749999"
            - "All other release preconditions satisfied for both"
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
