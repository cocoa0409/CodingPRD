              payload: { vehicle_id: "${veh_id}", avi_tag_id: "AVI-DV1", valid_from: "2026-01-01T00:00:00Z", valid_until: "2027-01-01T00:00:00Z", fee_paid_cents: 10000, expected_vehicle_version: "${veh_v}" }
              as: AirportAuthority
              captures: { permit_id: $.data.id }
            - call: "POST /v1/permits/${permit_id}/transitions"
              payload: { action: "ACTIVATE" }
              as: AirportAuthority
            - call: "POST /v1/staging-lots"
