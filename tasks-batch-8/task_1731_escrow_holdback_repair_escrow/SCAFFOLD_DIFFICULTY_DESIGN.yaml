              as: EscrowOfficer
              captures: { ins_b_status: $.data.status }
            - call: "POST /escrow/inspections"
              payload: { holdback_id: "${hb_b}", inspector_user_id: "insp_1", purpose: "DRAW_VERIFICATION", scheduled_start: "2026-08-20T10:30:00Z", scheduled_end: "2026-08-20T11:30:00Z" }
              as: EscrowOfficer
              captures: { conflict_err: $.data.error_id }
          assert:
