  - rule_id: boundary_precision_check
    instances:
      - name: dollar_weighted_pct_rounds_up_onto_the_inclusive_threshold
        grounds:
          - calculations.target_market_lending_percentage
          - entities.ComplianceMeasurement.fields.dollar_weighted_pct
          - entities.ComplianceMeasurement.fields.verdict
          - state_machines.ComplianceMeasurement.DRAFT_to_FINALIZED
          - validations[priority=76]
        distinguishing_aspect: |
          This boundary is a rounding-then-compare threshold: the exact ratio is 59.995,
          which round_half_up at 2 decimals lifts to exactly 60.00, and 60.00 is inclusive, so
          the verdict is PASS - an implementation that compares the unrounded ratio, truncates,
          or treats the threshold as exclusive returns FAIL. The other boundary instance is a
          zero-denominator pin where the answer is a defined constant rather than a comparison.
