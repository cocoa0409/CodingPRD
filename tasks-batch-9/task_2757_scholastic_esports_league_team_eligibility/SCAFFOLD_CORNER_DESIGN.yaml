      - name: a_match_must_fit_entirely_between_roster_lock_and_the_regular_season_end
        claim_type: temporal_validation
        grounds:
          - validations[priority=46]
          - errors[ERR_MATCH_OUTSIDE_SEASON_WINDOW]
          - entities.Match.fields.scheduled_end_at
          - entities.Title.fields.match_duration_minutes
        distinguishing_aspect: |
          The window test is asymmetric: the START must be at or after roster_lock_at, but
          the END (start + Title.match_duration_minutes) must be at or before
          regular_season_end_at. Both bounds are inclusive, so a 60-minute match starting
          exactly at roster_lock_at is legal and one starting one millisecond after
          2026-11-29T23:00:00.000Z is not — an implementation that compares only
          scheduled_start_at against regular_season_end_at accepts it.
        test_recipe:
          setup:
            - "One district, one school, one CERTIFIED coach, one title with match_duration_minutes 60 on POOL-A with server_pool_capacity 1, one season with the default roster_lock_at 2026-09-20T00:00:00.000Z and regular_season_end_at 2026-11-30T00:00:00.000Z, and two DRAFT teams"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "Metro District", state_code: "CA" }
              as: LeagueAdmin
              captures: { d_id: $.data.id }
            - call: "POST /schools"
