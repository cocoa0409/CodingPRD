            - "Calls 12 and 13 each set seal_number to the retention seal, set retention_until to 2026-11-25 (election_date 2026-11-03 plus 22 days), move custody_status to SEALED_RETENTION and increment open_seal_count, ending at 4."
            - "GET /elections/{id}/custody-events filtered to subject_id ${tab1} returns exactly 5 rows in sequence_index order: SEAL_APPLIED, SEAL_BROKEN, SEAL_APPLIED, RETURN, RETENTION_SEAL - the compensation is visible in the ledger rather than erased from it."
            - "TabulatorUnit.${tab2} never lost its seal: its custody events are SEAL_APPLIED, RETURN, RETENTION_SEAL and no SEAL_BROKEN row exists for it."

      - name: ci_committed_print_cents_released_on_job_rejection
        grounds:
          - entities.Election.fields.committed_print_cents
          - state_machines.PrintJob.DELIVERED_to_REJECTED
          - state_machines.PrintJob.PROOF_PENDING_to_REJECTED
          - calculations.print_job_invoice_total
        distinguishing_aspect: |
          election.committed_print_cents is a ledger written by three different events and it must
          return to exactly its opening value when the commitment is withdrawn: +150625 at
          approve-proof (ESTIMATE), -1268 at delivery (the FINAL recomputation, not a fresh add), and
          -149357 when a contest withdrawal rejects the job - summing to 0, not to
          150625 - 149357 = 1268 of residue. The recipe also holds a second job that was never
          proof-approved, which must contribute 0 to the ledger both before and after its own
          rejection, so a blind "decrement by the job's total" implementation (or one that decrements
          the ESTIMATE after the FINAL was written) leaves detectable drift.
        test_recipe:
          setup:
            - "An election in STYLES_LOCKED with locked style S-100, precinct P-001, and print job JOB-1 for 12500 ballots at 8450 cents/thousand: proof-approved (ESTIMATE 150625) and then delivered as a single lot L-001 of 12500 (FINAL 149357), with L-001 received and 3000 ballots issued to P-001."
            - "So Election.committed_print_cents is 149357 and PrintVendor.active_job_count is 1 on entry."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: ElectionsDirector
            - call: "POST /elections"
              payload: { name: "November 2026 General", jurisdiction: "Kestrel County", election_date: "2026-11-03", rotation_policy: "NONE", candidate_order_method: "ALPHABETICAL_BY_BALLOT_NAME", la_notice_hours: 48 }
              as: ElectionsDirector
              captures: { el: $.data.id }
            - call: "POST /elections/${el}/contests"
              payload: { title: "County Sheriff", contest_type: "CANDIDATE", district_code: "D-12", seats_open: 1, rotation_required: false }
              as: BallotCoordinator
              captures: { ct: $.data.id }
            - call: "POST /contests/${ct}/candidates"
              payload: { full_name: "Ana Alvarez", ballot_name: "Alvarez", filing_received_at: "2026-06-01T09:00:00Z", party_code: "IND" }
              as: BallotCoordinator
              captures: { c_alv: $.data.id }
            - call: "POST /contests/${ct}/certify"
              payload: {}
              as: ElectionsDirector
            - call: "POST /elections/${el}/ballot-styles"
              payload: { style_code: "S-100", district_codes: ["D-12"], language_set: ["EN"], required_formats: ["PAPER_STANDARD"] }
              as: BallotCoordinator
              captures: { st: $.data.id }
            - call: "POST /elections/${el}/precincts"
              payload: { precinct_code: "P-001", district_codes: ["D-12"], registered_voter_count: 100, polling_place: "Kestrel Community Hall" }
              as: BallotCoordinator
              captures: { pr: $.data.id }
            - call: "POST /elections/${el}/certify-ballot-order"
              payload: {}
              as: ElectionsDirector
            - call: "POST /ballot-styles/${st}/language-certifications"
              payload: { translated_languages: ["EN"], certified_formats: ["PAPER_STANDARD"] }
              as: LanguageAccessCoordinator
            - call: "POST /ballot-styles/${st}/request-proof"
              payload: {}
              as: BallotCoordinator
              as_user_id: "user-coord-1"
            - call: "POST /ballot-styles/${st}/proof-decision"
              payload: { decision: "APPROVE", decision_note: "Artwork accepted" }
              as: ElectionsDirector
              as_user_id: "user-director-1"
            - call: "POST /precincts/${pr}/assign-style"
              payload: { style_id: "${st}" }
              as: BallotCoordinator
            - call: "POST /elections/${el}/lock-styles"
              payload: {}
              as: ElectionsDirector
            - call: "GET /ballot-styles/${st}"
              payload: {}
              as: BallotCoordinator
              captures: { st_v: $.data.version }
            - call: "POST /print-vendors"
              payload: { name: "Ridgeline Secure Print", press_line_count: 2, certified_secure: true, status: "ACTIVE" }
              as: ElectionsDirector
              captures: { vend: $.data.id }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-10T08:00:00Z", press_window_end: "2026-08-12T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job: $.data.id }
            - call: "POST /print-jobs/${job}/approve-proof"
              payload: {}
              as: ElectionsDirector
            - call: "POST /print-jobs/${job}/inspect"
              payload: { sample_size: 500, defect_count: 6 }
              as: WarehouseCustodian
            - call: "POST /print-jobs/${job}/deliver"
              payload: { lots: [{ lot_code: "L-001", quantity_shipped: 12500, seal_number: "SEAL-1001" }] }
              as: PrintVendorRep
              as_user_id: "${vend}"
            - call: "GET /ballot-lots"
              payload: { print_job_id: "${job}" }
              as: WarehouseCustodian
              captures: { lot1: "$.data[0].id" }
            - call: "POST /ballot-lots/${lot1}/receive"
              payload: { seal_number: "SEAL-1001", quantity_received: 12500 }
              as: WarehouseCustodian
            - call: "POST /ballot-lots/${lot1}/issue"
              payload: { precinct_id: "${pr}", issue_quantity: 3000 }
              as: WarehouseCustodian
          trigger:
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-14T08:00:00Z", press_window_end: "2026-08-16T08:00:00Z", expected_ballot_style_version: "${st_v}" }
              as: BallotCoordinator
              captures: { job2: $.data.id }
            - call: "GET /elections/${el}"
              payload: {}
              as: ElectionsDirector
            - call: "POST /contests/${ct}/withdraw"
              payload: { withdrawn_reason: "Court order removed the contest from the ballot" }
              as: ElectionsDirector
            - call: "GET /ballot-styles/${st}"
              payload: {}
              as: BallotCoordinator
              captures: { st_v2: $.data.version }
            - call: "POST /print-jobs"
              payload: { vendor_id: "${vend}", style_id: "${st}", quantity_ordered: 12500, unit_cost_cents_per_thousand: 8450, press_window_start: "2026-08-20T08:00:00Z", press_window_end: "2026-08-22T08:00:00Z", expected_ballot_style_version: "${st_v2}" }
              as: BallotCoordinator
          assert:
            - "Call 1 creates JOB-2 in PROOF_PENDING with invoice_basis null and invoice_total_cents 0, and call 2 confirms Election.${el}.committed_print_cents is still 149357 - an unapproved job commits nothing."
            - "The three ledger writes up to this point are +150625 (approve-proof, ESTIMATE 105625 subtotal + 45000 freight), -1268 (delivery rewrote the invoice as FINAL 149357: subtotal 105625, defect_credit 1268, freight 45000) and nothing for JOB-2, so the running total is exactly 149357."
            - "Call 3 (contest withdrawal) drives the cascade and zeroes the ledger: PrintJob.${job}.status == REJECTED with invoice_subtotal_cents 0, defect_credit_cents 0, freight_cents 0, invoice_total_cents 0; PrintJob.${job2}.status == REJECTED with the same zeros; Election.${el}.committed_print_cents == 0 exactly - the release was 149357 (the FINAL total actually committed), not the 150625 ESTIMATE and not 150625 - 1268 twice over."
            - "PrintVendor.${vend}.active_job_count == 0 after call 3 (both jobs left the counted status set), while PrintJob.${job}.delivered_quantity is STILL 12500 - the pallets physically arrived, so the ballot ledger and the money ledger are reversed independently."
            - "BallotLot.${lot1} is VOIDED with issued_quantity 0, unused_quantity 12500 and precinct_id null; Election.${el}.total_ballots_issued == 0 and total_ballots_received == 0; Precinct.${pr}.ballots_received == 0."
            - "BallotStyle.${st}.status == PROOF_REJECTED with translated_languages and certified_formats cleared, and Contest.${ct}.status == WITHDRAWN with ballot_order_index null."
            - "Call 5 returns ERR_STYLE_STATE_INVALID with HTTP 409 even though its expected_ballot_style_version ${st_v2} is current: a PROOF_REJECTED style cannot take a new print order, so the ledger cannot be re-credited without re-certifying and re-proofing. Election.${el}.committed_print_cents is still 0."
            - "Summing the signed ledger writes over the whole recipe gives +150625 - 1268 - 149357 == 0, i.e. the compensation is exact with no rounding residue."
