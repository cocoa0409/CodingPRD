      - name: the_severity_assessment_read_is_side_effect_free_and_pathway_basis_never_persists
        claim_type: Computed read
        grounds:
          - endpoints[GET /integrity/cases/{id}/severity-assessment]
          - entities.Case.fields.version
          - entities.Case.fields.recommended_ladder_rank
        distinguishing_aspect: |
          GET /integrity/cases/{id}/severity-assessment recomputes the whole ladder chain on every call
          but writes nothing: three consecutive reads return byte-identical bodies, Case.version is the
          same integer before and after all of them, and no row is created anywhere. The optional
          pathway_basis is a per-call projection, so a read with pathway_basis INFORMAL (band [1,3]) does
          not change what the next default read reports, and the persisted
          Case.recommended_ladder_rank keeps the formal value throughout.
