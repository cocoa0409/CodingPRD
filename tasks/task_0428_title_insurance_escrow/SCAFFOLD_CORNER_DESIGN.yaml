      - name: curative_action_create_and_list
        claim_type: fk_reverse_reachability
        grounds: [entities.CurativeAction.fields.order_id, endpoints]
        distinguishing_aspect: "A CurativeAction(subject=EXCEPTION) created on an order is discoverable via GET /title/orders/{id}/curative-actions."
        test_recipe:
          setup: ["A commitment with one CURATIVE_PENDING exception."]
          setup_api_calls:
            - call: "POST /title/agencies"
              payload: { name: "Acme Title", remit_split_pct: 0.82 }
              as: Underwriter
              captures: { ag_id: $.data.id }
            - call: "POST /title/orders"
              payload: { agency_id: "${ag_id}", parcel_id: "APN-C33", county: "King", transaction_type: "PURCHASE", sales_price_cents: 25000000, loan_amount_cents: 0 }
