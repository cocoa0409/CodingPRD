              captures: { e_big: $.data.id, sv_big: $.data.submission_version }
            - *k_census_0401
          trigger:
            - call: "PUT /hour-entries/${e_big}/allocations"
              payload: { allocations: [{ job_category_id: "${jc_rn}", percent: 50.00 }, { job_category_id: "${jc_admin}", percent: 50.00 }], expected_submission_version: "${sv_big}" }
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - call: "POST /hour-entries/${e_big}/void"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "${w_coord}"
            - *k_reconcile_c1
            - *k_verify_e1
            - *k_validate
            - *k_submit
            - *k_accept
            - *k_measure
            - *k_publish
          assert:
            - "after the two creates, Worker.${w_rn}.reported_hours_total == 20.00 and QuarterlySubmission.${sub}.total_direct_care_hours == 20.00"
            - "after the allocation replacement, HourEntry.${e_big}.direct_care_hours == 6.00 and excluded_hours == 6.00, QuarterlySubmission.${sub}.total_direct_care_hours == 14.00, yet Worker.${w_rn}.reported_hours_total is still 20.00 because it sums raw_hours"
            - "after the void, Worker.${w_rn}.reported_hours_total == 8.00, QuarterlySubmission.${sub}.total_raw_hours == 8.00 and total_direct_care_hours == 8.00"
            - "Facility.${fac}.latest_staffing_rating == null immediately after the measure is computed and becomes 1 only after publish, matching StaffingMeasure.${meas}.staffing_rating"

      - name: hour_entry_listing_filters_and_pages_consistently_across_a_void
        claim_type: pagination_with_filtering
        grounds:
          - endpoints[GET /hour-entries]
          - response_envelope.pagination_fields
        distinguishing_aspect: "entry_status is a filter rather than a soft-delete flag, so a voided row leaves the ACTIVE page count and moves to the VOID page while total_count tracks the filter and not the table."
        test_recipe:
          setup:
