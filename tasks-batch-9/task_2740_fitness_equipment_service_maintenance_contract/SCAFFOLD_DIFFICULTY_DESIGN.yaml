  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: dispatch_contract_not_active_outranks_safety_certification_required
        grounds:
          - validations[priority=22]
          - validations[priority=33]
          - errors.ERR_CONTRACT_NOT_ACTIVE
          - errors.ERR_SAFETY_CERTIFICATION_REQUIRED
          - state_machines.Equipment.DOWN_to_TAGGED_OUT
        distinguishing_aspect: |
          Pairs a `state` rule (priority 22) against a `business_safety` rule (priority 33) on the
          dispatch endpoint. Safety rules outrank every commercial rule in this scaffold EXCEPT the
          contract-status gate that precedes them, so the response must be ERR_CONTRACT_NOT_ACTIVE
          (409) even though a tagged-out unit is being handed to a non-inspector; the setup proves
          the lower-priority rule really does fire on its own.
        test_recipe:
          setup:
            - "Clock 2026-08-18T08:00Z; club NORTH, one treadmill, GOLD/FULL contract ACTIVE."
            - "T1 is an ordinary NORTH treadmill technician (is_safety_inspector false); T2 is a NORTH inspector."
            - "A MAJOR service call is OPEN on the unit and T2 has tagged the unit out, so lifecycle_status is TAGGED_OUT."
            - "A first dispatch attempt is made while the contract is still ACTIVE to record the lower-priority error, then the contract is suspended."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-PC-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Ivo Marsh", region_code: "NORTH", skill_categories: ["TREADMILL"], is_safety_inspector: true }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_SLIP" }, as: ServiceCoordinator, captures: { call_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment/${e1_id}/tag-out", payload: { reason: "Handrail sensor intermittent" }, as: SafetyInspector, as_user_id: "${t2_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-18T09:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { err_while_active: "$.data.error_id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/suspend", payload: { reason: "Club payment dispute" }, as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-18T09:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
          assert:
            - "${err_while_active} == 'ERR_SAFETY_CERTIFICATION_REQUIRED' (422 - the priority-33 rule fires when nothing above it is violated)"
            - "trigger response HTTP status == 409"
            - "trigger response error_id == 'ERR_CONTRACT_NOT_ACTIVE' (priority 22 wins, NOT ERR_SAFETY_CERTIFICATION_REQUIRED)"
            - "ServiceCall.${call_id}.status == OPEN and assigned_technician_id == null"
            - "no TechnicianAssignment row exists for service_call_id == ${call_id}"
            - "Technician.${t1_id}.committed_minutes == 0"
            - "Equipment.${e1_id}.lifecycle_status == TAGGED_OUT (unchanged)"

      - name: parts_hold_model_mismatch_outranks_parts_allowance_exhausted
        grounds:
          - validations[priority=38]
          - validations[priority=61]
          - errors.ERR_PART_MODEL_MISMATCH
          - errors.ERR_PARTS_ALLOWANCE_EXHAUSTED
          - calculations.part_order_cost_allocation
        distinguishing_aspect: |
          A different error-category pair from the other instance: `business_referential`
          (priority 38, 422) against `fiscal` (priority 61, 409). The request violates both -
          the part belongs to another model AND the allowance is exhausted - and the referential
          error must win, so a 422 is returned rather than the fiscal 409.
        test_recipe:
          setup:
            - "Clock 2026-08-18T08:00Z; club NORTH, GOLD/FULL contract with initial_parts_allowance_cents 0, so parts_allowance_remaining_cents is 0."
            - "Two models: TM-900 (the treadmill under service) and BK-200 (a bike)."
            - "Two parts, both with 5 units of NEW stock: BELT-900 on TM-900 and CRANK-200 on BK-200."
            - "One MINOR call on the treadmill, dispatched to T1 and ON_SITE, so parts-hold is state-legal."
            - "A first parts-hold on the CORRECT part records the fiscal error, proving it fires on its own."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { tm_model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "BK-200", category: "BIKE", model_year: 2022, pm_interval_hours: 400, expected_service_life_hours: 15000, base_annual_service_cents: 60000 }, as: ContractAdministrator, captures: { bk_model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${tm_model_id}", serial_number: "SN-PM-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 0, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${tm_model_id}", part_number: "BELT-900", category: "WEAR", unit_price_cents: 12000, initial_on_hand_qty: 5, initial_refurb_qty: 0 }, as: PartsPlanner, captures: { right_part_id: "$.data.id" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${bk_model_id}", part_number: "CRANK-200", category: "MECHANICAL", unit_price_cents: 8000, initial_on_hand_qty: 5, initial_refurb_qty: 0 }, as: PartsPlanner, captures: { wrong_part_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MINOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-18T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/parts-hold", payload: { part_id: "${right_part_id}", qty: 1, source: "NEW" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { err_right_part: "$.data.error_id" } }
          trigger:
            - { call: "POST /fleetcare/service-calls/${call_id}/parts-hold", payload: { part_id: "${wrong_part_id}", qty: 1, source: "NEW" }, as: FieldTechnician, as_user_id: "${t1_id}" }
          assert:
            - "${err_right_part} == 'ERR_PARTS_ALLOWANCE_EXHAUSTED' (409 - the priority-61 rule fires when nothing above it is violated)"
            - "trigger response HTTP status == 422"
            - "trigger response error_id == 'ERR_PART_MODEL_MISMATCH' (priority 38 wins over the fiscal rule)"
            - "no PartOrder row exists for service_call_id == ${call_id}"
            - "PartCatalogEntry.${wrong_part_id}.on_hand_qty == 5 and allocated_qty == 0"
            - "PartCatalogEntry.${right_part_id}.on_hand_qty == 5 and allocated_qty == 0"
            - "ServiceContract.${c_id}.parts_allowance_remaining_cents == 0"
            - "ServiceCall.${call_id}.status == ON_SITE and parts_hold_count == 0"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: sla_met_is_true_at_exactly_the_target_minute
        grounds:
          - calculations.sla_response_evaluation
          - entities.ServiceCall.fields.response_minutes
          - entities.ServiceCall.fields.sla_met
          - endpoints[POST /fleetcare/service-calls/{callId}/arrive]
        distinguishing_aspect: |
          Metric: response_minutes against sla_target_minutes on the ARRIVE endpoint. The GOLD
          tier x MAJOR factor gives a 120-minute target and the comparison is <=, so arriving at
          minute 120 is MET and minute 121 is a breach. Elapsed seconds are floored, so the pair
          isolates the inclusive boundary rather than a rounding rule.
        test_recipe:
          setup:
            - "Clock 2026-08-18T08:00Z; club NORTH with two treadmills, GOLD/FULL contract ACTIVE (sla_response_minutes pinned at 120)."
            - "Two technicians T1 and T2 so both calls can hold overlapping 120-minute dispatch intervals."
            - "Two MAJOR calls reported at exactly 08:00:00Z, one per unit, each dispatched for 08:00."
            - "The first technician arrives at 10:00:00Z, exactly 120 minutes after the report."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-SLA-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-SLA-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Nils Okonjo", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MAJOR", symptom_code: "BELT_SLIP" }, as: ServiceCoordinator, captures: { call_1_id: "$.data.id", target_1: "$.data.sla_target_minutes" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", severity: "MAJOR", symptom_code: "ROLLER_WEAR" }, as: ServiceCoordinator, captures: { call_2_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/dispatch", payload: { start_at: "2026-08-18T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_2_id}/dispatch", payload: { start_at: "2026-08-18T08:00:00Z", technician_id: "${t2_id}" }, as: ServiceCoordinator }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T10:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/service-calls/${call_1_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}", captures: { minutes_at_target: "$.data.response_minutes", met_at_target: "$.data.sla_met" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-18T10:01:00Z" }, as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/service-calls/${call_2_id}/arrive", as: FieldTechnician, as_user_id: "${t2_id}" }
          assert:
            - "${target_1} == 120 (GOLD 120 x MAJOR factor 1.0)"
            - "${minutes_at_target} == 120 and ${met_at_target} == true (AT the target is met)"
            - "trigger response response_minutes == 121"
            - "trigger response sla_met == false"
            - "ServiceCall.${call_1_id}.sla_met == true and ServiceCall.${call_2_id}.sla_met == false"
            - "ServiceCall.${call_1_id}.status == ON_SITE and ServiceCall.${call_2_id}.status == ON_SITE"

      - name: pm_compliance_empty_history_snapshots_exactly_100_pct_on_a_quote
        grounds:
          - calculations.pm_compliance_pct
          - calculations.renewal_quote_pricing
          - entities.RenewalQuote.fields.pm_compliance_pct_snapshot
          - endpoints[POST /fleetcare/contracts/{contractId}/renewal-quotes]
        distinguishing_aspect: |
          A different metric (pm_compliance_pct) at a different endpoint (renewal-quotes): the
          zero-denominator boundary must snapshot exactly 100.00 rather than 0.00 or null, and a
          CANCELLED visit must leave the denominator at zero. The quoted price therefore lands on
          the top discount step - 134520 cents - which is only reachable if the empty case is 100.00.
        test_recipe:
          setup:
            - "Clock 2026-08-20T12:00Z; club NORTH with exactly one treadmill installed 2024-03-01 (age 2 -> multiplier 1.00), 4000 usage hours, no service calls at all."
            - "GOLD/FULL contract ACTIVE with annual_base_cents 140000 (floor 126000, cap 189000) and model base_annual_service_cents 120000."
            - "One preventive visit is scheduled and then CANCELLED, so pm_visits_completed_count and pm_visits_missed_count are both 0."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-PMC-1", install_date: "2024-03-01", initial_usage_hours: 4000 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 140000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-22T08:00:00Z", window_end: "2026-08-22T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/cancel", payload: { reason: "Club closed the cardio floor that morning" }, as: ServiceCoordinator }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { compliance_before: "$.data.pm_compliance_pct", completed_before: "$.data.pm_visits_completed_count", missed_before: "$.data.pm_visits_missed_count", c_ver: "$.data.version" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-20T12:00:00Z" }, as: ContractAdministrator }
          trigger:
            - { call: "POST /fleetcare/contracts/${c_id}/renewal-quotes", payload: { expected_contract_version: "${c_ver}" }, as: ContractAdministrator, captures: { q_id: "$.data.id" } }
          assert:
            - "${completed_before} == 0 and ${missed_before} == 0 (the cancelled visit entered neither counter)"
            - "${compliance_before} == 100.00 (zero denominator returns 100.00, not 0.00 or null)"
            - "RenewalQuote.${q_id}.pm_compliance_pct_snapshot == 100.00"
            - "RenewalQuote.${q_id}.quoted_base_cents == 120000"
            - "RenewalQuote.${q_id}.parts_surcharge_cents == 21600"
            - "RenewalQuote.${q_id}.sla_breach_count == 0 and history_load_pct == 0.00 and history_surcharge_cents == 0"
            - "RenewalQuote.${q_id}.subtotal_cents == 141600"
            - "RenewalQuote.${q_id}.compliance_discount_pct == 0.05"
            - "RenewalQuote.${q_id}.compliance_discount_cents == 7080"
            - "RenewalQuote.${q_id}.quoted_annual_cents == 134520"
            - "RenewalQuote.${q_id}.floor_applied == false and cap_applied == false (126000 <= 134520 <= 189000)"
            - "RenewalQuote.${q_id}.fleet_age_index == 1.00"
            - "PreventiveVisit.${v1_id}.visit_status == CANCELLED"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: visit_start_depends_on_equipment_lifecycle_not_on_the_visit_row
        grounds:
          - state_machines.PreventiveVisit.SCHEDULED_to_IN_PROGRESS
          - state_machines.Equipment.IN_SERVICE_to_TAGGED_OUT
          - validations[priority=31]
          - errors.ERR_SAFETY_LOCKOUT_OPEN
        distinguishing_aspect: |
          Entity pair PreventiveVisit -> Equipment. Two visits sit in identical SCHEDULED state on
          the same contract and the same technician; only the one whose EQUIPMENT was tagged out is
          refused. Nothing on the visit row distinguishes them, so the gate can only come from the
          other entity's lifecycle_status.
        test_recipe:
          setup:
            - "Clock 2026-08-19T08:00Z; club NORTH with two treadmills, GOLD/FULL contract ACTIVE."
            - "T1 (ordinary technician) holds both visits: V1 on E1 09:00-10:30 and V2 on E2 11:15-12:45 (a 45-minute gap, exactly legal)."
            - "T2 is a NORTH inspector who tags E1 out at 08:30 for a frayed handrail; E2 stays IN_SERVICE."
            - "V2 is started successfully AFTER the tag-out to prove the visit rows are otherwise identical."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH", max_concurrent_visits: 2 }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-XE-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-XE-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Ivo Marsh", region_code: "NORTH", skill_categories: ["TREADMILL"], is_safety_inspector: true }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-19T09:00:00Z", window_end: "2026-08-19T10:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-19T11:15:00Z", window_end: "2026-08-19T12:45:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v2_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T08:30:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/equipment/${e1_id}/tag-out", payload: { reason: "Frayed handrail webbing" }, as: SafetyInspector, as_user_id: "${t2_id}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T11:15:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/preventive-visits/${v2_id}/start", as: FieldTechnician, as_user_id: "${t1_id}", captures: { v2_status: "$.data.visit_status" } }
          trigger:
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/start", as: FieldTechnician, as_user_id: "${t1_id}" }
          assert:
            - "${v2_status} == 'IN_PROGRESS' (identical visit on an IN_SERVICE unit starts fine)"
            - "trigger response HTTP status == 409"
            - "trigger response error_id == 'ERR_SAFETY_LOCKOUT_OPEN'"
            - "PreventiveVisit.${v1_id}.visit_status == SCHEDULED and started_at == null"
            - "Equipment.${e1_id}.lifecycle_status == TAGGED_OUT with safety_lockout_reason == 'INSPECTOR_TAG_OUT'"
            - "Equipment.${e2_id}.lifecycle_status == IN_SERVICE"
            - "Club.${club_id}.open_safety_lockout_count == 1"
            - "the TechnicianAssignment for preventive_visit_id == ${v1_id} is still RESERVED and Technician.${t1_id}.committed_minutes == 180"

      - name: new_part_sourcing_depends_on_part_catalog_lifecycle
        grounds:
          - state_machines.PartCatalogEntry.ACTIVE_to_OBSOLETE
          - validations[priority=56]
          - errors.ERR_PART_SOURCE_UNAVAILABLE
          - calculations.part_order_cost_allocation
        distinguishing_aspect: |
          A different entity pair - PartOrder -> PartCatalogEntry - and the dependency is
          source-selective rather than blanket: with the catalogue line OBSOLETE, a REFURBISHED
          hold on one call still succeeds at the 0.60 factor while a NEW hold on an identical
          sibling call is refused, even though the NEW bucket still holds five units.
        test_recipe:
          setup:
            - "Clock 2026-08-19T08:00Z; club NORTH with two treadmills of one model, GOLD/FULL contract ACTIVE with a 500000-cent allowance."
            - "PartCatalogEntry BELT-900 (WEAR, unit_price_cents 32000, is_critical_spare FALSE) with on_hand_qty 5 and refurb_on_hand_qty 0."
            - "Two MINOR calls, one per unit, dispatched to T1 and T2 respectively and both ON_SITE."
            - "The part is declared end of support with an empty refurbished bucket, so it goes straight to OBSOLETE; two refurbished units are then received."
            - "A REFURBISHED hold is placed on the first call to prove OBSOLETE does not block every source."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-PS-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-PS-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Nils Okonjo", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "BELT-900", category: "WEAR", unit_price_cents: 32000, is_critical_spare: false, initial_on_hand_qty: 5, initial_refurb_qty: 0 }, as: PartsPlanner, captures: { part_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MINOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_a_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_a_id}/dispatch", payload: { start_at: "2026-08-19T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_a_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", severity: "MINOR", symptom_code: "BELT_FRAY" }, as: ServiceCoordinator, captures: { call_b_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_b_id}/dispatch", payload: { start_at: "2026-08-19T08:00:00Z", technician_id: "${t2_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_b_id}/arrive", as: FieldTechnician, as_user_id: "${t2_id}" }
            - { call: "POST /fleetcare/parts/${part_id}/declare-end-of-support", as: PartsPlanner, captures: { part_lifecycle: "$.data.lifecycle_status" } }
            - { call: "POST /fleetcare/parts/${part_id}/inventory-adjustments", payload: { new_qty_delta: 0, refurb_qty_delta: 2 }, as: PartsPlanner }
            - { call: "POST /fleetcare/service-calls/${call_a_id}/parts-hold", payload: { part_id: "${part_id}", qty: 1, source: "REFURBISHED" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { refurb_order_id: "$.data.id", refurb_list: "$.data.list_total_cents", refurb_draw: "$.data.allowance_draw_cents" } }
          trigger:
            - { call: "POST /fleetcare/service-calls/${call_b_id}/parts-hold", payload: { part_id: "${part_id}", qty: 1, source: "NEW" }, as: FieldTechnician, as_user_id: "${t2_id}" }
          assert:
            - "${part_lifecycle} == 'OBSOLETE' (an empty refurbished bucket skips END_OF_SUPPORT_ANNOUNCED)"
            - "${refurb_list} == 19200 and ${refurb_draw} == 19200 (32000 x 0.60, fully covered)"
            - "PartOrder.${refurb_order_id}.status == ALLOCATED and club_billable_cents == 0"
            - "trigger response HTTP status == 422"
            - "trigger response error_id == 'ERR_PART_SOURCE_UNAVAILABLE'"
            - "no PartOrder row exists for service_call_id == ${call_b_id}"
            - "PartCatalogEntry.${part_id}.on_hand_qty == 5 (the NEW bucket is untouched and was never the constraint)"
            - "PartCatalogEntry.${part_id}.refurb_on_hand_qty == 1 and allocated_qty == 1"
            - "ServiceContract.${c_id}.parts_allowance_remaining_cents == 480800"
            - "ServiceCall.${call_a_id}.status == PARTS_HOLD and ServiceCall.${call_b_id}.status == ON_SITE"
            - "Equipment.${e1_id}.support_status == SUPPORTED and Equipment.${e2_id}.support_status == SUPPORTED (a non-critical spare never cascades)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: club_visit_capacity_treats_touching_windows_as_concurrent
        grounds:
          - calculations.club_visit_capacity
          - entities.Club.fields.max_concurrent_visits
          - validations[priority=43]
          - errors.ERR_CLUB_VISIT_CAPACITY
        distinguishing_aspect: |
          Resource: the CLUB's on-floor capacity, measured over CLOSED intervals - two visit
          windows that merely touch at 09:30 are concurrent and the second is refused, while a
          window starting one minute later is accepted. Interval semantics are the opposite of
          the technician rule, and the second visit uses a different technician so the calendar
          rule cannot be what fires.
        test_recipe:
          setup:
            - "Clock 2026-08-19T07:00Z; club NORTH with max_concurrent_visits 1 and two treadmills."
            - "GOLD/FULL contract ACTIVE; technicians T1 and T2, both NORTH treadmill-skilled."
            - "V1 on E1 runs 08:00-09:30 on 2026-08-19 with T1, so T1.committed_minutes is 90."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T07:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH", max_concurrent_visits: 1 }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CC-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CC-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Nils Okonjo", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t2_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-19T08:00:00Z", window_end: "2026-08-19T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-19T09:30:00Z", window_end: "2026-08-19T11:00:00Z", technician_id: "${t2_id}" }, as: ServiceCoordinator, captures: { touching_error: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-19T09:31:00Z", window_end: "2026-08-19T11:00:00Z", technician_id: "${t2_id}" }, as: ServiceCoordinator, captures: { v3_id: "$.data.id", v3_planned: "$.data.planned_minutes" } }
          assert:
            - "${touching_error} == 'ERR_CLUB_VISIT_CAPACITY' returned with HTTP 409 (windows sharing the 09:30 endpoint overlap)"
            - "the 09:31 window is created: ${v3_id} is a PreventiveVisit in visit_status SCHEDULED"
            - "${v3_planned} == 89"
            - "exactly two PreventiveVisit rows exist on this club (the touching attempt created nothing)"
            - "Technician.${t2_id}.committed_minutes == 89 (only the accepted window reserved minutes)"
            - "Technician.${t1_id}.committed_minutes == 90"
            - "PreventiveVisit.${v1_id}.visit_status == SCHEDULED (untouched)"

      - name: technician_calendar_needs_a_full_45_minute_travel_gap
        grounds:
          - calculations.technician_calendar_conflict
          - entities.TechnicianAssignment.fields.start_at
          - validations[priority=44]
          - errors.ERR_TECHNICIAN_WINDOW_CONFLICT
        distinguishing_aspect: |
          A different resource (the TECHNICIAN's calendar) with HALF-OPEN intervals plus a
          symmetric 45-minute travel buffer: a 44-minute gap after a 09:30 finish collides while
          exactly 45 minutes does not. The club's capacity is raised to 3 so the aggregate rule
          cannot be responsible for either outcome.
        test_recipe:
          setup:
            - "Clock 2026-08-19T07:00Z; club NORTH with max_concurrent_visits 3 and two treadmills."
            - "GOLD/FULL contract ACTIVE; a single technician T1 with the default 480-minute ceiling."
            - "V1 on E1 runs 08:00-09:30 with T1, giving one CONFIRMED-eligible RESERVED interval ending at 09:30 and committed_minutes 90."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T07:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH", max_concurrent_visits: 3 }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-TB-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-TB-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-19T08:00:00Z", window_end: "2026-08-19T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
          trigger:
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-19T10:14:00Z", window_end: "2026-08-19T11:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { gap_44_error: "$.data.error_id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-19T10:15:00Z", window_end: "2026-08-19T11:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v2_id: "$.data.id", v2_planned: "$.data.planned_minutes" } }
          assert:
            - "${gap_44_error} == 'ERR_TECHNICIAN_WINDOW_CONFLICT' returned with HTTP 409 (44-minute gap is inside the buffer)"
            - "the 10:15 window is created: ${v2_id} is a PreventiveVisit in visit_status SCHEDULED"
            - "${v2_planned} == 45"
            - "Technician.${t1_id}.committed_minutes == 135 (90 + 45; the rejected attempt reserved nothing)"
            - "exactly two TechnicianAssignment rows exist for technician_id == ${t1_id}, both in status RESERVED"
            - "the assignment for ${v2_id} has start_at 2026-08-19T10:15:00Z and end_at 2026-08-19T11:00:00Z"
            - "PreventiveVisit.${v1_id}.visit_status == SCHEDULED (untouched)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: part_order_cancel_restores_allowance_and_the_originating_bucket
        grounds:
          - state_machines.PartOrder.ALLOCATED_to_CANCELLED
          - calculations.parts_allowance_invariant
          - calculations.part_inventory_invariant
          - entities.ServiceContract.fields.parts_allowance_remaining_cents
        distinguishing_aspect: |
          Conserved quantities: the contract's parts allowance in cents AND the refurbished stock
          bucket. Cancelling the order must return 19200 cents and put the unit back in the
          REFURBISHED bucket specifically - inflating on_hand_qty instead would keep both totals
          balanced while silently converting a refurbished unit into a new one.
        test_recipe:
          setup:
            - "Clock 2026-08-19T08:00Z; club NORTH, one treadmill, GOLD/FULL contract ACTIVE with a 500000-cent allowance."
            - "PartCatalogEntry BELT-900 (WEAR, unit_price_cents 32000) with on_hand_qty 5 and refurb_on_hand_qty 3."
            - "One MINOR call dispatched to T1 and ON_SITE, then a REFURBISHED hold for 1 unit moves the call to PARTS_HOLD."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T08:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH" }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CI-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/parts", payload: { model_id: "${model_id}", part_number: "BELT-900", category: "WEAR", unit_price_cents: 32000, is_critical_spare: false, initial_on_hand_qty: 5, initial_refurb_qty: 3 }, as: PartsPlanner, captures: { part_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", severity: "MINOR", symptom_code: "BELT_NOISE" }, as: ServiceCoordinator, captures: { call_id: "$.data.id" } }
            - { call: "POST /fleetcare/service-calls/${call_id}/dispatch", payload: { start_at: "2026-08-19T08:00:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_id}/arrive", as: FieldTechnician, as_user_id: "${t1_id}" }
            - { call: "POST /fleetcare/service-calls/${call_id}/parts-hold", payload: { part_id: "${part_id}", qty: 1, source: "REFURBISHED" }, as: FieldTechnician, as_user_id: "${t1_id}", captures: { order_id: "$.data.id", draw_before: "$.data.allowance_draw_cents" } }
            - { call: "GET /fleetcare/parts/${part_id}", as: PartsPlanner, captures: { refurb_after_hold: "$.data.refurb_on_hand_qty", allocated_after_hold: "$.data.allocated_qty" } }
            - { call: "GET /fleetcare/contracts/${c_id}", as: ContractAdministrator, captures: { remaining_after_hold: "$.data.parts_allowance_remaining_cents" } }
          trigger:
            - { call: "POST /fleetcare/part-orders/${order_id}/cancel", payload: { reason: "Wrong belt width ordered" }, as: ServiceCoordinator }
            - { call: "POST /fleetcare/service-calls/${call_id}/resume", as: FieldTechnician, as_user_id: "${t1_id}", captures: { call_status_after_resume: "$.data.status" } }
          assert:
            - "${draw_before} == 19200 and ${remaining_after_hold} == 480800 and ${refurb_after_hold} == 2 and ${allocated_after_hold} == 1"
            - "PartOrder.${order_id}.status == CANCELLED with cancellation_reason == 'Wrong belt width ordered'"
            - "PartOrder.${order_id}.allowance_draw_cents == 0 and club_billable_cents == 0"
            - "ServiceContract.${c_id}.parts_allowance_remaining_cents == 500000 (fully restored)"
            - "ServiceContract.${c_id}.parts_allowance_total_cents == 500000 (the total never moved)"
            - "PartCatalogEntry.${part_id}.refurb_on_hand_qty == 3 (the ORIGINATING bucket is credited)"
            - "PartCatalogEntry.${part_id}.on_hand_qty == 5 (the NEW bucket must NOT be inflated)"
            - "PartCatalogEntry.${part_id}.allocated_qty == 0"
            - "${call_status_after_resume} == 'ON_SITE' (with no ALLOCATED order left, resume no longer raises ERR_UNRESOLVED_PART_ORDER)"

      - name: visit_cancel_returns_the_technician_capacity_minutes
        grounds:
          - state_machines.PreventiveVisit.SCHEDULED_to_CANCELLED
          - state_machines.TechnicianAssignment.RESERVED_to_RELEASED
          - calculations.technician_capacity_invariant
          - calculations.pm_compliance_pct
        distinguishing_aspect: |
          A different conserved quantity - reservable technician MINUTES, not money or stock.
          Cancelling a visit must both release the assignment and give the 90 minutes back, and
          the freed slot must become bookable again; a bookkeeping-only fix that decrements
          committed_minutes without releasing the assignment fails the re-booking step.
        test_recipe:
          setup:
            - "Clock 2026-08-19T07:00Z; club NORTH with max_concurrent_visits 3 and two treadmills, GOLD/FULL contract ACTIVE."
            - "One technician T1 holds V1 on E1 08:00-09:30 and V2 on E2 10:15-11:45 (a legal 45-minute gap), so committed_minutes is 180."
            - "No visit has ever completed or been missed, so pm_compliance_pct is 100.00."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-19T07:00:00Z" }, as: ContractAdministrator }
            - { call: "POST /fleetcare/clubs", payload: { name: "Northside Fitness", region_code: "NORTH", max_concurrent_visits: 3 }, as: ContractAdministrator, captures: { club_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment-models", payload: { manufacturer: "Pacemaster", model_code: "TM-900", category: "TREADMILL", model_year: 2019, pm_interval_hours: 250, expected_service_life_hours: 20000, base_annual_service_cents: 120000 }, as: ContractAdministrator, captures: { model_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CM-1", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e1_id: "$.data.id" } }
            - { call: "POST /fleetcare/equipment", payload: { club_id: "${club_id}", model_id: "${model_id}", serial_number: "SN-CM-2", install_date: "2024-03-01", initial_usage_hours: 500 }, as: ContractAdministrator, captures: { e2_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts", payload: { club_id: "${club_id}", coverage_tier: "GOLD", parts_inclusion: "FULL", pm_visits_per_year: 4, annual_base_cents: 250000, initial_parts_allowance_cents: 500000, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }, as: ContractAdministrator, captures: { c_id: "$.data.id" } }
            - { call: "POST /fleetcare/contracts/${c_id}/activate", as: ContractAdministrator }
            - { call: "POST /fleetcare/technicians", payload: { full_name: "Dana Reyes", region_code: "NORTH", skill_categories: ["TREADMILL"] }, as: ContractAdministrator, captures: { t1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-19T08:00:00Z", window_end: "2026-08-19T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v1_id: "$.data.id" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e2_id}", window_start: "2026-08-19T10:15:00Z", window_end: "2026-08-19T11:45:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v2_id: "$.data.id" } }
            - { call: "GET /fleetcare/technician-assignments", payload: { preventive_visit_id: "${v1_id}" }, as: ContractAdministrator, captures: { a1_id: "$.data[0].id" } }
            - { call: "GET /fleetcare/technicians/${t1_id}", as: ContractAdministrator, captures: { committed_before: "$.data.committed_minutes" } }
          trigger:
            - { call: "POST /fleetcare/preventive-visits/${v1_id}/cancel", payload: { reason: "Club moved the unit off the floor" }, as: ServiceCoordinator }
            - { call: "GET /fleetcare/technicians/${t1_id}", as: ContractAdministrator, captures: { committed_after_cancel: "$.data.committed_minutes" } }
            - { call: "POST /fleetcare/preventive-visits", payload: { contract_id: "${c_id}", equipment_id: "${e1_id}", window_start: "2026-08-19T08:00:00Z", window_end: "2026-08-19T09:30:00Z", technician_id: "${t1_id}" }, as: ServiceCoordinator, captures: { v3_id: "$.data.id" } }
          assert:
            - "${committed_before} == 180"
            - "PreventiveVisit.${v1_id}.visit_status == CANCELLED with cancellation_reason == 'Club moved the unit off the floor'"
            - "TechnicianAssignment.${a1_id}.status == RELEASED with release_reason == 'VISIT_CANCELLED'"
            - "${committed_after_cancel} == 90 (the 90 released minutes are returned)"
            - "the re-booking succeeds: ${v3_id} is a PreventiveVisit in visit_status SCHEDULED on the freed 08:00-09:30 slot"
            - "Technician.${t1_id}.committed_minutes == 180 again (90 for V2 plus 90 for V3)"
            - "exactly three TechnicianAssignment rows exist for ${t1_id}: one RELEASED and two RESERVED"
            - "ServiceContract.${c_id}.pm_visits_completed_count == 0 and pm_visits_missed_count == 0"
            - "ServiceContract.${c_id}.pm_compliance_pct == 100.00 (a cancellation cannot damage compliance)"
