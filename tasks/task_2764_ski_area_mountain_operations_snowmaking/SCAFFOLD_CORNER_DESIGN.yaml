      - name: snowmaking_session_cycles_running_and_paused_more_than_once
        claim_type: cyclic
        grounds:
          - state_machines.SnowmakingSession.RUNNING_to_PAUSED
          - state_machines.SnowmakingSession.PAUSED_to_RUNNING
        excluded_because:
          difficulty_instance: snowmaking_session_running_paused_cycle_accumulates_minutes
          rationale: "The section 1.8 instance traverses RUNNING -> PAUSED -> RUNNING -> COMPLETED and asserts that accumulated_run_minutes sums only the two RUNNING segments (360 of a 420 minute window), which is strictly stronger than a bare loop-traversal claim: it also pins the metered water, the re-read snow_yield_factor on resume and the reservation delta released at completion."

      - name: lift_service_and_mechanical_dimensions_change_independently
        claim_type: parallel
        grounds:
          - state_machines.Lift.OPEN_to_MECH_HOLD
          - state_machines.Lift.INSPECTION_PASSED_to_INSPECTION_FAILED
        excluded_because:
          difficulty_instance: lift_parallel_service_and_mechanical_dimensions_evolve_independently
          rationale: "The section 1.8 instance walks both dimensions through four combined states including the two that a single-dimension implementation cannot represent (CLOSED / INSPECTION_PASSED and WIND_HOLD / INSPECTION_PASSED) and verifies that a failing inspection drives the service dimension to MECH_HOLD with the full terrain cascade while a passing one restores only STANDBY."

      - name: serving_lift_must_be_open_for_a_terrain_area_to_open
        claim_type: guarded_transitions
        grounds:
          - validations[priority=31]
          - errors[ERR_SERVING_LIFT_NOT_OPEN]
          - state_machines.TerrainArea.READY_to_OPEN
        excluded_because:
          difficulty_instance: terrain_open_requires_serving_lift_open
          rationale: "The section 1.8 cross-entity instance already drives the READY -> OPEN decision against a lift in STANDBY, asserts ERR_SERVING_LIFT_NOT_OPEN, then opens the lift and repeats the decision successfully, covering both halves of the guard in one recipe."

  - section: calculations
    instances:
      - name: base_depth_collapses_to_the_latest_reading_per_stake_regardless_of_insert_order
        claim_type: input_set_filtering
        grounds:
          - calculations.terrain_base_depth
          - entities.TerrainArea.fields.base_depth_in
          - entities.TerrainArea.fields.base_depth_stake_count
        distinguishing_aspect: |
          The stake collapse is keyed on measured_at, never on created_at or id. The readings are
          therefore posted out of chronological order on purpose: a 28.0 inch reading measured at 06:00
          is stored first, then a 40.0 inch reading measured at 00:00 for the same stake. The later
          measurement must keep winning, so base_depth_in stays 28.0 and base_depth_stake_count stays 1.
          An implementation that takes the most recently inserted row would report 40.0 and open terrain
          that is actually thin.
        test_recipe:
          setup:
            - "A season with one inspected lift and one terrain area; logical clock 2026-08-01T06:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
          trigger:
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 28.0, measured_at: "2026-08-01T06:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 40.0, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: GroomingLead
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S2", depth_in: 36.0, measured_at: "2026-08-01T03:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: GroomingLead
          assert:
            - "Trigger 1: the area base_depth_in == 28.0 and base_depth_stake_count == 1."
            - "Trigger 3: base_depth_in is still 28.0 and base_depth_stake_count is still 1 - the earlier measurement inserted later did not win."
            - "Trigger 3: GET snow-depth-readings filtered by stake_code S1 reports total_count == 2, so both rows were stored and the collapse happened at read/derivation time."
            - "Trigger 5: base_depth_in == 32.0 ((28.0 + 36.0) / 2 under MEAN_OF_STAKES) and base_depth_stake_count == 2."
            - "GET snow-depth-readings for the area reports total_count == 3 - nothing was overwritten."

      - name: the_forty_eight_hour_lookback_drops_a_stale_stake_and_shrinks_the_count
        claim_type: input_set_filtering
        grounds:
          - calculations.terrain_base_depth
          - entities.SnowDepthReading.fields.measured_at
        distinguishing_aspect: |
          BASE_DEPTH_LOOKBACK_HOURS is 48 and the cutoff is recomputed against the logical clock on
          every re-derivation, so the same stored reading set yields different answers at different
          clocks with no mutation in between. The clock is advanced 49 hours and a new stake is reported:
          the old stake must silently leave the input set, so base_depth_stake_count falls back to 1 and
          the mean is taken over the new stake alone rather than over both.
        test_recipe:
          setup:
            - "An area with one stake (S1, 40.0 in) measured at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/seasons"
              payload: { season_label: "2026-27", base_depth_policy: "MEAN_OF_STAKES", water_right_seasonal_af: 250.000, plant_max_gpm: 6000, snowmaking_kwh_per_af: 620.0, min_patrollers_per_open_area: 2, groom_freshness_hours: 18, energy_windows: [{ code: "OFF_1", start_hour_utc: 0, end_hour_utc: 6, price_usd_per_kwh: 0.062, tier: "OFF_PEAK" }, { code: "MID_1", start_hour_utc: 6, end_hour_utc: 9, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }, { code: "ON_1", start_hour_utc: 9, end_hour_utc: 21, price_usd_per_kwh: 0.187, tier: "ON_PEAK" }, { code: "MID_2", start_hour_utc: 21, end_hour_utc: 24, price_usd_per_kwh: 0.113, tier: "MID_PEAK" }] }
              as: MountainOpsDirector
              captures: { season_id: $.data.id }
            - call: "POST /mountain-ops/lifts"
              payload: { season_id: "${season_id}", lift_code: "L1", name: "Summit Express", lift_type: "DETACHABLE", wind_hold_threshold_mph: 40.0, hourly_capacity_pph: 1800, required_operator_count: 2 }
              as: LiftOpsManager
              captures: { lift_id: $.data.id }
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/terrain-areas"
              payload: { season_id: "${season_id}", serving_lift_id: "${lift_id}", trail_code: "T1", name: "Sunbowl", terrain_class: "BLUE", acres: 18.0, min_open_base_depth_in: 30, avalanche_terrain: false }
              as: MountainOpsDirector
              captures: { area_id: $.data.id }
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S1", depth_in: 40.0, measured_at: "2026-08-01T00:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
          trigger:
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: GroomingLead
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T01:00:00Z" }
              as: MountainOpsDirector
            - call: "POST /mountain-ops/terrain-areas/${area_id}/snow-depth-readings"
              payload: { stake_code: "S2", depth_in: 36.0, measured_at: "2026-08-03T01:00:00Z", density_pct: 10.0, source: "MANUAL_STAKE" }
              as: GroomingLead
            - call: "GET /mountain-ops/terrain-areas/${area_id}"
              payload: {  }
              as: GroomingLead
          assert:
            - "Trigger 1: base_depth_in == 40.0 and base_depth_stake_count == 1."
            - "Trigger 4: base_depth_in == 36.0 and base_depth_stake_count == 1 - S1 measured 49 hours ago is outside the cutoff of 2026-08-01T01:00:00Z."
            - "The S1 reading row is still retrievable through GET snow-depth-readings (total_count == 2); it is excluded from the calculation, not deleted."
            - "A mean over both stakes would have been 38.0, so a missing cutoff is directly visible in the assertion."

      - name: park_risk_exposure_factor_is_exactly_one_at_five_features_and_steps_after
        claim_type: constants_applied
        grounds:
          - calculations.park_risk_score
          - entities.TerrainArea.fields.park_risk_score
          - entities.TerrainArea.fields.park_feature_count
        distinguishing_aspect: |
          EXPOSURE_FREE_FEATURES is a max(0, n - 5) floor, not a discount, so five features carry an
          exposure factor of exactly 1.0 and never less. The four rebuilds walk the interesting points:
          5 features (34.0, no exposure), 6 (46.0 * 1.1 = 50.6, still openable), 7 (70.0 * 1.2 = 84.0,
          now above the 60.0 open limit) and 10 large halfpipes (240.0 * 1.5 = 360.0 clamped to 100.0 by
          the cap that is applied after rounding).
