- section: state_machines
  instances:
  - name: client_initial_state_is_prospect_with_an_unsigned_agreement
    claim_type: initial_state
    grounds: state_machines.Client initial_state PROSPECT; entities.Client.confidentiality_agreement_status
      initial UNSIGNED
    distinguishing_aspect: The household starts in PROSPECT on the placement dimension and UNSIGNED on
      the agreement dimension; no call is needed to reach it.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      trigger:
      - call: POST /clients
        as: PlacementConsultant
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
      asserts:
      - the trigger returns 201 with status == PROSPECT and confidentiality_agreement_status == UNSIGNED
      - the row is immediately readable at GET /clients/{id} as AgencyPrincipal with the same two values
  - name: countersigning_the_agreement_onboards_the_household
    claim_type: valid_transition
    grounds: state_machines.Client PROSPECT -> ONBOARDED via POST /clients/{id}/confidentiality-agreement
      action=COUNTERSIGN; endpoints.POST /clients/{id}/confidentiality-agreement side_effects
    distinguishing_aspect: One call advances two dimensions at once and stamps countersigned_at from the
      logical clock, with version reaching 3 after create, SIGN and COUNTERSIGN.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      trigger:
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      asserts:
      - the trigger returns 200 with status == ONBOARDED and confidentiality_agreement_status == COUNTERSIGNED
      - countersigned_at == 2026-08-01T00:00:00Z and signatory_name == L. Ashworth is still stored
      - version == 3, one increment for the SIGN and one for the COUNTERSIGN
  - name: countersigning_before_the_household_signs_is_an_invalid_transition
    claim_type: invalid_transition
    grounds: state_machines.Client transition COUNTERSIGN precondition confidentiality_agreement_status
      == SIGNED; errors[ERR_INVALID_STATE_TRANSITION]
    distinguishing_aspect: 'The agreement dimension is still UNSIGNED, so the countersign edge does not
      exist yet: 409, not a silent promotion to COUNTERSIGNED.'
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      trigger:
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      asserts:
      - the trigger returns 409 with error_id == ERR_INVALID_STATE_TRANSITION
      - GET /clients/${client_id} as AgencyPrincipal still shows status == PROSPECT, confidentiality_agreement_status
        == UNSIGNED and version == 1
  - name: countersigning_a_second_time_is_refused
    claim_type: idempotency
    grounds: state_machines.Client transition COUNTERSIGN; errors[ERR_INVALID_STATE_TRANSITION]
    distinguishing_aspect: A repeated countersign is refused rather than idempotently accepted, and it
      must not bump the version or restamp countersigned_at.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      trigger:
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      asserts:
      - the trigger returns 409 with error_id == ERR_INVALID_STATE_TRANSITION
      - GET /clients/${client_id} as AgencyPrincipal still shows version == 3 and countersigned_at ==
        2026-08-01T00:00:00Z
  - name: retiring_a_fee_band_twice_hits_the_terminal_lock
    claim_type: terminal_state_lockdown
    grounds: state_machines.FeeSchedule RETIRED terminal; errors[ERR_ENTITY_TERMINAL]
    distinguishing_aspect: RETIRED is terminal, so the second retire is 409 ERR_ENTITY_TERMINAL rather
      than a no-op 200.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: HOUSEKEEPER
          comp_band_floor_cents: 0
          comp_band_ceiling_cents: 15000000
          fee_percent_bps: 2000
          guarantee_window_days: 90
          effective_from: '2026-01-01'
        captures:
          fs_id: $.data.id
      - call: POST /fee-schedules/${fs_id}/retire
        as: AgencyPrincipal
        payload:
          reason: Band replaced.
      trigger:
      - call: POST /fee-schedules/${fs_id}/retire
        as: AgencyPrincipal
        payload:
          reason: Retired again.
      asserts:
      - the trigger returns 409 with error_id == ERR_ENTITY_TERMINAL
      - GET /fee-schedules/${fs_id} as AgencyPrincipal still shows status == RETIRED and version == 2
  - name: a_retired_band_leaves_the_resolution_set
    claim_type: side_effect_execution
    grounds: state_machines.FeeSchedule ACTIVE -> RETIRED side effect (future resolutions ignore it);
      calculations.fee_percent_resolution (ACTIVE bands only); errors[ERR_NO_FEE_SCHEDULE_MATCH]
    distinguishing_aspect: The only band that covered the compensation is retired between scoping and
      finalisation, so resolution finds an empty set and returns 422 instead of pricing off a retired
      band.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      - call: POST /fee-schedules
        as: AgencyPrincipal
        payload:
          role_type: HOUSEKEEPER
          comp_band_floor_cents: 0
          comp_band_ceiling_cents: 15000000
          fee_percent_bps: 2000
          guarantee_window_days: 90
          effective_from: '2026-01-01'
        captures:
          fs_id: $.data.id
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: HOUSEKEEPER
          first_year_compensation_cents: 10000000
          schedule_pattern: FIVE_TWO
        captures:
          req_id: $.data.id
      - call: POST /role-requisitions/${req_id}/scope
        as: PlacementConsultant
        payload:
          scope_note: Live-out housekeeper, five days on two off.
      - call: POST /fee-schedules/${fs_id}/retire
        as: AgencyPrincipal
        payload:
          reason: Band withdrawn mid-search.
      trigger:
      - call: POST /role-requisitions/${req_id}/finalize-scope
        as: PlacementConsultant
        payload:
          note: Fee band resolved.
      asserts:
      - the trigger returns 422 with error_id == ERR_NO_FEE_SCHEDULE_MATCH
      - GET /role-requisitions/${req_id} as PlacementConsultant still shows status == SCOPING with resolved_fee_schedule_id
        == null and provisional_fee_cents == null
  - name: requisition_initial_state_is_draft_with_the_opening_user_stamped
    claim_type: initial_state
    grounds: state_machines.RoleRequisition initial_state DRAFT; endpoints.POST /role-requisitions side_effects
      (stamps created_by_user_id from X-User-ID)
    distinguishing_aspect: The requisition begins in DRAFT with scoping_round 0 and records the opening
      user, which is what the segregation and audit reads later depend on.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
          action: COUNTERSIGN
      trigger:
      - call: POST /role-requisitions
        as: PlacementConsultant
        payload:
          client_id: ${client_id}
          role_type: HOUSEKEEPER
          first_year_compensation_cents: 10000000
          schedule_pattern: FIVE_TWO
      asserts:
      - the trigger returns 201 with status == DRAFT and scoping_round == 0
      - created_by_user_id is non-null and equals the X-User-ID sent on the trigger
      - GET /role-requisitions?status=DRAFT as PlacementConsultant returns total_count == 1
  - name: finalize_scope_from_sourcing_is_refused
    claim_type: invalid_transition
    grounds: state_machines.RoleRequisition transition FINALIZE_SCOPE requires SCOPING; validations.transition_legal_from_current_state;
      errors[ERR_REQUISITION_NOT_SCOPING]
    distinguishing_aspect: Once the requisition is already SOURCING the finalisation edge is gone, and
      the endpoint-specific ERR_REQUISITION_NOT_SCOPING is raised rather than the generic invalid-transition
      id.
    test_recipe:
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        as: AgencyPrincipal
        payload:
          current_utc: '2026-08-01T00:00:00Z'
      - call: POST /clients
        as: AgencyPrincipal
        payload:
          household_name: Ashworth Mews
          primary_contact_email: ops@ashworth.example
          region_code: NY
        captures:
          client_id: $.data.id
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: Client
        payload:
          action: SIGN
          signatory_name: L. Ashworth
      - call: POST /clients/${client_id}/confidentiality-agreement
        as: AgencyPrincipal
        payload:
