        claim_type: conditional_validation
        grounds: ["calculations.misclassification_risk", "errors[ERR_MISCLASSIFICATION_RISK]", "validations[priority=7]"]
        distinguishing_aspect: "Conditional rule: SOW + HOURLY payment basis computes HIGH risk at submit-review; APPROVE fails without rationale and succeeds with risk_override_rationale."
        test_recipe:
          setup: ["engagement SOW with payment_basis HOURLY, submitted for review"]
          setup_api_calls:
            - call: "POST /v1/engagements"
              payload: { title: "Risky SOW", engagement_type: "SOW", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "MILESTONE", duration_months: 12, budget_cents: 5000000 }
