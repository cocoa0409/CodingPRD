  - rule_id: boundary_precision_check
    instances:
      - name: sweep_expires_lot_at_exact_expiry
        grounds:
          - calculations.shelf_life_expiry
          - state_machines.PackagedLot.IN_STOCK_to_EXPIRED
          - entities.PackagedLot.fields.expires_at
        distinguishing_aspect: |
          Time-metric boundary with INCLUSIVE equality on the sweep endpoint: a lot whose
          expires_at exactly equals the sweep clock (2026-05-13T00:00:00Z) expires, while one
          second before (2026-05-12T23:59:59Z) it stays IN_STOCK.
        test_recipe:
          setup:
            - "Batch SPAWNED; cycle rc1 FRUITING at clock 2026-05-08; flush f1 GRADED 60/30/10"
            - "PackagedLot lot1: grade A, 10 units x 1.0 kg, packed_at 2026-05-08T00:00:00Z, expires_at 2026-05-13T00:00:00Z (shelf_life_days 5)"
          setup_api_calls:
            - { call: "POST /api/varieties", payload: { variety_code: "WB1", display_name: "White Button", substrate_recipe: "PHASE_II_COMPOST", target_bioefficiency_pct: 25.0, shelf_life_days: 5, spawn_run_days: 3, casing_days: 2, max_flushes: 3, flush_yield_distribution: [0.5, 0.3, 0.2] }, as: CompostSupervisor, captures: { v_id: $.data.id } }
