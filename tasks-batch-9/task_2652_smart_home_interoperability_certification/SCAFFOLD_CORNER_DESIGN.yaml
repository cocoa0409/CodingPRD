            - "${err_stale} == \"ERR_STALE_SUBMISSION_VERSION\" with HTTP 412 - replaying ${v3} after it was consumed is refused even though the submission is still IN_REVIEW and the operation is otherwise legal"
            - "GET /test-plans?submission_id=${sub_id} returns total_count == 1 immediately after the refusal, TestPlan.${plan1_id}.state is still \"DRAFT\", and the submission's version is still ${v4} - a 412 writes nothing at all"
            - "${v_after_booking} == ${v4} - issuing the plan and booking a bench window write TestPlan, TestSession and TestLaboratory rows but never bump the submission, so the client's view of the submission is still fresh"
            - "POST /test-plans with ${v4} then returns 201 as ${plan2_id} - the version that was current before two unrelated writes is still accepted, which is what proves the guard is per-parent-row and not a global sequence"
            - "That accepted supersession voids TestPlan.${plan1_id} and cancels TestSession.${sess1_id}, and the submission's version is then ${v4} + 1 == 5"

      - name: a_stale_listing_version_blocks_a_firmware_report_that_would_otherwise_reclassify
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[firmware-revision-stale-listing]
          - endpoints[POST /listings/{listing_id}/firmware-revisions]
          - calculations.recertification_classification
          - errors[ERR_STALE_LISTING_VERSION]
