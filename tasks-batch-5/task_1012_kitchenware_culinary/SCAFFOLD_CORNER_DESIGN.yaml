# =============================================================================
# Task 1012 — Kitchenware & Culinary Store
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# =============================================================================
scaffold_corner_design:

  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: store_creation_success
        claim_type: Creation
        grounds: [entities.Store.fields.state_code, endpoints]
        distinguishing_aspect: "POST /stores with name+state_code returns 201 and a Store with server-minted id, version 1, and status defaulting to OPEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Corner Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store: $.data.id, ver: $.data.version }
          assert:
            - "response code == 201"
            - "Store.${store}.status == OPEN"
            - "Store.${store}.version == 1"

      - name: store_create_missing_required_field
        claim_type: Required Fields
        grounds: [entities.Store.fields.state_code, "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /stores omitting the required state_code returns 400 ERR_VALIDATION."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "No State" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_VALIDATION"

      - name: member_get_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_MEMBER_NOT_FOUND]"]
        distinguishing_aspect: "GET /members/{id} for a non-existent UUID returns 404 ERR_MEMBER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /members/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_MEMBER_NOT_FOUND"

      - name: sku_system_fields_generated
        claim_type: System Fields
        grounds: [entities.Sku.fields.reserved_qty, entities.Sku.fields.available_qty]
        distinguishing_aspect: "On sku create, reserved_qty=0 and available_qty=on_hand_qty are server-set regardless of input; version starts at 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /skus"
              payload: { name: "Mandoline", category: "KNIVES", list_price_cents: 4000, on_hand_qty: 12 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
          assert:
            - "Sku.${sku}.reserved_qty == 0"
            - "Sku.${sku}.available_qty == 12"
            - "Sku.${sku}.version == 1"

      - name: member_enroll_defaults
        claim_type: Defaults
        grounds: [entities.Member.fields.tier, entities.Member.fields.wallet_credit_cents]
        distinguishing_aspect: "A newly enrolled member defaults to tier STANDARD, annual_spend_cents 0, pending/earned points 0, wallet_credit_cents 0."
        test_recipe:
          setup: ["one store"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Enr Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
          trigger:
            - call: "POST /members"
              payload: { email: "enr@x.com", full_name: "Enr Ollie", home_store_id: "${store}" }
              as: StoreAssociate
              captures: { mem: $.data.id }
          assert:
            - "Member.${mem}.tier == STANDARD"
            - "Member.${mem}.annual_spend_cents == 0"
            - "Member.${mem}.earned_points == 0"
            - "Member.${mem}.wallet_credit_cents == 0"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: pay_canceled_order_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Order.UNPAID_to_PAID, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Paying a CANCELED order is rejected with ERR_INVALID_STATE (pay requires fulfillment_status RESERVED)."
        test_recipe:
          setup: ["store, member, sku on_hand 5; order created then canceled"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Inv1 Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Spatula", category: "COOKWARE", list_price_cents: 2000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "iv1@x.com", full_name: "Inv One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/cancel"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: cancel_fulfilled_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Order.RESERVED_to_CANCELED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Canceling a FULFILLED (terminal fulfillment) order is rejected with ERR_INVALID_STATE; cancel requires fulfillment_status RESERVED."
        test_recipe:
          setup: ["OPEN store, member, sku; order paid and fulfilled"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Term Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Ladle", category: "COOKWARE", list_price_cents: 3000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "tm1@x.com", full_name: "Term One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "IN_STORE", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /orders/${ord}/cancel"
              payload: {}
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"

      - name: class_cancel_cascades_registrations
        claim_type: Side Effect Execution
        grounds: [state_machines.CookingClass.DRAFT_to_CANCELED, state_machines.ClassRegistration.BOOKED_to_CANCELED]
        distinguishing_aspect: "Canceling an OPEN class with a BOOKED registration cascades that registration to CANCELED and the class to CANCELED."
        test_recipe:
          setup: ["store; class opened; one member BOOKED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Csc Store", state_code: "NY" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /members"
              payload: { email: "cc1@x.com", full_name: "Csc One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /cooking-classes"
              payload: { store_id: "${store}", title: "Bread Basics", station: "HEARTH_BAR", start_at: "2026-07-25T10:00:00Z", end_at: "2026-07-25T12:00:00Z", capacity: 6, price_cents: 5000 }
              as: StoreAssociate
              captures: { cls: $.data.id }
            - call: "POST /cooking-classes/${cls}/open"
              payload: {}
              as: StoreAssociate
            - call: "POST /class-registrations"
              payload: { class_id: "${cls}", member_id: "${mem}" }
              as: PlatformAdmin
              captures: { reg: $.data.id }
          trigger:
            - call: "POST /cooking-classes/${cls}/cancel"
              payload: {}
              as: StoreAssociate
          assert:
            - "CookingClass.${cls}.status == CANCELED"
            - "ClassRegistration.${reg}.status == CANCELED"

      - name: registration_requires_class_open_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.ClassRegistration.null_to_BOOKED, "errors[ERR_CLASS_NOT_OPEN]"]
        distinguishing_aspect: "Registering into a DRAFT (never-opened) class is rejected with ERR_CLASS_NOT_OPEN; a cross-entity state precondition distinct from the temporal/capacity conflicts."
        test_recipe:
          setup: ["store; class created but NOT opened (DRAFT); member"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Drf Store", state_code: "NY" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /members"
              payload: { email: "dr1@x.com", full_name: "Drf One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /cooking-classes"
              payload: { store_id: "${store}", title: "Sauces", station: "DEMO_KITCHEN", start_at: "2026-07-28T10:00:00Z", end_at: "2026-07-28T12:00:00Z", capacity: 6, price_cents: 5000 }
              as: StoreAssociate
              captures: { cls: $.data.id }
          trigger:
            - call: "POST /class-registrations"
              payload: { class_id: "${cls}", member_id: "${mem}" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_CLASS_NOT_OPEN"

      - name: service_ticket_complete_lifecycle
        claim_type: Valid Transition
        grounds: [state_machines.ServiceTicket.SCHEDULED_to_COMPLETED]
        distinguishing_aspect: "A SCHEDULED service ticket transitions to COMPLETED via POST /service-tickets/{id}/complete."
        test_recipe:
          setup: ["store; one KNIFE_SHARPENING ticket SCHEDULED"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Svc Store", state_code: "CA" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /service-tickets"
              payload: { store_id: "${store}", service_type: "KNIFE_SHARPENING", start_at: "2026-07-12T09:00:00Z", end_at: "2026-07-12T09:30:00Z", price_cents: 1500 }
              as: StoreAssociate
              captures: { tk: $.data.id }
          trigger:
            - call: "POST /service-tickets/${tk}/complete"
              payload: {}
              as: StoreAssociate
          assert:
            - "ServiceTicket.${tk}.status == COMPLETED"

  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: order_tax_by_state_ny
        claim_type: Constants Applied
        grounds: [calculations.order_pricing, entities.Store.fields.state_code]
        distinguishing_aspect: "At an NY store (TAX_RATE 0.08) a STANDARD 10000 subtotal yields tax_cents 800 and total_cents 10800."
        test_recipe:
          setup: ["NY store, STANDARD member, sku list 10000"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "NY Store", state_code: "NY" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Roaster", category: "COOKWARE", list_price_cents: 10000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "ny1@x.com", full_name: "NY One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "IN_STORE", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
          assert:
            - "Order.${ord}.tax_cents == 800"
            - "Order.${ord}.total_cents == 10800"

      - name: return_window_expired_rejected
        claim_type: Violation to Error
        grounds: [state_machines.Return.null_to_REQUESTED, "errors[ERR_RETURN_WINDOW_EXPIRED]"]
        distinguishing_aspect: "A return requested 36 days after fulfilled_at (> RETURN_WINDOW_DAYS 30) is rejected with ERR_RETURN_WINDOW_EXPIRED."
        test_recipe:
          setup: ["order fulfilled at 2026-07-05; clock advanced to 2026-08-10 (36 days later)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Win Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Cocotte", category: "COOKWARE", list_price_cents: 20000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "wn1@x.com", full_name: "Win One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id, line: "$.data.lines[0].line_id" }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${ord}", member_id: "${mem}", line_id: "${line}", return_qty: 1, reason: "UNWANTED", refund_destination: "WALLET" }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_RETURN_WINDOW_EXPIRED"

      - name: redeem_points_to_wallet
        claim_type: Correct Result
        grounds: [endpoints, entities.Member.fields.wallet_credit_cents, entities.Member.fields.earned_points]
        distinguishing_aspect: "Redeeming 300 earned points converts to 300 wallet cents: earned_points 300->0 and wallet_credit_cents 0->300."
        test_recipe:
          setup: ["OR store, member fulfilled an order earning 300 points"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Rdm Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Carafe", category: "COFFEE", list_price_cents: 30000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "rd1@x.com", full_name: "Rdm One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /members/${mem}/redeem"
              payload: { points: 300 }
              as: Member
              as_user_id: "${mem}"
          assert:
            - "Member.${mem}.earned_points == 0"
            - "Member.${mem}.wallet_credit_cents == 300"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: order_insufficient_stock_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=8]", "errors[ERR_INSUFFICIENT_STOCK]"]
        distinguishing_aspect: "Ordering 5 units of a sku with available_qty 2 is rejected with 409 ERR_INSUFFICIENT_STOCK."
        test_recipe:
          setup: ["store, member, sku on_hand 2"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Stk Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Cleaver", category: "KNIVES", list_price_cents: 9000, on_hand_qty: 2 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "st1@x.com", full_name: "Stk One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 5 } ] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_STOCK"

      - name: order_discontinued_sku_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=6]", "errors[ERR_DISCONTINUED_SKU]"]
        distinguishing_aspect: "Ordering a DISCONTINUED sku is rejected with 409 ERR_DISCONTINUED_SKU."
        test_recipe:
          setup: ["store, member, sku created with status DISCONTINUED"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Dsc Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Old Model", category: "APPLIANCE", list_price_cents: 12000, on_hand_qty: 5, status: "DISCONTINUED" }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "ds1@x.com", full_name: "Dsc One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
          trigger:
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_DISCONTINUED_SKU"

      - name: redeem_insufficient_points_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=9]", "errors[ERR_INSUFFICIENT_POINTS]"]
        distinguishing_aspect: "Redeeming 100 points when earned_points is 0 is rejected with 422 ERR_INSUFFICIENT_POINTS."
        test_recipe:
          setup: ["store, freshly enrolled member (earned_points 0)"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Pt0 Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /members"
              payload: { email: "pt0@x.com", full_name: "Pt Zero", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
          trigger:
            - call: "POST /members/${mem}/redeem"
              payload: { points: 100 }
              as: Member
              as_user_id: "${mem}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INSUFFICIENT_POINTS"

  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: orders_list_pagination
        claim_type: Listing
        grounds: [endpoints]
        distinguishing_aspect: "GET /orders?member_id=&limit=1 returns a paginated array with total_count 2 and has_more true after two orders exist for the member."
        test_recipe:
          setup: ["store, member, two orders"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Pag Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Timer", category: "APPLIANCE", list_price_cents: 2000, on_hand_qty: 20 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "pg1@x.com", full_name: "Pag One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
          trigger:
            - call: "GET /orders"
              payload: { member_id: "${mem}", limit: 1 }
              as: PlatformAdmin
          assert:
            - "response total_count == 2"
            - "response has_more == true"
            - "response data array length == 1"

      - name: returns_filtered_list_by_order_fk
        claim_type: FK Integrity
        grounds: [entities.Return.fields.order_id, endpoints]
        distinguishing_aspect: "GET /returns?order_id={ord} (FK reverse-reachability) returns exactly the one Return created against that order."
        test_recipe:
          setup: ["fulfilled order with one REQUESTED return"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Fk Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Colander", category: "COOKWARE", list_price_cents: 5000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "fk1@x.com", full_name: "Fk One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id, line: "$.data.lines[0].line_id" }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
            - call: "POST /returns"
              payload: { order_id: "${ord}", member_id: "${mem}", line_id: "${line}", return_qty: 1, reason: "DEFECTIVE", refund_destination: "ORIGINAL" }
              as: StoreAssociate
              captures: { ret: $.data.id }
          trigger:
            - call: "GET /returns"
              payload: { order_id: "${ord}" }
              as: PlatformAdmin
          assert:
            - "response data array length == 1"
            - "response data[0].id == ${ret}"

  # ---------------------------------------------------------------------------
  - section: rbac
    instances:
      - name: rbac_member_cannot_create_store
        claim_type: Unauthorized Operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A Member calling POST /stores (PlatformAdmin-exclusive) is rejected with 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["a member exists to act as"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Seed Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /members"
              payload: { email: "rb1@x.com", full_name: "Rb One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
          trigger:
            - call: "POST /stores"
              payload: { name: "Rogue Store", state_code: "CA" }
              as: Member
              as_user_id: "${mem}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: rbac_associate_cannot_set_clock
        claim_type: Unauthorized Operation
        grounds: [roles, "errors[ERR_UNAUTHORIZED]"]
        distinguishing_aspect: "A StoreAssociate calling POST /_clock/set_current_utc (PlatformAdmin-exclusive) is rejected with 403 ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-06T00:00:00Z" }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_UNAUTHORIZED"

      - name: member_cannot_return_unowned_order
        claim_type: Ownership Denial
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_OWNERSHIP]"]
        distinguishing_aspect: "A Member creating a return against another member's order (X-User-ID != order.member_id) is rejected with 403 ERR_FORBIDDEN_OWNERSHIP."
        test_recipe:
          setup: ["memberA has a fulfilled order; memberB acts"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores"
              payload: { name: "Own Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Griddle", category: "COOKWARE", list_price_cents: 15000, on_hand_qty: 5 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "own_a@x.com", full_name: "Own A", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem_a: $.data.id }
            - call: "POST /members"
              payload: { email: "own_b@x.com", full_name: "Own B", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem_b: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem_a}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 1 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id, line: "$.data.lines[0].line_id" }
            - call: "POST /orders/${ord}/pay"
              payload: {}
              as: StoreAssociate
            - call: "POST /orders/${ord}/fulfill"
              payload: {}
              as: StoreAssociate
          trigger:
            - call: "POST /returns"
              payload: { order_id: "${ord}", member_id: "${mem_b}", line_id: "${line}", return_qty: 1, reason: "UNWANTED", refund_destination: "WALLET" }
              as: Member
              as_user_id: "${mem_b}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_FORBIDDEN_OWNERSHIP"

  # ---------------------------------------------------------------------------
  - section: cross_cutting_concerns
    instances:
      - name: occ_quote_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[special-order-quote-supersede]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A second quote carrying the pre-first-quote version (stale) is rejected with 412 ERR_STALE_VERSION after the first quote advanced SpecialOrder.version."
        test_recipe:
          setup: ["special order created (version 1); first quote issued (version 2)"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Occ Store", state_code: "NY" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /members"
              payload: { email: "oc1@x.com", full_name: "Occ One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /special-orders"
              payload: { member_id: "${mem}", store_id: "${store}", description: "Custom cutting board", estimated_cost_cents: 20000 }
              as: PlatformAdmin
              captures: { so: $.data.id, v0: $.data.version }
            - call: "POST /special-orders/${so}/quote"
              payload: { expected_special_order_version: "${v0}", quoted_total_cents: 22000 }
              as: StoreAssociate
          trigger:
            - call: "POST /special-orders/${so}/quote"
              payload: { expected_special_order_version: "${v0}", quoted_total_cents: 21000 }
              as: StoreAssociate
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_STALE_VERSION"
            - "http status == 412"

      - name: occ_quote_increments_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[special-order-quote-supersede]", entities.SpecialOrder.fields.quote_revision]
        distinguishing_aspect: "A quote with the current expected_special_order_version succeeds, advancing version to 2 and quote_revision to 1."
        test_recipe:
          setup: ["special order created (version 1)"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ver Store", state_code: "NY" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /members"
              payload: { email: "vr1@x.com", full_name: "Ver One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /special-orders"
              payload: { member_id: "${mem}", store_id: "${store}", description: "Engraved decanter", estimated_cost_cents: 30000 }
              as: PlatformAdmin
              captures: { so: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /special-orders/${so}/quote"
              payload: { expected_special_order_version: "${v0}", quoted_total_cents: 31000 }
              as: StoreAssociate
          assert:
            - "SpecialOrder.${so}.version == 2"
            - "SpecialOrder.${so}.quote_revision == 1"
            - "SpecialOrder.${so}.status == QUOTED"

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: order_reservation_immediately_visible
        claim_type: immediate
        grounds: [calculations.sku_inventory, entities.Sku.fields.reserved_qty]
        distinguishing_aspect: "Immediately after order create, GET /skus/{id} reflects reserved_qty 4 and available_qty 6 (on_hand 10) in the same request cycle — no eventual lag."
        test_recipe:
          setup: ["store, member, sku on_hand 10; order of 4 units created"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Imm Store", state_code: "OR" }
              as: PlatformAdmin
              captures: { store: $.data.id }
            - call: "POST /skus"
              payload: { name: "Wok", category: "COOKWARE", list_price_cents: 6000, on_hand_qty: 10 }
              as: PlatformAdmin
              captures: { sku: $.data.id }
            - call: "POST /members"
              payload: { email: "im1@x.com", full_name: "Imm One", home_store_id: "${store}" }
              as: PlatformAdmin
              captures: { mem: $.data.id }
            - call: "POST /orders"
              payload: { member_id: "${mem}", store_id: "${store}", fulfillment_type: "BOPIS", lines: [ { sku_id: "${sku}", qty: 4 } ] }
              as: PlatformAdmin
              captures: { ord: $.data.id }
          trigger:
            - call: "GET /skus/${sku}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Sku.${sku}.reserved_qty == 4"
            - "Sku.${sku}.available_qty == 6"
            - "Sku.${sku}.on_hand_qty == 10"

  # ---------------------------------------------------------------------------
  - section: errors
    instances:
      - name: error_order_not_fulfilled_on_return
        claim_type: Violation to Error
        grounds: ["errors[ERR_ORDER_NOT_FULFILLED]"]
        excluded_because:
          difficulty_instance: return_requires_order_fulfilled
          rationale: "Asserted as the failure path of the named §1.8 cross_entity_state_dependency instance."

      - name: error_class_full_on_registration
        claim_type: Violation to Error
        grounds: ["errors[ERR_CLASS_FULL]"]
        excluded_because:
          difficulty_instance: class_capacity_full_boundary
          rationale: "Full-class rejection is exercised as the boundary in the named §1.8 instance."

      - name: error_store_closed_on_fulfill
        claim_type: Violation to Error
        grounds: ["errors[ERR_STORE_CLOSED]"]
        excluded_because:
          difficulty_instance: fulfill_requires_store_open
          rationale: "Closed-store fulfill rejection is the failure path of the named §1.8 instance."

      - name: error_stale_version_on_quote
        claim_type: Violation to Error
        grounds: ["errors[ERR_STALE_VERSION]"]
        excluded_because:
          difficulty_instance: special_order_quote_revision_cycle
          rationale: "OCC version handling on quote is grounded by the §1.8 cyclic instance; the 412 path is additionally covered by §1.9 occ_quote_stale_version_returns_412."
