            - "PayrollSubmission.${sub_id}.make_whole_underpayment_cents == 40000"
            - "PayrollLine.${line1_id}.required_base_cents == 5000"

      - name: a_cascade_target_is_already_current_on_the_very_next_read
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST /restitution-payments/{id}/disburse
          - endpoints.GET /contractors/{id}
        distinguishing_aspect: "Derived aggregates that live on a different entity than the write are still immediately consistent: the disbursement of 20000 against a 40000 obligation is visible on the contractor's outstanding_restitution_cents and on the finding's balance on the very next read, in the same test, with no settle step. An eventual-consistency implementation that recomputes contractor totals on a schedule would still read 40000 here."
        test_recipe:
          setup:
            - "A SUBMITTED, DEFICIENT week ending 2026-08-01 with one OPEN UNDERPAYMENT finding for 40000 and one PENDING restitution payment of 20000."
          setup_api_calls:
            - call: "POST /reporting-portals"
              payload: { portal_code: "LCPTRACKER_CA", submission_format: "XML_LCP", cutoff_offset_days: 10, grace_hours: 0, requires_notarized_statement: false }
              as: PortalAdmin
              captures: { portal_id: $.data.id }
            - call: "POST /wage-determinations"
              payload: { decision_number: "CA20260014", modification_number: 0, locality_code: "CA-ALAMEDA", effective_date: "2026-01-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { wd_id: $.data.id }
            - call: "POST /wage-determinations/${wd_id}/wage-rates"
              payload: { classification_code: "ELEC-INSIDE-JW", trade_code: "ELEC", zone_code: "BASE", base_hourly_rate_cents: 5000, fringe_hourly_rate_cents: 2000, zone_adjustment_cents: 0, apprentice_scale_pct: [50, 60, 70, 80] }
              as: PortalAdmin
            - call: "POST /wage-determinations/${wd_id}/activate"
              payload: {}
              as: PortalAdmin
            - call: "POST /contractors"
              payload: { legal_name: "Acme Electric", dir_registration_number: "PW-1001" }
              as: PortalAdmin
              captures: { contractor_id: $.data.id }
            - call: "POST /contractors/${contractor_id}/staff"
              payload: { full_name: "Pat Prep", capability: "PREPARER" }
              as: PortalAdmin
              captures: { staff_prep_id: $.data.id }
            - call: "POST /projects"
              payload: { project_name: "Alameda Transit Center", awarding_agency: "City of Alameda", locality_code: "CA-ALAMEDA", zone_code: "BASE", wage_determination_id: "${wd_id}", reporting_portal_id: "${portal_id}", funding_source: "FEDERAL_DAVIS_BACON", contract_award_date: "2026-02-01T00:00:00.000Z" }
              as: PortalAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /projects/${proj_id}/contract-assignments"
              payload: { contractor_id: "${contractor_id}", subcontract_amount_cents: 100000000 }
              as: PortalAdmin
              captures: { ca_id: $.data.id }
            - call: "POST /contract-assignments/${ca_id}/activate"
              payload: {}
              as: PortalAdmin
              captures: { ca_v: $.data.version }
            - call: "POST /projects/${proj_id}/status"
              payload: { to_status: "ACTIVE" }
              as: PortalAdmin
            - call: "POST /contractors/${contractor_id}/staff"
              payload: { full_name: "Cora Cert", capability: "CERTIFIER" }
              as: PortalAdmin
              captures: { staff_cert_id: $.data.id }
            - call: "POST /workers"
              payload: { employer_contractor_id: "${contractor_id}", worker_number: "W-001", full_name: "Jo Journey", default_classification_code: "ELEC-INSIDE-JW" }
              as: PayrollPreparer
              as_user_id: "prep-pat"
              captures: { w1_id: $.data.id }
            - call: "POST /payroll-submissions"
              payload: { contract_assignment_id: "${ca_id}", week_ending_date: "2026-08-01T00:00:00.000Z", prepared_by_staff_id: "${staff_prep_id}", expected_contract_assignment_version: "${ca_v}" }
              as: PayrollPreparer
              as_user_id: "prep-pat"
              captures: { sub_id: $.data.id }
            - call: "POST /payroll-submissions/${sub_id}/lines"
              payload: { worker_id: "${w1_id}", classification_code: "ELEC-INSIDE-JW", straight_hours: 40.00, overtime_hours: 0.00, base_rate_paid_cents: 4000, fringe_cash_paid_cents: 2000 }
              as: PayrollPreparer
              as_user_id: "prep-pat"
            - call: "POST /payroll-submissions/${sub_id}/finalize"
              payload: {}
              as: PayrollPreparer
              as_user_id: "prep-pat"
            - call: "POST /payroll-submissions/${sub_id}/certify"
              payload: {}
              as: CertifyingOfficial
              as_user_id: "${staff_cert_id}"
            - call: "POST /findings"
              payload: { project_id: "${proj_id}", payroll_submission_id: "${sub_id}", worker_id: "${w1_id}", finding_type: "UNDERPAYMENT", severity: "MAJOR", restitution_required_cents: 40000 }
              as: LaborStandardsAuditor
              as_user_id: "auditor-cruz"
              captures: { finding_id: $.data.id }
            - call: "POST /findings/${finding_id}/restitution-payments"
              payload: { worker_id: "${w1_id}", amount_cents: 20000 }
