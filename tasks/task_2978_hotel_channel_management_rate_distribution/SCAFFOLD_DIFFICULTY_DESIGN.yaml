            - "Restriction.${stop_sell_id}.origin == MANUAL and value_nights == null (STOP_SELL carries no night count)"
            - "After the lift: Restriction.${stop_sell_id}.restriction_state == LIFTED with lift_reason == MANUAL_LIFT, and the lift queues one RESTRICTION DistributionBatch with total_jobs == 0 (no VERIFIED mapping exists on KING)"
            - "Second booking attempt, identical payload: HTTP 409 with data.error_id == ERR_OVERBOOKING_CEILING_EXCEEDED (priority 20, category business_fiscal)"
            - "InventoryDay.${inv_id}.committed_units == 0 after both attempts"

  # =====================================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: allotment_exactly_at_overbooking_ceiling_is_accepted_one_more_unit_is_not
        grounds:
          - calculations.allocation_aggregate_capacity_check
          - calculations.inventory_pool_state
          - concurrency_rules[allocation-create-stale-room-type]
          - entities.InventoryDay.fields.overbooking_ceiling_units
        distinguishing_aspect: |
          Boundary on the UNITS metric at POST /distribution/room-types/{id}/allocations: held 6 +
          committed 2 + requested 3 == overbooking_ceiling_units 11 is accepted, and the very next
          single unit (12 > 11) is refused - the comparison is strictly greater, and the aggregate
          mixes held allotment units from one channel with committed room nights from another.
        test_recipe:
          setup:
            - "Property HTL-SFO, room type KING (capacity 10, property overbooking_pct_bp 1000 -> overbooking_ceiling_units 11), inventory days 2026-09-10, 2026-09-11 and 2026-09-12 open."
            - "Channel OTA1 holds an OPEN allotment of 6 units over 2026-09-10..2026-09-12 (unconsumed, because no OTA1 booking exists)."
            - "Channel BRAND holds no allotment, so its two 1-night bookings on 2026-09-11 are POOL draws: committed_units 2 on that date, and neither needed an override because allocated 6 + committed 0 then 1 stayed below capacity 10."
            - "On 2026-09-11 the aggregate is therefore held 6 + committed 2 == 8 with shared_pool_units 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
