  # ===========================================================================
  - section: endpoints
    instances:
      - name: valuation_patch_recomputes_equity_and_needs_an_appraisal_date
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /pace/properties/{id}/valuation]
          - entities.Property.fields.equity_ratio_bps
          - errors[ERR_VALIDATION]
        distinguishing_aspect: |
          The valuation PATCH is the only writer of assessed/market value and it must re-derive
          equity_ratio_bps from the NEW assessed value while the senior lien balance stays put:
          40000000 with a 25000000 lien gives 3750 bps, and the same lien against 50000000 gives
          5000 bps. It must also refuse a market_value_cents update that arrives without
          appraisal_effective_on, because an undated appraisal could otherwise be replayed forever as
          a 'fresh' market basis.
        test_recipe:
          setup:
            - "Clock 2026-08-12; parcel P1 assessed 40000000 with one ACTIVE first-position lien of 25000000, so senior_lien_balance_cents 25000000 and equity_ratio_bps 3750."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-12T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /pace/properties"
              payload: { apn: "06073-118-204-011", county_code: "06073", owner_full_name: "Ada Ruiz", owner_birth_date: "1971-04-09", owner_email: "ada@example.com", occupancy_type: "OWNER_OCCUPIED", assessed_value_cents: 40000000, annual_property_tax_cents: 420000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { p1: $.data.id, equity_before: $.data.equity_ratio_bps }
            - call: "POST /pace/mortgage-liens"
              payload: { property_id: "${p1}", holder_name: "Harbor Federal Savings", lien_position: 1, current_balance_cents: 25000000, recorded_on: "2019-03-14" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { l1: $.data.id }
          trigger:
            - call: "PATCH /pace/properties/${p1}/valuation"
              payload: { market_value_cents: 50000000 }
              as: CountyOfficer
              as_user_id: "u_county"
              captures: { err_undated: $.data.error_id }
            - call: "PATCH /pace/properties/${p1}/valuation"
              payload: { market_value_cents: 50000000, appraisal_effective_on: "2026-06-01" }
              as: CountyOfficer
              as_user_id: "u_county"
              captures: { equity_after_market: $.data.equity_ratio_bps }
            - call: "PATCH /pace/properties/${p1}/valuation"
              payload: { assessed_value_cents: 50000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { equity_after_assessed: $.data.equity_ratio_bps, senior: $.data.senior_lien_balance_cents }
          assert:
            - "The lien creation already recomputed the derived field: equity_before == 10000 at creation and Property.${p1}.equity_ratio_bps == 3750 once lien ${l1} exists"
            - "An undated appraisal is refused: 400 err_undated == 'ERR_VALIDATION' and market_value_cents stays null"
            - "A dated appraisal is accepted (200) but changes no equity, because equity is an ASSESSED-basis figure: equity_after_market == 3750 with market_value_cents == 50000000 and appraisal_effective_on == '2026-06-01'"
            - "Raising the assessed value re-derives equity: equity_after_assessed == 5000 == 10000 - round_half_up(25000000 * 10000 / 50000000), with senior == 25000000 untouched"
            - "PATCH is partial: the earlier market_value_cents 50000000 and appraisal_effective_on '2026-06-01' survive the assessed-only update"

      - name: retiring_a_product_blocks_new_measures_only
