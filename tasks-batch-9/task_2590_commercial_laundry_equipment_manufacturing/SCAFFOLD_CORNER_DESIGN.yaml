        distinguishing_aspect: "90 lb is a perfectly legal ON_PREMISES rating but exceeds the VENDED ceiling of 80, so the band is per product_line rather than global; the rejection is 422 and nothing is stored."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /clm/machine-models"
              payload: { model_code: "VND-90-C", product_line: "VENDED", capacity_rating_lb: 90, rated_water_gal_per_cwt: 0.95, rated_kwh_per_cwt: 0.38, drum_alloy_grade: "AISI_316", payment_module_options: ["COIN"], list_price_cents: 900000 }
