              as: PracticeAdmin
              captures: { fc_lea: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Mira Aranda", contact_role: "ADULT_CHILD" }
              as: PracticeAdmin
              captures: { fc_mira: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Noe Aranda", contact_role: "ADULT_CHILD" }
              as: PracticeAdmin
              captures: { fc_noe: $.data.id }
            - call: "POST /care/family-contacts"
              payload: { client_id: "${cli}", full_name: "Oda Aranda", contact_role: "OTHER" }
              as: PracticeAdmin
              captures: { fc_oda: $.data.id }
            - call: "POST /care/family-conferences"
              payload: { client_id: "${cli}", scheduled_start: "2026-08-24T14:00:00Z", scheduled_end: "2026-08-24T15:00:00Z", invited_contact_ids: ["${fc_lea}", "${fc_mira}", "${fc_noe}", "${fc_oda}"], agenda: "Care plan review" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { conf_a: $.data.id, invited_a: $.data.invited_contact_ids }
            - call: "POST /care/family-conferences"
              payload: { client_id: "${cli}", scheduled_start: "2026-08-26T14:00:00Z", scheduled_end: "2026-08-26T15:00:00Z", invited_contact_ids: ["${fc_lea}", "${fc_mira}", "${fc_noe}", "${fc_oda}"], agenda: "Housing options" }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { conf_b: $.data.id }
          trigger:
            - call: "PATCH /care/family-conferences/${conf_a}/state"
              payload: { to_state: "CONVENED", attended_contact_ids: ["${fc_lea}", "${fc_mira}"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { a_status: $.data.status, a_quorum: $.data.quorum_met, a_attended: $.data.attended_contact_ids }
            - call: "PATCH /care/family-conferences/${conf_b}/state"
              payload: { to_state: "CONVENED", attended_contact_ids: ["${fc_lea}"] }
              as: CareManager
              as_user_id: "${cm_dana}"
              captures: { b_error: $.data.error_id }
          assert:
            - "Conference A returns HTTP 200 with data.status == \"CONVENED\", data.quorum_met == true and len(data.attended_contact_ids) == 2 (2 * 2 == 4 >= 4, surrogate Lea present)"
            - "Conference B returns HTTP 422 with data.error_id == \"ERR_QUORUM_NOT_MET\" (1 * 2 == 2 < 4) even though the single attendee is the surrogate"
            - "FamilyConference.${conf_b}.status is still \"SCHEDULED\" and quorum_met == false"
            - "Client.${cli}.capacity_status == \"PRESUMED_CAPABLE\", so the extra POA_HEALTHCARE/GUARDIAN attendee condition is not evaluated for either conference"

      - name: after_hours_factor_boundaries_at_utc_hours_eight_and_eighteen
        claim_type: constants_applied
