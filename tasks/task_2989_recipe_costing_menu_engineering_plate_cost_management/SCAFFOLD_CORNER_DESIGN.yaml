        distinguishing_aspect: "The RETIRE arm does not consult the verdict: a campaign that closed PROFITABLE still suspends its menu item when the director retires it, the suspension leaves the plate cost FRESH so the item can be reactivated immediately, and the RETIRED campaign is terminal — a follow-up RENEW on it is rejected instead of minting a successor."
