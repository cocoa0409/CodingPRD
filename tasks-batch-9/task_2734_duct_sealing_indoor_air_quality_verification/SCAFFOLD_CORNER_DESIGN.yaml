      - name: complaint_reverts_from_balancing_to_diagnosed_on_out_of_tolerance_reading
        claim_type: cyclic
        grounds:
          - state_machines.ComfortComplaint.BALANCING_to_DIAGNOSED
          - calculations.airflow_balance_deviation
          - entities.ComfortComplaint.fields.rebalance_count
          - entities.AirflowReading.fields.deviation_pct
        distinguishing_aspect: "The BALANCING <-> DIAGNOSED loop: a governing reading at +10.00% is exactly within a 10.00% tolerance, but the next reading on the same room at +15.00% flips within_tolerance false, sends the complaint back to DIAGNOSED and increments rebalance_count to 1."
        test_recipe:
          setup:
            - "Logical clock 2026-08-01T00:00:00Z; project with one comfort complaint on 'Living Room'"
            - "Complaint DIAGNOSED with tolerance_pct 10.00, one reading (seq 1, 132.0 vs design 120.0, deviation +10.00, within tolerance), then balanced -> BALANCING"
          setup_api_calls:
            - call: "POST /duct-sealing/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /duct-sealing/utility-programs"
              payload: { name: "Metro Gas Duct Seal 2026", rebate_basis: "PER_CFM", rate_cents_per_cfm_reduced: 1200, pct_of_invoice_bps: 3000, cap_cents: 500000, annual_budget_cents: 5000000, min_reduction_pct: 80.00, requires_inspector_verification: true, combustion_safety_required: true }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /duct-sealing/technicians"
              payload: { full_name: "Dana Ruiz", license_number: "AS-4417", certification_status: "ACTIVE", certification_expires_at: "2027-06-30T00:00:00Z" }
              as: ProgramAdmin
              captures: { tech1_id: $.data.id }
            - call: "POST /duct-sealing/projects"
              payload: { utility_program_id: "${prog_id}", address_line: "18 Larkspur Ln", conditioned_floor_area_sqft: 2000, gas_appliance_count: 1, invoice_amount_cents: 480000 }
              as: ProgramAdmin
              captures: { proj_id: $.data.id }
            - call: "POST /duct-sealing/comfort-complaints"
              payload: { project_id: "${proj_id}", room_label: "Living Room", complaint_type: "TOO_WARM", reported_by: "homeowner" }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { comp_id: $.data.id }
            - call: "POST /duct-sealing/comfort-complaints/${comp_id}/diagnose"
              payload: { diagnosis_code: "REGISTER_STARVED", tolerance_pct: 10.00 }
              as: FieldTechnician
              as_user_id: "tech-x"
            - call: "POST /duct-sealing/comfort-complaints/${comp_id}/airflow-readings"
              payload: { room_label: "Living Room", reading_seq: 1, measured_cfm: 132.0, design_cfm: 120.0, damper_position_pct: 60.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { dev1: $.data.deviation_pct, ok1: $.data.within_tolerance }
            - call: "POST /duct-sealing/comfort-complaints/${comp_id}/balance"
              payload: { damper_adjustment_note: "opened the living room damper to 60%" }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { comp_status_balancing: $.data.status }
          trigger:
            - call: "POST /duct-sealing/comfort-complaints/${comp_id}/airflow-readings"
              payload: { room_label: "Living Room", reading_seq: 2, measured_cfm: 138.0, design_cfm: 120.0, damper_position_pct: 75.0 }
              as: FieldTechnician
              as_user_id: "tech-x"
              captures: { dev2: $.data.deviation_pct, ok2: $.data.within_tolerance }
          assert:
            - "Setup reading: ${dev1} == 10.00 and ${ok1} == true (abs(10.00) <= 10.00 uses <=, not <)"
            - "${comp_status_balancing} == BALANCING"
            - "Trigger: HTTP 201, ${dev2} == 15.00 and ${ok2} == false"
            - "ComfortComplaint.${comp_id}.status == DIAGNOSED and rebalance_count == 1"
            - "ComfortComplaint.${comp_id}.balanced_room_count == 0 (the governing reading for 'Living Room' is now seq 2)"
            - "ComfortComplaint.${comp_id}.resolved_at == null"
            - "GET /duct-sealing/comfort-complaints/${comp_id}/airflow-readings returns 2 rows"

