            - "trigger step 2: HTTP 200 with release_state == RELEASED, released_by_user_id == qm_carol, hold_reason == null"
            - "VesselCycle.${cyc1_id}.state == DISPOSITIONED with actual_tolling_fee_cents == 11400"
            - "Lot.${lot1_id}.custody_state is still TREATED (release does not ship the pallet)"

  - section: cross-cutting complexity layers
    instances:
      - name: corner_occc_stale_cycle_version_blocks_a_second_load
        claim_type: optimistic_concurrency
