          assert:
            - "${delta_1} == 100 (measured from initial_cycle_count 0) and ${delta_2} == 0 - equality is allowed"
            - "${err} == ERR_NON_MONOTONIC_CYCLE_COUNT with HTTP 422"
            - "${audit_id} is created and ${delta_4} == -50 relative to nothing that matters: the MANUAL_AUDIT row is outside the monotonicity rule and outside every rack count"
            - "${delta_5} == 20 - the predecessor is the 100-cycle DEVICE reading, not the MANUAL_AUDIT row"
            - "${device_total} == 3 - the rejected reading was never stored"

      - name: pagination_bounds_are_rejected_rather_than_clamped
        claim_type: Violation → Error
        grounds:
          - validations.pagination_bounds
          - errors[ERR_INVALID_PAGINATION]
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          limit 0, limit 101 and offset -1 are each errors with HTTP 400 rather than being silently
          clamped to 1, 100 and 0, while limit 100 (the inclusive maximum) succeeds - so the boundary is
          probed on both sides of both ends of the range.
        test_recipe:
          setup:
            - "One customer with two sites, so a successful page can be observed."
          setup_api_calls:
            - call: "POST /warewashing/customers"
              payload: { name: "Harbor Grill Group", sustainability_goal_water_l: 500000 }
              as: AccountManager
              captures: { cust_id: $.data.id }
