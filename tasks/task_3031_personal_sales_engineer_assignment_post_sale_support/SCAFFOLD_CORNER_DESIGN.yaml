              payload: { quote_line_id: "${qline_gtr_id}", engineer_id: "${eng_a_id}", units_requested: 0, preorder_open_at: "2026-09-09T00:00:00Z" }
              as: SalesEngineerOps
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and data.error_id == ERR_ZERO_ALLOCATION_REQUEST"
            - "GET /backorders?quote_line_id=${qline_gtr_id} returns 0 rows"
            - "the reservation created by POST /quotes/${quote_a_id}/reserve is untouched: Quote.${quote_a_id}.status == RESERVED"

      - name: exhausted_repair_rounds_blocks_the_fourth_claim
        claim_type: satisfaction_pass
