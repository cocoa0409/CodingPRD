            - { call: "POST /um/criteria-sets/${cs_id}/guideline-versions", payload: { version_label: "1.0", content: "c", auto_approve_eligible: true, effective_from: "2026-01-01T00:00:00Z" }, as: ClinicalPolicyEditor, captures: { gv: $.data.id } }
